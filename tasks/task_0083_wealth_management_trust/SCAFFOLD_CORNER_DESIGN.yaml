scaffold_corner_design:

  # =========================================================================
  # Entities — creation / retrieval / required fields / defaults / computed
  # =========================================================================
  - section: entities
    instances:
      - name: create_trust_minimal_required_fields_returns_201
        claim_type: Creation
        grounds: [entities.Trust, endpoints]
        distinguishing_aspect: "POST /trusts with name, grantor_id, trust_type returns 201 with status=DRAFT, version=1, principal_balance_cents=0, income_balance_cents=0, gst_exemption_allocated_cents=0."
        test_recipe:
          setup: ["A grantor exists."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Min", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /trusts"
              payload: { name: "Min Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "Response status == 201"
            - "Trust.${trust_id}.status == DRAFT"
            - "Trust.${trust_id}.version == 1"
            - "Trust.${trust_id}.principal_balance_cents == 0 and income_balance_cents == 0"

      - name: create_trust_missing_grantor_id_returns_validation
        claim_type: Required Fields
        grounds: [entities.Trust.fields.grantor_id, "validations[priority=11]"]
        distinguishing_aspect: "POST /trusts omitting required grantor_id is rejected with ERR_VALIDATION (422); grantor_id has source input and no default."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /trusts"
              payload: { name: "No Grantor", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: create_trust_invalid_trust_type_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Trust.fields.trust_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /trusts with trust_type='PERPETUAL' (not in {REVOCABLE, IRREVOCABLE}) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A grantor exists."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Enum", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /trusts"
              payload: { name: "Bad Enum", grantor_id: "${g_id}", trust_type: "PERPETUAL" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: trust_default_flags_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Trust.fields.is_grantor_trust, entities.Trust.fields.capital_gains_to_income]
        distinguishing_aspect: "Omitting is_grantor_trust and capital_gains_to_income applies defaults false/false on the created Trust."
        test_recipe:
          setup: ["A grantor exists."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Def", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /trusts"
              payload: { name: "Default Trust", grantor_id: "${g_id}", trust_type: "REVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id, gt: $.data.is_grantor_trust, cgi: $.data.capital_gains_to_income }
          assert:
            - "Trust.${trust_id}.is_grantor_trust == false"
            - "Trust.${trust_id}.capital_gains_to_income == false"

      - name: get_trust_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /trusts/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "GET /trusts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: beneficiary_is_skip_person_computed_true_for_generation_two
        claim_type: Computed Fields
        grounds: [entities.Beneficiary.fields.is_skip_person, entities.Beneficiary.fields.generation_level]
        distinguishing_aspect: "A beneficiary with generation_level=2 relative to a generation_level=0 grantor has is_skip_person computed true; generation_level=1 is false."
        test_recipe:
          setup: ["A grantor at generation 0 exists."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Skip", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /beneficiaries"
              payload: { full_name: "Grandchild", grantor_id: "${g_id}", generation_level: 2 }
              as: TrustAdmin
              captures: { skip_id: $.data.id, skip_flag: $.data.is_skip_person }
            - call: "POST /beneficiaries"
              payload: { full_name: "Child", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { child_id: $.data.id, child_flag: $.data.is_skip_person }
          assert:
            - "Beneficiary.${skip_id}.is_skip_person == true"
            - "Beneficiary.${child_id}.is_skip_person == false"

      - name: grantor_gst_exemption_remaining_initialized_to_total
        claim_type: Computed Fields
        grounds: [entities.Grantor.fields.gst_exemption_remaining_cents, entities.Grantor.fields.gst_exemption_total_cents]
        distinguishing_aspect: "On creation with gst_exemption_total_cents=5000000, gst_exemption_remaining_cents is computed 5000000 (nothing allocated yet)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - call: "POST /grantors"
              payload: { full_name: "G Pool", generation_level: 0, gst_exemption_total_cents: 5000000 }
              as: TrustAdmin
              captures: { g_id: $.data.id, rem: $.data.gst_exemption_remaining_cents }
          assert:
            - "Grantor.${g_id}.gst_exemption_remaining_cents == 5000000"

      - name: create_amount_zero_rejected_invalid_amount
        claim_type: Type Constraints
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_AMOUNT]", entities.Receipt.fields.amount_cents]
        distinguishing_aspect: "POST /accounts/{id}/receipts with amount_cents=0 is rejected ERR_INVALID_AMOUNT (422); amount_cents must be > 0."
        test_recipe:
          setup: ["A trust with an OPEN account."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Zero", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Zero Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 0, receipt_kind: "INTEREST" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_INVALID_AMOUNT"

  # =========================================================================
  # State Machines — invalid transitions, initial state, terminal lockdown
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_trust_from_draft_skips_funded_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Trust.FUNDED_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /trusts/{id}/activate on a DRAFT (never funded) trust returns ERR_INVALID_STATE (409); ACTIVE requires from=FUNDED."
        test_recipe:
          setup: ["A DRAFT trust (just created, not funded)."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Inv", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Inv Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
          trigger:
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reject_already_rejected_distribution_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Distribution.PROPOSED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Rejecting a distribution already in REJECTED (terminal) returns ERR_INVALID_STATE (409) on the second call; no side effects."
        test_recipe:
          setup: ["ACTIVE trust; one PROPOSED distribution to non-skip Ben A; rejected once."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Rej", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Rej Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 100000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 1000, distribution_kind: "DISCRETIONARY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/reject"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
          trigger:
            - call: "POST /distributions/${dist_id}/reject"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: amend_irrevocable_trust_returns_trust_irrevocable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Trust.ACTIVE_to_AMENDMENT_PENDING, "validations[priority=6]", "errors[ERR_TRUST_IRREVOCABLE]"]
        distinguishing_aspect: "POST /trusts/{id}/amendments on an ACTIVE IRREVOCABLE trust returns ERR_TRUST_IRREVOCABLE (409) — the irrevocable compliance gate fires after the state check passes."
        test_recipe:
          setup: ["ACTIVE IRREVOCABLE trust."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Irr", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Irr" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Irr Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 100000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /trusts/${trust_id}/amendments"
              payload: { set_capital_gains_to_income: true }
              as: Grantor
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_TRUST_IRREVOCABLE"

      - name: post_receipt_to_closed_account_returns_period_frozen
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=10]", "errors[ERR_PERIOD_FROZEN]", state_machines.TrustAccount.OPEN_to_CLOSED]
        distinguishing_aspect: "Posting a receipt to a CLOSED account returns ERR_PERIOD_FROZEN (409); the ledger is frozen after close."
        test_recipe:
          setup: ["ACTIVE trust with a CLOSED account."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Frz", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Frz" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Frz Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 100000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 50000, receipt_kind: "INTEREST" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_PERIOD_FROZEN"

      - name: terminate_trust_with_approved_distribution_returns_unsettled
        claim_type: Precondition Enforcement
        grounds: [state_machines.Trust.ACTIVE_to_TERMINATING, "errors[ERR_UNSETTLED_DISTRIBUTION]"]
        distinguishing_aspect: "POST /trusts/{id}/terminate while a Distribution is APPROVED returns ERR_UNSETTLED_DISTRIBUTION (409); unsettled distributions block termination."
        test_recipe:
          setup: ["ACTIVE trust with one APPROVED distribution to non-skip Ben A (proposer t1, approver t2)."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Uns", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Prop T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Appr T" }
              as: TrustAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Uns Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t2_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 10000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t2_id}"
          trigger:
            - call: "POST /trusts/${trust_id}/terminate"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_UNSETTLED_DISTRIBUTION"

      - name: error_segregation_of_duties_on_approve
        claim_type: Precondition Enforcement
        grounds: [state_machines.Distribution.PROPOSED_to_APPROVED, "validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The proposer trustee approving its own PROPOSED distribution returns ERR_SEGREGATION_OF_DUTIES (409); proposer must differ from approver."
        test_recipe:
          setup: ["ACTIVE trust; one PROPOSED MANDATORY distribution proposed by t1; t1 is also appointed and attempts to approve."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G SoD", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "Solo T" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Ben A", grantor_id: "${g_id}", generation_level: 1 }
              as: TrustAdmin
              captures: { ben_a_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "SoD Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE" }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/receipts"
              payload: { amount_cents: 5000000, receipt_kind: "CONTRIBUTION" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/fund"
              payload: {}
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/activate"
              payload: {}
              as: TrustAdmin
            - call: "POST /accounts/${acct_id}/distributions"
              payload: { beneficiary_id: "${ben_a_id}", amount_cents: 10000, distribution_kind: "MANDATORY", proposer_trustee_id: "${t1_id}" }
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distributions/${dist_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "${t1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # =========================================================================
  # Calculations — input filtering, constants, precision (breadth)
  # =========================================================================
  - section: calculations
    instances:
      - name: dni_excludes_principal_capital_gain_receipt
        claim_type: Input Set Filtering
        grounds: [calculations.distributable_net_income, calculations.principal_income_allocation, entities.TrustAccount.fields.dni_cents]
        distinguishing_aspect: "With capital_gains_to_income=false, a CAPITAL_GAIN receipt (ledger_side PRINCIPAL) is excluded from DNI: account with INTEREST 30000 + CAPITAL_GAIN 70000 yields dni_cents=30000."
        test_recipe:
          setup: ["ACTIVE non-grantor trust, capital_gains_to_income=false; account OPEN with INTEREST 30000 and CAPITAL_GAIN 70000 receipts (plus 1-cent contribution for activation)."]
          setup_api_calls:
            - call: "POST /grantors"
              payload: { full_name: "G Filt", generation_level: 0 }
              as: TrustAdmin
              captures: { g_id: $.data.id }
            - call: "POST /trustees"
              payload: { full_name: "T Filt" }
              as: TrustAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /trusts"
              payload: { name: "Filt Trust", grantor_id: "${g_id}", trust_type: "IRREVOCABLE", capital_gains_to_income: false }
              as: TrustAdmin
              captures: { trust_id: $.data.id }
            - call: "POST /trusts/${trust_id}/trustee-appointments"
              payload: { trustee_id: "${t1_id}", term_start: "2025-01-01T00:00:00.000Z", term_end: "2030-01-01T00:00:00.000Z" }
              as: TrustAdmin
            - call: "POST /trusts/${trust_id}/accounts"
              payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00.000Z", period_end: "2026-01-01T00:00:00.000Z" }
              as: TrustAdmin
