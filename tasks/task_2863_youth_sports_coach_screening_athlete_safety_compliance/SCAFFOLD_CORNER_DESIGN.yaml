  - section: errors
    instances:
      - name: missing_and_unknown_role_headers_are_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope
        distinguishing_aspect: |
          Priority 1 is checked before the endpoint's own role list, so both an absent
          X-User-Role header and a syntactically fine but undeclared role ('Auditor') return
          ERR_UNAUTHENTICATED with HTTP 401 - not the 403 ERR_UNAUTHORIZED that a declared but
          disallowed role would get - and the same request succeeds once a declared role is
          supplied.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
          trigger:
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NONE
              captures: { unauth_no_header: $.data.error_id }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: Auditor
              captures: { unauth_bad_role: $.data.error_id }
            - call: "GET /safesport/clubs/${club_a_id}"
              payload: {}
              as: NgbAdmin
              captures: { auth_ok_id: $.data.id }
          assert:
            - "the first trigger is sent with neither X-User-Role nor X-User-ID present"
            - "${unauth_no_header} == ERR_UNAUTHENTICATED"
            - "the second trigger is sent with X-User-Role: Auditor, which is not one of the six declared roles"
            - "${unauth_bad_role} == ERR_UNAUTHENTICATED"
            - "HTTP status is 401 on both refusals"
            - "${auth_ok_id} == ${club_a_id}"
      - name: every_not_found_error_in_the_catalog_is_reachable
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_CLUB_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_SCREENING_ORDER_NOT_FOUND]
          - errors[ERR_TRAINING_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_TRAINING_COURSE_NOT_FOUND]
          - errors[ERR_COACH_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_INVESTIGATING_BODY_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_INTERIM_MEASURE_NOT_FOUND]
          - errors[ERR_CLUB_AUDIT_NOT_FOUND]
          - errors[ERR_AUDIT_FINDING_NOT_FOUND]
          - errors[ERR_ROOM_STAY_NOT_FOUND]
        distinguishing_aspect: |
          All twelve NOT_FOUND codes must be distinguishable rather than collapsed into one
          generic 404: eleven come from priority 3 on a path-templated id and the twelfth
          (ERR_TRAINING_COURSE_NOT_FOUND) comes from priority 7 on a body-referenced natural
          key, so the course case proves the body-reference branch exists even though
          TrainingCourse has no path-templated endpoint at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with member m_nf exists so the last trigger fails on the course key alone"
            - "the literal 00000000-0000-4000-8000-000000000000 is used as a well-formed id that matches no row"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
