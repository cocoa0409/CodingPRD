            - "RxAuthorization.${rx_id}.status == REQUESTED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_capacity_aggregate_cap_rejects_over_limit
        grounds:
          - validations[priority=17]
          - calculations.coach_active_load
          - entities.Coach.fields.active_member_count
          - entities.Program.fields.coach_max_active_members
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the Coach resource: with coach_max_active_members == 1,
          a coach already holding 1 ACTIVE assignment rejects a second ACTIVE assignment with
          ERR_COACH_CAPACITY_EXCEEDED (overlap measured as the count of assignments in ACTIVE status held by the coach).
        test_recipe:
          setup:
            - "Program coach_max_active_members 1; coach already has one ACTIVE assignment to enrollment A."
            - "A second ACTIVE enrollment B exists, unassigned."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P", coach_max_active_members: 1 }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/coaches", payload: { program_id: "${prog_id}", full_name: "Co", email: "co2@x.com" }, as: ProgramAdmin, captures: { coach_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "MA", email: "ma@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_a: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_a}", weight_kg: 95 }, as: Member, as_user_id: "${mem_a}", captures: { ia_a: $.data.id } }
            - { call: "POST /wm/intake-assessments/${ia_a}/submit", payload: {}, as: Member, as_user_id: "${mem_a}" }
            - { call: "POST /wm/intake-assessments/${ia_a}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${ia_a}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_a}", plan_id: "${plan_id}", intake_assessment_id: "${ia_a}" }, as: ProgramAdmin, captures: { enr_a: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_a}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /wm/coach-assignments", payload: { enrollment_id: "${enr_a}", coach_id: "${coach_id}" }, as: ProgramAdmin, captures: { asg_a: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "MB", email: "mb@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_b: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_b}", weight_kg: 95 }, as: Member, as_user_id: "${mem_b}", captures: { ia_b: $.data.id } }
            - { call: "POST /wm/intake-assessments/${ia_b}/submit", payload: {}, as: Member, as_user_id: "${mem_b}" }
            - { call: "POST /wm/intake-assessments/${ia_b}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${ia_b}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_b}", plan_id: "${plan_id}", intake_assessment_id: "${ia_b}" }, as: ProgramAdmin, captures: { enr_b: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_b}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/coach-assignments", payload: { enrollment_id: "${enr_b}", coach_id: "${coach_id}" }, as: ProgramAdmin, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_COACH_CAPACITY_EXCEEDED"
            - "Coach.${coach_id}.active_member_count == 1"

      - name: billing_period_half_open_overlap_rejects
        grounds:
          - validations[priority=18]
          - entities.Invoice.fields.period_start_utc
          - entities.Invoice.fields.period_end_utc
          - state_machines.Enrollment.CURRENT_to_PAST_DUE
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the Invoice/Enrollment billing resource (DIFFERENT
          from the coach aggregate-capacity rule): a bill-next-cycle whose new period would start before the
          current cycle's exclusive end (clock not advanced past period_end) overlaps and is rejected
          ERR_BILLING_PERIOD_OVERLAP; adjacency at the shared instant would be allowed.
        test_recipe:
          setup:
            - "ACTIVE enrollment, cycle 30 days, cycle-0 period [2026-01-01, 2026-01-31); clock still at 2026-01-01 (inside cycle 0)."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/programs/${prog_id}/clock-set", payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }, as: ProgramAdmin }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m15@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}", cycle_length_days: 30 }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/enrollments/${enr_id}/bill-next-cycle", payload: {}, as: BillingAgent, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_BILLING_PERIOD_OVERLAP"
            - "Enrollment.${enr_id}.cycles_billed == 1"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_refund_credit_conserves_member_balance
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - calculations.invoice_proration
          - entities.Member.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money. Invariant: after withdraw at elapsed 0 days of a 30-day cycle, the
          full unused-day credit equals one whole cycle (daily_rate 200 * 30 == 6000), so
          member.account_balance_cents == proration_credit_cents == 6000 — the forward charge (6000 recurring)
          is exactly offset by its compensating credit, leaving net recurring cost 0 for the unused cycle.
        test_recipe:
          setup:
            - "ACTIVE enrollment plan monthly 6000 no enrollment fee, cycle 30 days, clock unchanged from activation (elapsed 0)."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/programs/${prog_id}/clock-set", payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }, as: ProgramAdmin }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000, enrollment_fee_cents: 0 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m16@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}", cycle_length_days: 30 }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /wm/enrollments/${enr_id}/withdraw", payload: {}, as: ProgramAdmin }
          assert:
            - "Member.${mem_id}.account_balance_cents == 6000"
            - "the final settlement Invoice PRORATION_CREDIT line amount_cents == -6000"

      - name: assign_then_end_conserves_coach_active_load
        grounds:
          - state_machines.CoachAssignment.ACTIVE_to_ENDED
          - calculations.coach_active_load
          - entities.Coach.fields.active_member_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity = coach active-load count. Invariant: assigning a coach
          (active_member_count 0 -> 1) and then ending that assignment (1 -> 0) leaves
          coach.active_member_count back at its pre-assignment value 0 — forward + compensating action net zero.
        test_recipe:
          setup:
            - "Coach with active_member_count 0; one ACTIVE enrollment available."
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${prog_id}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /wm/coaches", payload: { program_id: "${prog_id}", full_name: "Co", email: "co3@x.com" }, as: ProgramAdmin, captures: { coach_id: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${prog_id}", full_name: "M", email: "m17@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mem_id: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mem_id}", weight_kg: 95 }, as: Member, as_user_id: "${mem_id}", captures: { intake_id: $.data.id } }
            - { call: "POST /wm/intake-assessments/${intake_id}/submit", payload: {}, as: Member, as_user_id: "${mem_id}" }
            - { call: "POST /wm/intake-assessments/${intake_id}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${intake_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mem_id}", plan_id: "${plan_id}", intake_assessment_id: "${intake_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /wm/enrollments/${enr_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /wm/coach-assignments", payload: { enrollment_id: "${enr_id}", coach_id: "${coach_id}" }, as: ProgramAdmin, captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /wm/coach-assignments/${asg_id}/end", payload: {}, as: ProgramAdmin }
          assert:
            - "CoachAssignment.${asg_id}.status == ENDED"
            - "Coach.${coach_id}.active_member_count == 0"
