  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: claim_pay_then_reverse_restores_hra_ledger
        grounds:
          - calculations.hra_ledger_conservation
          - calculations.hra_claim_eligible_amount
          - state_machines.ReimbursementClaim.APPROVED_to_PAID
          - state_machines.ReimbursementClaim.PAID_to_REVERSED
        distinguishing_aspect: |
          REVERSE is the exact compensating action for PAY over a five-bucket
          ledger, and the round trip passes through a variant switch that moves
          15000 cents back out of pending_hold before the payment even happens.
          funded_cents 122206 must equal the sum of available_balance_cents,
          pending_hold_cents, substantiated_paid_cents, premium_offset_cents and
          forfeited_cents after every single hop, and after REVERSE
          available_balance_cents must be exactly 122206 again - the pre-claim
          value - even though eligible_cents (15000) differs from
          provisional_eligible_cents (30000), so an implementation that reverses
          the provisional amount overshoots to 137206 and one that forgets to
          release the hold undershoots to 107206.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN with hra_credit_medicare_cents 209500 and carryover_cap_pct 0.5."
            - "Retiree R2 with medicare_status MEDICARE_ENROLLED and a CERTIFIED ELIGIBLE determination for 2027."
            - "HraAccount for (R2, 2027) with covered_months 7 and no prior year account: monthly_credit 17458, annual_credit_cents 122206, carryover_in_cents 0, funded_cents 122206, available_balance_cents 122206, all other buckets 0, status OPEN."
            - "One ReimbursementClaim of expense_category DENTAL_VISION_PREMIUM for submitted_cents 30000 with documentation_reference supplied, created by R2, so it is in status SUBMITTED with provisional_eligible_cents 30000, leaving available_balance_cents 92206 and pending_hold_cents 30000."
            - "Logical clock at 2027-04-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20, premium_grace_period_days: 31, reinstatement_window_days: 60, notice_lead_days: 60 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Walter Nkemelu", birth_date: "1958-03-01", hire_date: "1988-09-01", retirement_date: "2023-03-31", credited_service_months: 402, medicare_status: "MEDICARE_ENROLLED", medicare_part_b_effective_date: "2023-04-01" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r2_id: $.data.id, r2_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r2_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det2_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det2_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /retiree-benefits/hra-accounts"
              payload: { retiree_id: "${r2_id}", plan_year_id: "${py_id}", covered_months: 7 }
              as: HraAdministrator
              as_user_id: "hra-admin-01"
              captures: { hra2_id: $.data.id, hra2_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-10T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/reimbursement-claims"
              payload: { hra_account_id: "${hra2_id}", expense_category: "DENTAL_VISION_PREMIUM", service_date: "2027-03-15", submitted_cents: 30000, documentation_reference: "DV-INV-2027-0315", expected_hra_account_version: "${hra2_v}" }
              as: Retiree
              as_user_id: "${r2_id}"
              captures: { clm_dv_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/reimbursement-claims/${clm_dv_id}/review"
              payload: { decision: "APPROVE" }
              as: HraAdministrator
              as_user_id: "hra-admin-02"
            - call: "POST /retiree-benefits/reimbursement-claims/${clm_dv_id}/settlement"
              payload: { action: "PAY" }
              as: BillingClerk
              as_user_id: "billing-01"
            - call: "POST /retiree-benefits/reimbursement-claims/${clm_dv_id}/settlement"
              payload: { action: "REVERSE" }
              as: BillingClerk
              as_user_id: "billing-01"
          assert:
            - "BASELINE after creation: HraAccount.${hra2_id}.funded_cents == 122206, available_balance_cents == 92206, pending_hold_cents == 30000, substantiated_paid_cents == 0, premium_offset_cents == 0, forfeited_cents == 0 - conservation holds: 122206 == 92206 + 30000"
            - "AFTER APPROVE: ReimbursementClaim.${clm_dv_id}.status == APPROVED with eligible_cents == 15000, from floor(30000 * 5000 / 10000)"
            - "AFTER APPROVE: HraAccount.${hra2_id}.available_balance_cents == 107206 and pending_hold_cents == 15000 - conservation holds: 122206 == 107206 + 15000"
            - "AFTER PAY: ReimbursementClaim.${clm_dv_id}.status == PAID with paid_at == 2027-04-10T00:00:00.000Z"
            - "AFTER PAY: HraAccount.${hra2_id}.pending_hold_cents == 0, substantiated_paid_cents == 15000 and available_balance_cents is UNCHANGED at 107206 - conservation holds: 122206 == 107206 + 15000"
            - "AFTER REVERSE: ReimbursementClaim.${clm_dv_id}.status == REVERSED"
            - "AFTER REVERSE: HraAccount.${hra2_id}.substantiated_paid_cents == 0 and available_balance_cents == 122206, exactly the pre-claim value"
            - "AFTER REVERSE: pending_hold_cents == 0, premium_offset_cents == 0 and forfeited_cents == 0 - conservation holds: 122206 == 122206 + 0 + 0 + 0 + 0"
            - "AFTER REVERSE: available_balance_cents is NOT 137206, so the reversal restored eligible_cents 15000 and not provisional_eligible_cents 30000"
            - "HraAccount.${hra2_id}.funded_cents is still 122206; no hop ever changed it"

      - name: election_approve_then_terminate_restores_enrolled_count
        grounds:
          - calculations.enrollment_headcount_conservation
          - state_machines.ElectionEvent.UNDER_REVIEW_to_APPROVED
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - entities.PlanOption.fields.enrolled_count
        distinguishing_aspect: |
          A structurally different invariant on a different pair of entities: a
          denormalized counter on the parent PlanOption versus the actual child
          Enrollment row set. The APPROVE decision is the forward +1 and
          terminate is the compensating -1, and a second retiree is enrolled and
          left ACTIVE throughout so the counter must return to 1, not to 0 - an
          implementation that recomputes by resetting or that decrements only
          the plan-year total is caught. Conservation is asserted at both levels,
          per PlanOption and summed across the plan year.
        test_recipe:
          setup:
            - "PlanYear 2027 status OPEN, PlanOption PRE65-CORE ACTIVE with enrolled_count 0, plus a second ACTIVE option EXCH-HRA with enrolled_count 0."
            - "Retirees R1 and R4 both hold CERTIFIED ELIGIBLE determinations for 2027."
            - "R4 already holds an ACTIVE Enrollment on PRE65-CORE, so PRE65-CORE.enrolled_count is 1 before the trigger."
            - "ElectionEvent ee1 for R1 on PRE65-CORE is in status UNDER_REVIEW."
            - "Logical clock at 2027-01-05T00:00:00Z, after coverage_start, so a new enrollment becomes ACTIVE immediately."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
