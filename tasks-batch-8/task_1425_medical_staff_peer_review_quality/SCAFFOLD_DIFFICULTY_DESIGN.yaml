# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is executable from
# empty-DB via its setup_api_calls chain. Default logical clock at server
# start is 2026-08-01T00:00:00Z (see POST /peer-review/_clock/set_current_utc).
scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rating_severity_precedence_vs_majority_variant
        grounds:
          - calculations.committee_rating_aggregation
          - state_machines.ReviewCase.DELIBERATION_to_NOTIFIED
        distinguishing_aspect: |
          Entity domain = Deliberation/ReviewCase rating. Identical submitted
          scores C=[1,5,5], O=[] produce UNACCEPTABLE under the pinned
          severity-precedence mapping but APPROPRIATE under the documented
          majority_vote_rating variant; the server MUST apply the pinned rule.
        test_recipe:
          setup:
            - "Subject provider (SURGERY), CHAIR member A, members B/C/D seated"
            - "Case screened in; B, C, D assigned (OCC chain); B submits 1, C submits 5, D submits 5; case auto-enters DELIBERATION"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj One", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INCIDENT_REPORT", referred_at: "2026-07-20T00:00:00Z", description: "Post-op care concern" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 1, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: { rationale_note: "one unacceptable vote controls" }, as: CommitteeMember, as_user_id: "${m_a}", captures: { rating: $.data.rating } }
            - { call: "GET /peer-review/cases/${case1}/notifications", as: QualityDirector, captures: { notif_deadline: "$.data[0].response_deadline", notif_sent: "$.data[0].sent_at" } }
          assert:
            - "finalize response rating == 'UNACCEPTABLE' (pinned severity-precedence rule: any care score == 1)"
            - "rating != 'APPROPRIATE', which the majority_vote_rating variant would produce for identical C=[1,5,5]"
            - "GET /peer-review/cases/${case1} -> status == 'NOTIFIED'"
            - "ProviderNotification sent_at == '2026-08-01T00:00:00Z' and response_deadline == '2026-08-15T00:00:00Z' (sent_at + 14 days exactly)"

      - name: trend_case_mean_vs_score_mean_variant
        grounds:
          - calculations.provider_trend_metrics
          - state_machines.ReviewCase.NOTIFIED_to_CLOSED
        distinguishing_aspect: |
          Entity domain = Provider quality trend (distinct from the
          Deliberation rating domain of the sibling instance). Two closed
          cases with scores (3,3,3) and (3,3,2) yield pinned case-mean 2.84
          versus 2.83 under the documented score_mean_trend variant.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D"
            - "Case1 scores (3,3,3) -> NOTIFIED; Case2 scores (3,3,2) -> NOTIFIED (all assignments complete before any resolution, so no AUTO_CASE_RESOLVED conflicts block case2 assignment)"
            - "Clock advanced to 2026-08-16T00:00:00Z (past both response deadlines)"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Two", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "PATIENT_COMPLAINT", referred_at: "2026-07-20T00:00:00Z", description: "case one" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg1_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg1_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg1_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg1_b}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg1_c}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg1_d}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: { rationale_note: "clean" }, as: CommitteeMember, as_user_id: "${m_a}" }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "STAFF_REFERRAL", referred_at: "2026-07-21T00:00:00Z", description: "case two" }, as: PeerReviewCoordinator, captures: { case2: $.data.id } }
            - { call: "POST /peer-review/cases/${case2}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case2}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg2_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case2}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg2_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case2}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg2_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg2_b}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg2_c}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg2_d}/submit", payload: { care_appropriateness_score: 2, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/cases/${case2}/finalize-deliberation", payload: { rationale_note: "minor ofi" }, as: CommitteeMember, as_user_id: "${m_a}" }
            - { call: "POST /peer-review/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/close-no-response", as: QualityDirector }
            - { call: "GET /peer-review/providers/${p_sub}/quality-trend", as: QualityDirector, captures: { avg1: $.data.avg_care_appropriateness, cnt1: $.data.rated_case_count, trig1: $.data.focused_review_would_trigger } }
            - { call: "POST /peer-review/cases/${case2}/close-no-response", as: QualityDirector }
            - { call: "GET /peer-review/providers/${p_sub}/quality-trend", as: QualityDirector, captures: { avg2: $.data.avg_care_appropriateness, cnt2: $.data.rated_case_count, trig2: $.data.focused_review_would_trigger, focus_id: $.data.active_focused_review_id } }
          assert:
            - "after case1 close: rated_case_count == 1 and avg_care_appropriateness == 3.00 and focused_review_would_trigger == false"
            - "after case2 close: rated_case_count == 2 and avg_care_appropriateness == 2.84 (case-mean of rounded per-case means (3.00+2.67)/2 = 2.835 -> 2.84)"
            - "avg != 2.83, the score_mean_trend variant result (17/6 = 2.8333 -> 2.83); the variant is never applied"
            - "active_focused_review_id is non-null after case2 close (avg 2.84 < 3.0 crossed the trigger)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rating_multi_input_branch_precedence
        grounds:
          - calculations.committee_rating_aggregation
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (three care scores plus the OFI
          multiset) and nested conditional branches evaluated in pinned
          precedence order. C=[2,4,4], O=[4,4] reaches rule 2 via the OFI
          branch (count(o>=4) >= 2) even though the care-count branch
          (count(c<=2) >= 2) does not fire; result MAJOR_OFI, not MINOR_OFI.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D; case screened in; B/C/D assigned"
            - "B submits care 2 + ofi 4; C submits care 4 + ofi 4; D submits care 4 with no ofi"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Three", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INSURER_INQUIRY", referred_at: "2026-07-20T00:00:00Z", description: "ofi case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 2, ofi_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, ofi_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: { rationale_note: "ofi branch" }, as: CommitteeMember, as_user_id: "${m_a}", captures: { rating: $.data.rating } }
          assert:
            - "finalize response rating == 'MAJOR_OFI': rule 2 fires through the OFI branch count(o in O : o >= 4) == 2"
            - "count(c <= 2) == 1 alone would only reach rule 3 (MINOR_OFI); the OFI branch preempts it inside rule 2's OR"
            - "rating != 'MINOR_OFI' and != 'UNACCEPTABLE'"

      - name: trend_nested_rounding_order_pinned
        grounds:
          - calculations.provider_trend_metrics
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-case-mean-then-average (2.84) over average-raw-then-round
          (2.83) for cases (3,3,3) and (3,3,2); the two orders diverge in
          the second decimal.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D"
            - "Case1 scores (3,3,3) -> NOTIFIED; case2 scores (3,3,2) -> NOTIFIED; clock at 2026-08-16T00:00:00Z"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Four", specialty: "ANESTHESIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "ANESTHESIOLOGY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "round case one" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg1_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg1_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg1_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg1_b}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg1_c}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg1_d}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: {}, as: CommitteeMember, as_user_id: "${m_a}" }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-22T00:00:00Z", description: "round case two" }, as: PeerReviewCoordinator, captures: { case2: $.data.id } }
            - { call: "POST /peer-review/cases/${case2}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case2}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg2_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case2}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg2_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case2}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg2_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg2_b}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg2_c}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case2}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg2_d}/submit", payload: { care_appropriateness_score: 2, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/cases/${case2}/finalize-deliberation", payload: {}, as: CommitteeMember, as_user_id: "${m_a}" }
            - { call: "POST /peer-review/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: QualityDirector }
            - { call: "POST /peer-review/cases/${case1}/close-no-response", as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/cases/${case2}/close-no-response", as: QualityDirector }
            - { call: "GET /peer-review/providers/${p_sub}/quality-trend", as: QualityDirector, captures: { avg: $.data.avg_care_appropriateness } }
          assert:
            - "avg_care_appropriateness == 2.84, computed as round_half_up((round_half_up(9/3,2) + round_half_up(8/3,2))/2, 2) = round_half_up((3.00+2.67)/2, 2)"
            - "avg != 2.83, the result of averaging raw sums first: round_half_up((3.0 + 2.66667)/2, 2) = 2.83; the pinned rounding order is per-case first"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_cyclic_deactivate_reactivate
        grounds:
          - state_machines.CommitteeMember.ACTIVE_to_INACTIVE
          - state_machines.CommitteeMember.INACTIVE_to_ACTIVE
        distinguishing_aspect: |
          CommitteeMember machine is cyclic (ACTIVE -> INACTIVE -> ACTIVE);
          the loop preserves reliability_completed_count and does not
          un-waive previously WAIVED assignments.
        test_recipe:
          setup:
            - "Subject provider; members B and C; case screened in; B assigned (case ASSIGNED)"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Five", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INCIDENT_REPORT", referred_at: "2026-07-20T00:00:00Z", description: "cycle case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
          trigger:
            - { call: "POST /peer-review/committee-members/${m_b}/deactivate", as: QualityDirector, captures: { st1: $.data.status } }
            - { call: "GET /peer-review/assignments/${asg_b}", as: QualityDirector, captures: { asg_st: $.data.status } }
            - { call: "POST /peer-review/committee-members/${m_b}/activate", as: QualityDirector, captures: { st2: $.data.status } }
            - { call: "GET /peer-review/assignments/${asg_b}", as: QualityDirector, captures: { asg_st2: $.data.status } }
          assert:
            - "after deactivate: member status == 'INACTIVE' and assignment ${asg_b} status == 'WAIVED' (cascade)"
            - "after activate: member status == 'ACTIVE' (cycle completed)"
            - "assignment ${asg_b} status remains 'WAIVED' after reactivation — no retroactive un-waiver"
            - "member reliability_completed_count == 0 throughout (no submissions occurred)"

      - name: case_branching_screen_and_terminal_forks
        grounds:
          - state_machines.ReviewCase.REFERRED_to_SCREENED_OUT
          - state_machines.ReviewCase.DELIBERATION_to_EXTERNAL_REVIEW
        distinguishing_aspect: |
          ReviewCase machine is branching: the REFERRED fork diverges to
          SCREENED_IN vs SCREENED_OUT (latter arms the referral cooldown and
          stamps screened_out_reason), and the terminal fork diverges to
          CLOSED vs EXTERNAL_REVIEW (latter creates an ExternalReferral
          record) — divergent side-effect sets per branch on one entity.
        test_recipe:
          setup:
            - "Subject provider; members B/C/D; caseA freshly REFERRED; caseB driven to DELIBERATION with scores (4,4,4)"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Six", specialty: "EMERGENCY_MEDICINE" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "EMERGENCY_MEDICINE" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "branch case A" }, as: PeerReviewCoordinator, captures: { case_a: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "STAFF_REFERRAL", referred_at: "2026-07-21T00:00:00Z", description: "branch case B" }, as: PeerReviewCoordinator, captures: { case_b: $.data.id } }
            - { call: "POST /peer-review/cases/${case_b}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case_b}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case_b}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case_b}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case_b}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case_b}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case_b}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case_b}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case_b}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
          trigger:
            - { call: "POST /peer-review/cases/${case_a}/screen", payload: { decision: "SCREEN_OUT", screened_out_reason: "FRIVOLOUS" }, as: QualityDirector, captures: { a_status: $.data.status, a_reason: $.data.screened_out_reason } }
            - { call: "POST /peer-review/cases/${case_a}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { err: $.data.error_id } }
            - { call: "POST /peer-review/cases/${case_b}/refer-external", payload: { reason: "committee split; outside expertise needed" }, as: QualityDirector, captures: { ref_at: $.data.referred_at } }
            - { call: "GET /peer-review/cases/${case_b}/external-referrals", as: QualityDirector, captures: { ref_count_id: "$.data[0].id" } }
          assert:
            - "caseA screen response status == 'SCREENED_OUT' with screened_out_reason == 'FRIVOLOUS' and screened_out_at == '2026-08-01T00:00:00Z'"
            - "second screen on caseA rejected: error_id == 'ERR_ALREADY_TERMINAL' (SCREENED_OUT is terminal)"
            - "caseB status == 'EXTERNAL_REVIEW' after refer-external; GET external-referrals returns exactly 1 record with referred_at == '2026-08-01T00:00:00Z'"
            - "branch side-effect sets diverge: SCREENED_OUT created no ExternalReferral; EXTERNAL_REVIEW created no screened_out_reason"

      - name: assignment_fork_submit_vs_waive_side_effects
        grounds:
          - state_machines.ReviewAssignment.PENDING_to_SUBMITTED
          - state_machines.ReviewAssignment.PENDING_to_WAIVED
        distinguishing_aspect: |
          ReviewAssignment machine forks from PENDING: SUBMITTED increments
          reliability and advances the case; WAIVED (via deactivation
          cascade) frees the cap slot without touching reliability — the two
          branches carry disjoint side-effect sets.
        test_recipe:
          setup:
            - "Subject provider; members B/C/D/E; case with B, C, D assigned (case ASSIGNED)"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Seven", specialty: "OBSTETRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "OBSTETRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev E", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_e: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_e}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_e: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INCIDENT_REPORT", referred_at: "2026-07-20T00:00:00Z", description: "fork case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
          trigger:
            - { call: "POST /peer-review/committee-members/${m_d}/deactivate", as: QualityDirector }
            - { call: "GET /peer-review/assignments/${asg_d}", as: QualityDirector, captures: { d_status: $.data.status } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version, case_status: $.data.status } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_e}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_e: $.data.id, e_seq: $.data.sequence } }
            - { call: "GET /peer-review/committee-members/${m_b}", as: QualityDirector, captures: { b_rel: $.data.reliability_completed_count } }
            - { call: "GET /peer-review/committee-members/${m_d}", as: QualityDirector, captures: { d_rel: $.data.reliability_completed_count } }
          assert:
            - "SUBMITTED branch: member B reliability_completed_count == 1; case status == 'IN_REVIEW'"
            - "WAIVED branch: assignment ${asg_d} status == 'WAIVED'; member D reliability_completed_count == 0 (waiver is not a submission)"
            - "freed slot refilled: assignment ${asg_e} created with sequence == 4 (sequences 1..3 consumed, never reused)"
            - "case status remains 'IN_REVIEW' after waiver and refill (waiver causes no status regression)"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_after_response_depth3_focus_cascade
        grounds:
          - state_machines.ReviewCase.COMMITTEE_REVIEW_to_CLOSED
          - calculations.provider_trend_metrics
          - calculations.focused_review_trigger_evaluation
        distinguishing_aspect: |
          Depth-3 chain triggered by finalize-after-response: (1) case ->
          CLOSED causes (2) provider_trend_metrics recompute +
          focused_review_trigger_evaluation, which itself causes (3)
          AUTOMATIC FocusedReview creation. Each link is caused by the
          previous link, not by the original request.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D; case scored (2,2,4) -> MAJOR_OFI at finalize -> NOTIFIED"
            - "Provider responds within the deadline; CHAIR marks committee-review; case in COMMITTEE_REVIEW"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Eight", specialty: "PSYCHIATRY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PSYCHIATRY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "PATIENT_COMPLAINT", referred_at: "2026-07-20T00:00:00Z", description: "cascade case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 2, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 2, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: { rationale_note: "two low votes" }, as: CommitteeMember, as_user_id: "${m_a}", captures: { pre_rating: $.data.rating } }
            - { call: "POST /peer-review/cases/${case1}/response", payload: { response_text: "context for the committee" }, as: Provider, as_user_id: "${p_sub}" }
            - { call: "POST /peer-review/cases/${case1}/committee-review", payload: {}, as: CommitteeMember, as_user_id: "${m_a}" }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/finalize-after-response", payload: { reconsideration_note: "rating stands" }, as: CommitteeMember, as_user_id: "${m_a}", captures: { final_rating: $.data.rating } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_status: $.data.status, case_basis: $.data.closure_basis } }
            - { call: "GET /peer-review/providers/${p_sub}/focused-reviews", as: QualityDirector, captures: { fr_type: "$.data[0].trigger_type", fr_snap_count: "$.data[0].trigger_snapshot", fr_id: "$.data[0].id" } }
            - { call: "GET /peer-review/committee-members/${m_b}/conflict-declarations", as: QualityDirector, captures: { cd_src: "$.data[0].source" } }
          assert:
            - "finalize-after-response rating == 'MAJOR_OFI' (recomputed over current scores (2,2,4)); case status == 'CLOSED' with closure_basis == 'POST_RESPONSE'"
            - "link 3 consequence: exactly one FocusedReview for ${p_sub} with trigger_type == 'AUTOMATIC' and trigger_snapshot == { window_start: '2025-08-01T00:00:00Z', window_end: '2026-08-01T00:00:00Z', rated_case_count: 1, avg_care_appropriateness: 2.67, major_ofi_case_count: 1, unacceptable_case_count: 0 }"
            - "case-resolution cascade: member B has a ConflictDeclaration vs ${p_sub} with source == 'AUTO_CASE_RESOLVED' (same for C and D)"
            - "the intermediate link is observable: the FocusedReview exists only because the case CLOSED and the recomputed metrics breached major_ofi_case_count >= 1"

      - name: third_submit_depth2_deliberation_cascade
        grounds:
          - state_machines.ReviewCase.IN_REVIEW_to_DELIBERATION
          - state_machines.ReviewAssignment.PENDING_to_SUBMITTED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: the third distinct submit
          (link 1) flips the case IN_REVIEW -> DELIBERATION, and that state
          entry itself (link 2) creates the OPEN Deliberation row. Distinct
          originating transition from the finalize-after-response cascade.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D; case with B/C/D assigned; B and C already submitted (case IN_REVIEW, one submission away from the deliberation threshold)"
          setup_api_calls:
