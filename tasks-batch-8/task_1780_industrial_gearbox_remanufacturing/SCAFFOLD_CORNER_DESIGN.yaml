  - section: calculations
    instances:
      - name: freight_overweight_tier_uses_ceil
        claim_type: correct_result
        grounds: ["calculations.freight_charge"]
        distinguishing_aspect: "2600kg: base = 120000 + ceil(600/500)*18000 = 156000; plus 6 rigging hours 57000 → 213000. The ceil tier boundary math is pinned."
        test_recipe:
          setup: ["Order exists (INTAKE)"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Heavy Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-HV", model: "HZ-900", rated_torque_nm: 30000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 2600, rigging_bay_date: "2026-08-21", rigging_bay_hours: 6 }
              as: IntakeCoordinator
              captures: { ship_id: $.data.id }
          assert:
            - "FreightShipment.${ship_id}.freight_charge_cents == 213000"

