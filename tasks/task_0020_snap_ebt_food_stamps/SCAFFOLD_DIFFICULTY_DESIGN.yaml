          setup:
            - "Clock: 2026-09-01T00:00:00Z"
            - "Household HH PENDING size=1 state_code=NC"
            - "Member M ABAWD (age 30, non-disabled, no children)"
            - "ABAWDWaiver W for M, quarter 2026-Q3, county_unemployment_pct=10.00, monthly_work_hours=0, status PENDING"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PolicyAdmin
