              as: DistrictAdmin
              captures: { pa: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-N", referral_type: "INITIAL", primary_language: "en", interpreter_required: false, bilingual_evaluation_required: false, requested_domains: ["ADAPTIVE"], intervention_team_summary: "tier 3 adaptive" }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-N-1" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
            - call: "GET /psych-services/evaluations/${eval1}"
              payload: {}
              as: PsychServicesSupervisor
              captures: { ver1: $.data.version }
            - call: "POST /psych-services/evaluations/${eval1}/assign"
              payload: { expected_evaluation_version: "${ver1}", psychologist_id: "${pa}" }
              as: PsychServicesSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/timeline-exclusions"
              payload: { evaluation_id: "${eval1}", exclusion_type: "BREAK_CLOSURE", start_date: "2026-09-30", end_date: "2026-10-05", claim_note: "Autumn closure straddling the due date" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
              captures: { excl_a: $.data.id }
            - call: "POST /psych-services/timeline-exclusions/${excl_a}/decision"
              payload: { decision: "APPROVE" }
              as: PsychServicesSupervisor
            - call: "POST /psych-services/timeline-exclusions"
              payload: { evaluation_id: "${eval1}", exclusion_type: "BREAK_CLOSURE", start_date: "2026-10-01", end_date: "2026-10-06", claim_note: "Closure entirely after the due date" }
              as: SchoolPsychologist
              as_user_id: "${pa}"
              captures: { excl_b: $.data.id }
          trigger:
            - call: "POST /psych-services/timeline-exclusions/${excl_b}/decision"
              payload: { decision: "APPROVE" }
              as: PsychServicesSupervisor
          assert:
            - "TimelineExclusion.${excl_a}.days_claimed == 6 and days_credited == 1 (overlap is the single day 2026-09-30) and status == APPROVED"
            - "Evaluation.${eval1}.credited_exclusion_days == 1 and statutory_due_date == \"2026-10-01\""
            - "TimelineExclusion.${excl_b}.days_claimed == 6"
            - "The trigger returns HTTP 422 with error_id == ERR_EXCLUSION_ZERO_DAYS — overlap_days == 0 against the closed base window [2026-08-01, 2026-09-30]"
            - "An implementation that intersected against the already-extended statutory_due_date 2026-10-01 would credit 1 day and return 200; that is wrong"
            - "TimelineExclusion.${excl_b}.status is still CLAIMED with days_credited == 0, and Evaluation.${eval1}.credited_exclusion_days is still 1"

  - rule_id: cross_entity_state_dependency
