# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Planned Giving & Bequest Administration — 9 rules x >=2 instances = 21
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: crat_vs_crut_payment_divergence
        grounds:
          - calculations.annuity_payment_amount
          - calculations.actuarial_liability_revaluation
          - entities.GiftAgreement.fields.annual_annuity_cents
        distinguishing_aspect: |
          Same inputs (gift 10000000, payout 600bps, QUARTERLY, age 80) produce
          payment amounts that diverge ONLY by vehicle: CRT_ANNUITY payments stay
          frozen at 150000 after a corpus update, while CRT_UNITRUST payments move
          to 180000 — FIXED_AT_FUNDING vs ANNUALLY_REVALUED variants on the
          GiftAgreement/AnnuityPayment domain.
        test_recipe:
          setup:
            - "Donor D; ACTIVE 5% rate table open-ended from 2026-01-01"
            - "CRAT agreement and CRUT agreement for D, identical economics (gift 10000000, 600bps, QUARTERLY, age 80, funding_month 2026-08), both EXECUTED -> FUNDED (cash 10000000 each) -> ACTIVE with 80 payments @ 150000"
            - "DRAFT ValuationRun covering 2027 with valuation_date 2027-08-01 and corpus_updates setting the CRUT corpus to 12000000 (created by co-1)"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Dual Variant", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { crat_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${crat_id}", slot: "PRIMARY_1", beneficiary_name: "Uni Scholarship", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${crat_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${crat_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${crat_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_UNITRUST", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { crut_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${crut_id}", slot: "PRIMARY_1", beneficiary_name: "Uni Scholarship", document_received: true }, as: GiftOfficer, captures: { bd2: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd2}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd2}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${crut_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${crut_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a2: $.data.id } }
            - { call: "POST /giving/gift-assets/${a2}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements/${crut_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator }
            - { call: "POST /giving/valuation-runs", payload: { coverage_start: "2027-01-01T00:00:00Z", coverage_end: "2027-12-31T00:00:00Z", valuation_date: "2027-08-01T00:00:00Z", corpus_updates: [ { agreement_id: "${crut_id}", new_corpus_cents: 12000000 } ] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { vr_id: $.data.id } }
          trigger:
            - { call: "POST /giving/valuation-runs/${vr_id}/post", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /giving/gift-agreements/${crat_id}", payload: {}, as: ComplianceOfficer, captures: { crat_annual: $.data.annual_annuity_cents, crat_rem: $.data.remainder_value_cents } }
            - { call: "GET /giving/gift-agreements/${crut_id}", payload: {}, as: ComplianceOfficer, captures: { crut_annual: $.data.annual_annuity_cents, crut_rem: $.data.remainder_value_cents } }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${crat_id}" }, as: ComplianceOfficer, captures: { crat_p0: "$.data[0].amount_cents" } }
            - { call: "GET /giving/annuity-payments", payload: { gift_agreement_id: "${crut_id}" }, as: ComplianceOfficer, captures: { crut_p0: "$.data[0].amount_cents" } }
            - { call: "GET /giving/valuation-runs/${vr_id}", payload: {}, as: ComplianceOfficer, captures: { vr_liab: $.data.total_liability_cents, vr_rem: $.data.total_remainder_cents, vr_cnt: $.data.agreements_revalued_count } }
          assert:
            - "GiftAgreement.${crat_id}.annual_annuity_cents == 600000 (FIXED_AT_FUNDING unchanged by valuation)"
            - "GiftAgreement.${crut_id}.annual_annuity_cents == 720000 (ANNUALLY_REVALUED from corpus 12000000)"
            - "CRAT payment amount ${crat_p0} == 150000"
            - "CRUT payment amount ${crut_p0} == 180000"
            - "${crat_p0} != ${crut_p0} — identical inputs diverge purely by vehicle variant"
            - "ValuationRun.${vr_id}.agreements_revalued_count == 2"
            - "ValuationRun.${vr_id}.total_liability_cents == 15952624 (7251193 CRAT + 8701431 CRUT at age 81, 5%)"
            - "ValuationRun.${vr_id}.total_remainder_cents == 6047376 (2748807 + 3298569)"

      - name: reserve_coverage_booked_vs_projected
        grounds:
          - calculations.reserve_coverage_posture
          - entities.ReserveFund.fields.booked_target_cents
          - entities.ReserveFund.fields.projected_target_cents
        distinguishing_aspect: |
          With one EXECUTED-but-unfunded CGA (requirement 7570148), the SAME pool
          state reports booked_target_cents == 0 (statutory basis excludes
          EXECUTED) and projected_target_cents == 7570148 (forward-looking basis
          includes it) — two valid algorithms over one ReserveFund domain yielding
          different coverage answers.
        test_recipe:
          setup:
            - "Donor D; ACTIVE 5% rate table; reserve balance 7570148 contributed"
            - "CGA agreement (gift 10000000, 600bps, QUARTERLY, age 80, funding_month 2026-08) EXECUTED (designation verified; reserve gate passed with balance == requirement, inclusive boundary)"
            - "CGA NOT yet funded (no assets received)"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Coverage Basis", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { cga_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${cga_id}", slot: "PRIMARY_1", beneficiary_name: "Donor Self", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { rf_v: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 7570148, expected_reserve_fund_version: "${rf_v}" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements/${cga_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { booked_t: $.data.booked_target_cents, proj_t: $.data.projected_target_cents, cov: $.data.booked_coverage_bps, post1: $.data.posture } }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${cga_id}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { booked_t2: $.data.booked_target_cents, proj_t2: $.data.projected_target_cents, cov2: $.data.booked_coverage_bps, post2: $.data.posture } }
          assert:
            - "Before funding: ReserveFund.booked_target_cents == 0 (${booked_t} == 0) while projected_target_cents == 7570148 (${proj_t}) — same pool, two bases"
            - "Before funding: booked_coverage_bps is null (${cov} == null) and posture == SOLVENT (${post1})"
            - "After RECEIVE: agreement is FUNDED, booked_target_cents == 7570148 (${booked_t2}), projected_target_cents == 7570148 (${proj_t2})"
            - "After RECEIVE: booked_coverage_bps == 10000 (${cov2}) and posture == SOLVENT (${post2})"

      - name: estate_securities_dod_vs_alternate_basis
        grounds:
          - calculations.securities_fmv
          - state_machines.Estate.NOTIFIED_to_PROBATE_OPEN
          - entities.GiftAsset.fields.fmv_cents
        distinguishing_aspect: |
          Two estate SECURITIES assets recorded with IDENTICAL date-of-death price
          pairs (high 100000, low 90000) report different fmv_cents after the
          estate elects alternate valuation: the asset carrying an alt pair moves
          to 115000 while the one without stays 95000 — DATE_OF_DEATH vs
          ALTERNATE_VALUATION variants in the GiftAsset/Estate domain.
        test_recipe:
          setup:
            - "Donor D recorded DECEASED (no agreements); Estate E created for D in NOTIFIED"
            - "Asset A: SECURITIES with DOD pair only (100000/90000); Asset B: SECURITIES with DOD pair (100000/90000) AND alt pair (120000/110000); both RECEIVED"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Estate Basis", date_of_birth: "1940-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/donors/${d_id}/record-death", payload: { deceased_on: "2026-08-10T00:00:00Z" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "POST /giving/estates", payload: { donor_id: "${d_id}", notified_on: "2026-08-12T00:00:00Z" }, as: EstateManager, as_user_id: "em-1", captures: { e_id: $.data.id } }
            - { call: "POST /giving/gift-assets", payload: { estate_id: "${e_id}", asset_kind: "SECURITIES", pledged_value_cents: 95000 }, as: EstateManager, captures: { a_dod: $.data.id } }
            - { call: "POST /giving/gift-assets/${a_dod}/transition", payload: { action: "RECEIVE", dod_high_price_cents: 100000, dod_low_price_cents: 90000 }, as: EstateManager }
            - { call: "POST /giving/gift-assets", payload: { estate_id: "${e_id}", asset_kind: "SECURITIES", pledged_value_cents: 95000 }, as: EstateManager, captures: { a_alt: $.data.id } }
            - { call: "POST /giving/gift-assets/${a_alt}/transition", payload: { action: "RECEIVE", dod_high_price_cents: 100000, dod_low_price_cents: 90000, alt_high_price_cents: 120000, alt_low_price_cents: 110000 }, as: EstateManager }
            - { call: "GET /giving/gift-assets", payload: { estate_id: "${e_id}" }, as: EstateManager, captures: { a_fmv_pre: "$.data[0].fmv_cents", b_fmv_pre: "$.data[1].fmv_cents" } }
          trigger:
            - { call: "POST /giving/estates/${e_id}/transition", payload: { action: "ELECT_ALTERNATE_VALUATION" }, as: EstateManager, as_user_id: "em-1" }
            - { call: "GET /giving/gift-assets", payload: { estate_id: "${e_id}" }, as: EstateManager, captures: { a_fmv: "$.data[0].fmv_cents", b_fmv: "$.data[1].fmv_cents" } }
          assert:
            - "Before election: both fmv_cents == 95000 (${a_fmv_pre} == 95000, ${b_fmv_pre} == 95000) — identical DOD inputs"
            - "After election: asset WITHOUT alt pair stays ${a_fmv} == 95000 (DATE_OF_DEATH basis)"
            - "After election: asset WITH alt pair becomes ${b_fmv} == 115000 (ALTERNATE_VALUATION basis)"
            - "Estate.${e_id}.alternate_valuation_elected == true and status unchanged (NOTIFIED)"

  - rule_id: combinatorial_formula
    instances:
      - name: charitable_deduction_joint_lives_mode_a
        grounds:
          - calculations.charitable_deduction
          - entities.Illustration.fields.illustrated_deduction_cents
        distinguishing_aspect: |
          Mode (a): the deduction nests 4 inputs (gift, payout rate, two ages,
          discount rate) through a joint-life factor a(n1)+a(n2)-a(n12) with a
          max(0,...) floor — non-linear interactions, no rounding-order or
          evaluation-order component. Asserts the exact joint-lives deduction
          2313774 for gift 10000000 / 500bps / ages 75+70 / discount 500bps.
        test_recipe:
          setup:
            - "Donor D; ACTIVE rate table at 500bps open-ended from 2026-01-01"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Joint Lives", date_of_birth: "1951-05-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /giving/illustrations", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 10000000, payout_rate_bps: 500, payment_frequency: "ANNUAL", lives: 2, annuitant_1_age: 75, annuitant_2_age: 70, funding_month: "2026-08" }, as: GiftOfficer, captures: { ill_id: $.data.id, ill_ded: $.data.illustrated_deduction_cents, ill_ann: $.data.illustrated_annual_annuity_cents, ill_rt: $.data.rate_table_id } }
          assert:
            - "Illustration.${ill_id}.illustrated_annual_annuity_cents == 500000 (${ill_ann})"
            - "Illustration.${ill_id}.illustrated_deduction_cents == 2313774 (${ill_ded}) — joint factor 15.3724510269, pv 7686226"
            - "Illustration.${ill_id}.rate_table_id == ${rt_id} (pinned at creation)"
            - "Remainder test on these inputs passes: 2313774 * 10 >= 10000000"

      - name: payment_schedule_per_period_rounding_mode_b
        grounds:
          - calculations.annuity_payment_amount
          - entities.GiftAgreement.fields.total_scheduled_cents
          - entities.AnnuityPayment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — each payment is
          round_half_up(99901/12) = 8325 independently and total_scheduled_cents
          is the SUM of rounded payments (199800), NOT round(annual * years)
          (199802). A sum-then-round implementation drifts by 2 cents.
        test_recipe:
          setup:
            - "Donor D age-98 CRAT (gift 1665017, 600bps, MONTHLY, funding_month 2026-08) EXECUTED -> FUNDED via cash asset 1665017; 5% ACTIVE rate table"
            - "designation PRIMARY_1 verified before execute (required gate)"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Rounding Order", date_of_birth: "1928-01-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CRT_ANNUITY", gift_amount_cents: 1665017, payout_rate_bps: 600, payment_frequency: "MONTHLY", lives: 1, annuitant_1_age: 98, funding_month: "2026-08" }, as: GiftOfficer, captures: { ag_id: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${ag_id}", slot: "PRIMARY_1", beneficiary_name: "Heir", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "POST /giving/gift-agreements/${ag_id}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1", captures: { ded: $.data.booked_deduction_cents } }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${ag_id}", asset_kind: "CASH", pledged_value_cents: 1665017 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
          trigger:
            - { call: "POST /giving/gift-agreements/${ag_id}/generate-payment-schedule", payload: {}, as: GiftAdministrator, captures: { p0_amt: "$.data[0].amount_cents" } }
            - { call: "GET /giving/gift-agreements/${ag_id}", payload: {}, as: GiftAdministrator, captures: { total_sched: $.data.total_scheduled_cents, ag_status: $.data.status } }
          assert:
            - "Booked deduction at execute == 1479260 (${ded}) — pv 185757 at age 98, n=2, 5%"
            - "Every payment amount == 8325 (${p0_amt}) — round_half_up(99901/12)"
            - "GiftAgreement.${ag_id}.total_scheduled_cents == 199800 (${total_sched}) — 24 x 8325, NOT 2 x 99901 = 199802"
            - "GiftAgreement.${ag_id}.status == ACTIVE (${ag_status})"
            - "Payment count: GET /giving/annuity-payments?gift_agreement_id=${ag_id} total_count == 24"

      - name: reserve_gate_evaluation_order_mode_c
        grounds:
          - calculations.reserve_coverage_posture
          - validations[priority=25]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency broken by pinned evaluation order —
          the CGA EXECUTE gate evaluates the PROJECTED target INCLUDING the
          candidate agreement against the CURRENT balance, while the reported
          posture uses the BOOKED target computed before the transition. Pool is
          SOLVENT (booked coverage exactly 10000) yet the candidate's own
          requirement blocks its execution with ERR_RESERVE_DEFICIENT.
        test_recipe:
          setup:
            - "Donor D; 5% ACTIVE table; CGA-1 (gift 10000000, 600bps, QUARTERLY, age 80) EXECUTED then FUNDED (cash 10000000) with reserve balance exactly 7570148 -> booked coverage exactly 10000 bps, posture SOLVENT"
            - "CGA-2 (identical economics) in DRAFT with VERIFIED PRIMARY_1 designation"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Eval Order", date_of_birth: "1956-03-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { cga1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${cga1}", slot: "PRIMARY_1", beneficiary_name: "Self", document_received: true }, as: GiftOfficer, captures: { bd1: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd1}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { rf_v: $.data.version } }
            - { call: "POST /giving/reserve-fund/adjustments", payload: { direction: "CONTRIBUTION", amount_cents: 7570148, expected_reserve_fund_version: "${rf_v}" }, as: ComplianceOfficer, captures: { rf_v2: $.data.version } }
            - { call: "POST /giving/gift-agreements/${cga1}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1" }
            - { call: "POST /giving/gift-assets", payload: { gift_agreement_id: "${cga1}", asset_kind: "CASH", pledged_value_cents: 10000000 }, as: EstateManager, captures: { a1: $.data.id } }
            - { call: "POST /giving/gift-assets/${a1}/transition", payload: { action: "RECEIVE" }, as: EstateManager }
            - { call: "POST /giving/gift-agreements", payload: { donor_id: "${d_id}", vehicle_type: "CGA", gift_amount_cents: 10000000, payout_rate_bps: 600, payment_frequency: "QUARTERLY", lives: 1, annuitant_1_age: 80, funding_month: "2026-08" }, as: GiftOfficer, captures: { cga2: $.data.id } }
            - { call: "POST /giving/beneficiary-designations", payload: { gift_agreement_id: "${cga2}", slot: "PRIMARY_1", beneficiary_name: "Self", document_received: true }, as: GiftOfficer, captures: { bd2: $.data.id } }
            - { call: "POST /giving/beneficiary-designations/${bd2}/transition", payload: { action: "SUBMIT" }, as: GiftOfficer }
            - { call: "POST /giving/beneficiary-designations/${bd2}/transition", payload: { action: "VERIFY" }, as: GiftAdministrator }
          trigger:
            - { call: "POST /giving/gift-agreements/${cga2}/execute", payload: {}, as: GiftAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
            - { call: "GET /giving/reserve-fund", payload: {}, as: ComplianceOfficer, captures: { post: $.data.posture, cov: $.data.booked_coverage_bps } }
            - { call: "GET /giving/gift-agreements/${cga2}", payload: {}, as: ComplianceOfficer, captures: { cga2_status: $.data.status } }
          assert:
            - "execute CGA-2 rejected with ${err} == ERR_RESERVE_DEFICIENT (409)"
            - "ReserveFund.posture == SOLVENT (${post}) and booked_coverage_bps == 10000 (${cov}) — the gate used the PROJECTED target including the candidate (15140296 > balance 7570148), not the booked posture"
            - "GiftAgreement.${cga2}.status == DRAFT (${cga2_status}) — no partial execution"

  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_suspend_resume_cycle
        grounds:
          - state_machines.GiftAgreement.ACTIVE_to_SUSPENDED
          - state_machines.GiftAgreement.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          GiftAgreement runs a cycle ACTIVE -> SUSPENDED -> ACTIVE (non-linear on
          the GiftAgreement entity): after RESUME the agreement accepts payments
          again and its version reflects both transitions.
        test_recipe:
          setup:
            - "CRAT (gift 10000000, 500bps, QUARTERLY, age 80, funding_month 2026-08) ACTIVE with 80 quarterly payments of 125000; 5% ACTIVE rate table; clock advanced to 2026-11-01 so payment 1 is DUE"
          setup_api_calls:
            - { call: "POST /giving/donors", payload: { full_name: "Suspend Cycle", date_of_birth: "1946-06-01T00:00:00Z" }, as: GiftOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /giving/rate-tables", payload: { label: "7520-5pct", discount_rate_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { rt_id: $.data.id } }
            - { call: "POST /giving/rate-tables/${rt_id}/transition", payload: { action: "ACTIVATE" }, as: ComplianceOfficer }
