# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Enumerates every testable claim the scaffold's §1.1–§1.7 surface declares that
# §1.8 does not already cover. Sections and claim_types are taken verbatim from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_learner_missing_display_name_rejected
        claim_type: required_fields
        grounds: [entities.Learner.fields.display_name, "errors[ERR_MISSING_REQUIRED_FIELD]"]
        distinguishing_aspect: "POST /outschool/learners with birth_date and parent_user_id but no display_name must be rejected with ERR_MISSING_REQUIRED_FIELD rather than creating a learner with a null name."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /outschool/learners"
              payload: { birth_date: "2016-05-01T00:00:00Z", parent_user_id: "p_1" }
              as: Parent
              as_user_id: "p_1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "The response error_id is ERR_MISSING_REQUIRED_FIELD"
            - "No Learner row was created, so a subsequent GET /outschool/learners with an empty result set returns total_count 0"

      - name: get_unknown_listing_returns_not_found
        claim_type: not_found
        grounds: ["endpoints.GET /outschool/class-listings/{listingId}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a syntactically valid but never-created listing id must return ERR_NOT_FOUND with HTTP 404 rather than an empty object."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /outschool/class-listings/22222222-2222-4222-8222-222222222222"
              as: PlatformAdmin
              captures: { err_absent: $.data.error_id }
          assert:
            - "The response error_id is ERR_NOT_FOUND"

      - name: learner_defaults_applied_on_creation
        claim_type: defaults
        grounds: [entities.Learner.fields.subscription_tier, entities.Learner.fields.confirmation_credit_cents, entities.Learner.fields.enrollment_sequence]
        distinguishing_aspect: "A learner created without any subscription input must carry subscription_tier NONE, confirmation_credit_cents 0, enrollment_sequence 0 and abuse_strike_count 0."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /outschool/learners"
              payload: { display_name: "Learner One", birth_date: "2016-05-01T00:00:00Z", parent_user_id: "p_1" }
              as: Parent
              as_user_id: "p_1"
              captures: { ln_1: $.data.id }
          assert:
            - "Learner.${ln_1}.subscription_tier == NONE"
            - "Learner.${ln_1}.subscription_discount_pct == 0.00"
            - "Learner.${ln_1}.confirmation_credit_cents == 0"
            - "Learner.${ln_1}.enrollment_sequence == 0"
            - "Learner.${ln_1}.abuse_strike_count == 0"

  # ===========================================================================
  # State machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_section_starts_in_scheduled_state
        claim_type: initial_state
        grounds: [state_machines.Section.initial_state, entities.Section.fields.outcome]
        distinguishing_aspect: "A freshly created section must report status SCHEDULED, outcome null and full seat availability, regardless of the parent listing's state."
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; a POLICY_APPROVED PUBLISHED listing priced 2000 exists"
            - "The logical clock reads 2026-09-01T00:00:00Z, the server default"
          setup_api_calls:
            - call: "POST /outschool/teacher-applications"
              payload: { applicant_user_id: "u_ada", applicant_email: "ada@example.com", display_name: "Ada Lovelace", teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada: $.data.id }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s1: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s2: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/review"
              payload: { stage: "SAMPLE", verdict: "PASS" }
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { app_ada_s3: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/approve"
              payload: {}
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { t_ada: $.data.id }
            - call: "POST /outschool/teachers/${t_ada}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { t_ada_status: $.data.status }
            - call: "POST /outschool/class-listings"
              payload: { teacher_id: "${t_ada}", title: "Algebra Club", format: "ONE_TIME", min_age: 8, max_age: 12, max_learners: 6, list_price_cents: 2000 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { l_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/policy-review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { l_1_review: $.data.content_review_state }
            - call: "POST /outschool/class-listings/${l_1}/publish"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
          trigger:
            - call: "POST /outschool/class-listings/${l_1}/sections"
              payload: { timezone: "America/New_York", start_utc: "2026-11-05T14:00:00Z", end_utc: "2026-11-05T16:00:00Z", min_learners: 2, capacity: 5 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { s_1: $.data.id }
          assert:
            - "Section.${s_1}.status == SCHEDULED"
            - "Section.${s_1}.outcome == null"
            - "Section.${s_1}.enrolled_count == 0"
            - "Section.${s_1}.reserved_count == 0"
            - "Section.${s_1}.seats_remaining == 5"
            - "Section.${s_1}.enrollment_min_met == false"
            - "Section.${s_1}.cancellation_cutoff_utc == 2026-11-04T14:00:00Z"

      - name: cancel_already_cancelled_section_returns_invalid_state
