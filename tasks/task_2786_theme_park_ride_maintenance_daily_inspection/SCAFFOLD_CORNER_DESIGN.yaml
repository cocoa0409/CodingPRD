  - section: endpoints
    instances:

      - name: shop_bay_list_honours_limit_offset_and_reports_total_count_and_has_more
        claim_type: standard_crud
        grounds:
          - "endpoints[POST /park-ops/shop-bays]"
          - "endpoints[GET /park-ops/shop-bays]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "With exactly three bays the list endpoint reports total_count 3 regardless of the page window: limit 2 / offset 0 returns two rows with has_more true, limit 2 / offset 2 returns one row with has_more false, the parameterless call returns all three with the default limit 10, and limit 0 is 400 ERR_INVALID_REQUEST because the declared minimum is 1."
        test_recipe:
          setup:
            - "Three shop bays created in a known order."
          setup_api_calls:
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay Alpha", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b1: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay Bravo", concurrent_slot_capacity: 2 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b2: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay Charlie", concurrent_slot_capacity: 3 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b3: "$.data.id" }
          trigger:
            - call: "GET /park-ops/shop-bays"
              payload: { limit: 2, offset: 0 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/shop-bays"
              payload: { limit: 2, offset: 2 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/shop-bays"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/shop-bays"
              payload: { limit: 0 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/shop-bays/${b2}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Trigger 1: response_type \"array\", 2 rows, meta/pagination limit == 2, offset == 0, total_count == 3, has_more == true"
            - "Trigger 2: 1 row, offset == 2, total_count == 3, has_more == false"
            - "Trigger 3: 3 rows with limit == 10 and offset == 0 (declared defaults), has_more == false"
            - "Trigger 4: 400 with error_id \"ERR_INVALID_REQUEST\" (limit below the declared minimum of 1)"
            - "Trigger 5: 200 with response_type \"object\"; ShopBay.${b2}.name == \"Bay Bravo\", concurrent_slot_capacity == 2, booked_order_count == 0, version == 1"

      - name: active_template_refuses_item_appends_and_reactivation_while_sequence_numbers_stay_unique_per_template
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /park-ops/inspection-templates/{id}/items]"
          - "endpoints[POST /park-ops/inspection-templates/{id}/activate]"
          - "errors[ERR_TEMPLATE_STATE_INVALID]"
          - "validations[priority 5]"
        distinguishing_aspect: "Once a template is ACTIVE both of its mutating endpoints are closed: appending an item is 409 ERR_TEMPLATE_STATE_INVALID and re-activating it is 409 as well (with a freshly read expected_attraction_version, so the OCC check at priority 6 passes and cannot mask the state check at priority 7); meanwhile sequence_no 1 is reusable on a second template but a duplicate inside one template is 400."
        test_recipe:
          setup:
            - "One attraction, template T1 with one item activated, and a second DRAFT template T2 on the same attraction."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Template Guard Ride", park_area: "KIDS_COVE", manufacturer: "Zamperla", model_code: "TG-1", ride_class: "KIDDIE", theoretical_hourly_capacity: 400, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id", a_v1: "$.data.version" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t1: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t1}/items"
              payload: { sequence_no: 1, description: "Check air pressure at the brake", severity_class: "ESSENTIAL" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { i1: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t1}/activate"
              payload: { expected_attraction_version: "${a_v1}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-09-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t2: "$.data.id" }
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_v2: "$.data.version" }
          trigger:
            - call: "POST /park-ops/inspection-templates/${t1}/items"
              payload: { sequence_no: 2, description: "Late addition", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t1}/activate"
              payload: { expected_attraction_version: "${a_v2}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t2}/items"
              payload: { sequence_no: 1, description: "Verify restraint release handle", severity_class: "SAFETY_CRITICAL", requires_photo: true }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { i2: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t2}/items"
              payload: { sequence_no: 1, description: "Duplicate sequence number", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
          assert:
            - "Trigger 1: 409 with error_id \"ERR_TEMPLATE_STATE_INVALID\"; template ${t1} keeps item_count == 1"
            - "Trigger 2: 409 with error_id \"ERR_TEMPLATE_STATE_INVALID\" (not 412) because ${a_v2} is the current attraction version; Attraction.active_template_id is still ${t1}"
            - "Trigger 3: 201; ChecklistItem ${i2} on template ${t2} reuses sequence_no 1, severity_class \"SAFETY_CRITICAL\", requires_photo == true, and carries no updated_at/version fields (common_fields false)"
            - "Trigger 4: 400 with error_id \"ERR_INVALID_REQUEST\"; template ${t2} keeps item_count == 1 and stays DRAFT"
            - "ChecklistItem ${i1} still has requires_photo == false (the declared default)"

      - name: computed_reads_return_declared_zero_shapes_on_empty_input_sets
        claim_type: computed_read
        grounds:
          - "endpoints[GET /park-ops/attractions/{id}/capacity-impact]"
          - "endpoints[GET /park-ops/attractions/{id}/dispatch-readiness]"
          - "endpoints[GET /park-ops/bulletins/{id}/risk]"
        distinguishing_aspect: "All three derived reads are exercised against genuinely empty input sets on a brand-new attraction and an unacknowledged bulletin: each returns 200 with its full declared field set at zero rather than 404, null or an omitted key - capacity-impact event_count 0 with three 0.00 money-like figures, dispatch-readiness 0.00 with mean_restraint_score 0.00, and risk 0.00 for both variants with evaluated_action_count 0."
        test_recipe:
          setup:
            - "One attraction with no components, no inspections, no downtime events and no certifications; one ISSUED bulletin that has never been acknowledged, so it has zero actions."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Empty Set Ride", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "ES-1", ride_class: "FAMILY", theoretical_hourly_capacity: 600, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-EMPTY-1", manufacturer: "Chance", model_code: "ZZ-9", severity: "MANDATORY", issued_date: "2026-07-01", compliance_deadline_date: "2026-10-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "GET /park-ops/attractions/${a_id}/capacity-impact"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions/${a_id}/dispatch-readiness"
              payload: {}
              as: RideOperator
              as_user_id: "op-1"
            - call: "GET /park-ops/bulletins/${b_id}/risk"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Trigger 1: 200 with attraction_id == \"${a_id}\", window_start_date == window_end_date == \"2026-08-01\", event_count == 0, settled_guest_slots_lost == 0.00, provisional_guest_slots_lost == 0.00, divergence_guest_slots == 0.00"
            - "Trigger 2: 200 with operational_posture == \"CLOSED_PENDING_INSPECTION\", certified_operator_count == 0, mean_restraint_score == 0.00, essential_fail_count == 0, dispatch_readiness_index == 0.00"
            - "Trigger 3: 200 with evaluated_action_count == 0, deferred_action_count == 0, fleet_aggregate_score == 0.00, per_unit_max_score == 0.00, divergence == 0.00"
            - "MaintenanceBulletin.${b_id}.status == \"ISSUED\" and action_total_count == 0 (the model_code ZZ-9 matches no attraction)"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp with response_type \"object\""

      - name: requisition_link_fields_are_mutually_exclusive_and_must_share_the_attraction
        claim_type: cross_reference_link
        grounds:
          - "endpoints[POST /park-ops/part-requisitions]"
          - "state_machines.PartRequisition.transitions.None_to_REQUESTED"
          - "validations[priority 5]"
        distinguishing_aspect: "The optional link fields are validated three ways in one run: supplying both downtime_event_id and bulletin_action_id is 400, supplying a downtime_event_id that belongs to a different attraction is 400, and the correct single link is accepted with total_cost_cents 300000 committed only once the requisition reserves - the link itself never commits budget."
        test_recipe:
          setup:
            - "Two attractions, each with an OPEN downtime event. A Chance/RQ-1 bulletin acknowledged so attraction one also owns a PENDING action."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Link Ride A", park_area: "FRONTIER", manufacturer: "Chance", model_code: "RQ-1", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a1: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Link Ride B", park_area: "FRONTIER", manufacturer: "Mack", model_code: "RQ-2", ride_class: "WATER", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a2: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a1}", started_at: "2026-08-01T09:00:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d1: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a2}", started_at: "2026-08-01T09:30:00.000Z", cause_category: "ELECTRICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d2: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-LINK-1", manufacturer: "Chance", model_code: "RQ-1", severity: "MANDATORY", issued_date: "2026-07-01", compliance_deadline_date: "2026-10-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b_id: "$.data.id" }
            - call: "POST /park-ops/bulletins/${b_id}/acknowledge"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_id}" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { act: "$.data[0].id" }
          trigger:
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-BOTH", quantity: 2, unit_cost_cents: 150000, needed_by_date: "2026-08-10", downtime_event_id: "${d1}", bulletin_action_id: "${act}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-FOREIGN", quantity: 2, unit_cost_cents: 150000, needed_by_date: "2026-08-10", downtime_event_id: "${d2}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-OK", quantity: 2, unit_cost_cents: 150000, needed_by_date: "2026-08-10", downtime_event_id: "${d1}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { rq: "$.data.id" }
            - call: "POST /park-ops/part-requisitions/${rq}/reserve"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/part-requisitions"
              payload: { downtime_event_id: "${d1}" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Trigger 1: 400 with error_id \"ERR_INVALID_REQUEST\" (at most one link field); no requisition row is created"
            - "Trigger 2: 400 with error_id \"ERR_INVALID_REQUEST\" because ${d2} belongs to ${a2}, not 404 - the row exists so priority 4 passes"
            - "Trigger 3: 201; PartRequisition.${rq}.status == \"REQUESTED\", total_cost_cents == 300000, bulletin_action_id == null, and Attraction.${a1}.parts_budget_committed_cents == 0"
            - "Trigger 4: 200; status == \"RESERVED\" and Attraction.${a1}.parts_budget_committed_cents == 300000"
            - "Trigger 5: exactly one row is returned with total_count == 1, proving the link is queryable from the event side"
            - "BulletinAction.${act}.required_part_received == true (no PartRequisition names this action, so the derived guard reads satisfied even though the stored default is false)"

      - name: bulletin_acknowledge_fans_out_only_to_the_matching_manufacturer_and_model
        claim_type: bulk_action
        grounds:
          - "endpoints[POST /park-ops/bulletins/{id}/acknowledge]"
          - "state_machines.MaintenanceBulletin.transitions.ISSUED_to_ACKNOWLEDGED"
          - "calculations.bulletin_fleet_risk_score"
        distinguishing_aspect: "Acknowledgement is a single call that writes N rows: with three attractions of which two share the bulletin's manufacturer and model, exactly two BulletinAction rows appear (none for the third), action_total_count is 2, and the risk read proves the fan-out preserved each unit's own ride_class - KIDDIE 24.00 and FAMILY 32.00, fleet mean 28.00 against per-unit max 32.00."
        test_recipe:
          setup:
            - "Attraction one: Chance/BK-1, KIDDIE. Attraction two: Chance/BK-1, FAMILY. Attraction three: Chance/BK-9, FAMILY. One MANDATORY Chance/BK-1 bulletin issued 2026-07-01 with deadline 2026-10-01 (not overdue at the 2026-08-01 clock)."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Fanout Kiddie", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "BK-1", ride_class: "KIDDIE", theoretical_hourly_capacity: 300, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a1: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Fanout Family", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "BK-1", ride_class: "FAMILY", theoretical_hourly_capacity: 500, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a2: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Fanout Outsider", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "BK-9", ride_class: "FAMILY", theoretical_hourly_capacity: 500, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a3: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-FAN-1", manufacturer: "Chance", model_code: "BK-1", severity: "MANDATORY", issued_date: "2026-07-01", compliance_deadline_date: "2026-10-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /park-ops/bulletins/${b_id}/acknowledge"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-7"
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_id}" }
              as: MaintenanceManager
              as_user_id: "mgr-7"
              captures: { act1: "$.data[0].id", act2: "$.data[1].id" }
            - call: "GET /park-ops/bulletin-actions"
              payload: { attraction_id: "${a3}" }
              as: MaintenanceManager
              as_user_id: "mgr-7"
            - call: "GET /park-ops/bulletins/${b_id}/risk"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-7"
            - call: "POST /park-ops/bulletins/${b_id}/acknowledge"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-7"
          assert:
            - "Trigger 1: 200; MaintenanceBulletin.${b_id}.status == \"ACKNOWLEDGED\", acknowledged_by_user_id == \"mgr-7\", acknowledged_at == the logical clock, action_total_count == 2, action_verified_count == 0"
            - "Trigger 2: total_count == 2 in attraction created_at ASC order - data[0].attraction_id == \"${a1}\" and data[1].attraction_id == \"${a2}\", both status \"PENDING\" with deferral_count 0"
            - "Trigger 3: total_count == 0 - attraction ${a3} (model BK-9) received no action"
            - "Trigger 4: evaluated_action_count == 2, deferred_action_count == 0, escalation_factor == 1.00, fleet_aggregate_score == 28.00, per_unit_max_score == 32.00, divergence == 4.00"
            - "Trigger 5: 409 with error_id \"ERR_BULLETIN_STATE_INVALID\"; action_total_count stays 2 (no second fan-out)"

      - name: clock_endpoint_starts_at_the_declared_instant_and_moving_the_date_reopens_the_inspection_requirement
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /_clock/set_current_utc]"
          - "calculations.operational_posture_derivation"
          - "entities.Attraction.fields.last_signed_off_service_date"
        distinguishing_aspect: "The process starts at exactly 2026-08-01T00:00:00Z, so a 2026-08-01 inspection signs off into OPEN with no clock call at all; advancing the clock one day flips the same attraction back to CLOSED_PENDING_INSPECTION with no other write, a malformed to_iso8601 is 400 and leaves the clock where it was, and re-setting the same instant is a no-op."
        test_recipe:
          setup:
            - "The clock is untouched (2026-08-01T00:00:00Z). One attraction with an ACTIVE one-line ADVISORY template, an inspection for 2026-08-01 recorded PASS, submitted and signed off by a different user than the recorder."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Clock Ride", park_area: "LAGOON", manufacturer: "Mack", model_code: "CK-1", ride_class: "WATER", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 1, description: "Confirm splash-down water level", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/activate"
              payload: { expected_attraction_version: "${a_v}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { insp: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r1: "$.data[0].id" }
            - call: "POST /park-ops/inspection-item-results/${r1}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-1"
          trigger:
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "not-a-timestamp" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Trigger 1: operational_posture == \"OPEN\" and last_signed_off_service_date == \"2026-08-01\", proving the process-start clock date without any clock call"
            - "Trigger 2: 400 with error_id \"ERR_INVALID_REQUEST\"; the clock is unchanged and the posture is still OPEN"
            - "Trigger 3: 200 with current_utc == \"2026-08-02T06:00:00Z\" (or the same instant in the declared serialisation)"
            - "Trigger 4: operational_posture == \"CLOSED_PENDING_INSPECTION\" while last_signed_off_service_date is still \"2026-08-01\" and DailyInspection.${insp}.status is still \"SIGNED_OFF\""
            - "Trigger 5 and 6: setting the same instant again returns 200 and the posture stays \"CLOSED_PENDING_INSPECTION\" (idempotent, no drift)"

      - name: cycle_logging_is_allowed_only_while_the_attraction_is_not_under_a_regulatory_hold
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /park-ops/attractions/{id}/cycles]"
          - "validations[priority 10] ERR_REGULATORY_HOLD_ACTIVE"
        excluded_because:
          difficulty_instance: transitive_cascade / ride_hold_cascade_suspends_only_certified_rows_and_gates_cycle_logging
          rationale: "That §1.8 instance drives the hold cascade and then proves both the cycle log and the sign-off are refused with ERR_REGULATORY_HOLD_ACTIVE until the incident clears."

