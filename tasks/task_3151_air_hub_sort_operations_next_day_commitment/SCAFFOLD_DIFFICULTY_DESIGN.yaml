              captures: { ac2_status: $.data.status, ac2_arrival: $.data.actual_arrival_minutes, ac2_maint_after: $.data.maintenance_hold }
          assert:
            - "hop 1 (OpsRun -> Package): the time-downgraded package reads ${p1_status} == REROUTED with ${p1_final} == 1800"
            - "hop 1 (OpsRun -> Package): the ground-downgraded package reads ${p2_status} == REROUTED with ${p2_final} == 1800"
            - "hop 2 (OpsRun -> Aircraft): ${ac2_status} == IN_FLIGHT and ${ac2_arrival} is null"
            - "hop 3 consequence: ${ac2_maint_after} == true, so the reinstated aircraft stays blocked from unload work until the same advance clears maintenance"
            - "the OpsRun verdict is ${verdict} == ADVANCED and Hub.${hub_id}.ops_run_index == 1"
            - "the aircraft had been ${ac2_cancelled} == CANCELLED with maintenance_hold ${ac2_maint} == true before the chain ran"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: lapsed_lane_certification_beats_wrong_commodity_capability
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_LANE_CERTIFICATION_LAPSED
          - errors.ERR_LANE_NOT_AVAILABLE
          - endpoints.POST_/airhub/packages/{package_id}/primary-sort
        distinguishing_aspect: "The safety/temporal pair business_temporal at priority 7 against business_constraint at priority 8: one call violates both (the target lane's certification lapsed at 1560 and its commodity_capability is HAZMAT while the package is PERISHABLE) and the answer is the priority 7 error, never the priority 8 one."
        test_recipe:
          setup:
            - "Clock 1601. SDF hub with alternate IND, lanes P-01 (PRIMARY GENERAL) and HZ-01 (PRIMARY-family HAZMAT lane, certified_until 1560), BANK_A with N701UP landed and unloaded, shift N-A, and one inducted PERISHABLE package rated 20000 grams."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_lane_hz1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-X-0001", commodity_class: "PERISHABLE", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_x: $.data.id }
            - call: "POST /airhub/packages/${pkg_x}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:01:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_x}/primary-sort"
              payload: { lane_id: "${lane_hz1_id}" }
              as: SortOperator
              captures: { err_lapsed: $.data.error_id }
          assert:
            - "the call is rejected with ${err_lapsed} == ERR_LANE_CERTIFICATION_LAPSED (priority 7)"
            - "${err_lapsed} != ERR_LANE_NOT_AVAILABLE, so the priority 8 capability conflict is shadowed"
            - "the lane is at minute 1601 against certified_until_minutes 1560, so current hub minute < certified_until_minutes is false"
            - "the package's commodity_class PERISHABLE also differs from the lane's commodity_capability HAZMAT, so both checks are genuinely violated"
            - "Package.${pkg_x}.sort_status == UNSORTED and assigned_lane_id is null"

      - name: posture_safety_block_beats_aircraft_state_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_POSTURE_BLOCKS_INDUCTION
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/airhub/packages/{package_id}/induct
        distinguishing_aspect: "A different category pair — business_safety at priority 6 against state at priority 11: the hub is GROUND_STOP and the package's own aircraft is still LANDED rather than UNLOADED, and the answer is the priority 6 posture error rather than the priority 11 state error."
        test_recipe:
          setup:
            - "Clock 1410. SDF hub with alternate IND, lane P-01 and a GENERIC secondary lane, BANK_A with N701UP landed and unloaded and N702UP landed but never unloaded, shift N-A, package Y aboard N702UP."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_ac2
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/aircraft/${ac2_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/land"
              payload: { inbound_weight_grams: 40000 }
              as: GatewayCoordinator
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", tracking_number: "1Z-Y-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_y: $.data.id }
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
            - call: "POST /airhub/hubs/${hub_id}/ground-stop"
              payload: {}
              as: HubOpsManager
              captures: { stop_posture: $.data.posture }
          trigger:
            - call: "POST /airhub/packages/${pkg_y}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { err_posture: $.data.error_id }
          assert:
            - "the hub is in ${stop_posture} == GROUND_STOP before the attempt"
            - "the call is rejected with ${err_posture} == ERR_POSTURE_BLOCKS_INDUCTION (priority 6)"
            - "${err_posture} != ERR_INVALID_STATE, so the priority 11 aircraft-not-UNLOADED conflict is shadowed"
            - "Aircraft.${ac2_id}.status == LANDED, so the state precondition is genuinely violated too"
            - "Package.${pkg_y}.induction_status == NOT_INDUCTED and rated_weight_grams is null"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: hub_posture_strict_greater_than_at_the_congestion_threshold
        grounds:
          - calculations.hub_posture
          - calculations.live_planned_package_total
          - state_machines.Hub.transitions.OPEN_to_CONGESTED
          - endpoints.GET_/airhub/hubs/{hub_id}
        distinguishing_aspect: "A numeric-threshold crossing reached through the hub read: with the window at 180 minutes the congestion threshold is 360000 grams, and 360000 reads OPEN while 360100 reads CONGESTED — the open/congested boundary is strict (>) whereas the congestion/lockdown boundary at 900000 is inclusive (>=)."
        test_recipe:
          setup:
            - "Clock 1410. SDF hub with alternate IND (window 1380-1560, so thresholds 360000 and 900000), BANK_A with N701UP landed and unloaded, shift N-A, one 360000-gram package live."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-T-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 360000, dimension_weight_grams: 360000 }
              as: SortOperator
              captures: { pkg_t1: $.data.id }
          trigger:
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { posture_at_threshold: $.data.posture, total_at_threshold: $.data.live_planned_package_total }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-T-0002", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 100, dimension_weight_grams: 100 }
              as: SortOperator
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { posture_above_threshold: $.data.posture, total_above: $.data.live_planned_package_total }
          assert:
            - "at the exact threshold ${total_at_threshold} == 360000 and ${posture_at_threshold} == OPEN — the boundary is strict (>)"
            - "one 100-gram step later ${total_above} == 360100 and ${posture_above_threshold} == CONGESTED"
            - "Hub.${hub_id}.posture == CONGESTED at the end"
            - "the lockdown boundary is inclusive on the other side: removing 100 grams from a 900000 total still reads LOCKDOWN because live_planned_package_total >= 900000"
            - "a total of 360000 that should have been CONGESTED would be an off-by-one error, so the test pins OPEN"

      - name: buoy_under_capacity_guard_excludes_the_zero_delta_boundary
        grounds:
          - calculations.buildup_reserve_tier
          - validations[priority=9]
          - errors.ERR_BUILDUP_UNDER_CAPACITY
          - endpoints.POST_/airhub/moves/{move_id}/load-package
        distinguishing_aspect: "A different metric on a different endpoint — an empty-set/zero-delta edge rather than a numeric crossing: the destination-buildup guard rejects only deltas strictly inside (0, 25000], so a 0-gram delta is allowed, a 100-gram delta is rejected, and the same 100-gram delta is allowed again once it is paired with a transit move that pushes the move's forward capacity past SORT_BUDGET_GRAMS_CEILING."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub with alternate IND, lane P-01 and S-01, BANK_A with N701UP landed and unloaded, two move aircraft N702UP (buildup container 70000) and N703UP (transit move, weight_limit 400000), shift N-A, and two GENERAL packages rated 70000 and 50000 grams, both inducted and secondary-sorted."
          setup_api_calls:
            - *k_clock
            - *k_alt_hub
            - *k_hub
            - *k_lane_p1
            - *k_lane_s1
            - *k_bank
            - *k_ac1
            - *k_ac2
            - *k_shift
            - *k_clock1400
            - *k_ac1_depart
            - *k_ac1_land
            - *k_bank_unload
            - *k_ac1_begun
            - *k_ac1_done
            - call: "POST /airhub/banks"
              payload: { hub_id: "${hub_id}", bank_code: "BANK_C", scheduled_start_minutes: 1400, scheduled_end_minutes: 1600, hydraulic_crew_available: true }
              as: HubOpsManager
              captures: { bank_c_id: $.data.id }
            - call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_c_id}", tail_number: "N703UP", origin_station_code: "DFW", scheduled_arrival_minutes: 1400, capacity_weight_grams: 400000 }
              as: GatewayCoordinator
              captures: { ac3_id: $.data.id }
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 100000 }
              as: LoadPlanner
              captures: { move_a_id: $.data.id }
            - call: "POST /airhub/buildups"
              payload: { hub_id: "${hub_id}", load_move_id: "${move_a_id}", destination_gateway_code: "LAX", container_limit_grams: 70000, hazardous_cap_grams: 0, requires_container: false }
              as: LoadPlanner
              captures: { bd_a_id: $.data.id }
            - call: "POST /airhub/moves/${move_a_id}/plan-load"
              payload: {}
              as: LoadPlanner
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac3_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_b_id: $.data.id, move_b_v0: $.data.version }
            - call: "POST /airhub/moves/${move_b_id}/plan-load"
              payload: {}
              as: LoadPlanner
              captures: { move_b_v1: $.data.version }
            - call: "POST /airhub/packages"
