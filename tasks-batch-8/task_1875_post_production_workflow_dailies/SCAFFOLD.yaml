  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Test-driving endpoint: set the server's logical clock. Before any call
      to this endpoint, the logical clock reads exactly 2026-08-01T00:00:00Z
      and MUST NOT fall back to real wall-clock time. All datetime-dependent
      rules (ingest windows, booking session_date/hour checks, no-show
      sweeps, retained_until horizon) read this clock.
    roles: [FacilityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Advance triggers NO_SHOW sweep for RESERVED bookings whose end hour has passed"
      - "Triggers any time-dependent auto-transitions"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced entity (path or FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum, out-of-range value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in required from-state for the requested transition" }
  - { id: ERR_WINDOW_CLOSED, http: 422, condition: "Logical clock is outside the declared ingest window, or booking is being created/checked-in outside its allowed temporal window" }
  - { id: ERR_BOOKING_OVERLAP, http: 409, condition: "Requested hour interval overlaps an existing non-terminal Booking for the same bay and session_date (half-open semantics)" }
  - { id: ERR_WATERMARK_NONCOMPLIANT, http: 422, condition: "WatermarkProfile is not ACTIVE or watermark_compliance_score below the project security_tier gate" }
  - { id: ERR_DISTRIBUTION_INVALID, http: 422, condition: "distribution_list empty, contains duplicates, non-lowercase email, or referenced batch not READY" }
  - { id: ERR_DUPLICATE_ASSET, http: 409, condition: "Composite (project_id, reel_name, clip_name) already present among non-PURGED MediaAssets" }
  - { id: ERR_VENDOR_INELIGIBLE, http: 422, condition: "Vendor lacks required capability for turnover_kind, or vendor not ONBOARDED" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 422, condition: "Vendor already at capacity_slots of ISSUED+ACKED turnovers" }
  - { id: ERR_STORAGE_QUOTA_EXCEEDED, http: 422, condition: "Project storage_used_gb + new asset bytes would exceed storage_quota_gb" }
  - { id: ERR_QC_THRESHOLD_NOT_MET, http: 422, condition: "Deliverable reject requires qc_attempt_count >= 3" }
  - { id: ERR_QC_ATTEMPTS_EXHAUSTED, http: 422, condition: "Render from QC_FAILED requires qc_attempt_count < 3" }
  - { id: ERR_ASSET_NOT_CONFORMABLE, http: 422, condition: "ChangeList entry references an asset not in {VERIFIED, CONFORMED, LOCKED}" }
  - { id: ERR_ARTIST_MISMATCH, http: 403, condition: "X-User-ID does not match Booking.artist_email on check-in/complete/cancel-as-artist" }
  - { id: ERR_BAY_OCCUPIED, http: 409, condition: "EditBay has forward RESERVED or CHECKED_IN bookings blocking maintenance/decommission" }
  - { id: ERR_PROJECT_NOT_WRAPPABLE, http: 422, condition: "Project wrap/close/archive precondition failed (open deliverables, open review rounds, open change lists, or archive job not sealed)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Attempted transition on a resource already in a terminal state" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PostSupervisor
    description: "Owns the project lifecycle, bay management, deliverable delivery, bid award"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects"
      - "POST /post-production/projects/{project_id}/activate|wrap|close|archive"
      - "POST /post-production/projects/{project_id}/watermark-profiles (and activate/retire)"
      - "POST /post-production/projects/{project_id}/bays (and maintenance/release/decommission)"
      - "POST /post-production/projects/{project_id}/turnovers/{id}/issue|close|void"
      - "POST /post-production/projects/{project_id}/vendor-bids/{id}/award"
      - "POST /post-production/projects/{project_id}/deliverables/{id}/deliver|reject"
    shared_operations:
      - "GET list/detail endpoints across the project"

  - name: MediaManager
    description: "Owns ingest, proxies, storage, archives"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/batches (and start-ingest, finish-ingest, purge)"
      - "POST /post-production/projects/{project_id}/assets (and proxy-complete, verify)"
      - "POST /post-production/projects/{project_id}/archive-jobs (and start/verify/seal/cancel/retry)"
    shared_operations:
      - "GET project, batches, assets, archive-jobs"

  - name: DailiesCoordinator
    description: "Owns dailies packaging and distribution"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/dailies (and publish/revoke)"
    shared_operations:
      - "GET batches, assets, watermark-profiles, dailies"

  - name: ConformEditor
    description: "Owns conform, change lists, deliverable render"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/assets/{id}/conform|lock"
      - "POST /post-production/projects/{project_id}/turnovers (and stage)"
      - "POST /post-production/projects/{project_id}/change-lists (and apply/reject)"
      - "POST /post-production/projects/{project_id}/deliverables (and render/render-complete)"
      - "POST /post-production/projects/{project_id}/review-notes/{id}/ack|resolve"
    shared_operations:
      - "GET project, assets, turnovers, change-lists, review-rounds, deliverables"

  - name: ReviewerLead
    description: "Owns review rounds and note consolidation"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/review-rounds (and close-notes/approve/reject)"
    shared_operations:
      - "POST /post-production/projects/{project_id}/review-notes"
      - "GET dailies, review-rounds, review-notes"

  - name: QCOperator
    description: "Owns QC on deliverables"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/deliverables/{id}/enqueue-qc"
      - "POST /post-production/projects/{project_id}/deliverables/{id}/qc-reports"
    shared_operations:
      - "GET deliverables, qc-reports, assets"

  - name: FacilityAdmin
    description: "Owns vendors and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/vendors (and suspend/reinstate/offboard)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET vendors, projects"

  - name: VendorRep
    description: "External vendor representative; bids and returns turnovers"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/vendor-bids (own vendor_id only)"
      - "POST /post-production/projects/{project_id}/vendor-bids/{id}/withdraw (own bids)"
      - "POST /post-production/projects/{project_id}/turnovers/{id}/ack|return (own turnovers)"
    shared_operations:
      - "GET turnovers, vendor-bids, vendors, vendor load"

  - name: Artist
    description: "Books edit bays and checks in"
    identity: opaque
    exclusive_operations:
      - "POST /post-production/projects/{project_id}/bookings/{id}/check-in|complete (own bookings)"
    shared_operations:
      - "POST /post-production/projects/{project_id}/bookings (as self or via PostSupervisor)"
      - "POST /post-production/projects/{project_id}/bookings/{id}/cancel (own future bookings)"
      - "GET bookings, bays"
