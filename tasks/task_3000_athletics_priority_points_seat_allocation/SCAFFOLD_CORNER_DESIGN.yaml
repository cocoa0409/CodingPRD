      - name: the_certify_response_carries_the_points_sum_computed_in_that_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /athletics/point-recalculations/{id}/certify]
          - calculations.donor_rank_position.formula
        distinguishing_aspect: |
          certify both AGGREGATES (certified_points_sum) and ASSIGNS
          (Donor.rank_position) inside one request, so the 200 body must already
          contain the sum and the very next donor read must already show the
          ranks. An implementation that computes either lazily on the next read of
          the recalculation would return null or 0.00 here. The two donors are
          separated by ten points so the ordering is unambiguous, and the sum
          40.00 is not equal to either individual value, which rules out a body
          that echoes one donor's score.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Two donors: TOP with a 2000000-cent gift (certified_points 25.00) and BOT with a 1000000-cent gift (certified_points 15.00), both RECEIVED ATHLETICS_ANNUAL dated 2026-03-01."
            - "One cycle-2026 recalculation initiated by officer-1, run and communicated, with no disputes outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
