          - calculations.reviewer_window_occupancy
        excluded_because:
          difficulty_instance: half_open_interval_boundary / reviewer_half_open_window_aggregate_capacity_and_adjacency
          rationale: "The aggregate count of overlapping half-open windows, including the exactly-adjacent window that must NOT count, is the entire subject of that §1.8 instance."

