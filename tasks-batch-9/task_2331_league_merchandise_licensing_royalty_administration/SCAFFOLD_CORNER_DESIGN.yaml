          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "category JERSEY has deduction_cap_pct_bps 500 and deduction_hard_limit_bps 2000"
            - "licensee LIC_S2 ACTIVE with an ACTIVE agreement AGR_S2 and an AUTHORIZED DEPARTMENT authorization"
