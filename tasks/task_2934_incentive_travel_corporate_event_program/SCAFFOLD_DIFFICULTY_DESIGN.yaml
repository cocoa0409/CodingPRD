      - HTTP 201 and TaxAwardReport.status == "DRAFT".
      - award_value_cents == 443198 (521409 - round_half_up(521409 * 1500 / 10000) == 521409 - 78211).
      - gross_up_method == "FLAT_SUPPLEMENTAL" (snapshot of Program.gross_up_policy).
      - combined_rate_bp == 2200 — FED_SUPPLEMENTAL_BP only; FICA_BP and the state tier are absent.
      - gross_up_cents == 97504 (round_half_up(443198 * 2200 / 10000)).
      - reported_value_cents == 540702 (443198 + 97504).
      - Qualifier.${qb_id}.tax_status is still "PENDING_REPORT" (drafting does not file).
      - Program.reported_award_total_cents is still 0 (only filing adds to it).
  - name: gross_up_full_inverse_withholding_variant_on_travelled_winner
    grounds:
    - §1.3 taxable_award_gross_up.variants[full_gross_up]
