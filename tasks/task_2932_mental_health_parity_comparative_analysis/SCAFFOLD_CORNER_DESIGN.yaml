              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { tl_a_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 0, projected_plan_payments_cents: 1000000, projected_claims_count: 200 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_b_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Inventoried by the sponsor." }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_a_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "STEP_THERAPY", applied_to: "BOTH", description: "Inventoried by the compliance officer." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
