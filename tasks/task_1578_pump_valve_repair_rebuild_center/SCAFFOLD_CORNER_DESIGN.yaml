      - name: approve_nonexistent_quote_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) precedes state/business checks: approving an unknown quote id returns 404 even though no state evaluation is possible."
