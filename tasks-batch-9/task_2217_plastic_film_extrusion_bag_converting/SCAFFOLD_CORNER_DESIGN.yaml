        claim_type: role_permissions
        grounds:
          - roles.BlendEngineer
          - roles.QualityManager.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Approval is a QualityManager exclusive: the role that designs and submits a blend can never sign it off, and the denial happens at priority 2 before the recipe's state is even read."
        test_recipe:
          setup:
            - "recipe R-NF-0 SUBMITTED by u-be-1 and otherwise ready for approval"
          setup_api_calls:
