            - call: "POST /staff-assignments/${june_assignment_id}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${volunteer_id}"
            - call: "POST /staff-assignments/${june_assignment_id}/approve"
              payload: {}
              as: TourManager
              as_user_id: "tm-quinn"
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${volunteer_id}", tour_stop_id: "${august_stop_id}", duty: "COOK", shift_start_at: "2027-08-20T09:00:00Z", shift_end_at: "2027-08-20T19:00:00Z" }
              as: TourManager
              captures: { august_assignment_id: "$.data.id" }
            - call: "POST /staff-assignments/${august_assignment_id}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${volunteer_id}"
            - call: "POST /staff-assignments/${august_assignment_id}/approve"
