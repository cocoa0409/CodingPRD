          assert:
            - "the both-unknown call -> 404 with data.error_id == ERR_LINE_NOT_FOUND (line_id is declared first in input)"
            - "the site-only-unknown call -> 404 with data.error_id == ERR_TRIAL_SITE_NOT_FOUND"
            - "the valid call -> 201; TrialEntry.${entry_id}.trial_series_id == ${series_id}, line_id == ${line_id}, trial_site_id == ${site_id}, status == ENTERED"
