              payload: { company_name: "Acme One", account_type: "CORPORATE", credit_limit_cents: 100000000, default_warehouse_code: "ATL", po_required: true }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /packaging-distribution/accounts"
