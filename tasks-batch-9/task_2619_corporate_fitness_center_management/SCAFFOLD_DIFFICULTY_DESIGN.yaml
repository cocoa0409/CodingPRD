              payload: { action: "GRANT", badge_number: "B-1001" }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { m1_ver: $.data.version }
            - call: "POST /members/${m1_id}/waivers"
