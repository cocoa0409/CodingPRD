              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_8", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 200.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.6, pattern_repeat_loaded_mm: 200.0, stitch_rate_per_inch: 10.0 }
