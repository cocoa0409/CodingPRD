              payload: { vendor_id: "${vend}", style_id: "${st1}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-11T08:00:00Z", press_window_end: "2026-08-13T08:00:00Z", expected_ballot_style_version: "${st1_v_approved}" }
              as: BallotCoordinator
            - call: "GET /ballot-styles/${st1}"
