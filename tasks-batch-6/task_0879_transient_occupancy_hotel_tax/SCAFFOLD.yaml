# =============================================================================
# Transient-Occupancy / Hotel-Tax (TOT) Administration — SCAFFOLD (§1.0–§1.7)
# =============================================================================
scenario: "Transient-Occupancy / Hotel-Tax Administration: operator registration & certificate, monthly/quarterly TOT return & remittance, exemption (30-day/government) handling, OTA-platform collection agreement, audit & assessment, penalty/interest, delinquency & lien, refund"

domain_name: transient-occupancy-hotel-tax
api_prefix: ""

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate
  difficulty: Expert

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Taxing jurisdiction name" }
      - { name: tax_rate_bps, type: integer, source: input, description: "TOT rate in basis points (e.g., 1200 = 12%)" }
      - { name: interest_rate_monthly_bps, type: integer, source: input, default: 100, description: "Monthly delinquency interest in basis points (100 = 1%/month)" }
      - { name: refund_interest_monthly_bps, type: integer, source: input, default: 50, description: "Monthly overpayment (refund) interest in basis points (50 = 0.5%/month)" }
      - { name: lien_threshold_cents, type: integer, source: input, default: 500000, description: "Delinquent balance strictly above which a lien may be recorded" }
      - { name: exemption_min_stay_nights, type: integer, source: input, default: 30, description: "Minimum consecutive nights for the long-term stay exemption (>= is exempt)" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: legal_name, type: string, source: input, description: "Operator legal business name" }
      - { name: filing_frequency, type: enum, source: input, description: "MONTHLY | QUARTERLY" }
      - { name: certificate_number, type: string, source: system, description: "Registration certificate number, minted on activation; null before ACTIVE" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | DELINQUENT | SUSPENDED | REVOKED | CLOSED" }
      - { name: account_balance_cents, type: integer, source: computed, description: "Signed operator balance = SUM(LedgerEntry.amount_signed_cents); positive = owed to jurisdiction, negative = overpayment credit" }

  - name: Property
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: name, type: string, source: input, description: "Property/listing name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether the property is currently rentable" }

  - name: OTAPlatform
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Online travel agency / marketplace name" }
      - { name: registered, type: boolean, source: input, default: true, description: "Whether platform is registered to enter collection agreements" }

  - name: OTAAgreement
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: platform_id, type: string, source: input, description: "FK -> OTAPlatform.id" }
      - { name: collection_method, type: enum, source: input, description: "GROSS (platform collects & remits tax on full room charge; operator reports gross and takes an OTA credit) | NET (operator excludes OTA-collected receipts from its taxable base)" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Coverage end (exclusive, half-open interval); null = open-ended" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | TERMINATED" }

  - name: TaxReturn
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: period_start, type: datetime, source: input, description: "Tax period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Tax period end (inclusive)" }
      - { name: reporting_method, type: enum, source: input, default: "NET", description: "GROSS | NET — determines OTA receipt treatment in taxable-base computation" }
      - { name: line_items, type: array, source: input, description: "Per-property lines: [{ property_id, gross_receipts_cents }]; gross_receipts is the sum over lines" }
      - { name: gross_receipts_cents, type: integer, source: computed, description: "SUM of line_items[].gross_receipts_cents" }
      - { name: exempt_receipts_cents, type: integer, source: computed, description: "Sum of honored ExemptionClaim.amount_cents for this return (honored set depends on tax variant)" }
      - { name: taxable_receipts_cents, type: integer, source: computed, description: "gross_receipts_cents - exempt_receipts_cents (per partition invariant)" }
      - { name: tax_due_cents, type: integer, source: computed, description: "Self-reported tax = round-per-line then sum (see calc tax_due_computation)" }
      - { name: penalty_cents, type: integer, source: computed, description: "Late-filing/deficiency penalty (see calc penalty_interest_computation); 0 until delinquent" }
      - { name: interest_cents, type: integer, source: computed, description: "Delinquency interest accrued (see calc penalty_interest_computation); 0 until delinquent" }
      - { name: total_due_cents, type: integer, source: computed, description: "tax_due_cents + penalty_cents + interest_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "SUM of CLEARED Remittance.amount_cents applied to this return" }
      - { name: due_date, type: datetime, source: computed, description: "Filing/payment due date: last day of the month following period_end" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp when the return was FILED; null while DRAFT" }
      - { name: filing_status, type: enum, source: system, description: "Axis 1: DRAFT | FILED | AMENDED | SUPERSEDED" }
      - { name: settlement_status, type: enum, source: system, description: "Axis 2 (independent): UNPAID | PARTIAL | PAID" }

  - name: ExemptionClaim
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: input, description: "FK -> TaxReturn.id" }
      - { name: exemption_type, type: enum, source: input, description: "LONG_TERM_30DAY | GOVERNMENT | NONPROFIT" }
      - { name: guest_ref, type: string, source: input, description: "Guest/booking reference" }
      - { name: stay_nights, type: integer, source: input, default: 0, description: "Consecutive nights (only meaningful for LONG_TERM_30DAY)" }
      - { name: amount_cents, type: integer, source: input, description: "Receipts to exempt from the taxable base" }
      - { name: status, type: enum, source: system, description: "CLAIMED | VERIFIED | REJECTED" }

  - name: Remittance
    parent: TaxReturn
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: input, description: "FK -> TaxReturn.id" }
      - { name: ota_agreement_id, type: string, source: input, default: null, description: "FK -> OTAAgreement.id; set when remitter is OTA, null when OPERATOR" }
      - { name: remitter, type: enum, source: input, description: "OPERATOR | OTA" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount applied to the return" }
      - { name: status, type: enum, source: system, description: "RECEIVED | CLEARED | REVERSED" }

  - name: Audit
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: period_start, type: datetime, source: input, description: "Audit coverage start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Audit coverage end (inclusive)" }
      - { name: classification, type: enum, source: system, default: "NONE", description: "NONE | NEGLIGENCE | FRAUD — set when an assessment is proposed; drives penalty variant" }
      - { name: status, type: enum, source: system, description: "OPENED | FIELDWORK | PROPOSED | RESPONSE | ISSUED | CLOSED_NO_CHANGE" }

  - name: Assessment
    parent: Audit
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: input, description: "FK -> Audit.id" }
      - { name: audited_taxable_cents, type: integer, source: input, description: "Auditor-determined taxable receipts across the audited returns (only VERIFIED exemptions honored)" }
      - { name: assessed_tax_cents, type: integer, source: computed, description: "Auditor-recomputed tax (AUDIT variant of tax_due_computation)" }
      - { name: self_reported_tax_cents, type: integer, source: computed, description: "Sum of self-reported tax_due_cents across the audited returns (STANDARD variant), for variance" }
      - { name: deficiency_cents, type: integer, source: computed, description: "assessed_tax_cents - self_reported_tax_cents (floored at 0)" }
      - { name: penalty_cents, type: integer, source: computed, description: "Deficiency penalty (variant by Audit.classification: NEGLIGENCE vs FRAUD)" }
      - { name: interest_cents, type: integer, source: computed, description: "Interest on deficiency over months delinquent" }
      - { name: total_assessed_cents, type: integer, source: computed, description: "deficiency_cents + penalty_cents + interest_cents" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ISSUED | APPEALED | FINAL | ABATED | SETTLED" }

  - name: Appeal
    parent: Assessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> Assessment.id" }
      - { name: grounds, type: string, source: input, description: "Taxpayer grounds for appeal" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of INFO_REQUESTED -> UNDER_REVIEW cycles completed" }
      - { name: decision, type: enum, source: system, default: null, description: "UPHELD | REDUCED | ABATED — set on DECIDED" }
      - { name: reduced_total_cents, type: integer, source: input, default: null, description: "For REDUCED decisions: the new total_assessed the appeal fixes" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | DECIDED" }

  - name: Lien
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: amount_cents, type: integer, source: system, description: "Snapshot of Operator.account_balance_cents at record time" }
      - { name: status, type: enum, source: system, description: "RECORDED | RELEASED" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp when recorded" }

  - name: RefundClaim
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: tax_return_id, type: string, source: input, default: null, description: "FK -> TaxReturn.id; set for return-level overpayment, null for account-level" }
      - { name: reason, type: enum, source: input, description: "OVERPAYMENT (statutory overpayment) | AUDIT_ADJUSTMENT (overpayment arising from an abated/reduced assessment)" }
      - { name: principal_cents, type: integer, source: input, description: "Overpayment principal requested" }
      - { name: overpayment_date, type: datetime, source: input, description: "Date the overpayment was made (interest anchor for OVERPAYMENT variant)" }
      - { name: interest_cents, type: integer, source: computed, description: "Overpayment interest (variant by reason; see refund_interest_accrual)" }
      - { name: total_refund_cents, type: integer, source: computed, description: "principal_cents + interest_cents" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | PAID" }

  - name: LedgerEntry
    parent: Operator
    common_fields: false
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: entry_type, type: enum, source: system, description: "TAX_DUE | PENALTY | INTEREST | REMITTANCE | REMITTANCE_REVERSAL | ASSESSMENT | ABATEMENT | REFUND | ADJUSTMENT" }
      - { name: amount_signed_cents, type: integer, source: system, description: "Signed amount; debits to operator (owed) positive, credits (payments/refunds) negative" }
      - { name: source_ref, type: string, source: system, description: "id of the originating TaxReturn/Remittance/Assessment/RefundClaim" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Operator
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /operators/{operatorId}/activate"
        actor: TaxAdmin
        preconditions: ["Operator in PENDING (else ERR_INVALID_STATE)"]
        side_effects:
          - "Mint certificate_number"
          - "status -> ACTIVE"
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (when account_balance_cents becomes strictly positive on a past-due return or issued assessment)"
        actor: system
        preconditions: ["account_balance_cents > 0", "at least one FILED/AMENDED return past its due_date with settlement_status != PAID, OR an ISSUED assessment"]
        side_effects: ["status -> DELINQUENT"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (when account_balance_cents <= 0 after a CLEARED remittance, refund, or abatement)"
        actor: system
        preconditions: ["account_balance_cents <= 0"]
        side_effects: ["status -> ACTIVE", "RELEASE any RECORDED Lien for this operator (cascade)"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /operators/{operatorId}/suspend"
        actor: TaxAdmin
        preconditions: []
        side_effects: ["status -> SUSPENDED"]
      - from: DELINQUENT
        to: SUSPENDED
        trigger: "POST /operators/{operatorId}/suspend"
        actor: TaxAdmin
        preconditions: []
        side_effects: ["status -> SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /operators/{operatorId}/reinstate"
        actor: TaxAdmin
        preconditions: []
        side_effects: ["status -> ACTIVE (re-evaluates DELINQUENT if balance still > 0)"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /operators/{operatorId}/revoke"
        actor: TaxAdmin
        preconditions: []
        side_effects: ["status -> REVOKED"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /operators/{operatorId}/close"
        actor: TaxAdmin
        preconditions: ["account_balance_cents == 0 (ERR_OPERATOR_NOT_SETTLED)", "no OPENED/FIELDWORK/PROPOSED/RESPONSE audit (ERR_AUDIT_IN_PROGRESS)"]
        side_effects: ["status -> CLOSED"]

  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /returns/{returnId}/file"
        actor: Operator
        preconditions:
          - "parent Operator.status == ACTIVE or DELINQUENT (ERR_OPERATOR_NOT_ACTIVE) [cross-entity]"
          - "period does not overlap another non-SUPERSEDED return for this operator (ERR_PERIOD_OVERLAP)"
          - "gross_receipts_cents == taxable_receipts_cents + exempt_receipts_cents (ERR_RECEIPTS_MISMATCH)"
        side_effects:
          - "filing_status -> FILED; filed_at = clock"
          - "Compute tax_due_cents (STANDARD variant); post TAX_DUE LedgerEntry (+tax_due_cents) [cascade -> Operator.account_balance -> possible DELINQUENT]"
          - "If filed after due_date: compute penalty_cents & interest_cents; post PENALTY and INTEREST LedgerEntries"
      - from: FILED
        to: AMENDED
        trigger: "POST /returns/{returnId}/amend"
        actor: Operator
        preconditions:
          - "return not covered by an ISSUED/FINAL assessment (ERR_RETURN_UNDER_ASSESSMENT)"
        side_effects:
          - "filing_status -> AMENDED"
          - "Recompute tax_due_cents; post ADJUSTMENT LedgerEntry for the delta (tax_new - tax_old)"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /returns/{returnId}/amend"
        actor: Operator
        preconditions: ["return not covered by an ISSUED/FINAL assessment (ERR_RETURN_UNDER_ASSESSMENT)"]
        side_effects: ["Recompute tax_due_cents; post ADJUSTMENT LedgerEntry for the delta"]
      - from: FILED
        to: SUPERSEDED
        trigger: "system (when a replacement return for the same period is filed under correction)"
        actor: system
        preconditions: []
        side_effects: ["filing_status -> SUPERSEDED"]
      - note: "settlement_status is an INDEPENDENT parallel axis driven by remittances, not by the filing_status transitions above"
      - from: UNPAID
        to: PARTIAL
        trigger: "system (Remittance CLEARED with 0 < amount_paid_cents < total_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["settlement_status -> PARTIAL"]
      - from: PARTIAL
        to: PAID
        trigger: "system (Remittance CLEARED bringing amount_paid_cents >= total_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["settlement_status -> PAID", "If all past-due returns PAID -> Operator may return ACTIVE (cascade)"]
      - from: UNPAID
        to: PAID
        trigger: "system (single Remittance CLEARED with amount_paid_cents >= total_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["settlement_status -> PAID"]
      - from: PAID
        to: PARTIAL
        trigger: "system (Remittance REVERSED dropping amount_paid_cents below total_due_cents)"
        actor: system
        preconditions: []
        side_effects: ["settlement_status -> PARTIAL (compensation)"]

  - entity: ExemptionClaim
    initial_state: CLAIMED
    terminal_states: [REJECTED]
    transitions:
      - from: CLAIMED
        to: VERIFIED
        trigger: "POST /exemptions/{exemptionId}/verify"
        actor: TaxAdmin
        preconditions:
          - "parent TaxReturn.filing_status != SUPERSEDED"
          - "If exemption_type == LONG_TERM_30DAY: stay_nights >= Jurisdiction.exemption_min_stay_nights (ERR_EXEMPTION_INELIGIBLE)"
        side_effects: ["status -> VERIFIED (no receipts movement; already honored in STANDARD self-report)"]
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /exemptions/{exemptionId}/reject"
        actor: TaxAdmin
        preconditions: []
        side_effects:
          - "status -> REJECTED"
          - "If parent return already FILED: taxable_receipts_cents += amount_cents; exempt_receipts_cents -= amount_cents (gross unchanged — partition invariant); recompute tax_due_cents; post ADJUSTMENT LedgerEntry for the tax delta [cascade -> Operator.account_balance]"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /exemptions/{exemptionId}/reject"
        actor: TaxAdmin
        preconditions: []
        side_effects:
          - "status -> REJECTED (compensation: reverse the exemption)"
          - "taxable_receipts_cents += amount_cents; exempt_receipts_cents -= amount_cents; recompute tax_due_cents; post ADJUSTMENT LedgerEntry for the tax delta"

  - entity: Remittance
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: CLEARED
        trigger: "POST /remittances/{remittanceId}/clear"
        actor: TaxAdmin
        preconditions:
          - "parent TaxReturn.filing_status in {FILED, AMENDED} (ERR_INVALID_STATE)"
          - "amount_cents <= (total_due_cents - amount_paid_cents) (ERR_REMITTANCE_EXCEEDS_DUE)"
        side_effects:
          - "status -> CLEARED"
          - "post REMITTANCE LedgerEntry (-amount_cents) [cascade -> Operator.account_balance -> possible DELINQUENT->ACTIVE + Lien release]"
          - "recompute return.settlement_status (parallel axis)"
      - from: CLEARED
        to: REVERSED
        trigger: "POST /remittances/{remittanceId}/reverse"
        actor: TaxAdmin
        preconditions: []
        side_effects:
          - "status -> REVERSED"
          - "post REMITTANCE_REVERSAL LedgerEntry (+amount_cents) — conserves account_balance == SUM(ledger) [compensation]"
          - "recompute return.settlement_status (may drop PAID->PARTIAL)"

  - entity: OTAAgreement
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /ota-agreements/{agreementId}/activate"
        actor: TaxAdmin
        preconditions:
          - "OTAPlatform.registered == true (ERR_PLATFORM_NOT_REGISTERED)"
          - "coverage interval [effective_date, end_date) does not overlap another ACTIVE agreement for the same operator+platform (ERR_AGREEMENT_OVERLAP)"
        side_effects: ["status -> ACTIVE"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ota-agreements/{agreementId}/terminate"
        actor: TaxAdmin
        preconditions: []
        side_effects: ["status -> TERMINATED"]

  - entity: Audit
    initial_state: OPENED
    terminal_states: [ISSUED, CLOSED_NO_CHANGE]
    transitions:
      - from: OPENED
        to: FIELDWORK
        trigger: "POST /audits/{auditId}/begin-fieldwork"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: FIELDWORK
        to: PROPOSED
        trigger: "POST /audits/{auditId}/assessments (propose)"
        actor: Auditor
        preconditions: ["at least one FILED/AMENDED return in the audit period (ERR_NO_RETURNS_IN_PERIOD)"]
        side_effects: ["create Assessment (PROPOSED); set Audit.classification (NEGLIGENCE|FRAUD)"]
      - from: PROPOSED
        to: RESPONSE
        trigger: "POST /audits/{auditId}/record-response"
        actor: Auditor
        preconditions: []
        side_effects: ["records taxpayer response"]
      - from: RESPONSE
        to: FIELDWORK
        trigger: "POST /audits/{auditId}/reopen-fieldwork"
        actor: Auditor
        preconditions: ["Assessment still PROPOSED"]
        side_effects: ["cyclic: return to FIELDWORK for another proposal round; abandon PROPOSED assessment (ABATED)"]
      - from: PROPOSED
        to: ISSUED
        trigger: "POST /assessments/{assessmentId}/issue"
        actor: TaxAdmin
        preconditions: ["Assessment PROPOSED (ERR_INVALID_STATE)", "actor is TaxAdmin, distinct role from the proposing Auditor (four-eyes)"]
        side_effects:
          - "Audit.status -> ISSUED; Assessment.status -> ISSUED"
          - "post ASSESSMENT LedgerEntry (+total_assessed_cents) [cascade -> Operator.account_balance -> DELINQUENT -> lien eligibility]"
      - from: RESPONSE
        to: ISSUED
        trigger: "POST /assessments/{assessmentId}/issue"
        actor: TaxAdmin
        preconditions: ["Assessment PROPOSED"]
        side_effects: ["Audit.status -> ISSUED; Assessment.status -> ISSUED; post ASSESSMENT LedgerEntry (+total_assessed_cents)"]
      - from: FIELDWORK
        to: CLOSED_NO_CHANGE
        trigger: "POST /audits/{auditId}/close-no-change"
        actor: Auditor
        preconditions: []
        side_effects: ["status -> CLOSED_NO_CHANGE (no ledger impact)"]

  - entity: Assessment
    initial_state: PROPOSED
    terminal_states: [FINAL, ABATED, SETTLED]
    transitions:
      - from: PROPOSED
        to: ISSUED
        trigger: "POST /assessments/{assessmentId}/issue"
        actor: TaxAdmin
        preconditions: ["parent Audit.status in {PROPOSED, RESPONSE} (ERR_INVALID_STATE) [cross-entity]"]
        side_effects: ["status -> ISSUED; post ASSESSMENT LedgerEntry (+total_assessed_cents)"]
      - from: PROPOSED
        to: ABATED
        trigger: "system (Audit reopen-fieldwork abandons the proposal)"
        actor: system
        preconditions: []
        side_effects: ["status -> ABATED (no ledger impact — never issued)"]
      - from: ISSUED
        to: APPEALED
        trigger: "POST /assessments/{assessmentId}/appeals (submit)"
        actor: Operator
        preconditions: ["Assessment ISSUED (ERR_INVALID_STATE)"]
        side_effects: ["status -> APPEALED; create Appeal (SUBMITTED)"]
      - from: APPEALED
        to: FINAL
        trigger: "system (Appeal DECIDED with decision UPHELD)"
        actor: system
        preconditions: []
        side_effects: ["status -> FINAL (assessment stands; ledger unchanged)"]
      - from: APPEALED
        to: ABATED
        trigger: "system (Appeal DECIDED with decision ABATED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ABATED"
          - "post ABATEMENT LedgerEntry (-total_assessed_cents) — reverses the ASSESSMENT debit [compensation; conserves ledger]"
      - from: APPEALED
        to: FINAL
        trigger: "system (Appeal DECIDED with decision REDUCED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> FINAL at reduced_total_cents"
          - "post ADJUSTMENT LedgerEntry (-(total_assessed_cents - reduced_total_cents))"
      - from: ISSUED
        to: SETTLED
        trigger: "system (operator account_balance returns to 0 while assessment ISSUED/FINAL)"
        actor: system
        preconditions: ["account_balance_cents <= 0"]
        side_effects: ["status -> SETTLED"]
      - from: FINAL
        to: SETTLED
        trigger: "system (operator account_balance returns to 0)"
        actor: system
        preconditions: ["account_balance_cents <= 0"]
        side_effects: ["status -> SETTLED"]

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [DECIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appealId}/begin-review"
        actor: TaxAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /appeals/{appealId}/request-info"
        actor: TaxAdmin
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appealId}/provide-info"
        actor: Operator
        preconditions: []
        side_effects: ["round_count += 1 (cyclic negotiation loop)"]
      - from: UNDER_REVIEW
        to: DECIDED
        trigger: "POST /appeals/{appealId}/decide"
        actor: TaxAdmin
        preconditions:
          - "parent Assessment.status == APPEALED (ERR_INVALID_STATE) [cross-entity]"
          - "If decision == REDUCED: reduced_total_cents provided and < total_assessed_cents (ERR_INVALID_REQUEST)"
        side_effects: ["status -> DECIDED; set decision; drive parent Assessment to FINAL/ABATED (cascade)"]

  - entity: Lien
    initial_state: RECORDED
    terminal_states: [RELEASED]
    transitions:
      - from: RECORDED
        to: RELEASED
        trigger: "POST /liens/{lienId}/release OR system (operator balance <= 0)"
        actor: TaxAdmin | system
        preconditions: []
        side_effects: ["status -> RELEASED; recorded_at frozen"]

  - entity: RefundClaim
    initial_state: REQUESTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /refund-claims/{refundId}/approve"
        actor: TaxAdmin
        preconditions:
          - "principal_cents <= -account_balance_cents i.e. operator holds an overpayment credit at least this large (ERR_REFUND_EXCEEDS_OVERPAYMENT)"
        side_effects: ["status -> APPROVED; compute interest_cents & total_refund_cents (variant by reason)"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /refund-claims/{refundId}/deny"
        actor: TaxAdmin
        preconditions: []
        side_effects: ["status -> DENIED"]
      - from: APPROVED
        to: PAID
        trigger: "POST /refund-claims/{refundId}/pay"
        actor: TaxAdmin
        preconditions: []
        side_effects:
          - "status -> PAID"
          - "post REFUND LedgerEntry (+total_refund_cents) — refund pays down the operator's negative (credit) balance toward 0 [cascade]"

concurrency_rules:
  - rule_id: lien-record-stale-operator
    parent_entity: Operator
    write_endpoint: "POST /operators/{operatorId}/liens"
    occ_field: "expected_operator_version"
    description: |
      Recording a lien snapshots the operator's delinquent balance at record
      time. If the operator's version has advanced since the admin last read it
      (an intervening CLEARED remittance posted a partial payment, reducing the
      balance while leaving the operator DELINQUENT), the admin's view is stale
      and the lien would record a wrong amount. The write is rejected on the
      stale version even though the DELINQUENT state precondition still holds.
    error_id: ERR_STALE_OPERATOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tax_due_computation
    trigger: "TaxReturn file / amend; Assessment propose"
    algorithm: tiered_pricing
    formula: |
      rate = Jurisdiction.tax_rate_bps / 10000
      # Per-line taxable, then round each line's tax, THEN sum (pinned order).
      For each line in line_items:
        line_exempt = SUM(honored ExemptionClaim.amount_cents allocated to line.property_id)
        line_taxable = line.gross_receipts_cents - line_exempt
        line_tax = round_half_up(line_taxable * rate)   # round PER LINE
      tax = SUM(line_tax over all lines)                # then sum
      # NET reporting excludes receipts collected by an ACTIVE GROSS/NET OTA
      # agreement from the line's gross before taxable is derived (see variants).
    input_set: "line_items of the return; honored exemption set depends on variant"
    constants:
      ROUNDING: round_half_up
    precision: "whole cents, round_half_up per line"
    variants:
      - name: STANDARD
        when: "self-reported return (file/amend): honored exemptions = all CLAIMED or VERIFIED (not REJECTED)"
        difference: "Includes CLAIMED-but-unverified exemptions in exempt set -> lower taxable, lower tax"
      - name: AUDIT
        when: "Assessment.assessed_tax_cents on propose: honored exemptions = VERIFIED only"
        difference: "Excludes CLAIMED-but-unverified exemptions -> higher taxable, higher tax; drives deficiency"

  - name: refund_interest_accrual
    trigger: "RefundClaim approve"
    algorithm: chronological
    formula: |
      months = whole months between the anchor date and the clock at approval
               (floor of elapsed days / 30)
      interest = round_half_up(principal_cents * (Jurisdiction.refund_interest_monthly_bps/10000) * months)
      total_refund_cents = principal_cents + interest
    input_set: "single RefundClaim; anchor date differs by variant"
    constants:
      DAYS_PER_MONTH: 30
    precision: "whole cents, round_half_up"
    variants:
      - name: STATUTORY_OVERPAYMENT
        when: "reason == OVERPAYMENT"
        difference: "Anchor = overpayment_date (earlier) -> more months -> more interest"
      - name: AUDIT_ADJUSTMENT
        when: "reason == AUDIT_ADJUSTMENT (overpayment created by abated/reduced assessment)"
        difference: "Anchor = RefundClaim.created_at (claim filing, later) -> fewer months -> less interest"

  - name: penalty_interest_computation
    trigger: "TaxReturn file after due_date; Assessment propose"
    algorithm: threshold
    formula: |
      base = deficiency_or_unpaid_tax_cents
      months_late = max(0, whole months between due_date and clock (floor days/30))
      # Non-linear tiered penalty rate with nested min/max over 3+ inputs:
      if months_late <= 0: penalty_rate = 0
      else: penalty_rate = min(0.25, 0.10 + 0.05 * (months_late - 1))
      penalty = round_half_up(base * penalty_rate)
      interest = round_half_up(base * (Jurisdiction.interest_rate_monthly_bps/10000) * months_late)
    input_set: "one return's unpaid tax, or one assessment's deficiency"
    constants:
      PENALTY_FLOOR_RATE: 0.10
      PENALTY_STEP: 0.05
      PENALTY_CAP_RATE: 0.25
    precision: "whole cents, round_half_up"
    variants:
      - name: NEGLIGENCE
        when: "Audit.classification == NEGLIGENCE"
        difference: "penalty_rate = 0.10 flat on deficiency (not time-tiered)"
      - name: FRAUD
        when: "Audit.classification == FRAUD"
        difference: "penalty_rate = 0.25 flat on deficiency"

  - name: operator_account_balance
    trigger: "any LedgerEntry post (file, clear, reverse, issue, abate, refund, adjustment)"
    algorithm: aggregation
    formula: |
      account_balance_cents = SUM(LedgerEntry.amount_signed_cents WHERE operator_id == operator.id)
      # Invariant: this equals the running total of every posted entry with no drift.
    input_set: "all LedgerEntry rows for the operator, no status filter (append-only log)"
    precision: "whole cents (exact integers)"

  - name: return_settlement_status
    trigger: "Remittance clear / reverse"
    algorithm: aggregation
    formula: |
      amount_paid_cents = SUM(Remittance.amount_cents WHERE tax_return_id == return.id AND status == CLEARED)
      if amount_paid_cents <= 0: UNPAID
      elif amount_paid_cents < total_due_cents: PARTIAL
      else: PAID
    input_set: "CLEARED remittances for the return only"
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Referenced resources exist (left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "Operator acting via entity_backed identity owns the target resource (X-User-ID == resource.operator_id chain)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Operator-role write endpoints"
  - priority: 5
    category: state
    check: "Target resource in a state permitting this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_operator_version matches Operator.version"
    error_id: ERR_STALE_OPERATOR_VERSION
    http_status: 412
    applies_to: "POST /operators/{operatorId}/liens"
  - priority: 7
    category: business_temporal
    check: "Return period must not overlap another non-SUPERSEDED return; OTA agreement coverage must not overlap another ACTIVE agreement (same operator+platform)"
    error_id: "ERR_PERIOD_OVERLAP / ERR_AGREEMENT_OVERLAP"
    http_status: 409
    applies_to: "POST /returns/{returnId}/file, POST /ota-agreements/{agreementId}/activate"
  - priority: 8
    category: business_referential
    check: "Referenced OTAPlatform registered; referenced OTAAgreement ACTIVE and covers the remittance's period"
    error_id: "ERR_PLATFORM_NOT_REGISTERED / ERR_OTA_AGREEMENT_INACTIVE"
    http_status: 409
    applies_to: "POST /ota-agreements/{agreementId}/activate, remittance clear with remitter OTA"
  - priority: 9
    category: business_safety
    check: "Exemption eligibility (LONG_TERM_30DAY requires stay_nights >= exemption_min_stay_nights)"
    error_id: ERR_EXEMPTION_INELIGIBLE
    http_status: 422
    applies_to: "POST /exemptions/{exemptionId}/verify"
  - priority: 10
    category: business_constraint
    check: "Receipts partition guard: sum of honored ExemptionClaim.amount_cents must not exceed gross_receipts_cents (taxable would go negative). The partition gross == taxable + exempt is maintained by construction (taxable := gross - exempt); this guard rejects an over-claimed exempt total."
    error_id: ERR_RECEIPTS_MISMATCH
    http_status: 422
    applies_to: "POST /returns/{returnId}/file"
  - priority: 11
    category: business_fiscal
    check: "Remittance amount must not exceed remaining amount due; refund principal must not exceed held overpayment credit"
    error_id: "ERR_REMITTANCE_EXCEEDS_DUE / ERR_REFUND_EXCEEDS_OVERPAYMENT"
    http_status: 422
    applies_to: "POST /remittances/{remittanceId}/clear, POST /refund-claims/{refundId}/approve"
  - priority: 12
    category: business_fiscal
    check: "Lien may be recorded only when delinquent balance strictly exceeds jurisdiction lien_threshold_cents"
    error_id: ERR_BELOW_LIEN_THRESHOLD
    http_status: 422
    applies_to: "POST /operators/{operatorId}/liens"
  - priority: 13
    category: business_constraint
    check: "Well-formed body: required fields present, non-negative amounts, valid enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

