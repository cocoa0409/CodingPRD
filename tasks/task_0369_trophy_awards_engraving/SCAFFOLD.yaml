# =============================================================================
# PRD Benchmark Seed Tables — task_0369_trophy_awards_engraving
# Trophy, Awards & Engraving Shop
# Difficulty: Expert
# =============================================================================

scenario: |
  Trophy, Awards & Engraving Shop: product catalog & customization, engraving
  text/logo proof, quantity & rush pricing, order & due date, component assembly,
  reorder, proof approval, pickup/ship

domain_name: trophy-awards-engraving
api_prefix: ""
# Flat/hybrid multi-collection API: top-level collections are /orders, /customers,
# /components, /catalog-products, /rush-policies, /promo-codes, /order-lines,
# /component-allocations, /proofs. No single shared URL prefix; api_prefix is empty.

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Order.version for line add / supersede-reorder
    - cascading_side_effects        # proof reject -> line revert -> component release; assembly -> component consume
    - dual_variant_calculation      # estimate (provisional) vs invoice (final) pricing; on-time-rate scoring
    - rate_threshold_triggers       # rush surcharge breakpoints, volume-discount tiers, component low-stock gate

  entity_topology: hybrid
  # Orders own OrderLines (tree); OrderLines own Proofs (tree); Components/PromoCodes/
  # RushPolicy/Customer are flat peers referenced by FK; ComponentAllocation is a
  # junction (OrderLine <-> Component). Mix of nested + flat = hybrid.

  state_machine_shape: parallel
  # Order carries two independent dimensions (production_status × payment_status);
  # Proof is cyclic (revision rounds); Fulfillment is branching (PICKUP vs SHIP).

  relationship_patterns:
    - one_to_many        # Order->OrderLine, OrderLine->Proof
    - many_to_many       # OrderLine<->Component via ComponentAllocation
    - cross_aggregate    # OrderLine references Catalog; Order references Customer/PromoCode
    - self_referential   # Order.reorder_source_order_id -> Order.id (reorder lineage)

  role_model: peer_roles
  # Customer owns own orders (entity_backed); ShopStaff runs production/proofs;
  # ShopManager handles pricing overrides, component receiving, cancellation.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ------- Customer (role-backing, flat) -------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login / contact email", constraints: "unique, non-empty" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: org_name, type: string, source: input, description: "Organization / club name", default: null }
      - { name: lifetime_completed_orders, type: integer, source: computed, default: 0, description: "Count of this customer's orders whose production_status == FULFILLED" }
      - { name: on_time_rate_pct, type: number, source: computed, default: null, description: "Pct of FULFILLED orders shipped/picked-up on or before due_date; see calc customer_on_time_rate; null until first FULFILLED order" }

  # ------- Catalog (configuration, flat) -------
  - name: CatalogProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU", constraints: "unique, non-empty" }
      - { name: name, type: string, source: input, description: "Product display name (e.g. 'Acrylic Star Award')" }
      - { name: product_type, type: enum, source: input, description: "TROPHY | PLAQUE | MEDAL | ACRYLIC | CRYSTAL" }
      - { name: base_price_cents, type: integer, source: input, description: "Per-unit base price before engraving/options", constraints: ">= 0" }
      - { name: engraving_price_per_char_cents, type: integer, source: input, description: "Per-engraved-character surcharge per unit", constraints: ">= 0" }
      - { name: logo_setup_fee_cents, type: integer, source: input, description: "One-time per-line fee when a line includes a logo proof", constraints: ">= 0" }
      - { name: standard_lead_days, type: integer, source: input, description: "Business days from CONFIRMED to producible under STANDARD service", constraints: ">= 1" }
      - { name: bom, type: array, source: input, description: "Bill of materials: list of { component_id, qty_per_unit }; each component_id is FK -> Component.id (declared on ComponentAllocation, mirrored here as config)" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether product can be added to new lines; INACTIVE products reject new lines but existing lines persist" }

  # ------- Component (allocation pool, flat) -------
  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Component code (e.g. 'BASE-WALNUT-8')", constraints: "unique, non-empty" }
      - { name: name, type: string, source: input, description: "Component name" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical units in stock", constraints: ">= 0; raised by POST receive, lowered by consume" }
      - { name: allocated_qty, type: integer, source: computed, default: 0, description: "Sum of qty across ComponentAllocation rows for this component in status RESERVED" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "on_hand_qty - allocated_qty; MUST never be negative (calc component_available)" }
      - { name: reorder_point, type: integer, source: input, default: 0, description: "Low-stock threshold; available_qty <= reorder_point flags low_stock" }
      - { name: low_stock, type: boolean, source: computed, default: false, description: "True iff available_qty <= reorder_point (calc component_available)" }

  # ------- RushPolicy (configuration, flat, singleton-ish) -------
  - name: RushPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy label" }
      - { name: standard_surcharge_pct, type: number, source: input, default: 0, description: "STANDARD service surcharge over base (normally 0)" }
      - { name: expedited_surcharge_pct, type: number, source: input, description: "EXPEDITED surcharge pct (e.g. 0.25) applied when 3 <= business_days_to_due < standard_lead_days" }
      - { name: rush_surcharge_pct, type: number, source: input, description: "RUSH surcharge pct (e.g. 0.50) applied when 1 <= business_days_to_due < 3" }
      - { name: rush_min_business_days, type: integer, source: input, default: 1, description: "Minimum business days to due_date the shop will accept; below this -> ERR_DUE_DATE_INFEASIBLE" }
      - { name: active, type: boolean, source: input, default: true, description: "Exactly one RushPolicy may be active; pricing reads the active policy" }

  # ------- PromoCode (configuration, flat) -------
  - name: PromoCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Promo code string", constraints: "unique, uppercase" }
      - { name: kind, type: enum, source: input, description: "PERCENT | FLAT" }
      - { name: percent_off, type: number, source: input, default: null, description: "Fraction off (0..1) when kind==PERCENT" }
      - { name: flat_off_cents, type: integer, source: input, default: null, description: "Cents off when kind==FLAT" }
      - { name: min_subtotal_cents, type: integer, source: input, default: 0, description: "Discount applies only if line+engraving subtotal >= this" }
      - { name: max_uses, type: integer, source: input, default: null, description: "Total redemptions allowed; null = unlimited" }
      - { name: uses_count, type: integer, source: computed, default: 0, description: "Count of CONFIRMED orders that redeemed this code" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether code can be applied" }

  # ------- Order (parent resource, parallel state, OCC) -------
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the order" }
      - { name: promo_code_id, type: string, source: input, default: null, description: "FK -> PromoCode.id; applied promo, locked at CONFIRMED" }
      - { name: reorder_source_order_id, type: string, source: input, default: null, description: "FK -> Order.id; when present this order is a reorder clone of that order" }
      - { name: service_level, type: enum, source: input, description: "STANDARD | EXPEDITED | RUSH; set at create, may change while DRAFT only" }
      - { name: due_date, type: datetime, source: input, description: "Customer-requested due date (date, UTC midnight)" }
      - { name: production_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PRICED | CONFIRMED | IN_PRODUCTION | READY | FULFILLED | CANCELLED (state machine Order.production)" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED (independent dimension; see Order.payment machine)" }
      - { name: rush_tier, type: enum, source: computed, default: null, description: "Resolved at PRICED: STANDARD | EXPEDITED | RUSH from business_days_to_due vs active RushPolicy" }
      - { name: estimate_subtotal_cents, type: integer, source: computed, default: 0, description: "Provisional subtotal over all lines at PRICED (calc order_pricing variant=ESTIMATE)" }
      - { name: estimate_total_cents, type: integer, source: computed, default: 0, description: "Provisional grand total incl rush+discount at PRICED (calc order_pricing variant=ESTIMATE)" }
      - { name: invoice_subtotal_cents, type: integer, source: computed, default: null, description: "Final subtotal locked at CONFIRMED (calc order_pricing variant=INVOICE)" }
      - { name: invoice_total_cents, type: integer, source: computed, default: null, description: "Final grand total locked at CONFIRMED (calc order_pricing variant=INVOICE)" }
      - { name: deposit_due_cents, type: integer, source: computed, default: null, description: "ceil(invoice_total_cents * DEPOSIT_PCT) locked at CONFIRMED (calc deposit_due)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of Payment.amount_cents for CAPTURED payments minus REFUNDED" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Count of OrderLine rows on this order" }
      - { name: ready_at, type: datetime, source: system, default: null, description: "Timestamp production_status entered READY (all lines ASSEMBLED)" }
      - { name: fulfilled_at, type: datetime, source: system, default: null, description: "Timestamp production_status entered FULFILLED" }
      - { name: due_date_met, type: boolean, source: computed, default: null, description: "At FULFILLED: fulfilled_at <= due_date (date compare); null before FULFILLED" }

  # ------- OrderLine (child of Order) -------
  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; parent order" }
      - { name: catalog_product_id, type: string, source: input, description: "FK -> CatalogProduct.id; product being customized" }
      - { name: quantity, type: integer, source: input, description: "Units on this line", constraints: ">= 1" }
      - { name: engraving_text, type: string, source: input, default: "", description: "Per-unit engraving text (same on every unit of the line)" }
      - { name: include_logo, type: boolean, source: input, default: false, description: "Whether this line carries a logo proof (adds logo_setup_fee_cents once)" }
      - { name: line_status, type: enum, source: system, default: "PENDING", description: "PENDING | ALLOCATED | ENGRAVING | ASSEMBLED (state machine OrderLine); reverts to PENDING on proof CHANGES_REQUESTED" }
      - { name: assembled_count, type: integer, source: computed, default: 0, description: "Units assembled so far; equals quantity when ASSEMBLED" }
      - { name: char_count, type: integer, source: computed, default: 0, description: "len(engraving_text) with whitespace counted; drives per-char engraving price" }
      - { name: line_subtotal_cents, type: integer, source: computed, default: 0, description: "quantity*(base_price + char_count*per_char) + (logo_setup_fee if include_logo) (calc line_subtotal)" }
      - { name: volume_tier, type: enum, source: computed, default: null, description: "NONE | TIER1 | TIER2 | TIER3 by quantity breakpoints (calc volume_discount)" }
      - { name: volume_discount_cents, type: integer, source: computed, default: 0, description: "Per-line volume discount (calc volume_discount)" }

  # ------- Proof (child of OrderLine; cyclic revision machine) -------
  - name: Proof
    parent: OrderLine
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; the line this proof customizes" }
      - { name: proof_kind, type: enum, source: input, description: "TEXT | LOGO" }
      - { name: content_ref, type: string, source: input, description: "Engraving text snapshot (TEXT) or logo asset ref (LOGO)" }
      - { name: proof_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SENT | APPROVED | CHANGES_REQUESTED (cyclic; CHANGES_REQUESTED -> DRAFT on revise)" }
      - { name: revision_round, type: integer, source: system, default: 1, description: "Incremented each time proof returns to DRAFT after CHANGES_REQUESTED" }
      - { name: approved_text_snapshot, type: string, source: system, default: null, description: "content_ref captured at APPROVED; engraving runs against this snapshot, not the live OrderLine text" }
      - { name: sent_at, type: datetime, source: system, default: null, description: "Timestamp proof entered SENT in the current round" }

  # ------- ComponentAllocation (junction OrderLine<->Component) -------
  - name: ComponentAllocation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; the line consuming components" }
      - { name: component_id, type: string, source: system, description: "FK -> Component.id; the reserved component" }
      - { name: qty, type: integer, source: system, description: "Units reserved = bom.qty_per_unit * OrderLine.quantity", constraints: ">= 1" }
      - { name: alloc_status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CONSUMED | RELEASED (machine ComponentAllocation)" }

  # ------- Payment (event-ish child of Order) -------
  - name: Payment
    parent: Order
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; order being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: ">= 1" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE | FULL" }
      - { name: pay_status, type: enum, source: system, default: "CAPTURED", description: "CAPTURED | REFUNDED" }

  # ------- Fulfillment (child of Order; branching PICKUP vs SHIP) -------
  - name: Fulfillment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order being fulfilled" }
      - { name: method, type: enum, source: input, description: "PICKUP | SHIP" }
      - { name: ship_address, type: string, source: input, default: null, description: "Required when method==SHIP" }
      - { name: ship_fee_cents, type: integer, source: computed, default: 0, description: "0 for PICKUP; calc ship_fee for SHIP" }
      - { name: ship_weight_grams, type: integer, source: input, default: 0, description: "Total parcel weight; drives ship_fee (SHIP only)" }
      - { name: fulfillment_status, type: enum, source: system, default: "STAGED", description: "STAGED | HANDED_OFF (machine Fulfillment)" }
      - { name: handed_off_at, type: datetime, source: system, default: null, description: "Timestamp handed_off (pickup) or dispatched (ship)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------- Order.production (primary lifecycle dimension) ----------
  - entity: Order
    dimension: production_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /orders/{order_id}/price"
        actor: ShopStaff
        preconditions:
          - "Order.production_status == DRAFT"
          - "line_count >= 1"
          - "exactly one RushPolicy has active==true"
          - "business_days_to_due(due_date) >= active RushPolicy.rush_min_business_days (else ERR_DUE_DATE_INFEASIBLE)"
        side_effects:
          - "Compute rush_tier from business_days_to_due vs active RushPolicy (calc rush_tier)"
          - "For each OrderLine: recompute char_count, line_subtotal_cents, volume_tier, volume_discount_cents (calc line_subtotal, volume_discount)"
          - "Set estimate_subtotal_cents, estimate_total_cents (calc order_pricing variant=ESTIMATE)"
          - "increments Order.version by 1"
        note: "ESTIMATE pricing is provisional; promo NOT yet redeemed."

      - from: PRICED
        to: DRAFT
        trigger: "PUT /orders/{order_id} (edit while not yet confirmed)"
        actor: Customer
        preconditions:
          - "Order.production_status == PRICED"
        side_effects:
          - "Clear rush_tier, estimate_subtotal_cents, estimate_total_cents back to defaults"
          - "increments Order.version by 1"
        note: "Any edit (add/remove line, change service_level/due_date) invalidates the estimate; re-price required."

      - from: PRICED
        to: CONFIRMED
        trigger: "POST /orders/{order_id}/confirm"
        actor: Customer
        preconditions:
          - "Order.production_status == PRICED"
          - "every OrderLine on the order has at least one Proof in proof_status==APPROVED (else ERR_PROOF_NOT_APPROVED)"
          - "if promo_code_id set: PromoCode.active==true AND (max_uses null OR uses_count < max_uses) (else ERR_PROMO_INVALID); subtotal >= min_subtotal_cents (else ERR_PROMO_MIN_NOT_MET)"
          - "for every OrderLine, every component in its CatalogProduct.bom has available_qty >= required qty at allocation time (else ERR_COMPONENT_SHORTAGE)"
        side_effects:
          - "Lock invoice_subtotal_cents, invoice_total_cents (calc order_pricing variant=INVOICE)"
          - "Set deposit_due_cents (calc deposit_due)"
          - "Create one ComponentAllocation (RESERVED) per (OrderLine, bom component); cascade -> each Component.allocated_qty,available_qty,low_stock recompute (calc component_available)"
          - "If promo_code_id set: PromoCode.uses_count += 1"
          - "increments Order.version by 1"
        note: "INVOICE pricing locks; promo redeemed exactly here. CONFIRM is the OCC write — requires expected_order_version."

      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /orders/{order_id}/start-production"
        actor: ShopStaff
        preconditions:
          - "Order.production_status == CONFIRMED"
          - "payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} (deposit collected; else ERR_DEPOSIT_REQUIRED)"
        side_effects:
          - "Each OrderLine PENDING -> ALLOCATED (its RESERVED ComponentAllocations stay RESERVED)"
          - "increments Order.version by 1"

      - from: IN_PRODUCTION
        to: READY
        trigger: "system: bubble-up when every OrderLine.line_status == ASSEMBLED"
        actor: system
        preconditions:
          - "Order.production_status == IN_PRODUCTION"
          - "every OrderLine.line_status == ASSEMBLED"
        side_effects:
          - "Set ready_at = now"
          - "increments Order.version by 1"
        note: "Auto-transition fired by the assemble that completes the last line."

      - from: READY
        to: FULFILLED
        trigger: "POST /orders/{order_id}/fulfillments/{fulfillment_id}/hand-off"
        actor: ShopStaff
        preconditions:
          - "Order.production_status == READY"
          - "payment_status == PAID_IN_FULL (balance collected; else ERR_BALANCE_DUE)"
          - "a Fulfillment exists in STAGED for this order"
        side_effects:
          - "Fulfillment.fulfillment_status STAGED -> HANDED_OFF; set handed_off_at"
          - "Set fulfilled_at = now; compute due_date_met = (date(fulfilled_at) <= date(due_date))"
          - "Customer.lifetime_completed_orders += 1; recompute Customer.on_time_rate_pct (calc customer_on_time_rate)"
          - "increments Order.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: ShopManager
        preconditions:
          - "Order.production_status IN {DRAFT, PRICED, CONFIRMED, IN_PRODUCTION}"
        side_effects:
          - "All ComponentAllocation RESERVED -> RELEASED; cascade -> Component.allocated_qty,available_qty,low_stock recompute (calc component_available)"
          - "If promo redeemed (production_status was CONFIRMED or later): PromoCode.uses_count -= 1 (compensating)"
          - "If amount_paid_cents > 0: all CAPTURED Payment -> REFUNDED; payment_status -> REFUNDED; amount_paid_cents -> 0 (compensating)"
          - "increments Order.version by 1"
        note: "Single cancel transition; `from` enumerates all non-terminal production states. Terminal states (FULFILLED, CANCELLED) reject cancel with ERR_INVALID_STATE."

  # ---------- Order.payment (independent parallel dimension) ----------
  - entity: Order
    dimension: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /orders/{order_id}/payments (kind=DEPOSIT)"
        actor: Customer
        preconditions:
          - "Order.production_status == CONFIRMED (deposit only payable after invoice locked; else ERR_INVALID_STATE)"
          - "payment_status == UNPAID"
          - "amount_cents == deposit_due_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Create Payment(CAPTURED, DEPOSIT); amount_paid_cents += amount_cents"
        note: "Cross-dimension guard: payment dimension reads production_status."

      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /orders/{order_id}/payments (kind=BALANCE)"
        actor: Customer
        preconditions:
          - "payment_status == DEPOSIT_PAID"
          - "amount_cents == invoice_total_cents - amount_paid_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Create Payment(CAPTURED, BALANCE); amount_paid_cents += amount_cents"

      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /orders/{order_id}/payments (kind=FULL)"
        actor: Customer
        preconditions:
          - "Order.production_status == CONFIRMED (else ERR_INVALID_STATE)"
          - "payment_status == UNPAID"
          - "amount_cents == invoice_total_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Create Payment(CAPTURED, FULL); amount_paid_cents += amount_cents"

  # ---------- Proof (cyclic revision rounds) ----------
  - entity: Proof
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /order-lines/{order_line_id}/proofs/{proof_id}/send"
        actor: ShopStaff
        preconditions:
          - "Proof.proof_status == DRAFT"
          - "owning Order.production_status IN {DRAFT, PRICED, IN_PRODUCTION} (proofs are built/sent before CONFIRM, and re-proofs may be sent during production after a request-changes; CONFIRMED/READY/FULFILLED/CANCELLED reject with ERR_INVALID_STATE)"
        side_effects:
          - "Set sent_at = now"
      - from: SENT
        to: APPROVED
        trigger: "POST /order-lines/{order_line_id}/proofs/{proof_id}/approve"
        actor: Customer
        preconditions:
          - "Proof.proof_status == SENT"
        side_effects:
          - "Capture approved_text_snapshot = content_ref"
        note: "Terminal. Approving any proof on a line unblocks CONFIRM for that line."
      - from: SENT
        to: CHANGES_REQUESTED
        trigger: "POST /order-lines/{order_line_id}/proofs/{proof_id}/request-changes"
        actor: Customer
        preconditions:
          - "Proof.proof_status == SENT"
        side_effects:
          - "Cascade: owning OrderLine.line_status, if ALLOCATED or ENGRAVING, reverts to PENDING (calc resets assembled_count=0); that line's RESERVED ComponentAllocation stays RESERVED (kept), but ENGRAVING-stage progress is discarded"
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "POST /order-lines/{order_line_id}/proofs/{proof_id}/revise"
        actor: ShopStaff
        preconditions:
          - "Proof.proof_status == CHANGES_REQUESTED"
        side_effects:
          - "revision_round += 1; clear sent_at; clear approved_text_snapshot"
        note: "Cycle SENT->CHANGES_REQUESTED->DRAFT->SENT (revision loop)."

  # ---------- OrderLine (production sub-pipeline with revert) ----------
  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [ASSEMBLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "system: Order start-production sets every PENDING line -> ALLOCATED"
        actor: system
        preconditions:
          - "OrderLine.line_status == PENDING"
          - "owning Order.production_status transitioning CONFIRMED -> IN_PRODUCTION"
        side_effects: ["none beyond status flip"]
      - from: ALLOCATED
        to: ENGRAVING
        trigger: "POST /order-lines/{order_line_id}/engrave"
        actor: ShopStaff
        preconditions:
          - "OrderLine.line_status == ALLOCATED"
          - "owning Order.production_status == IN_PRODUCTION"
          - "the line has a Proof in proof_status==APPROVED (else ERR_PROOF_NOT_APPROVED)"
        side_effects: ["engraving uses Proof.approved_text_snapshot, not live engraving_text"]
      - from: ENGRAVING
        to: ASSEMBLED
        trigger: "POST /order-lines/{order_line_id}/assemble"
        actor: ShopStaff
        preconditions:
          - "OrderLine.line_status == ENGRAVING"
          - "every RESERVED ComponentAllocation for this line has Component.on_hand_qty >= qty (physical stock present; else ERR_COMPONENT_SHORTAGE)"
        side_effects:
          - "assembled_count = quantity"
          - "Cascade: this line's ComponentAllocation RESERVED -> CONSUMED; each Component.on_hand_qty -= qty AND allocated_qty -= qty; recompute available_qty, low_stock (calc component_available)"
          - "Bubble-up: if every OrderLine on the Order is now ASSEMBLED, fire Order IN_PRODUCTION -> READY"
      - from: ENGRAVING
        to: PENDING
        trigger: "system: proof CHANGES_REQUESTED reverts an in-flight line"
        actor: system
        preconditions:
          - "a Proof on this line transitioned SENT -> CHANGES_REQUESTED"
          - "OrderLine.line_status IN {ALLOCATED, ENGRAVING}"
        side_effects: ["assembled_count = 0; line returns to PENDING; ComponentAllocation stays RESERVED"]
        note: "Revert link of the proof revision cascade."

  # ---------- ComponentAllocation ----------
  - entity: ComponentAllocation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system: OrderLine assemble"
        actor: system
        preconditions: ["alloc_status == RESERVED", "owning OrderLine assembling"]
        side_effects: ["Component.on_hand_qty -= qty; allocated_qty -= qty (calc component_available)"]
      - from: RESERVED
        to: RELEASED
        trigger: "system: Order cancel"
        actor: system
        preconditions: ["alloc_status == RESERVED", "owning Order cancelled"]
        side_effects: ["Component.allocated_qty -= qty (calc component_available); on_hand_qty unchanged"]

  # ---------- Fulfillment (branching PICKUP vs SHIP) ----------
  - entity: Fulfillment
    initial_state: STAGED
    terminal_states: [HANDED_OFF]
    transitions:
      - from: STAGED
        to: HANDED_OFF
        trigger: "POST /orders/{order_id}/fulfillments/{fulfillment_id}/hand-off"
        actor: ShopStaff
        preconditions:
          - "Fulfillment.fulfillment_status == STAGED"
          - "owning Order.production_status == READY"
          - "owning Order.payment_status == PAID_IN_FULL (else ERR_BALANCE_DUE)"
        side_effects:
          - "Branch PICKUP: set handed_off_at; no shipping; ship_fee_cents stays 0"
          - "Branch SHIP: set handed_off_at (dispatch); ship_fee_cents already computed at staging (calc ship_fee)"
          - "Drives Order READY -> FULFILLED (see Order.production)"
        note: "Branch side-effects diverge by Fulfillment.method (set at staging)."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Order.version)
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming an Order whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just confirmed (or re-priced/edited) the order — locking the invoice,
      redeeming the promo, and reserving components — so the current writer's
      view of price and line set is stale. Resolved as an expected_order_version
      mismatch against the order's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reorder-supersede-stale-source
    parent_entity: Order
    write_endpoint: "POST /orders/{order_id}/reorder"
    occ_field: "expected_order_version"
    description: |
      Creating a reorder clone from a source Order whose version has advanced
      since the client last observed it is rejected. A reorder snapshots the
      source order's lines and engraving text into a new DRAFT order; if the
      source has since been edited (lines added, text changed, re-priced) the
      client's snapshot intent is stale. Resolved as an expected_order_version
      mismatch against the source order's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: line_subtotal
    trigger: "Order price (DRAFT->PRICED) and re-locked at confirm (PRICED->CONFIRMED); per OrderLine"
    algorithm: aggregation
    formula: |
      char_count   = length(engraving_text)          # whitespace counted; empty text -> 0
      per_unit     = base_price_cents + char_count * engraving_price_per_char_cents
      logo_fee     = logo_setup_fee_cents if include_logo else 0   # ONCE per line, not per unit
      line_subtotal_cents = quantity * per_unit + logo_fee
    input_set: "Single OrderLine; reads its CatalogProduct base_price_cents, engraving_price_per_char_cents, logo_setup_fee_cents."
    constants: {}
    precision: "integer cents; no rounding (all inputs integer)"

  - name: volume_discount
    trigger: "Order price and confirm; per OrderLine after line_subtotal"
    algorithm: tiered_pricing
    formula: |
      # quantity breakpoints select a single tier (NOT marginal/per-bracket):
      if   quantity >= 100: volume_tier=TIER3; pct=0.15
      elif quantity >=  50: volume_tier=TIER2; pct=0.10
      elif quantity >=  25: volume_tier=TIER1; pct=0.05
      else:                 volume_tier=NONE;  pct=0.00
      # discount applies to the engraved per-unit goods only, EXCLUDING the one-time logo_fee:
      goods_cents = line_subtotal_cents - (logo_setup_fee_cents if include_logo else 0)
      volume_discount_cents = floor(goods_cents * pct)     # floor, applied once on goods
    input_set: "Single OrderLine; tier chosen by quantity; logo_fee never discounted."
    constants: { TIER1_MIN: 25, TIER2_MIN: 50, TIER3_MIN: 100, TIER1_PCT: 0.05, TIER2_PCT: 0.10, TIER3_PCT: 0.15 }
    precision: "floor to integer cents (round_down)"
    variants:
      - name: boundary
        when: "quantity exactly at a breakpoint (25, 50, 100)"
        difference: ">= is inclusive: quantity==25 -> TIER1; quantity==24 -> NONE."

  - name: rush_tier
    trigger: "Order price (DRAFT->PRICED) side effect"
    algorithm: threshold
    formula: |
      bd = business_days_to_due(due_date)   # business days from today (UTC date) to due_date, exclusive of today, weekends excluded
      if   bd <  active.rush_min_business_days: REJECT ERR_DUE_DATE_INFEASIBLE
      elif bd <  3:                             rush_tier=RUSH;      surcharge_pct = active.rush_surcharge_pct
      elif bd <  product_max_standard_lead:     rush_tier=EXPEDITED; surcharge_pct = active.expedited_surcharge_pct
      else:                                     rush_tier=STANDARD;  surcharge_pct = active.standard_surcharge_pct
      # product_max_standard_lead = max(standard_lead_days) over all CatalogProducts on the order's lines
    input_set: "Order due_date, active RushPolicy, and max standard_lead_days across the order's lines' products."
    constants: { RUSH_MAX_BD_EXCLUSIVE: 3 }
    precision: "rush_tier enum; surcharge_pct is a fraction"
    variants:
      - name: boundary
        when: "bd == 3 vs bd == 2"
        difference: "bd==3 -> EXPEDITED (>= 3); bd==2 -> RUSH (< 3). Threshold is strict at 3."

  - name: order_pricing
    trigger: "ESTIMATE on DRAFT->PRICED; INVOICE on PRICED->CONFIRMED"
    algorithm: aggregation
    formula: |
      # ORDER OF EVALUATION IS PINNED (circular-looking discount-on-total dependency resolved):
      # 1. subtotal: sum per line of (line_subtotal_cents - volume_discount_cents), summed over lines, THEN rounded once
      subtotal_cents = sum_over_lines( line_subtotal_cents - volume_discount_cents )   # exact integer sum
      # 2. rush surcharge keyed on subtotal AND rush_tier:
      rush_amount_cents = floor(subtotal_cents * surcharge_pct(rush_tier))
      pre_promo_cents   = subtotal_cents + rush_amount_cents
      # 3. promo discount keyed on subtotal (NOT pre_promo) and gated by min_subtotal:
      if promo present AND subtotal_cents >= promo.min_subtotal_cents:
          if promo.kind==PERCENT: promo_cents = floor(subtotal_cents * promo.percent_off)
          else:                   promo_cents = min(promo.flat_off_cents, pre_promo_cents)
      else: promo_cents = 0
      total_cents = max(0, pre_promo_cents - promo_cents)
    input_set: "All OrderLine rows on the order (every status — lines cannot be partially excluded); active RushPolicy; PromoCode if promo_code_id set."
    constants: {}
    precision: "floor to integer cents at each floor() step; subtotal summed exactly then surcharge/promo floored. Order: subtotal -> rush -> promo. round_down (floor)."
    variants:
      - name: ESTIMATE
        when: "DRAFT -> PRICED"
        difference: "Promo is NOT applied even if promo_code_id set (estimate shows pre-promo pre_promo_cents as estimate_total_cents); estimate_subtotal_cents = subtotal_cents. Promo uses_count NOT incremented."
      - name: INVOICE
        when: "PRICED -> CONFIRMED"
        difference: "Promo IS applied and redeemed (uses_count += 1); invoice_total_cents = total_cents incl promo. Same subtotal & rush math as ESTIMATE, so invoice_total <= estimate_total whenever a valid promo exists."

  - name: deposit_due
    trigger: "PRICED -> CONFIRMED side effect"
    algorithm: threshold
    formula: |
      deposit_due_cents = ceil(invoice_total_cents * DEPOSIT_PCT)
      # RUSH orders require full prepayment:
      if rush_tier == RUSH: deposit_due_cents = invoice_total_cents
    input_set: "Order invoice_total_cents and rush_tier."
    constants: { DEPOSIT_PCT: 0.50 }
    precision: "ceil to integer cents (round_up)"

  - name: component_available
    trigger: "Any ComponentAllocation status change, Component receive, assemble-consume, cancel-release"
    algorithm: aggregation
    formula: |
      allocated_qty = sum( ComponentAllocation.qty WHERE component_id==C.id AND alloc_status==RESERVED )
      available_qty = on_hand_qty - allocated_qty       # INVARIANT: available_qty >= 0 always
      low_stock     = (available_qty <= reorder_point)
    input_set: "All ComponentAllocation rows in RESERVED for the component; component's on_hand_qty."
    constants: {}
    precision: "integer units"

  - name: ship_fee
    trigger: "Fulfillment staging (POST /orders/{id}/fulfillments) when method==SHIP"
    algorithm: tiered_pricing
    formula: |
      if method == PICKUP: ship_fee_cents = 0
      else:  # SHIP, weight-tiered (single-tier selection by weight bracket):
        if   ship_weight_grams <= 0:     REJECT ERR_SHIP_WEIGHT_REQUIRED
        elif ship_weight_grams <= 1000:  ship_fee_cents = BASE
        elif ship_weight_grams <= 5000:  ship_fee_cents = BASE + floor((ship_weight_grams-1000)/1000) * PER_KG
        else:                            ship_fee_cents = BASE + 4*PER_KG + floor((ship_weight_grams-5000)/1000) * PER_KG_HEAVY
    input_set: "Fulfillment.method, ship_weight_grams."
    constants: { BASE: 1200, PER_KG: 300, PER_KG_HEAVY: 500 }
    precision: "floor to integer cents (round_down) on each /1000 division"

  - name: customer_on_time_rate
    trigger: "Order READY->FULFILLED side effect"
    algorithm: aggregation
    formula: |
      fulfilled = Orders WHERE customer_id==Cust.id AND production_status==FULFILLED
      if count(fulfilled)==0: on_time_rate_pct = null
      else:
        on_time = count(o in fulfilled WHERE o.due_date_met == true)
        on_time_rate_pct = round_half_up( on_time / count(fulfilled) * 100, 2 )
    input_set: "All FULFILLED orders for the customer; due_date_met computed at each fulfillment."
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers, POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed Customer acting on an order must own it (Order.customer_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in path (order before order-line before proof; component, catalog_product, promo_code, fulfillment)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: existence
    check: "Required body fields present and well-typed; enum members valid; quantity>=1; amounts>=0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (production_status / payment_status / proof_status / line_status / alloc_status / fulfillment_status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_order_version matches Order.version on confirm and reorder"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/confirm, POST /orders/{id}/reorder"

  - priority: 7
    category: business_temporal
    check: "business_days_to_due(due_date) >= active RushPolicy.rush_min_business_days at price time"
    error_id: ERR_DUE_DATE_INFEASIBLE
    http_status: 422
    applies_to: "POST /orders/{id}/price"

  - priority: 8
    category: business_referential
    check: "Adding/keeping a line requires CatalogProduct.active==true at line-create time"
    error_id: ERR_PRODUCT_INACTIVE
    http_status: 409
    applies_to: "POST /orders/{id}/lines"

  - priority: 9
    category: business_constraint
    check: "Every OrderLine on the order has at least one APPROVED Proof before confirm; a line has an APPROVED proof before engrave"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm, POST /order-lines/{id}/engrave"

  - priority: 10
    category: business_referential
    check: "Promo (if set) is active, under max_uses, and meets min_subtotal at confirm"
    error_id: ERR_PROMO_INVALID
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"

  - priority: 11
    category: business_constraint
    check: "Promo min_subtotal_cents met by order subtotal at confirm"
    error_id: ERR_PROMO_MIN_NOT_MET
    http_status: 422
    applies_to: "POST /orders/{id}/confirm"

  - priority: 12
    category: business_safety
    check: "Component physical/available stock sufficient: at confirm available_qty >= required; at assemble on_hand_qty >= reserved qty"
    error_id: ERR_COMPONENT_SHORTAGE
    http_status: 409
    applies_to: "POST /orders/{id}/confirm, POST /order-lines/{id}/assemble"

  - priority: 13
    category: business_fiscal
    check: "Deposit collected before start-production (payment_status in {DEPOSIT_PAID, PAID_IN_FULL})"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 409
    applies_to: "POST /orders/{id}/start-production"

  - priority: 14
    category: business_fiscal
    check: "Balance paid in full before hand-off (payment_status == PAID_IN_FULL)"
    error_id: ERR_BALANCE_DUE
    http_status: 409
    applies_to: "POST /orders/{id}/fulfillments/{fid}/hand-off"

  - priority: 15
    category: business_fiscal
    check: "Payment amount_cents exactly equals the required deposit / balance / full amount for its kind"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/payments"

  - priority: 16
    category: business_constraint
    check: "SHIP fulfillment requires ship_address and ship_weight_grams > 0"
    error_id: ERR_SHIP_WEIGHT_REQUIRED
    http_status: 422
    applies_to: "POST /orders/{id}/fulfillments"

  - priority: 17
    category: business_constraint
    check: "Semantically invalid but well-typed values: PromoCode kind==PERCENT requires percent_off in (0,1]; kind==FLAT requires flat_off_cents > 0; surcharge/discount pcts must be >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /promo-codes, POST /rush-policies"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ----- Customer -----
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [Anonymous, ShopManager]
    code: 201
    input: [email, full_name, "org_name?"]
    output: Customer
    side_effects: ["lifetime_completed_orders=0, on_time_rate_pct=null"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}/orders"
    description: "List a customer's orders (reverse-reachability for Order.customer_id)"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ----- Catalog -----
  - method: POST
    path: "/catalog-products"
    description: "Create a catalog product"
    roles: [ShopManager]
    code: 201
    input: [sku, name, product_type, base_price_cents, engraving_price_per_char_cents, logo_setup_fee_cents, standard_lead_days, bom, "active?"]
    output: CatalogProduct
    side_effects: []
  - method: GET
    path: "/catalog-products/{id}"
    description: "Get a catalog product"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: []
    output: CatalogProduct
    side_effects: []
  - method: PATCH
    path: "/catalog-products/{id}"
    description: "Update a catalog product (e.g. deactivate)"
    roles: [ShopManager]
    code: 200
    input: ["active?", "base_price_cents?", "engraving_price_per_char_cents?", "logo_setup_fee_cents?", "standard_lead_days?"]
    output: CatalogProduct
    side_effects: ["increments CatalogProduct.version by 1"]

  # ----- Component -----
  - method: POST
    path: "/components"
    description: "Create a component (inventory item)"
    roles: [ShopManager]
    code: 201
    input: [code, name, on_hand_qty, "reorder_point?"]
    output: Component
    side_effects: ["allocated_qty=0, available_qty=on_hand_qty, low_stock recompute (calc component_available)"]
  - method: GET
    path: "/components/{id}"
    description: "Get a component"
    roles: [ShopStaff, ShopManager]
    code: 200
    input: []
    output: Component
    side_effects: []
  - method: POST
    path: "/components/{id}/receive"
    description: "Receive stock (raise on_hand_qty)"
    roles: [ShopManager]
    code: 200
    input: [received_qty]
    output: Component
    side_effects: ["on_hand_qty += received_qty; available_qty,low_stock recompute (calc component_available); increments Component.version by 1"]
  - method: GET
    path: "/order-lines/{id}/component-allocations"
    description: "List component allocations for a line (reverse-reachability for ComponentAllocation.order_line_id)"
    roles: [ShopStaff, ShopManager]
    code: 200
    input: []
    output: ComponentAllocation[]
    side_effects: []
  - method: GET
    path: "/component-allocations"
    description: "List component allocations, filterable by component/line (reverse-reachability for ComponentAllocation.component_id and ComponentAllocation.order_line_id)"
    roles: [ShopStaff, ShopManager]
    code: 200
    input: ["component_id?", "order_line_id?", "limit?", "offset?"]
    output: ComponentAllocation[]
    side_effects: []
  - method: GET
    path: "/component-allocations/{id}"
    description: "Get a single component allocation"
    roles: [ShopStaff, ShopManager]
    code: 200
    input: []
    output: ComponentAllocation
    side_effects: []

  # ----- RushPolicy -----
  - method: POST
    path: "/rush-policies"
    description: "Create a rush policy; setting active=true deactivates any other active policy"
    roles: [ShopManager]
    code: 201
    input: [name, expedited_surcharge_pct, rush_surcharge_pct, "standard_surcharge_pct?", "rush_min_business_days?", "active?"]
    output: RushPolicy
    side_effects: ["if active==true: any other RushPolicy.active set to false"]
  - method: GET
    path: "/rush-policies/{id}"
    description: "Get a rush policy"
    roles: [ShopStaff, ShopManager]
    code: 200
    input: []
    output: RushPolicy
    side_effects: []

  # ----- PromoCode -----
  - method: POST
    path: "/promo-codes"
    description: "Create a promo code"
    roles: [ShopManager]
    code: 201
    input: [code, kind, "percent_off?", "flat_off_cents?", "min_subtotal_cents?", "max_uses?", "active?"]
    output: PromoCode
    side_effects: ["uses_count=0"]
  - method: GET
    path: "/promo-codes/{id}"
    description: "Get a promo code"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: []
    output: PromoCode
    side_effects: []

  # ----- Order lifecycle -----
  - method: POST
    path: "/orders"
    description: "Create a DRAFT order"
    roles: [Customer, ShopStaff, ShopManager]
    code: 201
    input: [customer_id, service_level, due_date, "promo_code_id?"]
    output: Order
    side_effects: ["production_status=DRAFT, payment_status=UNPAID, version=1, all computed totals at defaults"]
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders, filterable by customer/promo/reorder-source (reverse-reachability for Order.customer_id, Order.promo_code_id, Order.reorder_source_order_id)"
    roles: [ShopStaff, ShopManager]
    code: 200
    input: ["customer_id?", "promo_code_id?", "reorder_source_order_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: PUT
    path: "/orders/{id}"
    description: "Edit a DRAFT or PRICED order header (service_level/due_date/promo); PRICED reverts to DRAFT"
    roles: [Customer, ShopStaff]
    code: 200
    input: ["service_level?", "due_date?", "promo_code_id?"]
    output: Order
    side_effects: ["if was PRICED: production_status->DRAFT, clear estimate/rush_tier; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add an OrderLine to a DRAFT order"
    roles: [Customer, ShopStaff]
    code: 201
    input: [catalog_product_id, quantity, "engraving_text?", "include_logo?"]
    output: OrderLine
    side_effects: ["line_status=PENDING; Order.line_count += 1; if Order was PRICED-> reverts to DRAFT and clears estimate; increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}/lines"
    description: "List lines of an order (reverse-reachability for OrderLine.order_id)"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Get an order line"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines, filterable by order/product (reverse-reachability for OrderLine.order_id, OrderLine.catalog_product_id)"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: ["order_id?", "catalog_product_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: DELETE
    path: "/order-lines/{id}"
    description: "Remove a line from a DRAFT/PRICED order"
    roles: [Customer, ShopStaff]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["Order.line_count -= 1; if Order was PRICED-> reverts to DRAFT; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/price"
    description: "Price the order (DRAFT -> PRICED), compute ESTIMATE"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["rush_tier, estimate_subtotal_cents, estimate_total_cents, per-line subtotals/volume tiers (calc rush_tier,line_subtotal,volume_discount,order_pricing ESTIMATE); increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm the order (PRICED -> CONFIRMED), lock INVOICE, redeem promo, reserve components (OCC write)"
    roles: [Customer]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["invoice totals + deposit_due (calc order_pricing INVOICE, deposit_due); create ComponentAllocations RESERVED; component recompute (calc component_available); promo uses_count+=1; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/reorder"
    description: "Clone a fulfilled/any source order's lines into a new DRAFT order (OCC on source)"
    roles: [Customer, ShopStaff]
    code: 201
    input: [expected_order_version, "due_date?", "service_level?"]
    output: Order
    side_effects: ["new Order DRAFT with reorder_source_order_id set, lines+engraving_text cloned (proofs NOT cloned); increments source Order.version by 1"]
  - method: POST
    path: "/orders/{id}/start-production"
    description: "Begin production (CONFIRMED -> IN_PRODUCTION)"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["every PENDING OrderLine -> ALLOCATED; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-terminal order (compensating release/refund/promo-unredeem)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Order
    side_effects: ["ComponentAllocation RESERVED->RELEASED (calc component_available); refund payments; un-redeem promo; production_status->CANCELLED; increments Order.version by 1"]

  # ----- Payments -----
  - method: POST
    path: "/orders/{id}/payments"
    description: "Record a payment (DEPOSIT/BALANCE/FULL) advancing payment_status"
    roles: [Customer]
    code: 201
    input: [amount_cents, kind]
    output: Payment
    side_effects: ["create Payment CAPTURED; amount_paid_cents += amount_cents; advance payment_status"]
  - method: GET
    path: "/orders/{id}/payments"
    description: "List payments of an order (reverse-reachability for Payment.order_id)"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ----- Proofs -----
  - method: POST
    path: "/order-lines/{id}/proofs"
    description: "Create a proof (DRAFT) for a line"
    roles: [ShopStaff]
    code: 201
    input: [proof_kind, content_ref]
    output: Proof
    side_effects: ["proof_status=DRAFT, revision_round=1"]
  - method: GET
    path: "/order-lines/{id}/proofs"
    description: "List proofs of a line (reverse-reachability for Proof.order_line_id)"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Proof[]
    side_effects: []
  - method: GET
    path: "/proofs/{id}"
    description: "Get a proof"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: []
    output: Proof
    side_effects: []
  - method: POST
    path: "/order-lines/{id}/proofs/{id}/send"
    description: "Send proof to customer (DRAFT -> SENT)"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Proof
    side_effects: ["sent_at=now"]
  - method: POST
    path: "/order-lines/{id}/proofs/{id}/approve"
    description: "Customer approves proof (SENT -> APPROVED)"
    roles: [Customer]
    code: 200
    input: []
    output: Proof
    side_effects: ["approved_text_snapshot=content_ref"]
  - method: POST
    path: "/order-lines/{id}/proofs/{id}/request-changes"
    description: "Customer requests changes (SENT -> CHANGES_REQUESTED); cascade revert of in-flight line"
    roles: [Customer]
    code: 200
    input: []
    output: Proof
    side_effects: ["owning OrderLine if ALLOCATED/ENGRAVING -> PENDING (assembled_count=0); allocations stay RESERVED"]
  - method: POST
    path: "/order-lines/{id}/proofs/{id}/revise"
    description: "Staff revises proof (CHANGES_REQUESTED -> DRAFT), bumping revision_round"
    roles: [ShopStaff]
    code: 200
    input: ["content_ref?"]
    output: Proof
    side_effects: ["revision_round += 1; clear sent_at, approved_text_snapshot"]

  # ----- Production: line engrave/assemble -----
  - method: POST
    path: "/order-lines/{id}/engrave"
    description: "Move a line into ENGRAVING (ALLOCATED -> ENGRAVING)"
    roles: [ShopStaff]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["engraving runs against APPROVED proof snapshot"]
  - method: POST
    path: "/order-lines/{id}/assemble"
    description: "Assemble a line (ENGRAVING -> ASSEMBLED); consume components; may bubble Order to READY"
    roles: [ShopStaff]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["assembled_count=quantity; ComponentAllocation RESERVED->CONSUMED; Component on_hand/allocated -= qty (calc component_available); if all lines ASSEMBLED -> Order READY (ready_at); increments Order.version by 1"]

  # ----- Fulfillment -----
  - method: POST
    path: "/orders/{id}/fulfillments"
    description: "Stage a fulfillment (PICKUP or SHIP) for a READY order"
    roles: [ShopStaff]
    code: 201
    input: [method, "ship_address?", "ship_weight_grams?"]
    output: Fulfillment
    side_effects: ["fulfillment_status=STAGED; if SHIP compute ship_fee_cents (calc ship_fee)"]
  - method: GET
    path: "/orders/{id}/fulfillments"
    description: "List fulfillments of an order (reverse-reachability for Fulfillment.order_id)"
    roles: [Customer, ShopStaff, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Fulfillment[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/fulfillments/{id}/hand-off"
    description: "Hand off (pickup) / dispatch (ship): STAGED -> HANDED_OFF; drives Order READY -> FULFILLED"
    roles: [ShopStaff]
    code: 200
    input: []
    output: Fulfillment
    side_effects: ["handed_off_at=now; Order->FULFILLED (fulfilled_at, due_date_met); Customer counters recompute (calc customer_on_time_rate); increments Order.version by 1"]

  # ----- Test-driving clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's notion of 'now' (UTC) for deterministic due-date / business-day math"
    roles: [Anonymous, ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_utc := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or Customer acting on an order it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced order, line, proof, component, catalog product, promo, customer, fulfillment, or allocation does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed body field, bad enum, quantity<1, negative amount, or malformed payload" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (production/payment/proof/line/alloc/fulfillment)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version != Order.version on confirm or reorder (OCC)" }
  - { id: ERR_DUE_DATE_INFEASIBLE, http: 422, condition: "business_days_to_due(due_date) < active RushPolicy.rush_min_business_days at price time" }
  - { id: ERR_PRODUCT_INACTIVE, http: 409, condition: "Adding a line referencing a CatalogProduct with active==false" }
  - { id: ERR_PROOF_NOT_APPROVED, http: 409, condition: "Confirm with a line lacking an APPROVED proof, or engrave a line whose proof is not APPROVED" }
  - { id: ERR_PROMO_INVALID, http: 409, condition: "Promo inactive or max_uses reached at confirm" }
  - { id: ERR_PROMO_MIN_NOT_MET, http: 422, condition: "Order subtotal below promo.min_subtotal_cents at confirm" }
  - { id: ERR_COMPONENT_SHORTAGE, http: 409, condition: "Insufficient available stock at confirm-reserve, or insufficient physical stock at assemble-consume" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 409, condition: "start-production before deposit collected (payment_status still UNPAID)" }
  - { id: ERR_BALANCE_DUE, http: 409, condition: "hand-off before order paid in full (payment_status != PAID_IN_FULL)" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents != required deposit/balance/full amount for its kind" }
  - { id: ERR_SHIP_WEIGHT_REQUIRED, http: 422, condition: "SHIP fulfillment missing ship_address or ship_weight_grams <= 0" }
  - { id: ERR_DUPLICATE_VALUE, http: 409, condition: "Unique field collision (Customer.email, CatalogProduct.sku, Component.code, PromoCode.code)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Semantically invalid value that is well-typed (e.g. percent_off outside 0..1, PERCENT promo with no percent_off, FLAT with no flat_off_cents)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may register a customer and set the test clock only"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /customers — register"
      - "POST /_clock/set_current_utc — test clock"

  - name: Customer
    description: "End customer; owns and drives their own orders, proofs (approve/request-changes), and payments"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders/{id}/confirm"
      - "POST /orders/{id}/payments"
      - "POST /order-lines/{id}/proofs/{pid}/approve"
      - "POST /order-lines/{id}/proofs/{pid}/request-changes"
    shared_operations:
      - "POST /orders, PUT /orders/{id}, POST /orders/{id}/lines, DELETE /order-lines/{id}, POST /orders/{id}/reorder (with ShopStaff)"
      - "GET endpoints on own orders/lines/proofs/payments/fulfillments"

  - name: ShopStaff
    description: "Production staff: pricing, proof drafting/sending/revising, engraving, assembly, fulfillment staging & hand-off"
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/price"
      - "POST /orders/{id}/start-production"
      - "POST /order-lines/{id}/proofs (create), .../send, .../revise"
      - "POST /order-lines/{id}/engrave, POST /order-lines/{id}/assemble"
      - "POST /orders/{id}/fulfillments, POST /orders/{id}/fulfillments/{fid}/hand-off"
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, DELETE /order-lines/{id}, POST /orders/{id}/reorder, PUT /orders/{id} (with Customer)"
      - "GET endpoints across orders/components/allocations"

  - name: ShopManager
    description: "Shop owner/manager: catalog, components & receiving, rush policy, promo codes, and order cancellation/refunds"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /catalog-products"
      - "POST /components, POST /components/{id}/receive"
      - "POST /rush-policies, POST /promo-codes"
      - "POST /orders/{id}/cancel"
    shared_operations:
      - "POST /customers (with Anonymous)"
      - "GET endpoints across all resources"
