        grounds:
          - validations[priority=44]
          - state_machines.TalentContract.DRAFT_to_SIGNED
          - calculations.talent_commitment_ledger
        distinguishing_aspect: |
          The gate lives on a SIBLING entity reached through a foreign key, not on an ancestor:
          VoiceSession creation is refused because TalentContract.status is DRAFT, even though
          every ancestor (Title, MarketPlan) and the booth are already in the right state. Signing
          the contract - which touches neither the booth nor the market plan - is what unblocks it.
