# =============================================================================
# §1.9 Scaffold Corner Design — task_1593 Air Cargo Handling & ULD Management
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: flight_created_with_zeroed_computed_fields
        claim_type: creation
        grounds: [entities.Flight, state_machines.Flight]
        distinguishing_aspect: "A newly created flight starts SCHEDULED with all computed pools zeroed and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA301", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: false }
              as: CapacityController
              captures: { st: $.data.status, aw: $.data.allocated_weight_kg, av: $.data.allocated_volume_m3, rp: $.data.reserved_positions, wr: $.data.weight_restriction_kg, v: $.data.version }
          assert:
            - "${st} == SCHEDULED (initial state)"
            - "${aw} == 0 and ${av} == 0 and ${rp} == 0 and ${wr} == null and ${v} == 1"

      - name: booking_chargeable_weight_volumetric_dominates
        claim_type: computed_fields
        grounds: [entities.Booking.fields.chargeable_weight_kg, calculations.chargeable_weight]
        distinguishing_aspect: "chargeable = max(gross, volume*167.0) at 2dp: volumetric wins for dense-volume cargo (0.5m3 -> 83.5), gross wins for dense-mass cargo (100kg/0.1m3 -> 100.00)."
        test_recipe:
          setup: ["Flight CA302 exists (any state; creation does not require OPEN)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA302", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-V1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 10, volume_m3: 0.5 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { cw1: $.data.chargeable_weight_kg }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-V2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 0.1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { cw2: $.data.chargeable_weight_kg }
          assert:
            - "${cw1} == 83.5 (max(10, 0.5*167.0) = 83.5 — volumetric dominates)"
            - "${cw2} == 100 (max(100, 16.7) — gross dominates)"

      - name: booking_missing_required_gross_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Booking.fields.gross_weight_kg, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input gross_weight_kg is rejected with ERR_INVALID_REQUEST (400); no booking is persisted."
        test_recipe:
          setup: ["Flight CA303 exists"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA303", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-M1", commodity_code: "GEN", pieces: 1, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: unknown_flight_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent flight id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cargo/flights/00000000-0000-0000-0000-000000000000"
              as: CapacityController
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404)"

      - name: uld_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List pagination: limit 2 over 3 rows returns 2 rows with has_more true and total_count 3; offset 2 returns the final row with has_more false."
        test_recipe:
          setup: ["ULDType AKE; three ULDs AKE00101CA, AKE00102CA, AKE00103CA"]
          setup_api_calls:
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00101CA", uld_type_id: "${t_id}" }
              as: RampOperator
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00102CA", uld_type_id: "${t_id}" }
              as: RampOperator
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00103CA", uld_type_id: "${t_id}" }
              as: RampOperator
          trigger:
            - call: "GET /cargo/ulds"
              payload: { limit: 2, offset: 0 }
              as: RampOperator
            - call: "GET /cargo/ulds"
              payload: { limit: 2, offset: 2 }
              as: RampOperator
          assert:
            - "First page: data array length == 2, total_count == 3, has_more == true"
            - "Second page (offset 2): data array length == 1, has_more == false"

      - name: flight_bookings_sublist_filters_by_parent
        claim_type: parent_relationships
        grounds: [entities.Booking.fields.flight_id, endpoints]
        distinguishing_aspect: "GET /cargo/flights/{id}/bookings returns exactly the bookings whose flight_id equals the path id — cross-flight leakage is absent."
        test_recipe:
          setup: ["Flights CA304 and CA305; one booking on each"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA304", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f1: $.data.id }
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA305", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-11T08:00:00Z", scheduled_arrival: "2026-08-13T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f2: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-S1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f2}", shipper_ref: "SHP-S2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 200, volume_m3: 2 }
              as: ForwarderAgent
              as_user_id: fwd-1
          trigger:
            - call: "GET /cargo/flights/${f1}/bookings"
              as: CapacityController
              captures: { got: "$.data[0].id" }
          assert:
            - "Sub-list returns exactly 1 row and ${got} == ${b1}"

      - name: uld_type_has_no_version_field
        claim_type: immutability
        grounds: [entities.ULDType]
        distinguishing_aspect: "ULDType is common_fields:false — the create response carries id and created_at but no version / updated_at fields, and no update endpoint exists."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cargo/uld-types"
              payload: { type_code: "PMC", tare_weight_kg: 120, max_gross_weight_kg: 2000, internal_volume_m3: 10 }
              as: RampOperator
          assert:
            - "Response data contains id and created_at and does NOT contain version or updated_at"

      - name: dg_declaration_invalid_enum_packing_group
        claim_type: type_constraints
        grounds: [entities.DGDeclaration.fields.packing_group, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "packing_group outside {I, II, III} is rejected with ERR_INVALID_REQUEST before any state logic."
        test_recipe:
          setup: ["Flight CA306; is_dangerous_goods booking (REQUESTED)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA306", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-E1", commodity_code: "DG", pieces: 1, gross_weight_kg: 50, volume_m3: 1, is_dangerous_goods: true }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1263", dg_class: "3", packing_group: "IV", declaration_doc_ref: "DGD-1" }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (packing_group IV is outside the declared enum)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: depart_from_open_flight_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Flight.CLOSED_to_DEPARTED, "errors[ERR_FLIGHT_NOT_CLOSED]"]
        distinguishing_aspect: "depart is defined only from CLOSED; from OPEN_FOR_BOOKING it fails with ERR_FLIGHT_NOT_CLOSED and the flight stays OPEN_FOR_BOOKING."
        test_recipe:
          setup: ["Flight CA307 OPEN_FOR_BOOKING"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA307", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
          trigger:
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
              captures: { err: $.data.error_id }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_FLIGHT_NOT_CLOSED and ${st} == OPEN_FOR_BOOKING (no mutation)"

      - name: close_with_draft_plan_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Flight.OPEN_FOR_BOOKING_to_CLOSED, "errors[ERR_DRAFT_PLANS_EXIST]"]
        distinguishing_aspect: "close is blocked while any plan on the flight is DRAFT; the flight remains OPEN_FOR_BOOKING."
        test_recipe:
          setup: ["Flight CA308 OPEN_FOR_BOOKING with one DRAFT plan"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA308", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00104CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
          trigger:
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
              captures: { err: $.data.error_id }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_DRAFT_PLANS_EXIST and ${st} == OPEN_FOR_BOOKING"

      - name: seal_empty_plan_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.BuildUpPlan.DRAFT_to_SEALED, "errors[ERR_PLAN_EMPTY]"]
        distinguishing_aspect: "seal requires at least one BUILT_UP booking; an empty DRAFT plan fails with ERR_PLAN_EMPTY and stays DRAFT."
        test_recipe:
          setup: ["Flight CA309 OPEN_FOR_BOOKING; empty DRAFT plan"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA309", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00105CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "GET /cargo/build-up-plans/${p_id}"
              as: RampOperator
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_PLAN_EMPTY and ${st} == DRAFT"

      - name: dg_declaration_resubmission_loop
        claim_type: valid_transition
        grounds: [state_machines.DGDeclaration]
        distinguishing_aspect: "A REJECTED declaration is terminal, but the booking-level loop continues: a newly filed declaration starts PENDING_CHECK and can be accepted — REJECTED does not poison the booking."
        test_recipe:
          setup: ["Flight CA310; DG booking by fwd-1; declaration D1 filed"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA310", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-DG1", commodity_code: "DG", pieces: 1, gross_weight_kg: 50, volume_m3: 1, is_dangerous_goods: true }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1263", dg_class: "3", packing_group: "II", declaration_doc_ref: "DGD-OLD" }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /cargo/dg-declarations/${d1}/reject"
              payload: { rejection_reason: "illegible packing group" }
              as: DGInspector
              as_user_id: dg-9
              captures: { d1_st: $.data.status }
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1263", dg_class: "3", packing_group: "II", declaration_doc_ref: "DGD-NEW" }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { d2: $.data.id, d2_st: $.data.status }
            - call: "POST /cargo/dg-declarations/${d2}/accept"
              as: DGInspector
              as_user_id: dg-9
              captures: { d2_fin: $.data.status }
          assert:
            - "${d1_st} == REJECTED (terminal for that row)"
            - "${d2_st} == PENDING_CHECK (resubmission opens a fresh check) and ${d2_fin} == ACCEPTED"

      - name: released_hold_cannot_release_again
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CustomsHold.ACTIVE_to_RELEASED, "errors[ERR_HOLD_NOT_ACTIVE]"]
        distinguishing_aspect: "RELEASED is terminal: a second release on the same hold fails with ERR_HOLD_NOT_ACTIVE and does not change released_at."
        test_recipe:
          setup: ["Flight CA311; booking REQUESTED; one ACTIVE hold"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA311", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-H2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "DOC_CHECK" }
              as: CustomsOfficer
              captures: { h_id: $.data.id }
            - call: "POST /cargo/customs-holds/${h_id}/release"
              payload: { release_note: "cleared" }
              as: CustomsOfficer
          trigger:
            - call: "POST /cargo/customs-holds/${h_id}/release"
              payload: { release_note: "again" }
              as: CustomsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_HOLD_NOT_ACTIVE"

      - name: settled_claim_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Claim, "errors[ERR_CLAIM_NOT_SUBMITTED]"]
        distinguishing_aspect: "SETTLED is terminal: approving a settled claim fails with ERR_CLAIM_NOT_SUBMITTED; no fields change."
        test_recipe:
          setup: ["Booking LOADED on departed flight CA312; claim SUBMITTED -> APPROVED -> SETTLED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA312", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00106CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-T1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_id}", claim_type: "DAMAGE", claimed_amount: 100, items: [{ weight_kg: 2 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_id: $.data.id }
            - call: "POST /cargo/claims/${c_id}/approve"
              as: ClaimsAdjuster
            - call: "POST /cargo/claims/${c_id}/settle"
              payload: { settlement_ref: "PAY-1001" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /cargo/claims/${c_id}/approve"
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
            - call: "GET /cargo/claims/${c_id}"
              as: ClaimsAdjuster
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_CLAIM_NOT_SUBMITTED and ${st} == SETTLED"

      - name: plan_cancel_returns_bookings_to_accepted
        claim_type: side_effect_execution
        grounds: [state_machines.BuildUpPlan.SEALED_to_CANCELLED, state_machines.Booking.BUILT_UP_to_ACCEPTED, state_machines.ULD.ASSIGNED_to_SERVICEABLE]
        distinguishing_aspect: "Cancelling a SEALED plan executes the full compensation set: booking returns to ACCEPTED with build_up_plan_id null, plan weight zeroed, ULD back to SERVICEABLE."
        test_recipe:
          setup: ["Flight CA313 OPEN_FOR_BOOKING; booking 100kg BUILT_UP on SEALED plan (ULD AKE00107CA)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA313", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00107CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-PC", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/cancel"
              as: RampOperator
              captures: { p_st: $.data.status, p_tw: $.data.total_weight_kg }
            - call: "GET /cargo/bookings/${b_id}"
              as: RampOperator
              captures: { b_st: $.data.status, b_plan: $.data.build_up_plan_id }
            - call: "GET /cargo/ulds/${u_id}"
              as: RampOperator
              captures: { u_st: $.data.status }
          assert:
            - "${p_st} == CANCELLED and ${p_tw} == 0"
            - "${b_st} == ACCEPTED and ${b_plan} == null (booking survives — compensation, not cancellation)"
            - "${u_st} == SERVICEABLE"

      - name: weight_restriction_on_departed_flight_rejected
        claim_type: invalid_transition
        grounds: [endpoints, "errors[ERR_FLIGHT_NOT_OPEN]"]
        distinguishing_aspect: "weight-restriction is only meaningful pre-departure; on a DEPARTED flight it fails with ERR_FLIGHT_NOT_OPEN and no offload occurs."
        test_recipe:
          setup: ["Flight CA314 OPEN_FOR_BOOKING -> CLOSED -> DEPARTED (no plans, no bookings)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA314", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
          trigger:
            - call: "POST /cargo/flights/${f_id}/weight-restriction"
              payload: { restricted_payload_kg: 100 }
              as: CapacityController
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FLIGHT_NOT_OPEN"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: capacity_excludes_terminal_and_requested_bookings
        claim_type: input_set_filtering
        grounds: [calculations.flight_capacity_check]
        distinguishing_aspect: "The capacity sum includes only ACCEPTED/BUILT_UP bookings: a REJECTED 500kg booking does not count, so 800 + 200 == 1000 is accepted where counting the rejected row would exceed the cap."
        test_recipe:
          setup: ["Flight CA315 cap 1000/100 OPEN_FOR_BOOKING; B1 800kg ACCEPTED; B2 500kg REQUESTED then REJECTED; B3 200kg REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA315", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 100, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-F3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 800, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-F4", commodity_code: "GEN", pieces: 1, gross_weight_kg: 500, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings/${b2}/reject"
              payload: { reason: "documentation incomplete" }
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-F5", commodity_code: "GEN", pieces: 1, gross_weight_kg: 200, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b3}/accept"
              as: CapacityController
              captures: { b3_st: $.data.status }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { aw: $.data.allocated_weight_kg }
          assert:
            - "${b3_st} == ACCEPTED (800 + 200 == 1000 <= cap; REJECTED B2's 500kg correctly excluded)"
            - "${aw} == 1000"

      - name: temperature_excursion_inclusive_bounds_and_stickiness
        claim_type: correct_result
        grounds: [calculations.temperature_excursion_check, entities.Booking.fields.temp_excursion_count, entities.Booking.fields.temp_status]
        distinguishing_aspect: "Bounds are inclusive (2.0 and 8.0 in range; 8.1 is an excursion), and EXCURSION is sticky — a later in-range reading leaves temp_status EXCURSION and does not increment the counter."
        test_recipe:
          setup: ["Flight CA316 OPEN_FOR_BOOKING; booking ACCEPTED with temp range [2.0, 8.0]"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA316", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-T2", commodity_code: "PER", pieces: 1, gross_weight_kg: 100, volume_m3: 1, temp_min_c: 2.0, temp_max_c: 8.0 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
          trigger:
            - call: "POST /cargo/bookings/${b_id}/temperature-logs"
              payload: { recorded_at: "2026-08-09T10:00:00Z", temperature_c: 2.0 }
              as: RampOperator
              captures: { r1: $.data.in_range }
            - call: "POST /cargo/bookings/${b_id}/temperature-logs"
              payload: { recorded_at: "2026-08-09T11:00:00Z", temperature_c: 8.0 }
              as: RampOperator
              captures: { r2: $.data.in_range }
            - call: "POST /cargo/bookings/${b_id}/temperature-logs"
              payload: { recorded_at: "2026-08-09T12:00:00Z", temperature_c: 8.1 }
              as: RampOperator
              captures: { r3: $.data.in_range }
            - call: "POST /cargo/bookings/${b_id}/temperature-logs"
              payload: { recorded_at: "2026-08-09T13:00:00Z", temperature_c: 5.0 }
              as: RampOperator
              captures: { r4: $.data.in_range }
            - call: "GET /cargo/bookings/${b_id}"
              as: RampOperator
              captures: { cnt: $.data.temp_excursion_count, tst: $.data.temp_status }
          assert:
            - "${r1} == true and ${r2} == true (bounds inclusive) and ${r3} == false and ${r4} == true"
            - "${cnt} == 1 and ${tst} == EXCURSION (sticky — the in-range 5.0 reading does not clear it)"

      - name: claim_approved_amount_capped_by_claimed
        claim_type: correct_result
        grounds: [calculations.claim_settlement_calculation, entities.Claim.fields.approved_amount]
        distinguishing_aspect: "When claimed_amount (10) is the smallest of the three min() terms, approved_amount equals claimed_amount exactly (10.00), with item_total 19.00 and liability cap 1900.00 both observable."
        test_recipe:
          setup: ["Booking 100kg LOADED on departed flight CA317"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA317", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00108CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-CC", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_id}", claim_type: "DAMAGE", claimed_amount: 10, items: [{ weight_kg: 1 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /cargo/claims/${c_id}/approve"
              as: ClaimsAdjuster
              captures: { it: $.data.item_total, ap: $.data.approved_amount }
          assert:
            - "${it} == 19.00 and ${ap} == 10.00 (min picks the claimed_amount term)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: role_check_precedes_existence_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A caller with a wrong role AND a nonexistent path id gets ERR_FORBIDDEN (p2), never ERR_NOT_FOUND (p3) — authorization precedes existence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cargo/flights/00000000-0000-0000-0000-000000000000/close"
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN (close is CapacityController-only; role check fires before the 404)"

      - name: accept_volume_boundary_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_FLIGHT_VOLUME_EXCEEDED]"]
        distinguishing_aspect: "Volume is an independent pool: 10.0 + 0.1 > 10.0 m3 rejects with ERR_FLIGHT_VOLUME_EXCEEDED even though weight has ample headroom."
        test_recipe:
          setup: ["Flight CA318 cap 1000kg/10m3 OPEN_FOR_BOOKING; B1 1kg/10m3 ACCEPTED; B2 1kg/0.1m3 REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA318", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-V3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 1, volume_m3: 10 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-V4", commodity_code: "GEN", pieces: 1, gross_weight_kg: 1, volume_m3: 0.1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FLIGHT_VOLUME_EXCEEDED (10 + 0.1 > 10; strictly-greater rule)"

      - name: dg_declaration_on_non_dg_booking_not_applicable
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DG_NOT_APPLICABLE]"]
        distinguishing_aspect: "Filing a DG declaration against a booking with is_dangerous_goods false fails with ERR_DG_NOT_APPLICABLE (422)."
        test_recipe:
          setup: ["Flight CA319; non-DG booking REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA319", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-N1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 50, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1263", dg_class: "3", packing_group: "II", declaration_doc_ref: "DGD-1" }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DG_NOT_APPLICABLE"

      - name: temp_log_without_range_not_defined
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_TEMP_RANGE_NOT_DEFINED]"]
        distinguishing_aspect: "Temperature logging on a booking with no temp range fails with ERR_TEMP_RANGE_NOT_DEFINED — even when the booking is in a loggable state (ACCEPTED)."
        test_recipe:
          setup: ["Flight CA320 OPEN_FOR_BOOKING; booking without temp range ACCEPTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA320", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-N2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 50, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
          trigger:
            - call: "POST /cargo/bookings/${b_id}/temperature-logs"
              payload: { recorded_at: "2026-08-09T10:00:00Z", temperature_c: 5.0 }
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TEMP_RANGE_NOT_DEFINED"

      - name: assign_booking_on_wrong_flight_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BOOKING_FLIGHT_MISMATCH]"]
        distinguishing_aspect: "Assigning a booking to a plan belonging to a DIFFERENT flight fails with ERR_BOOKING_FLIGHT_MISMATCH (422) — the booking is ACCEPTED and otherwise fully eligible."
        test_recipe:
          setup: ["Flights CA321 and CA322 both OPEN_FOR_BOOKING; booking ACCEPTED on CA321; DRAFT plan on CA322"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA321", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f1: $.data.id }
            - call: "POST /cargo/flights/${f1}/open"
              as: CapacityController
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA322", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-11T08:00:00Z", scheduled_arrival: "2026-08-13T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f2: $.data.id }
            - call: "POST /cargo/flights/${f2}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-M2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00109CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f2}"
              as: RampOperator
              captures: { f2_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f2}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f2_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BOOKING_FLIGHT_MISMATCH"

      - name: uld_position_limit_exhausted
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_ULD_POSITION_UNAVAILABLE]", entities.Flight.fields.reserved_positions]
        distinguishing_aspect: "With uld_position_count 1, one DRAFT plan reserves the only position; a second plan (no window conflict, different ULD) fails with ERR_ULD_POSITION_UNAVAILABLE."
        test_recipe:
          setup: ["Flight CA323 OPEN_FOR_BOOKING, uld_position_count 1; ULDs AKE00110CA and AKE00111CA SERVICEABLE; plan P1 on the first ULD"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA323", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 1, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
