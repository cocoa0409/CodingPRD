scenario: |
  Robo-Advisor Tax-Loss Harvesting: client risk questionnaire scoring (conservative to aggressive
  risk tolerance), model portfolio assignment based on risk score and time horizon, correlation-based
  replacement security selection avoiding IRS Wash Sale 30-day rule (cannot buy substantially identical
  security within 30 days before/after sale), quarterly automated portfolio rebalancing back to target
  allocation, automatic dividend and interest reinvestment, 1099-B tax form generation with realized
  gains/losses for tax year, target asset allocation drift threshold (e.g. 5% absolute deviation
  triggers rebalance), tax-loss harvesting trigger on individual position losses exceeding minimum
  dollar threshold.

domain_name: robo-advisor-tlh
api_prefix: /accounts

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # IRS Wash Sale rule + 1099-B regulatory output
  secondary_archetype: ledger_reconciliation   # Cost basis (FIFO vs SpecID) → divergent P/L
  complexity_layers:
    - rate_threshold_triggers                  # 5% drift, $500 harvest threshold, ±30-day wash window
    - cascading_side_effects                   # Sell → close lot → wash check → basis adjustment → opportunity execution
    - dual_variant_calculation                 # FIFO vs SpecID; standard vs age-adjusted risk score
    - ops_run_checkpoint                       # Quarterly rebalance run advances epoch
    - scheduled_deferred_actions               # Wash sale window, quarterly rebalance, dividend reinvest

  entity_topology: hybrid
  # Hierarchy: Client → Account → Position → Lot; flat junctions: Trade (Account×Security),
  # WashSaleEvent (Trade×Trade), CorrelationLink (Security×Security).

  state_machine_shape: parallel
  # Account has two independent dimensions (compliance_status × investment_status); RebalanceRun
  # is branching/fork-join with multiple terminal states; HarvestOpportunity is cyclic
  # (DETECTED → DISMISSED → DETECTED on a later quarter).

  relationship_patterns:
    - one_to_many                              # Client→Account→Position→Lot, RebalanceRun→Trade
    - many_to_many                             # Security ↔ Security via CorrelationLink, Trade ↔ Trade via WashSaleEvent
    - self_referential                         # Security.substantially_identical_group_id groups securities
    - cross_aggregate                          # WashSaleEvent links Trades that may belong to different lots/positions

  role_model: peer_roles
  # Client owns Account/Trade requests; Advisor approves model assignments and rebalances;
  # ComplianceOfficer freezes accounts; TaxAdmin issues 1099-B; system performs automated runs.
  # Each role owns a different set of operations.

  consistency_model: immediate
  # All state changes (sells, basis adjustments, drift recompute) settle within a single
  # API request transaction; rebalance run executes its child trades atomically.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the client.
        constraints: 1–120 chars
      - name: birth_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); used to derive age for age-adjusted risk variant.
      - name: age
        type: integer
        source: computed
        description: Floor years between birth_date and the latest clock epoch; recomputed on clock advance.
      - name: kyc_status
        type: enum
        source: system
        description: KYC lifecycle status.
        default: PENDING
        constraints: "Enum values: PENDING, ACTIVE, SUSPENDED."
      - name: risk_band
        type: enum
        source: computed
        description: Risk band assigned from the latest submitted RiskQuestionnaire (null until first submission).
        default: null
        constraints: "Enum values: CONSERVATIVE, MODERATE, AGGRESSIVE."
      - name: time_horizon_years
        type: integer
        source: input
        description: Investment time horizon in whole years (1–40); used with risk_band to assign a model portfolio.
        constraints: 1 ≤ value ≤ 40

  - name: RiskQuestionnaire
    parent: Client
    common_fields: false  # Immutable submission record (append-only).
    fields:
      - name: client_id
        type: string
        source: input
        description: Foreign key to Client.id.
      - name: submitted_at
        type: datetime
        source: system
        description: Server clock timestamp when the questionnaire was submitted.
      - name: q1_loss_tolerance
        type: integer
        source: input
        description: Answer 1–5; how the client tolerates a 20% one-year drawdown.
        constraints: 1 ≤ value ≤ 5
      - name: q2_volatility_comfort
        type: integer
        source: input
        description: Answer 1–5; comfort with month-to-month account swings.
        constraints: 1 ≤ value ≤ 5
      - name: q3_growth_vs_stability
        type: integer
        source: input
        description: Answer 1–5; preference for growth over capital preservation.
        constraints: 1 ≤ value ≤ 5
      - name: q4_liquidity_need
        type: integer
        source: input
        description: Answer 1–5; how liquid the client needs the account (lower = more liquid).
        constraints: 1 ≤ value ≤ 5
      - name: q5_experience
        type: integer
        source: input
        description: Answer 1–5; self-reported investment experience.
        constraints: 1 ≤ value ≤ 5
      - name: scoring_method
        type: enum
        source: input
        description: Selected scoring variant.
        default: STANDARD
        constraints: "Enum values: STANDARD, AGE_ADJUSTED."
      - name: raw_score
        type: integer
        source: computed
        description: Weighted sum produced by the risk_score calculation; range 5–25 for STANDARD.
      - name: assigned_band
        type: enum
        source: computed
        description: Band derived from raw_score bucket boundaries (§1.3 risk_score).
        constraints: "Enum values: CONSERVATIVE, MODERATE, AGGRESSIVE."

  - name: ModelPortfolio
    parent: null
    common_fields: false  # Configuration entity, immutable after creation.
    fields:
      - name: risk_band
        type: enum
        source: input
        description: Risk band this model serves.
        constraints: "Enum values: CONSERVATIVE, MODERATE, AGGRESSIVE."
      - name: horizon_band
        type: enum
        source: input
        description: Time horizon band derived from Client.time_horizon_years (SHORT 1–5, MID 6–15, LONG ≥16).
        constraints: "Enum values: SHORT, MID, LONG."
      - name: target_allocation
        type: object
        source: input
        description: |
          Mapping of asset_class → target_weight (decimal 0–1). The five fixed asset classes are
          US_EQUITY, INTL_EQUITY, US_BOND, INTL_BOND, CASH. Weights MUST sum to exactly 1.000.
      - name: is_active
        type: boolean
        source: input
        description: Whether this model is currently assignable.
        default: true

  - name: Account
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: Foreign key to Client.id (one Client may hold multiple Accounts).
      - name: model_portfolio_id
        type: string
        source: computed
        description: |
          Foreign key to ModelPortfolio.id assigned by the model_portfolio_assignment calculation
          (uses Client.risk_band × horizon_band). Null until first assignment.
        default: null
      - name: cash_balance_cents
        type: integer
        source: computed
        description: |
          Settled cash in the account in cents. Mutates on every Trade settle, dividend posting,
          and fee deduction. Conserved per cash_conservation invariant.
        default: 0
      - name: compliance_status
        type: enum
        source: system
        description: Parallel dimension — compliance gate set by ComplianceOfficer.
        default: ACTIVE
        constraints: "Enum values: ACTIVE, FROZEN_DOC_REVIEW."
      - name: investment_status
        type: enum
        source: system
        description: Parallel dimension — operational gate set by system during runs.
        default: ACCUMULATING
        constraints: "Enum values: ACCUMULATING, REBALANCING, HARVESTING."
      - name: max_drift_pct
        type: number
        source: computed
        description: |
          Latest computed maximum absolute deviation across asset classes (in percent, e.g., 5.27 means
          5.27 percentage points). Refreshed by every recompute_drift call and rebalance run.
        default: 0.00

  - name: Security
    parent: null
    common_fields: false
    fields:
      - name: ticker
        type: string
        source: input
        description: Trading symbol (e.g., "VTI").
        constraints: 1–10 uppercase chars, unique across catalog
      - name: asset_class
        type: enum
        source: input
        description: Asset bucket for allocation accounting.
        constraints: "Enum values: US_EQUITY, INTL_EQUITY, US_BOND, INTL_BOND, CASH."
      - name: substantially_identical_group_id
        type: string
        source: input
        description: |
          Self-referential grouping identifier. Securities sharing this id are treated as
          substantially identical for IRS Wash Sale purposes (e.g., VTI and VTSAX).
      - name: is_investable
        type: boolean
        source: input
        description: Whether the security may be bought; if false, replacement selection and rebalance
          buys must skip it.
        default: true
      - name: last_price_cents
        type: integer
        source: input
        description: Most recent price in cents; updated by POST /_pricing/set.

  - name: CorrelationLink
    parent: null
    common_fields: false  # Immutable association record.
    fields:
      - name: security_a_id
        type: string
        source: input
        description: Foreign key to Security.id (lower lexical id by convention).
      - name: security_b_id
        type: string
        source: input
        description: Foreign key to Security.id (higher lexical id by convention).
      - name: correlation
        type: number
        source: input
        description: Pearson correlation in [-1.0, 1.0]; used to rank replacement candidates.
        constraints: -1.0 ≤ value ≤ 1.0

  - name: Position
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: Foreign key to Account.id.
      - name: security_id
        type: string
        source: input
        description: Foreign key to Security.id.
      - name: shares
        type: number
        source: computed
        description: Sum of Lot.shares_remaining for OPEN/PARTIALLY_CLOSED lots in this position.
      - name: total_cost_basis_cents
        type: integer
        source: computed
        description: Sum over OPEN/PARTIALLY_CLOSED lots of (shares_remaining × adjusted_unit_cost_cents).
      - name: market_value_cents
        type: integer
        source: computed
        description: shares × Security.last_price_cents (recomputed on price update and on read).

  - name: Lot
    parent: Position
    common_fields: true
    fields:
      - name: position_id
        type: string
        source: input
        description: Foreign key to Position.id.
      - name: buy_trade_id
        type: string
        source: input
        description: Foreign key to Trade.id of the BUY that opened this lot.
      - name: acquired_at
        type: datetime
        source: system
        description: Trade execution timestamp captured at lot opening; used for FIFO ordering and short/long term classification.
      - name: shares_opened
        type: number
        source: input
        description: Shares acquired when this lot opened (immutable after creation).
      - name: shares_remaining
        type: number
        source: computed
        description: shares_opened minus cumulative closed shares.
      - name: unit_cost_cents
        type: integer
        source: input
        description: Original purchase price per share in cents.
      - name: adjusted_unit_cost_cents
        type: integer
        source: computed
        description: |
          unit_cost_cents adjusted upward by any per-share wash-sale disallowed-loss boost
          (see §1.3 wash_sale_basis_adjustment).
      - name: status
        type: enum
        source: system
        description: Lot lifecycle status.
        default: OPEN
        constraints: "Enum values: OPEN, PARTIALLY_CLOSED, CLOSED."

  - name: Trade
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: Foreign key to Account.id.
      - name: security_id
        type: string
        source: input
        description: Foreign key to Security.id.
      - name: side
        type: enum
        source: input
        description: Trade side.
        constraints: "Enum values: BUY, SELL."
      - name: requested_shares
        type: number
        source: input
        description: Requested quantity (positive number, may be fractional to 4 dp).
      - name: cost_basis_method
        type: enum
        source: input
        description: |
          Selected basis-consumption method (SELL only; ignored for BUY). FIFO consumes oldest
          OPEN lot first; SPECIFIC_LOT requires specific_lot_id.
        default: FIFO
        constraints: "Enum values: FIFO, SPECIFIC_LOT."
      - name: specific_lot_id
        type: string
        source: input
        description: Lot.id consumed by this SELL when cost_basis_method=SPECIFIC_LOT; required iff that method.
        default: null
      - name: rebalance_run_id
        type: string
        source: input
        description: Foreign key to RebalanceRun.id when emitted by a rebalance; null for client-initiated trades.
        default: null
      - name: status
        type: enum
        source: system
        description: Trade lifecycle status.
        default: PENDING
        constraints: "Enum values: PENDING, EXECUTED, SETTLED, CANCELLED, REJECTED."
      - name: executed_at
        type: datetime
        source: system
        description: Server clock timestamp when status moved PENDING→EXECUTED.
        default: null
      - name: execution_price_cents
        type: integer
        source: system
        description: Per-share price in cents at execution (snapshot of Security.last_price_cents at EXECUTED transition).
        default: null
      - name: gross_proceeds_cents
        type: integer
        source: computed
        description: SELL only — requested_shares × execution_price_cents, rounded half-up to whole cents per trade.
        default: null
      - name: realized_gain_loss_cents
        type: integer
        source: computed
        description: |
          SELL only — sum over consumed lots of (proceeds_share − adjusted_unit_cost_cents) × shares_consumed,
          rounded half-up to whole cents per trade (see §1.3 realized_gain_loss).
        default: null
      - name: disallowed_loss_cents
        type: integer
        source: computed
        description: |
          SELL only — portion of realized_gain_loss_cents disallowed by the wash sale rule
          (0 if no replacement window match). Adds to replacement lot's adjusted_unit_cost_cents.
        default: 0

  - name: WashSaleEvent
    parent: null
    common_fields: false  # Immutable forensic record.
    fields:
      - name: sell_trade_id
        type: string
        source: system
        description: Foreign key to the SELL Trade.id that realized the loss.
      - name: replacement_trade_id
        type: string
        source: system
        description: Foreign key to the BUY Trade.id that triggered the wash sale (within ±30 calendar days, same group).
      - name: group_id
        type: string
        source: system
        description: Security.substantially_identical_group_id common to both trades.
      - name: matched_shares
        type: number
        source: system
        description: Lesser of SELL shares and BUY shares within the window (the matched portion).
      - name: disallowed_loss_cents
        type: integer
        source: system
        description: |
          Loss disallowed on the matched shares; equals (matched_shares × loss_per_share) rounded
          half-up to whole cents.
      - name: replacement_lot_id
        type: string
        source: system
        description: Foreign key to the Lot.id whose adjusted_unit_cost_cents received the basis boost.
      - name: recorded_at
        type: datetime
        source: system
        description: Server clock timestamp when the event was written.

  - name: HarvestOpportunity
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: Foreign key to Account.id.
      - name: position_id
        type: string
        source: input
        description: Foreign key to Position.id flagged for harvesting.
      - name: unrealized_loss_cents
        type: integer
        source: computed
        description: |
          market_value_cents − total_cost_basis_cents at detection time; negative for a loss.
          Must satisfy unrealized_loss_cents ≤ -MIN_HARVEST_THRESHOLD_CENTS to be DETECTED.
      - name: replacement_security_id
        type: string
        source: computed
        description: |
          Top-ranked Security from CorrelationLink (correlation DESC, ticker ASC tie-break) where
          group_id differs from the held security's group and is_investable is true. May be null
          if no eligible replacement exists (then opportunity goes BLOCKED).
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle status.
        default: DETECTED
        constraints: "Enum values: DETECTED, APPROVED, EXECUTED, DISMISSED, BLOCKED."
      - name: detected_at
        type: datetime
        source: system
        description: Server clock timestamp when first detected.

  - name: RebalanceRun
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: Foreign key to Account.id.
      - name: quarter_key
        type: string
        source: input
        description: Calendar quarter bucket, format "YYYY-Qn" (e.g., "2026-Q2"); one run per quarter per account.
      - name: max_drift_pct_at_start
        type: number
        source: system
        description: Maximum asset-class drift captured at run start.
      - name: status
        type: enum
        source: system
        description: Run lifecycle status (branching state machine).
        default: SCHEDULED
        constraints: "Enum values: SCHEDULED, IN_PROGRESS, COMPLETED, BLOCKED_BY_WASH_SALE, FAILED."
      - name: started_at
        type: datetime
        source: system
        description: Server clock timestamp on SCHEDULED→IN_PROGRESS.
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Server clock timestamp on entering a terminal state.
        default: null

  - name: DividendEvent
    parent: Account
    common_fields: false  # Immutable receipt record.
    fields:
      - name: account_id
        type: string
        source: input
        description: Foreign key to Account.id.
      - name: security_id
        type: string
        source: input
        description: Foreign key to Security.id paying the dividend.
      - name: amount_cents
        type: integer
        source: input
        description: Dividend or interest amount in whole cents (positive integer).
      - name: received_at
        type: datetime
        source: system
        description: Server clock timestamp at receipt.
      - name: reinvest_trade_id
        type: string
        source: system
        description: Foreign key to the BUY Trade.id auto-generated by the reinvestment side effect.
        default: null

  - name: Form1099B
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: Foreign key to Client.id.
      - name: tax_year
        type: integer
        source: input
        description: Calendar year for which the form is issued (e.g., 2025); unique per client.
      - name: short_term_proceeds_cents
        type: integer
        source: computed
        description: Sum of gross_proceeds_cents over SELL trades with holding period ≤365 days, SETTLED in the tax year.
      - name: short_term_cost_basis_cents
        type: integer
        source: computed
        description: Sum of consumed adjusted_unit_cost_cents × shares for the same trade set.
      - name: short_term_realized_gain_loss_cents
        type: integer
        source: computed
        description: short_term_proceeds_cents − short_term_cost_basis_cents.
      - name: long_term_proceeds_cents
        type: integer
        source: computed
        description: Same as short-term but for holding period >365 days.
      - name: long_term_cost_basis_cents
        type: integer
        source: computed
        description: Same as short-term cost basis but for long-term.
      - name: long_term_realized_gain_loss_cents
        type: integer
        source: computed
        description: long_term_proceeds_cents − long_term_cost_basis_cents.
      - name: total_disallowed_wash_sale_cents
        type: integer
        source: computed
        description: Sum of disallowed_loss_cents across SELL trades SETTLED in the tax year.
      - name: status
        type: enum
        source: system
        description: Form lifecycle.
        default: DRAFT
        constraints: "Enum values: DRAFT, ISSUED, VOIDED."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: PENDING
    terminal_states: []   # Cyclic — no terminal; SUSPENDED can return to ACTIVE.
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /clients/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Client has at least one submitted RiskQuestionnaire."
          - "Client.time_horizon_years is set."
        side_effects:
          - "model_portfolio_assignment runs: Account.model_portfolio_id populated for every Account of this client where it was null."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "All Accounts belonging to this client: compliance_status set to FROZEN_DOC_REVIEW (cascade)."
          - "All HarvestOpportunity rows with status=DETECTED for those accounts transition to DISMISSED."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Each affected Account.compliance_status set back to ACTIVE (cascade)."

  - entity: Account
    initial_state: ACCUMULATING
    terminal_states: []
    note: |
      Account carries two parallel dimensions: compliance_status (ACTIVE | FROZEN_DOC_REVIEW)
      and investment_status (ACCUMULATING | REBALANCING | HARVESTING). They evolve independently.
    transitions:
      - from: ACCUMULATING
        to: REBALANCING
        trigger: "POST /accounts/{id}/rebalance/start (or system on quarterly tick)"
        actor: Advisor
        preconditions:
          - "Account.compliance_status == ACTIVE."
          - "No prior RebalanceRun exists with quarter_key == current quarter and status NOT IN {FAILED}."
          - "max_drift_pct >= 5.00 OR caller passed force=true."
        side_effects:
          - "RebalanceRun created in SCHEDULED then transitioned to IN_PROGRESS in the same call."
      - from: REBALANCING
        to: ACCUMULATING
        trigger: "system: RebalanceRun reaches COMPLETED or BLOCKED_BY_WASH_SALE or FAILED"
        actor: system
        preconditions:
          - "Associated RebalanceRun is in a terminal state."
        side_effects:
          - "Account.max_drift_pct refreshed from post-run holdings."
      - from: ACCUMULATING
        to: HARVESTING
        trigger: "POST /accounts/{id}/harvest-opportunities/{oppId}/execute"
        actor: Advisor
        preconditions:
          - "HarvestOpportunity.status == APPROVED."
          - "Account.compliance_status == ACTIVE."
        side_effects:
          - "Companion SELL Trade emitted PENDING."
      - from: HARVESTING
        to: ACCUMULATING
        trigger: "system: SELL Trade for harvest reaches SETTLED"
        actor: system
        preconditions:
          - "All trades associated with the harvest opportunity are in terminal Trade states."
        side_effects:
          - "Account.max_drift_pct recomputed."

  - entity: Trade
    initial_state: PENDING
    terminal_states: [SETTLED, CANCELLED, REJECTED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /accounts/{accountId}/trades/{tradeId}/execute"
        actor: Advisor
        preconditions:
          - "Account.compliance_status == ACTIVE  (cross-entity state dependency: Trade depends on Account)."
          - "For SELL: target Position has enough OPEN/PARTIALLY_CLOSED shares; for FIFO, oldest lot exists; for SPECIFIC_LOT, specific_lot_id resolves to a lot with shares_remaining ≥ requested_shares."
          - "For BUY: Security.is_investable is true."
          - "For BUY: Account.cash_balance_cents ≥ requested_shares × execution_price_cents (rounded up)."
        side_effects:
          - "Trade.execution_price_cents snapshot from Security.last_price_cents."
          - "Trade.executed_at = clock_now."
          - "For SELL: realized_gain_loss calculation runs, lots are consumed (Lot transitions OPEN→PARTIALLY_CLOSED or →CLOSED), realized_gain_loss_cents and gross_proceeds_cents persisted on Trade."
          - "For BUY: a new Lot is created in OPEN with shares_opened=requested_shares, unit_cost_cents=execution_price_cents."
      - from: EXECUTED
        to: SETTLED
        trigger: "POST /_settle/run  OR  POST /accounts/{accountId}/trades/{tradeId}/settle"
        actor: system | Advisor
        preconditions:
          - "Trade.status == EXECUTED."
        side_effects:
          - "Account.cash_balance_cents decremented (BUY) or incremented (SELL) by gross_proceeds_cents."
          - "For SELL: wash_sale_basis_adjustment runs over the ±30-day window; if matched, a WashSaleEvent is written, Trade.disallowed_loss_cents set, replacement Lot.adjusted_unit_cost_cents boosted."
          - "Position.shares, total_cost_basis_cents, market_value_cents recomputed."
          - "harvest_opportunity_detection runs on the affected Position."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/trades/{tradeId}/cancel"
        actor: Client | Advisor
        preconditions:
          - "Trade.status == PENDING."
          - "Trade.rebalance_run_id IS NULL (rebalance children cannot be cancelled individually)."
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "system: execute fails a precondition during automated run"
        actor: system
        preconditions: []
        side_effects:
          - "If parent RebalanceRun exists: bubble up RebalanceRun.status to FAILED unless cause is wash sale (then BLOCKED_BY_WASH_SALE)."

  - entity: Lot
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PARTIALLY_CLOSED
        trigger: "system: SELL Trade execution consumes some but not all shares"
        actor: system
        preconditions:
          - "0 < shares_consumed < shares_remaining."
        side_effects:
          - "shares_remaining decremented by shares_consumed."
      - from: OPEN
        to: CLOSED
        trigger: "system: SELL Trade execution consumes all shares"
        actor: system
        preconditions:
          - "shares_consumed == shares_remaining."
        side_effects:
          - "shares_remaining set to 0."
      - from: PARTIALLY_CLOSED
        to: CLOSED
        trigger: "system: subsequent SELL Trade closes the remainder"
        actor: system
        preconditions:
          - "shares_consumed == shares_remaining."
        side_effects:
          - "shares_remaining set to 0."

  - entity: RebalanceRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, BLOCKED_BY_WASH_SALE, FAILED]
    note: |
      Branching fork-join: from IN_PROGRESS the run branches into three divergent terminal states
      with distinct side-effect sets.
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /accounts/{id}/rebalance/start  OR  POST /_quarterly/run"
        actor: Advisor | system
        preconditions:
          - "Account.compliance_status == ACTIVE."
          - "No other RebalanceRun for the same Account with status IN_PROGRESS."
        side_effects:
          - "Account.investment_status set to REBALANCING."
          - "max_drift_pct_at_start captured."
          - "Child Trades (sell over-weight, buy under-weight) emitted in PENDING."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: all child Trades SETTLED with no wash sale blocks"
        actor: system
        preconditions:
          - "All child Trades in {SETTLED}."
          - "No child Trade has disallowed_loss_cents > 0."
        side_effects:
          - "completed_at = clock_now."
          - "Account.investment_status set back to ACCUMULATING."
          - "Account.max_drift_pct recomputed (post-rebalance value)."
      - from: IN_PROGRESS
        to: BLOCKED_BY_WASH_SALE
        trigger: "system: at least one child Trade would create a wash sale and blocking is enforced"
        actor: system
        preconditions:
          - "Any child BUY Trade targets a Security whose group_id matches the group of a SELL settled within the last 30 calendar days on the same Account, AND the wash_sale_block_policy is BLOCK."
        side_effects:
          - "Blocking child Trade(s) set to REJECTED."
          - "Account.investment_status set back to ACCUMULATING."
          - "completed_at = clock_now."
      - from: IN_PROGRESS
        to: FAILED
        trigger: "system: child Trade rejected for a non-wash-sale reason"
        actor: system
        preconditions:
          - "Any child Trade in REJECTED with cause != WASH_SALE."
        side_effects:
          - "All remaining PENDING child Trades set to CANCELLED."
          - "Account.investment_status set back to ACCUMULATING."
          - "completed_at = clock_now."

  - entity: HarvestOpportunity
    initial_state: DETECTED
    terminal_states: [EXECUTED]
    note: |
      Cyclic: DISMISSED is non-terminal — a future detection on the same Position re-creates a new
      HarvestOpportunity row, and the prior row stays DISMISSED (cycle observed at the Position
      timeline, not at row level). BLOCKED can transition back to DETECTED after the wash window expires.
    transitions:
      - from: DETECTED
        to: APPROVED
        trigger: "POST /accounts/{accountId}/harvest-opportunities/{id}/approve"
        actor: Advisor
        preconditions:
          - "Account.compliance_status == ACTIVE."
          - "Account.investment_status != REBALANCING (cross-entity state dependency: HarvestOpportunity depends on Account)."
          - "replacement_security_id IS NOT NULL."
        side_effects: []
      - from: DETECTED
        to: BLOCKED
        trigger: "system: replacement selection finds no eligible candidate"
        actor: system
        preconditions:
          - "No Security exists with group_id != held.group_id, is_investable=true, AND a CorrelationLink to the held security."
        side_effects: []
      - from: BLOCKED
        to: DETECTED
        trigger: "system: re-evaluation after new CorrelationLink or new investable Security added"
        actor: system
        preconditions:
          - "An eligible replacement now exists."
        side_effects:
          - "replacement_security_id repopulated."
      - from: DETECTED
        to: DISMISSED
        trigger: "POST /accounts/{accountId}/harvest-opportunities/{id}/dismiss  OR  Client suspension cascade"
        actor: Advisor | system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "system: companion SELL Trade reaches SETTLED with realized loss"
        actor: system
        preconditions:
          - "Companion SELL Trade.status == SETTLED."
        side_effects:
          - "Account.investment_status returns to ACCUMULATING."

  - entity: Form1099B
    initial_state: DRAFT
    terminal_states: [ISSUED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /clients/{id}/forms-1099b/{formId}/issue"
        actor: TaxAdmin
        preconditions:
          - "Client.kyc_status == ACTIVE (cross-entity state dependency: Form1099B depends on Client)."
          - "No SELL Trade for this Client in this tax_year is still in PENDING or EXECUTED (all must be SETTLED, CANCELLED, or REJECTED)."
        side_effects:
          - "Form snapshot frozen: short_term_*, long_term_*, total_disallowed_wash_sale_cents pinned to values at issue time."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /clients/{id}/forms-1099b/{formId}/void"
        actor: TaxAdmin
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /clients/{id}/forms-1099b/{formId}/void"
        actor: TaxAdmin
        preconditions:
          - "Issued less than 30 calendar days ago."
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two simultaneous POST /accounts/{id}/rebalance/start calls for the same Account in the same quarter."
    guarantee: "Exactly one RebalanceRun is created for that (account_id, quarter_key); the loser is rejected."
    error_id: ERR_REBALANCE_ALREADY_IN_PROGRESS
    http_status: 409
    serialization: "First-writer-wins on the (account_id, quarter_key) uniqueness constraint."

  - scenario: "Two simultaneous executes of distinct SELL Trades against the same Lot when SPECIFIC_LOT is selected and remaining shares only cover one."
    guarantee: "Only one execute succeeds; the second is rejected because shares_remaining is now insufficient."
    error_id: ERR_INSUFFICIENT_LOT_SHARES
    http_status: 409
    serialization: "Lot.shares_remaining is a versioned monotonic resource — first-writer-wins on decrement."

  - scenario: "Client cancel and Advisor execute issued simultaneously on the same PENDING Trade."
    guarantee: "Exactly one wins; the loser observes the trade in a terminal state and is rejected."
    error_id: ERR_INVALID_TRADE_STATE
    http_status: 409
    serialization: "First-writer-wins on Trade.status."

  - scenario: "Two simultaneous Form1099B creates for the same (client_id, tax_year)."
    guarantee: "Only one form exists per (client_id, tax_year); second create rejected."
    error_id: ERR_FORM_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique constraint on (client_id, tax_year)."

  - scenario: "Two simultaneous risk questionnaire submissions when ComplianceOfficer simultaneously suspends the Client."
    guarantee: "If suspension lands first, the submission is rejected; if submission lands first, suspension still succeeds and the new submission is the latest."
    error_id: ERR_CLIENT_NOT_ACCEPTING_INPUT
    http_status: 409
    serialization: "First-writer-wins on Client.kyc_status read at submission time."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: risk_score
    trigger: "POST /clients/{id}/risk-questionnaire (on submission)."
    algorithm: weighted_scoring
    formula: |
      # STANDARD method:
      raw = (W_LOSS * q1_loss_tolerance)
          + (W_VOL  * q2_volatility_comfort)
          + (W_GROW * q3_growth_vs_stability)
          + (W_LIQ  * (6 - q4_liquidity_need))      # invert liquidity: low need → higher score
          + (W_EXP  * q5_experience)
      # Bucketing:
      band = CONSERVATIVE if raw <= 10
           else MODERATE  if raw <= 17
           else AGGRESSIVE
    input_set: |
      Exactly one RiskQuestionnaire row's five integer answers plus Client.birth_date and the
      latest clock epoch (for the AGE_ADJUSTED variant only).
    constants:
      W_LOSS: 1
      W_VOL: 1
      W_GROW: 1
      W_LIQ: 1
      W_EXP: 1
      CONSERVATIVE_MAX: 10
      MODERATE_MAX: 17
      AGGRESSIVE_MAX: 25
      AGE_BIAS_THRESHOLD: 55
    precision: "Integer raw_score; band assigned by the bucketing rule."
    variants:
      - name: STANDARD
        when: "scoring_method == STANDARD."
        difference: |
          Equal weights of 1 across all five questions; the raw_score is the straight sum
          (with q4 inverted as 6 - q4).
      - name: AGE_ADJUSTED
        when: "scoring_method == AGE_ADJUSTED AND Client.age >= 55."
        difference: |
          Same raw formula EXCEPT q3_growth_vs_stability contribution is replaced by
          (W_GROW * (6 - q3_growth_vs_stability)), inverting the growth-vs-stability axis to
          bias older clients toward stability. For the same answers, STANDARD and AGE_ADJUSTED
          can place the client in different bands.

  - name: model_portfolio_assignment
    trigger: "Client.PENDING→ACTIVE transition; also POST /accounts/{id}/reassign-model after risk_band or time_horizon_years change."
    algorithm: tiered_pricing
    formula: |
      horizon_band = SHORT if time_horizon_years in [1..5]
                  else MID   if time_horizon_years in [6..15]
                  else LONG  # 16..40
      # Select active ModelPortfolio where:
      #   risk_band == Client.risk_band AND horizon_band == derived horizon_band AND is_active=true
      # Tie-break: lower id alphabetically (stable selector).
    input_set: |
      Client.risk_band, Client.time_horizon_years, the set of ModelPortfolio rows with is_active=true.
    constants:
      SHORT_MAX: 5
      MID_MAX: 15
      LONG_MAX: 40
    precision: "N/A — exact match selection."
    variants: []

  - name: realized_gain_loss
    trigger: "Trade SELL: PENDING→EXECUTED transition (lots consumed); finalized at EXECUTED→SETTLED with wash sale adjustment."
    algorithm: chronological
    formula: |
      # Step 1: pick lots to consume per cost_basis_method.
      if method == FIFO:
          lots = sort(OPEN ∪ PARTIALLY_CLOSED lots for Position) by acquired_at ASC, id ASC
      elif method == SPECIFIC_LOT:
          lots = [Lot with id == specific_lot_id]   # MUST belong to the same Position
      # Step 2: consume shares from each lot in order.
      remaining = requested_shares
      total_basis_cents = 0
      for lot in lots:
          take = min(remaining, lot.shares_remaining)
          total_basis_cents += round_half_up(take * lot.adjusted_unit_cost_cents)
          remaining -= take
          if remaining == 0: break
      # Step 3:
      gross_proceeds_cents = round_half_up(requested_shares * execution_price_cents)
      realized_gain_loss_cents = gross_proceeds_cents - total_basis_cents
    input_set: |
      The SELL Trade's requested_shares, execution_price_cents, and the matching Position's
      OPEN/PARTIALLY_CLOSED lots ordered chronologically (FIFO) or the single Lot referenced by
      specific_lot_id (SPECIFIC_LOT).
    constants: {}
    precision: |
      Round half-up to whole cents PER TRADE (one rounding at the trade-level totals). Lot-level
      multiplications are kept as raw integer-cent arithmetic; only the trade totals
      total_basis_cents and gross_proceeds_cents are rounded.
    variants:
      - name: FIFO
        when: "Trade.cost_basis_method == FIFO."
        difference: |
          Consumes oldest OPEN lot first; deterministic for identical inputs and minimizes basis
          when prices have been rising (maximizing realized gain).
      - name: SPECIFIC_LOT
        when: "Trade.cost_basis_method == SPECIFIC_LOT and Trade.specific_lot_id is provided."
        difference: |
          Consumes only the named Lot. For identical SELL inputs (same Position, same shares,
          same price), FIFO and SPECIFIC_LOT typically produce DIFFERENT realized_gain_loss_cents
          when the named lot's adjusted_unit_cost_cents differs from the oldest lot's.

  - name: wash_sale_basis_adjustment
    trigger: "Trade SELL: EXECUTED→SETTLED transition (after realized_gain_loss is finalized)."
    algorithm: interval_merge
    formula: |
      # Only acts when the SELL realized a LOSS (realized_gain_loss_cents < 0).
      sell_date = floor_date(Trade.executed_at)   # UTC calendar date
      window_start = sell_date - 30 days          # inclusive
      window_end   = sell_date + 30 days          # inclusive (symmetric closed interval)
      group = Trade.security_id.substantially_identical_group_id
      # Find candidate replacement BUYS in window for the same Account, same group, status SETTLED.
      candidates = Trade rows where
          account_id == Trade.account_id AND
          side == BUY AND status == SETTLED AND
          security.substantially_identical_group_id == group AND
          floor_date(executed_at) BETWEEN window_start AND window_end
      sort candidates by executed_at ASC, id ASC
      # Match by share count.
      total_sell_shares = Trade.requested_shares
      total_matched = 0
      for cand in candidates:
          if total_matched >= total_sell_shares: break
          take = min(cand.requested_shares, total_sell_shares - total_matched)
          loss_per_share = round_half_up(realized_gain_loss_cents / total_sell_shares)  # negative
          disallowed_for_cand = round_half_up(take * (-loss_per_share))                 # positive
          # Emit WashSaleEvent + boost the candidate's BUY Lot.adjusted_unit_cost_cents:
          replacement_lot = Lot opened by cand (one-to-one)
          boost_per_share = round_half_up(disallowed_for_cand / cand.shares_opened)
          replacement_lot.adjusted_unit_cost_cents += boost_per_share
          Trade.disallowed_loss_cents += disallowed_for_cand
          total_matched += take
    input_set: |
      The settling SELL Trade plus all SETTLED BUY Trades on the same Account whose security shares
      the same substantially_identical_group_id and whose executed_at floor-date is within ±30
      calendar days of the SELL date.
    constants:
      WASH_WINDOW_DAYS: 30
    precision: |
      Round half-up to whole cents at each named step (loss_per_share, disallowed_for_cand,
      boost_per_share). DO NOT round again at aggregation time.
    variants: []

  - name: recompute_drift
    trigger: "After every Trade SETTLE; on POST /accounts/{id}/drift/recompute; at RebalanceRun.SCHEDULED→IN_PROGRESS."
    algorithm: aggregation
    formula: |
      total_market_value = sum over Positions: Position.market_value_cents + Account.cash_balance_cents
      for each asset_class C in {US_EQUITY, INTL_EQUITY, US_BOND, INTL_BOND, CASH}:
          current_weight[C] = (sum Position.market_value_cents where security.asset_class == C) / total_market_value
          # CASH bucket adds Account.cash_balance_cents.
          target_weight[C] = ModelPortfolio.target_allocation[C]
          drift[C] = abs(current_weight[C] - target_weight[C]) * 100   # in percentage points
      max_drift_pct = max over C of drift[C]
    input_set: |
      Every Position belonging to the Account (status doesn't matter — Position rows exist only
      when shares > 0; closed-out positions are deleted), the Account's ModelPortfolio's
      target_allocation, the cash_balance_cents.
    constants:
      DRIFT_TRIGGER_PCT: 5.00
    precision: |
      max_drift_pct is rounded half-up to 2 decimal places ONCE, at the end. Intermediate weights
      are NOT rounded.
    variants: []

  - name: harvest_opportunity_detection
    trigger: "POST /accounts/{id}/positions/recompute; system after every Trade SETTLE on the affected Position."
    algorithm: threshold
    formula: |
      for each Position in Account:
          unrealized = Position.market_value_cents - Position.total_cost_basis_cents
          if unrealized <= -MIN_HARVEST_THRESHOLD_CENTS:
              # Detect:
              opp = HarvestOpportunity(account_id, position_id, unrealized_loss_cents=unrealized, status=DETECTED)
              opp.replacement_security_id = pick_replacement(Position.security_id)
              if opp.replacement_security_id is null: opp.status = BLOCKED
      # pick_replacement(security_id):
      #   candidates = Securities S where
      #     S.is_investable AND
      #     S.substantially_identical_group_id != held.substantially_identical_group_id AND
      #     EXISTS CorrelationLink between S and held
      #   sort candidates by correlation DESC, ticker ASC; return top or null.
    input_set: |
      All Positions of the Account, their market_value_cents and total_cost_basis_cents, the
      CorrelationLink graph, and the Security catalog.
    constants:
      MIN_HARVEST_THRESHOLD_CENTS: 50000   # $500.00
    precision: "Integer cents throughout."
    variants: []

  - name: form_1099b_assembly
    trigger: "POST /clients/{id}/forms-1099b on form draft creation; refreshed each GET while status=DRAFT."
    algorithm: aggregation
    formula: |
      # For all Accounts of the Client:
      sells = Trade rows where side==SELL AND status==SETTLED AND year(executed_at) == tax_year
      def holding_period_days(trade):
          # Weighted average over consumed lots: each lot contributes (sell_date - lot.acquired_at).days,
          # weighted by shares_consumed. Compare against 365 for short vs long classification.
          pass
      def classify(trade):
          return SHORT if holding_period_days(trade) <= 365 else LONG
      # PINNED ROUNDING ORDER: each per-trade gross_proceeds_cents and per-trade cost_basis_cents are already
      # rounded once (in §1.3 realized_gain_loss). The 1099-B sums those already-rounded integers; NO
      # additional rounding is applied. (Per-trade-then-sum order; the alternative — sum exact lot products
      # then round — would yield different cents.)
      short_term_proceeds_cents       = sum(t.gross_proceeds_cents     for t in sells if classify(t)==SHORT)
      short_term_cost_basis_cents     = sum(t.gross_proceeds_cents - t.realized_gain_loss_cents for t in sells if classify(t)==SHORT)
      short_term_realized_gl_cents    = short_term_proceeds_cents - short_term_cost_basis_cents
      long_term_proceeds_cents        = sum(t.gross_proceeds_cents     for t in sells if classify(t)==LONG)
      long_term_cost_basis_cents      = sum(t.gross_proceeds_cents - t.realized_gain_loss_cents for t in sells if classify(t)==LONG)
      long_term_realized_gl_cents     = long_term_proceeds_cents - long_term_cost_basis_cents
      total_disallowed_wash_sale_cents = sum(t.disallowed_loss_cents for t in sells)
    input_set: |
      All SETTLED SELL Trade rows for every Account of the Client whose executed_at year equals
      tax_year; per-trade values are taken as-stored (already rounded).
    constants:
      LONG_TERM_DAY_THRESHOLD: 365
    precision: |
      Sum-of-rounded-trade-cents order — explicit; do NOT recompute pre-rounding sums of lot-level
      products and round at the end. The two orders disagree on edge cases.
    variants: []

  - name: dividend_reinvestment_amount
    trigger: "POST /accounts/{id}/dividends (records a DividendEvent and emits the reinvest BUY)."
    algorithm: threshold
    formula: |
      # Cash credited first:
      Account.cash_balance_cents += DividendEvent.amount_cents
      # Then determine reinvest target:
      held = Position for the same Account and security_id as the dividend payer.
      if held EXISTS and held.security.is_investable:
          target_security_id = held.security_id
      else:
          # Fallback: buy the model portfolio's CASH-class proxy security (deterministic by lowest
          # ticker alphabetically among is_investable=true, asset_class=CASH; null if none → no reinvest).
          target_security_id = first(Security where asset_class==CASH and is_investable=true ordered by ticker ASC)
      if target_security_id is null:
          return   # no reinvest; cash stays in account.
      price = target_security.last_price_cents
      shares = floor((amount_cents / price) * 10000) / 10000   # fractional shares to 4 dp, truncate
      if shares > 0:
          emit BUY Trade PENDING with requested_shares=shares, side=BUY, security_id=target_security_id
          Account.cash_balance_cents -= round_half_up(shares * price)
    input_set: |
      The new DividendEvent, the Position for the paying security on the same Account, the Security
      catalog (for CASH-class fallback), and Account.cash_balance_cents.
    constants:
      FRACTIONAL_SHARE_DECIMALS: 4
    precision: |
      Fractional shares truncated to 4 decimal places; spent cash rounded half-up to whole cents.
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  # ---- 1. Authentication ----
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and well-formed (UUID for entity-backed roles)."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  # ---- 2. Authorization ----
  - priority: 2
    category: auth
    check: "X-User-Role is one of the role names declared in §1.7 RBAC and is permitted for the requested operation."
    error_id: ERR_AUTH_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For an entity_backed role, the X-User-ID matches an existing instance of the backing entity (Client, Advisor)."
    error_id: ERR_AUTH_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: all

  # ---- 4. Existence (left-to-right path resolution) ----
  - priority: 4
    category: existence
    check: "Path parameter resources exist, validated left-to-right (e.g., /accounts/{id}/trades/{tradeId} resolves Account first, then Trade)."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Body foreign keys (client_id, account_id, security_id, position_id, replacement_security_id) reference existing rows."
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST/PUT/PATCH endpoints with body FK fields"

  # ---- 6. State preconditions ----
  - priority: 6
    category: state
    check: "Target resource is in a state where the requested operation is legal (per §1.2). E.g., cannot execute a Trade not in PENDING; cannot approve a HarvestOpportunity not in DETECTED; cannot issue a Form1099B not in DRAFT."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Target Trade is in PENDING and is not associated with a RebalanceRun (rebalance children cannot be individually cancelled)."
    error_id: ERR_INVALID_TRADE_STATE
    http_status: 409
    applies_to: "POST /accounts/{accountId}/trades/{tradeId}/cancel"

  # ---- 8–10. Business — safety / compliance first ----
  - priority: 8
    category: business_safety
    check: |
      For BUY Trade execution (including rebalance children, dividend reinvest, harvest replacement):
      the target Security must have is_investable=true AND must not be on a wash sale block
      relative to a SELL of the same group settled within the last 30 calendar days on the same Account.
    error_id: ERR_WASH_SALE_VIOLATION
    http_status: 422
    applies_to: "POST /accounts/{accountId}/trades/{tradeId}/execute (BUY side); RebalanceRun child trade emission"

  - priority: 9
    category: business_safety
    check: "Account.compliance_status must be ACTIVE for any mutating operation on the Account or its children."
    error_id: ERR_ACCOUNT_FROZEN
    http_status: 409
    applies_to: "all mutating endpoints under /accounts/{id}"

  - priority: 10
    category: business_referential
    check: "BUY Trade execution requires Security.is_investable == true (rejects delisted/non-tradable securities)."
    error_id: ERR_SECURITY_NOT_INVESTABLE
    http_status: 422
    applies_to: "POST /accounts/{accountId}/trades/{tradeId}/execute (BUY); HarvestOpportunity.replacement_security_id selection"

  # ---- 11–13. Business — constraint / temporal ----
  - priority: 11
    category: business_constraint
    check: "For SELL with cost_basis_method=SPECIFIC_LOT: specific_lot_id is non-null AND resolves to a Lot whose position_id equals the SELL's Position AND whose shares_remaining ≥ requested_shares."
    error_id: ERR_INSUFFICIENT_LOT_SHARES
    http_status: 422
    applies_to: "POST /accounts/{accountId}/trades (SELL) and execute"

  - priority: 12
    category: business_constraint
    check: "For SELL with cost_basis_method=FIFO: the sum of OPEN/PARTIALLY_CLOSED Lot.shares_remaining for the Position ≥ requested_shares."
    error_id: ERR_INSUFFICIENT_POSITION_SHARES
    http_status: 422
    applies_to: "POST /accounts/{accountId}/trades (SELL) and execute"

  - priority: 13
    category: business_temporal
    check: "For RebalanceRun creation: (account_id, quarter_key) must be unique; quarter_key must be the current quarter or a future quarter (no backfilling)."
    error_id: ERR_REBALANCE_ALREADY_IN_PROGRESS
    http_status: 409
    applies_to: "POST /accounts/{id}/rebalance/start, POST /_quarterly/run"

  - priority: 14
    category: business_constraint
    check: "Drift trigger: rebalance requires Account.max_drift_pct >= 5.00 (DRIFT_TRIGGER_PCT) unless caller passes force=true."
    error_id: ERR_DRIFT_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /accounts/{id}/rebalance/start"

  - priority: 15
    category: business_constraint
    check: |
      HarvestOpportunity detection requires the position's unrealized loss to satisfy
      unrealized_loss_cents <= -MIN_HARVEST_THRESHOLD_CENTS (i.e., a loss at least $500.00 in
      magnitude). The boundary is inclusive at -50000.
    error_id: ERR_HARVEST_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /accounts/{id}/positions/recompute (with intent=detect)"

  - priority: 16
    category: business_constraint
    check: "ModelPortfolio.target_allocation values must each be in [0.0, 1.0] and sum to exactly 1.000."
    error_id: ERR_ALLOCATION_INVALID
    http_status: 422
    applies_to: "POST /model-portfolios"

  - priority: 17
    category: business_constraint
    check: "CorrelationLink.correlation must be in [-1.0, 1.0]; security_a_id and security_b_id must differ."
    error_id: ERR_CORRELATION_INVALID
    http_status: 422
    applies_to: "POST /correlation-links"

  - priority: 18
    category: business_constraint
    check: "RiskQuestionnaire q1..q5 must each be integers in [1, 5]."
    error_id: ERR_QUESTIONNAIRE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /clients/{id}/risk-questionnaire"

  - priority: 19
    category: business_constraint
    check: "Client.time_horizon_years must be integer in [1, 40]."
    error_id: ERR_TIME_HORIZON_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /clients, PATCH /clients/{id}"

  - priority: 20
    category: business_constraint
    check: "Form1099B uniqueness: at most one row per (client_id, tax_year)."
    error_id: ERR_FORM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /clients/{id}/forms-1099b"

  - priority: 21
    category: business_referential
    check: "Form1099B issue requires zero non-terminal SELL Trades for this Client in this tax_year."
    error_id: ERR_OPEN_TRADES_FOR_TAX_YEAR
    http_status: 409
    applies_to: "POST /clients/{id}/forms-1099b/{formId}/issue"

  - priority: 22
    category: business_fiscal
    check: "BUY Trade execution requires Account.cash_balance_cents >= round_half_up(requested_shares * execution_price_cents)."
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 422
    applies_to: "POST /accounts/{accountId}/trades/{tradeId}/execute (BUY)"

  - priority: 23
    category: business_constraint
    check: "Optimistic concurrency: if request body provides 'version', it must equal the current row version; mismatched version on PATCH/PUT is rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT and any action endpoint that accepts version"

  - priority: 24
    category: business_constraint
    check: "Pagination: limit in [1, 100], offset >= 0."
    error_id: ERR_PAGINATION_INVALID
    http_status: 422
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "Create a Client (kyc_status=PENDING)."
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, birth_date, time_horizon_years]
    output: Client
    side_effects: []

  - method: GET
    path: "/clients/{clientId}"
    description: "Fetch a Client."
    roles: [ComplianceOfficer, Advisor, TaxAdmin, ClientUser]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/clients/{clientId}"
    description: "Update Client mutable fields (time_horizon_years, full_name); triggers model reassignment if horizon band changes."
    roles: [ComplianceOfficer]
    code: 200
    input: ["full_name?", "time_horizon_years?", "version?"]
    output: Client
    side_effects: ["model_portfolio_assignment runs for affected Accounts if horizon band changes."]

  - method: POST
    path: "/clients/{clientId}/activate"
    description: "Move Client PENDING→ACTIVE."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Client
    side_effects: ["model_portfolio_assignment runs for each Account."]

  - method: POST
    path: "/clients/{clientId}/suspend"
    description: "Move Client ACTIVE→SUSPENDED; cascade freezes accounts and dismisses outstanding opportunities."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Client
    side_effects: ["Account.compliance_status=FROZEN_DOC_REVIEW for all accounts.", "HarvestOpportunity DETECTED→DISMISSED."]

  - method: POST
    path: "/clients/{clientId}/reinstate"
    description: "Move Client SUSPENDED→ACTIVE."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Client
    side_effects: ["Account.compliance_status=ACTIVE for all accounts."]

  # ---- Risk Questionnaire ----
  - method: POST
    path: "/clients/{clientId}/risk-questionnaire"
    description: "Submit a risk questionnaire; computes raw_score and assigned_band; updates Client.risk_band."
    roles: [ComplianceOfficer, ClientUser]
    code: 201
    input: [q1_loss_tolerance, q2_volatility_comfort, q3_growth_vs_stability, q4_liquidity_need, q5_experience, "scoring_method?"]
    output: RiskQuestionnaire
    side_effects: ["Client.risk_band updated to assigned_band."]

  # ---- Model Portfolios ----
  - method: POST
    path: "/model-portfolios"
    description: "Create a ModelPortfolio for a (risk_band, horizon_band) pair."
    roles: [Advisor]
    code: 201
    input: [risk_band, horizon_band, target_allocation, "is_active?"]
    output: ModelPortfolio
    side_effects: []

  - method: GET
    path: "/model-portfolios"
    description: "List model portfolios (paginated)."
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["risk_band?", "horizon_band?", "limit?", "offset?"]
    output: "ModelPortfolio[]"
    side_effects: []

  # ---- Securities ----
  - method: POST
    path: "/securities"
    description: "Register a Security."
    roles: [Advisor]
    code: 201
    input: [ticker, asset_class, substantially_identical_group_id, "is_investable?", last_price_cents]
    output: Security
    side_effects: []

  - method: POST
    path: "/_pricing/set"
    description: "Test-only price update for a Security (advances last_price_cents). Triggers Position market-value recompute."
    roles: [Advisor, system]
    code: 200
    input: [security_id, last_price_cents]
    output: Security
    side_effects: ["Position.market_value_cents recomputed for every Position holding this security."]

  - method: POST
    path: "/correlation-links"
    description: "Add a CorrelationLink between two Securities."
    roles: [Advisor]
    code: 201
    input: [security_a_id, security_b_id, correlation]
    output: CorrelationLink
    side_effects: ["HarvestOpportunity rows in BLOCKED for affected positions may transition back to DETECTED."]

  # ---- Accounts ----
  - method: POST
    path: "/accounts"
    description: "Create an Account for a Client."
    roles: [ComplianceOfficer]
    code: 201
    input: [client_id]
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}"
    description: "Fetch an Account, including current max_drift_pct and balances."
    roles: [ComplianceOfficer, Advisor, ClientUser]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/freeze"
    description: "Set Account.compliance_status=FROZEN_DOC_REVIEW."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/unfreeze"
    description: "Set Account.compliance_status=ACTIVE."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/cash-deposit"
    description: "Operational endpoint to credit cash to Account.cash_balance_cents (e.g., funding)."
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: [amount_cents]
    output: Account
    side_effects: ["recompute_drift runs."]

  # ---- Trades ----
  - method: POST
    path: "/accounts/{accountId}/trades"
    description: "Create a Trade in PENDING (BUY or SELL)."
    roles: [Advisor, ClientUser]
    code: 201
    input: [security_id, side, requested_shares, "cost_basis_method?", "specific_lot_id?"]
    output: Trade
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/trades/{tradeId}/execute"
    description: "Execute a PENDING Trade (PENDING→EXECUTED): snapshot price, consume lots for SELL or open lot for BUY, persist gross_proceeds_cents and realized_gain_loss_cents."
    roles: [Advisor, system]
    code: 200
    input: []
    output: Trade
    side_effects: ["Lot lifecycle transitions for SELL; new Lot for BUY; recompute_drift queued."]

  - method: POST
    path: "/accounts/{accountId}/trades/{tradeId}/settle"
    description: "Settle an EXECUTED Trade (EXECUTED→SETTLED); credits/debits cash; runs wash_sale_basis_adjustment for SELL; runs harvest_opportunity_detection."
    roles: [Advisor, system]
    code: 200
    input: []
    output: Trade
    side_effects: ["Cash balance updated.", "WashSaleEvent (possibly) written.", "Replacement Lot.adjusted_unit_cost_cents boosted.", "harvest_opportunity_detection runs.", "recompute_drift runs."]

  - method: POST
    path: "/accounts/{accountId}/trades/{tradeId}/cancel"
    description: "Cancel a PENDING client-initiated Trade."
    roles: [Advisor, ClientUser]
    code: 200
    input: ["version?"]
    output: Trade
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}/trades"
    description: "List trades for an Account (paginated, filterable by status, side, year)."
    roles: [Advisor, ComplianceOfficer, ClientUser, TaxAdmin]
    code: 200
    input: ["status?", "side?", "year?", "limit?", "offset?"]
    output: "Trade[]"
    side_effects: []

  # ---- Positions / Drift / Opportunities ----
  - method: GET
    path: "/accounts/{accountId}/positions"
    description: "List current Positions for an Account."
    roles: [Advisor, ComplianceOfficer, ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "Position[]"
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/positions/recompute"
    description: "Recompute positions and (optionally) detect harvest opportunities."
    roles: [Advisor, system]
    code: 200
    input: ["intent?"]   # intent in {detect, refresh}, default refresh
    output: "Position[]"
    side_effects: ["harvest_opportunity_detection runs when intent=detect."]

  - method: POST
    path: "/accounts/{accountId}/drift/recompute"
    description: "Recompute Account.max_drift_pct from current holdings."
    roles: [Advisor, system]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{accountId}/harvest-opportunities"
    description: "List harvest opportunities for an Account."
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "HarvestOpportunity[]"
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/harvest-opportunities/{opportunityId}/approve"
    description: "Approve a DETECTED HarvestOpportunity."
    roles: [Advisor]
    code: 200
    input: []
    output: HarvestOpportunity
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/harvest-opportunities/{opportunityId}/dismiss"
    description: "Dismiss a DETECTED HarvestOpportunity."
    roles: [Advisor]
    code: 200
    input: []
    output: HarvestOpportunity
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/harvest-opportunities/{opportunityId}/execute"
    description: "Execute an APPROVED HarvestOpportunity: emits the SELL of held + BUY of replacement_security_id."
    roles: [Advisor]
    code: 200
    input: []
    output: HarvestOpportunity
    side_effects: ["Account.investment_status→HARVESTING.", "Two PENDING Trades emitted (SELL held + BUY replacement)."]

  # ---- Rebalance ----
  - method: POST
    path: "/accounts/{accountId}/rebalance/start"
    description: "Start a quarterly rebalance for the Account (one per quarter_key)."
    roles: [Advisor]
    code: 201
    input: [quarter_key, "force?"]
    output: RebalanceRun
    side_effects: ["RebalanceRun SCHEDULED→IN_PROGRESS.", "Child PENDING Trades emitted.", "Account.investment_status=REBALANCING."]

  - method: GET
    path: "/accounts/{accountId}/rebalance-runs"
    description: "List rebalance runs for an Account."
    roles: [Advisor, ComplianceOfficer]
    code: 200
    input: ["status?", "year?", "limit?", "offset?"]
    output: "RebalanceRun[]"
    side_effects: []

  # ---- Dividends ----
  - method: POST
    path: "/accounts/{accountId}/dividends"
    description: "Record a DividendEvent (test-driven receipt) and emit the reinvest BUY Trade in PENDING."
    roles: [Advisor, system]
    code: 201
    input: [security_id, amount_cents]
    output: DividendEvent
    side_effects: ["Account.cash_balance_cents += amount_cents.", "BUY Trade emitted in PENDING (reinvest_trade_id back-linked)."]

  # ---- 1099-B ----
  - method: POST
    path: "/clients/{clientId}/forms-1099b"
    description: "Create a DRAFT Form1099B for a tax year (unique per client+year)."
    roles: [TaxAdmin]
    code: 201
    input: [tax_year]
    output: Form1099B
    side_effects: ["form_1099b_assembly runs to populate aggregates."]

  - method: GET
    path: "/clients/{clientId}/forms-1099b/{formId}"
    description: "Fetch a Form1099B; if DRAFT, re-runs assembly to refresh aggregates."
    roles: [TaxAdmin, ClientUser]
    code: 200
    input: []
    output: Form1099B
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/forms-1099b/{formId}/issue"
    description: "Issue (DRAFT→ISSUED) — pins aggregates."
    roles: [TaxAdmin]
    code: 200
    input: []
    output: Form1099B
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/forms-1099b/{formId}/void"
    description: "Void a Form1099B (DRAFT or recently-ISSUED)."
    roles: [TaxAdmin]
    code: 200
    input: []
    output: Form1099B
    side_effects: []

  # ---- Test-driving operational endpoints (mandated by §1.5 design principles) ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server clock (test-only). Required to reach wash-sale window boundaries, quarter rollovers, and Form1099B 30-day void window."
    roles: [system]
    code: 200
    input: ["to_iso?"]
    output: "object"
    side_effects: ["Recomputes Client.age."]

  - method: POST
    path: "/_quarterly/run"
    description: "System endpoint — for every Account with max_drift_pct >= DRIFT_TRIGGER_PCT and no existing RebalanceRun in current quarter, create and run a RebalanceRun."
    roles: [system]
    code: 200
    input: []
    output: "RebalanceRun[]"
    side_effects: ["See RebalanceRun state machine."]

  - method: POST
    path: "/_settle/run"
    description: "System endpoint — settle every EXECUTED Trade in batch (used by tests to drive cascades)."
    roles: [system]
    code: 200
    input: []
    output: "Trade[]"
    side_effects: ["See Trade EXECUTED→SETTLED transition."]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."

  - id: ERR_AUTH_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this operation per §1.7."

  - id: ERR_AUTH_IDENTITY_UNKNOWN
    http: 403
    condition: "Entity-backed role's X-User-ID does not resolve to an existing backing entity."

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path parameter id does not match any row of that resource type."

  - id: ERR_FK_NOT_FOUND
    http: 422
    condition: "Body foreign key references a non-existent row."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation not legal in target resource's current state (per §1.2)."

  - id: ERR_INVALID_TRADE_STATE
    http: 409
    condition: "Trade cannot be cancelled because it is not PENDING or because it belongs to a rebalance run."

  - id: ERR_ACCOUNT_FROZEN
    http: 409
    condition: "Account.compliance_status == FROZEN_DOC_REVIEW for a mutating request."

  - id: ERR_WASH_SALE_VIOLATION
    http: 422
    condition: "Pre-flight check on BUY: a SELL of a substantially-identical security settled within the last 30 calendar days on the same account would create a wash sale and policy is BLOCK."

  - id: ERR_SECURITY_NOT_INVESTABLE
    http: 422
    condition: "Target Security has is_investable=false (BUY rejected; harvest replacement cannot be selected)."

  - id: ERR_INSUFFICIENT_LOT_SHARES
    http: 422
    condition: "SPECIFIC_LOT SELL: named Lot does not have enough shares_remaining (also covers concurrent decrement)."

  - id: ERR_INSUFFICIENT_POSITION_SHARES
    http: 422
    condition: "FIFO SELL: total OPEN/PARTIALLY_CLOSED shares on Position less than requested_shares."

  - id: ERR_REBALANCE_ALREADY_IN_PROGRESS
    http: 409
    condition: "A RebalanceRun for (account_id, quarter_key) already exists with non-FAILED status, or one is IN_PROGRESS."

  - id: ERR_DRIFT_BELOW_THRESHOLD
    http: 422
    condition: "Account.max_drift_pct < 5.00 and rebalance start did not pass force=true."

  - id: ERR_HARVEST_THRESHOLD_NOT_MET
    http: 422
    condition: "Position's unrealized loss does not satisfy unrealized_loss_cents <= -MIN_HARVEST_THRESHOLD_CENTS."

  - id: ERR_ALLOCATION_INVALID
    http: 422
    condition: "ModelPortfolio.target_allocation has a value outside [0,1] or its values do not sum to exactly 1.000."

  - id: ERR_CORRELATION_INVALID
    http: 422
    condition: "CorrelationLink correlation outside [-1.0, 1.0] or security_a_id == security_b_id."

  - id: ERR_QUESTIONNAIRE_OUT_OF_RANGE
    http: 422
    condition: "RiskQuestionnaire q1..q5 outside [1,5]."

  - id: ERR_TIME_HORIZON_OUT_OF_RANGE
    http: 422
    condition: "Client.time_horizon_years outside [1,40]."

  - id: ERR_FORM_ALREADY_EXISTS
    http: 409
    condition: "A Form1099B already exists for (client_id, tax_year)."

  - id: ERR_OPEN_TRADES_FOR_TAX_YEAR
    http: 409
    condition: "Cannot issue Form1099B while one or more SELL Trades for the Client in the tax year remain non-terminal."

  - id: ERR_INSUFFICIENT_CASH
    http: 422
    condition: "BUY execute: Account.cash_balance_cents < required cash for the trade."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Submitted version != current row version."

  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit outside [1,100] or offset < 0."

  - id: ERR_CLIENT_NOT_ACCEPTING_INPUT
    http: 409
    condition: "Client.kyc_status == SUSPENDED at the moment a child mutation is attempted (e.g., questionnaire submission)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClientUser
    description: "An end client acting on their own behalf. May submit questionnaires, view their own Accounts/Trades/Forms, and cancel their own PENDING trades."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /clients/{clientId}/risk-questionnaire (only when clientId == X-User-ID)."
      - "GET /clients/{clientId}"
      - "GET /accounts/{accountId}, GET /accounts/{accountId}/positions, /trades, /harvest-opportunities (only for accounts whose client_id == X-User-ID)."
      - "POST /accounts/{accountId}/trades (BUY/SELL — but client-initiated, not rebalance/harvest)."
      - "POST /accounts/{accountId}/trades/{tradeId}/cancel (own pending trades only)."
      - "GET /clients/{clientId}/forms-1099b/{formId}."

  - name: Advisor
    description: "A licensed advisor acting on assigned client accounts. Operates rebalances, harvest opportunities, and most operational endpoints."
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "POST /accounts/{accountId}/harvest-opportunities/{id}/approve"
      - "POST /accounts/{accountId}/harvest-opportunities/{id}/dismiss"
      - "POST /accounts/{accountId}/harvest-opportunities/{id}/execute"
      - "POST /accounts/{accountId}/rebalance/start"
      - "POST /model-portfolios"
      - "POST /securities, POST /correlation-links, POST /_pricing/set"
    shared_operations:
      - "POST /accounts/{accountId}/trades (also ClientUser)."
      - "POST /accounts/{accountId}/trades/{tradeId}/execute (also system on rebalance)."
      - "POST /accounts/{accountId}/trades/{tradeId}/settle (also system)."
      - "POST /accounts/{accountId}/trades/{tradeId}/cancel (also ClientUser for own trades)."
      - "POST /accounts/{accountId}/cash-deposit"
      - "POST /accounts/{accountId}/positions/recompute, /drift/recompute"
      - "GET endpoints under /accounts and /clients (assigned only)."
      - "POST /accounts/{accountId}/dividends (also system)."

  - name: ComplianceOfficer
    description: "Operational role for KYC, suspensions, and freezes. Not tied to a persisted entity (opaque)."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{clientId}/activate, /suspend, /reinstate"
      - "PATCH /clients/{clientId}"
      - "POST /accounts (create)"
      - "POST /accounts/{accountId}/freeze, /unfreeze"
    shared_operations:
      - "GET /clients, /accounts, /trades, /model-portfolios, /harvest-opportunities, /rebalance-runs."

  - name: TaxAdmin
    description: "Operational role for 1099-B preparation and issuance."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{clientId}/forms-1099b"
      - "POST /clients/{clientId}/forms-1099b/{formId}/issue"
      - "POST /clients/{clientId}/forms-1099b/{formId}/void"
    shared_operations:
      - "GET /clients/{clientId}/forms-1099b/{formId}"
      - "GET /accounts/{accountId}/trades (read-only)."

  - name: system
    description: "Automated runners: clock advance, quarterly batch, settlement sweep. Used only by test-driving endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_quarterly/run"
      - "POST /_settle/run"
    shared_operations:
      - "POST /accounts/{accountId}/trades/{tradeId}/execute (rebalance children)."
      - "POST /accounts/{accountId}/trades/{tradeId}/settle (sweep)."
      - "POST /accounts/{accountId}/dividends (system-recorded)."
      - "POST /accounts/{accountId}/positions/recompute, /drift/recompute."
