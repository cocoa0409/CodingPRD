            - "second and third calls: HTTP 201 each — the same nested create is accepted from RangeSpecialist and from AuthorizedOfficer, and each record carries planned_aums 30.00 (30 head x CATTLE 1.0 x 30 days / 30)"
            - "fourth call: HTTP 200 with aoi_status \"ISSUED\"; the rotation requirement of 2 distinct pastures is met, and the PRELIMINARY_USE bill totals 10320 cents (60 x 172, admin fee 0 because 10320 < 50000) with due_date 2026-08-31"
            - "fifth and sixth calls: HTTP 200 each — report-actual-use is accepted from Permittee ${c_m53_id} on its own record and from RangeSpecialist u_spec_1 on the other, each stamping actual_aums 30.00 and record_status \"ACTUAL_REPORTED\""
            - "seventh call: HTTP 200 with aoi_status \"BILLED\" and actual_aums_total 60.00; the unpaid PRELIMINARY_USE bill is VOIDED and a FINAL_USE bill of 10320 cents is issued carrying superseded_bill_id equal to the voided bill's id"
            - "eighth call: exactly one ISSUED bill exists, so total_count == 1 and ${c_b12_id} is the FINAL_USE bill with total_amount_cents 10320"
            - "ninth call: HTTP 201 with amount_paid_cents 5320 and bill_status still \"ISSUED\" (paid by the Permittee)"
            - "tenth call: HTTP 201 with amount_paid_cents 10320 and bill_status \"PAID\" (paid by the AuthorizedOfficer) — the shared payment endpoint accepted both hands against the same bill"
            - "eleventh call: HTTP 200 with total_count 1 — the AppealsAdjudicator holds the shared GET even though it holds no write in this workflow"
            - "control: POST /pasture-use-records/${c_ur20_id}/report-actual-use as AuthorizedOfficer u_officer_1 returns 403 ERR_UNAUTHORIZED — this endpoint is shared with Permittee and RangeSpecialist ONLY, so \"shared\" never means \"open to all\""

      - name: corner_absent_blank_and_unknown_identity_all_refused
        claim_type: unknown_identity
        grounds:
          - validations.priority_3
          - errors.ERR_UNAUTHORIZED
          - rbac.Permittee.identity
        distinguishing_aspect: "Three different malformed identities collapse to the same 403 ERR_UNAUTHORIZED: an absent X-User-ID header, a header present but empty (the empty string \"\", NOT a space or any other whitespace), and a syntactically fine but unregistered id. For the entity_backed Permittee role a fourth case joins them — an id that is not the id of any Permittee row — because that role's identity is defined as the id of a persisted Permittee. Reads fail the same way as writes."
        test_recipe:
          setup:
            - "One permittee ${c_m54_id} exists so that the final control has a legitimate identity to contrast against"
            - "FIXTURE NOTE: the blank-identity calls send X-User-ID with the exact empty string \"\" — never a space, a tab or any other whitespace, which some HTTP clients silently reject as an invalid header value"
          setup_api_calls:
            - call: "POST /permittees"
              payload: { name: "Identity Control Ranch", contact_email: "identity@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m54_id: "$.data.id" }
          trigger:
            - call: "POST /allotments"
              payload: { name: "Headerless Allotment", admin_unit_code: "NV-174", acres: 2000, total_permitted_aums: 80, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: null
            - call: "POST /allotments"
              payload: { name: "Blank Identity Allotment", admin_unit_code: "NV-174", acres: 2000, total_permitted_aums: 80, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: ""
            - call: "POST /allotments"
              payload: { name: "Ghost Identity Allotment", admin_unit_code: "NV-174", acres: 2000, total_permitted_aums: 80, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_ghost_1"
            - call: "GET /allotments"
              payload: {}
              as: RangeSpecialist
              as_user_id: ""
            - call: "GET /grazing-bills"
              payload: { permittee_id: "${c_m54_id}" }
              as: Permittee
              as_user_id: "00000000-0000-4000-8000-000000000099"
            - call: "POST /allotments"
              payload: { name: "Identity Control Allotment", admin_unit_code: "NV-174", acres: 2000, total_permitted_aums: 80, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a67_id: "$.data.id" }
          assert:
            - "first call: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" (X-User-ID header absent)"
            - "second call: HTTP 403 ERR_UNAUTHORIZED (X-User-ID present but the empty string)"
            - "third call: HTTP 403 ERR_UNAUTHORIZED (X-User-ID is not a registered actor)"
            - "fourth call: HTTP 403 ERR_UNAUTHORIZED — a read is gated identically to a write"
            - "fifth call: HTTP 403 ERR_UNAUTHORIZED, and specifically NOT HTTP 200 with an empty list: the Permittee role is entity_backed, so an X-User-ID that matches no Permittee row is an unknown actor rather than a permittee who happens to own nothing"
            - "sixth call: HTTP 201 with data.id == ${c_a67_id} — the identical body succeeds once a registered officer sends it"
            - "GET /allotments?admin_unit_code=NV-174 as u_officer_1 returns total_count 1, so exactly one of the six calls created a row"

      - name: corner_segregation_of_duties_rejects_by_person_not_by_role
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_4
          - validations.priority_3
          - validations.priority_8
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_DECISION_STATE_INVALID
          - entities.RangelandHealthAssessment.author_user_id
          - entities.PermitDecision.authoring_officer_id
        distinguishing_aspect: "role_model is segregation_of_duties and priority 4 compares X-User-ID ONLY: the acting role comes from X-User-Role, so one person may legitimately hold two roles, and the check must catch that person reviewing the assessment it authored or signing the decision it wrote. Two orderings make this falsifiable. The author presenting under the WRONG role fails earlier, at priority 3, with ERR_UNAUTHORIZED — so an implementation that returns ERR_SEGREGATION_OF_DUTIES there is wrong. And the author presenting under the RIGHT role fails at priority 4 even while the document is still DRAFT — so an implementation that checks the state machine first returns ERR_DECISION_STATE_INVALID and is also wrong, as the very same call from a different person proves by returning exactly that 409."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "Allotment ${c_a68_id}; assessment ${c_as11_id} authored by u_spec_1 and submitted, so assessment_status is FIELD_REVIEW and author_user_id is \"u_spec_1\""
            - "IDENTITY NOTE: u_spec_1 wears the AuthorizedOfficer hat in the first trigger call and u_officer_2 wears the RangeSpecialist hat when authoring the decision; both are legitimate role headers for those ids under §1.4 priority 4"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "One Hand Allotment", admin_unit_code: "NV-175", acres: 6000, total_permitted_aums: 400, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a68_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${c_a68_id}", assessment_year: 2026, monitoring_method: "INDICATOR_ASSESSMENT", upland_score: 80, riparian_score: 80, water_quality_score: 80, standards_not_met: [], causal_factor_is_livestock: false }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_as11_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments/${c_as11_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
          trigger:
            - call: "POST /rangeland-health-assessments/${c_as11_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "The author concurs with its own field work." }
              as: AuthorizedOfficer
              as_user_id: "u_spec_1"
            - call: "POST /rangeland-health-assessments/${c_as11_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "The author concurs under its own role header." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /rangeland-health-assessments/${c_as11_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "Independent review confirms the indicator scores." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /allotments/${c_a68_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a68_ver: "$.data.version" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "ISSUANCE", allotment_id: "${c_a68_id}", expected_allotment_version: "${c_a68_ver}", nepa_level: "EA", rationale: "Authored by the officer who will not be allowed to sign it." }
              as: RangeSpecialist
              as_user_id: "u_officer_2"
              captures: { c_d7_id: "$.data.id" }
            - call: "POST /permit-decisions/${c_d7_id}/finalize"
              payload: { rationale: "The author attempts to sign while the document is still DRAFT." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_2"
            - call: "POST /permit-decisions/${c_d7_id}/finalize"
              payload: { rationale: "An independent officer attempts to sign while the document is still DRAFT." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /permit-decisions/${c_d7_id}/complete-environmental-review"
              payload: { nepa_findings_summary: "The environmental assessment finds no significant impact." }
              as: RangeSpecialist
              as_user_id: "u_officer_2"
            - call: "POST /permit-decisions/${c_d7_id}/finalize"
              payload: { rationale: "The author attempts to sign the proposed decision." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_2"
            - call: "POST /permit-decisions/${c_d7_id}/finalize"
              payload: { rationale: "The independent deciding officer signs the proposed decision." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "first call: HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" — u_spec_1 is author_user_id, and the AuthorizedOfficer role header gets it past priority 3 only to fail at priority 4"
            - "second call: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" — the same person under the RangeSpecialist header fails the earlier role gate, so the error CHANGES with the header even though the person does not"
            - "after those two refusals GET /rangeland-health-assessments/${c_as11_id} still reads assessment_status \"FIELD_REVIEW\", remand_count 0, composite_score null and determination null — a refused review scores nothing"
            - "third call: HTTP 200 with assessment_status \"FINALIZED\", composite_score \"80.00\" (0.4x80 + 0.35x80 + 0.25x80), determination \"MEETING\" and recommended_reduction_pct \"0.0000\"; Allotment.${c_a68_id}.health_determination becomes \"MEETING\" and its version is bumped by the CONCUR cascade"
            - "fifth call: HTTP 201 with authoring_officer_id \"u_officer_2\" and decision_status \"DRAFT\" — the ISSUANCE document is authored by a person who normally wears the officer hat, which is what makes the next two calls comparable"
            - "sixth call: HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" — priority 4 outranks the priority-8 state check and the priority-11 environmental-review check, so the author is turned away before the DRAFT state is even considered"
            - "seventh call: HTTP 409 with data.error_id == \"ERR_DECISION_STATE_INVALID\" — the identical call from an independent officer reaches priority 8, proving the sixth call's 403 came from the person and not from the state"
            - "eighth call: HTTP 200 with decision_status \"PROPOSED\" and nepa_status \"COMPLETE\""
            - "ninth call: HTTP 403 ERR_SEGREGATION_OF_DUTIES — now that every other precondition holds, the author is still refused"
            - "tenth call: HTTP 200 with decision_status \"FINAL\", deciding_officer_id \"u_officer_1\" and authoring_officer_id still \"u_officer_2\" — the two hands are recorded separately"

      - name: corner_adjudicator_may_not_decide_a_decision_it_signed
        claim_type: segregation_of_duties
        excluded_because:
          difficulty_instance: decision_effectiveness_gated_by_appeal_stay
          rationale: "That §1.8 instance already covers the third limb of §1.4 priority 4 — POST /appeal-cases/{appealId}/decide refused to the appealed decision's own deciding officer. Its controls docket ${ap15_id} and decide it AFFIRM as the independent u_judge_1 (yielding decision_status EFFECTIVE and the 0.2000 stocking cascade), and then re-attempt the same decide call with the deciding officer's own X-User-ID u_officer_1 presented under the AppealsAdjudicator role header, which returns 403 ERR_SEGREGATION_OF_DUTIES while the same id under the AuthorizedOfficer header returns 403 ERR_UNAUTHORIZED at priority 3. Duplicating that here would add no distinguishing signal beyond corner_segregation_of_duties_rejects_by_person_not_by_role, which covers the review and finalize limbs."

  # ---------------------------------------------------------------------------
  # §1.9 cross_cutting_complexity_layers — the four layers declared in
  # complexity_profile.complexity_layers: optimistic_concurrency (OCC on
  # Allotment.version, §1.2.1), cascading_side_effects, dual_variant_calculation
  # and rate_threshold_triggers. §1.8 already probes three of them in depth, so
  # the recipes here cover the OCC layer end-to-end plus the one multi-hop
  # cascade §1.8 does not reach (CANCELLATION), and the rest are stubs.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_stale_allotment_version_refused_then_correct_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.decision-create-stale-allotment
          - endpoints.POST /permit-decisions
          - validations.priority_7
          - errors.ERR_STALE_ALLOTMENT_VERSION
          - state_machines.PermitDecision.DRAFT_to_VACATED
        distinguishing_aspect: "POST /permit-decisions is the only write in the API that carries an OCC token, and the comparison is EQUALITY against the live Allotment.version — not \"at least\", so a token from before the last bump AND a token ahead of the server are both refused with 412 ERR_STALE_ALLOTMENT_VERSION. The refusal is inert: it creates no decision, vacates no predecessor and does not itself bump the version, which is why the third create succeeds with a token that is exactly one greater than the first. The successful second create then supersedes the first decision of the same decision_type, taking it DRAFT -> VACATED without any capacity cascade."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "One allotment ${c_a70_id}; its version is read once and that single observation is deliberately reused after it has gone stale"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Version Probe Allotment", admin_unit_code: "NV-177", acres: 9500, total_permitted_aums: 800, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a70_id: "$.data.id" }
            - call: "GET /allotments/${c_a70_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a70_ver0: "$.data.version" }
          trigger:
            - call: "POST /permit-decisions"
              payload: { decision_type: "ISSUANCE", allotment_id: "${c_a70_id}", expected_allotment_version: "${c_a70_ver0}", nepa_level: "CX", rationale: "First issuance document authored against the freshly observed allotment." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_d9_id: "$.data.id" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "ISSUANCE", allotment_id: "${c_a70_id}", expected_allotment_version: "${c_a70_ver0}", nepa_level: "CX", rationale: "Second document authored from the same, now stale, observation." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a70_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a70_ver1: "$.data.version" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "ISSUANCE", allotment_id: "${c_a70_id}", expected_allotment_version: "${c_a70_ver1} + 3", nepa_level: "CX", rationale: "Document authored with a version ahead of the server's." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /permit-decisions"
              payload: { decision_type: "ISSUANCE", allotment_id: "${c_a70_id}", expected_allotment_version: "${c_a70_ver1}", nepa_level: "CX", rationale: "Second document authored after re-reading the allotment." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_d10_id: "$.data.id" }
            - call: "GET /allotments/${c_a70_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a70_ver2: "$.data.version" }
          assert:
            - "first call: HTTP 201 with data.id == ${c_d9_id} and decision_status \"DRAFT\""
            - "second call: HTTP 412 with data.error_id == \"ERR_STALE_ALLOTMENT_VERSION\" — the first create already bumped the version, so the reused token is stale"
            - "third call: ${c_a70_ver1} == ${c_a70_ver0} + 1 — exactly one bump, from the one successful create"
            - "fourth call: HTTP 412 ERR_STALE_ALLOTMENT_VERSION — a token AHEAD of the server is refused too, proving the comparison is equality and not a >= test"
            - "fifth call: HTTP 201 with data.id == ${c_d10_id} and decision_status \"DRAFT\""
            - "sixth call: ${c_a70_ver2} == ${c_a70_ver0} + 2 — the two 412s contributed no bump of their own"
            - "GET /permit-decisions?allotment_id=${c_a70_id} returns total_count 2: the two refusals created nothing"
            - "GET /permit-decisions/${c_d9_id} returns decision_status \"VACATED\" — the successful second create superseded the first document of the same decision_type"
            - "PermitDecision.${c_d9_id}.pre_decision_adjustment_pct is null and Allotment.${c_a70_id}.stocking_adjustment_pct is \"0.0000\": supersession of a DRAFT runs no capacity cascade"

      - name: corner_every_allotment_write_path_bumps_the_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.decision-create-stale-allotment
          - endpoints.POST /annual-operating-instructions/{aoiId}/issue
          - endpoints.POST /rangeland-health-assessments/{assessmentId}/review
          - endpoints.POST /closure-orders
          - endpoints.POST /closure-orders/{closureOrderId}/lift
          - endpoints.POST /permit-decisions/{decisionId}/make-effective
          - errors.ERR_STALE_ALLOTMENT_VERSION
        distinguishing_aspect: "Six different endpoints bump Allotment.version, and only one of them takes an OCC token — so the token a client holds can be invalidated by writes it never made and cannot see coming: an AOI issue by another specialist, a health determination concurred by an officer, a closure order opened, that closure lifted, another decision authored, or a decision made effective. Each bump is exactly +1, they accumulate, and a token captured before the sequence is refused at the end even though the allotment's identity never changed."
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default"
            - "Allotment ${c_a71_id} (1000 permitted AUMs, rotation requirement 1) with one 1000-AUM pasture"
            - "Permittee ${c_m56_id} with a 500-AUM LAND base property and an ISSUED 200-AUM permit ${c_g42_id}"
            - "A DRAFT 2026 AOI ${c_aoi38_id} for 100 AUMs carrying one 100-AUM use record, and a submitted assessment ${c_as12_id} in FIELD_REVIEW"
            - "${c_a71_ver0} is captured LAST in setup, so it is the client's fresh observation immediately before the trigger sequence starts"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Bump Ladder Allotment", admin_unit_code: "NV-178", acres: 14000, total_permitted_aums: 1000, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_a71_id: "$.data.id" }
            - call: "POST /allotments/${c_a71_id}/pastures"
              payload: { name: "Bump Ladder Main", pasture_aum_capacity: 1000, sequence_order: 1 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_p36_id: "$.data.id" }
            - call: "POST /permittees"
              payload: { name: "Bump Ladder Cattle", contact_email: "bumpladder@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_m56_id: "$.data.id" }
            - call: "POST /permittees/${c_m56_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T21N R47E Sec 04 NE", carrying_capacity_aums: 500, controlled_since_date: "2009-05-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp47_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${c_a71_id}", permittee_id: "${c_m56_id}", base_property_id: "${c_bp47_id}", requested_aums: 200, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_g42_id: "$.data.id" }
            - call: "POST /grazing-permits/${c_g42_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${c_g42_id}", grazing_year: 2026, authorized_aums: 100, season_start_date: "2026-05-01", season_end_date: "2026-09-30" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_aoi38_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${c_aoi38_id}/use-records"
              payload: { pasture_id: "${c_p36_id}", planned_entry_date: "2026-06-01", planned_exit_date: "2026-07-01", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_ur23_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments"
              payload: { allotment_id: "${c_a71_id}", assessment_year: 2026, monitoring_method: "INDICATOR_ASSESSMENT", upland_score: 80, riparian_score: 80, water_quality_score: 80, standards_not_met: [], causal_factor_is_livestock: false }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_as12_id: "$.data.id" }
            - call: "POST /rangeland-health-assessments/${c_as12_id}/submit"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a71_id}"
              payload: {}
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { c_a71_ver0: "$.data.version" }
          trigger:
            - call: "POST /annual-operating-instructions/${c_aoi38_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /rangeland-health-assessments/${c_as12_id}/review"
              payload: { review_outcome: "CONCUR", review_notes: "Indicator scores support a meeting determination." }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /closure-orders"
              payload: { allotment_id: "${c_a71_id}", order_type: "DROUGHT_REDUCTION", effective_start_date: "2026-08-10", effective_end_date: "2026-09-10", justification: "Persistent drought requires a temporary thirty percent reduction.", reduction_pct: 0.30 }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_co6_id: "$.data.id" }
            - call: "POST /permit-decisions"
              payload: { decision_type: "ISSUANCE", allotment_id: "${c_a71_id}", expected_allotment_version: "${c_a71_ver0}", nepa_level: "CX", rationale: "Authored from a token captured before the three intervening writes." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "GET /allotments/${c_a71_id}"
              payload: {}
