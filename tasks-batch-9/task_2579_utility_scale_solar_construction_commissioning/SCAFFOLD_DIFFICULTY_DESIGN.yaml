  - rule_id: non_linear_state_machine
    instances:
      - name: block_parallel_dimensions_move_independently_through_rework
        grounds:
          - state_machines.Block
          - entities.Block.fields.mechanical_status
          - entities.Block.fields.electrical_status
          - entities.Block.fields.mc_ready
          - calculations.string_test_disposition
          - calculations.block_and_project_readiness_rollup
        distinguishing_aspect: |
          Non-linearity is a PARALLEL two-dimension machine: the block holds
          mechanical_status == MECH_COMPLETE unchanged while electrical_status
          walks TESTED -> REWORK -> TESTED, so the combined mc_ready flag flips
          false and then true again without any mechanical transition firing.
