# =============================================================================
# task_0707_virtual_assistant_staffing — SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# Test Targeting Index — depth probe. 9 Difficulty Rules × 2 instances = 18.
# Every grounds: ref resolves into SCAFFOLD.yaml §1.1–§1.7. Single source of
# truth is SCAFFOLD.yaml; deleting this file leaves declared behavior identical.
# Clock startup default = 2026-03-01T00:00:00Z (per §1.5 _clock endpoint).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- 1.A invoice_total PROVISIONAL vs FINAL on the Invoice/Cycle domain
      - name: invoice_provisional_counts_logged_final_excludes_logged
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.variant
          - entities.Invoice.fields.total_cents
          - entities.TimeEntry.fields.status
          - state_machines.TimeEntry.LOGGED_to_APPROVED
        distinguishing_aspect: |
          On the Invoice/RetainerCycle billing domain, PROVISIONAL bills LOGGED+APPROVED
          billable_hours while FINAL bills only APPROVED; with one LOGGED 2h entry present
          alongside one APPROVED 4h entry, PROVISIONAL total_cents (30000) strictly exceeds
          FINAL total_cents (20000) for identical underlying data.
        test_recipe:
          setup:
            - "SkillTag BOOKKEEPING (non-specialized); SlaPolicy STANDARD (response 60m, resolution 24h, penalty 0)."
            - "VA fully covers BOOKKEEPING. Client scoped: monthly_retainer_hours=8, base_rate_cents=5000, overage_rate_cents=8000, rollover_cap_hours=0."
            - "Engagement ACTIVE -> cycle #1 OPEN (granted 8h). One task ASSIGNED+IN_PROGRESS."
            - "One TimeEntry raw_minutes=240 APPROVED (billable 4.0h); one TimeEntry raw_minutes=120 still LOGGED (billable 2.0h)."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "BOOKKEEPING", name: "Bookkeeping", is_specialized: false }
              as: StaffingManager
              captures: { skill_bk: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va One", email: "va1@x.com", skill_tag_ids: ["${skill_bk}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va1: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill_bk}"], monthly_retainer_hours: 8, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va1}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "T1", priority: "STANDARD", required_skill_tag_id: "${skill_bk}", estimated_hours: 4 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
            - call: "POST /va-staffing/tasks/${task}/start"
              payload: {}
              as: VA
              as_user_id: "${va1}"
            - call: "POST /va-staffing/time-entries"
              payload: { task_id: "${task}", raw_minutes: 240, note: "approved-work" }
              as: VA
              as_user_id: "${va1}"
              captures: { te_appr: $.data.id }
            - call: "POST /va-staffing/time-entries/${te_appr}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/time-entries"
              payload: { task_id: "${task}", raw_minutes: 120, note: "logged-work" }
              as: VA
              as_user_id: "${va1}"
              captures: { te_logged: $.data.id }
            - call: "GET /va-staffing/cycles?client_id=${cli}&status=OPEN"
              payload: {}
              as: StaffingManager
              captures: { cyc: $.data.0.id }
          trigger:
            - call: "POST /va-staffing/invoices"
              payload: { client_id: "${cli}", cycle_id: "${cyc}", variant: "PROVISIONAL" }
              as: StaffingManager
              captures: { inv_prov: $.data.id }
          assert:
            - "Invoice.${inv_prov}.variant == PROVISIONAL"
            - "Invoice.${inv_prov}.total_cents == 30000"
            - "Invoice.${inv_prov}.base_charge_cents == 30000"
            - "Invoice.${inv_prov}.overage_charge_cents == 0"

      # --- 1.B rollover_carry CAP_BINDING vs CAP_SLACK on the RetainerCycle domain
      - name: rollover_carry_cap_binding_forfeits_surplus
        grounds:
          - calculations.rollover_carry
          - entities.RetainerCycle.fields.rolled_in_hours
          - entities.RetainerCycle.fields.granted_hours
          - state_machines.RetainerCycle.OPEN_to_CLOSED
          - entities.Client.fields.rollover_cap_hours
        distinguishing_aspect: |
          On the RetainerCycle hour-bank domain (a different entity from invoice_total),
          rollover_carry diverges: with unused=8h and rollover_cap_hours=5, CAP_BINDING
          carries exactly 5.0h into the successor cycle (surplus 3h forfeited), whereas the
          CAP_SLACK variant (unused<=cap) would carry the entire remainder unchanged.
        test_recipe:
          setup:
            - "Client scoped monthly_retainer_hours=10, base_rate_cents=5000, overage_rate_cents=8000, rollover_cap_hours=5."
            - "Cycle #1 OPEN (granted 10h). One task with one APPROVED TimeEntry raw_minutes=120 -> billable 2.0h consumed."
            - "unused = 10 - 2 = 8h > cap 5 -> CAP_BINDING."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "CRM_ADMIN", name: "CRM Admin", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Two", email: "va2@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Beta", contact_email: "beta@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 5 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "T1", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 2 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
            - call: "POST /va-staffing/tasks/${task}/start"
              payload: {}
              as: VA
              as_user_id: "${va}"
            - call: "POST /va-staffing/time-entries"
              payload: { task_id: "${task}", raw_minutes: 120 }
              as: VA
              as_user_id: "${va}"
              captures: { te: $.data.id }
            - call: "POST /va-staffing/time-entries/${te}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "GET /va-staffing/cycles?client_id=${cli}&status=OPEN"
              payload: {}
              as: StaffingManager
              captures: { cyc1: $.data.0.id, cyc1_ver: $.data.0.version }
          trigger:
            - call: "POST /va-staffing/cycles/${cyc1}/close"
              payload: { expected_cycle_version: "${cyc1_ver}" }
              as: StaffingManager
            - call: "GET /va-staffing/cycles?client_id=${cli}&status=OPEN"
              payload: {}
              as: StaffingManager
              captures: { cyc2: $.data.0.id }
          assert:
            - "RetainerCycle.${cyc2}.sequence_no == 2"
            - "RetainerCycle.${cyc2}.granted_hours == 10"
            - "RetainerCycle.${cyc2}.rolled_in_hours == 5"
            - "RetainerCycle.${cyc1}.status == CLOSED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- 2.A mode (b): round-per-tier-BEFORE-summing pinned order on invoice_total
      - name: invoice_round_per_tier_then_sum_pinned_order
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.base_charge_cents
          - entities.Invoice.fields.overage_charge_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: invoice_total pins round_half_up PER TIER (within-bank
          and overage priced and rounded separately) BEFORE summing; with billed=12h, bank=10h,
          base_rate=5000, overage_rate=8000 the result is base 50000 + overage 16000 = 66000,
          fixed by the round-per-tier-then-sum order the formula declares.
        test_recipe:
          setup:
            - "Client scoped monthly_retainer_hours=10, base_rate_cents=5000, overage_rate_cents=8000."
            - "Two APPROVED entries of 6.0h each (raw 360 min) -> billed 12.0h, overage 2.0h."
            - "Cycle CLOSED so a FINAL invoice can be issued."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "DATA_ENTRY", name: "Data Entry", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Three", email: "va3@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Gamma", contact_email: "gamma@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "T1", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 6 }
              as: Client
              as_user_id: "${cli}"
              captures: { t1: $.data.id }
            - call: "POST /va-staffing/tasks/${t1}/assign"
              payload: {}
              as: StaffingManager
            - call: "POST /va-staffing/tasks/${t1}/start"
              payload: {}
              as: VA
              as_user_id: "${va}"
            - call: "POST /va-staffing/time-entries"
              payload: { task_id: "${t1}", raw_minutes: 360 }
              as: VA
              as_user_id: "${va}"
              captures: { te1: $.data.id }
            - call: "POST /va-staffing/time-entries/${te1}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/time-entries"
              payload: { task_id: "${t1}", raw_minutes: 360 }
              as: VA
              as_user_id: "${va}"
              captures: { te2: $.data.id }
            - call: "POST /va-staffing/time-entries/${te2}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "GET /va-staffing/cycles?client_id=${cli}&status=OPEN"
              payload: {}
              as: StaffingManager
              captures: { cyc: $.data.0.id, cyc_ver: $.data.0.version }
            - call: "POST /va-staffing/cycles/${cyc}/close"
              payload: { expected_cycle_version: "${cyc_ver}" }
              as: StaffingManager
          trigger:
            - call: "POST /va-staffing/invoices"
              payload: { client_id: "${cli}", cycle_id: "${cyc}", variant: "FINAL" }
              as: StaffingManager
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.base_charge_cents == 50000"
            - "Invoice.${inv}.overage_charge_cents == 16000"
            - "Invoice.${inv}.total_cents == 66000"
            - "Invoice.${inv}.utilization_pct == 1.2"

      # --- 2.B mode (a): non-linear >=3-input weighted formula on va_match_score
      - name: va_match_score_nonlinear_weighted_selection
        grounds:
          - calculations.va_match_score
          - entities.Engagement.fields.match_score
          - entities.VirtualAssistant.fields.rating
          - entities.VirtualAssistant.fields.weekly_capacity_hours
        distinguishing_aspect: |
          Mode (a) non-linear interaction over >=3 inputs: va_match_score combines
          skill_coverage, rating/5, and min(1.0, capacity/40) under weights 0.5/0.3/0.2;
          VA-A (rating 4.0, cap 40 -> 0.9400) outranks VA-B (rating 5.0, cap 20 -> 0.9000)
          because the capacity cap clips B, so auto-match picks VA-A and stamps match_score 0.94.
        test_recipe:
          setup:
            - "SkillTag VIRTUAL_ASSIST; two eligible VAs both fully covering it, both AVAILABLE."
            - "VA-A rating 4.0 capacity 40; VA-B rating 5.0 capacity 20. Client requires VIRTUAL_ASSIST."
          setup_api_calls:
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "VIRTUAL_ASSIST", name: "Virtual Assist", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va A", email: "vaa@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va_a: $.data.id }
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va B", email: "vab@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 20, rating: 5.0 }
              as: StaffingManager
              captures: { va_b: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Delta", contact_email: "delta@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
          trigger:
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}" }
              as: StaffingManager
              captures: { eng: $.data.id, picked_va: $.data.va_id, score: $.data.match_score }
          assert:
            - "Engagement.${eng}.va_id == ${va_a}"
            - "Engagement.${eng}.match_score == 0.94"
            - "Engagement.${eng}.status == PROPOSED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- 3.A cyclic: RetainerCycle OPEN->CLOSED->new OPEN (revision loop)
      - name: retainer_cycle_close_mints_successor_open_cycle
        grounds:
          - state_machines.RetainerCycle.OPEN_to_CLOSED
          - entities.RetainerCycle.fields.sequence_no
          - entities.RetainerCycle.fields.status
        distinguishing_aspect: |
          RetainerCycle is cyclic (OPEN->CLOSED->new OPEN): closing cycle #1 mints a fresh
          OPEN cycle #2 of the SAME entity type with sequence_no incremented, looping the
          machine rather than terminating it — a non-linear shape on the RetainerCycle entity.
        test_recipe:
          setup:
            - "Client ACTIVE with cycle #1 OPEN (granted 10h), no LOGGED entries pending, no consumption."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "SCHEDULING", name: "Scheduling", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Cyc", email: "vacyc@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Epsilon", contact_email: "eps@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "GET /va-staffing/cycles?client_id=${cli}&status=OPEN"
              payload: {}
              as: StaffingManager
              captures: { cyc1: $.data.0.id, cyc1_ver: $.data.0.version }
          trigger:
            - call: "POST /va-staffing/cycles/${cyc1}/close"
              payload: { expected_cycle_version: "${cyc1_ver}" }
              as: StaffingManager
            - call: "GET /va-staffing/cycles?client_id=${cli}&status=OPEN"
              payload: {}
              as: StaffingManager
              captures: { cyc2: $.data.0.id }
          assert:
            - "RetainerCycle.${cyc1}.status == CLOSED"
            - "RetainerCycle.${cyc2}.status == OPEN"
            - "RetainerCycle.${cyc2}.sequence_no == 2"

      # --- 3.B branching+revert on a DIFFERENT entity: Task BLOCKED->IN_PROGRESS
      - name: task_block_then_unblock_reverts_into_work_loop
        grounds:
          - state_machines.Task.ASSIGNED_to_BLOCKED
          - state_machines.Task.BLOCKED_to_IN_PROGRESS
          - entities.Task.fields.status
          - entities.Task.fields.blocked_reason
        distinguishing_aspect: |
          The Task machine is non-linear via a revert edge: from IN_PROGRESS a task forks to
          BLOCKED then reverts BLOCKED->IN_PROGRESS clearing blocked_reason — a back-edge into
          the work loop on the Task entity (distinct from the RetainerCycle cyclic instance).
        test_recipe:
          setup:
            - "Client ACTIVE; one task ASSIGNED then IN_PROGRESS owned by the engagement VA."
          setup_api_calls:
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StaffingManager
            - call: "POST /va-staffing/skill-tags"
              payload: { code: "INBOX_MGMT", name: "Inbox Mgmt", is_specialized: false }
              as: StaffingManager
              captures: { skill: $.data.id }
            - call: "POST /va-staffing/sla-policies"
              payload: { tier: "STANDARD", response_minutes: 60, resolution_hours: 24, breach_penalty_pct: 0.0 }
              as: StaffingManager
            - call: "POST /va-staffing/virtual-assistants"
              payload: { full_name: "Va Blk", email: "vablk@x.com", skill_tag_ids: ["${skill}"], weekly_capacity_hours: 40, rating: 4.0 }
              as: StaffingManager
              captures: { va: $.data.id }
            - call: "POST /va-staffing/clients"
              payload: { company_name: "Zeta", contact_email: "zeta@x.com" }
              as: Client
              captures: { cli: $.data.id }
            - call: "PATCH /va-staffing/clients/${cli}/scope"
              payload: { scope_summary: "admin", required_skill_tag_ids: ["${skill}"], monthly_retainer_hours: 10, base_rate_cents: 5000, overage_rate_cents: 8000, rollover_cap_hours: 0 }
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements"
              payload: { client_id: "${cli}", va_id: "${va}" }
              as: StaffingManager
              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Blk task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
            - call: "POST /va-staffing/tasks/${task}/start"
              payload: {}
              as: VA
              as_user_id: "${va}"
            - call: "POST /va-staffing/tasks/${task}/block"
              payload: { blocked_reason: "waiting-on-client" }
              as: VA
              as_user_id: "${va}"
          trigger:
            - call: "POST /va-staffing/tasks/${task}/unblock"
              payload: {}
              as: VA
              as_user_id: "${va}"
              captures: { st: $.data.status }
          assert:
