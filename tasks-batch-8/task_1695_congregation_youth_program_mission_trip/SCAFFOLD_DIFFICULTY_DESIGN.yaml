            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/submit", as: Guardian, as_user_id: "guardian-1" }
          trigger:
            - { call: "POST /youth-ministry/registrations/${reg1}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1", captures: {blocked_err: $.data.error_id} }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1", captures: {after_status: $.data.registration_status, ack: $.data.conduct_acknowledged} }
          assert:
            - "blocked_err == ERR_REQUIRED_FORMS_INCOMPLETE (422) — the registration gate reads sibling ConsentForm state, not its own row"
            - "after_status == APPROVED once the third form flips to VERIFIED"
            - "ack == true (CONDUCT_AGREEMENT verification set Registration.conduct_acknowledged)"

      - name: dismiss_requires_trip_in_progress
        grounds:
          - state_machines.Registration.CONFIRMED_to_DISMISSED
          - state_machines.Trip.ROSTER_LOCKED_to_IN_PROGRESS
          - errors[ERR_TRIP_STATE_FORBIDS_ACTION]
          - entities.Participant.fields.barred_until
        distinguishing_aspect: |
          Entity pair Registration <- Trip (distinct from the Registration <-
          ConsentForm pair): dismiss is unreachable in every Trip state except
          IN_PROGRESS; a CONFIRMED registration on a REGISTRATION_OPEN trip is
          rejected, and after the trip crosses ROSTER_LOCKED -> IN_PROGRESS the
