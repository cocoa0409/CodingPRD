              captures: { cust_a: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "otherB@x.com", full_name: "Other B" }
              as: Associate
              captures: { cust_b: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-31", name: "RbacC", category: "HARD_SHELL", msrp_cents: 20000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_a}", product_id: "${pid}" }
              as: Associate
              captures: { ro_id: $.data.id }
            - call: "POST /store/repair-lines"
              payload: { repair_order_id: "${ro_id}", repair_type: "WHEEL", labor_hours: 1, complexity: "STANDARD", parts_cost_cents: 1000 }
              as: Associate
            - call: "POST /store/repair-orders/${ro_id}/quote"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /store/repair-orders/${ro_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 403"
            - "response data.error_id == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------
  # Section: cross_cutting  (already-covered stubs)
  # ---------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: repair_quote_empty_line_set_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_REPAIR_LINES]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / repair_quote_empty_line_set_rejected
          rationale: "The empty-line-set boundary and its ERR_NO_REPAIR_LINES trigger are asserted by the named §1.8 instance."
      - name: schedule_conflict_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bench_half_open_adjacency_allowed_overlap_rejected
          rationale: "ERR_SCHEDULE_CONFLICT is asserted as the overlap rejection path of the named §1.8 instance."
      - name: registration_not_active_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_REGISTRATION_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_review_requires_registration_active
          rationale: "ERR_REGISTRATION_NOT_ACTIVE is asserted by the named §1.8 cross-entity instance."
      - name: order_not_captured_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_NOT_CAPTURED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / start_monogram_requires_order_captured
          rationale: "ERR_ORDER_NOT_CAPTURED is asserted by the named §1.8 cross-entity instance."
      - name: dual_variant_points_reconciliation
        claim_type: variant_reconciliation
        grounds: [calculations.loyalty_points_accrual]
        excluded_because:
          difficulty_instance: dual_variant_calc / loyalty_points_provisional_vs_final_tier_change
          rationale: "Provisional-vs-final points divergence is asserted by the named §1.8 dual-variant instance."

  # ---------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: capture_credits_points_visible_in_same_flow
        claim_type: immediate_visibility
        grounds: [state_machines.SalesOrder.PENDING_to_CAPTURED, entities.Customer.fields.points_balance]
        distinguishing_aspect: "Immediately after capture, GET /store/customers/{id} reflects the credited points_balance (immediate consistency)."
        test_recipe:
          setup: ["BRONZE Customer; Product; SalesOrder with one line net 10000; captured."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner25@x.com", full_name: "Corner TwentyFive" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-32", name: "Consist", category: "SOFT_SIDE", msrp_cents: 10000, warranty_months: 12, length_mm: 500, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 10000, qty: 1 }
              as: Associate
            - call: "POST /store/sales-orders/${so_id}/capture"
              payload: {}
              as: Associate
          trigger:
            - call: "GET /store/customers/${cust_id}"
              payload: {}
              as: Associate
          assert:
            - "Customer.${cust_id}.points_balance == 100"
