          - endpoints.POST /eqp/claims
        distinguishing_aspect: "Many claims may legitimately be filed against one DECLARED event, so the second filing is never blocked by a state precondition: a FNOL carrying the event version read before another claim landed is refused with 412 ERR_STALE_EVENT_VERSION, and the same FNOL succeeds once the event is re-read."
