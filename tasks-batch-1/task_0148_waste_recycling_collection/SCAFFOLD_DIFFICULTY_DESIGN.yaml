              as: Billing
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          assert:
            - "Invoice.${inv_id}.contamination_surcharge_cents == 3300"
      - name: invoice_total_pinned_evaluation_order_mode_c
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.credit_cents
        distinguishing_aspect: "Mode (c): explicit evaluation order — charges (base+weight+contam+penalty) summed first, single credit subtraction last, then floor at 0; base 3000 + weight 1400 + contam 2500 + penalty 1000 - credit 1500 = total 6400 (well-defined only because the credit is subtracted after all charges)."
