# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_2205_excess_surplus_lines_placement_tax
#
# Every asserted number below was computed by executing the §1.3 formulas and
# their `constants:` as code against the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: premium_tax_allocated_multi_versus_home_state_single_diverge
        grounds:
          - calculations.premium_tax_and_stamping_fee
          - entities.StateProgram.fields.allocation_method
          - entities.Policy.fields.allocation_method_applied
          - entities.PolicyStateAllocation.fields.allocation_pct
          - state_machines.Policy.tax_status.UNCALCULATED_to_CALCULATED
        distinguishing_aspect: |
          Two policies with byte-identical premium, fee and exposure inputs produce
          total_tax_cents 38779 under ALLOCATED_MULTI (home state TX) and 30750
          under HOME_STATE_SINGLE (home state CA), because the multi-state variant
          taxes each state's third at that state's own rate while the single-state
          variant taxes the whole taxable premium at the home state's rate.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brokerage holding ACTIVE SURPLUS_LINES licenses in both TX and CA."
            - "StateProgram TX with allocation_method ALLOCATED_MULTI and premium_tax_rate 0.0485; StateProgram NV with 0.0350 and no stamping office; StateProgram CA with allocation_method HOME_STATE_SINGLE and premium_tax_rate 0.0300."
            - "One carrier whose security_status is APPROVED and which is WHITE_LISTED in both TX and CA."
            - "Two placements over the identical exposure schedule TX/NV/CA at 300000000 cents each; the first has principal_place_of_business_state TX (home state TX), the second has CA (home state CA); both have three valid recent TX-or-CA declinations and are SEARCH_COMPLETE."
            - "Two policies, one on each placement, both with original_gross_premium_cents 1000000, policy_fee_cents 25000, broker_fee_cents 50000."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Any
            - &c_broker
              call: "POST /brokers"
              payload: { firm_name: "Lone Star Surplus Partners", home_state: "TX" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - &c_lic_tx
              call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "TX", license_number: "SL-TX-1001", license_type: "SURPLUS_LINES", expires_on: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
            - &c_lic_ca
              call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "CA", license_number: "SL-CA-2002", license_type: "SURPLUS_LINES", expires_on: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
            - &c_prog_tx
              call: "POST /state-programs"
              payload: { state_code: "TX", premium_tax_rate: 0.0485, stamping_fee_rate: 0.0015, stamping_fee_cap_cents: null, stamping_office_required: true, allocation_method: "ALLOCATED_MULTI", diligent_search_min_declinations: 3, export_list_exempts_search: true, filing_frequency: "MONTHLY", filing_deadline_days: 30, return_premium_tax_refundable: true, return_premium_stamping_refundable: false, min_carrier_capital_surplus_cents: 1500000000, required_notice_codes: ["TX-SL-1", "TX-SL-2"] }
              as: PlatformAdmin
              captures: { tx_program_id: $.data.id }
            - &c_prog_nv
              call: "POST /state-programs"
              payload: { state_code: "NV", premium_tax_rate: 0.0350, stamping_fee_rate: 0.0040, stamping_fee_cap_cents: null, stamping_office_required: false, allocation_method: "ALLOCATED_MULTI", diligent_search_min_declinations: 2, export_list_exempts_search: false, filing_frequency: "MONTHLY", filing_deadline_days: 45, return_premium_tax_refundable: false, return_premium_stamping_refundable: false, min_carrier_capital_surplus_cents: 500000000, required_notice_codes: ["NV-SL"] }
              as: PlatformAdmin
              captures: { nv_program_id: $.data.id }
            - &c_prog_ca
              call: "POST /state-programs"
              payload: { state_code: "CA", premium_tax_rate: 0.0300, stamping_fee_rate: 0.0018, stamping_fee_cap_cents: 50000, stamping_office_required: true, allocation_method: "HOME_STATE_SINGLE", diligent_search_min_declinations: 3, export_list_exempts_search: false, filing_frequency: "QUARTERLY", filing_deadline_days: 45, return_premium_tax_refundable: true, return_premium_stamping_refundable: true, min_carrier_capital_surplus_cents: 1500000000, required_notice_codes: ["CA-D1", "CA-D2"] }
              as: PlatformAdmin
