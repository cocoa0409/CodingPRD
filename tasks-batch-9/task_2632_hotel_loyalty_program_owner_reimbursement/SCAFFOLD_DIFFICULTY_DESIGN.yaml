            - "response code 200 and Hotel.${h_id}.status == TERMINATED with termination_reason recorded"
            - "hop 2: ReimbursementBatch.${b_id}.status == REJECTED with rejection_reason == HOTEL_TERMINATED, while item_count == 1 and gross_reimbursement_cents == ${b_gross} == 45000 are retained for audit"
            - "hop 3: Redemption.${r1_id}.reimbursement_status == VOIDED, batch_id == null and settled_reimbursement_cents == 0 - it was BATCHED at trigger time and could only be reached THROUGH the batch rejection"
            - "hop 2: Redemption.${r2_id}.reimbursement_status == VOIDED, where the captured ${r2_status_before} was ACCRUED; it was never batched, so batch_id stays null"
            - "both rows keep fulfillment_status == STAYED and estimated_reimbursement_cents == 45000 - the fulfillment dimension and the accrual estimate are outside this cascade"
            - "Hotel.${h_id}.reimbursement_owed_cents == 0 and fee_ledger_balance_cents == 0"
            - "no point movement: Member.${m_id}.point_balance == 40000 (200000 purchased - 80000 - 80000) and the captured ${cash_due} was 220000, so ProgramFund.cash_balance_cents == 220000"
            - "ProgramFund.outstanding_points == 40000, point_liability_cents == 19200, solvency_ratio == 11.4583 and status == HEALTHY"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: onboarding_property_masks_insufficient_points_and_unmasks_after_activation
        grounds:
          - validations.priority_40_ERR_HOTEL_NOT_ACTIVE
          - validations.priority_80_ERR_INSUFFICIENT_POINTS
          - state_machines.Hotel.ONBOARDING_to_ACTIVE
          - endpoints.POST_loyalty_redemptions
        distinguishing_aspect: |
          Category pair STATE (priority 40, 409) versus BUSINESS_FISCAL (priority 80, 402), both on
          POST /loyalty/redemptions. Two independent violations are present in the same request and
          only the property-status error surfaces; activating the property then unmasks the fiscal
          error from the identical payload, proving the ordering rather than merely observing one error.
        test_recipe:
          setup:
            - "A property left in ONBOARDING: created with one TRANSIENT rate plan and a STANDARD award window covering all of 2026 at 40000 points per night, min_tier BASE, allotment 3, but never activated."
            - "A member with a zero point balance and no ledger entries at all."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Halcyon Bay Pending", brand_code: "HBP", market_tier: "RESORT", program_fee_pct: 0.045, rooms_count: 80, trailing_12m_occupancy_pct: 0.6, trailing_12m_adr_cents: 20000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id, hv0: $.data.version, st0: $.data.status }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR-ONB", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 3 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "pri1@example.com", full_name: "Ada Kowalczyk", enrollment_date: "2026-05-05" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id, bal0: $.data.point_balance }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-12", expected_hotel_version: "${hv0}" }
              as: ProgramAdministrator
              captures: { err_masked: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { hv1: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-12", expected_hotel_version: "${hv1}" }
              as: ProgramAdministrator
              captures: { err_unmasked: $.data.error_id }
          assert:
            - "the captured ${st0} was ONBOARDING and the captured ${bal0} was 0, so priority 40 and priority 80 are both violated by the first call"
            - "first call: response code 409 and ${err_masked} == ERR_HOTEL_NOT_ACTIVE"
            - "first call: the response is NOT 402 and ${err_masked} != ERR_INSUFFICIENT_POINTS"
            - "third call, identical payload except the refreshed version: response code 402 and ${err_unmasked} == ERR_INSUFFICIENT_POINTS (80000 points required against a 0 balance)"
            - "no Redemption row exists for member ${m_id} and no PointLedgerEntry was written by either rejected call"
            - "Hotel.${h_id}.version == ${hv1} > ${hv0} and status == ACTIVE after the activation"

      - name: blackout_date_masks_tier_below_inventory_minimum_at_equal_http_status
        grounds:
          - validations.priority_60_ERR_BLACKOUT_DATE_UNAVAILABLE
          - validations.priority_71_ERR_TIER_BELOW_INVENTORY_MINIMUM
          - entities.BlackoutWindow.fields.scope
          - calculations.redemption_pricing_selection
          - endpoints.POST_loyalty_redemptions
        distinguishing_aspect: |
          A different category pair - BUSINESS_TEMPORAL (priority 60) versus BUSINESS_CONSTRAINT
          (priority 71) - and both errors carry http_status 422, so the status code cannot
          disambiguate them and only error_id can. The second call moves the dates clear of the
          blackout while leaving the tier deficiency in place, which surfaces the lower-priority error.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan and a STANDARD award window covering all of 2026 at 40000 points per night, min_tier_required GOLD, allotment 3."
            - "An ACTIVE blackout window 2026-09-10 to 2026-09-20 with scope ALL_REDEMPTIONS (day_count 11)."
            - "A BASE-tier member holding 100000 points from a single goodwill grant written while the point ledger was still empty."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Cinder Peak Lodge", brand_code: "CPL", market_tier: "RESORT", program_fee_pct: 0.05, rooms_count: 60, trailing_12m_occupancy_pct: 0.7, trailing_12m_adr_cents: 52000 }
