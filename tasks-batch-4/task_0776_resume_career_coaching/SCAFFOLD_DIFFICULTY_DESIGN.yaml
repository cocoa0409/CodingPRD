  # ==========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_buffer_expanded_overlap
        grounds:
          - validations[priority=8]
          - entities.Coach.fields.buffer_minutes
          - errors[ERR_COACH_SLOT_CONFLICT]
        distinguishing_aspect: |
          Coach resource uses buffer-expanded interval semantics: a new session starting 10
          minutes after the prior end (11:00 -> 11:10) collides because 10 < buffer_minutes(15),
          yielding ERR_COACH_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Plan with 2 included sessions; confirmed order; coach buffer 15; one session already booked 10:00-11:00 on that coach."
          setup_api_calls:
            - call: "POST /package-plans"
