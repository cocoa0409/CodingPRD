# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2695 — Contractor Licensing & Complaint Adjudication
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves the
# scaffold's declared behaviour identical; it only makes coverage harder to audit.
# Every numeric assert below was computed by executing the §1.3 formula with its declared constants.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: citation_penalty_initial_assessment_vs_post_hearing_mitigation
        grounds:
          - calculations.citation_civil_penalty
          - state_machines.Citation.ISSUED_to_APPEAL_REQUESTED
          - state_machines.Citation.HEARING_SCHEDULED_to_AFFIRMED
          - state_machines.DisciplinaryHearing.SCHEDULED_to_DECIDED
          - entities.Citation.fields.penalty_variant
          - entities.Citation.fields.correction_completed_on
        distinguishing_aspect: |
          The SAME citation is priced twice by the SAME formula on the enforcement-penalty entity:
          INITIAL_ASSESSMENT at issuance returns 375000 while POST_HEARING_RECALCULATION at the
          hearing returns 281250, because only the post-hearing variant can see a verified order of
          correction and apply the 25% mitigation credit — a 93750-cent divergence on one row.
        test_recipe:
          setup:
            - "clock at 2026-08-01, one C-10 classification (hazard_tier 3, mediation_required true)"
            - "one ACTIVE licence with no bond on file, so its compliance_posture is NON_COMPLIANT"
            - "one consumer complaint screened into mediation, failed out of mediation, investigated and substantiated SERIOUS"
            - "the citation issued on that investigation is appealed and calendared before a hearing officer who is not the investigator"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Volt Works LLC", entity_type: "LLC", contact_email: "ops@voltworks.test" }
              as: LicensingAnalyst
              captures: { lic1_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Dana Volt", verified_experience_months: 24 }
              as: LicensingAnalyst
              captures: { qi1_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi1_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 82, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi1_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 78, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic1_id}", classification_id: "${cls_id}", qualifying_individual_id: "${qi1_id}", application_type: "ORIGINAL", declared_net_worth_cents: 250000, education_credential: "FOUR_YEAR_DEGREE" }
              as: Licensee
              as_user_id: "${lic1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app1_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Pat Ratepayer", contact_email: "pat@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con1_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con1_id}", license_id: "${lc1_id}", alleged_loss_cents: 800000, contract_date: "2026-08-10", work_completed_on: "2026-08-20", description: "Panel upgrade energised without inspection" }
              as: Consumer
              as_user_id: "${con1_id}"
              captures: { cmp1_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp1_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/complaints/${cmp1_id}/mediation-outcome"
              payload: { outcome: "FAILED" }
              as: LicensingAnalyst
            - call: "POST /licensing/investigations"
              payload: { origin: "COMPLAINT", complaint_id: "${cmp1_id}", subject_license_id: "${lc1_id}" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { inv1_id: $.data.id }
            - call: "POST /licensing/investigations/${inv1_id}/close"
              payload: { finding: "SUBSTANTIATED", finding_severity: "SERIOUS", evidence_summary: "Unpermitted service change confirmed on site" }
              as: Investigator
              as_user_id: "inv-11"
            - call: "POST /licensing/citations"
              payload: { investigation_id: "${inv1_id}", classification_id: "${cls_id}", violation_code: "B-7110", correction_due_date: "2026-09-30" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { cit1_id: $.data.id, initial_penalty: $.data.civil_penalty_cents, initial_variant: $.data.penalty_variant }
            - call: "POST /licensing/citations/${cit1_id}/appeal"
              payload: { appeal_grounds: "Inspection was scheduled and refused by the owner" }
              as: Licensee
              as_user_id: "${lic1_id}"
            - call: "POST /licensing/disciplinary-hearings"
              payload: { citation_id: "${cit1_id}", presiding_officer_user_id: "ho-77", scheduled_start_utc: "2026-09-10T14:00:00Z", scheduled_end_utc: "2026-09-10T16:00:00Z" }
              as: BoardAdmin
              captures: { hr1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/disciplinary-hearings/${hr1_id}/decide"
              payload: { decision: "AFFIRM", findings_summary: "Violation proven; correction verified before the ordered date", correction_verified_on: "2026-09-08" }
              as: HearingOfficer
              as_user_id: "ho-77"
          assert:
            - "${initial_penalty} == 375000"
            - "${initial_variant} == INITIAL_ASSESSMENT"
            - "Citation.${cit1_id}.civil_penalty_cents == 281250"
            - "Citation.${cit1_id}.penalty_variant == POST_HEARING_RECALCULATION"
            - "Citation.${cit1_id}.status == AFFIRMED"
            - "Citation.${cit1_id}.correction_completed_on == 2026-09-08"
            - "Citation.${cit1_id}.prior_final_citation_count == 0"
            - "${initial_penalty} - Citation.${cit1_id}.civil_penalty_cents == 93750"
            - "DisciplinaryHearing.${hr1_id}.sanction_points == 5"
            - "DisciplinaryHearing.${hr1_id}.sanction_tier == PROBATION"
            - "DisciplinaryHearing.${hr1_id}.status == DECIDED"
            - "License.${lc1_id}.status == ACTIVE"
            - "License.${lc1_id}.compliance_posture == NON_COMPLIANT"
            - "Licensee.${lic1_id}.unpaid_penalty_cents == 281250"
            - "Complaint.${cmp1_id}.status == CLOSED_SANCTIONED"

      - name: recovery_claim_preliminary_estimate_vs_final_award_after_partial_settlement
        grounds:
          - calculations.recovery_award
          - entities.RecoveryFundClaim.fields.estimated_award_cents
          - entities.RecoveryFundClaim.fields.awarded_amount_cents
          - state_machines.RecoveryFundClaim.FILED_to_APPROVED
          - state_machines.Complaint.MEDIATION_to_INVESTIGATION
          - validations[priority=67]
        distinguishing_aspect: |
          Different entity and different divergence driver from the citation instance: on the
          recovery-fund claim the preliminary_estimate variant sees only claimed_amount_cents and the
          per-claim cap (1200000), while the final_award variant additionally clips by the court
          judgment and subtracts the 300000 partial mediation settlement (900000) — the estimate is
          never restated, so both numbers coexist on one RecoveryFundClaim row.
        test_recipe:
          setup:
            - "a 2027 recovery-fund appropriation with balance 5000000, per-claim cap 1500000, per-licence aggregate cap 2000000"
            - "one ACTIVE licence and one complaint pleading a 1500000 loss"
            - "mediation failed but banked a 300000 partial settlement, so the complaint sits in INVESTIGATION"
            - "a COURT_JUDGMENT claim for 1200000 on a 1400000 judgment entered 2026-09-05, adjudicated once the 90-day ripening has run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/recovery-fund-accounts"
              payload: { fiscal_year: 2027, initial_balance_cents: 5000000, per_claim_cap_cents: 1500000, per_license_aggregate_cap_cents: 2000000 }
              as: BoardAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Volt Works LLC", entity_type: "LLC", contact_email: "ops@voltworks.test" }
              as: LicensingAnalyst
              captures: { lic1_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Dana Volt", verified_experience_months: 24 }
              as: LicensingAnalyst
              captures: { qi1_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi1_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 82, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi1_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 78, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic1_id}", classification_id: "${cls_id}", qualifying_individual_id: "${qi1_id}", application_type: "ORIGINAL", declared_net_worth_cents: 250000, education_credential: "FOUR_YEAR_DEGREE" }
              as: Licensee
              as_user_id: "${lic1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app1_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Pat Ratepayer", contact_email: "pat@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con1_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con1_id}", license_id: "${lc1_id}", alleged_loss_cents: 1500000, contract_date: "2026-08-10", work_completed_on: "2026-08-20", description: "Abandoned rewire, deposit not returned" }
              as: Consumer
              as_user_id: "${con1_id}"
              captures: { cmp1_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp1_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/complaints/${cmp1_id}/mediation-outcome"
              payload: { outcome: "FAILED", settlement_amount_cents: 300000 }
              as: LicensingAnalyst
            - call: "POST /licensing/recovery-fund-claims"
              payload: { fund_account_id: "${fund_id}", complaint_id: "${cmp1_id}", basis: "COURT_JUDGMENT", claimed_amount_cents: 1200000, judgment_amount_cents: 1400000, judgment_docket_number: "CV-2026-118", judgment_entered_on: "2026-09-05" }
              as: Consumer
              as_user_id: "${con1_id}"
              captures: { clm1_id: $.data.id, estimate: $.data.estimated_award_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-04T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/recovery-fund-claims/${clm1_id}/adjudicate"
              payload: { outcome: "APPROVE" }
              as: FundAdjudicator
          assert:
            - "${estimate} == 1200000"
            - "RecoveryFundClaim.${clm1_id}.estimated_award_cents == 1200000"
            - "RecoveryFundClaim.${clm1_id}.awarded_amount_cents == 900000"
            - "RecoveryFundClaim.${clm1_id}.status == APPROVED"
            - "RecoveryFundClaim.${clm1_id}.adjudicated_on == 2026-12-04"
            - "RecoveryFundClaim.${clm1_id}.estimated_award_cents - RecoveryFundClaim.${clm1_id}.awarded_amount_cents == 300000"
            - "License.${lc1_id}.recovery_encumbered_cents == 900000"
            - "License.${lc1_id}.outstanding_recovery_repayment_cents == 0"
            - "License.${lc1_id}.status == ACTIVE"
            - "RecoveryFundAccount.${fund_id}.balance_cents == 5000000"

  - rule_id: combinatorial_formula
    instances:

      - name: unlicensed_sting_egregious_penalty_clamped_at_statutory_maximum
        grounds:
          - calculations.citation_civil_penalty
          - state_machines.Investigation.OPEN_to_SUBSTANTIATED
          - entities.Citation.fields.subject_type
          - entities.Citation.fields.civil_penalty_cents
          - validations[priority=55]
        distinguishing_aspect: |
          Mode (a) multi-factor product: four independent multipliers (severity base 750000, UNLICENSED
          subject 2.0, hazard_tier-3 step 1.5, no-prior 1.0) compose into a raw 2250000 that the
          statutory clamp cuts to 1500000 — the combinatorial part is the factor product and the
          single terminal clamp, not any staging or distribution.
        test_recipe:
          setup:
            - "clock at 2026-08-01 and a C-10 classification with hazard_tier 3"
            - "a board sting investigation against an unlicensed operator — origin STING, no complaint, no subject licence"
            - "the investigation is closed SUBSTANTIATED with finding_severity EGREGIOUS by its assigned investigator"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/investigations"
              payload: { origin: "STING", subject_business_name: "Bolt Sparks Handyman" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { inv1_id: $.data.id }
            - call: "POST /licensing/investigations/${inv1_id}/close"
              payload: { finding: "SUBSTANTIATED", finding_severity: "EGREGIOUS", evidence_summary: "Undercover buy: live 200A service installed without any licence" }
              as: Investigator
              as_user_id: "inv-11"
          trigger:
            - call: "POST /licensing/citations"
              payload: { investigation_id: "${inv1_id}", classification_id: "${cls_id}", violation_code: "B-7028", correction_due_date: "2026-09-15" }
              as: Investigator
              as_user_id: "inv-11"
              captures: { cit1_id: $.data.id }
          assert:
            - "Citation.${cit1_id}.civil_penalty_cents == 1500000"
            - "Citation.${cit1_id}.subject_type == UNLICENSED"
            - "Citation.${cit1_id}.severity == EGREGIOUS"
            - "Citation.${cit1_id}.penalty_variant == INITIAL_ASSESSMENT"
            - "Citation.${cit1_id}.prior_final_citation_count == 0"
            - "Citation.${cit1_id}.license_id == null"
            - "Citation.${cit1_id}.status == ISSUED"
            - "Citation.${cit1_id}.issued_on == 2026-08-01"
            - "Citation.${cit1_id}.appeal_deadline == 2026-08-16"

      - name: prorata_distribution_of_exhausted_fund_across_two_approved_claims
        grounds:
          - calculations.recovery_prorata_distribution
          - calculations.recovery_award
          - state_machines.RecoveryFundClaim.APPROVED_to_PAID
          - concurrency_rules[claim-pay-stale-fund-account]
          - entities.RecoveryFundClaim.fields.paid_amount_cents
        distinguishing_aspect: |
          Mode (b) distribution: one payment request divides a 900000 balance across a two-claim cohort
          awarded 1100000 in total, so each share is a floor of an integer product-quotient
          (572727 and 327272) and the single residual cent goes to the earliest-created claim,
          landing 572728 / 327272 — an allocation across rows, not a per-row product.
        test_recipe:
          setup:
            - "a recovery-fund appropriation with balance 900000, per-claim cap 1500000, per-licence aggregate cap 2000000"
            - "one ACTIVE licence with two mediating complaints from two different consumers"
            - "two COURT_JUDGMENT claims on that licence, approved for 700000 (filed first) and 400000 (filed second)"
            - "clock at 2026-12-04, past the 90-day ripening of both judgments"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/recovery-fund-accounts"
              payload: { fiscal_year: 2027, initial_balance_cents: 900000, per_claim_cap_cents: 1500000, per_license_aggregate_cap_cents: 2000000 }
              as: BoardAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Volt Works LLC", entity_type: "LLC", contact_email: "ops@voltworks.test" }
              as: LicensingAnalyst
              captures: { lic1_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals"
              payload: { full_name: "Dana Volt", verified_experience_months: 24 }
              as: LicensingAnalyst
              captures: { qi1_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi1_id}/exam-results"
              payload: { exam_type: "LAW_AND_BUSINESS", score: 82, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/qualifying-individuals/${qi1_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 78, taken_on: "2025-03-01" }
              as: LicensingAnalyst
            - call: "POST /licensing/license-applications"
              payload: { licensee_id: "${lic1_id}", classification_id: "${cls_id}", qualifying_individual_id: "${qi1_id}", application_type: "ORIGINAL", declared_net_worth_cents: 250000, education_credential: "FOUR_YEAR_DEGREE" }
              as: Licensee
              as_user_id: "${lic1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /licensing/license-applications/${app1_id}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic1_id}"
            - call: "POST /licensing/license-applications/${app1_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "GET /licensing/licenses?application_id=${app1_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { lc1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Pat Ratepayer", contact_email: "pat@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con1_id: $.data.id }
            - call: "POST /licensing/consumers"
              payload: { full_name: "Rae Homeowner", contact_email: "rae@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con2_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con1_id}", license_id: "${lc1_id}", alleged_loss_cents: 800000, contract_date: "2026-08-05", work_completed_on: "2026-08-20", description: "Service upgrade abandoned mid-job" }
              as: Consumer
              as_user_id: "${con1_id}"
              captures: { cmp1_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp1_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con2_id}", license_id: "${lc1_id}", alleged_loss_cents: 500000, contract_date: "2026-08-06", work_completed_on: "2026-08-21", description: "Subpanel never energised, deposit retained" }
              as: Consumer
              as_user_id: "${con2_id}"
              captures: { cmp2_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp2_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: LicensingAnalyst
            - call: "POST /licensing/recovery-fund-claims"
