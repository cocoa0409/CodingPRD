  - rule_id: boundary_precision_check
    instances:

      - name: minimum_games_threshold_reached_exactly_flips_average_variant
        grounds:
          - calculations.bowler_average
          - entities.League.fields.minimum_games_for_average
          - entities.Membership.fields.average_status
          - entities.SeriesEntry.fields.counts_toward_average
          - calculations.team_handicap_per_game
        distinguishing_aspect: |
          minimum_games_for_average is 3 and certification lands three bowlers on exactly 3
          certified games: the comparison is >= so they become ESTABLISHED and take the truncated
          quotient (160 and 150) instead of the BLENDED values (169 and 159) they would carry at
          2 games, while the ABSENTEE slot contributes 0 average-bearing games and stays
          PROVISIONAL at 195.
        test_recipe:
          setup:
            - "One league on CONFIG-B except minimum_games_for_average 3 and legal_lineup_minimum 1."
            - "Team 1's week 1 lineup is position 1 REGULAR ${ms1_id} and position 2 ABSENTEE ${ms2_id}; team 2 fields two REGULAR slots."
            - "Scores entered: ${ms1_id} 170/180/190 (540), the ABSENTEE slot 100/100/100 (300), ${ms3_id} 150/160/170 (480), ${ms4_id} 140/150/160 (450)."
            - "The ABSENTEE slot froze handicap_per_game_applied 31 from max(0, 195 - absentee_deduction 10), so Match.home_team_handicap_per_game is 67 and away is 99."
            - "Nothing is certified yet: certified_games 0 and average_status PROVISIONAL on all four rows."
