# =============================================================================
# PRD Benchmark Seed Tables — Immersive Pop-Up Experience Operations
# Sections §1.0 – §1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.)
# =============================================================================

scenario: |
  2968. Immersive Pop-Up Experience Operations (immersive experience operator): venue selection with lease term, buildout allowance and permitting for assembly occupancy, experience design with timed-entry capacity, dwell time and guest flow through themed rooms, ticketing with timed slots, dynamic pricing and group or private buyout options, staffing with performers, guest ambassadors and technicians including training on scripted interactions, safety and accessibility compliance with capacity limits, egress and sensory accommodation options, licensed intellectual property agreements with approval rights over creative execution and merchandise, run extension or closure decisions based on demand with lease flexibility, tour city expansion with build kit reuse and localization

domain_name: immersive-popup-ops
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: PopupVenue, LicenseAgreement, BuildKit, ExperienceRun, GuestAccount are peers linked
  # by foreign keys; ExperienceRun.build_kit_id -> BuildKit and BuildKit.origin_run_id ->
  # ExperienceRun form a cyclic reference pair, and CreativeSubmission.superseded_by_submission_id
  # / RoyaltyStatement.superseded_by_statement_id are self-referential edges. No entity is
  # nested inside another entity's URL path — every collection sits at the top level.

  state_machine_shape: cyclic
  # CreativeSubmission cycles SUBMITTED -> IN_REVIEW -> CHANGES_REQUESTED -> SUBMITTED;
  # PopupVenue cycles PERMIT_UNDER_REVIEW -> PERMIT_CONDITIONS -> PERMIT_UNDER_REVIEW;
  # StaffMember cycles CLEARED -> SUSPENDED -> CLEARED; TimedEntrySlot cycles
  # OPEN -> SOLD_OUT -> OPEN and OPEN -> SUSPENDED -> OPEN; ExperienceRun carries TWO
  # parallel state dimensions (run_status x clearance_status) plus an EXTENDED self-loop;
  # TicketOrder forks CONFIRMED -> {CHECKED_IN, NO_SHOW, REFUND_DUE, REFUNDED} with a
  # different side-effect set per branch.

  relationship_patterns:
    - one_to_many          # ExperienceRun -> ThemedRoom / TimedEntrySlot / StaffMember
    - self_referential     # CreativeSubmission.superseded_by_submission_id, RoyaltyStatement.superseded_by_statement_id
    - cross_aggregate      # TicketOrder reads TimedEntrySlot + ExperienceRun + GuestAccount + PopupVenue
    - polymorphic: false   # not used

  role_model: segregation_of_duties
  # Three named segregation rules: (SoD-1) the SafetyOfficer who finalized the FAIL inspection
  # may not lift the resulting suspension; (SoD-2) the user id that created a CreativeSubmission
  # may not be the user id that approves it; (SoD-3) the user id that created an ExperienceRun
  # may not be the user id that grants its extension.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PopupVenue
    parent: null
    common_fields: true
    fields:
      - name: city_code
        type: string
        source: input
        description: "Three-letter uppercase city code the venue sits in; compared against LicenseAgreement.territory_city_codes and BuildKit.last_city_code."
        constraints: "exactly 3 characters, A-Z only"
      - name: site_name
        type: string
        source: input
        description: "Human-readable site label."
        constraints: "1..120 characters"
      - name: lease_start_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD, UTC) the lease is in force."
        constraints: "ISO calendar date, exactly 10 characters"
      - name: lease_end_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, UTC) of the base lease term, extension option excluded."
        constraints: "ISO calendar date; MUST be strictly greater than lease_start_date"
      - name: lease_extension_option_days
        type: integer
        source: input
        description: "Total number of extension days the landlord option grants beyond lease_end_date."
        default: 0
        constraints: "0..180"
      - name: lease_extension_days_consumed
        type: integer
        source: computed
        description: "Sum of requested_extension_days already granted across all ExperienceRun extensions at this venue."
        default: 0
        constraints: "0..lease_extension_option_days"
      - name: base_monthly_rent_cents
        type: integer
        source: input
        description: "Base monthly rent in cents."
        constraints: ">= 0"
      - name: buildout_allowance_cents
        type: integer
        source: input
        description: "Landlord buildout allowance in cents; bucket 1 of the §1.3 buildout_allowance_drawdown waterfall."
        constraints: ">= 0"
      - name: kit_reuse_credit_cents
        type: integer
        source: input
        description: "Credit in cents earned by reusing a touring build kit; bucket 2 of the buildout waterfall."
        default: 0
        constraints: ">= 0"
      - name: buildout_cap_cents
        type: integer
        source: input
        description: "Hard ceiling on cumulative buildout_spend_cents; a draw that would exceed it is rejected."
        constraints: ">= buildout_allowance_cents"
      - name: allowance_drawn_cents
        type: integer
        source: computed
        description: "Cumulative cents drawn from bucket 1 (landlord allowance)."
        default: 0
        constraints: "0..buildout_allowance_cents"
      - name: kit_credit_drawn_cents
        type: integer
        source: computed
        description: "Cumulative cents drawn from bucket 2 (kit reuse credit)."
        default: 0
        constraints: "0..kit_reuse_credit_cents"
      - name: operator_capex_cents
        type: integer
        source: computed
        description: "Cumulative cents drawn from bucket 3 (uncapped operator capital expenditure)."
        default: 0
        constraints: ">= 0"
      - name: buildout_spend_cents
        type: integer
        source: computed
        description: "Cumulative buildout spend; conserved-quantity anchor: always equals allowance_drawn_cents + kit_credit_drawn_cents + operator_capex_cents."
        default: 0
        constraints: "0..buildout_cap_cents"
      - name: requested_occupancy_load
        type: integer
        source: input
        description: "Assembly occupancy load the operator applied for."
        constraints: ">= 1"
      - name: permitted_occupancy_load
        type: integer
        source: computed
        description: "Assembly occupancy load actually granted by the authority; 0 until the permit is issued."
        default: 0
        constraints: "0..egress_capacity"
      - name: egress_width_cm
        type: number
        source: input
        description: "Total clear egress width in centimetres, 2 decimal places."
        constraints: "> 0"
      - name: egress_capacity
        type: integer
        source: computed
        description: "floor(egress_width_cm / CM_PER_OCCUPANT); the code-derived occupant ceiling."
        constraints: ">= 0"
      - name: sprinklered
        type: boolean
        source: input
        description: "Whether the space is sprinklered; recorded for the permit file, not used in any calculation."
        default: false
      - name: permit_submission_round
        type: integer
        source: computed
        description: "Number of times a permit package has been submitted or resubmitted for this venue."
        default: 0
        constraints: "0..PERMIT_ROUND_CAP"
      - name: permit_conditions_note
        type: string
        source: system
        description: "Latest conditions text recorded when the authority returns the package for correction; null before any CONDITIONS decision."
        default: null
      - name: permit_denial_reason
        type: string
        source: system
        description: "Reason text recorded on a DENIED permit decision; null otherwise."
        default: null
      - name: permit_issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the permit was issued; null before issuance."
        default: null
      - name: lease_activated_at
        type: datetime
        source: system
        description: "Logical-clock instant the lease was activated; null before activation."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Venue lifecycle state; see §1.2 PopupVenue."
        default: DRAFT
        constraints: "DRAFT | PERMIT_UNDER_REVIEW | PERMIT_CONDITIONS | PERMIT_ISSUED | PERMIT_DENIED | LEASE_ACTIVE | LEASE_ENDED"

  - name: LicenseAgreement
    parent: null
    common_fields: true
    fields:
      - name: licensor_name
        type: string
        source: input
        description: "Name of the intellectual-property licensor."
        constraints: "1..120 characters"
      - name: ip_title
        type: string
        source: input
        description: "Title of the licensed property."
        constraints: "1..120 characters"
      - name: licensor_rep_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the LicensorRep of record; only this user id may review or decide this agreement's CreativeSubmission rows."
        constraints: "1..64 characters; never compared against any entity id"
      - name: royalty_rate_bps
        type: integer
        source: input
        description: "Ticket royalty rate in basis points."
        constraints: "0..10000"
      - name: merch_royalty_rate_bps
        type: integer
        source: input
        description: "Merchandise royalty rate in basis points."
        constraints: "0..10000"
      - name: minimum_guarantee_cents
        type: integer
        source: input
        description: "Whole-term minimum guarantee in cents; pro-rated per statement period by §1.3 royalty_accrual."
        constraints: ">= 0"
      - name: approval_scopes
        type: array
        source: input
        description: "Scopes over which the licensor holds approval rights; the run cannot clear until every listed scope has an APPROVED CreativeSubmission."
        constraints: "non-empty subset of {CREATIVE_EXECUTION, MERCHANDISE, MARKETING}, no duplicates"
      - name: territory_city_codes
        type: array
        source: input
        description: "City codes licensed for this property; a run's venue city_code MUST appear here."
        constraints: "non-empty array of 3-character uppercase city codes"
      - name: term_start_date
        type: string
        source: input
        description: "First calendar date of the licence term (YYYY-MM-DD)."
        constraints: "ISO calendar date"
      - name: term_end_date
        type: string
        source: input
        description: "Last calendar date of the licence term (YYYY-MM-DD), inclusive; denominator of the minimum-guarantee pro-ration."
        constraints: "ISO calendar date; MUST be strictly greater than term_start_date"
      - name: open_submission_count
        type: integer
        source: computed
        description: "Count of CreativeSubmission rows on this agreement with status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED}."
        default: 0
        constraints: ">= 0"
      - name: approved_submission_count
        type: integer
        source: computed
        description: "Count of CreativeSubmission rows on this agreement with status == APPROVED."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Agreement lifecycle state; see §1.2 LicenseAgreement."
        default: DRAFT
        constraints: "DRAFT | ACTIVE | EXPIRED"

  - name: CreativeSubmission
    parent: null
    common_fields: true
    fields:
      - name: license_agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the agreement whose approval rights govern this asset."
        constraints: "MUST reference an existing LicenseAgreement with status == ACTIVE"
      - name: run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run whose clearance_status this submission gates."
        constraints: "MUST reference an existing ExperienceRun whose license_agreement_id equals this row's license_agreement_id"
      - name: scope
        type: enum
        source: input
        description: "Approval scope this asset satisfies; MUST be listed in the agreement's approval_scopes."
        constraints: "CREATIVE_EXECUTION | MERCHANDISE | MARKETING"
      - name: asset_code
        type: string
        source: input
        description: "Operator-assigned asset code; (run_id, scope, asset_code) identifies the supersede family."
        constraints: "1..40 characters, uppercase letters, digits and hyphens only"
      - name: title
        type: string
        source: input
        description: "Descriptive title of the creative execution or merchandise item."
        constraints: "1..160 characters"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ExperienceProducer that created the row; SoD-2 forbids this same user id from approving it."
        constraints: "copied from the X-User-ID header at creation"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this row has been resubmitted after a CHANGES_REQUESTED decision."
        default: 0
        constraints: "0..REVISION_ROUND_CAP"
      - name: change_note
        type: string
        source: system
        description: "Change text recorded on the most recent CHANGES_REQUESTED decision; null before any."
        default: null
      - name: decision_note
        type: string
        source: system
        description: "Decision text recorded on the APPROVED or REJECTED decision; null before a terminal decision."
        default: null
      - name: review_started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent SUBMITTED -> IN_REVIEW transition; null before first review."
        default: null
      - name: resubmitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent CHANGES_REQUESTED -> SUBMITTED transition; null before first resubmit."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the APPROVED or REJECTED decision; null otherwise."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the LicensorRep that issued the terminal decision; null otherwise."
        default: null
      - name: superseded_by_submission_id
        type: string
        source: system
        description: "FK -> CreativeSubmission.id; set on the older row when a newer submission in the same (run_id, scope, asset_code) family is created. Null on the newest row."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Submission lifecycle state; see §1.2 CreativeSubmission."
        default: SUBMITTED
        constraints: "SUBMITTED | IN_REVIEW | CHANGES_REQUESTED | APPROVED | REJECTED | SUPERSEDED"

  - name: ExperienceRun
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> PopupVenue.id; the venue this run installs into."
        constraints: "MUST reference an existing PopupVenue with status IN {PERMIT_ISSUED, LEASE_ACTIVE}"
      - name: license_agreement_id
        type: string
        source: input
        description: "FK -> LicenseAgreement.id; the licensed property this run stages."
        constraints: "MUST reference an existing LicenseAgreement with status == ACTIVE"
      - name: build_kit_id
        type: string
        source: input
        description: "FK -> BuildKit.id; the touring build kit deployed to this run."
        constraints: "MUST reference an existing BuildKit with status == READY"
      - name: run_name
        type: string
        source: input
        description: "Marketing name of the run."
        constraints: "1..120 characters"
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ExperienceProducer that created the run; SoD-3 forbids this same user id from granting its extension."
        constraints: "copied from the X-User-ID header at creation"
      - name: scheduled_open_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) the run is scheduled to admit guests."
        constraints: "ISO calendar date; MUST be >= venue.lease_start_date"
      - name: scheduled_close_date
        type: string
        source: input
        description: "Last calendar date the run is scheduled to admit guests; supplied at creation, then advanced by each granted extension."
        constraints: "ISO calendar date; MUST be > scheduled_open_date and <= venue.lease_end_date at creation"
      - name: base_ticket_price_cents
        type: integer
        source: input
        description: "List price per guest in cents before tier, demand and lead-time multipliers."
        constraints: "1..100000"
      - name: timed_slot_minutes
        type: integer
        source: input
        description: "Nominal timed-entry cadence in minutes; the ONLY duration input to the §1.3 room-throughput term."
        constraints: "15..120"
      - name: max_group_size
        type: integer
        source: input
        description: "Largest party_size permitted on a SINGLE or GROUP order for this run."
        default: 12
        constraints: "1..60"
      - name: effective_capacity
        type: integer
        source: computed
        description: "Result of §1.3 run_effective_capacity; the ceiling on any TimedEntrySlot.base_capacity for this run."
        default: 0
        constraints: ">= 0"
      - name: effective_capacity_cap
        type: integer
        source: computed
        description: "Additional ceiling imposed by a CONDITIONAL SafetyInspection; 0 means no inspection cap is in force."
        default: 0
        constraints: ">= 0"
      - name: royalty_statement_count
        type: integer
        source: computed
        description: "Count of RoyaltyStatement rows ever created against this run; incremented on every statement create, which is what advances this run's version for the OCC guard."
        default: 0
        constraints: ">= 0"
      - name: extension_days_granted
        type: integer
        source: computed
        description: "Cumulative extension days granted to this run."
        default: 0
        constraints: "0..venue.lease_extension_option_days"
      - name: demand_index
        type: number
        source: computed
        description: "Result of §1.3 run_extension_demand_index, 2 decimal places; recomputed on every extension attempt."
        default: 0.00
        constraints: "-50.00..100.00"
      - name: demand_index_at_extension
        type: number
        source: system
        description: "Value of demand_index recorded at the most recently granted extension; null before the first extension."
        default: null
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PLANNED -> OPEN transition; null before opening."
        default: null
      - name: closing_started_at
        type: datetime
        source: system
        description: "Logical-clock instant of the -> CLOSING transition; null before it."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CLOSING -> CLOSED transition; null before it."
        default: null
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical-clock instant clearance_status became SUSPENDED; reset to null when the suspension is lifted."
        default: null
      - name: suspending_inspection_id
        type: string
        source: system
        description: "FK -> SafetyInspection.id; the FAIL inspection that drove clearance_status to SUSPENDED. Reset to null when the suspension is lifted."
        default: null
      - name: run_status
        type: enum
        source: computed
        description: "Operational dimension of the run's parallel state; advanced only by operator/director actions. See §1.2 ExperienceRun dimension run_status."
        default: PLANNED
        constraints: "PLANNED | OPEN | EXTENDED | CLOSING | CLOSED"
      - name: clearance_status
        type: enum
        source: computed
        description: "Compliance dimension of the run's parallel state; advanced only by CreativeSubmission and SafetyInspection side effects plus the lift-suspension action. See §1.2 ExperienceRun dimension clearance_status."
        default: UNCLEARED
        constraints: "UNCLEARED | CLEARED | SUSPENDED"

  - name: ThemedRoom
    parent: null
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run whose guest flow this room belongs to."
        constraints: "MUST reference an existing ExperienceRun with run_status == PLANNED"
      - name: room_sequence
        type: integer
        source: input
        description: "1-based position of the room in the guest flow; unique per run."
        constraints: "1..12; unique across ThemedRoom rows sharing run_id"
      - name: name
        type: string
        source: input
        description: "Room name shown to guests."
        constraints: "1..80 characters"
      - name: room_occupancy_cap
        type: integer
        source: input
        description: "Largest number of guests the room may hold at one instant."
        constraints: "1..400"
      - name: target_dwell_minutes
        type: integer
        source: input
        description: "Designed dwell time per guest group in this room; divisor of the throughput term."
        constraints: "1..120"
      - name: min_dwell_minutes
        type: integer
        source: input
        description: "Shortest dwell the scripted content permits."
        constraints: "1..target_dwell_minutes"
      - name: sensory_intensity_level
        type: integer
        source: input
        description: "Sensory intensity rating, 1 (calm) to 5 (extreme)."
        constraints: "1..5"
      - name: has_quiet_bypass
        type: boolean
        source: input
        description: "Whether a quiet bypass route around this room exists; a QUIET_ROUTE accommodation request requires every room with sensory_intensity_level >= SENSORY_BYPASS_LEVEL to have one."
        default: false
      - name: wheelchair_accessible
        type: boolean
        source: input
        description: "Whether the room is wheelchair accessible; a WHEELCHAIR party requires every room on the run to be accessible."
        default: true
      - name: throughput_per_slot
        type: integer
        source: computed
        description: "floor(room_occupancy_cap * run.timed_slot_minutes / target_dwell_minutes); this room's contribution to the run bottleneck."
        constraints: ">= 0"

  - name: TimedEntrySlot
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run this timed-entry window belongs to."
        constraints: "MUST reference an existing ExperienceRun with run_status IN {PLANNED, OPEN, EXTENDED}"
      - name: slot_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the half-open admission window [slot_start_utc, slot_end_utc)."
        constraints: "ISO 8601 UTC instant ending in Z; fractional seconds optional (zero or three digits); MUST fall on or after 00:00:00 of run.scheduled_open_date"
      - name: slot_end_utc
        type: datetime
        source: input
        description: "Exclusive end of the half-open admission window; a following slot MAY start at exactly this instant."
        constraints: "strictly greater than slot_start_utc; MUST fall on or before 23:59:59.999 of run.scheduled_close_date"
      - name: pricing_tier
        type: enum
        source: input
        description: "Demand tier of this window; selects TIER_MULT in §1.3 slot_dynamic_price."
        default: STANDARD
        constraints: "OFFPEAK | STANDARD | PEAK | PREMIUM"
      - name: base_capacity
        type: integer
        source: input
        description: "Seats designed into this window before release."
        constraints: "1..run.effective_capacity (and <= run.effective_capacity_cap when that value is non-zero)"
      - name: released_capacity
        type: integer
        source: computed
        description: "Seats actually on sale; 0 until the slot is released, then equal to base_capacity."
        default: 0
        constraints: "0 or base_capacity"
      - name: held_capacity
        type: integer
        source: computed
        description: "Seats held by the PENDING orders on this slot; a PENDING PRIVATE_BUYOUT holds the whole released window."
        default: 0
        constraints: "0..released_capacity"
      - name: sold_capacity
        type: integer
        source: computed
        description: "Seats consumed by orders with status IN {CONFIRMED, CHECKED_IN, NO_SHOW}."
        default: 0
        constraints: "0..released_capacity"
      - name: available_capacity
        type: integer
        source: computed
        description: "released_capacity - held_capacity - sold_capacity; conserved-quantity anchor for the buyout hold/release invariant."
        default: 0
        constraints: ">= 0"
      - name: wheelchair_positions
        type: integer
        source: input
        description: "Wheelchair positions designed into this window."
        default: 4
        constraints: "0..base_capacity"
      - name: wheelchair_sold
        type: integer
        source: computed
        description: "Sum of wheelchair_party_count over orders with status IN {CONFIRMED, CHECKED_IN, NO_SHOW} on this slot."
        default: 0
        constraints: "0..wheelchair_positions"
      - name: buyout_order_id
        type: string
        source: system
        description: "FK -> TicketOrder.id; the PRIVATE_BUYOUT order currently holding or owning this window. Null when no buyout is in force."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of the DRAFT -> OPEN transition; null before release."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Slot lifecycle state; see §1.2 TimedEntrySlot."
        default: DRAFT
        constraints: "DRAFT | OPEN | SOLD_OUT | HELD_FOR_BUYOUT | SUSPENDED | CANCELLED | CLOSED_OUT"

  - name: GuestAccount
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Guest email; unique across all GuestAccount rows, compared case-insensitively."
        constraints: "contains exactly one '@'; 5..160 characters; unique (case-insensitive)"
      - name: display_name
        type: string
        source: input
        description: "Name shown on the guest's booking."
        constraints: "1..80 characters"
      - name: loyalty_tier
        type: enum
        source: input
        description: "Loyalty tier; selects LOYALTY_DISCOUNT_PCT in §1.3 ticket_order_total."
        default: VISITOR
        constraints: "VISITOR | MEMBER | PATRON"
      - name: accommodation_profile
        type: array
        source: input
        description: "Standing accommodation needs recorded on the account; informational, the per-order sensory_accommodations array is what is validated."
        default: []
        constraints: "subset of {QUIET_ROUTE, WHEELCHAIR, ASL_INTERPRETER, LOW_STIM_HOURS}, no duplicates"
      - name: experience_credit_cents
        type: integer
        source: computed
        description: "Non-refundable experience credit accumulated from the unrefunded remainder of cancelled orders; the credit leg of the money-conservation invariant."
        default: 0
        constraints: ">= 0"
      - name: no_show_strikes
        type: integer
        source: computed
        description: "Count of orders on this account that reached NO_SHOW."
        default: 0
        constraints: ">= 0"
      - name: visit_count
        type: integer
        source: computed
        description: "Count of orders on this account that reached CHECKED_IN."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Account state; see §1.2 GuestAccount."
        default: ACTIVE
        constraints: "ACTIVE | RESTRICTED"

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - name: slot_id
        type: string
        source: input
        description: "FK -> TimedEntrySlot.id; the timed-entry window this order occupies."
        constraints: "MUST reference an existing TimedEntrySlot"
      - name: run_id
        type: string
        source: computed
        description: "FK -> ExperienceRun.id; copied from the slot's run_id at creation, never client-supplied."
        constraints: "always equals TimedEntrySlot.run_id of slot_id"
      - name: guest_account_id
        type: string
        source: input
        description: "FK -> GuestAccount.id; the purchasing account."
        constraints: "MUST reference an existing GuestAccount with status == ACTIVE; when the caller's role is Guest it MUST equal X-User-ID"
      - name: order_type
        type: enum
        source: input
        description: "Purchase shape; PRIVATE_BUYOUT holds the whole window and prices off BUYOUT_PREMIUM_MULT."
        default: SINGLE
        constraints: "SINGLE | GROUP | PRIVATE_BUYOUT"
      - name: party_size
        type: integer
        source: input
        description: "Number of guests on the order."
        constraints: ">= 1; <= run.max_group_size when order_type IN {SINGLE, GROUP}; MUST equal slot.base_capacity when order_type == PRIVATE_BUYOUT"
      - name: wheelchair_party_count
        type: integer
        source: input
        description: "How many members of the party need a wheelchair position."
        default: 0
        constraints: "0..party_size"
      - name: sensory_accommodations
        type: array
        source: input
        description: "Accommodations requested for this visit; validated against the run's ThemedRoom configuration."
        default: []
        constraints: "subset of {QUIET_ROUTE, WHEELCHAIR, ASL_INTERPRETER, LOW_STIM_HOURS}, no duplicates"
      - name: merch_amount_cents
        type: integer
        source: input
        description: "Pre-purchased merchandise value in cents; feeds the merchandise leg of §1.3 royalty_accrual and is excluded from every ticket discount."
        default: 0
        constraints: "0..500000"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Result of §1.3 slot_dynamic_price, frozen at order creation and never recomputed afterwards."
        constraints: "PRICE_FLOOR_CENTS..PRICE_CEILING_CENTS"
      - name: per_guest_after_loyalty_cents
        type: integer
        source: computed
        description: "unit_price_cents after the loyalty discount, rounded to whole cents BEFORE multiplication by party_size (pinned rounding order)."
        constraints: ">= 0"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Ticket gross before discounts; per_guest_after_loyalty_cents * party_size, or the buyout formula for PRIVATE_BUYOUT."
        constraints: ">= 0"
      - name: group_discount_cents
        type: integer
        source: computed
        description: "Group discount applied to the line subtotal, rounded once."
        default: 0
        constraints: ">= 0"
      - name: companion_waiver_cents
        type: integer
        source: computed
        description: "Accessibility companion waiver: per_guest_after_loyalty_cents * min(wheelchair_party_count, ACCESSIBLE_COMPANION_MAX)."
        default: 0
        constraints: ">= 0"
      - name: discount_cents
        type: integer
        source: computed
        description: "group_discount_cents + companion_waiver_cents."
        default: 0
        constraints: ">= 0"
      - name: net_amount_cents
        type: integer
        source: computed
        description: "max(gross_amount_cents - discount_cents, 0); the amount the guest owes and the anchor of the money-conservation invariant."
        constraints: ">= 0"
      - name: net_collected_cents
        type: integer
        source: computed
        description: "Cents currently held by the operator on this order; set to net_amount_cents on confirm and to 0 once a refund is computed."
        default: 0
        constraints: "0..net_amount_cents"
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cents refunded to the guest's original payment method."
        default: 0
        constraints: "0..net_amount_cents"
      - name: credit_issued_cents
        type: integer
        source: computed
        description: "Unrefunded remainder issued to the guest as experience credit; never forfeited."
        default: 0
        constraints: "0..net_amount_cents"
      - name: refund_pct
        type: number
        source: computed
        description: "Refund fraction selected by §1.3 refund_and_credit_settlement, 2 decimal places."
        default: 0.00
        constraints: "0.00 | 0.50 | 1.00"
      - name: checked_in_at
        type: datetime
        source: system
        description: "Logical-clock instant of the CONFIRMED -> CHECKED_IN transition; null otherwise."
        default: null
      - name: refund_settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of the REFUND_DUE -> REFUNDED transition; null otherwise."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle state; see §1.2 TicketOrder."
        default: PENDING
        constraints: "PENDING | CONFIRMED | CHECKED_IN | NO_SHOW | REFUND_DUE | REFUNDED | CANCELLED"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run this person is staffed to."
        constraints: "MUST reference an existing ExperienceRun with run_status IN {PLANNED, OPEN, EXTENDED}"
      - name: full_name
        type: string
        source: input
        description: "Staff member's name."
        constraints: "1..80 characters"
      - name: staff_role
        type: enum
        source: input
        description: "Craft this person works; selects the REQUIRED_CERTS set in §1.3 staff_readiness_score."
        constraints: "PERFORMER | AMBASSADOR | TECHNICIAN"
      - name: certifications
        type: array
        source: input
        description: "Certifications held; matched against REQUIRED_CERTS[staff_role] to derive cert_coverage_pct."
        default: []
        constraints: "subset of {SCRIPTED_INTERACTION, SENSORY_DEESCALATION, ADA_ASSIST, EVACUATION_MARSHAL, RIGGING, ELECTRICAL}, no duplicates"
      - name: incident_count
        type: integer
        source: input
        description: "Recorded on-floor incidents attributed to this person; drives the readiness penalty term."
        default: 0
        constraints: "0..20"
      - name: training_score
        type: integer
        source: computed
        description: "Highest score submitted through any training record; 0 until the first record."
        default: 0
        constraints: "0..100"
      - name: completed_rehearsal_count
        type: integer
        source: computed
        description: "Cumulative completed scripted-interaction rehearsals."
        default: 0
        constraints: ">= 0"
      - name: scheduled_rehearsal_count
        type: integer
        source: computed
        description: "Cumulative rehearsals booked but not yet completed; counted by the preflight readiness variant only."
        default: 0
        constraints: ">= 0"
      - name: cert_coverage_pct
        type: number
        source: computed
        description: "round_half_up(100 * |certifications INTERSECT REQUIRED_CERTS[staff_role]| / |REQUIRED_CERTS[staff_role]|, 2)."
        default: 0.00
        constraints: "0.00..100.00"
      - name: readiness_score_preflight
        type: number
        source: computed
        description: "Forward-looking variant of §1.3 staff_readiness_score (counts scheduled rehearsals as if completed), 2 decimal places."
        default: 0.00
        constraints: "0.00..100.00"
      - name: readiness_score_audit
        type: number
        source: computed
        description: "Chronological variant of §1.3 staff_readiness_score (completed rehearsals only), 2 decimal places; the ONLY variant the CLEAR gate reads."
        default: 0.00
        constraints: "0.00..100.00"
      - name: status
        type: enum
        source: computed
        description: "Staffing state; see §1.2 StaffMember."
        default: CANDIDATE
        constraints: "CANDIDATE | TRAINING | CLEARED | SUSPENDED | RELEASED"

  - name: StaffShift
    parent: null
    common_fields: true
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the person working this shift."
        constraints: "MUST reference an existing StaffMember with status == CLEARED"
      - name: run_id
        type: string
        source: computed
        description: "FK -> ExperienceRun.id; copied from the staff member's run_id at creation, never client-supplied."
        constraints: "always equals StaffMember.run_id of staff_member_id"
      - name: themed_room_id
        type: string
        source: input
        description: "FK -> ThemedRoom.id; the room this shift is stationed in. Null for BOOTH and ENTRY stations."
        default: null
        constraints: "when non-null MUST reference a ThemedRoom whose run_id equals this shift's run_id"
      - name: shift_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the closed occupation interval [shift_start_utc, shift_end_utc] on the staff member."
        constraints: "ISO 8601 UTC instant ending in Z; fractional seconds optional (zero or three digits)"
      - name: shift_end_utc
        type: datetime
        source: input
        description: "Inclusive end of the closed occupation interval; adjacency is NOT permitted, a REST_BUFFER_MIN gap is required on both sides."
        constraints: "strictly greater than shift_start_utc; duration <= MAX_SHIFT_MINUTES"
      - name: station
        type: enum
        source: input
        description: "Post the person works during the shift."
        default: FLOOR
        constraints: "FLOOR | BOOTH | RIGGING | ENTRY"
      - name: status
        type: enum
        source: computed
        description: "Shift state; see §1.2 StaffShift."
        default: SCHEDULED
        constraints: "SCHEDULED | CANCELLED | COMPLETED"

  - name: SafetyInspection
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run under inspection."
        constraints: "MUST reference an existing ExperienceRun with run_status != CLOSED"
      - name: inspection_type
        type: enum
        source: input
        description: "Compliance dimension inspected."
        constraints: "EGRESS | CAPACITY | ACCESSIBILITY | SENSORY"
      - name: scheduled_for_utc
        type: datetime
        source: input
        description: "Logical-clock instant the inspection is booked for; recorded, not enforced."
        constraints: "ISO 8601 UTC instant ending in Z; fractional seconds optional (zero or three digits)"
      - name: measured_egress_width_cm
        type: number
        source: input
        description: "Egress width actually measured on site; used to derive allowed_occupancy_cap on finalisation."
        default: 0
        constraints: ">= 0"
      - name: findings_count
        type: integer
        source: input
        description: "Number of findings recorded; supplied on the finalise call."
        default: 0
        constraints: "0..200"
      - name: severity
        type: enum
        source: input
        description: "Worst finding severity; supplied on the finalise call."
        default: NONE
        constraints: "NONE | MINOR | MAJOR | CRITICAL"
      - name: outcome
        type: enum
        source: computed
        description: "Verdict recorded at finalisation; null while SCHEDULED."
        default: null
        constraints: "PASS | CONDITIONAL | FAIL"
      - name: findings_note
        type: string
        source: system
        description: "Narrative recorded at finalisation; required when outcome != PASS."
        default: null
      - name: allowed_occupancy_cap
        type: integer
        source: computed
        description: "floor(measured_egress_width_cm / CM_PER_OCCUPANT) at finalisation; becomes run.effective_capacity_cap on a CONDITIONAL outcome."
        default: 0
        constraints: ">= 0"
      - name: finalized_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SafetyOfficer that finalised the inspection; SoD-1 forbids this same user id from lifting the resulting suspension."
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of finalisation; null while SCHEDULED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Inspection state; see §1.2 SafetyInspection."
        default: SCHEDULED
        constraints: "SCHEDULED | FINALIZED | VOIDED"

  - name: BuildKit
    parent: null
    common_fields: true
    fields:
      - name: kit_code
        type: string
        source: input
        description: "Operator-assigned kit code; unique across all BuildKit rows."
        constraints: "1..40 characters, uppercase letters, digits and hyphens only; unique"
      - name: origin_run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run this kit was originally fabricated for, when the kit is a hand-me-down from an earlier tour city. Null for a brand-new kit."
        default: null
        constraints: "when non-null MUST reference an existing ExperienceRun"
      - name: module_count
        type: integer
        source: input
        description: "Number of shippable scenic modules; drives per-module wear and localisation cost."
        constraints: "1..60"
      - name: initial_condition_score
        type: number
        source: input
        description: "Condition score the kit enters service with, 2 decimal places."
        default: 100.00
        constraints: "0.00..100.00"
      - name: condition_score
        type: number
        source: computed
        description: "Current condition, 2 decimal places; decays by §1.3 kit_condition_decay on every run closure."
        constraints: "0.00..100.00"
      - name: reuse_cycle_count
        type: integer
        source: computed
        description: "Number of completed run deployments; also discounts localisation cost."
        default: 0
        constraints: ">= 0"
      - name: refurb_count
        type: integer
        source: computed
        description: "Number of completed refurbishments; at REFURB_CAP the next refurbish call retires the kit instead."
        default: 0
        constraints: "0..REFURB_CAP"
      - name: last_city_code
        type: string
        source: computed
        description: "City code of the most recent venue this kit was struck from; null before the first closure. A change of city adds CITY_MOVE_WEAR."
        default: null
      - name: localization_language
        type: string
        source: input
        description: "BCP-47-ish language tag the kit's signage and audio are localised into."
        constraints: "2..12 characters"
      - name: localization_cost_cents
        type: integer
        source: computed
        description: "Cost booked by the most recent localisation pass; 0 before the first pass."
        default: 0
        constraints: ">= 0"
      - name: localization_status
        type: enum
        source: computed
        description: "Whether the kit's localisation pass is complete. Set to LOCALIZED at creation (a kit is fabricated already localised for its first city), reset to PENDING whenever the kit lands in REFURB_REQUIRED, and set back to LOCALIZED by the localize call."
        default: LOCALIZED
        constraints: "PENDING | LOCALIZED"
      - name: status
        type: enum
        source: computed
        description: "Kit lifecycle state; see §1.2 BuildKit."
        default: READY
        constraints: "READY | DEPLOYED | IN_TRANSIT | REFURB_REQUIRED | RETIRED"

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> ExperienceRun.id; the run whose revenue this statement covers. Also the OCC parent for statement creation."
        constraints: "MUST reference an existing ExperienceRun"
      - name: license_agreement_id
        type: string
        source: computed
        description: "FK -> LicenseAgreement.id; copied from run.license_agreement_id at creation, never client-supplied."
        constraints: "always equals ExperienceRun.license_agreement_id of run_id"
      - name: period_start_date
        type: string
        source: input
        description: "First calendar date of the accrual period (YYYY-MM-DD), inclusive."
        constraints: "ISO calendar date; MUST be >= agreement.term_start_date"
      - name: period_end_date
        type: string
        source: input
        description: "Last calendar date of the accrual period (YYYY-MM-DD), inclusive."
        constraints: "ISO calendar date; MUST be > period_start_date and <= agreement.term_end_date"
      - name: ticket_base_cents
        type: integer
        source: computed
        description: "Ticket revenue base for the variant most recently run; gross under the provisional variant, net collected under the final variant."
        default: 0
        constraints: ">= 0"
      - name: merch_base_cents
        type: integer
        source: computed
        description: "Merchandise revenue base for the variant most recently run."
        default: 0
        constraints: ">= 0"
      - name: provisional_royalty_cents
        type: integer
        source: computed
        description: "Result of the provisional (forward-looking) variant of §1.3 royalty_accrual."
        default: 0
        constraints: ">= 0"
      - name: provisional_royalty_cents_prev
        type: integer
        source: computed
        description: "Value provisional_royalty_cents held immediately before the most recent recompute; the comparison basis for the true-up trigger."
        default: 0
        constraints: ">= 0"
      - name: truedown_cents
        type: integer
        source: computed
        description: "provisional_royalty_cents_prev - provisional_royalty_cents when a recompute strictly lowers the provisional figure; 0 otherwise."
        default: 0
        constraints: ">= 0"
      - name: final_royalty_cents
        type: integer
        source: computed
        description: "Result of the final (chronological) variant of §1.3 royalty_accrual; 0 until the statement is finalised."
        default: 0
        constraints: ">= 0"
      - name: mg_prorated_cents
        type: integer
        source: computed
        description: "Minimum guarantee pro-rated to this period; computed at finalisation only."
        default: 0
        constraints: ">= 0"
      - name: minimum_guarantee_shortfall_cents
        type: integer
        source: computed
        description: "max(mg_prorated_cents - final_royalty_cents, 0); computed at finalisation only."
        default: 0
        constraints: ">= 0"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "final_royalty_cents + minimum_guarantee_shortfall_cents; computed at finalisation only."
        default: 0
        constraints: ">= 0"
      - name: superseded_by_statement_id
        type: string
        source: system
        description: "FK -> RoyaltyStatement.id; set on the older row when a newer statement covering the same (run_id, period_start_date, period_end_date) is created. Null on the newest row."
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of finalisation; null before it."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of settlement; null before it."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Statement state; see §1.2 RoyaltyStatement."
        default: DRAFT
        constraints: "DRAFT | UNDER_TRUEUP | ISSUED | SETTLED | SUPERSEDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: PopupVenue
    initial_state: DRAFT
    terminal_states: [PERMIT_DENIED, LEASE_ENDED]
    transitions:
      - from: DRAFT
        to: PERMIT_UNDER_REVIEW
        trigger: "POST /venues/{venueId}/permit-submissions"
        actor: VenueOpsManager
        preconditions:
          - "venue.status == DRAFT"
          - "venue.requested_occupancy_load <= venue.egress_capacity"
          - "venue.permit_submission_round < PERMIT_ROUND_CAP"
        side_effects:
          - "permit_submission_round += 1"
          - "permit_conditions_note = null"
          - "increments PopupVenue.version by 1"
      - from: PERMIT_UNDER_REVIEW
        to: PERMIT_CONDITIONS
        trigger: "POST /venues/{venueId}/permit-decisions with decision == CONDITIONS"
        actor: SafetyOfficer
        preconditions:
          - "venue.status == PERMIT_UNDER_REVIEW"
          - "note is present and 1..500 characters"
        side_effects:
          - "permit_conditions_note = note"
          - "permitted_occupancy_load stays 0"
          - "increments PopupVenue.version by 1"
      - from: PERMIT_CONDITIONS
        to: PERMIT_UNDER_REVIEW
        trigger: "POST /venues/{venueId}/permit-submissions (resubmission of the corrected package)"
        actor: VenueOpsManager
        preconditions:
          - "venue.status == PERMIT_CONDITIONS"
          - "venue.permit_submission_round < PERMIT_ROUND_CAP"
        side_effects:
          - "permit_submission_round += 1"
          - "permit_conditions_note = null"
          - "increments PopupVenue.version by 1"
        note: "Cycle PERMIT_UNDER_REVIEW -> PERMIT_CONDITIONS -> PERMIT_UNDER_REVIEW; the round counter is the loop's termination condition (PERMIT_ROUND_CAP)."
      - from: PERMIT_UNDER_REVIEW
        to: PERMIT_ISSUED
        trigger: "POST /venues/{venueId}/permit-decisions with decision == ISSUED"
        actor: SafetyOfficer
        preconditions:
          - "venue.status == PERMIT_UNDER_REVIEW"
        side_effects:
          - "permitted_occupancy_load = min(requested_occupancy_load, egress_capacity)"
          - "permit_issued_at = current logical clock instant"
          - "permit_conditions_note = null"
          - "increments PopupVenue.version by 1"
      - from: PERMIT_UNDER_REVIEW
        to: PERMIT_DENIED
        trigger: "POST /venues/{venueId}/permit-decisions with decision == DENIED"
        actor: SafetyOfficer
        preconditions:
          - "venue.status == PERMIT_UNDER_REVIEW"
          - "note is present and 1..500 characters"
        side_effects:
          - "permit_denial_reason = note"
          - "permitted_occupancy_load = 0"
          - "increments PopupVenue.version by 1"
      - from: PERMIT_ISSUED
        to: LEASE_ACTIVE
        trigger: "POST /venues/{venueId}/activate-lease"
        actor: VenueOpsManager
        preconditions:
          - "venue.status == PERMIT_ISSUED"
          - "current logical clock calendar date >= venue.lease_start_date"
        side_effects:
          - "lease_activated_at = current logical clock instant"
          - "increments PopupVenue.version by 1"
      - from: LEASE_ACTIVE
        to: LEASE_ENDED
        trigger: "POST /venues/{venueId}/end-lease"
        actor: VenueOpsManager
        preconditions:
          - "venue.status == LEASE_ACTIVE"
          - "no ExperienceRun with venue_id == venue.id has run_status IN {PLANNED, OPEN, EXTENDED, CLOSING}"
        side_effects:
          - "increments PopupVenue.version by 1"

  - entity: LicenseAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /license-agreements/{agreementId}/activate"
        actor: LicensingManager
        preconditions:
          - "agreement.status == DRAFT"
          - "current logical clock calendar date <= agreement.term_end_date"
        side_effects:
          - "increments LicenseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /license-agreements/{agreementId}/expire"
        actor: LicensingManager
        preconditions:
          - "agreement.status == ACTIVE"
          - "current logical clock calendar date > agreement.term_end_date"
        side_effects:
          - "every CreativeSubmission with license_agreement_id == agreement.id and status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED} -> REJECTED with decision_note = 'AGREEMENT_EXPIRED', decided_at = current logical clock instant, decided_by_user_id = the calling X-User-ID"
          - "open_submission_count = 0"
          - "every ExperienceRun with license_agreement_id == agreement.id and clearance_status == CLEARED -> clearance_status = UNCLEARED (cascade hop caused by the submission rejections above, since the run's approval gate loses its APPROVED scope coverage)"
          - "increments LicenseAgreement.version by 1"

  - entity: CreativeSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /creative-submissions/{submissionId}/start-review"
        actor: LicensorRep
        preconditions:
          - "submission.status == SUBMITTED"
          - "X-User-ID == the agreement's licensor_rep_user_id"
          - "agreement.status == ACTIVE"
        side_effects:
          - "review_started_at = current logical clock instant"
          - "increments CreativeSubmission.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /creative-submissions/{submissionId}/decisions with decision == CHANGES_REQUESTED"
        actor: LicensorRep
        preconditions:
          - "submission.status == IN_REVIEW"
          - "X-User-ID == the agreement's licensor_rep_user_id"
          - "note is present and 1..500 characters"
        side_effects:
          - "change_note = note"
          - "increments CreativeSubmission.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /creative-submissions/{submissionId}/resubmit"
        actor: ExperienceProducer
        preconditions:
          - "submission.status == CHANGES_REQUESTED"
          - "submission.revision_round < REVISION_ROUND_CAP"
          - "agreement.status == ACTIVE"
        side_effects:
          - "revision_round += 1"
          - "resubmitted_at = current logical clock instant"
          - "change_note = null"
          - "increments CreativeSubmission.version by 1"
        note: "Negotiation cycle SUBMITTED -> IN_REVIEW -> CHANGES_REQUESTED -> SUBMITTED; REVISION_ROUND_CAP terminates the loop."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /creative-submissions/{submissionId}/decisions with decision == APPROVED"
        actor: LicensorRep
        preconditions:
          - "submission.status == IN_REVIEW"
          - "X-User-ID == the agreement's licensor_rep_user_id"
          - "SoD-2: X-User-ID != submission.submitted_by_user_id"
        side_effects:
          - "decided_at = current logical clock instant; decided_by_user_id = X-User-ID; decision_note = note"
          - "agreement.open_submission_count -= 1; agreement.approved_submission_count += 1; increments LicenseAgreement.version by 1"
          - "re-derive the run clearance gate for submission.run_id: run.clearance_status = CLEARED when run.clearance_status == UNCLEARED AND every scope in agreement.approval_scopes has at least one CreativeSubmission with the same run_id, that scope and status == APPROVED AND the run has at least one StaffMember with status == CLEARED for each of PERFORMER, AMBASSADOR and TECHNICIAN"
          - "increments CreativeSubmission.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /creative-submissions/{submissionId}/decisions with decision == REJECTED"
        actor: LicensorRep
        preconditions:
          - "submission.status == IN_REVIEW"
          - "X-User-ID == the agreement's licensor_rep_user_id"
          - "SoD-2: X-User-ID != submission.submitted_by_user_id"
          - "note is present and 1..500 characters"
        side_effects:
          - "decided_at = current logical clock instant; decided_by_user_id = X-User-ID; decision_note = note"
          - "agreement.open_submission_count -= 1; increments LicenseAgreement.version by 1"
          - "if run.clearance_status == CLEARED -> run.clearance_status = UNCLEARED (the approval gate loses this scope)"
          - "increments CreativeSubmission.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /creative-submissions creating a newer row with the same (run_id, scope, asset_code)"
        actor: ExperienceProducer
        preconditions:
          - "the older submission's status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED}"
          - "the create call carries a non-stale expected_agreement_version (see §1.2.1 submission-create-stale-agreement)"
        side_effects:
          - "older row: superseded_by_submission_id = the new submission's id; status = SUPERSEDED"
          - "agreement.open_submission_count is unchanged (one row closes, one opens); increments LicenseAgreement.version by 1"
      - from: IN_REVIEW
        to: SUPERSEDED
        trigger: "POST /creative-submissions creating a newer row with the same (run_id, scope, asset_code)"
        actor: ExperienceProducer
        preconditions:
          - "the older submission's status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED}"
        side_effects:
          - "older row: superseded_by_submission_id = the new submission's id; status = SUPERSEDED; review_started_at is preserved"
          - "increments LicenseAgreement.version by 1"
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "POST /creative-submissions creating a newer row with the same (run_id, scope, asset_code)"
        actor: ExperienceProducer
        preconditions:
          - "the older submission's status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED}"
        side_effects:
          - "older row: superseded_by_submission_id = the new submission's id; status = SUPERSEDED"
          - "increments LicenseAgreement.version by 1"

  - entity: ExperienceRun
    state_field: run_status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /experience-runs/{runId}/open"
        actor: ExperienceProducer
        preconditions:
          - "run.run_status == PLANNED"
          - "venue.status == LEASE_ACTIVE  (cross-entity: ExperienceRun -> PopupVenue)"
          - "run.clearance_status == CLEARED"
          - "run.effective_capacity > 0"
          - "at least one TimedEntrySlot with run_id == run.id has status == OPEN"
        side_effects:
          - "opened_at = current logical clock instant"
          - "increments ExperienceRun.version by 1"
      - from: OPEN
        to: EXTENDED
        trigger: "POST /experience-runs/{runId}/extensions"
        actor: ExperienceProducer
        preconditions:
          - "run.run_status IN {OPEN, EXTENDED}"
          - "run.clearance_status == CLEARED"
          - "SoD-3: X-User-ID != run.created_by_user_id"
          - "run_extension_demand_index (recomputed on this call) >= EXTENSION_DEMAND_MIN"
          - "venue.lease_extension_days_consumed + requested_extension_days <= venue.lease_extension_option_days"
        side_effects:
          - "demand_index = run_extension_demand_index result; demand_index_at_extension = demand_index"
          - "scheduled_close_date = scheduled_close_date + requested_extension_days calendar days"
          - "extension_days_granted += requested_extension_days"
          - "venue.lease_extension_days_consumed += requested_extension_days; increments PopupVenue.version by 1"
          - "increments ExperienceRun.version by 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /experience-runs/{runId}/extensions (further extension round)"
        actor: ExperienceProducer
        preconditions:
          - "run.run_status == EXTENDED"
          - "run.clearance_status == CLEARED"
          - "SoD-3: X-User-ID != run.created_by_user_id"
          - "run_extension_demand_index (recomputed on this call) >= EXTENSION_DEMAND_MIN"
          - "venue.lease_extension_days_consumed + requested_extension_days <= venue.lease_extension_option_days"
        side_effects:
          - "same side effects as OPEN -> EXTENDED; the self-loop is bounded by the venue's remaining lease_extension_option_days"
        note: "Cyclic self-loop; the lease flexibility budget on the venue is the termination condition."
      - from: OPEN
        to: CLOSING
        trigger: "POST /experience-runs/{runId}/closure-decisions with decision == START_CLOSING"
        actor: ExperienceProducer
        preconditions:
          - "run.run_status IN {OPEN, EXTENDED}"
        side_effects:
          - "closing_started_at = current logical clock instant"
          - "every TimedEntrySlot with run_id == run.id and status IN {OPEN, SOLD_OUT, HELD_FOR_BUYOUT, SUSPENDED} -> CLOSED_OUT"
          - "every TicketOrder with run_id == run.id and status == PENDING -> CANCELLED with refunded_cents = 0 and credit_issued_cents = 0 (caused by its slot leaving OPEN, not by the run transition itself)"
          - "increments ExperienceRun.version by 1"
      - from: EXTENDED
        to: CLOSING
        trigger: "POST /experience-runs/{runId}/closure-decisions with decision == START_CLOSING"
        actor: ExperienceProducer
        preconditions:
          - "run.run_status == EXTENDED"
        side_effects:
          - "identical to the OPEN -> CLOSING side-effect set"
          - "increments ExperienceRun.version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "POST /experience-runs/{runId}/closure-decisions with decision == CLOSE"
        actor: ExperienceProducer
        preconditions:
          - "run.run_status == CLOSING"
          - "no TicketOrder with run_id == run.id has status IN {CONFIRMED, REFUND_DUE}"
          - "no StaffShift with run_id == run.id has status == SCHEDULED"
        side_effects:
          - "hop 1: closed_at = current logical clock instant; run_status = CLOSED"
          - "hop 2 (caused by hop 1): build_kit.condition_score = kit_condition_decay result; build_kit.reuse_cycle_count += 1; build_kit.last_city_code = venue.city_code; increments BuildKit.version by 1"
          - "hop 3 (caused by hop 2): if the decayed build_kit.condition_score < REFURB_THRESHOLD then build_kit.status = REFURB_REQUIRED, else build_kit.status = IN_TRANSIT"
          - "hop 4 (caused by hop 3, only on the REFURB_REQUIRED branch): build_kit.localization_status = PENDING and build_kit.localization_cost_cents = 0, because a refurbished kit's signage and audio must be localised again"
          - "every StaffMember with run_id == run.id and status IN {CANDIDATE, TRAINING, CLEARED, SUSPENDED} -> RELEASED"
          - "increments ExperienceRun.version by 1"

  - entity: ExperienceRun
    state_field: clearance_status
    initial_state: UNCLEARED
    terminal_states: []
    transitions:
      - from: UNCLEARED
        to: CLEARED
        trigger: "POST /creative-submissions/{submissionId}/decisions with decision == APPROVED, or POST /staff-members/{staffId}/status-decisions with decision == CLEAR — whichever call completes the gate"
        actor: system
        preconditions:
          - "run.clearance_status == UNCLEARED"
          - "every scope in the run's agreement.approval_scopes has at least one CreativeSubmission with this run_id, that scope and status == APPROVED"
          - "the run has at least one StaffMember with status == CLEARED for each of PERFORMER, AMBASSADOR and TECHNICIAN"
        side_effects:
          - "clearance_status = CLEARED"
          - "increments ExperienceRun.version by 1"
        note: "Compound/derived transition: the state is a function of CreativeSubmission and StaffMember rows, re-derived on every change to either."
      - from: CLEARED
        to: UNCLEARED
        trigger: "POST /creative-submissions/{submissionId}/decisions with decision == REJECTED, POST /creative-submissions creating a superseding row, POST /license-agreements/{agreementId}/expire, or POST /staff-members/{staffId}/status-decisions with decision IN {SUSPEND, RELEASE}"
        actor: system
        preconditions:
          - "run.clearance_status == CLEARED"
          - "the gate no longer holds after the triggering change"
        side_effects:
          - "clearance_status = UNCLEARED"
          - "increments ExperienceRun.version by 1"
      - from: CLEARED
        to: SUSPENDED
        trigger: "POST /safety-inspections/{inspectionId}/finalize resolving to outcome == FAIL"
        actor: system
        preconditions:
          - "run.clearance_status IN {UNCLEARED, CLEARED}"
        side_effects:
          - "clearance_status = SUSPENDED; suspended_at = current logical clock instant; suspending_inspection_id = the inspection's id"
          - "see §1.2 SafetyInspection SCHEDULED -> FINALIZED for the full four-hop cascade this drives"
          - "increments ExperienceRun.version by 1"
      - from: UNCLEARED
        to: SUSPENDED
        trigger: "POST /safety-inspections/{inspectionId}/finalize resolving to outcome == FAIL"
        actor: system
        preconditions:
          - "run.clearance_status == UNCLEARED"
        side_effects:
          - "clearance_status = SUSPENDED; suspended_at = current logical clock instant; suspending_inspection_id = the inspection's id"
          - "increments ExperienceRun.version by 1"
      - from: SUSPENDED
        to: CLEARED
        trigger: "POST /experience-runs/{runId}/lift-suspension"
        actor: SafetyOfficer
        preconditions:
          - "run.clearance_status == SUSPENDED"
          - "SoD-1: X-User-ID != the finalized_by_user_id of run.suspending_inspection_id"
          - "a later SafetyInspection with the same inspection_type as the suspending inspection exists with status == FINALIZED and outcome == PASS"
          - "the approval + staffing gate described in UNCLEARED -> CLEARED holds"
        side_effects:
          - "clearance_status = CLEARED; suspended_at = null; suspending_inspection_id = null"
          - "every TimedEntrySlot with run_id == run.id and status == SUSPENDED -> OPEN, then -> SOLD_OUT when its available_capacity == 0 (conditional cascade)"
          - "increments ExperienceRun.version by 1"
      - from: SUSPENDED
        to: UNCLEARED
        trigger: "POST /experience-runs/{runId}/lift-suspension when the approval + staffing gate does NOT hold"
        actor: SafetyOfficer
        preconditions:
          - "run.clearance_status == SUSPENDED"
          - "SoD-1: X-User-ID != the finalized_by_user_id of run.suspending_inspection_id"
          - "a later SafetyInspection with the same inspection_type as the suspending inspection exists with status == FINALIZED and outcome == PASS"
          - "the approval + staffing gate described in UNCLEARED -> CLEARED does NOT hold"
        side_effects:
          - "clearance_status = UNCLEARED; suspended_at = null; suspending_inspection_id = null"
          - "every TimedEntrySlot with run_id == run.id and status == SUSPENDED -> OPEN, then -> SOLD_OUT when its available_capacity == 0"
          - "increments ExperienceRun.version by 1"
        note: "Same trigger, two targets selected by the gate — the non-linear branch of this dimension."

  - entity: TimedEntrySlot
    initial_state: DRAFT
    terminal_states: [CANCELLED, CLOSED_OUT]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /timed-entry-slots/{slotId}/release"
        actor: ExperienceProducer
        preconditions:
          - "slot.status == DRAFT"
          - "run.run_status IN {PLANNED, OPEN, EXTENDED}"
          - "run.clearance_status != SUSPENDED"
          - "slot.base_capacity <= run.effective_capacity"
          - "run.effective_capacity_cap == 0 OR slot.base_capacity <= run.effective_capacity_cap"
        side_effects:
          - "released_capacity = base_capacity; available_capacity = base_capacity; released_at = current logical clock instant"
          - "increments TimedEntrySlot.version by 1"
      - from: OPEN
        to: SOLD_OUT
        trigger: "POST /ticket-orders/{orderId}/confirm driving available_capacity to 0"
        actor: system
        preconditions:
          - "slot.status == OPEN"
          - "released_capacity - held_capacity - sold_capacity == 0 after the confirmation"
        side_effects:
          - "status = SOLD_OUT"
          - "increments TimedEntrySlot.version by 1"
      - from: SOLD_OUT
        to: OPEN
        trigger: "POST /ticket-orders/{orderId}/cancel releasing seats back to the window"
        actor: system
        preconditions:
          - "slot.status == SOLD_OUT"
          - "released_capacity - held_capacity - sold_capacity > 0 after the cancellation"
        side_effects:
          - "status = OPEN"
          - "increments TimedEntrySlot.version by 1"
        note: "OPEN -> SOLD_OUT -> OPEN is the capacity cycle; sold_capacity is the loop variable."
      - from: OPEN
        to: HELD_FOR_BUYOUT
        trigger: "POST /ticket-orders with order_type == PRIVATE_BUYOUT"
        actor: system
        preconditions:
          - "slot.status == OPEN"
          - "slot.sold_capacity == 0"
          - "slot.buyout_order_id == null"
          - "party_size == slot.base_capacity"
        side_effects:
          - "held_capacity = released_capacity; available_capacity = 0; buyout_order_id = the new order's id"
          - "increments TimedEntrySlot.version by 1"
      - from: HELD_FOR_BUYOUT
        to: SOLD_OUT
        trigger: "POST /ticket-orders/{orderId}/confirm on the holding PRIVATE_BUYOUT order"
        actor: system
        preconditions:
          - "slot.status == HELD_FOR_BUYOUT"
          - "slot.buyout_order_id == the confirming order's id"
        side_effects:
          - "held_capacity = 0; sold_capacity = released_capacity; available_capacity = 0"
          - "increments TimedEntrySlot.version by 1"
      - from: HELD_FOR_BUYOUT
        to: OPEN
        trigger: "POST /ticket-orders/{orderId}/cancel on the holding PRIVATE_BUYOUT order"
        actor: system
        preconditions:
          - "slot.status == HELD_FOR_BUYOUT"
          - "slot.buyout_order_id == the cancelling order's id"
        side_effects:
          - "held_capacity = 0; available_capacity = released_capacity - sold_capacity; buyout_order_id = null"
          - "increments TimedEntrySlot.version by 1"
        note: "Compensating pair with OPEN -> HELD_FOR_BUYOUT; released_capacity == held_capacity + sold_capacity + available_capacity must hold before and after."
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /safety-inspections/{inspectionId}/finalize resolving to FAIL or CONDITIONAL, or POST /timed-entry-slots/{slotId}/status-decisions with decision == SUSPEND"
        actor: system
        preconditions:
          - "slot.status IN {OPEN, SOLD_OUT}"
        side_effects:
          - "status = SUSPENDED; released_capacity, held_capacity and sold_capacity are preserved"
          - "increments TimedEntrySlot.version by 1"
      - from: SOLD_OUT
        to: SUSPENDED
        trigger: "POST /safety-inspections/{inspectionId}/finalize resolving to FAIL or CONDITIONAL, or POST /timed-entry-slots/{slotId}/status-decisions with decision == SUSPEND"
        actor: system
        preconditions:
          - "slot.status == SOLD_OUT"
        side_effects:
          - "status = SUSPENDED"
          - "increments TimedEntrySlot.version by 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /experience-runs/{runId}/lift-suspension, or POST /timed-entry-slots/{slotId}/status-decisions with decision == RESUME"
        actor: system
        preconditions:
          - "slot.status == SUSPENDED"
          - "run.clearance_status != SUSPENDED"
          - "slot.base_capacity <= run.effective_capacity AND (run.effective_capacity_cap == 0 OR slot.base_capacity <= run.effective_capacity_cap)"
        side_effects:
          - "status = OPEN, then SOLD_OUT when available_capacity == 0"
          - "increments TimedEntrySlot.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /timed-entry-slots/{slotId}/status-decisions with decision == CANCEL"
        actor: ExperienceProducer
        preconditions:
          - "slot.status IN {DRAFT, OPEN}"
          - "slot.sold_capacity == 0 AND slot.held_capacity == 0"
        side_effects:
          - "released_capacity = 0; available_capacity = 0"
          - "increments TimedEntrySlot.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /timed-entry-slots/{slotId}/status-decisions with decision == CANCEL"
        actor: ExperienceProducer
        preconditions:
          - "slot.status == OPEN"
          - "slot.sold_capacity == 0 AND slot.held_capacity == 0"
        side_effects:
          - "released_capacity = 0; available_capacity = 0"
          - "increments TimedEntrySlot.version by 1"
      - from: OPEN
        to: CLOSED_OUT
        trigger: "POST /timed-entry-slots/{slotId}/status-decisions with decision == CLOSE_OUT, or the run's -> CLOSING transition"
        actor: ExperienceProducer
        preconditions:
          - "slot.status IN {OPEN, SOLD_OUT, HELD_FOR_BUYOUT, SUSPENDED}"
        side_effects:
          - "available_capacity = 0; held_capacity = 0"
          - "increments TimedEntrySlot.version by 1"
      - from: SOLD_OUT
        to: CLOSED_OUT
        trigger: "POST /timed-entry-slots/{slotId}/status-decisions with decision == CLOSE_OUT, or the run's -> CLOSING transition"
        actor: ExperienceProducer
        preconditions:
          - "slot.status == SOLD_OUT"
        side_effects:
          - "available_capacity = 0"
          - "increments TimedEntrySlot.version by 1"
      - from: SUSPENDED
        to: CLOSED_OUT
        trigger: "POST /timed-entry-slots/{slotId}/status-decisions with decision == CLOSE_OUT, or the run's -> CLOSING transition"
        actor: ExperienceProducer
        preconditions:
          - "slot.status == SUSPENDED"
        side_effects:
          - "available_capacity = 0; held_capacity = 0"
          - "increments TimedEntrySlot.version by 1"
      - from: HELD_FOR_BUYOUT
        to: CLOSED_OUT
        trigger: "the run's -> CLOSING transition"
        actor: system
        preconditions:
          - "slot.status == HELD_FOR_BUYOUT"
        side_effects:
          - "held_capacity = 0; available_capacity = 0; the holding PENDING order is CANCELLED"
          - "increments TimedEntrySlot.version by 1"

  - entity: GuestAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /ticket-orders/{orderId}/attendance with decision == NO_SHOW driving no_show_strikes to NO_SHOW_STRIKE_CAP"
        actor: system
        preconditions:
          - "guest.status == ACTIVE"
          - "guest.no_show_strikes + 1 >= NO_SHOW_STRIKE_CAP"
        side_effects:
          - "no_show_strikes += 1; status = RESTRICTED"
          - "increments GuestAccount.version by 1"
        note: "Cumulative rate threshold: the 3rd strike restricts, the 2nd does not."
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /guest-accounts/{guestId}/reinstate"
        actor: GuestServicesAgent
        preconditions:
          - "guest.status == RESTRICTED"
        side_effects:
          - "no_show_strikes = 0; status = ACTIVE"
          - "increments GuestAccount.version by 1"

  - entity: TicketOrder
    initial_state: PENDING
    terminal_states: [CHECKED_IN, NO_SHOW, REFUNDED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /ticket-orders/{orderId}/confirm"
        actor: GuestServicesAgent
        preconditions:
          - "order.status == PENDING"
          - "slot.status == OPEN with available_capacity >= order.party_size, OR slot.status == HELD_FOR_BUYOUT with slot.buyout_order_id == order.id"
          - "run.clearance_status == CLEARED  (cross-entity: TicketOrder -> ExperienceRun)"
          - "guest.status == ACTIVE  (cross-entity: TicketOrder -> GuestAccount)"
          - "slot.wheelchair_sold + order.wheelchair_party_count <= slot.wheelchair_positions"
          - "current logical clock instant < slot.slot_start_utc"
        side_effects:
          - "net_collected_cents = net_amount_cents"
          - "slot.sold_capacity += party_size; slot.wheelchair_sold += wheelchair_party_count; slot.available_capacity = released_capacity - held_capacity - sold_capacity"
          - "slot -> SOLD_OUT when available_capacity reaches 0; increments TimedEntrySlot.version by 1"
          - "increments TicketOrder.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /ticket-orders/{orderId}/cancel"
        actor: Guest
        preconditions:
          - "order.status == PENDING"
          - "when the caller's role is Guest, X-User-ID == order.guest_account_id"
        side_effects:
          - "refund_pct = 0.00; refunded_cents = 0; credit_issued_cents = 0; net_collected_cents = 0 (nothing was ever collected)"
          - "slot.held_capacity -= party_size; slot.available_capacity = released_capacity - held_capacity - sold_capacity; increments TimedEntrySlot.version by 1"
          - "if order_type == PRIVATE_BUYOUT: slot.buyout_order_id = null and slot HELD_FOR_BUYOUT -> OPEN (the hold covered the whole slot, so held_capacity returns to 0)"
          - "increments TicketOrder.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /ticket-orders/{orderId}/attendance with decision == CHECK_IN"
        actor: GuestServicesAgent
        preconditions:
          - "order.status == CONFIRMED"
          - "current logical clock instant >= slot.slot_start_utc"
          - "current logical clock instant <= slot.slot_end_utc plus CHECKIN_GRACE_MIN minutes"
          - "run.clearance_status != SUSPENDED"
        side_effects:
          - "checked_in_at = current logical clock instant"
          - "guest.visit_count += 1; increments GuestAccount.version by 1"
          - "increments TicketOrder.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /ticket-orders/{orderId}/attendance with decision == NO_SHOW"
        actor: GuestServicesAgent
        preconditions:
          - "order.status == CONFIRMED"
          - "current logical clock instant > slot.slot_end_utc plus CHECKIN_GRACE_MIN minutes"
        side_effects:
          - "guest.no_show_strikes += 1; guest -> RESTRICTED when no_show_strikes reaches NO_SHOW_STRIKE_CAP; increments GuestAccount.version by 1"
          - "net_collected_cents is preserved (a no-show forfeits nothing to the guest and refunds nothing)"
          - "increments TicketOrder.version by 1"
      - from: CONFIRMED
        to: REFUND_DUE
        trigger: "POST /ticket-orders/{orderId}/cancel"
        actor: Guest
        preconditions:
          - "order.status == CONFIRMED"
          - "when the caller's role is Guest, X-User-ID == order.guest_account_id"
          - "current logical clock instant < slot.slot_start_utc"
        side_effects:
          - "refund_pct, refunded_cents and credit_issued_cents = refund_and_credit_settlement result (guest-initiated ladder)"
          - "net_collected_cents = 0"
          - "slot.sold_capacity -= party_size; slot.wheelchair_sold -= wheelchair_party_count; slot.available_capacity = released_capacity - held_capacity - sold_capacity; slot SOLD_OUT -> OPEN when available_capacity > 0; increments TimedEntrySlot.version by 1"
          - "increments TicketOrder.version by 1"
      - from: CONFIRMED
        to: REFUND_DUE
        trigger: "POST /safety-inspections/{inspectionId}/finalize resolving to outcome == FAIL (operator-fault cascade hop 4)"
        actor: system
        preconditions:
          - "order.status == CONFIRMED"
          - "order's slot moved OPEN|SOLD_OUT -> SUSPENDED in hop 3 of the same cascade"
        side_effects:
          - "refund_pct = 1.00 regardless of the hours-before ladder (operator-fault override); refunded_cents = net_collected_cents; credit_issued_cents = 0"
          - "net_collected_cents = 0"
          - "slot.sold_capacity and slot.wheelchair_sold are preserved because the slot is SUSPENDED, not resellable"
          - "increments TicketOrder.version by 1"
        note: "Same from/to pair as the guest-initiated cancellation but a different refund_pct rule — the branch is selected by the trigger, not by the order."
      - from: REFUND_DUE
        to: REFUNDED
        trigger: "POST /ticket-orders/{orderId}/settle-refund"
        actor: GuestServicesAgent
        preconditions:
          - "order.status == REFUND_DUE"
        side_effects:
          - "refund_settled_at = current logical clock instant"
          - "guest.experience_credit_cents += order.credit_issued_cents; increments GuestAccount.version by 1"
          - "increments TicketOrder.version by 1"
        note: "Compensation leg: refunded_cents + credit_issued_cents == net_amount_cents for every order that reaches REFUNDED from CONFIRMED."

  - entity: StaffMember
    initial_state: CANDIDATE
    terminal_states: [RELEASED]
    transitions:
      - from: CANDIDATE
        to: TRAINING
        trigger: "POST /staff-members/{staffId}/training-records"
        actor: ExperienceProducer
        preconditions:
          - "staff.status IN {CANDIDATE, TRAINING}"
          - "run.run_status IN {PLANNED, OPEN, EXTENDED}"
        side_effects:
          - "training_score = max(training_score, submitted score)"
          - "completed_rehearsal_count += completed_rehearsals; scheduled_rehearsal_count += scheduled_rehearsals"
          - "cert_coverage_pct, readiness_score_preflight and readiness_score_audit recomputed by staff_readiness_score"
          - "increments StaffMember.version by 1"
      - from: TRAINING
        to: TRAINING
        trigger: "POST /staff-members/{staffId}/training-records (further rehearsal block)"
        actor: ExperienceProducer
        preconditions:
          - "staff.status == TRAINING"
        side_effects:
          - "same side-effect set as CANDIDATE -> TRAINING; both readiness variants are recomputed on every record"
        note: "Self-loop; each record can only raise training_score (max), so the audit score is monotone in training but not in incident_count."
      - from: TRAINING
        to: CLEARED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == CLEAR"
        actor: ExperienceProducer
        preconditions:
          - "staff.status == TRAINING"
          - "staff.readiness_score_audit >= READINESS_CLEAR_MIN  (the audit variant only — readiness_score_preflight is never consulted by this gate)"
          - "staff.incident_count <= INCIDENT_CLEAR_MAX"
        side_effects:
          - "status = CLEARED"
          - "re-derive the run clearance gate: run.clearance_status UNCLEARED -> CLEARED when every approval scope is APPROVED and all three crafts now have a CLEARED member; increments ExperienceRun.version by 1"
          - "increments StaffMember.version by 1"
      - from: CLEARED
        to: SUSPENDED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == SUSPEND"
        actor: SafetyOfficer
        preconditions:
          - "staff.status == CLEARED"
        side_effects:
          - "status = SUSPENDED"
          - "every StaffShift with staff_member_id == staff.id and status == SCHEDULED -> CANCELLED; increments StaffShift.version by 1 for each"
          - "re-derive the run clearance gate: run.clearance_status CLEARED -> UNCLEARED when this run no longer has a CLEARED member of this staff_role; increments ExperienceRun.version by 1"
          - "increments StaffMember.version by 1"
      - from: SUSPENDED
        to: CLEARED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == REINSTATE"
        actor: SafetyOfficer
        preconditions:
          - "staff.status == SUSPENDED"
          - "staff.readiness_score_audit >= READINESS_CLEAR_MIN"
          - "staff.incident_count <= INCIDENT_CLEAR_MAX"
        side_effects:
          - "status = CLEARED"
          - "re-derive the run clearance gate as in TRAINING -> CLEARED"
          - "increments StaffMember.version by 1"
        note: "CLEARED -> SUSPENDED -> CLEARED cycle; incident_count accumulated while suspended can keep the readiness gate shut."
      - from: TRAINING
        to: RELEASED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == RELEASE, or the run's CLOSING -> CLOSED transition"
        actor: ExperienceProducer
        preconditions:
          - "staff.status IN {CANDIDATE, TRAINING, CLEARED, SUSPENDED}"
        side_effects:
          - "status = RELEASED"
          - "every StaffShift with staff_member_id == staff.id and status == SCHEDULED -> CANCELLED"
          - "re-derive the run clearance gate (may drive run.clearance_status CLEARED -> UNCLEARED)"
          - "increments StaffMember.version by 1"
      - from: CLEARED
        to: RELEASED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == RELEASE, or the run's CLOSING -> CLOSED transition"
        actor: ExperienceProducer
        preconditions:
          - "staff.status == CLEARED"
        side_effects:
          - "status = RELEASED"
          - "every StaffShift with staff_member_id == staff.id and status == SCHEDULED -> CANCELLED"
          - "re-derive the run clearance gate (may drive run.clearance_status CLEARED -> UNCLEARED)"
          - "increments StaffMember.version by 1"
      - from: CANDIDATE
        to: RELEASED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == RELEASE"
        actor: ExperienceProducer
        preconditions:
          - "staff.status == CANDIDATE"
        side_effects:
          - "status = RELEASED"
          - "increments StaffMember.version by 1"
      - from: SUSPENDED
        to: RELEASED
        trigger: "POST /staff-members/{staffId}/status-decisions with decision == RELEASE"
        actor: ExperienceProducer
        preconditions:
          - "staff.status == SUSPENDED"
        side_effects:
          - "status = RELEASED"
          - "increments StaffMember.version by 1"

  - entity: StaffShift
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /staff-shifts/{shiftId}/status-decisions with decision == COMPLETE"
        actor: ExperienceProducer
        preconditions:
          - "shift.status == SCHEDULED"
          - "current logical clock instant >= shift.shift_end_utc"
        side_effects:
          - "increments StaffShift.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /staff-shifts/{shiftId}/status-decisions with decision == CANCEL, or the staff member's CLEARED -> SUSPENDED / -> RELEASED transition"
        actor: ExperienceProducer
        preconditions:
          - "shift.status == SCHEDULED"
        side_effects:
          - "increments StaffShift.version by 1"

  - entity: SafetyInspection
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: FINALIZED
        trigger: "POST /safety-inspections/{inspectionId}/finalize"
        actor: SafetyOfficer
        preconditions:
          - "inspection.status == SCHEDULED"
          - "run.run_status != CLOSED"
          - "findings_count == 0 when severity == NONE"
          - "findings_note is present and 1..500 characters when the derived outcome != PASS"
        side_effects:
          - "hop 1: outcome = safety_inspection_outcome result; allowed_occupancy_cap = floor(measured_egress_width_cm / CM_PER_OCCUPANT); finalized_by_user_id = X-User-ID; finalized_at = current logical clock instant; status = FINALIZED"
          - "hop 2 on the FAIL branch (caused by hop 1): run.clearance_status -> SUSPENDED; run.suspended_at = current logical clock instant; run.suspending_inspection_id = inspection.id; increments ExperienceRun.version by 1"
          - "hop 3 on the FAIL branch (caused by hop 2): every TimedEntrySlot with run_id == run.id and status IN {OPEN, SOLD_OUT} -> SUSPENDED"
          - "hop 4 on the FAIL branch (caused by hop 3): every TicketOrder on those now-SUSPENDED slots with status == CONFIRMED -> REFUND_DUE with refund_pct = 1.00, refunded_cents = net_collected_cents, credit_issued_cents = 0, net_collected_cents = 0"
          - "on the CONDITIONAL branch: run.effective_capacity_cap = inspection.allowed_occupancy_cap; run.effective_capacity = min(run.effective_capacity, run.effective_capacity_cap); every TimedEntrySlot with run_id == run.id, status IN {OPEN, SOLD_OUT} and base_capacity > run.effective_capacity_cap -> SUSPENDED; increments ExperienceRun.version by 1"
          - "on the PASS branch: no cross-entity change; the inspection is only recorded"
          - "increments SafetyInspection.version by 1"
        note: "One trigger, three outcome branches with disjoint side-effect sets; the branch is derived by safety_inspection_outcome, never supplied by the client."
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /safety-inspections/{inspectionId}/void"
        actor: SafetyOfficer
        preconditions:
          - "inspection.status == SCHEDULED"
        side_effects:
          - "outcome stays null; allowed_occupancy_cap stays 0"
          - "increments SafetyInspection.version by 1"

  - entity: BuildKit
    initial_state: READY
    terminal_states: [RETIRED]
    transitions:
      - from: READY
        to: DEPLOYED
        trigger: "POST /experience-runs (the run's build_kit_id points at this kit)"
        actor: system
        preconditions:
          - "kit.status == READY"
          - "kit.localization_status == LOCALIZED"
          - "kit.condition_score >= REFURB_THRESHOLD"
        side_effects:
          - "status = DEPLOYED"
          - "increments BuildKit.version by 1"
      - from: DEPLOYED
        to: IN_TRANSIT
        trigger: "POST /experience-runs/{runId}/closure-decisions with decision == CLOSE, decayed condition_score >= REFURB_THRESHOLD"
        actor: system
        preconditions:
          - "kit.status == DEPLOYED"
        side_effects:
          - "condition_score = kit_condition_decay result; reuse_cycle_count += 1; last_city_code = venue.city_code; status = IN_TRANSIT"
          - "increments BuildKit.version by 1"
      - from: DEPLOYED
        to: REFURB_REQUIRED
        trigger: "POST /experience-runs/{runId}/closure-decisions with decision == CLOSE, decayed condition_score < REFURB_THRESHOLD"
        actor: system
        preconditions:
          - "kit.status == DEPLOYED"
        side_effects:
          - "condition_score = kit_condition_decay result; reuse_cycle_count += 1; last_city_code = venue.city_code; status = REFURB_REQUIRED"
          - "localization_status = PENDING; localization_cost_cents = 0"
          - "increments BuildKit.version by 1"
        note: "Same trigger as DEPLOYED -> IN_TRANSIT; the branch is selected by the decayed score against REFURB_THRESHOLD."
      - from: REFURB_REQUIRED
        to: IN_TRANSIT
        trigger: "POST /build-kits/{kitId}/refurbish"
        actor: VenueOpsManager
        preconditions:
          - "kit.status == REFURB_REQUIRED"
          - "kit.refurb_count < REFURB_CAP"
        side_effects:
          - "condition_score = min(condition_score + REFURB_GAIN, 100.00); refurb_count += 1; status = IN_TRANSIT"
          - "increments BuildKit.version by 1"
      - from: REFURB_REQUIRED
        to: RETIRED
        trigger: "POST /build-kits/{kitId}/refurbish when refurb_count == REFURB_CAP"
        actor: VenueOpsManager
        preconditions:
          - "kit.status == REFURB_REQUIRED"
          - "kit.refurb_count == REFURB_CAP"
        side_effects:
          - "status = RETIRED; condition_score is left untouched; refurb_count is left untouched"
          - "increments BuildKit.version by 1"
        note: "Same trigger, different target chosen by the refurb counter — the kit is retired instead of rebuilt once the cap is reached."
      - from: IN_TRANSIT
        to: READY
        trigger: "POST /build-kits/{kitId}/localize"
        actor: VenueOpsManager
        preconditions:
          - "kit.status == IN_TRANSIT"
          - "kit.localization_status == PENDING"
          - "kit.condition_score >= REFURB_THRESHOLD"
        side_effects:
          - "localization_cost_cents = kit_localization_cost result; localization_language = the submitted language; localization_status = LOCALIZED; status = READY"
          - "increments BuildKit.version by 1"

  - entity: RoyaltyStatement
    initial_state: DRAFT
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /royalty-statements/{statementId}/recompute-provisional yielding a value >= provisional_royalty_cents"
        actor: LicensingManager
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "provisional_royalty_cents_prev = provisional_royalty_cents; provisional_royalty_cents = royalty_accrual (provisional variant) result; ticket_base_cents and merch_base_cents refreshed; truedown_cents = 0"
          - "increments RoyaltyStatement.version by 1"
      - from: DRAFT
        to: UNDER_TRUEUP
        trigger: "POST /royalty-statements/{statementId}/recompute-provisional yielding a value < provisional_royalty_cents"
        actor: LicensingManager
        preconditions:
          - "statement.status == DRAFT"
          - "the recomputed provisional value is strictly less than the stored provisional_royalty_cents"
        side_effects:
          - "provisional_royalty_cents_prev = provisional_royalty_cents; provisional_royalty_cents = the lower recomputed value; truedown_cents = provisional_royalty_cents_prev - provisional_royalty_cents; status = UNDER_TRUEUP"
          - "increments RoyaltyStatement.version by 1"
        note: "Same trigger as the DRAFT self-loop; the branch is selected by comparing the recomputed value with the stored one."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /royalty-statements/{statementId}/finalize"
        actor: LicensingManager
        preconditions:
          - "statement.status IN {DRAFT, UNDER_TRUEUP}"
          - "current logical clock calendar date > statement.period_end_date"
          - "agreement.status IN {ACTIVE, EXPIRED}"
        side_effects:
          - "ticket_base_cents and merch_base_cents refreshed from the final variant's input set; final_royalty_cents = royalty_accrual (final variant) result"
          - "mg_prorated_cents, minimum_guarantee_shortfall_cents and amount_due_cents computed; issued_at = current logical clock instant"
          - "increments RoyaltyStatement.version by 1"
      - from: UNDER_TRUEUP
        to: ISSUED
        trigger: "POST /royalty-statements/{statementId}/finalize"
        actor: LicensingManager
        preconditions:
          - "statement.status == UNDER_TRUEUP"
          - "current logical clock calendar date > statement.period_end_date"
        side_effects:
          - "identical to DRAFT -> ISSUED; truedown_cents is preserved as the audit trail of the provisional reduction"
          - "increments RoyaltyStatement.version by 1"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /royalty-statements/{statementId}/settle"
        actor: LicensingManager
        preconditions:
          - "statement.status == ISSUED"
        side_effects:
          - "settled_at = current logical clock instant"
          - "increments RoyaltyStatement.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /royalty-statements creating a newer statement with the same (run_id, period_start_date, period_end_date)"
        actor: LicensingManager
        preconditions:
          - "the older statement's status IN {DRAFT, UNDER_TRUEUP}"
          - "the create call carries a non-stale expected_run_version (see §1.2.1 statement-create-stale-run)"
        side_effects:
          - "older row: superseded_by_statement_id = the new statement's id; status = SUPERSEDED"
          - "run.royalty_statement_count += 1; increments ExperienceRun.version by 1"
      - from: UNDER_TRUEUP
        to: SUPERSEDED
        trigger: "POST /royalty-statements creating a newer statement with the same (run_id, period_start_date, period_end_date)"
        actor: LicensingManager
        preconditions:
          - "the older statement's status == UNDER_TRUEUP"
        side_effects:
          - "older row: superseded_by_statement_id = the new statement's id; status = SUPERSEDED; truedown_cents is preserved"
          - "run.royalty_statement_count += 1; increments ExperienceRun.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: statement-create-stale-run
    parent_entity: ExperienceRun
    write_endpoint: "POST /royalty-statements"
    occ_field: "expected_run_version"
    description: |
      Creating a RoyaltyStatement against an ExperienceRun whose version has
      advanced since the client last read it is rejected. A statement create is
      legitimately allowed to supersede an earlier DRAFT or UNDER_TRUEUP
      statement covering the same period, so a second create is not blocked by
      any state precondition — it would succeed and silently retire a statement
      the caller never saw. The OCC guard on the run's version turns that into a
      deterministic stale-version rejection: the caller must re-read the run
      (whose version was advanced by the first create's royalty_statement_count
      increment) before it may supersede again.
    error_id: ERR_RUN_VERSION_CONFLICT
    http_status: 412

  - rule_id: submission-create-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /creative-submissions"
    occ_field: "expected_agreement_version"
    description: |
      Creating a CreativeSubmission against a LicenseAgreement whose version has
      advanced since the client last read it is rejected. A new submission in an
      existing (run_id, scope, asset_code) family legitimately supersedes the
      open row, so nothing in the state machine stops a caller holding an older
      view of the agreement from retiring a revision it has never inspected.
      The OCC guard on the agreement's version — advanced by every submission
      create, decision and expiry — makes that rejection deterministic.
    error_id: ERR_AGREEMENT_VERSION_CONFLICT
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: slot_dynamic_price
    description: "Per-guest list price for a timed-entry window, frozen onto the order at creation."
    trigger: "POST /ticket-orders (writes TicketOrder.unit_price_cents) and GET /timed-entry-slots/{slotId}/price-quote (read-only preview)"
    algorithm: tiered_pricing
    formula: |
      lead_seconds = slot.slot_start_utc - current logical clock instant
      lead_days    = floor(lead_seconds / 86400)          # integer days, truncated toward zero
      if lead_days >= LEAD_EARLY_DAYS:        lead_mult = LEAD_EARLY_MULT
      elif lead_days >= LEAD_LATE_DAYS:       lead_mult = LEAD_NORMAL_MULT
      else:                                   lead_mult = LEAD_LATE_MULT
      tier_mult = TIER_MULT[slot.pricing_tier]
      raw       = run.base_ticket_price_cents * tier_mult * lead_mult
      unit_price_cents = clamp(round_half_up(raw, 0), PRICE_FLOOR_CENTS, PRICE_CEILING_CENTS)
      # Evaluation order is pinned: the tier multiplier and the lead multiplier are applied to the
      # SAME raw base in one product, then rounded ONCE to whole cents. Rounding after the tier
      # multiplier and again after the lead multiplier is forbidden.
      # unit_price_cents is frozen onto the order at creation and is never recomputed, so moving
      # the clock after creation cannot change an existing order's price.
    input_set: "One TimedEntrySlot row (any status) and its run; no aggregation over other rows."
    constants:
      TIER_MULT_OFFPEAK: 0.80
      TIER_MULT_STANDARD: 1.00
      TIER_MULT_PEAK: 1.30
      TIER_MULT_PREMIUM: 1.60
      LEAD_EARLY_DAYS: 30
      LEAD_EARLY_MULT: 0.90
      LEAD_LATE_DAYS: 7
      LEAD_NORMAL_MULT: 1.00
      LEAD_LATE_MULT: 1.15
      PRICE_FLOOR_CENTS: 1000
      PRICE_CEILING_CENTS: 100000
    precision: "whole cents, round_half_up; multipliers are exact decimals"

  - name: ticket_order_total
    description: "Money owed on a TicketOrder: loyalty discount per guest, group discount on the line, accessibility companion waiver, and the private-buyout premium branch."
    trigger: "POST /ticket-orders (writes per_guest_after_loyalty_cents, gross_amount_cents, group_discount_cents, companion_waiver_cents, discount_cents, net_amount_cents)"
    algorithm: tiered_pricing
    formula: |
      unit = slot_dynamic_price(run, slot)                       # already whole cents
      if order.order_type == PRIVATE_BUYOUT:
          per_guest_after_loyalty_cents = unit                   # loyalty never applies to a buyout
          gross_amount_cents  = round_half_up(unit * order.party_size * BUYOUT_PREMIUM_MULT, 0)
          group_discount_cents = 0
          companion_waiver_cents = 0
      else:
          # PINNED ROUNDING ORDER (mode b): round the per-guest price to whole cents FIRST,
          # then multiply by party_size. Multiplying first and rounding the product afterwards
          # yields a different number of cents and is FORBIDDEN.
          per_guest_after_loyalty_cents =
              round_half_up(unit * (100 - LOYALTY_DISCOUNT_PCT[guest.loyalty_tier]) / 100, 0)
          gross_amount_cents = per_guest_after_loyalty_cents * order.party_size
          if order.order_type == GROUP and order.party_size >= GROUP_DISCOUNT_MIN_PARTY:
              group_discount_cents = round_half_up(gross_amount_cents * GROUP_DISCOUNT_PCT / 100, 0)
          else:
              group_discount_cents = 0
          companion_waiver_cents =
              per_guest_after_loyalty_cents * min(order.wheelchair_party_count, ACCESSIBLE_COMPANION_MAX)
      discount_cents   = group_discount_cents + companion_waiver_cents
      net_amount_cents = max(gross_amount_cents - discount_cents, 0)
      # merch_amount_cents is NEVER discounted and is NOT part of net_amount_cents; it enters
      # only the merchandise leg of royalty_accrual.
    input_set: "One TicketOrder's own request fields plus its slot, run and guest account rows; no aggregation."
    constants:
      LOYALTY_DISCOUNT_PCT_VISITOR: 0
      LOYALTY_DISCOUNT_PCT_MEMBER: 5
      LOYALTY_DISCOUNT_PCT_PATRON: 12
      GROUP_DISCOUNT_MIN_PARTY: 6
      GROUP_DISCOUNT_PCT: 5
      ACCESSIBLE_COMPANION_MAX: 1
      SINGLE_MAX_PARTY: 4
      BUYOUT_PREMIUM_MULT: 1.25
    precision: "whole cents, round_half_up; every intermediate is rounded exactly where the formula says and nowhere else"

  - name: royalty_accrual
    description: "Licensor royalty for one statement period: a ticket leg and a merchandise leg at different basis-point rates, plus the pro-rated minimum guarantee at finalisation."
    trigger: "POST /royalty-statements and POST /royalty-statements/{statementId}/recompute-provisional (provisional variant); POST /royalty-statements/{statementId}/finalize (final variant)"
    algorithm: forward_looking
    formula: |
      period_orders = TicketOrder rows with run_id == statement.run_id whose slot.slot_start_utc
                      calendar date (UTC) is >= statement.period_start_date
                      and <= statement.period_end_date, filtered by variant (see variants)
      ticket_base_cents = SUM over period_orders of the variant's ticket money field
      merch_base_cents  = SUM over period_orders of the variant's merch money field
      royalty = round_half_up(ticket_base_cents * agreement.royalty_rate_bps / 10000, 0)
              + round_half_up(merch_base_cents  * agreement.merch_royalty_rate_bps / 10000, 0)
      # The two legs are rounded SEPARATELY and then added; summing the bases first and rounding
      # once is forbidden.

      # --- finalisation only (evaluation order is pinned in exactly this order) ---
      term_days   = (agreement.term_end_date - agreement.term_start_date) in days + 1
      period_days = (statement.period_end_date - statement.period_start_date) in days + 1
      mg_prorated_cents = round_half_up(agreement.minimum_guarantee_cents * period_days / term_days, 0)
      final_royalty_cents = royalty                        # step 1: the earned figure
      minimum_guarantee_shortfall_cents = max(mg_prorated_cents - final_royalty_cents, 0)  # step 2
      amount_due_cents = final_royalty_cents + minimum_guarantee_shortfall_cents            # step 3
      # amount_due therefore equals max(final_royalty_cents, mg_prorated_cents), but the three
      # stored fields MUST be written in the order above so shortfall is never double counted.
    input_set: |
      Provisional variant: TicketOrder rows with status IN {PENDING, CONFIRMED, CHECKED_IN, NO_SHOW},
      ordered by created_at ASC (the sum is order-insensitive but the replay order is pinned).
      Final variant: TicketOrder rows with status IN {CONFIRMED, CHECKED_IN, NO_SHOW, REFUND_DUE, REFUNDED}
      for the ticket leg and status IN {CHECKED_IN} for the merchandise leg, ordered by created_at ASC.
      CANCELLED and SUPERSEDED rows never enter either variant.
    constants:
      BPS_DIVISOR: 10000
    precision: "whole cents, round_half_up; each leg rounded independently"
    variants:
      - name: provisional
        when: "statement.status IN {DRAFT, UNDER_TRUEUP} — at create and on every recompute-provisional call"
        difference: |
          Counts money the operator EXPECTS: ticket leg = SUM(net_amount_cents) over orders with
          status IN {PENDING, CONFIRMED, CHECKED_IN, NO_SHOW}; merch leg = SUM(merch_amount_cents)
          over the same set. Unpaid PENDING orders are included at face value.
      - name: final
        when: "POST /royalty-statements/{statementId}/finalize — the only call that writes final_royalty_cents"
        difference: |
          Counts money the operator actually HOLDS: ticket leg = SUM(net_collected_cents) over
          orders with status IN {CONFIRMED, CHECKED_IN, NO_SHOW, REFUND_DUE, REFUNDED} (a refunded
          order contributes 0 because its net_collected_cents was zeroed), and merch leg =
          SUM(merch_amount_cents) over orders with status == CHECKED_IN only. Identical order data
          therefore yields a strictly lower figure than the provisional variant whenever any order
          is PENDING, REFUND_DUE, REFUNDED, or CONFIRMED-but-not-CHECKED_IN with merchandise.

  - name: staff_readiness_score
    description: "Weighted readiness score for one StaffMember: training result, certification coverage for the craft, rehearsal completion, minus an incident penalty."
    trigger: "POST /staff-members (initial 0 values), POST /staff-members/{staffId}/training-records (recomputes both variants); read by the TRAINING -> CLEARED and SUSPENDED -> CLEARED gates"
    algorithm: weighted_scoring
    formula: |
      required = REQUIRED_CERTS[staff.staff_role]
      cert_coverage_pct = round_half_up(100 * |staff.certifications INTERSECT required| / |required|, 2)
      counted_rehearsals = variant-specific (see variants)
      rehearsal_pct = min(round_half_up(100 * counted_rehearsals / REHEARSAL_TARGET, 2), 100.00)
      raw = W_TRAINING * staff.training_score
          + W_CERT     * cert_coverage_pct
          + W_REHEARSAL * rehearsal_pct
          - PENALTY_PER_INCIDENT * staff.incident_count
      score = clamp(round_half_up(raw, 2), 0.00, 100.00)
      # The three weighted terms are summed at full precision and rounded ONCE at the end;
      # rounding each term first is forbidden.
    input_set: "One StaffMember row; the certification intersection is against the constant set for that staff_role."
    constants:
      W_TRAINING: 0.40
      W_CERT: 0.35
      W_REHEARSAL: 0.25
      PENALTY_PER_INCIDENT: 5.00
      REHEARSAL_TARGET: 4
      READINESS_CLEAR_MIN: 78.00
      INCIDENT_CLEAR_MAX: 2
      REQUIRED_CERTS_PERFORMER: [SCRIPTED_INTERACTION, SENSORY_DEESCALATION]
      REQUIRED_CERTS_AMBASSADOR: [SCRIPTED_INTERACTION, ADA_ASSIST, EVACUATION_MARSHAL]
      REQUIRED_CERTS_TECHNICIAN: [RIGGING, ELECTRICAL]
    precision: "2 decimal places, round_half_up"
    variants:
      - name: preflight
        when: "written to readiness_score_preflight on every training record; shown to the producer while rostering"
        difference: |
          counted_rehearsals = completed_rehearsal_count + scheduled_rehearsal_count — a booked but
          unworked rehearsal counts as if it were already done, so the roster view is optimistic.
      - name: audit
        when: "written to readiness_score_audit on every training record; the ONLY variant the CLEAR / REINSTATE gate reads"
        difference: |
          counted_rehearsals = completed_rehearsal_count only. Identical training data therefore
          yields a strictly lower figure than the preflight variant whenever
          scheduled_rehearsal_count > 0, and a member can look clearable on the roster view while
          the gate still refuses.

  - name: run_effective_capacity
    description: "Guests admissible per timed slot: the tightest of the permitted occupancy load, the code-derived egress ceiling, the slowest themed room's throughput and any inspection-imposed cap."
    trigger: "POST /themed-rooms and POST /safety-inspections/{inspectionId}/finalize on the CONDITIONAL branch (both write ExperienceRun.effective_capacity)"
    algorithm: constraint_propagation
    formula: |
      rooms = ThemedRoom rows with run_id == run.id            # every room, no status filter (rooms have no status)
      if rooms is empty: reject with ERR_RUN_HAS_NO_ROOMS      # empty-set case is an error, not 0
      for each room:
          room.throughput_per_slot = floor(room.room_occupancy_cap * run.timed_slot_minutes
                                           / room.target_dwell_minutes)
      egress_ceiling = floor(venue.egress_width_cm / CM_PER_OCCUPANT)
      base = min(venue.permitted_occupancy_load,
                 egress_ceiling,
                 min over rooms of room.throughput_per_slot)
      if run.effective_capacity_cap > 0:
          effective_capacity = min(base, run.effective_capacity_cap)
      else:
          effective_capacity = base
      # Nested min over four heterogeneous inputs; the room term is itself a min over a floor.
    input_set: "All ThemedRoom rows of the run (no status filter), plus the run's venue row and the run's own effective_capacity_cap."
    constants:
      CM_PER_OCCUPANT: 2.03
    precision: "integer; every division floors (never rounds) so the ceiling can never be overstated"

  - name: run_extension_demand_index
    description: "Demand score deciding whether a run may buy more lease days: seat utilisation across released windows, penalised by the share of orders that ended in a refund."
    trigger: "POST /experience-runs/{runId}/extensions (writes ExperienceRun.demand_index on success only); GET /experience-runs/{runId}/demand-index returns the same figure read-only and persists nothing"
    algorithm: threshold
    formula: |
      released_slots = TimedEntrySlot rows with run_id == run.id and status IN
                       {OPEN, SOLD_OUT, SUSPENDED, CLOSED_OUT}      # i.e. released_at is not null
      released_total = SUM over released_slots of released_capacity
      sold_total     = SUM over released_slots of sold_capacity
      utilisation_pct = 0.00 if released_total == 0
                        else round_half_up(100 * sold_total / released_total, 2)
      counted_orders  = TicketOrder rows with run_id == run.id and status IN
                        {CONFIRMED, CHECKED_IN, NO_SHOW, REFUND_DUE, REFUNDED}
      refunded_orders = those counted_orders with status IN {REFUND_DUE, REFUNDED}
      refund_share_pct = 0.00 if |counted_orders| == 0
                         else round_half_up(100 * |refunded_orders| / |counted_orders|, 2)
      demand_index = round_half_up(utilisation_pct - REFUND_PENALTY_WEIGHT * refund_share_pct, 2)
      # The extension gate is `demand_index >= EXTENSION_DEMAND_MIN` — exactly 70.00 passes.
    input_set: "TimedEntrySlot rows of the run with status IN {OPEN, SOLD_OUT, SUSPENDED, CLOSED_OUT}; TicketOrder rows of the run with status IN {CONFIRMED, CHECKED_IN, NO_SHOW, REFUND_DUE, REFUNDED}. PENDING and CANCELLED orders and DRAFT/CANCELLED slots are excluded from both terms."
    constants:
      REFUND_PENALTY_WEIGHT: 0.50
      EXTENSION_DEMAND_MIN: 70.00
    precision: "2 decimal places, round_half_up; both component percentages are rounded before the subtraction"

  - name: buildout_allowance_drawdown
    description: "Allocation of one buildout draw across three ordered funding buckets: landlord allowance, kit reuse credit, then operator capital."
    trigger: "POST /venues/{venueId}/buildout-draws (writes allowance_drawn_cents, kit_credit_drawn_cents, operator_capex_cents, buildout_spend_cents)"
    algorithm: waterfall_allocation
    formula: |
      if venue.buildout_spend_cents + draw_amount_cents > venue.buildout_cap_cents:
          reject with ERR_BUILDOUT_CAP_EXCEEDED          # checked BEFORE any bucket is touched
      remaining = draw_amount_cents
      # bucket 1 — landlord allowance
      take1 = min(remaining, venue.buildout_allowance_cents - venue.allowance_drawn_cents)
      venue.allowance_drawn_cents += take1;  remaining -= take1
      # bucket 2 — kit reuse credit
      take2 = min(remaining, venue.kit_reuse_credit_cents - venue.kit_credit_drawn_cents)
      venue.kit_credit_drawn_cents += take2; remaining -= take2
      # bucket 3 — operator capital (uncapped, absorbs the remainder)
      venue.operator_capex_cents += remaining
      venue.buildout_spend_cents += draw_amount_cents
      # INVARIANT (conserved quantity 'buildout money'):
      #   buildout_spend_cents == allowance_drawn_cents + kit_credit_drawn_cents + operator_capex_cents
      # holds after every draw. Bucket order is fixed and never depends on draw size.
    input_set: "The venue's own four cumulative counters plus this call's draw_amount_cents; no aggregation over other rows."
    constants:
      BUCKET_ORDER: [LANDLORD_ALLOWANCE, KIT_REUSE_CREDIT, OPERATOR_CAPEX]
    precision: "whole cents, exact integer arithmetic; no rounding occurs"

  - name: refund_and_credit_settlement
    description: "Split of an already-collected order between a cash refund and non-refundable experience credit, by how long before the slot the cancellation lands."
    trigger: "POST /ticket-orders/{orderId}/cancel on a CONFIRMED order (guest-initiated ladder) and hop 4 of the FAIL cascade of POST /safety-inspections/{inspectionId}/finalize (operator-fault override)"
    algorithm: threshold
    formula: |
      hours_before = (slot.slot_start_utc - current logical clock instant) / 3600   # exact, not floored
      # guest-initiated ladder
      if   hours_before >= REFUND_FULL_HOURS: refund_pct = 1.00
      elif hours_before >= REFUND_HALF_HOURS: refund_pct = 0.50
      else:                                   refund_pct = 0.00
      # operator-fault override: a FAIL inspection cascade sets refund_pct = 1.00 regardless of hours_before
      refunded_cents      = round_half_up(order.net_collected_cents * refund_pct, 0)
      credit_issued_cents = order.net_collected_cents - refunded_cents
      order.net_collected_cents = 0
      # INVARIANT (conserved quantity 'guest money'):
      #   refunded_cents + credit_issued_cents == net_amount_cents for every order that leaves
      #   CONFIRMED by cancellation, and the credit leg lands on the guest only at settle-refund:
      #   guest.experience_credit_cents == SUM(credit_issued_cents) over that guest's REFUNDED orders.
    input_set: "One CONFIRMED TicketOrder row and its slot; the clock position is the only other input."
    constants:
      REFUND_FULL_HOURS: 72
      REFUND_HALF_HOURS: 24
      REFUND_PCT_FULL: 1.00
      REFUND_PCT_HALF: 0.50
      REFUND_PCT_NONE: 0.00
    precision: "whole cents, round_half_up; the credit leg is the exact remainder so no cent is lost"

  - name: kit_condition_decay
    description: "Condition lost by a build kit when a run is struck, including the extra wear of moving the kit to a different tour city."
    trigger: "POST /experience-runs/{runId}/closure-decisions with decision == CLOSE (writes BuildKit.condition_score, reuse_cycle_count, last_city_code)"
    algorithm: decay_function
    formula: |
      moved = (kit.last_city_code is not null AND kit.last_city_code != venue.city_code)
      wear  = round_half_up(BASE_WEAR_PER_CLOSE
                            + PER_MODULE_WEAR * kit.module_count
                            + (CITY_MOVE_WEAR if moved else 0.00), 2)
      kit.condition_score = max(round_half_up(kit.condition_score - wear, 2), 0.00)
      kit.reuse_cycle_count += 1
      kit.last_city_code = venue.city_code
      # The FIRST closure of a brand-new kit never pays CITY_MOVE_WEAR because last_city_code is
      # null; the reset event that restarts the curve is POST /build-kits/{kitId}/refurbish, which
      # adds REFURB_GAIN back (capped at 100.00) without clearing reuse_cycle_count.
    input_set: "One BuildKit row plus the venue row of the closing run; no aggregation."
    constants:
      BASE_WEAR_PER_CLOSE: 4.00
      PER_MODULE_WEAR: 0.30
      CITY_MOVE_WEAR: 9.00
      REFURB_THRESHOLD: 60.00
      REFURB_GAIN: 30.00
      REFURB_CAP: 2
    precision: "2 decimal places, round_half_up; the wear term is rounded once before subtraction"

  - name: kit_localization_cost
    description: "Cost of localising a build kit's signage and audio for the next tour city, discounted by how many run cycles the kit has already served."
    trigger: "POST /build-kits/{kitId}/localize (writes BuildKit.localization_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      gross = LOCALIZATION_BASE_CENTS + LOCALIZATION_PER_MODULE_CENTS * kit.module_count
      cycles = min(kit.reuse_cycle_count, REUSE_DISCOUNT_CYCLE_CAP)
      discount = round_half_up(LOCALIZATION_BASE_CENTS * REUSE_DISCOUNT_PCT_PER_CYCLE * cycles / 100, 0)
      localization_cost_cents = gross - discount
      # The discount is computed off the BASE only, never off the per-module component; the cap on
      # cycles is applied before the multiplication.
    input_set: "One BuildKit row; no aggregation."
    constants:
      LOCALIZATION_BASE_CENTS: 400000
      LOCALIZATION_PER_MODULE_CENTS: 3300
      REUSE_DISCOUNT_PCT_PER_CYCLE: 2.70
      REUSE_DISCOUNT_CYCLE_CAP: 5
    precision: "whole cents, round_half_up on the discount term only"

  - name: safety_inspection_outcome
    description: "Derivation of a finalised inspection's verdict from its type, severity, findings count and measured egress width."
    trigger: "POST /safety-inspections/{inspectionId}/finalize (writes SafetyInspection.outcome and allowed_occupancy_cap)"
    algorithm: threshold
    formula: |
      # Branches are evaluated in exactly this order; the FIRST match wins.
      egress_floor_cm = round_half_up(venue.egress_width_cm * EGRESS_TOLERANCE_PCT / 100, 2)
      1. if inspection.inspection_type == EGRESS and inspection.measured_egress_width_cm < egress_floor_cm:
             outcome = FAIL                       # geometry override beats every severity
      2. elif inspection.severity == CRITICAL:                       outcome = FAIL
      3. elif inspection.severity == MAJOR:
             outcome = FAIL if inspection.findings_count > FINDINGS_MAJOR_MAX else CONDITIONAL
      4. elif inspection.severity == MINOR:
             outcome = CONDITIONAL if inspection.findings_count > FINDINGS_PASS_MAX else PASS
      5. else:  # severity == NONE, and findings_count is validated to be 0
             outcome = PASS
      allowed_occupancy_cap = floor(inspection.measured_egress_width_cm / CM_PER_OCCUPANT)
      # allowed_occupancy_cap is written on EVERY branch; only the CONDITIONAL branch copies it
      # into run.effective_capacity_cap.
    input_set: "One SafetyInspection row plus the venue row reached through run.venue_id; no aggregation."
    constants:
      FINDINGS_PASS_MAX: 2
      FINDINGS_MAJOR_MAX: 5
      EGRESS_TOLERANCE_PCT: 90
      CM_PER_OCCUPANT: 2.03
    precision: "integer for allowed_occupancy_cap (floor); 2 decimal places for egress_floor_cm"

  - name: guest_attendance_posture
    description: "Cumulative attendance counters on a guest account and the strike threshold that restricts the account."
    trigger: "POST /ticket-orders/{orderId}/attendance (writes GuestAccount.visit_count, no_show_strikes and status) and POST /guest-accounts/{guestId}/reinstate (resets no_show_strikes)"
    algorithm: aggregation
    formula: |
      on decision == CHECK_IN:  guest.visit_count += 1
      on decision == NO_SHOW:   guest.no_show_strikes += 1
                                if guest.no_show_strikes >= NO_SHOW_STRIKE_CAP: guest.status = RESTRICTED
      on reinstate:             guest.no_show_strikes = 0; guest.status = ACTIVE
      # Threshold is cumulative and uses >=, so the NO_SHOW_STRIKE_CAP-th strike restricts and the
      # one before it does not. visit_count is never reset.
      # CHECK_IN is admissible in the window
      #   [slot.slot_start_utc, slot.slot_end_utc + CHECKIN_GRACE_MIN minutes]  (both bounds inclusive)
      # and NO_SHOW only strictly after the upper bound of that window.
    input_set: "The counters are maintained incrementally on the guest row; they are never recomputed by scanning orders, so the incremental value and a full recount must agree."
    constants:
      NO_SHOW_STRIKE_CAP: 3
      CHECKIN_GRACE_MIN: 15
    precision: "integer counters"

  - name: staff_shift_occupation_window
    description: "Interval geometry that decides whether a new StaffShift collides with an existing one on the same person: closed intervals plus a mandatory rest buffer on both sides."
    trigger: "POST /staff-shifts (validated before the row is written)"
    algorithm: interval_merge
    formula: |
      new  = [new.shift_start_utc, new.shift_end_utc]                       # CLOSED on both ends
      for each existing StaffShift with staff_member_id == new.staff_member_id and status == SCHEDULED
          (evaluated in created_at ASC order; the first collision found decides the error):
          buffered = [existing.shift_start_utc - REST_BUFFER_MIN minutes,
                      existing.shift_end_utc   + REST_BUFFER_MIN minutes]  # CLOSED on both ends
          if new.shift_start_utc <= buffered.end and buffered.start <= new.shift_end_utc:
              reject with ERR_SHIFT_OVERLAP
      if (new.shift_end_utc - new.shift_start_utc) > MAX_SHIFT_MINUTES minutes:
          reject with ERR_SHIFT_TOO_LONG
      # Closed-interval semantics: touching endpoints COLLIDE, and a gap of exactly
      # REST_BUFFER_MIN minutes still collides (the buffered endpoint is inclusive); the first
      # admissible gap is REST_BUFFER_MIN + 1 minutes. CANCELLED and COMPLETED shifts never collide.
    input_set: "StaffShift rows of the same staff_member_id with status == SCHEDULED, ordered by created_at ASC."
    constants:
      REST_BUFFER_MIN: 30
      MAX_SHIFT_MINUTES: 600
    precision: "whole minutes; instants compared at millisecond resolution"

  - name: slot_overlap_admission_load
    description: "Interval geometry that decides whether a new TimedEntrySlot is admissible on a run: half-open windows where adjacency is fine, constrained by the aggregate seats on sale at any instant."
    trigger: "POST /timed-entry-slots and POST /timed-entry-slots/{slotId}/release (validated before the row is written or released)"
    algorithm: interval_merge
    formula: |
      new = [new.slot_start_utc, new.slot_end_utc)                          # HALF-OPEN
      peers = TimedEntrySlot rows with run_id == new.run_id and status IN {DRAFT, OPEN, SOLD_OUT,
              HELD_FOR_BUYOUT, SUSPENDED}, ordered by slot_start_utc ASC then created_at ASC
      overlapping = peers where new.slot_start_utc < peer.slot_end_utc
                              and peer.slot_start_utc < new.slot_end_utc   # STRICT both sides
      # Adjacency is admissible: a peer that starts exactly at new.slot_end_utc does NOT overlap.
      load = new.base_capacity + SUM over overlapping of peer.base_capacity
      if load > run.effective_capacity:
          reject with ERR_SLOT_OVERLAP_CAPACITY
      # Aggregate-capacity semantics: two overlapping windows are allowed as long as their combined
      # base_capacity fits the run's effective_capacity; a single window may never exceed it either.
    input_set: "TimedEntrySlot rows of the same run with status IN {DRAFT, OPEN, SOLD_OUT, HELD_FOR_BUYOUT, SUSPENDED}, ordered by slot_start_utc ASC then created_at ASC; CANCELLED and CLOSED_OUT peers are excluded."
    constants:
      OVERLAP_BOUNDARY: "half_open_start_inclusive_end_exclusive"
    precision: "instants compared at millisecond resolution; capacities are integers"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
# violated row decides the response, so a request violating rows 90 and 150
# returns row 90's error_id)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-ID header is present and non-blank AND X-User-Role header is present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the X-User-Role value appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: existence
    check: "every id in the request path resolves to a stored row, validated left to right"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_KIT_NOT_FOUND | ERR_STATEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 40
    category: business_constraint
    check: "request body shape: every required input field present; types match; enum values are members of the declared set; numeric values inside the declared range; dates are 10-character ISO calendar dates; datetimes are ISO 8601 UTC instants; arrays contain no duplicates and only declared members"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "every POST and PATCH endpoint"

  - priority: 50
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row, and resolves WITHIN the scope its §1.1 constraint declares: a StaffShift.themed_room_id naming a ThemedRoom whose run_id differs from the shift's own run_id counts as unresolved and is refused with ERR_ROOM_NOT_FOUND, exactly like an id that names nothing"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_KIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /experience-runs, POST /themed-rooms, POST /timed-entry-slots, POST /ticket-orders, POST /creative-submissions, POST /staff-members, POST /staff-shifts, POST /safety-inspections, POST /build-kits, POST /royalty-statements"

  - priority: 55
    category: business_referential
    check: "uniqueness: BuildKit.kit_code is unique across all kits; GuestAccount.email is unique case-insensitively; ThemedRoom.room_sequence is unique within a run"
    error_id: "ERR_DUPLICATE_KIT_CODE | ERR_DUPLICATE_GUEST_EMAIL | ERR_DUPLICATE_ROOM_SEQUENCE"
    http_status: 409
    applies_to: "POST /build-kits, POST /guest-accounts, POST /themed-rooms"

  - priority: 60
    category: business_referential
    check: "the OCC guard of §1.2.1: expected_run_version equals the current ExperienceRun.version (POST /royalty-statements) and expected_agreement_version equals the current LicenseAgreement.version (POST /creative-submissions)"
    error_id: "ERR_RUN_VERSION_CONFLICT | ERR_AGREEMENT_VERSION_CONFLICT"
    http_status: 412
    applies_to: "POST /royalty-statements, POST /creative-submissions"

  - priority: 70
    category: state
    check: "the resource named in the path is in a state from which this transition is declared in §1.2"
    error_id: "ERR_VENUE_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_SUBMISSION_INVALID_STATE | ERR_RUN_INVALID_STATE | ERR_SLOT_INVALID_STATE | ERR_ORDER_INVALID_STATE | ERR_STAFF_INVALID_STATE | ERR_SHIFT_INVALID_STATE | ERR_INSPECTION_INVALID_STATE | ERR_KIT_INVALID_STATE | ERR_STATEMENT_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 80
    category: state
    check: "cross-entity state gates: the run's venue is LEASE_ACTIVE before the run opens; the licence agreement is ACTIVE before a submission is created, resubmitted or a run is created; the run is CLEARED before an order is confirmed; the run is not SUSPENDED before a slot is released or a guest is checked in; the guest account is ACTIVE before an order is created or confirmed; the build kit is READY before a run is created; the staff member is CLEARED before a shift is scheduled; no ExperienceRun on the venue is still PLANNED, OPEN, EXTENDED or CLOSING before that venue's lease is ended"
    error_id: "ERR_VENUE_LEASE_NOT_ACTIVE | ERR_AGREEMENT_NOT_ACTIVE | ERR_RUN_NOT_CLEARED | ERR_RUN_SUSPENDED | ERR_GUEST_RESTRICTED | ERR_KIT_NOT_READY | ERR_STAFF_NOT_CLEARED | ERR_VENUE_HAS_ACTIVE_RUN"
    http_status: 409
    applies_to: "POST /experience-runs, POST /experience-runs/{runId}/open, POST /creative-submissions, POST /creative-submissions/{submissionId}/resubmit, POST /timed-entry-slots/{slotId}/release, POST /ticket-orders, POST /ticket-orders/{orderId}/confirm, POST /ticket-orders/{orderId}/attendance, POST /staff-shifts, POST /venues/{venueId}/end-lease"

  - priority: 90
    category: auth
    check: "identity gates evaluated after state: SoD-1 the X-User-ID lifting a suspension differs from the finalized_by_user_id of the suspending inspection; SoD-2 the X-User-ID deciding a submission differs from its submitted_by_user_id; SoD-3 the X-User-ID granting an extension differs from the run's created_by_user_id; a LicensorRep acts only on agreements whose licensor_rep_user_id equals its X-User-ID; a Guest acts only on orders whose guest_account_id equals its X-User-ID"
    error_id: "ERR_SOD_SUSPENSION_LIFT_SAME_USER | ERR_SOD_APPROVAL_SAME_USER | ERR_SOD_EXTENSION_SAME_USER | ERR_LICENSOR_REP_MISMATCH | ERR_GUEST_OWNERSHIP_MISMATCH"
    http_status: 403
    applies_to: "POST /experience-runs/{runId}/lift-suspension, POST /creative-submissions/{submissionId}/decisions, POST /creative-submissions/{submissionId}/start-review, POST /experience-runs/{runId}/extensions, POST /ticket-orders, POST /ticket-orders/{orderId}/cancel"

  - priority: 100
    category: business_temporal
    check: "interval and calendar bounds: lease_end_date > lease_start_date; term_end_date > term_start_date; scheduled_close_date > scheduled_open_date and <= venue.lease_end_date; slot_end_utc > slot_start_utc and the window lies inside [00:00:00.000 of run.scheduled_open_date, 23:59:59.999 of run.scheduled_close_date]; period_end_date > period_start_date and the period lies inside [agreement.term_start_date, agreement.term_end_date]"
    error_id: "ERR_INVALID_WINDOW | ERR_SLOT_OUTSIDE_RUN_WINDOW | ERR_PERIOD_OUTSIDE_TERM"
    http_status: 422
    applies_to: "POST /venues, POST /license-agreements, POST /experience-runs, POST /timed-entry-slots, POST /staff-shifts, POST /royalty-statements"

  - priority: 105
    category: business_temporal
    check: "clock-position gates: the lease may be activated only on or after lease_start_date; an agreement may be expired only strictly after term_end_date; a check-in lands inside [slot_start_utc, slot_end_utc + CHECKIN_GRACE_MIN (15) minutes]; a no-show is recorded only strictly after that window; a CONFIRMED order may be cancelled only strictly before slot_start_utc; a shift completes only on or after shift_end_utc; a statement finalises only strictly after period_end_date"
    error_id: "ERR_LEASE_START_NOT_REACHED | ERR_TERM_NOT_ENDED | ERR_CHECKIN_WINDOW_CLOSED | ERR_NO_SHOW_TOO_EARLY | ERR_CANCEL_WINDOW_CLOSED | ERR_SHIFT_NOT_ENDED | ERR_PERIOD_NOT_ENDED"
    http_status: 409
    applies_to: "POST /venues/{venueId}/activate-lease, POST /license-agreements/{agreementId}/expire, POST /ticket-orders/{orderId}/attendance, POST /ticket-orders/{orderId}/cancel, POST /staff-shifts/{shiftId}/status-decisions, POST /royalty-statements/{statementId}/finalize"

  - priority: 110
    category: business_temporal
    check: "resource occupation geometry: staff_shift_occupation_window rejects a shift colliding with another SCHEDULED shift of the same person under closed-interval plus REST_BUFFER_MIN arithmetic, and rejects a shift longer than MAX_SHIFT_MINUTES; slot_overlap_admission_load rejects a slot whose base_capacity plus the base_capacity of every half-open-overlapping peer window on the run exceeds run.effective_capacity"
    error_id: "ERR_SHIFT_OVERLAP | ERR_SHIFT_TOO_LONG | ERR_SLOT_OVERLAP_CAPACITY"
    http_status: 409
    applies_to: "POST /staff-shifts, POST /timed-entry-slots, POST /timed-entry-slots/{slotId}/release"

  - priority: 120
    category: business_safety
    check: "accessibility and sensory accommodation: a WHEELCHAIR request requires every ThemedRoom of the run to be wheelchair_accessible; a QUIET_ROUTE request requires every ThemedRoom with sensory_intensity_level >= SENSORY_BYPASS_LEVEL (4) to have has_quiet_bypass == true; an ASL_INTERPRETER request requires at least one StaffMember of the run with status == CLEARED and staff_role == AMBASSADOR; wheelchair_sold + wheelchair_party_count may not exceed the slot's wheelchair_positions; a finalised inspection with severity == NONE may not carry findings_count > 0"
    error_id: "ERR_WHEELCHAIR_ROUTE_UNAVAILABLE | ERR_QUIET_ROUTE_UNAVAILABLE | ERR_ASL_NOT_STAFFED | ERR_WHEELCHAIR_POSITIONS_EXHAUSTED | ERR_SEVERITY_FINDINGS_MISMATCH"
    http_status: 409
    applies_to: "POST /ticket-orders, POST /ticket-orders/{orderId}/confirm, POST /safety-inspections/{inspectionId}/finalize"

  - priority: 130
    category: business_safety
    check: "occupancy and capacity ceilings: a venue's requested_occupancy_load may not exceed its egress_capacity; a slot's base_capacity may not exceed run.effective_capacity nor a non-zero run.effective_capacity_cap; an order's party_size may not exceed run.max_group_size for SINGLE and GROUP nor SINGLE_MAX_PARTY (4) for SINGLE, and must equal slot.base_capacity for PRIVATE_BUYOUT; a confirmation may not consume more than slot.available_capacity; capacity may not be computed for a run with no ThemedRoom rows; a slot carrying sales may not be cancelled"
    error_id: "ERR_OCCUPANCY_ABOVE_EGRESS | ERR_SLOT_CAPACITY_ABOVE_RUN | ERR_PARTY_SIZE_ABOVE_GROUP_MAX | ERR_BUYOUT_PARTY_MISMATCH | ERR_SLOT_CAPACITY_EXCEEDED | ERR_RUN_HAS_NO_ROOMS | ERR_SLOT_HAS_SALES"
    http_status: 409
    applies_to: "POST /venues/{venueId}/permit-submissions, POST /timed-entry-slots, POST /timed-entry-slots/{slotId}/release, POST /timed-entry-slots/{slotId}/status-decisions, POST /ticket-orders, POST /ticket-orders/{orderId}/confirm, POST /themed-rooms"

  - priority: 140
    category: business_constraint
    check: "loop caps and eligibility: permit_submission_round < PERMIT_ROUND_CAP (3); revision_round < REVISION_ROUND_CAP (3); a submission's scope appears in agreement.approval_scopes; the run's venue city_code appears in agreement.territory_city_codes; a staff member clears only with readiness_score_audit >= READINESS_CLEAR_MIN (78.00) and incident_count <= INCIDENT_CLEAR_MAX (2); a kit is deployable only with condition_score >= REFURB_THRESHOLD (60.00) and localization_status == LOCALIZED; a suspension is lifted only when a later FINALIZED inspection of the same inspection_type has outcome == PASS"
    error_id: "ERR_PERMIT_ROUND_CAP | ERR_REVISION_ROUND_CAP | ERR_SCOPE_NOT_IN_AGREEMENT | ERR_CITY_NOT_IN_TERRITORY | ERR_STAFF_READINESS_BELOW_MIN | ERR_STAFF_INCIDENTS_ABOVE_MAX | ERR_KIT_CONDITION_BELOW_THRESHOLD | ERR_INSPECTION_PASS_MISSING"
    http_status: 409
    applies_to: "POST /venues/{venueId}/permit-submissions, POST /creative-submissions, POST /creative-submissions/{submissionId}/resubmit, POST /experience-runs, POST /staff-members/{staffId}/status-decisions, POST /build-kits/{kitId}/localize, POST /experience-runs/{runId}/lift-suspension"

  - priority: 150
    category: business_fiscal
    check: "money and lease budgets, checked last: a buildout draw may not push buildout_spend_cents past buildout_cap_cents; an extension requires run_extension_demand_index >= EXTENSION_DEMAND_MIN (70.00), and this demand floor is evaluated BEFORE the lease budget; only then may an extension not push venue.lease_extension_days_consumed past lease_extension_option_days; a statement create may not supersede a statement whose status is ISSUED, SETTLED or SUPERSEDED"
    error_id: "ERR_BUILDOUT_CAP_EXCEEDED | ERR_LEASE_EXTENSION_EXHAUSTED | ERR_DEMAND_BELOW_THRESHOLD | ERR_STATEMENT_PERIOD_ISSUED"
    http_status: 409
    applies_to: "POST /venues/{venueId}/buildout-draws, POST /experience-runs/{runId}/extensions, POST /royalty-statements"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving surface (logical clock) ---------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; every lead-time, window, grace and expiry rule in this scaffold is evaluated against this clock."
    roles: [VenueOpsManager, LicensingManager, LicensorRep, ExperienceProducer, SafetyOfficer, GuestServicesAgent]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock jumps to to_iso8601; no stored row is touched"]

  # --- PopupVenue -----------------------------------------------------------
  - method: POST
    path: "/venues"
    description: "Register a pop-up venue with its lease term, buildout funding and egress geometry."
    roles: [VenueOpsManager]
    code: 201
    input: [city_code, site_name, lease_start_date, lease_end_date, "lease_extension_option_days?", base_monthly_rent_cents, buildout_allowance_cents, "kit_reuse_credit_cents?", buildout_cap_cents, requested_occupancy_load, egress_width_cm, "sprinklered?"]
    output: PopupVenue
    side_effects:
      - "status = DRAFT, permit_submission_round = 0, permitted_occupancy_load = 0"
      - "egress_capacity = floor(egress_width_cm / CM_PER_OCCUPANT)"
      - "allowance_drawn_cents = 0, kit_credit_drawn_cents = 0, operator_capex_cents = 0, buildout_spend_cents = 0, lease_extension_days_consumed = 0, version = 1"
  - method: GET
    path: "/venues/{venueId}"
    description: "Read one venue."
    roles: [VenueOpsManager, LicensingManager, ExperienceProducer, SafetyOfficer, GuestServicesAgent]
    code: 200
    input: []
    output: PopupVenue
    side_effects: []
  - method: GET
    path: "/venues"
    description: "List venues, filterable by city and lifecycle state."
    roles: [VenueOpsManager, LicensingManager, ExperienceProducer, SafetyOfficer]
    code: 200
    input: ["city_code?", "status?", "limit?", "offset?"]
    output: PopupVenue[]
    side_effects: []
  - method: POST
    path: "/venues/{venueId}/permit-submissions"
    description: "Submit or resubmit the assembly-occupancy permit package to the authority."
    roles: [VenueOpsManager]
    code: 200
    input: ["package_note?"]
    output: PopupVenue
    side_effects:
      - "status DRAFT | PERMIT_CONDITIONS -> PERMIT_UNDER_REVIEW"
      - "permit_submission_round += 1, permit_conditions_note = null"
      - "increments PopupVenue.version by 1"
  - method: POST
    path: "/venues/{venueId}/permit-decisions"
    description: "Record the authority's decision on the pending permit package: ISSUED, CONDITIONS or DENIED."
    roles: [SafetyOfficer]
    code: 200
    input: [decision, "note?"]
    output: PopupVenue
    side_effects:
      - "ISSUED: permitted_occupancy_load = min(requested_occupancy_load, egress_capacity), permit_issued_at = current_utc, status = PERMIT_ISSUED"
      - "CONDITIONS: permit_conditions_note = note, status = PERMIT_CONDITIONS"
      - "DENIED: permit_denial_reason = note, permitted_occupancy_load = 0, status = PERMIT_DENIED"
      - "increments PopupVenue.version by 1"
  - method: POST
    path: "/venues/{venueId}/activate-lease"
    description: "Activate the lease once the permit is issued and the lease start date has arrived on the logical clock."
    roles: [VenueOpsManager]
    code: 200
    input: []
    output: PopupVenue
    side_effects: ["status PERMIT_ISSUED -> LEASE_ACTIVE, lease_activated_at = current_utc", "increments PopupVenue.version by 1"]
  - method: POST
    path: "/venues/{venueId}/end-lease"
    description: "End the lease; permitted only when no ExperienceRun at the venue is still PLANNED, OPEN, EXTENDED or CLOSING."
    roles: [VenueOpsManager]
    code: 200
    input: []
    output: PopupVenue
    side_effects: ["status LEASE_ACTIVE -> LEASE_ENDED", "increments PopupVenue.version by 1"]
  - method: POST
    path: "/venues/{venueId}/buildout-draws"
    description: "Draw buildout money; buildout_allowance_drawdown allocates the amount across the landlord allowance, the kit reuse credit and operator capital in that fixed order."
    roles: [VenueOpsManager]
    code: 200
    input: [draw_amount_cents, "memo?"]
    output: PopupVenue
    side_effects:
      - "buildout_allowance_drawdown writes allowance_drawn_cents, kit_credit_drawn_cents, operator_capex_cents and buildout_spend_cents"
      - "the conserved invariant buildout_spend_cents == allowance_drawn_cents + kit_credit_drawn_cents + operator_capex_cents holds after the call"
      - "increments PopupVenue.version by 1"

  # --- LicenseAgreement -----------------------------------------------------
  - method: POST
    path: "/license-agreements"
    description: "Register an intellectual-property licence with its royalty rates, minimum guarantee, creative approval scopes and licensed territory."
    roles: [LicensingManager]
    code: 201
    input: [licensor_name, ip_title, licensor_rep_user_id, royalty_rate_bps, merch_royalty_rate_bps, minimum_guarantee_cents, approval_scopes, territory_city_codes, term_start_date, term_end_date]
    output: LicenseAgreement
    side_effects: ["status = DRAFT, open_submission_count = 0, approved_submission_count = 0, version = 1"]
  - method: GET
    path: "/license-agreements/{agreementId}"
    description: "Read one licence agreement."
    roles: [LicensingManager, LicensorRep, ExperienceProducer, VenueOpsManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []
  - method: GET
    path: "/license-agreements"
    description: "List licence agreements, filterable by lifecycle state and licensed city."
    roles: [LicensingManager, LicensorRep, ExperienceProducer]
    code: 200
    input: ["status?", "city_code?", "limit?", "offset?"]
    output: LicenseAgreement[]
    side_effects: []
  - method: POST
    path: "/license-agreements/{agreementId}/activate"
    description: "Activate a drafted licence so runs and creative submissions may reference it."
    roles: [LicensingManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["status DRAFT -> ACTIVE", "increments LicenseAgreement.version by 1"]
  - method: POST
    path: "/license-agreements/{agreementId}/expire"
    description: "Expire a licence whose term has ended on the logical clock; open creative submissions are rejected and every run cleared under it loses clearance."
    roles: [LicensingManager]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects:
      - "status ACTIVE -> EXPIRED"
      - "every CreativeSubmission on this agreement with status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED} -> REJECTED with decision_note = 'AGREEMENT_EXPIRED'; increments CreativeSubmission.version by 1 for each"
      - "open_submission_count = 0"
      - "every ExperienceRun on this agreement with clearance_status == CLEARED -> UNCLEARED; increments ExperienceRun.version by 1 for each"
      - "increments LicenseAgreement.version by 1"

  # --- CreativeSubmission ---------------------------------------------------
  - method: POST
    path: "/creative-submissions"
    description: "Submit a creative execution or merchandise asset for licensor approval; a new row in an existing (run_id, scope, asset_code) family supersedes the open one. OCC-guarded on expected_agreement_version."
    roles: [ExperienceProducer]
    code: 201
    input: [license_agreement_id, run_id, scope, asset_code, title, expected_agreement_version]
    output: CreativeSubmission
    side_effects:
      - "status = SUBMITTED, revision_round = 0, submitted_by_user_id = X-User-ID, superseded_by_submission_id = null, version = 1"
      - "any existing CreativeSubmission with the same (run_id, scope, asset_code) and status IN {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED} -> SUPERSEDED with superseded_by_submission_id = the new row's id; increments its version by 1"
      - "open_submission_count += 1 only when no row was superseded; otherwise it is unchanged"
      - "when the superseded row was the only APPROVED-gate holder the run's clearance_status CLEARED -> UNCLEARED; increments ExperienceRun.version by 1"
      - "increments LicenseAgreement.version by 1"
  - method: GET
    path: "/creative-submissions/{submissionId}"
    description: "Read one creative submission."
    roles: [ExperienceProducer, LicensorRep, LicensingManager]
    code: 200
    input: []
    output: CreativeSubmission
    side_effects: []
  - method: GET
    path: "/creative-submissions"
    description: "List creative submissions; the reverse-reachability channel for the agreement, run and supersede links."
    roles: [ExperienceProducer, LicensorRep, LicensingManager]
    code: 200
    input: ["license_agreement_id?", "run_id?", "scope?", "status?", "superseded_by_submission_id?", "limit?", "offset?"]
    output: CreativeSubmission[]
    side_effects: []
  - method: POST
    path: "/creative-submissions/{submissionId}/start-review"
    description: "The licensor representative of record takes a submitted asset into review."
    roles: [LicensorRep]
    code: 200
    input: []
    output: CreativeSubmission
    side_effects: ["status SUBMITTED -> IN_REVIEW, review_started_at = current_utc", "increments CreativeSubmission.version by 1"]
  - method: POST
    path: "/creative-submissions/{submissionId}/decisions"
    description: "Licensor decision on a submission under review: APPROVED, REJECTED or CHANGES_REQUESTED. Segregation of duties forbids the submitter from deciding."
    roles: [LicensorRep]
    code: 200
    input: [decision, "note?"]
    output: CreativeSubmission
    side_effects:
      - "APPROVED: status = APPROVED, decided_at = current_utc, decided_by_user_id = X-User-ID, decision_note = note, agreement.approved_submission_count += 1, agreement.open_submission_count -= 1"
      - "REJECTED: status = REJECTED, decided_at = current_utc, decided_by_user_id = X-User-ID, decision_note = note, agreement.open_submission_count -= 1"
      - "CHANGES_REQUESTED: status = CHANGES_REQUESTED, change_note = note; the agreement counters are untouched"
      - "re-derives run.clearance_status per §1.2 (every scope in agreement.approval_scopes has an APPROVED submission for the run AND at least one CLEARED StaffMember exists for each of PERFORMER, AMBASSADOR and TECHNICIAN); increments ExperienceRun.version by 1 when it changes"
      - "increments CreativeSubmission.version by 1 and LicenseAgreement.version by 1"
  - method: POST
    path: "/creative-submissions/{submissionId}/resubmit"
    description: "The producer resubmits a submission the licensor sent back for changes."
    roles: [ExperienceProducer]
    code: 200
    input: []
    output: CreativeSubmission
    side_effects: ["status CHANGES_REQUESTED -> SUBMITTED, revision_round += 1, resubmitted_at = current_utc, change_note = null", "increments CreativeSubmission.version by 1"]

  # --- ExperienceRun --------------------------------------------------------
  - method: POST
    path: "/experience-runs"
    description: "Create an experience run at a permitted venue under an active licence, deploying a READY and LOCALIZED build kit."
    roles: [ExperienceProducer]
    code: 201
    input: [venue_id, license_agreement_id, build_kit_id, run_name, scheduled_open_date, scheduled_close_date, base_ticket_price_cents, timed_slot_minutes, "max_group_size?"]
    output: ExperienceRun
    side_effects:
      - "run_status = PLANNED, clearance_status = UNCLEARED, created_by_user_id = X-User-ID"
      - "effective_capacity = 0, effective_capacity_cap = 0, extension_days_granted = 0, royalty_statement_count = 0, demand_index = 0.00, version = 1"
      - "the referenced BuildKit status READY -> DEPLOYED; increments BuildKit.version by 1"
  - method: GET
    path: "/experience-runs/{runId}"
    description: "Read one experience run including its derived capacity, clearance and demand fields."
    roles: [ExperienceProducer, VenueOpsManager, LicensingManager, LicensorRep, SafetyOfficer, GuestServicesAgent]
    code: 200
    input: []
    output: ExperienceRun
    side_effects: []
  - method: GET
    path: "/experience-runs"
    description: "List experience runs; the reverse-reachability channel for the venue, agreement, kit and suspending-inspection links."
    roles: [ExperienceProducer, VenueOpsManager, LicensingManager, LicensorRep, SafetyOfficer]
    code: 200
    input: ["venue_id?", "license_agreement_id?", "build_kit_id?", "suspending_inspection_id?", "run_status?", "clearance_status?", "limit?", "offset?"]
    output: ExperienceRun[]
    side_effects: []
  - method: POST
    path: "/experience-runs/{runId}/open"
    description: "Open a run for admission; requires clearance_status == CLEARED and a LEASE_ACTIVE venue."
    roles: [ExperienceProducer]
    code: 200
    input: []
    output: ExperienceRun
    side_effects: ["run_status PLANNED -> OPEN, opened_at = current_utc", "increments ExperienceRun.version by 1"]
  - method: POST
    path: "/experience-runs/{runId}/extensions"
    description: "Extend a run on the strength of demand. run_extension_demand_index is evaluated first and must reach EXTENSION_DEMAND_MIN; the extra days are charged against the venue's lease extension option. Segregation of duties forbids the run's creator from granting the extension."
    roles: [ExperienceProducer]
    code: 200
    input: [requested_extension_days, "memo?"]
    output: ExperienceRun
    side_effects:
      - "demand_index = run_extension_demand_index(run) and demand_index_at_extension = the same figure, written on success only"
      - "run_status OPEN | EXTENDED -> EXTENDED, extension_days_granted += requested_extension_days, scheduled_close_date advances by requested_extension_days calendar days"
      - "venue.lease_extension_days_consumed += requested_extension_days; increments PopupVenue.version by 1"
      - "the conserved invariant venue.lease_extension_days_consumed == SUM of extension_days_granted over the venue's runs holds after the call"
      - "increments ExperienceRun.version by 1"
  - method: POST
    path: "/experience-runs/{runId}/closure-decisions"
    description: "Move a run towards closure: START_CLOSING stops admission and closes out every live slot; CLOSE finishes the run, releases the roster and decays the build kit."
    roles: [ExperienceProducer]
    code: 200
    input: [decision, "memo?"]
    output: ExperienceRun
    side_effects:
      - "START_CLOSING: run_status OPEN | EXTENDED -> CLOSING, closing_started_at = current_utc; every TimedEntrySlot of the run with status IN {OPEN, SOLD_OUT, HELD_FOR_BUYOUT, SUSPENDED} -> CLOSED_OUT; increments each TimedEntrySlot.version by 1"
      - "CLOSE: run_status CLOSING -> CLOSED, closed_at = current_utc; every StaffMember of the run with status IN {CANDIDATE, TRAINING, CLEARED, SUSPENDED} -> RELEASED and each of that member's SCHEDULED StaffShift rows -> CANCELLED"
      - "CLOSE hop 2: kit_condition_decay writes BuildKit.condition_score, reuse_cycle_count and last_city_code"
      - "CLOSE hop 3: BuildKit status DEPLOYED -> IN_TRANSIT when the decayed condition_score >= REFURB_THRESHOLD, otherwise DEPLOYED -> REFURB_REQUIRED"
      - "CLOSE hop 4: on the REFURB_REQUIRED branch only, BuildKit.localization_status = PENDING, which blocks the kit from being deployed to another run until it is refurbished and localized again"
      - "increments ExperienceRun.version by 1 and BuildKit.version by 1"
  - method: POST
    path: "/experience-runs/{runId}/lift-suspension"
    description: "Lift a safety suspension using a later FINALIZED inspection of the same inspection_type whose outcome is PASS. Segregation of duties forbids the officer who finalized the suspending inspection from lifting it."
    roles: [SafetyOfficer]
    code: 200
    input: [clearing_inspection_id, "note?"]
    output: ExperienceRun
    side_effects:
      - "suspending_inspection_id = null, suspended_at = null"
      - "clearance_status SUSPENDED -> CLEARED when the approval-plus-staffing gate holds, otherwise SUSPENDED -> UNCLEARED"
      - "every TimedEntrySlot of the run with status == SUSPENDED and slot_start_utc > current_utc -> OPEN; increments each TimedEntrySlot.version by 1"
      - "increments ExperienceRun.version by 1"
  - method: GET
    path: "/experience-runs/{runId}/demand-index"
    description: "Read-only demand telemetry: the figure run_extension_demand_index would produce right now plus every input that feeds it. Persists nothing and never advances a version."
    roles: [ExperienceProducer, VenueOpsManager, LicensingManager]
    code: 200
    input: []
    output: "{ run_id: string, demand_index: number, utilisation_pct: number, refund_share_pct: number, released_total: integer, sold_total: integer, counted_order_count: integer, refunded_order_count: integer }"
    side_effects: []

  # --- ThemedRoom -----------------------------------------------------------
  - method: POST
    path: "/themed-rooms"
    description: "Add an immutable themed room to a PLANNED run; each room's throughput bounds the run's effective capacity and its sensory and accessibility flags bound which accommodations the run can honour."
    roles: [ExperienceProducer]
    code: 201
    input: [run_id, room_sequence, name, room_occupancy_cap, target_dwell_minutes, min_dwell_minutes, sensory_intensity_level, "has_quiet_bypass?", "wheelchair_accessible?"]
    output: ThemedRoom
    side_effects:
      - "throughput_per_slot = floor(room_occupancy_cap * run.timed_slot_minutes / target_dwell_minutes)"
      - "run_effective_capacity recomputes ExperienceRun.effective_capacity over every room of the run; increments ExperienceRun.version by 1"
      - "ThemedRoom carries no version and no status: there is no update and no delete endpoint"
  - method: GET
    path: "/themed-rooms/{roomId}"
    description: "Read one themed room."
    roles: [ExperienceProducer, SafetyOfficer, GuestServicesAgent, LicensorRep]
    code: 200
    input: []
    output: ThemedRoom
    side_effects: []
  - method: GET
    path: "/themed-rooms"
    description: "List themed rooms; the reverse-reachability channel for the run link."
    roles: [ExperienceProducer, SafetyOfficer, GuestServicesAgent, LicensorRep]
    code: 200
    input: ["run_id?", "limit?", "offset?"]
    output: ThemedRoom[]
    side_effects: []

  # --- TimedEntrySlot -------------------------------------------------------
  - method: POST
    path: "/timed-entry-slots"
    description: "Create a timed-entry slot on a run. slot_overlap_admission_load requires this slot's base_capacity plus the base_capacity of every half-open-overlapping peer to fit run.effective_capacity."
    roles: [ExperienceProducer]
    code: 201
    input: [run_id, slot_start_utc, slot_end_utc, "pricing_tier?", base_capacity, "wheelchair_positions?"]
    output: TimedEntrySlot
    side_effects:
      - "status = DRAFT, released_capacity = 0, held_capacity = 0, sold_capacity = 0, available_capacity = 0, wheelchair_sold = 0, buyout_order_id = null, released_at = null, version = 1"
      - "slot_overlap_admission_load is evaluated against the run's DRAFT, OPEN, SOLD_OUT, HELD_FOR_BUYOUT and SUSPENDED peers"
  - method: GET
    path: "/timed-entry-slots/{slotId}"
    description: "Read one timed-entry slot including its four capacity counters."
    roles: [ExperienceProducer, GuestServicesAgent, SafetyOfficer, Guest]
    code: 200
    input: []
    output: TimedEntrySlot
    side_effects: []
  - method: GET
    path: "/timed-entry-slots"
    description: "List timed-entry slots; the reverse-reachability channel for the run and buyout-order links."
    roles: [ExperienceProducer, GuestServicesAgent, SafetyOfficer, Guest]
    code: 200
    input: ["run_id?", "buyout_order_id?", "status?", "limit?", "offset?"]
    output: TimedEntrySlot[]
    side_effects: []
  - method: POST
    path: "/timed-entry-slots/{slotId}/release"
    description: "Release a drafted slot for sale; the overlap load is re-checked at release because peers may have been added since creation."
    roles: [ExperienceProducer]
    code: 200
    input: []
    output: TimedEntrySlot
    side_effects:
      - "status DRAFT -> OPEN, released_at = current_utc"
      - "released_capacity = base_capacity and available_capacity = base_capacity"
      - "the conserved invariant released_capacity == held_capacity + sold_capacity + available_capacity holds after the call"
      - "increments TimedEntrySlot.version by 1"
  - method: POST
    path: "/timed-entry-slots/{slotId}/status-decisions"
    description: "Administratively move a slot: SUSPEND, RESUME, CANCEL or CLOSE_OUT."
    roles: [ExperienceProducer, SafetyOfficer]
    code: 200
    input: [decision, "note?"]
    output: TimedEntrySlot
    side_effects:
      - "SUSPEND: status OPEN | SOLD_OUT -> SUSPENDED"
      - "RESUME: status SUSPENDED -> OPEN"
      - "CANCEL: status DRAFT | OPEN -> CANCELLED; refused with ERR_SLOT_HAS_SALES when sold_capacity > 0 or held_capacity > 0"
      - "CLOSE_OUT: status OPEN | SOLD_OUT | SUSPENDED -> CLOSED_OUT"
      - "increments TimedEntrySlot.version by 1"
  - method: GET
    path: "/timed-entry-slots/{slotId}/price-quote"
    description: "Read-only price quote for a hypothetical order on this slot: slot_dynamic_price plus the full ticket_order_total breakdown at the current clock position. Persists nothing."
    roles: [ExperienceProducer, GuestServicesAgent, Guest]
    code: 200
    input: ["order_type?", "loyalty_tier?", "party_size?", "wheelchair_party_count?"]
    output: "{ slot_id: string, pricing_tier: string, lead_days: integer, unit_price_cents: integer, per_guest_after_loyalty_cents: integer, gross_amount_cents: integer, group_discount_cents: integer, companion_waiver_cents: integer, discount_cents: integer, net_amount_cents: integer }"
    side_effects: []

  # --- GuestAccount ---------------------------------------------------------
  - method: POST
    path: "/guest-accounts"
    description: "Open a guest account with an optional loyalty tier and sensory-accommodation profile. The returned id is the value a Guest presents as X-User-ID."
    roles: [GuestServicesAgent]
    code: 201
    input: [email, display_name, "loyalty_tier?", "accommodation_profile?"]
    output: GuestAccount
    side_effects: ["status = ACTIVE, no_show_strikes = 0, visit_count = 0, experience_credit_cents = 0, version = 1"]
  - method: GET
    path: "/guest-accounts/{guestId}"
    description: "Read one guest account."
    roles: [GuestServicesAgent, ExperienceProducer, Guest]
    code: 200
    input: []
    output: GuestAccount
    side_effects: []
  - method: PATCH
    path: "/guest-accounts/{guestId}"
    description: "Update a guest's loyalty tier, display name or accommodation profile. Only supplied fields change."
    roles: [GuestServicesAgent]
    code: 200
    input: ["loyalty_tier?", "display_name?", "accommodation_profile?"]
    output: GuestAccount
    side_effects: ["the supplied fields are replaced; omitted fields keep their stored values; already-priced orders are never repriced", "increments GuestAccount.version by 1"]
  - method: POST
    path: "/guest-accounts/{guestId}/reinstate"
    description: "Reinstate a guest restricted for no-show strikes, clearing the strike counter."
    roles: [GuestServicesAgent]
    code: 200
    input: ["note?"]
    output: GuestAccount
    side_effects: ["status RESTRICTED -> ACTIVE, no_show_strikes = 0; visit_count is never reset", "increments GuestAccount.version by 1"]

  # --- TicketOrder ----------------------------------------------------------
  - method: POST
    path: "/ticket-orders"
    description: "Place an order on an OPEN slot: SINGLE, GROUP or PRIVATE_BUYOUT. slot_dynamic_price freezes the unit price at creation and ticket_order_total fixes the money breakdown. A Guest may order only for its own account."
    roles: [Guest, GuestServicesAgent]
    code: 201
    input: [slot_id, guest_account_id, "order_type?", party_size, "wheelchair_party_count?", "sensory_accommodations?", "merch_amount_cents?"]
    output: TicketOrder
    side_effects:
      - "run_id copied from the slot; unit_price_cents = slot_dynamic_price(run, slot), frozen for the life of the order"
      - "ticket_order_total writes per_guest_after_loyalty_cents, gross_amount_cents, group_discount_cents, companion_waiver_cents, discount_cents and net_amount_cents"
      - "status = PENDING, net_collected_cents = 0, refunded_cents = 0, credit_issued_cents = 0, refund_pct = 0.00, version = 1"
      - "slot.held_capacity += party_size and slot.available_capacity -= party_size; increments TimedEntrySlot.version by 1"
      - "PRIVATE_BUYOUT: slot.buyout_order_id = the new order's id and slot status OPEN -> HELD_FOR_BUYOUT"
  - method: GET
    path: "/ticket-orders/{orderId}"
    description: "Read one ticket order including its full money breakdown."
    roles: [GuestServicesAgent, ExperienceProducer, LicensingManager, Guest]
    code: 200
    input: []
    output: TicketOrder
    side_effects: []
  - method: GET
    path: "/ticket-orders"
    description: "List ticket orders; the reverse-reachability channel for the run, slot and guest links."
    roles: [GuestServicesAgent, ExperienceProducer, LicensingManager]
    code: 200
    input: ["run_id?", "slot_id?", "guest_account_id?", "status?", "limit?", "offset?"]
    output: TicketOrder[]
    side_effects: []
  - method: POST
    path: "/ticket-orders/{orderId}/confirm"
    description: "Take payment on a pending order and confirm it; requires a CLEARED run and an ACTIVE guest, and re-checks the accessibility position count."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: TicketOrder
    side_effects:
      - "status PENDING -> CONFIRMED, net_collected_cents = net_amount_cents"
      - "slot.held_capacity -= party_size, slot.sold_capacity += party_size, slot.wheelchair_sold += wheelchair_party_count"
      - "slot status OPEN -> SOLD_OUT when available_capacity reaches 0; HELD_FOR_BUYOUT -> SOLD_OUT on the holding buyout order"
      - "increments TicketOrder.version by 1 and TimedEntrySlot.version by 1"
  - method: POST
    path: "/ticket-orders/{orderId}/attendance"
    description: "Record the guest's arrival posture at the door: CHECK_IN inside the admission window, or NO_SHOW strictly after it. guest_attendance_posture maintains the guest's counters incrementally."
    roles: [GuestServicesAgent]
    code: 200
    input: [decision]
    output: TicketOrder
    side_effects:
      - "CHECK_IN: status CONFIRMED -> CHECKED_IN, checked_in_at = current_utc, guest.visit_count += 1"
      - "NO_SHOW: status CONFIRMED -> NO_SHOW, guest.no_show_strikes += 1, and guest.status ACTIVE -> RESTRICTED once no_show_strikes >= NO_SHOW_STRIKE_CAP"
      - "increments TicketOrder.version by 1 and GuestAccount.version by 1"
  - method: POST
    path: "/ticket-orders/{orderId}/cancel"
    description: "Cancel an order. A PENDING order simply drops its hold; a CONFIRMED order becomes REFUND_DUE at the refund tier its cancellation lead time earns. A Guest may cancel only its own order."
    roles: [Guest, GuestServicesAgent]
    code: 200
    input: ["reason?"]
    output: TicketOrder
    side_effects:
      - "PENDING: status -> CANCELLED, slot.held_capacity -= party_size, slot.available_capacity += party_size"
      - "CONFIRMED: refund_and_credit_settlement fixes refund_pct from the hours remaining before slot_start_utc, status -> REFUND_DUE, slot.sold_capacity -= party_size, slot.available_capacity += party_size, slot.wheelchair_sold -= wheelchair_party_count; slot status SOLD_OUT -> OPEN"
      - "PRIVATE_BUYOUT: slot.buyout_order_id = null and slot status HELD_FOR_BUYOUT | SOLD_OUT -> OPEN"
      - "CONFIRMED: refunded_cents and credit_issued_cents are fixed on THIS call from the pre-call net_collected_cents, then net_collected_cents = 0; the credit only reaches the guest at settle-refund"
      - "increments TicketOrder.version by 1 and TimedEntrySlot.version by 1"
  - method: POST
    path: "/ticket-orders/{orderId}/settle-refund"
    description: "Settle a refund-due order, splitting the collected money into cash refunded at refund_pct and experience credit for the remainder."
    roles: [GuestServicesAgent]
    code: 200
    input: []
    output: TicketOrder
    side_effects:
      - "refunded_cents and credit_issued_cents are NOT recomputed here — they were fixed when the order entered REFUND_DUE (by cancel or by the FAIL cascade) and net_collected_cents is already 0"
      - "status REFUND_DUE -> REFUNDED, refund_settled_at = current_utc"
      - "guest.experience_credit_cents += credit_issued_cents; increments GuestAccount.version by 1"
      - "the conserved invariant refunded_cents + credit_issued_cents == net_amount_cents holds after the call, and guest.experience_credit_cents equals the SUM of credit_issued_cents over that guest's REFUNDED orders"
      - "increments TicketOrder.version by 1"

  # --- StaffMember ----------------------------------------------------------
  - method: POST
    path: "/staff-members"
    description: "Enrol a performer, guest ambassador or technician on a run with the certifications they already hold."
    roles: [ExperienceProducer]
    code: 201
    input: [run_id, full_name, staff_role, "certifications?", "incident_count?"]
    output: StaffMember
    side_effects: ["status = CANDIDATE, training_score = 0, completed_rehearsal_count = 0, scheduled_rehearsal_count = 0, cert_coverage_pct = 0.00, readiness_score_preflight = 0.00, readiness_score_audit = 0.00, version = 1"]
  - method: GET
    path: "/staff-members/{staffId}"
    description: "Read one staff member including both readiness variants."
    roles: [ExperienceProducer, SafetyOfficer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: GET
    path: "/staff-members"
    description: "List staff members; the reverse-reachability channel for the run link."
    roles: [ExperienceProducer, SafetyOfficer]
    code: 200
    input: ["run_id?", "staff_role?", "status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []
  - method: POST
    path: "/staff-members/{staffId}/training-records"
    description: "Post a scripted-interaction training result, the rehearsal counts and any incident charge; both readiness variants are recomputed from the new figures."
    roles: [ExperienceProducer]
    code: 200
    input: [training_score, "completed_rehearsal_count?", "scheduled_rehearsal_count?", "incident_delta?"]
    output: StaffMember
    side_effects:
      - "training_score is replaced; completed_rehearsal_count and scheduled_rehearsal_count are replaced when supplied; incident_count += incident_delta"
      - "staff_readiness_score writes cert_coverage_pct, readiness_score_preflight (scheduled rehearsals count) and readiness_score_audit (completed rehearsals only)"
      - "status CANDIDATE -> TRAINING, or TRAINING -> TRAINING on a further rehearsal block"
      - "increments StaffMember.version by 1"
  - method: POST
    path: "/staff-members/{staffId}/status-decisions"
    description: "Move a staff member: CLEAR (gated on readiness_score_audit and incident_count), SUSPEND, REINSTATE or RELEASE."
    roles: [ExperienceProducer, SafetyOfficer]
    code: 200
    input: [decision, "note?"]
    output: StaffMember
    side_effects:
      - "CLEAR: status TRAINING -> CLEARED, permitted only when readiness_score_audit >= READINESS_CLEAR_MIN and incident_count <= INCIDENT_CLEAR_MAX"
      - "SUSPEND: status CLEARED -> SUSPENDED; every SCHEDULED StaffShift of this member -> CANCELLED; increments each StaffShift.version by 1"
      - "REINSTATE: status SUSPENDED -> CLEARED, gated on the same readiness figures as CLEAR"
      - "RELEASE: status CANDIDATE | TRAINING | CLEARED | SUSPENDED -> RELEASED; every SCHEDULED StaffShift of this member -> CANCELLED"
      - "re-derives run.clearance_status because the gate requires at least one CLEARED member of each staff_role; increments ExperienceRun.version by 1 when it changes"
      - "increments StaffMember.version by 1"

  # --- StaffShift -----------------------------------------------------------
  - method: POST
    path: "/staff-shifts"
    description: "Schedule a shift for a CLEARED staff member, optionally stationed in a themed room. staff_shift_occupation_window enforces the rest buffer and the maximum shift length."
    roles: [ExperienceProducer]
    code: 201
    input: [staff_member_id, "themed_room_id?", shift_start_utc, shift_end_utc, "station?"]
    output: StaffShift
    side_effects:
      - "staff_shift_occupation_window compares the request against the member's SCHEDULED shifts under closed-interval plus REST_BUFFER_MIN arithmetic"
      - "status = SCHEDULED, run_id copied from the staff member, version = 1"
  - method: GET
    path: "/staff-shifts/{shiftId}"
    description: "Read one staff shift."
    roles: [ExperienceProducer, SafetyOfficer]
    code: 200
    input: []
    output: StaffShift
    side_effects: []
  - method: GET
    path: "/staff-shifts"
    description: "List staff shifts; the reverse-reachability channel for the staff-member, run and themed-room links."
    roles: [ExperienceProducer, SafetyOfficer]
    code: 200
    input: ["staff_member_id?", "run_id?", "themed_room_id?", "status?", "limit?", "offset?"]
    output: StaffShift[]
    side_effects: []
  - method: POST
    path: "/staff-shifts/{shiftId}/status-decisions"
    description: "Move a scheduled shift: COMPLETE (only on or after shift_end_utc) or CANCEL."
    roles: [ExperienceProducer]
    code: 200
    input: [decision, "note?"]
    output: StaffShift
    side_effects:
      - "COMPLETE: status SCHEDULED -> COMPLETED"
      - "CANCEL: status SCHEDULED -> CANCELLED; a CANCELLED shift no longer blocks a later shift's rest buffer"
      - "increments StaffShift.version by 1"

  # --- SafetyInspection -----------------------------------------------------
  - method: POST
    path: "/safety-inspections"
    description: "Book an EGRESS, CAPACITY, SENSORY or ACCESSIBILITY inspection for a run."
    roles: [SafetyOfficer]
    code: 201
    input: [run_id, inspection_type, scheduled_for_utc]
    output: SafetyInspection
    side_effects: ["status = SCHEDULED, outcome = null, findings_count = 0, measured_egress_width_cm = 0, severity = NONE, allowed_occupancy_cap = 0, version = 1"]
  - method: GET
    path: "/safety-inspections/{inspectionId}"
    description: "Read one safety inspection including its derived outcome and occupancy cap."
    roles: [SafetyOfficer, ExperienceProducer, VenueOpsManager]
    code: 200
    input: []
    output: SafetyInspection
    side_effects: []
  - method: GET
    path: "/safety-inspections"
    description: "List safety inspections; the reverse-reachability channel for the run link."
    roles: [SafetyOfficer, ExperienceProducer, VenueOpsManager]
    code: 200
    input: ["run_id?", "inspection_type?", "status?", "limit?", "offset?"]
    output: SafetyInspection[]
    side_effects: []
  - method: POST
    path: "/safety-inspections/{inspectionId}/finalize"
    description: "Record the inspector's egress measurement, findings count and severity. safety_inspection_outcome derives the outcome — it is never supplied — and the outcome drives the cascade."
    roles: [SafetyOfficer]
    code: 200
    input: [measured_egress_width_cm, "findings_count?", severity, "findings_note?"]
    output: SafetyInspection
    side_effects:
      - "status SCHEDULED -> FINALIZED, finalized_by_user_id = X-User-ID, finalized_at = current_utc"
      - "safety_inspection_outcome writes outcome and allowed_occupancy_cap on every branch"
      - "PASS: no cascade; run.effective_capacity and run.effective_capacity_cap are untouched"
      - "CONDITIONAL: run.effective_capacity_cap = allowed_occupancy_cap, run_effective_capacity recomputes run.effective_capacity, and every TimedEntrySlot of the run with status IN {OPEN, SOLD_OUT} -> SUSPENDED"
      - "FAIL hop 2: run.clearance_status -> SUSPENDED with suspending_inspection_id = this inspection and suspended_at = current_utc"
      - "FAIL hop 3: every TimedEntrySlot of the run with status IN {OPEN, SOLD_OUT, HELD_FOR_BUYOUT} -> SUSPENDED"
      - "FAIL hop 4: every CONFIRMED TicketOrder on those slots -> REFUND_DUE with refund_pct = 1.00 regardless of hours remaining, refunded_cents = net_collected_cents, credit_issued_cents = 0, net_collected_cents = 0; slot.sold_capacity, slot.available_capacity and slot.wheelchair_sold are PRESERVED because a SUSPENDED slot is not resellable"
      - "increments SafetyInspection.version by 1, ExperienceRun.version by 1, and each touched TimedEntrySlot.version and TicketOrder.version by 1"
  - method: POST
    path: "/safety-inspections/{inspectionId}/void"
    description: "Void a scheduled inspection that will not be carried out; a voided inspection can never clear a suspension."
    roles: [SafetyOfficer]
    code: 200
    input: ["note?"]
    output: SafetyInspection
    side_effects: ["status SCHEDULED -> VOIDED, findings_note = note; outcome stays null", "increments SafetyInspection.version by 1"]

  # --- BuildKit -------------------------------------------------------------
  - method: POST
    path: "/build-kits"
    description: "Register a reusable build kit, optionally derived from the modules of an earlier run, ready and localized for its first city."
    roles: [VenueOpsManager]
    code: 201
    input: [kit_code, "origin_run_id?", module_count, "initial_condition_score?", localization_language]
    output: BuildKit
    side_effects:
      - "condition_score = initial_condition_score, status = READY, localization_status = LOCALIZED"
      - "reuse_cycle_count = 0, refurb_count = 0, last_city_code = null, localization_cost_cents = 0, version = 1"
  - method: GET
    path: "/build-kits/{kitId}"
    description: "Read one build kit including its condition score and localization posture."
    roles: [VenueOpsManager, ExperienceProducer, LicensingManager]
    code: 200
    input: []
    output: BuildKit
    side_effects: []
  - method: GET
    path: "/build-kits"
    description: "List build kits; the reverse-reachability channel for the origin-run link."
    roles: [VenueOpsManager, ExperienceProducer, LicensingManager]
    code: 200
    input: ["origin_run_id?", "status?", "localization_status?", "limit?", "offset?"]
    output: BuildKit[]
    side_effects: []
  - method: POST
    path: "/build-kits/{kitId}/refurbish"
    description: "Refurbish a kit that closed out below the condition threshold; a kit that has exhausted its refurbishment allowance is retired instead of restored."
    roles: [VenueOpsManager]
    code: 200
    input: ["note?"]
    output: BuildKit
    side_effects:
      - "refurb_count < REFURB_CAP: condition_score = min(100.00, condition_score + REFURB_GAIN), refurb_count += 1, status REFURB_REQUIRED -> IN_TRANSIT; localization_status stays PENDING and reuse_cycle_count is NOT cleared"
      - "refurb_count == REFURB_CAP: status REFURB_REQUIRED -> RETIRED and condition_score is left exactly as it was"
      - "increments BuildKit.version by 1"
  - method: POST
    path: "/build-kits/{kitId}/localize"
    description: "Localize a kit in transit for its next tour city; kit_localization_cost prices the work against the accumulated reuse discount."
    roles: [VenueOpsManager]
    code: 200
    input: [localization_language]
    output: BuildKit
    side_effects:
      - "kit_localization_cost writes localization_cost_cents from module_count and the capped reuse_cycle_count"
      - "localization_language is replaced, localization_status = LOCALIZED, status IN_TRANSIT -> READY"
      - "increments BuildKit.version by 1"

  # --- RoyaltyStatement -----------------------------------------------------
  - method: POST
    path: "/royalty-statements"
    description: "Open a royalty statement for a period of a run; a newer statement for the same period supersedes the open one. OCC-guarded on expected_run_version so a statement can never be cut against a run whose ledger has moved."
    roles: [LicensingManager]
    code: 201
    input: [run_id, period_start_date, period_end_date, expected_run_version]
    output: RoyaltyStatement
    side_effects:
      - "license_agreement_id copied from the run; royalty_accrual (provisional variant) writes ticket_base_cents, merch_base_cents and provisional_royalty_cents"
      - "status = DRAFT, provisional_royalty_cents_prev = 0, truedown_cents = 0, final_royalty_cents = 0, mg_prorated_cents = 0, minimum_guarantee_shortfall_cents = 0, amount_due_cents = 0, superseded_by_statement_id = null, version = 1"
      - "any existing RoyaltyStatement on the same (run_id, period_start_date, period_end_date) with status IN {DRAFT, UNDER_TRUEUP} -> SUPERSEDED with superseded_by_statement_id = the new row's id; increments its version by 1"
      - "run.royalty_statement_count += 1"
      - "increments ExperienceRun.version by 1"
  - method: GET
    path: "/royalty-statements/{statementId}"
    description: "Read one royalty statement including both accrual figures, the prorated minimum guarantee and the shortfall."
    roles: [LicensingManager, LicensorRep, ExperienceProducer]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []
  - method: GET
    path: "/royalty-statements"
    description: "List royalty statements; the reverse-reachability channel for the run, agreement and supersede links."
    roles: [LicensingManager, LicensorRep, ExperienceProducer]
    code: 200
    input: ["run_id?", "license_agreement_id?", "superseded_by_statement_id?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
  - method: POST
    path: "/royalty-statements/{statementId}/recompute-provisional"
    description: "Re-run the provisional accrual on a draft statement. A figure that holds or grows keeps the statement in DRAFT; a figure that has fallen since the last computation drops it into true-up with the shortfall recorded."
    roles: [LicensingManager]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects:
      - "provisional_royalty_cents_prev = the previous provisional_royalty_cents, then royalty_accrual (provisional variant) rewrites ticket_base_cents, merch_base_cents and provisional_royalty_cents"
      - "new figure >= provisional_royalty_cents_prev: status stays DRAFT and truedown_cents = 0"
      - "new figure < provisional_royalty_cents_prev: status DRAFT -> UNDER_TRUEUP and truedown_cents = provisional_royalty_cents_prev - provisional_royalty_cents"
      - "increments RoyaltyStatement.version by 1"
  - method: POST
    path: "/royalty-statements/{statementId}/finalize"
    description: "Issue a statement once its period has closed on the logical clock: computes the final accrual on money actually held, prorates the minimum guarantee over the period and records the shortfall."
    roles: [LicensingManager]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects:
      - "royalty_accrual (final variant) writes final_royalty_cents, then mg_prorated_cents, then minimum_guarantee_shortfall_cents = max(mg_prorated_cents - final_royalty_cents, 0), then amount_due_cents = final_royalty_cents + minimum_guarantee_shortfall_cents, in exactly that order"
      - "status DRAFT | UNDER_TRUEUP -> ISSUED, issued_at = current_utc"
      - "increments RoyaltyStatement.version by 1"
  - method: POST
    path: "/royalty-statements/{statementId}/settle"
    description: "Mark an issued statement paid to the licensor."
    roles: [LicensingManager]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status ISSUED -> SETTLED, settled_at = current_utc", "increments RoyaltyStatement.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
#
# Every id below is reachable from at least one §1.4 rule and at least one §1.5
# endpoint. The http status of an id is fixed: the same id never carries two
# different statuses.
# =============================================================================
errors:

  # --- authentication and authorisation (§1.4 P10, P20, P90) ---------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID is missing or blank, or X-User-Role is missing, blank or not a role declared in §1.7."
    applies_to: [all]
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The X-User-Role value is a declared role but does not appear in the called endpoint's roles list."
    applies_to: [all]
  - id: ERR_SOD_SUSPENSION_LIFT_SAME_USER
    http: 403
    condition: "The X-User-ID lifting a suspension equals the finalized_by_user_id of the inspection that caused it (SoD-1)."
    applies_to: ["POST /experience-runs/{runId}/lift-suspension"]
  - id: ERR_SOD_APPROVAL_SAME_USER
    http: 403
    condition: "The X-User-ID deciding a creative submission equals its submitted_by_user_id (SoD-2)."
    applies_to: ["POST /creative-submissions/{submissionId}/decisions"]
  - id: ERR_SOD_EXTENSION_SAME_USER
    http: 403
    condition: "The X-User-ID granting a run extension equals the run's created_by_user_id (SoD-3)."
    applies_to: ["POST /experience-runs/{runId}/extensions"]
  - id: ERR_LICENSOR_REP_MISMATCH
    http: 403
    condition: "A LicensorRep acts on a submission whose agreement's licensor_rep_user_id differs from the caller's X-User-ID."
    applies_to: ["POST /creative-submissions/{submissionId}/start-review", "POST /creative-submissions/{submissionId}/decisions"]
  - id: ERR_GUEST_OWNERSHIP_MISMATCH
    http: 403
    condition: "A Guest creates or cancels an order whose guest_account_id differs from the caller's X-User-ID."
    applies_to: ["POST /ticket-orders", "POST /ticket-orders/{orderId}/cancel"]

  # --- request shape (§1.4 P40) --------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "A required input field is absent, a type does not match, an enum value is outside its declared set, a numeric value is outside its declared range, a date is not a 10-character ISO calendar date, a datetime is not an ISO 8601 UTC instant, or an array carries duplicates or undeclared members."
    applies_to: ["every POST and PATCH endpoint"]

  # --- existence (§1.4 P30 path ids, P50 body foreign keys) ----------------
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venueId in the path, or venue_id in the body, does not resolve to a stored PopupVenue."
    applies_to: ["GET /venues/{venueId}", "POST /venues/{venueId}/permit-submissions", "POST /venues/{venueId}/permit-decisions", "POST /venues/{venueId}/activate-lease", "POST /venues/{venueId}/end-lease", "POST /venues/{venueId}/buildout-draws", "POST /experience-runs"]
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreementId in the path, or license_agreement_id in the body, does not resolve to a stored LicenseAgreement."
    applies_to: ["GET /license-agreements/{agreementId}", "POST /license-agreements/{agreementId}/activate", "POST /license-agreements/{agreementId}/expire", "POST /experience-runs", "POST /creative-submissions"]
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "submissionId in the path does not resolve to a stored CreativeSubmission."
    applies_to: ["GET /creative-submissions/{submissionId}", "POST /creative-submissions/{submissionId}/start-review", "POST /creative-submissions/{submissionId}/decisions", "POST /creative-submissions/{submissionId}/resubmit"]
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "runId in the path, or run_id in the body, does not resolve to a stored ExperienceRun."
    applies_to: ["GET /experience-runs/{runId}", "GET /experience-runs/{runId}/demand-index", "POST /experience-runs/{runId}/open", "POST /experience-runs/{runId}/extensions", "POST /experience-runs/{runId}/closure-decisions", "POST /experience-runs/{runId}/lift-suspension", "POST /themed-rooms", "POST /timed-entry-slots", "POST /creative-submissions", "POST /staff-members", "POST /safety-inspections", "POST /royalty-statements", "POST /build-kits"]
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "roomId in the path, or themed_room_id in the body, does not resolve to a stored ThemedRoom — including a themed_room_id that names a real ThemedRoom belonging to a different run than the shift's own run_id."
    applies_to: ["GET /themed-rooms/{roomId}", "POST /staff-shifts"]
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "slotId in the path, or slot_id in the body, does not resolve to a stored TimedEntrySlot."
    applies_to: ["GET /timed-entry-slots/{slotId}", "GET /timed-entry-slots/{slotId}/price-quote", "POST /timed-entry-slots/{slotId}/release", "POST /timed-entry-slots/{slotId}/status-decisions", "POST /ticket-orders"]
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "guestId in the path, or guest_account_id in the body, does not resolve to a stored GuestAccount."
    applies_to: ["GET /guest-accounts/{guestId}", "PATCH /guest-accounts/{guestId}", "POST /guest-accounts/{guestId}/reinstate", "POST /ticket-orders"]
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "orderId in the path does not resolve to a stored TicketOrder."
    applies_to: ["GET /ticket-orders/{orderId}", "POST /ticket-orders/{orderId}/confirm", "POST /ticket-orders/{orderId}/attendance", "POST /ticket-orders/{orderId}/cancel", "POST /ticket-orders/{orderId}/settle-refund"]
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "staffId in the path, or staff_member_id in the body, does not resolve to a stored StaffMember."
    applies_to: ["GET /staff-members/{staffId}", "POST /staff-members/{staffId}/training-records", "POST /staff-members/{staffId}/status-decisions", "POST /staff-shifts"]
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shiftId in the path does not resolve to a stored StaffShift."
    applies_to: ["GET /staff-shifts/{shiftId}", "POST /staff-shifts/{shiftId}/status-decisions"]
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspectionId in the path, or clearing_inspection_id in the body, does not resolve to a stored SafetyInspection."
    applies_to: ["GET /safety-inspections/{inspectionId}", "POST /safety-inspections/{inspectionId}/finalize", "POST /safety-inspections/{inspectionId}/void", "POST /experience-runs/{runId}/lift-suspension"]
  - id: ERR_KIT_NOT_FOUND
    http: 404
    condition: "kitId in the path, or build_kit_id in the body, does not resolve to a stored BuildKit."
    applies_to: ["GET /build-kits/{kitId}", "POST /build-kits/{kitId}/refurbish", "POST /build-kits/{kitId}/localize", "POST /experience-runs"]
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "statementId in the path does not resolve to a stored RoyaltyStatement."
    applies_to: ["GET /royalty-statements/{statementId}", "POST /royalty-statements/{statementId}/recompute-provisional", "POST /royalty-statements/{statementId}/finalize", "POST /royalty-statements/{statementId}/settle"]

  # --- uniqueness and optimistic concurrency (§1.4 P55, P60; §1.2.1) -------
  - id: ERR_DUPLICATE_KIT_CODE
    http: 409
    condition: "kit_code already belongs to another BuildKit."
    applies_to: ["POST /build-kits"]
  - id: ERR_DUPLICATE_GUEST_EMAIL
    http: 409
    condition: "email already belongs to another GuestAccount, compared case-insensitively."
    applies_to: ["POST /guest-accounts"]
  - id: ERR_DUPLICATE_ROOM_SEQUENCE
    http: 409
    condition: "room_sequence is already used by another ThemedRoom of the same run."
    applies_to: ["POST /themed-rooms"]
  - id: ERR_RUN_VERSION_CONFLICT
    http: 412
    condition: "expected_run_version does not equal the current ExperienceRun.version (concurrency rule statement-create-stale-run)."
    applies_to: ["POST /royalty-statements"]
  - id: ERR_AGREEMENT_VERSION_CONFLICT
    http: 412
    condition: "expected_agreement_version does not equal the current LicenseAgreement.version (concurrency rule submission-create-stale-agreement)."
    applies_to: ["POST /creative-submissions"]

  # --- own-state gates (§1.4 P70) ------------------------------------------
  - id: ERR_VENUE_INVALID_STATE
    http: 409
    condition: "The venue's status admits no such transition in §1.2 (e.g. permit-decisions on a DRAFT venue, activate-lease on PERMIT_CONDITIONS, end-lease on a venue that is not LEASE_ACTIVE)."
    applies_to: ["POST /venues/{venueId}/permit-submissions", "POST /venues/{venueId}/permit-decisions", "POST /venues/{venueId}/activate-lease", "POST /venues/{venueId}/end-lease", "POST /venues/{venueId}/buildout-draws"]
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "The agreement's status admits no such transition (e.g. activate on an ACTIVE or EXPIRED agreement, expire on a DRAFT agreement)."
    applies_to: ["POST /license-agreements/{agreementId}/activate", "POST /license-agreements/{agreementId}/expire"]
  - id: ERR_SUBMISSION_INVALID_STATE
    http: 409
    condition: "The submission's status admits no such transition (e.g. start-review on anything but SUBMITTED, a decision on anything but IN_REVIEW, resubmit on anything but CHANGES_REQUESTED)."
    applies_to: ["POST /creative-submissions/{submissionId}/start-review", "POST /creative-submissions/{submissionId}/decisions", "POST /creative-submissions/{submissionId}/resubmit"]
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "The run's run_status admits no such transition (e.g. open on an OPEN or CLOSED run, extensions on a PLANNED or CLOSING run, CLOSE before START_CLOSING), or a child row is created against a run whose run_status forbids it (themed rooms only while PLANNED)."
    applies_to: ["POST /experience-runs/{runId}/open", "POST /experience-runs/{runId}/extensions", "POST /experience-runs/{runId}/closure-decisions", "POST /themed-rooms", "POST /timed-entry-slots", "POST /royalty-statements"]
  - id: ERR_SLOT_INVALID_STATE
    http: 409
    condition: "The slot's status admits no such transition (e.g. release on anything but DRAFT, SUSPEND on a DRAFT slot, RESUME on an OPEN slot, CLOSE_OUT on a CANCELLED slot), or an order is placed on a slot that is not OPEN."
    applies_to: ["POST /timed-entry-slots/{slotId}/release", "POST /timed-entry-slots/{slotId}/status-decisions", "POST /ticket-orders"]
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "The order's status admits no such transition (e.g. confirm on a CONFIRMED order, attendance on a PENDING order, cancel on a CHECKED_IN order, settle-refund on anything but REFUND_DUE)."
    applies_to: ["POST /ticket-orders/{orderId}/confirm", "POST /ticket-orders/{orderId}/attendance", "POST /ticket-orders/{orderId}/cancel", "POST /ticket-orders/{orderId}/settle-refund"]
  - id: ERR_STAFF_INVALID_STATE
    http: 409
    condition: "The staff member's status admits no such transition (e.g. CLEAR on a CANDIDATE or CLEARED member, SUSPEND on a TRAINING member, REINSTATE on anything but SUSPENDED, training-records on a RELEASED member)."
    applies_to: ["POST /staff-members/{staffId}/training-records", "POST /staff-members/{staffId}/status-decisions"]
  - id: ERR_SHIFT_INVALID_STATE
    http: 409
    condition: "The shift's status admits no such transition (e.g. COMPLETE or CANCEL on a COMPLETED or CANCELLED shift)."
    applies_to: ["POST /staff-shifts/{shiftId}/status-decisions"]
  - id: ERR_INSPECTION_INVALID_STATE
    http: 409
    condition: "The inspection's status admits no such transition (finalize or void on an inspection that is already FINALIZED or VOIDED)."
    applies_to: ["POST /safety-inspections/{inspectionId}/finalize", "POST /safety-inspections/{inspectionId}/void"]
  - id: ERR_KIT_INVALID_STATE
    http: 409
    condition: "The kit's status admits no such transition (refurbish on anything but REFURB_REQUIRED, localize on anything but IN_TRANSIT)."
    applies_to: ["POST /build-kits/{kitId}/refurbish", "POST /build-kits/{kitId}/localize"]
  - id: ERR_STATEMENT_INVALID_STATE
    http: 409
    condition: "The statement's status admits no such transition (recompute-provisional on anything but DRAFT, finalize on an ISSUED, SETTLED or SUPERSEDED statement, settle on anything but ISSUED)."
    applies_to: ["POST /royalty-statements/{statementId}/recompute-provisional", "POST /royalty-statements/{statementId}/finalize", "POST /royalty-statements/{statementId}/settle"]

  # --- cross-entity state gates (§1.4 P80) ---------------------------------
  - id: ERR_VENUE_LEASE_NOT_ACTIVE
    http: 409
    condition: "The run's venue is not LEASE_ACTIVE when the run is opened."
    applies_to: ["POST /experience-runs/{runId}/open"]
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The licence agreement is not ACTIVE when a run is created or a creative submission is created or resubmitted."
    applies_to: ["POST /experience-runs", "POST /creative-submissions", "POST /creative-submissions/{submissionId}/resubmit"]
  - id: ERR_RUN_NOT_CLEARED
    http: 409
    condition: "The run's clearance_status is not CLEARED when the run is opened or an order is confirmed."
    applies_to: ["POST /experience-runs/{runId}/open", "POST /ticket-orders/{orderId}/confirm"]
  - id: ERR_RUN_SUSPENDED
    http: 409
    condition: "The run's clearance_status is SUSPENDED when a slot is released or a guest is checked in."
    applies_to: ["POST /timed-entry-slots/{slotId}/release", "POST /ticket-orders/{orderId}/attendance"]
  - id: ERR_GUEST_RESTRICTED
    http: 409
    condition: "The guest account is RESTRICTED when an order is created or confirmed for it."
    applies_to: ["POST /ticket-orders", "POST /ticket-orders/{orderId}/confirm"]
  - id: ERR_KIT_NOT_READY
    http: 409
    condition: "The build kit named by build_kit_id is not READY when a run is created."
    applies_to: ["POST /experience-runs"]
  - id: ERR_STAFF_NOT_CLEARED
    http: 409
    condition: "The staff member is not CLEARED when a shift is scheduled for them."
    applies_to: ["POST /staff-shifts"]
  - id: ERR_VENUE_HAS_ACTIVE_RUN
    http: 409
    condition: "A venue's lease is ended while at least one ExperienceRun with venue_id equal to that venue still has run_status IN {PLANNED, OPEN, EXTENDED, CLOSING}."
    applies_to: ["POST /venues/{venueId}/end-lease"]

  # --- interval and calendar bounds (§1.4 P100) ----------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "An interval is empty or inverted: lease_end_date <= lease_start_date, term_end_date <= term_start_date, scheduled_close_date <= scheduled_open_date, slot_end_utc <= slot_start_utc, shift_end_utc <= shift_start_utc, or period_end_date <= period_start_date."
    applies_to: ["POST /venues", "POST /license-agreements", "POST /experience-runs", "POST /timed-entry-slots", "POST /staff-shifts", "POST /royalty-statements"]
  - id: ERR_SLOT_OUTSIDE_RUN_WINDOW
    http: 422
    condition: "The slot window is not fully inside [00:00:00.000 of run.scheduled_open_date, 23:59:59.999 of run.scheduled_close_date], or scheduled_close_date falls after venue.lease_end_date at run creation."
    applies_to: ["POST /timed-entry-slots", "POST /experience-runs"]
  - id: ERR_PERIOD_OUTSIDE_TERM
    http: 422
    condition: "The statement period is not fully inside [agreement.term_start_date, agreement.term_end_date]."
    applies_to: ["POST /royalty-statements"]

  # --- clock-position gates (§1.4 P105) ------------------------------------
  - id: ERR_LEASE_START_NOT_REACHED
    http: 409
    condition: "The logical clock is still before lease_start_date when the lease is activated."
    applies_to: ["POST /venues/{venueId}/activate-lease"]
  - id: ERR_TERM_NOT_ENDED
    http: 409
    condition: "The logical clock is not strictly after term_end_date when the agreement is expired."
    applies_to: ["POST /license-agreements/{agreementId}/expire"]
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http: 409
    condition: "A CHECK_IN lands outside [slot_start_utc, slot_end_utc + CHECKIN_GRACE_MIN minutes] — either before the slot opens or after the grace period ends."
    applies_to: ["POST /ticket-orders/{orderId}/attendance"]
  - id: ERR_NO_SHOW_TOO_EARLY
    http: 409
    condition: "A NO_SHOW is recorded while the clock is still inside [slot_start_utc, slot_end_utc + CHECKIN_GRACE_MIN minutes] or before it."
    applies_to: ["POST /ticket-orders/{orderId}/attendance"]
  - id: ERR_CANCEL_WINDOW_CLOSED
    http: 409
    condition: "A CONFIRMED order is cancelled at or after slot_start_utc."
    applies_to: ["POST /ticket-orders/{orderId}/cancel"]
  - id: ERR_SHIFT_NOT_ENDED
    http: 409
    condition: "A shift is completed while the clock is still before shift_end_utc."
    applies_to: ["POST /staff-shifts/{shiftId}/status-decisions"]
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "A statement is finalized while the clock is not strictly after period_end_date."
    applies_to: ["POST /royalty-statements/{statementId}/finalize"]

  # --- resource occupation geometry (§1.4 P110) ----------------------------
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "staff_shift_occupation_window finds a SCHEDULED shift of the same member whose window, widened by REST_BUFFER_MIN minutes at both ends, touches or overlaps the requested window."
    applies_to: ["POST /staff-shifts"]
  - id: ERR_SHIFT_TOO_LONG
    http: 409
    condition: "shift_end_utc - shift_start_utc exceeds MAX_SHIFT_MINUTES minutes."
    applies_to: ["POST /staff-shifts"]
  - id: ERR_SLOT_OVERLAP_CAPACITY
    http: 409
    condition: "slot_overlap_admission_load finds that the slot's base_capacity plus the base_capacity of every half-open-overlapping peer of the run exceeds run.effective_capacity."
    applies_to: ["POST /timed-entry-slots", "POST /timed-entry-slots/{slotId}/release"]

  # --- accessibility and sensory accommodation (§1.4 P120) ------------------
  - id: ERR_WHEELCHAIR_ROUTE_UNAVAILABLE
    http: 409
    condition: "A WHEELCHAIR accommodation is requested but at least one ThemedRoom of the run has wheelchair_accessible == false."
    applies_to: ["POST /ticket-orders"]
  - id: ERR_QUIET_ROUTE_UNAVAILABLE
    http: 409
    condition: "A QUIET_ROUTE accommodation is requested but at least one ThemedRoom of the run with sensory_intensity_level >= SENSORY_BYPASS_LEVEL has has_quiet_bypass == false."
    applies_to: ["POST /ticket-orders"]
  - id: ERR_ASL_NOT_STAFFED
    http: 409
    condition: "An ASL_INTERPRETER accommodation is requested but the run has no StaffMember with staff_role == AMBASSADOR and status == CLEARED."
    applies_to: ["POST /ticket-orders"]
  - id: ERR_WHEELCHAIR_POSITIONS_EXHAUSTED
    http: 409
    condition: "slot.wheelchair_sold + order.wheelchair_party_count would exceed slot.wheelchair_positions."
    applies_to: ["POST /ticket-orders", "POST /ticket-orders/{orderId}/confirm"]
  - id: ERR_SEVERITY_FINDINGS_MISMATCH
    http: 409
    condition: "An inspection is finalized with severity == NONE while findings_count > 0."
    applies_to: ["POST /safety-inspections/{inspectionId}/finalize"]

  # --- occupancy and capacity ceilings (§1.4 P130) --------------------------
  - id: ERR_OCCUPANCY_ABOVE_EGRESS
    http: 409
    condition: "The venue's requested_occupancy_load exceeds its egress_capacity when the permit package is submitted."
    applies_to: ["POST /venues/{venueId}/permit-submissions"]
  - id: ERR_SLOT_CAPACITY_ABOVE_RUN
    http: 409
    condition: "A slot's base_capacity on its own exceeds run.effective_capacity, or exceeds a non-zero run.effective_capacity_cap."
    applies_to: ["POST /timed-entry-slots", "POST /timed-entry-slots/{slotId}/release"]
  - id: ERR_PARTY_SIZE_ABOVE_GROUP_MAX
    http: 409
    condition: "party_size exceeds run.max_group_size for a SINGLE or GROUP order, or exceeds SINGLE_MAX_PARTY for a SINGLE order."
    applies_to: ["POST /ticket-orders"]
  - id: ERR_BUYOUT_PARTY_MISMATCH
    http: 409
    condition: "A PRIVATE_BUYOUT order's party_size does not equal slot.base_capacity."
    applies_to: ["POST /ticket-orders"]
  - id: ERR_SLOT_CAPACITY_EXCEEDED
    http: 409
    condition: "The order would consume more than slot.available_capacity."
    applies_to: ["POST /ticket-orders", "POST /ticket-orders/{orderId}/confirm"]
  - id: ERR_RUN_HAS_NO_ROOMS
    http: 409
    condition: "run_effective_capacity is asked to produce a figure for a run with no ThemedRoom rows."
    applies_to: ["POST /timed-entry-slots", "POST /experience-runs/{runId}/open"]
  - id: ERR_SLOT_HAS_SALES
    http: 409
    condition: "A slot carrying sold_capacity > 0 or held_capacity > 0 is cancelled."
    applies_to: ["POST /timed-entry-slots/{slotId}/status-decisions"]

  # --- loop caps and eligibility (§1.4 P140) -------------------------------
  - id: ERR_PERMIT_ROUND_CAP
    http: 409
    condition: "permit_submission_round has already reached PERMIT_ROUND_CAP when another package is submitted."
    applies_to: ["POST /venues/{venueId}/permit-submissions"]
  - id: ERR_REVISION_ROUND_CAP
    http: 409
    condition: "revision_round has already reached REVISION_ROUND_CAP when the submission is resubmitted."
    applies_to: ["POST /creative-submissions/{submissionId}/resubmit"]
  - id: ERR_SCOPE_NOT_IN_AGREEMENT
    http: 409
    condition: "The submission's scope does not appear in agreement.approval_scopes."
    applies_to: ["POST /creative-submissions"]
  - id: ERR_CITY_NOT_IN_TERRITORY
    http: 409
    condition: "The venue's city_code does not appear in agreement.territory_city_codes."
    applies_to: ["POST /experience-runs"]
  - id: ERR_STAFF_READINESS_BELOW_MIN
    http: 409
    condition: "readiness_score_audit is below READINESS_CLEAR_MIN when the member is cleared or reinstated. The optimistic readiness_score_preflight figure never satisfies this gate."
    applies_to: ["POST /staff-members/{staffId}/status-decisions"]
  - id: ERR_STAFF_INCIDENTS_ABOVE_MAX
    http: 409
    condition: "incident_count exceeds INCIDENT_CLEAR_MAX when the member is cleared or reinstated."
    applies_to: ["POST /staff-members/{staffId}/status-decisions"]
  - id: ERR_KIT_CONDITION_BELOW_THRESHOLD
    http: 409
    condition: "The kit's condition_score is below REFURB_THRESHOLD, or its localization_status is PENDING, when a run tries to deploy it."
    applies_to: ["POST /experience-runs"]
  - id: ERR_INSPECTION_PASS_MISSING
    http: 409
    condition: "clearing_inspection_id does not name a FINALIZED inspection of the same run and the same inspection_type as the suspending inspection, finalized later than it, with outcome == PASS."
    applies_to: ["POST /experience-runs/{runId}/lift-suspension"]

  # --- money and lease budgets (§1.4 P150) ---------------------------------
  - id: ERR_BUILDOUT_CAP_EXCEEDED
    http: 409
    condition: "buildout_spend_cents + draw_amount_cents would exceed buildout_cap_cents. Checked before any bucket of the waterfall is touched, so a rejected draw leaves all four counters unchanged."
    applies_to: ["POST /venues/{venueId}/buildout-draws"]
  - id: ERR_LEASE_EXTENSION_EXHAUSTED
    http: 409
    condition: "venue.lease_extension_days_consumed + requested_extension_days would exceed venue.lease_extension_option_days."
    applies_to: ["POST /experience-runs/{runId}/extensions"]
  - id: ERR_DEMAND_BELOW_THRESHOLD
    http: 409
    condition: "run_extension_demand_index yields a figure below EXTENSION_DEMAND_MIN. Exactly EXTENSION_DEMAND_MIN passes."
    applies_to: ["POST /experience-runs/{runId}/extensions"]
  - id: ERR_STATEMENT_PERIOD_ISSUED
    http: 409
    condition: "A statement already exists for the same (run_id, period_start_date, period_end_date) with status IN {ISSUED, SETTLED, SUPERSEDED}, so it cannot be superseded by a newer draft."
    applies_to: ["POST /royalty-statements"]

# =============================================================================
# §1.7 RBAC Permission Matrix
#
# Seven roles. Every operator role is opaque: the X-User-ID is an arbitrary
# string the operator chooses, and only the segregation-of-duties comparisons of
# §1.4 P90 give it meaning. The single entity-backed role is Guest, whose
# X-User-ID MUST equal the id of a stored GuestAccount.
# =============================================================================
roles:

  - name: VenueOpsManager
    description: "Owns real estate: registers venues, drives the assembly-occupancy permit package, activates and ends leases, draws buildout money, and owns the build-kit fleet including refurbishment and localization for tour cities."
    identity: opaque
    exclusive_operations:
      - "POST /venues"
      - "POST /venues/{venueId}/permit-submissions"
      - "POST /venues/{venueId}/activate-lease"
      - "POST /venues/{venueId}/end-lease"
      - "POST /venues/{venueId}/buildout-draws"
      - "POST /build-kits"
      - "POST /build-kits/{kitId}/refurbish"
      - "POST /build-kits/{kitId}/localize"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /venues/{venueId}"
      - "GET /venues"
      - "GET /license-agreements/{agreementId}"
      - "GET /experience-runs/{runId}"
      - "GET /experience-runs"
      - "GET /experience-runs/{runId}/demand-index"
      - "GET /safety-inspections/{inspectionId}"
      - "GET /safety-inspections"
      - "GET /build-kits/{kitId}"
      - "GET /build-kits"

  - name: LicensingManager
    description: "Owns the intellectual-property relationship on the operator's side: registers and activates licence agreements, expires them at term end, and cuts, recomputes, issues and settles royalty statements."
    identity: opaque
    exclusive_operations:
      - "POST /license-agreements"
      - "POST /license-agreements/{agreementId}/activate"
      - "POST /license-agreements/{agreementId}/expire"
      - "POST /royalty-statements"
      - "POST /royalty-statements/{statementId}/recompute-provisional"
      - "POST /royalty-statements/{statementId}/finalize"
      - "POST /royalty-statements/{statementId}/settle"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /venues/{venueId}"
      - "GET /venues"
      - "GET /license-agreements/{agreementId}"
      - "GET /license-agreements"
      - "GET /creative-submissions/{submissionId}"
      - "GET /creative-submissions"
      - "GET /experience-runs/{runId}"
      - "GET /experience-runs"
      - "GET /experience-runs/{runId}/demand-index"
      - "GET /ticket-orders/{orderId}"
      - "GET /ticket-orders"
      - "GET /build-kits/{kitId}"
      - "GET /build-kits"
      - "GET /royalty-statements/{statementId}"
      - "GET /royalty-statements"

  - name: LicensorRep
    description: "The licensor's own representative, holding approval rights over creative execution and merchandise. Acts only on submissions whose agreement names this X-User-ID as licensor_rep_user_id, and may never decide a submission it filed itself."
    identity: opaque
    exclusive_operations:
      - "POST /creative-submissions/{submissionId}/start-review"
      - "POST /creative-submissions/{submissionId}/decisions"
    shared_operations:
      - "POST /_clock/set_current_utc"
