        distinguishing_aspect: |
          Package TESTING forks to PASSED or FAILED with divergent side-effect sets on a different
          entity than Manifest: PASS clears lab_hold and stamps thc_pct; FAIL keeps lab_hold true and
          stamps nothing — branching fork with per-branch side effects, satisfying non-linear shape.
        test_recipe:
          setup:
