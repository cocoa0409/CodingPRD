        claim_type: Violation to Error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit=0 is outside the declared 1..100 range and returns 400 ERR_INVALID_PAGINATION rather than silently falling back to the default of 10."
        test_recipe:
          setup: ["One BusinessUnit so the collection is non-empty."]
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdmin
