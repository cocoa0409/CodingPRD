        distinguishing_aspect: "decide accepts only SUBMITTED, so a SITE_MOVE amendment sitting in PRE_INSPECTION_REQUIRED returns ERR_INVALID_AMENDMENT_STATE 409 — while withdraw, whose from-set includes PRE_INSPECTION_REQUIRED, moves the very same row to WITHDRAWN."
        test_recipe:
