              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { o_la: $.data.id }
            - call: "POST /api/orders/${o_la}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
            - call: "POST /api/orders"
              payload: { buyer_type: LICENSEE, licensee_id: "${l2}", allocation_cycle_id: "${cT}", product_line_id: "${pl1}", quantity: 5, delivery_mode: FREIGHT_TO_STORE }
              as: LicenseeManager
              as_user_id: "${l2}"
              captures: { o_lb: $.data.id }
