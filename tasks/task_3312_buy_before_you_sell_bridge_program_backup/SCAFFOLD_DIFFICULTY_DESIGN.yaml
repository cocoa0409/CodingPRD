  - rule_id: compensating_invariant
    instances:
      - name: advance_reject_restores_program_advance_status
        grounds:
          - state_machines.BridgeProgram.FUNDING_to_PENDING
          - state_machines.BridgeProgram.PENDING_to_FUNDING
          - state_machines.BridgeAdvance.APPROVED_to_REJECTED
          - entities.BridgeProgram.fields.advance_status
        distinguishing_aspect: |
          A conserved quantity on BridgeProgram.advance_status: fund (PENDING->FUNDING) followed by
          rejecting the sole DOWN_PAYMENT advance restores advance_status to PENDING, leaving the
          count of FUNDING programs in the system unchanged — for every distinct program.
        test_recipe:
          setup:
            - "A funded BridgeProgram P has exactly one DOWN_PAYMENT BridgeAdvance A, APPROVED and undisbursed."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Comp", email: "h.comp@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "36 Departing Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "37 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /knock/bridge-programs/${bp_id}/fund"
              payload: { expected_bridge_program_version: "${bp_v}", interest_rate_bps: 800 }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /knock/bridge-advances"
              payload: { bridge_program_id: "${bp_id}", interim_loan_id: "${loan_id}", purpose: "DOWN_PAYMENT", amount_cents: 8000000 }
              as: Coordinator
              captures: { adv_id: $.data.id }
            - call: "POST /knock/bridge-advances/${adv_id}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /knock/bridge-advances/${adv_id}/reject"
              payload: {}
              as: Underwriter
              captures: { adv_v: $.data.version }
          assert:
            - "BridgeAdvance.${adv_id}.status == REJECTED"
            - "BridgeProgram.${bp_id}.advance_status == PENDING again (compensation of the fund transition)"
            - "the count of BridgeProgram rows in advance_status FUNDING is identical before fund and after reject (conserved across the pair)"
      - name: suspension_voids_and_restores_referral_counts
        grounds:
          - state_machines.Agent.QUALIFIED_to_SUSPENDED
          - state_machines.Referral.OPEN_to_VOIDED
          - entities.Agent.fields.active_referral_count
          - entities.BridgeProgram.fields.active_referral_count
        distinguishing_aspect: |
          A conserved quantity on referral counts: the sum of Agent.active_referral_count over all
          agents must equal the count of OPEN Referral rows at every point; suspending an agent voids
          its OPEN referrals and restores the identity on both Agent and BridgeProgram counters.
        test_recipe:
          setup:
            - "Agent G is QUALIFIED with two OPEN Referrals across two programs P1 and P2, so sum(active_referral_count) == 2 equals the OPEN Referral count."
          setup_api_calls:
            - call: "POST /knock/homeowners"
              payload: { full_name: "H Inv", email: "h.inv@x.com", credit_score: 700, household_income_cents: 30000000 }
              as: Coordinator
              captures: { h_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "38 Departing Way", kind: "DEPARTING", appraised_value_cents: 70000000, mortgage_payoff_cents: 30000000, condition_grade: "B" }
              as: Coordinator
              captures: { dep_id: $.data.id }
            - call: "POST /knock/properties"
              payload: { homeowner_id: "${h_id}", address: "39 New Way", kind: "NEW", appraised_value_cents: 55000000, purchase_price_cents: 50000000, condition_grade: "A" }
              as: Coordinator
              captures: { new_id: $.data.id }
            - call: "POST /knock/qualifications"
              payload: { homeowner_id: "${h_id}", departing_property_id: "${dep_id}", new_property_id: "${new_id}", target_purchase_price_cents: 30000000, variant_used: "CONSERVATIVE" }
              as: Coordinator
              captures: { q_id: $.data.id }
            - call: "POST /knock/qualifications/${q_id}/approve"
              payload: {}
              as: Coordinator
            - call: "POST /knock/bridge-programs"
              payload: { homeowner_id: "${h_id}", qualification_id: "${q_id}", new_property_id: "${new_id}", departing_property_id: "${dep_id}", projected_carry_months: 4 }
              as: Coordinator
              captures: { bp1_id: $.data.id }
            - call: "POST /knock/agents"
              payload: { full_name: "A Inv", brokerage_name: "Broker", license_number: "LIC-INV" }
              as: Coordinator
              captures: { ag_id: $.data.id }
            - call: "POST /knock/agents/${ag_id}/qualify"
              payload: {}
              as: Coordinator
            - call: "POST /knock/referrals"
              payload: { agent_id: "${ag_id}", bridge_program_id: "${bp1_id}", role_scope: "DEPARTING_SIDE" }
              as: Coordinator
              captures: { rf1_id: $.data.id }
            - call: "POST /knock/referrals"
              payload: { agent_id: "${ag_id}", bridge_program_id: "${bp1_id}", role_scope: "NEW_SIDE" }
              as: Coordinator
              captures: { rf2_id: $.data.id }
          trigger:
            - call: "POST /knock/agents/${ag_id}/suspend"
              payload: {}
              as: Coordinator
              captures: { ag_v: $.data.version }
          assert:
            - "Referral.${rf1_id}.status == VOIDED and Referral.${rf2_id}.status == VOIDED (OPEN -> VOIDED cascade)"
            - "Agent.${ag_id}.active_referral_count == 0"
            - "BridgeProgram.${bp1_id}.active_referral_count == 0"
            - "the count of OPEN Referral rows across the system equals the sum of Agent.active_referral_count at every point (conserved)"
