# =============================================================================
# §1.8 Scaffold Difficulty Design — Child Device Monitoring (Bark-like)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_scoring_lexical_vs_contextual_variants
        grounds:
          - calculations.content_risk_scoring
          - entities.ContentItem.fields.risk_score
          - entities.FamilyAccount.fields.analysis_variant
        distinguishing_aspect: |
          Two valid scoring variants applied to identical signals produce different
          risk_scores on the SAME ContentItem domain: LEXICAL_V1 yields 55 while
          CONTEXTUAL_V2 with thread_depth=3 yields 63 (round_half_up(55*1.15)).
        test_recipe:
          setup:
            - "Family A (analysis_variant LEXICAL_V1) with child A and an ACTIVE messaging connection A"
            - "Family B (analysis_variant CONTEXTUAL_V2) with child B and an ACTIVE messaging connection B"
            - "Both children identical: birth_year 2012 (TEEN_13_15), sensitivity STANDARD"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam A", primary_contact_email: "a@x.com", primary_parent_name: "Pat A", subscription_tier: "STANDARD", analysis_variant: "LEXICAL_V1" }
              as: PlatformAdmin
              captures: { fam_a: $.data.id }
            - call: "GET /api/families/${fam_a}/parents"
              as: PlatformAdmin
              captures: { par_a: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_a}", display_name: "Kid A", birth_year: 2012, monitoring_sensitivity: "STANDARD" }
              as: Parent
              as_user_id: "${par_a}"
              captures: { child_a: $.data.id }
            - call: "POST /api/children/${child_a}/devices/pair"
              payload: { platform: "ANDROID", nickname: "A-phone" }
              as: Parent
              as_user_id: "${par_a}"
              captures: { dev_a: $.data.id }
            - call: "POST /api/children/${child_a}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kida@msg", credential_token: "tok-a" }
              as: Parent
              as_user_id: "${par_a}"
              captures: { conn_a: $.data.id }
            - call: "POST /api/connections/${conn_a}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_a}"
            - call: "POST /api/families"
              payload: { family_name: "Fam B", primary_contact_email: "b@x.com", primary_parent_name: "Pat B", subscription_tier: "STANDARD", analysis_variant: "CONTEXTUAL_V2" }
              as: PlatformAdmin
              captures: { fam_b: $.data.id }
            - call: "GET /api/families/${fam_b}/parents"
              as: PlatformAdmin
              captures: { par_b: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_b}", display_name: "Kid B", birth_year: 2012, monitoring_sensitivity: "STANDARD" }
              as: Parent
              as_user_id: "${par_b}"
              captures: { child_b: $.data.id }
            - call: "POST /api/children/${child_b}/devices/pair"
              payload: { platform: "ANDROID", nickname: "B-phone" }
              as: Parent
              as_user_id: "${par_b}"
              captures: { dev_b: $.data.id }
            - call: "POST /api/children/${child_b}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidb@msg", credential_token: "tok-b" }
              as: Parent
              as_user_id: "${par_b}"
              captures: { conn_b: $.data.id }
            - call: "POST /api/connections/${conn_b}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_b}"
          trigger:
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_a}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 3
                signals: [ { category: "BULLYING", weight: 30 }, { category: "EXPLICIT", weight: 25 } ]
                raw_text: "sample text A"
              as: DeviceAgent
              as_user_id: "${dev_a}"
              captures: { ci_a: $.data.id, score_a: $.data.risk_score }
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_b}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 3
                signals: [ { category: "BULLYING", weight: 30 }, { category: "EXPLICIT", weight: 25 } ]
                raw_text: "sample text B"
              as: DeviceAgent
              as_user_id: "${dev_b}"
              captures: { ci_b: $.data.id, score_b: $.data.risk_score }
          assert:
            - "ContentItem.${ci_a}.risk_score == 55"
            - "ContentItem.${ci_a}.analysis_variant_used == LEXICAL_V1"
            - "ContentItem.${ci_b}.risk_score == 63"
            - "ContentItem.${ci_b}.analysis_variant_used == CONTEXTUAL_V2"
            - "55 != 63 — identical signals diverge across variants"

      - name: alert_feed_immediate_vs_digest_variants
        grounds:
          - calculations.alert_feed_composition
          - endpoints: "GET /api/alerts (variant parameter)"
        distinguishing_aspect: |
          Two valid feed variants over the SAME Alert domain produce different result
          sets: IMMEDIATE returns the MODERATE and the HIGH alert (2 items) while
          DIGEST returns only the HIGH alert (1 item); RESOLVED alerts are excluded
          from both.
        test_recipe:
          setup:
            - "Family (STANDARD) with child (birth_year 2012, STANDARD sensitivity), paired device, ACTIVE messaging connection"
            - "Alert 1: signals BULLYING 30 + EXPLICIT 25 -> score 55 -> MODERATE"
            - "Alert 2: signals SELF_HARM 45 + BULLYING 30 -> score 75 -> HIGH"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam F", primary_contact_email: "f@x.com", primary_parent_name: "Pat F", subscription_tier: "STANDARD", analysis_variant: "LEXICAL_V1" }
              as: PlatformAdmin
              captures: { fam_f: $.data.id }
            - call: "GET /api/families/${fam_f}/parents"
              as: PlatformAdmin
              captures: { par_f: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_f}", display_name: "Kid F", birth_year: 2012, monitoring_sensitivity: "STANDARD" }
              as: Parent
              as_user_id: "${par_f}"
              captures: { child_f: $.data.id }
            - call: "POST /api/children/${child_f}/devices/pair"
              payload: { platform: "IOS", nickname: "F-phone" }
              as: Parent
              as_user_id: "${par_f}"
              captures: { dev_f: $.data.id }
            - call: "POST /api/children/${child_f}/connections"
              payload: { service_type: "SOCIAL", external_handle: "kidf@social", credential_token: "tok-f" }
              as: Parent
              as_user_id: "${par_f}"
              captures: { conn_f: $.data.id }
            - call: "POST /api/connections/${conn_f}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_f}"
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_f}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 30 }, { category: "EXPLICIT", weight: 25 } ]
                raw_text: "moderate item"
              as: DeviceAgent
              as_user_id: "${dev_f}"
              captures: { alert_mod: $.data.alert_id }
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_f}"
                occurred_at: "2026-09-01T00:10:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "SELF_HARM", weight: 45 }, { category: "BULLYING", weight: 30 } ]
                raw_text: "high item"
              as: DeviceAgent
              as_user_id: "${dev_f}"
              captures: { alert_high: $.data.alert_id }
          trigger:
            - call: "GET /api/alerts"
              payload: { child_profile_id: "${child_f}", variant: "IMMEDIATE" }
              as: Parent
              as_user_id: "${par_f}"
            - call: "GET /api/alerts"
              payload: { child_profile_id: "${child_f}", variant: "DIGEST" }
              as: Parent
              as_user_id: "${par_f}"
          assert:
            - "IMMEDIATE feed contains exactly 2 alerts (${alert_mod}, ${alert_high})"
            - "DIGEST feed contains exactly 1 alert (${alert_high})"
            - "Alert.${alert_mod}.severity == MODERATE"
            - "Alert.${alert_high}.severity == HIGH"

  - rule_id: combinatorial_formula
    instances:
      - name: severity_classification_multi_factor_mode_a
        grounds:
          - calculations.alert_severity_classification
          - calculations.age_band_derivation
          - entities.ChildProfile.fields.monitoring_sensitivity
        distinguishing_aspect: |
          Mode (a) combinatorial: severity nests >=3 inputs with non-linear
          interaction — base tier from score (55 -> MODERATE), +1 for CHILD_9_UNDER,
          +1 for STRICT sensitivity, clamped against the category floor — yielding
          SEVERE where any single-factor reading would say MODERATE.
        test_recipe:
          setup:
            - "Family STANDARD, child birth_year 2020 (age 6 -> CHILD_9_UNDER), sensitivity STRICT, paired device, ACTIVE email connection"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam S", primary_contact_email: "s@x.com", primary_parent_name: "Pat S", subscription_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { fam_s: $.data.id }
            - call: "GET /api/families/${fam_s}/parents"
              as: PlatformAdmin
              captures: { par_s: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_s}", display_name: "Kid S", birth_year: 2020, monitoring_sensitivity: "STRICT" }
              as: Parent
              as_user_id: "${par_s}"
              captures: { child_s: $.data.id }
            - call: "POST /api/children/${child_s}/devices/pair"
              payload: { platform: "CHROMEBOOK", nickname: "S-tab" }
              as: Parent
              as_user_id: "${par_s}"
              captures: { dev_s: $.data.id }
            - call: "POST /api/children/${child_s}/connections"
              payload: { service_type: "EMAIL", external_handle: "kids@mail", credential_token: "tok-s" }
              as: Parent
              as_user_id: "${par_s}"
              captures: { conn_s: $.data.id }
            - call: "POST /api/connections/${conn_s}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_s}"
          trigger:
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_s}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 30 }, { category: "EXPLICIT", weight: 25 } ]
                raw_text: "multi factor item"
              as: DeviceAgent
              as_user_id: "${dev_s}"
              captures: { ci_s: $.data.id, alert_s: $.data.alert_id }
          assert:
            - "ContentItem.${ci_s}.risk_score == 55"
            - "ContentItem.${ci_s}.severity == SEVERE"
            - "Alert.${alert_s}.severity == SEVERE"
            - "EscalationCase exists for ${alert_s} with case_status == OPEN (GET /api/escalation-cases?alert_id= returns 1 item)"
            - "EscalationCase.crisis_resource_codes == [STOPBULLYING_GOV] (dominant category BULLYING)"

      - name: subscription_proration_per_day_then_sum_mode_b
        grounds:
          - calculations.subscription_proration
          - concurrency_rules[family-subscription-stale-version]
          - entities.FamilyAccount.fields.last_proration_charge_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-day-rate-then-multiply;
          STANDARD(1999)->PREMIUM(2999) with 7 remaining days yields
          7 * (round_half_up(2999/30) - round_half_up(1999/30)) = 7 * (100 - 67) = 231
          cents, whereas sum-then-round orderings yield different cents.
        test_recipe:
          setup:
            - "Family created at default clock 2026-09-01T00:00:00Z with STANDARD tier (period end 2026-10-01T00:00:00Z)"
            - "Clock advanced to 2026-09-24T00:00:00Z (7 days remaining in period)"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam P", primary_contact_email: "p@x.com", primary_parent_name: "Pat P", subscription_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { fam_p: $.data.id, fam_p_v: $.data.version }
            - call: "GET /api/families/${fam_p}/parents"
              as: PlatformAdmin
              captures: { par_p: $.data.0.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/families/${fam_p}/subscription/changes"
              payload: { new_tier: "PREMIUM", expected_family_version: "${fam_p_v}" }
              as: Parent
              as_user_id: "${par_p}"
          assert:
            - "FamilyAccount.${fam_p}.last_proration_charge_cents == 231"
            - "FamilyAccount.${fam_p}.subscription_tier == PREMIUM"
            - "FamilyAccount.${fam_p}.device_limit == 10"

  - rule_id: non_linear_state_machine
    instances:
      - name: alert_resolve_reopen_cycle
        grounds:
          - state_machines.Alert.RESOLVED_to_REOPENED
          - state_machines.Alert.REOPENED_to_RESOLVED
          - calculations.open_alert_count_aggregation
        distinguishing_aspect: |
          Cyclic machine on Alert: RESOLVED -> REOPENED -> ACKNOWLEDGED -> RESOLVED
          loops the entity back through previously visited states, and
          open_alert_count tracks each pass (1 -> 0 -> 1 -> 1 -> 0).
        test_recipe:
          setup:
            - "Family, child, paired device, ACTIVE connection, one MODERATE alert (BULLYING 30 + EXPLICIT 25 -> 55)"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam C", primary_contact_email: "c@x.com", primary_parent_name: "Pat C" }
              as: PlatformAdmin
              captures: { fam_c: $.data.id }
            - call: "GET /api/families/${fam_c}/parents"
              as: PlatformAdmin
              captures: { par_c: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_c}", display_name: "Kid C", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_c}"
              captures: { child_c: $.data.id }
            - call: "POST /api/children/${child_c}/devices/pair"
              payload: { platform: "ANDROID", nickname: "C-phone" }
              as: Parent
              as_user_id: "${par_c}"
              captures: { dev_c: $.data.id }
            - call: "POST /api/children/${child_c}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidc@msg", credential_token: "tok-c" }
              as: Parent
              as_user_id: "${par_c}"
              captures: { conn_c: $.data.id }
            - call: "POST /api/connections/${conn_c}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_c}"
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_c}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "BULLYING", weight: 30 }, { category: "EXPLICIT", weight: 25 } ]
                raw_text: "cycle item"
              as: DeviceAgent
              as_user_id: "${dev_c}"
              captures: { alert_c: $.data.alert_id }
          trigger:
            - call: "POST /api/alerts/${alert_c}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: Parent
              as_user_id: "${par_c}"
            - call: "POST /api/alerts/${alert_c}/state"
              payload: { to_status: "RESOLVED" }
              as: Parent
              as_user_id: "${par_c}"
            - call: "POST /api/alerts/${alert_c}/state"
              payload: { to_status: "REOPENED" }
              as: Parent
              as_user_id: "${par_c}"
            - call: "POST /api/alerts/${alert_c}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: Parent
              as_user_id: "${par_c}"
            - call: "POST /api/alerts/${alert_c}/state"
              payload: { to_status: "RESOLVED" }
              as: Parent
              as_user_id: "${par_c}"
            - call: "GET /api/children/${child_c}"
              as: Parent
              as_user_id: "${par_c}"
          assert:
            - "After full cycle Alert.${alert_c}.alert_status == RESOLVED"
            - "ChildProfile.${child_c}.open_alert_count == 0"

      - name: connection_pause_resume_reconsent_cycle
        grounds:
          - state_machines.ServiceConnection.ACTIVE_to_PAUSED
          - state_machines.ServiceConnection.PAUSED_to_ACTIVE
          - state_machines.ServiceConnection.REVOKED_to_AWAITING_CONSENT
        distinguishing_aspect: |
          Cyclic machine on ServiceConnection (different entity than Alert):
          ACTIVE -> PAUSED -> ACTIVE -> REVOKED -> AWAITING_CONSENT -> ACTIVE
          revisits both ACTIVE and AWAITING_CONSENT within one lifetime.
        test_recipe:
          setup:
            - "Family, child, connection created (AWAITING_CONSENT)"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam K", primary_contact_email: "k@x.com", primary_parent_name: "Pat K" }
              as: PlatformAdmin
              captures: { fam_k: $.data.id }
            - call: "GET /api/families/${fam_k}/parents"
              as: PlatformAdmin
              captures: { par_k: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_k}", display_name: "Kid K", birth_year: 2010 }
              as: Parent
              as_user_id: "${par_k}"
              captures: { child_k: $.data.id }
            - call: "POST /api/children/${child_k}/connections"
              payload: { service_type: "SOCIAL", external_handle: "kidk@social", credential_token: "tok-k" }
              as: Parent
              as_user_id: "${par_k}"
              captures: { conn_k: $.data.id }
          trigger:
            - call: "POST /api/connections/${conn_k}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_k}"
            - call: "POST /api/connections/${conn_k}/state"
              payload: { to_status: "PAUSED" }
              as: Parent
              as_user_id: "${par_k}"
            - call: "POST /api/connections/${conn_k}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_k}"
            - call: "POST /api/connections/${conn_k}/state"
              payload: { to_status: "REVOKED" }
              as: Parent
              as_user_id: "${par_k}"
            - call: "POST /api/connections/${conn_k}/state"
              payload: { to_status: "AWAITING_CONSENT" }
              as: Parent
              as_user_id: "${par_k}"
            - call: "POST /api/connections/${conn_k}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_k}"
          assert:
            - "ServiceConnection.${conn_k}.consent_status == ACTIVE after the full loop"
            - "ServiceConnection.${conn_k}.version == 7 (create=1, plus 6 transitions)"

  - rule_id: transitive_cascade
    instances:
      - name: severe_alert_escalation_district_cascade
        grounds:
          - state_machines.EscalationCase
          - calculations.legal_report_deadline
          - entities.DistrictLink.fields.pending_legal_report
        distinguishing_aspect: |
          Depth-3 cascade originating from content ingest: ingest -> Alert created
          (hop 1) -> SEVERE spawns EscalationCase OPEN (hop 2) -> case creation marks
          the ACTIVE MANDATED_REPORTING DistrictLink pending_legal_report=true with
          legal_report_due_at = created_at + 24h (hop 3), which in turn raises
          District.open_obligation_count to 1.
        test_recipe:
          setup:
            - "Family, child (TEEN_13_15, STANDARD), paired device, ACTIVE connection"
            - "District with jurisdiction MANDATED_REPORTING; DistrictLink consented ACTIVE at default clock 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/families"
              payload: { family_name: "Fam D", primary_contact_email: "d@x.com", primary_parent_name: "Pat D" }
              as: PlatformAdmin
              captures: { fam_d: $.data.id }
            - call: "GET /api/families/${fam_d}/parents"
              as: PlatformAdmin
              captures: { par_d: $.data.0.id }
            - call: "POST /api/children"
              payload: { family_account_id: "${fam_d}", display_name: "Kid D", birth_year: 2012 }
              as: Parent
              as_user_id: "${par_d}"
              captures: { child_d: $.data.id }
            - call: "POST /api/children/${child_d}/devices/pair"
              payload: { platform: "ANDROID", nickname: "D-phone" }
              as: Parent
              as_user_id: "${par_d}"
              captures: { dev_d: $.data.id }
            - call: "POST /api/children/${child_d}/connections"
              payload: { service_type: "MESSAGING", external_handle: "kidd@msg", credential_token: "tok-d" }
              as: Parent
              as_user_id: "${par_d}"
              captures: { conn_d: $.data.id }
            - call: "POST /api/connections/${conn_d}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_d}"
            - call: "POST /api/districts"
              payload: { district_name: "District M", contact_email: "admin@m.edu", jurisdiction: "MANDATED_REPORTING" }
              as: PlatformAdmin
              captures: { dist_m: $.data.id }
            - call: "POST /api/districts/${dist_m}/links"
              payload: { child_profile_id: "${child_d}" }
              as: SchoolAdmin
              as_user_id: "${dist_m}"
              captures: { link_d: $.data.id }
            - call: "POST /api/district-links/${link_d}/state"
              payload: { to_status: "ACTIVE" }
              as: Parent
              as_user_id: "${par_d}"
          trigger:
            - call: "POST /api/content-items"
              payload:
                service_connection_id: "${conn_d}"
                occurred_at: "2026-09-01T00:00:00Z"
                direction: "INBOUND"
                thread_depth: 1
                signals: [ { category: "PREDATORY_CONTACT", weight: 90 } ]
                raw_text: "predatory contact item"
              as: DeviceAgent
              as_user_id: "${dev_d}"
              captures: { alert_d: $.data.alert_id }
            - call: "GET /api/escalation-cases"
              payload: { alert_id: "${alert_d}" }
              as: Parent
              as_user_id: "${par_d}"
              captures: { case_d: $.data.0.id }
            - call: "GET /api/children/${child_d}/district-links"
              as: Parent
              as_user_id: "${par_d}"
            - call: "GET /api/districts/${dist_m}"
              as: SchoolAdmin
              as_user_id: "${dist_m}"
          assert:
            - "EscalationCase.${case_d}.case_status == OPEN"
            - "EscalationCase.${case_d}.legal_report_due_at == 2026-09-02T00:00:00Z"
            - "EscalationCase.${case_d}.crisis_resource_codes == [NCMEC_CYBERTIPLINE]"
            - "DistrictLink.${link_d}.pending_legal_report == true"
            - "District.${dist_m}.open_obligation_count == 1"

      - name: bypass_strike_lockdown_grant_cascade
        grounds:
          - state_machines.Device.BYPASS_WATCH_to_LOCKDOWN
          - state_machines.DeviceAccessGrant.SCHEDULED_to_CANCELLED
          - calculations.bypass_strike_window
        distinguishing_aspect: |
          Different trigger (bypass report, not ingest) and depth >= 2: BypassEvent
          creation recomputes bypass_strike_count (hop 1); the strike threshold
          crossing flips device_posture to LOCKDOWN (hop 2); entering LOCKDOWN
          cancels the device's SCHEDULED access grant (hop 3).
        test_recipe:
          setup:
            - "Family, child, paired device with a SCHEDULED access grant [2026-09-01T05:00:00Z, 2026-09-01T06:00:00Z]"
