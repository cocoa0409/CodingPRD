  - entity: DisbursementAccount
    initial_state: PRO_FORMA
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: PRO_FORMA
        to: SENT_TO_PRINCIPAL
        trigger: POST /disbursement-accounts/{id}/send
        actor: AgencyOps
        preconditions:
          - "status == PRO_FORMA (else ERR_INVALID_STATE)"
          - "port call ops_status not in {CANCELLED, CLOSED} (else ERR_PORT_CALL_NOT_EDITABLE)"
        side_effects: []
      - from: SENT_TO_PRINCIPAL
        to: FUNDED
        trigger: "system: automatic when (advances_received_cents - advances_refunded_cents) >= advance_required_cents after any FundingAdvance create/refund"
        actor: system
        preconditions: []
        side_effects: []
      - from: FUNDED
        to: SENT_TO_PRINCIPAL
        trigger: "system: automatic when (advances_received_cents - advances_refunded_cents) < advance_required_cents after a refund or a totals recompute that raises advance_required_cents"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT_TO_PRINCIPAL
        to: FINAL
        trigger: POST /disbursement-accounts/{id}/finalize
        actor: AgencyFinance
        preconditions:
          - "status in {SENT_TO_PRINCIPAL, FUNDED} (else ERR_INVALID_STATE)"
          - "port call ops_status == SAILED (else ERR_PORT_CALL_NOT_SAILED)"
          - "X-User-ID != created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "all ESTIMATED lines actualize: SERVICE_ORDER/PURCHASE_ORDER mirrors take their source actual_cents (0 when source CANCELLED); MANUAL lines keep actual_cents == estimated_cents; PORT_DUES keeps the value computed at sailing"
          - "total_final_cents, agency_fee_final_cents, balance_due_cents recomputed via da_totals_calc FINAL variant"
          - "finalized_by_user_id = X-User-ID"
      - from: FUNDED
        to: FINAL
        trigger: POST /disbursement-accounts/{id}/finalize
        actor: AgencyFinance
        preconditions: ["as SENT_TO_PRINCIPAL -> FINAL"]
        side_effects: ["as SENT_TO_PRINCIPAL -> FINAL"]
      - from: FINAL
        to: DISPUTED
        trigger: "system: CostDispute creation against this DA, or a linked PurchaseOrder invoice/match branching to DISPUTED"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: FINAL
        trigger: POST /disbursement-accounts/{id}/refinalize
        actor: AgencyFinance
        preconditions:
          - "status == DISPUTED (else ERR_INVALID_STATE)"
          - "no CostDispute of this DA in {RAISED, UNDER_REVIEW, ESCALATED} (else ERR_DISPUTES_OPEN)"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["totals recomputed via da_totals_calc FINAL variant (upheld credits already applied to lines)"]
      - from: FINAL
        to: SETTLED
        trigger: POST /disbursement-accounts/{id}/settle
        actor: AgencyFinance
        preconditions:
          - "status == FINAL (else ERR_INVALID_STATE)"
          - "no FundingAdvance of this DA in status RECEIVED with unapplied remainder > 0 (else ERR_UNREFUNDED_ADVANCES)"
          - "balance_due_cents == 0 exactly, i.e. advances_applied_cents == total_final_cents (else ERR_BALANCE_NOT_ZERO; equality required, not >=)"
        side_effects: []
      - from: PRO_FORMA
        to: SUPERSEDED
        trigger: "system: creation of a new DisbursementAccount for the same port call"
        actor: system
        preconditions: []
        side_effects: ["lines are NOT carried over; the new DA rebuilds from sources and manual lines"]

