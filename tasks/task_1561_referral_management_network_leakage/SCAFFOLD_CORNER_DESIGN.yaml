        distinguishing_aspect: "The second OCC rule guards loop closure: a verifier whose expected_referral_version predates the consult-note submission (which bumped the version) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["full chain: referral completed appointment (version 5 captured), then consult note submitted (version 6)"]
