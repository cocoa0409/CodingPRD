            - call: "PATCH /behavioral-health/beds/${b_p1}"
              payload: { status: "OUT_OF_SERVICE" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "PATCH /behavioral-health/beds/${b_p2}"
              payload: { status: "OUT_OF_SERVICE" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "PATCH /behavioral-health/beds/${b_p3}"
              payload: { status: "OUT_OF_SERVICE" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "GET /behavioral-health/units/${u_po}"
              payload: {}
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "PATCH /behavioral-health/beds/${b_p4}"
              payload: { status: "OUT_OF_SERVICE" }
              as: ChargeNurse
