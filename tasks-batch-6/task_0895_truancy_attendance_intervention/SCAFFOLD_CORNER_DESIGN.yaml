            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Disp Off", role_type: "OFFICER" }
              as: Administrator
              captures: { officer_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Fin Disp", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-04", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /cases/${cid}/court-citations"
              payload: { courtroom_id: "CR-7", hearing_start: "2026-10-01T09:00:00Z", hearing_end: "2026-10-01T10:00:00Z" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { cit_id: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/court-citations/${cit_id}/transition"
              payload: { to_status: "HEARD" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

