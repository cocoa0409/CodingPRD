          assert:
            - "response HTTP status == 403"
            - "response data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: book_session_no_credits_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors[ERR_NO_SESSION_CREDITS]
        distinguishing_aspect: "Booking a session on an INTAKE case with covered_sessions=0 (no state or overlap violation) returns ERR_NO_SESSION_CREDITS (402)."
        test_recipe:
          setup: ["Case with covered_sessions=0, still INTAKE"]
