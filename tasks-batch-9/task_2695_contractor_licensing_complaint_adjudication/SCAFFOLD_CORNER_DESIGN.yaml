        distinguishing_aspect: "entity_topology is flat, so body FKs are checked by priority 5: a real licensee and qualifier with an unissued classification_id returns ERR_TRADE_CLASSIFICATION_NOT_FOUND (404), not a generic 400."
        test_recipe:
