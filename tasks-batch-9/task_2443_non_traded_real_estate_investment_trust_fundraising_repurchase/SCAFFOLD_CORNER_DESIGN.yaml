              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /liquidity-events"
              payload: { offering_id: "${off_id}", event_type: "MERGER", proposed_effective_date: "2027-03-01" }
              as: SponsorOperator
              captures: { le_id: $.data.id }
            - call: "POST /liquidity-events/${le_id}/status"
              payload: { action: "ABANDON" }
              as: BoardCommittee
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
              captures: { reclose_error: $.data.error_id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
              captures: { reinstate_error: $.data.error_id }
            - call: "POST /liquidity-events/${le_id}/status"
              payload: { action: "ABANDON" }
              as: BoardCommittee
              captures: { reabandon_error: $.data.error_id }
            - call: "POST /share-classes/${sc_id}/status"
              payload: { to_status: "CLOSED_TO_NEW" }
              as: SponsorOperator
              captures: { reclose_class_error: $.data.error_id }
          assert:
            - "reclose_error == \"ERR_INVALID_STATE_TRANSITION\" with http status 409"
            - "reinstate_error == \"ERR_INVALID_STATE_TRANSITION\""
            - "reabandon_error == \"ERR_INVALID_STATE_TRANSITION\""
            - "reclose_class_error == \"ERR_INVALID_STATE_TRANSITION\" (NOT ERR_OFFERING_NOT_EFFECTIVE)"
            - "Offering.${off_id}.registration_status == \"CLOSED\""
            - "ShareClass.${sc_id}.status == \"CLOSED_TO_NEW\""
            - "LiquidityEvent.${le_id}.status == \"ABANDONED\""

      - name: repeated_trigger_on_same_row_rejected_and_leaves_version_untouched
        claim_type: idempotency
        grounds:
          - errors[ERR_INVALID_STATE_TRANSITION]
          - state_machines.SellingAgreement.PENDING_to_ACTIVE
          - state_machines.NavRecord.DRAFT_to_ADVISOR_REVIEW
        distinguishing_aspect: |
          Replaying an already-applied transition must be an error, not a no-op
          200: the row keeps the version it reached on the first call, so a client
          that retries cannot silently inflate version or re-fire side effects.
        test_recipe:
          setup:
            - "Offering 'Replay REIT' EFFECTIVE with one ACTIVE agreement and one NAV record already in ADVISOR_REVIEW."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Replay REIT", minimum_offering_amount_cents: 25000000, maximum_offering_amount_cents: 90000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Replay Placement", crd_number: "CRD-250001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 700 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { sa_v_after_first: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: SponsorOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gross_asset_value_cents: 0, other_liabilities_cents: 0, expected_share_class_version: "${sc_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
              captures: { nav_v_after_first: $.data.version }
          trigger:
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { sa_replay_error: $.data.error_id }
            - call: "POST /nav-records/${nav_id}/status"
              payload: { to_status: "ADVISOR_REVIEW" }
              as: SponsorOperator
              captures: { nav_replay_error: $.data.error_id }
          assert:
            - "sa_v_after_first == 2 and nav_v_after_first == 2"
            - "sa_replay_error == \"ERR_INVALID_STATE_TRANSITION\" with http status 409"
            - "nav_replay_error == \"ERR_INVALID_STATE_TRANSITION\""
            - "SellingAgreement.${sa_id}.version == 2 (unchanged by the replay)"
            - "NavRecord.${nav_id}.version == 2 (unchanged by the replay)"
            - "BrokerDealer.${bd_id}.suspended_agreement_count == 0"

      - name: offering_three_axes_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Offering.registration_status
          - state_machines.Offering.escrow_status
          - state_machines.Offering.repurchase_plan_status
        excluded_because:
          difficulty_instance: offering_parallel_axes_independent_with_locked_escrow_axis
          rationale: |
            The §1.8 instance already drives registration through
            EFFECTIVE -> SUSPENDED -> EFFECTIVE and the repurchase plan through
            SUSPEND -> RESUME while the escrow axis stays BROKEN, and asserts that
            a terminal escrow axis does not freeze the other two. A breadth copy
            would test the identical parallel-shape claim on the same three
            fields.

      - name: settlement_cascades_down_from_period_to_lot_to_investor
        claim_type: cascade_down
        grounds:
          - state_machines.RepurchasePeriod.OPEN_to_PROCESSED
          - state_machines.ShareLot.OPEN_to_CLOSED
          - state_machines.Investor.ACTIVE_to_CLOSED_NO_POSITION
        excluded_because:
          difficulty_instance: period_processing_closes_lot_then_closes_investor_account
          rationale: |
            The §1.8 instance already walks the full three-level cascade from a
            single processing call — period PROCESSED, the FIFO-consumed lot
            CLOSED, and the investor's account_status CLOSED_NO_POSITION only once
            no OPEN lot survives — including the case where a second lot keeps the
            account ACTIVE.

      - name: barring_a_firm_bubbles_into_agreements_and_subscriptions
        claim_type: cross_entity
        grounds:
          - state_machines.BrokerDealer.HEIGHTENED_SUPERVISION_to_BARRED
          - state_machines.SellingAgreement
          - state_machines.Subscription
        excluded_because:
          difficulty_instance: broker_dealer_barred_cascades_agreements_then_pending_subscriptions
          rationale: |
            The §1.8 instance already asserts the two-hop cross-entity fan-out of a
            single BARRED transition (every PENDING/ACTIVE/SUSPENDED agreement
            TERMINATED, then every PENDING subscription under those agreements
            REJECTED with rejection_reason BROKER_DEALER_BARRED) and that ESCROWED
            subscriptions are deliberately left alone.

      - name: rescission_compensates_the_acceptance_it_reverses
        claim_type: compensation
        grounds:
          - state_machines.Subscription.ACCEPTED_to_RESCINDED
          - state_machines.ShareLot.OPEN_to_RESCINDED
          - calculations.aggregate_nav
        excluded_because:
          difficulty_instance: rescission_restores_share_and_proceeds_conservation
          rationale: |
            The §1.8 instance already asserts the compensating invariant: after
            rescission the offering's gross_proceeds_cents, aggregate_nav_cents,
            the class's shares_outstanding_e4 and the investor's totals all return
            exactly to their pre-acceptance values while the RESCINDED rows remain
            as an audit trail.

      - name: publishing_nav_resyncs_offering_aggregate_nav_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.NavRecord.ADVISOR_CONFIRMED_to_PUBLISHED
          - calculations.aggregate_nav
          - calculations.transaction_price_selection
          - entities.Offering.fields.aggregate_nav_cents
        distinguishing_aspect: |
          aggregate_nav_cents is a stored ledger that must be re-derived at exactly
          one moment — PUBLISHED — and not before: a DRAFT or ADVISOR_CONFIRMED
          record carrying a lower NAV must leave the offering total untouched, and
          the publish call must then move it from 30000000 to 27000000 in the very
          same response.
        test_recipe:
          setup:
            - "Offering 'Ledgerlink REIT' with minimum 30000000, one zero-load class I."
            - "One investor subscribes 30000000 cents, escrow BREAKs at the initial price 1000, minting a 300000000 e4 lot."
            - "Clock moved to 2026-09-02 so the August period has elapsed."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Ledgerlink REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Ledgerlink Placement", crd_number: "CRD-260001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Marta Kilbride", email: "marta.kilbride@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-MARTA-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 30000000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
              captures: { agg_after_break: $.data.aggregate_nav_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
