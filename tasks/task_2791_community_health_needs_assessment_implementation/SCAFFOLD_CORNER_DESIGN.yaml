# Scaffold Corner Design (§1.9) — breadth coverage of every testable claim in
# SCAFFOLD.yaml §1.1-§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not
# already assert. Sections and claim_type values come from the scaffold
# generator's references/claim-extraction-guide.md.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_assessment_cycle_returns_201_with_all_declared_fields
        claim_type: Creation
        grounds:
          - entities.AssessmentCycle
          - endpoints.POST_/assessment-cycles
          - response_envelope.success
        distinguishing_aspect: "A cycle created with the four required inputs returns 201 with the success envelope, a prefix-free UUID id, version 1 and every computed counter at its declared default."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "GET /assessment-cycles"
              payload: { limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
          assert:
            - "HTTP 201 with response_type == \"object\" and meta.api_request_id / meta.api_request_timestamp present"
            - "data.id is a UUID with no type prefix; data.version == 1; created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "data.fiscal_year == 2026, service_area_name == \"Riverbend County\", prior_year_cost_to_charge_ratio == 0.3200, total_operating_expense_cents == 120000000"
            - "data.status == DRAFT, posture == OPEN, public_availability_met == false"
            - "data.completed_interview_count == 0, sufficient_indicator_count == 0, selected_priority_count == 0, review_flag_count == 0, board_deferral_count == 0, mid_cycle_adjustment_count == 0, annual_report_count == 0"
            - "data.adopted_at, adoption_board_user_id, votes_for_at_adoption, votes_against_at_adoption, public_url, public_comment_channel, published_at, return_form_id and filed_at are all null"

      - name: create_stakeholder_interview_applies_scheduled_and_null_completion_defaults
        claim_type: Defaults
        grounds:
          - entities.StakeholderInterview.fields.status
          - entities.StakeholderInterview.fields.concern_ratings
          - entities.StakeholderInterview.fields.completed_at
        distinguishing_aspect: "Omitting every optional completion field leaves status at its declared default SCHEDULED with concern_ratings, attendee_count, completed_at and cancel_reason all null."
        test_recipe:
          setup:
            - "AssessmentCycle in INPUT_GATHERING with one INTERNAL facilitator party"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
          assert:
            - "HTTP 201, data.status == SCHEDULED"
            - "data.concern_ratings == null, attendee_count == null, completed_at == null, cancel_reason == null"
            - "data.version == 1 and AssessmentCycle.${cyc}.completed_interview_count == 0"

      - name: expense_posting_stamps_posted_by_user_id_from_header
        claim_type: System Fields
        grounds:
          - entities.ExpensePosting.fields.posted_by_user_id
          - entities.ExpensePosting.fields.valuation_basis_at_posting
          - entities.CommunityBenefitReport.fields.created_by_user_id
        distinguishing_aspect: "posted_by_user_id, created_by_user_id, valuation_basis_at_posting and ratio_applied are server-stamped from the acting X-User-ID and the report's own state; none of them appear in the endpoint's input schema."
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with prior_year_cost_to_charge_ratio 0.3200"
            - "one OPEN CommunityBenefitReport created by u_officer_1"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 1234567, direct_cost_cents: 0, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_2"
          assert:
            - "HTTP 201, data.posted_by_user_id == \"u_officer_2\" (the acting header, not the report's creator)"
            - "CommunityBenefitReport.${rep}.created_by_user_id == \"u_officer_1\" is unchanged"
            - "data.valued_cents == 395061, ratio_applied == 0.3200, valuation_basis_at_posting == PROVISIONAL, status == POSTED"
            - "data.voided_by_user_id == null and void_reason == null"

      - name: health_indicator_derived_fields_recomputed_on_each_data_point
        claim_type: Computed Fields
        grounds:
          - entities.HealthIndicator.fields.severity_score
          - calculations.indicator_severity_score
          - calculations.indicator_disparity_ratio
        distinguishing_aspect: "The indicator's five derived fields are recomputed on every data-point write: after one OVERALL row severity_score is 77.50 with disparity_ratio still null and data_state INSUFFICIENT, and only the second subgroup row flips data_state to SUFFICIENT with disparity_ratio 1.60."
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with one HealthIndicator (benchmark_value 12.0) and no data points"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
          trigger:
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "GET /health-indicators/${ind}"
              payload: {}
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "GET /health-indicators/${ind}"
              payload: {}
              as: CommunityBenefitOfficer
          assert:
            - "after trigger call 2: latest_overall_value == 18.6, severity_score == 77.50, disparity_ratio == null, subgroup_count == 0, evidence_count == 1, data_state == INSUFFICIENT"
            - "after trigger call 5: severity_score == 77.50, disparity_ratio == 1.60, subgroup_count == 2, evidence_count == 3, data_state == SUFFICIENT"
            - "AssessmentCycle.${cyc}.sufficient_indicator_count == 1 only after the second subgroup row lands"

      - name: get_health_indicator_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/health-indicators/{indicator_id}
          - entities.HealthIndicator
        distinguishing_aspect: "GET /health-indicators/{indicator_id} echoes exactly the row created by the POST, including the same id and version, wrapped in the object envelope."
        test_recipe:
          setup:
            - "AssessmentCycle in DATA_COLLECTION with one HealthIndicator"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "CHRONIC_DISEASE", name: "Adult diabetes prevalence", benchmark_value: 9.5 }
              as: DataSteward
              captures: { ind: $.data.id }
          trigger:
            - call: "GET /health-indicators/${ind}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200 with response_type == \"object\""
            - "data.id == ${ind}, data.cycle_id == ${cyc}, domain == CHRONIC_DISEASE, name == \"Adult diabetes prevalence\", benchmark_value == 9.5"
            - "data.version == 1, data.data_state == INSUFFICIENT, severity_score == null, evidence_count == 0"

      - name: list_health_indicators_paginates_and_filters_by_cycle
        claim_type: Listing
        grounds:
          - endpoints.GET_/health-indicators
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two indicators on one cycle and one on another, GET /health-indicators?cycle_id=&limit=1&offset=0 returns exactly one row with total_count 2 and has_more true, and offset 1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "cycle A in DATA_COLLECTION with two HealthIndicator rows; cycle B in DATA_COLLECTION with one HealthIndicator row"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc_a: $.data.id }
            - call: "POST /assessment-cycles/${cyc_a}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc_a}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc_a}", domain: "CHRONIC_DISEASE", name: "Adult diabetes prevalence", benchmark_value: 9.5 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2027, service_area_name: "Northside District", prior_year_cost_to_charge_ratio: 0.3000, total_operating_expense_cents: 90000000 }
              as: CommunityBenefitOfficer
              captures: { cyc_b: $.data.id }
            - call: "POST /assessment-cycles/${cyc_b}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc_b}", domain: "ACCESS_TO_CARE", name: "Uninsured adult rate", benchmark_value: 8.0 }
              as: CommunityBenefitOfficer
          trigger:
            - call: "GET /health-indicators"
              payload: { cycle_id: "${cyc_a}", limit: 1, offset: 0 }
              as: CommunityBenefitOfficer
            - call: "GET /health-indicators"
              payload: { cycle_id: "${cyc_a}", limit: 1, offset: 1 }
              as: CommunityBenefitOfficer
            - call: "GET /health-indicators"
              payload: { cycle_id: "${cyc_a}", domain: "CHRONIC_DISEASE", limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 200, response_type == \"array\", exactly 1 row returned, total_count == 2, has_more == true"
            - "trigger call 2: exactly 1 row returned, total_count == 2, has_more == false, and it is a different id than call 1 returned"
            - "neither call 1 nor call 2 returns the indicator belonging to cycle B"
            - "trigger call 3: exactly 1 row returned with domain == CHRONIC_DISEASE, total_count == 1, has_more == false — filters compose with pagination"

      - name: get_indicator_with_unknown_id_returns_indicator_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_3
          - errors.ERR_INDICATOR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID in {indicator_id} yields ERR_INDICATOR_NOT_FOUND with HTTP 404, and the same unknown id in a nested data-point path resolves the parent first."
        test_recipe:
          setup:
            - "empty database except one AssessmentCycle"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
          trigger:
            - call: "GET /health-indicators/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators/00000000-0000-4000-8000-000000000abc/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "GET /assessment-cycles/00000000-0000-4000-8000-000000000fff"
              payload: {}
              as: PublicViewer
          assert:
            - "trigger call 1: HTTP 404 with response_type == \"error\" and data.error_id == ERR_INDICATOR_NOT_FOUND"
            - "trigger call 2: HTTP 404 with data.error_id == ERR_INDICATOR_NOT_FOUND — the path id is resolved before any body validation runs"
            - "trigger call 3: HTTP 404 with data.error_id == ERR_CYCLE_NOT_FOUND"

      - name: create_assessment_cycle_without_total_operating_expense_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_4
          - errors.ERR_VALIDATION
          - endpoints.POST_/assessment-cycles
        distinguishing_aspect: "Each of the four required inputs on POST /assessment-cycles is individually mandatory: omitting total_operating_expense_cents or service_area_name returns ERR_VALIDATION with HTTP 400 and creates nothing."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "GET /assessment-cycles"
              payload: { limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
            - call: "GET /assessment-cycles"
              payload: { limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 400 with data.error_id == ERR_VALIDATION"
            - "trigger call 2: HTTP 400 with data.error_id == ERR_VALIDATION"
            - "trigger call 3: total_count == 0 — neither rejected request persisted a cycle"

      - name: input_type_and_range_constraints_rejected_across_endpoints
        claim_type: Type Constraints
        grounds:
          - validations.priority_4
          - entities.AssessmentCycle.fields.prior_year_cost_to_charge_ratio
          - entities.StakeholderInterview.fields.ends_at
          - entities.PriorityCandidate.fields.hospital_capacity_score
        distinguishing_aspect: "Enum membership, decimal-place width, numeric range and the ends_at > starts_at ordering are all enforced by the priority-4 body rule: a three-decimal ratio, an unknown sector, a capacity score of 100.01 and a reversed interview window each return ERR_VALIDATION."
        test_recipe:
          setup:
            - "AssessmentCycle in INPUT_GATHERING with one INTERNAL facilitator party"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2027, service_area_name: "Northside District", prior_year_cost_to_charge_ratio: 0.320, total_operating_expense_cents: 90000000 }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "NEIGHBORHOOD_GROUP", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T15:00:00Z", ends_at: "2026-04-06T14:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T09:00:00Z", ends_at: "2026-04-06T14:00:00Z" }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 400 with data.error_id == ERR_VALIDATION — prior_year_cost_to_charge_ratio must carry exactly 4 decimal places"
            - "trigger call 2: HTTP 400 with data.error_id == ERR_VALIDATION — NEIGHBORHOOD_GROUP is not a declared sector member"
            - "trigger call 3: HTTP 400 with data.error_id == ERR_VALIDATION — ends_at must be strictly after starts_at"
            - "trigger call 4: HTTP 400 with data.error_id == ERR_VALIDATION — a 300-minute window exceeds the 240-minute maximum"
            - "no StakeholderInterview row exists for the cycle after the four rejections"

      - name: create_priority_candidate_with_unknown_indicator_id_returns_indicator_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_5
          - entities.PriorityCandidate.fields.indicator_id
          - errors.ERR_INDICATOR_NOT_FOUND
        distinguishing_aspect: "Body foreign keys are resolved in declaration order: an unknown cycle_id reports ERR_CYCLE_NOT_FOUND even when indicator_id is also unknown, and a real cycle with an unknown indicator_id reports ERR_INDICATOR_NOT_FOUND."
        test_recipe:
          setup:
            - "AssessmentCycle in PRIORITIZATION with one SUFFICIENT indicator and one completed interview"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
