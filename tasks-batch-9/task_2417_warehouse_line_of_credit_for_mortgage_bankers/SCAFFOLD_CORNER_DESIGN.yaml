      - name: corner_val_duplicate_rate_row_and_duplicate_covenant_period
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - errors.ERR_DUPLICATE_ADVANCE_RATE
          - errors.ERR_DUPLICATE_COVENANT_PERIOD
        distinguishing_aspect: |
          Two independent uniqueness scopes on the same parent, each 409, each keyed on a
          different column: (facility_id, product_code) for rate rows and
          (facility_id, period_end) for covenant tests. The pass arms prove the scope is
          the column and not the parent — a different product_code and a different
          period_end both succeed on the same facility.
        test_recipe:
          setup:
            - "One PENDING_APPROVAL facility with a CONFORMING rate row already configured."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
          trigger:
            - call: "POST /facilities/${fac_id}/product-advance-rates"
              payload: { product_code: "CONFORMING", advance_rate: 0.95, dwell_limit_days: 25 }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/product-advance-rates"
              payload: { product_code: "JUMBO", advance_rate: 0.95, dwell_limit_days: 25 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { par_jumbo_id: "$.data.id" }
            - *c_approve_facility
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 200000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cov_q2_id: "$.data.id" }
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2100000000, liquidity_cents: 900000000, net_income_cents: 250000000 }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-03-31", tangible_net_worth_cents: 1900000000, liquidity_cents: 700000000, net_income_cents: 150000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { cov_q1_id: "$.data.id" }
            - call: "GET /facilities/${fac_id}/product-advance-rates"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "GET /facilities/${fac_id}/covenant-tests"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "the duplicate CONFORMING rate row returns HTTP 409 with data.error_id == ERR_DUPLICATE_ADVANCE_RATE"
            - "the JUMBO rate row returns HTTP 201 — uniqueness is scoped to (facility_id, product_code)"
            - "the duplicate 2026-06-30 covenant test returns HTTP 409 with data.error_id == ERR_DUPLICATE_COVENANT_PERIOD, even though every other field differs"
            - "the 2026-03-31 covenant test returns HTTP 201"
            - "GET product-advance-rates returns total_count == 2 and the surviving CONFORMING row still has advance_rate 0.98 — the rejected duplicate did not overwrite it"
            - "GET covenant-tests returns total_count == 2 ordered period_end ASC: ${cov_q1_id} (2026-03-31) then ${cov_q2_id} (2026-06-30)"
            - "CovenantTest.${cov_q2_id}.status == PASS and CovenantTest.${cov_q1_id}.status == PASS"
            - "both tests used profitability_variant ANNUALIZED_QUARTER — the prior-set cardinality never reached TTM_QUARTERS"
            - "WarehouseFacility.${fac_id}.consecutive_breach_count == 0, last_covenant_status == PASS, status == ACTIVE"

