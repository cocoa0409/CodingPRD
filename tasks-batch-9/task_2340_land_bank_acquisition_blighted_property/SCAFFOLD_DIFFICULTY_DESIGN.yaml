            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p1_id}", funding_source_id: "${fs_acq_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 10000, donor_name: "Dell Street Trust" }
              as: IntakeOfficer
