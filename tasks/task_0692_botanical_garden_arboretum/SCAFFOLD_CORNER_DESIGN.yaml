# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Botanical Garden / Arboretum — Membership & Admission Platform
# Breadth probe across claim-extraction-guide sections; §1.8 depth corners stubbed.
# Clock default = 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_garden_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Garden
          - endpoints
        distinguishing_aspect: "POST /v1/gardens with only name -> 201; timezone defaults to America/New_York, reciprocal_discount_pct 0.5, household_member_cap 2."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/gardens"
              payload: { name: "Sunflower State Arboretum" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Garden.${g_id}.timezone == America/New_York"
            - "Garden.${g_id}.household_member_cap == 2"
            - "Garden.${g_id}.guest_pass_grant_patron == 8"
            - "Garden.${g_id}.version == 1"

      - name: get_membership_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Membership
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /v1/memberships/{nonexistent-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Visitor
              as_user_id: "anon-z"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_membership_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Membership.fields.primary_member_name
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /v1/memberships omitting required primary_member_name -> ERR_VALIDATION 422."
        test_recipe:
          setup: ["Garden + INDIVIDUAL plan exist."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Tulip Terrace" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", auto_renew: false }
              as: Visitor
              as_user_id: "anon-mm"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_membership_invalid_enum_tier_via_plan_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.MembershipPlan.fields.tier
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /v1/membership-plans with tier='GOLD' (not in INDIVIDUAL|HOUSEHOLD|PATRON) -> ERR_VALIDATION 422."
        test_recipe:
          setup: ["Garden exists."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Umbel Acres" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "GOLD", annual_fee_cents: 5000 }
              as: GardenAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: membership_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Membership.fields.status
          - entities.Membership.fields.paid_total_cents
        distinguishing_aspect: "New membership status is system-set PENDING and paid_total_cents 0 regardless of input; computed/system fields not client-settable."
        test_recipe:
          setup: ["Garden + INDIVIDUAL plan exist."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Verbena Vale" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Vi", auto_renew: false }
              as: Visitor
              as_user_id: "anon-vi"
              captures: { m_id: $.data.id }
          assert:
            - "Membership.${m_id}.status == PENDING"
            - "Membership.${m_id}.paid_total_cents == 0"
            - "Membership.${m_id}.guest_passes_remaining == 0"
            - "Membership.${m_id}.renewal_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_membership_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Membership.PENDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating an ACTIVE membership (not PENDING) -> ERR_INVALID_STATE 409; no second charge."
        test_recipe:
          setup: ["Membership already ACTIVE."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Wisteria Way" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Wes", auto_renew: false }
              as: Visitor
              as_user_id: "anon-wes"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Membership.${m_id}.paid_total_cents == 12000"

      - name: cancel_already_cancelled_membership_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Membership.PENDING_or_ACTIVE_or_LAPSED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a CANCELLED membership (terminal) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Membership CANCELLED."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Xeranthemum Yard" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Xan", auto_renew: false }
              as: Visitor
              as_user_id: "anon-xan"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/memberships/${m_id}/cancel"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: renew_before_window_without_auto_renew_returns_window_not_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - errors[ERR_RENEWAL_WINDOW_NOT_OPEN]
        distinguishing_aspect: "Renew called well before term_end - 30 days with auto_renew=false -> ERR_RENEWAL_WINDOW_NOT_OPEN 409."
        test_recipe:
          setup: ["Membership ACTIVE at default clock; auto_renew=false; clock not advanced (far from term_end)."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Yarrow Yonder" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Yul", auto_renew: false }
              as: Visitor
              as_user_id: "anon-yul"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /v1/memberships/${m_id}/renew"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_RENEWAL_WINDOW_NOT_OPEN"

      - name: activate_against_inactive_plan_returns_plan_inactive
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Membership.PENDING_to_ACTIVE
          - errors[ERR_PLAN_INACTIVE]
          - entities.MembershipPlan.fields.active
        distinguishing_aspect: "Activating a membership whose plan was created with active=false -> ERR_PLAN_INACTIVE 409."
        test_recipe:
          setup: ["Plan with active=false; membership PENDING on it."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Zinnia Zone" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000, active: false }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Zoe", auto_renew: false }
              as: Visitor
              as_user_id: "anon-zoe"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_PLAN_INACTIVE"

      - name: reinstate_lapsed_membership_returns_active_fresh_term
        claim_type: Valid Transition
        grounds:
          - state_machines.Membership.LAPSED_to_ACTIVE
          - entities.Membership.fields.term_end
        distinguishing_aspect: "Reinstating a LAPSED membership at clock 2027-04-01 -> ACTIVE, term_end 2028-04-01, paid_total_cents 24000 (full fee added), renewal_count 1."
        test_recipe:
          setup: ["Membership ACTIVE then LAPSED by advancing clock past term_end with auto_renew=false."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Acanthus Annex" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/membership-plans"
              payload: { garden_id: "${g_id}", tier: "INDIVIDUAL", annual_fee_cents: 12000 }
              as: GardenAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /v1/memberships"
              payload: { garden_id: "${g_id}", plan_id: "${plan_id}", primary_member_name: "Abe", auto_renew: false }
              as: Visitor
              as_user_id: "anon-abe"
              captures: { m_id: $.data.id }
            - call: "POST /v1/memberships/${m_id}/activate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: GardenAdmin
          trigger:
            - call: "POST /v1/memberships/${m_id}/reinstate"
              payload: {}
              as: Visitor
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.status == ACTIVE"
            - "Membership.${m_id}.term_end == 2028-04-01T00:00:00Z"
            - "Membership.${m_id}.paid_total_cents == 24000"
            - "Membership.${m_id}.renewal_count == 1"

      - name: reservation_expires_on_clock_advance_releases_capacity
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Reservation.HELD_to_EXPIRED
          - entities.TimeSlot.fields.held_count
        distinguishing_aspect: "Advancing the clock to slot ends_at sweeps a still-HELD reservation to EXPIRED and releases held_count back to 0."
        test_recipe:
          setup: ["TimeSlot 10:00-12:00 capacity 5; one HELD reservation paid_heads 2."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Bluebell Basin" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-02T10:00:00Z", ends_at: "2026-04-02T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 2 }
              as: Visitor
              as_user_id: "anon-exp"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T12:00:00Z" }
              as: GardenAdmin
              captures: { expired: $.data.expired_reservation_ids }
          assert:
            - "Reservation.${res_id}.status == EXPIRED"
            - "TimeSlot.${s_id}.held_count == 0"

      - name: checkin_outside_slot_window_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Reservation.HELD_to_CHECKED_IN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Check-in before slot starts_at (clock still at default 2026-04-01) -> ERR_INVALID_STATE 409 because now < starts_at."
        test_recipe:
          setup: ["TimeSlot 2026-04-02 10:00-12:00; HELD reservation; clock left at default 2026-04-01."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Crocus Corner" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/time-slots"
              payload: { garden_id: "${g_id}", starts_at: "2026-04-02T10:00:00Z", ends_at: "2026-04-02T12:00:00Z", capacity: 5, ga_price_cents: 2000 }
              as: GardenStaff
              captures: { s_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { garden_id: "${g_id}", time_slot_id: "${s_id}", paid_heads: 1 }
              as: Visitor
              as_user_id: "anon-early"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: GardenStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reject_then_confirm_rejected_rental_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Rental.REQUESTED_to_REJECTED
          - state_machines.Rental.REQUESTED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming a REJECTED rental (terminal) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Venue + a REJECTED rental."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Daffodil Dell" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/venues"
              payload: { garden_id: "${g_id}", name: "Fern Room", hourly_rate_cents: 20000 }
              as: RentalCoordinator
              captures: { v_id: $.data.id }
            - call: "POST /v1/rentals"
              payload: { garden_id: "${g_id}", venue_id: "${v_id}", starts_at: "2026-05-03T10:00:00Z", ends_at: "2026-05-03T11:00:00Z" }
              as: Visitor
              as_user_id: "anon-rr"
              captures: { r_id: $.data.id }
            - call: "POST /v1/rentals/${r_id}/reject"
              payload: {}
              as: RentalCoordinator
          trigger:
            - call: "POST /v1/rentals/${r_id}/confirm"
              payload: {}
              as: RentalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: close_already_closed_campaign_returns_campaign_closed
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ConservancyFund.OPEN_to_CLOSED
          - errors[ERR_CAMPAIGN_CLOSED]
        distinguishing_aspect: "Closing an already-CLOSED conservancy campaign -> ERR_CAMPAIGN_CLOSED 409."
        test_recipe:
          setup: ["ConservancyFund created then CLOSED."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Edelweiss Estate" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/conservancy-funds"
              payload: { garden_id: "${g_id}", match_ratio: 0.5, match_cap_cents: 10000 }
              as: DevelopmentOfficer
              captures: { f_id: $.data.id }
            - call: "POST /v1/conservancy-funds/${f_id}/close-campaign"
              payload: {}
              as: DevelopmentOfficer
          trigger:
            - call: "POST /v1/conservancy-funds/${f_id}/close-campaign"
              payload: {}
              as: DevelopmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_CAMPAIGN_CLOSED"

      - name: reservation_fork_to_checked_in_already_covered
        claim_type: Valid Transition
        grounds:
          - state_machines.Reservation.HELD_to_CHECKED_IN
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_reservation_fork_join_three_terminals
          rationale: "HELD->CHECKED_IN happy path and held_count retention asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: donation_deductible_general_above_threshold_subtracts_fmv
        claim_type: Correct Result
        grounds:
          - calculations.donation_deductible
          - entities.Donation.fields.tax_deductible_cents
        distinguishing_aspect: "GENERAL gift 30000 (>= 25000 threshold) -> tax_deductible_cents 28000 (30000 - 2000 FMV)."
        test_recipe:
          setup: ["Garden exists."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Fuchsia Fields" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /v1/donations"
              payload: { garden_id: "${g_id}", amount_cents: 30000, designation: "GENERAL" }
              as: DevelopmentOfficer
              captures: { d_id: $.data.id }
          assert:
            - "Donation.${d_id}.tax_deductible_cents == 28000"
            - "Donation.${d_id}.status == RECORDED"

      - name: donation_deductible_general_below_threshold_fully_deductible
        claim_type: Constants Applied
        grounds:
          - calculations.donation_deductible
        distinguishing_aspect: "GENERAL gift 20000 (< 25000 threshold) -> tax_deductible_cents 20000 (no FMV subtracted)."
        test_recipe:
          setup: ["Garden exists."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Geranium Glen" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /v1/donations"
              payload: { garden_id: "${g_id}", amount_cents: 20000, designation: "GENERAL" }
              as: Visitor
              as_user_id: "anon-don"
              captures: { d_id: $.data.id }
          assert:
            - "Donation.${d_id}.tax_deductible_cents == 20000"

      - name: conservancy_match_caps_at_remaining_then_zero
        claim_type: Correct Result
        grounds:
          - calculations.conservancy_match
          - entities.ConservancyFund.fields.matched_total_cents
        distinguishing_aspect: "First CONSERVANCY gift 30000 with ratio 0.5 cap 10000 -> matched 10000 (raw 15000 clamped); a second 4000 gift -> matched stays 10000 (remaining cap 0)."
        test_recipe:
          setup: ["ConservancyFund OPEN, ratio 0.5, cap 10000."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Hyacinth Hollow" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/conservancy-funds"
              payload: { garden_id: "${g_id}", match_ratio: 0.5, match_cap_cents: 10000 }
              as: DevelopmentOfficer
              captures: { f_id: $.data.id }
            - call: "POST /v1/donations"
              payload: { garden_id: "${g_id}", amount_cents: 30000, designation: "CONSERVANCY" }
              as: DevelopmentOfficer
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /v1/donations"
              payload: { garden_id: "${g_id}", amount_cents: 4000, designation: "CONSERVANCY" }
              as: DevelopmentOfficer
              captures: { d2_id: $.data.id }
          assert:
            - "ConservancyFund.${f_id}.pledged_total_cents == 34000"
            - "ConservancyFund.${f_id}.matched_total_cents == 10000"

      - name: conservancy_match_zero_after_campaign_closed
        claim_type: Input Set Filtering
        grounds:
          - calculations.conservancy_match
          - state_machines.ConservancyFund.OPEN_to_CLOSED
        distinguishing_aspect: "A CONSERVANCY gift recorded AFTER the campaign is CLOSED accrues 0 match; pledged still increases."
        test_recipe:
          setup: ["ConservancyFund OPEN, ratio 0.5, cap 10000, then CLOSED."]
          setup_api_calls:
            - call: "POST /v1/gardens"
              payload: { name: "Ixia Isle" }
              as: GardenAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/conservancy-funds"
              payload: { garden_id: "${g_id}", match_ratio: 0.5, match_cap_cents: 10000 }
              as: DevelopmentOfficer
              captures: { f_id: $.data.id }
            - call: "POST /v1/conservancy-funds/${f_id}/close-campaign"
              payload: {}
              as: DevelopmentOfficer
          trigger:
            - call: "POST /v1/donations"
              payload: { garden_id: "${g_id}", amount_cents: 8000, designation: "CONSERVANCY" }
              as: DevelopmentOfficer
              captures: { d_id: $.data.id }
          assert:
            - "ConservancyFund.${f_id}.pledged_total_cents == 8000"
            - "ConservancyFund.${f_id}.matched_total_cents == 0"

      - name: event_ticket_non_member_full_list_price
        claim_type: Variant Selection
