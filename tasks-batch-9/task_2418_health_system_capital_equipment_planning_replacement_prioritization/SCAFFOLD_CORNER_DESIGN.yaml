              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a1_id}", asset_id: "${asset_ac_id}", clinical_justification: "CT replacement, ageing detector array.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500 }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /capital/requests/${r_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
            - call: "POST /capital/requests/${r_id}/screen"
              payload: { decision: "ACCEPT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c_id}/close-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c_id}/score"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
