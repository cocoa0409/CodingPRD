            - "Consult.${con1_id}.status == SCHEDULED, untouched"
            - "GET /glp1/consults with provider_id ${doc_id} returns total_count == 1"

  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics and endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: bmi_exactly_twenty_seven_with_one_comorbidity_qualifies
        grounds:
          - calculations.eligibility_bmi_assessment
          - entities.EligibilityScreening.fields.eligibility_band
          - state_machines.EligibilityScreening.DRAFT_to_ELIGIBLE
          - state_machines.EligibilityScreening.DRAFT_to_INELIGIBLE
        distinguishing_aspect: |
          Boundary metric one is the BMI band on POST /glp1/screenings/{id}/submit: 78.03 kg at
          170 cm rounds to exactly 27.0, which qualifies under the >= comparison when
          comorbidity_count is 1 and fails as BMI_BELOW_BAND when it is 0.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "Patient Rae, 170 cm and 78.03 kg, carries one comorbidity code."
            - "Patient Sol, identical body measurements, carries no comorbidity codes."
            - "Both screenings use labs collected 2026-05-20 with egfr 88.0."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710006001" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/patients"
              payload: { email: "rae@example.com", full_name: "Rae Idris", state_code: "CA", height_cm: 170, weight_kg: 78.03, payment_mode: "CASH", comorbidity_codes: ["TYPE_2_DIABETES"] }
              as: PlatformAdmin
              captures: { rae_id: "$.data.id" }
            - call: "POST /glp1/patients"
              payload: { email: "sol@example.com", full_name: "Sol Vera", state_code: "CA", height_cm: 170, weight_kg: 78.03, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { sol_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${rae_id}", recorded_weight_kg: 78.03, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rae_scr: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${sol_id}", recorded_weight_kg: 78.03, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { sol_scr: "$.data.id" }
          trigger:
            - call: "POST /glp1/screenings/${rae_scr}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/screenings/${sol_scr}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
          assert:
            - "EligibilityScreening.${rae_scr}.assessed_bmi == 27.0"
            - "EligibilityScreening.${rae_scr}.comorbidity_count == 1"
            - "EligibilityScreening.${rae_scr}.status == ELIGIBLE and eligibility_band == COMORBID and decision_reason == COMORBID_QUALIFIED"
            - "EligibilityScreening.${sol_scr}.assessed_bmi == 27.0"
            - "EligibilityScreening.${sol_scr}.status == INELIGIBLE and eligibility_band == NONE and decision_reason == BMI_BELOW_BAND"
            - "Patient.${rae_id}.eligibility_status == ELIGIBLE and Patient.${sol_id}.eligibility_status == INELIGIBLE"

      - name: titration_interval_exactly_twenty_eight_days_permits_escalation
        grounds:
          - calculations.titration_readiness_interval
          - state_machines.TitrationStep.DUE_to_ADMINISTERED
