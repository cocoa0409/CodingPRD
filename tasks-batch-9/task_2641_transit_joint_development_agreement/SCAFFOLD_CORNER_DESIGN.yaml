# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for task_2641_transit_joint_development_agreement
# Sections and claim_type values are taken from references/claim-extraction-guide.md only.
# Every test_recipe drives empty-DB -> precondition using endpoints declared in SCAFFOLD.yaml §1.5.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an excluded_because: stub instead.

scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_site_creation_returns_declared_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.AgencySite
          - endpoints[POST /jda/sites]
          - response_envelope.success
        distinguishing_aspect: |
          A POST /jda/sites body carrying only the seven declared input fields returns 201 with the
          system default status INVENTORIED, null readiness fields, a zeroed federal-interest ledger and
          the success envelope's meta.api_request_id — no readiness value is invented at intake.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-001", name: "Cedar Junction Parcel", address_line: "1 Cedar Junction", parcel_area_sqft: 54000, acquisition_funding_source: "LOCAL_ONLY", federal_interest_pct: 0 }
              as: RealEstateOfficer
              captures: { site_a: $.data.id, st: $.data.status, tier: $.data.readiness_tier, score: $.data.readiness_composite_score, basis: $.data.federal_interest_basis_cents, tfp: $.data.transit_facility_present, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id is a non-empty string"
            - "${st} == INVENTORIED"
            - "${tier} == null"
            - "${score} == null"
            - "${basis} == 0"
            - "${tfp} == false"
            - "${ver} == 1"
            - "AgencySite.${site_a}.site_code == TJD-C-001"
            - "AgencySite.${site_a}.parcel_area_sqft == 54000"

      - name: corner_site_retrieval_returns_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints[GET /jda/sites/{id}]
          - entities.AgencySite.fields.site_code
        distinguishing_aspect: |
          GET /jda/sites/{id} returns exactly the stored row — site_code TJD-C-002, parcel_area_sqft 61000,
          acquisition_funding_source FEDERAL_GRANT, federal_interest_pct 2.5 — with no recomputation of the
          still-null readiness fields.
        test_recipe:
          setup:
            - "One AgencySite created at INVENTORIED with no assessment yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-002", name: "Cedar East Parcel", address_line: "2 Cedar East", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
          trigger:
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: GrantsComplianceOfficer
              captures: { code: $.data.site_code, area: $.data.parcel_area_sqft, src: $.data.acquisition_funding_source, pct: $.data.federal_interest_pct, st: $.data.status }
          assert:
            - "HTTP status == 200"
            - "${code} == TJD-C-002"
            - "${area} == 61000"
            - "${src} == FEDERAL_GRANT"
            - "${pct} == 2.5"
            - "${st} == INVENTORIED"

      - name: corner_proposal_listing_pagination_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /jda/proposals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With exactly three SUBMITTED proposals on one solicitation, limit=2&offset=0 returns 2 items with
          total_count 3 and has_more true, and limit=2&offset=2 returns 1 item with total_count 3 and
          has_more false.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite released for solicitation with one ISSUED solicitation (affordable_housing_min_pct 15)"
            - "Three CLEAR prequalified developers, each with one SUBMITTED proposal on that solicitation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-003", name: "Cedar West Parcel", address_line: "3 Cedar West", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/developers"
              payload: { legal_name: "Birch Union Development Co", contact_email: "dev-b@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_b: $.data.id }
            - call: "POST /jda/developers"
              payload: { legal_name: "Cypress Yard Holdings LLC", contact_email: "dev-c@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_c: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_b}", proposed_structure: "FEE_DISPOSITION", proposed_purchase_price_cents: 42000000, affordable_units: 36, total_units: 180, transit_ridership_uplift: 1200, design_compliance_score: 70, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_b}"
              captures: { prop_b: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_c}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 1800000, affordable_units: 30, total_units: 150, transit_ridership_uplift: 400, design_compliance_score: 65, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_c}"
              captures: { prop_c: $.data.id }
          trigger:
            - call: "GET /jda/proposals"
              payload: { solicitation_id: "${sol_a}", limit: 2, offset: 0 }
              as: RealEstateOfficer
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /jda/proposals"
              payload: { solicitation_id: "${sol_a}", limit: 2, offset: 2 }
              as: RealEstateOfficer
              captures: { second_page_head: "$.data[0].id" }
          assert:
            - "First trigger call returns HTTP 200 with exactly 2 items in data, total_count == 3 and has_more == true"
            - "Second trigger call returns HTTP 200 with exactly 1 item in data, total_count == 3 and has_more == false"
            - "${first_page_head} is one of ${prop_a}, ${prop_b}, ${prop_c}"
            - "${second_page_head} is one of ${prop_a}, ${prop_b}, ${prop_c} and differs from ${first_page_head}"
            - "response_type == array on both pages"

      - name: corner_get_unknown_site_returns_site_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SITE_NOT_FOUND]
          - validations[priority=4]
          - response_envelope.error
        distinguishing_aspect: |
          GET /jda/sites/00000000-0000-0000-0000-000000000000 on an empty database returns HTTP 404 with
          data.error_id == ERR_SITE_NOT_FOUND and response_type == error.
        test_recipe:
          setup:
            - "Empty database — no AgencySite rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /jda/sites/00000000-0000-0000-0000-000000000000"
              payload: { }
              as: RealEstateOfficer
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_SITE_NOT_FOUND"
            - "${msg} is a non-empty string"
            - "response_type == error"

      - name: corner_site_create_missing_funding_source_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.AgencySite.fields.acquisition_funding_source
        distinguishing_aspect: |
          Omitting the required acquisition_funding_source field from POST /jda/sites returns 422
          ERR_INVALID_REQUEST and creates no AgencySite row.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-005", name: "Cedar Gap Parcel", address_line: "5 Cedar Gap", parcel_area_sqft: 40000, federal_interest_pct: 0 }
              as: RealEstateOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "No AgencySite with site_code TJD-C-005 exists afterwards"

      - name: corner_developer_defaults_applied_when_flags_omitted
        claim_type: defaults
        grounds:
          - entities.Developer.fields.prequalified
          - entities.Developer.fields.debarment_status
          - endpoints[POST /jda/developers]
        distinguishing_aspect: |
          POST /jda/developers with only legal_name and contact_email yields prequalified == false and
          debarment_status == CLEAR — the two declared defaults, not nulls.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /jda/developers"
              payload: { legal_name: "Dogwood Station Ventures LLC", contact_email: "dev-d@example.com" }
              as: RealEstateOfficer
              captures: { dev_d: $.data.id, preq: $.data.prequalified, deb: $.data.debarment_status }
          assert:
            - "HTTP status == 201"
            - "${preq} == false"
            - "${deb} == CLEAR"
            - "Developer.${dev_d}.legal_name == Dogwood Station Ventures LLC"

      - name: corner_assessment_composite_score_computed_at_intake
        claim_type: computed_fields
        grounds:
          - calculations.readiness_composite_score
          - entities.ReadinessAssessment.fields.composite_score
          - entities.ReadinessAssessment.fields.variant_applied
          - endpoints[POST /jda/sites/{id}/assessments]
        distinguishing_aspect: |
          Component scores 90/80/70/60 on a LOCAL_ONLY site produce the PRELIMINARY unweighted mean 75.00
          with variant_applied == PRELIMINARY and tier == null while status is DRAFT — the computed field is
          server-produced and the weighted CERTIFIED variant is not used at intake.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "One LOCAL_ONLY AgencySite with federal_interest_pct 0 at INVENTORIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-006", name: "Cedar Ridge Parcel", address_line: "6 Cedar Ridge", parcel_area_sqft: 48000, acquisition_funding_source: "LOCAL_ONLY", federal_interest_pct: 0, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
          trigger:
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 90, utility_score: 80, access_score: 70, entitlement_score: 60, encumbrance_count: 0, assessment_notes: "Intake screen" }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id, score: $.data.composite_score, variant: $.data.variant_applied, tier: $.data.tier, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${score} == 75.00"
            - "${variant} == PRELIMINARY"
            - "${tier} == null"
            - "${st} == DRAFT"
            - "AgencySite.${site_a}.readiness_composite_score == 75.00"
            - "AgencySite.${site_a}.status == ASSESSED"

      - name: corner_assessment_system_fields_generated_by_server
        claim_type: system_fields
        grounds:
          - entities.ReadinessAssessment.fields.status
          - entities.ReadinessAssessment.fields.certified_at
          - response_envelope.success
        distinguishing_aspect: |
          A freshly created ReadinessAssessment carries a server-minted id, created_at, updated_at and
          version 1, with status DRAFT and certified_at null — none of these four are accepted from the
          request body.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "One LOCAL_ONLY AgencySite at INVENTORIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-007", name: "Cedar Hollow Parcel", address_line: "7 Cedar Hollow", parcel_area_sqft: 48000, acquisition_funding_source: "LOCAL_ONLY", federal_interest_pct: 0, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
          trigger:
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 90, utility_score: 80, access_score: 70, entitlement_score: 60, encumbrance_count: 0 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id, ver: $.data.version, created: $.data.created_at, updated: $.data.updated_at, cert_at: $.data.certified_at, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${asmt_a} is a non-empty server-generated string"
            - "${ver} == 1"
            - "${created} is an ISO 8601 timestamp equal to 2026-08-01T00:00:00Z"
            - "${updated} is an ISO 8601 timestamp equal to 2026-08-01T00:00:00Z"
            - "${cert_at} == null"
            - "${st} == DRAFT"
            - "ReadinessAssessment.${asmt_a}.assessment_notes == \"\""

      - name: corner_solicitation_invalid_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Solicitation.fields.solicitation_type
        distinguishing_aspect: |
          solicitation_type "RFI" is outside the declared set {RFP, RFQ, UNSOLICITED_RESPONSE}, so
          POST /jda/sites/{id}/solicitations returns 422 ERR_INVALID_REQUEST and no Solicitation is created.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite certified READY and released to SOLICITATION_READY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-008", name: "Cedar Flats Parcel", address_line: "8 Cedar Flats", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
          trigger:
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFI", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15 }
              as: RealEstateOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /jda/sites/${site_a}/solicitations returns total_count == 0"
            - "AgencySite.${site_a}.status == SOLICITATION_READY"

      - name: corner_maintenance_charge_is_immutable_event_without_version
        claim_type: immutability
        grounds:
          - entities.MaintenanceCharge
          - calculations.maintenance_cost_allocation
          - endpoints[POST /jda/shared-facilities/{id}/maintenance-charges]
        distinguishing_aspect: |
          MaintenanceCharge is declared common_fields: false, so its 201 body exposes no version field and
          §1.5 declares no PATCH/PUT/DELETE for it; the AGENCY responsibility posture pins
          effective_share_applied 0.00, developer_share_cents 0 and agency_share_cents 30000.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "DRAFTING agreement on an UNDER_AGREEMENT site"
            - "SharedFacility on that site with maintenance_responsibility AGENCY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-009", name: "Cedar Bay Parcel", address_line: "9 Cedar Bay", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/close"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/award"
              payload: { proposal_id: "${prop_a}", negotiation_start_date: "2026-08-15", negotiation_end_date: "2027-01-15" }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v1: $.data.version }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_a: $.data.id }
            - call: "POST /jda/valuations/${val_a}/certify"
              payload: { }
              as: ValuationOfficer
            - call: "POST /jda/agreements"
              payload: { site_id: "${site_a}", developer_id: "${dev_a}", proposal_id: "${prop_a}", valuation_id: "${val_a}", structure: "GROUND_LEASE", term_years: 20, base_rent_cents: 2000000, revenue_share_pct: 0.05, projected_gross_revenue_cents: 12000000, affordable_units_committed: 50, total_units: 200, site_area_share_pct: 60, joint_use_committed: false }
              as: RealEstateOfficer
              captures: { jda_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/shared-facilities"
              payload: { facility_type: "PLAZA", total_bay_capacity: 4, maintenance_responsibility: "AGENCY", cost_share_pct_developer: 0 }
              as: TransitOperationsManager
              captures: { sf_a: $.data.id }
          trigger:
            - call: "POST /jda/shared-facilities/${sf_a}/maintenance-charges"
              payload: { jda_id: "${jda_a}", period_start: "2026-09-01", period_end: "2026-09-30", line_items: [ { description: "Sweeping", cost_cents: 10000 }, { description: "Lighting", cost_cents: 20000 } ] }
              as: TransitOperationsManager
              captures: { mc_a: $.data.id, share: $.data.effective_share_applied, total: $.data.total_cost_cents, devshare: $.data.developer_share_cents, agshare: $.data.agency_share_cents }
          assert:
            - "HTTP status == 201"
            - "${share} == 0.00"
            - "${total} == 30000"
            - "${devshare} == 0"
            - "${agshare} == 30000"
            - "The 201 response body contains no version field for MaintenanceCharge.${mc_a}"
            - "SCAFFOLD.yaml section 1.5 declares no PATCH, PUT or DELETE endpoint for maintenance charges"
