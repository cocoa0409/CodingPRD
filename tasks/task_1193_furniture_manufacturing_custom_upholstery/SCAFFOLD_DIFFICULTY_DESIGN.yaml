            - "After revise: CutPlan.${cp_id}.status == DRAFT and OrderLine.${line_id}.required_yards_final is null (revision loop returns to DRAFT)"
            - "Second approve: CutPlan.${cp_id}.status == APPROVED and OrderLine.${line_id}.required_yards_final == 7.100"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths ≥3 and ≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lot_recall_cascade
        grounds:
          - state_machines.MaterialLot.AVAILABLE_to_REJECTED
          - state_machines.MaterialAllocation.ACTIVE_to_RELEASED
          - state_machines.OrderLine.ALLOCATED_to_MATERIAL_SHORTFALL
          - state_machines.CustomerOrder.CONFIRMED_to_MATERIAL_HOLD
          - state_machines.CellBooking.BOOKED_to_RELEASED
        distinguishing_aspect: |
          Trigger = POST /mill/material-lots/{id}/reject-lot. Chain of depth 4 where each
          link is caused by the previous one: lot → REJECTED causes its ACTIVE allocation →
          RELEASED, which causes the line to recompute → MATERIAL_SHORTFALL, which causes
          the order CONFIRMED → MATERIAL_HOLD, which causes the line's BOOKED booking →
          RELEASED (cell.committed_hours 2.0 → 0.0).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-PM (pattern match, rule (A, ESPRESSO, allowed, 0), no components)"
            - "PLANT spec FAB-STRAIGHT (width 54, repeat 9.0, STRAIGHT); lotA AVAILABLE 10.0 yards and lotB AVAILABLE 10.0 yards (lotA received/inspected first)"
            - "Order ORD-RC with one PLANT_STOCK line qty 4 (requirement 14.950); confirm reserves lotA 10.000 + lotB 4.950 → CONFIRMED"
            - "A BOOKED CUT booking on cell C-CUT [2026-06-02T08:00, 2026-06-02T10:00) — cell committed_hours 2.0"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-PM", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: true, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-STRAIGHT", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, pattern_repeat_v_inches: 9.0, match_method: "STRAIGHT", price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
