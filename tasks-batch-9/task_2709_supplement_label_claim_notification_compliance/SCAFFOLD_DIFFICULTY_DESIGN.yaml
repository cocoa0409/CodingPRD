          Entity pair Ingredient -> StructureFunctionClaim: the claim is perfectly well formed
          (DRAFT with a DRAFT dossier carrying one study) yet cannot enter review because a
          THIRD entity, its Ingredient, sits in NDI_PENDING. Nothing about the claim changes
          between the rejected and the accepted attempt — only the ingredient's state, moved
          by an agency response on the notification.
