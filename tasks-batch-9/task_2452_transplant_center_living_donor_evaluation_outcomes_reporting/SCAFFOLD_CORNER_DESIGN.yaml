        + 45 = 1081) was refused with ERR_CIT_LIMIT_EXCEEDED, leaving seg1 PLANNED.
      - A second offer for 2026-08-09T06:00:00Z -> 2026-08-09T23:15:00Z (1035 + 45 = 1080, exactly at
