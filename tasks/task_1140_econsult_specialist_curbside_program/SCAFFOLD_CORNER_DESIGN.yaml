  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a request without X-User-ID / X-User-Role headers is rejected 400 before any role, existence, or state logic runs."
        test_recipe:
          setup: ["clock initialized to the default instant (any authenticated call would do; the trigger itself sends no headers)"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /econsult/consult-requests", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400, response_type == error"

      - name: provider_role_cannot_create_specialty_track
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Priority 2: ReferringProvider is not in the endpoint's roles for POST /specialty-tracks — 403 ERR_INSUFFICIENT_PERMISSIONS even with a perfectly valid payload."
        test_recipe:
          setup: ["provider registered"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000004001" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: NEUROLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, http 403"

      - name: unknown_consult_id_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Priority 3: a well-formed but unknown consult UUID returns 404 ERR_NOT_FOUND with the standard error envelope (meta + response_type error + data.error_id)."
        test_recipe:
          setup: ["clock initialized"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /econsult/consult-requests/00000000-0000-0000-0000-000000000000", as: ProgramCoordinator, captures: { err_id: $.data.error_id, err_msg: $.data.message } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"
            - "envelope carries meta.api_request_id and response_type == error"

      - name: stale_version_on_patch_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[consult-patch-stale-version]", "errors[ERR_STALE_CONSULT_VERSION]"]
        distinguishing_aspect: "OCC on ConsultRequest.version: after a successful PATCH bumps the version, replaying the same expected_consult_version MUST fail 412 ERR_STALE_CONSULT_VERSION — deterministically, with two sequential requests."
        test_recipe:
          setup: ["assigned consult; capture its version from the create response"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000004002" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000004002" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-V1", specialty_track_id: "${track_id}", question_text: "Anticoagulation choice in AF with CKD stage 3; asks about apixaban dosing thresholds.", icd10_primary: "I48", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "PATCH /econsult/consult-requests/${cons_id}", payload: { question_text: "Anticoagulation choice in AF with CKD stage 3b; asks about apixaban dose reduction criteria.", expected_consult_version: "${cv}" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cv2: $.data.version } }
            - { call: "PATCH /econsult/consult-requests/${cons_id}", payload: { question_text: "Anticoagulation choice in AF with CKD stage 3b and prior GI bleed; safest agent selection?", expected_consult_version: "${cv}" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "first PATCH succeeds and returns version == ${cv} + 1"
            - "second PATCH with the now-stale version fails 412 ERR_STALE_CONSULT_VERSION"
            - "the consult's question_text reflects the FIRST patch only"

      - name: stale_version_on_reroute_rejected
        claim_type: violation_to_error
        grounds: ["concurrency_rules[consult-reroute-stale-version]", "errors[ERR_STALE_CONSULT_VERSION]"]
        distinguishing_aspect: "The second OCC rule guards reroute: a QUEUED consult's version advances via a PATCH; a reroute carrying the pre-PATCH version MUST fail 412 even though QUEUED is a valid from-state, and a reroute with the fresh version then succeeds once a panel exists."
        test_recipe:
          setup: ["track with NO panel yet; consult created QUEUED; then panel membership + window added"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: NEUROLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000004003" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-V2", specialty_track_id: "${track_id}", question_text: "Essential tremor on propranolol; asks about primidone addition and driving restrictions.", icd10_primary: "G25", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id, cv: $.data.version, cst: $.data.status } }
            - { call: "PATCH /econsult/consult-requests/${cons_id}", payload: { urgency: "URGENT", expected_consult_version: "${cv}" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cv2: $.data.version } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Nora Neurologist", npi: "2000004003" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/reroute", payload: { expected_consult_version: "${cv}" }, as: ProgramCoordinator, captures: { err_id: $.data.error_id } }
            - { call: "POST /econsult/consult-requests/${cons_id}/reroute", payload: { expected_consult_version: "${cv2}" }, as: ProgramCoordinator, captures: { st: $.data.status, memb: $.data.assigned_membership_id } }
          assert:
            - "consult was QUEUED after create (empty pool)"
            - "reroute with stale version ${cv} fails 412 ERR_STALE_CONSULT_VERSION"
            - "reroute with current version ${cv2} succeeds: status == ASSIGNED, assigned_membership_id == ${memb_id}"

      - name: verdict_must_match_computed_band_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_VERDICT_SCORE_MISMATCH]", entities.QualityReview.fields.verdict]
