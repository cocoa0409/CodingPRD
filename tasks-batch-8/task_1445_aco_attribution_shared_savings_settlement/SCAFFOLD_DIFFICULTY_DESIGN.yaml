# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# ACO Attribution & Shared Savings Settlement
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: attribution_prospective_vs_retrospective_windows
        grounds:
          - calculations.attribution_alignment_run
          - entities.AttributionRecord.fields.methodology
        distinguishing_aspect: |
          Same claims, two methodology variants on the attribution domain: PROSPECTIVE
          (prior-year window) assigns beneficiary BDV to participant PA with plurality 50000;
          RETROSPECTIVE (performance-year window) assigns the SAME beneficiary to PB with
          plurality 70000 — disjoint half-open windows select disjoint claim sets, so the
          variants provably diverge on identical data.
        test_recipe:
          setup:
            - "Period OPEN, span 2026-01-01..2026-12-31; participants PA/PB; beneficiary BDV with a 2025-06-15 PART_B claim (50000, PA) and a 2026-03-10 PART_B claim (70000, PB)"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-DV", aco_name: "DV", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 5000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000002", legal_name: "PB", share_weight_bp: 3000 }, as: AcoAdministrator, captures: { pb: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-DV-1", birth_year: 1985 }, as: AcoAdministrator, captures: { bdv: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bdv}", participant_id: "${pa}", service_date: "2025-06-15", allowed_amount_cents: 50000, claim_type: "PART_B" }, as: ClaimsProcessor }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bdv}", participant_id: "${pb}", service_date: "2026-03-10", allowed_amount_cents: 70000, claim_type: "PART_B" }, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
          trigger:
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "PROSPECTIVE", window_start_date: "2025-01-01", window_end_date: "2026-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator, captures: { run_pro: $.data.id } }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator, captures: { run_ret: $.data.id } }
            - { call: "GET /aco/attribution-records?alignment_run_id=${run_pro}", as: AcoAdministrator, captures: { rec_pro_participant: "$.data[0].participant_id", rec_pro_cost: "$.data[0].plurality_cost_cents" } }
            - { call: "GET /aco/attribution-records?alignment_run_id=${run_ret}", as: AcoAdministrator, captures: { rec_ret_participant: "$.data[0].participant_id", rec_ret_cost: "$.data[0].plurality_cost_cents" } }
          assert:
            - "rec_pro_participant == ${pa} AND rec_pro_cost == 50000"
            - "rec_ret_participant == ${pb} AND rec_ret_cost == 70000"
            - "rec_pro_participant != rec_ret_participant  (same beneficiary, same claims, different variant)"

      - name: benchmark_provisional_vs_final_factor
        grounds:
          - calculations.benchmark_risk_adjustment
          - entities.Benchmark.fields.update_factor_used
        distinguishing_aspect: |
          Benchmark domain (distinct from attribution): identical attributed population
          (2 FINAL records; risk scores 1.40 and 1.00) yields PROVISIONAL total 2966400
          (factor 1.030) vs FINAL total 2940480 (factor 1.021) — same entity inputs,
          different variant factor, delta 25920.
        test_recipe:
          setup:
            - "Period OPEN with PA; beneficiaries BR (1960, dual+disabled -> risk 1.40) and BP (1990, no flags -> 1.00), each with one adjudicated 20000-cent PART_B visit to PA; RETROSPECTIVE run; period locked (records FINAL)"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-BV", aco_name: "BV", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-BV-R", birth_year: 1960, dual_eligible: true, disabled: true, esrd: false }, as: AcoAdministrator, captures: { br: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-BV-P", birth_year: 1990 }, as: AcoAdministrator, captures: { bp: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-02-05", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c2: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c2}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
          trigger:
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "PROVISIONAL", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator, captures: { b_prov_total: $.data.total_benchmark_cents, b_prov_months: $.data.beneficiary_months, b_prov_factor: $.data.update_factor_used } }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v3: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "FINAL", expected_agreement_period_version: "${p1_v3}" }, as: AcoAdministrator, captures: { b_fin_total: $.data.total_benchmark_cents, b_fin_factor: $.data.update_factor_used } }
          assert:
            - "b_prov_total == 2966400 AND b_prov_factor == 1.03"
            - "b_fin_total == 2940480 AND b_fin_factor == 1.021"
            - "b_prov_months == 24 AND (b_prov_total - b_fin_total) == 25920"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quality_gate_tiered_multiplier_branches
        grounds:
          - calculations.quality_gate_scoring
          - calculations.shared_savings_settlement
          - entities.Settlement.fields.quality_multiplier_snapshot
        distinguishing_aspect: |
          Mode (a) — >=3 inputs (track, per-measure rates/points, tier thresholds) with
          nested tier branches: aggregate score exactly == 0.7000 takes the FULL tier
          (multiplier 1.0000, >= boundary), driving pre-sequestration savings of
          round(58810 x 0.40 x 1.0000) = 23524 on a ONE_SIDED track.
        test_recipe:
          setup:
            - "Canonical ONE_SIDED period, locked, FINAL benchmark 2940480, expenditure 2881670 (gross 58810 == MSR 58810), scores M1 (3/4, 10pts) and M2 (13/20, 10pts) both VALIDATED -> aggregate exactly 0.7000"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-QG", aco_name: "QG", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 5000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-QG-R", birth_year: 1960, dual_eligible: true, disabled: true }, as: AcoAdministrator, captures: { br: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-QG-P", birth_year: 1990 }, as: AcoAdministrator, captures: { bp: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-02-05", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c2: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-03-01", allowed_amount_cents: 1500000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c3: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-03-02", allowed_amount_cents: 1341670, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c4: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c2}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c3}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c4}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "FINAL", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator, captures: { bench: $.data.id } }
            - { call: "POST /aco/quality-scores", payload: { agreement_period_id: "${p1}", measure_code: "M1", numerator: 3, denominator: 4, max_points: 10 }, as: QualityReporter, as_user_id: "qr-1", captures: { qs1: $.data.id } }
            - { call: "POST /aco/quality-scores", payload: { agreement_period_id: "${p1}", measure_code: "M2", numerator: 13, denominator: 20, max_points: 10 }, as: QualityReporter, as_user_id: "qr-1", captures: { qs2: $.data.id } }
            - { call: "POST /aco/quality-scores/${qs1}/review", payload: { outcome: "VALIDATED" }, as: QualityAuditor, as_user_id: "qa-1" }
            - { call: "POST /aco/quality-scores/${qs2}/review", payload: { outcome: "VALIDATED" }, as: QualityAuditor, as_user_id: "qa-1" }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v3: $.data.version } }
          trigger:
            - { call: "POST /aco/agreement-periods/${p1}/settlements", payload: { expected_agreement_period_version: "${p1_v3}" }, as: SettlementActuary, as_user_id: "sa-1", captures: { st1: $.data.id, q_score: $.data.quality_score_snapshot, q_mult: $.data.quality_multiplier_snapshot, gross: $.data.gross_savings_cents, pre_seq: $.data.shared_savings_pre_sequestration_cents } }
          assert:
            - "q_score == 0.7 (aggregate exactly at the 0.7000 full-tier boundary)"
            - "q_mult == 1.0 (>= boundary takes FULL tier, not partial)"
            - "gross == 58810 AND pre_seq == 23524"

      - name: distribution_floor_then_remainder_vs_naive_round
        grounds:
          - calculations.distribution_waterfall_allocation
          - entities.DistributionLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — pinned rounding order floor-per-line-then-remainder differs from naive
          round-half-up per line: pool 23054 with weights 5000/3000/2000 yields pinned lines
          {11528, 6916, 4610} (remainder penny to highest weight), whereas naive rounding
          yields {11527, 6916, 4611} — the implementations diverge on lines A and C.
        test_recipe:
          setup:
            - "Canonical ONE_SIDED period finalized settlement with distributable_pool_cents == 23054; participants PA/PB/PC weights 5000/3000/2000 (PA created first)"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-DW", aco_name: "DW", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 5000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000002", legal_name: "PB", share_weight_bp: 3000 }, as: AcoAdministrator, captures: { pb: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000003", legal_name: "PC", share_weight_bp: 2000 }, as: AcoAdministrator, captures: { pc: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-DW-R", birth_year: 1960, dual_eligible: true, disabled: true }, as: AcoAdministrator, captures: { br: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-DW-P", birth_year: 1990 }, as: AcoAdministrator, captures: { bp: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-02-05", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c2: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-03-01", allowed_amount_cents: 1500000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c3: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-03-02", allowed_amount_cents: 1341670, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c4: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c2}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c3}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c4}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "FINAL", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator }
            - { call: "POST /aco/quality-scores", payload: { agreement_period_id: "${p1}", measure_code: "M1", numerator: 3, denominator: 4, max_points: 10 }, as: QualityReporter, as_user_id: "qr-1", captures: { qs1: $.data.id } }
            - { call: "POST /aco/quality-scores/${qs1}/review", payload: { outcome: "VALIDATED" }, as: QualityAuditor, as_user_id: "qa-1" }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v3: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/settlements", payload: { expected_agreement_period_version: "${p1_v3}" }, as: SettlementActuary, as_user_id: "sa-1", captures: { st1: $.data.id, pool: $.data.distributable_pool_cents } }
            - { call: "POST /aco/settlements/${st1}/finalize", payload: {}, as: SettlementActuary, as_user_id: "sa-1" }
          trigger:
            - { call: "POST /aco/settlements/${st1}/distribution-runs", payload: {}, as: SettlementActuary, as_user_id: "sa-1", captures: { created: $.data.created_count, allocated: $.data.allocated_total_cents } }
            - { call: "GET /aco/distribution-lines?settlement_id=${st1}", as: SettlementActuary, captures: { line0_amount: "$.data[0].amount_cents", line0_participant: "$.data[0].participant_id", line1_amount: "$.data[1].amount_cents", line2_amount: "$.data[2].amount_cents", line2_participant: "$.data[2].participant_id" } }
          assert:
            - "pool == 23054 AND created == 3 AND allocated == 23054"
            - "line0_amount == 11528 AND line0_participant == ${pa}  (floor 11527 + remainder penny to highest weight; naive round gives 11527)"
            - "line1_amount == 6916"
            - "line2_amount == 4610 AND line2_participant == ${pc}  (naive round-half-up would give 4611)"
            - "line0_amount + line1_amount + line2_amount == 23054  (penny-exact pool conservation)"

      - name: sequestration_levy_base_pre_not_post
        grounds:
          - calculations.shared_savings_settlement
          - entities.Settlement.fields.sequestration_levy_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the levy is
          computed on the PRE-sequestration amount, so levy == round(0.02 x 23524) == 470 and
          net == 23524 - 470 == 23054; the alternative reading (levy on the post-levy
          payment) yields round(23524 x 0.02 / 1.02) == 461 and net 23063 — the two readings
          diverge by 9 cents and the scaffold pins the former.
        test_recipe:
          setup:
            - "Canonical ONE_SIDED period: locked, FINAL benchmark 2940480, expenditure 2881670, quality multiplier 1.0 (single score M1 3/4 VALIDATED)"
          setup_api_calls:
            - { call: "POST /aco/agreement-periods", payload: { aco_tax_id: "ACO-SQ", aco_name: "SQ", performance_start_date: "2026-01-01", performance_end_date: "2026-12-31", track: "ONE_SIDED" }, as: AcoAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /aco/participants", payload: { agreement_period_id: "${p1}", tin: "100000001", legal_name: "PA", share_weight_bp: 10000 }, as: AcoAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-SQ-R", birth_year: 1960, dual_eligible: true, disabled: true }, as: AcoAdministrator, captures: { br: $.data.id } }
            - { call: "POST /aco/beneficiaries", payload: { medicare_id: "MBI-SQ-P", birth_year: 1990 }, as: AcoAdministrator, captures: { bp: $.data.id } }
            - { call: "POST /aco/agreement-periods/${p1}/open", payload: {}, as: AcoAdministrator }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-02-01", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c1: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-02-05", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c2: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${br}", participant_id: "${pa}", service_date: "2026-03-01", allowed_amount_cents: 1500000, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c3: $.data.id } }
            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-03-02", allowed_amount_cents: 1341670, claim_type: "PART_A" }, as: ClaimsProcessor, captures: { c4: $.data.id } }
            - { call: "POST /aco/claims/${c1}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c2}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c3}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "POST /aco/claims/${c4}/adjudicate", payload: {}, as: ClaimsProcessor }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/alignment-runs", payload: { methodology: "RETROSPECTIVE", window_start_date: "2026-01-01", window_end_date: "2027-01-01", expected_agreement_period_version: "${p1_v}" }, as: AcoAdministrator }
            - { call: "POST /aco/agreement-periods/${p1}/lock-assignment", payload: {}, as: AcoAdministrator }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v2: $.data.version } }
            - { call: "POST /aco/agreement-periods/${p1}/benchmarks", payload: { variant: "FINAL", expected_agreement_period_version: "${p1_v2}" }, as: AcoAdministrator }
            - { call: "POST /aco/quality-scores", payload: { agreement_period_id: "${p1}", measure_code: "M1", numerator: 3, denominator: 4, max_points: 10 }, as: QualityReporter, as_user_id: "qr-1", captures: { qs1: $.data.id } }
            - { call: "POST /aco/quality-scores/${qs1}/review", payload: { outcome: "VALIDATED" }, as: QualityAuditor, as_user_id: "qa-1" }
            - { call: "GET /aco/agreement-periods/${p1}", as: AcoAdministrator, captures: { p1_v3: $.data.version } }
          trigger:
