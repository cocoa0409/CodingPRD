            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-02", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_b: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "stale sweep" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_a}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_a: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_b}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_b: $.data.id } }
            - { call: "POST /v1/assignments/${asg_b}/confirm", payload: {}, as: ProjectManager }
