          assert:
            - "${status_at_init} == BRIEFING and ${round_at_init} == 1"
            - "${status_after_remand} == REMANDED and ${round_after_remand} == 2"
            - "${status_second_briefing} == BRIEFING and ${round_second_briefing} == 2 (the machine re-entered a state it had already occupied)"
            - "Arbitration.${arb_id}.status == CLOSED"
            - "Arbitration.${arb_id}.round_number == 2"
            - "Arbitration.${arb_id}.award_outcome == AFFIRM"
            - "Arbitration.${arb_id}.closed_at == 2026-10-15T00:00:00Z"
            - "LiabilityAssessment.${la_id}.review_status == ARBITRATED"
            - "LiabilityAssessment.${la_id}.net_assessed_cents == 250000000 (an AFFIRM award changes no money)"
            - "ReviewRequest.${rr_id}.arbitration_deadline_at == 2026-11-30T00:00:00Z"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: vacate_award_unwinds_schedule_installments_employer_and_group_depth_five
        grounds:
          - state_machines.LiabilityAssessment.ISSUED_to_RESCINDED
          - state_machines.PaymentSchedule.ACTIVE_to_VOID
          - state_machines.Installment.SCHEDULED_to_VOID
          - state_machines.Employer.COMPLETE_WITHDRAWN_to_CONTRIBUTING
          - entities.ControlledGroup.fields.joint_exposure_cents
          - calculations.controlled_group_exposure_score
        distinguishing_aspect: |
          Triggered by POST /arbitrations/{id}/award with award_outcome VACATE, the chain is five
          links deep and each link is caused by the previous one: assessment RESCINDED -> because
          the assessment was rescinded the ACTIVE schedule becomes VOID -> because the schedule
          became VOID its installments become VOID -> because the installments left the ledger
          Employer.outstanding_liability_cents falls from 250000000 to 0 and the employer returns to
          CONTRIBUTING -> because the employer left the withdrawn set ControlledGroup
          joint_exposure_cents falls from 250000000 to 0 and exposure_score from 2500.0000 to 0.0.
        test_recipe:
          setup:
            - "Baseline 250000000-cent assessment ISSUED at 2026-08-01T00:00:00Z with 28 unpaid installments; Employer.outstanding_liability_cents 250000000 and ControlledGroup.joint_exposure_cents 250000000."
            - "Request for review filed 2026-09-01T00:00:00Z, DECIDED AFFIRMED at 2026-10-01T00:00:00Z, arbitration initiated 2026-10-15T00:00:00Z and advanced to HEARING."
