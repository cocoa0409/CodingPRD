# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: revenue_provisional_vs_final_diverges
        grounds:
          - calculations.order_totals
          - calculations.equipment_line_pricing
          - entities.RentalOrder.fields.quote_total_cents
          - entities.RentalOrder.fields.final_total_cents
        distinguishing_aspect: >
          PROVISIONAL quote_total_cents=69984 excludes sub-rental cost and uses reserved qty;
          FINAL final_total_cents=89984 adds sub_rental_cost_cents (20000) and uses checked_out_qty
          on the SAME RentalOrder (revenue domain) — the two variants diverge by exactly 20000.
        test_recipe:
          setup:
            - "Clock at 2026-06-05 (5 days before event -> rush window)."
            - "Customer credit_limit 100000000; Venue required_coverage 0."
            - "EquipmentItem LED daily_rate 12000, replacement 500000, total 20."
            - "Order 2026-06-10..2026-06-12; one HELD LED reservation qty 2 (3 billable days, 10% tier)."
            - "Order quoted (quote_total 69984), COI approved, confirmed; SubRental SUB_IN 20000 confirmed; loaded out/in; settled."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "Acme Productions", contact_email: "ops@acme.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "Grand Hall", address: "1 Main St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED Panel P3", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "Gala", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/sub-rentals", payload: { equipment_id: "${led_id}", reservation_id: "${res_id}", direction: "SUB_IN", vendor_name: "PeerAV", qty: 1, cost_cents: 20000 }, as: WarehouseManager, captures: { sr_id: "$.data.id" } }
            - { call: "POST /sub-rentals/${sr_id}/confirm", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager }
            - { call: "POST /equipment-reservations/${res_id}/check-in", payload: { damaged: false }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/load-in", payload: {}, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/settle", payload: {}, as: AccountManager }
          assert:
            - "RentalOrder.${ord_id}.quote_total_cents == 69984"
            - "RentalOrder.${ord_id}.final_total_cents == 89984"
            - "RentalOrder.${ord_id}.final_total_cents != RentalOrder.${ord_id}.quote_total_cents"
            - "RentalOrder.${ord_id}.pricing_variant == FINAL"

      - name: deposit_hold_vs_settlement_diverges
        grounds:
          - calculations.deposit_settlement
          - entities.RentalOrder.fields.deposit_held_cents
          - entities.RentalOrder.fields.deposit_captured_cents
          - entities.RentalOrder.fields.deposit_refunded_cents
        distinguishing_aspect: >
          Forward HOLD deposit_held_cents=360000 is a flat 20% of replacement value, independent of
          realized damage; chronological settlement captures the actual assessed damage via waterfall
          (100000 + 80000) = deposit_captured_cents=180000 with deposit_refunded_cents=180000 — two
          different computations on the deposit (liability) domain, a different entity domain than revenue.
        test_recipe:
          setup:
            - "Order confirmed with reservations whose replacement value sums to 1,800,000 -> deposit HOLD 360000."
            - "Order driven to LOADED_IN; two DamageReports assessed at 100000 and 80000, both CHARGED; then settle refunds remainder 180000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "Bravo Events", contact_email: "b@b.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "Arena", address: "2 Main St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED Panel", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "K2 Line Array", category: "SOUND", total_units: 8, daily_rate_cents: 15000, replacement_value_cents: 800000 }, as: WarehouseManager, captures: { arr_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "Concert", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_led: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${arr_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_arr: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_led}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_arr}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/damage-reports", payload: { reservation_id: "${res_led}", lost_units: 0, damaged_units: 1 }, as: WarehouseManager, captures: { dr1: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/damage-reports", payload: { reservation_id: "${res_arr}", lost_units: 0, damaged_units: 1 }, as: WarehouseManager, captures: { dr2: "$.data.id" } }
            - { call: "POST /damage-reports/${dr1}/assess", payload: { assessed_cost_cents: 100000 }, as: WarehouseManager }
            - { call: "POST /damage-reports/${dr2}/assess", payload: { assessed_cost_cents: 80000 }, as: WarehouseManager }
            - { call: "POST /damage-reports/${dr1}/charge", payload: {}, as: AccountManager }
            - { call: "POST /damage-reports/${dr2}/charge", payload: {}, as: AccountManager }
            - { call: "POST /equipment-reservations/${res_led}/check-in", payload: { damaged: false }, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_arr}/check-in", payload: { damaged: false }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/load-in", payload: {}, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/settle", payload: {}, as: AccountManager }
          assert:
            - "RentalOrder.${ord_id}.deposit_held_cents == 360000"
            - "RentalOrder.${ord_id}.deposit_captured_cents == 180000"
            - "RentalOrder.${ord_id}.deposit_refunded_cents == 180000"
            - "RentalOrder.${ord_id}.deposit_held_cents != RentalOrder.${ord_id}.deposit_captured_cents"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: crew_labor_overtime_operator_premium_mode_a
        grounds:
          - calculations.crew_labor_pricing
          - entities.CrewAssignment.fields.assignment_cost_cents
        distinguishing_aspect: >
          Mode (a): assignment_cost_cents=93600 comes from a >=3-input non-linear formula —
          max(hours,4) min-call floor, max(0,base-10) overtime band at 1.5x, and 1.20 OPERATOR
          premium — for a 12h OPERATOR shift at 6000/h; not a flat rate*hours product.
        test_recipe:
          setup:
            - "Crew member OPERATOR at 6000/h; order with one OPERATOR assignment scheduled 12h; order quoted."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "C", contact_email: "c@c.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V", address: "3 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /crew-members", payload: { name: "Op One", crew_role: "OPERATOR", hourly_rate_cents: 6000 }, as: CrewChief, captures: { crew_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/crew-assignments", payload: { crew_member_id: "${crew_id}", assignment_role: "OPERATOR", shift_start: "2026-06-10T08:00:00Z", shift_end: "2026-06-10T20:00:00Z", scheduled_hours: 12 }, as: CrewChief, captures: { ca_id: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
          assert:
            - "CrewAssignment.${ca_id}.assignment_cost_cents == 93600"
            - "RentalOrder.${ord_id}.crew_subtotal_cents == 93600"

      - name: equipment_line_rounding_per_line_then_sum_mode_b
        grounds:
          - calculations.equipment_line_pricing
          - entities.RentalOrder.fields.equipment_subtotal_cents
          - entities.EquipmentReservation.fields.line_charge_cents
        distinguishing_aspect: >
          Mode (b): two lines each round_half_up(27002.7)=27003 -> equipment_subtotal_cents=54006;
          summing the raw 54005.4 first then rounding yields 54005 — the scaffold pins
          round-per-line-then-sum, so the pinned answer is 54006, not 54005.
        test_recipe:
          setup:
            - "EquipmentItem DMX daily_rate 10001; order with two qty-1 reservations of 3 billable days each (10% tier); quoted."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "D", contact_email: "d@d.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V2", address: "4 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "DMX Controller", category: "LIGHTING", total_units: 10, daily_rate_cents: 10001, replacement_value_cents: 100000 }, as: WarehouseManager, captures: { dmx_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E2", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${dmx_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { r1: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${dmx_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { r2: "$.data.id" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
          assert:
            - "EquipmentReservation.${r1}.line_charge_cents == 27003"
            - "EquipmentReservation.${r2}.line_charge_cents == 27003"
            - "RentalOrder.${ord_id}.equipment_subtotal_cents == 54006"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_quote_revise_cycle
        grounds:
          - state_machines.RentalOrder.DRAFT_to_QUOTED
          - state_machines.RentalOrder.QUOTED_to_DRAFT
          - entities.RentalOrder.fields.pricing_variant
        distinguishing_aspect: >
          RentalOrder is cyclic: QUOTED->DRAFT->QUOTED. After revise, status=DRAFT and
          pricing_variant=NONE; re-quote returns status=QUOTED and pricing_variant=PROVISIONAL —
          a genuine loop, not a one-way linear pipeline.
        test_recipe:
          setup:
            - "Order with one HELD reservation; quoted, then revised back to DRAFT, then re-quoted."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "E", contact_email: "e@e.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V3", address: "5 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E3", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/revise", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager, captures: { st: "$.data.status" } }
          assert:
            - "RentalOrder.${ord_id}.status == QUOTED"
            - "RentalOrder.${ord_id}.pricing_variant == PROVISIONAL"

      - name: damage_report_branch_charge_vs_waive
        grounds:
          - state_machines.DamageReport.ASSESSED_to_CHARGED
          - state_machines.DamageReport.ASSESSED_to_WAIVED
          - entities.DamageReport.fields.captured_cents
        distinguishing_aspect: >
          From ASSESSED, DamageReport forks into CHARGED (captures 100000 from deposit,
          captured_cents=100000) or WAIVED (captures 0, captured_cents=0) — divergent side-effect
          sets from one state on a different entity than RentalOrder, a branching machine.
        test_recipe:
          setup:
            - "Order to IN_EVENT with a checked-out reservation and deposit held; two DamageReports assessed at 100000; one charged, one waived."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "F", contact_email: "f@f.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V4", address: "6 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E4", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/damage-reports", payload: { reservation_id: "${res_id}", damaged_units: 1 }, as: WarehouseManager, captures: { dr1: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/damage-reports", payload: { reservation_id: "${res_id}", damaged_units: 1 }, as: WarehouseManager, captures: { dr2: "$.data.id" } }
            - { call: "POST /damage-reports/${dr1}/assess", payload: { assessed_cost_cents: 100000 }, as: WarehouseManager }
            - { call: "POST /damage-reports/${dr2}/assess", payload: { assessed_cost_cents: 100000 }, as: WarehouseManager }
          trigger:
            - { call: "POST /damage-reports/${dr1}/charge", payload: {}, as: AccountManager }
            - { call: "POST /damage-reports/${dr2}/waive", payload: {}, as: AccountManager }
          assert:
            - "DamageReport.${dr1}.status == CHARGED"
            - "DamageReport.${dr1}.captured_cents == 100000"
            - "DamageReport.${dr2}.status == WAIVED"
            - "DamageReport.${dr2}.captured_cents == 0"
            - "RentalOrder.${ord_id}.deposit_captured_cents == 100000"
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_release_subrental_recompute_depth3
        grounds:
          - state_machines.RentalOrder.CONFIRMED_to_CANCELLED
          - state_machines.EquipmentReservation.HELD_to_RELEASED
          - state_machines.SubRental.CONFIRMED_to_CANCELLED
          - entities.RentalOrder.fields.sub_rental_cost_cents
        distinguishing_aspect: >
          Depth-3 chain triggered by order cancel: Order CONFIRMED->CANCELLED -> its HELD
          EquipmentReservation -> RELEASED -> that reservation's linked CONFIRMED SubRental ->
          CANCELLED -> RentalOrder.sub_rental_cost_cents recomputed 20000->0; each hop caused by
          the previous.
        test_recipe:
          setup:
            - "Order CONFIRMED (clock 2026-05-01) with one HELD LED reservation qty1 and a CONFIRMED SUB_IN sub-rental (cost 20000) linked to that reservation; deposit held 100000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "G", contact_email: "g@g.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V5", address: "7 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E5", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/sub-rentals", payload: { equipment_id: "${led_id}", reservation_id: "${res_id}", direction: "SUB_IN", vendor_name: "PeerAV", qty: 1, cost_cents: 20000 }, as: WarehouseManager, captures: { sr_id: "$.data.id" } }
            - { call: "POST /sub-rentals/${sr_id}/confirm", payload: {}, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/cancel", payload: {}, as: AccountManager }
          assert:
            - "RentalOrder.${ord_id}.status == CANCELLED"
            - "EquipmentReservation.${res_id}.status == RELEASED"
            - "SubRental.${sr_id}.status == CANCELLED"
            - "RentalOrder.${ord_id}.sub_rental_cost_cents == 0"
            - "RentalOrder.${ord_id}.deposit_released_cents == 100000"
            - "RentalOrder.${ord_id}.deposit_outstanding_cents == 0"

      - name: reservation_damage_checkin_files_report_recompute_depth3
        grounds:
          - state_machines.EquipmentReservation.CHECKED_OUT_to_DAMAGED
          - entities.DamageReport.fields.status
          - entities.RentalOrder.fields.deposit_at_risk_cents
          - entities.RentalOrder.fields.open_damage_count
        distinguishing_aspect: >
          Depth-3 chain triggered by reservation check-in(damaged=true): Reservation
          CHECKED_OUT->DAMAGED -> auto-create DamageReport(FILED) -> recompute
          RentalOrder.open_damage_count=1 and deposit_at_risk_cents=500000 (1 lost x 500000
          replacement); a distinct trigger from the order-cancel cascade.
        test_recipe:
          setup:
            - "Order IN_EVENT (clock 2026-05-01) with LED reservation qty2 CHECKED_OUT; deposit held."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "H", contact_email: "h@h.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V6", address: "8 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E6", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 2, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/load-out", payload: {}, as: WarehouseManager }
            - { call: "POST /equipment-reservations/${res_id}/check-out", payload: {}, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/start-event", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /equipment-reservations/${res_id}/check-in", payload: { damaged: true, lost_units: 1 }, as: WarehouseManager }
          assert:
            - "EquipmentReservation.${res_id}.status == DAMAGED"
            - "RentalOrder.${ord_id}.open_damage_count == 1"
            - "RentalOrder.${ord_id}.deposit_at_risk_cents == 500000"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reserve_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
        distinguishing_aspect: >
          A reservation-create that violates both state (order CONFIRMED, not DRAFT/QUOTED) and
          business_temporal (qty 20 > available 12) returns ERR_INVALID_STATE, not
          ERR_EQUIPMENT_UNAVAILABLE — state (prio 5) beats business_temporal (prio 8). Category
          pair: state vs business_temporal.
        test_recipe:
          setup:
            - "Order CONFIRMED (clock 2026-05-01) with a HELD LED reservation qty8 (LED total 20, so 12 remain)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "I", contact_email: "i@i.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V7", address: "9 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E7", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 8, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 20, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: confirm_safety_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_COI_NOT_APPROVED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: >
          A confirm that violates both business_safety (no APPROVED COI) and business_fiscal
          (quote_total_cents 32400 > credit_limit_cents 1000) returns ERR_COI_NOT_APPROVED, not
          ERR_CREDIT_LIMIT_EXCEEDED — safety (prio 7) beats fiscal (prio 10). Category pair:
          business_safety vs business_fiscal (distinct from the state-vs-temporal pair).
        test_recipe:
          setup:
            - "Order QUOTED (clock 2026-05-01) with LED reservation qty1 3 days -> quote_total 32400; customer credit_limit 1000; NO approved COI."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "J", contact_email: "j@j.test", credit_limit_cents: 1000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V8", address: "10 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E8", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov}" }, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_COI_NOT_APPROVED"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: reserve_exact_available_units_boundary
        grounds:
          - calculations.equipment_availability
          - validations[priority=8]
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
        distinguishing_aspect: >
          Reserving exactly the 8 remaining units succeeds (available 8 >= 8), while one more unit
          over capacity fails ERR_EQUIPMENT_UNAVAILABLE — '>=' precision on the integer unit-quota
          metric at POST /rental-orders/{id}/reservations.
        test_recipe:
          setup:
            - "LED total 20; one HELD reservation qty12 over 06-10..06-12 (8 units remain)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "K", contact_email: "k@k.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V9", address: "11 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E9", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 12, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 8, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { ok_res: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager, captures: { err: "$.data.error_id" } }
          assert:
            - "EquipmentReservation.${ok_res}.status == HELD"
            - "EquipmentReservation.${ok_res}.qty == 8"
            - "second reservation response.status == 409 and response.data.error_id == ERR_EQUIPMENT_UNAVAILABLE"

      - name: coi_coverage_exact_required_boundary
        grounds:
          - state_machines.CertificateOfInsurance.SUBMITTED_to_APPROVED
          - validations[priority=7]
          - entities.Venue.fields.required_coverage_cents
          - errors[ERR_COI_INSUFFICIENT_COVERAGE]
        distinguishing_aspect: >
          COI with coverage_amount_cents exactly == venue.required_coverage_cents (2000000) approves,
          while 1999999 (one cent short) fails ERR_COI_INSUFFICIENT_COVERAGE — '>=' precision on the
          coverage-cents metric at POST /certificates-of-insurance/{id}/approve (a different metric
          and endpoint than the unit-quota boundary).
        test_recipe:
          setup:
            - "Venue required_coverage 2000000; order event ends 06-12; COI-A coverage 2000000, COI-B coverage 1999999, both expiry 2026-12-31."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "L", contact_email: "l@l.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V10", address: "12 St", required_coverage_cents: 2000000 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E10", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Aon", coverage_amount_cents: 2000000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_a: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Aon", coverage_amount_cents: 1999999, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_b: "$.data.id" } }
          trigger:
            - { call: "POST /certificates-of-insurance/${coi_a}/approve", payload: {}, as: AccountManager }
            - { call: "POST /certificates-of-insurance/${coi_b}/approve", payload: {}, as: AccountManager, captures: { err: "$.data.error_id" } }
          assert:
            - "CertificateOfInsurance.${coi_a}.status == APPROVED"
            - "coi_b approve response.status == 409 and response.data.error_id == ERR_COI_INSUFFICIENT_COVERAGE"
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_requires_coi_approved
        grounds:
          - state_machines.RentalOrder.QUOTED_to_CONFIRMED
          - entities.RentalOrder.fields.has_approved_coi
          - state_machines.CertificateOfInsurance.SUBMITTED_to_APPROVED
        distinguishing_aspect: >
          RentalOrder QUOTED->CONFIRMED is gated on a DIFFERENT entity's state: with the COI still
          SUBMITTED, confirm returns ERR_COI_NOT_APPROVED; once the CertificateOfInsurance is
          APPROVED (has_approved_coi=true) the same confirm succeeds. Entity pair: RentalOrder<-COI.
        test_recipe:
          setup:
            - "Order QUOTED (clock 2026-05-01), credit high, one COI SUBMITTED but not yet approved."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "M", contact_email: "m@m.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "V11", address: "13 St", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "E11", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov1: "$.data.version" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov1}" }, as: AccountManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov2: "$.data.version" } }
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov2}" }, as: AccountManager }
          assert:
