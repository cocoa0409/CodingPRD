# =============================================================================
# Task 1953 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every instance is self-contained from
# empty DB and uses only endpoints declared in SCAFFOLD.yaml §1.5.
# Pre-computed constants used below:
#   pull-force min: class3/AWG22/CLOSED = round(30*0.9*1.1,1) = 29.7
#                   class2/AWG18/OPEN   = round(50*1.0*1.0,1) = 50.0
#                   class2/AWG20/OPEN   = round(30*1.0*1.0,1) = 30.0
#   scrap credit:   round(133*0.8) = 106 per line; 3 lines -> 318
#                   ECN: round(450*0.8)=360 + round(25*0.8)=20 -> 380 per unit
#   cost roll-up:   standard 2*(450+4*25) = 1100; actual 2*500+8*25 = 1200
#   liability:      3 scrapped x 500 book = 1500; x 640 replacement = 1920
# Logical clock default is 2026-08-01T00:00:00Z unless set via /plant/_clock.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: build_cost_standard_vs_actual_rollup
        grounds:
          - calculations.build_order_cost_roll_up
          - entities.BuildOrder.fields.standard_cost_cents
          - entities.BuildOrder.fields.actual_cost_cents
          - entities.ConsignedLot.fields.unit_liability_cents
        distinguishing_aspect: |
          Same build order, same physical build: STANDARD uses pinned BOM standard
          costs (1100 cents), ACTUAL uses issue-time cost snapshots where the
          consigned connector is costed at lot liability (500) not standard (450),
          yielding 1200 cents — dual-variant divergence on the BuildOrder domain.
        test_recipe:
          setup:
            - "Class-2 drawing with consigned connector C1 (qty_per 1, standard 450c) and factory terminal T1 (qty_per 4, 25c), RELEASED"
            - "Consigned lot for C1's mpn: liability 500c, replacement 640c, qty_received 10"
            - "Qualified program (AWG 20 OPEN_BARREL, min 30.0N) and certified inspector"
            - "Build order qty 2, kit fully issued (C1 x2 consigned, T1 x8 factory), delivered, 2 units built"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-DV1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "C1", component_type: "CONNECTOR", mpn: "CON-500", qty_per_harness: 1, supply_type: "CUSTOMER_CONSIGNED", unit_cost_cents: 450 }, as: HarnessEngineer, captures: { c1: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 4, supply_type: "FACTORY_STOCK", unit_cost_cents: 25 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-DV1", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-DV1", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI One", badge_no: "B-QI-DV1" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/consigned-lots", payload: { lot_code: "LOT-DV1", owner_customer_code: "ACME", mpn: "CON-500", unit_liability_cents: 500, replacement_cost_cents: 640, qty_received: 10 }, as: MaterialsClerk, captures: { lot: $.data.id } }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-DV1", drawing_id: "${dr}", qty_ordered: 2 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${c1}", qty_issued: 2, source: "CONSIGNED_LOT", consigned_lot_id: "${lot}" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 8, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO One", badge_no: "B-LO-DV1" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}" }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}" }
          trigger:
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner }
          assert:
            - "BuildOrder.${bo}.standard_cost_cents == 1100   # 2 * (1*450 + 4*25)"
            - "BuildOrder.${bo}.actual_cost_cents == 1200     # 2*500 + 8*25"
            - "BuildOrder.${bo}.standard_cost_cents != BuildOrder.${bo}.actual_cost_cents"
            - "BuildOrder.${bo}.qty_built == 2"

      - name: consigned_liability_book_vs_replacement
        grounds:
          - calculations.consigned_scrap_liability
          - entities.ConsignedLot.fields.book_liability_cents
          - entities.ConsignedLot.fields.replacement_liability_cents
        distinguishing_aspect: |
          Same scrapped consigned pieces (3): BOOK_VALUE settles at receipt-book
          liability 3 x 500 = 1500 cents; REPLACEMENT_VALUE settles at current
          replacement 3 x 640 = 1920 cents — dual-variant divergence on the
          ConsignedLot entity domain, distinct from the BuildOrder cost roll-up.
        test_recipe:
          setup:
            - "Class-2 drawing with a single consigned connector C1 (qty_per 1, standard 450c), RELEASED"
            - "Lot: liability 500c, replacement 640c, qty_received 10"
            - "Qualified program, certified inspector, order qty 3 fully kitted from the lot and delivered, 3 units built"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-DV2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "C1", component_type: "CONNECTOR", mpn: "CON-500", qty_per_harness: 1, supply_type: "CUSTOMER_CONSIGNED", unit_cost_cents: 450 }, as: HarnessEngineer, captures: { c1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-DV2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-DV2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI Two", badge_no: "B-QI-DV2" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/consigned-lots", payload: { lot_code: "LOT-DV2", owner_customer_code: "ACME", mpn: "CON-500", unit_liability_cents: 500, replacement_cost_cents: 640, qty_received: 10 }, as: MaterialsClerk, captures: { lot: $.data.id } }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-DV2", drawing_id: "${dr}", qty_ordered: 3 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${c1}", qty_issued: 3, source: "CONSIGNED_LOT", consigned_lot_id: "${lot}" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO Two", badge_no: "B-LO-DV2" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u2: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u3: $.data.id } }
          trigger:
            - { call: "POST /plant/harness-units/${u1}/scrap", payload: { reason: "DAMAGE" }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/harness-units/${u2}/scrap", payload: { reason: "DAMAGE" }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/harness-units/${u3}/scrap", payload: { reason: "DAMAGE" }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "GET /plant/consigned-lots/${lot}", payload: {}, as: MaterialsClerk }
          assert:
            - "ConsignedLot.${lot}.qty_scrapped == 3"
            - "ConsignedLot.${lot}.qty_consumed == 0"
            - "ConsignedLot.${lot}.book_liability_cents == 1500"
            - "ConsignedLot.${lot}.replacement_liability_cents == 1920"
            - "ConsignedLot.${lot}.book_liability_cents != ConsignedLot.${lot}.replacement_liability_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pull_force_minimum_tiered_branching
        grounds:
          - calculations.crimp_pull_force_minimum
          - entities.MachineProgram.fields.min_pull_force_n
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — a tiered AWG lookup
          table, a conditional terminal-type derating, and a class multiplier from
          the linked drawing: class3/AWG22/CLOSED gives round(30*0.9*1.1,1) = 29.7N
          while class2/AWG18/OPEN gives round(50*1.0*1.0,1) = 50.0N.
        test_recipe:
          setup:
            - "Two released drawings: D3 (IPC_CLASS_3) and D2 (IPC_CLASS_2), each with one factory component"
            - "One applicator hosting both programs"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-CF1A", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_3" }, as: HarnessEngineer, captures: { dr3: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr3}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-22", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 30 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr3}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-CF1B", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr2: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr2}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-18", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 30 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr2}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-CF1", compatible_terminal_mpn: "TERM-22" }, as: ProcessEngineer, captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CF1A", drawing_id: "${dr3}", applicator_id: "${ap}", wire_gauge_awg: 22, wire_type: "TXL", cut_length_mm: 300.0, strip_length_mm: 4.0, terminal_mpn: "TERM-22", terminal_type: "CLOSED_BARREL" }, as: ProcessEngineer, captures: { pr1: $.data.id, pr1_min: $.data.min_pull_force_n } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CF1B", drawing_id: "${dr2}", applicator_id: "${ap}", wire_gauge_awg: 18, wire_type: "TXL", cut_length_mm: 300.0, strip_length_mm: 4.0, terminal_mpn: "TERM-18", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr2: $.data.id, pr2_min: $.data.min_pull_force_n } }
          assert:
            - "MachineProgram.${pr1}.min_pull_force_n == 29.7"
            - "MachineProgram.${pr2}.min_pull_force_n == 50.0"
            - "MachineProgram.${pr1}.status == DRAFT"

      - name: scrap_credit_per_line_rounding
        grounds:
          - calculations.scrap_recovery_credit
          - entities.BuildOrder.fields.scrap_recovery_credit_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each BOM line is rounded to
          integer cents FIRST (round_half_up(133*0.8) = 106 per line) then summed
          (318); the rejected sum-then-round order would give round(3*106.4) = 319.
          Different mode from the tiered-branching pull-force formula.
        test_recipe:
          setup:
            - "Class-2 drawing with three factory BOM lines, each qty_per 1 at 133c, RELEASED"
            - "Qualified program, certified inspector, order qty 1 kitted/delivered, 1 unit built"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-CF2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F1", component_type: "CONNECTOR", mpn: "CON-133", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 133 }, as: HarnessEngineer, captures: { f1: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F2", component_type: "TERMINAL", mpn: "TERM-133", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 133 }, as: HarnessEngineer, captures: { f2: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "F3", component_type: "WIRE", mpn: "WIRE-133", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 133 }, as: HarnessEngineer, captures: { f3: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-CF2", compatible_terminal_mpn: "TERM-133" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-CF2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-133", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI CF2", badge_no: "B-QI-CF2" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-CF2", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${f1}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${f2}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${f3}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO CF2", badge_no: "B-LO-CF2" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /plant/harness-units/${u1}/scrap", payload: { reason: "DAMAGE" }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner }
          assert:
            - "BuildOrder.${bo}.scrap_recovery_credit_cents == 318   # 3 lines x round_half_up(133*0.8)=106"
            - "BuildOrder.${bo}.qty_scrapped == 1"
            - "BuildOrder.${bo}.status == CANCELLED   # TESTING auto-cancel when qty_built == 0"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: harness_unit_build_rework_cycle
        grounds:
          - state_machines.HarnessUnit.BUILT | REWORK | SUSPECT_to_REWORK
          - state_machines.HarnessUnit.REWORK_to_BUILT
          - state_machines.HarnessUnit.BUILT_to_TEST_PASS
          - entities.HarnessUnit.fields.rework_count
        distinguishing_aspect: |
          HarnessUnit is cyclic (BUILT -> REWORK -> BUILT twice, then TEST_PASS);
          rework_count increments per completed loop (0 -> 1 -> 2) and test flags
          reset on each re-entry to BUILT. Non-linear machine on HarnessUnit.
        test_recipe:
          setup:
            - "Class-2 drawing with one factory terminal, RELEASED; qualified program; certified inspector; order qty 1; kit delivered; 1 unit built by a different operator"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-NL1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-NL1", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-NL1", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI NL1", badge_no: "B-QI-NL1" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-NL1", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
