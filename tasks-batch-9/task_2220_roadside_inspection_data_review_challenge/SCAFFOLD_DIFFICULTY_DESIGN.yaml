  - rule_id: cross_entity_state_dependency
    instances:
      - name: challenge_submit_requires_report_beyond_received
        grounds:
          - state_machines.DataChallenge.DRAFT_to_SUBMITTED
          - state_machines.InspectionReport.RECEIVED_to_VALIDATED
          - state_machines.InspectionReport.VALIDATED_to_SCORED
          - validations[priority=8]
        distinguishing_aspect: |
          The gating entity is the parent InspectionReport, not the DataChallenge: an otherwise
          complete DRAFT challenge with evidence is rejected with ERR_INVALID_REPORT_STATE while its
          report is still RECEIVED, and the identical submit succeeds only after the report has been
          validated and scored.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (MEDIUM, power_unit_exposure 30.0), UNSAFE_DRIVING code weight 5, UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "One report dated 2026-07-01 in status RECEIVED with a single weight-5 UNSAFE_DRIVING violation - deliberately not validated."
            - "A DRAFT VIOLATION_NOT_SUPPORTED challenge on that violation with one ELD_RECORD evidence row (creation is not a transition endpoint, so it is allowed while the report is RECEIVED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "392.2S", description: "Speeding 15 or more over the limit", basic_category: "UNSAFE_DRIVING", severity_weight: 5 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_ud5_id: $.data.id }
            - call: "POST /intervention-thresholds"
              payload: { basic_category: "UNSAFE_DRIVING", carrier_segment: "MEDIUM", effective_from: "2026-01-01T00:00:00Z", measure_at_p50: 0.5, measure_at_p65: 1.0, measure_at_p80: 2.0 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070114", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00014", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports/${r1_id}/violations"
              payload: { violation_code_id: "${vc_ud5_id}", unit_type: "VEHICLE" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { v1_id: $.data.id }
            - call: "POST /data-challenges"
              payload: { report_id: "${r1_id}", challenge_type: "VIOLATION_NOT_SUPPORTED", narrative: "Narrative does not support the violation.", target_violation_id: "${v1_id}" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { ch1_id: $.data.id }
            - call: "POST /data-challenges/${ch1_id}/evidence"
              payload: { evidence_type: "ELD_RECORD", document_uri: "s3://dataqs/c1/eld-0714.json", description: "ELD trace" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /data-challenges/${ch1_id}/submit"
