              captures: { hist_len_marker: $.data.lien_history }
          trigger:
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app2}", lien_position: 1, lien_effective_from: "2026-09-01T00:00:00Z", lien_effective_to: "2031-09-01T00:00:00Z" }
              as: CreditAnalyst
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app2}", lien_position: 1, lien_effective_from: "2026-09-30T00:00:00Z", lien_effective_to: "2031-09-30T00:00:00Z" }
              as: CreditAnalyst
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app2}", lien_position: 1, lien_effective_from: "2026-10-01T00:00:00Z", lien_effective_to: "2031-10-01T00:00:00Z" }
              as: CreditAnalyst
              captures: { lv: $.data.lending_value_cents, from_final: $.data.lien_effective_from }
          assert:
            - "After the release: data.assigned_loan_application_id == null, lien_position == null, lien_effective_from == null, lien_effective_to == null, and lien_history has exactly one entry { loan_application_id: ${app1}, lien_position: 1, effective_from: 2026-08-01T00:00:00Z, effective_to: 2026-09-01T00:00:00Z, released_at: 2026-08-01T00:00:00Z }"
            - "Attempt at 2026-09-01 (the unbuffered end): 409 with data.error_id == \"ERR_COLLATERAL_LIEN_WINDOW_CONFLICT\""
            - "Attempt at 2026-09-30 (one day inside the buffer): 409 with data.error_id == \"ERR_COLLATERAL_LIEN_WINDOW_CONFLICT\""
            - "Attempt at 2026-10-01 (exactly the buffered end, half-open): success — ${from_final} == \"2026-10-01T00:00:00Z\" and data.assigned_loan_application_id == \"${app2}\""
            - "${lv} == 225000000 — the accepted re-assignment recomputes the lending value at lien_position 1 with the 0.90 seasoning factor still applied"
            - "The two rejected attempts left lien_history at exactly one entry and the asset unassigned"

  - rule_id: compensating_invariant
    instances:
      - name: draw_void_restores_loan_commitment_conservation
        grounds:
          - state_machines.DrawRequest.transitions["DISBURSED -> VOIDED"]
          - state_machines.Loan.dimension.servicing_status.transitions["CONSTRUCTION_DRAW -> PENDING_FIRST_DRAW"]
          - entities.Loan.fields.undrawn_commitment_cents
          - entities.Loan.fields.retainage_held_cents
          - entities.Loan.fields.interest_reserve_shortfall_cents
          - endpoints["POST /draw-requests/{draw_request_id}/void"]
        distinguishing_aspect: |
          Voiding a DISBURSED draw must reverse every one of the six ledger effects of the
          disbursement and nothing else: disbursed_principal_cents 60000000 -> 0,
          undrawn_commitment_cents 165000000 -> 225000000, retainage_held_cents 6000000 -> 0,
          interest_reserve_shortfall_cents 0 -> 1500000, outstanding_principal_cents
          60000000 -> 0, and servicing_status CONSTRUCTION_DRAW -> PENDING_FIRST_DRAW. The
          conservation identity principal_cents == disbursed + undrawn + cancelled holds at
          225000000 before AND after. The draw's own computed waterfall fields must be
          PRESERVED as the audit record, so an implementation that nulls them, or that forgets
          to restore the interest-reserve shortfall (the sweep is the effect most easily
          missed), is caught.
        test_recipe:
          setup:
            - "The reference borrower funded at 225000000 with interest_reserve_shortfall_cents 1500000."
            - "One 60000000 draw approved and disbursed: net 52455000, retainage 6000000, reserve sweep 1500000, fee 45000."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q2", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q3", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 515 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q4", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 65000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 41800200, member_household_count: 520 }
              as: CreditAnalyst
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset: $.data.id }
            - call: "POST /loan-applications"
              payload: { institution_id: "${inst}", governance_authorization_id: "${gov}", purpose: "SANCTUARY_CONSTRUCTION", requested_amount_cents: 225000000, term_months: 240, interest_rate_bps: 625 }
              as: CreditAnalyst
              captures: { app: $.data.id }
            - call: "POST /loan-applications/${app}/submit-underwriting"
              payload: { analyst_note: "Four audited periods on file" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app}", lien_position: 1, lien_effective_from: "2026-08-01T00:00:00Z", lien_effective_to: "2031-08-01T00:00:00Z" }
              as: CreditAnalyst
            - call: "POST /loan-applications/${app}/committee-referral"
              payload: { referral_note: "First lien on sanctuary" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
