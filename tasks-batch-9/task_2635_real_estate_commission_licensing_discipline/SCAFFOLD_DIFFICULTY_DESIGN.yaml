            - "Complaint.${c_a_id}.status stays INVESTIGATION after the refusal and Licensee.${rae_id}.discipline_status stays UNDER_INVESTIGATION"
            - "Complaint.${c_b_id}.priority_score == 40 (15 + floor(2500000 / 100000) == 25) and its PROBABLE_CAUSE returns 200 with status == PROBABLE_CAUSE - exactly at the threshold is accepted"
            - "after REQUEST_AMENDMENT: Complaint.${c_a_id}.status == AMENDMENT_REQUESTED and amendment_count == 1"
            - "after the amendment: Complaint.${c_a_id}.status == INVESTIGATION, alleged_loss_cents == 2500000 and priority_score == 40"
            - "the retried PROBABLE_CAUSE on ${c_a_id} returns 200 - the single-cent band change was the only difference"
            - "Brokerage.${bkg_id}.supervision_posture == COMPLIANT throughout, so neither score carried a posture bump and open_complaint_count == 2 stayed below the WATCH threshold of 3"
  - rule_id: cross_entity_state_dependency
