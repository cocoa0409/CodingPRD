      - name: child_and_body_foreign_keys_resolve_against_declared_parents
        claim_type: parent_relationships
        grounds:
          - validations[priority=30]
          - entities.FactoryInspection.parent
          - entities.ProductionLot.fields.rod_lot_id
          - entities.ProductionLot.fields.product_id
          - endpoints[POST /listing-certifications/{id}/inspections]
          - endpoints[GET /listing-certifications/{id}/inspections]
        distinguishing_aspect: "Path-segment parents are checked before body foreign keys, and among body keys the declared order rod_lot_id then product_id decides which 404 surfaces when both are bogus - so a lot create with two bad references returns ERR_ROD_LOT_NOT_FOUND, never ERR_PRODUCT_NOT_FOUND."
        test_recipe:
          setup:
            - "Two UL files, each with one PASS inspection, plus a RELEASED SKU and a rod lot so that only the deliberately-bogus reference is wrong in each attempt."
