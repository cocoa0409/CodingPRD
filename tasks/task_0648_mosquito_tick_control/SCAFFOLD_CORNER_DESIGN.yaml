  # ======================= Consistency Model =======================
  - section: consistency_model
    instances:
      - name: per_visit_invoice_visible_in_same_request_on_complete
        claim_type: immediate
        grounds:
          - state_machines.Visit.DISPATCHED_to_COMPLETED
          - entities.Subscription.fields.season_balance_cents
        distinguishing_aspect: "Completing a PER_VISIT visit issues the invoice and updates season_balance_cents to 7380 immediately, readable on the next GET in the same flow (immediate consistency)."
        excluded_because:
          difficulty_instance: combinatorial_formula / visit_charge_tiered_nonlinear_mode_a
          rationale: "Immediate issuance and amount of the PER_VISIT invoice on completion is asserted by the §1.8 mode-a calc instance (Invoice amount_cents == 7590 read right after complete)."
