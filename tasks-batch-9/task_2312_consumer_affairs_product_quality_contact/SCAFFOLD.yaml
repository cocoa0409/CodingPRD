  # --- complaints -------------------------------------------------------------
  - method: POST
    path: /complaints
    description: Create a categorized complaint from a contact; resolves the batch code and computes the provisional severity.
    roles: [CareAgent, CareSupervisor]
    code: 201
    input: [contact_id, complaint_type, "reported_batch_code?", "pack_code_date?", "foreign_object_class?", "medical_attention_sought?", "hospitalization?", "symptom_codes?", "vulnerable_consumer?", "units_claimed?"]
    output: Complaint
    side_effects:
      - "batch_code_resolution sets product_identification_status, lot_id and product_id"
      - "complaint_severity_score variant intake_provisional sets provisional_severity_score / band and effective_severity_band"
      - "Contact.status OPEN -> LOGGED; Contact.complaint_count += 1; Consumer.complaint_count += 1"
      - "ProductionLot.linked_complaint_count += 1 and provisional_complaint_count += 1 when a lot resolved"
  - method: GET
    path: /complaints
    description: List complaints with filters across every relationship.
    roles: [CareAgent, CareSupervisor, QualityLead, RegulatoryOfficer]
    code: 200
    input: ["contact_id?", "consumer_id?", "product_id?", "lot_id?", "duplicate_of_complaint_id?", "responded_template_id?", "handling_status?", "regulatory_status?", "effective_severity_band?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: GET
    path: /complaints/{id}
    description: Fetch one complaint with both state dimensions and both severity variants.
    roles: [CareAgent, CareSupervisor, QualityLead, RegulatoryOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: /complaints/{id}/identify-product
    description: Re-run batch-code resolution with a corrected code and an optional code-date disambiguator.
    roles: [CareAgent, CareSupervisor]
    code: 200
    input: [reported_batch_code, "pack_code_date?"]
    output: Complaint
    side_effects:
      - "batch_code_resolution re-run; lot bucket counters moved when the lot changes"
      - "provisional severity is NOT recomputed; it never depended on the product"
  - method: POST
    path: /complaints/{id}/triage
    description: Adjudicate severity and fan out the regulatory, lot and plant consequences.
    roles: [CareSupervisor, QualityLead]
    code: 200
    input: ["reviewer_note?"]
    output: Complaint
    side_effects:
      - "complaint_severity_score variant triage_adjudicated sets adjudicated_severity_score / band; effective_severity_band switches"
      - "handling_status INTAKE -> TRIAGED; triaged_by_ref stamped"
      - "ProductionLot bucket counters move from provisional to adjudicated"
      - "S1 or S2 ILLNESS / FOREIGN_MATERIAL auto-creates a RegulatoryReport (OPEN) and sets regulatory_status ESCALATED, with due_at from regulatory_due_at"
      - "S1 additionally moves the linked lot RELEASED -> HOLD and re-derives Plant.oversight_posture"
  - method: POST
    path: /complaints/{id}/respond
    description: Send a templated consumer response.
    roles: [CareAgent, CareSupervisor]
    code: 200
    input: [response_template_id]
    output: Complaint
    side_effects:
      - "responded_template_id and responded_at set; handling_status TRIAGED -> IN_RESOLUTION"
      - "ResponseTemplate.usage_count += 1"
  - method: POST
    path: /complaints/{id}/mark-duplicate
    description: Mark this complaint a duplicate of another complaint by the same consumer.
    roles: [CareSupervisor]
    code: 200
    input: [duplicate_of_complaint_id]
    output: Complaint
    side_effects:
      - "handling_status -> DUPLICATE; duplicate_of_complaint_id set"
      - "ProductionLot bucket counters shift into duplicate_complaint_count with linked_complaint_count unchanged"
      - "Consumer.complaint_count -= 1"
  - method: POST
    path: /complaints/{id}/unmark-duplicate
    description: Restore a complaint that was wrongly marked a duplicate.
    roles: [CareSupervisor]
    code: 200
    input: ["reason?"]
    output: Complaint
    side_effects:
      - "handling_status returns to TRIAGED when an adjudicated score exists, otherwise INTAKE"
      - "ProductionLot bucket counters shift back out of duplicate_complaint_count"
      - "Consumer.complaint_count += 1"
  - method: POST
    path: /complaints/{id}/quality-hold
    description: Freeze a complaint for quality investigation, voiding its live goodwill.
    roles: [QualityLead]
    code: 200
    input: ["reason?"]
    output: Complaint
    side_effects:
      - "pre_hold_handling_status recorded; handling_status -> ON_QUALITY_HOLD"
      - "every live Remedy on the complaint -> VOIDED_BY_HOLD, with the consumer goodwill ledger reconciled"
  - method: POST
    path: /complaints/{id}/release-hold
    description: Return a complaint from quality hold to its pre-hold state.
    roles: [QualityLead]
    code: 200
    input: ["reason?"]
    output: Complaint
    side_effects:
      - "handling_status returns to pre_hold_handling_status; blocked while a covering signal is in RECALL_EVALUATION"
  - method: POST
    path: /complaints/{id}/resolve
    description: Mark the complaint resolved.
    roles: [CareAgent, CareSupervisor]
    code: 200
    input: ["resolution_note?"]
    output: Complaint
    side_effects:
      - "handling_status IN_RESOLUTION -> RESOLVED"
  - method: POST
    path: /complaints/{id}/close
    description: Close the complaint permanently.
    roles: [CareSupervisor]
    code: 200
    input: ["closing_note?"]
    output: Complaint
    side_effects:
      - "handling_status RESOLVED -> CLOSED (terminal); requires the regulatory dimension to be settled"
  - method: GET
    path: /complaints/{id}/signal-memberships
    description: List the trend-signal memberships this complaint contributed to.
    roles: [CareSupervisor, QualityLead]
    code: 200
    input: ["limit?", "offset?"]
    output: SignalMembership[]
    side_effects: []

  # --- sample kits ------------------------------------------------------------
