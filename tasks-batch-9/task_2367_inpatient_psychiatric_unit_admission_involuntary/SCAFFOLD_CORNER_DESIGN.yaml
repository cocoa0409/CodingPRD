        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - validations[priority=33]
          - validations[priority=35]
          - errors[ERR_HEARING_SLOT_INVALID]
          - errors[ERR_HEARING_BEYOND_HOLD_EXPIRY]
          - errors[ERR_ADVOCATE_NOT_QUALIFIED]
        distinguishing_aspect: "Hearing scheduling stacks three independent temporal and referential gates in priority order: the slot itself must be a future judicial-day slot inside the 09:00-16:00Z window (priority 32, four distinct violations), it must end no later than the hold's release_deadline_at (priority 33), and the advocate must actually hold the RIGHTS_ADVOCATE role (priority 35) - and a holiday slot that also exceeds the hold expiry surfaces the priority-32 error, not the priority-33 one."
