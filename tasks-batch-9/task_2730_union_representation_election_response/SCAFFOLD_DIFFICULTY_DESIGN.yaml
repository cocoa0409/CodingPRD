  - rule_id: priority_pair_validation_conflict
    instances:
      - name: safety_beats_temporal_on_delivery
        grounds:
          - validation_priority_conflicts.safety-beats-temporal
          - validations[priority=14]
          - validations[priority=17]
        conflicting_priorities: [14, 17]
        error_categories: [business_safety, business_temporal]
        winner: ERR_PEERLESS_PLYWOOD_WINDOW
        winner_http_status: 422
        distinguishing_aspect: |
          business_safety (422) versus business_temporal (409) on the same deliver request. The two
          candidate errors carry different HTTP statuses, so an implementation that evaluates the
          window check first returns 409 where 422 is required. The captive-audience message could
          legitimately be approved earlier because no round existed yet, which is what lets both
          conditions be true at delivery time.
        test_recipe:
          setup:
            - "petition SOI_VERIFIED with a TRAINED presenter"
            - "an APPROVED CAPTIVE_AUDIENCE_MEETING message planned for 2026-09-01T05:00:00Z, approved while no ElectionRound existed (so peerless_plywood_violation was false at review time)"
            - "an APPROVED EMAIL control message planned for 2026-08-26T13:00:00Z"
            - "the agreement then stipulated with polls 2026-09-01T06:00:00Z to 17:00:00Z, and the clock moved to 2026-09-01T18:00:00Z (after the polls closed)"
