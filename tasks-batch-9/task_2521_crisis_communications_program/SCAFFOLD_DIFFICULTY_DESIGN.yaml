# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Domain: crisis-communications-program   (see SCAFFOLD.yaml §1.1-§1.7)
# Nine rule_ids from §0.5, 26 instances total. Every literal in an `assert:`
# line was computed against the §1.3 formula and its `constants:`.
# Logical clock default is 2026-08-01T00:00:00Z; every instance that depends on
# time pins it with POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_incident_severity_provisional_vs_final
        grounds:
          - calculations.incident_severity_tier
          - entities.Incident.fields.severity_tier
          - entities.Incident.fields.final_severity_tier
          - entities.Incident.fields.severity_basis
          - state_machines.Incident.MONITORING_to_ACTIVATED
          - state_machines.Incident.ACTIVATED_to_RESOLVED
        distinguishing_aspect: |
          The provisional variant scores max(escalation_score) over LINKED+ESCALATED signals while the
          final variant blends peak and average over ESCALATED signals only, so the very same three
          signals yield SEV1 / 96.00 at activation and SEV2 / 88.00 at resolution.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Three roster members: an incident lead, a privilege-cleared counsel and a social listener."
            - "Two monitored channels: one MEDIA, one SOCIAL."
            - "Signal A (reach 84, tier A, MEDIA) = 92.00 ESCALATED; Signal B (reach 68, tier A, SOCIAL) = 72.00 ESCALATED; Signal C (reach 88, tier A, MEDIA) = 96.00 LINKED only."
            - "INCIDENT_LEAD and LEGAL_COUNSEL seats ACKNOWLEDGED (the provisional tier computes to SEV1, which requires the counsel seat)."
            - "Incident ACTIVATED at 2026-08-10T09:00:00Z with severity_tier SEV1 / severity_score 96.00 / severity_basis PROVISIONAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Nia Fox", org_title: "General Counsel", privilege_cleared: true }
              as: ProgramAdmin
              captures: { counsel_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_media_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "Platform X", channel_type: "SOCIAL" }
              as: ProgramAdmin
              captures: { ch_social_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Battery pack overheating reports", scenario_code: "PRODUCT_RECALL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_media_id}", headline: "Wire story on overheating packs", reach_score: 84, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_a_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_social_id}", headline: "Unboxing thread claims fire risk", reach_score: 68, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_b_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_media_id}", headline: "Broadcast segment scheduled", reach_score: 88, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_c_id: $.data.id }
            - call: "POST /crisis/issue-signals/${sig_a_id}/link"
              payload: { incident_id: "${inc_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_b_id}/link"
              payload: { incident_id: "${inc_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_c_id}/link"
              payload: { incident_id: "${inc_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_a_id}/escalate"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_b_id}/escalate"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/team-assignments"
              payload: { incident_id: "${inc_id}", member_id: "${lead_id}", team_role: "INCIDENT_LEAD", decision_authority: "FULL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { a_lead_id: $.data.id }
            - call: "POST /crisis/team-assignments"
              payload: { incident_id: "${inc_id}", member_id: "${counsel_id}", team_role: "LEGAL_COUNSEL", decision_authority: "FULL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { a_counsel_id: $.data.id }
            - call: "POST /crisis/team-assignments/${a_lead_id}/acknowledge"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/team-assignments/${a_counsel_id}/acknowledge"
              payload: {}
              as: LegalCounsel
              as_user_id: "${counsel_id}"
            - call: "POST /crisis/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /crisis/incidents/${inc_id}/resolve"
              payload: { reputation_index_after: 44.00 }
              as: IncidentLead
              as_user_id: "${lead_id}"
          assert:
            - "Incident.${inc_id}.severity_tier == SEV1"
            - "Incident.${inc_id}.severity_score == 96.00"
            - "Incident.${inc_id}.final_severity_tier == SEV2"
            - "Incident.${inc_id}.final_severity_score == 88.00"
            - "Incident.${inc_id}.severity_basis == FINAL"
            - "Incident.${inc_id}.response_state == RESOLVED"
            - "IssueSignal.${sig_c_id}.state == LINKED"
            - "Incident.${inc_id}.final_severity_tier != Incident.${inc_id}.severity_tier"

      - name: dual_variant_reputation_delta_raw_vs_adjusted
        grounds:
          - calculations.reputation_delta
          - entities.PostCrisisReview.fields.reputation_delta_raw
          - entities.PostCrisisReview.fields.reputation_delta_adjusted
          - entities.PostCrisisReview.fields.exposure_factor
          - state_machines.PostCrisisReview.OPEN_to_SCORED
          - entities.Incident.fields.reputation_delta_reported
        distinguishing_aspect: |
          Both variants are stored by the same score call: raw is the bare index difference (-7.30)
          while exposure_adjusted damps it by (1 - 0.0101) and adds the 2.50 correction-efficacy bonus
          (-4.73), a 2.57 spread on identical reputation indices.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Incident opened with reputation_index_before 62.40, scenario_code DATA_BREACH, activated at SEV3 (single escalated signal scoring 63.00)."
            - "One PUBLISHED CORRECTION statement on the incident."
            - "One EMPLOYEE notice with estimated_reach 1006 RELEASED, giving stakeholder_reach_index 1.01."
            - "One misinformation claim closed on the CORRECTION branch, so total_claim_count 1 and corrected_claim_count 1."
            - "Incident RESOLVED with reputation_index_after 55.10, which creates the PostCrisisReview in OPEN with exposure_factor 0.0101."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Tess Okon", org_title: "Chief Strategy Officer" }
              as: ProgramAdmin
              captures: { exec_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /crisis/incidents"
              payload: { title: "Customer records exposed", scenario_code: "DATA_BREACH", reputation_index_before: 62.40 }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_id}", headline: "Breach mentioned in evening bulletin", reach_score: 55, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_id: $.data.id }
            - call: "POST /crisis/issue-signals/${sig_id}/link"
              payload: { incident_id: "${inc_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_id}/escalate"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/team-assignments"
              payload: { incident_id: "${inc_id}", member_id: "${lead_id}", team_role: "INCIDENT_LEAD", decision_authority: "FULL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { a_lead_id: $.data.id }
            - call: "POST /crisis/team-assignments/${a_lead_id}/acknowledge"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_v: $.data.version }
            - call: "POST /crisis/statements"
              payload: { incident_id: "${inc_id}", statement_type: "CORRECTION", body: "The exposed dataset did not contain payment credentials.", expected_incident_version: "${inc_v}" }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { st_id: $.data.id }
            - call: "POST /crisis/statements/${st_id}/submit-review"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "GET /crisis/approval-tasks?statement_id=${st_id}"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { task_lead_id: "$.data[0].id" }
            - call: "POST /crisis/approval-tasks/${task_lead_id}/decide"
              payload: { decision: "APPROVE" }
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/statements/${st_id}/publish"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/stakeholder-notices"
              payload: { incident_id: "${inc_id}", statement_id: "${st_id}", audience: "EMPLOYEE", estimated_reach: 1006 }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { notice_id: $.data.id }
            - call: "POST /crisis/stakeholder-notices/${notice_id}/release"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/misinformation-claims"
              payload: { incident_id: "${inc_id}", channel_id: "${ch_id}", claim_text: "Card numbers were sold on a forum.", virality_score: 40.00 }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /crisis/misinformation-claims/${claim_id}/triage"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/misinformation-claims/${claim_id}/issue-correction"
              payload: { correction_statement_id: "${st_id}", correction_window_start: "2026-08-10T11:00:00Z", correction_window_end: "2026-08-10T11:30:00Z", expected_channel_version: "${ch_v}" }
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/misinformation-claims/${claim_id}/close"
              payload: { outcome_note: "Correction cited by the platform." }
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/incidents/${inc_id}/resolve"
              payload: { reputation_index_after: 55.10 }
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "GET /crisis/post-crisis-reviews?incident_id=${inc_id}"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { review_id: "$.data[0].id" }
          trigger:
            - call: "POST /crisis/post-crisis-reviews/${review_id}/score"
              payload: { scoring_method: "ADJUSTED", playbook_update_count: 3 }
              as: ExecSponsor
              as_user_id: "${exec_id}"
          assert:
            - "PostCrisisReview.${review_id}.exposure_factor == 0.0101"
            - "PostCrisisReview.${review_id}.reputation_delta_raw == -7.30"
            - "PostCrisisReview.${review_id}.reputation_delta_adjusted == -4.73"
            - "PostCrisisReview.${review_id}.reported_delta == -4.73"
            - "PostCrisisReview.${review_id}.scoring_method == ADJUSTED"
            - "PostCrisisReview.${review_id}.state == SCORED"
            - "PostCrisisReview.${review_id}.total_claim_count == 1"
            - "PostCrisisReview.${review_id}.corrected_claim_count == 1"
            - "Incident.${inc_id}.reputation_delta_reported == -4.73"

  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_signal_escalation_score_enum_matrix_mode_a
        grounds:
          - calculations.signal_escalation_score
          - entities.IssueSignal.fields.escalation_score
          - entities.MonitoredChannel.fields.channel_type
        distinguishing_aspect: |
          Mode (a): four inputs interact non-linearly — an enum-keyed credibility multiplier, an
          enum-keyed additive channel bump, a one-sided max() sentiment penalty and a min() clamp — so
          75.50, 100.00 (clamped from a raw 135.00) and 28.00 come out of the same formula.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One social listener on the roster."
            - "Two channels: SOCIAL (bump 4) and REGULATORY (bump 15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "Platform X", channel_type: "SOCIAL" }
              as: ProgramAdmin
              captures: { ch_social_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "Consumer Safety Docket", channel_type: "REGULATORY" }
              as: ProgramAdmin
              captures: { ch_reg_id: $.data.id }
          trigger:
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_social_id}", headline: "Angry thread about support delays", reach_score: 70, sentiment_score: -0.4, source_credibility_tier: "B" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_mid_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_reg_id}", headline: "Regulator opens inquiry docket", reach_score: 90, sentiment_score: -0.6, source_credibility_tier: "A", regulatory_flag: true }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_clamped_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_social_id}", headline: "Supportive fan post", reach_score: 40, sentiment_score: 0.2, source_credibility_tier: "C" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_low_id: $.data.id }
          assert:
            - "IssueSignal.${sig_mid_id}.escalation_score == 75.50"
            - "IssueSignal.${sig_clamped_id}.escalation_score == 100.00"
            - "IssueSignal.${sig_low_id}.escalation_score == 28.00"
            - "IssueSignal.${sig_low_id}.state == OPEN"
            - "IssueSignal.${sig_mid_id}.detected_at == 2026-08-10T09:00:00Z"

      - name: combinatorial_stakeholder_reach_index_nested_rounding_mode_b
        grounds:
          - calculations.stakeholder_reach_index
          - entities.StakeholderNotice.fields.reach_contribution
          - entities.Incident.fields.stakeholder_reach_index
          - state_machines.StakeholderNotice.QUEUED_to_RELEASED
        distinguishing_aspect: |
          Mode (b): rounding order changes the cents — rounding each notice to 1.01 and then summing
          gives 3.03, while summing 1.006 + 1.00625 + 1.0065 and rounding once gives 3.02; the pinned
          per-notice order must produce 3.03.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "SEV3 incident ACTIVATED (single escalated signal scoring 63.00) with one PUBLISHED HOLDING statement."
            - "Three QUEUED notices on that statement: EMPLOYEE reach 1006 (rank 1), CUSTOMER reach 805 (rank 2), REGULATOR reach 671 (rank 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ray Lund", org_title: "Social Analyst" }
              as: ProgramAdmin
              captures: { listener_id: $.data.id }
            - call: "POST /crisis/monitored-channels"
              payload: { name: "National Wire", channel_type: "MEDIA" }
              as: ProgramAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Plant fire near residential zone", scenario_code: "PLANT_INCIDENT" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /crisis/issue-signals"
              payload: { channel_id: "${ch_id}", headline: "Local paper photographs smoke plume", reach_score: 55, sentiment_score: 0.0, source_credibility_tier: "A" }
              as: SocialListener
              as_user_id: "${listener_id}"
              captures: { sig_id: $.data.id }
            - call: "POST /crisis/issue-signals/${sig_id}/link"
              payload: { incident_id: "${inc_id}" }
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/issue-signals/${sig_id}/escalate"
              payload: {}
              as: SocialListener
              as_user_id: "${listener_id}"
            - call: "POST /crisis/team-assignments"
              payload: { incident_id: "${inc_id}", member_id: "${lead_id}", team_role: "INCIDENT_LEAD", decision_authority: "FULL" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { a_lead_id: $.data.id }
            - call: "POST /crisis/team-assignments/${a_lead_id}/acknowledge"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_v: $.data.version }
            - call: "POST /crisis/statements"
              payload: { incident_id: "${inc_id}", statement_type: "HOLDING", body: "Everyone on site is accounted for; the fire is contained.", expected_incident_version: "${inc_v}" }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { st_id: $.data.id }
            - call: "POST /crisis/statements/${st_id}/submit-review"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "GET /crisis/approval-tasks?statement_id=${st_id}"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { task_lead_id: "$.data[0].id" }
            - call: "POST /crisis/approval-tasks/${task_lead_id}/decide"
              payload: { decision: "APPROVE" }
              as: IncidentLead
              as_user_id: "${lead_id}"
            - call: "POST /crisis/statements/${st_id}/publish"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/stakeholder-notices"
              payload: { incident_id: "${inc_id}", statement_id: "${st_id}", audience: "EMPLOYEE", estimated_reach: 1006 }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { n_emp_id: $.data.id }
            - call: "POST /crisis/stakeholder-notices"
              payload: { incident_id: "${inc_id}", statement_id: "${st_id}", audience: "CUSTOMER", estimated_reach: 805 }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { n_cust_id: $.data.id }
            - call: "POST /crisis/stakeholder-notices"
              payload: { incident_id: "${inc_id}", statement_id: "${st_id}", audience: "REGULATOR", estimated_reach: 671 }
              as: CommsLead
              as_user_id: "${comms_id}"
              captures: { n_reg_id: $.data.id }
          trigger:
            - call: "POST /crisis/stakeholder-notices/${n_emp_id}/release"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/stakeholder-notices/${n_cust_id}/release"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/stakeholder-notices/${n_reg_id}/release"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
          assert:
            - "StakeholderNotice.${n_emp_id}.reach_contribution == 1.01"
            - "StakeholderNotice.${n_cust_id}.reach_contribution == 1.01"
            - "StakeholderNotice.${n_reg_id}.reach_contribution == 1.01"
            - "StakeholderNotice.${n_emp_id}.sequence_rank == 1"
            - "StakeholderNotice.${n_reg_id}.sequence_rank == 3"
            - "Incident.${inc_id}.stakeholder_reach_index == 3.03"
            - "Incident.${inc_id}.released_notice_count == 3"

      - name: combinatorial_containment_priority_band_of_pre_fee_subtotal_mode_c
        grounds:
          - calculations.containment_priority_score
          - entities.Incident.fields.base_containment_score
