              payload: {}
              as: Producer
              as_user_id: "${p_id}"
            - call: "POST /programs/${prog_id}/review-claim"
              payload: {}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /programs/${prog_id}/review-decision"
              payload: {decision: "APPROVE"}
              as: ContentReviewer
              as_user_id: "rev-1"
            - call: "POST /playback-slots"
              payload: {channel_id: "${ch_id}", program_id: "${prog_id}", start_at: "2026-08-20T18:00:00Z"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {slot_id: $.data.id}
            - call: "POST /crew-assignments"
              payload: {slot_id: "${slot_id}", volunteer_producer_id: "${v_id}", crew_role: "AUDIO"}
              as: SchedulingCoordinator
              as_user_id: "sch-1"
              captures: {ca_id: $.data.id}
            - call: "POST /crew-assignments/${ca_id}/confirm"
              payload: {}
