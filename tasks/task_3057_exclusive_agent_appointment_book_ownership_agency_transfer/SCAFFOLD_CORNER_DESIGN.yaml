    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    - endpoints.POST_/agency-network/agencies
    distinguishing_aspect: A request without the X-User-Role header is rejected at priority 1 with 401 ERR_UNAUTHENTICATED before any existence or state check runs.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Empty database."
