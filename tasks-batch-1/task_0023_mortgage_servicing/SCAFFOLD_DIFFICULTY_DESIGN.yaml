scaffold_difficulty_design:

  # ============================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_payment_posting_standard_vs_curtailment
        grounds:
          - calculations.payment_posting
          - calculations.payment_posting.variants.STANDARD_WATERFALL
          - calculations.payment_posting.variants.PRINCIPAL_CURTAILMENT
          - entities.Payment.fields.posting_strategy
          - entities.Payment.fields.allocation
        distinguishing_aspect: |
          Operates on the Payment entity. The same payment amount above the
          monthly installment posts the surplus to SUSPENSE under
          STANDARD_WATERFALL and to additional principal under
          PRINCIPAL_CURTAILMENT -- two valid algorithms, two different
          allocation breakdowns and principal balances.
        test_recipe:
          setup:
            - "Borrower created"
            - "Loan originated $300,000 @ 6.00% / 360 months; status=CURRENT; scheduled_monthly_pi_cents=179865"
            - "EscrowAccount tied with annual_tax=480000, annual_insurance=120000; escrow_monthly=50000"
            - "Loan.total_monthly_payment_cents = 179865 + 50000 + 12500 (PMI) = 242365"
            - "Clock advanced 30 days so an installment is due on/before received_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b1@x.com", full_name: "Borrower One", ssn_last4: "1111" }
              as: LoanServicer
              captures: { b1_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b1_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan1_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${loan1_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
              captures: { esc1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loans/${loan1_id}/payments"
              payload: { amount_cents: 300000, received_at: "2026-02-01T00:00:00Z", posting_strategy: "STANDARD_WATERFALL" }
              as: LoanServicer
              captures: { pay_std_status: $.data.status }
          assert:
            - "Payment.allocation.suspense_cents == 57635"
            - "Payment.allocation.principal_cents == 29865"   # interest=150000, principal=29865 makes installment=179865 P&I
            - "Payment.allocation.escrow_cents == 50000"
            - "Payment.allocation.pmi_cents == 12500"
            - "Payment.allocation.late_fee_cents == 0"
            - "Payment.status == POSTED"

      - name: dual_variant_escrow_analysis_actual_vs_forecast
        grounds:
          - calculations.escrow_analysis
          - calculations.escrow_analysis.variants.ACTUAL_TRAILING_12
          - calculations.escrow_analysis.variants.FORECAST_NEXT_12
          - entities.EscrowAnalysis.fields.variant
          - entities.EscrowAnalysis.fields.new_escrow_monthly_cents
        distinguishing_aspect: |
          Operates on the EscrowAccount entity. Same EscrowAccount inputs:
          ACTUAL_TRAILING_12 ceils trailing PAID disbursements (588000 / 12 =>
          49000) while FORECAST_NEXT_12 round-half-ups the projected annual
          (600000 / 12 => 50000). Different new_escrow_monthly_cents from
          identical inputs.
        test_recipe:
          setup:
            - "Borrower + Loan + EscrowAccount created on 2025-01-01"
            - "Two PAID disbursements during 2025: TAX 480000 + INSURANCE 108000 = 588000 total"
            - "annual_tax=480000, annual_insurance=120000 (planned 600000) for forecast variant"
            - "Clock advanced to 2026-01-01 for the annual review anniversary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b2@x.com", full_name: "Borrower Two", ssn_last4: "2222" }
              as: LoanServicer
              captures: { b2_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b2_id}", origination_date: "2025-01-01T00:00:00Z", original_principal_cents: 20000000, original_property_value_cents: 25000000, interest_rate_bps: 500, term_months: 360, pmi_monthly_cents: 9000 }
              as: LoanServicer
              captures: { loan2_id: $.data.id, loan2_v_after_origin: $.data.version }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${loan2_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
              captures: { esc2_id: $.data.id, esc2_v0: $.data.version }
            - call: "POST /loans/${loan2_id}/payments"
              payload: { amount_cents: 5000000, received_at: "2025-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /escrow-accounts/${esc2_id}/disbursements"
              payload: { kind: "TAX", amount_cents: 480000, scheduled_for: "2025-04-15T00:00:00Z" }
              as: LoanServicer
              captures: { d_tax_id: $.data.id }
            - call: "POST /escrow-accounts/${esc2_id}/disbursements"
              payload: { kind: "INSURANCE", amount_cents: 108000, scheduled_for: "2025-10-15T00:00:00Z" }
              as: LoanServicer
              captures: { d_ins_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "GET /escrow-accounts/${esc2_id}"
              payload: {}
              as: LoanServicer
              captures: { esc2_v_pre_analysis: $.data.version }
            - call: "POST /escrow-accounts/${esc2_id}/analyses"
              payload: { as_of_date: "2026-01-01T00:00:00Z", variant: "ACTUAL_TRAILING_12", expected_escrow_account_version: "${esc2_v_pre_analysis}" }
              as: LoanServicer
              captures: { actual_analysis_id: $.data.id, actual_monthly: $.data.new_escrow_monthly_cents }
          trigger:
            - call: "GET /escrow-accounts/${esc2_id}"
              payload: {}
              as: LoanServicer
              captures: { esc2_v_after_actual: $.data.version }
            - call: "POST /escrow-accounts/${esc2_id}/analyses"
              payload: { as_of_date: "2026-01-01T00:00:00Z", variant: "FORECAST_NEXT_12", expected_escrow_account_version: "${esc2_v_after_actual}" }
              as: LoanServicer
              captures: { forecast_analysis_id: $.data.id, forecast_monthly: $.data.new_escrow_monthly_cents }
          assert:
            - "EscrowAnalysis.${actual_analysis_id}.variant == ACTUAL_TRAILING_12"
            - "EscrowAnalysis.${actual_analysis_id}.new_escrow_monthly_cents == 49000"
            - "EscrowAnalysis.${forecast_analysis_id}.variant == FORECAST_NEXT_12"
            - "EscrowAnalysis.${forecast_analysis_id}.new_escrow_monthly_cents == 50000"
            - "Loan.${loan2_id}.escrow_monthly_cents == 50000   # forecast was last applied"

  # ============================================================================
  # Rule 2: Combinatorial formulas across different modes
  # ============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_amortization_three_inputs_nonlinear
        grounds:
          - calculations.amortization_schedule
          - calculations.amortization_schedule.formula
          - entities.Loan.fields.scheduled_monthly_pi_cents
        distinguishing_aspect: |
          Mode (a): formula with 3 inputs and non-linear interaction. P, r, n
          interact through (1+r)^n / ((1+r)^n - 1); rounding is pinned to the
          FINAL monthly figure only -- intermediate (1+r)^n must NOT be
          rounded. Edge case for r=0 falls back to P/n.
        test_recipe:
          setup:
            - "Borrower created"
            - "Loan origination POSTed with P=$300,000, r=6.00%, n=360"
            - "Expected scheduled_monthly_pi_cents = 179865"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "b3@x.com", full_name: "Borrower Three", ssn_last4: "3333" }
              as: LoanServicer
              captures: { b3_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { borrower_id: "${b3_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan3_id: $.data.id, loan3_pi: $.data.scheduled_monthly_pi_cents }
          assert:
            - "Loan.${loan3_id}.scheduled_monthly_pi_cents == 179865"
            - "Loan.${loan3_id}.principal_balance_cents == 30000000"
            - "Loan.${loan3_id}.status == CURRENT"

      - name: combinatorial_cure_amount_nested_rounding_order
        grounds:
          - calculations.foreclosure_cure_amount
          - calculations.foreclosure_cure_amount.precision
          - entities.ForeclosureCase.fields.cure_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. cure_amount sums
          four integer-cent terms (principal_arrears = months_pd *
          scheduled_pi, accrued_interest, late_fees, fixed foreclosure fee).
          The scaffold pins "round half_up applied per term" -- alternative
          "round only at final sum" produces drift when the per-term inputs
          come from rounded sources. This instance fixes integer inputs so
          the literal cure_amount == 1604460 is deterministic.
        test_recipe:
          setup:
            - "Loan filed for foreclosure with 125 days past due, scheduled_pi=179865, accrued_interest=600000, outstanding late_fees=35000"
            - "ForeclosureCase auto-advanced to MEDIATION_REQUIRED; cure_amount_cents pinned"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b4@x.com", full_name: "Borrower Four", ssn_last4: "4444" }
              as: LoanServicer
              captures: { b4_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b4_id}", origination_date: "2025-08-29T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan4_id: $.data.id, loan4_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan4_id}"
              payload: {}
              as: LoanServicer
              captures: { loan4_v_pre_fore: $.data.version }
          trigger:
            - call: "POST /loans/${loan4_id}/foreclosure"
              payload: { expected_loan_version: "${loan4_v_pre_fore}" }
              as: LoanServicer
              captures: { fc4_id: $.data.id, fc4_cure: $.data.cure_amount_cents }
          assert:
            - "ForeclosureCase.${fc4_id}.status == MEDIATION_REQUIRED"
            - "Loan.${loan4_id}.status == FORECLOSURE"
            - "ForeclosureCase.${fc4_id}.cure_amount_cents == 1604460   # 4*179865 + 600000 + 35000 + 250000 = 1604460; computed with per-term half-up rounding"

  # ============================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # ============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_loan_cycle_delinquent_forbearance_delinquent
        grounds:
          - state_machines.Loan.transitions.DELINQUENT_to_FORBEARANCE
          - state_machines.Loan.transitions.FORBEARANCE_to_DELINQUENT
          - state_machines.Loan.transitions.DELINQUENT_to_CURRENT
        distinguishing_aspect: |
          Loan state machine exhibits a cycle: DELINQUENT -> FORBEARANCE ->
          DELINQUENT (terminate-early) -> CURRENT (cure via payment) ->
          DELINQUENT (clock advance) -- revision-loop shape. Different entity
          from the second instance.
        test_recipe:
          setup:
            - "Loan originated 2025-06-01; advanced past grace into DELINQUENT"
            - "ForbearancePlan proposed and activated, then terminated early to return loan to DELINQUENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b5@x.com", full_name: "Borrower Five", ssn_last4: "5555" }
              as: LoanServicer
              captures: { b5_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b5_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan5_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-25T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan5_id}/forbearance-plans"
              payload: { start_date: "2025-08-01T00:00:00Z", end_date: "2025-10-31T00:00:00Z", reduced_payment_cents: 50000 }
              as: LoanServicer
              captures: { fb5_id: $.data.id }
            - call: "POST /forbearance-plans/${fb5_id}/activate"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "GET /loans/${loan5_id}"
              payload: {}
              as: LoanServicer
              captures: { loan5_status_in_fb: $.data.status }
            - call: "POST /forbearance-plans/${fb5_id}/terminate"
              payload: {}
              as: LoanServicer
              captures: { fb5_terminated_status: $.data.status }
          assert:
            - "Loan.${loan5_id}.status == DELINQUENT   # back to DELINQUENT after termination (cycle closes)"
            - "ForbearancePlan.${fb5_id}.status == TERMINATED_EARLY"

      - name: non_linear_foreclosure_branching_mediation_outcome
        grounds:
          - state_machines.ForeclosureCase.transitions.IN_MEDIATION_to_COMPLETED
          - state_machines.ForeclosureCase.transitions.IN_MEDIATION_to_MEDIATION_FAILED
        distinguishing_aspect: |
          ForeclosureCase state machine exhibits branching: IN_MEDIATION forks
          to {COMPLETED via MODIFICATION_AGREED, COMPLETED via
          FORBEARANCE_AGREED, MEDIATION_FAILED via NO_AGREEMENT} with divergent
          side-effect sets (Loan -> REINSTATED vs Loan -> FORBEARANCE vs Loan
          stays FORECLOSURE). Different entity from the first instance.
        test_recipe:
          setup:
            - "Loan in FORECLOSURE; ForeclosureCase in IN_MEDIATION after a scheduled mediation session"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b6@x.com", full_name: "Borrower Six", ssn_last4: "6666" }
              as: LoanServicer
              captures: { b6_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b6_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan6_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-15T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan6_id}"
              payload: {}
              as: LoanServicer
              captures: { loan6_v_pre_fc: $.data.version }
            - call: "POST /loans/${loan6_id}/foreclosure"
              payload: { expected_loan_version: "${loan6_v_pre_fc}" }
              as: LoanServicer
              captures: { fc6_id: $.data.id }
            - call: "POST /foreclosure-cases/${fc6_id}/mediation-sessions"
              payload: { scheduled_for: "2025-11-01T00:00:00Z" }
              as: LoanServicer
              captures: { ms6_id: $.data.id }
          trigger:
            - call: "POST /mediation-sessions/${ms6_id}/record-outcome"
              payload: { outcome: "MODIFICATION_AGREED", modification_pi_cents: 150000 }
              as: LoanServicer
              captures: { ms6_outcome: $.data.outcome }
          assert:
            - "MediationSession.${ms6_id}.outcome == MODIFICATION_AGREED"
            - "ForeclosureCase.${fc6_id}.status == COMPLETED"
            - "Loan.${loan6_id}.status == REINSTATED"
            - "Loan.${loan6_id}.scheduled_monthly_pi_cents == 150000   # modification took effect"

  # ============================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # ============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_payoff_loan_cancels_disbursements_three_hops
        grounds:
          - state_machines.Loan.transitions.CURRENT_to_PAID_OFF
          - state_machines.EscrowDisbursement.transitions.SCHEDULED_to_CANCELLED
          - calculations.payment_posting
        distinguishing_aspect: |
          Depth-3 cascade: (1) POST /payments triggers payment_posting; (2)
          payment_posting computes balance retirement and triggers
          Loan.status->PAID_OFF; (3) PAID_OFF transition triggers
          EscrowDisbursement SCHEDULED->CANCELLED on all open disbursements
          for the loan's escrow_account. Each link is caused by the previous,
          not by the original payment.
        test_recipe:
          setup:
            - "Loan with very small principal_balance (e.g., $1000 outstanding) and one SCHEDULED disbursement"
            - "Borrower pays exactly enough to retire the loan"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b7@x.com", full_name: "Borrower Seven", ssn_last4: "7777" }
              as: LoanServicer
              captures: { b7_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b7_id}", origination_date: "2025-12-01T00:00:00Z", original_principal_cents: 12000000, original_property_value_cents: 30000000, interest_rate_bps: 0, term_months: 120, pmi_monthly_cents: 0 }
              as: LoanServicer
              captures: { loan7_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${loan7_id}", annual_tax_cents: 360000, annual_insurance_cents: 60000, cushion_months: 2 }
              as: LoanServicer
              captures: { esc7_id: $.data.id }
            - call: "POST /escrow-accounts/${esc7_id}/disbursements"
              payload: { kind: "TAX", amount_cents: 360000, scheduled_for: "2026-04-15T00:00:00Z" }
              as: LoanServicer
              captures: { d7_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan7_id}/payments"
              payload: { amount_cents: 12000000, received_at: "2025-12-15T00:00:00Z" }
              as: LoanServicer
              captures: { pay7_status: $.data.status }
          assert:
            - "Loan.${loan7_id}.status == PAID_OFF"
            - "Loan.${loan7_id}.principal_balance_cents == 0"
            - "EscrowDisbursement.${d7_id}.status == CANCELLED"

      - name: cascade_clock_advance_drives_delinquency_then_pmi_pending_blocks
        grounds:
          - state_machines.Loan.transitions.CURRENT_to_DELINQUENT
          - state_machines.PMIRemovalRequest.transitions.PENDING_to_DENIED
          - calculations.pmi_eligibility
        distinguishing_aspect: |
          Depth-2 cascade, distinct trigger: (1) POST /_clock/set_current_utc
          past grace -> Loan auto-transitions CURRENT->DELINQUENT (link 1);
          (2) a subsequent POST /pmi-removal-requests/{id}/decide observes
          loan.status == DELINQUENT and is denied with
          denial_reason=IN_DELINQUENCY (link 2 is caused by the state change
          link 1 produced, not directly by the clock). Originating trigger
          is the clock; first instance's trigger is a payment.
        test_recipe:
          setup:
            - "Loan originated; PMI request submitted while Loan is CURRENT (PENDING)"
            - "Clock then advanced past grace so Loan auto-transitions to DELINQUENT before the decide call"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b8@x.com", full_name: "Borrower Eight", ssn_last4: "8888" }
              as: LoanServicer
              captures: { b8_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b8_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 28000000, original_property_value_cents: 40000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 11000 }
              as: LoanServicer
              captures: { loan8_id: $.data.id }
            - call: "POST /pmi-removal-requests"
              payload: { loan_id: "${loan8_id}" }
              as: LoanServicer
              captures: { pmi8_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-08-15T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan8_id}"
              payload: {}
              as: LoanServicer
              captures: { loan8_status_post_clock: $.data.status }
            - call: "POST /pmi-removal-requests/${pmi8_id}/decide"
              payload: {}
              as: ComplianceOfficer
              captures: { pmi8_decision_status: $.data.status, pmi8_denial_reason: $.data.denial_reason }
          assert:
            - "Loan.${loan8_id}.status == DELINQUENT   # link 1 of cascade"
            - "PMIRemovalRequest.${pmi8_id}.status == DENIED"
            - "PMIRemovalRequest.${pmi8_id}.denial_reason == IN_DELINQUENCY   # link 2 follows from link 1"

  # ============================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # ============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_business_fiscal_pmi_decide
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PMI_NOT_ELIGIBLE_LTV
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_fiscal
          (priority 13, ERR_PMI_NOT_ELIGIBLE_LTV). A decide call on a request
          that is already APPROVED AND would also fail LTV must return the
          state error -- state precedes business_fiscal.
        test_recipe:
          setup:
            - "Loan with high LTV (would fail LTV check) and a PMI request that has already been DENIED earlier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b9@x.com", full_name: "Borrower Nine", ssn_last4: "9999" }
              as: LoanServicer
              captures: { b9_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b9_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 32000000, original_property_value_cents: 40000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 13000 }
              as: LoanServicer
              captures: { loan9_id: $.data.id }
            - call: "POST /pmi-removal-requests"
              payload: { loan_id: "${loan9_id}" }
              as: LoanServicer
              captures: { pmi9_id: $.data.id }
            - call: "POST /pmi-removal-requests/${pmi9_id}/decide"
              payload: {}
              as: ComplianceOfficer
              captures: { pmi9_first_decide: $.data.status }
          trigger:
            - call: "POST /pmi-removal-requests/${pmi9_id}/decide"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "PMIRemovalRequest.${pmi9_id}.status == DENIED   # was DENIED on first decide"
            - "trigger response.error_id == ERR_INVALID_STATE   # state precedence over ERR_PMI_NOT_ELIGIBLE_LTV"

      - name: priority_business_safety_beats_business_temporal_schedule_sale
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors.ERR_MEDIATION_REQUIRED
          - errors.ERR_DISBURSEMENT_IN_PAST
        distinguishing_aspect: |
          Pair: business_safety (priority 7, ERR_MEDIATION_REQUIRED on
          POST /foreclosure-cases/{id}/schedule-sale) vs business_temporal
          (priority 10, ERR_DISBURSEMENT_IN_PAST on
          POST /escrow-accounts/{id}/disbursements). Tested separately on the
          two endpoints they apply to; ordering invariant pinned: a
          schedule-sale call from a ForeclosureCase still in
          MEDIATION_REQUIRED (mediation not done) must return
          ERR_MEDIATION_REQUIRED even if the proposed sale_date is otherwise
          too soon (would also be a business_safety notice violation).
          Different error-category pair from instance 1.
        test_recipe:
          setup:
            - "Loan in FORECLOSURE with ForeclosureCase still in MEDIATION_REQUIRED (no session scheduled)"
            - "Call schedule-sale with sale_date that is BOTH < SALE_NOTICE_DAYS (too soon) AND while case status is MEDIATION_REQUIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b10@x.com", full_name: "Borrower Ten", ssn_last4: "0010" }
              as: LoanServicer
              captures: { b10_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b10_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan10_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-15T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan10_id}"
              payload: {}
              as: LoanServicer
              captures: { loan10_v_pre_fc: $.data.version }
            - call: "POST /loans/${loan10_id}/foreclosure"
              payload: { expected_loan_version: "${loan10_v_pre_fc}" }
              as: LoanServicer
              captures: { fc10_id: $.data.id }
          trigger:
            - call: "POST /foreclosure-cases/${fc10_id}/schedule-sale"
              payload: { sale_date: "2025-10-20T00:00:00Z" }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "ForeclosureCase.${fc10_id}.status == MEDIATION_REQUIRED"
            - "trigger response.error_id == ERR_MEDIATION_REQUIRED   # mediation-required (safety) precedes notice-period (temporal)"

  # ============================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_pmi_ltv_exact_8000_bps_denied
        grounds:
          - calculations.pmi_eligibility
          - validations[priority=13]
          - errors.ERR_PMI_NOT_ELIGIBLE_LTV
        distinguishing_aspect: |
          Numeric boundary on POST /pmi-removal-requests/{id}/decide. LTV at
          exactly 8000 bps (80.00%) fails (denial uses >= 8000 -- the
          condition is "not strictly less than 8000"). Inputs:
          principal_balance=32000000, original_property_value=40000000 ->
          ltv = round_half_up(32000000 * 10000 / 40000000) = 8000.
        test_recipe:
          setup:
            - "Loan with principal_balance=32000000 cents, original_property_value=40000000 cents, status=CURRENT"
            - "PMIRemovalRequest submitted at this exact balance"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b11@x.com", full_name: "Borrower Eleven", ssn_last4: "0011" }
              as: LoanServicer
              captures: { b11_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b11_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 32000000, original_property_value_cents: 40000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 13000 }
              as: LoanServicer
              captures: { loan11_id: $.data.id }
            - call: "POST /pmi-removal-requests"
              payload: { loan_id: "${loan11_id}" }
              as: LoanServicer
              captures: { pmi11_id: $.data.id, pmi11_ltv: $.data.computed_ltv_bps }
          trigger:
            - call: "POST /pmi-removal-requests/${pmi11_id}/decide"
              payload: {}
              as: ComplianceOfficer
              captures: { pmi11_status: $.data.status, pmi11_reason: $.data.denial_reason }
          assert:
            - "PMIRemovalRequest.${pmi11_id}.computed_ltv_bps == 8000"
            - "PMIRemovalRequest.${pmi11_id}.status == DENIED"
            - "PMIRemovalRequest.${pmi11_id}.denial_reason == LTV_TOO_HIGH"

      - name: boundary_mediation_notice_exactly_14_days_allowed
        grounds:
          - validations[priority=8]
          - errors.ERR_NOTICE_PERIOD_VIOLATED
          - state_machines.ForeclosureCase.transitions.MEDIATION_REQUIRED_to_IN_MEDIATION
        distinguishing_aspect: |
          Temporal boundary on POST /foreclosure-cases/{id}/mediation-sessions
          on a different endpoint and a different metric (calendar-days notice
          window) from the first instance. scheduled_for at exactly
          current_utc + 14 days (MEDIATION_NOTICE_DAYS) is allowed (>= 14);
          scheduled_for at +13 days fails. This sub-instance pins the +14
          accept case.
        test_recipe:
          setup:
            - "Loan in FORECLOSURE; ForeclosureCase in MEDIATION_REQUIRED"
            - "Clock at 2025-11-01; session scheduled at 2025-11-15 (exactly +14 days)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b12@x.com", full_name: "Borrower Twelve", ssn_last4: "0012" }
              as: LoanServicer
              captures: { b12_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b12_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan12_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-15T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan12_id}"
              payload: {}
              as: LoanServicer
              captures: { loan12_v_pre_fc: $.data.version }
            - call: "POST /loans/${loan12_id}/foreclosure"
              payload: { expected_loan_version: "${loan12_v_pre_fc}" }
              as: LoanServicer
              captures: { fc12_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /foreclosure-cases/${fc12_id}/mediation-sessions"
              payload: { scheduled_for: "2025-11-15T00:00:00Z" }
              as: LoanServicer
              captures: { ms12_id: $.data.id }
          assert:
            - "MediationSession.${ms12_id}.outcome == PENDING"
            - "MediationSession.${ms12_id}.scheduled_for == 2025-11-15T00:00:00Z"
            - "ForeclosureCase.${fc12_id}.status == IN_MEDIATION   # exactly +14 days is accepted"

  # ============================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_loan_forbearanceplan_blocks_foreclosure
        grounds:
          - state_machines.Loan.transitions.DELINQUENT_to_FORECLOSURE
          - state_machines.ForbearancePlan.transitions.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          Pair: Loan -> ForbearancePlan. Loan.DELINQUENT->FORECLOSURE
          precondition includes "No ForbearancePlan in ACTIVE state for this
          loan". When the loan has an ACTIVE forbearance, foreclosure filing
          is rejected even if days_past_due >= 120.
        test_recipe:
          setup:
            - "Loan with days_past_due >= 120 AND a ForbearancePlan in ACTIVE state on the same loan"
            - "Note: Loan.status will be FORBEARANCE (cascade from activate), not DELINQUENT, so endpoint hits ERR_INVALID_STATE first"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-04-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b13@x.com", full_name: "Borrower Thirteen", ssn_last4: "0013" }
              as: LoanServicer
              captures: { b13_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b13_id}", origination_date: "2025-04-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan13_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-05-25T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan13_id}/forbearance-plans"
              payload: { start_date: "2025-06-01T00:00:00Z", end_date: "2025-11-30T00:00:00Z", reduced_payment_cents: 50000 }
              as: LoanServicer
              captures: { fb13_id: $.data.id }
            - call: "POST /forbearance-plans/${fb13_id}/activate"
              payload: {}
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-01T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan13_id}"
              payload: {}
              as: LoanServicer
              captures: { loan13_v_pre_fc_attempt: $.data.version, loan13_status_pre: $.data.status }
          trigger:
            - call: "POST /loans/${loan13_id}/foreclosure"
              payload: { expected_loan_version: "${loan13_v_pre_fc_attempt}" }
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "Loan.${loan13_id}.status == FORBEARANCE   # cascade from forbearance activation"
            - "trigger response.error_id == ERR_INVALID_STATE   # loan not in DELINQUENT; ForbearancePlan ACTIVE blocks the transition"

      - name: cross_escrowdisbursement_escrowaccount_balance_dependency
        grounds:
          - state_machines.EscrowDisbursement.transitions.SCHEDULED_to_PAID
          - state_machines.EscrowDisbursement.transitions.SCHEDULED_to_FAILED
        distinguishing_aspect: |
          Pair: EscrowDisbursement -> EscrowAccount. The SCHEDULED->PAID
          transition depends on EscrowAccount.balance_cents >= amount_cents;
          when balance is below amount the system instead transitions
          SCHEDULED->FAILED with failure_reason=INSUFFICIENT_FUNDS. Different
          entity pair from instance 1.
        test_recipe:
          setup:
            - "EscrowAccount with balance well below the SCHEDULED disbursement amount"
            - "Disbursement scheduled in the near future"
            - "Clock then advanced past scheduled_for"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b14@x.com", full_name: "Borrower Fourteen", ssn_last4: "0014" }
              as: LoanServicer
              captures: { b14_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b14_id}", origination_date: "2026-01-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan14_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${loan14_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
              captures: { esc14_id: $.data.id }
            - call: "POST /escrow-accounts/${esc14_id}/disbursements"
              payload: { kind: "TAX", amount_cents: 480000, scheduled_for: "2026-02-01T00:00:00Z" }
              as: LoanServicer
              captures: { d14_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: LoanServicer
            - call: "GET /escrow-disbursements/${d14_id}"
              payload: {}
              as: LoanServicer
              captures: { d14_status: $.data.status, d14_reason: $.data.failure_reason }
          assert:
            - "EscrowDisbursement.${d14_id}.status == FAILED"
            - "EscrowDisbursement.${d14_id}.failure_reason == INSUFFICIENT_FUNDS"

  # ============================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_forbearance_window_inclusive_half_open_collision
        grounds:
          - state_machines.ForbearancePlan.transitions.PROPOSED_to_ACTIVE
          - validations[priority=5]
          - validations[priority=9]
        distinguishing_aspect: |
          ForbearancePlan window semantics: the proposed [start_date,
          end_date] window collides with an existing ACTIVE window on the
          same Loan whose ranges overlap. Interval semantics: inclusive on
          both endpoints (a plan ending 2025-10-31 collides with a plan
          starting 2025-10-31 on the same loan because both endpoints are
          inclusive). Activation of a second overlapping plan is rejected
          because the loan is in FORBEARANCE (not DELINQUENT) -- captured by
          the cross-state check. Resource: Loan.
        test_recipe:
          setup:
            - "Loan in DELINQUENT; first ForbearancePlan activated covering 2025-08-01..2025-10-31 (loan now FORBEARANCE)"
            - "Second plan proposed covering 2025-10-31..2025-12-31 (inclusive overlap on 2025-10-31)"
            - "Attempt to activate the second plan while first is still ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b15@x.com", full_name: "Borrower Fifteen", ssn_last4: "0015" }
              as: LoanServicer
              captures: { b15_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b15_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan15_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-25T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan15_id}/forbearance-plans"
              payload: { start_date: "2025-08-01T00:00:00Z", end_date: "2025-10-31T00:00:00Z", reduced_payment_cents: 50000 }
              as: LoanServicer
              captures: { fb15a_id: $.data.id }
            - call: "POST /forbearance-plans/${fb15a_id}/activate"
              payload: {}
              as: LoanServicer
            - call: "POST /loans/${loan15_id}/forbearance-plans"
              payload: { start_date: "2025-10-31T00:00:00Z", end_date: "2025-12-31T00:00:00Z", reduced_payment_cents: 60000 }
              as: LoanServicer
              captures: { fb15b_id: $.data.id }
          trigger:
            - call: "POST /forbearance-plans/${fb15b_id}/activate"
              payload: {}
              as: LoanServicer
              captures: { err_id: $.data.error_id }
          assert:
            - "ForbearancePlan.${fb15a_id}.status == ACTIVE"
            - "ForbearancePlan.${fb15b_id}.status == PROPOSED   # second never activated"
            - "trigger response.error_id == ERR_INVALID_STATE   # Loan already in FORBEARANCE; activation requires DELINQUENT/FORECLOSURE"

      - name: overlap_disbursement_capacity_aggregate_under_balance
        grounds:
          - state_machines.EscrowDisbursement.transitions.SCHEDULED_to_PAID
          - state_machines.EscrowDisbursement.transitions.SCHEDULED_to_FAILED
          - calculations.escrow_analysis
        distinguishing_aspect: |
          EscrowDisbursement aggregate-capacity semantics: multiple SCHEDULED
          disbursements with overlapping target windows compete for one
          shared EscrowAccount.balance_cents. Interval semantics differ from
          instance 1: this is aggregate-capacity collision (sum exceeds
          balance), not point-interval overlap. Resource: EscrowAccount.
          Disbursement processed first by scheduled_for ASC, then created_at
          ASC for ties; the earlier one PAYs, the later one FAILS with
          INSUFFICIENT_FUNDS if the balance can no longer cover it.
        test_recipe:
          setup:
            - "EscrowAccount built up to exactly 500000 cents balance"
            - "Two disbursements scheduled for the same day, each 300000 cents (sum 600000 > 500000)"
            - "Clock advanced past scheduled_for so both auto-evaluate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b16@x.com", full_name: "Borrower Sixteen", ssn_last4: "0016" }
              as: LoanServicer
              captures: { b16_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b16_id}", origination_date: "2025-12-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan16_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${loan16_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
              captures: { esc16_id: $.data.id }
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 742365, received_at: "2025-12-15T00:00:00Z" }
              as: LoanServicer
            # After this payment: principal=29850135 (=30000000-29865-extra_principal stuff), interest=150000 paid,
            # but more critically the escrow allocation:
            # interest=150000, principal=29865, escrow=50000, pmi=12500, total used=242365; surplus = 742365-242365 = 500000 to SUSPENSE
            # ACTUAL escrow_cents allocated = 50000. So balance = 50000 after payment, NOT 500000.
            # Need different setup: keep paying so escrow accumulates, or use a much larger escrow component.
            # Use schedule: post 10 monthly payments of 242365 each so escrow accumulates 500000.
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-02-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-03-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-04-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-05-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-07-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-08-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan16_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-09-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /escrow-accounts/${esc16_id}/disbursements"
              payload: { kind: "TAX", amount_cents: 300000, scheduled_for: "2026-12-01T00:00:00Z" }
              as: LoanServicer
              captures: { d16a_id: $.data.id }
            - call: "POST /escrow-accounts/${esc16_id}/disbursements"
              payload: { kind: "INSURANCE", amount_cents: 300000, scheduled_for: "2026-12-01T00:00:00Z" }
              as: LoanServicer
              captures: { d16b_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: LoanServicer
            - call: "GET /escrow-disbursements/${d16a_id}"
              payload: {}
              as: LoanServicer
              captures: { d16a_status: $.data.status }
            - call: "GET /escrow-disbursements/${d16b_id}"
              payload: {}
              as: LoanServicer
              captures: { d16b_status: $.data.status, d16b_reason: $.data.failure_reason }
          assert:
            - "EscrowDisbursement.${d16a_id}.status == PAID   # created first, processed first"
            - "EscrowDisbursement.${d16b_id}.status == FAILED"
            - "EscrowDisbursement.${d16b_id}.failure_reason == INSUFFICIENT_FUNDS"

  # ============================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_payment_then_reversal_preserves_principal_balance
        grounds:
          - calculations.payment_posting
          - state_machines.Loan.transitions.DELINQUENT_to_CURRENT
        distinguishing_aspect: |
          Conserved quantity: Loan.principal_balance_cents. Posting a payment
          and then withdrawing the foreclosure (compensating action) must
          leave principal_balance_cents equal to its pre-payment value plus
          the payment's principal allocation minus the same allocation
          back-out -- pinned formula: principal_balance_after_compensation =
          principal_balance_before_payment. (Note: this benchmark models the
          compensation pair as foreclosure-file + foreclosure-withdraw, which
          conserves principal_balance_cents because withdraw is a status
          change only -- no principal accounting moves.)
        test_recipe:
          setup:
            - "Loan in DELINQUENT with days_past_due >= 120; principal_balance pinned as B0"
            - "Foreclosure filed (no principal mutation); then immediately withdrawn"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b17@x.com", full_name: "Borrower Seventeen", ssn_last4: "0017" }
              as: LoanServicer
              captures: { b17_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b17_id}", origination_date: "2025-06-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan17_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-10-15T00:00:00Z" }
              as: LoanServicer
            - call: "GET /loans/${loan17_id}"
              payload: {}
              as: LoanServicer
              captures: { loan17_balance_before: $.data.principal_balance_cents, loan17_v_pre_fc: $.data.version }
            - call: "POST /loans/${loan17_id}/foreclosure"
              payload: { expected_loan_version: "${loan17_v_pre_fc}" }
              as: LoanServicer
              captures: { fc17_id: $.data.id }
          trigger:
            - call: "POST /foreclosure-cases/${fc17_id}/withdraw"
              payload: {}
              as: LoanServicer
            - call: "GET /loans/${loan17_id}"
              payload: {}
              as: LoanServicer
              captures: { loan17_balance_after: $.data.principal_balance_cents, loan17_status_after: $.data.status }
          assert:
            - "Loan.${loan17_id}.principal_balance_cents == 30000000   # equals loan17_balance_before == B0 (no payments posted in between)"
            - "Loan.${loan17_id}.status == REINSTATED   # withdraw compensates the file action"

      - name: invariant_disbursement_cancel_preserves_escrow_balance
        grounds:
          - state_machines.EscrowDisbursement.transitions.SCHEDULED_to_CANCELLED
          - entities.EscrowAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: EscrowAccount.balance_cents -- a different
          quantity from instance 1's Loan.principal_balance_cents.
          Scheduling a disbursement does NOT move balance (only PAID/FAILED
          do); cancelling a SCHEDULED disbursement therefore must leave
          balance_cents unchanged. Invariant: balance_after_cancel ==
          balance_before_schedule. Pinned literal in this setup is
          balance == 50000 throughout.
        test_recipe:
          setup:
            - "EscrowAccount accrued to balance_cents=50000 via one posted payment"
            - "Disbursement scheduled (no balance change)"
            - "Disbursement cancelled (no balance change)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /borrowers"
              payload: { email: "b18@x.com", full_name: "Borrower Eighteen", ssn_last4: "0018" }
              as: LoanServicer
              captures: { b18_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${b18_id}", origination_date: "2025-12-01T00:00:00Z", original_principal_cents: 30000000, original_property_value_cents: 35000000, interest_rate_bps: 600, term_months: 360, pmi_monthly_cents: 12500 }
              as: LoanServicer
              captures: { loan18_id: $.data.id }
            - call: "POST /escrow-accounts"
              payload: { loan_id: "${loan18_id}", annual_tax_cents: 480000, annual_insurance_cents: 120000, cushion_months: 2 }
              as: LoanServicer
              captures: { esc18_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loans/${loan18_id}/payments"
              payload: { amount_cents: 242365, received_at: "2026-01-01T00:00:00Z" }
              as: LoanServicer
            - call: "GET /escrow-accounts/${esc18_id}"
              payload: {}
              as: LoanServicer
              captures: { esc18_balance_pre: $.data.balance_cents }
            - call: "POST /escrow-accounts/${esc18_id}/disbursements"
              payload: { kind: "TAX", amount_cents: 30000, scheduled_for: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { d18_id: $.data.id }
          trigger:
            - call: "POST /escrow-disbursements/${d18_id}/cancel"
              payload: {}
              as: LoanServicer
            - call: "GET /escrow-accounts/${esc18_id}"
              payload: {}
              as: LoanServicer
              captures: { esc18_balance_after: $.data.balance_cents }
          assert:
            - "EscrowAccount.${esc18_id}.balance_cents == 50000   # equals esc18_balance_pre (one $5,000 monthly escrow inflow not impacted by schedule+cancel pair)"
            - "EscrowDisbursement.${d18_id}.status == CANCELLED"
