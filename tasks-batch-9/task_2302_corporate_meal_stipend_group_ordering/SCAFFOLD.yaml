# =============================================================================
# PRD Benchmark Seed Tables — task_2302
# Corporate Meal Stipend & Group Ordering Benefit
# Difficulty target: harder than expert (expert-plus)
# =============================================================================

scenario: |
  2302. Corporate Meal Stipend & Group Ordering Benefit (Grubhub Corporate): budget rules by
  employee group with per-meal caps and eligible days/hours, employee spend over the cap collected
  on a personal card, group order coordination with cutoff and per-person limits, restaurant
  eligibility filtering and delivery-radius constraints, expense reporting integration and receipt
  export, imputed income and taxable benefit treatment, unused budget rollover policy and program
  cost forecasting, refund and missing-item credit routing between employer and employee

domain_name: corporate-meal-stipend
api_prefix: ""    # flat peer resources mounted at the API root

complexity_profile:
  primary_archetype: "Ledger reconciliation — every cent moved between employer budget, employee
    personal card, platform fees and refund credits must reconcile across four ledgers"
  secondary_archetype: "Quota / allocation — monthly budget allocation per employee with per-meal
    caps, daily meal limits, reservation, rollover and forfeiture"
  complexity_layers:
    - dual_variant_calculation      # taxable-benefit method, forecast basis, refund routing basis
    - cascading_side_effects        # order deliver -> period -> imputed record -> employee YTD
    - optimistic_concurrency        # expected_<parent>_version on 3 write endpoints
    - rate_threshold_triggers       # cumulative MTD admin-fee tiers, de-minimis per-meal threshold
    - derived_field_reconciliation  # program/period/order rollups recomputed on every money move
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential          # BenefitPeriod.predecessor_period_id
    - cross_aggregate           # Order <-> GroupOrder <-> Restaurant <-> DeliveryLocation
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_notes: |
    Expert-plus. Beyond the expert band on four axes: (1) three independent dual-variant
    calculations whose variants are pinned at different lifecycle moments (budget rule pinned at
    period open, taxable method pinned at first accrual, refund routing chosen at claim resolve);
    (2) a five-stage money pipeline (line tax -> fee assessment -> employer/employee split ->
    admin fee -> refund routing) where every stage has a distinct rounding contract and stage 2
    is order-pinned (clamp-then-discount) so a re-derivation in the other order is observably
    wrong; (3) two orthogonal overlap semantics live side by side (restaurant group-delivery
    capacity is half-open, delivery-dock occupancy is closed-with-buffer), so the same pair of
    adjacent windows is legal for one and illegal for the other; (4) three compensating
    invariants (cash conservation, budget partition, imputed-income conservation) that must hold
    after every refund, void, close and rollover.

# =============================================================================
# §1.0 Response Envelope (fixed)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Table 1: Entity-Relationship Table
# =============================================================================
entities:

  # --- 1. MealProgram — tenant root -----------------------------------------
  - name: MealProgram
    parent: null
    common_fields: true
    fields:
      - name: employer_name
        type: string
        source: input
        required: true
        description: "Legal name of the employer sponsoring the meal benefit."
      - name: billing_account_ref
        type: string
        source: input
        required: true
        description: "Opaque employer billing account reference used on expense exports."
      - name: max_delivery_radius_km
        type: number
        source: input
        required: false
        default: 8.0
        description: "Program-wide delivery radius ceiling in km, measured from the delivery location."
        constraints: "> 0 and <= 50.0; the effective radius for a restaurant is min(this, Restaurant.delivery_radius_km)"
      - name: eligible_cuisines
        type: array
        source: input
        required: true
        description: "Allow-list of cuisine tags. A restaurant whose cuisine is absent is never eligible."
        constraints: "non-empty array of distinct uppercase strings"
      - name: taxable_benefit_method
        type: enum
        source: input
        required: false
        default: DE_MINIMIS_EXCLUSION
        description: "Variant selector for imputed_income_accrual."
        constraints: "DE_MINIMIS_EXCLUSION | FULL_INCLUSION"
      - name: rollover_policy
        type: enum
        source: input
        required: false
        default: CAPPED_PCT
        description: "How unused benefit-period budget is treated at close."
        constraints: "NONE | CAPPED_PCT | FULL"
      - name: rollover_cap_pct
        type: number
        source: input
        required: false
        default: 0.25
        description: "Fraction of the original allocation that may roll forward when rollover_policy is CAPPED_PCT."
        constraints: ">= 0 and <= 1; ignored when rollover_policy is NONE or FULL"
      - name: forecast_basis
        type: enum
        source: input
        required: false
        default: COMMITMENT
        description: "Variant selector for program_cost_forecast."
        constraints: "COMMITMENT | RUN_RATE"
      - name: program_spent_cents
        type: integer
        source: computed
        required: false
        description: "Sum of employer_net_cents over all non-voided orders in the program. Recomputed on every money move."
      - name: program_reserved_cents
        type: integer
        source: computed
        required: false
        description: "Sum of reserved_cents over all OPEN and GRACE benefit periods in the program."
      - name: mtd_employer_captured_cents
        type: integer
        source: computed
        required: false
        description: "Employer-covered cents captured in the current logical calendar month; the tier input of admin_fee_assessment."

  # --- 2. EmployeeGroup -----------------------------------------------------
  - name: EmployeeGroup
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> MealProgram.id; the program that owns this group."
      - name: name
        type: string
        source: input
        required: true
        description: "Group label, e.g. Engineering."
        constraints: "unique per program_id (case-insensitive)"
      - name: headcount_planned
        type: integer
        source: input
        required: true
        description: "Planned headcount, the multiplier used by program_cost_forecast in COMMITMENT mode."
        constraints: ">= 1"
      - name: active_rule_count
        type: integer
        source: computed
        required: false
        description: "Number of BudgetRule rows for this group in status ACTIVE. Invariant: always 0 or 1."

  # --- 3. BudgetRule --------------------------------------------------------
  - name: BudgetRule
    parent: null
    common_fields: true
    fields:
      - name: group_id
        type: string
        source: input
        required: true
        description: "FK -> EmployeeGroup.id; the group this rule governs."
      - name: effective_from
        type: datetime
        source: input
        required: true
        description: "First UTC instant at which this rule may be pinned to a benefit period."
      - name: per_meal_cap_cents
        type: integer
        source: input
        required: true
        description: "Maximum employer contribution to a single order's covered base."
        constraints: ">= 1"
      - name: daily_meal_limit
        type: integer
        source: input
        required: true
        description: "Maximum number of PLACED-or-beyond, non-cancelled orders per employee per eligible calendar day (UTC)."
        constraints: ">= 1 and <= 5"
      - name: monthly_allocation_cents
        type: integer
        source: input
        required: true
        description: "Employer budget granted to each employee in the group at benefit-period open."
        constraints: ">= 0"
      - name: eligible_weekdays
        type: array
        source: input
        required: true
        description: "ISO-8601 weekday numbers (1=Monday .. 7=Sunday) on which orders may be placed."
        constraints: "non-empty array of distinct integers in 1..7"
      - name: eligible_window_start_minute
        type: integer
        source: input
        required: true
        description: "Start of the daily eligible ordering window as minutes from UTC midnight, inclusive."
        constraints: ">= 0 and <= 1440"
      - name: eligible_window_end_minute
        type: integer
        source: input
        required: true
        description: "End of the daily eligible ordering window as minutes from UTC midnight, exclusive. Window is half-open [start, end)."
        constraints: "> eligible_window_start_minute and <= 1440"
      - name: overage_policy
        type: enum
        source: input
        required: false
        default: PERSONAL_CARD
        description: "What happens when an order's covered base exceeds per_meal_cap_cents."
        constraints: "PERSONAL_CARD | BLOCK"
      - name: tip_coverage_policy
        type: enum
        source: input
        required: false
        default: EMPLOYEE_PAYS_TIP
        description: "Whether the tip is admitted into the employer-covered base."
        constraints: "EMPLOYER_COVERS_TIP | EMPLOYEE_PAYS_TIP"
      - name: rule_sequence
        type: integer
        source: computed
        required: false
        description: "1-based activation ordinal within the group; assigned at activate, never reused."
      - name: drafted_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the caller that created the draft. Segregation of duties: the activator must differ from this value. Opaque identifier, not a foreign key."
      - name: status
        type: enum
        source: computed
        required: false
        default: DRAFT
        description: "Lifecycle state; see §1.2."
        constraints: "DRAFT | ACTIVE | SUPERSEDED"

  # --- 4. Employee ----------------------------------------------------------
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> MealProgram.id; the program this employee participates in."
      - name: group_id
        type: string
        source: input
        required: true
        description: "FK -> EmployeeGroup.id; must belong to the same program_id."
      - name: full_name
        type: string
        source: input
        required: true
        description: "Employee display name."
      - name: email
        type: string
        source: input
        required: true
        description: "Work email; unique per program and the deterministic tie-breaker in group_delivery_fee_allocation."
        constraints: "unique per program_id (case-insensitive)"
      - name: personal_card_on_file
        type: boolean
        source: input
        required: false
        default: false
        description: "Whether a personal card is available to collect over-cap spend and tips."
      - name: tax_treatment_flag
        type: enum
        source: computed
        required: false
        default: NONE
        description: "Flips to W2_IMPUTED once cumulative taxable imputed income crosses IMPUTED_REPORTING_THRESHOLD_CENTS."
        constraints: "NONE | W2_IMPUTED"
      - name: ytd_imputed_cents
        type: integer
        source: computed
        required: false
        description: "Sum of taxable_cents over all of this employee's ImputedIncomeRecord rows."
      - name: status
        type: enum
        source: computed
        required: false
        default: ACTIVE
        description: "Lifecycle state; see §1.2."
        constraints: "ACTIVE | INACTIVE"

  # --- 5. BenefitPeriod -----------------------------------------------------
  - name: BenefitPeriod
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        required: true
        description: "FK -> Employee.id; the employee whose budget this period holds."
      - name: budget_rule_id
        type: string
        source: computed
        required: false
        description: "FK -> BudgetRule.id; the ACTIVE rule of the employee's group, pinned at open and never re-read afterwards."
      - name: predecessor_period_id
        type: string
        source: input
        required: false
        description: "FK -> BenefitPeriod.id; self-referential link to the CLOSED period whose rollover_out_cents funds this period's rollover_in_cents."
      - name: period_month
        type: string
        source: input
        required: true
        description: "Budget month in YYYY-MM form; unique per employee_id."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: allocated_cents
        type: integer
        source: computed
        required: false
        description: "monthly_allocation_cents of the pinned rule plus rollover_in_cents."
      - name: rollover_in_cents
        type: integer
        source: computed
        required: false
        description: "rollover_out_cents copied from predecessor_period_id at open; 0 when there is no predecessor."
      - name: reserved_cents
        type: integer
        source: computed
        required: false
        description: "Employer cents held for orders that are PLACED or CONFIRMED but not yet DELIVERED."
      - name: spent_cents
        type: integer
        source: computed
        required: false
        description: "Employer cents captured by DELIVERED orders, net of employer refund credits."
      - name: available_cents
        type: integer
        source: computed
        required: false
        description: "allocated_cents - reserved_cents - spent_cents - forfeited_cents - rollover_out_cents."
      - name: forfeited_cents
        type: integer
        source: computed
        required: false
        description: "Unused cents extinguished at final close after rollover_out_cents is carved out."
      - name: rollover_out_cents
        type: integer
        source: computed
        required: false
        description: "Cents made available to a successor period at final close, per the program rollover policy."
      - name: status
        type: enum
        source: computed
        required: false
        default: OPEN
        description: "Lifecycle state; see §1.2."
        constraints: "OPEN | GRACE | CLOSED"

  # --- 6. Restaurant --------------------------------------------------------
  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: "Restaurant display name; the secondary sort key in restaurant_eligibility_selection."
      - name: cuisine
        type: string
        source: input
        required: true
        description: "Single uppercase cuisine tag matched against MealProgram.eligible_cuisines."
      - name: grid_x_km
        type: number
        source: input
        required: true
        description: "Planar grid X coordinate in km used for distance computation."
      - name: grid_y_km
        type: number
        source: input
        required: true
        description: "Planar grid Y coordinate in km used for distance computation."
      - name: delivery_radius_km
        type: number
        source: input
        required: true
        description: "How far this restaurant will deliver, in km."
        constraints: "> 0"
      - name: max_concurrent_group_deliveries
        type: integer
        source: input
        required: false
        default: 1
        description: "Maximum number of SUBMITTED group orders whose half-open delivery windows may overlap at this restaurant."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        required: false
        default: ELIGIBLE
        description: "Lifecycle state; see §1.2. Cyclic: may be suspended and reinstated."
        constraints: "ELIGIBLE | SUSPENDED"

  # --- 7. DeliveryLocation --------------------------------------------------
  - name: DeliveryLocation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> MealProgram.id; the program that owns this dock."
      - name: label
        type: string
        source: input
        required: true
        description: "Human label for the drop-off point, e.g. HQ Lobby."
        constraints: "unique per program_id (case-insensitive)"
      - name: grid_x_km
        type: number
        source: input
        required: true
        description: "Planar grid X coordinate in km."
      - name: grid_y_km
        type: number
        source: input
        required: true
        description: "Planar grid Y coordinate in km."
      - name: dock_buffer_minutes
        type: integer
        source: input
        required: false
        default: 15
        description: "Minutes of exclusive dock occupancy padded after a group delivery window end; makes dock occupancy a closed interval."
        constraints: ">= 0 and <= 120"

  # --- 8. GroupOrder --------------------------------------------------------
  - name: GroupOrder
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> MealProgram.id; the program funding this group order."
      - name: organizer_employee_id
        type: string
        source: input
        required: true
        description: "FK -> Employee.id; the employee coordinating the group order."
      - name: restaurant_id
        type: string
        source: input
        required: true
        description: "FK -> Restaurant.id; the single restaurant every member order must use."
      - name: delivery_location_id
        type: string
        source: input
        required: true
        description: "FK -> DeliveryLocation.id; the dock that receives the consolidated delivery."
      - name: cutoff_at
        type: datetime
        source: input
        required: true
        description: "Last UTC instant at which a member order may join; joining at or after this instant is rejected."
        constraints: "< window_start"
      - name: window_start
        type: datetime
        source: input
        required: true
        description: "Start of the consolidated delivery window (inclusive)."
      - name: window_end
        type: datetime
        source: input
        required: true
        description: "End of the consolidated delivery window (exclusive for restaurant capacity, inclusive for dock occupancy)."
        constraints: "> window_start"
      - name: per_person_limit_cents
        type: integer
        source: input
        required: true
        description: "Ceiling on each member order's pre-fee base (subtotal + tax); independent of and stricter than the budget rule cap."
        constraints: ">= 1"
      - name: member_order_count
        type: integer
        source: computed
        required: false
        description: "Number of non-cancelled member orders currently attached."
      - name: reopen_count
        type: integer
        source: computed
        required: false
        default: 0
        description: "How many times the group order has cycled LOCKED -> COLLECTING; capped by GROUP_REOPEN_LIMIT."
      - name: allocated_delivery_fee_cents
        type: integer
        source: computed
        required: false
        description: "GROUP_DELIVERY_FEE_CENTS split across member orders at submit; 0 before submit."
      - name: status
        type: enum
        source: computed
        required: false
        default: COLLECTING
        description: "Lifecycle state; see §1.2. Cyclic via reopen."
        constraints: "COLLECTING | LOCKED | SUBMITTED | CANCELLED"

  # --- 9. Order -------------------------------------------------------------
  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        required: true
        description: "FK -> Employee.id; the ordering employee."
      - name: benefit_period_id
        type: string
        source: input
        required: true
        description: "FK -> BenefitPeriod.id; the period whose budget funds the employer share. Must belong to employee_id."
      - name: restaurant_id
        type: string
        source: input
        required: true
        description: "FK -> Restaurant.id; the fulfilling restaurant."
      - name: delivery_location_id
        type: string
        source: input
        required: true
        description: "FK -> DeliveryLocation.id; the drop-off dock."
      - name: group_order_id
        type: string
        source: input
        required: false
        description: "FK -> GroupOrder.id; present when this is a member order of a group order, absent for a solo order."
      - name: requested_delivery_at
        type: datetime
        source: input
        required: true
        description: "Requested delivery instant in UTC; the input to the eligible weekday/window checks."
      - name: lines
        type: array
        source: input
        required: true
        description: "Ordered array of line objects { item_name: string, unit_price_cents: integer >= 1, quantity: integer >= 1 }. Line index is the 0-based position and is the addressing key for missing-item claims."
        constraints: "1..20 elements; positional order is preserved and is the tax rounding order"
      - name: tip_cents
        type: integer
        source: input
        required: false
        default: 0
        description: "Voluntary tip in cents."
        constraints: ">= 0"
      - name: subtotal_cents
        type: integer
        source: computed
        required: false
        description: "Sum over lines of unit_price_cents * quantity."
      - name: tax_cents
        type: integer
        source: computed
        required: false
        description: "Per-line tax rounded independently then summed; see order_line_tax_subtotal."
      - name: delivery_fee_cents
        type: integer
        source: computed
        required: false
        description: "Solo delivery fee, or this order's share of the group delivery fee; see order_fee_assessment and group_delivery_fee_allocation."
      - name: service_fee_cents
        type: integer
        source: computed
        required: false
        description: "Platform service fee after clamp-then-discount; see order_fee_assessment."
      - name: tip_covered_by_employer_cents
        type: integer
        source: computed
        required: false
        description: "tip_cents when the pinned rule's tip_coverage_policy is EMPLOYER_COVERS_TIP, else 0."
      - name: covered_base_cents
        type: integer
        source: computed
        required: false
        description: "The employer-eligible base: subtotal + tax + delivery_fee + service_fee + tip_covered_by_employer."
      - name: employer_covered_cents
        type: integer
        source: computed
        required: false
        description: "Employer contribution after per-meal cap and remaining period budget; see employer_employee_split."
      - name: employee_card_cents
        type: integer
        source: computed
        required: false
        description: "Amount charged to the employee personal card: (covered_base - employer_covered) + uncovered tip."
      - name: admin_fee_cents
        type: integer
        source: computed
        required: false
        description: "Employer-billed program administration fee; see admin_fee_assessment. Never charged to the employee and never part of covered_base."
      - name: gross_total_cents
        type: integer
        source: computed
        required: false
        description: "covered_base_cents + tip_cents - tip_covered_by_employer_cents; the customer-facing order total excluding admin fee."
      - name: employer_refunded_cents
        type: integer
        source: computed
        required: false
        description: "Cumulative employer credit issued against this order."
      - name: employee_refunded_cents
        type: integer
        source: computed
        required: false
        description: "Cumulative personal-card refund issued against this order."
      - name: net_charged_cents
        type: integer
        source: computed
        required: false
        description: "gross_total_cents - employer_refunded_cents - employee_refunded_cents."
      - name: employer_net_cents
        type: integer
        source: computed
        required: false
        description: "employer_covered_cents - employer_refunded_cents; the figure that lands in BenefitPeriod.spent_cents."
      - name: taxable_cents
        type: integer
        source: computed
        required: false
        description: "Imputed taxable portion of the employer share for this order; see imputed_income_accrual."
      - name: tax_month
        type: string
        source: computed
        required: false
        description: "YYYY-MM derived from requested_delivery_at; the ImputedIncomeRecord and ExpenseExport bucket key."
      - name: placed_at
        type: datetime
        source: computed
        required: false
        description: "Logical UTC instant of the place transition."
      - name: delivered_at
        type: datetime
        source: computed
        required: false
        description: "Logical UTC instant of the deliver transition."
      - name: fulfillment_status
        type: enum
        source: computed
        required: false
        default: DRAFT
        description: "Fulfillment dimension of the parallel state machine; see §1.2."
        constraints: "DRAFT | PLACED | CONFIRMED | DELIVERED | CANCELLED"
      - name: settlement_status
        type: enum
        source: computed
        required: false
        default: UNSETTLED
        description: "Money dimension of the parallel state machine; advances independently of fulfillment_status."
        constraints: "UNSETTLED | SPLIT_AUTHORIZED | CAPTURED | PARTIALLY_REFUNDED | REFUNDED | VOIDED"

  # --- 10. CreditClaim ------------------------------------------------------
  - name: CreditClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> Order.id; the delivered order being disputed."
      - name: claim_type
        type: enum
        source: input
        required: true
        description: "Nature of the dispute."
        constraints: "MISSING_ITEM | QUALITY_ISSUE | NEVER_DELIVERED"
      - name: line_index
        type: integer
        source: input
        required: false
        description: "0-based index into Order.lines; required for MISSING_ITEM, forbidden for NEVER_DELIVERED."
        constraints: ">= 0 and < length(Order.lines)"
      - name: claimed_cents
        type: integer
        source: input
        required: true
        description: "Amount the employee asks to be credited."
        constraints: ">= 1"
      - name: approved_cents
        type: integer
        source: computed
        required: false
        description: "Amount approved at resolve; 0 when denied."
      - name: routing_basis
        type: enum
        source: computed
        required: false
        description: "Variant selector chosen at resolve; see refund_routing_waterfall."
        constraints: "EMPLOYEE_FIRST | PROPORTIONAL"
      - name: employer_credit_cents
        type: integer
        source: computed
        required: false
        description: "Portion of approved_cents routed back to the employer budget."
      - name: employee_refund_cents
        type: integer
        source: computed
        required: false
        description: "Portion of approved_cents routed back to the employee personal card."
      - name: resolved_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the caller that resolved the claim. Segregation of duties: the settler must differ from this value. Opaque identifier, not a foreign key."
      - name: status
        type: enum
        source: computed
        required: false
        default: SUBMITTED
        description: "Lifecycle state; see §1.2. Fork on routing basis, join at SETTLED."
        constraints: "SUBMITTED | ROUTED_EMPLOYEE_FIRST | ROUTED_PROPORTIONAL | SETTLED | DENIED"

  # --- 11. RefundLedgerEntry — immutable ------------------------------------
  - name: RefundLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        required: true
        description: "System-generated identifier."
      - name: created_at
        type: datetime
        source: system
        required: true
        description: "Logical UTC instant of the money movement; the chronological ordering key of the ledger."
      - name: order_id
        type: string
        source: system
        required: true
        description: "FK -> Order.id; the order whose money moved."
      - name: credit_claim_id
        type: string
        source: system
        required: false
        description: "FK -> CreditClaim.id; absent when the entry came from a full order void."
      - name: direction
        type: enum
        source: system
        required: true
        description: "Which side of the split received the money back."
        constraints: "EMPLOYER_CREDIT | EMPLOYEE_CARD_REFUND"
      - name: amount_cents
        type: integer
        source: system
        required: true
        description: "Positive cents moved in this direction."
        constraints: ">= 1"
      - name: reason
        type: enum
        source: system
        required: true
        description: "Why the entry was written."
        constraints: "CLAIM_SETTLEMENT | ORDER_VOID"

  # --- 12. ImputedIncomeRecord ----------------------------------------------
  - name: ImputedIncomeRecord
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: system
        required: true
        description: "FK -> Employee.id; the employee whose taxable benefit accrues here."
      - name: tax_month
        type: string
        source: system
        required: true
        description: "YYYY-MM bucket; unique per employee_id. Created lazily by the first deliver in that month."
      - name: method
        type: enum
        source: system
        required: true
        description: "MealProgram.taxable_benefit_method pinned at record creation; later program edits do not retroactively change it."
        constraints: "DE_MINIMIS_EXCLUSION | FULL_INCLUSION"
      - name: gross_employer_paid_cents
        type: integer
        source: computed
        required: false
        description: "Sum of employer_net_cents over the month's delivered orders."
      - name: taxable_cents
        type: integer
        source: computed
        required: false
        description: "Sum of Order.taxable_cents over the month's delivered orders."
      - name: status
        type: enum
        source: computed
        required: false
        default: ACCRUING
        description: "Lifecycle state; see §1.2. Advanced only by cascades, never by a direct endpoint."
        constraints: "ACCRUING | LOCKED | EXPORTED"

  # --- 13. ExpenseExport ----------------------------------------------------
  - name: ExpenseExport
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        required: true
        description: "FK -> MealProgram.id; the program being exported."
      - name: tax_month
        type: string
        source: input
        required: true
        description: "YYYY-MM bucket being exported."
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: format
        type: enum
        source: input
        required: true
        description: "Export shape."
        constraints: "CSV_EXPENSE_REPORT | PAYROLL_IMPUTED_FEED"
      - name: receipt_count
        type: integer
        source: computed
        required: false
        description: "Number of DELIVERED orders in the bucket. Zero yields a FAILED export instead of a GENERATED one."
      - name: employer_gross_cents
        type: integer
        source: computed
        required: false
        description: "Sum of employer_covered_cents over the bucket."
      - name: employer_refund_cents
        type: integer
        source: computed
        required: false
        description: "Sum of employer_refunded_cents over the bucket."
      - name: net_of_refunds_cents
        type: integer
        source: computed
        required: false
        description: "employer_gross_cents - employer_refund_cents."
      - name: admin_fee_total_cents
        type: integer
        source: computed
        required: false
        description: "Sum of admin_fee_cents over the bucket."
      - name: imputed_total_cents
        type: integer
        source: computed
        required: false
        description: "Sum of taxable_cents over the bucket."
      - name: status
        type: enum
        source: computed
        required: false
        default: GENERATED
        description: "Lifecycle state; see §1.2."
        constraints: "GENERATED | ACKNOWLEDGED | FAILED"

# =============================================================================
# §1.2 Table 2: State Machine Table
# =============================================================================
state_machines:

  # --- Order, fulfillment dimension (parallel #1) ----------------------------
  - entity: Order
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /orders/{id}/place"
        actor: Employee
        preconditions:
          - "Order.fulfillment_status == DRAFT"
          - "BenefitPeriod.status is OPEN (GRACE accepts no new orders)"
          - "Employee.status == ACTIVE"
          - "Restaurant.status == ELIGIBLE and its cuisine is in MealProgram.eligible_cuisines"
          - "distance(DeliveryLocation, Restaurant) <= min(MealProgram.max_delivery_radius_km, Restaurant.delivery_radius_km)"
          - "ISO weekday of requested_delivery_at is in the pinned rule's eligible_weekdays"
          - "minute-of-day of requested_delivery_at is in the half-open window [eligible_window_start_minute, eligible_window_end_minute)"
          - "count of the employee's PLACED/CONFIRMED/DELIVERED orders on that UTC day < daily_meal_limit"
          - "when group_order_id is present: GroupOrder.status == COLLECTING and now < GroupOrder.cutoff_at and subtotal+tax <= per_person_limit_cents"
          - "expected_benefit_period_version matches BenefitPeriod.version"
        side_effects:
          - "runs order_line_tax_subtotal, order_fee_assessment, employer_employee_split, admin_fee_assessment in that order"
          - "sets placed_at to the current logical clock"
          - "sets settlement_status to SPLIT_AUTHORIZED"
          - "increments BenefitPeriod.reserved_cents by employer_covered_cents and decrements available_cents by the same"
          - "increments BenefitPeriod.version by 1"
          - "recomputes MealProgram.program_reserved_cents"
          - "increments GroupOrder.member_order_count by 1 when group_order_id is present"
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: Restaurant
        preconditions:
          - "Order.fulfillment_status == PLACED"
          - "the confirming Restaurant identity equals Order.restaurant_id"
          - "Restaurant.status == ELIGIBLE"
        side_effects:
          - "no money movement; reservation stays on BenefitPeriod.reserved_cents"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: Restaurant
        preconditions:
          - "Order.fulfillment_status == CONFIRMED"
          - "the delivering Restaurant identity equals Order.restaurant_id"
          - "the order's ImputedIncomeRecord bucket, if it exists, is not LOCKED"
        side_effects:
          - "sets delivered_at to the current logical clock"
          - "sets settlement_status to CAPTURED"
          - "moves employer_covered_cents from BenefitPeriod.reserved_cents to BenefitPeriod.spent_cents"
          - "increments BenefitPeriod.version by 1"
          - "creates the employee's ImputedIncomeRecord for tax_month if absent, pinning method from MealProgram.taxable_benefit_method, in status ACCRUING"
          - "runs imputed_income_accrual and adds Order.taxable_cents to ImputedIncomeRecord.taxable_cents and employer_net_cents to gross_employer_paid_cents"
          - "recomputes Employee.ytd_imputed_cents and flips Employee.tax_treatment_flag to W2_IMPUTED once it reaches IMPUTED_REPORTING_THRESHOLD_CENTS"
          - "recomputes MealProgram.program_spent_cents, program_reserved_cents and mtd_employer_captured_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Employee
        preconditions:
          - "Order.fulfillment_status == DRAFT"
        side_effects:
          - "sets settlement_status to VOIDED with no ledger entries, because nothing was ever authorized"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Employee
        preconditions:
          - "Order.fulfillment_status == PLACED"
        side_effects:
          - "releases employer_covered_cents from BenefitPeriod.reserved_cents back to available_cents"
          - "increments BenefitPeriod.version by 1"
          - "sets settlement_status to VOIDED and writes the void ledger entries described in the settlement dimension"
          - "decrements GroupOrder.member_order_count by 1 when group_order_id is present"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "Order.fulfillment_status == CONFIRMED"
          - "caller holds ProgramAdmin; an Employee may no longer cancel a confirmed order"
        side_effects:
          - "releases employer_covered_cents from BenefitPeriod.reserved_cents back to available_cents"
          - "increments BenefitPeriod.version by 1"
          - "sets settlement_status to VOIDED and writes the void ledger entries"

  # --- Order, settlement dimension (parallel #2) -----------------------------
  - entity: Order
    dimension: settlement_status
    initial_state: UNSETTLED
    terminal_states: [REFUNDED, VOIDED]
    transitions:
      - from: UNSETTLED
        to: SPLIT_AUTHORIZED
        trigger: "POST /orders/{id}/place"
        actor: Employee
        preconditions:
          - "settlement_status == UNSETTLED"
          - "when employee_card_cents > 0 the Employee has personal_card_on_file true"
        side_effects:
          - "freezes employer_covered_cents / employee_card_cents / admin_fee_cents as the authorized split"
      - from: SPLIT_AUTHORIZED
        to: CAPTURED
        trigger: "POST /orders/{id}/deliver"
        actor: Restaurant
        preconditions:
          - "settlement_status == SPLIT_AUTHORIZED"
        side_effects:
          - "sets net_charged_cents to gross_total_cents and employer_net_cents to employer_covered_cents"
      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "POST /credit-claims/{id}/settle"
        actor: BenefitsController
        preconditions:
          - "settlement_status == CAPTURED or PARTIALLY_REFUNDED"
          - "employer_refunded_cents + employee_refunded_cents + approved_cents < gross_total_cents"
        side_effects:
          - "writes 1 or 2 RefundLedgerEntry rows per refund_routing_waterfall"
          - "recomputes employer_refunded_cents, employee_refunded_cents, net_charged_cents, employer_net_cents"
          - "decrements BenefitPeriod.spent_cents by employer_credit_cents and increments available_cents by the same"
          - "re-runs imputed_income_accrual on the reduced employer_net_cents and reconciles ImputedIncomeRecord and Employee.ytd_imputed_cents"
      - from: PARTIALLY_REFUNDED
        to: PARTIALLY_REFUNDED
        trigger: "POST /credit-claims/{id}/settle"
        actor: BenefitsController
        preconditions:
          - "the cumulative refund after this settlement is still strictly below gross_total_cents"
        side_effects:
          - "same as the CAPTURED -> PARTIALLY_REFUNDED effects; the ledger accumulates"
      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /credit-claims/{id}/settle"
        actor: BenefitsController
        preconditions:
          - "employer_refunded_cents + employee_refunded_cents + approved_cents == gross_total_cents"
        side_effects:
          - "same money movements, plus net_charged_cents becomes 0"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /credit-claims/{id}/settle"
        actor: BenefitsController
        preconditions:
          - "the cumulative refund after this settlement equals gross_total_cents"
        side_effects:
          - "same money movements, plus net_charged_cents becomes 0"
      - from: SPLIT_AUTHORIZED
        to: VOIDED
        trigger: "POST /orders/{id}/cancel"
        actor: Employee
        preconditions:
          - "settlement_status == SPLIT_AUTHORIZED"
        side_effects:
          - "writes an EMPLOYER_CREDIT entry for employer_covered_cents when it is > 0, reason ORDER_VOID"
          - "writes an EMPLOYEE_CARD_REFUND entry for employee_card_cents when it is > 0, reason ORDER_VOID"
          - "sets net_charged_cents and employer_net_cents to 0 and admin_fee_cents to 0"
      - from: UNSETTLED
        to: VOIDED
        trigger: "POST /orders/{id}/cancel"
        actor: Employee
        preconditions:
          - "settlement_status == UNSETTLED"
        side_effects:
          - "no ledger entries are written; a never-authorized order leaves no money trail"

  # --- GroupOrder (cyclic) ---------------------------------------------------
  - entity: GroupOrder
    initial_state: COLLECTING
    terminal_states: [SUBMITTED, CANCELLED]
    transitions:
      - from: COLLECTING
        to: LOCKED
        trigger: "POST /group-orders/{id}/lock"
        actor: Employee
        preconditions:
          - "GroupOrder.status == COLLECTING"
          - "the caller is the organizer_employee_id"
          - "member_order_count >= 1"
        side_effects:
          - "no further member orders may attach"
      - from: LOCKED
        to: COLLECTING
        trigger: "POST /group-orders/{id}/reopen"
        actor: Employee
        preconditions:
          - "GroupOrder.status == LOCKED"
          - "the caller is the organizer_employee_id"
          - "reopen_count < GROUP_REOPEN_LIMIT"
          - "the current logical clock is strictly before cutoff_at"
        side_effects:
          - "increments reopen_count by 1"
      - from: LOCKED
        to: SUBMITTED
        trigger: "POST /group-orders/{id}/submit"
        actor: Employee
        preconditions:
          - "GroupOrder.status == LOCKED"
          - "member_order_count >= 1"
          - "Restaurant.status == ELIGIBLE"
          - "the count of SUBMITTED group orders at this restaurant whose half-open [window_start, window_end) overlaps this one is < max_concurrent_group_deliveries"
          - "no other SUBMITTED group order occupies this delivery location on the closed interval [window_start, window_end + dock_buffer_minutes]"
        side_effects:
          - "runs group_delivery_fee_allocation and writes each member order's delivery_fee_cents share"
          - "re-runs order_fee_assessment, employer_employee_split and admin_fee_assessment for every member order"
          - "adjusts each member's BenefitPeriod.reserved_cents by the delta in employer_covered_cents"
          - "increments each affected BenefitPeriod.version by 1"
          - "sets allocated_delivery_fee_cents to GROUP_DELIVERY_FEE_CENTS"
      - from: COLLECTING
        to: CANCELLED
        trigger: "POST /group-orders/{id}/cancel"
        actor: Employee
        preconditions:
          - "GroupOrder.status == COLLECTING"
          - "the caller is the organizer_employee_id"
        side_effects:
          - "cascades cancel to every attached member order in DRAFT or PLACED, releasing their reservations"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /group-orders/{id}/cancel"
        actor: Employee
        preconditions:
          - "GroupOrder.status == LOCKED"
          - "the caller is the organizer_employee_id"
        side_effects:
          - "cascades cancel to every attached member order in DRAFT or PLACED, releasing their reservations"

  # --- CreditClaim (fork / join) --------------------------------------------
  - entity: CreditClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ROUTED_EMPLOYEE_FIRST
        trigger: "POST /credit-claims/{id}/resolve"
        actor: BenefitsController
        preconditions:
          - "CreditClaim.status == SUBMITTED"
          - "decision is APPROVE and routing_basis is EMPLOYEE_FIRST"
          - "Order.fulfillment_status == DELIVERED"
          - "approved_cents >= 1 and <= claimed_cents"
          - "the order's tax_month bucket is not LOCKED or EXPORTED"
          - "expected_order_version matches Order.version"
        side_effects:
          - "stores approved_cents, routing_basis and resolved_by_user_id"
          - "computes employee_refund_cents and employer_credit_cents by refund_routing_waterfall variant EMPLOYEE_FIRST"
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: ROUTED_PROPORTIONAL
        trigger: "POST /credit-claims/{id}/resolve"
        actor: BenefitsController
        preconditions:
          - "CreditClaim.status == SUBMITTED"
          - "decision is APPROVE and routing_basis is PROPORTIONAL"
          - "Order.fulfillment_status == DELIVERED"
          - "approved_cents >= 1 and <= claimed_cents"
          - "expected_order_version matches Order.version"
        side_effects:
          - "stores approved_cents, routing_basis and resolved_by_user_id"
          - "computes the split by refund_routing_waterfall variant PROPORTIONAL"
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /credit-claims/{id}/resolve"
        actor: BenefitsController
        preconditions:
          - "CreditClaim.status == SUBMITTED"
          - "decision is DENY"
          - "expected_order_version matches Order.version"
        side_effects:
          - "sets approved_cents, employer_credit_cents and employee_refund_cents to 0"
          - "stores resolved_by_user_id"
          - "no ledger entries and no money movement"
      - from: ROUTED_EMPLOYEE_FIRST
        to: SETTLED
        trigger: "POST /credit-claims/{id}/settle"
        actor: BenefitsController
        preconditions:
          - "CreditClaim.status == ROUTED_EMPLOYEE_FIRST"
          - "the settling X-User-ID differs from resolved_by_user_id"
          - "the order's tax_month bucket is not LOCKED or EXPORTED"
        side_effects:
          - "writes the RefundLedgerEntry rows and advances Order.settlement_status per the settlement dimension"
      - from: ROUTED_PROPORTIONAL
        to: SETTLED
        trigger: "POST /credit-claims/{id}/settle"
        actor: BenefitsController
        preconditions:
          - "CreditClaim.status == ROUTED_PROPORTIONAL"
          - "the settling X-User-ID differs from resolved_by_user_id"
          - "the order's tax_month bucket is not LOCKED or EXPORTED"
        side_effects:
          - "writes the RefundLedgerEntry rows and advances Order.settlement_status per the settlement dimension"

  # --- BenefitPeriod (branching) --------------------------------------------
  - entity: BenefitPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: GRACE
        trigger: "POST /benefit-periods/{id}/close with mode GRACE"
        actor: ProgramAdmin
        preconditions:
          - "BenefitPeriod.status == OPEN"
        side_effects:
          - "no new orders may be placed against the period; in-flight PLACED and CONFIRMED orders may still be delivered"
          - "increments version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /benefit-periods/{id}/close with mode FINAL"
        actor: ProgramAdmin
        preconditions:
          - "BenefitPeriod.status == OPEN"
          - "no attached order is in PLACED or CONFIRMED"
        side_effects:
          - "runs period_close_rollover, setting rollover_out_cents and forfeited_cents so the partition invariant holds with available_cents 0"
          - "increments version by 1"
          - "cascades every ACCRUING ImputedIncomeRecord of the employee for the period_month to LOCKED"
          - "recomputes MealProgram.program_reserved_cents"
      - from: GRACE
        to: CLOSED
        trigger: "POST /benefit-periods/{id}/close with mode FINAL"
        actor: ProgramAdmin
        preconditions:
          - "BenefitPeriod.status == GRACE"
          - "no attached order is in PLACED or CONFIRMED"
        side_effects:
          - "identical to the OPEN -> CLOSED effects"

  # --- BudgetRule -----------------------------------------------------------
  - entity: BudgetRule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /budget-rules/{id}/activate"
        actor: BenefitsController
        preconditions:
          - "BudgetRule.status == DRAFT"
          - "the activating X-User-ID differs from drafted_by_user_id"
          - "effective_from is at or before the current logical clock"
          - "expected_employee_group_version matches EmployeeGroup.version"
        side_effects:
          - "assigns rule_sequence as EmployeeGroup.active_rule_count history + 1"
          - "supersedes the group's previously ACTIVE rule, if any"
          - "increments EmployeeGroup.version by 1 and recomputes active_rule_count"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /budget-rules/{id}/activate"
        actor: BenefitsController
        preconditions:
          - "another DRAFT rule in the same group is being activated"
        side_effects:
          - "already-open BenefitPeriods keep their pinned budget_rule_id and are unaffected"

  # --- Employee -------------------------------------------------------------
  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /employees/{id}/deactivate"
        actor: ProgramAdmin
        preconditions:
          - "Employee.status == ACTIVE"
          - "the employee has no order in PLACED or CONFIRMED"
        side_effects:
          - "moves every OPEN BenefitPeriod of the employee to GRACE"
          - "increments each affected BenefitPeriod.version by 1"

  # --- Restaurant (cyclic) --------------------------------------------------
  - entity: Restaurant
    initial_state: ELIGIBLE
    terminal_states: []
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "PATCH /restaurants/{id} with status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "Restaurant.status == ELIGIBLE"
        side_effects:
          - "the restaurant disappears from eligible-restaurant selection; already CONFIRMED orders may still be delivered"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "PATCH /restaurants/{id} with status ELIGIBLE"
        actor: PlatformAdmin
        preconditions:
          - "Restaurant.status == SUSPENDED"
        side_effects:
          - "the restaurant becomes selectable again; no historical order is re-derived"

  # --- ImputedIncomeRecord (cascade-driven only) ----------------------------
  - entity: ImputedIncomeRecord
    initial_state: ACCRUING
    terminal_states: [EXPORTED]
    transitions:
      - from: ACCRUING
        to: LOCKED
        trigger: "POST /benefit-periods/{id}/close with mode FINAL (cascade)"
        actor: ProgramAdmin
        preconditions:
          - "ImputedIncomeRecord.status == ACCRUING"
          - "the record's tax_month equals the closing period's period_month"
        side_effects:
          - "further accrual and further claim settlement against that month are refused"
      - from: LOCKED
        to: EXPORTED
        trigger: "POST /meal-programs/{id}/expense-exports with format PAYROLL_IMPUTED_FEED (cascade)"
        actor: BenefitsController
        preconditions:
          - "ImputedIncomeRecord.status == LOCKED"
          - "the export tax_month equals the record's tax_month"
        side_effects:
          - "the record is frozen for payroll; the export's imputed_total_cents includes its taxable_cents"

  # --- ExpenseExport --------------------------------------------------------
  - entity: ExpenseExport
    initial_state: GENERATED
    terminal_states: [ACKNOWLEDGED, FAILED]
    transitions:
      - from: GENERATED
        to: ACKNOWLEDGED
        trigger: "POST /expense-exports/{id}/acknowledge"
        actor: BenefitsController
        preconditions:
          - "ExpenseExport.status == GENERATED"
        side_effects:
          - "records downstream acceptance; the export becomes immutable"

# =============================================================================
# §1.2.1 Concurrency Rules — optimistic concurrency control only
# =============================================================================
concurrency_rules:
  - id: order-place-stale-period
    parent_entity: BenefitPeriod
    write_endpoint: "POST /orders/{id}/place"
    occ_field: expected_benefit_period_version
    guarantee: |
      A place request carries expected_benefit_period_version. The request is rejected unless the
      value equals the current BenefitPeriod.version at evaluation time. A successful place
      increments BenefitPeriod.version by 1, so any client that read the period earlier and did
      not re-read it is refused instead of reserving budget against a stale available_cents.
    error_id: ERR_STALE_PERIOD_VERSION
    http_status: 412
  - id: rule-activate-stale-group
    parent_entity: EmployeeGroup
    write_endpoint: "POST /budget-rules/{id}/activate"
    occ_field: expected_employee_group_version
    guarantee: |
      Activation carries expected_employee_group_version and is rejected unless it equals the
      current EmployeeGroup.version. A successful activation increments EmployeeGroup.version by 1,
      which preserves the at-most-one-ACTIVE-rule-per-group invariant: a second activation issued
      against the pre-activation version is refused.
    error_id: ERR_STALE_EMPLOYEE_GROUP_VERSION
    http_status: 412
  - id: claim-resolve-stale-order
    parent_entity: Order
    write_endpoint: "POST /credit-claims/{id}/resolve"
    occ_field: expected_order_version
    guarantee: |
      Resolving a claim carries expected_order_version and is rejected unless it equals the current
      Order.version. Every deliver, cancel and prior settlement increments Order.version by 1, so a
      routing split computed from a superseded employer/employee ratio can never be committed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Table 3: Calculation Rules Table
# =============================================================================
calculations:

  # --- 1 ---------------------------------------------------------------------
  - name: order_line_tax_subtotal
    description: |
      Derives subtotal_cents and tax_cents from Order.lines. Tax is rounded independently for each
      line in positional order and only then summed; the sum-of-line-bases-times-rate form is
      explicitly NOT the contract and is observably different.
    trigger: "POST /orders/{id}/place, and re-run for every member order at group submit"
    inputs:
      - "Order.lines[].unit_price_cents"
      - "Order.lines[].quantity"
      - "TAX_RATE"
    algorithm: aggregation
    formula: |
      subtotal_cents = 0
      tax_cents = 0
      for line in Order.lines (positional order):
          line_base = line.unit_price_cents * line.quantity
          subtotal_cents += line_base
          tax_cents += round_half_up(line_base * TAX_RATE)     # PER-LINE rounding, pinned
      # PINNED ORDER: rounding happens once per line, before summation.
      # The forbidden alternative round_half_up(subtotal_cents * TAX_RATE) differs whenever the
      # discarded fractional cents accumulate past a half-cent; e.g. three lines of 1000 cents
      # give 88+88+88 = 264 here, but round_half_up(3000 * 0.0875) = 263 the other way.
    constants:
      TAX_RATE: 0.0875
    precision: "integer cents, round_half_up per line"

  # --- 2 ---------------------------------------------------------------------
  - name: order_fee_assessment
    description: |
      Derives delivery_fee_cents and service_fee_cents. The service fee is a three-stage composition
      whose stage order is pinned: raw percentage of the SUBTOTAL, then clamp to [min, max], then a
      volume discount whose tier is selected from the PRE-FEE BASE (subtotal + tax). The discount
      never re-selects a tier and never re-clamps.
    trigger: "POST /orders/{id}/place, and re-run for every member order at group submit"
    inputs:
      - "Order.subtotal_cents"
      - "Order.tax_cents"
      - "Order.group_order_id"
      - "GroupOrder.allocated_delivery_fee_cents"
      - "SERVICE_FEE_RATE, SERVICE_FEE_MIN_CENTS, SERVICE_FEE_MAX_CENTS"
      - "DELIVERY_FEE_BASE_CENTS, FREE_DELIVERY_THRESHOLD_CENTS"
      - "SERVICE_DISCOUNT_TIER_1_CENTS, SERVICE_DISCOUNT_TIER_2_CENTS, SERVICE_DISCOUNT_RATE_1, SERVICE_DISCOUNT_RATE_2"
    algorithm: tiered_pricing
    formula: |
      # -- delivery fee -------------------------------------------------------
      if Order.group_order_id is present:
          delivery_fee_cents = this order's share from group_delivery_fee_allocation
                               (0 until the group order is SUBMITTED)
      elif Order.subtotal_cents >= FREE_DELIVERY_THRESHOLD_CENTS:
          delivery_fee_cents = 0
      else:
          delivery_fee_cents = DELIVERY_FEE_BASE_CENTS

      # -- service fee (stage order is PINNED) --------------------------------
      pre_fee_base = Order.subtotal_cents + Order.tax_cents
      raw     = round_half_up(Order.subtotal_cents * SERVICE_FEE_RATE)          # stage 1: subtotal only
      clamped = min(max(raw, SERVICE_FEE_MIN_CENTS), SERVICE_FEE_MAX_CENTS)     # stage 2: clamp
      if   pre_fee_base >= SERVICE_DISCOUNT_TIER_2_CENTS: d = SERVICE_DISCOUNT_RATE_2
      elif pre_fee_base >= SERVICE_DISCOUNT_TIER_1_CENTS: d = SERVICE_DISCOUNT_RATE_1
      else:                                              d = 0
      service_fee_cents = clamped - round_half_up(clamped * d)                  # stage 3: discount
      # CLAMP-THEN-DISCOUNT is the contract. Discount-then-clamp is observably wrong: with
      # subtotal 6000 / tax 524, raw = 600, clamped = 500, d = 0.10 -> 500 - 50 = 450 here,
      # while discounting first gives 600 - 60 = 540 which then clamps back up to 500.
    constants:
      DELIVERY_FEE_BASE_CENTS: 599
      FREE_DELIVERY_THRESHOLD_CENTS: 3500
      SERVICE_FEE_RATE: 0.10
      SERVICE_FEE_MIN_CENTS: 99
      SERVICE_FEE_MAX_CENTS: 500
      SERVICE_DISCOUNT_TIER_1_CENTS: 5000
      SERVICE_DISCOUNT_TIER_2_CENTS: 12000
      SERVICE_DISCOUNT_RATE_1: 0.10
      SERVICE_DISCOUNT_RATE_2: 0.25
    precision: "integer cents, round_half_up at each of stage 1 and stage 3"

  # --- 3 ---------------------------------------------------------------------
  - name: employer_employee_split
    description: |
      Splits the order between the employer budget and the employee personal card. Nested min/max
      over three independent ceilings (covered base, per-meal cap, remaining period budget) with a
      tip-policy branch that decides whether the tip enters the employer-eligible base at all.
    trigger: "POST /orders/{id}/place, and re-run for every member order at group submit"
    inputs:
      - "Order.subtotal_cents, tax_cents, delivery_fee_cents, service_fee_cents, tip_cents"
      - "BudgetRule.tip_coverage_policy, per_meal_cap_cents, overage_policy"
      - "BenefitPeriod.available_cents"
      - "Employee.personal_card_on_file"
    algorithm: threshold
    formula: |
      tip_covered_by_employer_cents =
          Order.tip_cents if BudgetRule.tip_coverage_policy == EMPLOYER_COVERS_TIP else 0

      covered_base_cents = Order.subtotal_cents + Order.tax_cents
                         + Order.delivery_fee_cents + Order.service_fee_cents
                         + tip_covered_by_employer_cents

      employer_covered_cents = min( min(covered_base_cents, BudgetRule.per_meal_cap_cents),
                                    BenefitPeriod.available_cents )

      employee_card_cents = (covered_base_cents - employer_covered_cents)
                          + (Order.tip_cents - tip_covered_by_employer_cents)

      gross_total_cents = covered_base_cents + Order.tip_cents - tip_covered_by_employer_cents

      # Gates evaluated after the split, in §1.4 priority order:
      #   employee_card_cents > 0 and overage_policy == BLOCK        -> ERR_OVERAGE_NOT_PERMITTED
      #   employer_covered_cents < min(covered_base, cap)            -> ERR_PERIOD_BUDGET_EXCEEDED
      #   employee_card_cents > 0 and not personal_card_on_file      -> ERR_PERSONAL_CARD_REQUIRED
      # Exactly-at-cap is NOT an overage: covered_base_cents == per_meal_cap_cents leaves
      # employee_card_cents at 0 (plus any uncovered tip) and BLOCK still succeeds.
    constants: {}
    precision: "integer cents; no rounding occurs in this rule, only min/max selection"

  # --- 4 ---------------------------------------------------------------------
  - name: group_delivery_fee_allocation
    description: |
      Splits one consolidated group delivery fee across the attached member orders, largest-share
      first with a deterministic remainder waterfall. The remainder cents go to the earliest-created
      member orders, tie-broken by the ordering employee's email ascending — never by id.
    trigger: "POST /group-orders/{id}/submit"
    inputs:
      - "GroupOrder member orders that are not CANCELLED"
      - "Order.created_at"
      - "Employee.email"
      - "GROUP_DELIVERY_FEE_CENTS"
    algorithm: waterfall_allocation
    formula: |
      members = non-cancelled member orders of the group order
      n = count(members)
      base_share = floor(GROUP_DELIVERY_FEE_CENTS / n)
      remainder  = GROUP_DELIVERY_FEE_CENTS - base_share * n
      order members by (Order.created_at ASC, Employee.email ASC)
      for i, m in enumerate(ordered members):
          m.delivery_fee_cents = base_share + (1 if i < remainder else 0)
      # Invariant: sum of member delivery_fee_cents == GROUP_DELIVERY_FEE_CENTS exactly.
      # n = 3 gives 417 / 417 / 416, never 416 / 416 / 416 or 417 / 417 / 417.
    constants:
      GROUP_DELIVERY_FEE_CENTS: 1250
    precision: "integer cents; floor division plus a one-cent-per-recipient remainder waterfall"

  # --- 5 ---------------------------------------------------------------------
  - name: admin_fee_assessment
    description: |
      Employer-billed program administration fee, priced from the employer's cumulative
      month-to-date captured spend at the moment of the order. The tier is read BEFORE this order's
      own employer share is added, so the fee for the order that crosses a tier boundary is still
      priced at the old tier.
    trigger: "POST /orders/{id}/place, and re-run for every member order at group submit"
    inputs:
      - "MealProgram.mtd_employer_captured_cents"
      - "Order.employer_covered_cents"
      - "ADMIN_TIER_1_CENTS, ADMIN_TIER_2_CENTS, ADMIN_RATE_LOW, ADMIN_RATE_MID, ADMIN_RATE_HIGH"
    algorithm: threshold
    formula: |
      mtd = MealProgram.mtd_employer_captured_cents      # excludes this order
      if   mtd >= ADMIN_TIER_2_CENTS: rate = ADMIN_RATE_HIGH
      elif mtd >= ADMIN_TIER_1_CENTS: rate = ADMIN_RATE_MID
      else:                           rate = ADMIN_RATE_LOW
      admin_fee_cents = round_half_up(Order.employer_covered_cents * rate)
      # The admin fee is never part of covered_base_cents, never charged to the employee, and is
      # zeroed when the order is voided.
    constants:
      ADMIN_TIER_1_CENTS: 100000
      ADMIN_TIER_2_CENTS: 500000
      ADMIN_RATE_LOW: 0.05
      ADMIN_RATE_MID: 0.04
      ADMIN_RATE_HIGH: 0.03
    precision: "integer cents, round_half_up"

  # --- 6 ---------------------------------------------------------------------
  - name: imputed_income_accrual
    description: |
      Taxable benefit treatment of the employer share. Dual variant selected by the
      ImputedIncomeRecord.method pinned at record creation, not by the program's current setting.
    trigger: "POST /orders/{id}/deliver, and re-run on every claim settlement that changes employer_net_cents"
    inputs:
      - "Order.employer_net_cents"
      - "ImputedIncomeRecord.method"
      - "DE_MINIMIS_PER_MEAL_CENTS"
      - "IMPUTED_REPORTING_THRESHOLD_CENTS"
    algorithm: threshold
    formula: |
      # variant DE_MINIMIS_EXCLUSION
      taxable_cents = max(0, Order.employer_net_cents - DE_MINIMIS_PER_MEAL_CENTS)
      # variant FULL_INCLUSION
      taxable_cents = Order.employer_net_cents

      ImputedIncomeRecord.taxable_cents            = Σ taxable_cents over the month's delivered orders
      ImputedIncomeRecord.gross_employer_paid_cents = Σ employer_net_cents over the same orders
      Employee.ytd_imputed_cents                    = Σ taxable_cents over all of the employee's records
      Employee.tax_treatment_flag = W2_IMPUTED if ytd_imputed_cents >= IMPUTED_REPORTING_THRESHOLD_CENTS
                                    else NONE
      # The flag is re-derived, not latched: a refund that pulls ytd_imputed_cents back below the
      # threshold returns the flag to NONE.
    constants:
      DE_MINIMIS_PER_MEAL_CENTS: 2000
      IMPUTED_REPORTING_THRESHOLD_CENTS: 1000
    precision: "integer cents; no rounding"
    variants:
      - name: DE_MINIMIS_EXCLUSION
        when: "ImputedIncomeRecord.method == DE_MINIMIS_EXCLUSION (pinned from MealProgram at record creation)"
        difference: "Only the employer share above DE_MINIMIS_PER_MEAL_CENTS is taxable; an employer share of 2500 yields 500."
      - name: FULL_INCLUSION
        when: "ImputedIncomeRecord.method == FULL_INCLUSION"
        difference: "The whole employer share is taxable; the same 2500 employer share yields 2500, a delta of 2000."

  # --- 7 ---------------------------------------------------------------------
  - name: refund_routing_waterfall
    description: |
      Routes an approved credit between the employee personal card and the employer budget. Dual
      variant selected at claim resolve. EMPLOYEE_FIRST makes the employee whole before any employer
      credit; PROPORTIONAL splits by the original charge ratio.
    trigger: "POST /credit-claims/{id}/resolve"
    inputs:
      - "CreditClaim.approved_cents"
      - "CreditClaim.routing_basis"
      - "Order.employee_card_cents, employer_covered_cents, gross_total_cents"
      - "Order.employee_refunded_cents, employer_refunded_cents"
    algorithm: waterfall_allocation
    formula: |
      # variant EMPLOYEE_FIRST
      employee_refund_cents = min(approved_cents,
                                  Order.employee_card_cents - Order.employee_refunded_cents)
      employer_credit_cents = approved_cents - employee_refund_cents

      # variant PROPORTIONAL
      employee_refund_cents = round_half_up(approved_cents * Order.employee_card_cents
                                            / Order.gross_total_cents)
      employer_credit_cents = approved_cents - employee_refund_cents
      # The employer side absorbs the rounding residue in both variants, so
      # employee_refund_cents + employer_credit_cents == approved_cents exactly.
      # With employee_card 1863, employer_covered 2500, gross 4363 and approved 1000:
      #   EMPLOYEE_FIRST -> 1000 / 0 ;  PROPORTIONAL -> 427 / 573.
    constants: {}
    precision: "integer cents, round_half_up on the employee side only"
    variants:
      - name: EMPLOYEE_FIRST
        when: "routing_basis EMPLOYEE_FIRST supplied at resolve"
        difference: "Employee is reimbursed up to their unrefunded personal-card exposure before the employer receives anything."
      - name: PROPORTIONAL
        when: "routing_basis PROPORTIONAL supplied at resolve"
        difference: "Credit is split by employee_card_cents / gross_total_cents; the employer is credited even when the employee is not yet whole."

  # --- 8 ---------------------------------------------------------------------
  - name: period_close_rollover
    description: |
      Carves unused budget into a rollover carry-out and a forfeiture at final close, then restores
      the partition invariant with available_cents driven to zero.
    trigger: "POST /benefit-periods/{id}/close with mode FINAL"
    inputs:
      - "BenefitPeriod.allocated_cents, reserved_cents, spent_cents, available_cents"
      - "MealProgram.rollover_policy, rollover_cap_pct"
    algorithm: threshold
    formula: |
      unused = BenefitPeriod.available_cents          # reserved_cents must already be 0 to close
      if   rollover_policy == NONE:       rollover_out_cents = 0
      elif rollover_policy == FULL:       rollover_out_cents = unused
      else:  # CAPPED_PCT
          cap = round_half_up(BenefitPeriod.allocated_cents * rollover_cap_pct)
          rollover_out_cents = min(unused, cap)
      forfeited_cents  = unused - rollover_out_cents
      available_cents  = 0
      # Partition invariant after close:
      #   allocated == available + reserved + spent + forfeited + rollover_out
      # A successor period created with predecessor_period_id set copies rollover_out_cents into
      # rollover_in_cents and adds it to monthly_allocation_cents:
      #   allocated 50000, spent 2500 -> unused 47500, cap 12500 -> rollover_out 12500,
      #   forfeited 35000, successor allocated 50000 + 12500 = 62500.
    constants: {}
    precision: "integer cents, round_half_up on the cap"

  # --- 9 ---------------------------------------------------------------------
  - name: program_cost_forecast
    description: |
      Forecasts the employer's total spend for the current logical month. Dual variant selected by
      MealProgram.forecast_basis. Both variants count only eligible weekdays, and only groups whose
      BudgetRule is ACTIVE participate.
    trigger: "GET /meal-programs/{id}/forecast"
    inputs:
      - "EmployeeGroup.headcount_planned for groups with an ACTIVE BudgetRule"
      - "BudgetRule.daily_meal_limit, per_meal_cap_cents, monthly_allocation_cents, eligible_weekdays"
      - "MealProgram.program_spent_cents, forecast_basis"
      - "the current logical clock"
    algorithm: forward_looking
    formula: |
      month = the logical clock's UTC calendar month
      remaining_days(rule) = count of dates D in [today .. last day of month]
                             with ISO_weekday(D) in rule.eligible_weekdays
      elapsed_days = count of dates D in [first day of month .. today]
                     with ISO_weekday(D) in the union of eligible_weekdays over ACTIVE rules
      total_days   = count of dates D in the whole month with ISO_weekday(D) in that same union

      # variant COMMITMENT
      committed = Σ_groups headcount_planned * daily_meal_limit * per_meal_cap_cents * remaining_days
      ceiling   = Σ_groups headcount_planned * monthly_allocation_cents - program_spent_cents
      forecast_total_cents = min(committed, ceiling) + program_spent_cents

      # variant RUN_RATE
      forecast_total_cents = round_half_up(program_spent_cents / elapsed_days * total_days)
                             (0 when elapsed_days is 0)

      forecast_admin_fee_cents = round_half_up(forecast_total_cents * the admin rate implied by
                                               MealProgram.mtd_employer_captured_cents)
      # On 2026-08-10 with one ACTIVE rule (headcount 2, limit 1, cap 2500, weekdays 1..5,
      # allocation 50000) and program_spent_cents 2500:
      #   remaining_days 16, elapsed_days 6, total_days 21
      #   COMMITMENT -> min(2*1*2500*16, 2*50000 - 2500) = min(80000, 97500) = 80000 -> 82500, admin 4125
      #   RUN_RATE   -> round_half_up(2500 / 6 * 21) = 8750, admin 438
    constants: {}
    precision: "integer cents, round_half_up once at the end of each variant"
    variants:
      - name: COMMITMENT
        when: "MealProgram.forecast_basis == COMMITMENT"
        difference: "Assumes every planned head consumes the full cap on every remaining eligible day, clamped by the remaining allocation ceiling."
      - name: RUN_RATE
        when: "MealProgram.forecast_basis == RUN_RATE"
        difference: "Extrapolates observed spend per elapsed eligible day across the whole month; on the same data gives 8750 instead of 82500."

  # --- 10 --------------------------------------------------------------------
  - name: expense_export_totals
    description: |
      Rolls a month's delivered orders into the export record. An empty bucket is not a zero-valued
      success: it produces a FAILED export.
    trigger: "POST /meal-programs/{id}/expense-exports"
    inputs:
      - "Orders in the program with fulfillment_status DELIVERED and tax_month equal to the export tax_month"
      - "ImputedIncomeRecord rows for the same tax_month"
    algorithm: aggregation
    formula: |
      bucket = delivered, non-voided orders of the program whose tax_month matches
      receipt_count          = count(bucket)
      employer_gross_cents   = Σ employer_covered_cents
      employer_refund_cents  = Σ employer_refunded_cents
      net_of_refunds_cents   = employer_gross_cents - employer_refund_cents
      admin_fee_total_cents  = Σ admin_fee_cents
      imputed_total_cents    = Σ taxable_cents
      status = FAILED if receipt_count == 0 else GENERATED
      # When format is PAYROLL_IMPUTED_FEED and status is GENERATED, every LOCKED
      # ImputedIncomeRecord in the bucket cascades to EXPORTED.
    constants: {}
    precision: "integer cents; pure summation, no rounding"

  # --- 11 --------------------------------------------------------------------
  - name: restaurant_eligibility_selection
    description: |
      Selects and ranks the restaurants a given delivery location may order from. Cuisine allow-list
      first, then a two-sided radius test against the tighter of the program ceiling and the
      restaurant's own reach, then a deterministic ranking.
    trigger: "GET /meal-programs/{id}/eligible-restaurants"
    inputs:
      - "MealProgram.eligible_cuisines, max_delivery_radius_km"
      - "DeliveryLocation.grid_x_km, grid_y_km"
      - "Restaurant.cuisine, grid_x_km, grid_y_km, delivery_radius_km, status"
    algorithm: aggregation
    formula: |
      distance_km(R, L) = round_half_up( sqrt((R.grid_x_km - L.grid_x_km)^2
                                            + (R.grid_y_km - L.grid_y_km)^2), 3 )
      effective_limit(R) = min(MealProgram.max_delivery_radius_km, R.delivery_radius_km)
      eligible(R) = R.status == ELIGIBLE
                    and R.cuisine in MealProgram.eligible_cuisines
                    and distance_km(R, L) <= effective_limit(R)      # inclusive at the limit
      ranking: distance_km ASC, then Restaurant.name ASC; never by id
      # Empty-set fallback: when no restaurant qualifies the endpoint returns 200 with an empty
      # array and total_count 0, not a 404.
    constants: {}
    precision: "distance rounded to 3 decimal places, round_half_up, before comparison"

# =============================================================================
# §1.4 Table 4: Validation Rules Table (evaluated strictly in priority order;
#      the first violated rule determines the response and nothing after it runs)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are present and X-Role names a role in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Identity must be established before anything else, including request-shape parsing."

  - priority: 2
    category: authz
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role gate. A malformed body from an unauthorised role still returns ERR_UNAUTHORIZED."

  - priority: 3
    category: authz
    check: "an Employee caller acts only on their own Employee, BenefitPeriod, Order, GroupOrder and CreditClaim rows; a Restaurant caller acts only on orders whose restaurant_id is itself"
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: ["POST /orders", "POST /orders/{id}/place", "POST /orders/{id}/cancel", "POST /orders/{id}/confirm", "POST /orders/{id}/deliver", "POST /group-orders/{id}/lock", "POST /group-orders/{id}/reopen", "POST /group-orders/{id}/submit", "POST /group-orders/{id}/cancel", "POST /credit-claims", "GET /orders/{id}", "GET /employees/{id}"]
    description: "Ownership scoping. Distinct from ERR_UNAUTHORIZED: the role is right, the row is not."

  - priority: 4
    category: authz
    check: "the acting X-User-ID differs from the user recorded on the preceding step of the same workflow (BudgetRule.drafted_by_user_id at activate, CreditClaim.resolved_by_user_id at settle)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: ["POST /budget-rules/{id}/activate", "POST /credit-claims/{id}/settle"]
    description: "Four-eyes control. Evaluated before request shape so a same-user attempt cannot be masked by a body error."

  - priority: 5
    category: validation
    check: "request body and query parameters satisfy the declared types, enum domains, numeric ranges, array cardinalities and required-field sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Includes missing required fields, unknown enum members, negative cents, empty lines array, lines longer than 20, and pagination limit outside 1..100."

  - priority: 6
    category: existence
    check: "the entity addressed by the {id} path segment exists"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Resolves to the entity-specific code, e.g. ERR_ORDER_NOT_FOUND for /orders/{id}."

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /orders", "POST /group-orders", "POST /employees", "POST /benefit-periods", "POST /credit-claims", "POST /meal-programs/{id}/employee-groups", "POST /meal-programs/{id}/delivery-locations", "POST /meal-programs/{id}/expense-exports", "POST /employee-groups/{id}/budget-rules", "GET /meal-programs/{id}/eligible-restaurants"]
    description: "Body FK existence, checked in declaration order of the endpoint's input list."

  - priority: 8
    category: state
    check: "the addressed entity is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    description: "Covers idempotent re-invocation (place twice), terminal-state lockdown, and undeclared transitions such as deliver-before-confirm."

  - priority: 9
    category: state
    check: "the Order's BenefitPeriod is in status OPEN"
    error_id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: ["POST /orders/{id}/place"]
    description: "GRACE accepts no new placements even though in-flight orders may still be delivered; CLOSED accepts nothing."

  - priority: 10
    category: state
    check: "the ordering Employee is in status ACTIVE"
    error_id: ERR_EMPLOYEE_INACTIVE
    http_status: 409
    applies_to: ["POST /orders/{id}/place", "POST /group-orders"]
    description: "Cross-entity state gate on the actor's own row."

  - priority: 11
    category: state
    check: "the Restaurant is in status ELIGIBLE"
    error_id: ERR_RESTAURANT_NOT_ELIGIBLE
    http_status: 409
    applies_to: ["POST /orders/{id}/place", "POST /orders/{id}/confirm", "POST /group-orders/{id}/submit"]
    description: "A suspension between draft and place blocks the placement; a suspension after confirm does not block delivery."

  - priority: 12
    category: state
    check: "the referenced GroupOrder is in status COLLECTING"
    error_id: ERR_GROUP_ORDER_NOT_COLLECTING
    http_status: 409
    applies_to: ["POST /orders", "POST /orders/{id}/place"]
    description: "Member orders may only attach and place while the group order is still collecting."

  - priority: 13
    category: concurrency
    check: "expected_<parent>_version equals the current parent version, per the matching §1.2.1 rule"
    error_id: "ERR_STALE_PERIOD_VERSION | ERR_STALE_EMPLOYEE_GROUP_VERSION | ERR_STALE_ORDER_VERSION"
    http_status: 412
    applies_to: ["POST /orders/{id}/place", "POST /budget-rules/{id}/activate", "POST /credit-claims/{id}/resolve"]
    description: "Optimistic concurrency control. Runs after cheap state gates but before any money is computed or moved."

  - priority: 14
    category: business_safety
    check: "the ImputedIncomeRecord bucket for the affected employee and tax_month is not LOCKED or EXPORTED"
    error_id: ERR_TAX_MONTH_LOCKED
    http_status: 409
    applies_to: ["POST /orders/{id}/deliver", "POST /credit-claims/{id}/resolve", "POST /credit-claims/{id}/settle"]
    description: "Once payroll has the month, no further accrual or reversal may touch it."

  - priority: 15
    category: business_safety
    check: "no order attached to the period is in fulfillment_status PLACED or CONFIRMED"
    error_id: ERR_PERIOD_HAS_OPEN_ORDERS
    http_status: 409
    applies_to: ["POST /benefit-periods/{id}/close"]
    description: "Only guards mode FINAL; mode GRACE is exactly the mechanism for draining those orders."

  - priority: 16
    category: business_safety
    check: "the employee has no order in fulfillment_status PLACED or CONFIRMED"
    error_id: ERR_EMPLOYEE_HAS_OPEN_ORDERS
    http_status: 409
    applies_to: ["POST /employees/{id}/deactivate"]
    description: "Deactivation must not orphan a reservation."

  - priority: 17
    category: business_temporal
    check: "ISO weekday of requested_delivery_at is in the pinned BudgetRule.eligible_weekdays"
    error_id: ERR_OUTSIDE_ELIGIBLE_WEEKDAY
    http_status: 422
    applies_to: ["POST /orders/{id}/place"]
    description: "Weekday eligibility precedes window eligibility so a Saturday noon order reports the weekday, not the window."

  - priority: 18
    category: business_temporal
    check: "minute-of-day of requested_delivery_at lies in the half-open window [eligible_window_start_minute, eligible_window_end_minute)"
    error_id: ERR_OUTSIDE_ELIGIBLE_WINDOW
    http_status: 422
    applies_to: ["POST /orders/{id}/place"]
    description: "Start minute is admitted, end minute is refused."

  - priority: 19
    category: business_temporal
    check: "the current logical clock is strictly before GroupOrder.cutoff_at"
    error_id: ERR_GROUP_CUTOFF_PASSED
    http_status: 409
    applies_to: ["POST /orders", "POST /orders/{id}/place", "POST /group-orders/{id}/reopen"]
    description: "Exactly at cutoff_at is already too late."

  - priority: 20
    category: business_temporal
    check: "no other SUBMITTED group order occupies the delivery location over the closed interval [window_start, window_end + dock_buffer_minutes]"
    error_id: ERR_DOCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /group-orders/{id}/submit"]
    description: "Dock occupancy is a closed interval with a trailing buffer, so back-to-back windows collide."

  - priority: 21
    category: business_temporal
    check: "the number of SUBMITTED group orders at the restaurant whose half-open [window_start, window_end) intersects this one is below max_concurrent_group_deliveries"
    error_id: ERR_RESTAURANT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /group-orders/{id}/submit"]
    description: "Restaurant capacity uses half-open intervals, so a window starting exactly at another's end does not intersect."

  - priority: 22
    category: business_referential
    check: "benefit_period_id belongs to employee_id"
    error_id: ERR_PERIOD_EMPLOYEE_MISMATCH
    http_status: 422
    applies_to: ["POST /orders"]
    description: "An order may not spend another employee's budget."

  - priority: 23
    category: business_referential
    check: "every referenced EmployeeGroup, DeliveryLocation, Employee and BenefitPeriod belongs to the same MealProgram as the operation"
    error_id: ERR_PROGRAM_SCOPE_MISMATCH
    http_status: 422
    applies_to: ["POST /orders", "POST /group-orders", "POST /employees", "POST /meal-programs/{id}/expense-exports", "GET /meal-programs/{id}/eligible-restaurants"]
    description: "Tenant isolation across the flat topology."

  - priority: 24
    category: business_referential
    check: "a member order's restaurant_id and delivery_location_id equal the group order's"
    error_id: ERR_GROUP_ORDER_MISMATCH
    http_status: 422
    applies_to: ["POST /orders"]
    description: "One group order is one consolidated delivery from one restaurant to one dock."

  - priority: 25
    category: business_referential
    check: "the employee's EmployeeGroup has exactly one BudgetRule in status ACTIVE at period open"
    error_id: ERR_NO_ACTIVE_BUDGET_RULE
    http_status: 409
    applies_to: ["POST /benefit-periods"]
    description: "A period cannot be opened without a rule to pin."

  - priority: 26
    category: business_referential
    check: "predecessor_period_id, when supplied, refers to a CLOSED period of the same employee whose period_month is strictly earlier"
    error_id: ERR_PREDECESSOR_NOT_CLOSED
    http_status: 409
    applies_to: ["POST /benefit-periods"]
    description: "Rollover may only be drawn from a finally-closed predecessor."

  - priority: 27
    category: business_referential
    check: "predecessor_period_id is not already referenced by another BenefitPeriod"
    error_id: ERR_PREDECESSOR_ALREADY_CONSUMED
    http_status: 409
    applies_to: ["POST /benefit-periods"]
    description: "Rollover cents may be carried forward exactly once."

  - priority: 28
    category: business_constraint
    check: "period_month is unique per employee_id"
    error_id: ERR_DUPLICATE_PERIOD_MONTH
    http_status: 409
    applies_to: ["POST /benefit-periods"]
    description: "One budget period per employee per month."

  - priority: 29
    category: business_constraint
    check: "EmployeeGroup.name, Employee.email and DeliveryLocation.label are unique per program, case-insensitively"
    error_id: ERR_DUPLICATE_NAME
    http_status: 409
    applies_to: ["POST /meal-programs/{id}/employee-groups", "POST /meal-programs/{id}/delivery-locations", "POST /employees"]
    description: "Tenant-scoped uniqueness."

  - priority: 30
    category: business_constraint
    check: "distance_km(restaurant, delivery_location) <= min(MealProgram.max_delivery_radius_km, Restaurant.delivery_radius_km)"
    error_id: ERR_RESTAURANT_OUT_OF_RANGE
    http_status: 422
    applies_to: ["POST /orders/{id}/place", "POST /group-orders"]
    description: "Two-sided radius test, inclusive at the limit, on the 3-decimal rounded distance."

  - priority: 31
    category: business_constraint
    check: "Restaurant.cuisine is a member of MealProgram.eligible_cuisines"
    error_id: ERR_CUISINE_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /orders/{id}/place", "POST /group-orders"]
    description: "Cuisine allow-list, independent of distance."

  - priority: 32
    category: business_constraint
    check: "the employee's count of PLACED, CONFIRMED and DELIVERED orders on the requested UTC date is below the pinned BudgetRule.daily_meal_limit"
    error_id: ERR_DAILY_MEAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /orders/{id}/place"]
    description: "Aggregate validation: each order is individually legal, the collection is not. Cancelled orders free a slot."

  - priority: 33
    category: business_constraint
    check: "a member order's subtotal_cents + tax_cents does not exceed GroupOrder.per_person_limit_cents"
    error_id: ERR_PER_PERSON_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /orders/{id}/place"]
    description: "Measured on the pre-fee base, so the fees a member order will later attract do not count against the limit."

  - priority: 34
    category: business_constraint
    check: "GroupOrder.reopen_count is below GROUP_REOPEN_LIMIT"
    error_id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /group-orders/{id}/reopen"]
    description: "Cycle termination condition for the cyclic group-order machine."

  - priority: 35
    category: business_constraint
    check: "line_index is present and addresses an existing line for MISSING_ITEM, and is absent for NEVER_DELIVERED"
    error_id: ERR_LINE_INDEX_INVALID
    http_status: 422
    applies_to: ["POST /credit-claims"]
    description: "Conditional validation keyed on claim_type."

  - priority: 36
    category: business_constraint
    check: "claimed_cents does not exceed the order's remaining refundable amount, and for MISSING_ITEM does not exceed the addressed line's base plus its rounded line tax"
    error_id: ERR_CLAIM_EXCEEDS_ORDER
    http_status: 422
    applies_to: ["POST /credit-claims", "POST /credit-claims/{id}/resolve"]
    description: "Prevents over-refunding an order across accumulated claims."

  - priority: 37
    category: business_fiscal
    check: "when employee_card_cents > 0 the pinned BudgetRule.overage_policy is PERSONAL_CARD"
    error_id: ERR_OVERAGE_NOT_PERMITTED
    http_status: 409
    applies_to: ["POST /orders/{id}/place", "POST /group-orders/{id}/submit"]
    description: "BLOCK groups may never exceed the covered base; exactly-at-cap is not an overage."

  - priority: 38
    category: business_fiscal
    check: "BenefitPeriod.available_cents is at least min(covered_base_cents, per_meal_cap_cents)"
    error_id: ERR_PERIOD_BUDGET_EXCEEDED
    http_status: 409
    applies_to: ["POST /orders/{id}/place", "POST /group-orders/{id}/submit"]
    description: "The employer share is never silently truncated by an exhausted period; the placement is refused instead."

  - priority: 39
    category: business_fiscal
    check: "when employee_card_cents > 0 the Employee has personal_card_on_file true"
    error_id: ERR_PERSONAL_CARD_REQUIRED
    http_status: 402
    applies_to: ["POST /orders/{id}/place", "POST /group-orders/{id}/submit"]
    description: "Last gate: there must be an instrument to collect the employee remainder and any uncovered tip."

# =============================================================================
# §1.5 Table 5: API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock ---------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the logical current UTC instant used by every temporal rule. The default clock, before any call to this endpoint, is 2026-08-01T00:00:00Z."
    roles: [PlatformAdmin, ProgramAdmin]
    code: 200
    input: [now]
    output: { now: datetime }
    side_effects:
      - "no entity is mutated; subsequent temporal evaluations read the new instant"

  # --- MealProgram -----------------------------------------------------------
  - method: POST
    path: /meal-programs
    description: "Creates a meal stipend program (tenant root)."
    roles: [PlatformAdmin]
    code: 201
    input: [employer_name, billing_account_ref, eligible_cuisines, "max_delivery_radius_km?", "taxable_benefit_method?", "rollover_policy?", "rollover_cap_pct?", "forecast_basis?"]
    output: MealProgram
    side_effects:
      - "initialises program_spent_cents, program_reserved_cents and mtd_employer_captured_cents to 0"
  - method: GET
    path: /meal-programs/{id}
    description: "Reads a program with its live rollups."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController]
    code: 200
    input: []
    output: MealProgram
    side_effects: []
  - method: PATCH
    path: /meal-programs/{id}
    description: "Updates program-level policy selectors. Does not retroactively re-derive existing orders or ImputedIncomeRecord.method."
    roles: [PlatformAdmin]
    code: 200
    input: ["taxable_benefit_method?", "forecast_basis?", "rollover_policy?", "rollover_cap_pct?", "max_delivery_radius_km?", "eligible_cuisines?"]
    output: MealProgram
    side_effects:
      - "increments version by 1"
      - "no recomputation of historical orders, records or exports"
  - method: POST
    path: /meal-programs/{id}/employee-groups
    description: "Creates an employee group under the program."
    roles: [ProgramAdmin]
    code: 201
    input: [name, headcount_planned]
    output: EmployeeGroup
    side_effects:
      - "initialises active_rule_count to 0"
  - method: GET
    path: /meal-programs/{id}/employee-groups
    description: "Lists the program's employee groups."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController]
    code: 200
    input: ["limit?", "offset?"]
    output: EmployeeGroup[]
    side_effects: []
  - method: POST
    path: /meal-programs/{id}/delivery-locations
    description: "Creates a delivery dock for the program."
    roles: [ProgramAdmin]
    code: 201
    input: [label, grid_x_km, grid_y_km, "dock_buffer_minutes?"]
    output: DeliveryLocation
    side_effects: []
  - method: GET
    path: /meal-programs/{id}/delivery-locations
    description: "Lists the program's delivery docks."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: DeliveryLocation[]
    side_effects: []
  - method: GET
    path: /meal-programs/{id}/eligible-restaurants
    description: "Runs restaurant_eligibility_selection for a delivery location and returns the ranked eligible restaurants."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: [delivery_location_id, "limit?", "offset?"]
    output: Restaurant[]
    side_effects:
      - "runs restaurant_eligibility_selection; returns an empty array with total_count 0 when nothing qualifies"
  - method: GET
    path: /meal-programs/{id}/forecast
    description: "Runs program_cost_forecast under the program's current forecast_basis."
    roles: [ProgramAdmin, BenefitsController]
    code: 200
    input: []
    output: { forecast_basis: string, forecast_total_cents: integer, forecast_admin_fee_cents: integer, remaining_eligible_days: integer, elapsed_eligible_days: integer, total_eligible_days: integer, active_rule_group_count: integer }
    side_effects:
      - "runs program_cost_forecast; read-only"
  - method: POST
    path: /meal-programs/{id}/expense-exports
    description: "Generates an expense / payroll export for one tax month."
    roles: [BenefitsController]
    code: 201
    input: [tax_month, format]
    output: ExpenseExport
    side_effects:
      - "runs expense_export_totals"
      - "status FAILED when receipt_count is 0, otherwise GENERATED"
      - "cascades every LOCKED ImputedIncomeRecord in the bucket to EXPORTED when format is PAYROLL_IMPUTED_FEED and status is GENERATED"
  - method: GET
    path: /meal-programs/{id}/expense-exports
    description: "Lists the program's exports."
    roles: [ProgramAdmin, BenefitsController]
    code: 200
    input: ["tax_month?", "status?", "limit?", "offset?"]
    output: ExpenseExport[]
    side_effects: []
  - method: POST
    path: /expense-exports/{id}/acknowledge
    description: "Records downstream acceptance of a generated export."
    roles: [BenefitsController]
    code: 200
    input: []
    output: ExpenseExport
    side_effects:
      - "moves status GENERATED -> ACKNOWLEDGED"
      - "increments version by 1"

  # --- EmployeeGroup / BudgetRule -------------------------------------------
  - method: GET
    path: /employee-groups/{id}
    description: "Reads an employee group."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController]
    code: 200
    input: []
    output: EmployeeGroup
    side_effects: []
  - method: POST
    path: /employee-groups/{id}/budget-rules
    description: "Drafts a budget rule for the group."
    roles: [BenefitsController]
    code: 201
    input: [effective_from, per_meal_cap_cents, daily_meal_limit, monthly_allocation_cents, eligible_weekdays, eligible_window_start_minute, eligible_window_end_minute, "overage_policy?", "tip_coverage_policy?"]
    output: BudgetRule
    side_effects:
      - "records drafted_by_user_id from the X-User-ID header"
      - "creates the rule in status DRAFT"
  - method: GET
    path: /employee-groups/{id}/budget-rules
    description: "Lists the group's budget rules."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BudgetRule[]
    side_effects: []
  - method: POST
    path: /budget-rules/{id}/activate
    description: "Activates a drafted budget rule under optimistic concurrency on the owning employee group."
    roles: [BenefitsController]
    code: 200
    input: [expected_employee_group_version]
    output: BudgetRule
    side_effects:
      - "moves the rule DRAFT -> ACTIVE and assigns rule_sequence"
      - "moves the group's previously ACTIVE rule to SUPERSEDED"
      - "increments EmployeeGroup.version by 1 and recomputes active_rule_count"

  # --- Employee --------------------------------------------------------------
  - method: POST
    path: /employees
    description: "Enrolls an employee in a program and group."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, group_id, full_name, email, "personal_card_on_file?"]
    output: Employee
    side_effects:
      - "initialises ytd_imputed_cents to 0 and tax_treatment_flag to NONE"
  - method: GET
    path: /employees/{id}
    description: "Reads an employee."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: /employees
    description: "Lists employees, filterable by program and group."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController]
    code: 200
    input: ["program_id?", "group_id?", "status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: POST
    path: /employees/{id}/deactivate
    description: "Deactivates an employee and drains their open budget periods."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Employee
    side_effects:
      - "moves status ACTIVE -> INACTIVE"
      - "moves every OPEN BenefitPeriod of the employee to GRACE and increments each version by 1"
  - method: GET
    path: /employees/{id}/imputed-income-records
    description: "Lists the employee's monthly imputed income records."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: ["tax_month?", "limit?", "offset?"]
    output: ImputedIncomeRecord[]
    side_effects: []

  # --- Restaurant ------------------------------------------------------------
  - method: POST
    path: /restaurants
    description: "Registers a restaurant on the platform."
    roles: [PlatformAdmin]
    code: 201
    input: [name, cuisine, grid_x_km, grid_y_km, delivery_radius_km, "max_concurrent_group_deliveries?"]
    output: Restaurant
    side_effects: []
  - method: GET
    path: /restaurants/{id}
    description: "Reads a restaurant."
    roles: [PlatformAdmin, ProgramAdmin, BenefitsController, Employee, Restaurant]
    code: 200
    input: []
    output: Restaurant
    side_effects: []
  - method: PATCH
    path: /restaurants/{id}
    description: "Suspends or reinstates a restaurant."
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Restaurant
    side_effects:
      - "cycles status between ELIGIBLE and SUSPENDED"
      - "increments version by 1"
      - "no historical order is re-derived"

  # --- BenefitPeriod ---------------------------------------------------------
  - method: POST
    path: /benefit-periods
    description: "Opens a monthly benefit period, pinning the employee group's ACTIVE budget rule and drawing any predecessor rollover."
    roles: [ProgramAdmin]
    code: 201
    input: [employee_id, period_month, "predecessor_period_id?"]
    output: BenefitPeriod
    side_effects:
      - "pins budget_rule_id from the group's ACTIVE BudgetRule"
      - "copies predecessor rollover_out_cents into rollover_in_cents"
      - "sets allocated_cents to monthly_allocation_cents + rollover_in_cents and available_cents to the same"
      - "recomputes MealProgram.program_reserved_cents"
  - method: GET
    path: /benefit-periods/{id}
    description: "Reads a benefit period with its live budget partition."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: []
    output: BenefitPeriod
    side_effects: []
  - method: GET
    path: /benefit-periods
    description: "Lists benefit periods, filterable by employee, pinned rule and predecessor."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: ["employee_id?", "budget_rule_id?", "predecessor_period_id?", "status?", "period_month?", "limit?", "offset?"]
    output: BenefitPeriod[]
    side_effects: []
  - method: POST
    path: /benefit-periods/{id}/close
    description: "Moves the period to GRACE or performs a final close with rollover and forfeiture."
    roles: [ProgramAdmin]
    code: 200
    input: [mode]
    output: BenefitPeriod
    side_effects:
      - "mode GRACE only blocks new placements"
      - "mode FINAL runs period_close_rollover, drives available_cents to 0 and locks the month's ImputedIncomeRecord rows"
      - "increments version by 1"

  # --- Order -----------------------------------------------------------------
  - method: POST
    path: /orders
    description: "Drafts an order, optionally attaching it to a group order as a member order."
    roles: [Employee]
    code: 201
    input: [employee_id, benefit_period_id, restaurant_id, delivery_location_id, requested_delivery_at, lines, "group_order_id?", "tip_cents?"]
    output: Order
    side_effects:
      - "creates the order with fulfillment_status DRAFT and settlement_status UNSETTLED"
      - "no money is computed and no budget is reserved until place"
  - method: GET
    path: /orders/{id}
    description: "Reads an order with its full money breakdown."
    roles: [ProgramAdmin, BenefitsController, Employee, Restaurant]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: /orders
    description: "Lists orders, filterable by every foreign key and by either state dimension."
    roles: [ProgramAdmin, BenefitsController, Employee, Restaurant]
    code: 200
    input: ["employee_id?", "benefit_period_id?", "restaurant_id?", "delivery_location_id?", "group_order_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: /orders/{id}/place
    description: "Prices the order, authorises the employer/employee split and reserves employer budget, under optimistic concurrency on the benefit period."
    roles: [Employee]
    code: 200
    input: [expected_benefit_period_version]
    output: Order
    side_effects:
      - "runs order_line_tax_subtotal, order_fee_assessment, employer_employee_split and admin_fee_assessment in that order"
      - "moves fulfillment_status DRAFT -> PLACED and settlement_status UNSETTLED -> SPLIT_AUTHORIZED"
      - "increments BenefitPeriod.reserved_cents and decrements available_cents by employer_covered_cents"
      - "increments BenefitPeriod.version by 1"
      - "increments GroupOrder.member_order_count when group_order_id is present"
      - "recomputes MealProgram.program_reserved_cents"
  - method: POST
    path: /orders/{id}/confirm
    description: "Restaurant accepts a placed order."
    roles: [Restaurant]
    code: 200
    input: []
    output: Order
    side_effects:
      - "moves fulfillment_status PLACED -> CONFIRMED with no money movement"
  - method: POST
    path: /orders/{id}/deliver
    description: "Restaurant completes delivery; captures the split and accrues imputed income."
    roles: [Restaurant]
    code: 200
    input: []
    output: Order
    side_effects:
      - "moves fulfillment_status CONFIRMED -> DELIVERED and settlement_status SPLIT_AUTHORIZED -> CAPTURED"
      - "moves employer_covered_cents from BenefitPeriod.reserved_cents to spent_cents and increments version by 1"
      - "creates or updates the employee's ImputedIncomeRecord for tax_month and runs imputed_income_accrual"
      - "recomputes Employee.ytd_imputed_cents and tax_treatment_flag"
      - "recomputes MealProgram.program_spent_cents, program_reserved_cents and mtd_employer_captured_cents"
  - method: POST
    path: /orders/{id}/cancel
    description: "Cancels an order before delivery, releasing the reservation and voiding the authorised split."
    roles: [Employee, ProgramAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "moves fulfillment_status to CANCELLED and settlement_status to VOIDED"
      - "releases employer_covered_cents back to BenefitPeriod.available_cents and increments version by 1"
      - "writes ORDER_VOID RefundLedgerEntry rows for each non-zero side when the split had been authorised"
      - "zeroes admin_fee_cents, net_charged_cents and employer_net_cents"
      - "decrements GroupOrder.member_order_count when group_order_id is present"
  - method: GET
    path: /orders/{id}/refund-entries
    description: "Lists the immutable refund ledger entries written against the order."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: ["direction?", "reason?", "limit?", "offset?"]
    output: RefundLedgerEntry[]
    side_effects: []

  # --- GroupOrder ------------------------------------------------------------
  - method: POST
    path: /group-orders
    description: "Opens a group order for a single restaurant and dock, with a join cutoff and a per-person pre-fee limit."
    roles: [Employee]
    code: 201
    input: [program_id, organizer_employee_id, restaurant_id, delivery_location_id, cutoff_at, window_start, window_end, per_person_limit_cents]
    output: GroupOrder
    side_effects:
      - "creates the group order in status COLLECTING with member_order_count 0 and reopen_count 0"
  - method: GET
    path: /group-orders/{id}
    description: "Reads a group order."
    roles: [ProgramAdmin, BenefitsController, Employee, Restaurant]
    code: 200
    input: []
    output: GroupOrder
    side_effects: []
  - method: GET
    path: /group-orders
    description: "Lists group orders, filterable by every foreign key."
    roles: [ProgramAdmin, BenefitsController, Employee, Restaurant]
    code: 200
    input: ["program_id?", "organizer_employee_id?", "restaurant_id?", "delivery_location_id?", "status?", "limit?", "offset?"]
    output: GroupOrder[]
    side_effects: []
  - method: POST
    path: /group-orders/{id}/lock
    description: "Organizer freezes the member list."
    roles: [Employee]
    code: 200
    input: []
    output: GroupOrder
    side_effects:
      - "moves status COLLECTING -> LOCKED"
      - "increments version by 1"
  - method: POST
    path: /group-orders/{id}/reopen
    description: "Organizer reopens collection before the cutoff, up to GROUP_REOPEN_LIMIT times."
    roles: [Employee]
    code: 200
    input: []
    output: GroupOrder
    side_effects:
      - "moves status LOCKED -> COLLECTING and increments reopen_count by 1"
      - "increments version by 1"
  - method: POST
    path: /group-orders/{id}/submit
    description: "Submits the consolidated delivery, allocating the group delivery fee and re-pricing every member order."
    roles: [Employee]
    code: 200
    input: []
    output: GroupOrder
    side_effects:
      - "moves status LOCKED -> SUBMITTED"
      - "runs group_delivery_fee_allocation, then re-runs order_fee_assessment, employer_employee_split and admin_fee_assessment per member order"
      - "adjusts every member's BenefitPeriod.reserved_cents by the employer-share delta and increments each version by 1"
      - "sets allocated_delivery_fee_cents to GROUP_DELIVERY_FEE_CENTS"
  - method: POST
    path: /group-orders/{id}/cancel
    description: "Cancels the group order and cascades cancellation to its member orders."
    roles: [Employee]
    code: 200
    input: []
    output: GroupOrder
    side_effects:
      - "moves status to CANCELLED"
      - "cancels every member order in DRAFT or PLACED and releases their reservations"
      - "increments each affected BenefitPeriod.version by 1"

  # --- CreditClaim -----------------------------------------------------------
  - method: POST
    path: /credit-claims
    description: "Employee raises a missing-item, quality or non-delivery credit claim against a delivered order."
    roles: [Employee]
    code: 201
    input: [order_id, claim_type, claimed_cents, "line_index?"]
    output: CreditClaim
    side_effects:
      - "creates the claim in status SUBMITTED with approved_cents 0"
  - method: GET
    path: /credit-claims/{id}
    description: "Reads a credit claim with its routing split."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: []
    output: CreditClaim
    side_effects: []
  - method: GET
    path: /credit-claims
    description: "Lists credit claims, filterable by order."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: ["order_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: CreditClaim[]
    side_effects: []
  - method: POST
    path: /credit-claims/{id}/resolve
    description: "Approves the claim on a routing basis, or denies it, under optimistic concurrency on the order."
    roles: [BenefitsController]
    code: 200
    input: [decision, expected_order_version, "approved_cents?", "routing_basis?"]
    output: CreditClaim
    side_effects:
      - "forks to ROUTED_EMPLOYEE_FIRST or ROUTED_PROPORTIONAL on APPROVE, or to DENIED on DENY"
      - "runs refund_routing_waterfall and stores employer_credit_cents and employee_refund_cents"
      - "records resolved_by_user_id from the X-User-ID header"
      - "increments Order.version by 1"
  - method: POST
    path: /credit-claims/{id}/settle
    description: "Second-person settlement: writes the refund ledger and moves the money."
    roles: [BenefitsController]
    code: 200
    input: []
    output: CreditClaim
    side_effects:
      - "joins to SETTLED from either routed state"
      - "writes the RefundLedgerEntry rows and advances Order.settlement_status to PARTIALLY_REFUNDED or REFUNDED"
      - "decrements BenefitPeriod.spent_cents by employer_credit_cents and increments available_cents by the same"
      - "re-runs imputed_income_accrual and reconciles ImputedIncomeRecord and Employee.ytd_imputed_cents"
      - "increments Order.version by 1"
  - method: GET
    path: /credit-claims/{id}/refund-entries
    description: "Lists the immutable ledger entries written by this claim's settlement."
    roles: [ProgramAdmin, BenefitsController, Employee]
    code: 200
    input: ["direction?", "limit?", "offset?"]
    output: RefundLedgerEntry[]
    side_effects: []

# =============================================================================
# §1.6 Table 6: Error Code Catalog
# =============================================================================
errors:

  # --- auth / shape / generic state ------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID or X-Role header missing, or X-Role is not a declared role"
    applies_to: ["all"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "caller's role is not in the endpoint's roles list"
    applies_to: ["all"]
  - id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    condition: "correct role but the addressed row belongs to another employee or restaurant"
    applies_to: ["POST /orders", "POST /orders/{id}/place", "POST /orders/{id}/confirm", "POST /orders/{id}/deliver", "POST /orders/{id}/cancel", "POST /group-orders/{id}/lock", "POST /group-orders/{id}/reopen", "POST /group-orders/{id}/submit", "POST /group-orders/{id}/cancel", "POST /credit-claims", "GET /orders/{id}", "GET /employees/{id}"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "the acting X-User-ID equals the user who performed the preceding workflow step"
    applies_to: ["POST /budget-rules/{id}/activate", "POST /credit-claims/{id}/settle"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing required field, bad type, unknown enum member, out-of-range number, empty or oversized lines array, pagination limit outside 1..100"
    applies_to: ["all"]
  - id: ERR_INVALID_STATE
    http_status: 409
    condition: "the requested transition is not declared from the entity's current state, including repeat invocation and terminal-state lockdown"
    applies_to: ["all action endpoints"]

  # --- existence -------------------------------------------------------------
  - id: ERR_MEAL_PROGRAM_NOT_FOUND
    http_status: 404
    condition: "meal program id does not resolve"
    applies_to: ["GET /meal-programs/{id}", "PATCH /meal-programs/{id}", "POST /meal-programs/{id}/employee-groups", "GET /meal-programs/{id}/employee-groups", "POST /meal-programs/{id}/delivery-locations", "GET /meal-programs/{id}/delivery-locations", "GET /meal-programs/{id}/eligible-restaurants", "GET /meal-programs/{id}/forecast", "POST /meal-programs/{id}/expense-exports", "GET /meal-programs/{id}/expense-exports", "POST /group-orders"]
  - id: ERR_EMPLOYEE_GROUP_NOT_FOUND
    http_status: 404
    condition: "employee group id does not resolve"
    applies_to: ["GET /employee-groups/{id}", "POST /employee-groups/{id}/budget-rules", "GET /employee-groups/{id}/budget-rules", "POST /employees"]
  - id: ERR_BUDGET_RULE_NOT_FOUND
    http_status: 404
    condition: "budget rule id does not resolve"
    applies_to: ["POST /budget-rules/{id}/activate", "GET /benefit-periods"]
  - id: ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    condition: "employee id does not resolve"
    applies_to: ["GET /employees/{id}", "POST /employees/{id}/deactivate", "GET /employees/{id}/imputed-income-records", "POST /benefit-periods", "POST /orders", "POST /group-orders"]
  - id: ERR_BENEFIT_PERIOD_NOT_FOUND
    http_status: 404
    condition: "benefit period id does not resolve, including a non-existent predecessor_period_id"
    applies_to: ["GET /benefit-periods/{id}", "POST /benefit-periods/{id}/close", "POST /benefit-periods", "POST /orders"]
  - id: ERR_RESTAURANT_NOT_FOUND
    http_status: 404
    condition: "restaurant id does not resolve"
    applies_to: ["GET /restaurants/{id}", "PATCH /restaurants/{id}", "POST /orders", "POST /group-orders"]
  - id: ERR_DELIVERY_LOCATION_NOT_FOUND
    http_status: 404
    condition: "delivery location id does not resolve"
    applies_to: ["GET /meal-programs/{id}/eligible-restaurants", "POST /orders", "POST /group-orders"]
  - id: ERR_GROUP_ORDER_NOT_FOUND
    http_status: 404
    condition: "group order id does not resolve"
    applies_to: ["GET /group-orders/{id}", "POST /group-orders/{id}/lock", "POST /group-orders/{id}/reopen", "POST /group-orders/{id}/submit", "POST /group-orders/{id}/cancel", "POST /orders"]
  - id: ERR_ORDER_NOT_FOUND
    http_status: 404
    condition: "order id does not resolve"
    applies_to: ["GET /orders/{id}", "POST /orders/{id}/place", "POST /orders/{id}/confirm", "POST /orders/{id}/deliver", "POST /orders/{id}/cancel", "GET /orders/{id}/refund-entries", "POST /credit-claims"]
  - id: ERR_CREDIT_CLAIM_NOT_FOUND
    http_status: 404
    condition: "credit claim id does not resolve"
    applies_to: ["GET /credit-claims/{id}", "POST /credit-claims/{id}/resolve", "POST /credit-claims/{id}/settle", "GET /credit-claims/{id}/refund-entries"]
  - id: ERR_EXPENSE_EXPORT_NOT_FOUND
    http_status: 404
    condition: "expense export id does not resolve"
    applies_to: ["POST /expense-exports/{id}/acknowledge"]

  # --- cross-entity state gates ---------------------------------------------
  - id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    condition: "the order's benefit period is in GRACE or CLOSED at place time"
    applies_to: ["POST /orders/{id}/place"]
  - id: ERR_EMPLOYEE_INACTIVE
    http_status: 409
    condition: "the acting employee is INACTIVE"
    applies_to: ["POST /orders/{id}/place", "POST /group-orders"]
  - id: ERR_RESTAURANT_NOT_ELIGIBLE
    http_status: 409
    condition: "the restaurant is SUSPENDED"
    applies_to: ["POST /orders/{id}/place", "POST /orders/{id}/confirm", "POST /group-orders/{id}/submit"]
  - id: ERR_GROUP_ORDER_NOT_COLLECTING
    http_status: 409
    condition: "a member order is created or placed while the group order is LOCKED, SUBMITTED or CANCELLED"
    applies_to: ["POST /orders", "POST /orders/{id}/place"]
  - id: ERR_GROUP_ORDER_EMPTY
    http_status: 409
    condition: "lock or submit attempted with member_order_count 0"
    applies_to: ["POST /group-orders/{id}/lock", "POST /group-orders/{id}/submit"]
  - id: ERR_RULE_NOT_EFFECTIVE
    http_status: 409
    condition: "activation attempted while effective_from is strictly after the current logical clock"
    applies_to: ["POST /budget-rules/{id}/activate"]

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PERIOD_VERSION
    http_status: 412
    condition: "expected_benefit_period_version does not equal the current BenefitPeriod.version"
    applies_to: ["POST /orders/{id}/place"]
  - id: ERR_STALE_EMPLOYEE_GROUP_VERSION
    http_status: 412
    condition: "expected_employee_group_version does not equal the current EmployeeGroup.version"
    applies_to: ["POST /budget-rules/{id}/activate"]
  - id: ERR_STALE_ORDER_VERSION
    http_status: 412
    condition: "expected_order_version does not equal the current Order.version"
    applies_to: ["POST /credit-claims/{id}/resolve"]

  # --- safety --------------------------------------------------------------
  - id: ERR_TAX_MONTH_LOCKED
    http_status: 409
    condition: "the affected ImputedIncomeRecord bucket is LOCKED or EXPORTED"
    applies_to: ["POST /orders/{id}/deliver", "POST /credit-claims/{id}/resolve", "POST /credit-claims/{id}/settle"]
  - id: ERR_PERIOD_HAS_OPEN_ORDERS
    http_status: 409
    condition: "final close attempted while an attached order is PLACED or CONFIRMED"
    applies_to: ["POST /benefit-periods/{id}/close"]
  - id: ERR_EMPLOYEE_HAS_OPEN_ORDERS
    http_status: 409
    condition: "deactivation attempted while the employee has a PLACED or CONFIRMED order"
    applies_to: ["POST /employees/{id}/deactivate"]

  # --- temporal ------------------------------------------------------------
  - id: ERR_OUTSIDE_ELIGIBLE_WEEKDAY
    http_status: 422
    condition: "ISO weekday of requested_delivery_at is not in the pinned rule's eligible_weekdays"
    applies_to: ["POST /orders/{id}/place"]
  - id: ERR_OUTSIDE_ELIGIBLE_WINDOW
    http_status: 422
    condition: "minute-of-day of requested_delivery_at is outside the half-open eligible window"
    applies_to: ["POST /orders/{id}/place"]
  - id: ERR_GROUP_CUTOFF_PASSED
    http_status: 409
    condition: "the logical clock is at or after GroupOrder.cutoff_at"
    applies_to: ["POST /orders", "POST /orders/{id}/place", "POST /group-orders/{id}/reopen"]
  - id: ERR_DOCK_WINDOW_CONFLICT
    http_status: 409
    condition: "another SUBMITTED group order occupies the dock over the closed buffered interval"
    applies_to: ["POST /group-orders/{id}/submit"]
  - id: ERR_RESTAURANT_CAPACITY_EXCEEDED
    http_status: 409
    condition: "overlapping SUBMITTED group orders at the restaurant would reach max_concurrent_group_deliveries"
    applies_to: ["POST /group-orders/{id}/submit"]

  # --- referential ---------------------------------------------------------
  - id: ERR_PERIOD_EMPLOYEE_MISMATCH
    http_status: 422
    condition: "benefit_period_id belongs to a different employee than employee_id"
    applies_to: ["POST /orders"]
  - id: ERR_PROGRAM_SCOPE_MISMATCH
    http_status: 422
    condition: "a referenced row belongs to a different MealProgram"
    applies_to: ["POST /orders", "POST /group-orders", "POST /employees", "GET /meal-programs/{id}/eligible-restaurants"]
  - id: ERR_GROUP_ORDER_MISMATCH
    http_status: 422
    condition: "a member order's restaurant_id or delivery_location_id differs from the group order's"
    applies_to: ["POST /orders"]
  - id: ERR_NO_ACTIVE_BUDGET_RULE
    http_status: 409
    condition: "the employee's group has no ACTIVE budget rule to pin at period open"
    applies_to: ["POST /benefit-periods"]
  - id: ERR_PREDECESSOR_NOT_CLOSED
    http_status: 409
    condition: "predecessor_period_id is not CLOSED, belongs to another employee, or is not an earlier month"
    applies_to: ["POST /benefit-periods"]
  - id: ERR_PREDECESSOR_ALREADY_CONSUMED
    http_status: 409
    condition: "predecessor_period_id is already referenced by another benefit period"
    applies_to: ["POST /benefit-periods"]

  # --- constraint ----------------------------------------------------------
  - id: ERR_DUPLICATE_PERIOD_MONTH
    http_status: 409
    condition: "the employee already has a period for that period_month"
    applies_to: ["POST /benefit-periods"]
  - id: ERR_DUPLICATE_NAME
    http_status: 409
    condition: "group name, employee email or delivery location label already exists in the program (case-insensitive)"
    applies_to: ["POST /meal-programs/{id}/employee-groups", "POST /meal-programs/{id}/delivery-locations", "POST /employees"]
  - id: ERR_RESTAURANT_OUT_OF_RANGE
    http_status: 422
    condition: "rounded distance exceeds min(program radius, restaurant radius)"
    applies_to: ["POST /orders/{id}/place", "POST /group-orders"]
  - id: ERR_CUISINE_NOT_ELIGIBLE
    http_status: 422
    condition: "the restaurant's cuisine is not in MealProgram.eligible_cuisines"
    applies_to: ["POST /orders/{id}/place", "POST /group-orders"]
  - id: ERR_DAILY_MEAL_LIMIT_EXCEEDED
    http_status: 409
    condition: "the employee already has daily_meal_limit live orders on the requested UTC date"
    applies_to: ["POST /orders/{id}/place"]
  - id: ERR_PER_PERSON_LIMIT_EXCEEDED
    http_status: 422
    condition: "a member order's subtotal + tax exceeds the group order's per_person_limit_cents"
    applies_to: ["POST /orders/{id}/place"]
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 409
    condition: "reopen attempted when reopen_count already equals GROUP_REOPEN_LIMIT"
    applies_to: ["POST /group-orders/{id}/reopen"]
  - id: ERR_LINE_INDEX_INVALID
    http_status: 422
    condition: "line_index missing or out of range for MISSING_ITEM, or supplied for NEVER_DELIVERED"
    applies_to: ["POST /credit-claims"]
  - id: ERR_CLAIM_EXCEEDS_ORDER
    http_status: 422
    condition: "claimed or approved cents exceed the order's remaining refundable amount, or the addressed line's base plus its rounded line tax"
    applies_to: ["POST /credit-claims", "POST /credit-claims/{id}/resolve"]

  # --- fiscal --------------------------------------------------------------
  - id: ERR_OVERAGE_NOT_PERMITTED
    http_status: 409
    condition: "employee_card_cents would be positive while the pinned rule's overage_policy is BLOCK"
    applies_to: ["POST /orders/{id}/place", "POST /group-orders/{id}/submit"]
  - id: ERR_PERIOD_BUDGET_EXCEEDED
    http_status: 409
    condition: "BenefitPeriod.available_cents is below min(covered_base_cents, per_meal_cap_cents)"
    applies_to: ["POST /orders/{id}/place", "POST /group-orders/{id}/submit"]
  - id: ERR_PERSONAL_CARD_REQUIRED
    http_status: 402
    condition: "employee_card_cents would be positive but the employee has no personal card on file"
    applies_to: ["POST /orders/{id}/place", "POST /group-orders/{id}/submit"]

