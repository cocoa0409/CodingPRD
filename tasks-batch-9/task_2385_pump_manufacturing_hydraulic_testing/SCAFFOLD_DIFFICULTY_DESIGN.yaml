  # =====================================================================
  # Rule 3 - non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: test_run_three_dimensions_move_independently_and_reset_on_reopen
        grounds:
          - state_machines.TestRun.state_dimensions
          - state_machines.TestRun.NOT_EVALUATED_to_WITHIN_TOLERANCE
          - state_machines.TestRun.NOT_VERIFIED_to_REJECTED
          - state_machines.TestRun.EVALUATED_to_OPEN
          - validations[priority=66]
          - calculations.certified_test_curve
        distinguishing_aspect: |
          Parallel shape: a single evaluate call moves run_state, hydraulic_status and npsh_status
          along three INDEPENDENT axes, landing the combination (EVALUATED, WITHIN_TOLERANCE,
          REJECTED) which no linear chain can express; certification is then blocked by the npsh
          axis alone while the hydraulic axis passes, and reopen rewinds all three axes at once.
        test_recipe:
          setup:
            - "Master data, APPROVED Selection APP-1001 (predicted_head_m 73.97, npshr_catalog_m 3.52, verification limit 3.82) and ASSEMBLED BuildOrder SN-0001 exactly as in rule 1 instance 1."
            - "One TestRun at 2900 rpm, RATED_SPEED_CORRECTED, GRADE_1B, POINTS_LOCKED with the five measured points of rule 1 instance 1 EXCEPT that the designated NPSH point carries measured_npsh3_m 3.80, which corrects to 3.93 and exceeds the 3.82 limit."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
