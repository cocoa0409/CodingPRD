# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 per references/claim-extraction-guide.md.
# 51 full instances + 5 excluded_because stubs. Names unique across §1.8+§1.9.
# Logical clock default at server startup: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: case_create_returns_201_with_defaults_and_initial_state
        claim_type: creation
        grounds: [entities.PatientCase, state_machines.PatientCase]
        distinguishing_aspect: "Create with only required fields: system defaults applied (severity STANDARD, classification UNCLASSIFIED, lifecycle INTAKE, reopen_count 0, outstanding_recovery_cents 0, version 1) and server-minted id/created_at present."
        test_recipe:
          setup: ["Clock at default-or-set 2026-08-03T10:00:00Z; unit exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0001", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Waiting room concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id, sev: $.data.severity_tier, cls: $.data.classification, lst: $.data.lifecycle_status, rc: $.data.reopen_count, oc: $.data.outstanding_recovery_cents, ver: $.data.version } }
            - { call: "GET /api/hospital-units/${u1}", as: IntakeCoordinator, captures: { uoc: $.data.open_case_count } }
          assert:
            - "sev == 'STANDARD' and cls == 'UNCLASSIFIED' and lst == 'INTAKE'"
            - "rc == 0 and oc == 0 and ver == 1"
            - "uoc == 1 (derived counter incremented on intake)"

      - name: case_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.PatientCase.fields.unit_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required unit_id -> 400 ERR_INVALID_REQUEST (schema priority 10 when the missing field blocks FK existence checks)."
        test_recipe:
          setup: ["Clock set; nothing else needed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0002", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "No unit supplied", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_REQUEST' and HTTP status 400"

      - name: get_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> 404 ERR_CASE_NOT_FOUND (existence check before any state/business rule)."
        test_recipe:
          setup: ["Clock set"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /api/patient-cases/00000000-0000-0000-0000-000000000000", as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CASE_NOT_FOUND' and HTTP status 404"

      - name: holiday_duplicate_date_rejected
        claim_type: type_constraints
        grounds: [entities.HolidayObservance.fields.observance_date, "errors[ERR_DUPLICATE_HOLIDAY]"]
        distinguishing_aspect: "observance_date uniqueness: second POST with same date -> 409 ERR_DUPLICATE_HOLIDAY."
        test_recipe:
          setup: ["One holiday registered for 2026-09-07"]
          setup_api_calls:
            - { call: "POST /api/holiday-observances", payload: { observance_date: "2026-09-07", name: "Labor Day" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/holiday-observances", payload: { observance_date: "2026-09-07", name: "Duplicate Entry" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_DUPLICATE_HOLIDAY'"

      - name: investigation_note_is_immutable
        claim_type: immutability
        grounds: [entities.InvestigationNote]
        distinguishing_aspect: "common_fields: false entity — note response carries id + created_at but NO version/updated_at; no update endpoint exists for InvestigationNote in §1.5."
        test_recipe:
          setup: ["Grievance with OPEN investigation (inv assigned)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Ortho", category: "SURGICAL" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0005", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Surgical site concern", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
          trigger:
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "INTERVIEW", body: "Patient interview transcript summary" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { n1: $.data.id } }
            - { call: "GET /api/investigation-notes/${n1}", as: DepartmentInvestigator, as_user_id: "${inv}" }
          assert:
            - "Create response has id and created_at but no 'version' and no 'updated_at' key"
            - "GET returns identical body and note_type; no PUT/PATCH endpoint exists for /api/investigation-notes"

      - name: entity_backed_role_without_capability_unauthorized
        claim_type: parent_relationships
        grounds: ["roles[DepartmentInvestigator]", entities.StaffMember.fields.capabilities, "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Entity-backed role gate: X-User-ID references a StaffMember lacking INVESTIGATOR capability -> 403 ERR_UNAUTHORIZED_ROLE at priority 2, before any state checks."
        test_recipe:
          setup: ["adv holds only ADVOCATE capability; a case exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0006", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "EMAIL", description: "Concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${adv}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_UNAUTHORIZED_ROLE' (capability gate, not a case-state error)"

      - name: list_pagination_envelope_fields
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count + has_more; defaults limit=10 when omitted."
        test_recipe:
          setup: ["Three units created"]
          setup_api_calls:
            - { call: "POST /api/hospital-units", payload: { name: "Unit A", category: "ICU" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Unit B", category: "INPATIENT" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Unit C", category: "OUTPATIENT" }, as: SystemAdmin }
          trigger:
            - { call: "GET /api/hospital-units?limit=2&offset=0", as: SystemAdmin }
            - { call: "GET /api/hospital-units?limit=2&offset=2", as: SystemAdmin }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"
            - "Omitting limit applies default 10 (all 3 items returned)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: withdraw_from_terminal_withdrawn_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PatientCase, "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw is rejected with ERR_CASE_INVALID_STATE and no cascade re-fires."
        test_recipe:
          setup: ["Case in INTAKE, then withdrawn"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0101", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Concern withdrawn", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/withdraw", payload: { withdraw_reason: "Patient request" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/withdraw", payload: { withdraw_reason: "Duplicate attempt" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/hospital-units/${u1}", as: IntakeCoordinator, captures: { oc: $.data.open_case_count } }
          assert:
            - "err == 'ERR_CASE_INVALID_STATE'"
            - "oc == 0 (unit counter decremented exactly once — cascade did not re-fire)"

      - name: accept_findings_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Investigation.FINDINGS_SUBMITTED_to_FINDINGS_ACCEPTED, "errors[ERR_INVESTIGATION_INVALID_STATE]"]
        distinguishing_aspect: "accept-findings while investigation OPEN (never submitted) -> ERR_INVESTIGATION_INVALID_STATE."
        test_recipe:
          setup: ["Grievance with OPEN investigation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Ortho", category: "SURGICAL" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0102", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Concern", grievance_category: "CARE_QUALITY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
          trigger:
            - { call: "POST /api/investigations/${iv1}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVESTIGATION_INVALID_STATE' (OPEN is not FINDINGS_SUBMITTED)"

      - name: letter_issue_before_approval_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ResponseLetter.APPROVED_to_ISSUED, "errors[ERR_LETTER_INVALID_STATE]"]
        distinguishing_aspect: "issue on a DRAFT letter -> ERR_LETTER_INVALID_STATE; closure cascade does not fire."
        test_recipe:
          setup: ["COMPLAINT fast-tracked to RESPONSE_DRAFTING; letter DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Clinic", category: "OUTPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0103", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PORTAL", description: "Billing question", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/fast-track", payload: {}, as: IntakeCoordinator }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Courtesy letter content here" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id } }
          trigger:
            - { call: "POST /api/response-letters/${l1}/issue", payload: {}, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/patient-cases/${c1}", as: IntakeCoordinator, captures: { lst: $.data.lifecycle_status } }
          assert:
            - "err == 'ERR_LETTER_INVALID_STATE'"
            - "lst == 'RESPONSE_DRAFTING' (no closure side effects fired)"

      - name: reopen_from_non_closed_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PatientCase.CLOSED_to_REOPENED, "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "Manual reopen requires CLOSED; on a CLASSIFIED case -> ERR_CASE_INVALID_STATE."
        test_recipe:
          setup: ["Case classified GRIEVANCE, still CLASSIFIED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0104", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/reopen", payload: { reopen_reason: "Too early" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CASE_INVALID_STATE'"

      - name: followup_respond_after_expiry_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SatisfactionFollowUp.PENDING_to_RESPONDED, calculations.followup_schedule, "errors[ERR_FOLLOWUP_INVALID_STATE]"]
        distinguishing_aspect: "Respond past expires_at (due 2026-08-17T09:00:00Z + 10 business days = 2026-08-31T09:00:00Z) is rejected even though the row still reads PENDING until derived EXPIRED."
        test_recipe:
          setup: ["Grievance closed 2026-08-10T09:00:00Z (Mon); follow-up PENDING due 2026-08-17T09:00:00Z, expires 2026-08-31T09:00:00Z; clock advanced past expiry"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0105", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Discharge delay", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "INTERVIEW", body: "Interview" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "Records" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Confirmed" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Letter content" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/response-letters/${l1}/issue", payload: {}, as: IntakeCoordinator }
            - { call: "GET /api/follow-ups?case_id=${c1}", as: PatientAdvocate, as_user_id: "${adv}", captures: { fu: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/follow-ups/${fu}/respond", payload: { score: 4 }, as: PatientAdvocate, as_user_id: "${adv}", captures: { err: $.data.error_id } }
            - { call: "GET /api/follow-ups/${fu}", as: PatientAdvocate, as_user_id: "${adv}", captures: { fst: $.data.status } }
          assert:
            - "err == 'ERR_FOLLOWUP_INVALID_STATE' (now 2026-09-01 > expires_at 2026-08-31T09:00:00Z)"
            - "fst == 'EXPIRED' (derived on read)"

      - name: closure_completes_assignments_and_creates_followup
        claim_type: side_effect_execution
        grounds: [state_machines.PatientCase.PENDING_CLOSURE_to_CLOSED, state_machines.CaseAssignment.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "Letter-issue closure fires the full side-effect set: assignments COMPLETED (counter decremented), unit open_case_count decremented, follow-up created with computed due/expires."
        test_recipe:
          setup: ["Grievance at APPROVED letter; clock 2026-08-10T09:00:00Z (Monday)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0106", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "EMAIL", description: "Billing concern", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
