              payload: { full_name: "Ravi Iyer", grade: "JUNIOR", standard_daily_capacity_minutes: 480, cost_rate_cents_per_hour: 3000 }
              as: AgencyAdmin
              captures: { st_ravi: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Ends 2026-05-01", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-04-01", effective_end: "2026-05-01" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow_a: $.data.id }
            - call: "POST /sows"
              payload: { client_id: "${cli}", rate_card_id: "${rc}", title: "Ends 2026-05-02", labor_cap_cents: 4000000, markup_pct: 0.175, effective_start: "2026-04-01", effective_end: "2026-05-02" }
              as: AccountManager
              as_user_id: "${st_ravi}"
              captures: { sow_b: $.data.id }
          trigger:
            - call: "POST /sows/${sow_a}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
            - call: "POST /sows/${sow_b}/countersign"
              payload: {}
              as: ClientReviewer
              as_user_id: "${cli}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: AgencyAdmin
              captures: { now: $.data.now_utc }
          assert:
            - "the first trigger call returns HTTP 409"
            - "${err} == ERR_SOW_EXPIRED"
            - "SOW.${sow_a}.status == DRAFT"
            - "the second trigger call returns HTTP 200"
            - "SOW.${sow_b}.status == COUNTERSIGNED"
            - "SOW.${sow_b}.pinned_rate_senior_cents_per_hour == 20000"
            - "${now} == '2026-05-02T00:00:00Z'"
            - "after the third trigger call: SOW.${sow_b}.status == EXPIRED (effective_end 2026-05-02 <= now)"

