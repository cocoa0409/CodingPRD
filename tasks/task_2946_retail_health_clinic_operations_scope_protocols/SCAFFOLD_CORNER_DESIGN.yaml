              as: ClinicAdmin
              captures: { p71_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Larch One", credential: "NP", license_state_code: "CA", home_clinic_id: "${c71_id}", supervising_physician_id: "${p71_id}" }
              as: ClinicAdmin
              captures: { cl71_a_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Larch Two", credential: "PA", license_state_code: "CA", home_clinic_id: "${c71_id}", supervising_physician_id: "${p71_id}" }
              as: ClinicAdmin
              captures: { cl71_b_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c71_id}", clinician_id: "${cl71_a_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T01:00:00Z", pinned_supervising_physician_id: "${p71_id}" }
              as: ClinicAdmin
              captures: { sa71_a_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c71_id}", clinician_id: "${cl71_b_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T01:00:00Z", pinned_supervising_physician_id: "${p71_id}" }
              as: ClinicAdmin
              captures: { sa71_b_id: $.data.id }
          trigger:
            - call: "POST /staffing-assignments/${sa71_a_id}/cancel"
              payload: { cancel_reason: "Called away" }
              as: ClinicAdmin
              captures: { first_cancel_status: $.data.status }
            - call: "GET /clinics/${c71_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c71_on_duty_mid: $.data.on_duty_clinician_count, c71_posture_mid: $.data.open_status }
            - call: "POST /staffing-assignments/${sa71_a_id}/cancel"
              payload: { cancel_reason: "Called away again" }
              as: ClinicAdmin
              captures: { second_cancel_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T02:00:00Z" }
              as: ClinicAdmin
            - call: "GET /staffing-assignments/${sa71_b_id}"
              payload: {}
              as: ClinicAdmin
              captures: { sa71_b_status: $.data.status }
            - call: "POST /staffing-assignments/${sa71_b_id}/cancel"
              payload: { cancel_reason: "Too late" }
              as: ClinicAdmin
              captures: { completed_cancel_err: $.data.error_id }
            - call: "GET /clinics/${c71_id}"
              payload: {}
              as: ClinicAdmin
              captures: { c71_on_duty_end: $.data.on_duty_clinician_count, c71_posture_end: $.data.open_status }
          assert:
            - "${first_cancel_status} == CANCELLED with HTTP status 200"
            - "${c71_on_duty_mid} == 1 and ${c71_posture_mid} == OPEN   # one ACTIVE assignment still meets min_clinicians_required"
            - "${second_cancel_err} == ERR_STAFFING_ASSIGNMENT_INVALID_STATE with HTTP status 409"
            - "${sa71_b_status} == COMPLETED   # the clock passed ends_at 01:00"
            - "${completed_cancel_err} == ERR_STAFFING_ASSIGNMENT_INVALID_STATE with HTTP status 409   # COMPLETED is terminal too"
            - "${c71_on_duty_end} == 0 and ${c71_posture_end} == CLOSED   # no double decrement from the two refused cancels"
            - "Physician.${p71_id}.current_supervised_count == 0"

