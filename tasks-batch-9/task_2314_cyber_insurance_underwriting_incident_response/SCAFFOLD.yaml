scenario: "2314. Cyber Insurance Underwriting & Incident Response Panel (cyber insurer): application and external scan-based control assessment with mandatory control requirements for coverage, coverage tower construction across first-party response, business interruption and third-party liability, sublimits, waiting periods and dependent business interruption definitions, panel vendor selection for forensics, legal counsel and notification services with pre-approved rates, incident notification intake, coverage confirmation and vendor deployment authorization, business interruption loss quantification and proof-of-loss review, systemic event aggregation modeling across the portfolio, renewal control improvement requirements and premium adjustment"
domain_name: cyber-insurance-underwriting-incident-response
api_prefix: "/cyber"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  # Peer entities linked by explicit FK fields; only two sub-resource GET paths exist
  # (coverage-sections and control-attestations/external-scans under their parent) —
  # every other relationship is discovered through a filtered peer-level list.
  state_machine_shape: parallel
  # Policy carries two independent state dimensions (lifecycle_status x limit_status);
  # IncidentClaim, Application and RenewalAssessment each carry a revision cycle;
  # confirm-coverage/deny is a branching fork with divergent side-effect sets.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  # polymorphic: ClaimPayment.coverage_section_id points at whichever tower section the
  # waterfall selected, and the same allocation routine is driven by two different loss
  # sources (accepted ProofOfLoss, completed VendorEngagement).
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ControlRequirement
    parent: null
    common_fields: false
    fields:
      - name: control_key
        type: enum
        source: input
        description: "Catalog key of the security control being required."
        constraints: "one of {MFA_PRIVILEGED, OFFLINE_BACKUPS, EDR_COVERAGE, EMAIL_FILTERING, INCIDENT_RESPONSE_PLAN}; unique across ControlRequirement rows"
      - name: is_mandatory
        type: boolean
        source: input
        description: "When true, a verified level below min_level_required blocks quoting and binding."
        default: false
      - name: min_level_required
        type: enum
        source: input
        description: "Lowest acceptable maturity level for this control."
        constraints: "one of {NONE, PARTIAL, FULL}"
      - name: weight
        type: integer
        source: input
        description: "Weight of this control inside control_posture_score."
        constraints: ">= 1 and <= 100"
      - name: remediation_grace_days
        type: integer
        source: input
        description: "Days an insured is given to remediate this control at renewal."
        default: 30
        constraints: ">= 0 and <= 365"

  - name: InsuredAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered name of the prospective insured."
        constraints: "1..200 chars"
      - name: industry_code
        type: enum
        source: input
        description: "Industry classification driving the base rate and panel sector eligibility."
        constraints: "one of {HEALTHCARE, FINANCIAL, RETAIL, MANUFACTURING, PUBLIC_SECTOR, TECHNOLOGY}"
      - name: annual_revenue_usd
        type: number
        source: input
        description: "Most recent full-year revenue; drives the revenue tier factor and modeled hourly revenue."
        constraints: "> 0"
      - name: record_count
        type: integer
        source: input
        description: "Count of held personal records; drives notification exposure."
        constraints: ">= 0"
      - name: primary_dependency_key
        type: enum
        source: input
        description: "Named single point of technology dependency used by systemic aggregation."
        default: NONE
        constraints: "one of {CSP_ALPHA, CSP_BETA, MSSP_DELTA, NONE}"
      - name: open_remediation_count
        type: integer
        source: computed
        description: "Count of this account's Applications currently in status REMEDIATION_REQUIRED; maintained by the scan-completion and resubmit-controls cascades."
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: insured_account_id
        type: string
        source: input
        description: "FK -> InsuredAccount.id; the applicant this submission belongs to."
      - name: requested_aggregate_limit_usd
        type: number
        source: input
        description: "Requested policy aggregate limit."
        constraints: ">= MIN_AGGREGATE_LIMIT_USD (250000); integer multiple of LIMIT_INCREMENT_USD (250000)"
      - name: requested_retention_usd
        type: number
        source: input
        description: "Requested per-claim retention (self-insured amount)."
        constraints: ">= 0 and <= requested_aggregate_limit_usd"
      - name: dependent_bi_definition
        type: enum
        source: input
        description: "Breadth of dependent business interruption wording requested."
        constraints: "one of {NAMED_ONLY, NAMED_PLUS_SUPPLY_CHAIN, BROAD_SYSTEM_FAILURE}"
      - name: status
        type: enum
        source: system
        description: "Underwriting lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDERWRITING, REMEDIATION_REQUIRED, QUOTED, BOUND, DECLINED, EXPIRED}"
      - name: attested_control_score
        type: number
        source: computed
        description: "control_posture_score on the attested_basis variant; refreshed on attestation write, submit and resubmit-controls."
      - name: verified_control_score
        type: number
        source: computed
        description: "control_posture_score on the verified_basis variant; null until a COMPLETED ExternalScan exists, refreshed by the scan-completion cascade."
      - name: mandatory_gap_count
        type: integer
        source: computed
        description: "Count of ControlRequirement rows with is_mandatory true whose verified effective level is below min_level_required."
        default: 0
      - name: mandatory_gap_control_keys
        type: array
        source: computed
        description: "control_key values behind mandatory_gap_count, ordered by ControlRequirement.weight DESC then control_key ASC."
      - name: indicative_premium_usd
        type: number
        source: computed
        description: "premium_quote evaluated with the attested_basis score at submit time."
      - name: premium_usd
        type: number
        source: computed
        description: "premium_quote evaluated with the verified_basis score at quote time; cleared to null whenever the application re-enters REMEDIATION_REQUIRED or SUBMITTED."
      - name: quoted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Underwriter who issued the live quote; drives the quote-versus-bind segregation of duties check."
      - name: quote_expires_at
        type: datetime
        source: computed
        description: "Quote issue time plus QUOTE_VALID_DAYS (30 days); the epoch run expires QUOTED applications past this instant."
      - name: declined_reason
        type: string
        source: input
        description: "Free-text reason recorded when the application is declined."

  - name: ControlAttestation
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the submission this attestation belongs to."
      - name: control_key
        type: enum
        source: input
        description: "Catalog control being attested; must match an existing ControlRequirement.control_key. Unique per (application_id, control_key)."
        constraints: "one of {MFA_PRIVILEGED, OFFLINE_BACKUPS, EDR_COVERAGE, EMAIL_FILTERING, INCIDENT_RESPONSE_PLAN}"
      - name: attested_level
        type: enum
        source: input
        description: "Maturity level the applicant claims."
        constraints: "one of {NONE, PARTIAL, FULL}"
      - name: verified_level
        type: enum
        source: computed
        description: "min(attested_level, scan-observed level) written by the scan-completion cascade; reset to null by resubmit-controls."
        constraints: "one of {NONE, PARTIAL, FULL} or null"

  - name: ExternalScan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the submission scanned."
      - name: scan_vendor_name
        type: string
        source: input
        description: "Name of the external attack-surface scanning provider."
        constraints: "1..120 chars"
      - name: status
        type: enum
        source: system
        description: "Scan lifecycle state."
        default: PENDING
        constraints: "one of {PENDING, COMPLETED, FAILED}"
      - name: scan_score
        type: number
        source: input
        description: "Provider's own 0..100 external posture score; recorded, never used in premium math."
        constraints: ">= 0 and <= 100"
      - name: findings
        type: array
        source: input
        description: "Array of {control_key, severity, observed_level} objects supplied at completion; a control_key absent from this array is treated as observed FULL."
        constraints: "severity one of {LOW, MEDIUM, HIGH, CRITICAL}; observed_level one of {NONE, PARTIAL, FULL}; at most one entry per control_key"
      - name: critical_finding_count
        type: integer
        source: computed
        description: "Count of findings entries with severity CRITICAL."
        default: 0
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the scan reached COMPLETED or FAILED."

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the bound submission."
      - name: insured_account_id
        type: string
        source: computed
        description: "FK -> InsuredAccount.id; copied from the bound Application at creation."
      - name: aggregate_limit_usd
        type: number
        source: computed
        description: "Copied from Application.requested_aggregate_limit_usd at bind."
      - name: aggregate_limit_remaining_usd
        type: number
        source: computed
        description: "aggregate_limit_usd minus the sum of ClaimPayment.net_paid_usd with payment_status POSTED across this policy's claims."
      - name: retention_usd
        type: number
        source: computed
        description: "Copied from Application.requested_retention_usd at bind; absorbed once per IncidentClaim."
      - name: premium_usd
        type: number
        source: computed
        description: "Copied from Application.premium_usd at bind; the earned premium denominator of policy_loss_ratio."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the policy period."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the policy period; must be strictly after period_start."
      - name: bi_baseline_method
        type: enum
        source: input
        description: "Baseline variant the tower uses to quantify business interruption loss."
        constraints: "one of {TRAILING_12M, SAME_PERIOD_PRIOR_YEAR}"
      - name: dependent_bi_definition
        type: enum
        source: computed
        description: "Copied from the bound Application."
        constraints: "one of {NAMED_ONLY, NAMED_PLUS_SUPPLY_CHAIN, BROAD_SYSTEM_FAILURE}"
      - name: named_dependency_keys
        type: array
        source: input
        description: "Dependency keys scheduled by name for dependent BI cover."
        constraints: "subset of {CSP_ALPHA, CSP_BETA, MSSP_DELTA}"
      - name: warranty_control_keys
        type: array
        source: computed
        description: "Snapshot of ControlRequirement.control_key values with is_mandatory true, pinned at bind; later catalog edits do not change it."
      - name: lapsed_warranty_control_keys
        type: array
        source: computed
        description: "Warranty controls currently reported below min_level_required, sorted control_key ASC."
      - name: warranty_status
        type: enum
        source: computed
        description: "COMPLIANT while lapsed_warranty_control_keys is empty, otherwise LAPSED."
        default: COMPLIANT
        constraints: "one of {COMPLIANT, LAPSED}"
      - name: lifecycle_status
        type: enum
        source: system
        description: "First state dimension: contractual life of the policy."
        default: INFORCE
        constraints: "one of {INFORCE, CANCELLED, EXPIRED, NON_RENEWED}"
      - name: limit_status
        type: enum
        source: computed
        description: "Second, independent state dimension: erosion of aggregate capacity."
        default: INTACT
        constraints: "one of {INTACT, PARTIALLY_ERODED, EXHAUSTED}"
      - name: aggregation_flagged
        type: boolean
        source: computed
        description: "Set true by a systemic scenario whose modeled exposure breaches portfolio capacity; adds a renewal load."
        default: false
      - name: cancelled_at
        type: datetime
        source: computed
        description: "Logical-clock instant of cancellation."
      - name: cancellation_reason
        type: string
        source: input
        description: "Reason recorded on cancellation."

  - name: CoverageSection
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the tower this section belongs to."
      - name: section_key
        type: enum
        source: input
        description: "Coverage part. Unique per (policy_id, section_key)."
        constraints: "one of {FIRST_PARTY_RESPONSE, BUSINESS_INTERRUPTION, DEPENDENT_BI, THIRD_PARTY_LIABILITY, CYBER_EXTORTION}"
      - name: sublimit_usd
        type: number
        source: input
        description: "Loss-side cap for this section."
        constraints: "> 0 and <= Policy.aggregate_limit_usd"
      - name: sublimit_remaining_usd
        type: number
        source: computed
        description: "sublimit_usd minus the sum of ClaimPayment.gross_amount_usd with payment_status POSTED on this section."
      - name: waiting_period_hours
        type: number
        source: input
        description: "Time deductible; required and > 0 for BUSINESS_INTERRUPTION and DEPENDENT_BI, must be null for every other section_key."
        constraints: "null or > 0 and <= 168"
      - name: coinsurance_pct
        type: number
        source: input
        description: "Insured's share of each allocated loss dollar on this section."
        default: 0.00
        constraints: ">= 0 and <= 0.50"
      - name: erosion_priority
        type: integer
        source: input
        description: "Ascending waterfall order; unique per policy_id."
        constraints: ">= 1 and <= 99"

  - name: PanelVendor
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: "Panel firm name."
        constraints: "1..160 chars"
      - name: vendor_type
        type: enum
        source: input
        description: "Panel discipline."
        constraints: "one of {FORENSICS, LEGAL_COUNSEL, NOTIFICATION, PR_CRISIS, RANSOM_NEGOTIATION}"
      - name: pre_approved_hourly_rate_usd
        type: number
        source: input
        description: "Ceiling hourly rate negotiated with the panel firm."
        constraints: "> 0"
      - name: per_record_notification_rate_usd
        type: number
        source: input
        description: "Ceiling per-record price for notification mailings."
        default: 0.00
        constraints: ">= 0"
      - name: specialty_sectors
        type: array
        source: input
        description: "InsuredAccount.industry_code values this firm is empanelled for; an insured whose industry_code is absent makes the firm ineligible."
        constraints: "non-empty subset of {HEALTHCARE, FINANCIAL, RETAIL, MANUFACTURING, PUBLIC_SECTOR, TECHNOLOGY}"
      - name: tier
        type: integer
        source: input
        description: "Panel preference tier; 1 is most preferred and is the primary selector sort key."
        constraints: ">= 1 and <= 3"
      - name: capacity_concurrent_engagements
        type: integer
        source: input
        description: "Maximum engagements whose buffered deployment windows may overlap one instant."
        constraints: ">= 1 and <= 20"
      - name: status
        type: enum
        source: input
        description: "Panel standing."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, RETIRED}"
      - name: active_engagement_count
        type: integer
        source: computed
        description: "Count of VendorEngagement rows on this firm with status in {AUTHORIZED, ACTIVE}; the conserved slot quantity."
        default: 0

  - name: IncidentClaim
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the responding policy."
      - name: systemic_event_scenario_id
        type: string
        source: input
        description: "FK -> SystemicEventScenario.id; optional link tagging this claim to a modeled systemic event."
      - name: incident_type
        type: enum
        source: input
        description: "Event category; drives which tower sections a BI loss may erode."
        constraints: "one of {RANSOMWARE, SYSTEM_FAILURE, DEPENDENT_OUTAGE, BEC, DATA_THEFT}"
      - name: incident_discovered_at
        type: datetime
        source: input
        description: "When the insured discovered the incident; must fall inside [Policy.period_start, Policy.period_end)."
      - name: notified_at
        type: datetime
        source: system
        description: "Logical-clock instant the notification was accepted."
      - name: outage_start_at
        type: datetime
        source: input
        description: "Start of the interruption window; required when incident_type is RANSOMWARE, SYSTEM_FAILURE or DEPENDENT_OUTAGE."
      - name: outage_end_at
        type: datetime
        source: input
        description: "End of the interruption window; must be strictly after outage_start_at."
      - name: dependency_key
        type: enum
        source: input
        description: "Third-party dependency that failed; required when incident_type is DEPENDENT_OUTAGE."
        constraints: "one of {CSP_ALPHA, CSP_BETA, MSSP_DELTA, NONE}"
        default: NONE
      - name: affected_record_count
        type: integer
        source: input
        description: "Personal records implicated; sizes notification work."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state."
        default: NOTIFIED
        constraints: "one of {NOTIFIED, TRIAGE, COVERAGE_CONFIRMED, RESPONSE_ACTIVE, PROOF_REVIEW, INFO_REQUESTED, APPROVED_FOR_PAYMENT, SETTLED, DENIED, CLOSED_NO_COVERAGE}"
      - name: covered_section_keys
        type: array
        source: input
        description: "Sections confirmed as responding at coverage confirmation; every allocation is intersected with this set."
        constraints: "non-empty subset of the policy's CoverageSection.section_key values"
      - name: reservation_of_rights
        type: boolean
        source: input
        description: "True when coverage is confirmed subject to a reservation of rights."
        default: false
      - name: reserved_amount_usd
        type: number
        source: computed
        description: "Outstanding case reserve; set from initial_reserve_usd at coverage confirmation and zeroed on SETTLED, DENIED or CLOSED_NO_COVERAGE."
        default: 0.00
      - name: retention_absorbed_usd
        type: number
        source: computed
        description: "Retention consumed so far by this claim across all allocations; never exceeds Policy.retention_usd."
        default: 0.00
      - name: paid_total_usd
        type: number
        source: computed
        description: "Sum of ClaimPayment.net_paid_usd with payment_status POSTED on this claim."
        default: 0.00
      - name: unallocated_loss_usd
        type: number
        source: computed
        description: "Cumulative approved loss the waterfall could not place because eligible sublimits or the aggregate ran out."
        default: 0.00
      - name: proof_review_round
        type: integer
        source: computed
        description: "Number of information requests issued against proofs of loss on this claim."
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: "Reason recorded when the claim is denied."

  - name: VendorEngagement
    parent: null
    common_fields: true
    fields:
      - name: incident_claim_id
        type: string
        source: input
        description: "FK -> IncidentClaim.id; the claim being responded to."
      - name: panel_vendor_id
        type: string
        source: computed
        description: "FK -> PanelVendor.id; either the id supplied in the request or the winner of the panel selector."
      - name: vendor_type
        type: enum
        source: input
        description: "Discipline requested; also selects the eligible tower sections for this engagement's costs."
        constraints: "one of {FORENSICS, LEGAL_COUNSEL, NOTIFICATION, PR_CRISIS, RANSOM_NEGOTIATION}"
      - name: selection_mode
        type: enum
        source: computed
        description: "DIRECTED when panel_vendor_id was supplied, PANEL_SELECTED when the selector chose."
        constraints: "one of {DIRECTED, PANEL_SELECTED}"
      - name: deployment_start_at
        type: datetime
        source: input
        description: "Inclusive start of the deployment window."
      - name: deployment_end_at
        type: datetime
        source: input
        description: "Inclusive end of the deployment window; must be strictly after deployment_start_at."
      - name: authorized_hours_cap
        type: number
        source: input
        description: "Maximum billable hours authorized."
        constraints: "> 0 and <= 5000"
      - name: approved_rate_usd
        type: number
        source: computed
        description: "PanelVendor.pre_approved_hourly_rate_usd pinned at authorization; later vendor rate edits never change it."
      - name: approved_per_record_rate_usd
        type: number
        source: computed
        description: "PanelVendor.per_record_notification_rate_usd pinned at authorization."
      - name: authorized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClaimsAdjuster who authorized deployment; drives the response-versus-adjustment segregation of duties check."
      - name: incurred_hours
        type: number
        source: computed
        description: "Cumulative logged hours."
        default: 0
      - name: records_notified
        type: integer
        source: computed
        description: "Cumulative notified records."
        default: 0
      - name: incurred_amount_usd
        type: number
        source: computed
        description: "round(incurred_hours * approved_rate_usd, 2) + round(records_notified * approved_per_record_rate_usd, 2)."
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "Engagement lifecycle state."
        default: AUTHORIZED
        constraints: "one of {AUTHORIZED, ACTIVE, COMPLETED, TERMINATED}"

  - name: ProofOfLoss
    parent: null
    common_fields: true
    fields:
      - name: incident_claim_id
        type: string
        source: input
        description: "FK -> IncidentClaim.id; the claim this proof supports."
      - name: claimed_bi_loss_usd
        type: number
        source: input
        description: "Amount the insured asserts; recorded for comparison, never used in the assessed figure."
        constraints: ">= 0"
      - name: trailing_12m_revenue_usd
        type: number
        source: input
        description: "Revenue of the twelve months preceding the outage; numerator of the TRAILING_12M hourly rate."
        constraints: "> 0"
      - name: prior_year_same_period_revenue_usd
        type: number
        source: input
        description: "Revenue in the same calendar window one year earlier; numerator of the SAME_PERIOD_PRIOR_YEAR hourly rate."
        constraints: "> 0"
      - name: prior_year_same_period_hours
        type: number
        source: input
        description: "Hour count of that prior-year window; denominator of the SAME_PERIOD_PRIOR_YEAR hourly rate."
        constraints: "> 0"
      - name: gross_profit_margin_pct
        type: number
        source: input
        description: "Gross profit margin applied to lost revenue."
        constraints: "> 0 and <= 1"
      - name: extra_expense_usd
        type: number
        source: input
        description: "Claimed extra expense, capped at EXTRA_EXPENSE_CAP_PCT of the rounded BI component."
        default: 0.00
        constraints: ">= 0"
      - name: mitigation_savings_usd
        type: number
        source: input
        description: "Savings realised during the outage, credited against the BI component."
        default: 0.00
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Proof review state."
        default: UNDER_REVIEW
        constraints: "one of {UNDER_REVIEW, INFO_REQUESTED, ACCEPTED, SUPERSEDED}"
      - name: baseline_method_applied
        type: enum
        source: computed
        description: "Variant actually used at acceptance: the accept call's override when supplied, otherwise Policy.bi_baseline_method."
        constraints: "one of {TRAILING_12M, SAME_PERIOD_PRIOR_YEAR} or null"
      - name: outage_hours
        type: number
        source: computed
        description: "(IncidentClaim.outage_end_at - outage_start_at) expressed in hours, rounded to 2 decimals."
      - name: compensable_hours
        type: number
        source: computed
        description: "max(0, outage_hours - waiting_period_hours of the eligible BI section)."
      - name: bi_component_usd
        type: number
        source: computed
        description: "Rounded business interruption component of the assessed indemnity."
      - name: mitigation_component_usd
        type: number
        source: computed
        description: "Rounded mitigation credit, never exceeding bi_component_usd."
      - name: extra_expense_component_usd
        type: number
        source: computed
        description: "Rounded extra expense component after the cap."
      - name: assessed_indemnity_usd
        type: number
        source: computed
        description: "bi_component_usd - mitigation_component_usd + extra_expense_component_usd, computed at acceptance."
      - name: info_request_note
        type: string
        source: input
        description: "Adjuster note recorded when further information is requested."

  - name: ClaimPayment
    parent: null
    common_fields: true
    fields:
      - name: incident_claim_id
        type: string
        source: computed
        description: "FK -> IncidentClaim.id; the claim whose loss was allocated."
      - name: coverage_section_id
        type: string
        source: computed
        description: "FK -> CoverageSection.id; the tower section this slice eroded."
      - name: loss_source
        type: enum
        source: computed
        description: "Which allocation trigger produced this payment."
        constraints: "one of {PROOF_OF_LOSS, VENDOR_ENGAGEMENT}"
      - name: gross_amount_usd
        type: number
        source: computed
        description: "Loss dollars allocated to the section before coinsurance; erodes sublimit_remaining_usd."
      - name: retention_applied_usd
        type: number
        source: computed
        description: "Retention absorbed by this allocation, carried on its first payment row only."
        default: 0.00
      - name: coinsurance_deduction_usd
        type: number
        source: computed
        description: "round(gross_amount_usd * CoverageSection.coinsurance_pct, 2)."
        default: 0.00
      - name: net_paid_usd
        type: number
        source: computed
        description: "Insurer's payment after coinsurance and the aggregate cap; erodes Policy.aggregate_limit_remaining_usd."
      - name: payment_status
        type: enum
        source: system
        description: "POSTED on creation; REVERSED once compensated."
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded on reversal."

  - name: RenewalAssessment
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: "FK -> Policy.id; the expiring policy under review."
      - name: required_control_keys
        type: array
        source: input
        description: "Controls the insured must improve to earn a renewal quote."
        constraints: "subset of {MFA_PRIVILEGED, OFFLINE_BACKUPS, EDR_COVERAGE, EMAIL_FILTERING, INCIDENT_RESPONSE_PLAN}"
      - name: remediation_due_at
        type: datetime
        source: input
        description: "Deadline for evidence; the epoch run non-renews assessments still in CONDITIONS_ISSUED past this instant."
      - name: submitted_control_keys
        type: array
        source: computed
        description: "Controls the insured last submitted evidence for."
      - name: verified_control_keys
        type: array
        source: computed
        description: "Controls an Underwriter has verified as remediated, sorted control_key ASC."
      - name: verification_round
        type: integer
        source: computed
        description: "Count of completed verification passes; a third failed pass forces NON_RENEWED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Renewal workflow state."
        default: CONDITIONS_ISSUED
        constraints: "one of {CONDITIONS_ISSUED, REMEDIATION_SUBMITTED, CONDITIONS_MET, RENEWAL_QUOTED, NON_RENEWED}"
      - name: loss_ratio
        type: number
        source: computed
        description: "policy_loss_ratio at quote time, 4 decimals."
      - name: premium_adjustment_pct
        type: number
        source: computed
        description: "(renewal_premium_usd - Policy.premium_usd) / Policy.premium_usd, 4 decimals."
      - name: renewal_premium_usd
        type: number
        source: computed
        description: "Output of renewal_premium_adjustment."
      - name: non_renewal_reason
        type: string
        source: computed
        description: "Reason recorded when the assessment lands in NON_RENEWED."

  - name: SystemicEventScenario
    parent: null
    common_fields: true
    fields:
      - name: dependency_key
        type: enum
        source: input
        description: "Shared dependency assumed to fail."
        constraints: "one of {CSP_ALPHA, CSP_BETA, MSSP_DELTA}"
      - name: assumed_outage_hours
        type: number
        source: input
        description: "Modeled duration of the systemic outage."
        constraints: "> 0 and <= 8760"
      - name: footprint_pct
        type: number
        source: input
        description: "Share of dependent insureds assumed impacted; applied once to the summed exposure."
        constraints: "> 0 and <= 1"
      - name: portfolio_capacity_usd
        type: number
        source: input
        description: "Capacity the portfolio holds for this dependency; a strictly greater modeled exposure is a breach."
        constraints: "> 0"
      - name: qualifying_definitions
        type: array
        source: input
        description: "Policy dependent_bi_definition values that respond in this scenario."
        constraints: "non-empty subset of {NAMED_ONLY, NAMED_PLUS_SUPPLY_CHAIN, BROAD_SYSTEM_FAILURE}"
      - name: status
        type: enum
        source: system
        description: "Modeling state."
        default: DRAFT
        constraints: "one of {DRAFT, MODELED}"
      - name: modeled_policy_count
        type: integer
        source: computed
        description: "Number of policies included in the last model run."
        default: 0
      - name: modeled_gross_exposure_usd
        type: number
        source: computed
        description: "Output of systemic_aggregation_model."
      - name: capacity_breached
        type: boolean
        source: computed
        description: "modeled_gross_exposure_usd > portfolio_capacity_usd, strict."
        default: false
      - name: modeled_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the last model run."

state_machines:
  - entity: Application
    state_field: status
    initial_state: DRAFT
    terminal_states: [BOUND, DECLINED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cyber/applications/{application_id}/submit"
        actor: Insured | Underwriter
        preconditions:
          - "application.status == DRAFT"
          - "a ControlAttestation row exists for every ControlRequirement whose is_mandatory is true"
        side_effects:
          - "recompute Application.attested_control_score via control_posture_score variant attested_basis"
          - "recompute Application.indicative_premium_usd via premium_quote using attested_control_score"
          - "increment Application.version by 1"
      - from: SUBMITTED
        to: UNDERWRITING
        trigger: "POST /cyber/external-scans/{scan_id}/complete with outcome COMPLETED (cascade hop 1)"
        actor: Underwriter
        preconditions:
          - "scan.status == PENDING"
          - "application.status == SUBMITTED"
        side_effects:
          - "hop 1: ExternalScan.status = COMPLETED, findings and critical_finding_count stored, completed_at = logical clock"
          - "hop 2: because the scan completed, every ControlAttestation on the application has verified_level rewritten to min(attested_level, observed_level) and its version incremented"
          - "hop 3: because the attestation rows changed, Application.verified_control_score, mandatory_gap_count and mandatory_gap_control_keys are recomputed via control_posture_score variant verified_basis; Application.status becomes UNDERWRITING"
          - "increment Application.version by 1"
      - from: UNDERWRITING
        to: REMEDIATION_REQUIRED
        trigger: "POST /cyber/external-scans/{scan_id}/complete with outcome COMPLETED when the recomputed mandatory_gap_count > 0 (cascade hop 3b)"
        actor: system
        preconditions:
          - "Application.mandatory_gap_count > 0 immediately after hop 3"
        side_effects:
          - "hop 3b: Application.status = REMEDIATION_REQUIRED and Application.premium_usd = null"
          - "hop 4: because the application entered REMEDIATION_REQUIRED, InsuredAccount.open_remediation_count is incremented by 1 and InsuredAccount.version is incremented by 1"
        note: "Same request as the SUBMITTED -> UNDERWRITING hop; the application lands in REMEDIATION_REQUIRED and never rests in UNDERWRITING when a mandatory gap exists."
      - from: REMEDIATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /cyber/applications/{application_id}/resubmit-controls"
        actor: Insured | Underwriter
        preconditions:
          - "application.status == REMEDIATION_REQUIRED"
          - "every control_key in the request body appears in Application.mandatory_gap_control_keys"
        side_effects:
          - "ControlAttestation.attested_level updated for each submitted control_key and verified_level reset to null on every attestation of the application"
          - "Application.verified_control_score = null, mandatory_gap_count = 0, mandatory_gap_control_keys = []"
          - "recompute Application.attested_control_score and indicative_premium_usd"
          - "InsuredAccount.open_remediation_count decremented by 1 and InsuredAccount.version incremented by 1"
          - "increment Application.version by 1"
        note: "Revision cycle: SUBMITTED -> UNDERWRITING -> REMEDIATION_REQUIRED -> SUBMITTED requires a fresh ExternalScan before the application can be quoted again."
      - from: UNDERWRITING
        to: QUOTED
        trigger: "POST /cyber/applications/{application_id}/quote"
        actor: Underwriter
        preconditions:
          - "application.status IN {UNDERWRITING, QUOTED}"
          - "expected_application_version == application.version"
          - "the application's latest ExternalScan by created_at DESC has status COMPLETED"
          - "Application.mandatory_gap_count == 0"
          - "Application.verified_control_score >= MIN_SCORE_FOR_COVERAGE"
        side_effects:
          - "Application.premium_usd recomputed via premium_quote using verified_control_score"
          - "Application.quoted_by_user_id = X-User-ID, quote_expires_at = clock now + QUOTE_VALID_DAYS"
          - "increment Application.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /cyber/applications/{application_id}/quote issued again (supersede)"
        actor: Underwriter
        preconditions:
          - "application.status == QUOTED"
          - "expected_application_version == application.version"
        side_effects:
          - "previous premium_usd, quoted_by_user_id and quote_expires_at are overwritten by the new quote"
          - "increment Application.version by 1"
        note: "Self-loop; the superseding write is guarded by OCC rule quote-issue-stale-application."
      - from: UNDERWRITING
        to: DECLINED
        trigger: "POST /cyber/applications/{application_id}/decline"
        actor: Underwriter
        preconditions:
          - "application.status IN {UNDERWRITING, REMEDIATION_REQUIRED, QUOTED}"
        side_effects:
          - "Application.declined_reason stored, premium_usd = null"
          - "if the application was in REMEDIATION_REQUIRED, InsuredAccount.open_remediation_count decremented by 1"
          - "increment Application.version by 1"
      - from: QUOTED
        to: BOUND
        trigger: "POST /cyber/applications/{application_id}/bind"
        actor: Underwriter
        preconditions:
          - "application.status == QUOTED"
          - "expected_application_version == application.version"
          - "X-User-ID != application.quoted_by_user_id"
          - "clock now < application.quote_expires_at"
          - "Application.mandatory_gap_count == 0"
          - "no Policy of the same insured_account_id with lifecycle_status IN {INFORCE} overlaps the requested half-open period"
        side_effects:
          - "create Policy in lifecycle_status INFORCE and limit_status INTACT with aggregate_limit_remaining_usd = aggregate_limit_usd"
          - "create one CoverageSection per requested section entry with sublimit_remaining_usd = sublimit_usd"
          - "Policy.warranty_control_keys pinned to the current mandatory ControlRequirement keys"
          - "increment Application.version by 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /cyber/_ops/run-epoch when clock now >= application.quote_expires_at"
        actor: system
        preconditions:
          - "application.status == QUOTED"
          - "clock now >= application.quote_expires_at"
        side_effects:
          - "Application.premium_usd = null"
          - "increment Application.version by 1"

  - entity: ExternalScan
    state_field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /cyber/external-scans/{scan_id}/complete with outcome COMPLETED"
        actor: Underwriter
        preconditions:
          - "scan.status == PENDING"
          - "at most one findings entry per control_key and every control_key matches a ControlRequirement"
        side_effects:
          - "store findings, critical_finding_count and completed_at; drive the Application verification cascade hops 2-4"
          - "increment ExternalScan.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /cyber/external-scans/{scan_id}/complete with outcome FAILED"
        actor: Underwriter
        preconditions:
          - "scan.status == PENDING"
        side_effects:
          - "store completed_at; findings ignored; the Application keeps status SUBMITTED and no attestation is verified"
          - "increment ExternalScan.version by 1"

  - entity: Policy
    state_field: lifecycle_status
    initial_state: INFORCE
    terminal_states: [CANCELLED, EXPIRED, NON_RENEWED]
    transitions:
      - from: INFORCE
        to: CANCELLED
        trigger: "POST /cyber/policies/{policy_id}/cancel"
        actor: Underwriter
        preconditions:
          - "policy.lifecycle_status == INFORCE"
        side_effects:
          - "hop 1: Policy.lifecycle_status = CANCELLED, cancelled_at = clock now, cancellation_reason stored"
          - "hop 2: because the policy was cancelled, every IncidentClaim on it with status IN {NOTIFIED, TRIAGE, COVERAGE_CONFIRMED, RESPONSE_ACTIVE} moves to CLOSED_NO_COVERAGE and its reserved_amount_usd is zeroed"
          - "hop 3: because those claims closed, each of their VendorEngagement rows with status IN {AUTHORIZED, ACTIVE} moves to TERMINATED"
          - "hop 4: because those engagements terminated, PanelVendor.active_engagement_count is decremented once per terminated engagement"
          - "increment Policy.version by 1"
        note: "Conditional cascade on child state: claims already at PROOF_REVIEW or beyond (INFO_REQUESTED, APPROVED_FOR_PAYMENT, SETTLED, DENIED) are untouched because the indemnity determination is already under way."
      - from: INFORCE
        to: EXPIRED
        trigger: "POST /cyber/_ops/run-epoch when clock now >= policy.period_end"
        actor: system
        preconditions:
          - "policy.lifecycle_status == INFORCE"
          - "clock now >= policy.period_end"
        side_effects:
          - "increment Policy.version by 1"
      - from: INFORCE
        to: NON_RENEWED
        trigger: "RenewalAssessment reaching NON_RENEWED (system, same request)"
        actor: system
        preconditions:
          - "policy.lifecycle_status IN {INFORCE, EXPIRED}"
        side_effects:
          - "increment Policy.version by 1"

  - entity: Policy
    state_field: limit_status
    initial_state: INTACT
    terminal_states: []
    transitions:
      - from: INTACT
        to: PARTIALLY_ERODED
        trigger: "ClaimPayment creation leaving 0 < aggregate_limit_remaining_usd < aggregate_limit_usd (system)"
        actor: system
        preconditions:
          - "aggregate_limit_remaining_usd after the allocation is strictly greater than 0 and strictly less than aggregate_limit_usd"
        side_effects:
          - "increment Policy.version by 1"
      - from: PARTIALLY_ERODED
        to: EXHAUSTED
        trigger: "ClaimPayment creation leaving aggregate_limit_remaining_usd == 0 (system)"
        actor: system
        preconditions:
          - "aggregate_limit_remaining_usd after the allocation == 0"
        side_effects:
          - "because the policy became EXHAUSTED, every VendorEngagement with status IN {AUTHORIZED, ACTIVE} on any claim of this policy moves to TERMINATED, which in turn decrements PanelVendor.active_engagement_count once per engagement"
          - "increment Policy.version by 1"
      - from: INTACT
        to: EXHAUSTED
        trigger: "ClaimPayment creation consuming the whole aggregate in one allocation (system)"
        actor: system
        preconditions:
          - "aggregate_limit_remaining_usd was equal to aggregate_limit_usd before the allocation and 0 after it"
        side_effects:
          - "same engagement termination cascade as PARTIALLY_ERODED -> EXHAUSTED"
          - "increment Policy.version by 1"
      - from: EXHAUSTED
        to: PARTIALLY_ERODED
        trigger: "POST /cyber/claim-payments/{payment_id}/reverse restoring capacity (system)"
        actor: system
        preconditions:
          - "aggregate_limit_remaining_usd after the reversal is strictly greater than 0 and strictly less than aggregate_limit_usd"
        side_effects:
          - "increment Policy.version by 1"
        note: "Compensating direction; TERMINATED engagements are not resurrected."
      - from: PARTIALLY_ERODED
        to: INTACT
        trigger: "POST /cyber/claim-payments/{payment_id}/reverse restoring the full aggregate (system)"
        actor: system
        preconditions:
          - "aggregate_limit_remaining_usd after the reversal == aggregate_limit_usd"
        side_effects:
          - "increment Policy.version by 1"

  - entity: IncidentClaim
    state_field: status
    initial_state: NOTIFIED
    terminal_states: [SETTLED, DENIED, CLOSED_NO_COVERAGE]
    transitions:
      - from: NOTIFIED
        to: TRIAGE
        trigger: "POST /cyber/incident-claims/{claim_id}/triage"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == NOTIFIED"
          - "policy.lifecycle_status == INFORCE"
        side_effects:
          - "increment IncidentClaim.version by 1"
      - from: TRIAGE
        to: COVERAGE_CONFIRMED
        trigger: "POST /cyber/incident-claims/{claim_id}/confirm-coverage"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == TRIAGE"
          - "policy.lifecycle_status == INFORCE"
          - "policy.limit_status != EXHAUSTED"
          - "every covered_section_keys entry names an existing CoverageSection of the policy"
          - "when claim.incident_type == DEPENDENT_OUTAGE: policy.dependent_bi_definition != NAMED_ONLY or claim.dependency_key IN policy.named_dependency_keys"
        side_effects:
          - "store covered_section_keys and reservation_of_rights; reserved_amount_usd = initial_reserve_usd"
          - "increment IncidentClaim.version by 1"
        note: "Branch point: confirm-coverage and deny fork from TRIAGE with disjoint side-effect sets."
      - from: TRIAGE
        to: DENIED
        trigger: "POST /cyber/incident-claims/{claim_id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status IN {TRIAGE, RESPONSE_ACTIVE, PROOF_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "denial_reason stored, reserved_amount_usd = 0.00"
          - "every VendorEngagement of this claim with status IN {AUTHORIZED, ACTIVE} moves to TERMINATED, decrementing PanelVendor.active_engagement_count once per engagement"
          - "increment IncidentClaim.version by 1"
      - from: COVERAGE_CONFIRMED
        to: RESPONSE_ACTIVE
        trigger: "POST /cyber/incident-claims/{claim_id}/vendor-engagements"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status IN {COVERAGE_CONFIRMED, RESPONSE_ACTIVE}"
          - "policy.limit_status != EXHAUSTED"
        side_effects:
          - "create VendorEngagement in status AUTHORIZED and increment PanelVendor.active_engagement_count by 1"
          - "increment IncidentClaim.version by 1"
      - from: RESPONSE_ACTIVE
        to: PROOF_REVIEW
        trigger: "POST /cyber/incident-claims/{claim_id}/proofs-of-loss"
        actor: Insured
        preconditions:
          - "claim.status IN {COVERAGE_CONFIRMED, RESPONSE_ACTIVE, PROOF_REVIEW, INFO_REQUESTED}"
          - "expected_claim_version == claim.version"
          - "compensable_hours computed against the eligible BI section is strictly greater than 0"
        side_effects:
          - "create ProofOfLoss in UNDER_REVIEW; any prior ProofOfLoss of this claim in {UNDER_REVIEW, INFO_REQUESTED} moves to SUPERSEDED"
          - "increment IncidentClaim.version by 1"
      - from: PROOF_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /cyber/proofs-of-loss/{proof_id}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == PROOF_REVIEW"
          - "proof.status == UNDER_REVIEW"
        side_effects:
          - "ProofOfLoss.status = INFO_REQUESTED, info_request_note stored"
          - "IncidentClaim.proof_review_round incremented by 1"
          - "increment IncidentClaim.version by 1"
      - from: INFO_REQUESTED
        to: PROOF_REVIEW
        trigger: "POST /cyber/incident-claims/{claim_id}/proofs-of-loss (revised proof)"
        actor: Insured
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "expected_claim_version == claim.version"
        side_effects:
          - "prior ProofOfLoss moves to SUPERSEDED, new ProofOfLoss created in UNDER_REVIEW"
          - "increment IncidentClaim.version by 1"
        note: "Revision cycle PROOF_REVIEW -> INFO_REQUESTED -> PROOF_REVIEW, bounded by MAX_PROOF_REVIEW_ROUNDS."
      - from: PROOF_REVIEW
        to: DENIED
        trigger: "POST /cyber/proofs-of-loss/{proof_id}/request-info when proof_review_round would exceed MAX_PROOF_REVIEW_ROUNDS"
        actor: system
        preconditions:
          - "claim.proof_review_round == MAX_PROOF_REVIEW_ROUNDS before this request"
        side_effects:
          - "ProofOfLoss.status = SUPERSEDED, IncidentClaim.status = DENIED with denial_reason PROOF_INSUFFICIENT, reserved_amount_usd = 0.00"
          - "every VendorEngagement of this claim in {AUTHORIZED, ACTIVE} moves to TERMINATED, decrementing PanelVendor.active_engagement_count"
          - "increment IncidentClaim.version by 1"
        note: "Cycle termination condition — the loop cannot run forever."
      - from: PROOF_REVIEW
        to: APPROVED_FOR_PAYMENT
        trigger: "POST /cyber/proofs-of-loss/{proof_id}/accept (cascade hop 2)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == PROOF_REVIEW"
          - "proof.status == UNDER_REVIEW"
          - "X-User-ID does not appear as authorized_by_user_id on any VendorEngagement of this claim"
          - "policy.lifecycle_status == INFORCE"
        side_effects:
          - "hop 1: ProofOfLoss.status = ACCEPTED with baseline_method_applied and the bi_indemnity_quantification outputs written"
          - "hop 2: because the proof was accepted, IncidentClaim.status = APPROVED_FOR_PAYMENT"
          - "increment IncidentClaim.version by 1"
      - from: APPROVED_FOR_PAYMENT
        to: SETTLED
        trigger: "POST /cyber/proofs-of-loss/{proof_id}/accept (cascade hops 3-6, same request)"
        actor: system
        preconditions:
          - "claim.status == APPROVED_FOR_PAYMENT"
        side_effects:
          - "hop 3: because the claim was approved, tower_allocation_waterfall runs over assessed_indemnity_usd and creates one ClaimPayment per eroded section; claim.retention_absorbed_usd, paid_total_usd and unallocated_loss_usd updated; reserved_amount_usd = 0.00; claim.status = SETTLED"
          - "hop 4: because those payments posted, each CoverageSection.sublimit_remaining_usd and Policy.aggregate_limit_remaining_usd are decremented and Policy.limit_status is recomputed"
          - "hop 5: because Policy.limit_status became EXHAUSTED, every VendorEngagement of this policy's claims in {AUTHORIZED, ACTIVE} moves to TERMINATED"
          - "hop 6: because those engagements terminated, PanelVendor.active_engagement_count is decremented once per engagement"
          - "increment IncidentClaim.version by 1"
      - from: NOTIFIED
        to: CLOSED_NO_COVERAGE
        trigger: "POST /cyber/policies/{policy_id}/cancel (system cascade)"
        actor: system
        preconditions:
          - "claim.status IN {NOTIFIED, TRIAGE, COVERAGE_CONFIRMED, RESPONSE_ACTIVE}"
          - "policy.lifecycle_status just became CANCELLED"
        side_effects:
          - "reserved_amount_usd = 0.00; engagements terminated as described on the Policy cancel transition"
          - "increment IncidentClaim.version by 1"

  - entity: VendorEngagement
    state_field: status
    initial_state: AUTHORIZED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: AUTHORIZED
        to: ACTIVE
        trigger: "POST /cyber/vendor-engagements/{engagement_id}/log-hours (first log)"
        actor: ClaimsAdjuster
        preconditions:
          - "engagement.status == AUTHORIZED"
          - "incurred_hours + hours <= authorized_hours_cap"
        side_effects:
          - "incurred_hours, records_notified and incurred_amount_usd recomputed"
          - "increment VendorEngagement.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /cyber/vendor-engagements/{engagement_id}/log-hours (subsequent logs)"
        actor: ClaimsAdjuster
        preconditions:
          - "engagement.status == ACTIVE"
          - "incurred_hours + hours <= authorized_hours_cap"
        side_effects:
          - "incurred_hours, records_notified and incurred_amount_usd recomputed"
          - "increment VendorEngagement.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /cyber/vendor-engagements/{engagement_id}/complete"
        actor: ClaimsAdjuster
        preconditions:
          - "engagement.status IN {AUTHORIZED, ACTIVE}"
          - "claim.status IN {COVERAGE_CONFIRMED, RESPONSE_ACTIVE, PROOF_REVIEW, INFO_REQUESTED, APPROVED_FOR_PAYMENT}"
          - "policy.limit_status != EXHAUSTED when incurred_amount_usd > 0"
        side_effects:
          - "tower_allocation_waterfall runs over incurred_amount_usd against the vendor_type's eligible sections, creating ClaimPayment rows with loss_source VENDOR_ENGAGEMENT"
          - "PanelVendor.active_engagement_count decremented by 1 and PanelVendor.version incremented by 1"
          - "CoverageSection.sublimit_remaining_usd, Policy.aggregate_limit_remaining_usd and Policy.limit_status updated as on the payment cascade"
          - "increment VendorEngagement.version by 1"
      - from: AUTHORIZED
        to: TERMINATED
        trigger: "System cascade from policy cancellation, claim denial or aggregate exhaustion"
        actor: system
        preconditions:
          - "engagement.status IN {AUTHORIZED, ACTIVE}"
        side_effects:
          - "no allocation runs; incurred_amount_usd is retained as an unpaid figure"
          - "PanelVendor.active_engagement_count decremented by 1 and PanelVendor.version incremented by 1"
          - "increment VendorEngagement.version by 1"

  - entity: ProofOfLoss
    state_field: status
    initial_state: UNDER_REVIEW
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /cyber/proofs-of-loss/{proof_id}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "proof.status == UNDER_REVIEW"
          - "claim.proof_review_round < MAX_PROOF_REVIEW_ROUNDS"
        side_effects:
          - "info_request_note stored; claim moves to INFO_REQUESTED"
          - "increment ProofOfLoss.version by 1"
      - from: INFO_REQUESTED
        to: SUPERSEDED
        trigger: "POST /cyber/incident-claims/{claim_id}/proofs-of-loss (revised proof)"
        actor: system
        preconditions:
          - "proof.status IN {UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "increment ProofOfLoss.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /cyber/proofs-of-loss/{proof_id}/accept"
        actor: ClaimsAdjuster
        preconditions:
          - "proof.status == UNDER_REVIEW"
          - "claim.status == PROOF_REVIEW"
        side_effects:
          - "bi_indemnity_quantification outputs written; the claim payment cascade runs"
          - "increment ProofOfLoss.version by 1"

  - entity: ClaimPayment
    state_field: payment_status
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /cyber/claim-payments/{payment_id}/reverse"
        actor: ClaimsAdjuster
        preconditions:
          - "payment.payment_status == POSTED"
          - "policy.lifecycle_status != CANCELLED"
        side_effects:
          - "CoverageSection.sublimit_remaining_usd increased by gross_amount_usd; Policy.aggregate_limit_remaining_usd increased by net_paid_usd; Policy.limit_status recomputed"
          - "IncidentClaim.paid_total_usd decreased by net_paid_usd, retention_absorbed_usd decreased by retention_applied_usd, unallocated_loss_usd reset to 0.00"
          - "if the claim was SETTLED it returns to APPROVED_FOR_PAYMENT"
          - "increment ClaimPayment.version, CoverageSection.version, Policy.version and IncidentClaim.version by 1"

  - entity: RenewalAssessment
    state_field: status
    initial_state: CONDITIONS_ISSUED
    terminal_states: [RENEWAL_QUOTED, NON_RENEWED]
    transitions:
      - from: CONDITIONS_ISSUED
        to: CONDITIONS_MET
        trigger: "POST /cyber/policies/{policy_id}/renewal-assessments with an empty required_control_keys array"
        actor: Underwriter
        preconditions:
          - "required_control_keys is empty"
        side_effects:
          - "assessment is created directly in CONDITIONS_MET with verified_control_keys = []"
      - from: CONDITIONS_ISSUED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /cyber/renewal-assessments/{assessment_id}/submit-remediation"
        actor: Insured
        preconditions:
          - "assessment.status == CONDITIONS_ISSUED"
          - "every submitted control_key appears in required_control_keys"
        side_effects:
          - "submitted_control_keys stored"
          - "increment RenewalAssessment.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: CONDITIONS_MET
        trigger: "POST /cyber/renewal-assessments/{assessment_id}/verify-remediation covering every required control"
        actor: Underwriter
        preconditions:
          - "assessment.status == REMEDIATION_SUBMITTED"
          - "verified_control_requirement set union verified_control_keys covers required_control_keys"
        side_effects:
          - "verified_control_keys updated, verification_round incremented by 1"
          - "increment RenewalAssessment.version by 1"
      - from: REMEDIATION_SUBMITTED
        to: CONDITIONS_ISSUED
        trigger: "POST /cyber/renewal-assessments/{assessment_id}/verify-remediation covering only part of the required controls"
        actor: Underwriter
        preconditions:
          - "assessment.status == REMEDIATION_SUBMITTED"
          - "verification_round < MAX_VERIFICATION_ROUNDS after incrementing"
        side_effects:
          - "verified_control_keys updated with the verified subset, verification_round incremented by 1"
          - "increment RenewalAssessment.version by 1"
        note: "Negotiation cycle CONDITIONS_ISSUED -> REMEDIATION_SUBMITTED -> CONDITIONS_ISSUED."
      - from: REMEDIATION_SUBMITTED
        to: NON_RENEWED
        trigger: "POST /cyber/renewal-assessments/{assessment_id}/verify-remediation on the pass that would make verification_round exceed MAX_VERIFICATION_ROUNDS"
        actor: system
        preconditions:
          - "verification_round == MAX_VERIFICATION_ROUNDS before this pass and the required controls are still not all verified"
        side_effects:
          - "non_renewal_reason = CONDITIONS_NOT_MET; Policy.lifecycle_status = NON_RENEWED and Policy.version incremented by 1"
          - "increment RenewalAssessment.version by 1"
      - from: CONDITIONS_ISSUED
        to: NON_RENEWED
        trigger: "POST /cyber/_ops/run-epoch when clock now >= remediation_due_at"
        actor: system
        preconditions:
          - "assessment.status == CONDITIONS_ISSUED"
          - "clock now >= assessment.remediation_due_at"
        side_effects:
          - "non_renewal_reason = REMEDIATION_DEADLINE_MISSED; Policy.lifecycle_status = NON_RENEWED"
          - "increment RenewalAssessment.version by 1"
      - from: CONDITIONS_MET
        to: RENEWAL_QUOTED
        trigger: "POST /cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
        actor: Underwriter
        preconditions:
          - "assessment.status == CONDITIONS_MET"
          - "expected_policy_version == policy.version"
          - "policy.lifecycle_status IN {INFORCE, EXPIRED}"
          - "policy.warranty_status == COMPLIANT"
        side_effects:
          - "loss_ratio, renewal_premium_usd and premium_adjustment_pct written via renewal_premium_adjustment"
          - "increment RenewalAssessment.version by 1"

  - entity: SystemicEventScenario
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: MODELED
        trigger: "POST /cyber/systemic-scenarios/{scenario_id}/model"
        actor: PortfolioActuary
        preconditions:
          - "scenario.status IN {DRAFT, MODELED}"
        side_effects:
          - "modeled_policy_count, modeled_gross_exposure_usd, capacity_breached and modeled_at written via systemic_aggregation_model"
          - "when capacity_breached is true, every included Policy gets aggregation_flagged = true and Policy.version incremented by 1"
          - "increment SystemicEventScenario.version by 1"
      - from: MODELED
        to: MODELED
        trigger: "POST /cyber/systemic-scenarios/{scenario_id}/model (re-run)"
        actor: PortfolioActuary
        preconditions:
          - "scenario.status == MODELED"
        side_effects:
          - "outputs overwritten; policies excluded by the new run keep aggregation_flagged as set by earlier runs"
          - "increment SystemicEventScenario.version by 1"

concurrency_rules:
  - rule_id: quote-issue-stale-application
    parent_entity: Application
    write_endpoint: "POST /cyber/applications/{application_id}/quote"
    occ_field: "expected_application_version"
    description: |
      Issuing a quote against an Application whose version has advanced since the
      Underwriter last observed it is rejected. A re-quote legitimately supersedes the
      live quote (premium, quote_expires_at and quoted_by_user_id are overwritten), so
      the operation cannot be rejected on state grounds; the stale-version check is the
      only guard that stops an Underwriter from overwriting a quote issued from a view
      of the application that no longer holds.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: proof-submit-stale-claim
    parent_entity: IncidentClaim
    write_endpoint: "POST /cyber/incident-claims/{claim_id}/proofs-of-loss"
    occ_field: "expected_claim_version"
    description: |
      Submitting a proof of loss against an IncidentClaim whose version has advanced
      since the insured last observed it is rejected. An amended proof legitimately
      supersedes the proof already under review, so state preconditions allow the
      write; the stale-version check is what stops an insured from filing an amendment
      built on a claim view that a coverage or engagement change has since invalidated.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: bind-stale-application
    parent_entity: Application
    write_endpoint: "POST /cyber/applications/{application_id}/bind"
    occ_field: "expected_application_version"
    description: |
      Binding an Application whose version has advanced since the binder last observed it
      is rejected. A QUOTED application stays bindable after a re-quote replaced the
      premium, so no state precondition catches a binder who is working from the earlier
      quote; the stale-version check is what stops a policy being issued at a premium the
      application no longer carries.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: renewal-quote-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
    occ_field: "expected_policy_version"
    description: |
      Issuing a renewal quote against a Policy whose version has advanced since the
      PortfolioActuary last observed it is rejected. Every posted or reversed ClaimPayment
      and every systemic model run that flags the policy advances Policy.version and moves
      the loss ratio the renewal premium is built from, while the assessment itself stays
      in CONDITIONS_MET, so no state precondition can catch the stale read.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

calculations:
  - name: control_posture_score
    trigger: "On POST /cyber/applications/{application_id}/control-attestations, POST .../submit, POST .../resubmit-controls (attested_basis) and inside the scan-completion cascade hop 3 (verified_basis); read back through GET /cyber/applications/{application_id}/control-posture"
    algorithm: weighted_scoring
    formula: |
      LEVEL_FACTOR = { NONE: 0.0, PARTIAL: 0.5, FULL: 1.0 }

      # basis = attested_basis
      level(control_key) = attestation.attested_level, or NONE when the application
                           has no ControlAttestation row for that control_key

      # basis = verified_basis  (requires a COMPLETED ExternalScan)
      latest_scan = the application's ExternalScan rows with status == COMPLETED,
                    ordered by completed_at DESC, then created_at DESC, take first
      observed(control_key) = the minimum observed_level among latest_scan.findings
                              entries for that control_key, ordered NONE < PARTIAL < FULL;
                              FULL when latest_scan.findings has no entry for it
      level(control_key) = min(attested_level, observed(control_key)) on the same
                           NONE < PARTIAL < FULL ordering

      numerator   = SUM over every ControlRequirement row of
                    (requirement.weight * LEVEL_FACTOR[level(requirement.control_key)])
      denominator = SUM over every ControlRequirement row of requirement.weight
      score = round(100 * numerator / denominator, 2)

      mandatory_gap_control_keys = ControlRequirement rows with is_mandatory == true and
        LEVEL_FACTOR[level(control_key)] < LEVEL_FACTOR[min_level_required],
        ordered by weight DESC then control_key ASC
      mandatory_gap_count = length(mandatory_gap_control_keys)
    input_set: "Every ControlRequirement row in the catalog (the catalog has no status field, so there is no status filter); attestations are the ControlAttestation rows of this application only; observed levels come exclusively from the single latest COMPLETED ExternalScan of this application, ignoring FAILED and PENDING scans."
    constants:
      LEVEL_FACTOR_NONE: 0.0
      LEVEL_FACTOR_PARTIAL: 0.5
      LEVEL_FACTOR_FULL: 1.0
      MIN_SCORE_FOR_COVERAGE: 70
    precision: "score 2 decimal places, round_half_up; the division is performed once on exact weights, never on pre-rounded per-control contributions"
    variants:
      - name: attested_basis
        when: "Application.attested_control_score, written on attestation create, submit and resubmit-controls, and used by premium_quote for indicative_premium_usd"
        difference: "Uses attested_level directly and ignores every scan finding, so it never drops when a scan contradicts the applicant."
      - name: verified_basis
        when: "Application.verified_control_score, written by scan-completion cascade hop 3, and used by premium_quote for premium_usd and by the mandatory-gap gate"
        difference: "Uses min(attested_level, scan-observed level), so identical attestations yield a strictly lower or equal score and can expose mandatory gaps the attested basis hides."

  - name: premium_quote
    trigger: "POST /cyber/applications/{application_id}/submit (indicative_premium_usd, attested score) and POST /cyber/applications/{application_id}/quote (premium_usd, verified score)"
    algorithm: tiered_pricing
    formula: |
      base_rate         = BASE_RATE_PER_MILLION[insured.industry_code]
      revenue_factor    = 1.00 when insured.annual_revenue_usd <= 50000000
                          1.15 when 50000000 < annual_revenue_usd <= 250000000
                          1.35 when annual_revenue_usd > 250000000
      L                 = application.requested_aggregate_limit_usd / 1000000
      layer_units       = min(L, 1) * 1.00
                        + max(0, min(L, 5) - 1) * 0.60
                        + max(0, L - 5) * 0.35
      gross_premium     = round(base_rate * revenue_factor * layer_units, 2)

      control_modifier  = -0.15 when score >= 90
                          -0.05 when 75 <= score < 90
                          +0.10 when 70 <= score < 75
                          +0.30 when score < 70
      retention_modifier= -0.10 when requested_retention_usd >= 250000
                          -0.05 when 100000 <= requested_retention_usd < 250000
                           0.00 otherwise
      dependency_load   = 0.08 when insured.primary_dependency_key != NONE else 0.00
      modifier          = 1 + control_modifier + retention_modifier + dependency_load

      premium = max(round(gross_premium * modifier, 2), MIN_PREMIUM_USD)
    input_set: "One InsuredAccount and one Application; `score` is Application.attested_control_score for the indicative run and Application.verified_control_score for the quote run. No other entity participates."
    constants:
      BASE_RATE_PER_MILLION: { HEALTHCARE: 9000, FINANCIAL: 8000, RETAIL: 7000, MANUFACTURING: 6000, PUBLIC_SECTOR: 7500, TECHNOLOGY: 5500 }
      REVENUE_TIER_1_CEILING_USD: 50000000
      REVENUE_TIER_2_CEILING_USD: 250000000
      FIRST_MILLION_FACTOR: 1.00
      NEXT_FOUR_MILLION_FACTOR: 0.60
      EXCESS_LAYER_FACTOR: 0.35
      MIN_PREMIUM_USD: 7500.00
      MIN_AGGREGATE_LIMIT_USD: 250000
      LIMIT_INCREMENT_USD: 250000
      QUOTE_VALID_DAYS: 30
    precision: "gross_premium rounded to 2 decimals before the modifier is applied; the modified premium rounded to 2 decimals again, then floored at MIN_PREMIUM_USD (rounding precedes the floor)"
    variants:
      - name: indicative_run
        when: "POST /cyber/applications/{application_id}/submit"
        difference: "Feeds on attested_control_score, so the premium is issued before any scan can contradict the applicant."
      - name: bindable_run
        when: "POST /cyber/applications/{application_id}/quote"
        difference: "Feeds on verified_control_score; the two runs write different fields (indicative_premium_usd versus premium_usd) and diverge whenever a scan finding lowers the score across a modifier band."

  - name: bi_indemnity_quantification
    trigger: "POST /cyber/proofs-of-loss/{proof_id}/accept"
    algorithm: threshold
    formula: |
      eligible_section = the CoverageSection of the claim's policy selected by
        BI_SECTION_FOR_INCIDENT_TYPE[claim.incident_type], restricted to
        claim.covered_section_keys
      outage_hours      = round((claim.outage_end_at - claim.outage_start_at) / 3600, 2)
      compensable_hours = max(0, outage_hours - eligible_section.waiting_period_hours)

      hourly_revenue = proof.trailing_12m_revenue_usd / BASELINE_ANNUAL_HOURS
                       when baseline_method_applied == TRAILING_12M
                     = proof.prior_year_same_period_revenue_usd
                       / proof.prior_year_same_period_hours
                       when baseline_method_applied == SAME_PERIOD_PRIOR_YEAR

      # Pinned rounding order: each component is rounded to cents FIRST, then summed.
      bi_component_usd            = round(compensable_hours * hourly_revenue
                                          * proof.gross_profit_margin_pct, 2)
      mitigation_component_usd    = round(min(proof.mitigation_savings_usd,
                                              bi_component_usd), 2)
      extra_expense_component_usd = round(min(proof.extra_expense_usd,
                                              EXTRA_EXPENSE_CAP_PCT * bi_component_usd), 2)
      assessed_indemnity_usd      = round(bi_component_usd
                                          - mitigation_component_usd
                                          + extra_expense_component_usd, 2)
    input_set: "Exactly one ProofOfLoss (status UNDER_REVIEW), its IncidentClaim's outage window, and the single eligible CoverageSection named by BI_SECTION_FOR_INCIDENT_TYPE and present in claim.covered_section_keys. SUPERSEDED and ACCEPTED proofs of the same claim contribute nothing."
    constants:
      BASELINE_ANNUAL_HOURS: 8760
      EXTRA_EXPENSE_CAP_PCT: 0.25
      NOTIFICATION_DEADLINE_DAYS: 30
      MAX_PROOF_REVIEW_ROUNDS: 2
      BI_SECTION_FOR_INCIDENT_TYPE: { RANSOMWARE: BUSINESS_INTERRUPTION, SYSTEM_FAILURE: BUSINESS_INTERRUPTION, DEPENDENT_OUTAGE: DEPENDENT_BI, BEC: null, DATA_THEFT: null }
    precision: "2 decimal places, round_half_up, per component then summed. The extra-expense cap is computed from the ALREADY ROUNDED bi_component_usd, not from the raw product; summing raw components and rounding once at the end is explicitly wrong."
    variants:
      - name: trailing_12m_baseline
        when: "baseline_method_applied == TRAILING_12M, i.e. Policy.bi_baseline_method is TRAILING_12M and the accept call sends no override"
        difference: "Hourly revenue is a flat annual average (revenue / 8760), which smooths seasonality and usually produces the lower indemnity."
      - name: same_period_prior_year_baseline
        when: "baseline_method_applied == SAME_PERIOD_PRIOR_YEAR, i.e. Policy.bi_baseline_method is that value or the accept call sends baseline_method_override"
        difference: "Hourly revenue is taken from the matching prior-year window (prior_year_same_period_revenue_usd / prior_year_same_period_hours), so a seasonal peak raises every downstream component and the assessed indemnity."

  - name: tower_allocation_waterfall
    trigger: "Cascade hop 3 of POST /cyber/proofs-of-loss/{proof_id}/accept (loss_source PROOF_OF_LOSS) and the allocation step of POST /cyber/vendor-engagements/{engagement_id}/complete (loss_source VENDOR_ENGAGEMENT)"
    algorithm: waterfall_allocation
    formula: |
      loss_amount = proof.assessed_indemnity_usd            # PROOF_OF_LOSS
                  | engagement.incurred_amount_usd          # VENDOR_ENGAGEMENT
      eligible_keys = (BI_SECTION_FOR_INCIDENT_TYPE[claim.incident_type] as a one-element
                       list)                                # PROOF_OF_LOSS
                    | SECTIONS_FOR_VENDOR_TYPE[engagement.vendor_type]  # VENDOR_ENGAGEMENT
      eligible_keys = eligible_keys INTERSECT claim.covered_section_keys
      if eligible_keys is empty -> ERR_NO_ELIGIBLE_COVERAGE_SECTION

      # Step 1 - retention, once per claim, off the top, before any section is touched
      retention_left = max(0, policy.retention_usd - claim.retention_absorbed_usd)
      absorbed       = round(min(retention_left, loss_amount), 2)
      claim.retention_absorbed_usd += absorbed
      remaining      = round(loss_amount - absorbed, 2)

      # Step 2 - per-section waterfall
      sections = CoverageSection rows of the policy whose section_key is in eligible_keys,
                 ordered by erosion_priority ASC, tie-break created_at ASC
      first_row = true
      for section in sections:
        if remaining <= 0: break
        allocated_loss = round(min(remaining, section.sublimit_remaining_usd), 2)
        if allocated_loss <= 0: continue
        coinsurance    = round(allocated_loss * section.coinsurance_pct, 2)
        payable        = round(allocated_loss - coinsurance, 2)
        net_paid       = round(min(payable, policy.aggregate_limit_remaining_usd), 2)
        create ClaimPayment{
          gross_amount_usd: allocated_loss,
          retention_applied_usd: absorbed if first_row else 0.00,
          coinsurance_deduction_usd: coinsurance,
          net_paid_usd: net_paid, payment_status: POSTED }
        section.sublimit_remaining_usd  -= allocated_loss
        policy.aggregate_limit_remaining_usd -= net_paid
        claim.paid_total_usd += net_paid
        remaining -= allocated_loss
        first_row = false

      # Step 3 - leftovers and posture
      claim.unallocated_loss_usd += remaining
      policy.limit_status = INTACT when aggregate_limit_remaining_usd == aggregate_limit_usd
                          | EXHAUSTED when aggregate_limit_remaining_usd == 0
                          | PARTIALLY_ERODED otherwise
    input_set: "One IncidentClaim, its Policy, and the Policy's CoverageSection rows whose section_key survives the eligible_keys intersection. Sections with sublimit_remaining_usd == 0.00 are skipped without producing a zero-value ClaimPayment row. Payments already REVERSED do not re-enter the ledger."
    constants:
      SECTIONS_FOR_VENDOR_TYPE: { FORENSICS: [FIRST_PARTY_RESPONSE], NOTIFICATION: [FIRST_PARTY_RESPONSE], PR_CRISIS: [FIRST_PARTY_RESPONSE], LEGAL_COUNSEL: [FIRST_PARTY_RESPONSE, THIRD_PARTY_LIABILITY], RANSOM_NEGOTIATION: [CYBER_EXTORTION] }
    precision: "Every intermediate (absorbed, allocated_loss, coinsurance, payable, net_paid) rounded to 2 decimals as written, in that order; the retention deduction precedes coinsurance, coinsurance precedes the sublimit cap, and the sublimit cap precedes the aggregate cap."

  - name: policy_loss_ratio
    trigger: "GET /cyber/policies/{policy_id}/loss-summary and inside renewal_premium_adjustment"
    algorithm: aggregation
    formula: |
      paid_total_usd = SUM of ClaimPayment.net_paid_usd over payments whose
        payment_status == POSTED and whose IncidentClaim.policy_id == policy.id
      outstanding_reserve_usd = SUM of IncidentClaim.reserved_amount_usd over claims whose
        policy_id == policy.id and status NOT IN {SETTLED, DENIED, CLOSED_NO_COVERAGE}
      incurred_usd = round(paid_total_usd + outstanding_reserve_usd, 2)
      loss_ratio   = round(incurred_usd / policy.premium_usd, 4)
    input_set: "All IncidentClaim rows of the policy regardless of notification date; payments filtered to payment_status == POSTED (REVERSED excluded); reserves filtered to non-terminal claims. The window is the whole policy, not a calendar period, and the sum is order-insensitive so no tie-break is required."
    constants:
      RESERVE_EXCLUDED_CLAIM_STATES: [SETTLED, DENIED, CLOSED_NO_COVERAGE]
    precision: "money 2 decimals round_half_up; loss_ratio 4 decimals round_half_up"

  - name: renewal_premium_adjustment
    trigger: "POST /cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned because the control credit is capped as a share of the
      # very premium the credit reduces. Compute the pre-credit premium FIRST, cap the
      # credit against that figure, and only then subtract - never iterate to a fixed point.
      earned_premium = policy.premium_usd
      loss_ratio     = policy_loss_ratio(policy)                     # step 1
      tier_pct       = -0.05 when loss_ratio <= 0.30
                       +0.05 when 0.30 < loss_ratio <= 0.60
                       +0.20 when 0.60 < loss_ratio <= 1.00
                       +0.45 when loss_ratio > 1.00                  # step 2
      aggregation_load_pct = 0.10 when policy.aggregation_flagged else 0.00
      pre_credit_premium = round(earned_premium
                                 * (1 + tier_pct + aggregation_load_pct), 2)   # step 3
      raw_credit = length(assessment.verified_control_keys)
                   * CREDIT_PER_REMEDIATED_CONTROL_USD                          # step 4
      credit     = round(min(raw_credit,
                             CONTROL_CREDIT_CAP_PCT * pre_credit_premium), 2)   # step 5
      renewal_premium_usd   = max(round(pre_credit_premium - credit, 2),
                                  MIN_PREMIUM_USD)                              # step 6
      premium_adjustment_pct = round((renewal_premium_usd - earned_premium)
                                     / earned_premium, 4)                       # step 7
    input_set: "One Policy (its premium_usd is the earned premium and is never zero because premium_quote floors at MIN_PREMIUM_USD), the policy_loss_ratio inputs, and the assessment's verified_control_keys array. Controls the insured submitted but the Underwriter did not verify earn no credit."
    constants:
      LOSS_RATIO_TIER_1_CEILING: 0.30
      LOSS_RATIO_TIER_2_CEILING: 0.60
      LOSS_RATIO_TIER_3_CEILING: 1.00
      TIER_1_ADJUSTMENT_PCT: -0.05
      TIER_2_ADJUSTMENT_PCT: 0.05
      TIER_3_ADJUSTMENT_PCT: 0.20
      TIER_4_ADJUSTMENT_PCT: 0.45
      AGGREGATION_LOAD_PCT: 0.10
      CREDIT_PER_REMEDIATED_CONTROL_USD: 750
      CONTROL_CREDIT_CAP_PCT: 0.12
      MIN_PREMIUM_USD: 7500.00
      RENEWAL_WINDOW_DAYS: 90
      MAX_VERIFICATION_ROUNDS: 2
    precision: "pre_credit_premium and credit each rounded to 2 decimals before the subtraction; the cap uses the rounded pre_credit_premium; premium_adjustment_pct rounded to 4 decimals"

  - name: panel_vendor_selection
    trigger: "POST /cyber/incident-claims/{claim_id}/vendor-engagements when panel_vendor_id is omitted"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter
      candidates = PanelVendor rows where
        vendor_type == request.vendor_type
        AND status == ACTIVE
        AND insured.industry_code IN specialty_sectors
        AND colliding_count(vendor, request window) < capacity_concurrent_engagements
      where colliding_count(vendor, W) = number of VendorEngagement rows on that vendor
        with status IN {AUTHORIZED, ACTIVE} whose buffered window
        [deployment_start_at, deployment_end_at + CHANGEOVER_BUFFER_HOURS]
        intersects W = [request.deployment_start_at, request.deployment_end_at]
        treating both intervals as CLOSED (shared endpoints collide)

      # (b) ranking expression, (c) tie-break
      winner = candidates ordered by tier ASC,
               then pre_approved_hourly_rate_usd ASC,
               then created_at ASC
               take first

      # (d) empty-pool fallback
      if candidates is empty -> ERR_NO_ELIGIBLE_PANEL_VENDOR (422)

      engagement.panel_vendor_id = winner.id
      engagement.selection_mode  = PANEL_SELECTED
      engagement.approved_rate_usd = winner.pre_approved_hourly_rate_usd
      engagement.approved_per_record_rate_usd = winner.per_record_notification_rate_usd
    input_set: "PanelVendor rows only; SUSPENDED and RETIRED firms are excluded, as are firms whose buffered engagement windows already fill capacity at the requested window. The insured's industry_code comes from the claim's Policy."
    constants:
      CHANGEOVER_BUFFER_HOURS: 24
    precision: "Not a money calculation. Ranking is over tier, rate and created_at only; PanelVendor.id never participates in the ordering."

  - name: engagement_incurred_amount
    trigger: "POST /cyber/vendor-engagements/{engagement_id}/log-hours"
    algorithm: aggregation
    formula: |
      incurred_hours   = previous incurred_hours + request.hours
      records_notified = previous records_notified + request.records_notified
      incurred_amount_usd = round(incurred_hours * approved_rate_usd, 2)
                          + round(records_notified * approved_per_record_rate_usd, 2)
    input_set: "One VendorEngagement; the rates are the values pinned on the engagement at authorization, never the PanelVendor's current values."
    constants: {}
    precision: "Each of the two terms rounded to 2 decimals independently, then summed (round-then-sum, not sum-then-round). The recomputation is done from the cumulative totals, not by adding per-call increments of the money value."

  - name: systemic_aggregation_model
    trigger: "POST /cyber/systemic-scenarios/{scenario_id}/model"
    algorithm: aggregation
    formula: |
      included = Policy rows where
        lifecycle_status == INFORCE
        AND period_start <= clock_now < period_end
        AND InsuredAccount(policy.insured_account_id).primary_dependency_key
            == scenario.dependency_key
        AND policy.dependent_bi_definition IN scenario.qualifying_definitions
        AND a CoverageSection with section_key == DEPENDENT_BI exists on the policy
      ordered by Policy.created_at ASC   # sum is order-insensitive; order pinned anyway

      gross = 0
      for policy in included:
        dbi   = the policy's DEPENDENT_BI CoverageSection
        hourly = InsuredAccount.annual_revenue_usd / BASELINE_ANNUAL_HOURS
        compensable = max(0, scenario.assumed_outage_hours - dbi.waiting_period_hours)
        modeled_loss = round(compensable * hourly * MODELED_MARGIN_PCT, 2)
        section_exposure = round(min(modeled_loss, dbi.sublimit_remaining_usd), 2)
        after_retention  = max(0, round(section_exposure - policy.retention_usd, 2))
        modeled_paid = round(min(round(after_retention * (1 - dbi.coinsurance_pct), 2),
                                 policy.aggregate_limit_remaining_usd), 2)
        gross += modeled_paid                       # already-rounded per-policy figures

      modeled_policy_count       = length(included)
      modeled_gross_exposure_usd = round(gross * scenario.footprint_pct, 2)
      capacity_breached          = modeled_gross_exposure_usd
                                   > scenario.portfolio_capacity_usd     # strict
    input_set: "In-force policies only, evaluated at the current logical clock instant; CANCELLED, EXPIRED and NON_RENEWED policies are excluded even when their period covers the instant, and policies whose dependent_bi_definition is outside qualifying_definitions are excluded. Erosion already suffered is respected because sublimit_remaining_usd and aggregate_limit_remaining_usd are used, not the original limits."
    constants:
      BASELINE_ANNUAL_HOURS: 8760
      MODELED_MARGIN_PCT: 0.60
    precision: "Per-policy modeled_paid rounded to 2 decimals and summed; footprint_pct applied ONCE to the summed figure and the product rounded again. Applying footprint_pct per policy before summing is explicitly wrong."

validations:
  - priority: 1
    category: auth
    rule: "Every endpoint except POST /cyber/_clock/set_current_utc requires both X-User-ID and X-User-Role headers to be present and non-empty; a missing or blank header is rejected before any body parsing."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /cyber/_clock/set_current_utc"
  - priority: 2
    category: rbac
    rule: "X-User-Role must be one of Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured, and must be permitted for the endpoint per §1.7. Checked before any path id is resolved, so an unauthorized role on a non-existent id still yields 403."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints except POST /cyber/_clock/set_current_utc"
  - priority: 3
    category: existence
    rule: "Every id appearing in the URL path must resolve to an existing row, resolved left to right (outer segment first): insured_account_id, application_id, scan_id, policy_id, claim_id, engagement_id, proof_id, payment_id, assessment_id, scenario_id, vendor_id."
    error_id: "ERR_INSURED_ACCOUNT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_EXTERNAL_SCAN_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_INCIDENT_CLAIM_NOT_FOUND | ERR_VENDOR_ENGAGEMENT_NOT_FOUND | ERR_PROOF_OF_LOSS_NOT_FOUND | ERR_CLAIM_PAYMENT_NOT_FOUND | ERR_RENEWAL_ASSESSMENT_NOT_FOUND | ERR_SYSTEMIC_SCENARIO_NOT_FOUND | ERR_PANEL_VENDOR_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 4
    category: ownership
    rule: "A caller with role Insured may only read or write rows whose owning InsuredAccount.id equals the caller's bound account id (Application.insured_account_id, Policy.insured_account_id, and transitively for CoverageSection, IncidentClaim, VendorEngagement, ProofOfLoss, ClaimPayment and RenewalAssessment). Ownership is checked after existence so a foreign row is 403, not 404."
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose shared_operations include Insured"
  - priority: 5
    category: rbac
    rule: "Segregation of duties. (a) POST /cyber/applications/{application_id}/bind is rejected when X-User-ID equals Application.quoted_by_user_id. (b) POST /cyber/proofs-of-loss/{proof_id}/accept is rejected when X-User-ID appears as authorized_by_user_id on any VendorEngagement of the same IncidentClaim."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cyber/applications/{application_id}/bind, POST /cyber/proofs-of-loss/{proof_id}/accept"
  - priority: 6
    category: existence
    rule: "Every id or key supplied in the request BODY must resolve: Application.insured_account_id, Policy.application_id, IncidentClaim.policy_id, IncidentClaim.systemic_event_scenario_id, VendorEngagement.panel_vendor_id when explicitly directed, and every covered_section_keys entry on coverage confirmation must name a section_key present in the claim's policy tower -> ERR_COVERAGE_SECTION_NOT_FOUND."
    error_id: "ERR_INSURED_ACCOUNT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_SYSTEMIC_SCENARIO_NOT_FOUND | ERR_PANEL_VENDOR_NOT_FOUND | ERR_COVERAGE_SECTION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /cyber/applications, POST /cyber/incident-claims, POST /cyber/incident-claims/{claim_id}/vendor-engagements, POST /cyber/incident-claims/{claim_id}/confirm-coverage"
  - priority: 7
    category: schema
    rule: "Required fields present; enum values within their declared domain; numeric fields non-negative; monetary fields at most 2 decimals; ratio fields (coinsurance_pct <= 0.50, gross_profit_margin_pct <= 1.00, footprint_pct <= 1.00) inside range; timestamps ISO-8601 UTC; interval fields ordered (period_start < period_end, outage_start_at < outage_end_at, deployment_start_at < deployment_end_at); waiting_period_hours > 0 and required for section_key in {BUSINESS_INTERRUPTION, DEPENDENT_BI} and must be null for every other section_key; requested_aggregate_limit_usd >= MIN_AGGREGATE_LIMIT_USD."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 8
    category: concurrency
    rule: "When the request carries the OCC field declared in §1.2.1 (expected_application_version on quote and bind, expected_claim_version on proof-of-loss submission, expected_policy_version on renewal quote issuance), the value must equal the parent row's current version."
    error_id: "ERR_STALE_APPLICATION_VERSION | ERR_STALE_CLAIM_VERSION | ERR_STALE_POLICY_VERSION"
    http_status: 412
    applies_to: "POST /cyber/applications/{application_id}/quote, POST /cyber/applications/{application_id}/bind, POST /cyber/incident-claims/{claim_id}/proofs-of-loss, POST /cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
  - priority: 9
    category: state
    rule: "The target row must be in a state from which the requested transition is declared in §1.2. Terminal states admit no transition at all."
    error_id: "ERR_INVALID_APPLICATION_STATE | ERR_INVALID_SCAN_STATE | ERR_INVALID_POLICY_STATE | ERR_INVALID_CLAIM_STATE | ERR_INVALID_ENGAGEMENT_STATE | ERR_INVALID_PROOF_STATE | ERR_INVALID_PAYMENT_STATE | ERR_INVALID_ASSESSMENT_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 10
    category: cross_entity_state
    rule: "States of OTHER entities gate the write: creating an IncidentClaim requires the Policy in lifecycle_status INFORCE and limit_status != EXHAUSTED; authorizing a VendorEngagement requires the claim in COVERAGE_CONFIRMED or RESPONSE_ACTIVE and, when panel_vendor_id is directed, that PanelVendor in status ACTIVE; submitting a ProofOfLoss requires the claim in COVERAGE_CONFIRMED, RESPONSE_ACTIVE, PROOF_REVIEW or INFO_REQUESTED, so a claim that never needed a panel vendor can still file; opening a RenewalAssessment requires the Policy in lifecycle_status INFORCE."
    error_id: "ERR_INVALID_POLICY_STATE | ERR_INVALID_CLAIM_STATE | ERR_VENDOR_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /cyber/incident-claims, POST /cyber/incident-claims/{claim_id}/vendor-engagements, POST /cyber/incident-claims/{claim_id}/proofs-of-loss, POST /cyber/policies/{policy_id}/renewal-assessments"
  - priority: 11
    category: business_safety
    rule: "Control-based coverage gates, evaluated in this internal order: (a) quoting requires the application's latest ExternalScan by created_at DESC to have status COMPLETED, so a newer PENDING or FAILED scan blocks the quote even when an earlier scan completed -> ERR_SCAN_NOT_COMPLETED; (b) the verified-basis mandatory gap is RECOMPUTED at quote time against the ControlRequirement catalog as it stands in that request, so a mandatory control added to the catalog after the scan completed blocks the quote even though the stored mandatory_gap_count is 0, and the recomputed count must be 0 -> ERR_MANDATORY_CONTROL_GAP; (c) verified_control_score must be >= MIN_SCORE_FOR_COVERAGE (70) -> ERR_CONTROL_SCORE_BELOW_MINIMUM; (d) confirming coverage on a claim, and issuing a renewal quote, are refused when the Policy's warranty_status is LAPSED -> ERR_MANDATORY_CONTROL_LAPSE; (e) submitting or resubmitting an application requires a ControlAttestation row for every ControlRequirement whose is_mandatory is true -> ERR_MANDATORY_ATTESTATION_MISSING."
    error_id: "ERR_SCAN_NOT_COMPLETED | ERR_MANDATORY_CONTROL_GAP | ERR_CONTROL_SCORE_BELOW_MINIMUM | ERR_MANDATORY_CONTROL_LAPSE | ERR_MANDATORY_ATTESTATION_MISSING"
    http_status: 422
    applies_to: "POST /cyber/applications/{application_id}/quote, POST /cyber/incident-claims/{claim_id}/confirm-coverage, POST /cyber/applications/{application_id}/submit, POST /cyber/applications/{application_id}/resubmit-controls, POST /cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
  - priority: 12
    category: business_temporal
    rule: "Clock-relative gates: (a) incident_discovered_at must satisfy period_start <= incident_discovered_at < period_end of the policy -> ERR_INCIDENT_OUTSIDE_POLICY_PERIOD; (b) notified_at - incident_discovered_at must be <= NOTIFICATION_DEADLINE_DAYS (30) -> ERR_LATE_NOTIFICATION; (c) submitting or accepting a proof requires compensable_hours > 0 for the eligible BI section -> ERR_WAITING_PERIOD_NOT_SATISFIED; (d) a RenewalAssessment may only be opened when clock_now >= period_end - RENEWAL_WINDOW_DAYS (90) -> ERR_RENEWAL_WINDOW_NOT_OPEN; (e) binding at or after Application.quote_expires_at -> ERR_QUOTE_EXPIRED."
    error_id: "ERR_INCIDENT_OUTSIDE_POLICY_PERIOD | ERR_LATE_NOTIFICATION | ERR_WAITING_PERIOD_NOT_SATISFIED | ERR_RENEWAL_WINDOW_NOT_OPEN | ERR_QUOTE_EXPIRED"
    http_status: 422
    applies_to: "POST /cyber/incident-claims, POST /cyber/incident-claims/{claim_id}/proofs-of-loss, POST /cyber/proofs-of-loss/{proof_id}/accept, POST /cyber/policies/{policy_id}/renewal-assessments, POST /cyber/applications/{application_id}/bind"
  - priority: 13
    category: business_referential
    rule: "Coverage-shape gates: (a) an incident_type of DEPENDENT_OUTAGE requires a DEPENDENT_BI CoverageSection on the policy AND claim.dependency_key present in policy.named_dependency_keys when policy.dependent_bi_definition is NAMED_ONLY -> ERR_DEPENDENT_BI_NOT_COVERED; (b) any allocation whose eligible_keys intersection with claim.covered_section_keys is empty -> ERR_NO_ELIGIBLE_COVERAGE_SECTION."
    error_id: "ERR_DEPENDENT_BI_NOT_COVERED | ERR_NO_ELIGIBLE_COVERAGE_SECTION"
    http_status: 422
    applies_to: "POST /cyber/incident-claims, POST /cyber/proofs-of-loss/{proof_id}/accept, POST /cyber/vendor-engagements/{engagement_id}/complete"
  - priority: 14
    category: business_constraint
    rule: "Structural and overlap constraints: (a) binding is refused when the new policy period [period_start, period_end) overlaps an existing INFORCE Policy of the same InsuredAccount (half-open, so a period starting exactly at an incumbent's period_end is allowed) -> ERR_POLICY_PERIOD_OVERLAP; (b) a second ControlAttestation for the same (application_id, control_key) -> ERR_DUPLICATE_ATTESTATION; (c) the tower must contain a FIRST_PARTY_RESPONSE section and unique erosion_priority values per policy -> ERR_INVALID_TOWER_STRUCTURE; (d) a directed VendorEngagement whose buffered window collision count on that PanelVendor reaches capacity_concurrent_engagements -> ERR_VENDOR_WINDOW_CONFLICT; (e) panel selection with an empty candidate pool -> ERR_NO_ELIGIBLE_PANEL_VENDOR."
    error_id: "ERR_POLICY_PERIOD_OVERLAP | ERR_DUPLICATE_ATTESTATION | ERR_INVALID_TOWER_STRUCTURE | ERR_VENDOR_WINDOW_CONFLICT | ERR_NO_ELIGIBLE_PANEL_VENDOR"
    http_status: 422
    applies_to: "POST /cyber/applications/{application_id}/bind, POST /cyber/applications/{application_id}/control-attestations, POST /cyber/incident-claims/{claim_id}/vendor-engagements"
  - priority: 15
    category: business_fiscal
    rule: "Money and limit constraints, checked last: (a) a directed engagement rate above the vendor's pre_approved_hourly_rate_usd -> ERR_RATE_EXCEEDS_PRE_APPROVED; (b) cumulative incurred_hours above authorized_hours_cap -> ERR_AUTHORIZED_HOURS_EXCEEDED; (c) SUM of CoverageSection.sublimit_usd for BUSINESS_INTERRUPTION and DEPENDENT_BI each above aggregate_limit_usd, or any single sublimit_usd above aggregate_limit_usd -> ERR_SUBLIMIT_EXCEEDS_AGGREGATE; (d) requested_aggregate_limit_usd not a whole multiple of LIMIT_INCREMENT_USD (250000) -> ERR_INVALID_LIMIT_INCREMENT; (e) authorizing an engagement or accepting a proof on a policy whose aggregate_limit_remaining_usd is 0.00 -> ERR_AGGREGATE_LIMIT_EXHAUSTED."
    error_id: "ERR_RATE_EXCEEDS_PRE_APPROVED | ERR_AUTHORIZED_HOURS_EXCEEDED | ERR_SUBLIMIT_EXCEEDS_AGGREGATE | ERR_INVALID_LIMIT_INCREMENT | ERR_AGGREGATE_LIMIT_EXHAUSTED"
    http_status: 422
    applies_to: "POST /cyber/applications, POST /cyber/applications/{application_id}/bind, POST /cyber/incident-claims/{claim_id}/vendor-engagements, POST /cyber/vendor-engagements/{engagement_id}/log-hours, POST /cyber/proofs-of-loss/{proof_id}/accept"

endpoints:
  # ---------- catalog and panel administration ----------
  - method: POST
    path: "/cyber/control-requirements"
    description: "Add a control to the underwriting catalog. Immutable once created (no version field, no update endpoint)."
    roles: [Underwriter]
    code: 201
    input: [control_key, min_level_required, weight, "is_mandatory?", "remediation_grace_days?"]
    output: ControlRequirement
    side_effects: ["rejects a duplicate control_key with ERR_INVALID_REQUEST", "changes the denominator of control_posture_score for every future score computation"]
  - method: GET
    path: "/cyber/control-requirements"
    description: "List the control catalog ordered by weight DESC then control_key ASC."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured]
    code: 200
    input: ["is_mandatory?", "limit?", "offset?"]
    output: ControlRequirement[]
    side_effects: []
  - method: POST
    path: "/cyber/panel-vendors"
    description: "Empanel a response firm with pre-approved rates, sector specialisation, tier and concurrency capacity."
    roles: [PanelAdmin]
    code: 201
    input: [vendor_name, vendor_type, pre_approved_hourly_rate_usd, "per_record_notification_rate_usd?", specialty_sectors, tier, capacity_concurrent_engagements, "status?"]
    output: PanelVendor
    side_effects: ["enters the candidate pool used by panel_vendor_selection"]
  - method: PATCH
    path: "/cyber/panel-vendors/{vendor_id}"
    description: "Amend panel standing, pre-approved rates, tier, sectors or capacity. Never rewrites rates already pinned on an existing VendorEngagement."
    roles: [PanelAdmin]
    code: 200
    input: ["status?", "pre_approved_hourly_rate_usd?", "per_record_notification_rate_usd?", "specialty_sectors?", "tier?", "capacity_concurrent_engagements?"]
    output: PanelVendor
    side_effects: ["increments PanelVendor.version by 1", "changes future panel_vendor_selection eligibility and ranking without touching approved_rate_usd on existing engagements"]
  - method: GET
    path: "/cyber/panel-vendors"
    description: "List panel firms ordered by tier ASC, pre_approved_hourly_rate_usd ASC, created_at ASC — the same ordering panel_vendor_selection applies."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured]
    code: 200
    input: ["vendor_type?", "status?", "limit?", "offset?"]
    output: PanelVendor[]
    side_effects: []
  - method: GET
    path: "/cyber/panel-vendors/{vendor_id}"
    description: "Read one panel firm including its computed active_engagement_count."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured]
    code: 200
    input: []
    output: PanelVendor
    side_effects: []

  # ---------- insured accounts and applications ----------
  - method: POST
    path: "/cyber/insured-accounts"
    description: "Register a prospective insured. The returned id is what an Insured caller passes as X-User-ID."
    roles: [Underwriter]
    code: 201
    input: [legal_name, industry_code, annual_revenue_usd, record_count, "primary_dependency_key?"]
    output: InsuredAccount
    side_effects: []
  - method: GET
    path: "/cyber/insured-accounts/{insured_account_id}"
    description: "Read one insured account including open_remediation_count."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: InsuredAccount
    side_effects: []
  - method: GET
    path: "/cyber/insured-accounts"
    description: "List insured accounts ordered by created_at ASC."
    roles: [Underwriter, PortfolioActuary]
    code: 200
    input: ["industry_code?", "primary_dependency_key?", "limit?", "offset?"]
    output: InsuredAccount[]
    side_effects: []
  - method: POST
    path: "/cyber/applications"
    description: "Open a DRAFT application for coverage."
    roles: [Underwriter, Insured]
    code: 201
    input: [insured_account_id, requested_aggregate_limit_usd, requested_retention_usd, dependent_bi_definition]
    output: Application
    side_effects: ["rejects a requested_aggregate_limit_usd that is not a whole multiple of LIMIT_INCREMENT_USD with ERR_INVALID_LIMIT_INCREMENT"]
  - method: GET
    path: "/cyber/applications/{application_id}"
    description: "Read one application with both control scores, both premium figures and the mandatory-gap detail."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/cyber/applications"
    description: "List applications, filterable by owning account and status."
    roles: [Underwriter, PortfolioActuary, Insured]
    code: 200
    input: ["insured_account_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/cyber/applications/{application_id}/control-attestations"
    description: "Attest a control maturity level on a DRAFT application; recomputes attested_control_score."
    roles: [Underwriter, Insured]
    code: 201
    input: [control_key, attested_level]
    output: ControlAttestation
    side_effects: ["recomputes Application.attested_control_score via control_posture_score variant attested_basis", "increments Application.version by 1", "a second attestation for the same control_key is rejected with ERR_DUPLICATE_ATTESTATION"]
  - method: GET
    path: "/cyber/applications/{application_id}/control-attestations"
    description: "List the application's attestations ordered by control_key ASC, exposing verified_level once a scan has completed."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: ["limit?", "offset?"]
    output: ControlAttestation[]
    side_effects: []
  - method: GET
    path: "/cyber/control-attestations/{attestation_id}"
    description: "Read one attestation with its attested_level and, once a scan has completed, its verified_level."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: ControlAttestation
    side_effects: []
  - method: GET
    path: "/cyber/control-attestations"
    description: "Flat attestation search across applications, ordered by created_at ASC; the portfolio view of control posture."
    roles: [Underwriter, PortfolioActuary]
    code: 200
    input: ["application_id?", "control_key?", "limit?", "offset?"]
    output: ControlAttestation[]
    side_effects: []
  - method: GET
    path: "/cyber/applications/{application_id}/control-posture"
    description: "Computed read of both score variants side by side plus the mandatory-gap detail."
    roles: [Underwriter, PortfolioActuary, Insured]
    code: 200
    input: []
    output: "{ attested_score: number, verified_score: number, mandatory_gap_count: integer, mandatory_gap_control_keys: string[], min_score_for_coverage: number, quotable: boolean }"
    side_effects: []
  - method: POST
    path: "/cyber/applications/{application_id}/submit"
    description: "Submit the application for underwriting; prices the indicative premium off the attested score."
    roles: [Underwriter, Insured]
    code: 200
    input: []
    output: Application
    side_effects: ["Application.status DRAFT -> SUBMITTED", "recomputes attested_control_score and writes indicative_premium_usd via premium_quote variant indicative_run", "increments Application.version by 1"]
  - method: POST
    path: "/cyber/applications/{application_id}/resubmit-controls"
    description: "Re-attest the controls named in mandatory_gap_control_keys after remediation, returning the application to SUBMITTED."
    roles: [Underwriter, Insured]
    code: 200
    input: [attestations]
    output: Application
    side_effects: ["Application.status REMEDIATION_REQUIRED -> SUBMITTED", "resets verified_level to null on every attestation, clears verified_control_score, mandatory_gap_count and mandatory_gap_control_keys", "recomputes attested_control_score and indicative_premium_usd", "decrements InsuredAccount.open_remediation_count by 1 and increments InsuredAccount.version by 1", "increments Application.version by 1"]
  - method: POST
    path: "/cyber/applications/{application_id}/external-scans"
    description: "Order an external attack-surface scan on an application in SUBMITTED, UNDERWRITING or REMEDIATION_REQUIRED; the scan starts PENDING and drives no Application transition until it is completed."
    roles: [Underwriter]
    code: 201
    input: [scan_vendor_name, "scan_score?"]
    output: ExternalScan
    side_effects: []
  - method: GET
    path: "/cyber/applications/{application_id}/external-scans"
    description: "List the application's scans ordered by created_at ASC."
    roles: [Underwriter, PortfolioActuary, Insured]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExternalScan[]
    side_effects: []
  - method: GET
    path: "/cyber/external-scans/{scan_id}"
    description: "Read one external scan with its findings and critical_finding_count."
    roles: [Underwriter, PortfolioActuary, Insured]
    code: 200
    input: []
    output: ExternalScan
    side_effects: []
  - method: GET
    path: "/cyber/external-scans"
    description: "Flat scan search across applications, filterable by application and status, ordered by created_at ASC."
    roles: [Underwriter, PortfolioActuary]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: ExternalScan[]
    side_effects: []
  - method: POST
    path: "/cyber/external-scans/{scan_id}/complete"
    description: "Return the scan result. Outcome COMPLETED drives the four-hop verification cascade; outcome FAILED records completed_at and leaves the application in SUBMITTED."
    roles: [Underwriter]
    code: 200
    input: [outcome, "findings?", "scan_score?"]
    output: ExternalScan
    side_effects: ["ExternalScan.status PENDING -> COMPLETED or FAILED and completed_at = logical clock", "hop 2: rewrites ControlAttestation.verified_level to min(attested_level, observed_level) on every attestation of the application", "hop 3: recomputes Application.verified_control_score, mandatory_gap_count and mandatory_gap_control_keys and moves the application to UNDERWRITING", "hop 3b: when mandatory_gap_count > 0 the application moves to REMEDIATION_REQUIRED and premium_usd is cleared", "hop 4: increments InsuredAccount.open_remediation_count by 1 and InsuredAccount.version by 1", "increments ExternalScan.version by 1 and Application.version by 1"]
  - method: POST
    path: "/cyber/applications/{application_id}/quote"
    description: "Issue or supersede a bindable quote priced off the verified score. Guarded by OCC rule quote-issue-stale-application."
    roles: [Underwriter]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects: ["Application.status UNDERWRITING -> QUOTED, or QUOTED -> QUOTED on supersede", "writes premium_usd via premium_quote variant bindable_run, quoted_by_user_id = X-User-ID and quote_expires_at = clock now + QUOTE_VALID_DAYS", "increments Application.version by 1"]
  - method: POST
    path: "/cyber/applications/{application_id}/decline"
    description: "Decline the risk, clearing any live quote."
    roles: [Underwriter]
    code: 200
    input: [declined_reason]
    output: Application
    side_effects: ["Application.status -> DECLINED and premium_usd = null", "decrements InsuredAccount.open_remediation_count by 1 when the application was in REMEDIATION_REQUIRED", "increments Application.version by 1"]
  - method: POST
    path: "/cyber/applications/{application_id}/bind"
    description: "Bind the quoted application into a Policy with its coverage tower. Guarded by OCC rule bind-stale-application and by the quote-versus-bind segregation of duties rule."
    roles: [Underwriter]
    code: 201
    input: [expected_application_version, period_start, period_end, bi_baseline_method, coverage_sections, "named_dependency_keys?"]
    output: Policy
    side_effects: ["Application.status QUOTED -> BOUND", "creates the Policy in lifecycle_status INFORCE / limit_status INTACT with aggregate_limit_remaining_usd = aggregate_limit_usd", "creates one CoverageSection per coverage_sections entry with sublimit_remaining_usd = sublimit_usd", "pins Policy.warranty_control_keys to the current mandatory catalog keys and sets warranty_status COMPLIANT", "increments Application.version by 1"]

  # ---------- policies and coverage towers ----------
  - method: GET
    path: "/cyber/policies/{policy_id}"
    description: "Read one policy with both state dimensions, remaining aggregate and warranty posture."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/cyber/policies"
    description: "List policies, filterable by owning account, originating application and either state dimension."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: ["insured_account_id?", "application_id?", "lifecycle_status?", "limit_status?", "warranty_status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/cyber/policies/{policy_id}/coverage-sections"
    description: "List the tower ordered by erosion_priority ASC — the exact order tower_allocation_waterfall walks."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: ["section_key?", "limit?", "offset?"]
    output: CoverageSection[]
    side_effects: []
  - method: GET
    path: "/cyber/coverage-sections/{section_id}"
    description: "Read one tower section with its sublimit, remaining sublimit, waiting period, coinsurance and erosion priority."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: CoverageSection
    side_effects: []
  - method: GET
    path: "/cyber/coverage-sections"
    description: "Flat tower-section search across policies, filterable by policy and section key, ordered by erosion_priority ASC."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary]
    code: 200
    input: ["policy_id?", "section_key?", "limit?", "offset?"]
    output: CoverageSection[]
    side_effects: []
  - method: GET
    path: "/cyber/policies/{policy_id}/loss-summary"
    description: "Computed read of the policy's paid, reserved and incurred figures with the policy_loss_ratio."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: "{ paid_total_usd: number, outstanding_reserve_usd: number, incurred_usd: number, loss_ratio: number, aggregate_limit_remaining_usd: number, limit_status: string }"
    side_effects: []
  - method: POST
    path: "/cyber/policies/{policy_id}/warranty-reports"
    description: "Record a mid-term warranty control report. Any reported control below its min_level_required puts the policy in warranty_status LAPSED, which blocks coverage confirmation and renewal quoting."
    roles: [Underwriter]
    code: 200
    input: [lapsed_control_keys]
    output: Policy
    side_effects: ["rewrites lapsed_warranty_control_keys (sorted control_key ASC) and warranty_status", "increments Policy.version by 1"]
  - method: POST
    path: "/cyber/policies/{policy_id}/cancel"
    description: "Cancel the policy mid-term, triggering the four-hop close-out cascade."
    roles: [Underwriter]
    code: 200
    input: [cancellation_reason]
    output: Policy
    side_effects: ["Policy.lifecycle_status INFORCE -> CANCELLED and cancelled_at = logical clock", "hop 2: every IncidentClaim in NOTIFIED, TRIAGE, COVERAGE_CONFIRMED or RESPONSE_ACTIVE moves to CLOSED_NO_COVERAGE with reserved_amount_usd = 0.00, while claims at PROOF_REVIEW or beyond are spared", "hop 3: their AUTHORIZED and ACTIVE VendorEngagement rows move to TERMINATED", "hop 4: PanelVendor.active_engagement_count decremented once per terminated engagement", "increments Policy.version by 1"]

  # ---------- incident intake and response ----------
  - method: POST
    path: "/cyber/incident-claims"
    description: "Notify an incident against an in-force policy; the claim opens in NOTIFIED with notified_at stamped from the logical clock."
    roles: [ClaimsAdjuster, Insured]
    code: 201
    input: [policy_id, incident_type, incident_discovered_at, "outage_start_at?", "outage_end_at?", "dependency_key?", "affected_record_count?", "systemic_event_scenario_id?"]
    output: IncidentClaim
    side_effects: ["rejects an incident_discovered_at outside [period_start, period_end) with ERR_INCIDENT_OUTSIDE_POLICY_PERIOD", "rejects a notification more than NOTIFICATION_DEADLINE_DAYS after discovery with ERR_LATE_NOTIFICATION"]
  - method: GET
    path: "/cyber/incident-claims/{claim_id}"
    description: "Read one claim with its retention, paid and unallocated figures and its proof_review_round."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: IncidentClaim
    side_effects: []
  - method: GET
    path: "/cyber/incident-claims"
    description: "List claims, filterable by responding policy, tagged systemic scenario and status."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: ["policy_id?", "systemic_event_scenario_id?", "status?", "incident_type?", "limit?", "offset?"]
    output: IncidentClaim[]
    side_effects: []
  - method: POST
    path: "/cyber/incident-claims/{claim_id}/triage"
    description: "Move the claim into triage."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: IncidentClaim
    side_effects: ["IncidentClaim.status NOTIFIED -> TRIAGE", "increments IncidentClaim.version by 1"]
  - method: POST
    path: "/cyber/incident-claims/{claim_id}/confirm-coverage"
    description: "Confirm which tower sections respond and set the case reserve. Blocked while the policy's warranty_status is LAPSED."
    roles: [ClaimsAdjuster]
    code: 200
    input: [covered_section_keys, initial_reserve_usd, "reservation_of_rights?"]
    output: IncidentClaim
    side_effects: ["IncidentClaim.status TRIAGE -> COVERAGE_CONFIRMED", "stores covered_section_keys and reservation_of_rights and sets reserved_amount_usd = initial_reserve_usd", "increments IncidentClaim.version by 1"]
  - method: POST
    path: "/cyber/incident-claims/{claim_id}/deny"
    description: "Deny the claim, zeroing the reserve and terminating live engagements."
    roles: [ClaimsAdjuster]
    code: 200
    input: [denial_reason]
    output: IncidentClaim
    side_effects: ["IncidentClaim.status -> DENIED with reserved_amount_usd = 0.00", "AUTHORIZED and ACTIVE engagements move to TERMINATED, decrementing PanelVendor.active_engagement_count", "increments IncidentClaim.version by 1"]
  - method: POST
    path: "/cyber/incident-claims/{claim_id}/vendor-engagements"
    description: "Authorize a panel deployment. Omit panel_vendor_id to let panel_vendor_selection pick the winner; supply it to direct a specific firm."
    roles: [ClaimsAdjuster]
    code: 201
    input: [vendor_type, deployment_start_at, deployment_end_at, authorized_hours_cap, "panel_vendor_id?", "directed_rate_usd?"]
    output: VendorEngagement
    side_effects: ["creates the VendorEngagement in status AUTHORIZED with selection_mode DIRECTED or PANEL_SELECTED", "pins approved_rate_usd and approved_per_record_rate_usd from the chosen PanelVendor and stamps authorized_by_user_id = X-User-ID", "increments PanelVendor.active_engagement_count by 1 and PanelVendor.version by 1", "IncidentClaim.status COVERAGE_CONFIRMED -> RESPONSE_ACTIVE and increments IncidentClaim.version by 1"]
  - method: GET
    path: "/cyber/vendor-engagements/{engagement_id}"
    description: "Read one engagement with its pinned rates and incurred figures."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []
  - method: GET
    path: "/cyber/vendor-engagements"
    description: "List engagements, filterable by claim, panel firm and status."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured]
    code: 200
    input: ["incident_claim_id?", "panel_vendor_id?", "vendor_type?", "status?", "limit?", "offset?"]
    output: VendorEngagement[]
    side_effects: []
  - method: POST
    path: "/cyber/vendor-engagements/{engagement_id}/log-hours"
    description: "Log incremental hours and notified records against the engagement; recomputes incurred_amount_usd from cumulative totals."
    roles: [ClaimsAdjuster]
    code: 200
    input: [hours, "records_notified?"]
    output: VendorEngagement
    side_effects: ["VendorEngagement.status AUTHORIZED -> ACTIVE on the first log, ACTIVE -> ACTIVE afterwards", "recomputes incurred_hours, records_notified and incurred_amount_usd via engagement_incurred_amount", "rejects cumulative hours above authorized_hours_cap with ERR_AUTHORIZED_HOURS_EXCEEDED", "increments VendorEngagement.version by 1"]
  - method: POST
    path: "/cyber/vendor-engagements/{engagement_id}/complete"
    description: "Close the engagement and allocate its incurred cost through the tower with loss_source VENDOR_ENGAGEMENT."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["VendorEngagement.status -> COMPLETED", "runs tower_allocation_waterfall over incurred_amount_usd against SECTIONS_FOR_VENDOR_TYPE, creating ClaimPayment rows with loss_source VENDOR_ENGAGEMENT", "updates CoverageSection.sublimit_remaining_usd, Policy.aggregate_limit_remaining_usd, Policy.limit_status and the claim's retention_absorbed_usd, paid_total_usd and unallocated_loss_usd", "decrements PanelVendor.active_engagement_count by 1 and increments PanelVendor.version by 1", "increments VendorEngagement.version by 1"]

  # ---------- proof of loss and payment ----------
  - method: POST
    path: "/cyber/incident-claims/{claim_id}/proofs-of-loss"
    description: "File or amend a proof of loss. Guarded by OCC rule proof-submit-stale-claim; an amendment supersedes the proof already under review."
    roles: [ClaimsAdjuster, Insured]
    code: 201
    input: [expected_claim_version, claimed_bi_loss_usd, trailing_12m_revenue_usd, prior_year_same_period_revenue_usd, prior_year_same_period_hours, gross_profit_margin_pct, "extra_expense_usd?", "mitigation_savings_usd?"]
    output: ProofOfLoss
    side_effects: ["creates the ProofOfLoss in UNDER_REVIEW and moves any prior UNDER_REVIEW or INFO_REQUESTED proof of the claim to SUPERSEDED", "IncidentClaim.status -> PROOF_REVIEW", "rejects a proof whose compensable_hours would be 0 with ERR_WAITING_PERIOD_NOT_SATISFIED", "increments IncidentClaim.version by 1"]
  - method: GET
    path: "/cyber/proofs-of-loss/{proof_id}"
    description: "Read one proof of loss with every quantification component."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: ProofOfLoss
    side_effects: []
  - method: GET
    path: "/cyber/proofs-of-loss"
    description: "List proofs of loss, filterable by claim and review status."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: ["incident_claim_id?", "status?", "limit?", "offset?"]
    output: ProofOfLoss[]
    side_effects: []
  - method: POST
    path: "/cyber/proofs-of-loss/{proof_id}/request-info"
    description: "Request further information on the proof. The round after MAX_PROOF_REVIEW_ROUNDS denies the claim instead of asking again."
    roles: [ClaimsAdjuster]
    code: 200
    input: [info_request_note]
    output: ProofOfLoss
    side_effects: ["ProofOfLoss.status UNDER_REVIEW -> INFO_REQUESTED and IncidentClaim.status PROOF_REVIEW -> INFO_REQUESTED", "increments IncidentClaim.proof_review_round by 1", "on the round past MAX_PROOF_REVIEW_ROUNDS the proof is SUPERSEDED and the claim is DENIED with denial_reason PROOF_INSUFFICIENT", "increments IncidentClaim.version by 1"]
  - method: POST
    path: "/cyber/proofs-of-loss/{proof_id}/accept"
    description: "Accept the proof, quantify the indemnity and allocate it through the tower. Subject to the response-versus-adjustment segregation of duties rule."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["baseline_method_override?"]
    output: ProofOfLoss
    side_effects: ["hop 1: ProofOfLoss.status -> ACCEPTED with baseline_method_applied, outage_hours, compensable_hours and every bi_indemnity_quantification component written", "hop 2: IncidentClaim.status PROOF_REVIEW -> APPROVED_FOR_PAYMENT", "hop 3: tower_allocation_waterfall creates one ClaimPayment per eroded section, updates retention_absorbed_usd, paid_total_usd and unallocated_loss_usd and settles the claim", "hop 4: CoverageSection.sublimit_remaining_usd and Policy.aggregate_limit_remaining_usd decremented and Policy.limit_status recomputed", "hops 5-6: on exhaustion every live VendorEngagement of the policy moves to TERMINATED and PanelVendor.active_engagement_count is decremented per engagement", "increments IncidentClaim.version by 1"]
  - method: GET
    path: "/cyber/claim-payments/{payment_id}"
    description: "Read one payment slice with its gross, retention, coinsurance and net figures."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: []
    output: ClaimPayment
    side_effects: []
  - method: GET
    path: "/cyber/claim-payments"
    description: "List payment slices ordered by created_at ASC, filterable by claim, eroded section and status. The only discovery channel for cascade-created payments."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, Insured]
    code: 200
    input: ["incident_claim_id?", "coverage_section_id?", "loss_source?", "payment_status?", "limit?", "offset?"]
    output: ClaimPayment[]
    side_effects: []
  - method: POST
    path: "/cyber/claim-payments/{payment_id}/reverse"
    description: "Reverse a posted payment slice, restoring sublimit and aggregate capacity and rolling the claim back out of SETTLED."
    roles: [ClaimsAdjuster]
    code: 200
    input: [reversal_reason]
    output: ClaimPayment
    side_effects: ["ClaimPayment.payment_status POSTED -> REVERSED", "restores CoverageSection.sublimit_remaining_usd by gross_amount_usd and Policy.aggregate_limit_remaining_usd by net_paid_usd, then recomputes Policy.limit_status", "decreases IncidentClaim.paid_total_usd and retention_absorbed_usd and resets unallocated_loss_usd to 0.00; a SETTLED claim returns to APPROVED_FOR_PAYMENT", "increments ClaimPayment.version, CoverageSection.version, Policy.version and IncidentClaim.version by 1"]

  # ---------- renewal ----------
  - method: POST
    path: "/cyber/policies/{policy_id}/renewal-assessments"
    description: "Open renewal conditions inside the RENEWAL_WINDOW_DAYS window. An empty required_control_keys array creates the assessment directly in CONDITIONS_MET."
    roles: [Underwriter]
    code: 201
    input: [required_control_keys, "remediation_due_at?"]
    output: RenewalAssessment
    side_effects: ["creates the assessment in CONDITIONS_ISSUED, or in CONDITIONS_MET when required_control_keys is empty", "rejects an assessment opened before period_end minus RENEWAL_WINDOW_DAYS with ERR_RENEWAL_WINDOW_NOT_OPEN"]
  - method: GET
    path: "/cyber/renewal-assessments/{assessment_id}"
    description: "Read one renewal assessment with its loss_ratio, renewal premium and adjustment percentage."
    roles: [Underwriter, PortfolioActuary, Insured]
    code: 200
    input: []
    output: RenewalAssessment
    side_effects: []
  - method: GET
    path: "/cyber/renewal-assessments"
    description: "List renewal assessments, filterable by expiring policy and status."
    roles: [Underwriter, PortfolioActuary, Insured]
    code: 200
    input: ["policy_id?", "status?", "limit?", "offset?"]
    output: RenewalAssessment[]
    side_effects: []
  - method: POST
    path: "/cyber/renewal-assessments/{assessment_id}/submit-remediation"
    description: "Submit remediation evidence for a subset of the required controls."
    roles: [Insured, Underwriter]
    code: 200
    input: [submitted_control_keys]
    output: RenewalAssessment
    side_effects: ["RenewalAssessment.status CONDITIONS_ISSUED -> REMEDIATION_SUBMITTED and submitted_control_keys stored", "increments RenewalAssessment.version by 1"]
  - method: POST
    path: "/cyber/renewal-assessments/{assessment_id}/verify-remediation"
    description: "Verify the submitted evidence. Full coverage of required_control_keys reaches CONDITIONS_MET; a partial pass returns to CONDITIONS_ISSUED until MAX_VERIFICATION_ROUNDS is spent, after which the policy is non-renewed."
    roles: [Underwriter]
    code: 200
    input: [verified_control_keys]
    output: RenewalAssessment
    side_effects: ["merges verified_control_keys (sorted control_key ASC) and increments verification_round by 1", "status -> CONDITIONS_MET, back to CONDITIONS_ISSUED, or -> NON_RENEWED with non_renewal_reason CONDITIONS_NOT_MET", "on NON_RENEWED sets Policy.lifecycle_status = NON_RENEWED and increments Policy.version by 1", "increments RenewalAssessment.version by 1"]
  - method: POST
    path: "/cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
    description: "Price the renewal from the loss ratio, the aggregation load and the verified control credit. Guarded by OCC rule renewal-quote-stale-policy."
    roles: [PortfolioActuary]
    code: 200
    input: [expected_policy_version]
    output: RenewalAssessment
    side_effects: ["RenewalAssessment.status CONDITIONS_MET -> RENEWAL_QUOTED", "writes loss_ratio, renewal_premium_usd and premium_adjustment_pct via renewal_premium_adjustment", "increments Policy.version by 1", "increments RenewalAssessment.version by 1"]

  # ---------- portfolio aggregation ----------
  - method: POST
    path: "/cyber/systemic-scenarios"
    description: "Draft a systemic dependency-failure scenario with an assumed outage, an impact footprint and the portfolio capacity held for it."
    roles: [PortfolioActuary]
    code: 201
    input: [dependency_key, assumed_outage_hours, footprint_pct, portfolio_capacity_usd, qualifying_definitions]
    output: SystemicEventScenario
    side_effects: []
  - method: GET
    path: "/cyber/systemic-scenarios/{scenario_id}"
    description: "Read one scenario with its last modeled figures."
    roles: [Underwriter, PortfolioActuary]
    code: 200
    input: []
    output: SystemicEventScenario
    side_effects: []
  - method: GET
    path: "/cyber/systemic-scenarios"
    description: "List scenarios, filterable by dependency and modeling status."
    roles: [Underwriter, PortfolioActuary]
    code: 200
    input: ["dependency_key?", "status?", "limit?", "offset?"]
    output: SystemicEventScenario[]
    side_effects: []
  - method: POST
    path: "/cyber/systemic-scenarios/{scenario_id}/model"
    description: "Run or re-run the portfolio aggregation model at the current logical clock instant."
    roles: [PortfolioActuary]
    code: 200
    input: []
    output: SystemicEventScenario
    side_effects: ["writes modeled_policy_count, modeled_gross_exposure_usd, capacity_breached and modeled_at via systemic_aggregation_model", "on a breach sets aggregation_flagged = true on every included Policy and increments each Policy.version by 1", "increments SystemicEventScenario.version by 1"]

  # ---------- test-driving endpoints ----------
  - method: POST
    path: "/cyber/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every deadline, policy period, waiting period, renewal window and epoch decision reads this clock."
    roles: [Underwriter, ClaimsAdjuster, PortfolioActuary, PanelAdmin, Insured]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["moves the instant every temporal validation and epoch decision is evaluated against"]
  - method: POST
    path: "/cyber/_ops/run-epoch"
    description: "Advance the system epoch at the current logical clock instant: expire stale quotes, expire matured policies and non-renew assessments past their remediation deadline."
    roles: [Underwriter, PortfolioActuary]
    code: 200
    input: []
    output: "{ expired_application_count: integer, expired_policy_count: integer, non_renewed_assessment_count: integer, run_at: string }"
    side_effects: ["QUOTED applications past quote_expires_at move to EXPIRED with premium_usd cleared", "INFORCE policies at or past period_end move to lifecycle_status EXPIRED", "CONDITIONS_ISSUED assessments at or past remediation_due_at move to NON_RENEWED with non_renewal_reason REMEDIATION_DEADLINE_MISSED and set Policy.lifecycle_status = NON_RENEWED", "increments the version of every row it touches by 1"]

errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or blank on any endpoint other than POST /cyber/_clock/set_current_utc."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the endpoint's roles."
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "An Insured caller reads or writes a row whose owning InsuredAccount.id differs from the caller's X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The binder equals Application.quoted_by_user_id, or the proof accepter appears as authorized_by_user_id on a VendorEngagement of the same claim."
  # --- not found ---
  - id: ERR_INSURED_ACCOUNT_NOT_FOUND
    http: 404
    condition: "insured_account_id in the path or body matches no InsuredAccount."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application_id in the path or body matches no Application."
  - id: ERR_EXTERNAL_SCAN_NOT_FOUND
    http: 404
    condition: "scan_id matches no ExternalScan."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id in the path or body matches no Policy."
  - id: ERR_COVERAGE_SECTION_NOT_FOUND
    http: 404
    condition: "A covered_section_keys entry names a section_key that the claim's policy tower does not contain."
  - id: ERR_PANEL_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor_id in the path, or a directed panel_vendor_id in the body, matches no PanelVendor."
  - id: ERR_INCIDENT_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id matches no IncidentClaim."
  - id: ERR_VENDOR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id matches no VendorEngagement."
  - id: ERR_PROOF_OF_LOSS_NOT_FOUND
    http: 404
    condition: "proof_id matches no ProofOfLoss."
  - id: ERR_CLAIM_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment_id matches no ClaimPayment."
  - id: ERR_RENEWAL_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id matches no RenewalAssessment."
  - id: ERR_SYSTEMIC_SCENARIO_NOT_FOUND
    http: 404
    condition: "scenario_id in the path, or systemic_event_scenario_id in the body, matches no SystemicEventScenario."
  # --- schema ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, enum value outside its domain, negative money, more than 2 decimals on a money field, ratio outside range, unordered interval, waiting_period_hours supplied on a non-BI section or missing on a BI section, duplicate control_key in the catalog, or a findings array carrying two entries for one control_key."
  # --- concurrency ---
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal Application.version on quote or bind."
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal IncidentClaim.version on proof-of-loss submission."
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not equal Policy.version on renewal quote issuance."
  # --- state ---
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "The Application is not in a state from which the requested underwriting transition is declared."
  - id: ERR_INVALID_SCAN_STATE
    http: 409
    condition: "The ExternalScan is not PENDING when a result is returned."
  - id: ERR_INVALID_POLICY_STATE
    http: 409
    condition: "The Policy's lifecycle_status forbids the operation (notifying a claim on a non-INFORCE policy, cancelling twice, reversing a payment on a CANCELLED policy, opening a renewal assessment on a non-INFORCE policy)."
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "The IncidentClaim is not in a state from which the requested claim transition is declared, including any attempt to act on a terminal SETTLED, DENIED or CLOSED_NO_COVERAGE claim."
  - id: ERR_INVALID_ENGAGEMENT_STATE
    http: 409
    condition: "The VendorEngagement is COMPLETED or TERMINATED when hours are logged or completion is requested."
  - id: ERR_INVALID_PROOF_STATE
    http: 409
    condition: "The ProofOfLoss is not UNDER_REVIEW when information is requested or acceptance is attempted."
  - id: ERR_INVALID_PAYMENT_STATE
    http: 409
    condition: "The ClaimPayment is already REVERSED when reversal is requested."
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "The RenewalAssessment is not in a state from which the requested renewal transition is declared."
  - id: ERR_VENDOR_NOT_ACTIVE
    http: 409
    condition: "A directed panel_vendor_id names a PanelVendor whose status is SUSPENDED or RETIRED."
  # --- business safety ---
  - id: ERR_MANDATORY_ATTESTATION_MISSING
    http: 422
    condition: "Submission is attempted while some ControlRequirement with is_mandatory true has no ControlAttestation on the application."
  - id: ERR_SCAN_NOT_COMPLETED
    http: 422
    condition: "Quoting is attempted while the application's latest ExternalScan by created_at DESC is PENDING or FAILED."
  - id: ERR_MANDATORY_CONTROL_GAP
    http: 422
    condition: "Quoting is attempted while the mandatory gap recomputed at quote time against the current ControlRequirement catalog is greater than 0, which includes a mandatory control added to the catalog after the scan completed and therefore never attested."
  - id: ERR_CONTROL_SCORE_BELOW_MINIMUM
    http: 422
    condition: "Quoting is attempted with verified_control_score strictly below MIN_SCORE_FOR_COVERAGE, with no mandatory gap present."
  - id: ERR_MANDATORY_CONTROL_LAPSE
    http: 422
    condition: "Coverage confirmation or renewal quote issuance is attempted while the Policy's warranty_status is LAPSED."
  # --- business temporal ---
  - id: ERR_QUOTE_EXPIRED
    http: 422
    condition: "Binding is attempted at or after Application.quote_expires_at."
  - id: ERR_INCIDENT_OUTSIDE_POLICY_PERIOD
    http: 422
    condition: "incident_discovered_at falls outside the half-open policy period [period_start, period_end)."
  - id: ERR_LATE_NOTIFICATION
    http: 422
    condition: "The logical clock at notification is more than NOTIFICATION_DEADLINE_DAYS after incident_discovered_at."
  - id: ERR_WAITING_PERIOD_NOT_SATISFIED
    http: 422
    condition: "The outage window minus the eligible BI section's waiting_period_hours leaves compensable_hours of 0 or less."
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "A renewal assessment is opened before period_end minus RENEWAL_WINDOW_DAYS."
  # --- business referential ---
  - id: ERR_DEPENDENT_BI_NOT_COVERED
    http: 422
    condition: "A DEPENDENT_OUTAGE claim has no DEPENDENT_BI section, or its dependency_key is unscheduled while the policy's dependent_bi_definition is NAMED_ONLY."
  - id: ERR_NO_ELIGIBLE_COVERAGE_SECTION
    http: 422
    condition: "The eligible section keys for the loss source have an empty intersection with the claim's covered_section_keys."
  # --- business constraint ---
  - id: ERR_POLICY_PERIOD_OVERLAP
    http: 422
    condition: "The requested half-open policy period overlaps an existing INFORCE Policy of the same InsuredAccount."
  - id: ERR_DUPLICATE_ATTESTATION
    http: 422
    condition: "A second ControlAttestation is created for the same (application_id, control_key)."
  - id: ERR_INVALID_TOWER_STRUCTURE
    http: 422
    condition: "The requested tower omits FIRST_PARTY_RESPONSE, repeats a section_key, or repeats an erosion_priority."
  - id: ERR_VENDOR_WINDOW_CONFLICT
    http: 422
    condition: "A directed PanelVendor already has capacity_concurrent_engagements live engagements whose buffered windows intersect the requested deployment window."
  - id: ERR_NO_ELIGIBLE_PANEL_VENDOR
    http: 422
    condition: "Panel selection finds no ACTIVE firm of the requested vendor_type that is empanelled for the insured's industry_code and has buffered-window capacity."
  # --- business fiscal ---
  - id: ERR_INVALID_LIMIT_INCREMENT
    http: 422
    condition: "requested_aggregate_limit_usd is not a whole multiple of LIMIT_INCREMENT_USD."
  - id: ERR_SUBLIMIT_EXCEEDS_AGGREGATE
    http: 422
    condition: "A requested sublimit_usd exceeds the policy aggregate_limit_usd."
  - id: ERR_RATE_EXCEEDS_PRE_APPROVED
    http: 422
    condition: "directed_rate_usd on an engagement exceeds the PanelVendor's pre_approved_hourly_rate_usd."
  - id: ERR_AUTHORIZED_HOURS_EXCEEDED
    http: 422
    condition: "Cumulative incurred_hours after the log would exceed authorized_hours_cap."
  - id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http: 422
    condition: "An engagement authorization, coverage confirmation or proof acceptance is attempted on a policy whose aggregate_limit_remaining_usd is 0.00."

roles:
  - name: Underwriter
    description: "Owns the catalog, the risk assessment and the contract: scans, quotes, declines, binds, warranty reports, cancellation, renewal conditions and remediation verification."
    identity: "opaque"
    exclusive_operations:
      - "POST /cyber/control-requirements"
      - "POST /cyber/insured-accounts"
      - "POST /cyber/applications/{application_id}/external-scans"
      - "POST /cyber/external-scans/{scan_id}/complete"
      - "POST /cyber/applications/{application_id}/quote"
      - "POST /cyber/applications/{application_id}/decline"
      - "POST /cyber/applications/{application_id}/bind"
      - "POST /cyber/policies/{policy_id}/warranty-reports"
      - "POST /cyber/policies/{policy_id}/cancel"
      - "POST /cyber/policies/{policy_id}/renewal-assessments"
      - "POST /cyber/renewal-assessments/{assessment_id}/verify-remediation"
    shared_operations:
      - "POST /cyber/applications (with Insured)"
      - "POST /cyber/applications/{application_id}/control-attestations (with Insured)"
      - "POST /cyber/applications/{application_id}/submit (with Insured)"
      - "POST /cyber/applications/{application_id}/resubmit-controls (with Insured)"
      - "POST /cyber/renewal-assessments/{assessment_id}/submit-remediation (with Insured)"
      - "POST /cyber/_ops/run-epoch (with PortfolioActuary)"
      - "POST /cyber/_clock/set_current_utc (all roles)"
      - "every GET except GET /cyber/insured-accounts, which is shared with PortfolioActuary only"
  - name: ClaimsAdjuster
    description: "Owns the incident response and indemnity path: triage, coverage confirmation, denial, panel deployment, hour logging, proof review and payment reversal."
    identity: "opaque"
    exclusive_operations:
      - "POST /cyber/incident-claims/{claim_id}/triage"
      - "POST /cyber/incident-claims/{claim_id}/confirm-coverage"
      - "POST /cyber/incident-claims/{claim_id}/deny"
      - "POST /cyber/incident-claims/{claim_id}/vendor-engagements"
      - "POST /cyber/vendor-engagements/{engagement_id}/log-hours"
      - "POST /cyber/vendor-engagements/{engagement_id}/complete"
      - "POST /cyber/proofs-of-loss/{proof_id}/request-info"
      - "POST /cyber/proofs-of-loss/{proof_id}/accept"
      - "POST /cyber/claim-payments/{payment_id}/reverse"
    shared_operations:
      - "POST /cyber/incident-claims (with Insured)"
      - "POST /cyber/incident-claims/{claim_id}/proofs-of-loss (with Insured)"
      - "POST /cyber/_clock/set_current_utc (all roles)"
      - "claim-side and policy-side GETs"
  - name: PortfolioActuary
    description: "Owns portfolio aggregation and renewal pricing: drafts and runs systemic scenarios and issues the renewal quote."
    identity: "opaque"
    exclusive_operations:
      - "POST /cyber/systemic-scenarios"
      - "POST /cyber/systemic-scenarios/{scenario_id}/model"
      - "POST /cyber/renewal-assessments/{assessment_id}/issue-renewal-quote"
    shared_operations:
      - "POST /cyber/_ops/run-epoch (with Underwriter)"
      - "POST /cyber/_clock/set_current_utc (all roles)"
      - "GET /cyber/insured-accounts (with Underwriter)"
      - "portfolio, policy, claim and loss-summary GETs"
  - name: PanelAdmin
    description: "Owns the response panel: empanels firms, maintains pre-approved rates, tiers, sector specialisation and concurrency capacity."
    identity: "opaque"
    exclusive_operations:
      - "POST /cyber/panel-vendors"
      - "PATCH /cyber/panel-vendors/{vendor_id}"
    shared_operations:
      - "POST /cyber/_clock/set_current_utc (all roles)"
      - "GET /cyber/panel-vendors, GET /cyber/panel-vendors/{vendor_id}, GET /cyber/vendor-engagements and GET /cyber/vendor-engagements/{engagement_id}"
  - name: Insured
    description: "The policyholder acting on its own account: applies, attests controls, resubmits after remediation, notifies incidents, files proofs of loss and submits renewal remediation evidence. X-User-ID is the InsuredAccount.id."
    identity: "entity_backed:InsuredAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /cyber/applications (with Underwriter)"
      - "POST /cyber/applications/{application_id}/control-attestations (with Underwriter)"
      - "POST /cyber/applications/{application_id}/submit (with Underwriter)"
      - "POST /cyber/applications/{application_id}/resubmit-controls (with Underwriter)"
      - "POST /cyber/incident-claims (with ClaimsAdjuster)"
      - "POST /cyber/incident-claims/{claim_id}/proofs-of-loss (with ClaimsAdjuster)"
      - "POST /cyber/renewal-assessments/{assessment_id}/submit-remediation (with Underwriter)"
      - "POST /cyber/_clock/set_current_utc (all roles)"
      - "read access to its own applications, policies, towers, claims, engagements, proofs, payments and renewal assessments; every read of another account's row is ERR_ACCOUNT_SCOPE_VIOLATION. The flat portfolio searches GET /cyber/control-attestations, GET /cyber/external-scans and GET /cyber/coverage-sections are underwriting and actuarial views and are not exposed to the Insured, which reaches the same rows under its own parent (GET /cyber/applications/{application_id}/control-attestations, GET /cyber/applications/{application_id}/external-scans, GET /cyber/policies/{policy_id}/coverage-sections)"
