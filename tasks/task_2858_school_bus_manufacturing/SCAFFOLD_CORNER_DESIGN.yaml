      - name: campaign_launch_needs_a_forward_window_and_a_sufficient_kit_pool
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_BUILD_WINDOW]
          - errors[ERR_INSUFFICIENT_REMEDY_KITS]
          - validations[priority=53]
          - validations[priority=66]
          - calculations.recall_scope
        distinguishing_aspect: |
          The window guard fires at draft time on the request itself (build_window_end before
          build_window_start), while the kit guard fires only at launch, after recall_scope has counted the
          fleet in scope — so the campaign is legally draftable with too few kits and only the launch is
          refused. The shortfall arithmetic is affected_unit_count * kits_per_unit against total_kits: 2
          units at 2 kits needs 4, and a pool of 3 fails while a pool of 4 launches.
        test_recipe:
          setup:
            - "TYPE_C_CONV + DSL-100; TX PUBLISHED; dealer D-TX; two legacy DIESEL units delivered 2026-05-10 and 2026-06-02"
