# =============================================================================
# Task 1925 — Farm Stand & U-Pick Operation — Scaffold Seed Tables
# =============================================================================

scenario: |
  1925. Farm Stand & U-Pick Operation (family U-pick farm): crop availability
  calendar & field opening/closing, admission/container pricing vs weigh-out,
  field rotation & picked-out area control, weekend surge staffing & parking,
  liability waiver & farm-safety signage, agritourism add-on (wagon ride/cafe)
  bundling, weather closure & refund policy, cash/card at field & offline mode.
  DIFFICULTY TARGET: harder than expert level — multi-step state machine
  interactions, race conditions resolved by OCC, numeric boundary arithmetic,
  cascade side effects, error-priority ordering, time-window rules,
  offline-mode sync semantics, cross-entity referential integrity.

domain_name: farm-stand-upick
api_prefix: /farm

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # field harvest ounces, window slots, parking, addon slot capacity
  secondary_archetype: pricing_engine        # admission/container vs weigh-out, surge, bundling, refund tiers
  complexity_layers:
    - optimistic_concurrency                 # OCC on Season.version (policy supersede) and Field.version (field edit)
    - cascading_side_effects                 # weather closure cascade; depletion cascade
    - dual_variant_calculation               # field remaining (forward vs committed); weather refund basis
    - idempotency                            # payment idempotency keys; offline batch replay
  entity_topology: flat                      # peer collections joined by FK references in bodies
  state_machine_shape: parallel              # VisitSession: visit_status x payment_status; Field is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                       # Field.rotation_successor_field_id -> Field.id
  role_model: hierarchical_override          # FarmManager superset; GateStaff / FieldStaff peer duties; KioskDevice narrow
  consistency_model: immediate               # all derived fields recomputed inside the mutating request

  entity_count: 13
  state_machine_count: 11
  calculation_count: 10
  endpoint_count: 59
  error_code_count: 33
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All times are logical-clock UTC. All money is integer cents. All weights are
# integer ounces. Ids are server-minted UUIDs with no type prefix and MUST NOT
# participate in any business decision (selector/tie-break uses created_at).
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Season display name (e.g. '2026 Harvest')" }
      - { name: start_date, type: string, source: input, description: "First operating date, ISO YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "Last operating date, ISO YYYY-MM-DD, inclusive; must be >= start_date" }
      - { name: waiver_text, type: string, source: input, description: "Liability waiver body text guests must sign" }
      - { name: current_waiver_version, type: integer, source: system, default: 1, description: "Starts at 1; increments by 1 on every POST /farm/seasons/{id}/config that changes waiver_text" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | ARCHIVED; at most one Season is ACTIVE at any time", constraints: "enum: DRAFT, ACTIVE, ARCHIVED" }

  - name: Crop
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the season this crop is grown in" }
      - { name: name, type: string, source: input, description: "Crop name (e.g. 'Strawberry')" }
      - { name: price_per_lb_cents, type: integer, source: input, description: "Weigh-out price per pound in cents; > 0" }
      - { name: season_picked_oz, type: integer, source: computed, default: 0, description: "Sum of net_oz over FINALIZED HarvestLines whose field belongs to this crop's season and whose crop_id == this crop" }

  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: name, type: string, source: input, description: "Field name (e.g. 'North Berry Patch')" }
      - { name: rotation_group, type: string, source: input, description: "Rotation pool identifier; successor selection is scoped to (season_id, rotation_group)" }
      - { name: rotation_order, type: integer, source: input, description: "Rotation rank within the group; lower rotates in first; >= 0" }
      - { name: estimated_harvest_oz, type: integer, source: input, description: "Estimated total pickable ounces before the field is picked out; > 0" }
      - { name: committed_picked_oz, type: integer, source: computed, default: 0, description: "Sum of net_oz over FINALIZED HarvestLines on this field" }
      - { name: projected_remaining_oz, type: integer, source: computed, default: 0, description: "estimated_harvest_oz minus net_oz over lines in {PROVISIONAL, FINALIZED}; may go negative; see calculation field_remaining_oz" }
      - { name: status, type: enum, source: system, description: "DORMANT | OPEN | PICKED_OUT | ROTATION_REST | RETIRED", constraints: "enum: DORMANT, OPEN, PICKED_OUT, ROTATION_REST, RETIRED" }
      - { name: rest_until, type: string, source: system, description: "ISO date through which the field rests; set when entering ROTATION_REST; null otherwise" }
      - { name: rotation_successor_field_id, type: string, source: computed, description: "FK -> Field.id (self-referential); successor pinned when this field becomes PICKED_OUT; null if no eligible successor" }

  - name: FieldDayWindow
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id" }
      - { name: date, type: string, source: input, description: "Operating date ISO YYYY-MM-DD; must fall within the field's season [start_date, end_date]" }
      - { name: open_time, type: string, source: input, description: "Window open time 'HH:MM' UTC" }
      - { name: close_time, type: string, source: input, description: "Window close time 'HH:MM' UTC; must be strictly after open_time" }
      - { name: picking_capacity_slots, type: integer, source: input, description: "Maximum picker admissions (sum of party_size) this window accepts; > 0" }
      - { name: booked_slots, type: integer, source: computed, default: 0, description: "Sum of party_size over VisitSessions on this window with visit_status NOT IN {CANCELLED, VOIDED}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | CANCELLED", constraints: "enum: SCHEDULED, OPEN, CLOSED, CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, description: "WEATHER | DEPLETED | MANUAL; null unless status == CANCELLED", constraints: "enum: WEATHER, DEPLETED, MANUAL, null" }

  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: admission_per_person_cents, type: integer, source: input, description: "Gate admission per person; >= 0" }
      - { name: container_fee_cents, type: integer, source: input, description: "Per picking container fee; >= 0" }
      - { name: weekend_surge_bps, type: integer, source: input, description: "Surge multiplier in basis points applied to the admission component only on WEEKEND SalesDays (12500 = 1.25x); >= 10000" }
      - { name: bundle_discount_bps, type: integer, source: input, description: "Bundle discount in basis points over the discount base (1000 = 10%); >= 0" }
      - { name: bundle_cap_cents, type: integer, source: input, description: "Absolute cap on the bundle discount; >= 0" }
      - { name: policy_version, type: integer, source: system, description: "Per-season monotonic version; first policy of a season is 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; exactly one ACTIVE per season; creating a new policy supersedes the prior ACTIVE one", constraints: "enum: ACTIVE, SUPERSEDED" }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the season whose current waiver text is signed" }
      - { name: signer_name, type: string, source: input, description: "Legal name of the signing adult" }
      - { name: signer_email, type: string, source: input, description: "Signer email; lookup key for offline devices" }
      - { name: party_member_names, type: array, source: input, description: "Names of all party members covered by this waiver (including signer)" }
      - { name: waiver_version_signed, type: integer, source: system, description: "Season.current_waiver_version at signing time" }
      - { name: status, type: enum, source: system, description: "SIGNED | VOIDED; STALENESS is computed (waiver_version_signed != season.current_waiver_version), never stored", constraints: "enum: SIGNED, VOIDED" }

  - name: VisitSession
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: input, description: "FK -> FieldDayWindow.id; the picking window this party is admitted under" }
      - { name: waiver_id, type: string, source: input, description: "FK -> Waiver.id" }
      - { name: pricing_policy_id, type: string, source: system, description: "FK -> PricingPolicy.id; pinned at creation to the season's ACTIVE policy (online) or the device-submitted policy id (offline)" }
      - { name: party_size, type: integer, source: input, description: "Number of guests; >= 1" }
      - { name: container_count, type: integer, source: input, description: "Picking containers issued at the gate; >= 0" }
      - { name: parking_spaces, type: integer, source: input, description: "Parking spaces reserved for the day; >= 0" }
      - { name: origin, type: enum, source: input, description: "ONLINE | OFFLINE; OFFLINE sessions are created only via /farm/offline-batches", constraints: "enum: ONLINE, OFFLINE" }
      - { name: offline_ref, type: string, source: input, description: "Client-generated idempotency reference; required iff origin == OFFLINE; globally unique across sessions" }
      - { name: device_id, type: string, source: input, description: "Uploading device id; required iff origin == OFFLINE" }
      - { name: visit_status, type: enum, source: system, description: "CHECKED_IN | FIELD_ACTIVE | CHECKED_OUT | CANCELLED | VOIDED", constraints: "enum: CHECKED_IN, FIELD_ACTIVE, CHECKED_OUT, CANCELLED, VOIDED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIALLY_PAID | PAID | PARTIALLY_REFUNDED | REFUNDED; parallel dimension to visit_status", constraints: "enum: UNPAID, PARTIALLY_PAID, PAID, PARTIALLY_REFUNDED, REFUNDED" }
      - { name: admission_charge_cents, type: integer, source: computed, description: "Computed at creation via admission_charge; never recomputed afterwards" }
      - { name: final_total_cents, type: integer, source: computed, description: "Computed at checkout via checkout_settlement; null until CHECKED_OUT" }
      - { name: bundle_discount_cents, type: integer, source: computed, default: 0, description: "Bundle discount applied at checkout; 0 before checkout" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over SETTLED CHARGE payments" }
      - { name: total_refunded_cents, type: integer, source: computed, default: 0, description: "Sum of refunded_amount_cents over all CHARGE payments" }
      - { name: checkout_mode, type: enum, source: system, description: "NORMAL | WEATHER_FORCED | DAY_END_FORCED; null until checked out", constraints: "enum: NORMAL, WEATHER_FORCED, DAY_END_FORCED, null" }
      - { name: sync_outcome, type: enum, source: system, description: "APPLIED | SYNC_CONFLICT; set when an OFFLINE session is processed by a batch; null for ONLINE", constraints: "enum: APPLIED, SYNC_CONFLICT, null" }

  - name: HarvestLine
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> VisitSession.id" }
      - { name: field_id, type: string, source: system, description: "FK -> Field.id; denormalized from the session's window at creation" }
      - { name: crop_id, type: string, source: input, description: "FK -> Crop.id; must belong to the same season as the field" }
      - { name: gross_weight_oz, type: integer, source: input, description: "Scale reading including containers; >= 0" }
      - { name: container_count, type: integer, source: input, description: "Containers used for this line (tare basis); >= 0" }
      - { name: tare_oz, type: integer, source: computed, description: "container_count * TARE_OZ_PER_CONTAINER" }
      - { name: net_oz, type: integer, source: computed, description: "gross_weight_oz - tare_oz; may be 0; negative rejected with ERR_TARE_EXCEEDS_GROSS" }
      - { name: line_charge_cents, type: integer, source: computed, description: "round_half_up(net_oz * crop.price_per_lb_cents / 16); per-line rounding, see weigh_out_total" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL (offline-uploaded, unverified) | FINALIZED (staff-weighed or verified) | VOIDED", constraints: "enum: PROVISIONAL, FINALIZED, VOIDED" }
      - { name: offline_ref, type: string, source: input, description: "Client idempotency reference; set only on OFFLINE-uploaded lines; globally unique across lines" }

  - name: AddonProduct
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: kind, type: enum, source: input, description: "WAGON_RIDE | CAFE_VOUCHER", constraints: "enum: WAGON_RIDE, CAFE_VOUCHER" }
      - { name: name, type: string, source: input, description: "Display name (e.g. 'Orchard Wagon Tour')" }
      - { name: price_cents, type: integer, source: input, description: "Price per booked unit; >= 0" }
      - { name: slot_capacity, type: integer, source: input, description: "Max sum of qty per (addon_product_id, booking_date, slot_time); > 0" }

  - name: AddonBooking
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> VisitSession.id" }
      - { name: addon_product_id, type: string, source: input, description: "FK -> AddonProduct.id; must belong to the session's season" }
      - { name: booking_date, type: string, source: input, description: "ISO date of the slot; must equal the session window's date" }
      - { name: slot_time, type: string, source: input, description: "'HH:MM' UTC start of the slot" }
      - { name: qty, type: integer, source: input, description: "Seats/vouchers booked; >= 1" }
      - { name: booked_value_cents, type: integer, source: computed, description: "addon_product.price_cents * qty, pinned at booking creation" }
      - { name: status, type: enum, source: system, description: "BOOKED | REDEEMED | RELEASED", constraints: "enum: BOOKED, REDEEMED, RELEASED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> VisitSession.id" }
      - { name: kind, type: enum, source: input, description: "CHARGE only in v1 (REFUND reserved for future versions): ALL refunds (manual /refund, weather, checkout overpayment, cancel auto-refund, addon-release refund) are recorded by incrementing refunded_amount_cents on existing SETTLED CHARGE rows in created_at ASC order; no REFUND rows are ever created", constraints: "enum: CHARGE" }
      - { name: method, type: enum, source: input, description: "CASH | CARD | OFFLINE_CARD; CASH and CARD settle immediately; OFFLINE_CARD settles when its batch is applied", constraints: "enum: CASH, CARD, OFFLINE_CARD" }
      - { name: amount_cents, type: integer, source: input, description: "CHARGE amount; > 0" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique per session for CHARGE payments; replay returns the original payment" }
      - { name: refunded_amount_cents, type: integer, source: computed, default: 0, description: "Amount refunded against this CHARGE payment; 0 <= refunded <= amount" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | FAILED | PARTIALLY_REFUNDED | REFUNDED", constraints: "enum: PENDING, SETTLED, FAILED, PARTIALLY_REFUNDED, REFUNDED" }

  - name: SalesDay
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: date, type: string, source: input, description: "Operating date ISO YYYY-MM-DD; unique per season; within season range" }
      - { name: day_type, type: enum, source: input, description: "WEEKDAY | WEEKEND; drives surge pricing", constraints: "enum: WEEKDAY, WEEKEND" }
      - { name: parking_capacity, type: integer, source: input, description: "Total parking spaces reservable this day; >= 0" }
      - { name: staff_on_duty, type: integer, source: input, description: "Staff rostered; gates window scheduling via staffing_requirement; >= 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | CLOSED_NORMAL | CLOSED_WEATHER", constraints: "enum: PLANNED, OPEN, CLOSED_NORMAL, CLOSED_WEATHER" }
      - { name: closed_at_time, type: string, source: system, description: "'HH:MM' UTC logical-clock time of weather closure; drives refund tiers; null unless CLOSED_WEATHER" }
      - { name: booked_parking, type: integer, source: computed, default: 0, description: "Sum of parking_spaces over sessions on windows of this date with visit_status NOT IN {CANCELLED, VOIDED}" }
      - { name: revenue_cents, type: integer, source: computed, default: 0, description: "Sum of (total_paid_cents - total_refunded_cents) over all sessions on windows of this date" }

  - name: OfflineBatch
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "Uploading device identifier" }
      - { name: batch_id, type: string, source: input, description: "Client batch identifier; (device_id, batch_id) is the idempotency key" }
      - { name: records, type: array, source: input, description: "Array of {record_type: VISIT_SESSION|PAYMENT|HARVEST_LINE, sequence_index, offline_ref, payload}; sequence_index unique within the batch; applied in ascending sequence_index order. VISIT_SESSION payload: {window_id, waiver_id, pricing_policy_id, party_size, container_count, parking_spaces}. PAYMENT payload: {session_ref, method: OFFLINE_CARD, amount_cents}. HARVEST_LINE payload: {session_ref, crop_id, gross_weight_oz, container_count}. session_ref matches either a session's offline_ref or its server-minted id" }
      - { name: status, type: enum, source: system, description: "APPLIED | PARTIALLY_APPLIED; a structurally invalid batch is rejected with ERR_INVALID_REQUEST and never persisted", constraints: "enum: APPLIED, PARTIALLY_APPLIED" }
      - { name: results, type: array, source: system, description: "Per-record array of {offline_ref, outcome: APPLIED|SYNC_CONFLICT, entity_id|null}; replaying the batch returns the identical results array" }
      - { name: applied_count, type: integer, source: system, description: "Count of records with outcome APPLIED" }
      - { name: conflict_count, type: integer, source: system, description: "Count of records with outcome SYNC_CONFLICT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /farm/seasons/{id}/activate"
        actor: FarmManager
        preconditions:
          - "No other Season is currently ACTIVE"
        side_effects:
          - "Season becomes the operative season for all gating checks (ERR_SEASON_NOT_ACTIVE)"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /farm/seasons/{id}/archive"
        actor: FarmManager
        preconditions:
          - "Every Field of this season is in {RETIRED, DORMANT, ROTATION_REST}"
          - "No SalesDay of this season is OPEN"
        side_effects: []

  - entity: PricingPolicy
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /farm/pricing-policies creates a newer policy for the same season)"
        actor: system
        preconditions: []
        side_effects:
          - "New policy becomes ACTIVE with policy_version = prior policy_version + 1"
          - "Existing sessions keep their pinned pricing_policy_id (no re-pricing)"
          - "Season.version increments by 1 (supersede is a mutation on the season)"

  - entity: Field
    field: status
    initial_state: DORMANT
    terminal_states: [RETIRED]
    transitions:
      - from: DORMANT
        to: OPEN
        trigger: "POST /farm/fields/{id}/open"
        actor: FarmManager
        preconditions:
          - "Season of the field is ACTIVE (ERR_SEASON_NOT_ACTIVE)"
          - "rest_until is null or < the logical-clock current date (ERR_FIELD_RESTING)"
        side_effects: []
        note: "/open attempted while the field is in ROTATION_REST fails with ERR_FIELD_RESTING (422, temporal) rather than ERR_INVALID_STATE; /open from OPEN, PICKED_OUT, or RETIRED fails with ERR_INVALID_STATE (409)"
      - from: OPEN
        to: PICKED_OUT
        trigger: "system (a HarvestLine create/finalize pushes committed_picked_oz >= estimated_harvest_oz)"
        actor: system
        preconditions: []
        side_effects:
          - "Field.committed_picked_oz and Crop.season_picked_oz already updated by the triggering line"
          - "All SCHEDULED FieldDayWindows of this field -> CANCELLED with cancel_reason=DEPLETED (windows of past dates untouched; today's OPEN window stays OPEN as a grace so on-site sessions can finish)"
          - "rotation_successor_field_id pinned: among fields with same season_id and rotation_group, status == DORMANT, rest_until null or <= current date: lowest rotation_order, tie-break created_at ASC; null if the eligible set is empty"
      - from: PICKED_OUT
        to: ROTATION_REST
        trigger: "system (POST /farm/sales-days/{id}/close-day sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "rest_until = sales_day.date + FIELD_REST_DAYS days"
      - from: ROTATION_REST
        to: DORMANT
        trigger: "system (POST /farm/sales-days/{id}/open-day sweep when sales_day.date >= rest_until, inclusive)"
        actor: system
        preconditions:
          - "sales_day.date >= rest_until"
        side_effects:
          - "rest_until cleared to null"
      - from: [DORMANT, OPEN, PICKED_OUT, ROTATION_REST]
        to: RETIRED
        trigger: "POST /farm/fields/{id}/retire"
        actor: FarmManager
        preconditions:
          - "No FieldDayWindow of this field is in {SCHEDULED, OPEN}"
        side_effects: []

  - entity: FieldDayWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /farm/field-day-windows/{id}/open"
        actor: FarmManager
        preconditions:
          - "Field of the window is OPEN (ERR_FIELD_NOT_OPEN)"
          - "SalesDay for window.date is OPEN (ERR_DAY_NOT_OPEN)"
          - "Logical clock is within [date open_time, date close_time) UTC (ERR_OUTSIDE_WINDOW_HOURS)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (POST /farm/sales-days/{id}/close-day sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SCHEDULED, OPEN]
        to: CANCELLED
        trigger: "system (SalesDay close-weather -> cancel_reason=WEATHER; Field PICKED_OUT -> cancel_reason=DEPLETED for SCHEDULED windows only) or POST /farm/field-day-windows/{id}/cancel (cancel_reason=MANUAL)"
        actor: "system or FarmManager"
        preconditions:
          - "Manual cancel only: booked_slots == 0 (ERR_INVALID_STATE otherwise)"
          - "Manual cancel only: status == SCHEDULED"
        side_effects:
          - "WEATHER cancel: every VisitSession on this window with visit_status IN {CHECKED_IN, FIELD_ACTIVE} is force-checked-out (see VisitSession WEATHER_FORCED transition); sessions already CHECKED_OUT keep their state"
          - "DEPLETED cancel: no session processing (SCHEDULED windows have no sessions)"

  - entity: VisitSession
    field: visit_status
    initial_state: CHECKED_IN
    terminal_states: [CHECKED_OUT, CANCELLED, VOIDED]
    note: "Parallel dimension: payment_status evolves independently on the same row (UNPAID -> PARTIALLY_PAID -> PAID -> PARTIALLY_REFUNDED -> REFUNDED; PAID -> REFUNDED allowed). visit_status transitions never directly mutate payment_status and vice versa; only payment/refund writes and the checkout/weather calculations move payment_status."
    transitions:
      - from: CHECKED_IN
        to: FIELD_ACTIVE
        trigger: "POST /farm/visit-sessions/{id}/enter-field"
        actor: FieldStaff
        preconditions:
          - "Window of the session is OPEN (ERR_WINDOW_NOT_OPEN)"
          - "Field of the window is OPEN (ERR_FIELD_NOT_OPEN)"
          - "Session waiver passes all waiver checks (ERR_WAIVER_VOIDED / ERR_WAIVER_STALE / ERR_WAIVER_PARTY_MISMATCH)"
          - "total_paid_cents - total_refunded_cents >= admission_charge_cents (ERR_UNPAID_BALANCE)"
        side_effects: []
      - from: [CHECKED_IN, FIELD_ACTIVE]
        to: CHECKED_OUT
        trigger: "POST /farm/visit-sessions/{id}/checkout (NORMAL) or system (SalesDay close-weather -> WEATHER_FORCED; SalesDay close-day with on-site sessions -> DAY_END_FORCED)"
        actor: "FieldStaff or system"
        preconditions:
          - "NORMAL only: no HarvestLine of this session is PROVISIONAL (ERR_UNRESOLVED_LINES)"
          - "NORMAL only: total_paid_cents - total_refunded_cents >= computed final_total_cents (ERR_UNPAID_BALANCE)"
        side_effects:
          - "checkout_settlement runs: final_total_cents and bundle_discount_cents pinned"
          - "Every BOOKED AddonBooking of this session -> RELEASED (unredeemed at checkout); REDEEMED bookings keep state"
          - "WEATHER_FORCED only: every PROVISIONAL HarvestLine of this session -> VOIDED (its projected weight stops counting)"
          - "NORMAL only: if net paid exceeds final_total_cents, the system applies an automatic refund of the excess to the session's SETTLED CHARGE payments in created_at ASC order (incrementing refunded_amount_cents)"
          - "WEATHER_FORCED only: weather_refund computed and applied to SETTLED CHARGE payments in created_at ASC order"
          - "SalesDay.revenue_cents and booked_slot/parking aggregates recompute"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /farm/visit-sessions/{id}/cancel"
        actor: GateStaff
        preconditions: []
        side_effects:
          - "booked_slots / booked_parking aggregates release the session's party_size and parking_spaces"
          - "BOOKED AddonBookings of this session -> RELEASED"
          - "System auto-refunds the full net paid amount to SETTLED CHARGE payments in created_at ASC order"
      - from: [CHECKED_IN, FIELD_ACTIVE]
        to: VOIDED
        trigger: "system (offline batch sync conflict: window CANCELLED with reason WEATHER, waiver invalid at sync time, capacity beyond the offline allowance, or duplicate offline_ref)"
        actor: system
        preconditions: []
        side_effects:
          - "sync_outcome = SYNC_CONFLICT"
          - "PROVISIONAL HarvestLines of this session -> VOIDED"
          - "BOOKED AddonBookings of this session -> RELEASED (no refund is owed: voided sessions settle their OFFLINE_CARD payments to FAILED, never collected)"

  - entity: HarvestLine
    field: status
    initial_state: PROVISIONAL
    note: "Online POST /farm/harvest-lines creates the line directly in FINALIZED (staff-attested weigh-out). Offline-uploaded lines are created PROVISIONAL and must be verified via /finalize."
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /farm/harvest-lines/{id}/finalize"
        actor: FieldStaff
        preconditions:
          - "Session of the line is FIELD_ACTIVE (ERR_SESSION_NOT_ACTIVE)"
          - "Field of the line is OPEN (ERR_FIELD_NOT_OPEN)"
        side_effects:
          - "Field.committed_picked_oz += net_oz; Crop.season_picked_oz += net_oz; Field.version and Crop.version increment"
          - "If Field.committed_picked_oz >= Field.estimated_harvest_oz the Field -> PICKED_OUT cascade fires (see Field machine)"
      - from: [PROVISIONAL, FINALIZED]
        to: VOIDED
        trigger: "POST /farm/harvest-lines/{id}/void (manual) or system (weather force-checkout or sync void of the parent session)"
        actor: "FieldStaff or system"
        preconditions:
          - "Manual void only: session of the line is NOT CHECKED_OUT (ERR_INVALID_STATE)"
        side_effects:
          - "If the line was FINALIZED: Field.committed_picked_oz -= net_oz; Crop.season_picked_oz -= net_oz (compensating reversal)"
          - "projected_remaining_oz recomputes in all cases"

  - entity: AddonBooking
    field: status
    initial_state: BOOKED
    terminal_states: [REDEEMED, RELEASED]
    transitions:
      - from: BOOKED
        to: REDEEMED
        trigger: "POST /farm/addon-bookings/{id}/redeem"
        actor: FieldStaff
        preconditions:
          - "Session of the booking has visit_status IN {CHECKED_IN, FIELD_ACTIVE} (ERR_BOOKING_NOT_REDEEMABLE)"
          - "Logical clock date == booking_date (ERR_BOOKING_NOT_REDEEMABLE)"
        side_effects: []
      - from: BOOKED
        to: RELEASED
        trigger: "POST /farm/addon-bookings/{id}/release or system (session checkout / cancel / void, or SalesDay close-weather releasing all BOOKED bookings whose booking_date == closure date)"
        actor: "GateStaff, FarmManager, or system"
        preconditions: []
        side_effects:
          - "Slot capacity on (addon_product_id, booking_date, slot_time) freed"
          - "Manual release and weather release: booked_value_cents is refunded by incrementing refunded_amount_cents on the session's SETTLED CHARGE payments in created_at ASC order; checkout-time release is NOT refunded (never charged)"

  - entity: Payment
    field: status
    initial_state: PENDING
    terminal_states: [REFUNDED, FAILED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "system (immediately on creation for CASH and online CARD; on batch apply for OFFLINE_CARD)"
        actor: system
        preconditions: []
        side_effects:
          - "Session.total_paid_cents += amount_cents; SalesDay.revenue_cents recomputes; payment_status recompute (UNPAID -> PARTIALLY_PAID/PAID)"
      - from: PENDING
        to: FAILED
        trigger: "system (batch apply marks the payment FAILED when its session is voided or the record carries outcome FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETTLED
        to: PARTIALLY_REFUNDED
        trigger: "POST /farm/payments/{id}/refund with amount_cents < amount_cents - refunded_amount_cents, or system weather/auto refund partially consuming this payment"
        actor: "FarmManager or system"
        preconditions:
          - "amount_cents requested <= amount_cents - refunded_amount_cents (ERR_REFUND_EXCEEDS_PAID)"
        side_effects:
          - "refunded_amount_cents += amount; Session.total_refunded_cents += amount; payment_status recompute"
      - from: [SETTLED, PARTIALLY_REFUNDED]
        to: REFUNDED
        trigger: "POST /farm/payments/{id}/refund with amount_cents == amount_cents - refunded_amount_cents, or system refund fully consuming this payment"
        actor: "FarmManager or system"
        preconditions:
          - "amount_cents requested <= amount_cents - refunded_amount_cents (ERR_REFUND_EXCEEDS_PAID)"
        side_effects:
          - "refunded_amount_cents = amount_cents; Session.total_refunded_cents recompute; if every obligation refunded, session payment_status -> REFUNDED"

  - entity: SalesDay
    field: status
    initial_state: PLANNED
    terminal_states: [CLOSED_NORMAL, CLOSED_WEATHER]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /farm/sales-days/{id}/open-day"
        actor: FarmManager
        preconditions:
          - "Season is ACTIVE (ERR_SEASON_NOT_ACTIVE)"
          - "Logical clock date == sales_day.date (ERR_OUTSIDE_WINDOW_HOURS)"
        side_effects:
          - "Rotation sweep: every Field of this season in ROTATION_REST with rest_until <= date -> DORMANT (rest_until cleared)"
      - from: OPEN
        to: CLOSED_NORMAL
        trigger: "POST /farm/sales-days/{id}/close-day"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "On-site sessions (visit_status IN {CHECKED_IN, FIELD_ACTIVE}) -> CHECKED_OUT with checkout_mode=DAY_END_FORCED (no refund; final_total computed; PROVISIONAL lines of those sessions -> VOIDED)"
          - "OPEN FieldDayWindows of this date -> CLOSED"
          - "PICKED_OUT Fields of this season -> ROTATION_REST with rest_until = date + FIELD_REST_DAYS"
      - from: OPEN
        to: CLOSED_WEATHER
        trigger: "POST /farm/sales-days/{id}/close-weather"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "closed_at_time = logical clock current 'HH:MM' UTC (drives refund tier)"
          - "Every FieldDayWindow with this date and status IN {SCHEDULED, OPEN} -> CANCELLED with cancel_reason=WEATHER (hop 1)"
          - "Each cancelled window force-checks-out its on-site sessions with checkout_mode=WEATHER_FORCED (hop 2)"
          - "Each force-checkout voids PROVISIONAL HarvestLines and computes weather_refund applied to SETTLED CHARGE payments in created_at ASC order (hop 3)"
          - "Every BOOKED AddonBooking with booking_date == this date -> RELEASED with face-value refund to its session ledger (hop 3, applies even to CHECKED_OUT sessions' bookings)"
          - "revenue_cents recomputes after all refunds"

  - entity: OfflineBatch
    field: status
    initial_state: APPLIED
    terminal_states: [APPLIED, PARTIALLY_APPLIED]
    note: "Batches are append-only. Status is decided at first upload: all records APPLIED -> APPLIED, else PARTIALLY_APPLIED. A replay (same device_id + batch_id) returns the stored batch unchanged and applies nothing twice."
    transitions: []

  - entity: Waiver
    field: status
    initial_state: SIGNED
    terminal_states: [VOIDED]
    transitions:
      - from: SIGNED
        to: VOIDED
        trigger: "POST /farm/waivers/{id}/void"
        actor: FarmManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; sequential-observable)
# =============================================================================
concurrency_rules:
  - rule_id: policy-create-stale-season
    parent_entity: Season
    write_endpoint: "POST /farm/pricing-policies"
    occ_field: expected_season_version
    description: |
      Creating a PricingPolicy supersedes the season's current ACTIVE policy.
      A create carrying an expected_season_version below the season's current
      version is rejected: the caller priced against a policy configuration it
      never observed (e.g., another writer has just created a policy, which
      legitimately superseded the prior one and advanced Season.version).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: field-edit-stale-version
    parent_entity: Field
    write_endpoint: "PATCH /farm/fields/{id}"
    occ_field: expected_field_version
    description: |
      Editing a Field's rotation_order or estimated_harvest_oz is legitimate at
      any time, but every weigh-out finalize/void silently advances
      Field.version via the tally side effects. A PATCH carrying an
      expected_field_version below the field's current version is rejected
      because the caller's view of the harvest tallies is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Global constants: TARE_OZ_PER_CONTAINER=4, STAFF_COVERAGE_SLOTS_PER_STAFF=25,
# OFFLINE_OVERBOOK_ALLOWANCE_SLOTS=10, FIELD_REST_DAYS=7.
# All currency arithmetic is integer cents; division rounding is round_half_up
# (floor((numerator*2 + divisor) / (2*divisor)) for non-negative integers).
# =============================================================================
calculations:
  - name: admission_charge
    trigger: "VisitSession creation (online POST /farm/visit-sessions or offline batch VISIT_SESSION record)"
    algorithm: threshold
    formula: |
      policy = session's pinned PricingPolicy
      day    = SalesDay for window.date
      admission_component = policy.admission_per_person_cents * party_size
      if day.day_type == WEEKEND:
        admission_component = round_half_up(admission_component * policy.weekend_surge_bps / 10000)
      container_component = policy.container_fee_cents * container_count
      admission_charge_cents = admission_component + container_component
    input_set: "The session being created; its window's date's SalesDay (must be OPEN); the pinned PricingPolicy"
    constants:
      TARE_OZ_PER_CONTAINER: 4
    precision: "integer cents, round_half_up on the surge multiplication only"
    variants: []

  - name: weigh_out_total
    trigger: "HarvestLine creation/finalize (per-line charge) and checkout_settlement (sum over FINALIZED lines)"
    algorithm: aggregation
    formula: |
      For each line independently:
        tare_oz  = container_count * TARE_OZ_PER_CONTAINER          # 4 oz per container
        net_oz   = gross_weight_oz - tare_oz                        # >= 0 else ERR_TARE_EXCEEDS_GROSS
        line_charge_cents = round_half_up(net_oz * crop.price_per_lb_cents / 16)
      weigh_out_total = sum(line_charge_cents) over the session's FINALIZED lines
      PINNED ORDER: round per line FIRST, then sum. (Sum-then-round is the
      forbidden alternative: it produces different cents, e.g. two 1-oz lines
      at 310 c/lb give 19+19=38 per-line but round(38.75)=39 sum-then-round.)
    input_set: "HarvestLines of the session with status == FINALIZED only (PROVISIONAL and VOIDED excluded)"
    constants:
      TARE_OZ_PER_CONTAINER: 4
      OZ_PER_LB: 16
    precision: "integer cents, round_half_up per line, then exact integer sum"
    variants: []

  - name: checkout_settlement
    trigger: "VisitSession checkout (NORMAL, WEATHER_FORCED, DAY_END_FORCED)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED (the prose 'bundle takes 10% off the day'
      is circular without it):
        1. addon_total = sum(booked_value_cents) over REDEEMED AddonBookings
        2. discount_base = admission_charge_cents + addon_total     # harvest EXCLUDED
        3. bundle_discount_cents = 0 unless the session has >= 1 REDEEMED
           WAGON_RIDE booking AND >= 1 REDEEMED CAFE_VOUCHER booking;
           otherwise min(policy.bundle_cap_cents,
                         round_half_up(policy.bundle_discount_bps * discount_base / 10000))
        4. harvest_total = weigh_out_total over FINALIZED lines
        5. final_total_cents = admission_charge_cents + addon_total
                               + harvest_total - bundle_discount_cents
      WEATHER_FORCED sessions: final_total is still computed (for the record)
      but the refund is governed by weather_refund, not by this total.
    input_set: "The session; its REDEEMED AddonBookings; its FINALIZED HarvestLines; its pinned PricingPolicy"
    constants: {}
    precision: "integer cents, round_half_up on the discount multiplication"
    variants: []

  - name: field_remaining_oz
    trigger: "Any HarvestLine create/finalize/void on the field; read by session-creation gating"
    algorithm: aggregation
    formula: |
      committed_picked_oz   = sum(net_oz) over FINALIZED lines of the field
      projected_remaining_oz = estimated_harvest_oz
                               - sum(net_oz) over lines in {PROVISIONAL, FINALIZED}
      The PICKED_OUT threshold compares committed_picked_oz >= estimated_harvest_oz.
      The session-creation depletion gate compares projected_remaining_oz <= 0.
      Both derived fields are recomputed immediately inside every mutating request.
    input_set: "HarvestLines whose field_id == this field, grouped by status"
    constants: {}
    precision: "integer ounces, exact"
    variants:
      - name: committed_basis
        when: "PICKED_OUT auto-transition and rotation trigger"
        difference: "counts FINALIZED lines only; provisional (unverified offline) weight does not deplete the field"
      - name: forward_looking_basis
        when: "session-creation gate (ERR_FIELD_DEPLETED)"
        difference: "counts PROVISIONAL + FINALIZED lines; projected depletion blocks new admissions earlier than the committed tally does"

  - name: weather_refund
    trigger: "SalesDay close-weather, per on-site session (visit_status IN {CHECKED_IN, FIELD_ACTIVE} on a window of the closure date)"
    algorithm: threshold
    formula: |
      tier: closed_at_time < '12:00'  -> refund_pct = 10000 bps (100%)
            '12:00' <= closed_at_time < '15:00' -> refund_pct = 5000 bps (50%)
            closed_at_time >= '15:00' -> refund_pct = 0
      admission_component_paid = the admission portion of the session's
        admission_charge_cents EXCLUDING the container component
        (admission_charge_cents - policy.container_fee_cents * container_count)
      admission_refund = round_half_up(admission_component_paid * refund_pct / 10000)
      container_refund = policy.container_fee_cents * container_count
                         if the session has ZERO FINALIZED HarvestLines, else 0
      addon_refund = sum(booked_value_cents) over BOOKED bookings with
                     booking_date == closure date (they transition to RELEASED);
                     REDEEMED bookings refund 0
      weather_refund_total = admission_refund + container_refund + addon_refund
      Applied to the session's SETTLED CHARGE payments in created_at ASC order,
      each payment's refunded_amount_cents increased up to its remaining amount.
      Hard cap: the total refund applied never exceeds the session's net
      collected amount (total_paid_cents - total_refunded_cents); any excess
      is discarded (money is never created).
      Bundle discount is never involved: a weather-forced session never ran a
      normal checkout, so no bundle_discount was ever granted to claw back.
    input_set: "Sessions on windows of the closure date with visit_status IN {CHECKED_IN, FIELD_ACTIVE}; each session's pinned PricingPolicy; its payments and bookings"
    constants:
      TIER_FULL_BEFORE: "12:00"
      TIER_HALF_BEFORE: "15:00"
    precision: "integer cents, round_half_up on the percentage application"
    variants:
      - name: paid_basis
        when: "authoritative"
        difference: "refund computed from the session's PINNED policy and its actual admission_charge_cents"
      - name: current_policy_basis
        when: "rejected interpretation (kept for audit)"
        difference: "repricing the session with the season's CURRENT ACTIVE policy at closure time yields a different refund whenever the policy was superseded mid-day; the scaffold pins paid_basis"

  - name: staffing_requirement
    trigger: "POST /farm/field-day-windows (creation only)"
    algorithm: threshold
    formula: |
      required_staff = ceil(total_slots / STAFF_COVERAGE_SLOTS_PER_STAFF)
      where total_slots = sum(picking_capacity_slots) over all FieldDayWindows
      with the same date and status != CANCELLED, INCLUDING the window being created.
      Creation is rejected with ERR_INSUFFICIENT_STAFFING when
      SalesDay(date).staff_on_duty < required_staff.
      Boundary: total_slots exactly divisible by 25 divides evenly (50 -> 2 staff).
    input_set: "Non-CANCELLED FieldDayWindows with date == new window's date; the SalesDay for that date"
    constants:
      STAFF_COVERAGE_SLOTS_PER_STAFF: 25
    precision: "integer staff, ceiling division"
    variants: []

  - name: window_slot_capacity
    trigger: "VisitSession create/cancel/void; offline batch session apply"
    algorithm: aggregation
    formula: |
      booked_slots = sum(party_size) over sessions of the window with
                     visit_status NOT IN {CANCELLED, VOIDED}
      ONLINE create: rejected when booked_slots + party_size > picking_capacity_slots
                     (ERR_WINDOW_CAPACITY_FULL); equality fills the window and succeeds.
      OFFLINE apply: allowed up to picking_capacity_slots + OFFLINE_OVERBOOK_ALLOWANCE_SLOTS;
                     beyond that the session is created VOIDED with sync_outcome=SYNC_CONFLICT.
      booked_parking on the SalesDay uses the same inclusion set over parking_spaces;
      ONLINE create rejected when booked_parking + parking_spaces > parking_capacity
      (ERR_PARKING_FULL).
    input_set: "VisitSessions with window_id == this window (or, for parking, on any window of the date)"
    constants:
      OFFLINE_OVERBOOK_ALLOWANCE_SLOTS: 10
    precision: "integer slots, exact"
    variants: []

  - name: addon_slot_capacity
    trigger: "AddonBooking create/release/redeem and weather release cascade"
    algorithm: aggregation
    formula: |
      slot_used = sum(qty) over AddonBookings with the same
                  (addon_product_id, booking_date, slot_time) and
                  status IN {BOOKED, REDEEMED}
      Create rejected when slot_used + qty > slot_capacity (ERR_ADDON_SLOT_FULL);
      equality fills the slot and succeeds. RELEASED bookings free their qty.
    input_set: "AddonBookings grouped by (addon_product_id, booking_date, slot_time)"
    constants: {}
    precision: "integer units, exact"
    variants: []

  - name: payment_status_derive
    trigger: "Every payment settle/fail/refund write on the session"
    algorithm: aggregation
    formula: |
      net_paid = total_paid_cents - total_refunded_cents
      if total_paid_cents == 0: UNPAID
      elif total_refunded_cents >= total_paid_cents and total_paid_cents > 0: REFUNDED
      elif total_refunded_cents > 0: PARTIALLY_REFUNDED
      elif final_total_cents is not null and net_paid >= final_total_cents: PAID
      elif final_total_cents is null and net_paid >= admission_charge_cents: PAID
      else: PARTIALLY_PAID
    input_set: "All CHARGE Payments of the session (any status contributing per total_paid_cents/total_refunded_cents definitions)"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: offline_batch_apply
    trigger: "POST /farm/offline-batches (first upload of a (device_id, batch_id) pair)"
    algorithm: chronological
    formula: |
      Records apply in ascending sequence_index (structural duplicate indices
      reject the whole batch with ERR_INVALID_REQUEST, nothing persisted).
      VISIT_SESSION record: creates the session with origin=OFFLINE and the
      payload's pinned pricing_policy_id (offline sessions grandfather the
      policy the device cached). Validations at apply time, in §1.4 order:
      window exists (else SYNC_CONFLICT), window not CANCELLED with reason
      WEATHER (else session VOIDED / SYNC_CONFLICT), waiver valid NOW
      (else VOIDED / SYNC_CONFLICT), capacity with OFFLINE_OVERBOOK_ALLOWANCE_SLOTS
      (else VOIDED / SYNC_CONFLICT), offline_ref not seen before on any session
      (else SYNC_CONFLICT). Clean apply -> APPLIED, session CHECKED_IN/UNPAID.
      PAYMENT record: resolves its session via session_ref (offline_ref or server id);
      unknown ref -> SYNC_CONFLICT; session VOIDED -> payment FAILED,
      outcome SYNC_CONFLICT; otherwise settles OFFLINE_CARD -> SETTLED, APPLIED.
      HARVEST_LINE record: resolves its session via session_ref; unknown
      ref, session not FIELD_ACTIVE, or duplicate line offline_ref -> SYNC_CONFLICT;
      otherwise creates the line in PROVISIONAL status (tare/net/charge computed
      as in weigh_out_total; field checks are NOT applied at upload time).
      Batch status: all APPLIED -> APPLIED; any SYNC_CONFLICT -> PARTIALLY_APPLIED.
      Replay of the same (device_id, batch_id) returns the stored batch with
      identical results and applies nothing again.
    input_set: "The batch's records array; referenced windows/waivers/sessions at apply time"
    constants: {}
    precision: "not numeric"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 10, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present for all roles except Anonymous", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints except POST /farm/waivers" }
  - { priority: 11, category: auth, check: "Acting role is in the endpoint's roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 20, category: existence, check: "Path-template ids resolve, left to right (season before field before window...)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 30, category: existence, check: "Request shape: required fields present, types correct, enum values in range, no undeclared fields, close_time > open_time, party_size >= 1, amount_cents > 0, batch sequence_index unique", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 40, category: existence, check: "Body foreign keys resolve (season_id, field_id, window_id, waiver_id, session_id, crop_id, addon_product_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creation endpoints" }
  - { priority: 50, category: state, check: "Target resource's own state permits the transition (invalid from-state on the addressed resource)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 60, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /farm/pricing-policies, PATCH /farm/fields/{id}" }
  - { priority: 70, category: business_safety, check: "Season of the operation is ACTIVE where required", error_id: ERR_SEASON_NOT_ACTIVE, http_status: 409, applies_to: "field open, sales-day open-day, window create/open, session create" }
  - { priority: 71, category: business_safety, check: "Waiver: status == SIGNED", error_id: ERR_WAIVER_VOIDED, http_status: 422, applies_to: "session create, enter-field, offline session apply" }
  - { priority: 72, category: business_safety, check: "Waiver: waiver_version_signed == season.current_waiver_version", error_id: ERR_WAIVER_STALE, http_status: 422, applies_to: "session create, enter-field, offline session apply" }
  - { priority: 73, category: business_safety, check: "Waiver: len(party_member_names) >= party_size", error_id: ERR_WAIVER_PARTY_MISMATCH, http_status: 422, applies_to: "session create, enter-field, offline session apply" }
  - { priority: 80, category: business_temporal, check: "SalesDay (season_id, date) is unique (ERR_SALES_DAY_EXISTS, 409) and date within season range (ERR_DATE_OUTSIDE_SEASON, 422)", error_id: "ERR_SALES_DAY_EXISTS | ERR_DATE_OUTSIDE_SEASON", http_status: 409, applies_to: "POST /farm/sales-days" }
  - { priority: 81, category: business_temporal, check: "Window date within the field's season range", error_id: ERR_DATE_OUTSIDE_SEASON, http_status: 422, applies_to: "POST /farm/field-day-windows" }
  - { priority: 82, category: business_temporal, check: "No overlap with another non-CANCELLED window on the same (field_id, date): half-open [open_time, close_time) intervals; adjacency (a.close_time == b.open_time) is allowed", error_id: ERR_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /farm/field-day-windows" }
  - { priority: 83, category: business_temporal, check: "Field rest: rest_until null or < current date when opening", error_id: ERR_FIELD_RESTING, http_status: 422, applies_to: "POST /farm/fields/{id}/open" }
  - { priority: 84, category: business_temporal, check: "Logical clock within the action's time window (open-day date match; window-open within [open_time, close_time))", error_id: ERR_OUTSIDE_WINDOW_HOURS, http_status: 422, applies_to: "sales-day open-day, window open" }
  - { priority: 85, category: business_temporal, check: "Season has an ACTIVE PricingPolicy to pin", error_id: ERR_NO_ACTIVE_POLICY, http_status: 409, applies_to: "session create" }
  - { priority: 90, category: business_constraint, check: "Window capacity: booked_slots + party_size <= picking_capacity_slots (online) or <= capacity + OFFLINE_OVERBOOK_ALLOWANCE_SLOTS (offline)", error_id: ERR_WINDOW_CAPACITY_FULL, http_status: 422, applies_to: "session create, offline session apply" }
  - { priority: 91, category: business_constraint, check: "Parking: booked_parking + parking_spaces <= parking_capacity", error_id: ERR_PARKING_FULL, http_status: 422, applies_to: "session create (online)" }
  - { priority: 92, category: business_constraint, check: "Staffing: ceil(total non-cancelled window slots on the date / 25) <= staff_on_duty", error_id: ERR_INSUFFICIENT_STAFFING, http_status: 422, applies_to: "POST /farm/field-day-windows" }
  - { priority: 93, category: business_constraint, check: "Addon slot: slot_used + qty <= slot_capacity for (product, date, slot_time)", error_id: ERR_ADDON_SLOT_FULL, http_status: 422, applies_to: "POST /farm/addon-bookings" }
  - { priority: 94, category: business_constraint, check: "Field depletion gate: window's field.projected_remaining_oz > 0", error_id: ERR_FIELD_DEPLETED, http_status: 422, applies_to: "session create" }
  - { priority: 95, category: business_constraint, check: "Tare: gross_weight_oz - container_count * TARE_OZ_PER_CONTAINER >= 0", error_id: ERR_TARE_EXCEEDS_GROSS, http_status: 422, applies_to: "POST /farm/harvest-lines" }
  - { priority: 96, category: business_constraint, check: "Checkout: no PROVISIONAL HarvestLines on the session", error_id: ERR_UNRESOLVED_LINES, http_status: 422, applies_to: "POST /farm/visit-sessions/{id}/checkout" }
  - { priority: 97, category: business_constraint, check: "Cross-window state: window OPEN for session create / enter-field (ERR_WINDOW_NOT_OPEN); field OPEN for enter-field / harvest line create / finalize (ERR_FIELD_NOT_OPEN); SalesDay OPEN for session create (ERR_DAY_NOT_OPEN); session FIELD_ACTIVE for harvest line create (ERR_SESSION_NOT_ACTIVE); session visit_status IN {CHECKED_IN, FIELD_ACTIVE} for payments and for addon booking create (ERR_SESSION_NOT_ACTIVE); session visit_status IN {CHECKED_IN, FIELD_ACTIVE} and clock date == booking_date for redeem (ERR_BOOKING_NOT_REDEEMABLE)", error_id: "ERR_WINDOW_NOT_OPEN | ERR_FIELD_NOT_OPEN | ERR_DAY_NOT_OPEN | ERR_SESSION_NOT_ACTIVE | ERR_BOOKING_NOT_REDEEMABLE", http_status: 409, applies_to: "session create, enter-field, harvest-line create/finalize, payments, addon booking create, addon redeem" }
  - { priority: 100, category: business_referential, check: "Cross-scope integrity: crop.season_id == field.season_id == window's season == session's season; addon_product.season_id == session's season; booking_date == session window's date", error_id: ERR_CROSS_SCOPE_REFERENCE, http_status: 422, applies_to: "harvest-line create, addon-booking create" }
  - { priority: 110, category: business_fiscal, check: "Payment amount sanity: amount_cents > 0 and amount_cents <= outstanding_obligation, where outstanding_obligation = admission_charge_cents + sum(line_charge_cents over the session's FINALIZED HarvestLines) + sum(booked_value_cents over the session's AddonBookings in {BOOKED, REDEEMED}) - (total_paid_cents - total_refunded_cents); PROVISIONAL/VOIDED lines, RELEASED bookings, and any bundle discount are deliberately excluded from the obligation", error_id: ERR_PAYMENT_AMOUNT_INVALID, http_status: 422, applies_to: "POST /farm/payments" }
  - { priority: 111, category: business_fiscal, check: "Refund: amount_cents <= payment.amount_cents - payment.refunded_amount_cents", error_id: ERR_REFUND_EXCEEDS_PAID, http_status: 422, applies_to: "POST /farm/payments/{id}/refund" }
  - { priority: 112, category: business_fiscal, check: "Balance gates: net paid >= admission_charge_cents for enter-field; net paid >= final_total_cents for checkout", error_id: ERR_UNPAID_BALANCE, http_status: 422, applies_to: "enter-field, checkout" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Season ---
  - { method: POST, path: "/farm/seasons", description: "Create a season (DRAFT)", roles: [FarmManager], code: 201, input: [name, start_date, end_date, waiver_text], output: Season, side_effects: ["status=DRAFT, current_waiver_version=1"] }
  - { method: GET, path: "/farm/seasons/{id}", description: "Get a season", roles: [FarmManager, GateStaff, FieldStaff, KioskDevice], code: 200, input: [], output: Season, side_effects: [] }
  - { method: POST, path: "/farm/seasons/{id}/activate", description: "Activate a DRAFT season; only one ACTIVE at a time", roles: [FarmManager], code: 200, input: [], output: Season, side_effects: ["status -> ACTIVE; increments version"] }
  - { method: POST, path: "/farm/seasons/{id}/archive", description: "Archive an ACTIVE season (all fields retired/dormant/resting, no open day)", roles: [FarmManager], code: 200, input: [], output: Season, side_effects: ["status -> ARCHIVED; increments version"] }
  - { method: POST, path: "/farm/seasons/{id}/config", description: "Bump waiver text (and thereby current_waiver_version) and/or rename", roles: [FarmManager], code: 200, input: [waiver_text], output: Season, side_effects: ["current_waiver_version += 1 when waiver_text differs; increments version; existing waivers become stale by comparison, never by stored status"] }

  # --- Crop ---
  - { method: POST, path: "/farm/crops", description: "Register a crop for a season", roles: [FarmManager], code: 201, input: [season_id, name, price_per_lb_cents], output: Crop, side_effects: ["season_picked_oz=0"] }
  - { method: GET, path: "/farm/crops/{id}", description: "Get a crop", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: Crop, side_effects: [] }
  - { method: GET, path: "/farm/crops", description: "List (created_at ASC) crops (filterable by season)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["season_id?", "limit?", "offset?"], output: "Crop[]", side_effects: [] }

  # --- Field ---
  - { method: POST, path: "/farm/fields", description: "Create a field (DORMANT)", roles: [FarmManager], code: 201, input: [season_id, name, rotation_group, rotation_order, estimated_harvest_oz], output: Field, side_effects: ["status=DORMANT, tallies=0"] }
  - { method: GET, path: "/farm/fields/{id}", description: "Get a field", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: Field, side_effects: [] }
  - { method: GET, path: "/farm/fields", description: "List (created_at ASC) fields (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["season_id?", "rotation_group?", "status?", "rotation_successor_field_id?", "limit?", "offset?"], output: "Field[]", side_effects: [] }
  - { method: PATCH, path: "/farm/fields/{id}", description: "Edit rotation_order / estimated_harvest_oz (OCC-guarded)", roles: [FarmManager], code: 200, input: [expected_field_version, "rotation_order?", "estimated_harvest_oz?"], output: Field, side_effects: ["increments Field.version by 1"] }
  - { method: POST, path: "/farm/fields/{id}/open", description: "Open a DORMANT field for picking (from ROTATION_REST -> ERR_FIELD_RESTING; from OPEN/PICKED_OUT/RETIRED -> ERR_INVALID_STATE)", roles: [FarmManager], code: 200, input: [], output: Field, side_effects: ["status -> OPEN; increments version"] }
  - { method: POST, path: "/farm/fields/{id}/retire", description: "Retire a field (no SCHEDULED/OPEN windows)", roles: [FarmManager], code: 200, input: [], output: Field, side_effects: ["status -> RETIRED; increments version"] }

  # --- FieldDayWindow ---
  - { method: POST, path: "/farm/field-day-windows", description: "Schedule a picking window (overlap + staffing + season-range validated)", roles: [FarmManager], code: 201, input: [field_id, date, open_time, close_time, picking_capacity_slots], output: FieldDayWindow, side_effects: ["status=SCHEDULED, booked_slots=0"] }
  - { method: GET, path: "/farm/field-day-windows/{id}", description: "Get a window", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: FieldDayWindow, side_effects: [] }
  - { method: GET, path: "/farm/field-day-windows", description: "List (created_at ASC) windows (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["field_id?", "date?", "status?", "limit?", "offset?"], output: "FieldDayWindow[]", side_effects: [] }
  - { method: POST, path: "/farm/field-day-windows/{id}/open", description: "Open a SCHEDULED window (field OPEN, day OPEN, clock within hours)", roles: [FarmManager], code: 200, input: [], output: FieldDayWindow, side_effects: ["status -> OPEN; increments version"] }
  - { method: POST, path: "/farm/field-day-windows/{id}/cancel", description: "Manually cancel a SCHEDULED window with zero bookings", roles: [FarmManager], code: 200, input: [], output: FieldDayWindow, side_effects: ["status -> CANCELLED, cancel_reason=MANUAL; increments version"] }

  # --- PricingPolicy ---
  - { method: POST, path: "/farm/pricing-policies", description: "Create a policy (supersedes the season's ACTIVE policy; OCC on Season.version)", roles: [FarmManager], code: 201, input: [season_id, expected_season_version, admission_per_person_cents, container_fee_cents, weekend_surge_bps, bundle_discount_bps, bundle_cap_cents], output: PricingPolicy, side_effects: ["prior ACTIVE policy -> SUPERSEDED; policy_version = prior + 1 (or 1); increments Season.version by 1"] }
  - { method: GET, path: "/farm/pricing-policies/{id}", description: "Get a policy", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: PricingPolicy, side_effects: [] }
  - { method: GET, path: "/farm/pricing-policies", description: "List (created_at ASC) policies (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["season_id?", "status?", "limit?", "offset?"], output: "PricingPolicy[]", side_effects: [] }

  # --- Waiver ---
  - { method: POST, path: "/farm/waivers", description: "Public signing kiosk: sign the season's CURRENT waiver text", roles: [Anonymous], code: 201, input: [season_id, signer_name, signer_email, party_member_names], output: Waiver, side_effects: ["status=SIGNED; waiver_version_signed = season.current_waiver_version"] }
  - { method: GET, path: "/farm/waivers/{id}", description: "Get a waiver", roles: [FarmManager, GateStaff], code: 200, input: [], output: Waiver, side_effects: [] }
  - { method: GET, path: "/farm/waivers", description: "List (created_at ASC) waivers (filterable)", roles: [FarmManager, GateStaff], code: 200, input: ["season_id?", "signer_email?", "limit?", "offset?"], output: "Waiver[]", side_effects: [] }
  - { method: POST, path: "/farm/waivers/{id}/void", description: "Void a signed waiver", roles: [FarmManager], code: 200, input: [], output: Waiver, side_effects: ["status -> VOIDED; increments version"] }

  # --- VisitSession ---
  - { method: POST, path: "/farm/visit-sessions", description: "Admit a party at the gate (ONLINE origin only; pins ACTIVE policy; computes admission_charge_cents)", roles: [GateStaff, FarmManager], code: 201, input: [window_id, waiver_id, party_size, container_count, parking_spaces, origin], output: VisitSession, side_effects: ["visit_status=CHECKED_IN, payment_status=UNPAID; booked_slots/booked_parking recompute"] }
  - { method: GET, path: "/farm/visit-sessions/{id}", description: "Get a session", roles: [FarmManager, GateStaff, FieldStaff, KioskDevice], code: 200, input: [], output: VisitSession, side_effects: [] }
  - { method: GET, path: "/farm/visit-sessions", description: "List (created_at ASC) sessions (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["window_id?", "waiver_id?", "pricing_policy_id?", "visit_status?", "limit?", "offset?"], output: "VisitSession[]", side_effects: [] }
  - { method: POST, path: "/farm/visit-sessions/{id}/enter-field", description: "Mark party as entered the field", roles: [FieldStaff, FarmManager], code: 200, input: [], output: VisitSession, side_effects: ["visit_status -> FIELD_ACTIVE; increments version"] }
  - { method: POST, path: "/farm/visit-sessions/{id}/checkout", description: "Normal checkout: settle final_total, release unredeemed addons, auto-refund overpayment", roles: [FieldStaff, FarmManager], code: 200, input: [], output: VisitSession, side_effects: ["visit_status -> CHECKED_OUT, checkout_mode=NORMAL; final_total_cents and bundle_discount_cents pinned; BOOKED bookings -> RELEASED (unrefunded); overpayment auto-refund; increments version"] }
  - { method: POST, path: "/farm/visit-sessions/{id}/cancel", description: "Cancel a CHECKED_IN session (full auto-refund)", roles: [GateStaff, FarmManager], code: 200, input: [], output: VisitSession, side_effects: ["visit_status -> CANCELLED; slots/parking released; BOOKED bookings -> RELEASED; full net-paid auto-refund; increments version"] }

  # --- HarvestLine ---
  - { method: POST, path: "/farm/harvest-lines", description: "Staff weigh-out at the field (creates FINALIZED line; updates tallies; may trigger PICKED_OUT cascade)", roles: [FieldStaff, FarmManager], code: 201, input: [session_id, crop_id, gross_weight_oz, container_count], output: HarvestLine, side_effects: ["status=FINALIZED (online); tare_oz/net_oz/line_charge_cents computed; Field.committed_picked_oz += net_oz; Crop.season_picked_oz += net_oz; Field.version and Crop.version increment; PICKED_OUT cascade when threshold crossed"] }
  - { method: GET, path: "/farm/harvest-lines/{id}", description: "Get a harvest line", roles: [FarmManager, FieldStaff], code: 200, input: [], output: HarvestLine, side_effects: [] }
  - { method: GET, path: "/farm/harvest-lines", description: "List (created_at ASC) harvest lines (filterable)", roles: [FarmManager, FieldStaff], code: 200, input: ["session_id?", "field_id?", "crop_id?", "status?", "limit?", "offset?"], output: "HarvestLine[]", side_effects: [] }
  - { method: POST, path: "/farm/harvest-lines/{id}/finalize", description: "Verify a PROVISIONAL (offline-uploaded) line", roles: [FieldStaff, FarmManager], code: 200, input: [], output: HarvestLine, side_effects: ["status -> FINALIZED; tallies increment like a fresh line; PICKED_OUT cascade may fire; increments version"] }
  - { method: POST, path: "/farm/harvest-lines/{id}/void", description: "Void a line before its session checks out (reverses tallies if FINALIZED)", roles: [FieldStaff, FarmManager], code: 200, input: [], output: HarvestLine, side_effects: ["status -> VOIDED; committed/projected tallies reverse; increments version"] }

  # --- AddonProduct ---
  - { method: POST, path: "/farm/addon-products", description: "Create an agritourism add-on (wagon ride / cafe voucher)", roles: [FarmManager], code: 201, input: [season_id, kind, name, price_cents, slot_capacity], output: AddonProduct, side_effects: [] }
  - { method: GET, path: "/farm/addon-products/{id}", description: "Get an add-on product", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: AddonProduct, side_effects: [] }
  - { method: GET, path: "/farm/addon-products", description: "List (created_at ASC) add-on products (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["season_id?", "kind?", "limit?", "offset?"], output: "AddonProduct[]", side_effects: [] }

  # --- AddonBooking ---
  - { method: POST, path: "/farm/addon-bookings", description: "Book add-on units for a session (aggregate slot capacity enforced)", roles: [GateStaff, FarmManager], code: 201, input: [session_id, addon_product_id, booking_date, slot_time, qty], output: AddonBooking, side_effects: ["status=BOOKED; booked_value_cents pinned"] }
  - { method: GET, path: "/farm/addon-bookings/{id}", description: "Get a booking", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: AddonBooking, side_effects: [] }
  - { method: GET, path: "/farm/addon-bookings", description: "List (created_at ASC) bookings (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["session_id?", "addon_product_id?", "booking_date?", "status?", "limit?", "offset?"], output: "AddonBooking[]", side_effects: [] }
  - { method: POST, path: "/farm/addon-bookings/{id}/redeem", description: "Redeem a booking on its date while the session is on-site", roles: [FieldStaff, FarmManager], code: 200, input: [], output: AddonBooking, side_effects: ["status -> REDEEMED; increments version"] }
  - { method: POST, path: "/farm/addon-bookings/{id}/release", description: "Manually release a BOOKED booking (face-value refund to the session ledger)", roles: [GateStaff, FarmManager], code: 200, input: [], output: AddonBooking, side_effects: ["status -> RELEASED; slot capacity freed; auto-refund booked_value_cents; increments version"] }

  # --- Payment ---
  - { method: POST, path: "/farm/payments", description: "Collect a CHARGE payment (CASH/CARD settle immediately; idempotent per idempotency_key)", roles: [GateStaff, FieldStaff, FarmManager], code: 201, input: [session_id, kind, method, amount_cents, idempotency_key], output: Payment, side_effects: ["PENDING -> SETTLED for CASH/CARD; session.total_paid_cents += amount; payment_status recompute; SalesDay.revenue_cents recompute"] }
  - { method: GET, path: "/farm/payments/{id}", description: "Get a payment", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/farm/payments", description: "List (created_at ASC) payments (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["session_id?", "status?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/farm/payments/{id}/refund", description: "Refund against a SETTLED/PARTIALLY_REFUNDED CHARGE payment", roles: [FarmManager], code: 200, input: [amount_cents], output: Payment, side_effects: ["refunded_amount_cents += amount; status -> PARTIALLY_REFUNDED or REFUNDED at exact equality; session.total_refunded_cents and payment_status recompute; increments version"] }

  # --- SalesDay ---
  - { method: POST, path: "/farm/sales-days", description: "Plan an operating day (unique per season+date)", roles: [FarmManager], code: 201, input: [season_id, date, day_type, parking_capacity, staff_on_duty], output: SalesDay, side_effects: ["status=PLANNED, tallies=0"] }
  - { method: GET, path: "/farm/sales-days/{id}", description: "Get a sales day", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: [], output: SalesDay, side_effects: [] }
  - { method: GET, path: "/farm/sales-days", description: "List (created_at ASC) sales days (filterable)", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["season_id?", "date?", "status?", "limit?", "offset?"], output: "SalesDay[]", side_effects: [] }
  - { method: POST, path: "/farm/sales-days/{id}/open-day", description: "Open the day (clock date must match; runs ROTATION_REST -> DORMANT sweep)", roles: [FarmManager], code: 200, input: [], output: SalesDay, side_effects: ["status -> OPEN; rested fields with rest_until <= date -> DORMANT; increments version"] }
  - { method: POST, path: "/farm/sales-days/{id}/close-day", description: "Normal close: force DAY_END checkout of on-site sessions, close windows, sweep PICKED_OUT fields to ROTATION_REST", roles: [FarmManager], code: 200, input: [], output: SalesDay, side_effects: ["status -> CLOSED_NORMAL; on-site sessions -> CHECKED_OUT (DAY_END_FORCED, PROVISIONAL lines voided); OPEN windows -> CLOSED; PICKED_OUT fields -> ROTATION_REST with rest_until = date + 7d; increments version"] }
  - { method: POST, path: "/farm/sales-days/{id}/close-weather", description: "Weather closure: cancels the day's windows, force-checks-out on-site sessions with tiered refunds, releases the day's BOOKED addons", roles: [FarmManager], code: 200, input: [], output: SalesDay, side_effects: ["status -> CLOSED_WEATHER; closed_at_time pinned from clock; windows -> CANCELLED(WEATHER); on-site sessions -> CHECKED_OUT(WEATHER_FORCED) with weather_refund applied; PROVISIONAL lines voided; BOOKED bookings of the date -> RELEASED with refund; revenue_cents recompute; increments version"] }

  # --- OfflineBatch ---
  - { method: POST, path: "/farm/offline-batches", description: "Upload an offline batch (idempotent per (device_id, batch_id)); records apply in sequence_index order", roles: [KioskDevice, FarmManager], code: 201, input: [device_id, batch_id, records], output: OfflineBatch, side_effects: ["sessions/payments/lines created per records; SYNC_CONFLICT records void their sessions; batch status APPLIED or PARTIALLY_APPLIED"] }
  - { method: GET, path: "/farm/offline-batches/{id}", description: "Get a batch with per-record results", roles: [KioskDevice, FarmManager], code: 200, input: [], output: OfflineBatch, side_effects: [] }

  # --- Computed read + clock ---
  - { method: GET, path: "/farm/availability-calendar", description: "Crop availability calendar. Returns an object whose rows array carries one entry per non-CANCELLED window in [from_date, to_date]; each row is { date, window_id, field_id, field_name, field_status, window_status, open_time, close_time, picking_capacity_slots, booked_slots, projected_remaining_oz }", roles: [FarmManager, GateStaff, FieldStaff], code: 200, input: ["from_date", "to_date", "field_id?"], output: "{ rows: array }", side_effects: [] }
  - { method: POST, path: "/farm/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All time-window rules (window hours, open-day date match, refund tier, rest sweeps) read this clock.", roles: [FarmManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["no entity mutation; pure clock advance"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid/undeclared request fields; enum out of range; close_time <= open_time; party_size < 1; amount_cents <= 0; batch structural errors (duplicate sequence_index, unknown record_type, empty records)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or missing X-User-ID for a non-Anonymous role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version below the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The addressed resource's own state does not permit the requested transition (e.g., open an already-OPEN field, checkout a CHECKED_OUT session, void a line whose session is CHECKED_OUT, redeem a RELEASED booking)" }
  - { id: ERR_SEASON_NOT_ACTIVE, http: 409, condition: "Operation requires the season to be ACTIVE" }
  - { id: ERR_FIELD_NOT_OPEN, http: 409, condition: "Operation requires the field to be OPEN (window open, enter-field, harvest line create/finalize)" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 409, condition: "Operation requires the window to be OPEN (session create, enter-field)" }
  - { id: ERR_SESSION_NOT_ACTIVE, http: 409, condition: "Operation requires the session to be FIELD_ACTIVE (harvest line) or non-terminal (payments)" }
  - { id: ERR_LINE_NOT_PROVISIONAL, http: 409, condition: "Finalize requires the line to be PROVISIONAL" }
  - { id: ERR_BOOKING_NOT_REDEEMABLE, http: 409, condition: "Redeem requires session visit_status IN {CHECKED_IN, FIELD_ACTIVE} and clock date == booking_date" }
  - { id: ERR_DAY_NOT_OPEN, http: 409, condition: "Operation requires the SalesDay to be OPEN (window open, session create)" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "Session create requires an ACTIVE PricingPolicy for the season" }
  - { id: ERR_SALES_DAY_EXISTS, http: 409, condition: "A SalesDay already exists for (season_id, date)" }
  - { id: ERR_WAIVER_VOIDED, http: 422, condition: "Waiver status is VOIDED at session create / enter-field / offline apply" }
  - { id: ERR_WAIVER_STALE, http: 422, condition: "waiver_version_signed != season.current_waiver_version" }
  - { id: ERR_WAIVER_PARTY_MISMATCH, http: 422, condition: "len(waiver.party_member_names) < session party_size" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "New window's half-open [open_time, close_time) intersects another non-CANCELLED window on the same field and date" }
  - { id: ERR_DATE_OUTSIDE_SEASON, http: 422, condition: "Window or SalesDay date outside the season [start_date, end_date]" }
  - { id: ERR_FIELD_RESTING, http: 422, condition: "Field open blocked: rest_until >= current date, or field is in ROTATION_REST when /open is attempted" }
  - { id: ERR_OUTSIDE_WINDOW_HOURS, http: 422, condition: "Logical clock outside the action's time window (window open outside [open_time, close_time); open-day on a non-matching date)" }
  - { id: ERR_WINDOW_CAPACITY_FULL, http: 422, condition: "booked_slots + party_size > picking_capacity_slots (online); offline beyond capacity + OFFLINE_OVERBOOK_ALLOWANCE_SLOTS is a SYNC_CONFLICT instead" }
  - { id: ERR_PARKING_FULL, http: 422, condition: "booked_parking + parking_spaces > parking_capacity" }
  - { id: ERR_INSUFFICIENT_STAFFING, http: 422, condition: "ceil(total window slots on date / 25) > staff_on_duty" }
  - { id: ERR_ADDON_SLOT_FULL, http: 422, condition: "slot_used + qty > slot_capacity for the (product, date, slot_time) pool" }
  - { id: ERR_FIELD_DEPLETED, http: 422, condition: "Session create blocked: window's field.projected_remaining_oz <= 0" }
  - { id: ERR_TARE_EXCEEDS_GROSS, http: 422, condition: "gross_weight_oz - container_count * TARE_OZ_PER_CONTAINER < 0" }
  - { id: ERR_UNRESOLVED_LINES, http: 422, condition: "Checkout blocked: session has PROVISIONAL harvest lines" }
  - { id: ERR_CROSS_SCOPE_REFERENCE, http: 422, condition: "Referenced entities belong to different seasons, or booking_date != session window date" }
  - { id: ERR_PAYMENT_AMOUNT_INVALID, http: 422, condition: "Payment amount exceeds the session's outstanding obligation" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "Refund amount exceeds the payment's remaining unrefunded amount" }
  - { id: ERR_UNPAID_BALANCE, http: 422, condition: "Net paid below admission charge (enter-field) or below final total (checkout)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FarmManager
    description: "Farm owner/operator; superset of every operational role plus exclusive admin and refund authority"
    identity: opaque
    exclusive_operations:
      - "Season/Crop/Field/Window/Policy/AddonProduct/SalesDay create + lifecycle actions (activate, archive, config, open, retire, open-day, close-day, close-weather, window cancel)"
      - "POST /farm/payments/{id}/refund (manual refunds)"
      - "POST /farm/waivers/{id}/void"
      - "POST /farm/_clock/set_current_utc"
    shared_operations:
      - "All GateStaff and FieldStaff operations (session create/cancel, enter-field, checkout, harvest lines, bookings, payments)"
      - "All read endpoints; offline batch upload and read"
  - name: GateStaff
    description: "Front-gate admission staff"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /farm/visit-sessions, POST /farm/visit-sessions/{id}/cancel"
      - "POST /farm/addon-bookings, POST /farm/addon-bookings/{id}/release"
      - "POST /farm/payments (admission collection)"
      - "GET read endpoints (except harvest-lines single/list and offline batch detail)"
      - "GET /farm/waivers, GET /farm/waivers/{id}"
  - name: FieldStaff
    description: "Field weigh-station and checkout staff"
    identity: opaque
    exclusive_operations:
      - "POST /farm/harvest-lines, /finalize, /void (weigh-out authority)"
      - "POST /farm/visit-sessions/{id}/enter-field, /checkout"
      - "POST /farm/addon-bookings/{id}/redeem"
    shared_operations:
      - "POST /farm/payments (field collection)"
      - "GET read endpoints (except waivers and offline batch detail)"
  - name: KioskDevice
    description: "Offline POS device uploading end-of-day batches"
    identity: opaque
    exclusive_operations:
      - "POST /farm/offline-batches"
    shared_operations:
      - "GET /farm/offline-batches/{id}"
      - "GET /farm/seasons/{id}, GET /farm/visit-sessions/{id}"
  - name: Anonymous
    description: "Unauthenticated public signer at the waiver kiosk"
    identity: opaque
    exclusive_operations:
      - "POST /farm/waivers"
    shared_operations: []
