            - call: "POST /capacity-reservations"
              payload: { project_id: "${pr_id}", exhaust_cfm: 12000, power_kw: 180, expected_building_version: "${b_ver}" }
              as: LandlordAssetManager
              captures: { res_id: "$.data.id" }
