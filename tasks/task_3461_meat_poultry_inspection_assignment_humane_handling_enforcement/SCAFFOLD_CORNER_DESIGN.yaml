              payload: { full_name: "Ina Inspector", badge_number: "B-V201", species_qualifications: ["CATTLE"] }
              as: ProgramAdministrator
              captures: { insp_id: $.data.id }
            - call: "POST /inspection/noncompliance-records"
              payload: { establishment_id: "${est_id}", issued_by_inspector_id: "${insp_id}", regulation_family: "SANITATION", description: "qualifying nr", observed_at: "2026-08-31T06:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /inspection/establishments/${est_id}"
              as: DistrictManager
              captures: { est_v: $.data.version }
          trigger:
            - call: "POST /inspection/establishments/${est_id}/enforcement-actions"
              payload: { action_type: "WITHHOLD_MARKS", basis: "NR_LINKAGE", regulation_family: "SANITATION", expected_establishment_version: "${est_v}" }
              as: DistrictManager
              captures: { ea1: $.data.id }
            - call: "POST /inspection/establishments/${est_id}/enforcement-actions"
              payload: { action_type: "NOTICE_OF_INTENDED_ENFORCEMENT", basis: "ADMINISTRATIVE", expected_establishment_version: "${est_v}" }
              as: DistrictManager
              captures: { error_id: $.data.error_id }
          assert:
            - "first create returns 201 (fresh version accepted)"
            - "second create with the same version: response status 412 and error_id == ERR_STALE_ESTABLISHMENT_VERSION"
            - "GET /inspection/establishments/${est_id}/enforcement-actions returns exactly 1 row (only the first create landed)"

