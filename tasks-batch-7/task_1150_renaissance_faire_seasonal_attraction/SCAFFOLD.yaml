# =============================================================================
# Task 1150: Renaissance Faire & Seasonal Attraction Operations — seed tables
# =============================================================================

scenario: |
  1150. Renaissance Faire & Seasonal Attraction Operations (Renaissance faire operator): cast/performer contracting & rehearsal schedule, vendor/artisan jury & booth fee structure, ticketing (day/season pass) & group rates, weather day cancellation & rain check, food/beverage licensing & health permit, weekend staffing & volunteer program, site build/strike between seasons, guest conduct & costume policy

domain_name: renaissance-faire
api_prefix: /

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating        # Season.readiness_posture gates faire-day sales, season opening
  secondary_archetype: temporal_windowing         # rehearsal stages, booth residencies, volunteer shifts
  complexity_layers:
    - optimistic_concurrency                      # OCC on Season.version and TicketOrder.version
    - cascading_side_effects                      # weather cancellation & conduct-revoke cascades
    - dual_variant_calculation                    # booth fee provisional/final; cast payout accrual/guarantee
    - rate_threshold_triggers                     # group-rate tiers, volunteer-hours posture threshold
  entity_topology: flat                           # peer entities with FK references; no URL nesting
  state_machine_shape: posture_driven             # Season posture gates children; cyclic + parallel machines elsewhere
  relationship_patterns:
    - one_to_many                                 # Season -> FaireDay, TicketOrder -> Ticket, ...
    - self_referential                            # BuildTask.depends_on_task_ids (same-season DAG)
    - cross_aggregate                             # ConductCase -> TicketOrder / FoodPermit; BoothAssignment -> FoodPermit gate
  role_model: hierarchical_override               # FaireOperator superset over specialized coordinator roles
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 13
  calculation_count: 11
  validation_layers: 9
  endpoint_count: 82
  error_code_count: 80
  role_count: 10

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable season name (e.g. 'Summer Revel 2026')" }
      - { name: status, type: enum, source: system, description: "PLANNING | BUILD | OPEN | STRIKE | CLOSED" }
      - { name: readiness_posture, type: enum, source: computed, description: "BLOCKED | CONDITIONAL | READY — derived per readiness_posture calculation" }
      - { name: opening_date, type: datetime, source: input, description: "First calendar day of the season (00:00:00Z)" }
      - { name: closing_date, type: datetime, source: input, description: "Last calendar day of the season (00:00:00Z); must be >= opening_date" }
      - { name: daily_capacity, type: integer, source: input, description: "Max day-ticket admissions per FaireDay; >= 1" }
      - { name: group_min_size, type: integer, source: input, description: "Minimum quantity for a GROUP ticket order; >= 2" }
      - { name: volunteer_min_hours, type: number, source: input, description: "Confirmed volunteer hours required for readiness_posture READY; >= 0" }
      - { name: weather_call_deadline_hour, type: integer, source: input, description: "Local-hour offset into a faire day by which a weather cancellation must be called; 0..23" }
      - { name: rain_check_grace_days, type: integer, source: input, description: "Days after closing_date that rain checks remain redeemable; >= 0" }
      - { name: volunteer_confirmed_hours, type: number, source: computed, description: "Sum of hours over VolunteerShift of this season with status IN {CONFIRMED, WORKED}" }
      - { name: outstanding_admissions, type: integer, source: computed, description: "count(Ticket status VALID in season) + count(RainCheck status ISSUED in season) — conserved across cancel/redeem pairs" }
      - { name: season_weeks, type: integer, source: computed, description: "ceil((closing_date - opening_date) / 7 days); used by booth fee calculations" }

  - name: FaireDay
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; owning season" }
      - { name: date, type: datetime, source: input, description: "Calendar date of operation (00:00:00Z); must fall within [opening_date, closing_date]" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN_FOR_SALES | WEATHER_HOLD | OPERATING | COMPLETED | CANCELLED_WEATHER" }
      - { name: tickets_sold_count, type: integer, source: computed, description: "count(Ticket with faire_day_id = this and status IN {VALID, REDEEMED})" }

  - name: Performer
    parent: null
    common_fields: true
    fields:
      - { name: stage_name, type: string, source: input, description: "Performer stage name" }
      - { name: act_type, type: enum, source: input, description: "MUSIC | COMBAT | COMEDY | ACROBATICS | ROVING" }
      - { name: base_day_rate_cents, type: integer, source: input, description: "Reference day rate; >= 0" }

  - name: CastContract
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: performer_id, type: string, source: input, description: "FK -> Performer.id; Performer-role callers must own this id" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | COUNTERED | ACCEPTED | REHEARSING | PERFORMING | COMPLETED | TERMINATED" }
      - { name: offered_day_rate_cents, type: integer, source: input, description: "Director's current offered day rate; >= 0" }
      - { name: countered_day_rate_cents, type: integer, source: system, description: "Performer's last counter rate; null until first counter" }
      - { name: guaranteed_days, type: integer, source: input, description: "Number of faire days with guaranteed pay; >= 0" }
      - { name: weather_pay_pct, type: number, source: input, description: "Fraction of offered_day_rate_cents paid per weather-cancelled day; 0..1 inclusive" }
      - { name: required_rehearsal_hours, type: number, source: input, description: "Rehearsal hours required before PERFORMING; >= 0" }
      - { name: completed_rehearsal_hours, type: number, source: computed, description: "Sum of hours_credit over ATTENDED RehearsalSlots of this contract" }
      - { name: negotiation_round, type: integer, source: computed, description: "0 in DRAFT; +1 on each offer and each counter" }
      - { name: accrued_payout_cents, type: integer, source: computed, description: "Chronological weather-adjusted accrual per cast_accrued_payout" }
      - { name: final_payout_cents, type: integer, source: computed, description: "Guarantee-floor payout per cast_final_payout; set at COMPLETED or TERMINATED" }

  - name: RehearsalSlot
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> CastContract.id" }
      - { name: stage_name, type: string, source: input, description: "Rehearsal stage resource identifier" }
      - { name: start_time, type: datetime, source: input, description: "Slot start (ISO8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Slot end; must be > start_time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ATTENDED | NO_SHOW | CANCELLED" }
      - { name: hours_credit, type: number, source: computed, description: "(end_time - start_time) in hours when ATTENDED, else 0" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Vendor business name" }
      - { name: category, type: enum, source: input, description: "FOOD | BEVERAGE | ARTISAN | GAMES" }

  - name: VendorApplication
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; set from X-User-ID of the creating Vendor caller" }
      - { name: status, type: enum, source: system, description: "JURY_REVIEW | JURIED_IN | JURIED_OUT | WAITLISTED | APPEALED | WITHDRAWN" }
      - { name: booth_size_sqft, type: integer, source: input, description: "Requested booth footprint; >= 1" }
      - { name: requested_location_tier, type: enum, source: input, description: "PRIME | STANDARD | MEADOW" }
      - { name: craft_score, type: number, source: system, description: "Jury criterion score 0..10, set by decide" }
      - { name: authenticity_score, type: number, source: system, description: "Jury criterion score 0..10, set by decide" }
      - { name: safety_score, type: number, source: system, description: "Jury criterion score 0..10, set by decide" }
      - { name: jury_score, type: number, source: computed, description: "Weighted jury score per jury_score calculation; null until first decide" }
      - { name: appeal_used, type: boolean, source: system, description: "True once the single appeal has been consumed", default: false }

  - name: BoothAssignment
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; copied from the VendorApplication" }
      - { name: application_id, type: string, source: input, description: "FK -> VendorApplication.id; must be JURIED_IN" }
      - { name: booth_site, type: string, source: input, description: "Booth site resource identifier" }
      - { name: residency_start_date, type: datetime, source: input, description: "Residency start date (00:00:00Z), half-open interval start" }
      - { name: residency_end_date, type: datetime, source: input, description: "Residency end date (00:00:00Z), exclusive; must be > residency_start_date" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | SUSPENDED | RELEASED | SETTLED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Forward-looking fee quoted at reservation per booth_provisional_fee" }
      - { name: weather_credit_cents, type: integer, source: computed, description: "Accumulated per-day rain credits per weather_vendor_credit; starts 0" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Settlement fee per booth_final_fee; set at SETTLED" }
      - { name: settlement_delta_cents, type: integer, source: computed, description: "final_fee_cents - provisional_fee_cents; set at SETTLED (negative = refund due to vendor)" }

  - name: FoodPermit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> VendorApplication.id; application must be JURIED_IN and vendor category FOOD or BEVERAGE" }
      - { name: status, type: enum, source: system, description: "APPLIED | ISSUED | AWAITING_REINSPECTION | FAILED_FINAL | REVOKED | EXPIRED" }
      - { name: permit_number, type: string, source: system, description: "Server-minted permit number; null until ISSUED" }
      - { name: inspection_attempts, type: integer, source: system, description: "Count of recorded inspections; starts 0" }
      - { name: expiry_date, type: datetime, source: system, description: "season.closing_date + PERMIT_GRACE_DAYS days, set at ISSUED" }

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: buyer_email, type: string, source: system, description: "Set from X-User-ID of the creating Guest caller" }
      - { name: order_type, type: enum, source: input, description: "DAY | SEASON | GROUP" }
      - { name: quantity, type: integer, source: input, description: "Ticket count; >= 1; GROUP requires >= season.group_min_size" }
      - { name: faire_day_id, type: string, source: input, description: "FK -> FaireDay.id; required iff order_type IN {DAY, GROUP}; forbidden for SEASON" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per ticket; >= 0" }
      - { name: discount_pct, type: number, source: computed, description: "Applied group discount fraction per ticket_order_total" }
      - { name: total_cents, type: integer, source: computed, description: "Order total per ticket_order_total" }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunded amount; starts 0" }
      - { name: retained_cents, type: integer, source: computed, description: "total_cents - refunded_cents; money invariant: refunded_cents + retained_cents == total_cents" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | PARTIALLY_REFUNDED | REFUNDED" }
      - { name: redemption_status, type: enum, source: system, description: "UNREDEEMED | PARTIALLY_REDEEMED | FULLY_REDEEMED | RAINCHECKED | VOID" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> TicketOrder.id; minted on pay or on rain-check redemption" }
      - { name: faire_day_id, type: string, source: system, description: "FK -> FaireDay.id; null for SEASON passes" }
      - { name: ticket_type, type: enum, source: system, description: "DAY | SEASON" }
      - { name: status, type: enum, source: system, description: "VALID | REDEEMED | RAINCHECKED | VOID | EXPIRED" }
      - { name: redeemed_at, type: datetime, source: system, description: "Server timestamp of gate redemption; null until REDEEMED" }

  - name: RainCheck
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; copied from the cancelled FaireDay" }
      - { name: ticket_id, type: string, source: system, description: "FK -> Ticket.id; the RAINCHECKED source ticket (1:1)" }
      - { name: issued_for_day_id, type: string, source: system, description: "FK -> FaireDay.id; the weather-cancelled day" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | EXPIRED" }
      - { name: redeem_by_date, type: datetime, source: computed, description: "season.closing_date + rain_check_grace_days days; redemption allowed iff clock_now <= redeem_by_date" }
      - { name: redeemed_on_day_id, type: string, source: system, description: "FK -> FaireDay.id; target day of redemption; null until REDEEMED" }

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: faire_day_id, type: string, source: input, description: "FK -> FaireDay.id" }
      - { name: volunteer_handle, type: string, source: system, description: "Set from X-User-ID of the creating Volunteer caller" }
      - { name: role, type: enum, source: input, description: "GATE | PARKING | TAVERN | INFO | BACKSTAGE" }
      - { name: start_time, type: datetime, source: input, description: "Shift start (ISO8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Shift end; must be > start_time" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | CONFIRMED | WORKED | NO_SHOW | CANCELLED" }
      - { name: hours, type: number, source: computed, description: "(end_time - start_time) in hours" }

  - name: ConductCase
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: category, type: enum, source: input, description: "COSTUME_POLICY | WEAPON_UNTIED | BEHAVIOR | VENDOR_CONDUCT" }
      - { name: subject_description, type: string, source: input, description: "Free-text description of the subject and violation" }
      - { name: linked_order_id, type: string, source: input, description: "FK -> TicketOrder.id; required when sanction BAN_GUEST will apply, else optional" }
      - { name: linked_permit_id, type: string, source: input, description: "FK -> FoodPermit.id; required when category is VENDOR_CONDUCT, else optional" }
      - { name: status, type: enum, source: system, description: "REPORTED | UPHELD | DISMISSED" }
      - { name: sanction, type: enum, source: system, description: "NONE | BAN_GUEST | REVOKE_PERMIT; set at resolve" }

  - name: BuildTask
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: phase, type: enum, source: input, description: "BUILD | STRIKE" }
      - { name: name, type: string, source: input, description: "Task name (e.g. 'Erect main stage')" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | DONE" }
      - { name: depends_on_task_ids, type: array, source: input, description: "FK -> BuildTask.id (array, self-referential, same season); dependency graph must remain acyclic" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: BUILD
        trigger: "POST /seasons/{id}/begin-build"
        actor: FaireOperator
        preconditions:
          - "Season.status == PLANNING (else ERR_SEASON_NOT_IN_PLANNING)"
        side_effects: []

      - from: BUILD
        to: OPEN
        trigger: "POST /seasons/{id}/open"
        actor: FaireOperator
        preconditions:
          - "Season.status == BUILD (else ERR_SEASON_INVALID_STATE)"
          - "readiness_posture == READY (else ERR_SEASON_NOT_READY)"
        side_effects:
          - "Every CastContract of this season in ACCEPTED or REHEARSING with completed_rehearsal_hours >= required_rehearsal_hours -> PERFORMING"
          - "readiness_posture re-derived (readiness_posture calculation)"

      - from: OPEN
        to: STRIKE
        trigger: "POST /seasons/{id}/begin-strike"
        actor: FaireOperator
        preconditions:
          - "Season.status == OPEN (else ERR_SEASON_INVALID_STATE)"
          - "Every FaireDay of this season in terminal state {COMPLETED, CANCELLED_WEATHER} (else ERR_UNRESOLVED_FAIRE_DAYS)"
        side_effects:
          - "Every CastContract in {ACCEPTED, REHEARSING, PERFORMING} -> COMPLETED; cast_final_payout computed and final_payout_cents set"
          - "Every Ticket with ticket_type SEASON and status VALID -> EXPIRED; Season.outstanding_admissions recomputed"

      - from: STRIKE
        to: CLOSED
        trigger: "POST /seasons/{id}/close"
        actor: FaireOperator
        preconditions:
          - "Season.status == STRIKE (else ERR_SEASON_INVALID_STATE)"
          - "Every BoothAssignment of this season in {SETTLED, RELEASED} (else ERR_UNSETTLED_BOOTHS)"
          - "Every BuildTask with phase STRIKE is DONE (else ERR_STRIKE_TASKS_INCOMPLETE)"
        side_effects:
          - "Every RainCheck ISSUED with redeem_by_date < clock now -> EXPIRED; Season.outstanding_admissions decremented per expired check"

  - entity: FaireDay
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_WEATHER]
    transitions:
      - from: SCHEDULED
        to: OPEN_FOR_SALES
        trigger: "POST /faire-days/{id}/open-sales"
        actor: FaireOperator
        preconditions:
          - "FaireDay.status == SCHEDULED (else ERR_DAY_NOT_OPENABLE)"
          - "Season.status IN {BUILD, OPEN} (else ERR_SEASON_INVALID_STATE)"
          - "Season.readiness_posture != BLOCKED (else ERR_SEASON_POSTURE_BLOCKED)"
        side_effects: []

      - from: OPEN_FOR_SALES
        to: WEATHER_HOLD
        trigger: "POST /faire-days/{id}/weather-hold"
        actor: FaireOperator
        preconditions:
          - "FaireDay.status == OPEN_FOR_SALES (else ERR_DAY_NOT_HOLDABLE)"
        side_effects: []

      - from: WEATHER_HOLD
        to: OPEN_FOR_SALES
        trigger: "POST /faire-days/{id}/release-hold"
        actor: FaireOperator
        preconditions:
          - "FaireDay.status == WEATHER_HOLD (else ERR_DAY_NOT_ON_HOLD)"
        side_effects: []

      - from: OPEN_FOR_SALES
        to: CANCELLED_WEATHER
        trigger: "POST /faire-days/{id}/cancel-weather"
        actor: FaireOperator
        preconditions:
          - "FaireDay.status IN {OPEN_FOR_SALES, WEATHER_HOLD} (else ERR_DAY_NOT_CANCELLABLE)"
          - "clock now < date + season.weather_call_deadline_hour hours (else ERR_WEATHER_CALL_TOO_LATE)"
        side_effects:
          - "L1a: every Ticket with faire_day_id = this, ticket_type DAY, status VALID -> RAINCHECKED; one RainCheck (ISSUED) created per such ticket with redeem_by_date = season.closing_date + rain_check_grace_days; owning orders' redemption_status recomputed (RAINCHECKED when all tickets RAINCHECKED)"
          - "L1b: every VolunteerShift of this day in {SIGNED_UP, CONFIRMED} -> CANCELLED"
          - "L2: Season.volunteer_confirmed_hours recomputed (hours of CONFIRMED shifts cancelled in L1b removed)"
          - "L3: Season.readiness_posture re-derived from the new volunteer_confirmed_hours"
          - "L1c: every CastContract of the season in {ACCEPTED, REHEARSING, PERFORMING}: accrued_payout_cents += round_half_up(offered_day_rate_cents * weather_pay_pct) per cast_accrued_payout"
          - "L1d: every BoothAssignment of the season in {RESERVED, CONFIRMED, SUSPENDED} whose [residency_start_date, residency_end_date) covers this date: weather_credit_cents += daily credit per weather_vendor_credit (rounded per day)"
          - "Season.outstanding_admissions unchanged by L1a (each VALID ticket converts to one ISSUED rain check)"

      - from: WEATHER_HOLD
        to: CANCELLED_WEATHER
        trigger: "POST /faire-days/{id}/cancel-weather"
        actor: FaireOperator
        preconditions:
          - "Same as OPEN_FOR_SALES -> CANCELLED_WEATHER"
        side_effects:
          - "Same cascade as OPEN_FOR_SALES -> CANCELLED_WEATHER"

      - from: OPEN_FOR_SALES
        to: OPERATING
        trigger: "POST /faire-days/{id}/open-gates"
        actor: FaireOperator
        preconditions:
          - "FaireDay.status == OPEN_FOR_SALES (else ERR_DAY_NOT_OPENABLE)"
          - "Season.status == OPEN (else ERR_SEASON_NOT_OPEN)"
          - "clock now calendar date == date (else ERR_DAY_NOT_TODAY)"
        side_effects: []

      - from: OPERATING
        to: COMPLETED
        trigger: "POST /faire-days/{id}/complete"
        actor: FaireOperator
        preconditions:
          - "FaireDay.status == OPERATING (else ERR_DAY_NOT_COMPLETABLE)"
          - "Every VolunteerShift of this day in terminal state {WORKED, NO_SHOW, CANCELLED} (else ERR_OPEN_SHIFTS_EXIST)"
        side_effects:
          - "Every Ticket with faire_day_id = this, ticket_type DAY, status VALID -> EXPIRED; Season.outstanding_admissions decremented per expired ticket"
          - "Every CastContract of the season in PERFORMING: accrued_payout_cents += offered_day_rate_cents per cast_accrued_payout"

  - entity: CastContract
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /cast-contracts/{id}/offer"
        actor: CastDirector
        preconditions:
          - "CastContract.status IN {DRAFT, COUNTERED} (else ERR_CONTRACT_NOT_OFFERABLE)"
          - "Season.status IN {PLANNING, BUILD} (else ERR_SEASON_INVALID_STATE)"
        side_effects:
          - "negotiation_round += 1"
          - "When transitioning from COUNTERED and the offer payload omits offered_day_rate_cents: offered_day_rate_cents := countered_day_rate_cents"

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /cast-contracts/{id}/offer"
        actor: CastDirector
        preconditions:
          - "Same as DRAFT -> OFFERED"
        side_effects:
          - "Same as DRAFT -> OFFERED"

      - from: OFFERED
        to: COUNTERED
        trigger: "POST /cast-contracts/{id}/counter"
        actor: Performer
        preconditions:
          - "CastContract.status == OFFERED (else ERR_CONTRACT_NOT_OFFERED)"
          - "X-User-ID == CastContract.performer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "countered_day_rate_cents := payload rate; negotiation_round += 1"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /cast-contracts/{id}/accept"
        actor: Performer
        preconditions:
          - "CastContract.status == OFFERED (else ERR_CONTRACT_NOT_OFFERED)"
          - "X-User-ID == CastContract.performer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: ACCEPTED
        to: REHEARSING
        trigger: "system (automatic when a RehearsalSlot of this contract transitions to ATTENDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REHEARSING
        to: PERFORMING
        trigger: "system (on Season BUILD -> OPEN when completed_rehearsal_hours >= required_rehearsal_hours)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: PERFORMING
        trigger: "system (on Season BUILD -> OPEN when completed_rehearsal_hours >= required_rehearsal_hours)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PERFORMING
        to: COMPLETED
        trigger: "system (on Season OPEN -> STRIKE)"
        actor: system
        preconditions: []
        side_effects:
          - "final_payout_cents computed per cast_final_payout (guarantee floor minus rehearsal shortfall penalty)"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "system (on Season OPEN -> STRIKE)"
        actor: system
        preconditions: []
        side_effects:
          - "final_payout_cents computed per cast_final_payout"

      - from: REHEARSING
        to: COMPLETED
        trigger: "system (on Season OPEN -> STRIKE)"
        actor: system
        preconditions: []
        side_effects:
          - "final_payout_cents computed per cast_final_payout"

      - from: DRAFT
        to: TERMINATED
        trigger: "POST /cast-contracts/{id}/terminate"
        actor: CastDirector
        preconditions:
          - "CastContract.status IN {DRAFT, OFFERED, COUNTERED, ACCEPTED, REHEARSING, PERFORMING} (else ERR_CONTRACT_NOT_TERMINABLE)"
        side_effects:
          - "final_payout_cents := accrued_payout_cents (no guarantee floor on termination)"
          - "Every RehearsalSlot of this contract in SCHEDULED -> CANCELLED"

      - from: OFFERED
        to: TERMINATED
        trigger: "POST /cast-contracts/{id}/terminate"
        actor: CastDirector
        preconditions: ["Same as DRAFT -> TERMINATED"]
        side_effects: ["Same as DRAFT -> TERMINATED"]

      - from: COUNTERED
        to: TERMINATED
        trigger: "POST /cast-contracts/{id}/terminate"
        actor: CastDirector
        preconditions: ["Same as DRAFT -> TERMINATED"]
        side_effects: ["Same as DRAFT -> TERMINATED"]

      - from: ACCEPTED
        to: TERMINATED
        trigger: "POST /cast-contracts/{id}/terminate"
        actor: CastDirector
        preconditions: ["Same as DRAFT -> TERMINATED"]
        side_effects: ["Same as DRAFT -> TERMINATED"]

      - from: REHEARSING
        to: TERMINATED
        trigger: "POST /cast-contracts/{id}/terminate"
        actor: CastDirector
        preconditions: ["Same as DRAFT -> TERMINATED"]
        side_effects: ["Same as DRAFT -> TERMINATED"]

      - from: PERFORMING
        to: TERMINATED
        trigger: "POST /cast-contracts/{id}/terminate"
        actor: CastDirector
        preconditions: ["Same as DRAFT -> TERMINATED"]
        side_effects: ["Same as DRAFT -> TERMINATED"]

  - entity: RehearsalSlot
    initial_state: SCHEDULED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ATTENDED
        trigger: "POST /rehearsal-slots/{id}/record-attendance with outcome=ATTENDED"
        actor: CastDirector
        preconditions:
          - "RehearsalSlot.status == SCHEDULED (else ERR_SLOT_NOT_RECORDABLE)"
        side_effects:
          - "hours_credit := (end_time - start_time) hours; CastContract.completed_rehearsal_hours += hours_credit"
          - "If CastContract.status == ACCEPTED: CastContract -> REHEARSING"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /rehearsal-slots/{id}/record-attendance with outcome=NO_SHOW"
        actor: CastDirector
        preconditions:
          - "RehearsalSlot.status == SCHEDULED (else ERR_SLOT_NOT_RECORDABLE)"
        side_effects:
          - "hours_credit := 0"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rehearsal-slots/{id}/cancel or system (cascade from CastContract termination)"
        actor: CastDirector
        preconditions:
          - "RehearsalSlot.status == SCHEDULED (else ERR_SLOT_NOT_CANCELLABLE)"
        side_effects: []

  - entity: VendorApplication
    initial_state: JURY_REVIEW
    terminal_states: [WITHDRAWN]
    transitions:
      - from: JURY_REVIEW
        to: JURIED_IN
        trigger: "POST /vendor-applications/{id}/decide with outcome=JURIED_IN"
        actor: VendorCoordinator
        preconditions:
          - "VendorApplication.status IN {JURY_REVIEW, APPEALED, WAITLISTED} (else ERR_APPLICATION_NOT_DECIDABLE)"
        side_effects:
          - "craft/authenticity/safety scores stored; jury_score computed per jury_score calculation"
          - "Season.readiness_posture re-derived (a JURIED_IN FOOD/BEVERAGE application now requires an ISSUED FoodPermit)"

      - from: JURY_REVIEW
        to: JURIED_OUT
        trigger: "POST /vendor-applications/{id}/decide with outcome=JURIED_OUT"
        actor: VendorCoordinator
        preconditions:
          - "Same state precondition as decide -> JURIED_IN"
        side_effects:
          - "Scores stored; jury_score computed"

      - from: JURY_REVIEW
        to: WAITLISTED
        trigger: "POST /vendor-applications/{id}/decide with outcome=WAITLISTED"
        actor: VendorCoordinator
        preconditions:
          - "Same state precondition as decide -> JURIED_IN"
        side_effects:
          - "Scores stored; jury_score computed"

      - from: APPEALED
        to: JURIED_IN
        trigger: "POST /vendor-applications/{id}/decide with outcome=JURIED_IN"
        actor: VendorCoordinator
        preconditions: ["Same state precondition as decide -> JURIED_IN"]
        side_effects: ["Same as decide -> JURIED_IN"]

      - from: APPEALED
        to: JURIED_OUT
        trigger: "POST /vendor-applications/{id}/decide with outcome=JURIED_OUT"
        actor: VendorCoordinator
        preconditions: ["Same state precondition as decide -> JURIED_IN"]
        side_effects: ["Scores stored; jury_score recomputed"]

      - from: APPEALED
        to: WAITLISTED
        trigger: "POST /vendor-applications/{id}/decide with outcome=WAITLISTED"
        actor: VendorCoordinator
        preconditions: ["Same state precondition as decide -> JURIED_IN"]
        side_effects: ["Scores stored; jury_score recomputed"]

      - from: WAITLISTED
        to: JURIED_IN
        trigger: "system (automatic waitlist promotion on BoothAssignment release) or POST /vendor-applications/{id}/decide with outcome=JURIED_IN"
        actor: "system | VendorCoordinator"
        preconditions: []
        side_effects:
          - "On automatic promotion: promoted application is selected per waitlist_promotion selector (jury_score DESC, created_at ASC)"

      - from: WAITLISTED
        to: JURIED_OUT
        trigger: "POST /vendor-applications/{id}/decide with outcome=JURIED_OUT"
        actor: VendorCoordinator
        preconditions: ["Same state precondition as decide -> JURIED_IN"]
        side_effects: ["Scores stored; jury_score recomputed"]

      - from: JURIED_OUT
        to: APPEALED
        trigger: "POST /vendor-applications/{id}/appeal"
        actor: Vendor
        preconditions:
          - "VendorApplication.status == JURIED_OUT (else ERR_APPLICATION_NOT_APPEALABLE)"
          - "appeal_used == false (else ERR_APPEAL_ALREADY_USED)"
          - "X-User-ID == VendorApplication.vendor_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "appeal_used := true"

      - from: JURY_REVIEW
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{id}/withdraw"
        actor: Vendor
        preconditions:
          - "VendorApplication.status IN {JURY_REVIEW, APPEALED, JURIED_OUT, WAITLISTED} (else ERR_APPLICATION_NOT_WITHDRAWABLE)"
          - "X-User-ID == VendorApplication.vendor_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: APPEALED
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{id}/withdraw"
        actor: Vendor
        preconditions: ["Same as JURY_REVIEW -> WITHDRAWN"]
        side_effects: []

      - from: JURIED_OUT
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{id}/withdraw"
        actor: Vendor
        preconditions: ["Same as JURY_REVIEW -> WITHDRAWN"]
        side_effects: []

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{id}/withdraw"
        actor: Vendor
        preconditions: ["Same as JURY_REVIEW -> WITHDRAWN"]
        side_effects: []

  - entity: BoothAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, SETTLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /booth-assignments/{id}/confirm"
        actor: Vendor
        preconditions:
          - "BoothAssignment.status IN {RESERVED, SUSPENDED} (else ERR_BOOTH_NOT_CONFIRMABLE)"
          - "X-User-ID == VendorApplication.vendor_id of the linked application (else ERR_NOT_RESOURCE_OWNER)"
          - "If linked Vendor category IN {FOOD, BEVERAGE}: a FoodPermit of the same application with status ISSUED and expiry_date >= clock now exists (else ERR_FOOD_PERMIT_NOT_ISSUED)"
        side_effects:
          - "Provisional fee marked paid (provisional_fee_cents committed)"

      - from: SUSPENDED
        to: CONFIRMED
        trigger: "POST /booth-assignments/{id}/confirm"
        actor: Vendor
        preconditions: ["Same as RESERVED -> CONFIRMED"]
        side_effects: []

      - from: CONFIRMED
        to: SUSPENDED
        trigger: "system (automatic when the application's FoodPermit transitions to REVOKED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Season.readiness_posture re-derived (the JURIED_IN food application now lacks an ISSUED permit)"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /booth-assignments/{id}/release"
        actor: VendorCoordinator
        preconditions:
          - "BoothAssignment.status == RESERVED (else ERR_BOOTH_NOT_RELEASEABLE)"
        side_effects:
          - "Waitlist promotion: the top WAITLISTED VendorApplication of the season per waitlist_promotion selector -> JURIED_IN; if none, no-op"

      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /booth-assignments/{id}/settle"
        actor: VendorCoordinator
        preconditions:
          - "BoothAssignment.status IN {CONFIRMED, SUSPENDED} (else ERR_BOOTH_NOT_SETTLEABLE)"
          - "Season.status == STRIKE (else ERR_SEASON_INVALID_STATE)"
        side_effects:
          - "final_fee_cents and settlement_delta_cents computed per booth_final_fee"

      - from: SUSPENDED
        to: SETTLED
        trigger: "POST /booth-assignments/{id}/settle"
        actor: VendorCoordinator
        preconditions: ["Same as CONFIRMED -> SETTLED"]
        side_effects: ["Same as CONFIRMED -> SETTLED"]

  - entity: FoodPermit
    initial_state: APPLIED
    terminal_states: [FAILED_FINAL, REVOKED, EXPIRED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /food-permits/{id}/inspect with outcome=PASSED"
        actor: VendorCoordinator
        preconditions:
          - "FoodPermit.status IN {APPLIED, AWAITING_REINSPECTION} (else ERR_PERMIT_NOT_INSPECTIONABLE)"
        side_effects:
          - "inspection_attempts += 1; permit_number minted; expiry_date := season.closing_date + PERMIT_GRACE_DAYS"
          - "Season.readiness_posture re-derived"

      - from: APPLIED
        to: AWAITING_REINSPECTION
        trigger: "POST /food-permits/{id}/inspect with outcome=FAILED"
        actor: VendorCoordinator
        preconditions:
          - "FoodPermit.status IN {APPLIED, AWAITING_REINSPECTION} (else ERR_PERMIT_NOT_INSPECTIONABLE)"
          - "inspection_attempts + 1 < MAX_INSPECTION_ATTEMPTS (else the transition lands in FAILED_FINAL)"
        side_effects:
          - "inspection_attempts += 1"

      - from: AWAITING_REINSPECTION
        to: ISSUED
        trigger: "POST /food-permits/{id}/inspect with outcome=PASSED"
        actor: VendorCoordinator
        preconditions: ["Same as APPLIED -> ISSUED"]
        side_effects: ["Same as APPLIED -> ISSUED"]

      - from: AWAITING_REINSPECTION
        to: FAILED_FINAL
        trigger: "POST /food-permits/{id}/inspect with outcome=FAILED"
        actor: VendorCoordinator
        preconditions:
          - "FoodPermit.status == AWAITING_REINSPECTION (else ERR_PERMIT_NOT_INSPECTIONABLE)"
          - "inspection_attempts + 1 == MAX_INSPECTION_ATTEMPTS"
        side_effects:
          - "inspection_attempts += 1"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /food-permits/{id}/revoke or system (ConductCase resolved UPHELD with sanction REVOKE_PERMIT)"
        actor: "VendorCoordinator | system"
        preconditions:
          - "FoodPermit.status == ISSUED (else ERR_PERMIT_NOT_REVOKABLE)"
        side_effects:
          - "Every BoothAssignment of the same application in CONFIRMED -> SUSPENDED"
          - "Season.readiness_posture re-derived (permit no longer ISSUED)"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy: when clock now > expiry_date, evaluated on next read/write of the permit or on Season posture re-derivation)"
        actor: system
        preconditions: []
        side_effects:
          - "Same booth-suspension cascade as ISSUED -> REVOKED"

  - entity: TicketOrder
    initial_state: "payment_status=UNPAID, redemption_status=UNREDEEMED (parallel dimensions)"
    terminal_states: ["payment_status=REFUNDED", "redemption_status IN {FULLY_REDEEMED, RAINCHECKED, VOID}"]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /ticket-orders/{id}/pay"
        actor: Guest
        preconditions:
          - "payment_status == UNPAID (else ERR_ORDER_NOT_UNPAID)"
          - "X-User-ID == buyer_email (else ERR_NOT_RESOURCE_OWNER)"
          - "For DAY/GROUP orders: minting quantity tickets would keep FaireDay.tickets_sold_count + quantity <= season.daily_capacity (else ERR_DAY_AT_CAPACITY)"
        side_effects:
          - "quantity Tickets minted with status VALID (faire_day_id set for DAY/GROUP; null for SEASON)"
          - "Season.outstanding_admissions += quantity"

      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /ticket-orders/{id}/refund with refund_cents < retained_cents"
        actor: GateAgent
        preconditions:
          - "payment_status IN {PAID, PARTIALLY_REFUNDED} (else ERR_ORDER_NOT_UNPAID)"
          - "redemption_status NOT IN {FULLY_REDEEMED} (else ERR_NOTHING_REFUNDABLE)"
          - "redemption_status NOT IN {RAINCHECKED, VOID} (else ERR_ORDER_NOT_REFUNDABLE)"
          - "refund_cents <= retained_cents (else ERR_REFUND_EXCEEDS_PAID)"
        side_effects:
          - "refunded_cents += refund_cents; retained_cents recomputed (money invariant preserved)"

      - from: PAID
        to: REFUNDED
        trigger: "POST /ticket-orders/{id}/refund with refund_cents == retained_cents"
        actor: GateAgent
        preconditions: ["Same as PAID -> PARTIALLY_REFUNDED"]
        side_effects: ["Same as PAID -> PARTIALLY_REFUNDED; payment_status becomes REFUNDED"]

      - from: PARTIALLY_REFUNDED
        to: PARTIALLY_REFUNDED
        trigger: "POST /ticket-orders/{id}/refund with refund_cents < retained_cents"
        actor: GateAgent
        preconditions: ["Same as PAID -> PARTIALLY_REFUNDED"]
        side_effects: ["Same as PAID -> PARTIALLY_REFUNDED"]

      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /ticket-orders/{id}/refund with refund_cents == retained_cents"
        actor: GateAgent
        preconditions: ["Same as PAID -> PARTIALLY_REFUNDED"]
        side_effects: ["Same as PAID -> REFUNDED"]

      - from: UNREDEEMED
        to: PARTIALLY_REDEEMED
        trigger: "system (a Ticket of this order transitions to REDEEMED while other tickets remain VALID)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PARTIALLY_REDEEMED
        to: FULLY_REDEEMED
        trigger: "system (last VALID ticket of this order transitions to REDEEMED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNREDEEMED
        to: FULLY_REDEEMED
        trigger: "system (single-ticket order's ticket REDEEMED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNREDEEMED
        to: RAINCHECKED
        trigger: "system (weather cancellation converts all DAY tickets to RAINCHECKED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNREDEEMED
        to: VOID
        trigger: "system (ConductCase UPHELD with sanction BAN_GUEST voids all VALID tickets, or manual void of all tickets)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PARTIALLY_REDEEMED
        to: VOID
        trigger: "system (BAN_GUEST voids remaining VALID tickets; order carries REDEEMED and VOID tickets)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Ticket
    initial_state: VALID
    terminal_states: [REDEEMED, RAINCHECKED, VOID, EXPIRED]
    transitions:
      - from: VALID
        to: REDEEMED
        trigger: "POST /tickets/{id}/redeem"
        actor: GateAgent
        preconditions:
          - "Ticket.status == VALID (else ERR_TICKET_NOT_VALID)"
          - "DAY ticket: its FaireDay.status == OPERATING; SEASON ticket: a FaireDay of the season with status OPERATING exists whose date matches clock now (else ERR_DAY_NOT_OPERATING)"
        side_effects:
          - "redeemed_at := clock now; owning TicketOrder.redemption_status recomputed"

      - from: VALID
        to: RAINCHECKED
        trigger: "system (cascade from FaireDay cancel-weather; DAY tickets only)"
        actor: system
        preconditions: []
        side_effects:
          - "RainCheck (ISSUED) created 1:1 for this ticket"

      - from: VALID
        to: VOID
        trigger: "POST /tickets/{id}/void or system (BAN_GUEST conduct sanction)"
        actor: GateAgent
        preconditions:
          - "Ticket.status == VALID (else ERR_TICKET_NOT_VALID)"
        side_effects:
          - "Season.outstanding_admissions -= 1; owning TicketOrder.redemption_status recomputed"

      - from: VALID
        to: EXPIRED
        trigger: "system (cascade from FaireDay complete for DAY tickets; cascade from Season begin-strike for SEASON tickets)"
        actor: system
        preconditions: []
        side_effects:
          - "Season.outstanding_admissions -= 1"

  - entity: RainCheck
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /rain-checks/{id}/redeem"
        actor: Guest
        preconditions:
          - "RainCheck.status == ISSUED (else ERR_RAIN_CHECK_NOT_ISSUED)"
          - "clock now <= redeem_by_date (else ERR_RAIN_CHECK_EXPIRED)"
          - "target FaireDay.status IN {SCHEDULED, OPEN_FOR_SALES} (else ERR_DAY_NOT_REDEEMABLE)"
          - "target FaireDay.tickets_sold_count + 1 <= season.daily_capacity (else ERR_DAY_AT_CAPACITY)"
          - "X-User-ID == buyer_email of the source ticket's order (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "redeemed_on_day_id := target day; a new Ticket (DAY, VALID, target day, same order_id) is minted"
          - "Season.outstanding_admissions unchanged (one ISSUED check consumed, one VALID ticket minted)"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy when clock now > redeem_by_date; swept on Season close)"
        actor: system
        preconditions: []
        side_effects:
          - "Season.outstanding_admissions -= 1"

  - entity: VolunteerShift
    initial_state: SIGNED_UP
    terminal_states: [WORKED, NO_SHOW, CANCELLED]
    transitions:
      - from: SIGNED_UP
        to: CONFIRMED
        trigger: "POST /volunteer-shifts/{id}/confirm"
        actor: VolunteerCoordinator
        preconditions:
          - "VolunteerShift.status == SIGNED_UP (else ERR_SHIFT_NOT_CONFIRMABLE)"
        side_effects:
          - "Season.volunteer_confirmed_hours += hours"
          - "Season.readiness_posture re-derived"

      - from: CONFIRMED
        to: WORKED
        trigger: "POST /volunteer-shifts/{id}/close-out with outcome=WORKED"
        actor: VolunteerCoordinator
        preconditions:
          - "VolunteerShift.status == CONFIRMED (else ERR_SHIFT_NOT_CLOSABLE)"
          - "FaireDay.status IN {OPERATING, COMPLETED} (else ERR_DAY_NOT_OPERATING)"
        side_effects:
          - "hours remain counted in Season.volunteer_confirmed_hours (WORKED stays in the inclusion set)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /volunteer-shifts/{id}/close-out with outcome=NO_SHOW"
        actor: VolunteerCoordinator
        preconditions:
          - "Same as CONFIRMED -> WORKED"
        side_effects:
          - "Season.volunteer_confirmed_hours -= hours; readiness_posture re-derived"

      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /volunteer-shifts/{id}/cancel or system (cascade from FaireDay cancel-weather)"
        actor: "Volunteer | VolunteerCoordinator"
        preconditions:
          - "VolunteerShift.status IN {SIGNED_UP, CONFIRMED} (else ERR_SHIFT_NOT_CANCELLABLE)"
          - "Manual: X-User-ID == volunteer_handle OR caller role == VolunteerCoordinator (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "If prior status CONFIRMED: Season.volunteer_confirmed_hours -= hours; readiness_posture re-derived"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /volunteer-shifts/{id}/cancel or system (cascade from FaireDay cancel-weather)"
        actor: "Volunteer | VolunteerCoordinator"
        preconditions: ["Same as SIGNED_UP -> CANCELLED"]
        side_effects: ["Season.volunteer_confirmed_hours -= hours; readiness_posture re-derived"]

  - entity: ConductCase
    initial_state: REPORTED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: REPORTED
        to: UPHELD
        trigger: "POST /conduct-cases/{id}/resolve with outcome=UPHELD"
        actor: FaireOperator
        preconditions:
          - "ConductCase.status == REPORTED (else ERR_CASE_ALREADY_RESOLVED)"
          - "sanction BAN_GUEST requires linked_order_id present; sanction REVOKE_PERMIT requires linked_permit_id present (else ERR_CASE_LINKAGE_INVALID)"
        side_effects:
          - "sanction := payload sanction"
          - "BAN_GUEST: every Ticket of the linked order in VALID -> VOID; linked order redemption_status -> VOID; Season.outstanding_admissions decremented per voided ticket"
          - "REVOKE_PERMIT: linked FoodPermit ISSUED -> REVOKED (L1); its BoothAssignment in CONFIRMED -> SUSPENDED (L2); Season.readiness_posture re-derived (L3)"
          - "NONE: no further side effects"

      - from: REPORTED
        to: DISMISSED
        trigger: "POST /conduct-cases/{id}/resolve with outcome=DISMISSED"
        actor: FaireOperator
        preconditions:
          - "ConductCase.status == REPORTED (else ERR_CASE_ALREADY_RESOLVED)"
        side_effects: []

  - entity: BuildTask
    initial_state: PENDING
    terminal_states: [DONE]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /build-tasks/{id}/advance with to=IN_PROGRESS"
        actor: FaireOperator
        preconditions:
          - "BuildTask.status == PENDING when to=IN_PROGRESS, == IN_PROGRESS when to=DONE (else ERR_TASK_NOT_ADVANCEABLE)"
          - "Every task in depends_on_task_ids is DONE (else ERR_TASK_DEPENDENCY_UNMET)"
        side_effects: []

      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /build-tasks/{id}/advance with to=DONE"
        actor: FaireOperator
        preconditions:
          - "BuildTask.status == IN_PROGRESS (else ERR_TASK_NOT_ADVANCEABLE)"
        side_effects:
          - "Season.readiness_posture re-derived (BUILD-phase task completion can unblock posture)"

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: season-config-stale-edit
    parent_entity: Season
    write_endpoint: "PATCH /seasons/{id}"
    occ_field: expected_season_version
    description: |
      Editing a PLANNING season's configuration with an expected_season_version
      that no longer matches Season.version is rejected. A config edit keeps the
      season in PLANNING, so a later edit based on a previously observed version
      would otherwise silently rebase thresholds (capacity, group size, volunteer
      hours) onto a configuration the caller never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-reprice-stale-edit
    parent_entity: TicketOrder
    write_endpoint: "PATCH /ticket-orders/{id}"
    occ_field: expected_order_version
    description: |
      Editing an UNPAID ticket order (quantity or faire day) with an
      expected_order_version that no longer matches TicketOrder.version is
      rejected. The order remains UNPAID across edits, so a later edit carrying
      a previously observed version would otherwise reprice from a stale base.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ticket_order_total
    trigger: "POST /ticket-orders (create) and PATCH /ticket-orders/{id} (reprice)"
    algorithm: tiered_pricing
    formula: |
      base = quantity * unit_price_cents
      discount_pct =
        0.20 if order_type == GROUP and quantity >= 4 * season.group_min_size
        0.15 if order_type == GROUP and quantity >= 2 * season.group_min_size
        0.10 if order_type == GROUP and quantity >= 1 * season.group_min_size
        0.00 otherwise (DAY and SEASON never discounted)
      convenience_fee_cents = quantity * CONVENIENCE_FEE_CENTS if order_type == DAY else 0
      total_cents = round_half_up(base * (1 - discount_pct)) + convenience_fee_cents
    input_set: "The TicketOrder being priced and its Season config (group_min_size)"
    constants:
      CONVENIENCE_FEE_CENTS: 150
      GROUP_TIER1_PCT: 0.10
      GROUP_TIER2_PCT: 0.15
      GROUP_TIER3_PCT: 0.20
      GROUP_TIER2_MULT: 2
      GROUP_TIER3_MULT: 4
    precision: "integer cents; round_half_up applied once to the discounted base before fee addition"
    variants: []

  - name: weather_vendor_credit
    trigger: "FaireDay cancel-weather side effect L1d (per affected BoothAssignment)"
    algorithm: aggregation
    formula: |
      residency_days = (residency_end_date - residency_start_date) in whole days
      affected iff residency_start_date <= cancelled_day.date < residency_end_date
      daily_credit_cents = round_half_up(provisional_fee_cents * RAIN_CREDIT_PCT / residency_days)
      weather_credit_cents += daily_credit_cents   # accumulate PER-DAY rounded amounts
    input_set: "BoothAssignments of the season in {RESERVED, CONFIRMED, SUSPENDED} whose residency half-open interval covers the cancelled date"
    constants:
      RAIN_CREDIT_PCT: 0.25
    precision: "integer cents; EACH day's credit is rounded half_up to whole cents BEFORE accumulation — never round the aggregate"
    variants:
      - name: aggregate_rounding_rejected
        when: "never — explicitly rejected alternative"
        difference: "round_half_up(provisional * RAIN_CREDIT_PCT * cancelled_days / residency_days) rounds once at the end and yields different cents (e.g. 1286 vs 1287); the scaffold pins per-day rounding"

  - name: booth_provisional_fee
    trigger: "POST /booth-assignments (reservation)"
    algorithm: forward_looking
    formula: |
      tier_rate = PRIME: 120 | STANDARD: 80 | MEADOW: 50   # cents per sqft per week
      provisional_fee_cents = booth_size_sqft * tier_rate * season.season_weeks
      (assumes full season, zero weather days, zero surcharges)
    input_set: "The VendorApplication (booth_size_sqft, requested_location_tier) and Season.season_weeks at reservation time"
    constants:
      TIER_RATE_PRIME: 120
      TIER_RATE_STANDARD: 80
      TIER_RATE_MEADOW: 50
    precision: "integer cents"
    variants:
      - name: provisional_vs_final
        when: "provisional quoted at reservation; final computed at settlement"
        difference: "final subtracts accumulated weather credits and adds the PRIME surcharge; identical booth inputs produce different fee values at the two points"

  - name: booth_final_fee
    trigger: "POST /booth-assignments/{id}/settle (Season STRIKE)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (surcharge keys on the post-credit, pre-surcharge subtotal):
      1. base     = provisional_fee_cents
      2. credits  = weather_credit_cents
      3. subtotal = base - credits
      4. surcharge = round_half_up(subtotal * PRIME_SURCHARGE_PCT)
                     if requested_location_tier == PRIME and subtotal >= PRIME_SURCHARGE_THRESHOLD_CENTS
                     else 0
      5. final_fee_cents = subtotal + surcharge
      6. settlement_delta_cents = final_fee_cents - provisional_fee_cents
    input_set: "The BoothAssignment being settled"
    constants:
      PRIME_SURCHARGE_PCT: 0.05
      PRIME_SURCHARGE_THRESHOLD_CENTS: 20000
    precision: "integer cents; surcharge rounded half_up once"
    variants: []

  - name: cast_accrued_payout
    trigger: "FaireDay complete (full day rate) and cancel-weather (weather rate) side effects"
    algorithm: chronological
    formula: |
      On FaireDay COMPLETED: for each CastContract of the season in PERFORMING:
        accrued_payout_cents += offered_day_rate_cents
      On FaireDay CANCELLED_WEATHER: for each CastContract of the season in {ACCEPTED, REHEARSING, PERFORMING}:
        accrued_payout_cents += round_half_up(offered_day_rate_cents * weather_pay_pct)
      Events apply in the order they occur; each event touches a contract at most once per day.
    input_set: "CastContracts of the season filtered by status at the moment the day event lands"
    constants: {}
    precision: "integer cents; round_half_up per weather-day line"
    variants:
      - name: accrual_vs_guarantee
        when: "accrual accumulates weather-adjusted actuals; final uses the guarantee floor"
        difference: "with enough weather-cancelled days the accrual falls below guaranteed_days * offered_day_rate_cents; final_payout_cents then differs from accrued_payout_cents for identical day history"

  - name: cast_final_payout
    trigger: "CastContract -> COMPLETED (Season begin-strike) or -> TERMINATED"
    algorithm: aggregation
    formula: |
      shortfall_hours = max(0, required_rehearsal_hours - completed_rehearsal_hours)
      rehearsal_shortfall_penalty = round_half_up(shortfall_hours * REHEARSAL_SHORTFALL_CENTS_PER_HOUR)
      On COMPLETED:
        final_payout_cents = max(accrued_payout_cents, guaranteed_days * offered_day_rate_cents) - rehearsal_shortfall_penalty
      On TERMINATED:
        final_payout_cents = accrued_payout_cents   (no guarantee floor, no penalty)
      final_payout_cents is floored at 0.
    input_set: "The CastContract being settled"
    constants:
      REHEARSAL_SHORTFALL_CENTS_PER_HOUR: 5000
    precision: "integer cents"
    variants: []

  - name: jury_score
    trigger: "POST /vendor-applications/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      jury_score = round_half_up(0.5 * craft_score + 0.3 * authenticity_score + 0.2 * safety_score, 2)
    input_set: "The three criterion scores of the decide payload"
    constants:
      W_CRAFT: 0.5
      W_AUTHENTICITY: 0.3
      W_SAFETY: 0.2
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: waitlist_promotion
    trigger: "BoothAssignment RESERVED -> RELEASED side effect"
    algorithm: constraint_propagation
    formula: |
      candidate set = VendorApplications of the season with status WAITLISTED
      ranking: jury_score DESC (nulls last), tie-break created_at ASC
      promote the top candidate to JURIED_IN; empty candidate set -> no-op
    input_set: "WAITLISTED VendorApplications of the season at release time"
    constants: {}
    precision: "n/a (selector)"
    variants: []

  - name: readiness_posture
    trigger: "Re-derived on: BuildTask advance, VolunteerShift confirm/close-out/cancel, VendorApplication decide, FoodPermit issue/revoke/expire, BoothAssignment suspend"
    algorithm: threshold
    formula: |
      if exists BuildTask of season with phase=BUILD and status != DONE:            posture = BLOCKED
      elif (exists VendorApplication of season with status JURIED_IN whose Vendor.category
            IN {FOOD, BEVERAGE} without a FoodPermit of the same application with status ISSUED
            and expiry_date >= clock now)
           OR (volunteer_confirmed_hours < volunteer_min_hours):                    posture = CONDITIONAL
      else:                                                                          posture = READY
      volunteer_confirmed_hours = sum(hours) over VolunteerShift of season with status IN {CONFIRMED, WORKED}
      Boundary: volunteer_confirmed_hours == volunteer_min_hours qualifies as READY (>= semantics).
    input_set: "BuildTasks (phase BUILD), JURIED_IN FOOD/BEVERAGE VendorApplications + their FoodPermits, VolunteerShifts of the season"
    constants: {}
    precision: "hours compared exactly (2 decimal places)"
    variants: []

  - name: outstanding_admissions_invariant
    trigger: "Ticket mint/void/expire; RainCheck issue/redeem/expire"
    algorithm: aggregation
    formula: |
      outstanding_admissions = count(Ticket of season with status VALID)
                             + count(RainCheck of season with status ISSUED)
      Conserved across each compensating pair:
        cancel-weather:  -1 VALID ticket, +1 ISSUED rain check  (net 0)
        rain-check redeem: -1 ISSUED check, +1 VALID ticket      (net 0)
      Not conserved (by design) on: pay (+quantity), void (-1), ticket expiry (-1), check expiry (-1).
    input_set: "All Tickets and RainChecks of the season"
    constants: {}
    precision: "integer count"
    variants: []

  - name: refund_money_invariant
    trigger: "POST /ticket-orders/{id}/refund"
    algorithm: aggregation
    formula: |
      After every refund: refunded_cents' = refunded_cents + refund_cents
      retained_cents = total_cents - refunded_cents
      Invariant: refunded_cents + retained_cents == total_cents at all times;
      refund_cents <= retained_cents enforced (ERR_REFUND_EXCEEDS_PAID).
    input_set: "The TicketOrder being refunded"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be permitted for the endpoint per §1.5 roles; entity-backed ownership (X-User-ID equals the resource's owner FK) enforced where declared"
    error_id: "ERR_UNAUTHORIZED_ROLE (role not permitted) | ERR_NOT_RESOURCE_OWNER (ownership mismatch)"
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids exist, left to right; then body FK fields (season_id, faire_day_id, contract_id, application_id, performer_id, target_faire_day_id, depends_on_task_ids[*], linked_order_id, linked_permit_id) exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_SEASON_NOT_FOUND, ERR_FAIRE_DAY_NOT_FOUND, ERR_PERFORMER_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_BOOTH_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_RAIN_CHECK_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_TASK_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 4
    category: existence
    check: "Request-body shape: required fields present, types valid, enum members valid, range constraints (end > start, closing_date >= opening_date, quantity >= 1, pct fields in 0..1, scores in 0..10); SEASON order must omit faire_day_id; DAY/GROUP orders must include it; unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 5
    category: state
    check: "Target resource(s) in the required state for the operation (per §1.2 transition preconditions; e.g. contract OFFERED, booth RESERVED, permit ISSUED-capable, order UNPAID, ticket VALID, case REPORTED, season in required lifecycle state, day in required sales state). Transition preconditions are evaluated in listed order. OCC version checks on PATCH endpoints (expected_season_version / expected_order_version) are evaluated AFTER all state preconditions within this priority: a stale version on an otherwise-valid request yields ERR_STALE_VERSION (412)"
    error_id: "state-specific: ERR_SEASON_NOT_IN_PLANNING | ERR_SEASON_INVALID_STATE | ERR_SEASON_NOT_READY | ERR_SEASON_POSTURE_BLOCKED | ERR_SEASON_NOT_OPEN | ERR_UNRESOLVED_FAIRE_DAYS | ERR_STRIKE_TASKS_INCOMPLETE | ERR_UNSETTLED_BOOTHS | ERR_DAY_NOT_OPENABLE | ERR_DAY_NOT_HOLDABLE | ERR_DAY_NOT_ON_HOLD | ERR_DAY_NOT_CANCELLABLE | ERR_DAY_NOT_COMPLETABLE | ERR_OPEN_SHIFTS_EXIST | ERR_DAY_NOT_STAFFABLE | ERR_CONTRACT_NOT_OFFERABLE | ERR_CONTRACT_NOT_OFFERED | ERR_CONTRACT_NOT_TERMINABLE | ERR_CONTRACT_NOT_REHEARSABLE | ERR_SLOT_NOT_RECORDABLE | ERR_SLOT_NOT_CANCELLABLE | ERR_APPLICATION_NOT_DECIDABLE | ERR_APPLICATION_NOT_APPEALABLE | ERR_APPLICATION_NOT_WITHDRAWABLE | ERR_APPLICATION_NOT_JURIED_IN | ERR_BOOTH_NOT_CONFIRMABLE | ERR_BOOTH_NOT_RELEASEABLE | ERR_BOOTH_NOT_SETTLEABLE | ERR_PERMIT_NOT_INSPECTIONABLE | ERR_PERMIT_NOT_REVOKABLE | ERR_ORDER_NOT_UNPAID | ERR_TICKET_NOT_VALID | ERR_RAIN_CHECK_NOT_ISSUED | ERR_SHIFT_NOT_CONFIRMABLE | ERR_SHIFT_NOT_CLOSABLE | ERR_SHIFT_NOT_CANCELLABLE | ERR_CASE_ALREADY_RESOLVED | ERR_TASK_NOT_ADVANCEABLE"
    http_status: 409
    applies_to: state transition endpoints and state-gated creates

  - priority: 6
    category: business_safety
    check: "Food-safety gate: confirming a booth for a FOOD/BEVERAGE vendor requires an ISSUED, unexpired FoodPermit on the same application"
    error_id: ERR_FOOD_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /booth-assignments/{id}/confirm"

  - priority: 7
    category: business_temporal
    check: "Clock-relative gates: weather cancellation before the day's deadline hour; rain-check redemption on/before redeem_by_date; open-gates only on the faire day's calendar date; volunteer close-out only on/after day operation"
    error_id: "ERR_WEATHER_CALL_TOO_LATE | ERR_RAIN_CHECK_EXPIRED | ERR_DAY_NOT_TODAY | ERR_DAY_NOT_OPERATING"
    http_status: 409
    applies_to: "POST /faire-days/{id}/cancel-weather, POST /rain-checks/{id}/redeem, POST /faire-days/{id}/open-gates, POST /volunteer-shifts/{id}/close-out, POST /tickets/{id}/redeem"

  - priority: 8
    category: business_constraint
    check: "Resource/uniqueness/dependency/capacity constraints: rehearsal-stage buffered overlap; booth-site half-open overlap; volunteer same-person overlap; one active application per vendor per season; one active booth assignment per application; one active permit per application; build-task DAG acyclic + dependencies met; day admission capacity; group minimum size"
    error_id: "ERR_REHEARSAL_OVERLAP | ERR_BOOTH_OVERLAP | ERR_VOLUNTEER_SHIFT_OVERLAP | ERR_DUPLICATE_APPLICATION | ERR_APPLICATION_ALREADY_BOOKED | ERR_DUPLICATE_PERMIT | ERR_TASK_DEPENDENCY_CYCLE | ERR_TASK_DEPENDENCY_UNMET | ERR_DAY_AT_CAPACITY | ERR_GROUP_SIZE_BELOW_MINIMUM"
    http_status: 409
    applies_to: "create/action endpoints enforcing constraints (ERR_GROUP_SIZE_BELOW_MINIMUM returns 422)"

  - priority: 9
    category: business_fiscal
    check: "Money bounds: refund_cents positive and <= retained_cents; refund allowed only while redemption_status permits"
    error_id: "ERR_REFUND_EXCEEDS_PAID (422) | ERR_NOTHING_REFUNDABLE (409) | ERR_ORDER_NOT_REFUNDABLE (409)"
    http_status: 422
    applies_to: "POST /ticket-orders/{id}/refund"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Season ---
  - method: POST
    path: "/seasons"
    description: "Create a season (status PLANNING, posture BLOCKED, counters 0, version 1)"
    roles: [FaireOperator]
    code: 201
    input: [name, opening_date, closing_date, daily_capacity, group_min_size, volunteer_min_hours, weather_call_deadline_hour, rain_check_grace_days]
    output: Season
    side_effects: ["readiness_posture initialized BLOCKED", "volunteer_confirmed_hours 0", "outstanding_admissions 0", "season_weeks computed"]

  - method: GET
    path: "/seasons"
    description: "List seasons (paginated)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: Season[]
    side_effects: []

  - method: GET
    path: "/seasons/{id}"
    description: "Get a season including computed posture and counters"
    roles: [Any]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: PATCH
    path: "/seasons/{id}"
    description: "Edit PLANNING season configuration; OCC-guarded via expected_season_version"
    roles: [FaireOperator]
    code: 200
    input: [expected_season_version, "daily_capacity?", "group_min_size?", "volunteer_min_hours?", "weather_call_deadline_hour?", "rain_check_grace_days?"]
    output: Season
    side_effects: ["increments Season.version by 1", "readiness_posture re-derived if volunteer_min_hours changed"]

  - method: POST
    path: "/seasons/{id}/begin-build"
    description: "PLANNING -> BUILD"
    roles: [FaireOperator]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> BUILD"]

  - method: POST
    path: "/seasons/{id}/open"
    description: "BUILD -> OPEN; requires readiness_posture READY; transitions rehearsal-qualified contracts to PERFORMING"
    roles: [FaireOperator]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> OPEN", "qualified CastContracts -> PERFORMING"]

  - method: POST
    path: "/seasons/{id}/begin-strike"
    description: "OPEN -> STRIKE; requires all FaireDays terminal; settles cast contracts at guarantee floor"
    roles: [FaireOperator]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> STRIKE", "CastContracts -> COMPLETED with final_payout_cents per cast_final_payout", "VALID SEASON tickets -> EXPIRED"]

  - method: POST
    path: "/seasons/{id}/close"
    description: "STRIKE -> CLOSED; requires STRIKE tasks DONE and booths settled/released; sweeps expired rain checks"
    roles: [FaireOperator]
    code: 200
    input: []
    output: Season
    side_effects: ["status -> CLOSED", "overdue ISSUED RainChecks -> EXPIRED"]

  # --- FaireDay ---
  - method: POST
    path: "/faire-days"
    description: "Schedule a faire day (SCHEDULED); season must be PLANNING or BUILD (else ERR_SEASON_INVALID_STATE); date within [opening_date, closing_date] (else ERR_INVALID_REQUEST)"
    roles: [FaireOperator]
    code: 201
    input: [season_id, date]
    output: FaireDay
    side_effects: []

  - method: GET
    path: "/faire-days"
    description: "List faire days, filterable by season"
    roles: [Any]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: FaireDay[]
    side_effects: []

  - method: GET
    path: "/faire-days/{id}"
    description: "Get a faire day"
    roles: [Any]
    code: 200
    input: []
    output: FaireDay
    side_effects: []

  - method: POST
    path: "/faire-days/{id}/open-sales"
    description: "SCHEDULED -> OPEN_FOR_SALES; gated on season BUILD/OPEN and posture != BLOCKED"
    roles: [FaireOperator]
    code: 200
    input: []
    output: FaireDay
    side_effects: ["status -> OPEN_FOR_SALES"]

  - method: POST
    path: "/faire-days/{id}/weather-hold"
    description: "OPEN_FOR_SALES -> WEATHER_HOLD"
    roles: [FaireOperator]
    code: 200
    input: []
    output: FaireDay
    side_effects: ["status -> WEATHER_HOLD"]

  - method: POST
    path: "/faire-days/{id}/release-hold"
    description: "WEATHER_HOLD -> OPEN_FOR_SALES"
    roles: [FaireOperator]
    code: 200
    input: []
    output: FaireDay
    side_effects: ["status -> OPEN_FOR_SALES"]

  - method: POST
    path: "/faire-days/{id}/cancel-weather"
    description: "OPEN_FOR_SALES/WEATHER_HOLD -> CANCELLED_WEATHER before the day's deadline hour; fires the full rain-check/shift/payout/credit cascade"
    roles: [FaireOperator]
    code: 200
    input: []
    output: FaireDay
    side_effects:
      - "DAY tickets VALID -> RAINCHECKED with 1:1 RainChecks ISSUED"
      - "VolunteerShifts SIGNED_UP/CONFIRMED -> CANCELLED; Season.volunteer_confirmed_hours recomputed; readiness_posture re-derived"
      - "CastContracts accrue weather-rate payout per cast_accrued_payout"
      - "BoothAssignments accrue per-day weather credits per weather_vendor_credit"
      - "TicketOrder redemption_status recomputed for affected orders"

  - method: POST
    path: "/faire-days/{id}/open-gates"
    description: "OPEN_FOR_SALES -> OPERATING on the day's calendar date while season is OPEN"
    roles: [FaireOperator]
    code: 200
    input: []
    output: FaireDay
    side_effects: ["status -> OPERATING"]

  - method: POST
    path: "/faire-days/{id}/complete"
    description: "OPERATING -> COMPLETED; requires the day's volunteer shifts terminal; expires unredeemed day tickets; accrues full-day cast payout"
    roles: [FaireOperator]
    code: 200
    input: []
    output: FaireDay
    side_effects: ["status -> COMPLETED", "VALID DAY tickets -> EXPIRED", "PERFORMING contracts accrue offered_day_rate_cents"]

  # --- Performer ---
  - method: POST
    path: "/performers"
    description: "Register a performer"
    roles: [CastDirector]
    code: 201
    input: [stage_name, act_type, base_day_rate_cents]
    output: Performer
    side_effects: []

  - method: GET
    path: "/performers"
    description: "List performers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: Performer[]
    side_effects: []

  - method: GET
    path: "/performers/{id}"
    description: "Get a performer"
    roles: [Any]
    code: 200
    input: []
    output: Performer
    side_effects: []

  # --- CastContract ---
  - method: POST
    path: "/cast-contracts"
    description: "Create a cast contract (DRAFT); season must be PLANNING or BUILD"
    roles: [CastDirector]
    code: 201
    input: [season_id, performer_id, offered_day_rate_cents, guaranteed_days, weather_pay_pct, required_rehearsal_hours]
    output: CastContract
    side_effects: ["negotiation_round 0", "accrued_payout_cents 0", "completed_rehearsal_hours 0"]

  - method: GET
    path: "/cast-contracts"
    description: "List cast contracts, filterable by season or performer"
    roles: [Any]
    code: 200
    input: ["season_id?", "performer_id?", "status?", "limit?", "offset?"]
    output: CastContract[]
    side_effects: []

  - method: GET
    path: "/cast-contracts/{id}"
    description: "Get a cast contract"
    roles: [Any]
    code: 200
    input: []
    output: CastContract
    side_effects: []

  - method: POST
    path: "/cast-contracts/{id}/offer"
    description: "DRAFT/COUNTERED -> OFFERED; from COUNTERED an omitted rate adopts the countered rate"
    roles: [CastDirector]
    code: 200
    input: ["offered_day_rate_cents?"]
    output: CastContract
    side_effects: ["status -> OFFERED", "negotiation_round += 1", "rate adoption from counter when omitted"]

  - method: POST
    path: "/cast-contracts/{id}/counter"
    description: "OFFERED -> COUNTERED (performer, owner)"
    roles: [Performer]
    code: 200
    input: [countered_day_rate_cents]
    output: CastContract
    side_effects: ["status -> COUNTERED", "countered_day_rate_cents stored", "negotiation_round += 1"]

  - method: POST
    path: "/cast-contracts/{id}/accept"
    description: "OFFERED -> ACCEPTED (performer, owner)"
    roles: [Performer]
    code: 200
    input: []
    output: CastContract
    side_effects: ["status -> ACCEPTED"]

  - method: POST
    path: "/cast-contracts/{id}/terminate"
    description: "Any non-terminal state -> TERMINATED; final payout = accrual only; scheduled rehearsal slots cancelled"
    roles: [CastDirector]
    code: 200
    input: []
    output: CastContract
    side_effects: ["status -> TERMINATED", "final_payout_cents := accrued_payout_cents", "SCHEDULED RehearsalSlots -> CANCELLED"]

  # --- RehearsalSlot ---
  - method: POST
    path: "/rehearsal-slots"
    description: "Schedule a rehearsal slot; contract must be ACCEPTED/REHEARSING; 15-minute trailing turnover buffer per stage"
    roles: [CastDirector]
    code: 201
    input: [contract_id, stage_name, start_time, end_time]
    output: RehearsalSlot
    side_effects: ["status SCHEDULED", "hours_credit 0 until ATTENDED"]

  - method: GET
    path: "/rehearsal-slots"
    description: "List rehearsal slots, filterable by contract or stage"
    roles: [Any]
    code: 200
    input: ["contract_id?", "stage_name?", "status?", "limit?", "offset?"]
    output: RehearsalSlot[]
    side_effects: []

  - method: GET
    path: "/rehearsal-slots/{id}"
    description: "Get a rehearsal slot"
    roles: [Any]
    code: 200
    input: []
    output: RehearsalSlot
    side_effects: []

  - method: POST
    path: "/rehearsal-slots/{id}/record-attendance"
    description: "SCHEDULED -> ATTENDED (credits contract hours; may flip contract to REHEARSING) or -> NO_SHOW"
    roles: [CastDirector]
    code: 200
    input: [outcome]
    output: RehearsalSlot
    side_effects: ["ATTENDED: hours_credit set, contract.completed_rehearsal_hours += hours_credit, contract ACCEPTED -> REHEARSING", "NO_SHOW: hours_credit 0"]

  - method: POST
    path: "/rehearsal-slots/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [CastDirector]
    code: 200
    input: []
    output: RehearsalSlot
    side_effects: ["status -> CANCELLED"]

  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a vendor"
    roles: [VendorCoordinator]
    code: 201
    input: [business_name, category]
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors"
    roles: [Any]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor"
    roles: [Any]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  # --- VendorApplication ---
  - method: POST
    path: "/vendor-applications"
    description: "File a jury application (JURY_REVIEW); vendor_id set from X-User-ID; season must be PLANNING"
    roles: [Vendor]
    code: 201
    input: [season_id, booth_size_sqft, requested_location_tier]
    output: VendorApplication
    side_effects: ["status JURY_REVIEW", "appeal_used false"]

  - method: GET
    path: "/vendor-applications"
    description: "List applications, filterable by season, vendor, status"
    roles: [Any]
    code: 200
    input: ["season_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: VendorApplication[]
    side_effects: []

  - method: GET
    path: "/vendor-applications/{id}"
    description: "Get an application"
    roles: [Any]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []

  - method: POST
    path: "/vendor-applications/{id}/decide"
    description: "Record jury scores and decide JURIED_IN | JURIED_OUT | WAITLISTED from JURY_REVIEW, APPEALED, or WAITLISTED"
    roles: [VendorCoordinator]
    code: 200
    input: [craft_score, authenticity_score, safety_score, outcome]
    output: VendorApplication
    side_effects: ["jury_score computed per jury_score", "status per outcome", "readiness_posture re-derived on JURIED_IN"]

  - method: POST
    path: "/vendor-applications/{id}/appeal"
    description: "JURIED_OUT -> APPEALED (vendor owner, one appeal per application)"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["status -> APPEALED", "appeal_used := true"]

  - method: POST
    path: "/vendor-applications/{id}/withdraw"
    description: "Non-terminal application -> WITHDRAWN (vendor owner)"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["status -> WITHDRAWN"]

  # --- BoothAssignment ---
  - method: POST
    path: "/booth-assignments"
    description: "Reserve a booth for a JURIED_IN application while the season is PLANNING or BUILD (else ERR_SEASON_INVALID_STATE); provisional fee computed; half-open site overlap enforced"
    roles: [VendorCoordinator]
    code: 201
    input: [application_id, booth_site, residency_start_date, residency_end_date]
    output: BoothAssignment
    side_effects: ["status RESERVED", "provisional_fee_cents per booth_provisional_fee", "weather_credit_cents 0"]

  - method: GET
    path: "/booth-assignments"
    description: "List booth assignments, filterable by season, application, site"
    roles: [Any]
    code: 200
    input: ["season_id?", "application_id?", "booth_site?", "status?", "limit?", "offset?"]
    output: BoothAssignment[]
    side_effects: []

  - method: GET
    path: "/booth-assignments/{id}"
    description: "Get a booth assignment"
    roles: [Any]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: []

  - method: POST
    path: "/booth-assignments/{id}/confirm"
    description: "RESERVED/SUSPENDED -> CONFIRMED (vendor owner); FOOD/BEVERAGE vendors require an ISSUED unexpired permit"
    roles: [Vendor]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status -> CONFIRMED", "provisional fee committed"]

  - method: POST
    path: "/booth-assignments/{id}/release"
    description: "RESERVED -> RELEASED; promotes top WAITLISTED application per waitlist_promotion selector"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status -> RELEASED", "waitlist promotion"]

  - method: POST
    path: "/booth-assignments/{id}/settle"
    description: "CONFIRMED/SUSPENDED -> SETTLED during Season STRIKE; final fee per booth_final_fee"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["status -> SETTLED", "final_fee_cents and settlement_delta_cents computed"]

  # --- FoodPermit ---
  - method: POST
    path: "/food-permits"
    description: "Apply for a food/beverage health permit on a JURIED_IN application (vendor owner); the application's vendor category must be FOOD or BEVERAGE (else ERR_PERMIT_NOT_APPLICABLE); only one non-terminal permit per application (else ERR_DUPLICATE_PERMIT)"
    roles: [Vendor]
    code: 201
    input: [application_id]
    output: FoodPermit
    side_effects: ["status APPLIED", "inspection_attempts 0"]

  - method: GET
    path: "/food-permits"
    description: "List permits, filterable by application"
    roles: [Any]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: FoodPermit[]
    side_effects: []

  - method: GET
    path: "/food-permits/{id}"
    description: "Get a permit"
    roles: [Any]
    code: 200
    input: []
    output: FoodPermit
    side_effects: []

  - method: POST
    path: "/food-permits/{id}/inspect"
    description: "Record an inspection: PASSED -> ISSUED (mint permit_number, set expiry); FAILED -> AWAITING_REINSPECTION or FAILED_FINAL at attempt cap"
    roles: [VendorCoordinator]
    code: 200
    input: [outcome]
    output: FoodPermit
    side_effects: ["inspection_attempts += 1", "PASSED: permit_number minted, expiry_date set, posture re-derived"]

  - method: POST
    path: "/food-permits/{id}/revoke"
    description: "ISSUED -> REVOKED; suspends the application's confirmed booth and re-derives posture"
    roles: [VendorCoordinator]
    code: 200
    input: []
    output: FoodPermit
    side_effects: ["status -> REVOKED", "BoothAssignment CONFIRMED -> SUSPENDED", "readiness_posture re-derived"]

  # --- TicketOrder ---
  - method: POST
    path: "/ticket-orders"
    description: "Create a ticket order (UNPAID/UNREDEEMED); total computed per ticket_order_total; DAY/GROUP require an OPEN_FOR_SALES faire_day_id (else ERR_DAY_NOT_OPENABLE); SEASON orders require Season.status IN {BUILD, OPEN} (else ERR_SEASON_INVALID_STATE)"
    roles: [Guest]
    code: 201
    input: [season_id, order_type, quantity, unit_price_cents, "faire_day_id?"]
    output: TicketOrder
    side_effects: ["total_cents/discount_pct computed", "refunded_cents 0", "retained_cents := total_cents"]

  - method: GET
    path: "/ticket-orders"
    description: "List ticket orders, filterable by season, day, buyer, payment status"
    roles: [Any]
    code: 200
    input: ["season_id?", "faire_day_id?", "buyer_email?", "payment_status?", "limit?", "offset?"]
    output: TicketOrder[]
    side_effects: []

  - method: GET
    path: "/ticket-orders/{id}"
    description: "Get a ticket order"
    roles: [Any]
    code: 200
    input: []
    output: TicketOrder
    side_effects: []

  - method: PATCH
    path: "/ticket-orders/{id}"
    description: "Edit an UNPAID order (quantity and/or day); repriced per ticket_order_total; OCC-guarded via expected_order_version"
    roles: [Guest]
    code: 200
    input: [expected_order_version, "quantity?", "faire_day_id?"]
    output: TicketOrder
    side_effects: ["increments TicketOrder.version by 1", "total_cents recomputed"]

  - method: POST
    path: "/ticket-orders/{id}/pay"
    description: "UNPAID -> PAID (buyer); mints quantity VALID tickets subject to day capacity"
    roles: [Guest]
    code: 200
    input: []
    output: TicketOrder
    side_effects: ["payment_status -> PAID", "Tickets minted VALID", "Season.outstanding_admissions += quantity"]

  - method: POST
    path: "/ticket-orders/{id}/refund"
    description: "Partial or full refund against retained_cents; preserves the money invariant"
    roles: [GateAgent]
    code: 200
    input: [refund_cents]
    output: TicketOrder
    side_effects: ["refunded_cents += refund_cents", "retained_cents recomputed", "payment_status -> PARTIALLY_REFUNDED or REFUNDED"]

  # --- Ticket ---
  - method: GET
    path: "/tickets"
    description: "List tickets, filterable by order, day, status"
    roles: [Any]
    code: 200
    input: ["order_id?", "faire_day_id?", "status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: GET
    path: "/tickets/{id}"
    description: "Get a ticket"
    roles: [Any]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: POST
    path: "/tickets/{id}/redeem"
    description: "VALID -> REDEEMED at the gate; DAY tickets need their day OPERATING, SEASON passes need an OPERATING day today"
    roles: [GateAgent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> REDEEMED", "redeemed_at stamped", "order redemption_status recomputed"]

  - method: POST
    path: "/tickets/{id}/void"
    description: "VALID -> VOID (manual gate void)"
    roles: [GateAgent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> VOID", "Season.outstanding_admissions -= 1", "order redemption_status recomputed"]

  # --- RainCheck ---
  - method: GET
    path: "/rain-checks"
    description: "List rain checks, filterable by season, source ticket, cancelled day, status"
    roles: [Any]
    code: 200
    input: ["season_id?", "ticket_id?", "issued_for_day_id?", "redeemed_on_day_id?", "status?", "limit?", "offset?"]
    output: RainCheck[]
    side_effects: []

  - method: GET
    path: "/rain-checks/{id}"
    description: "Get a rain check"
    roles: [Any]
    code: 200
    input: []
    output: RainCheck
    side_effects: []

  - method: POST
    path: "/rain-checks/{id}/redeem"
    description: "ISSUED -> REDEEMED into a new VALID day ticket on a target faire day (source order buyer)"
    roles: [Guest]
    code: 200
    input: [target_faire_day_id]
    output: RainCheck
    side_effects: ["status -> REDEEMED", "redeemed_on_day_id set", "new Ticket minted VALID for target day", "Season.outstanding_admissions unchanged"]

  # --- VolunteerShift ---
  - method: POST
    path: "/volunteer-shifts"
    description: "Sign up for a volunteer shift (SIGNED_UP); volunteer_handle set from X-User-ID; same-person overlap rejected; faire day must be SCHEDULED or OPEN_FOR_SALES (else ERR_DAY_NOT_STAFFABLE)"
    roles: [Volunteer]
    code: 201
    input: [season_id, faire_day_id, role, start_time, end_time]
    output: VolunteerShift
    side_effects: ["hours computed"]

  - method: GET
    path: "/volunteer-shifts"
    description: "List volunteer shifts, filterable by season, day, volunteer, status"
    roles: [Any]
    code: 200
    input: ["season_id?", "faire_day_id?", "volunteer_handle?", "status?", "limit?", "offset?"]
    output: VolunteerShift[]
    side_effects: []

  - method: GET
    path: "/volunteer-shifts/{id}"
    description: "Get a volunteer shift"
    roles: [Any]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []

  - method: POST
    path: "/volunteer-shifts/{id}/confirm"
    description: "SIGNED_UP -> CONFIRMED; hours join Season.volunteer_confirmed_hours; posture re-derived"
    roles: [VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["status -> CONFIRMED", "Season.volunteer_confirmed_hours += hours", "readiness_posture re-derived"]

  - method: POST
    path: "/volunteer-shifts/{id}/close-out"
    description: "CONFIRMED -> WORKED or NO_SHOW on/after day operation; NO_SHOW removes hours from the season tally"
    roles: [VolunteerCoordinator]
    code: 200
    input: [outcome]
    output: VolunteerShift
    side_effects: ["WORKED: hours retained", "NO_SHOW: Season.volunteer_confirmed_hours -= hours; posture re-derived"]

  - method: POST
    path: "/volunteer-shifts/{id}/cancel"
    description: "SIGNED_UP/CONFIRMED -> CANCELLED (volunteer owner or coordinator); confirmed hours removed"
    roles: [Volunteer, VolunteerCoordinator]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["status -> CANCELLED", "if CONFIRMED: Season.volunteer_confirmed_hours -= hours; posture re-derived"]

  # --- ConductCase ---
  - method: POST
    path: "/conduct-cases"
    description: "File a conduct/costume-policy case (REPORTED)"
    roles: [GateAgent]
    code: 201
    input: [season_id, category, subject_description, "linked_order_id?", "linked_permit_id?"]
    output: ConductCase
    side_effects: ["status REPORTED"]

  - method: GET
    path: "/conduct-cases"
    description: "List conduct cases, filterable by season, status, linked order, linked permit"
    roles: [Any]
    code: 200
    input: ["season_id?", "status?", "linked_order_id?", "linked_permit_id?", "limit?", "offset?"]
    output: ConductCase[]
    side_effects: []

  - method: GET
    path: "/conduct-cases/{id}"
    description: "Get a conduct case"
    roles: [Any]
    code: 200
    input: []
    output: ConductCase
    side_effects: []

  - method: POST
    path: "/conduct-cases/{id}/resolve"
    description: "REPORTED -> UPHELD (with sanction NONE | BAN_GUEST | REVOKE_PERMIT and cascades) or DISMISSED"
    roles: [FaireOperator]
    code: 200
    input: [outcome, sanction]
    output: ConductCase
    side_effects: ["status per outcome", "BAN_GUEST: linked order's VALID tickets -> VOID, order -> VOID", "REVOKE_PERMIT: permit -> REVOKED, booth -> SUSPENDED, posture re-derived"]

  # --- BuildTask ---
  - method: POST
    path: "/build-tasks"
    description: "Create a build/strike task (PENDING); same-season dependency DAG, cycles rejected; phase BUILD requires season PLANNING or BUILD, phase STRIKE requires season PLANNING, BUILD, OPEN, or STRIKE (else ERR_SEASON_INVALID_STATE)"
    roles: [FaireOperator]
    code: 201
    input: [season_id, phase, name, "depends_on_task_ids?"]
    output: BuildTask
    side_effects: ["status PENDING", "readiness_posture re-derived (a PENDING BUILD task blocks posture)"]

  - method: GET
    path: "/build-tasks"
    description: "List build tasks, filterable by season, phase, status"
    roles: [Any]
    code: 200
    input: ["season_id?", "phase?", "status?", "depends_on_task_ids?", "limit?", "offset?"]
    output: BuildTask[]
    side_effects: []

  - method: GET
    path: "/build-tasks/{id}"
    description: "Get a build task"
    roles: [Any]
    code: 200
    input: []
    output: BuildTask
    side_effects: []

  - method: GET
    path: "/build-tasks/{id}/dependents"
    description: "List tasks that declare this task in depends_on_task_ids"
    roles: [Any]
    code: 200
    input: []
    output: BuildTask[]
    side_effects: []

  - method: POST
    path: "/build-tasks/{id}/dependencies"
    description: "Add dependencies to a non-terminal BuildTask; rejected if the addition would create a same-season dependency cycle (ERR_TASK_DEPENDENCY_CYCLE) or reference a terminal/foreign task"
    roles: [FaireOperator]
    code: 200
    input: [add_task_ids]
    output: BuildTask
    side_effects: ["depends_on_task_ids extended", "cycle validation"]

  - method: POST
    path: "/build-tasks/{id}/advance"
    description: "PENDING -> IN_PROGRESS (dependencies must be DONE) -> DONE; BUILD-phase completion re-derives posture"
    roles: [FaireOperator]
    code: 200
    input: [to]
    output: BuildTask
    side_effects: ["status per to", "on DONE with phase BUILD: readiness_posture re-derived"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any set call is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. May be set to any ISO8601 instant."
    roles: [FaireOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock updated; lazy EXPIRED transitions evaluate against the new instant on subsequent reads/writes"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Caller role not in the endpoint's allowed roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed or handle ownership check failed (X-User-ID != resource owner id/handle)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, type/enum/range invalid, unknown field, or order-type/faire_day_id shape violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

  # --- Not found ---
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "Season id does not exist" }
  - { id: ERR_FAIRE_DAY_NOT_FOUND, http: 404, condition: "FaireDay id does not exist" }
  - { id: ERR_PERFORMER_NOT_FOUND, http: 404, condition: "Performer id does not exist" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "CastContract id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "RehearsalSlot id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "Vendor id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "VendorApplication id does not exist" }
  - { id: ERR_BOOTH_NOT_FOUND, http: 404, condition: "BoothAssignment id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "FoodPermit id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "TicketOrder id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Ticket id does not exist" }
  - { id: ERR_RAIN_CHECK_NOT_FOUND, http: 404, condition: "RainCheck id does not exist" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "VolunteerShift id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "ConductCase id does not exist" }
  - { id: ERR_TASK_NOT_FOUND, http: 404, condition: "BuildTask id does not exist" }

  # --- Season / day state ---
  - { id: ERR_SEASON_NOT_IN_PLANNING, http: 409, condition: "Operation requires Season.status PLANNING (config patch, begin-build, vendor application filing)" }
  - { id: ERR_SEASON_INVALID_STATE, http: 409, condition: "Season not in the required lifecycle state for the operation" }
  - { id: ERR_SEASON_NOT_READY, http: 409, condition: "Season open requires readiness_posture READY" }
  - { id: ERR_SEASON_POSTURE_BLOCKED, http: 409, condition: "Faire-day sales opening blocked while readiness_posture is BLOCKED" }
  - { id: ERR_SEASON_NOT_OPEN, http: 409, condition: "open-gates requires Season.status OPEN" }
  - { id: ERR_UNRESOLVED_FAIRE_DAYS, http: 409, condition: "begin-strike requires every FaireDay COMPLETED or CANCELLED_WEATHER" }
  - { id: ERR_STRIKE_TASKS_INCOMPLETE, http: 409, condition: "Season close requires all STRIKE-phase BuildTasks DONE" }
  - { id: ERR_UNSETTLED_BOOTHS, http: 409, condition: "Season close requires every BoothAssignment SETTLED or RELEASED" }
  - { id: ERR_DAY_NOT_OPENABLE, http: 409, condition: "open-sales/open-gates requires FaireDay status SCHEDULED/OPEN_FOR_SALES respectively" }
  - { id: ERR_DAY_NOT_HOLDABLE, http: 409, condition: "weather-hold requires OPEN_FOR_SALES" }
  - { id: ERR_DAY_NOT_ON_HOLD, http: 409, condition: "release-hold requires WEATHER_HOLD" }
  - { id: ERR_DAY_NOT_CANCELLABLE, http: 409, condition: "cancel-weather requires OPEN_FOR_SALES or WEATHER_HOLD" }
  - { id: ERR_DAY_NOT_COMPLETABLE, http: 409, condition: "complete requires OPERATING" }
  - { id: ERR_OPEN_SHIFTS_EXIST, http: 409, condition: "complete requires all of the day's VolunteerShifts terminal" }
  - { id: ERR_WEATHER_CALL_TOO_LATE, http: 409, condition: "cancel-weather at or after date + weather_call_deadline_hour" }
  - { id: ERR_DAY_NOT_TODAY, http: 409, condition: "open-gates requires clock calendar date == FaireDay.date" }
  - { id: ERR_DAY_NOT_OPERATING, http: 409, condition: "Operation requires an OPERATING faire day (ticket redemption, shift close-out)" }
  - { id: ERR_DAY_NOT_REDEEMABLE, http: 409, condition: "Rain-check target day must be SCHEDULED or OPEN_FOR_SALES" }
  - { id: ERR_DAY_NOT_STAFFABLE, http: 409, condition: "Volunteer shift sign-up requires the faire day SCHEDULED or OPEN_FOR_SALES" }

  # --- Cast / rehearsal ---
  - { id: ERR_CONTRACT_NOT_OFFERABLE, http: 409, condition: "offer requires contract DRAFT or COUNTERED" }
  - { id: ERR_CONTRACT_NOT_OFFERED, http: 409, condition: "counter/accept requires contract OFFERED" }
  - { id: ERR_CONTRACT_NOT_TERMINABLE, http: 409, condition: "terminate requires a non-terminal contract" }
  - { id: ERR_CONTRACT_NOT_REHEARSABLE, http: 409, condition: "rehearsal slot creation requires contract ACCEPTED or REHEARSING" }
  - { id: ERR_SLOT_NOT_RECORDABLE, http: 409, condition: "record-attendance requires slot SCHEDULED" }
  - { id: ERR_SLOT_NOT_CANCELLABLE, http: 409, condition: "cancel requires slot SCHEDULED" }
  - { id: ERR_REHEARSAL_OVERLAP, http: 409, condition: "Stage occupied: new [start, end + 15min) intersects an existing SCHEDULED/ATTENDED slot's [start, end + 15min)" }

  # --- Vendor / booth / permit ---
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Vendor already has a non-terminal application for the season" }
  - { id: ERR_APPLICATION_NOT_DECIDABLE, http: 409, condition: "decide requires JURY_REVIEW, APPEALED, or WAITLISTED" }
  - { id: ERR_APPLICATION_NOT_APPEALABLE, http: 409, condition: "appeal requires JURIED_OUT" }
  - { id: ERR_APPEAL_ALREADY_USED, http: 409, condition: "The single appeal has already been consumed" }
  - { id: ERR_APPLICATION_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires a non-terminal application" }
  - { id: ERR_APPLICATION_NOT_JURIED_IN, http: 409, condition: "booth reservation / permit application requires JURIED_IN" }
  - { id: ERR_APPLICATION_ALREADY_BOOKED, http: 409, condition: "Application already has a non-terminal booth assignment" }
  - { id: ERR_BOOTH_OVERLAP, http: 409, condition: "Booth site occupied: half-open residencies [start, end) intersect" }
  - { id: ERR_BOOTH_NOT_CONFIRMABLE, http: 409, condition: "confirm requires RESERVED or SUSPENDED" }
  - { id: ERR_BOOTH_NOT_RELEASEABLE, http: 409, condition: "release requires RESERVED" }
  - { id: ERR_BOOTH_NOT_SETTLEABLE, http: 409, condition: "settle requires CONFIRMED or SUSPENDED" }
  - { id: ERR_FOOD_PERMIT_NOT_ISSUED, http: 409, condition: "FOOD/BEVERAGE booth confirm requires an ISSUED, unexpired FoodPermit" }
  - { id: ERR_PERMIT_NOT_APPLICABLE, http: 409, condition: "Permits apply only to FOOD/BEVERAGE vendor applications" }
  - { id: ERR_DUPLICATE_PERMIT, http: 409, condition: "Application already has a non-terminal permit" }
  - { id: ERR_PERMIT_NOT_INSPECTIONABLE, http: 409, condition: "inspect requires APPLIED or AWAITING_REINSPECTION" }
  - { id: ERR_PERMIT_NOT_REVOKABLE, http: 409, condition: "revoke requires ISSUED" }

  # --- Ticketing ---
  - { id: ERR_GROUP_SIZE_BELOW_MINIMUM, http: 422, condition: "GROUP order quantity < season.group_min_size" }
  - { id: ERR_DAY_AT_CAPACITY, http: 409, condition: "Minting would push the faire day past season.daily_capacity" }
  - { id: ERR_ORDER_NOT_UNPAID, http: 409, condition: "patch/pay requires payment_status UNPAID" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "refund_cents > retained_cents" }
  - { id: ERR_NOTHING_REFUNDABLE, http: 409, condition: "refund against a FULLY_REDEEMED order" }
  - { id: ERR_ORDER_NOT_REFUNDABLE, http: 409, condition: "refund against a RAINCHECKED or VOID order" }
  - { id: ERR_TICKET_NOT_VALID, http: 409, condition: "redeem/void requires ticket VALID" }
  - { id: ERR_RAIN_CHECK_NOT_ISSUED, http: 409, condition: "redeem requires rain check ISSUED" }
  - { id: ERR_RAIN_CHECK_EXPIRED, http: 409, condition: "redeem after redeem_by_date" }

  # --- Volunteer / conduct / build ---
  - { id: ERR_VOLUNTEER_SHIFT_OVERLAP, http: 409, condition: "Same volunteer_handle has a SIGNED_UP/CONFIRMED shift whose half-open interval intersects" }
  - { id: ERR_SHIFT_NOT_CONFIRMABLE, http: 409, condition: "confirm requires SIGNED_UP" }
  - { id: ERR_SHIFT_NOT_CLOSABLE, http: 409, condition: "close-out requires CONFIRMED" }
  - { id: ERR_SHIFT_NOT_CANCELLABLE, http: 409, condition: "cancel requires SIGNED_UP or CONFIRMED" }
  - { id: ERR_CASE_ALREADY_RESOLVED, http: 409, condition: "resolve requires REPORTED" }
  - { id: ERR_CASE_LINKAGE_INVALID, http: 409, condition: "sanction BAN_GUEST without linked_order_id or REVOKE_PERMIT without linked_permit_id" }
  - { id: ERR_TASK_DEPENDENCY_UNMET, http: 409, condition: "advance to IN_PROGRESS requires all depends_on_task_ids DONE" }
  - { id: ERR_TASK_DEPENDENCY_CYCLE, http: 409, condition: "depends_on_task_ids would create a dependency cycle within the season" }
  - { id: ERR_TASK_NOT_ADVANCEABLE, http: 409, condition: "advance requires PENDING->IN_PROGRESS->DONE order" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: FaireOperator
    description: "Faire owner/operator; admin superset over season lifecycle, faire days, site build/strike, and conduct resolution"
    identity: opaque
    exclusive_operations:
      - "POST /seasons, PATCH /seasons/{id}, POST /seasons/{id}/begin-build|open|begin-strike|close"
      - "POST /faire-days, POST /faire-days/{id}/open-sales|weather-hold|release-hold|cancel-weather|open-gates|complete"
      - "POST /conduct-cases/{id}/resolve"
      - "POST /build-tasks, POST /build-tasks/{id}/advance, POST /build-tasks/{id}/dependencies"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: CastDirector
    description: "Casting and rehearsal management"
    identity: opaque
    exclusive_operations:
      - "POST /performers"
      - "POST /cast-contracts, POST /cast-contracts/{id}/offer|terminate"
      - "POST /rehearsal-slots, POST /rehearsal-slots/{id}/record-attendance|cancel"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: VendorCoordinator
    description: "Vendor jury, booth, and health-permit administration"
    identity: opaque
    exclusive_operations:
      - "POST /vendors"
      - "POST /vendor-applications/{id}/decide"
      - "POST /booth-assignments, POST /booth-assignments/{id}/release|settle"
      - "POST /food-permits/{id}/inspect|revoke"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: GateAgent
    description: "Front-gate operations: refunds, ticket scans/voids, conduct filing"
    identity: opaque
    exclusive_operations:
      - "POST /tickets/{id}/redeem|void"
      - "POST /ticket-orders/{id}/refund"
      - "POST /conduct-cases"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: VolunteerCoordinator
    description: "Weekend staffing desk: confirms and closes out volunteer shifts"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-shifts/{id}/confirm|close-out"
    shared_operations:
      - "POST /volunteer-shifts/{id}/cancel (shared with Volunteer)"
      - "All GET endpoints (via Any)"

  - name: Performer
    description: "Cast member negotiating their own contract"
    identity: "entity_backed:Performer"
    exclusive_operations:
      - "POST /cast-contracts/{id}/counter|accept (must own the contract: X-User-ID == contract.performer_id)"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: Vendor
    description: "Vendor/artisan acting on own applications, booths, and permits"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendor-applications (vendor_id := X-User-ID)"
      - "POST /vendor-applications/{id}/appeal|withdraw (owner)"
      - "POST /booth-assignments/{id}/confirm (owner of linked application)"
      - "POST /food-permits (owner of linked application)"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: Volunteer
    description: "Volunteer managing own shift sign-ups"
    identity: opaque
    exclusive_operations:
      - "POST /volunteer-shifts (volunteer_handle := X-User-ID)"
    shared_operations:
      - "POST /volunteer-shifts/{id}/cancel (own shifts; shared with VolunteerCoordinator)"
      - "All GET endpoints (via Any)"

  - name: Guest
    description: "Ticket buyer; X-User-ID is the buyer email"
    identity: opaque
    exclusive_operations:
      - "POST /ticket-orders (buyer_email := X-User-ID)"
      - "PATCH /ticket-orders/{id}, POST /ticket-orders/{id}/pay (buyer)"
      - "POST /rain-checks/{id}/redeem (source order buyer)"
    shared_operations: ["All GET endpoints (via Any)"]

  - name: Any
    description: "Shared read access: every authenticated role may call any GET endpoint"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET / endpoints (lists and single-resource reads)"]
