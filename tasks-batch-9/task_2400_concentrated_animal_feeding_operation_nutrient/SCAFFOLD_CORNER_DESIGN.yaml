              captures: { fld_last: $.data.last_application_on }
          assert:
            - "the POST response itself already carries ${ev_rate} == 5000.00 and ${ev_n} == 1560.00, so no follow-up read is needed to see the event's own derived columns"
            - "${bd_applied} == 100000.00 and ${bd_left} == 314396 on the very next read, with applied_gallons_to_date + remaining_gallons still equal to allowable_total_gallons 414396"
            - "${st_vol} == 900000.00 and ${st_days} == 388, from an available capacity of 3588300.00 gallons divided by the 9244.65 gallon summer daily rate and floored"
            - "${op_recorded} == 100000.00, because the records basis is recomputed on the event write rather than on a later clock move"
            - "${fld_last} == 2026-07-10T00:00:00Z, so the stamp is visible immediately to the planner who did not write it"
