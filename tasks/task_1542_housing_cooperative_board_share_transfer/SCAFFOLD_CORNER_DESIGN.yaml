            - "Meeting.meeting_status == ADJOURNED_NO_QUORUM (close succeeds as adjournment, not as COMPLETED)"
            - "Meeting.quorum_state == QUORUM_FAILED"

  # ===========================================================================
  # Section: rbac — exclusive ops denied to wrong roles
  # ===========================================================================
  - section: rbac
    instances:
      - name: board_member_cannot_certify_application
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "BoardMember (not ManagingAgent) attempting /certify → ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["PurchaseApplication SUBMITTED"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "RBAC2", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "POST /cooperatives/${cid}/purchase-applications"
              payload: { unit_id: "${uid}", seller_shareholder_id: "${sid}", buyer_full_name: "B", buyer_email: "b@x.com", gross_sale_price_cents: 50000000, financing_percent_bps: 5000, debt_to_income_bps: 1000, post_closing_liquidity_cents: 99999999 }
              as: Shareholder
              as_user_id: "${sid}"
              captures: { app: $.data.id }
            - call: "POST /cooperatives/${cid}/purchase-applications/${app}/submit"
              payload: {}
              as: Shareholder
              as_user_id: "${sid}"
          trigger:
            - call: "POST /cooperatives/${cid}/purchase-applications/${app}/certify"
              payload: {}
              as: BoardMember
              as_user_id: "bm-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "http_status == 403"

      - name: managing_agent_cannot_vote_on_resolution
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "ManagingAgent cannot cast votes on Resolutions → ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Open Resolution"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "RBAC3", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "SET_POLICY", subject_entity_kind: "Cooperative", subject_entity_id: "${cid}", payload_json: {} }
              as: BoardOfficer
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: ManagingAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "http_status == 403"

      - name: shareholder_cannot_advance_clock
        claim_type: violation_to_error
        grounds: [roles]
        distinguishing_aspect: "Shareholder cannot call /_clock/set_current_utc (PlatformAdmin exclusive) → ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Cooperative + Shareholder"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "RBAC4", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /cooperatives/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Shareholder
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"
            - "http_status == 403"

  # ===========================================================================
  # Section: complexity_layers — OCC, cascading side effects, scheduled actions,
  # derived field reconciliation
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: schedule_create_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[schedule-supersede-stale-coop-version]"]
        distinguishing_aspect: "POST /charge-schedules with stale expected_cooperative_version → ERR_STALE_COOP_VERSION 412."
        test_recipe:
          setup: ["Cooperative; client holds version N; a unit add bumps version to N+1"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "OCC2", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500 }
              as: PlatformAdmin
              captures: { cid: $.data.id, v1: $.data.version }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
          trigger:
            - call: "POST /cooperatives/${cid}/charge-schedules"
              payload: { fiscal_year: 2027, annual_operating_budget_cents: 1000000, allocation_method: "PRO_RATA_SHARES", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", expected_cooperative_version: "${v1}" }
              as: BoardOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_COOP_VERSION"
            - "http_status == 412"

      - name: derived_field_reconciliation_arrears_balance
        claim_type: derived_field_reconciliation
        grounds: [entities.Shareholder.fields.arrears_balance_cents]
        distinguishing_aspect: "Shareholder.arrears_balance_cents is derived from sum of outstanding charges; stays in sync after payment, void, and charge waive."
        test_recipe:
          setup: ["Shareholder with one PAST_DUE charge of 105000 outstanding"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Derived", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500, arrears_late_fee_flat_cents: 5000, arrears_grace_days: 5, arrears_interest_rate_bps: 0 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${cid}"
              as: PlatformAdmin
              captures: { cv: $.data.version }
            - call: "POST /cooperatives/${cid}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 1200000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${cv}" }
              as: BoardOfficer
              captures: { cs: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs}", payload_json: {} }
              as: BoardOfficer
              captures: { rid: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b1"
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b2"
            - call: "POST /cooperatives/${cid}/resolutions/${rid}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b3"
            - call: "POST /cooperatives/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cooperatives/${cid}/shareholders/${sid}"
              as: BoardOfficer
              captures: { arr: $.data.arrears_balance_cents, standing: $.data.standing }
            - call: "GET /cooperatives/${cid}/maintenance-charges"
              as: BoardOfficer
              captures: { mc: "$.data[0].id" }
            - call: "POST /cooperatives/${cid}/maintenance-charges/${mc}/payments"
              payload: { shareholder_id: "${sid}", amount_cents: 105000 }
              as: ManagingAgent
            - call: "GET /cooperatives/${cid}/shareholders/${sid}"
              as: BoardOfficer
              captures: { arr2: $.data.arrears_balance_cents, standing2: $.data.standing }
          assert:
            - "Before payment: arrears_balance_cents == 105000, standing == DELINQUENT"
            - "After full payment: arrears_balance_cents == 0, standing == GOOD_STANDING"

      - name: cascading_side_effect_termination_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Shareholder.DELINQUENT_to_TERMINATED]
        distinguishing_aspect: "Shareholder TERMINATED cascades to: ShareLedgerEntry SUPERSEDED, active SubletAgreement TERMINATED_EARLY, AlterationAgreement ABANDONED, open PurchaseApplication WITHDRAWN."
        test_recipe:
          setup: ["Shareholder DELINQUENT with sublet APPROVED, alteration APPROVED, purchase SUBMITTED; arrears above termination threshold; PASSED resolution to terminate"]
          setup_api_calls:
            - call: "POST /cooperatives"
              payload: { name: "Cascade2", address: "X", underlying_mortgage_principal_cents: 100, underlying_mortgage_rate_bps: 500, arrears_late_fee_flat_cents: 0, arrears_grace_days: 5, arrears_interest_rate_bps: 0, arrears_termination_threshold_cents: 50000, sublet_policy_gap_years: 0 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /cooperatives/${cid}/units"
              payload: { unit_label: "1A", shares_allocated: 100 }
              as: PlatformAdmin
              captures: { uid: $.data.id }
            - call: "POST /cooperatives/${cid}/shareholders"
              payload: { full_name: "S", email: "s@x.com" }
              as: BoardOfficer
              captures: { sid: $.data.id }
            - call: "POST /cooperatives/${cid}/share-ledger-entries"
              payload: { unit_id: "${uid}", shareholder_id: "${sid}", shares_held: 100 }
              as: BoardOfficer
            - call: "GET /cooperatives/${cid}"
              as: PlatformAdmin
              captures: { cv: $.data.version }
            - call: "POST /cooperatives/${cid}/charge-schedules"
              payload: { fiscal_year: 2026, annual_operating_budget_cents: 1200000, allocation_method: "PRO_RATA_SHARES", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_cooperative_version: "${cv}" }
              as: BoardOfficer
              captures: { cs: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "APPROVE_SCHEDULE", subject_entity_kind: "ChargeSchedule", subject_entity_id: "${cs}", payload_json: {} }
              as: BoardOfficer
              captures: { r1: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${r1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b1"
            - call: "POST /cooperatives/${cid}/resolutions/${r1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b2"
            - call: "POST /cooperatives/${cid}/resolutions/${r1}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b3"
            - call: "POST /cooperatives/${cid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            # outstanding = 100000 (> 50000 threshold). Issue TERMINATION_NOTICE directly.
            - call: "POST /cooperatives/${cid}/arrears-actions"
              payload: { shareholder_id: "${sid}", action_type: "TERMINATION_NOTICE" }
              as: BoardOfficer
              captures: { aa: $.data.id }
            # Resolution to escalate termination
            - call: "POST /cooperatives/${cid}/resolutions"
              payload: { resolution_kind: "ISSUE_ARREARS_ACTION", subject_entity_kind: "Shareholder", subject_entity_id: "${sid}", payload_json: { arrears_action_id: "${aa}" } }
              as: BoardOfficer
              captures: { r2: $.data.id }
            - call: "POST /cooperatives/${cid}/resolutions/${r2}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b1"
            - call: "POST /cooperatives/${cid}/resolutions/${r2}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b2"
            - call: "POST /cooperatives/${cid}/resolutions/${r2}/vote"
              payload: { vote_choice: "FOR" }
              as: BoardMember
              as_user_id: "b3"
          trigger:
            - call: "POST /cooperatives/${cid}/arrears-actions/${aa}/escalate"
              payload: {}
              as: BoardOfficer
            - call: "GET /cooperatives/${cid}/shareholders/${sid}"
              as: BoardOfficer
              captures: { standing: $.data.standing }
            - call: "GET /cooperatives/${cid}/share-ledger-entries?shareholder_id=${sid}"
              as: BoardOfficer
              captures: { entries: $.data }
          assert:
            - "Shareholder.standing == TERMINATED"
            - "All ShareLedgerEntry rows for sid have entry_status == SUPERSEDED"
            - "Cascade side-effects verified"
