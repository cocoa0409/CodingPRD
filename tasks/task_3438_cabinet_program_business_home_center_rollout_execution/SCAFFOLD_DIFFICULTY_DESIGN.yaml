# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: cabinet_program_business_home_center_rollout_execution
# 9 rules x >=2 instances = 19 instances total (combinatorial_formula has 3).
# All arithmetic in assert: lines was executed against the scaffold's own
# formulas (round_half_up integer cents; ISO week of 2026-09-01 = 2026-W36).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: quoted_vs_invoiced_pricing_diverges_across_line_supersede
        grounds:
          - calculations.order_pricing
          - state_machines.ProgramLine.ACTIVE_to_SUNSETTING
          - entities.Order.fields.invoiced_total_cents
          - entities.Order.fields.price_lock
        distinguishing_aspect: |
          Same cart, same account: order1 invoices while price_lock holds (quoted
          basis, old line F1=10000) and order2 invoices after a line supersede
          broke its lock (repriced under the new line F1=11000). The invoiced
          variant on the money domain yields 525240 vs 577800 for identical input
          carts; instance is distinct from the scheduling-domain dual variant.
        test_recipe:
          setup:
            - "Dealer account (VOLUME, STANDARD lead class, huge credit limit), program with 3% discount, line L1 with family F1 price 10000 / lead 3 / complexity 1, program ACTIVE"
            - "Slot PLANT_EAST x F1 x 2026-W37 capacity 1000; finish batch B1 for OAK CURRENT"
            - "order1 and order2: identical carts, F1 x60, requested 2026-W40, both ACKNOWLEDGED (locked) and SCHEDULED; order1 invoiced BEFORE the supersede"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D1", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.03 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
              captures: { line1: $.data.id }
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "POST /cabinet/production-slots"
              payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 1000 }
              as: PlantScheduler
            - call: "POST /cabinet/finish-batches"
              payload: { finish_code: "OAK", batch_code: "B1", lab_l: 50, lab_a: 20, lab_b: 30, effective_from: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 60 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 60 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/financial", payload: { to_status: INVOICED }, as: ProgramManager }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v2: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 11000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v2}", old_line_disposition_qty: 0 }
              as: ProgramManager
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
          trigger:
            - { call: "POST /cabinet/orders/${o2}/financial", payload: { to_status: INVOICED }, as: ProgramManager }
          assert:
            - "GET /cabinet/orders/${o1}: quoted_total_cents == 525240 AND invoiced_total_cents == 525240 (lock held: old-line price 10000 basis)"
            - "GET /cabinet/orders/${o2}: quoted_total_cents == 525240 AND invoiced_total_cents == 577800 (lock broken by supersede; repriced under L2 price 11000)"
            - "GET /cabinet/orders/${o2}: price_lock == false"
            - "order1.invoiced_total_cents != order2.invoiced_total_cents for identical carts"

      - name: promised_week_table_vs_capacity_aware_scheduled_week_diverge
        grounds:
          - calculations.delivery_week_estimation
          - calculations.capacity_slot_selection
          - entities.Order.fields.promised_delivery_week
          - entities.Order.fields.scheduled_delivery_week
        distinguishing_aspect: |
          delivery_week_estimation's channel_table variant (capacity-blind) and
          capacity_aware variant (slot-constrained) answer the same when-will-it-
          arrive question: order1 schedules inside its promise, order2 slips a
          week when the only primary-window slot fills. Scheduling domain,
          distinct from the money-domain pricing instance.
        test_recipe:
          setup:
            - "Dealer account (VOLUME, STANDARD lead class), program 0% discount, line with F1 price 10000 / lead 3 / complexity 1, ACTIVE"
            - "Slots: F1 x 2026-W37 cap 10, F1 x 2026-W38 cap 10 (both PLANT_EAST); clock at 2026-09-01 (week 2026-W36)"
            - "order1 qty 10 requested 2026-W40; order2 qty 5 requested 2026-W40; both ACKNOWLEDGED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D2", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 10 }, as: PlantScheduler }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W38", capacity_units: 10 }, as: PlantScheduler }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 10 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 5 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
          trigger:
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
          assert:
            - "GET /cabinet/orders/${o1}: promised_delivery_week == '2026-W39' (table: submit week W36 + lead 3) AND scheduled_week == '2026-W37' AND scheduled_delivery_week == '2026-W40'"
            - "GET /cabinet/orders/${o2}: promised_delivery_week == '2026-W39' AND scheduled_week == '2026-W38' (W37 full: 10 + 5 > 10) AND scheduled_delivery_week == '2026-W41'"
            - "order2.promised_delivery_week != order2.scheduled_delivery_week (capacity slip beyond the promise)"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum_pinned
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-unit (two
          half-up steps) BEFORE multiplying by qty and summing. Families priced
          3333 and 3334 at VOLUME x0.95 then program x0.97 give 6143 under the
          pinned order; the sum-raw-then-round alternative gives 6144 — a
          one-cent divergence the test must catch.
        test_recipe:
          setup:
            - "Dealer account VOLUME, program with program_discount_pct 0.03, line with families FA price 3333 and FB price 3334 (lead 2, complexity 1), ACTIVE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D3", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.03 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "FA", standard_price_cents: 3333, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }, { family_code: "FB", standard_price_cents: 3334, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
          trigger:
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "FA", finish_code: "OAK", quantity: 1 }, { family_code: "FB", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
          assert:
            - "GET /cabinet/orders/${o1}: quoted_total_cents == 6143 (per-line: round(3166x0.97)=3071 + round(3167x0.97)=3072)"
            - "quoted_total_cents != 6144 (the unpinned sum-then-round alternative)"

      - name: volume_tier_keyed_on_prediscount_gross_evaluation_order
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the 5% tier is keyed on the
          PRE-discount gross (500000 exactly), and the pinned evaluation order
          keeps the tier even though applying it pulls the payable total to
          475000, back below the threshold. A post-discount re-derivation would
          yield 500000; the pinned order yields 475000.
        test_recipe:
          setup:
            - "Dealer account VOLUME, program with program_discount_pct 0.0, line with family F1 price 10526 / lead 3 / complexity 1, ACTIVE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D4", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10526, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
          trigger:
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 50 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
          assert:
            - "GET /cabinet/orders/${o1}: quoted_total_cents == 475000 (gross exactly 500000 hits the inclusive 5% tier: 50 x round(10000x0.95))"
            - "quoted_total_cents != 500000 (tier NOT re-derived from the post-discount total)"

      - name: damage_settlement_min_cap_and_age_tier
        grounds:
          - calculations.damage_settlement
          - entities.DamageClaim.fields.settlement_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: nested min(invoiced
          basis, 1.20x standard cap), a conditional age tier (<=7 days full, else
          0.8), and a branch on resolution. claim1 (age 3 days) settles 9500,
          claim2 (age 10 days) settles 7600 for the same line and quantity.
        test_recipe:
          setup:
            - "Dealer account VOLUME, program 0% discount, F1 price 10000 / lead 3 / complexity 1; slot W37 cap 10; batch B1 OAK CURRENT"
            - "Order qty 2 delivered on 2026-09-01 (shipment through LOADED/IN_TRANSIT/DELIVERED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D5", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 10 }, as: PlantScheduler }
            - { call: "POST /cabinet/finish-batches", payload: { finish_code: "OAK", batch_code: "B1", lab_l: 50, lab_a: 20, lab_b: 30, effective_from: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 2 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
            - call: "GET /cabinet/shipments?order_id=${o1}"
              as: LogisticsCoordinator
              captures: { ship: "$.data[0].id" }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: LOADED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: IN_TRANSIT }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: DELIVERED }, as: LogisticsCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/claims"
              payload: { shipment_id: "${ship}", order_id: "${o1}", line_index: 0, claimed_qty: 1 }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { c1: $.data.id }
            - { call: "POST /cabinet/claims/${c1}/transition", payload: { to_status: UNDER_REVIEW }, as: ClaimsAdjuster, as_user_id: "ca-1" }
            - { call: "POST /cabinet/claims/${c1}/transition", payload: { to_status: APPROVED, resolution: CREDIT }, as: ClaimsAdjuster, as_user_id: "ca-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/claims"
              payload: { shipment_id: "${ship}", order_id: "${o1}", line_index: 0, claimed_qty: 1 }
              as: LogisticsCoordinator
              as_user_id: "lc-1"
              captures: { c2: $.data.id }
            - { call: "POST /cabinet/claims/${c2}/transition", payload: { to_status: UNDER_REVIEW }, as: ClaimsAdjuster, as_user_id: "ca-1" }
          trigger:
            - { call: "POST /cabinet/claims/${c2}/transition", payload: { to_status: APPROVED, resolution: CREDIT }, as: ClaimsAdjuster, as_user_id: "ca-1" }
          assert:
            - "GET /cabinet/claims/${c1}: settlement_cents == 9500 (min(1x9500, round(1x10000x1.2)) x 1.0, age 3 days)"
            - "GET /cabinet/claims/${c2}: settlement_cents == 7600 (9500 x 0.8, age 10 days)"
            - "claim1.settlement_cents != claim2.settlement_cents for identical quantity on the same line"

  - rule_id: non_linear_state_machine
    instances:
      - name: design_job_revision_cycle_bounded_by_cap
        grounds:
          - state_machines.DesignJob
          - entities.DesignJob.fields.revision_count
          - "errors[ERR_REVISION_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Cyclic machine on DesignJob: QUOTED -> LAYOUT_READY -> QUOTED ->
          MEASURED -> LAYOUT_READY -> QUOTED loops with a hard cap of 3 backward
          revisions; the 4th is rejected. Distinct from the parallel-dimensions
          shape exercised on Order.
        test_recipe:
          setup:
            - "RETAIL account with store_codes [ST-1, ST-2]; program ACTIVE with line F1 price 10000 / lead 2 / complexity 1; clock 2026-09-01"
            - "One design job for store ST-1 with window 2026-09-02T09:00:00Z-10:00:00Z owned by designer des-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Retail R1", channel: RETAIL, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: ["ST-1", "ST-2"] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "POST /cabinet/design-jobs"
              payload: { account_id: "${acct}", program_id: "${prog}", store_code: "ST-1", measure_window_start: "2026-09-02T09:00:00Z", measure_window_end: "2026-09-02T10:00:00Z" }
              as: RetailDesigner
              as_user_id: "des-1"
              captures: { job: $.data.id }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: MEASURED }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: QUOTED }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 2 }] }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: QUOTED }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: MEASURED, measure_window_start: "2026-09-03T09:00:00Z", measure_window_end: "2026-09-03T10:00:00Z" }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: QUOTED }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 3 }] }, as: RetailDesigner, as_user_id: "des-1" }
            - { call: "POST /cabinet/design-jobs/${job}/transition", payload: { to_status: QUOTED }, as: RetailDesigner, as_user_id: "des-1" }
          trigger:
            - call: "POST /cabinet/design-jobs/${job}/transition"
              payload: { to_status: LAYOUT_READY, layout_lines: [{ family_code: "F1", finish_code: "OAK", quantity: 4 }] }
              as: RetailDesigner
              as_user_id: "des-1"
              captures: { err: $.data.error_id }
          assert:
            - "4th backward revision rejected: err == ERR_REVISION_LIMIT_EXCEEDED"
            - "GET /cabinet/design-jobs/${job}: status == QUOTED (unchanged) AND revision_count == 3"
            - "Cycle repriced each pass: quoted_total_cents after revision 1 was 20000 (qty 2 x 10000) and after revision 3 is 30000 (qty 3 x 10000)"

      - name: order_payment_and_fulfillment_dimensions_evolve_independently
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - calculations.credit_exposure
        distinguishing_aspect: |
          Parallel state dimensions on Order: order2 sits at status=ACKNOWLEDGED
          with payment_status=CREDIT_HOLD while order1 independently walks
          fulfillment to MFG_COMPLETE and payment UNINVOICED->INVOICED->PAID;
          order1's payment then flips order2's payment dimension back to
          UNINVOICED without touching order2's fulfillment state. Distinct from
          the cyclic shape on DesignJob.
        test_recipe:
          setup:
            - "Dealer account VOLUME, credit_limit_cents 100000, program 0% discount, F1 price 10000 / lead 3 / complexity 1, ACTIVE; slot W37 cap 100; batch B1 OAK CURRENT"
            - "order1 qty 10 (95000), order2 qty 1 (9500); order1 ACKNOWLEDGED; order2 acknowledged into CREDIT_HOLD"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D6", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 100 }, as: PlantScheduler }
            - { call: "POST /cabinet/finish-batches", payload: { finish_code: "OAK", batch_code: "B1", lab_l: 50, lab_a: 20, lab_b: 30, effective_from: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 10 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/financial", payload: { to_status: INVOICED }, as: ProgramManager }
          trigger:
            - { call: "POST /cabinet/orders/${o1}/financial", payload: { to_status: PAID }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
          assert:
            - "Before payment: GET /cabinet/orders/${o2} payment_status == CREDIT_HOLD AND status == ACKNOWLEDGED (hold gate blocks scheduling, not acknowledgment)"
            - "GET /cabinet/orders/${o1}: payment_status == PAID while status == MFG_COMPLETE (dimensions progressed independently)"
            - "After payment: GET /cabinet/orders/${o2} payment_status == UNINVOICED (auto-release; exposure 9500 <= 100000) while status stayed ACKNOWLEDGED"
            - "Final trigger: order2 SCHEDULED succeeds once the payment dimension cleared"

  - rule_id: transitive_cascade
    instances:
      - name: line_supersede_reprice_exposure_cascade
        grounds:
          - state_machines.Program.ACTIVE_to_TRANSITIONING
          - state_machines.ProgramLine.ACTIVE_to_SUNSETTING
          - calculations.credit_exposure
          - entities.Account.fields.open_exposure_cents
        distinguishing_aspect: |
          Depth-4 cascade from POST /cabinet/programs/{id}/lines: new line created
          -> old line SUNSETTING (link 1) -> SUBMITTED order o3 repriced against
          the new line (link 2, an Order mutation) -> Account.open_exposure_cents
          recomputed 133000 -> 118750 (link 3, an Account mutation) -> CREDIT_HOLD
          re-evaluation runs on held order o2 (link 4; no flip since 118750 >
          100000). Distinct trigger from the cancel-driven cascade.
        test_recipe:
          setup:
            - "Dealer account VOLUME, credit_limit_cents 100000, program 0% discount, line L1 F1 price 10000 / lead 3 / complexity 1, ACTIVE"
            - "o1 qty 2 (19000) ACKNOWLEDGED; o2 qty 9 (85500) ACKNOWLEDGED into CREDIT_HOLD (104500 > 100000); o3 qty 3 (28500) still SUBMITTED; exposure 133000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D7", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
              captures: { line1: $.data.id }
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 2 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 9 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "3 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 3 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o3: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 5000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v2}", old_line_disposition_qty: 0 }
              as: ProgramManager
          assert:
            - "GET /cabinet/lines/${line1}: status == SUNSETTING (link 1)"
            - "GET /cabinet/programs/${prog}: status == TRANSITIONING"
            - "GET /cabinet/orders/${o3}: quoted_total_cents == 14250 (repriced under L2: round(5000x0.95)=4750 x3) AND repricing_required == true (link 2)"
            - "GET /cabinet/orders/${o2}: price_lock == false (ACKNOWLEDGED + CREDIT_HOLD at supersede)"
            - "GET /cabinet/accounts/${acct}: open_exposure_cents == 118750 (link 3: 19000 + 85500 + 14250)"
            - "GET /cabinet/orders/${o2}: payment_status == CREDIT_HOLD (link 4 re-evaluated, no flip: 118750 > 100000)"

      - name: cancel_releases_exposure_and_relieves_credit_hold
        grounds:
          - state_machines.Order.ACKNOWLEDGED_to_CANCELLED
          - calculations.credit_exposure
          - entities.Account.fields.open_exposure_cents
        distinguishing_aspect: |
          Depth-2 cascade from POST /cabinet/orders/{id}/cancel: cancel o1 ->
          Account.open_exposure_cents recomputed 104500 -> 85500 (link 1, Account
          mutation) -> o2's CREDIT_HOLD auto-released to UNINVOICED (link 2, a
          different Order's payment dimension). Distinct trigger from the
          supersede-driven cascade.
        test_recipe:
          setup:
            - "Dealer account VOLUME, credit_limit_cents 100000, program 0% discount, F1 price 10000 / lead 3 / complexity 1, ACTIVE"
            - "o1 qty 2 (19000) ACKNOWLEDGED; o2 qty 9 (85500) ACKNOWLEDGED into CREDIT_HOLD; exposure 104500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D8", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 2 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 9 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
          trigger:
            - { call: "POST /cabinet/orders/${o1}/cancel", payload: {}, as: ProgramManager }
          assert:
            - "GET /cabinet/orders/${o1}: status == CANCELLED"
            - "GET /cabinet/accounts/${acct}: open_exposure_cents == 85500 (link 1)"
            - "GET /cabinet/orders/${o2}: payment_status == UNINVOICED (link 2: auto-release at 85500 <= 100000) AND status == ACKNOWLEDGED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_fiscal_gate_on_schedule
        grounds:
          - "validations[priority=5]"
          - "validations[priority=9]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_CREDIT_HOLD]"
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: cancelling an order leaves
          its payment dimension on CREDIT_HOLD, so a schedule attempt violates
          BOTH the from-state rule (CANCELLED is terminal) and the fiscal gate
          (CREDIT_HOLD blocks scheduling). Priority 5 state wins: ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Dealer account VOLUME, credit_limit_cents 100000, program 0% discount, F1 price 10000 / lead 3 / complexity 1, ACTIVE; slot W37 cap 100"
            - "o1 qty 10 (95000) ACKNOWLEDGED; o2 qty 1 (9500) ACKNOWLEDGED into CREDIT_HOLD, then cancelled"
