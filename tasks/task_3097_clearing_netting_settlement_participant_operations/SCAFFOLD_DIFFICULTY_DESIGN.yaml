# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3097_clearing_netting_settlement_participant_operations
#
# One instance per §0.5 rule at minimum; rules 1, 2, 5, 6, 8 and 9 carry three
# instances. Every grounds ref resolves inside SCAFFOLD.yaml §1.1–§1.6. Every
# setup_api_calls / trigger chain drives empty-DB into its stated state using
# only §1.5 endpoints, and every ${var} traces to an earlier captures block.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: netting_net_vs_gross_position_convention
        grounds:
          - calculations.multilateral_netting
          - calculations.multilateral_netting.variants.net_position_convention
          - calculations.multilateral_netting.variants.gross_position_convention
          - state_machines.SettlementWindow.OPEN_to_NETTED
          - entities.NetPosition.fields.cash_delta_cents
        distinguishing_aspect: "On NetPosition, the net-position convention and the gross-position convention differ in cash_delta_cents and settlement_obligation_cents for identical locked-in trade data, because the gross convention reports settlement_obligation_cents as gross_deliver_quantity * trade_price_cents while the net convention reports max(signed gross, 0)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants CSA (legal name 'Alpha Clearing') and CSB (legal name 'Beta Clearing') both ACTIVE with their deposits SATISFIED."
            - "Security SEC1 (ticker NET1, prev_settlement_price_cents 5000) and an OPEN window for 2026-09-10 with deadlines after the clock."
            - "CSA has a 100-unit BUY at 4200 cents then a 40-unit SELL at 4500 cents on SEC1, both locked in and matched. Net convention therefore yields net_quantity 60; gross convention keeps both legs and would report the sell leg as its obligation."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Alpha Clearing", lei: "LEI-ALPHA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_a: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Beta Clearing", lei: "LEI-BETA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_b: $.data.id }
            - call: "POST /clearing/participants/${p_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "NET1", cusip: "912828XK1", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_1: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_1}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_1: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_b}", security_id: "${sec_1}", side: "BUY", quantity: 100, trade_price_cents: 4200, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_a}"
              captures: { t_a1: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_a}", security_id: "${sec_1}", side: "SELL", quantity: 100, trade_price_cents: 4200, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_b}"
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_b}", security_id: "${sec_1}", side: "SELL", quantity: 40, trade_price_cents: 4500, trade_date: "2026-09-08T15:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_a}"
              captures: { t_a2: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_a1}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_a}"
          trigger:
            - call: "POST /clearing/settlement-windows/${win_1}/net"
              payload: {}
              as: PlatformAdmin
              captures: { win_1_netted: $.data.id }
          assert:
            - "GET /clearing/participants/${p_a}/net-positions returns exactly one row for window ${win_1}"
            - "that row's net_quantity == 60"
            - "that row's cash_delta_cents == 240000  (100*4200 - 40*4500 = 420000 - 180000)"
            - "that row's settlement_obligation_cents == 240000 — the NET convention, not the gross deliver leg 40 * 4500 = 180000"
            - "the gross-position variant would instead report settlement_obligation_cents == 180000, so the two conventions are observably different on identical trades"

      - name: clearing_fund_tiered_capped_vs_uncapped_marginal
        grounds:
          - calculations.clearing_fund_scaling_and_cap
          - calculations.clearing_fund_scaling_and_cap.variants.tiered_stacked_cap
          - calculations.clearing_fund_scaling_and_cap.variants.uncapped_marginal
          - entities.FundComponent.fields.component_amount_cents
        distinguishing_aspect: "On FundComponent, the tiered-stacked-cap convention and the uncapped-marginal convention produce different component_amount_cents for the identical open risk whenever the stacked amount falls outside [MIN_COMPONENT_CENTS, MAX_COMPONENT_CENTS], because the capping convention clamps to 250000 while the marginal convention does not."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants FA (legal name 'Fund Alpha') and FB (legal name 'Fund Beta') both ACTIVE, class BROKER_DEALER, each with net_capital_cents 1000000000 so the net-capital floor is 100000000 cents."
            - "Security FND1 at prev_settlement_price_cents 5000. OPEN window for 2026-09-10."
            - "FA holds one locked-in matched 1-unit BUY at 100000 cents, so open risk is exactly 100000 cents."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Fund Alpha", lei: "LEI-FA", participant_class: "BROKER_DEALER", net_capital_cents: 1000000000 }
              as: PlatformAdmin
              captures: { p_fa: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Fund Beta", lei: "LEI-FB", participant_class: "BROKER_DEALER", net_capital_cents: 1000000000 }
              as: PlatformAdmin
              captures: { p_fb: $.data.id }
            - call: "POST /clearing/participants/${p_fa}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_fb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "FND1", cusip: "912828XK2", prev_settlement_price_cents: 5000, current_volatility_bps: 3000 }
              as: PlatformAdmin
              captures: { sec_fnd: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_fnd}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_fnd: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_fb}", security_id: "${sec_fnd}", side: "BUY", quantity: 1, trade_price_cents: 100000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_fa}"
              captures: { t_fa: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_fa}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_fa}"
            - call: "POST /clearing/clearing-funds"
              payload: { security_id: "${sec_fnd}", participant_class: "BROKER_DEALER" }
              as: RiskOfficer
              captures: { fund_1: $.data.id, fund_1_v: $.data.version }
          trigger:
            - call: "POST /clearing/clearing-funds/${fund_1}/recompute"
              payload: { expected_fund_version: "${fund_1_v}" }
              as: RiskOfficer
          assert:
            - "GET /clearing/participants/${p_fa}/fund-components returns exactly one row for fund ${fund_1}"
            - "that row's component_amount_cents == 250000 — open risk 1 * 100000 yields a stacked amount of 150000 through the elevated multiplier, which the MIN_COMPONENT_CENTS clamp of 250000 lifts to 250000"
            - "the net_capital_floor_cents is 0 because the participant's financial_standard_status is PASS, so the clamp and not the floor produces the component"
            - "the uncapped-marginal variant would report component_amount_cents == 150000 for the identical open risk, which is the 100000-cent divergence the clamp creates"
            - "GET /clearing/clearing-funds/${fund_1} reports a total_component_cents equal to the sum of the two participants' latest components"

      - name: fail_mark_forward_vs_prior_day_mark
        grounds:
          - calculations.fail_mark_to_market
          - calculations.fail_mark_to_market.variants.forward_settlement_mark
          - calculations.fail_mark_to_market.variants.prior_day_mark
          - entities.NetPosition.fields.mark_to_market_cents
        distinguishing_aspect: "On NetPosition, the forward-settlement mark and the prior-day mark differ in mark_to_market_cents for the identical failed position, because the prior-day convention pins the mark at zero while the forward convention reports the signed quantity times the price move."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants MA (legal name 'Mark Alpha') and MB (legal name 'Mark Beta') both ACTIVE."
            - "Security MRK1 at prev_settlement_price_cents 5000, OPEN window for 2026-09-10."
            - "MA locks in a 10-unit BUY at 4000 cents; the window is netted and then MA is suspended, which fails its net position at failed_at_price_cents 5000."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Mark Alpha", lei: "LEI-MA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ma: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Mark Beta", lei: "LEI-MB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_mb: $.data.id }
            - call: "POST /clearing/participants/${p_ma}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_mb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "MRK1", cusip: "912828XK3", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_mrk: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_mrk}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_mrk: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_mb}", security_id: "${sec_mrk}", side: "BUY", quantity: 10, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ma}"
              captures: { t_ma: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_ma}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_ma}"
            - call: "POST /clearing/settlement-windows/${win_mrk}/net"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/participants/${p_ma}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /clearing/participants/${p_ma}/net-positions returns one row whose dvp_status == FAILED"
            - "that row's failed_at_price_cents == 5000, stamped at the moment of failure"
            - "GET /clearing/securities/${sec_mrk} then PUT /clearing/securities/${sec_mrk} with prev_settlement_price_cents 3000, and the daily mark recomputed — that row's mark_to_market_cents == -20000  (signed_failed_qty 10 * (3000 - 5000))"
            - "the prior-day-mark variant would report mark_to_market_cents == 0 for the identical failed position, so the two conventions diverge"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: clearing_fund_nested_min_max_and_precedence_order
        grounds:
          - calculations.clearing_fund_scaling_and_cap
          - calculations.clearing_fund_scaling_and_cap.constants.MIN_COMPONENT_CENTS
          - calculations.clearing_fund_scaling_and_cap.constants.MAX_COMPONENT_CENTS
          - entities.Security.fields.current_volatility_bps
        distinguishing_aspect: "Mode (a): component_amount_cents is a non-linear composite of four inputs — absolute open risk, a volatility-tier multiplier, a nested min/max clamp pair, and a state-branched net-capital floor — so the same open risk yields different components when the participant's financial_standard_status flips FAIL."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants NA (legal name 'Node Alpha') and NB (legal name 'Node Beta') ACTIVE, class BANK, each net_capital_cents 1000000000."
            - "Security NOD1 at prev_settlement_price_cents 5000 with current_volatility_bps 3000 so the elevated multiplier tier applies."
            - "NA holds a locked-in matched 10000-unit BUY at 1000000 cents, so open_risk_cents is 10000000000 and the stacked amount exceeds MAX_COMPONENT_CENTS."
            - "NA is then re-reviewed to net_capital_cents 250000000000 so its floor becomes 25000000000 and the floor governs the component."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Node Alpha", lei: "LEI-NA", participant_class: "BANK", net_capital_cents: 1000000000 }
              as: PlatformAdmin
              captures: { p_na: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Node Beta", lei: "LEI-NB", participant_class: "BANK", net_capital_cents: 1000000000 }
              as: PlatformAdmin
              captures: { p_nb: $.data.id }
            - call: "POST /clearing/participants/${p_na}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_nb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "NOD1", cusip: "912828XK4", prev_settlement_price_cents: 5000, current_volatility_bps: 3000 }
              as: PlatformAdmin
              captures: { sec_nod: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_nod}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_nod: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_nb}", security_id: "${sec_nod}", side: "BUY", quantity: 10000, trade_price_cents: 1000000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_na}"
              captures: { t_na: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_na}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_na}"
            - call: "POST /clearing/clearing-funds"
              payload: { security_id: "${sec_nod}", participant_class: "BANK" }
              as: RiskOfficer
              captures: { fund_nod: $.data.id, fund_nod_v: $.data.version }
          trigger:
            - call: "POST /clearing/clearing-funds/${fund_nod}/recompute"
              payload: { expected_fund_version: "${fund_nod_v}" }
              as: RiskOfficer
          assert:
            - "GET /clearing/participants/${p_na}/fund-components returns one row for fund ${fund_nod}"
            - "that row's component_amount_cents == 25000000000"
            - "stacked_cents is min(10000000000 * 15000 / 10000, 50000000) = 50000000 after the MAX_COMPONENT_CENTS clamp, then raised to the net-capital floor 250000000000 * 1000 / 10000 = 25000000000"
            - "the same participant with current_volatility_bps 2000 would instead get multiplier 10000 and a stacked_cents of 10000000000, which the MAX_COMPONENT_CENTS clamp caps at 50000000 — so the volatility tier and the cap are both observable"

      - name: default_proceeds_round_per_trade_then_sum
        grounds:
          - calculations.default_liquidation_and_loss
          - calculations.default_liquidation_and_loss.variants.vickrey_second_price
          - entities.DefaultProceeding.fields.liquidation_proceeds_cents
        distinguishing_aspect: "Mode (b): liquidation_proceeds_cents depends on the PINNED order round-per-computed-term-then-sum rather than sum-then-round, because the uniform settlement price is formed as an exact integer product of price and quantity before the defaulter-resource subtraction."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants DA (legal name 'Default Alpha') and DB (legal name 'Default Beta') already ACTIVE and class BANK."
            - "Security DFT1 at prev_settlement_price_cents 5000. A BANK-class ClearingFund for DFT1 is sized once so DB holds a FundComponent."
            - "DA is suspended and then defaulted, and the proceeding is moved from DECLARED to LIQUIDATING, so the sealed-bid auction may be run."
            - "DB posts two sealed bids on the proceeding: 2222 cents for quantity 1000 first, then 3333 cents for quantity 3000."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Default Alpha", lei: "LEI-DA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_da: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Default Beta", lei: "LEI-DB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_db: $.data.id }
            - call: "POST /clearing/participants/${p_da}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_db}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "DFT1", cusip: "912828XK5", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_dft: $.data.id }
            - call: "POST /clearing/securities/${sec_dft}/allocate-fund-cost"
              payload: { participant_id: "${p_da}", amount_cents: 5000000, reason_code: "DEFAULT_DEPOSIT_SEED" }
              as: PlatformAdmin
            - call: "POST /clearing/clearing-funds"
              payload: { security_id: "${sec_dft}", participant_class: "BANK" }
              as: RiskOfficer
              captures: { fund_dft: $.data.id, fund_dft_v: $.data.version }
            - call: "POST /clearing/clearing-funds/${fund_dft}/recompute"
              payload: { expected_fund_version: "${fund_dft_v}" }
              as: RiskOfficer
            - call: "POST /clearing/participants/${p_da}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_da}/financial-review"
              payload: { net_capital_cents: 100000000 }
              as: RiskOfficer
            - call: "POST /clearing/default-proceedings"
              payload: { participant_id: "${p_da}", reason_code: "FINANCIAL_STANDARD_BREACH" }
              as: RiskOfficer
              captures: { dp_1: $.data.id }
            - call: "PUT /clearing/default-proceedings/${dp_1}"
              payload: { reason_code: "AUCTION_OPEN" }
              as: RiskOfficer
            - call: "GET /clearing/participants/${p_db}/fund-components"
              payload: {}
              as: RiskOfficer
              captures: { fc_db: "$.data[0].id" }
            - call: "POST /clearing/default-proceedings/${dp_1}/bids"
              payload: { bid_price_cents: 2222, quantity: 1000, placed_at: "2026-09-05T10:00:00Z", fund_component_id: "${fc_db}" }
              as: ClearingMember
              as_user_id: "${p_db}"
            - call: "POST /clearing/default-proceedings/${dp_1}/bids"
              payload: { bid_price_cents: 3333, quantity: 3000, placed_at: "2026-09-05T11:00:00Z", fund_component_id: "${fc_db}" }
              as: ClearingMember
              as_user_id: "${p_db}"
          trigger:
            - call: "POST /clearing/default-proceedings/${dp_1}/liquidate"
              payload: {}
              as: RiskOfficer
          assert:
            - "DefaultProceeding.${dp_1}.liquidation_proceeds_cents == 6666000  (Vickrey settlement price 2222 cents * winning quantity 3000)"
            - "the first-price variant would report 3333 * 3000 = 9999000 instead, so the auction format is observably different"
            - "DefaultProceeding.${dp_1}.defaulter_resources_cents == 5000000"
            - "DefaultProceeding.${dp_1}.deficit_amount_cents == 0  (max(5000000 - 6666000, 0)), so no loss allocation follows"
            - "DefaultProceeding.${dp_1}.status == LIQUIDATED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: trade_submission_parallel_lock_and_match_dimensions
        grounds:
          - state_machines.TradeSubmission
          - state_machines.TradeSubmission.OPEN_to_LOCKED_IN
          - state_machines.TradeSubmission.LOCKED_IN_to_OPEN
          - entities.TradeSubmission.fields.lock_status
          - entities.TradeSubmission.fields.match_status
        distinguishing_aspect: "TradeSubmission carries two independent state dimensions on one row — lock_status and match_status — so a trade can be LOCKED_IN while still UNMATCHED and MATCHED while still OPEN, which a single linear pipeline on this entity could not express."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants TA (legal name 'Trade Alpha') and TB (legal name 'Trade Beta') ACTIVE."
            - "Security TRD1 and an OPEN window for 2026-09-10 with deadlines after the clock."
            - "TA submits a BUY with no contra, so it is OPEN and UNMATCHED."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Trade Alpha", lei: "LEI-TA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ta: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Trade Beta", lei: "LEI-TB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_tb: $.data.id }
            - call: "POST /clearing/participants/${p_ta}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_tb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "TRD1", cusip: "912828XK6", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_trd: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_trd}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_trd: $.data.id }
          trigger:
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_tb}", security_id: "${sec_trd}", side: "BUY", quantity: 100, trade_price_cents: 4200, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ta}"
              captures: { t_1: $.data.id }
          assert:
            - "TradeSubmission.${t_1}.lock_status == OPEN and TradeSubmission.${t_1}.match_status == UNMATCHED"
            - "TradeSubmission.${t_1}.version == 1"
            - "POST /clearing/trade-submissions/${t_1}/lock-in then leaves lock_status == LOCKED_IN while match_status stays UNMATCHED, proving the two dimensions move independently"

      - name: settlement_window_cyclic_cycle_rerun_and_auto_close
        grounds:
          - state_machines.SettlementWindow
          - state_machines.SettlementWindow.OPEN_to_OPEN
          - state_machines.SettlementWindow.OPEN_to_CLOSED
          - state_machines.SettlementWindow.RECOMPUTED_to_OPEN
          - entities.SettlementWindow.fields.status
        distinguishing_aspect: "SettlementWindow exhibits a cycle rather than a pipeline: run-cycle loops the window OPEN to OPEN repeatedly while it remains open, the fund's RECOMPUTED row loops back to OPEN on a fresh net position, and the window may enter CLOSED from three distinct source states."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants WA (legal name 'Win Alpha') and WB (legal name 'Win Beta') ACTIVE."
            - "Security WIN1 and an OPEN window for 2026-09-10; WA holds one locked-in matched BUY."
          setup_api_calls:
            - call: "POST /clearing/participants"
