scenario: |
  Mobile Bartending & Beverage-Catering Service: event & guest-count package,
  license/insurance & ABC compliance (host/no-sale model), bar setup &
  inventory/BYOB calc, staff (bartender) scheduling & rate, signature-drink &
  menu, gratuity/service fee, deposit & balance, breakage/return.

domain_name: mobile-bartending-catering
api_prefix: ""    # flat topology: multiple top-level collections (/events, /clients, /packages, /bartenders, /bar-kits, /assignments, /kit-reservations, /breakage-reports, /compliance-reviews)

complexity_profile:
  primary_archetype: posture_driven_gating      # compliance posture on the Event gates staffing & service
  secondary_archetype: temporal_windowing        # bartender & bar-kit scheduling with overlap semantics
  complexity_layers:
    - dual_variant_calculation                   # provisional vs final event charge; strict vs lenient reliability
    - cascading_side_effects                      # compliance rejection & event cancellation cascades
    - optimistic_concurrency                      # OCC on Event.version for edit & assignment-create
    - rate_threshold_triggers                     # guest-count tiers, overtime, breakage free-allowance

  entity_topology: hybrid
  # Event is a hub with child sub-resources (ComplianceReview, Assignment, KitReservation,
  # InventoryPlan, MenuItem, Payment, BreakageReport) plus peer FK references to Client,
  # Package, Bartender, BarKit. Assignment and KitReservation are many-to-many junctions.

  state_machine_shape: parallel
  # Event carries two independent dimensions (booking_status x payment_status) plus a
  # derived compliance_posture; ComplianceReview is cyclic (resubmit loop).

  relationship_patterns:
    - one_to_many          # Event -> Assignment/KitReservation/MenuItem/Payment/BreakageReport
    - many_to_many         # Event <-> Bartender via Assignment; Event <-> BarKit via KitReservation
    - cross_aggregate      # Assignment references Bartender across aggregate boundary; BreakageReport references BarKit

  role_model: peer_roles
  # Client owns bookings/payments; Coordinator runs staffing/kits/service; ComplianceOfficer
  # signs off compliance; Bartender checks in; PlatformAdmin manages catalog config.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Host / booking contact name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: phone
        type: string
        source: input
        description: "Contact phone"
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter US state code of the client's billing address"
        constraints: "2-letter uppercase, e.g., CA, NY, TX"

  - name: Package
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Beverage-catering package tier"
        constraints: "one of BEER_WINE | CLASSIC | PREMIUM | LUXURY"
      - name: name
        type: string
        source: input
        description: "Display name of the package"
      - name: base_price_cents
        type: integer
        source: input
        description: "Flat base price in cents covering included_guest_count and included_hours"
        constraints: ">= 0"
      - name: included_guest_count
        type: integer
        source: input
        description: "Guests covered by base price before per-guest overage applies"
        constraints: ">= 1"
      - name: per_guest_overage_cents
        type: integer
        source: input
        description: "Cents charged per guest above included_guest_count"
        constraints: ">= 0"
      - name: included_hours
        type: integer
        source: input
        description: "Service hours covered by base price before per-hour overage applies"
        constraints: ">= 1"
      - name: min_hours
        type: integer
        source: input
        description: "Minimum billable service hours the package can be booked for"
        constraints: ">= 1"
      - name: per_hour_overage_cents
        type: integer
        source: input
        description: "Cents charged per whole billable hour above included_hours"
        constraints: ">= 0"
      - name: drinks_per_guest_per_hour
        type: number
        source: input
        description: "Beverage consumption rate used by the BYOB inventory calculation"
        constraints: "> 0"
      - name: guests_per_bartender
        type: integer
        source: input
        description: "Staffing ratio: max guests one bartender covers; drives required_bartender_count"
        constraints: ">= 1"
      - name: is_active
        type: boolean
        source: input
        description: "Whether the package may be selected on new events"
        default: true

  - name: Bartender
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Bartender legal name"
      - name: email
        type: string
        source: input
        description: "Bartender contact email"
      - name: certification_expiry
        type: datetime
        source: input
        description: "ISO8601 UTC expiry of the bartender's responsible-service (RBS) certification"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Base labor rate in cents per hour"
        constraints: ">= 0"
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter US state code where the bartender is licensed to serve"
        constraints: "2-letter uppercase"
      - name: availability_status
        type: enum
        source: system
        description: "AVAILABLE (bookable) | ENGAGED (has upcoming assignments) | INACTIVE (not bookable)"
        default: AVAILABLE
        constraints: "one of AVAILABLE | ENGAGED | INACTIVE"
      - name: upcoming_assignment_count
        type: integer
        source: computed
        description: "Count of this bartender's Assignments in status IN {PROPOSED, CONFIRMED, CHECKED_IN}; kept consistent by assignment side effects"
        default: 0
      - name: reliability_score_strict
        type: integer
        source: computed
        description: "Strict-variant reliability score in [0,100]; gates LEAD assignment eligibility"
      - name: reliability_score_lenient
        type: integer
        source: computed
        description: "Lenient-variant reliability score in [0,100]; display metric on the bartender profile"

  - name: BarKit
    parent: null
    common_fields: true
    fields:
      - name: kit_name
        type: string
        source: input
        description: "Display name of the mobile bar equipment set"
      - name: station_type
        type: enum
        source: input
        description: "Physical station type"
        constraints: "one of BEER_WINE | FULL_BAR | MOBILE_CART"
      - name: glassware_count
        type: integer
        source: input
        description: "Number of reusable glasses in the kit; becomes items_checked_out on deploy"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "AVAILABLE (in service) | RETIRED (removed from fleet)"
        default: AVAILABLE
        constraints: "one of AVAILABLE | RETIRED"

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the host who booked the event"
      - name: package_id
        type: string
        source: input
        description: "FK -> Package.id; the selected beverage-catering package"
      - name: title
        type: string
        source: input
        description: "Event title / occasion"
      - name: venue_state_code
        type: string
        source: input
        description: "Two-letter US state code of the venue; ABC jurisdiction for compliance and staffing"
        constraints: "2-letter uppercase"
      - name: venue_type
        type: enum
        source: input
        description: "Venue setting"
        constraints: "one of INDOOR | OUTDOOR | MIXED"
      - name: event_start
        type: datetime
        source: input
        description: "ISO8601 UTC scheduled service start"
      - name: event_end
        type: datetime
        source: input
        description: "ISO8601 UTC scheduled service end; must be strictly after event_start"
      - name: guest_count
        type: integer
        source: input
        description: "Expected number of guests; drives pricing, inventory and staffing"
        constraints: ">= 1"
      - name: byob_host_model
        type: boolean
        source: input
        description: "Host/no-sale model: host owns and supplies all alcohol; the company sells no alcohol"
        default: true
      - name: booking_status
        type: enum
        source: system
        description: "Booking lifecycle dimension"
        default: DRAFT
        constraints: "one of DRAFT | CONFIRMED | IN_PROGRESS | COMPLETED | CLOSED | CANCELLED"
      - name: payment_status
        type: enum
        source: system
        description: "Financial lifecycle dimension, independent of booking_status"
        default: UNPAID
        constraints: "one of UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED | SETTLED"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived from the Event's ComplianceReview.status: PENDING (no CLEARED review) | CLEARED (review CLEARED) | BLOCKED (review CHANGES_REQUESTED after a prior clearance)"
        default: PENDING
        constraints: "one of PENDING | CLEARED | BLOCKED"
      - name: billable_hours
        type: integer
        source: computed
        description: "ceil((event_end - event_start) in hours); used by pricing and inventory"
      - name: required_bartender_count
        type: integer
        source: computed
        description: "ceil(guest_count / package.guests_per_bartender)"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "FINAL-variant subtotal from calculation event_charge (base + guest overage + hour overage)"
      - name: service_fee_cents
        type: integer
        source: computed
        description: "FINAL-variant tiered service fee (see calculation event_charge)"
      - name: gratuity_cents
        type: integer
        source: computed
        description: "FINAL-variant gratuity = round(subtotal * GRATUITY_PCT)"
      - name: provisional_grand_total_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of event_charge, computed at DRAFT/quote time (assumes included_hours, no hour overage)"
      - name: final_grand_total_cents
        type: integer
        source: computed
        description: "FINAL variant of event_charge = subtotal + service_fee + gratuity"
      - name: deposit_due_cents
        type: integer
        source: computed
        description: "round(provisional_grand_total_cents * DEPOSIT_PCT)"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "sum(Payment.amount_cents where payment_type IN {DEPOSIT, BALANCE}) - sum(Payment.amount_cents where payment_type == REFUND)"
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "For non-terminal events: (final_grand_total_cents + sum BREAKAGE_CHARGE + sum CANCELLATION_FEE) - amount_paid_cents. For CANCELLED events reconciled to 0."
      - name: cancelled_by
        type: enum
        source: system
        description: "Actor role that cancelled the event, if any"
        default: null
        constraints: "one of CLIENT | COORDINATOR | SYSTEM | null"

  - name: ComplianceReview
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event whose license/insurance/ABC posture this review governs"
      - name: abc_model
        type: enum
        source: input
        description: "Alcohol service model attested for the event; only HOST_NO_SALE is compliant for this business"
        constraints: "one of HOST_NO_SALE | CASH_BAR | NONE"
      - name: liquor_liability_insurance_verified
        type: boolean
        source: input
        description: "True when the host's liquor-liability insurance certificate has been verified"
      - name: host_alcohol_ownership_attested
        type: boolean
        source: input
        description: "True when the host has attested to owning and supplying all alcohol (BYOB / no-sale)"
      - name: server_certification_verified
        type: boolean
        source: input
        description: "True when all assigned bartenders' RBS certifications were verified for this event"
      - name: revision_round
        type: integer
        source: system
        description: "Increments by 1 on every resubmission (submit from CHANGES_REQUESTED)"
        default: 0
      - name: reviewer_notes
        type: string
        source: input
        description: "Free-text notes from the ComplianceOfficer on clear/request-changes"
        default: null
      - name: status
        type: enum
        source: system
        description: "Compliance review lifecycle (cyclic resubmit loop)"
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | CLEARED | CHANGES_REQUESTED"

  - name: Assignment
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this bartender is scheduled for"
      - name: bartender_id
        type: string
        source: input
        description: "FK -> Bartender.id; the scheduled bartender"
      - name: shift_start
        type: datetime
        source: input
        description: "ISO8601 UTC shift start (may precede event_start for setup)"
      - name: shift_end
        type: datetime
        source: input
        description: "ISO8601 UTC shift end; must be strictly after shift_start"
      - name: role_on_event
        type: enum
        source: input
        description: "LEAD (requires reliability gate) | BACK (support)"
        constraints: "one of LEAD | BACK"
      - name: shift_hours
        type: number
        source: computed
        description: "(shift_end - shift_start) in hours, rounded up to nearest 0.25"
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "From calculation assignment_labor_cost (regular + overtime)"
      - name: cancelled_by
        type: enum
        source: system
        description: "Actor that ended this assignment early, if any"
        default: null
        constraints: "one of CLIENT | COORDINATOR | BARTENDER | SYSTEM | null"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        default: PROPOSED
        constraints: "one of PROPOSED | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW"

  - name: KitReservation
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this bar kit is reserved for"
      - name: kit_id
        type: string
        source: input
        description: "FK -> BarKit.id; the reserved kit"
      - name: reserve_start
        type: datetime
        source: input
        description: "ISO8601 UTC reservation window start (includes load-in)"
      - name: reserve_end
        type: datetime
        source: input
        description: "ISO8601 UTC reservation window end (includes tear-down); must be strictly after reserve_start"
      - name: items_checked_out
        type: integer
        source: computed
        description: "Set to BarKit.glassware_count at deploy; the glassware conservation baseline for breakage"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Kit reservation lifecycle"
        default: RESERVED
        constraints: "one of RESERVED | DEPLOYED | RETURNED | RELEASED"

  - name: InventoryPlan
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this BYOB shopping plan is generated for (1:1)"
      - name: total_servings
        type: integer
        source: computed
        description: "ceil(guest_count * billable_hours * package.drinks_per_guest_per_hour)"
      - name: beer_units
        type: integer
        source: computed
        description: "Purchase units of beer (see calculation inventory_requirement)"
      - name: wine_bottles
        type: integer
        source: computed
        description: "Purchase bottles of wine"
      - name: spirit_bottles
        type: integer
        source: computed
        description: "Purchase bottles of spirits (receives the servings remainder)"
      - name: ice_lbs
        type: integer
        source: computed
        description: "ceil(guest_count * ICE_LBS_PER_GUEST)"
      - name: glassware_needed
        type: integer
        source: computed
        description: "ceil(guest_count * GLASSWARE_PER_GUEST)"
      - name: status
        type: enum
        source: system
        description: "GENERATED (fresh vs current event inputs) | STALE (event edited since generation)"
        default: GENERATED
        constraints: "one of GENERATED | STALE"

  - name: MenuItem
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this menu / signature drink belongs to"
      - name: name
        type: string
        source: input
        description: "Drink name"
      - name: drink_type
        type: enum
        source: input
        description: "Beverage category"
        constraints: "one of BEER | WINE | COCKTAIL | MOCKTAIL"
      - name: spirit_base
        type: enum
        source: input
        description: "Base spirit for cocktails; NONE for beer/wine/mocktail"
        default: NONE
        constraints: "one of VODKA | GIN | WHISKEY | RUM | TEQUILA | NONE"
      - name: is_signature
        type: boolean
        source: input
        description: "Whether this is a featured signature drink"
        default: false
      - name: abv_pct
        type: number
        source: input
        description: "Alcohol-by-volume percentage of the drink"
        constraints: ">= 0"

  - name: Payment
    parent: Event
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event this payment record belongs to"
      - name: payment_type
        type: enum
        source: input
        description: "DEPOSIT/BALANCE are client inflows; REFUND/CANCELLATION_FEE/BREAKAGE_CHARGE are system-created reconciliation records"
        constraints: "one of DEPOSIT | BALANCE | REFUND | CANCELLATION_FEE | BREAKAGE_CHARGE"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive amount in cents; client supplies it for DEPOSIT/BALANCE, the server computes it for REFUND/CANCELLATION_FEE/BREAKAGE_CHARGE"
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: "Payment instrument (system uses SYSTEM for computed records)"
        default: SYSTEM
        constraints: "one of CARD | ACH | CASH | SYSTEM"

  - name: BreakageReport
    parent: Event
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event whose returned kit is being reconciled"
      - name: kit_id
        type: string
        source: input
        description: "FK -> BarKit.id; the kit whose glassware is being reconciled"
      - name: items_broken
        type: integer
        source: input
        description: "Count of glasses broken/lost"
        constraints: ">= 0"
      - name: items_returned
        type: integer
        source: input
        description: "Count of glasses returned intact"
        constraints: ">= 0"
      - name: items_checked_out
        type: integer
        source: computed
        description: "Copied from the RETURNED KitReservation.items_checked_out at report creation; conservation baseline"
      - name: breakage_fee_cents
        type: integer
        source: computed
        description: "From calculation breakage_settlement; charged above a free-breakage allowance"
      - name: deposit_refund_cents
        type: integer
        source: computed
        description: "max(0, Event.deposit_due_cents - breakage_fee_cents); informational refund figure"
      - name: status
        type: enum
        source: system
        description: "DRAFT (filed, counts validated) | SETTLED (fee computed and charged)"
        default: DRAFT
        constraints: "one of DRAFT | SETTLED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: DRAFT               # booking_status dimension
    terminal_states: [CLOSED, CANCELLED]
    note: |
      Event has TWO independent (parallel) state dimensions plus a derived posture:
      (1) booking_status: DRAFT -> CONFIRMED -> IN_PROGRESS -> COMPLETED -> CLOSED, with CANCELLED.
      (2) payment_status: UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL, plus REFUNDED / SETTLED.
      compliance_posture is derived from the child ComplianceReview (see that machine).
      The transitions below cover the booking dimension; payment_status transitions are
      listed as side effects of POST /events/{id}/payments and the cancel/breakage cascades.
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /events/{id}/confirm"
        actor: Client
        preconditions:
          - "Event.compliance_posture == CLEARED (cross-entity: depends on ComplianceReview state)"
          - "Event.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} (deposit received)"
        side_effects:
          - "booking_status -> CONFIRMED"
          - "increment Event.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Client
        preconditions:
          - "booking_status == DRAFT"
        side_effects:
          - "booking_status -> CANCELLED; cancelled_by -> CLIENT"
          - "no cancellation fee when payment_status == UNPAID; if deposit was paid, apply the deposit cascade (see CONFIRMED->CANCELLED)"
          - "increment Event.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Client
        preconditions:
          - "booking_status == CONFIRMED"
        side_effects:
          - "booking_status -> CANCELLED; cancelled_by -> CLIENT"
          - "CASCADE hop A: create Payment CANCELLATION_FEE amount = round(amount_paid_cents * CANCEL_FEE_PCT); create Payment REFUND amount = amount_paid_cents - CANCELLATION_FEE"
          - "recompute payment_status -> SETTLED; balance_due_cents -> 0; amount_paid_cents reflects the refund"
          - "CASCADE hop B: each child Assignment in {PROPOSED, CONFIRMED} -> CANCELLED (cancelled_by=SYSTEM)"
          - "CASCADE hop C: each such Assignment cancellation decrements its Bartender.upcoming_assignment_count by 1 and recomputes that bartender's reliability scores"
          - "increment Event.version by 1"
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /events/{id}/start"
        actor: Coordinator
        preconditions:
          - "booking_status == CONFIRMED"
          - "at least one child Assignment with role_on_event == LEAD is in status CHECKED_IN (empty-set boundary: zero checked-in => reject)"
        side_effects:
          - "booking_status -> IN_PROGRESS"
          - "increment Event.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: Coordinator
        preconditions:
          - "booking_status == IN_PROGRESS"
        side_effects:
          - "booking_status -> COMPLETED"
          - "each child Assignment in status CHECKED_IN -> COMPLETED; recompute those bartenders' reliability scores and decrement upcoming_assignment_count"
          - "increment Event.version by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /events/{id}/close"
        actor: Coordinator
        preconditions:
          - "booking_status == COMPLETED"
          - "every KitReservation for this event is in status IN {RETURNED, RELEASED}"
          - "every BreakageReport for this event is in status SETTLED"
        side_effects:
          - "booking_status -> CLOSED"
          - "increment Event.version by 1"

  - entity: ComplianceReview
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic and never terminal: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED (resubmit loop); a CLEARED review can be re-opened via request-changes if a later re-inspection finds an issue."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reviews/{id}/submit"
        actor: Coordinator
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status -> SUBMITTED"
          - "increment ComplianceReview.version by 1"
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /compliance-reviews/{id}/clear"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "abc_model == HOST_NO_SALE"
          - "liquor_liability_insurance_verified == true"
          - "host_alcohol_ownership_attested == true"
          - "server_certification_verified == true"
        side_effects:
          - "status -> CLEARED"
          - "parent Event.compliance_posture -> CLEARED"
          - "increment ComplianceReview.version by 1"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /compliance-reviews/{id}/request-changes"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {SUBMITTED, CLEARED}"
        side_effects:
          - "status -> CHANGES_REQUESTED"
          - "CASCADE hop A: parent Event.compliance_posture -> BLOCKED"
          - "CASCADE hop B: caused by BLOCKED posture, each child Assignment in status CONFIRMED reverts to PROPOSED"
          - "CASCADE hop C: caused by each Assignment revert, that Assignment's Bartender.upcoming_assignment_count is unchanged (still upcoming) but its reliability scores are recomputed; if the event was IN_PROGRESS it is out of scope (posture only blocks pre-service)"
          - "increment ComplianceReview.version by 1"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /compliance-reviews/{id}/submit"
        actor: Coordinator
        preconditions:
          - "status == CHANGES_REQUESTED"
        side_effects:
          - "status -> SUBMITTED; revision_round += 1"
          - "increment ComplianceReview.version by 1"
      - from: CLEARED
        to: CHANGES_REQUESTED
        trigger: "POST /compliance-reviews/{id}/request-changes"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {SUBMITTED, CLEARED}"
        side_effects:
          - "status -> CHANGES_REQUESTED (re-opened after re-inspection)"
          - "CASCADE hop A: parent Event.compliance_posture CLEARED -> BLOCKED"
          - "CASCADE hop B: caused by BLOCKED posture, each child Assignment in status CONFIRMED reverts to PROPOSED"
          - "CASCADE hop C: caused by each Assignment revert, that Assignment's Bartender.reliability scores are recomputed (upcoming_assignment_count unchanged: assignment remains upcoming as PROPOSED)"
          - "increment ComplianceReview.version by 1"

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/confirm"
        actor: Coordinator
        preconditions:
          - "status == PROPOSED"
          - "parent Event.compliance_posture == CLEARED (cross-entity dependency Assignment -> Event)"
        side_effects:
          - "status -> CONFIRMED"
          - "increment Assignment.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /assignments/{id}/check-in"
        actor: Bartender
        preconditions:
          - "status == CONFIRMED"
          - "acting Bartender (X-User-ID) == Assignment.bartender_id"
        side_effects:
          - "status -> CHECKED_IN"
          - "increment Assignment.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/no-show"
        actor: Coordinator
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "status -> NO_SHOW; cancelled_by -> SYSTEM"
          - "decrement Bartender.upcoming_assignment_count by 1"
          - "recompute Bartender.reliability_score_strict and reliability_score_lenient"
          - "increment Assignment.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "status -> CANCELLED; cancelled_by -> the acting role"
          - "decrement Bartender.upcoming_assignment_count by 1"
          - "recompute Bartender.reliability_score_strict and reliability_score_lenient"
          - "increment Assignment.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "status IN {PROPOSED, CONFIRMED}"
        side_effects:
          - "status -> CANCELLED; cancelled_by -> the acting role"
          - "decrement Bartender.upcoming_assignment_count by 1"
          - "recompute Bartender.reliability scores"
          - "increment Assignment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: POST /events/{id}/complete cascades to checked-in assignments"
        actor: system
        preconditions:
          - "status == CHECKED_IN"
          - "parent Event transition IN_PROGRESS -> COMPLETED fired"
        side_effects:
          - "status -> COMPLETED"
          - "decrement Bartender.upcoming_assignment_count by 1; recompute reliability scores"
          - "increment Assignment.version by 1"

  - entity: KitReservation
    initial_state: RESERVED
    terminal_states: [RETURNED, RELEASED]
    transitions:
      - from: RESERVED
        to: DEPLOYED
        trigger: "POST /kit-reservations/{id}/deploy"
        actor: Coordinator
        preconditions:
          - "status == RESERVED"
          - "parent Event.booking_status == IN_PROGRESS"
        side_effects:
          - "status -> DEPLOYED"
          - "items_checked_out -> BarKit.glassware_count (glassware conservation baseline)"
          - "increment KitReservation.version by 1"
      - from: DEPLOYED
        to: RETURNED
        trigger: "POST /kit-reservations/{id}/return"
        actor: Coordinator
        preconditions:
          - "status == DEPLOYED"
        side_effects:
          - "status -> RETURNED"
          - "increment KitReservation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /kit-reservations/{id}/release"
        actor: Coordinator
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "status -> RELEASED (kit freed without deployment)"
          - "increment KitReservation.version by 1"

  - entity: BreakageReport
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: SETTLED
        trigger: "POST /breakage-reports/{id}/settle"
        actor: Coordinator
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "compute breakage_fee_cents and deposit_refund_cents (calculation breakage_settlement)"
          - "status -> SETTLED"
          - "CASCADE hop A: create Payment BREAKAGE_CHARGE amount = breakage_fee_cents (when breakage_fee_cents > 0)"
          - "CASCADE hop B: caused by the BREAKAGE_CHARGE payment, recompute parent Event.balance_due_cents and Event.payment_status"
          - "increment BreakageReport.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on Event.version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: event-edit-stale-version
    parent_entity: Event
    write_endpoint: "PATCH /events/{id}"
    occ_field: "expected_event_version"
    description: |
      Editing an Event (guest_count / schedule / venue_type) whose version has
      advanced since the client last read it is rejected. A prior edit or a
      payment/compliance side effect has already advanced Event.version, so the
      client's expected_event_version is stale and the write is refused. Two
      strictly sequential PATCH requests each carrying the same expected version
      cannot both apply: the first advances the version, the second is stale.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/assignments"
    occ_field: "expected_event_version"
    description: |
      Creating an Assignment against an Event whose version has advanced since
      the client last observed it is rejected. A second bartender could
      legitimately be added under natural semantics, but because the prior
      assignment-create advanced Event.version (staffing view changed), a create
      still carrying the old expected_event_version is refused as stale. The
      loser resolves deterministically via the version check, not by timing.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: event_charge
    trigger: "on POST /events (PROVISIONAL + FINAL), PATCH /events/{id} (recompute both), and read"
    algorithm: tiered_pricing
    formula: |
      billable_hours = ceil((event_end - event_start) in hours)
      overage_guests = max(0, guest_count - package.included_guest_count)
      # FINAL variant uses actual billable_hours:
      overage_hours_final = max(0, billable_hours - package.included_hours)
      subtotal = package.base_price_cents
               + overage_guests * package.per_guest_overage_cents
               + overage_hours_final * package.per_hour_overage_cents
      # tiered service-fee percentage selected by guest_count (non-linear branch):
      if guest_count <= 50:        pct = 0.20
      elif guest_count <= 150:     pct = 0.18
      else:                        pct = 0.15
      service_fee = min(max(round(subtotal * pct), SERVICE_FEE_MIN_CENTS), SERVICE_FEE_MAX_CENTS)
      gratuity = round(subtotal * GRATUITY_PCT)
      final_grand_total = subtotal + service_fee + gratuity
    input_set: "single Event + its Package; no aggregation over other rows"
    constants:
      GRATUITY_PCT: 0.18
      SERVICE_FEE_MIN_CENTS: 25000
      SERVICE_FEE_MAX_CENTS: 200000
      DEPOSIT_PCT: 0.5
    precision: "integer cents, round_half_up on each round() step"
    variants:
      - name: PROVISIONAL
        when: "at DRAFT/quote time and for deposit_due; assumes the package's included_hours (overage_hours = 0)"
        difference: "sets overage_hours = 0 regardless of actual duration; produces provisional_grand_total_cents; deposit_due = round(provisional_grand_total * DEPOSIT_PCT)"
      - name: FINAL
        when: "for final_grand_total_cents and balance_due once the actual schedule is locked"
        difference: "uses overage_hours_final from the actual billable_hours; equals PROVISIONAL only when billable_hours <= included_hours"

  - name: inventory_requirement
    trigger: "on POST /events/{id}/inventory-plan"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED (round total up FIRST, split, remainder-to-spirits, THEN convert):
      total_servings = ceil(guest_count * billable_hours * package.drinks_per_guest_per_hour)
      beer_servings   = round(total_servings * BEER_RATIO)
      wine_servings   = round(total_servings * WINE_RATIO)
      spirit_servings = total_servings - beer_servings - wine_servings   # remainder absorbs rounding
      beer_units    = ceil(beer_servings / SERVINGS_PER_BEER_UNIT)
      wine_bottles  = ceil(wine_servings / SERVINGS_PER_WINE_BOTTLE)
      spirit_bottles = ceil(spirit_servings / SERVINGS_PER_SPIRIT_BOTTLE)
      ice_lbs = ceil(guest_count * ICE_LBS_PER_GUEST)
      glassware_needed = ceil(guest_count * GLASSWARE_PER_GUEST)
    input_set: "single Event + its Package; billable_hours from Event"
    constants:
      BEER_RATIO: 0.40
      WINE_RATIO: 0.30
      SERVINGS_PER_BEER_UNIT: 1
      SERVINGS_PER_WINE_BOTTLE: 5
      SERVINGS_PER_SPIRIT_BOTTLE: 16
      ICE_LBS_PER_GUEST: 1.5
      GLASSWARE_PER_GUEST: 2.5
    precision: "integer units; ceil on unit conversion, round_half_up on ratio split"

  - name: assignment_labor_cost
    trigger: "on POST /events/{id}/assignments (compute at creation)"
    algorithm: threshold
    formula: |
      shift_hours = round_up_to_quarter((shift_end - shift_start) in hours)
      regular_hours = min(shift_hours, OT_THRESHOLD_HOURS)
      ot_hours = max(0, shift_hours - OT_THRESHOLD_HOURS)
      labor_cost = round(regular_hours * bartender.hourly_rate_cents
                         + ot_hours * bartender.hourly_rate_cents * OT_MULTIPLIER)
    input_set: "single Assignment + its Bartender"
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up; shift_hours rounded up to nearest 0.25"

  - name: bartender_reliability_score
    trigger: "on any Assignment transition to COMPLETED, NO_SHOW, or CANCELLED for the bartender"
    algorithm: weighted_scoring
    formula: |
      completed = count(Assignment where bartender_id and status == COMPLETED)
      no_shows  = count(Assignment where bartender_id and status == NO_SHOW)
      cancels   = count(Assignment where bartender_id and status == CANCELLED and cancelled_by == BARTENDER)
      total = completed + no_shows + cancels
      if total == 0:
        strict = 100 ; lenient = 100          # empty-history boundary
      else:
        strict  = max(0, round(100 * completed / total
                               - no_shows * NO_SHOW_PENALTY_STRICT
                               - cancels * CANCEL_PENALTY_STRICT))
        lenient = max(0, round(100 * (completed + cancels * 0.5) / total
                               - no_shows * NO_SHOW_PENALTY_LENIENT))
    input_set: "all Assignments for one Bartender, filtered by terminal status as above"
    constants:
      NO_SHOW_PENALTY_STRICT: 15
      CANCEL_PENALTY_STRICT: 5
      NO_SHOW_PENALTY_LENIENT: 8
      LEAD_MIN_STRICT_SCORE: 70
    precision: "integer score in [0,100], round_half_up"
    variants:
      - name: STRICT
        when: "gates LEAD assignment eligibility (reliability_score_strict >= LEAD_MIN_STRICT_SCORE)"
        difference: "penalizes no-shows by 15 and bartender cancels by 5; ratio counts only completed in numerator"
      - name: LENIENT
        when: "display metric on bartender profile"
        difference: "penalizes no-shows by 8, ignores cancel penalty, credits half a completion per cancel in numerator"

  - name: breakage_settlement
    trigger: "on POST /breakage-reports/{id}/settle"
    algorithm: threshold
    formula: |
      free_allowance = ceil(items_checked_out * BREAKAGE_ALLOWANCE_PCT)
      chargeable_broken = max(0, items_broken - free_allowance)
      breakage_fee = chargeable_broken * REPLACEMENT_COST_PER_ITEM_CENTS
      deposit_refund = max(0, Event.deposit_due_cents - breakage_fee)
    input_set: "single BreakageReport + its Event.deposit_due_cents; items_checked_out is the RETURNED KitReservation baseline"
    constants:
      BREAKAGE_ALLOWANCE_PCT: 0.02
      REPLACEMENT_COST_PER_ITEM_CENTS: 500
    precision: "integer cents; ceil on free_allowance"

  - name: cancellation_settlement
    trigger: "on POST /events/{id}/cancel when booking_status == CONFIRMED and amount_paid_cents > 0"
    algorithm: aggregation
    formula: |
      cancellation_fee = round(amount_paid_cents * CANCEL_FEE_PCT)
      refund_amount = amount_paid_cents - cancellation_fee
      # money conservation: (deposits+balances paid) - refund == cancellation_fee
    input_set: "single Event + its captured Payment rows"
    constants:
      CANCEL_FEE_PCT: 0.5
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per the RBAC matrix; entity_backed roles acting on their own resource must own it"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path and body-referenced resources exist, validated left-to-right (Event, then ComplianceReview/Assignment/KitReservation/BreakageReport, then FK targets Client/Package/Bartender/BarKit)"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints (specific not-found id per resource, see error catalog)"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enum members valid, numeric ranges (guest_count>=1, amounts>=1), event_end>event_start, shift_end>shift_start, reserve_end>reserve_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_event_version equals current Event.version on OCC write endpoints"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "PATCH /events/{id}, POST /events/{id}/assignments"
  - priority: 6
    category: state
    check: "target resource is in a status from which the requested transition is defined; terminal states reject all transitions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "ABC compliance to CLEAR a review: abc_model==HOST_NO_SALE else ERR_ABC_MODEL_INVALID; insurance verified else ERR_INSURANCE_NOT_VERIFIED; host attestation & server cert present"
    error_id: ERR_ABC_MODEL_INVALID
    http_status: 422
    applies_to: "POST /compliance-reviews/{id}/clear"
  - priority: 7
    category: business_safety
    check: "assigning a bartender: certification_expiry must be > Event.event_start (not expired at service time)"
    error_id: ERR_BARTENDER_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /events/{id}/assignments"
  - priority: 7
    category: business_safety
    check: "assigning a bartender: bartender.home_state_code == Event.venue_state_code (licensed in the ABC jurisdiction)"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /events/{id}/assignments"
  - priority: 7
    category: business_safety
    check: "confirming an Assignment or event requires Event.compliance_posture == CLEARED"
    error_id: ERR_COMPLIANCE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm, POST /events/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "bartender double-booking: the new shift dilated by TRAVEL_BUFFER (90 min) on both sides must not overlap any of the bartender's other non-terminal Assignment shifts; adjacency within the buffer is rejected"
    error_id: ERR_BARTENDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /events/{id}/assignments"
  - priority: 8
    category: business_temporal
    check: "bar-kit double-booking: the new [reserve_start, reserve_end) must not overlap any other non-terminal KitReservation for the same kit; exact adjacency (end == start) is allowed (no buffer)"
    error_id: ERR_KIT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /events/{id}/kit-reservations"
  - priority: 9
    category: business_constraint
    check: "bartender availability_status must be AVAILABLE or ENGAGED (not INACTIVE) to be assigned"
    error_id: ERR_BARTENDER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /events/{id}/assignments"
  - priority: 9
    category: business_constraint
    check: "LEAD assignment requires the bartender's reliability_score_strict >= LEAD_MIN_STRICT_SCORE (70)"
    error_id: ERR_INSUFFICIENT_RELIABILITY
    http_status: 422
    applies_to: "POST /events/{id}/assignments"
  - priority: 9
    category: business_constraint
    check: "starting an event requires at least one CHECKED_IN LEAD Assignment (empty checked-in set rejected)"
    error_id: ERR_NO_CHECKED_IN_STAFF
    http_status: 409
    applies_to: "POST /events/{id}/start"
  - priority: 9
    category: business_referential
    check: "creating a BreakageReport requires a KitReservation for (event_id, kit_id) in status RETURNED (cross-entity BreakageReport -> KitReservation)"
    error_id: ERR_KIT_NOT_RETURNED
    http_status: 409
    applies_to: "POST /events/{id}/breakage-reports"
  - priority: 9
    category: business_constraint
    check: "glassware conservation: items_broken + items_returned == items_checked_out of the RETURNED reservation"
    error_id: ERR_BREAKAGE_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /events/{id}/breakage-reports"
  - priority: 10
    category: business_fiscal
    check: "confirming an event requires payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} (deposit received)"
    error_id: ERR_DEPOSIT_NOT_PAID
    http_status: 409
    applies_to: "POST /events/{id}/confirm"
  - priority: 10
    category: business_fiscal
    check: "a BALANCE payment cannot exceed the current balance_due_cents; a duplicate DEPOSIT after DEPOSIT_PAID is rejected"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /events/{id}/payments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Config: Package ----
  - method: POST
    path: "/packages"
    description: "Create a beverage-catering package tier"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, name, base_price_cents, included_guest_count, per_guest_overage_cents, included_hours, min_hours, per_hour_overage_cents, drinks_per_guest_per_hour, guests_per_bartender, "is_active?"]
    output: Package
    side_effects: []

  # ---- Config: Bartender ----
  - method: POST
    path: "/bartenders"
    description: "Register a bartender in the staffing pool"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, certification_expiry, hourly_rate_cents, home_state_code]
    output: Bartender
    side_effects: ["availability_status=AVAILABLE; reliability scores initialized to 100 (empty history)"]
  - method: GET
    path: "/bartenders/{id}"
    description: "Read a bartender including computed reliability scores"
    roles: [PlatformAdmin, Coordinator, Bartender]
    code: 200
    input: []
    output: Bartender
    side_effects: []
  - method: POST
    path: "/bartenders/{id}/deactivate"
    description: "Retire a bartender from the bookable pool (sets availability_status=INACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Bartender
    side_effects: ["availability_status -> INACTIVE; increment Bartender.version by 1"]

  # ---- Config: BarKit ----
  - method: POST
    path: "/bar-kits"
    description: "Add a mobile bar equipment kit to the fleet"
    roles: [PlatformAdmin]
    code: 201
    input: [kit_name, station_type, glassware_count]
    output: BarKit
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Register a client/host"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, phone, home_state_code]
    output: Client
    side_effects: []

  # ---- Event core ----
  - method: POST
    path: "/events"
    description: "Book a new event in DRAFT and compute provisional pricing, deposit_due and staffing"
    roles: [Client]
    code: 201
    input: [client_id, package_id, title, venue_state_code, venue_type, event_start, event_end, guest_count, "byob_host_model?"]
    output: Event
    side_effects: ["booking_status=DRAFT; payment_status=UNPAID; compliance_posture=PENDING; compute billable_hours, subtotal/service_fee/gratuity, provisional_grand_total, final_grand_total, deposit_due, balance_due, required_bartender_count"]
  - method: GET
    path: "/events"
    description: "List events with optional filters"
    roles: [PlatformAdmin, Coordinator, ComplianceOfficer, Client]
    code: 200
    input: ["client_id?", "package_id?", "booking_status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []
  - method: GET
    path: "/events/{id}"
    description: "Read one event with computed financial and posture fields"
    roles: [PlatformAdmin, Coordinator, ComplianceOfficer, Client]
    code: 200
    input: []
    output: Event
    side_effects: []
  - method: PATCH
    path: "/events/{id}"
    description: "Edit event guest_count / schedule / venue_type (OCC-guarded); recomputes pricing and marks inventory stale"
    roles: [Client]
    code: 200
    input: [expected_event_version, "guest_count?", "event_start?", "event_end?", "venue_type?"]
    output: Event
    side_effects: ["recompute event_charge (both variants), deposit_due, balance_due, required_bartender_count; set any InventoryPlan.status=STALE; increment Event.version by 1"]
  - method: POST
    path: "/events/{id}/confirm"
    description: "Confirm a DRAFT event (requires cleared compliance and paid deposit)"
    roles: [Client]
    code: 200
    input: []
    output: Event
    side_effects: ["booking_status DRAFT->CONFIRMED; increment Event.version by 1"]
  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel an event; triggers deposit/refund and assignment cascades when applicable"
    roles: [Client]
    code: 200
    input: []
    output: Event
    side_effects: ["booking_status->CANCELLED; cancelled_by=CLIENT; cancellation_settlement + refund payments when CONFIRMED with deposit; cascade child Assignments->CANCELLED; decrement bartenders' upcoming_assignment_count and recompute reliability; recompute payment_status; increment Event.version by 1"]
  - method: POST
    path: "/events/{id}/start"
    description: "Start service (requires a checked-in LEAD)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Event
    side_effects: ["booking_status CONFIRMED->IN_PROGRESS; increment Event.version by 1"]
  - method: POST
    path: "/events/{id}/complete"
    description: "Complete service; cascades checked-in assignments to COMPLETED"
    roles: [Coordinator]
    code: 200
    input: []
    output: Event
    side_effects: ["booking_status IN_PROGRESS->COMPLETED; each CHECKED_IN Assignment->COMPLETED; recompute bartenders' reliability and decrement upcoming_assignment_count; increment Event.version by 1"]
  - method: POST
    path: "/events/{id}/close"
    description: "Archive a completed event once kits returned and breakage settled"
    roles: [Coordinator]
    code: 200
    input: []
    output: Event
    side_effects: ["booking_status COMPLETED->CLOSED; increment Event.version by 1"]

  # ---- Payments ----
  - method: POST
    path: "/events/{id}/payments"
    description: "Record a client DEPOSIT or BALANCE payment"
    roles: [Client]
    code: 201
    input: [payment_type, amount_cents, method]
    output: Payment
    side_effects: ["recompute Event.amount_paid_cents and balance_due_cents; advance payment_status (UNPAID->DEPOSIT_PAID on deposit; ->PAID_IN_FULL when balance_due==0)"]
  - method: GET
    path: "/events/{id}/payments"
    description: "List all payment records for an event (includes system-created refunds/fees)"
    roles: [PlatformAdmin, Coordinator, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Compliance ----
  - method: POST
    path: "/events/{id}/compliance-review"
    description: "Open a compliance review (DRAFT) for the event"
    roles: [Coordinator]
    code: 201
    input: [abc_model, liquor_liability_insurance_verified, host_alcohol_ownership_attested, server_certification_verified]
    output: ComplianceReview
    side_effects: ["status=DRAFT; revision_round=0"]
  - method: GET
    path: "/events/{id}/compliance-review"
    description: "List the event's compliance review(s) (0 or 1)"
    roles: [PlatformAdmin, Coordinator, ComplianceOfficer, Client]
    code: 200
    input: []
    output: ComplianceReview[]
    side_effects: []
  - method: POST
    path: "/compliance-reviews/{id}/submit"
    description: "Submit or resubmit a review for officer sign-off (optionally correcting attestations)"
    roles: [Coordinator]
    code: 200
    input: ["abc_model?", "liquor_liability_insurance_verified?", "host_alcohol_ownership_attested?", "server_certification_verified?"]
    output: ComplianceReview
    side_effects: ["status DRAFT|CHANGES_REQUESTED -> SUBMITTED; revision_round += 1 when resubmitting; increment ComplianceReview.version by 1"]
  - method: POST
    path: "/compliance-reviews/{id}/clear"
    description: "Officer clears compliance; sets Event.compliance_posture=CLEARED"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reviewer_notes?"]
    output: ComplianceReview
    side_effects: ["status SUBMITTED->CLEARED; parent Event.compliance_posture=CLEARED; increment ComplianceReview.version by 1"]
  - method: POST
    path: "/compliance-reviews/{id}/request-changes"
    description: "Officer rejects compliance; cascades to BLOCK the event and revert confirmed assignments"
    roles: [ComplianceOfficer]
    code: 200
    input: [reviewer_notes]
    output: ComplianceReview
    side_effects: ["status SUBMITTED->CHANGES_REQUESTED; cascade Event.compliance_posture=BLOCKED; cascade CONFIRMED Assignments revert to PROPOSED; recompute affected bartenders' reliability; increment ComplianceReview.version by 1"]

  # ---- Assignments ----
  - method: POST
    path: "/events/{id}/assignments"
    description: "Schedule a bartender for the event (OCC-guarded on Event.version); runs cert/jurisdiction/overlap/reliability checks"
    roles: [Coordinator]
    code: 201
    input: [bartender_id, shift_start, shift_end, role_on_event, expected_event_version]
    output: Assignment
    side_effects: ["status=PROPOSED; compute shift_hours and labor_cost_cents; increment Bartender.upcoming_assignment_count; set Bartender.availability_status=ENGAGED; increment Event.version by 1"]
  - method: GET
    path: "/assignments"
    description: "List assignments filtered by bartender or event"
    roles: [PlatformAdmin, Coordinator, Bartender]
    code: 200
    input: ["bartender_id?", "event_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: GET
    path: "/assignments/{id}"
    description: "Read one assignment"
    roles: [PlatformAdmin, Coordinator, Bartender]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/assignments/{id}/confirm"
    description: "Confirm a proposed assignment (requires cleared compliance)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status PROPOSED->CONFIRMED; increment Assignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/check-in"
    description: "Bartender checks in on the day of service"
    roles: [Bartender]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status CONFIRMED->CHECKED_IN; increment Assignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/cancel"
    description: "Cancel a proposed/confirmed assignment"
    roles: [Coordinator, Bartender]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status->CANCELLED; cancelled_by=acting role; decrement Bartender.upcoming_assignment_count; recompute reliability; increment Assignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/no-show"
    description: "Mark a confirmed bartender a no-show"
    roles: [Coordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status CONFIRMED->NO_SHOW; cancelled_by=SYSTEM; decrement Bartender.upcoming_assignment_count; recompute reliability; increment Assignment.version by 1"]

  # ---- Kit reservations ----
  - method: POST
    path: "/events/{id}/kit-reservations"
    description: "Reserve a bar kit for the event's window (overlap-checked, no buffer)"
    roles: [Coordinator]
    code: 201
    input: [kit_id, reserve_start, reserve_end]
    output: KitReservation
    side_effects: ["status=RESERVED"]
  - method: GET
    path: "/kit-reservations"
    description: "List kit reservations filtered by kit or event"
    roles: [PlatformAdmin, Coordinator]
    code: 200
    input: ["kit_id?", "event_id?", "status?", "limit?", "offset?"]
    output: KitReservation[]
    side_effects: []
  - method: GET
    path: "/kit-reservations/{id}"
    description: "Read one kit reservation"
    roles: [PlatformAdmin, Coordinator]
    code: 200
    input: []
    output: KitReservation
    side_effects: []
  - method: POST
    path: "/kit-reservations/{id}/deploy"
    description: "Deploy the kit at the event; snapshots glassware_count as items_checked_out"
    roles: [Coordinator]
    code: 200
    input: []
    output: KitReservation
    side_effects: ["status RESERVED->DEPLOYED; items_checked_out=BarKit.glassware_count; increment KitReservation.version by 1"]
  - method: POST
    path: "/kit-reservations/{id}/return"
    description: "Return the deployed kit"
    roles: [Coordinator]
    code: 200
    input: []
    output: KitReservation
    side_effects: ["status DEPLOYED->RETURNED; increment KitReservation.version by 1"]
  - method: POST
    path: "/kit-reservations/{id}/release"
    description: "Release a reserved (not yet deployed) kit"
    roles: [Coordinator]
    code: 200
    input: []
    output: KitReservation
    side_effects: ["status RESERVED->RELEASED; increment KitReservation.version by 1"]

  # ---- Inventory ----
  - method: POST
    path: "/events/{id}/inventory-plan"
    description: "Generate (or regenerate a STALE) BYOB inventory plan for the event"
    roles: [Coordinator]
    code: 201
    input: []
    output: InventoryPlan
    side_effects: ["compute total_servings, beer_units, wine_bottles, spirit_bottles, ice_lbs, glassware_needed; status=GENERATED"]
  - method: GET
    path: "/events/{id}/inventory-plan"
    description: "List the event's inventory plan (0 or 1)"
    roles: [PlatformAdmin, Coordinator, Client]
    code: 200
    input: []
    output: InventoryPlan[]
    side_effects: []

  # ---- Menu / signature drinks ----
  - method: POST
    path: "/events/{id}/menu-items"
    description: "Add a menu item / signature drink to the event"
    roles: [Client]
    code: 201
    input: [name, drink_type, "spirit_base?", "is_signature?", abv_pct]
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/events/{id}/menu-items"
    description: "List the event's menu items"
    roles: [PlatformAdmin, Coordinator, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: MenuItem[]
    side_effects: []

  # ---- Breakage ----
  - method: POST
    path: "/events/{id}/breakage-reports"
    description: "File a glassware breakage/return reconciliation for a returned kit"
    roles: [Coordinator]
    code: 201
    input: [kit_id, items_broken, items_returned]
    output: BreakageReport
    side_effects: ["status=DRAFT; items_checked_out copied from the RETURNED KitReservation; validates items_broken+items_returned==items_checked_out"]
  - method: GET
    path: "/breakage-reports"
    description: "List breakage reports filtered by kit or event"
    roles: [PlatformAdmin, Coordinator]
    code: 200
    input: ["kit_id?", "event_id?", "limit?", "offset?"]
    output: BreakageReport[]
    side_effects: []
  - method: GET
    path: "/breakage-reports/{id}"
    description: "Read one breakage report"
    roles: [PlatformAdmin, Coordinator]
    code: 200
    input: []
    output: BreakageReport
    side_effects: []
  - method: POST
    path: "/breakage-reports/{id}/settle"
    description: "Settle the breakage report; computes fee and charges the client"
    roles: [Coordinator]
    code: 200
    input: []
    output: BreakageReport
    side_effects: ["compute breakage_fee_cents and deposit_refund_cents; status DRAFT->SETTLED; create Payment BREAKAGE_CHARGE when fee>0; recompute Event.balance_due_cents and payment_status; increment BreakageReport.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the endpoint, or entity_backed role acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body: missing required field, bad enum member, out-of-range number, or end<=start on a time range"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client_id does not resolve to a Client"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "package_id does not resolve to a Package"
  - id: ERR_BARTENDER_NOT_FOUND
    http: 404
    condition: "bartender_id does not resolve to a Bartender"
  - id: ERR_BARKIT_NOT_FOUND
    http: 404
    condition: "kit_id does not resolve to a BarKit"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "Event id in path does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Assignment id in path does not resolve"
  - id: ERR_COMPLIANCE_REVIEW_NOT_FOUND
    http: 404
    condition: "ComplianceReview id in path does not resolve"
  - id: ERR_KIT_RESERVATION_NOT_FOUND
    http: 404
    condition: "KitReservation id in path does not resolve"
  - id: ERR_BREAKAGE_REPORT_NOT_FOUND
    http: 404
    condition: "BreakageReport id in path does not resolve"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not equal current Event.version on an OCC write"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current status (includes terminal-state lockdown and idempotent repeats)"
  - id: ERR_ABC_MODEL_INVALID
    http: 422
    condition: "Clearing compliance while abc_model != HOST_NO_SALE (host/no-sale model required)"
  - id: ERR_INSURANCE_NOT_VERIFIED
    http: 422
    condition: "Clearing compliance while liquor_liability_insurance_verified is false"
  - id: ERR_HOST_ATTESTATION_MISSING
    http: 422
    condition: "Clearing compliance while host_alcohol_ownership_attested or server_certification_verified is false"
  - id: ERR_COMPLIANCE_NOT_CLEARED
    http: 409
    condition: "Confirming an event or an assignment while Event.compliance_posture != CLEARED"
  - id: ERR_BARTENDER_CERT_EXPIRED
    http: 422
    condition: "Assigning a bartender whose certification_expiry <= Event.event_start"
  - id: ERR_JURISDICTION_MISMATCH
    http: 422
    condition: "Assigning a bartender whose home_state_code != Event.venue_state_code"
  - id: ERR_BARTENDER_UNAVAILABLE
    http: 409
    condition: "Assigning a bartender whose availability_status == INACTIVE"
  - id: ERR_BARTENDER_DOUBLE_BOOKED
    http: 409
    condition: "New shift, dilated by the 90-min travel buffer, overlaps another non-terminal shift of the same bartender"
  - id: ERR_KIT_DOUBLE_BOOKED
    http: 409
    condition: "New [reserve_start, reserve_end) overlaps another non-terminal reservation of the same kit (adjacency allowed)"
  - id: ERR_INSUFFICIENT_RELIABILITY
    http: 422
    condition: "LEAD assignment for a bartender whose reliability_score_strict < 70"
  - id: ERR_NO_CHECKED_IN_STAFF
    http: 409
    condition: "Starting an event with zero CHECKED_IN LEAD assignments"
  - id: ERR_KIT_NOT_RETURNED
    http: 409
    condition: "Filing a breakage report without a RETURNED KitReservation for (event_id, kit_id)"
  - id: ERR_BREAKAGE_COUNT_MISMATCH
    http: 422
    condition: "items_broken + items_returned != items_checked_out"
  - id: ERR_DEPOSIT_NOT_PAID
    http: 409
    condition: "Confirming an event before payment_status reaches DEPOSIT_PAID"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A BALANCE payment exceeds balance_due_cents, or a duplicate DEPOSIT after DEPOSIT_PAID"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Manages catalog config: packages, bartenders, bar-kits, and client registration"
    identity: opaque
    exclusive_operations:
      - "POST /packages"
      - "POST /bartenders"
      - "POST /bar-kits"
      - "POST /clients"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /bartenders/{id}"
      - "GET /assignments"
      - "GET /kit-reservations"
      - "GET /breakage-reports"
      - "GET /events/{id}/payments"
      - "GET /events/{id}/compliance-review"
      - "GET /events/{id}/inventory-plan"
      - "GET /events/{id}/menu-items"
  - name: Client
    description: "The host: books events, pays deposit/balance, edits and cancels own event, proposes menu"
    identity: entity_backed:Client
    exclusive_operations:
      - "POST /events"
      - "PATCH /events/{id}"
      - "POST /events/{id}/confirm"
      - "POST /events/{id}/cancel"
      - "POST /events/{id}/payments"
      - "POST /events/{id}/menu-items"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /events/{id}/payments"
      - "GET /events/{id}/inventory-plan"
      - "GET /events/{id}/menu-items"
      - "GET /events/{id}/compliance-review"
  - name: Coordinator
    description: "Operations staff: runs compliance workflow, staffing, kits, inventory, service and breakage"
    identity: opaque
    exclusive_operations:
      - "POST /events/{id}/compliance-review"
      - "POST /compliance-reviews/{id}/submit"
      - "POST /events/{id}/assignments"
      - "POST /assignments/{id}/confirm"
      - "POST /assignments/{id}/no-show"
      - "POST /events/{id}/kit-reservations"
      - "POST /kit-reservations/{id}/deploy"
      - "POST /kit-reservations/{id}/return"
      - "POST /kit-reservations/{id}/release"
      - "POST /events/{id}/start"
      - "POST /events/{id}/complete"
      - "POST /events/{id}/close"
      - "POST /events/{id}/inventory-plan"
      - "POST /events/{id}/breakage-reports"
      - "POST /breakage-reports/{id}/settle"
    shared_operations:
      - "POST /assignments/{id}/cancel"
      - "GET /events"
      - "GET /events/{id}"
      - "GET /bartenders/{id}"
      - "GET /assignments"
      - "GET /kit-reservations"
      - "GET /breakage-reports"
  - name: ComplianceOfficer
    description: "Independent compliance sign-off: clears or requests changes on reviews"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-reviews/{id}/clear"
      - "POST /compliance-reviews/{id}/request-changes"
    shared_operations:
      - "GET /events"
      - "GET /events/{id}"
      - "GET /events/{id}/compliance-review"
  - name: Bartender
    description: "Assigned staff: checks in to own shift, may cancel own assignment"
    identity: entity_backed:Bartender
    exclusive_operations:
      - "POST /assignments/{id}/check-in"
    shared_operations:
      - "POST /assignments/{id}/cancel"
      - "GET /assignments"
      - "GET /bartenders/{id}"
