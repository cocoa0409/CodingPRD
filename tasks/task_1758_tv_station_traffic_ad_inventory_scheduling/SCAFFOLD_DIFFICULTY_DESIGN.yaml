              payload: { program_id: "${prog9_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 9000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order9x_id}/submit"
