              payload: { name: "Bistro3", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { acct_id: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-16T00:00:00Z" }
              as: Manager
              captures: { plan_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/lines"
              payload: { product_id: "${prod_id}", par_qty: 10 }
              as: Manager
              captures: { line_id: $.data.id }
            - call: "POST /bake-plans/${plan_id}/commit"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${acct_id}", product_id: "${prod_id}", bake_plan_line_id: "${line_id}", delivery_date: "2026-06-16T10:00:00Z", qty: 1 }
              as: Manager
