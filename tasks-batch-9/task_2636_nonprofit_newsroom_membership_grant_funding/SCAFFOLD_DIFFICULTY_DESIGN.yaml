  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_influence_contact_five_hop_cascade_suspends_awarded_grant
        grounds:
          - state_machines.Funder.CLEARED_to_RESTRICTED
          - state_machines.FirewallDisclosure.ACTIVE_to_REATTESTATION_REQUIRED
          - state_machines.GrantProposal.AWARDED_to_SUSPENDED
          - entities.CoverageArea.fields.publication_gate
          - entities.FiscalPeriod.fields.reserve_balance_cents
          - calculations.funder_independence_risk
        distinguishing_aspect: |
          A single POST /influence-contacts - a write to an entity that owns no money and no gate -
          propagates five hops deep: the funder is restricted and re-scored 20 -> 28, its ACTIVE
          disclosure flips to REATTESTATION_REQUIRED with reason INFLUENCE_CONTACT, the CoverageArea
          therefore turns STALE/BLOCKED, the AWARDED grant on that beat is SUSPENDED with
          FIREWALL_BREACH and claws 210000 of released principal back into returned_cents, and the
          FiscalPeriod's reserve_balance_cents falls 710000 -> 500000 while its recognized_revenue_cents
          drops to 0 and reserve_months_target relaxes 5 -> 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027 with monthly_expense_base_cents 200000 and reserve_balance_cents 500000."
            - "CoverageArea CLIMATE, publication_gate OPEN."
            - "Funder (FOUNDATION affiliated to CLIMATE, no advocacy attestation) CLEARED with independence_risk_score 20 and prior_editorial_requests_count 0."
            - "One ACTIVE FirewallDisclosure for (funder, CLIMATE)."
            - "A PROGRAM_RESTRICTED proposal on CLIMATE (2026-09-01..2027-02-28, SEMIANNUAL) AWARDED at 350000, then 210000 released, so FiscalPeriod.reserve_balance_cents is 710000 and released_cents is 210000."
