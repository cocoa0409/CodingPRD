        distinguishing_aspect: "The budget is cumulative, not per-request: with max_extension_days 10 a first grant of 6 days succeeds and a second grant of 6 days fails with ERR_EXTENSION_LIMIT_EXCEEDED (422) even though 6 alone is legal, and granted_extension_days stays at 6."
