      - name: remeasure_void_conserves_single_issued_estimate_invariant
        grounds:
          - state_machines.Job.MEASURED_to_RE_MEASURE
          - state_machines.Estimate.ISSUED_to_VOIDED
          - state_machines.Estimate.DRAFT_to_ISSUED
        distinguishing_aspect: "Conserved quantity #2 = count of ISSUED estimates per job (invariant: at most one). Issuing estimate A makes the count 1; request-remeasure (compensating action) voids A back to 0; re-measure then re-issue estimate B returns the count to exactly 1 — the at-most-one-ISSUED invariant is never violated and leaves no drift (no two ISSUED estimates coexist)."
        test_recipe:
          setup:
            - "Job measured, estimate A issued (1 ISSUED). Request-remeasure voids A (0 ISSUED). Re-measure, create estimate B, issue B (1 ISSUED). A must be VOIDED, B ISSUED, count of ISSUED == 1."
