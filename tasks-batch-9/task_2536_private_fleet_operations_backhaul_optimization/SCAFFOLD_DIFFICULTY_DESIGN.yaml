            - "${wo_start} == 2026-08-03T16:00:00Z truncated to the day plus one day == 2026-08-04T00:00:00Z"
            - "${wo_end} == 2026-08-04T08:00:00Z (window_start + 480 minutes)"
            - "LINK 3: ${post_hold} == true while ${post_status} == AVAILABLE (the equipment was released by the completion; only the PM flag blocks it)"
            - "LINK 4: ${hold_error} == ERR_TRACTOR_PM_HOLD with HTTP 409"
            - "Trip.${trip_2_id}.tractor_id == null and plan_status == DRAFT after the refused assignment"

      - name: coaching_hold_cascade_strips_planned_trip_orders_store_ledger_and_open_bids
        grounds:
          - calculations.driver_safety_score
          - endpoints[POST /fleet/telematics-events]
          - state_machines.Trip[plan_status].PLANNED_to_DRAFT
          - state_machines.ReplenishmentOrder.SCHEDULED_to_UNSCHEDULED
          - entities.Store.fields.open_scheduled_cases
        distinguishing_aspect: |
          DEPTH 5 from a COMPLETELY DIFFERENT trigger - POST /fleet/telematics-events,
          not a trip completion. Link 1: the event's 12 penalty points raise
          Driver.open_penalty_points to 36. Link 2: BECAUSE the total reached 36,
          safety_score drops to 64 and coaching_hold flips false -> true. Link 3:
          BECAUSE the hold flipped, the driver's PLANNED trip reverts to DRAFT and
          is stripped of its driver, tractor and trailer. Link 4: BECAUSE the trip
          reverted, its DELIVERY stop's order returns to UNSCHEDULED. Link 5:
          BECAUSE the order un-scheduled, Store.open_scheduled_cases falls from 900
          back to 0. The same trigger also releases the driver's SUBMITTED route
          bid. The control step proves the cascade fires only on the false -> true
          flip: after two events (24 points, score 76) nothing has moved.
        test_recipe:
          setup:
            - "Fixture F1 built only as far as POST /fleet/trips/{trip_id}/plan, so TRIP-1 is PLANNED, order O1 is SCHEDULED and Store.open_scheduled_cases == 900."
            - "Posting RT-100 is on the board and D-77 has a SUBMITTED bid on it, placed while their safety_score is still 100."
            - "Two SEATBELT severity-3 events are then recorded: 4 * 3 = 12 points each, 24 total, safety_score 76, still at or above the 70 hold threshold."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
