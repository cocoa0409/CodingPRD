  - rule_id: priority_pair_validation_conflict
    instances:
      - name: optout_billed_charge_past_deadline
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_CHARGE_ALREADY_BILLED]
          - errors[ERR_OPT_OUT_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair state vs business_temporal: the opt-out request violates BOTH the
          from-state rule (charge already BILLED, priority 5) and the deadline rule
          (now 2026-09-20 > 2026-09-09, priority 7); the state error must win.
        test_recipe:
          setup:
            - "IA charge for student is BILLED (census run at 2026-09-10); clock then moved past the opt-out deadline"
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "BIO200", section_code: "01", enrollment_capacity: 30, ia_enabled: true, ia_material_fee_cents: 4900 }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/enrollments", payload: { student_id: "${stu}" }, as: PlatformAdmin, captures: { enr: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/sections/${sec1}/lock", payload: {}, as: BookstoreManager }
            - { call: "GET /bookstore/inclusive-access-charges?enrollment_id=${enr}", payload: {}, as: BookstoreManager, captures: { cg: "$.data[0].id" } }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms/${t1}/run-census-billing", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookstore/inclusive-access-charges/${cg}/opt-out", payload: {}, as: Student, as_user_id: "${stu}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CHARGE_ALREADY_BILLED (state priority 5 beats business_temporal priority 7)"
            - "InclusiveAccessCharge.${cg}.status == BILLED (unchanged)"

      - name: order_referential_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_ADOPTION_NOT_APPROVED]
          - errors[ERR_INSUFFICIENT_AID]
        distinguishing_aspect: |
          Category pair business_referential vs business_fiscal (different pair than the
          state/temporal conflict): the order references a SUBMITTED (not APPROVED) adoption AND
          aid_only exceeds the student's 1000-cent balance; ERR_ADOPTION_NOT_APPROVED (priority 9)
          must win over ERR_INSUFFICIENT_AID (priority 10).
        test_recipe:
          setup:
            - "Term T1 SALES_OPEN; adoption for the title stuck in SUBMITTED (survives the close-adoption sweep); student awarded aid only 1000; clock 2026-08-20 in aid window"
