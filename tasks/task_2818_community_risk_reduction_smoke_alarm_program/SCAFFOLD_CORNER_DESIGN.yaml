          - state_machines[FollowUpContact] via POST /crr/follow-ups
        distinguishing_aspect: "The ISSUED -> LAPSED -> ISSUED loop is traversed once: a REACHED_ALARM_PRESENT contact with plan_practiced false lapses the plan with DRILL_NOT_PRACTICED without touching the household state, and the re-issue clears lapsed_at / lapse_reason while bumping reissue_count from 0 to 1."
