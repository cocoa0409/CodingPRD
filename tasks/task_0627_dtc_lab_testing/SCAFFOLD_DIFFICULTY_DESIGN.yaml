  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_half_open_overlap_at_psc_location
        grounds:
          - validations[priority=15]
          - errors[ERR_SLOT_OVERLAP]
          - entities.Appointment.fields.slot_start
          - entities.Appointment.fields.slot_end
        distinguishing_aspect: |
          Appointment overlap uses bare half-open [start,end) semantics on psc_location_code:
          a new slot [09:30,10:00) touching a prior [09:00,09:30) is ALLOWED (boundary touch),
          while [09:15,09:45) overlapping is rejected ERR_SLOT_OVERLAP. No buffer.
        test_recipe:
          setup:
            - "Offering H2. Patients P15a, P15b. Two PSC orders at PSC-2; prior appointment [09:00,09:30) BOOKED."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "H2", display_name: "Test H2", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_h2: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p15a@x.com", full_name: "P 15a", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p15a: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p15b@x.com", full_name: "P 15b", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p15b: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p15a}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p15a}"
              captures: { cart15a: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart15a}", test_offering_id: "${off_h2}" }
              as: Patient
              as_user_id: "${p15a}"
            - call: "GET /catalog/carts/${cart15a}"
              as: Patient
              as_user_id: "${p15a}"
              captures: { cart15a_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart15a}", fulfillment_mode: "PSC", expected_cart_version: "${cart15a_v}" }
              as: Patient
              as_user_id: "${p15a}"
              captures: { order15a: '$.data.id' }
            - call: "POST /catalog/appointments"
              payload: { order_id: "${order15a}", psc_location_code: "PSC-2", slot_start: "2026-02-01T09:00:00Z", slot_end: "2026-02-01T09:30:00Z" }
              as: Patient
              as_user_id: "${p15a}"
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p15b}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p15b}"
              captures: { cart15b: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart15b}", test_offering_id: "${off_h2}" }
              as: Patient
              as_user_id: "${p15b}"
            - call: "GET /catalog/carts/${cart15b}"
              as: Patient
              as_user_id: "${p15b}"
              captures: { cart15b_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart15b}", fulfillment_mode: "PSC", expected_cart_version: "${cart15b_v}" }
              as: Patient
              as_user_id: "${p15b}"
              captures: { order15b: '$.data.id' }
          trigger:
            - call: "POST /catalog/appointments"
              payload: { order_id: "${order15b}", psc_location_code: "PSC-2", slot_start: "2026-02-01T09:15:00Z", slot_end: "2026-02-01T09:45:00Z" }
              as: Patient
              as_user_id: "${p15b}"
              captures: { err: '$.data.error_id' }
            - call: "POST /catalog/appointments"
              payload: { order_id: "${order15b}", psc_location_code: "PSC-2", slot_start: "2026-02-01T09:30:00Z", slot_end: "2026-02-01T10:00:00Z" }
              as: Patient
              as_user_id: "${p15b}"
              captures: { appt15b: '$.data.id', appt15b_status: '$.data.status' }
          assert:
            - "overlapping [09:15,09:45) returns 409 ERR_SLOT_OVERLAP"
            - "touching [09:30,10:00) succeeds with Appointment.status == BOOKED"

      - name: analyzer_run_buffer_extended_overlap_on_instrument
        grounds:
          - validations[priority=15.5]
          - errors[ERR_ANALYZER_RUN_OVERLAP]
          - entities.AnalyzerRun.fields.buffer_minutes
          - entities.AnalyzerRun.fields.run_end
        distinguishing_aspect: |
          Different resource entity (AnalyzerRun) with different interval semantics: a buffer-extended
          gap. Prior run [09:00,10:00) buffer 30m blocks until 10:30; a new run starting 10:29 is
          rejected ERR_ANALYZER_RUN_OVERLAP, but a run starting exactly 10:30 is allowed — unlike the
          appointment's bare touch-allowed boundary.
        test_recipe:
          setup:
            - "A RESERVED AnalyzerRun on CHEM-1 [09:00,10:00) buffer 30 minutes."
          setup_api_calls:
            - call: "POST /catalog/analyzer-runs"
              payload: { analyzer_code: "CHEM-1", run_start: "2026-02-01T09:00:00Z", run_end: "2026-02-01T10:00:00Z", buffer_minutes: 30 }
              as: LabTech
              captures: { run_prior: '$.data.id' }
          trigger:
            - call: "POST /catalog/analyzer-runs"
              payload: { analyzer_code: "CHEM-1", run_start: "2026-02-01T10:29:00Z", run_end: "2026-02-01T11:00:00Z", buffer_minutes: 30 }
              as: LabTech
              captures: { err: '$.data.error_id' }
            - call: "POST /catalog/analyzer-runs"
              payload: { analyzer_code: "CHEM-1", run_start: "2026-02-01T10:30:00Z", run_end: "2026-02-01T11:00:00Z", buffer_minutes: 30 }
              as: LabTech
              captures: { run_ok: '$.data.id', run_ok_status: '$.data.status' }
          assert:
            - "run starting 10:29 returns 409 ERR_ANALYZER_RUN_OVERLAP"
            - "run starting exactly 10:30 succeeds with AnalyzerRun.status == RESERVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hsa_balance_conserved_on_capture_then_cancel_refund
        grounds:
          - state_machines.Order.payment_status=AUTHORIZED_to_payment_status=CAPTURED
          - state_machines.Order.payment_status=CAPTURED_to_payment_status=REFUNDED
          - calculations.hsa_capture_split
          - entities.Patient.fields.hsa_balance_cents
          - entities.Payment.fields.hsa_drawn_cents
        distinguishing_aspect: |
          Conserved quantity #1 = Patient.hsa_balance_cents (a stored fund pool). Capture debits it
          by hsa_applied_cents (20000→0), and a subsequent cancel-refund of the CAPTURED order
          credits exactly hsa_drawn_cents back (0→20000): net change 0, pinned as
          hsa_balance_after == hsa_balance_before.
        test_recipe:
          setup:
            - "Offering D5 @30000. Patient P16 HSA 20000 / HSA_FSA. Single-line HOME_KIT order, D5 released, COMPLETED, payment captured (hsa_balance now 0)."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "D5", display_name: "Test D5", list_price_cents: 30000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_d5: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p16@x.com", full_name: "P Sixteen", date_of_birth: "1990-01-01", state_code: "CA", hsa_balance_cents: 20000 }
              as: CatalogAdmin
              captures: { p16: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p16}", fund_source: "HSA_FSA" }
              as: Patient
              as_user_id: "${p16}"
              captures: { cart16: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart16}", test_offering_id: "${off_d5}" }
              as: Patient
              as_user_id: "${p16}"
            - call: "GET /catalog/carts/${cart16}"
              as: Patient
              as_user_id: "${p16}"
              captures: { cart16_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart16}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart16_v}" }
              as: Patient
              as_user_id: "${p16}"
              captures: { order16: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order16}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${p16}"
            - call: "GET /catalog/order-lines?order_id=${order16}"
              as: CatalogAdmin
              captures: { ol16: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol16}/collect"
              as: PhlebotomyTech
              captures: { spec16: '$.data.id' }
            - call: "POST /catalog/specimens/${spec16}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res16: '$.data.id' }
            - call: "POST /catalog/lab-results/${res16}/release"
              as: LabTech
            - call: "GET /catalog/orders/${order16}"
              as: Patient
              as_user_id: "${p16}"
              captures: { order16_v1: '$.data.version' }
            - call: "POST /catalog/orders/${order16}/capture-payment"
              payload: { expected_order_version: "${order16_v1}" }
              as: Patient
              as_user_id: "${p16}"
              captures: { order16_v2: '$.data.version' }
          trigger:
            - call: "POST /catalog/orders/${order16}/cancel"
              payload: { expected_order_version: "${order16_v2}" }
              as: Patient
              as_user_id: "${p16}"
            - call: "GET /catalog/patients/${p16}"
              as: Patient
              as_user_id: "${p16}"
              captures: { p16_hsa_after: '$.data.hsa_balance_cents' }
          assert:
            - "Patient.${p16}.hsa_balance_cents after capture+cancel == 20000"
            - "Order.${order16}.payment_status == REFUNDED"

      - name: card_net_charge_conserved_on_authorize_then_cancel_refund
        grounds:
          - state_machines.Order.payment_status=AUTH_PENDING_to_payment_status=AUTHORIZED
          - state_machines.Order.payment_status=AUTHORIZED_to_payment_status=REFUNDED
          - entities.Payment.fields.authorized_amount_cents
          - entities.Payment.fields.captured_amount_cents
        distinguishing_aspect: |
          Conserved quantity #2 = the order's net card charge (authorized minus captured/refunded),
          a different quantity type than the HSA fund pool. A CARD order authorized for 4000 then
          cancelled before any result is REFUNDED with captured_amount_cents 0 → net card charge 0.
        test_recipe:
          setup:
            - "Offering J @4000. Patient P17 CARD. Single-line HOME_KIT order placed (AUTHORIZED 4000), no collection yet."
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "J", display_name: "Test J", list_price_cents: 4000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_j: '$.data.id' }
            - call: "POST /catalog/patients"
              payload: { email: "p17@x.com", full_name: "P Seventeen", date_of_birth: "1990-01-01", state_code: "CA" }
              as: CatalogAdmin
              captures: { p17: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${p17}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${p17}"
              captures: { cart17: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart17}", test_offering_id: "${off_j}" }
              as: Patient
              as_user_id: "${p17}"
            - call: "GET /catalog/carts/${cart17}"
              as: Patient
              as_user_id: "${p17}"
              captures: { cart17_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart17}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart17_v}" }
              as: Patient
              as_user_id: "${p17}"
              captures: { order17: '$.data.id', order17_v: '$.data.version' }
          trigger:
            - call: "POST /catalog/orders/${order17}/cancel"
              payload: { expected_order_version: "${order17_v}" }
              as: Patient
              as_user_id: "${p17}"
            - call: "GET /catalog/payments?order_id=${order17}"
              as: Patient
              as_user_id: "${p17}"
              captures: { pay17_auth: '$.data[0].authorized_amount_cents', pay17_cap: '$.data[0].captured_amount_cents', pay17_status: '$.data[0].status' }
          assert:
            - "Payment for ${order17}: authorized_amount_cents == 4000"
            - "Payment for ${order17}: captured_amount_cents == 0"
            - "Payment for ${order17}: status == REFUNDED"
            - "Order.${order17}.payment_status == REFUNDED"
