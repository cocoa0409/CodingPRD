            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Pumps", amount_cents: 120000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Compasses", amount_cents: 240000, transaction_channel: "DIGITAL", promo_requested: true, promo_term_months: 6 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/settlement-batches"
              payload: { agreement_id: "${ag_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", settlement_method: "AS_CHARGED", reconciliation_method: "PROJECTED" }
              as: ProgramAdmin
              captures: { b1: "$.data.id" }
            - call: "POST /servicing/settlement-batches/${b1}/finalize"
              payload: {}
              as: ProgramAdmin
              captures: { p_after_1: "$.data.net_subsidy_cents" }
          trigger:
            - call: "POST /servicing/settlement-batches"
              payload: { agreement_id: "${ag_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", settlement_method: "AS_CHARGED", reconciliation_method: "PROJECTED" }
              as: ProgramAdmin
              captures: { b2: "$.data.id" }
            - call: "POST /servicing/settlement-batches/${b2}/finalize"
              payload: {}
