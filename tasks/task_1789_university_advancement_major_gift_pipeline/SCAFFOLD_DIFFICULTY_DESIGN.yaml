              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver2: $.data.version, rs: $.data.research_status }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 1000000, designation_purpose: "Now rated", expected_prospect_version: "${p_ver2}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id, prop_status: $.data.status }
          assert:
            - "err == \"ERR_PROSPECT_NOT_RATED\"  # Proposal x Prospect dependency blocked the first attempt"
            - "rs == \"RATED\"  # the cross-entity state flip"
            - "prop_status == \"DRAFT\"  # same call succeeds after the dependency is satisfied"

      - name: fund_payment_gated_by_stewardship_posture
        grounds:
          - state_machines.RestrictedFund.ACTIVE_to_SPENDING_FROZEN
          - state_machines.StewardshipReport.DRAFT_to_OVERDUE
          - errors[ERR_STEWARDSHIP_LAPSED]
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair GiftPayment -> RestrictedFund: a payment crediting a fund
          whose stewardship report is OVERDUE (fund SPENDING_FROZEN) is rejected,
          and the same payment succeeds after the report is delivered and the
          fund returns to ACTIVE. Distinct pair from Proposal -> Prospect.
        test_recipe:
          setup:
            - "ENDOWED fund ACTIVE (direct payment 3000000); report period [2025-01-01, 2025-06-30] swept to OVERDUE at clock 2026-08-02"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
