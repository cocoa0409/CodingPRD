  - rule_id: non_linear_state_machine
    instances:

      - name: listing_cycles_under_contract_back_on_market_under_contract
        grounds:
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Listing.UNDER_CONTRACT_to_BACK_ON_MARKET
          - state_machines.Listing.BACK_ON_MARKET_to_UNDER_CONTRACT
          - entities.Listing.fields.fallout_count
        distinguishing_aspect: |
          A TRUE CYCLE on the Listing entity: A -> B -> A -> B is legal and the row returns
          to UNDER_CONTRACT a second time with fallout_count 1 and a refreshed
          under_contract_at, which no linear pipeline can produce.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z."
            - "One SELLER, one LISTING_AGENT, one VACANT property, one ACTIVE listing."
          setup_api_calls: &listing_base
            - call: "POST /staging/_clock/set_current_utc"
