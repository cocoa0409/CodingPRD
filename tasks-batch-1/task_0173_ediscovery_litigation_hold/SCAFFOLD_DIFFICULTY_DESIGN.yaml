            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 2 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h1", page_count: 2 }
              as: LegalOps
              captures: { d1_id: $.data.id }
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h2", page_count: 2 }
              as: LegalOps
              captures: { d2_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs"
              payload: { matter_id: "${m_id}", scope_id: "${s1_id}" }
              as: LegalOps
              captures: { j_id: $.data.id }
            - call: "POST /processing-jobs/${j_id}/run"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs/${j_id}/complete"
              payload: {}
              as: LegalOps
            - call: "POST /review-batches"
              payload: { matter_id: "${m_id}", name: "B1" }
              as: ReviewLead
              captures: { b_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d1_id}" }
              as: ReviewLead
              captures: { dr1_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d2_id}" }
              as: ReviewLead
              captures: { dr2_id: $.data.id }
            - call: "POST /review-batches/${b_id}/open-review"
              payload: {}
              as: ReviewLead
            - call: "POST /document-reviews/${dr1_id}/decide"
              payload: { decision: "RESPONSIVE_NOT_PRIV" }
              as: Reviewer
            - call: "POST /document-reviews/${dr2_id}/decide"
              payload: { decision: "RESPONSIVE_PRIV" }
              as: Reviewer
            - call: "POST /review-batches/${b_id}/submit-qc"
              payload: {}
              as: ReviewLead
            - call: "POST /review-batches/${b_id}/complete"
              payload: {}
              as: ReviewLead
            - call: "POST /production-sets"
              payload: { matter_id: "${m_id}", source_batch_id: "${b_id}" }
              as: Producer
              captures: { ps_id: $.data.id }
            - call: "POST /production-sets/${ps_id}/items"
              payload: { document_id: "${d1_id}" }
              as: Producer
          trigger:
            - call: "POST /production-sets/${ps_id}/validate"
              payload: {}
              as: Producer
              captures: { st: $.data.status }
          assert:
            - "ProductionSet.${ps_id}.status == STAGED"
            - "ProductionSet.${ps_id}.bates_start == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: release_hold_cascades_matter_to_documents_depth4
        grounds:
          - state_machines.Matter.HOLD_ACTIVE_to_HOLD_RELEASED
          - state_machines.LegalHold.ACKNOWLEDGED_to_RELEASED
          - state_machines.CollectionScope.PROCESSED_to_RELEASED
          - entities.Document.fields.status
          - entities.Custodian.fields.retention_released
        distinguishing_aspect: |
          Depth-4 chain, each hop caused by the prior: release-hold sets Matter.hold_status=HOLD_RELEASED
          (hop0) -> LegalHold ACKNOWLEDGED->RELEASED (hop1) -> CollectionScope PROCESSED->RELEASED (hop2)
          -> every Document under the scope -> PURGEABLE and Custodian.retention_released=true (hop3).
        test_recipe:
          setup:
            - "Matter in CLOSING with HOLD_ACTIVE, hold ACKNOWLEDGED, one scope PROCESSED holding 1 UNIQUE+1 DUPLICATE doc, custodian retention_released=false."
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "Rel Co", bates_prefix: "RL" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
