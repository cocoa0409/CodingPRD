        as: ProviderRep
        as_user_id: ${prov_id}
        captures:
          auth_rf: $.data.id
      trigger:
      - call: POST /api/prior-authorizations/${auth_st}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
        captures:
          err_1: $.data.error_id
      - call: POST /api/prior-authorizations/${auth_rf}/approve
        payload:
          max_administrations: 4
        as: MedicalPolicyOfficer
        captures:
          err_2: $.data.error_id
      assert:
      - 'Step therapy incomplete: error_id == ERR_STEP_THERAPY_REQUIRED (422)'
      - 'MANDATORY + active biosimilar window covering 2026-08-15: error_id == ERR_BIOSIMILAR_SUBSTITUTION_REQUIRED (422)'
      - Both auths remain SUBMITTED
  - name: occ_stale_version_rejected
    claim_type: violation_to_error
    grounds:
    - concurrency_rules[policy-create-stale-drug]
    - validations[priority=4]
    - errors[ERR_STALE_DRUG_VERSION]
    distinguishing_aspect: 'OCC on create-with-supersede: after the first policy create bumps drug.version 1 -> 2, a second create carrying the
      stale expected_drug_version 1 is rejected 412; OCC is checked before any business rule.'
    test_recipe:
      setup:
      - Drug created (version 1 captured from the create response)
      setup_api_calls:
      - call: POST /api/drugs
        payload:
          j_code: J6200
          drug_name: OccDrug
          billing_unit_mg: 10
          vial_size_mg: 100
          single_dose_vial: true
          sourcing_rule: EITHER
          dose_rounding_mode: VIAL
          max_single_dose_mg: 2000
          site_of_care_eligible: false
        as: PlanAdmin
        captures:
          drug_id: $.data.id
          drug_ver: $.data.version
      trigger:
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C50
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
        captures:
          pol1: $.data.id
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver}
          covered_diagnoses:
          - C51
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
        captures:
          err_id: $.data.error_id
      - call: GET /api/drugs/${drug_id}
        as: PlanAdmin
        captures:
          drug_ver_fresh: $.data.version
      - call: POST /api/clinical-policies
        payload:
          drug_id: ${drug_id}
          status: ACTIVE
          expected_drug_version: ${drug_ver_fresh}
          covered_diagnoses:
          - C51
          step_therapy_required: false
          requires_site_of_care_redirection: false
          biosimilar_substitution: DISABLED
        as: MedicalPolicyOfficer
        captures:
          pol2: $.data.id
      assert:
      - 'First create succeeds (version was current): ${pol1} ACTIVE, drug.version now 2'
      - 'Second create reusing the stale captured version: HTTP 412, error_id == ERR_STALE_DRUG_VERSION'
      - 'Third create with freshly read version 2 succeeds: ${pol2} ACTIVE and ${pol1} SUPERSEDED (supersede semantics intact once OCC passes)'
      - DrugCatalogEntry.${drug_id}.version == 3 after exactly two successful creates
