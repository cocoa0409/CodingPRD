# =============================================================================
# PRD-Bench scaffold — task_2447
# Neonatal Intensive Care Level Designation & Transport
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2447. Neonatal Intensive Care Level Designation & Transport (regional neonatal
  intensive care unit): level of care designation criteria and required
  staffing/equipment maintenance, referral acceptance and bed capacity decisions
  with maternal transfer preference, neonatal transport team activation,
  stabilization and isolette transport logistics, risk-appropriate care
  back-transfer to community hospitals, developmental care protocols, family
  presence and milk handling workflows, outcome and infection surveillance
  reporting to a regional network, resource escalation during census surges,
  follow-up clinic enrollment for high-risk graduates

domain_name: neonatal-network
api_prefix: ""

# =============================================================================
# Step 0: Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is addressed at a top-level collection (`/referrals/{id}`,
  # `/admissions/{id}`); parenthood is expressed only through FK fields, never
  # through nested URL paths. Two entities carry self-referential FKs
  # (Referral.superseded_by_referral_id, Admission.back_transfer_source_admission_id).

  state_machine_shape: cyclic
  # Referral is cyclic (PENDING -> INFO_REQUESTED -> PENDING, ACCEPTED -> PENDING
  # on transport abort) with a pinned loop bound; TransportRun is branching
  # fork-join (ACTIVATED -> {GROUND_ROLLING | AIR_LAUNCHED} -> ON_SCENE) with
  # mode-divergent side effects; Admission carries two parallel state dimensions
  # (care_status x infection_status); SurveillanceReport is cyclic
  # (SUBMITTED -> REJECTED -> SUBMITTED); DesignationReview is cyclic
  # (SUBMITTED -> RETURNED -> SUBMITTED) with a pinned round bound.

  relationship_patterns:
    - one_to_many          # NicuUnit -> StaffCredential / EquipmentAsset / Referral / Admission
    - self_referential     # Referral.superseded_by_referral_id, Admission.back_transfer_source_admission_id
    - cross_aggregate      # TransportRun -> BedReservation + EquipmentAsset (isolette) across aggregates
    - polymorphic_role     # three distinct roles are entity_backed to NicuUnit and are told apart by which FK they own

  role_model: segregation_of_duties
  # A DesignationReview's certifier must not be the operator who verified it; a
  # MilkBatch's verifier must not be the operator who received it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Global conventions
# =============================================================================
conventions:
  logical_clock: |
    Every server-stamped timestamp (created_at, updated_at, held_at, arrived_at,
    discharged_at, infection_confirmed_at, expires_at bases) is read from the
    logical clock, never from wall-clock time. The clock starts at
    2026-08-01T00:00:00Z and only POST /_clock/set_current_utc moves it.
  time_based_state: |
    Time never mutates stored state on its own. StaffCredential.status and
    EquipmentAsset.status are pure functions of the clock and are re-derived on
    every read/decision. Every other time-driven state change (bed-hold expiry,
    escalation expiry, follow-up lapse, deferral promotion) happens only inside
    POST /ops/run-capacity-sweep or inside an explicitly declared transition.
  identity_fields: |
    `id` is a server-minted UUID with no type prefix. It identifies resources in
    paths and FK fields only, and MUST NOT participate in any selector, ranking,
    tie-break, allocation order, cascade order or replay order. Where a precise
    fallback ordering is needed the scaffold pins `created_at ASC`.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: NicuUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hospital/unit display name" }
      - { name: hospital_type, type: enum, source: input, description: "REGIONAL_CENTER | COMMUNITY", constraints: "one of REGIONAL_CENTER, COMMUNITY" }
      - { name: designated_level, type: enum, source: input, default: "LEVEL_I", description: "Level of care granted by the regional network: LEVEL_I | LEVEL_II | LEVEL_III | LEVEL_IV. Set at creation, thereafter only by DesignationReview certification." }
      - { name: designation_status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | DESIGNATED | CONDITIONAL | SUSPENDED" }
      - { name: capability_level, type: enum, source: computed, description: "Highest DesignationStandard level whose required_credential_codes are all held VALID and required_equipment_codes are all held IN_SERVICE by this unit; LEVEL_I when no declared standard is satisfied (statutory newborn-nursery baseline)" }
      - { name: effective_level, type: enum, source: computed, description: "= min(designated_level, capability_level) by level order. Gates every referral acceptance." }
      - { name: staffing_compliant, type: boolean, source: computed, description: "true when every required_credential_code of the standard for designated_level is held with status VALID and fte >= 0.5" }
      - { name: equipment_compliant, type: boolean, source: computed, description: "true when every required_equipment_code of the standard for designated_level is held with status IN_SERVICE" }
      - { name: staffed_bed_target, type: integer, source: input, description: "Base staffed bed count", constraints: ">= 1" }
      - { name: escalation_bed_count, type: integer, source: computed, default: 0, description: "= sum of authorized_beds over this unit's SurgeEscalation rows with status ACTIVE" }
      - { name: occupied_bed_count, type: integer, source: computed, default: 0, description: "= count of this unit's Admission rows with care_status IN {ADMITTED, STABILIZED, BACK_TRANSFER_READY, BACK_TRANSFER_REQUIRED}" }
      - { name: held_bed_count, type: integer, source: computed, default: 0, description: "= count of this unit's BedReservation rows with status HELD" }
      - { name: available_bed_count, type: integer, source: computed, description: "= staffed_bed_target + escalation_bed_count - occupied_bed_count - held_bed_count (may be negative after a stand-down; never clamped)" }
      - { name: census_posture, type: enum, source: computed, description: "OPEN | CONSTRAINED | CLOSED — derived from available_bed_count per calculations.census_posture" }
      - { name: required_nurse_count, type: integer, source: computed, default: 0, description: "Per-acuity-band nurse requirement for the current census; see calculations.required_nurse_count" }
      - { name: transport_capable, type: boolean, source: input, default: false, description: "Unit operates a neonatal transport team" }
      - { name: annual_admission_volume, type: integer, source: input, default: 0, description: "Rolling annual admission volume declared for designation scoring" }
      - { name: followup_clinic_daily_capacity, type: integer, source: input, default: 0, description: "High-risk follow-up clinic slots per calendar day" }
      - { name: quality_flag, type: enum, source: system, default: "WITHIN_BENCHMARK", description: "WITHIN_BENCHMARK | ABOVE_BENCHMARK — mirrors the network_benchmark_flag of the most recently ACCEPTED SurveillanceReport" }
      - { name: deferral_queue_depth, type: integer, source: computed, default: 0, description: "= count of Referral rows with receiving_unit_id = this unit and status DEFERRED" }

  - name: DesignationStandard
    parent: null
    common_fields: false
    fields:
      - { name: level, type: enum, source: input, description: "LEVEL_I | LEVEL_II | LEVEL_III | LEVEL_IV", constraints: "unique across DesignationStandard rows" }
      - { name: required_credential_codes, type: array, source: input, description: "Credential codes that must be held VALID with fte >= 0.5; empty array scores 100.00 for credential coverage" }
      - { name: required_equipment_codes, type: array, source: input, description: "Equipment codes that must be held IN_SERVICE; empty array scores 100.00 for equipment coverage" }
      - { name: nurse_patient_ratio_denominator, type: number, source: input, description: "Patients per nurse permitted at this level (LEVEL_IV 1.0 … LEVEL_I 4.0)", constraints: "> 0" }
      - { name: min_annual_volume, type: integer, source: input, description: "Annual admission volume expected of a REGIONAL_CENTER at this level", constraints: ">= 1" }
      - { name: transport_capability_required, type: boolean, source: input, description: "Level requires an owned transport team; failing it caps compliance_score at 69.99" }
      - { name: min_compliance_score, type: number, source: input, description: "Score needed for full designation at this level" }
      - { name: conditional_floor_score, type: number, source: input, description: "Score needed for a CONDITIONAL designation one level below" }

  - name: StaffCredential
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit that holds this credential" }
      - { name: credential_code, type: enum, source: input, description: "NEO_BOARD | NNP | RN_NICU_CORE | RT_NEO | TRANSPORT_RN | LACTATION_IBCLC | DEV_CARE_CERT" }
      - { name: holder_reference, type: string, source: input, description: "De-identified staff reference" }
      - { name: fte, type: number, source: input, description: "FTE contributed by this credential holder", constraints: "> 0" }
      - { name: expires_on, type: datetime, source: input, description: "Credential expiry instant (ISO 8601 UTC)" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Set by revoke; null otherwise" }
      - { name: status, type: enum, source: computed, description: "REVOKED when revoked_at is not null; else EXPIRED when expires_on <= current_utc; else VALID" }

  - name: EquipmentAsset
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit that owns this asset" }
      - { name: equipment_code, type: enum, source: input, description: "CONVENTIONAL_VENT | HFOV | INHALED_NO | THERAPEUTIC_HYPOTHERMIA | TRANSPORT_ISOLETTE | ECMO_CIRCUIT" }
      - { name: asset_tag, type: string, source: input, description: "Biomed asset tag" }
      - { name: last_service_at, type: datetime, source: input, description: "Last preventive-maintenance completion instant" }
      - { name: service_interval_days, type: integer, source: input, description: "Maintenance interval in days", constraints: ">= 1" }
      - { name: next_service_due_at, type: datetime, source: computed, description: "= last_service_at + service_interval_days days" }
      - { name: out_of_service_at, type: datetime, source: system, default: null, description: "Set by out-of-service; cleared by service" }
      - { name: out_of_service_reason, type: enum, source: system, default: null, description: "BIOMED_FAULT | RECALL | CONTAMINATION | AWAITING_PARTS" }
      - { name: status, type: enum, source: computed, description: "OUT_OF_SERVICE when out_of_service_at is not null; else SERVICE_DUE when next_service_due_at <= current_utc; else IN_SERVICE" }
      - { name: decontamination_ready_at, type: datetime, source: system, default: null, description: "Isolette re-availability instant stamped by TransportRun dispatch/arrival; null when the asset has never carried a run" }

  - name: DesignationReview
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit under review" }
      - { name: requested_level, type: enum, source: input, description: "LEVEL_I | LEVEL_II | LEVEL_III | LEVEL_IV" }
      - { name: assigned_nurse_count, type: integer, source: input, description: "Nurses the unit reports assigned to the current census", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | RETURNED | VERIFIED | CERTIFIED | DENIED" }
      - { name: submission_round, type: integer, source: computed, default: 0, description: "Incremented on every submit; a submit that would make it 3 denies the review instead" }
      - { name: assessment_at, type: datetime, source: system, default: null, description: "Clock instant of the most recent submit" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the most recent submit" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the verify call" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the certify call; must differ from verified_by_user_id" }
      - { name: required_nurse_count, type: integer, source: computed, default: 0, description: "Snapshot of calculations.required_nurse_count at submit" }
      - { name: staffing_subscore, type: number, source: computed, default: 0, description: "0–100, 2dp; see calculations.designation_compliance_score" }
      - { name: equipment_subscore, type: number, source: computed, default: 0, description: "0–100, 2dp" }
      - { name: volume_subscore, type: number, source: computed, default: 0, description: "0–100, 2dp" }
      - { name: compliance_score, type: number, source: computed, default: 0, description: "Weighted total, 2dp, capped at 69.99 when transport capability is required but absent" }
      - { name: outcome_level, type: enum, source: computed, default: null, description: "Level granted at certification: requested_level on full pass, one level below on conditional pass, null on DENIED" }
      - { name: return_reason, type: string, source: system, default: null, description: "Free text recorded by return" }
      - { name: denial_basis, type: enum, source: system, default: null, description: "SCORE_BELOW_FLOOR | ROUNDS_EXHAUSTED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referring_unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit sending the case" }
      - { name: receiving_unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit asked to accept" }
      - { name: source_admission_id, type: string, source: system, default: null, description: "FK -> Admission.id; set only on BACK_TRANSFER referrals created from an admission" }
      - { name: superseded_by_referral_id, type: string, source: system, default: null, description: "FK -> Referral.id; set when a newer back-transfer referral supersedes this one" }
      - { name: referral_kind, type: enum, source: input, description: "INBOUND_NEONATAL | MATERNAL_ANTENATAL | BACK_TRANSFER" }
      - { name: case_reference, type: string, source: input, description: "De-identified case reference" }
      - { name: gestational_age_weeks, type: number, source: input, description: "Gestational age in weeks (decimal)", constraints: "20.0–44.0" }
      - { name: birth_weight_grams, type: integer, source: input, description: "Birth weight (estimated fetal weight for MATERNAL_ANTENATAL)", constraints: ">= 300" }
      - { name: weight_basis_grams, type: integer, source: computed, description: "= source admission's current_weight_grams for BACK_TRANSFER referrals, else birth_weight_grams; the weight fed to the level calculation" }
      - { name: support_modality, type: enum, source: input, description: "ROOM_AIR | CPAP | CONVENTIONAL_VENT | HFOV | INHALED_NO | ECMO_CONSULT" }
      - { name: diagnoses, type: array, source: input, default: [], description: "Codes from RDS_SEVERE | HIE_MODERATE | PROM | CHD_DUCTAL | SURGICAL_NEC" }
      - { name: planned_surgery, type: boolean, source: input, default: false, description: "Surgical intervention anticipated" }
      - { name: current_support_level, type: enum, source: computed, description: "Level required by present findings only (dual-variant A)" }
      - { name: anticipated_need_level, type: enum, source: computed, description: "Level required once anticipated needs are counted (dual-variant B)" }
      - { name: level_basis, type: enum, source: computed, description: "CURRENT_SUPPORT | ANTICIPATED_NEED — which variant required_level took" }
      - { name: required_level, type: enum, source: computed, description: "Risk-appropriate level of care demanded by this case" }
      - { name: maternal_transfer_preferred, type: boolean, source: computed, description: "= referral_kind == MATERNAL_ANTENATAL and required_level order >= 3" }
      - { name: triage_priority, type: number, source: computed, description: "0–100, 2dp weighted score; ranks the deferral queue" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | INFO_REQUESTED | ACCEPTED | DEFERRED | DECLINED | DIVERTED | WITHDRAWN | REVOKED | SUPERSEDED | COMPLETED" }
      - { name: info_request_rounds, type: integer, source: computed, default: 0, description: "Completed information-request rounds; capped at 2" }
      - { name: requested_items, type: string, source: system, default: null, description: "Items asked for by the most recent request-info" }
      - { name: decision_reason, type: enum, source: system, default: null, description: "NO_CAPABILITY | NO_BED | CAPABILITY_LOST | INFO_ROUNDS_EXHAUSTED | HOLD_EXPIRED | TRANSPORT_ABORTED | CLINICAL_DECLINE | FAMILY_CHOICE" }
      - { name: reservation_id, type: string, source: computed, default: null, description: "Read-only pointer to the id of this referral's current BedReservation (the HELD or OCCUPIED row, else the most recent released one); null while the referral has never been accepted. Not a stored FK — derived from BedReservation.referral_id so that acceptance responses expose the hold without a second read." }

  - name: BedReservation
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit holding the bed" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; referral the hold belongs to" }
      - { name: bed_class, type: enum, source: computed, description: "STAFFED when a base staffed bed was still free at hold time, else ESCALATION (waterfall: staffed beds fill first)" }
      - { name: held_at, type: datetime, source: system, description: "Clock instant of acceptance" }
      - { name: expires_at, type: datetime, source: computed, description: "= held_at + 720 minutes for MATERNAL_ANTENATAL referrals, else held_at + 240 minutes" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | OCCUPIED | RELEASED | EXPIRED" }
      - { name: released_reason, type: enum, source: system, default: null, description: "ADMITTED | REVOKED | REFERRAL_WITHDRAWN | CAPABILITY_LOST | TRANSPORT_ABORTED | HOLD_EXPIRED" }

  - name: TransportRun
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> BedReservation.id; hold this run is fulfilling" }
      - { name: receiving_unit_id, type: string, source: system, description: "FK -> NicuUnit.id; copied from the reservation" }
      - { name: isolette_asset_id, type: string, source: input, description: "FK -> EquipmentAsset.id; TRANSPORT_ISOLETTE assigned to the run" }
      - { name: mode, type: enum, source: input, description: "GROUND | ROTOR_WING | FIXED_WING" }
      - { name: crew_composition, type: array, source: input, description: "Credential codes carried by the crew; must contain TRANSPORT_RN" }
      - { name: depart_at, type: datetime, source: input, description: "Planned departure instant — start of the isolette occupation interval" }
      - { name: planned_return_at, type: datetime, source: input, description: "Planned return instant — end of the isolette occupation interval", constraints: "> depart_at" }
      - { name: weather_minimums_met, type: boolean, source: input, default: true, description: "Aviation weather minimums attested for air modes" }
      - { name: status, type: enum, source: system, default: "ACTIVATED", description: "ACTIVATED | GROUND_ROLLING | AIR_LAUNCHED | ON_SCENE | STABILIZING | EN_ROUTE | ARRIVED | ABORTED" }
      - { name: decontamination_minutes, type: integer, source: computed, description: "= 45 for GROUND, 90 for ROTOR_WING and FIXED_WING; buffer appended to the isolette occupation interval" }
      - { name: temp_c, type: number, source: input, default: null, description: "Axillary temperature recorded at stabilization" }
      - { name: glucose_mg_dl, type: number, source: input, default: null, description: "Point-of-care glucose recorded at stabilization" }
      - { name: mean_bp_mmhg, type: number, source: input, default: null, description: "Mean arterial pressure recorded at stabilization" }
      - { name: spo2_pct, type: number, source: input, default: null, description: "Pre-ductal saturation recorded at stabilization" }
      - { name: stabilization_score, type: number, source: computed, default: null, description: "0–100 physiologic stability score; see calculations.stabilization_score" }
      - { name: stabilization_bundle_complete, type: boolean, source: computed, default: false, description: "= stabilization_score >= 85" }
      - { name: arrived_at, type: datetime, source: input, default: null, description: "Actual arrival instant recorded by arrive" }
      - { name: abort_reason, type: enum, source: system, default: null, description: "WEATHER | CAPABILITY_LOST | CREW_UNAVAILABLE | PATIENT_DEMISE | HOLD_EXPIRED" }

  - name: Admission
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> NicuUnit.id; admitting unit, copied from the referral's receiving_unit_id" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; referral that produced this admission" }
      - { name: transport_run_id, type: string, source: system, default: null, description: "FK -> TransportRun.id; set when the admission was produced by a transport arrival" }
      - { name: back_transfer_source_admission_id, type: string, source: system, default: null, description: "FK -> Admission.id; the regional-centre admission this back-transfer admission continues" }
      - { name: gestational_age_weeks, type: number, source: system, description: "Copied from the referral" }
      - { name: birth_weight_grams, type: integer, source: system, description: "Copied from the referral" }
      - { name: current_weight_grams, type: integer, source: system, description: "Latest weight; initialised to birth_weight_grams, updated by care-updates" }
      - { name: support_modality, type: enum, source: system, description: "Latest respiratory support; initialised from the referral, updated by care-updates" }
      - { name: current_care_level, type: enum, source: computed, description: "= max(weight level of current_weight_grams, support level of support_modality) by level order" }
      - { name: care_status, type: enum, source: system, default: "ADMITTED", description: "Dimension 1: ADMITTED | STABILIZED | BACK_TRANSFER_READY | BACK_TRANSFER_REQUIRED | TRANSFERRED | DISCHARGED | DECEASED" }
      - { name: infection_status, type: enum, source: system, default: "SURVEILLANCE_CLEAR", description: "Dimension 2 (independent of care_status): SURVEILLANCE_CLEAR | SUSPECTED | CONFIRMED_CLABSI | RESOLVED" }
      - { name: infection_confirmed_at, type: datetime, source: system, default: null, description: "Clock instant of the CONFIRM_CLABSI event; the timestamp surveillance periods filter on" }
      - { name: patient_days, type: integer, source: computed, default: 0, description: "+1 per care-update" }
      - { name: central_line_days, type: integer, source: computed, default: 0, description: "+1 per care-update posted with central_line_present true" }
      - { name: ventilator_days, type: integer, source: computed, default: 0, description: "+1 per care-update posted with ventilated true" }
      - { name: developmental_round_count, type: integer, source: computed, default: 0, description: "Count of developmental-care rounds posted" }
      - { name: kangaroo_care_sessions, type: integer, source: computed, default: 0, description: "+1 per round with kangaroo_care_minutes >= 60" }
      - { name: family_presence_minutes, type: integer, source: computed, default: 0, description: "Sum of family_presence_minutes across rounds" }
      - { name: cluster_care_compliant_count, type: integer, source: computed, default: 0, description: "Count of rounds with cluster_care_compliant true" }
      - { name: light_cycling_compliant_count, type: integer, source: computed, default: 0, description: "Count of rounds with light_cycling_compliant true" }
      - { name: developmental_bundle_score, type: number, source: computed, default: 0, description: "0–100, 2dp; gates back-transfer readiness at >= 60" }
      - { name: milk_administered_ml, type: number, source: computed, default: 0, description: "= sum of administered_ml over this admission's MilkBatch rows, 1dp" }
      - { name: high_risk_graduate, type: boolean, source: computed, default: false, description: "Follow-up eligibility; see calculations.followup_eligibility" }
      - { name: back_transfer_attestation_note, type: string, source: system, default: null, description: "Risk-appropriateness attestation text recorded at back-transfer-ready" }
      - { name: discharged_at, type: datetime, source: system, default: null, description: "Clock instant of transfer, discharge or death" }
      - { name: discharge_disposition, type: enum, source: system, default: null, description: "HOME | BACK_TRANSFERRED | DECEASED" }

  - name: MilkBatch
    parent: Admission
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; infant the milk is labelled for" }
      - { name: donor_type, type: enum, source: input, description: "MOTHERS_OWN | DONOR_PASTEURIZED" }
      - { name: volume_ml, type: number, source: input, description: "Volume received, 1dp", constraints: "> 0" }
      - { name: expressed_at, type: datetime, source: input, description: "Expression (or thaw, for donor milk) instant" }
      - { name: expires_at, type: datetime, source: computed, description: "= expressed_at + 96 hours for MOTHERS_OWN, + 24 hours for DONOR_PASTEURIZED" }
      - { name: label_code, type: string, source: input, description: "Two-person verification label printed on the container" }
      - { name: received_by_user_id, type: string, source: system, description: "X-User-ID of the receiving nurse" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the second nurse; must differ from received_by_user_id" }
      - { name: administered_ml, type: number, source: computed, default: 0, description: "Cumulative volume administered, 1dp" }
      - { name: discarded_ml, type: number, source: computed, default: 0, description: "Cumulative volume discarded, 1dp" }
      - { name: remaining_ml, type: number, source: computed, description: "= volume_ml - administered_ml - discarded_ml, 1dp" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | VERIFIED | PARTIALLY_ADMINISTERED | ADMINISTERED | DISCARDED | QUARANTINED" }
      - { name: pre_quarantine_status, type: enum, source: system, default: null, description: "Status held before an infection quarantine, replayed on release" }

  - name: SurgeEscalation
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit requesting extra beds" }
      - { name: requested_beds, type: integer, source: input, description: "Beds asked for", constraints: ">= 1" }
      - { name: effective_from, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end (inclusive)", constraints: "> effective_from" }
      - { name: census_ratio_at_request, type: number, source: computed, description: "= occupied_bed_count / (staffed_bed_target + escalation beds of OTHER ACTIVE escalations), 4dp" }
      - { name: escalation_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 by census_ratio_at_request" }
      - { name: staffing_waiver_ratio, type: number, source: computed, description: "1.10 | 1.25 | 1.50 by tier; multiplies the acuity-band denominators" }
      - { name: authorized_beds, type: integer, source: computed, description: "Beds actually granted; see calculations.surge_escalation_authorization" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | ACTIVE | EXPIRED | DENIED | STOOD_DOWN" }
      - { name: authorized_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the authorizing network administrator" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Free text recorded by deny" }

  - name: SurveillanceReport
    parent: NicuUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> NicuUnit.id; reporting unit" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (inclusive)", constraints: "> period_start" }
      - { name: reported_patient_days, type: integer, source: input, description: "Patient-days denominator", constraints: ">= 0" }
      - { name: reported_central_line_days, type: integer, source: input, description: "Central-line-days denominator", constraints: ">= 0" }
      - { name: clabsi_count, type: integer, source: computed, default: 0, description: "Count of this unit's admissions with infection_confirmed_at inside [period_start, period_end]" }
      - { name: mortality_count, type: integer, source: computed, default: 0, description: "Count of this unit's admissions with care_status DECEASED and discharged_at inside the period" }
      - { name: cohort_size, type: integer, source: computed, default: 0, description: "Count of this unit's admissions with created_at inside the period" }
      - { name: birth_weight_risk_weight, type: number, source: computed, default: 1, description: "Mean birth-weight band weight over the cohort, 4dp; 1.0000 for an empty cohort" }
      - { name: crude_clabsi_rate, type: number, source: computed, default: 0, description: "Infections per 1000 patient-days, 2dp (dual-variant A)" }
      - { name: device_adjusted_clabsi_rate, type: number, source: computed, default: 0, description: "Risk-weighted infections per 1000 central-line-days, 2dp (dual-variant B)" }
      - { name: variant_applied, type: enum, source: computed, description: "DEVICE_ADJUSTED when reported_central_line_days > 0, else CRUDE" }
      - { name: data_completeness_flag, type: enum, source: computed, description: "COMPLETE | DENOMINATOR_MISSING" }
      - { name: network_benchmark_flag, type: enum, source: computed, description: "ABOVE_BENCHMARK when the rate of variant_applied > 1.50, else WITHIN_BENCHMARK" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Clock instant of the most recent submit" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Free text recorded by reject" }

  - name: FollowUpEnrollment
    parent: Admission
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; graduate being enrolled" }
      - { name: clinic_unit_id, type: string, source: input, description: "FK -> NicuUnit.id; unit running the follow-up clinic" }
      - { name: target_appointment_date, type: datetime, source: input, description: "Requested appointment instant" }
      - { name: confirmed_appointment_date, type: datetime, source: system, default: null, description: "Instant confirmed by schedule" }
      - { name: appointment_window_start, type: datetime, source: computed, description: "= admission.discharged_at + 14 days (inclusive)" }
      - { name: appointment_window_end, type: datetime, source: computed, description: "= admission.discharged_at + 90 days (inclusive)" }
      - { name: eligibility_basis, type: enum, source: computed, description: "First match in pinned order: BW_UNDER_1500 | GA_UNDER_32 | HIE_COOLED | SURGICAL_NEC | VENT_OVER_7D | NOT_ELIGIBLE" }
      - { name: risk_tier, type: enum, source: computed, description: "HIGH when birth_weight_grams < 1000 or eligibility_basis == HIE_COOLED, else MODERATE" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "ENROLLED | SCHEDULED | ATTENDED | NO_SHOW | LOST_TO_FOLLOWUP" }
      - { name: attendance_recorded_at, type: datetime, source: system, default: null, description: "Clock instant of record-attendance" }

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:

  - entity: DesignationReview
    field: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED, DENIED]
    shape_note: |
      Cyclic with a pinned round bound: SUBMITTED -> RETURNED -> SUBMITTED. The
      third submit does not enter SUBMITTED at all; it lands on DENIED.
    transitions:
      - trigger: submit
        from: [DRAFT, RETURNED]
        to: SUBMITTED
        preconditions:
          - "submission_round < 2 — otherwise this transition is replaced by the deny_rounds_exhausted transition below"
          - "unit.designation_status != SUSPENDED"
        side_effects:
          - "submission_round += 1"
          - "assessment_at = current_utc"
          - "submitted_by_user_id = X-User-ID"
          - "required_nurse_count, staffing_subscore, equipment_subscore, volume_subscore and compliance_score are recomputed and frozen onto the review"
      - trigger: submit
        name: deny_rounds_exhausted
        from: [RETURNED]
        to: DENIED
        preconditions:
          - "submission_round == 2 (this call would be the third)"
        side_effects:
          - "submission_round = 3"
          - "denial_basis = ROUNDS_EXHAUSTED"
          - "outcome_level = null"
          - "unit.designation_status = SUSPENDED"
          - "every Referral with receiving_unit_id = unit.id and status IN {PENDING, INFO_REQUESTED, DEFERRED} -> DIVERTED with decision_reason CAPABILITY_LOST"
      - trigger: return
        from: [SUBMITTED]
        to: RETURNED
        preconditions:
          - "X-User-ID must differ from submitted_by_user_id"
        side_effects:
          - "return_reason recorded"
      - trigger: verify
        from: [SUBMITTED]
        to: VERIFIED
        preconditions:
          - "compliance_score >= conditional_floor_score of the DesignationStandard for requested_level"
          - "X-User-ID must differ from submitted_by_user_id"
        side_effects:
          - "verified_by_user_id = X-User-ID"
      - trigger: certify
        from: [VERIFIED]
        to: CERTIFIED
        preconditions:
          - "X-User-ID must differ from verified_by_user_id (segregation of duties)"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "outcome_level = requested_level when compliance_score >= min_compliance_score, else the level one step below requested_level"
          - "unit.designated_level = outcome_level"
          - "unit.designation_status = DESIGNATED when outcome_level == requested_level, else CONDITIONAL"
          - "unit.effective_level is re-derived; every ACCEPTED Referral whose required_level now exceeds the new effective_level -> DIVERTED (CAPABILITY_LOST) and its HELD reservation -> RELEASED (CAPABILITY_LOST)"
      - trigger: certify
        name: certify_denies_below_floor
        from: [SUBMITTED]
        to: DENIED
        preconditions:
          - "compliance_score < conditional_floor_score of the standard for requested_level"
          - "X-User-ID must differ from submitted_by_user_id"
        side_effects:
          - "denial_basis = SCORE_BELOW_FLOOR"
          - "outcome_level = null"

  - entity: Referral
    field: status
    initial_state: PENDING
    terminal_states: [DECLINED, DIVERTED, WITHDRAWN, REVOKED, SUPERSEDED, COMPLETED]
    shape_note: |
      Cyclic on two loops: PENDING -> INFO_REQUESTED -> PENDING (bounded at 2
      completed rounds; the third request-info diverts) and
      ACCEPTED -> PENDING (transport abort returns the case to the queue).
    transitions:
      - trigger: request-info
        from: [PENDING, DEFERRED]
        to: INFO_REQUESTED
        preconditions:
          - "info_request_rounds < 2 — otherwise replaced by divert_info_exhausted"
        side_effects:
          - "requested_items recorded"
      - trigger: request-info
        name: divert_info_exhausted
        from: [PENDING, DEFERRED]
        to: DIVERTED
        preconditions:
          - "info_request_rounds == 2"
        side_effects:
          - "decision_reason = INFO_ROUNDS_EXHAUSTED"
      - trigger: provide-info
        from: [INFO_REQUESTED]
        to: PENDING
        side_effects:
          - "info_request_rounds += 1"
          - "requested_items = null"
          - "the clinical inputs supplied are applied, then required_level, level_basis, maternal_transfer_preferred and triage_priority are recomputed"
      - trigger: accept
        from: [PENDING]
        to: ACCEPTED
        preconditions:
          - "receiving unit's designation_status != SUSPENDED"
          - "receiving unit's effective_level order >= required_level order"
          - "receiving unit's available_bed_count >= 1"
          - "no strictly-higher-priority MATERNAL_ANTENATAL referral is waiting on the last free bed (see validations priority 12)"
          - "expected_unit_version must equal the receiving unit's current version"
        side_effects:
          - "a BedReservation is created with status HELD, bed_class by waterfall, held_at = current_utc and expires_at per the referral kind"
          - "unit.version += 1"
      - trigger: decline
        from: [PENDING, INFO_REQUESTED]
        to: DECLINED
        side_effects:
          - "decision_reason set from the caller's basis (NO_CAPABILITY | CLINICAL_DECLINE)"
      - trigger: defer
        from: [PENDING]
        to: DEFERRED
        preconditions:
          - "receiving unit's available_bed_count <= 0"
        side_effects:
          - "decision_reason = NO_BED"
          - "unit.deferral_queue_depth is re-derived"
      - trigger: promote
        from: [DEFERRED]
        to: ACCEPTED
        internal: true
        note: "Never called directly. Fired only by POST /ops/run-capacity-sweep and by the discharge/back-transfer cascades, over the pinned deferral-queue ranking."
        preconditions:
          - "unit.available_bed_count >= 1 at the moment this referral is reached in the ranking"
          - "required_level order <= unit.effective_level order"
        side_effects:
          - "a HELD BedReservation is created exactly as for accept"
          - "decision_reason = null"
          - "unit.version += 1"
      - trigger: withdraw
        from: [PENDING, INFO_REQUESTED, DEFERRED, ACCEPTED]
        to: WITHDRAWN
        side_effects:
          - "decision_reason = FAMILY_CHOICE"
          - "any HELD reservation -> RELEASED with released_reason REFERRAL_WITHDRAWN"
      - trigger: revoke-acceptance
        from: [ACCEPTED]
        to: REVOKED
        preconditions:
          - "no TransportRun for this referral's reservation is in status GROUND_ROLLING, AIR_LAUNCHED, ON_SCENE, STABILIZING or EN_ROUTE"
        side_effects:
          - "the HELD reservation -> RELEASED with released_reason REVOKED"
          - "any ACTIVATED TransportRun on that reservation -> ABORTED (CAPABILITY_LOST)"
          - "unit.version += 1"
      - trigger: transport_abort_returns_case
        from: [ACCEPTED]
        to: PENDING
        internal: true
        note: "Fired by POST /transport-runs/{id}/abort. Deliberately does NOT run the deferral-queue promotion (see calculations.deferral_promotion_order)."
        side_effects:
          - "the HELD reservation -> RELEASED with released_reason TRANSPORT_ABORTED"
          - "decision_reason = TRANSPORT_ABORTED"
      - trigger: capability_loss_divert
        from: [PENDING, INFO_REQUESTED, DEFERRED, ACCEPTED]
        to: DIVERTED
        internal: true
        note: "Fired by the equipment/credential capability cascade and by review denial."
        side_effects:
          - "decision_reason = CAPABILITY_LOST"
          - "any HELD reservation -> RELEASED with released_reason CAPABILITY_LOST"
      - trigger: hold_expiry_divert
        from: [ACCEPTED]
        to: DIVERTED
        internal: true
        note: "Fired by POST /ops/run-capacity-sweep when expires_at <= current_utc."
        side_effects:
          - "decision_reason = HOLD_EXPIRED"
          - "the HELD reservation -> EXPIRED with released_reason HOLD_EXPIRED"
      - trigger: supersede
        from: [PENDING, DEFERRED]
        to: SUPERSEDED
        internal: true
        note: "Fired when a second back-transfer referral is created from the same source admission."
        side_effects:
          - "superseded_by_referral_id = the new referral's id"
          - "any HELD reservation -> RELEASED with released_reason REVOKED"
      - trigger: complete
        from: [ACCEPTED]
        to: COMPLETED
        internal: true
        note: "Fired by POST /admissions."
        side_effects:
          - "the HELD reservation -> OCCUPIED with released_reason ADMITTED"

  - entity: TransportRun
    field: status
    initial_state: ACTIVATED
    terminal_states: [ARRIVED, ABORTED]
    shape_note: |
      Branching fork-join: launch forks on mode into GROUND_ROLLING or
      AIR_LAUNCHED with different preconditions and different isolette
      decontamination buffers; both branches join at ON_SCENE.
    transitions:
      - trigger: dispatch
        name: dispatch_ground
        from: [ACTIVATED]
        to: GROUND_ROLLING
        preconditions:
          - "mode == GROUND"
          - "crew_composition contains TRANSPORT_RN"
          - "the isolette asset's derived status == IN_SERVICE"
        side_effects:
          - "isolette.decontamination_ready_at = planned_return_at + 45 minutes"
      - trigger: dispatch
        name: dispatch_air
        from: [ACTIVATED]
        to: AIR_LAUNCHED
        preconditions:
          - "mode IN {ROTOR_WING, FIXED_WING}"
          - "weather_minimums_met == true"
          - "crew_composition contains TRANSPORT_RN"
          - "the isolette asset's derived status == IN_SERVICE"
        side_effects:
          - "isolette.decontamination_ready_at = planned_return_at + 90 minutes"
      - trigger: on-scene
        from: [GROUND_ROLLING, AIR_LAUNCHED]
        to: ON_SCENE
        side_effects: []
      - trigger: stabilize
        from: [ON_SCENE, STABILIZING]
        to: STABILIZING
        side_effects:
          - "temp_c, glucose_mg_dl, mean_bp_mmhg and spo2_pct are overwritten with the values posted"
          - "stabilization_score and stabilization_bundle_complete are recomputed"
      - trigger: depart
        from: [STABILIZING]
        to: EN_ROUTE
        preconditions:
          - "stabilization_bundle_complete == true"
          - "the referral behind the reservation is still ACCEPTED"
        side_effects: []
      - trigger: arrive
        from: [EN_ROUTE]
        to: ARRIVED
        side_effects:
          - "arrived_at recorded"
          - "isolette.decontamination_ready_at = arrived_at + decontamination_minutes"
      - trigger: abort
        from: [ACTIVATED, GROUND_ROLLING, AIR_LAUNCHED, ON_SCENE, STABILIZING, EN_ROUTE]
        to: ABORTED
        side_effects:
          - "abort_reason recorded"
          - "the reservation -> RELEASED (TRANSPORT_ABORTED) and its referral -> PENDING with decision_reason TRANSPORT_ABORTED"
          - "isolette.decontamination_ready_at = current_utc + decontamination_minutes"

  - entity: Admission
    field: care_status
    initial_state: ADMITTED
    terminal_states: [TRANSFERRED, DISCHARGED, DECEASED]
    shape_note: |
      Parallel dimensions: care_status and infection_status advance
      independently. Any care_status may coexist with any infection_status, and
      an infection transition never moves care_status (or vice versa).
    transitions:
      - trigger: care-update
        name: mark_stabilized
        from: [ADMITTED]
        to: STABILIZED
        preconditions:
          - "the posted support_modality IN {ROOM_AIR, CPAP}"
        side_effects:
          - "current_weight_grams, support_modality applied; patient_days/central_line_days/ventilator_days incremented; current_care_level re-derived"
      - trigger: back-transfer-ready
        from: [STABILIZED]
        to: BACK_TRANSFER_READY
        preconditions:
          - "developmental_bundle_score >= 60"
          - "support_modality IN {ROOM_AIR, CPAP}"
          - "infection_status != CONFIRMED_CLABSI"
          - "back_transfer_attestation_note is present"
        side_effects:
          - "back_transfer_attestation_note recorded"
      - trigger: capability_loss_requires_back_transfer
        from: [ADMITTED, STABILIZED]
        to: BACK_TRANSFER_REQUIRED
        internal: true
        note: "Fired by the capability cascade when current_care_level exceeds the unit's new effective_level."
        side_effects: []
      - trigger: back_transfer_completed
        from: [BACK_TRANSFER_READY, BACK_TRANSFER_REQUIRED]
        to: TRANSFERRED
        internal: true
        note: "Fired at the receiving community hospital's POST /admissions for a BACK_TRANSFER referral."
        side_effects:
          - "discharged_at = current_utc; discharge_disposition = BACK_TRANSFERRED"
          - "the source unit's bed counters and census_posture are re-derived and its deferral queue is promoted"
      - trigger: discharge
        name: discharge_home
        from: [STABILIZED, BACK_TRANSFER_READY]
        to: DISCHARGED
        preconditions:
          - "every MilkBatch for this admission is in status ADMINISTERED, DISCARDED or RECEIVED with remaining_ml == 0"
        side_effects:
          - "discharged_at = current_utc; discharge_disposition = HOME"
          - "high_risk_graduate is re-derived; the unit's counters and deferral queue are re-derived and promoted"
      - trigger: discharge
        name: record_death
        from: [ADMITTED, STABILIZED, BACK_TRANSFER_READY, BACK_TRANSFER_REQUIRED]
        to: DECEASED
        preconditions:
          - "disposition == DECEASED"
        side_effects:
          - "discharged_at = current_utc; discharge_disposition = DECEASED"
          - "all non-terminal MilkBatch rows -> DISCARDED with their remaining volume moved to discarded_ml"
          - "any ENROLLED or SCHEDULED FollowUpEnrollment -> LOST_TO_FOLLOWUP"
          - "the unit's counters and deferral queue are re-derived and promoted"

  - entity: Admission
    field: infection_status
    initial_state: SURVEILLANCE_CLEAR
    terminal_states: []
    shape_note: "Second parallel dimension; cyclic through SUSPECTED."
    transitions:
      - trigger: infection-event
        name: suspect
        from: [SURVEILLANCE_CLEAR, RESOLVED]
        to: SUSPECTED
        side_effects:
          - "every MilkBatch for this admission in status RECEIVED, VERIFIED or PARTIALLY_ADMINISTERED -> QUARANTINED with pre_quarantine_status preserved"
      - trigger: infection-event
        name: confirm_clabsi
        from: [SUSPECTED]
        to: CONFIRMED_CLABSI
        preconditions:
          - "central_line_days >= 1"
        side_effects:
          - "infection_confirmed_at = current_utc"
      - trigger: infection-event
        name: resolve
        from: [SUSPECTED, CONFIRMED_CLABSI]
        to: RESOLVED
        side_effects:
          - "every QUARANTINED MilkBatch is replayed back to pre_quarantine_status and pre_quarantine_status is cleared"

  - entity: SurveillanceReport
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    shape_note: "Cyclic: SUBMITTED -> REJECTED -> SUBMITTED, unbounded."
    transitions:
      - trigger: submit
        from: [DRAFT, REJECTED]
        to: SUBMITTED
        preconditions:
          - "data_completeness_flag == COMPLETE OR the caller passes acknowledge_incomplete true"
        side_effects:
          - "submitted_at = current_utc; every computed metric is recomputed against the current census"
      - trigger: accept
        from: [SUBMITTED]
        to: ACCEPTED
        preconditions:
          - "X-User-ID must differ from the submitting user"
        side_effects:
          - "unit.quality_flag = network_benchmark_flag"
      - trigger: reject
        from: [SUBMITTED]
        to: REJECTED
        side_effects:
          - "rejection_reason recorded"

  - entity: SurgeEscalation
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED, STOOD_DOWN]
    transitions:
      - trigger: authorize
        from: [REQUESTED]
        to: ACTIVE
        preconditions:
          - "census_ratio_at_request >= 0.80"
          - "authorized_beds >= 1"
          - "no other ACTIVE or REQUESTED-then-authorized escalation for this unit overlaps [effective_from, effective_to] inclusively"
        side_effects:
          - "authorized_by_user_id = X-User-ID"
          - "unit.escalation_bed_count, available_bed_count and census_posture are re-derived; the deferral queue is promoted"
      - trigger: deny
        from: [REQUESTED]
        to: DENIED
        side_effects:
          - "denial_reason recorded"
      - trigger: stand-down
        from: [ACTIVE]
        to: STOOD_DOWN
        side_effects:
          - "unit.escalation_bed_count is re-derived; available_bed_count may go negative and census_posture becomes CLOSED"
      - trigger: sweep_expiry
        from: [ACTIVE]
        to: EXPIRED
        internal: true
        note: "Fired by POST /ops/run-capacity-sweep when effective_to < current_utc."
        side_effects:
          - "unit.escalation_bed_count is re-derived"

  - entity: FollowUpEnrollment
    field: status
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, LOST_TO_FOLLOWUP]
    transitions:
      - trigger: schedule
        from: [ENROLLED]
        to: SCHEDULED
        preconditions:
          - "the requested instant falls inside [appointment_window_start, appointment_window_end] inclusively"
          - "the clinic's confirmed bookings on that calendar day are strictly below followup_clinic_daily_capacity"
        side_effects:
          - "confirmed_appointment_date recorded"
      - trigger: record-attendance
        from: [SCHEDULED]
        to: ATTENDED
        preconditions:
          - "attended == true"
        side_effects:
          - "attendance_recorded_at = current_utc"
      - trigger: record-attendance
        name: record_no_show
        from: [SCHEDULED]
        to: NO_SHOW
        preconditions:
          - "attended == false"
        side_effects:
          - "attendance_recorded_at = current_utc"
      - trigger: sweep_lapse
        from: [ENROLLED]
        to: LOST_TO_FOLLOWUP
        internal: true
        note: "Fired by POST /ops/run-capacity-sweep when appointment_window_end < current_utc and the enrollment was never scheduled."
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` ONLY
# =============================================================================
concurrency_rules:

  - name: referral_acceptance_consumes_a_bed
    parent_entity: NicuUnit
    occ_field: expected_unit_version
    write_endpoint: "POST /referrals/{referral_id}/accept"
    error_id: ERR_UNIT_VERSION_CONFLICT
    status: 412
    contested_resource: "NicuUnit.available_bed_count — the count of free staffed/escalation beds"
    rule: |
      Acceptance is only safe against the bed picture the caller actually read.
      The client sends expected_unit_version taken from its GET of the unit; if
      the stored version differs the write is rejected with 412 and no
      reservation is created. Serial observability: accept referral A against
      version 5 (succeeds, version becomes 6), then accept referral B still
      quoting version 5 — B is rejected even though a bed is free, because B's
      decision was made against a stale bed picture.
    version_bump_operations:
      - "POST /referrals/{referral_id}/accept"
      - "POST /referrals/{referral_id}/revoke-acceptance"
      - "POST /referrals/{referral_id}/withdraw (when it releases a HELD reservation)"
      - "POST /admissions (hold -> occupied, and the back-transfer cascade at the source unit)"
      - "POST /admissions/{admission_id}/discharge"
      - "POST /surge-escalations/{escalation_id}/authorize"
      - "POST /surge-escalations/{escalation_id}/stand-down"
      - "PATCH /nicu-units/{unit_id}"
      - "POST /designation-reviews/{review_id}/certify"
      - "POST /ops/run-capacity-sweep (once per unit it changes)"

  - name: unit_capacity_profile_update
    parent_entity: NicuUnit
    occ_field: expected_unit_version
    write_endpoint: "PATCH /nicu-units/{unit_id}"
    error_id: ERR_UNIT_VERSION_CONFLICT
    status: 412
    contested_resource: "NicuUnit.staffed_bed_target and followup_clinic_daily_capacity — the denominators every allocation decision divides by"
    rule: |
      Editing the staffed bed target changes the answer to every capacity
      question. The caller must quote the version it read; a stale
      expected_unit_version is rejected with 412 and no field is written.
      Serial observability: a director shrinks the target from 6 to 4 against
      version 3 (version becomes 4); a second edit still quoting version 3 is
      rejected rather than silently overwriting the shrink.

  - name: back_transfer_referral_creation
    parent_entity: Admission
    occ_field: expected_admission_version
    write_endpoint: "POST /admissions/{admission_id}/back-transfer-referrals"
    error_id: ERR_ADMISSION_VERSION_CONFLICT
    status: 412
    contested_resource: "Admission — the single infant whose onward disposition is being decided"
    rule: |
      A back-transfer referral encodes the infant's weight, support and
      readiness at the instant it is written. The caller must quote the
      admission version it read; if a care-update or an infection event has
      advanced the admission since, the write is rejected with 412 and no
      referral is created. Serial observability: create back-transfer referral
      one against version 4 (version becomes 5, and that first referral is
      SUPERSEDED by any later one); a second creation still quoting version 4
      is rejected.
    version_bump_operations:
      - "POST /admissions/{admission_id}/care-updates"
      - "POST /admissions/{admission_id}/developmental-rounds"
      - "POST /admissions/{admission_id}/infection-events"
      - "POST /admissions/{admission_id}/back-transfer-ready"
      - "POST /admissions/{admission_id}/back-transfer-referrals"
      - "POST /admissions/{admission_id}/discharge"
      - "POST /milk-batches/{batch_id}/administrations"
      - "POST /milk-batches/{batch_id}/administrations/reverse"

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: level_order
    algorithm_type: threshold
    formula: |
      LEVEL_I = 1, LEVEL_II = 2, LEVEL_III = 3, LEVEL_IV = 4. Every "at least"
      / min / max comparison between levels in this scaffold is a comparison of
      these ordinals. "One level below LEVEL_II" is LEVEL_I; there is nothing
      below LEVEL_I (a would-be demotion below LEVEL_I stays at LEVEL_I).

  - name: referral_required_level
    algorithm_type: threshold
    variants:
      current_support: "Level demanded by findings that already exist"
      anticipated_need: "Level demanded once gestational age, diagnoses and planned surgery are projected forward"
    inputs: [referral_kind, gestational_age_weeks, weight_basis_grams, support_modality, diagnoses, planned_surgery]
    formula: |
      weight_basis_grams = source admission's current_weight_grams when
        referral_kind == BACK_TRANSFER, else birth_weight_grams.

      weight_term(w)   = LEVEL_III when w < 1500; LEVEL_II when 1500 <= w < 1800; else LEVEL_I
      support_term(m)  = ROOM_AIR -> LEVEL_I; CPAP -> LEVEL_II;
                         CONVENTIONAL_VENT -> LEVEL_III; HFOV -> LEVEL_III;
                         INHALED_NO -> LEVEL_IV; ECMO_CONSULT -> LEVEL_IV
      ga_term(g)       = LEVEL_III when g < 32.0; LEVEL_II when 32.0 <= g < 35.0; else LEVEL_I
      dx_term          = RDS_SEVERE -> LEVEL_III; HIE_MODERATE -> LEVEL_IV;
                         CHD_DUCTAL -> LEVEL_IV; SURGICAL_NEC -> LEVEL_IV; PROM -> LEVEL_I

      VARIANT A — current_support_level =
        max( support_term(support_modality),
             weight_term(weight_basis_grams) but LEVEL_I when referral_kind == MATERNAL_ANTENATAL )
        (an unborn infant has no current weight-driven support need; the estimated
         fetal weight belongs to the anticipated variant only)

      VARIANT B — anticipated_need_level =
        max( current_support_level,
             weight_term(weight_basis_grams),
             ga_term(gestational_age_weeks) ONLY WHEN referral_kind != BACK_TRANSFER,
             dx_term for every code in diagnoses,
             LEVEL_IV when planned_surgery )
        (a back-transfer is judged on how the infant is now, never on how
         premature it was born — otherwise no ex-preemie could ever go home to a
         community hospital)

      required_level = anticipated_need_level
      level_basis    = ANTICIPATED_NEED when anticipated_need_level order >
                       current_support_level order, else CURRENT_SUPPORT
      maternal_transfer_preferred = referral_kind == MATERNAL_ANTENATAL
                                    and required_level order >= 3
    worked_examples:
      - "INBOUND_NEONATAL, GA 35.0, BW 2400, CPAP, planned_surgery true -> current LEVEL_II, anticipated LEVEL_IV, basis ANTICIPATED_NEED"
      - "INBOUND_NEONATAL, GA 29.0, BW 1200, ROOM_AIR -> current LEVEL_III, anticipated LEVEL_III, basis CURRENT_SUPPORT"
      - "MATERNAL_ANTENATAL, GA 30.0, EFW 1300, ROOM_AIR -> current LEVEL_I, anticipated LEVEL_III, basis ANTICIPATED_NEED, maternal_transfer_preferred true"
      - "BACK_TRANSFER, GA 29.0, current weight 1900, ROOM_AIR -> LEVEL_I (ga_term suppressed)"
      - "MATERNAL_ANTENATAL, GA 33.0, EFW 2000, ROOM_AIR -> LEVEL_II, maternal_transfer_preferred false (level below III)"

  - name: triage_priority
    algorithm_type: weighted_scoring
    inputs: [required_level, gestational_age_weeks, weight_basis_grams, referral_kind]
    formula: |
      level_pts       = 25 | 50 | 75 | 100 for LEVEL_I | LEVEL_II | LEVEL_III | LEVEL_IV
      prematurity_pts = 100 when GA < 28.0; 75 when 28.0 <= GA < 32.0;
                        50 when 32.0 <= GA < 35.0; 25 otherwise
      weight_pts      = 100 when w < 1000; 75 when 1000 <= w < 1500;
                        50 when 1500 <= w < 1800; 25 otherwise   (w = weight_basis_grams)
      kind_pts        = 100 MATERNAL_ANTENATAL | 50 INBOUND_NEONATAL | 0 BACK_TRANSFER
      triage_priority = round(0.40*level_pts + 0.25*prematurity_pts
                              + 0.20*weight_pts + 0.15*kind_pts, 2)
    precision: "2 decimal places, half-up"
    worked_examples:
      - "MATERNAL_ANTENATAL / LEVEL_III / GA 30.0 / 1300 g -> 78.75"
      - "INBOUND_NEONATAL / LEVEL_III / GA 29.0 / 1200 g -> 71.25"
      - "INBOUND_NEONATAL / LEVEL_III / GA 30.0 / 1250 g -> 71.25 (deliberate tie with the line above)"
      - "INBOUND_NEONATAL / LEVEL_III / GA 31.0 / 1600 g -> 66.25"
      - "INBOUND_NEONATAL / LEVEL_IV / GA 26.0 / 850 g -> 92.50"
      - "BACK_TRANSFER / LEVEL_I / GA 29.0 / 1900 g -> 33.75"

  - name: unit_capability_and_effective_level
    algorithm_type: constraint_propagation
    inputs: [StaffCredential, EquipmentAsset, DesignationStandard, NicuUnit.designated_level]
    formula: |
      A unit SATISFIES a DesignationStandard when
        every code in required_credential_codes is held by a StaffCredential of
          that unit whose derived status == VALID and fte >= 0.5, AND
        every code in required_equipment_codes is held by an EquipmentAsset of
          that unit whose derived status == IN_SERVICE.
      capability_level = the highest-ordinal level among declared
        DesignationStandard rows that the unit satisfies; LEVEL_I when it
        satisfies none (statutory newborn-nursery baseline — a unit is never
        below LEVEL_I).
      effective_level  = the lower ordinal of designated_level and capability_level.
      staffing_compliant  = the credential half of SATISFIES for the standard of designated_level
      equipment_compliant = the equipment half of SATISFIES for the standard of designated_level
      Re-derived on every read and before every acceptance decision. A change in
      credential/equipment status therefore propagates to effective_level
      without any explicit write to the unit.

  - name: required_nurse_count
    algorithm_type: aggregation
    inputs: [Admission.current_care_level, DesignationStandard.nurse_patient_ratio_denominator, active surge waiver]
    formula: |
      census_band(level) = count of this unit's Admission rows with care_status
        IN {ADMITTED, STABILIZED, BACK_TRANSFER_READY, BACK_TRANSFER_REQUIRED}
        and current_care_level == level
      waiver = the largest staffing_waiver_ratio among this unit's ACTIVE
        SurgeEscalation rows, else 1.00
      required_nurse_count =
        SUM over levels of  ceil( census_band(level) / (nurse_patient_ratio_denominator(level) * waiver) )
      PINNED: the ceiling is taken PER ACUITY BAND and only then summed. Summing
      the fractional requirements first and ceiling once is WRONG — a single
      LEVEL_III infant and a single LEVEL_I infant cannot share a nurse.
    precision: "integer; ceiling per band"
    worked_examples:
      - "census {LEVEL_III: 1, LEVEL_II: 1, LEVEL_I: 1}, waiver 1.00 -> ceil(1/2)+ceil(1/3)+ceil(1/4) = 1+1+1 = 3 (sum-then-ceil would give 2)"
      - "census {LEVEL_III: 3, LEVEL_II: 2, LEVEL_I: 1}, waiver 1.00 -> 2+1+1 = 4 (sum-then-ceil would give 3)"
      - "census {LEVEL_III: 1, LEVEL_II: 1, LEVEL_I: 1}, waiver 1.50 -> ceil(1/3)+ceil(1/4.5)+ceil(1/6) = 3 (sum-then-ceil would give 1)"
      - "empty census -> 0"

  - name: designation_compliance_score
    algorithm_type: weighted_scoring
    inputs: [DesignationReview.assigned_nurse_count, StaffCredential, EquipmentAsset, NicuUnit, DesignationStandard]
    formula: |
      standard = the DesignationStandard for the review's requested_level

      credential_coverage = (# of standard.required_credential_codes held VALID
                             with fte >= 0.5) / len(required_credential_codes)
                            ... = 1.0 when the list is empty (LEVEL_I has no requirements)
      ratio_ok_factor     = 1.0 when required_nurse_count == 0
                            else min(1.0, assigned_nurse_count / required_nurse_count)
      staffing_subscore   = round(100 * credential_coverage * ratio_ok_factor, 2)

      equipment_subscore  = round(100 * (# of standard.required_equipment_codes held
                            IN_SERVICE) / len(required_equipment_codes), 2)
                            ... = 100.00 when the list is empty

      effective_min_volume = standard.min_annual_volume for hospital_type
                             REGIONAL_CENTER; half of it for COMMUNITY
      volume_subscore      = round(100 * min(1.0, annual_admission_volume
                                             / effective_min_volume), 2)

      compliance_score = round(0.45*staffing_subscore + 0.35*equipment_subscore
                               + 0.20*volume_subscore, 2)
      THEN, when standard.transport_capability_required and not unit.transport_capable,
        compliance_score = min(compliance_score, 69.99)
        (a level that owes the region a transport team can never be fully
         designated without one; the cap deliberately sits just below every
         conditional_floor_score of 70.00)
    precision: "2 decimal places, half-up, on each subscore and again on the total"
    worked_examples:
      - "coverage 3/4, empty census, equipment 3/3, volume 400 of 500 REGIONAL -> 75.00 / 100.00 / 80.00 / 84.75"
      - "coverage 4/4, equipment 3/3, volume 400 of 500 -> 100.00 / 100.00 / 80.00 / 96.00"
      - "coverage 4/4, census {LEVEL_III: 1} with assigned_nurse_count 1, volume 500 of 500 -> 100.00 / 100.00 / 100.00 / 100.00"
      - "coverage 4/4 but assigned_nurse_count 0 against required 1 -> 0.00 / 100.00 / 100.00 / 55.00"
      - "COMMUNITY unit, volume 300 against min 500 -> volume_subscore 100.00 (half rule)"
      - "everything perfect but transport required and transport_capable false -> 69.99"
      - "equipment 2/3 -> 100.00 / 66.67 / 80.00 / 84.33"

  - name: designation_outcome
    algorithm_type: threshold
    inputs: [DesignationReview.compliance_score, DesignationStandard.min_compliance_score, DesignationStandard.conditional_floor_score]
    formula: |
      score >= min_compliance_score      -> CERTIFIED at requested_level, unit DESIGNATED
      conditional_floor_score <= score
        < min_compliance_score           -> CERTIFIED one level below requested_level, unit CONDITIONAL
      score < conditional_floor_score    -> DENIED (certify from SUBMITTED), verify is refused
    worked_examples:
      - "LEVEL_III requested (min 85.00, floor 70.00), score 96.00 -> DESIGNATED at LEVEL_III"
      - "LEVEL_III requested, score 84.75 -> CONDITIONAL at LEVEL_II"
      - "LEVEL_III requested, score 55.00 -> DENIED, denial_basis SCORE_BELOW_FLOOR"
      - "LEVEL_III requested, score 69.99 (transport cap) -> DENIED, denial_basis SCORE_BELOW_FLOOR"

  - name: bed_ledger
    algorithm_type: waterfall_allocation
    inputs: [NicuUnit.staffed_bed_target, SurgeEscalation.authorized_beds, Admission, BedReservation]
    formula: |
      escalation_bed_count = sum of authorized_beds over ACTIVE SurgeEscalation rows
      occupied_bed_count   = count of Admission rows with care_status IN
                             {ADMITTED, STABILIZED, BACK_TRANSFER_READY, BACK_TRANSFER_REQUIRED}
      held_bed_count       = count of BedReservation rows with status HELD
      available_bed_count  = staffed_bed_target + escalation_bed_count
                             - occupied_bed_count - held_bed_count

      CONSERVED QUANTITY (must hold after every operation):
        staffed_bed_target + escalation_bed_count
          == occupied_bed_count + held_bed_count + available_bed_count

      WATERFALL: a new hold takes bed_class STAFFED while
        occupied_bed_count + held_bed_count (pre-state) < staffed_bed_target,
        otherwise ESCALATION. Base staffed beds always fill before escalation beds.
      available_bed_count is NEVER clamped at zero: standing an escalation down
      while its beds are occupied leaves it negative, and the negative value is
      what CLOSED posture and the "no new holds" rule read.
    worked_examples:
      - "target 4, no census -> accept -> held 1, available 3, reservation bed_class STAFFED"
      - "target 4, then revoke-acceptance -> held 0, available 4, reservation RELEASED (REVOKED)"
      - "target 2 fully occupied, escalation of 2 ACTIVE, a third hold -> bed_class ESCALATION"
      - "target 4, 2 occupied, escalation of 2 ACTIVE and 4 occupied, then stand-down -> available -2, posture CLOSED"

  - name: census_posture
    algorithm_type: threshold
    inputs: [NicuUnit.available_bed_count, NicuUnit.staffed_bed_target]
    formula: |
      available_bed_count <= 0                            -> CLOSED
      available_bed_count <= floor(staffed_bed_target * 0.20) -> CONSTRAINED
      otherwise                                            -> OPEN
      (evaluated top to bottom; the CONSTRAINED band uses <=, so a target of 5
       with exactly 1 free bed is CONSTRAINED and with 2 free beds is OPEN)
    worked_examples:
      - "target 5, available 1 -> CONSTRAINED (floor(1.0) = 1)"
      - "target 5, available 2 -> OPEN"
      - "target 5, available 0 -> CLOSED"
      - "target 4, available 1 -> OPEN (floor(0.8) = 0, so the CONSTRAINED band is empty)"

  - name: capacity_projection
    algorithm_type: forward_looking
    variants:
      committed: "Beds free right now"
      forecast: "Beds free once beds that are about to free themselves are counted"
    inputs: [NicuUnit, Admission.care_status, BedReservation.expires_at, current_utc]
    formula: |
      committed_available   = available_bed_count (see bed_ledger)
      back_transfer_ready_count = count of Admission rows with care_status
                                  BACK_TRANSFER_READY
      expiring_hold_count   = count of HELD BedReservation rows with
                              expires_at <= current_utc + 60 minutes
      forecast_available    = committed_available + back_transfer_ready_count
                              + expiring_hold_count
      VARIANT SELECTION: every gate that creates an obligation (accept, promote,
      escalation authorization) reads committed_available. Only the advisory
      GET /nicu-units/{unit_id}/capacity-projection publishes
      forecast_available. A forecast bed is never accepted against.
    worked_examples:
      - "target 4, 2 admissions (one ADMITTED, one BACK_TRANSFER_READY), 2 HELD reservations of which 1 expires within 60 minutes -> committed 0, forecast 2"

  - name: deferral_promotion_order
    algorithm_type: chronological
    inputs: [Referral.status, Referral.triage_priority, Referral.maternal_transfer_preferred, Referral.created_at]
    formula: |
      CANDIDATE POOL: Referral rows with status == DEFERRED,
        receiving_unit_id == the unit, and required_level order <= the unit's
        current effective_level order. Referrals needing more than the unit can
        deliver are skipped, never promoted and never errored.
      RANKING (pinned, total): triage_priority DESC, then
        maternal_transfer_preferred DESC (true first), then created_at ASC.
        `id` is never consulted.
      LOOP: while committed_available >= 1 and the pool is non-empty, promote the
        top-ranked candidate (creating a HELD reservation), re-derive the ledger,
        and continue. An empty pool promotes nothing and is not an error.
      TRIGGERED BY exactly: POST /ops/run-capacity-sweep,
        POST /admissions (at the back-transfer source unit),
        POST /admissions/{id}/discharge,
        POST /surge-escalations/{id}/authorize.
      DELIBERATELY NOT TRIGGERED BY: POST /transport-runs/{id}/abort or
        POST /referrals/{id}/revoke-acceptance — an aborted or revoked case
        returns to the queue itself and must not be leapfrogged in the same call
        that frees its own bed.
    worked_examples:
      - "pool priorities 78.75 / 71.25 / 71.25 / 66.25 with one free bed -> the 78.75 referral is promoted, the rest stay DEFERRED"
      - "two DEFERRED referrals tied at 71.25, both non-maternal -> the one created first is promoted"

  - name: maternal_transfer_preference
    algorithm_type: threshold
    inputs: [NicuUnit.available_bed_count, Referral]
    formula: |
      When an acceptance would consume the LAST free bed
      (pre-state available_bed_count == 1) and the referral being accepted is
      NOT MATERNAL_ANTENATAL, the unit must first look for a blocked maternal
      transfer: any Referral at the same receiving unit with status IN
      {PENDING, DEFERRED}, referral_kind == MATERNAL_ANTENATAL, required_level
      order <= the unit's effective_level order, and triage_priority STRICTLY
      GREATER than the incoming referral's. If one exists the acceptance is
      refused with ERR_MATERNAL_TRANSFER_PREFERENCE.
      In utero transport is safer than postnatal transport, so the last bed is
      reserved for the mother who can still be moved.
      Equal priority does NOT block (strictly greater only), and the rule does
      not apply at 2 or more free beds.
    worked_examples:
      - "available 1, incoming INBOUND at 66.25, waiting MATERNAL at 78.75 -> refused"
      - "available 2, same pair -> accepted"
      - "available 1, incoming MATERNAL at 66.25, waiting MATERNAL at 78.75 -> accepted (rule only guards non-maternal acceptances)"

  - name: hold_expiry_window
    algorithm_type: threshold
    inputs: [BedReservation.held_at, Referral.referral_kind]
    formula: |
      expires_at = held_at + 720 minutes when the referral is MATERNAL_ANTENATAL,
                   held_at + 240 minutes otherwise.
      A hold with expires_at <= current_utc is expired, but nothing changes until
      POST /ops/run-capacity-sweep runs and moves it to EXPIRED. Expiry is
      exclusive of the boundary: at exactly expires_at the hold IS expired
      (<=), one second earlier it is not.

  - name: isolette_occupation_interval
    algorithm_type: interval_merge
    inputs: [TransportRun.depart_at, TransportRun.planned_return_at, TransportRun.mode]
    formula: |
      decontamination_minutes = 45 for GROUND, 90 for ROTOR_WING and FIXED_WING
      occupation interval = [ depart_at , planned_return_at + decontamination_minutes )
        — HALF-OPEN: a new run may depart at exactly the instant the previous
        interval ends, because the isolette is clean at that instant.
      Two runs conflict when their occupation intervals overlap. Runs in status
      ABORTED or ARRIVED release the isolette (an ARRIVED run's real interval
      ends at arrived_at + decontamination_minutes).
    worked_examples:
      - "GROUND run 2026-08-02T08:00:00Z -> 12:00:00Z occupies through 12:45:00Z; a new run departing 12:30:00Z conflicts"
      - "the same pair with the new run departing exactly 12:45:00Z is allowed"
      - "ROTOR_WING run 2026-08-02T08:00:00Z -> 12:00:00Z occupies through 13:30:00Z; a new run departing 13:00:00Z conflicts"

  - name: stabilization_score
    algorithm_type: threshold
    inputs: [TransportRun.temp_c, glucose_mg_dl, mean_bp_mmhg, spo2_pct, referral.gestational_age_weeks]
    formula: |
      Start at 100 and subtract 8 for each failed target:
        temp_c within [36.5, 37.5] inclusive
        glucose_mg_dl >= 45
        mean_bp_mmhg >= gestational_age_weeks (the mean-BP-equals-gestation rule)
        spo2_pct within [90, 95] inclusive (an upper bound too — hyperoxia harms)
      stabilization_bundle_complete = stabilization_score >= 85, so at most ONE
      failed target may be carried into transport.
    worked_examples:
      - "GA 30.0 with 36.5 / 45 / 30 / 90 (every value exactly on its boundary) -> 100, complete"
      - "GA 30.0 with 36.4 / 44 / 26 / 89 -> 68, incomplete"
      - "GA 30.0 with 36.8 / 60 / 28 / 92 -> 92, complete (only mean BP fails)"
      - "GA 30.0 with 37.6 / 60 / 31 / 96 -> 84, incomplete (temperature and saturation both overshoot)"

  - name: developmental_bundle_score
    algorithm_type: weighted_scoring
    inputs: [Admission developmental-round aggregates]
    formula: |
      n = developmental_round_count; the score is 0.00 when n == 0.
      kangaroo_pts = min(1.0, kangaroo_care_sessions / 3) * 100
                     (a session counts only at kangaroo_care_minutes >= 60)
      family_pts   = min(1.0, family_presence_minutes / 720) * 100
      cluster_pts  = cluster_care_compliant_count / n * 100
      light_pts    = light_cycling_compliant_count / n * 100
      developmental_bundle_score = round(0.35*kangaroo_pts + 0.25*family_pts
                                         + 0.20*cluster_pts + 0.20*light_pts, 2)
      Back-transfer readiness requires >= 60.00.
    precision: "2 decimal places, half-up"
    worked_examples:
      - "2 rounds of (kangaroo 60, family 240, cluster true, light false) -> 60.00 exactly — readiness passes on the boundary"
      - "the same 2 rounds with light_cycling true -> 80.00"
      - "1 round of (60, 240, true, false) -> 40.00 — readiness refused"
      - "1 round of (0, 120, true, false) -> 24.17"
      - "3 rounds (60,240,T,F), (60,240,T,F), (60,240,T,T) -> 86.67"

  - name: surge_escalation_authorization
    algorithm_type: tiered_pricing
    inputs: [NicuUnit, StaffCredential fte, SurgeEscalation.requested_beds]
    constants:
      BEDS_PER_RN_FTE: 2
      TIER_1_RATIO: 0.80
      TIER_2_RATIO: 0.90
      TIER_3_RATIO: 1.00
      TIER_1_WAIVER: 1.10
      TIER_2_WAIVER: 1.25
      TIER_3_WAIVER: 1.50
      TIER_1_BED_CAP: 2
      TIER_2_BED_CAP: 4
      TIER_3_BED_CAP: 6
    formula: |
      census_ratio_at_request = round( occupied_bed_count /
        (staffed_bed_target + authorized_beds of OTHER ACTIVE escalations), 4 )
        — HELD beds do NOT count toward the surge trigger; a hold is a promise,
        not a patient.
      ratio >= 1.00 -> TIER_3 (waiver 1.50, cap 6)
      ratio >= 0.90 -> TIER_2 (waiver 1.25, cap 4)
      ratio >= 0.80 -> TIER_1 (waiver 1.10, cap 2)
      ratio  < 0.80 -> authorization refused (ERR_SURGE_THRESHOLD_NOT_MET)

      nurse_fte = sum of fte over this unit's StaffCredential rows with
                  credential_code RN_NICU_CORE and derived status VALID
      capacity_from_staff = floor(nurse_fte * staffing_waiver_ratio * BEDS_PER_RN_FTE)
      authorized_beds = max(0, min( requested_beds,
                                    capacity_from_staff - (occupied_bed_count + held_bed_count),
                                    tier bed cap ))
      authorized_beds == 0 refuses the authorization (ERR_SURGE_NO_STAFFED_CAPACITY).
    worked_examples:
      - "target 4, occupied 4, RN fte 3.0, requested 6 -> ratio 1.0000, TIER_3, waiver 1.50, capacity_from_staff 9, authorized 5"
      - "target 10, occupied 8, RN fte 6.0, requested 4 -> ratio 0.8000 exactly, TIER_1, capacity_from_staff 13, authorized 2 (the tier cap binds, not the request)"
      - "target 10, occupied 7 -> ratio 0.7000 -> refused"
      - "target 4, occupied 3, 1 HELD -> ratio 0.7500 -> refused (holds excluded)"
      - "target 4, occupied 4, RN fte 1.0, requested 2 -> capacity_from_staff 3, authorized 0 -> refused"

  - name: milk_volume_ledger
    algorithm_type: aggregation
    inputs: [MilkBatch.volume_ml, administrations, discards]
    formula: |
      administered_ml = sum of administered volumes minus reversed volumes
      discarded_ml    = sum of discarded volumes
      remaining_ml    = round(volume_ml - administered_ml - discarded_ml, 1)
      CONSERVED QUANTITY: volume_ml == administered_ml + discarded_ml + remaining_ml
      after every operation, including after a reversal.
      status = DISCARDED when discarded_ml > 0 and remaining_ml == 0;
               ADMINISTERED when remaining_ml == 0 and administered_ml > 0;
               PARTIALLY_ADMINISTERED when 0 < administered_ml and remaining_ml > 0;
               otherwise the last stored status (RECEIVED / VERIFIED / QUARANTINED).
      A reversal that returns administered_ml to 0 restores status VERIFIED — the
      compensation leaves no drift.
      Admission.milk_administered_ml = sum of administered_ml over the
      admission's batches, recomputed after every administration and reversal.
    precision: "1 decimal place"
    worked_examples:
      - "batch 120.0 ml, administer 40.0 -> administered 40.0, remaining 80.0, PARTIALLY_ADMINISTERED, admission total 40.0"
      - "then reverse 40.0 -> administered 0.0, remaining 120.0, VERIFIED, admission total 0.0"
      - "then discard -> discarded 120.0, remaining 0.0, DISCARDED"

  - name: milk_expiry
    algorithm_type: threshold
    inputs: [MilkBatch.expressed_at, donor_type, current_utc]
    formula: |
      expires_at = expressed_at + 96 hours for MOTHERS_OWN,
                   expressed_at + 24 hours for DONOR_PASTEURIZED.
      An administration is refused when expires_at <= current_utc. At exactly
      expires_at the batch is expired.

  - name: clabsi_surveillance_rates
    algorithm_type: aggregation
    variants:
      crude: "Infections per 1000 patient-days — no risk adjustment"
      device_adjusted: "Risk-weighted infections per 1000 central-line-days"
    inputs: [SurveillanceReport period, Admission.infection_confirmed_at, Admission.birth_weight_grams]
    constants:
      NETWORK_BENCHMARK_RATE: 1.50
    formula: |
      cohort = this unit's Admission rows with created_at inside
               [period_start, period_end] inclusive
      clabsi_count = cohort-independent: this unit's Admission rows with
               infection_confirmed_at inside [period_start, period_end] inclusive
      bw_band_weight(w) = 1.30 when w < 1000; 1.15 when 1000 <= w < 1500;
                          1.00 when 1500 <= w < 2500; 0.85 when w >= 2500
      birth_weight_risk_weight = round(mean of bw_band_weight over the cohort, 4)
                                 ... = 1.0000 for an empty cohort

      VARIANT A  crude_clabsi_rate =
        round(clabsi_count * 1000 / reported_patient_days, 2), 0.00 when the
        denominator is 0
      VARIANT B  device_adjusted_clabsi_rate =
        round(clabsi_count * birth_weight_risk_weight * 1000
              / reported_central_line_days, 2), 0.00 when the denominator is 0

      variant_applied        = DEVICE_ADJUSTED when reported_central_line_days > 0, else CRUDE
      data_completeness_flag = COMPLETE when reported_patient_days > 0 AND
                               reported_central_line_days > 0, else DENOMINATOR_MISSING
      network_benchmark_flag = ABOVE_BENCHMARK when the rate of variant_applied
                               > NETWORK_BENCHMARK_RATE, else WITHIN_BENCHMARK
    precision: "2 decimal places for rates, 4 for the risk weight"
    worked_examples:
      - "1 infection, 500 patient-days, 120 line-days, cohort birth weights 900 and 2000 -> risk weight 1.1500, crude 2.00, device-adjusted 9.58, variant DEVICE_ADJUSTED, COMPLETE, ABOVE_BENCHMARK"
      - "the same data with 0 line-days -> device-adjusted 0.00, variant CRUDE, DENOMINATOR_MISSING, and still ABOVE_BENCHMARK because crude 2.00 > 1.50"
      - "0 infections, 500 patient-days, 120 line-days -> crude 0.00, device-adjusted 0.00, WITHIN_BENCHMARK"
      - "2 infections, 400 patient-days, 200 line-days, cohort birth weight 850 -> risk weight 1.3000, crude 5.00, device-adjusted 13.00"

  - name: followup_eligibility
    algorithm_type: threshold
    inputs: [Admission, referral.diagnoses, Admission.ventilator_days]
    formula: |
      eligibility_basis is the FIRST match in this pinned order:
        1. BW_UNDER_1500  birth_weight_grams < 1500
        2. GA_UNDER_32    gestational_age_weeks < 32.0
        3. HIE_COOLED     the referral's diagnoses contain HIE_MODERATE
        4. SURGICAL_NEC   the referral's diagnoses contain SURGICAL_NEC
        5. VENT_OVER_7D   ventilator_days > 7
        else NOT_ELIGIBLE
      high_risk_graduate = eligibility_basis != NOT_ELIGIBLE
      risk_tier = HIGH when birth_weight_grams < 1000 or
                  eligibility_basis == HIE_COOLED, else MODERATE
      Order matters: a 1400 g infant who was also cooled reports
      BW_UNDER_1500, so its risk_tier is MODERATE unless it is also under 1000 g.
    worked_examples:
      - "birth weight 1400, GA 30.0, diagnoses [HIE_MODERATE] -> basis BW_UNDER_1500, risk_tier MODERATE"
      - "birth weight 850 -> basis BW_UNDER_1500, risk_tier HIGH"
      - "birth weight 2400, GA 36.0, diagnoses [HIE_MODERATE] -> basis HIE_COOLED, risk_tier HIGH"
      - "birth weight 2400, GA 36.0, no diagnoses, ventilator_days 8 -> basis VENT_OVER_7D, risk_tier MODERATE"
      - "birth weight 2400, GA 36.0, no diagnoses, ventilator_days 7 -> NOT_ELIGIBLE, high_risk_graduate false"

  - name: followup_clinic_day_capacity
    algorithm_type: aggregation
    inputs: [FollowUpEnrollment.confirmed_appointment_date, NicuUnit.followup_clinic_daily_capacity]
    formula: |
      appointment_window_start = admission.discharged_at + 14 days (inclusive)
      appointment_window_end   = admission.discharged_at + 90 days (inclusive)
      day_bucket(instant) = the UTC calendar date of the instant
      booked(clinic, date) = count of FollowUpEnrollment rows for that clinic with
        status SCHEDULED or ATTENDED whose confirmed_appointment_date falls in
        that calendar day
      A schedule is allowed only when
        booked(clinic, day_bucket(requested)) < followup_clinic_daily_capacity.
      The limit is an AGGREGATE per calendar day, not per hour: two appointments
      at 09:00 and 17:00 on the same date consume the same day's capacity even
      though they do not overlap in time.

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending priority, first failure returned
# =============================================================================
validations:

  - priority: 1
    category: authentication
    rule: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    status: 401

  - priority: 2
    category: authorization
    rule: "X-User-Role must be one of the roles listed on the endpoint"
    error_id: ERR_ROLE_NOT_PERMITTED
    status: 403

  - priority: 3
    category: existence
    rule: "Every id appearing in the URL path must resolve to a stored row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    status: 404

  - priority: 4
    category: authorization
    rule: |
      For a unit-scoped role (UnitDirector, IntakeNeonatologist,
      ReferringClinician) the unit parsed from X-User-ID must equal the unit the
      operation acts on: the path unit for unit endpoints, receiving_unit_id for
      intake actions, referring_unit_id for referral creation/withdrawal, and
      Admission.unit_id for bedside/intake actions on an admission.
    error_id: ERR_UNIT_SCOPE_VIOLATION
    status: 403

  - priority: 5
    category: business_constraint
    rule: |
      Request schema: required fields present, types correct, enums in range,
      numbers within their declared bounds, period_end > period_start,
      planned_return_at > depart_at, effective_to > effective_from,
      pagination limit within 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    status: 400

  - priority: 6
    category: existence
    rule: "Every id supplied in the request BODY must resolve (unit_id, referral_id, admission_id, isolette_asset_id, clinic_unit_id, reservation_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    status: 404

  - priority: 7
    category: state
    rule: |
      When the endpoint declares an OCC field (expected_unit_version,
      expected_admission_version) the supplied value must equal the parent's
      stored version. Checked before any state or business rule so that a caller
      working from a stale read is told to re-read rather than being told its
      stale decision is illegal.
    error_id: "ERR_UNIT_VERSION_CONFLICT | ERR_ADMISSION_VERSION_CONFLICT"
    status: 412

  - priority: 8
    category: state
    rule: "The entity's own status must permit the trigger (per §1.2). Includes terminal-state lockdown and repeat-trigger rejection."
    error_id: ERR_INVALID_STATE
    status: 409

  - priority: 9
    category: state
    rule: |
      Cross-entity state preconditions on a DIFFERENT entity than the one being
      written: revoke-acceptance requires no in-flight TransportRun; depart
      requires the referral still ACCEPTED; back-transfer referral creation
      requires the source admission BACK_TRANSFER_READY or
      BACK_TRANSFER_REQUIRED; follow-up enrollment requires the admission
      DISCHARGED or TRANSFERRED; a milk administration requires the admission
      not DISCHARGED/DECEASED.
    error_id: ERR_DEPENDENT_STATE_INVALID
    status: 409

  - priority: 10
    category: business_safety
    rule: "The receiving unit's effective_level must be at or above the referral's required_level"
    error_id: ERR_LEVEL_CAPABILITY_INSUFFICIENT
    status: 422

  - priority: 11
    category: business_safety
    rule: |
      Clinical safety gates, each with its own code: transport crew must include
      TRANSPORT_RN; the isolette must be IN_SERVICE; air modes require
      weather_minimums_met; departure requires stabilization_bundle_complete;
      back-transfer readiness requires developmental_bundle_score >= 60; a milk
      administration requires a VERIFIED (or PARTIALLY_ADMINISTERED) unexpired
      batch; a suspended unit may not accept referrals.
    error_id: "ERR_CREW_COMPOSITION_INVALID | ERR_ISOLETTE_NOT_SERVICEABLE | ERR_WEATHER_MINIMUMS_NOT_MET | ERR_STABILIZATION_INCOMPLETE | ERR_DEVELOPMENTAL_BUNDLE_INCOMPLETE | ERR_MILK_NOT_ADMINISTRABLE | ERR_MILK_EXPIRED | ERR_UNIT_SUSPENDED"
    status: 422

  - priority: 12
    category: business_referential
    rule: |
      Referential coherence between entities that both already exist: the
      isolette must belong to the run's receiving unit; the milk batch's label
      must match its admission; a follow-up enrollment's clinic must be the
      admission's unit or a COMMUNITY unit in the network; the maternal-transfer
      preference (see calculations.maternal_transfer_preference); a second
      back-transfer referral supersedes rather than duplicates.
    error_id: "ERR_ISOLETTE_UNIT_MISMATCH | ERR_MILK_LABEL_MISMATCH | ERR_MATERNAL_TRANSFER_PREFERENCE | ERR_DUPLICATE_ENROLLMENT"
    status: 409

  - priority: 13
    category: business_temporal
    rule: |
      Interval and window rules: the isolette occupation interval must not
      overlap another run's (half-open, including the decontamination buffer);
      SurgeEscalation windows for a unit must not overlap inclusively; a
      follow-up appointment must fall inside [discharge+14d, discharge+90d]; a
      surveillance period must not start before the unit was created.
    error_id: "ERR_ISOLETTE_UNAVAILABLE | ERR_ESCALATION_WINDOW_OVERLAP | ERR_APPOINTMENT_OUTSIDE_WINDOW | ERR_PERIOD_INVALID"
    status: 409

  - priority: 14
    category: business_constraint
    rule: |
      Uniqueness and segregation of duties: one DesignationStandard per level;
      one open DesignationReview per unit; one active FollowUpEnrollment per
      admission; a review's certifier must differ from its verifier; a milk
      batch's verifier must differ from its receiver; a surveillance report's
      accepter must differ from its submitter.
    error_id: "ERR_DUPLICATE_STANDARD | ERR_REVIEW_ALREADY_OPEN | ERR_SEGREGATION_OF_DUTIES"
    status: 409

  - priority: 15
    category: business_fiscal
    rule: |
      Capacity and quota rules, evaluated last because they depend on every
      derived quantity above: available_bed_count >= 1 to accept;
      census_ratio_at_request >= 0.80 and authorized_beds >= 1 to authorize an
      escalation; the follow-up clinic's calendar-day bookings must be below
      followup_clinic_daily_capacity; a milk administration must not exceed
      remaining_ml; a reversal must not exceed administered_ml.
    error_id: "ERR_NO_BED_AVAILABLE | ERR_SURGE_THRESHOLD_NOT_MET | ERR_SURGE_NO_STAFFED_CAPACITY | ERR_CLINIC_DAY_FULL | ERR_MILK_VOLUME_EXCEEDED"
    status: "409 | 422"

# =============================================================================
# §1.5 API Endpoints
# =============================================================================
endpoints:

  # --- test-driving / operational ------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: |
      Sets the logical clock. Last-resort test-driving endpoint (§1.5 priority 3):
      credential expiry, equipment service due dates, hold expiry, milk expiry
      and follow-up windows are all clock-driven and are otherwise unreachable
      inside a test.
    input: [current_utc]
    output: "{ current_utc: datetime }"
    roles: [NetworkAdmin]
    default: "The clock starts at 2026-08-01T00:00:00Z; every timestamp the server stamps is read from it."

  - method: POST
    path: /ops/run-capacity-sweep
    purpose: |
      Applies every time-driven consequence exactly once: expires HELD
      reservations past expires_at (referral -> DIVERTED / HOLD_EXPIRED),
      expires ACTIVE SurgeEscalation rows past effective_to, lapses ENROLLED
      FollowUpEnrollment rows past their window, then runs the deferral-queue
      promotion for every affected unit. Composed from state it can already see;
      no new business concept.
    input: ["unit_id?"]
    output: "{ holds_expired: integer, escalations_expired: integer, enrollments_lapsed: integer, referrals_promoted: integer, units_touched: integer }"
    roles: [NetworkAdmin]
    side_effects:
      - "reservation -> EXPIRED, referral -> DIVERTED (HOLD_EXPIRED)"
      - "escalation -> EXPIRED, unit.escalation_bed_count re-derived"
      - "enrollment -> LOST_TO_FOLLOWUP"
      - "deferral promotion per calculations.deferral_promotion_order; unit.version += 1 per touched unit"

  # --- NicuUnit -------------------------------------------------------------
  - method: POST
    path: /nicu-units
    purpose: "Register a unit in the regional network"
    input: [name, hospital_type, staffed_bed_target, "designated_level?", "transport_capable?", "annual_admission_volume?", "followup_clinic_daily_capacity?"]
    output: NicuUnit
    roles: [NetworkAdmin]

  - method: GET
    path: /nicu-units
    purpose: "List units"
    input: ["hospital_type?", "designation_status?", "census_posture?", "limit?", "offset?"]
    output: NicuUnit[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, ReferringClinician, TransportCoordinator, BedsideNurse, FollowUpCoordinator]

  - method: GET
    path: /nicu-units/{unit_id}
    purpose: "Read a unit with every derived capability and bed figure recomputed"
    input: []
    output: NicuUnit
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, ReferringClinician, TransportCoordinator, BedsideNurse, FollowUpCoordinator]

  - method: PATCH
    path: /nicu-units/{unit_id}
    purpose: "Edit the capacity profile under OCC"
    input: [expected_unit_version, "staffed_bed_target?", "followup_clinic_daily_capacity?", "annual_admission_volume?", "transport_capable?"]
    output: NicuUnit
    roles: [NetworkAdmin, UnitDirector]
    occ_field: expected_unit_version

  - method: GET
    path: /nicu-units/{unit_id}/capacity-projection
    purpose: "Advisory dual-variant capacity read (committed vs forecast)"
    input: []
    output: "{ unit_id: uuid, committed_available: integer, forecast_available: integer, back_transfer_ready_count: integer, expiring_hold_count: integer, census_posture: enum, required_nurse_count: integer, deferral_queue_depth: integer }"
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator]

  - method: GET
    path: /nicu-units/{unit_id}/deferral-queue
    purpose: "The unit's DEFERRED referrals in the exact promotion ranking"
    input: ["limit?", "offset?"]
    output: Referral[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist]

  # --- DesignationStandard --------------------------------------------------
  - method: POST
    path: /designation-standards
    purpose: "Declare the network standard for a level of care"
    input: [level, required_credential_codes, required_equipment_codes, nurse_patient_ratio_denominator, min_annual_volume, transport_capability_required, min_compliance_score, conditional_floor_score]
    output: DesignationStandard
    roles: [NetworkAdmin]

  - method: GET
    path: /designation-standards
    purpose: "List declared standards"
    input: ["level?", "limit?", "offset?"]
    output: DesignationStandard[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, ReferringClinician, TransportCoordinator, BedsideNurse, FollowUpCoordinator]

  - method: GET
    path: /designation-standards/{standard_id}
    purpose: "Read one standard (immutable: no PATCH, no version)"
    input: []
    output: DesignationStandard
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, ReferringClinician, TransportCoordinator, BedsideNurse, FollowUpCoordinator]

  # --- StaffCredential ------------------------------------------------------
  - method: POST
    path: /staff-credentials
    purpose: "Record a credential held by the unit"
    input: [unit_id, credential_code, holder_reference, fte, expires_on]
    output: StaffCredential
    roles: [NetworkAdmin, UnitDirector]

  - method: GET
    path: /staff-credentials
    purpose: "List credentials"
    input: ["unit_id?", "credential_code?", "status?", "limit?", "offset?"]
    output: StaffCredential[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist]

  - method: GET
    path: /staff-credentials/{credential_id}
    purpose: "Read a credential with its status re-derived against the clock"
    input: []
    output: StaffCredential
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist]

  - method: POST
    path: /staff-credentials/{credential_id}/revoke
    purpose: "Revoke a credential; may collapse the unit's capability_level"
    input: []
    output: StaffCredential
    roles: [NetworkAdmin, UnitDirector]
    side_effects:
      - "revoked_at = current_utc, status REVOKED"
      - "the unit's capability_level / effective_level / staffing_compliant are re-derived; the capability cascade runs when effective_level drops"

  # --- EquipmentAsset -------------------------------------------------------
  - method: POST
    path: /equipment-assets
    purpose: "Record a life-support or transport asset"
    input: [unit_id, equipment_code, asset_tag, last_service_at, service_interval_days]
    output: EquipmentAsset
    roles: [NetworkAdmin, UnitDirector]

  - method: GET
    path: /equipment-assets
    purpose: "List assets"
    input: ["unit_id?", "equipment_code?", "status?", "limit?", "offset?"]
    output: EquipmentAsset[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator]

  - method: GET
    path: /equipment-assets/{asset_id}
    purpose: "Read an asset with status and next_service_due_at re-derived"
    input: []
    output: EquipmentAsset
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator]

  - method: POST
    path: /equipment-assets/{asset_id}/service
    purpose: "Complete preventive maintenance and return the asset to service"
    input: [serviced_at]
    output: EquipmentAsset
    roles: [NetworkAdmin, UnitDirector]
    side_effects:
      - "last_service_at = serviced_at, out_of_service_at and out_of_service_reason cleared"
      - "the unit's capability_level / effective_level / equipment_compliant are re-derived"

  - method: POST
    path: /equipment-assets/{asset_id}/out-of-service
    purpose: "Take an asset out of service — the trigger of the capability cascade. reason is one of BIOMED_FAULT | RECALL | SCHEDULED_SERVICE"
    input: [reason]
    output: EquipmentAsset
    roles: [NetworkAdmin, UnitDirector]
    side_effects:
      - "out_of_service_at = current_utc, status OUT_OF_SERVICE"
      - "the unit's equipment_compliant, capability_level and effective_level are re-derived"
      - "designation_status PROVISIONAL or DESIGNATED -> CONDITIONAL when the asset was required for designated_level"
      - "every Referral at the unit with status IN {PENDING, INFO_REQUESTED, DEFERRED, ACCEPTED} whose required_level now exceeds effective_level -> DIVERTED (CAPABILITY_LOST); its HELD reservation -> RELEASED (CAPABILITY_LOST); any non-terminal TransportRun on that reservation -> ABORTED (CAPABILITY_LOST)"
      - "every Admission at the unit with care_status IN {ADMITTED, STABILIZED} whose current_care_level now exceeds effective_level -> BACK_TRANSFER_REQUIRED"
      - "unit.version += 1"

  # --- DesignationReview ----------------------------------------------------
  - method: POST
    path: /designation-reviews
    purpose: "Open a designation review for a level"
    input: [unit_id, requested_level, assigned_nurse_count]
    output: DesignationReview
    roles: [UnitDirector]

  - method: GET
    path: /designation-reviews
    purpose: "List reviews"
    input: ["unit_id?", "status?", "requested_level?", "limit?", "offset?"]
    output: DesignationReview[]
    roles: [NetworkAdmin, UnitDirector]

  - method: GET
    path: /designation-reviews/{review_id}
    purpose: "Read a review with its frozen subscores"
    input: []
    output: DesignationReview
    roles: [NetworkAdmin, UnitDirector]

  - method: POST
    path: /designation-reviews/{review_id}/submit
    purpose: "Submit for network assessment; freezes the compliance score"
    input: ["assigned_nurse_count?"]
    output: DesignationReview
    roles: [UnitDirector]
    side_effects: ["see §1.2 DesignationReview.submit and deny_rounds_exhausted"]

  - method: POST
    path: /designation-reviews/{review_id}/return
    purpose: "Return the submission for correction (cycle back to RETURNED)"
    input: [return_reason]
    output: DesignationReview
    roles: [NetworkAdmin]

  - method: POST
    path: /designation-reviews/{review_id}/verify
    purpose: "Network verification of a submitted review"
    input: []
    output: DesignationReview
    roles: [NetworkAdmin]

  - method: POST
    path: /designation-reviews/{review_id}/certify
    purpose: "Grant (or deny) the designation; writes the unit's designated_level"
    input: []
    output: DesignationReview
    roles: [NetworkAdmin]
    side_effects: ["see §1.2 DesignationReview.certify and certify_denies_below_floor"]

  # --- Referral -------------------------------------------------------------
  - method: POST
    path: /referrals
    purpose: "Refer a case to a receiving unit; computes both level variants and the triage priority"
    input: [referring_unit_id, receiving_unit_id, referral_kind, case_reference, gestational_age_weeks, birth_weight_grams, support_modality, "diagnoses?", "planned_surgery?"]
    output: Referral
    roles: [ReferringClinician]

  - method: GET
    path: /referrals
    purpose: "List referrals with every foreign key exposed as a filter"
    input: ["referring_unit_id?", "receiving_unit_id?", "source_admission_id?", "superseded_by_referral_id?", "status?", "referral_kind?", "required_level?", "limit?", "offset?"]
    output: Referral[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, ReferringClinician, TransportCoordinator]

  - method: GET
    path: /referrals/{referral_id}
    purpose: "Read a referral"
    input: []
    output: Referral
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, ReferringClinician, TransportCoordinator]

  - method: POST
    path: /referrals/{referral_id}/request-info
    purpose: "Ask the referring clinician for more data (bounded at two rounds)"
    input: [requested_items]
    output: Referral
    roles: [IntakeNeonatologist]

  - method: POST
    path: /referrals/{referral_id}/provide-info
    purpose: "Supply the requested data; the level variants and priority are recomputed"
    input: ["support_modality?", "birth_weight_grams?", "gestational_age_weeks?", "diagnoses?", "planned_surgery?"]
    output: Referral
    roles: [ReferringClinician]

  - method: POST
    path: /referrals/{referral_id}/accept
    purpose: "Accept the case and hold a bed, under OCC on the receiving unit. The response's reservation_id names the BedReservation just created."
    input: [expected_unit_version]
    output: Referral
    roles: [IntakeNeonatologist]
    occ_field: expected_unit_version
    side_effects:
      - "a HELD BedReservation is created (bed_class by waterfall, expires_at by referral kind)"
      - "unit.version += 1; the unit's counters and census_posture are re-derived"

  - method: POST
    path: /referrals/{referral_id}/decline
    purpose: "Decline the case; decision_reason is one of NO_CAPABILITY | CLINICAL_DECLINE"
    input: [decision_reason]
    output: Referral
    roles: [IntakeNeonatologist]

  - method: POST
    path: /referrals/{referral_id}/defer
    purpose: "Park the case in the unit's deferral queue (no bed available)"
    input: []
    output: Referral
    roles: [IntakeNeonatologist]

  - method: POST
    path: /referrals/{referral_id}/withdraw
    purpose: "Referring side withdraws the case"
    input: []
    output: Referral
    roles: [ReferringClinician]
    side_effects: ["any HELD reservation -> RELEASED (REFERRAL_WITHDRAWN); unit.version += 1 when a hold was released"]

  - method: POST
    path: /referrals/{referral_id}/revoke-acceptance
    purpose: "Give the held bed back before transport is under way"
    input: [expected_unit_version]
    output: Referral
    roles: [IntakeNeonatologist]
    occ_field: expected_unit_version
    side_effects:
      - "reservation -> RELEASED (REVOKED); any ACTIVATED TransportRun -> ABORTED (CAPABILITY_LOST)"
      - "unit.version += 1; DELIBERATELY does not promote the deferral queue"

  # --- BedReservation -------------------------------------------------------
  - method: GET
    path: /bed-reservations
    purpose: "List bed holds"
    input: ["unit_id?", "referral_id?", "status?", "bed_class?", "limit?", "offset?"]
    output: BedReservation[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator]

  - method: GET
    path: /bed-reservations/{reservation_id}
    purpose: "Read a bed hold"
    input: []
    output: BedReservation
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator]

  # --- TransportRun ---------------------------------------------------------
  - method: POST
    path: /transport-runs
    purpose: "Activate a neonatal transport team against a held bed"
    input: [reservation_id, isolette_asset_id, mode, crew_composition, depart_at, planned_return_at, "weather_minimums_met?"]
    output: TransportRun
    roles: [TransportCoordinator]

  - method: GET
    path: /transport-runs
    purpose: "List transport runs"
    input: ["reservation_id?", "receiving_unit_id?", "isolette_asset_id?", "status?", "mode?", "limit?", "offset?"]
    output: TransportRun[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator, BedsideNurse]

  - method: GET
    path: /transport-runs/{run_id}
    purpose: "Read a transport run"
    input: []
    output: TransportRun
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, TransportCoordinator, BedsideNurse]

  - method: POST
    path: /transport-runs/{run_id}/dispatch
    purpose: "Launch the run; forks on mode into GROUND_ROLLING or AIR_LAUNCHED"
    input: []
    output: TransportRun
    roles: [TransportCoordinator]

  - method: POST
    path: /transport-runs/{run_id}/on-scene
    purpose: "Crew arrives at the referring hospital (the fork's join point)"
    input: []
    output: TransportRun
    roles: [TransportCoordinator]

  - method: POST
    path: /transport-runs/{run_id}/stabilize
    purpose: "Record the stabilization bundle; recomputes the physiologic score"
    input: [temp_c, glucose_mg_dl, mean_bp_mmhg, spo2_pct]
    output: TransportRun
    roles: [TransportCoordinator, BedsideNurse]

  - method: POST
    path: /transport-runs/{run_id}/depart
    purpose: "Depart for the receiving unit; refused unless the bundle is complete"
    input: []
    output: TransportRun
    roles: [TransportCoordinator]

  - method: POST
    path: /transport-runs/{run_id}/arrive
    purpose: "Arrive at the receiving unit and start isolette decontamination"
    input: [arrived_at]
    output: TransportRun
    roles: [TransportCoordinator]

  - method: POST
    path: /transport-runs/{run_id}/abort
    purpose: "Abort the run; returns the case to PENDING and releases the hold. abort_reason is one of WEATHER | CREW_UNAVAILABLE | PATIENT_DEMISE"
    input: [abort_reason]
    output: TransportRun
    roles: [TransportCoordinator]

  # --- Admission ------------------------------------------------------------
  - method: POST
    path: /admissions
    purpose: "Admit the infant against an ACCEPTED referral; converts the hold to OCCUPIED"
    input: [referral_id]
    output: Admission
    roles: [IntakeNeonatologist]
    side_effects:
      - "referral -> COMPLETED; reservation -> OCCUPIED (ADMITTED); unit counters re-derived; unit.version += 1"
      - "for a BACK_TRANSFER referral: back_transfer_source_admission_id is set, the source Admission -> TRANSFERRED (BACK_TRANSFERRED), the source unit's counters are re-derived and its deferral queue is promoted, source unit.version += 1"
      - "transport_run_id is set when an ARRIVED run exists for the reservation"

  - method: GET
    path: /admissions
    purpose: "List admissions with every foreign key exposed as a filter"
    input: ["unit_id?", "referral_id?", "transport_run_id?", "back_transfer_source_admission_id?", "care_status?", "infection_status?", "current_care_level?", "limit?", "offset?"]
    output: Admission[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, BedsideNurse, FollowUpCoordinator]

  - method: GET
    path: /admissions/{admission_id}
    purpose: "Read an admission with both state dimensions and every aggregate"
    input: []
    output: Admission
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, BedsideNurse, FollowUpCoordinator]

  - method: POST
    path: /admissions/{admission_id}/care-updates
    purpose: "Post a day of care: weight, support, device days"
    input: [current_weight_grams, support_modality, "central_line_present?", "ventilated?"]
    output: Admission
    roles: [BedsideNurse]
    side_effects: ["patient_days += 1; central_line_days / ventilator_days += 1 when flagged; current_care_level re-derived; care_status ADMITTED -> STABILIZED when the posted support is ROOM_AIR or CPAP; admission.version += 1"]

  - method: POST
    path: /admissions/{admission_id}/developmental-rounds
    purpose: "Record a developmental-care round and family presence"
    input: [kangaroo_care_minutes, family_presence_minutes, cluster_care_compliant, light_cycling_compliant]
    output: Admission
    roles: [BedsideNurse]
    side_effects: ["the five round aggregates and developmental_bundle_score are recomputed; admission.version += 1"]

  - method: POST
    path: /admissions/{admission_id}/infection-events
    purpose: "Advance the independent infection dimension; event is one of SUSPECT | CONFIRM_CLABSI | RESOLVE"
    input: [event]
    output: Admission
    roles: [BedsideNurse, UnitDirector]
    side_effects: ["see §1.2 Admission.infection_status; SUSPECT quarantines the admission's milk, RESOLVE replays the quarantine; admission.version += 1"]

  - method: POST
    path: /admissions/{admission_id}/back-transfer-ready
    purpose: "Attest risk-appropriate readiness for a community hospital"
    input: [back_transfer_attestation_note]
    output: Admission
    roles: [IntakeNeonatologist]

  - method: POST
    path: /admissions/{admission_id}/back-transfer-referrals
    purpose: "Refer the infant back to a community hospital, under OCC on the admission"
    input: [expected_admission_version, receiving_unit_id, case_reference]
    output: Referral
    roles: [IntakeNeonatologist]
    occ_field: expected_admission_version
    side_effects:
      - "a Referral of kind BACK_TRANSFER is created with source_admission_id set, weight_basis_grams taken from the admission's current_weight_grams and the gestational-age term suppressed"
      - "any earlier PENDING/DEFERRED back-transfer referral from the same admission -> SUPERSEDED (superseded_by_referral_id set)"
      - "admission.version += 1"

  - method: POST
    path: /admissions/{admission_id}/discharge
    purpose: "Discharge home or record a death; frees the bed and promotes the queue. disposition is one of HOME | DECEASED"
    input: [disposition]
    output: Admission
    roles: [IntakeNeonatologist]
    side_effects: ["see §1.2 Admission.discharge_home and record_death; unit counters re-derived, deferral queue promoted, unit.version += 1"]

  # --- MilkBatch ------------------------------------------------------------
  - method: POST
    path: /milk-batches
    purpose: "Receive expressed or donor milk for an infant"
    input: [admission_id, donor_type, volume_ml, expressed_at, label_code]
    output: MilkBatch
    roles: [BedsideNurse]

  - method: GET
    path: /milk-batches
    purpose: "List milk batches"
    input: ["admission_id?", "status?", "donor_type?", "limit?", "offset?"]
    output: MilkBatch[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, BedsideNurse]

  - method: GET
    path: /milk-batches/{batch_id}
    purpose: "Read a milk batch and its volume ledger"
    input: []
    output: MilkBatch
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist, BedsideNurse]

  - method: POST
    path: /milk-batches/{batch_id}/verify
    purpose: "Second-nurse label verification (segregation of duties)"
    input: [label_code]
    output: MilkBatch
    roles: [BedsideNurse]

  - method: POST
    path: /milk-batches/{batch_id}/administrations
    purpose: "Administer a volume from the batch"
    input: [volume_ml]
    output: MilkBatch
    roles: [BedsideNurse]
    side_effects: ["administered_ml and remaining_ml updated, status advanced, admission.milk_administered_ml recomputed, admission.version += 1"]

  - method: POST
    path: /milk-batches/{batch_id}/administrations/reverse
    purpose: "Compensate an administration recorded in error"
    input: [volume_ml]
    output: MilkBatch
    roles: [BedsideNurse]
    side_effects: ["administered_ml reduced, remaining_ml restored, status walked back (VERIFIED at zero), admission.milk_administered_ml recomputed, admission.version += 1"]

  - method: POST
    path: /milk-batches/{batch_id}/discard
    purpose: "Discard the remaining volume; reason is one of EXPIRED | LABEL_MISMATCH | QUARANTINE_DISPOSAL | FAMILY_REQUEST"
    input: [reason]
    output: MilkBatch
    roles: [BedsideNurse]

  # --- SurgeEscalation ------------------------------------------------------
  - method: POST
    path: /surge-escalations
    purpose: "Request extra beds for a census surge"
    input: [unit_id, requested_beds, effective_from, effective_to]
    output: SurgeEscalation
    roles: [UnitDirector]

  - method: GET
    path: /surge-escalations
    purpose: "List escalations"
    input: ["unit_id?", "status?", "escalation_tier?", "limit?", "offset?"]
    output: SurgeEscalation[]
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist]

  - method: GET
    path: /surge-escalations/{escalation_id}
    purpose: "Read an escalation"
    input: []
    output: SurgeEscalation
    roles: [NetworkAdmin, UnitDirector, IntakeNeonatologist]

  - method: POST
    path: /surge-escalations/{escalation_id}/authorize
    purpose: "Network authorization; tiers the request and grants the beds"
    input: []
    output: SurgeEscalation
    roles: [NetworkAdmin]
    side_effects: ["escalation ACTIVE; unit.escalation_bed_count, available_bed_count, census_posture and required_nurse_count re-derived; deferral queue promoted; unit.version += 1"]

  - method: POST
    path: /surge-escalations/{escalation_id}/deny
    purpose: "Deny the request"
    input: [denial_reason]
    output: SurgeEscalation
    roles: [NetworkAdmin]

  - method: POST
    path: /surge-escalations/{escalation_id}/stand-down
    purpose: "End the escalation early; available beds may go negative"
    input: []
    output: SurgeEscalation
    roles: [NetworkAdmin, UnitDirector]
    side_effects: ["unit.escalation_bed_count re-derived; unit.version += 1"]

  # --- SurveillanceReport ---------------------------------------------------
  - method: POST
    path: /surveillance-reports
    purpose: "Open a surveillance report for a period; computes both rate variants"
    input: [unit_id, period_start, period_end, reported_patient_days, reported_central_line_days]
    output: SurveillanceReport
    roles: [UnitDirector]

  - method: GET
    path: /surveillance-reports
    purpose: "List surveillance reports"
    input: ["unit_id?", "status?", "network_benchmark_flag?", "variant_applied?", "limit?", "offset?"]
    output: SurveillanceReport[]
    roles: [NetworkAdmin, UnitDirector]

  - method: GET
    path: /surveillance-reports/{report_id}
    purpose: "Read a surveillance report"
    input: []
    output: SurveillanceReport
    roles: [NetworkAdmin, UnitDirector]

  - method: POST
    path: /surveillance-reports/{report_id}/submit
    purpose: "Submit to the regional network; recomputes every metric"
    input: ["acknowledge_incomplete?"]
    output: SurveillanceReport
    roles: [UnitDirector]

  - method: POST
    path: /surveillance-reports/{report_id}/accept
    purpose: "Network accepts the report; stamps the unit's quality flag"
    input: []
    output: SurveillanceReport
    roles: [NetworkAdmin]

  - method: POST
    path: /surveillance-reports/{report_id}/reject
    purpose: "Network rejects the report back for resubmission"
    input: [rejection_reason]
    output: SurveillanceReport
    roles: [NetworkAdmin]

  # --- FollowUpEnrollment ---------------------------------------------------
  - method: POST
    path: /follow-up-enrollments
    purpose: "Enrol a high-risk graduate in the follow-up clinic"
    input: [admission_id, clinic_unit_id, target_appointment_date]
    output: FollowUpEnrollment
    roles: [FollowUpCoordinator]

  - method: GET
    path: /follow-up-enrollments
    purpose: "List enrollments"
    input: ["admission_id?", "clinic_unit_id?", "status?", "risk_tier?", "eligibility_basis?", "limit?", "offset?"]
    output: FollowUpEnrollment[]
    roles: [NetworkAdmin, UnitDirector, FollowUpCoordinator]

  - method: GET
    path: /follow-up-enrollments/{enrollment_id}
    purpose: "Read an enrollment and its appointment window"
    input: []
    output: FollowUpEnrollment
    roles: [NetworkAdmin, UnitDirector, FollowUpCoordinator]

  - method: POST
    path: /follow-up-enrollments/{enrollment_id}/schedule
    purpose: "Confirm an appointment against the clinic's calendar-day capacity"
    input: [confirmed_appointment_date]
    output: FollowUpEnrollment
    roles: [FollowUpCoordinator]

  - method: POST
    path: /follow-up-enrollments/{enrollment_id}/record-attendance
    purpose: "Record attendance or a no-show"
    input: [attended]
    output: FollowUpEnrollment
    roles: [FollowUpCoordinator]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - { error_id: ERR_UNAUTHENTICATED, status: 401, when: "X-User-ID or X-User-Role missing or empty" }
  - { error_id: ERR_ROLE_NOT_PERMITTED, status: 403, when: "The caller's role is not listed on the endpoint" }
  - { error_id: ERR_UNIT_SCOPE_VIOLATION, status: 403, when: "A unit-scoped caller acts on a unit other than the one encoded in its X-User-ID" }
  - { error_id: ERR_INVALID_REQUEST, status: 400, when: "Missing required field, bad type, unknown enum value, out-of-range number, inverted interval, bad pagination" }
  - { error_id: ERR_UNIT_NOT_FOUND, status: 404, when: "unit_id in the path or body does not resolve" }
  - { error_id: ERR_STANDARD_NOT_FOUND, status: 404, when: "standard_id does not resolve" }
  - { error_id: ERR_CREDENTIAL_NOT_FOUND, status: 404, when: "credential_id does not resolve" }
  - { error_id: ERR_ASSET_NOT_FOUND, status: 404, when: "asset_id or isolette_asset_id does not resolve" }
  - { error_id: ERR_REVIEW_NOT_FOUND, status: 404, when: "review_id does not resolve" }
  - { error_id: ERR_REFERRAL_NOT_FOUND, status: 404, when: "referral_id does not resolve" }
  - { error_id: ERR_RESERVATION_NOT_FOUND, status: 404, when: "reservation_id does not resolve" }
  - { error_id: ERR_RUN_NOT_FOUND, status: 404, when: "run_id does not resolve" }
  - { error_id: ERR_ADMISSION_NOT_FOUND, status: 404, when: "admission_id does not resolve" }
  - { error_id: ERR_MILK_BATCH_NOT_FOUND, status: 404, when: "batch_id does not resolve" }
  - { error_id: ERR_ESCALATION_NOT_FOUND, status: 404, when: "escalation_id does not resolve" }
  - { error_id: ERR_REPORT_NOT_FOUND, status: 404, when: "report_id does not resolve" }
  - { error_id: ERR_ENROLLMENT_NOT_FOUND, status: 404, when: "enrollment_id does not resolve" }
  - { error_id: ERR_UNIT_VERSION_CONFLICT, status: 412, when: "expected_unit_version does not match NicuUnit.version" }
  - { error_id: ERR_ADMISSION_VERSION_CONFLICT, status: 412, when: "expected_admission_version does not match Admission.version" }
  - { error_id: ERR_INVALID_STATE, status: 409, when: "The entity's own status does not permit the trigger, including terminal states and repeated triggers" }
  - { error_id: ERR_DEPENDENT_STATE_INVALID, status: 409, when: "A different entity is not in the state this operation requires" }
  - { error_id: ERR_LEVEL_CAPABILITY_INSUFFICIENT, status: 422, when: "The receiving unit's effective_level is below the referral's required_level" }
  - { error_id: ERR_UNIT_SUSPENDED, status: 422, when: "A SUSPENDED unit is asked to accept a referral" }
  - { error_id: ERR_CREW_COMPOSITION_INVALID, status: 422, when: "crew_composition does not contain TRANSPORT_RN" }
  - { error_id: ERR_ISOLETTE_NOT_SERVICEABLE, status: 422, when: "The isolette's derived status is OUT_OF_SERVICE or SERVICE_DUE, or the asset is not a TRANSPORT_ISOLETTE" }
  - { error_id: ERR_WEATHER_MINIMUMS_NOT_MET, status: 422, when: "An air-mode run is dispatched with weather_minimums_met false" }
  - { error_id: ERR_STABILIZATION_INCOMPLETE, status: 422, when: "depart is called with stabilization_score below 85" }
  - { error_id: ERR_DEVELOPMENTAL_BUNDLE_INCOMPLETE, status: 422, when: "back-transfer-ready is called with developmental_bundle_score below 60.00" }
  - { error_id: ERR_MILK_NOT_ADMINISTRABLE, status: 422, when: "The batch is RECEIVED (unverified), QUARANTINED, DISCARDED or fully ADMINISTERED" }
  - { error_id: ERR_MILK_EXPIRED, status: 422, when: "expires_at <= current_utc at administration time" }
  - { error_id: ERR_NOT_ELIGIBLE_FOR_FOLLOWUP, status: 422, when: "Enrollment is attempted for an admission whose eligibility_basis is NOT_ELIGIBLE" }
  - { error_id: ERR_ISOLETTE_UNIT_MISMATCH, status: 409, when: "The isolette belongs to a unit other than the run's receiving unit" }
  - { error_id: ERR_MILK_LABEL_MISMATCH, status: 409, when: "The label_code presented at verification differs from the stored label_code" }
  - { error_id: ERR_MATERNAL_TRANSFER_PREFERENCE, status: 409, when: "A non-maternal acceptance would take the last bed a higher-priority maternal transfer is waiting for" }
  - { error_id: ERR_DUPLICATE_ENROLLMENT, status: 409, when: "The admission already has an ENROLLED or SCHEDULED enrollment" }
  - { error_id: ERR_ISOLETTE_UNAVAILABLE, status: 409, when: "The requested occupation interval overlaps another run's interval including its decontamination buffer" }
  - { error_id: ERR_ESCALATION_WINDOW_OVERLAP, status: 409, when: "The escalation window touches or overlaps another ACTIVE escalation for the same unit" }
  - { error_id: ERR_APPOINTMENT_OUTSIDE_WINDOW, status: 409, when: "The requested appointment falls outside [discharge+14d, discharge+90d]" }
  - { error_id: ERR_PERIOD_INVALID, status: 409, when: "A surveillance period starts before the unit existed" }
  - { error_id: ERR_DUPLICATE_STANDARD, status: 409, when: "A DesignationStandard already exists for that level" }
  - { error_id: ERR_REVIEW_ALREADY_OPEN, status: 409, when: "The unit already has a review in DRAFT, SUBMITTED, RETURNED or VERIFIED" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status: 409, when: "The same X-User-ID performs two steps that must be performed by different people (submit/return, submit/verify, verify/certify, receive/verify milk, submit/accept report)" }
  - { error_id: ERR_NO_BED_AVAILABLE, status: 409, when: "available_bed_count is below 1 at acceptance" }
  - { error_id: ERR_SURGE_THRESHOLD_NOT_MET, status: 409, when: "census_ratio_at_request is below 0.80" }
  - { error_id: ERR_SURGE_NO_STAFFED_CAPACITY, status: 422, when: "authorized_beds computes to 0" }
  - { error_id: ERR_CLINIC_DAY_FULL, status: 409, when: "The clinic's calendar-day bookings already equal followup_clinic_daily_capacity" }
  - { error_id: ERR_MILK_VOLUME_EXCEEDED, status: 422, when: "An administration exceeds remaining_ml or a reversal exceeds administered_ml" }

# =============================================================================
# §1.7 RBAC
# =============================================================================
rbac:

  identity_convention: |
    Every request carries X-User-ID and X-User-Role. For the three unit-scoped
    roles the X-User-ID MUST be of the form "<unit_id>:<person-label>" — the text
    before the first colon is the NicuUnit the caller acts for, and the label
    after it is the person (which is what the segregation-of-duties rules
    compare). Opaque roles carry any non-empty X-User-ID and are never
    unit-bound.

  roles:

    - role: NetworkAdmin
      identity: opaque
      description: "Regional network authority: standards, designation decisions, surge authorization, report acceptance, clock and sweep"
      exclusive_operations:
        - "POST /_clock/set_current_utc"
        - "POST /ops/run-capacity-sweep"
        - "POST /nicu-units"
        - "POST /designation-standards"
        - "POST /designation-reviews/{review_id}/return"
        - "POST /designation-reviews/{review_id}/verify"
        - "POST /designation-reviews/{review_id}/certify"
        - "POST /surge-escalations/{escalation_id}/authorize"
        - "POST /surge-escalations/{escalation_id}/deny"
        - "POST /surveillance-reports/{report_id}/accept"
        - "POST /surveillance-reports/{report_id}/reject"
      shared_operations:
        - "PATCH /nicu-units/{unit_id} (with UnitDirector)"
        - "POST /staff-credentials, /revoke and POST /equipment-assets, /service, /out-of-service (with UnitDirector)"
        - "POST /surge-escalations/{escalation_id}/stand-down (with UnitDirector)"
        - "every GET"

    - role: UnitDirector
      identity: entity_backed:NicuUnit
      description: "Accountable for one unit's designation readiness: credentials, equipment, reviews, surge requests, surveillance reports"
      exclusive_operations:
        - "POST /designation-reviews"
        - "POST /designation-reviews/{review_id}/submit"
        - "POST /surge-escalations"
        - "POST /surveillance-reports"
        - "POST /surveillance-reports/{report_id}/submit"
      shared_operations:
        - "PATCH /nicu-units/{unit_id} (with NetworkAdmin)"
        - "credential and equipment writes (with NetworkAdmin)"
        - "POST /admissions/{admission_id}/infection-events (with BedsideNurse)"
        - "POST /surge-escalations/{escalation_id}/stand-down (with NetworkAdmin)"
      scope: "Only its own unit; a review, credential, asset, escalation or report for another unit is ERR_UNIT_SCOPE_VIOLATION"

    - role: IntakeNeonatologist
      identity: entity_backed:NicuUnit
      description: "Decides what the receiving unit takes: acceptance, deferral, decline, admission, back-transfer, discharge"
      exclusive_operations:
        - "POST /referrals/{referral_id}/request-info"
        - "POST /referrals/{referral_id}/accept"
        - "POST /referrals/{referral_id}/decline"
        - "POST /referrals/{referral_id}/defer"
        - "POST /referrals/{referral_id}/revoke-acceptance"
        - "POST /admissions"
        - "POST /admissions/{admission_id}/back-transfer-ready"
        - "POST /admissions/{admission_id}/back-transfer-referrals"
        - "POST /admissions/{admission_id}/discharge"
      shared_operations: ["every GET on units, referrals, reservations, runs, admissions and milk"]
      scope: "Acts only for the referral's receiving_unit_id / the admission's unit_id"

    - role: ReferringClinician
      identity: entity_backed:NicuUnit
      description: "Sends cases out of the referring hospital and answers information requests"
      exclusive_operations:
        - "POST /referrals"
        - "POST /referrals/{referral_id}/provide-info"
        - "POST /referrals/{referral_id}/withdraw"
      shared_operations: ["GET on units, standards and referrals"]
      scope: "Acts only for the referral's referring_unit_id"

    - role: TransportCoordinator
      identity: opaque
      description: "Runs the regional transport service across every unit"
      exclusive_operations:
        - "POST /transport-runs"
        - "POST /transport-runs/{run_id}/dispatch"
        - "POST /transport-runs/{run_id}/on-scene"
        - "POST /transport-runs/{run_id}/depart"
        - "POST /transport-runs/{run_id}/arrive"
        - "POST /transport-runs/{run_id}/abort"
      shared_operations:
        - "POST /transport-runs/{run_id}/stabilize (with BedsideNurse)"
        - "GET on units, reservations, runs and assets"

    - role: BedsideNurse
      identity: opaque
      description: "Cot-side care: care updates, developmental rounds, infection events, milk handling"
      exclusive_operations:
        - "POST /admissions/{admission_id}/care-updates"
        - "POST /admissions/{admission_id}/developmental-rounds"
        - "POST /milk-batches"
        - "POST /milk-batches/{batch_id}/verify"
        - "POST /milk-batches/{batch_id}/administrations"
        - "POST /milk-batches/{batch_id}/administrations/reverse"
        - "POST /milk-batches/{batch_id}/discard"
      shared_operations:
        - "POST /admissions/{admission_id}/infection-events (with UnitDirector)"
        - "POST /transport-runs/{run_id}/stabilize (with TransportCoordinator)"
        - "GET on admissions, milk and runs"

    - role: FollowUpCoordinator
      identity: opaque
      description: "Runs the high-risk graduate clinic"
      exclusive_operations:
        - "POST /follow-up-enrollments"
        - "POST /follow-up-enrollments/{enrollment_id}/schedule"
        - "POST /follow-up-enrollments/{enrollment_id}/record-attendance"
      shared_operations: ["GET on units, admissions and enrollments"]

  segregation_of_duties:
    - "DesignationReview: submitted_by_user_id != the user who returns or verifies it; verified_by_user_id != certified_by_user_id"
    - "MilkBatch: received_by_user_id != verified_by_user_id"
    - "SurveillanceReport: the submitting user may not accept the report"
