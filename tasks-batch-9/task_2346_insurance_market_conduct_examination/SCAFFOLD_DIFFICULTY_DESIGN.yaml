          Both criticisms are issued against the SAME breached scope area with the SAME sample data,
          so tolerance_breached is held constant at true; severity alone (MINOR vs MATERIAL) decides
          the variant, giving SAMPLE_ACTUAL 50333 and POPULATION_EXTRAPOLATED 20132000 - the mirror
          image of the tolerance-driven divergence instance, which held severity constant instead.
