          - "endpoints[GET /sellers/{id}/notifications].roles"
        distinguishing_aspect: |
          Reads are broadly shared, but §1.5 carves out two exceptions in opposite directions: the raw
          metric feed is hidden from the AppealReviewer, and the seller's notification trail is hidden
          from the PolicyInvestigator. An implementation that models "all operators can read
          everything" passes the seller row and the rulebook and fails exactly these two paths.
        test_recipe:
