            - "CERTIFIED FY2027 cycle with shortfall_gap_cents 49083727 and shortfall_pct_bps 297."
            - "One fund, opening 20000000, balance 41958137 after the certification deposit, fy_opening_balance_cents 20000000 so annual_withdrawal_cap_cents == 6000000."
            - "One SHORTFALL_TRIGGER request for 49083727 with deadline_date 2026-08-10, already APPROVED with authorized_amount_cents 49083727."
            - "The clock is then pushed to 2026-08-20T00:00:00Z, which drives the request APPROVED -> LAPSED."
