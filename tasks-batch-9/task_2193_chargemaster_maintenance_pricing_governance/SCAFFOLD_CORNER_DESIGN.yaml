              captures: { e_entry_w: $.data.error_id }
            - call: "GET /chargemaster/charge-capture-batches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_batch: $.data.error_id }
            - call: "GET /chargemaster/missing-charge-findings/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_finding: $.data.error_id }
            - call: "GET /chargemaster/captured-charges/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_line: $.data.error_id }
            - call: "GET /chargemaster/transparency-files/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              captures: { e_file: $.data.error_id }
            - call: "GET /chargemaster/price-change-analyses/00000000-0000-0000-0000-0000000000ff"
