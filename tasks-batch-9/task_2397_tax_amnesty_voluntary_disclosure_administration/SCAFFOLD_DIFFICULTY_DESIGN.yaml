            - "PreClearanceRequest.${pc_id}.counter_count == 0"
            - "PreClearanceRequest.${pc_id}.current_offer_penalty_waiver_pct == 0.70"
            - "GET /amnesty/pre-clearances/${pc_id}/negotiation-rounds returns total_count == 1"
            - "the second trigger returns status 200"
            - "PreClearanceRequest.${pc_id}.status == \"REJECTED\""
            - "PreClearanceRequest.${pc_id}.rejection_reason == \"REPRESENTATIVE_SUSPENDED_BY_BOARD\""
            - "PreClearanceRequest.${pc_id}.round_index == 1"

