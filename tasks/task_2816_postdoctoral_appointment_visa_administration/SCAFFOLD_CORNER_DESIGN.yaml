          - endpoints.POST /appointments/{id}/accept-offer
          - calculations.visa_category_selection
        distinguishing_aspect: "A sponsorship-requiring acceptance creates exactly one VisaCase whose status is the declared initial_state DOCS_PENDING with filed_at, decided_at and projection_variant all null and rfe_round_count 0 - the projection fields are only written by submit-petition, so nothing may be pre-computed at creation. visa_category is already resolved (J1_RESEARCH_SCHOLAR) because it is a create-time computed field."
        test_recipe:
          setup:
            - "One Indian-citizen scholar requiring sponsorship with j1_two_year_bar_flag false and o1_endorsement_on_file false, on a FELLOWSHIP-class appointment so H1B and TN are both ineligible."
