      - name: pay_line_regular_rate_excludes_topup_pinned_order
        grounds:
          - calculations.pay_line_wage_computation
          - calculations.pay_line_wage_computation.formula.S4
          - calculations.pay_line_wage_computation.formula.S5
          - calculations.pay_line_wage_computation.formula.S7
          - calculations.service_charge_wages_allocation
          - entities.PayLine.fields.regular_rate_cents_per_hour
          - entities.ServiceChargeEvent.fields.treatment
        distinguishing_aspect: >-
          Mode (c) pinned evaluation order across a nine-step waterfall. The WAGES-treated service
          charge must be allocated (S3) before the regular rate is taken (S4), the rate must exclude
          the not-yet-computed top-up or the formula becomes self-referential, the overtime premium
          derived from that rate (S5) must be subtracted inside the residual cap (S7), and only then
          may the top-up be taken (S8). Any transposition of S4/S5/S7 changes tip_credit_cents,
          which here is capped by the residual 17417 rather than by max_credit 22500 or by the
          40000 of tips on hand.
