              payload: { campaign_id: "${camp_main}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-09T01:00:00Z", measured_impressions: 10000, measurable_impressions: 6000, in_view_impressions: 6000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
