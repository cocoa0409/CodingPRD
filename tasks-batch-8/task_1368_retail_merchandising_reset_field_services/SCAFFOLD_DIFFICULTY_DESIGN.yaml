scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: mileage_pay_home_based_vs_first_stop
        grounds:
          - calculations.mileage_pay
          - entities.FieldRep.fields.mileage_policy
        distinguishing_aspect: |
          Same odometer inputs (round_trip_miles=120, home_to_first_stop_miles=10,
          home_base_commute_miles=15, rate=67) yield 6030 cents under the
          HOME_BASED policy versus 7370 cents under FIRST_STOP — two valid
          mileage-reimbursement algorithms on the FieldRep-pay entity domain.
        test_recipe:
          setup:
            - "Two ACTIVE W2 reps R_home (mileage_policy=HOME_BASED, home_base_commute_miles=15, mileage_rate_cents=67) and R_first (mileage_policy=FIRST_STOP, home_base_commute_miles=15, mileage_rate_cents=67)"
            - "One AUDIT project with two stores; R_home assigned to store 1, R_first assigned to store 2; each rep checks in with photos and checks out so both assignments are SUBMITTED (in the mileage-log input set)"
          setup_api_calls:
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Home Based Rep", employment_type: "W2", home_base_commute_miles: 15, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_home_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "First Stop Rep", employment_type: "W2", home_base_commute_miles: 15, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "FIRST_STOP" }
              as: PayrollAdmin
              captures: { rep_first_id: "$.data.id" }
            - call: "POST /retail-reset/clients"
              payload: { name: "Client A", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Mileage Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "S1", name: "Store One", address: "1 Main St", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_1: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "S2", name: "Store Two", address: "2 Main St", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_2: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_1}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_1: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_2}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_2: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 2" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_1}", rep_id: "${rep_home_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_home: "$.data.id" }
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_2}", rep_id: "${rep_first_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_first: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_home}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_home_id}"
              captures: { visit_home: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_home}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/bh.jpg", captured_at: "2026-08-05T09:31:00Z" }
              as: FieldRep
              as_user_id: "${rep_home_id}"
            - call: "POST /retail-reset/store-visits/${visit_home}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/ah.jpg", captured_at: "2026-08-05T10:29:00Z" }
              as: FieldRep
              as_user_id: "${rep_home_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_home}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_home_id}"
            - call: "POST /retail-reset/assignments/${asg_first}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_first_id}"
              captures: { visit_first: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_first}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/bf.jpg", captured_at: "2026-08-05T10:31:00Z" }
              as: FieldRep
              as_user_id: "${rep_first_id}"
            - call: "POST /retail-reset/store-visits/${visit_first}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/af.jpg", captured_at: "2026-08-05T10:44:00Z" }
              as: FieldRep
              as_user_id: "${rep_first_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:45:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_first}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_first_id}"
          trigger:
            - call: "POST /retail-reset/mileage-logs"
              payload: { rep_id: "${rep_home_id}", assignment_id: "${asg_home}", round_trip_miles: 120, home_to_first_stop_miles: 10, drive_minutes: 60 }
              as: FieldRep
              as_user_id: "${rep_home_id}"
              captures: { ml_home: "$.data.id", pay_home: "$.data.mileage_pay_cents" }
            - call: "POST /retail-reset/mileage-logs"
              payload: { rep_id: "${rep_first_id}", assignment_id: "${asg_first}", round_trip_miles: 120, home_to_first_stop_miles: 10, drive_minutes: 60 }
              as: FieldRep
              as_user_id: "${rep_first_id}"
              captures: { ml_first: "$.data.id", pay_first: "$.data.mileage_pay_cents" }
          assert:
            - "MileageLog.${ml_home}.mileage_pay_cents == 6030  # max(0, 120 - 2*15) * 67"
            - "MileageLog.${ml_first}.mileage_pay_cents == 7370  # max(0, 120 - 10) * 67"
            - "MileageLog.${ml_home}.mileage_pay_cents != MileageLog.${ml_first}.mileage_pay_cents"
      - name: visit_billing_per_store_vs_hourly
        grounds:
          - calculations.visit_billing
          - entities.Project.fields.effective_billing_model
        distinguishing_aspect: |
          A 95-minute VERIFIED visit bills 3500 cents under PER_STORE (flat,
          duration-independent) but 6650 cents under HOURLY
          (round_half_up(95*4200/60)) — dual-variant billing on the
          Client-invoicing entity domain, distinct from mileage pay.
        test_recipe:
          setup:
            - "Client PS with billing_model=PER_STORE, per_store_rate_cents=3500; Client HR with billing_model=HOURLY, hourly_rate_cents=4200"
            - "Each client has a project with one store; rep checks in at 2026-08-05T10:00:00Z and out at 2026-08-05T11:35:00Z (95 minutes) on both projects"
            - "Both visits have BEFORE and AFTER photos and are in PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "PerStore Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_ps: "$.data.id" }
            - call: "POST /retail-reset/clients"
              payload: { name: "Hourly Client", billing_model: "HOURLY", hourly_rate_cents: 4200 }
              as: ProjectManager
              captures: { client_hr: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Rep B", employment_type: "W2", home_base_commute_miles: 10, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "PS1", name: "PS Store", address: "2 Oak Ave", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_ps: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "HR1", name: "HR Store", address: "3 Pine Ave", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_hr: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_ps}", title: "PS Project", scope_type: "RESET" }
              as: ProjectManager
              captures: { proj_ps: "$.data.id", proj_ps_ver: "$.data.version" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_hr}", title: "HR Project", scope_type: "RESET" }
              as: ProjectManager
              captures: { proj_hr: "$.data.id", proj_hr_ver: "$.data.version" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${proj_ps}", store_id: "${store_ps}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { pstore_ps: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${proj_hr}", store_id: "${store_hr}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { pstore_hr: "$.data.id" }
            - call: "POST /retail-reset/projects/${proj_ps}/scope"
              payload: { expected_project_version: "${proj_ps_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/projects/${proj_hr}/scope"
              payload: { expected_project_version: "${proj_hr_ver} + 1" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${proj_ps}", project_store_id: "${pstore_ps}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T12:00:00Z" }
              as: ProjectManager
              captures: { asg_ps: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_ps}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { visit_ps: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_ps}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/b1.jpg", captured_at: "2026-08-05T10:05:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /retail-reset/store-visits/${visit_ps}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/a1.jpg", captured_at: "2026-08-05T11:30:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T11:35:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_ps}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${proj_hr}", project_store_id: "${pstore_hr}", rep_id: "${rep_id}", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T12:00:00Z" }
              as: ProjectManager
              captures: { asg_hr: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T10:00:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_hr}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { visit_hr: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_hr}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/b2.jpg", captured_at: "2026-08-06T10:05:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /retail-reset/store-visits/${visit_hr}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/a2.jpg", captured_at: "2026-08-06T11:30:00Z" }
              as: FieldRep
              as_user_id: "${rep_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T11:35:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_hr}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /retail-reset/store-visits/${visit_ps}/verify"
              payload: {}
              as: ProjectManager
            - call: "POST /retail-reset/store-visits/${visit_hr}/verify"
              payload: {}
              as: ProjectManager
          assert:
            - "StoreVisit.${visit_ps}.billable_amount_cents == 3500"
            - "StoreVisit.${visit_hr}.billable_amount_cents == 6650"
            - "StoreVisit.${visit_ps}.billable_amount_cents != StoreVisit.${visit_hr}.billable_amount_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: travel_time_pay_tiered_nonlinear
        grounds:
          - calculations.travel_time_pay
          - entities.FieldRep.fields.employment_type
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (drive_minutes, travel_minute_rate_cents,
          employment_type) with non-linear tier interaction — 150 drive-minutes
          at 40 cents/min splits 60/60/30 across 1.0x/1.25x/1.5x tiers =
          2400+3000+1800 = 7200 cents for a W2 rep, but 0 for a C1099 rep with
          identical minutes, and per-tier round_half_up before summing is pinned.
        test_recipe:
          setup:
            - "W2 rep with travel_minute_rate_cents=40 and C1099 rep with travel_minute_rate_cents=40"
            - "Each rep has one VERIFIED assignment so the mileage-log input set admits the logs"
          setup_api_calls:
            - call: "POST /retail-reset/reps"
              payload: { full_name: "W2 Traveler", employment_type: "W2", home_base_commute_miles: 10, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_w2: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "C1099 Traveler", employment_type: "C1099", home_base_commute_miles: 10, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "FIRST_STOP" }
              as: PayrollAdmin
              captures: { rep_1099: "$.data.id" }
            - call: "POST /retail-reset/clients"
              payload: { name: "Client C", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Travel Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "T1", name: "T Store", address: "9 Elm", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "T2", name: "T Store 2", address: "10 Elm", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_id2: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_id}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_id: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_id2}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_id2: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 2" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id}", rep_id: "${rep_w2}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_w2: "$.data.id" }
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_id2}", rep_id: "${rep_1099}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_1099: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_w2}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_w2}"
              captures: { visit_w2: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_w2}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/bw.jpg", captured_at: "2026-08-05T09:31:00Z" }
              as: FieldRep
              as_user_id: "${rep_w2}"
            - call: "POST /retail-reset/store-visits/${visit_w2}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/aw.jpg", captured_at: "2026-08-05T10:29:00Z" }
              as: FieldRep
              as_user_id: "${rep_w2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:30:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_w2}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_w2}"
            - call: "POST /retail-reset/assignments/${asg_1099}/check-in"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_1099}"
              captures: { visit_1099: "$.data.id" }
            - call: "POST /retail-reset/store-visits/${visit_1099}/photos"
              payload: { photo_type: "BEFORE", image_url: "https://img/b9.jpg", captured_at: "2026-08-05T10:31:00Z" }
              as: FieldRep
              as_user_id: "${rep_1099}"
            - call: "POST /retail-reset/store-visits/${visit_1099}/photos"
              payload: { photo_type: "AFTER", image_url: "https://img/a9.jpg", captured_at: "2026-08-05T10:44:00Z" }
              as: FieldRep
              as_user_id: "${rep_1099}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:45:00Z" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments/${asg_1099}/check-out"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_1099}"
          trigger:
            - call: "POST /retail-reset/mileage-logs"
              payload: { rep_id: "${rep_w2}", assignment_id: "${asg_w2}", round_trip_miles: 100, home_to_first_stop_miles: 10, drive_minutes: 150 }
              as: FieldRep
              as_user_id: "${rep_w2}"
              captures: { ml_w2: "$.data.id", ml_w2_travel: "$.data.travel_time_pay_cents" }
            - call: "POST /retail-reset/mileage-logs"
              payload: { rep_id: "${rep_1099}", assignment_id: "${asg_1099}", round_trip_miles: 100, home_to_first_stop_miles: 10, drive_minutes: 150 }
              as: FieldRep
              as_user_id: "${rep_1099}"
              captures: { ml_1099: "$.data.id" }
          assert:
            - "MileageLog.${ml_w2}.travel_time_pay_cents == 7200  # 60*40 + round_half_up(60*40*1.25) + round_half_up(30*40*1.5) = 2400+3000+1800"
            - "MileageLog.${ml_w2}.mileage_pay_cents == 5360  # max(0,100-2*10)*67"
            - "MileageLog.${ml_1099}.travel_time_pay_cents == 0  # C1099 reps are never paid travel time"
            - "MileageLog.${ml_1099}.mileage_pay_cents == 6030  # FIRST_STOP: max(0,100-10)*67"
      - name: invoice_total_line_level_rounding_order
        grounds:
          - calculations.invoice_total
          - calculations.visit_billing
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — visit_billing rounds
          half-up per visit line at verification, then invoice_total sums the
          integer lines without re-rounding. With hourly_rate_cents=4199 and
          visits of 10 and 25 minutes: per-line rounding yields
          round_half_up(10*4199/60)=700 and round_half_up(25*4199/60)=1750,
          summed to 2450; the alternative sum-then-round order yields
          round_half_up((10+25)*4199/60)=round_half_up(2449.583)=2449. The two
          orders diverge by exactly one cent; the scaffold pins
          per-line-then-sum.
        test_recipe:
          setup:
            - "Client billing_model=HOURLY with hourly_rate_cents=4199"
            - "Project with two stores; rep completes visit V1 (10 minutes) and V2 (25 minutes); both VERIFIED"
            - "Invoice auto-created when project reaches RECONCILING"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Round Client", billing_model: "HOURLY", hourly_rate_cents: 4199 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Round Rep", employment_type: "W2", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "R1", name: "R Store 1", address: "4 Birch", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_1: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "R2", name: "R Store 2", address: "5 Birch", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_2: "$.data.id" }
            - call: "POST /retail-reset/projects"
