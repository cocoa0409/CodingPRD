      - name: rebate_program_window_requires_one_day_gap
        grounds:
          - validations[priority=47]
          - entities.RebateProgram.fields.effective_from
          - entities.RebateProgram.fields.effective_to
          - errors[ERR_PROGRAM_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A different resource (a utility's rebate calendar, keyed by utility_code + program_class) with different
          interval semantics: the windows are day-granular and must be separated by at least one FULL CLEAR day, so
          back-to-back windows that merely fail to overlap are still rejected — 2027-01-01 immediately after a
          window ending 2026-12-31 conflicts, and only 2027-01-02 is accepted.
        test_recipe:
          setup:
            - "RebateProgram UTIL-A-W1, utility UTIL-A, program_class COMBINED, window 2026-07-01 .. 2026-12-31, ACTIVE"
          setup_api_calls:
