              captures: { err_repeat: $.data.error_id }
          assert:
            - "The CLOSE attempt returns 422 with data.error_id == ERR_SEVERITY_INSUFFICIENT_FOR_CLOSURE and CriticalFinding.${cf_id}.restriction_action is still NONE with restriction_imposed_at null"
            - "Bridge.${br_id}.service_posture is still OPEN after the refused closure - no posture side effect leaks from a rejected call"
            - "The FHWA-first notify returns 409 with data.error_id == ERR_NOTIFICATION_SEQUENCE and creates no NotificationLog row"
            - "The BRIDGE_OWNER notify returns 201; NotificationLog.${note_id}.tier == BRIDGE_OWNER, sent_at == 2026-09-01T00:00:00Z, late == false, and CriticalFinding.${cf_id}.notification_status == OWNER_NOTIFIED"
            - "The second BRIDGE_OWNER notify returns 409 with data.error_id == ERR_NOTIFICATION_SEQUENCE - a tier may not be notified twice - and the log still holds exactly 1 row for the finding"
            - "A RESTRICT action on the same URGENT finding would be allowed; only CLOSE is severity-gated"

      - name: scour_finalize_by_unlicensed_engineer_rejected
