          trigger:
            - call: "POST /planning/vendor-bookings/${vb}/book"
              payload: { contracted_cost_cents: 1000000 }
              as: Planner
              captures: { err: $.data.error_id }
            - call: "POST /planning/cois/${coi_id}/verify"
              payload: {}
