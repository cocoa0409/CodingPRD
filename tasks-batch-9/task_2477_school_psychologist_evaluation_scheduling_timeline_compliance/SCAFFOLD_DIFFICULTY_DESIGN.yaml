            - "GET /psych-services/evaluations/${eval1}/timeline-exclusions returns an empty list — no TimelineExclusion row was created"
            - "Psychologist.${pa}.open_case_points == 0 and Evaluation.${eval1}.credited_exclusion_days == 0"

