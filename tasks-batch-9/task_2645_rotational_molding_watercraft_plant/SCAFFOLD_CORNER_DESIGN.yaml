            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CVJ-A", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-CVJ", trailer_cube_capacity_m3: 1.8518, trailer_max_payload_kg: 1000.000 }
              as: LogisticsPlanner
