  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: transfer_default_posture_beats_commitment_overflow
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_FACILITY_IN_DEFAULT]
          - errors[ERR_TRANSFER_EXCEEDS_COMMITMENT]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a transfer proposal made while the facility
          is IN_DEFAULT whose amount also exceeds the transferor's commitment must return
          ERR_FACILITY_IN_DEFAULT (priority 7), never ERR_TRANSFER_EXCEEDS_COMMITMENT (13).
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 funded et al), draw SETTLED, default declared so facility IN_DEFAULT"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Prio Borrower", sector: "ENERGY", risk_rating: "SPECULATIVE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Prio", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 4000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 400000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/default_cases", payload: { facility_id: "${f_id}", default_type: "PAYMENT_DEFAULT" }, as: AgentBank }
          trigger:
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 9999999999, settlement_date: "2026-09-15", transferee_name: "Overflow Buyer" }, as: ParticipantLender, as_user_id: "${p1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACILITY_IN_DEFAULT (state, priority 7) — NOT ERR_TRANSFER_EXCEEDS_COMMITMENT (business_fiscal, priority 13)"
            - "HTTP status == 409"

      - name: exited_participant_vote_beats_voting_window_close
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_PARTICIPANT_NOT_ELIGIBLE]
          - errors[ERR_VOTING_CLOSED]
        distinguishing_aspect: |
          Category pair business_referential vs business_temporal: an EXITED participant
          voting after the voting window closed must receive ERR_PARTICIPANT_NOT_ELIGIBLE
          (priority 11), never ERR_VOTING_CLOSED (priority 12).
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 3,000,000 / P3 1,000,000 funded); P3 fully transferred out (EXITED) to new entrant P4"
            - "COVENANT_WAIVER solicitation opened 2026-08-18, window closed 2026-09-02; clock now 2026-09-03"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Prio2 Borrower", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Prio2", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 300000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 100000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-08-10", transferee_name: "P4 Bank" }, as: ParticipantLender, as_user_id: "${p3_id}", captures: { t_id: $.data.id } }
            - { call: "POST /api/transfers/${t_id}/approve", payload: {}, as: AgentBank }
            - { call: "GET /api/participants/${p3_id}", as: AgentBank, captures: { p3_v: $.data.version } }
            - { call: "POST /api/transfers/${t_id}/settle", payload: { expected_from_participant_version: "${p3_v}" }, as: AgentBank }
            - { call: "POST /api/modification_requests", payload: { facility_id: "${f_id}", modification_type: "COVENANT_WAIVER", terms: { waiver_text: "Waive coverage ratio" } }, as: Borrower, as_user_id: "${b_id}", captures: { m_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T00:00:00Z" }, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p3_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PARTICIPANT_NOT_ELIGIBLE (business_referential, priority 11) — NOT ERR_VOTING_CLOSED (business_temporal, priority 12)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: consent_threshold_exact_boundary_pass_and_fail
        grounds:
          - calculations.consent_tally
          - state_machines.ModificationRequest.SOLICITING_to_PASSED
          - state_machines.ModificationRequest.SOLICITING_to_FAILED
        distinguishing_aspect: |
          Metric: approving_share_bps at the exact majority threshold. FacA voter holds
          5,001,000 of 10,000,000 -> floor(10000*5,001,000/10,000,000) == 5001 >= 5001 passes;
          FacB voter holds 5,000,500 -> floor(...5000.5) == 5000 < 5001 fails (while its cast
          share 5000 meets quorum 5000 exactly). Endpoint: POST .../tally_close.
        test_recipe:
          setup:
            - "FacA 10,000,000 with X 5,001,000 + Y 4,999,000 funded; FacB 10,000,000 with X2 5,000,500 + Y2 4,999,500 funded"
            - "One MAJORITY (COVENANT_WAIVER) solicitation per facility, votes cast, clock past each close"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Thresh Borrower", sector: "INDUSTRIAL", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac ThreshA", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { fa: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac ThreshB", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { fb: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${fa}", participant_name: "X", commitment_cents: 5001000 }, as: AgentBank, captures: { xa: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${fa}", participant_name: "Y", commitment_cents: 4999000 }, as: AgentBank, captures: { ya: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${fb}", participant_name: "X2", commitment_cents: 5000500 }, as: AgentBank, captures: { xb: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${fb}", participant_name: "Y2", commitment_cents: 4999500 }, as: AgentBank, captures: { yb: $.data.id } }
            - { call: "POST /api/participants/${xa}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${ya}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${xb}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${yb}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${fa}", as: AgentBank, captures: { fa_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${fa}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${fa_v}" }, as: AgentBank, captures: { da: $.data.id } }
            - { call: "GET /api/facilities/${fb}", as: AgentBank, captures: { fb_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${fb}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${fb_v}" }, as: AgentBank, captures: { db: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${xa}", as: AgentBank, captures: { sxa: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${ya}", as: AgentBank, captures: { sya: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${xb}", as: AgentBank, captures: { sxb: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${yb}", as: AgentBank, captures: { syb: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${sxa}/report_wire", payload: { amount_cents: 500100 }, as: ParticipantLender, as_user_id: "${xa}" }
            - { call: "POST /api/funding_settlements/${sxa}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${sya}/report_wire", payload: { amount_cents: 499900 }, as: ParticipantLender, as_user_id: "${ya}" }
            - { call: "POST /api/funding_settlements/${sya}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${sxb}/report_wire", payload: { amount_cents: 500100 }, as: ParticipantLender, as_user_id: "${xb}" }
            - { call: "POST /api/funding_settlements/${sxb}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${syb}/report_wire", payload: { amount_cents: 499900 }, as: ParticipantLender, as_user_id: "${yb}" }
            - { call: "POST /api/funding_settlements/${syb}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests", payload: { facility_id: "${fa}", modification_type: "COVENANT_WAIVER", terms: { waiver_text: "A" } }, as: Borrower, as_user_id: "${b_id}", captures: { ma: $.data.id } }
            - { call: "POST /api/modification_requests/${ma}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${ma}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${xa}" }
            - { call: "POST /api/modification_requests", payload: { facility_id: "${fb}", modification_type: "COVENANT_WAIVER", terms: { waiver_text: "B" } }, as: Borrower, as_user_id: "${b_id}", captures: { mb: $.data.id } }
            - { call: "POST /api/modification_requests/${mb}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${mb}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${xb}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/modification_requests/${ma}/tally_close", payload: {}, as: AgentBank, captures: { res_a: $.data.status } }
            - { call: "POST /api/modification_requests/${mb}/tally_close", payload: {}, as: AgentBank, captures: { res_b: $.data.status } }
          assert:
            - "ModificationRequest.${ma}.status == PASSED with approving_share_bps == 5001 (exactly at threshold, >= is inclusive)"
            - "ModificationRequest.${mb}.status == FAILED with approving_share_bps == 5000 (one bp short after floor)"
            - "ModificationRequest.${mb}.cast_share_bps == 5000 (quorum boundary 5000 met exactly, so it FAILED rather than EXPIRED)"

      - name: draw_headroom_exact_equality_boundary
        grounds:
          - validations[priority=13]
          - errors[ERR_DRAW_EXCEEDS_COMMITMENT]
          - concurrency_rules[draw-create-stale-facility]
        distinguishing_aspect: |
          Metric: cumulative draw cents vs total_commitment_cents. 6,000,000 then 4,000,000
          draws equal the 10,000,000 commitment exactly and succeed (== is allowed); one more
          cent overflows and fails with ERR_DRAW_EXCEEDS_COMMITMENT. Endpoint: POST /api/draws.
        test_recipe:
          setup:
            - "Facility total_commitment 10,000,000 with a single participant 10,000,000 committed (status COMMITTED)"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Headroom Borrower", sector: "REAL_ESTATE", risk_rating: "INVESTMENT_GRADE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Head", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "Solo", commitment_cents: 10000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v1: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 6000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-02-01", expected_facility_version: "${f_v1}" }, as: AgentBank, captures: { d1: $.data.id } }
          trigger:
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v2: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 4000000, accrual_start_date: "2027-02-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v2}" }, as: AgentBank, captures: { d2: $.data.id } }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v3: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1, accrual_start_date: "2027-08-01", accrual_end_date: "2028-02-01", expected_facility_version: "${f_v3}" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "Draw.${d2} created with 201 (cumulative 10,000,000 == total_commitment exactly: equality allowed)"
            - "third draw: error_id == ERR_DRAW_EXCEEDS_COMMITMENT, HTTP 409 (one cent over)"
            - "Facility.${f_id}.status == FUNDING (draws open, none settled)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: draw_settles_only_when_all_settlements_confirmed
        grounds:
          - state_machines.Draw.FUNDING_to_SETTLED
          - state_machines.FundingSettlement.WIRED_to_CONFIRMED
        distinguishing_aspect: |
          Pair Draw -> FundingSettlement: the draw stays FUNDING while any sibling settlement
          is unconfirmed, and bubbles to SETTLED only when the last one confirms (facility
          then bubbles FUNDING -> ACTIVE).
        test_recipe:
          setup:
            - "Facility 2,000,000 with P1/P2 1,000,000 each committed; draw 2,000,000 with two settlements"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Bubble Borrower", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Bub", total_commitment_cents: 2000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 1000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 1000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 2000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank, captures: { draw_mid: $.data.id } }
          trigger:
            - { call: "GET /api/draws/${d_id}", as: AgentBank, captures: { d_status_mid: $.data.status } }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 1000000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "GET /api/draws/${d_id}", as: AgentBank, captures: { d_status_end: $.data.status } }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_status_end: $.data.status } }
          assert:
            - "after first confirm only: Draw.${d_id}.status == FUNDING (blocked by unconfirmed sibling)"
            - "after second confirm: Draw.${d_id}.status == SETTLED, outstanding_cents == 2000000"
            - "Facility.${f_id}.status == ACTIVE (bubble on first settled draw)"
            - "Participant.${p1_id}.status == FUNDED and Participant.${p2_id}.status == FUNDED"

      - name: modification_tally_depends_on_vote_aggregation
        grounds:
          - state_machines.ModificationRequest.SOLICITING_to_FAILED
          - calculations.consent_tally
        distinguishing_aspect: |
          Pair ModificationRequest -> ConsentVote: the tally outcome is a pure function of
          sibling vote entities — ABSTAIN counts toward quorum but not approval, so
          P1 ABSTAIN + P2 APPROVE yields FAILED (approving 3000 < 5001, cast 9000 >= 5000).
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 3,000,000 / P3 1,000,000 funded); MAJORITY solicitation open 2026-08-01, votes: P1 ABSTAIN, P2 APPROVE; clock past close"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Tally Borrower", sector: "TECHNOLOGY", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Tally", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 300000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 100000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests", payload: { facility_id: "${f_id}", modification_type: "COVENANT_WAIVER", terms: { waiver_text: "T" } }, as: Borrower, as_user_id: "${b_id}", captures: { m_id: $.data.id } }
            - { call: "POST /api/modification_requests/${m_id}/solicit", payload: {}, as: AgentBank }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "ABSTAIN" }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/modification_requests/${m_id}/votes", payload: { vote: "APPROVE" }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: AgentBank }
          trigger:
            - { call: "POST /api/modification_requests/${m_id}/tally_close", payload: {}, as: AgentBank }
          assert:
            - "ModificationRequest.${m_id}.approving_share_bps == 3000 and cast_share_bps == 9000"
            - "ModificationRequest.${m_id}.status == FAILED (quorum met via ABSTAIN, approval threshold missed)"

      - name: transfer_settle_gated_on_facility_posture
        grounds:
          - state_machines.ParticipationTransfer.AGENT_APPROVED_to_SETTLED
          - validations[priority=7]
          - errors[ERR_FACILITY_IN_DEFAULT]
        distinguishing_aspect: |
          Pair ParticipationTransfer -> Facility: a transfer approved while ACTIVE cannot
          settle once the facility has entered IN_DEFAULT — the settle precondition reads a
          different entity's state (distinct pair from Draw->Settlement and Mod->Vote).
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 4,000,000 funded); P2's 1,000,000 transfer to a new entrant is AGENT_APPROVED; then a default is declared"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Gate Borrower", sector: "ENERGY", risk_rating: "SPECULATIVE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Gate", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 4000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 600000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 400000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-09-10", transferee_name: "Gate Buyer" }, as: ParticipantLender, as_user_id: "${p2_id}", captures: { t_id: $.data.id } }
            - { call: "POST /api/transfers/${t_id}/approve", payload: {}, as: AgentBank }
            - { call: "POST /api/default_cases", payload: { facility_id: "${f_id}", default_type: "COVENANT_DEFAULT" }, as: AgentBank }
            - { call: "GET /api/participants/${p2_id}", as: AgentBank, captures: { p2_v: $.data.version } }
          trigger:
            - { call: "POST /api/transfers/${t_id}/settle", payload: { expected_from_participant_version: "${p2_v}" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACILITY_IN_DEFAULT, HTTP 409 — settle blocked by the FACILITY's state, not the transfer's"
            - "ParticipationTransfer.${t_id}.status remains AGENT_APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics & resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: draw_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=10]
          - errors[ERR_DRAW_WINDOW_OVERLAP]
          - entities.Draw.fields.accrual_start_date
        distinguishing_aspect: |
          Resource: the facility's accrual calendar via Draw. HALF-OPEN semantics: a draw
          starting exactly at the previous draw's end (2026-09-01 == end) is allowed, while
          a window straddling the interior (2026-08-15..2026-09-15) is rejected.
        test_recipe:
          setup:
            - "Facility 10,000,000 with one participant committed; draw1 [2026-08-01, 2026-09-01) created"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Window Borrower", sector: "INDUSTRIAL", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Win", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "Solo", commitment_cents: 10000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v1: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-01", accrual_end_date: "2026-09-01", expected_facility_version: "${f_v1}" }, as: AgentBank, captures: { d1: $.data.id } }
          trigger:
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v2: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-09-01", accrual_end_date: "2026-10-01", expected_facility_version: "${f_v2}" }, as: AgentBank, captures: { d2: $.data.id } }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v3: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 1000000, accrual_start_date: "2026-08-15", accrual_end_date: "2026-09-15", expected_facility_version: "${f_v3}" }, as: AgentBank, captures: { err: $.data.error_id } }
          assert:
            - "Draw.${d2} created with 201 (half-open adjacency: start == prior end does not overlap)"
            - "third draw: error_id == ERR_DRAW_WINDOW_OVERLAP, HTTP 409 (interior intersection)"

      - name: package_windows_closed_interval_adjacency_collides
        grounds:
          - validations[priority=10]
          - errors[ERR_PACKAGE_WINDOW_OVERLAP]
          - entities.ReportingPackage.fields.period_start_date
        distinguishing_aspect: |
          Resource: the facility's reporting calendar via ReportingPackage. CLOSED-interval
          semantics: a package whose start equals the previous package's end (2026-06-30)
          COLLIDES (both endpoints inclusive) — the exact opposite of the draw half-open rule;
          a start one day later (2026-07-01) is accepted.
        test_recipe:
          setup:
            - "Facility exists (no participants needed); package Pkg1 covering CLOSED [2026-06-01, 2026-06-30]"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Pkg Borrower", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Pkg", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/reporting_packages", payload: { facility_id: "${f_id}", period_label: "2026-06", period_start_date: "2026-06-01", period_end_date: "2026-06-30", due_date: "2026-08-15" }, as: AgentBank, captures: { pkg1: $.data.id } }
          trigger:
            - { call: "POST /api/reporting_packages", payload: { facility_id: "${f_id}", period_label: "2026-07", period_start_date: "2026-06-30", period_end_date: "2026-07-31", due_date: "2026-09-15" }, as: AgentBank, captures: { err: $.data.error_id } }
            - { call: "POST /api/reporting_packages", payload: { facility_id: "${f_id}", period_label: "2026-07b", period_start_date: "2026-07-01", period_end_date: "2026-07-31", due_date: "2026-09-15" }, as: AgentBank, captures: { pkg3: $.data.id } }
          assert:
            - "second package: error_id == ERR_PACKAGE_WINDOW_OVERLAP, HTTP 409 (closed interval: shared endpoint 2026-06-30 collides)"
            - "third package created with 201 (start 2026-07-01 is strictly outside the closed interval)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: waterfall_conservation_and_reversal_compensation
        grounds:
          - calculations.waterfall_distribution
          - state_machines.BorrowerPayment.REMITTED_to_REVERSED
          - state_machines.DistributionLine.REMITTED_to_CLAWED_BACK
        distinguishing_aspect: |
          Conserved quantity: payment cents and the facility principal ledger. fee + pools ==
          payment amount at every run; the reverse transition (compensating action) restores
          outstanding_principal_cents, accrued_interest_cents, and every participant
          cumulative field to exactly their pre-payment values — zero drift.
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 3,000,000 / P3 1,000,000 funded), draw 5,000,000 SETTLED 2026-08-01"
            - "Payment 200,000 value 2026-08-31 distributed and remitted"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Conserve Borrower", sector: "HEALTHCARE", risk_rating: "INVESTMENT_GRADE" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Cons", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { f_v: $.data.version } }
            - { call: "POST /api/draws", payload: { facility_id: "${f_id}", draw_amount_cents: 5000000, accrual_start_date: "2026-08-01", accrual_end_date: "2027-08-01", expected_facility_version: "${f_v}" }, as: AgentBank, captures: { d_id: $.data.id } }
            - { call: "GET /api/funding_settlements?participant_id=${p1_id}", as: AgentBank, captures: { s1: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p2_id}", as: AgentBank, captures: { s2: '$.data[0].id' } }
            - { call: "GET /api/funding_settlements?participant_id=${p3_id}", as: AgentBank, captures: { s3: '$.data[0].id' } }
            - { call: "POST /api/funding_settlements/${s1}/report_wire", payload: { amount_cents: 3000000 }, as: ParticipantLender, as_user_id: "${p1_id}" }
            - { call: "POST /api/funding_settlements/${s1}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s2}/report_wire", payload: { amount_cents: 1500000 }, as: ParticipantLender, as_user_id: "${p2_id}" }
            - { call: "POST /api/funding_settlements/${s2}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/funding_settlements/${s3}/report_wire", payload: { amount_cents: 500000 }, as: ParticipantLender, as_user_id: "${p3_id}" }
            - { call: "POST /api/funding_settlements/${s3}/confirm", payload: {}, as: AgentBank }
            - { call: "POST /api/payments", payload: { facility_id: "${f_id}", payment_type: "REGULAR", amount_cents: 200000, value_date: "2026-08-31" }, as: Borrower, as_user_id: "${b_id}", captures: { pay_id: $.data.id, pay_v: $.data.version } }
            - { call: "POST /api/payments/${pay_id}/distribution_runs", payload: { expected_payment_version: "${pay_v}" }, as: AgentBank, captures: { run_id: $.data.id } }
            - { call: "POST /api/distribution_runs/${run_id}/remit", payload: {}, as: AgentBank }
          trigger:
            - { call: "POST /api/payments/${pay_id}/reverse", payload: {}, as: AgentBank }
          assert:
            - "conservation at run: 1041 + 50000 + 148959 == 200000 == BorrowerPayment.${pay_id}.amount_cents"
            - "after reverse: BorrowerPayment.${pay_id}.status == REVERSED; both lines CLAWED_BACK"
            - "Facility.${f_id}.outstanding_principal_cents == 5000000 (restored exactly)"
            - "Facility.${f_id}.accrued_interest_cents == 50000 (restored exactly)"
            - "Participant.${p1_id}.cumulative_interest_cents == 0 and cumulative_principal_cents == 0 (clawback leaves no drift)"
            - "Participant.${p2_id}.cumulative_interest_cents == 0 and Participant.${p3_id}.cumulative_principal_cents == 0"

      - name: transfer_settle_conserves_total_commitment
        grounds:
          - state_machines.ParticipationTransfer.AGENT_APPROVED_to_SETTLED
          - calculations.committed_recompute
          - calculations.participant_share_bps
        distinguishing_aspect: |
          Conserved quantity: facility.committed_cents. A 1,000,000 partial transfer shifts
          commitment between participants but the facility total is byte-identical before and
          after settle (10,000,000), with shares rebased to 6000/2000/1000 — a different
          conserved quantity from the payment-cents invariant.
        test_recipe:
          setup:
            - "Facility 10,000,000 (P1 6,000,000 / P2 3,000,000 / P3 1,000,000, all COMMITTED, no draw yet so transferor is COMMITTED)"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "Xfer Borrower", sector: "FINANCIAL", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
            - { call: "POST /api/facilities", payload: { borrower_id: "${b_id}", facility_name: "Fac Xfer", total_commitment_cents: 10000000, currency: "USD", interest_rate_bps: 1200, day_count_basis: "ACT_360", servicing_fee_bps: 25, default_interest_addon_bps: 800, maturity_date: "2031-08-01" }, as: AgentBank, captures: { f_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P1", commitment_cents: 6000000 }, as: AgentBank, captures: { p1_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P2", commitment_cents: 3000000 }, as: AgentBank, captures: { p2_id: $.data.id } }
            - { call: "POST /api/participants", payload: { facility_id: "${f_id}", participant_name: "P3", commitment_cents: 1000000 }, as: AgentBank, captures: { p3_id: $.data.id } }
            - { call: "POST /api/participants/${p1_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p2_id}/commit", payload: {}, as: AgentBank }
            - { call: "POST /api/participants/${p3_id}/commit", payload: {}, as: AgentBank }
            - { call: "GET /api/facilities/${f_id}", as: AgentBank, captures: { comm_before: $.data.committed_cents } }
            - { call: "POST /api/transfers", payload: { facility_id: "${f_id}", transfer_amount_cents: 1000000, settlement_date: "2026-08-20", transferee_name: "P4 Bank" }, as: ParticipantLender, as_user_id: "${p2_id}", captures: { t_id: $.data.id } }
            - { call: "POST /api/transfers/${t_id}/approve", payload: {}, as: AgentBank }
            - { call: "GET /api/participants/${p2_id}", as: AgentBank, captures: { p2_v: $.data.version } }
          trigger:
            - { call: "POST /api/transfers/${t_id}/settle", payload: { expected_from_participant_version: "${p2_v}" }, as: AgentBank, captures: { t_status: $.data.status } }
          assert:
            - "Facility.${f_id}.committed_cents == 10000000 (identical before and after settle — conserved)"
            - "Participant.${p2_id}.commitment_cents == 2000000 (decremented by the transfer amount)"
            - "new participant (transferee P4 Bank) created with commitment_cents == 1000000 and status == COMMITTED (transferor's status)"
            - "shares rebased: P1 == 6000, P2 == 2000, P4 == 1000 bps"
            - "ParticipationTransfer.${t_id}.status == SETTLED"


