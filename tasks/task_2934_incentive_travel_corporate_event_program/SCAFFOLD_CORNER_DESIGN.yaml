      trigger:
      - 'GET /programs/${p_id} three times: once with the X-User-Role header absent, once with the X-User-ID
        header absent, and once with X-User-Role sent as the empty string "".'
      - 'GET /programs/${p_id} with X-User-Role: "ProgramManager", and again with X-User-Role: "programdirector".'
      - 'POST /programs {"name": "FY27", "fiscal_year": 2027, "qualification_metric": "NET_REVENUE_CENTS",
        "sales_period_start": "2027-01-01T00:00:00Z", "sales_period_end": "2027-06-30T00:00:00Z", "budget_total_cents":
        100000} as SourcingManager sm-01.'
      - 'POST /award-tiers as ProgramDirector pd-01 five times: omitting tier_rank; with tier_rank "3"
        as a JSON string; with air_cabin_class "FIRST"; with budget_per_qualifier_cents -1; and finally
        a well-formed BRONZE tier (tier_rank 3) carrying an extra unknown field "colour": "bronze".'
      - GET /qualifiers?program_id=${p_id} with limit=0, then limit=101, then offset=-1, then limit=abc.
      - 'Ten existence probes, each with the path id 00000000-0000-0000-0000-000000009999: GET /programs/{id};
        GET /award-tiers/{id}; POST /qualifiers/{id}/review; POST /destinations/{id}/site-inspection {"inspection_score":
        80}; POST /supplier-contracts/{id}/execute; POST /deposit-milestones/{id}/pay; POST /registrations/{id}/confirm;
        GET /onsite-activities/{id}; GET /activity-signups/{id}; GET /tax-award-reports/{id}.'
      - 'POST /award-tiers {"program_id": "00000000-0000-0000-0000-000000009999", "tier_code": "TITANIUM",
        "tier_rank": 9, "qualification_threshold": 1, "budget_per_qualifier_cents": 1, "guest_allowance":
        0, "air_cabin_class": "ECONOMY", "upgrade_allowance_cents": 0, "service_load_bp": 100} as ProgramDirector
        pd-01.'
      - 'GET /programs/00000000-0000-0000-0000-000000009999 with X-User-Role: "ProgramManager", and POST
        /programs with a body missing "name" as SourcingManager sm-01.'
      assert:
      - All three header probes return ERR_MISSING_AUTH_HEADERS with HTTP 401 — an empty-string role is
        treated as absent, not as an unknown role.
      - Both bad-role probes return ERR_INVALID_ROLE with HTTP 401; role names are matched exactly, so
        "programdirector" is not "ProgramDirector".
      - POST /programs as SourcingManager returns ERR_ROLE_NOT_PERMITTED with HTTP 403.
      - The first four POST /award-tiers probes return ERR_INVALID_REQUEST with HTTP 400 (missing required
        field, wrong JSON type, enum outside its declared set, integer below its declared range), and
        GET /award-tiers?program_id=${p_id} still returns total_count 2 afterwards.
      - 'The fifth POST /award-tiers returns 201 and total_count becomes 3: an unknown field is ignored,
        never rejected, and the created row carries no "colour" attribute.'
      - All four pagination probes return ERR_INVALID_REQUEST with HTTP 400.
      - The ten existence probes return, in order, ERR_PROGRAM_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_QUALIFIER_NOT_FOUND,
        ERR_DESTINATION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND,
        ERR_ACTIVITY_NOT_FOUND, ERR_SIGNUP_NOT_FOUND and ERR_TAX_REPORT_NOT_FOUND — each with HTTP 404.
        All ten *_NOT_FOUND ids in §1.6 are therefore triggerable.
      - 'The body-level probe returns ERR_PROGRAM_NOT_FOUND with HTTP 404: priority 5 applies to foreign
        keys in the body exactly as it does to path ids.'
      - GET /programs/00000000-0000-0000-0000-000000009999 with an unknown role returns ERR_INVALID_ROLE
        (401) and NOT ERR_PROGRAM_NOT_FOUND — priority 2 precedes priority 5. POST /programs with a malformed
        body as SourcingManager returns ERR_ROLE_NOT_PERMITTED (403) and NOT ERR_INVALID_REQUEST — priority
        3 precedes priority 7.
