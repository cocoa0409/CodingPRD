              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
