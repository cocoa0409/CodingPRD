          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "One ONLINE STANDARD tank with 5 slots and 0 occupied slots."
            - "One PRIVATE_FAMILY enrollment, CONSENTED, with a COMPLETED NON_REACTIVE panel."
