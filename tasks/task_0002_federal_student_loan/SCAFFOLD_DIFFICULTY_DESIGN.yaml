              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 3000000, interest_rate_bps: 533, disbursement_date: "2025-01-01T00:00:00Z" }
              as: LoanServicer
