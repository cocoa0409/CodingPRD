      - name: maintenance_buffered_inclusive_window_conflict
        grounds:
          - validations[priority=23]
          - entities.MaintenanceWindow.fields.blocked_start_date
        distinguishing_aspect: |
          Resource Building (different resource than Room) with INCLUSIVE buffered
          DATE semantics: blocked interval [start-buffer, end+buffer] includes both
          ends and is intersected against occupied NIGHTS [checkin_date,
