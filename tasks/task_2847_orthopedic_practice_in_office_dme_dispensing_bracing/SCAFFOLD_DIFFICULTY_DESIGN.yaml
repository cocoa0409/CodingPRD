  - rule_id: non_linear_state_machine
    instances:
      - name: encounter_parallel_clinical_and_financial_dimensions_evolve_independently
        grounds:
          - state_machines.DispenseEncounter.DRAFT_to_DOCUMENTED
          - state_machines.DispenseEncounter.DOCUMENTED_to_RESERVED
          - state_machines.DispenseEncounter.RESERVED_to_RESERVED
          - state_machines.DispenseEncounter.RESERVED_to_FITTED
          - state_machines.DispenseEncounter.UNVERIFIED_to_VERIFIED
          - state_machines.DispenseEncounter.VERIFIED_to_BILLED
          - entities.DispenseEncounter.fields.clinical_status
          - entities.DispenseEncounter.fields.financial_status
        distinguishing_aspect: |
          Non-linear shape #1 is PARALLEL state dimensions on DispenseEncounter:
          clinical_status and financial_status live on the same row and advance
          on disjoint triggers -- a coverage verification moves only
          financial_status, a reservation and a fitting move only
          clinical_status, and an ADJUST_NEEDED fitting is a RESERVED -> RESERVED
          self-loop -- while POST dispense is the single trigger that moves both
          at once. The other two instances of this rule are on CustomFabOrder
          (a revision cycle) and ProductReturn (a fork-join), i.e. different
          entities.
        test_recipe:
          setup:
            - "one accredited clinic with a stocked LSO shelf (par_min 4, 10 units received), two group physicians, one credentialed fitter, one patient"
            - "one encounter for 1 unit whose medical-necessity note and IOAS attestation are already recorded, so clinical_status is DOCUMENTED and financial_status is still UNVERIFIED"
