    roles: [Customer, ServiceAgent, RepairTechnician, PartsCoordinator, ProgramAdmin]
    code: 200
    input: ["category?", "successor_model_id?", "parts_support_status?", "repairability_flag?", "limit?", "offset?"]
    output: GearModel[]
