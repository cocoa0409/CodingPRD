              as: TCCoordinator
              captures: { entry2_id: $.data.id }
            - call: "POST /aha/course-sessions/${s2_id}/start"
              payload: {}
              as: TCCoordinator
            - call: "POST /aha/roster-entries/${entry2_id}/skills-evaluations"
              payload: { items: [{ item_code: "SCENE", critical: true, passed: true }] }
              as: Instructor
