            - "response.data.error_id == ERR_FORBIDDEN"

      - name: rbac_missing_headers_returns_401
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role -> ERR_UNAUTHENTICATED (401); auth precedes all other checks."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-0000000000aa"
              as: NoSuchRole
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

