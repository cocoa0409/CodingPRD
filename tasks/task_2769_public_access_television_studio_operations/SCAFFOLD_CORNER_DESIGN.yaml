            - "${missing_ref_err} == ERR_LICENSE_REFERENCE_REQUIRED (422) for the COPYRIGHT_CLEARANCE attestation with no license_reference"
            - "Exactly one Attestation row exists for kind COPYRIGHT_CLEARANCE afterwards, namely ${copy_id}, with ${copy_ref} == ASCAP-2026-11824"
            - "${clear_final} == CLEARED once all three REQUIRED_ATTESTATION_KINDS are on file at statement_version 2026.1, and ${policy_seq} == 3 == ${seq_high}"
            - "Producer.${p_id}.indemnification_expires_at == 2027-08-01T00:00:00Z (clock 2026-08-01 plus INDEMNIFICATION_TERM_DAYS)"

