# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Visitor Management & Lobby Check-In — Expert band
# 9 rule_ids x >= 2 instances = 18 instances total
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_delivery_invoice_round_order_on_deliverylog
        grounds:
          - calculations.delivery_handling_invoice
          - entities.DeliveryLog.fields.handling_invoice_cents
          - entities.DeliveryLog.fields.parcel_fees_cents
        distinguishing_aspect: |
          On the DeliveryLog domain, round-per-parcel-then-sum yields 351 cents while the
          rejected sum-then-round-once order yields 352 cents for parcels [107,107,113] at 7.5%.
        test_recipe:
          setup:
            - "A Site and a Host exist."
            - "A delivery is logged with parcel_fees_cents [107,107,113]."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { host_id: "${host_id}", carrier: "FEDEX", parcel_fees_cents: [107, 107, 113] }
              as: LobbyAttendant
              captures: { delivery_id: $.data.id }
          assert:
            - "DeliveryLog.${delivery_id}.handling_invoice_cents == 351"
            - "DeliveryLog.${delivery_id}.status == RECEIVED"

      - name: dvc_screening_decision_dominance_on_visit
        grounds:
          - calculations.screening_decision
          - calculations.risk_score
          - state_machines.Visit.SCREENING_to_DENIED
          - state_machines.Visit.SCREENING_to_FLAGGED
        distinguishing_aspect: |
          On the Visit domain, the dominance variant routes a visit matching BOTH a DENY and a
          REVIEW watchlist entry to DENIED (terminal), not FLAGGED — DENY strictly dominates REVIEW.
        test_recipe:
          setup:
            - "A Site, Floor and Host exist."
            - "Two active WatchlistEntries for the site: a NAME entry severity DENY and a COMPANY entry severity REVIEW."
            - "A PREREGISTERED visit whose visitor_full_name matches the DENY entry and visitor_company matches the REVIEW entry, id_scanned true."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "NAME", match_value_normalized: "jordan blake", severity: "DENY", active: true }
              as: SecurityOfficer
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "COMPANY", match_value_normalized: "acme corp", severity: "REVIEW", active: true }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Jordan Blake", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
              captures: { vstatus: $.data.status }
          assert:
            - "Visit.${visit_id}.status == DENIED"
            - "Visit.${visit_id}.risk_score == 80"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_delivery_invoice_nested_rounding_order_mode_b
        grounds:
          - calculations.delivery_handling_invoice
          - entities.DeliveryLog.fields.parcel_fees_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: rounding each parcel surcharge to cents BEFORE summing
          gives 351, whereas summing raw then rounding once gives 352 — the scaffold pins
          round-per-parcel-then-sum.
        test_recipe:
          setup:
            - "A Site and Host exist; a delivery with parcel_fees_cents [107,107,113]."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { host_id: "${host_id}", carrier: "UPS", parcel_fees_cents: [107, 107, 113] }
              as: LobbyAttendant
              captures: { delivery_id: $.data.id }
          assert:
            - "DeliveryLog.${delivery_id}.handling_invoice_cents == 351"

      - name: cf_risk_score_three_input_nonlinear_clamp_mode_a
        grounds:
          - calculations.risk_score
          - entities.WatchlistEntry.fields.match_type
          - entities.Visit.fields.id_scanned
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: name_hit*50 + company_hit*30 + no_photo_id*15
          with a clamp to [0,100]; with all three inputs = 1 the raw 95 stays 95 (under ceiling),
          exercising the weighted sum and clamp branch together.
        test_recipe:
          setup:
            - "A Site, Floor, Host exist; one active NAME DENY entry and one active COMPANY REVIEW entry."
            - "A PREREGISTERED visit matching both, id_scanned FALSE (no_photo_id=1)."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "NAME", match_value_normalized: "jordan blake", severity: "DENY", active: true }
              as: SecurityOfficer
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "COMPANY", match_value_normalized: "acme corp", severity: "REVIEW", active: true }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Jordan Blake", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: false }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.risk_score == 95"
            - "Visit.${visit_id}.status == DENIED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_visit_branch_fork_at_screening
        grounds:
          - state_machines.Visit.SCREENING_to_CLEARED
          - state_machines.Visit.SCREENING_to_FLAGGED
          - state_machines.Visit.SCREENING_to_DENIED
        distinguishing_aspect: |
          The Visit machine forks at SCREENING into three branches (CLEARED / FLAGGED / DENIED)
          with divergent side-effect sets — only the DENIED branch voids PENDING agreements.
        test_recipe:
          setup:
            - "A Site, Floor, Host exist; one active COMPANY REVIEW watchlist entry only."
            - "A PREREGISTERED visit whose company matches the REVIEW entry, id_scanned true."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "COMPANY", match_value_normalized: "acme corp", severity: "REVIEW", active: true }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Clean Visitor", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.status == FLAGGED"
            - "Visit.${visit_id}.risk_score == 30"

      - name: nlsm_contractorpass_cyclic_active_suspended
        grounds:
          - state_machines.ContractorPass.ACTIVE_to_SUSPENDED
          - state_machines.ContractorPass.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          The ContractorPass machine is cyclic: ACTIVE->SUSPENDED->ACTIVE returns the pass to a
          state it already occupied, distinct from the linear Visit pipeline.
        test_recipe:
          setup:
            - "A Site and Host exist; an ACTIVE ContractorPass."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /contractor-passes"
              payload: { host_id: "${host_id}", contractor_name: "Pat Builder", contractor_company: "BuildCo", access_valid_from: "2026-06-01T00:00:00Z", access_valid_until: "2026-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { pass_id: $.data.id }
            - call: "POST /contractor-passes/${pass_id}/suspend"
              payload: {}
              as: SecurityOfficer
          trigger:
            - call: "POST /contractor-passes/${pass_id}/reactivate"
              payload: {}
              as: SecurityOfficer
          assert:
            - "ContractorPass.${pass_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_screen_deny_voids_agreement_depth3
        grounds:
          - state_machines.Visit.PREREGISTERED_to_SCREENING
          - state_machines.Visit.SCREENING_to_DENIED
          - state_machines.Agreement.PENDING_to_VOID
          - calculations.screening_decision
        distinguishing_aspect: |
          Depth-3 chain: POST /screen drives PREREGISTERED->SCREENING (risk computed), the
          SCREENING->DENIED auto-advance is caused by screening_decision==DENY, and that DENIED
          terminal in turn voids the visit's PENDING Agreement — each hop caused by the previous.
        test_recipe:
          setup:
            - "A Site, Floor, Host exist; an active NAME DENY watchlist entry."
            - "A PREREGISTERED visit matching the DENY entry (id_scanned true) with one PENDING NDA agreement attached."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "NAME", match_value_normalized: "jordan blake", severity: "DENY", active: true }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Jordan Blake", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /agreements"
              payload: { visit_id: "${visit_id}", document_kind: "NDA", document_version: "NDA-v3" }
              as: LobbyAttendant
              captures: { agreement_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.status == DENIED"
            - "Agreement.${agreement_id}.status == VOID"

      - name: tc_signin_bumps_contractor_covered_count_depth2
        grounds:
          - state_machines.Visit.CLEARED_to_SIGNED_IN
          - entities.ContractorPass.fields.covered_visit_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (sign-in, not screen): CLEARED->SIGNED_IN causes
          a cross-aggregate ContractorPass.covered_visit_count increment from 0 to 1 on first sign-in.
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor (capacity 5), Host, ACTIVE ContractorPass exist."
            - "A contractor-covered CLEARED visit (id_scanned true, no pending agreements, scheduled within pass window)."
            - "Server clock set so timestamps are deterministic."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /contractor-passes"
              payload: { host_id: "${host_id}", contractor_name: "Pat Builder", contractor_company: "BuildCo", access_valid_from: "2026-06-01T00:00:00Z", access_valid_until: "2026-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { pass_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", contractor_pass_id: "${pass_id}", visitor_full_name: "Pat Builder", visitor_company: "BuildCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
          trigger:
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.status == SIGNED_IN"
            - "ContractorPass.${pass_id}.covered_visit_count == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_beats_segregation_on_clearance
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair state(priority 6, ERR_INVALID_STATE) vs business_safety(priority 7,
          ERR_SEGREGATION_OF_DUTIES): a CLEARED (not FLAGGED) visit clearance attempted by the
          host themselves returns ERR_INVALID_STATE, because state precedence outranks segregation.
        test_recipe:
          setup:
            - "A Site, Floor, Host exist; no watchlist entries so the visit auto-CLEARS on screen."
            - "Host acts as the clearer using their own host_id (would trip segregation if state passed)."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Clean Visitor", visitor_company: "CleanCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
              captures: { visit_v: $.data.version }
          trigger:
            - call: "POST /visits/${visit_id}/clearance"
              payload: { decision: "CLEAR", expected_visit_version: "${visit_v}" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Visit.${visit_id}.status == CLEARED"

      - name: ppvc_idscan_beats_floor_capacity_on_signin
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: |
          Error-category pair business_safety(priority 8, ERR_ID_NOT_SCANNED) vs
          business_constraint(priority 14, ERR_FLOOR_AT_CAPACITY): a CLEARED visit with
          id_scanned=false on a full floor returns ERR_ID_NOT_SCANNED (lower priority wins).
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor with capacity 1 already fully occupied by another SIGNED_IN visit."
            - "A second CLEARED visit with id_scanned=false on that full floor, no pending agreements."
            - "Clock set deterministic."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 1 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "First In", visitor_company: "FirstCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${v1_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Second In", visitor_company: "SecondCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: false }
              as: LobbyAttendant
              captures: { v2_id: $.data.id }
            - call: "POST /visits/${v2_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "GET /floors/${floor_id}"
              payload: {}
              as: LobbyAttendant
              captures: { floor_v1: $.data.version }
          trigger:
            - call: "POST /visits/${v2_id}/sign-in"
              payload: { expected_floor_version: "${floor_v1}" }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ID_NOT_SCANNED"
            - "Visit.${v2_id}.status == CLEARED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_visit_duration_zero_seconds_is_zero_minutes
        grounds:
          - calculations.visit_duration
          - state_machines.Visit.SIGNED_IN_to_SIGNED_OUT
        distinguishing_aspect: |
          Metric: visit duration in minutes via ceiling. With sign_in_at == sign_out_at
          (elapsed 0 seconds) the result is exactly 0 minutes, not 1 — reached through sign-out.
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor (capacity 5), Host; a SIGNED_IN visit signed in at 09:00:00."
            - "Clock then held at 09:00:00 so sign-out elapsed is 0 seconds."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Zero Dur", visitor_company: "ZeroCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
          trigger:
            - call: "POST /visits/${visit_id}/sign-out"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.visit_duration_minutes == 0"
            - "Visit.${visit_id}.status == SIGNED_OUT"

      - name: bpc_evacuation_empty_roster_zero_head_count
        grounds:
          - entities.EvacuationEvent.fields.roster_head_count
          - entities.EvacuationEvent.fields.roster_visit_ids
        distinguishing_aspect: |
          Metric: empty-set boundary. Triggering an evacuation on a floor with zero SIGNED_IN
          visits yields roster_head_count == 0 and an empty roster_visit_ids — reached through
          the evacuation endpoint, a different endpoint from the duration boundary.
        test_recipe:
          setup:
            - "A Site and a Floor exist with no visitors signed in."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
          trigger:
            - call: "POST /evacuation-events"
              payload: { floor_id: "${floor_id}", triggered_reason: "FIRE_DRILL" }
              as: SecurityOfficer
              captures: { event_id: $.data.id }
          assert:
            - "EvacuationEvent.${event_id}.roster_head_count == 0"
            - "EvacuationEvent.${event_id}.roster_visit_ids == []"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_signin_requires_active_contractor_pass
        grounds:
          - state_machines.Visit.CLEARED_to_SIGNED_IN
          - state_machines.ContractorPass.ACTIVE_to_SUSPENDED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair Visit->ContractorPass: a CLEARED contractor-covered visit cannot sign in
          while its ContractorPass is SUSPENDED — sign-in returns ERR_PASS_NOT_ACTIVE.
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor (capacity 5), Host; an ACTIVE ContractorPass later SUSPENDED."
            - "A contractor-covered CLEARED visit (id_scanned true) within the pass window."
            - "Clock set deterministic."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /contractor-passes"
              payload: { host_id: "${host_id}", contractor_name: "Pat Builder", contractor_company: "BuildCo", access_valid_from: "2026-06-01T00:00:00Z", access_valid_until: "2026-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { pass_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", contractor_pass_id: "${pass_id}", visitor_full_name: "Pat Builder", visitor_company: "BuildCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /contractor-passes/${pass_id}/suspend"
              payload: {}
              as: SecurityOfficer
          trigger:
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PASS_NOT_ACTIVE"
            - "Visit.${visit_id}.status == CLEARED"

      - name: cesd_agreement_sign_requires_visit_signable
        grounds:
          - state_machines.Agreement.PENDING_to_SIGNED
          - state_machines.Visit.SCREENING_to_DENIED
          - errors[ERR_VISIT_NOT_SIGNABLE]
        distinguishing_aspect: |
          Entity pair Agreement->Visit: signing a PENDING agreement whose parent Visit is DENIED
          returns ERR_VISIT_NOT_SIGNABLE — a different entity pair from Visit->ContractorPass.
        test_recipe:
          setup:
            - "A Site, Floor, Host; an active NAME DENY watchlist entry."
            - "A visit matching the DENY entry with one PENDING agreement; the visit is then screened to DENIED, voiding the agreement."
            - "A SECOND PENDING agreement attached BEFORE screening so it is the one voided; we sign-attempt a fresh agreement after deny."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "NAME", match_value_normalized: "jordan blake", severity: "DENY", active: true }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Jordan Blake", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /agreements"
              payload: { visit_id: "${visit_id}", document_kind: "NDA", document_version: "NDA-v3" }
              as: LobbyAttendant
              captures: { agreement_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
          trigger:
            - call: "POST /agreements/${agreement_id}/sign"
              payload: { signer_name: "Jordan Blake" }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VISIT_NOT_SIGNABLE"
            - "Agreement.${agreement_id}.status == VOID"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_meeting_room_halfopen_adjacency_allowed
        grounds:
          - validations[priority=12]
          - entities.Visit.fields.room_id
          - errors[ERR_ROOM_CONFLICT]
        distinguishing_aspect: |
          MeetingRoom interval semantics are half-open [start,end) with zero buffer: a second
          booking starting exactly when the first ends (10:00) is ALLOWED, while one overlapping
          (09:30-10:30) is rejected with ERR_ROOM_CONFLICT.
        test_recipe:
          setup:
            - "A Site, Floor, Host, and a MeetingRoom on the floor."
            - "Visit A books the room 09:00-10:00."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /meeting-rooms"
              payload: { floor_id: "${floor_id}", name: "Room 1", seats: 6 }
              as: SecurityOfficer
              captures: { room_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", room_id: "${room_id}", visitor_full_name: "Visitor A", visitor_company: "ACo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T10:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_a_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", room_id: "${room_id}", visitor_full_name: "Visitor B", visitor_company: "BCo", scheduled_start: "2026-06-16T10:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_b_id: $.data.id }
          assert:
            - "Visit.${v_b_id}.status == PREREGISTERED"
            - "Visit.${v_b_id}.room_id == ${room_id}"

      - name: rto_parking_closed_buffer_adjacency_rejected
        grounds:
          - validations[priority=13]
          - entities.Visit.fields.parking_space_id
          - errors[ERR_PARKING_CONFLICT]
        distinguishing_aspect: |
          ParkingSpace interval semantics are closed-with-15-minute-buffer: a second reservation
          starting at 10:00 (exactly when the first ends, inside the 15-min cleaning buffer) is
          REJECTED with ERR_PARKING_CONFLICT — opposite adjacency behaviour from the meeting room.
        test_recipe:
          setup:
            - "A Site, Floor, Host, and a ParkingSpace."
            - "Visit A reserves the bay 09:00-10:00."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /parking-spaces"
              payload: { site_id: "${site_id}", bay_label: "P12" }
              as: SecurityOfficer
              captures: { space_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", parking_space_id: "${space_id}", visitor_full_name: "Visitor A", visitor_company: "ACo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T10:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_a_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", parking_space_id: "${space_id}", visitor_full_name: "Visitor B", visitor_company: "BCo", scheduled_start: "2026-06-16T10:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PARKING_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_floor_occupancy_conserved_signin_signout
        grounds:
          - calculations.floor_occupancy
          - state_machines.Visit.CLEARED_to_SIGNED_IN
          - state_machines.Visit.SIGNED_IN_to_SIGNED_OUT
        distinguishing_aspect: |
          Conserved quantity: capacity == current_occupancy + available_slots. After sign-in then
          sign-out (forward + compensating), the floor returns to current_occupancy 0 / available 5,
          identical to before the visit.
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor (capacity 5), Host; one CLEARED visit, clock set."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Conserve Me", visitor_company: "CCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
          trigger:
            - call: "POST /visits/${visit_id}/sign-out"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Floor.${floor_id}.current_occupancy == 0"
            - "Floor.${floor_id}.available_slots == 5"

      - name: ci_badge_inventory_conserved_signin_signout
        grounds:
          - calculations.badge_inventory
          - state_machines.Visit.CLEARED_to_SIGNED_IN
          - state_machines.Visit.SIGNED_IN_to_SIGNED_OUT
        distinguishing_aspect: |
          Conserved quantity: badge_total == badge_in_use + badge_available. After sign-in (badge
          printed) then sign-out (badge returned), the site returns to badge_in_use 0 /
          badge_available 3 — a different conserved quantity from floor occupancy.
        test_recipe:
          setup:
            - "A Site (badge_total 3), Floor (capacity 5), Host; one CLEARED visit, clock set."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 3 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Badge Me", visitor_company: "BCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
          trigger:
            - call: "POST /visits/${visit_id}/sign-out"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Site.${site_id}.badge_in_use == 0"
            - "Site.${site_id}.badge_available == 3"
