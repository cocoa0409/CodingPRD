              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 20000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
            - call: "POST /grain/rail-fleets"
              payload: { home_location_id: "${loc1_id}", fleet_code: "FLT-A", car_count: 60 }
              as: FreightCoordinator
              as_user_id: "u-freight-1"
              captures: { fleet1_id: $.data.id, fv1: $.data.version }
            - call: "POST /grain/freight-bookings"
              payload: { fleet_id: "${fleet1_id}", contract_id: "${c1_id}", cars_requested: 25, placement_at: "2026-11-05T00:00:00Z", release_at: "2026-11-07T00:00:00Z", expected_fleet_version: "${fv1}" }
              as: FreightCoordinator
              as_user_id: "u-freight-1"
              captures: { bk1_id: $.data.id }
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 5000, moisture_pct: 15.0, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0, freight_booking_id: "${bk1_id}" }
