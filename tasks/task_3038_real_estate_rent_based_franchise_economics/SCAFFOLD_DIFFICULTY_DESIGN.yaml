          - entities.FundAssessment.fields.final_royalty_cents
        distinguishing_aspect: |
          The provisional variant annualizes ONE month (12 * monthly royalty)
          while the final variant replays the year's actual locked reports; on
          non-uniform sales the two totals diverge — this instance operates on
          the FundAssessment/royalty domain, a different entity domain from the
          RentCharge greater-of rule.
