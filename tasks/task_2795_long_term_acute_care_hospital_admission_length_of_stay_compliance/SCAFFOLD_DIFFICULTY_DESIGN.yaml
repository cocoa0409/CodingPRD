  - rule_id: non_linear_state_machine
    instances:
      - name: weaning_plan_progresses_regresses_and_progresses_again
        grounds:
          - state_machines.WeaningPlan.SBT_TRIAL_to_PROGRESSING
          - state_machines.WeaningPlan.PROGRESSING_to_REGRESSED
          - state_machines.WeaningPlan.REGRESSED_to_PROGRESSING
          - entities.WeaningPlan.fields.current_step
          - entities.WeaningPlan.fields.consecutive_failed_sbt
          - calculations.weaning_vent_hours_total
        distinguishing_aspect: |
          A same-machine cycle with a hysteresis counter: PROGRESSING absorbs the FIRST failed trial
          without changing state and only the SECOND consecutive failure drops the plan to REGRESSED
          (current_step 2 -> 1), after which a tolerated trial returns it to PROGRESSING with
          current_step 2 and consecutive_failed_sbt reset to 0.
        test_recipe:
          setup:
            - "OPEN period, ACTIVE criteria set CS-2026A, DRG 207 loaded, one ACTIVE PULMONOLOGY physician."
            - "PMV-track stay admitted at the default clock instant 2026-08-01T00:00:00Z with a weaning plan seeded at vent_hours_total 90."
            - "One RESPIRATORY_THERAPY and one PHYSICIAN interdisciplinary note already filed at that same instant, so every TOLERATED trial in this instance satisfies the documentation window (documented_at >= last_progression_at)."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
