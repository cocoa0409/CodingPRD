              as: ProjectManager
              as_user_id: pm-01
              captures: { pkg1: $.data.id, pkst: $.data.status, pkrr: $.data.review_round_count, pkrev: $.data.revision_count, pksup: $.data.superseded_by_package_id, pkap: $.data.approved_at }
            - call: "POST /design-packages/${pkg1}/review-rounds"
              payload: { panel_roles: ["Curator", "Conservator", "ProjectManager"], decision_deadline_at: "2026-08-20T00:00:00Z" }
              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd1: $.data.id, rst: $.data.status, rcast: $.data.cast_vote_count, rapp: $.data.approve_count, rrev: $.data.revise_count, rvet: $.data.veto_count, rdec: $.data.decided_at, rswept: $.data.swept_by_deadline }
            - call: "GET /design-packages/${pkg1}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pkst2: $.data.status, pkrr2: $.data.review_round_count }
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 2, closure_allowed: true, dust_settling_buffer_minutes: 120 }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { zone1: $.data.id, zocc: $.data.occupancy_state, zres: $.data.reserved_case_slots }
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.14.3", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, security_class: "ENHANCED", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { art1: $.data.id, apst: $.data.placement_status, aacid: $.data.assigned_case_id }
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4 }
              as: Curator
              as_user_id: cur-01
              captures: { case1: $.data.id, cst: $.data.status, cmst: $.data.mount_status, ccnt: $.data.placed_artifact_count, cdec: $.data.decided_at, ccond: $.data.conditions }
            - call: "POST /exhibit-projects/${proj}/interactives"
              payload: { code: "INT-STRATA", kind: "TOUCHSCREEN", objective_code: "OBJ-STRATA", expected_daily_uses: 150, duty_hours_per_day: 6.0, mtbf_cycles: 1200000, parts_availability_years: 10, warranty_months: 24 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { int1: $.data.id, ist: $.data.status, iiter: $.data.prototype_iteration, ispec: $.data.durability_index_spec, iver: $.data.durability_index_verified, itier: $.data.maintenance_tier, imd: $.data.measured_daily_uses }
            - call: "POST /exhibit-projects/${proj}/material-specs"
              payload: { material_name: "Powder-coated aluminium housing", used_in: "INTERACTIVE_HOUSING", oddy_test_result: "PASS", voc_mg_per_m2_day: 0.12, formaldehyde_ppm: 0.02, cure_days: 14 }
              as: FabricationLead
              as_user_id: fab-01
              captures: { mat1: $.data.id, mst: $.data.status, mverd: $.data.verdict, mdec: $.data.decided_at }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { post1: $.data.posture, pend1: $.data.pending_material_count, blk1: $.data.conservation_block_count, orev1: $.data.open_revision_count }
          assert:
            - "${ph0} == INTERPRETIVE and ${post0} == OPEN - the project's initial_state"
            - "${pkst} == DRAFT with ${pkrr} == 0, ${pkrev} == 0, ${pksup} == null and ${pkap} == null"
            - "${rst} == OPEN with ${rcast} == 0, ${rapp} == 0, ${rrev} == 0, ${rvet} == 0, ${rdec} == null and ${rswept} == false"
            - "${pkst2} == IN_REVIEW and ${pkrr2} == 1 - opening the round moved the package off its initial state exactly once, which is the DRAFT -> IN_REVIEW transition, not a second initial state"
            - "${zocc} == OPERATING and ${zres} == 0 - occupancy_state is a system field with a declared default, not a value derived from the empty window set"
            - "${apst} == UNPLACED and ${aacid} == null"
            - "${cst} == DRAFT AND ${cmst} == NOT_STARTED on the same row, with ${ccnt} == 0, ${cdec} == null and ${ccond} == null - both dimensions initialise independently"
            - "${ist} == SPECIFIED with ${iiter} == 0, ${imd} == null and ${iver} == null, while ${ispec} == 70.60 is already computed at creation: wear_ratio == (150 * 6.0 * 320) / 1200000 == 0.24, wear_penalty == 0.55 * 24 == 13.2, kind_penalty == 0.9 * 18 == 16.2, parts_penalty == 0 because parts_availability_years == PARTS_TARGET_YEARS"
            - "${itier} == MEDIUM - derived from durability_index_spec because durability_index_verified is still null, and 70.60 >= 60"
            - "${mst} == SUBMITTED with ${mdec} == null, and ${mverd} == CONSERVATION_SAFE - PASS with voc 0.12 <= 0.6, formaldehyde 0.02 <= 0.1 and cure 14 >= 5, all three limits keyed on used_in == INTERACTIVE_HOUSING"
            - "${pend1} == 1, ${blk1} == 0, ${orev1} == 0 and therefore ${post1} == RESTRICTED - creating a material spec in its initial state is enough to restrict the project, because posture branch 2 counts SUBMITTED specs"

