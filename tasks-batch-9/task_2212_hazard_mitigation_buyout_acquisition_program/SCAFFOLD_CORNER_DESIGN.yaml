              as_user_id: "pa-1"
            - call: "POST /program-income-entries/${pi1}/reverse"
              payload: { entry_id: "${pi1}", reversal_note: "posted in error again" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "trigger call 1 returns 200; DuplicationOfBenefitsRecord.${dob1}.status == REVERSED and Parcel.${p1}.dob_deduction_total_cents == 0"
            - "trigger call 2 returns 409 with data.error_id == ERR_ALREADY_REVERSED"
            - "trigger call 3 returns 200; ProgramIncomeLedgerEntry.${pi1}.status == REVERSED and MitigationProject.${proj}.program_income_balance_cents == 0"
