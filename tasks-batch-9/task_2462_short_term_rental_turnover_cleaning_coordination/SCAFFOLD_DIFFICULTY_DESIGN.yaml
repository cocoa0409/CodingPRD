  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_requires_outgoing_booking_checked_out
        grounds:
          - validations[priority=13]
          - errors[ERR_GUEST_NOT_CHECKED_OUT]
          - state_machines.Turnover.SCHEDULED_to_IN_PROGRESS
          - state_machines.Booking.SCHEDULED_to_CHECKED_OUT
        distinguishing_aspect: |
          Entity pair Turnover <- Booking: starting the clean is gated on the OUTGOING Booking's
          status being CHECKED_OUT; with the clock already past window_start_at and the assignment
          ACCEPTED, the start is refused with ERR_GUEST_NOT_CHECKED_OUT (409) and succeeds
          unchanged once and only once the departing guest is checked out.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' (ZONE_A, TWO_BR, min_skill_level 2), no supply lines."
            - "Cleaner C (home ZONE_A, skill 4) has ACCEPTED the offer on T1, so T1 is SCHEDULED."
            - "Clock advanced to 2026-08-08T16:00:00Z, i.e. exactly T1.window_start_at, so priority 26 is satisfied."
            - "Booking OUT-1 is still SCHEDULED - no checkout has been recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
