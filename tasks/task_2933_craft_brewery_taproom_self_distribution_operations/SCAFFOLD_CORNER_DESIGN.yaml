      - name: keg_clean_contact_time_at_sixty_seconds_passes_and_fifty_nine_fails
        claim_type: Precision
        grounds:
          - calculations.growler_sanitation_verdict
          - calculations.growler_sanitation_verdict.constants.SANITATION_MIN_CONTACT_SECONDS
          - errors.ERR_SANITATION_BELOW_STANDARD
        distinguishing_aspect: "The contact-time comparison is an inclusive integer comparison at a different threshold and on a different endpoint from the ppm band: 59 seconds aborts the wash with 422 and leaves the keg DIRTY with cip_cycle_count 0, while 60 seconds moves it to CLEANED and stamps last_cip_utc from the logical clock."
        test_recipe:
          setup:
            - "Brewery ACTIVE. KEG-0001 (0.5 bbl) freshly created, so it is EMPTY_DIRTY with cip_cycle_count 0 and last_cip_utc null."
            - "Clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
