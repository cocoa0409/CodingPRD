            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules/${sched1}/pause"
              payload: { note: "Store remodel" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 409 and data.error_id == \"ERR_COUNT_SCHEDULE_NOT_ACTIVE\""
            - "GET /inventory-integrity/count-tasks?count_schedule_id=${sched1} returns total_count 0"
            - "after POST /inventory-integrity/count-schedules/${sched1}/resume the same create call returns 201 with status \"SCHEDULED\", store_id ${store_s100} and category_id ${cat_apparel} copied from the schedule"

      - name: tag_batch_rework_loop_bounded_by_max_rework_rounds
        claim_type: cyclic
        grounds:
          - state_machines.TagBatch.VERIFICATION_FAILED_to_ENCODED
          - global_constants.MAX_REWORK_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / tag_batch_rework_cycle_returns_to_encoded
          rationale: "The rework cycle, its rework_round increment, the re-frozen sample size and the MAX_REWORK_ROUNDS ceiling are all asserted by the named §1.8 instance."

      - name: adjustment_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Adjustment
        excluded_because:
          difficulty_instance: non_linear_state_machine / adjustment_parallel_approval_and_posting_dimensions
          rationale: "The independence of approval_state and posting_state, including the REJECTED-blocks-posting interaction, is the whole subject of the named §1.8 instance."

      - name: store_posture_bubbles_up_from_position_change
        claim_type: bubble_up
        grounds:
          - state_machines.Store.ELIGIBLE_to_SUSPENDED
          - calculations.store_fulfillment_posture
        excluded_because:
          difficulty_instance: transitive_cascade / adjustment_post_cascades_position_to_store_fulfillment
          rationale: "The position-to-store derivation and the ELIGIBLE -> SUSPENDED demotion are asserted hop by hop in the named §1.8 instance."

      - name: investigation_close_cascades_to_vendor_and_tag_batches
        claim_type: cross_entity
        grounds:
          - state_machines.VarianceInvestigation.CAUSE_APPROVED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / investigation_close_cascades_shrink_vendor_tag_sample
          rationale: "All four hops of the close cascade — bucket attribution, vendor score, sample re-band and TagBatch re-freeze — are asserted by the named §1.8 instance."

      - name: count_task_return_to_count_compensates_shrink_totals
        claim_type: compensation
        grounds:
          - state_machines.CountTask.COUNTED_to_IN_PROGRESS
          - state_machines.VarianceInvestigation.OPEN_to_WAIVED
        excluded_because:
          difficulty_instance: compensating_invariant / count_return_to_count_waives_investigations_and_restores_shrink_unresolved
          rationale: "Line deletion, the conditional OPEN-only waive cascade and the restoration of the period's unresolved_cents are asserted by the named §1.8 instance."

      - name: adjustment_reverse_compensates_position_units
        claim_type: compensation
        grounds:
          - state_machines.Adjustment.POSTED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / adjustment_reverse_conserves_on_hand_units
          rationale: "The reversal's unit conservation, the store's return to ELIGIBLE and the deliberately non-restored cadence are asserted by the named §1.8 instance."

