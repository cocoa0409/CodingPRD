          setup:
            - "Empty database; the logical clock is at its startup value 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /laboratories"
              payload: { name: "Minimal Bay 57", biosafety_level: "BSL1", bench_capacity: 2 }
