            - "GET /turf/usage-ledger-entries?field_id=${f_ng}&entry_type=PLAY_WEAR returns meta.total_count == 1 with data[0].wear_units_delta == 8.64, data[0].rest_requirement_hours == 5.64 and data[0].rest_window_end_utc == \"2026-08-03T04:38:24Z\" (window_end 23:00:00 plus 5.64 hours = 5 h 38 min 24 s)"
            - "GET /turf/fields/${f_ng} returns data.rest_debt_hours == 5.64 and data.play_status == \"RESTRICTED\""
