      - name: plan_change_with_no_open_cycle_returns_cycle_closed
        claim_type: Violation → Error
        grounds:
          - validations[priority=24]
          - errors[ERR_CYCLE_CLOSED]
          - state_machines.BillingCycle.OPEN_to_CLOSED
        distinguishing_aspect: "Closing the cycle of a SUSPENDED account mints no successor, so after the account is resumed it is ACTIVE with no OPEN BillingCycle and the next plan change fails at rung 24 with ERR_CYCLE_CLOSED."
        test_recipe:
          setup:
            - "A FAMILY plan and a SOLO plan; one account on FAMILY."
            - "The account is suspended, its only cycle is closed (no successor is minted for a SUSPENDED account), and the account is then resumed."
          setup_api_calls:
