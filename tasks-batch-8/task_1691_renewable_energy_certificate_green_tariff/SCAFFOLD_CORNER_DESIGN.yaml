    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected ERR_UNAUTHENTICATED 401 before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "No Auth", facility_code: "NA1", technology: "SOLAR", nameplate_capacity_kw: 100, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401 (request carried no auth headers)"

      - name: reading_period_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_PERIOD_INVERTED]"]
        distinguishing_aspect: "period_end equal to or before period_start is a 400 ERR_PERIOD_INVERTED, evaluated before overlap checks."
        test_recipe:
          setup: ["Generator ACTIVE"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
