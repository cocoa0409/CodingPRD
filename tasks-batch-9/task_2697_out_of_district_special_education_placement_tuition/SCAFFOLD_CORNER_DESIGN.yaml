      - name: awarded_full_claim_is_terminal_and_rejects_remand
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.ReimbursementClaim.terminal_states"
          - "endpoints.POST_reimbursement_claims_id_remand"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: |
          AWARDED_FULL is SM7's only terminal state; remand is declared from AWARDED_PARTIAL and
          DENIED only. The fixture reaches AWARDED_FULL exactly: 200 claimed days puts the
          statutory ceiling at 5600000 so the 4000000 tuition claim is not clipped, the transport
          claim of 100000 is under the 150000 cap, notice on 2026-08-20 is 12 days before the
          2026-09-01 start so no late-notice reduction applies and there is no prior district
          offer - eligible 4100000 == awarded 4100000 == claimed sum. The remand must then fail
          409 and, crucially, must NOT run the compensating reversal: disbursed_cents stays at
          4100000.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "One ReimbursementClaim adjudicated strict_statutory to AWARDED_FULL at 4100000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C016", full_name: "Lior Mbeki", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/reimbursement-claims"
              payload: { student_id: "${stu_id}", fiscal_account_id: "${acct_id}", unilateral_school_name: "Ashfield Day School", claimed_tuition_cents: 4000000, claimed_transport_cents: 100000, claimed_instructional_days: 200, notice_date: "2026-08-20", unilateral_start_date: "2026-09-01", unilateral_end_date: "2027-06-15", parent_cooperation: true }
              as: ParentGuardian
              as_user_id: "${stu_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /ood-placements/reimbursement-claims/${rc_id}/adjudicate"
              payload: { award_basis: "strict_statutory" }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
          trigger:
            - call: "POST /ood-placements/reimbursement-claims/${rc_id}/remand"
              payload: { remand_reason: "District seeks reconsideration of the equitable factors." }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
          assert:
            - "The setup adjudication returned status == AWARDED_FULL with eligible_amount_cents == 4100000, awarded_tuition_cents == 4000000, awarded_transport_cents == 100000, awarded_amount_cents == 4100000 and equitable_reduction_pct == 0"
            - "The trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "A follow-up GET /ood-placements/reimbursement-claims/${rc_id} shows status == AWARDED_FULL, remand_round == 0 and awarded_amount_cents still 4100000"
            - "A follow-up GET /ood-placements/fiscal-accounts/${acct_id} shows available_cents == 95900000 and disbursed_cents == 4100000 - the refused remand reversed nothing"
            - "100000000 == 95900000 + 0 + 4100000 - the fiscal identity is intact"
      - name: remand_compensates_the_disbursement_and_permits_readjudication
        claim_type: Compensation
        grounds:
          - "state_machines.ReimbursementClaim[AWARDED_PARTIAL->REMANDED]"
          - "endpoints.POST_reimbursement_claims_id_remand"
          - "calculations.reimbursement_award"
          - "entities.DistrictFiscalAccount"
        distinguishing_aspect: |
          Remand is the exact compensating action for the adjudication disbursement. From a
          strict_statutory AWARDED_PARTIAL of 2610000 (statutory ceiling 28000 x 150 = 4200000
          clips the 4500000 tuition claim, the 200000 transport claim clips to the 150000 cap,
          and the 0.40 reduction is late notice 0.25 for 7 days of notice plus timely offer 0.15),
          the remand must return disbursed_cents to 0 and available_cents to the full 100000000,
          zero every award column and null award_basis - no drift and no partial reversal. The
          claim must then be re-adjudicable, and the equitable_actual_cost re-run must produce a
          DIFFERENT number, 2790000, because the ceiling is waived.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "One ReimbursementClaim (tuition 4500000, transport 200000, 150 days, notice 2026-08-25, start 2026-09-01, prior district offer 2026-08-20, parent_cooperation true) adjudicated strict_statutory to AWARDED_PARTIAL at 2610000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C017", full_name: "Mira Oyelaran", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/reimbursement-claims"
              payload: { student_id: "${stu_id}", fiscal_account_id: "${acct_id}", unilateral_school_name: "Ashfield Day School", claimed_tuition_cents: 4500000, claimed_transport_cents: 200000, claimed_instructional_days: 150, notice_date: "2026-08-25", unilateral_start_date: "2026-09-01", unilateral_end_date: "2027-06-15", prior_district_offer_date: "2026-08-20", parent_cooperation: true }
              as: ParentGuardian
              as_user_id: "${stu_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /ood-placements/reimbursement-claims/${rc_id}/adjudicate"
              payload: { award_basis: "strict_statutory" }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
          trigger:
            - call: "POST /ood-placements/reimbursement-claims/${rc_id}/remand"
              payload: { remand_reason: "Hearing officer must weigh the equitable actual-cost basis." }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
            - call: "POST /ood-placements/reimbursement-claims/${rc_id}/adjudicate"
              payload: { award_basis: "equitable_actual_cost", equitable_findings: "District offer was materially inadequate and the parent cooperated throughout the process." }
              as: HearingAdjudicator
              as_user_id: "u-hearing-1"
          assert:
            - "The setup adjudication produced status == AWARDED_PARTIAL, eligible_amount_cents == 4350000, equitable_reduction_pct == 0.40, awarded_tuition_cents == 2520000, awarded_transport_cents == 90000, awarded_amount_cents == 2610000"
            - "After that adjudication the account read available_cents == 97390000, encumbered_cents == 0, disbursed_cents == 2610000"
            - "The remand returns HTTP 200 with data.status == REMANDED, data.remand_round == 1, data.awarded_amount_cents == 0, data.awarded_tuition_cents == 0, data.awarded_transport_cents == 0, data.eligible_amount_cents == 0, data.equitable_reduction_pct == 0 and data.award_basis == null"
            - "After the remand the account reads available_cents == 100000000, encumbered_cents == 0, disbursed_cents == 0 - the pre-adjudication decomposition is restored exactly"
            - "The re-adjudication returns HTTP 200 with status == AWARDED_PARTIAL, eligible_amount_cents == 4650000, equitable_reduction_pct == 0.40, awarded_tuition_cents == 2700000, awarded_transport_cents == 90000 and awarded_amount_cents == 2790000"
            - "After the re-adjudication the account reads available_cents == 97210000 and disbursed_cents == 2790000; 100000000 == 97210000 + 0 + 2790000"
            - "data.remand_round is still 1 - closing the cycle does not increment it"
      - name: placement_decision_revision_cycle_is_bounded
        claim_type: cyclic
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.PlacementDecision"
          - "errors[ERR_MAX_ROUNDS_EXCEEDED]"
        excluded_because:
          difficulty_instance: placement_decision_revision_cycle_bounded_at_three_rounds
          rationale: "The `cyclic` shape row demands a loop-count termination test on TEAM_REVIEW <-> RETURNED_FOR_REVISION. That §1.8 instance already drives revision_round to MAX_REVISION_ROUNDS (3), proves the fourth return-for-revision is refused with ERR_MAX_ROUNDS_EXCEEDED, and shows the decision can still be approved from TEAM_REVIEW afterwards. A separate corner test would repeat it verbatim."
      - name: invoice_status_dimensions_are_independent
        claim_type: parallel
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.TuitionInvoice"
          - "entities.TuitionInvoice.fields.verification_status"
          - "entities.TuitionInvoice.fields.payment_status"
        excluded_because:
          difficulty_instance: invoice_parallel_status_dimensions_move_independently
          rationale: "TuitionInvoice carries two orthogonal status dimensions, which is exactly the `parallel` shape row. That §1.8 instance already walks verification_status and payment_status independently and asserts the combined state at each step, including a VOID on a DISPUTED invoice that leaves verification_status untouched."
      - name: terminate_and_return_forks_diverge
        claim_type: branching
        grounds:
          - "complexity_profile.state_machine_shape"
          - "state_machines.Placement"
          - "endpoints.POST_placements_id_terminate"
          - "endpoints.POST_placements_id_return_to_district"
        excluded_because:
          difficulty_instance: placement_return_to_district_fork_diverges_from_terminate
          rationale: "The two exits from ACTIVE are the fork the `branching` row asks about. That §1.8 instance runs both paths from byte-identical fixtures and pins every divergence: TERMINATED vs TRANSFERRED addenda, ABANDONED vs COMPLETED plan, reserve released vs retained, DISPUTED invoices voided vs left standing."
      - name: termination_cascade_reaches_only_non_terminal_children
        claim_type: Cascade down
        grounds:
          - "state_machines.Placement[ACTIVE->TERMINATED].side_effects"
          - "endpoints.POST_placements_id_terminate"
        excluded_because:
          difficulty_instance: terminate_frees_seat_then_promotes_waitlist_onto_a_second_placement
          rationale: "CASCADE-A LINK 0..9 is the cascade-down pattern. That §1.8 instance verifies the whole chain end to end, including that it only touches non-terminal children and that the deepest branch LINK 4 -> 5 -> 6 -> 7 lands a promoted assignment on a DIFFERENT placement in the same request."
      - name: payment_updates_the_placement_and_student_rollups
        claim_type: Ledger sync
        grounds:
          - "state_machines.TuitionInvoice[UNPAID->PAID].side_effects"
          - "entities.Placement.fields.paid_total_ytd_cents"
          - "entities.Student.fields.projected_state_recovery_cents"
        excluded_because:
          difficulty_instance: payment_rollup_crosses_high_cost_trigger_and_creates_claim_then_student_rollup
          rationale: "CASCADE-B rolls a settlement up into Placement.paid_total_ytd_cents and then into Student, which is the ledger-sync pattern. That §1.8 instance reconciles the account, the placement rollup, the auto-created HIGH_COST_FUND claim and the student's projected recovery before and after each of two payments."
      - name: activation_requires_the_school_to_be_approved_right_now
        claim_type: guarded transitions
        grounds:
          - "state_machines.Placement[CONTRACTED->ACTIVE].preconditions"
          - "entities.ApprovedPrivateSchool.fields.approval_status"
          - "errors[ERR_SCHOOL_NOT_APPROVED]"
        excluded_because:
          difficulty_instance: placement_activation_gated_on_school_approval_standing
          rationale: "CONTRACTED->ACTIVE is guarded on a different entity's state, which is the guarded-transitions row. That §1.8 instance revokes the school between contract execution and activation, shows the 409, restores APPROVED and shows the same call then succeeds - and confirms an already-ACTIVE placement is not retroactively terminated."
      - name: invoice_verification_depends_on_the_attendance_record_state
        claim_type: Cross-entity
        grounds:
          - "state_machines.TuitionInvoice[SUBMITTED->VERIFIED].preconditions"
          - "entities.AttendanceRecord.fields.status"
          - "errors[ERR_ATTENDANCE_NOT_VERIFIED]"
        excluded_because:
          difficulty_instance: invoice_verification_gated_on_attendance_record_verification
          rationale: "The cross-entity side-effect row wants an A-changes-therefore-B-adjusts test keyed on B's state. That §1.8 instance drives the invoice through a SUBMITTED, then DISPUTED, then VERIFIED attendance record and shows verification is refused until the record is VERIFIED, then succeeds against the same invoice."
      - name: terminate_only_releases_what_was_not_yet_paid
        claim_type: Conditional cascade
        grounds:
          - "state_machines.Placement[ACTIVE->TERMINATED].side_effects"
          - "entities.Placement.fields.released_encumbrance_cents"
          - "entities.DistrictFiscalAccount"
        excluded_because:
          difficulty_instance: fiscal_account_identity_survives_partial_payment_then_termination
          rationale: "CASCADE-A LINK 1 releases contract_encumbrance_cents minus paid_total_ytd_cents, so the release is conditional on how much has already been disbursed. That §1.8 instance pays one invoice, terminates, and checks the fiscal identity plus the exact released_encumbrance_cents at every checkpoint."

