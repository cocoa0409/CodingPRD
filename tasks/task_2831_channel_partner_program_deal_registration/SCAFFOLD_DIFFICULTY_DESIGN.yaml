              as_user_id: "${pc_id}"
            - call: "POST /deal-registrations/${regc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${regc_id}/review"
              payload: { action: "REQUEST_CHANGES", reviewer_note: "final clarification round" }
              as: ChannelOpsAnalyst
