              as: ProgramDirector
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "11111111-1111-4111-8111-111111111111", representative_id: "${atty_a_id}", role_on_case: "LEAD", expected_matter_version: 1 }
              as: ClientPortalUser
              as_user_id: "${client_id}"
          assert:
            - "step 1 returns HTTP 403 with error_id 'ERR_ROLE_NOT_PERMITTED' (priority 2), NOT 404 'ERR_MATTER_NOT_FOUND' (priority 6) and NOT 412 'ERR_STALE_MATTER_VERSION' (priority 38)."
            - "The response body carries no field disclosing whether matter 11111111-1111-4111-8111-111111111111 exists."
            - "No CaseAssignment row exists afterwards: GET /case-assignments as ProgramDirector returns total_count 0."

  # =====================================================================
  # RULE 6 - boundary_precision_check
  # Instance 1: a money-derived RATIO metric (fpl_percent) at a 1-cent
  #   separation around a >= / > ceiling, exercising the rounded-value
  #   comparison.
  # Instance 2: an INTEGER COUNT metric (same-day facility visit slots,
  #   including the degenerate 0 ceiling) plus a millisecond lead-time
  #   instant - different metrics, different endpoint, both endpoints of
  #   each comparison.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: indigency_ceiling_compares_rounded_fpl_percent_one_cent_apart
        grounds:
          - calculations.indigency_fpl_percent
          - validations[priority=35]
          - entities.Client.fields.annual_household_income_cents
          - entities.Client.fields.fpl_percent
        distinguishing_aspect: |
          household_size 1 gives an annual guideline of 1,508,000 cents, so the 200.00 percent
          ceiling sits exactly at 3,016,000 cents; income 3,016,075 has an unrounded
          fpl_percent of 200.004973... which must be HALF_UP-rounded to 200.00 and therefore
          still pass, while 3,016,076 gives 200.005040... which rounds to 200.01 and must
          fail with ERR_INDIGENCY_CEILING_EXCEEDED / 422 - a 1-cent move across the rounding
          seam. An implementation that compares the unrounded quotient rejects the 3,016,075
          client too, and one that truncates instead of rounding half-up accepts the
          3,016,076 client.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z; cycle with ample slots so capacity never interferes."
            - "Three clients, all household_size 1, all NATURALIZATION (a non-fee-exempt, non-detained case type) with prior_removal_order false so no other eligibility branch fires."
            - "Client cA income 3,016,000 cents = exactly 200.00 percent of the guideline (the inclusive endpoint)."
            - "Client cB income 3,016,075 cents = 200.004973 percent unrounded, 200.00 after HALF_UP rounding to 2 decimals."
            - "Client cC is REGISTERED at 3,016,000 cents and its income is raised to 3,016,076 cents by PATCH /clients AFTER its intake row exists, so the recipe never depends on whether priority 35 can fire at intake-creation time; the PATCH recomputes fpl_percent to 200.01, the first cent that breaks the ceiling."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
