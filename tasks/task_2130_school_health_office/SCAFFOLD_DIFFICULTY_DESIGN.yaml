            - "Student.${stu_id}.active_action_plan_id == ${p2_id}"
            - "Student.${stu_id}.self_carry_authorized == true"
            - "SELF_CARRY is a member of Student.${stu_id}.alert_flags"

      - name: lot_quarantine_four_hop_cascade
        grounds:
          - state_machines.MedicationStockLot.AVAILABLE_to_QUARANTINED
          - state_machines.AdministrationRecord.PREPARED_to_VOIDED
          - concurrency_rules[lot-inventory-action-stale-lot]
          - calculations.school_days_of_supply
          - calculations.stock_protocol_status
          - calculations.school_coverage_posture
          - entities.School.fields.coverage_posture
        distinguishing_aspect: |
          Depth-4 chain triggered by a DIFFERENT transition — POST
          /health-office/medication-stock-lots/{id}/inventory-action with action =
          QUARANTINE: quarantining the lot voids its PREPARED record (hop 1);
          BECAUSE that record is VOIDED its 2 reserved units return to the shelf
          and the visit's pending_administration_count drops (hop 2); BECAUSE the
          lot has left AVAILABLE it stops contributing, so albuterol_days_of_supply
          falls to 0.00 and stock_protocol_status becomes DEPLETED (hop 3);
          BECAUSE the stock status is DEPLETED, coverage_posture drops FULL ->
          LIMITED (hop 4).
        test_recipe:
          setup:
            - "School FRA07 with one RN on an ACTIVE Monday block and one ENROLLED ANAPHYLAXIS student, so required_stock_units is 1 and delivered_students_per_nurse_fte is 4.38."
