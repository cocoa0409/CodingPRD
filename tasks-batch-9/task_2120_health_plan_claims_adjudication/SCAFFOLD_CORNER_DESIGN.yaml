              as: PlanAdmin
          trigger:
            - call: "GET /adjudication/claims/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: UnknownRole
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_UNAUTHENTICATED"
            - "HTTP status is 401, not 404 and not 403"
            - "The same call with the X-User-Role header omitted entirely also returns ERR_UNAUTHENTICATED"

      - name: provider_rep_cannot_read_another_providers_claim
        claim_type: other_role_denied
