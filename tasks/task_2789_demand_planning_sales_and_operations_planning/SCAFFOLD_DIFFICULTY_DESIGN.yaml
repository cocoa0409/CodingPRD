            - "HOP 1 — DemandForecast.${fc_oct_id}.status == \"RUNOUT_TRUNCATED\" with consensus_units == 0, DemandForecast.${fc_nov_id}.status == \"RUNOUT_TRUNCATED\" with consensus_units == 0, while DemandForecast.${fc_sep_id}.status is still \"CONSENSUS_LOCKED\" with consensus_units == 1000"
