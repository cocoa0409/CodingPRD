            - "recording a new outcome in the closed period returns 409 with data.error_id == ERR_FUNDING_PERIOD_CLOSED and creates no row"
            - "the allocation-run with a fresh version returns 409 with data.error_id == ERR_FUNDING_PERIOD_CLOSED, not a 412"
            - "OutcomeRecord ${o1} remains CERTIFIED with allocated_cents == 12500 and allocation_status == COMMITTED; allocation_run_count stays 1"

  - rule_id: resource_temporal_overlap
    instances:
      - name: room_session_buffer_gap_45min_boundary
        resource_entity: TestingRoom
        interval_semantics: "both intervals inflated by turnaround_buffer_minutes on their trailing edge, strict < comparisons, CANCELLED sessions excluded"
        grounds:
          - calculations.room_occupation_conflict
          - validations[priority=81]
          - errors[ERR_ROOM_BUFFER_CONFLICT]
        distinguishing_aspect: |
          Room turnaround is a buffered-overlap test: the room needs 45 minutes between sittings, so a
          44-minute gap conflicts and a 45-minute gap does not, and the buffer applies symmetrically
          to a candidate that ends before the existing sitting starts.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center with room R1, turnaround_buffer_minutes 45."
            - "Existing MATH session in R1 on 2026-08-15T09:00-11:00Z (status DRAFT, still occupying the room)."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Buffer Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R1", seat_capacity: 10, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T11:00:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_a: $.data.id }
          trigger:
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-15T11:44:00Z", ends_at: "2026-08-15T13:44:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-15T11:45:00Z", ends_at: "2026-08-15T13:45:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_c: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "SCIENCE", starts_at: "2026-08-15T06:15:00Z", ends_at: "2026-08-15T08:15:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_d: $.data.id }
          assert:
            - "the 11:44 candidate (44-minute gap) returns 409 with data.error_id == ERR_ROOM_BUFFER_CONFLICT and creates no session"
            - "the 11:45 candidate (gap exactly 45 minutes) returns 201 with status == DRAFT and duration_hours == 2.00"
            - "the 06:15-08:15 candidate ending exactly 45 minutes before ${sess_a} starts returns 201, showing the buffer is applied to both trailing edges rather than only forward"
            - "GET /exam-sessions?testing_room_id=${r} lists exactly three sessions"

      - name: proctor_adjacent_sessions_allowed_but_overlap_rejected
        resource_entity: Proctor
        interval_semantics: "half-open [starts_at, ends_at) with zero buffer, evaluated across rooms and centers"
        grounds:
          - calculations.proctor_interval_conflict
          - validations[priority=82]
          - errors[ERR_PROCTOR_TIME_CONFLICT]
        distinguishing_aspect: |
          A different resource with deliberately different interval semantics: the proctor's own
          calendar has NO buffer and is half-open, so a session starting exactly when the previous one
          ends is legal (unlike the room, which would refuse it), while any true overlap in a third
          room is refused even though every room's own occupancy is clean.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center with three rooms R1, R2, R3 and one proctor certified to 2027-01-01 with daily_hour_cap 8.00."
            - "Three DRAFT sessions on 2026-08-18: R1 09:00-11:00, R2 11:00-13:00, R3 10:30-12:30."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Adjacency Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R1", seat_capacity: 6, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r1: $.data.id }
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R2", seat_capacity: 6, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r2: $.data.id }
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R3", seat_capacity: 6, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r3: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Yara Proctor", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r1}", subtest: "MATH", starts_at: "2026-08-18T09:00:00Z", ends_at: "2026-08-18T11:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sa: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r2}", subtest: "RLA", starts_at: "2026-08-18T11:00:00Z", ends_at: "2026-08-18T13:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sb: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r3}", subtest: "SCIENCE", starts_at: "2026-08-18T10:30:00Z", ends_at: "2026-08-18T12:30:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sc: $.data.id }
          trigger:
            - call: "POST /exam-sessions/${sa}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-sessions/${sb}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-sessions/${sc}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
          assert:
            - "assigning ${sa} returns 200 with status == SCHEDULED"
            - "assigning ${sb}, which starts exactly when ${sa} ends, returns 200 (half-open interval, zero buffer) and Proctor ${p} assigned_session_count == 2"
            - "assigning ${sc}, which overlaps both, returns 409 with data.error_id == ERR_PROCTOR_TIME_CONFLICT - not ERR_PROCTOR_DAILY_CAP_EXCEEDED, since the projected load 6.00 is under the 8.00 cap"
            - "${sc} stays DRAFT with proctor_id == null and assigned_session_count stays 2"

  - rule_id: compensating_invariant
    instances:
      - name: voucher_cents_conserved_across_registration_and_cancellation
        conserved_quantity: "Student.voucher_granted_cents == voucher_balance_cents + voucher_spent_cents, with exam_fee_owed_cents mirroring the unfunded residue"
        grounds:
          - calculations.exam_fee_assessment
          - state_machines[ExamRegistration].transitions[REGISTERED->CANCELLED]
          - entities.ExamRegistration.fields.refunded_cents
          - errors[ERR_REGISTRATION_NOT_OPEN]
        distinguishing_aspect: |
          The conserved quantity is the student's voucher ledger. Registering draws 3000 cents from
          the balance into spent; cancelling returns exactly the same 3000 with no drift; a repeat
          cancellation is refused so the refund cannot be applied twice; and re-registering draws the
          same amount again, proving the compensation is exact rather than approximate.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center, ACTIVE room, certified proctor, SCHEDULED MATH session on 2026-08-10T09:00-11:00Z."
            - "Student PLACED at EFL 2, self_pay_authorized false, voucher grant 5000 cents."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Ledger Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R1", seat_capacity: 8, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Zeke Proctor", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /students"
              payload: { full_name: "Amir Learner", email: "amir@x.test", primary_track: "HSE_PREP", self_pay_authorized: false }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /students/${s}/voucher-adjustments"
              payload: { delta_cents: 5000 }
              as: ProgramCoordinator
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te_pre: $.data.id }
