# =============================================================================
# SCAFFOLD — Continuing Legal Education Accreditation & Credit Reporting
# §1.0 – §1.7   (difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#                corner design    → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2547. Continuing Legal Education Accreditation & Credit Reporting (state continuing legal
  education board): provider accreditation versus individual course approval pathways, credit
  category classification including ethics, technology and elimination-of-bias requirements,
  format rules for live, on-demand and self-study with credit caps, attendance verification
  methods and affirmation requirements, attorney compliance period tracking with carryover
  credit rules, delinquency notice, late fee and administrative suspension process, reciprocity
  for out-of-state credits and comity rules, provider audits, complaint handling and course
  denial appeals

domain_name: cle-accreditation-credit-reporting
api_prefix: /cle

complexity_profile:
  difficulty_level: expert_plus          # Expert band per §0.4, deliberately pushed past it
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only four URL sub-resources exist
  # (course credit-allocations, course applications, course attendance-reports, cycle
  # affirmations); every other relationship is expressed as an FK field plus a filtered
  # list endpoint. No entity is addressed through a multi-level ownership path.

  state_machine_shape: cyclic
  # Non-linear on three different entities: CourseApplication is cyclic
  # (SUBMITTED→INFO_REQUESTED→SUBMITTED, DENIED→APPEALED→SUBMITTED via REMAND);
  # ComplianceCycle carries two parallel state dimensions (credit_status ×
  # administrative_status) that advance independently; Provider is cyclic with reverts
  # (ACCREDITED→PROBATIONARY→ACCREDITED, LAPSED→ACCREDITED); ProviderAudit is branching
  # fork-join (OPENED→SAMPLED→FINDINGS_ISSUED→{CLEARED|SANCTIONED}) with divergent
  # side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Provider→Course, Attorney→ComplianceCycle, Course→CreditAllocation
    - many_to_many         # Attorney↔Course realised through CreditRecord
    - self_referential     # ComplianceCycle.previous_cycle_id -> ComplianceCycle.id
    - polymorphic          # Complaint.subject_id resolves to Provider.id or Course.id
    - cross_aggregate      # CreditRecord spans Attorney, ComplianceCycle and Course

  role_model: segregation_of_duties
  # The AccreditationReviewer who denied an application may not sit as the AppealsPanelist
  # on that same application, and no BoardAdmin may decide an appeal at all.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (14 entities, flat topology)
# =============================================================================
entities:

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the CLE sponsor applying for accreditation.
        constraints: "1..200 chars, required"
      - name: provider_type
        type: enum
        source: input
        description: Sponsor category; decides whether full accreditation may be granted directly.
        constraints: "BAR_ASSOCIATION | LAW_SCHOOL | GOVERNMENT | COMMERCIAL | LAW_FIRM"
      - name: accreditation_status
        type: enum
        source: system
        description: Accreditation lifecycle state; see state_machines.Provider.
        default: APPLIED
        constraints: "APPLIED | PROBATIONARY | ACCREDITED | SUSPENDED | LAPSED | DENIED"
      - name: accreditation_term_start
        type: datetime
        source: system
        description: Start of the current accreditation term; set on the first grant and on each RENEW.
        default: null
      - name: accreditation_term_end
        type: datetime
        source: system
        description: End of the current accreditation term (term_start + ACCREDITATION_TERM_MONTHS); the sweep lapses the provider once the clock passes it.
        default: null
      - name: self_certification_enabled
        type: boolean
        source: computed
        description: "True if and only if accreditation_status == ACCREDITED. Courses created under a self-certifying provider take approval_pathway PROVIDER_ACCREDITED and are APPROVED on creation."
        default: false
      - name: courses_total_count
        type: integer
        source: system
        description: Count of Course rows with this provider_id, any status.
        default: 0
      - name: courses_self_certified_count
        type: integer
        source: system
        description: Count of Course rows with this provider_id and approval_pathway == PROVIDER_ACCREDITED, any status.
        default: 0
      - name: attendance_reports_total_count
        type: integer
        source: system
        description: Count of AttendanceReport rows whose course belongs to this provider, status IN {ACCEPTED, ACCEPTED_LATE}.
        default: 0
      - name: attendance_reports_late_count
        type: integer
        source: system
        description: Count of AttendanceReport rows whose course belongs to this provider and whose status == ACCEPTED_LATE.
        default: 0
      - name: substantiated_complaint_count
        type: integer
        source: system
        description: Count of Complaint rows with status == SUBSTANTIATED whose subject resolves to this provider or to one of its courses.
        default: 0
      - name: audit_findings_count
        type: integer
        source: system
        description: Lifetime sum of ProviderAudit.findings_count over this provider's audits with status IN {FINDINGS_ISSUED, CLEARED, SANCTIONED}.
        default: 0
      - name: courses_sampled_lifetime
        type: integer
        source: system
        description: Lifetime sum of ProviderAudit.sample_size over this provider's audits with status IN {SAMPLED, FINDINGS_ISSUED, CLEARED, SANCTIONED}.
        default: 0
      - name: last_audit_closed_at
        type: datetime
        source: system
        description: closed_at of the most recently closed ProviderAudit for this provider (status IN {CLEARED, SANCTIONED}), ordered by closed_at DESC then created_at DESC; null when none.
        default: null
      - name: risk_score
        type: number
        source: computed
        description: "Audit-risk score in [0, 1]; see calculations.provider_risk_score. Recomputed on every event that changes any of its inputs."
        default: 0.0
      - name: risk_score_variant
        type: enum
        source: computed
        description: "Which weighting variant produced risk_score: SELF_CERTIFIED_WEIGHTING when accreditation_status == ACCREDITED, otherwise REVIEWED_WEIGHTING."
        default: REVIEWED_WEIGHTING
        constraints: "SELF_CERTIFIED_WEIGHTING | REVIEWED_WEIGHTING"
      - name: probation_reason
        type: string
        source: system
        description: Free text recorded when the provider is moved to PROBATIONARY or SUSPENDED by a decision, audit sanction, or substantiated complaint.
        default: null
      - name: annual_fee_cents
        type: integer
        source: input
        description: Annual accreditation fee charged on each grant and renewal; drives FeeAssessment(fee_type = PROVIDER_ANNUAL).
        default: 120000
        constraints: ">= 0"

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; null when the course is submitted for individual approval by an attorney with no sponsoring provider."
        default: null
      - name: title
        type: string
        source: input
        description: Course title as it appears on the certificate of attendance.
        constraints: "1..200 chars, required"
      - name: delivery_format
        type: enum
        source: input
        description: Delivery format as offered; drives the per-cycle format caps in calculations.cycle_credit_application.
        constraints: "LIVE_IN_PERSON | LIVE_WEBCAST | ON_DEMAND | SELF_STUDY"
      - name: approval_pathway
        type: enum
        source: computed
        description: "PROVIDER_ACCREDITED when provider_id is non-null AND that provider's self_certification_enabled == true at creation time; otherwise INDIVIDUAL_APPROVAL."
        constraints: "PROVIDER_ACCREDITED | INDIVIDUAL_APPROVAL"
      - name: total_minutes
        type: integer
        source: input
        description: Total instructional minutes of the course; must equal the sum of its CreditAllocation.minutes.
        constraints: ">= 30, multiple of ROUNDING_INCREMENT_MINUTES (15)"
      - name: presented_at
        type: datetime
        source: input
        description: Live session start instant, or first-availability instant for ON_DEMAND / SELF_STUDY.
      - name: expires_at
        type: datetime
        source: computed
        description: "presented_at + total_minutes for LIVE_IN_PERSON and LIVE_WEBCAST; presented_at + APPROVAL_VALID_MONTHS (36 months) for ON_DEMAND and SELF_STUDY. The sweep expires APPROVED courses once the clock reaches this instant."
      - name: status
        type: enum
        source: system
        description: Course approval lifecycle; see state_machines.Course.
        default: PENDING_APPROVAL
        constraints: "PENDING_APPROVAL | APPROVED | DENIED | SUSPENDED_PENDING_REVIEW | REVOKED | EXPIRED"
      - name: attendance_verification_method
        type: enum
        source: input
        description: Verification method the sponsor commits to for this course; constrains which CreditRecord.verification_method values are accepted.
        constraints: "ROSTER | ATTENDANCE_CODE | CERTIFICATE | AFFIRMATION_ONLY"
      - name: attendance_code
        type: string
        source: system
        description: "Six-character code minted at creation if and only if attendance_verification_method == ATTENDANCE_CODE; null otherwise."
        default: null
      - name: credited_minutes_total
        type: integer
        source: computed
        description: Sum of CreditAllocation.minutes for this course; must equal total_minutes.
        default: 0
      - name: verified_credit_record_count
        type: integer
        source: system
        description: Count of CreditRecord rows for this course with status == VERIFIED.
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: Reason copied from the deciding CourseApplication when status becomes DENIED, or from the disposition when status becomes REVOKED.
        default: null

  - name: CreditAllocation
    parent: null
    common_fields: false
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; cascade-created from the credit_allocations array on POST /cle/courses and immutable thereafter."
      - name: category
        type: enum
        source: input
        description: Credit category this slice of the course carries.
        constraints: "GENERAL | ETHICS | TECHNOLOGY | BIAS_ELIMINATION; at most one row per (course_id, category)"
      - name: minutes
        type: integer
        source: input
        description: Instructional minutes allocated to this category.
        constraints: "> 0, multiple of ROUNDING_INCREMENT_MINUTES (15)"

  - name: CourseApplication
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course whose individual approval is sought."
      - name: applicant_role
        type: enum
        source: system
        description: Role of the X-User-Role that filed the application.
        constraints: "PROVIDER_ADMIN | ATTORNEY"
      - name: applicant_user_id
        type: string
        source: system
        description: X-User-ID of the filer; the only identity permitted to SUPPLEMENT or APPEAL this application.
      - name: status
        type: enum
        source: system
        description: Review lifecycle; see state_machines.CourseApplication.
        default: SUBMITTED
        constraints: "SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | APPEALED | APPEAL_GRANTED | APPEAL_DENIED"
      - name: info_request_round
        type: integer
        source: system
        description: Number of REQUEST_INFO actions issued so far; the MAX_INFO_REQUEST_ROUNDS-th+1 request is rejected.
        default: 0
      - name: supplement_count
        type: integer
        source: system
        description: Number of SUPPLEMENT actions the applicant has filed.
        default: 0
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the AccreditationReviewer who issued the most recent review action; compared against the appeal panelist for segregation of duties.
        default: null
      - name: denial_reason
        type: string
        source: system
        description: Reason recorded by the DENY review action or by an APPEAL_DENIED decision.
        default: null
      - name: appeal_grounds
        type: string
        source: system
        description: Grounds text supplied with the APPEAL action.
        default: null
      - name: appeal_panelist_user_id
        type: string
        source: system
        description: X-User-ID of the AppealsPanelist who decided the appeal.
        default: null
      - name: appeal_filed_at
        type: datetime
        source: system
        description: Logical-clock instant the APPEAL action was accepted.
        default: null
      - name: denied_at
        type: datetime
        source: system
        description: Logical-clock instant of the DENY review action; starts the APPEAL_WINDOW_DAYS clock.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the terminal decision (APPROVED, APPEAL_GRANTED, or APPEAL_DENIED).
        default: null
      - name: remand_count
        type: integer
        source: system
        description: Number of REMAND appeal dispositions that sent this application back to SUBMITTED.
        default: 0

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - name: bar_number
        type: string
        source: input
        description: State bar number; unique across all Attorney rows.
        constraints: "unique, 1..20 chars, required"
      - name: full_name
        type: string
        source: input
        description: Attorney name of record.
        constraints: "1..200 chars, required"
      - name: admission_date
        type: datetime
        source: input
        description: Date of admission to the bar; drives requirement proration for a cycle whose period contains it.
      - name: compliance_group
        type: enum
        source: input
        description: Reporting group; selects the filing-deadline offset (GROUP_1 31 days, GROUP_2 61 days, GROUP_3 91 days after period_end).
        constraints: "GROUP_1 | GROUP_2 | GROUP_3"
      - name: status
        type: enum
        source: system
        description: Standing of the attorney; ADMIN_SUSPENDED is written by the sweep and cleared by reinstatement.
        default: ACTIVE
        constraints: "ACTIVE | EXEMPT | ADMIN_SUSPENDED | INACTIVE"
      - name: principal_office_jurisdiction
        type: string
        source: input
        description: "Two-letter jurisdiction code of the attorney's principal office; HOME_JURISDICTION (\"ST\") means in-state. Comity requires this to equal the claim's origin_jurisdiction and to differ from HOME_JURISDICTION."
        constraints: "exactly 2 uppercase letters"
      - name: outstanding_fee_cents
        type: integer
        source: computed
        description: "Conserved money quantity: equals SUM(FeeAssessment.amount_cents) over this attorney's assessments whose status == ASSESSED. Every PAY and WAIVE decrements it by exactly that assessment's amount_cents."
        default: 0
      - name: open_deficiency_count
        type: integer
        source: system
        description: Count of this attorney's ComplianceCycle rows with credit_status == DEFICIENT.
        default: 0
      - name: pending_recertification_count
        type: integer
        source: system
        description: Number of times a previously SATISFIED cycle of this attorney was reverted to OPEN by a downstream credit void.
        default: 0

  - name: ComplianceCycle
    parent: null
    common_fields: true
    fields:
      - name: attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; the attorney whose compliance period this is."
      - name: previous_cycle_id
        type: string
        source: input
        description: "FK -> ComplianceCycle.id; the immediately preceding cycle of the same attorney, or null for the attorney's first cycle. Supplies carryover_in_*."
        default: null
      - name: comity_claim_id
        type: string
        source: system
        description: "FK -> ReciprocityClaim.id; set to the approved COMITY-basis claim that closed this cycle's general requirement, null otherwise."
        default: null
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the compliance period.
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the compliance period; the period is the half-open interval [period_start, period_end)."
      - name: filing_deadline
        type: datetime
        source: computed
        description: "period_end + DEADLINE_OFFSET_DAYS[attorney.compliance_group]. The sweep issues delinquency once the clock reaches it."
      - name: required_total_minutes
        type: integer
        source: computed
        description: Total countable minutes required; see calculations.cycle_requirement_derivation.
      - name: required_ethics_minutes
        type: integer
        source: computed
        description: Ethics minutes required; see calculations.cycle_requirement_derivation.
      - name: required_technology_minutes
        type: integer
        source: computed
        description: Technology minutes required; see calculations.cycle_requirement_derivation.
      - name: required_bias_minutes
        type: integer
        source: computed
        description: Elimination-of-bias minutes required; see calculations.cycle_requirement_derivation.
      - name: prorated
        type: boolean
        source: computed
        description: "True when the attorney's admission_date falls inside [period_start, period_end) and the requirement was therefore prorated."
        default: false
      - name: carryover_in_general_minutes
        type: integer
        source: computed
        description: "Equals previous_cycle.carryover_out_general_minutes at all times (conserved transfer quantity), or 0 when previous_cycle_id is null."
        default: 0
      - name: carryover_in_ethics_minutes
        type: integer
        source: computed
        description: "Equals previous_cycle.carryover_out_ethics_minutes at all times, or 0 when previous_cycle_id is null."
        default: 0
      - name: carryover_out_general_minutes
        type: integer
        source: computed
        description: General minutes carried forward out of this cycle; written by the FINAL application at certification and rewritten whenever the FINAL application is re-run.
        default: 0
      - name: carryover_out_ethics_minutes
        type: integer
        source: computed
        description: Ethics minutes carried forward out of this cycle; written by the FINAL application at certification.
        default: 0
      - name: earned_countable_minutes
        type: integer
        source: computed
        description: "Countable minutes credited to this cycle. Holds the PROVISIONAL application result while credit_status == OPEN, and the FINAL application result once credit_status leaves OPEN."
        default: 0
      - name: earned_ethics_minutes
        type: integer
        source: computed
        description: Countable ETHICS minutes under the same variant rule as earned_countable_minutes.
        default: 0
      - name: earned_technology_minutes
        type: integer
        source: computed
        description: Countable TECHNOLOGY minutes under the same variant rule as earned_countable_minutes.
        default: 0
      - name: earned_bias_minutes
        type: integer
        source: computed
        description: Countable BIAS_ELIMINATION minutes under the same variant rule as earned_countable_minutes.
        default: 0
      - name: earned_live_minutes
        type: integer
        source: computed
        description: Countable minutes whose CreditRecord.effective_format == LIVE; caps carryover_out_general_minutes.
        default: 0
      - name: credit_status
        type: enum
        source: system
        description: Credit dimension of the parallel state machine; see state_machines.ComplianceCycle.
        default: OPEN
        constraints: "OPEN | SATISFIED | DEFICIENT | CLOSED_COMITY"
      - name: administrative_status
        type: enum
        source: system
        description: Administrative dimension of the parallel state machine; advances independently of credit_status.
        default: GOOD_STANDING
        constraints: "GOOD_STANDING | DELINQUENT | ADMIN_SUSPENDED | REINSTATED"
      - name: delinquent_since
        type: datetime
        source: system
        description: Logical-clock instant the sweep set administrative_status to DELINQUENT; suspension fires at delinquent_since + DELINQUENCY_TO_SUSPENSION_DAYS.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant the attorney certified the cycle.
        default: null
      - name: carryover_election
        type: enum
        source: input
        description: Election supplied at certification; WAIVE_CARRYOVER forces both carryover_out_* to 0.
        default: CARRY_FORWARD
        constraints: "CARRY_FORWARD | WAIVE_CARRYOVER"

  - name: Affirmation
    parent: null
    common_fields: false
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> ComplianceCycle.id; the cycle this affirmation is filed against."
      - name: affirmation_type
        type: enum
        source: input
        description: "ATTENDANCE_AFFIRMATION verifies one CreditRecord; SELF_STUDY_AFFIRMATION attests unverified self-study; FINAL_COMPLIANCE_AFFIRMATION is the prerequisite for certification."
        constraints: "ATTENDANCE_AFFIRMATION | SELF_STUDY_AFFIRMATION | FINAL_COMPLIANCE_AFFIRMATION"
      - name: affirmed_by_user_id
        type: string
        source: system
        description: X-User-ID of the affirming attorney; must equal the cycle's attorney_id.
      - name: statement
        type: string
        source: input
        description: Verbatim affirmation statement.
        constraints: "1..500 chars, required"
      - name: target_credit_record_id
        type: string
        source: input
        description: "Identifier of the CreditRecord this ATTENDANCE_AFFIRMATION verifies; required when affirmation_type == ATTENDANCE_AFFIRMATION and forbidden otherwise. The reverse link is CreditRecord.affirmation_id, which is the queryable side of the association."
        default: null

  - name: CreditRecord
    parent: null
    common_fields: true
    fields:
      - name: attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; the attorney claiming the credit."
      - name: cycle_id
        type: string
        source: system
        description: "FK -> ComplianceCycle.id; resolved server-side to the attorney's unique cycle whose half-open period [period_start, period_end) contains completion_date."
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course attended."
      - name: attendance_report_id
        type: string
        source: system
        description: "FK -> AttendanceReport.id; set when the record was cascade-created from a provider roster, null otherwise."
        default: null
      - name: reciprocity_claim_id
        type: string
        source: system
        description: "FK -> ReciprocityClaim.id; set when the record was cascade-created by an approved reciprocity determination, null otherwise."
        default: null
      - name: affirmation_id
        type: string
        source: system
        description: "FK -> Affirmation.id; set when an ATTENDANCE_AFFIRMATION verified this record, null otherwise."
        default: null
      - name: verification_method
        type: enum
        source: input
        description: "How attendance is verified. ROSTER is writable only by the roster cascade; ATTENDANCE_CODE verifies immediately on a matching code; CERTIFICATE and AFFIRMATION create the record PENDING_VERIFICATION."
        constraints: "ROSTER | ATTENDANCE_CODE | CERTIFICATE | AFFIRMATION"
      - name: certificate_reference
        type: string
        source: input
        description: Sponsor certificate identifier; required when verification_method == CERTIFICATE.
        default: null
      - name: attended_minutes
        type: integer
        source: input
        description: Minutes actually attended; clamped to the course's total_minutes before proration.
        constraints: "> 0"
      - name: completion_date
        type: datetime
        source: input
        description: Instant attendance completed; selects the owning ComplianceCycle and orders the chronological FINAL application.
      - name: credited_minutes
        type: integer
        source: computed
        description: "Sum of the four credited_*_minutes fields; see calculations.credit_record_category_proration (round per category, then sum)."
        default: 0
      - name: credited_general_minutes
        type: integer
        source: computed
        description: GENERAL minutes credited for this record after per-category downward rounding.
        default: 0
      - name: credited_ethics_minutes
        type: integer
        source: computed
        description: ETHICS minutes credited for this record after per-category downward rounding.
        default: 0
      - name: credited_technology_minutes
        type: integer
        source: computed
        description: TECHNOLOGY minutes credited for this record after per-category downward rounding.
        default: 0
      - name: credited_bias_minutes
        type: integer
        source: computed
        description: BIAS_ELIMINATION minutes credited for this record after per-category downward rounding.
        default: 0
      - name: countable_minutes
        type: integer
        source: computed
        description: "Minutes of credited_minutes that survived this cycle's format and source caps in the most recent run of calculations.cycle_credit_application (PROVISIONAL while the cycle is OPEN, FINAL afterwards)."
        default: 0
      - name: effective_format
        type: enum
        source: computed
        description: "LIVE for LIVE_IN_PERSON, and for LIVE_WEBCAST when verification_method == ATTENDANCE_CODE or ROSTER; ON_DEMAND for ON_DEMAND courses and for LIVE_WEBCAST verified any other way; SELF_STUDY for SELF_STUDY courses."
        constraints: "LIVE | ON_DEMAND | SELF_STUDY"
      - name: source
        type: enum
        source: computed
        description: "RECIPROCITY when reciprocity_claim_id is non-null and that claim's basis == RECIPROCITY, COMITY when that claim's basis == COMITY, IN_STATE otherwise."
        default: IN_STATE
        constraints: "IN_STATE | RECIPROCITY | COMITY"
      - name: status
        type: enum
        source: system
        description: Verification lifecycle; see state_machines.CreditRecord.
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | VERIFIED | REJECTED | VOIDED"
      - name: void_reason
        type: string
        source: system
        description: Reason recorded when the record is REJECTED or VOIDED.
        default: null

  - name: AttendanceReport
    parent: null
    common_fields: true
    fields:
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course whose session roster this is. The sponsoring provider is course.provider_id."
      - name: session_date
        type: datetime
        source: input
        description: Session start instant covered by this roster.
      - name: session_end
        type: datetime
        source: computed
        description: "session_date + course.total_minutes; the roster occupies the closed interval [session_date, session_end] on the course as a resource."
      - name: entries
        type: array
        source: input
        description: "Array of { bar_number: string, attended_minutes: integer } roster rows; must contain at least one element."
        constraints: "length >= 1"
      - name: entry_count
        type: integer
        source: computed
        description: Number of rows supplied in entries.
        default: 0
      - name: accepted_entry_count
        type: integer
        source: computed
        description: Rows whose bar_number resolved to an Attorney and produced a VERIFIED CreditRecord.
        default: 0
      - name: rejected_entry_count
        type: integer
        source: computed
        description: "Rows skipped because the bar_number matched no Attorney, or the attorney had no cycle covering session_date, or a VERIFIED/PENDING_VERIFICATION record already existed for (attorney_id, course_id, session_date). Skipped rows never fail the request."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the roster was accepted.
      - name: days_late
        type: integer
        source: computed
        description: "0 when submitted_at <= session_date + ROSTER_DUE_DAYS, otherwise ceil((submitted_at - due_at) / 1 day) — a partial day counts as a whole day; see calculations.attendance_report_lateness."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACCEPTED when days_late == 0, ACCEPTED_LATE when days_late > 0; REJECTED is never persisted (a rejected submission returns an error instead)."
        default: ACCEPTED
        constraints: "ACCEPTED | ACCEPTED_LATE"

  - name: ReciprocityClaim
    parent: null
    common_fields: true
    fields:
      - name: attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; the claiming attorney."
      - name: basis
        type: enum
        source: input
        description: "RECIPROCITY converts specific out-of-state course credit; COMITY closes the general requirement for an attorney whose principal office is in a comity jurisdiction."
        constraints: "RECIPROCITY | COMITY"
      - name: origin_jurisdiction
        type: string
        source: input
        description: Two-letter code of the jurisdiction that accredited the origin course.
        constraints: "exactly 2 uppercase letters"
      - name: origin_course_title
        type: string
        source: input
        description: Title of the out-of-state course.
        constraints: "1..200 chars, required"
      - name: origin_credit_hours
        type: number
        source: input
        description: Credit hours as awarded by the origin jurisdiction, in that jurisdiction's hour length.
        constraints: "> 0, at most 2 decimal places"
      - name: origin_category
        type: enum
        source: input
        description: Origin jurisdiction's category label; mapped to a home category by calculations.reciprocity_credit_conversion.
        constraints: "GENERAL | PROFESSIONALISM | ETHICS | TECHNOLOGY | DIVERSITY_INCLUSION"
      - name: completion_date
        type: datetime
        source: input
        description: Completion instant; selects the owning ComplianceCycle for the cascade-created CreditRecord.
      - name: converted_minutes
        type: integer
        source: computed
        description: Home-jurisdiction minutes granted on approval; see calculations.reciprocity_credit_conversion.
        default: 0
      - name: converted_category
        type: enum
        source: computed
        description: Home category the converted minutes land in.
        default: GENERAL
        constraints: "GENERAL | ETHICS | TECHNOLOGY | BIAS_ELIMINATION"
      - name: status
        type: enum
        source: system
        description: Determination lifecycle; see state_machines.ReciprocityClaim.
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED"
      - name: determination_reason
        type: string
        source: system
        description: Reason recorded with the determination or with an automatic denial cascade.
        default: null

  - name: ProviderAudit
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the audited provider."
      - name: originating_complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the substantiated complaint that escalated into this audit, or null for RISK_BASED and RANDOM audits."
        default: null
      - name: audit_period_start
        type: datetime
        source: input
        description: Inclusive start of the audited course-presentation window.
      - name: audit_period_end
        type: datetime
        source: input
        description: "Inclusive end of the audited window; the engagement occupies the CLOSED interval [audit_period_start, audit_period_end] on the provider as a resource."
      - name: trigger_type
        type: enum
        source: input
        description: Why the audit was opened.
        constraints: "RISK_BASED | COMPLAINT_ESCALATION | RANDOM"
      - name: risk_score_at_open
        type: number
        source: computed
        description: Provider.risk_score frozen at the instant the audit was opened; drives sample_size.
        default: 0.0
      - name: sample_size
        type: integer
        source: computed
        description: Number of courses drawn by the DRAW_SAMPLE action; see calculations.audit_sample_selection.
        default: 0
      - name: sampled_course_ids
        type: array
        source: computed
        description: Ordered array of Course identifier strings selected by calculations.audit_sample_selection; empty until DRAW_SAMPLE succeeds.
        default: []
      - name: findings_count
        type: integer
        source: input
        description: Number of deficient courses found; supplied with the ISSUE_FINDINGS action and bounded by sample_size.
        default: 0
        constraints: ">= 0 and <= sample_size"
      - name: status
        type: enum
        source: system
        description: Audit lifecycle; see state_machines.ProviderAudit.
        default: OPENED
        constraints: "OPENED | SAMPLED | FINDINGS_ISSUED | CLEARED | SANCTIONED"
      - name: sanction_type
        type: enum
        source: system
        description: Sanction applied by the CLOSE_SANCTIONED branch; NONE on the CLEARED branch.
        default: NONE
        constraints: "NONE | PROBATION | SUSPENSION"
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the audit reached CLEARED or SANCTIONED.
        default: null

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: subject_type
        type: enum
        source: input
        description: Which entity kind the complaint targets.
        constraints: "PROVIDER | COURSE"
      - name: subject_id
        type: string
        source: input
        description: "Polymorphic subject reference, resolved by subject_type: it must equal Provider.id when subject_type == PROVIDER and Course.id when subject_type == COURSE. Because the reference is polymorphic it is deliberately not declared as a single-parent FK; existence is validated against the resolved table."
      - name: complainant_role
        type: enum
        source: system
        description: X-User-Role that filed the complaint.
        constraints: "ATTORNEY | BOARD_ADMIN"
      - name: complainant_user_id
        type: string
        source: system
        description: X-User-ID of the filer.
      - name: allegation
        type: string
        source: input
        description: Narrative of the allegation.
        constraints: "1..1000 chars, required"
      - name: allegation_category
        type: enum
        source: input
        description: Allegation taxonomy; ATTENDANCE_FRAUD and MISREPRESENTED_CREDIT escalate to an audit on substantiation.
        constraints: "MISREPRESENTED_CREDIT | NO_SHOW_FACULTY | ATTENDANCE_FRAUD | FEE_DISPUTE"
      - name: status
        type: enum
        source: system
        description: Complaint lifecycle; see state_machines.Complaint.
        default: RECEIVED
        constraints: "RECEIVED | UNDER_REVIEW | SUBSTANTIATED | DISMISSED"
      - name: disposition_reason
        type: string
        source: system
        description: Reason recorded with the SUBSTANTIATE or DISMISS disposition.
        default: null
      - name: escalated
        type: boolean
        source: computed
        description: "True once a ProviderAudit has been opened with originating_complaint_id equal to this complaint's id."
        default: false

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - name: attorney_id
        type: string
        source: system
        description: "FK -> Attorney.id; null for provider-side assessments."
        default: null
      - name: cycle_id
        type: string
        source: system
        description: "FK -> ComplianceCycle.id; the cycle whose delinquency produced this assessment, null for provider-side and reinstatement-independent assessments."
        default: null
      - name: provider_id
        type: string
        source: system
        description: "FK -> Provider.id; null for attorney-side assessments."
        default: null
      - name: assessed_by_sweep_id
        type: string
        source: system
        description: "FK -> ReportingSweep.id; the sweep run that created this assessment, null when created by a non-sweep action."
        default: null
      - name: fee_type
        type: enum
        source: system
        description: Fee taxonomy.
        constraints: "LATE_COMPLIANCE | REINSTATEMENT | AUDIT_SANCTION | PROVIDER_ANNUAL"
      - name: amount_cents
        type: integer
        source: computed
        description: Assessed amount; see calculations.late_fee_assessment for LATE_COMPLIANCE and the constants for the fixed fee types.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Settlement lifecycle; see state_machines.FeeAssessment.
        default: ASSESSED
        constraints: "ASSESSED | PAID | WAIVED | VOIDED"
      - name: assessed_at
        type: datetime
        source: system
        description: Logical-clock instant of assessment.
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant the assessment left ASSESSED.
        default: null
      - name: waiver_reason
        type: string
        source: system
        description: Reason recorded with a WAIVE settlement.
        default: null

  - name: ReportingSweep
    parent: null
    common_fields: false
    fields:
      - name: sweep_number
        type: integer
        source: system
        description: Monotonic run number starting at 1; the system epoch counter.
      - name: as_of
        type: datetime
        source: computed
        description: Logical-clock instant the sweep evaluated; every deadline comparison in the run uses this instant.
      - name: cycles_examined
        type: integer
        source: computed
        description: Count of ComplianceCycle rows whose filing_deadline <= as_of that the run inspected.
        default: 0
      - name: delinquencies_issued
        type: integer
        source: computed
        description: Count of cycles moved from GOOD_STANDING to DELINQUENT by this run.
        default: 0
      - name: suspensions_issued
        type: integer
        source: computed
        description: Count of cycles moved from DELINQUENT to ADMIN_SUSPENDED by this run.
        default: 0
      - name: late_fees_assessed_cents
        type: integer
        source: computed
        description: Sum of amount_cents over the LATE_COMPLIANCE and REINSTATEMENT assessments this run created.
        default: 0
      - name: courses_expired
        type: integer
        source: computed
        description: Count of APPROVED courses moved to EXPIRED by this run.
        default: 0
      - name: providers_lapsed
        type: integer
        source: computed
        description: Count of providers moved to LAPSED by this run.
        default: 0

# =============================================================================
# §1.2 State Machine Table  (9 machines; CourseApplication cyclic,
#      ComplianceCycle parallel-dimensioned, Provider cyclic-with-revert,
#      ProviderAudit branching fork-join)
# =============================================================================
state_machines:

  - entity: Provider
    initial_state: APPLIED
    terminal_states: [DENIED]
    note: |
      Cyclic with reverts: ACCREDITED -> PROBATIONARY -> ACCREDITED, ACCREDITED -> LAPSED ->
      PROBATIONARY, SUSPENDED -> PROBATIONARY. Every actor-driven transition runs through
      POST /cle/providers/{id}/accreditation-actions and therefore carries the OCC
      field expected_provider_version.
    transitions:
      - from: APPLIED
        to: ACCREDITED
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = GRANT_FULL)"
        actor: BoardAdmin
        preconditions:
          - "provider.provider_type IN {BAR_ASSOCIATION, LAW_SCHOOL, GOVERNMENT} (presumptive full grant)"
          - "expected_provider_version == provider.version"
        side_effects:
          - "accreditation_term_start = clock_now; accreditation_term_end = clock_now + ACCREDITATION_TERM_MONTHS"
          - "self_certification_enabled = true"
          - "create FeeAssessment(fee_type = PROVIDER_ANNUAL, provider_id = provider.id, amount_cents = provider.annual_fee_cents, status = ASSESSED)"
          - "recompute Provider.risk_score under variant SELF_CERTIFIED_WEIGHTING; set risk_score_variant = SELF_CERTIFIED_WEIGHTING"
          - "increments Provider.version by 1"
      - from: APPLIED
        to: PROBATIONARY
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = GRANT_PROBATIONARY)"
        actor: BoardAdmin
        preconditions:
          - "expected_provider_version == provider.version"
        side_effects:
          - "accreditation_term_start = clock_now; accreditation_term_end = clock_now + ACCREDITATION_TERM_MONTHS"
          - "self_certification_enabled = false"
          - "create FeeAssessment(fee_type = PROVIDER_ANNUAL, provider_id = provider.id, amount_cents = provider.annual_fee_cents, status = ASSESSED)"
          - "recompute Provider.risk_score under variant REVIEWED_WEIGHTING"
          - "increments Provider.version by 1"
      - from: APPLIED
        to: DENIED
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = DENY)"
        actor: BoardAdmin
        preconditions:
          - "expected_provider_version == provider.version"
        side_effects:
          - "probation_reason = action_note"
          - "increments Provider.version by 1"
      - from: PROBATIONARY
        to: ACCREDITED
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = GRANT_FULL)"
        actor: BoardAdmin
        preconditions:
          - "at least one ProviderAudit with provider_id == provider.id AND status == CLEARED exists (cross-entity gate)"
          - "expected_provider_version == provider.version"
        side_effects:
          - "self_certification_enabled = true; risk_score_variant = SELF_CERTIFIED_WEIGHTING and risk_score recomputed under it"
          - "increments Provider.version by 1"
      - from: ACCREDITED
        to: ACCREDITED
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = RENEW)"
        actor: BoardAdmin
        preconditions:
          - "no FeeAssessment with provider_id == provider.id AND fee_type == PROVIDER_ANNUAL AND status == ASSESSED (prior-term fee settled)"
          - "expected_provider_version == provider.version"
        side_effects:
          - "accreditation_term_start = clock_now; accreditation_term_end = clock_now + ACCREDITATION_TERM_MONTHS (the new term supersedes the prior term)"
          - "create FeeAssessment(fee_type = PROVIDER_ANNUAL, provider_id = provider.id, amount_cents = provider.annual_fee_cents, status = ASSESSED)"
          - "increments Provider.version by 1"
        note: "Self-transition: renewal is legitimately repeatable, which is exactly why the OCC guard concurrency_rules[renew-supersede-stale-provider] is required."
      - from: ACCREDITED
        to: PROBATIONARY
        trigger: "system event: ProviderAudit FINDINGS_ISSUED -> SANCTIONED with sanction_type == PROBATION, or Complaint UNDER_REVIEW -> SUBSTANTIATED whose subject_type == PROVIDER and subject_id == provider.id"
        actor: system
        preconditions:
          - "provider.accreditation_status == ACCREDITED"
        side_effects:
          - "self_certification_enabled = false; risk_score_variant = REVIEWED_WEIGHTING and risk_score recomputed under it"
          - "probation_reason set from the audit id or complaint id that caused the revert"
          - "increments Provider.version by 1"
        note: "Courses are NOT suspended on probation; only SUSPENDED / LAPSED cascade into Course. A substantiated complaint whose subject_type == COURSE raises the sponsoring provider's substantiated_complaint_count and re-scores its risk_score, but never moves its accreditation_status."
      - from: PROBATIONARY
        to: SUSPENDED
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = SUSPEND), or system event: ProviderAudit -> SANCTIONED with sanction_type == SUSPENSION"
        actor: BoardAdmin | system
        preconditions:
          - "for the actor-driven form: expected_provider_version == provider.version"
        side_effects:
          - "self_certification_enabled = false"
          - "cascade: every Course with provider_id == provider.id AND status == APPROVED AND approval_pathway == PROVIDER_ACCREDITED AND expires_at > clock_now transitions APPROVED -> SUSPENDED_PENDING_REVIEW"
          - "increments Provider.version by 1"
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = SUSPEND), or system event: ProviderAudit -> SANCTIONED with sanction_type == SUSPENSION"
        actor: BoardAdmin | system
        preconditions:
          - "for the actor-driven form: expected_provider_version == provider.version"
        side_effects:
          - "self_certification_enabled = false; risk_score_variant = REVIEWED_WEIGHTING and risk_score recomputed under it"
          - "cascade: every Course with provider_id == provider.id AND status == APPROVED AND approval_pathway == PROVIDER_ACCREDITED AND expires_at > clock_now transitions APPROVED -> SUSPENDED_PENDING_REVIEW"
          - "increments Provider.version by 1"
      - from: SUSPENDED
        to: PROBATIONARY
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = REINSTATE)"
        actor: BoardAdmin
        preconditions:
          - "no FeeAssessment with provider_id == provider.id AND fee_type == AUDIT_SANCTION AND status == ASSESSED"
          - "expected_provider_version == provider.version"
        side_effects:
          - "compensation cascade: every Course with provider_id == provider.id AND status == SUSPENDED_PENDING_REVIEW AND expires_at > clock_now transitions back to APPROVED"
          - "increments Provider.version by 1"
      - from: ACCREDITED
        to: LAPSED
        trigger: "system event: POST /cle/reporting-sweeps observes accreditation_term_end <= sweep.as_of"
        actor: system
        preconditions:
          - "provider.accreditation_status == ACCREDITED"
          - "provider.accreditation_term_end <= sweep.as_of"
        side_effects:
          - "self_certification_enabled = false"
          - "cascade: every Course with provider_id == provider.id AND status == APPROVED AND approval_pathway == PROVIDER_ACCREDITED AND expires_at > sweep.as_of transitions APPROVED -> SUSPENDED_PENDING_REVIEW"
          - "sweep.providers_lapsed += 1"
          - "increments Provider.version by 1"
      - from: PROBATIONARY
        to: LAPSED
        trigger: "system event: POST /cle/reporting-sweeps observes accreditation_term_end <= sweep.as_of"
        actor: system
        preconditions:
          - "provider.accreditation_term_end <= sweep.as_of"
        side_effects:
          - "sweep.providers_lapsed += 1"
          - "increments Provider.version by 1"
      - from: LAPSED
        to: PROBATIONARY
        trigger: "POST /cle/providers/{id}/accreditation-actions (action = RENEW)"
        actor: BoardAdmin
        preconditions:
          - "expected_provider_version == provider.version"
        side_effects:
          - "accreditation_term_start = clock_now; accreditation_term_end = clock_now + ACCREDITATION_TERM_MONTHS"
          - "create FeeAssessment(fee_type = PROVIDER_ANNUAL, provider_id = provider.id, amount_cents = provider.annual_fee_cents, status = ASSESSED)"
          - "compensation cascade: every Course with provider_id == provider.id AND status == SUSPENDED_PENDING_REVIEW AND expires_at > clock_now transitions back to APPROVED"
          - "increments Provider.version by 1"
        note: "A lapsed provider re-enters on probation, never straight to ACCREDITED — the cycle Provider: ACCREDITED -> LAPSED -> PROBATIONARY -> ACCREDITED."

  - entity: Course
    initial_state: PENDING_APPROVAL
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /cle/courses (auto-transition at creation)"
        actor: ProviderAdmin
        preconditions:
          - "course.provider_id is non-null AND that provider's self_certification_enabled == true, i.e. approval_pathway == PROVIDER_ACCREDITED"
        side_effects:
          - "provider.courses_self_certified_count += 1; provider.courses_total_count += 1"
          - "recompute provider.risk_score (denominator changed)"
        note: "Presumptive approval: an accredited sponsor self-certifies. No CourseApplication is created or permitted."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = APPROVE)"
        actor: AccreditationReviewer
        preconditions:
          - "application.course_id == course.id AND application.status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "application.status -> APPROVED; application.decided_at = clock_now"
      - from: PENDING_APPROVAL
        to: DENIED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = DENY)"
        actor: AccreditationReviewer
        preconditions:
          - "application.course_id == course.id AND application.status IN {SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "course.denial_reason = application.denial_reason"
          - "application.status -> DENIED; application.denied_at = clock_now"
      - from: DENIED
        to: APPROVED
        trigger: "POST /cle/course-applications/{id}/appeal-decisions (disposition = GRANT)"
        actor: AppealsPanelist
        preconditions:
          - "application.status == APPEALED"
          - "application.appeal_panelist_user_id (the acting X-User-ID) != application.reviewer_user_id"
        side_effects:
          - "course.denial_reason = null"
          - "application.status -> APPEAL_GRANTED; application.decided_at = clock_now"
      - from: DENIED
        to: PENDING_APPROVAL
        trigger: "POST /cle/course-applications/{id}/appeal-decisions (disposition = REMAND)"
        actor: AppealsPanelist
        preconditions:
          - "application.status == APPEALED"
          - "application.remand_count < MAX_REMANDS"
        side_effects:
          - "course.denial_reason = null"
          - "application.status -> SUBMITTED; application.remand_count += 1; application.reviewer_user_id = null"
      - from: APPROVED
        to: SUSPENDED_PENDING_REVIEW
        trigger: "system event: sponsoring Provider entered SUSPENDED or LAPSED"
        actor: system
        preconditions:
          - "course.approval_pathway == PROVIDER_ACCREDITED"
          - "course.expires_at > clock_now"
        side_effects:
          - "cascade: every CreditRecord for this course with status == PENDING_VERIFICATION transitions PENDING_VERIFICATION -> REJECTED with void_reason = 'SPONSOR_NOT_IN_GOOD_STANDING'"
      - from: SUSPENDED_PENDING_REVIEW
        to: APPROVED
        trigger: "system event: sponsoring Provider left SUSPENDED / LAPSED via REINSTATE or RENEW"
        actor: system
        preconditions:
          - "course.expires_at > clock_now"
        side_effects:
          - "no credit-record compensation: records already REJECTED stay REJECTED and must be re-filed"
      - from: APPROVED
        to: EXPIRED
        trigger: "system event: POST /cle/reporting-sweeps observes course.expires_at <= sweep.as_of"
        actor: system
        preconditions:
          - "course.status == APPROVED"
        side_effects:
          - "sweep.courses_expired += 1"
      - from: APPROVED
        to: REVOKED
        trigger: "system event: Complaint -> SUBSTANTIATED whose subject_type == COURSE and subject_id == course.id"
        actor: system
        preconditions:
          - "course.status IN {APPROVED, SUSPENDED_PENDING_REVIEW, EXPIRED}"
        side_effects:
          - "course.denial_reason = complaint.disposition_reason"
          - "cascade: every CreditRecord for this course with status == VERIFIED transitions VERIFIED -> VOIDED with void_reason = 'COURSE_REVOKED'"
      - from: SUSPENDED_PENDING_REVIEW
        to: REVOKED
        trigger: "system event: Complaint -> SUBSTANTIATED whose subject_type == COURSE and subject_id == course.id"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every CreditRecord for this course with status == VERIFIED transitions VERIFIED -> VOIDED with void_reason = 'COURSE_REVOKED'"

  - entity: CourseApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, APPEAL_GRANTED, APPEAL_DENIED]
    note: |
      Cyclic on two loops. Loop 1: SUBMITTED -> INFO_REQUESTED -> SUBMITTED, bounded by
      MAX_INFO_REQUEST_ROUNDS. Loop 2: DENIED -> APPEALED -> SUBMITTED (REMAND), bounded by
      MAX_REMANDS, which can re-enter loop 1.
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = REQUEST_INFO)"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == SUBMITTED"
          - "application.info_request_round < MAX_INFO_REQUEST_ROUNDS"
        side_effects:
          - "info_request_round += 1; reviewer_user_id = acting X-User-ID"

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /cle/course-applications/{id}/appellant-actions (action = SUPPLEMENT)"
        actor: ProviderAdmin | Attorney
        preconditions:
          - "application.status == INFO_REQUESTED"
          - "acting X-User-ID == application.applicant_user_id"
        side_effects:
          - "supplement_count += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = APPROVE)"
        actor: AccreditationReviewer
        preconditions:
          - "application.status IN {SUBMITTED, INFO_REQUESTED}"
          - "course.status == PENDING_APPROVAL"
        side_effects:
          - "decided_at = clock_now; reviewer_user_id = acting X-User-ID"
          - "cascade: Course PENDING_APPROVAL -> APPROVED"

      - from: INFO_REQUESTED
        to: APPROVED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = APPROVE)"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == INFO_REQUESTED"
        side_effects:
          - "decided_at = clock_now; reviewer_user_id = acting X-User-ID"
          - "cascade: Course PENDING_APPROVAL -> APPROVED"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = DENY)"
        actor: AccreditationReviewer
        preconditions:
          - "application.status IN {SUBMITTED, INFO_REQUESTED}"
          - "denial_reason supplied"
        side_effects:
          - "denial_reason recorded; denied_at = clock_now; reviewer_user_id = acting X-User-ID"
          - "cascade: Course PENDING_APPROVAL -> DENIED with the same denial_reason"

      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /cle/course-applications/{id}/review-actions (action = DENY), or the MAX_INFO_REQUEST_ROUNDS-th round elapsing without a supplement is NOT auto-denied (no timer transition exists)"
        actor: AccreditationReviewer
        preconditions:
          - "application.status == INFO_REQUESTED"
        side_effects:
          - "denial_reason recorded; denied_at = clock_now"
          - "cascade: Course PENDING_APPROVAL -> DENIED"

      - from: DENIED
        to: APPEALED
        trigger: "POST /cle/course-applications/{id}/appellant-actions (action = APPEAL)"
        actor: ProviderAdmin | Attorney
        preconditions:
          - "application.status == DENIED"
          - "acting X-User-ID == application.applicant_user_id"
          - "clock_now < application.denied_at + APPEAL_WINDOW_DAYS"
          - "appeal_grounds supplied"
        side_effects:
          - "appeal_grounds recorded; appeal_filed_at = clock_now"
      - from: APPEALED
        to: APPEAL_GRANTED
        trigger: "POST /cle/course-applications/{id}/appeal-decisions (disposition = GRANT)"
        actor: AppealsPanelist
        preconditions:
          - "application.status == APPEALED"
          - "acting X-User-ID != application.reviewer_user_id (segregation of duties)"
        side_effects:
          - "appeal_panelist_user_id = acting X-User-ID; decided_at = clock_now; denial_reason = null"
          - "cascade: Course DENIED -> APPROVED"
      - from: APPEALED
        to: APPEAL_DENIED
        trigger: "POST /cle/course-applications/{id}/appeal-decisions (disposition = DENY)"
        actor: AppealsPanelist
        preconditions:
          - "application.status == APPEALED"
          - "acting X-User-ID != application.reviewer_user_id (segregation of duties)"
        side_effects:
          - "appeal_panelist_user_id = acting X-User-ID; decided_at = clock_now"
          - "Course remains DENIED (terminal for this application; a new application may be filed only after the course is re-created)"
      - from: APPEALED
        to: SUBMITTED
        trigger: "POST /cle/course-applications/{id}/appeal-decisions (disposition = REMAND)"
        actor: AppealsPanelist
        preconditions:
          - "application.status == APPEALED"
          - "application.remand_count < MAX_REMANDS"
          - "acting X-User-ID != application.reviewer_user_id (segregation of duties)"
        side_effects:
          - "remand_count += 1; reviewer_user_id = null; denial_reason = null; denied_at = null; info_request_round reset to 0"
          - "appeal_panelist_user_id = acting X-User-ID"
          - "cascade: Course DENIED -> PENDING_APPROVAL"
        note: "Closes the review cycle: the application re-enters loop 1 with a fresh info-request budget."

  - entity: ComplianceCycle
    initial_state: "credit_status = OPEN, administrative_status = GOOD_STANDING"
    terminal_states: []
    parallel_dimensions:
      credit_status: [OPEN, SATISFIED, DEFICIENT, CLOSED_COMITY]
      administrative_status: [GOOD_STANDING, DELINQUENT, ADMIN_SUSPENDED, REINSTATED]
    note: |
      The two dimensions advance independently: a cycle can be SATISFIED yet DELINQUENT (credits
      earned, filed late), or OPEN and GOOD_STANDING, or DEFICIENT and ADMIN_SUSPENDED. Every
      transition below names the dimension it moves; no transition writes both dimensions except
      where explicitly stated.
    transitions:
      - from: "credit_status = OPEN"
        to: "credit_status = SATISFIED"
        trigger: "POST /cle/compliance-cycles/{id}/certification"
        actor: Attorney
        preconditions:
          - "cycle.administrative_status != ADMIN_SUSPENDED"
          - "an Affirmation with affirmation_type == FINAL_COMPLIANCE_AFFIRMATION exists for this cycle"
          - "attorney.status IN {ACTIVE, EXEMPT}"
          - "the FINAL run of calculations.cycle_credit_application yields deficiency_total_minutes == 0 AND all three specialty deficiencies == 0"
        side_effects:
          - "certified_at = clock_now; earned_* fields frozen to the FINAL variant result"
          - "carryover_out_general_minutes and carryover_out_ethics_minutes written per calculations.carryover_determination (both 0 when carryover_election == WAIVE_CARRYOVER)"
          - "cascade: any ComplianceCycle whose previous_cycle_id == this cycle's id has carryover_in_general_minutes / carryover_in_ethics_minutes rewritten to match, then its own earned/deficiency figures recomputed under the PROVISIONAL variant"
          - "every CreditRecord in this cycle has countable_minutes rewritten to its FINAL-variant value"
          - "increments ComplianceCycle.version by 1"
      - from: "credit_status = OPEN"
        to: "credit_status = DEFICIENT"
        trigger: "POST /cle/compliance-cycles/{id}/certification"
        actor: Attorney
        preconditions:
          - "cycle.administrative_status != ADMIN_SUSPENDED"
          - "an Affirmation with affirmation_type == FINAL_COMPLIANCE_AFFIRMATION exists for this cycle"
          - "attorney.status IN {ACTIVE, EXEMPT}"
          - "the FINAL run yields deficiency_total_minutes > 0 OR any specialty deficiency > 0"
        side_effects:
          - "certified_at = clock_now; earned_* fields frozen to the FINAL variant result"
          - "carryover_out_general_minutes = 0 and carryover_out_ethics_minutes = 0 (a deficient cycle never carries forward)"
          - "attorney.open_deficiency_count += 1"
          - "increments ComplianceCycle.version by 1"
      - from: "credit_status = OPEN"
        to: "credit_status = CLOSED_COMITY"
        trigger: "system event: POST /cle/reciprocity-claims/{id}/determination (action = APPROVE) on a claim with basis == COMITY"
        actor: system
        preconditions:
          - "claim.basis == COMITY AND the comity gate in calculations.reciprocity_credit_conversion passes"
          - "the cycle's VERIFIED-only specialty totals already meet required_ethics_minutes, required_technology_minutes and required_bias_minutes"
        side_effects:
          - "comity_claim_id = claim.id; certified_at = clock_now"
          - "earned_countable_minutes set to required_total_minutes (general requirement deemed met by comity); earned_ethics/technology/bias keep their computed values"
          - "carryover_out_general_minutes = 0; carryover_out_ethics_minutes = 0 (comity closure never carries forward)"
          - "increments ComplianceCycle.version by 1"
      - from: "credit_status = OPEN"
        to: "credit_status = DEFICIENT"
        trigger: "system event: POST /cle/reciprocity-claims/{id}/determination (action = APPROVE) on a COMITY claim whose specialty gate fails"
        actor: system
        preconditions:
          - "claim.basis == COMITY AND the comity jurisdiction gate passes"
          - "at least one of the VERIFIED-only specialty totals is below its requirement"
        side_effects:
          - "comity_claim_id = claim.id (recorded even though the cycle is not closed)"
          - "attorney.open_deficiency_count += 1"
          - "increments ComplianceCycle.version by 1"
        note: "Comity waives the general hour requirement only; ethics, technology and elimination-of-bias minimums survive it."
      - from: "credit_status = SATISFIED"
        to: "credit_status = OPEN"
        trigger: "system event: a VERIFIED CreditRecord in this cycle transitions to VOIDED and the FINAL re-run no longer meets the requirement"
        actor: system
        preconditions:
          - "cycle.credit_status == SATISFIED"
          - "the FINAL re-run yields deficiency_total_minutes > 0 OR any specialty deficiency > 0"
        side_effects:
          - "certified_at = null; carryover_out_general_minutes = 0; carryover_out_ethics_minutes = 0"
          - "attorney.pending_recertification_count += 1"
          - "cascade: any ComplianceCycle whose previous_cycle_id == this cycle's id has carryover_in_* rewritten to 0 and its earned/deficiency figures recomputed"
          - "increments ComplianceCycle.version by 1"
      - from: "administrative_status = GOOD_STANDING"
        to: "administrative_status = DELINQUENT"
        trigger: "POST /cle/reporting-sweeps (system event)"
        actor: system
        preconditions:
          - "sweep.as_of >= cycle.filing_deadline"
          - "cycle.credit_status IN {OPEN, DEFICIENT}"
          - "cycle.administrative_status == GOOD_STANDING"
        side_effects:
          - "delinquent_since = sweep.as_of"
          - "cascade: create FeeAssessment(fee_type = LATE_COMPLIANCE, attorney_id, cycle_id, assessed_by_sweep_id = sweep.id, amount_cents = calculations.late_fee_assessment, status = ASSESSED)"
          - "cascade: that assessment raises attorney.outstanding_fee_cents by amount_cents"
          - "sweep.delinquencies_issued += 1; sweep.late_fees_assessed_cents += amount_cents"
          - "increments ComplianceCycle.version by 1"
      - from: "administrative_status = DELINQUENT"
        to: "administrative_status = ADMIN_SUSPENDED"
        trigger: "POST /cle/reporting-sweeps (system event)"
        actor: system
        preconditions:
          - "cycle.administrative_status == DELINQUENT"
          - "sweep.as_of >= cycle.delinquent_since + DELINQUENCY_TO_SUSPENSION_DAYS"
          - "cycle.credit_status IN {OPEN, DEFICIENT}"
        side_effects:
          - "cascade: attorney.status ACTIVE -> ADMIN_SUSPENDED"
          - "cascade: that attorney transition denies every ReciprocityClaim of the attorney with status == SUBMITTED, setting determination_reason = 'ATTORNEY_ADMIN_SUSPENDED'"
          - "cascade: create FeeAssessment(fee_type = REINSTATEMENT, attorney_id, cycle_id, assessed_by_sweep_id = sweep.id, amount_cents = REINSTATEMENT_FEE_CENTS) and raise attorney.outstanding_fee_cents accordingly"
          - "sweep.suspensions_issued += 1; sweep.late_fees_assessed_cents += REINSTATEMENT_FEE_CENTS"
          - "increments ComplianceCycle.version by 1"
      - from: "administrative_status = ADMIN_SUSPENDED"
        to: "administrative_status = REINSTATED"
        trigger: "POST /cle/attorneys/{id}/reinstatement"
        actor: BoardAdmin
        preconditions:
          - "attorney.status == ADMIN_SUSPENDED"
          - "attorney.outstanding_fee_cents == 0"
          - "cure_basis == BOARD_ORDER, or the FINAL variant run (VERIFIED records only) yields zero total and zero specialty deficiency"
        side_effects:
          - "cascade: attorney.status ADMIN_SUSPENDED -> ACTIVE"
          - "delinquent_since = null"
          - "credit_status -> SATISFIED when cure_basis == FEES_AND_CREDITS_CURED; unchanged when cure_basis == BOARD_ORDER"
          - "increments ComplianceCycle.version by 1"
      - from: "administrative_status = DELINQUENT"
        to: "administrative_status = GOOD_STANDING"
        trigger: "POST /cle/compliance-cycles/{id}/certification"
        actor: Attorney
        preconditions:
          - "cycle.administrative_status == DELINQUENT (late filing is still a filing)"
          - "the FINAL run yields zero total and zero specialty deficiency"
        side_effects:
          - "delinquent_since = null (the delinquency is cured)"
          - "cascade: when clock_now <= delinquent_since + LATE_FEE_VOID_GRACE_DAYS, every FeeAssessment with cycle_id == this cycle, fee_type == LATE_COMPLIANCE and status == ASSESSED moves ASSESSED -> VOIDED, which itself lowers attorney.outstanding_fee_cents by that amount_cents; after the grace window the assessment stays ASSESSED"
          - "credit_status -> SATISFIED in the same request"
          - "increments ComplianceCycle.version by 1"

  - entity: CreditRecord
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /cle/credit-records (auto-transition at creation when verification_method == ATTENDANCE_CODE)"
        actor: Attorney
        preconditions:
          - "course.attendance_verification_method == ATTENDANCE_CODE"
          - "the supplied attendance_code equals course.attendance_code"
        side_effects:
          - "course.verified_credit_record_count += 1"
          - "re-run calculations.cycle_credit_application in the variant selected by the cycle (PROVISIONAL while credit_status == OPEN) and rewrite cycle.earned_* plus countable_minutes on every record of the cycle"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /cle/attendance-reports (roster cascade, one record per accepted entry)"
        actor: ProviderAdmin
        preconditions:
          - "the roster entry's bar_number resolves to an Attorney with a ComplianceCycle covering session_date"
        side_effects:
          - "attendance_report_id set; verification_method = ROSTER"
          - "course.verified_credit_record_count += 1"
          - "re-run calculations.cycle_credit_application for the owning cycle"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /cle/credit-records/{id}/adjudication (action = VERIFY)"
        actor: BoardAdmin
        preconditions:
          - "record.status == PENDING_VERIFICATION"
          - "course.status IN {APPROVED, EXPIRED} (an EXPIRED course may still be adjudicated for attendance completed before expiry)"
        side_effects:
          - "course.verified_credit_record_count += 1"
          - "re-run calculations.cycle_credit_application for the owning cycle"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /cle/compliance-cycles/{id}/affirmations (affirmation_type = ATTENDANCE_AFFIRMATION cascade)"
        actor: Attorney
        preconditions:
          - "record.verification_method == AFFIRMATION AND record.status == PENDING_VERIFICATION"
          - "the affirmation's cycle_id == record.cycle_id AND the acting X-User-ID == record.attorney_id"
        side_effects:
          - "record.affirmation_id = the new Affirmation.id"
          - "course.verified_credit_record_count += 1"
          - "re-run calculations.cycle_credit_application for the owning cycle"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /cle/credit-records/{id}/adjudication (action = REJECT)"
        actor: BoardAdmin
        preconditions:
          - "record.status == PENDING_VERIFICATION"
        side_effects:
          - "void_reason recorded"
          - "re-run calculations.cycle_credit_application (a rejected record leaves the PROVISIONAL input set, so cycle.earned_* can fall)"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "system event: the course entered SUSPENDED_PENDING_REVIEW because its sponsor was suspended or lapsed"
        actor: system
        preconditions: []
        side_effects:
          - "void_reason = 'SPONSOR_NOT_IN_GOOD_STANDING'"
          - "re-run calculations.cycle_credit_application for the owning cycle"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /cle/credit-records/{id}/adjudication (action = VOID)"
        actor: BoardAdmin
        preconditions:
          - "record.status == VERIFIED"
        side_effects:
          - "void_reason recorded; countable_minutes = 0"
          - "course.verified_credit_record_count -= 1"
          - "re-run calculations.cycle_credit_application for the owning cycle in the variant its credit_status selects; cycle.earned_* rewritten"
          - "cascade: if the cycle was SATISFIED and the re-run leaves a deficiency, credit_status SATISFIED -> OPEN"
          - "cascade: that cycle reversion rewrites carryover_out_* to 0, which rewrites the successor cycle's carryover_in_* and re-derives the successor's earned/deficiency figures"
      - from: VERIFIED
        to: VOIDED
        trigger: "system event: the course was REVOKED by a substantiated complaint"
        actor: system
        preconditions: []
        side_effects:
          - "void_reason = 'COURSE_REVOKED'; countable_minutes = 0"
          - "course.verified_credit_record_count -= 1"
          - "re-run calculations.cycle_credit_application for the owning cycle"
          - "cascade: if the cycle was SATISFIED and the re-run leaves a deficiency, credit_status SATISFIED -> OPEN and attorney.pending_recertification_count += 1"

  - entity: ProviderAudit
    initial_state: OPENED
    terminal_states: [CLEARED, SANCTIONED]
    note: "Branching fork-join: FINDINGS_ISSUED forks into CLEARED and SANCTIONED with disjoint side-effect sets (one only stamps last_audit_closed_at and unlocks PROBATIONARY -> ACCREDITED; the other assesses a sanction fee and drives the provider backwards)."
    transitions:
      - from: OPENED
        to: SAMPLED
        trigger: "POST /cle/provider-audits/{id}/audit-actions (action = DRAW_SAMPLE)"
        actor: BoardAdmin
        preconditions:
          - "the eligible-course pool of calculations.audit_sample_selection is non-empty"
          - "expected_audit_version == audit.version"
        side_effects:
          - "sample_size and sampled_course_ids written per calculations.audit_sample_selection; risk_score_at_open already frozen at creation"
          - "provider.courses_sampled_lifetime += sample_size"
          - "recompute provider.risk_score"
          - "increments ProviderAudit.version by 1"
      - from: SAMPLED
        to: SAMPLED
        trigger: "POST /cle/provider-audits/{id}/audit-actions (action = DRAW_SAMPLE)"
        actor: BoardAdmin
        preconditions:
          - "the eligible-course pool is non-empty"
          - "expected_audit_version == audit.version"
        side_effects:
          - "the new draw supersedes the prior sample: sampled_course_ids and sample_size are replaced"
          - "provider.courses_sampled_lifetime += (new sample_size - prior sample_size)"
          - "increments ProviderAudit.version by 1"
        note: "Re-drawing is legitimately repeatable, which is why concurrency_rules[sample-redraw-stale-audit] guards it with OCC."
      - from: SAMPLED
        to: FINDINGS_ISSUED
        trigger: "POST /cle/provider-audits/{id}/audit-actions (action = ISSUE_FINDINGS)"
        actor: BoardAdmin
        preconditions:
          - "audit.status == SAMPLED"
          - "0 <= findings_count <= audit.sample_size"
          - "expected_audit_version == audit.version"
        side_effects:
          - "findings_count recorded; provider.audit_findings_count += findings_count"
          - "recompute provider.risk_score"
          - "increments ProviderAudit.version by 1"
      - from: FINDINGS_ISSUED
        to: CLEARED
        trigger: "POST /cle/provider-audits/{id}/audit-actions (action = CLOSE_CLEARED)"
        actor: BoardAdmin
        preconditions:
          - "audit.findings_count <= AUDIT_CLEAR_MAX_FINDINGS"
          - "expected_audit_version == audit.version"
        side_effects:
          - "closed_at = clock_now; sanction_type = NONE"
          - "provider.last_audit_closed_at = closed_at; recompute provider.risk_score (staleness resets)"
          - "unlocks the PROBATIONARY -> ACCREDITED gate for this provider"
          - "increments ProviderAudit.version by 1"
      - from: FINDINGS_ISSUED
        to: SANCTIONED
        trigger: "POST /cle/provider-audits/{id}/audit-actions (action = CLOSE_SANCTIONED)"
        actor: BoardAdmin
        preconditions:
          - "audit.findings_count >= 1"
          - "sanction_type IN {PROBATION, SUSPENSION} supplied"
          - "expected_audit_version == audit.version"
        side_effects:
          - "closed_at = clock_now; sanction_type recorded"
          - "provider.last_audit_closed_at = closed_at"
          - "cascade: create FeeAssessment(fee_type = AUDIT_SANCTION, provider_id, amount_cents = AUDIT_SANCTION_FEE_CENTS, status = ASSESSED)"
          - "cascade: with sanction_type == PROBATION the provider moves ACCREDITED -> PROBATIONARY; with SUSPENSION the provider moves ACCREDITED|PROBATIONARY -> SUSPENDED, which itself suspends the provider's self-certified courses, which itself rejects those courses' PENDING_VERIFICATION credit records"
          - "increments ProviderAudit.version by 1"

  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /cle/complaints/{id}/disposition (action = OPEN_REVIEW)"
        actor: BoardAdmin
        preconditions:
          - "complaint.status == RECEIVED"
        side_effects: []
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /cle/complaints/{id}/disposition (action = SUBSTANTIATE)"
        actor: BoardAdmin
        preconditions:
          - "complaint.status == UNDER_REVIEW"
          - "disposition_reason supplied"
          - "acting X-User-ID != complaint.complainant_user_id (segregation of duties)"
        side_effects:
          - "with subject_type == PROVIDER: provider.substantiated_complaint_count += 1, provider.risk_score recomputed, and the provider moves ACCREDITED -> PROBATIONARY"
          - "with subject_type == COURSE: the course moves APPROVED|SUSPENDED_PENDING_REVIEW|EXPIRED -> REVOKED, which itself voids that course's VERIFIED credit records, which itself re-runs each owning cycle's credit application, which itself can revert a SATISFIED cycle to OPEN and rewrite the successor cycle's carryover_in_*"
          - "with subject_type == COURSE: the course's provider (when non-null) also has substantiated_complaint_count += 1 and risk_score recomputed"
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /cle/complaints/{id}/disposition (action = DISMISS)"
        actor: BoardAdmin
        preconditions:
          - "complaint.status == RECEIVED"
          - "disposition_reason supplied"
          - "acting X-User-ID != complaint.complainant_user_id (segregation of duties)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /cle/complaints/{id}/disposition (action = DISMISS)"
        actor: BoardAdmin
        preconditions:
          - "complaint.status == UNDER_REVIEW"
          - "disposition_reason supplied"
          - "acting X-User-ID != complaint.complainant_user_id (segregation of duties)"
        side_effects: []

  - entity: ReciprocityClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cle/reciprocity-claims/{id}/determination (action = APPROVE)"
        actor: BoardAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "attorney.status IN {ACTIVE, EXEMPT}"
          - "for basis == RECIPROCITY: claim.origin_jurisdiction IN RECIPROCITY_JURISDICTIONS"
          - "for basis == COMITY: claim.origin_jurisdiction IN COMITY_JURISDICTIONS AND attorney.principal_office_jurisdiction == claim.origin_jurisdiction AND attorney.principal_office_jurisdiction != HOME_JURISDICTION"
          - "the ComplianceCycle of the attorney whose half-open period contains completion_date exists and has credit_status == OPEN"
        side_effects:
          - "converted_minutes and converted_category written per calculations.reciprocity_credit_conversion"
          - "cascade: for basis == RECIPROCITY, create a CreditRecord with status VERIFIED, source RECIPROCITY, reciprocity_claim_id = claim.id, verification_method = CERTIFICATE, credited_* minutes equal to converted_minutes in converted_category, then re-run calculations.cycle_credit_application for the owning cycle (the RECIPROCITY_CAP_MINUTES bucket applies)"
          - "cascade: for basis == COMITY, the owning cycle moves credit_status OPEN -> CLOSED_COMITY when its specialty totals are met, otherwise OPEN -> DEFICIENT; no CreditRecord is created"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /cle/reciprocity-claims/{id}/determination (action = DENY)"
        actor: BoardAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "determination_reason supplied"
        side_effects:
          - "determination_reason recorded"
      - from: SUBMITTED
        to: DENIED
        trigger: "system event: the claiming attorney entered ADMIN_SUSPENDED during a reporting sweep"
        actor: system
        preconditions: []
        side_effects:
          - "determination_reason = 'ATTORNEY_ADMIN_SUSPENDED'"

  - entity: FeeAssessment
    initial_state: ASSESSED
    terminal_states: [PAID, WAIVED, VOIDED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /cle/fee-assessments/{id}/settlement (action = PAY)"
        actor: Attorney | BoardAdmin
        preconditions:
          - "assessment.status == ASSESSED"
          - "when the actor is Attorney: acting X-User-ID == assessment.attorney_id"
        side_effects:
          - "settled_at = clock_now"
          - "when attorney_id is non-null: attorney.outstanding_fee_cents -= amount_cents"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /cle/fee-assessments/{id}/settlement (action = WAIVE)"
        actor: BoardAdmin
        preconditions:
          - "assessment.status == ASSESSED"
          - "waiver_reason supplied"
        side_effects:
          - "settled_at = clock_now; waiver_reason recorded"
          - "when attorney_id is non-null: attorney.outstanding_fee_cents -= amount_cents"
      - from: ASSESSED
        to: VOIDED
        trigger: "system event: a certification cured the cycle's delinquency within LATE_FEE_VOID_GRACE_DAYS of delinquent_since"
        actor: system
        preconditions:
          - "assessment.fee_type == LATE_COMPLIANCE AND assessment.status == ASSESSED"
          - "clock_now <= cycle.delinquent_since + LATE_FEE_VOID_GRACE_DAYS"
        side_effects:
          - "settled_at = clock_now"
          - "attorney.outstanding_fee_cents -= amount_cents"
        note: "The only producer of VOIDED. A cure after the grace window leaves the assessment ASSESSED."

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
#         mechanism; each entry passes the serial-observability filter because the
#         guarded write is legitimately repeatable and supersedes its predecessor)
# =============================================================================
concurrency_rules:
  - rule_id: renew-supersede-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /cle/providers/{id}/accreditation-actions"
    occ_field: "expected_provider_version"
    description: |
      An accreditation action carrying a provider version older than the stored one is
      rejected. RENEW is legitimately repeatable — each renewal supersedes the prior term and
      assesses a fresh PROVIDER_ANNUAL fee — so a second sequential RENEW would itself succeed
      under the product semantics; the OCC guard is what stops a board clerk acting on a
      provider whose term, standing, or self-certification flag has already moved (for example
      an audit sanction that pushed the provider to PROBATIONARY) from silently extending a
      term that no longer exists as observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reciprocity-refile-stale-attorney
    parent_entity: Attorney
    write_endpoint: "POST /cle/reciprocity-claims"
    occ_field: "expected_attorney_version"
    description: |
      Filing a reciprocity or comity claim against an attorney whose version has advanced since
      the client last read it is rejected. Re-filing a claim for the same origin course is
      legitimate and supersedes the earlier filing, so a second sequential create would succeed
      on its own terms; the OCC guard catches the case where the attorney record has meanwhile
      absorbed an approved claim, a fee assessment, or an administrative suspension, all of
      which change whether and how the new claim converts.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sample-redraw-stale-audit
    parent_entity: ProviderAudit
    write_endpoint: "POST /cle/provider-audits/{id}/audit-actions"
    occ_field: "expected_audit_version"
    description: |
      An audit action carrying a stale audit version is rejected. DRAW_SAMPLE is legitimately
      repeatable (SAMPLED -> SAMPLED replaces the prior draw), so a second sequential draw would
      succeed under the product semantics; the OCC guard prevents a redraw or a findings filing
      computed against a sample the audit no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Shared domain constants referenced by §1.2, §1.3 and §1.4
# =============================================================================
domain_constants:
  CREDIT_HOUR_MINUTES: 60
  ROUNDING_INCREMENT_MINUTES: 15
  CYCLE_MONTHS: 24
  TOTAL_REQUIRED_MINUTES: 1800
  ETHICS_REQUIRED_MINUTES: 180
  TECHNOLOGY_REQUIRED_MINUTES: 60
  BIAS_REQUIRED_MINUTES: 120
  PRORATION_SPECIALTY_THRESHOLD_MONTHS: 12
  PRORATED_ETHICS_REQUIRED_MINUTES: 90
  PRORATED_TECHNOLOGY_REQUIRED_MINUTES: 60
  PRORATED_BIAS_REQUIRED_MINUTES: 60
  SELF_STUDY_CAP_MINUTES: 360
  ON_DEMAND_CAP_MINUTES: 720
  NONLIVE_CAP_MINUTES: 900
  RECIPROCITY_CAP_MINUTES: 900
  CARRYOVER_CAP_GENERAL_MINUTES: 600
  CARRYOVER_CAP_ETHICS_MINUTES: 120
  MIN_CREDITABLE_MINUTES: 30
  DEADLINE_OFFSET_DAYS: { GROUP_1: 31, GROUP_2: 61, GROUP_3: 91 }
  DELINQUENCY_TO_SUSPENSION_DAYS: 60
  LATE_FEE_VOID_GRACE_DAYS: 7
  ROSTER_DUE_DAYS: 30
  ROSTER_HARD_WINDOW_DAYS: 90
  APPROVAL_VALID_MONTHS: 36
  ACCREDITATION_TERM_MONTHS: 24
  APPEAL_WINDOW_DAYS: 30
  MAX_INFO_REQUEST_ROUNDS: 2
  MAX_REMANDS: 1
  AUDIT_CLEAR_MAX_FINDINGS: 1
  # Aggregate capacity: how many LIVE_IN_PERSON courses one provider may have whose
  # [presented_at, expires_at] session windows overlap a given instant.
  PROVIDER_CONCURRENT_LIVE_CAPACITY: 2
  LATE_FEE_BASE_TIERS_CENTS: { "0": 15000, "1_5": 25000, "6_15": 40000, "16_plus": 60000 }
  LATE_FEE_PER_HOUR_CENTS: 2500
  LATE_FEE_SURCHARGE_HOUR_CAP: 20
  LATE_FEE_CAP_CENTS: 100000
  REINSTATEMENT_FEE_CENTS: 50000
  AUDIT_SANCTION_FEE_CENTS: 250000
  DEFAULT_PROVIDER_ANNUAL_FEE_CENTS: 120000
  RISK_WEIGHT_DELINQUENCY: 0.35
  RISK_WEIGHT_COMPLAINT: 0.30
  RISK_WEIGHT_FINDING: 0.25
  RISK_WEIGHT_STALENESS: 0.10
  COMPLAINT_NORMALIZER: 3
  STALENESS_NORMALIZER_MONTHS: 24
  RISK_SAMPLE_TIER_HIGH: 0.60
  RISK_SAMPLE_TIER_MID: 0.30
  RISK_SAMPLE_N_HIGH: 10
  RISK_SAMPLE_N_MID: 5
  RISK_SAMPLE_N_LOW: 2
  HOME_JURISDICTION: "ST"
  RECIPROCITY_JURISDICTIONS: ["NY", "CA", "TX", "IL", "FL"]
  COMITY_JURISDICTIONS: ["NY", "IL"]
  ORIGIN_HOUR_MINUTES: { NY: 50, CA: 60, TX: 60, IL: 60, FL: 50 }
  ORIGIN_CATEGORY_MAP:
    GENERAL: GENERAL
    PROFESSIONALISM: ETHICS
    ETHICS: ETHICS
    TECHNOLOGY: TECHNOLOGY
    DIVERSITY_INCLUSION: BIAS_ELIMINATION
  CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00Z"

# =============================================================================
# §1.3 Calculation Rules Table  (9 rules; two dual-variant rules on different
#      entity domains, three combinatorial modes, all order-sensitive logic pinned)
# =============================================================================
calculations:

  - name: cycle_requirement_derivation
    trigger: "POST /cle/attorneys/{id}/compliance-cycles — runs once when the cycle is created and is never re-derived afterwards"
    algorithm: threshold
    formula: |
      # -- exemption branch ---------------------------------------------------
      if attorney.status == EXEMPT:
          required_total_minutes = 0
          required_ethics_minutes = 0
          required_technology_minutes = 0
          required_bias_minutes = 0
          prorated = false
          return

      # -- proration branch ---------------------------------------------------
      prorated = (attorney.admission_date >= cycle.period_start
                  AND attorney.admission_date < cycle.period_end)

      if not prorated:
          months_remaining = CYCLE_MONTHS
      else:
          anchor = first_day_of_the_month_after(attorney.admission_date)   # UTC midnight
          months_remaining = whole_calendar_months_between(anchor, cycle.period_end)
          months_remaining = clamp(months_remaining, 0, CYCLE_MONTHS)

      required_total_minutes = ceil(
          TOTAL_REQUIRED_MINUTES * months_remaining / CYCLE_MONTHS / CREDIT_HOUR_MINUTES
      ) * CREDIT_HOUR_MINUTES          # rounded UP to a whole credit hour

      if (not prorated) or months_remaining >= PRORATION_SPECIALTY_THRESHOLD_MONTHS:
          required_ethics_minutes     = ETHICS_REQUIRED_MINUTES
          required_technology_minutes = TECHNOLOGY_REQUIRED_MINUTES
          required_bias_minutes       = BIAS_REQUIRED_MINUTES
      else:
          required_ethics_minutes     = PRORATED_ETHICS_REQUIRED_MINUTES
          required_technology_minutes = PRORATED_TECHNOLOGY_REQUIRED_MINUTES
          required_bias_minutes       = PRORATED_BIAS_REQUIRED_MINUTES

      filing_deadline = cycle.period_end + DEADLINE_OFFSET_DAYS[attorney.compliance_group] days
    input_set: "The single Attorney named by attorney_id, read at cycle-creation time; no CreditRecord participates."
    constants:
      TOTAL_REQUIRED_MINUTES: 1800
      ETHICS_REQUIRED_MINUTES: 180
      TECHNOLOGY_REQUIRED_MINUTES: 60
      BIAS_REQUIRED_MINUTES: 120
      CYCLE_MONTHS: 24
      CREDIT_HOUR_MINUTES: 60
      PRORATION_SPECIALTY_THRESHOLD_MONTHS: 12
      PRORATED_ETHICS_REQUIRED_MINUTES: 90
      PRORATED_TECHNOLOGY_REQUIRED_MINUTES: 60
      PRORATED_BIAS_REQUIRED_MINUTES: 60
      DEADLINE_OFFSET_DAYS: { GROUP_1: 31, GROUP_2: 61, GROUP_3: 91 }
    precision: "Integer minutes; the total is rounded UP to a multiple of 60. Specialty minimums are never prorated proportionally — they either apply in full or drop to their PRORATED_* value."

  - name: credit_record_category_proration
    trigger: "POST /cle/credit-records, and the roster cascade inside POST /cle/attendance-reports, and the reciprocity cascade inside POST /cle/reciprocity-claims/{id}/determination — writes CreditRecord.credited_general_minutes, credited_ethics_minutes, credited_technology_minutes, credited_bias_minutes and credited_minutes"
    algorithm: waterfall_allocation
    formula: |
      course_total = course.total_minutes
      attended     = min(record.attended_minutes, course_total)

      # PINNED ROUNDING ORDER: round each category down to a 15-minute increment,
      # THEN sum. The alternative order (sum the raw prorated minutes first, then
      # round once) is explicitly NOT the rule and yields a different total.
      for category in [ETHICS, TECHNOLOGY, BIAS_ELIMINATION, GENERAL]:      # pinned iteration order
          alloc_minutes = CreditAllocation(course_id = course.id, category = category).minutes  # 0 when absent
          raw           = alloc_minutes * attended / course_total           # exact rational, never rounded here
          credited[category] = floor(raw / ROUNDING_INCREMENT_MINUTES) * ROUNDING_INCREMENT_MINUTES

      credited_general_minutes    = credited[GENERAL]
      credited_ethics_minutes     = credited[ETHICS]
      credited_technology_minutes = credited[TECHNOLOGY]
      credited_bias_minutes       = credited[BIAS_ELIMINATION]
      credited_minutes            = credited[ETHICS] + credited[TECHNOLOGY]
                                  + credited[BIAS_ELIMINATION] + credited[GENERAL]

      # boundary gate, evaluated after the sum
      if credited_minutes < MIN_CREDITABLE_MINUTES:
          reject the request with ERR_BELOW_MINIMUM_CREDIT
    input_set: "The one Course named by course_id and all of its CreditAllocation rows; no other record participates."
    constants:
      ROUNDING_INCREMENT_MINUTES: 15
      MIN_CREDITABLE_MINUTES: 30
    precision: "Integer minutes, floor to 15-minute increments, applied per category BEFORE summation (round-then-sum, never sum-then-round)."

  - name: cycle_credit_application
    trigger: "Every mutation that changes a cycle's credit picture: creation, verification, rejection or voiding of a CreditRecord; an approved reciprocity determination; certification; reinstatement cure evaluation; and every GET /cle/compliance-cycles/{id}/summary read. Writes ComplianceCycle.earned_countable_minutes, earned_ethics_minutes, earned_technology_minutes, earned_bias_minutes, earned_live_minutes and CreditRecord.countable_minutes."
    algorithm: chronological
    formula: |
      # ---- input set by variant (see `variants:` below) ----------------------
      records = CreditRecord rows with cycle_id == cycle.id and status IN variant.status_filter
      sort records ascending by (completion_date ASC, created_at ASC)      # never by id

      self_study_used = on_demand_used = nonlive_used = reciprocity_used = 0
      counted = { GENERAL: 0, ETHICS: 0, TECHNOLOGY: 0, BIAS_ELIMINATION: 0 }
      total_countable = 0
      live_countable  = 0

      for r in records:                       # chronological accumulation
          room = r.credited_minutes
          if r.effective_format == SELF_STUDY:
              room = min(room,
                         SELF_STUDY_CAP_MINUTES - self_study_used,
                         NONLIVE_CAP_MINUTES    - nonlive_used)
          elif r.effective_format == ON_DEMAND:
              room = min(room,
                         ON_DEMAND_CAP_MINUTES - on_demand_used,
                         NONLIVE_CAP_MINUTES   - nonlive_used)
          if r.source == RECIPROCITY:
              room = min(room, RECIPROCITY_CAP_MINUTES - reciprocity_used)
          countable = max(0, room)

          # ---- truncation waterfall, PINNED bucket order -------------------
          # a cap shortfall is removed from GENERAL first and from ETHICS last,
          # so specialty minutes survive truncation.
          surplus = r.credited_minutes - countable
          for category in [GENERAL, BIAS_ELIMINATION, TECHNOLOGY, ETHICS]:
              take = min(surplus, r.credited_<category>_minutes)
              counted[category] += r.credited_<category>_minutes - take
              surplus -= take

          r.countable_minutes = countable
      # every CreditRecord of the cycle that is NOT in this variant's input set has
      # countable_minutes rewritten to 0, so the persisted per-record figures always
      # reconcile to earned_countable_minutes for the variant that last ran.
          total_countable += countable
          if r.effective_format == SELF_STUDY:  self_study_used += countable; nonlive_used += countable
          if r.effective_format == ON_DEMAND:   on_demand_used  += countable; nonlive_used += countable
          if r.effective_format == LIVE:        live_countable  += countable
          if r.source == RECIPROCITY:           reciprocity_used += countable

      earned_countable_minutes = total_countable
      earned_ethics_minutes    = counted[ETHICS]
      earned_technology_minutes= counted[TECHNOLOGY]
      earned_bias_minutes      = counted[BIAS_ELIMINATION]
      earned_live_minutes      = live_countable

      # ---- deficiency, with carryover applied on top -------------------------
      effective_total  = earned_countable_minutes
                       + cycle.carryover_in_general_minutes
                       + cycle.carryover_in_ethics_minutes
      effective_ethics = earned_ethics_minutes + cycle.carryover_in_ethics_minutes

      deficiency_total_minutes      = max(0, cycle.required_total_minutes      - effective_total)
      deficiency_ethics_minutes     = max(0, cycle.required_ethics_minutes     - effective_ethics)
      deficiency_technology_minutes = max(0, cycle.required_technology_minutes - earned_technology_minutes)
      deficiency_bias_minutes       = max(0, cycle.required_bias_minutes       - earned_bias_minutes)
    input_set: |
      PROVISIONAL: CreditRecord rows of the cycle with status IN {PENDING_VERIFICATION, VERIFIED}.
      FINAL:       CreditRecord rows of the cycle with status == VERIFIED only.
      REJECTED and VOIDED records never participate in either variant. Carryover-in minutes are
      added only in the deficiency step, never into earned_countable_minutes.
    constants:
      SELF_STUDY_CAP_MINUTES: 360
      ON_DEMAND_CAP_MINUTES: 720
      NONLIVE_CAP_MINUTES: 900
      RECIPROCITY_CAP_MINUTES: 900
    precision: "Integer minutes throughout; no rounding occurs in this rule (the 15-minute rounding already happened in credit_record_category_proration)."
    variants:
      - name: PROVISIONAL
        when: "cycle.credit_status == OPEN — this is the variant persisted into ComplianceCycle.earned_* and CreditRecord.countable_minutes on every mutation, and returned as the provisional_* fields of GET /cle/compliance-cycles/{id}/summary."
        difference: "Includes PENDING_VERIFICATION records. Because caps are consumed in chronological order, an early pending record can consume the SELF_STUDY / ON_DEMAND allowance that a later verified record would otherwise have taken, so both the per-record countable_minutes and the per-category totals differ from FINAL for identical stored data."
      - name: FINAL
        when: "POST /cle/compliance-cycles/{id}/certification, POST /cle/attorneys/{id}/reinstatement cure evaluation, the sweep's late-fee derivation, and every re-run triggered on a cycle whose credit_status != OPEN. Also exposed as the projected_final_* fields of the summary read."
        difference: "Drops PENDING_VERIFICATION records from the input set entirely, which frees cap room for later verified records and can move specialty minutes from non-zero to zero (or the reverse) relative to PROVISIONAL."

  - name: carryover_determination
    trigger: "Runs at the end of every FINAL run of cycle_credit_application that is persisted by POST /cle/compliance-cycles/{id}/certification, and on every FINAL re-run caused by a void; writes ComplianceCycle.carryover_out_general_minutes and carryover_out_ethics_minutes"
    algorithm: threshold
    formula: |
      if cycle.carryover_election == WAIVE_CARRYOVER
         or deficiency_total_minutes > 0
         or deficiency_ethics_minutes > 0
         or deficiency_technology_minutes > 0
         or deficiency_bias_minutes > 0:
          carryover_out_general_minutes = 0
          carryover_out_ethics_minutes  = 0
      else:
          general_excess = (earned_countable_minutes
                            + cycle.carryover_in_general_minutes
                            + cycle.carryover_in_ethics_minutes) - cycle.required_total_minutes
          # only LIVE minutes may travel forward: self-study and on-demand excess is forfeited
          carryover_out_general_minutes = min(CARRYOVER_CAP_GENERAL_MINUTES,
                                              max(0, general_excess),
                                              earned_live_minutes)
          ethics_excess = earned_ethics_minutes - cycle.required_ethics_minutes
          carryover_out_ethics_minutes  = min(CARRYOVER_CAP_ETHICS_MINUTES, max(0, ethics_excess))

      # conserved transfer: the successor cycle's carryover_in_* is rewritten to these two
      # values in the same request, so successor.carryover_in_x == predecessor.carryover_out_x
      # holds after every mutation.
    input_set: "The output of the FINAL run of cycle_credit_application for this cycle plus the cycle's own required_* and carryover_in_* fields. Carried-in ethics minutes are never re-carried out."
    constants:
      CARRYOVER_CAP_GENERAL_MINUTES: 600
      CARRYOVER_CAP_ETHICS_MINUTES: 120
    precision: "Integer minutes; every term is floored at 0 before the caps are applied."

  - name: late_fee_assessment
    trigger: "POST /cle/reporting-sweeps when a cycle passes its filing_deadline without certification (writes FeeAssessment.amount_cents with fee_type = LATE_COMPLIANCE), and the projected_late_fee_cents field of GET /cle/compliance-cycles/{id}/summary"
    algorithm: tiered_pricing
    formula: |
      # SEVEN PINNED STEPS. Step 1 must precede step 2, and step 4's ceiling must be
      # taken before step 5 selects a tier; performing step 6 on un-capped hours or
      # applying the step-7 cap before the surcharge produces a different amount.
      # step 1 — carryover suppression: a predecessor cycle that is still OPEN has not
      #          certified its carryover, so no carried-in general minutes may be relied on.
      if cycle.previous_cycle_id is not null
         and ComplianceCycle(cycle.previous_cycle_id).credit_status == OPEN:
          carryover_in_general_effective = 0
      else:
          carryover_in_general_effective = cycle.carryover_in_general_minutes

      # step 2 — run cycle_credit_application in the FINAL variant using
      #          carryover_in_general_effective in place of carryover_in_general_minutes
      # step 3 — total the shortfall across every requirement
      deficiency_minutes = deficiency_total_minutes + deficiency_ethics_minutes
                         + deficiency_technology_minutes + deficiency_bias_minutes

      # step 4 — convert to whole hours, rounding UP
      deficiency_hours = ceil(deficiency_minutes / CREDIT_HOUR_MINUTES)

      # step 5 — base tier on the rounded hour count
      if deficiency_hours == 0:                      base = LATE_FEE_BASE_TIERS_CENTS["0"]
      elif 1 <= deficiency_hours <= 5:               base = LATE_FEE_BASE_TIERS_CENTS["1_5"]
      elif 6 <= deficiency_hours <= 15:              base = LATE_FEE_BASE_TIERS_CENTS["6_15"]
      else:                                          base = LATE_FEE_BASE_TIERS_CENTS["16_plus"]

      # step 6 — per-hour surcharge on capped hours
      surcharge = LATE_FEE_PER_HOUR_CENTS * min(deficiency_hours, LATE_FEE_SURCHARGE_HOUR_CAP)

      # step 7 — overall cap applied last
      amount_cents = min(LATE_FEE_CAP_CENTS, base + surcharge)
    input_set: "The delinquent ComplianceCycle, its predecessor cycle (for step 1 only), and the cycle's VERIFIED CreditRecord rows. PENDING_VERIFICATION records never reduce a late fee."
    constants:
      CREDIT_HOUR_MINUTES: 60
      LATE_FEE_BASE_TIERS_CENTS: { "0": 15000, "1_5": 25000, "6_15": 40000, "16_plus": 60000 }
      LATE_FEE_PER_HOUR_CENTS: 2500
      LATE_FEE_SURCHARGE_HOUR_CAP: 20
      LATE_FEE_CAP_CENTS: 100000
    precision: "Integer cents; the only rounding is the ceiling on deficiency_hours at step 4."

  - name: provider_risk_score
    trigger: "POST /cle/provider-audits (stamped onto ProviderAudit.risk_score_at_open), every action of POST /cle/providers/{id}/accreditation-actions, the SUBSTANTIATE disposition of a complaint, the CLOSE_CLEARED / CLOSE_SANCTIONED audit actions, and every POST /cle/reporting-sweeps run (each refreshes Provider.risk_score and Provider.risk_score_variant)"
    algorithm: weighted_scoring
    formula: |
      delinquency_rate = provider.attendance_reports_late_count
                       / max(1, provider.attendance_reports_total_count)
      complaint_rate   = min(1.0, provider.substantiated_complaint_count / COMPLAINT_NORMALIZER)
      finding_rate     = min(1.0, provider.audit_findings_count / variant.finding_denominator)
      anchor           = provider.last_audit_closed_at
                         if provider.last_audit_closed_at is not null
                         else provider.accreditation_term_start
      staleness        = 1.0 if anchor is null else
                         min(1.0, months_between(anchor, clock_now) / STALENESS_NORMALIZER_MONTHS)

      risk_score = round_half_up(
            RISK_WEIGHT_DELINQUENCY * delinquency_rate
          + RISK_WEIGHT_COMPLAINT   * complaint_rate
          + RISK_WEIGHT_FINDING     * finding_rate
          + RISK_WEIGHT_STALENESS   * staleness, 2)
      # each rate is clamped into [0.0, 1.0] BEFORE weighting, so risk_score is in [0.00, 1.00]
    input_set: "The single Provider row's denormalized counters (attendance_reports_late_count, attendance_reports_total_count, substantiated_complaint_count, audit_findings_count, courses_total_count, courses_self_certified_count, last_audit_closed_at, accreditation_term_start) plus the logical clock. No Course, Complaint or ProviderAudit row is scanned at score time — the counters are maintained by the cascades in §1.2."
    constants:
      RISK_WEIGHT_DELINQUENCY: 0.35
      RISK_WEIGHT_COMPLAINT: 0.30
      RISK_WEIGHT_FINDING: 0.25
      RISK_WEIGHT_STALENESS: 0.10
      COMPLAINT_NORMALIZER: 3
      STALENESS_NORMALIZER_MONTHS: 24
    precision: "Two decimal places, ROUND_HALF_UP, applied once to the weighted sum (never to the individual terms)."
    variants:
      - name: REVIEWED_WEIGHTING
        when: "provider.accreditation_status != ACCREDITED (that is, APPLIED, PROBATIONARY, SUSPENDED, LAPSED or DENIED) — every course this provider offers passed board review, so findings are measured against the whole catalogue."
        difference: "finding_denominator = max(1, provider.courses_total_count); risk_score_variant is written as REVIEWED_WEIGHTING."
      - name: SELF_CERTIFIED_WEIGHTING
        when: "provider.accreditation_status == ACCREDITED — an accredited provider self-certifies courses, so findings are measured only against the self-certified subset, producing a larger rate and a strictly higher score for identical counters."
        difference: "finding_denominator = max(1, provider.courses_self_certified_count); risk_score_variant is written as SELF_CERTIFIED_WEIGHTING."

  - name: audit_sample_selection
    trigger: "The DRAW_SAMPLE action of POST /cle/provider-audits/{id}/audit-actions, on both the OPENED -> SAMPLED and the repeatable SAMPLED -> SAMPLED transition — writes ProviderAudit.sampled_course_ids and sample_size"
    algorithm: chronological
    formula: |
      # -- eligibility filter --------------------------------------------------
      pool = Course rows where course.provider_id == audit.provider_id
             and course.status IN {APPROVED, EXPIRED, SUSPENDED_PENDING_REVIEW}
             and audit.audit_period_start <= course.presented_at <= audit.audit_period_end  # CLOSED interval
      # REVOKED and PENDING_APPROVAL and DENIED courses are never sampled.

      # -- ranking (deterministic, never by id, never random) ------------------
      sort pool ascending by (presented_at ASC, created_at ASC)

      # -- target size by risk tier ------------------------------------------
      if audit.risk_score_at_open >= RISK_SAMPLE_TIER_HIGH:  target_n = RISK_SAMPLE_N_HIGH
      elif audit.risk_score_at_open >= RISK_SAMPLE_TIER_MID: target_n = RISK_SAMPLE_N_MID
      else:                                                 target_n = RISK_SAMPLE_N_LOW

      # -- empty-pool fallback ------------------------------------------------
      if len(pool) == 0:
          reject the request with ERR_NO_SAMPLE_POPULATION and write nothing
          (sampled_course_ids stays [], sample_size stays 0, status stays OPENED)

      sample_size        = min(target_n, len(pool))
      sampled_course_ids = [c.id for c in the first sample_size entries of the sorted pool]
      # a REDRAW after a period amendment recomputes the whole list from scratch;
      # it is not an append.
    input_set: "Course rows of the audited provider whose presented_at falls inside the audit's closed period and whose status is one of the three sampleable states."
    constants:
      RISK_SAMPLE_TIER_HIGH: 0.60
      RISK_SAMPLE_TIER_MID: 0.30
      RISK_SAMPLE_N_HIGH: 10
      RISK_SAMPLE_N_MID: 5
      RISK_SAMPLE_N_LOW: 2
    precision: "Integer count; sample_size is exactly min(target_n, pool size) — a pool smaller than target_n yields a short sample, never an error."

  - name: reciprocity_credit_conversion
    trigger: "POST /cle/reciprocity-claims/{id}/determination with action = APPROVE — writes ReciprocityClaim.converted_minutes and converted_category and, for the RECIPROCITY pathway only, cascades a CreditRecord"
    algorithm: threshold
    formula: |
      if claim.basis == COMITY:
          # comity extinguishes the whole requirement instead of granting minutes
          require claim.origin_jurisdiction IN COMITY_JURISDICTIONS            else ERR_COMITY_NOT_AVAILABLE
          require attorney.principal_office_jurisdiction == claim.origin_jurisdiction
                                                                              else ERR_COMITY_NOT_AVAILABLE
          require attorney.principal_office_jurisdiction != HOME_JURISDICTION  else ERR_COMITY_NOT_AVAILABLE
          converted_minutes  = 0
          converted_category = GENERAL            # the enum default; unused on the comity pathway
          # side effect: the owning cycle (the one whose half-open period contains completion_date)
          #   takes cycle.comity_claim_id = claim.id and moves credit_status
          #   OPEN -> CLOSED_COMITY when earned_ethics_minutes >= required_ethics_minutes and
          #   earned_technology_minutes >= required_technology_minutes and
          #   earned_bias_minutes >= required_bias_minutes, otherwise OPEN -> DEFICIENT.
          #   No CreditRecord is created on this pathway.
      else:                                    # claim.basis == RECIPROCITY
          require claim.origin_jurisdiction IN RECIPROCITY_JURISDICTIONS       else ERR_JURISDICTION_NOT_RECIPROCAL
          origin_minutes     = claim.origin_credit_hours * ORIGIN_HOUR_MINUTES[claim.origin_jurisdiction]
          converted_minutes  = floor(origin_minutes / ROUNDING_INCREMENT_MINUTES) * ROUNDING_INCREMENT_MINUTES
          converted_category = ORIGIN_CATEGORY_MAP[claim.origin_category]
          # worked example: origin_jurisdiction = NY, origin_credit_hours = 2.0
          #   origin_minutes    = 2.0 * 50 = 100
          #   converted_minutes = floor(100 / 15) * 15 = 6 * 15 = 90
          # side effect: a CreditRecord with source = RECIPROCITY, effective_format = LIVE,
          #   status = VERIFIED, credited_<converted_category>_minutes = converted_minutes
          #   and credited_minutes = converted_minutes, subject to RECIPROCITY_CAP_MINUTES
          #   inside cycle_credit_application.
    input_set: "The single ReciprocityClaim plus the Attorney it names; the ORIGIN_HOUR_MINUTES and ORIGIN_CATEGORY_MAP constant tables supply the jurisdiction arithmetic."
    constants:
      ROUNDING_INCREMENT_MINUTES: 15
      HOME_JURISDICTION: "ST"
      RECIPROCITY_JURISDICTIONS: [NY, CA, TX, IL, FL]
      COMITY_JURISDICTIONS: [NY, IL]
      ORIGIN_HOUR_MINUTES: { NY: 50, CA: 60, TX: 60, IL: 60, FL: 50 }
      ORIGIN_CATEGORY_MAP: { GENERAL: GENERAL, PROFESSIONALISM: ETHICS, ETHICS: ETHICS, TECHNOLOGY: TECHNOLOGY, DIVERSITY_INCLUSION: BIAS_ELIMINATION }
    precision: "origin_credit_hours carries one decimal place; origin_minutes is an exact product; converted_minutes is floored to a 15-minute increment."

  - name: attendance_report_lateness
    trigger: "POST /cle/attendance-reports — writes AttendanceReport.due_at, days_late, status, accepted_entry_count and rejected_entry_count"
    algorithm: threshold
    formula: |
      # session_date is an input field of the AttendanceReport itself, not of the Course
      due_at        = report.session_date + ROSTER_DUE_DAYS days
      hard_close_at = report.session_date + ROSTER_HARD_WINDOW_DAYS days
      session_end   = report.session_date + course.total_minutes

      if clock_now > hard_close_at:
          reject the request with ERR_ROSTER_WINDOW_CLOSED — no AttendanceReport row is written
      if clock_now <= due_at:
          days_late = 0
          status    = ACCEPTED
      else:
          days_late = ceil((clock_now - due_at) / 1 day)     # partial days count as a whole day
          status    = ACCEPTED_LATE
          # side effect: provider.attendance_reports_late_count += 1, which feeds provider_risk_score

      # per-entry outcome: an entry is rejected (never fatal to the request) when its
      # bar_number matches no Attorney, when the attorney has no ComplianceCycle whose
      # half-open [period_start, period_end) window covers report.session_date, or when a
      # CreditRecord already exists for that (attorney_id, course_id) pair.
      # every accepted submission also does provider.attendance_reports_total_count += 1
      entry_count          = len(entries)
      accepted_entry_count = number of entries that produced a CreditRecord
      rejected_entry_count = len(entries) - accepted_entry_count
      if len(entries) == 0:
          reject the request with ERR_EMPTY_ROSTER
    input_set: "The one Course named by course_id, the session_date and roster entries in the request body, and for each entry the matching Attorney, that attorney's covering ComplianceCycle, and any pre-existing CreditRecord for the (attorney_id, course_id) pair."
    constants:
      ROSTER_DUE_DAYS: 30
      ROSTER_HARD_WINDOW_DAYS: 90
    precision: "Integer days, ceiling; day arithmetic is UTC calendar-day arithmetic against the logical clock."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins when a
#      single request violates several rules)
# =============================================================================
validations:

  # ---- 1. authentication --------------------------------------------------
  - priority: 10
    category: auth
    check: "X-User-Role header is present and names one of the five roles declared in §1.7; X-User-ID header is present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # ---- 2. authorization ---------------------------------------------------
  - priority: 20
    category: auth
    check: "the role named by X-User-Role appears in the endpoint's declared roles list, and where a shared endpoint reserves one action for one role the acting role owns that action: on POST /cle/fee-assessments/{id}/settlement only BoardAdmin may request action WAIVE"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  # ---- 3. existence of path resources, left to right ----------------------
  - priority: 30
    category: existence
    check: "every id in the path template resolves to a stored row, validated left-to-right: provider_id -> ERR_PROVIDER_NOT_FOUND, course_id -> ERR_COURSE_NOT_FOUND, application_id -> ERR_APPLICATION_NOT_FOUND, attorney_id -> ERR_ATTORNEY_NOT_FOUND, cycle_id -> ERR_CYCLE_NOT_FOUND, credit_record_id -> ERR_CREDIT_RECORD_NOT_FOUND, claim_id -> ERR_RECIPROCITY_CLAIM_NOT_FOUND, audit_id -> ERR_AUDIT_NOT_FOUND, complaint_id -> ERR_COMPLAINT_NOT_FOUND, fee_assessment_id -> ERR_FEE_ASSESSMENT_NOT_FOUND"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path carries an id segment"

  # ---- 3b. existence of body-borne foreign keys ---------------------------
  - priority: 35
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row, validated in the order the fields are listed in the endpoint's input: provider_id, course_id, attorney_id, cycle_id, attendance_report_id, reciprocity_claim_id, affirmation_id, previous_cycle_id, originating_complaint_id"
    error_id: ERR_COURSE_NOT_FOUND
    http_status: 404
    applies_to: "POST /cle/courses, POST /cle/credit-records, POST /cle/attendance-reports, POST /cle/reciprocity-claims, POST /cle/provider-audits, POST /cle/complaints, POST /cle/attorneys/{id}/compliance-cycles, POST /cle/reciprocity-claims/{id}/determination"
  - priority: 40
    category: auth
    check: "for an entity_backed role, X-User-ID equals the id of the entity that owns the addressed resource: a ProviderAdmin's X-User-ID must equal the provider_id of the course, application or audit being touched; an Attorney's X-User-ID must equal the attorney_id of the cycle, credit record, affirmation, reciprocity claim or fee assessment being touched; and for SUPPLEMENT or APPEAL the acting X-User-ID must equal the application's applicant_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /cle/courses, POST /cle/courses/{id}/applications, POST /cle/attendance-reports, POST /cle/course-applications/{id}/appellant-actions, POST /cle/credit-records, POST /cle/compliance-cycles/{id}/affirmations, POST /cle/compliance-cycles/{id}/certification, POST /cle/reciprocity-claims, POST /cle/fee-assessments/{id}/settlement, POST /cle/attorneys/{id}/reinstatement, GET /cle/compliance-cycles/{id}/summary"

  # ---- 4. shape / enum / range of the request body ------------------------
  - priority: 45
    category: existence
    check: "every required input field is present and well-formed: enums take a declared value, minute counts are non-negative integers, origin_credit_hours is a positive number with at most one decimal place, period_start < period_end, session_date is a date, action names a declared action for that endpoint, credit_allocations is a non-empty array whose category values are distinct"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  # ---- 5. optimistic concurrency ------------------------------------------
  - priority: 50
    category: state
    check: "when the endpoint declares an expected_<parent>_version input, its value equals the current version of that parent row (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cle/providers/{id}/accreditation-actions, POST /cle/reciprocity-claims, POST /cle/provider-audits/{id}/audit-actions"

  # ---- 6. state preconditions ---------------------------------------------
  - priority: 55
    category: state
    check: "the addressed resource is in a state from which the requested trigger is declared in §1.2, and every cross-entity state precondition of that transition holds"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint (accreditation-actions, review-actions, appellant-actions, appeal-decisions, audit-actions, disposition, determination, adjudication, certification, settlement, reinstatement)"
  - priority: 56
    category: state
    check: "the ComplianceCycle whose administrative_status is ADMIN_SUSPENDED accepts no credit-bearing write: no CreditRecord creation, no affirmation, no certification"
    error_id: ERR_CYCLE_ADMIN_SUSPENDED
    http_status: 409
    applies_to: "POST /cle/credit-records, POST /cle/compliance-cycles/{id}/affirmations, POST /cle/compliance-cycles/{id}/certification"
  - priority: 57
    category: state
    check: "an appeal action arrives no later than appeal_window_ends_at, which is the denial timestamp plus APPEAL_WINDOW_DAYS (30) measured against the logical clock"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /cle/course-applications/{id}/appellant-actions"

  - priority: 58
    category: state
    check: "a provider may leave PROBATIONARY for ACCREDITED only when at least one ProviderAudit of that provider has reached CLEARED"
    error_id: ERR_NO_CLEARED_AUDIT
    http_status: 409
    applies_to: "POST /cle/providers/{id}/accreditation-actions (action = GRANT_FULL on a PROBATIONARY provider)"

  # ---- 7. business rules, safety and segregation of duties first ----------
  - priority: 60
    category: business_safety
    check: "segregation of duties: the X-User-ID deciding an appeal differs from the application's reviewer_user_id; the X-User-ID substantiating or dismissing a complaint differs from that complaint's complainant_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cle/course-applications/{id}/appeal-decisions, POST /cle/complaints/{id}/disposition"
  - priority: 62
    category: business_safety
    check: "regulatory standing of the entities a credit-bearing write depends on: the Course is APPROVED (ERR_COURSE_NOT_APPROVED), the Provider is ACCREDITED or PROBATIONARY (ERR_PROVIDER_NOT_IN_GOOD_STANDING), the Attorney is ACTIVE or EXEMPT rather than ADMIN_SUSPENDED or INACTIVE (ERR_ATTORNEY_NOT_IN_GOOD_STANDING)"
    error_id: ERR_COURSE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cle/credit-records, POST /cle/attendance-reports, POST /cle/courses/{id}/applications, POST /cle/reciprocity-claims"

  # ---- 8. referential coherence between two already-existing rows ---------
  - priority: 65
    category: business_referential
    check: "the rows named by two different foreign keys agree: cycle.attorney_id equals the request's attorney_id (ERR_CYCLE_ATTORNEY_MISMATCH); the attendance report or credit allocation belongs to the same course as the request's course_id (ERR_COURSE_PROVIDER_MISMATCH); the audit's originating complaint names the same provider as provider_id (ERR_COURSE_PROVIDER_MISMATCH)"
    error_id: ERR_CYCLE_ATTORNEY_MISMATCH
    http_status: 409
    applies_to: "POST /cle/credit-records, POST /cle/provider-audits, POST /cle/reciprocity-claims/{id}/determination, POST /cle/compliance-cycles/{id}/affirmations"

  # ---- 9. temporal coherence ---------------------------------------------
  - priority: 68
    category: business_temporal
    check: "date windows line up: the credit's completion_date falls inside the cycle's half-open [period_start, period_end) window (ERR_OUTSIDE_COMPLIANCE_PERIOD); the credit's completion_date does not exceed the course's expires_at (ERR_COURSE_APPROVAL_EXPIRED); a new cycle's half-open window does not overlap another cycle of the same attorney (ERR_CYCLE_PERIOD_OVERLAP); a new audit's closed [audit_period_start, audit_period_end] window does not overlap or abut another audit of the same provider (ERR_AUDIT_PERIOD_OVERLAP), and the provider holds no other non-terminal audit (ERR_AUDIT_ENGAGEMENT_ACTIVE); the new course's session window [presented_at, expires_at] does not push the provider's concurrent LIVE_IN_PERSON session count above PROVIDER_CONCURRENT_LIVE_CAPACITY (ERR_SESSION_WINDOW_CONFLICT); a roster arrives no later than its session_date + ROSTER_HARD_WINDOW_DAYS (ERR_ROSTER_WINDOW_CLOSED)"
    error_id: ERR_OUTSIDE_COMPLIANCE_PERIOD
    http_status: 409
    applies_to: "POST /cle/credit-records, POST /cle/courses, POST /cle/attendance-reports, POST /cle/attorneys/{id}/compliance-cycles, POST /cle/provider-audits"

  # ---- 10. constraint satisfaction ---------------------------------------
  - priority: 72
    category: business_constraint
    check: "uniqueness, cardinality and sum constraints: no second CreditRecord for the same (attorney_id, course_id) pair (ERR_DUPLICATE_CREDIT_RECORD); no second non-terminal CourseApplication for the same course (ERR_DUPLICATE_APPLICATION); no second Attorney with the same bar_number (ERR_DUPLICATE_BAR_NUMBER); the credit_allocations minutes sum exactly to total_minutes (ERR_ALLOCATION_SUM_MISMATCH) and each is a positive multiple of ROUNDING_INCREMENT_MINUTES (ERR_ALLOCATION_NOT_MULTIPLE_OF_15); the credited_minutes of a new CreditRecord reaches MIN_CREDITABLE_MINUTES (ERR_BELOW_MINIMUM_CREDIT); a roster carries at least one entry (ERR_EMPTY_ROSTER); an audit sample pool is non-empty (ERR_NO_SAMPLE_POPULATION); an application has not already used MAX_INFO_REQUEST_ROUNDS info requests (ERR_INFO_REQUEST_LIMIT_EXCEEDED) or MAX_REMANDS remands (ERR_REMAND_LIMIT_EXCEEDED); an issued findings_count does not exceed the audit's sample_size (ERR_FINDINGS_EXCEED_SAMPLE); the complaint an audit escalates from has not already been escalated (ERR_COMPLAINT_ALREADY_ESCALATED); the verification_method is permitted for the course's delivery_format (ERR_VERIFICATION_METHOD_NOT_PERMITTED) and the supplied attendance_code equals the course's attendance_code (ERR_ATTENDANCE_CODE_INVALID); certification is preceded by a FINAL_COMPLIANCE_AFFIRMATION on the cycle (ERR_AFFIRMATION_REQUIRED); comity and reciprocity jurisdiction gates hold (ERR_COMITY_NOT_AVAILABLE, ERR_JURISDICTION_NOT_RECIPROCAL)"
    error_id: ERR_DUPLICATE_CREDIT_RECORD
    http_status: 409
    applies_to: "POST /cle/courses, POST /cle/attorneys, POST /cle/credit-records, POST /cle/attendance-reports, POST /cle/courses/{id}/applications, POST /cle/course-applications/{id}/review-actions, POST /cle/provider-audits/{id}/audit-actions, POST /cle/compliance-cycles/{id}/certification, POST /cle/reciprocity-claims/{id}/determination"

  # ---- 11. fiscal checks last --------------------------------------------
  - priority: 76
    category: business_fiscal
    check: "money gates evaluated after every other check: reinstatement requires attorney.outstanding_fee_cents == 0 (ERR_OUTSTANDING_FEE_BALANCE) — certification is deliberately NOT fee-gated, because a late filing is still a filing and must be able to cure a delinquency that itself created the outstanding assessment; a settlement targets a FeeAssessment still in ASSESSED (ERR_FEE_ALREADY_SETTLED)"
    error_id: ERR_OUTSTANDING_FEE_BALANCE
    http_status: 402
    applies_to: "POST /cle/attorneys/{id}/reinstatement, POST /cle/fee-assessments/{id}/settlement"

# =============================================================================
# §1.5 API Endpoint Table  (45 endpoints: 44 business + 1 test-driving clock)
#      Every path parameter is named {id} — it always identifies the resource
#      named by the immediately preceding collection segment.
# =============================================================================
endpoints:

  # ---- test-driving clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — this fixed startup default is the system's 'earliest instant' and MUST NOT fall back to real wall-clock time. Every deadline, expiry, window and lateness comparison in this domain reads the logical clock, never the host clock."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "the logical clock now reads to_iso8601; no business row is mutated"

  # ---- providers ----------------------------------------------------------
  - method: POST
    path: "/cle/providers"
    description: "Files a provider accreditation application. The provider starts in APPLIED with self_certification_enabled false."
    roles: [BoardAdmin]
    code: 201
    input: [name, provider_type, "annual_fee_cents?"]
    output: Provider
    side_effects:
      - "creates Provider with accreditation_status = APPLIED, risk_score = 0.0, risk_score_variant = REVIEWED_WEIGHTING and annual_fee_cents defaulted to DEFAULT_PROVIDER_ANNUAL_FEE_CENTS"
  - method: GET
    path: "/cle/providers/{id}"
    description: "Reads one provider, including risk_score, risk_score_variant and every denormalized counter that feeds calculations.provider_risk_score."
    roles: [BoardAdmin, AccreditationReviewer, AppealsPanelist, ProviderAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/cle/providers/{id}/accreditation-actions"
    description: "Single action endpoint for every actor-driven Provider transition: GRANT_FULL, GRANT_PROBATIONARY, DENY, RENEW, SUSPEND, REINSTATE. Guarded by concurrency_rules[renew-supersede-stale-provider]."
    roles: [BoardAdmin]
    code: 200
    input: [action, expected_provider_version, "probation_reason?"]
    output: Provider
    side_effects:
      - "applies the state_machines.Provider transition selected by action, with all of that transition's declared side effects"
      - "recomputes Provider.risk_score and Provider.risk_score_variant per calculations.provider_risk_score"
      - "GRANT_FULL and RENEW create a FeeAssessment with fee_type = PROVIDER_ANNUAL"
      - "SUSPEND cascades: the provider's APPROVED courses move to SUSPENDED_PENDING_REVIEW, which rejects those courses' PENDING_VERIFICATION credit records"
      - "REINSTATE and RENEW cascade: the provider's SUSPENDED_PENDING_REVIEW courses return to APPROVED"
      - "increments Provider.version by 1"

  # ---- courses ------------------------------------------------------------
  - method: POST
    path: "/cle/courses"
    description: "Registers a course with its credit-category allocations. A course sponsored by a provider whose self_certification_enabled is true takes approval_pathway PROVIDER_ACCREDITED and is APPROVED immediately; every other course takes INDIVIDUAL_APPROVAL and stays PENDING_APPROVAL until an application is approved."
    roles: [ProviderAdmin, Attorney, BoardAdmin]
    code: 201
    input: [title, delivery_format, total_minutes, presented_at, attendance_verification_method, credit_allocations, "provider_id?"]
    output: Course
    side_effects:
      - "cascade: one immutable CreditAllocation row per element of credit_allocations; their minutes must sum to total_minutes and each must be a positive multiple of ROUNDING_INCREMENT_MINUTES"
      - "credited_minutes_total = sum of the allocations; expires_at computed per the Course.expires_at rule"
      - "attendance_code minted only when attendance_verification_method == ATTENDANCE_CODE"
      - "when the sponsoring provider self-certifies: status = APPROVED, provider.courses_self_certified_count += 1"
      - "provider.courses_total_count += 1 when provider_id is non-null"
  - method: GET
    path: "/cle/courses/{id}"
    description: "Reads one course, including attendance_code (null unless the verification method is ATTENDANCE_CODE), approval_pathway and expires_at."
    roles: [BoardAdmin, AccreditationReviewer, AppealsPanelist, ProviderAdmin, Attorney]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/cle/courses"
    description: "Lists courses newest-first by created_at DESC, filtered by any combination of sponsoring provider, status, delivery format and approval pathway. This is the reverse-reachability channel for Course.provider_id."
    roles: [BoardAdmin, AccreditationReviewer, ProviderAdmin, Attorney]
    code: 200
    input: ["provider_id?", "status?", "delivery_format?", "approval_pathway?", "limit?", "offset?"]
    output: Course[]
    side_effects: []
  - method: GET
    path: "/cle/courses/{id}/credit-allocations"
    description: "Lists the immutable credit-category allocations cascade-created with the course, ordered created_at ASC. This is the only discovery channel for CreditAllocation."
    roles: [BoardAdmin, AccreditationReviewer, ProviderAdmin, Attorney]
    code: 200
    input: []
    output: CreditAllocation[]
    side_effects: []
  - method: GET
    path: "/cle/courses/{id}/attendance-reports"
    description: "Lists the session rosters filed for this course, ordered created_at ASC."
    roles: [BoardAdmin, AccreditationReviewer, ProviderAdmin]
    code: 200
    input: []
    output: AttendanceReport[]
    side_effects: []
  - method: POST
    path: "/cle/courses/{id}/applications"
    description: "Files an individual course-approval application for a course still in PENDING_APPROVAL. The filer's role and X-User-ID are stamped as applicant_role / applicant_user_id and become the only identity permitted to SUPPLEMENT or APPEAL."
    roles: [ProviderAdmin, Attorney]
    code: 201
    input: []
    output: CourseApplication
    side_effects:
      - "creates CourseApplication with status = SUBMITTED, info_request_round = 0, supplement_count = 0, remand_count = 0"
  - method: GET
    path: "/cle/courses/{id}/applications"
    description: "Lists this course's approval applications, ordered created_at ASC."
    roles: [BoardAdmin, AccreditationReviewer, AppealsPanelist, ProviderAdmin, Attorney]
    code: 200
    input: []
    output: CourseApplication[]
    side_effects: []

  # ---- course applications ------------------------------------------------
  - method: GET
    path: "/cle/course-applications/{id}"
    description: "Reads one application, including info_request_round, remand_count, reviewer_user_id, appeal_panelist_user_id and denied_at (from which the 30-day appeal window is measured)."
    roles: [BoardAdmin, AccreditationReviewer, AppealsPanelist, ProviderAdmin, Attorney]
    code: 200
    input: []
    output: CourseApplication
    side_effects: []
  - method: POST
    path: "/cle/course-applications/{id}/review-actions"
    description: "Reviewer-side action endpoint: REQUEST_INFO, APPROVE or DENY. REQUEST_INFO is bounded by MAX_INFO_REQUEST_ROUNDS; the acting X-User-ID is stamped as reviewer_user_id and is thereafter barred from deciding the appeal."
    roles: [AccreditationReviewer]
    code: 200
    input: [action, "denial_reason?"]
    output: CourseApplication
    side_effects:
      - "applies the state_machines.CourseApplication transition selected by action"
      - "APPROVE cascades: the course moves PENDING_APPROVAL -> APPROVED and, when it has no sponsoring provider, keeps approval_pathway INDIVIDUAL_APPROVAL"
      - "DENY cascades: the course moves PENDING_APPROVAL -> DENIED and denied_at is stamped, opening the APPEAL_WINDOW_DAYS window"
      - "reviewer_user_id = acting X-User-ID"
  - method: POST
    path: "/cle/course-applications/{id}/appellant-actions"
    description: "Applicant-side action endpoint: SUPPLEMENT (answers an information request) or APPEAL (contests a denial inside the APPEAL_WINDOW_DAYS window). Only the application's own applicant_user_id may call it."
    roles: [ProviderAdmin, Attorney]
    code: 200
    input: [action, "appeal_grounds?"]
    output: CourseApplication
    side_effects:
      - "SUPPLEMENT moves INFO_REQUESTED -> SUBMITTED and increments supplement_count"
      - "APPEAL moves DENIED -> APPEALED, records appeal_grounds and stamps appeal_filed_at"
  - method: POST
    path: "/cle/course-applications/{id}/appeal-decisions"
    description: "Appeals-panel decision on an APPEALED application: GRANT, DENY or REMAND. Segregation of duties — the acting X-User-ID must differ from reviewer_user_id. REMAND is bounded by MAX_REMANDS."
    roles: [AppealsPanelist]
    code: 200
    input: [disposition, "decision_reason?"]
    output: CourseApplication
    side_effects:
      - "GRANT moves APPEALED -> APPEAL_GRANTED and cascades the course DENIED -> APPROVED"
      - "DENY moves APPEALED -> APPEAL_DENIED and leaves the course DENIED"
      - "REMAND moves APPEALED -> SUBMITTED, cascades the course DENIED -> PENDING_APPROVAL, increments remand_count, clears reviewer_user_id / denial_reason / denied_at and resets info_request_round to 0"
      - "appeal_panelist_user_id = acting X-User-ID; decided_at = clock_now"

  # ---- attorneys ----------------------------------------------------------
  - method: POST
    path: "/cle/attorneys"
    description: "Registers an attorney. bar_number is unique across the register; status starts at ACTIVE."
    roles: [BoardAdmin]
    code: 201
    input: [bar_number, full_name, admission_date, compliance_group, principal_office_jurisdiction]
    output: Attorney
    side_effects:
      - "creates Attorney with status = ACTIVE, outstanding_fee_cents = 0, open_deficiency_count = 0, pending_recertification_count = 0"
  - method: POST
    path: "/cle/attorneys/{id}/status-changes"
    description: "Board-side administrative standing change between ACTIVE, EXEMPT and INACTIVE. It is the only actor-driven writer of Attorney.status; ADMIN_SUSPENDED is reachable only through a reporting sweep and is cleared only by reinstatement, so this endpoint rejects both ADMIN_SUSPENDED as a target and any attorney already in ADMIN_SUSPENDED."
    roles: [BoardAdmin]
    code: 200
    input: [status, "reason?"]
    output: Attorney
    side_effects:
      - "attorney.status = status; every ComplianceCycle of the attorney keeps its own credit_status and administrative_status unchanged"
      - "increments Attorney.version by 1"
  - method: GET
    path: "/cle/attorneys/{id}"
    description: "Reads one attorney, including the conserved outstanding_fee_cents balance and the version needed by concurrency_rules[reciprocity-refile-stale-attorney]."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output: Attorney
    side_effects: []
  - method: POST
    path: "/cle/attorneys/{id}/compliance-cycles"
    description: "Opens a compliance period for an attorney. Requirements, filing deadline and proration are derived once at creation per calculations.cycle_requirement_derivation; carryover_in_* is copied from the predecessor cycle's carryover_out_* when previous_cycle_id is supplied."
    roles: [BoardAdmin]
    code: 201
    input: [period_start, period_end, "previous_cycle_id?", "carryover_election?"]
    output: ComplianceCycle
    side_effects:
      - "required_total_minutes, required_ethics_minutes, required_technology_minutes, required_bias_minutes, prorated and filing_deadline written per calculations.cycle_requirement_derivation"
      - "carryover_in_general_minutes / carryover_in_ethics_minutes = the predecessor's carryover_out_general_minutes / carryover_out_ethics_minutes, or 0 when previous_cycle_id is null"
      - "the half-open [period_start, period_end) window must not overlap another cycle of the same attorney"
  - method: GET
    path: "/cle/attorneys/{id}/reciprocity-claims"
    description: "Lists this attorney's out-of-state credit and comity claims, ordered created_at ASC."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output: ReciprocityClaim[]
    side_effects: []
  - method: POST
    path: "/cle/attorneys/{id}/reinstatement"
    description: "Lifts an administrative suspension. cure_basis is FEES_AND_CREDITS_CURED (requires a zero fee balance AND a FINAL-variant run over VERIFIED records only that shows no total and no specialty deficiency) or BOARD_ORDER (requires only the zero fee balance)."
    roles: [BoardAdmin]
    code: 200
    input: [cycle_id, cure_basis, "reason?"]
    output: Attorney
    side_effects:
      - "the named cycle moves administrative_status ADMIN_SUSPENDED -> REINSTATED and delinquent_since = null"
      - "attorney.status ADMIN_SUSPENDED -> ACTIVE"
      - "with cure_basis == FEES_AND_CREDITS_CURED the cycle's credit_status also moves to SATISFIED"
      - "increments Attorney.version by 1 and ComplianceCycle.version by 1"

  # ---- compliance cycles --------------------------------------------------
  - method: GET
    path: "/cle/compliance-cycles/{id}"
    description: "Reads one compliance cycle: both status dimensions, the derived requirements, the carryover ledger and the earned_* fields (which hold the PROVISIONAL result while credit_status == OPEN and are frozen to the FINAL result once the cycle leaves OPEN)."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output: ComplianceCycle
    side_effects: []
  - method: GET
    path: "/cle/compliance-cycles"
    description: "Lists compliance cycles ordered period_start ASC, created_at ASC, filtered by attorney, predecessor cycle, closing comity claim, or either status dimension. This is the reverse-reachability channel for ComplianceCycle.attorney_id, ComplianceCycle.previous_cycle_id and ComplianceCycle.comity_claim_id."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: ["attorney_id?", "previous_cycle_id?", "comity_claim_id?", "credit_status?", "administrative_status?", "limit?", "offset?"]
    output: ComplianceCycle[]
    side_effects: []
  - method: GET
    path: "/cle/compliance-cycles/{id}/summary"
    description: "Computed read that runs calculations.cycle_credit_application BOTH ways over the same stored data and returns the two results side by side. The provisional_* fields are the PROVISIONAL run (PENDING_VERIFICATION + VERIFIED records) and the projected_final_* fields are the FINAL run (VERIFIED only). The four *_used_minutes bucket fields report the PROVISIONAL run's cap consumption; records_counted is the size of the PROVISIONAL input set and records_excluded counts the cycle's REJECTED plus VOIDED records. projected_carryover_out_* is calculations.carryover_determination applied to the FINAL run, and projected_late_fee_cents is calculations.late_fee_assessment applied to the FINAL run. Nothing is persisted by this call."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output:
      cycle_id: string
      credit_status: string
      administrative_status: string
      required_total_minutes: integer
      required_ethics_minutes: integer
      required_technology_minutes: integer
      required_bias_minutes: integer
      provisional_total_minutes: integer
      provisional_ethics_minutes: integer
      provisional_technology_minutes: integer
      provisional_bias_minutes: integer
      provisional_live_minutes: integer
      provisional_deficiency_total_minutes: integer
      provisional_deficiency_ethics_minutes: integer
      projected_final_total_minutes: integer
      projected_final_ethics_minutes: integer
      projected_final_technology_minutes: integer
      projected_final_bias_minutes: integer
      projected_final_live_minutes: integer
      projected_final_deficiency_total_minutes: integer
      projected_final_deficiency_ethics_minutes: integer
      projected_final_deficiency_technology_minutes: integer
      projected_final_deficiency_bias_minutes: integer
      self_study_used_minutes: integer
      on_demand_used_minutes: integer
      nonlive_used_minutes: integer
      reciprocity_used_minutes: integer
      carryover_in_general_minutes: integer
      carryover_in_ethics_minutes: integer
      projected_carryover_out_general_minutes: integer
      projected_carryover_out_ethics_minutes: integer
      projected_late_fee_cents: integer
      records_counted: integer
      records_excluded: integer
    side_effects: []
  - method: POST
    path: "/cle/compliance-cycles/{id}/affirmations"
    description: "Files an immutable affirmation against the cycle. ATTENDANCE_AFFIRMATION verifies one PENDING_VERIFICATION credit record and requires target_credit_record_id; SELF_STUDY_AFFIRMATION attests unverified self-study; FINAL_COMPLIANCE_AFFIRMATION is the prerequisite for certification."
    roles: [Attorney]
    code: 201
    input: [affirmation_type, statement, "target_credit_record_id?"]
    output: Affirmation
    side_effects:
      - "cascade for ATTENDANCE_AFFIRMATION: the targeted CreditRecord moves PENDING_VERIFICATION -> VERIFIED, its affirmation_id is set to this affirmation, and the owning cycle's credit application is re-run"
      - "affirmed_by_user_id = acting X-User-ID, which must equal cycle.attorney_id"
  - method: GET
    path: "/cle/compliance-cycles/{id}/affirmations"
    description: "Lists the affirmations filed against this cycle, ordered created_at ASC. This is the only discovery channel for Affirmation."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output: Affirmation[]
    side_effects: []
  - method: POST
    path: "/cle/compliance-cycles/{id}/certification"
    description: "Certifies the compliance period. Runs calculations.cycle_credit_application in the FINAL variant (VERIFIED records only), which decides SATISFIED versus DEFICIENT, then calculations.carryover_determination. A DELINQUENT cycle may still certify — a late filing is still a filing — and doing so cures the delinquency."
    roles: [Attorney]
    code: 200
    input: ["carryover_election?"]
    output: ComplianceCycle
    side_effects:
      - "carryover_election overwritten when supplied; earned_* frozen to the FINAL result; certified_at = clock_now"
      - "credit_status -> SATISFIED or DEFICIENT per state_machines.ComplianceCycle"
      - "carryover_out_general_minutes / carryover_out_ethics_minutes written per calculations.carryover_determination"
      - "cascade: the successor cycle (previous_cycle_id == this cycle's id) has its carryover_in_* rewritten to this cycle's carryover_out_* and its own figures recomputed"
      - "cascade: a DELINQUENT cycle returns to GOOD_STANDING, and within LATE_FEE_VOID_GRACE_DAYS of delinquent_since its ASSESSED LATE_COMPLIANCE fee moves to VOIDED, lowering attorney.outstanding_fee_cents"
      - "every CreditRecord of the cycle has countable_minutes rewritten to its FINAL-variant value"
      - "increments ComplianceCycle.version by 1"

  # ---- credit records and rosters -----------------------------------------
  - method: POST
    path: "/cle/credit-records"
    description: "Claims credit for one attended course. cycle_id is resolved server-side to the attorney's unique cycle whose half-open period contains completion_date. verification_method ATTENDANCE_CODE verifies the record immediately when attendance_code matches; CERTIFICATE and AFFIRMATION leave it PENDING_VERIFICATION; ROSTER is rejected here because only the roster cascade may mint it."
    roles: [Attorney]
    code: 201
    input: [attorney_id, course_id, verification_method, attended_minutes, completion_date, "certificate_reference?", "attendance_code?"]
    output: CreditRecord
    side_effects:
      - "credited_* minutes written per calculations.credit_record_category_proration; effective_format and source derived per their §1.1 rules"
      - "with verification_method == ATTENDANCE_CODE and a matching code: status = VERIFIED and course.verified_credit_record_count += 1"
      - "re-runs calculations.cycle_credit_application for the owning cycle, rewriting cycle.earned_* and countable_minutes on every record of that cycle"
  - method: GET
    path: "/cle/credit-records/{id}"
    description: "Reads one credit record, including the four credited_* category minutes, countable_minutes after cap truncation, effective_format and source."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output: CreditRecord
    side_effects: []
  - method: GET
    path: "/cle/credit-records"
    description: "Lists credit records ordered completion_date ASC, created_at ASC — the same order calculations.cycle_credit_application consumes them in. This is the reverse-reachability channel for all six CreditRecord foreign keys."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: ["attorney_id?", "cycle_id?", "course_id?", "attendance_report_id?", "reciprocity_claim_id?", "affirmation_id?", "status?", "limit?", "offset?"]
    output: CreditRecord[]
    side_effects: []
  - method: POST
    path: "/cle/credit-records/{id}/adjudication"
    description: "Board adjudication of one credit record: VERIFY, REJECT or VOID. VOID applies only to a VERIFIED record and can drive the owning cycle backwards from SATISFIED to OPEN."
    roles: [BoardAdmin]
    code: 200
    input: [action, "void_reason?"]
    output: CreditRecord
    side_effects:
      - "applies the state_machines.CreditRecord transition selected by action"
      - "re-runs the owning cycle's credit application; VOID can cascade credit_status SATISFIED -> OPEN, zero the cycle's carryover_out_*, and rewrite the successor cycle's carryover_in_* to 0"
  - method: POST
    path: "/cle/attendance-reports"
    description: "Files a session roster for a course. Lateness is computed per calculations.attendance_report_lateness against the logical clock; each accepted entry cascades a VERIFIED CreditRecord, and unresolvable entries are counted in rejected_entry_count without failing the request."
    roles: [ProviderAdmin]
    code: 201
    input: [course_id, session_date, entries]
    output: AttendanceReport
    side_effects:
      - "due_at, days_late and status (ACCEPTED or ACCEPTED_LATE) written per calculations.attendance_report_lateness; session_end = session_date + course.total_minutes"
      - "cascade: one VERIFIED CreditRecord per accepted entry with verification_method = ROSTER and attendance_report_id set, then a credit-application re-run for each affected cycle"
      - "provider.attendance_reports_total_count += 1, and attendance_reports_late_count += 1 when days_late > 0, then provider.risk_score is recomputed"

  # ---- reciprocity and comity ---------------------------------------------
  - method: POST
    path: "/cle/reciprocity-claims"
    description: "Files an out-of-state credit claim (basis RECIPROCITY) or a comity claim (basis COMITY). Guarded by concurrency_rules[reciprocity-refile-stale-attorney]: a claim carrying an expected_attorney_version the server has already advanced is rejected, because a supersede-style refile must be based on the standing the client actually observed."
    roles: [Attorney]
    code: 201
    input: [attorney_id, basis, origin_jurisdiction, origin_course_title, origin_credit_hours, origin_category, completion_date, expected_attorney_version]
    output: ReciprocityClaim
    side_effects:
      - "creates ReciprocityClaim with status = SUBMITTED, converted_minutes = 0, converted_category = GENERAL"
      - "increments Attorney.version by 1"
  - method: POST
    path: "/cle/reciprocity-claims/{id}/determination"
    description: "Board determination on a submitted claim: APPROVE or DENY. APPROVE runs calculations.reciprocity_credit_conversion — the RECIPROCITY pathway converts origin hours into home minutes and cascades a VERIFIED credit record, while the COMITY pathway grants no minutes and instead closes the cycle's general requirement."
    roles: [BoardAdmin]
    code: 200
    input: [action, "determination_reason?"]
    output: ReciprocityClaim
    side_effects:
      - "converted_minutes and converted_category written per calculations.reciprocity_credit_conversion"
      - "cascade for basis == RECIPROCITY: a VERIFIED CreditRecord with source = RECIPROCITY and reciprocity_claim_id set, then a credit-application re-run under RECIPROCITY_CAP_MINUTES"
      - "cascade for basis == COMITY: cycle.comity_claim_id = claim.id and credit_status OPEN -> CLOSED_COMITY when the VERIFIED-only specialty totals are met, otherwise OPEN -> DEFICIENT"

  # ---- provider audits ----------------------------------------------------
  - method: POST
    path: "/cle/provider-audits"
    description: "Opens an audit engagement over a closed [audit_period_start, audit_period_end] window. The provider's risk score is computed and frozen into risk_score_at_open, which alone decides the sample target size. A provider may hold only one non-terminal audit, and audit windows of the same provider may neither overlap nor abut."
    roles: [BoardAdmin]
    code: 201
    input: [provider_id, audit_period_start, audit_period_end, trigger_type, "originating_complaint_id?"]
    output: ProviderAudit
    side_effects:
      - "risk_score_at_open = calculations.provider_risk_score for the provider, evaluated at creation and never refreshed on this row"
      - "creates ProviderAudit with status = OPENED, sample_size = 0, sampled_course_ids = [], findings_count = 0, sanction_type = NONE"
      - "when originating_complaint_id is supplied: that complaint's escalated = true, and trigger_type must be COMPLAINT_ESCALATION"
  - method: GET
    path: "/cle/provider-audits/{id}"
    description: "Reads one audit, including the frozen risk_score_at_open, the ordered sampled_course_ids and the version required by concurrency_rules[sample-redraw-stale-audit]."
    roles: [BoardAdmin, AccreditationReviewer, ProviderAdmin]
    code: 200
    input: []
    output: ProviderAudit
    side_effects: []
  - method: GET
    path: "/cle/provider-audits"
    description: "Lists audits ordered audit_period_start ASC, created_at ASC. This is the reverse-reachability channel for ProviderAudit.provider_id and ProviderAudit.originating_complaint_id."
    roles: [BoardAdmin, AccreditationReviewer, ProviderAdmin]
    code: 200
    input: ["provider_id?", "originating_complaint_id?", "status?", "trigger_type?", "limit?", "offset?"]
    output: ProviderAudit[]
    side_effects: []
  - method: POST
    path: "/cle/provider-audits/{id}/audit-actions"
    description: "Audit action endpoint: DRAW_SAMPLE (repeatable — a redraw supersedes the prior sample), ISSUE_FINDINGS, CLOSE_CLEARED, CLOSE_SANCTIONED. Every action carries expected_audit_version per concurrency_rules[sample-redraw-stale-audit]."
    roles: [BoardAdmin]
    code: 200
    input: [action, expected_audit_version, "findings_count?", "sanction_type?"]
    output: ProviderAudit
    side_effects:
      - "DRAW_SAMPLE writes sample_size and sampled_course_ids per calculations.audit_sample_selection and adds the delta to provider.courses_sampled_lifetime"
      - "ISSUE_FINDINGS records findings_count (bounded by sample_size) and adds it to provider.audit_findings_count"
      - "CLOSE_CLEARED stamps closed_at, sets sanction_type = NONE, writes provider.last_audit_closed_at and unlocks the provider's PROBATIONARY -> ACCREDITED gate"
      - "CLOSE_SANCTIONED stamps closed_at, records sanction_type, creates a FeeAssessment with fee_type = AUDIT_SANCTION, and cascades the provider to PROBATIONARY or SUSPENDED — the SUSPENDED branch suspends the provider's courses, which rejects those courses' PENDING_VERIFICATION credit records"
      - "recomputes provider.risk_score and provider.risk_score_variant per calculations.provider_risk_score AFTER any status cascade above has landed, so the variant selected is the provider's post-cascade accreditation_status"
      - "increments ProviderAudit.version by 1"

  # ---- complaints ---------------------------------------------------------
  - method: POST
    path: "/cle/complaints"
    description: "Files a complaint against a provider or a course. subject_id is polymorphic and is validated against the table selected by subject_type. The filer's role and X-User-ID are stamped as complainant_role / complainant_user_id and are thereafter barred from disposing of the complaint."
    roles: [Attorney, BoardAdmin]
    code: 201
    input: [subject_type, subject_id, allegation, allegation_category]
    output: Complaint
    side_effects:
      - "creates Complaint with status = RECEIVED, escalated = false"
  - method: GET
    path: "/cle/complaints/{id}"
    description: "Reads one complaint, including complainant_user_id (needed for the segregation-of-duties check) and escalated."
    roles: [BoardAdmin, AccreditationReviewer, Attorney]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: "/cle/complaints/{id}/disposition"
    description: "Complaint disposition: OPEN_REVIEW, SUBSTANTIATE or DISMISS. Segregation of duties — the acting X-User-ID must differ from complainant_user_id. SUBSTANTIATE is the head of the deepest cascade in this domain."
    roles: [BoardAdmin]
    code: 200
    input: [action, "disposition_reason?"]
    output: Complaint
    side_effects:
      - "OPEN_REVIEW moves RECEIVED -> UNDER_REVIEW; DISMISS moves RECEIVED or UNDER_REVIEW -> DISMISSED"
      - "SUBSTANTIATE with subject_type == PROVIDER: provider.substantiated_complaint_count += 1, risk_score recomputed, provider ACCREDITED -> PROBATIONARY"
      - "SUBSTANTIATE with subject_type == COURSE: the course -> REVOKED, which voids that course's VERIFIED credit records, which re-runs each owning cycle's credit application, which can revert a SATISFIED cycle to OPEN and rewrite the successor cycle's carryover_in_* to 0"

  # ---- fee assessments ----------------------------------------------------
  - method: GET
    path: "/cle/fee-assessments/{id}"
    description: "Reads one fee assessment, including fee_type, amount_cents and settlement state."
    roles: [BoardAdmin, Attorney, ProviderAdmin]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []
  - method: GET
    path: "/cle/fee-assessments"
    description: "Lists fee assessments ordered created_at ASC. This is the reverse-reachability channel for FeeAssessment.attorney_id, FeeAssessment.cycle_id, FeeAssessment.provider_id and FeeAssessment.assessed_by_sweep_id, and the audit trail for the conserved attorney.outstanding_fee_cents balance."
    roles: [BoardAdmin, AccreditationReviewer, Attorney, ProviderAdmin]
    code: 200
    input: ["attorney_id?", "cycle_id?", "provider_id?", "assessed_by_sweep_id?", "fee_type?", "status?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []
  - method: POST
    path: "/cle/fee-assessments/{id}/settlement"
    description: "Settles an assessment: PAY (attorney or board) or WAIVE (board only, waiver_reason required). Both settle paths decrement the conserved attorney.outstanding_fee_cents by exactly this assessment's amount_cents."
    roles: [BoardAdmin, Attorney, ProviderAdmin]
    code: 200
    input: [action, "waiver_reason?"]
    output: FeeAssessment
    side_effects:
      - "status -> PAID or WAIVED; settled_at = clock_now"
      - "when attorney_id is non-null: attorney.outstanding_fee_cents -= amount_cents"

  # ---- reporting sweep ----------------------------------------------------
  - method: POST
    path: "/cle/reporting-sweeps"
    description: "Runs the board's batch reporting sweep against the logical clock. It is the only producer of delinquency notices, administrative suspensions, late fees, course expiry and provider lapse. Cycles are processed in filing_deadline ASC, created_at ASC order so the run is reproducible."
    roles: [BoardAdmin]
    code: 201
    input: []
    output: ReportingSweep
    side_effects:
      - "as_of = clock_now; sweep_number = the previous sweep_number + 1, starting at 1"
      - "every GOOD_STANDING cycle past its filing_deadline moves to DELINQUENT, which assesses a LATE_COMPLIANCE fee per calculations.late_fee_assessment and raises attorney.outstanding_fee_cents"
      - "every DELINQUENT cycle at or past delinquent_since + DELINQUENCY_TO_SUSPENSION_DAYS moves to ADMIN_SUSPENDED, which suspends the attorney, denies that attorney's SUBMITTED reciprocity claims, and assesses a REINSTATEMENT fee"
      - "every APPROVED course at or past expires_at moves to EXPIRED; every ACCREDITED or PROBATIONARY provider at or past accreditation_term_end moves to LAPSED, which suspends its courses"
      - "provider.risk_score and provider.risk_score_variant are recomputed for every provider touched"
      - "cycles_examined, delinquencies_issued, suspensions_issued, late_fees_assessed_cents, courses_expired and providers_lapsed are counted into the returned ReportingSweep"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is absent, empty or not one of the five declared roles, or X-User-ID is absent or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles, or the acting role requests an action a shared endpoint reserves for another role (action WAIVE on POST /cle/fee-assessments/{id}/settlement is BoardAdmin-only)"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role addresses a resource it does not own: a ProviderAdmin whose X-User-ID differs from the course's or audit's provider_id, an Attorney whose X-User-ID differs from the cycle's, record's, claim's or assessment's attorney_id, or a SUPPLEMENT / APPEAL whose X-User-ID differs from the application's applicant_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already occupied the incompatible seat: deciding an appeal it reviewed (reviewer_user_id), or disposing of a complaint it filed (complainant_user_id)"

  # ---- existence ----------------------------------------------------------
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "no Provider row matches the path or body provider_id"
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "no Course row matches the path or body course_id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no CourseApplication row matches the path id"
  - id: ERR_ATTORNEY_NOT_FOUND
    http: 404
    condition: "no Attorney row matches the path or body attorney_id"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "no ComplianceCycle row matches the path or body cycle_id or previous_cycle_id"
  - id: ERR_CREDIT_RECORD_NOT_FOUND
    http: 404
    condition: "no CreditRecord row matches the path id or the affirmation's target_credit_record_id"
  - id: ERR_RECIPROCITY_CLAIM_NOT_FOUND
    http: 404
    condition: "no ReciprocityClaim row matches the path id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no ProviderAudit row matches the path id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no Complaint row matches the path id, the body originating_complaint_id, or the polymorphic subject_id when subject_type == PROVIDER or COURSE resolves to nothing"
  - id: ERR_FEE_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no FeeAssessment row matches the path id"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, an enum value is undeclared, a minute or cent count is negative or non-integer, origin_credit_hours carries more than one decimal place, period_start >= period_end, credit_allocations is empty or repeats a category, an action name is not declared for the endpoint, or a conditionally required field (target_credit_record_id for ATTENDANCE_AFFIRMATION, sanction_type for CLOSE_SANCTIONED, waiver_reason for WAIVE, disposition_reason for SUBSTANTIATE / DISMISS) is absent"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_provider_version, expected_attorney_version or expected_audit_version differs from the parent row's current version (see §1.2.1)"

  # ---- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested trigger is not declared from the resource's current state — for example DRAW_SAMPLE on a FINDINGS_ISSUED audit, SUBSTANTIATE on a RECEIVED complaint, certification of a cycle whose credit_status is not OPEN, adjudicating an already-terminal credit record, or a status-change targeting ADMIN_SUSPENDED"
  - id: ERR_CYCLE_ADMIN_SUSPENDED
    http: 409
    condition: "a credit-bearing write (credit record, affirmation, certification) addresses a cycle whose administrative_status is ADMIN_SUSPENDED"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "an APPEAL arrives after denied_at + APPEAL_WINDOW_DAYS measured on the logical clock"
  - id: ERR_NO_CLEARED_AUDIT
    http: 409
    condition: "GRANT_FULL on a PROBATIONARY provider that has no ProviderAudit in CLEARED"

  # ---- regulatory standing ------------------------------------------------
  - id: ERR_COURSE_NOT_APPROVED
    http: 409
    condition: "a credit claim, roster or new application addresses a course whose status is not APPROVED (or, for an application, not PENDING_APPROVAL)"
  - id: ERR_PROVIDER_NOT_IN_GOOD_STANDING
    http: 409
    condition: "the sponsoring provider's accreditation_status is neither ACCREDITED nor PROBATIONARY when a roster or self-certified course write is attempted"
  - id: ERR_ATTORNEY_NOT_IN_GOOD_STANDING
    http: 409
    condition: "the acting or referenced attorney's status is ADMIN_SUSPENDED or INACTIVE where the operation requires ACTIVE or EXEMPT"

  # ---- referential coherence ---------------------------------------------
  - id: ERR_CYCLE_ATTORNEY_MISMATCH
    http: 409
    condition: "the cycle named by the request belongs to a different attorney than the request's attorney_id, or the affirmation's target credit record belongs to a different cycle"
  - id: ERR_COURSE_PROVIDER_MISMATCH
    http: 409
    condition: "the roster's course belongs to a different provider than the acting ProviderAdmin, or an escalating audit names a provider other than the one its originating complaint resolves to"

  # ---- temporal -----------------------------------------------------------
  - id: ERR_OUTSIDE_COMPLIANCE_PERIOD
    http: 409
    condition: "completion_date falls in no ComplianceCycle of that attorney whose half-open [period_start, period_end) window contains it"
  - id: ERR_COURSE_APPROVAL_EXPIRED
    http: 409
    condition: "completion_date is later than the course's expires_at"
  - id: ERR_CYCLE_PERIOD_OVERLAP
    http: 409
    condition: "the new cycle's half-open [period_start, period_end) window intersects an existing cycle of the same attorney; exact adjacency (new period_start == existing period_end) is allowed"
  - id: ERR_AUDIT_PERIOD_OVERLAP
    http: 409
    condition: "the new audit's closed [audit_period_start, audit_period_end] window intersects or merely touches an existing audit window of the same provider; adjacency collides here, unlike compliance cycles"
  - id: ERR_AUDIT_ENGAGEMENT_ACTIVE
    http: 409
    condition: "the provider already holds a ProviderAudit whose status is OPENED, SAMPLED or FINDINGS_ISSUED"
  - id: ERR_SESSION_WINDOW_CONFLICT
    http: 409
    condition: "a new LIVE_IN_PERSON course would give its provider more than PROVIDER_CONCURRENT_LIVE_CAPACITY courses whose [presented_at, expires_at] session windows overlap a common instant"
  - id: ERR_ROSTER_WINDOW_CLOSED
    http: 409
    condition: "a roster is filed later than session_date + ROSTER_HARD_WINDOW_DAYS on the logical clock"

  # ---- constraint satisfaction -------------------------------------------
  - id: ERR_DUPLICATE_CREDIT_RECORD
    http: 409
    condition: "a non-terminal CreditRecord already exists for this (attorney_id, course_id) pair"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "a CourseApplication in SUBMITTED, INFO_REQUESTED or APPEALED already exists for this course"
  - id: ERR_DUPLICATE_BAR_NUMBER
    http: 409
    condition: "another Attorney already holds this bar_number"
  - id: ERR_ALLOCATION_SUM_MISMATCH
    http: 409
    condition: "the credit_allocations minutes do not sum exactly to total_minutes"
  - id: ERR_ALLOCATION_NOT_MULTIPLE_OF_15
    http: 409
    condition: "a credit_allocations element's minutes is not a positive multiple of ROUNDING_INCREMENT_MINUTES"
  - id: ERR_BELOW_MINIMUM_CREDIT
    http: 409
    condition: "the per-category rounding of calculations.credit_record_category_proration yields credited_minutes below MIN_CREDITABLE_MINUTES"
  - id: ERR_EMPTY_ROSTER
    http: 409
    condition: "entries is an empty array"
  - id: ERR_NO_SAMPLE_POPULATION
    http: 409
    condition: "DRAW_SAMPLE finds no course of the audited provider in APPROVED, EXPIRED or SUSPENDED_PENDING_REVIEW whose presented_at lies inside the audit's closed window"
  - id: ERR_INFO_REQUEST_LIMIT_EXCEEDED
    http: 409
    condition: "REQUEST_INFO would push info_request_round above MAX_INFO_REQUEST_ROUNDS"
  - id: ERR_REMAND_LIMIT_EXCEEDED
    http: 409
    condition: "REMAND would push remand_count above MAX_REMANDS"
  - id: ERR_FINDINGS_EXCEED_SAMPLE
    http: 409
    condition: "ISSUE_FINDINGS supplies a findings_count greater than the audit's sample_size"
  - id: ERR_COMPLAINT_ALREADY_ESCALATED
    http: 409
    condition: "originating_complaint_id names a complaint whose escalated is already true"
  - id: ERR_VERIFICATION_METHOD_NOT_PERMITTED
    http: 409
    condition: "the requested CreditRecord.verification_method is not the partner of the course's attendance_verification_method under the fixed pairing ROSTER<->ROSTER, ATTENDANCE_CODE<->ATTENDANCE_CODE, CERTIFICATE<->CERTIFICATE, AFFIRMATION_ONLY<->AFFIRMATION; or ROSTER is requested directly on POST /cle/credit-records, where only the roster cascade may mint it"
  - id: ERR_ATTENDANCE_CODE_INVALID
    http: 409
    condition: "attendance_code is absent or differs from the course's minted attendance_code when verification_method == ATTENDANCE_CODE"
  - id: ERR_AFFIRMATION_REQUIRED
    http: 409
    condition: "certification is attempted on a cycle that has no Affirmation with affirmation_type == FINAL_COMPLIANCE_AFFIRMATION"
  - id: ERR_COMITY_NOT_AVAILABLE
    http: 409
    condition: "a COMITY claim's origin_jurisdiction is not in COMITY_JURISDICTIONS, or the attorney's principal_office_jurisdiction differs from it, or that jurisdiction equals HOME_JURISDICTION"
  - id: ERR_JURISDICTION_NOT_RECIPROCAL
    http: 409
    condition: "a RECIPROCITY claim's origin_jurisdiction is not in RECIPROCITY_JURISDICTIONS"

  # ---- fiscal -------------------------------------------------------------
  - id: ERR_OUTSTANDING_FEE_BALANCE
    http: 402
    condition: "reinstatement is attempted while attorney.outstanding_fee_cents is greater than 0"
  - id: ERR_FEE_ALREADY_SETTLED
    http: 409
    condition: "a settlement addresses a FeeAssessment whose status is PAID, WAIVED or VOIDED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: BoardAdmin
    description: "State CLE board staff. Owns accreditation decisions, attorney registration and standing, cycle creation, reciprocity determinations, audits, complaint dispositions, credit adjudication, fee waivers, the reporting sweep and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /cle/providers"
      - "POST /cle/providers/{id}/accreditation-actions"
      - "POST /cle/attorneys"
      - "POST /cle/attorneys/{id}/status-changes"
      - "POST /cle/attorneys/{id}/compliance-cycles"
      - "POST /cle/attorneys/{id}/reinstatement"
      - "POST /cle/credit-records/{id}/adjudication"
      - "POST /cle/reciprocity-claims/{id}/determination"
      - "POST /cle/provider-audits"
      - "POST /cle/provider-audits/{id}/audit-actions"
      - "POST /cle/complaints/{id}/disposition"
      - "POST /cle/reporting-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /cle/courses (shared with ProviderAdmin and Attorney)"
      - "POST /cle/complaints (shared with Attorney)"
      - "POST /cle/fee-assessments/{id}/settlement (shared with Attorney and ProviderAdmin; WAIVE is board-only)"
      - "every GET in §1.5"

  - name: AccreditationReviewer
    description: "Board reviewer who adjudicates individual course-approval applications. Deliberately cannot decide the appeal of a denial it issued — segregation of duties is enforced on X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /cle/course-applications/{id}/review-actions"
    shared_operations:
      - "GET /cle/providers/{id}, GET /cle/courses, GET /cle/courses/{id}, GET /cle/courses/{id}/credit-allocations, GET /cle/courses/{id}/attendance-reports, GET /cle/courses/{id}/applications, GET /cle/course-applications/{id}"
      - "GET /cle/attorneys/{id}, GET /cle/attorneys/{id}/reciprocity-claims, GET /cle/compliance-cycles, GET /cle/compliance-cycles/{id}, GET /cle/compliance-cycles/{id}/summary, GET /cle/compliance-cycles/{id}/affirmations"
      - "GET /cle/credit-records, GET /cle/credit-records/{id}, GET /cle/provider-audits, GET /cle/provider-audits/{id}, GET /cle/complaints/{id}, GET /cle/fee-assessments"

  - name: AppealsPanelist
    description: "Independent panelist who decides appeals of course-approval denials. Cannot file, review or supplement an application — only decide an APPEALED one, and only when it did not review it."
    identity: "opaque"
    exclusive_operations:
      - "POST /cle/course-applications/{id}/appeal-decisions"
    shared_operations:
      - "GET /cle/providers/{id}, GET /cle/courses/{id}, GET /cle/courses/{id}/applications, GET /cle/course-applications/{id}"

  - name: ProviderAdmin
    description: "Administrator of one accredited or applicant provider. X-User-ID is that Provider's id. May register courses under its own provider_id, file applications and rosters, and settle its own provider-side fees."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /cle/attendance-reports"
    shared_operations:
      - "POST /cle/courses (shared with Attorney and BoardAdmin; provider_id must equal X-User-ID)"
      - "POST /cle/courses/{id}/applications (shared with Attorney)"
      - "POST /cle/course-applications/{id}/appellant-actions (shared with Attorney; only as the application's applicant_user_id)"
      - "POST /cle/fee-assessments/{id}/settlement (shared with BoardAdmin and Attorney; PAY only)"
      - "GET /cle/providers/{id}, GET /cle/courses, GET /cle/courses/{id}, GET /cle/courses/{id}/credit-allocations, GET /cle/courses/{id}/attendance-reports, GET /cle/courses/{id}/applications, GET /cle/course-applications/{id}, GET /cle/provider-audits, GET /cle/provider-audits/{id}, GET /cle/fee-assessments, GET /cle/fee-assessments/{id}"

  - name: Attorney
    description: "A licensed attorney subject to the CLE requirement. X-User-ID is that Attorney's id. Claims credit, files affirmations, certifies its own cycles, files reciprocity and comity claims and complaints, and may seek individual approval of a course with no sponsoring provider."
    identity: "entity_backed:Attorney"
    exclusive_operations:
      - "POST /cle/credit-records"
      - "POST /cle/compliance-cycles/{id}/affirmations"
      - "POST /cle/compliance-cycles/{id}/certification"
      - "POST /cle/reciprocity-claims"
    shared_operations:
      - "POST /cle/courses (shared with ProviderAdmin and BoardAdmin; provider_id must be omitted, which forces approval_pathway INDIVIDUAL_APPROVAL)"
      - "POST /cle/courses/{id}/applications (shared with ProviderAdmin)"
      - "POST /cle/course-applications/{id}/appellant-actions (shared with ProviderAdmin; only as the application's applicant_user_id)"
      - "POST /cle/complaints (shared with BoardAdmin)"
      - "POST /cle/fee-assessments/{id}/settlement (shared with BoardAdmin and ProviderAdmin; PAY only, and only its own assessments)"
      - "GET /cle/courses, GET /cle/courses/{id}, GET /cle/courses/{id}/credit-allocations, GET /cle/courses/{id}/applications, GET /cle/course-applications/{id}, GET /cle/attorneys/{id}, GET /cle/attorneys/{id}/reciprocity-claims, GET /cle/compliance-cycles, GET /cle/compliance-cycles/{id}, GET /cle/compliance-cycles/{id}/summary, GET /cle/compliance-cycles/{id}/affirmations, GET /cle/credit-records, GET /cle/credit-records/{id}, GET /cle/complaints/{id}, GET /cle/fee-assessments, GET /cle/fee-assessments/{id}"
