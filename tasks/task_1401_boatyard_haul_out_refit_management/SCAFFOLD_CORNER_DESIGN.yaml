scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: vessel_creation_returns_201_with_system_fields
        claim_type: creation
        grounds: [entities.Vessel, endpoints]
        distinguishing_aspect: "POST /yard/vessels with all required fields returns 201; server mints id, created_at, version == 1 and echoes loa_ft 40."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
          trigger:
            - { call: "POST /yard/vessels", payload: { name: "MV Nova", owner_name: "O N", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id, v_ver: $.data.version } }
          assert:
            - "201 with data.id non-null and data.version == 1"
            - "data.loa_ft == 40 and data.hull_type == POWER echoed"

      - name: vessel_list_pagination_and_owner_filter
        claim_type: listing
        grounds: [entities.Vessel, response_envelope]
        distinguishing_aspect: "GET /yard/vessels honors limit/offset with envelope pagination (total_count, has_more) and the owner_user_id filter narrows results to that owner's vessels."
        test_recipe:
          setup: ["Two vessels registered, one owned by owner-1 and one by owner-2"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV One", owner_name: "O 1", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v1: $.data.id } }
            - { call: "POST /yard/vessels", payload: { name: "MV Two", owner_name: "O 2", owner_user_id: "owner-2", loa_ft: 32, beam_ft: 11, hull_type: "SAIL", displacement_tons: 12 }, as: ServiceWriter, captures: { v2: $.data.id } }
          trigger:
            - { call: "GET /yard/vessels", payload: { limit: 1 }, as: ServiceWriter }
            - { call: "GET /yard/vessels", payload: { owner_user_id: "owner-2" }, as: ServiceWriter, captures: { only_id: "$.data[0].id" } }
          assert:
            - "limit=1 response carries total_count == 2 and has_more == true in the pagination envelope"
            - "owner filter returns exactly the owner-2 vessel ${v2}"

      - name: vessel_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Vessel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent vessel id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /yard/vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

      - name: vessel_missing_required_loa_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Vessel.fields.loa_ft, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input loa_ft rejects creation with ERR_VALIDATION (400); no vessel is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /yard/vessels", payload: { name: "MV Bad", owner_name: "O B", owner_user_id: "owner-1", beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_VALIDATION"

      - name: job_system_status_input_ignored
        claim_type: system_fields
        grounds: [entities.RefitJob.fields.status]
        distinguishing_aspect: "A client-supplied status field on creation is ignored: the job is always born DRAFT."
        test_recipe:
          setup: ["Vessel registered"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Sys", owner_name: "O S", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}", status: "COMPLETE" }, as: ServiceWriter, captures: { st: $.data.status } }
          assert:
            - "job created with status == DRAFT regardless of the smuggled status input"

      - name: work_order_created_in_estimate
        claim_type: creation
        grounds: [state_machines.WorkOrder, entities.WorkOrder]
        distinguishing_aspect: "A new work order starts in ESTIMATE with revision 0 and computed quoted_total_cents == round(quoted_hours x rate) + parts."
        test_recipe:
          setup: ["Vessel with a DRAFT job"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Est", owner_name: "O E", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
          trigger:
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "RIGGING", description: "Standing rigging", quoted_hours: 2.5, quoted_rate_cents: 9001, quoted_parts_cents: 100 }, as: ServiceWriter, captures: { st: $.data.status, rev: $.data.revision, qt: $.data.quoted_total_cents } }
          assert:
            - "status == ESTIMATE and revision == 0"
            - "quoted_total_cents == 22603 (round_half_up(2.5 x 9001) = 22503 + 100 parts)"

      - name: labor_entry_immutable_no_version
        claim_type: immutability
        grounds: [entities.LaborEntry]
        distinguishing_aspect: "LaborEntry has common_fields false: creation response carries id and created_at but no version / updated_at fields (append-only log)."
        test_recipe:
          setup:
            - "Job ON_HARD with an IN_PROGRESS MECHANICAL work order"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Imm", owner_name: "O I", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PI1", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "I", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 2, quoted_rate_cents: 8000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "YARD_CREW", hours: 1, rate_cents: 8000 }, as: ServiceWriter, captures: { le_id: $.data.id, le_cost: $.data.line_cost_cents } }
          assert:
            - "response carries id and created_at and line_cost_cents == 8000"
            - "response has no version field (common_fields false — append-only)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: work_order_complete_from_estimate_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST complete on a work order still in ESTIMATE is not a declared transition: ERR_INVALID_STATE, no status change, no charge posted."
        test_recipe:
          setup: ["Vessel with DRAFT job and one ESTIMATE work order"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV BadTrans", owner_name: "O B", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "ELECTRICAL", description: "Panel", quoted_hours: 2, quoted_rate_cents: 9000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_INVALID_STATE"
            - "work order remains ESTIMATE and no LABOR charge is created"

      - name: submit_on_cancelled_job_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RefitJob, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: a subsequent submit returns ERR_ALREADY_TERMINAL (distinct from ERR_INVALID_STATE for non-terminal wrong-state)."
        test_recipe:
          setup: ["Vessel with a job cancelled while still DRAFT"]
          setup_api_calls:
            - { call: "POST /yard/vessels", payload: { name: "MV Term", owner_name: "O T", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/cancel", payload: { reason: "Owner walked away" }, as: ServiceWriter, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter, captures: { err: $.data.error_id } }
          assert:
            - "cancel moved the job to CANCELLED"
            - "submit on the cancelled job returns 409 ERR_ALREADY_TERMINAL"

      - name: slot_complete_outside_window_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.LiftSlot.BOOKED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a BOOKED slot after its scheduled window (no daily close run, so it is not yet NO_SHOW) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Job HAUL_SCHEDULED with a BOOKED HAUL_OUT slot 2026-08-02T08:00-09:00; clock at 2026-08-02T10:00 (window passed)"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Late2", owner_name: "O L", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "POWER", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PL2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: YardManager }
          trigger:
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_INVALID_STATE (current time outside [scheduled_start, scheduled_end])"

      - name: no_show_reverts_job_to_intake
        claim_type: side_effect_execution
        grounds: [state_machines.LiftSlot.BOOKED_to_NO_SHOW, state_machines.RefitJob.HAUL_SCHEDULED_to_INTAKE]
        distinguishing_aspect: "Daily close past a BOOKED HAUL_OUT slot's window marks it NO_SHOW and reverts the job HAUL_SCHEDULED -> INTAKE so a new slot can be booked."
        test_recipe:
          setup: ["Job HAUL_SCHEDULED with BOOKED slot 2026-08-02T08:00-09:00; clock advanced to 2026-08-03; daily close executed"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV NoShow", owner_name: "O N", owner_user_id: "owner-1", loa_ft: 30, beam_ft: 10, hull_type: "SAIL", displacement_tons: 10 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PN2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 10 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: YardManager }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager }
          trigger:
            - { call: "GET /yard/refit-jobs/${j_id}/lift-slots", payload: {}, as: YardManager, captures: { slot_status: "$.data[0].status" } }
            - { call: "GET /yard/refit-jobs/${j_id}", payload: {}, as: YardManager, captures: { job_status: $.data.status } }
          assert:
            - "slot ${slot_id} status == NO_SHOW"
            - "job status reverted to INTAKE (rebooking loop)"

      - name: splash_completion_releases_stand_assignment
        claim_type: side_effect_execution
        grounds: [state_machines.RefitJob.READY_FOR_SPLASH_to_AWAITING_TRIAL, state_machines.StandAssignment.ACTIVE_to_RELEASED]
        distinguishing_aspect: "Completing the SPLASH slot releases the job's ACTIVE stand assignment: stands_in_use on the row returns to 0 and the assignment is RELEASED."
        test_recipe:
          setup:
            - "Job READY_FOR_SPLASH (one COMPLETE work order, quoted 85000), deposit 21250 posted, SPLASH slot booked 2026-08-20"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Splash", owner_name: "O S", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PS3", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "SP", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager, captures: { sa_id: $.data.id } }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "DEPOSIT", amount_cents: 21250 }, as: Accountant }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "SPLASH", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { splash_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:30:00Z" }, as: YardManager }
          trigger:
            - { call: "POST /yard/lift-slots/${splash_id}/complete", payload: {}, as: YardManager, captures: { slot_status: $.data.status } }
            - { call: "GET /yard/stand-assignments/${sa_id}", payload: {}, as: YardManager, captures: { sa_status: $.data.status } }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { in_use: $.data.stands_in_use } }
          assert:
            - "splash slot COMPLETED and job becomes AWAITING_TRIAL"
            - "stand assignment ${sa_id} status == RELEASED"
            - "row stands_in_use == 0 (4 stands freed by the splash)"

      - name: manual_hold_revokes_and_restores_readiness
        claim_type: side_effect_execution
        grounds: [state_machines.ComplianceHold, state_machines.RefitJob.READY_FOR_SPLASH_to_WORK_IN_PROGRESS]
        distinguishing_aspect: "A MANUAL PAYMENT hold on a READY job revokes readiness (job -> WORK_IN_PROGRESS, BOOKED splash slot CANCELLED); releasing it restores READY_FOR_SPLASH — but the cancelled slot stays CANCELLED (one-way compensation)."
        test_recipe:
          setup:
            - "Job READY_FOR_SPLASH with BOOKED SPLASH slot and deposit posted"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Hold", owner_name: "O H", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PH", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "H", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "DEPOSIT", amount_cents: 21250 }, as: Accountant }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "SPLASH", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { splash_id: $.data.id } }
          trigger:
            - { call: "POST /yard/compliance-holds", payload: { job_id: "${j_id}", kind: "PAYMENT", note: "Invoice dispute" }, as: Accountant, captures: { hold_id: $.data.id, hold_src: $.data.source } }
