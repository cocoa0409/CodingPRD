      - name: recovery_basis_is_selected_at_creation_and_reselected_on_renegotiate
        claim_type: Variant Selection
        grounds:
          - calculations.repayment_recovery_basis
          - entities.WageRepayment.fields.recovery_basis
          - state_machines.WageRepayment.AGREED_to_PROPOSED
        distinguishing_aspect: "recovery_basis is never supplied by the client: it is derived from the recovery_tax_year / overpayment_tax_year threshold at creation (equal years -> SAME_YEAR_NET, 309400 due) and re-derived when a renegotiation moves recovery into the following year (-> PRIOR_YEAR_GROSS, 400000 due), which also clears installment_count."
        test_recipe:
          setup:
            - "An employer, a federal agency, employee Dana and an OPEN 2025 Q1 correction case."
            - "A wage repayment of 400000 gross / 60000 income tax / 30600 social insurance for overpayment year 2025 recovered in 2025, agreed by the employee over 4 installments."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /wage-repayments"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", overpaid_gross_cents: 400000, overpaid_income_tax_withheld_cents: 60000, overpaid_fica_withheld_cents: 30600, overpayment_tax_year: 2025, recovery_tax_year: 2025, installment_count: 4 }
              as: PayrollAnalyst
              captures: { rp_id: "$.data.id" }
            - call: "POST /wage-repayments/${rp_id}/agree"
              payload: {}
              as: EmployeeSelfService
              as_user_id: "${e1_id}"
          trigger:
            - call: "POST /wage-repayments/${rp_id}/renegotiate"
              payload: { recovery_tax_year: 2026 }
              as: PayrollAnalyst
          assert:
            - "before the trigger the row carried recovery_basis == SAME_YEAR_NET with employee_due_cents 309400 and agency_recoverable_cents 90600"
            - "HTTP status is 200"
            - "WageRepayment.${rp_id}.recovery_basis == PRIOR_YEAR_GROSS"
            - "WageRepayment.${rp_id}.employee_due_cents == 400000"
            - "WageRepayment.${rp_id}.agency_recoverable_cents == 30600"
            - "WageRepayment.${rp_id}.status == PROPOSED"
            - "WageRepayment.${rp_id}.installment_count == null"
            - "WageRepayment.${rp_id}.collected_cents == 0"

      - name: interest_variant_pair_diverges_on_identical_inputs
        claim_type: Variant Divergence
        grounds:
          - calculations.amendment_interest_accrual.variants
        excluded_because:
          difficulty_instance: interest_statutory_daily_variant_on_federal_amendment
          rationale: "That §1.8 instance and its DEPOSIT_WEIGHTED twin assert 20000 versus 34833 cents on the same 250000-cent delta, which is the variant-divergence claim with the delta already pinned."

      - name: deposit_weighted_interest_rounds_each_tranche_before_summing
        claim_type: Precision
        grounds:
          - calculations.amendment_interest_accrual.precision
        excluded_because:
          difficulty_instance: interest_deposit_weighted_variant_diverges_on_state_amendment
          rationale: "That §1.8 instance's 34833-cent expectation is only reachable when each tranche's interest is rounded ROUND_HALF_UP before summation, so it already pins the precision rule."

      - name: apportionment_weights_do_not_drift_across_lines
        claim_type: weighted_scoring
        grounds:
          - calculations.jurisdiction_wage_apportionment
        excluded_because:
          difficulty_instance: apportionment_rounds_per_line_before_summation
          rationale: "That §1.8 instance contrasts the pinned per-line rounding with the forbidden sum-then-round order on the same lines, covering both the weighting and the accumulated-drift claim."

      - name: failure_to_deposit_tier_boundaries_are_exact
        claim_type: tiered_pricing
        grounds:
          - calculations.amendment_penalty_assessment.constants.FTD_TIER_BPS
        excluded_because:
          difficulty_instance: ftd_tier_flips_between_five_and_six_days_late
          rationale: "That §1.8 instance sits on the 5-versus-6-day tier edge and asserts both penalty values, which is the tier-boundary claim for this ladder."

      - name: penalty_step_order_is_floor_then_multiplier_then_reduction
        claim_type: Constants Applied ordering
        grounds:
          - calculations.amendment_penalty_assessment.formula
        excluded_because:
          difficulty_instance: penalty_floor_applied_before_multiplier_and_voluntary_reduction
          rationale: "That §1.8 instance pins the 3 -> 4 -> 5 step order by asserting the cents that only the pinned order can produce, so a separate constants-ordering probe would duplicate it."

      - name: statement_box_projection_replays_the_current_repayment_state
        claim_type: projection
        grounds:
          - calculations.statement_box_deltas
        excluded_because:
          difficulty_instance: statement_box_deltas_depend_on_repayment_reaching_collected
          rationale: "That §1.8 instance replays the box projection before and after the repayment reaches COLLECTED, which is the late-event replay claim for this projection."

      - name: waiver_propagation_reaches_a_fixed_point_without_re_tiering
        claim_type: constraint_propagation
        grounds:
          - calculations.abatement_penalty_waiver.formula
        excluded_because:
          difficulty_instance: de_minimis_sweep_runs_once_without_re_tiering_waiver
          rationale: "That §1.8 instance asserts the sweep fires exactly once and that the tier key stays the pre-waiver gross, which is the fixed-point and no-infinite-loop claim."

      - name: recovery_basis_variant_switch_restates_the_amounts_owed
        claim_type: Reconciliation
        grounds:
          - calculations.repayment_recovery_basis.variants
        excluded_because:
          difficulty_instance: repayment_same_year_net_versus_prior_year_gross_recovery
          rationale: "That §1.8 instance asserts both variant results from identical inputs (309400/90600 versus 400000/30600), so the delta produced by a variant switch is already pinned there."

  - section: validations
    instances:

      - name: repayment_with_recovery_year_before_overpayment_year_returns_invalid_recovery_year
        claim_type: Violation to Error
        grounds:
          - validations.priority_22.ERR_INVALID_RECOVERY_YEAR
        distinguishing_aspect: "Recovery may only happen in the overpayment year or later; a 2024 recovery of a 2025 overpayment is refused at priority 22 with 400 before repayment_recovery_basis is ever evaluated, so no row and no recovery_basis is written."
        test_recipe:
          setup:
            - "An employer, a federal agency, employee Dana and an OPEN 2025 Q1 correction case."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /wage-repayments"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", overpaid_gross_cents: 400000, overpaid_income_tax_withheld_cents: 60000, overpaid_fica_withheld_cents: 30600, overpayment_tax_year: 2025, recovery_tax_year: 2024 }
              as: PayrollAnalyst
          assert:
            - "HTTP status is 400"
            - "response data.error_id == ERR_INVALID_RECOVERY_YEAR"
            - "GET /wage-repayments?correction_case_id=${case_id} returns total_count == 0"

      - name: waiver_request_equal_to_the_assessed_penalty_is_accepted
        claim_type: Satisfaction to Pass
        grounds:
          - validations.priority_82.ERR_WAIVER_EXCEEDS_ASSESSMENT
          - state_machines.AgencyNotice.RECEIVED_to_RESPONSE_DRAFTED
        distinguishing_aspect: "The rule is `may not exceed`, so a request for exactly the assessed 200000 cents sits on the admitted side of the boundary and the draft-response transition proceeds, setting abatement_status REQUESTED and abatement_round 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "A notice assessing 1000000 tax / 200000 penalty / 50000 interest with response_due_date 2026-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, notice_number: "CP-501-90", assessed_tax_cents: 1000000, assessed_penalty_cents: 200000, assessed_interest_cents: 50000, response_due_date: "2026-06-30" }
              as: TaxOfficer
              captures: { notice_id: "$.data.id" }
          trigger:
            - call: "POST /agency-notices/${notice_id}/draft-response"
              payload: { response_narrative: "Reasonable cause narrative attached.", abatement_grounds: "REASONABLE_CAUSE", requested_penalty_waiver_cents: 200000 }
              as: TaxOfficer
          assert:
            - "HTTP status is 200"
            - "AgencyNotice.${notice_id}.response_status == RESPONSE_DRAFTED"
            - "AgencyNotice.${notice_id}.abatement_status == REQUESTED"
            - "AgencyNotice.${notice_id}.requested_penalty_waiver_cents == 200000"
            - "AgencyNotice.${notice_id}.abatement_round == 1"

      - name: notice_response_sent_after_the_due_date_returns_response_overdue
        claim_type: Temporal validation
        grounds:
          - validations.priority_63.ERR_NOTICE_RESPONSE_OVERDUE
          - state_machines.AgencyNotice.RESPONSE_DRAFTED_to_RESPONDED
        distinguishing_aspect: "The deadline is enforced at the moment the response is SENT, not when it is drafted: a draft written inside the window becomes unusable once the logical clock passes response_due_date, and the notice stays in RESPONSE_DRAFTED with responded_at null."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z; a notice with response_due_date 2026-05-15 whose response has been drafted."
            - "The clock is then advanced to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /agency-notices"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, notice_number: "CP-2100-A-4", assessed_tax_cents: 500000, assessed_penalty_cents: 100000, assessed_interest_cents: 25000, response_due_date: "2026-05-15" }
              as: TaxOfficer
              captures: { notice_id: "$.data.id" }
            - call: "POST /agency-notices/${notice_id}/draft-response"
              payload: { response_narrative: "Amended returns for the quarter are attached.", abatement_grounds: "REASONABLE_CAUSE", requested_penalty_waiver_cents: 100000 }
              as: TaxOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agency-notices/${notice_id}/respond"
              payload: {}
              as: TaxOfficer
          assert:
            - "HTTP status is 422"
            - "response data.error_id == ERR_NOTICE_RESPONSE_OVERDUE"
            - "AgencyNotice.${notice_id}.response_status == RESPONSE_DRAFTED"
            - "AgencyNotice.${notice_id}.responded_at == null"
            - "AgencyNotice.${notice_id}.abatement_status == REQUESTED (the drafted request survives)"

      - name: registration_gate_applies_only_when_the_agency_requires_registration
        claim_type: Conditional validation
        grounds:
          - validations.priority_51.ERR_AGENCY_ACCOUNT_NOT_ACTIVE
          - entities.TaxAgency.fields.requires_registration
        distinguishing_aspect: "The rule is config-conditional: against a FEDERAL agency with requires_registration false the DRAFT -> PREPARED transition succeeds with ZERO AgencyAccount rows in the database, which is the other half of the coverage check that the §1.8 instance exercises positively."
        test_recipe:
          setup:
