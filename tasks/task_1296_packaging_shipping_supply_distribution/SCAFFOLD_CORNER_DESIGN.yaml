              payload: {}
              as: WarehouseOps
          trigger:
            - call: "POST /packaging-distribution/orders/${o_a}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct}"
              captures: { st_a: $.data.status, inv_a: $.data.invoice_status }
            - call: "GET /packaging-distribution/custom-print-jobs"
              payload: { order_line_id: "${l_a}" }
              as: PlatformAdmin
              captures: { job_a_status: "$.data[0].status" }
            - call: "POST /packaging-distribution/orders/${o_b}/cancel"
