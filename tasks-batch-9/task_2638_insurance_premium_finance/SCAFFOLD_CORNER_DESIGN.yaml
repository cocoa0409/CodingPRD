            - "before the reopen both rows are live: ${im_before_1_sup} == false and ${im_before_2_sup} == false, total_count == 2"
            - "${im_reopened_status} == 'PENDING_VERIFICATION' and ${im_reopened_reason} is null"
            - "after the reopen the rows are SUPERSEDED, not deleted or edited: total_count is still 2, ${im_after_1_sup} == true and ${im_after_2_sup} == true"
