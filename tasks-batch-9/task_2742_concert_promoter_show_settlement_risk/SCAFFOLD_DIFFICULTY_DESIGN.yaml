            - "STEP 0 baseline — TicketTier.${q_tt_id}: allocation_qty 1000, sold_qty 400, comp_qty 0, held_qty 0, available_qty 600; 400 + 0 + 0 + 600 == 1000"
            - "STEP 1 create PRODUCTION_HOLD 120 — held_qty 120, available_qty 480, comp_qty 0, sold_qty 400; 400 + 0 + 120 + 480 == 1000; Show.${q_sh_id}.held_tickets == 120"
            - "STEP 2 create COMP 25 — comp_qty 25, held_qty 120, available_qty 455; 400 + 25 + 120 + 455 == 1000; a COMP hold consumes available_qty exactly like any other hold but is counted in comp_qty, never in held_qty; Show.${q_sh_id}.comp_tickets_issued == 25 and held_tickets == 120"
            - "STEP 3 release the PRODUCTION_HOLD — TicketHold.${q_h_prod_id}.status == RELEASED, held_qty 0, available_qty 575, comp_qty still 25; 400 + 25 + 0 + 575 == 1000 — the exact inverse of step 1, with available_qty back up by precisely 120"
            - "STEP 4 create ARTIST_HOLD 5 — held_qty 5, available_qty 570, comp_qty 25; 400 + 25 + 5 + 570 == 1000"
            - "STEP 5 convert-to-comp — TicketHold.${q_h_art_id}.status == CONVERTED and kind == COMP; held_qty 0, comp_qty 30, available_qty UNCHANGED at 570; 400 + 30 + 0 + 570 == 1000. This is the reclassification edge: 5 tickets moved from held to comp with no movement in available"
            - "STEP 5 — Show.${q_sh_id}.comp_tickets_issued == 30 and held_tickets == 0"
            - "STEP 6 allowance boundary — ${q_comp_over_error} == ERR_COMP_ALLOWANCE_EXCEEDED: comps_after would be 31 against comp_allowance_qty 30, which proves the CONVERTED hold is still counted as a comp; the tier is unchanged at 400 + 30 + 0 + 570 == 1000 and no TicketHold row was created"
            - "STEP 7 release the COMP hold — TicketHold.${q_h_comp_id}.status == RELEASED, comp_qty 5 (only the CONVERTED hold survives, per the comp_qty definition '(kind == COMP AND status == HELD) OR status == CONVERTED'), available_qty 595; 400 + 5 + 0 + 595 == 1000"
            - "STEP 8 create ARTIST_HOLD 40 — held_qty 40, available_qty 555, comp_qty 5; 400 + 5 + 40 + 555 == 1000"
            - "STEP 9 expiry via POST /_ops/run at the clock 2026-09-10T00:00:00Z — TicketHold.${q_h_exp_id}.status == EXPIRED (expires_at <= clock_now, inclusive), held_qty 0, available_qty 595, comp_qty 5; 400 + 5 + 0 + 595 == 1000, byte-identical to the STEP 7 state, so expiry is the same exact inverse that release is"
            - "STEP 9 — TicketHold.${q_h_art_id}.status is still CONVERTED and was NOT expired even though its expires_at (2026-09-01T00:00:00Z) is also in the past, because the HELD -> EXPIRED transition requires status == HELD"
            - "NO DRIFT — the tier's allocation_qty is 1000 at every one of the ten observations and sold_qty never moves off 400: not one of the six hold movements touched sold inventory"
