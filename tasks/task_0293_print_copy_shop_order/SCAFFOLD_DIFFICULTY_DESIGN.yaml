  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_booking_overlap_with_cleanup_buffer
        grounds:
          - calculations.press_overlap_check
          - validations[priority=12]
          - entities.PressBooking.fields.start_utc
          - entities.PressBooking.fields.end_utc
        distinguishing_aspect: |
          Resource = Press; interval semantics = half-open [start,end) with a TRAILING
          cleanup buffer extending the occupied tail. A booking starting 11:15 against
          a prior [10:00,11:00) with 30m buffer (occupied until 11:30) overlaps ->
          ERR_PRESS_DOUBLE_BOOKED. Buffer-extended adjacency distinguishes this from
          the pure-capacity overlap below.
        test_recipe:
          setup:
            - "Press cleanup_buffer 30; CONFIRMED booking [10:00,11:00) on a BANNER line."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Overlap Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "o@x.com", name: "Ola" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Vinyl Banner", category: "BANNER", base_unit_price_cents: 5000, unit_size: 2, requires_proof: false, requires_press: true }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /presses"
              payload: { shop_id: "${shop_id}", name: "Press C", cleanup_buffer_minutes: 30 }
              as: ShopStaff
              captures: { press_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line1_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line2_id: $.data.id }
            - call: "POST /press-bookings"
              payload: { press_id: "${press_id}", order_line_id: "${line1_id}", start_utc: "2026-06-02T10:00:00Z", end_utc: "2026-06-02T11:00:00Z" }
              as: ProductionOperator
              captures: { booking1_id: $.data.id }
          trigger:
            - call: "POST /press-bookings"
              payload: { press_id: "${press_id}", order_line_id: "${line2_id}", start_utc: "2026-06-02T11:15:00Z", end_utc: "2026-06-02T12:15:00Z" }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_PRESS_DOUBLE_BOOKED (11:15 falls inside [10:00, 11:30) buffer-extended window)"

      - name: daily_capacity_aggregate_overlap_on_production_date
        grounds:
          - calculations.daily_capacity_check
          - validations[priority=14]
          - entities.CapacityReservation.fields.production_date
          - entities.CapacityReservation.fields.units
        distinguishing_aspect: |
          Resource = Shop daily capacity; interval semantics = AGGREGATE-CAPACITY on a
          discrete production_date (sum of HELD units <= daily_unit_capacity), not a
          pairwise time-interval. Two confirmed orders summing 6+5=11 units on the same
          date with capacity 10 -> the second confirm is ERR_CAPACITY_EXCEEDED. Distinct
          interval arithmetic from the pairwise press buffer overlap.
        test_recipe:
          setup:
            - "Shop daily_unit_capacity 10. Order A confirmed with 6 units on 2026-06-04. Order B has a preflight-OK line of 5 units, same STANDARD promised date."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Agg Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 10 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "p1@x.com", name: "Pat1" }
              as: ShopStaff
              captures: { cust1: $.data.id }
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "p2@x.com", name: "Pat2" }
              as: ShopStaff
              captures: { cust2: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "BW Copy", category: "COPIES", base_unit_price_cents: 500, unit_size: 1, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust1}" }
              as: Customer
              as_user_id: "${cust1}"
              captures: { order1_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order1_id}", product_id: "${prod_id}", quantity: 6 }
              as: Customer
              as_user_id: "${cust1}"
              captures: { line1_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line1_id}", file_name: "p1.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust1}"
              captures: { art1_id: $.data.id }
            - call: "POST /artworks/${art1_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order1_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust1}"
            - call: "GET /orders/${order1_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust1}"
              captures: { o1v: $.data.version }
            - call: "POST /orders/${order1_id}/confirm"
              payload: { expected_order_version: "${o1v}" }
              as: Customer
              as_user_id: "${cust1}"
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust2}" }
              as: Customer
              as_user_id: "${cust2}"
              captures: { order2_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order2_id}", product_id: "${prod_id}", quantity: 5 }
              as: Customer
              as_user_id: "${cust2}"
              captures: { line2_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line2_id}", file_name: "p2.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust2}"
              captures: { art2_id: $.data.id }
            - call: "POST /artworks/${art2_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order2_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust2}"
            - call: "GET /orders/${order2_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust2}"
              captures: { o2v: $.data.version }
          trigger:
            - call: "POST /orders/${order2_id}/confirm"
              payload: { expected_order_version: "${o2v}" }
              as: Customer
              as_user_id: "${cust2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_CAPACITY_EXCEEDED (held 6 + requested 5 = 11 > capacity 10 on 2026-06-04)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: capacity_units_conserved_under_confirm_then_cancel
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.DRAFT_to_CANCELLED
          - state_machines.CapacityReservation.HELD_to_RELEASED
          - calculations.daily_capacity_check
        distinguishing_aspect: |
          Conserved quantity = available daily capacity units = daily_unit_capacity
          minus sum(HELD units). Confirm (forward) holds 10 units; cancel (compensating)
          releases them. Invariant: available units after confirm+cancel == available
          before confirm (10), so a fresh order can re-claim the full day.
        test_recipe:
          setup:
            - "Shop daily_unit_capacity 10. One order with a line of 10 units, preflight PASSED, fulfillment present, confirmed (capacity fully held)."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Conserve Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 10 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "q@x.com", name: "Qi" }
              as: ShopStaff
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "BW Copy", category: "COPIES", base_unit_price_cents: 500, unit_size: 1, requires_proof: false, requires_press: false }
              as: ShopStaff
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", product_id: "${prod_id}", quantity: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /artworks"
              payload: { order_line_id: "${line_id}", file_name: "q.pdf", page_count: 1, dpi: 600, bleed_mm: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/preflight"
              payload: {}
              as: ProductionOperator
            - call: "POST /fulfillments"
              payload: { order_id: "${order_id}", method: "PICKUP", ship_fee_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v2: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: { expected_order_version: "${ord_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.production_status == CANCELLED"
            - "Sum of HELD CapacityReservation.units for shop ${shop_id} on 2026-06-04 == 0 (all released; full 10 units available again)"

      - name: lifetime_paid_conserved_under_pay_then_refund
        grounds:
          - state_machines.Order.INVOICED_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Customer.fields.lifetime_paid_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.lifetime_paid_cents (a DIFFERENT conserved
          quantity from capacity units). Pay (forward) adds total_cents; refund
          (compensating) subtracts the same total_cents. Invariant: lifetime_paid_cents
          after pay+refund == its pre-pay value (0).
        test_recipe:
          setup:
            - "Order confirmed, invoiced, paid (lifetime_paid_cents bumped by total), then production cancelled so a refund is allowed."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Refund Shop", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 100 }
              as: ShopStaff
              captures: { shop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: ShopStaff
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", email: "r@x.com", name: "Ravi" }
