        - name: absorbing_untagged_spend_with_no_in_period_candidate_is_rejected
          claim_type: Violation → Error
          grounds: "§1.4 priority 78 ERR_UNTAGGED_ABSORB_EMPTY (422): at least one matching UNALLOCATED untagged CostRecord must lie inside the run period."
          distinguishing_aspect: "The named record exists, is untagged and is UNALLOCATED — it simply sits in June while the run covers July, so the emptiness is a period-scoping outcome rather than a missing row."
          test_recipe:
            setup:
