  - rule_id: resource_temporal_overlap
    instances:
      - name: tug_window_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_TUG_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource Tug with strict half-open interval semantics: a new assignment starting
          EXACTLY at the previous assignment's end (10:00 == 10:00) is allowed (adjacent, no
          overlap), while 09:30 overlaps and is rejected. No buffer is applied to tugs.
        test_recipe:
          setup:
            - "Job 1 (08:00-10:00) holds assignment A1 on tug Atlas 08:00-10:00 (PROPOSED suffices for the conflict set)"
            - "Job 2 (10:00-12:00) and job 3 (09:30-11:00) both target the same tug"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id, j1v: $.data.version }
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_a}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z", expected_job_order_version: "${j1v}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job2: $.data.id, j2v: $.data.version }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T09:30:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job3: $.data.id, j3v: $.data.version }
          trigger:
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job2}", tug_id: "${tug_a}", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z", expected_job_order_version: "${j2v}" }
              as: PortDispatcher
              captures: { asg2: $.data.id, asg2_status: $.data.status }
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job3}", tug_id: "${tug_a}", window_start: "2026-06-01T09:30:00Z", window_end: "2026-06-01T11:00:00Z", expected_job_order_version: "${j3v}" }
              as: PortDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent assignment (10:00 == prior end 10:00) is ACCEPTED: TugAssignment.${asg2}.status == PROPOSED"
            - "Overlapping assignment (09:30 < 10:00) is rejected with error_id == ERR_TUG_WINDOW_CONFLICT (HTTP 409)"

      - name: pilot_turnaround_buffer_gap_semantics
        grounds:
          - validations[priority=14]
          - errors[ERR_PILOT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource Pilot with BUFFERED interval semantics (different from the tug's strict
          half-open adjacency): a new booking starting exactly 60 minutes after the prior
          booking's end is allowed, but 30 minutes of gap is rejected even though the raw
          windows do not overlap.
        test_recipe:
          setup:
            - "Booking B1 for pilot Reyes 08:00-10:00 on job 1"
            - "Job 2 books the same pilot 11:00-12:00 (gap exactly 60 minutes -> allowed)"
            - "Job 3 books the same pilot 10:30-11:30 (gap 30 minutes after B1 -> rejected)"
          setup_api_calls:
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job2: $.data.id }
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T10:30:00Z", scheduled_end: "2026-06-01T11:30:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job3: $.data.id }
          trigger:
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job2}", pilot_id: "${p1}", window_start: "2026-06-01T11:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: PortDispatcher
              captures: { pb2: $.data.id, pb2_status: $.data.status }
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job3}", pilot_id: "${p1}", window_start: "2026-06-01T10:30:00Z", window_end: "2026-06-01T11:30:00Z" }
              as: PortDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Gap of exactly 60 minutes (11:00 == 10:00 + 60) is ACCEPTED: PilotBooking.${pb2}.status == REQUESTED"
            - "Gap of 30 minutes (10:30 < 10:00 + 60) is rejected with error_id == ERR_PILOT_WINDOW_CONFLICT (HTTP 409) despite no raw overlap"

  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_tug_and_pilot_commitment_counts
        grounds:
          - state_machines.JobOrder.CONFIRMED_to_CANCELLED
          - state_machines.TugAssignment.CONFIRMED_to_RELEASED
          - state_machines.PilotBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = resource commitment counts: for the tug, the number of
          TugAssignments with status IN {PROPOSED, CONFIRMED, ACTIVE}; for the pilot, the
          number of PilotBookings with status IN {REQUESTED, CONFIRMED, BOARDED}. The
          confirm pair (assignment confirm + booking confirm) followed by its compensating
          action (job cancel) returns both counts to their pre-confirm value 0.
        test_recipe:
          setup:
            - "Job CONFIRMED with one CONFIRMED assignment on tug Atlas and one CONFIRMED booking on pilot Reyes"
            - "Before the job: 0 non-terminal assignments on the tug, 0 non-terminal bookings on the pilot"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { job_v2: $.data.version }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_a}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z", expected_job_order_version: "${job_v2}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "POST /api/tug-assignments/${asg1}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_a}"
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
          trigger:
            - call: "POST /api/job-orders/${job1}/cancel"
              payload: { cancel_reason: "Berth unavailable" }
              as: PortDispatcher
            - call: "GET /api/tug-assignments/${asg1}"
              payload: {}
              as: PortDispatcher
              captures: { asg_after: $.data.status }
            - call: "GET /api/pilot-bookings/${pb1}"
              payload: {}
              as: PortDispatcher
              captures: { pb_after: $.data.status }
            - call: "GET /api/job-orders/${job1}"
              payload: {}
              as: PortDispatcher
              captures: { job_after: $.data.status }
          assert:
            - "JobOrder.${job1}.status == CANCELLED"
            - "TugAssignment.${asg1}.status == RELEASED (terminal) — tug's non-terminal assignment count returns to 0"
            - "PilotBooking.${pb1}.status == CANCELLED (terminal) — pilot's non-terminal booking count returns to 0"
            - "Invariant: count(TugAssignment of tug ${tug_a} with status IN {PROPOSED, CONFIRMED, ACTIVE}) == 0 after cancel, equal to its pre-confirm value"

      - name: finalize_then_void_restores_vessel_outstanding
        grounds:
          - state_machines.Invoice.PROVISIONAL_to_FINALIZED
          - state_machines.Invoice.FINALIZED_to_VOID
          - calculations.vessel_outstanding
        distinguishing_aspect: |
          Conserved quantity = Vessel.outstanding_billed_cents (a fiscal ledger quantity,
          different from the resource commitment counts of the other instance): the
          forward pair (complete creates the invoice, finalize keeps it counted) followed by
          the compensating void returns outstanding_billed_cents to exactly 0.
        test_recipe:
          setup:
            - "Job completed on schedule (clock 2026-06-01T08:00:00Z at start): provisional invoice 740000, vessel outstanding 740000"
          setup_api_calls:
            - call: "POST /api/tugs"
              payload: { name: "Tug Atlas", bollard_pull_tons: 60.0, horsepower: 5000, hourly_rate_cents: 120000, insured_value_cents: 20000000 }
              as: PortAdmin
              captures: { tug_a: $.data.id }
            - call: "POST /api/vessels"
              payload: { name: "MV Aurora", imo_number: "IMO9074729", deadweight_tonnage: 40000, loa_meters: 180.0 }
              as: PortAdmin
              captures: { v1: $.data.id }
            - call: "POST /api/pilots"
              payload: { name: "Pilot Reyes", license_class: "CLASS_I" }
              as: PortAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/tariff-rates"
              payload: { tariff_code: "TAR-DOCK-01", maneuver_type: "DOCKING", base_fee_cents: 500000, standby_block_rate_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", free_standby_minutes: 30, standby_block_minutes: 15, weather_surcharge_pct: 0 }
              as: PortAdmin
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders"
              payload: { vessel_id: "${v1}", tariff_rate_id: "${t1}", maneuver_type: "DOCKING", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: VesselAgent
              as_user_id: "${v1}"
              captures: { job1: $.data.id }
            - call: "POST /api/job-orders/${job1}/confirm"
              payload: {}
              as: PortDispatcher
              captures: { job_v2: $.data.version }
            - call: "POST /api/gear-inspections"
              payload: { tug_id: "${tug_a}", inspection_item: "TOW_LINE", outcome: "PASSED", inspected_at: "2026-05-01T00:00:00Z", next_due_at: "2026-12-31T00:00:00Z" }
              as: MarineSurveyor
            - call: "POST /api/tug-assignments"
              payload: { job_order_id: "${job1}", tug_id: "${tug_a}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z", expected_job_order_version: "${job_v2}" }
              as: PortDispatcher
              captures: { asg1: $.data.id }
            - call: "POST /api/tug-assignments/${asg1}/confirm"
              payload: {}
              as: TugCaptain
              as_user_id: "${tug_a}"
            - call: "POST /api/pilot-bookings"
              payload: { job_order_id: "${job1}", pilot_id: "${p1}", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T10:00:00Z" }
              as: PortDispatcher
              captures: { pb1: $.data.id }
            - call: "POST /api/pilot-bookings/${pb1}/confirm"
              payload: {}
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /api/job-orders/${job1}/dispatch"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: PortAdmin
            - call: "POST /api/job-orders/${job1}/start"
              payload: {}
              as: PortDispatcher
            - call: "POST /api/job-orders/${job1}/complete"
              payload: {}
              as: PortDispatcher
            - call: "GET /api/vessels/${v1}"
              payload: {}
              as: PortDispatcher
              captures: { outstanding_after_complete: $.data.outstanding_billed_cents }
          trigger:
            - call: "GET /api/invoices"
              payload: { job_order_id: "${job1}" }
              as: PortDispatcher
              captures: { inv1: "$.data[0].id", inv1_v: "$.data[0].version" }
            - call: "POST /api/invoices/${inv1}/finalize"
              payload: { expected_invoice_version: "${inv1_v}" }
              as: PortDispatcher
              captures: { inv_final: $.data.status }
            - call: "POST /api/invoices/${inv1}/void"
              payload: { void_reason: "Billing dispute" }
              as: PortAdmin
              captures: { inv_void: $.data.status }
            - call: "GET /api/vessels/${v1}"
              payload: {}
              as: PortDispatcher
              captures: { outstanding_after_void: $.data.outstanding_billed_cents }
          assert:
            - "Vessel.${v1}.outstanding_billed_cents == 740000 after complete (forward action 1)"
            - "Invoice.${inv1}.status == FINALIZED after finalize (forward action 2; total stays 740000 with zero standby)"
            - "Invoice.${inv1}.status == VOID after void (compensating action)"
            - "Vessel.${v1}.outstanding_billed_cents == 0 after void — invariant restored with zero drift"
