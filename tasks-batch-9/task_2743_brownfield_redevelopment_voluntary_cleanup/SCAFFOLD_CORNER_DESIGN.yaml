            - "Clock advanced to 2026-10-15 and the acquisition recorded once."
          setup_api_calls:
            - *c_clock0
            - *c_redev
            - *c_site
            - *c_clock_acq
            - *c_acq
          trigger:
            - call: "POST /sites/${site_id}/acquisition"
              payload: { acquisition_date: "2026-10-20" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { reacquire_err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == 'ERR_SITE_ALREADY_ACQUIRED'"
            - "Site.${site_id}.acquisition_status == 'ACQUIRED' and acquisition_date == '2026-10-15' (unchanged)"

      - name: plan_approval_cascades_control_approval_and_enrollment_remedy_approved
        claim_type: side_effect_execution
        grounds:
