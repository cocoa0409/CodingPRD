# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_1254_construction_materials_testing_special
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All chains replay from empty-DB; clock default is 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: soil FieldTest vs
  # concrete LabSample)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: soil_proctor_variant_divergence
        grounds:
          - calculations.soil_compaction_evaluation
          - entities.ScopeItem.fields.proctor_method
          - entities.FieldTest.fields.result_details
        distinguishing_aspect: |
          Identical field density (117.7 pcf) is judged by two valid algorithms
          selected by ScopeItem.proctor_method: STANDARD (denominator 124.0,
          threshold 95.0) yields 94.9 and NONCONFORMING, while MODIFIED
          (denominator 127.0, threshold 92.0) yields 92.7 and CONFORMING —
          same measurement, different verdict on the FieldTest domain.
        test_recipe:
          setup:
            - "Project with APPROVED SSI carrying two SOIL_COMPACTION scope items: item_std (proctor_method STANDARD, standard_max_density_pcf 124.0, modified_max_density_pcf 127.0, required_count 1) and item_mod (same densities, proctor_method MODIFIED, required_count 1)"
            - "Technician t1 ACTIVE with SOIL_COMPACTION level 2 certification expiring 2027-01-01"
            - "Two DISPATCHED assignments for t1 on 2026-05-04, one per scope item"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Soil Divergence", permit_number: "P-SOIL-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad standard", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
                  - { test_method: SOIL_COMPACTION, description: "pad modified", required_cert_level: 1, required_count: 1, proctor_method: MODIFIED, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_std: "$.data[0].id", item_mod: "$.data[1].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {tech_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_std}", technician_id: "${tech_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg_std: $.data.id}
            - call: "POST /api/assignments/${asg_std}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_mod}", technician_id: "${tech_id}", work_date: "2026-05-04", start_time: "10:00", end_time: "11:00" }
              as: ProjectManager
              captures: {asg_mod: $.data.id}
            - call: "POST /api/assignments/${asg_mod}/dispatch"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg_std}", measured_values: { field_dry_density_pcf: 117.7 } }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {ft_std_result: $.data.result, ft_std_pct: $.data.result_details}
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg_mod}", measured_values: { field_dry_density_pcf: 117.7 } }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {ft_mod_result: $.data.result, ft_mod_pct: $.data.result_details}
          assert:
            - "FieldTest on item_std: result == NONCONFORMING and result_details.relative_compaction_pct == 94.9 and result_details.threshold_pct == 95.0"
            - "FieldTest on item_mod: result == CONFORMING and result_details.relative_compaction_pct == 92.7 and result_details.threshold_pct == 92.0"
            - "GET /api/ssi-revisions/${ssi_id}/scope-items: item_std.completed_count == 0, item_mod.completed_count == 1 and item_mod.status == SATISFIED"

      - name: concrete_acceptance_variant_divergence
        grounds:
          - calculations.concrete_acceptance_evaluation
          - calculations.concrete_set_average
          - entities.SSIRevision.fields.acceptance_method_concrete
        distinguishing_aspect: |
          Identical cylinder data (a 4300 psi set) is judged on the LabSample
          domain by two variants selected per SSI revision: MOVING_AVERAGE with
          prior sets 4700/4600 yields moving average 4530 >= f'c 4500 and floor
          4000 satisfied -> CONFORMING; INDIVIDUAL_SET judges the same 4300 set
          alone against 4500 -> NONCONFORMING. Same data, different entity
          domain than the soil instance, different verdict.
        test_recipe:
          setup:
            - "Project P1 with APPROVED SSI (MOVING_AVERAGE, specified_fc_psi 4500, one CONCRETE_STRENGTH scope item required_count 3); Project P2 with APPROVED SSI (INDIVIDUAL_SET, specified_fc_psi 4500, one CONCRETE_STRENGTH scope item required_count 1)"
            - "Lab L capacity 10; Technician t1 with CONCRETE_STRENGTH level 2 cert expiring 2027-01-01"
            - "P1: one DISPATCHED assignment with three samples cast 2026-04-01T08:00:00Z age 28, scheduled 2026-04-29, first two broken on time with strengths [4700] and [4600]"
            - "P2: one DISPATCHED assignment with one sample cast 2026-04-01T08:00:00Z age 28, scheduled 2026-04-29"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {tech_id: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "P1 MovingAvg", permit_number: "P-CONC-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {p1_id: $.data.id, p1_v: $.data.version}
            - call: "POST /api/projects/${p1_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4500
                acceptance_method_concrete: MOVING_AVERAGE
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 3 }
              as: ProjectManager
              captures: {ssi1_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi1_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi1_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${p1_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi1_id}/scope-items"
              as: ProjectManager
              captures: {p1_item: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${p1_id}", scope_item_id: "${p1_item}", technician_id: "${tech_id}", work_date: "2026-04-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {p1_asg: $.data.id}
            - call: "POST /api/assignments/${p1_asg}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${p1_asg}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {p1_s1: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${p1_asg}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {p1_s2: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${p1_asg}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {p1_s3: $.data.id}
            - call: "POST /api/lab-samples/${p1_s1}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${p1_s2}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${p1_s3}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${p1_s1}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4700] }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${p1_s2}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4600] }
              as: LabAnalyst
            - call: "POST /api/projects"
              payload: { name: "P2 Individual", permit_number: "P-CONC-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {p2_id: $.data.id, p2_v: $.data.version}
            - call: "POST /api/projects/${p2_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4500
                acceptance_method_concrete: INDIVIDUAL_SET
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "columns", required_cert_level: 1, required_count: 1 }
              as: ProjectManager
              captures: {ssi2_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi2_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi2_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${p2_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi2_id}/scope-items"
              as: ProjectManager
              captures: {p2_item: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${p2_id}", scope_item_id: "${p2_item}", technician_id: "${tech_id}", work_date: "2026-04-01", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {p2_asg: $.data.id}
            - call: "POST /api/assignments/${p2_asg}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${p2_asg}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {p2_s1: $.data.id}
            - call: "POST /api/lab-samples/${p2_s1}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
          trigger:
            - call: "POST /api/lab-samples/${p1_s3}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4300] }
              as: LabAnalyst
              captures: {p1_s3_result: $.data.break_result, p1_s3_avg: $.data.set_average_psi}
            - call: "POST /api/lab-samples/${p2_s1}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4300] }
              as: LabAnalyst
              captures: {p2_s1_result: $.data.break_result, p2_s1_avg: $.data.set_average_psi}
          assert:
            - "P1 third sample: set_average_psi == 4300 and break_result == CONFORMING (moving average of 4700/4600/4300 rounds to 4530 >= 4500; floor 4000 satisfied)"
            - "P2 sample: set_average_psi == 4300 and break_result == NONCONFORMING (4300 < 4500 under INDIVIDUAL_SET)"
            - "GET /api/projects/${p2_id}: open_ncr_count == 1 and compliance_posture == NONCONFORMANCE_OUTSTANDING"
            - "GET /api/projects/${p1_id}: open_ncr_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (b) nested rounding; mode (a)
  # multi-input non-linear threshold)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: concrete_moving_average_nested_rounding
        grounds:
          - calculations.concrete_set_average
          - calculations.concrete_acceptance_evaluation
        distinguishing_aspect: |
          Mode (b) nested rounding: per-set averages are rounded to the 10-psi
          grid FIRST (4206->4210, 4203->4200, 4205->4210), then the moving
          average of the rounded values is rounded again (12620/3=4206.67 ->
          4210 >= f'c 4205 CONFORMING). The opposite order (sum raw then round
          once: 12614/3=4204.67 -> 4200 < 4205) yields NONCONFORMING — the
          scaffold pins per-set-first and the verdict flips on the order.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (MOVING_AVERAGE, specified_fc_psi 4205, one CONCRETE_STRENGTH item required_count 3)"
            - "Lab L capacity 10; certified technician; one DISPATCHED assignment with three samples cast 2026-04-01T08:00:00Z age 28, scheduled 2026-04-29"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {tech_id: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "Rounding", permit_number: "P-RND-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4205
                acceptance_method_concrete: MOVING_AVERAGE
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "slab", required_cert_level: 1, required_count: 3 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${tech_id}", work_date: "2026-04-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {s1: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {s2: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: {s3: $.data.id}
            - call: "POST /api/lab-samples/${s1}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${s2}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${s3}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
          trigger:
            - call: "POST /api/lab-samples/${s1}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4206] }
              as: LabAnalyst
              captures: {s1_avg: $.data.set_average_psi}
            - call: "POST /api/lab-samples/${s2}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4203] }
              as: LabAnalyst
              captures: {s2_avg: $.data.set_average_psi}
            - call: "POST /api/lab-samples/${s3}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [4205] }
              as: LabAnalyst
              captures: {s3_avg: $.data.set_average_psi, s3_result: $.data.break_result}
          assert:
            - "s1.set_average_psi == 4210 (4206 rounded to nearest 10)"
            - "s2.set_average_psi == 4200 (4203 rounded down)"
            - "s3.set_average_psi == 4210 (4205 half-up rounds to 4210)"
            - "s3.break_result == CONFORMING (moving average of rounded sets 4210/4200/4210 = 4206.67 -> 4210 >= 4205; sum-then-round would give 4200 and fail)"

      - name: ncr_escalation_threshold_crossing
        grounds:
          - calculations.ncr_escalation_score
          - state_machines.NonconformanceReport.OPEN_to_ESCALATED
          - entities.NonconformanceReport.fields.escalation_score
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: score = min(100, BASE[severity]
          + 2*days_open + 3*days_past_deadline + 15*rejection_count) with a
          STRUCTURAL short-circuit branch. A MINOR NCR (base 20) with 10 days
          open, 0 days overdue and 2 rejections scores exactly 70 and escalates
          on the >= threshold; at 9 days open the same NCR scores 68 and stays
          OPEN.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (fc 4000, CONCRETE_STRENGTH item required_count 1); lab; technicians t1 (caster) and t2 (verifier)"
            - "A MINOR NCR detected 2026-05-30 (28-day sample cast 2026-05-01T08:00, due 2026-05-29T08:00, broken 2026-05-30T09:00 = 25h late > 24h tolerance; strength [5000] conforming so only the tolerance NCR); deadline 2026-06-29"
            - "NCR rejected twice via correction cycle (rejection_count == 2), currently OPEN"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech Two", employee_code: "T2" }
              as: AgencyAdmin
              captures: {t2_id: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "Escalation", permit_number: "P-ESC-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 1 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {samp_id: $.data.id}
            - call: "POST /api/lab-samples/${samp_id}/schedule-break"
              payload: { break_scheduled_date: "2026-05-29" }
              as: LabAnalyst
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /api/lab-samples/${samp_id}/record-break"
              payload: { broken_at: "2026-05-30T09:00:00Z", cylinder_strengths_psi: [5000] }
              as: LabAnalyst
            - call: "GET /api/projects/${proj_id}/ncrs"
              as: ProjectManager
              captures: {ncr_id: "$.data[0].id"}
            - call: "POST /api/ncrs/${ncr_id}/submit-correction"
              payload: { correction_note: "recalibrated break machine" }
              as: Contractor
            - call: "POST /api/ncrs/${ncr_id}/verify"
              payload: { outcome: "REJECTED" }
              as: Technician
              as_user_id: "${t2_id}"
            - call: "POST /api/ncrs/${ncr_id}/submit-correction"
              payload: { correction_note: "replaced cylinders" }
              as: Contractor
            - call: "POST /api/ncrs/${ncr_id}/verify"
              payload: { outcome: "REJECTED" }
              as: Technician
              as_user_id: "${t2_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: AgencyAdmin
              captures: {escalated: $.data.escalated_ncr_ids}
            - call: "GET /api/projects/${proj_id}/ncrs"
              as: ProjectManager
              captures: {ncr_status: "$.data[0].status", ncr_score: "$.data[0].escalation_score"}
          assert:
            - "NCR.${ncr_id}.status == ESCALATED after the sweep (score = 20 + 2*10 + 3*0 + 15*2 = 70 >= 70)"
            - "NCR.${ncr_id}.escalation_score == 70"
            - "NCR.${ncr_id}.rejection_count == 2"
            - "Project.${proj_id}.open_ncr_count == 1 (ESCALATED still counts as open)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (NCR correction cycle; DiscrepancyTicket
  # negotiation cycle — different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ncr_correction_rejection_cycle
        grounds:
          - state_machines.NonconformanceReport.OPEN_to_CORRECTION_SUBMITTED
          - state_machines.NonconformanceReport.CORRECTION_SUBMITTED_to_OPEN
          - state_machines.NonconformanceReport.CORRECTION_SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Cyclic machine on NonconformanceReport: OPEN -> CORRECTION_SUBMITTED
          -> OPEN (rejection, rejection_count 1) -> CORRECTION_SUBMITTED ->
          VERIFIED; the loop is traversable repeatedly and the counter survives
          the cycle.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (SOIL_COMPACTION item, STANDARD, std max 124.0, required_count 1); technician t1 (soil cert), t2 (verifier); a NONCONFORMING soil field test (117.0 pcf -> 94.4 < 95.0) raised one MAJOR NCR by t1"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Cycle", permit_number: "P-CYC-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech Two", employee_code: "T2" }
              as: AgencyAdmin
              captures: {t2_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg_id}", measured_values: { field_dry_density_pcf: 117.0 } }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "GET /api/projects/${proj_id}/ncrs"
              as: ProjectManager
              captures: {ncr_id: "$.data[0].id"}
          trigger:
            - call: "POST /api/ncrs/${ncr_id}/submit-correction"
              payload: { correction_note: "recompact and retest" }
              as: Contractor
              captures: {st1: $.data.status}
            - call: "POST /api/ncrs/${ncr_id}/verify"
              payload: { outcome: "REJECTED" }
              as: Technician
              as_user_id: "${t2_id}"
              captures: {st2: $.data.status, rej: $.data.rejection_count}
            - call: "POST /api/ncrs/${ncr_id}/submit-correction"
              payload: { correction_note: "second correction pass" }
              as: Contractor
            - call: "POST /api/ncrs/${ncr_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Technician
              as_user_id: "${t2_id}"
              captures: {st3: $.data.status, ver_by: $.data.verified_by_technician_id}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {open_cnt: $.data.open_ncr_count}
          assert:
            - "after first submit: NCR.status == CORRECTION_SUBMITTED"
            - "after rejection: NCR.status == OPEN and rejection_count == 1 (cycle back to OPEN)"
            - "after second submit + verify: NCR.status == VERIFIED and verified_by_technician_id == ${t2_id}"
            - "Project.open_ncr_count == 0 after VERIFIED"

      - name: discrepancy_response_reject_cycle
        grounds:
          - state_machines.DiscrepancyTicket.RAISED_to_RESPONSE_SUBMITTED
          - state_machines.DiscrepancyTicket.RESPONSE_SUBMITTED_to_RAISED
          - state_machines.DiscrepancyTicket.RESPONSE_SUBMITTED_to_RESOLVED
        distinguishing_aspect: |
          Cyclic machine on DiscrepancyTicket (different entity than the NCR
          instance): RAISED -> RESPONSE_SUBMITTED -> RAISED (rejected response,
          round_count 2) -> RESPONSE_SUBMITTED -> RESOLVED; round_count
          increments only on the reject edge.
        test_recipe:
          setup:
            - "Project with APPROVED SSI and technician t1 who raises a CONTRACTOR-routed discrepancy"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Discrep", permit_number: "P-DISC-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: WELD_VISUAL, description: "moment frames", required_cert_level: 1, required_count: 1 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: WELD_VISUAL, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/discrepancies"
              payload: { project_id: "${proj_id}", subject: "embed plate mismatch", description: "drawings show 4 studs, field has 3", routed_to: "CONTRACTOR" }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {tick_id: $.data.id}
          trigger:
            - call: "POST /api/discrepancies/${tick_id}/respond"
              payload: { response_text: "will field-verify" }
              as: Contractor
              captures: {st1: $.data.status}
            - call: "POST /api/discrepancies/${tick_id}/resolve"
              payload: { outcome: "REJECT" }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {st2: $.data.status, rc2: $.data.round_count}
            - call: "POST /api/discrepancies/${tick_id}/respond"
              payload: { response_text: "RFI answered, 3 studs per sketch SK-7" }
              as: Contractor
            - call: "POST /api/discrepancies/${tick_id}/resolve"
              payload: { outcome: "ACCEPT" }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {st3: $.data.status, rc3: $.data.round_count}
          assert:
            - "after first respond: status == RESPONSE_SUBMITTED"
            - "after REJECT: status == RAISED and round_count == 2 (cycle back to RAISED)"
            - "after second respond + ACCEPT: status == RESOLVED and round_count == 2 (accept does not increment)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth-3 from record-break; depth-3 from void —
  # different triggering transitions)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: nonconforming_break_cascade_depth3
        grounds:
          - state_machines.LabSample.BREAK_SCHEDULED_to_REPORTED
          - calculations.project_posture_derivation
          - entities.Project.fields.open_ncr_count
          - entities.NonconformanceReport.fields.severity
        distinguishing_aspect: |
          Depth-3 chain from POST record-break: (1) the NONCONFORMING break
          itself creates a NonconformanceReport, (2) that creation increments
          Project.open_ncr_count, (3) the count increment forces the posture
          recompute which flips Project.compliance_posture to
          NONCONFORMANCE_OUTSTANDING. Each hop is caused by the previous one,
          and each hop is independently observable via GET endpoints.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (fc 4000, CONCRETE_STRENGTH item, is_structural false, required_count 1); lab; certified technician t1; DISPATCHED assignment; sample cast 2026-04-01T08:00 age 28 scheduled 2026-04-29"
            - "Before trigger: project.open_ncr_count == 0, compliance_posture == IN_PROGRESS, zero NCRs"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "Cascade A", permit_number: "P-CAS-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 1 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-04-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-04-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {samp_id: $.data.id}
            - call: "POST /api/lab-samples/${samp_id}/schedule-break"
              payload: { break_scheduled_date: "2026-04-29" }
              as: LabAnalyst
          trigger:
            - call: "POST /api/lab-samples/${samp_id}/record-break"
              payload: { broken_at: "2026-04-29T08:00:00Z", cylinder_strengths_psi: [3500] }
              as: LabAnalyst
              captures: {samp_result: $.data.break_result}
            - call: "GET /api/projects/${proj_id}/ncrs"
              as: ProjectManager
              captures: {ncr_id: "$.data[0].id", ncr_sev: "$.data[0].severity", ncr_src: "$.data[0].source_id"}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {cnt: $.data.open_ncr_count, posture: $.data.compliance_posture}
          assert:
            - "LabSample.${samp_id}.break_result == NONCONFORMING (3500 < 4000, INDIVIDUAL floor also failed)"
            - "exactly one NCR exists; NCR.source_id == ${samp_id} and source_type == LAB_SAMPLE and severity == MAJOR (hop 1)"
            - "Project.open_ncr_count == 1 (hop 2, caused by the NCR creation)"
            - "Project.compliance_posture == NONCONFORMANCE_OUTSTANDING (hop 3, caused by the count increment recompute)"

      - name: void_conforming_test_compensation_cascade
        grounds:
          - state_machines.FieldTest.RECORDED_to_VOIDED
          - calculations.scope_completion_update
          - calculations.project_posture_derivation
        distinguishing_aspect: |
          Depth-3 chain from POST field-tests/{id}/void (different trigger than
          the record-break instance): (1) voiding decrements the scope item's
          completed_count, (2) the decrement below required_count flips the
          ScopeItem SATISFIED -> OPEN, (3) the reopening flips
          Project.compliance_posture READY_FOR_LETTER -> IN_PROGRESS — a
          previously letter-ready project loses readiness purely through the
          compensation chain.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (one SOIL_COMPACTION item, STANDARD, std max 124.0, required_count 1); technician t1 with soil cert"
            - "DISPATCHED assignment 2026-05-04 09:00-10:00 with one CONFORMING test (118.0 pcf -> 95.2); assignment COMPLETED; DIR covering it SUBMITTED; posture == READY_FOR_LETTER"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Cascade B", permit_number: "P-CAS-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg_id}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {ft_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${asg_id}"], summary: "pad density testing complete" }
              as: Technician
              as_user_id: "${t1_id}"
          trigger:
            - call: "POST /api/field-tests/${ft_id}/void"
              payload: {}
              as: ProjectManager
              captures: {ft_status: $.data.status}
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_count: "$.data[0].completed_count", item_status: "$.data[0].status"}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {posture: $.data.compliance_posture}
          assert:
            - "FieldTest.${ft_id}.status == VOIDED (trigger)"
            - "ScopeItem.${item_id}.completed_count == 0 (hop 1, compensating decrement)"
            - "ScopeItem.${item_id}.status == OPEN (hop 2, count dropped below required_count 1)"
            - "Project.compliance_posture == IN_PROGRESS (hop 3, was READY_FOR_LETTER before the void)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state vs business_safety;
  # business_temporal vs business_referential — different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_cancelled_with_expired_cert_state_wins
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CERTIFICATION_EXPIRED]
        distinguishing_aspect: |
          Category pair state vs business_safety: dispatching a CANCELLED
          assignment whose technician's certification is also expired as of the
          work_date fails both the priority-4 state check and the priority-5
          certification check; the state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (SOIL_COMPACTION item required_cert_level 1); technician t1 ACTIVE with SOIL_COMPACTION level 2 cert expiring 2026-05-03"
            - "Assignment for t1 with work_date 2026-05-04 (cert expired as of work_date), then CANCELLED"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Prio A", permit_number: "P-PRI-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2026-05-03" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/cancel"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
            - call: "GET /api/assignments/${asg_id}"
              as: ProjectManager
              captures: {final_status: $.data.status}
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 5 business_safety ERR_CERTIFICATION_EXPIRED)"
            - "Assignment.${asg_id}.status == CANCELLED (no state change from the rejected dispatch)"

      - name: create_assignment_temporal_beats_referential
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
          - errors[ERR_REFERENCE_MISMATCH]
        distinguishing_aspect: |
          Category pair business_temporal vs business_referential: creating an
          assignment whose window overlaps the technician's existing booking
          (temporal, priority 6) while the scope_item_id also belongs to a
          different project (referential, priority 8) must return
          ERR_TECHNICIAN_DOUBLE_BOOKED — a different priority pairing than the
          state-vs-safety instance.
        test_recipe:
          setup:
            - "Projects A and B each with an APPROVED SSI containing one SOIL_COMPACTION item; technician t1 (soil cert) holds a REQUESTED assignment on project A 2026-05-04 09:00-10:00"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Prio B A", permit_number: "P-PRI-2A", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {pa_id: $.data.id, pa_v: $.data.version}
            - call: "POST /api/projects/${pa_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad A", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_a: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_a}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_a}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pa_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_a}/scope-items"
              as: ProjectManager
              captures: {item_a: "$.data[0].id"}
            - call: "POST /api/projects"
              payload: { name: "Prio B B", permit_number: "P-PRI-2B", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {pb_id: $.data.id, pb_v: $.data.version}
            - call: "POST /api/projects/${pb_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad B", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_b: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_b}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_b}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pb_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_b}/scope-items"
              as: ProjectManager
              captures: {item_b: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${pa_id}", scope_item_id: "${item_a}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
          trigger:
            - call: "POST /api/assignments"
              payload: { project_id: "${pa_id}", scope_item_id: "${item_b}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:30", end_time: "10:30" }
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_TECHNICIAN_DOUBLE_BOOKED (priority 6 business_temporal beats priority 8 business_referential ERR_REFERENCE_MISMATCH)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (percentage threshold at exactly 95.0 via
  # POST field-tests; time-window tolerance inclusive edge via record-break —
  # different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: soil_compaction_exactly_95_percent_passes
        grounds:
          - calculations.soil_compaction_evaluation
          - entities.FieldTest.fields.result_details
        distinguishing_aspect: |
          Percentage metric boundary on POST /api/field-tests: STANDARD proctor
          with max 124.0 — 117.8 pcf yields exactly 95.0 and PASSES because the
          comparison is >=; 117.7 pcf yields 94.9 (round_half_up of 94.919)
          and FAILS. One tenth of a pcf flips the verdict.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (one SOIL_COMPACTION STANDARD item, std max 124.0, required_count 2); technician t1 with soil cert; two DISPATCHED assignments 2026-05-04 (09:00-10:00 and 10:00-11:00)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Boundary Soil", permit_number: "P-BND-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 2, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg1: $.data.id}
            - call: "POST /api/assignments/${asg1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "10:00", end_time: "11:00" }
              as: ProjectManager
              captures: {asg2: $.data.id}
            - call: "POST /api/assignments/${asg2}/dispatch"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg1}", measured_values: { field_dry_density_pcf: 117.8 } }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {r1: $.data.result}
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg2}", measured_values: { field_dry_density_pcf: 117.7 } }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {r2: $.data.result}
          assert:
            - "117.8 pcf test: result == CONFORMING and result_details.relative_compaction_pct == 95.0 (exactly at the >= 95.0 threshold)"
            - "117.7 pcf test: result == NONCONFORMING and result_details.relative_compaction_pct == 94.9"
            - "Project.${proj_id}.open_ncr_count == 1 (only the 94.9 test raised an NCR)"

      - name: break_window_tolerance_inclusive_edge
        grounds:
          - calculations.break_window_tolerance
          - entities.LabSample.fields.within_tolerance
          - entities.LabSample.fields.flagged_out_of_tolerance
        distinguishing_aspect: |
          Time-window metric boundary on POST /api/lab-samples/{id}/record-break
          (different metric and endpoint than the soil percentage instance): a
          7-day break exactly 6h00m late is WITHIN tolerance (inclusive <=),
          while 6h01m late is flagged and auto-raises a MINOR NCR.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (fc 4000, CONCRETE_STRENGTH item required_count 2); lab capacity 10; certified technician t1; DISPATCHED assignment; two samples cast 2026-05-01T08:00:00Z age 7 (due 2026-05-08T08:00:00Z), both scheduled 2026-05-08"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "Boundary Break", permit_number: "P-BND-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 2 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 7 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {s1: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 7 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {s2: $.data.id}
            - call: "POST /api/lab-samples/${s1}/schedule-break"
              payload: { break_scheduled_date: "2026-05-08" }
              as: LabAnalyst
            - call: "POST /api/lab-samples/${s2}/schedule-break"
              payload: { break_scheduled_date: "2026-05-08" }
              as: LabAnalyst
          trigger:
            - call: "POST /api/lab-samples/${s1}/record-break"
              payload: { broken_at: "2026-05-08T14:00:00Z", cylinder_strengths_psi: [5000] }
              as: LabAnalyst
              captures: {s1_within: $.data.within_tolerance, s1_flag: $.data.flagged_out_of_tolerance}
            - call: "POST /api/lab-samples/${s2}/record-break"
              payload: { broken_at: "2026-05-08T14:01:00Z", cylinder_strengths_psi: [5000] }
              as: LabAnalyst
              captures: {s2_within: $.data.within_tolerance, s2_flag: $.data.flagged_out_of_tolerance}
          assert:
            - "s1 (exactly +6h00m on a 7-day break): within_tolerance == true and flagged_out_of_tolerance == false (inclusive boundary)"
            - "s2 (+6h01m): within_tolerance == false and flagged_out_of_tolerance == true"
            - "Project.${proj_id}.open_ncr_count == 1 (exactly one MINOR tolerance NCR, from s2 only; both breaks are strength-CONFORMING)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Assignment -> Technician;
  # Project letter -> ScopeItem — different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_sufficient_certification
        grounds:
          - state_machines.InspectionAssignment.REQUESTED_to_DISPATCHED
          - entities.Technician.fields.certifications
          - errors[ERR_CERTIFICATION_INSUFFICIENT]
        distinguishing_aspect: |
          Entity pair InspectionAssignment -> Technician: the dispatch
          transition's legal next-state depends on the linked Technician's
          certification rows (method match, level >= required, expiry after
          work_date). A level-1 certificate against a level-2 scope item blocks
          dispatch; appending a level-2 certificate on the same Technician
          flips the same transition to legal.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (CONCRETE_STRENGTH item, required_cert_level 2); technician t1 ACTIVE holding only a CONCRETE_STRENGTH level 1 cert expiring 2027-01-01; assignment 2026-05-04 09:00-10:00 in REQUESTED"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "CertGate", permit_number: "P-XED-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "columns", required_cert_level: 2, required_count: 1 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 1, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
          trigger:
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
            - call: "POST /api/technicians/${t1_id}/certifications"
              payload: { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" }
              as: AgencyAdmin
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
              captures: {final_status: $.data.status}
          assert:
            - "first dispatch: error_id == ERR_CERTIFICATION_INSUFFICIENT (level 1 < required 2)"
            - "after appending a level 2 certification to the same technician: dispatch succeeds and Assignment.status == DISPATCHED"

      - name: letter_requires_all_scope_items_satisfied
        grounds:
          - state_machines.Project.ACTIVE_to_COMPLETED
          - calculations.project_posture_derivation
          - errors[ERR_POSTURE_NOT_READY]
        distinguishing_aspect: |
          Entity pair Project(letter) -> ScopeItem (different pair than the
          dispatch instance): issue-letter is gated on every scope item of the
          current APPROVED revision being SATISFIED (plus zero open NCRs, zero
          open discrepancies, and full DIR coverage). With one of two items
          satisfied the posture stays IN_PROGRESS and issuance is rejected;
          completing the second item's chain flips posture and the same call
          succeeds.
        test_recipe:
          setup:
            - "Project with APPROVED SSI carrying TWO SOIL_COMPACTION items (required_count 1 each); technician t1 with soil cert"
            - "Item 1 fully satisfied (test 118.0 conforming, assignment COMPLETED, DIR for 2026-05-04 covering it); item 2 untouched"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "LetterGate", permit_number: "P-XED-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad north", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
                  - { test_method: SOIL_COMPACTION, description: "pad south", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item1: "$.data[0].id", item2: "$.data[1].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item1}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg1: $.data.id}
            - call: "POST /api/assignments/${asg1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "POST /api/assignments/${asg1}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-04", assignment_ids: ["${asg1}"], summary: "north pad tested" }
              as: Technician
              as_user_id: "${t1_id}"
          trigger:
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item2}", technician_id: "${t1_id}", work_date: "2026-05-05", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg2: $.data.id}
            - call: "POST /api/assignments/${asg2}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg2}", measured_values: { field_dry_density_pcf: 119.0 } }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "POST /api/assignments/${asg2}/complete"
              payload: { completion_note: "done" }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "POST /api/daily-reports"
              payload: { project_id: "${proj_id}", report_date: "2026-05-05", assignment_ids: ["${asg2}"], summary: "south pad tested" }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "POST /api/projects/${proj_id}/issue-letter"
              payload: {}
              as: ProjectManager
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {lstat: $.data.letter_status, pstat: $.data.status, posture: $.data.compliance_posture}
          assert:
            - "first issue-letter: error_id == ERR_POSTURE_NOT_READY (item 2 still OPEN -> posture IN_PROGRESS)"
            - "after satisfying item 2 (and its DIR coverage): issue-letter succeeds"
            - "Project.letter_status == ISSUED and Project.status == COMPLETED and Project.compliance_posture == LETTER_ISSUED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open window overlap on Technician;
  # aggregate day-bucket capacity on Lab — different interval semantics,
  # different resource entities)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_window_half_open_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
          - entities.InspectionAssignment.fields.start_time
        distinguishing_aspect: |
          Half-open interval semantics on resource Technician: [09:00, 10:00)
          and [09:30, 10:30) intersect -> ERR_TECHNICIAN_DOUBLE_BOOKED, while
          [10:00, 11:00) merely touches at the endpoint and is ACCEPTED
          (adjacency is not overlap under half-open arithmetic).
        test_recipe:
          setup:
            - "Project with APPROVED SSI (SOIL_COMPACTION item, required_count 5); technician t1 (soil cert) holding a REQUESTED assignment 2026-05-04 09:00-10:00"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Overlap", permit_number: "P-OVL-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 5, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
          trigger:
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:30", end_time: "10:30" }
              as: ProjectManager
              captures: {err: $.data.error_id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "10:00", end_time: "11:00" }
              as: ProjectManager
              captures: {adj_id: $.data.id, adj_status: $.data.status}
          assert:
            - "overlapping 09:30-10:30 create: error_id == ERR_TECHNICIAN_DOUBLE_BOOKED"
            - "adjacent 10:00-11:00 create succeeds: Assignment.status == REQUESTED (half-open intervals share only the endpoint)"
            - "GET /api/assignments?technician_id=${t1_id}&work_date=2026-05-04 returns exactly 2 assignments"

      - name: lab_day_capacity_aggregate_bucket
        grounds:
          - calculations.lab_day_load
          - validations[priority=9]
          - errors[ERR_LAB_DAY_CAPACITY]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on resource Lab (different
          resource and different geometry than the technician half-open
          windows): the whole calendar day is one bucket and conflict is a
          count reaching daily_break_capacity — the second sample scheduled on
          the same due date at a capacity-1 lab is rejected
          (load == capacity), while a third sample due on a different day
          schedules cleanly regardless of any clock window.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (fc 4000, CONCRETE_STRENGTH item required_count 3); lab L with daily_break_capacity 1; certified technician t1; DISPATCHED assignment with samples s1 and s2 cast 2026-05-01T08:00 age 7 (due 2026-05-08) and s3 cast 2026-05-01T08:00 age 28 (due 2026-05-29)"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Tiny Lab", lab_code: "L1", daily_break_capacity: 1 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "LabCap", permit_number: "P-OVL-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 3 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 7 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {s1: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 7 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {s2: $.data.id}
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg_id}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 28 }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {s3: $.data.id}
          trigger:
            - call: "POST /api/lab-samples/${s1}/schedule-break"
              payload: { break_scheduled_date: "2026-05-08" }
              as: LabAnalyst
              captures: {s1_status: $.data.status}
            - call: "POST /api/lab-samples/${s2}/schedule-break"
              payload: { break_scheduled_date: "2026-05-08" }
              as: LabAnalyst
              captures: {err: $.data.error_id}
            - call: "POST /api/lab-samples/${s3}/schedule-break"
              payload: { break_scheduled_date: "2026-05-29" }
              as: LabAnalyst
              captures: {s3_status: $.data.status}
          assert:
            - "s1 schedule succeeds: status == BREAK_SCHEDULED (load 0 < capacity 1)"
            - "s2 schedule on the same date: error_id == ERR_LAB_DAY_CAPACITY (load 1 >= capacity 1)"
            - "s3 schedule on a different day succeeds: status == BREAK_SCHEDULED (day bucket is independent)"
            - "GET /api/labs/${lab_id}/lab-samples?break_scheduled_date=2026-05-08 returns exactly 1 sample"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (open NCR count conserved across
  # create/verify; scope completed_count conserved across test/void — different
  # conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: open_ncr_count_conservation
        grounds:
          - entities.Project.fields.open_ncr_count
          - state_machines.NonconformanceReport.CORRECTION_SUBMITTED_to_VERIFIED
          - calculations.project_posture_derivation
        distinguishing_aspect: |
          Conserved quantity: Project.open_ncr_count == count of the project's
          NCRs with status in {OPEN, CORRECTION_SUBMITTED, ESCALATED}. The
          forward action (nonconforming result auto-creating an NCR) increments
          it to 1; the intermediate submit-correction leaves it unchanged at 1;
          the compensating verification decrements it back to exactly 0 — no
          drift after the round trip.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (SOIL_COMPACTION STANDARD item, std max 124.0, required_count 1); technicians t1 (soil cert, performer) and t2 (verifier)"
            - "One NONCONFORMING soil test by t1 (117.0 pcf) has auto-created a MAJOR NCR; open_ncr_count == 1"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Invariant NCR", permit_number: "P-INV-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech Two", employee_code: "T2" }
              as: AgencyAdmin
              captures: {t2_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg_id: $.data.id}
            - call: "POST /api/assignments/${asg_id}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg_id}", measured_values: { field_dry_density_pcf: 117.0 } }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "GET /api/projects/${proj_id}/ncrs"
              as: ProjectManager
              captures: {ncr_id: "$.data[0].id"}
          trigger:
            - call: "POST /api/ncrs/${ncr_id}/submit-correction"
              payload: { correction_note: "recompacted to spec" }
              as: Contractor
              captures: {st_mid: $.data.status}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {cnt_mid: $.data.open_ncr_count}
            - call: "POST /api/ncrs/${ncr_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Technician
              as_user_id: "${t2_id}"
              captures: {st_end: $.data.status}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {cnt_end: $.data.open_ncr_count}
          assert:
            - "after submit-correction: NCR.status == CORRECTION_SUBMITTED and Project.open_ncr_count == 1 (submission does not close)"
            - "after VERIFIED: NCR.status == VERIFIED and Project.open_ncr_count == 0 (compensation restores the pre-incident value exactly)"
            - "Project.compliance_posture != NONCONFORMANCE_OUTSTANDING once open_ncr_count returns to 0"

      - name: scope_completed_count_conservation
        grounds:
          - entities.ScopeItem.fields.completed_count
          - calculations.scope_completion_update
          - state_machines.FieldTest.RECORDED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity (different type than the NCR counter):
          ScopeItem.completed_count == number of RECORDED CONFORMING FieldTests
          plus REPORTED CONFORMING LabSamples linked to the item. Forward test
          -> 1; compensating void -> 0; a fresh conforming test on a new
          assignment -> 1 again. The voided test must not linger in the count.
        test_recipe:
          setup:
            - "Project with APPROVED SSI (one SOIL_COMPACTION STANDARD item, std max 124.0, required_count 2); technician t1 with soil cert; DISPATCHED assignment a1 2026-05-04 09:00-10:00 with one CONFORMING test (118.0 pcf)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Invariant Count", permit_number: "P-INV-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 2, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1_id: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg1: $.data.id}
            - call: "POST /api/assignments/${asg1}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg1}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1_id}"
              captures: {ft_id: $.data.id}
          trigger:
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {c1: "$.data[0].completed_count"}
            - call: "POST /api/field-tests/${ft_id}/void"
              payload: {}
              as: ProjectManager
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {c2: "$.data[0].completed_count"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1_id}", work_date: "2026-05-04", start_time: "10:00", end_time: "11:00" }
              as: ProjectManager
              captures: {asg2: $.data.id}
            - call: "POST /api/assignments/${asg2}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg2}", measured_values: { field_dry_density_pcf: 118.5 } }
              as: Technician
              as_user_id: "${t1_id}"
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {c3: "$.data[0].completed_count"}
          assert:
            - "after conforming test: ScopeItem.completed_count == 1"
            - "after void (compensating action): ScopeItem.completed_count == 0 (voided test excluded)"
            - "after replacement test on a new assignment: ScopeItem.completed_count == 1 (no double-count, no drift)"
