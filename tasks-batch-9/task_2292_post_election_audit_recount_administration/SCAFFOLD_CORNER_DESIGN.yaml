          Completion switches the money from HELD to a settled variant and folds the recounted totals back
          into the contest in one request: the cost is 6 lines of 12500 plus 10 hours of labour = 123000, the
          margin moved by exactly MATERIAL_MARGIN_CHANGE_VOTES 100 so the whole 200000 deposit is refunded
