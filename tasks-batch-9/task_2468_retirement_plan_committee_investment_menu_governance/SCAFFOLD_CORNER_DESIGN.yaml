              as_user_id: "rk-1"
          assert:
            - "the response status is 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "FundReplacementProposal.${prop_lc_id}.status is still UNWOUND with mapped_assets_cents 800000000 unchanged"
            - "POST /governance/fund-replacements/${prop_lc_id}/submit, /approve with ${motion_prop_id} and /notice-issue each also return 409 ERR_INVALID_STATE_TRANSITION"
            - "AssetClassSlot.${slot_lc_id}.current_fund_id is still ${fund_lc_a_id} and Plan.${plan_id}.available_menu_slots is still 1"

      - name: submitting_a_proposal_twice_fails_and_the_draft_count_stays_definitional
        claim_type: Idempotency
        grounds:
          - state_machines.FundReplacementProposal
          - endpoints.POST_/governance/fund-replacements/{proposalId}/submit
          - entities.Plan
        distinguishing_aspect: "DRAFT -> UNDER_REVIEW is single-shot: the second /submit returns 409 ERR_INVALID_STATE_TRANSITION. The interesting part is draft_proposal_count, which §1.1 defines as count(status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, BLOCKED}) while the transition prose says '-= 1'; under the definitional reading the count is 1 both before and after the successful submit, and unchanged again after the rejected one."
