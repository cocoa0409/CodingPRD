              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { ho_hw1: $.data.id }
            - call: "GET /premises/${phw}"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { phw_v2: $.data.version }
