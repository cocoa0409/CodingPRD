# =============================================================================
# Section 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_1500_artist_management_commission_accounting
# Breadth walk over the claim-extraction guide against this scaffold's
# §1.1-§1.7. Instances already asserted by a §1.8 difficulty instance appear
# as excluded_because stubs. Clock default 2026-08-01T00:00:00Z everywhere.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: artist_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Artist]
        distinguishing_aspect: "POST /artists with only required fields yields status ACTIVE, home_currency USD (default), version 1, and zeroed computed ledgers."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Solo Act", legal_name: "Solo Act LLC", primary_genre: "jazz" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /artists/${a_id}"
              payload: {}
              as: FirmAdmin
          assert:
            - "Artist.status == ACTIVE; home_currency == USD (default applied); version == 1"
            - "unrecouped_advance_balance_cents == 0; lifetime_gross_cents == 0; lifetime_commission_cents == 0; lifetime_disbursed_cents == 0; current_agreement_id is null"
            - "id is a bare UUID, created_at has three fractional digits (ISO 8601 UTC)"

      - name: income_event_create_ignores_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.IncomeEvent.fields.commission_amount_cents]
        distinguishing_aspect: "Computed fields are server-owned: posting an income event whose body contains commission_amount_cents is rejected as an unknown field."
        test_recipe:
          setup: ["artist exists"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "X", legal_name: "X LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
          trigger:
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 100000, recognition_date: "2026-03-10", source_name: "P", commission_amount_cents: 1 }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id == ERR_INVALID_REQUEST (http 400): commission_amount_cents is not in the endpoint input schema"

      - name: get_missing_agreement_returns_not_found
        claim_type: not_found
        grounds: [entities.Agreement, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent agreement id returns the envelope error ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404; response_type == error"

      - name: income_event_list_pagination_and_filter
        claim_type: listing
        grounds: [entities.IncomeEvent, response_envelope]
        distinguishing_aspect: "List endpoint composes filter + pagination: 3 events for the artist, limit=2 yields total_count 3, has_more true, and offset=2 returns the remaining 1."
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement (TOURING 1500bps); Agent"
            - "Three REPORTED TOURING events (100000, 200000, 300000; recognition 2026-03-05/06/07)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "List Act", legal_name: "List Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Li", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 100000, recognition_date: "2026-03-05", source_name: "P1" }
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-06", source_name: "P2" }
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 300000, recognition_date: "2026-03-07", source_name: "P3" }
              as: Agent
              as_user_id: "${tm_agent}"
          trigger:
            - call: "GET /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", limit: 2, offset: 0 }
              as: Agent
              as_user_id: "${tm_agent}"
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true; meta contains api_request_id and api_request_timestamp"
            - "Page 2 (offset=2): 1 item, has_more == false"
            - "All returned events have artist_id == ${a_id} and status == REPORTED"

      - name: statement_line_is_append_only_without_version
        claim_type: immutability
        grounds: [entities.StatementLine]
        distinguishing_aspect: "common_fields:false - StatementLine responses expose id and created_at only (no version/updated_at), and lines appear only as a consequence of generate/amend."
        test_recipe:
          setup: ["Artist + ACTIVE agreement (TOURING 1500bps); Agent + BM; one VERIFIED event gross 200000 recognized 2026-03-10"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Line Act", legal_name: "Line Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Ln", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Ln", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-10", source_name: "PLn" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { ev1: $.data.id }
            - call: "POST /income-events/${ev1}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { st1: $.data.id }
          trigger:
            - call: "GET /statements/${st1}/lines"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
          assert:
            - "Exactly 1 line: line_type == INCOME, ref_id == ${ev1}, amount_cents == 170000, commission_cents == 30000"
            - "Line object has id and created_at but NO version and NO updated_at fields"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: settle_from_reported_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.IncomeEvent.transitions]
        distinguishing_aspect: "Settle is defined only from VERIFIED/POSTED; from REPORTED it must fail with ERR_INVALID_STATE and leave the event untouched."
        test_recipe:
          setup: ["Artist + ACTIVE agreement (TOURING 1500bps); Agent + BM; event gross 100000 recognized 2026-03-10 in REPORTED"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Rep Act", legal_name: "Rep Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Re", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Re", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 100000, recognition_date: "2026-03-10", source_name: "PRe" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /income-events/${ev1}/settle"
              payload: { received_date: "2026-03-12", received_amount_cents: 100000 }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409); IncomeEvent.${ev1} stays REPORTED with received_amount_cents null"

      - name: terminal_option_waived_rejects_exercise
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Option]
        distinguishing_aspect: "WAIVED is terminal: a subsequent in-window exercise is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Artist + ACTIVE agreement; Agent; Option waived by the artist (window [2026-07-01, 2026-09-01] contains the default clock)"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Waive Act", legal_name: "Waive Act LLC", primary_genre: "rock" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Wa", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /options"
              payload: { artist_id: "${a_id}", agreement_id: "${agr_id}", option_type: "TOUR_LEG", income_type: "TOURING", exercise_window_start: "2026-07-01T00:00:00Z", exercise_window_end: "2026-09-01T00:00:00Z", engagement_start_datetime: "2027-03-01T20:00:00Z", engagement_end_datetime: "2027-03-01T23:00:00Z", exercise_value_cents: 500000 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opt: $.data.id }
            - call: "POST /options/${opt}/waive"
              payload: {}
              as: Artist
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /options/${opt}/exercise"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409); Option.${opt} remains WAIVED; no engagement created"

      - name: opportunity_initial_state_received
        claim_type: initial_state
        grounds: [state_machines.Opportunity]
        distinguishing_aspect: "A new opportunity starts RECEIVED with round_number 0, current_value_cents == proposed_value_cents, and requires_artist_approval derived from the 10000000 threshold."
        test_recipe:
          setup: ["Artist + Agent"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Init Act", legal_name: "Init Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent In", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
          trigger:
            - call: "POST /opportunities"
              payload: { artist_id: "${a_id}", income_type: "ENDORSEMENT", counterparty_name: "BrandCo", proposed_value_cents: 20000000, offer_expiry_date: "2026-12-31", proposed_window_start: "2026-10-01T00:00:00Z", proposed_window_end: "2026-10-02T00:00:00Z", fit_score: 90 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp: $.data.id }
          assert:
            - "Opportunity.${opp}: status == RECEIVED, round_number == 0, current_value_cents == 20000000, evaluation_score null"
            - "requires_artist_approval == true (20000000 > 10000000)"

      - name: dispute_withdraw_reverts_statement_to_issued
        claim_type: side_effect_execution
        grounds: [state_machines.Dispute.UNDER_REVIEW_to_WITHDRAWN, state_machines.Statement.ISSUED_to_DISPUTED]
        distinguishing_aspect: "Compensation pattern: withdrawing the only active dispute flips the statement DISPUTED -> ISSUED, undoing the dispute-creation side effect with no drift."
        test_recipe:
          setup: ["Artist + agreement + BM; one VERIFIED event 200000; ACCRUAL statement issued; dispute OPEN (statement DISPUTED)"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Rev Act", legal_name: "Rev Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Rv", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Rv", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-10", source_name: "PRv" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { ev1: $.data.id }
            - call: "POST /income-events/${ev1}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { st1: $.data.id }
            - call: "POST /statements/${st1}/issue"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
            - call: "POST /disputes"
              payload: { artist_id: "${a_id}", statement_id: "${st1}", reason: "EXPENSE_UNAUTHORIZED", claimed_amount_cents: 1000 }
              as: Artist
              as_user_id: "${a_id}"
              captures: { dsp: $.data.id }
          trigger:
            - call: "POST /disputes/${dsp}/withdraw"
              payload: {}
              as: Artist
              as_user_id: "${a_id}"
          assert:
            - "Dispute.${dsp}.status == WITHDRAWN"
            - "Statement.${st1}.status == ISSUED (reverted from DISPUTED), totals unchanged: net_payable_cents == 170000"

      - name: artist_archive_cascades_team_end
        claim_type: side_effect_execution
        grounds: [state_machines.Artist.ACTIVE_to_ARCHIVED, state_machines.TeamMember]
        distinguishing_aspect: "Cascade down: archiving an artist ends every ACTIVE/SUSPENDED team member; subsequent team-member actions then fail ERR_TEAM_MEMBER_INACTIVE."
        test_recipe:
          setup: ["Artist with an ACTIVE Agent member"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Arch Act", legal_name: "Arch Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Ar", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "PATCH /artists/${a_id}"
              payload: { status: "ARCHIVED" }
              as: FirmAdmin
          trigger:
            - call: "POST /expenses"
              payload: { artist_id: "${a_id}", category: "TRAVEL", amount_cents: 5000, incurred_date: "2026-07-01", description: "Taxi" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "TeamMember.${tm_agent}.status == ENDED after the archive cascade"
            - "Expense create is rejected: error_id == ERR_TEAM_MEMBER_INACTIVE (403) at priority 4, before the ERR_ARTIST_ARCHIVED business check"

      - name: deemed_acceptance_after_dispute_window
        claim_type: valid_transition
        grounds: [state_machines.Statement.ISSUED_to_ACKNOWLEDGED, calculations.statement_generation]
        distinguishing_aspect: "Guarded automatic transition: an ISSUED statement with no active dispute becomes ACKNOWLEDGED when the clock passes dispute_window_ends_at (issued_at + 30 days)."
        test_recipe:
          setup: ["Artist + agreement + BM; empty ACCRUAL statement for [2026-06-01..2026-06-30] ISSUED at default clock 2026-08-01 (dispute window ends 2026-08-31T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Deem Act", legal_name: "Deem Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM De", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-06-01", period_end_date: "2026-06-30", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { st1: $.data.id }
            - call: "POST /statements/${st1}/issue"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FirmAdmin
          assert:
            - "Statement.${st1}.status == ACKNOWLEDGED (deemed; no artist action)"
            - "Sweep count statements_acknowledged == 1 in the clock response"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: sunset_rate_applies_inside_sunset_window
        claim_type: correct_result
        grounds: [calculations.commission_rate_resolution, entities.Agreement.fields.sunset_end_date]
        distinguishing_aspect: "Post-term sunset provision: after early termination (2026-06-15), a TOURING event recognized 2027-03-01 is inside the 12-month sunset window and commissions at the reduced 750bps, not the in-term 1500bps."
        test_recipe:
          setup:
            - "Artist + agreement (TOURING 1500/750/12mo) ACTIVATED then TERMINATED with termination_date 2026-06-15 (sunset window 2026-06-16..2027-06-15)"
            - "Income event gross 200000 recognized 2027-03-01, unlinked, REPORTED"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Sun Act", legal_name: "Sun Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Su", window_start_date: "2026-01-01" }
