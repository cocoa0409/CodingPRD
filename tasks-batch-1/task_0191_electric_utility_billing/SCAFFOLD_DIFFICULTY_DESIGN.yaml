  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assistance_shield_outranks_not_in_arrears_state
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_ASSISTANCE_SHIELD]
          - errors[ERR_NOT_IN_ARREARS]
        distinguishing_aspect: |
          Category pair business_safety (priority 11, ERR_ASSISTANCE_SHIELD) vs business_constraint
          (priority 12, ERR_NOT_IN_ARREARS). The account is IN_ARREARS (so priority-12's check passes)
          AND has a PLEDGED grant (so priority-11's safety check fails); disconnect-notice must surface
          ERR_ASSISTANCE_SHIELD, proving the higher-priority safety check is evaluated before the
          arrears-state constraint.
        test_recipe:
          setup:
            - "Account I IN_ARREARS (so priority-12 passes) AND has a PLEDGED grant (priority-11 fails)"
            - "disconnect-notice must return ERR_ASSISTANCE_SHIELD, never proceed"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-PRI-I", name: "Priority I", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Priority Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-I1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-01-01T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: BillingOperator
            - call: "POST /assistance-grants"
              payload: { account_id: "${acct_id}", pledged_cents: 500, program: "LIHEAP" }
              as: AssistanceCaseworker
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/disconnect-notice"
              payload: {}
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSISTANCE_SHIELD (http 409)"
            - "Account.${acct_id}.service_status == ACTIVE (unchanged)"

      - name: fk_not_found_outranks_invalid_tariff_shape
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_FK_NOT_FOUND]
          - errors[ERR_INVALID_TARIFF_SHAPE]
        distinguishing_aspect: |
          Category pair business_referential (priority 4, ERR_FK_NOT_FOUND on POST /accounts body FK)
          vs business_constraint (priority 6, ERR_INVALID_TARIFF_SHAPE). Creating an account with a
          non-existent tariff_id surfaces ERR_FK_NOT_FOUND (priority 4) before any tariff-shape check.
        test_recipe:
          setup:
            - "Empty DB; POST /accounts referencing a tariff_id that does not exist"
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { tariff_id: "00000000-0000-4000-8000-000000000000", holder_name: "No Tariff" }
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FK_NOT_FOUND (http 404)"

