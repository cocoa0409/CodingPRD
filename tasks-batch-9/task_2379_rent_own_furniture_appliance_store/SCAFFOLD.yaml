# =============================================================================
# PRD-Bench scaffold seed tables — task_2379
# Rent-to-Own Furniture & Appliance Store (Rent-A-Center style)
# Difficulty target: beyond Expert (§0.4) — 15 entities, 52 endpoints,
# 15 calculations, 9 state machines (2 parallel dimensions on Agreement),
# 2 OCC guards, 46 ordered validations, 61 error codes, 7 roles.
# =============================================================================

scenario: |
  2379. Rent-to-Own Furniture & Appliance Store (Rent-A-Center): agreement structure with renewal terms, total-of-payments disclosure and early purchase option, weekly/monthly renewal payment posting and reinstatement rights after a missed payment, delivery, setup and service-during-agreement obligations, product return and re-rent condition grading with depreciation tiering, customer verification and reference checks without a credit report, state rent-to-own law variance on disclosures and fees, collection contacts and repossession limits, loyalty benefits and early-payoff discounting

domain_name: rent-to-own-store

# Flat topology: every entity is a peer top-level collection linked by FKs, so
# the api_prefix is the server root and no single resource owns the URL space.
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint

  entity_topology: flat
  # Peer collections (/customers, /inventory-units, /agreements, /service-tickets,
  # /delivery-orders, /return-inspections, /loyalty-ledger-entries) wired by FK.
  # Only three read paths are nested sub-resources for FK reverse-reachability.

  state_machine_shape: parallel
  # Agreement carries two independent dimensions on one row:
  #   payment_status    : CURRENT <-> DELINQUENT -> DEFAULTED -> CLOSED   (cyclic)
  #   possession_status : PENDING_DELIVERY -> DELIVERED -> {SERVICE_SWAP_PENDING,
  #                       RETURN_PENDING_INSPECTION, REPOSSESSED, OWNED}  (branching)
  # InventoryUnit.status is cyclic (AVAILABLE -> RESERVED -> ON_RENT ->
  # RETURNED_PENDING_GRADE -> AVAILABLE, plus the IN_SERVICE swap loop).
  # Customer.verification_status is branching-with-revert (PENDING -> REJECTED -> VERIFIED).

  relationship_patterns:
    - one_to_many          # Agreement -> RenewalPayment / ReinstatementWindow / CollectionContact
    - self_referential     # InventoryUnit.replaced_unit_id -> InventoryUnit.id
    - cross_aggregate      # ServiceTicket references Agreement, Store and two InventoryUnits
    - polymorphic_none     # (no polymorphic FK in this scaffold)

  role_model: segregation_of_duties
  # The ComplianceOfficer user who approved a Customer's verification may not be
  # the user who authorizes repossession against that Customer's agreement.
  # Layered on peer ownership: SalesAssociate/CollectionsAgent/ServiceTechnician
  # each own disjoint write surfaces; Customer is entity_backed and may only act
  # on its own agreements.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StateRtoRule
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter USPS state code; unique across StateRtoRule rows"
        constraints: "exactly 2 uppercase letters; unique"
      - name: late_fee_grace_days
        type: integer
        source: input
        description: "Days after a renewal due date before a late fee may be assessed; fee fires only when days_late > this value"
        constraints: ">= 0"
      - name: late_fee_pct
        type: number
        source: input
        description: "Fraction of Agreement.renewal_rate_cents used as the late fee before the cap"
        constraints: "0 <= v <= 0.25"
      - name: late_fee_max_cents
        type: integer
        source: input
        description: "Hard cap in cents on a single period's late fee"
        constraints: ">= 0"
      - name: reinstate_threshold_months
        type: integer
        source: input
        default: 2
        description: "Months-of-rent-paid threshold that switches the reinstatement window from short to long"
        constraints: ">= 1"
      - name: reinstate_days_short
        type: integer
        source: input
        description: "Reinstatement window length in days when rent paid is below the threshold"
        constraints: ">= 1"
      - name: reinstate_days_long
        type: integer
        source: input
        description: "Reinstatement window length in days when rent paid is at or above the threshold"
        constraints: ">= reinstate_days_short"
      - name: reinstatement_fee_cents
        type: integer
        source: input
        description: "Statutory reinstatement fee charged when a ReinstatementWindow opens"
        constraints: ">= 0"
      - name: early_purchase_formula
        type: enum
        source: input
        description: "Which early-purchase variant this state mandates"
        constraints: "PCT_OF_REMAINING | CASH_PRICE_MINUS_CREDIT"
      - name: early_purchase_pct
        type: number
        source: input
        description: "Multiplier on remaining total-of-payments for the PCT_OF_REMAINING variant"
        constraints: "0 < v <= 1"
      - name: rent_credit_pct
        type: number
        source: input
        description: "Fraction of rent already applied that is credited against adjusted cash price for the CASH_PRICE_MINUS_CREDIT variant"
        constraints: "0 < v <= 1"
      - name: processing_fee_max_cents
        type: integer
        source: input
        description: "Cap in cents on the one-time processing fee that may be folded into total-of-payments; 0 forbids the fee entirely"
        constraints: ">= 0"
      - name: disclosure_requires_total_of_payments
        type: boolean
        source: input
        default: true
        description: "When true, Agreement creation must carry disclosure_acknowledged == true"
      - name: max_collection_contacts_per_week
        type: integer
        source: input
        description: "Maximum CollectionContact rows permitted per Agreement in a rolling 7-day window"
        constraints: ">= 0"
      - name: quiet_hours_start_utc_hour
        type: integer
        source: input
        default: 20
        description: "Inclusive UTC hour at which collection contact becomes prohibited"
        constraints: "0..23"
      - name: quiet_hours_end_utc_hour
        type: integer
        source: input
        default: 8
        description: "Exclusive UTC hour at which collection contact becomes permitted again"
        constraints: "0..23"
      - name: repossession_paid_pct_limit
        type: number
        source: input
        description: "Equity-protection limit: repossession is prohibited once Agreement.paid_pct >= this value"
        constraints: "0 < v <= 1"
      - name: credit_inquiry_prohibited
        type: boolean
        source: input
        default: true
        description: "When true, any verification request carrying a credit_score input is rejected"
      - name: max_term_renewals
        type: integer
        source: input
        description: "Maximum Agreement.renewal_count permitted in this state"
        constraints: ">= 1"

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Store display name"
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: "Natural-key reference resolved as StateRtoRule.state_code == Store.state_code; the matching StateRtoRule must already exist"
        constraints: "exactly 2 uppercase letters"
      - name: service_bay_capacity
        type: integer
        source: input
        default: 1
        description: "Number of ServiceTickets whose windows may overlap at this store"
        constraints: ">= 1"
      - name: units_on_rent_count
        type: integer
        source: computed
        default: 0
        description: "Count of InventoryUnit rows with store_id == this store and status == ON_RENT"
      - name: units_in_service_count
        type: integer
        source: computed
        default: 0
        description: "Count of InventoryUnit rows with store_id == this store and status == IN_SERVICE"
      - name: service_intake_open
        type: boolean
        source: computed
        default: true
        description: "Derived posture: false exactly when units_in_service_count >= service_bay_capacity; while false no new ServiceTicket may be created at this store"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer legal name"
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: "Email address; must be non-empty for EMAIL collection contacts"
      - name: phone
        type: string
        source: input
        description: "Phone number; must be non-empty for PHONE and SMS collection contacts"
      - name: state_code
        type: string
        source: input
        description: "Natural-key reference resolved as StateRtoRule.state_code == Customer.state_code; drives the credit-inquiry prohibition at verification"
        constraints: "exactly 2 uppercase letters"
      - name: employer_name
        type: string
        source: input
        description: "Stated employer, collected in place of a credit report"
      - name: employer_verified
        type: boolean
        source: input
        default: false
        description: "True when store staff reached the employer; worth 40 verification points"
      - name: monthly_income_cents
        type: integer
        source: input
        description: "Stated monthly income in cents; banded into verification points"
        constraints: ">= 0"
      - name: residence_months
        type: integer
        source: input
        description: "Months at current residence; 5 points per completed 6 months, capped at 30"
        constraints: ">= 0"
      - name: government_id_verified
        type: boolean
        source: input
        default: false
        description: "True when a government photo ID was inspected; mandatory for VERIFIED"
      - name: in_person_contact_consent
        type: boolean
        source: input
        default: false
        description: "Written consent on file for IN_PERSON collection contact"
      - name: verification_status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | VERIFIED | REJECTED — set by POST /customers/{id}/verify"
      - name: verification_score
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.customer_verification_score at the last verify attempt"
      - name: verified_reference_count
        type: integer
        source: computed
        default: 0
        description: "Count of CustomerReference rows with customer_id == this customer and check_status == VERIFIED"
      - name: verified_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ComplianceOfficer whose APPROVE decision set verification_status = VERIFIED; empty string until then"
      - name: loyalty_points_balance
        type: integer
        source: computed
        default: 0
        description: "Sum of LoyaltyLedgerEntry.delta_points over all entries with customer_id == this customer"
      - name: loyalty_points_lifetime
        type: integer
        source: computed
        default: 0
        description: "Sum of positive LoyaltyLedgerEntry.delta_points only; reversals do not reduce it. Drives loyalty_tier"
      - name: loyalty_tier
        type: enum
        source: computed
        default: STANDARD
        description: "STANDARD | SILVER | GOLD — GOLD when loyalty_points_lifetime >= 500, SILVER when >= 200, else STANDARD"
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Unapplied payment remainder returned to the customer's store credit once an agreement's term is fully paid"
      - name: account_flag
        type: enum
        source: system
        default: NORMAL
        description: "NORMAL | ADVERSE — ADVERSE exactly while adverse_agreement_count >= 1"
      - name: adverse_agreement_count
        type: integer
        source: computed
        default: 0
        description: "Count of Agreement rows with customer_id == this customer and collections_stage == ADVERSE"
      - name: lifetime_delinquency_count
        type: integer
        source: computed
        default: 0
        description: "Number of CURRENT -> DELINQUENT transitions ever recorded across this customer's agreements"

  - name: CustomerReference
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer this personal reference belongs to"
      - name: reference_name
        type: string
        source: input
        description: "Name of the reference contact"
        constraints: "1..120 chars"
      - name: relationship
        type: enum
        source: input
        description: "FAMILY | EMPLOYER | LANDLORD | PERSONAL"
      - name: phone
        type: string
        source: input
        description: "Reference phone number"
      - name: check_status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | VERIFIED | UNREACHABLE | REFUSED — set by POST /customer-references/{id}/check"
      - name: checked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the check call; null while PENDING"
      - name: checked_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the staff member who recorded the check result"

  - name: InventoryUnit
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store that physically holds this unit"
      - name: model_code
        type: string
        source: input
        description: "Catalog model code (e.g. SOFA-3S-GRY)"
      - name: category
        type: enum
        source: input
        description: "FURNITURE | APPLIANCE — APPLIANCE requires a setup_certified crew for delivery"
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial; unique per store_id"
        constraints: "unique within store_id"
      - name: cash_price_cents
        type: integer
        source: input
        description: "Disclosed cash price of a brand-new unit of this model, in cents; the depreciation base"
        constraints: ">= 1000"
      - name: condition_grade
        type: enum
        source: system
        default: NEW
        description: "NEW | GRADE_A | GRADE_B | GRADE_C — stepped down one notch by re-rent grading and by a completed swap"
      - name: rent_cycle_count
        type: integer
        source: system
        default: 0
        description: "Number of completed rental cycles; incremented when the unit returns to AVAILABLE after a rental or a swap"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: "AVAILABLE | RESERVED | ON_RENT | IN_SERVICE | RETURNED_PENDING_GRADE | RETIRED | SOLD"
      - name: accumulated_rent_received_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime sum of Agreement.rent_applied_cents credited to this unit across all agreements that ever held it"
      - name: residual_value_cents
        type: integer
        source: computed
        default: 0
        description: "Current book residual; written by the PROVISIONAL variant at return acceptance and overwritten by the FINAL variant at grading"
      - name: residual_valuation_basis
        type: enum
        source: computed
        default: NONE
        description: "NONE | PROVISIONAL | FINAL — which variant of calculations.unit_residual_value last wrote residual_value_cents"
      - name: replaced_unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; set when this unit was issued as the service replacement for another unit (self-referential); null otherwise"
      - name: retired_reason
        type: enum
        source: system
        default: NONE
        description: "NONE | UNRENTABLE_ON_GRADING"

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; must be verification_status == VERIFIED at creation"
      - name: unit_id
        type: string
        source: input
        description: "FK -> InventoryUnit.id; the unit currently in the customer's possession under this agreement (re-pointed to the replacement unit when a swap is resolved)"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; copied from InventoryUnit.store_id at creation"
      - name: term_type
        type: enum
        source: input
        description: "WEEKLY | MONTHLY — period length 7 or 30 days and markup 2.20 or 1.95"
      - name: renewal_count
        type: integer
        source: input
        description: "Number of renewal payments to ownership"
        constraints: ">= 1 and <= StateRtoRule.max_term_renewals for state_code_snapshot"
      - name: disclosure_acknowledged
        type: boolean
        source: input
        default: false
        description: "Customer acknowledgement of the total-of-payments disclosure; must be true when the state rule requires the disclosure"
      - name: state_code_snapshot
        type: string
        source: system
        description: "Store.state_code copied at creation; every fee, window and repossession rule for this agreement reads the StateRtoRule with this state_code"
      - name: state_rule_version_snapshot
        type: integer
        source: system
        description: "StateRtoRule.version pinned at creation, so later PATCHes to the rule do not retroactively change this agreement's disclosed economics"
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SalesAssociate who created the agreement"
      - name: adjusted_cash_price_cents
        type: integer
        source: computed
        description: "Depreciation-adjusted cash price of the unit at signing (calculations.agreement_pricing step 3)"
      - name: renewal_rate_cents
        type: integer
        source: computed
        description: "Amount due per renewal period (calculations.agreement_pricing step 6)"
      - name: rent_subtotal_cents
        type: integer
        source: computed
        description: "renewal_rate_cents * renewal_count (calculations.agreement_pricing step 7)"
      - name: processing_fee_cents
        type: integer
        source: computed
        description: "One-time processing fee folded into the disclosure (calculations.agreement_pricing step 8)"
      - name: total_of_payments_cents
        type: integer
        source: computed
        description: "Disclosed total of payments = rent_subtotal_cents + processing_fee_cents"
      - name: monthly_equivalent_rate_cents
        type: integer
        source: computed
        description: "round_half_up(renewal_rate_cents * 52 / 12) when term_type == WEEKLY, else renewal_rate_cents; the unit of the reinstatement threshold"
      - name: payment_status
        type: enum
        source: system
        default: CURRENT
        description: "Dimension 1 of 2: CURRENT | DELINQUENT | DEFAULTED | CLOSED"
      - name: possession_status
        type: enum
        source: system
        default: PENDING_DELIVERY
        description: "Dimension 2 of 2: PENDING_DELIVERY | DELIVERED | SERVICE_SWAP_PENDING | RETURN_PENDING_INSPECTION | RETURNED | REPOSSESSED | OWNED"
      - name: collections_stage
        type: enum
        source: system
        default: NONE
        description: "NONE | ADVERSE — ADVERSE while the agreement is in an open collections campaign; drives Customer.adverse_agreement_count"
      - name: periods_paid
        type: integer
        source: computed
        default: 0
        description: "Number of renewal periods fully paid; partial money never increments it"
      - name: rent_applied_cents
        type: integer
        source: computed
        default: 0
        description: "periods_paid * renewal_rate_cents; the rent component of every POSTED payment"
      - name: partial_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Money received that was too small to complete a renewal period; carried forward into the next posting's rent pool"
      - name: late_fee_assessed_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime late fees assessed by day-close on this agreement"
      - name: late_fee_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime late fees collected through payment allocation"
      - name: late_fee_balance_cents
        type: integer
        source: computed
        default: 0
        description: "late_fee_assessed_cents - late_fee_paid_cents"
      - name: reinstatement_fee_assessed_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime reinstatement fees assessed when ReinstatementWindows opened"
      - name: reinstatement_fee_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime reinstatement fees collected through payment allocation"
      - name: reinstatement_fee_balance_cents
        type: integer
        source: computed
        default: 0
        description: "reinstatement_fee_assessed_cents - reinstatement_fee_paid_cents"
      - name: customer_credit_contributed_cents
        type: integer
        source: computed
        default: 0
        description: "Portion of POSTED payments on this agreement that spilled into Customer.credit_balance_cents after the term was fully paid"
      - name: early_purchase_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Amount paid to exercise the early purchase option; never part of rent_applied_cents"
      - name: paid_pct
        type: number
        source: computed
        default: 0
        description: "round_half_up(rent_applied_cents / total_of_payments_cents, 4); the equity measure the repossession limit reads"
      - name: cycle_anchor_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the delivery was completed; null until then. Renewal period k is due at cycle_anchor_at + k * period_days"
      - name: current_period_due_at
        type: datetime
        source: computed
        description: "cycle_anchor_at + (periods_paid + 1) * period_days; null while cycle_anchor_at is null"
      - name: late_fee_period_index_last
        type: integer
        source: system
        default: 0
        description: "Highest renewal-period index for which a late fee was already assessed; blocks double assessment across repeated day-close runs"
      - name: service_credit_days
        type: integer
        source: computed
        default: 0
        description: "Cumulative days of service-during-agreement downtime credited to the customer"
      - name: swap_count
        type: integer
        source: computed
        default: 0
        description: "Number of service swaps issued against this agreement"
      - name: collection_contact_count_7d
        type: integer
        source: computed
        default: 0
        description: "Count of CollectionContact rows on this agreement with contacted_at in the half-open window (clock_now - 7 days, clock_now]"

  - name: RenewalPayment
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement the money was posted against"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross amount tendered, in cents"
        constraints: ">= 1"
      - name: payment_method
        type: enum
        source: input
        description: "CASH | CARD | ACH | MONEY_ORDER"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the payment was posted"
      - name: status
        type: enum
        source: system
        default: POSTED
        description: "POSTED | REVERSED"
      - name: days_late
        type: integer
        source: computed
        description: "max(0, floor((posted_at - Agreement.current_period_due_at) / 86400s)) evaluated before allocation"
      - name: allocation_late_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall bucket 1 of this payment"
      - name: allocation_reinstatement_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall bucket 2 of this payment"
      - name: allocation_rent_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall bucket 3: periods_advanced * Agreement.renewal_rate_cents"
      - name: allocation_partial_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall bucket 4: leftover held on the agreement because the term is not yet complete"
      - name: partial_credit_before_cents
        type: integer
        source: system
        default: 0
        description: "Agreement.partial_credit_cents as it stood immediately BEFORE this payment entered the waterfall. Recorded because bucket 3 consumes the carried credit: a reversal must restore this exact value rather than subtract allocation_partial_credit_cents, or the carried money is double-counted out of the ledger"
      - name: allocation_customer_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Waterfall bucket 5: leftover pushed to Customer.credit_balance_cents because the term completed with this payment"
      - name: periods_advanced
        type: integer
        source: computed
        default: 0
        description: "Renewal periods this payment completed"
      - name: loyalty_points_awarded
        type: integer
        source: computed
        default: 0
        description: "Points minted by calculations.loyalty_points_accrual for this payment"
      - name: cured_delinquency
        type: boolean
        source: computed
        default: false
        description: "True when this posting drove Agreement.payment_status DELINQUENT -> CURRENT"
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical-clock instant of reversal; null while POSTED"
      - name: reversal_reason
        type: enum
        source: system
        default: NONE
        description: "NONE | CHARGEBACK | NSF | POSTING_ERROR"

  - name: ReinstatementWindow
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement whose reinstatement right this window represents"
      - name: missed_period_index
        type: integer
        source: system
        description: "Renewal period index whose non-payment opened this window"
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the day-close run that opened the window"
      - name: window_days
        type: integer
        source: computed
        description: "reinstate_days_long when Agreement.rent_applied_cents >= reinstate_threshold_months * Agreement.monthly_equivalent_rate_cents, else reinstate_days_short"
      - name: expires_at
        type: datetime
        source: computed
        description: "opened_at + window_days days"
      - name: reinstatement_fee_cents
        type: integer
        source: computed
        description: "StateRtoRule.reinstatement_fee_cents for Agreement.state_code_snapshot, snapshotted at open"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | USED | EXPIRED"

  - name: DeliveryCrew
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this crew is dispatched from"
      - name: crew_name
        type: string
        source: input
        description: "Crew label"
        constraints: "1..80 chars"
      - name: setup_certified
        type: boolean
        source: input
        default: false
        description: "True when the crew may perform APPLIANCE hook-up and setup"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: "ACTIVE | INACTIVE — INACTIVE crews may not take new delivery orders"

  - name: DeliveryOrder
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement being delivered or picked up"
      - name: crew_id
        type: string
        source: input
        description: "FK -> DeliveryCrew.id; the crew occupying the window"
      - name: service_type
        type: enum
        source: input
        description: "DELIVERY_ONLY | DELIVERY_SETUP — DELIVERY_SETUP additionally books hook-up/installation and is the only member an APPLIANCE unit may be delivered under"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the crew's occupied interval"
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the crew's occupied interval"
        constraints: "strictly after window_start_at"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "SCHEDULED | COMPLETED | FAILED_ATTEMPT | SUPERSEDED — SUPERSEDED is written when a fresh order is cut for the same agreement, which releases this order's crew window"
      - name: attempt_count
        type: integer
        source: computed
        default: 0
        description: "Number of failed delivery attempts recorded on this order"
      - name: setup_completed
        type: boolean
        source: computed
        default: false
        description: "Whether hook-up/setup was performed; must be true to complete an APPLIANCE delivery"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null otherwise"

  - name: ServiceTicket
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement under service-during-agreement obligation"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; copied from Agreement.store_id; the store whose service_bay_capacity gates the window"
      - name: unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; copied from Agreement.unit_id at creation — the unit needing service"
      - name: replacement_unit_id
        type: string
        source: input
        description: "FK -> InventoryUnit.id; the loaner/replacement unit issued by POST /service-tickets/{id}/issue-swap; null until then"
      - name: issue_code
        type: enum
        source: input
        description: "MECHANICAL | COSMETIC | MISSING_PART"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the store service window"
      - name: window_end_at
        type: datetime
        source: input
        description: "Inclusive end of the store service window"
        constraints: "strictly after window_start_at"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "SCHEDULED | SWAP_ISSUED | RESOLVED | VOIDED"
      - name: resolution
        type: enum
        source: system
        default: NONE
        description: "NONE | REPAIRED | SWAPPED"
      - name: rent_credit_days
        type: integer
        source: input
        default: 0
        description: "Days of service-during-agreement downtime the store concedes, supplied on POST /service-tickets/{id}/resolve and added to Agreement.service_credit_days; 0 until the ticket resolves"
        constraints: "0 <= v <= 30"
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ServiceTechnician who issued the swap; empty string until then"

  - name: ReturnInspection
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement whose product came back"
      - name: unit_id
        type: string
        source: system
        description: "FK -> InventoryUnit.id; the unit under inspection, copied from Agreement.unit_id at return acceptance"
      - name: return_reason
        type: enum
        source: input
        description: "VOLUNTARY_RETURN | REPOSSESSION_RECOVERY"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | GRADED"
      - name: assessed_grade
        type: enum
        source: input
        description: "GRADE_A | GRADE_B | GRADE_C | UNRENTABLE — supplied at grading; null while PENDING"
      - name: damage_deduction_cents
        type: integer
        source: input
        default: 0
        description: "Cash deduction for damage beyond normal wear"
        constraints: ">= 0"
      - name: missing_parts_count
        type: integer
        source: input
        default: 0
        description: "Number of missing parts; each deducts MISSING_PART_DEDUCTION_CENTS"
        constraints: ">= 0"
      - name: final_residual_value_cents
        type: integer
        source: computed
        default: 0
        description: "FINAL variant of calculations.unit_residual_value written at grading"
      - name: re_rent_rate_cents
        type: integer
        source: computed
        default: 0
        description: "Projected weekly renewal rate if this unit is re-rented (calculations.re_rent_rate)"
      - name: depreciation_tier
        type: enum
        source: computed
        default: TIER_1
        description: "TIER_1 | TIER_2 | TIER_3 | WRITE_OFF — banded from final_residual_value_cents / InventoryUnit.cash_price_cents"
      - name: graded_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ServiceTechnician who graded the return; empty string while PENDING"

  - name: CollectionContact
    parent: Agreement
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the delinquent agreement being worked"
      - name: channel
        type: enum
        source: input
        description: "PHONE | SMS | EMAIL | IN_PERSON"
      - name: outcome
        type: enum
        source: input
        description: "NO_ANSWER | LEFT_MESSAGE | SPOKE_TO_CUSTOMER | PROMISE_TO_PAY"
      - name: contacted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the contact; immutable"
      - name: rolling_7d_count_at_contact
        type: integer
        source: computed
        description: "Value of Agreement.collection_contact_count_7d after this row was appended"
      - name: contacted_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CollectionsAgent who made the contact"

  - name: EarlyPurchaseQuote
    parent: Agreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement being quoted for early purchase"
      - name: formula_applied
        type: enum
        source: computed
        description: "PCT_OF_REMAINING | CASH_PRICE_MINUS_CREDIT — copied from the StateRtoRule for Agreement.state_code_snapshot"
      - name: rent_applied_snapshot_cents
        type: integer
        source: computed
        description: "Agreement.rent_applied_cents pinned at issuance"
      - name: pre_discount_cents
        type: integer
        source: computed
        description: "Output of the selected early-purchase variant, before loyalty discounting"
      - name: loyalty_tier_snapshot
        type: enum
        source: computed
        description: "STANDARD | SILVER | GOLD — Customer.loyalty_tier pinned at issuance"
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "round_half_up(pre_discount_cents * tier discount pct); never applied to late fees"
      - name: late_fee_component_cents
        type: integer
        source: computed
        description: "Agreement.late_fee_balance_cents + Agreement.reinstatement_fee_balance_cents pinned at issuance; added undiscounted"
      - name: payoff_amount_cents
        type: integer
        source: computed
        description: "pre_discount_cents - loyalty_discount_cents + late_fee_component_cents"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issuance"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + 7 days"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | ACCEPTED | SUPERSEDED | EXPIRED"

  - name: LoyaltyLedgerEntry
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer whose point balance this entry moves"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> Agreement.id; the agreement that produced the entry"
      - name: source_payment_id
        type: string
        source: input
        description: "FK -> RenewalPayment.id; the payment that produced the entry; null for EARLY_PAYOFF_BONUS"
      - name: entry_type
        type: enum
        source: system
        description: "PAYMENT_ACCRUAL | PAYMENT_REVERSAL | EARLY_PAYOFF_BONUS"
      - name: delta_points
        type: integer
        source: computed
        description: "Signed point movement; negative only for PAYMENT_REVERSAL"
      - name: balance_after
        type: integer
        source: computed
        description: "Customer.loyalty_points_balance immediately after this entry was appended"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical-clock instant of the entry; immutable"

# =============================================================================
# §1.2 State Machine Table
#   Agreement carries TWO independent dimensions on one row; they are listed as
#   two machines with an explicit `state_field:` and never share a transition.
# =============================================================================
state_machines:

  - entity: Customer
    state_field: verification_status
    initial_state: PENDING
    terminal_states: [VERIFIED]
    shape: branching_with_revert
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /customers/{id}/verify with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "no credit_score field present in the request body when StateRtoRule(state_code == Customer.state_code).credit_inquiry_prohibited == true"
          - "Customer.government_id_verified == true"
          - "Customer.verified_reference_count >= 2"
          - "calculations.customer_verification_score >= VERIFICATION_PASS_SCORE (70)"
        side_effects:
          - "Customer.verification_score = computed score"
          - "Customer.verified_by_user_id = X-User-ID of the caller"
      - from: PENDING
        to: REJECTED
        trigger: "POST /customers/{id}/verify with decision REJECT, or an APPROVE whose score/reference checks fail is rejected without a transition"
        actor: ComplianceOfficer
        preconditions:
          - "no credit_score field present when the state prohibits credit inquiries"
        side_effects:
          - "Customer.verification_score = computed score"
        note: "A failed APPROVE returns an error and leaves the state untouched; only an explicit REJECT decision moves the row to REJECTED."
      - from: REJECTED
        to: VERIFIED
        trigger: "POST /customers/{id}/verify with decision APPROVE after more references were checked"
        actor: ComplianceOfficer
        preconditions:
          - "same four preconditions as PENDING -> VERIFIED"
        side_effects:
          - "Customer.verification_score = recomputed score"
          - "Customer.verified_by_user_id = X-User-ID of the caller"
        note: "Revert edge: a rejected applicant can be re-decided without a new Customer row."

  - entity: Agreement
    state_field: payment_status
    initial_state: CURRENT
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /stores/{id}/day-close (system sweep) when clock_now > current_period_due_at + grace_days"
        actor: system
        preconditions:
          - "Agreement.cycle_anchor_at is not null"
          - "Agreement.possession_status IN {DELIVERED, SERVICE_SWAP_PENDING}"
          - "floor((clock_now - current_period_due_at)/86400s) > StateRtoRule.late_fee_grace_days"
        side_effects:
          - "step 1: assess late fee = calculations.late_fee_assessment; Agreement.late_fee_assessed_cents += fee; late_fee_balance_cents recomputed; late_fee_period_index_last = periods_paid + 1"
          - "step 2: create ReinstatementWindow(status OPEN, missed_period_index = periods_paid + 1, window_days = calculations.reinstatement_window_length, expires_at = opened_at + window_days days, reinstatement_fee_cents from the pinned state rule); Agreement.reinstatement_fee_assessed_cents += that fee"
          - "step 3 (caused by step 0 reaching DELINQUENT): Agreement.collections_stage NONE -> ADVERSE"
          - "step 4 (caused by step 3): Customer.adverse_agreement_count += 1; Customer.lifetime_delinquency_count += 1"
          - "step 5 (caused by step 4 crossing 0 -> 1): Customer.account_flag NORMAL -> ADVERSE"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /agreements/{id}/renewal-payments whose allocation clears every arrear"
        actor: SalesAssociate | CollectionsAgent
        preconditions:
          - "after calculations.renewal_payment_allocation: late_fee_balance_cents == 0"
          - "after allocation: reinstatement_fee_balance_cents == 0"
          - "after allocation: current_period_due_at (recomputed from the new periods_paid) > clock_now"
        side_effects:
          - "step 1: RenewalPayment.cured_delinquency = true"
          - "step 2 (caused by reaching CURRENT): the ReinstatementWindow with status OPEN on this agreement -> USED"
          - "step 3 (caused by step 2): Agreement.collections_stage ADVERSE -> NONE"
          - "step 4 (caused by step 3): Customer.adverse_agreement_count -= 1"
          - "step 5 (caused by step 4 reaching 0): Customer.account_flag ADVERSE -> NORMAL"
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /renewal-payments/{id}/reverse of the payment that cured the delinquency"
        actor: StoreManager
        preconditions:
          - "RenewalPayment.status == POSTED and RenewalPayment.cured_delinquency == true"
          - "Agreement.payment_status == CURRENT"
        side_effects:
          - "step 1: every allocation bucket of the reversed payment is subtracted from the agreement (rent_applied_cents, periods_paid, late_fee_paid_cents, reinstatement_fee_paid_cents, partial_credit_cents restored to their pre-payment values; customer_credit_contributed_cents and Customer.credit_balance_cents likewise)"
          - "step 2 (caused by reverting to DELINQUENT): the ReinstatementWindow that this payment marked USED -> OPEN when clock_now <= expires_at, else -> EXPIRED"
          - "step 3 (caused by step 2 reopening): Agreement.collections_stage NONE -> ADVERSE; Customer.adverse_agreement_count += 1; Customer.account_flag -> ADVERSE"
          - "step 4: append LoyaltyLedgerEntry(entry_type PAYMENT_REVERSAL, delta_points = -RenewalPayment.loyalty_points_awarded)"
        note: "Compensating action for the cure cascade; conserves both the cash identity and the point identity (see calculations.cash_allocation_identity)."
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /stores/{id}/day-close when the agreement's OPEN ReinstatementWindow has expires_at < clock_now"
        actor: system
        preconditions:
          - "a ReinstatementWindow with status OPEN exists on the agreement"
          - "clock_now > window.expires_at"
        side_effects:
          - "step 1: ReinstatementWindow OPEN -> EXPIRED"
          - "step 2 (caused by step 1): Agreement.payment_status DELINQUENT -> DEFAULTED; reinstatement rights are extinguished"
      - from: CURRENT
        to: CLOSED
        trigger: "POST /early-purchase-quotes/{id}/accept"
        actor: SalesAssociate | StoreManager
        preconditions:
          - "Agreement.possession_status == DELIVERED"
          - "quote status OPEN and clock_now <= quote.expires_at"
          - "payment_amount_cents == quote.payoff_amount_cents"
        side_effects:
          - "Agreement.early_purchase_paid_cents = quote.payoff_amount_cents"
          - "Agreement.possession_status DELIVERED -> OWNED (possession dimension)"
          - "any DeliveryOrder on this agreement with status SCHEDULED -> CANCELLED"
          - "any ServiceTicket on this agreement with status IN {SCHEDULED, SWAP_ISSUED} -> VOIDED"
          - "append LoyaltyLedgerEntry(entry_type EARLY_PAYOFF_BONUS, delta_points = EARLY_PAYOFF_BONUS_POINTS)"
      - from: CURRENT
        to: CLOSED
        trigger: "POST /agreements/{id}/renewal-payments whose allocation brings periods_paid up to renewal_count with no fee balance left (term completion)"
        actor: SalesAssociate | StoreManager | CollectionsAgent
        preconditions:
          - "Agreement.possession_status == DELIVERED"
          - "periods_paid + periods_advanced == renewal_count"
          - "late_fee_balance_cents == 0 and reinstatement_fee_balance_cents == 0 after the allocation"
        side_effects:
          - "Agreement.possession_status DELIVERED -> OWNED (possession dimension); the unit becomes SOLD"
          - "any leftover cents move to Customer.credit_balance_cents and are recorded in Agreement.customer_credit_contributed_cents"
      - from: CURRENT
        to: CLOSED
        trigger: "POST /return-inspections/{id}/grade (the return is only economically closed once the unit is graded)"
        actor: ServiceTechnician
        preconditions:
          - "Agreement.possession_status == RETURN_PENDING_INSPECTION"
          - "ReturnInspection.status == PENDING"
        side_effects:
          - "all money counters freeze at their current values; no further renewal may be posted"
      - from: DELINQUENT
        to: CLOSED
        trigger: "POST /return-inspections/{id}/grade for an agreement that was delinquent when the unit came back"
        actor: ServiceTechnician
        preconditions:
          - "Agreement.possession_status == RETURN_PENDING_INSPECTION"
          - "ReturnInspection.status == PENDING"
        side_effects:
          - "the OPEN ReinstatementWindow (if any) -> EXPIRED"
          - "Agreement.collections_stage -> NONE; the arrears balances freeze but stay visible on the closed row"
      - from: DEFAULTED
        to: CLOSED
        trigger: "POST /agreements/{id}/repossess"
        actor: CollectionsAgent
        preconditions:
          - "no ReinstatementWindow with status OPEN on the agreement"
          - "Agreement.paid_pct < StateRtoRule.repossession_paid_pct_limit"
          - "Agreement.possession_status IN {DELIVERED, SERVICE_SWAP_PENDING}"
          - "at least one CollectionContact row exists on the agreement"
          - "X-User-ID != Customer.verified_by_user_id (segregation of duties)"
        side_effects:
          - "Agreement.possession_status -> REPOSSESSED (possession dimension)"
          - "Agreement.collections_stage -> ADVERSE (already ADVERSE whenever the day-close default sweep preceded the repossession); Customer.adverse_agreement_count is RECOMPUTED as the number of that customer's agreements with collections_stage == ADVERSE, never incremented, so repossessing an already-ADVERSE agreement leaves the count unchanged; Customer.account_flag = ADVERSE while that count >= 1"

  - entity: Agreement
    state_field: possession_status
    initial_state: PENDING_DELIVERY
    terminal_states: [RETURNED, REPOSSESSED, OWNED]
    shape: branching
    transitions:
      - from: PENDING_DELIVERY
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/complete for a DELIVERY_SETUP order"
        actor: StoreManager | ServiceTechnician
        preconditions:
          - "DeliveryOrder.status == SCHEDULED and service_type == DELIVERY_SETUP"
          - "InventoryUnit.status == RESERVED"
          - "setup_completed == true when InventoryUnit.category == APPLIANCE"
        side_effects:
          - "Agreement.cycle_anchor_at = clock_now (billing starts on delivery, not on signing); current_period_due_at = cycle_anchor_at + PERIOD_DAYS[term_type] days"
          - "InventoryUnit.status RESERVED -> ON_RENT"
          - "Store.units_on_rent_count += 1"
      - from: DELIVERED
        to: SERVICE_SWAP_PENDING
        trigger: "POST /service-tickets/{id}/issue-swap"
        actor: ServiceTechnician
        preconditions:
          - "ServiceTicket.status == SCHEDULED and ServiceTicket.agreement_id == this agreement"
          - "Agreement.payment_status IN {CURRENT, DELINQUENT}"
        side_effects:
          - "step 2 (caused by ticket -> SWAP_ISSUED): Agreement.swap_count += 1"
          - "step 3 (caused by this agreement reaching SERVICE_SWAP_PENDING): the original InventoryUnit.status ON_RENT -> IN_SERVICE"
          - "step 4 (caused by step 3): Store.units_in_service_count += 1 while Store.units_on_rent_count stays unchanged, because the replacement unit took the vacated slot; when units_in_service_count >= Store.service_bay_capacity, Store.service_intake_open true -> false"
      - from: SERVICE_SWAP_PENDING
        to: DELIVERED
        trigger: "POST /service-tickets/{id}/resolve with resolution SWAPPED"
        actor: ServiceTechnician
        preconditions:
          - "ServiceTicket.status == SWAP_ISSUED"
        side_effects:
          - "Agreement.unit_id already points at ServiceTicket.replacement_unit_id (it moved at swap issuance) and is left unchanged here"
          - "original InventoryUnit.status IN_SERVICE -> AVAILABLE, rent_cycle_count += 1, condition_grade stepped down one notch (NEW -> GRADE_A -> GRADE_B -> GRADE_C -> GRADE_C)"
          - "Store.units_in_service_count -= 1; Store.service_intake_open -> true when units_in_service_count < service_bay_capacity"
          - "Agreement.service_credit_days += ServiceTicket.rent_credit_days"
      - from: DELIVERED
        to: RETURN_PENDING_INSPECTION
        trigger: "POST /agreements/{id}/return"
        actor: Customer | SalesAssociate
        preconditions:
          - "Agreement.payment_status IN {CURRENT, DELINQUENT}"
        side_effects:
          - "step 1: create ReturnInspection(status PENDING, return_reason VOLUNTARY_RETURN, unit_id = Agreement.unit_id); the payment dimension is NOT touched — it closes only when the inspection is graded"
          - "step 2 (caused by step 1 possession change): InventoryUnit.status ON_RENT -> RETURNED_PENDING_GRADE; residual_value_cents = PROVISIONAL variant of calculations.unit_residual_value; residual_valuation_basis NONE -> PROVISIONAL; Store.units_on_rent_count -= 1"
          - "step 3 (caused by step 2): every ServiceTicket with unit_id == that unit and status IN {SCHEDULED, SWAP_ISSUED} -> VOIDED"
          - "step 4 (caused by step 3): for each voided ticket that had a replacement_unit_id, that replacement InventoryUnit.status ON_RENT -> AVAILABLE with rent_cycle_count += 1"
      - from: SERVICE_SWAP_PENDING
        to: RETURN_PENDING_INSPECTION
        trigger: "POST /agreements/{id}/return while a swap is outstanding"
        actor: Customer | SalesAssociate
        preconditions:
          - "Agreement.payment_status IN {CURRENT, DELINQUENT}"
        side_effects:
          - "same four-step cascade as DELIVERED -> RETURN_PENDING_INSPECTION, plus Store.units_in_service_count -= 1 for the unit already in service"
      - from: RETURN_PENDING_INSPECTION
        to: RETURNED
        trigger: "POST /return-inspections/{id}/grade"
        actor: ServiceTechnician
        preconditions:
          - "ReturnInspection.status == PENDING"
          - "the agreement's InventoryUnit.status == RETURNED_PENDING_GRADE"
        side_effects:
          - "see the ReturnInspection machine for the grading cascade"
      - from: DELIVERED
        to: REPOSSESSED
        trigger: "POST /agreements/{id}/repossess"
        actor: CollectionsAgent
        preconditions:
          - "Agreement.payment_status == DEFAULTED and the payment-dimension preconditions hold"
        side_effects:
          - "create ReturnInspection(status PENDING, return_reason REPOSSESSION_RECOVERY, unit_id = Agreement.unit_id)"
          - "InventoryUnit.status ON_RENT -> RETURNED_PENDING_GRADE; residual_value_cents = PROVISIONAL variant; residual_valuation_basis -> PROVISIONAL; Store.units_on_rent_count -= 1"
      - from: DELIVERED
        to: OWNED
        trigger: "POST /early-purchase-quotes/{id}/accept"
        actor: SalesAssociate | StoreManager
        preconditions:
          - "the payment-dimension CURRENT -> CLOSED preconditions hold"
        side_effects:
          - "InventoryUnit.status ON_RENT -> SOLD; Store.units_on_rent_count -= 1"
          - "InventoryUnit.accumulated_rent_received_cents += Agreement.rent_applied_cents"

  - entity: InventoryUnit
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED, SOLD]
    shape: cyclic
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /agreements"
        actor: SalesAssociate
        preconditions:
          - "InventoryUnit.status == AVAILABLE"
          - "InventoryUnit.store_id has a StateRtoRule for its state_code"
        side_effects:
          - "Agreement created with the pinned pricing snapshot"
      - from: RESERVED
        to: ON_RENT
        trigger: "POST /delivery-orders/{id}/complete"
        actor: StoreManager | ServiceTechnician
        preconditions:
          - "the agreement's possession dimension transition PENDING_DELIVERY -> DELIVERED holds"
        side_effects:
          - "Store.units_on_rent_count += 1"
      - from: ON_RENT
        to: IN_SERVICE
        trigger: "POST /service-tickets/{id}/issue-swap (cascade step 3)"
        actor: ServiceTechnician
        preconditions:
          - "the unit is the Agreement.unit_id of the ticket's agreement"
        side_effects:
          - "Store.units_in_service_count += 1; Store.service_intake_open recomputed"
      - from: IN_SERVICE
        to: AVAILABLE
        trigger: "POST /service-tickets/{id}/resolve with resolution SWAPPED"
        actor: ServiceTechnician
        preconditions:
          - "ServiceTicket.status == SWAP_ISSUED"
        side_effects:
          - "rent_cycle_count += 1; condition_grade stepped down one notch; Store.units_in_service_count -= 1"
        note: "Cycle edge: the unit re-enters the rentable pool at a lower grade and a higher cycle count, which lowers every future agreement's renewal_rate_cents."
      - from: AVAILABLE
        to: ON_RENT
        trigger: "POST /service-tickets/{id}/issue-swap (replacement unit)"
        actor: ServiceTechnician
        preconditions:
          - "replacement unit status == AVAILABLE"
          - "replacement unit store_id == ServiceTicket.store_id"
          - "replacement unit category == original unit category"
        side_effects:
          - "replaced_unit_id = the serviced unit's id (self-referential link)"
      - from: ON_RENT
        to: RETURNED_PENDING_GRADE
        trigger: "POST /agreements/{id}/return or POST /agreements/{id}/repossess"
        actor: Customer | SalesAssociate | CollectionsAgent
        preconditions:
          - "the agreement's possession dimension leaves DELIVERED or SERVICE_SWAP_PENDING"
        side_effects:
          - "residual_value_cents = PROVISIONAL variant of calculations.unit_residual_value; residual_valuation_basis -> PROVISIONAL"
      - from: RETURNED_PENDING_GRADE
        to: AVAILABLE
        trigger: "POST /return-inspections/{id}/grade with assessed_grade IN {GRADE_A, GRADE_B, GRADE_C}"
        actor: ServiceTechnician
        preconditions:
          - "ReturnInspection.status == PENDING"
        side_effects:
          - "condition_grade = assessed_grade; rent_cycle_count += 1; residual_value_cents = FINAL variant; residual_valuation_basis PROVISIONAL -> FINAL"
        note: "Cycle edge closing the re-rent loop."
      - from: RETURNED_PENDING_GRADE
        to: RETIRED
        trigger: "POST /return-inspections/{id}/grade with assessed_grade UNRENTABLE"
        actor: ServiceTechnician
        preconditions:
          - "ReturnInspection.status == PENDING"
        side_effects:
          - "retired_reason -> UNRENTABLE_ON_GRADING; residual_value_cents = 0; residual_valuation_basis -> FINAL; ReturnInspection.depreciation_tier = WRITE_OFF"
      - from: ON_RENT
        to: SOLD
        trigger: "POST /early-purchase-quotes/{id}/accept"
        actor: SalesAssociate | StoreManager
        preconditions:
          - "the agreement's payment dimension CURRENT -> CLOSED holds"
        side_effects:
          - "accumulated_rent_received_cents += Agreement.rent_applied_cents"
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /delivery-orders/{id}/fail-attempt raising attempt_count to 3"
        actor: StoreManager | ServiceTechnician
        preconditions:
          - "DeliveryOrder.status == SCHEDULED and attempt_count == 2 before the call"
        side_effects:
          - "DeliveryOrder.status SCHEDULED -> FAILED_ATTEMPT; the reservation is released so another agreement may reserve the unit, while this agreement stays in PENDING_DELIVERY with its pricing snapshot intact"

  - entity: DeliveryOrder
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, SUPERSEDED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /delivery-orders/{id}/complete"
        actor: StoreManager | ServiceTechnician
        preconditions:
          - "InventoryUnit.status == RESERVED for a DELIVERY_SETUP order"
          - "setup_completed == true when the unit category is APPLIANCE"
        side_effects:
          - "completed_at = clock_now; the agreement's possession dimension advances"
      - from: SCHEDULED
        to: FAILED_ATTEMPT
        trigger: "POST /delivery-orders/{id}/fail-attempt"
        actor: StoreManager | ServiceTechnician
        preconditions:
          - "DeliveryOrder.status == SCHEDULED and attempt_count == 2 before the call (the first two failures leave the order SCHEDULED)"
        side_effects:
          - "attempt_count += 1; the crew's window is released so another order may occupy it; the reserved unit returns RESERVED -> AVAILABLE"
      - from: FAILED_ATTEMPT
        to: SUPERSEDED
        trigger: "POST /agreements/{id}/delivery-orders (rescheduling create)"
        actor: StoreManager
        preconditions:
          - "expected_agreement_version matches Agreement.version"
        side_effects:
          - "the new DeliveryOrder is created SCHEDULED"
        note: "Branch rejoin: the failed attempt is superseded rather than mutated back to SCHEDULED."
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /agreements/{id}/delivery-orders (rescheduling create)"
        actor: StoreManager
        preconditions:
          - "expected_agreement_version matches Agreement.version"
        side_effects:
          - "the prior order stops occupying its crew window"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /early-purchase-quotes/{id}/accept or POST /agreements/{id}/return (cascade)"
        actor: system
        preconditions:
          - "the agreement's payment dimension reaches CLOSED"
        side_effects:
          - "the crew window is released"

  - entity: ServiceTicket
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [RESOLVED, VOIDED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: SWAP_ISSUED
        trigger: "POST /service-tickets/{id}/issue-swap"
        actor: ServiceTechnician
        preconditions:
          - "replacement unit status == AVAILABLE, same store_id, same category as ServiceTicket.unit_id's unit"
          - "Agreement.possession_status == DELIVERED"
        side_effects:
          - "step 1: replacement_unit_id set; issued_by_user_id = X-User-ID; replacement InventoryUnit.status AVAILABLE -> ON_RENT with replaced_unit_id = ServiceTicket.unit_id"
          - "step 2 (caused by step 1): Agreement.possession_status DELIVERED -> SERVICE_SWAP_PENDING; Agreement.swap_count += 1"
          - "step 3 (caused by step 2): original InventoryUnit.status ON_RENT -> IN_SERVICE"
          - "step 4 (caused by step 3): Store.units_in_service_count += 1; Store.units_on_rent_count unchanged in total (the replacement took the slot); Store.service_intake_open -> false when units_in_service_count >= service_bay_capacity"
      - from: SCHEDULED
        to: RESOLVED
        trigger: "POST /service-tickets/{id}/resolve with resolution REPAIRED"
        actor: ServiceTechnician
        preconditions:
          - "ServiceTicket.status == SCHEDULED (no swap was issued)"
        side_effects:
          - "resolution = REPAIRED; rent_credit_days = the submitted value (0..30); Agreement.service_credit_days += rent_credit_days"
      - from: SWAP_ISSUED
        to: RESOLVED
        trigger: "POST /service-tickets/{id}/resolve with resolution SWAPPED"
        actor: ServiceTechnician
        preconditions:
          - "ServiceTicket.status == SWAP_ISSUED"
        side_effects:
          - "resolution = SWAPPED; the agreement's possession dimension returns to DELIVERED and the original unit returns to AVAILABLE"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /agreements/{id}/return, POST /agreements/{id}/repossess or POST /early-purchase-quotes/{id}/accept (cascade)"
        actor: system
        preconditions:
          - "the ticket's unit leaves ON_RENT"
        side_effects:
          - "store service capacity is released"
      - from: SWAP_ISSUED
        to: VOIDED
        trigger: "POST /agreements/{id}/return (cascade)"
        actor: system
        preconditions:
          - "the ticket's unit leaves ON_RENT or IN_SERVICE"
        side_effects:
          - "the replacement InventoryUnit.status ON_RENT -> AVAILABLE with rent_cycle_count += 1; Store.units_in_service_count -= 1"

  - entity: ReturnInspection
    state_field: status
    initial_state: PENDING
    terminal_states: [GRADED]
    shape: linear
    transitions:
      - from: PENDING
        to: GRADED
        trigger: "POST /return-inspections/{id}/grade"
        actor: ServiceTechnician
        preconditions:
          - "ReturnInspection.status == PENDING"
          - "the unit's status == RETURNED_PENDING_GRADE"
        side_effects:
          - "step 1: final_residual_value_cents = FINAL variant of calculations.unit_residual_value; depreciation_tier = calculations.depreciation_tier; re_rent_rate_cents = calculations.re_rent_rate; graded_by_user_id = X-User-ID"
          - "step 2 (caused by step 1): InventoryUnit moves RETURNED_PENDING_GRADE -> AVAILABLE (grades A/B/C) or -> RETIRED (UNRENTABLE), and InventoryUnit.residual_value_cents is overwritten with the FINAL value"
          - "step 3 (caused by step 2): Agreement.possession_status RETURN_PENDING_INSPECTION -> RETURNED"

  - entity: EarlyPurchaseQuote
    state_field: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, SUPERSEDED, EXPIRED]
    shape: branching
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /early-purchase-quotes/{id}/accept"
        actor: SalesAssociate | StoreManager
        preconditions:
          - "clock_now <= expires_at"
          - "Agreement.payment_status == CURRENT and possession_status == DELIVERED"
          - "payment_amount_cents == payoff_amount_cents"
        side_effects:
          - "the agreement closes, the unit is SOLD and an EARLY_PAYOFF_BONUS loyalty entry is appended"
      - from: OPEN
        to: SUPERSEDED
        trigger: "POST /agreements/{id}/early-purchase-quotes (a newer quote is issued)"
        actor: Customer | SalesAssociate
        preconditions:
          - "expected_agreement_version matches Agreement.version"
        side_effects:
          - "only the newest quote may be accepted"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /stores/{id}/day-close when expires_at < clock_now"
        actor: system
        preconditions:
          - "quote status == OPEN and clock_now > expires_at"
        side_effects:
          - "no further acceptance is possible; a new quote must be issued"

  - entity: ReinstatementWindow
    state_field: status
    initial_state: OPEN
    terminal_states: [USED, EXPIRED]
    shape: branching
    transitions:
      - from: OPEN
        to: USED
        trigger: "POST /agreements/{id}/renewal-payments that cures the delinquency (cascade step 2)"
        actor: SalesAssociate | CollectionsAgent
        preconditions:
          - "Agreement.payment_status reached CURRENT in this request"
          - "clock_now <= expires_at"
        side_effects:
          - "the collections campaign closes (see the Agreement payment dimension cascade)"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /stores/{id}/day-close when clock_now > expires_at, or POST /agreements/{id}/return while a window is open"
        actor: system
        preconditions:
          - "window status == OPEN"
        side_effects:
          - "Agreement.payment_status DELINQUENT -> DEFAULTED when the expiry came from day-close"
      - from: USED
        to: OPEN
        trigger: "POST /renewal-payments/{id}/reverse of the curing payment while clock_now <= expires_at"
        actor: StoreManager
        preconditions:
          - "the reversed payment is the one that marked this window USED"
          - "clock_now <= expires_at"
        side_effects:
          - "reinstatement rights are restored for the remainder of the window"
      - from: USED
        to: EXPIRED
        trigger: "POST /renewal-payments/{id}/reverse of the curing payment after expires_at"
        actor: StoreManager
        preconditions:
          - "the reversed payment is the one that marked this window USED"
          - "clock_now > expires_at"
        side_effects:
          - "Agreement.payment_status returns to DELINQUENT, and the next day-close moves it to DEFAULTED"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on Agreement.version only
# =============================================================================
concurrency_rules:
  - rule_id: quote-issue-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /agreements/{id}/early-purchase-quotes"
    occ_field: "expected_agreement_version"
    description: |
      Issuing an EarlyPurchaseQuote against an Agreement whose version has
      advanced since the client last read it is rejected. A newly issued quote
      legitimately supersedes the prior OPEN quote and re-pins the payoff
      economics (rent_applied_snapshot_cents, loyalty_tier_snapshot), so a
      writer holding a stale view would supersede a quote it never saw and
      hand the customer a payoff figure computed from outdated ledger state.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: delivery-order-reschedule-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /agreements/{id}/delivery-orders"
    occ_field: "expected_agreement_version"
    description: |
      Creating a DeliveryOrder against an Agreement whose version has advanced
      since the client last read it is rejected. A create legitimately
      supersedes the agreement's prior SCHEDULED or FAILED_ATTEMPT order and
      releases that crew window, so a writer with a stale view would cancel a
      dispatch it never observed.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#   All money is integer cents. All divisions that are not explicitly `ceil`
#   are round_half_up. No calculation may read `id` — every ordering below is
#   pinned on created_at ASC.
# =============================================================================
calculations:

  - name: agreement_pricing
    trigger: "POST /agreements — writes adjusted_cash_price_cents, renewal_rate_cents, rent_subtotal_cents, processing_fee_cents, total_of_payments_cents, monthly_equivalent_rate_cents"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED. Steps must run 1..9 exactly as written;
      # neither the rounding order (step 3 vs 5) nor the fee base (step 8) may
      # be rearranged.
      1. grade_factor  = GRADE_FACTOR[unit.condition_grade]
      2. cycle_factor  = max(0.60, 1 - 0.05 * unit.rent_cycle_count)
      3. adjusted_cash_price_cents = round_half_up(unit.cash_price_cents * grade_factor * cycle_factor)
         # ONE rounding, applied to the full product. Rounding after each factor
         # is forbidden.
      4. markup = TERM_MARKUP[term_type]
      5. target_total_cents = round_half_up(adjusted_cash_price_cents * markup)
      6. renewal_rate_cents = ceil(target_total_cents / renewal_count)
      7. rent_subtotal_cents = renewal_rate_cents * renewal_count
         # PINNED: round the per-period rate UP first, then multiply. The
         # disclosed subtotal therefore usually EXCEEDS target_total_cents
         # (round-per-line-then-sum, never sum-then-round).
      8. processing_fee_cents = min(state_rule.processing_fee_max_cents,
                                    round_half_up(rent_subtotal_cents * PROCESSING_FEE_PCT))
         # PINNED base: rent_subtotal_cents, i.e. the fee is computed on the
         # rent BEFORE the fee is folded in. The fee is capped by a state
         # maximum whose own cap tier appears to depend on the total, which is
         # why the base must be pinned; no fixed-point iteration is performed.
      9. total_of_payments_cents = rent_subtotal_cents + processing_fee_cents
      10. monthly_equivalent_rate_cents = term_type == WEEKLY
              ? round_half_up(renewal_rate_cents * 52 / 12)
              : renewal_rate_cents
      11. cost_of_rental_cents (disclosure read only) = total_of_payments_cents - adjusted_cash_price_cents
    input_set: "the single InventoryUnit named by unit_id in status AVAILABLE, and the StateRtoRule whose state_code == Store.state_code of that unit's store (pinned into state_code_snapshot / state_rule_version_snapshot)"
    constants:
      GRADE_FACTOR: { NEW: 1.00, GRADE_A: 0.85, GRADE_B: 0.70, GRADE_C: 0.55 }
      CYCLE_STEP: 0.05
      CYCLE_FLOOR: 0.60
      TERM_MARKUP: { WEEKLY: 2.20, MONTHLY: 1.95 }
      PROCESSING_FEE_PCT: 0.05
      PERIOD_DAYS: { WEEKLY: 7, MONTHLY: 30 }
    precision: "integer cents; round_half_up at steps 3, 5, 8, 10; ceil at step 6"
    variants: []

  - name: customer_verification_score
    trigger: "POST /customers/{id}/verify — writes Customer.verification_score before the decision is applied"
    algorithm: weighted_scoring
    formula: |
      score = (customer.employer_verified ? 40 : 0)
            + min(30, 5 * floor(customer.residence_months / 6))
            + 10 * min(3, customer.verified_reference_count)
            + (customer.monthly_income_cents >= 250000 ? 20
               : customer.monthly_income_cents >= 150000 ? 10 : 0)
      pass = score >= VERIFICATION_PASS_SCORE
            and customer.verified_reference_count >= MIN_VERIFIED_REFERENCES
            and customer.government_id_verified == true
    input_set: "CustomerReference rows with customer_id == this customer and check_status == VERIFIED (all other check_status values are excluded); no credit bureau data of any kind participates"
    constants:
      VERIFICATION_PASS_SCORE: 70
      MIN_VERIFIED_REFERENCES: 2
      REFERENCE_POINTS_EACH: 10
      REFERENCE_POINTS_CAP: 30
    precision: "integer points; no rounding (floor on the residence term)"
    variants: []

  - name: late_fee_assessment
    trigger: "POST /stores/{id}/day-close on each CURRENT -> DELINQUENT transition — increments Agreement.late_fee_assessed_cents"
    algorithm: threshold
    formula: |
      days_late = floor((clock_now - agreement.current_period_due_at) / 86400s)
      if days_late <= state_rule.late_fee_grace_days: no fee, no transition
      if agreement.late_fee_period_index_last >= agreement.periods_paid + 1: no fee (already assessed for this period)
      fee_cents = min(state_rule.late_fee_max_cents,
                      round_half_up(agreement.renewal_rate_cents * state_rule.late_fee_pct))
    input_set: "agreements with store_id == the store, payment_status IN {CURRENT, DELINQUENT}, possession_status IN {DELIVERED, SERVICE_SWAP_PENDING} and cycle_anchor_at not null, processed in created_at ASC order"
    constants: {}
    precision: "integer cents, round_half_up; strict `>` comparison against the grace day count"
    variants: []

  - name: reinstatement_window_length
    trigger: "POST /stores/{id}/day-close when a ReinstatementWindow is opened — writes ReinstatementWindow.window_days and expires_at"
    algorithm: threshold
    formula: |
      threshold_cents = state_rule.reinstate_threshold_months * agreement.monthly_equivalent_rate_cents
      window_days = agreement.rent_applied_cents >= threshold_cents
                      ? state_rule.reinstate_days_long
                      : state_rule.reinstate_days_short
      expires_at = opened_at + window_days days
    input_set: "only the agreement being marked DELINQUENT; rent_applied_cents excludes partial_credit_cents, late fees and reinstatement fees"
    constants: {}
    precision: "exact integer comparison; `>=` at the threshold (a customer sitting exactly at two months' equivalent gets the LONG window)"
    variants: []

  - name: renewal_payment_allocation
    trigger: "POST /agreements/{id}/renewal-payments — writes every RenewalPayment.allocation_* field and the agreement's ledger fields"
    algorithm: waterfall_allocation
    formula: |
      # Five ordered buckets. Buckets 1 and 2 are arrears, bucket 3 is rent,
      # buckets 4 and 5 split the remainder. Order is PINNED.
      rem = payment.amount_cents
      1. allocation_late_fee_cents = min(rem, agreement.late_fee_balance_cents); rem -= it
      2. window = the ReinstatementWindow on this agreement with status == OPEN
                  (at most one can exist; if several ever coexisted, take
                  created_at ASC first)
         if window exists and clock_now <= window.expires_at:
             allocation_reinstatement_fee_cents = min(rem, agreement.reinstatement_fee_balance_cents); rem -= it
         else:
             allocation_reinstatement_fee_cents = 0
      3. payment.partial_credit_before_cents = agreement.partial_credit_cents
         rent_pool = rem + agreement.partial_credit_cents      # carried-forward
         periods_advanced = min(floor(rent_pool / agreement.renewal_rate_cents),
                                agreement.renewal_count - agreement.periods_paid)
         allocation_rent_cents = periods_advanced * agreement.renewal_rate_cents
         leftover = rent_pool - allocation_rent_cents
      4. if agreement.periods_paid + periods_advanced < agreement.renewal_count:
             allocation_partial_credit_cents = leftover
             allocation_customer_credit_cents = 0
             agreement.partial_credit_cents = leftover
      5. else:                                                 # term completed
             allocation_partial_credit_cents = 0
             allocation_customer_credit_cents = leftover
             agreement.partial_credit_cents = 0
             customer.credit_balance_cents += leftover
             agreement.customer_credit_contributed_cents += leftover
      6. days_late = max(0, floor((clock_now - agreement.current_period_due_at) / 86400s))
      7. cure test (only when agreement.payment_status == DELINQUENT):
             late_fee_balance_cents == 0
             and reinstatement_fee_balance_cents == 0
             and cycle_anchor_at + (periods_paid_after + 1) * PERIOD_DAYS > clock_now
    input_set: "the single Agreement named in the path plus its ReinstatementWindow rows with status == OPEN; REVERSED payments never participate"
    constants:
      PERIOD_DAYS: { WEEKLY: 7, MONTHLY: 30 }
    precision: "integer cents; floor on the period division; no rounding anywhere (a partial period is never rounded up into a paid period)"
    variants: []

  - name: early_purchase_payoff
    trigger: "POST /agreements/{id}/early-purchase-quotes — writes every EarlyPurchaseQuote computed field"
    algorithm: forward_looking
    formula: |
      rent_applied_snapshot_cents = agreement.rent_applied_cents
      # variant selection is by state law, see variants[]
      pre_discount_cents = <variant output>
      loyalty_tier_snapshot = customer.loyalty_tier            # pinned at issuance
      loyalty_discount_cents = round_half_up(pre_discount_cents * LOYALTY_DISCOUNT_PCT[loyalty_tier_snapshot])
      late_fee_component_cents = agreement.late_fee_balance_cents + agreement.reinstatement_fee_balance_cents
      payoff_amount_cents = pre_discount_cents - loyalty_discount_cents + late_fee_component_cents
      expires_at = issued_at + QUOTE_VALID_DAYS days
      # PINNED: the loyalty discount is computed on pre_discount_cents ONLY.
      # Arrears are added AFTER the discount and are never discounted.
    input_set: "the Agreement in payment_status CURRENT and possession_status DELIVERED, its Customer, and the StateRtoRule whose state_code == Agreement.state_code_snapshot (NOT the store's current state rule row if it has since been re-keyed)"
    constants:
      LOYALTY_DISCOUNT_PCT: { STANDARD: 0.00, SILVER: 0.03, GOLD: 0.05 }
      QUOTE_VALID_DAYS: 7
    precision: "integer cents, round_half_up on the discount; payoff floor is 0"
    variants:
      - name: PCT_OF_REMAINING
        when: "StateRtoRule(Agreement.state_code_snapshot).early_purchase_formula == PCT_OF_REMAINING"
        difference: "pre_discount_cents = round_half_up((agreement.total_of_payments_cents - rent_applied_snapshot_cents) * state_rule.early_purchase_pct) — a percentage of what is still owed under the disclosed total, so the processing fee and the whole rental markup remain in the base."
      - name: CASH_PRICE_MINUS_CREDIT
        when: "StateRtoRule(Agreement.state_code_snapshot).early_purchase_formula == CASH_PRICE_MINUS_CREDIT"
        difference: "pre_discount_cents = max(0, agreement.adjusted_cash_price_cents - round_half_up(rent_applied_snapshot_cents * state_rule.rent_credit_pct)) — the depreciated cash price less a credit for rent already paid, so neither the markup nor the processing fee is in the base. For identical ledger state this yields a materially different payoff than PCT_OF_REMAINING."

  - name: unit_residual_value
    trigger: "PROVISIONAL variant on POST /agreements/{id}/return and POST /agreements/{id}/repossess; FINAL variant on POST /return-inspections/{id}/grade — writes InventoryUnit.residual_value_cents, residual_valuation_basis and ReturnInspection.final_residual_value_cents"
    algorithm: decay_function
    formula: |
      next_cycle_factor = max(0.60, 1 - 0.05 * (unit.rent_cycle_count + 1))
      residual = round_half_up(unit.cash_price_cents * GRADE_FACTOR[grade_used] * next_cycle_factor)
                 - deductions
      # grade_used and deductions differ per variant, see variants[].
    input_set: "the single InventoryUnit leaving the customer's possession; accumulated_rent_received_cents does NOT reduce the residual"
    constants:
      GRADE_FACTOR: { NEW: 1.00, GRADE_A: 0.85, GRADE_B: 0.70, GRADE_C: 0.55 }
      MISSING_PART_DEDUCTION_CENTS: 2500
      GRADE_STEP_DOWN: { NEW: GRADE_A, GRADE_A: GRADE_B, GRADE_B: GRADE_C, GRADE_C: GRADE_C }
    precision: "integer cents, round_half_up on the product, then integer subtraction; floor at 0"
    variants:
      - name: PROVISIONAL_AT_RETURN
        when: "the unit's status moves ON_RENT -> RETURNED_PENDING_GRADE (voluntary return or repossession recovery), before any physical inspection"
        difference: "grade_used = GRADE_STEP_DOWN[unit.condition_grade] (one notch down, assumed wear) and deductions = 0, because damage and missing parts are unknown. Writes residual_valuation_basis = PROVISIONAL."
      - name: FINAL_AT_GRADING
        when: "POST /return-inspections/{id}/grade supplies an assessed_grade"
        difference: "grade_used = inspection.assessed_grade (which may be better or worse than the assumed step-down) and deductions = inspection.damage_deduction_cents + inspection.missing_parts_count * MISSING_PART_DEDUCTION_CENTS. assessed_grade == UNRENTABLE short-circuits the whole formula to residual 0. Writes residual_valuation_basis = FINAL, overwriting the PROVISIONAL number, and the delta between the two is the store's grading variance."

  - name: re_rent_rate
    trigger: "POST /return-inspections/{id}/grade — writes ReturnInspection.re_rent_rate_cents"
    algorithm: tiered_pricing
    formula: |
      re_rent_rate_cents = ceil(round_half_up(final_residual_value_cents * TERM_MARKUP[WEEKLY])
                                / RE_RENT_RENEWAL_COUNT)
      # UNRENTABLE grades produce 0 (residual is 0), never a division by a
      # negative or a negative rate.
    input_set: "the graded ReturnInspection only; the projection always assumes a WEEKLY 52-renewal re-rent regardless of the closed agreement's term_type"
    constants:
      TERM_MARKUP: { WEEKLY: 2.20 }
      RE_RENT_RENEWAL_COUNT: 52
    precision: "integer cents; round_half_up on the markup product, then ceil on the division"
    variants: []

  - name: depreciation_tier
    trigger: "POST /return-inspections/{id}/grade — writes ReturnInspection.depreciation_tier"
    algorithm: threshold
    formula: |
      ratio = final_residual_value_cents / unit.cash_price_cents   # exact rational, not rounded
      if final_residual_value_cents == 0: WRITE_OFF
      elif ratio >= 0.80: TIER_1
      elif ratio >= 0.60: TIER_2
      else: TIER_3
    input_set: "the graded ReturnInspection and its unit's original cash_price_cents (never the adjusted price)"
    constants:
      TIER_1_MIN_RATIO: 0.80
      TIER_2_MIN_RATIO: 0.60
    precision: "the ratio is compared exactly; `>=` at both band edges"
    variants: []

  - name: loyalty_points_accrual
    trigger: "POST /agreements/{id}/renewal-payments — writes RenewalPayment.loyalty_points_awarded and appends a LoyaltyLedgerEntry"
    algorithm: aggregation
    formula: |
      tier_at_posting = customer.loyalty_tier          # BEFORE this payment's points
      if periods_advanced == 0: points = 0             # partial money earns nothing
      else:
        points = floor(allocation_rent_cents / 100) * TIER_MULTIPLIER[tier_at_posting]
        if days_late == 0: points += ON_TIME_BONUS_POINTS
      if points != 0:
        append LoyaltyLedgerEntry(entry_type PAYMENT_ACCRUAL, delta_points = points,
                                  balance_after = customer.loyalty_points_balance + points)
        customer.loyalty_points_balance  += points
        customer.loyalty_points_lifetime += points
        customer.loyalty_tier = TIER_OF(customer.loyalty_points_lifetime)   # AFTER the accrual
      # PINNED: the multiplier reads the tier as it stood BEFORE this payment,
      # so a lump-sum payment of N periods earns strictly less than N separate
      # on-time payments of one period each (fewer bonuses, no tier ratchet
      # mid-way).
      TIER_OF(lifetime) = lifetime >= 500 ? GOLD : lifetime >= 200 ? SILVER : STANDARD
    input_set: "the single POSTED payment just allocated; REVERSED payments are excluded and are compensated by an explicit PAYMENT_REVERSAL entry"
    constants:
      TIER_MULTIPLIER: { STANDARD: 1, SILVER: 2, GOLD: 3 }
      ON_TIME_BONUS_POINTS: 25
      POINTS_PER_CENTS: 100
      SILVER_LIFETIME_MIN: 200
      GOLD_LIFETIME_MIN: 500
      EARLY_PAYOFF_BONUS_POINTS: 500
    precision: "integer points; floor on the cents division"
    variants: []

  - name: collection_contact_window_count
    trigger: "POST /agreements/{id}/collection-contacts — evaluated before the row is appended, and rewritten into Agreement.collection_contact_count_7d afterwards"
    algorithm: aggregation
    formula: |
      count = |{ c in CollectionContact :
                 c.agreement_id == agreement.id
                 and c.contacted_at >  clock_now - 7 days      # exclusive lower bound
                 and c.contacted_at <= clock_now }|            # inclusive upper bound
      permitted = count < state_rule.max_collection_contacts_per_week
      quiet_hour = utc_hour(clock_now) >= state_rule.quiet_hours_start_utc_hour
                   or utc_hour(clock_now) < state_rule.quiet_hours_end_utc_hour
    input_set: "CollectionContact rows on this agreement only (contacts on the customer's other agreements do not count); the window is half-open (lower exclusive, upper inclusive) so a contact made exactly 7 days ago has already fallen out"
    constants:
      ROLLING_WINDOW_DAYS: 7
    precision: "integer count; strict `<` against the state maximum, so the Nth contact in a window of size N is refused"
    variants: []

  - name: repossession_equity_check
    trigger: "POST /agreements/{id}/repossess — reads Agreement.paid_pct"
    algorithm: threshold
    formula: |
      paid_pct = round_half_up(agreement.rent_applied_cents / agreement.total_of_payments_cents, 4)
      prohibited = paid_pct >= state_rule.repossession_paid_pct_limit
      # partial_credit_cents, late fees and reinstatement fees are EXCLUDED from
      # the numerator: only completed renewal periods build equity.
    input_set: "the single Agreement in payment_status DEFAULTED with no OPEN ReinstatementWindow; the StateRtoRule pinned in state_code_snapshot"
    constants: {}
    precision: "4 decimal places, round_half_up; `>=` at the limit (a customer sitting exactly at the limit is protected)"
    variants: []

  - name: crew_window_conflict
    trigger: "POST /agreements/{id}/delivery-orders — decides ERR_CREW_WINDOW_CONFLICT (validations priority 39)"
    algorithm: threshold
    formula: |
      # Half-open intervals with an ASYMMETRIC buffer: the buffer extends only
      # the EXISTING order's tail, never the new order's head.
      conflict = exists existing in DeliveryOrder :
                   existing.crew_id == new.crew_id
                   and existing.agreement_id != new.agreement_id
                   # the agreement's own prior order was already SUPERSEDED by
                   # this create, so it cannot block its own replacement
                   and existing.status == SCHEDULED
                   and new.window_start_at <  existing.window_end_at + CREW_TRAVEL_BUFFER_MINUTES minutes
                   and new.window_end_at   >  existing.window_start_at
      # Consequences of the asymmetry: an order starting exactly at
      # existing.window_end_at + 45 minutes is ACCEPTED, while an order ENDING
      # exactly at existing.window_start_at is also accepted (strict `>`), so
      # back-to-back-before is legal and back-to-back-after is not.
    input_set: "DeliveryOrder rows with the same crew_id, an agreement_id different from the new order's, and status == SCHEDULED; FAILED_ATTEMPT, SUPERSEDED and COMPLETED orders never block a window"
    constants:
      CREW_TRAVEL_BUFFER_MINUTES: 45
    precision: "minute arithmetic on UTC instants; strict `<` on the buffered tail and strict `>` on the head"
    variants: []

  - name: service_bay_overlap_count
    trigger: "POST /agreements/{id}/service-tickets — decides ERR_SERVICE_CAPACITY_EXCEEDED (validations priority 41)"
    algorithm: aggregation
    formula: |
      # CLOSED intervals, deliberately the opposite convention to
      # crew_window_conflict: touching endpoints DO collide here.
      overlaps = |{ t in ServiceTicket :
                    t.store_id == store.id
                    and t.status IN {SCHEDULED, SWAP_ISSUED}
                    and new.window_start_at <= t.window_end_at
                    and new.window_end_at   >= t.window_start_at }|
      permitted = overlaps < store.service_bay_capacity
    input_set: "ServiceTicket rows at the same store with status IN {SCHEDULED, SWAP_ISSUED}; RESOLVED and VOIDED tickets release their bay immediately"
    constants: {}
    precision: "integer count; `<=`/`>=` on both edges (closed intervals) and strict `<` against the capacity"
    variants: []

  - name: cash_allocation_identity
    trigger: "invariant — must hold after every POST /agreements/{id}/renewal-payments and every POST /renewal-payments/{id}/reverse"
    algorithm: invariant
    formula: |
      sum(p.amount_cents for p in RenewalPayment
          where p.agreement_id == A.id and p.status == POSTED)
        == A.rent_applied_cents
         + A.late_fee_paid_cents
         + A.reinstatement_fee_paid_cents
         + A.partial_credit_cents
         + A.customer_credit_contributed_cents
    input_set: "one Agreement and its RenewalPayment rows with status == POSTED (REVERSED rows drop out of both sides simultaneously)"
    constants: {}
    precision: "exact integer equality — no cent may be created or destroyed by a posting or its reversal"
    variants: []

  - name: loyalty_points_identity
    trigger: "invariant — must hold after every loyalty-affecting call (payment posting, payment reversal, early-payoff acceptance)"
    algorithm: invariant
    formula: |
      C.loyalty_points_balance == sum(e.delta_points for e in LoyaltyLedgerEntry
                                      where e.customer_id == C.id)
      and C.loyalty_points_lifetime == sum(e.delta_points for e in LoyaltyLedgerEntry
                                           where e.customer_id == C.id and e.delta_points > 0)
    input_set: "one Customer and every LoyaltyLedgerEntry row referencing it; the append-only log is the single source of truth for the balance"
    constants: {}
    precision: "exact integer equality; a reversal must emit the exact negative of the accrual it compensates"
    variants: []

  - name: unit_possession_identity
    trigger: "invariant — must hold after every possession-affecting call (delivery completion, swap issuance, swap resolution, return, repossession, early-purchase acceptance)"
    algorithm: invariant
    formula: |
      |{ u in InventoryUnit : u.store_id == S.id and u.status == ON_RENT }|
        == |{ A in Agreement : A.store_id == S.id
              and A.possession_status IN {DELIVERED, SERVICE_SWAP_PENDING} }|
      and Store.units_on_rent_count == the left-hand count
      and Store.units_in_service_count == |{ u : u.store_id == S.id and u.status == IN_SERVICE }|
    input_set: "one Store, its InventoryUnit rows and its Agreement rows; units in RESERVED, IN_SERVICE, RETURNED_PENDING_GRADE, RETIRED or SOLD are excluded from the left side"
    constants: {}
    precision: "exact integer equality — a swap moves possession from one unit to another without ever changing the count of units in customers' hands"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing row decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "every path id resolves, validated left-to-right: store, customer, customer-reference, inventory-unit, agreement, delivery-order, service-ticket, return-inspection, renewal-payment, early-purchase-quote, state-rto-rule, loyalty-ledger-entry"
    error_id: ERR_STORE_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_REFERENCE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DELIVERY_ORDER_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_STATE_RULE_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: auth
    check: "when X-User-Role == Customer, X-User-ID equals Customer.id of the addressed customer, or Agreement.customer_id of the addressed agreement / quote / ticket"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /customers/{id}, GET /agreements/{id}, GET /agreements/{id}/disclosure, POST /agreements/{id}/early-purchase-quotes, POST /early-purchase-quotes/{id}/accept, POST /agreements/{id}/return, POST /agreements/{id}/service-tickets"
  - priority: 6
    category: business_constraint
    check: "request body parses, required fields present, enum members legal, integers non-negative, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 7
    category: existence
    check: "every FK supplied in the body resolves (customer_id, unit_id, crew_id, replacement_unit_id)"
    error_id: ERR_CUSTOMER_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_CREW_NOT_FOUND
    http_status: 404
    applies_to: "POST /agreements, POST /agreements/{id}/delivery-orders, POST /service-tickets/{id}/issue-swap"
  - priority: 8
    category: business_referential
    check: "a StateRtoRule row exists whose state_code equals the submitted state_code (store creation), the Store.state_code of the unit (agreement creation) or the Customer.state_code (verification) — a store may not be opened in an unregulated state and an agreement is always priced by the STORE's state rule, never the customer's"
    error_id: ERR_STATE_RULE_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /stores, POST /agreements, POST /customers/{id}/verify"
  - priority: 9
    category: business_safety
    check: "no credit_score field is present in the verification body when StateRtoRule.credit_inquiry_prohibited == true for the customer's state"
    error_id: ERR_CREDIT_REPORT_PROHIBITED
    http_status: 422
    applies_to: "POST /customers/{id}/verify"
  - priority: 10
    category: business_safety
    check: "X-User-ID differs from Customer.verified_by_user_id (the officer who approved verification may not authorize repossession)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /agreements/{id}/repossess"
  - priority: 11
    category: state
    check: "expected_agreement_version equals Agreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /agreements/{id}/early-purchase-quotes, POST /agreements/{id}/delivery-orders"
  - priority: 12
    category: state
    check: "Agreement.payment_status is legal for the operation: payments and quotes require CURRENT or DELINQUENT (quotes require CURRENT); nothing may be written to a CLOSED agreement; repossession requires DEFAULTED"
    error_id: ERR_AGREEMENT_CLOSED | ERR_AGREEMENT_DEFAULTED | ERR_AGREEMENT_NOT_CURRENT | ERR_AGREEMENT_NOT_DEFAULTED
    http_status: 409
    applies_to: "POST /agreements/{id}/renewal-payments, POST /agreements/{id}/early-purchase-quotes, POST /early-purchase-quotes/{id}/accept, POST /agreements/{id}/return, POST /agreements/{id}/repossess, POST /agreements/{id}/service-tickets, POST /agreements/{id}/delivery-orders, POST /agreements/{id}/collection-contacts"
  - priority: 13
    category: state
    check: "Agreement.possession_status is legal for the operation (delivery completion requires PENDING_DELIVERY; renewal payments, swaps, quotes and payoff acceptance require DELIVERED or SERVICE_SWAP_PENDING, i.e. cycle_anchor_at is set; returns and repossession require DELIVERED or SERVICE_SWAP_PENDING)"
    error_id: ERR_POSSESSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /agreements/{id}/renewal-payments, POST /delivery-orders/{id}/complete, POST /service-tickets/{id}/issue-swap, POST /agreements/{id}/early-purchase-quotes, POST /early-purchase-quotes/{id}/accept, POST /agreements/{id}/return, POST /agreements/{id}/repossess"
  - priority: 14
    category: state
    check: "InventoryUnit.status is legal for the operation: AVAILABLE to reserve on agreement creation, RESERVED to deliver, RETURNED_PENDING_GRADE to grade. Replacement-unit eligibility on issue-swap is NOT decided here — it belongs entirely to priority 42, so a swap onto an ON_RENT unit returns ERR_REPLACEMENT_UNIT_INVALID (422) and never ERR_UNIT_NOT_AVAILABLE"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /agreements, POST /delivery-orders/{id}/complete, POST /return-inspections/{id}/grade"
  - priority: 15
    category: state
    check: "DeliveryOrder.status == SCHEDULED for complete and fail-attempt"
    error_id: ERR_DELIVERY_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/complete, POST /delivery-orders/{id}/fail-attempt"
  - priority: 16
    category: state
    check: "ServiceTicket.status == SCHEDULED for issue-swap; SCHEDULED or SWAP_ISSUED for resolve"
    error_id: ERR_TICKET_STATE_INVALID
    http_status: 409
    applies_to: "POST /service-tickets/{id}/issue-swap, POST /service-tickets/{id}/resolve"
  - priority: 17
    category: state
    check: "ReturnInspection.status == PENDING"
    error_id: ERR_INSPECTION_ALREADY_GRADED
    http_status: 409
    applies_to: "POST /return-inspections/{id}/grade"
  - priority: 18
    category: state
    check: "EarlyPurchaseQuote.status == OPEN"
    error_id: ERR_QUOTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /early-purchase-quotes/{id}/accept"
  - priority: 19
    category: business_temporal
    check: "clock_now <= EarlyPurchaseQuote.expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /early-purchase-quotes/{id}/accept"
  - priority: 20
    category: state
    check: "CustomerReference.check_status == PENDING"
    error_id: ERR_REFERENCE_ALREADY_CHECKED
    http_status: 409
    applies_to: "POST /customer-references/{id}/check"
  - priority: 21
    category: state
    check: "RenewalPayment.status == POSTED"
    error_id: ERR_PAYMENT_NOT_REVERSIBLE
    http_status: 409
    applies_to: "POST /renewal-payments/{id}/reverse"
  - priority: 22
    category: business_safety
    check: "no ReinstatementWindow with status == OPEN exists on the agreement (reinstatement rights outrank repossession)"
    error_id: ERR_REINSTATEMENT_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /agreements/{id}/repossess"
  - priority: 23
    category: business_safety
    check: "Agreement.paid_pct < StateRtoRule.repossession_paid_pct_limit (equity protection)"
    error_id: ERR_REPOSSESSION_EQUITY_PROTECTED
    http_status: 422
    applies_to: "POST /agreements/{id}/repossess"
  - priority: 24
    category: business_referential
    check: "at least one CollectionContact row exists on the agreement (documented pre-repossession notice)"
    error_id: ERR_COLLECTION_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /agreements/{id}/repossess"
  - priority: 25
    category: state
    check: "Agreement.payment_status IN {DELINQUENT, DEFAULTED} — a current account may not be worked by collections"
    error_id: ERR_COLLECTION_NOT_DELINQUENT
    http_status: 409
    applies_to: "POST /agreements/{id}/collection-contacts"
  - priority: 26
    category: business_safety
    check: "the logical clock's UTC hour is outside the state's quiet hours (permitted when quiet_hours_end_utc_hour <= hour < quiet_hours_start_utc_hour)"
    error_id: ERR_QUIET_HOURS_VIOLATION
    http_status: 422
    applies_to: "POST /agreements/{id}/collection-contacts"
  - priority: 27
    category: business_safety
    check: "calculations.collection_contact_window_count < StateRtoRule.max_collection_contacts_per_week"
    error_id: ERR_CONTACT_FREQUENCY_EXCEEDED
    http_status: 422
    applies_to: "POST /agreements/{id}/collection-contacts"
  - priority: 28
    category: business_referential
    check: "the requested channel is usable: PHONE/SMS need a non-empty Customer.phone, EMAIL needs a non-empty Customer.email, IN_PERSON needs Customer.in_person_contact_consent == true"
    error_id: ERR_CONTACT_CHANNEL_UNAVAILABLE
    http_status: 422
    applies_to: "POST /agreements/{id}/collection-contacts"
  - priority: 29
    category: business_safety
    check: "disclosure_acknowledged == true when StateRtoRule.disclosure_requires_total_of_payments == true"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /agreements"
  - priority: 30
    category: business_constraint
    check: "Customer.verification_status == VERIFIED"
    error_id: ERR_CUSTOMER_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /agreements"
  - priority: 31
    category: business_constraint
    check: "Customer.government_id_verified == true and Customer.verified_reference_count >= 2 on an APPROVE decision"
    error_id: ERR_INSUFFICIENT_REFERENCES
    http_status: 422
    applies_to: "POST /customers/{id}/verify"
  - priority: 32
    category: business_constraint
    check: "calculations.customer_verification_score >= 70 on an APPROVE decision"
    error_id: ERR_VERIFICATION_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /customers/{id}/verify"
  - priority: 33
    category: business_constraint
    check: "renewal_count <= StateRtoRule.max_term_renewals for the store's state"
    error_id: ERR_TERM_EXCEEDS_STATE_CAP
    http_status: 422
    applies_to: "POST /agreements"
  - priority: 34
    category: business_constraint
    check: "serial_number is unique within store_id; state_code is unique across StateRtoRule rows"
    error_id: ERR_DUPLICATE_SERIAL | ERR_DUPLICATE_STATE_RULE
    http_status: 409
    applies_to: "POST /stores/{id}/inventory-units, POST /state-rto-rules"
  - priority: 35
    category: business_referential
    check: "DeliveryCrew.store_id == Agreement.store_id and DeliveryCrew.status == ACTIVE"
    error_id: ERR_CREW_STORE_MISMATCH | ERR_CREW_INACTIVE
    http_status: 422
    applies_to: "POST /agreements/{id}/delivery-orders"
  - priority: 36
    category: business_safety
    check: "DeliveryCrew.setup_certified == true when the agreement's unit category == APPLIANCE and service_type == DELIVERY_SETUP"
    error_id: ERR_CREW_NOT_SETUP_CERTIFIED
    http_status: 422
    applies_to: "POST /agreements/{id}/delivery-orders"
  - priority: 37
    category: business_safety
    check: "setup_completed == true when the delivered unit's category == APPLIANCE"
    error_id: ERR_SETUP_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /delivery-orders/{id}/complete"
  - priority: 38
    category: business_temporal
    check: "window_end_at is strictly after window_start_at"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /agreements/{id}/delivery-orders, POST /agreements/{id}/service-tickets"
  - priority: 39
    category: business_temporal
    check: "the crew has no other DeliveryOrder with status SCHEDULED — excluding any order on this same agreement, which this create has already superseded — whose interval collides under the asymmetric buffer rule: reject when new.window_start_at < existing.window_end_at + CREW_TRAVEL_BUFFER_MINUTES and new.window_end_at > existing.window_start_at (half-open intervals; the buffer extends only the existing order's tail)"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /agreements/{id}/delivery-orders"
  - priority: 40
    category: business_referential
    check: "Store.service_intake_open == true"
    error_id: ERR_SERVICE_INTAKE_CLOSED
    http_status: 409
    applies_to: "POST /agreements/{id}/service-tickets"
  - priority: 41
    category: business_temporal
    check: "the count of ServiceTickets at the store with status IN {SCHEDULED, SWAP_ISSUED} whose CLOSED intervals intersect the requested one (new.window_start_at <= existing.window_end_at AND new.window_end_at >= existing.window_start_at — touching endpoints DO collide) is strictly below Store.service_bay_capacity"
    error_id: ERR_SERVICE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /agreements/{id}/service-tickets"
  - priority: 42
    category: business_referential
    check: "the replacement unit is in status AVAILABLE, has store_id == ServiceTicket.store_id and category == the serviced unit's category"
    error_id: ERR_REPLACEMENT_UNIT_INVALID
    http_status: 422
    applies_to: "POST /service-tickets/{id}/issue-swap"
  - priority: 43
    category: business_constraint
    check: "resolution REPAIRED requires ticket status SCHEDULED; resolution SWAPPED requires ticket status SWAP_ISSUED"
    error_id: ERR_TICKET_RESOLUTION_MISMATCH
    http_status: 422
    applies_to: "POST /service-tickets/{id}/resolve"
  - priority: 44
    category: business_fiscal
    check: "amount_cents >= 1"
    error_id: ERR_INVALID_PAYMENT_AMOUNT
    http_status: 422
    applies_to: "POST /agreements/{id}/renewal-payments"
  - priority: 45
    category: business_fiscal
    check: "amount_cents <= total_of_payments_cents - rent_applied_cents + late_fee_balance_cents + reinstatement_fee_balance_cents (no overpayment beyond the disclosed total plus arrears)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /agreements/{id}/renewal-payments"
  - priority: 46
    category: business_fiscal
    check: "payment_amount_cents == EarlyPurchaseQuote.payoff_amount_cents exactly"
    error_id: ERR_PAYOFF_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /early-purchase-quotes/{id}/accept"

# =============================================================================
# §1.5 Endpoint Table (52 endpoints; flat peer collections, api_prefix "")
#      Path parameters are always literally {id}; nested reads exist so every FK
#      in §1.1 is reverse-reachable.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- test clock
  - method: POST
    path: /_clock/set_current_utc
