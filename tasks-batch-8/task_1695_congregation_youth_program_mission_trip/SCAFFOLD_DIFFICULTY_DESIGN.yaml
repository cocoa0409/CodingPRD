  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_decide_on_denied_with_empty_fund
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_APPLICATION_STATE_FORBIDS_ACTION]
          - errors[ERR_SCHOLARSHIP_FUND_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): decide-APPROVE on a
          DENIED application while the fund is exhausted must return the STATE
          error (priority 6) ERR_APPLICATION_STATE_FORBIDS_ACTION, not the
          FISCAL error (priority 12) ERR_SCHOLARSHIP_FUND_EXHAUSTED — proven by
          a control call showing the fiscal error fires when state is valid.
        test_recipe:
          setup:
            - "Program fund 10000; two APPROVED registrations; app1 approved with award 10000 (fund now: reserved 10000, available 0); app2 decided DENY (now DENIED) — fund still 0"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 10000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            # reg1
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_C", household_size: 2}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1b: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1c: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cf1a}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf1b}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf1c}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            # reg2
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-2", first_name: "P", last_name: "Two", birth_date: "2011-02-01", grade: 10, annual_income_bracket: "BAND_C", household_size: 2}, as: Guardian, as_user_id: "guardian-2", captures: {p2: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p2}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-2", captures: {reg2: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg2}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T11:00:00Z"}, as: Guardian, as_user_id: "guardian-2", captures: {cf2a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg2}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T11:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-2", captures: {cf2b: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg2}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T11:02:00Z"}, as: Guardian, as_user_id: "guardian-2", captures: {cf2c: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cf2a}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf2b}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf2c}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg2}/submit", as: Guardian, as_user_id: "guardian-2" }
            - { call: "POST /youth-ministry/registrations/${reg2}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            # app1 drains the fund (need 20 -> need_cap round(0.20*0.5*200000)=20000; award = min(10000, 20000, 150000, 10000) = 10000)
            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg1}", requested_cents: 10000}, as: Guardian, as_user_id: "guardian-1", captures: {app1: $.data.id} }
            - { call: "POST /youth-ministry/scholarship-applications/${app1}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {award1: $.data.award_cents} }
            # app2 -> DENIED
            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg2}", requested_cents: 5000}, as: Guardian, as_user_id: "guardian-2", captures: {app2: $.data.id} }
            - { call: "POST /youth-ministry/scholarship-applications/${app2}/decide", payload: {decision: "DENY", reason: "criteria"}, as: ScholarshipReviewer, as_user_id: "reviewer-1" }
          trigger:
            # control: fiscal error is live when state is valid — appeal app2 back to UNDER_REVIEW, then APPROVE hits the empty fund
            - { call: "POST /youth-ministry/scholarship-applications/${app2}/appeal", as: Guardian, as_user_id: "guardian-2" }
            - { call: "POST /youth-ministry/scholarship-applications/${app2}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {fiscal_err: $.data.error_id} }
            # re-deny, then the dual-failure probe: DENIED + fund empty
            - { call: "POST /youth-ministry/scholarship-applications/${app2}/decide", payload: {decision: "DENY", reason: "criteria"}, as: ScholarshipReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /youth-ministry/scholarship-applications/${app2}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {dual_err: $.data.error_id} }
          assert:
            - "award1 == 10000 and Program.${prog_id}.scholarship_available_cents == 0 after app1 approval"
            - "fiscal_err == ERR_SCHOLARSHIP_FUND_EXHAUSTED (control: fiscal failure observable when state is valid)"
            - "dual_err == ERR_APPLICATION_STATE_FORBIDS_ACTION (state priority 6 beats fiscal priority 12 when both fail)"

      - name: safety_vs_constraint_assignment_screening_beats_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_SCREENING_NOT_VALID_THROUGH_TRIP]
          - errors[ERR_CHAPERONE_TRIP_OVERLAP]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_constraint): assigning a
          chaperone whose screening expires mid-trip (2027-06-28 < T2 end instant
          2027-07-01) AND who is already CONFIRMED on a date-overlapping trip must
          return the SAFETY error ERR_SCREENING_NOT_VALID_THROUGH_TRIP (priority 8),
          not the CONSTRAINT error ERR_CHAPERONE_TRIP_OVERLAP (priority 11).
        test_recipe:
          setup:
            - "Clock rewound to 2025-06-28; chaperone's check CLEARED 2025-06-28 -> expires_at 2027-06-28; T1 (2027-06-15..2027-06-25, end instant 2027-06-26T00:00:00Z <= expires) assignment CONFIRMED; T2 (2027-06-20..2027-06-30, end instant 2027-07-01T00:00:00Z > expires) overlaps T1 on closed dates 06-20..06-25"
          setup_api_calls:
            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2025-06-28T00:00:00Z"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2025", ministry_year: "2025-2026", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
