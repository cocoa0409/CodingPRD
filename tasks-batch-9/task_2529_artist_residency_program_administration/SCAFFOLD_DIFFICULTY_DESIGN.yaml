              D1  cum 0 -> 87502       taxable  27502   27502*0.15 =  4125.30 ->  4125
              D2  cum 87502 -> 175004  taxable  87502   87502*0.15 = 13125.30 -> 13125
              D3  cum 175004 -> 262506 taxable  87502                        -> 13125
              D4  cum 262506 -> 350008 taxable  87502                        -> 13125
