      - name: occ_stale_version_curriculum_amend
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[curriculum-plan-amend-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CurriculumPlan.version: after an amend+approve round trip the plan is APPROVED again (state check passes), but a second amend carrying the pre-amend version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["year OPEN; family; student; enrollment REGISTERED; plan APPROVED at version 3 (create 1, submit 2, approve 3)"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Oc", district_code: "D-83" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Oc", date_of_birth: "2016-01-01" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 6 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "GET /curriculum-plans/${pln}", payload: {}, as: Registrar, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /curriculum-plans/${pln}/amend", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES", "MUSIC"], expected_curriculum_plan_version: "${pv}" }, as: Parent, as_user_id: "${fam}", captures: { st1: $.data.status, v1: $.data.version } }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1", captures: { st2: $.data.status, v2: $.data.version } }
            - { call: "POST /curriculum-plans/${pln}/amend", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES", "ART"], expected_curriculum_plan_version: "${pv}" }, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
            - { call: "GET /curriculum-plans/${pln}", payload: {}, as: Registrar, captures: { vfin: $.data.version, subs: $.data.subjects } }
          assert:
            - "first amend (version 3): lands AMENDMENT_REVIEW at version 4; approve -> APPROVED at version 5"
            - "second amend replaying version 3: error_id == ERR_STALE_VERSION (HTTP 412)"
            - "plan afterwards: version == 5, subjects == [READING, WRITING, MATH, SCIENCE, SOCIAL_STUDIES, MUSIC] (second amendment not applied)"

      - name: day_qualifying_threshold_239_vs_240
        claim_type: rate_threshold_triggers
        grounds: ["calculations.instructional_progress", "entities.Enrollment.fields.provisional_days_counted"]
        distinguishing_aspect: "Day-qualifying threshold uses >= 240 minutes: a 239-minute date does not count as a day, a 240-minute date does; both contribute raw minutes to the credited total."
        test_recipe:
          setup: ["year OPEN; family; grade-4 student; enrollment ACTIVE; clock 2026-09-03; entries 2026-09-01 (239 min) and 2026-09-02 (240 min), both RECORDED (unverified)"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
