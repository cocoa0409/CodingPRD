        claim_type: rate_threshold_triggers
        grounds: [entities.Organization.fields.no_show_strike_limit, state_machines.Signup.CONFIRMED_to_NO_SHOW, entities.Volunteer.fields.status]
        distinguishing_aspect: "With no_show_strike_limit 2 and reliability_suspension_threshold 0, a Volunteer stays ACTIVE after 1 no-show and flips to SUSPENDED exactly at the 2nd no-show (cumulative count reaches the limit)."
