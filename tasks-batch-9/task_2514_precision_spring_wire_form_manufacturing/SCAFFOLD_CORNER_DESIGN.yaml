  - name: ship_after_the_interim_verdict_is_withdrawn_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PROGRAM_POSTURE_BLOCKED]
    - validations[priority 44]
    - calculations.program_delivery_posture
    - state_machines.QualificationSubmission.transitions[INTERIM_APPROVED -> SUBMITTED]
    distinguishing_aspect: 'The posture is re-derived on every hop, so a resubmit that pulls the interim verdict
      back to SUBMITTED returns the program to BLOCKED and strands an already-packed lot: the shipping gate is
      evaluated at ship time, not at allocation time. This row also outranks the amortisation gate at priority
      76, which the still-PENDING tool would otherwise have tripped.'
