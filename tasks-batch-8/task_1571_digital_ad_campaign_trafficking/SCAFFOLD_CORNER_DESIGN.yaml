            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
