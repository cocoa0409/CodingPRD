  # =========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deposit_item_creation_gated_by_deposit_account_lifecycle_status
        grounds:
          - validations[priority=40]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - state_machines.DepositAccount.PENDING_FUNDING_to_ACTIVE
          - entities.DepositItem.fields.account_id
        distinguishing_aspect: |
          Entity pair DepositItem -> DepositAccount: whether a DepositItem may be created at all depends
          entirely on the OTHER entity's lifecycle_status, and the very same request that fails with
          ERR_ACCOUNT_NOT_ACTIVE succeeds unchanged once a FundingSource verification flips the account
          from PENDING_FUNDING to ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One Customer and one DepositAccount still in PENDING_FUNDING."
            - "One FundingSource declared on that account and sitting in MICRO_DEPOSIT_SENT, not yet verified."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Nadia Solberg", tin_last4: "6262", kyc_tier: "TIER_2", watchlist_hit: false }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_ce1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_ce1}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_ce1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_ce1}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "3333" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_ce1: "$.data.id", md_ce1: "$.data.micro_deposit_cents" }
          trigger:
            - call: "POST /deposit-fraud/accounts/${acct_ce1}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { err_not_active: "$.data.error_id" }
            - call: "POST /deposit-fraud/funding-sources/${fs_ce1}/verification-attempts"
              payload: { micro_deposit_cents: "${md_ce1}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_ce1}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_ce1: "$.data.id" }
          assert:
            - "${err_not_active} == ERR_ACCOUNT_NOT_ACTIVE with HTTP 409"
            - "GET /deposit-fraud/accounts/${acct_ce1}/deposit-items returns total_count == 1 after the whole trigger chain, proving the first attempt persisted nothing"
            - "DepositItem.${item_ce1}.status == PENDING and immediate_credit_cents == 22500 and held_cents == 7500"
            - "GET /deposit-fraud/accounts/${acct_ce1} returns lifecycle_status == ACTIVE, ledger_balance_cents == 30000, available_balance_cents == 22500 and held_amount_cents == 7500"

