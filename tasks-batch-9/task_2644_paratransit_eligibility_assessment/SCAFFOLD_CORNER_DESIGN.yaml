              captures: { overdue_after: $.data.appeals_overdue_count, expired: $.data.determinations_expired_count, presumptive: $.data.presumptive_granted_count }
          assert:
            - "${due} == \"2026-09-04\" (heard 2026-08-05 + 30 days)"
            - "the sweep at 2026-09-04 returns ${overdue_on_due_date} == 0 and Appeal.${appeal_id}.continued_service_extended == false (the comparison is strict)"
            - "the sweep at 2026-09-05 returns ${overdue_after} == 1, ${expired} == 0 and ${presumptive} == 0"
            - "Appeal.${appeal_id}.status == \"HEARD\", outcome == null and continued_service_extended == true"
            - "Applicant.${rider_id}.current_eligibility_status == \"PRESUMPTIVE\" (step 5 is the last writer) while active_determination_id is still ${det_id}"
            - "Determination.${det_id}.status == \"ISSUED\" and under_appeal == true"

      - name: pending_days_dual_variant_divergence_on_one_application
        excluded_because:
          difficulty_instance: application_pending_days_statutory_vs_net_agency
          rationale: "Variant Divergence and Variant Selection for application_pending_days are asserted there on one fixture (statutory 21 vs net_agency 16 after a 5-day verification wait), including which variant gates the presumptive grant."

      - name: conduct_ratio_rounding_precision_is_pooled_then_rounded_once
        excluded_because:
          difficulty_instance: no_show_ratio_pooled_then_rounded_once_mode_b
          rationale: "The Precision row for no_show_ratio_pct (round_half_up to 1 decimal, pooled divide-once, and the forbidden per-month averaging order) is asserted there with literal 33.3 vs 25.0 values."

      - name: conduct_window_input_set_keeps_excused_events_in_the_denominator
        excluded_because:
          difficulty_instance: suspension_decide_blocked_by_recomputed_applicant_conduct_mirrors
          rationale: "Input Set Filtering for the conduct window (an excused event leaves the numerator but stays in scheduled_trip_count_90d, moving the ratio to 66.7 and blocking the upheld decision) is asserted there."

  - section: validations
    instances:
      - name: pagination_bounds_are_closed_at_one_and_one_hundred
        claim_type: violation_to_error
        grounds:
          - validations.priority_22.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit is rejected at 0 and at 101 but accepted at both 1 and 100, and offset is rejected at -1 but accepted at 0 — the bounds are inclusive, and the rejection is ERR_INVALID_PAGINATION 400 rather than the generic ERR_INVALID_REQUEST that priority 20 would give."
        test_recipe:
          setup:
            - "one Applicant with one DRAFT Application so the list is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Bela Toth", date_of_birth: "1963-03-23", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 200, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
          trigger:
            - call: "GET /applications"
              payload: { limit: 0 }
              as: IntakeClerk
              captures: { zero_err: $.data.error_id }
            - call: "GET /applications"
              payload: { limit: 101 }
              as: IntakeClerk
              captures: { over_err: $.data.error_id }
            - call: "GET /applications"
              payload: { offset: -1 }
              as: IntakeClerk
              captures: { neg_err: $.data.error_id }
            - call: "GET /applications"
              payload: { limit: 1, offset: 0 }
              as: IntakeClerk
              captures: { ok_first: "$.data[0].id" }
            - call: "GET /applications"
              payload: { limit: 100 }
              as: IntakeClerk
              captures: { max_first: "$.data[0].id" }
          assert:
            - "limit 0, limit 101 and offset -1 each return HTTP 400 with data.error_id == \"ERR_INVALID_PAGINATION\""
            - "limit 1 returns HTTP 200 with limit == 1, total_count == 1, has_more == false and exactly 1 row"
            - "limit 100 returns HTTP 200 with limit == 100 and ${max_first} == ${appn_id}"
            - "the two accepted reads leave Application.${appn_id}.version == 1"

      - name: a_second_open_application_is_refused_until_the_first_is_determined
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_56.ERR_DUPLICATE_OPEN_APPLICATION
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: "The one-open-application rule counts DRAFT too, so the second create is refused while the first is DRAFT and still refused after it is SUBMITTED; the same request succeeds only once the first application reaches DETERMINED, which is exactly the state the RECERTIFICATION path relies on."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one Applicant with one DRAFT Application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Cato Rivers", date_of_birth: "1974-04-14", residence_zone: "IN_SERVICE_AREA", mobility_aid: "CANE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 210, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn1: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 210, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { dup_draft_err: $.data.error_id }
            - call: "POST /applications/${appn1}/submit"
              payload: {}
              as: IntakeClerk
              captures: { submitted_status: $.data.status, due: $.data.determination_due_date }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "RECERTIFICATION", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 210, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { dup_submitted_err: $.data.error_id }
          assert:
            - "the create against the DRAFT application returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_OPEN_APPLICATION\""
            - "the submit returns HTTP 200 with ${submitted_status} == \"SUBMITTED\", ${due} == \"2026-08-22\" (2026-08-01 + 21 days) and completeness_established_at == \"2026-08-01T00:00:00.000Z\""
            - "the create against the SUBMITTED application also returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_OPEN_APPLICATION\""
            - "GET /applications?applicant_id=${rider_id} returns total_count == 1"

      - name: trip_event_date_may_not_be_later_than_the_logical_clock_date
        claim_type: temporal_validation
        grounds:
          - validations.priority_65.ERR_TRIP_DATE_FUTURE
          - calculations.no_show_points_balance
        distinguishing_aspect: "The bound is on the DATE, not the instant: with the clock at 2026-08-01T00:00:00Z a trip_date of 2026-08-01 is accepted (same-day reporting) while 2026-08-02 is ERR_TRIP_DATE_FUTURE, and the accepted event sits on the inclusive upper edge of the 90-day conduct window."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; one Applicant with no TripEvents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Delia Marsh", date_of_birth: "1979-09-29", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-08-02", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { future_err: $.data.error_id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-08-01", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { ok_event: $.data.id, pts: $.data.points_assessed }
          assert:
            - "the 2026-08-02 call returns HTTP 422 with data.error_id == \"ERR_TRIP_DATE_FUTURE\" and no TripEvent row is created"
            - "the 2026-08-01 call returns HTTP 201 with ${pts} == 2"
            - "Applicant.${rider_id}.no_show_points_event_basis == 2, chargeable_miss_count_90d == 1, scheduled_trip_count_90d == 1 and no_show_ratio_pct == 100.0"
            - "GET /applicants/${rider_id}/trip-events returns total_count == 1"
            - "no SuspensionProceeding exists for the applicant (2 points is below the 6-point threshold)"

      - name: a_capacity_one_slot_rejects_the_second_assessment_booking
        claim_type: aggregate_validation
        grounds:
          - validations.priority_59.ERR_SLOT_FULL
          - entities.AssessmentSlot.fields.booked_count
          - state_machines.Application.ASSESSMENT_REQUIRED_to_ASSESSMENT_SCHEDULED
        distinguishing_aspect: "Each individual booking request is valid on its own, but the collective exceeds capacity: the first assessment drives booked_count to 1 and the slot to FULL, and the second rider's request is ERR_SLOT_FULL 409 while that rider's Application stays ASSESSMENT_REQUIRED and is still bookable elsewhere."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; two riders whose Applications are both ASSESSMENT_REQUIRED; one slot with capacity 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
