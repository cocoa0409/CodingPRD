  - name: the_divert_threshold_fires_at_exactly_three_open_cases_and_counts_accepted_transfers
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.ems_routing_posture OPEN_CASE_DIVERT_THRESHOLD 3
    - entities.StrokeCenter.open_case_count
    - endpoints.POST /stroke-network/transfer-decisions/{id}/accept
