            - "Resolver disp-2 differs from issuer disp-1 and completer crew-9 (segregation satisfied); resolution_credit_cents == 0"
            - "Invoice unchanged: total_cents == 45000 and credit_cents == 0; visit billing_status == SETTLED"

      - name: amendment_supersede_and_approve_applies_changes
        claim_type: side_effect_execution
        grounds:
          - state_machines.ContractAmendment.PENDING_to_SUPERSEDED
          - state_machines.ContractAmendment.PENDING_to_APPROVED
          - concurrency_rules[amendment-create-stale-contract]
        distinguishing_aspect: "Creating a second PENDING amendment supersedes the first; approving the survivor writes the new trigger depth onto the contract and bumps Contract.version; the superseded one can no longer be approved."
        test_recipe:
          setup: ["ACTIVE per-push contract kM at version 2 (create=1, link site does not bump, activate=2)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Amend Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Amend Lot", address: "6 Change St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { s: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, trigger_depth_inches: 2.0, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${s}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher }
            - { call: "POST /contracts/${k}/activate", as: OpsDispatcher, captures: { k_v2: $.data.version } }
            - { call: "POST /amendments", payload: { contract_id: "${k}", expected_contract_version: "${k_v2}", effective_from: "2027-01-01T00:00:00Z", trigger_depth_inches: 2.5 }, as: OpsDispatcher, captures: { am1: $.data.id, am1_status: $.data.status } }
            - { call: "GET /contracts/${k}", as: OpsDispatcher, captures: { k_v3: $.data.version } }
          trigger:
            - { call: "POST /amendments", payload: { contract_id: "${k}", expected_contract_version: "${k_v3}", effective_from: "2027-01-15T00:00:00Z", trigger_depth_inches: 3.0, per_push_rate_cents: 50000 }, as: OpsDispatcher, captures: { am2: $.data.id, am2_status: $.data.status } }
            - { call: "GET /contracts/${k}/amendments", as: OpsDispatcher }
            - { call: "POST /amendments/${am2}/approve", as: OpsDispatcher, captures: { am2_final: $.data.status } }
            - { call: "POST /amendments/${am1}/approve", as: OpsDispatcher, captures: { am1_err: $.data.error_id } }
            - { call: "GET /contracts/${k}", as: OpsDispatcher, captures: { k_trig: $.data.trigger_depth_inches, k_rate: $.data.per_push_rate_cents, k_ver: $.data.version } }
          assert:
            - "First amendment PENDING; creating the second (fresh OCC version ${k_v3}) flips amendment ${am1} to SUPERSEDED and ${am2} is PENDING"
            - "Approving the survivor: status == APPROVED; contract trigger_depth_inches == 3.0 and per_push_rate_cents == 50000"
            - "Approving the SUPERSEDED amendment fails with error_id == ERR_ALREADY_TERMINAL"
            - "Contract.version advanced once per mutation: 2 (activate) -> 3 (amendment 1) -> 4 (amendment 2) -> 5 (approve)"

