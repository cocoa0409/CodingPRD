  - section: endpoints
    instances:
      - name: waitlist_purge_removes_stale_entry_at_90_days
        claim_type: side_effect
        grounds: [state_machines.WaitlistEntry.ACTIVE_to_PURGED, endpoints]
        distinguishing_aspect: "An ACTIVE entry whose last_contact_at is exactly 90 days before the clock is PURGED by POST /pha/waitlists/{id}/purge (boundary >=90)."
        test_recipe:
          setup: ["A drawn ACTIVE entry with last_contact_at 2026-03-01; clock advanced to 2026-05-30 (90 days later)."]
          setup_api_calls:
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: IntakeClerk
            - call: "POST /pha/applicants"
              payload: { household_name: "Stale" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: IntakeClerk
          trigger:
            - call: "POST /pha/waitlists/${wl_id}/purge"
              payload: {}
              as: IntakeClerk
          assert:
            - "WaitlistEntry ${entry_id}.status == PURGED"

      - name: list_entries_pagination_envelope
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /pha/waitlists/{id}/entries returns an array envelope with pagination fields limit, offset, total_count, has_more; defaults limit 10 offset 0."
        test_recipe:
          setup: ["A waitlist with two entries."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "P1" }
              as: IntakeClerk
              captures: { a1: $.data.id }
            - call: "POST /pha/applicants"
              payload: { household_name: "P2" }
              as: IntakeClerk
              captures: { a2: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${a1}" }
              as: IntakeClerk
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${a2}" }
              as: IntakeClerk
          trigger:
            - call: "GET /pha/waitlists/${wl_id}/entries"
              payload: {}
              as: IntakeClerk
          assert:
            - "response_type == array; meta.api_request_id present; total_count == 2 and has_more == false"

