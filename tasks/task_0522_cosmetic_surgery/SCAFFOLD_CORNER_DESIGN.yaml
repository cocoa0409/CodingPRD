      - name: rbac_surgeon_not_owner_cannot_complete_consultation
        claim_type: Peer roles
        grounds:
          - "roles"
          - "validations[priority=5]"
          - "errors[ERR_NOT_OWNER]"
        distinguishing_aspect: "A Surgeon whose X-User-ID != Consultation.surgeon_user_id completing that consultation returns ERR_NOT_OWNER (403)."
        test_recipe:
          setup: ["A SCHEDULED consultation owned by surgeon-1."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1990-01-01", age_years: 34, bmi: 24 }
              as: FrontDeskCoordinator
              captures: { pat1: $.data.id }
            - call: "POST /consultations"
              payload: { patient_id: "${pat1}", surgeon_user_id: "surgeon-1", chief_complaint: "nose" }
              as: FrontDeskCoordinator
              captures: { cons1: $.data.id }
          trigger:
            - call: "POST /consultations/${cons1}/complete"
              payload: {}
              as: Surgeon
              as_user_id: "surgeon-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_OWNER"
            - "http_status == 403"

      - name: rbac_unauthenticated_missing_headers
        claim_type: Peer roles
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with an unknown/absent X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /procedures"
              payload: {}
              as: NoSuchRole
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "http_status == 401"

