            - { call: "POST /participants", payload: { termination_case_id: "${c_od}", full_name: "Over Draw", ssn: "121110021", mailing_address: "1 O St", account_balance_cents: 100000, vested_pct: 100 }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_od}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_od_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
