      - name: lease_coverage_capacity_counts_only_intersecting_terms
        grounds:
          - "validations[priority=80]"
          - calculations.lease_rent_and_coverage
          - state_machines.RecreationalLease.PENDING_to_ACTIVE
          - entities.RecreationalLease.fields.first_year_prorated_rent_usd
        distinguishing_aspect: |
          Coverage is an interval-aware aggregate, not a running total. On 1200.00 acres
          the cap is 960.00: L1 (600.00 acres, 2027-01-01..2028-01-01) activates, L2
          (400.00 acres, overlapping) is rejected at 1000.00 > 960.00, yet L3 (360.00
          acres, 2027-09-01..2027-12-01) activates at exactly 960.00 because the rejected
          PENDING L2 ends on 2027-09-01 and half-open terms that merely touch do not
          intersect. L4 (2028-01-01..2029-01-01) then shows the min(term_days, 365) clamp:
          a 366-day leap term still bills only 13500.00, not 13536.99.
