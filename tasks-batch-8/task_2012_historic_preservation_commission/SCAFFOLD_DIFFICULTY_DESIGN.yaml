              as: PreservationStaff
              captures: { p1_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "3 Chapel", parcel_number: "P-801", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1988, assessed_value_cents: 4000000 }
              as: PreservationStaff
              captures: { p2_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p1_id}", owner_id: "${o_id}", application_type: "DEMOLITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "DEMOLITION", description: "raze structure", estimated_cost_cents: 800000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "DEMOLITION", verified_cost_cents: 800000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { app_v: $.data.version, fee: $.data.assessed_fee_cents }
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
            - call: "POST /preservation/hearings/${h_id}/open"
              payload: {}
              as: Commissioner
            - call: "POST /preservation/applications/${app_id}/decide"
              payload: { outcome: "APPROVE" }
              as: Commissioner
            - call: "POST /preservation/applications/${app_id}/fee-payments"
              payload: { amount_cents: 47400 }
              as: Applicant
