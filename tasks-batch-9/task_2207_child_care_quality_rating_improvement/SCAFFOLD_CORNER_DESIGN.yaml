          - calculations.grant_reimbursement_waterfall.constants.CATEGORY_CEILING_PCT
        distinguishing_aspect: "Four submissions that each sit exactly on their own category ceiling (EQUIPMENT 400000, PROF_DEV 300000, FACILITY 250000, ADMIN 50000) consume the 1000000-cent award to available_cents 0, so one more ADMIN cent - still far under the 100000 ADMIN ceiling - fails the priority-61 funds check with 422 ERR_GRANT_FUNDS_EXHAUSTED, not the ceiling error."
