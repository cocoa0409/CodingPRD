# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Research Core Facility Scheduling & Recharge
# Breadth walk over §1.1–§1.7 using the claim-extraction-guide taxonomy.
# Instances already probed by §1.8 are emitted as excluded_because stubs.
# Same conventions as SCAFFOLD_DIFFICULTY_DESIGN.yaml (clock default
# 2026-08-01T00:00:00Z; canonical instrument/rate/grant literals).
# Negative triggers always capture $.data.error_id.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section 1 — entities
  # ===========================================================================
  - section: entities
    instances:
      - name: user_create_defaults_and_envelope
        claim_type: creation
        grounds:
          - "entities.User"
          - "response_envelope"
        distinguishing_aspect: "Minimal create returns 201 with system defaults: status ACTIVE, is_pi false, version 1, id/created_at/updated_at server-minted; success envelope carries meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup: ["empty database; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "response 201 with data.status == ACTIVE, data.is_pi == false, data.department == null"
            - "data.version == 1 and data.created_at == 2026-08-01T00:00:00.000Z (logical clock default)"
            - "envelope has meta.api_request_id and meta.api_request_timestamp and response_type == object"

      - name: user_create_without_email_yields_400
        claim_type: required_fields
        grounds:
          - "entities.User.fields.email"
          - "validations[priority=21]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "email is a required input with no default; omitting it yields 400 ERR_INVALID_REQUEST and no user is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /users", payload: { full_name: "No Email" , affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /users afterwards returns total_count == 0"

      - name: user_create_with_bad_enum_yields_400
        claim_type: type_constraints
        grounds:
          - "entities.User.fields.affiliation"
          - "validations[priority=21]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "affiliation outside {INTERNAL, EXTERNAL} is rejected at the format layer."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /users", payload: { full_name: "Bad Enum", email: "be@uni.edu", affiliation: "OTHER" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: user_get_unknown_id_yields_404
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "A well-formed UUID that does not exist yields 404 ERR_NOT_FOUND on single-resource GET."
        test_recipe:
          setup: ["one user exists (so the collection is non-empty)"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "GET /users/00000000-0000-0000-0000-000000000000", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: instrument_create_applies_policy_defaults
        claim_type: defaults
        grounds:
          - "entities.Instrument.fields.requires_training"
          - "entities.Instrument.fields.booking_buffer_minutes"
        distinguishing_aspect: "Omitting requires_training and booking_buffer_minutes applies the declared defaults true and 0; status starts AVAILABLE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /instruments", payload: { name: "Confocal-1", model: "Zeiss LSM", location: "Lab 2", min_booking_minutes: 30, max_booking_minutes: 240, cancellation_free_notice_hours: 12, late_cancel_penalty_pct: 0.25, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id, rt: $.data.requires_training, buf: $.data.booking_buffer_minutes, st: $.data.status } }
          assert:
            - "requires_training == true and booking_buffer_minutes == 0 (defaults applied)"
            - "status == AVAILABLE"

      - name: booking_create_with_computed_field_in_input_yields_400
        claim_type: computed_fields
        grounds:
          - "entities.Booking.fields.estimated_charge_cents"
          - "validations[priority=21]"
        distinguishing_aspect: "estimated_charge_cents is source:computed — clients MUST NOT supply it; strict unknown-field rejection returns 400."
        test_recipe:
          setup:
            - "canonical stack: certified u1, i1, FY2026 EFFECTIVE rate set, grant g1"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", estimated_charge_cents: 1 }, as: Researcher, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400 (computed/unknown field rejected)"

      - name: grant_computed_fields_zero_at_create
        claim_type: computed_fields
        grounds:
          - "entities.Grant.fields.budget_encumbered_cents"
          - "entities.Grant.fields.budget_available_cents"
          - "calculations.grant_budget_available"
        distinguishing_aspect: "A fresh grant reports budget_encumbered_cents == 0, budget_used_cents == 0, budget_available_cents == budget_total_cents, status ACTIVE."
        test_recipe:
          setup: ["PI user u1 exists"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id, enc: $.data.budget_encumbered_cents, used: $.data.budget_used_cents, avail: $.data.budget_available_cents, st: $.data.status } }
          assert:
            - "budget_encumbered_cents == 0 and budget_used_cents == 0"
            - "budget_available_cents == 100000 and status == ACTIVE"

      - name: training_record_unique_pair
        claim_type: type_constraints
        grounds:
          - "entities.TrainingRecord.fields.status"
          - "validations[priority=22]"
          - "errors[ERR_UNIQUE_CONSTRAINT]"
        distinguishing_aspect: "A second non-REVOKED TrainingRecord for the same (user, instrument) violates the pairwise uniqueness."
        test_recipe:
          setup: ["u1 ENROLLED on i1"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNIQUE_CONSTRAINT with HTTP 409"

      - name: publication_with_unknown_instrument_yields_404
        claim_type: parent_relationships
        grounds:
          - "entities.Publication.fields.instrument_ids"
          - "validations[priority=4]"
        distinguishing_aspect: "Every element of instrument_ids must resolve; a bogus element id fails FK existence even though it is nested in an array."
        test_recipe:
          setup: ["author u1 exists"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
          trigger:
            - { call: "POST /publications", payload: { user_id: "${u1}", title: "Paper", journal: "Nature", published_at: "2026-07-15", acknowledges_core: true, instrument_ids: ["00000000-0000-0000-0000-000000000000"] }, as: Researcher, as_user_id: "${u1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

  # ===========================================================================
  # Section 2 — state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: booking_initial_state_and_cancel_free
        claim_type: initial_state
        grounds:
          - "state_machines.Booking"
        distinguishing_aspect: "A created booking starts REQUESTED with penalty fields zeroed and no encumbrance; cancelling from REQUESTED is free (no batch needed)."
        test_recipe:
          setup: ["canonical stack through grant"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id, st: $.data.status, enc: $.data.encumbered_cents } }
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: Researcher, as_user_id: "${u1}", captures: { st2: $.data.status, pen: $.data.penalty_cents } }
          assert:
            - "created booking: status == REQUESTED, encumbered_cents == 0, penalty_cents == 0, penalty_waived == false"
            - "cancel from REQUESTED: status == CANCELLED, penalty_cents == 0, no RechargeEntry created (no batch existed)"

      - name: booking_terminal_completed_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Booking"
          - "validations[priority=6]"
        distinguishing_aspect: "COMPLETED is terminal: a later cancel attempt is rejected and no fields change."
        test_recipe:
          setup: ["canonical stack; b1 APPROVED, checked in, completed"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:30:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "Booking.${b1} remains COMPLETED with encumbered_cents == 0"

      - name: booking_no_show_before_start
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Booking.APPROVED_to_NO_SHOW"
          - "validations[priority=41]"
        distinguishing_aspect: "no-show is gated on the logical clock being past start_at; at 08:59 (before start) it is an invalid transition."
        test_recipe:
          setup: ["canonical stack; b1 APPROVED 2026-09-01 09:00-10:30; clock 2026-09-01T08:59:00Z"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:59:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /bookings/${b1}/no-show", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (clock not yet past start_at)"
            - "Booking.${b1} remains APPROVED with encumbered_cents == 18000"

      - name: booking_check_in_early_window_boundary
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Booking.APPROVED_to_IN_PROGRESS"
        distinguishing_aspect: "Check-in opens exactly 15 minutes before start: at start-16 min it fails, at start-15 min exactly it succeeds (>= boundary)."
        test_recipe:
          setup: ["canonical stack; b1 APPROVED 2026-09-01 09:00-10:30"]
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
