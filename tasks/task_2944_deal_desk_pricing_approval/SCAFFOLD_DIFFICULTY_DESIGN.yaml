    instances:
      - name: reopen_cascade_four_levels_request_steps_terms_revrec
        grounds:
          - state_machines.Quote.CHANGES_REQUESTED_to_DRAFT
          - state_machines.ApprovalRequest.CHANGES_REQUESTED_to_CANCELLED
          - state_machines.NonStandardTerm.APPROVED_to_PENDING
          - state_machines.RevRecAssessment.CLEARED_to_STALE
          - entities.RevRecAssessment.fields.snapshot_quote_version
        distinguishing_aspect: |
          One reopen call propagates through four declared cascade levels rooted at the Quote and
          terminating at the RevRecAssessment: level 1 cancels the ApprovalRequest, level 2 voids only
          PENDING steps (here none, so the APPROVED and CHANGES_REQUESTED steps must keep their
          decisions), level 3 reverts both legally APPROVED NonStandardTerms to PENDING and clears their
          reviewer stamps, and level 4 marks the CLEARED RevRecAssessment STALE.
