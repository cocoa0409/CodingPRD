  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_period_view_cannot_supersede_a_report
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-create-stale-period]
          - errors[ERR_STALE_SERVICE_PERIOD_VERSION]
          - state_machines.ServicePeriod.reporting_status
        distinguishing_aspect: |
          The only OCC rule on a non-Concession parent, and the only one guarding a write
          that is a self-loop: because SELF_REPORTED -> SELF_REPORTED is a legal supersede,
          a stale writer would silently overwrite a report it never read. The first report
          moves the period's version, so the second submission carrying the ORIGINAL version
          must be refused, and the identical body carrying the current version must then
          supersede, sending the first report to SUPERSEDED.
        test_recipe:
          setup:
            - "The base chain to OPERATIONS with ServicePeriod 1 created at version 1, then one report filed at (100, 2, 4) which advanced the period to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
