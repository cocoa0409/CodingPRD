# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_1033
# Breadth probe: enumerates testable claims across the claim-extraction-guide
# sections not already covered (in depth) by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: entity_customer_create_returns_201_with_loyalty_defaults
        claim_type: Creation
        grounds: [entities.Customer.fields.loyalty_points_balance, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "POST /customers with required fields returns 201; loyalty_points_balance==0, loyalty_tier==BRONZE, lifetime_spend_cents==0, empty loyalty_ledger."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "New C", email: "n@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id, bal: $.data.loyalty_points_balance, tier: $.data.loyalty_tier }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopClerk
              captures: { bal2: $.data.loyalty_points_balance, tier2: $.data.loyalty_tier, ltv: $.data.lifetime_spend_cents }
          assert:
            - "bal == 0"
            - "tier == BRONZE"
            - "bal2 == 0 and tier2 == BRONZE and ltv == 0"

      - name: entity_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{non-existent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: entity_product_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.unit_price_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /products without unit_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "NOPRICE", name: "No Price", category: "ROD", stock_qty: 5 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_customer_system_field_input_ignored
        claim_type: System Fields
        grounds: [entities.Customer.fields.loyalty_points_balance]
        distinguishing_aspect: "Client-supplied loyalty_points_balance in the create body is ignored; the server initializes it to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Sneaky", email: "s@x.com", state_code: "CA", birth_date: "1990-05-05", loyalty_points_balance: 999 }
              as: ShopClerk
              captures: { bal: $.data.loyalty_points_balance }
          assert:
            - "bal == 0  # supplied 999 ignored"

      - name: entity_license_computed_price_and_valid_to
        claim_type: Computed Fields
        grounds: [entities.FishingLicense.fields.price_cents, entities.FishingLicense.fields.valid_to]
        distinguishing_aspect: "Issuing a RESIDENT_ANNUAL computes price_cents (5200) and valid_to = valid_from + 365 days regardless of any client-supplied value."
        test_recipe:
          setup: ["Clock 2026-07-01; adult CA customer."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Lic Holder", email: "lh@x.com", state_code: "CA", birth_date: "1980-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { customer_id: "${cust_id}", license_type: "RESIDENT_ANNUAL", state_code: "CA", valid_from: "2026-07-01T00:00:00Z" }
              as: ShopClerk
              captures: { price: $.data.price_cents, valid_to: $.data.valid_to, status: $.data.status }
          assert:
            - "price (price_cents) == 5200"
            - "valid_to == 2027-07-01T00:00:00Z  # valid_from + 365 days"
            - "status == ACTIVE  # now within [valid_from, valid_to)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_service_order_pickup_from_received_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceOrder.READY_to_PICKED_UP, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PICKUP from RECEIVED (skipping IN_PROGRESS/READY) returns ERR_INVALID_STATE; no final_cents set."
        test_recipe:
          setup: ["Customer; ServiceOrder RECEIVED (not started)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "SO Cust", email: "so@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-orders"
              payload: { customer_id: "${cust_id}", item_description: "Rod", service_type: "ROD_REPAIR", quoted_cents: 3000 }
              as: ShopClerk
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${so_id}/transition"
              payload: { action: "PICKUP" }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: sm_sale_void_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Sale.OPEN_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOID is only valid from OPEN; voiding a COMPLETED sale returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-04-01. Customer, product 1000 stock 10, sale one line, COMPLETED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Void Cust", email: "v@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "VD-1", name: "Lure", category: "TERMINAL_TACKLE", unit_price_cents: 1000, stock_qty: 10 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "COMPLETE" }
              as: ShopClerk
          trigger:
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "VOID" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: sm_license_double_void_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.FishingLicense.SCHEDULED_to_VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOID is terminal: voiding an already-VOID license returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Clock 2026-07-01. Adult CA customer with a license, then voided once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "VL Cust", email: "vl@x.com", state_code: "CA", birth_date: "1980-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /licenses"
              payload: { customer_id: "${cust_id}", license_type: "RESIDENT_ANNUAL", state_code: "CA", valid_from: "2026-07-01T00:00:00Z" }
              as: ShopClerk
              captures: { lic_id: $.data.id }
            - call: "POST /licenses/${lic_id}/void"
              payload: {}
              as: ShopManager
              captures: { st: $.data.status }
          trigger:
            - call: "POST /licenses/${lic_id}/void"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "st == VOID  # first void succeeded"
            - "err == ERR_INVALID_STATE  # second void rejected"

      - name: sm_tournament_finalize_from_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Tournament.IN_PROGRESS_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "FINALIZE requires IN_PROGRESS; finalizing a SCHEDULED tournament returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Venue; tournament created (SCHEDULED)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Sched Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "Sched T", entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-08-01T00:00:00Z", start_at: "2026-09-20T06:00:00Z", end_at: "2026-09-20T18:00:00Z", max_entries: 10, prize_points: 100 }
              as: TournamentDirector
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "FINALIZE" }
              as: TournamentDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: calc_tank_decay_reduces_available
        claim_type: Correct Result
        grounds: [calculations.tank_available_count, entities.BaitTank.fields.available_count]
        distinguishing_aspect: "With mortality 200bps/day, a 100-unit batch delivered 5 days earlier shows available_count == 90 (dead=floor(100*0.02*5)=10)."
        test_recipe:
          setup: ["Clock 2026-07-01. Tank cap 100 mortality 200bps; batch 100 delivered 2026-07-01; then clock -> 2026-07-06."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /bait-tanks"
              payload: { name: "Decay Tank", species: "MINNOW", capacity_units: 100, mortality_rate_bps_per_day: 200 }
              as: ShopManager
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 100, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v0}" }
              as: ShopManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: ShopManager
          trigger:
            - call: "GET /bait-tanks/${tank_id}"
              payload: {}
              as: ShopClerk
              captures: { avail: $.data.available_count, status: $.data.status }
          assert:
            - "avail (available_count) == 90"
            - "status == HEALTHY  # 90 >= low_stock_threshold ceil(100*0.10)=10"

      - name: calc_special_order_refund_from_ordered
        claim_type: Correct Result
        grounds: [calculations.special_order_refund, entities.SpecialOrder.fields.refund_cents]
        distinguishing_aspect: "Cancelling a SpecialOrder from ORDERED retains a 20% restock fee: deposit 5000 -> refund 4000."
        test_recipe:
          setup: ["Eligible active product priced 10000; special order qty 1; advanced to ORDERED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "SP Cust", email: "sp@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SPCL-1", name: "Custom Rod", category: "ROD", unit_price_cents: 10000, stock_qty: 0, is_special_order_eligible: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: ShopClerk
              captures: { spo_id: $.data.id, deposit: $.data.deposit_cents }
            - call: "POST /special-orders/${spo_id}/transition"
              payload: { action: "ORDER" }
              as: ShopClerk
          trigger:
            - call: "POST /special-orders/${spo_id}/transition"
              payload: { action: "CANCEL" }
              as: ShopClerk
              captures: { refund: $.data.refund_cents, st: $.data.status }
          assert:
            - "deposit (deposit_cents) == 5000  # round(10000*1*0.50)"
            - "refund (refund_cents) == 4000  # 5000 - round(5000*0.20)=1000"
            - "st == CANCELLED"

      - name: calc_sale_tax_rounding_on_line_add
        claim_type: Precision
        grounds: [calculations.sale_totals, entities.Sale.fields.tax_cents]
        distinguishing_aspect: "A single 1299 line yields subtotal 1299, tax round(1299*0.08)=104, total 1403 (round_half_up)."
        test_recipe:
          setup: ["Customer; product 1299 stock 10; sale one line qty 1."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Tax Cust", email: "t@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "TX-1", name: "Reel", category: "REEL", unit_price_cents: 1299, stock_qty: 10 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
              captures: { sub: $.data.subtotal_cents, tax: $.data.tax_cents, tot: $.data.total_cents }
          assert:
            - "sub (subtotal_cents) == 1299"
            - "tax (tax_cents) == 104"
            - "tot (total_cents) == 1403"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: val_insufficient_stock_on_complete
        claim_type: Violation → Error
        grounds: ["errors[ERR_INSUFFICIENT_STOCK]", "validations[priority=10]"]
        distinguishing_aspect: "Completing a sale whose line qty (5) exceeds product stock (1) returns ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["Customer; product stock 1; sale with one line qty 5 (added while OPEN)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Stock Cust", email: "st@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "LOW-1", name: "Rare Lure", category: "TERMINAL_TACKLE", unit_price_cents: 500, stock_qty: 1 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: ShopClerk
          trigger:
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "COMPLETE" }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_STOCK"

      - name: val_insufficient_bait_on_dispense
        claim_type: Violation → Error
        grounds: ["errors[ERR_INSUFFICIENT_BAIT]", "validations[priority=10]"]
        distinguishing_aspect: "Dispensing 5 from an empty tank (available 0) returns ERR_INSUFFICIENT_BAIT."
        test_recipe:
          setup: ["Tank cap 100, no batch (available 0)."]
          setup_api_calls:
            - call: "POST /bait-tanks"
              payload: { name: "Empty Tank", species: "SHRIMP", capacity_units: 100, mortality_rate_bps_per_day: 0 }
              as: ShopManager
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /bait-tanks/${tank_id}/dispense"
              payload: { qty: 5 }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSUFFICIENT_BAIT"

      - name: val_invalid_quantity_dispense_zero
        claim_type: Violation → Error
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "Dispensing qty 0 returns ERR_INVALID_REQUEST (non-positive quantity), a validation-priority failure before any bait check."
        test_recipe:
          setup: ["Tank cap 100, no batch."]
          setup_api_calls:
            - call: "POST /bait-tanks"
              payload: { name: "Zero Tank", species: "SHRIMP", capacity_units: 100, mortality_rate_bps_per_day: 0 }
              as: ShopManager
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /bait-tanks/${tank_id}/dispense"
              payload: { qty: 0 }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: val_party_too_large_on_quote
        claim_type: Violation → Error
        grounds: ["errors[ERR_PARTY_TOO_LARGE]", state_machines.CharterBooking.REQUESTED_to_QUOTED]
        distinguishing_aspect: "QUOTE with party_size 6 on a guide whose max_party_size is 4 returns ERR_PARTY_TOO_LARGE."
        test_recipe:
          setup: ["Customer, venue, guide max_party_size 4; booking party 6 REQUESTED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Big Party", email: "bp@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Small", guide_license_no: "G-9", half_day_rate_cents: 20000, full_day_rate_cents: 40000, per_extra_angler_cents: 5000, max_party_size: 4 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Tiny Pond", water_type: "POND" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${cust_id}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 6, start_at: "2026-07-15T08:00:00Z", end_at: "2026-07-15T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PARTY_TOO_LARGE"

      - name: val_max_entries_reached_on_register
        claim_type: Aggregate validation
        grounds: ["errors[ERR_MAX_ENTRIES_REACHED]", entities.Tournament.fields.max_entries]
        distinguishing_aspect: "Registering a second customer into a tournament with max_entries==1 returns ERR_MAX_ENTRIES_REACHED."
        test_recipe:
          setup: ["Clock 2026-07-01. Venue; tournament max_entries 1, OPEN; customer 1 registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Reg One", email: "r1@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { name: "Reg Two", email: "r2@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { c2: $.data.id }
            - call: "POST /venues"
              payload: { name: "Cap Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "Full Cup", entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-08-01T00:00:00Z", start_at: "2026-09-25T06:00:00Z", end_at: "2026-09-25T18:00:00Z", max_entries: 1, prize_points: 100 }
              as: TournamentDirector
              captures: { tid: $.data.id }
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "OPEN" }
              as: TournamentDirector
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${c1}" }
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${c2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MAX_ENTRIES_REACHED"

      - name: val_duplicate_entry_same_customer
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_ENTRY]", "validations[priority=8]"]
        distinguishing_aspect: "Registering the same customer twice into one tournament returns ERR_DUPLICATE_ENTRY."
        test_recipe:
          setup: ["Clock 2026-07-01. Venue; tournament OPEN; customer registered once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Dup Cust", email: "d@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Dup Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "Dup Cup", entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-08-01T00:00:00Z", start_at: "2026-09-26T06:00:00Z", end_at: "2026-09-26T18:00:00Z", max_entries: 10, prize_points: 100 }
              as: TournamentDirector
              captures: { tid: $.data.id }
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "OPEN" }
              as: TournamentDirector
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_ENTRY"

      - name: val_license_age_restriction_on_issue
        claim_type: Conditional validation
        grounds: ["errors[ERR_LICENSE_AGE_RESTRICTION]", "validations[priority=7]"]
        distinguishing_aspect: "Issuing a RESIDENT_ANNUAL to an 11-year-old (below MIN_AGE 16) returns ERR_LICENSE_AGE_RESTRICTION."
        test_recipe:
          setup: ["Clock 2026-07-01. CA customer born 2015 (age ~11)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Kid Angler", email: "k@x.com", state_code: "CA", birth_date: "2015-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { customer_id: "${cust_id}", license_type: "RESIDENT_ANNUAL", state_code: "CA", valid_from: "2026-07-01T00:00:00Z" }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LICENSE_AGE_RESTRICTION"

      - name: val_special_order_product_inactive
        claim_type: Violation → Error
        grounds: ["errors[ERR_PRODUCT_INACTIVE]", state_machines.SpecialOrder.REQUESTED_to_ORDERED]
        distinguishing_aspect: "Requesting a special order for an eligible but inactive product returns ERR_PRODUCT_INACTIVE."
        test_recipe:
          setup: ["Customer; product eligible but is_active=false."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Inact Cust", email: "ia@x.com", state_code: "CA", birth_date: "1990-05-05" }
