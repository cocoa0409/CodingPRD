            - "a follow-up GET /tennis/roster-spots with team_id=${tmd_id} returns $.data.total_count == 2"
            - "a follow-up GET /tennis/roster-spots with team_id=${tmd_id} and player_id=${pa3_id} returns $.data.total_count == 0"
            - "a follow-up GET /tennis/teams/${tmd_id} returns $.data.active_roster_size == 1 and $.data.version == ${tmd_v_live} because the rejected add must not bump the team version"

      - name: self_rating_a_computer_rated_player_returns_422_self_rating_locked
        claim_type: Conditional validation
        grounds:
          - validations.priority_38_ERR_SELF_RATING_LOCKED
        distinguishing_aspect: "Admissibility of the very same endpoint and payload shape is conditional on the target's current rating_type: SELF is accepted while the player is UNRATED or SELF_RATED and refused once the rating is COMPUTER_RATED, APPEAL_GRANTED or COMMITTEE_ASSIGNED, while a LeagueCoordinator-sourced COMPUTER rating stays admissible in exactly the state where SELF is not. The player acts on their own record, so no role or identity rule is involved."
        test_recipe:
          setup:
            - "The player already carries a coordinator-issued COMPUTER rating of 3.5, then attempts to self-rate themselves upward."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
          trigger:
            - call: "POST /tennis/players/${pa1_id}/ratings"
              payload: {source: "SELF", level: 4.0}
              as: Player
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 422"
            - "$.data.error_id == 'ERR_SELF_RATING_LOCKED'"
            - "a follow-up GET /tennis/players/${pa1_id} returns $.data.rating_type == 'COMPUTER_RATED', $.data.rating_level == 3.5 and $.data.self_rated_level == null"
            - "a follow-up POST /tennis/players/${pa1_id}/ratings with source COMPUTER and level 4.0 as LeagueCoordinator returns HTTP 200 with $.data.rating_level == 4.0, showing the block is conditional on source and not on the player state alone"

      - name: underage_and_below_band_activation_returns_the_age_error_not_the_rating_error
        claim_type: Priority conflict
        grounds:
          - validations.priority_35_ERR_AGE_GROUP_NOT_MET
          - validations.priority_36_ERR_RATING_LEVEL_EXCEEDS_LEAGUE
        distinguishing_aspect: "One activation violates two adjacent business_safety rules at once: league age 16 against AGE_18_OVER (priority 35) and a rating of 2.0 outside the 2.5-to-3.5 band of a 3.5 league (priority 36). Only the numerically lower priority may surface, and the losing code must be provably absent from the envelope rather than merely unlikely."
        test_recipe:
          setup:
            - "A junior player born in 2010 (league age 16 in season_year 2026) is rated COMPUTER 2.0, one half-step below the league band floor, and added to a roster in an AGE_18_OVER 3.5 league."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_ra1
            - *a_tma
            - &a_pz1
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Zane Junior", birth_year: 2010, gender: "M"}
              as: SectionAdmin
              captures: {pz1_id: "$.data.id"}
            - &a_rz1
              call: "POST /tennis/players/${pz1_id}/ratings"
              payload: {source: "COMPUTER", level: 2.0}
              as: LeagueCoordinator
            - &a_xz1
              call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pz1_id}", expected_team_version: "${tma_v0}"}
              as: Captain
              as_user_id: "${pa1_id}"
              captures: {rsz1_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/roster-spots/${rsz1_id}/activate"
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 422"
            - "$.data.error_id == 'ERR_AGE_GROUP_NOT_MET'"
            - "$.data.error_id != 'ERR_RATING_LEVEL_EXCEEDS_LEAGUE' because priority 35 outranks priority 36"
            - "a follow-up GET /tennis/roster-spots/${rsz1_id} returns $.data.status == 'PENDING' and $.data.level_at_add == null"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.active_roster_size == 0"

      - name: start_play_with_only_one_compliant_team_returns_409_roster_quota_not_met
        claim_type: Cascading validation
        grounds:
          - validations.priority_69_ERR_ROSTER_QUOTA_NOT_MET
        distinguishing_aspect: "The quota check does not read a stored flag on the league; it re-derives compliance through a three-level chain that a single strike moved: Player -> STRIKE_SUSPENDED, that player's ACTIVE RosterSpot -> INELIGIBLE, Team.active_roster_size 2 -> 1 so roster_compliant flips false, and only then does the league-level count of compliant teams fall to 1. Both teams were compliant at lock time, so an implementation that validates against the state captured at lock-rosters (or against registered_team_count, still 2) lets start-play through."
        test_recipe:
          setup:
            - "Two teams of exactly two active players each are registered and the rosters are locked, so the league is ROSTERS_LOCKED with two compliant teams. A SCORECARD_FALSIFICATION strike of weight 3 then reaches the section strike_limit of 3 for one player of the away team, cascading that team below min_active_roster_size 2."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_gta2
            - *a_xa2
            - *a_ya2
            - *a_rega
            - *a_pb1
            - *a_pb2
            - *a_rb1
            - *a_rb2
            - *a_tmb
            - *a_xb1
            - *a_yb1
            - *a_gtb2
            - *a_xb2
            - *a_yb2
            - *a_regb
            - *c_lock
            - *a_lock
            - &a_strk_b2
              call: "POST /tennis/strikes"
              payload: {player_id: "${pb2_id}", kind: "SCORECARD_FALSIFICATION", reason: "Falsified line scores on a prior scorecard"}
              as: LeagueCoordinator
              captures: {strk_b2_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/leagues/${lg_id}/start-play"
              as: LeagueCoordinator
          assert:
            - "HTTP 409"
            - "$.data.error_id == 'ERR_ROSTER_QUOTA_NOT_MET'"
            - "$.data.error_id != 'ERR_INVALID_STATE' because the league is in ROSTERS_LOCKED, the only admissible from-state for start-play"
            - "a follow-up GET /tennis/leagues/${lg_id} returns $.data.status == 'ROSTERS_LOCKED' and $.data.noncompliant_team_count == 1"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.status == 'ROSTER_LOCKED' and $.data.roster_compliant == true because the compliant team must not be promoted alone"
            - "a follow-up GET /tennis/teams/${tmb_id} returns $.data.status == 'ROSTER_LOCKED', $.data.active_roster_size == 1 and $.data.roster_compliant == false"
            - "a follow-up GET /tennis/players/${pb2_id} returns $.data.status == 'STRIKE_SUSPENDED' and $.data.strike_count == 3"

  - section: endpoints
