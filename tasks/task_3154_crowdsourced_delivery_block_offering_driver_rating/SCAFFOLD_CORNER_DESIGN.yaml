        as: Driver
        as_user_id: ${d}
        captures:
          v2: $.data.id
      assert:
      - first duplicate rejected 409 with captured ${err} == "ERR_DUPLICATE_VIN"
      - after retiring the original, the same VIN registers successfully (captured vehicle ${v2})
