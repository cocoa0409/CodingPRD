      - name: double_vote_same_store_same_promotion_conflict
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ALREADY_VOTED
        distinguishing_aspect: "A second live ballot for the same (store, promotion) is a 409 ERR_ALREADY_VOTED; after retracting, the same store may vote again — the uniqueness applies to live ballots only."
        test_recipe:
          setup: ["Logical clock default; territory with one OPEN store; promotion in VOTING; one FOR ballot live."]
          setup_api_calls:
