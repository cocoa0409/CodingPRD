          - endpoints[POST /awareness/curriculum-assignments/{id}/extension]
        distinguishing_aspect: "An extension must still move the deadline into the future: with the clock at 2026-08-20 an assignment due 2026-08-08 cannot be saved by 1 day (new deadline 2026-08-09, still past), returning ERR_EXTENSION_WINDOW_CLOSED (409), while 13 days (new deadline 2026-08-21) is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then advanced to 2026-08-20T00:00:00Z with no sweep in between (escalation_level stays 0)."
            - "A manager and a direct report; the report holds a REMEDIAL assignment (7-day base window) due 2026-08-08T00:00:00Z on a module with max_extension_days 20."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "mgr.window@corp.example", full_name: "Wes Manager", department: "IT", role_code: "MANAGER", hire_date: "2011-01-01" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "rep.window@corp.example", full_name: "Wren Report", department: "IT", role_code: "IT_ADMIN", hire_date: "2021-01-01", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "WIN-REM", title: "Window Probe Remedial", module_type: "REMEDIAL", max_extension_days: 20 }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "REMEDIAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id", due: "$.data.due_at" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/extension", payload: { extension_days: 1 }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /awareness/curriculum-assignments/${a}/extension", payload: { extension_days: 13 }, as: Manager, as_user_id: "${mgr}", captures: { eff: "$.data.effective_due_at" } }
          assert:
            - "CurriculumAssignment.${a}.due_at == 2026-08-08T00:00:00Z (REMEDIAL base window of 7 days)"
            - "the 1-day grant returns HTTP 409 with error_id ERR_EXTENSION_WINDOW_CLOSED"
            - "the 13-day grant returns HTTP 200 with effective_due_at == 2026-08-21T00:00:00Z and granted_extension_days == 13"
            - "after the successful grant escalation_level == 0 and next_reminder_due_at == 2026-08-19T00:00:00Z (effective_due_at minus the -2 offset is in the past, so the next unsent offset applies)"

      - name: submit_for_review_without_policy_acknowledgement_returns_422
        claim_type: conditional_validation
        grounds:
          - validations[priority 26]
          - errors[ERR_COMMUNICATION_POLICY_NOT_ACKNOWLEDGED]
          - entities.PhishingCampaign.fields.communication_policy_ack
        distinguishing_aspect: "communication_policy_ack defaults to false, so the simulation communication policy gate fires at review time, not at creation: the DRAFT campaign is created with 201 and only submit-for-review returns ERR_COMMUNICATION_POLICY_NOT_ACKNOWLEDGED (422)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One APPROVED_FOR_USE template; a campaign created without communication_policy_ack."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Policy Probe Template", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Unacknowledged Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC" }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "GET /awareness/campaigns/${c}", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
          assert:
            - "the campaign create returned HTTP 201 with communication_policy_ack == false (the default)"
            - "submit-for-review returns HTTP 422 with error_id ERR_COMMUNICATION_POLICY_NOT_ACKNOWLEDGED"
            - "PhishingCampaign.${c}.state is still DRAFT and version did not change"
            - "an otherwise identical campaign created with communication_policy_ack true reaches IN_REVIEW on submit-for-review"

      - name: offboarded_employee_cannot_receive_a_new_assignment_returns_409
        claim_type: violation_to_error
        grounds:
          - validations[priority 12]
          - errors[ERR_EMPLOYEE_OFFBOARDED]
          - entities.Employee.fields.employment_status
        distinguishing_aspect: "The offboarding gate is checked before any referential or eligibility rule on assignment creation: a PUBLISHED module and a fresh employee version are not enough, the create returns ERR_EMPLOYEE_OFFBOARDED (409) and a second offboard attempt returns the same error."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One employee, offboarded; one PUBLISHED ANNUAL module."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "olly.off@corp.example", full_name: "Olly Off", department: "HR", role_code: "IC", hire_date: "2017-03-03" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/training-modules", payload: { code: "OFF-ANNUAL", title: "Offboard Probe Module", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/employees/${e}/offboard", payload: {}, as: ProgramAdmin, captures: { off_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${off_v}" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees/${e}/offboard", payload: {}, as: ProgramAdmin }
          assert:
            - "the assignment create returns HTTP 409 with error_id ERR_EMPLOYEE_OFFBOARDED even though expected_employee_version was current"
            - "the second offboard returns HTTP 409 with error_id ERR_EMPLOYEE_OFFBOARDED"
            - "Employee.${e}.employment_status == OFFBOARDED and version == ${off_v}"
            - "the assignment listing for ${e} is empty"

      - name: schedule_with_an_empty_target_cohort_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority 25]
          - errors[ERR_EMPTY_TARGET_COHORT]
          - calculations.cohort_resolution
        distinguishing_aspect: "Cohort resolution happens at schedule time, not at creation: a campaign targeting a department with no ACTIVE employees is created and approved normally and only the schedule call returns ERR_EMPTY_TARGET_COHORT (422), leaving the campaign in APPROVED with no SimulationDelivery rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employees exist only in ENGINEERING; the campaign targets LEGAL."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "eng.only@corp.example", full_name: "Ella Eng", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-04-04" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Cohort Probe Template", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "LEGAL Empty Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["LEGAL"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-05T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}" }, as: ProgramAdmin }
          assert:
            - "HTTP 422 with error_id ERR_EMPTY_TARGET_COHORT"
            - "PhishingCampaign.${c}.state is still APPROVED with scheduled_send_at == null"
            - "the delivery listing for ${c} is empty and Employee.${e}.reserved_simulation_slots == 0"
            - "re-targeting the same campaign at ENGINEERING and scheduling succeeds, creating exactly one delivery"

      - name: harmful_theme_outranks_segregation_of_duties
        claim_type: priority_conflict
        grounds:
