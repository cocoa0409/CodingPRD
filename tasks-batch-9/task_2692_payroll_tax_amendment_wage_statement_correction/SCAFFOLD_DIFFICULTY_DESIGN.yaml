  - rule_id: boundary_precision_check
    instances:

      - name: cooling_off_buffer_admits_exactly_min_days_between_amendments
        grounds:
          - validations.priority_61.ERR_AMENDMENT_COOLING_OFF_ACTIVE
          - entities.TaxAgency.fields.min_days_between_amendments
          - entities.AmendedReturn.fields.submitted_at
        distinguishing_aspect: |
          Boundary metric: WHOLE_DAYS between the previous submission and now, against
          min_days_between_amendments = 45, exercised on
          POST /amended-returns/{amended_return_id}/submit. Day 44 must be refused and day 45 —
          exact equality on a half-open buffer — must be admitted, so an implementation using a
          strictly-greater comparison or counting calendar-month arithmetic fails on exactly one
          of the two calls.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Federal agency FED-941 with min_days_between_amendments 45 and amendment_window_days 1095."
