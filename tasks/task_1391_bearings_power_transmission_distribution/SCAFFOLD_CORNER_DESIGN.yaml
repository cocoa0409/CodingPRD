  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: invoice_requires_fully_shipped_order
        claim_type: conditional_action
        grounds:
          - "state_machines.SalesOrder"
          - "errors[ERR_ORDER_NOT_FULLY_SHIPPED]"
        distinguishing_aspect: "Invoice is a conditional action gated on aggregate child state: with one of two lines shipped (PARTIALLY_SHIPPED) it fails; after the second line ships (SHIPPED) the identical call succeeds and debits receivables."
        test_recipe:
          setup: ["order with two lines qty 1 each (unit 1000), both confirmed+reserved+allocated; only l1 shipped"]
          setup_api_calls:
            - call: "POST /motion/products"
              payload: { sku: "BRG-6039", description: "b", family: "BEARING", list_price_cents: 1000 }
              as: PricingAnalyst
              captures: { p_id: $.data.id }
            - call: "POST /motion/branches"
              payload: { code: "INV-26", timezone_offset_hours: 0, business_open_hour: 8, business_close_hour: 17, expedite_cutoff_hour: 14, after_hours_fee_cents: 20000 }
              as: SystemAdmin
              captures: { b_id: $.data.id }
            - call: "POST /motion/customers"
              payload: { name: "Invoice Plant", credit_limit_cents: 1000000 }
              as: ContractAdministrator
              captures: { c_id: $.data.id }
