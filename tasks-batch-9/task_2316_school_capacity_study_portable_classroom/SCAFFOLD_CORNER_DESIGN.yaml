          setup: ["one campus with two rooms, three projections and a submitted study"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
