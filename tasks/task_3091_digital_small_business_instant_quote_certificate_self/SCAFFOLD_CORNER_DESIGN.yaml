        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_CHANNEL_MISMATCH]"]
        distinguishing_aspect: "The channel constraint is symmetric: a DIRECT account supplying channel_partner_id violates the conditional just as a PARTNER account omitting it does."
        test_recipe:
          setup: ["CC_C admitted; one DIRECT account."]
