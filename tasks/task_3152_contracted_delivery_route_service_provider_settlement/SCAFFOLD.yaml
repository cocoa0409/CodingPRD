    side_effects: ["Dispute.status := EVIDENCE_SUBMITTED", "increment Dispute.version by 1"]

  - method: POST
    path: "/route-settlement/disputes/{id}/counter"
    description: "Analyst counter-offers on a dispute; the round counter is checked here."
    roles: [SettlementAnalyst]
    code: 200
    input: [counter_amount_cents]
    output: Dispute
    side_effects: ["Dispute.status := COUNTERED", "Dispute.rounds_used := Dispute.rounds_used + 1", "increment Dispute.version by 1"]

  - method: POST
    path: "/route-settlement/disputes/{id}/resubmit-evidence"
    description: "Provider re-files evidence, returning the dispute to the evidence state (cycle back-edge)."
    roles: [ServiceProvider]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status := EVIDENCE_SUBMITTED", "increment Dispute.version by 1"]

  - method: POST
    path: "/route-settlement/disputes/{id}/escalate"
    description: "Escalate a countered dispute to a manager."
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status := ESCALATED", "increment Dispute.version by 1"]

  - method: POST
    path: "/route-settlement/disputes/{id}/resolve"
    description: "Resolve a dispute and clear the week's release gate."
    roles: [SettlementAnalyst, AccountManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status := RESOLVED", "increment Dispute.version by 1"]

  - method: POST
    path: "/route-settlement/disputes/{id}/withdraw"
    description: "Provider withdraws its dispute."
    roles: [ServiceProvider]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute.status := WITHDRAWN", "increment Dispute.version by 1"]

  - method: POST
    path: "/route-settlement/peak-season-declarations"
    description: "Declare a peak-season surge window for a service area."
    roles: [AccountManager]
    code: 201
    input: [service_area_id, declaration_code, starts_on, ends_on, authorized_vehicles, authorized_drivers]
    output: PeakSeasonDeclaration
    side_effects: ["PeakSeasonDeclaration.status := DECLARED"]

  - method: GET
    path: "/route-settlement/peak-season-declarations"
    description: "List peak-season declarations with optional area and status filters."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: ["service_area_id?", "status?", "limit?", "offset?"]
    output: PeakSeasonDeclaration[]
    side_effects: []

  - method: GET
    path: "/route-settlement/peak-season-declarations/{id}"
    description: "Read a single declaration."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: PeakSeasonDeclaration
    side_effects: []

  - method: POST
    path: "/route-settlement/peak-season-declarations/{id}/activate"
    description: "Activate a declaration once its window has opened and its capacity is within limits."
    roles: [AccountManager]
    code: 200
    input: []
    output: PeakSeasonDeclaration
    side_effects: ["PeakSeasonDeclaration.status := ACTIVE", "increment PeakSeasonDeclaration.version by 1"]

  - method: POST
    path: "/route-settlement/peak-season-declarations/{id}/end"
    description: "End a declaration, decommissioning its temporary vehicles and terminating its temporary drivers."
    roles: [AccountManager]
    code: 200
    input: []
    output: PeakSeasonDeclaration
    side_effects: ["PeakSeasonDeclaration.status := ENDED", "cascade: temporary Vehicle rows set to DECOMMISSIONED", "cascade: temporary Driver rows set to TERMINATED and qualification_status := UNQUALIFIED", "recompute owned_driver_count_reconciliation", "increment PeakSeasonDeclaration.version by 1"]

  - method: POST
    path: "/route-settlement/peak-season-declarations/{id}/cancel"
    description: "Cancel a declaration before it opens."
    roles: [AccountManager]
    code: 200
    input: []
    output: PeakSeasonDeclaration
    side_effects: ["PeakSeasonDeclaration.status := CANCELED", "increment PeakSeasonDeclaration.version by 1"]

  - method: POST
    path: "/route-settlement/fuel-index-rates"
    description: "Publish a regional fuel index rate."
    roles: [PlatformAdmin]
    code: 201
    input: [region_state_code, effective_on, rate_cents_per_mile]
    output: FuelIndexRate
    side_effects: ["FuelIndexRate.published_by := the publishing X-User-ID"]

  - method: GET
    path: "/route-settlement/fuel-index-rates"
    description: "List fuel index rates with an optional state filter; the latest effective row is the selected index for a week."
    roles: [AccountManager, SettlementAnalyst, PlatformAdmin, ServiceProvider]
    code: 200
    input: ["region_state_code?", "limit?", "offset?"]
    output: FuelIndexRate[]
    side_effects: []

  - method: GET
    path: "/route-settlement/fuel-index-rates/{id}"
    description: "Read a single fuel index rate row."
    roles: [AccountManager, SettlementAnalyst, PlatformAdmin, ServiceProvider]
    code: 200
    input: []
    output: FuelIndexRate
    side_effects: []

  - method: POST
    path: "/route-settlement/_clock/set_current_utc"
    description: "Test-driving logical clock setter. The server's startup default time is 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads exactly that default and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects: ["the logical clock advances to to_iso8601"]

  - method: GET
    path: "/route-settlement/_clock/current_utc"
    description: "Test-driving logical clock reader; returns the current logical instant."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/service-areas"
    description: "Reverse lookup: the service areas whose active title is held by this provider."
    roles: [AccountManager, SettlementAnalyst, ComplianceOfficer, ServiceProvider]
    code: 200
    input: []
    output: ServiceArea[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/route-assignments"
    description: "Reverse lookup: the route assignment titles held or acquired by this provider."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: RouteAssignment[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/agreements"
    description: "Reverse lookup: the agreements binding this provider."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: Agreement[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/vehicles"
    description: "Reverse lookup: this provider's vehicle fleet."
    roles: [AccountManager, ComplianceOfficer, ServiceProvider]
    code: 200
    input: []
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/drivers"
    description: "Reverse lookup: this provider's driver roster."
    roles: [AccountManager, ComplianceOfficer, ServiceProvider]
    code: 200
    input: []
    output: Driver[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/insurance-policies"
    description: "Reverse lookup: the insurance certificates filed by this provider."
    roles: [AccountManager, ComplianceOfficer, ServiceProvider]
    code: 200
    input: []
    output: InsurancePolicy[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/settlement-periods"
    description: "Reverse lookup: the weekly settlement periods opened for this provider."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: SettlementPeriod[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/performance-metrics"
    description: "Reverse lookup: this provider's performance scorecards."
    roles: [AccountManager, SettlementAnalyst, ComplianceOfficer, ServiceProvider]
    code: 200
    input: []
    output: PerformanceMetric[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}/chargeback-claims"
    description: "Reverse lookup: the charge-back claims asserted against this provider."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: ChargebackClaim[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-areas/{id}/agreements"
    description: "Reverse lookup: the agreements governing this service area."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: Agreement[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-areas/{id}/peak-season-declarations"
    description: "Reverse lookup: the peak-season declarations recorded for this service area."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
    output: PeakSeasonDeclaration[]
    side_effects: []

  - method: GET
    path: "/route-settlement/route-assignments/{id}/successors"
    description: "Reverse lookup: the successor titles minted when this assignment title was transferred."
    roles: [AccountManager, SettlementAnalyst]
    code: 200
    input: []
    output: RouteAssignment[]
    side_effects: []

  - method: GET
    path: "/route-settlement/settlement-periods/{id}/chargeback-claims"
    description: "Reverse lookup: the charge-back claims asserted against this settlement week."
    roles: [AccountManager, SettlementAnalyst, ServiceProvider]
    code: 200
    input: []
