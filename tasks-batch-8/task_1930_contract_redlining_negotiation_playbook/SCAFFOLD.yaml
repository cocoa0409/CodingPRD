scenario: |
  1930. Contract Redlining & Negotiation Playbook (in-house contracts team): template & clause library with fallback positions, intake triage by contract type/value & routing, automated deviation detection against playbook, approval escalation for non-standard terms, negotiation history & version comparison, signature routing & execution record, obligation extraction into repository, cycle-time & bottleneck analytics

domain_name: contract-redlining-playbook
api_prefix: ""

complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: compliance-audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Playbook
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Playbook display name" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | DEPRECATED", constraints: "DRAFT -> ACTIVE -> DEPRECATED; once DEPRECATED cannot return" }
      - { name: published_at, type: datetime, source: system, description: "Server timestamp when transitioned DRAFT -> ACTIVE; null until then", default: null }
      - { name: clause_count, type: integer, source: computed, default: 0, description: "Count of ClauseTemplate children with status != RETIRED" }
      - { name: active_negotiation_count, type: integer, source: computed, default: 0, description: "Count of Negotiation rows whose playbook_id == this.id AND draft_status NOT IN {EXECUTED, ABORTED}" }

  - name: ClauseTemplate
    parent: Playbook
    common_fields: true
    fields:
      - { name: playbook_id, type: string, source: system, description: "FK -> Playbook.id; owning playbook" }
      - { name: clause_key, type: string, source: input, description: "Stable machine key, unique within parent Playbook (e.g., 'LIMITATION_OF_LIABILITY', 'GOVERNING_LAW')" }
      - { name: category, type: enum, source: input, description: "RISK | COMMERCIAL | OPERATIONAL | REGULATORY" }
      - { name: standard_text, type: string, source: input, description: "Canonical clause body" }
      - { name: fallback_positions, type: array, source: input, description: "Ordered array of up to 3 fallback texts; index 0 is most-preferred fallback. Empty array means no fallback permitted." , constraints: "length 0..3; order matters" }
      - { name: approver_role_required, type: enum, source: input, description: "LEGAL_COUNSEL | FINANCE_CONTROLLER | BUSINESS_OWNER | CHIEF_COUNSEL; minimum role that must approve a deviation against this clause" }
      - { name: deviation_severity_cap, type: enum, source: input, description: "LOW | MEDIUM | HIGH; maximum severity an ordinary approver may clear; HIGH forces CHIEF_COUNSEL escalation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: ContractType
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique machine code (e.g., 'NDA','MSA','SOW','DPA','RESA')" }
      - { name: display_name, type: string, source: input, description: "Human label" }
      - { name: low_value_threshold_cents, type: integer, source: input, description: "Inclusive upper bound of LOW tier: contract_value_cents <= this -> LOW" }
      - { name: mid_value_threshold_cents, type: integer, source: input, description: "Inclusive upper bound of MID tier; strictly greater than low_value_threshold_cents", constraints: "mid_value_threshold_cents > low_value_threshold_cents" }
      - { name: high_value_threshold_cents, type: integer, source: input, description: "Inclusive upper bound of HIGH tier; strictly greater than mid_value_threshold_cents", constraints: "high_value_threshold_cents > mid_value_threshold_cents" }
      - { name: auto_approve_below_cents, type: integer, source: input, description: "Contract value strictly less than this threshold auto-approves standard-only deviations; 0 disables auto-approval" }
      - { name: requires_chief_counsel_above_cents, type: integer, source: input, description: "Any deviation on contract with value >= this requires CHIEF_COUNSEL regardless of clause severity cap" }
      - { name: default_business_owner_id, type: string, source: input, description: "FK -> User.id; default BusinessOwner for routing" }
      - { name: default_legal_counsel_id, type: string, source: input, description: "FK -> User.id; default LegalCounsel for routing" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: Counterparty
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered name" }
      - { name: jurisdiction, type: string, source: input, description: "ISO country or state code" }
      - { name: risk_tier, type: enum, source: input, default: STANDARD, description: "LOW | STANDARD | HIGH_RISK | SANCTIONED" }
      - { name: active_negotiation_count, type: integer, source: computed, default: 0, description: "Count of Negotiation rows referencing this counterparty with draft_status NOT IN {EXECUTED, ABORTED}" }
      - { name: last_executed_at, type: datetime, source: system, description: "Timestamp of most recent EXECUTED negotiation; null if none", default: null }

  - name: User
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email, unique" }
      - { name: display_name, type: string, source: input, description: "Full name" }
      - { name: primary_role, type: enum, source: input, description: "CONTRACT_ANALYST | BUSINESS_OWNER | LEGAL_COUNSEL | FINANCE_CONTROLLER | CHIEF_COUNSEL | SIGNATORY | OPS_ADMIN" }
      - { name: can_sign_above_cents, type: integer, source: input, default: 0, description: "Signatory authority ceiling: may execute contracts with contract_value_cents strictly less than this" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DEACTIVATED" }

  - name: IntakeRequest
    parent: null
    common_fields: true
    fields:
      - { name: submitted_by_user_id, type: string, source: input, description: "FK -> User.id; analyst or business owner who filed intake" }
      - { name: contract_type_id, type: string, source: input, description: "FK -> ContractType.id" }
      - { name: counterparty_id, type: string, source: input, description: "FK -> Counterparty.id" }
      - { name: contract_value_cents, type: integer, source: input, description: "Stated value; must be > 0" }
      - { name: effective_date, type: datetime, source: input, description: "Requested contract effective date" }
      - { name: routing_bucket, type: enum, source: computed, description: "SELF_SERVE | STANDARD | ELEVATED | EXECUTIVE; derived from value tier + counterparty risk" }
      - { name: assigned_owner_id, type: string, source: computed, description: "FK -> User.id; BusinessOwner picked by triage", default: null }
      - { name: assigned_legal_id, type: string, source: computed, description: "FK -> User.id; LegalCounsel picked by triage", default: null }
      - { name: triage_decision_id, type: string, source: computed, description: "FK -> TriageDecision.id; append-only audit pointer", default: null }
      - { name: status, type: enum, source: system, default: PENDING_TRIAGE, description: "PENDING_TRIAGE | ROUTED | NEGOTIATION_OPENED | REJECTED | CANCELLED" }

  - name: TriageDecision
    parent: IntakeRequest
    common_fields: false
    fields:
      - { name: intake_request_id, type: string, source: system, description: "FK -> IntakeRequest.id" }
      - { name: decided_at, type: datetime, source: system, description: "Server timestamp when triage ran" }
      - { name: routing_bucket, type: enum, source: system, description: "SELF_SERVE | STANDARD | ELEVATED | EXECUTIVE" }
      - { name: value_tier, type: enum, source: system, description: "LOW | MID | HIGH | VERY_HIGH; derived from ContractType thresholds" }
      - { name: counterparty_risk, type: enum, source: system, description: "Snapshot of Counterparty.risk_tier at decision time" }
      - { name: rationale, type: string, source: system, description: "Human-readable derivation trace" }
      - { name: decided_by, type: enum, source: system, description: "SYSTEM | ANALYST_OVERRIDE" }

  - name: Negotiation
    parent: IntakeRequest
    common_fields: true
    fields:
      - { name: intake_request_id, type: string, source: system, description: "FK -> IntakeRequest.id" }
      - { name: playbook_id, type: string, source: input, description: "FK -> Playbook.id; pinned at creation" }
      - { name: playbook_version_at_pin, type: integer, source: system, description: "Playbook.version at the moment of creation; used for staleness detection" }
      - { name: contract_value_cents, type: integer, source: input, description: "Final negotiated value; seeded from IntakeRequest" }
      - { name: contract_type_id, type: string, source: system, description: "FK -> ContractType.id; copied from IntakeRequest" }
      - { name: counterparty_id, type: string, source: system, description: "FK -> Counterparty.id; copied from IntakeRequest" }
      - { name: business_owner_id, type: string, source: system, description: "FK -> User.id; routed at triage" }
      - { name: legal_counsel_id, type: string, source: system, description: "FK -> User.id; routed at triage" }
      - { name: drafter_user_id, type: string, source: input, description: "FK -> User.id; analyst or counsel who opened negotiation; segregated from approver" }
      - { name: draft_status, type: enum, source: system, default: OPEN, description: "OPEN | REDLINING | AWAITING_COUNTERSIGN | EXECUTED | ABORTED" }
      - { name: approval_status, type: enum, source: system, default: NO_DEVIATIONS, description: "NO_DEVIATIONS | DEVIATIONS_PENDING | APPROVED_WITH_DEVIATIONS | BLOCKED" }
      - { name: signature_status, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED | ROUTING | PARTIALLY_SIGNED | FULLY_SIGNED | EXECUTION_RECORDED" }
      - { name: current_round_index, type: integer, source: system, default: 0, description: "0 until first round opens; increments monotonically" }
      - { name: open_deviation_count, type: integer, source: computed, default: 0, description: "Count of Deviation rows for this negotiation in {OPEN, IN_REVIEW, ESCALATED}" }
      - { name: blocking_deviation_count, type: integer, source: computed, default: 0, description: "Count of Deviation rows in {OPEN, ESCALATED} — gates round advancement" }
      - { name: cycle_time_seconds, type: integer, source: computed, description: "EXECUTED.timestamp - created_at; 0 until executed" }
      - { name: total_rounds, type: integer, source: computed, default: 0, description: "Count of NegotiationRound rows" }

  - name: NegotiationRound
    parent: Negotiation
    common_fields: false
    fields:
      - { name: negotiation_id, type: string, source: system, description: "FK -> Negotiation.id" }
      - { name: round_index, type: integer, source: system, description: "Monotonically increasing per negotiation; unique within negotiation" }
      - { name: opened_at, type: datetime, source: system, description: "Server timestamp when round opened" }
      - { name: closed_at, type: datetime, source: system, description: "Server timestamp when round closed; null while open", default: null }
      - { name: opened_by_user_id, type: string, source: system, description: "FK -> User.id" }
      - { name: closed_by_user_id, type: string, source: system, description: "FK -> User.id; null while open", default: null }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | SUPERSEDED" }
      - { name: change_summary, type: string, source: input, description: "Free-text summary captured at open" }
      - { name: clause_change_count, type: integer, source: computed, default: 0, description: "Count of Deviation rows created during this round" }
      - { name: round_duration_seconds, type: integer, source: computed, description: "closed_at - opened_at; null while open", default: null }

  - name: Deviation
    parent: Negotiation
    common_fields: true
    fields:
      - { name: negotiation_id, type: string, source: system, description: "FK -> Negotiation.id" }
      - { name: round_id, type: string, source: system, description: "FK -> NegotiationRound.id; round in which this deviation was detected" }
      - { name: clause_template_id, type: string, source: input, description: "FK -> ClauseTemplate.id; clause being deviated" }
      - { name: proposed_text, type: string, source: input, description: "Counterparty's proposed clause text" }
      - { name: fallback_index, type: integer, source: input, description: "0-based index into ClauseTemplate.fallback_positions, or -1 to declare non-standard text outside all fallbacks" }
      - { name: severity, type: enum, source: computed, description: "STANDARD | FALLBACK | NON_STANDARD; derived from fallback_index and fallback_positions length" }
      - { name: risk_score, type: integer, source: computed, description: "0..100 computed per risk scoring rule" }
      - { name: required_approver_role, type: enum, source: computed, description: "LEGAL_COUNSEL | FINANCE_CONTROLLER | BUSINESS_OWNER | CHIEF_COUNSEL; derived from clause cap, severity, contract value, and counterparty risk" }
      - { name: escalated_to_chief_counsel, type: boolean, source: computed, default: false, description: "True when required_approver_role was raised to CHIEF_COUNSEL beyond clause cap" }
      - { name: assigned_approver_id, type: string, source: computed, description: "FK -> User.id; resolved by approver selection", default: null }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_REVIEW | APPROVED | REJECTED | ESCALATED | WITHDRAWN | SUPERSEDED" }
      - { name: opened_at, type: datetime, source: system, description: "Server timestamp at creation" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp at APPROVED/REJECTED/WITHDRAWN/SUPERSEDED; null otherwise", default: null }
      - { name: cycle_time_seconds, type: integer, source: computed, description: "resolved_at - opened_at; null until resolved", default: null }

  - name: ApprovalDecision
    parent: Deviation
    common_fields: false
    fields:
      - { name: deviation_id, type: string, source: system, description: "FK -> Deviation.id" }
      - { name: decided_by_user_id, type: string, source: input, description: "FK -> User.id; approver casting this decision" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT | ESCALATE | ABSTAIN" }
      - { name: decision_rationale, type: string, source: input, description: "Free-text rationale (required on REJECT and ESCALATE)" }
      - { name: decided_at, type: datetime, source: system, description: "Server timestamp" }
      - { name: snapshot_clause_version, type: integer, source: system, description: "ClauseTemplate.version observed at decision time; used for staleness audit" }

  - name: SignaturePacket
    parent: Negotiation
    common_fields: true
    fields:
      - { name: negotiation_id, type: string, source: system, description: "FK -> Negotiation.id" }
      - { name: signatories, type: array, source: input, description: "Ordered array of { user_id, order_index, authority_cap_cents } — signature routing order matters" }
      - { name: signature_window_opens_at, type: datetime, source: input, description: "Earliest valid signing timestamp" }
      - { name: signature_window_closes_at, type: datetime, source: input, description: "Latest valid signing timestamp; must be > opens_at" }
      - { name: signed_record, type: array, source: system, description: "Append-only list of { user_id, signed_at, signature_hash }" }
      - { name: status, type: enum, source: system, default: ROUTING, description: "ROUTING | PARTIALLY_SIGNED | FULLY_SIGNED | EXPIRED | VOIDED" }

  - name: Obligation
    parent: Negotiation
    common_fields: false
    fields:
      - { name: negotiation_id, type: string, source: system, description: "FK -> Negotiation.id" }
      - { name: clause_template_id, type: string, source: system, description: "FK -> ClauseTemplate.id; source clause" }
      - { name: obligation_text, type: string, source: system, description: "Extracted commitment text (final approved text — standard, fallback, or approved non-standard)" }
      - { name: extraction_source, type: enum, source: system, description: "STANDARD_TEXT | FALLBACK_POSITION | APPROVED_DEVIATION" }
      - { name: owner_role, type: enum, source: system, description: "BUSINESS_OWNER | LEGAL_COUNSEL | FINANCE_CONTROLLER; derived from clause category" }
      - { name: due_offset_days, type: integer, source: input, description: "Days after effective_date when obligation matures" }
      - { name: due_date, type: datetime, source: computed, description: "effective_date + due_offset_days" }
      - { name: extracted_at, type: datetime, source: system, description: "Server timestamp of extraction" }

state_machines:
  - entity: Playbook
    initial_state: DRAFT
    terminal_states: [DEPRECATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /playbooks/{playbookId}/publish"
        actor: ChiefCounsel
        preconditions:
          - "clause_count >= 1 (ERR_PLAYBOOK_EMPTY)"
          - "At least one ClauseTemplate child with status == ACTIVE (ERR_PLAYBOOK_NO_ACTIVE_CLAUSES)"
        side_effects:
          - "published_at = current server UTC"
          - "Playbook.version increments by 1"

      - from: ACTIVE
        to: DEPRECATED
        trigger: "POST /playbooks/{playbookId}/deprecate"
        actor: ChiefCounsel
        preconditions:
          - "active_negotiation_count == 0 (ERR_PLAYBOOK_IN_USE)"
        side_effects:
          - "Playbook.version increments by 1"

      - from: DRAFT
        to: DEPRECATED
        trigger: "POST /playbooks/{playbookId}/deprecate"
        actor: ChiefCounsel
        preconditions: []
        side_effects:
          - "Playbook.version increments by 1"

  - entity: ClauseTemplate
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /playbooks/{playbookId}/clauses/{clauseId}/retire"
        actor: ChiefCounsel
        preconditions:
          - "parent Playbook.status == ACTIVE (ERR_PLAYBOOK_NOT_ACTIVE)"
          - "No Deviation in {OPEN, IN_REVIEW, ESCALATED} references this clause (ERR_CLAUSE_HAS_OPEN_DEVIATIONS)"
        side_effects:
          - "Playbook.clause_count decrements by 1"
          - "Playbook.version increments by 1"

  - entity: ContractType
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /contract-types/{typeId}/retire"
        actor: OpsAdmin
        preconditions:
          - "No Negotiation with contract_type_id == this.id AND draft_status NOT IN {EXECUTED, ABORTED} (ERR_CONTRACT_TYPE_IN_USE)"
        side_effects: []

  - entity: IntakeRequest
    initial_state: PENDING_TRIAGE
    terminal_states: [REJECTED, CANCELLED, NEGOTIATION_OPENED]
    transitions:
      - from: PENDING_TRIAGE
        to: ROUTED
        trigger: "POST /intake-requests/{id}/triage"
        actor: ContractAnalyst
        preconditions:
          - "contract_type_id references a ContractType with status == ACTIVE (ERR_CONTRACT_TYPE_INACTIVE)"
          - "counterparty_id references a Counterparty with risk_tier != SANCTIONED (ERR_COUNTERPARTY_SANCTIONED)"
        side_effects:
          - "Create TriageDecision with computed routing_bucket, value_tier, counterparty_risk snapshot, decided_by=SYSTEM"
          - "IntakeRequest.routing_bucket = TriageDecision.routing_bucket"
          - "IntakeRequest.assigned_owner_id = ContractType.default_business_owner_id"
          - "IntakeRequest.assigned_legal_id = ContractType.default_legal_counsel_id"
          - "IntakeRequest.triage_decision_id = new TriageDecision.id"

      - from: ROUTED
        to: NEGOTIATION_OPENED
        trigger: "POST /intake-requests/{id}/open-negotiation"
        actor: ContractAnalyst
        preconditions:
          - "playbook_id in body references a Playbook with status == ACTIVE (ERR_PLAYBOOK_NOT_ACTIVE)"
          - "expected_intake_request_version in body matches IntakeRequest.version (OCC; ERR_STALE_VERSION)"
        side_effects:
          - "Create Negotiation: intake_request_id=this.id; playbook_id from body; playbook_version_at_pin=Playbook.version; contract_value_cents seeded from this.contract_value_cents; contract_type_id and counterparty_id copied; business_owner_id=assigned_owner_id; legal_counsel_id=assigned_legal_id; drafter_user_id=body.drafter_user_id"
          - "Counterparty.active_negotiation_count increments by 1"
          - "Playbook.active_negotiation_count increments by 1"
          - "IntakeRequest.version increments by 1"

      - from: PENDING_TRIAGE
        to: REJECTED
        trigger: "POST /intake-requests/{id}/reject"
        actor: ContractAnalyst
        preconditions:
          - "rejection_reason required (ERR_INVALID_REQUEST)"
        side_effects:
          - "IntakeRequest.version increments by 1"

      - from: PENDING_TRIAGE
        to: CANCELLED
        trigger: "POST /intake-requests/{id}/cancel"
        actor: ContractAnalyst
        preconditions: []
        side_effects:
          - "IntakeRequest.version increments by 1"

      - from: ROUTED
        to: CANCELLED
        trigger: "POST /intake-requests/{id}/cancel"
        actor: ContractAnalyst
        preconditions: []
        side_effects:
          - "IntakeRequest.version increments by 1"

  - entity: Negotiation
    initial_state: "OPEN / NO_DEVIATIONS / NOT_STARTED (three parallel dimensions)"
    terminal_states: ["EXECUTED (draft) + APPROVED_WITH_DEVIATIONS or NO_DEVIATIONS (approval) + EXECUTION_RECORDED (signature)", "ABORTED (draft; approval and signature frozen)"]
    note: "Three independent parallel state dimensions on one entity. draft_status advances via rounds and execution; approval_status derives from deviations; signature_status advances via SignaturePacket transitions."
    transitions:
      # draft_status transitions
      - from: OPEN
        to: REDLINING
        trigger: "POST /negotiations/{id}/rounds (first round opens)"
        actor: ContractAnalyst
        preconditions:
          - "current_round_index == 0"
          - "No existing NegotiationRound with status == OPEN (ERR_ROUND_ALREADY_OPEN)"
        side_effects:
          - "Create NegotiationRound round_index=1, opened_at=now, opened_by_user_id=actor"
          - "current_round_index = 1"
          - "total_rounds = 1"
          - "Negotiation.version increments by 1"

      - from: REDLINING
        to: REDLINING
        trigger: "POST /negotiations/{id}/rounds/{roundId}/close followed by POST /negotiations/{id}/rounds (next round opens)"
        actor: ContractAnalyst
        preconditions:
          - "blocking_deviation_count == 0 (ERR_DEVIATIONS_BLOCKING_ROUND_CLOSE) — no Deviation in {OPEN, ESCALATED}"
          - "Current round.status == OPEN (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Current NegotiationRound.status -> CLOSED; closed_at=now; closed_by_user_id=actor; round_duration_seconds computed"
          - "Create next NegotiationRound with round_index = current_round_index + 1"
          - "current_round_index increments by 1"
          - "total_rounds increments by 1"
          - "Negotiation.version increments by 1"

      - from: REDLINING
        to: AWAITING_COUNTERSIGN
        trigger: "POST /negotiations/{id}/finalize-redlining"
        actor: LegalCounsel
        preconditions:
          - "approval_status IN {NO_DEVIATIONS, APPROVED_WITH_DEVIATIONS} (ERR_DEVIATIONS_UNRESOLVED)"
          - "Current round.status == OPEN (closed as part of this transition)"
          - "playbook_version_at_pin == Playbook.version OR playbook_staleness_override == true in body (ERR_PLAYBOOK_STALE)"
        side_effects:
          - "Close current round (same fields as close-round)"
          - "Negotiation.version increments by 1"

      - from: AWAITING_COUNTERSIGN
        to: EXECUTED
        trigger: "POST /negotiations/{id}/signature-packets/{packetId}/record-execution"
        actor: Signatory
        preconditions:
          - "SignaturePacket.status == FULLY_SIGNED (ERR_SIGNATURE_INCOMPLETE)"
          - "execution_timestamp in body within [signature_window_opens_at, signature_window_closes_at] (ERR_SIGNATURE_WINDOW_VIOLATION)"
          - "Signer authority: for each signed_record entry, User.can_sign_above_cents > contract_value_cents (ERR_SIGNATORY_AUTHORITY_EXCEEDED)"
        side_effects:
          - "SignaturePacket.status -> EXECUTION_RECORDED"
          - "Negotiation.signature_status -> EXECUTION_RECORDED"
          - "cycle_time_seconds = execution_timestamp - created_at (in seconds)"
          - "Counterparty.last_executed_at = execution_timestamp"
          - "Counterparty.active_negotiation_count decrements by 1"
          - "Playbook.active_negotiation_count decrements by 1"
          - "Spawn Obligation extraction: one Obligation per Deviation where status==APPROVED plus one per ClauseTemplate used as standard text (no deviation created); extraction_source per Deviation.severity mapping"
          - "Negotiation.version increments by 1"

      - from: OPEN
        to: ABORTED
        trigger: "POST /negotiations/{id}/abort"
        actor: ContractAnalyst
        preconditions: []
        side_effects:
          - "Any Deviation in {OPEN, IN_REVIEW, ESCALATED} -> WITHDRAWN"
          - "Counterparty.active_negotiation_count decrements by 1"
          - "Playbook.active_negotiation_count decrements by 1"
          - "Negotiation.version increments by 1"

      - from: REDLINING
        to: ABORTED
        trigger: "POST /negotiations/{id}/abort"
        actor: ContractAnalyst
        preconditions: []
        side_effects:
          - "Any NegotiationRound with status == OPEN -> SUPERSEDED, closed_at=now"
          - "Any Deviation in {OPEN, IN_REVIEW, ESCALATED} -> WITHDRAWN, resolved_at=now"
          - "Counterparty.active_negotiation_count decrements by 1"
          - "Playbook.active_negotiation_count decrements by 1"
          - "Negotiation.version increments by 1"

      - from: AWAITING_COUNTERSIGN
        to: ABORTED
        trigger: "POST /negotiations/{id}/abort"
        actor: LegalCounsel
        preconditions:
          - "No SignaturePacket with status == FULLY_SIGNED or EXECUTION_RECORDED (ERR_SIGNATURE_ALREADY_FINAL)"
        side_effects:
          - "Any SignaturePacket with status IN {ROUTING, PARTIALLY_SIGNED} -> VOIDED"
          - "Counterparty.active_negotiation_count decrements by 1"
          - "Playbook.active_negotiation_count decrements by 1"
          - "Negotiation.version increments by 1"

      # approval_status transitions (derived from deviations; system-driven)
      - from: NO_DEVIATIONS
        to: DEVIATIONS_PENDING
        trigger: "system (first Deviation created on this negotiation)"
        actor: system
        preconditions: []
        side_effects:
          - "Negotiation.version increments by 1"

      - from: DEVIATIONS_PENDING
        to: APPROVED_WITH_DEVIATIONS
        trigger: "system (open_deviation_count transitions from >0 to 0 AND at least one Deviation was APPROVED, none REJECTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEVIATIONS_PENDING
        to: BLOCKED
        trigger: "system (any Deviation transitions to REJECTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BLOCKED
        to: DEVIATIONS_PENDING
        trigger: "system (REJECTED Deviation is WITHDRAWN by drafter, returning open_deviation_count>0 with no REJECTED remaining)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BLOCKED
        to: NO_DEVIATIONS
        trigger: "system (all REJECTED deviations WITHDRAWN and no other deviations remain — i.e., open_deviation_count==0 AND no APPROVED exist)"
        actor: system
        preconditions: []
        side_effects: []

      # signature_status transitions (driven by SignaturePacket)
      - from: NOT_STARTED
        to: ROUTING
        trigger: "POST /negotiations/{id}/signature-packets (create first packet)"
        actor: LegalCounsel
        preconditions:
          - "draft_status == AWAITING_COUNTERSIGN (ERR_INVALID_STATE_TRANSITION)"
          - "No existing SignaturePacket with status IN {ROUTING, PARTIALLY_SIGNED, FULLY_SIGNED} (ERR_SIGNATURE_PACKET_ALREADY_ACTIVE)"
        side_effects:
          - "Create SignaturePacket: signatories from body, signature_window_opens_at/closes_at from body"
          - "Negotiation.version increments by 1"

      - from: ROUTING
        to: PARTIALLY_SIGNED
        trigger: "POST /negotiations/{id}/signature-packets/{packetId}/sign (first signatory signs)"
        actor: Signatory
        preconditions:
          - "Actor's user_id appears in signatories at the smallest order_index not yet in signed_record (ERR_SIGNATORY_OUT_OF_ORDER)"
          - "now within [signature_window_opens_at, signature_window_closes_at] (ERR_SIGNATURE_WINDOW_VIOLATION)"
          - "User.can_sign_above_cents > Negotiation.contract_value_cents (ERR_SIGNATORY_AUTHORITY_EXCEEDED)"
        side_effects:
          - "Append { user_id, signed_at=now, signature_hash=sha256(user_id||now) } to signed_record"
          - "SignaturePacket.status -> PARTIALLY_SIGNED"

      - from: PARTIALLY_SIGNED
        to: PARTIALLY_SIGNED
        trigger: "POST /negotiations/{id}/signature-packets/{packetId}/sign (middle signatory)"
        actor: Signatory
        preconditions:
          - "Actor's user_id is the next-expected signatory per order_index"
          - "now within window"
          - "User.can_sign_above_cents > Negotiation.contract_value_cents"
        side_effects:
          - "Append to signed_record"

      - from: PARTIALLY_SIGNED
        to: FULLY_SIGNED
        trigger: "POST /negotiations/{id}/signature-packets/{packetId}/sign (final signatory signs)"
        actor: Signatory
        preconditions:
          - "After this signature, signed_record covers all signatories"
        side_effects:
          - "Append to signed_record"
          - "SignaturePacket.status -> FULLY_SIGNED"
          - "Negotiation.signature_status -> FULLY_SIGNED"

      - from: ROUTING
        to: NOT_STARTED
        trigger: "POST /negotiations/{id}/signature-packets/{packetId}/void"
        actor: LegalCounsel
        preconditions:
          - "signed_record is empty (ERR_SIGNATURE_ALREADY_STARTED)"
        side_effects:
          - "SignaturePacket.status -> VOIDED"
          - "Negotiation.signature_status -> NOT_STARTED"

      # Time-driven expiry
      - from: ROUTING
        to: NOT_STARTED
        trigger: "system (when signature_window_closes_at passes without completion)"
        actor: system
        preconditions: []
        side_effects:
          - "SignaturePacket.status -> EXPIRED"

      - from: PARTIALLY_SIGNED
        to: NOT_STARTED
        trigger: "system (when signature_window_closes_at passes without completion)"
        actor: system
        preconditions: []
        side_effects:
          - "SignaturePacket.status -> EXPIRED"

  - entity: Deviation
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /negotiations/{nid}/deviations/{did}/begin-review"
        actor: LegalCounsel
        preconditions:
          - "Actor's user_id == Deviation.assigned_approver_id OR actor holds CHIEF_COUNSEL role (ERR_NOT_ASSIGNED_APPROVER)"
          - "Negotiation.draft_status == REDLINING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Negotiation.version increments by 1"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /negotiations/{nid}/deviations/{did}/decide (decision=APPROVE)"
        actor: LegalCounsel
        preconditions:
          - "Actor's user_id == Deviation.assigned_approver_id (segregation of duties: actor != Deviation.negotiation.drafter_user_id) (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Actor.primary_role meets or exceeds required_approver_role (ERR_INSUFFICIENT_APPROVER_ROLE)"
          - "expected_negotiation_version in body matches Negotiation.version (OCC; ERR_STALE_VERSION)"
        side_effects:
          - "Create ApprovalDecision row with snapshot_clause_version = ClauseTemplate.version"
          - "Deviation.resolved_at = now; cycle_time_seconds computed"
          - "Negotiation.open_deviation_count decrements by 1"
          - "Negotiation.blocking_deviation_count decrements by 1"
          - "Negotiation.approval_status recomputed (may go to APPROVED_WITH_DEVIATIONS if all resolved and >=1 APPROVED)"
          - "Negotiation.version increments by 1"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /negotiations/{nid}/deviations/{did}/decide (decision=REJECT)"
        actor: LegalCounsel
        preconditions:
          - "Actor's user_id == Deviation.assigned_approver_id AND actor != drafter"
          - "decision_rationale required (ERR_INVALID_REQUEST)"
          - "expected_negotiation_version in body matches Negotiation.version (OCC)"
        side_effects:
          - "Create ApprovalDecision row"
          - "Deviation.resolved_at = now"
          - "Negotiation.open_deviation_count decrements by 1"
          - "Negotiation.blocking_deviation_count decrements by 1"
          - "Negotiation.approval_status -> BLOCKED"
          - "Negotiation.version increments by 1"

      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /negotiations/{nid}/deviations/{did}/decide (decision=ESCALATE)"
        actor: LegalCounsel
        preconditions:
          - "Actor's user_id == Deviation.assigned_approver_id AND actor != drafter"
          - "decision_rationale required"
          - "ClauseTemplate.deviation_severity_cap != LOW (LOW severity cannot escalate — must APPROVE or REJECT) (ERR_SEVERITY_NOT_ESCATABLE)"
          - "expected_negotiation_version matches Negotiation.version (OCC)"
        side_effects:
          - "Create ApprovalDecision row with decision=ESCALATE"
          - "Deviation.assigned_approver_id re-resolved to the User with primary_role==CHIEF_COUNSEL and lowest active_deviation_load (ties: User.created_at ASC)"
          - "Deviation.escalated_to_chief_counsel = true"
          - "Deviation.required_approver_role = CHIEF_COUNSEL"
          - "Negotiation.version increments by 1"

      - from: ESCALATED
        to: APPROVED
        trigger: "POST /negotiations/{nid}/deviations/{did}/decide (decision=APPROVE, actor=CHIEF_COUNSEL)"
        actor: ChiefCounsel
        preconditions:
          - "Actor.primary_role == CHIEF_COUNSEL AND actor.user_id == Deviation.assigned_approver_id"
          - "Actor != drafter_user_id"
          - "expected_negotiation_version matches Negotiation.version (OCC)"
        side_effects:
          - "Create ApprovalDecision"
          - "Deviation.resolved_at = now"
          - "open_deviation_count and blocking_deviation_count decrement"
          - "Negotiation.version increments by 1"

      - from: ESCALATED
        to: REJECTED
        trigger: "POST /negotiations/{nid}/deviations/{did}/decide (decision=REJECT, actor=CHIEF_COUNSEL)"
        actor: ChiefCounsel
        preconditions:
          - "Actor == assigned_approver_id; actor != drafter_user_id"
          - "decision_rationale required"
          - "expected_negotiation_version matches Negotiation.version (OCC)"
        side_effects:
          - "Negotiation.approval_status -> BLOCKED"
          - "open_deviation_count and blocking_deviation_count decrement"
          - "Negotiation.version increments by 1"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /negotiations/{nid}/deviations/{did}/withdraw"
        actor: ContractAnalyst
        preconditions:
          - "Actor.user_id == Negotiation.drafter_user_id (ERR_NOT_DRAFTER)"
          - "Negotiation.draft_status IN {OPEN, REDLINING} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Deviation.resolved_at = now"
          - "open_deviation_count and blocking_deviation_count decrement"
          - "Negotiation.approval_status recomputed (may go BLOCKED->DEVIATIONS_PENDING or NO_DEVIATIONS)"
          - "Negotiation.version increments by 1"

      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /negotiations/{nid}/deviations/{did}/withdraw"
        actor: ContractAnalyst
        preconditions:
          - "Actor.user_id == Negotiation.drafter_user_id"
          - "Negotiation.draft_status IN {OPEN, REDLINING}"
        side_effects:
          - "open_deviation_count and blocking_deviation_count decrement"
          - "Negotiation.version increments by 1"

      - from: REJECTED
        to: WITHDRAWN
        trigger: "POST /negotiations/{nid}/deviations/{did}/withdraw (drafter withdraws rejected deviation to unblock)"
        actor: ContractAnalyst
        preconditions:
          - "Actor.user_id == Negotiation.drafter_user_id"
          - "Negotiation.draft_status IN {OPEN, REDLINING}"
        side_effects:
          - "Negotiation.approval_status recomputed (BLOCKED -> DEVIATIONS_PENDING if other open deviations remain; -> NO_DEVIATIONS if no deviations remain; -> APPROVED_WITH_DEVIATIONS if only APPROVED remain)"
          - "Negotiation.version increments by 1"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system (when a new Deviation is created on the same (negotiation_id, clause_template_id) while an existing Deviation for that pair is in {OPEN, IN_REVIEW})"
        actor: system
        preconditions: []
        side_effects:
          - "Prior deviation's resolved_at = now"
          - "open_deviation_count and blocking_deviation_count decrement for the superseded one, increment for the new one (net 0)"
          - "Negotiation.version increments by 1"

  - entity: SignaturePacket
    initial_state: ROUTING
    terminal_states: [EXECUTION_RECORDED, EXPIRED, VOIDED]
    transitions:
      - from: ROUTING
        to: PARTIALLY_SIGNED
        trigger: "POST .../sign (first signatory)"
        actor: Signatory
        preconditions: ["covered in Negotiation machine"]
        side_effects: ["Negotiation.signature_status -> PARTIALLY_SIGNED"]

      - from: PARTIALLY_SIGNED
        to: FULLY_SIGNED
        trigger: "POST .../sign (last signatory)"
        actor: Signatory
        preconditions: ["covered in Negotiation machine"]
        side_effects: ["Negotiation.signature_status -> FULLY_SIGNED"]

      - from: FULLY_SIGNED
        to: EXECUTION_RECORDED
        trigger: "POST .../record-execution"
        actor: Signatory
        preconditions: ["covered in Negotiation machine"]
        side_effects: ["Negotiation.signature_status -> EXECUTION_RECORDED"]

      - from: ROUTING
        to: VOIDED
        trigger: "POST .../void"
        actor: LegalCounsel
        preconditions: ["signed_record empty"]
        side_effects: ["Negotiation.signature_status -> NOT_STARTED"]

      - from: ROUTING
        to: EXPIRED
        trigger: "system (window close passes)"
        actor: system
        preconditions: []
        side_effects: ["Negotiation.signature_status -> NOT_STARTED"]

      - from: PARTIALLY_SIGNED
        to: EXPIRED
        trigger: "system (window close passes)"
        actor: system
        preconditions: []
        side_effects: ["Negotiation.signature_status -> NOT_STARTED"]

concurrency_rules:
  - rule_id: negotiation-open-stale-intake
    parent_entity: IntakeRequest
    write_endpoint: "POST /intake-requests/{id}/open-negotiation"
    occ_field: "expected_intake_request_version"
    description: |
      Opening a Negotiation against an IntakeRequest whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION. A
      prior open-negotiation or cancel by another writer advances the version;
      the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deviation-decide-stale-negotiation
    parent_entity: Negotiation
    write_endpoint: "POST /negotiations/{nid}/deviations/{did}/decide"
    occ_field: "expected_negotiation_version"
    description: |
      Casting an approval decision against a Negotiation whose version has
      advanced since the approver last observed it is rejected with
      ERR_STALE_VERSION. Any concurrent mutation — a new round opened, another
      deviation decided, an escalation resolving the assigned_approver — bumps
      Negotiation.version; the current approver's snapshot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: signature-packet-create-stale-negotiation
    parent_entity: Negotiation
    write_endpoint: "POST /negotiations/{id}/signature-packets"
    occ_field: "expected_negotiation_version"
    description: |
      Creating a SignaturePacket against a Negotiation whose version has
      advanced since the caller last observed it is rejected. A prior packet
      creation by another counsel legitimately supersedes the caller's view
      of negotiation state.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: value_tier_assignment
    trigger: "IntakeRequest triage (POST /intake-requests/{id}/triage)"
    algorithm: threshold
    formula: |
      ct = ContractType[IntakeRequest.contract_type_id]
      v = IntakeRequest.contract_value_cents
      if v <= ct.low_value_threshold_cents: tier = LOW
      elif v <= ct.mid_value_threshold_cents: tier = MID
      elif v <= ct.high_value_threshold_cents: tier = HIGH
      else: tier = VERY_HIGH
    input_set: "Single IntakeRequest at triage time; thresholds snapshotted from ContractType"
    precision: "integer cents; boundary is inclusive (<=) on the upper bound of each tier"
    constants:
      BOUNDARY_SEMANTIC: "inclusive upper bound, exclusive lower bound of next tier"

  - name: routing_bucket_derivation
    trigger: "IntakeRequest triage (POST /intake-requests/{id}/triage)"
    algorithm: constraint_propagation
    formula: |
      tier = value_tier_assignment(intake)
      risk = Counterparty.risk_tier
      # 4x4 mapping, evaluated in this exact order (first match wins):
      if risk == SANCTIONED:        bucket = REJECT           # terminal: refuse routing
      elif risk == HIGH_RISK:       bucket = EXECUTIVE        # any value -> executive
      elif tier == VERY_HIGH:       bucket = EXECUTIVE
      elif tier == HIGH:            bucket = ELEVATED
      elif tier == MID:             bucket = STANDARD
      elif tier == LOW AND v < ct.auto_approve_below_cents: bucket = SELF_SERVE
      else:                          bucket = STANDARD
    input_set: "IntakeRequest + ContractType + Counterparty"
    precision: "enum"
    variants:
      - name: analyst_override
        when: "Triage request body includes override_routing_bucket AND actor holds ContractAnalyst with supervisor flag"
        difference: "Analyst may shift bucket up by one level (SELF_SERVE->STANDARD->ELEVATED->EXECUTIVE) but never down. Override is recorded as decided_by=ANALYST_OVERRIDE."

  - name: deviation_severity_classification
    trigger: "Deviation creation (POST /negotiations/{nid}/deviations)"
    algorithm: constraint_propagation
    formula: |
      ct = ClauseTemplate[Deviation.clause_template_id]
      if Deviation.fallback_index == -1:
        severity = NON_STANDARD
      elif Deviation.fallback_index >= len(ct.fallback_positions):
        reject with ERR_FALLBACK_INDEX_OUT_OF_RANGE
      elif len(ct.fallback_positions) == 0:
        # no fallback configured; any non-negative index is out of range
        reject with ERR_FALLBACK_INDEX_OUT_OF_RANGE
      else:
        severity = FALLBACK
      # Fallback positions 0..len-1 are all severity FALLBACK;
      # severity STANDARD only when no Deviation row exists for the clause at all.
    input_set: "Single Deviation + its ClauseTemplate"
    precision: "enum"

  - name: deviation_risk_score
    trigger: "Deviation creation; recomputed on escalation"
    algorithm: weighted_scoring
    formula: |
      # Inputs:
      #   sev_score: STANDARD=0, FALLBACK=10, NON_STANDARD=30
      #   cat_score: OPERATIONAL=0, COMMERCIAL=5, REGULATORY=15, RISK=20
      #   val_score: based on value tier — LOW=0, MID=5, HIGH=15, VERY_HIGH=25
      #   risk_score_ctpy: LOW=0, STANDARD=5, HIGH_RISK=15, SANCTIONED=N/A (rejected earlier)
      #   round_penalty: (current_round_index - 1) * 2  — late-round changes add risk
      # Formula:
      base = sev_score + cat_score + val_score + risk_score_ctpy + round_penalty
      # Apply cap based on clause's deviation_severity_cap:
      if ClauseTemplate.deviation_severity_cap == LOW:    cap = 30
      elif ClauseTemplate.deviation_severity_cap == MEDIUM: cap = 60
      else:                                                cap = 100
      risk_score = min(cap, base)
    input_set: "Deviation + ClauseTemplate + Negotiation + Counterparty + current_round_index"
    precision: "integer 0..100"
    constants:
      SEV_STANDARD: 0
      SEV_FALLBACK: 10
      SEV_NON_STANDARD: 30
      CAT_OPERATIONAL: 0
      CAT_COMMERCIAL: 5
      CAT_REGULATORY: 15
      CAT_RISK: 20
      TIER_LOW: 0
      TIER_MID: 5
      TIER_HIGH: 15
      TIER_VERY_HIGH: 25
      RISK_LOW: 0
      RISK_STANDARD: 5
      RISK_HIGH: 15
      ROUND_PENALTY_PER_ROUND: 2

  - name: required_approver_role_resolution
    trigger: "Deviation creation; recomputed on escalation"
    algorithm: constraint_propagation
    formula: |
      # Step 1: start with clause's approver_role_required
      role = ClauseTemplate.approver_role_required
      # Step 2: raise to CHIEF_COUNSEL if severity == NON_STANDARD AND clause.deviation_severity_cap == HIGH
      if Deviation.severity == NON_STANDARD AND ClauseTemplate.deviation_severity_cap == HIGH:
        role = CHIEF_COUNSEL
        escalated = true
      # Step 3: raise to CHIEF_COUNSEL if contract value exceeds threshold
      if Negotiation.contract_value_cents >= ContractType.requires_chief_counsel_above_cents:
        role = CHIEF_COUNSEL
        escalated = true
      # Step 4: raise to FINANCE_CONTROLLER if severity != STANDARD AND contract_value_cents >= ContractType.high_value_threshold_cents AND clause.category == COMMERCIAL
      if Deviation.severity != STANDARD AND Negotiation.contract_value_cents >= ContractType.high_value_threshold_cents AND ClauseTemplate.category == COMMERCIAL:
        if role != CHIEF_COUNSEL: role = FINANCE_CONTROLLER
      # Step 5: raise to BUSINESS_OWNER if clause.category == OPERATIONAL AND severity == FALLBACK AND role is still LEGAL_COUNSEL
      if ClauseTemplate.category == OPERATIONAL AND Deviation.severity == FALLBACK AND role == LEGAL_COUNSEL:
        role = BUSINESS_OWNER
      # Step 6: auto-approve when negotiation value < auto_approve_below_cents AND severity == FALLBACK
      # -> resolved without human decision (Deviation goes OPEN -> APPROVED by system)
    input_set: "Deviation + ClauseTemplate + Negotiation + ContractType"
    precision: "enum"

  - name: cycle_time_aggregation
    trigger: "Negotiation reaches EXECUTED; recomputed on read of analytics endpoints"
    algorithm: aggregation
    formula: |
      # For a single Negotiation:
      negotiation_cycle_seconds = executed_at - created_at
      # For cohort aggregations (used by /analytics/cycle-time):
      # cohort = set of Negotiation rows where draft_status == EXECUTED
      #         AND executed_at within [from_iso, to_iso)
      #         AND contract_type_id == requested filter (if supplied)
      # percentile_rank(values, p):
      #   sort values ASC; rank = ceil(p/100 * N); pick value at 1-indexed rank
      #   (nearest-rank method; N==0 -> null)
      # p50 = percentile_rank(values, 50); p90 = percentile_rank(values, 90); p99 = percentile_rank(values, 99)
    input_set: "All Negotiation rows in cohort; closed interval [from_iso, to_iso) on executed_at"
    precision: "integer seconds"
    variants:
      - name: active_cohort
        when: "Analytic scoped to negotiations still in-flight (draft_status NOT IN {EXECUTED, ABORTED})"
        difference: "cycle_time_seconds for in-flight = current_server_utc - created_at (provisional); excludes ABORTED entirely from all percentile math"

  - name: bottleneck_attribution
    trigger: "Read of /analytics/bottlenecks"
    algorithm: chronological
    formula: |
      # For each Deviation resolved within the window, attribute cycle seconds
      # to the phase that consumed them:
      #   legal_review_seconds  = sum over resolved deviations of (resolved_at - opened_at)
      #                            where the deviation was never ESCALATED
      #   escalated_seconds     = sum over resolved deviations of (resolved_at - opened_at)
      #                            where escalated_to_chief_counsel == true
      #   drafter_rework_seconds = sum over NegotiationRounds of round_duration_seconds
      #                            where the round produced >= 1 deviation (clause_change_count > 0)
      #   signature_wait_seconds = sum over SignaturePackets in EXECUTION_RECORDED
      #                            of (last signed_at - signature_window_opens_at)
      # Tie-break on equal seconds across two phases: order is
      #   escalated_seconds, legal_review_seconds, drafter_rework_seconds, signature_wait_seconds
      # The bottleneck with strictly-greatest seconds is reported as primary_bottleneck.
    input_set: "All Deviations, NegotiationRounds, and SignaturePackets within the cohort window"
    precision: "integer seconds"

  - name: obligation_due_date
    trigger: "Obligation extraction on Negotiation EXECUTED"
    algorithm: forward_looking
    formula: |
      obligation.due_date = IntakeRequest.effective_date + (due_offset_days * 86400 seconds)
    input_set: "One Obligation at a time"
    precision: "ISO8601 datetime, second precision"
    variants:
      - name: regulatory_clamp
        when: "ClauseTemplate.category == REGULATORY"
        difference: "due_date is clamped to a maximum of effective_date + 30 days, regardless of due_offset_days"

  - name: playbook_staleness_check
    trigger: "POST /negotiations/{id}/finalize-redlining"
    algorithm: threshold
    formula: |
      stale = (Negotiation.playbook_version_at_pin != Playbook.version)
      # Caller may override with playbook_staleness_override=true; otherwise ERR_PLAYBOOK_STALE.
    input_set: "Negotiation + Playbook"
    precision: "boolean"

  - name: signature_authority_check
    trigger: "POST .../signature-packets/{packetId}/sign"
    algorithm: threshold
    formula: |
      # Signer's User.can_sign_above_cents must be STRICTLY GREATER than
      # Negotiation.contract_value_cents. Boundary: equal is rejected.
      allowed = (User.can_sign_above_cents > Negotiation.contract_value_cents)
    input_set: "Signatory User + Negotiation"
    precision: "boolean; strict >"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID resolves to a User row with status == ACTIVE"
    error_id: ERR_USER_NOT_FOUND
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Caller's role is permitted on this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path-template ids resolve, left-to-right: playbook, clause, intake, negotiation, round, deviation, packet"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys exist (clause_template_id, playbook_id, contract_type_id, counterparty_id, default_*_user_id, drafter_user_id)"
    error_id: ERR_FOREIGN_KEY_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints with FK payloads"

  - priority: 6
    category: business_safety
    check: "Counterparty.risk_tier != SANCTIONED on IntakeRequest.triage"
    error_id: ERR_COUNTERPARTY_SANCTIONED
    http_status: 409
    applies_to: "POST /intake-requests/{id}/triage"

  - priority: 7
    category: state
    check: "Resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: state
    check: "Parent playbook is ACTIVE on clause-retire and on open-negotiation"
    error_id: ERR_PLAYBOOK_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /playbooks/{id}/clauses/{cid}/retire; POST /intake-requests/{id}/open-negotiation"

  - priority: 9
    category: state
    check: "Negotiation OCC: expected_negotiation_version matches Negotiation.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../decide; POST /negotiations/{id}/signature-packets; POST /intake-requests/{id}/open-negotiation"

  - priority: 10
    category: business_constraint
    check: "Deviation uniqueness: at most one Deviation in {OPEN, IN_REVIEW, ESCALATED} per (negotiation_id, clause_template_id); new creation supersedes prior only when prior is in {OPEN, IN_REVIEW}"
    error_id: ERR_DEVIATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /negotiations/{nid}/deviations"

  - priority: 11
    category: business_constraint
    check: "fallback_index in range: -1 OR 0..len(ClauseTemplate.fallback_positions)-1"
    error_id: ERR_FALLBACK_INDEX_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /negotiations/{nid}/deviations"

  - priority: 12
    category: business_constraint
    check: "Round-open precondition: no OPEN round exists; blocking_deviation_count == 0 on close"
    error_id: ERR_DEVIATIONS_BLOCKING_ROUND_CLOSE
    http_status: 409
    applies_to: "POST /negotiations/{id}/rounds/{rid}/close"

  - priority: 13
    category: business_constraint
    check: "Round uniqueness: NegotiationRound.round_index unique within negotiation"
    error_id: ERR_ROUND_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /negotiations/{id}/rounds"

  - priority: 14
    category: business_safety
    check: "Segregation of duties: approver != drafter_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST .../decide"

  - priority: 15
    category: business_safety
    check: "Approver role meets required_approver_role"
    error_id: ERR_INSUFFICIENT_APPROVER_ROLE
    http_status: 403
    applies_to: "POST .../decide"

  - priority: 16
    category: business_safety
    check: "Signatory authority: User.can_sign_above_cents > Negotiation.contract_value_cents (strict >)"
    error_id: ERR_SIGNATORY_AUTHORITY_EXCEEDED
    http_status: 403
    applies_to: "POST .../sign; POST .../record-execution"

  - priority: 17
    category: business_temporal
    check: "Signature timestamp within [signature_window_opens_at, signature_window_closes_at]"
    error_id: ERR_SIGNATURE_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST .../sign; POST .../record-execution"

  - priority: 18
    category: business_temporal
    check: "Signatories must sign in order_index order"
    error_id: ERR_SIGNATORY_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST .../sign"

  - priority: 19
    category: business_referential
    check: "Playbook playbook_version_at_pin == Playbook.version on finalize-redlining unless override"
    error_id: ERR_PLAYBOOK_STALE
    http_status: 409
    applies_to: "POST /negotiations/{id}/finalize-redlining"

  - priority: 20
    category: business_referential
    check: "Playbook deprecate precondition: no active negotiations reference it"
    error_id: ERR_PLAYBOOK_IN_USE
    http_status: 409
    applies_to: "POST /playbooks/{id}/deprecate"

  - priority: 21
    category: business_referential
    check: "Clause retire precondition: no open deviations reference it"
    error_id: ERR_CLAUSE_HAS_OPEN_DEVIATIONS
    http_status: 409
    applies_to: "POST /playbooks/{id}/clauses/{cid}/retire"

  - priority: 22
    category: business_referential
    check: "ContractType retire precondition: no active negotiations reference it"
    error_id: ERR_CONTRACT_TYPE_IN_USE
    http_status: 409
    applies_to: "POST /contract-types/{id}/retire"

  - priority: 23
    category: business_constraint
    check: "ContractType thresholds strictly ascending: low < mid < high"
    error_id: ERR_THRESHOLDS_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /contract-types"

  - priority: 24
    category: business_constraint
    check: "Playbook publish precondition: at least one ACTIVE clause"
    error_id: ERR_PLAYBOOK_NO_ACTIVE_CLAUSES
    http_status: 409
    applies_to: "POST /playbooks/{id}/publish"

  - priority: 25
    category: business_constraint
    check: "Severity not escatable: LOW-severity-cap clauses cannot be escalated"
    error_id: ERR_SEVERITY_NOT_ESCATABLE
    http_status: 409
    applies_to: "POST .../decide (decision=ESCALATE)"

  - priority: 26
    category: business_constraint
    check: "Decision rationale required on REJECT and ESCALATE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST .../decide; POST /intake-requests/{id}/reject"

endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Default startup time is 2026-08-01T00:00:00Z; before any set_current_utc call, the logical clock reads exactly that instant and never falls back to wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["Set logical clock; fire time-driven transitions (signature expiry)"]

  # --- Playbook ---
  - method: POST
    path: "/playbooks"
    description: "Create a Playbook in DRAFT"
    roles: [ChiefCounsel, OpsAdmin]
    code: 201
    input: [name]
    output: Playbook
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/playbooks"
    description: "List Playbooks"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Playbook[]"
    side_effects: []

  - method: GET
    path: "/playbooks/{playbookId}"
    description: "Get a Playbook"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: Playbook
    side_effects: []

  - method: POST
    path: "/playbooks/{playbookId}/publish"
    description: "Publish a Playbook (DRAFT -> ACTIVE)"
    roles: [ChiefCounsel]
    code: 200
    input: []
    output: Playbook
    side_effects: ["published_at = now"]

  - method: POST
    path: "/playbooks/{playbookId}/deprecate"
    description: "Deprecate a Playbook"
    roles: [ChiefCounsel]
    code: 200
    input: []
    output: Playbook
    side_effects: []

  - method: GET
    path: "/playbooks/{playbookId}/clauses"
    description: "List ClauseTemplates under a Playbook (FK reverse-reachability)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: "ClauseTemplate[]"
    side_effects: []

  - method: POST
    path: "/playbooks/{playbookId}/clauses"
    description: "Create a ClauseTemplate under a Playbook"
    roles: [ChiefCounsel]
    code: 201
    input: [clause_key, category, standard_text, fallback_positions, approver_role_required, deviation_severity_cap]
    output: ClauseTemplate
    side_effects: ["Playbook.clause_count increments by 1", "Playbook.version increments by 1"]

  - method: GET
    path: "/playbooks/{playbookId}/clauses/{clauseId}"
    description: "Get a ClauseTemplate"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: ClauseTemplate
    side_effects: []

  - method: POST
    path: "/playbooks/{playbookId}/clauses/{clauseId}/retire"
    description: "Retire a ClauseTemplate"
    roles: [ChiefCounsel]
    code: 200
    input: []
    output: ClauseTemplate
    side_effects: ["Playbook.clause_count decrements by 1"]

  # --- ContractType ---
  - method: POST
    path: "/contract-types"
    description: "Create a ContractType"
    roles: [OpsAdmin]
    code: 201
    input: [code, display_name, low_value_threshold_cents, mid_value_threshold_cents, high_value_threshold_cents, auto_approve_below_cents, requires_chief_counsel_above_cents, default_business_owner_id, default_legal_counsel_id]
    output: ContractType
    side_effects: []

  - method: GET
    path: "/contract-types"
    description: "List ContractTypes (FK reverse-reachability via default_business_owner_id?, default_legal_counsel_id?)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["status?", "default_business_owner_id?", "default_legal_counsel_id?", "limit?", "offset?"]
    output: "ContractType[]"
    side_effects: []

  - method: GET
    path: "/contract-types/{typeId}"
    description: "Get a ContractType"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: ContractType
    side_effects: []

  - method: POST
    path: "/contract-types/{typeId}/retire"
    description: "Retire a ContractType"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: ContractType
    side_effects: []

  # --- Counterparty ---
  - method: POST
    path: "/counterparties"
    description: "Create a Counterparty"
    roles: [OpsAdmin, ContractAnalyst]
    code: 201
    input: [legal_name, jurisdiction, "risk_tier?"]
    output: Counterparty
    side_effects: []

  - method: GET
    path: "/counterparties"
    description: "List Counterparties"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["risk_tier?", "limit?", "offset?"]
    output: "Counterparty[]"
    side_effects: []

  - method: GET
    path: "/counterparties/{counterpartyId}"
    description: "Get a Counterparty"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: Counterparty
    side_effects: []

  # --- User ---
  - method: POST
    path: "/users"
    description: "Create a User"
    roles: [OpsAdmin]
    code: 201
    input: [email, display_name, primary_role, "can_sign_above_cents?"]
    output: User
    side_effects: []

  - method: GET
    path: "/users"
    description: "List Users"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["primary_role?", "status?", "limit?", "offset?"]
    output: "User[]"
    side_effects: []

  - method: GET
    path: "/users/{userId}"
    description: "Get a User"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: User
    side_effects: []

  # --- IntakeRequest ---
  - method: POST
    path: "/intake-requests"
    description: "Submit an intake request for triage"
    roles: [ContractAnalyst, BusinessOwner]
    code: 201
    input: [submitted_by_user_id, contract_type_id, counterparty_id, contract_value_cents, effective_date]
    output: IntakeRequest
    side_effects: ["status=PENDING_TRIAGE"]

  - method: GET
    path: "/intake-requests"
    description: "List IntakeRequests (FK reverse-reachability via submitted_by_user_id?, contract_type_id?, counterparty_id?, assigned_owner_id?, assigned_legal_id?, triage_decision_id?)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["submitted_by_user_id?", "contract_type_id?", "counterparty_id?", "assigned_owner_id?", "assigned_legal_id?", "triage_decision_id?", "status?", "routing_bucket?", "limit?", "offset?"]
    output: "IntakeRequest[]"
    side_effects: []

  - method: GET
    path: "/intake-requests/{intakeRequestId}"
    description: "Get an IntakeRequest"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: IntakeRequest
    side_effects: []

  - method: POST
    path: "/intake-requests/{intakeRequestId}/triage"
    description: "Run triage; create TriageDecision and route"
    roles: [ContractAnalyst]
    code: 200
    input: ["override_routing_bucket?"]
    output: IntakeRequest
    side_effects: ["Create TriageDecision", "status -> ROUTED", "assigned_owner_id and assigned_legal_id resolved"]

  - method: GET
    path: "/intake-requests/{intakeRequestId}/triage-decisions"
    description: "List TriageDecisions for an IntakeRequest (FK reverse-reachability)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "TriageDecision[]"
    side_effects: []

  - method: POST
    path: "/intake-requests/{intakeRequestId}/reject"
    description: "Reject an intake request at triage"
    roles: [ContractAnalyst]
    code: 200
    input: [rejection_reason]
    output: IntakeRequest
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/intake-requests/{intakeRequestId}/cancel"
    description: "Cancel an intake request"
    roles: [ContractAnalyst]
    code: 200
    input: []
    output: IntakeRequest
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/intake-requests/{intakeRequestId}/open-negotiation"
    description: "Open a Negotiation from a ROUTED intake"
    roles: [ContractAnalyst]
    code: 201
    input: [playbook_id, drafter_user_id, expected_intake_request_version]
    output: Negotiation
    side_effects:
      - "IntakeRequest.status -> NEGOTIATION_OPENED"
      - "Counterparty.active_negotiation_count increments by 1"
      - "Playbook.active_negotiation_count increments by 1"
      - "increments IntakeRequest.version by 1"

  # --- Negotiation ---
  - method: GET
    path: "/negotiations"
    description: "List Negotiations (FK reverse-reachability via intake_request_id?, playbook_id?, contract_type_id?, counterparty_id?, business_owner_id?, legal_counsel_id?, drafter_user_id?)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["intake_request_id?", "playbook_id?", "contract_type_id?", "counterparty_id?", "business_owner_id?", "legal_counsel_id?", "drafter_user_id?", "draft_status?", "approval_status?", "signature_status?", "limit?", "offset?"]
    output: "Negotiation[]"
    side_effects: []

  - method: GET
    path: "/negotiations/{negotiationId}"
    description: "Get a Negotiation"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: Negotiation
    side_effects: []

  - method: POST
    path: "/negotiations/{negotiationId}/rounds"
    description: "Open a new NegotiationRound"
    roles: [ContractAnalyst]
    code: 201
    input: [change_summary]
    output: NegotiationRound
    side_effects:
      - "current_round_index increments by 1"
      - "total_rounds increments by 1"
      - "draft_status: OPEN -> REDLINING on first round"
      - "increments Negotiation.version by 1"

  - method: GET
    path: "/negotiations/{negotiationId}/rounds"
    description: "List NegotiationRounds (FK reverse-reachability: negotiation_id via path; opened_by_user_id? and closed_by_user_id? filters for User FK)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["status?", "opened_by_user_id?", "closed_by_user_id?", "limit?", "offset?"]
    output: "NegotiationRound[]"
    side_effects: []

  - method: GET
    path: "/negotiations/{negotiationId}/rounds/{roundId}"
    description: "Get a NegotiationRound"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: NegotiationRound
    side_effects: []

  - method: POST
    path: "/negotiations/{negotiationId}/rounds/{roundId}/close"
    description: "Close a round (requires no blocking deviations)"
    roles: [ContractAnalyst]
    code: 200
    input: []
    output: NegotiationRound
    side_effects:
      - "round.status -> CLOSED"
      - "round.closed_at = now"
      - "round_duration_seconds computed"
      - "increments Negotiation.version by 1"

  - method: POST
    path: "/negotiations/{negotiationId}/finalize-redlining"
    description: "Finalize redlining and move to AWAITING_COUNTERSIGN"
    roles: [LegalCounsel]
    code: 200
    input: ["playbook_staleness_override?"]
    output: Negotiation
    side_effects:
      - "draft_status -> AWAITING_COUNTERSIGN"
      - "current round closed"
      - "increments Negotiation.version by 1"

  - method: POST
    path: "/negotiations/{negotiationId}/abort"
    description: "Abort negotiation (any non-terminal state)"
    roles: [ContractAnalyst, LegalCounsel]
    code: 200
    input: []
    output: Negotiation
    side_effects:
      - "draft_status -> ABORTED"
      - "Open deviations -> WITHDRAWN"
      - "Open rounds -> SUPERSEDED"
      - "Active signature packets -> VOIDED"
      - "Counterparty.active_negotiation_count decrements"
      - "Playbook.active_negotiation_count decrements"
      - "increments Negotiation.version by 1"

  # --- Deviation ---
  - method: POST
    path: "/negotiations/{negotiationId}/deviations"
    description: "Detect/record a deviation against the playbook"
    roles: [ContractAnalyst, LegalCounsel]
    code: 201
    input: [clause_template_id, proposed_text, fallback_index]
    output: Deviation
    side_effects:
      - "severity, risk_score, required_approver_role computed"
      - "assigned_approver_id resolved"
      - "Supersede prior Deviation for same (negotiation, clause) in {OPEN, IN_REVIEW}"
      - "open_deviation_count and blocking_deviation_count update"
      - "approval_status: NO_DEVIATIONS -> DEVIATIONS_PENDING on first"
      - "increments Negotiation.version by 1"

  - method: GET
    path: "/negotiations/{negotiationId}/deviations"
    description: "List Deviations for a Negotiation (FK reverse-reachability: negotiation_id via path; clause_template_id?, round_id?, assigned_approver_id? filters)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["status?", "severity?", "clause_template_id?", "round_id?", "assigned_approver_id?", "limit?", "offset?"]
    output: "Deviation[]"
    side_effects: []

  - method: GET
    path: "/negotiations/{negotiationId}/deviations/{deviationId}"
    description: "Get a Deviation"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: Deviation
    side_effects: []

  - method: POST
    path: "/negotiations/{negotiationId}/deviations/{deviationId}/begin-review"
    description: "Begin review on an OPEN deviation"
    roles: [LegalCounsel, BusinessOwner, FinanceController, ChiefCounsel]
    code: 200
    input: []
    output: Deviation
    side_effects: ["status: OPEN -> IN_REVIEW", "increments Negotiation.version by 1"]

  - method: POST
    path: "/negotiations/{negotiationId}/deviations/{deviationId}/decide"
    description: "Cast an approval decision (APPROVE/REJECT/ESCALATE)"
    roles: [LegalCounsel, BusinessOwner, FinanceController, ChiefCounsel]
    code: 200
    input: [decision, "decision_rationale?", expected_negotiation_version]
    output: Deviation
    side_effects:
      - "Create ApprovalDecision with snapshot_clause_version"
      - "Status transition per decision"
      - "Escalation re-resolves assigned_approver_id"
      - "Negotiation.open_deviation_count and blocking_deviation_count decrement on terminal decision"
      - "Negotiation.approval_status recomputed"
      - "increments Negotiation.version by 1"

  - method: GET
    path: "/negotiations/{negotiationId}/deviations/{deviationId}/decisions"
    description: "List ApprovalDecisions for a Deviation (FK reverse-reachability: deviation_id via path; decided_by_user_id? filter)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["decided_by_user_id?", "limit?", "offset?"]
    output: "ApprovalDecision[]"
    side_effects: []

  - method: POST
    path: "/negotiations/{negotiationId}/deviations/{deviationId}/withdraw"
    description: "Drafter withdraws a deviation"
    roles: [ContractAnalyst]
    code: 200
    input: []
    output: Deviation
    side_effects: ["status -> WITHDRAWN", "counts decrement", "approval_status recomputed", "increments Negotiation.version by 1"]

  # --- SignaturePacket ---
  - method: POST
    path: "/negotiations/{negotiationId}/signature-packets"
    description: "Create a SignaturePacket"
    roles: [LegalCounsel]
    code: 201
    input: [signatories, signature_window_opens_at, signature_window_closes_at, expected_negotiation_version]
    output: SignaturePacket
    side_effects:
      - "Negotiation.signature_status: NOT_STARTED -> ROUTING"
      - "increments Negotiation.version by 1"

  - method: GET
    path: "/negotiations/{negotiationId}/signature-packets"
    description: "List SignaturePackets (FK reverse-reachability)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SignaturePacket[]"
    side_effects: []

  - method: GET
    path: "/negotiations/{negotiationId}/signature-packets/{packetId}"
    description: "Get a SignaturePacket"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
    input: []
    output: SignaturePacket
    side_effects: []

  - method: POST
    path: "/negotiations/{negotiationId}/signature-packets/{packetId}/sign"
    description: "Signatory signs the packet"
    roles: [Signatory]
    code: 200
    input: []
    output: SignaturePacket
    side_effects:
      - "Append to signed_record"
      - "Status transition (ROUTING->PARTIALLY_SIGNED->FULLY_SIGNED)"
      - "increments Negotiation.version by 1"

  - method: POST
    path: "/negotiations/{negotiationId}/signature-packets/{packetId}/record-execution"
    description: "Record execution after all signatories signed"
    roles: [Signatory]
    code: 200
    input: [execution_timestamp]
    output: Negotiation
    side_effects:
      - "SignaturePacket.status -> EXECUTION_RECORDED"
      - "Negotiation.draft_status -> EXECUTED"
      - "Negotiation.signature_status -> EXECUTION_RECORDED"
      - "cycle_time_seconds computed"
      - "Counterparty.last_executed_at set; active_negotiation_count decrements"
      - "Playbook.active_negotiation_count decrements"
      - "Obligation extraction runs (one Obligation per APPROVED Deviation + one per non-deviated ClauseTemplate used in the contract)"
      - "increments Negotiation.version by 1"

  - method: POST
    path: "/negotiations/{negotiationId}/signature-packets/{packetId}/void"
    description: "Void an unsigned packet"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: SignaturePacket
    side_effects: ["status -> VOIDED", "Negotiation.signature_status -> NOT_STARTED", "increments Negotiation.version by 1"]

  # --- Obligation ---
  - method: GET
    path: "/negotiations/{negotiationId}/obligations"
    description: "List Obligations extracted from a Negotiation (FK reverse-reachability: negotiation_id via path; clause_template_id? filter)"
    roles: [ContractAnalyst, BusinessOwner, LegalCounsel, FinanceController, ChiefCounsel, Signatory, OpsAdmin]
    code: 200
