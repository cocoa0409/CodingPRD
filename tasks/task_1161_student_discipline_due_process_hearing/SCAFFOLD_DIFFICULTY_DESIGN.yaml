            - { call: "POST /hearings/${h_id}/convene", payload: {}, as: HearingOfficer, as_user_id: "ho_1" }
            - { call: "POST /hearings/${h_id}/decision", payload: { outcome: "EXPULSION_ORDERED" }, as: HearingOfficer, as_user_id: "ho_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /placements"
              payload: { case_id: "${case_id}", site_id: "${site_id}", start_date: "2026-05-11T00:00:00Z", planned_end_date: "2026-05-29T00:00:00Z" }
