            - "The second call is HTTP 201 with data.hours_credited == 1.00, term_index_of_record == 1 and logged_by_user_id == ${t71a_id}"
            - "TutorAssignment.${a71_id}.logged_hours == 1.00 - exactly one session was recorded"

      - name: advisor_and_officer_share_certification_submit
        claim_type: shared_operations
        grounds:
          - rbac.AcademicAdvisor.shared_operations
          - rbac.CertificationOfficer.shared_operations
          - state_machines.EligibilityCertification.transitions.DRAFT_to_SUBMITTED
        distinguishing_aspect: "SUBMIT is the one certification action shared by AcademicAdvisor and CertificationOfficer, so two sibling DRAFT rows reach SUBMITTED through different roles and record different submitting identities."
        test_recipe:
          setup:
            - "Students S72A and S72B each have a DRAFT INITIAL certification for 2026FA requested by co_requester."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
