  - section: validations
    instances:
      - name: priority_1_authentication_outranks_role_existence_and_structure
        claim_type: priority_ordering
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error
        distinguishing_aspect: |
          A request that violates FOUR rules at once — no identity headers, a role that could not
          perform the operation anyway, a non-existent FK and a missing required field — must return
          the priority-1 error ERR_UNAUTHENTICATED and nothing else. The error envelope leaks no
          detail about the missing field or the unknown id.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - name: unauthenticated_request_rejected
              call: "POST /royalties/pools"
              payload: { period_id: "11111111-1111-4111-8111-111111111120", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: NONE
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "The call carries no X-Role-Name and no X-User-ID header."
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED — NOT ERR_FORBIDDEN_ROLE (priority 2), NOT ERR_PERIOD_NOT_FOUND (priority 3), NOT ERR_INVALID_REQUEST (priority 4, subscriber_count and gross_revenue_cents are both missing)."
            - "The error envelope has response_type \"error\", a non-empty message and a meta.api_request_id; no pool row was created."

      - name: priority_2_role_outranks_existence_and_structure
        claim_type: priority_ordering
        grounds:
          - validations.priority_2
          - rbac.RoyaltyAdmin.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Period creation is RoyaltyAdmin-exclusive. A RightsHolderUser attempting it with a body
          that ALSO fails structure (usage_end before usage_start, plus a duplicate label) is
          refused at priority 2, so the caller learns nothing about the body or about which labels
          already exist.
        test_recipe:
          setup:
            - "One period 2026-06 already exists, and one holder exists so the caller has a real identity."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
          trigger:
            - name: holder_user_cannot_create_period
              call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-30", usage_end: "2026-06-01" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { err: "$.data.error_id" }
            - call: "GET /royalties/periods/${per}"
              payload: {}
              as: RoyaltyAdmin
              captures: { st: "$.data.status" }
          assert:
            - "HTTP 403 with error_id ERR_FORBIDDEN_ROLE — NOT ERR_DUPLICATE_PERIOD_LABEL (priority 5) and NOT ERR_INVALID_EFFECTIVE_PERIOD (priority 19)."
            - "The pre-existing 2026-06 period is untouched and still OPEN; no second period row exists."

      - name: priority_3_existence_outranks_priority_4_structure
        claim_type: priority_ordering
        grounds:
          - validations.priority_3
          - validations.priority_4
          - errors.ERR_PERIOD_NOT_FOUND
        distinguishing_aspect: |
          FK resolution runs BEFORE body structure, which is the counter-intuitive order: a pool
          create that names an unknown period AND omits two required numeric fields returns
          ERR_PERIOD_NOT_FOUND (404), not ERR_INVALID_REQUEST (422). Reversing the order would be
          the natural implementation and is wrong.
        test_recipe:
          setup:
            - "Empty database (no period exists at all)."
          setup_api_calls: []
          trigger:
            - name: unknown_period_and_missing_required_fields_returns_not_found
              call: "POST /royalties/pools"
              payload: { period_id: "11111111-1111-4111-8111-111111111121", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: RoyaltyAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - name: existing_period_missing_required_fields_returns_invalid_request
              call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL" }
              as: RoyaltyAdmin
              captures: { err2: "$.data.error_id" }
          assert:
            - "With the unknown period id: HTTP 404 with error_id ERR_PERIOD_NOT_FOUND even though subscriber_count and gross_revenue_cents are both absent."
            - "With the SAME missing fields but a real period id: HTTP 422 with error_id ERR_INVALID_REQUEST — proving the first response was driven by priority 3 and not by a generic body check."

      - name: duplicate_natural_keys_are_composite_not_single_column
        claim_type: violation_to_error
        grounds:
          - validations.priority_5
          - errors.ERR_DUPLICATE_WORK_IDENTIFIER
          - errors.ERR_DUPLICATE_PERIOD_LABEL
          - errors.ERR_DUPLICATE_POOL
        distinguishing_aspect: |
          Work uniqueness is on the PAIR (work_type, identifier), so the same identifier string is
          legal once as a RECORDING and once as a COMPOSITION but not twice within one type. Pool
          uniqueness is on the TRIPLE (period_id, territory_code, subscription_tier), so the same
          territory in a different tier is legal. Period uniqueness is on label alone.
        test_recipe:
          setup:
            - "One RECORDING GBABC2600001, one period 2026-06, one GB/INDIVIDUAL pool on that period."
          setup_api_calls:
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 1000, gross_revenue_cents: 1428570 }
              as: RoyaltyAdmin
              captures: { pl: "$.data.id" }
          trigger:
            - name: same_identifier_same_type_rejected
              call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger (Remaster)", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { err1: "$.data.error_id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "Vale / Okonkwo" }
              as: RightsOpsAnalyst
              captures: { w2: "$.data.id" }
            - name: same_period_label_rejected
              call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-07-01", usage_end: "2026-07-31" }
              as: RoyaltyAdmin
              captures: { err2: "$.data.error_id" }
            - name: same_period_territory_tier_rejected
              call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 5, gross_revenue_cents: 10 }
              as: RoyaltyAdmin
              captures: { err3: "$.data.error_id" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "FAMILY", subscriber_count: 400, gross_revenue_cents: 900000 }
              as: RoyaltyAdmin
              captures: { pl2: "$.data.id" }
          assert:
            - "Second RECORDING with identifier GBABC2600001: HTTP 409 with error_id ERR_DUPLICATE_WORK_IDENTIFIER."
            - "COMPOSITION with the SAME identifier string: HTTP 201 — the key is the pair, not the identifier alone."
            - "Second period labelled 2026-06 with a different usage window: HTTP 409 with error_id ERR_DUPLICATE_PERIOD_LABEL."
            - "Second GB/INDIVIDUAL pool on the same period: HTTP 409 with error_id ERR_DUPLICATE_POOL."
            - "GB/FAMILY pool on the same period: HTTP 201 — the key is the triple, so the same territory in another tier is a distinct pool."

      - name: duplicate_statement_for_holder_and_period_rejected_in_draft_and_issued
        claim_type: violation_to_error
        grounds:
          - validations.priority_5
          - errors.ERR_DUPLICATE_STATEMENT
          - entities.RoyaltyStatement
        distinguishing_aspect: |
          The statement key is (rights_holder_id, period_id) restricted to status IN {DRAFT,
          ISSUED}, so the second create is refused BOTH while the incumbent is DRAFT and after it is
          issued — and the priority-5 duplicate check outranks the priority-15 OCC check even though
          the retried request carries a freshly re-read period version.
        test_recipe:
          setup:
