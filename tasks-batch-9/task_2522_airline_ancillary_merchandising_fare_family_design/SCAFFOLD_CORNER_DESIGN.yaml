  - section: validations
    instances:
      - name: disclosure_ack_with_a_wrong_fingerprint_returns_fingerprint_mismatch
        claim_type: violation_to_error
        grounds:
          - validations.priority_27
          - errors[ERR_DISCLOSURE_FINGERPRINT_MISMATCH]
          - state_machines.Booking.disclosure_state.PENDING_ACK_to_ACKNOWLEDGED
        distinguishing_aspect: "The acknowledgement is compared byte-for-byte, so a fingerprint that differs only in its trailing effective-unit digit is refused with ERR_DISCLOSURE_FINGERPRINT_MISMATCH and the booking stays PENDING_ACK."
        test_recipe:
          setup:
            - "HELD booking DISCL1 on ECO_LITE via DIRECT_WEB has disclosure_state PENDING_ACK with disclosed_fee_fingerprint \"ECO_LITE|1|BAG_CHECKED_1:INCLUDED:1:3500\""
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC530", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "DISCL1", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/disclosure"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { fp: $.data.disclosed_fee_fingerprint }
          trigger:
            - call: "POST /bookings/${bk_id}/disclosure-ack"
              payload: { acknowledged_fee_fingerprint: "ECO_LITE|1|BAG_CHECKED_1:INCLUDED:1:3501" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_DISCLOSURE_FINGERPRINT_MISMATCH\""
            - "GET /bookings/${bk_id} still shows disclosure_state == \"PENDING_ACK\" and disclosure_acked_at == null"
            - "Booking.disclosed_fee_fingerprint is unchanged and equals ${fp}"
            - "a second acknowledgement with the correct ${fp} then succeeds and moves disclosure_state to ACKNOWLEDGED"

      - name: seat_assignment_inside_the_segment_rectangle_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_41
          - validations.priority_42
          - validations.priority_47
          - entities.SeatAssignment.fields.price_charged_cents
          - entities.SeatInventorySegment.fields.held_seats
        distinguishing_aspect: "Row 17 letter B is strictly interior to the rows 16..18 x [A, B, C] rectangle, so all three seat checks pass: the assignment is created HELD at the segment's 2000-cent price and the segment moves to held_seats 1 / available_seats 8."
        test_recipe:
          setup:
            - "flight AC531 has booked_load_factor_pct 0 (demand_tier LOW) and one OPEN MID segment for SEAT_STANDARD, rows 16..18, letters [A, B, C], base_price_cents 2000, so total_seats 9 and effective_price_cents 2000"
