      - name: validation_disclosure_deadline_blocks_late_certification
        claim_type: violation_to_error
        grounds:
          - validations[priority=60]
          - validations[priority=58]
          - errors[ERR_DISCLOSURE_DEADLINE_PASSED]
          - calculations.affordability_metrics
          - state_machines.DisclosureReport.CERTIFIED_to_DRAFT
        distinguishing_aspect: |
          On a term that priced no charge at all the reconciliation-currency gate at 58 is vacuously
          satisfied, which isolates the filing deadline at 60: certification on 2027-01-16 fails and
          on 2027-01-15T23:59:59.999Z succeeds with charge_count 0, savings_pct 0.0000 and
          compliance_status NOT_APPLICABLE rather than NON_COMPLIANT. The amend hop then clears the
          certification stamps and bumps amendment_count.
        test_recipe:
          setup:
            - "Term FA26 OPEN with no sections, no adoptions and no charges (so no PublisherAgreement prices anything in the term); a CA disclosure report in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
            - call: "POST /disclosure-reports"
              payload: { term_id: "${term_id}", reporting_state_code: "CA" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-16T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /disclosure-reports/${rep_id}/certify"
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T23:59:59.999Z" }
              as: ComplianceOfficer
            - call: "POST /disclosure-reports/${rep_id}/certify"
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /disclosure-reports/${rep_id}/amend"
              payload: { amendment_note: "Adding the late-reported ECON section figures." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /disclosure-reports/${rep_id}/certify"
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Trigger call 2 -> HTTP 409 ERR_DISCLOSURE_DEADLINE_PASSED (2027-01-16 > disclosure_deadline_date 2027-01-15); NOT ERR_RECONCILIATION_NOT_CURRENT, because no agreement prices any charge of this term"
            - "DisclosureReport.${rep_id}.status is still DRAFT with certified_at == null after trigger call 2"
            - "Trigger call 4 -> HTTP 200 on the deadline day itself: status == CERTIFIED, certified_at == 2027-01-15T23:59:59.999Z, certified_by_user_id == co-1"
            - "Recomputed metrics stay zero: ia_section_count == 0, charge_count == 0, enrolled_student_count == 0, opted_out_student_count == 0, total_list_price_cents == 0, total_net_billed_cents == 0, average_net_cost_cents == 0, savings_pct == 0.0000, compliance_status == NOT_APPLICABLE"
            - "Trigger call 5 -> HTTP 200: status == DRAFT, amendment_count == 1, amendment_note stored, certified_at == null, certified_by_user_id == null, published_at == null"
            - "Trigger call 6 -> HTTP 200: status == CERTIFIED again with amendment_count still 1 and certified_at == 2027-01-15T23:59:59.999Z"
            - "GET /terms/${term_id}/disclosure-reports with status=CERTIFIED returns total_count == 1"

      - name: validation_priority_billing_lock_outranks_opt_out_window
        claim_type: priority_ordering
        grounds:
          - validations[priority=48]
          - validations[priority=77]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_pair_term_billing_locked_beats_opt_out_window_closed
          rationale: "Both rules are violated by the same request there and ERR_TERM_BILLING_LOCKED is asserted as the reported error."

      - name: validation_priority_agreement_active_outranks_pricing_tier
        claim_type: priority_ordering
        grounds:
          - validations[priority=65]
          - validations[priority=100]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_pair_agreement_not_active_beats_no_pricing_tier
          rationale: "That instance violates both gates on one posting call and asserts ERR_AGREEMENT_NOT_ACTIVE, then fixes each gate in turn."

      - name: validation_priority_segregation_outranks_concurrent_title_limit
        claim_type: priority_ordering
        grounds:
          - validations[priority=55]
          - validations[priority=87]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_pair_segregation_of_duties_beats_concurrent_title_limit
          rationale: "An approval that both breaks segregation of duties and overflows the concurrent-title capacity is asserted to return ERR_SEGREGATION_OF_DUTIES there."

      - name: validation_reconciliation_currency_required_for_certification
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=58]
          - errors[ERR_RECONCILIATION_NOT_CURRENT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_certify_requires_non_stale_agreement_reconciliation
          rationale: "Certification is exercised there against NOT_STARTED, STALE and COMPUTED reconciliation states of the pricing agreement."

      - name: validation_dropped_enrollment_freezes_opt_out_actions
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=66]
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_rescind_blocked_by_dropped_enrollment
          rationale: "The rescind of a granted opt-out on a DROPPED enrollment is asserted to return ERR_ENROLLMENT_NOT_ACTIVE there."

      - name: validation_opt_out_cycle_limit_on_resubmit
        claim_type: aggregate_validation
        grounds:
          - validations[priority=91]
          - errors[ERR_OPT_OUT_CYCLE_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nonlinear_opt_out_cycle_terminates_at_max_opt_out_cycles
          rationale: "The cycle counter is driven to MAX_OPT_OUT_CYCLES there and the terminating resubmit is asserted to return ERR_OPT_OUT_CYCLE_LIMIT."

      - name: validation_pricing_tier_band_overlap
        claim_type: temporal_validation
        grounds:
          - validations[priority=85]
          - errors[ERR_TIER_BAND_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / temporal_overlap_pricing_tier_bands_adjacent_versus_overlapping
          rationale: "Adjacent bands (accepted) and one-unit-overlapping bands (ERR_TIER_BAND_OVERLAP), including the open-ended band, are all exercised there."

      - name: validation_concurrent_title_capacity_over_access_windows
        claim_type: temporal_validation
        grounds:
          - validations[priority=87]
          - errors[ERR_CONCURRENT_TITLE_LIMIT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / temporal_overlap_half_open_access_windows_versus_concurrent_title_capacity
          rationale: "Touching windows (accepted) versus one-day-overlapping windows (ERR_CONCURRENT_TITLE_LIMIT) against max_concurrent_titles are asserted there."

