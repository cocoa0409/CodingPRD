              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Dot D", email: "d11@x.com" }
              as: Anonymous
              captures: { ap: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: "$.data.id" }
            - call: "POST /preference-claims"
              payload: { application_id: "${app}", category: "LOCAL_RESIDENT", evidence_ref: "lease" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /preference-claims/${cl}/transition"
              payload: { action: "VERIFY" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: "$.data.error_id" }
            - call: "POST /preference-claims/${cl}/transition"
              payload: { action: "VERIFY" }
              as: ApplicationClerk
              captures: { st: "$.data.status" }
          assert:
            - "VERIFY by the owning Applicant -> ERR_UNAUTHORIZED_ROLE (403)"
            - "VERIFY by ApplicationClerk succeeds (${st} == VERIFIED)"

      - name: cross_applicant_withdraw_forbidden
        claim_type: ownership_denied
        grounds:
          - roles.Applicant
          - errors[ERR_UNAUTHORIZED_ROLE]
          - state_machines.Application
        distinguishing_aspect: "Applicant B's X-User-ID does not match application A's applicant_id: the withdraw is rejected with ERR_UNAUTHORIZED_ROLE even though Applicant is the correct role."
        test_recipe:
          setup: ["OPEN campaign; application owned by applicant A; applicant B also registered"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Eve A", email: "ea@x.com" }
              as: Anonymous
              captures: { apA: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${apA}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${apA}"
              captures: { app: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Mallory B", email: "mb@x.com" }
              as: Anonymous
              captures: { apB: "$.data.id" }
          trigger:
            - call: "POST /applications/${app}/withdraw"
              as: Applicant
              as_user_id: "${apB}"
              captures: { err: "$.data.error_id" }
            - call: "GET /applications/${app}"
              as: ApplicationClerk
              captures: { st: "$.data.status" }
          assert:
            - "withdraw by applicant ${apB} fails with ERR_UNAUTHORIZED_ROLE (403) — ownership check beyond mere role membership"
            - "application ${app} remains SUBMITTED (${st})"

      - name: report_role_split_submit_acknowledge
        claim_type: action_role_mapping_denied
        grounds:
          - roles.ComplianceOfficer
          - roles.FundingAgencyAuditor
          - errors[ERR_UNAUTHORIZED_ROLE]
          - state_machines.ComplianceReport
        distinguishing_aspect: "On the shared report transition endpoint: SUBMIT is ComplianceOfficer-only (auditor rejected) and ACKNOWLEDGE is FundingAgencyAuditor-only (officer rejected) — a two-sided segregation check ending in ACKNOWLEDGED."
        test_recipe:
          setup: ["campaign with PUBLISHED lottery; one DRAFT Q2 report"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
