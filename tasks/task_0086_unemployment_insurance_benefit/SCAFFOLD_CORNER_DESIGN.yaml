  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_apply_extension_stale_claim_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[extension-apply-stale-claim]
          - errors[ERR_STALE_CLAIM_VERSION]
        distinguishing_aspect: "apply-extension with expected_claim_version one less than current (stale) returns ERR_STALE_CLAIM_VERSION (412); the paid week bumped the claim version between read and call."
        test_recipe:
          setup: ["Claim X driven to EXHAUSTED; an active program covering filed_date; the claim's version captured at create then made stale by the intervening pay/balance mutations."]
          setup_api_calls:
            - call: "POST /ui/extension-programs"
              payload: { program_code: "PEUC-OCC", extra_weeks: 13, trigger_start_date: "2026-01-01", trigger_end_date: "2026-12-31", is_active: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "Oc Co", state_account_number: "OC-1", experience_rate: 0.03, reserve_opening_balance_cents: 100000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Oc Test", ssn_last4: "3526", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q4", gross_wages_cents: 130000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${clmt_id}"
            - call: "POST /ui/determinations"
              payload: { claim_id: "${claim_id}", determination_type: "MONETARY" }
              as: Adjudicator
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: Adjudicator
              captures: { claim_v_stale: $.data.version }
            - call: "POST /_ledger/set_claim_balance"
              payload: { claim_id: "${claim_id}", remaining_balance_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /ui/weekly-certifications"
              payload: { claim_id: "${claim_id}", week_ending_date: "2026-04-11", reported_earnings_cents: 0, work_search_waived: true }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { wc_id: $.data.id }
            - call: "POST /ui/weekly-certifications/${wc_id}/adjudicate"
              payload: { decision: "ELIGIBLE" }
              as: Adjudicator
            - call: "POST /ui/weekly-certifications/${wc_id}/pay"
              payload: {}
              as: BenefitPaymentOfficer
          trigger:
            - call: "POST /ui/claims/${claim_id}/apply-extension"
              payload: { program_id: "${prog_id}", expected_claim_version: "${claim_v_stale}" }
              as: Adjudicator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response error_id == ERR_STALE_CLAIM_VERSION"

      - name: occ_recovery_stale_overpayment_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[overpayment-recovery-stale]
          - errors[ERR_STALE_OVERPAYMENT_VERSION]
        distinguishing_aspect: "A second recovery carrying expected_overpayment_version equal to the pre-first-recovery version (stale) returns ERR_STALE_OVERPAYMENT_VERSION (412)."
        test_recipe:
          setup: ["A NONFRAUD Overpayment (total 40000); version captured at create; one recovery of 10000 applied (version advances)."]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "Or Co", state_account_number: "OR-1", experience_rate: 0.03, reserve_opening_balance_cents: 1000000 }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/claimants"
              payload: { full_name: "Or Test", ssn_last4: "3627", date_of_birth: "1990-01-01" }
              as: ProgramAdmin
              captures: { clmt_id: $.data.id }
            - call: "POST /ui/wage-records"
              payload: { claimant_id: "${clmt_id}", employer_id: "${emp_id}", calendar_quarter: "2025-Q1", gross_wages_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /ui/claims"
              payload: { claimant_id: "${clmt_id}", filed_date: "2026-04-05" }
              as: Claimant
              as_user_id: "${clmt_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /ui/overpayments"
              payload: { claim_id: "${claim_id}", cause: "NONFRAUD", principal_cents: 40000 }
              as: Adjudicator
              captures: { op_id: $.data.id, op_v0: $.data.version }
            - call: "POST /ui/overpayments/${op_id}/recoveries"
              payload: { recovery_method: "CASH", amount_cents: 10000, expected_overpayment_version: "${op_v0}" }
              as: BenefitPaymentOfficer
          trigger:
            - call: "POST /ui/overpayments/${op_id}/recoveries"
              payload: { recovery_method: "CASH", amount_cents: 5000, expected_overpayment_version: "${op_v0}" }
              as: BenefitPaymentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response error_id == ERR_STALE_OVERPAYMENT_VERSION"

      - name: derived_reserve_reconciled_after_pay_stub
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Employer.fields.reserve_account_balance_cents
        excluded_because:
          difficulty_instance: "transitive_cascade / pay_week_cascades_balance_then_employer_reserve"
          rationale: "reserve_account_balance_cents reconciliation after a paid-week charge is asserted by the named §1.8 cascade instance."

      - name: cascade_offset_partial_then_balance_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WeeklyCertification.PAID_to_OFFSET
        excluded_because:
          difficulty_instance: "non_linear_state_machine / weekly_certification_parallel_axes_independent"
          rationale: "The OFFSET cascade from an applied recovery is asserted by the named §1.8 parallel-axes instance."

  # =========================================================================
