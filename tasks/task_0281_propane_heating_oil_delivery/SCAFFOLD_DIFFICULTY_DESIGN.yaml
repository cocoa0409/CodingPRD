              payload: { route_date: "2026-02-10T00:00:00Z", window_start: "2026-02-10T09:00:00Z", window_end: "2026-02-10T12:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /accounts/${acct_id}/delivery-orders"
