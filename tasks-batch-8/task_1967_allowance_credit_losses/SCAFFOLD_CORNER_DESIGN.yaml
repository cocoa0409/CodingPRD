              captures: { err: $.data.error_id }
            - call: "POST /cecl/loans/${loan_id}/charge_off"
              payload: { charge_off_amount_cents: 100000, charge_off_period: "2026-Q1" }
              as: CreditAnalyst
              captures: { st: $.data.status }
          assert:
            - "100001 -> error_id == ERR_CHARGE_OFF_EXCEEDS_BALANCE (${err})"
            - "Exactly 100000 succeeds: status == CHARGED_OFF (${st}), amortized_cost_cents == 0"

      - name: adjustment_cap_exceeded_rejected
        claim_type: violation_to_error
        grounds: [calculations.management_adjustment_cap, "errors[ERR_ADJUSTMENT_EXCEEDS_CAP]"]
        distinguishing_aspect: "|amount| above the 10% cap is rejected (422): subtotal 55000 -> cap 5500; 5501 fails. (Equality with the cap is covered by the difficulty instance management_adjustment_net_zero_conserves_total.)"
