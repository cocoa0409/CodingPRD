              as: RightOfWayAgent
          assert:
            - "EasementCase.${case_id}.compensation_committed_cents == 0"
            - "EasementCase.${case_id}.compensation_balance_cents == 50000000"
            - "compensation_committed_cents + compensation_balance_cents == acquisition_budget_cents"

      - name: open_encroachment_count_invariant_across_report_and_remove
        grounds:
          - entities.EasementCase.fields.open_encroachment_count
          - state_machines.Encroachment.REMOVAL_AGREED_to_REMOVED
          - state_machines.EasementCase.RESOLUTION_PENDING_to_ACTIVE_MONITORING
        distinguishing_aspect: |
          Conserved quantity: open_encroachment_count tracks encroachments not
          in terminal states. Forward action (report encroachment) + compensating
          action (confirm-removal) leaves the count unchanged. This is a count
          invariant, different from the fiscal balance invariant above.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, RECORDED doc, open_encroachment_count=0"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-018", utility_district: "D1", county: "King", parcel_id: "P-018", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-1701", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
          trigger:
            - call: "POST /easement-cases/${case_id}/encroachments"
              payload: { discovered_via: "FIELD_INSPECTION", encroachment_type: "FENCE", encroachment_area_sqft: 100, depth_into_easement_ft: 1, encroaches_document_id: "${doc_id}", estimated_removal_cost_cents: 100 }
              as: RightOfWayAgent
              captures: { enc_id: $.data.id }
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v: $.data.version }
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/notify"
              payload: { expected_case_version: "${case_v}" }
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/begin-negotiation"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/agree-removal"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/encroachments/${enc_id}/confirm-removal"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "After report: open_encroachment_count == 1, case.status == RESOLUTION_PENDING"
            - "After confirm-removal: open_encroachment_count == 0"
            - "After confirm-removal: case.status == ACTIVE_MONITORING"
