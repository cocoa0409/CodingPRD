              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Wanda Ekstrom", date_of_birth: "1948-02-02", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
              captures: { wl_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 3.00, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { nu_v: "$.data.version" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${nu_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${nu_v}", admission_date: "2026-08-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { res_id: "$.data.id" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "POST /svh/residents/${res_id}/trust-fund-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 50000, effective_date: "2026-08-05", memo: "family deposit" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { t1_id: "$.data.id", t1_balance: "$.data.balance_after_cents", t1_signed: "$.data.signed_amount_cents" }
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/residents/${res_id}/trust-fund-transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 12000, effective_date: "2026-08-06", memo: "hearing aid batteries" }
              as: BusinessOfficeManager
              as_user_id: "bom-1"
              captures: { t2_id: "$.data.id", t2_balance: "$.data.balance_after_cents", t2_signed: "$.data.signed_amount_cents" }
            - call: "POST /svh/trust-fund-transactions/${t2_id}/reverse"
              payload: { memo: "posted to wrong resident" }
              as: BusinessOfficeManager
