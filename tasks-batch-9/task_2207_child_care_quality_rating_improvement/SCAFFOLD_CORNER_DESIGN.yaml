        grounds:
          - state_machines.Provider.APPLIED_to_ENROLLED
          - validations[priority=10]
          - errors[ERR_PROVIDER_STATE_INVALID]
        distinguishing_aspect: "The enrollment decision is not idempotent: the second APPROVE returns ERR_PROVIDER_STATE_INVALID (409) because provider.status is already ENROLLED, and Provider.version is not bumped a second time (stays 2)."
        test_recipe:
          setup:
