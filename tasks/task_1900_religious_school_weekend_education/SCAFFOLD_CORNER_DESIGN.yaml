  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: invoice_per_line_rounding_then_sum
        claim_type: precision
        grounds: [calculations.invoice_gross_total, calculations.enrollment_net_tuition]
        distinguishing_aspect: "Rounding order is pinned as round-per-line-then-sum: with member_tuition 72501, the two lines round to 67063 and 60357 and gross is 127420 — sum-then-round would give 127421, one cent more."
        test_recipe:
          setup: ["OPEN year with member_tuition_cents 72501 (chosen to produce fractional cents); MEMBER family with 2 enrolled students (ranks 0 and 1, early bird)"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72501, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P" }, as: SchoolAdmin, captures: { sp: $.data.id } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam 2K", primary_email: "2k@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id, fam_v: $.data.version } }
