            - call: "POST /recertification-cycles/${cycle_id}/ceu-activities"
              payload: {"activity_date": "2026-05-11T00:00:00Z", "category": "LIVE_INSTRUCTION", "provider": "Spring Institute", "contact_hours": 6.0}
