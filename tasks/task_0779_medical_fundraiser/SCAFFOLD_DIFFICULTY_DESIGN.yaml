# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — Task 0779
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: campaign_available_provisional_vs_settled
        grounds:
          - calculations.campaign_available
          - entities.Campaign.fields.provisional_available_cents
          - entities.Campaign.fields.settled_available_cents
        distinguishing_aspect: |
          On the Campaign money domain, PROVISIONAL ignores an OPEN dispute while
          SETTLED subtracts the disputed donation's net, so the two variants
          report different available balances for identical stored data.
        test_recipe:
          setup:
            - "Verified beneficiary, published campaign, two CAPTURED donations of net 10000 each (raised 20000, reserve_total 1000), one OPEN dispute locking donation D1."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /disputes"
              payload: { donation_id: "${d1_id}", reason: "FRAUD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { dsp_id: $.data.id }
          trigger:
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { prov: $.data.provisional_available_cents, settled: $.data.settled_available_cents }
          assert:
            - "Campaign.${camp_id}.provisional_available_cents == 19000"
            - "Campaign.${camp_id}.settled_available_cents == 9000"

      - name: organizer_risk_strict_vs_lenient
        grounds:
          - calculations.entity_risk_score
          - entities.Organizer.fields.strict_risk_score
          - entities.Organizer.fields.lenient_risk_score
        distinguishing_aspect: |
          On the Organizer (person) domain, STRICT counts every dispute
          (total=2) while LENIENT counts only UPHELD disputes (1), so the two
          variants yield 33 vs 18 for identical aggregates.
        test_recipe:
          setup:
            - "Organizer with raised 100000, one UPHELD dispute (refunded 5000) and one REJECTED dispute; beneficiary VERIFIED so has_unverified_beneficiary=false."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 1000000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { da_id: $.data.id }
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 5000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { db_id: $.data.id }
            - call: "POST /disputes"
              payload: { donation_id: "${db_id}", reason: "FRAUD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { dsp_db: $.data.id }
            - call: "POST /disputes/${dsp_db}/assign"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /disputes/${dsp_db}/uphold"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /disputes"
              payload: { donation_id: "${da_id}", reason: "OTHER" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { dsp_da: $.data.id }
            - call: "POST /disputes/${dsp_da}/assign"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /disputes/${dsp_da}/reject"
              payload: {}
              as: TrustSafetyAgent
          trigger:
            - call: "GET /organizers/${org_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { strict: $.data.strict_risk_score, lenient: $.data.lenient_risk_score }
          assert:
            - "Organizer.${org_id}.strict_risk_score == 33"
            - "Organizer.${org_id}.lenient_risk_score == 18"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: donation_fee_on_total_gross_up
        grounds:
          - calculations.donation_charge_breakdown
          - entities.Donation.fields.total_charged_cents
          - entities.Donation.fields.processing_fee_cents
        distinguishing_aspect: |
          Mode (c) circular dependency: processing_fee is a percentage of the
          total the donor pays, yet the total includes the fee; the pinned order
          computes total_charged via closed-form gross-up first, then the fee as
          the residual — amount 10000 + tip 1500 -> total 11875, fee 375.
        test_recipe:
          setup:
            - "Published campaign; a single donation of amount 10000 with tip 1500."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000, tip_cents: 1500 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id }
          assert:
            - "Donation.${don_id}.total_charged_cents == 11875"
            - "Donation.${don_id}.processing_fee_cents == 375"
            - "Donation.${don_id}.net_to_campaign_cents == 10000"

      - name: campaign_reserve_round_per_donation
        grounds:
          - calculations.campaign_available
          - entities.Campaign.fields.reserve_total_cents
          - entities.Donation.fields.reserve_cents
        distinguishing_aspect: |
          Mode (b) rounding order: two donations of net 333 each give reserve
          round_half_up(16.65)=17 per donation summing to 34, whereas
          round_half_up(sum 666 * 0.05)=33; the scaffold pins per-donation-then-sum
          so reserve_total_cents == 34.
        test_recipe:
          setup:
            - "Published campaign; two CAPTURED donations of amount 333 each (net 333, reserve 17 each)."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 333 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 333 }
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { reserve: $.data.reserve_total_cents, prov: $.data.provisional_available_cents }
          assert:
            - "Campaign.${camp_id}.reserve_total_cents == 34"
            - "Campaign.${camp_id}.provisional_available_cents == 632"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_review_cycle
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Dispute.NEEDS_INFO_to_UNDER_REVIEW
        distinguishing_aspect: |
          The Dispute entity loops UNDER_REVIEW <-> NEEDS_INFO: after
          provide-info returns it to UNDER_REVIEW a second request-info moves it
          back to NEEDS_INFO, proving the cycle repeats (non-linear on Dispute).
        test_recipe:
          setup:
            - "A CAPTURED donation with a dispute walked to UNDER_REVIEW, request-info -> NEEDS_INFO, provide-info -> UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id }
            - call: "POST /disputes"
              payload: { donation_id: "${don_id}", reason: "NOT_AS_DESCRIBED" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /disputes/${dsp_id}/assign"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /disputes/${dsp_id}/request-info"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /disputes/${dsp_id}/provide-info"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /disputes/${dsp_id}/request-info"
              payload: {}
              as: TrustSafetyAgent
              captures: { st: $.data.status }
          assert:
            - "Dispute.${dsp_id}.status == NEEDS_INFO"

      - name: campaign_parallel_lifecycle_and_posture
        grounds:
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - state_machines.Campaign.OPEN_to_HOLD
          - entities.Campaign.fields.lifecycle_status
          - entities.Campaign.fields.payout_posture
        distinguishing_aspect: |
          Campaign carries two independent axes: placing a Hold moves
          payout_posture OPEN->HOLD without touching lifecycle_status, and a
          later pause moves lifecycle ACTIVE->PAUSED while payout_posture stays
          HOLD.
        test_recipe:
          setup:
            - "Published (ACTIVE) campaign with an ACTIVE Hold, so payout_posture is HOLD and lifecycle_status ACTIVE."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /holds"
              payload: { campaign_id: "${camp_id}", reason: "review", severity: "STANDARD" }
              as: TrustSafetyAgent
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/pause"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { life: $.data.lifecycle_status, posture: $.data.payout_posture }
          assert:
            - "Campaign.${camp_id}.lifecycle_status == PAUSED"
            - "Campaign.${camp_id}.payout_posture == HOLD"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_uphold_refund_freezes_payout
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - state_machines.Donation.CAPTURED_to_REFUNDED
          - state_machines.Payout.REQUESTED_to_ON_HOLD
          - calculations.campaign_available
        distinguishing_aspect: |
          Depth-4 cascade from a single uphold: Dispute UPHELD -> creates Refund
          -> Donation REFUNDED -> Campaign.raised/available recomputed
          (provisional < 0) -> the over-committed Payout moves REQUESTED->ON_HOLD.
        test_recipe:
          setup:
            - "Verified campaign with two net-10000 donations (available 19000), one REQUESTED payout of 19000 consuming all provisional availability; then a dispute on D1 walked to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 19000, expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /disputes"
              payload: { donation_id: "${d1_id}", reason: "FRAUD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /disputes/${dsp_id}/assign"
              payload: {}
              as: TrustSafetyAgent
          trigger:
            - call: "POST /disputes/${dsp_id}/uphold"
              payload: {}
              as: TrustSafetyAgent
          assert:
            - "Donation.${d1_id}.status == REFUNDED"
            - "Campaign.${camp_id}.raised_cents == 10000"
            - "Payout.${payout_id}.status == ON_HOLD"

      - name: beneficiary_reject_freezes_campaign_cancels_payout
        grounds:
          - state_machines.Beneficiary.VERIFIED_to_REJECTED
          - state_machines.Campaign.OPEN_to_FROZEN
          - state_machines.Payout.REQUESTED_to_ON_HOLD
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (KYC revocation): Beneficiary
          VERIFIED->REJECTED -> Campaign payout_posture->FROZEN -> the campaign's
          REQUESTED Payout is CANCELLED.
        test_recipe:
          setup:
            - "Verified campaign with a net-10000 donation and one REQUESTED payout of 5000."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 5000, expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /beneficiaries/${ben_id}/reject-verification"
              payload: { reason: "FRAUD" }
              as: TrustSafetyAgent
          assert:
            - "Beneficiary.${ben_id}.verification_status == REJECTED"
            - "Campaign.${camp_id}.payout_posture == FROZEN"
            - "Payout.${payout_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_donation
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_CAMPAIGN_NOT_ACTIVE]
          - errors[ERR_AMOUNT_BELOW_MIN]
        distinguishing_aspect: |
          A donation of amount 50 (below MIN 100) to a DRAFT campaign violates
          both state (priority 6, ERR_CAMPAIGN_NOT_ACTIVE) and business_fiscal
          (priority 10, ERR_AMOUNT_BELOW_MIN); the state error wins.
        test_recipe:
          setup:
            - "A DRAFT (never published) campaign."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 50 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CAMPAIGN_NOT_ACTIVE"
            - "http_status == 409"

      - name: safety_beats_referential_on_payout
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_PAYOUT_ON_HOLD]
          - errors[ERR_BENEFICIARY_NOT_VERIFIED]
        distinguishing_aspect: |
          A payout on a campaign that is both on HOLD (ACTIVE hold) and whose
          beneficiary is UNVERIFIED violates business_safety (priority 7,
          ERR_PAYOUT_ON_HOLD) and business_referential (priority 8,
          ERR_BENEFICIARY_NOT_VERIFIED); the safety error wins.
        test_recipe:
          setup:
            - "Published campaign, beneficiary UNVERIFIED, an ACTIVE Hold so payout_posture is HOLD."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /holds"
              payload: { campaign_id: "${camp_id}", reason: "review", severity: "STANDARD" }
              as: TrustSafetyAgent
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAYOUT_ON_HOLD"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: donation_min_amount_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_AMOUNT_BELOW_MIN]
          - entities.Donation.fields.amount_cents
        distinguishing_aspect: |
          Numeric threshold on POST /donations: amount 100 (== MIN) succeeds with
          201; amount 99 is rejected ERR_AMOUNT_BELOW_MIN. Boundary is >= 100.
        test_recipe:
          setup:
            - "A published campaign."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 100 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { ok_id: $.data.id }
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 99 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Donation.${ok_id}.amount_cents == 100"
            - "response.data.error_id == ERR_AMOUNT_BELOW_MIN"
            - "http_status == 422"

      - name: payout_zero_available_empty_donation_set
        grounds:
          - validations[priority=11]
          - errors[ERR_INSUFFICIENT_AVAILABLE]
          - calculations.campaign_available
        distinguishing_aspect: |
          Empty-collection edge on POST /payouts: a verified campaign with zero
          CAPTURED donations has settled_available_cents == 0, so a payout of 1
          cent (the smallest positive draw) is rejected ERR_INSUFFICIENT_AVAILABLE.
        test_recipe:
          setup:
            - "Verified campaign, published, with no donations (settled_available_cents == 0)."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1, expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_AVAILABLE"
            - "http_status == 402"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payout_requires_beneficiary_verified
        grounds:
          - state_machines.Payout.REQUESTED_to_PROCESSING
          - validations[priority=8]
          - entities.Beneficiary.fields.verification_status
        distinguishing_aspect: |
          Payout creation depends on the Beneficiary entity: with beneficiary
          UNVERIFIED (posture OPEN, no holds) the payout is rejected
          ERR_BENEFICIARY_NOT_VERIFIED — a Payout<->Beneficiary dependency.
        test_recipe:
          setup:
            - "Published campaign whose beneficiary is UNVERIFIED; posture OPEN."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BENEFICIARY_NOT_VERIFIED"
            - "http_status == 409"

      - name: dispute_requires_donation_captured
        grounds:
          - state_machines.Dispute.OPEN
          - state_machines.Donation.CAPTURED_to_REFUNDED
          - entities.Donation.fields.status
        distinguishing_aspect: |
          Opening a Dispute depends on the Donation entity's state: on a REFUNDED
          donation the open is rejected ERR_INVALID_STATE — a Dispute<->Donation
          dependency, a different entity pair from payout<->beneficiary.
        test_recipe:
          setup:
            - "A donation that has been refunded (status REFUNDED)."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donations/${don_id}/refund"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /disputes"
              payload: { donation_id: "${don_id}", reason: "FRAUD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: feature_slot_halfopen_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_SLOT_CONFLICT]
          - entities.FeaturePlacement.fields.window_start
          - entities.FeaturePlacement.fields.window_end
        distinguishing_aspect: |
          FeaturePlacement uses half-open [start,end) interval geometry on the
          (category, slot_index) resource: booking [04-05,04-10) against an
          existing [04-01,04-08) on HOMEPAGE slot 1 overlaps (05 < 08) and is
          rejected ERR_SLOT_CONFLICT.
        test_recipe:
          setup:
            - "A campaign with a BOOKED HOMEPAGE slot-1 placement over [2026-04-01,2026-04-08)."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /feature-placements"
              payload: { campaign_id: "${camp_id}", category: "HOMEPAGE", slot_index: 1, window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /feature-placements"
              payload: { campaign_id: "${camp_id}", category: "HOMEPAGE", slot_index: 1, window_start: "2026-04-05T00:00:00Z", window_end: "2026-04-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLOT_CONFLICT"
            - "http_status == 409"

      - name: payout_cooldown_min_gap_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_PAYOUT_COOLDOWN]
          - calculations.beneficiary_payout_cooldown
          - entities.Beneficiary.fields.last_payout_settled_at
        distinguishing_aspect: |
          Beneficiary payout cooldown uses a minimum-gap buffer (not half-open):
          after a payout settles at 2026-05-01T00:00:00Z, a second payout
          scheduled 2026-05-01T12:00:00Z (12h < 24h COOLDOWN) is rejected
          ERR_PAYOUT_COOLDOWN.
        test_recipe:
          setup:
            - "Verified campaign with net-100000 donation; one payout of 1000 requested, processed, and settled at clock 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 1000000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, scheduled_at: "2026-05-01T00:00:00Z", expected_campaign_version: "${camp_v1}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /payouts/${p1_id}/process"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payouts/${p1_id}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v2: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, scheduled_at: "2026-05-01T12:00:00Z", expected_campaign_version: "${camp_v2}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAYOUT_COOLDOWN"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: donation_refund_conserves_raised_cents
        grounds:
          - state_machines.Donation.CAPTURED_to_REFUNDED
          - calculations.campaign_available
          - entities.Campaign.fields.raised_cents
        distinguishing_aspect: |
          Conserved quantity = Campaign.raised_cents (money): capturing a
          net-10000 donation then refunding it returns raised_cents to its
          pre-donation baseline of 0 (invariant raised_cents == sum of CAPTURED
          net).
        test_recipe:
          setup:
            - "Published campaign with baseline raised_cents 0; one net-10000 donation captured."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /donations/${don_id}/refund"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { raised: $.data.raised_cents }
          assert:
            - "Donation.${don_id}.status == REFUNDED"
            - "Campaign.${camp_id}.raised_cents == 0"

      - name: placement_cancel_conserves_slot_capacity
        grounds:
          - state_machines.FeaturePlacement.BOOKED_to_CANCELLED
          - validations[priority=12]
          - entities.FeaturePlacement.fields.slot_index
        distinguishing_aspect: |
          Conserved quantity = free capacity of a (category, slot_index) window
          (a booking count, not money): cancelling the BOOKED placement over
          [04-01,04-08) frees the slot so an identical-window placement then
          books successfully (status BOOKED).
        test_recipe:
          setup:
            - "A BOOKED HOMEPAGE slot-1 placement over [2026-04-01,2026-04-08) that would otherwise block an overlapping booking."
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /feature-placements"
              payload: { campaign_id: "${camp_id}", category: "HOMEPAGE", slot_index: 1, window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /feature-placements/${p1_id}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "POST /feature-placements"
              payload: { campaign_id: "${camp_id}", category: "HOMEPAGE", slot_index: 1, window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id, p2_status: $.data.status }
          assert:
            - "FeaturePlacement.${p1_id}.status == CANCELLED"
            - "FeaturePlacement.${p2_id}.status == BOOKED"
