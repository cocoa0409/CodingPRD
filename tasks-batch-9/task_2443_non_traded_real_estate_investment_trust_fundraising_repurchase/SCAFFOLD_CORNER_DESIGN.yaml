              as: BrokerDealerRep
              as_user_id: "${bd_a_id}"
              captures: { owner_error: $.error.error_id }
            - call: "POST /subscriptions"
              payload: { offering_id: "00000000-0000-4000-8000-000000000000", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_b_id}", gross_investment_cents: 300000 }
              as: BrokerDealerRep
              as_user_id: "${bd_a_id}"
              captures: { missing_error: $.error.error_id }
            - call: "POST /subscriptions"
