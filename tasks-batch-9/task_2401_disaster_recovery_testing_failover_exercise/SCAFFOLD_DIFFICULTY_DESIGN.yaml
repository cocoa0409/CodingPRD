scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  #   1a: timing domain   (Exercise x StepExecution clocks)
  #   1b: replication domain (Asset x ReplicationObservation)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rto_variant_wall_clock_vs_net_execution
        grounds:
          - calculations.achieved_rto_minutes
          - state_machines.Exercise.IN_EXECUTION_to_FAILOVER_COMPLETE
          - entities.Exercise.fields.achieved_rto_minutes
          - entities.Exercise.fields.rto_met
          - entities.StepExecution.fields.elapsed_minutes
        distinguishing_aspect: |
          The variant lives in the TIMING domain: two exercises with byte-identical StepExecution
          rows (750 s PASSED, 1230 s PASSED_WITH_ISSUE, 600 s SKIPPED) and byte-identical 80-minute
          wall spans report achieved_rto_minutes 34 (NET_EXECUTION, COMPONENT_FAILOVER) versus 80
          (WALL_CLOCK, FULL_SITE_FAILOVER), and therefore rto_met true versus false against the same
          45-minute objective.
        test_recipe:
          setup:
            - "Five ACTIVE stakeholders exist: coordinator c1, business owner bo1, IT operator op1, risk approver ra3 at LEVEL_3, audit liaison al1."
            - "Sites SITE-P (PRIMARY, usable_capacity_units 0) and SITE-R (RECOVERY, usable_capacity_units 40) exist."
            - "Applications APP-CORE (criticality_weight 10, TIER_1, rto 60, rpo 15, AGREED) and APP-EDGE (criticality_weight 8, TIER_2, rto 45, rpo 60, AGREED) exist."
            - "Assets AST-DB1 (DATA_STORE, ASYNCHRONOUS, restore 20, 150 txn/min) and AST-NET1 (INFRA_COMPONENT, SYNCHRONOUS, restore 12) exist."
            - "RecoveryGroup RG-1 on SITE-R holds both applications and both assets; HARD edges APP-CORE -> AST-DB1 -> AST-NET1 give projected_recovery_minutes 92."
            - "Runbook rb1 (validity_days 180) holds three steps owned by op1 with weights 10, 10 and 20, all VALIDATED at 2026-08-01, so readiness_score is 100.00 and RG-1 posture is READY."
            - "The logical clock stands at 2026-09-10T00:00:00Z (40 days after validation, readiness 88.89) and AST-DB1 carries one replication observation with replication_lag_seconds 240 and unreplicated_txn_count 900."
            - "Exercise exA is a COMPONENT_FAILOVER scoped on RG-1, approved, scheduled, started at 2026-09-10T02:00:00Z with the three step executions recorded."
            - "Exercise exB is a FULL_SITE_FAILOVER scoped on RG-1, approved, scheduled, started at 2026-09-11T00:00:00Z with the same three step executions recorded."
          setup_api_calls:
            - &b01
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &b02
              call: "POST /stakeholders"
              payload: { full_name: "Cora Lin", email: "cora@dr.example", org_roles: ["RESILIENCE_COORDINATOR"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - &b03
              call: "POST /stakeholders"
              payload: { full_name: "Bo Owens", email: "bo@dr.example", org_roles: ["BUSINESS_OWNER"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { bo1_id: $.data.id }
            - &b04
              call: "POST /stakeholders"
              payload: { full_name: "Otto Pratt", email: "otto@dr.example", org_roles: ["IT_OPERATOR"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { op1_id: $.data.id }
            - &b05
              call: "POST /stakeholders"
              payload: { full_name: "Rae Kwon", email: "rae@dr.example", org_roles: ["RISK_APPROVER"], approval_authority_level: "LEVEL_3" }
              as: PlatformAdmin
              captures: { ra3_id: $.data.id }
            - &b06
              call: "POST /stakeholders"
              payload: { full_name: "Ada Lund", email: "ada@dr.example", org_roles: ["AUDIT_LIAISON"], approval_authority_level: "LEVEL_1" }
              as: PlatformAdmin
              captures: { al1_id: $.data.id }
            - &b07
              call: "POST /sites"
              payload: { name: "Primary DC", site_code: "SITE-P", role: "PRIMARY", usable_capacity_units: 0 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - &b08
              call: "POST /sites"
              payload: { name: "Recovery DC", site_code: "SITE-R", role: "RECOVERY", usable_capacity_units: 40 }
              as: PlatformAdmin
              captures: { sr_id: $.data.id }
            - &b09
              call: "POST /applications"
              payload: { name: "Core Ledger", app_code: "APP-CORE", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 10 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { a1_id: $.data.id }
            - &b10
              call: "POST /applications/${a1_id}/tier-proposals"
              payload: { proposed_tier: "TIER_1", proposed_rto_minutes: 60, proposed_rpo_minutes: 15, rationale: "Regulated ledger of record" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &b11
              call: "POST /applications/${a1_id}/tier-decisions"
              payload: { action: "AGREE", decision_note: "Objectives accepted" }
              as: BusinessOwner
              as_user_id: "${bo1_id}"
            - &b12
              call: "POST /applications"
              payload: { name: "Edge Portal", app_code: "APP-EDGE", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 8 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { a2_id: $.data.id }
            - &b13
              call: "POST /applications/${a2_id}/tier-proposals"
              payload: { proposed_tier: "TIER_2", proposed_rto_minutes: 45, proposed_rpo_minutes: 60 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &b14
              call: "POST /applications/${a2_id}/tier-decisions"
              payload: { action: "AGREE" }
              as: BusinessOwner
              as_user_id: "${bo1_id}"
            - &b15
              call: "POST /assets"
              payload: { name: "Ledger DB", asset_code: "AST-DB1", asset_kind: "DATA_STORE", site_id: "${sp_id}", replication_mode: "ASYNCHRONOUS", restore_minutes: 20, expected_txn_rate_per_minute: 150 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { d1_id: $.data.id }
            - &b16
              call: "POST /assets"
              payload: { name: "Core Switch", asset_code: "AST-NET1", asset_kind: "INFRA_COMPONENT", site_id: "${sp_id}", replication_mode: "SYNCHRONOUS", restore_minutes: 12 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { i1_id: $.data.id }
            - &b17
              call: "POST /recovery-groups"
              payload: { name: "Tier1 Group", group_code: "RG-1", recovery_site_id: "${sr_id}", lead_coordinator_id: "${c1_id}", recovery_order: 1 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { g1_id: $.data.id }
            - &b18
              call: "POST /applications/${a1_id}/group-assignments"
