          trigger:
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-06", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_PROJECT_COMPLETED"

  # ===========================================================================
  - section: errors
    instances:
      - name: err_double_booked_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TECHNICIAN_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / technician_window_half_open_overlap
          rationale: "Error asserted as the failure path of the named difficulty instance."

      - name: err_lab_capacity_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LAB_DAY_CAPACITY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lab_day_capacity_aggregate_bucket
          rationale: "Error asserted as the failure path of the named difficulty instance."

      - name: err_certification_insufficient_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERTIFICATION_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispatch_requires_sufficient_certification
          rationale: "Error asserted as the failure path of the named difficulty instance."

      - name: err_posture_not_ready_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_POSTURE_NOT_READY]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / letter_requires_all_scope_items_satisfied
          rationale: "Error asserted as the failure path of the named difficulty instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: technician_cannot_approve_ssi
        claim_type: rbac_denial
        grounds: ["roles[EngineerOfRecord]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Approve is exclusive to EngineerOfRecord: a Technician caller fails ERR_FORBIDDEN even with a correct expected_project_version."
        test_recipe:
          setup: ["project with a SUBMITTED revision; technician t1 exists"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "RBAC1", permit_number: "P-RBAC-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: WELD_VISUAL, description: "frames", required_cert_level: 1, required_count: 1 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1" }
              as: AgencyAdmin
              captures: {t1: $.data.id}
          trigger:
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: Technician
              as_user_id: "${t1}"
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_FORBIDDEN and revision remains SUBMITTED"

      - name: contractor_cannot_create_assignment
        claim_type: rbac_denial
        grounds: ["roles[ProjectManager]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Assignment creation is exclusive to ProjectManager: a Contractor caller fails ERR_FORBIDDEN regardless of payload validity."
        test_recipe:
          setup: ["project with APPROVED SSI and one technician"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "RBAC2", permit_number: "P-RBAC-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
          trigger:
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: Contractor
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_FORBIDDEN"

      - name: lab_analyst_cannot_record_field_test
        claim_type: rbac_denial
        grounds: ["roles[Technician]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Field-test entry is exclusive to the Technician role: a LabAnalyst caller fails ERR_FORBIDDEN."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item), technician t1, one DISPATCHED assignment"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "RBAC3", permit_number: "P-RBAC-3", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
