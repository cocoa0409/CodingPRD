# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules from §0.5, cross-referenced into SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in an `assert:` line was computed by executing the
# corresponding §1.3 formula against its declared `constants:`.
# Logical clock startup default: 2026-08-01T00:00:00.000Z.
# ============================================================================

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: academic_standing_term_snapshot_vs_rolling_cumulative_divergence
        grounds:
          - calculations.academic_standing_evaluation
          - entities.District.fields.academic_standing_basis
          - entities.Student.fields.effective_gpa
          - entities.Student.fields.standing_basis_applied
          - validations[priority=32]
          - errors[ERR_PROBATION_STARTER_RESTRICTED]
        distinguishing_aspect: |
          The dual variant lives on the Student entity domain: two students carrying
          byte-identical term postings (2.400 over 6 credits, then 1.900 over 6 credits)
          resolve to effective_gpa 1.900 / PROBATION under TERM_SNAPSHOT and 2.150 / GOOD
          under ROLLING_CUMULATIVE, so the identical roster operation is rejected with
          ERR_PROBATION_STARTER_RESTRICTED in one district and succeeds in the other.
        test_recipe:
          setup:
            - "District SNAPSHOT (academic_standing_basis TERM_SNAPSHOT, min_gpa 2.000, probation_gpa_floor 1.750) and District ROLLING (ROLLING_CUMULATIVE, same thresholds)"
            - "One school, coach, student and DRAFT team under each district, both on the same title and season"
            - "Each student has exactly two postings: 2.400 over 6 credits, then 1.900 over 6 credits"
            - "Each student holds a STARTER RosterSlot whose enrollment axis is already ENROLLMENT_VERIFIED by officer-a"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Snapshot District", state_code: "CA", academic_standing_basis: "TERM_SNAPSHOT" }
              as: LeagueAdmin
              captures: { d_snap_id: $.data.id }
            - call: "POST /districts"
              payload: { name: "Rolling District", state_code: "OR", academic_standing_basis: "ROLLING_CUMULATIVE" }
              as: LeagueAdmin
              captures: { d_roll_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_snap_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_snap_id}"
              captures: { s_snap_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_roll_id}", name: "West High", nces_code: "W-001" }
              as: DistrictAdmin
              as_user_id: "${d_roll_id}"
              captures: { s_roll_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_snap_id}", full_name: "Coach Snap", email: "snap@example.org" }
              as: AthleticDirector
              as_user_id: "${s_snap_id}"
              captures: { c_snap_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_roll_id}", full_name: "Coach Roll", email: "roll@example.org" }
              as: AthleticDirector
              as_user_id: "${s_roll_id}"
              captures: { c_roll_id: $.data.id }
            - call: "POST /titles"
              payload: { name: "Rocket Arena", publisher: "Nova Interactive", age_rating: "T", min_player_age: 13, server_pool_id: "POOL-A", server_pool_capacity: 1, match_duration_minutes: 60 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_snap_id}", full_name: "Sam Snap", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_snap_id}"
              captures: { st_snap_id: $.data.id, st_snap_v0: $.data.version }
            - call: "POST /students"
              payload: { school_id: "${s_roll_id}", full_name: "Robin Roll", birthdate: "2009-05-10", grade_level: 11 }
              as: AthleticDirector
              as_user_id: "${s_roll_id}"
              captures: { st_roll_id: $.data.id, st_roll_v0: $.data.version }
            - call: "POST /students/${st_snap_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 2.400, term_credits: 6, expected_student_version: "${st_snap_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
              captures: { st_snap_v1: $.data.version }
            - call: "POST /students/${st_snap_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 1.900, term_credits: 6, expected_student_version: "${st_snap_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /students/${st_roll_id}/academic-postings"
              payload: { term_label: "2025-FALL", term_gpa: 2.400, term_credits: 6, expected_student_version: "${st_roll_v0}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
              captures: { st_roll_v1: $.data.version }
            - call: "POST /students/${st_roll_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 1.900, term_credits: 6, expected_student_version: "${st_roll_v1}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_snap_id}", title_id: "${t_id}", coach_id: "${c_snap_id}", name: "North Nova" }
              as: Coach
              as_user_id: "${c_snap_id}"
              captures: { tm_snap_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_roll_id}", title_id: "${t_id}", coach_id: "${c_roll_id}", name: "West Wave" }
              as: Coach
              as_user_id: "${c_roll_id}"
              captures: { tm_roll_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_snap_id}", student_id: "${st_snap_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_snap_id}"
              captures: { rs_snap_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_roll_id}", student_id: "${st_roll_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_roll_id}"
              captures: { rs_roll_id: $.data.id }
            - call: "POST /roster-slots/${rs_snap_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-DOC-1", verified_birthdate: "2009-05-10" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
            - call: "POST /roster-slots/${rs_roll_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-DOC-2", verified_birthdate: "2009-05-10" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /roster-slots/${rs_snap_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
            - call: "POST /roster-slots/${rs_roll_id}/verify-academics"
              payload: {}
              as: EligibilityOfficer
              as_user_id: "officer-b"
          assert:
            - "Student.${st_snap_id}.effective_gpa == 1.900"
            - "Student.${st_snap_id}.academic_standing == PROBATION"
            - "Student.${st_snap_id}.standing_basis_applied == TERM_SNAPSHOT"
            - "Student.${st_roll_id}.effective_gpa == 2.150"
            - "Student.${st_roll_id}.academic_standing == GOOD"
            - "Student.${st_roll_id}.standing_basis_applied == ROLLING_CUMULATIVE"
            - "the first trigger call returns 422 with data.error_id == ERR_PROBATION_STARTER_RESTRICTED"
            - "RosterSlot.${rs_snap_id}.academic_status == PENDING and participation_status == PROSPECTIVE (unchanged by the rejected call)"
            - "the second trigger call returns 200 with RosterSlot.${rs_roll_id}.academic_status == CLEARED and participation_status == ACTIVE"
            - "RosterSlot.${rs_roll_id}.effective_gpa_at_verification == 2.150 and standing_at_verification == GOOD"
            - "Team.${tm_snap_id}.active_starter_count == 0 and Team.${tm_roll_id}.active_starter_count == 1"

      - name: seed_points_match_point_basis_vs_win_percentage_basis_rank_inversion
        grounds:
          - calculations.seed_points
          - calculations.tiebreak_seed_order
          - entities.Season.fields.seeding_basis
          - entities.Season.fields.seeding_basis_applied
          - entities.Team.fields.seed_points
          - entities.Team.fields.seed_position
          - state_machines.Team.COMPETING_to_PLAYOFF_SEEDED
          - state_machines.Team.COMPETING_to_ELIMINATED
        distinguishing_aspect: |
          The dual variant lives on the Team/Season entity domain (not the Student domain of
          the sibling instance): over one frozen result set, MATCH_POINT_BASIS ranks the
          forfeit-fed team Alpha first with 6.0000 points while WIN_PERCENTAGE_BASIS scores
          it 0.0000 (forfeits enter neither numerator nor denominator) and promotes Bravo to
          seed 1 with 1.0000, inverting seeds 1 and 2.
        test_recipe:
          setup:
            - "One district, one school, three certified coaches, three students each with a single 3.100 / 6-credit posting"
            - "Season Fall 2026 Varsity on title Rocket Arena (server_pool_capacity 1, match_duration_minutes 60), defaults elsewhere: min_starters 1, max_starters 3, playoff_slots 2, seeding_basis MATCH_POINT_BASIS"
            - "Teams Alpha, Bravo and Charlie each hold one ACTIVE STARTER slot, are REGISTERED, ROSTER_LOCKED and then COMPETING after the season reaches REGULAR_SEASON"
            - "Charlie forfeits to Alpha and Bravo forfeits to Alpha; Bravo then beats Charlie 2-1 on a confirmed report"
            - "Resulting counters: Alpha match_points 6 / forfeit_wins 2 / wins 0 / losses 0 / draws 0; Bravo match_points 3 / wins 1 / forfeits_charged 1 / games 2-1; Charlie match_points 0 / losses 1 / forfeits_charged 1 / games 1-2; Season.match_point_pool 9"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default throughout"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "N-001" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
