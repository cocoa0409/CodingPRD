      - name: completed_revenue_leg_credits_the_period_at_four_decimal_hours
        claim_type: Correct Result
        grounds:
          - calculations.monthly_utilization_charge
          - calculations.leg_billable_block_minutes
          - entities.UtilizationPeriod.fields.credited_hours
          - endpoints[GET /wetlease/utilization-periods/{periodId}/settlement-preview]
        distinguishing_aspect: |
          One completed 145-minute revenue leg against a 5.0000-hour guarantee exercises every
          step of the charge in one shot: 145 / 60 rounds half-up to 2.4167 h (NOT 2.4166 truncated
          and NOT 2.42), the strict `<` branch yields shortfall 2.5833 h with zero overrun, and
          because no leg was cancelled by the lessor lessor_attributable_shortfall_hours is 0, so the
          shortfall attracts NO credit - the lessee still pays the full guarantee 5 x 480000 =
          2,400,000 cents. Implementations that credit every shortfall hour would return 1,656,000.
          
