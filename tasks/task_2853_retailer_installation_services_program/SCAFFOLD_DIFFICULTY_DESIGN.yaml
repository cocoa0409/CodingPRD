              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "00000000-0000-0000-0000-0000000000ff", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T16:00:00.000Z", expected_project_version: "${pv} - 1" }
              as: ProjectCoordinator
          assert:
            - "HTTP 404 with error_id ERR_INSTALLER_NOT_FOUND, not 412 ERR_STALE_PROJECT_VERSION"
            - "GET /projects/${proj_id} shows version == ${pv} and fulfillment_status == MEASURED"
            - "GET /projects/${proj_id} shows financial_status == DEPOSIT_HELD AND deposit_held_cents == 59002"

  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Three DIFFERENT metrics on three DIFFERENT endpoints:
  #   composite_score vs REMOVAL_COMPOSITE_MAX   POST /installers/{id}/scorecard-events
  #   effective_units vs permit_unit_threshold   POST /projects
  #   delivery_slack_hours vs 24                 POST /installer-assignments/{id}/confirm
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: composite_score_landing_exactly_on_70_00_makes_removal_eligible
        grounds:
          - calculations.installer_scorecard.constants.REMOVAL_COMPOSITE_MAX
          - calculations.installer_scorecard.formula.STEP4
          - calculations.installer_scorecard.formula.STEP6
          - entities.Installer.fields.removal_eligible
          - endpoints[POST /installers/{id}/scorecard-events]
          - endpoints[GET /installers/{id}/scorecard]
        distinguishing_aspect: |
          Metric: the weighted composite_score against REMOVAL_COMPOSITE_MAX
          70.00 on POST /installers/{id}/scorecard-events. The fifth event lands
          the composite on EXACTLY 70.00, which is an INCLUSIVE bound, so
          removal_eligible must flip to true; an implementation using a strict
          `< 70.00` leaves it false. The one-tick-above value 71.25 and the
          one-tick-below value 68.75 are both named so the exact landing cannot
          be reached by accident.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00.000Z, so the rolling window opens 2026-05-03T00:00:00.000Z and every event below is inside it at weight 1.00."
            - "One Installer ACTIVE with a VERIFIED FLOORING credential in METRO-01 and background PASS."
            - "Four MANUAL ScorecardEvents already filed: PUNCH_SAFETY, PUNCH_MINOR, CSAT_SURVEY(2), CSAT_SURVEY(2). After the third event the installer is already on PROBATION (composite 72.50 <= 78.00 with 3 events) and after the fourth the composite is 71.25 with removal_eligible still false."
            - "Exactly one PUNCH_SAFETY event is in the window, so REMOVAL_SAFETY_COUNT (2) is NOT met and rolling_no_show_count is 0 — the only route to removal_eligible is the composite bound itself."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_SAFETY", occurred_at: "2026-07-05T00:00:00.000Z" }
              as: ServiceManager
              captures: { ev1_id: $.data.id, ev1_quality_delta: $.data.quality_delta }
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_MINOR", occurred_at: "2026-07-08T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-07-12T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-07-16T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
            - call: "GET /installers/${inst_id}/scorecard"
              payload: {}
              as: ServiceManager
              captures: { pre_composite: $.data.rolling_composite_score, pre_removal: $.data.removal_eligible }
          trigger:
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-07-20T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
          assert:
            - "Before the trigger, GET /installers/${inst_id}/scorecard reported rolling_composite_score 71.25 and removal_eligible false (the one-tick-above case)"
            - "Installer.${inst_id}.quality_score == 67.00 AND timeliness_score == 82.00 AND satisfaction_score == 61.00"
            - "Installer.${inst_id}.composite_score == 70.00 exactly — not 71.25 and not 68.75"
            - "Installer.${inst_id}.removal_eligible == true (70.00 <= 70.00 is INCLUSIVE, with rolling_event_count 5 >= 3)"
            - "Installer.${inst_id}.rolling_event_count == 5 AND rolling_no_show_count == 0"
            - "GET /installers/${inst_id}/scorecard shows lifetime_composite_score == 70.00 too, because every event is inside the 90-day band at weight 1.00"
            - "Installer.${inst_id}.status == PROBATION (removal_eligible is a flag; it does not itself remove the installer)"

      - name: estimated_units_exactly_at_permit_unit_threshold_requires_a_permit
        grounds:
          - calculations.permit_responsibility_determination.formula.STEP1
          - entities.Jurisdiction.fields.permit_unit_threshold
          - entities.Project.fields.permit_responsibility
          - entities.Project.fields.permit_status
