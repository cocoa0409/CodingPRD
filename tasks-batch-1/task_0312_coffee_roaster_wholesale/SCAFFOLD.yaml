    path: "/products/{id}/archive"
    description: "Archive (soft-delete) a product so it cannot be added to new order lines"
    roles: [SalesRep, RoasterStaff]
    code: 200
    input: []
    output: Product
    side_effects: ["set archived = true"]

  # ---- GreenLot ----
  - method: POST
    path: "/green-lots"
    description: "Receive a green-coffee lot into inventory"
    roles: [RoasterStaff]
    code: 201
    input: [origin, lot_ref, received_kg, par_level_kg]
    output: GreenLot
    side_effects: ["on_hand_kg = received_kg; reserved_kg = 0; available_kg = received_kg; reorder_status computed"]
  - method: GET
    path: "/green-lots"
    description: "List green lots"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: ["reorder_status?", "limit?", "offset?"]
    output: GreenLot[]
    side_effects: ["recompute on_hand/reserved/available/reorder_status"]
  - method: GET
    path: "/green-lots/{id}"
    description: "Get a green lot (computed inventory fields)"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: []
    output: GreenLot
    side_effects: ["recompute on_hand/reserved/available/reorder_status"]
  - method: GET
    path: "/green-lots/{id}/roast-batches"
    description: "List roast batches drawing from this green lot (FK reverse-reachability for RoastBatch.green_lot_id)"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RoastBatch[]
    side_effects: []

  # ---- RoastBatch ----
  - method: POST
    path: "/roast-batches"
    description: "Plan a roast batch; reserves planned_green_kg on the green lot. OCC-guarded on the green lot."
    roles: [RoasterStaff]
    code: 201
    input: [green_lot_id, product_id, planned_green_kg, expected_green_lot_version]
    output: RoastBatch
    side_effects: ["roast_profile_id copied from product; planned_roasted_kg computed; GreenLot.reserved_kg/available_kg/reorder_status recompute; increments GreenLot.version by 1"]
  - method: GET
    path: "/roast-batches"
    description: "List roast batches. Filter by product_id or roast_profile_id (FK reverse-reachability for RoastBatch.product_id and RoastBatch.roast_profile_id) or status."
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: ["product_id?", "roast_profile_id?", "status?", "limit?", "offset?"]
    output: RoastBatch[]
    side_effects: []
  - method: GET
    path: "/roast-batches/{id}"
    description: "Get a roast batch"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: []
    output: RoastBatch
    side_effects: []
  - method: POST
    path: "/roast-batches/{id}/start"
    description: "Start roasting; record actual_green_kg; converts reservation to consumption on green lot"
    roles: [RoasterStaff]
    code: 200
    input: [actual_green_kg]
    output: RoastBatch
    side_effects: ["status PLANNED->ROASTING; GreenLot on_hand/reserved/available/reorder_status recompute; increments RoastBatch.version by 1"]
  - method: POST
    path: "/roast-batches/{id}/drop"
    description: "Drop the roast to cooling"
    roles: [RoasterStaff]
    code: 200
    input: []
    output: RoastBatch
    side_effects: ["status ROASTING->COOLING; increments RoastBatch.version by 1"]
  - method: POST
    path: "/roast-batches/{id}/reroast"
    description: "Send a cooling batch back for a bounded development re-roast (cyclic loop)"
    roles: [RoasterStaff]
    code: 200
    input: []
    output: RoastBatch
    side_effects: ["status COOLING->ROASTING; reroast counter increments; increments RoastBatch.version by 1"]
  - method: POST
    path: "/roast-batches/{id}/complete"
    description: "Complete the roast; record actual_roasted_kg; stamp roast_date; create RoastedLot"
    roles: [RoasterStaff]
    code: 200
    input: [actual_roasted_kg]
    output: RoastBatch
    side_effects: ["status COOLING->COMPLETED; actual_shrink_bps computed; roast_date = clock; cascade-create RoastedLot; increments RoastBatch.version by 1"]
  - method: POST
    path: "/roast-batches/{id}/cancel"
    description: "Cancel a planned batch; release green reservation"
    roles: [RoasterStaff]
    code: 200
    input: []
    output: RoastBatch
    side_effects: ["status PLANNED->CANCELLED; GreenLot reserved/available/reorder_status recompute; increments RoastBatch.version by 1"]
  - method: GET
    path: "/roast-batches/{id}/roasted-lots"
    description: "List roasted lots produced by this batch (FK reverse-reachability for RoastedLot.roast_batch_id)"
    roles: [RoasterStaff, SalesRep]
    code: 200
    input: ["limit?", "offset?"]
    output: RoastedLot[]
    side_effects: []

  # ---- RoastedLot ----
