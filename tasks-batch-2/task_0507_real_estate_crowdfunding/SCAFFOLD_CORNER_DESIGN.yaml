      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: [roles, "validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Calling POST /funds without X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED (401)."
