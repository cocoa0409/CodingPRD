  # ==========================================================================
  # Rule 7 - cross_entity_state_dependency (3 instances, different entity pairs)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: hearing_creation_gated_on_packet_finalized
        grounds:
          - state_machines.Case.EVIDENCE_REVIEW_to_HEARING_PREPARATION
          - state_machines.EvidencePacket.REVIEW_CLOSED_to_FINALIZED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Entity pair Hearing -> EvidencePacket: while the case's packet is merely REVIEW_CLOSED the
          hearing create fails (case still EVIDENCE_REVIEW, ERR_INVALID_STATE_TRANSITION); only the
          packet's FINALIZED transition (which drives the case to HEARING_PREPARATION) unlocks hearing
          scheduling - no direct case write can substitute for the packet transition.
        test_recipe:
          setup:
            - "Case [SEXUAL_HARASSMENT] with packet released and both party responses in (REVIEW_CLOSED) but not yet finalized"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
