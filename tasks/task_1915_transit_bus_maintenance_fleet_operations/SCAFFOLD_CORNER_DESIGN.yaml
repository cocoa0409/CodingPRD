            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
          trigger:
            - { call: "POST /fleet/run_epoch", payload: {}, as: FleetManager, captures: { expired_n: $.data.certifications_expired } }
            - { call: "GET /fleet/certifications/${cert}", payload: {}, as: MaintenanceSupervisor, captures: { cst: $.data.status } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}", captures: { err: $.data.error_id } }
          assert:
            - "run_epoch reports certifications_expired == 1; cert status == EXPIRED"
            - "QA_CERTIFY rejected: err == ERR_CERT_EXPIRED (422); WO remains PENDING_QA"

      - name: mechanic_not_on_shift_blocks_road_call_dispatch
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_MECHANIC_NOT_ON_SHIFT]
        distinguishing_aspect: "Cross-entity gate (DefectReport x Shift x ShiftAssignment x MechanicCertification): dispatching an ENGINE-certified mechanic with no CONFIRMED assignment on a PUBLISHED shift covering the clock date fails; publishing, assigning, and confirming a same-day AM shift makes the same dispatch succeed."
        test_recipe:
          setup: ["MAJOR ENGINE defect TRIAGED with disposition ROAD_CALL; mechanic m1 holds ENGINE cert but has no shift"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "Y21", vin: "VINY21", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
