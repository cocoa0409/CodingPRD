          error (ERR_NO_FEEDSTOCK_ALLOCATED, priority 30) and never a mass error, 99.999 MT is a mass error
          one thousandth of a tonne below the floor, and exactly 100.000 MT clears MIN_CHARGE_MT because the
          comparison is inclusive.
