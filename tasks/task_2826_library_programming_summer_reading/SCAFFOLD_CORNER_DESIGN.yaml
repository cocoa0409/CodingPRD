            - "Program.${prog}.operational_status is still CLOSED_OUT and closure_reason is still null"
            - "Program.${prog}.materials_spent_cents == 2750 and materials_committed_cents == 0"
            - "InventoryLot.${lot}.quantity_issued == 10, quantity_reserved == 0, quantity_available == 90"
            - "Program.${prog}.attendance_attainment_funder_pct == 0.0 and survey_response_rate_pct == 0.0"

      - name: confirming_a_superseded_reservation_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.RoomReservation.status[HELD -> CONFIRMED]
          - validations[priority=12]
          - errors[ERR_RESERVATION_STATE_INVALID]
        distinguishing_aspect: "Only a HELD reservation may be confirmed: the superseded predecessor returns ERR_RESERVATION_STATE_INVALID (409) and the program's confirmed_room_capacity stays 0."
        test_recipe:
          setup:
