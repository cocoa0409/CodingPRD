            - "Approve after reject: HTTP 409 with data.error_id == \"ERR_REQUEST_STATE_INVALID\""
            - "GET /vote-by-mail/ballot-requests/${br1} returns status == \"REJECTED\" (the refused approve did not move it)"

      - name: sustained_challenge_sequesters_the_envelope_and_refers_the_voter
        claim_type: Conditional action
