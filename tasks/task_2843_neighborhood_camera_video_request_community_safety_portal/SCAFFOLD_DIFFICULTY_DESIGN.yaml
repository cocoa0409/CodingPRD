      - name: discrimination_score_per_term_rounding_beats_sum_rounding
        grounds:
          - calculations.post_discrimination_score
          - entities.ResidentPost.fields.discrimination_score
          - entities.ResidentPost.fields.auto_flag_reason
          - state_machines.ResidentPost.state.initial_state
          - endpoints[POST /neighborhood-safety/resident-posts]
        distinguishing_aspect: |
          Mode (b) — nested rounding: four weighted terms are each rounded to two decimals
          BEFORE the sum is rounded again, so the intermediate rounding is observable. Two of
          the four probe posts diverge from the naive round-once implementation (0.61 vs 0.60,
          0.55 vs 0.54) and one of those divergences flips the DISCRIMINATION_FLAG_THRESHOLD
          decision only for the round-once reading; the exact-decimal requirement is also
          pinned because 0.115 * 3 evaluates to 0.34499999999999997 in binary floating point
          and would round DOWN.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z."
            - "One resident RA at home (0,0) with alert_radius_m 0 and post_privilege_state UNRESTRICTED; no other residents exist, so every post's alert candidate pool is empty and fan-out never perturbs the score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "RA", email: "ra@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { ra_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${ra_id}", body: "Post one: profiling and tone signals.", category: "SUSPICIOUS_ACTIVITY", post_x_m: 0, post_y_m: 0, location_profiling_count: 3, hostile_tone_count: 3 }
              as: Resident
              as_user_id: "${ra_id}"
              captures: { post1_id: "$.data.id", score1: "$.data.discrimination_score", state1: "$.data.state" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${ra_id}", body: "Post two: profiling only.", category: "SUSPICIOUS_ACTIVITY", post_x_m: 0, post_y_m: 0, location_profiling_count: 4 }
              as: Resident
              as_user_id: "${ra_id}"
              captures: { post2_id: "$.data.id", score2: "$.data.discrimination_score", state2: "$.data.state" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${ra_id}", body: "Post three: sits exactly on the flag threshold.", category: "SUSPICIOUS_ACTIVITY", post_x_m: 0, post_y_m: 0, location_profiling_count: 2, hostile_tone_count: 3 }
              as: Resident
              as_user_id: "${ra_id}"
              captures: { post3_id: "$.data.id", score3: "$.data.discrimination_score", state3: "$.data.state" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${ra_id}", body: "Post four: one signal in three different classes.", category: "GENERAL", post_x_m: 0, post_y_m: 0, protected_class_term_count: 1, location_profiling_count: 1, hostile_tone_count: 1 }
              as: Resident
              as_user_id: "${ra_id}"
              captures: { post4_id: "$.data.id", score4: "$.data.discrimination_score", state4: "$.data.state" }
            - call: "POST /neighborhood-safety/resident-posts"
              payload: { author_resident_id: "${ra_id}", body: "Post five: no signals at all.", category: "LOST_PET", post_x_m: 0, post_y_m: 0 }
              as: Resident
              as_user_id: "${ra_id}"
              captures: { post5_id: "$.data.id", score5: "$.data.discrimination_score", state5: "$.data.state" }
          assert:
            - "${score1} == 0.61"
            - "${score1} != 0.60"
            - "${state1} == FLAGGED"
            - "ResidentPost.${post1_id}.auto_flag_reason == DISCRIMINATION_SCORE"
            - "${score2} == 0.46"
            - "${state2} == PUBLISHED"
            - "ResidentPost.${post2_id}.auto_flag_reason == null"
            - "${score3} == 0.49"
            - "${state3} == FLAGGED"
            - "${score4} == 0.55"
            - "${score4} != 0.54"
            - "${state4} == FLAGGED"
            - "${score5} == 0.00"
            - "${state5} == PUBLISHED"
            - "ResidentPost.${post1_id}.protected_class_term_count == 0"
            - "ResidentPost.${post4_id}.unverified_assertion_count == 0"

      - name: fatigue_tier_snapshot_read_once_not_retiered_mid_batch
        grounds:
          - calculations.notification_fatigue_budget
          - entities.NotificationDispatch.fields.recipient_budget_snapshot
          - entities.NotificationDispatch.fields.recipient_effective_budget
          - entities.NotificationDispatch.fields.batch_sequence_no
          - entities.Resident.fields.notifications_sent_today
          - entities.ConsentSolicitation.fields.notification_suppressed
          - endpoints[POST /neighborhood-safety/video-requests/{id}/submit]
        distinguishing_aspect: |
          Mode (c) — evaluation ORDER is the load-bearing part, not the arithmetic: the tier
          is read exactly once, from notifications_sent_today as it stood at batch start, and
          the dispatches emitted inside the batch consume the allowance without re-tiering the
          recipient. With budget 8, a batch-start snapshot of 4 and a five-dispatch batch the
          correct reading delivers 4 and suppresses 1, while an implementation that re-derives
          the tier after each delivery crosses FATIGUE_TIER_1_MAX mid-batch, drops the
          effective budget to 7 and delivers only 3. Every dispatch row also has to carry the
          frozen snapshot (4) and frozen effective budget (8), so the wrong reading is visible
          field-by-field and not only in the delivered count.
