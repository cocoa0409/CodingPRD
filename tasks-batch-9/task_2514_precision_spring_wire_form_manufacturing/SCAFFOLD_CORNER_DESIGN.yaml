  - name: clock_set_to_an_earlier_instant_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CLOCK_NOT_MONOTONIC]
    - validations[priority 70]
    - endpoints[POST /_clock/set_current_utc]
    distinguishing_aspect: 'The logical clock is monotonic non-decreasing: once advanced to 2026-08-05T08:00:00Z
      it refuses a move back to 2026-08-04T08:00:00Z, so no already-stamped timestamp can ever be re-dated.'
    test_recipe:
      setup:
      - One program exists and the logical clock has been advanced from its default to 2026-08-05T08:00:00Z.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
          min_fatigue_margin: 1.2
          required_ppk: 1.0
          amortization_method: FORECAST_BASIS
        as: ProgramManager
        captures:
          prog_id: $.data.id
          prog_v: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T08:00:00Z'
        as: PlantAdmin
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-04T08:00:00Z'
        as: PlantAdmin
      assert:
      - HTTP 422
      - data.error_id == 'ERR_CLOCK_NOT_MONOTONIC'
      - a follow-up POST /_clock/set_current_utc to 2026-08-05T08:00:00Z answers HTTP 200 with data null, since
        the comparison is >= and an idempotent re-set is legal
  - name: lot_below_the_minimum_order_quantity_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_BELOW_MINIMUM_ORDER_QUANTITY]
    - validations[priority 63]
    excluded_because:
      difficulty_instance: boundary_precision_check / minimum_order_quantity_inclusive_at_and_one_piece_below_on_lot_creation
      rationale: That §1.8 instance triggers this error at exactly one piece below the minimum order quantity
        and shows the inclusive boundary succeeding, which subsumes any plain trigger.
  - name: lot_beyond_the_open_commitment_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_COMMITMENT_EXCEEDED]
    - validations[priority 74]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / run_not_complete_state_outranks_commitment_exceeded_fiscal_on_lot_creation
      rationale: The §1.8 pair instance drives this error as the second half of its ordering assertion, once the
        run-state row above it is satisfied.
  - name: lot_beyond_the_interim_piece_cap_rejected
    claim_type: violation_to_error
    grounds:
    - errors[ERR_INTERIM_PIECE_CAP_EXCEEDED]
