      - name: notification_due_takes_the_stricter_of_contract_and_statute
        claim_type: threshold
        grounds:
          - calculations.incident_notification_due_at
          - calculations.incident_severity
          - calculations.vendor_risk_score
        distinguishing_aspect: |
          effective_hours is min(contractual term, statutory ceiling), never max: a vendor
          promising 12 hours must be held to 12 (due 2026-08-01T12:00:00.000Z) even though
          the CRITICAL statute allows 24, while a vendor promising 96 hours is pulled down
          to the 24-hour statute (due 2026-08-02T00:00:00.000Z). The lax vendor also picks
          up the 10-point breach-term penalty, so the two risk scores differ by exactly 10.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Vendor V1 with breach_notification_hours 12; Vendor V2 with breach_notification_hours 96. Two separate vendors are used so the incident cooling-buffer rule cannot interfere."
            - "Each vendor gets one incident detected at 2026-08-01T00:00:00Z with max_data_tier 4, which forces severity CRITICAL regardless of the student count."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
