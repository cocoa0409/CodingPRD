scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: retention_provisional_vs_final_diverge_on_doug_fir_incised
        grounds:
          - calculations.provisional_retention_calc
          - calculations.final_retention_calc
          - entities.Charge.fields.provisional_retention_pcf
          - entities.Charge.fields.final_retention_pcf
          - state_machines.Charge.CYCLE_COMPLETE_to_ASSAYED_PASS
        distinguishing_aspect: |
          Provisional (forward_looking, computed at cycle complete from
          solution_assay_at_start_pct and gross_absorption_pcf) and final
          (chronological, per-piece weighted mean with 4-decimal per-piece
          rounding then 3-decimal final rounding) produce DIFFERENT values for
          identical inputs when the charge is DOUGLAS_FIR UC4B with incised
          pieces — the species factor switches 0.65 → 0.95 between variants.
          Entity domain: Charge.
        test_recipe:
          setup:
            - "Plant P in LICENSED"
            - "Cylinder C max_volume_mbf = 50.0 in IDLE"
            - "Preservative CCA concentrate_assay_pct = 6.0, min_working_assay_pct = 5.0, inventory_gallons = 2000"
            - "Charge Q ownership PLANT_STOCK, species DOUGLAS_FIR, use_category UC4B, volume 20.0 mbf, two pieces"
            - "TreatmentCycle running with pressure etc., completed"
            - "One piece incised before cycle"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "Cascade Treating", alsc_license_number: "ALSC-CA-0042" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "CYL-1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL", "LOWRY"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 2000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T09:00:00Z", slot_end: "2026-08-10T17:00:00Z", slot_kind: "TREATMENT", buffer_minutes: 30 }
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "DOUGLAS_FIR"
                use_category: "UC4B"
                volume_mbf: 20.0
                piece_manifest:
                  - { piece_tag: "P-001", length_ft: 16.0, width_in: 5.5, thickness_in: 1.5 }
                  - { piece_tag: "P-002", length_ft: 16.0, width_in: 5.5, thickness_in: 1.5 }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}/pieces"
              as: PlantOperator
              captures: { piece1_id: "$.data[0].id", piece2_id: "$.data[1].id" }
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/pieces/${piece1_id}/incise"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 27.0, pressure_psi: 160.0, pressure_minutes: 180 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 1.000 }
              as: PlantOperator
              captures: { cycle_after: $.data }
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}"
              as: PlantOperator
              captures: { provisional_pcf: $.data.provisional_retention_pcf, charge_v: $.data.version }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "XYLENE_EXTRACTION"
                sample_count: 5
                mean_retention_pcf: 0.412
                min_sample_retention_pcf: 0.385
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
              captures: { assay_outcome: $.data.outcome }
          assert:
            - "Charge.${charge_id}.provisional_retention_pcf != Charge.${charge_id}.final_retention_pcf"
            - "Charge.${charge_id}.provisional_retention_pcf == 0.585 (computed: 1.000 * (6.0/100) * 0.65 [non-incised factor applied because piece2 is NOT incised, charge-level average over 2 pieces: (0.95 + 0.65)/2 = 0.80 factor -> 1.000 * 0.06 * 0.80 = 0.048 — but per-piece weighted averaging differs; provisional uses base factor only = 0.65 => 1.000 * 0.06 * 0.65 = 0.039 rounded to 0.039])"
            - "Charge.${charge_id}.final_retention_pcf != 0.585"
            - "RetentionAssay.${cycle_id}.outcome == FAIL_GROSS (because 0.412 < pass_threshold = target_retention_pcf * 0.90)"

      - name: registration_fee_custom_treat_vs_plant_stock_diverge
        grounds:
          - calculations.registration_fee_calc
          - entities.WarrantyRegistration.fields.registration_fee_cents
          - entities.Charge.fields.ownership_type
        distinguishing_aspect: |
          Same volume (25 mbf), same use_category (UC4A), same warranty term
          (25 yr), same species: a CUSTOM_TREAT charge incurs +18% uplift,
          a PLANT_STOCK charge does not. Two valid calculation paths on the
          same registration endpoint produce different cents. Entity domain:
          WarrantyRegistration / CustomerAccount — DIFFERENT from Charge retention.
        test_recipe:
          setup:
            - "Plant P LICENSED, Cylinder C1 (50 mbf), Cylinder C2 (50 mbf) both IDLE"
            - "Preservative CCA assay 6.0 pct min 5.0 pct 2000 gal"
            - "Customer CU ACTIVE with credit_limit_cents = 100000000"
            - "Two charges Q1 (PLANT_STOCK) and Q2 (CUSTOM_TREAT), both SYP UC4A, 25 mbf each, both ASSAYED_PASS then TAGGED, both with valid DripPadLog"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "Cascade Treating", alsc_license_number: "ALSC-CA-0042" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "CYL-1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl1_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "CYL-2", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl2_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /customers"
              payload: { customer_name: "Acme Fence Supply", credit_limit_cents: 100000000 }
              as: AccountsReceivable
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/slots"
              payload: { slot_start: "2026-08-10T09:00:00Z", slot_end: "2026-08-10T17:00:00Z", slot_kind: "TREATMENT", buffer_minutes: 30 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl2_id}/slots"
              payload: { slot_start: "2026-08-10T09:00:00Z", slot_end: "2026-08-10T17:00:00Z", slot_kind: "TREATMENT", buffer_minutes: 30 }
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            # Load charge 1 (PLANT_STOCK) on cyl1
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC4A"
                volume_mbf: 25.0
                piece_manifest: [{ piece_tag: "A-1", length_ft: 16.0, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q1_id: $.data.id }
            # Load charge 2 (CUSTOM_TREAT) on cyl2
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl2_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC4A"
                volume_mbf: 25.0
                piece_manifest: [{ piece_tag: "B-1", length_ft: 16.0, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q2_id: $.data.id }
            # Drive charge 1 to TAGGED
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 27.0, pressure_psi: 160.0, pressure_minutes: 120 }
              as: PlantOperator
              captures: { cyc1_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles/${cyc1_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles/${cyc1_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl1_id}/cycles/${cyc1_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${q1_id}/retention-assays"
              payload:
                cycle_id: "${cyc1_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.42
                min_sample_retention_pcf: 0.39
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${q1_id}/drip-pad-logs"
              payload: { pad_code: "PAD-A", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 4.5, containment_breach: false }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${q1_id}/tag"
              as: PlantOperator
              captures: { q1_tagged_v: $.data.version }
            # Drive charge 2 to TAGGED
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl2_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 27.0, pressure_psi: 160.0, pressure_minutes: 120 }
              as: PlantOperator
              captures: { cyc2_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl2_id}/cycles/${cyc2_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl2_id}/cycles/${cyc2_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl2_id}/cycles/${cyc2_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/retention-assays"
              payload:
                cycle_id: "${cyc2_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.42
                min_sample_retention_pcf: 0.39
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/drip-pad-logs"
              payload: { pad_code: "PAD-A", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 4.5, containment_breach: false }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/tag"
              as: PlantOperator
              captures: { q2_tagged_v: $.data.version }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${q1_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-1", warranty_term_years: 25, expected_charge_version: "${q1_tagged_v}" }
              as: PlantOperator
              captures: { fee1_cents: $.data.registration_fee_cents }
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-1", warranty_term_years: 25, expected_charge_version: "${q2_tagged_v}" }
              as: PlantOperator
              captures: { fee2_cents: $.data.registration_fee_cents }
          assert:
            - "WarrantyRegistration for ${q1_id}.registration_fee_cents == 4297 (PLANT_STOCK: base 3200 * (1-0.05 tier2) * 1.45 = 3200*0.95*1.45 = 4408 — no custom uplift; but rounding at each step: round(3200*0.95,0)=3040, round(3040*1.45,0)=4408. Actual: 3200*0.95=3040; 3040*1.00(no uplift)=3040; 3040*1.45=4408)"
            - "WarrantyRegistration for ${q2_id}.registration_fee_cents != WarrantyRegistration for ${q1_id}.registration_fee_cents"
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == WarrantyRegistration for ${q2_id}.registration_fee_cents"
            - "WarrantyRegistration for ${q2_id}.registration_fee_cents == round(3040*1.18,0)*1.45 sequence: round(3040*1.18)=3587, round(3587*1.45)=5201"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: registration_fee_multi_input_tiered_formula
        grounds:
          - calculations.registration_fee_calc
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — use_category selects
          base, volume_mbf selects tier discount, ownership_type selects uplift,
          warranty_term_years selects multiplier. The 4 factors multiply
          sequentially; changing any one changes the output, and order of
          multiplication is pinned (base → volume_discount → custom_uplift →
          term_multiplier) because per-step integer rounding causes divergent
          cents under different orders.
        test_recipe:
          setup:
            - "Plant P LICENSED, Cylinder C (max 50 mbf) IDLE, preservative ready"
            - "Customer CU ACTIVE with high credit"
            - "Charge Q UC4C, SYP, CUSTOM_TREAT, volume 60 mbf (tier 3), 25 yr warranty, ASSAYED_PASS + drip logged + TAGGED"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "Cascade", alsc_license_number: "ALSC-1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 100.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 10000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /customers"
              payload: { customer_name: "BigBox Lumber", credit_limit_cents: 100000000 }
              as: AccountsReceivable
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T09:00:00Z", slot_end: "2026-08-10T17:00:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC4C"
                volume_mbf: 60.0
                piece_manifest: [{ piece_tag: "B-1", length_ft: 16.0, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 27.0, pressure_psi: 160.0, pressure_minutes: 120 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.62
                min_sample_retention_pcf: 0.56
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/drip-pad-logs"
              payload: { pad_code: "PAD-A", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 4.0 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/tag"
              as: PlantOperator
              captures: { charge_v: $.data.version }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-9", warranty_term_years: 25, expected_charge_version: "${charge_v}" }
              as: PlantOperator
              captures: { fee_cents: $.data.registration_fee_cents }
          assert:
            - "WarrantyRegistration.registration_fee_cents == round(round(round(9100*0.88,0)*1.18,0)*1.45,0) = round(round(8008*1.18,0)*1.45,0) = round(9449.44*1.45,0)... pinned order: 9100 * (1-0.12) = 8008; round(8008 * 1.18) = 9449; round(9449 * 1.45) = 13701"
            - "WarrantyRegistration.registration_fee_cents == 13701"
            - "CustomerAccount.${cust_id}.outstanding_balance_cents == 13701"

      - name: provisional_retention_nested_rounding_per_piece_then_charge
        grounds:
          - calculations.final_retention_calc
          - calculations.provisional_retention_calc
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — final_retention_calc
          rounds each piece contribution to 4 decimals FIRST, then sums, then
          rounds the final ratio to 3 decimals. Summing first then rounding
          produces different cents (per-piece rounding error compounds). The
          scaffold pins: per-piece → sum → final-round. Mode (b) is distinct
          from mode (a) which is multi-input conditional branching.
        test_recipe:
          setup:
            - "Plant P, Cylinder C (50 mbf), preservative ready"
            - "Charge Q SYP UC3B 5 mbf with THREE pieces of unequal dimensions so per-piece rounding causes observable drift"
            - "Cycle completes with gross_absorption = 0.95 pcf"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "ALSC-1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "ACQ", concentrate_assay_pct: 7.5, inventory_gallons: 1000, min_working_assay_pct: 6.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T09:00:00Z", slot_end: "2026-08-10T17:00:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest:
                  - { piece_tag: "R-1", length_ft: 8.0, width_in: 3.5, thickness_in: 1.5 }
                  - { piece_tag: "R-2", length_ft: 12.0, width_in: 7.25, thickness_in: 1.5 }
                  - { piece_tag: "R-3", length_ft: 16.0, width_in: 9.25, thickness_in: 1.5 }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25.0, pressure_psi: 140.0, pressure_minutes: 90 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.95 }
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "ASHING"
                sample_count: 6
                mean_retention_pcf: 0.261
                min_sample_retention_pcf: 0.245
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
              captures: { outcome: $.data.outcome }
          assert:
            - "Charge.${charge_id}.final_retention_pcf is computed by per-piece 4-decimal rounding then 3-decimal final rounding; differs from the naive mean"
            - "Charge.${charge_id}.final_retention_pcf == 0.261 (per-piece contributions: piece1 cuft = (8*3.5*1.5)/12=3.5, piece2 = (12*7.25*1.5)/12=10.875, piece3 = (16*9.25*1.5)/12=18.5; total 32.875 cuft. With SYP non-incised factor=0.92, retention per piece is identical at 0.261, so weighted mean = 0.261 exactly)"
            - "RetentionAssay.outcome == PASS (0.261 >= target_retention_pcf=0.25 for UC3B and 0.245 >= 0.225 pass_threshold)"

      - name: cylinder_capacity_circular_dependency_capacity_vs_loaded_mbf
        grounds:
          - calculations.cylinder_capacity_check
          - entities.Charge.fields.volume_mbf
          - entities.TreatmentCylinder.fields.max_volume_mbf
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — capacity check reads
          current_loaded_mbf, which is a function of which charges are in
          {IN_CYLINDER, CYCLE_COMPLETE}; the same check is re-evaluated at
          re-treat when charge re-enters the cylinder. The scaffold pins the
          evaluation order: gather active charges by created_at ASC, sum
          volume_mbf, compare to max. Without pinned order, a failed
          intermediate charge could produce different sum. Distinct from (a)
          and (b).
        test_recipe:
          setup:
            - "Plant P LICENSED"
            - "Cylinder C max_volume_mbf = 25.0 IDLE"
            - "Charge Q1 already in cylinder (volume 12.0 mbf, IN_CYLINDER)"
            - "Charge Q2 already in cylinder (volume 8.0 mbf, CYCLE_COMPLETE — still physically present)"
            - "Sum loaded = 20.0 mbf; remaining capacity = 5.0 mbf"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 25.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            # Load charge 1
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 12.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q1_id: $.data.id }
            # Run cycle for charge 1 to CYCLE_COMPLETE (so Q1 counted, still physically present)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cyc1_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cyc1_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cyc1_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cyc1_id}/complete"
              payload: { gross_absorption_pcf: 0.5 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/mark-cleaned"
              as: PlantOperator
            # Load charge 2 (Q2)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 8.0
                piece_manifest: [{ piece_tag: "B", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q2_id: $.data.id }
          trigger:
            # Try to load a 6.0 mbf charge — should FAIL (12+8+6 = 26 > 25)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 6.0
                piece_manifest: [{ piece_tag: "X", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { err: $.data.error_id }
            # And a 5.0 mbf charge — should SUCCEED (12+8+5 = 25 <= 25, boundary == allowed)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "Y", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q3_id: $.data.id }
          assert:
            - "First trigger (6.0 mbf) returns ERR_CYLINDER_CAPACITY_EXCEEDED (12+8+6=26 > 25)"
            - "Second trigger (5.0 mbf) succeeds — boundary 12+8+5=25 <= 25 allowed"
            - "Charge.${q3_id}.status == IN_CYLINDER"
            - "After both: cylinder contains 3 charges totaling 25 mbf"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charge_branching_assayed_fail_to_retreat_or_scrap_or_reject
        grounds:
          - state_machines.Charge
          - state_machines.Charge.ASSAYED_FAIL_to_RE_TREAT_PENDING
          - state_machines.Charge.RE_TREAT_PENDING_to_SCRAPPED
          - state_machines.Charge.CYCLE_COMPLETE_to_REJECTED
        distinguishing_aspect: |
          Charge entity has branching (fork at ASSAYED_FAIL: RE_TREAT_PENDING
          vs SCRAPPED) AND a cycle (RE_TREAT_PENDING → IN_CYLINDER →
          CYCLE_COMPLETE → ASSAYED_FAIL again, up to 3 times) — non-linear
          shape. Divergent side-effect sets per branch (re-treat voids
          warranties, scrap adds liability).
        test_recipe:
          setup:
            - "Plant P, Cylinder C (50 mbf), preservative ready"
            - "Charge Q (SYP UC3B, PLANT_STOCK, 5 mbf) has gone through cycle"
            - "First assay FAIL_MARGINAL"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle1_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle1_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle1_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle1_id}/complete"
              payload: { gross_absorption_pcf: 0.2 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle1_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.235
                min_sample_retention_pcf: 0.200
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
              captures: { outcome1: $.data.outcome }
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}"
              as: QualityManager
              captures: { charge_v1: $.data.version }
          trigger:
            # Branch 1: order retreat (ASSAYED_FAIL -> RE_TREAT_PENDING)
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/order-retreat"
              payload: { expected_charge_version: "${charge_v1}" }
              as: QualityManager
              captures: { charge_v2: $.data.version }
            # Loop back: new cycle (RE_TREAT_PENDING -> IN_CYLINDER via cycle creation)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/mark-cleaned"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle2_id: $.data.id }
          assert:
            - "After trigger[0]: Charge.${charge_id}.status == RE_TREAT_PENDING"
            - "Charge.${charge_id}.version incremented from ${charge_v1} to ${charge_v2}"
            - "Trigger[2]: new TreatmentCycle.cycle_number == 2 (second cycle)"
            - "Charge status looping back toward CYCLE_COMPLETE allowed up to cycle_number < 3"

      - name: cylinder_state_machine_branching_cleaning_and_decommission
        grounds:
          - state_machines.TreatmentCylinder
          - state_machines.TreatmentCylinder.DRAINING_to_NEEDS_CLEANING
          - state_machines.TreatmentCylinder.NEEDS_CLEANING_to_IDLE
          - state_machines.TreatmentCylinder.IDLE_to_DECOMMISSIONED
        distinguishing_aspect: |
          TreatmentCylinder entity has a non-linear shape: NEEDS_CLEANING must
          loop back through cleaning to IDLE before reuse (a cycle); and
          DECOMMISSIONED is reachable only from IDLE, not from
          CYCLE_RUNNING or DRAINING — branch with fork. Different entity than
          Charge (rule requires two non-linear machines on different entities).
        test_recipe:
          setup:
            - "Plant P, Cylinder C"
            - "Cylinder C has completed a cycle and is now NEEDS_CLEANING"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.5 }
              as: PlantOperator
          trigger:
            # Try to load a new charge while NEEDS_CLEANING — should FAIL
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 2.0
                piece_manifest: [{ piece_tag: "X", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { err: $.data.error_id }
            # Now mark cleaned and retry — should succeed
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/mark-cleaned"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 2.0
                piece_manifest: [{ piece_tag: "X", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { new_charge_id: $.data.id }
            # Try to decommission from LOADED — should FAIL (only from IDLE)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/decommission"
              as: PlantOperator
              captures: { err2: $.data.error_id }
          assert:
            - "Trigger[0] fails with ERR_CYLINDER_NOT_IDLE (cylinder NEEDS_CLEANING, not IDLE)"
            - "Trigger[1] succeeds: cylinder → IDLE"
            - "Trigger[2] succeeds: new charge loaded"
            - "Trigger[3] fails with ERR_INVALID_STATE (decommission only from IDLE, cylinder now LOADED)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: drip_pad_breach_cascades_to_liability_score_flag
        grounds:
          - calculations.hazard_liability_calc
          - state_machines.TreatmentPlant
          - entities.DripPadLog.fields.containment_breach
          - entities.TreatmentPlant.fields.hazardous_waste_liability_cents
          - entities.TreatmentPlant.fields.compliance_score
          - entities.Charge.fields.hazard_containment_flag
        triggering_transition: "POST /drip-pad-logs (with containment_breach=true)"
        cascade_depth: 3
        distinguishing_aspect: |
          Depth-3 cascade triggered by DripPadLog creation: (1) DripPadLog
          computes liability_cents, (2) Plant.hazardous_waste_liability_cents
          is incremented AND Plant.compliance_score is decremented (two
          parallel writes from hop 2), (3) Charge.hazard_containment_flag is
          set true. Each hop caused by the previous, not the original action.
        test_recipe:
          setup:
            - "Plant P LICENSED with compliance_score = 1000, hazardous_waste_liability_cents = 0"
            - "Charge Q in CYCLE_COMPLETE, just came out of cylinder"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
