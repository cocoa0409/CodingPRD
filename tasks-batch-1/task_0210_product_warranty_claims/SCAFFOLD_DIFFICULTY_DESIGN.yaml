  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_refund_cascades_claim_then_registration_then_extension
        grounds:
          - state_machines.Claim.ADJUDICATED_to_FULFILLED
          - state_machines.Registration.ACTIVE_to_VOIDED
          - state_machines.ExtendedWarranty.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from POST /claims/{id}/fulfill: Claim -> FULFILLED (link1) CAUSES Registration
          -> VOIDED because resolution_type==REFUND (link2) which in turn CAUSES every ACTIVE
          ExtendedWarranty -> CANCELLED (link3); each hop is caused strictly by the prior hop.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS msrp 60000 base 12 lifespan 48."
            - "GOLD STRAIGHT_LINE tier extension 24 price 12000 cap 40000 refund_eligible true."
            - "Owner O1 ACTIVE validated registration purchase 50000 with GOLD extension."
            - "MANUFACTURING claim reported 2025-01-15, RMA_ISSUED, adjudicated APPROVE/REFUND (assessed 37500, ADJUDICATED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-6", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
