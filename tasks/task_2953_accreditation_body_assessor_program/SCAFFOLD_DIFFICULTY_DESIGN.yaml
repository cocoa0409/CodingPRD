  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assignment_state_check_precedes_impartiality_restriction_on_confirm
        conflicting_rules:
          - "priority 8 - ERR_INVALID_STATE_TRANSITION (state, 409)"
          - "priority 10 - ERR_ASSESSOR_IMPARTIALITY_RESTRICTED (business_safety, 422)"
        grounds:
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
          - validations.priority_10_ERR_ASSESSOR_IMPARTIALITY_RESTRICTED
          - state_machines.TeamAssignment.PROPOSED_to_CONFIRMED
