            - "${err_capacity} == \"ERR_HOLD_CAPACITY_EXCEEDED\" with HTTP 409 — the third candidate is 3000 bps of assignable_base 1000000 == 300000, and 300000 + 800000 == 1100000 > 1000000. The candidate is NOT 3000 bps of the 200000 that happens to be available (which would be 60000 and would fit), because gross_assigned_amount is computed against assignable_base."
