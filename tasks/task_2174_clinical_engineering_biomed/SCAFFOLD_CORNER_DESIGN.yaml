      - name: device_patch_recomputes_risk_and_replacement_score
        claim_type: standard_crud
        grounds:
          - "endpoints.PATCH /clinical-engineering/devices/{id}"
          - "calculations.device_risk_classification"
          - "calculations.replacement_priority_score"
        distinguishing_aspect: "PATCH condition_score 3 -> 5 leaves risk_score at 38 (condition is not a risk input) but drives replacement_priority_score 60.63 -> 75.63 and increments Device.version to 2."
        test_recipe:
          setup: ["One CRITICAL pump created at condition_score 3."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
