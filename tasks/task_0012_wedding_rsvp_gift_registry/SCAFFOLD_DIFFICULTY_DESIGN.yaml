scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: registry_purchase_aggregation_provisional_vs_settled
        grounds:
          - calculations.registry_purchase_aggregation
          - entities.RegistryItem.fields.fulfilled_quantity
          - entities.RegistryItem.fields.pending_quantity
          - state_machines.Purchase.transitions.CONFIRMED_to_PENDING_REVIEW
        distinguishing_aspect: |
          Domain is RegistryItem (gift purchase aggregation). The same Purchase set produces
          two distinct integer triples: settled_view exposes only CONFIRMED quantity in
          fulfilled_quantity (pending_quantity=0 surfaced), while provisional_view includes
          PENDING_REVIEW rows in pending_quantity — same data, two valid algorithms,
          different observable RegistryItem aggregates.
        test_recipe:
          setup:
            - "A Wedding W1 in RSVP_OPEN with one RegistryItem R1 (target_quantity=2, unit_price_cents=5000)."
            - "Two purchases on R1: P1 from STORE_A (qty=2, occurred_at=T0) — CONFIRMED, drives fulfilled_quantity=2 and flips R1 to FULFILLED; then P2 from STORE_B (qty=1, occurred_at=T0+1h) — PENDING_REVIEW (running total would exceed target)."
            - "Clock is at T0+2h."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w1", title: "W1 Wedding", ceremony_at: "2027-06-01T18:00:00Z", rsvp_deadline_at: "2027-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w1"
              captures: { w1_id: $.data.id }
            - call: "POST /weddings/${w1_id}/meal-options"
              payload: { code: "BEEF", label: "Beef plate", is_kids: false, max_servings: 50 }
              as: Couple
              as_user_id: "couple_w1"
            - call: "POST /weddings/${w1_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w1"
            - call: "POST /weddings/${w1_id}/registry-items"
              payload: { sku: "PLATES_4PC", title: "Dinner plate set", target_quantity: 2, unit_price_cents: 5000 }
              as: Couple
              as_user_id: "couple_w1"
              captures: { r1_id: $.data.id }
            - call: "POST /registry-items/${r1_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "SA-001", purchaser_name: "Alice", quantity: 2, occurred_at: "2027-01-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p1_id: $.data.id }
            - call: "POST /registry-items/${r1_id}/purchases"
              payload: { platform_code: "STORE_B", external_purchase_id: "SB-001", purchaser_name: "Bob", quantity: 1, occurred_at: "2027-01-02T11:00:00Z" }
              as: PlatformIntegration
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /registry-items/${r1_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w1"
              captures: { r1_settled: $.data.fulfilled_quantity, r1_pending_settled: $.data.pending_quantity, r1_status: $.data.status }
          assert:
            - "RegistryItem.${r1_id}.fulfilled_quantity == 2"
            - "RegistryItem.${r1_id}.pending_quantity == 1"
            - "RegistryItem.${r1_id}.status == FULFILLED"
            - "Purchase.${p1_id}.status == CONFIRMED"
            - "Purchase.${p2_id}.status == PENDING_REVIEW"
            - "Purchase.${p2_id}.dup_of_purchase_id == ${p1_id}"

      - name: seating_chart_dry_run_vs_commit
        grounds:
          - calculations.seating_chart_assignment
          - state_machines.Wedding.transitions.RSVP_CLOSED_to_SEATED
          - entities.Wedding.fields.seating_dirty
          - entities.SeatingAssignment
        distinguishing_aspect: |
          Domain is Wedding/SeatingAssignment (table allocation). Same attendee+table input
          set produces two valid outputs: GET /weddings/{id}/auto-seat returns the proposed
          plan WITHOUT writing SeatingAssignment rows or touching seating_dirty, while
          POST /weddings/{id}/auto-seat persists the same plan AND sets seating_dirty=true.
        test_recipe:
          setup:
            - "Wedding W2 in RSVP_CLOSED with two ATTENDING guests G1 (full_name 'Anna') and G2 (full_name 'Ben') and two Tables (table_number 1 capacity=1, table_number 2 capacity=2)."
            - "No SeatingAssignment rows exist; wedding.seating_dirty=false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w2", title: "W2 Wedding", ceremony_at: "2027-06-15T18:00:00Z", rsvp_deadline_at: "2027-05-30T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w2"
              captures: { w2_id: $.data.id }
            - call: "POST /weddings/${w2_id}/meal-options"
              payload: { code: "VEG", label: "Vegetarian", is_kids: false, max_servings: 100 }
              as: Couple
              as_user_id: "couple_w2"
              captures: { meal_veg_id: $.data.id }
            - call: "POST /weddings/${w2_id}/tables"
              payload: { table_number: 1, capacity: 1, kids_only: false }
              as: Couple
              as_user_id: "couple_w2"
            - call: "POST /weddings/${w2_id}/tables"
              payload: { table_number: 2, capacity: 2, kids_only: false }
              as: Couple
              as_user_id: "couple_w2"
            - call: "POST /weddings/${w2_id}/guests"
              payload: { full_name: "Anna", email: "anna@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w2"
              captures: { g_anna_id: $.data.id }
            - call: "POST /weddings/${w2_id}/guests"
              payload: { full_name: "Ben", email: "ben@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w2"
              captures: { g_ben_id: $.data.id }
            - call: "POST /weddings/${w2_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w2"
            - call: "POST /guests/${g_anna_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_veg_id}" }
              as: Couple
              as_user_id: "couple_w2"
            - call: "POST /guests/${g_ben_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_veg_id}" }
              as: Couple
              as_user_id: "couple_w2"
            - call: "POST /weddings/${w2_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w2"
              captures: { w2_v_after_close: $.data.version, w2_dirty_after_close: $.data.seating_dirty }
          trigger:
            - call: "GET /weddings/${w2_id}/auto-seat"
              payload: {}
              as: Couple
              as_user_id: "couple_w2"
              captures: { dry_plan: $.data }
            - call: "GET /weddings/${w2_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w2"
              captures: { w2_dirty_after_dry: $.data.seating_dirty }
            - call: "POST /weddings/${w2_id}/auto-seat"
              payload: {}
              as: Couple
              as_user_id: "couple_w2"
              captures: { commit_plan: $.data }
          assert:
            - "After GET /weddings/${w2_id}/auto-seat: Wedding.${w2_id}.seating_dirty == false (dry-run does not mutate)."
            - "After POST /weddings/${w2_id}/auto-seat: Wedding.${w2_id}.seating_dirty == true and version incremented."
            - "Exactly 2 SeatingAssignment rows now exist for wedding_id=${w2_id} (one for Anna at table_number=1, one for Ben at table_number=2 — alphabetical by full_name with created_at tied; Anna sorts before Ben)."

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: thank_you_completion_nested_rounding_order
        grounds:
          - calculations.thank_you_completion_score
          - entities.ThankYouNote.fields.status
        distinguishing_aspect: |
          Mode (b) — nested rounding order. The formula PINS S_raw computed at full float
          precision then divided by N_total then *100 then round_half_up once at the end;
          the reverse order ("round each note's contribution then sum") produces different
          cents at the chosen inputs (1 SENT, 1 DRAFTED, 1 PENDING out of 3).
        test_recipe:
          setup:
            - "Wedding W3 has three ThankYouNotes on CONFIRMED purchases of the wedding: one in PENDING, one in DRAFTED, one in SENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w3", title: "W3 Wedding", ceremony_at: "2027-07-01T18:00:00Z", rsvp_deadline_at: "2027-06-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w3"
              captures: { w3_id: $.data.id }
            - call: "POST /weddings/${w3_id}/meal-options"
              payload: { code: "VEG", label: "Vegetarian", is_kids: false, max_servings: 50 }
              as: Couple
              as_user_id: "couple_w3"
            - call: "POST /weddings/${w3_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w3"
            - call: "POST /weddings/${w3_id}/registry-items"
              payload: { sku: "BLENDER", title: "Blender", target_quantity: 5, unit_price_cents: 8000 }
              as: Couple
              as_user_id: "couple_w3"
              captures: { r3_id: $.data.id }
            - call: "POST /registry-items/${r3_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "A1", purchaser_name: "Alice", quantity: 1, occurred_at: "2027-02-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { pa_id: $.data.id }
            - call: "POST /registry-items/${r3_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "A2", purchaser_name: "Bob", quantity: 1, occurred_at: "2027-02-02T11:00:00Z" }
              as: PlatformIntegration
              captures: { pb_id: $.data.id }
            - call: "POST /registry-items/${r3_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "A3", purchaser_name: "Carol", quantity: 1, occurred_at: "2027-02-02T12:00:00Z" }
              as: PlatformIntegration
              captures: { pc_id: $.data.id }
            - call: "GET /thank-you-notes"
              payload: { purchase_id: "${pa_id}" }
              as: Couple
              as_user_id: "couple_w3"
              captures: { tya_id: "$.data[0].id" }
            - call: "GET /thank-you-notes"
              payload: { purchase_id: "${pb_id}" }
              as: Couple
              as_user_id: "couple_w3"
              captures: { tyb_id: "$.data[0].id" }
            - call: "GET /thank-you-notes"
              payload: { purchase_id: "${pc_id}" }
              as: Couple
              as_user_id: "couple_w3"
              captures: { tyc_id: "$.data[0].id" }
            - call: "POST /thank-you-notes/${tya_id}/draft"
              payload: { drafted_body: "Thank you Alice." }
              as: Couple
              as_user_id: "couple_w3"
            - call: "POST /thank-you-notes/${tya_id}/send"
              payload: {}
              as: Couple
              as_user_id: "couple_w3"
            - call: "POST /thank-you-notes/${tyb_id}/draft"
              payload: { drafted_body: "Thank you Bob." }
              as: Couple
              as_user_id: "couple_w3"
          trigger:
            - call: "GET /weddings/${w3_id}/thank-you-report"
              payload: {}
              as: Couple
              as_user_id: "couple_w3"
              captures: { report_pct: $.data.completion_pct }
          assert:
            # Inputs: N_total=3, N_sent=1, N_drafted=1, N_pending=1.
            # Pinned order: S_raw = 1*1.00 + 1*0.40 + 1*0.00 = 1.40
            # completion_pct = round_half_up((1.40/3.0) * 100, 2)
            #                = round_half_up(46.666666..., 2) = 46.67
            - "Thank-you-report.completion_pct == 46.67"
            - "Thank-you-report.n_total == 3 and n_sent == 1 and n_drafted == 1 and n_pending == 1"
            - "Thank-you-report.is_complete == false"

      - name: seating_chart_three_input_nonlinear_kids_spill
        grounds:
          - calculations.seating_chart_assignment
          - entities.Table.fields.capacity
          - entities.Table.fields.kids_only
          - entities.Guest.fields.is_child
          - validations[priority=7]
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction. The seating waterfall combines
          capacity (integer), kids_only (boolean), and is_child (boolean) in a nested
          conditional: child-into-non-kids-table is REJECTED unless every kids_only table
          is at capacity (a conditional override predicate that depends on aggregate state
          across the kids_only table set). Three inputs interact non-linearly.
        test_recipe:
          setup:
            - "Wedding W4 in RSVP_CLOSED with: Table T1 (kids_only=true, capacity=1), Table T2 (kids_only=false, capacity=4). Two child guests CK1 (full_name 'AAA'), CK2 (full_name 'BBB') both ATTENDING. T1 has 1 slot for kids; CK2 must spill to T2 BECAUSE T1 is full."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w4", title: "W4 Wedding", ceremony_at: "2027-08-01T18:00:00Z", rsvp_deadline_at: "2027-07-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w4"
              captures: { w4_id: $.data.id }
            - call: "POST /weddings/${w4_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 50 }
              as: Couple
              as_user_id: "couple_w4"
              captures: { meal_adult_id: $.data.id }
            - call: "POST /weddings/${w4_id}/meal-options"
              payload: { code: "KIDS", label: "Kids pasta", is_kids: true, max_servings: 50 }
              as: Couple
              as_user_id: "couple_w4"
              captures: { meal_kids_id: $.data.id }
            - call: "POST /weddings/${w4_id}/tables"
              payload: { table_number: 1, capacity: 1, kids_only: true }
              as: Couple
              as_user_id: "couple_w4"
              captures: { t1_id: $.data.id }
            - call: "POST /weddings/${w4_id}/tables"
              payload: { table_number: 2, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_w4"
              captures: { t2_id: $.data.id }
            - call: "POST /weddings/${w4_id}/guests"
              payload: { full_name: "AAA", email: "aaa@example.com", is_child: true, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w4"
              captures: { ck1_id: $.data.id }
            - call: "POST /weddings/${w4_id}/guests"
              payload: { full_name: "BBB", email: "bbb@example.com", is_child: true, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w4"
              captures: { ck2_id: $.data.id }
            - call: "POST /weddings/${w4_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w4"
            - call: "POST /guests/${ck1_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_kids_id}" }
              as: Couple
              as_user_id: "couple_w4"
            - call: "POST /guests/${ck2_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_kids_id}" }
              as: Couple
              as_user_id: "couple_w4"
            - call: "POST /weddings/${w4_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w4"
          trigger:
            - call: "POST /weddings/${w4_id}/auto-seat"
              payload: {}
              as: Couple
              as_user_id: "couple_w4"
              captures: { plan_result: $.data }
          assert:
            - "Exactly 2 SeatingAssignment rows exist for wedding_id=${w4_id}."
            - "The SeatingAssignment for assignee_id=${ck1_id} has table_id=${t1_id} (CK1 fills the only kids_only table)."
            - "The SeatingAssignment for assignee_id=${ck2_id} has table_id=${t2_id} (CK2 spills into adult table because kids_only is at capacity)."

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: guest_state_machine_branching_with_revert
        grounds:
          - state_machines.Guest.transitions.INVITED_to_ATTENDING
          - state_machines.Guest.transitions.INVITED_to_DECLINED
          - state_machines.Guest.transitions.ATTENDING_to_INVITED
          - state_machines.Guest.transitions.ATTENDING_to_DECLINED
          - state_machines.Guest.transitions.DECLINED_to_INVITED
        distinguishing_aspect: |
          Entity is Guest. The state machine is branching-with-revert: from INVITED the
          guest can go to ATTENDING or DECLINED, and from either ATTENDING or DECLINED a
          Couple-initiated revoke-rsvp returns the guest to INVITED. This is NOT a linear
          pipeline.
        test_recipe:
          setup:
            - "Wedding W5 in RSVP_OPEN with one guest G_revert in INVITED, one MealOption available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w5", title: "W5 Wedding", ceremony_at: "2027-09-01T18:00:00Z", rsvp_deadline_at: "2027-08-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w5"
              captures: { w5_id: $.data.id }
            - call: "POST /weddings/${w5_id}/meal-options"
              payload: { code: "BEEF", label: "Beef", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w5"
              captures: { meal_id: $.data.id }
            - call: "POST /weddings/${w5_id}/guests"
              payload: { full_name: "Revert Guest", email: "rg@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w5"
              captures: { g_revert_id: $.data.id }
            - call: "POST /weddings/${w5_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w5"
          trigger:
            - call: "POST /guests/${g_revert_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_id}" }
              as: Couple
              as_user_id: "couple_w5"
              captures: { st_after_attend: $.data.rsvp_status, meal_after_attend: $.data.meal_option_id }
            - call: "POST /guests/${g_revert_id}/revoke-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w5"
              captures: { st_after_revoke: $.data.rsvp_status, meal_after_revoke: $.data.meal_option_id }
            - call: "POST /guests/${g_revert_id}/rsvp"
              payload: { attending: false }
              as: Couple
              as_user_id: "couple_w5"
              captures: { st_after_decline: $.data.rsvp_status }
            - call: "POST /guests/${g_revert_id}/revoke-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w5"
              captures: { st_after_revoke_2: $.data.rsvp_status }
          assert:
            - "Guest.${g_revert_id}.rsvp_status sequence is ATTENDING -> INVITED -> DECLINED -> INVITED (branching with revert)."
            - "Guest.${g_revert_id}.meal_option_id is null after each revoke and after the DECLINE."

      - name: registry_item_cyclic_open_fulfilled
        grounds:
          - state_machines.RegistryItem.transitions.OPEN_to_FULFILLED
          - state_machines.RegistryItem.transitions.FULFILLED_to_OPEN
          - state_machines.Purchase.transitions.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Entity is RegistryItem (a DIFFERENT entity from Guest). The state machine cycles
          OPEN -> FULFILLED -> OPEN as Purchase additions and cancellations drive
          fulfilled_quantity above and below target_quantity. This is a true cycle, not
          a one-way pipeline.
        test_recipe:
          setup:
            - "Wedding W6 in RSVP_OPEN with one RegistryItem R6 (target_quantity=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w6", title: "W6 Wedding", ceremony_at: "2027-10-01T18:00:00Z", rsvp_deadline_at: "2027-09-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w6"
              captures: { w6_id: $.data.id }
            - call: "POST /weddings/${w6_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w6"
            - call: "POST /weddings/${w6_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w6"
            - call: "POST /weddings/${w6_id}/registry-items"
              payload: { sku: "TOASTER", title: "Toaster", target_quantity: 1, unit_price_cents: 4000 }
              as: Couple
              as_user_id: "couple_w6"
              captures: { r6_id: $.data.id, r6_v_open: $.data.version }
            - call: "POST /registry-items/${r6_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "T1", purchaser_name: "Dan", quantity: 1, occurred_at: "2027-05-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p_t1_id: $.data.id }
            - call: "GET /registry-items/${r6_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w6"
              captures: { r6_v_after_fulfill: $.data.version, r6_status_after_fulfill: $.data.status }
          trigger:
            - call: "POST /purchases/${p_t1_id}/cancel-duplicate"
              payload: { expected_registry_item_version: "${r6_v_after_fulfill}" }
              as: Couple
              as_user_id: "couple_w6"
              captures: { p_cancelled: $.data.status }
            - call: "GET /registry-items/${r6_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w6"
              captures: { r6_status_after_cancel: $.data.status, r6_v_after_cancel: $.data.version }
          assert:
            - "RegistryItem.${r6_id}.status went OPEN -> FULFILLED -> OPEN as the toaster was purchased then cancelled."
            - "Purchase.${p_t1_id}.status == CANCELLED after the cancel."
            - "RegistryItem.${r6_id}.fulfilled_quantity == 0 after the cancel."

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: guest_decline_in_seated_wedding_depth3_cascade
        grounds:
          - state_machines.Guest.transitions.ATTENDING_to_DECLINED
          - state_machines.PlusOne.transitions.ATTENDING_to_DECLINED
          - state_machines.Wedding.transitions.SEATED_to_RSVP_CLOSED
          - entities.Wedding.fields.seating_dirty
        distinguishing_aspect: |
          Trigger is Guest.RSVP attending=false. Chain depth ≥ 3:
          (1) Guest ATTENDING -> DECLINED with meal_option_id cleared;
          (2) cascade: PlusOne under that Guest auto-DECLINES, its meal_option_id cleared;
          (3) cascade from (2): any SeatingAssignment for the Guest and the PlusOne is
              deleted, and Wedding auto-transitions SEATED -> RSVP_CLOSED with
              seating_dirty=true. Each link is caused by the prior link, not the original
              action — Guest.RSVP did not directly delete SeatingAssignments; the PlusOne
              cascade did.
        test_recipe:
          setup:
            - "Wedding W7 in SEATED. Guest G_head (ATTENDING) has PlusOne PO_partner (ATTENDING). Both have SeatingAssignments at Table T7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w7", title: "W7 Wedding", ceremony_at: "2027-11-01T18:00:00Z", rsvp_deadline_at: "2027-10-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w7"
              captures: { w7_id: $.data.id }
            - call: "POST /weddings/${w7_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w7"
              captures: { meal7_id: $.data.id }
            - call: "POST /weddings/${w7_id}/tables"
              payload: { table_number: 7, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_w7"
              captures: { t7_id: $.data.id }
            - call: "POST /weddings/${w7_id}/guests"
              payload: { full_name: "Head", email: "head@example.com", is_child: false, plus_one_allowed: true }
              as: Couple
              as_user_id: "couple_w7"
              captures: { g_head_id: $.data.id }
            - call: "POST /weddings/${w7_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w7"
            - call: "POST /guests/${g_head_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal7_id}" }
              as: Couple
              as_user_id: "couple_w7"
            - call: "POST /guests/${g_head_id}/plus-ones"
              payload: { full_name: "Partner", is_child: false, meal_option_id: "${meal7_id}" }
              as: Couple
              as_user_id: "couple_w7"
              captures: { po_partner_id: $.data.id }
            - call: "POST /weddings/${w7_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w7"
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w7_id}", table_id: "${t7_id}", assignee_type: "GUEST", assignee_id: "${g_head_id}" }
              as: Couple
              as_user_id: "couple_w7"
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w7_id}", table_id: "${t7_id}", assignee_type: "PLUS_ONE", assignee_id: "${po_partner_id}" }
              as: Couple
              as_user_id: "couple_w7"
            - call: "GET /weddings/${w7_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w7"
              captures: { w7_v_pre_seat: $.data.version }
            - call: "POST /weddings/${w7_id}/finalize-seating"
              payload: { expected_wedding_version: "${w7_v_pre_seat}" }
              as: Couple
              as_user_id: "couple_w7"
              captures: { w7_status_seated: $.data.status }
          trigger:
            - call: "POST /guests/${g_head_id}/rsvp"
              payload: { attending: false }
              as: Couple
              as_user_id: "couple_w7"
              captures: { g_head_status_after: $.data.rsvp_status }
            - call: "GET /weddings/${w7_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w7"
              captures: { w7_status_after: $.data.status, w7_dirty_after: $.data.seating_dirty }
            - call: "GET /plus-ones/${po_partner_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w7"
              captures: { po_status_after: $.data.rsvp_status, po_meal_after: $.data.meal_option_id }
            - call: "GET /seating-assignments"
              payload: { wedding_id: "${w7_id}" }
              as: Couple
              as_user_id: "couple_w7"
          assert:
            - "Guest.${g_head_id}.rsvp_status == DECLINED and meal_option_id == null."
            - "PlusOne.${po_partner_id}.rsvp_status == DECLINED and meal_option_id == null (cascade depth 2)."
            - "Zero SeatingAssignment rows exist for wedding_id=${w7_id} (cascade depth 3)."
            - "Wedding.${w7_id}.status == RSVP_CLOSED and seating_dirty == true (cascade depth 3)."

      - name: purchase_cancel_depth2_recompute_and_notedelete
        grounds:
          - state_machines.Purchase.transitions.CONFIRMED_to_CANCELLED
          - state_machines.RegistryItem.transitions.FULFILLED_to_OPEN
          - entities.RegistryItem.fields.fulfilled_quantity
          - entities.ThankYouNote
        distinguishing_aspect: |
          Trigger is POST /purchases/{id}/cancel-duplicate on a CONFIRMED Purchase whose
          quantity drove the RegistryItem to FULFILLED. Chain depth ≥ 2:
          (1) Purchase CONFIRMED -> CANCELLED; (2) cascade from (1): RegistryItem
          aggregates recomputed, FULFILLED -> OPEN; (3) cascade from (1): the
          ThankYouNote previously auto-created for this Purchase is hard-deleted.
          Different triggering transition from instance 1 — propagation pattern is
          backwards-from-cancellation rather than forwards-from-RSVP-decline.
        test_recipe:
          setup:
            - "Wedding W8 in RSVP_OPEN with one RegistryItem R8 (target_quantity=1) that was fulfilled by a single confirmed Purchase P_full and now has an auto-created ThankYouNote in PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w8", title: "W8 Wedding", ceremony_at: "2027-12-01T18:00:00Z", rsvp_deadline_at: "2027-11-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w8"
              captures: { w8_id: $.data.id }
            - call: "POST /weddings/${w8_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w8"
            - call: "POST /weddings/${w8_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w8"
            - call: "POST /weddings/${w8_id}/registry-items"
              payload: { sku: "KETTLE", title: "Kettle", target_quantity: 1, unit_price_cents: 3000 }
              as: Couple
              as_user_id: "couple_w8"
              captures: { r8_id: $.data.id }
            - call: "POST /registry-items/${r8_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "K1", purchaser_name: "Eli", quantity: 1, occurred_at: "2027-07-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p_full_id: $.data.id }
            - call: "GET /thank-you-notes"
              payload: { purchase_id: "${p_full_id}" }
              as: Couple
              as_user_id: "couple_w8"
              captures: { ty_pre_id: "$.data[0].id" }
            - call: "GET /registry-items/${r8_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w8"
              captures: { r8_v_after_fulfill: $.data.version }
          trigger:
            - call: "POST /purchases/${p_full_id}/cancel-duplicate"
              payload: { expected_registry_item_version: "${r8_v_after_fulfill}" }
              as: Couple
              as_user_id: "couple_w8"
              captures: { p_status_after: $.data.status }
            - call: "GET /registry-items/${r8_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w8"
              captures: { r8_status_after: $.data.status, r8_qty_after: $.data.fulfilled_quantity, r8_v_after: $.data.version }
            - call: "GET /thank-you-notes"
              payload: { purchase_id: "${p_full_id}" }
              as: Couple
              as_user_id: "couple_w8"
              captures: { ty_list_after: $.data }
          assert:
            - "Purchase.${p_full_id}.status == CANCELLED."
            - "RegistryItem.${r8_id}.status == OPEN and fulfilled_quantity == 0 (cascade: aggregate recomputed)."
            - "ThankYouNote previously seen as ${ty_pre_id} no longer exists (GET /thank-you-notes?purchase_id=${p_full_id} returns empty list — cascade hard-deleted)."

  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_kids_meal_pairing_priority
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_KIDS_MEAL_PAIRING]
        distinguishing_aspect: |
          Conflict pair categories: state (priority 5) vs business_safety (priority 6).
          Request simultaneously violates both: wedding.status==DRAFT (state denies RSVP
          actions) AND meal_option_id has is_kids=true while guest.is_child=false
          (business_safety would also reject). Priority 5 must win → ERR_INVALID_STATE,
          not ERR_KIDS_MEAL_PAIRING.
        test_recipe:
          setup:
            - "Wedding W9 still in DRAFT (open-rsvp NOT yet called). One MealOption M_kids (is_kids=true). One Guest G_adult (is_child=false). Sending RSVP would trigger BOTH the state error and the kids-meal pairing error."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w9", title: "W9 Wedding", ceremony_at: "2028-01-01T18:00:00Z", rsvp_deadline_at: "2027-12-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w9"
              captures: { w9_id: $.data.id }
            - call: "POST /weddings/${w9_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w9"
            - call: "POST /weddings/${w9_id}/meal-options"
              payload: { code: "KIDS", label: "Kids pasta", is_kids: true, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w9"
              captures: { meal_kids_id: $.data.id }
            - call: "POST /weddings/${w9_id}/guests"
              payload: { full_name: "Adult", email: "adult@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w9"
              captures: { g_adult_id: $.data.id }
          trigger:
            - call: "POST /guests/${g_adult_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_kids_id}" }
              as: Couple
              as_user_id: "couple_w9"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 (ERR_INVALID_STATE)."
            - "Response.data.error_id == ERR_INVALID_STATE (priority-5 wins over priority-6)."
            - "NOT ERR_KIDS_MEAL_PAIRING (which would be the answer if priorities were swapped)."

      - name: plus_one_referential_vs_meal_full_priority
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_PLUS_ONE_NOT_ALLOWED]
          - errors[ERR_MEAL_FULL]
        distinguishing_aspect: |
          Conflict pair categories: business_referential (priority 8, ERR_PLUS_ONE_NOT_ALLOWED)
          vs business_constraint (priority 10, ERR_MEAL_FULL). Different category pair from
          instance 1. The Couple tries to POST /guests/{g}/plus-ones on a Guest with
          plus_one_allowed=false, AND the requested meal_option_id is already at
          max_servings. Priority 8 must win → ERR_PLUS_ONE_NOT_ALLOWED.
        test_recipe:
          setup:
            - "Wedding W10 in RSVP_OPEN. MealOption M_low (max_servings=1) already at capacity (one ATTENDING Guest G_eats_it has meal_option_id=M_low). Guest G_noplus has plus_one_allowed=false. Adding a PlusOne to G_noplus referencing M_low would violate BOTH plus-one eligibility AND meal capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w10", title: "W10 Wedding", ceremony_at: "2028-02-01T18:00:00Z", rsvp_deadline_at: "2028-01-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w10"
              captures: { w10_id: $.data.id }
            - call: "POST /weddings/${w10_id}/meal-options"
              payload: { code: "LOW", label: "Low", is_kids: false, max_servings: 1 }
              as: Couple
              as_user_id: "couple_w10"
              captures: { meal_low_id: $.data.id }
            - call: "POST /weddings/${w10_id}/guests"
              payload: { full_name: "Eats It", email: "eats@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w10"
              captures: { g_eats_id: $.data.id }
            - call: "POST /weddings/${w10_id}/guests"
              payload: { full_name: "NoPlus", email: "noplus@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w10"
              captures: { g_noplus_id: $.data.id }
            - call: "POST /weddings/${w10_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w10"
            - call: "POST /guests/${g_eats_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal_low_id}" }
              as: Couple
              as_user_id: "couple_w10"
          trigger:
            - call: "POST /guests/${g_noplus_id}/plus-ones"
              payload: { full_name: "Partner X", is_child: false, meal_option_id: "${meal_low_id}" }
              as: Couple
              as_user_id: "couple_w10"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422."
            - "Response.data.error_id == ERR_PLUS_ONE_NOT_ALLOWED (priority-8 wins over priority-10)."
            - "NOT ERR_MEAL_FULL."

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: meal_capacity_exact_boundary_then_overflow
        grounds:
          - validations[priority=10]
          - calculations.meal_count_aggregation
          - entities.MealOption.fields.max_servings
        distinguishing_aspect: |
          Metric: count(MealOption) vs max_servings; endpoint: POST /guests/{id}/rsvp.
          Boundary precision >= vs > pinned: count exactly EQUAL to max_servings is
          allowed; the NEXT request (count would become max_servings+1) fails with
          ERR_MEAL_FULL. The exact-equal request must succeed (the most common boundary
          bug).
        test_recipe:
          setup:
            - "Wedding W11 in RSVP_OPEN with MealOption M_boundary max_servings=2. Two ATTENDING guests already on M_boundary (count==2 == max_servings, exact boundary held). A third guest G_overflow is INVITED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w11", title: "W11 Wedding", ceremony_at: "2028-03-01T18:00:00Z", rsvp_deadline_at: "2028-02-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w11"
              captures: { w11_id: $.data.id }
            - call: "POST /weddings/${w11_id}/meal-options"
              payload: { code: "BOUND", label: "Bound", is_kids: false, max_servings: 2 }
              as: Couple
              as_user_id: "couple_w11"
              captures: { m_bound_id: $.data.id }
            - call: "POST /weddings/${w11_id}/guests"
              payload: { full_name: "G1", email: "g1@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w11"
              captures: { g1_id: $.data.id }
            - call: "POST /weddings/${w11_id}/guests"
              payload: { full_name: "G2", email: "g2@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w11"
              captures: { g2_id: $.data.id }
            - call: "POST /weddings/${w11_id}/guests"
              payload: { full_name: "Overflow", email: "ov@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w11"
              captures: { g_overflow_id: $.data.id }
            - call: "POST /weddings/${w11_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w11"
            - call: "POST /guests/${g1_id}/rsvp"
              payload: { attending: true, meal_option_id: "${m_bound_id}" }
              as: Couple
              as_user_id: "couple_w11"
            - call: "POST /guests/${g2_id}/rsvp"
              payload: { attending: true, meal_option_id: "${m_bound_id}" }
              as: Couple
              as_user_id: "couple_w11"
          trigger:
            - call: "POST /guests/${g_overflow_id}/rsvp"
              payload: { attending: true, meal_option_id: "${m_bound_id}" }
              as: Couple
              as_user_id: "couple_w11"
              captures: { err_id: $.data.error_id }
          assert:
            - "The two boundary-equal RSVPs (G1, G2) succeeded — count(M_bound) == max_servings is allowed (>=, not strict >)."
            - "The G_overflow request returned HTTP 422 with error_id == ERR_MEAL_FULL."
            - "GET /weddings/${w11_id}/meal-summary shows count for M_bound == 2 (unchanged by failed call)."

      - name: empty_attendee_seating_chart_empty_set
        grounds:
          - calculations.seating_chart_assignment
          - state_machines.Wedding.transitions.RSVP_OPEN_to_RSVP_CLOSED
        distinguishing_aspect: |
          Metric: cardinality of ATTENDING attendee set (zero vs nonzero); endpoint
          POST /weddings/{id}/auto-seat. Boundary: the empty-set case must return a
          valid plan with zero SeatingAssignment rows AND zero unseatable — no error.
          Different endpoint and metric from the meal-capacity threshold instance.
        test_recipe:
          setup:
            - "Wedding W12 in RSVP_CLOSED with one Table T12 but ZERO ATTENDING guests (all guests INVITED and auto-declined by close-rsvp; or no guests at all)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w12", title: "W12 Wedding", ceremony_at: "2028-04-01T18:00:00Z", rsvp_deadline_at: "2028-03-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w12"
              captures: { w12_id: $.data.id }
            - call: "POST /weddings/${w12_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w12"
            - call: "POST /weddings/${w12_id}/tables"
              payload: { table_number: 1, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_w12"
            - call: "POST /weddings/${w12_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w12"
            - call: "POST /weddings/${w12_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w12"
          trigger:
            - call: "POST /weddings/${w12_id}/auto-seat"
              payload: {}
              as: Couple
              as_user_id: "couple_w12"
              captures: { plan_result: $.data }
          assert:
            - "Response.data.plan is an array of length 0."
            - "Response.data.unseatable is an array of length 0."
            - "Zero SeatingAssignment rows exist for wedding_id=${w12_id} (GET /seating-assignments?wedding_id=${w12_id} returns empty list)."

  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: guest_rsvp_blocked_by_wedding_state
        grounds:
          - state_machines.Guest.transitions.INVITED_to_ATTENDING
          - state_machines.Wedding.transitions.DRAFT_to_RSVP_OPEN
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair: Guest's INVITED -> ATTENDING transition depends on parent
          Wedding.status == RSVP_OPEN. Wedding in DRAFT blocks the Guest transition
          even though the Guest's own preconditions (valid meal, eligible role) are
          satisfied.
        test_recipe:
          setup:
            - "Wedding W13 still in DRAFT (NOT opened). One Guest G_eager (INVITED) wants to RSVP."
          setup_api_calls:
