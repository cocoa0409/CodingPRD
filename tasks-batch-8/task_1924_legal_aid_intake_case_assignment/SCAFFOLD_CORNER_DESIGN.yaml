        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ETHICS_RECUSAL]"]
        distinguishing_aspect: "Segregation of duties: the staff member who ran the conflict check cannot resolve it — same X-User-ID under the EthicsOfficer role is rejected with ERR_ETHICS_RECUSAL."
