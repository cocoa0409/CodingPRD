            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "2 Oak Ave", city: "Austin", state_code: "TX", postal_code: "78702", property_type: "SINGLE_FAMILY", list_price_cents: 60000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 3, bathrooms: 2, square_feet: 1500, marketing_remarks: "Sunny yard", mls_number: "MLS-2" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "GET /listings", payload: { lifecycle_status: "ACTIVE" }, as: MarketingCoordinator }
            - { call: "GET /listings", payload: { lifecycle_status: "DRAFT" }, as: MarketingCoordinator }
          assert:
            - "ACTIVE filter returns exactly ${l_id}"
            - "DRAFT filter returns exactly ${l_draft}"

      - name: summary_computed_read_stub
        claim_type: computed_read
        grounds: ["endpoints[GET /listings/{id}/summary]"]
        excluded_because:
          difficulty_instance: feedback_score_raw_vs_decay_weighted
          rationale: "Summary derived fields are asserted in the difficulty instances (scores, breaches, posture, headline)."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: compliance_officer_cannot_create_portal
        claim_type: rbac_denial
        grounds: ["roles[ComplianceOfficer]", "endpoints[POST /portal-accounts]"]
        distinguishing_aspect: "ComplianceOfficer attempting MarketingDirector-exclusive portal creation gets ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /portal-accounts", payload: { portal_name: "PortalX" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE with http 403; no portal created"

      - name: portal_webhook_cannot_create_listing
        claim_type: rbac_denial
        grounds: ["roles[PortalWebhook]", "endpoints[POST /listings]"]
        distinguishing_aspect: "PortalWebhook role is callback-only; listing creation is denied with ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Agent exists"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: PortalWebhook, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: listing_agent_cannot_patch_others_listing
        claim_type: rbac_denial
        grounds: ["roles[ListingAgent]", "validations[priority=3]"]
        distinguishing_aspect: "A ListingAgent whose id does not match listing.agent_id is denied with ERR_FORBIDDEN_OWNERSHIP (p3, after role check, before state checks)."
        test_recipe:
          setup: ["Listing owned by agent A1"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "A1", license_number: "LIC-1", email: "a1@x.com" }, as: MarketingDirector, captures: { a1: $.data.id } }
            - { call: "POST /agents", payload: { full_name: "A2", license_number: "LIC-2", email: "a2@x.com" }, as: MarketingDirector, captures: { a2: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a1}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a1}", captures: { l_id: $.data.id, lv: $.data.version } }
          trigger:
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", bedrooms: 4 }, as: ListingAgent, as_user_id: "${a2}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_OWNERSHIP with http 403; bedrooms unchanged"

      - name: marketing_coordinator_can_patch_any_listing
        claim_type: rbac_allow
        grounds: ["roles[MarketingCoordinator]"]
        distinguishing_aspect: "MarketingCoordinator bypasses ownership and patches any listing successfully."
        test_recipe:
          setup: ["Listing owned by agent A1 in DRAFT"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "A1", license_number: "LIC-1", email: "a1@x.com" }, as: MarketingDirector, captures: { a1: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a1}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a1}", captures: { l_id: $.data.id, lv: $.data.version } }
          trigger:
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", bedrooms: 4 }, as: MarketingCoordinator }
          assert:
            - "200; bedrooms == 4; version == ${lv} + 1"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_price_change
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[price-change-stale-version]"]
        distinguishing_aspect: "A price change carrying the pre-mutation version is rejected 412 ERR_STALE_VERSION after a successful change advanced Listing.version."
        test_recipe:
          setup: ["ACTIVE listing price 50000000; client observed version ${lv} at activation"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z", bedrooms: 2, bathrooms: 2, square_feet: 1200, marketing_remarks: "Bright corner unit", mls_number: "MLS-1" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id } }
            - { call: "POST /listings/${l_id}/media-assets", payload: { kind: "PHOTO", file_url: "https://cdn/x.jpg", file_bytes: 204800, width_px: 1600, height_px: 1200 }, as: ListingAgent, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /media-assets/${m_id}/mark-ready", payload: {}, as: ListingAgent, as_user_id: "${a_id}" }
            - { call: "POST /listings/${l_id}/submit-review", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { r_id: $.data.id } }
            - { call: "POST /compliance-reviews/${r_id}/decision", payload: { outcome: "APPROVED" }, as: ComplianceOfficer }
            - { call: "POST /listings/${l_id}/activate", payload: {}, as: ListingAgent, as_user_id: "${a_id}", captures: { lv: $.data.version } }
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 49000000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /listings/${l_id}/price-changes", payload: { new_price_cents: 48000000, expected_listing_version: "${lv}" }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STALE_VERSION with http 412"
            - "price stays 49000000 and no PRICE_CHANGE event is appended for the rejected call"

      - name: occ_stale_version_on_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[listing-patch-stale-version]"]
        distinguishing_aspect: "PATCH with a stale expected_listing_version is rejected 412; version increments exactly once per successful PATCH."
        test_recipe:
          setup: ["DRAFT listing; version ${lv} captured at creation; one successful PATCH applied"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id, lv: $.data.version } }
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", bedrooms: 3 }, as: ListingAgent, as_user_id: "${a_id}" }
          trigger:
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", bathrooms: 3 }, as: ListingAgent, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STALE_VERSION with http 412; bathrooms unchanged; version == ${lv} + 1"

      - name: cascading_side_effects_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Listing.ACTIVE_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: withdraw_cascade_subscription_pause_job_cancel_posture
          rationale: "Multi-hop cascade execution is asserted end-to-end in the difficulty instance."

      - name: scheduled_actions_blackout_stub
        claim_type: scheduled_actions
        grounds: [state_machines.SyndicationJob.QUEUED_to_DISPATCHED]
        excluded_because:
          difficulty_instance: blackout_closed_interval_with_buffer
          rationale: "Deferred dispatch (scheduled action gating) is asserted in the difficulty instance."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_mutation_visibility_in_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "PATCH response itself reflects the mutation: updated field value and incremented version are visible in the same response, no re-read needed."
        test_recipe:
          setup: ["DRAFT listing version ${lv}"]
          setup_api_calls:
            - { call: "POST /agents", payload: { full_name: "Ann Agent", license_number: "LIC-1", email: "a@x.com" }, as: MarketingDirector, captures: { a_id: $.data.id } }
            - { call: "POST /listings", payload: { agent_id: "${a_id}", address_line1: "1 Main St", city: "Austin", state_code: "TX", postal_code: "78701", property_type: "CONDO", list_price_cents: 50000000, listing_expires_on: "2027-01-01T00:00:00Z" }, as: ListingAgent, as_user_id: "${a_id}", captures: { l_id: $.data.id, lv: $.data.version } }
          trigger:
            - { call: "PATCH /listings/${l_id}", payload: { expected_listing_version: "${lv}", bedrooms: 5 }, as: ListingAgent, as_user_id: "${a_id}", captures: { new_bed: $.data.bedrooms, new_v: $.data.version } }
          assert:
            - "${new_bed} == 5 and ${new_v} == ${lv} + 1 in the PATCH response body"
