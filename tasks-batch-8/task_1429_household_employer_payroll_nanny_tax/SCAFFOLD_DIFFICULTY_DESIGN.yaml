        distinguishing_aspect: |
          Boundary on quarterly household aggregate cents (metric 2), reached
          via quarterly-filing prepare (a different endpoint from the paycheck
          path): 99999 cents in Q1 -> futa_applies false; exactly 100000 ->
          true (>= is exact).
        test_recipe:
          setup:
            - "Two employers on state FF (min_wage 60, sit 0.0), each fully registered with one ACTIVE worker"
            - "E1 worker hourly 60 (1 cent/min) guarantee 99999 -> Q1 wages 99999; E2 worker hourly 3000 guarantee 2000 -> Q1 wages 100000"
