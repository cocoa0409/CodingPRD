        captures:
          act1: $.data.id
      - call: POST /zapier/workflow-versions
        payload:
          workflow_id: ${wf_id}
          integration_version_id: ${iv2}
          connection_id: ${conn_id}
        as: Member
        as_user_id: ${mem_id}
        captures:
          wv_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
