        grounds:
          - state_machines.Quote.DRAFT_to_SENT
          - entities.LightingProject.fields.design_status
          - errors[ERR_DESIGN_NOT_LOCKED]
        distinguishing_aspect: |
          Entity pair Quote->LightingProject: a DRAFT quote cannot be SENT unless its project's
          design_status == DESIGN_LOCKED; sending while the project is still ZONED returns
          ERR_DESIGN_NOT_LOCKED.
