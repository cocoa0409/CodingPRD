  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: brief_efile_gated_by_record_state
        grounds:
          - state_machines.Brief.READY_to_EFILED
          - state_machines.Record
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair = Brief → Record. Brief.transition READY → EFILED
          requires record.status IN {COMPLETE, FILED}. A Brief in READY on a
          case whose Record is still ASSEMBLING is blocked with
          ERR_RECORD_NOT_COMPLETE.
        test_recipe:
          setup:
            - "Case with notice of appeal accepted; record DESIGNATED but transcript not yet delivered (so record stuck in ASSEMBLING)"
            - "BriefingSchedule still PENDING (record not complete)"
            - "Brief B force-created against the schedule with READY status (via submit-review + approve on a court that doesn't require efiling; but schedule not ACTIVE blocks efile at priority 11 first)"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
