              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /students/${s1}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /students/${s2}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s1}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
