# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3399_teacher_portfolio_submission_assessment_center_scoring
# Breadth probe over §1.1-§1.7 claims not exercised by §1.8. Anchors prefixed
# c_ are local to this file. excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: cycle_create_applies_defaults_and_starts_draft
        claim_type: Creation
        grounds:
          - entities.CertificationCycle.fields.max_attempts_per_component
          - state_machines.CertificationCycle
        distinguishing_aspect: "Omitting max_attempts_per_component yields the default 2; the new cycle starts DRAFT with version 1 and server-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["Clock at the 2026-09-01T00:00:00Z default; empty database."]
          setup_api_calls:
            - &c_clk
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: BoardAdministrator
          trigger:
            - &c_cycle
              call: "POST /cycles"
              payload: { code: "NB-2027", components: [ { code: "CKA", kind: "ASSESSMENT", weight: 0.40 }, { code: "P1", kind: "PORTFOLIO", weight: 0.20 }, { code: "P2", kind: "PORTFOLIO", weight: 0.20 }, { code: "P3", kind: "PORTFOLIO", weight: 0.20 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75 }
              as: BoardAdministrator
              captures: { cyc_id: $.data.id, cyc_att: $.data.max_attempts_per_component, cyc_status: $.data.status, cyc_v: $.data.version }
          assert:
            - "response status 201; CertificationCycle.${cyc_id}.max_attempts_per_component == 2 (default applied)"
            - "CertificationCycle.${cyc_id}.status == DRAFT and version == 1"
            - "response data carries non-null id, created_at == 2027-01-10T00:00:00Z (logical clock), and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present (response envelope)"

      - name: cycle_create_missing_required_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CertificationCycle.fields.code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A cycle create without code is rejected 400 ERR_INVALID_REQUEST; nothing is persisted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "POST /cycles"
              payload: { components: [ { code: "CKA", kind: "ASSESSMENT", weight: 1.00 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75 }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id == ERR_INVALID_REQUEST and a non-empty data.message"

      - name: cycle_create_invalid_component_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CertificationCycle.fields.components
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A component kind outside ASSESSMENT|PORTFOLIO violates the enum constraint and is rejected 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "POST /cycles"
              payload: { code: "NB-BAD", components: [ { code: "CKA", kind: "QUIZ", weight: 1.00 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75 }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id == ERR_INVALID_REQUEST"

      - name: cycle_create_weights_not_summing_to_one_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CertificationCycle.fields.components
          - errors[ERR_WEIGHT_SUM_INVALID]
        distinguishing_aspect: "Weights 0.50 + 0.20 + 0.20 + 0.20 = 1.10 break the exactly-1.000 constraint; also two ASSESSMENT components would break the singleton rule."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "POST /cycles"
              payload: { code: "NB-W", components: [ { code: "CKA", kind: "ASSESSMENT", weight: 0.50 }, { code: "P1", kind: "PORTFOLIO", weight: 0.20 }, { code: "P2", kind: "PORTFOLIO", weight: 0.20 }, { code: "P3", kind: "PORTFOLIO", weight: 0.20 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75 }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_WEIGHT_SUM_INVALID"

      - name: candidate_create_roundtrip_defaults_and_status_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Candidate.fields.fte_fraction
          - entities.Candidate.fields.status
          - state_machines.Candidate
        distinguishing_aspect: "Registration returns status REGISTERED (a client-supplied status field is ignored), applies fte_fraction default 1.0, and mints system id/timestamps/version 1."
        test_recipe:
          setup: ["Clock 2027-01-10."]
          setup_api_calls:
            - *c_clk
          trigger:
            - &c_cand
              call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5, status: "ELIGIBLE" }
              as: Anonymous
              captures: { cand_a: $.data.id, cand_status: $.data.status, cand_fte: $.data.fte_fraction, cand_v: $.data.version }
          assert:
            - "response status 201; Candidate.${cand_a}.status == REGISTERED (client-supplied ELIGIBLE ignored)"
            - "Candidate.${cand_a}.fte_fraction == 1.0 (default) and version == 1"
            - "id is a bare UUID without type prefix; created_at == 2027-01-10T00:00:00Z"

      - name: program_create_computed_budget_remaining_equals_total
        claim_type: Computed Fields
        grounds:
          - entities.IncentiveProgram.fields.budget_remaining_cents
          - calculations.program_budget_remaining
        distinguishing_aspect: "At creation the computed budget_remaining_cents equals budget_total_cents (no APPROVED/PAID stipends) and a client-supplied budget_remaining_cents value would be ignored; status starts OPEN; omitted early_bird_multiplier defaults to 1.10."
        test_recipe:
          setup: ["Clock 2027-01-10."]
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "POST /incentive-programs"
              payload: { name: "NM Program", sponsor_state: "NM", budget_total_cents: 500000, base_stipend_cents: 300000, early_bird_deadline: "2027-12-31T00:00:00Z" }
              as: IncentiveAdministrator
              captures: { prog_id: $.data.id, prog_rem: $.data.budget_remaining_cents, prog_mult: $.data.early_bird_multiplier, prog_status: $.data.status }
          assert:
            - "IncentiveProgram.${prog_id}.budget_remaining_cents == 500000 (computed, equals total at birth)"
            - "IncentiveProgram.${prog_id}.early_bird_multiplier == 1.10 (default) and status == OPEN"

      - name: artifact_immutable_record_has_no_version_or_update
        claim_type: Immutability
        grounds:
          - entities.Artifact
        distinguishing_aspect: "Artifact declares common_fields false: the upload response carries id and created_at only — no version, no updated_at — and no update endpoint exists for artifacts in §1.5."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE; P1 submission IN_PROGRESS."
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - &c_open
              call: "POST /cycles/${cyc_id}/transition"
              payload: { to: "OPEN" }
              as: BoardAdministrator
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - &c_elig_submit
              call: "POST /candidates/${cand_a}/submit-eligibility"
              payload: { license_document_ref: "lic-a.pdf", employer_verification_ref: "emp-a.pdf" }
              as: Candidate
              as_user_id: "${cand_a}"
            - &c_elig_verify
              call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
            - &c_p1_sub
              call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P1" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_p1: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_p1}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { art_id: $.data.id }
          assert:
            - "response status 201; Artifact.${art_id} has non-null id and created_at"
            - "the artifact payload has NO version and NO updated_at key (common_fields false)"

      - name: submissions_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/submissions
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two submissions on file, limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE with P1 and P2 submissions created."
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_p1_sub
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P2" }
              as: Candidate
              as_user_id: "${cand_a}"
          trigger:
            - call: "GET /submissions"
              payload: { candidate_id: "${cand_a}", limit: 1, offset: 0 }
              as: BoardAdministrator
              captures: { page1_total: $.data }
            - call: "GET /submissions"
              payload: { candidate_id: "${cand_a}", limit: 1, offset: 1 }
              as: BoardAdministrator
          assert:
            - "page 1: exactly 1 row, total_count == 2, has_more == true"
            - "page 2 (offset 1): exactly 1 row, total_count == 2, has_more == false"
            - "filter candidate_id restricts to this candidate's rows (both pages contain only her submissions)"

      - name: submission_computed_attempt_and_superseded_fields
        claim_type: Computed Fields
        grounds:
          - entities.ComponentSubmission.fields.attempt_number
          - entities.ComponentSubmission.fields.superseded
        excluded_because:
          difficulty_instance: certification_weighted_total_provisional_latest_vs_final_max
          rationale: "attempt_number increments and superseded flips on retake are asserted verbatim in that §1.8 instance (assert lines 4-6)."

      - name: submission_initial_state_is_in_progress
        claim_type: Initial State
        grounds:
          - state_machines.ComponentSubmission
        excluded_because:
          difficulty_instance: submission_creation_blocked_until_candidate_eligible
          rationale: "The positive-path create asserts status == IN_PROGRESS after eligibility."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: tech_review_on_in_progress_submission_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ComponentSubmission.SUBMITTED_to_SCORING
          - errors[ERR_SUBMISSION_NOT_REVIEWABLE]
        distinguishing_aspect: "Tech-review on an IN_PROGRESS submission fails 409 ERR_SUBMISSION_NOT_REVIEWABLE; only SUBMITTED attempts are reviewable."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; candidate A ELIGIBLE; P1 submission IN_PROGRESS (never submitted)."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - *c_p1_sub
          trigger:
            - call: "POST /submissions/${sub_p1}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_SUBMISSION_NOT_REVIEWABLE"
            - "ComponentSubmission.${sub_p1}.status == IN_PROGRESS (unchanged)"

      - name: verify_eligibility_on_registered_candidate_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Candidate.ELIGIBILITY_REVIEW_to_ELIGIBLE
          - errors[ERR_CANDIDATE_NOT_IN_REVIEW]
        distinguishing_aspect: "Verifying a REGISTERED candidate (no eligibility submission on file) fails 409 ERR_CANDIDATE_NOT_IN_REVIEW."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate A REGISTERED."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
          trigger:
            - call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_CANDIDATE_NOT_IN_REVIEW"
            - "Candidate.${cand_a}.status == REGISTERED (unchanged)"

      - name: verify_eligibility_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Candidate.ELIGIBILITY_REVIEW_to_ELIGIBLE
          - errors[ERR_CANDIDATE_NOT_IN_REVIEW]
        distinguishing_aspect: "Repeating the APPROVE decision after it already fired fails 409 — the ELIGIBILITY_REVIEW -> ELIGIBLE edge is consumed exactly once."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate A ELIGIBLE (evidence submitted and approved)."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
          trigger:
            - call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "second verify returns 409 ERR_CANDIDATE_NOT_IN_REVIEW; candidate remains ELIGIBLE"

      - name: submit_eligibility_when_already_eligible_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Candidate.REGISTERED_to_ELIGIBILITY_REVIEW
          - errors[ERR_CANDIDATE_NOT_SUBMITTABLE]
        distinguishing_aspect: "submit-eligibility is accepted only from REGISTERED or ELIGIBILITY_DENIED; from ELIGIBLE it fails 409 ERR_CANDIDATE_NOT_SUBMITTABLE."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate A ELIGIBLE."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
          trigger:
            - call: "POST /candidates/${cand_a}/submit-eligibility"
              payload: { license_document_ref: "lic-a2.pdf", employer_verification_ref: "emp-a2.pdf" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_CANDIDATE_NOT_SUBMITTABLE"
            - "Candidate.${cand_a}.status == ELIGIBLE (unchanged)"

      - name: eligibility_approve_with_two_years_rejected_three_passes
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Candidate.ELIGIBILITY_REVIEW_to_ELIGIBLE
          - errors[ERR_EXPERIENCE_REQUIREMENT_NOT_MET]
        distinguishing_aspect: "MIN_TEACHING_YEARS boundary: years_experience 2 fails the APPROVE with 422 ERR_EXPERIENCE_REQUIREMENT_NOT_MET (candidate stays ELIGIBILITY_REVIEW); years_experience 3 approves."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate Y2 (years_experience 2) and candidate Y3 (years_experience 3) both in ELIGIBILITY_REVIEW."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Cand Two", email: "y2@x.com", license_number: "LIC-Y2", license_state: "NM", district_code: "D-100", years_experience: 2 }
              as: Anonymous
              captures: { cy2: $.data.id }
            - call: "POST /candidates/${cy2}/submit-eligibility"
              payload: { license_document_ref: "lic-y2.pdf", employer_verification_ref: "emp-y2.pdf" }
              as: Candidate
              as_user_id: "${cy2}"
            - call: "POST /candidates"
              payload: { full_name: "Cand Three", email: "y3@x.com", license_number: "LIC-Y3", license_state: "NM", district_code: "D-100", years_experience: 3 }
              as: Anonymous
              captures: { cy3: $.data.id }
            - call: "POST /candidates/${cy3}/submit-eligibility"
              payload: { license_document_ref: "lic-y3.pdf", employer_verification_ref: "emp-y3.pdf" }
              as: Candidate
              as_user_id: "${cy3}"
          trigger:
            - call: "POST /candidates/${cy2}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /candidates/${cy3}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
              captures: { y3_status: $.data.status }
          assert:
            - "years 2: 422 ERR_EXPERIENCE_REQUIREMENT_NOT_MET and Candidate.${cy2}.status stays ELIGIBILITY_REVIEW"
            - "years 3 (exactly MIN_TEACHING_YEARS): 200 and Candidate.${cy3}.status == ELIGIBLE"

      - name: cycle_scoring_skip_from_draft_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CertificationCycle.DRAFT_to_OPEN
          - errors[ERR_INVALID_CYCLE_TRANSITION]
        distinguishing_aspect: "DRAFT -> SCORING skips OPEN and is rejected 409 ERR_INVALID_CYCLE_TRANSITION; the linear cycle machine admits only the declared edges."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 in DRAFT."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
          trigger:
            - call: "POST /cycles/${cyc_id}/transition"
              payload: { to: "SCORING" }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_INVALID_CYCLE_TRANSITION"
            - "CertificationCycle.${cyc_id}.status == DRAFT (unchanged)"

      - name: cycle_scoring_before_window_close_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CertificationCycle.OPEN_to_SCORING
          - errors[ERR_CYCLE_WINDOW_STILL_OPEN]
        distinguishing_aspect: "OPEN -> SCORING while the logical clock (2027-01-10) is before submission_window_close (2027-03-01) fails 422 ERR_CYCLE_WINDOW_STILL_OPEN."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
          trigger:
            - call: "POST /cycles/${cyc_id}/transition"
              payload: { to: "SCORING" }
              as: BoardAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_CYCLE_WINDOW_STILL_OPEN"
            - "CertificationCycle.${cyc_id}.status == OPEN (unchanged)"

      - name: assessor_skip_training_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Assessor.RECRUITED_to_IN_TRAINING
          - errors[ERR_INVALID_ASSESSOR_TRANSITION]
        distinguishing_aspect: "RECRUITED -> CALIBRATING skips IN_TRAINING and is rejected 409 ERR_INVALID_ASSESSOR_TRANSITION; the system-only CALIBRATED edge is likewise not directly requestable."
        test_recipe:
          setup: ["Clock 2027-01-10; assessor Z RECRUITED."]
          setup_api_calls:
            - *c_clk
            - call: "POST /assessors"
              payload: { full_name: "Reader Z", email: "rz@x.com", home_district_code: "D-900" }
              as: ScoringAdministrator
              captures: { asz: $.data.id }
          trigger:
            - call: "POST /assessors/${asz}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_INVALID_ASSESSOR_TRANSITION"
            - "Assessor.${asz}.status == RECRUITED (unchanged)"

      - name: booking_cancel_twice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AssessmentBooking.BOOKED_to_CANCELLED
          - errors[ERR_BOOKING_NOT_TRANSITIONABLE]
        distinguishing_aspect: "A CANCELLED booking is terminal: the second cancel fails 409 ERR_BOOKING_NOT_TRANSITIONABLE and the seat accounting is untouched by the repeat."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 OPEN; center capacity 5; candidate A ELIGIBLE with IN_PROGRESS CKA submission and a BOOKED booking at 2027-01-20T14:00:00Z."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
            - *c_open
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - *c_elig_submit
            - *c_elig_verify
            - &c_center
              call: "POST /assessment-centers"
              payload: { name: "Center Five", region_code: "NW", slot_capacity: 5 }
              as: BoardAdministrator
              captures: { ctr_id: $.data.id }
            - &c_cka_sub
              call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "CKA" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_cka: $.data.id }
            - &c_cka_book
              call: "POST /bookings"
              payload: { center_id: "${ctr_id}", cycle_id: "${cyc_id}", slot_start_at: "2027-01-20T14:00:00Z" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/transition"
              payload: { to: "CANCELLED" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /bookings/${bk_id}/transition"
              payload: { to: "CANCELLED" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
