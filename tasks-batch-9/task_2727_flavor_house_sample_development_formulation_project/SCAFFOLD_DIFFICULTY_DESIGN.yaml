  - rule_id: resource_temporal_overlap
    instances:
      - name: retention_half_open_adjacency_admitted_then_straddling_aliquot_overflows
        grounds:
          - calculations.retention_slot_occupancy
          - validations[priority=64]
          - validations[priority=66]
          - errors.ERR_CABINET_CAPACITY_EXCEEDED
          - entities.RetentionSample.fields.stored_from
          - entities.RetentionSample.fields.stored_until
        distinguishing_aspect: |
          Resource: RetentionCabinet slots, with HALF-OPEN interval semantics
          [stored_from, stored_until) and AGGREGATE capacity 3. Two 120 g aliquots
          that merely touch at 2026-11-01 both fit, because touching intervals do
          not overlap even though each alone consumes the whole cabinet. A third
          1 g aliquot spanning 2026-10-01 to 2027-01-01 overlaps BOTH of them, so
          its occupancy is 3 + 3 + 1 == 7 against capacity 3 and it is rejected.
          Closed-interval implementations reject the second aliquot; per-interval
          (rather than aggregate) implementations admit the third.
