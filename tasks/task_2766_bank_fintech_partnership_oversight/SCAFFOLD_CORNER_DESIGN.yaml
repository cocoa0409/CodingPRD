            - "alr3_disp == PARTNER_RESPONSE_PENDING"
            - "cyc3_reop == 1"
            - "alr3_disp_after == OPEN and alr3_breaches_after == 1"
            - "Partner.${pa_id}.open_sanctions_alert_count == 0 throughout — the alert_type is STRUCTURING, so no FROZEN predicate is involved"

      - name: wind_down_plan_execute_is_refused_while_any_sibling_batch_is_unfunded
        claim_type: Cross-entity
        grounds:
          - state_machines.WindDownPlan.transitions.APPROVED_to_IN_EXECUTION.preconditions
          - validations.priority_44
          - errors.ERR_UNSETTLED_BATCHES_OUTSTANDING
        distinguishing_aspect: "The gate reads BOTH SettlementBatch dimensions across every sibling batch, so a batch that is MATCHED but still UNFUNDED blocks execution just as hard as one that is FUNDED but UNRECONCILED — and the notice-period clock (priority 69) is checked separately, so a plan whose 30 days have elapsed still reports ERR_UNSETTLED_BATCHES_OUTSTANDING rather than the notice error."
        test_recipe:
          setup:
            - "Partner A LIVE, then terminated into WIND_DOWN. One MATCHED-but-UNFUNDED batch remains. A plan is drafted, submitted and APPROVED with notice_days 30, and the clock is pushed past created_at + 30 days."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_fbo_a_read
            - *q_fbo_seed_8100000
            - *q_res_a_read2
            - *q_res_top_193750
            - *q_batch_1
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8100000 }
              as: InternalAudit
              as_user_id: "ia-erin"
            - &q_terminate_a
              call: "POST /oversight/agreements/${agr_a_id}/terminate"
