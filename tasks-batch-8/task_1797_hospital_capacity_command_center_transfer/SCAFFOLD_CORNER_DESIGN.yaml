              as: SystemAdministrator
              captures: { fb1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B2", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${fb1}", patient_ref: "PF1", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 2 }
              as: CapacityPlanner
              captures: { fc1: $.data.id }
            - call: "POST /cc/capacity-forecasts/${fc1}/publish"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 2 }
              as: CapacityPlanner
              captures: { fc2: $.data.id }
            - call: "POST /cc/capacity-forecasts/${fc1}/publish"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "after creating the second forecast: CapacityForecast.${fc1}.status == SUPERSEDED and ${fc2}.status == PROVISIONAL"
            - "publishing the superseded forecast: HTTP 409 error_id == ERR_FORECAST_INVALID_STATE"

      - name: leave_ama_then_place_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BoardingRecord.placement_status, "errors[ERR_BOARDING_INVALID_STATE]"]
        distinguishing_aspect: "LEFT_AMA is terminal for the placement dimension: place afterwards fails with ERR_BOARDING_INVALID_STATE."
        test_recipe:
          setup: ["Clock at 00:00; facility; ED admission; boarding record OFFERED"]
          setup_api_calls:
