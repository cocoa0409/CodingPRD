  side_effects: []
- method: POST
  path: /programs/interface-certifications/{id}/begin
  description: SCHEDULED -> IN_PROGRESS; clock must be inside window; one IN_PROGRESS per interface
  roles:
  - InterfaceEngineer
  code: 200
  input: []
  output: InterfaceCertification
  side_effects: []
- method: POST
  path: /programs/interface-certifications/{id}/pass
  description: IN_PROGRESS -> PASSED; certifies parent interface; readiness recompute
  roles:
  - AgencyProjectManager
  code: 200
  input: []
  output: InterfaceCertification
  side_effects:
  - parent interface -> CERTIFIED on first pass
  - readiness_score recompute
  - append AuditLogEntry
- method: POST
  path: /programs/interface-certifications/{id}/fail
  description: IN_PROGRESS -> FAILED
  roles:
  - AgencyProjectManager
  code: 200
  input:
  - failure_note
  output: InterfaceCertification
  side_effects: []
- method: POST
  path: /programs/interface-certifications/{id}/retry
  description: FAILED -> SCHEDULED with new window; attempt_no increments
  roles:
  - InterfaceEngineer
  code: 200
  input:
  - window_starts_on
  - window_ends_on
  output: InterfaceCertification
  side_effects:
  - increment attempt_no
- method: POST
  path: /programs/interface-certifications/{id}/cancel
  description: SCHEDULED -> CANCELLED
  roles:
  - InterfaceEngineer
  code: 200
  input: []
  output: InterfaceCertification
  side_effects: []
- method: POST
