  - rule_id: transitive_cascade
    instances:
      - name: dbe_shortfall_cascade
        grounds:
          - state_machines.DBEReport.PENDING_to_SHORTFALL
          - state_machines.Invoice.VERIFIED_to_WITHHELD
          - entities.Contract.fields.dbe_posture
          - calculations.dbe_attainment
        distinguishing_aspect: |
          Depth-3 cascade triggered by DBE adjudication (a different trigger than closeout):
          report SHORTFALL -> contract.dbe_posture NON_COMPLIANT (link 1) -> VERIFIED invoice
          flips WITHHELD (link 2) -> contract.invoiced_total/remaining_value ledger recompute
          caused by the invoice flip (link 3). The reverse COMPLIANT cascade restores all three.
        test_recipe:
          setup:
            - "ACTIVE grant; contract (awarded 500,000, goal 12.50, retainage 0.10) with invoice INV-1 gross 100,000 VERIFIED (invoiced_total 100,000.00, remaining 400,000.00)"
