  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: unused_credit_value_conserved_on_redemption
        grounds:
          - calculations.credit_residual_value
          - entities.UnusedTicketCredit.fields.face_value_cents
          - entities.UnusedTicketCredit.fields.residual_value_cents
          - entities.Booking.fields.credit_applied_cents
        distinguishing_aspect: |
          Conserved quantity = monetary credit value: face_value 250000 == residual 70000 + applied 180000
          after a partial redemption; value is neither created nor destroyed.
        test_recipe:
          setup:
            - "Trip approved; AIR NONREFUNDABLE booking fare 250000 cancelled -> credit face 250000. A new AIR booking fare 180000 (non-overlapping) redeems the credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TravelManager
            - call: "POST /tmc/travel-policies"
              payload: { name: "Global", region: "NA", max_air_class: "BUSINESS", max_hotel_nightly_cents: 40000, advance_purchase_days: 14, requires_manager_approval_over_cents: 100000, requires_exec_approval_over_cents: 500000, exchange_penalty_cents: 15000, credit_validity_days: 365 }
              as: TravelManager
              captures: { pol: $.data.id }
            - call: "POST /tmc/travelers"
              payload: { full_name: "T One", email: "t17@ex.com", grade: "STANDARD", policy_id: "${pol}", home_iata: "JFK" }
              as: TravelManager
              captures: { trav: $.data.id }
            - call: "POST /tmc/vendors"
              payload: { name: "Air Co", vendor_type: "AIR", is_preferred: true, capacity: 10 }
              as: TravelManager
              captures: { ven: $.data.id }
            - call: "POST /tmc/trip-requests"
              payload: { traveler_id: "${trav}", origin: "JFK", destination: "LHR", depart_date: "2026-08-01T09:00:00Z", return_date: "2026-08-20T09:00:00Z", purpose: "biz", market_estimate_cents: 50000 }
              as: Traveler
              as_user_id: "${trav}"
              captures: { trip: $.data.id }
            - call: "POST /tmc/trip-requests/${trip}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v: $.data.version }
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "NONREFUNDABLE", fare_cents: 250000, depart_datetime: "2026-08-01T09:00:00Z", return_datetime: "2026-08-01T20:00:00Z", expected_trip_request_version: "${tr_v}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book1: $.data.id }
            - call: "POST /tmc/bookings/${book1}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
            - call: "GET /tmc/unused-ticket-credits?origin_booking_id=${book1}"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { credit: $.data.0.id }
            - call: "GET /tmc/trip-requests/${trip}"
              payload: {}
              as: Traveler
              as_user_id: "${trav}"
              captures: { tr_v2: $.data.version }
          trigger:
            - call: "POST /tmc/bookings"
              payload: { trip_request_id: "${trip}", vendor_id: "${ven}", segment_type: "AIR", fare_basis: "REFUNDABLE", fare_cents: 180000, redeem_credit_id: "${credit}", depart_datetime: "2026-08-10T09:00:00Z", return_datetime: "2026-08-10T20:00:00Z", expected_trip_request_version: "${tr_v2}" }
              as: Traveler
              as_user_id: "${trav}"
              captures: { book2: $.data.id, applied: $.data.credit_applied_cents }
          assert:
            - "Booking.${book2}.credit_applied_cents == 180000"
            - "UnusedTicketCredit.${credit}.residual_value_cents == 70000"
            - "UnusedTicketCredit.${credit}.status == PARTIALLY_USED"
            - "UnusedTicketCredit.${credit}.face_value_cents == 250000"

      - name: rate_usage_count_conserved_on_cancel
        grounds:
          - calculations.rate_usage_consumption
          - entities.NegotiatedRate.fields.consumed_count
          - entities.NegotiatedRate.fields.cap_usage_count
        distinguishing_aspect: |
          Conserved quantity = discrete usage count: cap_usage_count 2 == remaining + consumed. After two
          bookings consumed=2 (EXHAUSTED); cancelling one restores consumed=1 (remaining=1), sum preserved.
        test_recipe:
          setup:
            - "Rate cap 2. Trip approved; two AIR NONREFUNDABLE bookings (non-overlapping) both consume the rate -> consumed 2, EXHAUSTED."
          setup_api_calls:
