        distinguishing_aspect: "Two string_composition calculations whose outputs are later compared with case-sensitive ==: the marking text interpolates the agency and file number from a different entity plus the numeric voltage from VOLTAGE_MAP (not the enum name), and the traceability code joins the rod lot's heat number to the lot code with a single hyphen."
