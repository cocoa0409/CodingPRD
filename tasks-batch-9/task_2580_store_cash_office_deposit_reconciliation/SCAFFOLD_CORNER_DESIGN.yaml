      - name: change_order_baseline_plan_fills_every_denomination_bucket
        claim_type: waterfall_allocation
        grounds:
          - calculations.change_order_denomination_plan
          - entities.ChangeOrder.fields.planned_lines
          - endpoints["POST /cash-ops/change-orders"]
        distinguishing_aspect: >
          A BASELINE week of 80000 per day over 7 days forecasts 560000 and allocates five buckets in
          descending denomination, each rounded up to whole straps: 6/5/4/12/28 straps giving
          300000 + 125000 + 100000 + 60000 + 28000 = 613000, which deliberately overshoots the forecast
          by 53000.
        test_recipe:
          setup:
            - "Store S-1933 with the default BASELINE seasonal_profile"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1933", name: "Store 1933", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/change-orders"
              payload: { store_id: "${store_id}", target_week_start: "2026-08-10", days_covered: 7, baseline_daily_cash_demand_cents: 80000 }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
          assert:
            - "HTTP status is 201, data.applied_seasonal_profile == \"BASELINE\", data.growth_pct == 0, data.status == \"DRAFT\""
            - "data.forecast_demand_cents == 560000"
            - "data.planned_lines has exactly 5 entries in descending denomination_cents order: 2000, 1000, 500, 100, 25"
            - "line 2000: strap_count == 6, units == 150, planned_cents == 300000"
            - "line 1000: strap_count == 5, units == 125, planned_cents == 125000"
            - "line 500: strap_count == 4, units == 200, planned_cents == 100000"
            - "line 100: strap_count == 12, units == 600, planned_cents == 60000"
            - "line 25: strap_count == 28, units == 1120, planned_cents == 28000"
            - "data.total_planned_cents == 613000 and data.received_amount_cents == null"

      - name: bank_reconciliation_excludes_provisional_and_nets_adjustment
        claim_type: constraint_propagation
        grounds:
