# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3112_therapist_network_credentialing_insurance_billed_session_payouts
#
# Breadth probe over claim-extraction-guide sections. Corners already exercised
# by a §1.8 instance appear as `excluded_because:` stubs with no test_recipe.
# §1.5 bases are anchored once and reused; every ${var} still resolves through a
# captures block earlier in the same instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: clinician_create_returns_system_fields_and_starts_onboarding
        claim_type: Creation
        grounds:
          - entities.Clinician
          - endpoints.POST_/network/clinicians
          - state_machines.Clinician.status
        distinguishing_aspect: "A clinician created with only the six onboarding inputs comes back 201 with status ONBOARDING, billing_posture GATED and zeroed counters, and the onboarding instant is stamped from the configured logical clock rather than from a created_at the caller supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /network/clinicians"
              payload: { full_name: "Avery Lin", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 5, availability_blocks: [{ weekday: 3, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { clinician_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Clinician.${clinician_id}.status == ONBOARDING and Clinician.${clinician_id}.billing_posture == GATED"
            - "Clinician.${clinician_id}.version == 1"
            - "Clinician.${clinician_id}.onboarded_at == 2026-01-05T00:00:00Z"
            - "Clinician.${clinician_id}.active_patient_count == 0, enrolled_payer_count == 0, continuity_plan_count == 0 and payout_balance_cents == 0"
            - "Clinician.${clinician_id}.open_slot_count == 600, being the single 480-to-1080 minute block"
            - "Clinician.${clinician_id}.offboarding_requested_on is null and cash_basis_opt_in == false"

      - name: license_get_returns_the_stored_verification_state_and_attempt_count
        claim_type: Retrieval
        grounds:
          - entities.License
          - endpoints.GET_/network/clinicians/{id}/licenses
        distinguishing_aspect: "Every License field round-trips through the clinician-scoped list, including the three computed verification fields, and a freshly recorded license reports UNVERIFIED with a zero attempt count and a null verifier rather than reusing the creating user."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z."
            - "One clinician on file with no licenses yet."
          setup_api_calls:
            - *c_clock
            - &c_clinician
              call: "POST /network/clinicians"
              payload: { full_name: "Avery Lin", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 5, availability_blocks: [{ weekday: 3, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { clinician_id: $.data.id }
            - &c_license
              call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-55401", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { license_id: $.data.id }
          trigger:
            - call: "GET /network/clinicians/${clinician_id}/licenses"
              payload: { verification_status: "UNVERIFIED", limit: 10, offset: 0 }
              as: OpsAdmin
          assert:
            - "the response status is 200 and exactly 1 row is returned"
            - "License.${license_id}.license_number == \"LCSW-CA-55401\" and issuing_state == CA"
            - "License.${license_id}.expires_on == 2027-06-30T00:00:00Z and telehealth_eligible == true"
            - "License.${license_id}.verification_status == UNVERIFIED, verified_at is null and verified_by_user_id is null"
            - "License.${license_id}.verification_attempts == 0"
            - "License.${license_id}.clinician_id == ${clinician_id}"

      - name: payers_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/network/payers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three payers on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the remaining row with has_more false, and a status filter narrows total_count to the whole filtered set rather than to the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Three payers, one of which is then suspended."
          setup_api_calls:
            - *c_clock
            - &c_payer
              call: "POST /network/payers"
              payload: { payer_name: "Cascade Health Plan", payer_code: "CHP", delegated_credentialing: true, min_malpractice_coverage_cents: 100000000, timely_filing_days: 90, credentialing_sla_days: 14, allowed_cpt_codes: ["90837"] }
              as: OpsAdmin
              captures: { payer_id: $.data.id }
            - &c_payer_b
              call: "POST /network/payers"
              payload: { payer_name: "Blue Ridge Assurance", payer_code: "BRA", delegated_credentialing: false, min_malpractice_coverage_cents: 200000000, timely_filing_days: 60, credentialing_sla_days: 30, allowed_cpt_codes: ["90837", "90834"] }
              as: OpsAdmin
              captures: { payer_b_id: $.data.id }
            - &c_payer_c
              call: "POST /network/payers"
              payload: { payer_name: "Summit Mutual Benefit", payer_code: "SMB", delegated_credentialing: true, min_malpractice_coverage_cents: 300000000, timely_filing_days: 120, credentialing_sla_days: 10, allowed_cpt_codes: ["90837"] }
              as: OpsAdmin
              captures: { payer_c_id: $.data.id }
            - call: "PATCH /network/payers/${payer_c_id}"
              payload: { status: "SUSPENDED_AT_PAYER" }
              as: OpsAdmin
          trigger:
            - call: "GET /network/payers"
              payload: { limit: 2, offset: 0 }
              as: OpsAdmin
            - call: "GET /network/payers"
              payload: { status: "ACTIVE", limit: 10, offset: 0 }
              as: OpsAdmin
          assert:
            - "the first call returns status 200 and response_type array with exactly 2 rows, total_count == 3 and has_more == true"
            - "GET /network/payers?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "the status-filtered call returns exactly 2 rows with total_count == 2, so total_count counts the filtered set"
            - "GET /network/payers with no query parameters returns 3 rows, with limit defaulting to 10 and offset to 0"
            - "GET /network/payers?delegated_credentialing=true returns exactly 2 rows — the two payers whose flag is true — since the suspension did not change that flag"

      - name: claim_get_with_an_unknown_id_returns_claim_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/network/claims/{id}
          - errors.ERR_CLAIM_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_CLAIM_NOT_FOUND rather than a generic not-found code or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. No claim has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /network/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CLAIM_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "error_id != ERR_SESSION_NOT_FOUND and error_id != ERR_INVALID_REQUEST"

      - name: session_create_without_modality_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Session.fields.modality
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/network/sessions
        distinguishing_aspect: "modality is a required input, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check rather than any of the state or business gates that a present-but-invalid value would reach."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; a clinician and a patient on file."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
            - &c_patient
              call: "POST /network/patients"
              payload: { full_name: "Jordan Pike", member_id: "MBR-7001", payer_id: "${payer_id}", plan_code: "PPO-1500", state_code: "CA", deductible_cents: 100000, coinsurance_rate: 0.20, oop_max_cents: 200000 }
              as: OpsAdmin
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "${patient_id}", scheduled_start: "2026-06-03T16:00:00Z", scheduled_end: "2026-06-03T17:00:00Z", cpt_code: "90837" }
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_CLINICIAN_NOT_FOUND and error_id != ERR_PATIENT_NOT_FOUND"
            - "GET /network/sessions?patient_id=${patient_id} returns 0 rows"

      - name: patient_create_omitting_optional_flags_defaults_cash_basis_off
        claim_type: Defaults
        grounds:
          - entities.PatientClient.fields.oop_met_cents
          - entities.PatientClient.fields.visit_count_year
          - endpoints.POST_/network/patients
        distinguishing_aspect: "cash_basis_opt_in and oop_met_cents each carry a declared default, so omitting both stores false and 0 rather than null, and the derived out-of-pocket room therefore reads the full maximum."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one payer on file."
          setup_api_calls:
            - *c_clock
            - *c_payer
          trigger:
            - call: "POST /network/patients"
              payload: { full_name: "Jordan Pike", member_id: "MBR-7001", payer_id: "${payer_id}", plan_code: "PPO-1500", state_code: "CA", deductible_cents: 100000, coinsurance_rate: 0.20, oop_max_cents: 200000 }
              as: OpsAdmin
              captures: { patient_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PatientClient.${patient_id}.oop_met_cents == 0, the declared default, rather than null"
            - "PatientClient.${patient_id}.visit_count_year == 0"
            - "PatientClient.${patient_id}.matched_clinician_id is null and swap_requested == false"
            - "PatientClient.${patient_id}.benefit_status == UNVERIFIED"

      - name: session_quoted_cost_share_is_computed_and_ignores_a_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.Session.fields.quoted_cost_share_cents
          - calculations.patient_cost_share_cents.variants.provisional_quote
          - calculations.resolved_session_rate_cents
          - endpoints.POST_/network/sessions/{id}/schedule
        distinguishing_aspect: "quoted_cost_share_cents is source computed, so the provisional quote of 4900 cents produced by the formula wins over the 99999 a client supplies, and the value is not recomputed by any later read."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; base payer, rate and clinician setup so the session on 2026-06-03T16:00:00Z is past the 90-day new-clinician window."
            - "The patient's VERIFIED snapshot reports deductible_remaining_cents 0, coinsurance_rate 0.20, copay_cents 3000 and oop_remaining_cents 200000, and the patient's deductible_cents is 100000."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - &c_rate
              call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - &c_enroll
              call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
              captures: { enrollment_id: $.data.id }
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - &c_verification
              call: "POST /network/patients/${patient_id}/verification"
              payload: { deductible_remaining_cents: 0, coinsurance_rate: 0.20, copay_cents: 3000, oop_remaining_cents: 200000 }
              as: OpsAdmin
            - &c_session
              call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "${patient_id}", scheduled_start: "2026-06-03T16:00:00Z", scheduled_end: "2026-06-03T17:00:00Z", cpt_code: "90837", modality: "VIDEO" }
              as: OpsAdmin
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version, quoted: $.data.quoted_cost_share_cents }
          assert:
            - "${quoted} == 4900"
            - "Session.${session_id}.quoted_cost_share_cents != 99999, so the computed value overrides any supplied field"
            - "Session.${session_id}.status == SCHEDULED and slot_consumed == true"
            - "the quote uses the snapshot basis: d = min(12000, 0) = 0, coins = round_half_up(12000 * 0.20) = 2400, raw = 0 + 2400 + 3000 - 500 = 4900"
            - "GET /network/sessions/${session_id} still reports quoted_cost_share_cents == 4900 after the version has advanced to ${session_v1}"

      - name: clinician_create_ignores_a_supplied_status_and_version
        claim_type: System Fields
        grounds:
          - entities.Clinician.fields.status
          - entities.Clinician.fields.version
          - endpoints.POST_/network/clinicians
        distinguishing_aspect: "status and version are source system, so a client that sends status ACTIVE and version 42 creates an ONBOARDING row at version 1 — neither supplied value is honoured."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /network/clinicians"
              payload: { full_name: "Avery Lin", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 5, availability_blocks: [{ weekday: 3, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { clinician_id: $.data.id }
          assert:
            - "Clinician.${clinician_id}.status == ONBOARDING, not ACTIVE"
            - "Clinician.${clinician_id}.version == 1, not 42"
            - "Clinician.${clinician_id}.billing_posture == GATED, not BILLABLE"
            - "the response carries a server-minted id that is not the string sent in any payload field, and created_at equals updated_at"
            - "Clinician.${clinician_id}.onboarded_at is the logical clock instant, not the wall-clock time"

      - name: clinician_create_with_an_out_of_enum_license_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Clinician.fields.license_type
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/network/clinicians
        distinguishing_aspect: "license_type is a closed six-member enum that drives rate resolution, so a value such as RN is rejected at 400 ERR_INVALID_REQUEST rather than persisting a clinician who can never resolve a rate row."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /network/clinicians"
              payload: { full_name: "Avery Lin", license_type: "RN", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 5, availability_blocks: [{ weekday: 3, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /network/clinicians returns 0 rows"
            - "the accepted members are exactly LCSW, LMFT, LPC, LMHC, PSY_D and PHD; RN and LCAT are not among them"

      - name: session_create_checks_body_foreign_keys_left_to_right
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - endpoints.POST_/network/sessions
          - errors.ERR_CLINICIAN_NOT_FOUND
          - errors.ERR_PATIENT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology places both foreign keys in the request body and priority 3 checks them in the order the endpoint declares, so with both ids unknown the answer is ERR_CLINICIAN_NOT_FOUND while with only the patient id unknown it is ERR_PATIENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; a clinician and a patient on file."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
            - *c_patient
          trigger:
            - call: "POST /network/sessions"
              payload: { clinician_id: "00000000-0000-4000-8000-000000000001", patient_id: "00000000-0000-4000-8000-000000000002", scheduled_start: "2026-06-03T16:00:00Z", scheduled_end: "2026-06-03T17:00:00Z", cpt_code: "90837", modality: "VIDEO" }
              as: OpsAdmin
              captures: { error_both: $.data.error_id }
            - call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "00000000-0000-4000-8000-000000000002", scheduled_start: "2026-06-03T16:00:00Z", scheduled_end: "2026-06-03T17:00:00Z", cpt_code: "90837", modality: "VIDEO" }
              as: OpsAdmin
              captures: { error_patient: $.data.error_id }
          assert:
            - "the first request returns 404 and ${error_both} == ERR_CLINICIAN_NOT_FOUND"
            - "${error_both} != ERR_PATIENT_NOT_FOUND"
            - "the second request returns 404 and ${error_patient} == ERR_PATIENT_NOT_FOUND"
            - "GET /network/sessions?clinician_id=${clinician_id} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: license_verify_stamps_the_verifier_and_returns_the_license_to_verified
        claim_type: Valid Transition
        grounds:
          - state_machines.License.transitions.UNVERIFIED_to_VERIFIED
          - endpoints.POST_/network/clinicians/{clinician_id}/licenses/{id}/verify
          - entities.License.fields.verified_by_user_id
        distinguishing_aspect: "A successful verification moves UNVERIFIED to VERIFIED and stamps the three derived fields from the logical clock and the acting header, and the license then reports attempts one with a non-null verifier."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician with an unverified license expiring 2027-06-30."
          setup_api_calls:
            - *c_clock
            - *c_clinician
            - *c_license
          trigger:
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the response status is 200 and the license returns verification_status == VERIFIED"
            - "License.${license_id}.verified_at == 2026-01-05T00:00:00Z, taken from the logical clock rather than wall-clock time"
            - "License.${license_id}.verified_by_user_id is non-null and equals the X-User-ID header of the ComplianceOfficer call"
            - "License.${license_id}.verification_attempts == 1"
            - "Clinician.${clinician_id}.billing_posture is still GATED, because the malpractice policy and enrollment are still missing"

      - name: license_verify_with_an_already_expired_license_records_failed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.License.transitions.UNVERIFIED_to_FAILED
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/network/clinicians/{clinician_id}/licenses/{id}/verify
        distinguishing_aspect: "The same verify endpoint branches on the clock: a license whose expires_on is at or before the logical clock records FAILED rather than raising an error, while the ascending UNVERIFIED-to-VERIFIED transition stays unreachable for that row."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician. The license is recorded afterwards with expires_on 2025-12-31T00:00:00Z, already past."
          setup_api_calls:
            - *c_clock
            - *c_clinician
            - call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-55409", license_type: "LCSW", issuing_state: "CA", expires_on: "2025-12-31T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { license_id: $.data.id }
          trigger:
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the response status is 200 and verification_status == FAILED"
            - "verification_status != VERIFIED, because the expiry is not strictly after the clock"
            - "License.${license_id}.verification_attempts == 1 and verified_at is null"
            - "the derived read reports FAILED: License.${license_id}.verification_status == FAILED with a null verified_at"
            - "Clinician.${clinician_id}.billing_posture == GATED after the failed attempt"

      - name: license_reset_verification_returns_failed_to_unverified_without_touching_the_attempt_count
        claim_type: Valid Transition
        grounds:
          - state_machines.License.transitions.FAILED_to_UNVERIFIED
          - endpoints.POST_/network/clinicians/{clinician_id}/licenses/{id}/reset-verification
        distinguishing_aspect: "The reset path moves FAILED back to UNVERIFIED while deliberately leaving verification_attempts alone, so the retry budget reflects both attempts even though the state reads as freshly recorded."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; a clinician and a license expiring 2025-12-31 which has already been verified once and recorded FAILED."
          setup_api_calls:
            - *c_clock
            - *c_clinician
            - call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-55409", license_type: "LCSW", issuing_state: "CA", expires_on: "2025-12-31T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { license_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/reset-verification"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { attempts_after: $.data.verification_attempts }
          assert:
            - "the response status is 200 and verification_status == UNVERIFIED"
            - "License.${license_id}.verification_attempts == 1, unchanged by the reset"
            - "License.${license_id}.verified_at is null and verified_by_user_id is null"
            - "a second verify on the still-expired license records FAILED again: ${attempts_after} == 2"
            - "Clinician.${clinician_id}.billing_posture == GATED throughout"

      - name: session_cancel_from_a_completed_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Session.transitions.REQUESTED_to_CANCELLED
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/network/sessions/{id}/cancel
        distinguishing_aspect: "Cancellation is declared only from REQUESTED and SCHEDULED, so a COMPLETED session rejects it with 409 ERR_INVALID_STATE and the billing axis is left untouched for the completed row."
        test_recipe:
          setup:
