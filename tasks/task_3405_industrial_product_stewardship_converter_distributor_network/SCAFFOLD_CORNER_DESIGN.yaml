  # ===========================================================================
  - section: calculations
    instances:
      - name: disclosure_lower_threshold_edge_is_inclusive
        claim_type: Correct Result
        grounds:
          - calculations.required_disclosure_level
          - entities.JurisdictionClearance.fields.required_disclosure_level
        distinguishing_aspect: "max component ppm exactly equal to declaration_threshold_ppm (1000) yields DECLARATION, not EXEMPT — the >= lower edge is inclusive."
        test_recipe:
          setup:
            - "Clock 2026-10-01. DE jurisdiction (1000/10000). Formulation with a REPORTABLE component at exactly 1000 ppm."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - call: "POST /stewardship/substances"
              payload: { cas_number: "64-17-5", name: "Ethanol", restriction_class: "REPORTABLE" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 1000 }
              as: ProductManager
          trigger:
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "DECLARATION" }
              as: ProductManager
              captures: { cl_id: $.data.id }
          assert:
            - "JurisdictionClearance.${cl_id}.required_disclosure_level == DECLARATION (1000 >= 1000)"

      - name: disclosure_upper_threshold_edge_is_full
        claim_type: Correct Result
        grounds:
          - calculations.required_disclosure_level
        distinguishing_aspect: "max component ppm exactly equal to full_disclosure_threshold_ppm (10000) yields FULL_DISCLOSURE, not DECLARATION — upper edge inclusive."
        test_recipe:
          setup:
            - "Clock 2026-10-01. DE jurisdiction (1000/10000). Formulation with a RESTRICTED component at exactly 10000 ppm."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 10000 }
              as: ProductManager
          trigger:
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "FULL_DISCLOSURE" }
              as: ProductManager
              captures: { cl_id: $.data.id }
          assert:
            - "JurisdictionClearance.${cl_id}.required_disclosure_level == FULL_DISCLOSURE (10000 >= 10000)"

      - name: prohibited_substance_blocks_clearance_submission
        claim_type: "Violation → Error"
        grounds:
          - calculations.required_disclosure_level
          - validations[priority=9]
          - errors.ERR_SUBSTANCE_PROHIBITED
        distinguishing_aspect: "A formulation carrying a PROHIBITED-class component at > 0 ppm can never enter regulatory review: POST /clearances fails 422 ERR_SUBSTANCE_PROHIBITED before required_disclosure_level is even computed."
        test_recipe:
          setup:
            - "Clock 2026-10-01. DE jurisdiction. Formulation with a PROHIBITED component at 50 ppm."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - call: "POST /stewardship/substances"
              payload: { cas_number: "1332-21-4", name: "Asbestos", restriction_class: "PROHIBITED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 50 }
              as: ProductManager
          trigger:
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "FULL_DISCLOSURE" }
              as: ProductManager
              captures: { proh_err: $.data.error_id }
          assert:
            - "422 error_id == ERR_SUBSTANCE_PROHIBITED (actual ${proh_err})"
            - "GET /clearances?formulation_id=${f_id} returns 0 rows (nothing persisted)"

      - name: disclosure_insufficient_blocks_clear_decision
        claim_type: "Violation → Error"
        grounds:
          - validations[priority=10]
          - errors.ERR_DISCLOSURE_INSUFFICIENT
        distinguishing_aspect: "rank(package) < rank(required) blocks only the CLEARED decision: with required DECLARATION and package EXEMPT, decision=CLEARED fails 422 ERR_DISCLOSURE_INSUFFICIENT while the same clearance can still be decided CHANGES_REQUESTED."
        test_recipe:
          setup:
            - "Clock 2026-10-01. DE (1000/10000). Formulation with RESTRICTED 5000ppm (required DECLARATION); clearance submitted with package EXEMPT."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - call: "POST /stewardship/substances"
              payload: { cas_number: "50-00-0", name: "Formaldehyde", restriction_class: "RESTRICTED" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /stewardship/formulation-components"
              payload: { formulation_id: "${f_id}", substance_id: "${s1}", concentration_ppm: 5000 }
              as: ProductManager
            - call: "POST /stewardship/clearances"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", disclosure_package_level: "EXEMPT" }
              as: ProductManager
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CLEARED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
              captures: { disc_err: $.data.error_id }
            - call: "POST /stewardship/clearances/${cl_id}/decision"
              payload: { decision: "CHANGES_REQUESTED" }
              as: RegulatoryManager
              as_user_id: "rm-1"
          assert:
            - "decision=CLEARED: 422 ERR_DISCLOSURE_INSUFFICIENT (actual ${disc_err}); status stays SUBMITTED"
            - "decision=CHANGES_REQUESTED on the same row succeeds (EXEMPT < DECLARATION only gates CLEARED)"

      - name: adhesion_pass_at_exact_threshold_is_inclusive
        claim_type: Correct Result
        grounds:
          - calculations.adhesion_pass_evaluation
        distinguishing_aspect: "peel_strength exactly equal to the threshold passes (>= inclusive): METAL NOMINAL at 23C with peel 15.0 -> CLOSED_PASS, pass_threshold_applied 15.0."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation; METAL case lab-booked."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - call: "POST /stewardship/application-cases"
              payload: { formulation_id: "${f_id}", customer_ref: "K-X", substrate_class: "METAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
              captures: { case_id: $.data.id }
            - call: "POST /stewardship/application-cases/${case_id}/book-lab"
              payload: { bench_id: "B1", bench_date: "2026-10-05T00:00:00Z", bench_hours: 1.0 }
              as: TechnicalEngineer
              as_user_id: "te-1"
          trigger:
            - call: "POST /stewardship/application-cases/${case_id}/record-result"
              payload: { peel_strength_n_per_25mm: 15.0, test_temp_c: 23, test_standard: "NOMINAL" }
              as: TechnicalEngineer
              as_user_id: "te-1"
          assert:
            - "ApplicationCase.${case_id}.status == CLOSED_PASS and pass_threshold_applied == 15.0"

      - name: channel_floor_rejects_below_and_admits_above
        claim_type: Constants Applied
        grounds:
          - calculations.channel_price_floor
          - errors.ERR_CHANNEL_FLOOR_VIOLATION
          - constants.CHANNEL_MARGIN_MIN_PCT
        distinguishing_aspect: "Floor = converter unit price at qty 1 (10000 x 0.82 = 8200c) x 1.08 = 8856c: a distributor PREFERRED agreement at base 10000 (worst-case unit 8800c) is rejected, one at base 10100 (unit 8888c) is admitted, and with NO overlapping converter agreement no floor applies at all."
        test_recipe:
          setup:
            - "Clock 2026-10-01. ACTIVE formulation in DE; converter (APPLIED is enough — agreement creation is not gated on converter status) with CONVERTER_AUTHORIZED agreement base 10000c window [2026-10-01, 2027-06-01). Distributor onboarded."
          setup_api_calls:
            - *k_clock
            - *k_jur
            - *k_form
            - *k_clear
            - *k_decide
            - call: "POST /stewardship/converters"
              payload: { name: "ConvertOne GmbH", home_territory_code: "DE" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { conv_id: $.data.id }
            - *k_dist
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", converter_id: "${conv_id}", tier: "CONVERTER_AUTHORIZED", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agc_id: $.data.id }
          trigger:
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "DISTRIBUTOR_PREFERRED", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { floor_err: $.data.error_id }
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", distributor_id: "${dist_id}", tier: "DISTRIBUTOR_PREFERRED", base_price_cents: 10100, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agd_ok: $.data.id }
          assert:
            - "base 10000 distributor agreement: 422 ERR_CHANNEL_FLOOR_VIOLATION (actual ${floor_err}); 10000 x (1-0.12) = 8800 < 8856"
            - "base 10100 distributor agreement: 201 created (${agd_ok}); 10100 x 0.88 = 8888 >= 8856"

