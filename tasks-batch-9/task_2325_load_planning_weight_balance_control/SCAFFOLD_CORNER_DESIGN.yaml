          - endpoints[GET /pax-lines/{id}]
          - endpoints[GET /pax-lines]
          - endpoints[DELETE /pax-lines/{id}]
        distinguishing_aspect: |
          The passenger line is the only entity with a full create / read /
          list / delete surface, and deletion is a real removal rather than a
          status flip: DELETE answers 204 with no body, the subsequent detail
          read is 404 ERR_PAX_LINE_NOT_FOUND, the filtered list drops back to
