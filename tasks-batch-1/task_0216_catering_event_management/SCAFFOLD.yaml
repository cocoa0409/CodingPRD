        type: string
        source: input
        description: "FK -> Client.id; the client who owns this order."
      - name: package_id
        type: string
        source: input
        description: "FK -> EventPackage.id; the menu package ordered."
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; where the event is held (tax/service-fee jurisdiction)."
      - name: route_id
        type: string
        source: input
        description: "FK -> ServiceRoute.id; the multi-stop route this order's delivery legs ride on. Null until a delivery leg is created."
        default: null
      - name: booked_headcount
        type: integer
        source: input
        description: "Guest count at booking/confirmation time; drives the provisional charge."
        constraints: ">= EventPackage.min_headcount"
      - name: guaranteed_headcount
        type: integer
        source: input
