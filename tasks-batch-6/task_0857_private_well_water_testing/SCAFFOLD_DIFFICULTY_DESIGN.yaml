# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >= 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: nitrate_provisional_vs_confirmed_diverge
        grounds:
          - calculations.sample_advisory_level
          - entities.SampleResult.fields.advisory_level_provisional
          - entities.SampleResult.fields.advisory_level_confirmed
        distinguishing_aspect: "For the SAME second sample (nitrate 8.0), PROVISIONAL (this-sample-only) is ADVISORY while CONFIRMED (2-sample running average with a prior 12.0 sample = 10.0) is UNSAFE; water-quality domain."
        test_recipe:
          setup:
            - "ACTIVE well with a DOMESTIC/HIGH aquifer, one prior RESULTED sample nitrate 12.0, and a second sample in IN_ANALYSIS."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-DV1", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Ann Owner", email: "ann@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-1", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.0, longitude: -118.2, parcel_apn: "APN-DV1", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["NITRATE"], collected_on: "2026-05-02T00:00:00Z", chain_of_custody_id: "COC-1" }, as: Applicant, as_user_id: "${app}", captures: { ws1: "$.data.id" } }
            - { call: "POST /water-samples/${ws1}/receive", payload: {}, as: LabAnalyst }
            - { call: "POST /water-samples/${ws1}/begin-analysis", payload: {}, as: LabAnalyst }
            - { call: "POST /sample-results", payload: { water_sample_id: "${ws1}", bacteria_coliform: "ABSENT", ecoli: "ABSENT", nitrate_mg_l: 12.0, lead_ppb: 2.0, analyzed_on: "2026-05-03T00:00:00Z" }, as: LabAnalyst, captures: { sr1: "$.data.id" } }
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["NITRATE"], collected_on: "2026-05-05T00:00:00Z", chain_of_custody_id: "COC-2" }, as: Applicant, as_user_id: "${app}", captures: { ws2: "$.data.id" } }
            - { call: "POST /water-samples/${ws2}/receive", payload: {}, as: LabAnalyst }
            - { call: "POST /water-samples/${ws2}/begin-analysis", payload: {}, as: LabAnalyst }
          trigger:
            - { call: "POST /sample-results", payload: { water_sample_id: "${ws2}", bacteria_coliform: "ABSENT", ecoli: "ABSENT", nitrate_mg_l: 8.0, lead_ppb: 2.0, analyzed_on: "2026-05-06T00:00:00Z" }, as: LabAnalyst, captures: { sr2: "$.data.id" } }
          assert:
            - "SampleResult.${sr2}.advisory_level_provisional == ADVISORY"
            - "SampleResult.${sr2}.advisory_level_confirmed == UNSAFE"

      - name: permit_fee_estimate_vs_final_reconcile
        grounds:
          - calculations.permit_fee
          - entities.ConstructionPermit.fields.fee_estimate_cents
          - entities.ConstructionPermit.fields.fee_final_cents
          - entities.Applicant.fields.net_fees_paid_cents
        distinguishing_aspect: "ESTIMATE from proposed_depth 250 (tier2) = 35000 diverges from FINAL from total_depth 320 (tier3) = 50000; permit-fee domain (distinct from the water-quality dual variant), and the +15000 delta reconciles Applicant.net_fees_paid_cents."
        test_recipe:
          setup:
            - "A paid, approved, issued permit (estimate 35000 charged) about to be completed by a driller log at depth 320."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-DV2", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Bob Owner", email: "bob@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-2", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.1, longitude: -118.3, parcel_apn: "APN-DV2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
          trigger:
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
          assert:
            - "ConstructionPermit.${cp}.fee_estimate_cents == 35000"
            - "ConstructionPermit.${cp}.fee_final_cents == 50000"
            - "Applicant.${app}.net_fees_paid_cents == 50000"

  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_nonlinear_multi_input_mode_a
        grounds:
          - calculations.permit_fee
          - entities.ConstructionPermit.fields.fee_estimate_cents
          - entities.Well.fields.intended_use
          - entities.Aquifer.fields.sensitivity
        distinguishing_aspect: "Mode (a): fee_estimate = round(depth_base(250)=25000 * IRRIGATION 1.2) + MODERATE surcharge 5000 + expedite 20000 = 55000, a non-linear composition of >=3 inputs (depth tier, use multiplier, aquifer surcharge, expedite)."
        test_recipe:
          setup:
            - "An IRRIGATION well on a MODERATE aquifer; a permit submitted with proposed_depth 250 and expedite true."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-CF1", sensitivity: "MODERATE", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Cara Owner", email: "cara@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-3", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 35.0, longitude: -119.0, parcel_apn: "APN-CF1", intended_use: "IRRIGATION" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
          trigger:
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z", expedite: true }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
          assert:
            - "ConstructionPermit.${cp}.fee_estimate_cents == 55000"

      - name: panel_fee_round_per_analyte_then_sum_mode_b
        grounds:
          - calculations.panel_fee
          - entities.WaterSample.fields.panel_fee_cents
          - entities.WaterSample.fields.requested_analytes
        distinguishing_aspect: "Mode (b): round-per-analyte-then-sum gives 3225+2688+4838 = 10751, NOT the sum-then-round value 10750; the pinned rounding order is decisive."
        test_recipe:
          setup:
            - "An ACTIVE well; a water sample requesting all three analytes."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-CF2", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Dan Owner", email: "dan@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-4", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.2, longitude: -118.4, parcel_apn: "APN-CF2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
          trigger:
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["BACTERIA", "NITRATE", "LEAD"], collected_on: "2026-05-12T00:00:00Z", chain_of_custody_id: "COC-CF2" }, as: Applicant, as_user_id: "${app}", captures: { ws: "$.data.id" } }
          assert:
            - "WaterSample.${ws}.panel_fee_cents == 10751"

  - rule_id: non_linear_state_machine
    instances:
      - name: well_registry_and_potability_evolve_independently
        grounds:
          - state_machines.Well.PERMITTED_to_ACTIVE
          - state_machines.Well.UNKNOWN_to_POTABLE
          - entities.Well.fields.registry_status
          - entities.Well.fields.potability_status
        distinguishing_aspect: "Parallel dimensions on Well: after a SAFE result the potability_status moves UNKNOWN->POTABLE while registry_status stays ACTIVE — the two axes advance independently on the same row."
        test_recipe:
          setup:
            - "An ACTIVE well; a SAFE sample in IN_ANALYSIS."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-NL1", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Eve Owner", email: "eve@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-5", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.3, longitude: -118.5, parcel_apn: "APN-NL1", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["NITRATE"], collected_on: "2026-05-12T00:00:00Z", chain_of_custody_id: "COC-NL1" }, as: Applicant, as_user_id: "${app}", captures: { ws: "$.data.id" } }
            - { call: "POST /water-samples/${ws}/receive", payload: {}, as: LabAnalyst }
            - { call: "POST /water-samples/${ws}/begin-analysis", payload: {}, as: LabAnalyst }
          trigger:
            - { call: "POST /sample-results", payload: { water_sample_id: "${ws}", bacteria_coliform: "ABSENT", ecoli: "ABSENT", nitrate_mg_l: 2.0, lead_ppb: 2.0, analyzed_on: "2026-05-13T00:00:00Z" }, as: LabAnalyst, captures: { sr: "$.data.id" } }
          assert:
            - "Well.${well}.registry_status == ACTIVE"
            - "Well.${well}.potability_status == POTABLE"
            - "SampleResult.${sr}.advisory_level_confirmed == SAFE"

      - name: contamination_case_cyclic_reopen
        grounds:
          - state_machines.ContaminationCase.RESOLVED_to_INVESTIGATING
          - state_machines.ContaminationCase.MITIGATION_to_RESOLVED
          - entities.ContaminationCase.fields.status
        distinguishing_aspect: "Cyclic machine on ContaminationCase: a RESOLVED case reopens to INVESTIGATING (RESOLVED->INVESTIGATING), a backward edge no linear pipeline permits; distinct entity from the parallel Well machine."
        test_recipe:
          setup:
            - "A manually-opened contamination case advanced to RESOLVED."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-NL2", sensitivity: "LOW", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Finn Owner", email: "finn@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 36.0, longitude: -120.0, parcel_apn: "APN-NL2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /contamination-cases", payload: { well_id: "${well}", severity: "HIGH" }, as: HealthOfficer, as_user_id: "officer-1", captures: { cc: "$.data.id" } }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "INVESTIGATING" }, as: HealthOfficer, as_user_id: "officer-1" }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "MITIGATION" }, as: HealthOfficer, as_user_id: "officer-1" }
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "RESOLVED" }, as: HealthOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /contamination-cases/${cc}/transition", payload: { to_status: "INVESTIGATING" }, as: HealthOfficer, as_user_id: "officer-1" }
          assert:
            - "ContaminationCase.${cc}.status == INVESTIGATING"

  - rule_id: transitive_cascade
    instances:
      - name: unsafe_result_cascade_result_sample_case_well_advisory
        grounds:
          - state_machines.WaterSample.IN_ANALYSIS_to_RESULTED
          - state_machines.ContaminationCase.OPEN_to_OPEN
          - entities.Well.fields.potability_status
          - entities.Well.fields.active_advisory_count
        distinguishing_aspect: "Depth-3 chain triggered by POST /sample-results: result -> WaterSample RESULTED -> auto-open ContaminationCase -> Well UNSAFE + auto-issued Advisory (active_advisory_count 0->1); each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "An ACTIVE well (potability UNKNOWN, active_advisory_count 0) with a sample in IN_ANALYSIS."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-TC1", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Gia Owner", email: "gia@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-6", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.4, longitude: -118.6, parcel_apn: "APN-TC1", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
            - { call: "POST /construction-permits/${cp}/issue", payload: {}, as: HealthOfficer }
            - { call: "POST /driller-logs", payload: { construction_permit_id: "${cp}", driller_id: "${dr}", total_depth_ft: 320, static_water_level_ft: 40, casing_depth_ft: 20, grout_type: "BENTONITE", completed_on: "2026-05-11T18:00:00Z" }, as: Driller, as_user_id: "${dr}" }
            - { call: "POST /water-samples", payload: { well_id: "${well}", submitted_by_applicant_id: "${app}", sample_type: "ROUTINE", requested_analytes: ["BACTERIA"], collected_on: "2026-05-12T00:00:00Z", chain_of_custody_id: "COC-TC1" }, as: Applicant, as_user_id: "${app}", captures: { ws: "$.data.id" } }
            - { call: "POST /water-samples/${ws}/receive", payload: {}, as: LabAnalyst }
            - { call: "POST /water-samples/${ws}/begin-analysis", payload: {}, as: LabAnalyst }
          trigger:
            - { call: "POST /sample-results", payload: { water_sample_id: "${ws}", bacteria_coliform: "PRESENT", ecoli: "ABSENT", nitrate_mg_l: 1.0, lead_ppb: 1.0, analyzed_on: "2026-05-13T00:00:00Z" }, as: LabAnalyst, captures: { sr: "$.data.id" } }
          assert:
            - "WaterSample.${ws}.status == RESULTED"
            - "Well.${well}.potability_status == UNSAFE"
            - "Well.${well}.active_advisory_count == 1"
            - "exactly one ContaminationCase with well_id == ${well} exists with status == OPEN"

      - name: case_close_cascade_lifts_advisory_and_recomputes_potability
        grounds:
          - state_machines.ContaminationCase.RESOLVED_to_CLOSED
          - state_machines.Advisory.transitions
          - entities.Well.fields.active_advisory_count
        distinguishing_aspect: "Depth-2 chain triggered by POST /contamination-cases/{id}/close: close -> lift the case's ACTIVE Advisory -> Well.active_advisory_count 1->0 and potability recompute; a different trigger from the result cascade."
        test_recipe:
          setup:
            - "An ACTIVE well with a cascade-opened case (advanced to RESOLVED) and one ACTIVE advisory (active_advisory_count 1)."
          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-TC2", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
            - { call: "POST /applicants", payload: { full_name: "Hal Owner", email: "hal@x.com", mailing_state: "CA" }, as: HealthOfficer, captures: { app: "$.data.id" } }
            - { call: "POST /drillers", payload: { license_number: "DRL-7", license_state: "CA", license_expires_on: "2030-01-01T00:00:00Z" }, as: HealthOfficer, captures: { dr: "$.data.id" } }
            - { call: "POST /wells", payload: { applicant_id: "${app}", aquifer_id: "${aq}", latitude: 34.5, longitude: -118.7, parcel_apn: "APN-TC2", intended_use: "DOMESTIC" }, as: Applicant, as_user_id: "${app}", captures: { well: "$.data.id" } }
            - { call: "POST /construction-permits", payload: { well_id: "${well}", applicant_id: "${app}", driller_id: "${dr}", proposed_depth_ft: 250, setback_septic_ft: 60, setback_property_line_ft: 15, scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-11T17:00:00Z" }, as: Applicant, as_user_id: "${app}", captures: { cp: "$.data.id" } }
            - { call: "POST /construction-permits/${cp}/pay", payload: {}, as: Applicant, as_user_id: "${app}" }
            - { call: "POST /construction-permits/${cp}/approve", payload: {}, as: HealthOfficer }
