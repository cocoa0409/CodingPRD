            - call: "POST /appointments/${ap1}/cancel"
              payload: { reason: "Acute infection, treatment deferred" }
              as: Scheduler
              captures: { charge: $.data.cancellation_charge_cents }
          assert:
            - "link 1 — Appointment.${ap1}.schedule_status == CANCELLED and late_cancellation == true"
            - "link 2 — DrugPreparation.${pr1}.status == WASTED with waste_cost_cents == 360000"
            - "link 2 — DrugLot.${lt1}.units_committed == 0, units_wasted == 4, units_available == 6, units_returned == 0, status == AVAILABLE"
            - "link 3 — Appointment.${ap1}.cancellation_charge_cents == 128500 (2500 + round_half_up(360000 * 0.35))"
            - "link 3 — Patient.${pt1}.waste_liability_cents == 128500"
            - "link 4 — Patient.${pt1}.steering_status == HOME_INFUSION_REVIEW (128500 >= 50000)"
            - "link 5 — TreatmentPlan.${pl1}.status == SUSPENDED"
            - "link 6 — Appointment.${ap2}.schedule_status == CANCELLED with cancellation_charge_cents == 0 and late_cancellation == false, even though it sits on 2026-08-17 and was never touched directly"
            - "link 6 — Chair.${ch1}.committed_minutes == 0 and Nurse.${nr1}.assigned_acuity_points == 0 (both visits released)"
            - "Patient.${pt1}.waste_liability_cents is still 128500 after link 6 — the system cancellation adds 0, it does not re-charge"
            - "Patient.${pt1}.no_show_strikes == 0 — cancellations are not strikes"

      - name: adverse_event_extension_bumps_later_appointment_off_the_shared_chair
        grounds:
          - calculations.observation_extension
          - calculations.staggered_start_assignment
          - state_machines.AdverseEvent.transitions.initial_REPORTED
          - state_machines.Appointment.readiness_status.transitions.FULLY_CLEARED_to_BLOCKED
          - state_machines.Appointment.schedule_status.transitions.CONFIRMED_to_TENTATIVE
          - entities.Chair.fields.committed_minutes
        distinguishing_aspect: |
          The cascade crosses from one patient's clinical event into a DIFFERENT patient's
          confirmed booking: reporting a grade-3 reaction on the 09:00 visit lengthens its
          own chair window from 240 to 300 minutes, which retroactively collides with the
          13:15 visit on the same chair (795 < 840 + 15) and bumps that unrelated
          appointment CONFIRMED -> TENTATIVE with its chair and nurse stripped. An
          implementation that only extends the reacting appointment leaves the later
          patient double-booked onto an occupied chair.
        test_recipe:
          setup:
            - "One center with exactly ONE available chair and a 15-minute turnover buffer, one nurse with capacity 6."
            - "Drug One requires a lab gate (min anc 1.5, min platelets 100), premed 30, first-dose observation 60, stability 240 minutes."
            - "Patient One's visit is booked at requested_start 540 -> [540, 780) on chair A1 with chair_minutes 240 and acuity 3."
            - "Patient Two's visit is booked at requested_start 795 -> [795, 1035) on the SAME chair; 795 is exactly the buffered boundary 780 + 15, so it is legal at booking time."
            - "Both visits are authorized and confirmed while the clock reads 2026-08-05T07:00:00Z."
            - "The clock is then moved to 2026-08-10T08:00:00Z; a passing draw for Patient One is filed at 07:00 the same morning; a two-unit dose is requested and compounded (08:00 is exactly 60 minutes before the 09:00 start, the earliest legal moment); Patient One is checked in and the infusion is started, stamping actual_start_minute 480."
