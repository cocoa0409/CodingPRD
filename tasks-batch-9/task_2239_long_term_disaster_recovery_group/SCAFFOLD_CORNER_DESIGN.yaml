              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { gq: "$.data.id" }
            - call: POST /housing-assignments
              payload: { group_id: "${gp}", lodging_site_id: "${lg}", check_in_date: "2026-09-07", check_out_date: "2026-09-10" }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { hp: "$.data.id" }
            - call: POST /housing-assignments
              payload: { group_id: "${gq}", lodging_site_id: "${lg}", check_in_date: "2026-09-07", check_out_date: "2026-09-10" }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { hq: "$.data.id" }
            - call: GET /lodging-sites/{id}
              payload: {}
              as: VolunteerCoordinator
