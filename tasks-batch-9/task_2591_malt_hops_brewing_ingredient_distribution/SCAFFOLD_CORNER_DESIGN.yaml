              payload: { malt_product_id: "${ob_prod_id}", lot_code: "LOT-OB-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { ob_lot_id: $.data.id }
            - call: "POST /malt-lots/${ob_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { ob_lot_state: $.data.status }
          trigger:
            - call: "GET /malt-lots/${ob_lot_id}"
              payload: {}
              as: CreditManager
              captures: { ob_read_credit: $.data.lot_code }
            - call: "GET /malt-lots/${ob_lot_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ob_read_admin: $.data.lot_code }
            - call: "GET /malt-lots/${ob_lot_id}/spec-match"
              payload: { recipe_id: "${ob_recipe_id}" }
              as: Brewer
              as_user_id: "${ob_b_id}"
              captures: { ob_score_brewer: $.data.match_score, ob_grade_brewer: $.data.match_grade }
            - call: "GET /malt-lots/${ob_lot_id}/spec-match"
              payload: { recipe_id: "${ob_recipe_id}" }
              as: AllocationManager
              captures: { ob_score_hop: $.data.match_score }
            - call: "GET /malt-lots/${ob_lot_id}/spec-match"
              payload: { recipe_id: "${ob_recipe_id}" }
              as: WarehouseOperator
              captures: { ob_score_wh: $.data.match_score }
            - call: "GET /malt-lots/${ob_lot_id}/spec-match"
              payload: { recipe_id: "${ob_recipe_id}" }
              as: PlatformAdmin
              captures: { ob_score_admin: $.data.match_score }
            - call: "GET /malt-lots/${ob_lot_id}/spec-match"
              payload: { recipe_id: "${ob_recipe_id}" }
              as: CreditManager
              captures: { ob_err_credit: $.data.error_id }
          assert:
            - "setup: ${ob_lot_state} == PASSED (moisture 4.20 <= 5.0 and diastatic power 95.0 >= 60.0)"
            - "plain lot read: HTTP 200 for both, with ${ob_read_credit} == LOT-OB-1 and ${ob_read_admin} == LOT-OB-1"
            - "spec-match: HTTP 200 for Brewer, AllocationManager, WarehouseOperator and PlatformAdmin, with ${ob_score_brewer} == 90.71, ${ob_score_hop} == 90.71, ${ob_score_wh} == 90.71 and ${ob_score_admin} == 90.71"
            - "${ob_grade_brewer} == ACCEPTABLE (90.71 is at or above 80.00 and below 95.00)"
            - "spec-match as CreditManager: HTTP 403 with ${ob_err_credit} == ERR_ROLE_NOT_PERMITTED — the one declared carve-out from the universal read surface"
            - "the Brewer read is not a scope violation: the recipe's brewer_id equals the acting X-User-ID"

      - name: the_same_user_cannot_analyse_and_release_one_malt_lot
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=20]
          - entities.MaltLot.fields.analyzed_by_user_id
          - entities.MaltLot.fields.released_by_user_id
          - complexity_profile.role_model
        distinguishing_aspect: "The bar is on the USER, not the role: both actors carry X-User-Role WarehouseOperator and only X-User-ID separates them, so an implementation that checks the role alone releases the lot to its own analyst. The scaffold's other segregated pair, default-then-resale, is a different pair of steps on a different entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Pale Ale lot of 5000 lb analysed by warehouse user qa-analyst-1 and sitting in PASSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { sod_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${sod_prod_id}", lot_code: "LOT-SOD-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { sod_lot_id: $.data.id }
            - call: "POST /malt-lots/${sod_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { sod_state1: $.data.status, sod_analyst: $.data.analyzed_by_user_id, sod_v1: $.data.version }
          trigger:
            - call: "POST /malt-lots/${sod_lot_id}/release"
              payload: { release_note: "self-clearing my own analysis" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { sod_err: $.data.error_id }
            - call: "POST /malt-lots/${sod_lot_id}/release"
              payload: { release_note: "second pair of eyes" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
              captures: { sod_state2: $.data.status, sod_releaser: $.data.released_by_user_id, sod_v2: $.data.version }
          assert:
            - "setup: ${sod_state1} == PASSED and ${sod_analyst} == qa-analyst-1"
            - "release by the analyst: HTTP 403 with ${sod_err} == ERR_SEGREGATION_OF_DUTIES"
            - "after the refusal: MaltLot.${sod_lot_id}.status is still PASSED, released_by_user_id == null and version == ${sod_v1}"
            - "release by a different warehouse user: HTTP 200 with ${sod_state2} == RELEASED, ${sod_releaser} == qa-analyst-2 and ${sod_v2} == ${sod_v1} + 1"
            - "both calls carried X-User-Role WarehouseOperator, so only X-User-ID can explain the difference in outcome"

  # ===========================================================================
  # From Cross-Cutting Complexity Layers — the four layers declared active in
  # complexity_profile.complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: substitution_offer_create_rejects_a_stale_contract_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.substitution-offer-create-stale-contract
          - errors[ERR_STALE_HOP_CONTRACT_VERSION]
          - validations[priority=19]
          - calculations.substitution_ranking
        distinguishing_aspect: "The contract's version is moved by the harvest report BEFORE the client writes, so the stale probe is not merely version 0: it is the value the client would legitimately have cached one write earlier, and the same value goes stale again the moment the accepted offer lands."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Citra and Mosaic both in substitution group AROMA_HIGH_ALPHA; Mosaic holds 5000 lb of spot."
            - "One brewer with a 5000 lb Citra contract in the 2026 program, whose harvest is reported at 60.00 percent so the contract is SHORTFALL_ADJUSTED with a 2000 lb hole."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Stale Contract Brewing", brewery_license_no: "BR-1056", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { sc_b_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { sc_citra_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "MOSAIC", name: "Mosaic", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.00, spot_price_cents_per_lb: 450.00, available_spot_lbs: 5000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { sc_mosaic_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { sc_prog_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${sc_b_id}", variety_id: "${sc_citra_id}", crop_year_program_id: "${sc_prog_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { sc_c_id: $.data.id, sc_cv0: $.data.version }
            - call: "POST /crop-year-programs/${sc_prog_id}/report-harvest"
              payload: { harvest_yield_pct: 60.00, reported_note: "drought" }
              as: AllocationManager
            - call: "GET /hop-contracts/${sc_c_id}"
              payload: {}
              as: AllocationManager
              captures: { sc_cv1: $.data.version, sc_alloc: $.data.allocated_lbs, sc_state: $.data.status }
          trigger:
            - call: "POST /hop-contracts/${sc_c_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${sc_cv1} - 1", selection_mode: "AUTO_RANKED", offered_lbs: 2000 }
              as: AllocationManager
              captures: { sc_err_stale: $.data.error_id }
            - call: "POST /hop-contracts/${sc_c_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${sc_cv1}", selection_mode: "AUTO_RANKED", offered_lbs: 2000 }
              as: AllocationManager
              captures: { sc_offer_id: $.data.id, sc_offer_state: $.data.status, sc_offer_var: $.data.substitute_variety_id }
            - call: "GET /hop-contracts/${sc_c_id}"
              payload: {}
              as: AllocationManager
              captures: { sc_cv2: $.data.version }
            - call: "POST /hop-contracts/${sc_c_id}/substitution-offers"
              payload: { expected_hop_contract_version: "${sc_cv1}", selection_mode: "AUTO_RANKED", offered_lbs: 2000 }
              as: AllocationManager
              captures: { sc_err_stale_again: $.data.error_id }
          assert:
            - "setup: ${sc_cv0} == 1, and after the harvest report ${sc_cv1} == 2 with ${sc_alloc} == 3000 and ${sc_state} == SHORTFALL_ADJUSTED"
            - "stale probe: HTTP 412 with ${sc_err_stale} == ERR_STALE_HOP_CONTRACT_VERSION"
            - "after the stale probe: GET /substitution-offers?hop_contract_id=${sc_c_id} returns total_count 0 and HopContract.${sc_c_id}.version is still ${sc_cv1}"
            - "correct version: HTTP 201 with ${sc_offer_state} == OPEN and ${sc_offer_var} == ${sc_mosaic_id} (Mosaic is the only group member with 2000 lb of spot)"
            - "${sc_cv2} == ${sc_cv1} + 1 — the accepted offer bumped the contract"
            - "replaying the same expected_hop_contract_version: HTTP 412 with ${sc_err_stale_again} == ERR_STALE_HOP_CONTRACT_VERSION, and total_count is still 1 — the accepted write is not idempotently repeatable"
            - "SubstitutionOffer.${sc_offer_id}.status is still OPEN, so the refused replay did not supersede it"

      - name: shipment_staging_rejects_a_stale_order_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.shipment-create-stale-order
          - errors[ERR_STALE_SALES_ORDER_VERSION]
          - validations[priority=19]
          - calculations.zone_occupancy_projection
        distinguishing_aspect: "The OCC guard on staging sits on the ORDER, not on the shipment, and it fires before the zone admission test — so a stale probe leaves ColdStorageZone.occupied_pallets untouched, which is how you tell a rejected stale write from a rejected capacity write."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer; Citra at 51.00; zone Z1 with capacity 10 pallets at setpoint 2.0."
            - "One CONFIRMED reefer order of a single full 880 lb Citra pallet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Stale Order Brewing", brewery_license_no: "BR-1057", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { so_b_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { so_citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { so_zone_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${so_b_id}", requested_ship_date: "2026-09-05T00:00:00Z" }
              as: Brewer
              as_user_id: "${so_b_id}"
              captures: { so_o_id: $.data.id }
            - call: "POST /sales-orders/${so_o_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${so_citra_id}" }
              as: Brewer
              as_user_id: "${so_b_id}"
            - call: "POST /sales-orders/${so_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${so_b_id}"
              captures: { so_ov1: $.data.version, so_total: $.data.total_cents }
          trigger:
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${so_o_id}", cold_storage_zone_id: "${so_zone_id}", expected_sales_order_version: "${so_ov1} - 1", pallet_count: 1, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-01T18:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { so_err_stale: $.data.error_id }
            - call: "GET /cold-storage-zones/${so_zone_id}"
              payload: {}
              as: WarehouseOperator
              captures: { so_occ_after_stale: $.data.occupied_pallets }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${so_o_id}", cold_storage_zone_id: "${so_zone_id}", expected_sales_order_version: "${so_ov1}", pallet_count: 1, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-01T18:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { so_ship_id: $.data.id, so_ship_state: $.data.status }
            - call: "GET /sales-orders/${so_o_id}"
              payload: {}
              as: WarehouseOperator
              captures: { so_ov2: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${so_o_id}", cold_storage_zone_id: "${so_zone_id}", expected_sales_order_version: "${so_ov1}", pallet_count: 1, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-01T18:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { so_err_stale_again: $.data.error_id }
            - call: "GET /cold-storage-zones/${so_zone_id}"
              payload: {}
              as: WarehouseOperator
              captures: { so_occ_final: $.data.occupied_pallets }
          assert:
            - "setup: ${so_total} == 95380 and ${so_ov1} == 3 (create, line add, confirm)"
            - "stale probe: HTTP 412 with ${so_err_stale} == ERR_STALE_SALES_ORDER_VERSION"
            - "${so_occ_after_stale} == 0 and GET /cold-chain-shipments?sales_order_id=${so_o_id} returns total_count 0 — the zone admission test never ran"
            - "correct version: HTTP 201 with ${so_ship_state} == STAGED and ${so_ov2} == ${so_ov1} + 1"
            - "the staging window opens exactly at the logical clock, so ${so_occ_final} == 1 (the clock sits inside the half-open interval [00:00, 18:00))"
            - "replaying the same expected_sales_order_version: HTTP 412 with ${so_err_stale_again} == ERR_STALE_SALES_ORDER_VERSION"
            - "ColdChainShipment.${so_ship_id}.status is still STAGED — the refused replay did not supersede the live load, so occupied_pallets stayed at 1 rather than dropping and re-rising"

      - name: credit_profile_update_rejects_a_stale_brewer_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.credit-profile-update-stale-brewer
          - errors[ERR_STALE_BREWER_VERSION]
          - validations[priority=19]
          - calculations.brewer_credit_posture
        distinguishing_aspect: "Nothing in the Brewer's state machine forbids two consecutive credit-profile writes, so the version check is the ONLY thing that can refuse the second one — and the refusal must leave both the limit and the derived posture exactly as the first write left them."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer at credit_limit_cents 5000000 with no orders and no receivable, so credit_exposure_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Stale Brewer Brewing", brewery_license_no: "BR-1058", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { sb_id: $.data.id, sb_v1: $.data.version }
          trigger:
            - call: "PUT /brewers/${sb_id}/credit-profile"
              payload: { expected_brewer_version: "${sb_v1}", credit_limit_cents: 4000000, cold_chain_certified: true }
              as: CreditManager
              captures: { sb_v2: $.data.version, sb_limit2: $.data.credit_limit_cents, sb_cert2: $.data.cold_chain_certified }
            - call: "PUT /brewers/${sb_id}/credit-profile"
              payload: { expected_brewer_version: "${sb_v2} - 1", credit_limit_cents: 9000000 }
              as: CreditManager
              captures: { sb_err_stale: $.data.error_id }
            - call: "PUT /brewers/${sb_id}/credit-profile"
              payload: { expected_brewer_version: "${sb_v2}", credit_terms_days: 60 }
              as: CreditManager
              captures: { sb_v3: $.data.version, sb_terms3: $.data.credit_terms_days, sb_limit3: $.data.credit_limit_cents }
          assert:
            - "setup: ${sb_v1} == 1"
            - "first write: HTTP 200 with ${sb_v2} == 2, ${sb_limit2} == 4000000 and ${sb_cert2} == true"
            - "stale probe carrying the pre-write version: HTTP 412 with ${sb_err_stale} == ERR_STALE_BREWER_VERSION"
            - "after the refusal: Brewer.${sb_id}.credit_limit_cents is still 4000000, version is still ${sb_v2}, credit_exposure_cents == 0, credit_utilization_pct == 0.00 and credit_status == GOOD_STANDING"
            - "third write with the current version: HTTP 200 with ${sb_v3} == ${sb_v2} + 1, ${sb_terms3} == 60 and ${sb_limit3} == 4000000 (an omitted optional field is left alone, not reset)"

      - name: excursion_thresholds_are_strict_and_the_accumulator_never_resets
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.cold_chain_excursion_assessment
          - complexity_profile.complexity_layers
          - state_machines.ColdChainShipment.IN_TRANSIT_to_EXCURSION_FLAGGED
          - errors[ERR_INVALID_SHIPMENT_STATE]
        distinguishing_aspect: "Three strict-inequality boundaries in one series: a sample exactly at setpoint plus tolerance is in tolerance, a sample exactly at setpoint minus tolerance is in tolerance, and a cumulative total exactly at MAX_EXCURSION_MINUTES does not flag. A reading that comes back in tolerance does NOT rewind the accumulator, so the total is monotonic and the load is flagged by the very next violating minute."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Certified brewer; Citra at 51.00; zone Z1 capacity 10."
            - "A reefer load of one pallet IN_TRANSIT at setpoint 2.0 with tolerance 2.0, so the in-tolerance band is the closed interval [0.00, 4.00]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Threshold Brewing", brewery_license_no: "BR-1059", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { th_b_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { th_citra_id: $.data.id }
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { th_zone_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${th_b_id}", requested_ship_date: "2026-09-05T00:00:00Z" }
              as: Brewer
              as_user_id: "${th_b_id}"
              captures: { th_o_id: $.data.id }
            - call: "POST /sales-orders/${th_o_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${th_citra_id}" }
              as: Brewer
              as_user_id: "${th_b_id}"
              captures: { th_line_id: $.data.id }
            - call: "POST /sales-orders/${th_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${th_b_id}"
            - call: "POST /sales-orders/${th_o_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "within limit" }
              as: CreditManager
            - call: "POST /sales-orders/${th_o_id}/pick"
              payload: {}
              as: WarehouseOperator
            - call: "GET /sales-orders/${th_o_id}"
              payload: {}
              as: WarehouseOperator
              captures: { th_ov: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${th_o_id}", cold_storage_zone_id: "${th_zone_id}", expected_sales_order_version: "${th_ov}", pallet_count: 1, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-01T18:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { th_ship_id: $.data.id }
            - call: "POST /cold-chain-shipments/${th_ship_id}/depart"
              payload: {}
              as: WarehouseOperator
              captures: { th_ship_state0: $.data.status }
          trigger:
            - call: "POST /cold-chain-shipments/${th_ship_id}/readings"
              payload: { temp_c: 4.00, recorded_at: "2026-08-01T06:00:00Z" }
              as: WarehouseOperator
              captures: { th_r1_viol: $.data.in_violation, th_r1_int: $.data.interval_minutes, th_r1_cum: $.data.cumulative_excursion_minutes }
            - call: "POST /cold-chain-shipments/${th_ship_id}/readings"
              payload: { temp_c: 4.01, recorded_at: "2026-08-01T06:30:00Z" }
              as: WarehouseOperator
              captures: { th_r2_viol: $.data.in_violation, th_r2_int: $.data.interval_minutes, th_r2_cum: $.data.cumulative_excursion_minutes }
            - call: "GET /cold-chain-shipments/${th_ship_id}"
              payload: {}
              as: WarehouseOperator
              captures: { th_state_at_30: $.data.status, th_min_at_30: $.data.excursion_minutes }
            - call: "POST /cold-chain-shipments/${th_ship_id}/readings"
              payload: { temp_c: 0.00, recorded_at: "2026-08-01T06:31:00Z" }
              as: WarehouseOperator
              captures: { th_r3_viol: $.data.in_violation, th_r3_int: $.data.interval_minutes, th_r3_cum: $.data.cumulative_excursion_minutes }
            - call: "POST /cold-chain-shipments/${th_ship_id}/readings"
              payload: { temp_c: -0.01, recorded_at: "2026-08-01T06:32:00Z" }
              as: WarehouseOperator
              captures: { th_r4_viol: $.data.in_violation, th_r4_cum: $.data.cumulative_excursion_minutes }
            - call: "GET /cold-chain-shipments/${th_ship_id}"
              payload: {}
              as: WarehouseOperator
              captures: { th_state_at_31: $.data.status, th_min_at_31: $.data.excursion_minutes, th_count: $.data.reading_count }
            - call: "POST /cold-chain-shipments/${th_ship_id}/readings"
              payload: { temp_c: 2.00, recorded_at: "2026-08-01T06:33:00Z" }
              as: WarehouseOperator
              captures: { th_err_after_flag: $.data.error_id }
          assert:
            - "setup: ${th_ship_state0} == IN_TRANSIT"
            - "reading 1 at exactly 4.00: ${th_r1_viol} == false (the test is strictly greater than setpoint + tolerance), ${th_r1_int} == 0 and ${th_r1_cum} == 0"
            - "reading 2 at 4.01: ${th_r2_viol} == true, ${th_r2_int} == 30 and ${th_r2_cum} == 30 — the whole 30-minute gap is charged to the reading that CLOSES it"
            - "cumulative total exactly at MAX_EXCURSION_MINUTES: ${th_min_at_30} == 30 and ${th_state_at_30} == IN_TRANSIT, NOT EXCURSION_FLAGGED"
            - "reading 3 at exactly 0.00: ${th_r3_viol} == false (strictly less than setpoint - tolerance is required), ${th_r3_int} == 1 and ${th_r3_cum} == 30 — returning to tolerance does not reset the accumulator to 0"
            - "reading 4 at -0.01: ${th_r4_viol} == true and ${th_r4_cum} == 31"
            - "31 > 30: ${th_state_at_31} == EXCURSION_FLAGGED, ${th_min_at_31} == 31 and ${th_count} == 4"
            - "cascade C link 2: OrderLine.${th_line_id}.status == QUARANTINED because the Citra line carries cold_chain_required true; no replacement propagation job exists because the order has no YEAST line, so GET /yeast-propagation-jobs returns total_count 0"
            - "reading 5 after the flag: HTTP 409 with ${th_err_after_flag} == ERR_INVALID_SHIPMENT_STATE, and ${th_count} stays 4 — a flagged load stops accumulating"

      - name: harvest_report_cascade_runs_five_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - state_machines.HopContract.ACTIVE_to_SHORTFALL_ADJUSTED
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / report_harvest_shortfall_trims_lines_reprices_order_and_moves_credit
          rationale: "The named §1.8 instance walks all five links of cascade A end-to-end, asserting each intermediate as well as the final credit posture."

      - name: default_declaration_cascade_runs_five_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - state_machines.HopContract.ACTIVE_to_DEFAULTED
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / declare_default_posts_settlement_holds_brewer_freezes_order_and_releases_pallets
          rationale: "The named §1.8 instance walks all four links of cascade B, including the pallet release that its ordering sensitivity depends on."

      - name: temperature_excursion_cascade_mints_a_replacement_job
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ColdChainShipment.IN_TRANSIT_to_EXCURSION_FLAGGED
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / temperature_excursion_fails_yeast_quarantines_hops_and_mints_replacement_job
          rationale: "The named §1.8 instance asserts all three links of cascade C, including the replacement job's replaces_job_id and pushed-out pitch_date."

      - name: both_fee_variants_and_the_delta_on_switching
        claim_type: dual_variant_calculation
        grounds:
          - calculations.order_fee_assessment
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / order_fee_provisional_vs_final_freight_tier_self_promotion
          rationale: "The named §1.8 instance asserts both the PROVISIONAL and FINAL totals and the signed final_freight_adjustment_cents delta between them."

      - name: both_settlement_variants_and_the_delta_on_switching
        claim_type: dual_variant_calculation
        grounds:
          - calculations.contract_default_settlement
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / contract_default_settlement_market_vs_liquidated_damages
          rationale: "The named §1.8 instance drives two otherwise identical contracts down the MARKET_SETTLED and LIQUIDATED branches and asserts both settlement totals."

  # ===========================================================================
  # From Consistency Model — complexity_profile.consistency_model is `immediate`
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.order_subtotal_rollup
          - calculations.order_fee_assessment
          - calculations.brewer_credit_posture
          - calculations.malt_lot_availability
        distinguishing_aspect: "There is no read-after-write lag anywhere: the confirm response body already carries the fee breakdown, and a read of the OTHER two entities the confirm touched — the brewer's posture and the malt lot's availability — returns the post-write figures on the very next call, with no re-computation step and no second write needed to settle them."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One brewer at credit_limit_cents 5000000; one Pale Ale lot of 5000 lb analysed and RELEASED; one DRAFT order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "No Lag Brewing", brewery_license_no: "BR-1060", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { nl_b_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { nl_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${nl_prod_id}", lot_code: "LOT-NL-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { nl_lot_id: $.data.id }
            - call: "POST /malt-lots/${nl_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${nl_lot_id}/release"
              payload: { release_note: "COA on file" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
              captures: { nl_avail0: $.data.available_lbs, nl_comm0: $.data.committed_lbs }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${nl_b_id}", requested_ship_date: "2026-09-05T00:00:00Z" }
              as: Brewer
              as_user_id: "${nl_b_id}"
              captures: { nl_o_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${nl_o_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${nl_lot_id}" }
              as: Brewer
              as_user_id: "${nl_b_id}"
              captures: { nl_line_id: $.data.id, nl_line_ext: $.data.extended_cents, nl_line_pb: $.data.pallet_break }
            - call: "GET /sales-orders/${nl_o_id}"
              payload: {}
              as: Brewer
              as_user_id: "${nl_b_id}"
              captures: { nl_sub_after_line: $.data.subtotal_cents, nl_count_after_line: $.data.line_count, nl_total_draft: $.data.total_cents }
            - call: "POST /sales-orders/${nl_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${nl_b_id}"
              captures: { nl_conf_total: $.data.total_cents, nl_conf_freight: $.data.freight_cents, nl_conf_pb: $.data.pallet_break_fee_cents, nl_conf_sos: $.data.small_order_surcharge_cents, nl_conf_variant: $.data.fee_variant, nl_conf_tier: $.data.freight_tier_applied }
            - call: "GET /sales-orders/${nl_o_id}"
              payload: {}
              as: Brewer
              as_user_id: "${nl_b_id}"
              captures: { nl_read_total: $.data.total_cents, nl_read_variant: $.data.fee_variant }
            - call: "GET /brewers/${nl_b_id}"
              payload: {}
              as: CreditManager
              captures: { nl_exposure: $.data.credit_exposure_cents, nl_util: $.data.credit_utilization_pct, nl_cstatus: $.data.credit_status }
            - call: "GET /malt-lots/${nl_lot_id}"
              payload: {}
              as: WarehouseOperator
              captures: { nl_avail1: $.data.available_lbs, nl_comm1: $.data.committed_lbs }
          assert:
            - "before the line: ${nl_avail0} == 5000 and ${nl_comm0} == 0"
            - "the line-create response already carries its own derived fields: ${nl_line_ext} == 68500 and ${nl_line_pb} == true (1000 mod 2200 != 0)"
            - "the very next read shows the parent rollup: ${nl_sub_after_line} == 68500 and ${nl_count_after_line} == 1"
            - "${nl_total_draft} == 0 while the order is DRAFT — no fee variant has been assessed yet"
            - "the confirm response is complete in itself: ${nl_conf_total} == 105500, ${nl_conf_freight} == 25000, ${nl_conf_pb} == 4500, ${nl_conf_sos} == 7500, ${nl_conf_variant} == PROVISIONAL and ${nl_conf_tier} == TIER_1"
            - "re-reading the order changes nothing: ${nl_read_total} == 105500 and ${nl_read_variant} == PROVISIONAL"
            - "the brewer is already repriced on the next call: ${nl_exposure} == 105500, ${nl_util} == 2.11 and ${nl_cstatus} == GOOD_STANDING"
            - "the lot is already drawn down on the next call: ${nl_comm1} == 1000 and ${nl_avail1} == 4000"
            - "no assertion above required a second write, a retry or a delay to become true"
