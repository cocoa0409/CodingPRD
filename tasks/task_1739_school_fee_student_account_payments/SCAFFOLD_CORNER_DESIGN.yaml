  # ---------------------------------------------------------------------------
  # Section 3 — Calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: installment_schedule_remainder_on_last_installment
        claim_type: correct_result
        grounds: [calculations.installment_schedule]
        distinguishing_aspect: "Equal split with the remainder pinned to the LAST installment: 10001 cents over 3 installments yields [3333, 3333, 3335] with due dates 2026-09-05, 2026-10-05, 2026-11-04 (interval 30 days)."
        test_recipe:
          setup: ["OPEN year (plan min 1000, max 6); account with a single ad-hoc assessment of 10001 cents"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
