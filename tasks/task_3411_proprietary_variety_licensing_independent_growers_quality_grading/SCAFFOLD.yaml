# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3411_proprietary_variety_licensing_independent_growers_quality_grading
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Proprietary Variety Licensing to Independent Growers & Quality Grading (Driscoll's): plant breeding programs producing proprietary berry varieties licensed exclusively to network growers under agreements, grower agreements specifying planting quantities, cultural practices and exclusive marketing of the resulting fruit through the brand, plant material distribution from nurseries with royalty accounting and prohibition on propagation, harvest scheduling across regions to maintain year-round supply with variety selection by season and geography, quality grading at cooling facilities with flavor, firmness and appearance standards determining pack designation, pooled returns to growers based on grade and market conditions with settlement statements, cold chain from field to distribution center with pre-cooling requirements, grower exit and variety recall of plantings

domain_name: proprietary-berry-licensing
api_prefix: /licensing

complexity_profile:
  primary_archetype: ledger_reconciliation      # pooled returns: provisional close vs final settle produce different money for identical lots
  secondary_archetype: compliance_audit         # licensing, propagation prohibition, four-eyes grading, recall enforcement
  complexity_layers:
    - optimistic_concurrency                    # OCC on GrowerAgreement.version and Planting.version
    - cascading_side_effects                    # recall-enforce and grower-exit cascades, depth >= 3
    - dual_variant_calculation                  # pool rate provisional-vs-final; royalty provisional-vs-tiered-final
    - rate_threshold_triggers                   # grade thresholds, precool boundary, royalty tiers, oversubscribe cap
  entity_topology: flat                         # peer entities joined by FK references; no nested creation paths
  state_machine_shape: cyclic                   # grade regrade loop and statement dispute-resolve loop; HarvestLot also carries parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate                           # Planting -> HarvestWindow booking, HarvestLot -> PoolPeriod membership
  role_model: segregation_of_duties             # grader who submitted/received a lot cannot certify its grade
  consistency_model: immediate                  # every mutation and its cascades visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all common_fields: true)
# =============================================================================
entities:
  - name: Variety
    parent: null
    common_fields: true
    fields:
      - { name: variety_code, type: string, source: input, description: "Breeding program code; unique across all varieties" }
      - { name: berry_type, type: enum, source: input, description: "STRAWBERRY | RASPBERRY | BLACKBERRY | BLUEBERRY" }
      - { name: name, type: string, source: input, description: "Marketing name of the proprietary variety" }
      - { name: status, type: enum, source: system, description: "DEVELOPMENT | RELEASED | RECALLED" }
      - { name: released_at, type: datetime, source: system, description: "Set when status enters RELEASED; null until then" }
      - { name: recalled_at, type: datetime, source: system, description: "Set when status enters RECALLED; null until then" }

  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Grower legal entity name" }
      - { name: region_code, type: string, source: input, description: "Home growing region code (free-form uppercase token, e.g. CA-SALINAS)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXITED; created ACTIVE" }
      - { name: suspended_at, type: datetime, source: system, description: "Set on ACTIVE -> SUSPENDED; null otherwise" }
      - { name: exited_at, type: datetime, source: system, description: "Set on transition to EXITED; null otherwise" }

  - name: GrowerAgreement
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; the licensed grower" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; the licensed variety" }
      - { name: region_code, type: string, source: input, description: "Region where planting under this agreement occurs" }
      - { name: max_planting_units, type: integer, source: input, description: "Maximum total plants the grower may confirm under this agreement; > 0" }
      - { name: units_planted, type: integer, source: computed, default: 0, description: "Sum of plants_planted_actual over this agreement's plantings in PLANTED | HARVESTING | COMPLETED" }
      - { name: cultural_practice_codes, type: array, source: input, description: "Non-empty array of enum: ORGANIC | CONVENTIONAL | DRIP_IRRIGATION | INTEGRATED_PEST_MANAGEMENT | SOIL_FUMIGATION_FREE" }
      - { name: exclusive_marketing, type: boolean, source: input, description: "Must be true — all fruit marketed through the brand; false rejected with ERR_EXCLUSIVE_MARKETING_REQUIRED" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the agreement window (closed interval)" }
      - { name: effective_to, type: datetime, source: input, description: "Inclusive end of the agreement window (closed interval); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACTIVE | REJECTED | SUSPENDED | TERMINATED; created PENDING_REVIEW" }
      - { name: decided_at, type: datetime, source: system, description: "Set by decide; null while PENDING_REVIEW" }
      - { name: reject_reason, type: string, source: system, description: "Reason recorded when decided REJECT; null otherwise" }

  - name: PlantLot
    parent: null
    common_fields: true
    fields:
      - { name: nursery_code, type: string, source: input, description: "Licensed nursery that produced the plant material (free-form token)" }
      - { name: agreement_id, type: string, source: input, description: "FK -> GrowerAgreement.id; license under which material is distributed" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id; variety of the plant material" }
      - { name: quantity_plants, type: integer, source: input, description: "Plants shipped in this lot; > 0" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical clock at creation (lot is created already SHIPPED)" }
      - { name: season_year, type: integer, source: computed, description: "Calendar year of shipped_at; drives the royalty tier counter" }
      - { name: plants_reserved, type: integer, source: computed, default: 0, description: "Sum of planned_plants over this lot's plantings in PLANNED" }
      - { name: plants_planted, type: integer, source: computed, default: 0, description: "Sum of plants_planted_actual over this lot's plantings in PLANTED | HARVESTING | COMPLETED" }
      - { name: plants_destroyed, type: integer, source: computed, default: 0, description: "Plants destroyed by recall (recalled plantings' actuals + unplanted remainder on lot recall)" }
      - { name: plants_available, type: integer, source: computed, description: "= quantity_plants - plants_reserved - plants_planted - plants_destroyed" }
      - { name: royalty_provisional_cents, type: integer, source: computed, description: "= quantity_plants * ROYALTY_BASE_CENTS_PER_PLANT, fixed at creation" }
      - { name: royalty_final_cents, type: integer, source: computed, description: "Tiered marginal royalty over the (variety_id, season_year) cumulative counter; computed when the lot reaches DEPLETED or RECALLED; null until then" }
      - { name: royalty_adjustment_cents, type: integer, source: computed, description: "= royalty_final_cents - royalty_provisional_cents; null until final computed" }
      - { name: depleted_at, type: datetime, source: system, description: "Set when plants_planted + plants_destroyed reaches quantity_plants; null until then" }
      - { name: status, type: enum, source: system, description: "SHIPPED | PLANTED | DEPLETED | RECALLED" }

  - name: Planting
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> GrowerAgreement.id" }
      - { name: plant_lot_id, type: string, source: input, description: "FK -> PlantLot.id; source plant material" }
      - { name: planned_plants, type: integer, source: input, description: "Plants the grower intends to plant; > 0; reserves that many plants on the lot" }
      - { name: plants_planted_actual, type: integer, source: input, description: "Actual plants planted, supplied at confirm; null until then" }
      - { name: planted_on, type: datetime, source: input, description: "Actual planting date, supplied at confirm; null until then" }
      - { name: region_code, type: string, source: computed, description: "Copied from the agreement at creation" }
      - { name: expected_first_harvest, type: datetime, source: computed, description: "= planted_on + DAYS_TO_FIRST_HARVEST[berry_type]; null until confirmed" }
      - { name: expected_yield_kg, type: number, source: computed, description: "= plants_planted_actual * YIELD_KG_PER_PLANT[berry_type]; null until confirmed" }
      - { name: harvest_window_id, type: string, source: computed, description: "FK -> HarvestWindow.id; window booked at confirm; null until then" }
      - { name: status, type: enum, source: system, description: "PLANNED | PLANTED | HARVESTING | COMPLETED | CANCELLED | RECALLED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on HARVESTING -> COMPLETED; null otherwise" }
      - { name: recalled_at, type: datetime, source: system, description: "Set on recall-enforce cascade; null otherwise" }
      - { name: recall_compensation_cents, type: integer, source: computed, description: "Set when RECALLED from PLANTED | HARVESTING: plants_planted_actual * RecallOrder.compensation_per_plant_cents; 0 when recalled from PLANNED; null otherwise" }

  - name: HarvestWindow
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Region this supply window plans" }
      - { name: variety_id, type: string, source: input, description: "FK -> Variety.id" }
      - { name: week_start, type: datetime, source: input, description: "Inclusive start of the half-open window [week_start, week_end)" }
      - { name: week_end, type: datetime, source: input, description: "Exclusive end; must be > week_start" }
      - { name: target_volume_kg, type: integer, source: input, description: "Planned supply volume; > 0" }
      - { name: booked_volume_kg, type: number, source: computed, default: 0, description: "Sum of expected_yield_kg over plantings in PLANTED | HARVESTING booked to this window" }

  - name: HarvestLot
    parent: null
    common_fields: true
    fields:
      - { name: planting_id, type: string, source: input, description: "FK -> Planting.id; the planting this fruit came from" }
      - { name: harvested_at, type: datetime, source: input, description: "When the fruit was picked; must be >= the planting's planted_on and <= current logical clock" }
      - { name: gross_weight_kg, type: number, source: input, description: "Gross delivered weight; > 0" }
      - { name: tare_weight_kg, type: number, source: input, default: 0, description: "Packaging tare; >= 0 and < gross_weight_kg" }
      - { name: net_kg, type: number, source: computed, description: "= gross_weight_kg - tare_weight_kg" }
      - { name: received_at, type: datetime, source: input, description: "Recorded at receive; must be > harvested_at and <= current logical clock; null until received" }
      - { name: pulp_temp_c_at_receipt, type: number, source: input, description: "Pulp temperature at the cooling facility; null until received" }
      - { name: received_by_user_id, type: string, source: system, description: "X-User-ID of the CoolingOperator who received the lot; null until received" }
      - { name: precool_hours, type: number, source: computed, description: "= received_at - harvested_at in hours (2 decimal places); null until received" }
      - { name: cold_chain_compliant, type: boolean, source: computed, description: "precool_hours <= PRECOOL_MAX_HOURS AND pulp_temp_c_at_receipt <= PULP_TEMP_COMPLIANT_MAX_C; null until received" }
      - { name: lot_status, type: enum, source: system, description: "IN_TRANSIT | RECEIVED | GRADED | SETTLED | REJECTED" }
      - { name: grade_status, type: enum, source: system, description: "UNGRADED | SUBMITTED | CERTIFIED | DISPUTED — parallel dimension to lot_status" }
      - { name: flavor_brix, type: number, source: input, description: "Flavor score 0..20 submitted at grade; null until submitted" }
      - { name: firmness_g, type: integer, source: input, description: "Firmness in grams-force 0..500; null until submitted" }
      - { name: appearance_score, type: integer, source: input, description: "Appearance 0..100; null until submitted" }
      - { name: defect_pct, type: number, source: input, description: "Defect percentage 0..100; null until submitted" }
      - { name: grade, type: enum, source: computed, description: "PREMIUM | STANDARD | PROCESS | JUICE | REJECT per grade_determination; null until submitted" }
      - { name: pack_designation, type: enum, source: computed, description: "Equals grade; null until submitted" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the QualityGrader who last submitted scores; null until submitted" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying QualityGrader; null until certified" }
      - { name: grade_submitted_at, type: datetime, source: system, description: "Logical clock of the latest grade submission; null until submitted" }
      - { name: grade_dispute_reason, type: string, source: system, description: "Reason recorded by dispute-grade; null until disputed" }
      - { name: grade_version, type: integer, source: system, default: 0, description: "1 after first grade submission; +1 on every regrade" }
      - { name: pool_period_id, type: string, source: computed, description: "FK -> PoolPeriod.id; pool the lot was included in at close; null until included" }
      - { name: lot_gross_provisional_cents, type: integer, source: computed, description: "Provisional lot gross at pool close; null until then; 0-weight grades excluded" }
      - { name: lot_gross_final_cents, type: integer, source: computed, description: "Final lot gross at pool settle after remainder allocation; null until then" }

  - name: PoolPeriod
    parent: null
    common_fields: true
    fields:
      - { name: berry_type, type: enum, source: input, description: "STRAWBERRY | RASPBERRY | BLACKBERRY | BLUEBERRY; one pool per berry_type per half-open week" }
      - { name: week_start, type: datetime, source: input, description: "Inclusive start of the pooling window" }
      - { name: week_end, type: datetime, source: input, description: "Exclusive end; must be > week_start" }
      - { name: is_shoulder_week, type: boolean, source: input, description: "Shoulder-season flag; multiplies the pool rate by SHOULDER_WEEK_MULTIPLIER" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SETTLED | PAID" }
      - { name: estimated_price_cents_per_kg, type: integer, source: input, description: "Estimated market price used for the provisional pipeline at close; > 0" }
      - { name: actual_price_cents_per_kg, type: integer, source: input, description: "Actual market price used for the final pipeline at settle; > 0" }
      - { name: total_net_kg, type: number, source: computed, description: "Sum of net_kg over included lots; set at close" }
      - { name: total_weighted_kg, type: number, source: computed, description: "Sum of net_kg * GRADE_WEIGHT[grade] over included lots; set at close" }
      - { name: gross_pool_revenue_cents, type: integer, source: computed, description: "Provisional at close, recomputed final at settle" }
      - { name: marketing_fee_cents, type: integer, source: computed, description: "= round_half_up(gross_pool_revenue_cents * MARKETING_FEE_PCT, 0); recomputed at settle" }
      - { name: net_pool_revenue_cents, type: integer, source: computed, description: "= gross_pool_revenue_cents - marketing_fee_cents; recomputed at settle" }
      - { name: pool_distributable_cents, type: integer, source: computed, description: "= round_half_up(net_pool_revenue_cents * (SHOULDER_WEEK_MULTIPLIER if is_shoulder_week else 1.0), 0)" }
      - { name: provisional_pool_rate, type: number, source: computed, description: "Cents per weighted kg, 4 decimal places, from the estimated price; set at close" }
      - { name: final_pool_rate, type: number, source: computed, description: "Cents per weighted kg, 4 decimal places, from the actual price; set at settle; null until then" }
      - { name: closed_at, type: datetime, source: system, description: "Set at close; null until then" }
      - { name: settled_at, type: datetime, source: system, description: "Set at settle; null until then" }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: pool_period_id, type: string, source: computed, description: "FK -> PoolPeriod.id; statement created by pool close" }
      - { name: grower_id, type: string, source: computed, description: "FK -> Grower.id; grower being settled" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | ISSUED | DISPUTED | FINAL | PAID" }
      - { name: provisional_net_cents, type: integer, source: computed, description: "Net at provisional pipeline (gross minus cold-chain deduction), set at close" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of lot_gross_final_cents over the grower's included lots; set at settle" }
      - { name: royalty_offset_cents, type: integer, source: computed, description: "Sum of royalty_adjustment_cents over the grower's plant lots whose depleted_at falls in [pool.week_start, pool.week_end); set at settle; 0 if none" }
      - { name: cold_chain_deduction_cents, type: integer, source: computed, description: "Sum of round_half_up(lot_gross_final_cents * COLD_CHAIN_BREACH_DEDUCTION_PCT, 0) over the grower's non-compliant included lots; set at settle" }
      - { name: recall_credit_cents, type: integer, source: computed, description: "Sum of recall_compensation_cents over the grower's plantings whose recalled_at falls in [pool.week_start, pool.week_end); set at settle; 0 if none" }
      - { name: net_cents, type: integer, source: computed, description: "= gross_cents - royalty_offset_cents - cold_chain_deduction_cents + recall_credit_cents; may be negative at settle; adjusted by resolve ADJUST" }
      - { name: issued_at, type: datetime, source: system, description: "Set when status enters ISSUED (at settle and after every resolve ADJUST)" }
      - { name: dispute_deadline, type: datetime, source: computed, description: "= issued_at + DISPUTE_WINDOW_DAYS days; dispute allowed while logical clock <= dispute_deadline" }
      - { name: dispute_reason, type: string, source: input, description: "Recorded at dispute; null until disputed" }
      - { name: dispute_count, type: integer, source: system, default: 0, description: "+1 on every ISSUED -> DISPUTED" }
      - { name: resolution, type: enum, source: system, description: "UPHOLD | ADJUST recorded at resolve; null until resolved" }
      - { name: adjustment_total_cents, type: integer, source: system, default: 0, description: "Cumulative signed adjustments from resolve ADJUST" }
      - { name: paid_at, type: datetime, source: system, description: "Set on transition to PAID; null until then" }

  - name: RecallOrder
    parent: null
    common_fields: true
    fields:
      - { name: variety_id, type: string, source: computed, description: "FK -> Variety.id; taken from the recall path" }
      - { name: reason, type: string, source: input, description: "Why the variety is recalled" }
      - { name: destroy_before, type: datetime, source: input, description: "Deadline by which plantings must be destroyed (informational gate, not enforced)" }
      - { name: compensation_per_plant_cents, type: integer, source: input, default: 22, description: "Per-plant compensation for plantings recalled from PLANTED | HARVESTING; >= 0" }
      - { name: status, type: enum, source: system, description: "ISSUED | COMPLETE; created ISSUED" }
      - { name: plantings_recalled_count, type: integer, source: computed, default: 0, description: "Plantings transitioned to RECALLED by enforce" }
      - { name: total_compensation_cents, type: integer, source: computed, default: 0, description: "Sum of recall_compensation_cents produced by enforce" }
      - { name: enforced_at, type: datetime, source: system, description: "Set at enforce; null until then" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Variety
    initial_state: DEVELOPMENT
    terminal_states: [RECALLED]
    transitions:
      - from: DEVELOPMENT
        to: RELEASED
        trigger: "POST /licensing/varieties/{varietyId}/release"
        actor: BreedingManager
        preconditions: []
        side_effects: ["released_at = logical clock", "increments Variety.version by 1"]
      - from: RELEASED
        to: RECALLED
        trigger: "POST /licensing/varieties/{varietyId}/recall"
        actor: BreedingManager
        preconditions: []
        side_effects:
          - "Creates RecallOrder(status=ISSUED, variety_id=this variety, reason/destroy_before/compensation_per_plant_cents from request)"
          - "recalled_at = logical clock"
          - "increments Variety.version by 1"
        note: "Recall does NOT cascade by itself; the cascade runs at recall-order enforce. Agreements for the variety stay ACTIVE but new plant-lots/plantings referencing a RECALLED variety are rejected referentially."

  - entity: Grower
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/growers/{growerId}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "CASCADE link 1: every GrowerAgreement with grower_id=this grower in ACTIVE -> SUSPENDED (each increments its own version)"
          - "suspended_at = logical clock"
          - "increments Grower.version by 1"
        note: "Suspension does NOT touch PENDING_REVIEW agreements, plantings, or lots; it blocks downstream transitions via ERR_GROWER_NOT_ACTIVE / ERR_AGREEMENT_NOT_ACTIVE."
      - from: ACTIVE
        to: EXITED
        trigger: "POST /licensing/growers/{growerId}/exit"
        actor: ComplianceOfficer
        preconditions:
          - "No Planting reachable via this grower's agreements is in PLANTED or HARVESTING (ERR_GROWER_HAS_LIVE_PLANTINGS)"
          - "No SettlementStatement with grower_id=this grower has status != PAID (ERR_GROWER_HAS_UNSETTLED_STATEMENTS)"
        side_effects:
          - "CASCADE link 1: every GrowerAgreement of this grower in ACTIVE or SUSPENDED -> TERMINATED"
          - "CASCADE link 2: every Planting of each terminated agreement in PLANNED -> CANCELLED"
          - "CASCADE link 3: each cancelled planting releases its reservation: plant_lot.plants_reserved -= planned_plants"
          - "exited_at = logical clock"
          - "increments Grower.version by 1"
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /licensing/growers/{growerId}/exit"
        actor: ComplianceOfficer
        preconditions: ["same as ACTIVE -> EXITED"]
        side_effects: ["same as ACTIVE -> EXITED"]

  - entity: GrowerAgreement
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /licensing/agreements/{agreementId}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "Grower of the agreement is ACTIVE (ERR_GROWER_NOT_ACTIVE)"
          - "Variety of the agreement is RELEASED (ERR_VARIETY_NOT_RELEASED) and not RECALLED (ERR_VARIETY_RECALLED)"
        side_effects: ["decided_at = logical clock", "increments GrowerAgreement.version by 1"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /licensing/agreements/{agreementId}/decide with decision=REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["reject_reason = request reason (may be null)", "decided_at = logical clock", "increments GrowerAgreement.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade from Grower ACTIVE -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: ["increments GrowerAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (cascade from Grower exit)"
        actor: system
        preconditions: []
        side_effects: ["increments GrowerAgreement.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (cascade from Grower exit)"
        actor: system
        preconditions: []
        side_effects: ["increments GrowerAgreement.version by 1"]

  - entity: PlantLot
    initial_state: SHIPPED
    terminal_states: [DEPLETED, RECALLED]
    transitions:
      - from: SHIPPED
        to: PLANTED
        trigger: "system (first linked planting confirms)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANTED
        to: DEPLETED
        trigger: "system (plants_planted + plants_destroyed reaches quantity_plants)"
        actor: system
        preconditions: []
        side_effects:
          - "royalty_final_cents = tiered marginal royalty over (variety_id, season_year) cumulative counter ordered by (shipped_at ASC, created_at ASC)"
          - "royalty_adjustment_cents = royalty_final_cents - royalty_provisional_cents"
          - "depleted_at = logical clock"
      - from: SHIPPED
        to: DEPLETED
        trigger: "system (a single confirm both starts and completes the lot)"
        actor: system
        preconditions: []
        side_effects: ["same royalty computation as PLANTED -> DEPLETED"]
      - from: SHIPPED
        to: RECALLED
        trigger: "system (cascade link 3 from RecallOrder enforce)"
        actor: system
        preconditions: []
        side_effects:
          - "plants_destroyed += plants_available (unplanted remainder destroyed)"
          - "royalty_final_cents computed as on DEPLETED; royalty_adjustment_cents set"
      - from: PLANTED
        to: RECALLED
        trigger: "system (cascade link 3 from RecallOrder enforce)"
        actor: system
        preconditions: []
        side_effects: ["same as SHIPPED -> RECALLED"]
        note: "A lot already DEPLETED stays DEPLETED under recall; a lot whose plantings were recalled but which still had availability reaches RECALLED with plants_available = 0."

  - entity: Planting
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED, RECALLED]
    transitions:
      - from: PLANNED
        to: PLANTED
        trigger: "POST /licensing/plantings/{plantingId}/confirm"
        actor: GrowerPrincipal
        preconditions:
          - "Caller owns the planting's agreement's grower (ERR_NOT_OWN_RESOURCE)"
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "planted_on within [agreement.effective_from, agreement.effective_to] inclusive (ERR_PLANTING_WINDOW_VIOLATION)"
          - "planted_on <= current logical clock (ERR_INVALID_REQUEST)"
          - "plants_planted_actual <= agreement.max_planting_units - agreement.units_planted (ERR_PLANTING_QUOTA_EXCEEDED)"
          - "plants_planted_actual <= plant_lot.plants_available + this planting's own reserved planned_plants (ERR_LOT_QUANTITY_EXCEEDED)"
          - "harvest window selection non-empty (ERR_NO_HARVEST_WINDOW)"
          - "window.booked_volume_kg + expected_yield_kg <= window.target_volume_kg * WINDOW_OVERSUBSCRIBE_PCT (ERR_WINDOW_CAPACITY_EXCEEDED)"
        side_effects:
          - "plant_lot.plants_reserved -= planned_plants; plant_lot.plants_planted += plants_planted_actual"
          - "plant_lot.status SHIPPED -> PLANTED, and -> DEPLETED if plants_planted + plants_destroyed == quantity_plants (royalty final computed)"
          - "agreement.units_planted += plants_planted_actual; increments Planting.version by 1"
          - "expected_first_harvest and expected_yield_kg computed; harvest_window_id set; window.booked_volume_kg += expected_yield_kg"
      - from: PLANTED
        to: HARVESTING
        trigger: "system (first HarvestLot created for this planting)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HARVESTING
        to: COMPLETED
        trigger: "POST /licensing/plantings/{plantingId}/complete"
        actor: GrowerPrincipal
        preconditions:
          - "Caller owns the planting's agreement's grower (ERR_NOT_OWN_RESOURCE)"
          - "Every HarvestLot of this planting has lot_status in {GRADED, SETTLED, REJECTED} (ERR_INVALID_STATE)"
        side_effects: ["completed_at = logical clock", "increments Planting.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade link 2 from Grower exit)"
        actor: system
        preconditions: []
        side_effects: ["plant_lot.plants_reserved -= planned_plants"]
      - from: PLANNED
        to: RECALLED
        trigger: "system (cascade link 1 from RecallOrder enforce)"
        actor: system
        preconditions: []
        side_effects:
          - "plant_lot.plants_reserved -= planned_plants (plants never shipped to ground; reservation only)"
          - "recall_compensation_cents = 0"
          - "recalled_at = logical clock"
      - from: PLANTED
        to: RECALLED
        trigger: "system (cascade link 1 from RecallOrder enforce)"
        actor: system
        preconditions: []
        side_effects:
          - "plant_lot.plants_planted -= plants_planted_actual; plant_lot.plants_destroyed += plants_planted_actual"
          - "harvest window unbooked: window.booked_volume_kg -= expected_yield_kg"
          - "agreement.units_planted -= plants_planted_actual"
          - "recall_compensation_cents = plants_planted_actual * recall_order.compensation_per_plant_cents"
          - "recalled_at = logical clock"
      - from: HARVESTING
        to: RECALLED
        trigger: "system (cascade link 1 from RecallOrder enforce)"
        actor: system
        preconditions: []
        side_effects: ["same as PLANTED -> RECALLED"]
        note: "HarvestLots already received keep their lifecycle; recall destroys plants in the ground, not picked fruit."

  - entity: HarvestLot
    initial_state: IN_TRANSIT   # lot_status dimension; grade_status starts UNGRADED — parallel dimensions
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /licensing/harvest-lots/{harvestLotId}/receive"
        actor: CoolingOperator
        preconditions:
          - "received_at > harvested_at and received_at <= current logical clock (ERR_INVALID_REQUEST)"
        side_effects:
          - "received_at, pulp_temp_c_at_receipt set; received_by_user_id = X-User-ID"
          - "precool_hours and cold_chain_compliant computed per cold_chain_evaluation"
          - "if pulp_temp_c_at_receipt > PULP_TEMP_HARD_REJECT_C: lot_status = REJECTED instead of RECEIVED (auto hard reject; grade_status stays UNGRADED and locks)"
      - from: RECEIVED
        to: GRADED
        trigger: "system (grade_status enters CERTIFIED with grade != REJECT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "system (grade_status enters CERTIFIED with grade == REJECT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRADED
        to: SETTLED
        trigger: "system (pool settle of the lot's pool)"
        actor: system
        preconditions: []
        side_effects: ["lot_gross_final_cents set"]
      # --- parallel grade dimension (grade_status) ---
      - from: UNGRADED
        to: SUBMITTED
        trigger: "POST /licensing/harvest-lots/{harvestLotId}/grade"
        actor: QualityGrader
        preconditions: ["lot_status == RECEIVED (ERR_LOT_NOT_RECEIVED)"]
        side_effects:
          - "grade and pack_designation computed per grade_determination"
          - "grade_version = 1; submitted_by_user_id = X-User-ID; grade_submitted_at = logical clock"
        note: "grade dimension"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /licensing/harvest-lots/{harvestLotId}/certify-grade"
        actor: QualityGrader
        preconditions:
          - "X-User-ID != submitted_by_user_id AND X-User-ID != received_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "lot_status RECEIVED -> GRADED, or RECEIVED -> REJECTED when grade == REJECT"
        note: "grade dimension; four-eyes segregation of duties"
      - from: CERTIFIED
        to: DISPUTED
        trigger: "POST /licensing/harvest-lots/{harvestLotId}/dispute-grade"
        actor: GrowerPrincipal
        preconditions:
          - "Caller owns the planting's agreement's grower (ERR_NOT_OWN_RESOURCE)"
          - "lot_status != SETTLED (ERR_INVALID_STATE)"
        side_effects: ["grade_dispute_reason = request reason"]
        note: "grade dimension"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /licensing/harvest-lots/{harvestLotId}/grade (regrade)"
        actor: QualityGrader
        preconditions: ["lot_status == RECEIVED (ERR_LOT_NOT_RECEIVED)"]
        side_effects:
          - "New scores replace prior scores; grade recomputed"
          - "grade_version += 1; submitted_by_user_id and grade_submitted_at refreshed; certified_by_user_id reset to null"
        note: "grade dimension; cyclic regrade loop SUBMITTED -> CERTIFIED -> DISPUTED -> SUBMITTED"

  - entity: PoolPeriod
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /licensing/pool-periods/{poolPeriodId}/close"
        actor: SettlementOfficer
        preconditions:
          - "Every HarvestLot whose planting's variety has berry_type == pool.berry_type and pool.week_start <= received_at < pool.week_end has grade_status == CERTIFIED or lot_status == REJECTED (ERR_POOL_HAS_UNGRADED_LOTS)"
        side_effects:
          - "Provisional pool pipeline computed per pool_rate with estimated_price_cents_per_kg"
          - "Included lots (grade_status CERTIFIED, grade != REJECT, received in window): pool_period_id = this pool, lot_gross_provisional_cents set"
          - "One SettlementStatement per grower with >= 1 included lot, status PROVISIONAL, provisional_net_cents set"
          - "closed_at = logical clock; increments PoolPeriod.version by 1"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /licensing/pool-periods/{poolPeriodId}/settle"
        actor: SettlementOfficer
        preconditions: []
        side_effects:
          - "Final pool pipeline recomputed per pool_rate with actual_price_cents_per_kg; remainder allocated per settlement_statement_net"
          - "Included lots GRADED -> SETTLED with lot_gross_final_cents"
          - "Statements PROVISIONAL -> ISSUED: gross_cents, royalty_offset_cents, cold_chain_deduction_cents, recall_credit_cents, net_cents computed; issued_at = logical clock; dispute_deadline = issued_at + DISPUTE_WINDOW_DAYS days"
          - "settled_at = logical clock; increments PoolPeriod.version by 1"
      - from: SETTLED
        to: PAID
        trigger: "system (compound: every SettlementStatement of this pool is PAID)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Parent state derived from children states"

  - entity: SettlementStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: PROVISIONAL
        to: ISSUED
        trigger: "system (cascade from PoolPeriod settle)"
        actor: system
        preconditions: []
        side_effects: ["final amounts computed; issued_at and dispute_deadline set"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /licensing/settlement-statements/{settlementStatementId}/dispute"
        actor: GrowerPrincipal
        preconditions:
          - "Caller owns the statement's grower (ERR_NOT_OWN_RESOURCE)"
          - "current logical clock <= dispute_deadline (ERR_DISPUTE_WINDOW_EXPIRED)"
        side_effects: ["dispute_reason = request reason", "dispute_count += 1", "increments SettlementStatement.version by 1"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /licensing/settlement-statements/{settlementStatementId}/resolve with resolution=ADJUST"
        actor: SettlementOfficer
        preconditions:
          - "net_cents + adjustment_cents >= 0 (ERR_NEGATIVE_SETTLEMENT)"
          - "adjustment_cents != 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "net_cents += adjustment_cents; adjustment_total_cents += adjustment_cents"
          - "issued_at refreshed to logical clock; dispute_deadline recomputed (dispute window re-opens)"
          - "increments SettlementStatement.version by 1"
        note: "cyclic loop ISSUED -> DISPUTED -> ISSUED"
      - from: DISPUTED
        to: FINAL
        trigger: "POST /licensing/settlement-statements/{settlementStatementId}/resolve with resolution=UPHOLD"
        actor: SettlementOfficer
        preconditions: []
        side_effects: ["increments SettlementStatement.version by 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /licensing/settlement-statements/{settlementStatementId}/pay"
        actor: SettlementOfficer
        preconditions: ["current logical clock > dispute_deadline (ERR_STATEMENT_NOT_PAYABLE)"]
        side_effects: ["paid_at = logical clock", "if last unpaid statement of its pool: pool SETTLED -> PAID"]
      - from: FINAL
        to: PAID
        trigger: "POST /licensing/settlement-statements/{settlementStatementId}/pay"
        actor: SettlementOfficer
        preconditions: []
        side_effects: ["paid_at = logical clock", "if last unpaid statement of its pool: pool SETTLED -> PAID"]

  - entity: RecallOrder
    initial_state: ISSUED
    terminal_states: [COMPLETE]
    transitions:
      - from: ISSUED
        to: COMPLETE
        trigger: "POST /licensing/recall-orders/{recallOrderId}/enforce"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "CASCADE link 1: every Planting whose plant_lot.variety_id == order.variety_id in PLANNED -> RECALLED (reservation released), in PLANTED | HARVESTING -> RECALLED (actuals moved to destroyed, window unbooked, agreement.units_planted debited, compensation set)"
          - "CASCADE link 2: each touched PlantLot recomputes plants_reserved/plants_planted/plants_destroyed/plants_available"
          - "CASCADE link 3: each touched PlantLot with plants_available > 0 -> RECALLED (remainder destroyed; royalty final computed); each HarvestWindow booked_volume_kg recomputed downward"
          - "plantings_recalled_count and total_compensation_cents set; enforced_at = logical clock; increments RecallOrder.version by 1"
        note: "Cascade executes in the pinned order plantings -> lots -> windows; all within the enforce request."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: planting-create-stale-agreement
    parent_entity: GrowerAgreement
    write_endpoint: "POST /licensing/plantings"
    occ_field: expected_agreement_version
    description: |
      Creating a Planting against a GrowerAgreement whose version has advanced
      since the client last observed it is rejected. The agreement is the unit
      of licensed quota; a writer acting on a stale view of it (e.g. after a
      decide or a prior planting creation moved the version) must re-read
      before booking more plantings.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: harvest-lot-create-stale-planting
    parent_entity: Planting
    write_endpoint: "POST /licensing/harvest-lots"
    occ_field: expected_planting_version
    description: |
      Creating a HarvestLot against a Planting whose version has advanced
      since the client last observed it is rejected. Delivery records must be
      written against the current view of the planting (e.g. after a confirm
      or a prior harvest-lot creation moved the version).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (all constants pinned)
# =============================================================================
calculations:
  - name: grade_determination
    trigger: "POST /licensing/harvest-lots/{harvestLotId}/grade (submit or regrade)"
    algorithm: threshold
    formula: |
      # Evaluated top-down; FIRST matching band wins. All bounds inclusive.
      if flavor_brix >= 11.0 and firmness_g >= 350 and appearance_score >= 85 and defect_pct <= 3.0:
        grade = PREMIUM
      elif flavor_brix >= 9.0 and firmness_g >= 300 and appearance_score >= 70 and defect_pct <= 6.0:
        grade = STANDARD
      elif flavor_brix >= 7.0 and firmness_g >= 250 and appearance_score >= 50 and defect_pct <= 12.0:
        grade = PROCESS
      elif flavor_brix >= 5.0 and defect_pct <= 20.0:
        grade = JUICE
      else:
        grade = REJECT
      pack_designation = grade
    input_set: "the four scores submitted in the request body"
    constants:
      PREMIUM_MIN_BRIX: 11.0
      PREMIUM_MIN_FIRMNESS_G: 350
      PREMIUM_MIN_APPEARANCE: 85
      PREMIUM_MAX_DEFECT_PCT: 3.0
      STANDARD_MIN_BRIX: 9.0
      STANDARD_MIN_FIRMNESS_G: 300
      STANDARD_MIN_APPEARANCE: 70
      STANDARD_MAX_DEFECT_PCT: 6.0
      PROCESS_MIN_BRIX: 7.0
      PROCESS_MIN_FIRMNESS_G: 250
      PROCESS_MIN_APPEARANCE: 50
      PROCESS_MAX_DEFECT_PCT: 12.0
      JUICE_MIN_BRIX: 5.0
      JUICE_MAX_DEFECT_PCT: 20.0
    precision: "scores compared as given; brix and defect_pct are decimal"

  - name: cold_chain_evaluation
    trigger: "POST /licensing/harvest-lots/{harvestLotId}/receive"
    algorithm: threshold
    formula: |
      precool_hours = round_half_up((received_at - harvested_at) in seconds / 3600, 2)
      if pulp_temp_c_at_receipt > PULP_TEMP_HARD_REJECT_C:
        lot_status = REJECTED            # hard reject; no grading possible
      cold_chain_compliant = (precool_hours <= PRECOOL_MAX_HOURS) and (pulp_temp_c_at_receipt <= PULP_TEMP_COMPLIANT_MAX_C)
      # Non-compliant but not hard-rejected lots stay gradeable; the breach is
      # monetized as COLD_CHAIN_BREACH_DEDUCTION_PCT of lot gross at settle.
    input_set: "harvested_at, received_at, pulp_temp_c_at_receipt of the lot"
    constants:
      PRECOOL_MAX_HOURS: 8.0
      PULP_TEMP_COMPLIANT_MAX_C: 4.0
      PULP_TEMP_HARD_REJECT_C: 10.0
      COLD_CHAIN_BREACH_DEDUCTION_PCT: 0.08
    precision: "precool_hours 2 decimal places, round_half_up; comparisons on the rounded value"

  - name: expected_yield_and_booking
    trigger: "POST /licensing/plantings/{plantingId}/confirm"
    algorithm: aggregation
    formula: |
      expected_first_harvest = planted_on + DAYS_TO_FIRST_HARVEST[berry_type] days
      expected_yield_kg = plants_planted_actual * YIELD_KG_PER_PLANT[berry_type]
      # Window selector (deterministic, no id usage):
      #   eligibility: HarvestWindow.variety_id == planting's variety
      #                AND HarvestWindow.region_code == planting.region_code
      #                AND week_start <= expected_first_harvest < week_end   (half-open)
      #   overlap rule guarantees at most one eligible window;
      #   empty set -> ERR_NO_HARVEST_WINDOW
      # Capacity gate: window.booked_volume_kg + expected_yield_kg
      #   <= window.target_volume_kg * WINDOW_OVERSUBSCRIBE_PCT  (inclusive bound)
    input_set: "planting's berry_type (via plant lot), plants_planted_actual, planted_on, region_code"
    constants:
      YIELD_KG_PER_PLANT: { STRAWBERRY: 2.5, RASPBERRY: 1.8, BLACKBERRY: 2.0, BLUEBERRY: 3.0 }
      DAYS_TO_FIRST_HARVEST: { STRAWBERRY: 60, RASPBERRY: 75, BLACKBERRY: 90, BLUEBERRY: 120 }
      WINDOW_OVERSUBSCRIBE_PCT: 1.20
    precision: "yield in kg as decimal; day arithmetic on whole days from planted_on"

  - name: royalty_charge
    trigger: "PlantLot creation (provisional) and PlantLot reaching DEPLETED or RECALLED (final)"
    algorithm: tiered_pricing
    formula: |
      # PROVISIONAL variant (at creation):
      royalty_provisional_cents = quantity_plants * ROYALTY_BASE_CENTS_PER_PLANT
      # FINAL variant (at DEPLETED/RECALLED): tiered marginal allocation over the
      # cumulative counter C(variety_id, season_year) built from all lots of the
      # same variety and season year, ordered by (shipped_at ASC, created_at ASC).
      # The lot occupies positions (C_before, C_before + quantity_plants]; each
      # plant is charged the rate of the tier its position falls in:
      #   positions 1..TIER1_LIMIT            -> TIER1_RATE
      #   positions TIER1_LIMIT+1..TIER2_LIMIT -> TIER2_RATE
      #   positions beyond TIER2_LIMIT        -> TIER3_RATE
      royalty_adjustment_cents = royalty_final_cents - royalty_provisional_cents
    input_set: "all PlantLots with same variety_id and season_year, any status except none excluded (RECALLED lots count: material was distributed)"
    constants:
      ROYALTY_BASE_CENTS_PER_PLANT: 45
      TIER1_LIMIT: 100000
      TIER1_RATE: 45
      TIER2_LIMIT: 500000
      TIER2_RATE: 38
      TIER3_RATE: 30
    precision: "integer cents; no rounding"
    variants:
      - name: provisional_flat
        when: "at PlantLot creation"
        difference: "flat ROYALTY_BASE_CENTS_PER_PLANT per plant, ignores tier counter position"
      - name: final_tiered
        when: "at DEPLETED or RECALLED"
        difference: "marginal tier rates by cumulative position; differs from provisional whenever the lot crosses a tier boundary"

  - name: pool_rate
    trigger: "PoolPeriod close (provisional, estimated price) and settle (final, actual price)"
    algorithm: weighted_scoring
    formula: |
      # Pinned evaluation order (circular-looking dependency made explicit):
      # (1) total_net_kg        = sum(net_kg) over included lots
      # (2) total_weighted_kg   = sum(net_kg * GRADE_WEIGHT[grade]) over included lots
      # (3) gross_pool_revenue_cents = round_half_up(total_net_kg * price, 0)
      # (4) marketing_fee_cents      = round_half_up(gross_pool_revenue_cents * MARKETING_FEE_PCT, 0)
      # (5) net_pool_revenue_cents   = gross_pool_revenue_cents - marketing_fee_cents
      # (6) base_rate = round_half_up(net_pool_revenue_cents / total_weighted_kg, 4)
      # (7) pool_rate = is_shoulder_week ? round_half_up(base_rate * SHOULDER_WEEK_MULTIPLIER, 4) : base_rate
      # (8) pool_distributable_cents = round_half_up(net_pool_revenue_cents * (is_shoulder_week ? SHOULDER_WEEK_MULTIPLIER : 1.0), 0)
      # Steps (3)-(5) MUST precede (6): the fee is carved out of gross revenue
      # before the rate is derived; the rate is never an input to the fee.
    input_set: "HarvestLots with grade_status == CERTIFIED, grade != REJECT, planting's variety berry_type == pool.berry_type, and pool.week_start <= received_at < pool.week_end (half-open)"
    constants:
      GRADE_WEIGHT: { PREMIUM: 1.15, STANDARD: 1.00, PROCESS: 0.55, JUICE: 0.25 }
      MARKETING_FEE_PCT: 0.06
      SHOULDER_WEEK_MULTIPLIER: 1.10
    precision: "rates 4 decimal places round_half_up; money integer cents round_half_up"
    variants:
      - name: provisional
        when: "at close, with estimated_price_cents_per_kg"
        difference: "produces provisional_pool_rate and provisional statement nets"
      - name: final
        when: "at settle, with actual_price_cents_per_kg"
        difference: "produces final_pool_rate and final statement amounts; identical inputs with a different price give different money"

  - name: settlement_statement_net
    trigger: "PoolPeriod settle (per statement) and resolve ADJUST (manual)"
    algorithm: waterfall_allocation
    formula: |
      # Per-lot rounding THEN sum (pinned order; NOT sum-then-round):
      #   lot_gross_final_cents[lot] = round_half_up(net_kg * GRADE_WEIGHT[grade] * pool_rate, 0)
      # Remainder reconciliation (pool zero-sum invariant):
      #   remainder = pool_distributable_cents - sum(lot_gross_final_cents)
      #   remainder is added (may be negative) to the included lot with the
      #   largest weighted kg; tie-break: earliest received_at, then earliest created_at.
      # Statement assembly per grower:
      #   gross_cents = sum(lot_gross_final_cents) over grower's included lots
      #   cold_chain_deduction_cents = sum(round_half_up(lot_gross_final_cents * COLD_CHAIN_BREACH_DEDUCTION_PCT, 0))
      #       over grower's included lots with cold_chain_compliant == false
      #   royalty_offset_cents = sum(royalty_adjustment_cents) over grower's PlantLots
      #       with depleted_at in [pool.week_start, pool.week_end)
      #   recall_credit_cents = sum(recall_compensation_cents) over grower's plantings
      #       with recalled_at in [pool.week_start, pool.week_end)
      #   net_cents = gross_cents - royalty_offset_cents - cold_chain_deduction_cents + recall_credit_cents
      # Provisional statement at close uses the same shape with provisional rate and lots.
    input_set: "included lots of the pool grouped by grower; grower's plant lots depleted in window; grower's plantings recalled in window"
    constants:
      COLD_CHAIN_BREACH_DEDUCTION_PCT: 0.08
      DISPUTE_WINDOW_DAYS: 14
    precision: "per-lot round_half_up to integer cents first, then summed; deductions rounded per lot"

  - name: recall_compensation
    trigger: "RecallOrder enforce (per planting recalled from PLANTED | HARVESTING)"
    algorithm: aggregation
    formula: |
      recall_compensation_cents[planting] = plants_planted_actual * compensation_per_plant_cents
      # Plantings recalled from PLANNED compensate 0 (plants never entered the ground).
      total_compensation_cents[order] = sum over plantings recalled by this enforce
    input_set: "plantings of the recalled variety in PLANTED | HARVESTING at enforce time"
    constants:
      DEFAULT_COMPENSATION_PER_PLANT_CENTS: 22
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint per §1.5/§1.7 (a GrowerPrincipal creating a PlantLot is the propagation-prohibition denial)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: GrowerPrincipal's X-User-ID equals the grower_id of the target resource chain (agreement / planting / harvest lot / statement)", error_id: ERR_NOT_OWN_RESOURCE, http_status: 403, applies_to: "grower-scoped write endpoints" }
  - { priority: 4, category: existence, check: "Path and body-referenced ids exist (variety, grower, agreement, plant lot, planting, harvest window, harvest lot, pool, statement, recall order)", error_id: "ERR_VARIETY_NOT_FOUND | ERR_GROWER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_PLANT_LOT_NOT_FOUND | ERR_PLANTING_NOT_FOUND | ERR_HARVEST_LOT_NOT_FOUND | ERR_NOT_FOUND", http_status: 404, applies_to: "endpoints with path ids or id-bearing bodies, validated left-to-right" }
  - { priority: 5, category: business_constraint, check: "Malformed body: missing required fields, bad enum members, non-positive numbers, effective_to <= effective_from, week_end <= week_start, tare >= gross, received_at <= harvested_at, harvested_at or planted_on in the future", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 6, category: business_constraint, check: "OCC: expected_agreement_version / expected_planting_version must equal the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /licensing/plantings, POST /licensing/harvest-lots" }
  - { priority: 7, category: state, check: "Target resource in a valid state for the transition (generic ERR_INVALID_STATE) plus domain state gates: variety RELEASED for decide-APPROVE (ERR_VARIETY_NOT_RELEASED); grower ACTIVE for decide-APPROVE and agreement creation (ERR_GROWER_NOT_ACTIVE); agreement ACTIVE for plant-lot creation, planting creation and confirm (ERR_AGREEMENT_NOT_ACTIVE); lot RECEIVED for grade submission (ERR_LOT_NOT_RECEIVED); statement ISSUED for dispute (ERR_STATEMENT_NOT_DISPUTABLE); statement payable state for pay (ERR_STATEMENT_NOT_PAYABLE)", error_id: "ERR_INVALID_STATE | ERR_VARIETY_NOT_RELEASED | ERR_GROWER_NOT_ACTIVE | ERR_AGREEMENT_NOT_ACTIVE | ERR_LOT_NOT_RECEIVED | ERR_STATEMENT_NOT_DISPUTABLE | ERR_STATEMENT_NOT_PAYABLE", http_status: 409, applies_to: "state-transition endpoints" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: certifier X-User-ID differs from both submitted_by_user_id and received_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /licensing/harvest-lots/{harvestLotId}/certify-grade" }
  - { priority: 9, category: business_referential, check: "Referenced variety not RECALLED (agreement create, plant-lot create, planting create); plant lot's variety matches the agreement's variety at planting creation", error_id: "ERR_VARIETY_RECALLED | ERR_LOT_VARIETY_MISMATCH", http_status: 422, applies_to: "POST /licensing/agreements, POST /licensing/plant-lots, POST /licensing/plantings" }
  - { priority: 10, category: business_temporal, check: "Temporal rules: agreement window overlap on same (grower_id, variety_id) with CLOSED intervals (adjacent boundary day = overlap); harvest-window overlap on same (region_code, variety_id) with HALF-OPEN intervals (adjacency allowed); pool window overlap on same berry_type (half-open); harvest window exists covering expected_first_harvest; planted_on inside agreement window; dispute before deadline; harvested_at >= planted_on", error_id: "ERR_AGREEMENT_WINDOW_OVERLAP | ERR_HARVEST_WINDOW_OVERLAP | ERR_POOL_WINDOW_OVERLAP | ERR_NO_HARVEST_WINDOW | ERR_PLANTING_WINDOW_VIOLATION | ERR_DISPUTE_WINDOW_EXPIRED | ERR_HARVEST_BEFORE_PLANTING", http_status: 422, applies_to: "window/agreement/pool creation, planting confirm, harvest-lot creation, statement dispute" }
  - { priority: 11, category: business_constraint, check: "Quota/capacity/aggregate gates: exclusive_marketing must be true; planting creation reserves against lot availability (planned_plants <= plants_available); planting confirm re-checks actual against lot availability after releasing its own reservation and against the agreement quota; window oversubscribe cap 1.20x target; pool close requires all in-window lots certified-or-rejected; grower exit blocked by live plantings / unpaid statements", error_id: "ERR_EXCLUSIVE_MARKETING_REQUIRED | ERR_PLANTING_QUOTA_EXCEEDED | ERR_LOT_QUANTITY_EXCEEDED | ERR_WINDOW_CAPACITY_EXCEEDED | ERR_POOL_HAS_UNGRADED_LOTS | ERR_GROWER_HAS_LIVE_PLANTINGS | ERR_GROWER_HAS_UNSETTLED_STATEMENTS", http_status: 409, applies_to: "agreement create, planting create/confirm, pool close, grower exit" }
  - { priority: 12, category: business_fiscal, check: "Resolve ADJUST must not drive net_cents below 0; adjustment_cents != 0 (400)", error_id: ERR_NEGATIVE_SETTLEMENT, http_status: 422, applies_to: "POST /licensing/settlement-statements/{settlementStatementId}/resolve" }

# =============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock used by every timestamp comparison in the system. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z (server startup default; never falls back to wall-clock time)."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock advanced to current_utc"]

  # --- Variety ---
  - method: POST
    path: "/licensing/varieties"
    description: "Register a proprietary variety (starts DEVELOPMENT)"
    roles: [BreedingManager]
    code: 201
    input: [variety_code, berry_type, name]
    output: Variety
    side_effects: ["status=DEVELOPMENT"]
  - method: GET
    path: "/licensing/varieties/{varietyId}"
    description: "Get a variety"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: Variety
    side_effects: []
  - method: POST
    path: "/licensing/varieties/{varietyId}/release"
    description: "Release a variety for licensing (DEVELOPMENT -> RELEASED)"
    roles: [BreedingManager]
    code: 200
    input: []
    output: Variety
    side_effects: ["status -> RELEASED, released_at set"]
  - method: POST
    path: "/licensing/varieties/{varietyId}/recall"
    description: "Recall a released variety; creates a RecallOrder in ISSUED"
    roles: [BreedingManager]
    code: 201
    input: [reason, destroy_before, "compensation_per_plant_cents?"]
    output: RecallOrder
    side_effects: ["Variety RELEASED -> RECALLED", "RecallOrder created ISSUED"]
  - method: GET
    path: "/licensing/varieties/{id}/recall-orders"
    description: "List recall orders of a variety"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecallOrder[]"
    side_effects: []

  # --- Grower ---
  - method: POST
    path: "/licensing/growers"
    description: "Onboard an independent grower (starts ACTIVE)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, region_code]
    output: Grower
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/licensing/growers/{growerId}/suspend"
    description: "Suspend a grower; ACTIVE agreements cascade to SUSPENDED"
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Grower
    side_effects: ["Grower ACTIVE -> SUSPENDED", "agreements ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/licensing/growers/{growerId}/exit"
    description: "Exit a grower; terminates agreements, cancels PLANNED plantings, releases lot reservations"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Grower
    side_effects: ["Grower -> EXITED", "agreements ACTIVE|SUSPENDED -> TERMINATED", "PLANNED plantings -> CANCELLED", "lot reservations released"]

  # --- GrowerAgreement ---
  - method: POST
    path: "/licensing/agreements"
    description: "Apply for a variety license agreement (starts PENDING_REVIEW)"
    roles: [GrowerPrincipal]
    code: 201
    input: [grower_id, variety_id, region_code, max_planting_units, cultural_practice_codes, effective_from, effective_to, exclusive_marketing]
    output: GrowerAgreement
    side_effects: ["status=PENDING_REVIEW"]
  - method: GET
    path: "/licensing/agreements/{agreementId}"
    description: "Get an agreement"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: GrowerAgreement
    side_effects: []
  - method: GET
    path: "/licensing/agreements"
    description: "List agreements with filters and pagination"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["grower_id?", "variety_id?", "status?", "limit?", "offset?"]
    output: "GrowerAgreement[]"
    side_effects: []
  - method: POST
    path: "/licensing/agreements/{agreementId}/decide"
    description: "Approve (-> ACTIVE) or reject (-> REJECTED) a pending agreement"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "reason?"]
    output: GrowerAgreement
    side_effects: ["status -> ACTIVE | REJECTED", "decided_at set", "increments GrowerAgreement.version by 1"]

  # --- PlantLot ---
  - method: POST
    path: "/licensing/plant-lots"
    description: "Ship a lot of plant material from a licensed nursery against an agreement (created SHIPPED; propagation by growers is forbidden by role)"
    roles: [NurseryManager]
    code: 201
    input: [nursery_code, agreement_id, variety_id, quantity_plants]
    output: PlantLot
    side_effects: ["status=SHIPPED", "shipped_at=logical clock", "season_year computed", "royalty_provisional_cents = quantity_plants * 45", "plants_reserved/planted/destroyed = 0, plants_available = quantity_plants"]
  - method: GET
    path: "/licensing/plant-lots/{plantLotId}"
    description: "Get a plant lot"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: PlantLot
    side_effects: []
  - method: GET
    path: "/licensing/plant-lots"
    description: "List plant lots with filters and pagination"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["agreement_id?", "variety_id?", "status?", "limit?", "offset?"]
    output: "PlantLot[]"
    side_effects: []

  # --- Planting ---
  - method: POST
    path: "/licensing/plantings"
    description: "Plan a planting from a plant lot under an agreement (OCC on agreement version)"
    roles: [GrowerPrincipal]
    code: 201
    input: [agreement_id, plant_lot_id, planned_plants, expected_agreement_version]
    output: Planting
    side_effects: ["status=PLANNED", "plant_lot.plants_reserved += planned_plants", "increments GrowerAgreement.version by 1"]
  - method: GET
    path: "/licensing/plantings/{plantingId}"
    description: "Get a planting"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: Planting
    side_effects: []
  - method: GET
    path: "/licensing/plantings"
    description: "List plantings with filters and pagination"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["agreement_id?", "plant_lot_id?", "harvest_window_id?", "status?", "limit?", "offset?"]
    output: "Planting[]"
    side_effects: []
  - method: POST
    path: "/licensing/plantings/{plantingId}/confirm"
    description: "Confirm actual planting (PLANNED -> PLANTED); computes yield, books the harvest window"
    roles: [GrowerPrincipal]
    code: 200
    input: [plants_planted_actual, planted_on]
    output: Planting
    side_effects: ["lot reservation released, plants_planted += actual", "lot may reach PLANTED/DEPLETED (royalty final on DEPLETED)", "agreement.units_planted += actual", "window booked_volume_kg += expected_yield_kg"]
  - method: POST
    path: "/licensing/plantings/{plantingId}/complete"
    description: "Complete harvest for a planting (HARVESTING -> COMPLETED)"
    roles: [GrowerPrincipal]
    code: 200
    input: []
    output: Planting
    side_effects: ["completed_at set"]

  # --- HarvestWindow ---
  - method: POST
    path: "/licensing/harvest-windows"
    description: "Plan a regional supply window for a variety (half-open [week_start, week_end))"
    roles: [PlatformAdmin]
    code: 201
    input: [region_code, variety_id, week_start, week_end, target_volume_kg]
    output: HarvestWindow
    side_effects: ["booked_volume_kg = 0"]
  - method: GET
    path: "/licensing/harvest-windows/{harvestWindowId}"
    description: "Get a harvest window"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: HarvestWindow
    side_effects: []
  - method: GET
    path: "/licensing/harvest-windows"
    description: "List harvest windows with filters and pagination"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["variety_id?", "region_code?", "limit?", "offset?"]
    output: "HarvestWindow[]"
    side_effects: []

  # --- HarvestLot ---
  - method: POST
    path: "/licensing/harvest-lots"
    description: "Record a harvested lot in transit to cooling (OCC on planting version; first lot flips planting PLANTED -> HARVESTING)"
    roles: [GrowerPrincipal]
    code: 201
    input: [planting_id, harvested_at, gross_weight_kg, "tare_weight_kg?", expected_planting_version]
    output: HarvestLot
    side_effects: ["lot_status=IN_TRANSIT, grade_status=UNGRADED", "net_kg computed", "planting PLANTED -> HARVESTING if first lot", "increments Planting.version by 1"]
  - method: GET
    path: "/licensing/harvest-lots/{harvestLotId}"
    description: "Get a harvest lot"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: HarvestLot
    side_effects: []
  - method: GET
    path: "/licensing/harvest-lots"
    description: "List harvest lots with filters and pagination"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["planting_id?", "pool_period_id?", "grade?", "lot_status?", "grade_status?", "limit?", "offset?"]
    output: "HarvestLot[]"
    side_effects: []
  - method: POST
    path: "/licensing/harvest-lots/{harvestLotId}/receive"
    description: "Receive the lot at cooling; records pulp temp, evaluates cold chain (hard reject above 10.0 C)"
    roles: [CoolingOperator]
    code: 200
    input: [received_at, pulp_temp_c_at_receipt]
    output: HarvestLot
    side_effects: ["lot_status IN_TRANSIT -> RECEIVED (or REJECTED on hard reject)", "precool_hours and cold_chain_compliant computed", "received_by_user_id recorded"]
  - method: POST
    path: "/licensing/harvest-lots/{harvestLotId}/grade"
    description: "Submit quality scores (UNGRADED -> SUBMITTED; from DISPUTED acts as regrade -> SUBMITTED with grade_version + 1)"
    roles: [QualityGrader]
    code: 200
    input: [flavor_brix, firmness_g, appearance_score, defect_pct]
    output: HarvestLot
    side_effects: ["grade and pack_designation computed", "grade_submitted_at and submitted_by_user_id set"]
  - method: POST
    path: "/licensing/harvest-lots/{harvestLotId}/certify-grade"
    description: "Certify a submitted grade (SUBMITTED -> CERTIFIED); four-eyes segregation of duties"
    roles: [QualityGrader]
    code: 200
    input: []
    output: HarvestLot
    side_effects: ["certified_by_user_id set", "lot_status RECEIVED -> GRADED (or REJECTED when grade == REJECT)"]
  - method: POST
    path: "/licensing/harvest-lots/{harvestLotId}/dispute-grade"
    description: "Grower disputes a certified grade (CERTIFIED -> DISPUTED)"
    roles: [GrowerPrincipal]
    code: 200
    input: [reason]
    output: HarvestLot
    side_effects: ["grade_dispute_reason set"]

  # --- PoolPeriod ---
  - method: POST
    path: "/licensing/pool-periods"
    description: "Open a weekly settlement pool for a berry type (half-open [week_start, week_end))"
    roles: [SettlementOfficer]
    code: 201
    input: [berry_type, week_start, week_end, is_shoulder_week]
    output: PoolPeriod
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/licensing/pool-periods/{poolPeriodId}"
    description: "Get a pool period with its computed pipeline totals and rates"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: PoolPeriod
    side_effects: []
  - method: POST
    path: "/licensing/pool-periods/{poolPeriodId}/close"
    description: "Close the pool; runs the provisional pipeline with the estimated price and creates PROVISIONAL statements"
    roles: [SettlementOfficer]
    code: 200
    input: [estimated_price_cents_per_kg]
    output: PoolPeriod
    side_effects: ["provisional pool pipeline computed", "included lots stamped with pool_period_id and lot_gross_provisional_cents", "SettlementStatements created PROVISIONAL"]
  - method: POST
    path: "/licensing/pool-periods/{poolPeriodId}/settle"
    description: "Settle the pool with the actual price; final pipeline, remainder allocation, statements PROVISIONAL -> ISSUED"
    roles: [SettlementOfficer]
    code: 200
    input: [actual_price_cents_per_kg]
    output: PoolPeriod
    side_effects: ["final pipeline computed; remainder allocated to largest-weighted lot", "included lots GRADED -> SETTLED", "statements -> ISSUED with final amounts and dispute window"]

  # --- SettlementStatement ---
  - method: GET
    path: "/licensing/settlement-statements/{settlementStatementId}"
    description: "Get a settlement statement"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []
  - method: GET
    path: "/licensing/settlement-statements"
    description: "List settlement statements with filters and pagination"
    roles: [PlatformAdmin, BreedingManager, ComplianceOfficer, NurseryManager, GrowerPrincipal, CoolingOperator, QualityGrader, SettlementOfficer]
    code: 200
    input: ["pool_period_id?", "grower_id?", "status?", "limit?", "offset?"]
    output: "SettlementStatement[]"
    side_effects: []
  - method: POST
    path: "/licensing/settlement-statements/{settlementStatementId}/dispute"
    description: "Grower disputes an ISSUED statement within the 14-day window (ISSUED -> DISPUTED)"
    roles: [GrowerPrincipal]
    code: 200
    input: [reason]
    output: SettlementStatement
    side_effects: ["dispute_reason set", "dispute_count += 1"]
  - method: POST
    path: "/licensing/settlement-statements/{settlementStatementId}/resolve"
    description: "Resolve a dispute: UPHOLD -> FINAL, or ADJUST -> ISSUED with signed adjustment and refreshed dispute window"
    roles: [SettlementOfficer]
    code: 200
    input: [resolution, "adjustment_cents?"]
    output: SettlementStatement
    side_effects: ["ADJUST: net_cents += adjustment_cents, issued_at/dispute_deadline refreshed", "UPHOLD: -> FINAL"]
  - method: POST
    path: "/licensing/settlement-statements/{settlementStatementId}/pay"
    description: "Pay a statement (FINAL -> PAID; or ISSUED -> PAID once the dispute deadline has passed)"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["paid_at set", "pool SETTLED -> PAID when its last statement is PAID"]

  # --- RecallOrder ---
  - method: POST
    path: "/licensing/recall-orders/{recallOrderId}/enforce"
    description: "Enforce a recall: plantings of the variety RECALLED, unplanted lot remainders destroyed, windows unbooked, compensation computed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecallOrder
    side_effects: ["plantings PLANNED|PLANTED|HARVESTING -> RECALLED", "lots with remainder -> RECALLED (royalty final computed)", "window booked volumes reduced", "order ISSUED -> COMPLETE with counts and total compensation"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role unrecognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint (e.g. GrowerPrincipal attempting to create a PlantLot — propagation prohibition)" }
  - { id: ERR_NOT_OWN_RESOURCE, http: 403, condition: "GrowerPrincipal X-User-ID does not equal the owning grower id of the target resource" }
  - { id: ERR_VARIETY_NOT_FOUND, http: 404, condition: "No variety with the given id" }
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "No grower with the given id" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "No agreement with the given id" }
  - { id: ERR_PLANT_LOT_NOT_FOUND, http: 404, condition: "No plant lot with the given id" }
  - { id: ERR_PLANTING_NOT_FOUND, http: 404, condition: "No planting with the given id" }
  - { id: ERR_HARVEST_LOT_NOT_FOUND, http: 404, condition: "No harvest lot with the given id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "No harvest window, pool period, settlement statement, or recall order with the given id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum member, non-positive quantity, inverted window, tare >= gross, or future-dated planted_on/harvested_at/received_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version / expected_planting_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits the requested transition (covers terminal-state lockdown and double transitions)" }
  - { id: ERR_VARIETY_NOT_RELEASED, http: 409, condition: "decide APPROVE on an agreement whose variety is still DEVELOPMENT" }
  - { id: ERR_GROWER_NOT_ACTIVE, http: 409, condition: "Grower not ACTIVE for agreement creation or decide APPROVE" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement not ACTIVE for plant-lot creation, planting creation, or planting confirm" }
  - { id: ERR_LOT_NOT_RECEIVED, http: 409, condition: "Grade submission on a lot whose lot_status is not RECEIVED" }
  - { id: ERR_STATEMENT_NOT_DISPUTABLE, http: 409, condition: "Dispute on a statement not in ISSUED (state gate, checked before the deadline gate)" }
  - { id: ERR_STATEMENT_NOT_PAYABLE, http: 409, condition: "Pay on a statement in PROVISIONAL/DISPUTED, or ISSUED before its dispute deadline" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Certifier X-User-ID equals the lot's submitted_by_user_id or received_by_user_id" }
  - { id: ERR_VARIETY_RECALLED, http: 422, condition: "Agreement, plant lot, or planting references a variety in RECALLED" }
  - { id: ERR_LOT_VARIETY_MISMATCH, http: 422, condition: "Planting's plant lot variety differs from its agreement's variety" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 422, condition: "Agreement effective window overlaps another non-terminal agreement of the same (grower_id, variety_id); closed intervals — sharing a boundary day counts as overlap" }
  - { id: ERR_HARVEST_WINDOW_OVERLAP, http: 422, condition: "Harvest window overlaps another window of the same (region_code, variety_id); half-open intervals — pure adjacency (a.week_end == b.week_start) is allowed" }
  - { id: ERR_POOL_WINDOW_OVERLAP, http: 422, condition: "Pool window overlaps another pool of the same berry_type; half-open intervals" }
  - { id: ERR_NO_HARVEST_WINDOW, http: 422, condition: "No harvest window covers the planting's expected_first_harvest for its (region_code, variety)" }
  - { id: ERR_PLANTING_WINDOW_VIOLATION, http: 422, condition: "planted_on outside [agreement.effective_from, agreement.effective_to]" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "Statement dispute after dispute_deadline (logical clock > issued_at + 14 days)" }
  - { id: ERR_HARVEST_BEFORE_PLANTING, http: 422, condition: "harvested_at earlier than the planting's planted_on" }
  - { id: ERR_EXCLUSIVE_MARKETING_REQUIRED, http: 409, condition: "Agreement created with exclusive_marketing = false" }
  - { id: ERR_PLANTING_QUOTA_EXCEEDED, http: 409, condition: "Confirm would push agreement.units_planted past max_planting_units" }
  - { id: ERR_LOT_QUANTITY_EXCEEDED, http: 409, condition: "Planting create planned_plants exceeds the lot's available plants, or confirm actual exceeds availability after releasing this planting's own reservation" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "Booking would push window booked_volume_kg past 1.20x target_volume_kg" }
  - { id: ERR_POOL_HAS_UNGRADED_LOTS, http: 409, condition: "Pool close while an in-window lot is neither CERTIFIED nor REJECTED" }
  - { id: ERR_GROWER_HAS_LIVE_PLANTINGS, http: 409, condition: "Grower exit while any of its plantings is PLANTED or HARVESTING" }
  - { id: ERR_GROWER_HAS_UNSETTLED_STATEMENTS, http: 409, condition: "Grower exit while any of its statements is not PAID" }
  - { id: ERR_NEGATIVE_SETTLEMENT, http: 422, condition: "Resolve ADJUST would drive statement net_cents below 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Brand platform operator; owns growers onboarding, harvest-window planning, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /licensing/growers"
      - "POST /licensing/harvest-windows"
    shared_operations: ["all GET endpoints"]
  - name: BreedingManager
    description: "Breeding program manager; owns variety registration, release, and recall issuance"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/varieties"
      - "POST /licensing/varieties/{varietyId}/release"
      - "POST /licensing/varieties/{varietyId}/recall"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Network compliance; decides agreements, suspends/exits growers, enforces recalls"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/growers/{growerId}/suspend"
      - "POST /licensing/growers/{growerId}/exit"
      - "POST /licensing/agreements/{agreementId}/decide"
      - "POST /licensing/recall-orders/{recallOrderId}/enforce"
    shared_operations: ["all GET endpoints"]
  - name: NurseryManager
    description: "Licensed nursery operator; the ONLY role that may create plant lots (propagation prohibition)"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/plant-lots"
    shared_operations: ["all GET endpoints"]
  - name: GrowerPrincipal
    description: "Principal of an independent grower; applies for agreements and operates plantings, harvest lots, and disputes for ITS OWN grower id only"
    identity: "entity_backed:Grower"
    exclusive_operations:
      - "POST /licensing/agreements"
      - "POST /licensing/plantings"
      - "POST /licensing/plantings/{plantingId}/confirm"
      - "POST /licensing/plantings/{plantingId}/complete"
      - "POST /licensing/harvest-lots"
      - "POST /licensing/harvest-lots/{harvestLotId}/dispute-grade"
      - "POST /licensing/settlement-statements/{settlementStatementId}/dispute"
    shared_operations: ["all GET endpoints"]
  - name: CoolingOperator
    description: "Cooling facility receiving operator; records lot receipt and pulp temperature"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/harvest-lots/{harvestLotId}/receive"
    shared_operations: ["all GET endpoints"]
  - name: QualityGrader
    description: "Quality grader at the cooling facility; submits and certifies grades. Segregation of duties: the certifier must differ from both the submitting grader and the receiving operator"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/harvest-lots/{harvestLotId}/grade"
      - "POST /licensing/harvest-lots/{harvestLotId}/certify-grade"
    shared_operations: ["all GET endpoints"]
  - name: SettlementOfficer
    description: "Pool settlement operator; opens/closes/settles pools, resolves and pays statements"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/pool-periods"
      - "POST /licensing/pool-periods/{poolPeriodId}/close"
      - "POST /licensing/pool-periods/{poolPeriodId}/settle"
      - "POST /licensing/settlement-statements/{settlementStatementId}/resolve"
      - "POST /licensing/settlement-statements/{settlementStatementId}/pay"
    shared_operations: ["all GET endpoints"]
