              captures: { w_unit_status: "$.data.status" }
          assert:
            - "${w_exp} == 2026-08-28T00:00:00Z and ${w_status} == OFFERED in setup - seventy-two hours after the run"
            - "the first acceptance returns HTTP 409 with ${w_e1} == ERR_OFFER_WINDOW_CLOSED - one second past the deadline"
            - "the second acceptance returns HTTP 200 with ${w_ok} == ACCEPTED and ${w_unit} == ${u1_id} - the clock standing exactly at offer_expires_at is still inside the window"
