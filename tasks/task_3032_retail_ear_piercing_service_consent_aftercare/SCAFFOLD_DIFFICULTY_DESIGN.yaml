  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: piercer_adjacency_admitted_on_half_open_slots
        grounds:
          - validations[priority=14]
          - entities.Appointment.fields.slot_start_at
          - entities.Appointment.fields.slot_end_at
        distinguishing_aspect: |
          Half-open semantics: two appointments for the same store and piercer whose intervals touch
          exactly at a boundary do NOT collide, because [start, end) excludes the end instant while
          any overlap of positive duration is rejected.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Store S1 piercer P1 with a CONFIRMED appointment A11 at [09:00, 09:30). Customer C1 has an ACTIVE consent."
