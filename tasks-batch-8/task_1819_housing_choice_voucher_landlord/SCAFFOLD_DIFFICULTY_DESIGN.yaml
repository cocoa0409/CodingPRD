  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_activate_requires_approved_and_lease_date_reached
        grounds:
          - state_machines.HAPContract.APPROVED_to_ACTIVE
          - entities.HAPContract.fields.lease_start_date
        distinguishing_aspect: |
          HAPContract activation is gated by both its own state (APPROVED) and the
          logical clock relative to lease_start_date — a cross-dependency between the
          contract entity and the system clock. Pair: HAPContract <-> Clock.
        test_recipe:
          setup:
            - "Contract APPROVED with lease_start_date 2026-09-01; clock still 2026-08-01"
          setup_api_calls:
            - call: "POST /hcv/landlords"
