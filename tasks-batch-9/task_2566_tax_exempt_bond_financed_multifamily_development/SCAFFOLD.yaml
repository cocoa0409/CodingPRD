scenario: |
  Generate task harder than expert level!

  2566. Tax-Exempt Bond Financed Multifamily Development (bond-financed affordable housing developer): volume cap allocation request and bond issuance through a housing finance agency, fifty-percent aggregate basis financing test to trigger the automatic housing credit, construction period bond draw schedule and negative arbitrage management, income and rent restriction election under the set-aside chosen, construction-to-permanent conversion with debt service coverage and stabilization tests, regulatory agreement recording with compliance period and extended use commitments, cost certification, final allocation and credit delivery to investors, ongoing compliance reporting and physical inspection obligations

domain_name: tax-exempt-bond-multifamily
# All collections are top-level, peer resources linked by explicit foreign keys
# (entity_topology: flat). There is no owning URL prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is addressed at its own top-level collection (/projects,
  # /draw-requests, /credit-allocations, ...). Parent linkage is carried in the
  # request body as an explicit FK field, never in the URL path.

  state_machine_shape: parallel
  # Project carries two independent state axes (development_status x
  # compliance_status). VolumeCapAllocation and CostCertification are cyclic
  # (revision loops); BondIssue and DrawRequest are branching fork machines
  # with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    # Project -> UnitRestriction / VolumeCapAllocation / BondIssue /
    # RegulatoryAgreement / CostCertification / CreditAllocation /
    # ComplianceReport / PhysicalInspection are one_to_many.
    # CapPool <-> VolumeCapAllocation, CostCertification <-> CreditAllocation,
    # Investor <-> InvestorDelivery cross aggregate boundaries.

  role_model: segregation_of_duties
  # The agency user (X-User-ID) who decided a project's volume cap award may
  # not be the agency user who creates that project's final CreditAllocation.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Developer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the bond-financed housing sponsor
      - name: tax_id
        type: string
        source: input
        description: federal employer identification number
        constraints: unique across all Developer rows
      - name: contact_email
        type: string
        source: input
        description: notice address for agency correspondence
      - name: status
        type: enum
        source: system
        description: sanction posture controlling whether new cap awards may be made
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, DEBARRED}"
      - name: sanction_reason
        type: string
        source: system
        description: reason recorded by the last sanction action; null while never sanctioned
        default: null
      - name: active_project_count
        type: integer
        source: computed
        description: "count of Project rows with developer_id == this.id AND development_status != WITHDRAWN"

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: equity investor or syndicator legal name
      - name: tax_id
        type: string
        source: input
        description: federal employer identification number
        constraints: unique across all Investor rows
      - name: investor_type
        type: enum
        source: input
        description: channel through which credit is taken
        constraints: "one of {SYNDICATOR, DIRECT_CORPORATE, FUND}"
      - name: total_credit_accepted_cents
        type: integer
        source: computed
        description: "sum of InvestorDelivery.delivered_credit_cents over deliveries with investor_id == this.id AND status == ACCEPTED"
        default: 0

  - name: CapPool
    parent: null
    common_fields: true
    fields:
      - name: program_year
        type: integer
        source: input
        description: calendar year of the private-activity bond volume cap pool
        constraints: unique across all CapPool rows
      - name: base_cap_cents
        type: integer
        source: input
        description: statutory per-capita volume cap for the program year
        constraints: "> 0"
      - name: carryforward_cents
        type: integer
        source: input
        description: unused cap carried forward from prior program years
        default: 0
        constraints: ">= 0"
      - name: total_cap_cents
        type: integer
        source: computed
        description: "base_cap_cents + carryforward_cents"
      - name: reserved_cents
        type: integer
        source: computed
        description: "sum of VolumeCapAllocation.requested_amount_cents for allocations with cap_pool_id == this.id AND status == PENDING"
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "sum of VolumeCapAllocation.awarded_amount_cents for allocations with cap_pool_id == this.id AND status IN {AWARDED, COMMITTED}"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "total_cap_cents - reserved_cents - committed_cents; may be negative when pending requests oversubscribe the pool"
      - name: awardable_cents
        type: integer
        source: computed
        description: "total_cap_cents - committed_cents; the ceiling every award decision is checked against"
      - name: pool_status
        type: enum
        source: computed
        description: "EXHAUSTED when awardable_cents <= 0; else OVERSUBSCRIBED when available_cents < 0; else OPEN"
        constraints: "one of {OPEN, OVERSUBSCRIBED, EXHAUSTED}"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: FK -> Developer.id; sponsor that owns every developer-role operation on this project
      - name: name
        type: string
        source: input
        description: project trade name
      - name: total_units
        type: integer
        source: input
        description: total residential units in the development, restricted and market alike
        constraints: "> 0"
      - name: total_floor_space_sqft
        type: integer
        source: input
        description: aggregate residential floor space used as the applicable-fraction denominator
        constraints: "> 0"
      - name: land_cost_cents
        type: integer
        source: input
        description: cost of land, part of aggregate basis but never of eligible basis
        constraints: ">= 0"
      - name: depreciable_basis_cents
        type: integer
        source: input
        description: depreciable building and improvement basis as filed at project creation
        constraints: "> 0"
      - name: set_aside_election
        type: enum
        source: input
        description: income and rent restriction election governing the whole project
        constraints: "one of {MIN_20_50, MIN_40_60, AVG_INCOME}"
      - name: aggregate_basis_cents
        type: integer
        source: computed
        description: "land_cost_cents + depreciable_basis_cents; denominator of the provisional fifty-percent test"
      - name: development_status
        type: enum
        source: system
        description: financing and construction axis of the project lifecycle
        default: PLANNING
        constraints: "one of {PLANNING, FINANCED, UNDER_CONSTRUCTION, PLACED_IN_SERVICE, STABILIZED, WITHDRAWN}"
      - name: compliance_status
        type: enum
        source: system
        description: restriction axis of the project lifecycle, independent of development_status
        default: UNRESTRICTED
        constraints: "one of {UNRESTRICTED, RESTRICTED, NONCOMPLIANT, EXTENDED_USE, RELEASED}"
      - name: restricted_unit_count
        type: integer
        source: computed
        description: "count of UnitRestriction rows for this project with designation == RESTRICTED"
        default: 0
      - name: market_unit_count
        type: integer
        source: computed
        description: "count of UnitRestriction rows for this project with designation == MARKET"
        default: 0
      - name: employee_unit_count
        type: integer
        source: computed
        description: "count of UnitRestriction rows for this project with designation == EMPLOYEE_UNIT"
        default: 0
      - name: designated_unit_count
        type: integer
        source: computed
        description: "count of all UnitRestriction rows for this project, regardless of designation"
        default: 0
      - name: unit_fraction_bps
        type: integer
        source: computed
        description: "floor(restricted_unit_count * 10000 / total_units)"
        default: 0
      - name: floor_space_fraction_bps
        type: integer
        source: computed
        description: "floor(sum(UnitRestriction.floor_space_sqft where designation == RESTRICTED) * 10000 / total_floor_space_sqft)"
        default: 0
      - name: applicable_fraction_bps
        type: integer
        source: computed
        description: "min(unit_fraction_bps, floor_space_fraction_bps)"
        default: 0
      - name: set_aside_ratio_bps
        type: integer
        source: computed
        description: "share of total_units that qualifies under set_aside_election; see calculations.set_aside_compliance_ratio"
        default: 0
      - name: set_aside_satisfied
        type: boolean
        source: computed
        description: "true when set_aside_ratio_bps meets the elected threshold (and, for AVG_INCOME, the average AMI ceiling)"
        default: false
      - name: provisional_fifty_percent_ratio_bps
        type: integer
        source: computed
        description: "issuance-variant fifty-percent aggregate basis ratio, stamped when a BondIssue reaches ISSUED; null before then"
        default: null
      - name: final_fifty_percent_ratio_bps
        type: integer
        source: computed
        description: "cost-certification variant of the same ratio, stamped when a CostCertification is ACCEPTED; null before then"
        default: null
      - name: automatic_credit_triggered
        type: boolean
        source: computed
        description: "true while the most recently computed fifty-percent variant is >= 5000 bps; gates final credit allocation"
        default: false
      - name: placed_in_service_date
        type: datetime
        source: system
        description: stamped from the logical clock when the first operating month is recorded on the project's bond issue
        default: null
      - name: compliance_start_date
        type: datetime
        source: system
        description: stamped from BondIssue.conversion_date when the project reaches STABILIZED
        default: null
      - name: compliance_end_date
        type: datetime
        source: system
        description: "compliance_start_date + RegulatoryAgreement.compliance_period_years"
        default: null
      - name: extended_use_end_date
        type: datetime
        source: system
        description: "compliance_start_date + RegulatoryAgreement.extended_use_years"
        default: null
      - name: volume_cap_deferral_count
        type: integer
        source: system
        description: number of times one of this project's allocations was auto-deferred by pool exhaustion
        default: 0
      - name: financing_stalled
        type: boolean
        source: system
        description: true while the project's most recent allocation sits in DEFERRED
        default: false

  - name: VolumeCapAllocation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development the cap is requested for
      - name: cap_pool_id
        type: string
        source: input
        description: FK -> CapPool.id; the program-year pool the request draws from
      - name: requested_amount_cents
        type: integer
        source: input
        description: cap amount the sponsor asks the agency to reserve
        constraints: "> 0"
      - name: requested_closing_date
        type: datetime
        source: input
        description: date the sponsor intends to close the bond issue
      - name: status
        type: enum
        source: system
        description: allocation lifecycle state
        default: PENDING
        constraints: "one of {PENDING, AWARDED, DENIED, DEFERRED, RETURNED, EXPIRED, COMMITTED, RELEASED}"
      - name: awarded_amount_cents
        type: integer
        source: system
        description: cap actually awarded by the agency; null until an AWARD decision
        default: null
      - name: expiry_date
        type: datetime
        source: system
        description: date after which an unused award lapses; null until an AWARD decision
        default: null
      - name: denial_reason
        type: string
        source: system
        description: text recorded by a DENY decision
        default: null
      - name: return_reason
        type: string
        source: system
        description: text recorded when the sponsor voluntarily returns an award
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the agency officer who last decided this allocation; compared against the credit-allocation author for segregation of duties"
        default: null
      - name: decision_round
        type: integer
        source: system
        description: increments by 1 every time the allocation re-enters PENDING through a revision
        default: 1

  - name: BondIssue
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the financed development
      - name: volume_cap_allocation_id
        type: string
        source: input
        description: FK -> VolumeCapAllocation.id; the award that authorizes the par amount
      - name: eligible_cost_cents
        type: integer
        source: input
        description: bond-eligible development costs before capitalized interest
        constraints: "> 0"
      - name: capitalized_interest_cents
        type: integer
        source: input
        description: construction-period interest funded from proceeds
        constraints: ">= 0"
      - name: bond_yield_bps
        type: integer
        source: input
        description: arbitrage yield on the bonds, in basis points
        constraints: "> 0"
      - name: investment_yield_bps
        type: integer
        source: input
        description: yield earned on undrawn proceeds held in the project fund, in basis points
        constraints: ">= 0"
      - name: issuance_allowance_cents
        type: integer
        source: computed
        description: "two percent cost-of-issuance allowance computed on provisional par; see calculations.bond_sizing"
      - name: par_amount_cents
        type: integer
        source: computed
        description: "final par after the issuance allowance and the $5,000 denomination round-up"
      - name: status
        type: enum
        source: system
        description: bond lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, CONVERTED, MANDATORY_REDEEMED}"
      - name: closing_date
        type: datetime
        source: system
        description: date the bonds were delivered; null while DRAFT
        default: null
      - name: cumulative_funded_cents
        type: integer
        source: computed
        description: "sum of DrawRequest.approved_amount_cents for draws on this issue with status == FUNDED"
        default: 0
      - name: undrawn_cents
        type: integer
        source: computed
        description: "par_amount_cents - cumulative_funded_cents"
      - name: negative_arbitrage_cents
        type: integer
        source: computed
        description: "carrying cost of undrawn proceeds; see calculations.negative_arbitrage_cost"
        default: 0
      - name: negative_arbitrage_allowance_cents
        type: integer
        source: computed
        description: "floor(par_amount_cents * NEG_ARB_ALLOWANCE_BPS / 10000); funding is blocked once accrual would exceed it"
      - name: operating_months
        type: array
        source: system
        description: "append-only list of objects {month_index, noi_cents, debt_service_cents, occupied_units} recorded by the sponsor, ordered by month_index ascending"
        default: []
      - name: dscr_bps
        type: integer
        source: computed
        description: "debt service coverage ratio in basis points from the last successful conversion; null before conversion"
        default: null
      - name: dscr_basis
        type: enum
        source: system
        description: "variant used by the successful conversion"
        default: null
        constraints: "one of {T3, T12}"
      - name: min_occupancy_bps
        type: integer
        source: computed
        description: "lowest monthly physical occupancy across the months in the selected DSCR window; null before conversion"
        default: null
      - name: conversion_date
        type: datetime
        source: system
        description: date construction financing converted to permanent; null unless CONVERTED
        default: null
      - name: redemption_date
        type: datetime
        source: system
        description: date of mandatory redemption; null unless MANDATORY_REDEEMED
        default: null

  - name: DrawRequest
    parent: null
    common_fields: true
    fields:
      - name: bond_issue_id
        type: string
        source: input
        description: FK -> BondIssue.id; the issue whose proceeds are drawn
      - name: draw_number
        type: integer
        source: input
        description: sponsor-assigned sequence number, unique per bond issue
        constraints: "> 0; unique per bond_issue_id"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the construction draw period
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the construction draw period
      - name: requested_amount_cents
        type: integer
        source: input
        description: proceeds requested for the period
        constraints: "> 0"
      - name: approved_amount_cents
        type: integer
        source: system
        description: amount the trustee approved; null until an APPROVE decision
        default: null
      - name: status
        type: enum
        source: system
        description: draw lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, FUNDED, REJECTED, VOIDED}"
      - name: funding_date
        type: datetime
        source: system
        description: date proceeds left the project fund; null until FUNDED
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: text recorded by a REJECT decision
        default: null
      - name: void_reason
        type: string
        source: system
        description: text recorded when a funded draw is voided
        default: null
      - name: negative_arbitrage_accrual_cents
        type: integer
        source: computed
        description: "this draw period's rounded share of negative arbitrage; 0 unless status == FUNDED"
        default: 0

  - name: UnitRestriction
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development the unit belongs to
      - name: unit_number
        type: string
        source: input
        description: unit label
        constraints: unique per project_id
      - name: bedroom_count
        type: integer
        source: input
        description: bedrooms in the unit; drives imputed household size
        constraints: ">= 0"
      - name: floor_space_sqft
        type: integer
        source: input
        description: unit floor space, numerator input of the floor-space fraction
        constraints: "> 0"
      - name: designation
        type: enum
        source: input
        description: restriction designation of the unit
        constraints: "one of {RESTRICTED, MARKET, EMPLOYEE_UNIT}"
      - name: ami_percent
        type: integer
        source: input
        description: elected area-median-income band for a restricted unit; required when designation == RESTRICTED, else null
        default: null
        constraints: "one of {20, 30, 40, 50, 60, 70, 80}"
      - name: utility_allowance_cents
        type: integer
        source: input
        description: monthly utility allowance deducted from the gross rent ceiling
        constraints: ">= 0"
      - name: market_rent_cents
        type: integer
        source: input
        description: achievable unrestricted monthly rent for the unit
        constraints: "> 0"
      - name: imputed_household_size
        type: integer
        source: computed
        description: "max(1, bedroom_count + 1)"
      - name: restricted_rent_cents
        type: integer
        source: computed
        description: "maximum monthly tenant-paid rent; null when designation != RESTRICTED"
        default: null
      - name: status
        type: enum
        source: system
        description: restriction activation state
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, RELEASED}"

  - name: RegulatoryAgreement
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development encumbered by the agreement
      - name: set_aside_election
        type: enum
        source: input
        description: set-aside the agreement records; must equal Project.set_aside_election at creation
        constraints: "one of {MIN_20_50, MIN_40_60, AVG_INCOME}"
      - name: compliance_period_years
        type: integer
        source: input
        description: qualified project period in years
        constraints: ">= 15"
      - name: extended_use_years
        type: integer
        source: input
        description: total extended-use commitment in years
        constraints: ">= compliance_period_years + 15"
      - name: recording_county
        type: string
        source: input
        description: county register of deeds where the agreement is recorded
      - name: status
        type: enum
        source: system
        description: recording state of the agreement
        default: DRAFT
        constraints: "one of {DRAFT, RECORDED, AMENDMENT_PENDING, RELEASED}"
      - name: instrument_number
        type: string
        source: system
        description: recorded instrument number; null until first recording
        default: null
      - name: recording_date
        type: datetime
        source: system
        description: date of the most recent recording; null until first recording
        default: null
      - name: amendment_count
        type: integer
        source: system
        description: number of completed amend-then-record cycles
        default: 0
      - name: amendment_reason
        type: string
        source: system
        description: reason recorded by the pending amendment; null when none pending
        default: null
      - name: compliance_period_end_date
        type: datetime
        source: system
        description: "Project.compliance_start_date + compliance_period_years; null before conversion"
        default: null
      - name: extended_use_end_date
        type: datetime
        source: system
        description: "Project.compliance_start_date + extended_use_years; null before conversion"
        default: null

  - name: CostCertification
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development being certified
      - name: certified_land_cost_cents
        type: integer
        source: input
        description: audited land cost
        constraints: ">= 0"
      - name: certified_depreciable_basis_cents
        type: integer
        source: input
        description: audited depreciable basis
        constraints: "> 0"
      - name: certified_eligible_basis_cents
        type: integer
        source: input
        description: audited eligible basis; may not exceed certified_depreciable_basis_cents
        constraints: "> 0 AND <= certified_depreciable_basis_cents"
      - name: preparer_name
        type: string
        source: input
        description: certifying public accountant
      - name: certified_aggregate_basis_cents
        type: integer
        source: computed
        description: "certified_land_cost_cents + certified_depreciable_basis_cents; denominator of the final fifty-percent test"
      - name: status
        type: enum
        source: system
        description: review state of the certification
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED_FOR_REVISION}"
      - name: submission_round
        type: integer
        source: system
        description: increments by 1 on every submit, so a returned-and-resubmitted certification reads 2
        default: 0
      - name: deficiency_notes
        type: string
        source: system
        description: reviewer notes recorded by a RETURN decision
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the compliance officer who last reviewed the certification
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock timestamp of acceptance; null unless ACCEPTED
        default: null

  - name: CreditAllocation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development receiving the credit
      - name: cost_certification_id
        type: string
        source: input
        description: FK -> CostCertification.id; the accepted certification the allocation is computed from
      - name: credit_percentage_bps
        type: integer
        source: input
        description: applicable credit percentage in basis points
        constraints: "> 0 AND <= 1000"
      - name: placed_in_service_date
        type: datetime
        source: input
        description: placed-in-service date certified on the allocation
      - name: qualified_basis_cents
        type: integer
        source: computed
        description: "per-restricted-unit eligible basis floored then summed; see calculations.qualified_basis_and_annual_credit"
      - name: applicable_fraction_bps
        type: integer
        source: computed
        description: "snapshot of Project.applicable_fraction_bps at allocation creation"
      - name: annual_credit_cents
        type: integer
        source: computed
        description: "round_half_up(qualified_basis_cents * credit_percentage_bps / 10000)"
      - name: total_credit_cents
        type: integer
        source: computed
        description: "annual_credit_cents * CREDIT_PERIOD_YEARS"
      - name: delivered_credit_cents
        type: integer
        source: computed
        description: "sum of InvestorDelivery.delivered_credit_cents for this allocation with status IN {DELIVERED, ACCEPTED, RECAPTURE_FLAGGED}"
        default: 0
      - name: undelivered_credit_cents
        type: integer
        source: computed
        description: "total_credit_cents - delivered_credit_cents"
      - name: status
        type: enum
        source: system
        description: allocation lifecycle state
        default: PENDING
        constraints: "one of {PENDING, ISSUED, RECAPTURE_PENDING, RECAPTURED}"
      - name: form_8609_number
        type: string
        source: system
        description: allocation certificate number; null until issuance
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the agency officer who created the allocation
      - name: recapture_amount_cents
        type: integer
        source: computed
        description: "accelerated portion at risk while status == RECAPTURE_PENDING; 0 otherwise"
        default: 0

  - name: InvestorDelivery
    parent: null
    common_fields: true
    fields:
      - name: credit_allocation_id
        type: string
        source: input
        description: FK -> CreditAllocation.id; the allocation whose credit is delivered
      - name: investor_id
        type: string
        source: input
        description: FK -> Investor.id; the equity investor taking delivery
      - name: requested_credit_cents
        type: integer
        source: input
        description: credit the syndication agreement asks for
        constraints: "> 0"
      - name: capital_contribution_cents
        type: integer
        source: input
        description: equity paid for the delivered credit
        constraints: "> 0"
      - name: delivered_credit_cents
        type: integer
        source: computed
        description: "min(requested_credit_cents, CreditAllocation.undelivered_credit_cents) at creation time"
      - name: price_per_credit_dollar_bps
        type: integer
        source: computed
        description: "floor(capital_contribution_cents * 10000 / delivered_credit_cents)"
      - name: status
        type: enum
        source: system
        description: delivery lifecycle state
        default: DELIVERED
        constraints: "one of {DELIVERED, ACCEPTED, RESCINDED, RECAPTURE_FLAGGED}"
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock timestamp of investor acceptance; null unless ACCEPTED or RECAPTURE_FLAGGED
        default: null
      - name: rescind_reason
        type: string
        source: system
        description: text recorded when the sponsor rescinds the delivery
        default: null

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development reporting
      - name: reporting_year
        type: integer
        source: input
        description: calendar year covered by the report
        constraints: unique per project_id
      - name: restricted_units_occupied
        type: integer
        source: input
        description: restricted units occupied by income-qualified households at year end
        constraints: ">= 0"
      - name: total_units_occupied
        type: integer
        source: input
        description: all occupied units at year end
        constraints: ">= restricted_units_occupied"
      - name: average_ami_percent
        type: integer
        source: input
        description: average elected AMI band across occupied restricted units
        constraints: "> 0 AND <= 80"
      - name: status
        type: enum
        source: system
        description: review state of the report
        default: SUBMITTED
        constraints: "one of {SUBMITTED, CLEARED, NONCOMPLIANCE_FOUND}"
      - name: achieved_set_aside_bps
        type: integer
        source: computed
        description: "floor(restricted_units_occupied * 10000 / Project.total_units)"
      - name: shortfall_bps
        type: integer
        source: computed
        description: "max(0, required set-aside threshold bps - achieved_set_aside_bps)"
        default: 0
      - name: finding_notes
        type: string
        source: system
        description: reviewer notes recorded by the review decision
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the compliance officer who reviewed the report
        default: null

  - name: PhysicalInspection
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> Project.id; the development to be inspected
      - name: window_start
        type: datetime
        source: input
        description: inclusive first day of the inspection window
      - name: window_end
        type: datetime
        source: input
        description: inclusive last day of the inspection window
      - name: inspector_name
        type: string
        source: input
        description: assigned inspector
      - name: status
        type: enum
        source: system
        description: inspection lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, MISSED}"
      - name: completed_date
        type: datetime
        source: system
        description: date the inspection was performed; null unless COMPLETED
        default: null
      - name: score
        type: integer
        source: system
        description: inspection score out of 100; null unless COMPLETED
        default: null
      - name: deficiency_count
        type: integer
        source: system
        description: number of recorded deficiencies; null unless COMPLETED
        default: null
      - name: next_inspection_due_date
        type: datetime
        source: computed
        description: "completed_date + INSPECTION_INTERVAL_DAYS; null unless COMPLETED"
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# Project carries TWO independent state axes; each is declared as its own
# machine over its own field, and neither axis gates transitions of the other.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Project
    state_field: development_status
    initial_state: PLANNING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PLANNING
        to: FINANCED
        trigger: "system, on this project's BondIssue reaching ISSUED via POST /bond-issues/{id}/issue"
        actor: system
        preconditions:
          - "the BondIssue being issued has project_id == this project"
        side_effects:
          - "compute calculations.fifty_percent_aggregate_basis_test variant PROVISIONAL_AT_ISSUANCE and store it in Project.provisional_fifty_percent_ratio_bps"
          - "set Project.automatic_credit_triggered = (provisional_fifty_percent_ratio_bps >= FIFTY_PERCENT_THRESHOLD_BPS)"
          - "the referenced VolumeCapAllocation transitions AWARDED -> COMMITTED, which in turn recomputes CapPool.reserved_cents / committed_cents / available_cents / awardable_cents / pool_status"
      - from: FINANCED
        to: UNDER_CONSTRUCTION
        trigger: "system, on the first DrawRequest for this project's BondIssue reaching FUNDED via POST /draw-requests/{id}/fund"
        actor: system
        preconditions:
          - "BondIssue.cumulative_funded_cents was 0 before this funding"
        side_effects:
          - "no further field changes on Project beyond development_status and updated_at/version"
      - from: UNDER_CONSTRUCTION
        to: PLACED_IN_SERVICE
        trigger: "system, on the first operating month recorded via POST /bond-issues/{id}/operating-months"
        actor: system
        preconditions:
          - "BondIssue.operating_months was empty before this call"
        side_effects:
          - "stamp Project.placed_in_service_date from the logical clock at the moment the first operating month is recorded"
      - from: PLACED_IN_SERVICE
        to: STABILIZED
        trigger: "system, on BondIssue ISSUED -> CONVERTED via POST /bond-issues/{id}/convert"
        actor: system
        preconditions:
          - "the converting BondIssue has project_id == this project"
        side_effects:
          - "stamp Project.compliance_start_date = BondIssue.conversion_date"
          - "the project's RECORDED RegulatoryAgreement stamps compliance_period_end_date and extended_use_end_date, which are mirrored onto Project.compliance_end_date and Project.extended_use_end_date"
          - "that agreement stamping in turn transitions every UnitRestriction of this project from PROPOSED to ACTIVE and refreshes restricted_rent_cents on the RESTRICTED ones"
      - from: FINANCED
        to: WITHDRAWN
        trigger: "system, on BondIssue ISSUED -> MANDATORY_REDEEMED via POST /bond-issues/{id}/mandatory-redeem"
        actor: system
        preconditions:
          - "the redeemed BondIssue has project_id == this project"
        side_effects:
          - "set Project.automatic_credit_triggered = false and Project.provisional_fifty_percent_ratio_bps = null"
          - "the referenced VolumeCapAllocation transitions COMMITTED -> RELEASED, which recomputes its CapPool aggregates"
        note: "the identical transition exists from UNDER_CONSTRUCTION and from PLACED_IN_SERVICE with the same side-effect set"
      - from: UNDER_CONSTRUCTION
        to: WITHDRAWN
        trigger: "system, on BondIssue ISSUED -> MANDATORY_REDEEMED via POST /bond-issues/{id}/mandatory-redeem"
        actor: system
        preconditions:
          - "the redeemed BondIssue has project_id == this project"
        side_effects:
          - "set Project.automatic_credit_triggered = false and Project.provisional_fifty_percent_ratio_bps = null"
          - "the referenced VolumeCapAllocation transitions COMMITTED -> RELEASED, which recomputes its CapPool aggregates"

  - entity: Project
    state_field: compliance_status
    initial_state: UNRESTRICTED
    terminal_states: [RELEASED]
    transitions:
      - from: UNRESTRICTED
        to: RESTRICTED
        trigger: "system, on RegulatoryAgreement DRAFT -> RECORDED via POST /regulatory-agreements/{id}/record"
        actor: system
        preconditions:
          - "the recorded agreement has project_id == this project"
        side_effects:
          - "no unit activation yet; UnitRestriction rows stay PROPOSED until the project reaches STABILIZED"
      - from: RESTRICTED
        to: NONCOMPLIANT
        trigger: "system, on ComplianceReport SUBMITTED -> NONCOMPLIANCE_FOUND via POST /compliance-reports/{id}/review"
        actor: system
        preconditions:
          - "the reviewed report has project_id == this project"
        side_effects:
          - "every CreditAllocation of this project in ISSUED transitions to RECAPTURE_PENDING and stamps recapture_amount_cents"
          - "that allocation transition in turn flags every ACCEPTED InvestorDelivery of the allocation as RECAPTURE_FLAGGED"
      - from: NONCOMPLIANT
        to: RESTRICTED
        trigger: "system, on a later ComplianceReport SUBMITTED -> CLEARED via POST /compliance-reports/{id}/review"
        actor: system
        preconditions:
          - "the cleared report has project_id == this project AND reporting_year greater than the reporting_year of the report that caused NONCOMPLIANT"
        side_effects:
          - "every RECAPTURE_PENDING CreditAllocation of this project returns to ISSUED with recapture_amount_cents reset to 0"
          - "that allocation transition in turn returns every RECAPTURE_FLAGGED InvestorDelivery of the allocation to ACCEPTED"
        note: "cycle: RESTRICTED -> NONCOMPLIANT -> RESTRICTED may repeat once per reporting_year"
      - from: RESTRICTED
        to: EXTENDED_USE
        trigger: "system, on POST /_clock/set_current_utc advancing the logical clock strictly past Project.compliance_end_date"
        actor: system
        preconditions:
          - "Project.compliance_end_date is not null AND new clock value > compliance_end_date"
        side_effects:
          - "no unit status change; restrictions continue under the extended-use commitment"
      - from: EXTENDED_USE
        to: RELEASED
        trigger: "system, on POST /_clock/set_current_utc advancing the logical clock strictly past Project.extended_use_end_date"
        actor: system
        preconditions:
          - "Project.extended_use_end_date is not null AND new clock value > extended_use_end_date"
        side_effects:
          - "the project's RECORDED RegulatoryAgreement transitions to RELEASED"
          - "that agreement release in turn transitions every ACTIVE UnitRestriction of the project to RELEASED and clears restricted_rent_cents to null"

  - entity: Developer
    state_field: status
    initial_state: ACTIVE
    terminal_states: [DEBARRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /developers/{id}/sanctions with action == SUSPEND"
        actor: HfaComplianceOfficer
        preconditions:
          - "Developer.status == ACTIVE"
        side_effects:
          - "record sanction_reason; existing allocations keep their state but no new AWARD decision may be made for this developer's projects"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /developers/{id}/sanctions with action == REINSTATE"
        actor: HfaComplianceOfficer
        preconditions:
          - "Developer.status == SUSPENDED"
        side_effects:
          - "clear sanction_reason to null"
        note: "cycle ACTIVE -> SUSPENDED -> ACTIVE is unbounded"
      - from: ACTIVE
        to: DEBARRED
        trigger: "POST /developers/{id}/sanctions with action == DEBAR"
        actor: HfaComplianceOfficer
        preconditions:
          - "Developer.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "record sanction_reason; DEBARRED is terminal and no sanction action may follow"

  - entity: VolumeCapAllocation
    state_field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, RELEASED]
    transitions:
      - from: PENDING
        to: AWARDED
        trigger: "POST /volume-cap-allocations/{id}/decision with decision == AWARD"
        actor: HfaAllocationOfficer
        preconditions:
          - "VolumeCapAllocation.status == PENDING"
          - "the project's Developer.status == ACTIVE"
          - "payload expected_cap_pool_version == CapPool.version"
          - "awarded_amount_cents <= CapPool.awardable_cents AND awarded_amount_cents <= requested_amount_cents"
        side_effects:
          - "stamp awarded_amount_cents, expiry_date, decided_by_user_id"
          - "recompute the CapPool: reserved_cents drops by this allocation's requested_amount_cents, committed_cents rises by awarded_amount_cents, available_cents and awardable_cents follow, and pool_status is re-derived; CapPool.version increments by 1"
          - "if that recomputation leaves pool_status == EXHAUSTED, every OTHER allocation of the same pool still in PENDING whose requested_amount_cents > the new awardable_cents transitions PENDING -> DEFERRED"
          - "each of those DEFERRED transitions in turn increments its own Project.volume_cap_deferral_count by 1 and sets that Project.financing_stalled = true"
      - from: PENDING
        to: DENIED
        trigger: "POST /volume-cap-allocations/{id}/decision with decision == DENY"
        actor: HfaAllocationOfficer
        preconditions:
          - "VolumeCapAllocation.status == PENDING"
          - "payload expected_cap_pool_version == CapPool.version"
        side_effects:
          - "stamp denial_reason and decided_by_user_id"
          - "recompute the CapPool: reserved_cents drops by requested_amount_cents; CapPool.version increments by 1"
      - from: PENDING
        to: DEFERRED
        trigger: "system, on another allocation of the same CapPool being AWARDED and leaving pool_status == EXHAUSTED"
        actor: system
        preconditions:
          - "VolumeCapAllocation.status == PENDING AND requested_amount_cents > CapPool.awardable_cents after the award"
        side_effects:
          - "increment Project.volume_cap_deferral_count by 1 and set Project.financing_stalled = true"
          - "reserved_cents keeps counting this allocation only while PENDING, so the pool's reserved_cents drops by requested_amount_cents"
      - from: DEFERRED
        to: PENDING
        trigger: "POST /volume-cap-allocations/{id}/revise"
        actor: Developer
        preconditions:
          - "VolumeCapAllocation.status IN {DEFERRED, DENIED, RETURNED}"
        side_effects:
          - "overwrite requested_amount_cents and requested_closing_date, increment decision_round by 1, clear denial_reason / return_reason to null"
          - "set Project.financing_stalled = false and recompute the CapPool aggregates"
      - from: DENIED
        to: PENDING
        trigger: "POST /volume-cap-allocations/{id}/revise"
        actor: Developer
        preconditions:
          - "VolumeCapAllocation.status IN {DEFERRED, DENIED, RETURNED}"
        side_effects:
          - "overwrite requested_amount_cents and requested_closing_date, increment decision_round by 1, clear denial_reason to null"
          - "recompute the CapPool aggregates"
        note: "cycle PENDING -> DENIED -> PENDING is the negotiation loop with the agency"
      - from: RETURNED
        to: PENDING
        trigger: "POST /volume-cap-allocations/{id}/revise"
        actor: Developer
        preconditions:
          - "VolumeCapAllocation.status IN {DEFERRED, DENIED, RETURNED}"
        side_effects:
          - "overwrite requested_amount_cents and requested_closing_date, increment decision_round by 1, clear return_reason to null"
          - "recompute the CapPool aggregates"
      - from: AWARDED
        to: RETURNED
        trigger: "POST /volume-cap-allocations/{id}/return"
        actor: Developer
        preconditions:
          - "VolumeCapAllocation.status == AWARDED"
          - "no BondIssue references this allocation with status IN {ISSUED, CONVERTED, MANDATORY_REDEEMED}"
        side_effects:
          - "record return_reason, clear awarded_amount_cents and expiry_date to null"
          - "recompute the CapPool: committed_cents drops by the returned award, awardable_cents rises, pool_status is re-derived; CapPool.version increments by 1"
          - "if that recomputation leaves pool_status != EXHAUSTED, every DEFERRED allocation of the pool returns to PENDING, and each of those in turn sets its Project.financing_stalled = false"
      - from: AWARDED
        to: EXPIRED
        trigger: "system, on POST /_clock/set_current_utc advancing the logical clock strictly past expiry_date"
        actor: system
        preconditions:
          - "VolumeCapAllocation.status == AWARDED AND new clock value > expiry_date"
        side_effects:
          - "recompute the CapPool: committed_cents drops by awarded_amount_cents and pool_status is re-derived"
      - from: AWARDED
        to: COMMITTED
        trigger: "system, on BondIssue DRAFT -> ISSUED via POST /bond-issues/{id}/issue"
        actor: system
        preconditions:
          - "VolumeCapAllocation.status == AWARDED AND the issuing BondIssue.volume_cap_allocation_id == this allocation"
        side_effects:
          - "the pool keeps counting the award in committed_cents; COMMITTED protects it from clock expiry"
      - from: COMMITTED
        to: RELEASED
        trigger: "system, on BondIssue ISSUED -> MANDATORY_REDEEMED via POST /bond-issues/{id}/mandatory-redeem"
        actor: system
        preconditions:
          - "VolumeCapAllocation.status == COMMITTED"
        side_effects:
          - "recompute the CapPool: committed_cents drops by awarded_amount_cents, awardable_cents rises, pool_status is re-derived; CapPool.version increments by 1"
          - "if that recomputation leaves pool_status != EXHAUSTED, every DEFERRED allocation of the pool returns to PENDING, and each of those in turn sets its Project.financing_stalled = false"

  - entity: BondIssue
    state_field: status
    initial_state: DRAFT
    terminal_states: [CONVERTED, MANDATORY_REDEEMED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /bond-issues/{id}/issue"
        actor: HfaAllocationOfficer
        preconditions:
          - "BondIssue.status == DRAFT"
          - "the project's RegulatoryAgreement exists with status == RECORDED"
          - "VolumeCapAllocation.status == AWARDED AND par_amount_cents <= awarded_amount_cents"
          - "closing_date <= VolumeCapAllocation.expiry_date"
        side_effects:
          - "stamp closing_date"
          - "the VolumeCapAllocation transitions AWARDED -> COMMITTED"
          - "the Project transitions PLANNING -> FINANCED, which stamps provisional_fifty_percent_ratio_bps and automatic_credit_triggered"
      - from: ISSUED
        to: CONVERTED
        trigger: "POST /bond-issues/{id}/convert"
        actor: BondTrustee
        preconditions:
          - "BondIssue.status == ISSUED"
          - "the operating-month window required by the requested dscr_basis is fully present (3 months for T3, 12 for T12)"
          - "calculations.debt_service_coverage_ratio for the requested basis yields dscr_bps >= MIN_DSCR_BPS"
          - "the minimum monthly occupancy over the same window is >= STABILIZED_OCCUPANCY_BPS"
        side_effects:
          - "stamp conversion_date, dscr_basis, dscr_bps and min_occupancy_bps"
          - "the Project transitions PLACED_IN_SERVICE -> STABILIZED, which stamps compliance_start_date"
          - "that Project transition in turn stamps the RECORDED RegulatoryAgreement's compliance_period_end_date and extended_use_end_date, which in turn activates the project's UnitRestriction rows (PROPOSED -> ACTIVE)"
      - from: ISSUED
        to: MANDATORY_REDEEMED
        trigger: "POST /bond-issues/{id}/mandatory-redeem"
        actor: HfaAllocationOfficer
        preconditions:
          - "BondIssue.status == ISSUED"
        side_effects:
          - "stamp redemption_date"
          - "every DrawRequest of this issue in SUBMITTED or APPROVED transitions to REJECTED with rejection_reason 'bond issue redeemed'"
          - "the Project transitions to WITHDRAWN and automatic_credit_triggered becomes false"
          - "the VolumeCapAllocation transitions COMMITTED -> RELEASED, which recomputes the CapPool and may reinstate DEFERRED allocations"
        note: "branch sibling of ISSUED -> CONVERTED with a disjoint side-effect set: conversion starts the compliance clock, redemption unwinds the financing"

  - entity: DrawRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /draw-requests/{id}/decision with decision == APPROVE"
        actor: BondTrustee
        preconditions:
          - "DrawRequest.status == SUBMITTED"
          - "BondIssue.status == ISSUED"
          - "approved_amount_cents <= requested_amount_cents AND approved_amount_cents <= BondIssue.undrawn_cents"
        side_effects:
          - "stamp approved_amount_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /draw-requests/{id}/decision with decision == REJECT"
        actor: BondTrustee
        preconditions:
          - "DrawRequest.status == SUBMITTED"
        side_effects:
          - "stamp rejection_reason; the period is released so a later draw may occupy it"
        note: "branch sibling of SUBMITTED -> APPROVED; REJECTED draws leave BondIssue.undrawn_cents untouched"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /draw-requests/{id}/fund"
        actor: BondTrustee
        preconditions:
          - "DrawRequest.status == APPROVED"
          - "BondIssue.status == ISSUED"
          - "the recomputed BondIssue.negative_arbitrage_cents including this draw period is <= BondIssue.negative_arbitrage_allowance_cents"
        side_effects:
          - "stamp funding_date; recompute BondIssue.cumulative_funded_cents, undrawn_cents, negative_arbitrage_cents and every FUNDED draw's negative_arbitrage_accrual_cents; BondIssue.version increments by 1"
          - "if this is the first FUNDED draw on the issue, the Project transitions FINANCED -> UNDER_CONSTRUCTION"
      - from: FUNDED
        to: VOIDED
        trigger: "POST /draw-requests/{id}/void"
        actor: BondTrustee
        preconditions:
          - "DrawRequest.status == FUNDED"
          - "BondIssue.status == ISSUED"
        side_effects:
          - "stamp void_reason, clear funding_date to null and negative_arbitrage_accrual_cents to 0"
          - "recompute BondIssue.cumulative_funded_cents, undrawn_cents and negative_arbitrage_cents over the remaining FUNDED draws only; BondIssue.version increments by 1"
        note: "compensating action for APPROVED -> FUNDED: par_amount_cents == cumulative_funded_cents + undrawn_cents must hold again afterwards"

  - entity: UnitRestriction
    state_field: status
    initial_state: PROPOSED
    terminal_states: [RELEASED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system, on the project's RegulatoryAgreement stamping compliance dates as the Project reaches STABILIZED"
        actor: system
        preconditions:
          - "the UnitRestriction's project reached STABILIZED AND its RegulatoryAgreement.status == RECORDED"
        side_effects:
          - "recompute restricted_rent_cents for designation == RESTRICTED rows; MARKET and EMPLOYEE_UNIT rows keep restricted_rent_cents null"
      - from: ACTIVE
        to: RELEASED
        trigger: "system, on the project's RegulatoryAgreement transitioning RECORDED -> RELEASED at the end of the extended-use period"
        actor: system
        preconditions:
          - "UnitRestriction.status == ACTIVE AND the agreement reached RELEASED"
        side_effects:
          - "clear restricted_rent_cents to null"

  - entity: RegulatoryAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: RECORDED
        trigger: "POST /regulatory-agreements/{id}/record"
        actor: HfaComplianceOfficer
        preconditions:
          - "RegulatoryAgreement.status == DRAFT"
          - "Project.set_aside_satisfied == true under the agreement's set_aside_election"
        side_effects:
          - "stamp instrument_number and recording_date"
          - "the Project's compliance axis transitions UNRESTRICTED -> RESTRICTED"
      - from: RECORDED
        to: AMENDMENT_PENDING
        trigger: "POST /regulatory-agreements/{id}/amend"
        actor: HfaComplianceOfficer
        preconditions:
          - "RegulatoryAgreement.status == RECORDED"
          - "the requested new_extended_use_years, when present, is >= compliance_period_years + MIN_EXTENDED_USE_GAP_YEARS"
        side_effects:
          - "stamp amendment_reason and apply the requested set_aside_election / extended_use_years to the agreement fields"
          - "if set_aside_election changed, Project.set_aside_ratio_bps and set_aside_satisfied are re-derived under the new election"
      - from: AMENDMENT_PENDING
        to: RECORDED
        trigger: "POST /regulatory-agreements/{id}/record"
        actor: HfaComplianceOfficer
        preconditions:
          - "RegulatoryAgreement.status == AMENDMENT_PENDING"
          - "Project.set_aside_satisfied == true under the amended set_aside_election"
        side_effects:
          - "overwrite instrument_number and recording_date, increment amendment_count by 1, clear amendment_reason to null"
          - "if the project already has compliance dates, extended_use_end_date is re-derived from the amended extended_use_years"
        note: "cycle RECORDED -> AMENDMENT_PENDING -> RECORDED may repeat; amendment_count counts completed cycles"
      - from: RECORDED
        to: RELEASED
        trigger: "system, on the Project's compliance axis reaching RELEASED at the end of the extended-use period"
        actor: system
        preconditions:
          - "RegulatoryAgreement.status == RECORDED AND Project.compliance_status became RELEASED"
        side_effects:
          - "every ACTIVE UnitRestriction of the project transitions to RELEASED"

  - entity: CostCertification
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cost-certifications/{id}/submit"
        actor: Developer
        preconditions:
          - "CostCertification.status IN {DRAFT, RETURNED_FOR_REVISION}"
          - "Project.development_status IN {PLACED_IN_SERVICE, STABILIZED}"
        side_effects:
          - "apply any restated basis figures, increment submission_round by 1, clear deficiency_notes to null"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cost-certifications/{id}/review with decision == ACCEPT"
        actor: HfaComplianceOfficer
        preconditions:
          - "CostCertification.status == SUBMITTED"
        side_effects:
          - "stamp accepted_at and reviewed_by_user_id"
          - "compute calculations.fifty_percent_aggregate_basis_test variant FINAL_AT_COST_CERT and store it in Project.final_fifty_percent_ratio_bps"
          - "set Project.automatic_credit_triggered = (final_fifty_percent_ratio_bps >= FIFTY_PERCENT_THRESHOLD_BPS), overriding the provisional result"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /cost-certifications/{id}/review with decision == RETURN"
        actor: HfaComplianceOfficer
        preconditions:
          - "CostCertification.status == SUBMITTED"
        side_effects:
          - "stamp deficiency_notes and reviewed_by_user_id; Project.final_fifty_percent_ratio_bps is left untouched"
        note: "branch sibling of SUBMITTED -> ACCEPTED"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /cost-certifications/{id}/submit"
        actor: Developer
        preconditions:
          - "CostCertification.status IN {DRAFT, RETURNED_FOR_REVISION}"
          - "Project.development_status IN {PLACED_IN_SERVICE, STABILIZED}"
        side_effects:
          - "apply any restated basis figures, increment submission_round by 1, clear deficiency_notes to null"
        note: "cycle SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED is the audit revision loop; submission_round records how many passes occurred"

  - entity: CreditAllocation
    state_field: status
    initial_state: PENDING
    terminal_states: [RECAPTURED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /credit-allocations/{id}/issue"
        actor: HfaAllocationOfficer
        preconditions:
          - "CreditAllocation.status == PENDING"
          - "Project.automatic_credit_triggered == true at issuance time"
        side_effects:
          - "stamp form_8609_number; credit becomes deliverable to investors"
      - from: ISSUED
        to: RECAPTURE_PENDING
        trigger: "system, on the Project's compliance axis transitioning RESTRICTED -> NONCOMPLIANT"
        actor: system
        preconditions:
          - "CreditAllocation.status == ISSUED"
        side_effects:
          - "stamp recapture_amount_cents from calculations.recapture_exposure"
          - "every ACCEPTED InvestorDelivery of this allocation transitions to RECAPTURE_FLAGGED"
      - from: RECAPTURE_PENDING
        to: ISSUED
        trigger: "system, on the Project's compliance axis transitioning NONCOMPLIANT -> RESTRICTED"
        actor: system
        preconditions:
          - "CreditAllocation.status == RECAPTURE_PENDING"
        side_effects:
          - "reset recapture_amount_cents to 0"
          - "every RECAPTURE_FLAGGED InvestorDelivery of this allocation returns to ACCEPTED"
        note: "cure cycle ISSUED -> RECAPTURE_PENDING -> ISSUED; a second consecutive finding instead terminates in RECAPTURED"
      - from: RECAPTURE_PENDING
        to: RECAPTURED
        trigger: "system, on a second ComplianceReport reaching NONCOMPLIANCE_FOUND while this allocation is RECAPTURE_PENDING"
        actor: system
        preconditions:
          - "CreditAllocation.status == RECAPTURE_PENDING"
        side_effects:
          - "recapture_amount_cents is retained as the final recaptured amount; the allocation is terminal and no further delivery may be created"

  - entity: InvestorDelivery
    state_field: status
    initial_state: DELIVERED
    terminal_states: [RESCINDED]
    transitions:
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /investor-deliveries/{id}/accept"
        actor: Investor
        preconditions:
          - "InvestorDelivery.status == DELIVERED"
          - "the acting X-User-ID equals InvestorDelivery.investor_id"
        side_effects:
          - "stamp accepted_at; Investor.total_credit_accepted_cents is recomputed"
      - from: DELIVERED
        to: RESCINDED
        trigger: "POST /investor-deliveries/{id}/rescind"
        actor: Developer
        preconditions:
          - "InvestorDelivery.status IN {DELIVERED, ACCEPTED}"
        side_effects:
          - "stamp rescind_reason; CreditAllocation.delivered_credit_cents drops by delivered_credit_cents and undelivered_credit_cents rises by the same amount; CreditAllocation.version increments by 1"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /investor-deliveries/{id}/rescind"
        actor: Developer
        preconditions:
          - "InvestorDelivery.status IN {DELIVERED, ACCEPTED}"
        side_effects:
          - "stamp rescind_reason; CreditAllocation.delivered_credit_cents drops by delivered_credit_cents and undelivered_credit_cents rises by the same amount; Investor.total_credit_accepted_cents is recomputed; CreditAllocation.version increments by 1"
        note: "compensating action for delivery creation: total_credit_cents == delivered_credit_cents + undelivered_credit_cents must hold again afterwards"
      - from: ACCEPTED
        to: RECAPTURE_FLAGGED
        trigger: "system, on the delivery's CreditAllocation transitioning ISSUED -> RECAPTURE_PENDING"
        actor: system
        preconditions:
          - "InvestorDelivery.status == ACCEPTED"
        side_effects:
          - "the delivery keeps counting toward delivered_credit_cents while flagged"
      - from: RECAPTURE_FLAGGED
        to: ACCEPTED
        trigger: "system, on the delivery's CreditAllocation transitioning RECAPTURE_PENDING -> ISSUED"
        actor: system
        preconditions:
          - "InvestorDelivery.status == RECAPTURE_FLAGGED"
        side_effects:
          - "no field change beyond status, updated_at and version"

  - entity: ComplianceReport
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [CLEARED, NONCOMPLIANCE_FOUND]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /compliance-reports/{id}/review with finding == CLEARED"
        actor: HfaComplianceOfficer
        preconditions:
          - "ComplianceReport.status == SUBMITTED"
          - "shortfall_bps == 0"
        side_effects:
          - "stamp finding_notes and reviewed_by_user_id"
          - "if Project.compliance_status == NONCOMPLIANT and this report's reporting_year is greater than the year of the finding report, the project cures back to RESTRICTED"
      - from: SUBMITTED
        to: NONCOMPLIANCE_FOUND
        trigger: "POST /compliance-reports/{id}/review with finding == NONCOMPLIANCE"
        actor: HfaComplianceOfficer
        preconditions:
          - "ComplianceReport.status == SUBMITTED"
          - "shortfall_bps > 0"
        side_effects:
          - "stamp finding_notes and reviewed_by_user_id"
          - "the Project's compliance axis transitions RESTRICTED -> NONCOMPLIANT, which cascades into CreditAllocation and InvestorDelivery"
        note: "branch sibling of SUBMITTED -> CLEARED, selected by the computed shortfall rather than by the reviewer's preference"

  - entity: PhysicalInspection
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /physical-inspections/{id}/complete"
        actor: HfaComplianceOfficer
        preconditions:
          - "PhysicalInspection.status == SCHEDULED"
          - "window_start <= completed_date <= window_end"
        side_effects:
          - "stamp completed_date, score, deficiency_count and next_inspection_due_date"
      - from: SCHEDULED
        to: MISSED
        trigger: "system, on POST /_clock/set_current_utc advancing the logical clock strictly past window_end"
        actor: system
        preconditions:
          - "PhysicalInspection.status == SCHEDULED AND new clock value > window_end"
        side_effects:
          - "next_inspection_due_date stays null; a MISSED window still blocks overlapping re-scheduling for INSPECTION_BUFFER_DAYS"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: award-decision-stale-cap-pool
    parent_entity: CapPool
    write_endpoint: "POST /volume-cap-allocations/{id}/decision"
    occ_field: "expected_cap_pool_version"
    description: |
      An award decision is priced against the pool availability the officer
      observed. Deciding an allocation while carrying a CapPool.version older
      than the pool's current version is rejected, because the observed
      awardable_cents is stale: another allocation of the same pool has since
      been awarded, denied or returned and legitimately changed the ceiling
      this decision must respect.
    error_id: ERR_STALE_CAP_POOL_VERSION
    http_status: 412

  - rule_id: draw-create-stale-bond-issue
    parent_entity: BondIssue
    write_endpoint: "POST /draw-requests"
    occ_field: "expected_bond_issue_version"
    description: |
      A construction draw is sized against the undrawn balance the sponsor
      observed on the bond issue. Creating a draw while carrying a
      BondIssue.version older than the issue's current version is rejected,
      because another draw has since been funded or voided and the undrawn
      balance the new draw would legitimately consume has moved.
    error_id: ERR_STALE_BOND_ISSUE_VERSION
    http_status: 412

  - rule_id: delivery-create-stale-credit-allocation
    parent_entity: CreditAllocation
    write_endpoint: "POST /investor-deliveries"
    occ_field: "expected_credit_allocation_version"
    description: |
      A credit delivery is sized against the undelivered credit the syndicator
      observed. Creating a delivery while carrying a CreditAllocation.version
      older than the allocation's current version is rejected, because another
      delivery or rescission has since moved undelivered_credit_cents and the
      waterfall clamp would silently deliver a different amount than the
      syndication agreement priced.
    error_id: ERR_STALE_CREDIT_ALLOCATION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# Currency is always integer cents. `round_half_up` means Decimal quantize to
# whole cents with ROUND_HALF_UP. Ratios are integer basis points obtained with
# floor division unless a rule says otherwise. No calculation, selector,
# ordering or tie-break anywhere in this scaffold reads `id`.
# ---------------------------------------------------------------------------
calculations:
  - name: bond_sizing
    trigger: "POST /bond-issues (at creation); the result is frozen and never re-solved afterwards"
    algorithm: constraint_propagation
    formula: |
      # The cost-of-issuance allowance looks circular: it is a percentage of
      # par, and par includes the allowance. The evaluation order below is
      # PINNED - the allowance is computed on provisional par (which EXCLUDES
      # the allowance) and is never re-solved against the final par.
      provisional_par_cents   = eligible_cost_cents + capitalized_interest_cents
      issuance_allowance_cents = round_half_up(provisional_par_cents * ISSUANCE_ALLOWANCE_RATE)
      unrounded_par_cents      = provisional_par_cents + issuance_allowance_cents
      # Step 3 rounds UP to the next whole authorized denomination, never down.
      par_amount_cents         = ceil(unrounded_par_cents / DENOMINATION_CENTS) * DENOMINATION_CENTS
      negative_arbitrage_allowance_cents = floor(par_amount_cents * NEG_ARB_ALLOWANCE_BPS / 10000)
    input_set: "the two cost inputs on this BondIssue only; no DrawRequest or CostCertification figure participates"
    constants:
      ISSUANCE_ALLOWANCE_RATE: 0.02
      DENOMINATION_CENTS: 500000
      NEG_ARB_ALLOWANCE_BPS: 200
    precision: "whole cents, round_half_up for the allowance, ceil for the denomination step"

  - name: applicable_fraction
    trigger: "on every UnitRestriction create, designation change, and on Project read of the derived fields"
    algorithm: aggregation
    formula: |
      restricted = UnitRestriction rows with project_id == P.id AND designation == RESTRICTED
                   (all statuses count: PROPOSED, ACTIVE and RELEASED alike)
      unit_fraction_bps        = floor(count(restricted) * 10000 / P.total_units)
      floor_space_fraction_bps = floor(sum(restricted.floor_space_sqft) * 10000 / P.total_floor_space_sqft)
      applicable_fraction_bps  = min(unit_fraction_bps, floor_space_fraction_bps)
      # Empty set: with zero restricted units both fractions are 0 and the
      # applicable fraction is 0 (not null, not an error).
    input_set: "every UnitRestriction row of the project regardless of status; MARKET and EMPLOYEE_UNIT rows are excluded from both numerators but never from total_units / total_floor_space_sqft"
    constants: {}
    precision: "integer basis points, floor"

  - name: set_aside_compliance_ratio
    trigger: "on every UnitRestriction create or designation change; read as a precondition of POST /regulatory-agreements/{id}/record"
    algorithm: threshold
    formula: |
      if P.set_aside_election == MIN_20_50:
          qualifying = restricted rows with ami_percent <= 50
          threshold_bps = 2000
          average_ceiling_applies = false
      elif P.set_aside_election == MIN_40_60:
          qualifying = restricted rows with ami_percent <= 60
          threshold_bps = 4000
          average_ceiling_applies = false
      else:  # AVG_INCOME
          qualifying = restricted rows with ami_percent <= 80
          threshold_bps = 4000
          average_ceiling_applies = true
      set_aside_ratio_bps = floor(count(qualifying) * 10000 / P.total_units)
      average_ami_bps = floor(sum(qualifying.ami_percent) * 100 / count(qualifying))   # 0 when the set is empty
      set_aside_satisfied = (set_aside_ratio_bps >= threshold_bps)
                            AND (average_ceiling_applies is false
                                 OR (count(qualifying) > 0 AND average_ami_bps <= AVG_INCOME_CEILING_BPS))
      # Boundary: a ratio exactly equal to threshold_bps SATISFIES the election,
      # and an average exactly equal to AVG_INCOME_CEILING_BPS SATISFIES it too.
    input_set: "UnitRestriction rows with designation == RESTRICTED for the project, any status"
    constants:
      MIN_20_50_THRESHOLD_BPS: 2000
      MIN_40_60_THRESHOLD_BPS: 4000
      AVG_INCOME_THRESHOLD_BPS: 4000
      AVG_INCOME_CEILING_BPS: 6000
    precision: "integer basis points, floor"

  - name: restricted_rent_ceiling
    trigger: "on UnitRestriction create with designation == RESTRICTED, on a designation change into RESTRICTED, and on PROPOSED -> ACTIVE activation"
    algorithm: tiered_pricing
    formula: |
      # Four inputs interact non-linearly: household size (from bedrooms), the
      # unit's elected AMI band, the project's set-aside election, and the two
      # monetary caps. The election CAPS the band a unit may charge against,
      # even when the unit itself elected a higher band.
      imputed_household_size = max(1, bedroom_count + 1)
      election_ceiling_percent = 50 if P.set_aside_election == MIN_20_50
                            else 60 if P.set_aside_election == MIN_40_60
                            else 80          # AVG_INCOME
      effective_percent = min(ami_percent, election_ceiling_percent)
      annual_income_cents = floor(AMI_100_ANNUAL_INCOME_CENTS[imputed_household_size] * effective_percent / 100)
      max_gross_rent_cents = floor(floor(annual_income_cents * 30 / 100) / 12)
      restricted_rent_cents = max(MIN_RENT_FLOOR_CENTS,
                                  min(max_gross_rent_cents - utility_allowance_cents,
                                      market_rent_cents))
      # Nesting order is PINNED: the 30%-of-income step floors to whole cents
      # BEFORE the division by 12 floors again; the utility allowance is
      # subtracted only from the AMI-derived ceiling, never from market rent;
      # the program floor is applied LAST and can raise the answer above both
      # caps.
    input_set: "the single UnitRestriction row plus its Project.set_aside_election"
    constants:
      AMI_100_ANNUAL_INCOME_CENTS: { 1: 6300000, 2: 7200000, 3: 8100000, 4: 9000000, 5: 9720000, 6: 10440000 }
      RENT_INCOME_SHARE_PERCENT: 30
      MIN_RENT_FLOOR_CENTS: 25000
    precision: "whole cents, floor at each division step"

  - name: fifty_percent_aggregate_basis_test
    trigger: "variant PROVISIONAL_AT_ISSUANCE runs on POST /bond-issues/{id}/issue; variant FINAL_AT_COST_CERT runs on POST /cost-certifications/{id}/review with decision == ACCEPT"
    algorithm: threshold
    formula: |
      ratio_bps = floor(numerator_cents * 10000 / denominator_cents)
      test_passes = (ratio_bps >= FIFTY_PERCENT_THRESHOLD_BPS)
      # The passing side is inclusive: exactly 5000 bps triggers the credit.
    input_set: "see each variant; the two variants read DIFFERENT numerators and DIFFERENT denominators over the same project"
    constants:
      FIFTY_PERCENT_THRESHOLD_BPS: 5000
    precision: "integer basis points, floor"
    variants:
      - name: PROVISIONAL_AT_ISSUANCE
        when: "a BondIssue of the project reaches ISSUED"
        difference: |
          numerator_cents  = BondIssue.par_amount_cents of the issue being issued
          denominator_cents = Project.aggregate_basis_cents
                              (= land_cost_cents + depreciable_basis_cents as filed at project creation)
          result is written to Project.provisional_fifty_percent_ratio_bps
      - name: FINAL_AT_COST_CERT
        when: "a CostCertification of the project reaches ACCEPTED"
        difference: |
          numerator_cents  = sum of DrawRequest.approved_amount_cents over draws of the
                             project's BondIssue with status == FUNDED
                             (VOIDED, REJECTED, APPROVED and SUBMITTED draws are excluded,
                             so proceeds authorized but never funded do not count)
          denominator_cents = CostCertification.certified_aggregate_basis_cents
          result is written to Project.final_fifty_percent_ratio_bps and OVERRIDES
          automatic_credit_triggered even when the provisional variant passed

  - name: negative_arbitrage_cost
    trigger: "on POST /draw-requests/{id}/fund (before the transition commits, to test the allowance) and on POST /draw-requests/{id}/void (recompute over the survivors)"
    algorithm: chronological
    formula: |
      spread_bps = max(0, BondIssue.bond_yield_bps - BondIssue.investment_yield_bps)
      draws = DrawRequest rows of the issue with status == FUNDED,
              ordered by period_start ASC, tie-break draw_number ASC
              (never by id, never by created_at)
      cumulative = 0
      total = 0
      for d in draws:
          undrawn_before_d = BondIssue.par_amount_cents - cumulative
          period_days      = (d.period_end - d.period_start) in whole days   # half-open [start, end)
          accrual_d        = round_half_up(undrawn_before_d * spread_bps / 10000 * period_days / DAY_COUNT_BASIS)
          d.negative_arbitrage_accrual_cents = accrual_d      # ROUND PER PERIOD ...
          total      = total + accrual_d                      # ... THEN SUM (pinned order)
          cumulative = cumulative + d.approved_amount_cents
      BondIssue.negative_arbitrage_cents = total
      # The rounding order is PINNED: each period's accrual is rounded to whole
      # cents BEFORE it enters the sum. Summing the unrounded accruals and
      # rounding once at the end is a DIFFERENT, WRONG answer and may differ by
      # one cent per period.
      # On a fund attempt the projected total (including the draw being funded)
      # must be <= BondIssue.negative_arbitrage_allowance_cents.
    input_set: "FUNDED draws only; a VOIDED draw leaves the set and the whole series is recomputed from the surviving draws, so its accrual disappears rather than being subtracted"
    constants:
      DAY_COUNT_BASIS: 360
    precision: "whole cents, round_half_up per period"

  - name: debt_service_coverage_ratio
    trigger: "POST /bond-issues/{id}/convert, using the variant named by the request's dscr_basis"
    algorithm: aggregation
    formula: |
      months = BondIssue.operating_months ordered by month_index ASC
      window = the last WINDOW_SIZE entries of months by month_index
      if count(months) < WINDOW_SIZE: reject with ERR_INSUFFICIENT_OPERATING_HISTORY
      noi_total = sum(window.noi_cents) * ANNUALIZATION_FACTOR
      ds_total  = sum(window.debt_service_cents) * ANNUALIZATION_FACTOR
      dscr_bps  = floor(noi_total * 10000 / ds_total)
      min_occupancy_bps = min over window of floor(occupied_units * 10000 / Project.total_units)
      conversion requires dscr_bps >= MIN_DSCR_BPS AND min_occupancy_bps >= STABILIZED_OCCUPANCY_BPS
      # Both thresholds are inclusive: exactly 11500 bps of coverage and exactly
      # 9000 bps of occupancy pass.
    input_set: "the operating_months array of the BondIssue; entries outside the selected window are ignored entirely"
    constants:
      MIN_DSCR_BPS: 11500
      STABILIZED_OCCUPANCY_BPS: 9000
    precision: "integer basis points, floor"
    variants:
      - name: T3
        when: "request body dscr_basis == T3 (trailing three months, annualized)"
        difference: "WINDOW_SIZE = 3 and ANNUALIZATION_FACTOR = 4; only the three highest month_index entries are read, so a strong lease-up quarter can pass while the trailing year fails"
      - name: T12
        when: "request body dscr_basis == T12 (trailing twelve months, actual)"
        difference: "WINDOW_SIZE = 12 and ANNUALIZATION_FACTOR = 1; every month of the trailing year is read, so weak early months drag the ratio and the minimum-occupancy floor down"

  - name: qualified_basis_and_annual_credit
    trigger: "POST /credit-allocations (at creation); the result is frozen on the CreditAllocation row"
    algorithm: aggregation
    formula: |
      restricted = UnitRestriction rows of the project with designation == RESTRICTED,
                   ordered by unit_number ASC (order is irrelevant to the sum but pinned for reproducibility)
      # ROUND PER UNIT, THEN SUM (pinned). Flooring the project-level product
      # instead - sum(floor_space) first, then one division - is a DIFFERENT,
      # WRONG answer.
      qualified_basis_cents = sum over u in restricted of
          floor(CostCertification.certified_eligible_basis_cents * u.floor_space_sqft
                / Project.total_floor_space_sqft)
      applicable_fraction_bps = Project.applicable_fraction_bps      # snapshot
      annual_credit_cents = round_half_up(qualified_basis_cents * credit_percentage_bps / 10000)
      total_credit_cents  = annual_credit_cents * CREDIT_PERIOD_YEARS
      undelivered_credit_cents = total_credit_cents      # at creation, nothing delivered yet
    input_set: "RESTRICTED UnitRestriction rows of the project, any status; the accepted CostCertification's certified_eligible_basis_cents (never the project's filed depreciable basis)"
    constants:
      CREDIT_PERIOD_YEARS: 10
    precision: "whole cents; floor per unit, round_half_up once on the annual credit"

  - name: cap_pool_availability
    trigger: "on every VolumeCapAllocation create, decision, revise, return, expiry and release"
    algorithm: aggregation
    formula: |
      total_cap_cents = base_cap_cents + carryforward_cents
      reserved_cents  = sum(a.requested_amount_cents for a in allocations of this pool with a.status == PENDING)
      committed_cents = sum(a.awarded_amount_cents  for a in allocations of this pool with a.status IN {AWARDED, COMMITTED})
      available_cents = total_cap_cents - reserved_cents - committed_cents      # may be negative
      awardable_cents = total_cap_cents - committed_cents
      pool_status = EXHAUSTED     if awardable_cents <= 0
                    else OVERSUBSCRIBED if available_cents < 0
                    else OPEN
      # CONSERVATION INVARIANT (must hold after every mutation, including every
      # compensating action - return, expiry, release, revision):
      #   total_cap_cents == available_cents + reserved_cents + committed_cents
      # An award decision is admissible only when
      #   awarded_amount_cents <= awardable_cents        (inclusive boundary)
      # evaluated BEFORE this allocation leaves PENDING.
    input_set: "allocations of this pool in PENDING (reserved) and in AWARDED/COMMITTED (committed); DENIED, DEFERRED, RETURNED, EXPIRED and RELEASED allocations contribute nothing"
    constants: {}
    precision: "whole cents, exact integer arithmetic"

  - name: credit_delivery_waterfall
    trigger: "POST /investor-deliveries (at creation) and recomputed on POST /investor-deliveries/{id}/rescind"
    algorithm: waterfall_allocation
    formula: |
      undelivered_before = CreditAllocation.total_credit_cents
                           - sum(d.delivered_credit_cents for d in deliveries of this allocation
                                 with d.status IN {DELIVERED, ACCEPTED, RECAPTURE_FLAGGED})
      if undelivered_before == 0: reject with ERR_NO_UNDELIVERED_CREDIT
      delivered_credit_cents = min(requested_credit_cents, undelivered_before)   # clamp, never reject an over-ask
      price_per_credit_dollar_bps = floor(capital_contribution_cents * 10000 / delivered_credit_cents)
      # Deliveries fill in creation order (created_at ASC); the LAST delivery
      # that fits absorbs the remainder and the clamp makes it smaller than
      # requested. RESCINDED deliveries return their credit to the pool.
      # CONSERVATION INVARIANT (after every create and every rescind):
      #   total_credit_cents == delivered_credit_cents_sum + undelivered_credit_cents
    input_set: "deliveries of the allocation with status IN {DELIVERED, ACCEPTED, RECAPTURE_FLAGGED}; RESCINDED deliveries are excluded"
    constants: {}
    precision: "whole cents, exact integer arithmetic; floor on the price ratio"

  - name: recapture_exposure
    trigger: "system, when a CreditAllocation transitions ISSUED -> RECAPTURE_PENDING"
    algorithm: threshold
    formula: |
      required_bps = 2000 if Project.set_aside_election == MIN_20_50 else 4000
      achieved_set_aside_bps = floor(report.restricted_units_occupied * 10000 / Project.total_units)
      shortfall_bps = max(0, required_bps - achieved_set_aside_bps)
      recapture_amount_cents = round_half_up(CreditAllocation.annual_credit_cents * shortfall_bps / 10000)
    input_set: "the single ComplianceReport that triggered the finding; earlier reports do not accumulate"
    constants: {}
    precision: "whole cents, round_half_up"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (ordered)
# Every request walks this list from the lowest `priority` number upward and
# returns the FIRST violated rule's error_id. A request that violates several
# rules therefore surfaces exactly one error, chosen by priority and never by
# the order the fields appear in the payload. Category bands:
#   10-39  auth        40-49 input        50-69 existence     70-79 concurrency
#   80-99  state       100-109 business_temporal   110-119 business_fiscal
#   120-129 business_safety                        130-149 business_constraint
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    name: caller_is_authenticated
    category: auth
    rule: "Every endpoint requires the X-User-Role header, and every endpoint whose role is entity_backed (Developer, Investor) or which records an actor also requires X-User-ID. A missing or blank header is rejected before anything else, including before the path entity is looked up."
    applies_to: all endpoints
    error_id: ERR_UNAUTHENTICATED

  - priority: 20
    name: role_is_permitted_for_endpoint
    category: auth
    rule: "The X-User-Role value must appear in the endpoint's roles list. Checked before existence, so an HfaComplianceOfficer calling POST /volume-cap-allocations/{id}/decision with a nonexistent allocation id gets the role error, not the 404."
    applies_to: all endpoints
    error_id: ERR_FORBIDDEN_ROLE

  - priority: 30
    name: caller_owns_the_resource
    category: auth
    rule: "For a Developer caller, the target resource must resolve to a Project whose developer_id equals X-User-ID; for an Investor caller, an InvestorDelivery's investor_id must equal X-User-ID. HFA and BondTrustee roles are exempt from this rule."
    applies_to: "developer-scoped and investor-scoped endpoints"
    error_id: ERR_NOT_RESOURCE_OWNER

  - priority: 40
    name: request_body_is_well_formed
    category: input
    rule: "All required input fields present and non-null; enums within their declared value set; every *_cents and *_bps field an integer >= 0; every *_count and *_units field an integer >= 1 where the entity requires at least one; datetime fields ISO-8601 with a Z suffix. Unknown keys are ignored. period_end must be strictly greater than period_start, window_end >= window_start."
    applies_to: "all POST and PATCH endpoints"
    error_id: ERR_INVALID_REQUEST

  - priority: 50
    name: path_entity_exists
    category: existence
    rule: "The {id} in the path must resolve to a stored row of the endpoint's entity, otherwise that entity's specific 404 is returned (ERR_PROJECT_NOT_FOUND, ERR_DEVELOPER_NOT_FOUND, ERR_INVESTOR_NOT_FOUND, ERR_CAP_POOL_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_BOND_ISSUE_NOT_FOUND, ERR_DRAW_REQUEST_NOT_FOUND, ERR_UNIT_RESTRICTION_NOT_FOUND, ERR_REG_AGREEMENT_NOT_FOUND, ERR_COST_CERT_NOT_FOUND, ERR_CREDIT_ALLOCATION_NOT_FOUND, ERR_DELIVERY_NOT_FOUND, ERR_COMPLIANCE_REPORT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND)."
    applies_to: "all endpoints with a path parameter"
    error_id: "the entity-specific *_NOT_FOUND"

  - priority: 60
    name: referenced_foreign_keys_exist
    category: existence
    rule: "Every FK in the request body must resolve. Multiple unresolvable FKs in one body resolve in declaration order of §1.1, so POST /bond-issues with both a bad project_id and a bad volume_cap_allocation_id returns ERR_PROJECT_NOT_FOUND."
    applies_to: "POST /projects, POST /volume-cap-allocations, POST /bond-issues, POST /draw-requests, POST /unit-restrictions, POST /regulatory-agreements, POST /cost-certifications, POST /credit-allocations, POST /investor-deliveries, POST /compliance-reports, POST /physical-inspections"
    error_id: "the referenced entity's *_NOT_FOUND"

  - priority: 70
    name: expected_parent_version_matches
    category: concurrency
    rule: "When the endpoint declares an OCC guard in §1.2.1, the supplied expected_<parent>_version must equal the parent's current version field. Checked after existence and BEFORE any state or business rule, so a stale version wins over a wrong-state parent."
    applies_to: "POST /volume-cap-allocations/{id}/decision, POST /draw-requests, POST /investor-deliveries"
    error_id: "the rule's declared 412 (ERR_STALE_CAP_POOL_VERSION, ERR_STALE_BOND_ISSUE_VERSION, ERR_STALE_CREDIT_ALLOCATION_VERSION)"

  - priority: 80
    name: developer_is_active
    category: state
    rule: "The owning Developer.status must be ACTIVE for any project-advancing write (project creation, allocation request, bond creation, bond issuance, draw submission, cost-certification submission). A SUSPENDED or DEBARRED developer is blocked; read endpoints are unaffected."
    applies_to: "POST /projects, POST /volume-cap-allocations, POST /bond-issues, POST /bond-issues/{id}/issue, POST /draw-requests, POST /cost-certifications/{id}/submit"
    error_id: ERR_DEVELOPER_NOT_ACTIVE

  - priority: 81
    name: subject_entity_is_in_a_state_that_admits_the_trigger
    category: state
    rule: "The transition table of §1.2 governs: the subject's current state must have an outgoing transition for this trigger. Each entity maps to its own 409 - ERR_ALLOCATION_STATE_INVALID, ERR_BOND_ISSUE_STATE_INVALID, ERR_DRAW_STATE_INVALID, ERR_UNIT_RESTRICTION_STATE_INVALID, ERR_REG_AGREEMENT_STATE_INVALID, ERR_COST_CERT_STATE_INVALID, ERR_CREDIT_ALLOCATION_STATE_INVALID, ERR_DELIVERY_STATE_INVALID, ERR_INSPECTION_STATE_INVALID, ERR_COMPLIANCE_REPORT_STATE_INVALID. The Developer machine owns no dedicated 409, so a sanction action with no outgoing transition from the sponsor's current status - a SUSPEND against an already SUSPENDED sponsor, or any action at all against the terminal DEBARRED status - is reported as ERR_DEVELOPER_NOT_ACTIVE. Repeating a trigger that already fired hits this rule (no idempotent replay anywhere in this domain)."
    applies_to: "all transition endpoints"
    error_id: "the entity-specific *_STATE_INVALID"

  - priority: 82
    name: awarded_allocation_has_not_expired
    category: state
    rule: "POST /bond-issues requires the referenced VolumeCapAllocation.status == AWARDED and its expiry_date strictly after the current logical clock. An allocation whose expiry_date equals the clock instant is treated as expired (the deadline is exclusive)."
    applies_to: "POST /bond-issues, POST /bond-issues/{id}/issue"
    error_id: ERR_ALLOCATION_EXPIRED

  - priority: 85
    name: regulatory_agreement_is_recorded_before_issuance
    category: state
    rule: "A bond may not be issued until the project has a RegulatoryAgreement in status RECORDED. An agreement in DRAFT or AMENDMENT_PENDING does not satisfy the rule, and a RELEASED one does not either."
    applies_to: "POST /bond-issues/{id}/issue"
    error_id: ERR_REG_AGREEMENT_NOT_RECORDED

  - priority: 86
    name: project_is_placed_in_service_before_credit_allocation
    category: state
    rule: "POST /credit-allocations requires Project.development_status IN {PLACED_IN_SERVICE, STABILIZED}. A project still UNDER_CONSTRUCTION cannot receive a final allocation even when its cost certification is accepted."
    applies_to: "POST /credit-allocations"
    error_id: ERR_PROJECT_NOT_PLACED_IN_SERVICE

  - priority: 87
    name: cost_certification_is_accepted_before_credit_allocation
    category: state
    rule: "The referenced CostCertification.status must be ACCEPTED. A SUBMITTED or RETURNED_FOR_REVISION certification is rejected here even though it exists and belongs to the project."
    applies_to: "POST /credit-allocations"
    error_id: ERR_COST_CERT_NOT_ACCEPTED

  - priority: 88
    name: cost_certification_belongs_to_the_named_project
    category: state
    rule: "The referenced CostCertification.project_id must equal the request's project_id; a certification of a sibling project of the same developer is rejected."
    applies_to: "POST /credit-allocations"
    error_id: ERR_COST_CERT_PROJECT_MISMATCH

  - priority: 89
    name: fifty_percent_test_must_pass_for_credit_delivery
    category: state
    rule: "POST /credit-allocations/{id}/issue requires Project.automatic_credit_triggered == true, i.e. the FINAL_AT_COST_CERT variant of the 50% test passed. A project whose provisional test passed but whose final test fell below 5000 bps cannot deliver credit."
    applies_to: "POST /credit-allocations/{id}/issue"
    error_id: ERR_FIFTY_PERCENT_TEST_FAILED

  - priority: 90
    name: segregation_of_duties_between_award_and_credit_issuance
    category: state
    rule: "The X-User-ID issuing Form 8609 on POST /credit-allocations/{id}/issue must differ from VolumeCapAllocation.decided_by_user_id for the project's awarded allocation, and from CostCertification.reviewed_by_user_id of the referenced certification. The same officer may not both award cap and deliver credit."
    applies_to: "POST /credit-allocations/{id}/issue"
    error_id: ERR_SEGREGATION_OF_DUTIES

  - priority: 100
    name: draw_periods_do_not_overlap
    category: business_temporal
    rule: "A new DrawRequest's [period_start, period_end) must not strictly overlap the half-open interval of any existing draw of the same BondIssue with status IN {SUBMITTED, APPROVED, FUNDED}. Touching endpoints are allowed - a draw starting exactly when another ends is accepted. REJECTED and VOIDED draws are ignored and their interval is reusable."
    applies_to: "POST /draw-requests"
    error_id: ERR_DRAW_PERIOD_OVERLAP

  - priority: 101
    name: inspection_windows_respect_the_buffer
    category: business_temporal
    rule: "A new PhysicalInspection's CLOSED interval [window_start, window_end], expanded by INSPECTION_BUFFER_DAYS = 14 days on each side, must not intersect the unexpanded closed interval of any existing inspection of the same Project with status IN {SCHEDULED, COMPLETED}. Unlike draws, adjacency is a conflict here: the intervals are closed and separated windows need a real gap of more than 14 days."
    applies_to: "POST /physical-inspections"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT

  - priority: 102
    name: inspection_falls_inside_the_compliance_period
    category: business_temporal
    rule: "window_start must be >= Project.compliance_start_date and window_end <= Project.extended_use_end_date. Both bounds are inclusive."
    applies_to: "POST /physical-inspections"
    error_id: ERR_INSPECTION_OUTSIDE_COMPLIANCE_PERIOD

  - priority: 103
    name: compliance_report_year_is_unique_and_in_period
    category: business_temporal
    rule: "At most one ComplianceReport per (project_id, reporting_year) in any status, and reporting_year must fall within the calendar years spanned by Project.compliance_start_date through Project.extended_use_end_date inclusive."
    applies_to: "POST /compliance-reports"
    error_id: ERR_DUPLICATE_COMPLIANCE_REPORT

  - priority: 110
    name: pool_has_enough_awardable_cap
    category: business_fiscal
    rule: "On an award decision, awarded_amount_cents must be <= CapPool.awardable_cents computed before this allocation leaves PENDING. Equality is allowed and drives the pool to EXHAUSTED. A pool may be OVERSUBSCRIBED by pending requests without blocking the award."
    applies_to: "POST /volume-cap-allocations/{id}/decision"
    error_id: ERR_INSUFFICIENT_VOLUME_CAP

  - priority: 111
    name: par_amount_within_the_cap_award
    category: business_fiscal
    rule: "BondIssue.par_amount_cents, as solved by bond_sizing, must be <= VolumeCapAllocation.awarded_amount_cents. Because the denomination step rounds par UP, a sizing that fits before rounding can fail after it."
    applies_to: "POST /bond-issues"
    error_id: ERR_PAR_EXCEEDS_CAP_AWARD

  - priority: 112
    name: draw_does_not_exceed_undrawn_proceeds
    category: business_fiscal
    rule: "requested_amount_cents on POST /draw-requests, and approved_amount_cents on the draw decision, must each be <= BondIssue.undrawn_cents at that moment. Undrawn is reduced only by FUNDED draws, so several APPROVED-but-unfunded draws may together exceed the undrawn balance and the excess is caught at funding time."
    applies_to: "POST /draw-requests, POST /draw-requests/{id}/decision, POST /draw-requests/{id}/fund"
    error_id: ERR_DRAW_EXCEEDS_UNDRAWN

  - priority: 113
    name: negative_arbitrage_allowance_not_exceeded
    category: business_fiscal
    rule: "Funding a draw is refused when the recomputed BondIssue.negative_arbitrage_cents, including the draw being funded, would exceed negative_arbitrage_allowance_cents. Equality is allowed."
    applies_to: "POST /draw-requests/{id}/fund"
    error_id: ERR_NEGATIVE_ARBITRAGE_ALLOWANCE_EXCEEDED

  - priority: 114
    name: fifty_percent_test_at_issuance
    category: business_fiscal
    rule: "POST /bond-issues/{id}/issue computes the PROVISIONAL_AT_ISSUANCE variant and refuses when the ratio is below 5000 bps, because a bond issue that cannot trigger the automatic credit would strand the project."
    applies_to: "POST /bond-issues/{id}/issue"
    error_id: ERR_FIFTY_PERCENT_TEST_FAILED

  - priority: 115
    name: conversion_requires_coverage_and_stabilization
    category: business_fiscal
    rule: "POST /bond-issues/{id}/convert refuses when the selected DSCR variant yields dscr_bps < MIN_DSCR_BPS (ERR_DSCR_BELOW_MINIMUM) or when min_occupancy_bps over the window < STABILIZED_OCCUPANCY_BPS (ERR_OCCUPANCY_BELOW_STABILIZATION); the coverage failure is reported first when both hold. Too few operating months for the requested window is ERR_INSUFFICIENT_OPERATING_HISTORY and is checked before either."
    applies_to: "POST /bond-issues/{id}/convert"
    error_id: ERR_DSCR_BELOW_MINIMUM

  - priority: 116
    name: delivery_has_credit_left_to_deliver
    category: business_fiscal
    rule: "POST /investor-deliveries refuses when the allocation's undelivered_credit_cents is already 0. A positive but insufficient remainder is NOT an error: delivered_credit_cents is clamped down to the remainder."
    applies_to: "POST /investor-deliveries"
    error_id: ERR_NO_UNDELIVERED_CREDIT

  - priority: 120
    name: set_aside_election_is_satisfied_before_recording
    category: business_safety
    rule: "POST /regulatory-agreements/{id}/record refuses unless Project.set_aside_satisfied == true under set_aside_compliance_ratio. This protects the tenants the recorded covenant is meant to bind and is checked BEFORE the structural term-length rules below."
    applies_to: "POST /regulatory-agreements/{id}/record, POST /bond-issues/{id}/issue"
    error_id: ERR_SET_ASIDE_NOT_SATISFIED

  - priority: 121
    name: every_designated_unit_is_accounted_for_before_recording
    category: business_safety
    rule: "Recording requires Project.designated_unit_count == Project.total_units, i.e. every unit carries a designation. Under-designation would let unrestricted units hide outside the covenant."
    applies_to: "POST /regulatory-agreements/{id}/record"
    error_id: ERR_UNIT_COUNT_MISMATCH

  - priority: 130
    name: agreement_election_matches_the_project_election
    category: business_constraint
    rule: "RegulatoryAgreement.set_aside_election must equal Project.set_aside_election at creation and after any amendment."
    applies_to: "POST /regulatory-agreements, POST /regulatory-agreements/{id}/amend"
    error_id: ERR_SET_ASIDE_MISMATCH

  - priority: 131
    name: extended_use_term_is_long_enough
    category: business_constraint
    rule: "extended_use_years must be >= compliance_period_years + MIN_EXTENDED_USE_GAP_YEARS (15), and compliance_period_years must be >= MIN_COMPLIANCE_PERIOD_YEARS (15). Equality passes."
    applies_to: "POST /regulatory-agreements, POST /regulatory-agreements/{id}/amend"
    error_id: ERR_EXTENDED_USE_TOO_SHORT

  - priority: 132
    name: unit_number_is_unique_within_the_project
    category: business_constraint
    rule: "unit_number is unique per project across every UnitRestriction status including RELEASED (ERR_DUPLICATE_UNIT_NUMBER), and the count of UnitRestriction rows may never exceed Project.total_units (ERR_UNIT_COUNT_EXCEEDS_TOTAL, same priority, checked after the uniqueness test)."
    applies_to: "POST /unit-restrictions"
    error_id: ERR_DUPLICATE_UNIT_NUMBER

  - priority: 133
    name: ami_percent_is_allowed_for_the_designation_and_election
    category: business_constraint
    rule: "ami_percent is required when designation == RESTRICTED and must be omitted otherwise; when supplied it must be one of {20, 30, 40, 50, 60, 70, 80}, and values above 60 are permitted only when Project.set_aside_election == AVG_INCOME."
    applies_to: "POST /unit-restrictions, PATCH /unit-restrictions/{id}"
    error_id: ERR_AMI_PERCENT_NOT_ALLOWED

  - priority: 134
    name: operating_month_index_is_unique_and_contiguous
    category: business_constraint
    rule: "POST /bond-issues/{id}/operating-months rejects a month_index already present, and requires month_index == count(existing) + 1 so the series is contiguous from 1."
    applies_to: "POST /bond-issues/{id}/operating-months"
    error_id: ERR_DUPLICATE_OPERATING_MONTH

  - priority: 135
    name: one_live_allocation_per_project_per_pool
    category: business_constraint
    rule: "A project may hold at most one VolumeCapAllocation in status IN {PENDING, AWARDED, COMMITTED} at a time, and at most one CreditAllocation in status IN {PENDING, ISSUED, RECAPTURE_PENDING}."
    applies_to: "POST /volume-cap-allocations, POST /credit-allocations"
    error_id: ERR_ALLOCATION_ALREADY_EXISTS

  - priority: 136
    name: compliance_report_counts_are_coherent
    category: business_constraint
    rule: "restricted_units_occupied <= total_units_occupied <= Project.total_units, and average_ami_percent between 1 and 80 inclusive."
    applies_to: "POST /compliance-reports"
    error_id: ERR_REPORT_COUNTS_INCOHERENT

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# api_prefix is "" so every collection is a top-level path. Headers on every
# call: X-User-Role (required, one of §1.7) and X-User-ID (required whenever
# the role is entity_backed or the endpoint records an actor id). Every list
# endpoint accepts limit? and offset? and returns the paginated envelope of
# §1.0 with total_count and has_more.
# ---------------------------------------------------------------------------
endpoints:
  # ---- reads: single resource ---------------------------------------------
  - method: GET
    path: "/developers/{id}"
    description: "Fetch one development sponsor, including its sanction status and active project count."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer, BondTrustee]
    code: 200
    input: []
    output: Developer
    side_effects: []

  - method: GET
    path: "/investors/{id}"
    description: "Fetch one tax-credit investor and its cumulative accepted credit."
    roles: [Investor, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: Investor
    side_effects: []

  - method: GET
    path: "/cap-pools/{id}"
    description: "Fetch one program-year private-activity volume cap pool with its live reserved, committed and available balances. This is the read that supplies expected_cap_pool_version for the award decision."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: CapPool
    side_effects: []

  - method: GET
    path: "/projects/{id}"
    description: "Fetch one development with both status axes, the derived unit-designation counts, the applicable fraction, the set-aside ratio and both fifty-percent-test ratios."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer, BondTrustee]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/volume-cap-allocations/{id}"
    description: "Fetch one volume cap allocation request with its award amount, expiry date and decision round."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: VolumeCapAllocation
    side_effects: []

  - method: GET
    path: "/bond-issues/{id}"
    description: "Fetch one bond issue with the solved sizing, the undrawn balance, the negative-arbitrage accrual and allowance, the recorded operating months and the conversion test results. This is the read that supplies expected_bond_issue_version for draw creation."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer, BondTrustee]
    code: 200
    input: []
    output: BondIssue
    side_effects: []

  - method: GET
    path: "/draw-requests/{id}"
    description: "Fetch one construction-period draw request with its approved amount and its own negative-arbitrage accrual."
    roles: [Developer, HfaAllocationOfficer, BondTrustee]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []

  - method: GET
    path: "/unit-restrictions/{id}"
    description: "Fetch one unit's designation, elected AMI band, imputed household size and computed restricted rent ceiling."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: UnitRestriction
    side_effects: []

  - method: GET
    path: "/regulatory-agreements/{id}"
    description: "Fetch one land-use restriction agreement with its recording data, compliance-period end and extended-use end."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryAgreement
    side_effects: []

  - method: GET
    path: "/cost-certifications/{id}"
    description: "Fetch one final cost certification with its certified aggregate basis, submission round and review outcome."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: CostCertification
    side_effects: []

  - method: GET
    path: "/credit-allocations/{id}"
    description: "Fetch one final credit allocation with the qualified basis, annual and total credit, delivered and undelivered credit, Form 8609 number and recapture exposure. This is the read that supplies expected_credit_allocation_version for delivery creation."
    roles: [Developer, Investor, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: CreditAllocation
    side_effects: []

  - method: GET
    path: "/investor-deliveries/{id}"
    description: "Fetch one credit delivery with the clamped delivered credit and the derived price per credit dollar."
    roles: [Developer, Investor, HfaAllocationOfficer]
    code: 200
    input: []
    output: InvestorDelivery
    side_effects: []

  - method: GET
    path: "/compliance-reports/{id}"
    description: "Fetch one annual compliance report with the achieved set-aside ratio, shortfall and finding notes."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReport
    side_effects: []

  - method: GET
    path: "/physical-inspections/{id}"
    description: "Fetch one physical inspection with its window, score, deficiency count and next due date."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: []
    output: PhysicalInspection
    side_effects: []

  # ---- reads: filtered lists (FK reverse-reachability) --------------------
  - method: GET
    path: "/projects"
    description: "List developments, optionally narrowed to one sponsor or one development status. Ordered by created_at ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer, BondTrustee]
    code: 200
    input: ["developer_id?", "development_status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/volume-cap-allocations"
    description: "List volume cap allocation requests, optionally narrowed to one project, one cap pool or one status. Ordered by created_at ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "cap_pool_id?", "status?", "limit?", "offset?"]
    output: VolumeCapAllocation[]
    side_effects: []

  - method: GET
    path: "/bond-issues"
    description: "List bond issues, optionally narrowed to one project, one volume cap allocation or one status. Ordered by created_at ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer, BondTrustee]
    code: 200
    input: ["project_id?", "volume_cap_allocation_id?", "status?", "limit?", "offset?"]
    output: BondIssue[]
    side_effects: []

  - method: GET
    path: "/draw-requests"
    description: "List construction draws, optionally narrowed to one bond issue or one status. Ordered by period_start ASC then draw_number ASC, the same order the negative-arbitrage series uses."
    roles: [Developer, HfaAllocationOfficer, BondTrustee]
    code: 200
    input: ["bond_issue_id?", "status?", "limit?", "offset?"]
    output: DrawRequest[]
    side_effects: []

  - method: GET
    path: "/unit-restrictions"
    description: "List unit designations, optionally narrowed to one project, designation or status. Ordered by unit_number ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "designation?", "status?", "limit?", "offset?"]
    output: UnitRestriction[]
    side_effects: []

  - method: GET
    path: "/regulatory-agreements"
    description: "List land-use restriction agreements, optionally narrowed to one project or status. Ordered by created_at ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: RegulatoryAgreement[]
    side_effects: []

  - method: GET
    path: "/cost-certifications"
    description: "List cost certifications, optionally narrowed to one project or status. Ordered by created_at ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: CostCertification[]
    side_effects: []

  - method: GET
    path: "/credit-allocations"
    description: "List final credit allocations, optionally narrowed to one project, one cost certification or one status. Ordered by created_at ASC."
    roles: [Developer, Investor, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "cost_certification_id?", "status?", "limit?", "offset?"]
    output: CreditAllocation[]
    side_effects: []

  - method: GET
    path: "/investor-deliveries"
    description: "List credit deliveries, optionally narrowed to one credit allocation, one investor or one status. Ordered by created_at ASC, which is the order the delivery waterfall fills."
    roles: [Developer, Investor, HfaAllocationOfficer]
    code: 200
    input: ["credit_allocation_id?", "investor_id?", "status?", "limit?", "offset?"]
    output: InvestorDelivery[]
    side_effects: []

  - method: GET
    path: "/compliance-reports"
    description: "List annual compliance reports, optionally narrowed to one project, reporting year or status. Ordered by reporting_year ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "reporting_year?", "status?", "limit?", "offset?"]
    output: ComplianceReport[]
    side_effects: []

  - method: GET
    path: "/physical-inspections"
    description: "List physical inspections, optionally narrowed to one project or status. Ordered by window_start ASC."
    roles: [Developer, HfaAllocationOfficer, HfaComplianceOfficer]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: PhysicalInspection[]
    side_effects: []

  # ---- writes: sponsors, investors, pools, projects, units ----------------
  - method: POST
    path: "/developers"
    description: "Register a development sponsor. Created ACTIVE with active_project_count 0."
    roles: [HfaAllocationOfficer]
    code: 201
    input: [name, tax_id, contact_email]
    output: Developer
    side_effects: ["creates Developer in status ACTIVE"]

  - method: POST
    path: "/developers/{id}/sanctions"
    description: "Apply or lift a sponsor sanction. action is one of SUSPEND, REINSTATE, DEBAR and drives the Developer status machine."
    roles: [HfaComplianceOfficer]
    code: 200
    input: [action, reason]
    output: Developer
    side_effects:
      - "transitions Developer.status per §1.2 (ACTIVE -> SUSPENDED, SUSPENDED -> ACTIVE, ACTIVE -> DEBARRED)"
      - "sets sanction_reason on SUSPEND and DEBAR, clears it on REINSTATE"
      - "on DEBAR, sets Project.financing_stalled = true on every project of the sponsor whose development_status is PLANNING, FINANCED or UNDER_CONSTRUCTION"
      - "increments Developer.version by 1"

  - method: POST
    path: "/investors"
    description: "Register a tax-credit investor. investor_type is one of SYNDICATOR, DIRECT_CORPORATE, FUND."
    roles: [HfaAllocationOfficer]
    code: 201
    input: [name, tax_id, investor_type]
    output: Investor
    side_effects: ["creates Investor with total_credit_accepted_cents 0"]

  - method: POST
    path: "/cap-pools"
    description: "Open a program-year private-activity volume cap pool. total_cap_cents is solved as base_cap_cents + carryforward_cents and the pool opens with pool_status OPEN."
    roles: [HfaAllocationOfficer]
    code: 201
    input: [program_year, base_cap_cents, "carryforward_cents?"]
    output: CapPool
    side_effects:
      - "runs cap_pool_availability: total_cap_cents, reserved_cents 0, committed_cents 0, available_cents == total_cap_cents, awardable_cents == total_cap_cents, pool_status OPEN"

  - method: POST
    path: "/projects"
    description: "File a development. developer_id must equal X-User-ID. aggregate_basis_cents is solved as land_cost_cents + depreciable_basis_cents and both status axes start at PLANNING / UNRESTRICTED."
    roles: [Developer]
    code: 201
    input: [developer_id, name, total_units, total_floor_space_sqft, land_cost_cents, depreciable_basis_cents, set_aside_election]
    output: Project
    side_effects:
      - "computes aggregate_basis_cents"
      - "increments Developer.active_project_count by 1 and Developer.version by 1"

  - method: POST
    path: "/unit-restrictions"
    description: "Designate one unit as RESTRICTED, MARKET or EMPLOYEE_UNIT. A RESTRICTED unit requires ami_percent and gets its restricted_rent_cents solved by restricted_rent_ceiling."
    roles: [Developer]
    code: 201
    input: [project_id, unit_number, bedroom_count, floor_space_sqft, designation, "ami_percent?", utility_allowance_cents, market_rent_cents]
    output: UnitRestriction
    side_effects:
      - "computes imputed_household_size and, for RESTRICTED, restricted_rent_cents via restricted_rent_ceiling"
      - "re-derives Project.restricted_unit_count, market_unit_count, employee_unit_count, designated_unit_count"
      - "re-runs applicable_fraction, writing Project.unit_fraction_bps, floor_space_fraction_bps and applicable_fraction_bps"
      - "re-runs set_aside_compliance_ratio, writing Project.set_aside_ratio_bps and set_aside_satisfied"
      - "increments Project.version by 1"

  - method: PATCH
    path: "/unit-restrictions/{id}"
    description: "Redesignate a unit or restate its rent inputs. Allowed only while the unit is PROPOSED or ACTIVE. Every derived project figure is re-derived from scratch, so redesignating a unit and reverting it restores the prior applicable fraction exactly."
    roles: [Developer]
    code: 200
    input: [designation, "ami_percent?", "utility_allowance_cents?", "market_rent_cents?"]
    output: UnitRestriction
    side_effects:
      - "recomputes restricted_rent_cents (set to null when the new designation is not RESTRICTED)"
      - "re-derives the same five Project designation counters and both fractions as POST /unit-restrictions"
      - "re-runs set_aside_compliance_ratio"
      - "increments Project.version by 1"

  # ---- writes: volume cap ---------------------------------------------------
  - method: POST
    path: "/volume-cap-allocations"
    description: "Request private-activity volume cap for a project from one program-year pool. Opens in PENDING and immediately reserves requested_amount_cents against the pool."
    roles: [Developer]
    code: 201
    input: [project_id, cap_pool_id, requested_amount_cents, requested_closing_date]
    output: VolumeCapAllocation
    side_effects:
      - "re-runs cap_pool_availability: reserved_cents rises by requested_amount_cents, available_cents falls, pool_status may become OVERSUBSCRIBED"
      - "increments CapPool.version by 1"

  - method: POST
    path: "/volume-cap-allocations/{id}/decision"
    description: "Award or deny a pending cap request. decision is AWARD or DENY. AWARD requires awarded_amount_cents and expiry_date; DENY requires denial_reason. expected_cap_pool_version guards against deciding on a stale view of pool availability."
    roles: [HfaAllocationOfficer]
    code: 200
    input: [decision, "awarded_amount_cents?", "expiry_date?", "denial_reason?", expected_cap_pool_version]
    output: VolumeCapAllocation
    side_effects:
      - "transitions PENDING -> AWARDED or PENDING -> DENIED"
      - "records decided_by_user_id from X-User-ID (consumed later by the segregation-of-duties rule)"
      - "re-runs cap_pool_availability: on AWARD reserved_cents falls by requested_amount_cents and committed_cents rises by awarded_amount_cents; on DENY reserved_cents falls with no committed rise"
      - "when the award drives pool_status to EXHAUSTED, cascades every other PENDING allocation of the same pool to DEFERRED and increments each project's volume_cap_deferral_count"
      - "increments CapPool.version by 1"

  - method: POST
    path: "/volume-cap-allocations/{id}/return"
    description: "Return an unused award to the pool before it is committed to a bond issue."
    roles: [Developer]
    code: 200
    input: [return_reason]
    output: VolumeCapAllocation
    side_effects:
      - "transitions AWARDED -> RETURNED"
      - "re-runs cap_pool_availability: committed_cents falls by awarded_amount_cents, awardable_cents and available_cents rise, pool_status may fall back from EXHAUSTED to OPEN or OVERSUBSCRIBED"
      - "increments CapPool.version by 1"

  - method: POST
    path: "/volume-cap-allocations/{id}/revise"
    description: "Re-file a denied, deferred or returned request with a new amount and closing date. Returns the allocation to PENDING and increments decision_round."
    roles: [Developer]
    code: 200
    input: [requested_amount_cents, requested_closing_date]
    output: VolumeCapAllocation
    side_effects:
      - "transitions DENIED, DEFERRED or RETURNED -> PENDING, increments decision_round by 1, clears awarded_amount_cents, expiry_date, denial_reason, return_reason and decided_by_user_id"
      - "re-runs cap_pool_availability: reserved_cents rises by the NEW requested_amount_cents"
      - "increments CapPool.version by 1"

  # ---- writes: regulatory agreement ---------------------------------------
  - method: POST
    path: "/regulatory-agreements"
    description: "Draft the land-use restriction agreement. set_aside_election must match the project's election; compliance_period_years and extended_use_years must satisfy the term-length rule."
    roles: [Developer]
    code: 201
    input: [project_id, set_aside_election, compliance_period_years, extended_use_years, recording_county]
    output: RegulatoryAgreement
    side_effects: ["creates RegulatoryAgreement in DRAFT"]

  - method: POST
    path: "/regulatory-agreements/{id}/record"
    description: "Record the agreement with the county. Requires the project's set-aside election to be satisfied and every unit designated. Also used to re-record after an amendment."
    roles: [HfaComplianceOfficer]
    code: 200
    input: [instrument_number]
    output: RegulatoryAgreement
    side_effects:
      - "transitions DRAFT -> RECORDED or AMENDMENT_PENDING -> RECORDED, stamping recording_date from the logical clock"
      - "sets compliance_period_end_date = recording_date + compliance_period_years and extended_use_end_date = recording_date + extended_use_years"
      - "cascades Project.compliance_status UNRESTRICTED -> RESTRICTED and copies compliance_start_date, compliance_end_date and extended_use_end_date onto the Project"
      - "increments Project.version by 1"

  - method: POST
    path: "/regulatory-agreements/{id}/amend"
    description: "Open an amendment to a recorded agreement, which must be re-recorded to take effect."
    roles: [HfaComplianceOfficer]
    code: 200
    input: [amendment_reason, "compliance_period_years?", "extended_use_years?"]
    output: RegulatoryAgreement
    side_effects:
      - "transitions RECORDED -> AMENDMENT_PENDING and stamps amendment_reason; amendment_count is incremented only when the amendment is re-recorded"
      - "leaves Project.compliance_status at its current value until the amendment is recorded"

  # ---- writes: bond issuance and construction draws -----------------------
  - method: POST
    path: "/bond-issues"
    description: "Size the tax-exempt bond issue against an awarded cap allocation. bond_sizing solves issuance_allowance_cents and par_amount_cents, and negative_arbitrage_allowance_cents is set from par. Opens in DRAFT."
    roles: [Developer]
    code: 201
    input: [project_id, volume_cap_allocation_id, eligible_cost_cents, capitalized_interest_cents, bond_yield_bps, investment_yield_bps]
    output: BondIssue
    side_effects:
      - "runs bond_sizing: issuance_allowance_cents, par_amount_cents, negative_arbitrage_allowance_cents"
      - "sets cumulative_funded_cents 0 and undrawn_cents == par_amount_cents"

  - method: POST
    path: "/bond-issues/{id}/issue"
    description: "Close and issue the bonds. Runs the PROVISIONAL_AT_ISSUANCE variant of the fifty-percent aggregate basis test and commits the volume cap."
    roles: [BondTrustee]
    code: 200
    input: [closing_date]
    output: BondIssue
    side_effects:
      - "transitions DRAFT -> ISSUED and stamps closing_date"
      - "runs fifty_percent_aggregate_basis_test variant PROVISIONAL_AT_ISSUANCE, writing Project.provisional_fifty_percent_ratio_bps and setting Project.automatic_credit_triggered = true when it passes"
      - "cascades VolumeCapAllocation AWARDED -> COMMITTED"
      - "cascades Project.development_status PLANNING -> FINANCED"
      - "increments Project.version by 1 and BondIssue.version by 1"

  - method: POST
    path: "/bond-issues/{id}/operating-months"
    description: "Record one stabilized-operations month on an issued bond. month_index must be exactly count(existing) + 1 so the series stays contiguous. The first recorded month places the project in service."
    roles: [Developer]
    code: 200
    input: [month_index, noi_cents, debt_service_cents, occupied_units]
    output: BondIssue
    side_effects:
      - "appends {month_index, noi_cents, debt_service_cents, occupied_units} to BondIssue.operating_months"
      - "on the first month only, cascades Project.development_status UNDER_CONSTRUCTION -> PLACED_IN_SERVICE and stamps Project.placed_in_service_date from the logical clock"
      - "increments BondIssue.version by 1"

  - method: POST
    path: "/bond-issues/{id}/convert"
    description: "Convert the construction bonds to permanent financing. dscr_basis selects the T3 or T12 variant of debt_service_coverage_ratio; both the coverage and the stabilization-occupancy tests must pass."
    roles: [BondTrustee]
    code: 200
    input: [dscr_basis, conversion_date]
    output: BondIssue
    side_effects:
      - "runs debt_service_coverage_ratio under the requested variant, writing dscr_bps, dscr_basis and min_occupancy_bps"
      - "transitions ISSUED -> CONVERTED and stamps conversion_date"
      - "cascades Project.development_status PLACED_IN_SERVICE -> STABILIZED"
      - "cascades every PROPOSED UnitRestriction of the project to ACTIVE"
      - "increments Project.version by 1"

  - method: POST
    path: "/bond-issues/{id}/mandatory-redeem"
    description: "Redeem the issue for failure to meet a program condition. Unwinds the financing: the project is withdrawn and the committed volume cap is released back to the pool."
    roles: [BondTrustee]
    code: 200
    input: [redemption_date, reason]
    output: BondIssue
    side_effects:
      - "transitions ISSUED -> MANDATORY_REDEEMED and stamps redemption_date"
      - "cascades Project.development_status FINANCED or UNDER_CONSTRUCTION -> WITHDRAWN"
      - "cascades VolumeCapAllocation COMMITTED -> RELEASED and re-runs cap_pool_availability so committed_cents falls by awarded_amount_cents"
      - "increments Project.version by 1 and CapPool.version by 1"

  - method: POST
    path: "/draw-requests"
    description: "Submit a construction-period draw against an issued bond for a half-open funding period. expected_bond_issue_version guards against sizing the draw on a stale undrawn balance."
    roles: [Developer]
    code: 201
    input: [bond_issue_id, draw_number, period_start, period_end, requested_amount_cents, expected_bond_issue_version]
    output: DrawRequest
    side_effects:
      - "creates DrawRequest in SUBMITTED"
      - "increments BondIssue.version by 1"

  - method: POST
    path: "/draw-requests/{id}/decision"
    description: "Approve or reject a submitted draw. decision is APPROVE (requires approved_amount_cents, which may be less than requested) or REJECT (requires rejection_reason)."
    roles: [BondTrustee]
    code: 200
    input: [decision, "approved_amount_cents?", "rejection_reason?"]
    output: DrawRequest
    side_effects:
      - "transitions SUBMITTED -> APPROVED or SUBMITTED -> REJECTED"
      - "on REJECT, frees the draw's funding period so a later draw may reuse the interval"

  - method: POST
    path: "/draw-requests/{id}/fund"
    description: "Fund an approved draw. Re-runs the chronological negative-arbitrage series over all funded draws and refuses when the allowance would be exceeded."
    roles: [BondTrustee]
    code: 200
    input: [funding_date]
    output: DrawRequest
    side_effects:
      - "transitions APPROVED -> FUNDED and stamps funding_date"
      - "raises BondIssue.cumulative_funded_cents by approved_amount_cents and lowers undrawn_cents by the same amount, preserving par_amount_cents == cumulative_funded_cents + undrawn_cents"
      - "re-runs negative_arbitrage_cost over the FUNDED draws in period_start ASC order, rewriting each draw's negative_arbitrage_accrual_cents and BondIssue.negative_arbitrage_cents"
      - "on the first funded draw of the issue, cascades Project.development_status FINANCED -> UNDER_CONSTRUCTION"
      - "increments BondIssue.version by 1"

  - method: POST
    path: "/draw-requests/{id}/void"
    description: "Void a funded draw whose proceeds were returned. Fully compensates the funding: the undrawn balance and the whole negative-arbitrage series are restored as if the draw had never funded."
    roles: [BondTrustee]
    code: 200
    input: [void_reason]
    output: DrawRequest
    side_effects:
      - "transitions FUNDED -> VOIDED and zeroes the draw's negative_arbitrage_accrual_cents"
      - "lowers BondIssue.cumulative_funded_cents by approved_amount_cents and raises undrawn_cents by the same amount"
      - "re-runs negative_arbitrage_cost over the SURVIVING funded draws, so every later draw's accrual is recomputed against the restored undrawn balances"
      - "increments BondIssue.version by 1"

  # ---- writes: cost certification, credit allocation, delivery ------------
  - method: POST
    path: "/cost-certifications"
    description: "Draft the final cost certification. certified_aggregate_basis_cents is solved as certified_land_cost_cents + certified_depreciable_basis_cents. Opens in DRAFT with submission_round 0."
    roles: [Developer]
    code: 201
    input: [project_id, certified_land_cost_cents, certified_depreciable_basis_cents, certified_eligible_basis_cents, preparer_name]
    output: CostCertification
    side_effects: ["computes certified_aggregate_basis_cents"]

  - method: POST
    path: "/cost-certifications/{id}/submit"
    description: "Submit the certification for agency review, or resubmit one that was returned for revision."
    roles: [Developer]
    code: 200
    input: ["certified_land_cost_cents?", "certified_depreciable_basis_cents?", "certified_eligible_basis_cents?"]
    output: CostCertification
    side_effects:
      - "transitions DRAFT -> SUBMITTED or RETURNED_FOR_REVISION -> SUBMITTED and increments submission_round by 1"
      - "re-computes certified_aggregate_basis_cents when any certified figure is restated"

  - method: POST
    path: "/cost-certifications/{id}/review"
    description: "Accept the certification or return it for revision. decision is ACCEPT or RETURN. ACCEPT runs the FINAL_AT_COST_CERT variant of the fifty-percent aggregate basis test, which can revoke a credit trigger the provisional variant granted."
    roles: [HfaAllocationOfficer]
    code: 200
    input: [decision, "deficiency_notes?"]
    output: CostCertification
    side_effects:
      - "transitions SUBMITTED -> ACCEPTED (stamping accepted_at and reviewed_by_user_id from X-User-ID) or SUBMITTED -> RETURNED_FOR_REVISION"
      - "on ACCEPT, runs fifty_percent_aggregate_basis_test variant FINAL_AT_COST_CERT over FUNDED draw proceeds and the certified aggregate basis, writing Project.final_fifty_percent_ratio_bps and OVERWRITING Project.automatic_credit_triggered with the final result"
      - "increments Project.version by 1"

  - method: POST
    path: "/credit-allocations"
    description: "Compute the final housing credit allocation from an accepted cost certification. qualified_basis_and_annual_credit solves the qualified basis per restricted unit, the annual credit and the ten-year total."
    roles: [HfaAllocationOfficer]
    code: 201
    input: [project_id, cost_certification_id, credit_percentage_bps, placed_in_service_date]
    output: CreditAllocation
    side_effects:
      - "runs qualified_basis_and_annual_credit: qualified_basis_cents, applicable_fraction_bps snapshot, annual_credit_cents, total_credit_cents"
      - "sets delivered_credit_cents 0 and undelivered_credit_cents == total_credit_cents"
      - "creates the allocation in PENDING"

  - method: POST
    path: "/credit-allocations/{id}/issue"
    description: "Issue Form 8609 and make the credit deliverable. Requires the final fifty-percent test to have passed and enforces segregation of duties against the cap award and the cost-certification review."
    roles: [HfaAllocationOfficer]
    code: 200
    input: [form_8609_number]
    output: CreditAllocation
    side_effects:
      - "transitions PENDING -> ISSUED, stamps form_8609_number and issued_by_user_id from X-User-ID"
      - "increments CreditAllocation.version by 1"

  - method: POST
    path: "/investor-deliveries"
    description: "Deliver credit to an investor. credit_delivery_waterfall clamps delivered_credit_cents to the undelivered remainder and derives price_per_credit_dollar_bps. expected_credit_allocation_version guards against pricing against a stale remainder."
    roles: [Developer]
    code: 201
    input: [credit_allocation_id, investor_id, requested_credit_cents, capital_contribution_cents, expected_credit_allocation_version]
    output: InvestorDelivery
    side_effects:
      - "runs credit_delivery_waterfall: delivered_credit_cents = min(requested, remaining), price_per_credit_dollar_bps"
      - "raises CreditAllocation.delivered_credit_cents and lowers undelivered_credit_cents by delivered_credit_cents"
      - "creates the delivery in DELIVERED"
      - "increments CreditAllocation.version by 1"

  - method: POST
    path: "/investor-deliveries/{id}/accept"
    description: "Investor accepts a delivered credit strip. investor_id must equal X-User-ID."
    roles: [Investor]
    code: 200
    input: []
    output: InvestorDelivery
    side_effects:
      - "transitions DELIVERED -> ACCEPTED and stamps accepted_at"
      - "raises Investor.total_credit_accepted_cents by delivered_credit_cents"
      - "increments Investor.version by 1"

  - method: POST
    path: "/investor-deliveries/{id}/rescind"
    description: "Rescind a delivered or accepted strip. Fully compensates the delivery so the allocation's conservation invariant is restored."
    roles: [Developer]
    code: 200
    input: [rescind_reason]
    output: InvestorDelivery
    side_effects:
      - "transitions DELIVERED -> RESCINDED or ACCEPTED -> RESCINDED"
      - "lowers CreditAllocation.delivered_credit_cents and raises undelivered_credit_cents by delivered_credit_cents"
      - "when the delivery was ACCEPTED, lowers Investor.total_credit_accepted_cents by delivered_credit_cents"
      - "increments CreditAllocation.version by 1"

  # ---- writes: ongoing compliance -----------------------------------------
  - method: POST
    path: "/compliance-reports"
    description: "File the annual owner compliance certification for one reporting year. achieved_set_aside_bps is derived from restricted_units_occupied over the project's total units."
    roles: [Developer]
    code: 201
    input: [project_id, reporting_year, restricted_units_occupied, total_units_occupied, average_ami_percent]
    output: ComplianceReport
    side_effects:
      - "computes achieved_set_aside_bps and shortfall_bps"
      - "creates the report in SUBMITTED"

  - method: POST
    path: "/compliance-reports/{id}/review"
    description: "Agency review of an annual report. finding is CLEARED or NONCOMPLIANCE. A noncompliance finding cascades three levels: project compliance axis, credit allocation, and every accepted investor delivery."
    roles: [HfaComplianceOfficer]
    code: 200
    input: [finding, "finding_notes?"]
    output: ComplianceReport
    side_effects:
      - "transitions SUBMITTED -> CLEARED or SUBMITTED -> NONCOMPLIANCE_FOUND and stamps reviewed_by_user_id"
      - "on NONCOMPLIANCE, cascades Project.compliance_status RESTRICTED -> NONCOMPLIANT, then CreditAllocation ISSUED -> RECAPTURE_PENDING with recapture_exposure written to recapture_amount_cents, then every ACCEPTED InvestorDelivery of that allocation to RECAPTURE_FLAGGED"
      - "on a NONCOMPLIANCE finding while the allocation is already RECAPTURE_PENDING, cascades CreditAllocation RECAPTURE_PENDING -> RECAPTURED"
      - "on CLEARED while the project is NONCOMPLIANT, reverses the chain: Project NONCOMPLIANT -> RESTRICTED, CreditAllocation RECAPTURE_PENDING -> ISSUED with recapture_amount_cents reset to 0, and every RECAPTURE_FLAGGED delivery back to ACCEPTED"
      - "increments Project.version and CreditAllocation.version by 1 each when the cascade fires"

  - method: POST
    path: "/physical-inspections"
    description: "Schedule a physical inspection window inside the project's compliance period. Windows are closed intervals and must clear a fourteen-day buffer from every other scheduled or completed window."
    roles: [HfaComplianceOfficer]
    code: 201
    input: [project_id, window_start, window_end, inspector_name]
    output: PhysicalInspection
    side_effects: ["creates the inspection in SCHEDULED"]

  - method: POST
    path: "/physical-inspections/{id}/complete"
    description: "Record the inspection result. next_inspection_due_date is set to completed_date + INSPECTION_INTERVAL_DAYS (1095)."
    roles: [HfaComplianceOfficer]
    code: 200
    input: [completed_date, score, deficiency_count]
    output: PhysicalInspection
    side_effects:
      - "transitions SCHEDULED -> COMPLETED and computes next_inspection_due_date"

  # ---- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, window and period rule in this domain reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and the server never falls back to wall-clock time. Advancing the clock evaluates every time-gated transition in §1.2 (allocation expiry, inspection no-show, compliance-period and extended-use-period rollovers) in a single pass."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "cascades VolumeCapAllocation AWARDED -> EXPIRED for every award whose expiry_date is now strictly in the past"
      - "cascades PhysicalInspection SCHEDULED -> MISSED for every inspection whose window_end is now strictly in the past"
      - "cascades Project.compliance_status RESTRICTED -> EXTENDED_USE past compliance_end_date and EXTENDED_USE -> RELEASED past extended_use_end_date, releasing the RegulatoryAgreement and every ACTIVE UnitRestriction on the second step"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# Every code below is reachable from at least one §1.5 endpoint. Ordering here
# follows the §1.4 priority bands, not alphabetical order.
# ---------------------------------------------------------------------------
errors:
  # auth / identity
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or blank, or X-User-ID missing on an endpoint that needs an actor identity"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not in the endpoint's declared roles list"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Developer acts on a project it does not own, or an Investor acts on a delivery whose investor_id is not the caller"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the officer issuing Form 8609 is the same user who awarded the volume cap or accepted the cost certification"

  # input
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, negative money or basis-point value, malformed timestamp, or period_end not strictly after period_start"

  # existence
  - id: ERR_DEVELOPER_NOT_FOUND
    http: 404
    condition: "developer_id or the path developer id does not resolve"
  - id: ERR_INVESTOR_NOT_FOUND
    http: 404
    condition: "investor_id or the path investor id does not resolve"
  - id: ERR_CAP_POOL_NOT_FOUND
    http: 404
    condition: "cap_pool_id or the path cap pool id does not resolve"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project_id or the path project id does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "volume_cap_allocation_id or the path allocation id does not resolve"
  - id: ERR_BOND_ISSUE_NOT_FOUND
    http: 404
    condition: "bond_issue_id or the path bond issue id does not resolve"
  - id: ERR_DRAW_REQUEST_NOT_FOUND
    http: 404
    condition: "the path draw request id does not resolve"
  - id: ERR_UNIT_RESTRICTION_NOT_FOUND
    http: 404
    condition: "the path unit restriction id does not resolve"
  - id: ERR_REG_AGREEMENT_NOT_FOUND
    http: 404
    condition: "the path regulatory agreement id does not resolve"
  - id: ERR_COST_CERT_NOT_FOUND
    http: 404
    condition: "cost_certification_id or the path cost certification id does not resolve"
  - id: ERR_CREDIT_ALLOCATION_NOT_FOUND
    http: 404
    condition: "credit_allocation_id or the path credit allocation id does not resolve"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "the path investor delivery id does not resolve"
  - id: ERR_COMPLIANCE_REPORT_NOT_FOUND
    http: 404
    condition: "the path compliance report id does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "the path physical inspection id does not resolve"

  # optimistic concurrency (§1.2.1)
  - id: ERR_STALE_CAP_POOL_VERSION
    http: 412
    condition: "expected_cap_pool_version on POST /volume-cap-allocations/{id}/decision does not equal CapPool.version"
  - id: ERR_STALE_BOND_ISSUE_VERSION
    http: 412
    condition: "expected_bond_issue_version on POST /draw-requests does not equal BondIssue.version"
  - id: ERR_STALE_CREDIT_ALLOCATION_VERSION
    http: 412
    condition: "expected_credit_allocation_version on POST /investor-deliveries does not equal CreditAllocation.version"

  # state
  - id: ERR_DEVELOPER_NOT_ACTIVE
    http: 409
    condition: "the owning sponsor is SUSPENDED or DEBARRED and the request advances the project, or a sanction action has no outgoing transition from the sponsor's current status (SUSPEND while SUSPENDED, or any action against the terminal DEBARRED status)"
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "a VolumeCapAllocation trigger has no outgoing transition from the allocation's current status"
  - id: ERR_ALLOCATION_EXPIRED
    http: 409
    condition: "the referenced award's expiry_date is at or before the logical clock"
  - id: ERR_BOND_ISSUE_STATE_INVALID
    http: 409
    condition: "a BondIssue trigger has no outgoing transition from the issue's current status"
  - id: ERR_DRAW_STATE_INVALID
    http: 409
    condition: "a DrawRequest trigger has no outgoing transition from the draw's current status"
  - id: ERR_UNIT_RESTRICTION_STATE_INVALID
    http: 409
    condition: "a unit is patched while RELEASED, or a unit trigger has no outgoing transition from its current status"
  - id: ERR_REG_AGREEMENT_STATE_INVALID
    http: 409
    condition: "a RegulatoryAgreement trigger has no outgoing transition from the agreement's current status"
  - id: ERR_REG_AGREEMENT_NOT_RECORDED
    http: 409
    condition: "bonds are issued before the project's land-use restriction agreement reaches RECORDED"
  - id: ERR_COST_CERT_STATE_INVALID
    http: 409
    condition: "a CostCertification trigger has no outgoing transition from its current status"
  - id: ERR_COST_CERT_NOT_ACCEPTED
    http: 409
    condition: "a credit allocation references a cost certification that is not ACCEPTED"
  - id: ERR_COST_CERT_PROJECT_MISMATCH
    http: 409
    condition: "the referenced cost certification belongs to a different project than the one named in the request"
  - id: ERR_PROJECT_NOT_PLACED_IN_SERVICE
    http: 409
    condition: "a credit allocation is requested while the project is still PLANNING, FINANCED or UNDER_CONSTRUCTION"
  - id: ERR_CREDIT_ALLOCATION_STATE_INVALID
    http: 409
    condition: "a CreditAllocation trigger has no outgoing transition from its current status"
  - id: ERR_DELIVERY_STATE_INVALID
    http: 409
    condition: "an InvestorDelivery trigger has no outgoing transition from its current status, e.g. accepting an already RESCINDED strip"
  - id: ERR_COMPLIANCE_REPORT_STATE_INVALID
    http: 409
    condition: "a compliance report is reviewed twice"
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "an inspection is completed while MISSED or already COMPLETED"

  # business - temporal
  - id: ERR_DRAW_PERIOD_OVERLAP
    http: 409
    condition: "the new draw's half-open [period_start, period_end) strictly overlaps a SUBMITTED, APPROVED or FUNDED draw of the same issue"
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "the new inspection's closed window, expanded by the fourteen-day buffer, intersects a SCHEDULED or COMPLETED window of the same project"
  - id: ERR_INSPECTION_OUTSIDE_COMPLIANCE_PERIOD
    http: 422
    condition: "the inspection window falls outside [compliance_start_date, extended_use_end_date]"
  - id: ERR_DUPLICATE_COMPLIANCE_REPORT
    http: 409
    condition: "a report already exists for this project and reporting year, or the year lies outside the compliance and extended-use span"

  # business - fiscal
  - id: ERR_INSUFFICIENT_VOLUME_CAP
    http: 422
    condition: "awarded_amount_cents exceeds the pool's awardable_cents"
  - id: ERR_PAR_EXCEEDS_CAP_AWARD
    http: 422
    condition: "the solved par_amount_cents exceeds the award, typically because the denomination step rounded par up past the ceiling"
  - id: ERR_DRAW_EXCEEDS_UNDRAWN
    http: 422
    condition: "a requested, approved or funded draw amount exceeds the issue's undrawn_cents"
  - id: ERR_NEGATIVE_ARBITRAGE_ALLOWANCE_EXCEEDED
    http: 422
    condition: "funding the draw would push the recomputed negative-arbitrage accrual past negative_arbitrage_allowance_cents"
  - id: ERR_FIFTY_PERCENT_TEST_FAILED
    http: 422
    condition: "the aggregate-basis financing ratio is below 5000 bps at issuance, or the final variant revoked the automatic credit before Form 8609 issuance"
  - id: ERR_INSUFFICIENT_OPERATING_HISTORY
    http: 422
    condition: "fewer recorded operating months than the requested DSCR window needs (3 for T3, 12 for T12)"
  - id: ERR_DSCR_BELOW_MINIMUM
    http: 422
    condition: "the selected DSCR variant yields fewer than 11500 basis points of coverage"
  - id: ERR_OCCUPANCY_BELOW_STABILIZATION
    http: 422
    condition: "the minimum monthly occupancy over the DSCR window is below 9000 basis points"
  - id: ERR_NO_UNDELIVERED_CREDIT
    http: 422
    condition: "the credit allocation has no undelivered credit left to deliver"

  # business - safety
  - id: ERR_SET_ASIDE_NOT_SATISFIED
    http: 422
    condition: "the project's elected set-aside is not met by its restricted units, either on the count ratio or on the average-income ceiling"
  - id: ERR_UNIT_COUNT_MISMATCH
    http: 422
    condition: "recording is attempted while designated_unit_count is less than total_units"

  # business - constraint
  - id: ERR_SET_ASIDE_MISMATCH
    http: 422
    condition: "the agreement's set_aside_election differs from the project's election"
  - id: ERR_EXTENDED_USE_TOO_SHORT
    http: 422
    condition: "compliance_period_years below 15, or extended_use_years less than compliance_period_years plus 15"
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "unit_number already exists on the project in any status"
  - id: ERR_UNIT_COUNT_EXCEEDS_TOTAL
    http: 422
    condition: "designating another unit would exceed Project.total_units"
  - id: ERR_AMI_PERCENT_NOT_ALLOWED
    http: 422
    condition: "ami_percent missing on a RESTRICTED unit, present on a non-restricted unit, outside the allowed band set, or above 60 without an AVG_INCOME election"
  - id: ERR_DUPLICATE_OPERATING_MONTH
    http: 409
    condition: "month_index already recorded, or not exactly one past the last recorded index"
  - id: ERR_ALLOCATION_ALREADY_EXISTS
    http: 409
    condition: "the project already holds a live volume cap allocation or a live credit allocation"
  - id: ERR_REPORT_COUNTS_INCOHERENT
    http: 422
    condition: "restricted_units_occupied exceeds total_units_occupied, occupancy exceeds total_units, or average_ami_percent is outside 1..80"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# role_model: segregation_of_duties. The allocation officer awards cap and
# reviews cost certifications; the compliance officer polices covenants,
# sanctions and inspections; the trustee moves bond money. No role can perform
# another role's exclusive operations, and the officer who awarded the cap or
# accepted the certification may not also issue Form 8609 for that project.
# ---------------------------------------------------------------------------
roles:
  - name: Developer
    description: "The bond-financed affordable-housing sponsor. Files developments, designates units, requests volume cap, sizes and draws on the bond issue, certifies costs, and delivers credit to its syndication investors. Every developer-scoped write is confined to projects whose developer_id equals X-User-ID."
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "POST /projects"
      - "POST /unit-restrictions"
      - "PATCH /unit-restrictions/{id}"
      - "POST /volume-cap-allocations"
      - "POST /volume-cap-allocations/{id}/return"
      - "POST /volume-cap-allocations/{id}/revise"
      - "POST /regulatory-agreements"
      - "POST /bond-issues"
      - "POST /bond-issues/{id}/operating-months"
      - "POST /draw-requests"
      - "POST /cost-certifications"
      - "POST /cost-certifications/{id}/submit"
      - "POST /investor-deliveries"
      - "POST /investor-deliveries/{id}/rescind"
      - "POST /compliance-reports"
    shared_operations:
      - "GET /developers/{id}"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /cap-pools/{id}"
      - "GET /volume-cap-allocations/{id}"
      - "GET /volume-cap-allocations"
      - "GET /bond-issues/{id}"
      - "GET /bond-issues"
      - "GET /draw-requests/{id}"
      - "GET /draw-requests"
      - "GET /unit-restrictions/{id}"
      - "GET /unit-restrictions"
      - "GET /regulatory-agreements/{id}"
      - "GET /regulatory-agreements"
      - "GET /cost-certifications/{id}"
      - "GET /cost-certifications"
      - "GET /credit-allocations/{id}"
      - "GET /credit-allocations"
      - "GET /investor-deliveries/{id}"
      - "GET /investor-deliveries"
      - "GET /compliance-reports/{id}"
      - "GET /compliance-reports"
      - "GET /physical-inspections/{id}"
      - "GET /physical-inspections"

  - name: Investor
    description: "The tax-credit investor or syndicator that accepts delivered credit strips. Confined to deliveries whose investor_id equals X-User-ID; cannot create or rescind a delivery."
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /investor-deliveries/{id}/accept"
    shared_operations:
      - "GET /investors/{id}"
      - "GET /credit-allocations/{id}"
      - "GET /credit-allocations"
      - "GET /investor-deliveries/{id}"
      - "GET /investor-deliveries"

  - name: HfaAllocationOfficer
    description: "Housing finance agency allocation staff. Opens program-year cap pools, registers sponsors and investors, awards or denies cap requests, reviews cost certifications, and computes and issues the final credit allocation. Subject to the segregation-of-duties rule at Form 8609 issuance."
    identity: opaque
    exclusive_operations:
      - "POST /developers"
      - "POST /investors"
      - "POST /cap-pools"
      - "POST /volume-cap-allocations/{id}/decision"
      - "POST /cost-certifications/{id}/review"
      - "POST /credit-allocations"
      - "POST /credit-allocations/{id}/issue"
    shared_operations:
      - "GET /developers/{id}"
      - "GET /investors/{id}"
      - "GET /cap-pools/{id}"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /volume-cap-allocations/{id}"
      - "GET /volume-cap-allocations"
      - "GET /bond-issues/{id}"
      - "GET /bond-issues"
      - "GET /draw-requests/{id}"
      - "GET /draw-requests"
      - "GET /unit-restrictions/{id}"
      - "GET /unit-restrictions"
      - "GET /regulatory-agreements/{id}"
      - "GET /regulatory-agreements"
      - "GET /cost-certifications/{id}"
      - "GET /cost-certifications"
      - "GET /credit-allocations/{id}"
      - "GET /credit-allocations"
      - "GET /investor-deliveries/{id}"
      - "GET /investor-deliveries"
      - "GET /compliance-reports/{id}"
      - "GET /compliance-reports"
      - "GET /physical-inspections/{id}"
      - "GET /physical-inspections"

  - name: HfaComplianceOfficer
    description: "Housing finance agency compliance staff. Records and amends land-use restriction agreements, sanctions sponsors, reviews annual owner certifications, and schedules and closes physical inspections. Cannot award cap, review cost certifications or move bond money."
    identity: opaque
    exclusive_operations:
      - "POST /developers/{id}/sanctions"
      - "POST /regulatory-agreements/{id}/record"
      - "POST /regulatory-agreements/{id}/amend"
      - "POST /compliance-reports/{id}/review"
      - "POST /physical-inspections"
      - "POST /physical-inspections/{id}/complete"
    shared_operations:
      - "GET /developers/{id}"
      - "GET /investors/{id}"
      - "GET /cap-pools/{id}"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /volume-cap-allocations/{id}"
      - "GET /volume-cap-allocations"
      - "GET /bond-issues/{id}"
      - "GET /bond-issues"
      - "GET /unit-restrictions/{id}"
      - "GET /unit-restrictions"
      - "GET /regulatory-agreements/{id}"
      - "GET /regulatory-agreements"
      - "GET /cost-certifications/{id}"
      - "GET /cost-certifications"
      - "GET /credit-allocations/{id}"
      - "GET /credit-allocations"
      - "GET /compliance-reports/{id}"
      - "GET /compliance-reports"
      - "GET /physical-inspections/{id}"
      - "GET /physical-inspections"

  - name: BondTrustee
    description: "The indenture trustee that closes the issue, approves and funds construction draws, converts to permanent financing and executes mandatory redemption. Touches bond money only: cannot designate units, award cap, record covenants or allocate credit."
    identity: opaque
    exclusive_operations:
      - "POST /bond-issues/{id}/issue"
      - "POST /bond-issues/{id}/convert"
      - "POST /bond-issues/{id}/mandatory-redeem"
      - "POST /draw-requests/{id}/decision"
      - "POST /draw-requests/{id}/fund"
      - "POST /draw-requests/{id}/void"
    shared_operations:
      - "GET /developers/{id}"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /bond-issues/{id}"
      - "GET /bond-issues"
      - "GET /draw-requests/{id}"
      - "GET /draw-requests"

  - name: SystemOperator
    description: "Test and operations harness identity. Owns the logical clock only; holds no business permission on any domain endpoint."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
