scaffold_corner_design:
- section: entities
  instances:
  - name: contract_create_returns_defaults_and_initial_state
    claim_type: Creation
    grounds:
    - entities.PerformanceContract
    - endpoints.POST_/performance-contracts
    distinguishing_aspect: A contract created with valid inputs returns 201 with status AUDIT, version 1, computed ledger fields zeroed, and server-stamped id/created_at/updated_at.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. Empty DB.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - &id002
        call: POST /esco-engineers
        payload:
          full_name: Erin ESCO
          license_number: PE-1042
        as: PlatformAdmin
        captures:
          eng_id: $.data.id
      - &id004
        call: POST /owner-reps
        payload:
          full_name: Owen Owner
          organization: City Schools
        as: PlatformAdmin
        captures:
          owner_id: $.data.id
      trigger:
      - &id003
        call: POST /performance-contracts
        payload:
          facility_name: Plainview High
          contract_term_years: 12
          guarantee_start_date: '2026-10-01T00:00:00Z'
          mv_protocol: IPMVP_C
          guaranteed_annual_savings_cents: 250000
          contract_value_cents: 2000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          c_id: $.data.id
      assert:
      - response status 201, response_type object
      - PerformanceContract.${c_id}.status == AUDIT
      - PerformanceContract.${c_id}.version == 1
      - guarantee_shortfall_reserve_cents == 0 and cumulative_verified_savings_cents == 0
      - meta.api_request_id and meta.api_request_timestamp present
  - name: contract_create_missing_required_field_rejected
    claim_type: Required Fields
    grounds:
    - entities.PerformanceContract.fields.mv_protocol
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: Omitting mv_protocol (an input enum with no default) fails with ERR_INVALID_REQUEST before any state change.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z.
      setup_api_calls:
      - *id001
      - *id002
      trigger:
      - call: POST /performance-contracts
        payload:
          facility_name: No Protocol
          contract_term_years: 12
          guarantee_start_date: '2026-10-01T00:00:00Z'
          guaranteed_annual_savings_cents: 250000
          contract_value_cents: 2000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          missing_err: $.data.error_id
      assert:
      - response status 400 with error_id ERR_INVALID_REQUEST
  - name: contract_create_invalid_mv_protocol_enum_rejected
    claim_type: Type Constraints
    grounds:
    - entities.PerformanceContract.fields.mv_protocol
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: mv_protocol outside {IPMVP_A, IPMVP_B, IPMVP_C, IPMVP_D} is rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z.
      setup_api_calls:
      - *id001
      - *id002
      trigger:
      - call: POST /performance-contracts
        payload:
          facility_name: Bad Enum
          contract_term_years: 12
          guarantee_start_date: '2026-10-01T00:00:00Z'
          mv_protocol: IPMVP_Z
          guaranteed_annual_savings_cents: 250000
          contract_value_cents: 2000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          enum_err: $.data.error_id
      assert:
      - response status 400 with error_id ERR_INVALID_REQUEST
  - name: measure_simple_payback_null_when_annual_savings_zero
    claim_type: Computed Fields
    grounds:
    - entities.Measure.fields.simple_payback_years
    - calculations.blended_payback
    distinguishing_aspect: A measure with annual_savings_cents == 0 gets simple_payback_years null (no division by zero) and contributes nothing to the subsidy pool.
    test_recipe:
      setup:
      - Contract in AUDIT with DRAFT bundle.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - &id005
        call: POST /performance-contracts/${c_id}/bundles
        payload:
          name: ZeroSaver
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          bd_id: $.data.id
      trigger:
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures
        payload:
          measure_type: OTHER
          installed_cost_cents: 100000
          annual_savings_cents: 0
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          zm_id: $.data.id
      assert:
      - Measure.${zm_id}.simple_payback_years is null
      - MeasureBundle.${bd_id}.subsidy_pool_cents == 0
  - name: financing_draw_immutable_no_update_endpoint
    claim_type: Immutability
    grounds:
    - entities.FinancingDraw
    distinguishing_aspect: FinancingDraw has common_fields false — responses carry id and created_at but no version/updated_at; only state-transition endpoints mutate it.
    test_recipe:
      setup:
      - Contract in CONSTRUCTION with FUNDING facility and one REQUESTED draw.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - &id006
        call: POST /performance-contracts/${c_id}/baselines
        payload:
          baseline_period_start: '2025-09-01T00:00:00Z'
          baseline_period_end: '2026-09-01T00:00:00Z'
          annual_energy_kwh: 100000
          rate_schedule:
          - up_to_kwh: null
            cents_per_kwh: 12
          heating_degree_days: 3000
          cooling_degree_days: 1200
          occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          b_id: $.data.id
      - &id007
        call: POST /performance-contracts/${c_id}/baselines/${b_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id008
        call: POST /performance-contracts/${c_id}/baselines/${b_id}/approve
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - *id005
      - &id009
        call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures
        payload:
          measure_type: LIGHTING
          installed_cost_cents: 600000
          annual_savings_cents: 300000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          m_id: $.data.id
      - &id010
        call: POST /performance-contracts/${c_id}/bundles/${bd_id}/propose
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id011
        call: POST /performance-contracts/${c_id}/bundles/${bd_id}/approve
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - &id012
        call: POST /performance-contracts/${c_id}/financing-facilities
        payload:
          facility_type: LEASE
          principal_cents: 1000000
          annual_rate_pct: 5.0
          term_years: 10
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          f_id: $.data.id
      - &id013
        call: POST /performance-contracts/${c_id}/complete-audit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id014
        call: POST /performance-contracts/${c_id}/financing-facilities/${f_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id015
        call: POST /performance-contracts/${c_id}/financing-facilities/${f_id}/approve
        payload: {}
        as: LenderOfficer
      - &id016
        call: POST /performance-contracts/${c_id}/execute
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - &id017
        call: POST /performance-contracts/${c_id}/phases
        payload:
          phase_label: P1
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2026-09-20T00:00:00Z'
          disruption_budget_hours: 40
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ph_id: $.data.id
      - &id018
        call: POST /performance-contracts/${c_id}/phases/${ph_id}/mobilize
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id019
        call: POST /performance-contracts/${c_id}/mobilize
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      trigger:
      - call: POST /performance-contracts/${c_id}/financing-facilities/${f_id}/draws
        payload:
          amount_cents: 100000
          purpose: deposit
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          dr_id: $.data.id
      assert:
      - FinancingDraw.${dr_id}.status == REQUESTED
      - the draw response carries id and created_at but no version field (common_fields false)
  - name: reports_list_filtered_by_contract_paginates
    claim_type: Listing
    grounds:
    - endpoints.GET_/performance-contracts/{contractId}/reports
    - response_envelope.pagination_defaults
    distinguishing_aspect: 'Two reports on one contract: default page returns both with total_count 2, has_more false, limit defaulting to 10.'
    test_recipe:
      setup:
      - Contract in PERFORMANCE with two DRAFT reports (period_year 1 and 2).
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      - *id005
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - &id020
        call: POST /performance-contracts/${c_id}/phases/${ph_id}/start
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id021
        call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures/${m_id}/install
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - &id022
        call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures/${m_id}/verify
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - &id023
        call: POST /performance-contracts/${c_id}/phases/${ph_id}/complete
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - &id024
        call: POST /performance-contracts/${c_id}/commence-performance
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      - call: POST /performance-contracts/${c_id}/reports
        payload:
          period_year: 1
          actual_energy_kwh: 80000
          period_hdd: 3000
          period_cdd: 1200
          period_occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - call: POST /performance-contracts/${c_id}/reports
        payload:
          period_year: 2
          actual_energy_kwh: 81000
          period_hdd: 3100
          period_cdd: 1100
          period_occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
      trigger:
      - call: GET /performance-contracts/${c_id}/reports
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      assert:
      - response status 200, response_type array
      - total_count == 2 and has_more == false
  - name: nested_get_with_wrong_parent_returns_not_found
    claim_type: Not Found
    grounds:
    - validations.priority_3_existence
    - errors.ERR_BUNDLE_NOT_FOUND
    distinguishing_aspect: GET a bundle id under a different contract's path returns 404 ERR_BUNDLE_NOT_FOUND (existence validated under the path's parent), not 200.
    test_recipe:
      setup:
      - Two contracts; bundle belongs to the first.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - *id005
      - call: POST /performance-contracts
        payload:
          facility_name: Second School
          contract_term_years: 10
          guarantee_start_date: '2026-10-01T00:00:00Z'
          mv_protocol: IPMVP_C
          guaranteed_annual_savings_cents: 100000
          contract_value_cents: 1000000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          c2_id: $.data.id
      trigger:
      - call: GET /performance-contracts/${c2_id}/bundles/${bd_id}
        payload: {}
        as: OwnerRep
        captures:
          nest_err: $.data.error_id
      assert:
      - response status 404 with error_id ERR_BUNDLE_NOT_FOUND
- section: state_machines
  instances:
  - name: baseline_submit_from_approved_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Baseline.DRAFT_to_SUBMITTED
    - errors.ERR_BASELINE_NOT_DRAFT
    distinguishing_aspect: Re-submitting an APPROVED baseline fails ERR_BASELINE_NOT_DRAFT; no recompute of adjusted cost.
    test_recipe:
      setup:
      - Contract in AUDIT with baseline APPROVED.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      trigger:
      - call: POST /performance-contracts/${c_id}/baselines/${b_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          resub_err: $.data.error_id
      assert:
      - response status 409, error_id ERR_BASELINE_NOT_DRAFT
      - Baseline.${b_id}.status remains APPROVED and adjusted_annual_cost_cents == 1200000
  - name: terminal_contract_rejects_every_further_transition
    claim_type: Terminal State Lockdown
    grounds:
    - state_machines.PerformanceContract
    - errors.ERR_CONTRACT_NOT_TERMINABLE
    distinguishing_aspect: A TERMINATED contract rejects terminate again (ERR_CONTRACT_NOT_TERMINABLE), close, execute, and mobilize — terminal lockdown.
    test_recipe:
      setup:
      - Contract terminated from SCOPED.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      - *id005
      - *id009
      - *id010
      - *id013
      - call: POST /performance-contracts/${c_id}/terminate
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      trigger:
      - call: POST /performance-contracts/${c_id}/terminate
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
        captures:
          term2_err: $.data.error_id
      - call: POST /performance-contracts/${c_id}/close
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
        captures:
          close_err: $.data.error_id
      assert:
      - 'second terminate: 409 ERR_CONTRACT_NOT_TERMINABLE'
      - 'close on TERMINATED: 409 (ERR_CONTRACT_NOT_IN_PERFORMANCE family)'
      - PerformanceContract.${c_id}.status remains TERMINATED
  - name: reconcile_duplicate_period_year_rejected
    claim_type: Precondition Enforcement
    grounds:
    - validations[priority=19]
    - errors.ERR_DUPLICATE_REPORT_PERIOD
    distinguishing_aspect: Creating a second report for period_year 1 on the same contract is rejected ERR_DUPLICATE_REPORT_PERIOD (409).
    test_recipe:
      setup:
      - Contract in PERFORMANCE with a DRAFT report for period_year 1.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      - *id005
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - *id021
      - *id022
      - *id023
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - *id024
      - call: POST /performance-contracts/${c_id}/reports
        payload:
          period_year: 1
          actual_energy_kwh: 80000
          period_hdd: 3000
          period_cdd: 1200
          period_occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
      trigger:
      - call: POST /performance-contracts/${c_id}/reports
        payload:
          period_year: 1
          actual_energy_kwh: 79000
          period_hdd: 3000
          period_cdd: 1200
          period_occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          dup_err: $.data.error_id
      assert:
      - response status 409, error_id ERR_DUPLICATE_REPORT_PERIOD
  - name: measure_verify_from_included_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Measure.INSTALLED_to_VERIFIED
    - errors.ERR_MEASURE_NOT_INSTALLED
    distinguishing_aspect: Verify on an INCLUDED (not yet INSTALLED) measure fails ERR_MEASURE_NOT_INSTALLED.
    test_recipe:
      setup:
      - Contract in CONSTRUCTION with INCLUDED measure.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      - *id005
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      trigger:
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures/${m_id}/verify
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
        captures:
          verr: $.data.error_id
      assert:
      - response status 409, error_id ERR_MEASURE_NOT_INSTALLED
      - Measure.${m_id}.status remains INCLUDED
  - name: bundle_auto_completes_when_last_measure_verified
    claim_type: Side Effect Execution
    grounds:
    - state_machines.Measure.INSTALLED_to_VERIFIED
    - state_machines.MeasureBundle.ACTIVE_to_COMPLETE
    distinguishing_aspect: Verifying the final non-EXCLUDED measure of an ACTIVE bundle flips the bundle to COMPLETE automatically (bubble-up side effect).
    test_recipe:
      setup:
      - Contract in CONSTRUCTION; ACTIVE bundle with two measures, first already VERIFIED, second INSTALLED.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      - *id005
      - *id009
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures
        payload:
          measure_type: WATER
          installed_cost_cents: 100000
          annual_savings_cents: 50000
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          m2_id: $.data.id
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - *id021
      - *id022
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures/${m2_id}/install
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      trigger:
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures/${m2_id}/verify
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      assert:
      - Measure.${m2_id}.status == VERIFIED
      - MeasureBundle.${bd_id}.status == COMPLETE (auto-transition on last verify)
  - name: dispute_withdrawn_by_non_filer_side_rejected
    claim_type: Precondition Enforcement
    grounds:
    - state_machines.DisputeNotice.OPEN_to_WITHDRAWN
    - errors.ERR_INSUFFICIENT_PERMISSIONS
    distinguishing_aspect: An OWNER-filed dispute cannot be withdrawn by an ESCOEngineer — filer-side enforcement returns ERR_INSUFFICIENT_PERMISSIONS.
    test_recipe:
      setup:
      - Contract in PERFORMANCE; report SUBMITTED; OWNER filed a dispute (report DISPUTED).
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id006
      - *id007
      - *id008
      - *id005
      - *id009
      - *id010
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - *id021
      - *id022
      - *id023
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
      - *id024
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2027-09-30T12:00:00Z'
        as: PlatformAdmin
      - call: POST /performance-contracts/${c_id}/reports
        payload:
          period_year: 1
          actual_energy_kwh: 80000
          period_hdd: 3000
          period_cdd: 1200
          period_occupancy_factor: 0.5
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          r_id: $.data.id
      - call: POST /performance-contracts/${c_id}/reports/${r_id}/submit
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - call: POST /performance-contracts/${c_id}/reports/${r_id}/disputes
        payload:
          report_id: ${r_id}
          claimed_savings_cents: 200000
        as: OwnerRep
        as_user_id: ${owner_id}
        captures:
          disp_id: $.data.id
      trigger:
      - call: POST /performance-contracts/${c_id}/disputes/${disp_id}/withdraw
        payload: {}
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          wd_err: $.data.error_id
      - call: POST /performance-contracts/${c_id}/disputes/${disp_id}/withdraw
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
      assert:
      - 'ESCO withdraw of an OWNER-filed dispute: 403 ERR_INSUFFICIENT_PERMISSIONS'
      - DisputeNotice.${disp_id}.status remains OPEN
      - OwnerRep withdraw (filer side) succeeds afterward and DisputeNotice.${disp_id}.status == WITHDRAWN with report ${r_id} back to SUBMITTED
- section: calculations
  instances:
  - name: blended_payback_null_when_bundle_savings_sum_zero
    claim_type: Correct Result
    grounds:
    - calculations.blended_payback
    distinguishing_aspect: A bundle whose only measure has annual_savings_cents 0 yields blended_payback_years null — and bundle approval is then blocked because null cannot satisfy <= contract_term_years.
    test_recipe:
      setup:
      - Contract in AUDIT; bundle with one zero-savings measure, PROPOSED.
      setup_api_calls:
      - *id001
      - *id002
      - *id004
      - *id003
      - *id005
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/measures
        payload:
          measure_type: OTHER
          installed_cost_cents: 100000
          annual_savings_cents: 0
        as: ESCOEngineer
        as_user_id: ${eng_id}
      - *id010
      trigger:
      - call: POST /performance-contracts/${c_id}/bundles/${bd_id}/approve
        payload: {}
        as: OwnerRep
        as_user_id: ${owner_id}
        captures:
