scaffold_corner_design:
  - section: entities
    instances:
      - name: program_offering_create_persists_every_declared_field
        claim_type: Creation
        grounds:
          - entities.ProgramOffering
          - endpoints.POST /nature-center/program-offerings
          - entities.ProgramOffering.fields.rain_alternate_for_offering_id
        distinguishing_aspect: |
          The create call supplies every optional flag and the self-referential
          rain_alternate_for_offering_id at once, so the claim is that the server stores the full
          declared surface of the entity — including the self FK to another ProgramOffering —
          rather than only the required subset, and that it stamps the authoring identity from the
          X-User-ID header instead of from the body.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "One DRAFT ProgramOffering already exists to serve as the rain-plan target"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Meadow Pollinators", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Pond Ecology Field Study", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: true, requires_trail_segment: true, public_contact_required: true, rain_alternate_for_offering_id: "${base_id}" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { new_id: $.data.id, st: $.data.status, author: $.data.authored_by_user_id, cnt: $.data.standard_alignment_count, ready: $.data.materials_ready, rr: $.data.revision_round, ver: $.data.version }
          assert:
            - "${st} == DRAFT"
            - "${author} == cs-01"
            - "${cnt} == 0"
            - "${ready} == false"
            - "${rr} == 0"
            - "${ver} == 1"
            - "ProgramOffering.${new_id}.requires_live_animal == true"
            - "ProgramOffering.${new_id}.requires_trail_segment == true"
            - "ProgramOffering.${new_id}.public_contact_required == true"
            - "ProgramOffering.${new_id}.rain_alternate_for_offering_id == ${base_id}"
            - "ProgramOffering.${new_id}.duration_minutes == 120"
            - "ProgramOffering.${new_id}.base_fee_cents_per_student == 1233"
            - "ProgramOffering.${new_id}.published_at == null"
      - name: published_offering_read_back_carries_its_derived_catalog_counters
        claim_type: Retrieval
        grounds:
          - endpoints.GET /nature-center/program-offerings/{id}
          - entities.ProgramOffering.fields.standard_alignment_count
          - entities.ProgramOffering.fields.materials_ready
          - entities.ProgramOffering.fields.published_at
        distinguishing_aspect: |
          Retrieval is asserted after the publish walk rather than straight after create, so the
          claim is that the GET reflects counters maintained by child writes (two alignments, two
          published materials) and the publish timestamp taken from the logical clock — none of
          which were ever sent in a request body.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "ProgramOffering PUBLISHED with two StandardAlignment rows and both materials PUBLISHED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Pond Ecology Field Study", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_id: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-3", dimension: "DISCIPLINARY_CORE_IDEA" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-4", dimension: "SCIENCE_PRACTICE" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "PRE_VISIT", url_slug: "off-pre" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_pre: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "POST_VISIT", url_slug: "off-post" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_post: $.data.id }
            - call: "POST /nature-center/curriculum-materials/${off_pre}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/curriculum-materials/${off_post}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/submit-for-review"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
          trigger:
            - call: "GET /nature-center/program-offerings/${off_id}"
              payload: {}
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { st: $.data.status, cnt: $.data.standard_alignment_count, ready: $.data.materials_ready, pub: $.data.published_at, rev: $.data.reviewed_by_user_id }
          assert:
            - "${st} == PUBLISHED"
            - "${cnt} == 2"
            - "${ready} == true"
            - "${pub} == 2026-09-28T07:00:00.000Z"
            - "${rev} == ed-01"
            - "ProgramOffering.${off_id}.authored_by_user_id == cs-01"
      - name: offering_listing_filters_by_status_and_grade_band_then_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET /nature-center/program-offerings
          - validations.priority_4
        distinguishing_aspect: |
          Three offerings differing only in status exercise filter composition and paging in the
          same instance: the unfiltered-by-status query must not leak the DRAFT row, and a
          limit/offset window over the two PUBLISHED rows must return disjoint single-row pages,
          which pins listing order and offset semantics rather than mere filtering.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "Two PUBLISHED G3_5 offerings and one DRAFT G3_5 offering exist"
