      - name: offer_create_against_a_stale_or_superseded_assessment_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSESSMENT_STALE]
          - errors[ERR_ASSESSMENT_INVALID_STATE]
          - validations[priority=16]
          - state_machines.PortabilityAssessment.CURRENT_to_STALE
          - state_machines.PortabilityAssessment.STALE_to_SUPERSEDED
        distinguishing_aspect: |
          STALE and SUPERSEDED are different diagnoses of the same unusable pointer and must
          not collapse: STALE means the book moved underneath the valuation (a new entry was
          added during the revision round), while SUPERSEDED means a newer valuation exists.
          The SAME assessment id is used for both probes, one before and one after the second
          assessment is minted, so the only variable is the row's own status. The closing
          offer against the fresh assessment snapshots the AB-book adjusted total 1360945.33,
          proving the endpoint accepts a CURRENT pointer.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup and one ACTIVE SearchFirmEngagement."
            - "One Candidate in DILIGENCE with candidate version captured as cand_v1."
            - "Assessment 1 was taken on the SLIM BOOK and then went STALE when entry B 'Calder Manufacturing' was added during revision round 1."
            - "The LateralQuestionnaire is UNDER_REVIEW again with both entries ACTIVE and its version captured as lpq_v2."
