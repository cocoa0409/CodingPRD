      - name: restricted_utilisation_threshold_exact_equality_keeps_posture_open
        grounds:
          - calculations.project_readiness_posture
          - state_machines.AttractionProject.readiness_posture.OPEN_to_RESTRICTED
          - endpoints[POST /budget-ledger-entries]
        distinguishing_aspect: |
          Metric = budget utilisation in cents on POST /budget-ledger-entries. committed_cost_cents of exactly
          3240000000 equals floor(3600000000 * 90 / 100) and leaves readiness_posture OPEN because the comparison is
          strict >; one further cent (3240000001) flips it to RESTRICTED.
