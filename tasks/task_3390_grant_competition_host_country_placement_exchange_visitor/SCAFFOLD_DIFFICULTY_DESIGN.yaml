# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3390_grant_competition_host_country_placement_exchange_visitor
#
# Depth probe: 2+ instances per Difficulty Rule (§0.5), every instance grounded
# in SCAFFOLD.yaml §1.1-§1.7 with a verbatim-executable test_recipe.
# Shared base-chain calls are anchored at first use and aliased later; every
# alias re-runs the call inside the referencing instance's own chain, so each
# instance's placeholder bindings are self-contained.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: grant_award_provisional_vs_final_divergence
        grounds:
          - calculations.grant_award_terms
          - calculations.dependent_allowance_cap
          - entities.Grant.fields.provisional_total_cents
          - entities.Grant.fields.final_total_cents
        distinguishing_aspect: "Grant-domain dual variant: the provisional award (STANDARD band, proposed duration, UNCAPPED dependent allowance) and the final award (awarded HIGH band, confirmed duration, capped dependent allowance) produce different totals for identical application data — 4350000 vs 4937500 cents."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. Cycle 2027-2028 with DE program (quota 1, stipend standard 300000 / high 360000, dependent 50000, travel 150000, health 20000, duration 6-12 months, language NONE), cycle OPEN."
            - "Independent applicant with an application (duration 10 months, 3 dependents), nationally scored 80/80/80 by two reviewers, recommended, selected, placed at a HIGH-band institution, confirmed 2027-09-01 to 2028-07-01."
          setup_api_calls:
            - &d_cycle
              call: "POST /exchange/cycles"
              payload: { academic_year: "2027-2028", application_deadline: "2026-10-15T23:59:59Z" }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - &d_prog_de_q1
              call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "DE", slot_quota: 1, min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - &d_open
              call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /exchange/applicants"
              payload: { full_name: "Ada Byrne", email: "ada.byrne@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "River Basin Hydrology", project_summary: "Comparative watershed study", proposed_duration_months: 10, dependents_count: 3 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - &d_score80a
              call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 80, language_score: 80 }
              as: NationalReviewer
              as_user_id: "nr-1"
            - &d_score80b
              call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 80, language_score: 80 }
              as: NationalReviewer
              as_user_id: "nr-2"
            - &d_close
              call: "POST /exchange/cycles/${cyc}/transition"
              payload: { action: "CLOSE" }
              as: PlatformAdmin
            - &d_recommend
              call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "RECOMMEND" }
              as: NationalReviewer
              as_user_id: "nr-1"
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id, prov_total: $.data.0.provisional_total_cents, prov_monthly: $.data.0.provisional_monthly_stipend_cents }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Heidelberg Institute", institution_band: "HIGH", response_deadline: "2027-03-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
          trigger:
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { fin_total: $.data.final_total_cents, fin_monthly: $.data.final_monthly_stipend_cents }
          assert:
            - "Grant.${gr}.provisional_monthly_stipend_cents == 300000 (always STANDARD band at selection)"
            - "Grant.${gr}.provisional_total_cents == 4350000 ((300000 + 50000*min(3,2) + 20000)*10 + 150000, dependent allowance NOT capped)"
            - "Grant.${gr}.awarded_band == HIGH and Grant.${gr}.duration_months == 10"
            - "Grant.${gr}.final_monthly_stipend_cents == 360000 (HIGH band branch)"
            - "Grant.${gr}.final_total_cents == 4937500 (base (360000+20000)*10+150000 = 3950000; dep_raw 1000000 capped at round_half_up(0.25*3950000) = 987500)"
            - "Grant.${gr}.provisional_total_cents != Grant.${gr}.final_total_cents on identical application data"
            - "Application.${app}.status == AWARDED"

      - name: alumni_engagement_provisional_vs_certified
        grounds:
          - calculations.alumni_engagement_index
          - entities.AlumniProfile.fields.engagement_index_provisional
          - entities.AlumniProfile.fields.engagement_index_certified
        distinguishing_aspect: "AlumniProfile-domain dual variant (different entity domain from grant award terms): the provisional engagement index counts SUBMITTED reports while the certified index counts only ACCEPTED reports, so a grantee whose FINAL report awaits review shows 60 vs 50 for identical data."
        test_recipe:
          setup:
            - "Logical clock default 2026-09-01T00:00:00Z at start. DE program (as in base config), independent applicant, application (10 months, 1 dependent) carried through selection, STANDARD-band placement, confirmation 2027-09-01 to 2028-07-01, visa with home-residency subject=true, activation on 2027-09-01."
            - "At clock 2028-07-01 the FINAL report is submitted (on time; due 2028-07-31) and the grant is COMPLETED; the report remains SUBMITTED (never reviewed)."
          setup_api_calls:
            - *d_cycle
            - *d_prog_de_q1
            - *d_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Ben Okri", email: "ben.okri@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "NG" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Oral Literature Archive", project_summary: "Digitisation of oral histories", proposed_duration_months: 10, dependents_count: 1 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - *d_score80a
            - *d_score80b
            - *d_close
            - *d_recommend
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Heidelberg Institute", institution_band: "STANDARD", response_deadline: "2027-03-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
            - &d_clock_orient
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: PlatformAdmin
            - &d_visa_true
              call: "POST /exchange/grants/${gr}/visa-sponsorships"
              payload: { subject_to_home_residency: true, orientation_completed_at: "2027-06-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { visa: $.data.id }
            - &d_clock_start
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_activate
              call: "POST /exchange/grants/${gr}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramOfficer
              as_user_id: "po-1"
            - &d_clock_end
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_finalontime
              call: "POST /exchange/grants/${gr}/reports"
              payload: { report_type: "FINAL", content: "Final results and evaluation" }
              as: Applicant
              as_user_id: "${apl}"
            - &d_complete
              call: "POST /exchange/grants/${gr}/transition"
              payload: { action: "COMPLETE" }
              as: ProgramOfficer
              as_user_id: "po-1"
          trigger:
            - call: "GET /exchange/applicants/${apl}/alumni-profiles"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { prof: $.data.0.id }
          assert:
            - "AlumniProfile.${prof}.engagement_index_provisional == 60 (50 base + 10 for the SUBMITTED final report)"
            - "AlumniProfile.${prof}.engagement_index_certified == 50 (no ACCEPTED reports yet)"
            - "AlumniProfile.${prof}.engagement_index_provisional != AlumniProfile.${prof}.engagement_index_certified for identical underlying data"
            - "AlumniProfile.${prof}.residency_status == ACCRUING (mirrors the ledger live)"
            - "AlumniProfile.${prof}.follow_on_eligible == INELIGIBLE while residency is still ACCRUING"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: grant_terms_band_min_duration_combinatorics
        grounds:
          - calculations.grant_award_terms
          - entities.Grant.fields.awarded_band
          - entities.Grant.fields.duration_months
        distinguishing_aspect: "Mode (a) combinatorial: the final award combines a conditional band branch (STANDARD vs HIGH stipend), a nested min() on dependents, and whole-calendar-month duration math — with a STANDARD band, 1 dependent and a 10-month window every branch resolves to its non-extreme arm and provisional == final == 3850000."
        test_recipe:
          setup:
            - "DE program (quota 1). Independent applicant; application duration 10, dependents 1 (min(1,2)=1 — no truncation). STANDARD-band placement. Confirmed 2027-09-01 to 2028-07-01 (duration_months = (2028-2027)*12 + (7-9) = 10)."
          setup_api_calls:
            - *d_cycle
            - *d_prog_de_q1
            - *d_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Cora Diaz", email: "cora.diaz@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "MX" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Volcanic Soils", project_summary: "Soil fertility study", proposed_duration_months: 10, dependents_count: 1 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - *d_score80a
            - *d_score80b
            - *d_close
            - *d_recommend
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Leipzig Geophysical", institution_band: "STANDARD", response_deadline: "2027-03-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
          trigger:
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
          assert:
            - "Grant.${gr}.awarded_band == STANDARD so final_monthly_stipend_cents == 300000 (conditional branch, standard arm)"
            - "Grant.${gr}.duration_months == 10 from whole-calendar-month math ((2028-2027)*12 + (7-9))"
            - "dependent component = 50000 * min(1, 2) * 10 = 500000, under the cap round_half_up(0.25*3350000) = 837500 so uncapped"
            - "Grant.${gr}.final_total_cents == 3850000 ((300000+20000)*10 + 150000 + 500000)"
            - "Grant.${gr}.provisional_total_cents == 3850000 ((300000 + 50000*1 + 20000)*10 + 150000) — the branches coincide on this data"

      - name: dependent_cap_evaluation_order_pinned
        grounds:
          - calculations.dependent_allowance_cap
          - calculations.grant_award_terms
        distinguishing_aspect: "Mode (c) circular-looking dependency: the dependent cap is keyed on base_total which EXCLUDES the dependent allowance; the pinned order (base_total -> dep_cap -> dep_final -> final_total) yields 4987500, while capping against a total that includes the allowance would wrongly yield 6187500."
        test_recipe:
          setup:
            - "Cycle with IN program: quota 2, stipend standard 300000 / high 350000, dependent allowance 200000/month, travel 150000, health 20000, duration 3-12, language NONE. Cycle OPEN."
            - "Independent applicant; application duration 12, dependents 2; STANDARD-band placement accepted; confirmed 2027-09-01 to 2028-09-01 (duration 12)."
          setup_api_calls:
            - *d_cycle
            - call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "IN", slot_quota: 2, min_duration_months: 3, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 350000, dependent_allowance_monthly_cents: 200000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - *d_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Dev Iyer", email: "dev.iyer@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "IN" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Monsoon Modeling", project_summary: "Regional rainfall models", proposed_duration_months: 12, dependents_count: 2 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - *d_score80a
            - *d_score80b
            - *d_close
            - *d_recommend
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "IIT Mumbai", institution_band: "STANDARD", response_deadline: "2027-03-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
          trigger:
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2028-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
          assert:
            - "base_total == 3990000 ((300000+20000)*12 + 150000)"
            - "dep_raw == 4800000 (200000 * min(2,2) * 12) but dep_cap == 997500 (round_half_up(0.25 * 3990000)) so dep_final == 997500"
            - "Grant.${gr}.final_total_cents == 4987500 (3990000 + 997500)"
            - "the cap was computed against base_total EXCLUDING the dependent allowance: capping against 3990000+4800000 would give 2197500 and total 6187500, which is NOT what is returned"

      - name: termination_reconciliation_rounding_order
        grounds:
          - calculations.early_termination_reconciliation
          - entities.Grant.fields.repayment_cents
          - entities.Grant.fields.reconciliation_adjustment_cents
        distinguishing_aspect: "Mode (b) nested rounding: the scaffold pins round-per-month-then-multiply — monthly_rate round_half_up(1060001/3) = 353334 computed FIRST, then multiplied — producing repayment 706668 and a nonzero adjustment of -1 cent, which sum-then-round would not produce."
        test_recipe:
          setup:
            - "Cycle with JP program: quota 1, stipend standard 300001 / high 350000, dependent 50000, travel 100001, health 19999, duration 3-12, language NONE. Cycle OPEN."
            - "Independent applicant; application duration 3, dependents 0; STANDARD-band placement; confirmed 2027-09-01 to 2027-12-01 (final_total_cents = (300001+19999)*3 + 100001 = 1060001); visa issued; grant ACTIVATEd at clock 2027-09-01."
          setup_api_calls:
            - *d_cycle
            - call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "JP", slot_quota: 1, min_duration_months: 3, max_duration_months: 12, monthly_stipend_standard_cents: 300001, monthly_stipend_high_cents: 350000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 100001, health_benefit_monthly_cents: 19999, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - *d_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Emi Sato", email: "emi.sato@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "JP" }
              as: Anonymous
              captures: { apl: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Tidal Ceramics", project_summary: "Coastal kiln study", proposed_duration_months: 3, dependents_count: 0 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app: $.data.id }
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
            - *d_score80a
            - *d_score80b
            - *d_close
            - *d_recommend
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "SELECT" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { app_v_sel: $.data.version }
            - call: "GET /exchange/applications/${app}/grants"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { gr: $.data.0.id }
            - call: "POST /exchange/applications/${app}/placement-rounds"
              payload: { institution_name: "Kyoto Arts", institution_band: "STANDARD", response_deadline: "2027-03-01T00:00:00Z", expected_application_version: "${app_v_sel}" }
              as: HostCommission
              as_user_id: "hc-1"
              captures: { rnd: $.data.id }
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${apl}"
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2027-12-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
            - *d_clock_orient
            - *d_visa_true
            - *d_clock_start
            - *d_activate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/grants/${gr}/transition"
              payload: { action: "TERMINATE", termination_reason: "Family emergency" }
              as: ProgramOfficer
              as_user_id: "po-1"
          assert:
            - "served_months == 1 (floor(40 days / 30)) and unserved_months == 2"
            - "monthly_rate == 353334 (round_half_up(1060001 / 3) = round_half_up(353333.67)) — rounded per month BEFORE multiplying"
            - "Grant.${gr}.earned_cents == 353334 (1 * 353334)"
            - "Grant.${gr}.repayment_cents == 706668 (2 * 353334)"
            - "Grant.${gr}.reconciliation_adjustment_cents == -1 (1060001 - 353334 - 706668); sum-then-round would yield repayment 706667 and is wrong"
            - "Grant.${gr}.status == TERMINATED_EARLY"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_enrolled_vs_independent_fork_join
        grounds:
          - state_machines.Application.DRAFT_to_CAMPUS_REVIEW
          - state_machines.Application.DRAFT_to_NATIONAL_SCREENING
          - state_machines.Application.CAMPUS_REVIEW_to_NATIONAL_SCREENING
        distinguishing_aspect: "Application carries a branching fork-join: an ENROLLED_STUDENT forks DRAFT -> CAMPUS_REVIEW -> NATIONAL_SCREENING while an INDEPENDENT applicant forks DRAFT -> NATIONAL_SCREENING directly, and both branches join at HOST_REVIEW."
        test_recipe:
          setup:
            - "DE program (quota 2 variant). Enrolled applicant Eli (with home_institution_name) and independent applicant Ingrid each hold a submitted application to the same program."
          setup_api_calls:
            - *d_cycle
            - call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "DE", slot_quota: 2, min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "NONE" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
