# =============================================================================
# Scaffold Difficulty Design (Test Targeting Index) — §1.8
# Corporate Card & Spend Management
# Nine §0.5 Difficulty Rules, >= 2 instances each (>= 18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_statement_balance_accrual_vs_cash
        grounds:
          - calculations.statement_balance
          - entities.Statement.fields.closing_balance_cents
          - entities.Company.fields.billing_model
          - state_machines.Statement.OPEN_to_CLOSED
        distinguishing_aspect: |
          Same transaction set (one SETTLED at 5000, one CLEARED-not-SETTLED at 3000) yields
          closing_balance_cents=8000 under the CHARGE/accrual variant but 5000 under the
          CREDIT/cash variant — divergence lives on the Statement entity domain.
        test_recipe:
          setup:
            - "CHARGE company, credit_limit 1,000,000; clock set to 2026-06-30."
            - "One VIRTUAL card; tx A settled at 5000; tx B cleared but not settled at 3000."
            - "Statement (cycle 1) is OPEN and about to be closed."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Charge", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "holder@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M-A", mcc_code: "5999", amount_cents: 5000 }
              as: FinanceAdmin
              captures: { txA: "$.data.id" }
            - call: "POST /transactions/${txA}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${txA}/settle"
              payload: { settled_amount_cents: 5000 }
              as: FinanceAdmin
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M-B", mcc_code: "5999", amount_cents: 3000 }
              as: FinanceAdmin
              captures: { txB: "$.data.id" }
            - call: "POST /transactions/${txB}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { company_id: "${co}", to_iso8601: "2026-06-30T00:00:00Z" }
              as: FinanceAdmin
          trigger:
            - call: "POST /statements/${stmt1}/close"
              payload: {}
              as: FinanceAdmin
              captures: { bal: "$.data.closing_balance_cents" }
          assert:
            - "Statement.${stmt1}.closing_balance_cents == 8000"
            - "Statement.${stmt1}.status == CLOSED"

      - name: dvc_reward_accrual_net_vs_gross
        grounds:
          - calculations.reward_accrual
          - entities.Transaction.fields.reward_points_cents
          - entities.Transaction.fields.settled_amount_cents
          - entities.RewardAccount.fields.accrued_points_cents
          - state_machines.Transaction.auth_status=CLEARED_to_auth_status=SETTLED
        distinguishing_aspect: |
          Reward accrues on settled_amount_cents (net variant), not amount_cents (gross): a tx
          authorized at 10000 but partially captured at 6000 at 1.0% earns reward_points_cents=60,
          not the 100 the gross basis would give — divergence on the Transaction/RewardAccount domain.
        test_recipe:
          setup:
            - "CHARGE company; one card; tx authorized 10000, cleared, settled at 6000; default 100 bps."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Net", credit_limit_cents: 1000000, billing_model: "CHARGE", reward_rate_default_bps: 100 }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /reward-accounts"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { ra: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h2@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 10000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 6000 }
              as: FinanceAdmin
              captures: { rp: "$.data.reward_points_cents" }
          assert:
            - "Transaction.${tx}.reward_points_cents == 60"
            - "RewardAccount.${ra}.accrued_points_cents == 60"
            - "RewardAccount.${ra}.balance_points_cents == 60"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_reward_accrual_tiered_rate_with_nested_cap
        grounds:
          - calculations.reward_accrual
          - entities.SpendPolicy.fields.mcc_reward_overrides
          - entities.Company.fields.reward_rate_default_bps
          - entities.Transaction.fields.reward_points_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (settled_amount, MCC-override rate, company-default rate) with a nested
          min() cap. A 5812 override at 500 bps on a 100000 settle yields raw 5000 = exactly the
          MAX_REWARD_PER_TXN_CENTS cap, while a 5999 default at 100 bps yields 1000 (uncapped).
        test_recipe:
          setup:
            - "CHARGE company default 100 bps; policy overrides mcc 5812 to 500 bps."
            - "Card with that policy; one tx mcc 5812 settled 100000; one tx mcc 5999 settled 100000."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Tier", credit_limit_cents: 2000000, billing_model: "CHARGE", reward_rate_default_bps: 100 }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h3@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Tier", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000, mcc_reward_overrides: [ { mcc_code: "5812", reward_rate_bps: 500 } ] }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "Dining", mcc_code: "5812", amount_cents: 100000 }
              as: FinanceAdmin
              captures: { tx_dine: "$.data.id" }
            - call: "POST /transactions/${tx_dine}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "Misc", mcc_code: "5999", amount_cents: 100000 }
              as: FinanceAdmin
              captures: { tx_misc: "$.data.id" }
            - call: "POST /transactions/${tx_misc}/clear"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /transactions/${tx_dine}/settle"
              payload: { settled_amount_cents: 100000 }
              as: FinanceAdmin
              captures: { rp_dine: "$.data.reward_points_cents" }
            - call: "POST /transactions/${tx_misc}/settle"
              payload: { settled_amount_cents: 100000 }
              as: FinanceAdmin
              captures: { rp_misc: "$.data.reward_points_cents" }
          assert:
            - "Transaction.${tx_dine}.reward_points_cents == 5000"
            - "Transaction.${tx_misc}.reward_points_cents == 1000"

      - name: cf_statement_cashback_round_per_line_then_sum
        grounds:
          - calculations.statement_cashback_total
          - calculations.reward_accrual
          - entities.Transaction.fields.reward_points_cents
        distinguishing_aspect: |
          Mode (b): nested-rounding ORDER. Three settles of 150 cents at 100 bps each round to 2
          per line (round_half_up(1.5)=2), summing to 6; sum-then-round would give 5. The scaffold
          pins round-per-line-then-sum, so cashback-summary returns 6, not 5.
        test_recipe:
          setup:
            - "CHARGE company default 100 bps; three settled transactions each settled_amount 150."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Round", credit_limit_cents: 1000000, billing_model: "CHARGE", reward_rate_default_bps: 100 }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h4@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "T1", mcc_code: "5999", amount_cents: 150 }
              as: FinanceAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /transactions/${t1}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${t1}/settle"
              payload: { settled_amount_cents: 150 }
              as: FinanceAdmin
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "T2", mcc_code: "5999", amount_cents: 150 }
              as: FinanceAdmin
              captures: { t2: "$.data.id" }
            - call: "POST /transactions/${t2}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${t2}/settle"
              payload: { settled_amount_cents: 150 }
              as: FinanceAdmin
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "T3", mcc_code: "5999", amount_cents: 150 }
              as: FinanceAdmin
              captures: { t3: "$.data.id" }
            - call: "POST /transactions/${t3}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${t3}/settle"
              payload: { settled_amount_cents: 150 }
              as: FinanceAdmin
          trigger:
            - call: "GET /statements/${stmt1}/cashback-summary"
              payload: {}
              as: FinanceAdmin
              captures: { cb: "$.data.statement_cashback_cents" }
          assert:
            - "statement_cashback_cents == 6"
            - "settled_transaction_count == 3"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_transaction_parallel_auth_and_review
        grounds:
          - state_machines.Transaction
          - entities.Transaction.fields.auth_status
          - entities.Transaction.fields.review_status
          - state_machines.Transaction.auth_status=PENDING_to_auth_status=CLEARED
          - state_machines.Transaction.review_status=NEEDS_RECEIPT_to_review_status=MATCHED
        distinguishing_aspect: |
          Transaction carries two independent dimensions: advancing auth_status PENDING->CLEARED does
          not change review_status, and uploading a matching receipt advances review_status to MATCHED
          while auth_status stays CLEARED — parallel state on the Transaction entity.
        test_recipe:
          setup:
            - "CHARGE company; one card; tx authorized 10000 (>7500 so review_status=NEEDS_RECEIPT)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Par", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h5@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 10000 }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /transactions/${tx}/receipts"
              payload: { amount_cents: 10000, merchant_name: "M" }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
            - call: "GET /transactions/${tx}"
              payload: {}
              as: FinanceAdmin
              captures: { au: "$.data.auth_status", rv: "$.data.review_status" }
          assert:
            - "Transaction.${tx}.auth_status == CLEARED"
            - "Transaction.${tx}.review_status == MATCHED"

      - name: nlsm_approval_request_reject_resubmit_cycle
        grounds:
          - state_machines.ApprovalRequest
          - state_machines.ApprovalRequest.PENDING_to_REJECTED
          - state_machines.ApprovalRequest.REJECTED_to_PENDING
          - entities.ApprovalRequest.fields.revision_count
        distinguishing_aspect: |
          ApprovalRequest cycles PENDING->REJECTED->PENDING; the resubmit returns it to PENDING and
          increments revision_count to 1 — a genuine cycle on a different entity than Transaction.
        test_recipe:
          setup:
            - "CHARGE company; cardholder + approver; high-value tx with an open PENDING ApprovalRequest that is then REJECTED."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Cyc", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "ch@acme.com", full_name: "CH", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "ap@acme.com", full_name: "AP", employee_role: "APPROVER" }
              as: FinanceAdmin
              captures: { emp_a: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Low", per_transaction_limit_cents: 500000, approval_threshold_cents: 5000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 20000 }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/approval-requests"
              payload: {}
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { ar: "$.data.id" }
            - call: "POST /approval-requests/${ar}/reject"
              payload: { decision_note: "more info" }
              as: Approver
              as_user_id: "${emp_a}"
          trigger:
            - call: "POST /approval-requests/${ar}/resubmit"
              payload: {}
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { st: "$.data.status", rc: "$.data.revision_count" }
          assert:
            - "ApprovalRequest.${ar}.status == PENDING"
            - "ApprovalRequest.${ar}.revision_count == 1"
            - "ApprovalRequest.${ar}.approver_employee_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_repayment_clear_depth3_pays_statement
        grounds:
          - state_machines.Repayment.INITIATED_to_CLEARED
          - entities.Statement.fields.amount_repaid_cents
          - entities.Company.fields.available_credit_cents
          - state_machines.Statement.DUE_to_PAID
          - calculations.available_credit
        distinguishing_aspect: |
          Depth-3 chain from repayment clear: (1) Statement.amount_repaid_cents rises; (2) because it
          rose, Company.available_credit_cents rises; (3) because amount_repaid_cents now >= minimum_due,
          the DUE Statement auto-transitions to PAID. Each hop is caused by the previous, not by clear.
        test_recipe:
          setup:
            - "CHARGE company credit_limit 1,000,000; one settled tx 40000; statement closed (bal 40000, min_due 40000) and ISSUED (DUE)."
            - "A Repayment for 40000 against the DUE statement, status INITIATED."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Pay", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h6@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 40000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 40000 }
              as: FinanceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { company_id: "${co}", to_iso8601: "2026-06-30T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /statements/${stmt1}/close"
              payload: {}
              as: FinanceAdmin
            - call: "POST /statements/${stmt1}/issue"
              payload: {}
              as: FinanceAdmin
              captures: { sv: "$.data.version" }
            - call: "POST /repayments"
              payload: { statement_id: "${stmt1}", amount_cents: 40000, expected_statement_version: "${sv}" }
              as: FinanceAdmin
              captures: { rp: "$.data.id" }
          trigger:
            - call: "POST /repayments/${rp}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "GET /statements/${stmt1}"
              payload: {}
              as: FinanceAdmin
              captures: { st: "$.data.status", ar: "$.data.amount_repaid_cents" }
            - call: "GET /companies/${co}"
              payload: {}
              as: FinanceAdmin
              captures: { ac: "$.data.available_credit_cents" }
          assert:
            - "Statement.${stmt1}.amount_repaid_cents == 40000"
            - "Statement.${stmt1}.status == PAID"
            - "Company.${co}.available_credit_cents == 1000000"

      - name: tc_settle_depth2_release_hold_and_accrue
        grounds:
          - state_machines.Transaction.auth_status=CLEARED_to_auth_status=SETTLED
          - entities.Card.fields.held_cents
          - entities.Company.fields.available_credit_cents
          - entities.RewardAccount.fields.accrued_points_cents
          - calculations.available_credit
        distinguishing_aspect: |
          Depth-2+ chain from settle (a different trigger than repayment clear): (1) Card.held_cents
          drops by amount_cents; (2) because held_cents dropped, Company.available_credit recomputes;
          plus a parallel accrual hop into RewardAccount. The available-credit hop is caused by the
          held_cents change, not directly by settle.
        test_recipe:
          setup:
            - "CHARGE company credit_limit 1,000,000, default 100 bps; one card; tx authorized 10000 then CLEARED (held=10000, available=990000)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme Hold", credit_limit_cents: 1000000, billing_model: "CHARGE", reward_rate_default_bps: 100 }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /reward-accounts"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { ra: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h7@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 10000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 10000 }
              as: FinanceAdmin
            - call: "GET /cards/${card}"
              payload: {}
              as: FinanceAdmin
              captures: { hc: "$.data.held_cents" }
            - call: "GET /companies/${co}"
              payload: {}
              as: FinanceAdmin
              captures: { ac: "$.data.available_credit_cents" }
          assert:
            - "Card.${card}.held_cents == 0"
            - "Company.${co}.available_credit_cents == 1000000"
            - "RewardAccount.${ra}.accrued_points_cents == 100"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_mcc_blocked_beats_card_not_active
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_MCC_BLOCKED]
          - errors[ERR_CARD_NOT_ACTIVE]
        distinguishing_aspect: |
          On capture, a transaction whose MCC is blocked AND whose card is FROZEN violates both the
          business_safety MCC check (p6) and the state card-active check (p7); the lower priority
          number wins, so ERR_MCC_BLOCKED is returned, not ERR_CARD_NOT_ACTIVE.
        test_recipe:
          setup:
            - "CHARGE company; policy blocks mcc 7995; one card then FROZEN."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme PP1", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h8@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Blk", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000, blocked_mcc_codes: ["7995"] }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/freeze"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "Casino", mcc_code: "7995", amount_cents: 5000 }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_MCC_BLOCKED"

      - name: ppvc_gl_required_beats_receipt_required
        grounds:
          - validations[priority=12]
          - validations[priority=14]
          - errors[ERR_GL_CODE_REQUIRED]
          - errors[ERR_RECEIPT_REQUIRED]
        distinguishing_aspect: |
          On approve-review, a transaction with no gl_account_id AND review_status=NEEDS_RECEIPT
          violates business_referential GL check (p12) and business_safety receipt check (p14); p12
          wins so ERR_GL_CODE_REQUIRED is returned, not ERR_RECEIPT_REQUIRED. Different category pair
          from the MCC/state pair above.
        test_recipe:
          setup:
            - "CHARGE company; cardholder + approver; tx 10000 (NEEDS_RECEIPT) with no GL code; no receipt uploaded."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme PP2", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "ch2@acme.com", full_name: "CH", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "ap2@acme.com", full_name: "AP", employee_role: "APPROVER" }
              as: FinanceAdmin
              captures: { emp_a: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 10000 }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { tx: "$.data.id" }
          trigger:
            - call: "POST /transactions/${tx}/approve-review"
              payload: {}
              as: Approver
              as_user_id: "${emp_a}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_GL_CODE_REQUIRED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_receipt_required_threshold_exact
        grounds:
          - state_machines.Transaction.review_status=UNREVIEWED_to_review_status=NEEDS_RECEIPT
          - entities.Transaction.fields.review_status
          - calculations.reward_accrual
        distinguishing_aspect: |
          The receipt-required threshold uses strict '>': a tx at exactly 7500 stays UNREVIEWED
          (no receipt required), while a tx at 7501 becomes NEEDS_RECEIPT. Reached via the capture endpoint.
        test_recipe:
          setup:
            - "CHARGE company; one card; capture two txs, one at 7500 and one at 7501."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme B1", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h9@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
          trigger:
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "Exact", mcc_code: "5999", amount_cents: 7500 }
              as: FinanceAdmin
              captures: { tx_lo: "$.data.id", rv_lo: "$.data.review_status" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "Over", mcc_code: "5999", amount_cents: 7501 }
              as: FinanceAdmin
              captures: { tx_hi: "$.data.id", rv_hi: "$.data.review_status" }
          assert:
            - "Transaction.${tx_lo}.review_status == UNREVIEWED"
            - "Transaction.${tx_hi}.review_status == NEEDS_RECEIPT"

      - name: bpc_receipt_match_tolerance_exact
        grounds:
          - entities.Receipt.fields.match_result
          - state_machines.Transaction.review_status=NEEDS_RECEIPT_to_review_status=MATCHED
        distinguishing_aspect: |
          Receipt match uses '<=' on RECEIPT_TOLERANCE_CENTS (100): a receipt off by exactly 100 from
          the tx amount MATCHes (review_status->MATCHED), while off by 101 MISMATCHes (stays
          NEEDS_RECEIPT). A different metric (absolute difference) on a different endpoint (receipts).
        test_recipe:
          setup:
            - "CHARGE company; one card; tx amount 10000 (NEEDS_RECEIPT)."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Acme B2", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h10@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 10000 }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { tx: "$.data.id" }
          trigger:
            - call: "POST /transactions/${tx}/receipts"
              payload: { amount_cents: 10100, merchant_name: "M" }
              as: CardholderEmployee
              as_user_id: "${emp_h}"
              captures: { mr: "$.data.match_result" }
            - call: "GET /transactions/${tx}"
              payload: {}
              as: FinanceAdmin
              captures: { rv: "$.data.review_status" }
          assert:
            - "Receipt.match_result == MATCH"
            - "Transaction.${tx}.review_status == MATCHED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_approve_review_requires_approved_request
        grounds:
          - state_machines.Transaction.review_status=MATCHED_to_review_status=APPROVED
          - validations[priority=13]
          - errors[ERR_APPROVAL_REQUIRED]
          - entities.ApprovalRequest.fields.status
        distinguishing_aspect: |
          Transaction.approve-review is gated by ApprovalRequest.status (Transaction -> ApprovalRequest
          pair): a high-value MATCHED+GL-coded transaction with its ApprovalRequest still PENDING is
          rejected with ERR_APPROVAL_REQUIRED; only an APPROVED request unblocks it.
        test_recipe:
