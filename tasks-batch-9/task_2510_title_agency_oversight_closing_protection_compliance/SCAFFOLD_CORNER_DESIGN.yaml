            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "RECONCILED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { unreported_3: "$.data.unreported_policy_count", penalty_3: "$.data.late_fee_cents", expected_3: "$.data.expected_gross_premium_cents" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { count_3: "$.data.unreported_policy_count", posture_3: "$.data.oversight_posture" }
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "DRAFT", reopen_reason: "Two closings were omitted" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${p2}", reported_gross_premium_cents: 100000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "RECONCILED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { unreported_2: "$.data.unreported_policy_count", penalty_2: "$.data.late_fee_cents" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { count_2: "$.data.unreported_policy_count", posture_2: "$.data.oversight_posture" }
          assert:
            - "${posture_before} == \"OPEN\" — four issued policies alone do not restrict the agency, since 400000 is far under the 50000000 unremitted tolerance"
            - "trigger[0]: ${expected_3} == 400000, ${unreported_3} == 3 and ${penalty_3} == 30000 (round_half_up(300000 * 0.10), no filing fee at 2026-08-01)"
            - "trigger[1]: ${count_3} == 3 and ${posture_3} == \"RESTRICTED\" — the count reached the >= 3 threshold"
            - "trigger[5]: ${unreported_2} == 2 and ${penalty_2} == 20000"
            - "trigger[6]: ${count_2} == 2 and ${posture_2} == \"OPEN\" — one rung under the threshold releases the posture, so the gate is a live recomputation and not a latch"
            - "PolicyFile.${p1}.remittance_status == \"REPORTED\" and PolicyFile.${p3}.remittance_status == \"UNREPORTED\" after the second reconciliation"

      - name: cascading_side_effects_multi_hop_chains_are_atomic
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: cascade_chain / cascade_a_adverse_closure_freezes_agency_declines_letter_and_spawns_successor
          rationale: "Both multi-hop chains and their conserved ledgers are asserted hop by hop by the §1.8 cascade instances, including CASCADE-C's settlement chain."

      - name: dual_variant_calculation_same_formula_two_scopes
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calculation / defalcation_score_rolling_window_versus_lifetime_uncleared
          rationale: "The variant pair and the trigger that selects each one are pinned there on a single agency history."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_audit_submission_response_already_carries_its_derived_finding
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.escrow_three_way_variance
          - calculations.escrow_audit_risk_tier
        distinguishing_aspect: "Every derived consequence of the submission — the variance, the automatically raised finding, the audit's risk tier and the agency's critical-finding counter and posture — is observable in the same request's response body and in an immediately following read, with no settling period."
        test_recipe:
          setup:
            - "APPOINTED agency in CA with one escrow account whose snapshot has book == bank == 10000000, outstanding 0 and trial_balance 4000000, i.e. a 6000000 BANK_TO_TRIAL variance."
            - "One DRAFT SCHEDULED audit as of 2026-07-31 opened by auditor-1."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-9301", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
              captures: { posture_clean: "$.data.oversight_posture" }
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-9301" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea_id: "$.data.id" }
            - call: "POST /escrow-accounts/${ea_id}/balance-snapshot"
              payload: { book_balance_cents: 10000000, bank_balance_cents: 10000000, outstanding_items_cents: 0, trial_balance_cents: 4000000, unidentified_funds_cents: 0, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2026-07-31" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { adjusted_bank: "$.data.adjusted_bank_balance_cents" }
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea_id}", audit_type: "SCHEDULED", as_of_date: "2026-07-31" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_id: "$.data.id" }
          trigger:
            - call: "POST /escrow-audits/${au_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { method: "$.data.variance_method", variance: "$.data.reconciliation_variance_cents", open_count: "$.data.open_finding_count", crit_count: "$.data.critical_finding_count", tier: "$.data.risk_tier" }
            - call: "GET /escrow-audits/${au_id}/findings"
              payload: { code: "THREE_WAY_VARIANCE" }
              as: EscrowAuditor
              captures: { finding_id: "$.data[0].id", finding_sev: "$.data[0].severity", finding_status: "$.data[0].status" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agency_crit: "$.data.open_critical_finding_count", agency_posture: "$.data.oversight_posture" }
          assert:
            - "${posture_clean} == \"OPEN\" and ${adjusted_bank} == 10000000 (10000000 - 0)"
            - "trigger[0] response body already contains ${method} == \"BANK_TO_TRIAL\", ${variance} == 6000000, ${open_count} == 1, ${crit_count} == 1 and ${tier} == \"CRITICAL\" — the finding was raised inside the same request that submitted the audit"
            - "trigger[1]: total_count == 1 with ${finding_sev} == \"CRITICAL\", ${finding_status} == \"OPEN\" and is_repeat false — no second call was needed to make it appear"
            - "trigger[2]: ${agency_crit} == 1 and ${agency_posture} == \"RESTRICTED\" — the mirrored agency counter and the posture recomputation are visible on the very next read"
