          - errors[ERR_SUBMISSION_WINDOW_EXPIRED]
          - entities.TitleRecord.fields.issued_at
        distinguishing_aspect: "SUBMISSION_WINDOW_DAYS is 180 measured from the salvage title's issued_at 2026-08-01T00:00:00Z, so a submit at clock 2027-02-01T00:00:00Z (184 days later) returns ERR_SUBMISSION_WINDOW_EXPIRED (422) and escrows nothing."
