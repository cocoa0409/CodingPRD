            - "Call 10 now returns 200 with ${agst} == TERMINATED and call 11 returns 200 with ${p1st} == TERMINATED — the two guards were the only thing blocking the teardown"

      - name: principal_status_gates_and_the_refile_ceiling
        claim_type: triggerability
        grounds:
          - errors.ERR_PRINCIPAL_NOT_ACTIVE
          - errors.ERR_REFILE_LIMIT_REACHED
          - state_machines.Deduction.dispute_state
        distinguishing_aspect: |
          ERR_PRINCIPAL_NOT_ACTIVE is raised by three different operations with two
          different admissible status sets: catalog submission accepts PROSPECT and
          ACTIVE, while presentation submission and deal acceptance demand ACTIVE
          exactly. So a PROSPECT principal can load catalog data but not present,
          and a SUSPENDED principal can do neither — while plain item creation stays
          open in every status. Separately, the deny/refile loop is bounded at
          MAX_REFILES = 2, and each refile must reset substantiation while leaving
          the money untouched.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF left in PROSPECT with an ACTIVE FROZEN_SNACKS agreement; item i1 catalog-submitted while PROSPECT and VALIDATED; one OPEN review with a DRAFT presentation pres1 listing i1; clock 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id, pst0: $.data.status }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { agr: $.data.id }
            - call: "POST /commission-agreements/${agr}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { i1: $.data.id }
            - call: "POST /items/${i1}/catalog-submissions"
              payload: { gtin14: "00011111000001", dimensions_cm: "20x15x8", gross_weight_g: 900, nutrition_panel_url: "https://cdn.example/n1.pdf", shelf_life_days: 365 }
              as: BrokerAccountManager
              captures: { sub1: $.data.id }
            - call: "POST /items/${i1}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev: $.data.id }
            - call: "POST /category-reviews/${rev}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${prin}", item_ids: ["${i1}"] }
              as: BrokerAccountManager
              captures: { pres1: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 60000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { ded: $.data.id }
          trigger:
            - call: "POST /presentations/${pres1}/submit"
              payload: {}
              as: BrokerAccountManager
              captures: { e1: $.data.error_id }
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /presentations/${pres1}/submit"
              payload: {}
              as: BrokerAccountManager
              captures: { st1: $.data.status }
            - call: "POST /principals/${prin}/status"
              payload: { status: "SUSPENDED" }
              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "022222000002", description: "Frozen Empanadas 10ct", case_pack_units: 10, list_price_cents: 2000, unit_cost_cents: 1150 }
              as: BrokerAccountManager
              captures: { i2: $.data.id }
            - call: "POST /items/${i2}/catalog-submissions"
              payload: { gtin14: "00022222000002", dimensions_cm: "22x16x8", gross_weight_g: 950, nutrition_panel_url: "https://cdn.example/n2.pdf", shelf_life_days: 300 }
              as: BrokerAccountManager
              captures: { e2: $.data.error_id }
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /items/${i2}/catalog-submissions"
              payload: { gtin14: "00022222000002", dimensions_cm: "22x16x8", gross_weight_g: 950, nutrition_panel_url: "https://cdn.example/n2.pdf", shelf_life_days: 300 }
              as: BrokerAccountManager
              captures: { sub2: $.data.id }
            - call: "POST /deductions/${ded}/dispute"
