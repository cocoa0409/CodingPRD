# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: payment-card-security-assessment  (task_2588)
#
# Nine Difficulty Rules x 2 instances = 18 instances. Every instance grounds in
# elements declared in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file leaves
# the scaffold's declared behaviour identical.
#
# Logical clock default for every recipe below: 2026-08-01T00:00:00Z (the value
# POST /_clock/set_current_utc documents as the seeded position). Recipes that
# need another position set it explicitly.
#
# Every numeric literal in an `assert:` line was computed by executing the
# corresponding §1.3 formula with its declared constants; the fee, sampling,
# rigor and compliance ladders were all evaluated as code before being pinned.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: sampling_plan_preliminary_vs_final_scope_divergence
        grounds:
          - calculations.component_sample_allocation
          - calculations.facility_sample_selection
          - calculations.component_in_sample_selection
          - calculations.assessment_fee_total
          - entities.SystemComponent.fields.declared_scope_class
          - entities.SystemComponent.fields.scope_class
          - entities.SamplingPlan.fields.coverage_ratio
          - state_machines.NetworkSegment.TEST_PLANNED_to_FAILED
        distinguishing_aspect: |
          The two variants of component_sample_allocation read two different columns of the SAME ten
          component rows - PRELIMINARY reads declared_scope_class (the class implied by the segment's
          own segment_class at component-creation time) while FINAL reads scope_class (the class after
          the STORE-POS segmentation FAIL cascade) - so the identical inventory yields
          component_sample_size 5 / coverage_ratio 0.8333 / facility_sample_size 1 under PRELIMINARY
          and component_sample_size 7 / coverage_ratio 0.7000 / facility_sample_size 2 under FINAL.
        test_recipe:
          setup:
            - "One ACTIVE lead assessor (certification expiring 2027-06-30) and one qa_qualified QA reviewer exist."
            - "Engagement 'Northwind Retail Inc' (merchant_level L1, assessment_year 2026, approved_budget_amount 200000.00) is in status SCOPING."
            - "NetworkSegment 'CDE-CORE' (segment_class CDE) is VALIDATED; NetworkSegment 'STORE-POS' (segment_class OUT_OF_SCOPE) has just been FAILED, so scope_expanded_by_failure == true and its effective_class == CDE."
            - "Ten SystemComponent rows exist: srv-01/srv-02/srv-03 (SERVER, facility DC-EAST), app-01/app-02 (APPLICATION, facility DC-WEST), db-01 (DATABASE, facility DC-WEST) all under CDE-CORE; pos-01..pos-04 (POS_TERMINAL, facility RETAIL-12) under STORE-POS."
            - "The four POS rows therefore carry declared_scope_class OUT_OF_SCOPE but scope_class CDE."
            - "No SamplingPlan row exists yet; engagement.posture == RESTRICTED (unvalidated_segment_count 1 because STORE-POS is FAILED)."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /network-segments/${seg_cde_id}/segmentation-test-plan"
              payload: { test_method: "PEN_TEST", planned_date: "2026-08-05" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Firewall rule review and penetration test both clean." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "STORE-POS", segment_class: "OUT_OF_SCOPE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_pos_id: $.data.id }
            - call: "POST /network-segments/${seg_pos_id}/segmentation-test-plan"
              payload: { test_method: "TRAFFIC_ANALYSIS", planned_date: "2026-08-06" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "srv-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_srv01_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "srv-02", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "srv-03", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-WEST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-WEST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "db-01", component_type: "DATABASE", function_class: "DATA_STORE", stores_chd: true, facility_name: "DC-WEST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pos-01", component_type: "POS_TERMINAL", function_class: "PAYMENT_APPLICATION", stores_chd: false, facility_name: "RETAIL-12", facility_type: "RETAIL_STORE", segment_id: "${seg_pos_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_pos01_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pos-02", component_type: "POS_TERMINAL", function_class: "PAYMENT_APPLICATION", stores_chd: false, facility_name: "RETAIL-12", facility_type: "RETAIL_STORE", segment_id: "${seg_pos_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pos-03", component_type: "POS_TERMINAL", function_class: "PAYMENT_APPLICATION", stores_chd: false, facility_name: "RETAIL-12", facility_type: "RETAIL_STORE", segment_id: "${seg_pos_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pos-04", component_type: "POS_TERMINAL", function_class: "PAYMENT_APPLICATION", stores_chd: false, facility_name: "RETAIL-12", facility_type: "RETAIL_STORE", segment_id: "${seg_pos_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_pos_id}/validation-result"
              payload: { outcome: "FAIL", note: "Store VLAN reached the CDE over the shared management path." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v1: $.data.version }
          trigger:
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "PRELIMINARY", justification_text: "Preliminary stratified sample over the declared cardholder data environment.", expected_engagement_version: "${eng_v1}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { prelim_plan_id: $.data.id }
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v2: $.data.version }
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "FINAL", justification_text: "Final stratified sample over the effective cardholder data environment after the STORE-POS failure.", expected_engagement_version: "${eng_v2}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { final_plan_id: $.data.id }
          assert:
            - "SamplingPlan.${prelim_plan_id}.plan_variant == PRELIMINARY and SamplingPlan.${prelim_plan_id}.eligible_component_count == 6"
            - "SamplingPlan.${prelim_plan_id}.stratum_allocations == { SERVER: 2, NETWORK_DEVICE: 0, POS_TERMINAL: 0, APPLICATION: 2, DATABASE: 1 }"
            - "SamplingPlan.${prelim_plan_id}.component_sample_size == 5"
            - "SamplingPlan.${prelim_plan_id}.coverage_ratio == 0.8333"
            - "SamplingPlan.${prelim_plan_id}.facility_population_count == 2 and SamplingPlan.${prelim_plan_id}.facility_sample_size == 1"
            - "SamplingPlan.${prelim_plan_id}.sampled_facility_names == ['DC-EAST']"
            - "SamplingPlan.${final_plan_id}.plan_variant == FINAL and SamplingPlan.${final_plan_id}.eligible_component_count == 10"
            - "SamplingPlan.${final_plan_id}.stratum_allocations == { SERVER: 2, NETWORK_DEVICE: 0, POS_TERMINAL: 2, APPLICATION: 2, DATABASE: 1 }"
            - "SamplingPlan.${final_plan_id}.component_sample_size == 7"
            - "SamplingPlan.${final_plan_id}.coverage_ratio == 0.7000"
            - "SamplingPlan.${final_plan_id}.facility_population_count == 3 and SamplingPlan.${final_plan_id}.facility_sample_size == 2"
            - "SamplingPlan.${final_plan_id}.sampled_facility_names == ['DC-EAST', 'DC-WEST'] (facility_name ASC, RETAIL-12 not selected)"
            - "SamplingPlan.${prelim_plan_id}.status == SUPERSEDED and SamplingPlan.${prelim_plan_id}.superseded_at is non-null"
            - "SamplingPlan.${final_plan_id}.status == ACTIVE and Engagement.${eng_id}.active_sampling_plan_id == ${final_plan_id}"
            - "SystemComponent.${comp_pos01_id}.declared_scope_class == OUT_OF_SCOPE and SystemComponent.${comp_pos01_id}.scope_class == CDE"
            - "SystemComponent.${comp_pos01_id}.in_sample == true after the FINAL plan (POS_TERMINAL stratum, hostname ASC picks pos-01 and pos-02) and was false after the PRELIMINARY plan"
            - "SystemComponent.${comp_srv01_id}.in_sample == true under both plans (SERVER stratum, hostname ASC)"
            - "Engagement.${eng_id}.estimated_hours == 250 and Engagement.${eng_id}.assessment_fee_total == 65475.00 immediately after the PRELIMINARY plan"
            - "Engagement.${eng_id}.estimated_hours == 304 and Engagement.${eng_id}.assessment_fee_total == 79617.60 immediately after the FINAL plan"
            - "The delta between the two variants over identical inventory is component_sample_size 7 - 5 == 2 and coverage_ratio 0.8333 - 0.7000 == 0.1333"

      - name: compliance_projection_as_found_versus_as_attested
        grounds:
          - calculations.compliance_projection
          - calculations.ccw_rigor_score
          - entities.RocReport.fields.as_found_compliance_percentage
          - entities.RocReport.fields.as_attested_compliance_percentage
          - entities.RocReport.fields.compliance_result
          - state_machines.RequirementAssessment.NOT_IN_PLACE_to_IN_PLACE_WITH_CCW
          - state_machines.RequirementAssessment.NOT_STARTED_to_NOT_APPLICABLE
          - state_machines.CompensatingControlWorksheet.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Both variants of compliance_projection run over the SAME two applicable requirements but use
          different membership predicates - AS_FOUND admits only (test_status IN_PLACE AND
          remediation_status NONE) while AS_ATTESTED admits test_status IN {IN_PLACE, IN_PLACE_WITH_CCW} -
          so the compensating-control-covered requirement 6.4.1 lands in the AS_ATTESTED numerator only,
          producing as_found 50.00 versus as_attested 100.00 on one RocReport row, and compliance_result
          COMPLIANT is keyed on the AS_ATTESTED value alone.
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1, approved_budget_amount 200000.00) is scope-locked and in status FIELDWORK with posture OPEN."
            - "NetworkSegment 'CDE-CORE' is VALIDATED and holds three components (app-01 SERVER, pay-01 and pay-02 APPLICATION, all at facility DC-EAST)."
            - "The engagement's most recent SamplingPlan is FINAL and ACTIVE with component_sample_size 3 and coverage_ratio 1.0000, so all three components have in_sample == true."
            - "Requirement 1.2.1 (family R1) is concluded IN_PLACE with remediation_status NONE."
            - "Requirement 6.4.1 (family R6) was concluded NOT_IN_PLACE, then an ACCEPTED CompensatingControlWorksheet (5 control_refs, monitoring_interval_days 1, rigor_score 85.00) drove it to (IN_PLACE_WITH_CCW, GAP_ACCEPTED_CCW) and closed its RemediationItem by CCW."
            - "Requirement 3.6.1 (family R3) exists with applicability NOT_APPLICABLE and therefore stays out of the denominator."
            - "open_gap_count is back to 0 and accepted_ccw_count == 1, so posture is OPEN and a report may be created."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { seg_cde_id: $.data.id }
            - call: "POST /network-segments/${seg_cde_id}/segmentation-test-plan"
              payload: { test_method: "PEN_TEST", planned_date: "2026-08-05" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /network-segments/${seg_cde_id}/validation-result"
              payload: { outcome: "PASS", note: "Segmentation penetration test clean." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "app-01", component_type: "SERVER", function_class: "SECURITY_SERVICE", stores_chd: false, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_app01_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-01", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { comp_pay01_id: $.data.id }
            - call: "POST /engagements/${eng_id}/system-components"
              payload: { hostname: "pay-02", component_type: "APPLICATION", function_class: "PAYMENT_APPLICATION", stores_chd: true, facility_name: "DC-EAST", facility_type: "DATA_CENTER", segment_id: "${seg_cde_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_v1: $.data.version }
            - call: "POST /engagements/${eng_id}/sampling-plans"
              payload: { plan_variant: "FINAL", justification_text: "All three in-scope components sampled; coverage is complete.", expected_engagement_version: "${eng_v1}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-lock"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "1.2.1", requirement_family: "R1", testing_procedure_count: 3, applicability: "APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /requirement-assessments/${req_a_id}/start-testing"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "DOCUMENT_REVIEW", procedure_ref: "1.2.1.a", sufficiency: "SUFFICIENT", note: "Firewall standard reviewed." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "INTERVIEW", procedure_ref: "1.2.1.b", sufficiency: "SUFFICIENT", interviewee_name: "R. Ortiz", interviewee_title: "Network Manager" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/evidence-items"
              payload: { evidence_type: "OBSERVATION", procedure_ref: "1.2.1.c", sufficiency: "SUFFICIENT", component_id: "${comp_app01_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_a_id}/conclusion"
              payload: { conclusion: "IN_PLACE", conclusion_rationale: "Rule set, interview and observed configuration all agree." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "6.4.1", requirement_family: "R6", testing_procedure_count: 3, applicability: "APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_b_id: $.data.id }
            - call: "POST /requirement-assessments/${req_b_id}/start-testing"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_b_id}/evidence-items"
              payload: { evidence_type: "DOCUMENT_REVIEW", procedure_ref: "6.4.1.a", sufficiency: "SUFFICIENT", note: "Change control procedure reviewed." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_b_id}/evidence-items"
              payload: { evidence_type: "INTERVIEW", procedure_ref: "6.4.1.b", sufficiency: "SUFFICIENT", interviewee_name: "T. Bell", interviewee_title: "Release Manager" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_b_id}/evidence-items"
              payload: { evidence_type: "OBSERVATION", procedure_ref: "6.4.1.c", sufficiency: "SUFFICIENT", component_id: "${comp_pay01_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /requirement-assessments/${req_b_id}/conclusion"
              payload: { conclusion: "NOT_IN_PLACE", conclusion_rationale: "Separate development and production accounts are not enforced by the platform." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "GET /requirement-assessments/${req_b_id}"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_b_v: $.data.version }
            - call: "POST /requirement-assessments/${req_b_id}/ccws"
              payload: { constraint_text: "The vendor platform cannot separate development and production credentials.", objective_text: "Prevent unauthorised production change.", identified_risk_text: "A developer could push unreviewed code to production.", control_refs: ["A-1", "A-2", "A-3", "A-4", "A-5"], monitoring_interval_days: 1, validation_text: "Daily privileged-command review with dual sign-off.", maintenance_text: "Quarterly re-approval by the security committee.", expected_requirement_assessment_version: "${req_b_v}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { ccw_b_id: $.data.id }
            - call: "POST /ccws/${ccw_b_id}/submit"
              payload: {}
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /ccws/${ccw_b_id}/decision"
              payload: { decision: "ACCEPT", reviewer_note: "Five independent controls with daily monitoring meet the rigor bar." }
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /engagements/${eng_id}/requirement-assessments"
              payload: { requirement_ref: "3.6.1", requirement_family: "R3", testing_procedure_count: 2, applicability: "NOT_APPLICABLE" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { req_c_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/rocs"
              payload: { roc_version_label: "v1.0" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { roc_id: $.data.id }
          assert:
            - "RocReport.${roc_id}.applicable_requirement_count == 2 (the NOT_APPLICABLE row 3.6.1 is excluded from the denominator even though three RequirementAssessment rows exist)"
            - "RocReport.${roc_id}.in_place_count == 1 and RocReport.${roc_id}.ccw_covered_count == 1 and RocReport.${roc_id}.not_in_place_count == 0"
            - "RocReport.${roc_id}.as_found_compliance_percentage == 50.00"
            - "RocReport.${roc_id}.as_attested_compliance_percentage == 100.00"
            - "RocReport.${roc_id}.compliance_result == COMPLIANT (keyed on AS_ATTESTED alone; keying it on AS_FOUND would have produced NON_COMPLIANT)"
            - "RocReport.${roc_id}.status == DRAFTING and RocReport.${roc_id}.revision_count == 0"
            - "Engagement.${eng_id}.as_found_compliance_percentage == 50.00 and Engagement.${eng_id}.as_attested_compliance_percentage == 100.00"
            - "The two variants differ by exactly 50.00 percentage points over identical row data"
