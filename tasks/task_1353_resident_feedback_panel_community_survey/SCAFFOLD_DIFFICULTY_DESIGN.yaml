            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W2", instrument_id: "${instr_id}", opens_at: "2026-08-12T00:00:00Z", closes_at: "2026-08-20T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 100000, base_incentive_cents: 1000 }, as: PanelManager, captures: { w2_id: $.data.id } }
