            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "A1", body: "1" }, as: Patient, as_user_id: "${pat}", captures: { a1: "$.data.id", a1_v: "$.data.version" } }
