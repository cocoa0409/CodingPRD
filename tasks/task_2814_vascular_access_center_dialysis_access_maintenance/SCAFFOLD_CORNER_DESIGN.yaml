            - "the first sweep returns expired_count 1 with expired_lot_ids == [${lot_id}] and released_count 1 with released_usage_ids == [${use_id}]"
            - "DeviceLot.${lot_id}.status == EXPIRED, quantity_reserved == 0, quantity_on_hand == 8 and received_quantity == 8 — expiry writes off nothing"
            - "DeviceUsage.${use_id}.state == RELEASED with released_at == 2026-09-01T00:00:00Z"
            - "the second sweep returns expired_count 0, released_count 0, expired_lot_ids [] and released_usage_ids [] — EXPIRED is terminal and the sweep is idempotent once run"
            - "Procedure.${proc_id}.clinical_status is still SCHEDULED — the sweep touches stock, not the schedule"

      - name: cyclic_referral_revision_loop_is_countable_and_locks_after_triage
        claim_type: cyclic
        grounds:
          - state_machines.Referral.SUBMITTED_to_INFO_REQUESTED
          - state_machines.Referral.INFO_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / referral_revision_loop_traversed_twice_then_locked_out_after_triage
          rationale: "That instance walks the SUBMITTED <-> INFO_REQUESTED loop twice, asserts info_request_count 2 and the post-triage lockout with ERR_REFERRAL_STATE_INVALID."

      - name: parallel_clinical_and_coding_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Procedure.IN_ROOM_to_ABORTED
          - state_machines.Procedure.ATTESTED_to_BILLED
        excluded_because:
          difficulty_instance: non_linear_state_machine / procedure_clinical_aborted_while_coding_dimension_walks_all_the_way_to_billed
          rationale: "That instance holds clinical_status at ABORTED while coding_status walks UNCODED -> CODED -> ATTESTED -> BILLED on the same row."

      - name: cascade_down_from_a_facility_posture_drop_reaches_stock
        claim_type: cascade_down
        grounds:
          - state_machines.DialysisFacility.ACTIVE_to_SUSPENDED
          - state_machines.Procedure.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / facility_posture_five_hop_chain_holds_referral_cancels_case_and_releases_stock
          rationale: "That instance verifies all five hops of the posture cascade end-to-end, including the RESERVED -> RELEASED stock hop."

      - name: conditional_cascade_hop_four_fires_only_for_a_ready_matching_plan
        claim_type: conditional_cascade
        grounds:
          - state_machines.AccessConversionPlan.ACTIVE_to_CONVERTED
          - state_machines.VascularAccess.IN_USE_to_ABANDONED
        excluded_because:
          difficulty_instance: transitive_cascade / discharge_five_hop_chain_converts_the_plan_and_retires_the_catheter
          rationale: "That instance pins hop 4's readiness_met and target-match conditions and hop 5's retirement of the from_access."

      - name: compensation_release_reverses_a_reservation_without_drift
        claim_type: compensation
        grounds:
          - state_machines.DeviceUsage.RESERVED_to_RELEASED
          - entities.DeviceLot.fields.quantity_reserved
        excluded_because:
          difficulty_instance: compensating_invariant / device_unit_conservation_survives_one_consumption_and_one_release
          rationale: "That instance asserts the full conservation identity after one consumption and one release."

      - name: guarded_transition_plan_activation_depends_on_the_target_access_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.AccessConversionPlan.DRAFT_to_ACTIVE
          - errors.ERR_TARGET_ACCESS_NOT_CONVERTIBLE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_activation_and_supersession_both_hinge_on_the_target_access_state
          rationale: "That instance rejects activation against an IN_USE target and then activates against a PLANNED one."

  - section: calculations
    instances:
      - name: partnership_metrics_are_zero_for_a_facility_with_no_referrals
        claim_type: correct_result
        grounds:
          - calculations.facility_missed_treatment_metrics
          - endpoints.GET_dialysis-facilities_id_partnership-metrics
        distinguishing_aspect: "The empty-set boundary returns 0 for BOTH integer rates instead of dividing by zero or omitting the keys, echoes window_start = clock - 90 days and window_end = clock, and persists nothing (last_scored_at stays null)."
        test_recipe:
          setup:
            - "one brand-new facility and nothing else"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Twenty One", facility_code: "C-21" }
              as: CenterAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          trigger:
            - call: "GET /dialysis-facilities/${fac_id}/partnership-metrics"
              payload: {}
              as: AccessCoordinator
            - call: "GET /dialysis-facilities/${fac_id}"
              payload: {}
              as: CenterAdmin
          assert:
            - "HTTP 200 with data.facility_id == ${fac_id}, data.partnership_score == 100, data.partnership_tier == SILVER, data.contract_status == ACTIVE"
            - "data.referral_volume_window == 0, data.raw_missed_count_window == 0, data.grace_credit_window == 0, data.adjusted_missed_count_window == 0, data.same_day_honored_window == 0"
            - "data.missed_treatments_per_referral_x100 == 0 and data.same_day_honor_rate_pct == 0 — integers, not nulls, and no ZeroDivisionError"
            - "data.window_end == 2026-08-01T00:00:00Z and data.window_start == 2026-05-03T00:00:00Z (exactly 90 days earlier)"
            - "the follow-up GET shows last_scored_at still null and version still ${fac_v} — the metrics read is pure"
            - "response_type == object and meta carries api_request_id and api_request_timestamp"

      - name: triage_missed_treatment_component_is_capped_at_eighteen
        claim_type: constants_applied
        grounds:
          - calculations.referral_triage_score.constants.MISSED_POINTS_CAP
          - calculations.referral_triage_score.constants.MISSED_POINTS_PER
        distinguishing_aspect: "MISSED_POINTS_PER 6 * count is clamped by MISSED_POINTS_CAP 18, so 3 missed treatments (exactly 18) and 4 missed treatments (24 raw) both contribute 18 — an uncapped implementation would score the second referral 24."
        test_recipe:
          setup:
            - "one facility with two benign IN_USE accesses (flow 900 each) and two referrals, one with missed_treatment_count 3 and one with 4"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Twenty Two", facility_code: "C-22" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-22", full_name: "Mara Toledano", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-03-01" }
              as: AccessCoordinator
              captures: { acc_a: $.data.id }
            - call: "POST /vascular-accesses/${acc_a}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_a}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_a}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVF", laterality: "RIGHT", site: "UPPER_ARM", placed_on: "2026-03-10" }
              as: AccessCoordinator
              captures: { acc_b: $.data.id }
            - call: "POST /vascular-accesses/${acc_b}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_b}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_b}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_a}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-25T08:00:00Z", access_flow_ml_min: 900, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_b}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-26T08:00:00Z", access_flow_ml_min: 900, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_a}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "cap boundary at three", missed_treatment_count: 3 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_a: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_b}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "cap exceeded at four", missed_treatment_count: 4 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_b: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_a}/triage"
              payload: {}
              as: AccessCoordinator
            - call: "POST /referrals/${ref_b}/triage"
              payload: {}
              as: AccessCoordinator
            - call: "GET /dialysis-facilities/${fac_id}"
              payload: {}
              as: CenterAdmin
          assert:
            - "referral A scores 18: flow 900 gives level_points 0, VP 100 gives 0, recirculation 2.0 gives 0, missed_points == min(18, 6*3) == 18, variant ABSOLUTE_BASED, urgency ROUTINE (18 < 45)"
            - "referral B also scores 18, not 24: min(18, 6*4) == 18 — the cap, not the multiplier, decides"
            - "both referrals land in urgency ROUTINE, so the two 18s are indistinguishable on the wire except through triage_score"
            - "the facility read shows referral_volume_window 2, raw_missed_count_window 7, grace_credit_window floor(2*0.10) == 0, adjusted_missed_count_window 7, partnership_score 100 - 4*7 == 72, tier SILVER, contract ACTIVE"
            - "because 72 >= 70 the facility never leaves ACTIVE, so ERR_FACILITY_SUSPENDED never interferes with either triage"

      - name: triage_trend_uses_reading_at_order_not_creation_order
        claim_type: chronological
        grounds:
          - calculations.referral_triage_score.input_set
          - calculations.referral_triage_score.variants.trend_based
        distinguishing_aspect: "The window is ordered by reading_at ASC (created_at only breaks ties), so posting the newer reading FIRST must still make it `latest`; an implementation that ordered by created_at or by id would compute a NEGATIVE drop, clamp trend_points to 0 and land in ROUTINE instead of NEXT_DAY."
        test_recipe:
          setup:
            - "one IN_USE access with two readings created in reverse chronological order: reading_at 2026-07-28 (flow 700) inserted before reading_at 2026-07-20 (flow 1000)"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Twenty Three", facility_code: "C-23" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MC-23", full_name: "Noor Haddad", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-03-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { late_reading_id: $.data.id }
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-20T08:00:00Z", access_flow_ml_min: 1000, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "BACKFILL" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { early_reading_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "backfilled baseline", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/triage"
              payload: {}
              as: AccessCoordinator
          assert:
            - "both readings are inside the closed window [2026-07-11, 2026-08-01], so qualifying has length 2 and variant == TREND_BASED"
            - "prev is the 2026-07-20 reading (flow 1000) and latest is the 2026-07-28 reading (flow 700) despite the reverse insertion order"
            - "flow_drop_pct == (1000 - 700) / 1000 * 100 == 30.0 and trend_points == min(40, max(0, round_half_up(30.0 * 1.2))) == 36"
            - "level_points == 12 because latest flow 700 is < 800 but not < 600; pressure_points 0, recirc_points 0, missed_points 0"
            - "data.triage_score == 48 and data.urgency == NEXT_DAY (48 >= 45, < 70) — a created_at ordering would give trend_points 0, score 12 and ROUTINE"
            - "kind is irrelevant to membership: the BACKFILL reading counts exactly like the ROUTINE one"

      - name: device_allocation_is_fefo_with_created_at_tiebreak_and_all_or_nothing
        claim_type: waterfall_allocation
        grounds:
          - calculations.device_lot_allocation
          - endpoints.POST_procedures_id_device-allocations
        distinguishing_aspect: "The waterfall fills each lot to its exact headroom before touching the next, ranks by expires_on ASC with created_at ASC as the only tie-break, silently excludes the same-day-expiring and QUARANTINED lots, and reserves nothing at all when the aggregate is short."
