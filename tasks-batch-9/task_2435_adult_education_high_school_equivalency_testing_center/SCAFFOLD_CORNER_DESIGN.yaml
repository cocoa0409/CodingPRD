              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp_v: $.data.version }
          trigger:
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v}" }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { e1: $.data.error_id }
            - call: "POST /funding-periods/${fp}/close"
              payload: {}
              as: StateAuthority
              as_user_id: "state-1"
              captures: { e2: $.data.error_id }
            - call: "GET /funding-periods/${fp}"
              payload: {}
              as: StateAuthority
              as_user_id: "state-1"
          assert:
            - "the close call returned 200 with data.status == 'CLOSED'"
            - "the allocation-run on the closed period returns 409 with data.error_id == 'ERR_FUNDING_PERIOD_CLOSED' even though expected_funding_period_version was current"
            - "the second close returns 409 with data.error_id == 'ERR_FUNDING_PERIOD_CLOSED'"
            - "GET /funding-periods/${fp} returns data.version == ${fp_v}, data.allocation_run_count == 0, data.committed_cents == 0, data.available_cents == 300000"

