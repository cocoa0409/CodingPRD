# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3475_government_digital_payment_portal_convenience_fee_administration
# Nine Difficulty Rules x >=2 instances, grounded in SCAFFOLD.yaml §1.1-§1.7.
# YAML anchors (&k_*) are defined in the first instance and aliased later; every
# alias re-executes the call, so each instance's chain binds its own captures.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: convenience_fee_quoted_assumes_credit_final_uses_actual_bucket
        grounds:
          - calculations.convenience_fee
          - entities.FeeQuote.fields.quoted_fee_cents
          - entities.PaymentTransaction.fields.final_fee_cents
          - entities.PaymentTransaction.fields.charged_fee_cents
        distinguishing_aspect: |
          Same amount and method, two valid fee computations on the transaction
          domain: QUOTED assumes card bucket CONSUMER_CREDIT (220bp + 30 on the
          gross), FINAL uses the instrument's actual CONSUMER_DEBIT bucket
          (150bp + 25). The payer is charged the disclosure-binding QUOTED fee
          2281 while final_fee_cents records 1549 — a 732-cent divergence on
          identical inputs.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one ACTIVE CONVENIENCE_FEE agency with a VERIFIED account, CURRENT PCI attestation, and an ACTIVE all-methods service with an APPROVED statutory authorization (cap 5000)."
            - "One payer with a CARD instrument whose card_cost_bucket is CONSUMER_DEBIT."
            - "An OPEN quote for amount 100000 method CARD."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_agency
              call: "POST /portal/agencies"
              payload: { legal_name: "Department of Public Safety", agency_type: "STATE", default_fee_model: "CONVENIENCE_FEE" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - &k_account
              call: "POST /portal/settlement-accounts"
              payload: { agency_id: "${ag_id}", routing_number: "021000021", account_number_last4: "4321", effective_from: "2026-01-01T00:00:00Z", expected_agency_version: "${ag_v}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - &k_verify
              call: "POST /portal/settlement-accounts/${acct_id}/verify"
              payload: { outcome: "SUCCESS" }
              as: TreasuryOfficer
            - &k_attest
              call: "POST /portal/attestations"
              payload: { agency_id: "${ag_id}", attestation_type: "PCI_DSS_AOC", issued_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - &k_agency_on
              call: "POST /portal/agencies/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_service
              call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "DL-RENEW", name: "Driver License Renewal", fee_model: "CONVENIENCE_FEE", allowed_methods: ["CARD", "ECHECK", "WALLET"], min_amount_cents: 100, max_amount_cents: 1000000, gl_code: "4110" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { svc_id: $.data.id, svc_v: $.data.version }
            - &k_authz
              call: "POST /portal/statutory-authorizations"
              payload: { service_id: "${svc_id}", statute_citation: "62 O.S. 34.9", disclosure_text_version: "D1", fee_cap_cents: 5000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { authz_id: $.data.id }
            - &k_authz_ok
              call: "POST /portal/statutory-authorizations/${authz_id}/approve"
              payload: {}
              as: PlatformAdmin
            - &k_service_on
              call: "POST /portal/services/${svc_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_payer
              call: "POST /portal/payers"
              payload: { full_name: "Pat Parker", email: "pat@example.com", billing_zip: "73102" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - &k_card_debit
              call: "POST /portal/payers/${payer_id}/instruments"
              payload: { method: "CARD", card_brand: "VISA", card_cost_bucket: "CONSUMER_DEBIT", last4: "4242" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { inst_card: $.data.id }
            - &k_quote_card100k
              call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 100000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_id}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn_id: $.data.id }
          assert:
            - "the authorize response status is 201 and PaymentTransaction.${txn_id}.funds_status == AUTHORIZED"
            - "PaymentTransaction.${txn_id}.charged_fee_cents == 2281 (the QUOTED variant: ceiling((220*100000 + 30*10000) / (10000-220)))"
            - "PaymentTransaction.${txn_id}.final_fee_cents == 1549 (the FINAL variant with the actual CONSUMER_DEBIT bucket: ceiling((150*100000 + 25*10000) / (10000-150)))"
            - "PaymentTransaction.${txn_id}.final_fee_cents != PaymentTransaction.${txn_id}.charged_fee_cents — same inputs, two valid variants, a 732-cent divergence"
            - "PaymentTransaction.${txn_id}.payer_total_cents == 102281"
            - "GET /portal/fee-quotes/${quote_id} shows quoted_fee_cents == 2281, disclosure_text_version == \"D1\" and status == CONSUMED"

      - name: portal_cost_recognition_accrual_vs_cash
        grounds:
