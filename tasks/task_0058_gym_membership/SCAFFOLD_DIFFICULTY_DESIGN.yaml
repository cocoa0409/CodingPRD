scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: card_remaining_value_dual_variant
        grounds:
          - calculations.remaining_value
          - calculations.remaining_value.variants[chronological_remaining]
          - entities.Card.fields.issuance_price_cents
          - entities.CardType.fields.validity_days
          - endpoints[POST /cards/{id}/refund]
          - endpoints[GET /cards/{id}/refund-preview]
        distinguishing_aspect: |
          Entity domain: Card (cost/value accounting). For an ANNUAL card priced 120000 cents
          over 365 days with 100 days remaining, forward_looking yields 32877 cents
          (sum-then-round) while chronological_remaining yields 32900 cents
          (round-per-day then sum) — a 23-cent divergence the refund-preview MUST expose.
        test_recipe:
          setup:
            - "Create CardType code=ANN_STD, category=ANNUAL, price_cents=120000, validity_days=365, visit_quota=0, max_freeze_days=14, transfer_fee_pct_bp=1000, refund_eligibility_days=30."
            - "Create Member with wallet_balance_cents >= 200000."
            - "POST /cards holder_member_id=<m>, card_type_id=<ann_std>; POST /cards/{id}/activate at t0=2026-01-01T00:00:00Z."
            - "POST /_clock/advance to 2026-09-22T00:00:00Z (265 days elapsed; 100 days remaining)."
          trigger:
            - "GET /cards/{card_id}/refund-preview"
            - "POST /cards/{card_id}/refund (executes forward_looking variant)"
          assert:
            - "refund_preview.data.forward_looking_remaining_value_cents == 32877"
            - "refund_preview.data.chronological_remaining_value_cents == 32900"
            - "After refund: latest WalletTransaction with kind==REFUND and ref_entity startswith 'Card:' has amount_cents == 32877."
            - "Card.status == 'REFUNDED'."

      - name: trainer_session_commission_tier_modifier_variant
        grounds:
          - calculations.session_commission
          - entities.Trainer.fields.tier
          - entities.Trainer.fields.session_commission_pct_bp
          - entities.PTBooking.fields.session_price_cents
          - state_machines.PTBooking.CONFIRMED_to_COMPLETED
        distinguishing_aspect: |
          Entity domain: Trainer (commission / risk scoring on a different subject than Card).
          For an identical PTBooking with session_price_cents=20000 and trainer rate=1500 bp,
          the commission row written by CONFIRMED→COMPLETED is 3000 cents when Trainer.tier=BRONZE
          but 5000 cents when Trainer.tier=GOLD — the tier modifier in §1.3 session_commission
          forks the result on identical session-level inputs.
        test_recipe:
          setup:
            - "Two trainers t_bronze and t_gold, both with session_commission_pct_bp=1500."
            - "POST /payouts(cycle_start=2026-01-01,cycle_end=2026-04-01); record 80 COMPLETED PTBookings for t_gold and 0 for t_bronze in the cycle window (via wallet-prefunded members)."
            - "POST /_clock/advance to 2026-04-01T00:00:00Z; POST /payouts/{cycle}/close — Trainer.tier := GOLD for t_gold, BRONZE for t_bronze."
            - "POST /pt-bookings for member m_bronze on t_bronze slot with session_price_cents=20000; POST /pt-bookings for member m_gold on t_gold slot, same price."
            - "POST /_clock/advance past both slots' starts_at."
          trigger:
            - "POST /pt-bookings/{b_bronze}/complete"
            - "POST /pt-bookings/{b_gold}/complete"
          assert:
            - "CommissionRecord row for b_bronze: kind=='SESSION', amount_cents == 3000."
            - "CommissionRecord row for b_gold: kind=='SESSION', amount_cents == 5000."
            - "Both bookings have identical session_price_cents (20000) — the divergence is entirely from Trainer.tier."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a)/(b)/(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recharge_bonus_tiered_rate_nested_min
        grounds:
          - calculations.recharge_bonus_grant
          - calculations.wallet_debit
          - entities.WalletTransaction.fields.expires_at
          - endpoints[POST /members/{id}/wallet/recharge]
        distinguishing_aspect: |
          MODE (a): formula with ≥3 inputs and non-linear interaction.
          Inputs: (amount_cents, recharge tier breakpoints {20000, 50000, 100000}, outstanding
          bonus-grant ordering by expires_at). Recharge picks a tier-of-tiers (different bp per
          band), grant is appended with TTL, and the subsequent wallet_debit's bonus-first FIFO
          interacts non-linearly with the chosen bp. For amount_cents=25000 the bonus is 1250
          (5% tier); for amount_cents=50000 it is 5000 (10% tier), not a proportional jump.
        test_recipe:
          setup:
            - "Member m with wallet_balance_cents=0."
          trigger:
            - "POST /members/{m}/wallet/recharge {amount_cents: 25000}"
            - "POST /members/{m}/wallet/recharge {amount_cents: 50000}"
          assert:
            - "After 1st recharge: principal sum == 25000, bonus sum == 1250."
            - "After 2nd recharge: principal sum == 75000, bonus sum == 6250 (1250 + 5000)."
            - "GET /members/{m} shows wallet_balance_cents == 81250 and bonus_balance_cents == 6250."

      - name: transfer_fee_round_order_pinned
        grounds:
          - calculations.transfer_fee
          - calculations.remaining_value
          - entities.CardType.fields.transfer_fee_pct_bp
          - endpoints[POST /cards/{id}/transfer]
        distinguishing_aspect: |
          MODE (b): nested rounding where the order matters.
          remaining_value runs sum-then-round (FINAL step) producing 32877; transfer_fee then
          multiplies by 1000 bp and rounds — if you swap the rounding order (round each daily
          contribution first), you get 32900 * 0.10 = 3290 instead of the pinned 3288.
          The scaffold pins remaining_value→transfer_fee→floor; alternative ordering produces
          different cents.
        test_recipe:
          setup:
            - "CardType ANN_STD as in card_remaining_value_dual_variant (price 120000, validity 365, transfer_fee_pct_bp=1000)."
            - "Two members in the same family_group_id 'F1'. Both have wallet_balance_cents >= 10000."
            - "Issue+activate Card on holder at 2026-01-01; advance clock to 2026-09-22 (100 days remaining); visits_consumed==0; no freeze episodes."
          trigger:
            - "POST /cards/{card_id}/transfer {to_member_id: <other family member>}"
          assert:
            - "TransferRecord.remaining_value_cents == 32877."
            - "TransferRecord.transfer_fee_cents == 3288 (pinned order: round remaining first, then apply bp, then max with MIN_TRANSFER_FEE_CENTS)."
            - "WalletTransaction kind=DEBIT, service_type=TRANSFER_FEE has amount_cents == -3288."

      - name: renewal_quote_circular_dependency_evaluation_order
        grounds:
          - calculations.renewal_quote
          - calculations.effective_expiry
          - entities.Card.fields.effective_expiry_date
          - state_machines.Card.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          MODE (c): circular-looking dependency where evaluation order must be pinned.
          renewal_quote depends on days_to_expiry, which depends on Card.effective_expiry_date,
          which depends on cumulative_freeze_days (in turn affected by any in-progress freeze
          via §1.3 effective_expiry status filter {SETTLED, APPROVED, CANCELED}). The scaffold
          pins: (i) recompute effective_expiry first using current freeze episodes, (ii) then
          compute days_to_expiry against the result. If a tester evaluates renewal_quote against
          original_expiry_date instead, they get a smaller days_to_expiry, dropping into the
          'urgent' band, producing 24000 cents instead of the pinned 25500.
        test_recipe:
          setup:
            - "CardType MONTHLY price 30000, validity_days=30, max_freeze_days=10, renewal_discount_pct_bp=1500."
            - "Activate card at 2026-01-01; advance clock to 2026-01-20 (original_expiry 2026-01-30, 10 days remain)."
            - "POST /cards/{id}/freeze {reason:'ILLNESS', requested_days:5} at this point — Card→FROZEN; APPROVED freeze contributes 5 days to effective_expiry."
            - "Advance clock 1 minute (not crossing ends_at). Now effective_expiry_date = 2026-02-04."
            - "Days to expiry from 2026-01-20 to 2026-02-04 = 15 days. → discount band = 15 >= 7, so discount_bp == renewal_discount_pct_bp == 1500."
          trigger:
            - "GET /cards/{id}/renewal-quote"
          assert:
            - "response.data.days_to_expiry == 15 (NOT 10, because effective_expiry includes APPROVED freeze)."
            - "response.data.renewal_price_cents == 25500 (round_half_up(30000 * 0.85))."
            - "Note: if evaluator wrongly uses original_expiry_date (10 days), discount_bp = 1500+500 = 2000, yielding 24000. The 25500 vs 24000 split detects mis-ordered evaluation."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: card_branching_cycle_freeze_unfreeze
        grounds:
          - state_machines.Card.ACTIVE_to_FROZEN
          - state_machines.Card.FROZEN_to_ACTIVE
          - state_machines.FreezeEpisode.APPROVED_to_CANCELED
          - state_machines.FreezeEpisode.APPROVED_to_SETTLED
        distinguishing_aspect: |
          Entity Card has a CYCLE ACTIVE→FROZEN→ACTIVE that is re-enterable across multiple
          freeze episodes, each one extending effective_expiry. Across two episodes the card
          revisits ACTIVE twice between two FROZEN intervals. This is the cycle shape on Card,
          DIFFERENT FROM the parallel-dimension shape on GroupBooking below.
        test_recipe:
          setup:
            - "Activate Card at t0; cumulative_freeze_days=0; max_freeze_days=14."
          trigger:
            - "POST /cards/{id}/freeze {requested_days: 5} → Card ACTIVE→FROZEN (cycle hop 1)."
            - "POST /_clock/advance past freeze ends_at → Card FROZEN→ACTIVE (cycle hop 2)."
            - "POST /cards/{id}/freeze {requested_days: 4} → Card ACTIVE→FROZEN (cycle hop 3)."
            - "POST /cards/{id}/unfreeze {freeze_episode_id} → Card FROZEN→ACTIVE (cycle hop 4)."
          assert:
            - "Card.status == 'ACTIVE' at end."
            - "Card.cumulative_freeze_days >= 5 (settled hop 1) and >= the actual_days of episode 2 (early end)."
            - "Two FreezeEpisode rows exist: 1st status=='SETTLED', 2nd status=='CANCELED'."
            - "Card visited ACTIVE state at least 3 distinct times (initial + 2 returns)."

      - name: group_booking_branching_with_waitlist_promotion
        grounds:
          - state_machines.GroupBooking.WAITLISTED_to_CONFIRMED
          - state_machines.GroupBooking.CONFIRMED_to_CANCELED
          - state_machines.GroupBooking.WAITLISTED_to_CANCELED
        distinguishing_aspect: |
          Entity GroupBooking has BRANCHING with parallel exits from CONFIRMED ({CANCELED, ATTENDED,
          NO_SHOW}) and from WAITLISTED ({CONFIRMED, CANCELED}). When a CONFIRMED→CANCELED fires, a
          DIFFERENT booking row (the waitlist head) transitions WAITLISTED→CONFIRMED as a side
          effect — a fork-then-side-channel-promotion shape that no other entity in this scaffold
          exhibits. Different entity from Card's cycle.
        test_recipe:
          setup:
            - "GroupClass capacity=1, deduction_cents=0."
            - "Member m1 books → GroupBooking CONFIRMED. Member m2 books → GroupBooking WAITLISTED, waitlist_position=1."
          trigger:
            - "POST /group-bookings/{m1_booking}/cancel"
          assert:
            - "m1 booking.status == 'CANCELED'."
            - "m2 booking.status == 'CONFIRMED' (promoted)."
            - "m2 booking.waitlist_position is null."
            - "GroupClass.confirmed_count == 1 (constant after promotion)."

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: package_refund_to_commission_to_audit_chain
        grounds:
          - state_machines.PTPackage.ACTIVE_to_REFUNDED
          - calculations.commission_reversal
          - entities.CommissionRecord
          - entities.AuditLogEntry
          - endpoints[POST /pt-packages/{id}/refund]
        distinguishing_aspect: |
          Depth ≥ 3 chain originating from POST /pt-packages/{id}/refund:
          link 1 PTPackage ACTIVE→REFUNDED mutates PTPackage row;
          link 2 PTPackage refund row causes commission_reversal to append a negative
          CommissionRecord — caused BY the package row mutation, not by the original request;
          link 3 the CommissionRecord append in turn writes an AuditLogEntry(action=COMMISSION_REVERSAL)
          — caused BY the commission row, not by the original request.
          Trigger: POST /pt-packages/{id}/refund.
        test_recipe:
          setup:
            - "Trainer t with package_commission_pct_bp=800."
            - "Member m purchases PTPackage gross_price_cents=100000, total_sessions=7. CommissionRecord(kind=PACKAGE_SALE, 8000) was written at sale."
            - "Complete 3 PTBookings against the package (sessions_consumed=3, sessions_unconsumed=4)."
          trigger:
            - "POST /pt-packages/{id}/refund"
          assert:
            - "Link 1: PTPackage.status == 'REFUNDED'."
            - "Link 2: New CommissionRecord exists with kind=='REVERSAL', amount_cents == -4571 (round_half_up(8000 * 4 / 7))."
            - "Link 3: New AuditLogEntry exists with action == 'COMMISSION_REVERSAL' and target_entity startswith 'PTPackage:'."

      - name: clock_advance_to_card_expiry_to_autorenew_chain
        grounds:
          - state_machines.Card.ACTIVE_to_EXPIRED
          - calculations.reminder_dispatch
          - calculations.renewal_quote
          - entities.Card.fields.parent_card_id
          - endpoints[POST /_clock/advance]
          - endpoints[POST /_sweep/run]
        distinguishing_aspect: |
          Depth ≥ 2 chain originating from POST /_clock/advance:
          link 1 the clock cross causes Card ACTIVE→EXPIRED (mutates Card row);
          link 2 the Card EXPIRED transition with Member.auto_renew_authorized=true causes
          renewal_quote to be evaluated and a CHILD Card to be created with parent_card_id set —
          caused BY the parent's EXPIRED transition, not by the original /_clock/advance call.
          DIFFERENT triggering transition from the package refund chain above.
        test_recipe:
          setup:
            - "Member m with auto_renew_authorized=true and wallet_balance_cents=200000."
            - "Issue+activate MONTHLY card price 30000, validity_days=30, renewal_discount_pct_bp=0; activation_date=2026-01-01."
            - "POST /_sweep/run at 2026-01-31 to dispatch RenewalReminder(tier=T0) status=AUTO_RENEW_TRIGGERED."
          trigger:
            - "POST /_clock/advance {to: '2026-01-31T23:59:59.999Z'}"
          assert:
            - "Link 1: original Card.status == 'EXPIRED'."
            - "Link 2: a new Card exists with parent_card_id == <original card id>, status == 'ACTIVE'."
            - "WalletTransaction kind=DEBIT, service_type=CARD_ISSUANCE has amount_cents == -30000 (renewal price with 0 discount since 0 days remain)."

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_refund_on_frozen_card
        grounds:
          - validations[priority=7]
          - validations[priority=19]
          - state_machines.Card
        distinguishing_aspect: |
          Error-category pair (state vs business_referential).
          A card that is FROZEN (state != ACTIVE) AND has a SETTLED FreezeEpisode triggers BOTH
          priority 7 (ERR_INVALID_STATE) and priority 19 (ERR_REFUND_FROZEN_CARD_BLOCKED). The
          scaffold orders priority 7 first → tester MUST see ERR_INVALID_STATE, not ERR_REFUND_FROZEN_CARD_BLOCKED.
        test_recipe:
          setup:
            - "Card activated; one FreezeEpisode SETTLED already (cumulative_freeze_days > 0)."
            - "Start a new freeze so Card.status == 'FROZEN' (APPROVED episode in progress)."
          trigger:
            - "POST /cards/{id}/refund"
          assert:
            - "Response HTTP 409."
            - "error_id == 'ERR_INVALID_STATE' (priority 7 wins, NOT 'ERR_REFUND_FROZEN_CARD_BLOCKED')."

      - name: business_constraint_vs_business_fiscal_pt_cancel_late_with_low_balance
        grounds:
          - validations[priority=16]
          - validations[priority=25]
          - state_machines.PTBooking
        distinguishing_aspect: |
          Error-category pair (business_constraint vs business_fiscal). DIFFERENT pair from above.
          A member tries to book a SINGLE PT session for a slot whose start has ALREADY passed
          (priority not in this test) — actually we frame it for cancel: PT booking cancel
          attempted with now() > scheduled_starts_at (cancel-window expired, business_constraint)
          AND wallet would not cover a hypothetical refund (irrelevant here, but business_fiscal
          checks fire after constraint). For booking: setting up an attempt to POST /pt-bookings
          for a slot in OPEN status but with member balance insufficient and the slot already
          past its starts_at — slot must still be OPEN to reach the booking, then priority 16
          (CANCEL_WINDOW) on cancel beats priority 25 (INSUFFICIENT_BALANCE). Pinned: priority 16
          wins.
        test_recipe:
          setup:
            - "Slot s starts_at=2026-02-01T10:00:00Z."
            - "Member m with wallet_balance_cents=20000 books PTBooking (SINGLE) for s; balance debited."
            - "Advance clock to 2026-02-01T10:30:00Z (past slot starts_at)."
            - "Spend down m's wallet to balance=0 (e.g., a group-class debit; or recharge_negative test path)."
          trigger:
            - "POST /pt-bookings/{id}/cancel"
          assert:
            - "Response HTTP 409 with error_id == 'ERR_CANCEL_WINDOW_EXPIRED' (priority 16)."
            - "NOT 'ERR_INSUFFICIENT_BALANCE' (priority 25)."

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refund_eligibility_day_inclusive_boundary
        grounds:
          - validations[priority=18]
          - entities.CardType.fields.refund_eligibility_days
          - endpoints[POST /cards/{id}/refund]
        distinguishing_aspect: |
          Metric: numeric day-count threshold. Endpoint: POST /cards/{id}/refund.
          Precondition uses >= (inclusive): remaining_validity_days == refund_eligibility_days
          is ELIGIBLE; remaining_validity_days == refund_eligibility_days - 1 fails.
          Pinned boundary: 30 == 30 → success; 29 < 30 → ERR_REFUND_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "CardType refund_eligibility_days=30, validity_days=90, price=90000."
            - "Activate card at 2026-01-01; original_expiry = 2026-04-01."
            - "Path A: advance clock to 2026-03-02 (30 days remain). Path B (fresh card): advance to 2026-03-03 (29 days remain)."
          trigger:
            - "Path A: POST /cards/{cardA}/refund"
            - "Path B: POST /cards/{cardB}/refund"
          assert:
            - "Path A: HTTP 200; Card.status == 'REFUNDED'."
            - "Path B: HTTP 422; error_id == 'ERR_REFUND_NOT_ELIGIBLE'."

      - name: group_class_waitlist_empty_promotion_no_op
        grounds:
          - state_machines.GroupBooking.CONFIRMED_to_CANCELED
          - entities.GroupClass.fields.confirmed_count
          - entities.GroupClass.fields.waitlist_count
          - endpoints[POST /group-bookings/{id}/cancel]
        distinguishing_aspect: |
          Metric: empty-collection (zero-count) boundary on the waitlist. Endpoint: POST
          /group-bookings/{id}/cancel (different endpoint from above).
          When confirmed_count goes from 1→0 with waitlist_count == 0 (empty set), the
          promotion side-effect is a NO-OP (must NOT crash or promote ghost bookings).
          Compared with the non-empty case (waitlist_count >= 1), exactly one row transitions.
        test_recipe:
          setup:
            - "GroupClass capacity=2, no waitlist. Member m1 CONFIRMED (only booking)."
          trigger:
            - "POST /group-bookings/{m1_booking}/cancel"
          assert:
            - "HTTP 200."
            - "GroupClass.confirmed_count == 0."
            - "GroupClass.waitlist_count == 0."
            - "No GroupBooking row transitioned from WAITLISTED→CONFIRMED (waitlist set was empty; promotion must not raise)."

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: card_freeze_blocked_by_active_pt_booking
        grounds:
          - validations[priority=24]
          - state_machines.Card.ACTIVE_to_FROZEN
          - entities.PTBooking
        distinguishing_aspect: |
          Entity pair: Card → PTBooking. Card's ACTIVE→FROZEN transition validity depends on
          PTBooking state (no CONFIRMED PT booking whose scheduled_starts_at falls inside the
          proposed freeze window). Card's own state and CardType budget pass; the cross-entity
          PTBooking state still vetoes.
        test_recipe:
          setup:
            - "Card ACTIVE; CardType.max_freeze_days = 14; cumulative_freeze_days = 0."
            - "PTBooking CONFIRMED on slot with scheduled_starts_at = now() + 3 days."
          trigger:
            - "POST /cards/{id}/freeze {requested_days: 7}"
          assert:
            - "HTTP 409; error_id == 'ERR_FREEZE_CONFLICTS_WITH_BOOKING'."
            - "Card.status remains 'ACTIVE' (transition rejected)."

      - name: pt_booking_blocked_by_inactive_trainer
        grounds:
          - validations[priority=10]
          - state_machines.PTBooking
          - entities.Trainer.fields.status
        distinguishing_aspect: |
          DIFFERENT entity pair: PTBooking → Trainer. PTBooking's create-from-empty transition
          (effectively the CONFIRMED initial-state ingress) validity depends on Trainer.status ==
          ACTIVE. Different entity pair from Card↔PTBooking above.
        test_recipe:
          setup:
            - "Trainer t with status=ACTIVE; create slot."
            - "PATCH /trainers/{t} {status: 'INACTIVE'}."
          trigger:
            - "POST /pt-bookings {member_id, slot_id, billing_mode:'SINGLE'}"
          assert:
            - "HTTP 409; error_id == 'ERR_TRAINER_INACTIVE'."
            - "No PTBooking row created; slot still OPEN."

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: trainer_slot_half_open_adjacent_allowed
        grounds:
          - validations[priority=13]
          - entities.TrainerSlot
        distinguishing_aspect: |
          Resource: TrainerSlot. Interval semantics: half-open [starts_at, ends_at);
          adjacent slots that touch at the endpoint (a.ends_at == b.starts_at) are ALLOWED.
        test_recipe:
          setup:
            - "Trainer t. Slot A: [10:00, 11:00)."
          trigger:
            - "POST /trainer-slots {trainer_id: t, starts_at: 11:00, ends_at: 12:00, ...} (touching A's end)"
            - "POST /trainer-slots {trainer_id: t, starts_at: 10:59, ends_at: 11:30, ...} (1-minute overlap)"
          assert:
            - "1st call: HTTP 201 (adjacent allowed)."
            - "2nd call: HTTP 409, error_id == 'ERR_SLOT_OVERLAP'."

      - name: group_class_30min_buffer_required
        grounds:
          - validations[priority=14]
          - entities.GroupClass
        distinguishing_aspect: |
          DIFFERENT resource (GroupClass) AND different interval semantics: GroupClass requires
          a 30-minute BUFFER between any two SCHEDULED classes for the same instructor —
          adjacent endpoints are REJECTED here, unlike TrainerSlot above. The geometric
          treatment differs (touching endpoint allowed for slots vs disallowed for classes).
        test_recipe:
          setup:
            - "Trainer t. GroupClass A: [10:00, 11:00), instructor_trainer_id=t."
          trigger:
            - "POST /group-classes {instructor_trainer_id: t, starts_at: 11:00, ends_at: 12:00, ...} (touching A's end, no buffer)"
            - "POST /group-classes {instructor_trainer_id: t, starts_at: 11:30, ends_at: 12:30, ...} (exactly 30 min after A's end)"
          assert:
            - "1st call: HTTP 409, error_id == 'ERR_CLASS_OVERLAP' (touching endpoints rejected because 30-min buffer not met)."
            - "2nd call: HTTP 201 (buffer >= 30 min satisfied)."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: card_refund_wallet_principal_invariant
        grounds:
          - state_machines.Card.ACTIVE_to_REFUNDED
          - calculations.remaining_value
          - calculations.wallet_balance_projection
          - entities.WalletTransaction
        distinguishing_aspect: |
          Conserved quantity: Member.wallet_balance_cents (principal bucket only).
          Invariant: AFTER a card refund issued at time t,
            wallet_balance_principal(t+) ==
              wallet_balance_principal(t-) + remaining_value_cents(forward_looking).
          Reverse direction (card never issued) leaves wallet identical to never-debited state
          only when remaining_value at refund == issuance_price (i.e., refund immediately after
          activation with no time elapsed).
        test_recipe:
          setup:
            - "Member with wallet_balance_principal == 200000."
            - "CardType ANN_STD price 120000, validity_days=365, refund_eligibility_days=0, max_freeze_days=0."
            - "Issue+activate card at 2026-01-01 (wallet debited 120000 → 80000)."
            - "Advance clock to 2026-01-01T00:00:01Z (effectively 365 days remaining)."
          trigger:
            - "POST /cards/{id}/refund"
          assert:
            - "remaining_value_cents (forward_looking) == 120000 (round_half_up(120000 * 365/365))."
            - "Final wallet_balance_principal == 200000 (== 80000 + 120000); ZERO drift."
            - "Sum of WalletTransaction.amount_cents for this member, bucket=PRINCIPAL == 200000."

      - name: package_refund_commission_invariant
        grounds:
          - state_machines.PTPackage.ACTIVE_to_REFUNDED
          - calculations.commission_reversal
          - calculations.package_sale_commission
          - entities.CommissionRecord
        distinguishing_aspect: |
          DIFFERENT conserved quantity: trainer's net package commission accrual (per package).
          Invariant: AFTER package refund,
            SUM(CommissionRecord.amount_cents WHERE ref_entity == 'PTPackage:<id>'
                AND kind IN {PACKAGE_SALE, REVERSAL})
            equals the commission attributable ONLY to consumed sessions:
            round_half_up(original_commission * sessions_consumed / total_sessions).
          With consumed=3 of 7 and original=8000: net == 8000 - 4571 == 3429
          and round_half_up(8000 * 3 / 7) == round_half_up(3428.571…) == 3429. Zero drift.
        test_recipe:
          setup:
            - "Trainer t; package_commission_pct_bp=800; PTPackage gross=100000, total_sessions=7."
            - "Complete 3 PTBookings against the package (sessions_consumed=3)."
            - "Snapshot SUM(CommissionRecord.amount_cents where ref_entity==PTPackage:<id>) == 8000 (the PACKAGE_SALE row)."
          trigger:
            - "POST /pt-packages/{id}/refund"
          assert:
            - "New CommissionRecord kind=='REVERSAL', amount_cents == -4571."
            - "SUM(CommissionRecord.amount_cents where ref_entity == 'PTPackage:<pkg_id>' AND kind IN {'PACKAGE_SALE', 'REVERSAL'}) == 3429."
            - "round_half_up(8000 * 3 / 7) == 3429 → invariant holds: net equals commission attributable to consumed sessions only."
