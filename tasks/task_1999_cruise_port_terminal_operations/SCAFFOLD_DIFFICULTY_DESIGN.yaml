            - "st2 == ISSUED (adjustment re-issues) and tot2 == 1805488 == gross - 10000"
            - "st3 == SETTLED and pay3 == 1805488 and adj3 == 10000 (gross == total + adjustments_total: 1815488 == 1805488 + 10000)"
