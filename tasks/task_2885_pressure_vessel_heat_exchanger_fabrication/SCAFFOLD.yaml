# ============================================================================
# PRD Benchmark Scaffold — Pressure Vessel & Heat Exchanger Fabrication
# Sections §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  2885. Pressure Vessel & Heat Exchanger Fabrication (code welding fabrication shop): design
  calculations to the boiler and pressure vessel code with design review and stamping
  authorization, material traceability from mill test reports through fabrication with heat
  number tracking, welding procedure specifications, welder qualification records and
  production weld mapping, nondestructive examination planning with radiography, ultrasonic
  and dye penetrant methods by joint category, hydrostatic or pneumatic testing with
  authorized inspector witness and documentation, post-weld heat treatment scheduling with
  chart records, data package assembly including manufacturer data reports and nameplate
  stamping, shop quality system audits and certificate of authorization renewal

domain_name: pressure-vessel-fabrication

# Peer top-level collections (flat topology): /vessel-jobs, /design-calculations,
# /material-heats, /parts, /wps, /welder-qualifications, /production-welds, /nde-exams,
# /nonconformances, /pwht-batches, /pressure-tests, /data-reports, /certificates,
# /shop-audits, /personnel. No single shared prefix segment.
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  # Peer collections joined by explicit FKs; ProductionWeld is self-referential
  # (repair_of_weld_id) and joins two Parts, each Part joins one MaterialHeat, so the
  # traceability closure heat -> part -> weld -> exam is a directed graph, not a tree.
  state_machine_shape: cyclic
  # DesignCalculation revision loop (DRAFT->SUBMITTED->REJECTED->DRAFT), Nonconformance
  # repair loop, WelderQualification lapse/reinstate loop, VesselJob FABRICATION<->NDE_HOLD,
  # DataReport AI_SIGNED<->STAMP_HOLD; plus parallel dimensions on ProductionWeld
  # (fab_status x nde_status x pwht_status) and compound roll-up on VesselJob.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  # Every computed field is recomputed inside the request that changes any of its inputs
  # and re-evaluated on every read that returns the owning entity.
  difficulty_level: expert
  targets:
    entities: 15
    endpoints: 69
    error_codes: 80
    state_machines: 14

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: CertificateOfAuthorization
    parent: null
    common_fields: true
    fields:
      - name: cert_number
        type: string
        source: input
        description: "Certificate of Authorization number printed on the shop's code stamp certificate."
        constraints: "non-blank; globally unique"
      - name: scope_codes
        type: array
        source: input
        description: "Code stamp scope symbols the shop is authorized to apply."
        constraints: "non-empty array; each member in {U, U2, S, R}; no duplicates"
      - name: issued_on
        type: string
        source: input
        description: "Calendar date the certificate was issued."
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: expires_on
        type: string
        source: input
        description: "Calendar date the certificate expires (inclusive last valid day)."
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be > issued_on"
      - name: status
        type: enum
        source: computed
        description: "Certificate posture. Gates nameplate stamping for every job that names this certificate."
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED, EXPIRED}"
      - name: open_major_findings_count
        type: integer
        source: computed
        description: "Sum of major_finding_count over ShopAudit rows with certificate_id = this id and status = CLOSED, minus the majors cleared by renewals; see calculations.certificate_posture."
        default: 0
      - name: open_minor_findings_count
        type: integer
        source: computed
        description: "Sum of minor_finding_count over ShopAudit rows with certificate_id = this id and status = CLOSED, minus the minors cleared by renewals; see calculations.certificate_posture."
        default: 0
      - name: renewal_count
        type: integer
        source: system
        description: "Number of successful renewals applied to this certificate."
        default: 0
      - name: last_audit_closed_on
        type: string
        source: system
        description: "closed_on of the most recently closed ShopAudit for this certificate (ordered by closed_on ASC, tie-break created_at ASC); null when none closed."
        default: null
      - name: stamping_authorized
        type: boolean
        source: computed
        description: "True only when status = ACTIVE AND expires_on >= current logical UTC date AND open_major_findings_count = 0. Read by every nameplate stamping attempt."
        default: true

  - name: Personnel
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: "Person's full name as it appears on qualification and review records."
        constraints: "non-blank"
      - name: role_code
        type: enum
        source: input
        description: "The single functional role this person may act as. Maps 1:1 onto the §1.7 role that carries X-User-ID = this id."
        constraints: "one of {DESIGN_ENGINEER, WELDING_ENGINEER, QC_INSPECTOR, AUTHORIZED_INSPECTOR}"
      - name: stamp_initials
        type: string
        source: input
        description: "Initials this person applies to reviewed records."
        constraints: "2 to 4 uppercase letters"
      - name: ai_agency
        type: string
        source: input
        description: "Authorized-inspection agency employing the person; required when role_code = AUTHORIZED_INSPECTOR, otherwise must be omitted or null."
        default: null

  - name: ShopAudit
    parent: CertificateOfAuthorization
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> CertificateOfAuthorization.id; the certificate whose quality system this audit examines."
      - name: audit_type
        type: enum
        source: input
        description: "Audit category."
        constraints: "one of {INTERNAL_QMS, JOINT_REVIEW, TRIENNIAL_RENEWAL}"
      - name: scheduled_date
        type: string
        source: input
        description: "Calendar date the audit is scheduled for."
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: closed_on
        type: string
        source: input
        description: "Calendar date the audit was closed out; set by the close transition."
        default: null
      - name: findings
        type: array
        source: input
        description: "Finding objects recorded at close: { finding_code: string, severity: MAJOR|MINOR|OBSERVATION, clause_reference: string }. Empty array means a clean audit."
        default: []
      - name: major_finding_count
        type: integer
        source: computed
        description: "count of findings where severity = MAJOR."
        default: 0
      - name: minor_finding_count
        type: integer
        source: computed
        description: "count of findings where severity = MINOR. OBSERVATION findings are counted in neither."
        default: 0
      - name: satisfactory
        type: boolean
        source: computed
        description: "True when status = CLOSED AND major_finding_count = 0 AND minor_finding_count <= 5. Precondition for using this audit as a renewal basis."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Audit lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CLOSED}"

  - name: VesselJob
    parent: CertificateOfAuthorization
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> CertificateOfAuthorization.id; the code stamp authority under which this vessel is built."
      - name: job_number
        type: string
        source: input
        description: "Shop job number."
        constraints: "non-blank; globally unique"
      - name: customer_name
        type: string
        source: input
        description: "Purchaser named on the manufacturer's data report."
        constraints: "non-blank"
      - name: vessel_type
        type: enum
        source: input
        description: "Product form; drives required_components and required_test_sides."
        constraints: "one of {PRESSURE_VESSEL, HEAT_EXCHANGER}"
      - name: design_code
        type: enum
        source: input
        description: "Construction code division; DIV2 forces 100 percent volumetric examination on category A and B joints."
        constraints: "one of {DIV1, DIV2}"
      - name: mawp_psi
        type: number
        source: input
        description: "Maximum allowable working pressure in psi; the P term of every design and test-pressure formula."
        constraints: "> 0; <= 5000"
      - name: design_temp_f
        type: number
        source: input
        description: "Design temperature in degrees Fahrenheit."
        constraints: "> -60; <= 1000"
      - name: mdmt_f
        type: number
        source: input
        description: "Minimum design metal temperature in degrees Fahrenheit; floor for pressure-test medium temperature."
        constraints: ">= -155; < design_temp_f"
      - name: inside_radius_in
        type: number
        source: input
        description: "Inside radius in inches; the R term of the wall thickness formulas."
        constraints: "> 0"
      - name: stress_ratio
        type: number
        source: input
        description: "Ratio of allowable stress at test temperature to allowable stress at design temperature; multiplier in the test-pressure formula."
        default: 1.00
        constraints: ">= 0.50; <= 1.00; 2 decimal places"
      - name: pneumatic_justification
        type: string
        source: input
        description: "Written justification for substituting a pneumatic test for a hydrostatic test; must be non-blank before any PNEUMATIC PressureTest may be scheduled."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Job lifecycle posture; gates design, fabrication, examination, testing, and stamping operations on all child rows."
        default: DRAFT
        constraints: "one of {DRAFT, DESIGN_REVIEW, FAB_PLANNING, FABRICATION, NDE_HOLD, TESTING, DATA_PACKAGE, STAMPED, CANCELLED}"
      - name: required_components
        type: array
        source: computed
        description: "Design components that must each carry an APPROVED DesignCalculation: [SHELL, HEAD] when vessel_type = PRESSURE_VESSEL, [SHELL, HEAD, TUBESHEET] when vessel_type = HEAT_EXCHANGER."
      - name: required_test_sides
        type: array
        source: computed
        description: "Pressure-test sides that must each reach result = PASS: [SHELL_SIDE] when vessel_type = PRESSURE_VESSEL, [SHELL_SIDE, TUBE_SIDE] when vessel_type = HEAT_EXCHANGER."
      - name: governing_joint_efficiency
        type: number
        source: computed
        description: "Minimum joint_efficiency over DesignCalculation rows with job_id = this id and status = APPROVED; null when no APPROVED calculation exists."
        default: null
      - name: nonconformance_open_count
        type: integer
        source: computed
        description: "count of Nonconformance rows with job_id = this id and disposition IN {OPEN, REPAIR, USE_AS_IS}. Reaching 0 releases the NDE_HOLD."
        default: 0
      - name: weld_completion_pct
        type: number
        source: computed
        description: "Percentage of the weld map that is finished; see calculations.weld_completion_pct."
        default: 0.00
      - name: design_release_at
        type: datetime
        source: system
        description: "Logical UTC instant the job entered FAB_PLANNING; null before that."
        default: null

  - name: DesignCalculation
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> VesselJob.id; the job this calculation sheet belongs to."
      - name: component
        type: enum
        source: input
        description: "Pressure part this sheet sizes."
        constraints: "one of {SHELL, HEAD, TUBESHEET, NOZZLE}"
      - name: revision
        type: integer
        source: system
        description: "Revision index for this (job_id, component) pair: 1 for the first sheet, prior_revision + 1 for each superseding sheet."
        default: 1
      - name: rt_extent_declared
        type: enum
        source: input
        description: "Radiographic examination extent the designer elects to claim; the sole input from which joint_efficiency is resolved."
        constraints: "one of {FULL, SPOT, NONE}"
      - name: joint_efficiency
        type: number
        source: computed
        description: "Joint efficiency E resolved from rt_extent_declared; see calculations.joint_efficiency_resolution."
      - name: allowable_stress_psi
        type: number
        source: input
        description: "Maximum allowable stress S for the base metal at design temperature, in psi."
        constraints: "> 0; <= 30000"
      - name: corrosion_allowance_in
        type: number
        source: input
        description: "Corrosion allowance in inches added on top of the governing computed thickness."
        constraints: ">= 0; <= 0.5000; 4 decimal places"
      - name: thickness_nominal_in
        type: number
        source: input
        description: "Nominal wall thickness the shop intends to use, in inches; must be >= thickness_required_in."
        constraints: "> 0; 4 decimal places"
      - name: thickness_circumferential_in
        type: number
        source: computed
        description: "Thickness demanded by the circumferential-stress (longitudinal joint) variant, rounded HALF_UP to 4 decimals; reported only."
      - name: thickness_longitudinal_in
        type: number
        source: computed
        description: "Thickness demanded by the longitudinal-stress (circumferential joint) variant, rounded HALF_UP to 4 decimals; reported only."
      - name: thickness_required_in
        type: number
        source: computed
        description: "Code-required thickness; see calculations.required_wall_thickness."
      - name: governing_variant
        type: enum
        source: computed
        description: "Which stress variant governed; see calculations.required_wall_thickness."
        constraints: "one of {CIRCUMFERENTIAL, LONGITUDINAL}"
      - name: status
        type: enum
        source: computed
        description: "Calculation sheet lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED}"
      - name: prepared_by_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the DESIGN_ENGINEER whose X-User-ID created this sheet."
      - name: reviewed_by_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the DESIGN_ENGINEER whose X-User-ID approved or rejected this sheet; null until reviewed."
        default: null
      - name: reject_reason
        type: string
        source: input
        description: "Reviewer's reason recorded on rejection; null otherwise."
        default: null

  - name: MaterialHeat
    parent: null
    common_fields: true
    fields:
      - name: heat_number
        type: string
        source: input
        description: "Mill heat number stamped on the material and printed on the mill test report."
        constraints: "non-blank; globally unique"
      - name: spec
        type: enum
        source: input
        description: "Material specification."
        constraints: "one of {SA-516-70, SA-240-304L, SA-105, SA-179}"
      - name: form
        type: enum
        source: input
        description: "Product form received."
        constraints: "one of {PLATE, FORGING, PIPE, TUBE}"
      - name: material_class
        type: enum
        source: computed
        description: "FERRITIC for spec IN {SA-516-70, SA-105, SA-179}; AUSTENITIC for spec = SA-240-304L. Selects MT versus PT as the surface examination method."
        constraints: "one of {FERRITIC, AUSTENITIC}"
      - name: p_number
        type: integer
        source: computed
        description: "Base-metal P-Number: 1 for spec IN {SA-516-70, SA-105, SA-179}, 8 for spec = SA-240-304L. Must equal the WPS base_metal_p_number of any weld consuming this heat."
      - name: mtr_received
        type: boolean
        source: input
        description: "True when the mill test report has been received and filed."
        default: false
      - name: mtr_certified_yield_ksi
        type: number
        source: input
        description: "Certified yield strength from the mill test report, in ksi; null until the MTR is on file."
        default: null
      - name: mtr_certified_tensile_ksi
        type: number
        source: input
        description: "Certified tensile strength from the mill test report, in ksi; null until the MTR is on file."
        default: null
      - name: quantity_received_lb
        type: number
        source: input
        description: "Pounds of this heat received into the shop."
        constraints: "> 0; 2 decimal places"
      - name: quantity_issued_lb
        type: number
        source: computed
        description: "Pounds currently issued out of this heat; see calculations.material_balance."
        default: 0.00
      - name: quantity_remaining_lb
        type: number
        source: computed
        description: "Pounds still available; see calculations.material_balance."
      - name: status
        type: enum
        source: computed
        description: "Receiving-inspection and consumption posture."
        default: QUARANTINE
        constraints: "one of {QUARANTINE, ACCEPTED, REJECTED, DEPLETED}"

  - name: Part
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> VesselJob.id; the job this piece is cut for."
      - name: heat_id
        type: string
        source: input
        description: "FK -> MaterialHeat.id; the heat lot the piece was cut from. The traceability link that carries the heat number into fabrication."
      - name: part_mark
        type: string
        source: input
        description: "Hard stamp mark applied to the piece."
        constraints: "non-blank; unique within job_id"
      - name: component_type
        type: enum
        source: input
        description: "Which pressure part this piece becomes."
        constraints: "one of {SHELL, HEAD, TUBESHEET, NOZZLE, FLANGE}"
      - name: issued_quantity_lb
        type: number
        source: input
        description: "Pounds drawn from heat_id for this piece."
        constraints: "> 0; 2 decimal places; <= heat.quantity_remaining_lb at issue time"
      - name: heat_traceability_complete
        type: boolean
        source: computed
        description: "True when the referenced heat has mtr_received = true AND status IN {ACCEPTED, DEPLETED}. Consumed by the weld-map release gate and by the MATERIAL section of the data package score."
      - name: status
        type: enum
        source: computed
        description: "Piece posture. SCRAPPED pieces return their pounds to the heat and leave the traceability denominator."
        default: ISSUED
        constraints: "one of {ISSUED, SCRAPPED}"
      - name: scrap_reason
        type: string
        source: input
        description: "Reason recorded when the piece is scrapped; null otherwise."
        default: null

  - name: WPS
    parent: null
    common_fields: true
    fields:
      - name: wps_number
        type: string
        source: input
        description: "Welding procedure specification number."
        constraints: "non-blank; globally unique"
      - name: process
        type: enum
        source: input
        description: "Welding process."
        constraints: "one of {SMAW, GTAW, SAW, FCAW}"
      - name: base_metal_p_number
        type: integer
        source: input
        description: "Base-metal P-Number the procedure is qualified for; must equal the p_number of both heats feeding a weld that cites this procedure."
        constraints: "one of {1, 8}"
      - name: filler_f_number
        type: integer
        source: input
        description: "Filler-metal F-Number."
        constraints: ">= 1; <= 6"
      - name: thickness_min_in
        type: number
        source: input
        description: "Minimum base-metal thickness qualified by the supporting PQR, in inches."
        constraints: "> 0; 4 decimal places"
      - name: thickness_max_in
        type: number
        source: input
        description: "Maximum base-metal thickness qualified by the supporting PQR, in inches."
        constraints: "> thickness_min_in; 4 decimal places"
      - name: position
        type: enum
        source: input
        description: "Welding position qualified."
        constraints: "one of {1G, 2G, 3G, 4G, 5G, 6G}"
      - name: pwht_required
        type: boolean
        source: input
        description: "True when every production weld made to this procedure must be post-weld heat treated."
      - name: preheat_min_f
        type: number
        source: input
        description: "Minimum preheat temperature in degrees Fahrenheit."
        constraints: ">= 32"
      - name: supporting_pqr_number
        type: string
        source: input
        description: "Procedure qualification record supporting this WPS."
        constraints: "non-blank"
      - name: status
        type: enum
        source: computed
        description: "Procedure posture; only QUALIFIED procedures may be cited by a weld map entry."
        default: DRAFT
        constraints: "one of {DRAFT, QUALIFIED}"

  - name: WelderQualification
    parent: WPS
    common_fields: true
    fields:
      - name: welder_stamp
        type: string
        source: input
        description: "Welder's assigned stamp mark."
        constraints: "non-blank; globally unique"
      - name: welder_name
        type: string
        source: input
        description: "Welder's full name."
        constraints: "non-blank"
      - name: wps_id
        type: string
        source: input
        description: "FK -> WPS.id; the procedure this welder is qualified to."
      - name: position_qualified
        type: enum
        source: input
        description: "Position the performance test qualified."
        constraints: "one of {1G, 2G, 3G, 4G, 5G, 6G}"
      - name: thickness_range_max_in
        type: number
        source: input
        description: "Maximum base-metal thickness this welder is qualified to deposit, in inches."
        constraints: "> 0; 4 decimal places"
      - name: qualified_on
        type: string
        source: input
        description: "Calendar date the performance qualification test was passed."
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: last_continuity_date
        type: string
        source: computed
        description: "Most recent date on which this welder used the process, initialized to qualified_on and advanced by each continuity log entry."
      - name: days_since_continuity
        type: integer
        source: computed
        description: "Whole days from last_continuity_date to the current logical UTC date; see calculations.welder_continuity_status."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Performance qualification posture; only QUALIFIED welders may be recorded against a production weld."
        default: QUALIFIED
        constraints: "one of {QUALIFIED, LAPSED}"

  - name: ProductionWeld
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> VesselJob.id; the job whose weld map carries this joint."
      - name: weld_number
        type: string
        source: input
        description: "Weld map identifier. Also the deterministic ordering key for examination planning."
        constraints: "non-blank; unique within job_id; ordered lexicographically ASC for selection"
      - name: joint_category
        type: enum
        source: input
        description: "Code joint category: A = longitudinal/main shell and head seams, B = circumferential shell seams, C = flange and tubesheet attachment, D = nozzle-to-shell attachment."
        constraints: "one of {A, B, C, D}"
      - name: joint_type
        type: enum
        source: input
        description: "Geometry of the joint."
        constraints: "one of {BUTT, CORNER, FILLET}"
      - name: thickness_in
        type: number
        source: input
        description: "Base-metal thickness at the joint, in inches."
        constraints: "> 0; 4 decimal places"
      - name: wps_id
        type: string
        source: input
        description: "FK -> WPS.id; the welding procedure specification cited for this joint."
      - name: part_a_id
        type: string
        source: input
        description: "FK -> Part.id; first piece joined."
      - name: part_b_id
        type: string
        source: input
        description: "FK -> Part.id; second piece joined; null for an attachment weld made to a single piece."
        default: null
      - name: welder_qualification_id
        type: string
        source: input
        description: "FK -> WelderQualification.id; the welder performance record in force when the joint was deposited; null while fab_status = PLANNED."
        default: null
      - name: repair_of_weld_id
        type: string
        source: system
        description: "FK -> ProductionWeld.id; the rejected joint this joint repairs; null for an original joint."
        default: null
      - name: repair_generation
        type: integer
        source: system
        description: "0 for an original joint, parent repair_generation + 1 for a repair joint. Capped at 2."
        default: 0
      - name: pwht_batch_id
        type: string
        source: system
        description: "FK -> PWHTBatch.id; the heat-treatment batch this joint was loaded into; null until scheduled."
        default: null
      - name: welded_at
        type: datetime
        source: input
        description: "Logical UTC instant the joint was completed; null while fab_status = PLANNED."
        default: null
      - name: fab_status
        type: enum
        source: computed
        description: "Fabrication dimension of this joint's state; evolves independently of nde_status and pwht_status."
        default: PLANNED
        constraints: "one of {PLANNED, WELDED}"
      - name: nde_status
        type: enum
        source: computed
        description: "Examination dimension of this joint's state; evolves independently of fab_status and pwht_status and may cycle REJECTED -> PLANNED -> ACCEPTED."
        default: NOT_PLANNED
        constraints: "one of {NOT_PLANNED, PLANNED, ACCEPTED, REJECTED}"
      - name: pwht_status
        type: enum
        source: computed
        description: "Heat-treatment dimension of this joint's state; initialized to PENDING when the cited WPS has pwht_required = true, otherwise NOT_REQUIRED."
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, PENDING, IN_PROGRESS, COMPLETE}"
      - name: required_volumetric_pct
        type: number
        source: computed
        description: "Volumetric examination coverage this joint owes, in percent; see calculations.nde_coverage_requirement."
        default: 0
      - name: volumetric_method
        type: enum
        source: computed
        description: "RT or UT when required_volumetric_pct > 0, else null; see calculations.nde_coverage_requirement."
        default: null
        constraints: "one of {RT, UT} or null"
      - name: required_surface_method
        type: enum
        source: computed
        description: "MT or PT when a surface examination is owed, else null; see calculations.nde_coverage_requirement."
        default: null
        constraints: "one of {MT, PT} or null"

  - name: NDEExam
    parent: ProductionWeld
    common_fields: true
    fields:
      - name: weld_id
        type: string
        source: system
        description: "FK -> ProductionWeld.id; the joint examined."
      - name: method
        type: enum
        source: system
        description: "Examination method assigned by the plan."
        constraints: "one of {RT, UT, PT, MT}"
      - name: exam_class
        type: enum
        source: computed
        description: "VOLUMETRIC when method IN {RT, UT}, SURFACE when method IN {PT, MT}."
        constraints: "one of {VOLUMETRIC, SURFACE}"
      - name: required_coverage_pct
        type: number
        source: system
        description: "Minimum percentage of the joint that must be examined; copied from the weld's required_volumetric_pct for a VOLUMETRIC exam, 100 for a SURFACE exam."
      - name: examined_coverage_pct
        type: number
        source: input
        description: "Percentage actually examined, reported when the result is recorded; null while PENDING."
        default: null
        constraints: ">= 0; <= 100; 2 decimal places"
      - name: indications_count
        type: integer
        source: input
        description: "Number of rejectable indications found; null while PENDING."
        default: null
        constraints: ">= 0"
      - name: result
        type: enum
        source: computed
        description: "Examination outcome."
        default: PENDING
        constraints: "one of {PENDING, ACCEPT, REJECT}"
      - name: examiner_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the QC_INSPECTOR whose X-User-ID recorded the result; null while PENDING."
        default: null
      - name: exam_date
        type: string
        source: input
        description: "Calendar date of the examination; null while PENDING."
        default: null

  - name: Nonconformance
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: system
        description: "FK -> VesselJob.id; the job the nonconformance is charged to."
      - name: weld_id
        type: string
        source: system
        description: "FK -> ProductionWeld.id; the joint that failed; null when the nonconformance is charged to the pressure test rather than a joint."
        default: null
      - name: ncr_number
        type: string
        source: system
        description: "Report number minted as NCR-<job_number>-<seq>, where seq is the count of pre-existing Nonconformance rows for the job plus one, zero-padded to 3 digits."
      - name: source
        type: enum
        source: system
        description: "What opened the report."
        constraints: "one of {NDE_REJECT, PRESSURE_TEST_FAIL}"
      - name: severity
        type: enum
        source: computed
        description: "MAJOR when source = PRESSURE_TEST_FAIL or the failed joint's joint_category IN {A, B}; MINOR otherwise."
        constraints: "one of {MAJOR, MINOR}"
      - name: disposition
        type: enum
        source: computed
        description: "Engineering disposition; OPEN, REPAIR and USE_AS_IS all count against the job's nonconformance_open_count."
        default: OPEN
        constraints: "one of {OPEN, REPAIR, USE_AS_IS, CLOSED}"
      - name: ai_concurrence_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the AUTHORIZED_INSPECTOR whose X-User-ID concurred with a USE_AS_IS disposition; null otherwise."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical UTC instant the report was closed; null while open."
        default: null

  - name: PWHTBatch
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> VesselJob.id; the job whose joints are loaded into this furnace charge."
      - name: furnace_code
        type: enum
        source: input
        description: "Furnace the charge occupies; the resource whose schedule must not be double-booked."
        constraints: "one of {FURNACE_A, FURNACE_B}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Logical UTC instant the charge enters the furnace."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Logical UTC instant the charge leaves the furnace."
        constraints: "> scheduled_start"
      - name: soak_temp_f
        type: number
        source: input
        description: "Holding temperature in degrees Fahrenheit."
        constraints: ">= 500; <= 1600"
      - name: weld_count
        type: integer
        source: computed
        description: "count of ProductionWeld rows with pwht_batch_id = this id."
      - name: governing_thickness_in
        type: number
        source: computed
        description: "max thickness_in over ProductionWeld rows with pwht_batch_id = this id."
      - name: required_soak_minutes
        type: integer
        source: computed
        description: "Minimum holding time; see calculations.pwht_soak_requirement."
      - name: actual_soak_minutes
        type: integer
        source: input
        description: "Holding time read off the chart record; null until the charge is completed."
        default: null
        constraints: ">= 0"
      - name: chart_record_number
        type: string
        source: input
        description: "Identifier of the time-temperature chart filed for this charge; null until completed."
        default: null
      - name: chart_uploaded
        type: boolean
        source: input
        description: "True when the chart record is filed in the data package."
        default: false
      - name: scheduled_by_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the WELDING_ENGINEER whose X-User-ID scheduled the charge."
      - name: chart_reviewed_by_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the WELDING_ENGINEER whose X-User-ID reviewed the chart at completion; must differ from scheduled_by_personnel_id."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Furnace charge lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETE, ABORTED}"

  - name: PressureTest
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> VesselJob.id; the vessel under test."
      - name: test_side
        type: enum
        source: input
        description: "Which pressure boundary is tested; must be a member of the job's required_test_sides."
        constraints: "one of {SHELL_SIDE, TUBE_SIDE}"
      - name: test_type
        type: enum
        source: input
        description: "Test medium class."
        constraints: "one of {HYDROSTATIC, PNEUMATIC}"
      - name: test_bay_code
        type: enum
        source: input
        description: "Test bay the vessel occupies; the resource whose occupancy is capacity-limited."
        constraints: "one of {BAY_1, BAY_2}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Logical UTC instant the vessel occupies the bay."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Logical UTC instant the vessel leaves the bay."
        constraints: "> scheduled_start"
      - name: test_pressure_psi
        type: number
        source: computed
        description: "Required test pressure; see calculations.test_pressure."
      - name: min_hold_minutes
        type: integer
        source: computed
        description: "30 when test_type = HYDROSTATIC, 60 when test_type = PNEUMATIC."
      - name: min_medium_temp_f
        type: number
        source: computed
        description: "job.mdmt_f + 30 when test_type = HYDROSTATIC, job.mdmt_f + 60 when test_type = PNEUMATIC."
      - name: test_medium_temp_f
        type: number
        source: input
        description: "Temperature of the test medium in degrees Fahrenheit; must be >= min_medium_temp_f."
      - name: observed_hold_minutes
        type: integer
        source: input
        description: "Hold time observed by the authorized inspector; null while PENDING."
        default: null
        constraints: ">= 0"
      - name: observed_pressure_psi
        type: number
        source: input
        description: "Peak pressure observed; null while PENDING."
        default: null
        constraints: ">= 0; 1 decimal place"
      - name: witnessed_by_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the AUTHORIZED_INSPECTOR whose X-User-ID confirmed the witness; null until witnessed."
        default: null
      - name: ai_witness_confirmed
        type: boolean
        source: computed
        description: "True once an authorized inspector has confirmed the witness for this test."
        default: false
      - name: result
        type: enum
        source: computed
        description: "Test outcome."
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"

  - name: DataReport
    parent: VesselJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> VesselJob.id; the vessel this manufacturer's data report documents."
      - name: form_type
        type: enum
        source: input
        description: "Data report form."
        constraints: "one of {U-1A, U-1, U-2A}"
      - name: mdr_number
        type: string
        source: system
        description: "Minted as MDR-<job_number>-<seq>, where seq is the count of pre-existing DataReport rows for the job plus one, zero-padded to 2 digits."
      - name: section_scores
        type: object
        source: computed
        description: "Per-section weighted points keyed DESIGN, MATERIAL, WELDING, NDE, PWHT, TEST; see calculations.data_package_completeness."
      - name: completeness_score
        type: number
        source: computed
        description: "Total data package completeness in points out of 100; see calculations.data_package_completeness."
        default: 0.00
      - name: missing_items
        type: array
        source: computed
        description: "Section codes whose fraction is below 1, plus the literal OPEN_NONCONFORMANCE when the job's nonconformance_open_count > 0; ordered DESIGN, MATERIAL, WELDING, NDE, PWHT, TEST, OPEN_NONCONFORMANCE."
        default: []
      - name: assembled_by_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the QC_INSPECTOR whose X-User-ID opened the package."
      - name: ai_personnel_id
        type: string
        source: system
        description: "FK -> Personnel.id; the AUTHORIZED_INSPECTOR whose X-User-ID signed the data report; null until signed."
        default: null
      - name: ai_signed_at
        type: datetime
        source: system
        description: "Logical UTC instant the authorized inspector signed; null until signed."
        default: null
      - name: nameplate_serial
        type: string
        source: input
        description: "Serial applied to the nameplate at stamping; null until stamped."
        default: null
      - name: nameplate_stamped_at
        type: datetime
        source: system
        description: "Logical UTC instant the nameplate was stamped; null until stamped."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Data package lifecycle; STAMP_HOLD is entered when the certificate loses stamping authority after the report was signed."
        default: ASSEMBLING
        constraints: "one of {ASSEMBLING, READY_FOR_AI, AI_SIGNED, STAMP_HOLD, STAMPED, VOIDED}"

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  - entity: CertificateOfAuthorization
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: POST /shop-audits/{audit_id}/close closes an audit whose major_finding_count = 1 or 2, or whose minor_finding_count > 5"
        actor: system
        preconditions: ["certificate.status = ACTIVE", "audit.certificate_id = certificate.id"]
        side_effects:
          - "open_major_findings_count += audit.major_finding_count"
          - "open_minor_findings_count += audit.minor_finding_count"
          - "last_audit_closed_on = audit.closed_on"
          - "stamping_authorized recomputed to false"
          - "cascade link 3: every DataReport whose job.certificate_id = this id and whose status = AI_SIGNED transitions to STAMP_HOLD"
          - "version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /shop-audits/{audit_id}/close closes an audit whose major_finding_count >= 3"
        actor: system
        preconditions: ["certificate.status = ACTIVE"]
        side_effects:
          - "open_major_findings_count += audit.major_finding_count"
          - "open_minor_findings_count += audit.minor_finding_count"
          - "last_audit_closed_on = audit.closed_on"
          - "stamping_authorized recomputed to false"
          - "cascade link 3: every DataReport whose job.certificate_id = this id and whose status = AI_SIGNED transitions to STAMP_HOLD"
          - "version += 1"
        note: "Boundary: exactly 3 majors suspends; 2 majors only puts the certificate on probation."
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: POST /shop-audits/{audit_id}/close pushes cumulative open_major_findings_count to >= 3"
        actor: system
        preconditions: ["certificate.status = PROBATION"]
        side_effects: ["open_major_findings_count += audit.major_finding_count", "stamping_authorized stays false", "version += 1"]
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /certificates/{certificate_id}/renewals"
        actor: ShopAdmin
        preconditions:
          - "expected_certificate_version matches certificate.version"
          - "renewal_audit_id names a ShopAudit with certificate_id = this id, status = CLOSED and satisfactory = true"
          - "new_expires_on > current logical UTC date"
        side_effects:
          - "expires_on = new_expires_on"
          - "open_major_findings_count = 0; open_minor_findings_count = 0"
          - "renewal_count += 1"
          - "stamping_authorized recomputed to true"
          - "cascade: every DataReport whose job.certificate_id = this id and whose status = STAMP_HOLD returns to AI_SIGNED"
          - "version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /certificates/{certificate_id}/renewals"
        actor: ShopAdmin
        preconditions:
          - "expected_certificate_version matches certificate.version"
          - "renewal_audit_id names a ShopAudit with certificate_id = this id, status = CLOSED and satisfactory = true"
        side_effects:
          - "expires_on = new_expires_on"
          - "open_major_findings_count = 0; open_minor_findings_count = 0"
          - "renewal_count += 1"
          - "stamping_authorized recomputed to true"
          - "cascade: every DataReport whose job.certificate_id = this id and whose status = STAMP_HOLD returns to AI_SIGNED"
          - "version += 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /certificates/{certificate_id}/renewals"
        actor: ShopAdmin
        preconditions:
          - "expected_certificate_version matches certificate.version"
          - "renewal_audit_id names a satisfactory CLOSED ShopAudit for this certificate"
          - "new_expires_on > current logical UTC date"
        side_effects: ["expires_on = new_expires_on", "renewal_count += 1", "stamping_authorized recomputed to true", "version += 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past expires_on"
        actor: system
        preconditions: ["expires_on < current logical UTC date after the clock move"]
        side_effects:
          - "stamping_authorized recomputed to false"
          - "every DataReport whose job.certificate_id = this id and whose status = AI_SIGNED transitions to STAMP_HOLD"
          - "version += 1"
      - from: PROBATION
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock past expires_on"
        actor: system
        preconditions: ["expires_on < current logical UTC date after the clock move"]
        side_effects: ["stamping_authorized stays false", "version += 1"]

  - entity: ShopAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /shop-audits/{audit_id}/close"
        actor: ShopAdmin
        preconditions: ["audit.status = SCHEDULED", "closed_on >= scheduled_date"]
        side_effects:
          - "findings = request findings array; major_finding_count and minor_finding_count recomputed"
          - "satisfactory recomputed"
          - "cascade link 1: the parent CertificateOfAuthorization absorbs the findings and re-derives status and stamping_authorized"
          - "version += 1"

  - entity: VesselJob
    initial_state: DRAFT
    terminal_states: [STAMPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DESIGN_REVIEW
        trigger: "system: POST /design-calculations/{calculation_id}/submit on any calculation of this job"
        actor: system
        preconditions: ["job.status = DRAFT"]
        side_effects: ["version += 1"]
      - from: DESIGN_REVIEW
        to: DRAFT
        trigger: "system: POST /design-calculations/{calculation_id}/reject on any calculation of this job"
        actor: system
        preconditions: ["job.status = DESIGN_REVIEW"]
        side_effects: ["governing_joint_efficiency recomputed", "version += 1"]
        note: "Revision loop: the job cycles DRAFT -> DESIGN_REVIEW -> DRAFT until every required component is approved."
      - from: DESIGN_REVIEW
        to: FAB_PLANNING
        trigger: "system: POST /design-calculations/{calculation_id}/approve makes the last required component APPROVED"
        actor: system
        preconditions: ["every component in job.required_components has exactly one DesignCalculation with status = APPROVED"]
        side_effects:
          - "design_release_at = current logical UTC instant"
          - "governing_joint_efficiency recomputed as the minimum joint_efficiency over APPROVED calculations"
          - "version += 1"
      - from: DESIGN_REVIEW
        to: DRAFT
        trigger: "system: POST /vessel-jobs/{job_id}/design-calculations creates a superseding revision"
        actor: system
        preconditions: ["job.status = DESIGN_REVIEW"]
        side_effects: ["prior APPROVED or SUBMITTED sheet for that component becomes SUPERSEDED", "governing_joint_efficiency recomputed", "version += 1"]
      - from: FAB_PLANNING
        to: DRAFT
        trigger: "system: POST /vessel-jobs/{job_id}/design-calculations creates a superseding revision"
        actor: system
        preconditions: ["job.status = FAB_PLANNING"]
        side_effects:
          - "prior APPROVED sheet for that component becomes SUPERSEDED"
          - "design_release_at = null"
          - "governing_joint_efficiency recomputed"
          - "version += 1"
      - from: FAB_PLANNING
        to: FABRICATION
        trigger: "POST /vessel-jobs/{job_id}/weld-map-release"
        actor: WeldingEngineer
        preconditions:
          - "job.status = FAB_PLANNING"
          - "at least one ProductionWeld exists for the job"
          - "every Part with job_id = job.id and status = ISSUED has heat_traceability_complete = true"
          - "when governing_joint_efficiency = 1.00, every ProductionWeld with joint_category = A has joint_type = BUTT"
          - "every ProductionWeld's thickness_in lies within [wps.thickness_min_in, wps.thickness_max_in]"
        side_effects: ["version += 1"]
      - from: FABRICATION
        to: NDE_HOLD
        trigger: "system: a Nonconformance is opened against this job"
        actor: system
        preconditions: ["job.status = FABRICATION"]
        side_effects:
          - "nonconformance_open_count recomputed (+1)"
          - "cascade link 4: every DataReport with job_id = this id re-derives missing_items to include OPEN_NONCONFORMANCE and re-derives completeness_score"
          - "version += 1"
      - from: NDE_HOLD
        to: FABRICATION
        trigger: "system: POST /nonconformances/{nonconformance_id}/close drives nonconformance_open_count to 0"
        actor: system
        preconditions: ["job.status = NDE_HOLD", "nonconformance_open_count = 0 after the close"]
        side_effects:
          - "every DataReport with job_id = this id re-derives missing_items (OPEN_NONCONFORMANCE removed) and completeness_score"
          - "version += 1"
      - from: TESTING
        to: NDE_HOLD
        trigger: "system: POST /pressure-tests/{test_id}/result records result = FAIL"
        actor: system
        preconditions: ["job.status = TESTING"]
        side_effects:
          - "a Nonconformance with source = PRESSURE_TEST_FAIL, severity = MAJOR, disposition = OPEN is created"
          - "nonconformance_open_count recomputed (+1)"
          - "version += 1"
      - from: FABRICATION
        to: TESTING
        trigger: "POST /pressure-tests"
        actor: QCInspector
        preconditions:
          - "job.status = FABRICATION"
          - "every ProductionWeld of the job has fab_status = WELDED"
          - "every ProductionWeld of the job has nde_status = ACCEPTED, or nde_status = NOT_PLANNED with required_volumetric_pct = 0 and required_surface_method = null"
          - "every ProductionWeld with pwht_status != NOT_REQUIRED has pwht_status = COMPLETE"
          - "nonconformance_open_count = 0"
        side_effects: ["version += 1"]
      - from: TESTING
        to: TESTING
        trigger: "POST /pressure-tests"
        actor: QCInspector
        preconditions:
          - "job.status = TESTING"
          - "no PressureTest of the job with the same test_side has result = PENDING"
          - "test_side is a member of job.required_test_sides"
        side_effects:
          - "version += 1"
        note: "A heat exchanger owes a shell-side and a tube-side test, so a second test may be scheduled while the job is already TESTING; the same side may not have two pending tests at once."
      - from: TESTING
        to: DATA_PACKAGE
        trigger: "system: POST /pressure-tests/{test_id}/result makes the latest test of every required_test_sides member PASS"
        actor: system
        preconditions: ["for every side in job.required_test_sides, the PressureTest with that test_side and the greatest created_at has result = PASS"]
        side_effects: ["every DataReport with job_id = this id re-derives its TEST section score", "version += 1"]
      - from: DATA_PACKAGE
        to: STAMPED
        trigger: "system: POST /data-reports/{report_id}/stamp-nameplate"
        actor: system
        preconditions: ["job.status = DATA_PACKAGE", "the data report reached STAMPED"]
        side_effects: ["version += 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects: ["cascade: see the DESIGN_REVIEW -> CANCELLED entry; identical effect set", "version += 1"]
      - from: DESIGN_REVIEW
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects:
          - "every DesignCalculation of the job with status IN {DRAFT, SUBMITTED, APPROVED} becomes SUPERSEDED"
          - "every Part of the job with status = ISSUED becomes SCRAPPED with scrap_reason = JOB_CANCELLED, returning issued_quantity_lb to its heat (heat.quantity_remaining_lb recomputed; a DEPLETED heat returns to ACCEPTED)"
          - "every PWHTBatch of the job with status IN {SCHEDULED, IN_PROGRESS} becomes ABORTED"
          - "every Nonconformance of the job with disposition IN {OPEN, REPAIR, USE_AS_IS} becomes CLOSED with closed_at = current logical UTC instant"
          - "every DataReport of the job with status IN {ASSEMBLING, READY_FOR_AI, AI_SIGNED, STAMP_HOLD} becomes VOIDED"
          - "nonconformance_open_count recomputed to 0"
          - "version += 1"
      - from: FAB_PLANNING
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects: ["identical cascade to the DESIGN_REVIEW -> CANCELLED entry", "version += 1"]
      - from: FABRICATION
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects: ["identical cascade to the DESIGN_REVIEW -> CANCELLED entry", "version += 1"]
      - from: NDE_HOLD
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects: ["identical cascade to the DESIGN_REVIEW -> CANCELLED entry", "version += 1"]
      - from: TESTING
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects: ["identical cascade to the DESIGN_REVIEW -> CANCELLED entry", "version += 1"]
      - from: DATA_PACKAGE
        to: CANCELLED
        trigger: "POST /vessel-jobs/{job_id}/cancel"
        actor: ShopAdmin
        preconditions: ["job.status NOT IN {STAMPED, CANCELLED}"]
        side_effects: ["identical cascade to the DESIGN_REVIEW -> CANCELLED entry", "version += 1"]

  - entity: DesignCalculation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /design-calculations/{calculation_id}/submit"
        actor: DesignEngineer
        preconditions:
          - "calculation.status = DRAFT"
          - "job.status IN {DRAFT, DESIGN_REVIEW}"
          - "thickness_nominal_in >= thickness_required_in"
        side_effects: ["cascade: job DRAFT -> DESIGN_REVIEW", "version += 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /design-calculations/{calculation_id}/approve"
        actor: DesignEngineer
        preconditions:
          - "calculation.status = SUBMITTED"
          - "X-User-ID != prepared_by_personnel_id"
        side_effects:
          - "reviewed_by_personnel_id = X-User-ID"
          - "job.governing_joint_efficiency recomputed"
          - "cascade: job DESIGN_REVIEW -> FAB_PLANNING once every required component is APPROVED"
          - "version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /design-calculations/{calculation_id}/reject"
        actor: DesignEngineer
        preconditions:
          - "calculation.status = SUBMITTED"
          - "X-User-ID != prepared_by_personnel_id"
          - "reject_reason is non-blank"
        side_effects: ["reviewed_by_personnel_id = X-User-ID", "reject_reason stored", "cascade: job DESIGN_REVIEW -> DRAFT", "version += 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /design-calculations/{calculation_id}/submit is not permitted; the reviewer's rejection is reopened by POST /design-calculations/{calculation_id}/revise"
        actor: DesignEngineer
        preconditions: ["calculation.status = REJECTED", "job.status = DRAFT"]
        side_effects:
          - "revision += 1"
          - "reviewed_by_personnel_id = null; reject_reason = null"
          - "rt_extent_declared, allowable_stress_psi, corrosion_allowance_in, thickness_nominal_in replaced by the request values"
          - "joint_efficiency, thickness_circumferential_in, thickness_longitudinal_in, thickness_required_in, governing_variant recomputed"
          - "version += 1"
        note: "Revision loop closes here: DRAFT -> SUBMITTED -> REJECTED -> DRAFT on the same row, with revision incrementing each pass."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /vessel-jobs/{job_id}/design-calculations creates a new sheet for the same component"
        actor: system
        preconditions: ["an APPROVED sheet already exists for (job_id, component)"]
        side_effects: ["the new sheet starts at DRAFT with revision = this revision + 1", "cascade: job returns to DRAFT", "version += 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: POST /vessel-jobs/{job_id}/design-calculations creates a new sheet for the same component"
        actor: system
        preconditions: ["a SUBMITTED sheet already exists for (job_id, component)"]
        side_effects: ["the new sheet starts at DRAFT with revision = this revision + 1", "version += 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["version += 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["version += 1"]

  - entity: MaterialHeat
    initial_state: QUARANTINE
    terminal_states: [REJECTED]
    transitions:
      - from: QUARANTINE
        to: ACCEPTED
        trigger: "POST /material-heats/{heat_id}/mtr-review with decision = ACCEPT"
        actor: QCInspector
        preconditions:
          - "heat.status = QUARANTINE"
          - "mtr_received = true"
          - "mtr_certified_yield_ksi >= SPEC_MIN_YIELD_KSI[spec] (SA-516-70: 38, SA-240-304L: 25, SA-105: 36, SA-179: 26)"
          - "mtr_certified_tensile_ksi >= SPEC_MIN_TENSILE_KSI[spec] (SA-516-70: 70, SA-240-304L: 70, SA-105: 70, SA-179: 47)"
        side_effects: ["version += 1"]
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /material-heats/{heat_id}/mtr-review with decision = REJECT"
        actor: QCInspector
        preconditions: ["heat.status = QUARANTINE", "reason is non-blank"]
        side_effects: ["version += 1"]
      - from: ACCEPTED
        to: DEPLETED
        trigger: "system: POST /vessel-jobs/{job_id}/parts drives quantity_remaining_lb to exactly 0.00"
        actor: system
        preconditions: ["quantity_remaining_lb = 0.00 after the issue"]
        side_effects: ["version += 1"]
        note: "Boundary: the heat depletes only at exactly 0.00; any positive remainder keeps it ACCEPTED."
      - from: DEPLETED
        to: ACCEPTED
        trigger: "system: POST /parts/{part_id}/scrap or the job-cancellation cascade returns pounds to the heat"
        actor: system
        preconditions: ["quantity_remaining_lb > 0.00 after the return"]
        side_effects: ["version += 1"]
        note: "Compensating transition: the mass ledger is restored and the heat becomes issuable again."

  - entity: Part
    initial_state: ISSUED
    terminal_states: [SCRAPPED]
    transitions:
      - from: ISSUED
        to: SCRAPPED
        trigger: "POST /parts/{part_id}/scrap"
        actor: WeldingEngineer
        preconditions:
          - "part.status = ISSUED"
          - "job.status IN {FAB_PLANNING, FABRICATION, NDE_HOLD}"
          - "no ProductionWeld with fab_status = WELDED references this part as part_a_id or part_b_id"
        side_effects:
          - "heat.quantity_issued_lb and heat.quantity_remaining_lb recomputed, returning issued_quantity_lb to the heat"
          - "cascade: a DEPLETED heat returns to ACCEPTED"
          - "every ProductionWeld with fab_status = PLANNED referencing this part keeps its row; the weld-map release gate will reject the job while a PLANNED weld references a SCRAPPED part"
          - "version += 1"
      - from: ISSUED
        to: SCRAPPED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["scrap_reason = JOB_CANCELLED", "heat mass ledger restored exactly as in the operator-driven scrap", "version += 1"]

  - entity: WPS
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: QUALIFIED
        trigger: "POST /wps/{wps_id}/qualify"
        actor: WeldingEngineer
        preconditions: ["wps.status = DRAFT", "supporting_pqr_number is non-blank"]
        side_effects: ["version += 1"]

  - entity: WelderQualification
    initial_state: QUALIFIED
    terminal_states: []
    transitions:
      - from: QUALIFIED
        to: LAPSED
        trigger: "system: POST /_clock/set_current_utc leaves days_since_continuity > 180"
        actor: system
        preconditions: ["days_since_continuity > CONTINUITY_LIMIT_DAYS (180) after the clock move"]
        side_effects: ["version += 1"]
        note: "Boundary: exactly 180 days keeps the record QUALIFIED; 181 lapses it."
      - from: LAPSED
        to: QUALIFIED
        trigger: "POST /welder-qualifications/{qualification_id}/continuity-logs"
        actor: WeldingEngineer
        preconditions:
          - "continuity_date <= current logical UTC date"
          - "continuity_date > last_continuity_date"
          - "process = the cited WPS process"
        side_effects: ["last_continuity_date = continuity_date", "days_since_continuity recomputed", "version += 1"]
        note: "Lapse/reinstate loop: the same row cycles QUALIFIED -> LAPSED -> QUALIFIED without a new performance test."
      - from: QUALIFIED
        to: QUALIFIED
        trigger: "POST /welder-qualifications/{qualification_id}/continuity-logs"
        actor: WeldingEngineer
        preconditions: ["continuity_date <= current logical UTC date", "continuity_date > last_continuity_date"]
        side_effects: ["last_continuity_date = continuity_date", "days_since_continuity recomputed", "version += 1"]

  - entity: ProductionWeld
    initial_state: "fab:PLANNED + nde:NOT_PLANNED + pwht:(PENDING when wps.pwht_required else NOT_REQUIRED)"
    terminal_states: []
    transitions:
      - from: "fab:PLANNED"
        to: "fab:WELDED"
        trigger: "POST /production-welds/{weld_id}/complete"
        actor: WeldingEngineer
        preconditions:
          - "weld.fab_status = PLANNED"
          - "job.status = FABRICATION, or job.status = NDE_HOLD and weld.repair_of_weld_id is not null and the Nonconformance covering the parent weld has disposition = REPAIR"
          - "wps.status = QUALIFIED"
          - "qualification.status = QUALIFIED"
          - "qualification.wps_id = weld.wps_id"
          - "weld.thickness_in <= qualification.thickness_range_max_in"
          - "part_a (and part_b when present) have status = ISSUED"
        side_effects:
          - "welder_qualification_id and welded_at stored"
          - "job.weld_completion_pct recomputed"
          - "version += 1"
        note: "The fabrication dimension advances alone: nde_status and pwht_status are untouched by this call."
      - from: "nde:NOT_PLANNED"
        to: "nde:PLANNED"
        trigger: "system: POST /vessel-jobs/{job_id}/nde-plan selects this joint"
        actor: system
        preconditions: ["weld.nde_status = NOT_PLANNED", "weld.required_volumetric_pct > 0 or weld.required_surface_method is not null"]
        side_effects: ["one NDEExam row per owed method is created with result = PENDING", "version += 1"]
      - from: "nde:PLANNED"
        to: "nde:ACCEPTED"
        trigger: "system: POST /nde-exams/{exam_id}/result records ACCEPT on the last PENDING exam of this joint"
        actor: system
        preconditions: ["every NDEExam with weld_id = this id has result = ACCEPT"]
        side_effects: ["job.weld_completion_pct recomputed", "version += 1"]
      - from: "nde:PLANNED"
        to: "nde:REJECTED"
        trigger: "system: POST /nde-exams/{exam_id}/result records REJECT"
        actor: system
        preconditions: ["weld.nde_status = PLANNED"]
        side_effects:
          - "cascade link 2: a Nonconformance with source = NDE_REJECT, weld_id = this id, disposition = OPEN is created"
          - "job.weld_completion_pct recomputed"
          - "version += 1"
      - from: "nde:REJECTED"
        to: "nde:ACCEPTED"
        trigger: "system: POST /nde-exams/{exam_id}/result records ACCEPT on the last PENDING examination of a repair joint whose repair_of_weld_id = this id"
        actor: system
        preconditions:
          - "a repair joint with repair_of_weld_id = this id exists with fab_status = WELDED and nde_status = ACCEPTED"
        side_effects:
          - "job.weld_completion_pct recomputed"
          - "version += 1"
        note: "Examination dimension cycles: PLANNED -> REJECTED -> ACCEPTED, where the acceptance is earned by the repair joint's own full-coverage examination rather than by re-examining the rejected joint. The rejected joint keeps its REJECT examination on file forever, which is why the TESTING gate is stated over weld.nde_status and never over the raw examination history."
      - from: "pwht:PENDING"
        to: "pwht:IN_PROGRESS"
        trigger: "system: POST /pwht-batches/{batch_id}/start"
        actor: system
        preconditions: ["weld.pwht_batch_id = batch.id", "weld.pwht_status = PENDING"]
        side_effects: ["version += 1"]
      - from: "pwht:IN_PROGRESS"
        to: "pwht:COMPLETE"
        trigger: "system: POST /pwht-batches/{batch_id}/complete"
        actor: system
        preconditions: ["batch soak and chart checks pass"]
        side_effects: ["job.weld_completion_pct recomputed", "version += 1"]
        note: "The heat-treatment dimension advances independently of nde_status: a joint may be pwht COMPLETE while still nde PLANNED, or nde ACCEPTED while still pwht PENDING."

  - entity: NDEExam
    initial_state: PENDING
    terminal_states: [ACCEPT, REJECT]
    transitions:
      - from: PENDING
        to: ACCEPT
        trigger: "POST /nde-exams/{exam_id}/result with result = ACCEPT"
        actor: QCInspector
        preconditions:
          - "exam.result = PENDING"
          - "weld.fab_status = WELDED"
          - "exam_date is on or after the calendar date of weld.welded_at"
        side_effects:
          - "examiner_personnel_id = X-User-ID; exam_date and examined_coverage_pct stored"
          - "cascade: weld.nde_status -> ACCEPTED when this was the joint's last PENDING exam"
          - "job.weld_completion_pct recomputed and every DataReport of the job re-derives section_scores.NDE and completeness_score"
          - "version += 1"
      - from: PENDING
        to: REJECT
        trigger: "POST /nde-exams/{exam_id}/result with result = REJECT"
        actor: QCInspector
        preconditions:
          - "exam.result = PENDING"
          - "weld.fab_status = WELDED"
          - "indications_count >= 1"
        side_effects:
          - "examiner_personnel_id = X-User-ID; exam_date and indications_count stored"
          - "cascade link 2: weld.nde_status -> REJECTED"
          - "cascade link 3: a Nonconformance (source = NDE_REJECT, disposition = OPEN) is created and job.nonconformance_open_count += 1"
          - "cascade link 4: job.status FABRICATION -> NDE_HOLD"
          - "cascade link 5: every DataReport of the job re-derives completeness_score and missing_items, and every AI_SIGNED DataReport for the job moves to STAMP_HOLD"
          - "version += 1"

  - entity: Nonconformance
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REPAIR
        trigger: "POST /nonconformances/{nonconformance_id}/disposition with disposition = REPAIR"
        actor: QCInspector
        preconditions:
          - "nonconformance.disposition = OPEN"
          - "job.status = NDE_HOLD"
          - "weld.repair_generation < REPAIR_LIMIT (2)"
        side_effects: ["disposition_notes stored", "version += 1"]
      - from: OPEN
        to: USE_AS_IS
        trigger: "POST /nonconformances/{nonconformance_id}/disposition with disposition = USE_AS_IS"
        actor: QCInspector
        preconditions:
          - "nonconformance.disposition = OPEN"
          - "job.status = NDE_HOLD"
          - "the acting X-User-Role is AuthorizedInspector, so that X-User-ID can be recorded as ai_concurrence_personnel_id; a QCInspector asking for USE_AS_IS is refused with ERR_AI_CONCURRENCE_REQUIRED"
        side_effects: ["ai_concurrence_personnel_id = X-User-ID", "version += 1"]
      - from: REPAIR
        to: CLOSED
        trigger: "POST /nonconformances/{nonconformance_id}/close"
        actor: QCInspector
        preconditions:
          - "nonconformance.disposition = REPAIR"
          - "a repair joint with repair_of_weld_id = nonconformance.weld_id exists with fab_status = WELDED and nde_status = ACCEPTED"
        side_effects:
          - "closed_at stored"
          - "compensating cascade: job.nonconformance_open_count -= 1"
          - "job.status NDE_HOLD -> FABRICATION once nonconformance_open_count reaches 0"
          - "cascade: every STAMP_HOLD DataReport for the job returns to AI_SIGNED when the certificate also permits stamping"
          - "version += 1"
      - from: USE_AS_IS
        to: CLOSED
        trigger: "POST /nonconformances/{nonconformance_id}/close"
        actor: QCInspector
        preconditions: ["nonconformance.disposition = USE_AS_IS", "ai_concurrence_personnel_id is not null"]
        side_effects:
          - "closed_at stored"
          - "compensating cascade: job.nonconformance_open_count -= 1"
          - "job.status NDE_HOLD -> FABRICATION once nonconformance_open_count reaches 0"
          - "version += 1"
      - from: REPAIR
        to: OPEN
        trigger: "system: POST /nde-exams/{exam_id}/result records REJECT on an examination of the repair joint"
        actor: system
        preconditions: ["nonconformance.disposition = REPAIR", "the rejected exam's weld has repair_of_weld_id = nonconformance.weld_id"]
        side_effects: ["the repair joint carries repair_generation = parent weld repair_generation + 1", "job.nonconformance_open_count is unchanged because the record never left the open set", "version += 1"]
        note: "Re-open loop: OPEN -> REPAIR -> OPEN is traversable up to REPAIR_LIMIT attempts, after which the disposition call fails with ERR_REPAIR_LIMIT_EXCEEDED."
      - from: OPEN
        to: CLOSED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["closed_at = current logical UTC instant", "job.nonconformance_open_count -= 1", "version += 1"]

  - entity: PWHTBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /pwht-batches/{batch_id}/start"
        actor: WeldingEngineer
        preconditions:
          - "batch.status = SCHEDULED"
          - "job.status IN {FABRICATION, NDE_HOLD}"
          - "every weld in the batch has fab_status = WELDED"
          - "soak_temp_f is inside the [1100, 1250] band for the batch p_number"
        side_effects: ["cascade: every batched weld pwht_status PENDING -> IN_PROGRESS", "version += 1"]
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /pwht-batches/{batch_id}/complete"
        actor: WeldingEngineer
        preconditions:
          - "batch.status = IN_PROGRESS"
          - "chart_uploaded = true and chart_record_number is non-blank"
          - "actual_soak_minutes >= required_soak_minutes"
          - "X-User-ID != scheduled_by_personnel_id"
        side_effects:
          - "chart_reviewed_by_personnel_id = X-User-ID; actual_soak_minutes, chart_record_number and chart_uploaded stored"
          - "cascade: every batched weld pwht_status IN_PROGRESS -> COMPLETE"
          - "job.weld_completion_pct recomputed and every DataReport of the job re-derives section_scores.PWHT and completeness_score"
          - "version += 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["batched welds pwht_status returns to PENDING and pwht_batch_id is cleared", "version += 1"]
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["batched welds pwht_status returns to PENDING and pwht_batch_id is cleared", "version += 1"]

  - entity: PressureTest
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PENDING
        trigger: "POST /pressure-tests/{test_id}/witness"
        actor: AuthorizedInspector
        preconditions:
          - "test.result = PENDING"
          - "test.ai_witness_confirmed = false"
          - "job.certificate stamping_authorized = true"
        side_effects: ["ai_witness_confirmed = true and witnessed_by_personnel_id = X-User-ID", "version += 1"]
      - from: PENDING
        to: PASS
        trigger: "POST /pressure-tests/{test_id}/result with result = PASS"
        actor: QCInspector
        preconditions:
          - "test.result = PENDING"
          - "test.ai_witness_confirmed = true"
          - "job.status = TESTING"
          - "job.nonconformance_open_count = 0"
          - "observed_pressure_psi >= test_pressure_psi"
          - "observed_hold_minutes >= min_hold_minutes"
          - "test_medium_temp_f >= min_medium_temp_f"
        side_effects:
          - "cascade: job.status TESTING -> DATA_PACKAGE once the latest test of every required_test_sides member has result = PASS"
          - "every DataReport of the job re-derives section_scores.TEST and completeness_score"
          - "version += 1"
      - from: PENDING
        to: FAIL
        trigger: "POST /pressure-tests/{test_id}/result with result = FAIL"
        actor: QCInspector
        preconditions: ["test.result = PENDING", "test.ai_witness_confirmed = true", "job.status = TESTING"]
        side_effects:
          - "a Nonconformance (source = PRESSURE_TEST_FAIL, severity = MAJOR, disposition = OPEN) is created and job.nonconformance_open_count += 1"
          - "cascade: job.status TESTING -> NDE_HOLD"
          - "version += 1"

  - entity: DataReport
    initial_state: ASSEMBLING
    terminal_states: [STAMPED, VOIDED]
    transitions:
      - from: ASSEMBLING
        to: READY_FOR_AI
        trigger: "POST /data-reports/{report_id}/submit-to-ai"
        actor: QCInspector
        preconditions:
          - "report.status = ASSEMBLING"
          - "job.status = DATA_PACKAGE"
          - "completeness_score = 100.00"
          - "job.nonconformance_open_count = 0"
        side_effects: ["missing_items recomputed to an empty list", "version += 1"]
      - from: READY_FOR_AI
        to: AI_SIGNED
        trigger: "POST /data-reports/{report_id}/ai-sign"
        actor: AuthorizedInspector
        preconditions:
          - "report.status = READY_FOR_AI"
          - "certificate.stamping_authorized = true"
          - "certificate.status = ACTIVE and certificate.expires_on >= current logical UTC date"
          - "X-User-ID != assembled_by_personnel_id"
        side_effects: ["ai_personnel_id = X-User-ID, ai_signed_at = current logical UTC", "version += 1"]
      - from: AI_SIGNED
        to: STAMP_HOLD
        trigger: "system: the governing certificate loses stamping authority (audit close, clock-driven expiry, or a new open major finding) or the job gains an open Nonconformance"
        actor: system
        preconditions: ["report.status = AI_SIGNED", "certificate.stamping_authorized = false OR job.nonconformance_open_count > 0"]
        side_effects: ["missing_items gains the literal CERTIFICATE_NOT_AUTHORIZED or OPEN_NONCONFORMANCE naming the cause", "version += 1"]
        note: "Cross-entity dependency: the report's own fields are untouched but its state tracks CertificateOfAuthorization."
      - from: STAMP_HOLD
        to: AI_SIGNED
        trigger: "system: POST /certificates/{certificate_id}/renewals, POST /shop-audits/{audit_id}/close, or POST /nonconformances/{nonconformance_id}/close restores stamping authority"
        actor: system
        preconditions: ["report.status = STAMP_HOLD", "certificate.stamping_authorized = true", "job.nonconformance_open_count = 0"]
        side_effects: ["missing_items drops CERTIFICATE_NOT_AUTHORIZED and OPEN_NONCONFORMANCE", "version += 1"]
        note: "Hold loop: AI_SIGNED -> STAMP_HOLD -> AI_SIGNED is traversable any number of times."
      - from: AI_SIGNED
        to: STAMPED
        trigger: "POST /data-reports/{report_id}/stamp-nameplate"
        actor: ShopAdmin
        preconditions:
          - "report.status = AI_SIGNED"
          - "certificate.stamping_authorized = true"
          - "nameplate_serial is unique across DataReport"
        side_effects:
          - "nameplate_serial and nameplate_stamped_at stored"
          - "cascade: job.status DATA_PACKAGE -> STAMPED"
          - "version += 1"
      - from: ASSEMBLING
        to: VOIDED
        trigger: "system: POST /vessel-jobs/{job_id}/data-report supersedes this report, or POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["report.status = ASSEMBLING"]
        side_effects: ["version += 1"]
      - from: READY_FOR_AI
        to: VOIDED
        trigger: "system: POST /vessel-jobs/{job_id}/data-report supersedes this report, or POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["report.status = READY_FOR_AI"]
        side_effects: ["version += 1"]
      - from: STAMP_HOLD
        to: VOIDED
        trigger: "system: POST /vessel-jobs/{job_id}/cancel"
        actor: system
        preconditions: ["job cancellation cascade"]
        side_effects: ["version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: design-calc-revision-stale-job
    parent_entity: VesselJob
    write_endpoint: "POST /vessel-jobs/{job_id}/design-calculations"
    occ_field: "expected_job_version"
    description: |
      Creating a DesignCalculation sheet against a VesselJob whose version has
      advanced since the client last read it is rejected. A create for a
      component that already carries a sheet legitimately supersedes the prior
      sheet and pushes the job back to DRAFT, so a writer holding a stale job
      version would silently supersede work it never saw.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
  - rule_id: certificate-renewal-stale
    parent_entity: CertificateOfAuthorization
    write_endpoint: "POST /certificates/{certificate_id}/renewals"
    occ_field: "expected_certificate_version"
    description: |
      Recording a renewal against a CertificateOfAuthorization whose version has
      advanced since the client last read it is rejected. A renewal legitimately
      supersedes the expiry date and clears the probation posture, so a writer
      holding a stale certificate version would renew on the strength of an audit
      posture that no longer holds.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: joint_efficiency_resolution
    trigger: "On POST /vessel-jobs/{job_id}/design-calculations and POST /design-calculations/{calculation_id}/revise, before required_wall_thickness"
    algorithm: threshold
    formula: |
      E = JOINT_EFFICIENCY_TABLE[calculation.rt_extent_declared]
        FULL -> 1.00
        SPOT -> 0.85
        NONE -> 0.70
      Evaluation order is pinned and one-directional:
        step 1: E is resolved from rt_extent_declared, which is a declared design
                input on the DesignCalculation row.
        step 2: required_wall_thickness consumes E (see next rule).
        step 3: nde_coverage_requirement consumes rt_extent_declared and the
                thickness produced in step 2 to size the weld map.
      The examination coverage produced in step 3 NEVER feeds back into E. A weld
      map that ends up radiographing every Category A seam does not promote a
      SPOT declaration to FULL, and cancelling exams does not demote E. The
      dependency looks circular (E sizes the exams, the exams are radiography
      extent) but is resolved strictly in declaration order.
    input_set: "The single DesignCalculation row being created or revised; no other rows participate"
    constants:
      E_FULL: 1.00
      E_SPOT: 0.85
      E_NONE: 0.70
    precision: "2 decimal places, round_half_up"

  - name: required_wall_thickness
    trigger: "On POST /vessel-jobs/{job_id}/design-calculations and POST /design-calculations/{calculation_id}/revise, after joint_efficiency_resolution"
    algorithm: dual_variant_formula
    formula: |
      P = mawp_psi (from the parent VesselJob)
      R = inside_radius_in (from the parent VesselJob)
      S = allowable_stress_psi
      E = joint_efficiency
      CA = corrosion_allowance_in

      thickness_circumferential_in = round_half_up(P * R / (S * E - 0.6 * P), 4)
      thickness_longitudinal_in    = round_half_up(P * R / (2 * S * E + 0.4 * P), 4)

      governing_raw = max(P * R / (S * E - 0.6 * P), P * R / (2 * S * E + 0.4 * P))
      governing_variant = CIRCUMFERENTIAL when
          (P * R / (S * E - 0.6 * P)) >= (P * R / (2 * S * E + 0.4 * P))
        else LONGITUDINAL
      thickness_required_in = round_half_up(governing_raw + CA, 4)

      Both per-variant fields are always reported, both are rounded from the raw
      stress formula (they are report-only and never include CA), and the
      governing value is rounded ONCE from the unrounded governing_raw plus CA.
      Rounding the variant first and then adding CA is wrong.
    input_set: "The single DesignCalculation row plus mawp_psi and inside_radius_in from its parent VesselJob"
    constants:
      CIRC_DENOMINATOR_FACTOR: 0.6
      LONG_DENOMINATOR_FACTOR: 0.4
      LONG_STRESS_MULTIPLIER: 2
    precision: "4 decimal places, round_half_up"
    variants:
      - name: CIRCUMFERENTIAL
        when: "Longitudinal-seam stress governs a cylindrical shell; always evaluated"
        difference: "t = P*R / (S*E - 0.6*P) — the larger of the pair for every physically valid input, so it governs"
      - name: LONGITUDINAL
        when: "Circumferential-seam stress; always evaluated and always reported"
        difference: "t = P*R / (2*S*E + 0.4*P) — roughly half the circumferential value"

  - name: nde_coverage_requirement
    trigger: "On POST /vessel-jobs/{job_id}/production-welds (to size the joint) and again on POST /vessel-jobs/{job_id}/nde-plan"
    algorithm: decision_matrix
    formula: |
      Inputs: job.design_code, weld.joint_category (A|B|C|D), weld.joint_type
      (BUTT|CORNER|FILLET), weld.thickness_in, the rt_extent_declared of the
      APPROVED DesignCalculation whose component matches part_a.component_type,
      the material_class of the heats behind part_a and part_b, and whether the
      weld is a repair (repair_of_weld_id is not null).

      required_volumetric_pct:
        if repair_of_weld_id is not null                    -> 100
        elif design_code = DIV2 and joint_category in {A, B}    -> 100
        elif joint_category = A:
            rt_extent_declared FULL -> 100 ; SPOT -> 25 ; NONE -> 0
        elif joint_category = B:
            rt_extent_declared FULL -> 100 when thickness_in >= 1.500 else 25
            rt_extent_declared SPOT -> 25
            rt_extent_declared NONE -> 0
        else (joint_category in {C, D})                      -> 0

      volumetric_method (null when required_volumetric_pct = 0):
        UT when thickness_in >= 2.000 and joint_type = BUTT, else RT

      required_surface_method:
        PT when either joined part traces to a heat with material_class = AUSTENITIC
        else MT when joint_category in {C, D} or joint_type in {FILLET, CORNER}
        else null
      A surface examination, when owed, always carries required_coverage_pct = 100.
    input_set: "The single ProductionWeld row, the Part rows it joins with their MaterialHeat rows, its parent VesselJob, and the APPROVED DesignCalculation for the component the joint belongs to"
    constants:
      DIV2_FULL_CATEGORIES: [A, B]
      B_FULL_RT_THICKNESS_THRESHOLD_IN: 1.500
      UT_THICKNESS_THRESHOLD_IN: 2.000
      SPOT_COVERAGE_PCT: 25
      FULL_COVERAGE_PCT: 100
    precision: "integer percent; thickness comparisons at 3 decimal places"

  - name: nde_plan_selection
    trigger: "On POST /vessel-jobs/{job_id}/nde-plan"
    algorithm: chronological
    formula: |
      candidates = ProductionWeld rows for the job with fab_status = WELDED and
                   nde_status = NOT_PLANNED
      group candidates by joint_category, processed in the fixed order A, B, C, D.
      For each group:
        if the group's required_volumetric_pct = 100 -> every candidate is selected
        elif required_volumetric_pct = 25            -> the first
             ceil(0.25 * group_size) candidates ordered by weld_number ASC,
             tie-broken by created_at ASC, are selected
        else                                          -> no volumetric exam
        A selected candidate yields one NDEExam(method = weld.volumetric_method,
        required_coverage_pct = weld.required_volumetric_pct, result = PENDING).
      After the volumetric pass, every candidate whose required_surface_method is
      not null yields one NDEExam(method = weld.required_surface_method,
      required_coverage_pct = 100, result = PENDING), appended in weld_number ASC
      order across the whole job.
      group_size counts the candidates in the group on THIS invocation only, so a
      re-run after further welding sizes the 25 pct sample against the newly
      eligible joints and never re-examines a joint that already left NOT_PLANNED.
    input_set: "ProductionWeld rows for the job with fab_status = WELDED and nde_status = NOT_PLANNED"
    constants:
      CATEGORY_ORDER: [A, B, C, D]
      SPOT_SAMPLE_FRACTION: 0.25
      SAMPLE_ROUNDING: ceil
    precision: "integer counts; ceil applied to the fractional sample size"

  - name: test_pressure
    trigger: "On POST /pressure-tests"
    algorithm: dual_variant_formula
    formula: |
      MAWP = job.mawp_psi
      SR   = job.stress_ratio (the ratio of allowable stress at test temperature to
             allowable stress at design temperature, declared on the job)

      test_pressure_psi =
        round_half_up(1.3 * MAWP * SR, 1)   when test_type = HYDROSTATIC
        round_half_up(1.1 * MAWP * SR, 1)   when test_type = PNEUMATIC

      min_hold_minutes =
        30 when test_type = HYDROSTATIC
        60 when test_type = PNEUMATIC

      min_medium_temp_f =
        job.mdmt_f + 30 when test_type = HYDROSTATIC
        job.mdmt_f + 60 when test_type = PNEUMATIC

      The pneumatic variant deliberately requires a LOWER pressure and a LONGER
      hold at a WARMER medium temperature than the hydrostatic variant for the
      same vessel, so the two variants diverge on all three outputs at once.
    input_set: "The PressureTest row being created plus mawp_psi, mdmt_f and stress_ratio from its parent VesselJob"
    constants:
      HYDRO_PRESSURE_MULTIPLIER: 1.3
      PNEUMATIC_PRESSURE_MULTIPLIER: 1.1
      HYDRO_HOLD_MINUTES: 30
      PNEUMATIC_HOLD_MINUTES: 60
      HYDRO_TEMP_MARGIN_F: 30
      PNEUMATIC_TEMP_MARGIN_F: 60
    precision: "1 decimal place, round_half_up for pressure; integer minutes and degrees F"
    variants:
      - name: HYDROSTATIC
        when: "test_type = HYDROSTATIC — the default medium for a water-fillable vessel"
        difference: "1.3 x MAWP x stress_ratio, 30-minute hold, medium at least MDMT + 30 F"
      - name: PNEUMATIC
        when: "test_type = PNEUMATIC — used when the vessel cannot tolerate the weight of water or cannot be dried"
        difference: "1.1 x MAWP x stress_ratio, 60-minute hold, medium at least MDMT + 60 F, and the bay is held exclusively"

  - name: pwht_soak_requirement
    trigger: "On POST /pwht-batches and re-evaluated on POST /pwht-batches/{batch_id}/complete"
    algorithm: aggregation
    formula: |
      governing_thickness_in = max(weld.thickness_in for weld in batch.weld_ids)
      required_soak_minutes  = max(
        MINIMUM_SOAK_MINUTES,
        round_half_up(governing_thickness_in * MINUTES_PER_INCH, 0)
      )
      soak_temp_f must satisfy
        SOAK_BAND[p_number].min <= soak_temp_f <= SOAK_BAND[p_number].max
      where p_number is the base_metal_p_number shared by the WPS of every batched
      weld; a batch whose welds span more than one p_number is rejected.
      The floor binds for every joint thinner than 0.250 in, so a batch of thin
      joints still owes a 15-minute soak.
    input_set: "Every ProductionWeld whose id appears in the batch's weld_ids request array, and the WPS each one cites"
    constants:
      MINUTES_PER_INCH: 60
      MINIMUM_SOAK_MINUTES: 15
      SOAK_BAND_P1_MIN_F: 1100
      SOAK_BAND_P1_MAX_F: 1250
    precision: "integer minutes, round_half_up before the floor is applied"

  - name: data_package_completeness
    trigger: "On POST /vessel-jobs/{job_id}/data-report and recomputed on every event that changes a package section (calculation approval, MTR review, weld completion, NDE result, PWHT completion, pressure-test result, nonconformance close)"
    algorithm: weighted_scoring
    formula: |
      SECTIONS (weight, satisfied_count / required_count):
        DESIGN   25  components of job.required_components carrying an APPROVED
                     DesignCalculation / len(job.required_components)
        MATERIAL 20  components of job.required_components for which at least one
                     ISSUED Part exists whose heat.status is ACCEPTED or DEPLETED /
                     len(job.required_components)
        WELDING  20  ProductionWeld rows with fab_status = WELDED / all ProductionWeld
                     rows of the job
        NDE      15  NDEExam rows with result = ACCEPT / all NDEExam rows of the job
        PWHT     10  PWHTBatch rows with status = COMPLETE and chart_uploaded = true /
                     all PWHTBatch rows of the job
        TEST     10  PressureTest rows with result = PASS / all PressureTest rows of the job

      For each section:
        fraction       = 1.000 when required_count = 0
                         else satisfied_count / required_count   (exact rational, unrounded)
        section_points = round_half_up(weight * fraction, 2)

      completeness_score = round_half_up(sum(section_points), 2), and section_scores
      records each section_points value keyed by section code.

      The rounding order is pinned: EACH section is rounded to 2 decimals FIRST and
      the rounded section points are then summed and rounded again. Summing the
      unrounded weight * fraction products and rounding once at the end gives a
      different answer (e.g. 66.66 vs 66.67 for the two-thirds case), and only the
      per-section-first order is correct.

      missing_items lists, in SECTION_ORDER, the section code of every section whose
      fraction < 1.000, followed by the literal OPEN_NONCONFORMANCE when the job has
      nonconformance_open_count > 0 and CERTIFICATE_NOT_AUTHORIZED when the governing
      certificate has stamping_authorized = false.
    input_set: "job.required_components plus every DesignCalculation, Part, ProductionWeld, NDEExam, PWHTBatch and PressureTest row belonging to the job; SUPERSEDED calculation sheets, SCRAPPED parts and ABORTED batches are excluded from both numerator and denominator"
    constants:
      WEIGHT_DESIGN: 25
      WEIGHT_MATERIAL: 20
      WEIGHT_WELDING: 20
      WEIGHT_NDE: 15
      WEIGHT_PWHT: 10
      WEIGHT_TEST: 10
      SECTION_ORDER: [DESIGN, MATERIAL, WELDING, NDE, PWHT, TEST]
      EMPTY_SECTION_FRACTION: 1.000
    precision: "2 decimal places, round_half_up, applied per section and then once to the sum"

  - name: material_balance
    trigger: "On POST /vessel-jobs/{job_id}/parts, POST /parts/{part_id}/scrap, and the job-cancellation cascade"
    algorithm: aggregation
    formula: |
      quantity_issued_lb    = sum(part.issued_quantity_lb
                                  for part in Part where part.heat_id = heat.id
                                  and part.status = ISSUED)
      quantity_remaining_lb = round_half_up(heat.quantity_received_lb - quantity_issued_lb, 2)

      Invariant, checkable after every one of the three triggers:
        heat.quantity_received_lb == heat.quantity_remaining_lb + quantity_issued_lb

      A part issue is admitted only when issued_quantity_lb <= quantity_remaining_lb,
      so remaining never goes negative. Reaching exactly 0.00 flips the heat to
      DEPLETED; a scrap returns the pounds and, when remaining rises above 0.00,
      flips it back to ACCEPTED.
    input_set: "Part rows with status = ISSUED referencing the heat; SCRAPPED parts are excluded from the issued total"
    constants:
      DEPLETION_THRESHOLD_LB: 0.00
    precision: "2 decimal places, round_half_up"

  - name: welder_continuity_status
    trigger: "On POST /welder-qualifications, POST /welder-qualifications/{qualification_id}/continuity-logs, POST /_clock/set_current_utc, and whenever a request reads or references the qualification"
    algorithm: threshold
    formula: |
      days_since_continuity = (current logical UTC date) - last_continuity_date, in whole days
      status = LAPSED when days_since_continuity > CONTINUITY_LIMIT_DAYS else QUALIFIED

      The comparison is strictly greater-than: exactly 180 days of inactivity is
      still QUALIFIED, and 181 days is LAPSED. POST /_clock/set_current_utc
      recomputes every qualification row and reports how many changed.
    input_set: "Every WelderQualification row"
    constants:
      CONTINUITY_LIMIT_DAYS: 180
    precision: "whole days; both dates taken as UTC calendar dates"

  - name: weld_completion_pct
    trigger: "Recomputed on POST /production-welds/{weld_id}/complete, POST /nde-exams/{exam_id}/result, POST /pwht-batches/{batch_id}/complete, POST /parts/{part_id}/scrap and the nonconformance close cascade"
    algorithm: aggregation
    formula: |
      done  = count(weld for weld in job welds
                    where weld.fab_status = WELDED
                      and weld.nde_status = ACCEPTED
                      and weld.pwht_status in {NOT_REQUIRED, COMPLETE})
      total = count(all ProductionWeld rows for the job)
      weld_completion_pct = 0.00 when total = 0
                            else round_half_up(100 * done / total, 2)
      A joint counts only when all three dimensions are satisfied, so a joint that
      is welded and PWHT-complete but still awaiting radiography does not count.
    input_set: "Every ProductionWeld row for the job, including repair joints"
    constants:
      PWHT_SATISFIED_STATES: [NOT_REQUIRED, COMPLETE]
    precision: "2 decimal places, round_half_up"

  - name: certificate_posture
    trigger: "On POST /certificates, POST /shop-audits/{audit_id}/close, POST /certificates/{certificate_id}/renewals, and POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      open_major_findings_count and open_minor_findings_count are running counters:
      each POST /shop-audits/{audit_id}/close adds that audit's major_finding_count
      and minor_finding_count, and each POST /certificates/{certificate_id}/renewals
      resets both to 0. A finding therefore stays open until a renewal clears it.
        major_finding_count = count(f in audit.findings where f.severity = MAJOR)
        minor_finding_count = count(f in audit.findings where f.severity = MINOR)
        audit.satisfactory  = (major_finding_count = 0 and minor_finding_count <= 5)

      status =
        EXPIRED    when certificate.expires_on < current logical UTC date
        SUSPENDED  when open_major_findings_count >= MAJOR_SUSPEND_THRESHOLD
        PROBATION  when open_major_findings_count >= 1
                     or open_minor_findings_count > MINOR_PROBATION_THRESHOLD
        ACTIVE     otherwise

      stamping_authorized = (status = ACTIVE) and open_major_findings_count = 0

      Expiry outranks findings: an expired certificate is EXPIRED regardless of
      how clean the audit record is.
    input_set: "The certificate's own running finding counters, fed by every ShopAudit closed since its last renewal"
    constants:
      MAJOR_SUSPEND_THRESHOLD: 3
      MINOR_PROBATION_THRESHOLD: 5
    precision: "integer finding counts; dates compared as UTC calendar dates"

# =============================================================================
# 1.4 Validation Rules (evaluated strictly in ascending priority order;
#     the FIRST violated rule determines the response and no later rule runs)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role header is present and is one of ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector; X-User-ID is present and non-blank whenever the role is entity-backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 15
    category: auth
    check: "For the entity-backed roles (DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector) the X-User-ID must reference an existing Personnel row whose role_code matches the declared X-User-Role"
    error_id: ERR_IDENTITY_ROLE_MISMATCH
    http_status: 403
    applies_to: "all endpoints except POST /personnel and POST /_clock/set_current_utc"
  - priority: 20
    category: auth
    check: "The declared role appears in the endpoint's permitted-role list in §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 25
    category: shape
    check: "Request body parses as JSON, every required field is present and non-null, every field has the declared type, enum fields carry a declared value, decimal fields carry at most the declared scale, timestamp fields are ISO-8601 UTC instants, date fields are ISO-8601 calendar dates, numeric quantities are strictly positive where the field declares it, limit is in [1, 100] and offset is >= 0, and weld_ids is an array of distinct ids (an EMPTY array passes the shape gate and is caught later at priority 88 by ERR_EMPTY_WELD_SET)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 30
    category: existence
    check: "Every path id resolves to a live row, validated left to right: certificate_id, audit_id, job_id, calculation_id, heat_id, part_id, wps_id, qualification_id, weld_id, exam_id, nonconformance_id, batch_id, test_id, report_id, personnel path ids"
    error_id: "ERR_CERTIFICATE_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_CALCULATION_NOT_FOUND | ERR_HEAT_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_WPS_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND | ERR_WELD_NOT_FOUND | ERR_EXAM_NOT_FOUND | ERR_NONCONFORMANCE_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 35
    category: existence
    check: "Every id referenced in the request body resolves to a live row, validated in the field order declared by the endpoint: certificate_id, heat_id, wps_id, welder_qualification_id, part_a_id, part_b_id, repair_of_weld_id, weld_ids entries"
    error_id: "ERR_CERTIFICATE_NOT_FOUND | ERR_HEAT_NOT_FOUND | ERR_WPS_NOT_FOUND | ERR_QUALIFICATION_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_WELD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /vessel-jobs, POST /vessel-jobs/{job_id}/parts, POST /welder-qualifications, POST /vessel-jobs/{job_id}/production-welds, POST /production-welds/{weld_id}/complete, POST /pwht-batches, POST /nonconformances/{nonconformance_id}/repair-welds"
  - priority: 45
    category: concurrency
    check: "The OCC field carried by the request matches the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_JOB_VERSION | ERR_STALE_CERTIFICATE_VERSION"
    http_status: 412
    applies_to: "POST /vessel-jobs/{job_id}/design-calculations, POST /vessel-jobs/{job_id}/data-report, POST /certificates/{certificate_id}/renewals"
  - priority: 50
    category: state
    check: "The target resource named in the path is in a state from which this transition is declared in §1.2"
    error_id: "ERR_INVALID_JOB_STATE | ERR_INVALID_CALCULATION_STATE | ERR_INVALID_HEAT_STATE | ERR_INVALID_PART_STATE | ERR_INVALID_WPS_STATE | ERR_INVALID_WELD_STATE | ERR_INVALID_EXAM_STATE | ERR_INVALID_NONCONFORMANCE_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_TEST_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_AUDIT_STATE | ERR_INVALID_CERTIFICATE_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 55
    category: state
    check: |
      Related entities are in the states this operation requires. The parent VesselJob state
      required by each endpoint, in one place:
        POST /design-calculations/{calculation_id}/submit    job IN {DRAFT, DESIGN_REVIEW}
        POST /design-calculations/{calculation_id}/revise     job = DRAFT
        POST /vessel-jobs/{job_id}/parts                      job IN {FAB_PLANNING, FABRICATION, NDE_HOLD}
        POST /parts/{part_id}/scrap                            job IN {FAB_PLANNING, FABRICATION, NDE_HOLD}
        POST /vessel-jobs/{job_id}/production-welds            job IN {FAB_PLANNING, FABRICATION}
        POST /production-welds/{weld_id}/complete               job = FABRICATION, or job = NDE_HOLD
                                                               for a repair joint whose covering
                                                               Nonconformance has disposition = REPAIR
        POST /vessel-jobs/{job_id}/nde-plan                    job IN {FABRICATION, NDE_HOLD}
        POST /pwht-batches                                     job IN {FABRICATION, NDE_HOLD}
        POST /pwht-batches/{batch_id}/start                    job IN {FABRICATION, NDE_HOLD}
        POST /pwht-batches/{batch_id}/complete                 job IN {FABRICATION, NDE_HOLD}
        POST /pressure-tests                                   job IN {FABRICATION, TESTING}
        POST /pressure-tests/{test_id}/result                   job = TESTING
        POST /nonconformances/{nonconformance_id}/disposition   job = NDE_HOLD
        POST /nonconformances/{nonconformance_id}/repair-welds  job = NDE_HOLD
        POST /vessel-jobs/{job_id}/data-report                  job NOT IN {STAMPED, CANCELLED}
      Beyond the job: the parent PWHTBatch is IN_PROGRESS for a chart review, and the parent
      Nonconformance is REPAIR before a repair joint may be created.
    error_id: "ERR_INVALID_JOB_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_NONCONFORMANCE_STATE"
    http_status: 409
    applies_to: "POST /design-calculations/{calculation_id}/submit, POST /design-calculations/{calculation_id}/revise, POST /vessel-jobs/{job_id}/parts, POST /parts/{part_id}/scrap, POST /vessel-jobs/{job_id}/production-welds, POST /production-welds/{weld_id}/complete, POST /vessel-jobs/{job_id}/nde-plan, POST /pwht-batches, POST /pwht-batches/{batch_id}/start, POST /pwht-batches/{batch_id}/complete, POST /pressure-tests, POST /pressure-tests/{test_id}/result, POST /nonconformances/{nonconformance_id}/disposition, POST /nonconformances/{nonconformance_id}/repair-welds, POST /vessel-jobs/{job_id}/data-report (which requires only that the job is neither STAMPED nor CANCELLED, so a partial package can be assembled and scored at any point in fabrication)"
  - priority: 60
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID must differ from the personnel who performed the paired earlier step — a calculation reviewer differs from its preparer, a PWHT chart reviewer differs from the batch scheduler, and the Authorized Inspector who signs a data report differs from its assembler"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /design-calculations/{calculation_id}/approve, POST /design-calculations/{calculation_id}/reject, POST /pwht-batches/{batch_id}/complete, POST /data-reports/{report_id}/ai-sign"
  - priority: 62
    category: business_safety
    check: "The governing CertificateOfAuthorization has not passed its expires_on date relative to the current logical UTC date. Expiry is checked BEFORE stamping authority because an expired certificate also reads stamping_authorized = false, and the expiry diagnosis is the more specific one"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 409
    applies_to: "POST /vessel-jobs, POST /pressure-tests/{test_id}/witness, POST /data-reports/{report_id}/ai-sign, POST /data-reports/{report_id}/stamp-nameplate"
  - priority: 63
    category: business_safety
    check: "The governing CertificateOfAuthorization still confers stamping authority: status = ACTIVE with open_major_findings_count = 0 for a witness, signature or nameplate stamp. Reachable independently of priority 62 whenever the certificate is unexpired but sits on PROBATION or SUSPENDED"
    error_id: ERR_STAMPING_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /pressure-tests/{test_id}/witness, POST /data-reports/{report_id}/ai-sign, POST /data-reports/{report_id}/stamp-nameplate"
  - priority: 64
    category: business_safety
    check: "Welding qualification adequacy: the cited WPS is QUALIFIED, the joint thickness_in lies within [wps.thickness_min_in, wps.thickness_max_in], the cited WelderQualification is QUALIFIED (not LAPSED), its wps_id matches the joint's wps_id, and the joint thickness is inside the qualification's thickness_range_max_in"
    error_id: "ERR_WPS_NOT_QUALIFIED | ERR_THICKNESS_OUTSIDE_WPS_RANGE | ERR_WELDER_NOT_QUALIFIED | ERR_QUALIFICATION_WPS_MISMATCH | ERR_THICKNESS_OUTSIDE_QUALIFICATION"
    http_status: 409
    applies_to: "POST /vessel-jobs/{job_id}/production-welds, POST /production-welds/{weld_id}/complete, POST /nonconformances/{nonconformance_id}/repair-welds"
  - priority: 66
    category: business_safety
    check: "Material acceptance: a heat may only be accepted at receiving inspection when its mtr_certified_yield_ksi and mtr_certified_tensile_ksi both meet the spec minima (SA-516-70: 38/70, SA-240-304L: 25/70, SA-105: 36/70, SA-179: 26/47), and a Part may only be issued from a MaterialHeat whose status is ACCEPTED, with a heat form that suits the part component_type (SHELL and HEAD require form = PLATE, NOZZLE requires PIPE, TUBESHEET requires FORGING or PLATE, FLANGE requires FORGING)"
    error_id: "ERR_MTR_BELOW_SPEC_MINIMUM | ERR_HEAT_NOT_ACCEPTED | ERR_MATERIAL_FORM_MISMATCH"
    http_status: 409
    applies_to: "POST /material-heats/{heat_id}/mtr-review, POST /vessel-jobs/{job_id}/parts"
  - priority: 68
    category: business_safety
    check: "Design adequacy: thickness_nominal_in must be at least thickness_required_in for the sheet being submitted or revised"
    error_id: ERR_INSUFFICIENT_WALL_THICKNESS
    http_status: 409
    applies_to: "POST /design-calculations/{calculation_id}/submit"
  - priority: 69
    category: business_safety
    check: "Weld map integrity at release: the job must carry at least one ProductionWeld, no PLANNED joint may reference a SCRAPPED Part, and when the job's governing_joint_efficiency = 1.00 every joint_category A joint must have joint_type = BUTT because a full-radiography claim cannot be honoured on a non-butt main seam"
    error_id: "ERR_EMPTY_WELD_MAP | ERR_PART_SCRAPPED | ERR_JOINT_TYPE_NOT_PERMITTED"
    http_status: 409
    applies_to: "POST /vessel-jobs/{job_id}/weld-map-release"
  - priority: 70
    category: business_safety
    check: "Examination adequacy: the weld map may not be released while any joint lacks a resolved required_volumetric_pct, and a job may not enter TESTING while any ProductionWeld has nde_status other than ACCEPTED or NOT_PLANNED-with-zero-coverage"
    error_id: ERR_NDE_INCOMPLETE
    http_status: 409
    applies_to: "POST /vessel-jobs/{job_id}/weld-map-release, POST /pressure-tests"
  - priority: 72
    category: business_safety
    check: "Heat-treatment adequacy: every joint whose WPS requires PWHT must sit in a COMPLETE PWHTBatch with an uploaded chart before a pressure test may be created, and actual_soak_minutes must reach required_soak_minutes before a batch may complete"
    error_id: "ERR_PWHT_INCOMPLETE | ERR_SOAK_TIME_INSUFFICIENT | ERR_CHART_RECORD_MISSING"
    http_status: 409
    applies_to: "POST /pwht-batches/{batch_id}/complete, POST /pressure-tests"
  - priority: 74
    category: business_safety
    check: "Test adequacy: ai_witness_confirmed must be true before a result is recorded, and for a PASS observed_pressure_psi must reach test_pressure_psi, observed_hold_minutes must reach min_hold_minutes, and test_medium_temp_f must reach min_medium_temp_f"
    error_id: "ERR_AI_WITNESS_REQUIRED | ERR_TEST_PRESSURE_INSUFFICIENT | ERR_HOLD_TIME_INSUFFICIENT | ERR_MEDIUM_TEMP_TOO_LOW"
    http_status: 409
    applies_to: "POST /pressure-tests/{test_id}/result"
  - priority: 76
    category: business_safety
    check: "Open-nonconformance and concurrence gating: a job with nonconformance_open_count > 0 may not test, assemble a data report or stamp, and a USE_AS_IS disposition or its close requires a recorded Authorized Inspector concurrence"
    error_id: "ERR_OPEN_NONCONFORMANCE | ERR_AI_CONCURRENCE_REQUIRED"
    http_status: 409
    applies_to: "POST /pressure-tests, POST /pressure-tests/{test_id}/result, POST /vessel-jobs/{job_id}/data-report, POST /data-reports/{report_id}/submit-to-ai, POST /nonconformances/{nonconformance_id}/disposition, POST /nonconformances/{nonconformance_id}/close"
  - priority: 80
    category: business_referential
    check: "Referenced rows belong to the same aggregate: part_a_id, part_b_id, repair_of_weld_id and every weld_ids entry must belong to the job named in the path, the Nonconformance's weld must belong to its job, a PressureTest's job must own the welds it certifies, every Part must trace to a heat with a received mill test report, and a MaterialHeat may not be accepted at receiving inspection while its mtr_received flag is still false"
    error_id: "ERR_WELD_NOT_IN_JOB | ERR_PART_NOT_IN_JOB | ERR_TRACEABILITY_INCOMPLETE"
    http_status: 409
    applies_to: "POST /material-heats/{heat_id}/mtr-review, POST /vessel-jobs/{job_id}/production-welds, POST /pwht-batches, POST /nonconformances/{nonconformance_id}/repair-welds, POST /vessel-jobs/{job_id}/data-report"
  - priority: 85
    category: business_uniqueness
    check: "Scoped uniqueness: cert_number is globally unique, stamp_initials is unique across Personnel, job_number is globally unique, heat_number is unique per spec, wps_number is globally unique, (welder_stamp, wps_id) is unique, (job_id, weld_number) is unique, chart_record_number is globally unique, and nameplate_serial is unique across DataReport"
    error_id: "ERR_DUPLICATE_CERT_NUMBER | ERR_DUPLICATE_STAMP_INITIALS | ERR_DUPLICATE_JOB_NUMBER | ERR_DUPLICATE_HEAT_NUMBER | ERR_DUPLICATE_WPS_NUMBER | ERR_DUPLICATE_WELDER_QUALIFICATION | ERR_DUPLICATE_WELD_NUMBER | ERR_DUPLICATE_CHART_RECORD_NUMBER | ERR_DUPLICATE_NAMEPLATE_SERIAL"
    http_status: 409
    applies_to: "all create endpoints"
  - priority: 88
    category: business_constraint
    check: "Domain limits and applicability: a joint may be repaired at most REPAIR_LIMIT (2) times, a PWHT batch must name at least one weld, a pressure test test_side must be a member of the job required_test_sides (TUBE_SIDE exists only for a HEAT_EXCHANGER), a PNEUMATIC pressure test requires the parent job pneumatic_justification to be non-blank, a data report may only be submitted to the Authorized Inspector at completeness_score = 100.00, and a renewal requires the ShopAudit it names to be CLOSED with satisfactory = true"
    error_id: "ERR_REPAIR_LIMIT_EXCEEDED | ERR_EMPTY_WELD_SET | ERR_TEST_SIDE_NOT_APPLICABLE | ERR_PNEUMATIC_JUSTIFICATION_REQUIRED | ERR_DATA_PACKAGE_INCOMPLETE | ERR_RENEWAL_AUDIT_NOT_SATISFACTORY"
    http_status: 409
    applies_to: "POST /nonconformances/{nonconformance_id}/disposition, POST /nonconformances/{nonconformance_id}/repair-welds, POST /pwht-batches, POST /pressure-tests, POST /data-reports/{report_id}/submit-to-ai, POST /certificates/{certificate_id}/renewals"
  - priority: 90
    category: business_fiscal
    check: "Material mass ledger: issued_quantity_lb must not exceed the heat's quantity_remaining_lb"
    error_id: ERR_INSUFFICIENT_HEAT_QUANTITY
    http_status: 409
    applies_to: "POST /vessel-jobs/{job_id}/parts"
  - priority: 100
    category: business_temporal
    check: |
      Resource scheduling, with COOLDOWN_BUFFER_MINUTES = 180 and HYDRO_BAY_CAPACITY = 2.
      PWHT furnace (closed interval plus cooldown): a requested [scheduled_start,
      scheduled_end] conflicts with an existing SCHEDULED or IN_PROGRESS batch in the same
      furnace_code when scheduled_start < existing.scheduled_end + 180 minutes AND
      scheduled_end > existing.scheduled_start - 180 minutes. A window starting exactly
      180 minutes after an existing charge ends is admitted; 179 minutes is refused.
      ABORTED and COMPLETE batches never conflict, and a different furnace_code never conflicts.
      Pressure-test bay (half-open interval [scheduled_start, scheduled_end)): two windows
      overlap when new.scheduled_start < existing.scheduled_end AND new.scheduled_end >
      existing.scheduled_start, so a window starting exactly at an existing window's end
      does not overlap. Within one test_bay_code, counting only tests with result = PENDING,
      at most 2 HYDROSTATIC tests may overlap and a PNEUMATIC test must overlap nothing at all
      (neither another pneumatic nor any hydrostatic test).
    error_id: "ERR_FURNACE_WINDOW_CONFLICT | ERR_TEST_BAY_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /pwht-batches, POST /pressure-tests"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Personnel and logical clock ---------------------------------------
  - method: POST
    path: "/personnel"
    description: "Register a shop person and the single functional role they may act as. The returned id is the value callers put in X-User-ID."
    roles: [ShopAdmin]
    code: 201
    input: ["full_name", "role_code", "stamp_initials", "ai_agency?"]
    output: Personnel
    side_effects: ["none; Personnel is immutable and has no version field"]
  - method: GET
    path: "/personnel/{personnel_id}"
    description: "Fetch one person."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: Personnel
    side_effects: []
  - method: GET
    path: "/personnel"
    description: "List people, optionally filtered by functional role."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["role_code?", "limit?", "offset?"]
    output: Personnel[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every expiry, continuity and window rule reads this clock."
    roles: [ShopAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "recomputes welder_continuity_status for every WelderQualification, moving rows across the 180-day boundary in both directions"
      - "recomputes certificate_posture for every CertificateOfAuthorization, moving rows past expires_on to EXPIRED"
      - "cascades every newly unauthorized certificate onto its jobs' AI_SIGNED DataReports (-> STAMP_HOLD)"
      - "response body carries { current_utc, welder_qualifications_recomputed, certificates_recomputed }"

  # --- Certificate of Authorization and shop audits ----------------------
  - method: POST
    path: "/certificates"
    description: "Record a Certificate of Authorization and the code stamp scopes it confers."
    roles: [ShopAdmin]
    code: 201
    input: [cert_number, scope_codes, issued_on, expires_on]
    output: CertificateOfAuthorization
    side_effects: ["status and stamping_authorized derived by calculations.certificate_posture", "version starts at 1"]
  - method: GET
    path: "/certificates/{certificate_id}"
    description: "Fetch one certificate, including its current posture and version for OCC."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: CertificateOfAuthorization
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List certificates."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["status?", "cert_number?", "limit?", "offset?"]
    output: CertificateOfAuthorization[]
    side_effects: []
  - method: POST
    path: "/certificates/{certificate_id}/renewals"
    description: "Renew the certificate on the strength of a satisfactory closed audit, clearing the accumulated finding counters."
    roles: [ShopAdmin]
    code: 200
    input: [expected_certificate_version, renewal_audit_id, new_expires_on]
    output: CertificateOfAuthorization
    side_effects:
      - "expires_on = new_expires_on; renewal_count += 1"
      - "open_major_findings_count and open_minor_findings_count reset to 0"
      - "status and stamping_authorized re-derived (PROBATION, SUSPENDED or EXPIRED -> ACTIVE)"
      - "every STAMP_HOLD DataReport under this certificate returns to AI_SIGNED when its job has no open nonconformance"
      - "increments CertificateOfAuthorization.version by 1"
  - method: POST
    path: "/shop-audits"
    description: "Schedule a quality-system audit against a certificate."
    roles: [ShopAdmin]
    code: 201
    input: [certificate_id, audit_type, scheduled_date]
    output: ShopAudit
    side_effects: ["status = SCHEDULED", "version starts at 1"]
  - method: GET
    path: "/shop-audits/{audit_id}"
    description: "Fetch one audit with its finding counts."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: ShopAudit
    side_effects: []
  - method: GET
    path: "/shop-audits"
    description: "List audits, filterable by the certificate they belong to."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["certificate_id?", "status?", "audit_type?", "limit?", "offset?"]
    output: ShopAudit[]
    side_effects: []
  - method: POST
    path: "/shop-audits/{audit_id}/close"
    description: "Close an audit with its findings; the findings immediately reshape the parent certificate's posture."
    roles: [ShopAdmin]
    code: 200
    input: [closed_on, findings]
    output: ShopAudit
    side_effects:
      - "major_finding_count, minor_finding_count and satisfactory derived from the findings array"
      - "cascade link 1: the parent certificate absorbs the counts and re-derives status and stamping_authorized"
      - "cascade link 2: stamping_authorized false pushes every AI_SIGNED DataReport under this certificate to STAMP_HOLD"
      - "increments ShopAudit.version by 1"

  # --- Vessel jobs -------------------------------------------------------
  - method: POST
    path: "/vessel-jobs"
    description: "Open a vessel or heat-exchanger job under a certificate."
    roles: [ShopAdmin]
    code: 201
    input: ["certificate_id", "job_number", "customer_name", "vessel_type", "design_code", "mawp_psi", "design_temp_f", "mdmt_f", "inside_radius_in", "stress_ratio?", "pneumatic_justification?"]
    output: VesselJob
    side_effects:
      - "status = DRAFT"
      - "required_components = [SHELL, HEAD] for PRESSURE_VESSEL, [SHELL, HEAD, TUBESHEET] for HEAT_EXCHANGER"
      - "required_test_sides = [SHELL_SIDE] for PRESSURE_VESSEL, [SHELL_SIDE, TUBE_SIDE] for HEAT_EXCHANGER"
      - "version starts at 1"
  - method: GET
    path: "/vessel-jobs/{job_id}"
    description: "Fetch one job with its posture, derived percentages and version for OCC."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: VesselJob
    side_effects: []
  - method: GET
    path: "/vessel-jobs"
    description: "List jobs, filterable by the certificate they are built under."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["certificate_id?", "status?", "vessel_type?", "limit?", "offset?"]
    output: VesselJob[]
    side_effects: []
  - method: POST
    path: "/vessel-jobs/{job_id}/cancel"
    description: "Cancel a job that has not been stamped, unwinding every child record."
    roles: [ShopAdmin]
    code: 200
    input: [cancel_reason]
    output: VesselJob
    side_effects:
      - "status = CANCELLED"
      - "DesignCalculation rows in {DRAFT, SUBMITTED, APPROVED} -> SUPERSEDED"
      - "Part rows in ISSUED -> SCRAPPED, returning issued_quantity_lb to their heats and lifting DEPLETED heats back to ACCEPTED"
      - "PWHTBatch rows in {SCHEDULED, IN_PROGRESS} -> ABORTED, clearing pwht_batch_id and returning batched welds to pwht_status PENDING"
      - "Nonconformance rows in {OPEN, REPAIR, USE_AS_IS} -> CLOSED; nonconformance_open_count -> 0"
      - "DataReport rows in {ASSEMBLING, READY_FOR_AI, AI_SIGNED, STAMP_HOLD} -> VOIDED"
      - "increments VesselJob.version by 1"

  # --- Design calculations ------------------------------------------------
  - method: POST
    path: "/vessel-jobs/{job_id}/design-calculations"
    description: "Prepare a code calculation sheet for one pressure component. A sheet for a component that already has one supersedes it and returns the job to DRAFT, which is why the call is OCC-guarded on the job."
    roles: [DesignEngineer]
    code: 201
    input: [expected_job_version, component, rt_extent_declared, allowable_stress_psi, corrosion_allowance_in, thickness_nominal_in]
    output: DesignCalculation
    side_effects:
      - "prepared_by_personnel_id = X-User-ID; status = DRAFT; revision = prior revision + 1 (1 when no prior sheet)"
      - "joint_efficiency resolved by calculations.joint_efficiency_resolution"
      - "thickness_circumferential_in, thickness_longitudinal_in, thickness_required_in and governing_variant resolved by calculations.required_wall_thickness"
      - "any prior DRAFT, SUBMITTED or APPROVED sheet for the same component becomes SUPERSEDED and the job returns to DRAFT"
      - "increments VesselJob.version by 1"
  - method: GET
    path: "/design-calculations/{calculation_id}"
    description: "Fetch one calculation sheet with both thickness variants and the governing selection."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: DesignCalculation
    side_effects: []
  - method: GET
    path: "/design-calculations"
    description: "List calculation sheets, filterable by job and by the engineers who prepared or reviewed them."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "prepared_by_personnel_id?", "reviewed_by_personnel_id?", "component?", "status?", "limit?", "offset?"]
    output: DesignCalculation[]
    side_effects: []
  - method: POST
    path: "/design-calculations/{calculation_id}/submit"
    description: "Submit a draft sheet for independent design review."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: DesignCalculation
    side_effects: ["status = SUBMITTED", "cascade: job DRAFT -> DESIGN_REVIEW", "increments DesignCalculation.version by 1"]
  - method: POST
    path: "/design-calculations/{calculation_id}/approve"
    description: "Approve a submitted sheet. The reviewer must be a different DesignEngineer from the preparer."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: DesignCalculation
    side_effects:
      - "status = APPROVED; reviewed_by_personnel_id = X-User-ID"
      - "cascade: job DESIGN_REVIEW -> FAB_PLANNING and design_release_at set once every required component is APPROVED"
      - "job.governing_joint_efficiency = min(joint_efficiency) over APPROVED sheets"
      - "increments DesignCalculation.version by 1"
  - method: POST
    path: "/design-calculations/{calculation_id}/reject"
    description: "Reject a submitted sheet with a reason. The reviewer must be a different DesignEngineer from the preparer."
    roles: [DesignEngineer]
    code: 200
    input: [reject_reason]
    output: DesignCalculation
    side_effects: ["status = REJECTED; reviewed_by_personnel_id = X-User-ID; reject_reason stored", "cascade: job DESIGN_REVIEW -> DRAFT", "increments DesignCalculation.version by 1"]
  - method: POST
    path: "/design-calculations/{calculation_id}/revise"
    description: "Reopen a rejected sheet with fresh design inputs, incrementing its revision and re-running both thickness variants."
    roles: [DesignEngineer]
    code: 200
    input: [rt_extent_declared, allowable_stress_psi, corrosion_allowance_in, thickness_nominal_in]
    output: DesignCalculation
    side_effects:
      - "status = DRAFT; revision += 1; reviewed_by_personnel_id and reject_reason cleared"
      - "joint_efficiency and every thickness field recomputed from the new inputs"
      - "increments DesignCalculation.version by 1"

  # --- Material traceability ---------------------------------------------
  - method: POST
    path: "/material-heats"
    description: "Receive a heat of material with its mill test report values."
    roles: [QCInspector]
    code: 201
    input: [heat_number, spec, form, mtr_received, mtr_certified_yield_ksi, mtr_certified_tensile_ksi, quantity_received_lb]
    output: MaterialHeat
    side_effects:
      - "status = QUARANTINE; material_class and p_number derived from spec"
      - "quantity_issued_lb = 0.00; quantity_remaining_lb = quantity_received_lb"
      - "version starts at 1"
  - method: GET
    path: "/material-heats/{heat_id}"
    description: "Fetch one heat with its mass ledger."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: MaterialHeat
    side_effects: []
  - method: GET
    path: "/material-heats"
    description: "List received heats."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["spec?", "status?", "heat_number?", "limit?", "offset?"]
    output: MaterialHeat[]
    side_effects: []
  - method: POST
    path: "/material-heats/{heat_id}/mtr-review"
    description: "Accept or reject a quarantined heat against its mill test report."
    roles: [QCInspector]
    code: 200
    input: [decision, "reason?"]
    output: MaterialHeat
    side_effects: ["status = ACCEPTED or REJECTED", "increments MaterialHeat.version by 1"]
  - method: POST
    path: "/vessel-jobs/{job_id}/parts"
    description: "Issue a piece of material from an accepted heat to a job, drawing down the heat's mass ledger."
    roles: [WeldingEngineer]
    code: 201
    input: [heat_id, part_mark, component_type, issued_quantity_lb]
    output: Part
    side_effects:
      - "status = ISSUED; heat_traceability_complete derived from heat.mtr_received and heat.status"
      - "heat.quantity_issued_lb and heat.quantity_remaining_lb recomputed by calculations.material_balance"
      - "heat.status ACCEPTED -> DEPLETED when quantity_remaining_lb reaches exactly 0.00"
      - "increments MaterialHeat.version by 1"
  - method: GET
    path: "/parts/{part_id}"
    description: "Fetch one issued piece."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: GET
    path: "/parts"
    description: "List pieces, filterable by job and by the heat they were cut from."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "heat_id?", "component_type?", "status?", "limit?", "offset?"]
    output: Part[]
    side_effects: []
  - method: POST
    path: "/parts/{part_id}/scrap"
    description: "Scrap an issued piece, compensating the heat's mass ledger."
    roles: [WeldingEngineer]
    code: 200
    input: [scrap_reason]
    output: Part
    side_effects:
      - "status = SCRAPPED; scrap_reason stored"
      - "heat.quantity_issued_lb and quantity_remaining_lb recomputed; the mass invariant received = remaining + issued holds again"
      - "heat.status DEPLETED -> ACCEPTED when quantity_remaining_lb rises above 0.00"
      - "increments MaterialHeat.version by 1"

  # --- Welding procedures and welder qualifications -----------------------
  - method: POST
    path: "/wps"
    description: "Draft a welding procedure specification."
    roles: [WeldingEngineer]
    code: 201
    input: [wps_number, process, base_metal_p_number, filler_f_number, thickness_min_in, thickness_max_in, position, pwht_required, preheat_min_f, supporting_pqr_number]
    output: WPS
    side_effects: ["status = DRAFT", "version starts at 1"]
  - method: GET
    path: "/wps/{wps_id}"
    description: "Fetch one procedure specification."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: WPS
    side_effects: []
  - method: GET
    path: "/wps"
    description: "List procedure specifications."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["process?", "status?", "limit?", "offset?"]
    output: WPS[]
    side_effects: []
  - method: POST
    path: "/wps/{wps_id}/qualify"
    description: "Qualify a drafted procedure against its supporting procedure qualification record."
    roles: [WeldingEngineer]
    code: 200
    input: []
    output: WPS
    side_effects: ["status = QUALIFIED", "increments WPS.version by 1"]
  - method: POST
    path: "/welder-qualifications"
    description: "Record a welder's performance qualification against a procedure."
    roles: [WeldingEngineer]
    code: 201
    input: [welder_stamp, welder_name, wps_id, position_qualified, thickness_range_max_in, qualified_on]
    output: WelderQualification
    side_effects:
      - "last_continuity_date = qualified_on; days_since_continuity and status derived by calculations.welder_continuity_status"
      - "version starts at 1"
  - method: GET
    path: "/welder-qualifications/{qualification_id}"
    description: "Fetch one welder qualification with its continuity posture recomputed against the current logical clock."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: WelderQualification
    side_effects: ["days_since_continuity and status re-derived on read"]
  - method: GET
    path: "/welder-qualifications"
    description: "List welder qualifications, filterable by the procedure they qualify against."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["wps_id?", "welder_stamp?", "status?", "limit?", "offset?"]
    output: WelderQualification[]
    side_effects: []
  - method: POST
    path: "/welder-qualifications/{qualification_id}/continuity-logs"
    description: "Log a day on which the welder used the process, restoring continuity and reinstating a lapsed qualification."
    roles: [WeldingEngineer]
    code: 200
    input: [continuity_date, process]
    output: WelderQualification
    side_effects: ["last_continuity_date = continuity_date; days_since_continuity recomputed; status LAPSED -> QUALIFIED when the gap is back inside 180 days", "increments WelderQualification.version by 1"]

  # --- Production weld map ------------------------------------------------
  - method: POST
    path: "/vessel-jobs/{job_id}/production-welds"
    description: "Add a joint to the job's production weld map, sizing its examination requirement at creation time."
    roles: [WeldingEngineer]
    code: 201
    input: [weld_number, joint_category, joint_type, thickness_in, wps_id, "part_b_id?", part_a_id]
    output: ProductionWeld
    side_effects:
      - "fab_status = PLANNED; nde_status = NOT_PLANNED; repair_generation = 0"
      - "pwht_status = PENDING when the cited WPS has pwht_required = true, else NOT_REQUIRED"
      - "required_volumetric_pct, volumetric_method and required_surface_method resolved by calculations.nde_coverage_requirement"
      - "job.weld_completion_pct recomputed"
  - method: GET
    path: "/production-welds/{weld_id}"
    description: "Fetch one joint with all three of its state dimensions."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: ProductionWeld
    side_effects: []
  - method: GET
    path: "/production-welds"
    description: "List joints, filterable by job, procedure, either joined piece, the welder qualification recorded against them, the joint they repair, and the heat-treatment charge they sit in."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "wps_id?", "part_a_id?", "part_b_id?", "welder_qualification_id?", "repair_of_weld_id?", "pwht_batch_id?", "joint_category?", "fab_status?", "nde_status?", "pwht_status?", "limit?", "offset?"]
    output: ProductionWeld[]
    side_effects: []
  - method: POST
    path: "/production-welds/{weld_id}/complete"
    description: "Record that a qualified welder has welded the joint."
    roles: [WeldingEngineer]
    code: 200
    input: [welder_qualification_id, welded_at]
    output: ProductionWeld
    side_effects:
      - "fab_status = WELDED; welder_qualification_id and welded_at stored"
      - "nde_status and pwht_status are untouched by this call"
      - "job.weld_completion_pct recomputed"
      - "increments ProductionWeld.version by 1"
  - method: POST
    path: "/vessel-jobs/{job_id}/weld-map-release"
    description: "Release the weld map for fabrication once every planned joint traces to accepted material and sits inside its procedure's thickness range."
    roles: [WeldingEngineer]
    code: 200
    input: []
    output: VesselJob
    side_effects: ["status FAB_PLANNING -> FABRICATION", "increments VesselJob.version by 1"]

  # --- Nondestructive examination ----------------------------------------
  - method: POST
    path: "/vessel-jobs/{job_id}/nde-plan"
    description: "Run the examination plan over the job's welded, unplanned joints and create the examinations they owe. Permitted while the job is FABRICATION or NDE_HOLD, so a repair joint can be planned without releasing the hold. Returns the examinations created by this invocation, in creation order."
    roles: [QCInspector]
    code: 201
    input: []
    output: NDEExam[]
    side_effects:
      - "one NDEExam per owed method is created with result = PENDING and required_coverage_pct from calculations.nde_coverage_requirement"
      - "every selected joint moves nde_status NOT_PLANNED -> PLANNED; a joint already at REJECTED is never re-planned in place, its coverage is re-earned through a repair joint"
      - "joints already past NOT_PLANNED are skipped, so re-running the plan never duplicates an examination"
      - "increments ProductionWeld.version by 1 for each selected joint"
  - method: GET
    path: "/nde-exams/{exam_id}"
    description: "Fetch one examination record."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: NDEExam
    side_effects: []
  - method: GET
    path: "/nde-exams"
    description: "List examinations, filterable by the joint they cover and the examiner who signed them."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["weld_id?", "examiner_personnel_id?", "method?", "exam_class?", "result?", "limit?", "offset?"]
    output: NDEExam[]
    side_effects: []
  - method: POST
    path: "/nde-exams/{exam_id}/result"
    description: "Record the outcome of a pending examination. A rejection opens a nonconformance and freezes the job."
    roles: [QCInspector]
    code: 200
    input: [result, examined_coverage_pct, indications_count, exam_date]
    output: NDEExam
    side_effects:
      - "result, examiner_personnel_id, exam_date and examined_coverage_pct stored"
      - "ACCEPT: weld.nde_status -> ACCEPTED once every examination of the joint reads ACCEPT"
      - "REJECT: weld.nde_status -> REJECTED, a Nonconformance (source = NDE_REJECT) opens, job FABRICATION -> NDE_HOLD, and every AI_SIGNED DataReport of the job -> STAMP_HOLD"
      - "job.weld_completion_pct and every DataReport's section_scores and completeness_score recomputed"
      - "increments NDEExam.version by 1"

  # --- Nonconformance and repair -----------------------------------------
  - method: GET
    path: "/nonconformances/{nonconformance_id}"
    description: "Fetch one nonconformance report."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: Nonconformance
    side_effects: []
  - method: GET
    path: "/nonconformances"
    description: "List nonconformance reports, filterable by job, by the joint they were raised against, and by the Authorized Inspector who concurred with a use-as-is disposition."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "weld_id?", "ai_concurrence_personnel_id?", "source?", "severity?", "disposition?", "limit?", "offset?"]
    output: Nonconformance[]
    side_effects: []
  - method: POST
    path: "/nonconformances/{nonconformance_id}/disposition"
    description: "Disposition an open nonconformance as REPAIR or USE_AS_IS. A use-as-is disposition must be taken by an Authorized Inspector, whose concurrence it records."
    roles: [QCInspector, AuthorizedInspector]
    code: 200
    input: [disposition, disposition_notes]
    output: Nonconformance
    side_effects:
      - "disposition and disposition_notes stored"
      - "USE_AS_IS: ai_concurrence_personnel_id = X-User-ID"
      - "the report stays inside the job's nonconformance_open_count either way"
      - "increments Nonconformance.version by 1"
  - method: POST
    path: "/nonconformances/{nonconformance_id}/repair-welds"
    description: "Create the repair joint for a nonconformance dispositioned REPAIR, inheriting the geometry of the rejected joint and always owing full volumetric examination."
    roles: [WeldingEngineer]
    code: 201
    input: [weld_number, wps_id]
    output: ProductionWeld
    side_effects:
      - "a ProductionWeld is created with repair_of_weld_id = nonconformance.weld_id, repair_generation = parent repair_generation + 1, and the parent's joint_category, joint_type, thickness_in, part_a_id and part_b_id"
      - "required_volumetric_pct = 100 because repair joints are always fully examined"
      - "fab_status = PLANNED; nde_status = NOT_PLANNED"
      - "job.weld_completion_pct recomputed"
  - method: POST
    path: "/nonconformances/{nonconformance_id}/close"
    description: "Close a dispositioned nonconformance once its repair has been accepted or its use-as-is concurrence is on file, compensating the job's open count."
    roles: [QCInspector]
    code: 200
    input: []
    output: Nonconformance
    side_effects:
      - "disposition = CLOSED; closed_at stored"
      - "job.nonconformance_open_count -= 1 and, at 0, job NDE_HOLD -> FABRICATION"
      - "every STAMP_HOLD DataReport of the job returns to AI_SIGNED when the certificate still authorizes stamping"
      - "increments Nonconformance.version by 1"

  # --- Post-weld heat treatment ------------------------------------------
  - method: POST
    path: "/pwht-batches"
    description: "Schedule a furnace charge over a set of welded joints, sizing the soak from the thickest joint in the charge."
    roles: [WeldingEngineer]
    code: 201
    input: [job_id, furnace_code, scheduled_start, scheduled_end, soak_temp_f, weld_ids]
    output: PWHTBatch
    side_effects:
      - "status = SCHEDULED; scheduled_by_personnel_id = X-User-ID; weld_count = len(weld_ids)"
      - "governing_thickness_in and required_soak_minutes derived by calculations.pwht_soak_requirement"
      - "every named weld has pwht_batch_id set to this batch"
      - "increments ProductionWeld.version by 1 for each named weld"
  - method: GET
    path: "/pwht-batches/{batch_id}"
    description: "Fetch one furnace charge with its soak requirement and chart record."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: PWHTBatch
    side_effects: []
  - method: GET
    path: "/pwht-batches"
    description: "List furnace charges, filterable by job, by the engineer who scheduled them, and by the engineer who reviewed the chart."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "scheduled_by_personnel_id?", "chart_reviewed_by_personnel_id?", "furnace_code?", "status?", "limit?", "offset?"]
    output: PWHTBatch[]
    side_effects: []
  - method: POST
    path: "/pwht-batches/{batch_id}/start"
    description: "Charge the furnace."
    roles: [WeldingEngineer]
    code: 200
    input: []
    output: PWHTBatch
    side_effects: ["status = IN_PROGRESS", "every batched weld pwht_status PENDING -> IN_PROGRESS", "increments PWHTBatch.version by 1"]
  - method: POST
    path: "/pwht-batches/{batch_id}/complete"
    description: "Close out a furnace charge against its chart record. The reviewing engineer must differ from the engineer who scheduled the charge."
    roles: [WeldingEngineer]
    code: 200
    input: [actual_soak_minutes, chart_record_number, chart_uploaded]
    output: PWHTBatch
    side_effects:
      - "status = COMPLETE; chart_reviewed_by_personnel_id = X-User-ID"
      - "every batched weld pwht_status IN_PROGRESS -> COMPLETE"
      - "job.weld_completion_pct and every DataReport's PWHT section recomputed"
      - "increments PWHTBatch.version by 1"

  # --- Pressure testing ---------------------------------------------------
  - method: POST
    path: "/pressure-tests"
    description: "Schedule a hydrostatic or pneumatic test in a bay, sizing pressure, hold and medium temperature from the medium chosen."
    roles: [QCInspector]
    code: 201
    input: [job_id, test_side, test_type, test_bay_code, scheduled_start, scheduled_end]
    output: PressureTest
    side_effects:
      - "result = PENDING; ai_witness_confirmed = false"
      - "test_pressure_psi, min_hold_minutes and min_medium_temp_f derived by calculations.test_pressure"
      - "cascade: job FABRICATION -> TESTING"
      - "increments VesselJob.version by 1"
  - method: GET
    path: "/pressure-tests/{test_id}"
    description: "Fetch one pressure test with its required and observed values."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: PressureTest
    side_effects: []
  - method: GET
    path: "/pressure-tests"
    description: "List pressure tests, filterable by job and by the Authorized Inspector who witnessed them."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "witnessed_by_personnel_id?", "test_bay_code?", "test_side?", "test_type?", "result?", "limit?", "offset?"]
    output: PressureTest[]
    side_effects: []
  - method: POST
    path: "/pressure-tests/{test_id}/witness"
    description: "Record the Authorized Inspector's witness of the test."
    roles: [AuthorizedInspector]
    code: 200
    input: []
    output: PressureTest
    side_effects: ["ai_witness_confirmed = true; witnessed_by_personnel_id = X-User-ID", "increments PressureTest.version by 1"]
  - method: POST
    path: "/pressure-tests/{test_id}/result"
    description: "Record the observed pressure, hold time and medium temperature and settle the test."
    roles: [QCInspector]
    code: 200
    input: [result, observed_pressure_psi, observed_hold_minutes, test_medium_temp_f]
    output: PressureTest
    side_effects:
      - "result, observed_pressure_psi, observed_hold_minutes and test_medium_temp_f stored"
      - "PASS: job TESTING -> DATA_PACKAGE once the latest test of every required side has passed"
      - "FAIL: a Nonconformance (source = PRESSURE_TEST_FAIL, severity = MAJOR) opens and the job returns to NDE_HOLD"
      - "every DataReport of the job re-derives its TEST section and completeness_score"
      - "increments PressureTest.version by 1"

  # --- Data package, manufacturer's data report and nameplate ------------
  - method: POST
    path: "/vessel-jobs/{job_id}/data-report"
    description: "Assemble the manufacturer's data report for the job. A second assembly supersedes the first, which is why the call is OCC-guarded on the job."
    roles: [QCInspector, AuthorizedInspector]
    code: 201
    input: [expected_job_version, form_type]
    output: DataReport
    side_effects:
      - "status = ASSEMBLING; assembled_by_personnel_id = X-User-ID; mdr_number generated"
      - "section_scores, completeness_score and missing_items derived by calculations.data_package_completeness"
      - "any prior DataReport of the job in {ASSEMBLING, READY_FOR_AI} becomes VOIDED"
      - "increments VesselJob.version by 1"
  - method: GET
    path: "/data-reports/{report_id}"
    description: "Fetch one data report with its per-section scores and outstanding items."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: DataReport
    side_effects: ["section_scores, completeness_score and missing_items re-derived on read"]
  - method: GET
    path: "/data-reports"
    description: "List data reports, filterable by job, by the assembler, and by the Authorized Inspector who signed them."
    roles: [ShopAdmin, DesignEngineer, WeldingEngineer, QCInspector, AuthorizedInspector]
    code: 200
    input: ["job_id?", "assembled_by_personnel_id?", "ai_personnel_id?", "form_type?", "status?", "limit?", "offset?"]
    output: DataReport[]
    side_effects: []
  - method: POST
    path: "/data-reports/{report_id}/submit-to-ai"
    description: "Hand a complete data package to the Authorized Inspector."
    roles: [QCInspector, AuthorizedInspector]
    code: 200
    input: []
    output: DataReport
    side_effects: ["status = READY_FOR_AI; missing_items becomes empty", "increments DataReport.version by 1"]
  - method: POST
    path: "/data-reports/{report_id}/ai-sign"
    description: "Authorized Inspector signature on the manufacturer's data report. The signer must not be the person who assembled the package."
    roles: [AuthorizedInspector]
    code: 200
    input: []
    output: DataReport
    side_effects: ["status = AI_SIGNED; ai_personnel_id = X-User-ID; ai_signed_at stored", "increments DataReport.version by 1"]
  - method: POST
    path: "/data-reports/{report_id}/stamp-nameplate"
    description: "Apply the code symbol nameplate and close the job."
    roles: [ShopAdmin]
    code: 200
    input: [nameplate_serial]
    output: DataReport
    side_effects: ["status = STAMPED; nameplate_serial and nameplate_stamped_at stored", "cascade: job DATA_PACKAGE -> STAMPED", "increments DataReport.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not a declared role, or X-User-ID missing for an entity-backed role"
  - id: ERR_IDENTITY_ROLE_MISMATCH
    http: 403
    condition: "X-User-ID does not resolve to a Personnel row whose role_code matches the declared X-User-Role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The declared role is not in the endpoint's permitted-role list"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, undeclared enum value, non-positive quantity, out-of-range limit/offset, or a weld_ids array carrying duplicate ids (an empty weld_ids array passes this gate and is refused later by ERR_EMPTY_WELD_SET)"
  # --- existence ---
  - id: ERR_PERSONNEL_NOT_FOUND
    http: 404
    condition: "No Personnel row for the given id"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "No CertificateOfAuthorization for the given id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No ShopAudit for the given id, including a renewal_audit_id that names nothing"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "No VesselJob for the given id"
  - id: ERR_CALCULATION_NOT_FOUND
    http: 404
    condition: "No DesignCalculation for the given id"
  - id: ERR_HEAT_NOT_FOUND
    http: 404
    condition: "No MaterialHeat for the given id"
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "No Part for the given id, including part_a_id or part_b_id in a weld-map entry"
  - id: ERR_WPS_NOT_FOUND
    http: 404
    condition: "No WPS for the given id"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "No WelderQualification for the given id"
  - id: ERR_WELD_NOT_FOUND
    http: 404
    condition: "No ProductionWeld for the given id, including an entry of weld_ids"
  - id: ERR_EXAM_NOT_FOUND
    http: 404
    condition: "No NDEExam for the given id"
  - id: ERR_NONCONFORMANCE_NOT_FOUND
    http: 404
    condition: "No Nonconformance for the given id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No PWHTBatch for the given id"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "No PressureTest for the given id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No DataReport for the given id"
  # --- optimistic concurrency ---
  - id: ERR_STALE_JOB_VERSION
    http: 412
    condition: "expected_job_version does not match the VesselJob's current version"
  - id: ERR_STALE_CERTIFICATE_VERSION
    http: 412
    condition: "expected_certificate_version does not match the certificate's current version"
  # --- target and related state ---
  - id: ERR_INVALID_CERTIFICATE_STATE
    http: 409
    condition: "The certificate is not in a state from which this transition is declared"
  - id: ERR_INVALID_AUDIT_STATE
    http: 409
    condition: "The audit is not SCHEDULED, or closed_on precedes scheduled_date"
  - id: ERR_INVALID_JOB_STATE
    http: 409
    condition: "The job is not in the state this operation requires, including an attempt to act on a STAMPED or CANCELLED job"
  - id: ERR_INVALID_CALCULATION_STATE
    http: 409
    condition: "The calculation sheet is not in the state this transition requires, including a second submit or a revise of a non-REJECTED sheet"
  - id: ERR_INVALID_HEAT_STATE
    http: 409
    condition: "The heat is not QUARANTINE for an MTR review"
  - id: ERR_INVALID_PART_STATE
    http: 409
    condition: "The part is already SCRAPPED, or a welded joint still references it"
  - id: ERR_INVALID_WPS_STATE
    http: 409
    condition: "The procedure specification is not DRAFT for a qualify call"
  - id: ERR_INVALID_WELD_STATE
    http: 409
    condition: "The joint's fab, nde or pwht dimension is not in the state this operation requires"
  - id: ERR_INVALID_EXAM_STATE
    http: 409
    condition: "The examination is not PENDING, or its joint is not yet WELDED, or exam_date precedes the weld date"
  - id: ERR_INVALID_NONCONFORMANCE_STATE
    http: 409
    condition: "The nonconformance is not in the disposition this operation requires, including a close before its repair joint is accepted"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The furnace charge is not in the state this operation requires, or a batched joint is not yet WELDED, or soak_temp_f is outside the band for the batch p_number"
  - id: ERR_INVALID_TEST_STATE
    http: 409
    condition: "The pressure test is not PENDING, or a witness is recorded twice"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "The data report is not in the state this operation requires, including signing a STAMP_HOLD report or stamping an unsigned one"
  # --- compliance and safety ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting person is the same person who performed the paired earlier step (preparer approving their own sheet, scheduler reviewing their own chart, assembler signing their own data package)"
  - id: ERR_CERTIFICATE_EXPIRED
    http: 409
    condition: "The governing Certificate of Authorization has passed expires_on relative to the logical clock"
  - id: ERR_STAMPING_NOT_AUTHORIZED
    http: 403
    condition: "The governing certificate is unexpired but not ACTIVE, or still carries open major findings, so stamping_authorized is false"
  - id: ERR_WPS_NOT_QUALIFIED
    http: 409
    condition: "The cited procedure specification is still DRAFT"
  - id: ERR_THICKNESS_OUTSIDE_WPS_RANGE
    http: 409
    condition: "The joint thickness_in falls outside the cited procedure's [thickness_min_in, thickness_max_in]"
  - id: ERR_WELDER_NOT_QUALIFIED
    http: 409
    condition: "The cited welder qualification has LAPSED on the 180-day continuity rule"
  - id: ERR_QUALIFICATION_WPS_MISMATCH
    http: 409
    condition: "The cited welder qualification was earned against a different procedure specification than the joint cites"
  - id: ERR_THICKNESS_OUTSIDE_QUALIFICATION
    http: 409
    condition: "The joint thickness_in exceeds the welder qualification's thickness_range_max_in"
  - id: ERR_HEAT_NOT_ACCEPTED
    http: 409
    condition: "The heat is QUARANTINE, REJECTED or DEPLETED when a part issue is attempted"
  - id: ERR_MATERIAL_FORM_MISMATCH
    http: 409
    condition: "The heat's product form does not suit the part's component_type"
  - id: ERR_MTR_BELOW_SPEC_MINIMUM
    http: 409
    condition: "An ACCEPT decision is taken at receiving inspection while the mill test report's certified yield or tensile strength is below the minimum for the heat's spec"
  - id: ERR_INSUFFICIENT_WALL_THICKNESS
    http: 409
    condition: "thickness_nominal_in is below the calculated thickness_required_in"
  - id: ERR_EMPTY_WELD_MAP
    http: 409
    condition: "A weld-map release is attempted on a job with no ProductionWeld rows"
  - id: ERR_PART_SCRAPPED
    http: 409
    condition: "A PLANNED joint on the map references a SCRAPPED part at release time"
  - id: ERR_JOINT_TYPE_NOT_PERMITTED
    http: 409
    condition: "A full-radiography job carries a Category A joint whose joint_type is not BUTT"
  - id: ERR_NDE_INCOMPLETE
    http: 409
    condition: "Required examinations are unresolved: a release with an unsized joint, or a pressure test before every examination reads ACCEPT"
  - id: ERR_PWHT_INCOMPLETE
    http: 409
    condition: "A joint whose procedure requires post-weld heat treatment is not in a COMPLETE charge with an uploaded chart"
  - id: ERR_SOAK_TIME_INSUFFICIENT
    http: 409
    condition: "actual_soak_minutes is below required_soak_minutes for the charge"
  - id: ERR_CHART_RECORD_MISSING
    http: 409
    condition: "chart_uploaded is false or chart_record_number is blank at charge completion"
  - id: ERR_AI_WITNESS_REQUIRED
    http: 409
    condition: "A test result is recorded before the Authorized Inspector's witness"
  - id: ERR_TEST_PRESSURE_INSUFFICIENT
    http: 409
    condition: "observed_pressure_psi is below test_pressure_psi on a PASS"
  - id: ERR_HOLD_TIME_INSUFFICIENT
    http: 409
    condition: "observed_hold_minutes is below min_hold_minutes on a PASS"
  - id: ERR_MEDIUM_TEMP_TOO_LOW
    http: 409
    condition: "test_medium_temp_f is below min_medium_temp_f on a PASS"
  - id: ERR_OPEN_NONCONFORMANCE
    http: 409
    condition: "The job carries an open nonconformance where the operation requires none"
  - id: ERR_AI_CONCURRENCE_REQUIRED
    http: 409
    condition: "A USE_AS_IS disposition or its close lacks an Authorized Inspector's concurrence"
  # --- referential integrity within the aggregate ---
  - id: ERR_WELD_NOT_IN_JOB
    http: 409
    condition: "A referenced joint belongs to a different job than the one in the path or body"
  - id: ERR_PART_NOT_IN_JOB
    http: 409
    condition: "A referenced part belongs to a different job than the joint being mapped"
  - id: ERR_TRACEABILITY_INCOMPLETE
    http: 409
    condition: "A heat is accepted at receiving inspection while mtr_received = false, or a part on the job has heat_traceability_complete = false at weld-map release or data-package assembly"
  # --- uniqueness ---
  - id: ERR_DUPLICATE_CERT_NUMBER
    http: 409
    condition: "cert_number already exists"
  - id: ERR_DUPLICATE_STAMP_INITIALS
    http: 409
    condition: "stamp_initials already used by another Personnel row"
  - id: ERR_DUPLICATE_JOB_NUMBER
    http: 409
    condition: "job_number already exists"
  - id: ERR_DUPLICATE_HEAT_NUMBER
    http: 409
    condition: "heat_number already received for the same spec"
  - id: ERR_DUPLICATE_WPS_NUMBER
    http: 409
    condition: "wps_number already exists"
  - id: ERR_DUPLICATE_WELDER_QUALIFICATION
    http: 409
    condition: "The welder_stamp already carries a qualification against this procedure"
  - id: ERR_DUPLICATE_WELD_NUMBER
    http: 409
    condition: "weld_number already used on this job"
  - id: ERR_DUPLICATE_CHART_RECORD_NUMBER
    http: 409
    condition: "chart_record_number already recorded on another charge"
  - id: ERR_DUPLICATE_NAMEPLATE_SERIAL
    http: 409
    condition: "nameplate_serial already stamped on another vessel"
  # --- business constraints, ledger and scheduling ---
  - id: ERR_REPAIR_LIMIT_EXCEEDED
    http: 409
    condition: "A REPAIR disposition is taken on a joint whose repair_generation has already reached 2"
  - id: ERR_EMPTY_WELD_SET
    http: 409
    condition: "A furnace charge is scheduled with no welds"
  - id: ERR_TEST_SIDE_NOT_APPLICABLE
    http: 409
    condition: "test_side is not a member of the job's required_test_sides, e.g. TUBE_SIDE on a PRESSURE_VESSEL"
  - id: ERR_PNEUMATIC_JUSTIFICATION_REQUIRED
    http: 409
    condition: "A PNEUMATIC pressure test is scheduled for a job whose pneumatic_justification is null or blank"
  - id: ERR_DATA_PACKAGE_INCOMPLETE
    http: 409
    condition: "completeness_score is below 100.00 when the package is handed to the Authorized Inspector"
  - id: ERR_RENEWAL_AUDIT_NOT_SATISFACTORY
    http: 409
    condition: "The ShopAudit named by a renewal is not CLOSED with satisfactory = true"
  - id: ERR_INSUFFICIENT_HEAT_QUANTITY
    http: 409
    condition: "issued_quantity_lb exceeds the heat's quantity_remaining_lb"
  - id: ERR_FURNACE_WINDOW_CONFLICT
    http: 409
    condition: "The requested furnace window overlaps an existing charge or falls inside its 180-minute cooldown buffer"
  - id: ERR_TEST_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "The requested bay window exceeds two overlapping hydrostatic tests, or overlaps a pneumatic test that holds the bay exclusively"

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Quality manager and shop administration: maintains the certificate of authorization, schedules and closes quality-system audits, opens and cancels jobs, registers personnel, applies the code nameplate, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /personnel"
      - "POST /_clock/set_current_utc"
      - "POST /certificates"
      - "POST /certificates/{certificate_id}/renewals"
      - "POST /shop-audits"
      - "POST /shop-audits/{audit_id}/close"
      - "POST /vessel-jobs"
      - "POST /vessel-jobs/{job_id}/cancel"
      - "POST /data-reports/{report_id}/stamp-nameplate"
    shared_operations: ["every GET endpoint"]
  - name: DesignEngineer
    description: "Prepares and independently reviews code design calculations. Two distinct DesignEngineer people are required per component: one prepares, another approves or rejects."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /vessel-jobs/{job_id}/design-calculations"
      - "POST /design-calculations/{calculation_id}/submit"
      - "POST /design-calculations/{calculation_id}/approve"
      - "POST /design-calculations/{calculation_id}/reject"
      - "POST /design-calculations/{calculation_id}/revise"
    shared_operations: ["every GET endpoint"]
  - name: WeldingEngineer
    description: "Owns procedure specifications, welder qualifications, material issue, the production weld map, repair joints and furnace charges. Two distinct WeldingEngineer people are required per furnace charge: one schedules it, another reviews the chart."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /vessel-jobs/{job_id}/parts"
      - "POST /parts/{part_id}/scrap"
      - "POST /wps"
      - "POST /wps/{wps_id}/qualify"
      - "POST /welder-qualifications"
      - "POST /welder-qualifications/{qualification_id}/continuity-logs"
      - "POST /vessel-jobs/{job_id}/production-welds"
      - "POST /production-welds/{weld_id}/complete"
      - "POST /vessel-jobs/{job_id}/weld-map-release"
      - "POST /nonconformances/{nonconformance_id}/repair-welds"
      - "POST /pwht-batches"
      - "POST /pwht-batches/{batch_id}/start"
      - "POST /pwht-batches/{batch_id}/complete"
    shared_operations: ["every GET endpoint"]
  - name: QCInspector
    description: "Receiving inspection, examination planning and interpretation, nonconformance handling, pressure-test execution and data-package assembly."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /material-heats"
      - "POST /material-heats/{heat_id}/mtr-review"
      - "POST /vessel-jobs/{job_id}/nde-plan"
      - "POST /nde-exams/{exam_id}/result"
      - "POST /nonconformances/{nonconformance_id}/close"
      - "POST /pressure-tests"
      - "POST /pressure-tests/{test_id}/result"
    shared_operations:
      - "POST /nonconformances/{nonconformance_id}/disposition (shared with AuthorizedInspector; only an AuthorizedInspector may take USE_AS_IS)"
      - "POST /vessel-jobs/{job_id}/data-report (shared with AuthorizedInspector)"
      - "POST /data-reports/{report_id}/submit-to-ai (shared with AuthorizedInspector)"
      - "every GET endpoint"
  - name: AuthorizedInspector
    description: "Third-party Authorized Inspector: witnesses pressure tests, concurs with use-as-is dispositions, and signs the manufacturer's data report. May also assemble a data package, in which case the segregation-of-duties rule bars that same person from signing it."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /pressure-tests/{test_id}/witness"
      - "POST /data-reports/{report_id}/ai-sign"
    shared_operations:
      - "POST /nonconformances/{nonconformance_id}/disposition (shared with QCInspector; USE_AS_IS is reserved to this role)"
      - "POST /vessel-jobs/{job_id}/data-report (shared with QCInspector)"
      - "POST /data-reports/{report_id}/submit-to-ai (shared with QCInspector)"
      - "every GET endpoint"
