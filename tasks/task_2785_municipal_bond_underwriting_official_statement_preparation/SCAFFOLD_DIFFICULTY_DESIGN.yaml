              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id, deal_v: $.data.version }
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-1", is_preliminary: true, expected_deal_version: "${deal_v}" }
              as: BondCounsel
