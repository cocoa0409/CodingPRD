              as: Student
              as_user_id: "${stu1}"
              captures: { app1: $.data.id }
            - call: "POST /api/v1/applications/${app1}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app1}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app1}/commit"
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /api/v1/insurance-enrollments"
              payload: { application_id: "${app1}", provider: "GlobalCare", coverage_start_date: "2027-01-01T00:00:00Z", coverage_end_date: "2027-05-31T00:00:00Z" }
              as: Student
              as_user_id: "${stu1}"
            - call: "POST /api/v1/applications/${app1}/lifecycle"
              payload: { action: "DEPART" }
              as: ProgramCoordinator
