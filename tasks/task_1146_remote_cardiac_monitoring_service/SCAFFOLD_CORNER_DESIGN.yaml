  # ================================================================ validations
  - section: validations
    instances:
      - name: patient_create_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers yields 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/patients", payload: { full_name: "No Auth", date_of_birth: "1960-01-01", mrn: "MRN-3001", phone: "555-2000", insurance_plan: "MEDICARE" }, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 401 ERR_UNAUTHENTICATED"

      - name: unauthenticated_beats_not_found_on_episode_read
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "A request with no auth headers to a non-existent episode id returns 401 (auth tier 1), never 404 (existence tier 3)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/episodes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 401 ERR_UNAUTHENTICATED (not 404)"

      - name: billing_specialist_cannot_register_device_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "BillingSpecialist calling POST /v1/devices (InventoryManager-only) yields 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/devices", payload: { serial_number: "EV-3001", model: "EVENT" }, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 403 ERR_FORBIDDEN_ROLE"

      - name: device_category_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9] (ERR_DEVICE_CATEGORY_MISMATCH)"]
        distinguishing_aspect: "Enrollment reserving a HOLTER device against an EVENT order yields 422 ERR_DEVICE_CATEGORY_MISMATCH."
        test_recipe:
          setup: ["EVENT order; HOLTER device IN_STOCK"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Mismatch", date_of_birth: "1961-02-02", mrn: "MRN-3002", phone: "555-2001", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Mismatch", npi: "3000000002", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "HO-3002", model: "HOLTER" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 422 ERR_DEVICE_CATEGORY_MISMATCH; Device.${d_id}.status stays IN_STOCK"

      - name: device_not_in_stock_deployed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5] (ERR_DEVICE_NOT_IN_STOCK)"]
        distinguishing_aspect: "Reserving a DEPLOYED device for a second patient yields 409 ERR_DEVICE_NOT_IN_STOCK."
        test_recipe:
          setup: ["patient A episode MONITORING with device EV-3003 DEPLOYED; patient B with an EVENT order"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Stock A", date_of_birth: "1962-02-02", mrn: "MRN-3003", phone: "555-2002", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { pa_id: $.data.id } }
            - { call: "POST /v1/patients", payload: { full_name: "Stock B", date_of_birth: "1963-02-02", mrn: "MRN-3004", phone: "555-2003", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { pb_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Stock", npi: "3000000003", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-3003", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${pa_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { oa_id: $.data.id, oa_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${oa_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${oa_v}" }, as: EnrollmentCoordinator, captures: { ea_id: $.data.id } }
            - { call: "POST /v1/enrollments/${ea_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${ea_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${pb_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { ob_id: $.data.id, ob_v: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${ob_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${ob_v}" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 409 ERR_DEVICE_NOT_IN_STOCK (DEPLOYED is not reservable)"

      - name: duplicate_transmission_seq_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=9] (ERR_DUPLICATE_TRANSMISSION_SEQ)"]
        distinguishing_aspect: "Second transmission with seq_no 7 on the same episode yields 409 ERR_DUPLICATE_TRANSMISSION_SEQ."
        test_recipe:
