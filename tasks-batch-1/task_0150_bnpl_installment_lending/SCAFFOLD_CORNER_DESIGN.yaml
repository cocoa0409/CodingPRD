  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_default_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[loan-default-stale-version]"
          - state_machines.Loan.ACTIVE_to_DEFAULTED
        distinguishing_aspect: "POST /loans/{id}/default with the CURRENT expected_loan_version succeeds and the loan version increments by 1."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / loan_activation_depends_on_borrower_available_credit
          rationale: "The happy-path OCC bump is asserted by the default side-effect verified in the §1.9 default_delinquent_loan_writes_off_installments corner and the stale-version negatives above; no separate recipe needed."

      - name: clock_advance_recomputes_delinquency_to_late_then_delinquent
        claim_type: rate_threshold_triggers
        grounds: [calculations.delinquency_posture, calculations.late_fee_assessment]
        distinguishing_aspect: "At dpd 11 (2026-01-12) the loan is LATE; at dpd 31 (2026-02-01) it is DELINQUENT — the 30-day threshold is the boundary on the same oldest installment."
        test_recipe:
          setup: ["Loan A PAY_IN_4 financed 100000 activated 2026-01-01; inst#1 due 2026-01-01; no payments."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-12T00:00:00Z" }
              as: Servicer
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { dq_late: $.data.delinquency_status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Servicer
            - call: "GET /loans/${loan_a_id}"
              as: Servicer
              captures: { dq_del: $.data.delinquency_status }
          assert:
            - "at 2026-01-12 Loan.${loan_a_id}.delinquency_status == LATE"
            - "at 2026-02-01 Loan.${loan_a_id}.delinquency_status == DELINQUENT"

      - name: return_partial_reallocation_settlement_clawback_recorded
        claim_type: cascading_side_effects
        grounds: [calculations.return_reallocation, entities.MerchantSettlement.fields.clawed_back_cents]
        distinguishing_aspect: "A 30000 partial return on a released settlement records clawed_back_cents 28200 and reduces Merchant.net_settled_cents from 94000 to 65800; settlement stays RELEASED (partial)."
        test_recipe:
          setup: ["Merchant M mdr 600 hold 0; Loan A financed 100000 activated 2026-01-01; settlement released (net 94000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Servicer
            - call: "POST /merchants"
              payload: { display_name: "M", mdr_bps: 600, settlement_hold_days: 0 }
              as: Servicer
              captures: { m_id: $.data.id }
            - call: "POST /borrowers"
              payload: { full_name: "BA", email: "ba@x.com", annual_income_cents: 8000000, soft_credit_score: 760 }
              as: Servicer
              captures: { ba_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${ba_id}", merchant_id: "${m_id}", cart_amount_cents: 100000, plan_type: "PAY_IN_4", requested_down_payment_cents: 0 }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: Servicer
            - call: "POST /disclosure-acceptances"
              payload: { application_id: "${app_a_id}", accepted: true }
              as: Borrower
              as_user_id: "${ba_id}"
            - call: "POST /loans"
              payload: { application_id: "${app_a_id}" }
              as: Borrower
              as_user_id: "${ba_id}"
              captures: { loan_a_id: $.data.id }
            - call: "GET /merchant-settlements?loan_id=${loan_a_id}"
              as: Servicer
              captures: { s_id: "$.data[0].id" }
            - call: "POST /merchant-settlements/${s_id}/release"
              as: Servicer
          trigger:
            - call: "POST /returns"
              payload: { loan_id: "${loan_a_id}", return_amount_cents: 30000 }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { claw: $.data.settlement_clawback_cents }
            - call: "GET /merchant-settlements/${s_id}"
              as: Servicer
              captures: { cb: $.data.clawed_back_cents, sstat: $.data.status }
            - call: "GET /merchants/${m_id}"
              as: Servicer
              captures: { ns: $.data.net_settled_cents }
          assert:
            - "MerchantSettlement.${s_id}.clawed_back_cents == 28200 AND status == RELEASED"
            - "Merchant.${m_id}.net_settled_cents == 65800"

