              payload: {}
              as: Creator
              as_user_id: "${seller_g_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_g: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_g}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 1500, payment_method_token: "tok", idempotency_key: "kid-g-cur" }
              as: Creator
              as_user_id: "${kid_g_id}"
              captures: { kid_g_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${kid_g_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${kid_g_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_g_id}", price_robux: 200, idempotency_key: "po-g" }
              as: Creator
              as_user_id: "${kid_g_id}"
              captures: { po_g: $.data.id }
          trigger:
            - call: "POST /ugc/purchase-orders/${po_g}/confirm"
