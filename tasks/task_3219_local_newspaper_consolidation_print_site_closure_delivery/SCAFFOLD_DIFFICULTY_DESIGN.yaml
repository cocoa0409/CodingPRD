        distinguishing_aspect: "The dependency crosses the DeliveryRoute -> DeliveryContractor pair, distinct from the market-facing pairs: the contractor's active -> terminated transition is blocked while any of its routes is still prepared, so the termination only becomes legal once that child route has itself advanced."
