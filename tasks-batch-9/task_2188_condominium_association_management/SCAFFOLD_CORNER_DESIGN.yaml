      - name: redraft_for_same_fiscal_year_supersedes_predecessor_and_uncounts_its_ballots
        claim_type: side_effect_execution
        grounds:
          - state_machines.Budget.transitions.PROPOSED_to_SUPERSEDED
          - endpoints[POST /associations/{association_id}/budgets].side_effects
          - entities.Vote.fields.counted
        distinguishing_aspect: "Creating a second budget for the SAME fiscal_year retro-actively invalidates the first one's ballots (counted false) while leaving the Vote rows in place, and the second create must carry a REFRESHED expected_association_version because the first create already bumped it — a client replaying the stale token gets 412 instead."
        test_recipe:
          setup:
