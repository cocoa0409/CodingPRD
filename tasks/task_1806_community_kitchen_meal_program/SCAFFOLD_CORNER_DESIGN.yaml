            - call: "POST /kitchen/equipment-assets"
              payload: { site_id: "${site_id}", name: "C1", equipment_class: "COLD_HOLDING", criticality: "CRITICAL" }
              as: KitchenManager
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /kitchen/equipment-assets/${a1}/report-fault"
              payload: {}
              as: KitchenManager
            - call: "GET /kitchen/sites/${site_id}"
              payload: {}
              as: KitchenManager
              captures: { p1: $.data.equipment_posture }
            - call: "POST /kitchen/equipment-assets/${a2}/report-fault"
              payload: {}
              as: KitchenManager
            - call: "GET /kitchen/sites/${site_id}"
              payload: {}
              as: KitchenManager
              captures: { p2: $.data.equipment_posture }
            - call: "POST /kitchen/equipment-assets/${a2}/decommission"
