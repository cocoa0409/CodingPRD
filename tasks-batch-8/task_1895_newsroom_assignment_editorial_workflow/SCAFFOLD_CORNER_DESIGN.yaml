      - name: callin_selector_ranking_and_tiebreak
        claim_type: selector_policy
        grounds: [state_machines.BreakingNewsEvent.DECLARED_to_ACTIVE, state_machines.StaffCallIn]
        distinguishing_aspect: "Selector determinism: eligibility excludes the ON_LEAVE reporter and non-field roles; ranking is active_assignment_count ASC with created_at ASC tie-break — pool size 2 pages repA (0) before photogB (0, created later), leaving repE (1) and repC (2) unpaged."
