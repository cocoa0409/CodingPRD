            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "op-9", role_code: "DATA_STEWARD", valid_from: "2027-01-01", valid_until: "2027-06-30" }
              as: SecurityAdmin
              captures: { g3_id: $.data.id }
          trigger:
            - call: "POST /hris/security-role-assignments/${g2_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
              captures: { err: $.data.error_id }
            - call: "POST /hris/security-role-assignments/${g3_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
              captures: { g3_status: $.data.status }
            - call: "GET /hris/security-role-assignments"
              payload: { user_id: "op-9" }
              as: SecurityAdmin
              captures: { g2_status: "$.data[1].status" }
          assert:
            - "touching-window approve: error_id == ERR_GRANT_WINDOW_OVERLAP (409); G2 remains \"REQUESTED\""
            - "disjoint-window approve: G3 status == \"APPROVED\" (valid_from 2027-01-01 > clock, not yet PROVISIONED)"

      - name: revoke_provisioned_grant_writes_audit
        claim_type: valid_transition
        grounds:
          - state_machines.SecurityRoleAssignment.PROVISIONED_to_REVOKED
          - entities.AuditEntry.fields.action
        distinguishing_aspect: |
          Revoking a PROVISIONED grant lands it in terminal REVOKED and
          appends the second audit entry of the grant lifecycle: the audit log
          shows GRANT_APPROVE then GRANT_REVOKE in created order.
        test_recipe:
          setup:
            - "op-11 holds PROVISIONED HRIS_ANALYST grant (approved by secadmin-2)"
          setup_api_calls:
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "op-11", role_code: "HRIS_ANALYST", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-2"
              captures: { st0: $.data.status }
          trigger:
            - call: "POST /hris/security-role-assignments/${g_id}/revoke"
              payload: { reason: "offboarding" }
              as: SecurityAdmin
              as_user_id: "secadmin-2"
              captures: { st1: $.data.status }
            - call: "GET /hris/audit-entries"
              payload: {}
              as: DataSteward
              captures: { a0: "$.data[0].action", a1: "$.data[1].action" }
          assert:
            - "grant was PROVISIONED immediately on approve (clock >= valid_from), now status == \"REVOKED\""
            - "audit log order: first entry action == \"GRANT_APPROVE\", second == \"GRANT_REVOKE\""

      - name: revoke_requested_grant_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SecurityRoleAssignment.PROVISIONED_to_REVOKED
          - errors[ERR_GRANT_INVALID_STATE]
        distinguishing_aspect: |
          Revoke requires APPROVED or PROVISIONED: revoking a still-REQUESTED
          grant fails ERR_GRANT_INVALID_STATE (409).
        test_recipe:
          setup:
            - "Grant for op-12 in REQUESTED"
          setup_api_calls:
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "op-12", role_code: "INTEGRATION_OPERATOR", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /hris/security-role-assignments/${g_id}/revoke"
              payload: { reason: "premature" }
              as: SecurityAdmin
              as_user_id: "secadmin-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GRANT_INVALID_STATE (409)"

      - name: grant_expires_on_clock_sweep_and_loses_authority
        claim_type: valid_transition
        grounds:
          - state_machines.SecurityRoleAssignment.PROVISIONED_to_EXPIRED
          - errors[ERR_GRANT_NOT_PROVISIONED]
        distinguishing_aspect: |
          When the clock passes valid_until the grant flips PROVISIONED ->
          EXPIRED, and the same user who could approve yesterday now fails the
          change-approve authority check with ERR_GRANT_NOT_PROVISIONED.
        test_recipe:
          setup:
            - "appr-9 holds PROVISIONED CHANGE_APPROVER grant [2026-08-01, 2026-08-10]; a PENDING_APPROVAL change request exists"
          setup_api_calls:
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-9", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2026-08-10" }
              as: SecurityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "Gx", worker_number: "W761", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "12000", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: SecurityAdmin
            - call: "GET /hris/security-role-assignments"
              payload: { user_id: "appr-9" }
              as: SecurityAdmin
              captures: { g_status: "$.data[0].status" }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-9"
              captures: { err: $.data.error_id }
          assert:
            - "after sweep past valid_until: grant status == \"EXPIRED\""
            - "approve by the expired grantee: error_id == ERR_GRANT_NOT_PROVISIONED (403)"

      - name: audit_entry_written_only_for_sensitive_fields
        claim_type: conditional_cascade
        grounds:
          - state_machines.ChangeRequest.APPROVED_to_APPLIED
          - entities.AuditEntry.fields.action
        distinguishing_aspect: |
          The APPLY AuditEntry side effect is conditional on field
          sensitivity: applying an INTERNAL-field change writes no audit row,
          while applying a CONFIDENTIAL-field change writes APPLY with
          old_value \"10000\" / new_value \"11000\".
        test_recipe:
          setup:
            - "Worker W salary 10000 location NY; INTERNAL location field and CONFIDENTIAL salary field both ACTIVE; CR1 (location->SF @2026-09-01) APPLIED; CR2 (salary->11000 @2026-10-01) APPLIED"
          setup_api_calls:
            - call: "POST /hris/positions"
