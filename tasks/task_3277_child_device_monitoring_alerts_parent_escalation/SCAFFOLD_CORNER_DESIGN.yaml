            - call: "POST /api/families"
              payload: { family_name: "Fam SB", primary_contact_email: "sb@x.com", primary_parent_name: "Pat SB" }
              as: PlatformAdmin
              captures: { fam_sb: $.data.id }
            - call: "GET /api/families/${fam_sb}/parents"
              as: PlatformAdmin
              captures: { par_sb: $.data.0.id }
          trigger:
            - call: "PATCH /api/children/${child_sa}"
              payload: { monitoring_sensitivity: "STRICT", expected_child_version: "${child_sa_v}" }
              as: Parent
              as_user_id: "${par_sb}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_FAMILY_ACCESS, HTTP 403 (not ERR_CHILD_ARCHIVED, not ERR_STALE_VERSION)"

