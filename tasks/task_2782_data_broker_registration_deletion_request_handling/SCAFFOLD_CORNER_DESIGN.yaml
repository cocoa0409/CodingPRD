            - "DataBroker.${broker_id}.fee_credit_cents == 0"

      - name: inquiry_response_citing_an_unknown_audit_event_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_13.ERR_AUDIT_EVENT_NOT_FOUND
          - endpoints.POST_regulator_inquiries_id_respond
        distinguishing_aspect: >
          Every id in cited_audit_event_ids must resolve, so a citation list containing one unknown
          UUID must return ERR_AUDIT_EVENT_NOT_FOUND at HTTP 404 and must not partially store the
          citation set: cited_event_count stays 0 and the inquiry stays OPEN.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, and one OPEN RegulatorInquiry with response_due_at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${broker_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2026-10-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { inquiry_id: $.data.id }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: PlatformAdmin
              captures: { real_event_id: "$.data[0].id" }
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/respond"
              payload: { cited_audit_event_ids: ["${real_event_id}", "00000000-0000-4000-8000-000000000999"] }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              expect_error: { error_id: ERR_AUDIT_EVENT_NOT_FOUND, http_status: 404 }
          assert:
            - "the response carries data.error_id == ERR_AUDIT_EVENT_NOT_FOUND with HTTP 404"
            - "RegulatorInquiry.${inquiry_id}.status == OPEN"
            - "RegulatorInquiry.${inquiry_id}.cited_event_count == 0"
            - "RegulatorInquiry.${inquiry_id}.cited_audit_event_ids == []"
            - "RegulatorInquiry.${inquiry_id}.responded_at == null"
            - "RegulatorInquiry.${inquiry_id}.adequacy_verdict == UNRATED"

      - name: inquiry_response_citing_another_brokers_audit_event_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_42.ERR_AUDIT_EVENT_FOREIGN
          - entities.AuditEvent.fields.broker_id
        distinguishing_aspect: >
          The cited event exists, so ERR_AUDIT_EVENT_NOT_FOUND does not apply; it belongs to a
          different broker, so the response must be refused with ERR_AUDIT_EVENT_FOREIGN at HTTP
          422. An inquiry may not be answered with another broker's audit trail.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and two unrelated DataBrokers, Alpha and Beta, each with their own BROKER_REGISTERED audit event."
            - "One OPEN RegulatorInquiry against Alpha with response_due_at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Alpha Attribute Works", primary_contact_email: "office@alpha.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Builds purchase propensity attributes for national retail advertising buyers." }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Beta Household Index", primary_contact_email: "office@beta.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Publishes household composition indices licensed to insurance marketing partners." }
              as: PlatformAdmin
              captures: { beta_id: $.data.id }
            - call: "GET /brokers/${beta_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: PlatformAdmin
              captures: { beta_event_id: "$.data[0].id" }
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${alpha_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2026-10-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { inquiry_id: $.data.id }
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/respond"
              payload: { cited_audit_event_ids: ["${beta_event_id}"] }
              as: BrokerAdmin
              as_user_id: "${alpha_id}"
              expect_error: { error_id: ERR_AUDIT_EVENT_FOREIGN, http_status: 422 }
          assert:
            - "the response carries data.error_id == ERR_AUDIT_EVENT_FOREIGN with HTTP 422"
            - "the response does not carry data.error_id == ERR_AUDIT_EVENT_NOT_FOUND"
            - "RegulatorInquiry.${inquiry_id}.status == OPEN"
            - "RegulatorInquiry.${inquiry_id}.cited_event_count == 0"
            - "RegulatorInquiry.${inquiry_id}.evidence_score == 0.00"

      - name: inquiry_response_citing_an_audit_event_past_retention_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_43.ERR_CITED_EVENT_EXPIRED
          - calculations.temporal_default_derivation.constants.AUDIT_RETENTION_DAYS
        distinguishing_aspect: >
          The BROKER_REGISTERED event stamped 2026-09-01 carries retention_expires_at 2033-08-30,
          exactly 2555 days later across two leap years. At a clock of 2033-09-01 the citation is
          past retention, so the response must be refused with ERR_CITED_EVENT_EXPIRED at HTTP 422
          even though the inquiry's own response window is wide open until 2033-10-31.
        test_recipe:
          setup:
            - "One DataBroker created while the clock read 2026-09-01T00:00:00Z, so its BROKER_REGISTERED event has retention_expires_at 2033-08-30T00:00:00Z."
            - "The clock is then advanced to 2033-09-01T00:00:00Z and one OPEN RegulatorInquiry is opened with response_due_at 2033-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: PlatformAdmin
              captures: { old_event_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2033-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${broker_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2033-10-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { inquiry_id: $.data.id }
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/respond"
              payload: { cited_audit_event_ids: ["${old_event_id}"] }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              expect_error: { error_id: ERR_CITED_EVENT_EXPIRED, http_status: 422 }
          assert:
            - "AuditEvent.${old_event_id}.retention_expires_at == 2033-08-30T00:00:00Z"
            - "the response carries data.error_id == ERR_CITED_EVENT_EXPIRED with HTTP 422"
            - "the response does not carry data.error_id == ERR_RESPONSE_WINDOW_CLOSED"
            - "RegulatorInquiry.${inquiry_id}.status == OPEN"
            - "RegulatorInquiry.${inquiry_id}.cited_event_count == 0"

      - name: inquiry_response_after_the_grace_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_63.ERR_RESPONSE_WINDOW_CLOSED
          - calculations.regulator_response_adequacy.constants.RESPONSE_GRACE_DAYS
        distinguishing_aspect: >
          With response_due_at 2026-09-10 the window closes at 2026-10-10 inclusive, so a response
          filed at 2026-10-11 must be refused with ERR_RESPONSE_WINDOW_CLOSED at HTTP 409. Treating
          response_due_at itself as the cut-off, or the grace as 30 days after the response instead
          of after the due date, admits the response and no error is returned.
        test_recipe:
          setup:
            - "One DataBroker created at clock 2026-09-01T00:00:00Z and one OPEN RegulatorInquiry with response_due_at 2026-09-10T00:00:00Z."
            - "The clock is then advanced to 2026-10-11T00:00:00Z, one day past the 30-day grace boundary of 2026-10-10T00:00:00Z, and no sweep has been run so the inquiry is still OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: PlatformAdmin
              captures: { event_id: "$.data[0].id" }
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${broker_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2026-09-10T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { inquiry_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/respond"
              payload: { cited_audit_event_ids: ["${event_id}"] }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              expect_error: { error_id: ERR_RESPONSE_WINDOW_CLOSED, http_status: 409 }
          assert:
            - "the response carries data.error_id == ERR_RESPONSE_WINDOW_CLOSED with HTTP 409"
            - "RegulatorInquiry.${inquiry_id}.status == OPEN"
            - "RegulatorInquiry.${inquiry_id}.responded_at == null"
            - "RegulatorInquiry.${inquiry_id}.cited_event_count == 0"
            - "RegulatorInquiry.${inquiry_id}.late_response_penalty == 0.00"

      - name: closing_a_deficient_inquiry_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_80.ERR_RESPONSE_INADEQUATE
          - calculations.regulator_response_adequacy.constants.ADEQUATE_THRESHOLD
          - state_machines.RegulatorInquiry.transitions.RESPONDED_to_CLOSED
        distinguishing_aspect: >
          Two cited events with none of the three mandatory coverage types give evidence_score
          15.00*2 = 30.00, a deficiency_penalty of 35.00 from the sub-40 tier and no lateness, so
          adequacy_score floors at 0.00 and the verdict is DEFICIENT. Closing must then return
          ERR_RESPONSE_INADEQUATE at HTTP 422 with the inquiry left in RESPONDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker with a 500000-cent fee deposit, so its audit trail holds BROKER_REGISTERED and FEE_DEPOSITED and nothing else."
            - "One OPEN RegulatorInquiry with response_due_at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: PlatformAdmin
              captures: { event_registered_id: "$.data[0].id" }
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "FEE_DEPOSITED" }
              as: PlatformAdmin
              captures: { event_fee_id: "$.data[0].id" }
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${broker_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2026-10-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { inquiry_id: $.data.id }
            - call: "POST /regulator-inquiries/${inquiry_id}/respond"
              payload: { cited_audit_event_ids: ["${event_registered_id}", "${event_fee_id}"] }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/close"
              payload: {}
              as: Regulator
              as_user_id: "regulator-ca"
              expect_error: { error_id: ERR_RESPONSE_INADEQUATE, http_status: 422 }
          assert:
            - "RegulatorInquiry.${inquiry_id}.cited_event_count == 2"
            - "RegulatorInquiry.${inquiry_id}.coverage_bonus_applied == false"
            - "RegulatorInquiry.${inquiry_id}.evidence_score == 30.00"
            - "RegulatorInquiry.${inquiry_id}.deficiency_penalty == 35.00"
            - "RegulatorInquiry.${inquiry_id}.late_response_penalty == 0.00"
            - "RegulatorInquiry.${inquiry_id}.adequacy_score == 0.00"
            - "RegulatorInquiry.${inquiry_id}.adequacy_verdict == DEFICIENT"
            - "the close response carries data.error_id == ERR_RESPONSE_INADEQUATE with HTTP 422"
            - "RegulatorInquiry.${inquiry_id}.status == RESPONDED"
            - "GET /brokers/${broker_id}/audit-events?event_type=INQUIRY_CLOSED reports total_count == 0"

      - name: unrecognized_opt_out_signals_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_51.ERR_OPT_OUT_SIGNAL_UNRECOGNIZED
          - state_machines.OptOutSignal.transitions.RECEIVED_to_HONORED
        distinguishing_aspect: >
          Signal recognition is per mechanism: a GPC_BROWSER signal whose gpc_header_value is the
          string "0" and an AGENT_SUBMITTED signal with no agent_reference must both return
          ERR_OPT_OUT_SIGNAL_UNRECOGNIZED at HTTP 422, and neither may set the consumer's opt-out
          flags or advance the consumer's version.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, and one CA Consumer at version 1 with both opt-out flags false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:gpc00001gpc00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
          trigger:
            - call: "POST /opt-out-signals"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", signal_type: "GPC_BROWSER", scope: "SALE_AND_SHARING", expected_consumer_version: "${consumer_v1}", gpc_header_value: "0" }
              as: Consumer
              as_user_id: "${consumer_id}"
              expect_error: { error_id: ERR_OPT_OUT_SIGNAL_UNRECOGNIZED, http_status: 422 }
            - call: "POST /opt-out-signals"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", signal_type: "AGENT_SUBMITTED", scope: "SALE", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              expect_error: { error_id: ERR_OPT_OUT_SIGNAL_UNRECOGNIZED, http_status: 422 }
          assert:
            - "both responses carry data.error_id == ERR_OPT_OUT_SIGNAL_UNRECOGNIZED with HTTP 422"
            - "GET /opt-out-signals?consumer_id=${consumer_id} reports total_count == 0"
            - "Consumer.${consumer_id}.opt_out_sale == false"
            - "Consumer.${consumer_id}.opt_out_sharing == false"
            - "Consumer.${consumer_id}.version == 1"

      - name: gpc_browser_signal_with_value_one_is_honored_in_the_creating_request
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_51.ERR_OPT_OUT_SIGNAL_UNRECOGNIZED
          - state_machines.OptOutSignal.transitions.RECEIVED_to_HONORED
          - calculations.temporal_default_derivation.constants.SIGNAL_HONOR_DEADLINE_DAYS
        distinguishing_aspect: >
          A GPC_BROWSER signal carrying exactly "1" with scope SALE_AND_SHARING must be honored
          inside the creating request: status HONORED, honored_at at the clock instant, both consumer
          flags true, and honor_deadline_at still stamped 45 days out at 2026-10-16 even though the
          deadline was never needed.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, and one CA Consumer at version 1 with both opt-out flags false."
          setup_api_calls:
