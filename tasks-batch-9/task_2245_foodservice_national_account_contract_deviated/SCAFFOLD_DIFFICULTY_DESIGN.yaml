            - "RebatePeriod.${rp95_id}.operator_rebate_cents == 19000"
            - "RebatePeriod.${rp95_id}.manufacturer_funded_cents == 11400"
            - "RebatePeriod.${rp95_id}.distributor_funded_cents == 7600"
            - "RebatePeriod.${rp94_id}.compliance_pct == 94.00"
