            - call: "POST /stores/${s}/certificates/${cert}/redeem"
              payload: { receipt_id: "${r3}", amount_cents: 100 }
              as: GuestService
          assert:
            - "redemption against R2 (receipt purchased inside the advertised week, line matches program item) fails with error_id ERR_CERTIFICATE_REBATE_PURCHASE_BARRED (HTTP 422)"
            - "redemption against R3 (same SKU, but purchased after the week closed) succeeds: RebateCertificate.${cert}.status == PARTIALLY_REDEEMED and remaining_balance_cents == 900"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: program_week_overlap_adjacency_is_not_overlap
        grounds:
          - state_machines.RebateProgram.DRAFT_to_ACTIVE
          - errors[ERR_PROGRAM_WEEK_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [week_start, week_end) on the
          RebateProgram resource — activating P2 with week [2026-09-14,
          2026-09-21) succeeds while P1 [2026-09-07, 2026-09-14) is ACTIVE
          (shared boundary instant is not an overlap), whereas P3 [2026-09-13,
          2026-09-20) is rejected with ERR_PROGRAM_WEEK_OVERLAP.
        test_recipe:
          setup:
            - "Store S; programs P1 [2026-09-07, 2026-09-14) ACTIVE with item AAA, P2 [2026-09-14, 2026-09-21) DRAFT with item BBB, P3 [2026-09-13, 2026-09-20) DRAFT with item CCC. Clock at 2026-09-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-TO1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "P1", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p1: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p1}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p1}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "P2", week_start_date: "2026-09-14", week_end_date: "2026-09-21" }
              as: StoreAdmin
              captures: { p2: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p2}/items"
              payload: { sku: "BBB", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "P3", week_start_date: "2026-09-13", week_end_date: "2026-09-20" }
              as: StoreAdmin
              captures: { p3: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p3}/items"
              payload: { sku: "CCC", rebate_pct: 0.11 }
              as: StoreAdmin
          trigger:
            - call: "POST /stores/${s}/rebate-programs/${p2}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p3}/activate"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "RebateProgram.${p2}.status == ACTIVE (adjacency at 2026-09-14 is not an overlap under half-open semantics)"
            - "P3 activation fails with error_id ERR_PROGRAM_WEEK_OVERLAP (HTTP 409): [2026-09-13, 2026-09-20) intersects P1's [2026-09-07, 2026-09-14)"
            - "RebateProgram.${p3}.status == DRAFT (unchanged)"

      - name: split_transaction_window_half_open_left_edge
        grounds:
          - calculations.fraud_screening
          - entities.Store.fields.split_txn_window_hours
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN lookback (purchase_at − 2h, purchase_at]
          on the Receipt resource — a DIFFERENT resource and different edge
          geometry than the program-week rule (the LEFT edge is the excluded
          one here): account AC1's cluster at 10:00/11:00/11:59 flags, while
          account AC2's receipts at exactly 10:00 and 12:00 do NOT flag because
          the 12:00 receipt's window (10:00, 12:00] excludes the receipt
          sitting exactly on the open left edge.
        test_recipe:
          setup:
            - "Store S (split_txn_window_hours 2, split_txn_min_receipts 3); accounts AC1, AC2. Clock at 2026-09-08T13:00:00Z so all purchases are in the past."
            - "AC1: receipts R-A1 at 10:00, R-A2 at 11:00, R-A3 at 11:59 — all sku AAA."
            - "AC2: receipts R-B1 at exactly 10:00 and R-B2 at exactly 12:00 — both sku AAA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T13:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-TO2", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac1: $.data.id }
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Bob", account_type: "RETAIL" }
              as: GuestService
              captures: { ac2: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-TO2-A1", account_id: "${ac1}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-TO2-A2", account_id: "${ac1}", purchase_at: "2026-09-08T11:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-TO2-A3", account_id: "${ac1}", purchase_at: "2026-09-08T11:59:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-TO2-B1", account_id: "${ac2}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-TO2-B2", account_id: "${ac2}", purchase_at: "2026-09-08T12:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
          trigger:
            - call: "GET /stores/${s}/fraud-flags"
              payload: { account_id: "${ac1}", flag_type: "SPLIT_TRANSACTION" }
              as: FraudAnalyst
              captures: { flag_a: $.data.0.id }
            - call: "GET /stores/${s}/fraud-flags"
              payload: { account_id: "${ac2}" }
              as: FraudAnalyst
          assert:
            - "account AC1 has exactly 1 SPLIT_TRANSACTION FraudFlag ${flag_a} (status OPEN) listing all three receipt ids — the 11:59 receipt's window (09:59, 11:59] captures the 10:00 and 11:00 receipts"
            - "account AC2 has ZERO FraudFlags — the 12:00 receipt's window (10:00, 12:00] EXCLUDES the 10:00 receipt at the open left edge, leaving a 2-receipt cluster below split_txn_min_receipts 3"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: certificate_value_conservation_across_issue_redeem_reissue
        grounds:
          - calculations.store_credit_liability
          - calculations.credit_account_balance
          - entities.RebateCertificate.fields.issued_amount_cents
        distinguishing_aspect: |
          Conserved quantity: certificate face value. Per certificate,
          issued_amount_cents == redeemed_total + remaining_balance_cents
          (+ breakage_swept at expiry), and the account-level identity
          lifetime issued == redeemed + credit_balance holds after a mixed
          sequence of issuance, partial redemption, expiry sweep, and reissue —
          the reissue moves value between certificate rows without creating or
          destroying it.
        test_recipe:
          setup:
            - "Store S (validity 1 month, breakage 0.25); program P ACTIVE week [2026-09-07, 2026-09-14), item AAA 0.10; account AC."
            - "Receipt R1 (AAA qty 1 @ 10000, purchased 2026-09-08T10:00:00Z) → approved → CERT1 1000 issued 2026-09-10T12:00:00Z (expires 2026-10-10). CERT1 partially redeemed 400 against receipt R2 (ZZZ, purchased 2026-09-11T10:00:00Z)."
            - "Clock to 2026-10-15: breakage run sweeps CERT1 (EXPIRED, remaining 600). Clock to 2026-10-20T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-CI1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CI1-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-submissions/${sub}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CI1-2", account_id: "${ac}", purchase_at: "2026-09-11T10:00:00Z", lines: [ { line_number: 1, sku: "ZZZ", category: "PAINT", quantity: 1, unit_price_cents: 4000, tender_splits: [ { tender_type: "CASH", amount_cents: 4000 } ] } ] }
              as: GuestService
              captures: { r2: $.data.id }
            - call: "POST /stores/${s}/certificates/${cert1}/redeem"
              payload: { receipt_id: "${r2}", amount_cents: 400 }
              as: GuestService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: StoreAdmin
            - call: "GET /stores/${s}"
              payload: {}
              as: FinanceAdmin
              captures: { s_v: $.data.version }
            - call: "POST /stores/${s}/breakage-runs"
              payload: { expected_store_version: "${s_v}" }
              as: FinanceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T12:00:00Z" }
              as: StoreAdmin
          trigger:
            - call: "POST /stores/${s}/certificates/${cert1}/reissue"
              payload: {}
              as: GuestService
              captures: { cert2: $.data.id }
            - call: "GET /stores/${s}/credit-accounts/${ac}/ledger"
              payload: {}
              as: FinanceAdmin
          assert:
            - "RebateCertificate.${cert2}.issued_amount_cents == 600 and remaining_balance_cents == 600 (reissue conserves the swept balance)"
            - "per-certificate identity on CERT1: issued 1000 == redeemed 400 + breakage_swept 600"
            - "CreditAccount.${ac}.credit_balance_cents == 600 and pending_award_cents == 0"
            - "account-level identity: lifetime issued 1000 == redeemed 400 + credit_balance 600 (reissue created no new value)"
            - "Store.${s}.accrued_breakage_income_cents == 600 and outstanding_liability_cents == 600 (gross liability reinstated by the reissue)"

      - name: ledger_signed_sum_equals_account_position
        grounds:
          - calculations.credit_account_balance
          - entities.CreditLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: the signed ledger sum (a DIFFERENT conserved
          quantity than certificate face value). Σ CreditLedgerEntry.amount_cents
          over the account == credit_balance_cents + pending_award_cents after
          the reversal settles: issuance (+1000) paired with redemption (−300)
          and the compensating reversal (−700) sums to exactly 0 — no drift —
          and the redeemed 300 is never clawed back.
        test_recipe:
          setup:
            - "Store S (breakage 0.25); program P ACTIVE week [2026-09-07, 2026-09-14), item AAA 0.10; account AC."
            - "Receipt R1 (AAA qty 1 @ 10000, purchased 2026-09-08T10:00:00Z) → approved (award 1000) → CERT issued 2026-09-10T12:00:00Z; CERT redeemed 300 against receipt R2 (ZZZ, purchased 2026-09-11T10:00:00Z); then R1 fully returned, voiding CERT with remaining 700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-CI2", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "Week37", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CI2-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-submissions/${sub}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CI2-2", account_id: "${ac}", purchase_at: "2026-09-11T10:00:00Z", lines: [ { line_number: 1, sku: "ZZZ", category: "PAINT", quantity: 1, unit_price_cents: 3000, tender_splits: [ { tender_type: "CASH", amount_cents: 3000 } ] } ] }
              as: GuestService
              captures: { r2: $.data.id }
            - call: "POST /stores/${s}/certificates/${cert}/redeem"
              payload: { receipt_id: "${r2}", amount_cents: 300 }
              as: GuestService
          trigger:
            - call: "POST /stores/${s}/receipts/${r1}/returns"
              payload: { lines: [ { line_number: 1, quantity: 1 } ] }
              as: GuestService
            - call: "GET /stores/${s}/credit-accounts/${ac}/ledger"
              payload: {}
              as: FinanceAdmin
          assert:
            - "the ledger holds exactly 3 entries: ISSUANCE_ACCRUAL +1000, REDEMPTION −300, REVERSAL_DEBIT −700"
            - "signed ledger sum == 0 == credit_balance_cents (0) + pending_award_cents (0) — reversal paired with issuance leaves zero drift"
            - "the redeemed 300 was NOT clawed back: no fourth ledger entry exists and lifetime_rebate_cents == 1000 (cumulative award never decremented)"
            - "Store.${s}.outstanding_liability_cents == 0"
