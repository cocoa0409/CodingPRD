# =============================================================================
# task_0659_artificial_turf_putting_green — SCAFFOLD (§1.0–§1.7)
# Artificial Turf & Putting-Green Install
# Difficulty: Expert
# =============================================================================

scenario: |
  659. Artificial Turf & Putting-Green Install: site measure & sq-ft/design, turf
  product & infill selection, base prep & drainage scope, quote & deposit, crew &
  install scheduling, pet/playground variant, warranty & maintenance plan, callback

domain_name: turf-install
api_prefix: /
# Flat topology: every entity is a top-level collection (/<collection>) with FK
# references carried in the request body and exposed as reverse-reachability
# filtered-list query params. State transitions are flat action endpoints
# (POST /<collection>/{id}/<action>). No nested URL ownership chains.

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert calibration
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Project.version (CREATE-with-supersede on Quote)
    - cascading_side_effects        # quote accept -> install schedule -> warranty start chains
    - dual_variant_calculation      # quote ESTIMATE vs FINAL; project budget forward vs chronological
    - rate_threshold_triggers       # drainage upgrade thresholds, deposit %, minimum-job floor
    - derived_field_reconciliation  # Project rolls up area, balances, posture

  entity_topology: flat
  # All entities are top-level collections linked by foreign keys carried in request
  # bodies (no nested URL ownership chains). Project is the logical aggregate root,
  # but children (SiteMeasure, DesignLayout, BasePrepScope, Quote, InstallJob,
  # WarrantyPlan, Callback, Payment) and catalog/Crew peers are all addressed flatly
  # and discovered via filtered-list query params.

  state_machine_shape: parallel
  # Project carries TWO independent state dimensions: workflow_status (pipeline) and
  # finance_status (deposit/balance ledger lifecycle) that evolve independently.
  # Quote supports a cyclic revise loop; InstallJob branches (complete vs abort).

  relationship_patterns:
    - one_to_many        # Project -> SiteMeasure, DesignLayout, Quote, InstallJob, Callback, Payment
    - cross_aggregate    # InstallJob -> Crew; DesignLayout -> TurfProduct, InfillProduct
    - many_to_many       # DesignLayout selects a TurfProduct + InfillProduct (catalog refs)

  role_model: peer_roles
  # SalesRep owns measure/design/quote; Scheduler owns crew + install scheduling;
  # Customer approves quotes/deposit on own project; OpsAdmin operational override + catalog.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

