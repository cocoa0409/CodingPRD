# =============================================================================
# Motorcoach & Group-Tour Operator — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Motorcoach & Group-Tour Operator: itinerary & seat/coach inventory,
  rooming-list & hotel block, driver/guide & DOT hours, per-person pricing &
  deposit schedule, meal/attraction voucher, cancellation & insurance, escort &
  manifest, settlement

domain_name: motorcoach-group-tour
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel   # Booking has parallel dims; Departure is cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # Passenger.roommate_passenger_id -> Passenger.id
    - cross_aggregate       # Departure <-> Coach/Driver/Guide assignment
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TourProduct
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catalog tour name" }
      - { name: duration_days, type: integer, source: input, description: "Number of days the tour runs", constraints: ">= 1" }
      - { name: base_price_per_person_cents, type: integer, source: input, description: "List price per person before occupancy multiplier, in cents", constraints: ">= 0" }
      - { name: deposit_per_person_cents, type: integer, source: input, description: "Non-refundable deposit due per person at confirmation, in cents", default: 20000, constraints: ">= 0" }

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Fleet code / plate" }
      - { name: seat_capacity, type: integer, source: input, description: "Number of passenger seats", constraints: ">= 1" }
      - { name: day_rate_cents, type: integer, source: input, description: "Operating cost per day, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED", default: AVAILABLE, constraints: "AVAILABLE, ASSIGNED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Driver full name" }
      - { name: license_no, type: string, source: input, description: "CDL license number" }
      - { name: day_rate_cents, type: integer, source: input, description: "Driver day rate, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED", default: AVAILABLE, constraints: "AVAILABLE, ASSIGNED" }

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tour director / escort name" }
      - { name: day_rate_cents, type: integer, source: input, description: "Guide day rate, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED", default: AVAILABLE, constraints: "AVAILABLE, ASSIGNED" }

  - name: Departure
    parent: null
    common_fields: true
    fields:
      - { name: tour_product_id, type: string, source: input, description: "FK -> TourProduct.id" }
      - { name: name, type: string, source: input, description: "Departure label (e.g. 'Fall Foliage — Sep 2026')" }
      - { name: start_date, type: string, source: input, description: "First service date, YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Last service date, YYYY-MM-DD (inclusive)" }
      - { name: guaranteed_min_pax, type: integer, source: input, description: "Minimum confirmed passengers to guarantee the departure", constraints: ">= 1" }
      - { name: itinerary_days, type: array, source: input, description: "Ordered array of {day_index, service_date, from_city, to_city, planned_drive_hours}; drives DOT check" }
      - { name: coach_id, type: string, source: system, description: "FK -> Coach.id; null until assigned", default: null }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; null until assigned", default: null }
      - { name: guide_id, type: string, source: system, description: "FK -> Guide.id; null until assigned", default: null }
      - { name: status, type: enum, source: system, description: "PLANNING | OPEN | GUARANTEED | DEPARTED | SETTLED | CANCELLED", default: PLANNING, constraints: "PLANNING, OPEN, GUARANTEED, DEPARTED, SETTLED, CANCELLED" }
      - { name: confirmed_pax, type: integer, source: computed, description: "Sum of pax_count over Bookings on this departure whose reservation_status IN {CONFIRMED, TRAVELED}", default: 0 }
      - { name: occupancy_band, type: enum, source: computed, description: "SMALL (confirmed_pax < 6) | STANDARD (6..11) | LARGE (>= 12)", default: SMALL, constraints: "SMALL, STANDARD, LARGE" }
      - { name: settlement_net_cents, type: integer, source: computed, description: "Final net (revenue - cost) pinned at SETTLED; null before settle", default: null }

  - name: HotelBlock
    parent: null
    common_fields: true
    fields:
      - { name: departure_id, type: string, source: input, description: "FK -> Departure.id" }
      - { name: hotel_name, type: string, source: input, description: "Hotel name" }
      - { name: city, type: string, source: input, description: "Hotel city" }
      - { name: room_count, type: integer, source: input, description: "Rooms held in the block (capacity)", constraints: ">= 0" }
      - { name: nights, type: integer, source: input, description: "Room-nights per room", constraints: ">= 1" }
      - { name: rate_per_room_night_cents, type: integer, source: input, description: "Negotiated nightly room rate, in cents", constraints: ">= 0" }
      - { name: rooms_committed, type: integer, source: computed, description: "Sum of rooms_requested over CONFIRMED/TRAVELED Bookings on this departure", default: 0 }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED", default: HELD, constraints: "HELD, CONFIRMED, RELEASED" }
      - { name: block_cost_cents, type: integer, source: computed, description: "rooms_committed * nights * rate_per_room_night_cents", default: 0 }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: departure_id, type: string, source: input, description: "FK -> Departure.id" }
      - { name: lead_name, type: string, source: input, description: "Party lead / agency contact" }
      - { name: pax_count, type: integer, source: input, description: "Number of passengers in this booking", constraints: ">= 1" }
      - { name: rooms_requested, type: integer, source: input, description: "Rooms this party needs from the hotel block", constraints: ">= 0" }
      - { name: insurance_opt_in, type: boolean, source: input, description: "Whether the party purchased trip-cancellation insurance", default: false }
      - { name: reservation_status, type: enum, source: system, description: "DRAFT | CONFIRMED | TRAVELED | CANCELLED (parallel dim A)", default: DRAFT, constraints: "DRAFT, CONFIRMED, TRAVELED, CANCELLED" }
      - { name: payment_status, type: enum, source: computed, description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED (parallel dim B; derived from Payments)", default: UNPAID, constraints: "UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED" }
      - { name: quoted_per_person_cents, type: integer, source: computed, description: "Provisional per-person price locked at booking creation (forward-looking occupancy band)", default: 0 }
      - { name: final_per_person_cents, type: integer, source: computed, description: "Final per-person price pinned when the departure DEPARTS (actual occupancy band); null before", default: null }
      - { name: base_subtotal_cents, type: integer, source: computed, description: "quoted_per_person_cents * pax_count", default: 0 }
      - { name: service_fee_cents, type: integer, source: computed, description: "round(quoted_per_person_cents * SERVICE_FEE_RATE) * pax_count (round per-person then multiply)", default: 0 }
      - { name: insurance_premium_cents, type: integer, source: computed, description: "round(base_subtotal_cents * INSURANCE_PREMIUM_RATE) if insurance_opt_in else 0", default: 0 }
      - { name: booking_total_cents, type: integer, source: computed, description: "base_subtotal_cents + service_fee_cents + insurance_premium_cents", default: 0 }
      - { name: deposit_due_cents, type: integer, source: computed, description: "TourProduct.deposit_per_person_cents * pax_count", default: 0 }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for kind IN {DEPOSIT, BALANCE}", default: 0 }
      - { name: amount_refunded_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for kind == REFUND", default: 0 }
      - { name: penalty_charged_cents, type: integer, source: computed, description: "Cancellation penalty pinned at cancel; null before", default: null }
      - { name: cancel_reason, type: string, source: input, description: "Reason captured at cancel; null before", default: null }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: full_name, type: string, source: input, description: "Passenger full name (manifest)" }
      - { name: is_lead, type: boolean, source: input, description: "Whether this passenger is the party lead", default: false }
      - { name: roommate_passenger_id, type: string, source: input, description: "FK -> Passenger.id; rooming-list pairing, null if single", default: null }
      - { name: seat_no, type: integer, source: system, description: "Coach seat number assigned at confirmation; null before", default: null }
      - { name: room_no, type: integer, source: system, description: "Hotel room number assigned at confirmation; null before", default: null }

  - name: Payment
    parent: null
    common_fields: false     # append-only ledger record: id + created_at only
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | BALANCE | REFUND (REFUND only created by cancel side-effect)", constraints: "DEPOSIT, BALANCE, REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents (positive)", constraints: ">= 1" }
      - { name: method, type: string, source: input, description: "Free-text tender note", default: null }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: passenger_id, type: string, source: system, description: "FK -> Passenger.id" }
      - { name: kind, type: enum, source: system, description: "MEAL (one issued per passenger at confirmation)", default: MEAL, constraints: "MEAL" }
      - { name: face_value_cents, type: integer, source: system, description: "Voucher face value; MEAL_VOUCHER_CENTS at issuance", default: 2500 }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | VOIDED", default: ISSUED, constraints: "ISSUED, REDEEMED, VOIDED" }
      - { name: redeemed_at, type: datetime, source: system, description: "Logical-clock instant of redemption; null before", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # -------- Departure: cyclic (OPEN <-> GUARANTEED), plus terminal branches ----
  - entity: Departure
    field: status
    initial_state: PLANNING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /api/departures/{departure_id}/publish"
        actor: OpsManager
        preconditions:
          - "Departure has >= 1 itinerary_days"
        side_effects:
          - "Departure becomes sellable (Bookings may be created and confirmed)"

      - from: OPEN
        to: GUARANTEED
        trigger: "system (Booking confirm side-effect when confirmed_pax >= guaranteed_min_pax)"
        actor: system
        preconditions:
          - "confirmed_pax >= guaranteed_min_pax (>= boundary)"
        side_effects:
          - "Departure marked GUARANTEED; no field reset"

      - from: GUARANTEED
        to: OPEN
        trigger: "system (Booking cancel side-effect when confirmed_pax < guaranteed_min_pax)"
        actor: system
        preconditions:
          - "confirmed_pax < guaranteed_min_pax after a cancellation"
        side_effects:
          - "Departure reverts to OPEN (cycle); no field reset"

      - from: GUARANTEED
        to: DEPARTED
        trigger: "POST /api/departures/{departure_id}/depart"
        actor: OpsManager
        preconditions:
          - "coach_id, driver_id, guide_id all non-null (ERR_DEPARTURE_NOT_ASSIGNED)"
        note: "Depart is only reachable from GUARANTEED, which already implies confirmed_pax >= guaranteed_min_pax."
        side_effects:
          - "Each CONFIRMED Booking -> TRAVELED"
          - "final_per_person_cents pinned on each traveled Booking from actual occupancy_band"
          - "occupancy_band recomputed from confirmed_pax"

      - from: DEPARTED
        to: SETTLED
        trigger: "POST /api/departures/{departure_id}/settle"
        actor: Finance
        preconditions:
          - "Departure.status == DEPARTED"
        side_effects:
          - "settlement_net_cents pinned = final settlement (revenue - cost) per calc departure_settlement variant=final"
          - "assigned Coach.status -> AVAILABLE, Driver.status -> AVAILABLE, Guide.status -> AVAILABLE"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/departures/{departure_id}/cancel"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "CASCADE L1: each non-terminal Booking -> CANCELLED (operator cancel, no penalty)"
          - "CASCADE L2: each cancelled Booking's ISSUED Vouchers -> VOIDED"
          - "CASCADE L2: each cancelled Booking gets a REFUND Payment of amount_paid_cents (full refund, penalty 0)"
          - "Passenger seat_no/room_no cleared; Coach/HotelBlock committed counts recomputed"
          - "assigned Coach.status -> AVAILABLE, Driver.status -> AVAILABLE, Guide.status -> AVAILABLE"

      - from: GUARANTEED
        to: CANCELLED
        trigger: "POST /api/departures/{departure_id}/cancel"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Same cascade as OPEN->CANCELLED (full refund, vouchers voided, resources released)"

  # -------- Booking parallel dimension A: reservation_status --------------------
  - entity: Booking
    field: reservation_status
    initial_state: DRAFT
    terminal_states: [TRAVELED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /api/bookings/{booking_id}/confirm"
        actor: SalesAgent
        preconditions:
          - "Departure.status IN {OPEN, GUARANTEED} (ERR_DEPARTURE_NOT_OPEN) [cross-entity Booking->Departure]"
          - "payment_status IN {DEPOSIT_PAID, PAID_IN_FULL} (ERR_DEPOSIT_UNPAID)"
          - "count(Passengers on booking) == pax_count (ERR_PASSENGER_COUNT_MISMATCH)"
          - "Departure.confirmed_pax + pax_count <= assigned Coach.seat_capacity when coach assigned (ERR_COACH_CAPACITY_EXCEEDED)"
          - "sum rooms_committed + rooms_requested <= HotelBlock.room_count for each block (ERR_HOTEL_BLOCK_INSUFFICIENT)"
        side_effects:
          - "Assign seat_no to each Passenger (lowest free seat numbers ASC), room_no per rooms_requested"
          - "Issue one MEAL Voucher (ISSUED, face_value 2500) per Passenger"
          - "Departure.confirmed_pax += pax_count; occupancy_band recomputed"
          - "HotelBlock.rooms_committed += rooms_requested; block_cost recomputed"
          - "If confirmed_pax >= guaranteed_min_pax: Departure OPEN -> GUARANTEED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/bookings/{booking_id}/cancel"
        actor: SalesAgent
        preconditions:
          - "Departure.status NOT IN {DEPARTED, SETTLED} (ERR_INVALID_STATE)"
        side_effects:
          - "penalty_charged_cents pinned = calc cancellation_refund penalty"
          - "CASCADE L1: each Passenger on booking -> seat_no/room_no cleared"
          - "CASCADE L2: Coach.seats reflected via Departure.confirmed_pax -= pax_count; HotelBlock.rooms_committed -= rooms_requested"
          - "ISSUED Vouchers on booking -> VOIDED"
          - "REFUND Payment created for amount_paid_cents - penalty_charged_cents (floored at 0); payment_status -> REFUNDED"
          - "If confirmed_pax < guaranteed_min_pax: Departure GUARANTEED -> OPEN (revert cycle)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/bookings/{booking_id}/cancel"
        actor: SalesAgent
        preconditions: []
        side_effects:
          - "No penalty (never confirmed); REFUND Payment for amount_paid_cents if any; payment_status -> REFUNDED"

      - from: CONFIRMED
        to: TRAVELED
        trigger: "system (Departure depart side-effect)"
        actor: system
        preconditions:
          - "Departure.status transitions GUARANTEED -> DEPARTED"
        side_effects:
          - "final_per_person_cents pinned from actual occupancy_band"

  # -------- Booking parallel dimension B: payment_status (independent axis) -----
  - entity: Booking
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /api/payments (kind=DEPOSIT)"
        actor: SalesAgent
        preconditions:
          - "amount_paid_cents >= deposit_due_cents after this payment"
          - "amount_paid_cents < booking_total_cents"
        side_effects:
          - "payment_status recomputed to DEPOSIT_PAID"

      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /api/payments (kind=BALANCE)"
        actor: SalesAgent
        preconditions:
          - "amount_paid_cents >= booking_total_cents after this payment"
        side_effects:
          - "payment_status recomputed to PAID_IN_FULL"

      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /api/payments (single payment covering full total)"
        actor: SalesAgent
        preconditions:
          - "amount_paid_cents >= booking_total_cents after this payment"
        side_effects:
          - "payment_status recomputed to PAID_IN_FULL"

      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "system (Booking cancel side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "REFUND Payment recorded; payment_status -> REFUNDED"

      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "system (Booking cancel side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "REFUND Payment recorded; payment_status -> REFUNDED"

  # -------- Coach: cyclic AVAILABLE <-> ASSIGNED --------------------------------
  - entity: Coach
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /api/departures/{departure_id}/assign (resource_kind=COACH)"
        actor: OpsManager
        preconditions:
          - "No date-overlap with another non-CANCELLED Departure holding this coach, honoring TURNAROUND_BUFFER_DAYS (= 1 whole day) (ERR_COACH_OVERLAP)"
        side_effects:
          - "Coach.status -> ASSIGNED; Departure.coach_id set; Departure.version += 1"

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (Departure settle / cancel side-effect, or reassignment supersede)"
        actor: system
        preconditions: []
        side_effects:
          - "Coach released back to the pool"

  # -------- Driver: AVAILABLE <-> ASSIGNED -------------------------------------
  - entity: Driver
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /api/departures/{departure_id}/assign (resource_kind=DRIVER)"
        actor: OpsManager
        preconditions:
          - "Every itinerary day planned_drive_hours <= DOT_MAX_DRIVE_HOURS_PER_DAY (ERR_DOT_HOURS_EXCEEDED)"
          - "No date-overlap with another non-CANCELLED Departure holding this driver (ERR_DRIVER_OVERLAP)"
        side_effects:
          - "Driver.status -> ASSIGNED; Departure.driver_id set; Departure.version += 1"

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (Departure settle / cancel side-effect, or reassignment supersede)"
        actor: system
        preconditions: []
        side_effects: []

  # -------- Guide: AVAILABLE <-> ASSIGNED (half-open overlap) -------------------
  - entity: Guide
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /api/departures/{departure_id}/assign (resource_kind=GUIDE)"
        actor: OpsManager
        preconditions:
          - "No half-open [start_date, end_date) overlap with another non-CANCELLED Departure holding this guide (ERR_GUIDE_OVERLAP)"
        side_effects:
          - "Guide.status -> ASSIGNED; Departure.guide_id set; Departure.version += 1"

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (Departure settle / cancel side-effect, or reassignment supersede)"
        actor: system
        preconditions: []
        side_effects: []

  # -------- HotelBlock: HELD -> CONFIRMED -> RELEASED --------------------------
  - entity: HotelBlock
    field: status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /api/hotel-blocks/{hotel_block_id}/confirm"
        actor: OpsManager
        preconditions:
          - "Departure.status NOT IN {CANCELLED, SETTLED} (ERR_INVALID_STATE)"
        side_effects:
          - "Block committed with the hotel; block_cost_cents frozen at confirmation"

      - from: HELD
        to: RELEASED
        trigger: "POST /api/hotel-blocks/{hotel_block_id}/release"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Rooms returned to hotel; rooms_committed no longer counted"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /api/hotel-blocks/{hotel_block_id}/release"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "Rooms returned to hotel"

  # -------- Voucher: ISSUED -> REDEEMED | VOIDED -------------------------------
  - entity: Voucher
    field: status
    initial_state: ISSUED
    terminal_states: [REDEEMED, VOIDED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /api/vouchers/{voucher_id}/redeem"
        actor: SalesAgent
        preconditions:
          - "Voucher.status == ISSUED (ERR_VOUCHER_NOT_ISSUED)"
        side_effects:
          - "redeemed_at stamped to logical clock; face_value enters final settlement cost"

      - from: ISSUED
        to: VOIDED
        trigger: "system (Booking cancel / Departure cancel side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "Voucher voided; excluded from settlement cost"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assign-resource-stale-departure
    parent_entity: Departure
    write_endpoint: "POST /api/departures/{departure_id}/assign"
    occ_field: "expected_departure_version"
    description: |
      Assigning (or reassigning) a coach/driver/guide to a Departure whose
      version has advanced since the client last observed it is rejected.
      Reassignment legitimately supersedes the prior resource under the assign
      transition, so a client acting on a stale view of the Departure must be
      rejected on the OCC version rather than silently overwriting a newer
      assignment.
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: per_person_price
    trigger: "Booking creation (quoted); Departure depart (final)"
    algorithm: tiered_pricing
    formula: |
      band_multiplier(band):
        SMALL    -> 1.20   # projected/actual confirmed_pax < 6
        STANDARD -> 1.00   # 6 <= confirmed_pax < 12
        LARGE    -> 0.90   # confirmed_pax >= 12
      per_person = round_half_up(TourProduct.base_price_per_person_cents * band_multiplier)
    input_set: "Occupancy band chosen per variant (see variants)."
    constants:
      SMALL_MAX_PAX: 5
      LARGE_MIN_PAX: 12
      SMALL_MULT: 1.20
      STANDARD_MULT: 1.00
      LARGE_MULT: 0.90
    precision: "whole cents, round_half_up"
    variants:
      - name: quoted
        when: "at Booking creation"
        difference: "band from PROJECTED confirmed_pax = Departure.confirmed_pax + this.pax_count (forward-looking); locked into quoted_per_person_cents"
      - name: final
        when: "at Departure depart (GUARANTEED->DEPARTED)"
        difference: "band from ACTUAL Departure.confirmed_pax at depart time; pinned into final_per_person_cents"

  - name: booking_service_fee
    trigger: "Booking creation"
    algorithm: threshold
    formula: |
      # Combinatorial mode (b): round-per-line THEN multiply. Order is pinned.
      per_person_fee = round_half_up(quoted_per_person_cents * SERVICE_FEE_RATE)
      service_fee_cents = per_person_fee * pax_count      # NOT round(subtotal * rate)
    input_set: "The single booking being created."
    constants:
      SERVICE_FEE_RATE: 0.0725
    precision: "whole cents, round_half_up on the per-person fee only"

  - name: booking_charges
    trigger: "Booking creation"
    algorithm: aggregation
    formula: |
      base_subtotal_cents      = quoted_per_person_cents * pax_count
      insurance_premium_cents  = insurance_opt_in ? round_half_up(base_subtotal_cents * INSURANCE_PREMIUM_RATE) : 0
      booking_total_cents      = base_subtotal_cents + service_fee_cents + insurance_premium_cents
      deposit_due_cents        = TourProduct.deposit_per_person_cents * pax_count
    input_set: "The single booking being created; service_fee_cents from booking_service_fee."
    constants:
      INSURANCE_PREMIUM_RATE: 0.06
    precision: "whole cents, round_half_up"

  - name: cancellation_refund
    trigger: "POST /api/bookings/{booking_id}/cancel from CONFIRMED"
    algorithm: threshold
    formula: |
      # Combinatorial mode (a): >=3 inputs, nested max/min, conditional branch.
      days_before = date(Departure.start_date) - date(logical_clock_date)   # whole days
      penalty_pct =
        days_before >= 60 -> 0.10
        30 <= days_before < 60 -> 0.25
        15 <= days_before < 30 -> 0.50
        days_before < 15 -> 1.00
      base_penalty = round_half_up(base_subtotal_cents * penalty_pct)
      non_refundable = deposit_due_cents            # deposit always retained
      if insurance_opt_in:
        penalty_charged_cents = non_refundable       # insurance waives penalty above deposit
      else:
        penalty_charged_cents = max(base_penalty, non_refundable)
      refund_amount = max(0, amount_paid_cents - penalty_charged_cents)
    input_set: "The cancelling booking; clock date; departure start_date."
    constants:
      TIER_60_PCT: 0.10
      TIER_30_PCT: 0.25
      TIER_15_PCT: 0.50
      TIER_0_PCT: 1.00
    precision: "whole cents, round_half_up"

  - name: departure_settlement
    trigger: "GET /api/departures/{departure_id}/settlement (provisional); POST /api/departures/{departure_id}/settle (final)"
    algorithm: forward_looking
    formula: |
      duration = TourProduct.duration_days
      crew_cost = Coach.day_rate_cents*duration + Driver.day_rate_cents*duration + Guide.day_rate_cents*duration
      hotel_cost = sum(HotelBlock.block_cost_cents for blocks with status==CONFIRMED)
      # revenue and voucher cost differ by variant:
      net_cents = revenue - (crew_cost + hotel_cost + voucher_cost)
    input_set: "See variants for booking-status filter and voucher basis."
    constants:
      MEAL_VOUCHER_CENTS: 2500
    precision: "whole cents; sums are exact integers"
    variants:
      - name: provisional
        when: "GET settlement while status IN {OPEN, GUARANTEED}"
        difference: "revenue = sum(booking_total_cents for Bookings reservation_status==CONFIRMED); voucher_cost = sum(face_value for ISSUED vouchers) [estimate all issued redeemed]"
      - name: final
        when: "at settle (DEPARTED->SETTLED)"
        difference: "revenue = sum(final_per_person_cents*pax_count + service_fee_cents + insurance_premium_cents for Bookings reservation_status==TRAVELED); voucher_cost = sum(face_value for REDEEMED vouchers only)"

  - name: seat_occupancy
    trigger: "Booking confirm / cancel; Departure cancel"
    algorithm: aggregation
    formula: |
      Departure.confirmed_pax = sum(pax_count for Bookings on this departure
                                    with reservation_status IN {CONFIRMED, TRAVELED})
      Coach seats_used == Departure.confirmed_pax  (conserved: forward+compensating leave it unchanged)
    input_set: "Bookings filtered to CONFIRMED/TRAVELED for this departure."
    precision: "integer count"

  - name: rooms_committed
    trigger: "Booking confirm / cancel; Departure cancel"
    algorithm: aggregation
    formula: |
      HotelBlock.rooms_committed = sum(rooms_requested for Bookings on this departure
                                       with reservation_status IN {CONFIRMED, TRAVELED})
      block_cost_cents = rooms_committed * nights * rate_per_room_night_cents
    input_set: "Bookings filtered to CONFIRMED/TRAVELED for this departure."
    precision: "integer count / whole cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request body well-formed; required fields present; enums valid; amounts positive"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Path ids and referenced FK ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target Departure is not in a terminal state (CANCELLED/SETTLED) for mutating ops"
    error_id: ERR_DEPARTURE_TERMINAL
    http_status: 409
    applies_to: "departure assign/publish/depart/cancel/settle, hotel-block confirm"

  - priority: 6
    category: state
    check: "Resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "Booking confirm requires Departure.status IN {OPEN, GUARANTEED}"
    error_id: ERR_DEPARTURE_NOT_OPEN
    http_status: 409
    applies_to: "POST /api/bookings/{booking_id}/confirm"

  - priority: 8
    category: state
    check: "Target Booking not already terminal (CANCELLED/TRAVELED)"
    error_id: ERR_BOOKING_TERMINAL
    http_status: 409
    applies_to: "POST /api/bookings/{booking_id}/confirm, /cancel"

  - priority: 9
    category: business_safety
    check: "Assign driver: every itinerary day planned_drive_hours <= DOT_MAX_DRIVE_HOURS_PER_DAY (10)"
    error_id: ERR_DOT_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /api/departures/{departure_id}/assign (DRIVER)"

  - priority: 10
    category: business_temporal
    check: "Assign coach: no closed-interval date overlap with another non-CANCELLED departure holding it, honoring TURNAROUND_BUFFER_DAYS (= 1 whole day; each coach window padded by 1 day on each side before the closed-interval overlap test)"
    error_id: ERR_COACH_OVERLAP
    http_status: 409
    applies_to: "POST /api/departures/{departure_id}/assign (COACH)"

  - priority: 11
    category: business_temporal
    check: "Assign driver: no date overlap with another non-CANCELLED departure holding it"
    error_id: ERR_DRIVER_OVERLAP
    http_status: 409
    applies_to: "POST /api/departures/{departure_id}/assign (DRIVER)"

  - priority: 12
    category: business_temporal
    check: "Assign guide: no half-open [start,end) overlap with another non-CANCELLED departure holding it"
    error_id: ERR_GUIDE_OVERLAP
    http_status: 409
    applies_to: "POST /api/departures/{departure_id}/assign (GUIDE)"

  - priority: 13
    category: business_constraint
    check: "Confirm: Departure.confirmed_pax + pax_count <= assigned Coach.seat_capacity"
    error_id: ERR_COACH_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /api/bookings/{booking_id}/confirm"

  - priority: 14
    category: business_constraint
    check: "Confirm: number of Passengers on booking equals pax_count"
    error_id: ERR_PASSENGER_COUNT_MISMATCH
    http_status: 409
    applies_to: "POST /api/bookings/{booking_id}/confirm"

  - priority: 15
    category: business_constraint
    check: "Confirm: rooms_committed + rooms_requested <= HotelBlock.room_count for each block"
    error_id: ERR_HOTEL_BLOCK_INSUFFICIENT
    http_status: 409
    applies_to: "POST /api/bookings/{booking_id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Depart: coach_id, driver_id, guide_id all assigned"
    error_id: ERR_DEPARTURE_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /api/departures/{departure_id}/depart"

  - priority: 19
    category: business_fiscal
    check: "Confirm: deposit paid (payment_status IN {DEPOSIT_PAID, PAID_IN_FULL})"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 402
    applies_to: "POST /api/bookings/{booking_id}/confirm"

  - priority: 20
    category: business_fiscal
    check: "Settle: no TRAVELED booking has outstanding balance (amount_paid_cents >= booking_total_cents)"
    error_id: ERR_BALANCE_UNPAID
    http_status: 402
    applies_to: "POST /api/departures/{departure_id}/settle"

  - priority: 21
    category: state
    check: "Redeem: voucher currently ISSUED"
    error_id: ERR_VOUCHER_NOT_ISSUED
    http_status: 409
    applies_to: "POST /api/vouchers/{voucher_id}/redeem"

  - priority: 22
    category: business_referential
    check: "Assign: expected_departure_version matches current Departure.version"
    error_id: ERR_STALE_DEPARTURE_VERSION
    http_status: 412
    applies_to: "POST /api/departures/{departure_id}/assign"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- TourProduct ----
  - method: POST
    path: "/api/tour-products"
    description: "Create a tour product (catalog template)"
    roles: [OpsManager]
    code: 201
    input: [name, duration_days, base_price_per_person_cents, "deposit_per_person_cents?"]
    output: TourProduct
    side_effects: []

  # ---- Coach ----
  - method: POST
    path: "/api/coaches"
    description: "Create a coach (seat/coach inventory)"
    roles: [OpsManager]
    code: 201
    input: [code, seat_capacity, day_rate_cents]
    output: Coach
    side_effects: ["status initialized AVAILABLE"]

  - method: GET
    path: "/api/coaches/{coach_id}"
    description: "Get a coach"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Coach
    side_effects: []

  # ---- Driver ----
  - method: POST
    path: "/api/drivers"
    description: "Create a driver"
    roles: [OpsManager]
    code: 201
    input: [name, license_no, day_rate_cents]
    output: Driver
    side_effects: ["status initialized AVAILABLE"]

  - method: GET
    path: "/api/drivers/{driver_id}"
    description: "Get a driver"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Driver
    side_effects: []

  # ---- Guide ----
  - method: POST
    path: "/api/guides"
    description: "Create a guide / tour director (escort)"
    roles: [OpsManager]
    code: 201
    input: [name, day_rate_cents]
    output: Guide
    side_effects: ["status initialized AVAILABLE"]

  # ---- Departure ----
  - method: POST
    path: "/api/departures"
    description: "Create a departure (dated instance of a tour product)"
    roles: [OpsManager]
    code: 201
    input: [tour_product_id, name, start_date, end_date, guaranteed_min_pax, itinerary_days]
    output: Departure
    side_effects: ["status initialized PLANNING; confirmed_pax 0; occupancy_band SMALL"]

  - method: GET
    path: "/api/departures/{departure_id}"
    description: "Get a departure"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Departure
    side_effects: []

  - method: GET
    path: "/api/departures"
    description: "List departures (filterable)"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: ["tour_product_id?", "coach_id?", "driver_id?", "guide_id?", "status?", "limit?", "offset?"]
    output: Departure[]
    side_effects: []

  - method: POST
    path: "/api/departures/{departure_id}/publish"
    description: "PLANNING -> OPEN"
    roles: [OpsManager]
    code: 200
    input: []
    output: Departure
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/api/departures/{departure_id}/assign"
    description: "Assign or reassign coach/driver/guide (OCC on departure version)"
    roles: [OpsManager]
    code: 200
    input: [resource_kind, "coach_id?", "driver_id?", "guide_id?", expected_departure_version]
    output: Departure
    side_effects:
      - "sets coach_id/driver_id/guide_id per resource_kind; resource.status -> ASSIGNED; prior resource (on reassign) -> AVAILABLE"
      - "increments Departure.version by 1"

  - method: POST
    path: "/api/departures/{departure_id}/depart"
    description: "GUARANTEED -> DEPARTED"
    roles: [OpsManager]
    code: 200
    input: []
    output: Departure
    side_effects:
      - "CONFIRMED bookings -> TRAVELED; final_per_person_cents pinned"
      - "occupancy_band recomputed"

  - method: POST
    path: "/api/departures/{departure_id}/cancel"
    description: "OPEN/GUARANTEED -> CANCELLED (cascade)"
    roles: [OpsManager]
    code: 200
    input: ["reason?"]
    output: Departure
    side_effects:
      - "cascade: bookings CANCELLED, vouchers VOIDED, full REFUND payments, seats/rooms cleared, resources released"

  - method: POST
    path: "/api/departures/{departure_id}/settle"
    description: "DEPARTED -> SETTLED (final settlement)"
    roles: [Finance]
    code: 200
    input: []
    output: Departure
    side_effects:
      - "settlement_net_cents pinned (final variant); coach/driver/guide released"

  - method: GET
    path: "/api/departures/{departure_id}/manifest"
    description: "Computed escort manifest: passengers, seats, rooming, vouchers"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: "{ departure_id: string, confirmed_pax: integer, passengers: array, rooming: array, vouchers: array }"
    side_effects: []

  - method: GET
    path: "/api/departures/{departure_id}/settlement"
    description: "Computed settlement (provisional before SETTLED, final after)"
    roles: [OpsManager, Finance, Auditor]
    code: 200
    input: []
    output: "{ departure_id: string, variant: string, revenue_cents: integer, cost_cents: integer, net_cents: integer }"
    side_effects: []

  # ---- HotelBlock ----
  - method: POST
    path: "/api/hotel-blocks"
    description: "Create a hotel block for a departure"
    roles: [OpsManager]
    code: 201
    input: [departure_id, hotel_name, city, room_count, nights, rate_per_room_night_cents]
    output: HotelBlock
    side_effects: ["status initialized HELD; rooms_committed 0"]

  - method: GET
    path: "/api/hotel-blocks/{hotel_block_id}"
    description: "Get a hotel block"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: HotelBlock
    side_effects: []

  - method: GET
    path: "/api/hotel-blocks"
    description: "List hotel blocks (filter by departure)"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: ["departure_id?", "limit?", "offset?"]
    output: HotelBlock[]
    side_effects: []

  - method: POST
    path: "/api/hotel-blocks/{hotel_block_id}/confirm"
    description: "HELD -> CONFIRMED"
    roles: [OpsManager]
    code: 200
    input: []
    output: HotelBlock
    side_effects: ["block_cost_cents frozen"]

  - method: POST
    path: "/api/hotel-blocks/{hotel_block_id}/release"
    description: "HELD/CONFIRMED -> RELEASED"
    roles: [OpsManager]
    code: 200
    input: []
    output: HotelBlock
    side_effects: ["rooms returned"]

  # ---- Booking ----
  - method: POST
    path: "/api/bookings"
    description: "Create a booking (DRAFT); computes quoted price, fees, deposit"
    roles: [SalesAgent]
    code: 201
    input: [departure_id, lead_name, pax_count, rooms_requested, "insurance_opt_in?"]
    output: Booking
    side_effects:
      - "quoted_per_person_cents, base_subtotal_cents, service_fee_cents, insurance_premium_cents, booking_total_cents, deposit_due_cents computed"

  - method: GET
    path: "/api/bookings/{booking_id}"
    description: "Get a booking"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/api/bookings"
    description: "List bookings (filter by departure / reservation_status)"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: ["departure_id?", "reservation_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/api/bookings/{booking_id}/confirm"
    description: "DRAFT -> CONFIRMED (assign seats/rooms, issue vouchers, guarantee check)"
    roles: [SalesAgent]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "seat_no/room_no assigned; MEAL vouchers issued; confirmed_pax/rooms_committed recomputed; OPEN->GUARANTEED if threshold met"

  - method: POST
    path: "/api/bookings/{booking_id}/cancel"
    description: "DRAFT/CONFIRMED -> CANCELLED (penalty, refund, void vouchers, release seats/rooms)"
    roles: [SalesAgent]
    code: 200
    input: ["reason?"]
    output: Booking
    side_effects:
      - "penalty_charged_cents pinned; REFUND payment; vouchers VOIDED; seats/rooms released; GUARANTEED->OPEN if drops below min"

  # ---- Passenger ----
  - method: POST
    path: "/api/passengers"
    description: "Add a passenger to a booking (rooming-list / manifest)"
    roles: [SalesAgent]
    code: 201
    input: [booking_id, full_name, "is_lead?", "roommate_passenger_id?"]
    output: Passenger
    side_effects: []

  - method: GET
    path: "/api/passengers/{passenger_id}"
    description: "Get a passenger"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Passenger
    side_effects: []

  - method: GET
    path: "/api/passengers"
    description: "List passengers (filter by booking / roommate)"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: ["booking_id?", "roommate_passenger_id?", "limit?", "offset?"]
    output: Passenger[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/api/payments"
    description: "Record a deposit or balance payment against a booking"
    roles: [SalesAgent]
    code: 201
    input: [booking_id, kind, amount_cents, "method?"]
    output: Payment
    side_effects: ["booking.amount_paid_cents and payment_status recomputed"]

  - method: GET
    path: "/api/payments/{payment_id}"
    description: "Get a payment"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/api/payments"
    description: "List payments (filter by booking)"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Voucher ----
  - method: GET
    path: "/api/vouchers/{voucher_id}"
    description: "Get a voucher"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: []
    output: Voucher
    side_effects: []

  - method: GET
    path: "/api/vouchers"
    description: "List vouchers (filter by booking / passenger)"
    roles: [OpsManager, SalesAgent, Finance, Auditor]
    code: 200
    input: ["booking_id?", "passenger_id?", "limit?", "offset?"]
    output: Voucher[]
    side_effects: []

  - method: POST
    path: "/api/vouchers/{voucher_id}/redeem"
    description: "ISSUED -> REDEEMED"
    roles: [SalesAgent]
    code: 200
    input: []
    output: Voucher
    side_effects: ["redeemed_at stamped; enters final settlement cost"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server default before any call is 2026-07-01T00:00:00Z (never real wall-clock). Governs cancellation tiers, deposit/balance due dates, and voucher redeemed_at."
    roles: [OpsManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum, non-positive amount" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK id does not exist" }
  - { id: ERR_DEPARTURE_TERMINAL, http: 409, condition: "Departure is CANCELLED or SETTLED and cannot be mutated" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_DEPARTURE_NOT_OPEN, http: 409, condition: "Booking confirm requires Departure in OPEN or GUARANTEED" }
  - { id: ERR_BOOKING_TERMINAL, http: 409, condition: "Booking already CANCELLED or TRAVELED" }
  - { id: ERR_DOT_HOURS_EXCEEDED, http: 409, condition: "An itinerary day exceeds DOT_MAX_DRIVE_HOURS_PER_DAY on driver assignment" }
  - { id: ERR_COACH_OVERLAP, http: 409, condition: "Coach already assigned to a date-overlapping departure (incl. turnaround buffer)" }
  - { id: ERR_DRIVER_OVERLAP, http: 409, condition: "Driver already assigned to a date-overlapping departure" }
  - { id: ERR_GUIDE_OVERLAP, http: 409, condition: "Guide already assigned to a half-open date-overlapping departure" }
  - { id: ERR_COACH_CAPACITY_EXCEEDED, http: 409, condition: "Confirm would push confirmed_pax above assigned coach seat_capacity" }
  - { id: ERR_PASSENGER_COUNT_MISMATCH, http: 409, condition: "Passenger count on booking does not equal pax_count at confirm" }
  - { id: ERR_HOTEL_BLOCK_INSUFFICIENT, http: 409, condition: "Confirm would push rooms_committed above a hotel block room_count" }
  - { id: ERR_DEPARTURE_NOT_ASSIGNED, http: 409, condition: "Depart requires coach, driver and guide all assigned" }
  - { id: ERR_DEPOSIT_UNPAID, http: 402, condition: "Confirm requires deposit paid" }
  - { id: ERR_BALANCE_UNPAID, http: 402, condition: "Settle requires all traveled bookings paid in full" }
  - { id: ERR_VOUCHER_NOT_ISSUED, http: 409, condition: "Redeem requires voucher in ISSUED status" }
  - { id: ERR_STALE_DEPARTURE_VERSION, http: 412, condition: "expected_departure_version does not match current Departure.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsManager
    description: "Operations: tour products, fleet, departures lifecycle, resource assignment, hotel blocks, clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/tour-products"
      - "POST /api/coaches"
      - "POST /api/drivers"
      - "POST /api/guides"
      - "POST /api/departures"
      - "POST /api/departures/{id}/publish"
      - "POST /api/departures/{id}/assign"
      - "POST /api/departures/{id}/depart"
      - "POST /api/departures/{id}/cancel"
      - "POST /api/hotel-blocks (+ confirm/release)"
      - "POST /_clock/set_current_utc"
