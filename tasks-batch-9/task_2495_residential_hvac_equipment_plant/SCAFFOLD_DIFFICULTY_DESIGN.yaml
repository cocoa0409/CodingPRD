            - "GET /plant/product-platforms/${plat_id}/warranty-analysis?basis=SHIPPED_BASIS reports rolling_claim_rate_pct == 300.00 (3 claims over max(0, 1) shipped units) without changing the stored 5.00"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocate_refused_because_certification_two_entities_away_was_rejected
        grounds:
          - validations.region-not-certified
          - calculations.platform_regional_salability
          - state_machines.CertificationRecord.SUBMITTED_to_REJECTED
          - entities.ProductPlatform.fields.blocked_region_codes
          - entities.CertificationRecord.fields.status
        distinguishing_aspect: |
          The allocate request names only a distributor order and a supply version, yet its outcome
          is decided by the status of a CertificationRecord two entities away: the order's platform
          is RELEASED, the supply pool is full, the region's standard is ACTIVE and the platform's
          SEER2 clears the regional minimum - the single reason for the refusal is that the SOUTHEAST
          certification was REJECTED rather than CERTIFIED.
