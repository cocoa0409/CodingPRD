    description: "List stages of a care plan"
    roles: [NetworkAdmin, CareCoordinator, PhilanthropyOfficer, BillingSpecialist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StagedProcedure[]"
    side_effects: []

  - method: GET
    path: "/charity-care/staged-procedures/{stageId}"
    description: "Get one staged procedure"
    roles: [NetworkAdmin, CareCoordinator, PhilanthropyOfficer, BillingSpecialist]
    code: 200
    input: []
    output: StagedProcedure
    side_effects: []

  - method: POST
    path: "/charity-care/staged-procedures/{stageId}/schedule"
    description: "Schedule a planned stage (age window + one-in-flight gating)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: StagedProcedure
    side_effects: ["care plan PLANNING -> ACTIVE_TREATMENT on first schedule; version += 1"]

  - method: POST
    path: "/charity-care/staged-procedures/{stageId}/complete"
    description: "Mark a scheduled stage completed (requires clock >= scheduled_date)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: StagedProcedure
    side_effects: ["completed_stage_count += 1; plan -> SURVEILLANCE when all stages complete; version += 1"]

  - method: POST
    path: "/charity-care/staged-procedures/{stageId}/defer"
    description: "Defer a scheduled stage"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: StagedProcedure
    side_effects: ["version += 1"]

  - method: POST
    path: "/charity-care/staged-procedures/{stageId}/replan"
