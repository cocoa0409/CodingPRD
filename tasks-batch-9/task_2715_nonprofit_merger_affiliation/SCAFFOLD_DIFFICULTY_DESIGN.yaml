  - rule_id: cross_entity_state_dependency
    instances:
      - name: restricted_fund_transfer_gated_by_the_other_entity_deal_status
        grounds:
          - state_machines.RestrictedFund.CONSENT_GRANTED_to_TRANSFERRED
          - validations.priority_16_ERR_INVALID_DEAL_STATE
          - entities.Restructuring.fields.status
        distinguishing_aspect: |
          The fund is fully ready on its own terms - transfer_status CONSENT_GRANTED,
          restriction_conflict false, basis DONOR_CONSENT, held by a deal party - so
          every precondition local to the RestrictedFund is satisfied. The transfer
          must still be refused because a DIFFERENT entity, the Restructuring, is only
          in DILIGENCE. The identical call succeeds once the deal advances to
          STRUCTURE_SELECTED with nothing about the fund changed, which isolates the
          cross-entity gate from the fund's own state machine.
        test_recipe:
          setup:
            - "A Restructuring in status DILIGENCE with one OPEN FINANCE finding of exposure 29916670, so its DILIGENCE_ADJUSTED assessment reports reserve_months 4.20 and composite_rating MODERATE"
            - "One TEMP_RESTRICTED RestrictedFund held by the initiator with principal_cents 50000000, accumulated_appreciation_cents 12000000, historic_dollar_value_cents 0 and restriction_conflict false, already advanced to CONSENT_GRANTED"
          setup_api_calls:
            - call: "POST /organizations"
