            - "the decide carrying expected_affiliate_version ${aff_v1} returns HTTP 412 with data.error_id == \"ERR_STALE_AFFILIATE_VERSION\""
            - "after the refusal AffiliateApplication.${app_id}.review_state == \"SCREENED\", decision_by_user_id is null and Affiliate.${aff_id}.status == \"PENDING_APPLICATION\" with version still 2"
            - "${aff_v2} == 2 and the retry with it returns HTTP 200 with review_state == \"APPROVED\""
            - "Affiliate.${aff_id}.status == \"ACTIVE\" with version == 3 after the successful decide"

      - name: stale_conversion_version_on_attribute_rejected_after_late_click
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[attribute-stale-conversion]
          - validations[priority 30]
          - errors[ERR_STALE_CONVERSION_VERSION]
          - endpoints[POST /conversions/{id}/attribute]
          - calculations.attribution_resolution
        distinguishing_aspect: "A click ingested after the order row exists but whose occurred_at (11:00) still precedes placed_at (12:00) joins the candidate set, taking candidate_click_count from 1 to 2 and Conversion.version from 1 to 2 while attribution_status stays UNATTRIBUTED. The cached expected_conversion_version 1 therefore fails with ERR_STALE_CONVERSION_VERSION (412) even though the run is otherwise legal, and the retry at version 2 attributes to the newer 11:00 click rather than the 10:00 one — proving the guard protects the candidate set, not the status."
