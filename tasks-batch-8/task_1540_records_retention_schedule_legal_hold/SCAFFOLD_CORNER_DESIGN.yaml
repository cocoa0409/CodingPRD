              captures: { jur: "$.data.id" }
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-INC", retention_months: 84, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { inc: "$.data.id" }
            - call: "POST /ig/retention-rules/${inc}/activate"
              payload: {}
              as: RecordsManager
              captures: { inc_v0: $.data.version }
          trigger:
            - call: "POST /ig/retention-rules/${inc}/supersede"
              payload: { rule_code: "R-S1", retention_months: 96, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z", expected_retention_rule_version: "${inc_v0}" }
              as: RecordsManager
              captures: { s1: "$.data.id", s1_st: "$.data.status" }
            - call: "POST /ig/retention-rules/${inc}/supersede"
              payload: { rule_code: "R-S2", retention_months: 108, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z", expected_retention_rule_version: "${inc_v0}" }
              as: RecordsManager
              captures: { err: "$.data.error_id" }
            - call: "GET /ig/retention-rules/${inc}"
              payload: {}
              as: RecordsManager
              captures: { inc_v_end: "$.data.version" }
          assert:
            - "First supersede succeeds with the post-activation version ${inc_v0}: successor ${s1} created DRAFT and target version bumped"
            - "Second supersede with the same (now stale) version: err == ERR_STALE_VERSION (http 412)"
            - "INC version == ${inc_v0} + 1 exactly (only the winning claim bumped it)"

