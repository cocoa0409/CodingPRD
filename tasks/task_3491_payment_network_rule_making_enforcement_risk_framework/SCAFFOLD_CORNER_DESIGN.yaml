              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/return-rate-snapshots"
              payload: { participant_id: "${p1}", period: "2026-09" }
              as: PlatformAdmin
              captures: { snap: $.data.id }
          trigger:
            - call: "POST /network/return-rate-snapshots"
              payload: { participant_id: "${p1}", period: "2026-09" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 with data.error_id == ERR_DUPLICATE_RESOURCE"
            - "GET /network/return-rate-snapshots?participant_id=${p1} still lists exactly one snapshot"

