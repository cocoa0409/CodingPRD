      - name: no_show_cascade_reaches_five_links
        claim_type: cascading_side_effects
        grounds:
          - state_machines.StaffAssignment.SCHEDULED_to_NO_SHOW
        excluded_because:
          difficulty_instance: "transitive_cascade / no_show_five_link_probation_cascade"
          rationale: >-
            The §1.8 instance walks all five links of the NO_SHOW cascade end to end and asserts each
            one, which is exactly the N-level chain claim for this layer.

      - name: event_cancellation_cascade_reaches_four_links
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Event.PLANNED_to_CANCELLED
        excluded_because:
          difficulty_instance: "transitive_cascade / event_cancel_four_link_cascade"
          rationale: >-
            The §1.8 instance asserts the plans -> slots -> assignments -> bids chain together with the
            deliberate non-cascade to accessibility requests, covering the ordering-sensitivity claim.

      - name: both_headcount_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - calculations.staffing_plan_projected_labor_cost
        excluded_because:
          difficulty_instance: "dual_variant_calc / headcount_variant_forecast_vs_historical"
          rationale: >-
            The §1.8 instance runs FORECAST_BASED and HISTORICAL_ACTUAL over identical slots and
            asserts both results plus their delta, which is this layer's both-variants claim.

      - name: refund_variant_delta_on_the_authority_switch
        claim_type: dual_variant_calculation
        grounds:
          - calculations.refund_authorized_amount
        excluded_because:
          difficulty_instance: "dual_variant_calc / refund_authority_supervisor_vs_director"
          rationale: >-
            The §1.8 instance switches the same ask from the supervisor cap to the director cap through
            AWAITING_AUTHORIZATION and asserts the ledger delta, which is this layer's
            delta-on-switch claim.

  # ===================================================================================
  # 9. From Consistency Model - complexity_profile.consistency_model is `immediate`
  # ===================================================================================
  - section: consistency_model
    instances:
      - name: immediate_cascade_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.StaffAssignment.SCHEDULED_to_NO_SHOW
          - endpoints[POST /staff-assignments/{id}/attendance]
        distinguishing_aspect: >-
          Nothing in this domain settles asynchronously: the single NO_SHOW response already carries
          the row's new attendance and payout state, and the very next reads - with no waiting, no
          retry and no polling - show the decremented slot, the brand-new OPEN BackfillRequest and the
          recomputed reliability score.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:10:00Z."
            - "One IN_PROGRESS Event whose LOCKED plan carries a TICKET_TAKER slot (no required certifications, override 2, 18:00Z -> 22:05Z) filled by two SCHEDULED assignments a1 (m1) and a2 (m2), so the slot is FILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:10:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Immediate Cascade Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M1 Absent", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M2 Present", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2019-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { a2: $.data.id, slot_filled_before: $.data.id }
            - call: "GET /position-slots/${slot_id}"
              as: StaffingCoordinator
              captures: { filled_before: $.data.filled_headcount, status_before: $.data.status }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
              captures: { resp_att: $.data.attendance_status, resp_pay: $.data.payout_status, resp_id: $.data.id }
            - call: "GET /position-slots/${slot_id}"
              as: StaffingCoordinator
              captures: { filled_after: $.data.filled_headcount, status_after: $.data.status }
            - call: "GET /backfill-requests?triggering_assignment_id=${a1}&limit=10&offset=0"
              as: StaffingCoordinator
              captures: { bf_count: $.meta.total_count, bf_status: "$.data[0].status", bf_slot: "$.data[0].position_slot_id" }
            - call: "GET /staff-members/${m1}"
              as: StaffingCoordinator
              captures: { rel_after: $.data.reliability_score, season_after: $.data.season_reliability_score, pool_after: $.data.in_backfill_pool }
            - call: "GET /staff-assignments?position_slot_id=${slot_id}&attendance_status=NO_SHOW&limit=10&offset=0"
              as: StaffingCoordinator
              captures: { no_show_count: $.meta.total_count }
          assert:
            - "${filled_before} == 2 and ${status_before} == 'FILLED'"
            - "the mutating response itself is already final: ${resp_id} == ${a1}, ${resp_att} == 'NO_SHOW' and ${resp_pay} == 'VOIDED' - no second read is needed to see the transition"
            - "${filled_after} == 1 and ${status_after} == 'PARTIALLY_FILLED' in the immediately following read"
            - "${bf_count} == 1 with ${bf_status} == 'OPEN' and ${bf_slot} == ${slot_id} - the cascade's new row is queryable at once, not on a later pass"
            - "${rel_after} == 75 and ${season_after} == 75 - both derived scores are current in the same breath"
            - "${pool_after} == true - 75 is above the floor, so no demotion accompanied the cascade"
            - "${no_show_count} == 1 - the filtered list index reflects the new state immediately"
            - "repeating all five reads a second time returns identical bodies: there is no lag window in which a stale value could be observed"

      - name: immediate_derived_ledger_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.staffing_plan_projected_labor_cost
          - calculations.event_refund_budget_ledger
          - endpoints[POST /position-slots]
          - endpoints[POST /guest-issues/{id}/refund-decision]
        distinguishing_aspect: >-
          Derived money is never stale: the slot-creation response already carries its own computed
          cost while the parent plan's aggregate is updated by the same request, and the refund
          approval response carries the approved amount while the grandparent event's ledger has
          already moved - both readable in the immediately following call.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One PLANNED Event (expected_attendance 6000, refund_budget_total_cents 100000) with a DRAFT plan and no slots, so every aggregate starts at 0."
