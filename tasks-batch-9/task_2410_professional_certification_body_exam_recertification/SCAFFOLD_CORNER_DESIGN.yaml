      - name: unknown_candidate_id_not_found_outranks_the_missing_attestation_on_one_application
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_CANDIDATE_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/applications
        distinguishing_aspect: |
          One request violates both the priority-4 foreign-key rule and the priority-7 shape
          rule, and the ladder must return the LOWER priority number's error: 404
          ERR_CANDIDATE_NOT_FOUND, not 400 ERR_INVALID_REQUEST. The two control calls prove each
          rule is independently live — the same body with a real candidate yields
          ERR_INVALID_REQUEST and the complete body yields 201.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX and one Candidate ${cand_id}. No application exists yet."
            - "The id 00000000-0000-0000-0000-000000000000 belongs to no Candidate row."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /candidates"
              payload: {"email": "cand.a@example.com", "full_name": "Cand A"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { cand_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: {"candidate_id": "00000000-0000-0000-0000-000000000000", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${cand_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { err_shape: "$.data.error_id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${cand_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36, "attestation_signed": true}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { app_id: "$.data.id" }
          assert:
            - "trigger[0] responds 404 with ${err_both} == ERR_CANDIDATE_NOT_FOUND"
            - "${err_both} is not ERR_INVALID_REQUEST — priority 4 is checked before priority 7"
            - "trigger[1] responds 400 with ${err_shape} == ERR_INVALID_REQUEST, proving the missing attestation_signed is genuinely a violation"
            - "trigger[2] responds 201 with EligibilityApplication.${app_id}.status == SUBMITTED"
            - "GET /applications afterwards returns total_count == 1 — neither refused call wrote a row"
      - name: retake_wait_rejects_one_minute_early_and_admits_the_exact_forty_five_day_mark
        claim_type: temporal
        grounds:
          - validations[priority=32]
          - errors.ERR_RETAKE_WAIT_ACTIVE
          - calculations.attempt_number_assignment
          - entities.ExamRegistration.fields.session_ends_at
          - entities.CertificationProgram.fields.retake_wait_days
          - endpoints.POST_/exam-registrations
        distinguishing_aspect: |
          The retake wait is measured from the latest CONSUMED attempt's session_ends_at with a
          strict comparison, so 2026-09-24T03:59:00Z (one minute short of 45 days after the
          2026-08-10T04:00:00Z session end) is refused 409 ERR_RETAKE_WAIT_ACTIVE while
          2026-09-24T04:00:00Z is accepted and mints attempt_number 2. Measuring from the
          session START or using a non-strict comparison flips one of the two outcomes.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX with retake_wait_days 45 and max_attempts_per_cycle 3 (both defaults)."
            - "One APPROVED application ${app_id} whose candidate completed a first sitting: registration ${reg_id} has seat_status COMPLETED, score_status REPORTED and session_ends_at 2026-08-10T04:00:00Z, and the application reads attempts_consumed 1."
            - "eligibility_expires_on is 2027-08-01, comfortably in the future for both trigger calls."
