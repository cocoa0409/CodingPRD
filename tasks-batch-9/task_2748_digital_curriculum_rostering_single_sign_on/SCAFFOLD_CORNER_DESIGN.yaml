  # ===========================================================================
  # SECTION 7 — rbac  (§1.7, 5 roles, segregation_of_duties role model)
  # ===========================================================================
  - section: rbac
    instances:
      - name: identity_admin_cannot_perform_roster_operator_and_governance_exclusives
        claim_type: Exclusive operation denied to other roles
        grounds:
          - roles.IdentityAdmin.exclusive_operations
          - roles.RosterOperator.exclusive_operations
          - roles.DataGovernanceOfficer.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The identity administrator is powerful on the SSO axis and powerless on the roster axis: section creation (RosterOperator) and student withdrawal (DataGovernanceOfficer) are both ERR_ROLE_NOT_PERMITTED (403) for it, and the refusal is a role check, not a data problem — the same section payload succeeds for RosterOperator immediately afterwards."
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z; ACTIVE Northside building; ACTIVE Term Fall 2026; one ENROLLED student."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/schools"
              payload: { name: "Northside Elementary", sis_school_id: "SCH-NE", building_code: "NE", grade_band: "ELEMENTARY" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sch_ne_id: $.data.id }
            - call: "POST /rostering/terms"
              payload: { name: "Fall 2026", school_year: 2026, start_date: "2026-08-10", end_date: "2026-12-18", add_drop_cutoff_date: "2026-09-15", instructional_days: 85, archive_retention_days: 90 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { term_id: $.data.id }
            - call: "POST /rostering/terms/${term_id}/activate"
              payload: {}
              as: RosterOperator
              as_user_id: "ro-001"
            - call: "POST /rostering/students"
              payload: { school_id: "${sch_ne_id}", sis_student_id: "STU-2001", first_name: "Alex", last_name: "Nakamura", grade_level: 4, date_of_birth: "2016-05-04" }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-20T00:00:00Z" }
              as: RosterOperator
              as_user_id: "ro-001"
          trigger:
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3001", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["MON", "WED", "FRI"], max_seats: 5 }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /rostering/students/${s1_id}/withdraw"
              payload: { withdrawal_effective_date: "2026-08-20" }
              as: IdentityAdmin
              as_user_id: "ia-001"
              captures: { err2: "$.data.error_id" }
            - call: "POST /rostering/sections"
              payload: { school_id: "${sch_ne_id}", term_id: "${term_id}", sis_section_id: "SEC-3001", course_code: "MATH4", subject: "MATH", period_index: 3, meeting_days: ["MON", "WED", "FRI"], max_seats: 5 }
              as: RosterOperator
              as_user_id: "ro-001"
              captures: { sec1_id: $.data.id }
          assert:
            - "the IdentityAdmin section create returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED and creates nothing"
            - "the IdentityAdmin withdrawal returns HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED and Student ${s1_id}.enrollment_state stays ENROLLED"
            - "the byte-identical section payload from RosterOperator returns HTTP 201, proving the first refusal was purely the X-Role"
            - "GET /rostering/sections returns total_count 1"

