- section: errors
  instances:
  - name: request_with_an_unrecognised_role_header_is_unauthenticated
    claim_type: error_triggerable
    grounds:
    - "errors[ERR_UNAUTHENTICATED]"
    - "validations[priority=1]"
    - "endpoints[POST /idv/clients]"
    distinguishing_aspect: "The auth check at priority 1 covers an unknown role value, not just a missing header, so a syntactically valid client registration sent as SecurityAuditor returns 401 ERR_UNAUTHENTICATED\
      \ and not 403 ERR_ROLE_NOT_PERMITTED."
    test_recipe:
      setup:
      - "The clock is 2026-08-01T00:00:00Z and no Client exists."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /idv/clients
        payload: {name: Ghost Co, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 10, granted_review_credits: 1}
        as: SecurityAuditor
        as_user_id: ghost-1
        captures: *id001
      assert:
      - response status is 401 and $.data.error_id == ERR_UNAUTHENTICATED
      - "$.data.error_id != ERR_ROLE_NOT_PERMITTED"
      - GET /idv/clients?limit=50 as PlatformAdmin shows no client named Ghost Co
  - name: publish_with_an_unknown_policy_id_returns_not_found
    claim_type: error_triggerable
    grounds:
    - "errors[ERR_POLICY_NOT_FOUND]"
    - "validations[priority=5]"
    - "endpoints[POST /idv/verification-policies/{id}/publish]"
    distinguishing_aspect: "The path existence check at priority 5 runs before the concurrency check at priority 22, so an unknown policy id returns 404 even though the caller presents a perfectly current\
      \ expected_client_version."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
      - The client exists at version 2 after being switched LIVE and no policy carries the requested id.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
