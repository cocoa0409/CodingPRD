  # ==========================================================================
  # RULE 5 - priority_pair_validation_conflict
  # Two disjoint category pairs, each proved by a two-arm trigger: state vs
  # business_safety on submit, and business_referential vs business_fiscal on
  # plate ordering.
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_invalid_outranks_mandatory_element_failed_on_submit
        grounds:
          - validations[priority=24]
          - validations[priority=36]
          - validations[priority=37]
          - errors[ERR_VERSION_STATE_INVALID]
          - errors[ERR_MANDATORY_ELEMENT_FAILED]
          - state_machines.ArtworkVersion.REVISION_REQUESTED_to_REVISION_REQUESTED
          - state_machines.ArtworkVersion.REVISION_REQUESTED_to_DRAFT
        distinguishing_aspect: |
          The conflicting pair is category `state` (priority 24,
          ERR_VERSION_STATE_INVALID, 409) against category `business_safety` (priority
          36, ERR_MANDATORY_ELEMENT_FAILED, 422) on one endpoint: the same submit
          payload returns 409/ERR_VERSION_STATE_INVALID while the version is
          REVISION_REQUESTED and 422/ERR_MANDATORY_ELEMENT_FAILED once only the
          element failure remains, so the ordering is observable rather than inferred.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]) with all seven element codes required, so ERR_BRIEF_NOT_APPROVED (priority 35) is satisfied."
            - "ArtworkAsset (CARTON / COATED_PAPER / US, language_codes [en])."
            - "ArtworkVersion v1 was verified all-passing, submitted, and rejected at stage 1 by BrandReviewer, so it is REVISION_REQUESTED with revision_cycle_count 1 and route_count 1."
            - "v1 was then PATCHed (legal from REVISION_REQUESTED) so allergen_statement.allergen_emphasis == false, and re-verified in place: check_run_no 2 carries one FAIL row (ALLERGEN_STATEMENT, CRITICAL, 25.0) and compliance_score == 75.0, which is above COMPLIANCE_SCORE_FLOOR so priority 37 stays satisfied."
            - "v1 is therefore simultaneously in a state submit does not admit (priority 24) and carrying a FAIL element row (priority 36)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
