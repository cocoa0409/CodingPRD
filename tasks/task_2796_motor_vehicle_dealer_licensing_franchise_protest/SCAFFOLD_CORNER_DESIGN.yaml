          - state_machines.Salesperson.PENDING_to_LICENSED
        excluded_because:
          difficulty_instance: salesperson_license_decision_blocked_by_suspended_sponsor
          rationale: "That §1.8 cross_entity_state_dependency instance drives the sponsor into SUSPENDED, asserts the 422, and then shows the same request succeeding once waiver_granted is set."

  - section: endpoints
    instances:
      - name: consumer_complaint_create_read_and_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_dealer-board_consumer-complaints
          - endpoints.GET_dealer-board_consumer-complaints_id
          - endpoints.GET_dealer-board_consumer-complaints
        distinguishing_aspect: "The complaint create/read/list trio round-trips: the detail read returns the RECEIVED row with points_assessed 0 and every fiscal field null, and the list filtered by dealer_id + status=RECEIVED reports total_count 1 while a CLOSED_UNSUBSTANTIATED filter reports 0."
        test_recipe:
          setup:
            - "One dealer and one intook complaint; no investigation yet."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
