    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[composite-publish-stale-job]"]
        distinguishing_aspect: "Job.version starts at 1 and increments by 1 on every mutation (publish composite bumps it)."
        test_recipe:
          setup: ["Job exists, version=1"]
          setup_api_calls:
            - { call: "POST /orgs", payload: { name: "Acme", base_currency: "USD", market_as_of_date: "2026-08-01" }, as: VendorAdmin, captures: { org_id: $.data.id } }
