      - name: preemption_cascade_releases_the_hold_and_moves_stewardship_to_at_risk
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BuyUnit.SCHEDULED_to_PREEMPTED
          - state_machines.Buy.stewardship_status
          - endpoints[POST /upfront/buy-units/{buyUnitId}/settle-airing]
        excluded_because:
          difficulty_instance: preemption_reverses_inventory_hold_without_touching_committed_money
          rationale: |
            The three-link preemption cascade - inventory returned to the avail, the avail
            leaving EXHAUSTED, and stewardship_status moving to AT_RISK while committed money
            is left alone - is asserted end to end by that compensating_invariant instance,
            including the exact ledger figures. A separate corner instance would replay the
            same trigger with weaker assertions.

      - name: negotiation_counter_and_revise_cycle_up_to_the_round_cap
        claim_type: Valid Transition
        grounds:
          - state_machines.Negotiation.AGENCY_OFFER_to_SELLER_COUNTER
          - state_machines.Negotiation.SELLER_COUNTER_to_AGENCY_OFFER
          - errors.ERR_NEGOTIATION_ROUND_CAP_REACHED
        excluded_because:
          difficulty_instance: negotiation_cycles_five_times_then_hits_round_cap
          rationale: |
            The cyclic AGENCY_OFFER <-> SELLER_COUNTER pair and the round_number ceiling are
            walked exhaustively there, asserting the round counter, last_offer_actor and the
            terms on the table at every hop up to the sixth round and the cap rejection.
            Re-testing a single hop here would add no discriminating power.

  - section: calculations
    instances:
      - name: planned_projection_clamps_the_cpm_to_the_band_ceiling
        claim_type: Constants Applied
        grounds:
          - calculations.planned_delivery_projection
          - entities.ChannelAllocation.fields.effective_planned_cpm_cents
          - entities.ChannelAllocation.fields.planned_impressions
        distinguishing_aspect: |
          A 10000 cent planned CPM in the SCATTER market (1.35) at PRIME (1.20) has a raw
          adjusted CPM of 16200, but the band ceiling is min(CPM_ABS_CEIL_CENTS 12000,
          round_half_up(10000 * 2.50) = 25000) = 12000, so the stored effective CPM is
          exactly 12000 and planned_impressions is 833,333. An implementation that skips the
          absolute ceiling stores 16200 and reports 617,283 impressions.
        test_recipe:
          setup:
            - "one advertiser and one DRAFT campaign with a 10,000,000 cent budget and universe_thousands 120000"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /upfront/channel-allocations"
              payload: { campaign_id: "${c_id}", channel: "LINEAR_TV", allocation_pct: 100.00, planned_cpm_cents: 10000, planned_market: "SCATTER", primary_daypart: "PRIME" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { al_id: $.data.id }
          assert:
            - "the response status is 201"
            - "data.allocated_cents == 10000000"
            - "data.effective_planned_cpm_cents == 12000"
            - "data.planned_impressions == 833333"
            - "data.planned_grp == 0.69"
            - "data.planned_frequency == 0.01"
            - "Campaign.${c_id}.planned_impressions_total == 833333 and Campaign.${c_id}.planned_grp_total == 0.69"

      - name: planned_projection_lifts_the_cpm_to_the_absolute_floor
        claim_type: Constants Applied
        grounds:
          - calculations.planned_delivery_projection
          - entities.ChannelAllocation.fields.effective_planned_cpm_cents
          - entities.ChannelAllocation.fields.planned_grp
        distinguishing_aspect: |
          A 250 cent planned CPM at UPFRONT (1.00) and LATE (0.70) has a raw adjusted CPM of
          175, below CPM_ABS_FLOOR_CENTS 200, and the relative floor
          round_half_up(250 * 0.60) = 150 is the weaker of the two, so max() must pick 200 -
          not 175 and not 150 - giving exactly 50,000,000 planned impressions, 41.67 GRP and
          0.69 planned frequency.
        test_recipe:
          setup:
            - "one advertiser and one DRAFT campaign with a 10,000,000 cent budget, universe_thousands 120000 and reach_goal_pct 60.0"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
              as: AgencyPlanner
              as_user_id: "planner-01"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /upfront/channel-allocations"
