          - errors[ERR_ENCOUNTER_STATE_INVALID]
          - validations.priority_13
        distinguishing_aspect: "The document trigger is not idempotent: a second POST on the same encounter returns ERR_ENCOUNTER_STATE_INVALID (409) and does not double-count the lot, the plan or the billing units."
        test_recipe:
          setup:
