# =============================================================================
# Scaffold — Out-of-Market Game Package Distribution & Territory Blackout
# Task: task_3214_out_market_game_package_distribution_territory_blackout
#
# §1.0 Response Envelope + §1.1–§1.7 seed tables.
# Difficulty target: beyond-expert (highest supported treatment).
#   Primary archetype: access_control_matrix (territory entitlement gating)
#   Secondary archetype: temporal_windowing (weekly slate / blackout windows)
#   Layers: posture_driven_gating, derived_field_reconciliation,
#           scheduled_deferred_actions, optimistic_concurrency
# =============================================================================

scenario: |
  Out-of-Market Game Package Distribution & Territory Blackout (NFL Sunday Ticket): league rights grant to a distribution partner covering out-of-market games with exclusivity terms, subscriber territory determination from billing address and device location to enforce in-market blackouts, game availability computation each week as national broadcast selections remove games from the package, commercial establishment licensing with tiered pricing by venue occupancy and enforcement against residential accounts, in-season subscription proration and student pricing tiers, streaming rights integration with a platform's broader subscription and add-on structure, customer service handling of blackout complaints and refund policy, multiview and companion feature entitlements

domain_name: game-package-blackout
api_prefix: ""

# =============================================================================
# Complexity Profile (beyond-expert: 15 entities, 38 endpoints, 34 error codes,
# 11 calculations, 9 state machines — pushed to the top of the Expert band and
# beyond on structural coupling rather than raw count)
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: temporal_windowing
  complexity_layers:
    - posture_driven_gating          # Season.phase gates subscription purchase, refund, and venue enforcement ops
    - derived_field_reconciliation   # WeekSlate.finalized_game_ids / package_game_count recomputed on every selection move
    - scheduled_deferred_actions     # Offer.valid_from / valid_until, StudentVerification.valid_through, complaint 30-day window
    - optimistic_concurrency         # OCC on WeekSlate.version (selection moves), Subscription.version (plan changes), Season.version (phase advance)
    - cascading_side_effects         # selection move → slate finalize → availability recomputation → entitlement deltas
    - rate_threshold_triggers        # multiview concurrent-stream cap; venue occupancy tier boundaries
  entity_topology: hybrid
  state_machine_shape: cyclic        # WeekSlate PRELIMINARY→FINALIZED→PRELIMINARY correction loop; parallel dims on Subscription
  relationship_patterns:
    - one_to_many
    - many_to_many                   # WeekSlate ↔ Game via national selections; Subscription ↔ GameEntitlement
    - cross_aggregate                # GameEntitlement crosses WeekSlate + Subscription aggregates
  role_model: peer_roles             # PlatformAdmin / LeagueOps / Subscriber / VenueManager / SupportAgent / ComplianceAuditor
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: RightsGrant
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (no type prefix); identity only" }
      - { name: distributor_name, type: string, source: input, description: "Distribution partner legal name" }
      - { name: scope, type: enum, source: input, description: "OUT_OF_MARKET only in v1; constraints: OUT_OF_MARKET", constraints: "enum: OUT_OF_MARKET" }
      - { name: exclusivity, type: enum, source: input, description: "Exclusivity term of the league grant; constraints: EXCLUSIVE | NON_EXCLUSIVE", constraints: "enum: EXCLUSIVE | NON_EXCLUSIVE" }
      - { name: effective_from, type: datetime, source: input, description: "Grant effective start (ISO 8601 UTC)" }
      - { name: effective_until, type: datetime, source: input, description: "Grant effective end (ISO 8601 UTC); must be strictly after effective_from" }
      - { name: max_commercial_occupancy_cap, type: integer, source: input, description: "Absolute ceiling on certifiable venue occupancy under this grant; > 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle; constraints: ACTIVE | EXPIRED | TERMINATED", constraints: "enum: ACTIVE | EXPIRED | TERMINATED" }

  - name: Season
    parent: RightsGrant
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: rights_grant_id, type: string, source: system, description: "FK -> RightsGrant.id; parent grant" }
      - { name: label, type: string, source: input, description: "e.g. '2026-Regular'; unique within the parent grant" }
      - { name: regular_season_weeks, type: integer, source: input, description: "Number of weekly slates in the season; >= 1 and <= 22" }
      - { name: season_start_date, type: datetime, source: input, description: "First day of Week 1 (ISO 8601 UTC date at 00:00:00Z)" }
      - { name: season_end_date, type: datetime, source: input, description: "Last day of final week; must be after season_start_date" }
      - { name: phase, type: enum, source: system, description: "Derived season posture gating purchasability and refunds; constraints: PRE_SALE | REGULAR | POST", constraints: "enum: PRE_SALE | REGULAR | POST" }
      - { name: grace_days, type: integer, source: input, description: "Complaint/refund eligibility window in days after purchase; >= 0, <= 30; default 7", default: 7 }
      - { name: student_discount_pct, type: integer, source: input, description: "Whole percent 0-90 applied to student-tier base price; default 50", default: 50 }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: code, type: string, source: input, description: "Market code, e.g. NYC, DAL; unique across all markets (case-sensitive)" }
      - { name: name, type: string, source: input, description: "Human-readable market name" }
      - { name: zip_prefixes, type: array, source: input, description: "Array of 3-digit ZIP prefix strings; non-empty; prefixes must not overlap with any other Market" }
      - { name: home_team_codes, type: array, source: input, description: "Array of team codes whose games are in-market for this market; may be empty" }

  - name: Game
    parent: Season
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; owning season" }
      - { name: week_index, type: integer, source: input, description: "1-based week index; >= 1 and <= season.regular_season_weeks" }
      - { name: away_team_code, type: string, source: input, description: "Away team code; must differ from home_team_code" }
      - { name: home_team_code, type: string, source: input, description: "Home team code; must differ from away_team_code" }
      - { name: kickoff_at, type: datetime, source: input, description: "Kickoff instant; must fall inside the owning week's window per week_window" }
      - { name: home_market_code, type: string, source: input, description: "Market code in which this game is in-market (the home team's market); must reference an existing Market.code" }

  - name: WeekSlate
    parent: Season
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; owning season" }
      - { name: week_index, type: integer, source: input, description: "1-based week index; unique within season; >= 1 and <= season.regular_season_weeks" }
      - { name: slate_status, type: enum, source: system, description: "Availability computation posture; constraints: PRELIMINARY | FINALIZED | LOCKED", constraints: "enum: PRELIMINARY | FINALIZED | LOCKED" }
      - { name: national_game_ids, type: array, source: computed, description: "Ordered list of Game ids currently carried as national selections for this week; maintained by move/add/remove actions" }
      - { name: finalized_game_ids, type: array, source: computed, description: "Snapshot of package-eligible game ids computed at FINALIZED; empty while PRELIMINARY; frozen at LOCKED" }
      - { name: package_game_count, type: integer, source: computed, description: "Count of games in the package for this week = total week games minus national selections; recomputed on every mutation" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp of last PRELIMINARY→FINALIZED transition; null until first finalize" }

  - name: Offer
    parent: Season
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: season_id, type: string, source: system, description: "FK -> Season.id; season this offer sells access to" }
      - { name: plan_tier, type: enum, source: input, description: "Retail plan tier; constraints: BASE | PREMIUM | STUDENT", constraints: "enum: BASE | PREMIUM | STUDENT" }
      - { name: base_price_cents, type: integer, source: input, description: "Full-season list price before proration/discount; > 0" }
      - { name: includes_multiview, type: boolean, source: input, description: "Whether the tier carries the multiview feature entitlement" }
      - { name: includes_companion, type: boolean, source: input, description: "Whether the tier carries the companion-feature entitlement" }
      - { name: valid_from, type: datetime, source: input, description: "Offer purchasable at or after this instant" }
      - { name: valid_until, type: datetime, source: input, description: "Offer purchasable strictly before this instant; must be after valid_from" }
      - { name: status, type: enum, source: system, description: "constraints: ACTIVE | WITHDRAWN", constraints: "enum: ACTIVE | WITHDRAWN" }

  - name: Account
    parent: null
    common_fields: true
