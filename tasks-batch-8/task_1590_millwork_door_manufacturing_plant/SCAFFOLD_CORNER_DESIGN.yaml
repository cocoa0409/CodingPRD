            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "X1", width_in: 48, height_in: 96, leaf_count: 30, fire_rating: "MIN_90", required_on_site_date: "2026-12-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
          trigger:
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          assert:
            - "Order.${ord_id}.merchandise_total_cents == 2585620"
            - "Order.${ord_id}.freight_fee_cents == 77569"
            - "Order.${ord_id}.contract_price_cents == 2663189"
      - name: realized_fill_null_until_departed
        claim_type: computed_fields
        grounds: ["entities.DeliveryTrip.fields.realized_fill_pct", "calculations.trip_fill_efficiency"]
        distinguishing_aspect: "realized_fill_pct is null while the trip is PLANNED and is only computed at DEPARTED; projected_fill_pct is populated (0.0 for an empty trip)."
        test_recipe:
          setup: ["Project exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CT-4" }, as: PlantManager, captures: { proj_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-N", truck_capacity_leaves: 8, departure_date: "2026-10-02", site_arrival_date: "2026-10-03" }, as: PlantManager, captures: { realized: $.data.realized_fill_pct, projected: $.data.projected_fill_pct, committed: $.data.leaves_committed } }
          assert:
            - "captured ${realized} == null"
            - "captured ${projected} == 0.0 and captured ${committed} == 0"
