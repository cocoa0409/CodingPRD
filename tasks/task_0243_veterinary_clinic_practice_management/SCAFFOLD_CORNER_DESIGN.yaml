              captures: { pat: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { patient_id: "${pat}", scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T10:00:00Z", visit_reason: "Lab" }
              as: Receptionist
              captures: { appt: $.data.id }
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "check-in" }
              as: Receptionist
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "begin-exam" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders"
              payload: { appointment_id: "${appt}", order_type: "CYTOLOGY", fee_cents: 7000 }
              as: Veterinarian
              captures: { lo: $.data.id }
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "collect" }
              as: Veterinarian
            - call: "POST /clinic/lab-orders/${lo}/transition"
              payload: { action: "result", result_text: "ok" }
              as: Veterinarian
            - call: "POST /clinic/appointments/${appt}/transition"
              payload: { action: "complete" }
              as: Veterinarian
            - call: "GET /clinic/households/${hh}"
              payload: {}
              as: PracticeManager
              captures: { hh_vn: $.data.version }
          trigger:
            - call: "POST /clinic/invoices"
              payload: { household_id: "${hh}", appointment_id: "${appt}", expected_household_version: "${hh_vn}" }
              as: PracticeManager
              captures: { inv: $.data.id }
          assert:
            - "Invoice.${inv}.actual_total_cents == 7000"
            - "Household.${hh}.lifetime_invoiced_cents == 7000"

