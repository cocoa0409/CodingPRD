          - roles.RetailerManager.exclusive_operations
          - roles.DispatchAdmin.exclusive_operations
          - roles.CustomerSupport.exclusive_operations
        distinguishing_aspect: "One end-to-end chain exercises at least one exclusive write per role - DispatchAdmin's POST /retailers, /shoppers, /batches, /batches/{id}/orders and /batches/{id}/dispatch, RetailerManager's POST /catalog-items, CustomerSupport's POST /customers, Customer's POST /orders and /orders/{id}/submit, Shopper's POST /batches/{id}/claim - and every one of them is accepted."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T08:00:00Z; each call below is issued by exactly the role that owns it in §1.7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
          trigger:
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
