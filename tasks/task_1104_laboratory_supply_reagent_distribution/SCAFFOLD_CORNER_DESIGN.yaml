# =============================================================================
# §1.9 Scaffold Corner Design — coverage index of every testable claim in
# §1.1–§1.7 not already carried by §1.8. Clock default: 2026-05-01T00:00:00Z.
# The consistency_model section is omitted deliberately: with
# consistency_model == immediate, every instance's captures already assert
# same-response visibility.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: warehouse_created_with_operational_defaults
        claim_type: defaults
        grounds: [entities.Warehouse.fields.status]
        distinguishing_aspect: "A created warehouse starts OPERATIONAL with version 1 and server-minted bare-UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { st: "$.data.status", v: "$.data.version" } }
          assert:
            - "captured st == OPERATIONAL and captured v == 1"
            - "response id is a bare UUID with no type prefix"

      - name: lot_receipt_computes_sequence_expiry_and_occupancy
        claim_type: computed_fields
        grounds: [calculations.lot_sequence_assignment, calculations.expiry_date_derivation, calculations.zone_occupancy, entities.ReagentLot.fields.expiry_date]
        distinguishing_aspect: "Receipt computes lot_sequence_number 1, expiry_date 2026-05-31 (2026-04-01 + 60 days), quantity_on_hand == quantity_received, and bumps zone occupied_units to 20."
        test_recipe:
          setup: ["warehouse and REFRIGERATED_2_8 zone (capacity 100) exist; product shelf_life_days 60"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { seq: "$.data.lot_sequence_number", exp: "$.data.expiry_date", qoh: "$.data.quantity_on_hand", st: "$.data.status" } }
            - { call: "GET /lab/storage-zones/${zone_id}", payload: {}, as: OpsAdmin, captures: { occ: "$.data.occupied_units" } }
          assert:
            - "captured seq == 1 and captured exp == \"2026-05-31\" and captured qoh == 20 and captured st == AVAILABLE"
            - "captured occ == 20 (zone occupancy reflects the receipt in the same logical read)"

      - name: lot_receipt_with_unknown_product_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.ReagentLot.fields.product_id, "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced product id that does not exist yields 404 ERR_PRODUCT_NOT_FOUND before any zone logic runs."
        test_recipe:
          setup: ["warehouse and zone exist"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 100 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots", payload: { product_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 5, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_PRODUCT_NOT_FOUND and HTTP status == 404"

      - name: product_create_rejects_invalid_hazard_enum
        claim_type: type_constraints
        grounds: [entities.Product.fields.hazard_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "hazard_class RADIOACTIVE is outside the declared enum and is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lab/products", payload: { sku: "BAD-1", name: "Bad", storage_requirement: "AMBIENT", hazard_class: "RADIOACTIVE", max_qty_per_shipment: 10, unit_price_cents: 100, requires_cold_chain: false, shelf_life_days: 30 }, as: CatalogManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: order_create_with_system_version_field_rejected
        claim_type: system_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Supplying the system-managed version field in a create body is an unknown-field violation -> 400 ERR_INVALID_REQUEST; the server never accepts client-minted versions."
        test_recipe:
          setup: ["warehouse and customer exist"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "STANDARD", requested_ship_date: "2026-05-10", lines: [], version: 99 }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_REQUEST and HTTP status == 400"

      - name: consumption_record_has_no_version_or_updated_at
        claim_type: immutability
        grounds: [entities.ConsumptionRecord]
        distinguishing_aspect: "ConsumptionRecord declares common_fields: false — its read exposes id and created_at but neither version nor updated_at."
        test_recipe:
          setup: ["warehouse, product, customer, and an ACTIVE agreement (ceiling 100, initial_stocked 100, price 500)"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/consignment-agreements", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", ceiling_quantity: 100, reorder_point: 0, contract_unit_price_cents: 500, replenishment_warehouse_id: "${wh_id}", initial_stocked_quantity: 100, effective_from: "2026-05-01", effective_until: "2027-05-01" }, as: AccountManager, captures: { agr_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/consignment-agreements/${agr_id}/consumption", payload: { quantity: 3 }, as: AccountManager, captures: { rec_id: "$.data.id" } }
          assert:
            - "GET /lab/consumption-records/${rec_id} response data contains keys id and created_at and contains neither version nor updated_at"

      - name: customer_create_applies_documented_defaults
        claim_type: defaults
        grounds: [entities.CustomerAccount.fields.hazmat_endorsement, entities.CustomerAccount.fields.outstanding_balance_cents]
        distinguishing_aspect: "Omitting optionals yields hazmat_endorsement NONE, volume_discount_pct 0, cold_chain_certified false, outstanding_balance_cents 0, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lab/customers", payload: { name: "Lab Plain", credit_limit_cents: 500000 }, as: AccountManager, captures: { endo: "$.data.hazmat_endorsement", disc: "$.data.volume_discount_pct", cc: "$.data.cold_chain_certified", bal: "$.data.outstanding_balance_cents", st: "$.data.status" } }
          assert:
            - "captured endo == NONE, disc == 0, cc == false, bal == 0, st == ACTIVE"

  - section: state_machines
    instances:
      - name: shipment_deliver_from_created_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Shipment.transitions, "errors[ERR_SHIPMENT_NOT_IN_TRANSIT]"]
        distinguishing_aspect: "deliver is only legal from IN_TRANSIT; a CREATED shipment rejects with ERR_SHIPMENT_NOT_IN_TRANSIT and stays CREATED."
        test_recipe:
          setup:
            - "cold-chain order ALLOCATED; shipment created (CREATED)"
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/shipments/${ship_id}/deliver", payload: {}, as: InventoryClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_SHIPMENT_NOT_IN_TRANSIT and Shipment.${ship_id}.status remains CREATED"
            - "Order.${order_id}.status remains ALLOCATED (no bubble-up fired)"

      - name: lot_release_quarantine_from_available_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReagentLot.QUARANTINED_to_AVAILABLE, "errors[ERR_LOT_NOT_QUARANTINED]"]
        distinguishing_aspect: "release-quarantine from AVAILABLE is rejected ERR_LOT_NOT_QUARANTINED; the lot's quantities are untouched."
        test_recipe:
          setup: ["warehouse, zone, product, AVAILABLE lot of 20"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 20, manufacture_date: "2026-01-15" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/lots/${lot_id}/release-quarantine", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_LOT_NOT_QUARANTINED"
            - "ReagentLot.${lot_id}.status == AVAILABLE and quantity_on_hand == 20"

      - name: excursion_second_disposition_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TemperatureExcursion.OPEN_to_DESTROYED, "errors[ERR_EXCURSION_NOT_OPEN]"]
        distinguishing_aspect: "After DESTROYED the excursion is terminal: a second disposition returns ERR_EXCURSION_NOT_OPEN and neither the shipment (RETURNED) nor the order (REFUNDED) changes again."
        test_recipe:
          setup: ["cold-chain chain to IN_TRANSIT with an OPEN excursion already dispositioned DESTROYED"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/dispatch", payload: { actual_weight_grams: 3000 }, as: InventoryClerk }
            - { call: "POST /lab/shipments/${ship_id}/record-temperature", payload: { temp_celsius: 12.5, duration_minutes: 90 }, as: InventoryClerk, captures: { exc_id: "$.data.excursion_id" } }
            - { call: "POST /lab/excursions/${exc_id}/disposition", payload: { decision: "DESTROYED" }, as: QualityManager }
          trigger:
            - { call: "POST /lab/excursions/${exc_id}/disposition", payload: { decision: "ACCEPTED" }, as: QualityManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_EXCURSION_NOT_OPEN"
            - "TemperatureExcursion.${exc_id}.status remains DESTROYED with final_credit_cents == 40000"
            - "Shipment.${ship_id}.status remains RETURNED; Order.${order_id}.status remains REFUNDED"

      - name: order_cancel_after_packed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Order.ALLOCATED_to_CANCELLED, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "PACKED is outside the cancellable set {DRAFT, BACKORDERED, ALLOCATED}: cancel returns ERR_ORDER_NOT_CANCELLABLE and reservations stay COMMITTED."
        test_recipe:
          setup: ["cold-chain chain to PACKED shipment"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "RG-100", name: "Enzyme Mix", storage_requirement: "REFRIGERATED_2_8", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 20000, requires_cold_chain: true, shelf_life_days: 60, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Alpha", credit_limit_cents: 10000000, hazmat_endorsement: "FULL", cold_chain_certified: true }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/lots", payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", storage_zone_id: "${zone_id}", quantity_received: 100, manufacture_date: "2026-04-01" }, as: InventoryClerk, captures: { lot_id: "$.data.id" } }
            - { call: "POST /lab/orders", payload: { customer_id: "${cust_id}", warehouse_id: "${wh_id}", shipping_service: "EXPRESS", requested_ship_date: "2026-05-10", lines: [ { product_id: "${prod_id}", quantity: 2, fulfillment_mode: "ANY" } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: "$.data.id" } }
            - { call: "POST /lab/orders/${order_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lab/shipments", payload: { order_id: "${order_id}", coolant_type: "DRY_ICE", coolant_units: 2, declared_weight_grams: 3000 }, as: InventoryClerk, captures: { ship_id: "$.data.id" } }
            - { call: "POST /lab/shipments/${ship_id}/pack", payload: {}, as: InventoryClerk }
          trigger:
            - { call: "POST /lab/orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_ORDER_NOT_CANCELLABLE"
            - "Order.${order_id}.status remains PACKED and ReagentLot.${lot_id}.quantity_reserved remains 2"

      - name: standing_order_resume_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.StandingOrder.PAUSED_to_ACTIVE, "errors[ERR_STANDING_ORDER_NOT_PAUSED]"]
        distinguishing_aspect: "resume requires PAUSED; on an ACTIVE standing order it fails ERR_STANDING_ORDER_NOT_PAUSED."
        test_recipe:
          setup: ["warehouse, product, customer; standing order ACTIVE"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CS-500", name: "Consigned Stain", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 500, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Kappa", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /lab/standing-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", quantity_per_run: 2, interval_days: 7, effective_from: "2026-05-01", effective_until: "2026-06-01" }, as: Customer, as_user_id: "${cust_id}", captures: { so_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/standing-orders/${so_id}/resume", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_STANDING_ORDER_NOT_PAUSED and StandingOrder.${so_id}.status remains ACTIVE"

      - name: recall_close_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RecallNotice.ISSUED_to_CLOSED, "errors[ERR_RECALL_NOT_CLOSABLE]"]
        distinguishing_aspect: "close requires ISSUED; a DRAFT recall fails ERR_RECALL_NOT_CLOSABLE and no lot pull occurs."
        test_recipe:
          setup: ["product and a DRAFT recall exist"]
          setup_api_calls:
            - { call: "POST /lab/products", payload: { sku: "CH-105", name: "Buffer Salt", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 105, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/recalls", payload: { product_id: "${prod_id}", scope_type: "PRODUCT_ALL", severity_class: "CLASS_III", reason: "Label defect" }, as: QualityManager, captures: { recall_id: "$.data.id" } }
          trigger:
            - { call: "POST /lab/recalls/${recall_id}/close", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_RECALL_NOT_CLOSABLE and RecallNotice.${recall_id}.status remains DRAFT"

      - name: discontinued_product_blocked_at_submit
        claim_type: precondition_enforcement
        grounds: ["validations[priority=21]", "errors[ERR_PRODUCT_NOT_LISTED]", state_machines.Product.LISTED_to_DISCONTINUED]
        distinguishing_aspect: "A DISCONTINUED product referenced by an order line fails submit with ERR_PRODUCT_NOT_LISTED even though the order is DRAFT and the customer is fine."
        test_recipe:
          setup: ["warehouse, zone, lot of 10, customer; product discontinued after order creation"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "AMBIENT", capacity_units: 500 }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /lab/products", payload: { sku: "CH-1000", name: "Assay Vial", storage_requirement: "AMBIENT", hazard_class: "NON_HAZARDOUS", max_qty_per_shipment: 500, unit_price_cents: 1000, requires_cold_chain: false, shelf_life_days: 365, min_remaining_shelf_life_days: 7 }, as: CatalogManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /lab/customers", payload: { name: "Lab Mu", credit_limit_cents: 10000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
