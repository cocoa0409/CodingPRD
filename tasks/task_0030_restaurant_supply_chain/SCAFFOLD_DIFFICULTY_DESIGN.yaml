# =============================================================================
# Restaurant Chain Supply Chain — Difficulty Design (Test Targeting Index)
#
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# defined in the scaffold-generator skill (§0.5). Every instance grounds in
# declared scaffold elements and is reachable by tests using only declared
# endpoints from an empty database.
#
# All numeric assertion literals were computed by executing the relevant
# §1.3 calculation formula against the pinned setup inputs.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: ingredient_demand_planned_vs_forecast
        grounds:
          - calculations.ingredient_explosion_planned
          - calculations.ingredient_explosion_forecast
          - entities.ProductionBatch.fields.planned_units
          - entities.ProductionBatch.fields.forecast_units
          - endpoints["POST /supply-chain/production-batches/consolidate"]
          - endpoints["GET /supply-chain/production-batches/{id}/forecast"]
        distinguishing_aspect: |
          Operates on the ProductionBatch entity domain (production planning).
          Same SUBMITTED orders + same target date — planned aggregates real
          OrderLine units; forecast projects from sales velocity. The two
          algorithms produce different numeric demand totals on the same row.
        test_recipe:
          setup:
            - "Create Recipe R (recipe_code=R-001, unit_price_cents=500, shelf_life_hours=72, production_minutes_per_unit=1, equipment_class=OVEN)."
            - "Create Ingredient I1 (sku=I-001, unit_cost_cents=10)."
            - "Attach RecipeIngredient(R, I1, quantity_per_unit=2)."
            - "Create Store S1 (catalog_permission=[R.id], avg_daily_sales_cents=10000)."
            - "Create ReplenishmentRule(store=S1, recipe=R, status=ACTIVE, velocity_multiplier=1.0)."
            - "Create StoreOrder for S1, target_delivery_date=2026-05-12, append OrderLine(R, quantity=15), submit."
          trigger:
            - "POST /supply-chain/production-batches/consolidate {target_delivery_date: '2026-05-12'}"
            - "GET /supply-chain/production-batches/{id}/forecast"
          assert:
            - "ProductionBatch.planned_units == 15"
            - "ProductionBatchForecast.forecast_units == 20   # round_half_up(10000/500 × 1 × 1.0)"
            - "ProductionBatch.planned_units != ProductionBatchForecast.forecast_units"
            - "Ingredient demand: planned=30, forecast=40 for I1 (different)"

      - name: cost_allocation_indirect_basis_sales_vs_volume
        grounds:
          - calculations.final_cost_allocation
          - calculations.final_cost_allocation.variants[0]
          - entities.StoreOrder.fields.total_value_cents
          - entities.StoreOrder.fields.total_units
          - endpoints["POST /supply-chain/cost-allocations/run"]
        distinguishing_aspect: |
          Operates on the Store / CostAllocation entity domain (cost accounting),
          structurally different from the production-planning domain of the
          first instance. Same period, same stores, same direct cost pool —
          INDIRECT_BASIS=SALES_VALUE versus ORDER_VOLUME yield divergent
          per-store final allocation cents.
        test_recipe:
          setup:
            - "Create Stores S1 (store_code=S-001) and S2 (S-002)."
            - "Drive completed orders such that within [period_start, period_end): S1.delivered_total_value_cents=10000, S1.delivered_total_units=10; S2.delivered_total_value_cents=5000, S2.delivered_total_units=20."
            - "Drive direct production cost in the period to 20000 cents → indirect pool = 0.15 × 20000 = 3000 cents."
          trigger:
            - "POST /supply-chain/cost-allocations/run {period_start, period_end, indirect_basis: 'SALES_VALUE'}  → record allocation_sales"
            - "POST /supply-chain/cost-allocations/run {period_start, period_end, indirect_basis: 'ORDER_VOLUME'} → record allocation_volume"
          assert:
            - "allocation_sales.indirect_cents[S1] == 2000   # 3000 × 10000/15000"
            - "allocation_sales.indirect_cents[S2] == 1000   # 3000 × 5000/15000"
            - "allocation_volume.indirect_cents[S1] == 1000  # 3000 × 10/30"
            - "allocation_volume.indirect_cents[S2] == 2000  # 3000 × 20/30"
            - "allocation_sales.indirect_cents[S1] != allocation_volume.indirect_cents[S1]"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: shelf_life_sequencing_topological_with_three_inputs
        grounds:
          - calculations.shelf_life_sequencing
          - state_machines.ProductionBatch.PLANNED_to_SCHEDULED
          - validations[priority=17]                  # ERR_SHELF_LIFE_INSUFFICIENT
          - validations[priority=18]                  # ERR_EQUIPMENT_CAPACITY_EXCEEDED
          - endpoints["POST /supply-chain/production-batches/{id}/schedule"]
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (Recipe.shelf_life_hours,
          equipment_minutes, target_delivery_date 23:59 UTC, equipment-class
          remaining capacity) interacting non-linearly. Sort key flips to a
          conditional branch on equipment_class, and tie-break is on
          recipe_code ascending. Not a tiered-rate formula.
        test_recipe:
          setup:
            - "now() = 2026-05-11T00:00:00Z (use POST /_clock/advance)."
            - "Create Recipe R_short (recipe_code=R-002, shelf_life_hours=12, production_minutes_per_unit=60, equipment_class=OVEN)."
            - "Create Recipe R_long (recipe_code=R-003, shelf_life_hours=48, production_minutes_per_unit=60, equipment_class=OVEN)."
            - "Create Store, catalog_permission=[R_short.id, R_long.id]; submit one OrderLine per recipe with quantity=1, target_delivery_date=2026-05-12."
            - "Consolidate → two ProductionBatches PLANNED."
          trigger:
            - "POST /supply-chain/production-batches/{R_short_batch}/schedule"
            - "POST /supply-chain/production-batches/{R_long_batch}/schedule"
          assert:
            - "Both batches transition to SCHEDULED."
            - "R_short_batch.scheduled_start_at > R_long_batch.scheduled_start_at  # shorter shelf_life produced LATER"
            - "R_short_batch.scheduled_end_at + R_short.shelf_life_hours hours >= 2026-05-12T23:59:59Z  # shelf-life sufficiency"
            - "Sum of equipment_minutes on OVEN line for 2026-05-12 == 120 (≤ 480 capacity)"

      - name: provisional_cost_allocation_pinned_rounding_order
        grounds:
          - calculations.provisional_cost_allocation
          - state_machines.ProductionBatch.IN_PRODUCTION_to_COMPLETED
          - entities.ProductionBatch.fields.planned_units
          - entities.Store.fields.store_code
          - endpoints["POST /supply-chain/production-batches/{id}/complete"]
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Total_cost (130 cents)
          is split three ways with equal shares (1/3); rounding per-store FIRST
          gives 43-43-43 = 129 with 1-cent remainder, then rule says assign
          remainder to lowest store_code (S-001). Reversing the order
          ('round at the end') would give a different distribution. Not a
          shelf-life sequencing formula.
        test_recipe:
          setup:
            - "Create Stores S1 (store_code=S-001), S2 (S-002), S3 (S-003)."
            - "Create Recipe R (unit_price_cents=200), Ingredient I1 (unit_cost_cents=10), RecipeIngredient(R, I1, quantity_per_unit=1)."
            - "Each store submits a StoreOrder with one OrderLine(R, quantity=1) for the same target_delivery_date."
            - "Consolidate → ProductionBatch.planned_units = 3, ingredient_cost = 1×10×3 = 30 cents."
            - "Schedule, start, then complete the batch."
          trigger:
            - "POST /supply-chain/production-batches/{batch}/complete"
          assert:
            - "Provisional allocation per BATCH_SETUP_FEE_CENTS=100 + ingredient_cost=30 → total=130."
            - "S1.provisional_allocated_cost_cents == 44   # 43 rounded + 1 remainder (lowest store_code)"
            - "S2.provisional_allocated_cost_cents == 43"
            - "S3.provisional_allocated_cost_cents == 43"
            - "Sum (44 + 43 + 43) == 130 (matches total_cost_cents)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: delivery_route_exception_reroute_cycle
        grounds:
          - state_machines.DeliveryRoute
          - state_machines.DeliveryRoute.IN_TRANSIT_to_EXCEPTION
          - state_machines.DeliveryRoute.EXCEPTION_to_REROUTED
          - state_machines.DeliveryRoute.REROUTED_to_IN_TRANSIT
          - endpoints["POST /supply-chain/delivery-routes/{id}/raise-exception"]
          - endpoints["POST /supply-chain/delivery-routes/{id}/reroute"]
          - endpoints["POST /supply-chain/delivery-routes/{id}/depart"]
        distinguishing_aspect: |
          DeliveryRoute exhibits a cycle IN_TRANSIT → EXCEPTION → REROUTED →
          IN_TRANSIT — the same logical state is re-entered after exception
          handling. Belongs to the DeliveryRoute entity. Not a linear pipeline.
        test_recipe:
          setup:
            - "Create two AVAILABLE Vehicles V1, V2 with same capacity_units and temperature_zones."
            - "Plan and dispatch a route on V1; driver departs (state=IN_TRANSIT)."
          trigger:
            - "POST /supply-chain/delivery-routes/{id}/raise-exception {exception_reason: 'flat tire'}"
            - "POST /supply-chain/delivery-routes/{id}/reroute {replacement_vehicle_id: V2.id}"
            - "POST /supply-chain/delivery-routes/{id}/depart"
          assert:
            - "After raise-exception: status == EXCEPTION"
            - "After reroute: status == REROUTED, vehicle_id == V2.id, V1.status == AVAILABLE, V2.status == ASSIGNED"
            - "After depart: status == IN_TRANSIT (cycle returned)"

      - name: replenishment_rule_active_suspended_cycle
        grounds:
          - state_machines.ReplenishmentRule
          - state_machines.ReplenishmentRule.ACTIVE_to_SUSPENDED
          - state_machines.ReplenishmentRule.SUSPENDED_to_ACTIVE
          - endpoints["POST /supply-chain/replenishment-rules/{id}/suspend"]
          - endpoints["POST /supply-chain/replenishment-rules/{id}/activate"]
        distinguishing_aspect: |
          ReplenishmentRule has a two-state cycle ACTIVE↔SUSPENDED. Different
          entity from the DeliveryRoute cycle and a different cycle topology
          (binary toggle vs three-state cycle).
        test_recipe:
          setup:
            - "Create Store S1 with one ReplenishmentRule status=ACTIVE."
          trigger:
            - "POST /supply-chain/replenishment-rules/{id}/suspend"
            - "POST /supply-chain/replenishment-rules/{id}/activate"
            - "POST /supply-chain/replenishment-rules/{id}/suspend"
          assert:
            - "Sequence yields ACTIVE → SUSPENDED → ACTIVE → SUSPENDED."
            - "Each transition appends an AuditLogEntry."

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: route_complete_creates_inventory_then_advances_orders_then_replenishment_eligibility
        grounds:
          - state_machines.DeliveryRoute.IN_TRANSIT_to_COMPLETED
          - state_machines.StoreOrder.CONSOLIDATED_to_DELIVERED
          - state_machines.InventoryBatch
          - calculations.replenishment_signal
          - endpoints["POST /supply-chain/delivery-routes/{id}/complete"]
          - endpoints["POST /supply-chain/_sweep/replenish"]
        distinguishing_aspect: |
          Depth-3+ cascade originating from DeliveryRoute.complete:
          (1) Route.IN_TRANSIT→COMPLETED triggers InventoryBatch creation;
          (2) the InventoryBatch creation itself causes linked StoreOrders
              to advance CONSOLIDATED→DELIVERED;
          (3) the resulting on_hand stock is what the next /_sweep/replenish
              evaluates against safety_stock_units to suppress a duplicate
              replenishment that would have fired had stock not arrived.
          Each link is caused by the previous link, not the original action.
        test_recipe:
          setup:
            - "Create Store S1 with a ReplenishmentRule(recipe=R, safety_stock=10, replenish_to=20, cycle_hours=1, status=ACTIVE)."
            - "Drive a CONSOLIDATED StoreOrder for 15 units of R via the production pipeline up to a DISPATCHED route in IN_TRANSIT state."
            - "Set rule.last_evaluated_at = now() - 2 hours (sweep cycle elapsed)."
          trigger:
            - "POST /supply-chain/delivery-routes/{id}/complete"
            - "POST /supply-chain/_sweep/replenish"
          assert:
            - "InventoryBatch was created at S1 with quantity_on_hand == 15."
            - "StoreOrder.status == DELIVERED."
            - "Sweep produced no new replenishment StoreOrder for (S1, R) because on_hand=15 > safety_stock=10."

      - name: production_fail_reverts_consolidated_orders_then_clears_batch_link
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_FAILED
          - state_machines.StoreOrder.CONSOLIDATED_to_SUBMITTED
          - entities.StoreOrder.fields.consolidation_batch_id
          - endpoints["POST /supply-chain/production-batches/{id}/fail"]
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (ProductionBatch.fail):
          (1) Batch.IN_PRODUCTION→FAILED causes linked StoreOrders to
              flip CONSOLIDATED→SUBMITTED;
          (2) that StoreOrder transition itself clears
              consolidation_batch_id and updates StoreOrder.updated_at.
          Different originating trigger from the route-complete cascade above.
        test_recipe:
          setup:
            - "Drive two SUBMITTED StoreOrders into CONSOLIDATED via /production-batches/consolidate, then schedule and start the batch (state=IN_PRODUCTION)."
          trigger:
            - "POST /supply-chain/production-batches/{batch_id}/fail"
          assert:
            - "ProductionBatch.status == FAILED."
            - "Both StoreOrders.status == SUBMITTED (compensated)."
            - "Both StoreOrders.consolidation_batch_id is null (link cleared by the SECOND hop, not the first)."

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: order_window_temporal_beats_catalog_referential
        grounds:
          - validations[priority=11]   # ERR_CATALOG_PERMISSION_DENIED (business_referential)
          - validations[priority=14]   # ERR_ORDER_WINDOW_CLOSED (business_temporal)
          - state_machines.StoreOrder.DRAFT_to_SUBMITTED
          - endpoints["POST /supply-chain/store-orders/{id}/submit"]
        distinguishing_aspect: |
          Pair = (business_temporal, business_referential). When BOTH fail
          on submit (now outside window AND a line's recipe is not in
          catalog_permission), the temporal check fires first because
          priority 14 < priority… wait: priority 11 < 14, so the lower-priority
          number wins. Lock: priority-11 (ERR_CATALOG_PERMISSION_DENIED)
          fires before priority-14 (ERR_ORDER_WINDOW_CLOSED).
        test_recipe:
          setup:
            - "Create Recipe R_allowed and R_forbidden."
            - "Create Store S1 with catalog_permission=[R_allowed.id], order window 09:00–17:00 UTC."
            - "Set clock to 18:00 UTC (outside window)."
            - "Create DRAFT StoreOrder for S1, append OrderLine(R_forbidden, quantity=1) — drafting allowed; submission will fail."
          trigger:
            - "POST /supply-chain/store-orders/{id}/submit"
          assert:
            - "Response error_id == ERR_CATALOG_PERMISSION_DENIED  # priority 11 wins over priority 14"
            - "Response http status == 422"

      - name: vehicle_state_beats_capacity_constraint_on_dispatch
        grounds:
          - validations[priority=6]    # ERR_INVALID_STATE (state)
          - validations[priority=19]   # ERR_VEHICLE_CAPACITY_EXCEEDED (business_constraint)
          - state_machines.DeliveryRoute.PLANNED_to_DISPATCHED
          - endpoints["POST /supply-chain/delivery-routes/{id}/dispatch"]
        distinguishing_aspect: |
          Different category pair = (state, business_constraint). When dispatch
          is attempted on an already-DISPATCHED route AND the planned load
          exceeds vehicle capacity, the state check at priority 6 fires
          before the constraint check at priority 19.
        test_recipe:
          setup:
            - "Create AVAILABLE Vehicle V1 (capacity_units=10)."
            - "Plan a route on V1 with stops totaling planned units = 50 (intentionally over capacity); dispatch once → status=DISPATCHED."
          trigger:
            - "POST /supply-chain/delivery-routes/{id}/dispatch  # second time on same route"
          assert:
            - "Response error_id == ERR_INVALID_STATE  # priority 6 wins over priority 19"
            - "Response http status == 409"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: alert_tier_inclusive_24h_boundary
        grounds:
          - calculations.near_expiry_alert_tier
          - entities.InventoryBatch.fields.alert_tier
          - endpoints["POST /supply-chain/_sweep/expiry-alerts"]
        distinguishing_aspect: |
          Numeric threshold boundary on the hours-to-expiry metric. Boundary
          is INCLUSIVE (<=, not <): a batch with exactly 24 hours to expiry
          MUST be classified as TIER1, not NONE.
        test_recipe:
          setup:
            - "Set clock to 2026-05-11T00:00:00Z."
            - "Create an InventoryBatch with expires_at = 2026-05-12T00:00:00Z (exactly 24h ahead)."
          trigger:
            - "POST /supply-chain/_sweep/expiry-alerts"
          assert:
            - "InventoryBatch.alert_tier == 'TIER1'  # 24 <= TIER1_HOURS=24 holds (inclusive)"

      - name: empty_order_lines_rejected_on_submit
        grounds:
          - state_machines.StoreOrder.DRAFT_to_SUBMITTED.preconditions
          - validations[priority=6]    # ERR_INVALID_STATE
          - endpoints["POST /supply-chain/store-orders/{id}/submit"]
        distinguishing_aspect: |
          Empty-collection boundary (different metric type from numeric
          threshold) on a different endpoint. Submitting a StoreOrder with
          zero OrderLines violates 'OrderLine count >= 1' precondition.
        test_recipe:
          setup:
            - "Create Store S1 inside its order window."
            - "Create DRAFT StoreOrder for S1; append NO OrderLines."
          trigger:
            - "POST /supply-chain/store-orders/{id}/submit"
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "Response http status == 409"
            - "StoreOrder.status remains DRAFT"

      - name: replenishment_safety_stock_inclusive_boundary
        grounds:
          - calculations.replenishment_signal
          - entities.ReplenishmentRule.fields.safety_stock_units
          - endpoints["POST /supply-chain/_sweep/replenish"]
        distinguishing_aspect: |
          Inclusive (<=) numeric boundary on a different metric (on_hand
          inventory) reachable through a different endpoint (/_sweep/replenish).
          When on_hand == safety_stock_units exactly, replenishment MUST fire.
        test_recipe:
          setup:
            - "Create Store S1 with one InventoryBatch (recipe=R, quantity_on_hand=10, status=ON_HAND)."
            - "Create ReplenishmentRule(store=S1, recipe=R, safety_stock_units=10, replenish_to_units=20, cycle_hours=1)."
            - "Set rule.last_evaluated_at = now() - 2 hours (cycle elapsed)."
          trigger:
            - "POST /supply-chain/_sweep/replenish"
          assert:
            - "A new replenishment StoreOrder exists for (S1, R) with one OrderLine quantity=10  # because 10 <= 10 holds"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: store_order_submit_requires_active_store
        grounds:
          - state_machines.StoreOrder.DRAFT_to_SUBMITTED
          - entities.Store.fields.status
          - endpoints["POST /supply-chain/store-orders/{id}/submit"]
        distinguishing_aspect: |
          Pair = (StoreOrder, Store). StoreOrder.DRAFT→SUBMITTED requires
          Store.status==ACTIVE — submit fails when the parent Store is
          SUSPENDED even though the order itself is well-formed.
        test_recipe:
          setup:
            - "Create Store S1, set status=SUSPENDED via PATCH /stores/{id} (PlatformAdmin)."
            - "Create DRAFT StoreOrder for S1 with one valid OrderLine (window/quantity OK)."
          trigger:
            - "POST /supply-chain/store-orders/{id}/submit"
          assert:
            - "Response error_id == ERR_INVALID_STATE  # cross-entity precondition: Store must be ACTIVE"
            - "Response http status == 409"

      - name: delivery_route_dispatch_requires_available_vehicle
        grounds:
          - state_machines.DeliveryRoute.PLANNED_to_DISPATCHED
          - entities.Vehicle.fields.status
          - validations[priority=20]    # ERR_VEHICLE_NOT_AVAILABLE
          - endpoints["POST /supply-chain/delivery-routes/{id}/dispatch"]
        distinguishing_aspect: |
          Different entity pair = (DeliveryRoute, Vehicle). Even with valid
          payload, dispatch fails when Vehicle.status != AVAILABLE.
        test_recipe:
          setup:
            - "Create Vehicle V1 (capacity_units=100, temperature_zones=[CHILLED]); plan and dispatch route R1 on V1 (V1 now ASSIGNED)."
            - "Plan a SECOND route R2 also on V1 (same vehicle_id)."
          trigger:
            - "POST /supply-chain/delivery-routes/{R2.id}/dispatch"
          assert:
            - "Response error_id == ERR_VEHICLE_NOT_AVAILABLE"
            - "Response http status == 409"
            - "R2.status remains PLANNED"

      - name: delivery_route_dispatch_requires_completed_production_batch
        grounds:
          - state_machines.DeliveryRoute.PLANNED_to_DISPATCHED
          - entities.ProductionBatch.fields.status
          - validations[priority=12]    # ERR_BATCH_NOT_READY
          - endpoints["POST /supply-chain/delivery-routes/{id}/dispatch"]
        distinguishing_aspect: |
          Third entity pair = (DeliveryRoute, ProductionBatch). Dispatch
          requires every loaded batch to be COMPLETED; SCHEDULED batches
          cannot ride. Distinct from the Vehicle dependency above.
        test_recipe:
          setup:
            - "Create Vehicle V1 AVAILABLE."
            - "Create ProductionBatch B1 in SCHEDULED state (not COMPLETED)."
            - "Plan DeliveryRoute R1 on V1 with planned_stops referencing B1."
          trigger:
            - "POST /supply-chain/delivery-routes/{R1.id}/dispatch"
          assert:
            - "Response error_id == ERR_BATCH_NOT_READY"
            - "Response http status == 422"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: vehicle_stops_half_open_interval_overlap
        grounds:
          - validations[priority=16]    # ERR_DELIVERY_WINDOW_OVERLAP
          - entities.DeliveryRoute.fields.planned_stops
          - endpoints["POST /supply-chain/delivery-routes"]
          - endpoints["POST /supply-chain/delivery-routes/{id}/dispatch"]
        distinguishing_aspect: |
          Pairwise overlap detection on Vehicle resource using HALF-OPEN
          intervals [start, end). Adjacent stops 10:00–11:00 and 11:00–12:00
          touch but do NOT overlap (allowed); stops 10:00–11:00 and
          10:30–11:30 do overlap (rejected). Geometric semantic: pairwise
          intersection of half-open intervals.
        test_recipe:
          setup:
            - "Create Vehicle V1 capacity_units=100, temperature_zones=[AMBIENT]."
            - "Create Stores S1 and S2 with AMBIENT zone; have one COMPLETED ProductionBatch each."
          trigger:
            - "POST /supply-chain/delivery-routes  body={vehicle_id: V1.id, planned_stops: [{store=S1, window=[10:00,11:00)}, {store=S2, window=[11:00,12:00)}]}  → SUCCESS, route_a"
            - "POST /supply-chain/delivery-routes  body={vehicle_id: V1.id, planned_stops: [{store=S1, window=[10:00,11:00)}, {store=S2, window=[10:30,11:30)}]}  → FAILURE"
          assert:
            - "First call returns 201 (adjacent half-open intervals are allowed)."
            - "Second call returns 422 with error_id == ERR_DELIVERY_WINDOW_OVERLAP."

      - name: equipment_class_aggregate_capacity_per_day
        grounds:
          - validations[priority=18]    # ERR_EQUIPMENT_CAPACITY_EXCEEDED
          - calculations.shelf_life_sequencing.constants.EQUIPMENT_MINUTES_PER_CLASS_PER_DAY
          - state_machines.ProductionBatch.PLANNED_to_SCHEDULED
          - endpoints["POST /supply-chain/production-batches/{id}/schedule"]
        distinguishing_aspect: |
          Different resource entity (equipment-class line) and different
          interval semantic. Not pairwise overlap geometry — uses AGGREGATE
          capacity: sum of equipment_minutes scheduled on equipment_class for
          target_delivery_date must stay ≤ 480. Two non-overlapping batches
          can each individually fit but together exceed the daily cap.
        test_recipe:
          setup:
            - "Create Recipes R_a, R_b both equipment_class=OVEN, production_minutes_per_unit=10."
            - "Submit and consolidate orders such that two ProductionBatches PLANNED for 2026-05-12 with planned_units=30 each → equipment_minutes=300 each."
          trigger:
            - "POST /supply-chain/production-batches/{batch_a.id}/schedule  → SUCCESS"
            - "POST /supply-chain/production-batches/{batch_b.id}/schedule  → FAILURE (300 + 300 = 600 > 480)"
          assert:
            - "First schedule succeeds (300 ≤ 480)."
            - "Second schedule returns 422 with error_id == ERR_EQUIPMENT_CAPACITY_EXCEEDED."
            - "No assertion about pairwise time-window overlap — capacity is aggregate."

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: production_fail_preserves_open_order_count
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_FAILED
          - state_machines.StoreOrder.SUBMITTED_to_CONSOLIDATED
          - state_machines.StoreOrder.CONSOLIDATED_to_SUBMITTED
          - endpoints["POST /supply-chain/production-batches/consolidate"]
          - endpoints["POST /supply-chain/production-batches/{id}/fail"]
        distinguishing_aspect: |
          Conserved quantity = COUNT of OPEN store orders for the target date,
          formula: count(StoreOrder WHERE status IN {SUBMITTED, CONSOLIDATED}
          AND target_delivery_date = D). Forward action consolidate flips
          SUBMITTED→CONSOLIDATED (count unchanged); compensating action
          batch.fail flips CONSOLIDATED→SUBMITTED (count unchanged). Net round-
          trip leaves the count identical to the pre-state. Order count is the
          conserved quantity.
        test_recipe:
          setup:
            - "Create 3 SUBMITTED StoreOrders for target_delivery_date=2026-05-12 (each with one OrderLine)."
            - "Record N0 = count(StoreOrder WHERE status IN {SUBMITTED, CONSOLIDATED} AND target_delivery_date=2026-05-12) = 3."
          trigger:
            - "POST /supply-chain/production-batches/consolidate {target_delivery_date: '2026-05-12'}  → status flips to CONSOLIDATED for all three"
            - "Schedule and start the resulting batch."
            - "POST /supply-chain/production-batches/{batch_id}/fail"
          assert:
            - "After consolidate: count == 3 (now all CONSOLIDATED)."
            - "After fail: count == 3 (now all reverted to SUBMITTED)."
            - "N_final == N0 (open-order count preserved across the consolidate→fail roundtrip)."

      - name: loss_record_then_reverse_preserves_quantity_on_hand
        grounds:
          - state_machines.LossRecord.RECORDED_to_REVERSED
          - entities.InventoryBatch.fields.quantity_on_hand
          - endpoints["POST /supply-chain/loss-records"]
          - endpoints["POST /supply-chain/loss-records/{id}/reverse"]
        distinguishing_aspect: |
          Different conserved quantity = InventoryBatch.quantity_on_hand
          (a stock-units invariant, not a state-count invariant). Forward
          action 'POST /loss-records' decrements quantity_on_hand by
          quantity_lost; compensating action 'reverse' increments by the
          same amount. Quantity-on-hand is the named invariant: it MUST
          equal its pre-record value after the record→reverse roundtrip.
        test_recipe:
          setup:
            - "Create Store S1 with InventoryBatch B1 (recipe=R, quantity_on_hand=20, status=ON_HAND)."
            - "Record Q0 = B1.quantity_on_hand == 20."
          trigger:
            - "POST /supply-chain/loss-records  body={inventory_batch_id: B1.id, quantity_lost: 5, cause: 'DAMAGE', responsibility_user_id: 'user_42'}  → loss L1 (status=RECORDED)"
            - "POST /supply-chain/loss-records/{L1.id}/reverse                                  → L1.status=REVERSED"
          assert:
            - "After POST /loss-records: B1.quantity_on_hand == 15  # decrement at recording"
            - "After /reverse: B1.quantity_on_hand == 20            # increment compensates"
            - "Q_final == Q0 (named invariant: quantity_on_hand preserved across the record→reverse roundtrip)"
