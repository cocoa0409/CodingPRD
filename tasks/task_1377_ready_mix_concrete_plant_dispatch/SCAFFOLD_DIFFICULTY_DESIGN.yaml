            - "Invoice.${inv_id}.status == PAID; Order.${o_id}.billing_status == PAID"

  # =================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_triggers_order_invoice_credit_chain
        grounds:
          - state_machines.Load.POURING_to_COMPLETED
          - state_machines.Order.IN_PROGRESS_to_DELIVERED
          - calculations.credit_exposure
          - calculations.order_fulfillment
        distinguishing_aspect: |
          Depth-3 cascade from POST /v1/loads/{id}/complete: load completion recomputes
          Order.delivered_qty_yd3 (link 1); crossing >= qty_yd3 flips the Order to
          DELIVERED and auto-creates the DRAFT Invoice (link 2); invoice creation
          recomputes Customer.credit_exposure_cents and flips credit_status to HOLD
          (link 3) because 159300 >= credit_limit 150000.
        test_recipe:
          setup:
            - "Standard catalog (2026-08 index 115.0); customer credit_limit_cents 150000; order qty 8.0 pour 2026-08-15; one 8.0 yd3 load in POURING with arrival 10:30, complete at 12:00"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
