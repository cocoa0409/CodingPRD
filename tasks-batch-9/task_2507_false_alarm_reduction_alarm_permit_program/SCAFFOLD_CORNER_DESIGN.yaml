          - calculations.permit_renewal_fee.constants
        distinguishing_aspect: "The grace window and the tier ladder share the same 30-day edge: on 2027-08-31 days_late is exactly 30, which is still inside grace (renewal accepted) and selects the {max_days_late 30 -> 3000} tier, so the invoice assesses 3000 + 3000 + 500 = 6500 rather than the open-ended 6000 tier."
