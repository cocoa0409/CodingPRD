          - validations.priority_45_ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED
          - entities.FieldInspection.fields.inspector_user_id
          - entities.FieldInspection.fields.inspected_on
        distinguishing_aspect: |
          A THIRD RESOURCE - the inspector, addressed by X-User-ID rather than by an entity row - with
          AGGREGATE-PER-DAY semantics instead of interval intersection: the inspections do not carry clock
