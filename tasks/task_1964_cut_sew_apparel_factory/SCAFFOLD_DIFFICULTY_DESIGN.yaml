  - rule_id: resource_temporal_overlap
    instances:
      - name: line_station_aggregate_capacity_overlap
        grounds:
          - validations[priority=8.1]
          - entities.SewingLine.fields.station_count
          - errors[ERR_LINE_STATION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity — half-open [start,end) overlaps on one
          (line, shift_date) are allowed while concurrent count <= station_count (2); a third
          overlapping assignment fails, while pure adjacency (start == other's end) is free.
        test_recipe:
          setup:
            - "SewingLine L1 station_count 2; operators o1..o3; order + DRAFT pack op (FK targets only)"
            - "a1 (o1, 480-580) and a2 (o2, 500-600) already on L1 / 2026-08-03 (concurrent 2 == capacity)"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-OV1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 10 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "A1" }, as: LineSupervisor, captures: { o1: $.data.id } }
            - { call: "POST /operators", payload: { employee_no: "E2", full_name: "A2" }, as: LineSupervisor, captures: { o2: $.data.id } }
            - { call: "POST /operators", payload: { employee_no: "E3", full_name: "A3" }, as: LineSupervisor, captures: { o3: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o1}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 10 }, as: LineSupervisor, captures: { a1: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o2}", shift_date: "2026-08-03", start_minute: 500, end_minute: 600, assigned_pieces: 10 }, as: LineSupervisor, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o3}", shift_date: "2026-08-03", start_minute: 520, end_minute: 620, assigned_pieces: 10 }, as: LineSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o3}", shift_date: "2026-08-03", start_minute: 600, end_minute: 700, assigned_pieces: 10 }, as: LineSupervisor, captures: { a4: $.data.id } }
          assert:
            - "third overlapping assignment (520-620): err == ERR_LINE_STATION_CAPACITY_EXCEEDED (concurrency would reach 3 > station_count 2)"
            - "adjacent assignment (600-700, start == a2.end) succeeds: LineAssignment.${a4} created — half-open intervals never overlap at endpoints"
            - "a1/a2 unaffected"

      - name: operator_buffered_changeover_overlap
        grounds:
          - validations[priority=8.2]
          - errors[ERR_OPERATOR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource: operator assignments require a
          15-minute changeover buffer — adjacency (new.start == existing.end) is REJECTED and
          only new.start >= existing.end + 15 passes (595 - 580 = 15 accepted at exactly the buffer).
        test_recipe:
          setup:
            - "SewingLine L2 station_count 5 (capacity never binds); operator o9 with assignment 480-580 on 2026-08-03"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-OV2", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 10 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L2", station_count: 5, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /operators", payload: { employee_no: "E9", full_name: "A9" }, as: LineSupervisor, captures: { o9: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o9}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 10 }, as: LineSupervisor, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o9}", shift_date: "2026-08-03", start_minute: 580, end_minute: 600, assigned_pieces: 5 }, as: LineSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${o9}", shift_date: "2026-08-03", start_minute: 595, end_minute: 700, assigned_pieces: 5 }, as: LineSupervisor, captures: { a3: $.data.id } }
          assert:
            - "adjacent assignment (start 580 == existing end 580): err == ERR_OPERATOR_SCHEDULE_OVERLAP (buffer required; adjacency rejected unlike line capacity)"
            - "start 595 == 580 + 15: LineAssignment.${a3} created — buffer boundary is inclusive at exactly CHANGEOVER_BUFFER_MINUTES"
            - "different shift_date would not interact: semantics are per (operator_id, shift_date)"

  - rule_id: compensating_invariant
    instances:
      - name: fabric_yards_approve_cancel_conservation
        grounds:
          - state_machines.Marker.DRAFT_to_APPROVED
          - state_machines.Marker.APPROVED_to_CANCELLED
          - entities.FabricRoll.fields.available_yards
        distinguishing_aspect: |
          Conserved quantity: fabric yards. approve then cancel is a compensating pair:
          allocated_yards 0 -> 41.3 -> 0 and available_yards 41.3 -> 0 -> 41.3 with
          allocated + consumed + available == usable_yards (41.3) at every step.
        test_recipe:
          setup:
            - "Order exists; roll 41.3 AVAILABLE (v2); marker m1 DRAFT length 40.0"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-CI1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 100 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 100 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
          trigger:
            - { call: "POST /markers/${mk}/cancel", payload: {}, as: CuttingManager }
          assert:
            - "post-approve: FabricRoll.${fr} had allocated_yards == 41.3, available_yards == 0 (observed between trigger steps)"
            - "post-cancel: FabricRoll.${fr}.allocated_yards == 0, consumed_yards == 0, available_yards == 41.3 — identical to pre-approve"
            - "invariant: allocated_yards + consumed_yards + available_yards == usable_yards == 41.3 before and after the round trip"
            - "Marker.${mk}.status == CANCELLED and Marker.${mk}.allocated_yards == 0"

      - name: trim_units_plan_finish_conservation
        grounds:
          - calculations.trim_grossing
          - state_machines.ProductionOrder.SEWING_to_FINISHED
          - entities.TrimItem.fields.qty_reserved
        distinguishing_aspect: |
          Conserved quantity: trim units (different from fabric yards). plan reserves
          (+9 reserved / -9 available) and finish releases the reservation; qty_on_hand (20)
          never moves and on_hand == reserved + available holds at every step.
        test_recipe:
          setup:
            - "Trim TI1 received 20; pack with req (TI1, 2/garment, w 0.34) APPROVED; order 3xM"
            - "full happy path driven to QC_PASSED with one COMPLETED bundle"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-CI2", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /trim-items", payload: { sku_code: "TI1", description: "button", origin_country: "US", unit_cost_cents: 10 }, as: MaterialsPlanner, captures: { ti1: $.data.id } }
            - { call: "POST /trim-items/${ti1}/receive", payload: { qty: 20 }, as: MaterialsPlanner }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /trim-requirements", payload: { tech_pack_id: "${tp}", trim_item_id: "${ti1}", units_per_garment: 2, wastage_pct: 0.34 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 3 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 3 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 3 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk}", as: Any, captures: { b1: "$.data[0].id" } }
            - { call: "POST /bundles/${b1}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "Ann" }, as: LineSupervisor, captures: { opr: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 3 }, as: LineSupervisor }
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b1}", operation_spec_id: "${op1}", work_date: "2026-08-03", qty: 3 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe: $.data.id } }
            - { call: "POST /piece-work-entries/${pe}/review", payload: { decision: "VERIFY" }, as: LineSupervisor }
            - { call: "POST /quality-audits", payload: { production_order_id: "${po}", inspection_level: "NORMAL", aql_level: "AQL_2_5" }, as: QualityInspector, as_user_id: u-qi1, captures: { qa1: $.data.id } }
            - { call: "POST /quality-audits/${qa1}/record", payload: { defects_found: 0 }, as: QualityInspector, as_user_id: u-qi1 }
          trigger:
            - { call: "POST /production-orders/${po}/finish", payload: {}, as: ProductionPlanner }
          assert:
            - "mid-chain (post-plan): TrimItem.${ti1}.qty_on_hand == 20, qty_reserved == 9, qty_available == 11 (20 == 9 + 11)"
            - "post-finish: TrimItem.${ti1}.qty_reserved == 0, qty_available == 20 — reservation fully released, on_hand untouched at 20"
            - "ProductionOrder.${po}.production_status == FINISHED"
            - "invariant qty_on_hand == qty_reserved + qty_available held at every step of plan->...->finish"
