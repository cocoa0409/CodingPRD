  - name: video_session_validity_boundary_at_one_eighty_and_one_seventy_nine_seconds
    grounds:
    - calculations.video_session_validity constant MIN_VALID_SESSION_SEC = 180, inclusive >=
    - validations priority 48 -> ERR_NO_VALID_VIDEO_SESSION (409)
    - endpoints.POST /stroke-network/consults/{id}/video-sessions
    - endpoints.POST /stroke-network/consults/{id}/complete
    distinguishing_aspect: 'A DIFFERENT metric on a DIFFERENT endpoint and in a different unit: session duration_seconds against the inclusive SECOND threshold MIN_VALID_SESSION_SEC = 180, observed at POST /stroke-network/consults/{id}/video-sessions (and enforced at /complete). Where instance 11''s boundary only flips a reporting flag, this one is a GATE: 179 seconds leaves valid_video_session_count at 0 and makes the consult uncompletable, so the same one-second difference changes an HTTP 409 into an HTTP 200. It also exercises sub-minute precision — 08:17:59 minus 08:15:00 must be read as 179 seconds, not as 3 minutes.'
