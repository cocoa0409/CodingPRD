        claim_type: listing
        grounds:
          - "endpoints.GET_/cold-chain/chillers"
          - "response_envelope"
        distinguishing_aspect: "Pagination contract: limit 2 over 3 chillers returns 2 items with total_count 3 and has_more true; offset 2 returns 1 item with has_more false."
        test_recipe:
          setup: ["Three COMPACT chillers registered in one batch."]
          setup_api_calls:
            - call: "POST /cold-chain/chillers"
