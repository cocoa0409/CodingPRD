          assert:
            - "CrewMember.${nurse_id}.deficiency_points_90d == 15 (10 + 5; >= 15 inclusive triggers hop 2)"
            - "CrewMember.${nurse_id}.status == REMEDIATION_HOLD (hop 2 fired only after the second flag crossed the threshold)"
            - "CrewAssignment.${asg3_id}.status == RELEASED (hop 3: caused by the hop-2 status flip, on the unrelated PLANNING mission ${m3_id})"
            - "PatientCareReport.${pcr2_id}.status == QA_FLAGGED"

      - name: abort_cascade_leg_bed_release
        grounds:
          - state_machines.Mission.LAUNCHED_to_ABORTED
          - state_machines.GroundTransportLeg.ENROUTE_to_CANCELLED
          - state_machines.BedReservation.CONFIRMED_to_RELEASED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (abort, not divert or
          qa-review): aborting a LAUNCHED mission cancels the ENROUTE
          DESTINATION ground leg (hop 1), and the leg's cancellation releases
          its linked CONFIRMED bed (hop 2 — caused by the leg cancellation,
          not directly by the abort).
        test_recipe:
          setup:
            - "ALS rotor mission LAUNCHED; CONFIRMED bed at County General; DESTINATION leg ENROUTE linked to that bed"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Kappa", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N999AB", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 60, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/bed-reservations", payload: { mission_id: "${m_id}", facility_name: "County General", bed_type: "CCU", hold_until_iso: "2026-08-01T18:00:00Z" }, as: Dispatcher, captures: { bed_id: "$.data.id" } }
            - { call: "PUT /air-ambulance/bed-reservations/${bed_id}", payload: { status: "CONFIRMED" }, as: Dispatcher }
            - { call: "POST /air-ambulance/ground-legs", payload: { mission_id: "${m_id}", leg_type: "DESTINATION", provider_name: "City EMS", scheduled_pickup_iso: "2026-08-01T09:30:00Z", bed_reservation_id: "${bed_id}" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "PUT /air-ambulance/ground-legs/${leg_id}", payload: { status: "ENROUTE" }, as: Dispatcher }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
          trigger:
            - { call: "POST /air-ambulance/missions/${m_id}/abort", payload: { reason_code: "MECHANICAL" }, as: FlightCrew, as_user_id: "${pilot_id}" }
          assert:
            - "Mission.${m_id}.status == ABORTED"
            - "Aircraft.${ac_id}.status == AVAILABLE (hop 1 release)"
            - "GroundTransportLeg.${leg_id}.status == CANCELLED (hop 1)"
            - "BedReservation.${bed_id}.status == RELEASED (hop 2: caused by the leg cancellation, bed was CONFIRMED before abort)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_accept
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): accepting a DECLINED
          request with a BLS_CAPABLE aircraft for a CCT-tier patient violates
          both the state gate and the acuity-config safety gate; priority 6
          (state) must win over priority 7 (business_safety).
        test_recipe:
          setup:
            - "Base with BLS_CAPABLE rotor and full CCT crew; CCT-tier request (verified 8/6/5/3 with 60-min onset) already DECLINED by the MedicalDirector"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Lambda", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N101BL", aircraft_class: "ROTOR_WING", medical_config: "BLS_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pam Medic", crew_role: "PARAMEDIC" }, as: OpsAdmin, captures: { medic_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Amy Acute", date_of_birth: "1975-11-02", weight_kg: 65 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Mile 42 I-10", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T23:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/decline", payload: { reason: "No receiving bed available" }, as: MedicalDirector }
          trigger:
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }, { crew_member_id: "${medic_id}", role_in_mission: "PARAMEDIC" }], estimated_loaded_miles: 40, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_REQUEST_NOT_TRIAGED (state, priority 6) — NOT ERR_ACUITY_EXCEEDS_CONFIG (business_safety, priority 7), even though the BLS airframe also fails the CCT config gate"
            - "MissionRequest.${req_id}.status remains DECLINED"

      - name: safety_beats_fiscal_on_launch
        grounds:
          - validations[priority=12]
          - validations[priority=28]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_fiscal) — different
          pair from state_beats_safety_on_accept: launching a
          SCHEDULED_INTERFACILITY mission whose latest assessment is NO_GO
          and which has no APPROVED/PARTIAL authorization violates both;
          priority 12 (safety) must win over priority 28 (fiscal).
        test_recipe:
          setup:
            - "BLS-tier SCHEDULED_INTERFACILITY mission in PLANNING (no emergency_override); no InsuranceAuthorization created; latest weather assessment decision NO_GO"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Mu", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
