            - "expected_grid_version is re-read after publish, so the optimistic-concurrency rule at priority 40 is satisfied and cannot mask the pair under test."
            - "The request then asks for Monday 20:00 for 60 minutes for the news show - squarely inside the music show's live window - on that published grid, with conflict_policy left at its default so the window rule genuinely applies."
