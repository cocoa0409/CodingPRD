      - name: calc_cost_share_provisional_and_final_diverge_on_same_month
        claim_type: variant_divergence
        grounds:
          - calculations.resident_cost_share_monthly
          - entities.CostShareDetermination.fields.variant
        excluded_because:
          difficulty_instance: dual_variant_calc / cost_share_provisional_vs_final_divergence
          rationale: "The named §1.8 instance already runs both variants over one identical month of income and census data and pins the exact divergence in cents."

      - name: calc_claim_amount_diverges_by_declared_basis
        claim_type: variant_divergence
        grounds:
          - calculations.per_diem_claim_amount
          - entities.PerDiemClaim.fields.basis
        excluded_because:
          difficulty_instance: dual_variant_calc / per_diem_claim_census_vs_audited_basis_divergence
          rationale: "The named §1.8 instance prices the same census set under CENSUS_BASIS and AUDITED_BASIS and pins both amounts plus the bed-hold monthly cap difference."

      - name: calc_bed_hold_half_rate_rounded_once_per_day
        claim_type: precision
        grounds:
          - calculations.per_diem_claim_amount
          - calculations.per_diem_claim_amount.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / per_diem_bed_hold_per_day_rounding_order_pinned
          rationale: "The named §1.8 instance contrasts the pinned per-day rounding against the forbidden round-the-monthly-total order on a day count where the two differ by one cent."

      - name: calc_medical_cap_selected_from_pre_medical_tier
        claim_type: constants_applied
        grounds:
          - calculations.resident_cost_share_monthly
          - entities.CostShareDetermination.fields.allowed_medical_deduction_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / cost_share_medical_cap_tier_evaluation_order_pinned
          rationale: "The named §1.8 instance pins the evaluation order by choosing an income where tiering after the medical deduction would pick a different cap and a different share."

      - name: calc_priority_score_floors_at_class_base_points
        claim_type: correct_result
        grounds:
          - calculations.applicant_priority_score
          - entities.Applicant.fields.priority_score
        excluded_because:
          difficulty_instance: combinatorial_formula / waitlist_priority_score_nonlinear_floor
          rationale: "The named §1.8 instance drives the raw weighted sum below the class base with the behavioral-risk penalty and asserts the max(base, raw) floor."

  - section: validations
    instances:
      - name: val_duplicate_waitlist_entry_rejected_per_unit_not_per_applicant
        claim_type: violation_error
        grounds:
          - validations[priority=80,ERR_DUPLICATE_WAITLIST_ENTRY]
          - errors.ERR_DUPLICATE_WAITLIST_ENTRY
        distinguishing_aspect: |
          Uniqueness is scoped to the (applicant_id, care_unit_id) pair and only for live statuses:
          a second ACTIVE entry on the SAME unit is rejected with ERR_DUPLICATE_WAITLIST_ENTRY while
          a second entry on a DIFFERENT NURSING unit of the same home succeeds and leaves the
          applicant WAITLISTED with two ACTIVE entries.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with two CERTIFIED NURSING units A and B."
            - "One ELIGIBLE applicant with requested_care_level NURSING already holding one ACTIVE WaitlistEntry on unit A."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Maplecrest State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { ua_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing B", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { ub_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Wilma Trask", date_of_birth: "1948-08-08", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${ua_id}" }
              as: AdmissionsCoordinator
              captures: { w1_id: "$.data.id" }
          trigger:
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${ua_id}" }
              as: AdmissionsCoordinator
              captures: { dup_err: "$.data.error_id" }
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${ub_id}" }
              as: AdmissionsCoordinator
              captures: { w2_id: "$.data.id", w2_status: "$.data.status", w2_pos: "$.data.queue_position" }
            - call: "GET /svh/applicants/${app_id}/waitlist-entries"
              payload: { status: "ACTIVE", limit: 10 }
              as: AdmissionsCoordinator
              captures: { entries_total: "$.meta.total_count" }
            - call: "GET /svh/care-units/${ua_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { ua_active: "$.data.waitlist_active_count" }
          assert:
            - "duplicate create returns HTTP 409"
            - "dup_err == ERR_DUPLICATE_WAITLIST_ENTRY"
            - "w2_status == ACTIVE"
            - "w2_pos == 1"
            - "entries_total == 2"
            - "ua_active == 1"
            - "Applicant.${app_id}.status == WAITLISTED"

      - name: val_bed_hold_overlap_rejected_at_zero_gap_boundary
        claim_type: temporal_validation
        grounds:
          - validations[priority=85,ERR_BED_HOLD_OVERLAP]
          - errors.ERR_BED_HOLD_OVERLAP
          - state_machines.Resident.ADMITTED_to_HOSPITALIZED
        distinguishing_aspect: |
          Bed-hold intervals are half-open [start, readmission_date): a new hospitalization starting
          exactly ON the prior readmission date 2026-08-10 overlaps and is rejected, while a start on
          2026-08-11 - zero-gap adjacency - is accepted and re-opens the hold with
          bed_hold_days_used still at the 5 days consumed by the first interval.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home."
            - "The resident is hospitalized 2026-08-05 and readmitted 2026-08-10, so bed_hold_days_used is 5 and last_hospitalization_end_date is 2026-08-10."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Northfield State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
