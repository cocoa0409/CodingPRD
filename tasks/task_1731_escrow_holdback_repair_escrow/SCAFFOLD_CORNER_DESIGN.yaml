              as: Contractor
              as_user_id: "contr_1"
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /escrow/draw-requests/${draw_id}/approve"
              payload: {}
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_VERIFYING_INSPECTION (the 2026-08-20 pass predates the 2026-08-21 draw and is filtered out)"
            - "DrawRequest.${draw_id}.status remains SUBMITTED"

      - name: reserved_and_disbursed_fields
        claim_type: computed_fields
        grounds: [entities.Holdback.fields.reserved_cents, entities.Holdback.fields.total_disbursed_cents]
        distinguishing_aspect: "Stub — derived money fields are asserted with exact values in the difficulty index."
