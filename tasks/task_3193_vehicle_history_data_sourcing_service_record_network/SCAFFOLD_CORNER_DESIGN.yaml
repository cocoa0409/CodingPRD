          - entities.Vehicle.fields.superseded_record_count
        distinguishing_aspect: "active_record_count increments on ingest, stays flat on supersede (swap), and superseded_record_count counts only supersedes; the rollup brand follows the replacement."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle with 1 inspection record and 1 clean title"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
