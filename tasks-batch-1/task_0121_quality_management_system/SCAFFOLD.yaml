# =============================================================================
# Quality Management System (QMS) — Scaffold (§1.0–§1.7)
# Difficulty tier: Expert
# =============================================================================

scenario: |
  Quality Management System (QMS): nonconformance report (NCR), CAPA workflow
  (8D root cause), supplier corrective action (SCAR), inspection plan/AQL
  sampling, ISO 9001 audit findings, deviation/waiver, control plan revision

domain_name: quality-management-system
# Flat/graph topology: many co-equal top-level collections (suppliers,
# nonconformance-reports, capas, scars, audits, deviations, control-plans,
# inspection-plans/lots, personnel). No single resource nests all the others, so
# the API root "" is the common prefix; every collection is a top-level path.
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer/flat entities linked by cross-aggregate foreign keys: an NCR references a
  # Supplier, an AuditFinding, an InspectionLot; a CAPA references its NCR; a SCAR
  # references both the NCR and the Supplier; a Deviation references the NCR it
  # waives; ControlPlanRevision references its ControlPlan. The graph of references
  # spans aggregate boundaries rather than forming a single ownership tree.

  state_machine_shape: cyclic
  # Capa is cyclic (8D verification at D6 can loop back to D4 root-cause rework);
  # NonconformanceReport is branching (DISPOSITION forks into REWORK / SCRAP /
  # USE_AS_IS / RETURN_TO_SUPPLIER with divergent side-effect sets).

  relationship_patterns:
    - one_to_many        # NCR -> Capa, Capa -> EightDStep, Audit -> AuditFinding, ControlPlan -> ControlPlanRevision
    - cross_aggregate    # NCR -> Supplier / AuditFinding / InspectionLot; Scar -> NCR / Supplier; Deviation -> NCR

  role_model: segregation_of_duties
  # The Personnel who authored a CAPA cannot be the same Personnel who verifies it
  # (D7) or closes it; the QualityManager who approves a disposition is tracked by
  # X-User-ID so segregation can be enforced server-side.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Personnel full name" }
      - { name: email, type: string, source: input, description: "Login email; unique across Personnel" }
      - { name: role, type: enum, source: input, description: "QUALITY_ENGINEER | QUALITY_MANAGER | INSPECTOR | AUDITOR — the single RBAC role this person acts as", constraints: "one of {QUALITY_ENGINEER, QUALITY_MANAGER, INSPECTOR, AUDITOR}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEACTIVATED", default: ACTIVE, constraints: "one of {ACTIVE, DEACTIVATED}" }

  # ---------------------------------------------------------------------------
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: code, type: string, source: input, description: "Supplier short code; unique across Supplier" }
      - { name: quality_rating, type: number, source: computed, description: "Supplier Quality Rating (SQR), 0.00–100.00; recomputed by supplier_quality_rating calc", default: 100.00 }
      - { name: approval_status, type: enum, source: computed, description: "APPROVED | PROBATION | DISQUALIFIED — derived from quality_rating thresholds", default: APPROVED, constraints: "one of {APPROVED, PROBATION, DISQUALIFIED}" }
      - { name: open_scar_count, type: integer, source: computed, description: "Count of Scar for this supplier whose status IN {OPEN, ACK, RESPONDED, REJECTED_RESPONSE}", default: 0 }
      - { name: lots_inspected, type: integer, source: computed, description: "Count of InspectionLot dispositioned for this supplier (status IN {ACCEPTED, REJECTED})", default: 0 }
      - { name: lots_rejected, type: integer, source: computed, description: "Count of InspectionLot for this supplier with status REJECTED", default: 0 }
      - { name: ncrs_attributed, type: integer, source: computed, description: "Count of NonconformanceReport with source=SUPPLIER and supplier_id=this, status not VOID", default: 0 }

  # ---------------------------------------------------------------------------
  - name: NonconformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Short description of the nonconformance" }
      - { name: source, type: enum, source: input, description: "SUPPLIER | INTERNAL | AUDIT — origin of the nonconformance", constraints: "one of {SUPPLIER, INTERNAL, AUDIT}" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; required when source=SUPPLIER, otherwise must be omitted/null" }
      - { name: audit_finding_id, type: string, source: input, description: "FK -> AuditFinding.id; required when source=AUDIT, otherwise must be omitted/null" }
      - { name: inspection_lot_id, type: string, source: input, description: "FK -> InspectionLot.id; optional link to the lot that surfaced the defect" }
      - { name: part_number, type: string, source: input, description: "Affected part number (free-form identifier)" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR — drives required dispositions and cost weights", constraints: "one of {CRITICAL, MAJOR, MINOR}" }
      - { name: defect_qty, type: integer, source: input, description: "Number of nonconforming units", constraints: ">= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost of one affected unit in integer cents", constraints: ">= 0" }
      - { name: rework_hours, type: number, source: input, description: "Estimated labour hours to rework one unit (used by cost-of-quality)", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | DISPOSITIONED | CAPA_IN_PROGRESS | CLOSED | VOID", default: DRAFT, constraints: "one of {DRAFT, OPEN, DISPOSITIONED, CAPA_IN_PROGRESS, CLOSED, VOID}" }
      - { name: disposition, type: enum, source: system, description: "null until dispositioned, then REWORK | SCRAP | USE_AS_IS | RETURN_TO_SUPPLIER", constraints: "one of {REWORK, SCRAP, USE_AS_IS, RETURN_TO_SUPPLIER} or null" }
      - { name: deviation_id, type: string, source: system, description: "Back-pointer Deviation id (not a navigable FK): set when disposition=USE_AS_IS to the APPROVED deviation that authorised it" }
      - { name: cost_of_quality_cents, type: integer, source: computed, description: "Total cost-of-quality in integer cents; recomputed by ncr_cost_of_quality calc on disposition" }
      - { name: budget_reserved_cents, type: integer, source: computed, description: "Cents reserved against the quality budget while this NCR is non-terminal; released on CLOSED/VOID", default: 0 }
      - { name: created_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of the QualityEngineer who raised the NCR (used for SoD comparison; not reverse-navigable)" }

  # ---------------------------------------------------------------------------
  - name: Capa
    parent: null
    common_fields: true
    fields:
      - { name: ncr_id, type: string, source: input, description: "FK -> NonconformanceReport.id; the NCR this CAPA addresses" }
      - { name: title, type: string, source: input, description: "CAPA title" }
      - { name: current_step, type: enum, source: system, description: "Highest 8D discipline reached: D1..D8", default: D1, constraints: "one of {D1, D2, D3, D4, D5, D6, D7, D8}" }
      - { name: status, type: enum, source: system, description: "OPEN | ROOT_CAUSE | VERIFICATION | EFFECTIVENESS_CHECK | CLOSED_EFFECTIVE | CLOSED_INEFFECTIVE", default: OPEN, constraints: "one of {OPEN, ROOT_CAUSE, VERIFICATION, EFFECTIVENESS_CHECK, CLOSED_EFFECTIVE, CLOSED_INEFFECTIVE}" }
      - { name: rework_loops, type: integer, source: computed, description: "Number of times verification (D6) sent the CAPA back to root-cause (D4); increments on each VERIFICATION->ROOT_CAUSE", default: 0 }
      - { name: provisional_effectiveness, type: number, source: computed, description: "Projected effectiveness score 0.00–1.00 computed at VERIFICATION entry from planned containment+correction step coverage" }
      - { name: final_effectiveness, type: number, source: computed, description: "Measured effectiveness score 0.00–1.00 computed at EFFECTIVENESS_CHECK closure from realised defect-recurrence data" }
      - { name: authored_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of the QualityEngineer who opened the CAPA (used for SoD; cannot verify or close it; not reverse-navigable)" }
      - { name: verified_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of the QualityManager who recorded the D7 verification (not reverse-navigable)" }

  # ---------------------------------------------------------------------------
  - name: EightDStep
    parent: Capa
    common_fields: false
    fields:
      - { name: capa_id, type: string, source: system, description: "FK -> Capa.id; the CAPA this step belongs to" }
      - { name: discipline, type: enum, source: input, description: "D1..D8 — which 8D discipline this record documents", constraints: "one of {D1, D2, D3, D4, D5, D6, D7, D8}" }
      - { name: narrative, type: string, source: input, description: "Free-text record of the discipline's findings/actions" }
      - { name: containment_count, type: integer, source: input, description: "Number of distinct containment/corrective actions captured in this step", default: 0, constraints: ">= 0" }
      - { name: recurred_defects, type: integer, source: input, description: "On D8 effectiveness records, the count of recurrences observed in the monitoring window (0 = none)", default: 0, constraints: ">= 0" }
      - { name: recorded_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of who recorded this step (not reverse-navigable)" }

  # ---------------------------------------------------------------------------
  - name: Scar
    parent: null
    common_fields: true
    fields:
      - { name: ncr_id, type: string, source: input, description: "FK -> NonconformanceReport.id; the supplier-attributed NCR that prompted this SCAR" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier required to respond" }
      - { name: due_at, type: datetime, source: input, description: "Response due timestamp (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "OPEN | ACK | RESPONDED | ACCEPTED_RESPONSE | REJECTED_RESPONSE | RESOLVED | CANCELLED", default: OPEN, constraints: "one of {OPEN, ACK, RESPONDED, ACCEPTED_RESPONSE, REJECTED_RESPONSE, RESOLVED, CANCELLED}" }
      - { name: response_narrative, type: string, source: input, description: "Supplier's corrective-action response text (set on RESPONDED)" }
      - { name: rejection_count, type: integer, source: computed, description: "Number of times the supplier response was rejected (ACCEPTED_RESPONSE path not taken)", default: 0 }

  # ---------------------------------------------------------------------------
  - name: InspectionPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Inspection plan name" }
      - { name: control_plan_id, type: string, source: input, description: "FK -> ControlPlan.id; the control plan this inspection plan implements" }
      - { name: part_number, type: string, source: input, description: "Part number this plan inspects" }
      - { name: lot_size, type: integer, source: input, description: "Nominal lot size N used to pick the AQL sample-size code letter", constraints: ">= 1" }
      - { name: aql_pct, type: number, source: input, description: "Acceptable Quality Limit as a percent (e.g. 1.0, 2.5, 4.0)", constraints: "one of {0.65, 1.0, 1.5, 2.5, 4.0, 6.5}" }
      - { name: inspection_level, type: enum, source: input, description: "AQL general inspection level: GI | GII | GIII", default: GII, constraints: "one of {GI, GII, GIII}" }
      - { name: severity_mode, type: enum, source: computed, description: "NORMAL | TIGHTENED — switching rule driven by recent lot history", default: NORMAL, constraints: "one of {NORMAL, TIGHTENED}" }
      - { name: consecutive_rejects, type: integer, source: computed, description: "Running count of consecutive REJECTED lots on this plan; drives NORMAL->TIGHTENED switch at 2", default: 0 }
      - { name: needs_review, type: boolean, source: computed, description: "True when the linked ControlPlan was revised after this plan's last review", default: false }

  # ---------------------------------------------------------------------------
  - name: InspectionLot
    parent: null
    common_fields: true
    fields:
      - { name: inspection_plan_id, type: string, source: input, description: "FK -> InspectionPlan.id; the plan that governs this lot" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier that shipped this lot" }
      - { name: actual_lot_size, type: integer, source: input, description: "Actual N units received in this lot", constraints: ">= 1" }
      - { name: sample_size, type: integer, source: computed, description: "Sample size n resolved from the plan's code letter and severity_mode at inspection start" }
      - { name: acceptance_number, type: integer, source: computed, description: "Acceptance number Ac resolved from aql_pct and code letter at inspection start" }
      - { name: rejection_number, type: integer, source: computed, description: "Rejection number Re = Ac + 1" }
      - { name: defects_found, type: integer, source: input, description: "Defective units found in the sample (set on disposition)", default: 0, constraints: ">= 0" }
      - { name: severity_mode_used, type: enum, source: system, description: "NORMAL | TIGHTENED snapshot of the plan's mode at inspection start", constraints: "one of {NORMAL, TIGHTENED}" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_INSPECTION | ACCEPTED | REJECTED", default: PENDING, constraints: "one of {PENDING, IN_INSPECTION, ACCEPTED, REJECTED}" }
      - { name: inspected_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of the Inspector who ran the lot (not reverse-navigable)" }

  # ---------------------------------------------------------------------------
  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Audit title (e.g. 'ISO 9001 surveillance Q3')" }
      - { name: lead_auditor_id, type: string, source: input, description: "Ownership pointer: Personnel id of the AUDITOR leading this audit (validated to exist with role=AUDITOR; matched against X-User-ID for lead-auditor actions; not reverse-navigable)" }
      - { name: scheduled_from, type: datetime, source: input, description: "Audit window start (ISO 8601 UTC), inclusive" }
      - { name: scheduled_to, type: datetime, source: input, description: "Audit window end (ISO 8601 UTC), inclusive" }
      - { name: clause_scope, type: string, source: input, description: "ISO 9001 clauses in scope (free-form, e.g. '8.5,8.7')" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_PROGRESS | CLOSED", default: PLANNED, constraints: "one of {PLANNED, IN_PROGRESS, CLOSED}" }
      - { name: open_finding_count, type: integer, source: computed, description: "Count of AuditFinding for this audit whose status not IN {CLOSED, VOID}", default: 0 }

  # ---------------------------------------------------------------------------
  - name: AuditFinding
    parent: Audit
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> Audit.id; the parent audit" }
      - { name: clause, type: string, source: input, description: "ISO 9001 clause cited by the finding (e.g. '8.5.1')" }
      - { name: grade, type: enum, source: input, description: "MAJOR | MINOR | OBSERVATION — nonconformity grade", constraints: "one of {MAJOR, MINOR, OBSERVATION}" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: status, type: enum, source: system, description: "OPEN | NCR_RAISED | CLOSED | VOID", default: OPEN, constraints: "one of {OPEN, NCR_RAISED, CLOSED, VOID}" }
      - { name: raised_ncr_id, type: string, source: system, description: "Back-pointer NonconformanceReport id (not a navigable FK): the NCR escalated from this finding (set on NCR_RAISED; forward-resolved via NCR list filter audit_finding_id)" }

  # ---------------------------------------------------------------------------
  - name: Deviation
    parent: null
    common_fields: true
    fields:
      - { name: ncr_id, type: string, source: input, description: "FK -> NonconformanceReport.id; the NCR this deviation/waiver covers" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier whose part is being waived (denormalised from the NCR for overlap scoping)" }
      - { name: part_number, type: string, source: input, description: "Part number being waived (denormalised from the NCR for overlap scoping)" }
      - { name: valid_from, type: datetime, source: input, description: "Waiver effective start (ISO 8601 UTC), inclusive" }
      - { name: valid_to, type: datetime, source: input, description: "Waiver effective end (ISO 8601 UTC), exclusive (half-open window)" }
      - { name: max_qty, type: integer, source: input, description: "Maximum nonconforming units this waiver authorises", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | EXPIRED | REVOKED", default: REQUESTED, constraints: "one of {REQUESTED, APPROVED, REJECTED, EXPIRED, REVOKED}" }
      - { name: approved_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of the QualityManager who approved the waiver (not reverse-navigable)" }

  # ---------------------------------------------------------------------------
  - name: ControlPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Control plan name" }
      - { name: part_number, type: string, source: input, description: "Part number this control plan governs" }
      - { name: current_revision_no, type: integer, source: computed, description: "Highest APPROVED ControlPlanRevision.revision_no for this plan; 0 until the first is approved", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "one of {ACTIVE, RETIRED}" }

  # ---------------------------------------------------------------------------
  - name: ControlPlanRevision
    parent: ControlPlan
    common_fields: true
    fields:
      - { name: control_plan_id, type: string, source: system, description: "FK -> ControlPlan.id; the control plan being revised" }
      - { name: revision_no, type: integer, source: input, description: "Sequential revision number; must equal current_revision_no + 1 of the parent at create time", constraints: ">= 1" }
      - { name: change_summary, type: string, source: input, description: "Description of what the revision changes" }
      - { name: source_capa_id, type: string, source: input, description: "Optional back-link Capa id (not a navigable FK): the CAPA whose corrective action prompted this revision; validated to exist when provided" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED", default: DRAFT, constraints: "one of {DRAFT, APPROVED, SUPERSEDED}" }
      - { name: approved_by_personnel_id, type: string, source: system, description: "Audit stamp: Personnel id of the QualityManager who approved the revision (not reverse-navigable)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: NonconformanceReport
    initial_state: DRAFT
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /nonconformance-reports/{id}/open"
        actor: QualityEngineer
        preconditions:
          - "NCR.status == DRAFT"
          - "If source==SUPPLIER then supplier_id resolves to a Supplier with status==ACTIVE"
          - "If source==AUDIT then audit_finding_id resolves to an AuditFinding with status==OPEN"
        side_effects:
          - "Reserve budget: budget_reserved_cents = defect_qty * unit_cost_cents (held against the quality budget while non-terminal)"
          - "If source==SUPPLIER: increment Supplier.ncrs_attributed and recompute Supplier.quality_rating (supplier_quality_rating calc)"
          - "If source==AUDIT: set AuditFinding.status = NCR_RAISED and AuditFinding.raised_ncr_id = this NCR.id"

      - from: OPEN
        to: DISPOSITIONED
        trigger: "POST /nonconformance-reports/{id}/disposition"
        actor: QualityManager
        preconditions:
          - "NCR.status == OPEN"
          - "disposition is one of {REWORK, SCRAP, USE_AS_IS, RETURN_TO_SUPPLIER}"
          - "If disposition==USE_AS_IS: an APPROVED Deviation exists for this NCR whose max_qty >= NCR.defect_qty AND the server clock is within [valid_from, valid_to) (ERR_DEVIATION_REQUIRED)"
          - "If disposition==RETURN_TO_SUPPLIER: NCR.source==SUPPLIER (ERR_DISPOSITION_NOT_ALLOWED)"
          - "The acting QualityManager (X-User-ID) is not the NCR.created_by_personnel_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set disposition; recompute cost_of_quality_cents (ncr_cost_of_quality calc, branch by disposition)"
          - "Re-reserve budget: budget_reserved_cents = cost_of_quality_cents"
          - "If disposition==USE_AS_IS: set NCR.deviation_id to the approving Deviation.id"
          - "If disposition==RETURN_TO_SUPPLIER: open a Scar is NOT automatic — handled by explicit SCAR creation"
        note: "Branching fork — each disposition yields a divergent cost branch and side-effect set."

      - from: DISPOSITIONED
        to: CAPA_IN_PROGRESS
        trigger: "system: first Capa opened against this NCR (POST /capas)"
        actor: system
        preconditions:
          - "NCR.status == DISPOSITIONED"
        side_effects:
          - "No budget change"

      - from: CAPA_IN_PROGRESS
        to: CLOSED
        trigger: "system: linked Capa reaches CLOSED_EFFECTIVE"
        actor: system
        preconditions:
          - "NCR.status == CAPA_IN_PROGRESS"
          - "The Capa whose ncr_id==this reached status==CLOSED_EFFECTIVE"
        side_effects:
          - "Release budget: budget_reserved_cents = 0"
          - "Cascade: if NCR.source==SUPPLIER and a Scar exists for this NCR with status==ACCEPTED_RESPONSE, transition that Scar to RESOLVED (see Scar.ACCEPTED_RESPONSE->RESOLVED)"

      - from: DRAFT
        to: VOID
        trigger: "POST /nonconformance-reports/{id}/void"
        actor: QualityEngineer
        preconditions:
          - "NCR.status == DRAFT"
        side_effects:
          - "Release budget: budget_reserved_cents = 0"

      - from: OPEN
        to: VOID
        trigger: "POST /nonconformance-reports/{id}/void"
        actor: QualityManager
        preconditions:
          - "NCR.status == OPEN"
          - "No Capa exists with ncr_id==this"
        side_effects:
          - "Release budget: budget_reserved_cents = 0"
          - "If source==SUPPLIER: decrement Supplier.ncrs_attributed and recompute Supplier.quality_rating"
          - "If source==AUDIT: revert AuditFinding.status NCR_RAISED -> OPEN and clear raised_ncr_id"

  # ---------------------------------------------------------------------------
  - entity: Capa
    initial_state: OPEN
    terminal_states: [CLOSED_EFFECTIVE, CLOSED_INEFFECTIVE]
    transitions:
      - from: OPEN
        to: ROOT_CAUSE
        trigger: "POST /capas/{id}/transition (action=ADVANCE)"
        actor: QualityEngineer
        preconditions:
          - "Capa.status == OPEN"
          - "At least one EightDStep with discipline IN {D1, D2, D3} exists for this CAPA"
        side_effects:
          - "Set current_step = D4"

      - from: ROOT_CAUSE
        to: VERIFICATION
        trigger: "POST /capas/{id}/transition (action=ADVANCE)"
        actor: QualityEngineer
        preconditions:
          - "Capa.status == ROOT_CAUSE"
          - "At least one EightDStep with discipline IN {D4, D5} and containment_count >= 1 exists for this CAPA"
        side_effects:
          - "Set current_step = D6"
          - "Compute provisional_effectiveness (capa_effectiveness calc, provisional variant)"

      - from: VERIFICATION
        to: ROOT_CAUSE
        trigger: "POST /capas/{id}/transition (action=REJECT_VERIFICATION)"
        actor: QualityManager
        preconditions:
          - "Capa.status == VERIFICATION"
          - "The acting QualityManager (X-User-ID) is not the Capa.authored_by_personnel_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Increment rework_loops by 1"
          - "Set current_step = D4"
          - "Clear provisional_effectiveness (set to null)"
        note: "Cyclic edge — verification can loop the CAPA back to root cause for rework."

      - from: VERIFICATION
        to: EFFECTIVENESS_CHECK
        trigger: "POST /capas/{id}/transition (action=VERIFY)"
        actor: QualityManager
        preconditions:
          - "Capa.status == VERIFICATION"
          - "The acting QualityManager (X-User-ID) is not the Capa.authored_by_personnel_id (ERR_SEGREGATION_OF_DUTIES)"
          - "provisional_effectiveness >= 0.50 (ERR_EFFECTIVENESS_TOO_LOW)"
        side_effects:
          - "Set current_step = D7"
          - "Set verified_by_personnel_id = acting Personnel id"

      - from: EFFECTIVENESS_CHECK
        to: CLOSED_EFFECTIVE
        trigger: "POST /capas/{id}/transition (action=CLOSE_EFFECTIVE)"
        actor: QualityManager
        preconditions:
          - "Capa.status == EFFECTIVENESS_CHECK"
          - "At least one EightDStep with discipline==D8 exists for this CAPA"
          - "The acting QualityManager (X-User-ID) is not the Capa.authored_by_personnel_id (ERR_SEGREGATION_OF_DUTIES)"
          - "final_effectiveness >= 0.80 (computed by capa_effectiveness final variant from the D8 step) (ERR_EFFECTIVENESS_TOO_LOW)"
        side_effects:
          - "Set current_step = D8; compute final_effectiveness (capa_effectiveness calc, final variant)"
          - "Cascade: transition parent NCR CAPA_IN_PROGRESS -> CLOSED (releases NCR budget; may cascade to Scar RESOLVED -> Supplier rating)"

      - from: EFFECTIVENESS_CHECK
        to: CLOSED_INEFFECTIVE
        trigger: "POST /capas/{id}/transition (action=CLOSE_INEFFECTIVE)"
        actor: QualityManager
        preconditions:
          - "Capa.status == EFFECTIVENESS_CHECK"
          - "At least one EightDStep with discipline==D8 exists for this CAPA"
          - "The acting QualityManager (X-User-ID) is not the Capa.authored_by_personnel_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set current_step = D8; compute final_effectiveness (capa_effectiveness calc, final variant)"
          - "Parent NCR remains in CAPA_IN_PROGRESS (no cascade to CLOSED)"
        note: "Branch sibling of close — divergent side-effect set (no NCR cascade)."

  # ---------------------------------------------------------------------------
  - entity: Scar
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: ACK
        trigger: "POST /scars/{id}/transition (action=ACKNOWLEDGE)"
        actor: SupplierUser
        preconditions:
          - "Scar.status == OPEN"
          - "The acting SupplierUser (X-User-ID) == Scar.supplier_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: ACK
        to: RESPONDED
        trigger: "POST /scars/{id}/transition (action=RESPOND)"
        actor: SupplierUser
        preconditions:
          - "Scar.status == ACK"
          - "The acting SupplierUser (X-User-ID) == Scar.supplier_id (ERR_NOT_RESOURCE_OWNER)"
          - "response_narrative is present and non-empty"
        side_effects: []

      - from: RESPONDED
        to: ACCEPTED_RESPONSE
        trigger: "POST /scars/{id}/transition (action=ACCEPT_RESPONSE)"
        actor: QualityManager
        preconditions:
          - "Scar.status == RESPONDED"
        side_effects: []

      - from: RESPONDED
        to: REJECTED_RESPONSE
        trigger: "POST /scars/{id}/transition (action=REJECT_RESPONSE)"
        actor: QualityManager
        preconditions:
          - "Scar.status == RESPONDED"
        side_effects:
          - "Increment rejection_count by 1"

      - from: REJECTED_RESPONSE
        to: RESPONDED
        trigger: "POST /scars/{id}/transition (action=RESPOND)"
        actor: SupplierUser
        preconditions:
          - "Scar.status == REJECTED_RESPONSE"
          - "The acting SupplierUser (X-User-ID) == Scar.supplier_id (ERR_NOT_RESOURCE_OWNER)"
          - "response_narrative is present and non-empty"
        side_effects: []
        note: "Cyclic edge — a rejected response loops back for a fresh response."

      - from: ACCEPTED_RESPONSE
        to: RESOLVED
        trigger: "system: parent NCR reaches CLOSED (cascade)"
        actor: system
        preconditions:
          - "Scar.status == ACCEPTED_RESPONSE"
          - "The NCR referenced by ncr_id has status==CLOSED"
        side_effects:
          - "Decrement Supplier.open_scar_count and recompute Supplier.quality_rating (supplier_quality_rating calc)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /scars/{id}/transition (action=CANCEL)"
        actor: QualityManager
        preconditions:
          - "Scar.status == OPEN"
        side_effects:
          - "Decrement Supplier.open_scar_count and recompute Supplier.quality_rating"

  # ---------------------------------------------------------------------------
  - entity: InspectionLot
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: IN_INSPECTION
        trigger: "POST /inspection-lots/{id}/transition (action=START)"
        actor: Inspector
        preconditions:
          - "InspectionLot.status == PENDING"
          - "The linked InspectionPlan exists"
        side_effects:
          - "Resolve and freeze sample_size, acceptance_number, rejection_number from the plan's aql_pct, lot_size code letter, and current severity_mode (aql_sampling calc); set rejection_number = acceptance_number + 1"
          - "Set severity_mode_used = plan.severity_mode snapshot"

      - from: IN_INSPECTION
        to: ACCEPTED
        trigger: "POST /inspection-lots/{id}/transition (action=DISPOSITION)"
        actor: Inspector
        preconditions:
          - "InspectionLot.status == IN_INSPECTION"
          - "defects_found <= acceptance_number (boundary: == Ac accepts)"
        side_effects:
          - "Increment Supplier.lots_inspected"
          - "Reset InspectionPlan.consecutive_rejects = 0"
          - "Recompute Supplier.quality_rating (supplier_quality_rating calc)"

      - from: IN_INSPECTION
        to: REJECTED
        trigger: "POST /inspection-lots/{id}/transition (action=DISPOSITION)"
        actor: Inspector
        preconditions:
          - "InspectionLot.status == IN_INSPECTION"
          - "defects_found >= rejection_number (boundary: == Ac+1 rejects)"
        side_effects:
          - "Increment Supplier.lots_inspected and Supplier.lots_rejected"
          - "Increment InspectionPlan.consecutive_rejects; if it reaches 2, set InspectionPlan.severity_mode = TIGHTENED"
          - "Recompute Supplier.quality_rating (supplier_quality_rating calc)"

  # ---------------------------------------------------------------------------
  - entity: Audit
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /audits/{id}/transition (action=START)"
        actor: Auditor
        preconditions:
          - "Audit.status == PLANNED"
          - "The acting Auditor (X-User-ID) == Audit.lead_auditor_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /audits/{id}/transition (action=CLOSE)"
        actor: Auditor
        preconditions:
          - "Audit.status == IN_PROGRESS"
          - "The acting Auditor (X-User-ID) == Audit.lead_auditor_id (ERR_NOT_RESOURCE_OWNER)"
          - "open_finding_count == 0 — every AuditFinding for this audit has status IN {CLOSED, VOID} (ERR_AUDIT_HAS_OPEN_FINDINGS)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: NCR_RAISED
        trigger: "system: NCR opened with source=AUDIT and audit_finding_id==this (NCR DRAFT->OPEN)"
        actor: system
        preconditions:
          - "AuditFinding.status == OPEN"
        side_effects:
          - "Set raised_ncr_id to the opening NCR.id; increment parent Audit.open_finding_count is unchanged (NCR_RAISED still counts as open)"

      - from: NCR_RAISED
        to: CLOSED
        trigger: "POST /audit-findings/{id}/transition (action=CLOSE)"
        actor: Auditor
        preconditions:
          - "AuditFinding.status == NCR_RAISED"
          - "The NCR referenced by raised_ncr_id has status==CLOSED (ERR_FINDING_NCR_OPEN)"
        side_effects:
          - "Decrement parent Audit.open_finding_count"

      - from: OPEN
        to: CLOSED
        trigger: "POST /audit-findings/{id}/transition (action=CLOSE)"
        actor: Auditor
        preconditions:
          - "AuditFinding.status == OPEN"
          - "grade == OBSERVATION (only observations may close without an NCR) (ERR_FINDING_REQUIRES_NCR)"
        side_effects:
          - "Decrement parent Audit.open_finding_count"

      - from: OPEN
        to: VOID
        trigger: "POST /audit-findings/{id}/transition (action=VOID)"
        actor: Auditor
        preconditions:
          - "AuditFinding.status == OPEN"
        side_effects:
          - "Decrement parent Audit.open_finding_count"

  # ---------------------------------------------------------------------------
  - entity: Deviation
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXPIRED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /deviations/{id}/transition (action=APPROVE)"
        actor: QualityManager
        preconditions:
          - "Deviation.status == REQUESTED"
          - "No other Deviation with status==APPROVED exists for the same (supplier_id, part_number) whose [valid_from, valid_to) half-open window overlaps this one (ERR_DEVIATION_OVERLAP)"
        side_effects:
          - "Set approved_by_personnel_id = acting Personnel id"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /deviations/{id}/transition (action=REJECT)"
        actor: QualityManager
        preconditions:
          - "Deviation.status == REQUESTED"
        side_effects: []

      - from: APPROVED
        to: REVOKED
        trigger: "POST /deviations/{id}/transition (action=REVOKE)"
        actor: QualityManager
        preconditions:
          - "Deviation.status == APPROVED"
        side_effects:
          - "If any NCR has deviation_id==this and disposition==USE_AS_IS and status not IN {CLOSED, VOID}, the revoke is rejected (ERR_DEVIATION_IN_USE)"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (system sweep at clock set)"
        actor: system
        preconditions:
          - "Deviation.status == APPROVED"
          - "server clock >= valid_to"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: ControlPlanRevision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /control-plan-revisions/{id}/approve"
        actor: QualityManager
        preconditions:
          - "ControlPlanRevision.status == DRAFT"
          - "revision_no == parent ControlPlan.current_revision_no + 1 (ERR_REVISION_SEQUENCE)"
        side_effects:
          - "Set parent ControlPlan.current_revision_no = revision_no"
          - "Cascade: every InspectionPlan with control_plan_id==parent gets needs_review = true"
          - "Set any prior APPROVED ControlPlanRevision for the same plan to SUPERSEDED"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a newer ControlPlanRevision for the same plan is APPROVED"
        actor: system
        preconditions:
          - "ControlPlanRevision.status == APPROVED"
          - "A ControlPlanRevision with a higher revision_no for the same control_plan_id reached APPROVED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: revision-create-stale-control-plan
    parent_entity: ControlPlan
    write_endpoint: "POST /control-plan-revisions"
    occ_field: "expected_control_plan_version"
    description: |
      Creating a ControlPlanRevision against a ControlPlan whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. The product allows a freshly created DRAFT revision to legitimately
      supersede a prior DRAFT for the same plan, so a second create that still
      carries the version the client first read would otherwise succeed against a
      plan that has already moved on; OCC on ControlPlan.version reduces this to a
      deterministic stale-version check observable from two strictly sequential
      requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---------------------------------------------------------------------------
  - name: aql_sampling
    trigger: "InspectionLot PENDING -> IN_INSPECTION (POST /inspection-lots/{id}/transition (action=START))"
    algorithm: threshold
    formula: |
      # Resolve the ANSI/ASQ Z1.4-style sample-size code letter from the plan's
      # inspection_level and lot_size band, then resolve (sample_size n,
      # acceptance_number Ac) from the (code_letter, aql_column) cell. The scaffold
      # pins a reduced lookup table in `constants`; the implementation MUST use it
      # verbatim. The code letter is fixed by (inspection_level, lot_size); the AQL
      # COLUMN used depends on severity_mode (NORMAL uses aql_pct; TIGHTENED steps
      # one column tighter), per the dual variant below.
      code_letter = code_letter_for(inspection_level, lot_size)   # see CODE_LETTER_BANDS
      aql_column  = (severity_mode == TIGHTENED) ? next_tighter(aql_pct) : aql_pct
      cell        = LOOKUP[(code_letter, aql_column)]             # {n, Ac}
      sample_size       = cell.n
      acceptance_number = cell.Ac
      rejection_number  = acceptance_number + 1
      # next_tighter steps to the previous column among the table's listed columns
      # [1.0, 2.5, 4.0]: next_tighter(4.0)=2.5, next_tighter(2.5)=1.0, next_tighter(1.0)=1.0.
    input_set: "The single InspectionPlan referenced by the lot; severity_mode read at start time. lot_size used for the code letter is the PLAN's lot_size (nominal), not the lot's actual_lot_size."
    constants:
      CODE_LETTER_BANDS: |
        inspection_level=GII (general level II):
          lot_size   2..8     -> A
          lot_size   9..15    -> B
          lot_size  16..25    -> C
          lot_size  26..50    -> D
          lot_size  51..90    -> E
          lot_size  91..150   -> F
          lot_size 151..280   -> G
          lot_size 281..500   -> H
        GI = one code letter LESS strict than GII (shift the band result one letter EARLIER, clamped at A);
        GIII = one code letter MORE strict than GII (shift one letter LATER, clamped at H).
      AQL_COLUMN_ORDER: "[1.0, 2.5, 4.0]  (tightest -> loosest among the listed columns)"
      LOOKUP: |
        (code_letter, aql_column) -> {n, Ac}   # reduced ANSI/ASQ Z1.4 single-sampling table
        (D, 1.0)->{n:8,  Ac:0}    (E, 1.0)->{n:13, Ac:0}    (F, 1.0)->{n:20, Ac:0}
        (G, 1.0)->{n:32, Ac:1}    (H, 1.0)->{n:50, Ac:1}
        (D, 2.5)->{n:8,  Ac:0}    (E, 2.5)->{n:13, Ac:1}    (F, 2.5)->{n:20, Ac:1}
        (G, 2.5)->{n:32, Ac:2}    (H, 2.5)->{n:50, Ac:3}
        (D, 4.0)->{n:8,  Ac:1}    (E, 4.0)->{n:13, Ac:1}    (F, 4.0)->{n:20, Ac:2}
        (G, 4.0)->{n:32, Ac:3}    (H, 4.0)->{n:50, Ac:5}
    precision: "integers; no rounding (counts only)"
    variants:
      - name: normal_inspection
        when: "InspectionPlan.severity_mode == NORMAL at lot start"
        difference: "Use the (code_letter, aql_pct) cell as-is from LOOKUP."
      - name: tightened_inspection
        when: "InspectionPlan.severity_mode == TIGHTENED at lot start (after 2 consecutive REJECTED lots on the plan)"
        difference: "Keep the same code letter (n unchanged) but read the next-tighter AQL column, yielding a smaller-or-equal Ac, so the same defects_found can flip ACCEPTED->REJECTED versus normal mode. Example: plan lot_size=120 (letter F), aql_pct=4.0: NORMAL cell (F,4.0)={n:20,Ac:2}; TIGHTENED cell (F,2.5)={n:20,Ac:1}; with defects_found=2, NORMAL accepts (2<=2) and TIGHTENED rejects (2>=2)."

  # ---------------------------------------------------------------------------
  - name: ncr_cost_of_quality
    trigger: "NonconformanceReport OPEN -> DISPOSITIONED (POST /nonconformance-reports/{id}/disposition)"
    algorithm: aggregation
    formula: |
      # Per-unit cost is computed per line then summed, NOT summed-then-rounded.
      # The scaffold PINS the order: compute each unit's cents (already integer:
      # labour is rounded to whole cents per unit), then sum across defect_qty.
      labour_cents_per_unit = round_half_up(rework_hours * LABOUR_RATE_CENTS_PER_HOUR)   # per-unit rounding FIRST
      branch by disposition:
        REWORK:            unit_cost_component = labour_cents_per_unit                 # scrap not incurred; rework labour only
        SCRAP:             unit_cost_component = unit_cost_cents                        # full unit value lost, no labour
        USE_AS_IS:         unit_cost_component = round_half_up(unit_cost_cents * USE_AS_IS_CONCESSION_PCT)  # concession write-down
        RETURN_TO_SUPPLIER: unit_cost_component = round_half_up(unit_cost_cents * HANDLING_PCT)             # handling/freight only
      severity_multiplier = SEVERITY_WEIGHT[severity]
      cost_of_quality_cents = sum over defect_qty units of
                                round_half_up(unit_cost_component * severity_multiplier)   # round per line, THEN sum
    input_set: "Single NCR; defect_qty units, all identical, so the sum is defect_qty * the per-line rounded value."
    constants:
      LABOUR_RATE_CENTS_PER_HOUR: 6000
      USE_AS_IS_CONCESSION_PCT: 0.30
      HANDLING_PCT: 0.10
      SEVERITY_WEIGHT: "{ CRITICAL: 1.5, MAJOR: 1.0, MINOR: 0.5 }"
    precision: "integer cents; round_half_up at each pinned step; round-per-line THEN sum (NOT sum-then-round)"

  # ---------------------------------------------------------------------------
  - name: supplier_quality_rating
    trigger: "InspectionLot disposition, Scar resolve/cancel, NCR open/void with source=SUPPLIER"
    algorithm: weighted_scoring
    formula: |
      # Three weighted factors, each clamped to [0,1], combined then scaled to 0..100.
      # Non-linear: an open-SCAR penalty caps the lot/ncr factors via min().
      lot_factor = (lots_inspected == 0) ? 1.0
                   : max(0.0, 1.0 - (lots_rejected / lots_inspected))
      ncr_factor = max(0.0, 1.0 - (ncrs_attributed * NCR_PENALTY))
      scar_penalty = min(SCAR_PENALTY_CAP, open_scar_count * SCAR_PENALTY_STEP)
      base = (W_LOT * lot_factor) + (W_NCR * ncr_factor)        # W_LOT + W_NCR == 1.0
      raw  = max(0.0, base - scar_penalty)
      quality_rating = round_half_up(raw * 100, 2)              # two decimals
      # approval_status threshold band (computed alongside):
      approval_status = (quality_rating >= APPROVE_AT) ? APPROVED
                        : (quality_rating >= PROBATION_AT) ? PROBATION
                        : DISQUALIFIED
    input_set: "Supplier's own computed counters: lots_inspected, lots_rejected, ncrs_attributed, open_scar_count."
    constants:
      W_LOT: 0.6
      W_NCR: 0.4
      NCR_PENALTY: 0.10
      SCAR_PENALTY_STEP: 0.05
      SCAR_PENALTY_CAP: 0.20
      APPROVE_AT: 70.00
      PROBATION_AT: 50.00
    precision: "quality_rating: 2 decimal places, round_half_up; approval_status band uses >= (inclusive) at APPROVE_AT and PROBATION_AT"

  # ---------------------------------------------------------------------------
  - name: capa_effectiveness
    trigger: "Capa ROOT_CAUSE->VERIFICATION (provisional) and Capa EFFECTIVENESS_CHECK->CLOSED_* (final)"
    algorithm: weighted_scoring
    formula: |
      # Provisional (at D6 entry): projected from PLANNED containment coverage.
      provisional_effectiveness = round_half_up(
          min(1.0, total_containment_count / max(1, defect_qty_of_parent_ncr)) , 2)
        where total_containment_count = sum of EightDStep.containment_count
              over steps with discipline IN {D4, D5} for this CAPA
      # Final (at D8 closure): measured from REALISED recurrence in the D8 step.
      final_effectiveness = round_half_up(
          1.0 - (recurred_defects_D8 / max(1, defect_qty_of_parent_ncr)) , 2)
        where recurred_defects_D8 = the recurred_defects on the D8 EightDStep
    input_set: "EightDStep rows for this CAPA (D4/D5 for provisional, D8 for final); parent NCR.defect_qty."
    constants: {}
    precision: "2 decimal places, round_half_up; both clamped to [0.00, 1.00]"
    variants:
      - name: provisional
        when: "Computed on ROOT_CAUSE->VERIFICATION; uses PLANNED containment coverage."
        difference: "Forward-looking projection from planned containment_count; gate to enter D7 is >= 0.50."
      - name: final
        when: "Computed on EFFECTIVENESS_CHECK->CLOSED_*; uses MEASURED recurrence."
        difference: "Chronological/measured outcome from the D8 step's recurred_defects; gate to CLOSE_EFFECTIVE is >= 0.80."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role. X-User-ID need not resolve to a persisted entity for genesis/operator calls (POST /personnel, POST /suppliers, POST /_clock/set_current_utc); entity resolution of X-User-ID is enforced only by the ownership (priority 7) and segregation-of-duties (priority 8) checks on the endpoints they name."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every FK in the request body resolves to an existing resource of the correct type"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints carrying FK body fields"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers non-negative where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "Resource ownership: for entity_backed roles acting on owned resources, X-User-ID equals the resource's owner FK (SupplierUser==Scar.supplier_id, Auditor==Audit.lead_auditor_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "SCAR supplier actions, Audit lead-auditor actions"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the acting Personnel (X-User-ID) is not the author/creator of the resource for verify/close/disposition steps that require an independent reviewer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /capas/{id}/transition (action IN {VERIFY, CLOSE_EFFECTIVE, CLOSE_INEFFECTIVE, REJECT_VERIFICATION}); POST /nonconformance-reports/{id}/disposition"

  - priority: 9
    category: business_safety
    check: "Disposition USE_AS_IS requires an APPROVED Deviation for this NCR with max_qty >= defect_qty and clock within [valid_from, valid_to)"
    error_id: ERR_DEVIATION_REQUIRED
    http_status: 409
    applies_to: "POST /nonconformance-reports/{id}/disposition"

  - priority: 10
    category: business_constraint
    check: "Disposition RETURN_TO_SUPPLIER requires NCR.source==SUPPLIER"
    error_id: ERR_DISPOSITION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /nonconformance-reports/{id}/disposition"

  - priority: 11
    category: business_temporal
    check: "Approving a Deviation must not overlap an existing APPROVED Deviation for the same (supplier_id, part_number). Half-open semantics: windows [a.valid_from, a.valid_to) and [b.valid_from, b.valid_to) overlap iff a.valid_from < b.valid_to AND b.valid_from < a.valid_to. Abutting windows (a.valid_to == b.valid_from) do NOT overlap and are allowed."
    error_id: ERR_DEVIATION_OVERLAP
    http_status: 409
    applies_to: "POST /deviations/{id}/transition (action=APPROVE)"

  - priority: 12
    category: business_temporal
    check: "Starting an Audit must not place its closed window [scheduled_from, scheduled_to] within AUDITOR_BUFFER_HOURS=24 of another non-CLOSED (PLANNED or IN_PROGRESS) Audit for the same lead_auditor_id. Buffered-closed semantics: reject iff this.scheduled_from <= other.scheduled_to + 24h AND other.scheduled_from <= this.scheduled_to + 24h (each window expanded by 24h on both sides; touching/abutting windows DO conflict because the 24h buffer is inclusive)."
    error_id: ERR_AUDITOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /audits/{id}/transition (action=START)"

  - priority: 13
    category: business_referential
    check: "Closing an Audit requires open_finding_count==0 (all findings CLOSED or VOID)"
    error_id: ERR_AUDIT_HAS_OPEN_FINDINGS
    http_status: 409
    applies_to: "POST /audits/{id}/transition (action=CLOSE)"

  - priority: 14
    category: business_constraint
    check: "ControlPlanRevision.revision_no on create/approve must equal parent ControlPlan.current_revision_no + 1"
    error_id: ERR_REVISION_SEQUENCE
    http_status: 409
    applies_to: "POST /control-plan-revisions, POST /control-plan-revisions/{id}/approve"

  - priority: 15
    category: business_fiscal
    check: "CAPA verify requires provisional_effectiveness >= 0.50; CAPA close requires final_effectiveness >= 0.80"
    error_id: ERR_EFFECTIVENESS_TOO_LOW
    http_status: 409
    applies_to: "POST /capas/{id}/transition (action=VERIFY), POST /capas/{id}/transition (action=CLOSE_EFFECTIVE)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Personnel (actor registry) ----
  - method: POST
    path: "/personnel"
    description: "Register a Personnel actor"
    roles: [QualityManager]
    code: 201
    input: [full_name, email, role]
    output: Personnel
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/personnel/{id}"
    description: "Get a Personnel"
    roles: [QualityManager, QualityEngineer, Inspector, Auditor]
    code: 200
    input: []
    output: Personnel
    side_effects: []

  # ---- Supplier ----
  - method: POST
    path: "/suppliers"
    description: "Create a Supplier"
    roles: [QualityManager]
    code: 201
    input: [name, code]
    output: Supplier
    side_effects: ["quality_rating=100.00, approval_status=APPROVED, all counters=0"]

  - method: GET
    path: "/suppliers/{id}"
    description: "Get a Supplier (includes computed quality_rating and counters)"
    roles: [QualityManager, QualityEngineer, Inspector, SupplierUser]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/suppliers/{id}/scars"
    description: "List SCARs for a supplier (reverse-reachability for Scar.supplier_id)"
    roles: [QualityManager, SupplierUser]
    code: 200
    input: ["limit?", "offset?"]
    output: Scar[]
    side_effects: []

  - method: GET
    path: "/suppliers/{id}/inspection-lots"
    description: "List InspectionLots for a supplier (reverse-reachability for InspectionLot.supplier_id)"
    roles: [QualityManager, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: InspectionLot[]
    side_effects: []

  - method: GET
    path: "/suppliers/{id}/deviations"
    description: "List Deviations for a supplier (reverse-reachability for Deviation.supplier_id)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Deviation[]
    side_effects: []

  # ---- NonconformanceReport ----
  - method: POST
    path: "/nonconformance-reports"
    description: "Create an NCR in DRAFT"
    roles: [QualityEngineer]
    code: 201
    input: [title, source, severity, defect_qty, unit_cost_cents, part_number, "supplier_id?", "audit_finding_id?", "inspection_lot_id?", "rework_hours?"]
    output: NonconformanceReport
    side_effects: ["status=DRAFT", "created_by_personnel_id = X-User-ID", "budget_reserved_cents=0"]

  - method: GET
    path: "/nonconformance-reports/{id}"
    description: "Get an NCR (includes computed cost_of_quality_cents)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: []
    output: NonconformanceReport
    side_effects: []

  - method: GET
    path: "/nonconformance-reports"
    description: "List NCRs (filterable by supplier_id and audit_finding_id; reverse-reachability for those FKs)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["supplier_id?", "audit_finding_id?", "inspection_lot_id?", "limit?", "offset?"]
    output: NonconformanceReport[]
    side_effects: []

  - method: POST
    path: "/nonconformance-reports/{id}/open"
    description: "Open an NCR (DRAFT->OPEN); reserves budget, updates supplier/finding"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: NonconformanceReport
    side_effects: ["status=OPEN", "reserve budget", "supplier_quality_rating recompute if source=SUPPLIER", "AuditFinding->NCR_RAISED if source=AUDIT"]

  - method: POST
    path: "/nonconformance-reports/{id}/disposition"
    description: "Disposition an OPEN NCR (OPEN->DISPOSITIONED); branch by disposition"
    roles: [QualityManager]
    code: 200
    input: [disposition]
    output: NonconformanceReport
    side_effects: ["set disposition", "ncr_cost_of_quality recompute", "re-reserve budget", "set deviation_id if USE_AS_IS"]

  - method: POST
    path: "/nonconformance-reports/{id}/void"
    description: "Void an NCR (DRAFT->VOID or OPEN->VOID); releases budget"
    roles: [QualityEngineer, QualityManager]
    code: 200
    input: []
    output: NonconformanceReport
    side_effects: ["status=VOID", "release budget", "revert supplier/finding side effects"]

  # ---- Capa ----
  - method: POST
    path: "/capas"
    description: "Open a CAPA against a DISPOSITIONED NCR; auto-advances NCR to CAPA_IN_PROGRESS on first CAPA"
    roles: [QualityEngineer]
    code: 201
    input: [ncr_id, title]
    output: Capa
    side_effects: ["status=OPEN, current_step=D1", "authored_by_personnel_id = X-User-ID", "NCR DISPOSITIONED->CAPA_IN_PROGRESS (first CAPA)"]

  - method: GET
    path: "/capas/{id}"
    description: "Get a CAPA (includes provisional/final effectiveness)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: []
    output: Capa
    side_effects: []

  - method: GET
    path: "/nonconformance-reports/{id}/capas"
    description: "List CAPAs for an NCR (reverse-reachability for Capa.ncr_id)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Capa[]
    side_effects: []

  - method: GET
    path: "/nonconformance-reports/{id}/scars"
    description: "List SCARs for an NCR (reverse-reachability for Scar.ncr_id)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Scar[]
    side_effects: []

  - method: POST
    path: "/capas/{id}/steps"
    description: "Record an 8D step (D1..D8) on a CAPA"
    roles: [QualityEngineer, QualityManager]
    code: 201
    input: [discipline, narrative, "containment_count?", "recurred_defects?"]
    output: EightDStep
    side_effects: ["recorded_by_personnel_id = X-User-ID"]

  - method: GET
    path: "/capas/{id}/steps"
    description: "List 8D steps for a CAPA (reverse-reachability for EightDStep.capa_id)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: EightDStep[]
    side_effects: []

  - method: POST
    path: "/capas/{id}/transition"
    description: "Drive the CAPA state machine. action=ADVANCE (QualityEngineer: OPEN->ROOT_CAUSE or ROOT_CAUSE->VERIFICATION, computes provisional_effectiveness on entering VERIFICATION); action=REJECT_VERIFICATION (QualityManager: VERIFICATION->ROOT_CAUSE cyclic rework, SoD); action=VERIFY (QualityManager: VERIFICATION->EFFECTIVENESS_CHECK, requires provisional>=0.50, SoD); action=CLOSE_EFFECTIVE (QualityManager: EFFECTIVENESS_CHECK->CLOSED_EFFECTIVE, requires final>=0.80, SoD, cascades NCR->CLOSED); action=CLOSE_INEFFECTIVE (QualityManager: EFFECTIVENESS_CHECK->CLOSED_INEFFECTIVE, SoD, no NCR cascade)"
    roles: [QualityEngineer, QualityManager]
    code: 200
    input: [action]
    output: Capa
    side_effects: ["per action: set current_step / rework_loops / provisional_effectiveness / final_effectiveness", "CLOSE_EFFECTIVE cascades NCR CAPA_IN_PROGRESS->CLOSED (may cascade Scar->RESOLVED and supplier rating)"]

  # ---- Scar ----
  - method: POST
    path: "/scars"
    description: "Open a SCAR against a supplier-attributed NCR"
    roles: [QualityManager]
    code: 201
    input: [ncr_id, supplier_id, due_at]
    output: Scar
    side_effects: ["status=OPEN", "increment Supplier.open_scar_count", "recompute supplier_quality_rating"]

  - method: GET
    path: "/scars/{id}"
    description: "Get a SCAR"
    roles: [QualityManager, SupplierUser]
    code: 200
    input: []
    output: Scar
    side_effects: []

  - method: POST
    path: "/scars/{id}/transition"
    description: "Drive the SCAR state machine. action=ACKNOWLEDGE (SupplierUser, owner: OPEN->ACK); action=RESPOND (SupplierUser, owner: ACK->RESPONDED or REJECTED_RESPONSE->RESPONDED, requires response_narrative); action=ACCEPT_RESPONSE (QualityManager: RESPONDED->ACCEPTED_RESPONSE); action=REJECT_RESPONSE (QualityManager: RESPONDED->REJECTED_RESPONSE, increments rejection_count); action=CANCEL (QualityManager: OPEN->CANCELLED, decrements open_scar_count)"
    roles: [SupplierUser, QualityManager]
    code: 200
    input: [action, "response_narrative?"]
    output: Scar
    side_effects: ["per action: rejection_count / open_scar_count decrement + supplier_quality_rating recompute on CANCEL"]

  # ---- ControlPlan / ControlPlanRevision ----
  - method: POST
    path: "/control-plans"
    description: "Create a ControlPlan"
    roles: [QualityManager]
    code: 201
    input: [name, part_number]
    output: ControlPlan
    side_effects: ["status=ACTIVE, current_revision_no=0"]

  - method: GET
    path: "/control-plans/{id}"
    description: "Get a ControlPlan"
    roles: [QualityManager, QualityEngineer, Inspector]
    code: 200
    input: []
    output: ControlPlan
    side_effects: []

  - method: POST
    path: "/control-plan-revisions"
    description: "Create a DRAFT ControlPlanRevision (OCC on ControlPlan.version)"
    roles: [QualityEngineer]
    code: 201
    input: [control_plan_id, revision_no, change_summary, expected_control_plan_version, "source_capa_id?"]
    output: ControlPlanRevision
    side_effects: ["status=DRAFT", "increments ControlPlan.version by 1"]

  - method: GET
    path: "/control-plans/{id}/revisions"
    description: "List revisions for a control plan (reverse-reachability for ControlPlanRevision.control_plan_id)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: ControlPlanRevision[]
    side_effects: []

  - method: POST
    path: "/control-plan-revisions/{id}/approve"
    description: "Approve a revision (DRAFT->APPROVED); bumps current_revision_no, flags inspection plans, supersedes prior"
    roles: [QualityManager]
    code: 200
    input: []
    output: ControlPlanRevision
    side_effects: ["ControlPlan.current_revision_no=revision_no", "cascade InspectionPlan.needs_review=true", "prior APPROVED revision->SUPERSEDED"]

  # ---- InspectionPlan / InspectionLot ----
  - method: POST
    path: "/inspection-plans"
    description: "Create an InspectionPlan"
    roles: [QualityManager]
    code: 201
    input: [name, control_plan_id, part_number, lot_size, aql_pct, "inspection_level?"]
    output: InspectionPlan
    side_effects: ["severity_mode=NORMAL, consecutive_rejects=0, needs_review=false"]

  - method: GET
    path: "/inspection-plans/{id}"
    description: "Get an InspectionPlan"
    roles: [QualityManager, Inspector]
    code: 200
    input: []
    output: InspectionPlan
    side_effects: []

  - method: GET
    path: "/control-plans/{id}/inspection-plans"
    description: "List inspection plans for a control plan (reverse-reachability for InspectionPlan.control_plan_id)"
    roles: [QualityManager, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: InspectionPlan[]
    side_effects: []

  - method: POST
    path: "/inspection-lots"
    description: "Create an InspectionLot (PENDING)"
    roles: [Inspector]
    code: 201
    input: [inspection_plan_id, supplier_id, actual_lot_size]
    output: InspectionLot
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/inspection-lots/{id}"
    description: "Get an InspectionLot (includes resolved sample_size, acceptance_number)"
    roles: [QualityManager, Inspector]
    code: 200
    input: []
    output: InspectionLot
    side_effects: []

  - method: GET
    path: "/inspection-plans/{id}/inspection-lots"
    description: "List lots for an inspection plan (reverse-reachability for InspectionLot.inspection_plan_id)"
    roles: [QualityManager, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: InspectionLot[]
    side_effects: []

  - method: POST
    path: "/inspection-lots/{id}/transition"
    description: "Drive the InspectionLot state machine (Inspector). action=START (PENDING->IN_INSPECTION, runs aql_sampling to freeze sample_size/acceptance_number/rejection_number and severity_mode_used); action=DISPOSITION (IN_INSPECTION->ACCEPTED if defects_found<=Ac else REJECTED, requires defects_found, updates supplier counters+rating, tightening switch at 2 consecutive rejects)"
    roles: [Inspector]
    code: 200
    input: [action, "defects_found?"]
    output: InspectionLot
    side_effects: ["START: aql_sampling freezes sampling numbers", "DISPOSITION: ACCEPT/REJECT, supplier counter+rating recompute, NORMAL->TIGHTENED at 2 consecutive rejects"]

  # ---- Audit / AuditFinding ----
  - method: POST
    path: "/audits"
    description: "Create an Audit (PLANNED)"
    roles: [Auditor]
    code: 201
    input: [title, lead_auditor_id, scheduled_from, scheduled_to, "clause_scope?"]
    output: Audit
    side_effects: ["status=PLANNED, open_finding_count=0"]

  - method: GET
    path: "/audits/{id}"
    description: "Get an Audit"
    roles: [QualityManager, Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: []

  - method: POST
    path: "/audits/{id}/transition"
    description: "Drive the Audit state machine (lead-auditor only). action=START (PLANNED->IN_PROGRESS, auditor double-booking check); action=CLOSE (IN_PROGRESS->CLOSED, requires open_finding_count==0)"
    roles: [Auditor]
    code: 200
    input: [action]
    output: Audit
    side_effects: ["START: auditor-overlap validation", "CLOSE: requires no open findings"]

  - method: POST
    path: "/audits/{id}/findings"
    description: "Record an AuditFinding"
    roles: [Auditor]
    code: 201
    input: [clause, grade, description]
    output: AuditFinding
    side_effects: ["status=OPEN", "increment Audit.open_finding_count"]

  - method: GET
    path: "/audit-findings/{id}"
    description: "Get an AuditFinding"
    roles: [QualityManager, Auditor, QualityEngineer]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: GET
    path: "/audits/{id}/findings"
    description: "List findings for an audit (reverse-reachability for AuditFinding.audit_id)"
    roles: [QualityManager, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: POST
    path: "/audit-findings/{id}/transition"
    description: "Drive the AuditFinding state machine. action=CLOSE (NCR_RAISED->CLOSED requires escalated NCR CLOSED; OPEN->CLOSED only for grade==OBSERVATION); action=VOID (OPEN->VOID)"
    roles: [Auditor]
    code: 200
    input: [action]
    output: AuditFinding
    side_effects: ["decrement Audit.open_finding_count"]

  # ---- Deviation ----
  - method: POST
    path: "/deviations"
    description: "Request a Deviation/waiver for an NCR (REQUESTED)"
    roles: [QualityEngineer]
    code: 201
    input: [ncr_id, supplier_id, part_number, valid_from, valid_to, max_qty]
    output: Deviation
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/deviations/{id}"
    description: "Get a Deviation"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: []
    output: Deviation
    side_effects: []

  - method: GET
    path: "/nonconformance-reports/{id}/deviations"
    description: "List deviations for an NCR (reverse-reachability for Deviation.ncr_id)"
    roles: [QualityManager, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: Deviation[]
    side_effects: []

  - method: POST
    path: "/deviations/{id}/transition"
    description: "Drive the Deviation state machine (QualityManager). action=APPROVE (REQUESTED->APPROVED, overlap check, sets approved_by_personnel_id); action=REJECT (REQUESTED->REJECTED); action=REVOKE (APPROVED->REVOKED, blocked if bound to a live USE_AS_IS NCR)"
    roles: [QualityManager]
    code: 200
    input: [action]
    output: Deviation
    side_effects: ["APPROVE: overlap validation + set approved_by_personnel_id", "REVOKE: ERR_DEVIATION_IN_USE if bound to live USE_AS_IS NCR"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock; sweeps APPROVED Deviations past valid_to to EXPIRED"
    roles: [QualityManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set", "APPROVED Deviations with clock>=valid_to -> EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE,         http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND,              http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND,           http: 404, condition: "Body foreign key does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST,        http: 400, condition: "Malformed body: missing required field, enum out of range, negative where constrained" }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_NOT_RESOURCE_OWNER,     http: 403, condition: "entity_backed actor's X-User-ID is not the owner FK of the resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES,  http: 403, condition: "Acting Personnel is the author/creator and may not perform this independent-reviewer step" }
  - { id: ERR_DEVIATION_REQUIRED,     http: 409, condition: "USE_AS_IS disposition without an APPROVED, in-window Deviation of sufficient max_qty" }
  - { id: ERR_DISPOSITION_NOT_ALLOWED,http: 409, condition: "RETURN_TO_SUPPLIER disposition on a non-SUPPLIER NCR" }
  - { id: ERR_DEVIATION_OVERLAP,      http: 409, condition: "Approving a Deviation that overlaps an existing APPROVED window for same (supplier_id, part_number)" }
  - { id: ERR_DEVIATION_IN_USE,       http: 409, condition: "Revoking a Deviation still bound to a live USE_AS_IS NCR" }
  - { id: ERR_AUDITOR_DOUBLE_BOOKED,  http: 409, condition: "Starting an audit whose window collides (within buffer) with another non-CLOSED audit of the same lead auditor" }
  - { id: ERR_AUDIT_HAS_OPEN_FINDINGS,http: 409, condition: "Closing an audit with open_finding_count > 0" }
  - { id: ERR_FINDING_NCR_OPEN,       http: 409, condition: "Closing an NCR_RAISED finding whose escalated NCR is not yet CLOSED" }
  - { id: ERR_FINDING_REQUIRES_NCR,   http: 409, condition: "Closing a non-OBSERVATION finding directly from OPEN without an NCR" }
  - { id: ERR_REVISION_SEQUENCE,      http: 409, condition: "revision_no is not parent ControlPlan.current_revision_no + 1" }
  - { id: ERR_EFFECTIVENESS_TOO_LOW,  http: 409, condition: "CAPA verify with provisional<0.50 or close with final<0.80" }
  - { id: ERR_STALE_VERSION,          http: 412, condition: "expected_control_plan_version does not match current ControlPlan.version" }
  - { id: ERR_NCR_HAS_CAPA,           http: 409, condition: "Voiding an OPEN NCR that already has a CAPA" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: QualityEngineer
    description: "Raises NCRs, opens CAPAs, records 8D steps, advances CAPAs, requests deviations and drafts control-plan revisions. Cannot disposition, verify, or close its own CAPAs (SoD)."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /nonconformance-reports — raise NCR"
      - "POST /nonconformance-reports/{id}/open — open NCR"
      - "POST /capas — open CAPA"
      - "POST /capas/{id}/advance — advance CAPA"
      - "POST /deviations — request deviation"
      - "POST /control-plan-revisions — draft control-plan revision"
    shared_operations:
      - "POST /nonconformance-reports/{id}/void — void NCR (with QualityManager)"
      - "POST /capas/{id}/steps — record 8D step (with QualityManager)"
      - "GET endpoints on NCRs, CAPAs, steps, deviations, control plans, suppliers, personnel"

  - name: QualityManager
    description: "Independent reviewer: dispositions NCRs, verifies/closes CAPAs, manages SCAR lifecycle review, approves deviations and control-plan revisions, registers suppliers/personnel. Bound by SoD against CAPA/NCR authorship."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /personnel — register personnel"
      - "POST /suppliers — create supplier"
      - "POST /nonconformance-reports/{id}/disposition — disposition NCR"
      - "POST /capas/{id}/verify — verify CAPA"
      - "POST /capas/{id}/reject-verification — reject verification"
      - "POST /capas/{id}/close — close CAPA effective"
      - "POST /capas/{id}/close-ineffective — close CAPA ineffective"
      - "POST /scars — open SCAR"
      - "POST /scars/{id}/accept-response, /reject-response, /cancel — SCAR review"
      - "POST /control-plans — create control plan"
      - "POST /control-plan-revisions/{id}/approve — approve revision"
      - "POST /inspection-plans — create inspection plan"
      - "POST /deviations/{id}/approve, /reject, /revoke — deviation decisions"
      - "POST /_clock/set_current_utc — set clock"
    shared_operations:
      - "POST /nonconformance-reports/{id}/void — void NCR (with QualityEngineer)"
      - "POST /capas/{id}/steps — record 8D step (with QualityEngineer)"
      - "GET endpoints across the system"

  - name: Inspector
    description: "Runs inspection lots: creates lots, starts inspection (resolving AQL numbers), and dispositions accept/reject."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /inspection-lots — create lot"
      - "POST /inspection-lots/{id}/start — start inspection"
      - "POST /inspection-lots/{id}/disposition — accept/reject lot"
    shared_operations:
      - "GET endpoints on inspection plans, lots, suppliers, control plans"

  - name: Auditor
    description: "Conducts ISO 9001 audits: creates/starts/closes audits, records findings, and closes/voids findings. Acts only as the lead auditor of its own audits."
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /audits — create audit"
      - "POST /audits/{id}/start — start audit"
      - "POST /audits/{id}/close — close audit"
      - "POST /audits/{id}/findings — record finding"
      - "POST /audit-findings/{id}/close — close finding"
      - "POST /audit-findings/{id}/void — void finding"
    shared_operations:
      - "GET endpoints on audits, findings"

  - name: SupplierUser
    description: "Acts as a single Supplier; acknowledges and responds to SCARs addressed to that supplier only."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /scars/{id}/acknowledge — acknowledge SCAR"
      - "POST /scars/{id}/respond — respond to SCAR"
    shared_operations:
      - "GET /scars/{id}, GET /suppliers/{id}, GET /suppliers/{id}/scars (own supplier only)"
