            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${facB}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { auB: $.data.id } }
