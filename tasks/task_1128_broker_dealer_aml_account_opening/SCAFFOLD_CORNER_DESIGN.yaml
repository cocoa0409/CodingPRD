  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any existence or state check — sent against a non-existent account id to prove auth runs first."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep V1", crd_number: "CRD-V01" }, as: SystemAdmin }
          trigger:
            - { call: "GET /aml/accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth beats 404)"

      - name: existence_checked_before_state_on_reverse
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_TRANSACTION_NOT_FOUND]"]
        distinguishing_aspect: "Reversing a non-existent transaction id returns 404 ERR_TRANSACTION_NOT_FOUND, not a state error — existence (priority 4) precedes state (priority 6)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /aml/reps", payload: { full_name: "Rep V2", crd_number: "CRD-V02" }, as: SystemAdmin }
          trigger:
            - { call: "POST /aml/transactions/00000000-0000-0000-0000-000000000000/reverse", payload: { reason: "ghost" }, as: OperationsAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_TRANSACTION_NOT_FOUND"
            - "HTTP status == 404"

      - name: edd_invalid_date_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "period_start == period_end (empty half-open interval) is rejected ERR_INVALID_DATE_RANGE (400)."
        test_recipe:
          setup: ["Rep + customer + account exist (any state)."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep V3", crd_number: "CRD-V03" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "V3", tax_id: "TIN-V03", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
