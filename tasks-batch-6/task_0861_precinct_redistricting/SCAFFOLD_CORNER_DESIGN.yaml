            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
            - call: "POST /plans/${pid}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${pid}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
