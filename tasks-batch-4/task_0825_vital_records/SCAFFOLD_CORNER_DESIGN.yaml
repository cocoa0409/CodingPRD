              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_STALE_EVENT_VERSION"

      - name: amend_approve_stale_event_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amend-approve-stale-event]
          - errors[ERR_STALE_EVENT_VERSION]
        distinguishing_aspect: "After approving amendment am1 (which bumps VitalEvent.version), approving am2 with the pre-approval expected_vital_event_version is stale -> ERR_STALE_EVENT_VERSION (412)."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-58 with two SUBMITTED DEMOGRAPHIC amendments am1,am2."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H58", facility_type: "HOSPITAL", jurisdiction_code: "CTY-58", npi: "NPI-058" }
