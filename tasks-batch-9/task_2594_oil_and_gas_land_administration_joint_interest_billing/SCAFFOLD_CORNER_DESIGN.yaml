      - name: a_joint_interest_accountant_cannot_patch_owner_compliance_fields
        claim_type: peer_roles
        grounds:
          - "validations[priority=20, error_id=ERR_UNAUTHORIZED]"
          - roles.ComplianceOfficer
          - endpoints.POST_/land-admin/interest-owners/{owner_id}/compliance-updates
        distinguishing_aspect: |
          Compliance maintenance is peer to billing, not below it: the accountant who bills the owner
          cannot raise its bond_posted_cents (403 ERR_UNAUTHORIZED) even though both roles share read
          access to the very same InterestOwner record.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Interest owner Epsilon Resources Inc with bond_posted_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: false, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
          trigger:
            - call: "POST /land-admin/interest-owners/${ob_id}/compliance-updates"
              payload: { bond_posted_cents: 25000000 }
              as: JointInterestAccountant
              as_user_id: "u-jib-1"
          assert:
            - "HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "InterestOwner.${ob_id}.bond_posted_cents == 0 and version == 1"
            - "GET /land-admin/interest-owners/${ob_id} succeeds for both JointInterestAccountant and ComplianceOfficer, so only the write is role-restricted"

      - name: a_request_without_the_role_header_is_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - "validations[priority=10, error_id=ERR_UNAUTHENTICATED]"
          - errors.ERR_UNAUTHENTICATED
          - complexity_profile.role_model
        distinguishing_aspect: |
          Authentication precedes everything at priority 10: the same lease creation body returns
          ERR_UNAUTHENTICATED (401) when X-User-Role is absent and again when X-User-Role carries a
          value outside the five declared roles - never ERR_UNAUTHORIZED (403), which is reserved for
          a recognised role lacking permission.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Empty lease inventory"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-009", lessor_name: "Nobody", gross_acres: 100.00, royalty_rate: 0.200000, primary_term_end_date: "2029-01-31" }
              as: "(no X-User-Role header sent, X-User-ID present)"
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-010", lessor_name: "Nobody", gross_acres: 100.00, royalty_rate: 0.200000, primary_term_end_date: "2029-01-31" }
              as: "(X-User-Role: RoyaltyAnalyst, a role not declared in the scaffold)"
          assert:
            - "both calls return HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "neither response carries error_id ERR_UNAUTHORIZED"
            - "GET /land-admin/leases as LandAdministrator returns total_count == 0"

      - name: the_preparer_of_a_bill_cannot_adjudicate_its_own_dispute
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=45, error_id=ERR_SEGREGATION_OF_DUTIES]"
          - complexity_profile.role_model
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_terminal_state_on_resolution
          rationale: |
            The segregation rule is only observable by resolving a dispute as an AuditReviewer whose
            X-User-ID equals the disputed statement's prepared_by_user_id. The §1.8
            priority_pair_validation_conflict instance does exactly that against an already-resolved
            dispute and asserts ERR_SEGREGATION_OF_DUTIES wins over ERR_TERMINAL_STATE, plus the
            single-violation control where a different reviewer succeeds.

