            - "Client.${bd1_cl}.credit_balance_cents == 6000 (the >= gate checks but does not debit at lock)"

      - name: manifest_with_zero_assigned_rejected_empty_collection
        grounds:
          - state_machines.ShippingWave.SCHEDULED_to_MANIFESTED
          - errors[ERR_WAVE_EMPTY]
          - entities.ShippingWave.fields.assigned_count
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (assigned shipment
          count) and a different endpoint (manifest, not lock): assigned_count
          == 0 is rejected with ERR_WAVE_EMPTY while assigned_count == 1 passes.
        test_recipe:
          setup:
            - "wave WV-BD2 exists: FEDEX GROUND 2026-05-11T09:00:00Z-2026-05-11T10:00:00Z, SCHEDULED, zero shipments assigned"
          setup_api_calls:
