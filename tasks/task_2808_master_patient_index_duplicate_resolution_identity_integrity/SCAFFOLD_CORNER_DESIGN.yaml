            - "$.data.sample_size_sufficient == false and $.data.rule_set_version_label == \"V-BASE-1\""
            - "PatientRecord.${rec_ca1_id}.clinical_element_count == 3 and subsumed_member_count == 2"

      - name: integrity_state_precedence_puts_fraud_above_remediation
        claim_type: correct_result
        grounds:
          - calculations.record_integrity_state_derivation
        distinguishing_aspect: "The derivation is a first-match-wins precedence chain, not a latest-event wins rule: an OPEN investigation overrides an already-pending remediation to FRAUD_SUSPECTED, and closing the investigation falls back to REMEDIATION_PENDING rather than to CLEAR because the overlay is still open."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-CB and one PatientRecord CB-1000, initially CLEAR."
            - "One OverlayCorrection is opened on that record (state DETECTED, affected_clinical_element_count 3), which re-derives the record to REMEDIATION_PENDING. The overlay is deliberately left in DETECTED for the whole recipe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-CB", name: "Precedence Clinic", region_code: "US-NM", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_cb_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_cb_id}", mrn: "CB-1000", last_name: "Delacroix", first_name: "Yvette", dob: "1959-11-11", sex: "F", ssn_last4: "4040", postal_code: "87501", phone: "5055550101", clinical_element_count: 10 }
              as: IdentityAnalyst
              captures: { rec_cb_id: $.data.id, rec_cb_v0: $.data.version, rec_cb_integrity0: $.data.integrity_state }
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_cb_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { first_name: "Yvonne" }, affected_clinical_element_count: 3, encounter_from_date: "2026-07-05", encounter_to_date: "2026-07-06", expected_record_version: "${rec_cb_v0}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ov_cb_id: $.data.id }
            - call: "GET /mpi/patient-records/${rec_cb_id}"
              payload: {}
              as: MpiAdmin
              captures: { rec_cb_integrity1: $.data.integrity_state }
          trigger:
            - call: "POST /mpi/fraud-investigations"
              payload: { record_id: "${rec_cb_id}", trigger_kind: "MANUAL", note: "Insurance card presented under another name." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
              captures: { inv_cb_id: $.data.id }
            - call: "GET /mpi/patient-records/${rec_cb_id}"
              payload: {}
              as: MpiAdmin
            - call: "POST /mpi/fraud-investigations/${inv_cb_id}/unsubstantiate"
              payload: { finding_note: "The card belonged to a relative; no identity fraud." }
              as: PrivacyOfficer
              as_user_id: "officer-1"
            - call: "GET /mpi/patient-records/${rec_cb_id}"
              payload: {}
              as: MpiAdmin
          assert:
            - "${rec_cb_integrity0} == \"CLEAR\" and ${rec_cb_integrity1} == \"REMEDIATION_PENDING\""
            - "First trigger call: HTTP 201 with $.data.state == OPEN and $.data.opened_by == OFFICER and $.data.opened_by_user_id == \"officer-1\""
            - "Second trigger call: $.data.integrity_state == FRAUD_SUSPECTED (the OPEN investigation outranks the pending remediation)"
            - "Third trigger call: HTTP 200 with $.data.state == UNSUBSTANTIATED"
            - "Fourth trigger call: $.data.integrity_state == REMEDIATION_PENDING, NOT CLEAR (the OverlayCorrection is still DETECTED)"
            - "OverlayCorrection.${ov_cb_id}.state == DETECTED and RegistrationSite.${site_cb_id}.flagged_record_count == 0"

      - name: pair_match_score_rounds_each_contribution_before_summing
        claim_type: precision
        grounds:
          - calculations.pair_match_score.formula
        excluded_because:
          difficulty_instance: pair_match_score_round_then_sum_order_is_pinned
          rationale: "That §1.8 instance is built entirely around the round-then-sum ordering and the divergent sum-then-round literal."

      - name: strict_and_tolerant_variants_diverge_on_the_same_pair
        claim_type: variant_divergence
        grounds:
          - calculations.pair_match_score.variants
        excluded_because:
          difficulty_instance: strict_vs_tolerant_null_credit_flips_pair_classification
          rationale: "Both variants are scored over identical records there and the classification flip plus the exact delta are asserted."

      - name: attribution_variant_charges_two_different_sites
        claim_type: reconciliation
        grounds:
          - calculations.site_duplicate_rate.variants
        excluded_because:
          difficulty_instance: creation_vs_survivor_site_attribution_diverges_on_cross_site_merge
          rationale: "The cross-site merge there makes the two variants charge different sites and asserts both duplicate_rate_bps values."

      - name: match_score_at_the_review_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.pair_match_score.formula
          - entities.MatchRuleSet.fields.review_threshold
        excluded_because:
          difficulty_instance: match_score_exactly_at_review_threshold_is_inclusive
          rationale: "The at-threshold, one-cent-below and one-cent-above triple is exactly that instance's subject."

      - name: evidence_adjustment_rounding_does_not_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.pair_triage_effective_score
        excluded_because:
          difficulty_instance: evidence_adjustment_rounds_half_up_at_third_decimal
          rationale: "That instance pins the third-decimal half-up case and the half-even value it must not produce."

      - name: fraud_risk_score_components_and_nested_caps
        claim_type: correct_result
        grounds:
          - calculations.fraud_risk_score
        excluded_because:
          difficulty_instance: fraud_risk_score_four_components_with_nested_caps
          rationale: "All four components, both caps and the 100.00 ceiling are asserted there with pre-computed literals."

      - name: dispatch_windows_that_only_touch_do_not_intersect
        claim_type: interval_merge
        grounds:
          - calculations.dispatch_window_occupancy
        excluded_because:
          difficulty_instance: dispatch_window_half_open_adjacency_then_capacity_breach
          rationale: "Half-open adjacency and the aggregate-capacity breach are the two halves of that instance."

      - name: metric_windows_that_only_touch_do_collide
        claim_type: interval_merge
        grounds:
          - calculations.metric_window_exclusivity
        excluded_because:
          difficulty_instance: metric_window_closed_adjacency_collides_but_other_variant_does_not
          rationale: "Closed-interval adjacency and the attribution_variant scoping are asserted together there."

      - name: clinical_elements_are_conserved_across_merge_and_unmerge
        claim_type: correct_result
        grounds:
          - calculations.clinical_element_conservation
        excluded_because:
          difficulty_instance: unmerge_restores_cluster_elements_and_enterprise_ids
          rationale: "That instance evaluates CLUSTER_ELEMENTS before the merge and after the unmerge over a three-record chain."

      - name: enterprise_ids_are_conserved_across_merge_and_unmerge
        claim_type: correct_result
        grounds:
          - calculations.enterprise_identity_conservation
        excluded_because:
          difficulty_instance: unmerge_restores_cluster_elements_and_enterprise_ids
          rationale: "DISTINCT_ACTIVE_EIDS and the byte-for-byte restoration of subsumed_prior_enterprise_id are asserted in the same instance."

      - name: merge_element_transfer_lists_the_recompressed_records
        claim_type: correct_result
        grounds:
          - calculations.merge_element_transfer
        excluded_because:
          difficulty_instance: merge_path_compression_repoints_grandchild_to_new_survivor
          rationale: "recompressed_record_mrns, the moved-count snapshot and the re-pointed grandchild are all asserted there."

  - section: validations
    instances:

      - name: attribute_weights_that_do_not_sum_to_one_hundred_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_WEIGHTS_SUM_INVALID]
        distinguishing_aspect: "The seven weights must sum to exactly 100.00, so a set summing to 99.00 is refused with 422 ERR_WEIGHTS_SUM_INVALID and no MatchRuleSet row is created."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z and no MatchRuleSet rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
          trigger:
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Short Weights", version_label: "V-BAD-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 9.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
          assert:
            - "HTTP 422 with $.data.error_id == \"ERR_WEIGHTS_SUM_INVALID\""
            - "$.response_type == \"error\" and $.data.message is a non-empty string"
            - "GET /mpi/match-rule-sets returns exactly 0 rows"

      - name: review_threshold_above_auto_link_threshold_is_rejected
        claim_type: cascading_validation
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - errors[ERR_THRESHOLD_ORDER_INVALID]
        distinguishing_aspect: "The threshold-order check runs after the weight-sum check, so a payload whose weights are valid but whose review_threshold 90.00 exceeds auto_link_threshold 85.00 must surface ERR_THRESHOLD_ORDER_INVALID rather than ERR_WEIGHTS_SUM_INVALID."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z and no MatchRuleSet rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
          trigger:
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Inverted Thresholds", version_label: "V-BAD-2", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 90.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
          assert:
            - "HTTP 422 with $.data.error_id == \"ERR_THRESHOLD_ORDER_INVALID\" (not ERR_WEIGHTS_SUM_INVALID: the weights do sum to 100.00)"
            - "GET /mpi/match-rule-sets returns exactly 0 rows"

      - name: site_registrar_registering_at_a_foreign_site_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - roles.SiteRegistrar
          - errors[ERR_SITE_SCOPE_VIOLATION]
        distinguishing_aspect: "For the entity-backed SiteRegistrar role X-User-ID IS the site id, so posting a record whose body site_id names a different site is 403 ERR_SITE_SCOPE_VIOLATION - it outranks the missing-search-attempt check at priority 18 even though that rule is also violated."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Two ACTIVE RegistrationSite rows SITE-V3A and SITE-V3B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-V3A", name: "Home Site", region_code: "US-OH", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_v3a_id: $.data.id }
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-V3B", name: "Foreign Site", region_code: "US-OH", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_v3b_id: $.data.id }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_v3b_id}", mrn: "V3-1000", last_name: "Kowalczyk", first_name: "Irena", dob: "1981-01-19", sex: "F", clinical_element_count: 1 }
              as: SiteRegistrar
              as_user_id: "${site_v3a_id}"
          assert:
            - "HTTP 403 with $.data.error_id == \"ERR_SITE_SCOPE_VIOLATION\" (not ERR_SEARCH_ATTEMPT_REQUIRED: priority 3 precedes priority 18)"
            - "GET /mpi/patient-records returns exactly 0 rows"
            - "RegistrationSite.${site_v3b_id}.active_record_count == 0"

      - name: search_attempt_requirement_applies_only_to_the_site_registrar
        claim_type: conditional_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_SEARCH_ATTEMPT_REQUIRED]
        distinguishing_aspect: "origin_search_attempt_id is mandatory only when X-User-Role is SiteRegistrar: the identical body is 422 ERR_SEARCH_ATTEMPT_REQUIRED for the registrar at its own site and 201 for an IdentityAnalyst."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-V4; the registrar acts with X-User-ID equal to that site id, so the site-scope rule at priority 3 is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-V4", name: "Conditional Rule Clinic", region_code: "US-MI", registrar_headcount: 3 }
              as: MpiAdmin
              captures: { site_v4_id: $.data.id }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_v4_id}", mrn: "V4-1000", last_name: "Bergqvist", first_name: "Sten", dob: "1974-04-14", sex: "M", clinical_element_count: 2 }
              as: SiteRegistrar
              as_user_id: "${site_v4_id}"
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_v4_id}", mrn: "V4-1000", last_name: "Bergqvist", first_name: "Sten", dob: "1974-04-14", sex: "M", clinical_element_count: 2 }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
