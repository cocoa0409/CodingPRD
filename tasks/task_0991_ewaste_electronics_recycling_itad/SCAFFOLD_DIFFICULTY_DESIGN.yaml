            - { call: "PATCH /itad/accounts/${acct}", payload: { status: "SUSPENDED" }, as: PlatformAdmin }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ACCOUNT_SUSPENDED (referential priority 16 fires before temporal priority 21, though the window is also in the past)"
            - "Manifest.${m}.status remains DRAFT"

  - rule_id: boundary_precision_check
