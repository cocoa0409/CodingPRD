              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "111 Valley Rd", grid_risk_block: "VALL-A" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/risk-consultations"
              payload: { consultant_user_id: "rc-dana", scheduled_for: "2026-09-10T09:00:00Z", duration_minutes: 60 }
              as: RiskConsultant
              captures: { rc1_id: $.data.id }
          trigger:
            - call: "POST /hnw/properties/${p1_id}/risk-consultations"
              payload: { consultant_user_id: "rc-dana", scheduled_for: "2026-09-10T08:59:00Z", duration_minutes: 30 }
              as: RiskConsultant
              captures: { error_id: $.data.error_id }
          assert:
            - "the booking that starts at 08:59 and would run into the 09:00 appointment is refused with status 409 and error_id == ERR_CONSULTATION_SLOT_CONFLICT"
            - "a booking for the same consultant starting at exactly 2026-09-10T10:00:00Z is ACCEPTED with status 201 — the half-open interval makes the shared 10:00 instant non-overlapping"
            - "a booking for the same consultant starting at 2026-09-10T10:30:00Z for 60 minutes is refused because it overlaps the 10:00 appointment"
            - "a booking for a DIFFERENT consultant at 2026-09-10T09:30:00Z is ACCEPTED, because the exclusion is scoped to consultant_user_id"

      - name: wildfire_zone_capacity_window_with_buffer_and_aggregate_limit
        grounds:
          - validations[priority=22]
          - errors[ERR_ZONE_DISPATCH_CAPACITY]
          - calculations.defense_dispatch_priority
          - state_machines.WildfireDefenseDispatch.REQUESTED_to_VENDOR_ASSIGNED
        distinguishing_aspect: "A different interval treatment on a different resource: occupancy on a RiskZone is counted as at most two overlapping occupants of a FIXED-LENGTH 24-hour window rather than a single-occupant half-open interval, so capacity is an aggregate of two overlapping assignments and the third is the one refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; zone ZQ1 ACTIVE with three properties and three REQUESTED dispatches; two prior assignments already hold the zone."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZQ1", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME", state_event: "ACTIVE" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /hnw/agencies"
              payload: { agency_code: "AG16", legal_name: "Cinder Premier", state_code: "CA", delegated_authority_limit_cents: 400000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "121 Cinder Rd", grid_risk_block: "CIND-A" }
              as: Underwriter
              captures: { pa_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "122 Cinder Rd", grid_risk_block: "CIND-A" }
              as: Underwriter
              captures: { pb_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "123 Cinder Rd", grid_risk_block: "CIND-A" }
              as: Underwriter
              captures: { pc_id: $.data.id }
            - call: "POST /hnw/wildfire-events/properties/${pa_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/properties/${pb_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/properties/${pc_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/vendors/poll"
              payload: { risk_zone_id: "${zone_id}" }
              as: Underwriter
            - call: "POST /hnw/wildfire-events/vendors/poll"
              payload: { risk_zone_id: "${zone_id}" }
              as: Underwriter
          trigger:
            - call: "POST /hnw/wildfire-events/vendors/poll"
              payload: { risk_zone_id: "${zone_id}" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the third poll is refused with status 422 and error_id == ERR_ZONE_DISPATCH_CAPACITY"
            - "two assignments succeeded and the zone's 24-hour window is saturated at the aggregate limit of 2"
            - "after POST /hnw/_clock/set_current_utc to 2026-09-02T01:00:00Z, a further poll of the same zone SUCCEEDS, because the fixed-length 24-hour windows of the two prior assignments have expired"
            - "the retried poll returns the third property's dispatch, whose priority_rank places it ahead of no other eligible candidate"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: defense_dispatch_cancel_restores_the_total_insured_exposure
        grounds:
          - state_machines.Enrollment.SUBMITTED_to_DECLINED
          - state_machines.WildfireDefenseDispatch.REQUESTED_to_CANCELLED
          - calculations.concentration_ratio
          - entities.Property.fields.total_insured_value_cents
        distinguishing_aspect: "A conserved EXPOSURE quantity: submitting an enrollment raises the portfolio's summed ACTIVE exposure by exactly the property's total_insured_value_cents, and declining it restores the sum to its previous value to the cent — the compensation runs through dispatch cancellation and a concentration re-sweep rather than through any direct reversal of the sum."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two properties of 250000000 insured value each on one zone; both submitted, then one declined and the exposure compared before and after."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZR1", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME", state_event: "ACTIVE" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /hnw/agencies"
              payload: { agency_code: "AG17", legal_name: "Ember Premier", state_code: "CA", delegated_authority_limit_cents: 400000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "131 Ember Rd", grid_risk_block: "EMBR-A" }
              as: Underwriter
              captures: { p1_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "132 Ember Rd", grid_risk_block: "EMBR-A" }
              as: Underwriter
              captures: { p2_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Ember Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr1_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr1_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v306: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v306}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p2_id}/appraisals"
              payload: { appraiser_name: "Ember Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr2_id: $.data.id }
            - call: "POST /hnw/appraisals/${appr2_id}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${appr2_id}/approve"
              payload: {}
              as: Underwriter
            - call: "GET /hnw/properties/${p2_id}"
              payload: {}
              as: Underwriter
              captures: { p2_v307: $.data.version }
            - call: "POST /hnw/properties/${p2_id}/posture-eval"
              payload: { expected_property_version: "${p2_v307}" }
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "COLLECTION", appraiser_name: "Ember Collections", appraisal_date: "2026-08-20T00:00:00Z", appraised_value_cents: 50000000 }
              as: Underwriter
              captures: { doc1_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "COLLECTION", declared_value_cents: 50000000, appraisal_doc_id: "${doc1_id}" }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { si1_id: $.data.id }
            - call: "POST /hnw/scheduled-items/${si1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/properties/${p2_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e2_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/properties/${p1_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/decline"
              payload: { reason: "underwriting" }
              as: Underwriter
          assert:
            - "before the decline the summed ACTIVE portfolio exposure is 500000000 — Property.${p1_id}.total_insured_value_cents 250000000 plus Property.${p2_id}.total_insured_value_cents 250000000"
            - "after the decline the summed ACTIVE portfolio exposure is 250000000, exactly Property.${p2_id}.total_insured_value_cents — the compensation restores the sum to the cent with no drift"
            - "Property.${p1_id}.total_insured_value_cents is itself STILL 250000000, since the property valuation is not destroyed by the decline; only its enrollment leaves the ACTIVE set"
            - "the difference between the two portfolio sums is exactly 250000000 and equals the declined enrollment's property exposure"

      - name: recall_voids_the_valuation_provision_so_the_coverage_sum_is_conserved
        grounds:
          - state_machines.Enrollment.APPROVED_to_SUBMITTED
          - state_machines.Enrollment.SUBMITTED_to_APPROVED
          - calculations.extended_replacement_provision
          - entities.Enrollment.fields.replacement_provision
        distinguishing_aspect: "A different conserved quantity — COVERAGE rather than exposure: approving snapshots extended_replacement_limit_cents at 300000000, recalling resets the provision to NONE and therefore the applicable limit back to the 200000000 Coverage A floor, and re-approving restores exactly 300000000, so the coverage sum returns to its pre-recall value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A mitigation-cleared property with an approved enrollment of Coverage A 300000000 in APPROVED state."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
