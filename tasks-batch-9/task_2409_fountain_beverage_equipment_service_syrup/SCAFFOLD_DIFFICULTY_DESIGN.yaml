  - rule_id: resource_temporal_overlap
    instances:

      - name: route_stop_windows_half_open_touching_allowed_then_overlap_refused
        grounds:
          - calculations.stop_window_overlap
          - validations[priority=23]
          - concurrency_rules[stop-create-stale-route]
          - entities.RouteStop.fields.window_start
          - errors[ERR_STOP_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = one ReplenishmentRoute's delivery calendar, interval semantics = HALF-OPEN with
          BUFFER_MINUTES 0: a stop starting exactly when the previous one ends (10:00) is accepted,
          while a stop straddling an existing window (11:00-13:00 against 10:00-12:00) is refused with
          ERR_STOP_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two outlets in region R15 (no agreements or units needed — stop creation only checks region, OCC, sequence uniqueness and window overlap)."
            - "One PLANNED route RT-TO-1 in R15 for 2026-08-05 with capacity_units 300 and one PENDING stop covering [08:00, 10:00)."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Quick Lube Lounge", account_code: "ACCT-TO-A", region_code: "R15", throughput_tier: "SMALL", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o15a: $.data.id }
            - call: "POST /fountain-network/outlets"
              payload: { name: "Feed Store Counter", account_code: "ACCT-TO-B", region_code: "R15", throughput_tier: "SMALL", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o15b: $.data.id }
            - call: "POST /fountain-network/replenishment-routes"
              payload: { route_code: "RT-TO-1", depot_region_code: "R15", service_date: "2026-08-05T00:00:00Z", van_code: "V-71", capacity_units: 300 }
              as: SupplyPlanner
              captures: { rt15: $.data.id, rt15v1: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt15}/stops"
              payload: { outlet_id: "${o15a}", sequence_index: 1, window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T10:00:00Z", expected_route_version: "${rt15v1}" }
              as: SupplyPlanner
              captures: { st15a: $.data.id }
            - call: "GET /fountain-network/replenishment-routes/${rt15}"
              payload: {}
              as: SupplyPlanner
              captures: { rt15v2: $.data.version }
          trigger:
            - call: "POST /fountain-network/replenishment-routes/${rt15}/stops"
              payload: { outlet_id: "${o15b}", sequence_index: 2, window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_route_version: "${rt15v2}" }
              as: SupplyPlanner
              captures: { st15b: $.data.id, st15b_status: $.data.status }
            - call: "GET /fountain-network/replenishment-routes/${rt15}"
              payload: {}
              as: SupplyPlanner
              captures: { rt15v3: $.data.version }
            - call: "POST /fountain-network/replenishment-routes/${rt15}/stops"
              payload: { outlet_id: "${o15a}", sequence_index: 3, window_start: "2026-08-05T11:00:00Z", window_end: "2026-08-05T13:00:00Z", expected_route_version: "${rt15v3}" }
              as: SupplyPlanner
              captures: { err15: $.data.error_id }
          assert:
            - "${rt15v2} == 2 (route version 1 at creation, +1 for the first stop)"
            - "After trigger[0]: ${st15b_status} == PENDING and RouteStop.${st15b}.sequence_index == 2 — touching endpoints (10:00 == 10:00) never conflict under BUFFER_MINUTES 0"
            - "${rt15v3} == 3"
            - "${err15} == ERR_STOP_WINDOW_OVERLAP with HTTP 409 (11:00 < 12:00 and 10:00 < 13:00 against RouteStop.${st15b})"
            - "GET /fountain-network/route-stops with route_id == ${rt15} returns exactly 2 rows (${st15a} and ${st15b})"
            - "ReplenishmentRoute.${rt15}.version == 3 after the refused write and committed_units == 0"
            - "RouteStop.${st15a}.status == PENDING and RouteStop.${st15b}.status == PENDING"

      - name: van_service_windows_closed_interval_thirty_minute_buffer
        grounds:
          - calculations.van_window_overlap
          - validations[priority=24]
          - entities.ServiceCall.fields.scheduled_window_start
          - entities.ServiceCall.fields.van_code
          - errors[ERR_VAN_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A different resource (one van's service calendar, not a route's delivery calendar) with the
          opposite interval semantics: CLOSED intervals padded by TRAVEL_BUFFER_MINUTES 30, so a
          window starting exactly 30 minutes after the previous one ends (11:30) conflicts while one
          starting 31 minutes after (11:31) is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R16 with one ACTIVE agreement and one IN_SERVICE unit."
