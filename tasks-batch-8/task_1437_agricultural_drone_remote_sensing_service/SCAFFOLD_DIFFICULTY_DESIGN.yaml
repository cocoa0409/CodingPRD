            - call: "POST /ag-drone/airspace-authorizations/${auth_id}/revoke"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
              captures: { err: $.data.error_id }
          assert:
