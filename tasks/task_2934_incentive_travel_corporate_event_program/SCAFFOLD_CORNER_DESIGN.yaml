        as ContractApprover ca-02, then {"action": "PROPOSE"} as SourcingManager sm-01, then POST /supplier-contracts/${c1_id}/execute
        as ContractApprover ca-01.'
      assert:
      - 'The 1155001 append is rejected with ERR_DEPOSIT_SCHEDULE_EXCEEDS_CONTRACT_VALUE and HTTP 422:
        1155001 on its own is far below the contract value, but the cumulative 2310001 exceeds it by one
        cent. GET /deposit-milestones?contract_id=${c1_id} still returns total_count 2.'
      - The 1155000 append returns 201 — the check is <=, so a schedule equal to the contract value is
        accepted, and total_count becomes 3.
      - The PROPOSE to 38000 returns 200 with status "PROPOSED", round_count 1 and nightly_rate_cents
        38000; the contract value silently drops to 2280000 while the schedule still totals 2310000.
      - The first execute is rejected with ERR_DEPOSIT_SCHEDULE_EXCEEDS_CONTRACT_VALUE and HTTP 422 —
        the aggregate is re-evaluated at execution against the CURRENT terms, catching a schedule that
        was legal when it was built.
