              payload: { source: "EVIDENCE", severity: "HIGH", description: "f", evidence_artifact_id: "${e_id}" }
              as: RiskAnalyst
              captures: { x_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/risk-acceptances"
