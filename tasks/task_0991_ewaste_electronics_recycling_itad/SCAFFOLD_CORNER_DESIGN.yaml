        claim_type: correct_result
        grounds: [calculations.recycler_selection_score]
        distinguishing_aspect: "Two recyclers with identical stats tie on risk_score and on total_processed_kg (both 0); the tie-break is created_at ASC — the earlier-created recycler wins."
