      - name: release_shortfall_advance_depth2_cascade
        grounds:
          - state_machines.Disbursement.SCHEDULED_to_RELEASED
          - state_machines.EscrowAdvance
          - calculations.advance_recovery_waterfall
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (disbursement release): the release posts a
          DISBURSEMENT ledger debit that recomputes the balance (link 1); the recomputed negative
          balance itself triggers creation of an OUTSTANDING EscrowAdvance of exactly the shortfall
          plus a compensating ADVANCE_ISSUED entry (link 2).
        test_recipe:
          setup:
