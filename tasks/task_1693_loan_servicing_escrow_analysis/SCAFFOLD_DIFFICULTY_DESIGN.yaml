            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-INV-1", borrower_name: "Ina Variant", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/deposits", payload: { amount_cents: 100000, effective_date: "2026-08-05" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 70000, due_date: "2026-08-20", scheduled_release_date: "2026-08-10" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /servicing/disbursements/${disb_id}/release", payload: {}, as: DisbursementProcessor, as_user_id: "dp_2" }
            - { call: "POST /servicing/disbursements/${disb_id}/mark-returned", payload: {}, as: DisbursementProcessor, as_user_id: "dp_2" }
          assert:
            - "After release: EscrowAccount.${acct_id}.balance_cents == 30000"
            - "After mark-returned: EscrowAccount.${acct_id}.balance_cents == 100000 (exact restoration)"
            - "Ledger: 3 entries (+100000 DEPOSIT, -70000 DISBURSEMENT, +70000 DISBURSEMENT_RETURN); sum of amount_cents == balance_cents == 100000"
            - "GET /servicing/escrow-accounts/${acct_id}/advances returns 0 rows (no residue)"
            - "Disbursement.${disb_id}.status == RETURNED"

      - name: advance_recovery_writeoff_decomposition
        grounds:
          - state_machines.EscrowAdvance
          - entities.EscrowAdvance.fields.outstanding_cents
          - calculations.advance_recovery_waterfall
        distinguishing_aspect: |
          Conserved quantity = advance decomposition: amount_cents == recovered_cents +
          written_off_cents + outstanding_cents after EVERY transition (50000 == 20000 + 0 + 30000
          after partial recovery; 50000 == 20000 + 30000 + 0 after write-off). Write-off moves no
          money — balance_cents untouched. Different conserved quantity than the ledger balance.
        test_recipe:
          setup:
            - "Setup A account ACTIVE; manual advance 50000 (MANUAL_CORRECTION) posted; balance 50000"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-INV-2", borrower_name: "Wri Toff", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/advances", payload: { amount_cents: 50000, reason: "MANUAL_CORRECTION" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { adv_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/advances/${adv_id}/recover", payload: { amount_cents: 20000 }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/advances/${adv_id}/write-off", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
          assert:
            - "After recover: EscrowAdvance.${adv_id}.status == RECOVERING, recovered_cents == 20000, outstanding_cents == 30000, written_off_cents == 0 (50000 == 20000 + 0 + 30000)"
            - "EscrowAccount.${acct_id}.balance_cents == 30000 (ADVANCE_ISSUED +50000, ADVANCE_RECOVERY -20000)"
            - "After write-off: EscrowAdvance.${adv_id}.status == WRITTEN_OFF, written_off_cents == 30000, outstanding_cents == 0 (50000 == 20000 + 30000 + 0)"
            - "EscrowAccount.${acct_id}.balance_cents == 30000 (write-off posts no ledger entry)"
