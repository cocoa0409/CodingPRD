  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_tier_constant_set_flips_binding_cap_in_nested_min
        grounds:
          - calculations.loan_sizing_max
          - calculations.loan_sizing_max.constants.LTP_PCT
          - calculations.loan_sizing_max.constants.LTC_PCT
          - calculations.loan_sizing_max.constants.LTARV_PCT
          - entities.LoanApplication.fields.pricing_tier
          - entities.LoanApplication.fields.cap_purchase_advance_cents
          - entities.LoanApplication.fields.cap_ltc_cents
          - entities.LoanApplication.fields.cap_ltarv_cents
          - entities.LoanApplication.fields.max_total_loan_cents
          - state_machines.LoanApplication.DRAFT_to_SIZED
        distinguishing_aspect: |
          Mode a — the pricing_tier constant set, not the numbers, decides the answer:
          two applications with byte-identical property and scope inputs size to
          23,953,713 (TIER_A) and 22,359,003 (TIER_B) because the nested min
          min(cap_purchase_advance + rehab, cap_ltc, cap_ltarv) has a different binding
          leg per tier — TIER_A binds on cap_ltarv 24,000,000 while TIER_B binds on
          cap_ltarv 22,400,000 with cap_ltc 25,500,000 slack, so the same formula shape
          yields a 1,594,710 spread that no single-cap reading reproduces.
        test_recipe:
          setup:
            - "logical clock 2026-08-10T09:00:00Z"
            - "sponsor b1 scores 92.00 -> TIER_A; sponsor b2 scores 65.00 -> TIER_B; both APPROVED_SPONSOR with executed guarantees"
            - "two identical properties: purchase 20,000,000, as-is 21,000,000, ARV 32,000,000"
            - "each application carries three APPROVED scope lines 4,000,000 + 3,500,000 + 2,500,000 = 10,000,000 (largest line is 40% of scope, under the 50% cap)"
            - "term 9 months, quoted rate 1150 bps, 6 reserve months on both"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/borrowers"
              payload: { legal_entity_name: "Ridgeline Rehab LLC", entity_type: "LLC", guarantor_name: "D. Ruiz", flips_last_24mo: 6, flips_lifetime: 8, credit_score: 760, liquidity_cents: 30000000, prior_default_count: 0, declared_target_loan_cents: 30000000 }
              as: LoanOfficer
              captures: { b1: $.data.id, b1_tier: $.data.experience_tier }
            - call: "POST /lending/borrowers/${b1}/guarantee"
              payload: { guarantor_name: "D. Ruiz", signature_ref: "esign-b1", effective_date: "2026-08-10" }
              as: LoanOfficer
            - call: "POST /lending/borrowers/${b1}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
            - call: "POST /lending/borrowers"
              payload: { legal_entity_name: "Cactus Wren Holdings LLC", entity_type: "LLC", guarantor_name: "R. Vance", flips_last_24mo: 3, flips_lifetime: 6, credit_score: 696, liquidity_cents: 3000000, prior_default_count: 0, declared_target_loan_cents: 30000000 }
              as: LoanOfficer
              captures: { b2: $.data.id, b2_tier: $.data.experience_tier }
            - call: "POST /lending/borrowers/${b2}/guarantee"
              payload: { guarantor_name: "R. Vance", signature_ref: "esign-b2", effective_date: "2026-08-10" }
              as: LoanOfficer
            - call: "POST /lending/borrowers/${b2}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
            - call: "POST /lending/properties"
              payload: { address_line: "18 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-07-20" }
              as: LoanOfficer
              captures: { p1: $.data.id }
            - call: "POST /lending/properties"
              payload: { address_line: "22 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-07-20" }
              as: LoanOfficer
              captures: { p2: $.data.id }
            - call: "POST /lending/contractors"
              payload: { business_name: "Vega Roofing", license_number: "LIC-4471", license_expires_on: "2027-12-31", w9_on_file: true, joint_check_required: false }
              as: LoanOfficer
