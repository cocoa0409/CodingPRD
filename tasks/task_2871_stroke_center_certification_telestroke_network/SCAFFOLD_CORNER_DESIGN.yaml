  - name: terminal_and_undeclared_transitions_return_their_own_entity_specific_state_error
    claim_type: violation_to_error
    grounds:
    - validations priority 30 -> ERR_INVALID_CENTER_STATE / ERR_INVALID_ONCALL_TRANSITION / ERR_INVALID_REPORT_STATE (409)
    - state_machines.StrokeCenter, state_machines.Neurologist, state_machines.CertificationReport
    distinguishing_aspect: 'Priority 30 is ONE rule that must return a DIFFERENT error_id per entity, so a shared ERR_INVALID_STATE would be wrong three times here. The three cases are deliberately of different kinds: an idempotent repeat (suspend twice), a transition that is simply not drawn in the diagram (OFF_DUTY -> UNAVAILABLE), and a step attempted out of sequence (publishing a DRAFT).'
