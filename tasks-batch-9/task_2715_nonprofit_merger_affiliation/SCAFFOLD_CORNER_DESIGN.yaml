      - name: donor_consent_transfer_is_refused_only_for_the_conflicting_restriction
        claim_type: conditional_validation
        grounds:
          - validations.priority_29_ERR_JUDICIAL_ORDER_REQUIRED
          - endpoints.POST_/restricted-funds/{id}/transfer
        distinguishing_aspect: |
          Two funds of the same organization travel the identical consent path and both
          arrive at CONSENT_GRANTED with a positive transferable amount; the only
          difference is the restriction_conflict flag. The unconflicted fund transfers,
          the conflicted one is refused at priority 29 - soliciting the donor was legal,
          it is the RELEASE that needs a court. The conditional is therefore invisible
          before the transfer call, and the partially applied result leaves the deal
          posture RESTRICTED_PENDING rather than CLEARED.
