    instances:
      - name: listing_exclusivity_halfopen_overlap
        grounds:
          - "validations[priority=8]"
          - entities.Listing.fields.exclusive_start_date
          - entities.Listing.fields.exclusive_end_date
        distinguishing_aspect: |
          Two listings for the SAME seller with half-open [start,end) exclusive
          windows: [2026-01-01,2026-06-01) then [2026-05-01,2026-12-01) overlap ->
          ERR_LISTING_PERIOD_OVERLAP. Interval semantics: half-open, no buffer,
          resource = Seller (distinct from the meeting buffer rule).
        test_recipe:
          setup:
            - "One seller with a listing over [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /brokerage/brokers"
              payload: { firm_name: "Main St M&A", license_number: "BRK-1" }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
