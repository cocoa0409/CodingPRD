# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerates testable claims not already covered by §1.8.
# Stubs (excluded_because) are used where §1.8 already exercises the corner.
# =============================================================================

scaffold_corner_design:

  # =========================================================================
  # Section 1: Entities — creation, retrieval, defaults, types, FK integrity
  # =========================================================================
  - section: entities
    instances:
      - name: shop_creation_applies_repair_rate_limit_default
        claim_type: defaults
        grounds: [entities.Shop.fields.repair_rate_limit_pct]
        distinguishing_aspect: "Omitting repair_rate_limit_pct yields the default value 5; explicit value overrides."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SD", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /weld-shop/shops/${shop_id}"
              as: Any
              captures: { limit: $.data.repair_rate_limit_pct }
          assert:
            - "limit == 5 (default applied)"

      - name: shop_creation_uses_explicit_repair_rate_limit
        claim_type: creation
        grounds: [entities.Shop.fields.repair_rate_limit_pct]
        distinguishing_aspect: "Explicitly provided repair_rate_limit_pct is honored over the default."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SX", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 12 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /weld-shop/shops/${shop_id}"
              as: Any
              captures: { limit: $.data.repair_rate_limit_pct }
          assert:
            - "limit == 12"

      - name: shop_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent shop UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /weld-shop/shops/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: welder_creation_persists_fields
        claim_type: creation
        grounds: [entities.Welder]
        distinguishing_aspect: "POST welder returns 201 with stencil, full_name, status=ACTIVE."
        test_recipe:
          setup: ["Shop exists"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SW", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W-X", full_name: "Welder X" }
              as: ShopAdmin
              captures: { status: $.data.status, stencil: $.data.stencil }
          assert:
            - "status == 'ACTIVE'"
            - "stencil == 'W-X'"

      - name: oven_creation_rejects_invalid_holding_temp
        claim_type: type_constraints
        grounds: [entities.Oven.fields.holding_temp_c]
        distinguishing_aspect: "holding_temp_c outside [120, 300] rejected."
        test_recipe:
          setup: ["Shop exists"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SO", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV-BAD", holding_temp_c: 400, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: pqr_thickness_range_validation
        claim_type: type_constraints
        grounds: [entities.PQR.fields.thickness_range_max_mm, "errors[ERR_INVALID_THICKNESS_RANGE]"]
        distinguishing_aspect: "thickness_range_max_mm <= thickness_range_min_mm rejected at PQR approve."
        test_recipe:
          setup: ["Shop + DRAFT PQR with inverted thickness range"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SP", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-BAD", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 25, thickness_range_max_mm: 3, test_report_id: "TR-BAD" }
              as: QCManager
              captures: { pqr_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_THICKNESS_RANGE'"

      - name: weldment_system_fields_server_managed
        claim_type: system_fields
        grounds: [entities.Weldment]
        distinguishing_aspect: "Client-supplied id/created_at/version are ignored on creation; server mints UUID, version=1."
        test_recipe:
          setup: ["Shop + order + fixture reserved"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SY", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "FY", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-Y", customer_name: "Cust Y", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-Y", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { v: $.data.version, posture: $.data.posture }
          assert:
            - "v == 1 (server-managed)"
            - "posture == 'OPEN' (server-managed default)"

  # =========================================================================
  # Section 2: State Machines — invalid-from rejections, terminal lockdown
  # =========================================================================
  - section: state_machines
    instances:
      - name: pqr_approve_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PQR]
        distinguishing_aspect: "Approving an already-APPROVED PQR returns ERR_PQR_NOT_DRAFT."
        test_recipe:
          setup: ["Shop + APPROVED PQR"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ1", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q1", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q1" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_PQR_NOT_DRAFT'"

      - name: pqr_terminal_rejected_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PQR]
        distinguishing_aspect: "REJECTED PQR cannot be approved; approve returns ERR_PQR_NOT_DRAFT."
        test_recipe:
          setup: ["Shop + REJECTED PQR"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ2", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q2", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q2" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/reject"
              payload: {}
              as: QCManager
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_PQR_NOT_DRAFT'"

      - name: lot_rebake_from_in_oven_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ConsumableLot, "errors[ERR_LOT_NOT_QUARANTINED]"]
        distinguishing_aspect: "Rebaking a lot in IN_OVEN state returns ERR_LOT_NOT_QUARANTINED."
        test_recipe:
          setup: ["Shop + oven + lot in IN_OVEN"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ3", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV-Q3", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L-Q3", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots/${lot_id}/rebake"
              payload: {}
              as: MaterialController
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_LOT_NOT_QUARANTINED'"

      - name: lot_rebake_limit_enforced
        claim_type: violation_to_error
        grounds: [state_machines.ConsumableLot, "errors[ERR_LOT_REBAKE_LIMIT]"]
        distinguishing_aspect: "Lot with rebake_count == 1 cannot be rebaked again (AWS D1.1 single-rebake rule)."
        test_recipe:
          setup: ["Shop + oven + lot QUARANTINED with rebake_count already 1 (rebaked once, then re-quarantined via oven offline)"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ4", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "WQ4", full_name: "Welder Q4" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV-Q4", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L-Q4", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
            # First quarantine via oven offline
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/take-offline"
              payload: {}
              as: MaterialController
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/bring-online"
              payload: {}
              as: MaterialController
            # First rebake
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots/${lot_id}/rebake"
              payload: {}
              as: MaterialController
            # Re-issue and re-quarantine
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/take-offline"
              payload: {}
              as: MaterialController
            - call: "POST /weld-shop/shops/${shop_id}/ovens/${oven_id}/bring-online"
              payload: {}
              as: MaterialController
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots/${lot_id}/rebake"
              payload: {}
              as: MaterialController
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_LOT_REBAKE_LIMIT'"

      - name: qual_requalify_from_qualified_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WelderQualification, "errors[ERR_QUAL_NOT_LAPSED]"]
        distinguishing_aspect: "Requalify on QUALIFIED (not LAPSED) returns ERR_QUAL_NOT_LAPSED."
        test_recipe:
          setup: ["Shop + welder + QUALIFIED qualification"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ5", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "WQ5", full_name: "Welder Q5" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q5", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q5" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-Q5", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications"
              payload: { welder_id: "${welder_id}", wps_id: "${wps_id}", process: "SMAW", qualified_at_utc: "2026-08-01T00:00:00Z" }
              as: QCManager
              captures: { qual_id: $.data.id }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications/${qual_id}/requalify"
              payload: {}
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_QUAL_NOT_LAPSED'"

      - name: joint_weld_out_with_no_passes_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Joint, "errors[ERR_NO_WELD_PASSES]"]
        distinguishing_aspect: "weld-out on a joint with zero weld passes fails with ERR_NO_WELD_PASSES."
        test_recipe:
          setup: ["Joint in fabrication with no passes"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ6", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q6", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q6" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-Q6", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "FQ6", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-Q6", customer_name: "Cust Q6", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-Q6", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/joints"
              payload: { joint_number: "J-Q6", wps_id: "${wps_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/start-fabrication"
              payload: { expected_joint_version: "${j_v}" }
              as: WeldLead
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-out"
              payload: {}
              as: WeldLead
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_NO_WELD_PASSES'"

      - name: wps_approve_with_unapproved_pqr_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.WPS, "errors[ERR_PQR_NOT_APPROVED]"]
        distinguishing_aspect: "Approving WPS referencing a DRAFT PQR fails."
        test_recipe:
          setup: ["Shop + DRAFT PQR + DRAFT WPS referencing it"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ7", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q7", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q7" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-Q7", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_PQR_NOT_APPROVED'"

      - name: wps_approve_process_mismatch_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.WPS, "errors[ERR_WPS_PQR_PROCESS_MISMATCH]"]
        distinguishing_aspect: "WPS.process != PQR.process rejected."
        test_recipe:
          setup: ["Shop + APPROVED PQR (SMAW) + DRAFT WPS (GMAW) referencing it"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ8", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q8", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q8" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-Q8", revision: 1, pqr_id: "${pqr_id}", process: "GMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_WPS_PQR_PROCESS_MISMATCH'"

      - name: joint_start_fab_with_superseded_wps_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Joint, "errors[ERR_WPS_NOT_APPROVED]"]
        distinguishing_aspect: "start-fabrication referencing a SUPERSEDED WPS rejected with ERR_WPS_NOT_APPROVED."
        test_recipe:
          setup: ["Shop + WPS rev 1 APPROVED then SUPERSEDED by rev 2; joint created referencing rev 1"]
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "SQ9", aws_d1_1_revision: "D1.1:2025" }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-Q9", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-Q9" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-Q9", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r1_id: $.data.id, wps_r1_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r1_id}/approve"
              payload: { expected_wps_version: "${wps_r1_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-Q9", revision: 2, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r2_id: $.data.id, wps_r2_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r2_id}/approve"
              payload: { expected_wps_version: "${wps_r2_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "FQ9", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-Q9", customer_name: "Cust Q9", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-Q9", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_id: $.data.id }
            # Joint is created referencing rev 2 (rev 1 was superseded before joint was made);
            # to test the explicit rejection we craft joint against rev 1 by hand via creation-time binding is
            # forbidden by design (joint creation requires APPROVED WPS); instead, we test the rebind failure path.
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/joints"
              payload: { joint_number: "J-Q9", wps_id: "${wps_r2_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { j_id: $.data.id }
          trigger:
            # Attempt to rebind joint to the SUPERSEDED rev 1 (joint is PENDING, not ON_HOLD, so this
            # call would normally be invalid; the test observes the resulting error)
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/rebind-wps"
              payload: { new_wps_id: "${wps_r1_id}" }
              as: QCManager
              captures: { err: $.data.error_id }
          assert:
            - "err IN {'ERR_INVALID_STATE', 'ERR_WPS_NOT_APPROVED'} (either rebind precondition fires first)"

