# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2879 — Essential Air Service Subsidy Program
# 9 rule_ids / 25 instances. Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: payment_variant_divergence_on_identical_period_data
        grounds:
          - calculations.subsidy_payment_amount
          - entities.SubsidyPayment.fields.variant_used
          - entities.SubsidyPayment.fields.net_payment_usd
          - entities.ServiceAgreement.fields.payment_basis
        distinguishing_aspect: |
          This dual variant lives in the money-accounting domain on ServicePeriod/SubsidyPayment:
          the same reported month (104 scheduled, 91 completed, 5 carrier cancellations, 8 weather
          cancellations) settles at net_payment_usd 115096.03 under COMPLETED_FLIGHT_PRORATION and
          118750.00 under SCHEDULED_FLIGHT_FLAT, a divergence of exactly 3653.97.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Community HYS, ELIGIBLE, distance band CAPPED, cap 200.00, min 12 weekly round trips and 400 weekly seats."
            - "One ACTIVE agreement at annual_subsidy_usd 1600000.00 on payment_basis COMPLETED_FLIGHT_PRORATION, term 24 months."
            - "Its 2026-08 ServicePeriod is REPORTED with 104 / 91 / 5 / 8 departures, 1729 seats offered and 620 passengers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "sole compliant proposal" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /eas/service-periods"
              payload: { agreement_id: "${agr_id}", period_month: "2026-08" }
              as: ProgramAdmin
              captures: { per1_id: $.data.id }
            - call: "POST /eas/service-periods/${per1_id}/report"
              payload: { scheduled_departures: 104, completed_departures: 91, cancelled_carrier_departures: 5, cancelled_weather_departures: 8, seats_offered: 1729, passengers_enplaned: 620 }
              as: Carrier
              as_user_id: "${car1_id}"
          trigger:
            - call: "GET /eas/service-periods/${per1_id}/payment-preview"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eas/service-periods/${per1_id}/certify"
              payload: { certification_note: "August 2026 settlement" }
              as: ProgramAdmin
            - call: "GET /eas/subsidy-payments"
              payload: { service_period_id: "${per1_id}" }
              as: ProgramAdmin
              captures: { pay1_id: "$.data[0].id" }
          assert:
            - "GET /eas/service-periods/${per1_id}/payment-preview -> data.per_departure_rate_usd == 1282.05"
            - "GET /eas/service-periods/${per1_id}/payment-preview -> data.credited_departures == 96"
            - "GET /eas/service-periods/${per1_id}/payment-preview -> data.completed_flight_proration_net_usd == 115096.03"
            - "GET /eas/service-periods/${per1_id}/payment-preview -> data.scheduled_flight_flat_net_usd == 118750.00"
            - "GET /eas/service-periods/${per1_id}/payment-preview -> data.divergence_usd == 3653.97"
            - "SubsidyPayment.${pay1_id}.variant_used == COMPLETED_FLIGHT_PRORATION"
            - "SubsidyPayment.${pay1_id}.monthly_entitlement_usd == 133333.33"
            - "SubsidyPayment.${pay1_id}.gross_subsidy_usd == 123076.80"
            - "SubsidyPayment.${pay1_id}.cancellation_adjustment_usd == 1923.08"
            - "SubsidyPayment.${pay1_id}.withholding_pct == 0.05"
            - "SubsidyPayment.${pay1_id}.performance_withholding_usd == 6057.69"
            - "SubsidyPayment.${pay1_id}.net_payment_usd == 115096.03"
            - "SubsidyPayment.${pay1_id}.hold_in_premium_usd == 0.00"

      - name: completion_factor_basis_flips_carrier_tier
        grounds:
          - calculations.carrier_completion_factor
          - calculations.carrier_performance_scoring
          - entities.PerformanceReview.fields.basis
          - entities.Carrier.fields.latest_performance_tier
