            - { call: "GET /invoices/${inv}", as: BillingAdmin, captures: { pd1: $.data.past_due } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-23T09:00:00Z" }, as: PlatformAdmin }
