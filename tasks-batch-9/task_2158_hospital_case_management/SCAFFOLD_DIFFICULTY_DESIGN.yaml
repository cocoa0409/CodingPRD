          setup:
            - "Payer with no authorization requirement; patient produces no auto-barriers"
            - "One manually recorded BED_AVAILABILITY barrier opened at 2026-08-01T00:00:00Z with delay_reason_code AWAITING_BED (the only barrier on the episode)"
            - "A SNF Referral in CHOICE_PENDING with a single OFFERED bed offer from Cedar SNF"
