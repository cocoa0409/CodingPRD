          assert:
            - "${setup_result} == PASS, ${risk_initial} == 6.00 and ${variant_initial} == INITIAL_ASSESSMENT: 0.30 x factor_flow 20 with every other factor at 0"
            - "${tier_1} == TIER_3 at a 14-minute gap and ${status_1} == PLACED: one minute below the TIER_2 threshold, the placement stays in service"
            - "${tier_2} == TIER_2 at exactly 15 minutes (${status_2} == PLACED) and ${tier_3} == TIER_2 at 59 minutes: the whole 15..59 band is one tier"
            - "${tier_4} == TIER_1 at exactly 60 minutes, with ${status_4} == REMOVED and ${reason_4} == MALFUNCTION, and EquipmentUnit.${u_port}.status == IN_QUARANTINE with quarantine_reason MALFUNCTION"
            - "${tier_5} == TIER_1 on a 0-minute gap: the NO_FLOW symptom alone forces the top tier, and ${status_5} == REMOVED"
            - "${risk_1} == 35.00, ${risk_2} == 65.00, ${risk_3} == 95.00, and ONGOING risk stays 100.00 after the fourth and fifth reports: the score is max(factors) + 5 per additional non-zero factor, not a weighted average"
            - "${hold_1} == false, ${hold_2} == false, ${hold_3} == true: compliance_hold flips exactly when the score first reaches 70.00, which happens on the third report even though no single report was severe"
