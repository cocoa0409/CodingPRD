scenario: |
  Generate task harder than expert level!

  2707. Shelf Label & Price Accuracy Compliance (retail store price integrity): price change file
  distribution with effective dates and store-level execution tasks, shelf label printing, placement
  verification and audit scanning by aisle, scanner accuracy audits comparing shelf price to register
  price with error rate thresholds, unit price display requirements by jurisdiction with formatting
  and unit-of-measure rules, promotional signage compliance with required disclosures and expiration
  removal, regulatory inspection response with penalty exposure and refund policies for overcharges,
  associate training and accountability for label maintenance, exception reporting on high-error
  categories and root cause remediation

domain_name: shelf-label-price-accuracy-compliance
api_prefix: "/price-integrity"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked exclusively by explicit FK fields. Only four convenience
  # sub-resource paths exist (`/stores/{id}/aisles`, `/stores/{id}/associates`,
  # `/price-change-files/{id}/lines`, `/scanner-audits/{id}/scan-lines`,
  # `/regulatory-inspections/{id}/findings`, `/associates/{id}/...`); every other
  # relationship is expressed as an FK field plus a filtered list endpoint, and no
  # entity owns another's lifecycle.

  state_machine_shape: parallel
  # LabelTask carries two independent state dimensions (print_status x placement_status);
  # ScannerAudit and RegulatoryInspection are cyclic (CLOSED->REOPENED->SCANNING->CLOSED,
  # RESPONSE_SUBMITTED->RESPONSE_REJECTED->RESPONSE_SUBMITTED); InspectionFinding is
  # branching (OPEN->{REMEDIATION_PLANNED, WAIVED, ESCALATED}) with divergent side-effect
  # sets per branch; Store.compliance_posture is a derived aggregate that gates children.

  relationship_patterns:
    - one_to_many          # Store -> Aisle/Associate/LabelTask; PriceChangeFile -> PriceChangeLine
    - cross_aggregate      # LabelTask spans Store, Aisle, PriceChangeLine, Associate
    - self_referential     # PriceChangeFile.superseded_by_file_id -> PriceChangeFile.id
    - polymorphic: false

  role_model: segregation_of_duties
  # The associate who records a label placement may never verify it; the auditor who closed
  # the evidence audit may never own the exception report's remediation. Roles are additionally
  # partitioned by Associate.role_code (LABEL_ASSOCIATE / PRICE_AUDITOR / STORE_MANAGER).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 68 endpoints / 66 error codes / 12 calculations (2 dual-variant, 3 combinatorial
  # modes) / 11 state machines (cyclic audit and inspection loops, one parallel two-axis machine,
  # one branching finding machine) / 35 validation rules / 6 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    description: "Configuration entity holding the regulatory ruleset a Store is governed by."
    fields:
      - name: code
        type: string
        source: input
        description: "Jurisdiction short code, e.g. CA-STATE."
        constraints: "globally unique, 2-16 chars, uppercase letters/digits/hyphen"
      - name: name
        type: string
        source: input
        description: "Human-readable jurisdiction name."
      - name: unit_price_required
        type: boolean
        source: input
        default: true
        description: "When true, every PriceChangeLine must be able to produce a unit price display."
      - name: unit_price_uom_rule
        type: enum
        source: input
        default: PER_UNIT_MEASURE_CANONICAL
        description: "Basis rule used by calculations.unit_price_display."
        constraints: "one of {PER_UNIT_MEASURE_CANONICAL, PER_100_COUNT, PER_SINGLE_ITEM}"
      - name: unit_price_decimal_places
        type: integer
        source: input
        default: 2
        description: "Decimal places of the DOLLAR figure printed on the shelf label."
        constraints: "2 or 3"
      - name: unit_price_rounding
        type: enum
        source: input
        default: ROUND_HALF_UP
        description: "Rounding mode applied at the single rounding step of unit_price_display."
        constraints: "one of {ROUND_HALF_UP, ROUND_CEILING}"
      - name: scanner_error_rate_threshold_pct
        type: number
        source: input
        default: 2.0
        description: "Inclusive FAIL threshold for ScannerAudit.error_rate_pct (>= fails)."
        constraints: "> 0 and <= 100, at most 2 decimals"
      - name: default_rate_variant
        type: enum
        source: input
        default: GROSS_MISMATCH
        description: "Variant used by POST /scanner-audits/{id}/close when rate_variant is omitted."
        constraints: "one of {GROSS_MISMATCH, NET_OVERCHARGE}"
      - name: overcharge_refund_policy
        type: enum
        source: input
        default: REFUND_DIFFERENCE_ONLY
        description: "Branch selector of calculations.refund_claim_amount."
        constraints: "one of {REFUND_DIFFERENCE_ONLY, REFUND_DIFFERENCE_PLUS_FIXED, ITEM_FREE_UP_TO_CAP}"
      - name: refund_fixed_bonus_cents
        type: integer
        source: input
        default: 0
        description: "Fixed goodwill amount added under REFUND_DIFFERENCE_PLUS_FIXED."
        constraints: ">= 0"
      - name: refund_cap_cents
        type: integer
        source: input
        default: 5000
        description: "Per-claim ceiling applied to every refund policy branch."
        constraints: "> 0"
      - name: refund_budget_per_audit_cents
        type: integer
        source: input
        default: 100000
        description: "Aggregate ceiling on non-DENIED RefundClaim amounts tied to one ScannerAudit."
        constraints: "> 0"
      - name: penalty_per_violation_cents
        type: integer
        source: input
        default: 5000
        description: "Base per-violation penalty unit used by calculations.penalty_exposure."
        constraints: "> 0"
      - name: penalty_max_cents
        type: integer
        source: input
        default: 2000000
        description: "Hard cap on RegulatoryInspection.penalty_exposure_cents."
        constraints: "> 0"
      - name: signage_disclosure_codes
        type: array
        source: input
        default: []
        description: "Disclosure codes every PromoSignage must carry, e.g. [UNIT_PRICE, END_DATE]."
        constraints: "array of strings, no duplicates"
      - name: grace_period_hours
        type: integer
        source: input
        default: 48
        description: "Hours after PriceChangeFile.effective_date before a LabelTask becomes overdue."
        constraints: ">= 0"
      - name: accountability_variant
        type: enum
        source: input
        default: OCCURRENCE_WEIGHTED
        description: "Variant selector of calculations.associate_accountability_score."
        constraints: "one of {OCCURRENCE_WEIGHTED, TASK_WEIGHTED}"

  - name: Store
    parent: null
    common_fields: true
    description: "A retail store. Carries the derived compliance_posture that gates child operations."
    fields:
      - name: store_number
        type: string
        source: input
        description: "Operator-assigned store number."
        constraints: "globally unique, 1-16 chars"
      - name: name
        type: string
        source: input
        description: "Store display name."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the regulatory ruleset governing this store."
      - name: compliance_posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived gate produced by calculations.store_compliance_posture."
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: label_backlog_count
        type: integer
        source: computed
        default: 0
        description: "Conserved counter; see calculations.store_label_backlog_count."
      - name: open_finding_count
        type: integer
        source: computed
        default: 0
        description: "Count of this store's InspectionFinding rows in {OPEN, REMEDIATION_PLANNED}."
      - name: escalated_finding_count
        type: integer
        source: computed
        default: 0
        description: "Count of this store's InspectionFinding rows with status == ESCALATED."
      - name: failed_audit_count_30d
        type: integer
        source: computed
        default: 0
        description: "Closed ScannerAudits with outcome FAIL and closed_at >= clock_now - 30 days."
      - name: signage_violation_count
        type: integer
        source: computed
        default: 0
        description: "PromoSignage rows in {EXPIRED_PENDING_REMOVAL, NON_COMPLIANT} for this store."
      - name: refund_liability_outstanding_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved money; sum of claimed_amount_cents over claims in {PENDING, APPROVED}."
      - name: refund_paid_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of claimed_amount_cents over this store's RefundClaim rows with status PAID."
      - name: cumulative_penalty_exposure_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of assessed_penalty_cents over this store's CLOSED RegulatoryInspections."
      - name: executed_file_count
        type: integer
        source: computed
        default: 0
        description: "Count of PriceChangeFiles that reached EXECUTED with this store in scope."

  - name: Aisle
    parent: null
    common_fields: true
    description: "An audit-scannable aisle of a Store; the resource occupied by ScannerAudit windows."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; owning store, taken from the path segment."
      - name: aisle_code
        type: string
        source: input
        description: "Aisle label, e.g. A07."
        constraints: "unique per store_id, 1-8 chars"
      - name: category_code
        type: string
        source: input
        description: "Merchandising category audited in this aisle, e.g. DAIRY."
        constraints: "1-24 chars, uppercase"
      - name: assigned_associate_id
        type: string
        source: input
        default: null
        description: "FK -> Associate.id; nullable; the label-maintenance owner held accountable for this aisle."
      - name: last_audit_closed_at
        type: datetime
        source: system
        default: null
        description: "closed_at of the most recently CLOSED ScannerAudit on this aisle."

  - name: Associate
    parent: null
    common_fields: true
    description: "A store employee. Backs the StoreManager, LabelAssociate and PriceAuditor roles."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this associate works at."
      - name: employee_number
        type: string
        source: input
        description: "Employee number."
        constraints: "unique per store_id"
      - name: full_name
        type: string
        source: input
        description: "Associate name."
      - name: role_code
        type: enum
        source: input
        description: "Which acting role this associate may present in X-User-Role."
        constraints: "one of {LABEL_ASSOCIATE, PRICE_AUDITOR, STORE_MANAGER}"
      - name: training_status
        type: enum
        source: system
        default: UNTRAINED
        description: "Training lifecycle; see state_machines.Associate."
        constraints: "one of {UNTRAINED, IN_TRAINING, CERTIFIED, SUSPENDED}"
      - name: certification_expires_at
        type: datetime
        source: computed
        default: null
        description: "Set to the training completion instant + CERTIFICATION_VALID_DAYS on reaching CERTIFIED."
      - name: last_training_module_code
        type: string
        source: system
        default: null
        description: "module_code of the most recent training completion."
      - name: last_training_score_pct
        type: number
        source: system
        default: null
        description: "score_pct of the most recent training completion."
      - name: accountability_score
        type: number
        source: computed
        default: 100
        description: "Derived from AccountabilityAction rows; see calculations.associate_accountability_score."
      - name: issued_action_count
        type: integer
        source: computed
        default: 0
        description: "Count of this associate's AccountabilityAction rows with status ISSUED."
      - name: verified_placement_count
        type: integer
        source: computed
        default: 0
        description: "Count of LabelTask rows with placed_by_associate_id == this id and placement_status VERIFIED."

  - name: PriceChangeFile
    parent: null
    common_fields: true
    description: "A dated batch of retail price changes distributed to stores; OCC parent for label tasking."
    fields:
      - name: file_number
        type: string
        source: input
        description: "Operator-assigned file number."
        constraints: "globally unique, 1-24 chars"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; unit-price and grace rules applied to every line of this file."
      - name: effective_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the new retails become legally binding at shelf."
      - name: priority
        type: enum
        source: input
        default: ROUTINE
        description: "Distribution priority; REGULATORY files bypass the FROZEN posture gate."
        constraints: "one of {ROUTINE, COMPETITIVE, REGULATORY}"
      - name: scope_store_ids
        type: array
        source: input
        description: "Ids of the Stores this file is distributed to; each must reference an existing Store."
        constraints: "1-20 entries, no duplicates, every entry an existing Store.id"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Distribution lifecycle; see state_machines.PriceChangeFile."
        constraints: "one of {DRAFT, DISTRIBUTED, PARTIALLY_EXECUTED, EXECUTED, SUPERSEDED}"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Count of PriceChangeLine rows with price_change_file_id == this id and line_status != WITHDRAWN."
      - name: verified_line_count
        type: integer
        source: computed
        default: 0
        description: "Count of this file's PriceChangeLine rows with line_status == VERIFIED."
      - name: distributed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the DRAFT -> DISTRIBUTED transition."
      - name: superseded_by_file_id
        type: string
        source: system
        default: null
        description: "FK -> PriceChangeFile.id; nullable; set on the loser of a supersede."

  - name: PriceChangeLine
    parent: null
    common_fields: true
    description: "One item's price change inside a file; owns the jurisdiction-formatted unit price."
    fields:
      - name: price_change_file_id
        type: string
        source: input
        description: "FK -> PriceChangeFile.id; owning file, taken from the path segment."
      - name: item_upc
        type: string
        source: input
        description: "Item UPC."
        constraints: "8-14 digits, unique per price_change_file_id"
      - name: item_description
        type: string
        source: input
        description: "Item description printed on the shelf label."
      - name: category_code
        type: string
        source: input
        description: "Merchandising category, matched against Aisle.category_code for exception reporting."
        constraints: "1-24 chars, uppercase"
      - name: old_retail_cents
        type: integer
        source: input
        description: "Retail in effect before this change."
        constraints: ">= 0"
      - name: new_retail_cents
        type: integer
        source: input
        description: "Retail that becomes binding at effective_date."
        constraints: "> 0"
      - name: net_content_qty
        type: number
        source: input
        description: "Net content quantity used as the unit-price denominator. 0 is accepted (unpriceable bulk/variable-weight items) and leaves the three unit-price fields null."
        constraints: ">= 0, at most 3 decimals"
      - name: net_content_uom
        type: enum
        source: input
        description: "Unit of measure of net_content_qty."
        constraints: "one of {EACH, OZ, FL_OZ, LB, GAL, CT}"
      - name: promo_flag
        type: boolean
        source: input
        default: false
        description: "True when this line backs a promotion requiring PromoSignage."
      - name: line_status
        type: enum
        source: system
        default: PENDING
        description: "Store execution lifecycle; see state_machines.PriceChangeLine."
        constraints: "one of {PENDING, TASKED, LABELED, VERIFIED, FAILED, WITHDRAWN}"
      - name: unit_price_display_cents
        type: number
        source: computed
        default: null
        description: "Output of calculations.unit_price_display, in cents per basis unit."
      - name: unit_price_basis_qty
        type: number
        source: computed
        default: null
        description: "Exact denominator used by calculations.unit_price_display (never rounded)."
      - name: unit_price_basis_uom
        type: string
        source: computed
        default: null
        description: "Canonical basis unit label printed on the label, e.g. LB / GAL / 100CT / EACH."

  - name: LabelTask
    parent: null
    common_fields: true
    description: "Store-level execution task for one price change line: print, place, verify. Two independent state axes."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store executing this task."
      - name: price_change_line_id
        type: string
        source: input
        description: "FK -> PriceChangeLine.id; the line whose shelf label must be replaced."
      - name: aisle_id
        type: string
        source: input
        description: "FK -> Aisle.id; the aisle holding the shelf tag."
      - name: assigned_associate_id
        type: string
        source: input
        description: "FK -> Associate.id; the LABEL_ASSOCIATE scheduled to execute the task."
      - name: placed_by_associate_id
        type: string
        source: system
        default: null
        description: "FK -> Associate.id; nullable; X-User-ID of the associate that recorded the placement."
      - name: verified_by_associate_id
        type: string
        source: system
        default: null
        description: "FK -> Associate.id; nullable; X-User-ID of the PRICE_AUDITOR that verified the placement."
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Start of the labor interval this task occupies on the assigned associate."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "End of the labor interval; must be strictly after scheduled_start_at."
      - name: print_status
        type: enum
        source: system
        default: NOT_PRINTED
        description: "Printing axis; evolves independently of placement_status."
        constraints: "one of {NOT_PRINTED, PRINTED, REPRINT_REQUIRED}"
      - name: placement_status
        type: enum
        source: system
        default: UNPLACED
        description: "Placement/verification axis; evolves independently of print_status."
        constraints: "one of {UNPLACED, PLACED, VERIFIED, REJECTED}"
      - name: printed_label_serial
        type: string
        source: system
        default: null
        description: "Serial minted on the NOT_PRINTED/REPRINT_REQUIRED -> PRINTED transition."
      - name: due_at
        type: datetime
        source: computed
        default: null
        description: "Output of calculations.label_task_due_at."
      - name: overdue
        type: boolean
        source: computed
        default: false
        description: "True when clock_now >= due_at and placement_status IN {UNPLACED, REJECTED}."
      - name: placed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent UNPLACED/REJECTED -> PLACED transition."
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the PLACED -> VERIFIED transition."
      - name: rejection_count
        type: integer
        source: system
        default: 0
        description: "Number of times verification rejected this placement."
      - name: observed_shelf_price_cents
        type: integer
        source: system
        default: null
        description: "Shelf price the verifier read off the tag during verification."

  - name: ScannerAudit
    parent: null
    common_fields: true
    description: "Aisle-level scanner accuracy audit comparing shelf price to register price. OCC parent for refund claims."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; audited store."
      - name: aisle_id
        type: string
        source: input
        description: "FK -> Aisle.id; audited aisle; the resource whose scan window is occupied."
      - name: auditor_associate_id
        type: string
        source: input
        description: "FK -> Associate.id; the PRICE_AUDITOR conducting the audit."
      - name: audit_type
        type: enum
        source: input
        description: "Audit trigger class; ROUTINE audits are blocked while the store is FROZEN."
        constraints: "one of {ROUTINE, FOLLOW_UP, REGULATORY}"
      - name: scan_window_start
        type: datetime
        source: input
        description: "Inclusive start of the aisle occupation interval."
      - name: scan_window_end
        type: datetime
        source: input
        description: "Exclusive end of the aisle occupation interval; must be strictly after scan_window_start."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Audit lifecycle; cyclic through REOPENED. See state_machines.ScannerAudit."
        constraints: "one of {OPEN, SCANNING, CLOSED, REOPENED}"
      - name: outcome
        type: enum
        source: system
        default: PENDING
        description: "Threshold verdict stamped at close."
        constraints: "one of {PENDING, PASS, FAIL}"
      - name: sample_size
        type: integer
        source: computed
        default: 0
        description: "Count of ScanLine rows with scanner_audit_id == this id."
      - name: overcharge_count
        type: integer
        source: computed
        default: 0
        description: "Count of this audit's ScanLine rows with classification OVERCHARGE."
      - name: undercharge_count
        type: integer
        source: computed
        default: 0
        description: "Count of this audit's ScanLine rows with classification UNDERCHARGE."
      - name: gross_error_rate_pct
        type: number
        source: computed
        default: null
        description: "GROSS_MISMATCH variant of calculations.scanner_audit_error_rate; always stored at close."
      - name: net_overcharge_rate_pct
        type: number
        source: computed
        default: null
        description: "NET_OVERCHARGE variant of calculations.scanner_audit_error_rate; always stored at close."
      - name: error_rate_pct
        type: number
        source: computed
        default: null
        description: "The applied variant's rate; the only rate compared against the jurisdiction threshold."
      - name: rate_variant_applied
        type: enum
        source: system
        default: null
        description: "Which variant produced error_rate_pct."
        constraints: "one of {GROSS_MISMATCH, NET_OVERCHARGE} or null before close"
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent transition into CLOSED."
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: "Number of times this audit has been reopened."

  - name: ScanLine
    parent: null
    common_fields: false
    description: "Immutable scan observation: shelf price vs register price for one item. Append-only evidence."
    fields:
      - name: scanner_audit_id
        type: string
        source: input
        description: "FK -> ScannerAudit.id; owning audit, taken from the path segment."
      - name: item_upc
        type: string
        source: input
        description: "Scanned item UPC."
        constraints: "8-14 digits, unique per scanner_audit_id"
      - name: shelf_price_cents
        type: integer
        source: input
        description: "Price read from the shelf label."
        constraints: ">= 0"
      - name: register_price_cents
        type: integer
        source: input
        description: "Price returned by the register scan."
        constraints: ">= 0"
      - name: variance_cents
        type: integer
        source: computed
        description: "register_price_cents - shelf_price_cents."
      - name: classification
        type: enum
        source: computed
        description: "MATCH when variance_cents == 0, OVERCHARGE when > 0, UNDERCHARGE when < 0."
        constraints: "one of {MATCH, OVERCHARGE, UNDERCHARGE}"
      - name: category_code
        type: string
        source: computed
        description: "Copied from the owning audit's Aisle.category_code at scan time; the exception-report grouping key."

  - name: PromoSignage
    parent: null
    common_fields: true
    description: "A promotional sign posted in an aisle, carrying required disclosures and an expiration."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store where the sign hangs."
      - name: aisle_id
        type: string
        source: input
        description: "FK -> Aisle.id; aisle where the sign hangs."
      - name: price_change_line_id
        type: string
        source: input
        default: null
        description: "FK -> PriceChangeLine.id; nullable; the promo price line this sign advertises."
      - name: sign_code
        type: string
        source: input
        description: "Sign template code, e.g. ENDCAP-2UP."
        constraints: "1-24 chars"
      - name: promo_start_at
        type: datetime
        source: input
        description: "Inclusive start of the advertised promotion."
      - name: promo_end_at
        type: datetime
        source: input
        description: "Exclusive end of the advertised promotion; must be strictly after promo_start_at."
      - name: disclosure_codes
        type: array
        source: input
        description: "Disclosure codes actually printed on the sign."
        constraints: "array of strings, no duplicates"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Signage lifecycle; see state_machines.PromoSignage."
        constraints: "one of {DRAFT, POSTED, EXPIRED_PENDING_REMOVAL, NON_COMPLIANT, REMOVED}"
      - name: posted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent transition into POSTED."
      - name: removed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the transition into REMOVED."
      - name: missing_disclosure_codes
        type: array
        source: computed
        default: []
        description: "jurisdiction.signage_disclosure_codes minus disclosure_codes, ordered as declared on the jurisdiction."
      - name: compliance_state
        type: enum
        source: computed
        default: NOT_APPLICABLE
        description: "Derived signage verdict; see calculations.signage_compliance_state."
        constraints: "one of {COMPLIANT, MISSING_DISCLOSURE, EXPIRED_NOT_REMOVED, NOT_APPLICABLE}"

  - name: RegulatoryInspection
    parent: null
    common_fields: true
    description: "A regulator visit keyed to one evidence audit; carries penalty exposure and refund credit. OCC parent for responses."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; inspected store."
      - name: scanner_audit_id
        type: string
        source: input
        description: "FK -> ScannerAudit.id; the audit used as evidence; must be CLOSED before findings issue."
      - name: inspector_ref
        type: string
        source: input
        description: "Regulator inspector reference string."
      - name: inspection_date
        type: datetime
        source: input
        description: "Date of the inspection visit."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Inspection lifecycle; cyclic through RESPONSE_REJECTED. See state_machines.RegulatoryInspection."
        constraints: "one of {SCHEDULED, FINDINGS_ISSUED, RESPONSE_SUBMITTED, RESPONSE_REJECTED, CLOSED}"
      - name: finding_count
        type: integer
        source: computed
        default: 0
        description: "Count of InspectionFinding rows with regulatory_inspection_id == this id and status != WAIVED."
      - name: penalty_exposure_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.penalty_exposure."
      - name: refund_liability_cents
        type: integer
        source: computed
        default: 0
        description: "Step 2 of calculations.inspection_net_settlement."
      - name: refund_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Step 3 of calculations.inspection_net_settlement."
      - name: assessed_penalty_cents
        type: integer
        source: computed
        default: null
        description: "Step 4 of calculations.inspection_net_settlement; stamped when the inspection reaches CLOSED."
      - name: response_round
        type: integer
        source: system
        default: 0
        description: "Number of responses submitted; incremented on each transition into RESPONSE_SUBMITTED."
      - name: remediation_summary
        type: string
        source: system
        default: null
        description: "Latest response narrative submitted by the store."
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the transition into CLOSED."

  - name: InspectionFinding
    parent: null
    common_fields: true
    description: "One regulator finding. Branching lifecycle with divergent side effects per branch."
    fields:
      - name: regulatory_inspection_id
        type: string
        source: input
        description: "FK -> RegulatoryInspection.id; owning inspection, taken from the path segment."
      - name: finding_code
        type: enum
        source: input
        description: "What the regulator cited."
        constraints: "one of {SHELF_TAG_MISMATCH, UNIT_PRICE_FORMAT, SIGNAGE_DISCLOSURE, EXPIRED_SIGNAGE, SCANNER_ERROR_RATE}"
      - name: severity
        type: enum
        source: input
        description: "Severity driving the penalty weight."
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: affected_item_count
        type: integer
        source: input
        description: "Items cited under this finding; capped by PENALTY_ITEM_CAP in the penalty formula."
        constraints: ">= 1"
      - name: affected_aisle_code
        type: string
        source: input
        default: null
        description: "Free-text aisle_code the regulator cited; nullable; not a foreign key."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Finding lifecycle; see state_machines.InspectionFinding."
        constraints: "one of {OPEN, REMEDIATION_PLANNED, REMEDIATED, WAIVED, ESCALATED}"
      - name: penalty_component_cents
        type: integer
        source: computed
        default: 0
        description: "Per-finding raw component of calculations.penalty_exposure before tier scaling and cap."
      - name: remediation_action_code
        type: string
        source: system
        default: null
        description: "action_code recorded on the OPEN -> REMEDIATION_PLANNED transition."
      - name: remediation_evidence_ref
        type: string
        source: system
        default: null
        description: "evidence_ref recorded on the REMEDIATION_PLANNED -> REMEDIATED transition."
      - name: waiver_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the OPEN -> WAIVED transition."

  - name: RefundClaim
    parent: null
    common_fields: true
    description: "Customer overcharge refund tied to one immutable scan line; the conserved money quantity."
    fields:
      - name: scan_line_id
        type: string
        source: input
        description: "FK -> ScanLine.id; the overcharge evidence this claim settles."
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; resolved from scan_line -> ScannerAudit.store_id at creation."
      - name: customer_ref
        type: string
        source: input
        description: "Customer reference supplied by the service desk."
      - name: claimed_amount_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.refund_claim_amount."
      - name: policy_applied
        type: enum
        source: computed
        description: "The jurisdiction.overcharge_refund_policy branch used at creation."
        constraints: "one of {REFUND_DIFFERENCE_ONLY, REFUND_DIFFERENCE_PLUS_FIXED, ITEM_FREE_UP_TO_CAP}"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Claim lifecycle; see state_machines.RefundClaim."
        constraints: "one of {PENDING, APPROVED, PAID, DENIED}"
      - name: denial_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the transition into DENIED."
      - name: paid_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the APPROVED -> PAID transition."

  - name: ExceptionReport
    parent: null
    common_fields: true
    description: "Period roll-up of a store's audit errors by category, with root-cause remediation ownership."
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; reported store."
      - name: period_start_at
        type: datetime
        source: input
        description: "Inclusive start of the reporting window."
      - name: period_end_at
        type: datetime
        source: input
        description: "Exclusive end of the reporting window; must be strictly after period_start_at."
      - name: audit_count
        type: integer
        source: computed
        default: 0
        description: "Qualifying CLOSED ScannerAudits inside the window."
      - name: scan_line_count
        type: integer
        source: computed
        default: 0
        description: "ScanLine rows belonging to those qualifying audits."
      - name: top_category_code
        type: string
        source: computed
        default: null
        description: "Winner of calculations.exception_report_category_ranking."
      - name: top_category_error_rate_pct
        type: number
        source: computed
        default: null
        description: "The winning category's error rate."
      - name: category_breakdown
        type: array
        source: computed
        default: []
        description: "Ranked array of { category_code, sample_size, error_count, error_rate_pct } objects."
      - name: root_cause_code
        type: enum
        source: system
        default: null
        description: "Root cause assigned by the compliance officer."
        constraints: "one of {LABEL_NOT_PLACED, LABEL_PRINT_ERROR, FILE_LATE_DISTRIBUTION, SIGNAGE_NOT_REMOVED, REGISTER_FILE_MISMATCH, TRAINING_GAP} or null"
      - name: remediation_owner_associate_id
        type: string
        source: system
        default: null
        description: "FK -> Associate.id; nullable; owner assigned with the root cause."
      - name: status
        type: enum
        source: system
        default: GENERATED
        description: "Report lifecycle; see state_machines.ExceptionReport."
        constraints: "one of {GENERATED, REMEDIATION_OPEN, CLOSED}"
      - name: closure_note
        type: string
        source: system
        default: null
        description: "Narrative recorded at closure."

  - name: AccountabilityAction
    parent: null
    common_fields: true
    description: "Coaching / discipline record against an associate; the conserved accountability-score quantity."
    fields:
      - name: associate_id
        type: string
        source: input
        description: "FK -> Associate.id; the accountable associate."
      - name: trigger_code
        type: enum
        source: input
        description: "Why the action was issued."
        constraints: "one of {AUDIT_FAIL, OVERDUE_LABEL_TASK, VERIFICATION_REJECTED, INSPECTION_FINDING, EXCEPTION_ROOT_CAUSE}"
      - name: action_type
        type: enum
        source: input
        description: "Severity of the action; drives score_weight."
        constraints: "one of {COACHING, WRITTEN_WARNING, RETRAINING_ASSIGNED, SUSPENSION}"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: "Action lifecycle; see state_machines.AccountabilityAction."
        constraints: "one of {ISSUED, COMPLETED, VOIDED}"
      - name: score_weight
        type: integer
        source: computed
        default: 0
        description: "ACTION_WEIGHTS[action_type]; counted against the associate only while status == ISSUED."
      - name: source_ref
        type: string
        source: input
        default: null
        description: "Free-text pointer to the triggering artifact, e.g. a ScannerAudit id string. Not a foreign key."
      - name: issued_by_ref
        type: string
        source: system
        description: "X-User-ID of the issuing manager, or the literal string 'system' for cascade-issued actions."
      - name: void_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the transition into VOIDED."

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: PriceChangeFile
    initial_state: DRAFT
    terminal_states: [EXECUTED, SUPERSEDED]
    shape: compound
    transitions:
      - from: DRAFT
        to: DISTRIBUTED
        trigger: "POST /price-integrity/price-change-files/{id}/distribute"
        actor: PricingAdmin
        preconditions:
          - "status == DRAFT"
          - "line_count >= 1 (else ERR_FILE_HAS_NO_LINES)"
          - "when jurisdiction.unit_price_required == true, every PriceChangeLine of this file has a resolvable unit-price basis (else ERR_UNIT_PRICE_UNAVAILABLE)"
        side_effects:
          - "distributed_at = clock_now"
          - "for every PriceChangeLine of this file with line_status != WITHDRAWN, recompute calculations.unit_price_display and store unit_price_display_cents, unit_price_basis_qty, unit_price_basis_uom"
          - "increments PriceChangeFile.version by 1"
      - from: DISTRIBUTED
        to: PARTIALLY_EXECUTED
        trigger: "system — first LabelTask created for any line of this file via POST /price-integrity/price-change-files/{id}/label-tasks"
        actor: system
        preconditions: ["status == DISTRIBUTED"]
        side_effects:
          - "no field other than status, updated_at and version changes on the file itself"
        note: "Auto-transition; the LabelTask create call is the only trigger."
      - from: PARTIALLY_EXECUTED
        to: EXECUTED
        trigger: "system — cascade hop 3: a PriceChangeLine of this file transitions LABELED -> VERIFIED and makes verified_line_count == line_count"
        actor: system
        preconditions:
          - "status == PARTIALLY_EXECUTED"
          - "line_count >= 1 AND verified_line_count == line_count"
        side_effects:
          - "cascade hop 4: for every Store whose id is in scope_store_ids, executed_file_count += 1, then label_backlog_count is recomputed via calculations.store_label_backlog_count, then compliance_posture is recomputed via calculations.store_compliance_posture"
      - from: DISTRIBUTED
        to: SUPERSEDED
        trigger: "POST /price-integrity/price-change-files/{id}/supersede"
        actor: PricingAdmin
        preconditions:
          - "status IN {DISTRIBUTED, PARTIALLY_EXECUTED}"
          - "superseded_by_file_id references a different PriceChangeFile with the same jurisdiction_id, status IN {DRAFT, DISTRIBUTED} and effective_date >= this file's effective_date (else ERR_SUPERSEDING_FILE_INVALID)"
        side_effects:
          - "superseded_by_file_id = the supplied superseded_by_file_id"
          - "every PriceChangeLine of this file with line_status != VERIFIED transitions to WITHDRAWN"
          - "for each withdrawn line, every LabelTask with placement_status != VERIFIED gets print_status = REPRINT_REQUIRED"
          - "for each affected Store, label_backlog_count is recomputed, then compliance_posture is recomputed"
          - "increments PriceChangeFile.version by 1"
      - from: PARTIALLY_EXECUTED
        to: SUPERSEDED
        trigger: "POST /price-integrity/price-change-files/{id}/supersede"
        actor: PricingAdmin
        preconditions: ["status IN {DISTRIBUTED, PARTIALLY_EXECUTED}", "same superseded_by_file_id target rules as the DISTRIBUTED -> SUPERSEDED row"]
        side_effects: ["identical side-effect set to the DISTRIBUTED -> SUPERSEDED row"]

  - entity: PriceChangeLine
    initial_state: PENDING
    terminal_states: [VERIFIED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: PENDING
        to: TASKED
        trigger: "system — LabelTask created for this line"
        actor: system
        preconditions: ["line_status == PENDING"]
        side_effects: ["owning PriceChangeFile may auto-advance DISTRIBUTED -> PARTIALLY_EXECUTED"]
      - from: TASKED
        to: LABELED
        trigger: "system — the line's LabelTask reaches print_status == PRINTED"
        actor: system
        preconditions: ["line_status == TASKED"]
        side_effects: ["none beyond updated_at / version"]
      - from: LABELED
        to: VERIFIED
        trigger: "system — cascade hop 2: the line's LabelTask transitions placement_status PLACED -> VERIFIED"
        actor: system
        preconditions: ["line_status == LABELED"]
        side_effects:
          - "cascade hop 3: owning PriceChangeFile.verified_line_count is recomputed and the file may auto-advance PARTIALLY_EXECUTED -> EXECUTED"
      - from: LABELED
        to: FAILED
        trigger: "system — the line's LabelTask transitions placement_status PLACED -> REJECTED"
        actor: system
        preconditions: ["line_status == LABELED"]
        side_effects: ["none beyond updated_at / version"]
      - from: FAILED
        to: LABELED
        trigger: "system — the line's LabelTask transitions placement_status REJECTED -> PLACED"
        actor: system
        preconditions: ["line_status == FAILED"]
        side_effects: ["none beyond updated_at / version"]
        note: "Revision loop: LABELED -> FAILED -> LABELED may repeat without bound."
      - from: PENDING
        to: WITHDRAWN
        trigger: "system — owning PriceChangeFile is superseded"
        actor: system
        preconditions: ["line_status IN {PENDING, TASKED, LABELED, FAILED}"]
        side_effects: ["the line leaves every store's label_backlog_count"]
      - from: TASKED
        to: WITHDRAWN
        trigger: "system — owning PriceChangeFile is superseded"
        actor: system
        preconditions: ["line_status IN {PENDING, TASKED, LABELED, FAILED}"]
        side_effects: ["the line's LabelTasks with placement_status != VERIFIED get print_status = REPRINT_REQUIRED"]
      - from: LABELED
        to: WITHDRAWN
        trigger: "system — owning PriceChangeFile is superseded"
        actor: system
        preconditions: ["line_status IN {PENDING, TASKED, LABELED, FAILED}"]
        side_effects: ["the line's LabelTasks with placement_status != VERIFIED get print_status = REPRINT_REQUIRED"]
      - from: FAILED
        to: WITHDRAWN
        trigger: "system — owning PriceChangeFile is superseded"
        actor: system
        preconditions: ["line_status IN {PENDING, TASKED, LABELED, FAILED}"]
        side_effects: ["the line's LabelTasks with placement_status != VERIFIED get print_status = REPRINT_REQUIRED"]

  - entity: LabelTask
    initial_state: "print_status=NOT_PRINTED x placement_status=UNPLACED"
    terminal_states: ["placement_status=VERIFIED (placement axis only; the print axis has no terminal state)"]
    shape: parallel
    note: |
      Two independent state dimensions on one row. print_status advances on printing events and is
      reset by suspension / supersede cascades; placement_status advances on placement and
      verification events. A transition on one axis never implies a transition on the other, and the
      valid transition set of the placement axis is guarded by the current value of the print axis.
    transitions:
      - from: "print_status=NOT_PRINTED"
        to: "print_status=PRINTED"
        trigger: "POST /price-integrity/label-tasks/{id}/print"
        actor: LabelAssociate | StoreManager
        preconditions:
          - "print_status IN {NOT_PRINTED, REPRINT_REQUIRED}"
          - "owning PriceChangeFile.status IN {DISTRIBUTED, PARTIALLY_EXECUTED} (else ERR_FILE_NOT_DISTRIBUTED)"
          - "assigned associate training_status != SUSPENDED (else ERR_LABEL_TASK_INVALID_STATE)"
        side_effects:
          - "printed_label_serial = 'LBL-' + zero-padded per-store print sequence number"
          - "PriceChangeLine.line_status TASKED -> LABELED"
      - from: "print_status=REPRINT_REQUIRED"
        to: "print_status=PRINTED"
        trigger: "POST /price-integrity/label-tasks/{id}/print"
        actor: LabelAssociate | StoreManager
        preconditions: ["print_status IN {NOT_PRINTED, REPRINT_REQUIRED}", "owning PriceChangeFile.status IN {DISTRIBUTED, PARTIALLY_EXECUTED}"]
        side_effects:
          - "printed_label_serial re-minted from the same per-store sequence"
          - "PriceChangeLine.line_status TASKED -> LABELED when the line is TASKED"
      - from: "print_status=PRINTED"
        to: "print_status=REPRINT_REQUIRED"
        trigger: "system — cascade hop 4 of the audit-failure chain (assigned associate becomes SUSPENDED), or owning line is WITHDRAWN by a supersede"
        actor: system
        preconditions: ["print_status == PRINTED", "placement_status != VERIFIED"]
        side_effects: ["printed_label_serial = null"]
      - from: "placement_status=UNPLACED"
        to: "placement_status=PLACED"
        trigger: "POST /price-integrity/label-tasks/{id}/place"
        actor: LabelAssociate
        preconditions:
          - "placement_status IN {UNPLACED, REJECTED}"
          - "print_status == PRINTED (else ERR_LABEL_NOT_PRINTED)"
          - "X-User-ID resolves to an Associate whose store_id == LabelTask.store_id (else ERR_ASSOCIATE_STORE_MISMATCH)"
        side_effects:
          - "placed_by_associate_id = X-User-ID; placed_at = clock_now"
          - "Store.label_backlog_count recomputed, then Store.compliance_posture recomputed"
          - "PriceChangeLine.line_status FAILED -> LABELED when the line is FAILED"
      - from: "placement_status=REJECTED"
        to: "placement_status=PLACED"
        trigger: "POST /price-integrity/label-tasks/{id}/place"
        actor: LabelAssociate
        preconditions: ["placement_status IN {UNPLACED, REJECTED}", "print_status == PRINTED"]
        side_effects:
          - "placed_by_associate_id = X-User-ID; placed_at = clock_now"
          - "Store.label_backlog_count recomputed, then Store.compliance_posture recomputed"
          - "PriceChangeLine.line_status FAILED -> LABELED"
        note: "Revision loop on the placement axis: PLACED -> REJECTED -> PLACED may repeat."
      - from: "placement_status=PLACED"
        to: "placement_status=VERIFIED"
        trigger: "POST /price-integrity/label-tasks/{id}/verify-placement with outcome == VERIFIED"
        actor: PriceAuditor
        preconditions:
          - "placement_status == PLACED (else ERR_LABEL_TASK_INVALID_STATE)"
          - "X-User-ID != placed_by_associate_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "verifier Associate.training_status == CERTIFIED (else ERR_ASSOCIATE_NOT_CERTIFIED)"
          - "clock_now < verifier.certification_expires_at (else ERR_ASSOCIATE_NOT_CERTIFIED)"
          - "clock_now < placed_at + VERIFICATION_GRACE_HOURS (else ERR_VERIFICATION_WINDOW_CLOSED)"
        side_effects:
          - "verified_by_associate_id = X-User-ID; verified_at = clock_now; observed_shelf_price_cents stored"
          - "cascade hop 1 -> 2: PriceChangeLine.line_status LABELED -> VERIFIED"
          - "placed_by associate's verified_placement_count recomputed"
          - "Store.label_backlog_count recomputed, then Store.compliance_posture recomputed"
      - from: "placement_status=PLACED"
        to: "placement_status=REJECTED"
        trigger: "POST /price-integrity/label-tasks/{id}/verify-placement with outcome == REJECTED"
        actor: PriceAuditor
        preconditions:
          - "placement_status == PLACED"
          - "X-User-ID != placed_by_associate_id"
          - "verifier Associate.training_status == CERTIFIED and clock_now < verifier.certification_expires_at"
        side_effects:
          - "rejection_count += 1; print_status PRINTED -> REPRINT_REQUIRED"
          - "PriceChangeLine.line_status LABELED -> FAILED"
          - "an AccountabilityAction (trigger_code VERIFICATION_REJECTED, action_type COACHING, issued_by_ref 'system') is created against placed_by_associate_id when rejection_count reaches REJECTION_ACTION_THRESHOLD"
          - "Store.label_backlog_count recomputed, then Store.compliance_posture recomputed"
      - from: "placement_status=PLACED"
        to: "placement_status=UNPLACED"
        trigger: "system — cascade hop 4 of the audit-failure chain: assigned associate transitions CERTIFIED -> SUSPENDED"
        actor: system
        preconditions: ["placement_status == PLACED", "assigned_associate_id == the suspended associate"]
        side_effects:
          - "placed_by_associate_id = null; placed_at = null"
          - "Store.label_backlog_count recomputed (this task re-enters the backlog), then Store.compliance_posture recomputed"

  - entity: Associate
    initial_state: UNTRAINED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNTRAINED
        to: IN_TRAINING
        trigger: "POST /price-integrity/associates/{id}/training-completions with score_pct < TRAINING_PASS_SCORE_PCT"
        actor: StoreManager
        preconditions: ["training_status IN {UNTRAINED, IN_TRAINING}"]
        side_effects: ["last_training_module_code and last_training_score_pct stored", "certification_expires_at stays null"]
      - from: IN_TRAINING
        to: IN_TRAINING
        trigger: "POST /price-integrity/associates/{id}/training-completions with score_pct < TRAINING_PASS_SCORE_PCT"
        actor: StoreManager
        preconditions: ["training_status == IN_TRAINING"]
        side_effects: ["last_training_module_code and last_training_score_pct overwritten"]
        note: "Self-loop: failed retries may repeat without bound."
      - from: UNTRAINED
        to: CERTIFIED
        trigger: "POST /price-integrity/associates/{id}/training-completions with score_pct >= TRAINING_PASS_SCORE_PCT"
        actor: StoreManager
        preconditions: ["training_status IN {UNTRAINED, IN_TRAINING}"]
        side_effects: ["certification_expires_at = clock_now + CERTIFICATION_VALID_DAYS days"]
      - from: IN_TRAINING
        to: CERTIFIED
        trigger: "POST /price-integrity/associates/{id}/training-completions with score_pct >= TRAINING_PASS_SCORE_PCT"
        actor: StoreManager
        preconditions: ["training_status IN {UNTRAINED, IN_TRAINING}"]
        side_effects: ["certification_expires_at = clock_now + CERTIFICATION_VALID_DAYS days"]
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /price-integrity/associates/{id}/training-completions with score_pct >= TRAINING_PASS_SCORE_PCT"
        actor: StoreManager
        preconditions: ["training_status == CERTIFIED"]
        side_effects: ["certification_expires_at = clock_now + CERTIFICATION_VALID_DAYS days (recertification extends the window)"]
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system — cascade hop 3 of the audit-failure chain: an AccountabilityAction is created or the associate's accountability_score is recomputed below SUSPENSION_SCORE_FLOOR"
        actor: system
        preconditions: ["training_status == CERTIFIED", "recomputed accountability_score < SUSPENSION_SCORE_FLOOR"]
        side_effects:
          - "cascade hop 4: every LabelTask with assigned_associate_id == this id and placement_status == PLACED transitions placement_status PLACED -> UNPLACED and print_status PRINTED -> REPRINT_REQUIRED"
          - "each affected Store then recomputes label_backlog_count and compliance_posture"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /price-integrity/associates/{id}/training-completions with module_code == REMEDIAL_MODULE_CODE and score_pct >= TRAINING_PASS_SCORE_PCT"
        actor: StoreManager
        preconditions:
          - "training_status == SUSPENDED"
          - "after the AccountabilityAction completions listed below, the recomputed accountability_score >= SUSPENSION_SCORE_FLOOR"
        side_effects:
          - "compensating hop 1: every AccountabilityAction with associate_id == this id, status == ISSUED and action_type IN {SUSPENSION, RETRAINING_ASSIGNED} transitions ISSUED -> COMPLETED"
          - "compensating hop 2: accountability_score is recomputed from the remaining ISSUED actions"
          - "compensating hop 3: certification_expires_at = clock_now + CERTIFICATION_VALID_DAYS days"
        note: |
          Conditional cascade: when the recomputed score is still below SUSPENSION_SCORE_FLOOR the
          associate stays SUSPENDED, the completions above still apply, and the response reports
          training_status SUSPENDED with the higher score.

  - entity: ScannerAudit
    initial_state: OPEN
    terminal_states: []
    shape: cyclic
    transitions:
      - from: OPEN
        to: SCANNING
        trigger: "system — first ScanLine created via POST /price-integrity/scanner-audits/{id}/scan-lines"
        actor: system
        preconditions: ["status == OPEN"]
        side_effects: ["sample_size, overcharge_count, undercharge_count recomputed"]
      - from: SCANNING
        to: CLOSED
        trigger: "POST /price-integrity/scanner-audits/{id}/close"
        actor: PriceAuditor
        preconditions:
          - "status IN {SCANNING, REOPENED}"
          - "sample_size >= 1 (else ERR_AUDIT_SAMPLE_EMPTY)"
        side_effects:
          - "gross_error_rate_pct and net_overcharge_rate_pct are BOTH computed and stored via calculations.scanner_audit_error_rate"
          - "rate_variant_applied = rate_variant (or jurisdiction.default_rate_variant when omitted); error_rate_pct = the applied variant's value"
          - "outcome = FAIL when error_rate_pct >= jurisdiction.scanner_error_rate_threshold_pct, else PASS"
          - "closed_at = clock_now; Aisle.last_audit_closed_at = clock_now"
          - "cascade hop 1 (only when outcome == FAIL): an AccountabilityAction is created against Aisle.assigned_associate_id with trigger_code AUDIT_FAIL, issued_by_ref 'system', and action_type selected by calculations.audit_failure_action_type; when Aisle.assigned_associate_id is null no action is created"
          - "cascade hop 2 (only when an action was created): the associate's issued_action_count and accountability_score are recomputed via calculations.associate_accountability_score"
          - "cascade hop 3 (only when the recomputed score < SUSPENSION_SCORE_FLOOR): the associate transitions CERTIFIED -> SUSPENDED, which itself runs cascade hop 4 on that associate's LabelTasks"
          - "Store.failed_audit_count_30d recomputed, then Store.compliance_posture recomputed"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /price-integrity/scanner-audits/{id}/close"
        actor: PriceAuditor
        preconditions: ["status IN {SCANNING, REOPENED}", "sample_size >= 1"]
        side_effects: ["identical side-effect set to the SCANNING -> CLOSED row"]
      - from: CLOSED
        to: REOPENED
        trigger: "POST /price-integrity/scanner-audits/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "status == CLOSED"
          - "no RegulatoryInspection with scanner_audit_id == this id has status == CLOSED (else ERR_AUDIT_INVALID_STATE)"
        side_effects:
          - "outcome = PENDING; error_rate_pct = null; rate_variant_applied = null; gross_error_rate_pct and net_overcharge_rate_pct = null; closed_at = null"
          - "reopen_count += 1"
          - "Store.failed_audit_count_30d recomputed, then Store.compliance_posture recomputed (a FAIL verdict is withdrawn from the posture inputs)"
      - from: REOPENED
        to: SCANNING
        trigger: "system — a ScanLine is created while status == REOPENED"
        actor: system
        preconditions: ["status == REOPENED"]
        side_effects: ["sample_size, overcharge_count, undercharge_count recomputed"]
        note: "Closes the CLOSED -> REOPENED -> SCANNING -> CLOSED cycle."

  - entity: PromoSignage
    initial_state: DRAFT
    terminal_states: [REMOVED]
    shape: branching
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /price-integrity/promo-signage/{id}/post"
        actor: LabelAssociate | StoreManager
        preconditions:
          - "status == DRAFT (else ERR_SIGNAGE_INVALID_STATE)"
          - "Store.compliance_posture != FROZEN (else ERR_STORE_POSTURE_BLOCKED)"
          - "when Store.compliance_posture == RESTRICTED, price_change_line_id is not null (else ERR_STORE_POSTURE_BLOCKED)"
          - "missing_disclosure_codes is empty (else ERR_MISSING_DISCLOSURE)"
          - "clock_now < promo_end_at (else ERR_SIGNAGE_INVALID_STATE)"
        side_effects: ["posted_at = clock_now", "compliance_state = COMPLIANT"]
      - from: POSTED
        to: EXPIRED_PENDING_REMOVAL
        trigger: "system — POST /price-integrity/stores/{id}/signage-sweep with clock_now >= promo_end_at"
        actor: system
        preconditions: ["status == POSTED", "clock_now >= promo_end_at"]
        side_effects:
          - "compliance_state = EXPIRED_NOT_REMOVED"
          - "Store.signage_violation_count recomputed, then Store.compliance_posture recomputed"
      - from: POSTED
        to: NON_COMPLIANT
        trigger: "system — POST /price-integrity/stores/{id}/signage-sweep with clock_now < promo_end_at and a non-empty missing_disclosure_codes"
        actor: system
        preconditions: ["status == POSTED", "clock_now < promo_end_at", "missing_disclosure_codes is non-empty"]
        side_effects:
          - "compliance_state = MISSING_DISCLOSURE"
          - "Store.signage_violation_count recomputed, then Store.compliance_posture recomputed"
        note: "Reachable only after PATCH /jurisdictions/{id} adds a disclosure code the posted sign does not carry."
      - from: POSTED
        to: REMOVED
        trigger: "POST /price-integrity/promo-signage/{id}/remove"
        actor: LabelAssociate | StoreManager
        preconditions: ["status IN {POSTED, EXPIRED_PENDING_REMOVAL, NON_COMPLIANT}"]
        side_effects:
          - "removed_at = clock_now; compliance_state = NOT_APPLICABLE"
          - "Store.signage_violation_count recomputed, then Store.compliance_posture recomputed"
      - from: EXPIRED_PENDING_REMOVAL
        to: REMOVED
        trigger: "POST /price-integrity/promo-signage/{id}/remove"
        actor: LabelAssociate | StoreManager
        preconditions: ["status IN {POSTED, EXPIRED_PENDING_REMOVAL, NON_COMPLIANT}"]
        side_effects:
          - "removed_at = clock_now; compliance_state = NOT_APPLICABLE"
          - "Store.signage_violation_count recomputed, then Store.compliance_posture recomputed (compensates the sweep's violation increment)"
      - from: NON_COMPLIANT
        to: REMOVED
        trigger: "POST /price-integrity/promo-signage/{id}/remove"
        actor: LabelAssociate | StoreManager
        preconditions: ["status IN {POSTED, EXPIRED_PENDING_REMOVAL, NON_COMPLIANT}"]
        side_effects:
          - "removed_at = clock_now; compliance_state = NOT_APPLICABLE"
          - "Store.signage_violation_count recomputed, then Store.compliance_posture recomputed"

  - entity: RegulatoryInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: FINDINGS_ISSUED
        trigger: "POST /price-integrity/regulatory-inspections/{id}/issue-findings"
        actor: ComplianceOfficer
        preconditions:
          - "status == SCHEDULED (else ERR_INSPECTION_INVALID_STATE)"
          - "the supplied findings array is non-empty (else ERR_FINDINGS_EMPTY)"
          - "the referenced ScannerAudit.status == CLOSED (else ERR_EVIDENCE_AUDIT_NOT_CLOSED)"
        side_effects:
          - "penalty_component_cents computed for every non-WAIVED finding, then penalty_exposure_cents computed via calculations.penalty_exposure"
          - "finding_count recomputed"
          - "increments RegulatoryInspection.version by 1"
      - from: FINDINGS_ISSUED
        to: RESPONSE_SUBMITTED
        trigger: "POST /price-integrity/regulatory-inspections/{id}/response"
        actor: StoreManager
        preconditions:
          - "status IN {FINDINGS_ISSUED, RESPONSE_REJECTED} (else ERR_INSPECTION_INVALID_STATE)"
          - "expected_regulatory_inspection_version == current version (else ERR_STALE_INSPECTION_VERSION)"
        side_effects:
          - "response_round += 1; remediation_summary stored"
          - "increments RegulatoryInspection.version by 1"
      - from: RESPONSE_REJECTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /price-integrity/regulatory-inspections/{id}/response"
        actor: StoreManager
        preconditions: ["status IN {FINDINGS_ISSUED, RESPONSE_REJECTED}", "expected_regulatory_inspection_version == current version"]
        side_effects:
          - "response_round += 1; remediation_summary overwritten"
          - "increments RegulatoryInspection.version by 1"
        note: "Negotiation loop: RESPONSE_SUBMITTED -> RESPONSE_REJECTED -> RESPONSE_SUBMITTED may repeat without bound."
      - from: RESPONSE_SUBMITTED
        to: CLOSED
        trigger: "POST /price-integrity/regulatory-inspections/{id}/adjudicate with decision == ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "status == RESPONSE_SUBMITTED (else ERR_INSPECTION_INVALID_STATE)"
          - "no InspectionFinding of this inspection has status == OPEN (else ERR_FINDING_INVALID_STATE)"
          - "when assessed_penalty_cents is supplied it is <= the freshly recomputed penalty_exposure_cents (else ERR_PENALTY_OVERRIDE_TOO_HIGH)"
        side_effects:
          - "calculations.inspection_net_settlement runs in its pinned step order and stores penalty_exposure_cents, refund_liability_cents, refund_credit_cents and assessed_penalty_cents"
          - "closed_at = clock_now"
          - "Store.cumulative_penalty_exposure_cents += assessed_penalty_cents, then Store.compliance_posture recomputed"
          - "increments RegulatoryInspection.version by 1"
      - from: RESPONSE_SUBMITTED
        to: RESPONSE_REJECTED
        trigger: "POST /price-integrity/regulatory-inspections/{id}/adjudicate with decision == REJECT"
        actor: ComplianceOfficer
        preconditions: ["status == RESPONSE_SUBMITTED"]
        side_effects:
          - "every InspectionFinding of this inspection with status IN {OPEN, REMEDIATION_PLANNED} transitions to ESCALATED"
          - "Store.escalated_finding_count and Store.open_finding_count recomputed, then Store.compliance_posture recomputed (any escalated finding forces FROZEN)"
          - "increments RegulatoryInspection.version by 1"

  - entity: InspectionFinding
    initial_state: OPEN
    terminal_states: [REMEDIATED, WAIVED]
    shape: branching
    note: |
      Branch point at OPEN with three divergent successors and three different side-effect sets:
      REMEDIATION_PLANNED leaves the penalty tier untouched, WAIVED zeroes the finding's penalty
      component and can drop the whole inspection into a cheaper tier, ESCALATED forces the store
      posture to FROZEN.
    transitions:
      - from: OPEN
        to: REMEDIATION_PLANNED
        trigger: "POST /price-integrity/inspection-findings/{id}/transition with target_status == REMEDIATION_PLANNED"
        actor: StoreManager
        preconditions:
          - "status IN {OPEN, ESCALATED} (else ERR_FINDING_INVALID_STATE)"
          - "remediation_action_code is present (else ERR_REMEDIATION_EVIDENCE_REQUIRED)"
        side_effects:
          - "remediation_action_code stored"
          - "Store.open_finding_count recomputed (unchanged: both OPEN and REMEDIATION_PLANNED count), then Store.compliance_posture recomputed"
      - from: ESCALATED
        to: REMEDIATION_PLANNED
        trigger: "POST /price-integrity/inspection-findings/{id}/transition with target_status == REMEDIATION_PLANNED"
        actor: StoreManager
        preconditions: ["status IN {OPEN, ESCALATED}", "remediation_action_code is present"]
        side_effects:
          - "remediation_action_code stored"
          - "Store.escalated_finding_count recomputed, then Store.compliance_posture recomputed (FROZEN may relax to RESTRICTED)"
        note: "Recovery loop: OPEN -> ESCALATED -> REMEDIATION_PLANNED -> ESCALATED may repeat across response rounds."
      - from: REMEDIATION_PLANNED
        to: REMEDIATED
        trigger: "POST /price-integrity/inspection-findings/{id}/transition with target_status == REMEDIATED"
        actor: StoreManager
        preconditions:
          - "status == REMEDIATION_PLANNED"
          - "remediation_evidence_ref is present (else ERR_REMEDIATION_EVIDENCE_REQUIRED)"
        side_effects:
          - "remediation_evidence_ref stored"
          - "Store.open_finding_count recomputed (decreases by one), then Store.compliance_posture recomputed"
      - from: REMEDIATION_PLANNED
        to: ESCALATED
        trigger: "system — owning RegulatoryInspection is adjudicated with decision REJECT"
        actor: system
        preconditions: ["status IN {OPEN, REMEDIATION_PLANNED}"]
        side_effects: ["Store.escalated_finding_count recomputed, then Store.compliance_posture recomputed to FROZEN"]
      - from: OPEN
        to: ESCALATED
        trigger: "system — owning RegulatoryInspection is adjudicated with decision REJECT"
        actor: system
        preconditions: ["status IN {OPEN, REMEDIATION_PLANNED}"]
        side_effects: ["Store.escalated_finding_count recomputed, then Store.compliance_posture recomputed to FROZEN"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /price-integrity/inspection-findings/{id}/transition with target_status == WAIVED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN (else ERR_FINDING_INVALID_STATE)"
          - "owning RegulatoryInspection.status != CLOSED"
        side_effects:
          - "waiver_reason stored; penalty_component_cents = 0"
          - "owning RegulatoryInspection.finding_count and penalty_exposure_cents are recomputed via calculations.penalty_exposure, which may select a lower tier_multiplier"
          - "Store.open_finding_count recomputed, then Store.compliance_posture recomputed"

  - entity: RefundClaim
    initial_state: PENDING
    terminal_states: [PAID, DENIED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /price-integrity/refund-claims/{id}/settle with target_status == APPROVED"
        actor: StoreManager
        preconditions: ["status == PENDING (else ERR_REFUND_CLAIM_INVALID_STATE)"]
        side_effects: ["Store.refund_liability_outstanding_cents unchanged (PENDING and APPROVED are both outstanding)"]
      - from: PENDING
        to: DENIED
        trigger: "POST /price-integrity/refund-claims/{id}/settle with target_status == DENIED"
        actor: StoreManager
        preconditions: ["status IN {PENDING, APPROVED} (else ERR_REFUND_CLAIM_INVALID_STATE)"]
        side_effects:
          - "denial_reason stored"
          - "Store.refund_liability_outstanding_cents recomputed (this claim's claimed_amount_cents leaves the outstanding sum)"
      - from: APPROVED
        to: DENIED
        trigger: "POST /price-integrity/refund-claims/{id}/settle with target_status == DENIED"
        actor: StoreManager
        preconditions: ["status IN {PENDING, APPROVED}"]
        side_effects:
          - "denial_reason stored"
          - "Store.refund_liability_outstanding_cents recomputed"
      - from: APPROVED
        to: PAID
        trigger: "POST /price-integrity/refund-claims/{id}/settle with target_status == PAID"
        actor: CustomerServiceDesk
        preconditions: ["status == APPROVED (else ERR_REFUND_CLAIM_INVALID_STATE)"]
        side_effects:
          - "paid_at = clock_now"
          - "Store.refund_liability_outstanding_cents recomputed (leaves outstanding) and Store.refund_paid_total_cents recomputed (enters paid)"

  - entity: ExceptionReport
    initial_state: GENERATED
    terminal_states: [CLOSED]
    shape: linear
    transitions:
      - from: GENERATED
        to: REMEDIATION_OPEN
        trigger: "POST /price-integrity/exception-reports/{id}/assign-root-cause"
        actor: ComplianceOfficer
        preconditions:
          - "status == GENERATED (else ERR_EXCEPTION_REPORT_INVALID_STATE)"
          - "remediation_owner_associate_id references an Associate whose store_id == this report's store_id (else ERR_ASSOCIATE_STORE_MISMATCH)"
          - "remediation_owner_associate_id != the auditor_associate_id of every ScannerAudit counted in audit_count (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "root_cause_code and remediation_owner_associate_id stored"
          - "when root_cause_code == TRAINING_GAP: an AccountabilityAction (trigger_code EXCEPTION_ROOT_CAUSE, action_type RETRAINING_ASSIGNED, issued_by_ref 'system') is created against the owner, then the owner's accountability_score is recomputed, then the owner may transition CERTIFIED -> SUSPENDED"
      - from: REMEDIATION_OPEN
        to: CLOSED
        trigger: "POST /price-integrity/exception-reports/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "status == REMEDIATION_OPEN (else ERR_EXCEPTION_REPORT_INVALID_STATE)"
          - "when root_cause_code == TRAINING_GAP, the AccountabilityAction created by the assign-root-cause cascade has status IN {COMPLETED, VOIDED} (else ERR_ACTION_INVALID_STATE)"
        side_effects: ["closure_note stored"]

  - entity: AccountabilityAction
    initial_state: ISSUED
    terminal_states: [COMPLETED, VOIDED]
    shape: branching
    transitions:
      - from: ISSUED
        to: COMPLETED
        trigger: "system — the associate completes REMEDIAL_MODULE_CODE training with a passing score"
        actor: system
        preconditions: ["status == ISSUED", "action_type IN {SUSPENSION, RETRAINING_ASSIGNED}"]
        side_effects: ["owning Associate.issued_action_count and accountability_score recomputed (the weight leaves the ISSUED sum)"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /price-integrity/accountability-actions/{id}/transition with target_status == VOIDED"
        actor: StoreManager | ComplianceOfficer
        preconditions: ["status == ISSUED (else ERR_ACTION_INVALID_STATE)"]
        side_effects:
          - "void_reason stored"
          - "owning Associate.issued_action_count and accountability_score recomputed; the score returns to exactly its pre-issue value"
        note: "Compensating action for the accountability-score invariant; it never changes training_status."

# ============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ============================================================================
concurrency_rules:
  - rule_id: label-task-create-stale-file
    parent_entity: PriceChangeFile
    write_endpoint: "POST /price-integrity/price-change-files/{id}/label-tasks"
    occ_field: "expected_price_change_file_version"
    description: |
      Creating a LabelTask against a PriceChangeFile whose version has advanced since the client
      last observed it is rejected. Tasking a line is legitimately repeatable for other lines and
      other stores, so the loser's request is not covered by any state precondition; the stale
      version is the only signal that the client's view of the file (its distribution status, its
      supersede pointer and its line set) is out of date.
    error_id: ERR_STALE_PRICE_CHANGE_FILE_VERSION
    http_status: 412
  - rule_id: inspection-response-stale-inspection
    parent_entity: RegulatoryInspection
    write_endpoint: "POST /price-integrity/regulatory-inspections/{id}/response"
    occ_field: "expected_regulatory_inspection_version"
    description: |
      Submitting a response against a RegulatoryInspection whose version has advanced is rejected.
      Re-submission is legitimate by design (RESPONSE_REJECTED -> RESPONSE_SUBMITTED is a declared
      cycle), so a second submission cannot be rejected by a state precondition; the stale version
      is the only signal that the response the client composed answers a superseded finding set.
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412
  - rule_id: refund-claim-create-stale-audit
    parent_entity: ScannerAudit
    write_endpoint: "POST /price-integrity/refund-claims"
    occ_field: "expected_scanner_audit_version"
    description: |
      Creating a RefundClaim against a ScanLine whose owning ScannerAudit has advanced its version
      is rejected. Multiple claims against different scan lines of the same audit are legitimate, so
      the loser is not covered by a state precondition; the stale version is the only signal that the
      audit was reopened and reclosed under a different rate variant after the client read it.
    error_id: ERR_STALE_SCANNER_AUDIT_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: unit_price_display
    trigger: "on POST /price-integrity/price-change-files/{id}/lines (line creation) and re-run for every non-WITHDRAWN line on the DRAFT -> DISTRIBUTED transition"
    algorithm: tiered_pricing
    combinatorial_mode: "(b) nested rounding where the order matters"
    formula: |
      # --- Step 1: basis selection. NOTHING is rounded in this step. -------------
      family(net_content_uom):
        OZ, LB      -> WEIGHT
        FL_OZ, GAL  -> VOLUME
        CT          -> COUNT
        EACH        -> SINGLE
      rule = jurisdiction.unit_price_uom_rule
      if rule == PER_SINGLE_ITEM:
          basis_qty = 1                              ; basis_uom = "EACH"
      elif rule == PER_100_COUNT and family == COUNT:
          basis_qty = net_content_qty / 100          ; basis_uom = "100CT"
      else:   # PER_UNIT_MEASURE_CANONICAL, and the PER_100_COUNT fallback for non-COUNT families
          if family == WEIGHT:
              basis_qty = net_content_qty / OZ_PER_LB if net_content_uom == OZ else net_content_qty
              basis_uom = "LB"
          elif family == VOLUME:
              basis_qty = net_content_qty / FL_OZ_PER_GAL if net_content_uom == FL_OZ else net_content_qty
              basis_uom = "GAL"
          elif family == COUNT:
              basis_qty = net_content_qty            ; basis_uom = "CT"
          else:
              basis_qty = 1                          ; basis_uom = "EACH"
      # --- Step 1b: unpriceable guard. No division is attempted when the divisor is 0.
      if basis_qty == 0:            # only reachable for net_content_qty == 0 under a non-PER_SINGLE_ITEM rule
          unit_price_display_cents = null ; unit_price_basis_qty = null ; unit_price_basis_uom = null
          STOP                      # the line is created, but carries no displayable unit price
      # --- Step 2: ONE division at full precision (exact rational, no truncation)
      raw_cents = new_retail_cents / basis_qty
      # --- Step 3: ONE rounding, at the very end --------------------------------
      cents_places = max(0, jurisdiction.unit_price_decimal_places - 2)
      unit_price_display_cents = ROUND(raw_cents, cents_places) using jurisdiction.unit_price_rounding
      unit_price_basis_qty     = basis_qty        # stored exactly, up to 6 fractional digits
      unit_price_basis_uom     = basis_uom
    input_set: "One PriceChangeLine with line_status != WITHDRAWN, plus the jurisdiction of its owning PriceChangeFile."
    constants:
      OZ_PER_LB: 16
      FL_OZ_PER_GAL: 128
    precision: |
      PINNED ROUNDING ORDER — divide first, round exactly once, at the end. basis_qty is NEVER
      rounded (26 OZ stays 1.625 LB, never 1.63) and raw_cents is NEVER rounded before Step 3.
      Rounding basis_qty to 2 decimals first and rounding after the division give different cents:
      499 / (26/16) = 307.0769... -> 307, whereas 499 / 1.63 = 306.13... -> 306. Only 307 is correct.
      Mode is jurisdiction.unit_price_rounding, applied to `cents_places` decimals of a cent figure.
    variants: []

  - name: label_task_due_at
    trigger: "on LabelTask creation; `overdue` is re-derived on every read and on every placement-axis transition"
    algorithm: interval_merge
    formula: |
      due_at  = owning PriceChangeFile.effective_date + jurisdiction.grace_period_hours hours
      overdue = (clock_now >= due_at) AND (placement_status IN {UNPLACED, REJECTED})
    input_set: "The LabelTask, its PriceChangeLine -> PriceChangeFile.effective_date, and that file's jurisdiction."
    constants: {}
    precision: "Instants compared at millisecond resolution; clock_now == due_at is already overdue (>= not >)."
    variants: []

  - name: scanner_audit_error_rate
    trigger: "on POST /price-integrity/scanner-audits/{id}/close (both variants are always computed and stored)"
    algorithm: threshold
    formula: |
      sample_size       = count(ScanLine where scanner_audit_id == audit.id)                 # every scan line, no status filter (ScanLine is immutable)
      overcharge_count  = count(those ScanLines where classification == OVERCHARGE)
      undercharge_count = count(those ScanLines where classification == UNDERCHARGE)
      gross_error_rate_pct    = ROUND_HALF_UP((overcharge_count + undercharge_count) / sample_size * 100, 2)
      net_overcharge_rate_pct = ROUND_HALF_UP(max(0, overcharge_count - undercharge_count) / sample_size * 100, 2)
      applied  = rate_variant supplied on the close call, else jurisdiction.default_rate_variant
      error_rate_pct = gross_error_rate_pct    if applied == GROSS_MISMATCH
                       net_overcharge_rate_pct if applied == NET_OVERCHARGE
      outcome  = FAIL when error_rate_pct >= jurisdiction.scanner_error_rate_threshold_pct else PASS
    input_set: "All ScanLine rows of this audit (append-only, so the set is exactly what was posted); the store's jurisdiction supplies the threshold and the default variant."
    constants: {}
    precision: "2 decimal places, round_half_up, applied once to the percentage. The threshold comparison is inclusive (>=)."
    variants:
      - name: GROSS_MISMATCH
        when: "rate_variant == GROSS_MISMATCH, or omitted while jurisdiction.default_rate_variant == GROSS_MISMATCH"
        difference: "Counts every mismatch, so undercharges (which cost the customer nothing) inflate the rate."
      - name: NET_OVERCHARGE
        when: "rate_variant == NET_OVERCHARGE, or omitted while jurisdiction.default_rate_variant == NET_OVERCHARGE"
        difference: "Nets undercharges against overcharges and floors at zero, so the identical scan set can PASS where GROSS_MISMATCH FAILs."

  - name: audit_failure_action_type
    trigger: "on the SCANNING/REOPENED -> CLOSED transition when outcome == FAIL (cascade hop 1)"
    algorithm: waterfall_allocation
    formula: |
      # candidate set: exactly one associate, referenced explicitly, never searched for
      responsible = Aisle.assigned_associate_id of ScannerAudit.aisle_id
      eligibility : responsible IS NOT NULL AND Associate.training_status IN {UNTRAINED, IN_TRAINING, CERTIFIED}
      # ranking is unnecessary (single candidate); the waterfall below picks the ACTION, first match wins
      if count(AccountabilityAction where associate_id == responsible
               AND status == ISSUED AND action_type == WRITTEN_WARNING) >= 1:
          action_type = SUSPENSION
      elif audit.error_rate_pct >= 2 * jurisdiction.scanner_error_rate_threshold_pct:
          action_type = WRITTEN_WARNING
      else:
          action_type = COACHING
      # empty / ineligible fallback: NO AccountabilityAction is created; the audit still closes
      # with outcome FAIL and the store posture still recomputes.
    input_set: "The audited Aisle's assigned associate and that associate's AccountabilityAction rows with status == ISSUED."
    constants: {}
    precision: "Integer comparison; the doubled-threshold test is inclusive (>=)."
    variants: []

  - name: associate_accountability_score
    trigger: "whenever an AccountabilityAction for the associate is created, completed or voided, and whenever a LabelTask of theirs reaches placement_status VERIFIED"
    algorithm: weighted_scoring
    formula: |
      issued_weight_sum = sum(ACTION_WEIGHTS[a.action_type]
                              for a in AccountabilityAction
                              where a.associate_id == associate.id AND a.status == ISSUED)
      verified_placement_count = count(LabelTask
                              where placed_by_associate_id == associate.id
                                AND placement_status == VERIFIED)
      if jurisdiction.accountability_variant == OCCURRENCE_WEIGHTED:
          accountability_score = max(0, 100 - issued_weight_sum)
      else:  # TASK_WEIGHTED
          accountability_score = max(0, ROUND_HALF_UP(
              100 - issued_weight_sum * TASK_WEIGHT_NUMERATOR
                    / (verified_placement_count + TASK_WEIGHT_OFFSET), 2))
      # gate consumed by state_machines.Associate:
      #   accountability_score < SUSPENSION_SCORE_FLOOR  =>  CERTIFIED -> SUSPENDED
    input_set: "AccountabilityAction rows with status == ISSUED only (COMPLETED and VOIDED rows never count); LabelTask rows with placement_status == VERIFIED only. The jurisdiction is the one governing the associate's store."
    constants:
      ACTION_WEIGHTS: { COACHING: 5, WRITTEN_WARNING: 15, RETRAINING_ASSIGNED: 10, SUSPENSION: 25 }
      TASK_WEIGHT_NUMERATOR: 40
      TASK_WEIGHT_OFFSET: 4
      SUSPENSION_SCORE_FLOOR: 80
      TRAINING_PASS_SCORE_PCT: 80
      CERTIFICATION_VALID_DAYS: 365
      REMEDIAL_MODULE_CODE: "REMEDIAL_LABEL_101"
      REJECTION_ACTION_THRESHOLD: 2
      VERIFICATION_GRACE_HOURS: 48
    precision: "2 decimal places, round_half_up, applied once after the subtraction; the floor comparison is strict (<)."
    variants:
      - name: OCCURRENCE_WEIGHTED
        when: "jurisdiction.accountability_variant == OCCURRENCE_WEIGHTED"
        difference: "Each issued action costs its flat weight regardless of how much correct work the associate has done."
      - name: TASK_WEIGHTED
        when: "jurisdiction.accountability_variant == TASK_WEIGHTED"
        difference: "The same issued actions are amortised over verified placements, so a low-volume associate lands far below the suspension floor while OCCURRENCE_WEIGHTED keeps them above it."

  - name: store_label_backlog_count
    trigger: "on LabelTask creation, on every placement-axis transition, on line WITHDRAWN cascades and on the PriceChangeFile PARTIALLY_EXECUTED -> EXECUTED cascade"
    algorithm: aggregation
    formula: |
      Store.label_backlog_count =
        count(LabelTask t JOIN PriceChangeLine l ON t.price_change_line_id == l.id
              WHERE t.store_id == store.id
                AND t.placement_status IN {UNPLACED, REJECTED}
                AND l.line_status != WITHDRAWN)
    input_set: "Every LabelTask of the store, filtered by the two explicit status sets above. No time window; the count is a full recompute, never an incremental delta."
    constants: {}
    precision: "Integer count; recomputed from scratch on every trigger so forward and compensating transitions cannot drift."
    variants: []

  - name: store_compliance_posture
    trigger: "after every finding transition, audit close/reopen, label-task placement transition, signage post/remove/sweep transition, refund settlement, PriceChangeFile EXECUTED/SUPERSEDED cascade, and PATCH /price-integrity/jurisdictions/{id}"
    algorithm: threshold
    formula: |
      open_finding_count      = count(InspectionFinding f JOIN RegulatoryInspection i
                                      ON f.regulatory_inspection_id == i.id
                                      WHERE i.store_id == store.id
                                        AND f.status IN {OPEN, REMEDIATION_PLANNED})
      escalated_finding_count = same join, f.status == ESCALATED
      failed_audit_count_30d  = count(ScannerAudit WHERE store_id == store.id AND status == CLOSED
                                      AND outcome == FAIL
                                      AND closed_at >= clock_now - POSTURE_AUDIT_WINDOW_DAYS days)
      signage_violation_count = count(PromoSignage WHERE store_id == store.id
                                      AND status IN {EXPIRED_PENDING_REMOVAL, NON_COMPLIANT})
      backlog                 = Store.label_backlog_count  (recomputed first; see store_label_backlog_count)
      if escalated_finding_count >= 1
         or open_finding_count >= FROZEN_OPEN_FINDING_COUNT
         or failed_audit_count_30d >= FROZEN_FAILED_AUDIT_COUNT:      compliance_posture = FROZEN
      elif open_finding_count >= 1
         or failed_audit_count_30d == 1
         or backlog >= RESTRICTED_BACKLOG_COUNT
         or signage_violation_count >= 1:                             compliance_posture = RESTRICTED
      else:                                                           compliance_posture = OPEN
    input_set: "All of the store's findings (via its inspections), its CLOSED audits inside the 30-day window measured backwards from clock_now inclusive, its POSTED-derived signage violations, and its freshly recomputed backlog."
    constants:
      POSTURE_AUDIT_WINDOW_DAYS: 30
      FROZEN_OPEN_FINDING_COUNT: 3
      FROZEN_FAILED_AUDIT_COUNT: 2
      RESTRICTED_BACKLOG_COUNT: 5
    precision: "Integer thresholds; every comparison is inclusive (>=) except the equality test on failed_audit_count_30d. Evaluation order is FROZEN checks first, then RESTRICTED checks, then OPEN."
    variants: []

  - name: penalty_exposure
    trigger: "on POST /price-integrity/regulatory-inspections/{id}/issue-findings, on every InspectionFinding OPEN -> WAIVED transition, and as step 1 of inspection_net_settlement"
    algorithm: tiered_pricing
    combinatorial_mode: "(a) >= 3 inputs with non-linear interaction (nested min, tier selection, conditional branch on a linked entity's state)"
    formula: |
      # PINNED EVALUATION ORDER: count -> tier -> per-finding components -> sum -> scale -> cap
      considered = [f for f in InspectionFinding
                    where f.regulatory_inspection_id == inspection.id AND f.status != WAIVED]
      n = count(considered)
      tier_multiplier = 100 if n <= 2 else (125 if n <= 5 else 150)        # percent points
      audit_aggravator = 25 if referenced ScannerAudit.outcome == FAIL else 0   # percent points
      for f in considered:
          f.penalty_component_cents = SEVERITY_WEIGHTS[f.severity]
                                      * jurisdiction.penalty_per_violation_cents
                                      * min(f.affected_item_count, PENALTY_ITEM_CAP)
      raw = sum(f.penalty_component_cents for f in considered)             # sum BEFORE any scaling
      scaled = FLOOR(raw * (tier_multiplier + audit_aggravator) / 100)     # ONE floor, after the sum
      penalty_exposure_cents = min(scaled, jurisdiction.penalty_max_cents)
      # WAIVED findings keep penalty_component_cents == 0 and leave `considered`, which can drop the
      # tier (e.g. n 3 -> 2 moves tier_multiplier 125 -> 100).
    input_set: "InspectionFinding rows of this inspection with status != WAIVED; the linked ScannerAudit's outcome; the store's jurisdiction rates and cap."
    constants:
      SEVERITY_WEIGHTS: { MINOR: 1, MAJOR: 3, CRITICAL: 8 }
      PENALTY_ITEM_CAP: 10
    precision: "Integer cents. Exactly ONE rounding step: FLOOR applied to the scaled sum, never per finding. Per-finding floors would lose up to n-1 cents."
    variants: []

  - name: inspection_net_settlement
    trigger: "on POST /price-integrity/regulatory-inspections/{id}/adjudicate with decision == ACCEPT"
    algorithm: constraint_propagation
    combinatorial_mode: "(c) circular-looking dependency with an explicitly pinned evaluation order"
    formula: |
      # The dependency LOOKS circular: the penalty depends on the finding tier, the refund credit
      # depends on the penalty, and the refund programme is itself what closes findings. The order
      # below is normative and is evaluated exactly once, top to bottom, with NO iteration and NO
      # feedback from a later step into an earlier one.
      # Step 1
      penalty_exposure_cents = calculations.penalty_exposure(inspection)      # recomputed from CURRENT findings
      # Step 2
      refund_liability_cents = sum(c.claimed_amount_cents for c in RefundClaim
                                   where c.scan_line_id IN (ScanLine ids of inspection.scanner_audit_id)
                                     AND c.status IN {APPROVED, PAID})
      # Step 3
      refund_credit_cents = min(FLOOR(refund_liability_cents * REFUND_CREDIT_RATE_BP / 10000),
                                FLOOR(penalty_exposure_cents * CREDIT_CAP_PCT / 100))
      # Step 4
      assessed_penalty_cents = supplied assessed_penalty_cents override
                               if the adjudicate call supplied one,
                               else max(0, penalty_exposure_cents - refund_credit_cents)
      # Step 5
      Store.cumulative_penalty_exposure_cents += assessed_penalty_cents
      # The credit computed in Step 3 NEVER re-enters Step 1's tier selection.
    input_set: "Non-WAIVED findings of the inspection (step 1); RefundClaim rows in {APPROVED, PAID} whose scan line belongs to the inspection's evidence audit (step 2) — PENDING and DENIED claims are excluded."
    constants:
      REFUND_CREDIT_RATE_BP: 7500
      CREDIT_CAP_PCT: 50
    precision: "Integer cents; FLOOR applied independently to each of the two candidates in Step 3, then min(); no rounding in Steps 4-5."
    variants: []

  - name: refund_claim_amount
    trigger: "on POST /price-integrity/refund-claims"
    algorithm: waterfall_allocation
    formula: |
      variance_cents = scan_line.register_price_cents - scan_line.shelf_price_cents
      # variance_cents <= 0 is rejected upstream with ERR_NOT_AN_OVERCHARGE
      policy = jurisdiction.overcharge_refund_policy      # jurisdiction of the audited store
      if policy == REFUND_DIFFERENCE_ONLY:
          gross = variance_cents
      elif policy == REFUND_DIFFERENCE_PLUS_FIXED:
          gross = variance_cents + jurisdiction.refund_fixed_bonus_cents
      else:  # ITEM_FREE_UP_TO_CAP — the customer keeps the item
          gross = scan_line.register_price_cents
      claimed_amount_cents = min(gross, jurisdiction.refund_cap_cents)
      policy_applied = policy
    input_set: "One immutable ScanLine with classification == OVERCHARGE plus the jurisdiction of the audited store."
    constants: {}
    precision: "Integer cents; the cap is applied last and is inclusive (a gross exactly equal to refund_cap_cents is paid in full)."
    variants: []

  - name: exception_report_category_ranking
    trigger: "on POST /price-integrity/exception-reports"
    algorithm: aggregation
    formula: |
      qualifying_audits = [a for a in ScannerAudit
                           where a.store_id == report.store_id
                             AND a.status == CLOSED
                             AND report.period_start_at <= a.closed_at < report.period_end_at]   # half-open window
      audit_count     = count(qualifying_audits)
      lines           = all ScanLine rows whose scanner_audit_id is in qualifying_audits
      scan_line_count = count(lines)
      group lines by ScanLine.category_code:
          sample_size      = count(lines in the group)
          error_count      = count(lines in the group with classification != MATCH)
          error_rate_pct   = ROUND_HALF_UP(error_count / sample_size * 100, 2)
      eligible = groups with sample_size >= MIN_CATEGORY_SAMPLE
      ranking  = eligible sorted by error_rate_pct DESC,
                             then error_count DESC,
                             then category_code ASC (lexicographic byte order)
      category_breakdown           = ranking, as { category_code, sample_size, error_count, error_rate_pct }
      top_category_code            = ranking[0].category_code
      top_category_error_rate_pct  = ranking[0].error_rate_pct
      # empty-candidate fallback: when `eligible` is empty the report is NOT created and the request
      # fails with ERR_NO_QUALIFYING_AUDIT_DATA (422).
    input_set: "CLOSED ScannerAudits of the store whose closed_at falls in [period_start_at, period_end_at); REOPENED, SCANNING and OPEN audits are excluded, as are categories below MIN_CATEGORY_SAMPLE."
    constants:
      MIN_CATEGORY_SAMPLE: 2
    precision: "2 decimal places, round_half_up. Ranking is fully deterministic: rate DESC, error_count DESC, category_code ASC; entity ids never participate."
    variants: []

  - name: signage_compliance_state
    trigger: "on POST /price-integrity/promo-signage (creation), on post, on remove, on POST /price-integrity/stores/{id}/signage-sweep, and on PATCH /price-integrity/jurisdictions/{id}"
    algorithm: projection
    formula: |
      missing_disclosure_codes = [c for c in jurisdiction.signage_disclosure_codes          # declared order preserved
                                  if c not in sign.disclosure_codes]
      compliance_state =
          NOT_APPLICABLE       when status IN {DRAFT, REMOVED}
          EXPIRED_NOT_REMOVED  when status == EXPIRED_PENDING_REMOVAL
          MISSING_DISCLOSURE   when status == NON_COMPLIANT
          COMPLIANT            when status == POSTED
      # sweep ordering is pinned: the expiry test runs BEFORE the disclosure test, so an expired sign
      # that ALSO lacks a disclosure becomes EXPIRED_PENDING_REMOVAL, never NON_COMPLIANT.
    input_set: "One PromoSignage row plus the signage_disclosure_codes of the jurisdiction governing its store."
    constants: {}
    precision: "Set difference over exact string equality, order taken from the jurisdiction's declared array."
    variants: []

# ============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# ============================================================================
# Priority ladder for this domain: auth -> authz -> schema -> existence -> own-state
# -> cross-entity state -> OCC -> regulatory/segregation-of-duties -> temporal
# -> constraint/uniqueness -> fiscal (budget, cap, quota) LAST.
validations:
  - priority: 10
    category: auth
    check: "X-User-Role is present and non-empty, and X-User-ID is present and non-empty whenever the claimed role is entity_backed (StoreManager, LabelAssociate, PriceAuditor); the three opaque roles (PricingAdmin, ComplianceOfficer, CustomerServiceDesk) send no X-User-ID and any value they do send is ignored"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "X-User-Role is one of the six declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 22
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to an existing Associate whose role_code matches the claimed role (LabelAssociate->LABEL_ASSOCIATE, PriceAuditor->PRICE_AUDITOR, StoreManager->STORE_MANAGER)"
    error_id: ERR_ROLE_CODE_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include LabelAssociate, PriceAuditor or StoreManager"

  - priority: 25
    category: business_constraint
    check: "Request body parses, every required input field is present, enum values are members of their declared set, integer fields are integers within range, timestamps are RFC3339, and arrays are arrays"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 26
    category: business_constraint
    check: "Pagination params are integers with 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 30
    category: existence
    check: "Every resource named by a path parameter exists, validated left-to-right in path order"
    error_id: "ERR_<ENTITY>_NOT_FOUND (see §1.6 for the per-entity codes)"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 32
    category: existence
    check: "Every FK supplied in the request body references an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND (see §1.6 for the per-entity codes)"
    http_status: 404
    applies_to: "all write endpoints carrying FK inputs"

  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2 (e.g. only OPEN/REOPENED audits accept scan lines; only SCANNING/REOPENED audits close, and because an OPEN audit necessarily has zero scan lines its close is reported by the empty-sample rule at priority 63 as ERR_AUDIT_SAMPLE_EMPTY rather than by this rule; only POSTED signage can be removed; only CLOSED audits can back a refund claim or an issue-findings call). On the five endpoints listed at priority 41 this rule covers only resources whose state is neither the transition source nor the transition target; a resource already sitting in the target state falls through to priority 41 instead."
    error_id: "ERR_<ENTITY>_INVALID_STATE or the transition-specific code in §1.6"
    http_status: 409
    applies_to: "all action and transition endpoints"

  - priority: 41
    category: state
    check: "The requested transition is not a repeat of one already performed (posting an already-POSTED sign, closing an already-CLOSED audit, verifying an already-VERIFIED label task, paying an already-PAID refund claim)"
    error_id: ERR_TRANSITION_ALREADY_APPLIED
    http_status: 409
    applies_to: "POST /price-integrity/scanner-audits/{id}/close, POST /price-integrity/promo-signage/{id}/post, POST /price-integrity/promo-signage/{id}/remove, POST /price-integrity/label-tasks/{id}/verify-placement, POST /price-integrity/refund-claims/{id}/settle"

  - priority: 42
    category: state
    check: "A refund claim may only be created against a ScanLine whose owning ScannerAudit.status == CLOSED"
    error_id: ERR_AUDIT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /price-integrity/refund-claims"

  - priority: 43
    category: state
    check: "Label printing requires the owning PriceChangeFile.status IN {DISTRIBUTED, PARTIALLY_EXECUTED}; a DRAFT, EXECUTED or SUPERSEDED file blocks the print"
    error_id: ERR_FILE_NOT_DISTRIBUTED
    http_status: 409
    applies_to: "POST /price-integrity/label-tasks/{id}/print"

  - priority: 44
    category: state
    check: "Issuing inspection findings requires the inspection's evidence ScannerAudit.status == CLOSED"
    error_id: ERR_EVIDENCE_AUDIT_NOT_CLOSED
    http_status: 409
    applies_to: "POST /price-integrity/regulatory-inspections/{id}/issue-findings"

  - priority: 45
    category: business_referential
    check: "When the request carries an expected_<entity>_version field, it equals the referenced entity's current version (see §1.2.1)"
    error_id: "the concurrency rule's declared error_id (ERR_STALE_PRICE_CHANGE_FILE_VERSION, ERR_STALE_INSPECTION_VERSION, ERR_STALE_SCANNER_AUDIT_VERSION)"
    http_status: 412
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks, POST /price-integrity/regulatory-inspections/{id}/response, POST /price-integrity/refund-claims"

  - priority: 50
    category: business_safety
    check: "Segregation of duties on placement verification: the verifying associate (X-User-ID) must differ from LabelTask.placed_by_associate_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /price-integrity/label-tasks/{id}/verify-placement"

  - priority: 50
    category: business_safety
    check: "Segregation of duties on exception remediation: remediation_owner_associate_id must not be an associate who closed any ScannerAudit counted in the report's period"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /price-integrity/exception-reports/{id}/assign-root-cause"

  - priority: 51
    category: business_safety
    check: "The acting associate's training_status == CERTIFIED and certification_expires_at > clock_now (verification, audit close, and scan-line posting all require a currently certified actor)"
    error_id: ERR_ASSOCIATE_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /price-integrity/label-tasks/{id}/verify-placement, POST /price-integrity/scanner-audits, POST /price-integrity/scanner-audits/{id}/scan-lines, POST /price-integrity/scanner-audits/{id}/close"

  - priority: 52
    category: business_safety
    check: "Store.compliance_posture gate: FROZEN blocks label-task creation, printing and signage posting outright; RESTRICTED blocks signage posting unless the request sets override_acknowledged == true"
    error_id: ERR_STORE_POSTURE_BLOCKED
    http_status: 422
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks, POST /price-integrity/label-tasks/{id}/print, POST /price-integrity/promo-signage/{id}/post"

  - priority: 54
    category: business_constraint
    check: "A line whose unit price cannot be displayed (net_content_qty <= 0 while the jurisdiction requires a unit-price basis other than PER_SINGLE_ITEM) cannot be tasked for labelling. This rule is keyed on unit_price_uom_rule alone; unit_price_required governs only the distribution precondition, so a jurisdiction with unit_price_required == false distributes such a file happily and still refuses to task the line"
    error_id: ERR_UNIT_PRICE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks"

  - priority: 56
    category: business_temporal
    check: "A PriceChangeFile may only be distributed while clock_now < effective_date + grace_period_hours"
    error_id: ERR_EFFECTIVE_DATE_PASSED
    http_status: 422
    applies_to: "POST /price-integrity/price-change-files/{id}/distribute"

  - priority: 58
    category: business_temporal
    check: "Declared intervals are well formed: promo_start_at < promo_end_at, scan_window_start < scan_window_end, scheduled_start_at < scheduled_end_at, period_start_at < period_end_at"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /price-integrity/promo-signage, POST /price-integrity/scanner-audits, POST /price-integrity/price-change-files/{id}/label-tasks, POST /price-integrity/exception-reports"

  - priority: 59
    category: business_temporal
    check: "Placement verification must happen within VERIFICATION_GRACE_HOURS (48h) of LabelTask.placed_at"
    error_id: ERR_VERIFICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /price-integrity/label-tasks/{id}/verify-placement"

  - priority: 60
    category: business_temporal
    check: "Aisle audit windows must not overlap: the new [scan_window_start, scan_window_end) plus a 60-minute cooldown after each existing window must be clear of every non-CLOSED audit on the same aisle. Conflict iff new.start < existing.end + 60min AND existing.start < new.end"
    error_id: ERR_AISLE_AUDIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /price-integrity/scanner-audits"

  - priority: 61
    category: business_temporal
    check: "Associate labour intervals must not overlap: closed-closed semantics, so a new [scheduled_start_at, scheduled_end_at] that merely touches an existing non-terminal LabelTask window of the same assignee is a conflict. Conflict iff new.start <= existing.end AND existing.start <= new.end"
    error_id: ERR_ASSOCIATE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks"

  - priority: 62
    category: business_constraint
    check: "Posted promotional signage must carry every disclosure code the jurisdiction requires; missing_disclosure_codes must be empty"
    error_id: ERR_MISSING_DISCLOSURE
    http_status: 422
    applies_to: "POST /price-integrity/promo-signage/{id}/post"

  - priority: 63
    category: business_constraint
    check: "Uniqueness: one LabelTask per (price_change_line_id, store_id); one sign_code per store; one open ExceptionReport per (store_id, period_start_at, period_end_at); one RefundClaim per (scan_line_id, customer_ref)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks, POST /price-integrity/promo-signage, POST /price-integrity/exception-reports, POST /price-integrity/refund-claims"

  - priority: 63
    category: business_constraint
    check: "Empty-candidate guard: an exception report needs at least one category with sample_size >= MIN_CATEGORY_SAMPLE drawn from CLOSED audits inside the half-open period"
    error_id: ERR_NO_QUALIFYING_AUDIT_DATA
    http_status: 422
    applies_to: "POST /price-integrity/exception-reports"

  - priority: 63
    category: business_constraint
    check: "An audit cannot be closed with zero scan lines (the audit is still OPEN, since the first scan line is what moves it to SCANNING), and a refund claim requires a ScanLine whose classification == OVERCHARGE (register_price_cents > shelf_price_cents)"
    error_id: ERR_AUDIT_SAMPLE_EMPTY / ERR_NOT_AN_OVERCHARGE
    http_status: 422
    applies_to: "POST /price-integrity/scanner-audits/{id}/close, POST /price-integrity/refund-claims"

  - priority: 64
    category: business_constraint
    check: "A finding may only be waived with a non-empty waiver_reason, and may only be remediated once remediation_action_code and remediation_evidence_ref are both supplied"
    error_id: ERR_REMEDIATION_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /price-integrity/inspection-findings/{id}/transition"

  - priority: 66
    category: business_referential
    check: "The Aisle named by aisle_id must belong to the store named by store_id (label tasks, audits, signage)"
    error_id: ERR_AISLE_STORE_MISMATCH
    http_status: 422
    applies_to: "POST /price-integrity/scanner-audits, POST /price-integrity/promo-signage, POST /price-integrity/price-change-files/{id}/label-tasks"

  - priority: 67
    category: business_referential
    check: "The associate named by an assignment or actor field must belong to the store the operation targets"
    error_id: ERR_ASSOCIATE_STORE_MISMATCH
    http_status: 422
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks, POST /price-integrity/scanner-audits, POST /price-integrity/aisles/{id}/assign-associate, POST /price-integrity/exception-reports/{id}/assign-root-cause"

  - priority: 68
    category: business_referential
    check: "The store must be inside the price change file's scope_store_ids and share the file's jurisdiction_id"
    error_id: ERR_STORE_OUT_OF_FILE_SCOPE
    http_status: 422
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks"

  - priority: 70
    category: business_constraint
    check: "Associate labour: total scheduled minutes for one assignee on a single UTC calendar day may not exceed ASSOCIATE_DAILY_MINUTES_CAP (480), counting the new task plus all existing non-terminal tasks"
    error_id: ERR_ASSOCIATE_DAILY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /price-integrity/price-change-files/{id}/label-tasks"

  - priority: 72
    category: business_fiscal
    check: "Refund budget: Store.refund_liability_outstanding_cents + this claim's claimed_amount_cents may not exceed jurisdiction.refund_budget_per_audit_cents"
    error_id: ERR_REFUND_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /price-integrity/refund-claims"

  - priority: 74
    category: business_fiscal
    check: "An assessed_penalty_cents override supplied on adjudication may not exceed the recomputed penalty_exposure_cents"
    error_id: ERR_PENALTY_OVERRIDE_TOO_HIGH
    http_status: 422
    applies_to: "POST /price-integrity/regulatory-inspections/{id}/adjudicate"

  - priority: 76
    category: business_fiscal
    check: "A refund claim may only be settled to PAID while the claim's status == APPROVED and the store's outstanding liability covers it; denial requires a non-empty denial_reason"
    error_id: "ERR_REFUND_NOT_APPROVED (409) on the pay path / ERR_DENIAL_REASON_REQUIRED (422) on the deny path"
    http_status: 409
    applies_to: "POST /price-integrity/refund-claims/{id}/settle"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
# Every path parameter is spelled `{id}` regardless of which entity it names;
# the entity is unambiguous from the collection segment that precedes it.
endpoints:
  # ---- Jurisdiction ---------------------------------------------------------
  - method: POST
    path: "/price-integrity/jurisdictions"
    description: "Register a pricing jurisdiction with its unit-price display rules, scanner error-rate threshold, refund policy, penalty rates and signage disclosure requirements."
    roles: [PricingAdmin]
    code: 201
    input: ["code", "name", "unit_price_required?", "unit_price_uom_rule?", "unit_price_decimal_places?", "unit_price_rounding?", "scanner_error_rate_threshold_pct?", "default_rate_variant?", "overcharge_refund_policy?", "refund_fixed_bonus_cents?", "refund_cap_cents?", "refund_budget_per_audit_cents?", "penalty_per_violation_cents?", "penalty_max_cents?", "signage_disclosure_codes?", "grace_period_hours?", "accountability_variant?"]
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/price-integrity/jurisdictions/{id}"
    description: "Fetch one jurisdiction and its rule configuration."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, LabelAssociate, CustomerServiceDesk]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/price-integrity/jurisdictions"
    description: "List jurisdictions."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: PATCH
    path: "/price-integrity/jurisdictions/{id}"
    description: "Amend jurisdiction rules. Changing signage_disclosure_codes re-derives missing_disclosure_codes and compliance_state for every non-REMOVED sign in the jurisdiction and recomputes each affected store's posture."
    roles: [PricingAdmin]
    code: 200
    input: ["unit_price_uom_rule?", "unit_price_decimal_places?", "unit_price_rounding?", "scanner_error_rate_threshold_pct?", "default_rate_variant?", "overcharge_refund_policy?", "refund_fixed_bonus_cents?", "refund_cap_cents?", "refund_budget_per_audit_cents?", "penalty_per_violation_cents?", "penalty_max_cents?", "signage_disclosure_codes?", "grace_period_hours?", "accountability_variant?"]
    output: Jurisdiction
    side_effects: [signage_compliance_state, store_compliance_posture]

  # ---- Store ---------------------------------------------------------------
  - method: POST
    path: "/price-integrity/stores"
    description: "Open a store inside a jurisdiction. compliance_posture starts OPEN and every derived counter starts at 0."
    roles: [PricingAdmin]
    code: 201
    input: [store_number, name, jurisdiction_id]
    output: Store
    side_effects: [store_compliance_posture]

  - method: GET
    path: "/price-integrity/stores/{id}"
    description: "Fetch one store with its derived compliance counters."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, LabelAssociate, CustomerServiceDesk]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/price-integrity/stores"
    description: "List stores, optionally filtered by jurisdiction or posture."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: ["jurisdiction_id?", "compliance_posture?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: GET
    path: "/price-integrity/stores/{id}/compliance-summary"
    description: "Computed read: recomputes label_backlog_count and compliance_posture from live data and returns the store projection, so a test can reconcile every derived counter against the underlying rows."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: []
    output: Store
    side_effects: [store_label_backlog_count, store_compliance_posture]

  # ---- Aisle ---------------------------------------------------------------
  - method: POST
    path: "/price-integrity/stores/{id}/aisles"
    description: "Create an aisle in the store, optionally with an assigned label associate."
    roles: [StoreManager, PricingAdmin]
    code: 201
    input: ["aisle_code", "category_code", "assigned_associate_id?"]
    output: Aisle
    side_effects: []

  - method: GET
    path: "/price-integrity/aisles/{id}"
    description: "Fetch one aisle."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, LabelAssociate]
    code: 200
    input: []
    output: Aisle
    side_effects: []

  - method: GET
    path: "/price-integrity/stores/{id}/aisles"
    description: "List the aisles of a store (reverse lookup for Aisle.store_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, LabelAssociate]
    code: 200
    input: ["category_code?", "limit?", "offset?"]
    output: Aisle[]
    side_effects: []

  - method: GET
    path: "/price-integrity/associates/{id}/aisles"
    description: "List the aisles assigned to an associate (reverse lookup for Aisle.assigned_associate_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, LabelAssociate]
    code: 200
    input: ["limit?", "offset?"]
    output: Aisle[]
    side_effects: []

  - method: POST
    path: "/price-integrity/aisles/{id}/assign-associate"
    description: "Set or clear the aisle's accountable label associate. The assignee must belong to the aisle's store."
    roles: [StoreManager]
    code: 200
    input: [assigned_associate_id]
    output: Aisle
    side_effects: []

  # ---- Associate -----------------------------------------------------------
  - method: POST
    path: "/price-integrity/stores/{id}/associates"
    description: "Hire an associate into the store with a role_code. training_status starts UNTRAINED and accountability_score starts at 100."
    roles: [StoreManager, PricingAdmin]
    code: 201
    input: [employee_number, full_name, role_code]
    output: Associate
    side_effects: []

  - method: GET
    path: "/price-integrity/associates/{id}"
    description: "Fetch one associate with training status and accountability score."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, LabelAssociate]
    code: 200
    input: []
    output: Associate
    side_effects: []

  - method: GET
    path: "/price-integrity/stores/{id}/associates"
    description: "List the associates of a store (reverse lookup for Associate.store_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor]
    code: 200
    input: ["role_code?", "training_status?", "limit?", "offset?"]
    output: Associate[]
    side_effects: []

  - method: POST
    path: "/price-integrity/associates/{id}/training-completions"
    description: "Record a label-maintenance training result. A score >= TRAINING_PASS_SCORE_PCT moves UNTRAINED/IN_TRAINING -> CERTIFIED and stamps certification_expires_at = clock_now + CERTIFICATION_VALID_DAYS. Completing REMEDIAL_LABEL_101 while SUSPENDED reinstates the associate and completes their open SUSPENSION / RETRAINING_ASSIGNED actions."
    roles: [StoreManager, PricingAdmin]
    code: 200
    input: [module_code, score_pct]
    output: Associate
    side_effects: [associate_accountability_score]

  - method: POST
    path: "/price-integrity/associates/{id}/accountability-actions"
    description: "Issue an accountability action against an associate for label-maintenance failure. score_weight is computed from ACTION_WEIGHTS and the associate's accountability_score is re-derived, which can drive CERTIFIED -> SUSPENDED."
    roles: [StoreManager, ComplianceOfficer]
    code: 201
    input: ["trigger_code", "action_type", "source_ref?"]
    output: AccountabilityAction
    side_effects: [associate_accountability_score, store_label_backlog_count, store_compliance_posture]

  - method: GET
    path: "/price-integrity/accountability-actions/{id}"
    description: "Fetch one accountability action."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: []
    output: AccountabilityAction
    side_effects: []

  - method: GET
    path: "/price-integrity/associates/{id}/accountability-actions"
    description: "List an associate's accountability actions (reverse lookup for AccountabilityAction.associate_id; the only discovery channel for cascade-created actions)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: ["status?", "trigger_code?", "limit?", "offset?"]
    output: AccountabilityAction[]
    side_effects: []

  - method: POST
    path: "/price-integrity/accountability-actions/{id}/transition"
    description: "Complete or void an issued action. Voiding is the compensating operation for the accountability-score invariant; both transitions drop the action out of the ISSUED weight sum."
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: ["target_status", "void_reason?"]
    output: AccountabilityAction
    side_effects: [associate_accountability_score]

  # ---- PriceChangeFile / PriceChangeLine ------------------------------------
  - method: POST
    path: "/price-integrity/price-change-files"
    description: "Create a DRAFT price change file scoped to a list of store ids with an effective date."
    roles: [PricingAdmin]
    code: 201
    input: ["file_number", "jurisdiction_id", "effective_date", "scope_store_ids", "priority?"]
    output: PriceChangeFile
    side_effects: []

  - method: GET
    path: "/price-integrity/price-change-files/{id}"
    description: "Fetch one price change file with its line and verified-line counts."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: []
    output: PriceChangeFile
    side_effects: []

  - method: GET
    path: "/price-integrity/price-change-files"
    description: "List price change files. superseded_by_file_id is the reverse lookup for the self-referential supersession FK."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: ["jurisdiction_id?", "status?", "superseded_by_file_id?", "priority?", "limit?", "offset?"]
    output: PriceChangeFile[]
    side_effects: []

  - method: POST
    path: "/price-integrity/price-change-files/{id}/lines"
    description: "Add a price change line to a DRAFT file. unit_price_display_cents, unit_price_basis_qty and unit_price_basis_uom are computed at insert from the jurisdiction's unit-price rules."
    roles: [PricingAdmin]
    code: 201
    input: ["item_upc", "item_description", "category_code", "old_retail_cents", "new_retail_cents", "net_content_qty", "net_content_uom", "promo_flag?"]
    output: PriceChangeLine
    side_effects: [unit_price_display]

  - method: GET
    path: "/price-integrity/price-change-lines/{id}"
    description: "Fetch one price change line with its computed unit-price display fields."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: []
    output: PriceChangeLine
    side_effects: []

  - method: GET
    path: "/price-integrity/price-change-files/{id}/lines"
    description: "List the lines of a price change file (reverse lookup for PriceChangeLine.price_change_file_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: ["line_status?", "category_code?", "limit?", "offset?"]
    output: PriceChangeLine[]
    side_effects: []

  - method: POST
    path: "/price-integrity/price-change-files/{id}/distribute"
    description: "Distribute a DRAFT file to its scoped stores. Re-runs unit_price_display for every non-WITHDRAWN line, stamps distributed_at and moves the file to DISTRIBUTED."
    roles: [PricingAdmin]
    code: 200
    input: []
    output: PriceChangeFile
    side_effects: [unit_price_display]

  - method: POST
    path: "/price-integrity/price-change-files/{id}/supersede"
    description: "Supersede a DISTRIBUTED or PARTIALLY_EXECUTED file with a newer one. Cascade: file -> SUPERSEDED, all non-VERIFIED lines -> WITHDRAWN, their unplaced label tasks' print axis -> REPRINT_REQUIRED, then each affected store's backlog and posture are recomputed."
    roles: [PricingAdmin]
    code: 200
    input: [superseded_by_file_id]
    output: PriceChangeFile
    side_effects: [store_label_backlog_count, store_compliance_posture]

  # ---- LabelTask -----------------------------------------------------------
  - method: POST
    path: "/price-integrity/price-change-files/{id}/label-tasks"
    description: "Create the store-level execution task for one line of a distributed file. Guarded by expected_price_change_file_version (OCC), by the store's posture, by aisle/associate ownership, by the associate's labour window and by the daily minutes cap. due_at is computed from the file's effective_date plus the jurisdiction grace period."
    roles: [StoreManager, PricingAdmin]
    code: 201
    input: [store_id, price_change_line_id, aisle_id, assigned_associate_id, scheduled_start_at, scheduled_end_at, expected_price_change_file_version]
    output: LabelTask
    side_effects: [label_task_due_at, store_label_backlog_count, store_compliance_posture]

  - method: GET
    path: "/price-integrity/label-tasks/{id}"
    description: "Fetch one label task with both status axes and its overdue flag."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: []
    output: LabelTask
    side_effects: []

  - method: GET
    path: "/price-integrity/label-tasks"
    description: "List label tasks. Collapses all six LabelTask foreign keys into one filtered list (store_id, price_change_line_id, aisle_id, assigned_associate_id, placed_by_associate_id, verified_by_associate_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: ["store_id?", "price_change_line_id?", "aisle_id?", "assigned_associate_id?", "placed_by_associate_id?", "verified_by_associate_id?", "print_status?", "placement_status?", "overdue?", "limit?", "offset?"]
    output: LabelTask[]
    side_effects: []

  - method: POST
    path: "/price-integrity/label-tasks/{id}/print"
    description: "Print the shelf label. Moves the print axis NOT_PRINTED|REPRINT_REQUIRED -> PRINTED and stamps printed_label_serial. Requires the owning file to be DISTRIBUTED or PARTIALLY_EXECUTED and the store not FROZEN. The placement axis is untouched."
    roles: [LabelAssociate, StoreManager]
    code: 200
    input: []
    output: LabelTask
    side_effects: []

  - method: POST
    path: "/price-integrity/label-tasks/{id}/place"
    description: "Record physical placement of a printed label. Moves the placement axis UNPLACED|REJECTED -> PLACED, stamps placed_at and placed_by_associate_id from X-User-ID, and records the observed shelf price. Requires print_status == PRINTED."
    roles: [LabelAssociate, StoreManager]
    code: 200
    input: [observed_shelf_price_cents]
    output: LabelTask
    side_effects: [store_label_backlog_count, store_compliance_posture]

  - method: POST
    path: "/price-integrity/label-tasks/{id}/verify-placement"
    description: "Second-person placement verification. outcome VERIFIED drives the depth-4 cascade line -> file -> store; outcome REJECTED pushes the placement axis back to REJECTED, increments rejection_count and, at REJECTION_ACTION_THRESHOLD, issues an accountability action against the placer. Segregation of duties: the verifier must differ from placed_by_associate_id."
    roles: [PriceAuditor, StoreManager]
    code: 200
    input: ["outcome", "rejection_reason?"]
    output: LabelTask
    side_effects: [associate_accountability_score, store_label_backlog_count, store_compliance_posture]

  # ---- ScannerAudit / ScanLine ---------------------------------------------
  - method: POST
    path: "/price-integrity/scanner-audits"
    description: "Schedule a scanner accuracy audit on one aisle over a half-open scan window. Rejected when the window (extended by a 60-minute cooldown after each existing window) overlaps another non-CLOSED audit on the same aisle."
    roles: [PriceAuditor, ComplianceOfficer]
    code: 201
    input: [store_id, aisle_id, auditor_associate_id, audit_type, scan_window_start, scan_window_end]
    output: ScannerAudit
    side_effects: []

  - method: GET
    path: "/price-integrity/scanner-audits/{id}"
    description: "Fetch one scanner audit with both computed error rates, the applied variant and the outcome."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, CustomerServiceDesk]
    code: 200
    input: []
    output: ScannerAudit
    side_effects: []

  - method: GET
    path: "/price-integrity/scanner-audits"
    description: "List scanner audits (reverse lookup for store_id, aisle_id and auditor_associate_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor]
    code: 200
    input: ["store_id?", "aisle_id?", "auditor_associate_id?", "status?", "outcome?", "audit_type?", "limit?", "offset?"]
    output: ScannerAudit[]
    side_effects: []

  - method: POST
    path: "/price-integrity/scanner-audits/{id}/scan-lines"
    description: "Append one immutable scan observation comparing the shelf price to the register price. variance_cents, classification and category_code are computed at insert. The first scan line moves the audit OPEN -> SCANNING."
    roles: [PriceAuditor]
    code: 201
    input: [item_upc, shelf_price_cents, register_price_cents]
    output: ScanLine
    side_effects: []

  - method: GET
    path: "/price-integrity/scan-lines/{id}"
    description: "Fetch one immutable scan line."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, CustomerServiceDesk]
    code: 200
    input: []
    output: ScanLine
    side_effects: []

  - method: GET
    path: "/price-integrity/scanner-audits/{id}/scan-lines"
    description: "List the scan lines of an audit (reverse lookup for ScanLine.scanner_audit_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, PriceAuditor, CustomerServiceDesk]
    code: 200
    input: ["classification?", "limit?", "offset?"]
    output: ScanLine[]
    side_effects: []

  - method: POST
    path: "/price-integrity/scanner-audits/{id}/close"
    description: "Close a SCANNING or REOPENED audit. Computes both rate variants, applies rate_variant (or the jurisdiction default), sets outcome FAIL when error_rate_pct >= the jurisdiction threshold, and on FAIL runs the depth-4 accountability cascade against the aisle's assigned associate."
    roles: [PriceAuditor, ComplianceOfficer]
    code: 200
    input: ["rate_variant?"]
    output: ScannerAudit
    side_effects: [scanner_audit_error_rate, audit_failure_action_type, associate_accountability_score, store_label_backlog_count, store_compliance_posture]

  - method: POST
    path: "/price-integrity/scanner-audits/{id}/reopen"
    description: "Reopen a CLOSED audit for additional scanning. Increments reopen_count, clears outcome back to PENDING and drops the audit out of the 30-day failed-audit posture count until it closes again."
    roles: [ComplianceOfficer]
    code: 200
    input: [reopen_reason]
    output: ScannerAudit
    side_effects: [store_compliance_posture]

  # ---- PromoSignage --------------------------------------------------------
  - method: POST
    path: "/price-integrity/promo-signage"
    description: "Draft promotional signage for an aisle over a promo window, optionally tied to a price change line, carrying its disclosure codes. missing_disclosure_codes is computed against the jurisdiction's required set."
    roles: [StoreManager, PricingAdmin]
    code: 201
    input: ["store_id", "aisle_id", "sign_code", "promo_start_at", "promo_end_at", "disclosure_codes", "price_change_line_id?"]
    output: PromoSignage
    side_effects: [signage_compliance_state]

  - method: GET
    path: "/price-integrity/promo-signage/{id}"
    description: "Fetch one promotional sign with its missing disclosures and compliance state."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: []
    output: PromoSignage
    side_effects: []

  - method: GET
    path: "/price-integrity/promo-signage"
    description: "List promotional signage (reverse lookup for store_id, aisle_id and price_change_line_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, LabelAssociate, PriceAuditor]
    code: 200
    input: ["store_id?", "aisle_id?", "price_change_line_id?", "status?", "compliance_state?", "limit?", "offset?"]
    output: PromoSignage[]
    side_effects: []

  - method: POST
    path: "/price-integrity/promo-signage/{id}/post"
    description: "Post a DRAFT sign to the floor. Rejected when any required disclosure is missing, and blocked by a FROZEN store or by a RESTRICTED store unless override_acknowledged is true."
    roles: [StoreManager, LabelAssociate]
    code: 200
    input: ["override_acknowledged?"]
    output: PromoSignage
    side_effects: [signage_compliance_state, store_compliance_posture]

  - method: POST
    path: "/price-integrity/promo-signage/{id}/remove"
    description: "Take a posted or expired sign down. Stamps removed_at, moves the sign to REMOVED and drops it out of the store's signage_violation_count."
    roles: [StoreManager, LabelAssociate]
    code: 200
    input: []
    output: PromoSignage
    side_effects: [signage_compliance_state, store_compliance_posture]

  - method: POST
    path: "/price-integrity/stores/{id}/signage-sweep"
    description: "Operator checkpoint that re-evaluates every non-REMOVED sign of the store against clock_now. Pinned order: the expiry test runs first (POSTED with clock_now >= promo_end_at -> EXPIRED_PENDING_REMOVAL), then the disclosure test (POSTED with a missing disclosure -> NON_COMPLIANT). Returns the counts of each transition it applied."
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: []
    output: "{ swept_count: integer, expired_count: integer, non_compliant_count: integer, compliance_posture: string }"
    side_effects: [signage_compliance_state, store_compliance_posture]

  # ---- RegulatoryInspection / InspectionFinding -----------------------------
  - method: POST
    path: "/price-integrity/regulatory-inspections"
    description: "Log a regulatory inspection of a store, referencing the scanner audit that is its evidence of record."
    roles: [ComplianceOfficer]
    code: 201
    input: [store_id, scanner_audit_id, inspector_ref, inspection_date]
    output: RegulatoryInspection
    side_effects: []

  - method: GET
    path: "/price-integrity/regulatory-inspections/{id}"
    description: "Fetch one inspection with its penalty exposure, refund liability, credit and assessed penalty."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: []
    output: RegulatoryInspection
    side_effects: []

  - method: GET
    path: "/price-integrity/regulatory-inspections"
    description: "List inspections (reverse lookup for store_id and scanner_audit_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: ["store_id?", "scanner_audit_id?", "status?", "limit?", "offset?"]
    output: RegulatoryInspection[]
    side_effects: []

  - method: POST
    path: "/price-integrity/regulatory-inspections/{id}/issue-findings"
    description: "Cascade-create the inspector's findings on a SCHEDULED inspection and compute penalty_exposure_cents. Requires the evidence audit to be CLOSED. The created findings are discoverable only through GET /price-integrity/regulatory-inspections/{id}/findings."
    roles: [ComplianceOfficer]
    code: 200
    input: [findings]
    output: RegulatoryInspection
    side_effects: [penalty_exposure, store_compliance_posture]

  - method: GET
    path: "/price-integrity/inspection-findings/{id}"
    description: "Fetch one inspection finding with its penalty component."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: []
    output: InspectionFinding
    side_effects: []

  - method: GET
    path: "/price-integrity/regulatory-inspections/{id}/findings"
    description: "List the findings of an inspection (reverse lookup for InspectionFinding.regulatory_inspection_id; the only discovery channel for cascade-created findings)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: InspectionFinding[]
    side_effects: []

  - method: POST
    path: "/price-integrity/inspection-findings/{id}/transition"
    description: "Move one finding to REMEDIATION_PLANNED, REMEDIATED, WAIVED or ESCALATED. Each branch has different side effects: WAIVED zeroes the penalty component and recomputes the inspection's exposure (which can drop a tier); ESCALATED raises the store's escalated_finding_count and forces posture FROZEN."
    roles: [ComplianceOfficer, StoreManager]
    code: 200
    input: ["target_status", "remediation_action_code?", "remediation_evidence_ref?", "waiver_reason?"]
    output: InspectionFinding
    side_effects: [penalty_exposure, store_compliance_posture]

  - method: POST
    path: "/price-integrity/regulatory-inspections/{id}/response"
    description: "Submit the store's remediation response. Guarded by expected_regulatory_inspection_version (OCC) because issue-findings and every finding transition silently bump the inspection's version. Increments response_round and moves FINDINGS_ISSUED|RESPONSE_REJECTED -> RESPONSE_SUBMITTED."
    roles: [StoreManager, ComplianceOfficer]
    code: 200
    input: [remediation_summary, expected_regulatory_inspection_version]
    output: RegulatoryInspection
    side_effects: []

  - method: POST
    path: "/price-integrity/regulatory-inspections/{id}/adjudicate"
    description: "Regulator decision on a submitted response. decision REJECT returns the inspection to RESPONSE_REJECTED. decision ACCEPT runs the five-step pinned settlement (exposure -> refund liability -> credit -> assessed penalty -> store cumulative exposure) and closes the inspection."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "assessed_penalty_cents?", "rejection_note?"]
    output: RegulatoryInspection
    side_effects: [penalty_exposure, inspection_net_settlement, store_compliance_posture]

  # ---- RefundClaim ---------------------------------------------------------
  - method: POST
    path: "/price-integrity/refund-claims"
    description: "File an overcharge refund claim against a scan line of a CLOSED audit. store_id is resolved from the audit, claimed_amount_cents and policy_applied come from the jurisdiction's overcharge policy, and the claim is guarded by expected_scanner_audit_version (OCC) plus the per-audit refund budget."
    roles: [CustomerServiceDesk, StoreManager]
    code: 201
    input: [scan_line_id, customer_ref, expected_scanner_audit_version]
    output: RefundClaim
    side_effects: [refund_claim_amount, store_compliance_posture]

  - method: GET
    path: "/price-integrity/refund-claims/{id}"
    description: "Fetch one refund claim with its computed amount and applied policy."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, CustomerServiceDesk]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []

  - method: GET
    path: "/price-integrity/refund-claims"
    description: "List refund claims (reverse lookup for scan_line_id and store_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager, CustomerServiceDesk]
    code: 200
    input: ["scan_line_id?", "store_id?", "status?", "limit?", "offset?"]
    output: RefundClaim[]
    side_effects: []

  - method: POST
    path: "/price-integrity/refund-claims/{id}/settle"
    description: "Approve, pay or deny a refund claim. APPROVE and PAY keep the claim inside the store's outstanding liability; DENY is the compensating operation that releases it and must carry a denial_reason."
    roles: [CustomerServiceDesk, StoreManager]
    code: 200
    input: ["target_status", "denial_reason?"]
    output: RefundClaim
    side_effects: [store_compliance_posture]

  # ---- ExceptionReport -----------------------------------------------------
  - method: POST
    path: "/price-integrity/exception-reports"
    description: "Generate the high-error-category exception report for a store over a half-open period. Aggregates the scan lines of every CLOSED audit closed in the window, ranks categories by error rate and fails with ERR_NO_QUALIFYING_AUDIT_DATA when no category reaches MIN_CATEGORY_SAMPLE."
    roles: [ComplianceOfficer, StoreManager]
    code: 201
    input: [store_id, period_start_at, period_end_at]
    output: ExceptionReport
    side_effects: [exception_report_category_ranking]

  - method: GET
    path: "/price-integrity/exception-reports/{id}"
    description: "Fetch one exception report with its ranked category breakdown."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: []
    output: ExceptionReport
    side_effects: []

  - method: GET
    path: "/price-integrity/exception-reports"
    description: "List exception reports (reverse lookup for store_id and remediation_owner_associate_id)."
    roles: [PricingAdmin, ComplianceOfficer, StoreManager]
    code: 200
    input: ["store_id?", "remediation_owner_associate_id?", "status?", "limit?", "offset?"]
    output: ExceptionReport[]
    side_effects: []

  - method: POST
    path: "/price-integrity/exception-reports/{id}/assign-root-cause"
    description: "Record the root cause and the remediation owner, moving the report GENERATED -> REMEDIATION_OPEN. A root_cause_code of TRAINING_GAP additionally issues an EXCEPTION_ROOT_CAUSE accountability action against the owner. The owner must not be an associate who closed any audit counted in the report's period."
    roles: [ComplianceOfficer, StoreManager]
    code: 200
    input: [root_cause_code, remediation_owner_associate_id]
    output: ExceptionReport
    side_effects: [associate_accountability_score, store_compliance_posture]

  - method: POST
    path: "/price-integrity/exception-reports/{id}/close"
    description: "Close a report whose remediation is complete."
    roles: [ComplianceOfficer, StoreManager]
    code: 200
    input: [closure_note]
    output: ExceptionReport
    side_effects: []

  # ---- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/price-integrity/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, promo window, certification expiry, verification grace period and 30-day posture window is measured against. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [PricingAdmin, ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: []

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or empty on any request, or X-User-ID header missing or empty on a request claiming an entity_backed role (StoreManager, LabelAssociate, PriceAuditor)"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_ROLE_CODE_MISMATCH
    http: 403
    condition: "An entity_backed role's X-User-ID resolves to an Associate whose role_code does not match the claimed role"

  # ---- schema -------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unknown enum member, non-integer where integer required, or malformed timestamp"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative"

  # ---- existence ----------------------------------------------------------
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "jurisdiction_id (path or body) names no jurisdiction"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "store_id (path or body) names no store"
  - id: ERR_AISLE_NOT_FOUND
    http: 404
    condition: "aisle_id (path or body) names no aisle"
  - id: ERR_ASSOCIATE_NOT_FOUND
    http: 404
    condition: "An associate id (path, assignment field, or entity_backed X-User-ID) names no associate"
  - id: ERR_PRICE_CHANGE_FILE_NOT_FOUND
    http: 404
    condition: "A price change file id (path or superseded_by_file_id) names no file"
  - id: ERR_PRICE_CHANGE_LINE_NOT_FOUND
    http: 404
    condition: "price_change_line_id names no line"
  - id: ERR_LABEL_TASK_NOT_FOUND
    http: 404
    condition: "The label task id in the path names no task"
  - id: ERR_SCANNER_AUDIT_NOT_FOUND
    http: 404
    condition: "scanner_audit_id (path or body) names no audit"
  - id: ERR_SCAN_LINE_NOT_FOUND
    http: 404
    condition: "scan_line_id names no scan line"
  - id: ERR_PROMO_SIGNAGE_NOT_FOUND
    http: 404
    condition: "The signage id in the path names no sign"
  - id: ERR_REGULATORY_INSPECTION_NOT_FOUND
    http: 404
    condition: "The inspection id in the path names no inspection"
  - id: ERR_INSPECTION_FINDING_NOT_FOUND
    http: 404
    condition: "The finding id in the path names no finding"
  - id: ERR_REFUND_CLAIM_NOT_FOUND
    http: 404
    condition: "The refund claim id in the path names no claim"
  - id: ERR_EXCEPTION_REPORT_NOT_FOUND
    http: 404
    condition: "The exception report id in the path names no report"
  - id: ERR_ACCOUNTABILITY_ACTION_NOT_FOUND
    http: 404
    condition: "The accountability action id in the path names no action"

  # ---- own-state ----------------------------------------------------------
  - id: ERR_FILE_INVALID_STATE
    http: 409
    condition: "Price change file is not in a state that permits the requested operation (adding lines to a non-DRAFT file, distributing a non-DRAFT file, superseding a DRAFT/EXECUTED/SUPERSEDED file, or creating a label task against a file that is not DISTRIBUTED or PARTIALLY_EXECUTED)"
  - id: ERR_LABEL_TASK_INVALID_STATE
    http: 409
    condition: "The label task's print or placement axis forbids the requested transition (verifying an UNPLACED task, placing a REJECTED-then-unprinted task)"
  - id: ERR_AUDIT_INVALID_STATE
    http: 409
    condition: "Scanner audit state forbids the operation (appending scan lines to a CLOSED audit, closing an OPEN audit that has no lines yet, reopening a non-CLOSED audit)"
  - id: ERR_SIGNAGE_INVALID_STATE
    http: 409
    condition: "Signage state forbids the operation (posting a NON_COMPLIANT or REMOVED sign, removing a DRAFT sign)"
  - id: ERR_INSPECTION_INVALID_STATE
    http: 409
    condition: "Inspection state forbids the operation (issuing findings twice, responding to a SCHEDULED or CLOSED inspection, adjudicating an inspection with no submitted response)"
  - id: ERR_FINDING_INVALID_STATE
    http: 409
    condition: "The finding's current status does not permit the requested target status (remediating an OPEN finding, waiving a REMEDIATED finding, transitioning a WAIVED finding)"
  - id: ERR_REFUND_CLAIM_INVALID_STATE
    http: 409
    condition: "The refund claim's status forbids the requested settlement transition (approving a DENIED claim, denying a PAID claim)"
  - id: ERR_EXCEPTION_REPORT_INVALID_STATE
    http: 409
    condition: "Exception report state forbids the operation (assigning a root cause twice, closing a GENERATED report)"
  - id: ERR_ACTION_INVALID_STATE
    http: 409
    condition: "The accountability action is already COMPLETED or VOIDED and cannot transition again"
  - id: ERR_ASSOCIATE_INVALID_STATE
    http: 409
    condition: "The associate's training_status forbids the operation: issuing an accountability action against a SUSPENDED associate, or recording a non-remedial training completion for a SUSPENDED associate (only REMEDIAL_LABEL_101 can reinstate one)"
  - id: ERR_TRANSITION_ALREADY_APPLIED
    http: 409
    condition: "The exact transition requested has already been applied to this resource (idempotency probe: second close, second post, second verify, second settle)"

  # ---- cross-entity state -------------------------------------------------
  - id: ERR_AUDIT_NOT_CLOSED
    http: 409
    condition: "A refund claim references a scan line whose owning audit is not CLOSED"
  - id: ERR_FILE_NOT_DISTRIBUTED
    http: 409
    condition: "Label printing attempted while the owning price change file is not DISTRIBUTED or PARTIALLY_EXECUTED"
  - id: ERR_EVIDENCE_AUDIT_NOT_CLOSED
    http: 409
    condition: "issue-findings attempted while the inspection's evidence scanner audit is not CLOSED"
  - id: ERR_LABEL_NOT_PRINTED
    http: 409
    condition: "Placement recorded while print_status is NOT_PRINTED or REPRINT_REQUIRED"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_PRICE_CHANGE_FILE_VERSION
    http: 412
    condition: "expected_price_change_file_version does not equal the file's current version"
  - id: ERR_STALE_INSPECTION_VERSION
    http: 412
    condition: "expected_regulatory_inspection_version does not equal the inspection's current version"
  - id: ERR_STALE_SCANNER_AUDIT_VERSION
    http: 412
    condition: "expected_scanner_audit_version does not equal the audit's current version"

  # ---- regulatory / segregation of duties --------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The verifier equals the placer of the label task, or an exception report's remediation owner closed an audit counted in the report period"
  - id: ERR_ASSOCIATE_NOT_CERTIFIED
    http: 422
    condition: "The acting or referenced associate is not CERTIFIED, or their certification_expires_at is at or before clock_now"
  - id: ERR_STORE_POSTURE_BLOCKED
    http: 422
    condition: "Store.compliance_posture is FROZEN, or RESTRICTED without override_acknowledged, for a posture-gated operation"
  - id: ERR_UNIT_PRICE_UNAVAILABLE
    http: 422
    condition: "The line's net_content_qty is not positive while the jurisdiction requires a unit-price basis other than PER_SINGLE_ITEM, so no unit price can be displayed"
  - id: ERR_TRAINING_SCORE_TOO_LOW
    http: 422
    condition: "A SUSPENDED associate submits REMEDIAL_LABEL_101 with score_pct below TRAINING_PASS_SCORE_PCT, so the reinstatement is refused. A failing score for an UNTRAINED or IN_TRAINING associate is NOT an error: it is recorded and leaves them IN_TRAINING"

  # ---- temporal ----------------------------------------------------------
  - id: ERR_EFFECTIVE_DATE_PASSED
    http: 422
    condition: "Distribution attempted at or after effective_date plus the jurisdiction's grace_period_hours"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "A declared interval has start at or after end (promo, scan, labour or report period)"
  - id: ERR_VERIFICATION_WINDOW_CLOSED
    http: 422
    condition: "Placement verification attempted more than VERIFICATION_GRACE_HOURS after placed_at"
  - id: ERR_AISLE_AUDIT_WINDOW_CONFLICT
    http: 409
    condition: "The requested scan window, extended by the 60-minute post-window cooldown, overlaps a non-CLOSED audit on the same aisle"
  - id: ERR_ASSOCIATE_SCHEDULE_CONFLICT
    http: 409
    condition: "The requested labour interval touches or overlaps (closed-closed) an existing non-terminal label task of the same assignee"

  # ---- constraint / uniqueness -------------------------------------------
  - id: ERR_MISSING_DISCLOSURE
    http: 422
    condition: "Posting signage whose disclosure_codes omit at least one code required by the jurisdiction"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violated: duplicate label task per (price_change_line_id, store_id), duplicate sign_code per store, duplicate exception report period per store, or duplicate refund claim per (scan_line_id, customer_ref)"
  - id: ERR_NO_QUALIFYING_AUDIT_DATA
    http: 422
    condition: "No category in the report period reaches MIN_CATEGORY_SAMPLE scan lines drawn from CLOSED audits"
  - id: ERR_AUDIT_SAMPLE_EMPTY
    http: 422
    condition: "Audit close attempted with zero scan lines, so no error rate is defined"
  - id: ERR_NOT_AN_OVERCHARGE
    http: 422
    condition: "A refund claim references a scan line whose classification is MATCH or UNDERCHARGE"
  - id: ERR_REMEDIATION_EVIDENCE_REQUIRED
    http: 422
    condition: "A finding transition to REMEDIATED omits remediation_action_code or remediation_evidence_ref, or a transition to WAIVED omits waiver_reason"
  - id: ERR_FINDINGS_EMPTY
    http: 422
    condition: "issue-findings called with an empty findings array"
  - id: ERR_FILE_HAS_NO_LINES
    http: 422
    condition: "Distribution attempted on a file with zero price change lines"
  - id: ERR_SUPERSEDING_FILE_INVALID
    http: 422
    condition: "superseded_by_file_id equals the file being superseded, belongs to a different jurisdiction, or is itself SUPERSEDED"
  - id: ERR_DENIAL_REASON_REQUIRED
    http: 422
    condition: "A refund claim is denied without a non-empty denial_reason"
  - id: ERR_VOID_REASON_REQUIRED
    http: 422
    condition: "An accountability action is voided without a non-empty void_reason"

  # ---- referential integrity ---------------------------------------------
  - id: ERR_AISLE_STORE_MISMATCH
    http: 422
    condition: "The referenced aisle does not belong to the referenced store"
  - id: ERR_ASSOCIATE_STORE_MISMATCH
    http: 422
    condition: "The referenced associate does not belong to the store the operation targets"
  - id: ERR_STORE_OUT_OF_FILE_SCOPE
    http: 422
    condition: "The store is absent from the price change file's scope_store_ids or sits in a different jurisdiction than the file"

  # ---- fiscal ------------------------------------------------------------
  - id: ERR_ASSOCIATE_DAILY_CAP_EXCEEDED
    http: 422
    condition: "The assignee's scheduled minutes for the UTC day would exceed ASSOCIATE_DAILY_MINUTES_CAP once this task is added"
  - id: ERR_REFUND_BUDGET_EXCEEDED
    http: 422
    condition: "The store's outstanding refund liability plus this claim would exceed the jurisdiction's refund_budget_per_audit_cents"
  - id: ERR_PENALTY_OVERRIDE_TOO_HIGH
    http: 422
    condition: "An assessed_penalty_cents override on adjudication exceeds the recomputed penalty_exposure_cents"
  - id: ERR_REFUND_NOT_APPROVED
    http: 409
    condition: "PAY requested on a refund claim whose status is not APPROVED"

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:
  - name: PricingAdmin
    description: "Corporate pricing administrator: owns jurisdictions, stores, price change files and their lines, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /price-integrity/jurisdictions"
      - "PATCH /price-integrity/jurisdictions/{id}"
      - "POST /price-integrity/stores"
      - "POST /price-integrity/price-change-files"
      - "POST /price-integrity/price-change-files/{id}/lines"
      - "POST /price-integrity/price-change-files/{id}/distribute"
      - "POST /price-integrity/price-change-files/{id}/supersede"
    shared_operations:
      - "POST /price-integrity/stores/{id}/aisles"
      - "POST /price-integrity/stores/{id}/associates"
      - "POST /price-integrity/associates/{id}/training-completions"
      - "POST /price-integrity/price-change-files/{id}/label-tasks"
      - "POST /price-integrity/promo-signage"
      - "POST /price-integrity/_clock/set_current_utc"
      - "all GET reads except the store-scoped aisle/associate ownership lists reserved to store roles"

  - name: ComplianceOfficer
    description: "Corporate compliance officer: owns scanner audit governance, regulatory inspections, findings, exception reports and the logical clock during audit replays."
    identity: "opaque"
    exclusive_operations:
      - "POST /price-integrity/scanner-audits/{id}/reopen"
      - "POST /price-integrity/regulatory-inspections"
      - "POST /price-integrity/regulatory-inspections/{id}/issue-findings"
      - "POST /price-integrity/regulatory-inspections/{id}/adjudicate"
    shared_operations:
      - "POST /price-integrity/scanner-audits"
      - "POST /price-integrity/scanner-audits/{id}/close"
      - "POST /price-integrity/inspection-findings/{id}/transition"
      - "POST /price-integrity/regulatory-inspections/{id}/response"
      - "POST /price-integrity/associates/{id}/accountability-actions"
      - "POST /price-integrity/accountability-actions/{id}/transition"
      - "POST /price-integrity/exception-reports"
      - "POST /price-integrity/exception-reports/{id}/assign-root-cause"
      - "POST /price-integrity/exception-reports/{id}/close"
      - "POST /price-integrity/stores/{id}/signage-sweep"
      - "POST /price-integrity/_clock/set_current_utc"

  - name: StoreManager
    description: "Store manager, acting as an Associate with role_code STORE_MANAGER: staffs the store, creates label tasks, may perform any floor step, and answers inspections."
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /price-integrity/aisles/{id}/assign-associate"
    shared_operations:
      - "POST /price-integrity/stores/{id}/aisles"
      - "POST /price-integrity/stores/{id}/associates"
      - "POST /price-integrity/associates/{id}/training-completions"
      - "POST /price-integrity/associates/{id}/accountability-actions"
      - "POST /price-integrity/accountability-actions/{id}/transition"
      - "POST /price-integrity/price-change-files/{id}/label-tasks"
      - "POST /price-integrity/label-tasks/{id}/print"
      - "POST /price-integrity/label-tasks/{id}/place"
      - "POST /price-integrity/label-tasks/{id}/verify-placement"
      - "POST /price-integrity/promo-signage"
      - "POST /price-integrity/promo-signage/{id}/post"
      - "POST /price-integrity/promo-signage/{id}/remove"
      - "POST /price-integrity/stores/{id}/signage-sweep"
      - "POST /price-integrity/inspection-findings/{id}/transition"
      - "POST /price-integrity/regulatory-inspections/{id}/response"
      - "POST /price-integrity/refund-claims"
      - "POST /price-integrity/refund-claims/{id}/settle"
      - "POST /price-integrity/exception-reports"
      - "POST /price-integrity/exception-reports/{id}/assign-root-cause"
      - "POST /price-integrity/exception-reports/{id}/close"

  - name: LabelAssociate
    description: "Floor associate, acting as an Associate with role_code LABEL_ASSOCIATE: prints and places shelf labels and posts or removes promotional signage. Never verifies their own placement."
    identity: "entity_backed:Associate"
    exclusive_operations: []
    shared_operations:
      - "POST /price-integrity/label-tasks/{id}/print"
      - "POST /price-integrity/label-tasks/{id}/place"
      - "POST /price-integrity/promo-signage/{id}/post"
      - "POST /price-integrity/promo-signage/{id}/remove"
      - "GET /price-integrity/label-tasks"
      - "GET /price-integrity/label-tasks/{id}"

  - name: PriceAuditor
    description: "Price accuracy auditor, acting as an Associate with role_code PRICE_AUDITOR: verifies label placement and runs scanner accuracy audits. Cannot print or place labels, so audit evidence stays independent."
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /price-integrity/scanner-audits/{id}/scan-lines"
    shared_operations:
      - "POST /price-integrity/label-tasks/{id}/verify-placement"
      - "POST /price-integrity/scanner-audits"
      - "POST /price-integrity/scanner-audits/{id}/close"
      - "GET /price-integrity/scanner-audits/{id}/scan-lines"

  - name: CustomerServiceDesk
    description: "Front-desk refund operator: files and settles overcharge refund claims for customers. Has no authority over labels, audits or inspections."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /price-integrity/refund-claims"
      - "POST /price-integrity/refund-claims/{id}/settle"
      - "GET /price-integrity/refund-claims"
      - "GET /price-integrity/refund-claims/{id}"
      - "GET /price-integrity/scan-lines/{id}"
