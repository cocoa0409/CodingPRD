              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_a2: $.data.id }
            - call: "POST /qof/funds"
              payload: { name: "Group Fund B", entity_type: "CORPORATION", manager_user_id: "mgr-fund-2" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_b: $.data.id }
            - call: "POST /qof/funds/${fund_b}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-2"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_b}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-07T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-2"
              captures: { asset_b1: $.data.id }
          trigger:
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_a1}", window_start: "2026-02-01T00:00:00Z", aggregation_method: "AGGREGATED_GROUP" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_a1}", window_start: "2026-02-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET", group_key: "GRP-2662-A" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_forbidden: $.data.error_id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${asset_a1}", window_start: "2026-02-01T00:00:00Z", aggregation_method: "AGGREGATED_GROUP", group_key: "GRP-2662-A" }
              as: FundManager
              as_user_id: "mgr-fund-1"
