            - "PricingException.${e1}.status == APPROVED"
            - "PricingException.${e2}.status == APPROVED"
            - "Product.${prod}.open_exception_count == 2"

      - name: effective_floor_excludes_a_requested_exception
        claim_type: input_set_filtering
        grounds: ["calculations.effective_map_floor"]
        distinguishing_aspect: "Eligibility demands status == APPROVED: a still-REQUESTED exception covering the instant is filtered out, so the read falls back to STANDARD 15000 with a null applied_exception_id."
        test_recipe:
          setup: ["One REQUESTED ALL-scope exception over [2026-08-10, 2026-08-25) asking for 13000 on SKU-AUDIO-1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
          trigger:
            - call: "GET /products/${prod}/effective-floor"
