  - section: errors
    instances:
      - name: error_event_window_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: mandatory_event_half_open_window_adjacency
          rationale: "Trigger and boundary semantics asserted there."
      - name: error_duplicate_claim_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_OPEN_CLAIM]"]
        excluded_because:
          difficulty_instance: claim_duplicate_beats_amount_cap
          rationale: "Duplicate-claim error is the asserted winner of that priority-conflict instance."
      - name: error_deadline_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_ELECTION_DEADLINE_PASSED]"]
        excluded_because:
          difficulty_instance: election_deadline_exact_second_accepted
          rationale: "Deadline error asserted one second past the inclusive boundary there."
      - name: account_get_nonexistent_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "ERR_ACCOUNT_NOT_FOUND is reachable: GET with a random UUID yields 404 with that error_id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/accounts/99999999-8888-7777-6666-555555555555", payload: {}, as: DeskAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ACCOUNT_NOT_FOUND (404)"

