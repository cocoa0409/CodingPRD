          trigger:
            - { call: "DELETE /f2s/receiving-windows/${win}", payload: {}, as: KitchenManager, as_user_id: "${kit}", captures: { e1: $.data.error_id } }
            - { call: "POST /f2s/deliveries/${del}/cancel", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "DELETE /f2s/receiving-windows/${win}", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "GET /f2s/receiving-windows/${win}", payload: {}, as: KitchenManager, as_user_id: "${kit}", captures: { e2: $.data.error_id } }
          assert:
            - "Delete while in use: e1 == ERR_WINDOW_IN_USE"
            - "After delivery cancel: DELETE returns 204; subsequent GET: e2 == ERR_WINDOW_NOT_FOUND"

      - name: ep_report_computed_read_schema
        claim_type: computed_read
        grounds:
          - "endpoints[GET /f2s/program-years/{id}/report]"
        distinguishing_aspect: "The report computed read exposes both calculation variants plus the grant ledger keys even with zero activity: cash/accrual spends 0, shares 0.00, matches 0, grant untouched."
        test_recipe:
          setup: ["OPEN year, no activity"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
          trigger:
            - { call: "GET /f2s/program-years/${yr}/report", payload: { month: "2026-08" }, as: DistrictProgramAdmin, captures: { cash: $.data.cash_total_spend_cents, pct: $.data.cash_local_share_pct, drawn: $.data.grant_drawn_cents, rem: $.data.grant_remaining_cents, mf: $.data.match_final_cents } }
          assert:
            - "cash_total_spend_cents == 0 AND cash_local_share_pct == 0.00 (zero-total rule)"
            - "grant_drawn_cents == 0 AND grant_remaining_cents == 1000000 AND match_final_cents == 0"

