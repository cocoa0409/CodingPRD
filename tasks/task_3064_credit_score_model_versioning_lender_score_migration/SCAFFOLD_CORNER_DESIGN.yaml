            - "data.req has length 2 and both entries are the CROSS_BUREAU composite codes, so study_path drove the requirement set"

      - name: score_variant_recall_from_draft_returns_invalid_state_machine_edge
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ScoreVariant.RELEASED_to_RECALLED
          - state_machines.ScoreVariant.DRAFT_to_RELEASED
          - errors.ERR_INVALID_STATE_MACHINE_EDGE
        distinguishing_aspect: "Recall is declared only from RELEASED, so recalling a DRAFT variant is refused, while releasing it first makes the same recall succeed — the pair pins the edge rather than just the state."
        test_recipe:
          setup:
            - "One DEVELOPMENT model M1 carrying a single DRAFT AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets: [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700)."
