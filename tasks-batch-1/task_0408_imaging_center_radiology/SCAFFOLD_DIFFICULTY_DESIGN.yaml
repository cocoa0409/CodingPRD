            - call: "POST /imaging-exams/${exam2_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { hold_err: $.data.error_id }
          assert:
            - "After finalize REPEATED (12 finalized, 1 rr): ImagingCenter.${c_id}.repeat_reject_rate_pct == 8.33"
            - "ImagingCenter.${c_id}.posture == QUALITY_HOLD"
            - "start-acquisition on exam2 -> HTTP 409 with error_id ERR_CENTER_QUALITY_HOLD"

