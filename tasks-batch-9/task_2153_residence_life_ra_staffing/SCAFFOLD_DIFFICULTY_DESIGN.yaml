            - "S1 has been checked in and COMPLETED; S2 has been marked MISSED; S3, S4 and S5 remain ASSIGNED."
            - "The logical clock has been advanced to 2026-09-15T00:00:00Z, so the forward window is [2026-09-15T00:00:00Z, 2026-10-13T00:00:00Z)."
