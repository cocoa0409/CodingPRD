      - name: bundle_price_equal_vs_one_cent_over_a_la_carte_total
        grounds:
          - validations.priority_49
          - calculations.fare_family_bundle_valuation
          - errors.ERR_BUNDLE_DISCOUNT_FLOOR_BREACH
          - state_machines.FareFamily.status.DRAFT_to_IN_REVIEW
        boundary_type: inclusive_ceiling
        boundary_value: "bundle_price_cents == a_la_carte_total_cents == 13500, versus 13501"
        distinguishing_aspect: |
          Two DRAFT families carry the identical single attribute (BAG_CHECKED_1 at 3500) over
          base_fare 10000, so both recompute a_la_carte_total_cents 13500. The check is
          less-than-OR-EQUAL: 13500 must submit successfully with bundle_discount_bp exactly 0,
          while 13501 - one single cent above - must be refused with
          ERR_BUNDLE_DISCOUNT_FLOOR_BREACH (422) and must stay in DRAFT. A strict "<" reading
          rejects the legal 13500 family.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; BAG_CHECKED_1 (3500) is ACTIVE"
            - "two ECONOMY DRAFT families with base_fare 10000 and one BAG_CHECKED_1 INCLUDED q1 attribute each: EDGE_EQ priced at 13500 and EDGE_OVER priced at 13501"
