              payload: { name: "Staffing Gap Camp", camp_type: "RESIDENT", state_code: "OH", population_served: "MEDICALLY_FRAGILE", resident_census: 200, distance_to_hospital_km: 45, health_staffing_level: "RN_ONSITE" }
