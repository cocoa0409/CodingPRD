            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-14T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cds/_ops/run-expiration-sweep"
              payload: { dry_run: false }
              as: SystemAdmin
              captures:
                t_overdue: $.data.tasks_marked_overdue
                t_expired: $.data.tasks_expired
                os_expiring: $.data.order_sets_marked_expiring
                os_expired: $.data.order_sets_expired
                os_archived: $.data.order_sets_archived
                al_susp: $.data.alerts_suspended
                al_retired: $.data.alerts_retired
                win_closed: $.data.burden_windows_closed
                dt_closed: $.data.downtime_events_closed
            - call: "GET /cds/order-sets/${os_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { os_pub_after: $.data.publication_state }
            - call: "GET /cds/alerts/${al_id}"
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures:
                al_life_after: $.data.lifecycle_state
                al_reason: $.data.suspension_reason
                al_susp_count: $.data.suspension_count
                al_windowed: $.data.windowed_fire_count
                al_unwindowed: $.data.unwindowed_fire_count
                al_lifetime_after: $.data.lifetime_fire_count
                al_latest_index: $.data.latest_burden_index
                al_latest_class: $.data.latest_burden_classification
            - call: "GET /cds/alerts/${al_id}/burden-windows"
              payload: { state: "CLOSED" }
              as: SystemAdmin
              captures:
                w_state: "$.data[0].state"
                w_reason: "$.data[0].closure_reason"
                w_fires: "$.data[0].fire_count"
                w_overrides: "$.data[0].override_count"
                w_rate: "$.data[0].override_rate"
                w_volume: "$.data[0].volume_factor"
                w_index: "$.data[0].burden_index"
                w_index_clin: "$.data[0].burden_index_clinician_weighted"
                w_class: "$.data[0].burden_classification"
          assert:
            - "${made} == 40 and ${last_fire} == 2026-09-02T15:00:00Z and ${lifetime_before} == 40 and ${win_state_before} == OPEN"
            - "${os_exp} == 2027-09-14T00:00:00Z, ${os_arch} == 2027-12-13T00:00:00Z, ${al_exp} == 2027-10-01T00:00:00Z"
            - "${t_expired} == 1 — LINK 1: the order set's task was PENDING and clock_now == expiration_at, so it goes straight to EXPIRED without passing through OVERDUE"
            - "${t_overdue} == 1 — the alert's own task (review_due 2027-09-01, expiration 2027-10-01) only reaches OVERDUE, and because its artifact_kind is ALERT it drives no order-set change"
            - "${os_expired} == 1 and ${os_expiring} == 0 and ${os_archived} == 0 — LINK 2: the order set expired only because its governing task expired, and 2027-09-14 is before archive_eligible_at"
            - "${os_pub_after} == EXPIRED"
            - "${al_susp} == 1 and ${al_life_after} == SUSPENDED and ${al_reason} == SOURCE_CONTENT_EXPIRED and ${al_susp_count} == 1 — LINK 3, caused by LINK 2 and not by any payload field"
            - "${al_retired} == 0 (retirement waits for archival, which is 90 days away)"
            - "${win_closed} == 1 — LINK 4: the OPEN window was closed by the suspension, and the CLOSED-filtered list of alert ${al_id} returns exactly this one window ${win_id}"
            - "${w_state} == CLOSED and ${w_reason} == SOURCE_SUSPENDED"
            - "${w_fires} == 40, ${w_overrides} == 36, ${w_rate} == 0.9000, ${w_volume} == 0.8000, ${w_index} == 72.00, ${w_index_clin} == 50.00, ${w_class} == LOW_VALUE"
            - "${al_windowed} == 40 and ${al_unwindowed} == 0 and ${al_lifetime_after} == 40 and ${al_latest_index} == 72.00 and ${al_latest_class} == LOW_VALUE — LINK 5: the ledger and the alert's latest-burden mirror were rewritten only because LINK 4 computed an index"
            - "Removing any single link breaks the rest: had the alert not been linked to this order set the window would still be OPEN with burden_index null and latest_burden_index null."

      - name: cascade_specialty_revise_voids_assignments_credits_workload_restages_alert
        cascade_depth: 4
        grounds:
          - state_machines.OrderSet.SPECIALTY_APPROVAL_to_DRAFT
          - state_machines.ReviewAssignment.ASSIGNED_to_VOIDED
          - state_machines.Alert.APPROVED_to_DRAFT
          - calculations.reviewer_workload_minutes
          - entities.OrderSet.fields.revision_round
          - entities.Alert.fields.restage_count
        distinguishing_aspect: |
          A different trigger (a single specialty REVISE vote, not a clock sweep) drives a
          four-link chain through a different set of entities: the order set returns to
          DRAFT, BECAUSE of that every other assignment on it is VOIDED, BECAUSE those
          assignments were voided each reviewer's workload ledger is credited back, and
          BECAUSE the artifact left approval the linked UNPUBLISHED alert is forced from
          APPROVED back to DRAFT with restage_count incremented. The alert's own
          assignment is untouched, proving the cascade follows the artifact link rather
          than sweeping every assignment in the system.
