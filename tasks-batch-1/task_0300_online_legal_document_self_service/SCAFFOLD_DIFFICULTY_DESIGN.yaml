              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W2", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c2" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W3", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c3" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W4", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c4" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W5", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c5" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W6", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c6" }
              as: PlatformAdmin
            - call: "POST /legal/clause-templates"
              payload: { clause_key: "W7", document_type: "WILL", state_code: "CA", is_mandatory: false, body_text: "c7" }
              as: PlatformAdmin
            - call: "POST /legal/customers"
              payload: { email: "ca3@x.com", full_name: "CA Three", state_of_residence: "CA" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /legal/subscriptions"
              payload: { customer_id: "${cust}", plan_id: "${plan_std}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /legal/subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /legal/attorneys"
              payload: { full_name: "Atty CA3", bar_state: "CA" }
              as: PlatformAdmin
              captures: { att: $.data.id }
            - call: "POST /legal/document-projects"
              payload: { customer_id: "${cust}", subscription_id: "${sub}", document_type: "WILL", state_code: "CA", title: "Will Three", attorney_review_addon: true }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "PUT /legal/document-projects/${proj}/questionnaire"
              payload: { answers: { q1: "a", q2: "a", q3: "a", q4: "a", q5: "a", q6: "a", q7: "a", q8: "a" } }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /legal/document-projects/${proj}/assemble"
              payload: {}
