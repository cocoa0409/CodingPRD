              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_BOARD_PANEL_COMPOSITION_INVALID: V1 belongs to the challenged certificate's own area A1, even though the identical vote was legal in round 1"
            - "err_esc from the setup == ERR_APPEAL_ESCALATION_INVALID (422): a BOARD_APPEAL filed before any DECIDED_UPHELD predecessor existed"
            - "GET /grain-inspection/appeals/${ap2} -> round_number 2, required_panel_size 5, votes_cast_count 0, effective_votes_count 0 and version unchanged by the refusal"
            - "The same vote cast by ${b1} from area A2 -> 201 with votes_cast_count 1 and effective_votes_count 1"
            - "POST /grain-inspection/appeals/${ap2}/decide with 1 effective vote -> 422 ERR_APPEAL_QUORUM_NOT_MET, because a board panel needs 5"
            - "GET /grain-inspection/samples/${smp} -> portions_consumed 3 (original, round-1 regrade, round-2 regrade) and portions_retained 1 (round 2 still open), the round-1 retention having been released at its decision"

      - excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / expired_instrument_state_check_outranks_portion_exhaustion_constraint"
          rationale: "The priority-9-over-priority-11 pairing on the protein-analysis path, together with the ERR_SAMPLE_PORTIONS_EXHAUSTED satisfaction case that follows it, is already exercised end-to-end by the difficulty instance; repeating it here would only restate the same two-rule ordering with different literals."
        name: expired_instrument_outranks_portion_exhaustion_on_analysis
        claim_type: priority_conflict
        grounds:
          - "validations[priority=9]"
          - "validations[priority=11]"
          - "errors[ERR_SAMPLE_PORTIONS_EXHAUSTED]"
          - "errors[ERR_EQUIPMENT_EXPIRED]"

      - excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_certificate_version_outranks_expired_appeal_window"
          rationale: "The appeal filing window (REINSPECTION 5 days, APPEAL 10 days, BOARD_APPEAL 20 days) and its interaction with the priority-8 OCC check are covered by that difficulty instance, which walks the clock past appeal_deadline_at with both a stale and a fresh version."
        name: appeal_filing_window_expiry_and_version_precedence
        claim_type: temporal_validation
        grounds:
          - "validations[priority=8]"
          - "validations[priority=12]"
          - "errors[ERR_APPEAL_WINDOW_EXPIRED]"
          - "errors[ERR_CERTIFICATE_VERSION_CONFLICT]"

      - excluded_because:
          difficulty_instance: "cross_entity_state_dependency / weight_certificate_legality_depends_on_area_supervision_flag_and_weighing_state"
          rationale: "ERR_SERVICE_AREA_MISMATCH and the supervision-flag cross-entity dependency are both driven by that difficulty instance, which files a weighing record with an out-of-area weigher and then a WEIGHT certificate in an area whose supervision_required flag is true."
        name: out_of_area_inspector_and_equipment_are_refused
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SERVICE_AREA_MISMATCH]"
          - "entities.Inspector.fields.service_area_id"

  - section: endpoints
    instances:
      - name: three_consecutive_failed_checks_withdraw_the_instrument
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /grain-inspection/comparison-checks]"
          - "calculations.instrument_comparison_bias"
          - "state_machines.Equipment.approval_status.OUT_OF_TOLERANCE_to_WITHDRAWN"
          - "errors[ERR_EQUIPMENT_WITHDRAWN]"
          - "entities.Equipment.fields.consecutive_out_of_tolerance_checks"
        distinguishing_aspect: "The withdrawal counter is a run counter, not a total: three checks whose single deviation of 0.65 each exceeds the 0.50 tolerance retire the instrument permanently on the third call, and the same checks push the checked inspector's deviation counter (tighter threshold 0.25) to exactly 70 points without suspending them, because auto-suspension requires an ACTIVE licence and a score strictly below 70."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with an APPROVED PROTEIN_INSTRUMENT, an ACTIVE supervisor and a PROBATIONARY checked inspector holding PROTEIN."
            - "Two comparison checks already filed with reference 12.00 and reading 12.65, so consecutive_out_of_tolerance_checks is 2."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1430", full_name: "S. Checker", endorsements: ["SUPERVISION", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { sup: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${sup}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${sup}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1431", full_name: "P. Probationer", endorsements: ["PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { ci: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-WITH", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/comparison-checks
              as: SupervisingInspector
              payload: { instrument_id: "${nir}", inspector_id: "${ci}", reference_value_pct: 12.00, instrument_reading_pct: 12.65 }
            - call: POST /grain-inspection/comparison-checks
              as: SupervisingInspector
              payload: { instrument_id: "${nir}", inspector_id: "${ci}", reference_value_pct: 12.00, instrument_reading_pct: 12.65 }
          trigger:
            - call: POST /grain-inspection/comparison-checks
              as: SupervisingInspector
              payload: { instrument_id: "${nir}", inspector_id: "${ci}", reference_value_pct: 12.00, instrument_reading_pct: 12.65 }
              captures: { st: "$.data.approval_status" }
          assert:
            - "201 with approval_status WITHDRAWN, consecutive_out_of_tolerance_checks 3, recent_deviations_pct [0.65, 0.65, 0.65] and comparison_check_count 3"
            - "A fourth comparison check on the same instrument -> 409 ERR_EQUIPMENT_WITHDRAWN"
            - "POST /grain-inspection/equipment/${nir}/certify -> 409 ERR_EQUIPMENT_WITHDRAWN: WITHDRAWN is terminal and no recertification revives it"
            - "A protein analysis naming ${nir} -> 409 ERR_EQUIPMENT_NOT_APPROVED, since only APPROVED and DRIFT_WATCH instruments may analyse"
            - "GET /grain-inspection/inspectors/${ci} -> check_sample_deviation_count 3 and performance_score 70 (100 - 3 * 10), license_status still PROBATIONARY: the 70 threshold is not crossed and probationers are never auto-suspended"
            - "A single check of reference 12.00 against reading 12.30 on a fresh instrument -> 201 with approval_status DRIFT_WATCH and the inspector's deviation counter incremented, proving the two thresholds (0.50 instrument, 0.25 inspector) are independent"

      - name: protein_recompute_is_a_one_shot_restatement
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /grain-inspection/protein-analyses/{id}/recompute]"
          - "errors[ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE]"
          - "calculations.protein_moisture_basis_conversion"
          - "entities.ProteinAnalysis.fields.basis_source"
        distinguishing_aspect: "The same endpoint is refused, then accepted, then refused again on the identical row: first because no FINAL grading result exists, then it flips basis_source from INSTRUMENT_MOISTURE to OFFICIAL_MOISTURE and restates the reported protein, and afterwards the very precondition it consumed makes a second call inapplicable."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with a certified probe and a certified protein instrument, an inspector holding SAMPLING, GRADING and PROTEIN, and a CORN request with GRADING and PROTEIN requested."
            - "A 4-portion sample, and a protein analysis of protein_pct_as_is 8.60 with instrument_moisture_pct 11.20 filed BEFORE any grading result, so it sits on the instrument basis."
            - "A first recompute attempt is made while no FINAL grading result exists, then the grading result is filed with moisture 12.8."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-116", contact_email: "billing@prairie.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1432", full_name: "N. Nir", endorsements: ["SAMPLING", "GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-NIR", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-RECOMP", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-NIR", declared_quantity_bushels: 900, requested_services: ["GRADING", "PROTEIN"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-NIR", portions_count: 4 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/protein-analyses
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", instrument_id: "${nir}", inspector_id: "${insp}", protein_pct_as_is: 8.60, instrument_moisture_pct: 11.20 }
              captures: { pa: "$.data.id", rep0: "$.data.protein_reported_pct" }
            - call: POST /grain-inspection/protein-analyses/${pa}/recompute
              as: LicensedInspector
              payload: {}
              captures: { err_early: "$.data.error_id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.4, moisture_pct: 12.8, damaged_total_pct: 1.1, heat_damaged_pct: 0.0, foreign_material_pct: 1.4 }
              captures: { gr: "$.data.id" }
            - call: POST /grain-inspection/protein-analyses/${pa}/recompute
              as: LicensedInspector
              payload: {}
              captures: { rep1: "$.data.protein_reported_pct" }
          trigger:
            - call: POST /grain-inspection/protein-analyses/${pa}/recompute
              as: LicensedInspector
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE: basis_source is already OFFICIAL_MOISTURE, so the restatement is not repeatable"
            - "err_early == ERR_ANALYSIS_RECOMPUTE_NOT_APPLICABLE too: before the FINAL grading result existed the precondition failed for a different reason under the same code"
            - "rep0 == 8.43 (8.60 * 87 / 88.80 on the instrument basis) with basis_adjustment_pct -0.17 and moisture_source_pct 11.20"
            - "rep1 == 8.58 (8.60 * 87 / 87.20 on the official basis) with basis_adjustment_pct -0.02, moisture_source_pct 12.8 and basis_source OFFICIAL_MOISTURE"
            - "GET /grain-inspection/protein-analyses/${pa} after the refusal -> protein_reported_pct still 8.58 and version unchanged by the refused call"
            - "GET /grain-inspection/samples/${smp} -> portions_consumed 2 (one analysis, one determination) and the refused recompute consumed nothing"

      - name: breaking_a_seal_freezes_every_analytical_use_of_the_sample
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /grain-inspection/samples/{id}/break-seal]"
          - "state_machines.Sample.integrity_status.SEALED_to_BROKEN"
          - "errors[ERR_SAMPLE_INTEGRITY_BROKEN]"
          - "validations[priority=9]"
        distinguishing_aspect: "One supervisor-only action turns a fully usable sample into a permanently unusable one: BROKEN is terminal, so grading, analysis and appeal assignment all fail afterwards with the integrity code even though portions remain available, which distinguishes integrity from exhaustion."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with a certified probe, an ACTIVE supervisor holding SUPERVISION, SAMPLING, GRADING and PROTEIN, a certified protein instrument and a CORN request with GRADING and PROTEIN requested."
            - "A SEALED 4-portion ORIGINAL sample with nothing consumed."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
