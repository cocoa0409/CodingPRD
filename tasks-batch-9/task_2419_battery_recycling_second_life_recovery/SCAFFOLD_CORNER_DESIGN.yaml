          assert:
            - "${lot_charged} == 100.0 and ${lot_v2} == 2 before the finalize attempts"
            - "The first finalize returns HTTP 422 with data.error_id == ERR_NO_RECOVERY_OUTPUTS even though 0.0 + 97.0 over 100.0 would have produced mass_balance_pct 97.00 and cleared the floor - the count(RecoveryOutput) >= 1 check runs first"
            - "RecoveryLot.${lot_id}.status == CHARGED with mass_balance_pct == null and finalized_at == null after that rejection, and version == ${lot_v2}"
            - "The output booking returns HTTP 201 (${out_id} non-null) on a HYDROMET line"
            - "The second finalize returns HTTP 200 with ${lot_status} == FINALIZED, ${recovered} == 30.000, ${accounted} == 97.000, ${unaccounted} == 3.000, ${balance} == 97.00, ${content} == 30.00 and ${fin_at} == 2026-08-20T00:00:00.000Z"
            - "Module.${m1_id}.status == CONSUMED and the settlement of ${i_id} is now variant FINAL with max_variance_pp == 18.00 (declared 12.0 vs final 30.000/100.0*100), so Supplier.${sup_id}.quality_strike_count == 1"

      - name: disposition_override_is_only_permitted_for_the_allowed_grades
        claim_type: conditional_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_DISPOSITION_OVERRIDE_NOT_PERMITTED]
          - state_machines.Module.PENDING_TRIAGE_to_REFURB_QUEUE
          - calculations.module_second_life_score
        distinguishing_aspect: "The override rule is conditional on the computed grade of the very same request: a grade-D module (48.80) may be overridden to MATERIAL_RECOVERY but not to REFURBISH (needs A or B) or SECOND_LIFE (needs A, B or C), while a grade-A module may be pushed down to SECOND_LIFE - so derived_disposition and disposition legitimately differ."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus, one supplier, one NMC622 intake of net 1000.0 kg at custody_state PACKAGED carrying two 100.0 kg modules: M-D (min 58.0, mean 62.0, 1200 cycles) and M-A (min 88.0, mean 92.0, 400 cycles)."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 1010.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i_v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-D", mass_kg: 100.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i_v2}" }
              as: IntakeClerk
              captures: { md_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { i_v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-A", mass_kg: 100.0, min_cell_capacity_pct: 88.0, mean_cell_capacity_pct: 92.0, cycle_count: 400, expected_intake_version: "${i_v3}" }
              as: IntakeClerk
              captures: { ma_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 12.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
          trigger:
            - call: "POST /recycling/modules/${md_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE", override_disposition: "REFURBISH" }
              as: TriageEngineer
              as_user_id: "te-1"
            - call: "POST /recycling/modules/${md_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE", override_disposition: "SECOND_LIFE" }
              as: TriageEngineer
              as_user_id: "te-1"
            - call: "POST /recycling/modules/${md_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE", override_disposition: "MATERIAL_RECOVERY" }
              as: TriageEngineer
              as_user_id: "te-1"
              captures: { d_score: "$.data.score", d_grade: "$.data.grade", d_derived: "$.data.derived_disposition", d_disp: "$.data.disposition" }
            - call: "POST /recycling/modules/${ma_id}/triage-decisions"
              payload: { scoring_variant: "FLEET_AVERAGE", override_disposition: "SECOND_LIFE" }
              as: TriageEngineer
              as_user_id: "te-1"
              captures: { a_score: "$.data.score", a_grade: "$.data.grade", a_derived: "$.data.derived_disposition", a_disp: "$.data.disposition" }
          assert:
            - "The REFURBISH override on M-D returns HTTP 422 with data.error_id == ERR_DISPOSITION_OVERRIDE_NOT_PERMITTED (its score 48.80 is grade D)"
            - "The SECOND_LIFE override on M-D returns HTTP 422 with the same error_id"
            - "Module.${md_id}.status == PENDING_TRIAGE and GET /recycling/modules/${md_id}/triage-decisions reports total_count == 0 after both rejections"
            - "The MATERIAL_RECOVERY override returns HTTP 201 with ${d_score} == 48.80, ${d_grade} == D, ${d_derived} == MATERIAL_RECOVERY and ${d_disp} == MATERIAL_RECOVERY; Module.${md_id}.status == RECOVERY_QUEUE"
            - "The SECOND_LIFE override on M-A returns HTTP 201 with ${a_score} == 86.80, ${a_grade} == A, ${a_derived} == REFURBISH but ${a_disp} == SECOND_LIFE; Module.${ma_id}.status == SECOND_LIFE_QUEUE - the override is honoured downward"

      - name: stale_version_outranks_the_capacity_ceiling_on_charge
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_lot_version_precedes_charge_exceeds_plan"
          rationale: "The §1.8 instance builds a single charge request that simultaneously carries a stale expected_lot_version (priority 7) and a module list exceeding planned_input_kg (priority 11) and asserts the priority-7 error wins, with the retry at the fresh version then surfacing the priority-11 error - the priority-conflict pattern with both orderings observed."

      - name: role_denial_outranks_resource_existence
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / role_denial_precedes_path_not_found_on_lot_finalize"
          rationale: "The §1.8 instance calls finalize on a non-existent lot id with a role that is not allowed on that endpoint and asserts ERR_FORBIDDEN_ROLE (priority 2) rather than ERR_LOT_NOT_FOUND (priority 5), then repeats with the correct role to show the 404 - authorization before existence."

      - name: release_depends_on_the_suppliers_credit_state
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / release_blocked_while_supplier_credit_hold_true"
          rationale: "The §1.8 instance proves the release gate reads a field on another entity: with Supplier.credit_hold true the release fails with ERR_SUPPLIER_CREDIT_HOLD (402) and after the ledger is cleared the identical call succeeds, covering both the valid and invalid sides of this cross-entity rule."

  - section: endpoints
    instances:
      - name: permit_allotment_create_read_list_and_filter_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /recycling/permit-allotments]
          - endpoints[GET /recycling/permit-allotments]
          - endpoints[GET /recycling/permit-allotments/{allotment_id}]
          - entities.PermitAllotment
        distinguishing_aspect: "The permit sub-resource is create-read-list only - there is no update and no delete endpoint anywhere in §1.5 - so the CRUD claim is that a created allotment round-trips through both read shapes and that the medium, status and facility filters compose with limit/offset."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus with no permits yet."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", medium: "WATER", permit_no: "NV-W-001", valid_from: "2026-07-01T00:00:00.000Z", valid_to: "2026-12-31T23:59:59.999Z", daily_cap_kg: 500.0 }
              as: ComplianceOfficer
              captures: { w_id: "$.data.id", w_status: "$.data.status", w_consumed: "$.data.consumed_kg", w_v: "$.data.version", w_created: "$.data.created_at" }
            - call: "POST /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", medium: "AIR", permit_no: "NV-A-002", valid_from: "2026-07-01T00:00:00.000Z", valid_to: "2026-12-31T23:59:59.999Z", daily_cap_kg: 250.0 }
              as: ComplianceOfficer
              captures: { a_id: "$.data.id" }
            - call: "GET /recycling/permit-allotments/${w_id}"
              payload: {}
              as: PlantOperator
              captures: { r_id: "$.data.id", r_no: "$.data.permit_no", r_cap: "$.data.daily_cap_kg", r_medium: "$.data.medium" }
            - call: "GET /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", medium: "AIR" }
              as: ComplianceOfficer
              captures: { air_first_id: "$.data[0].id" }
            - call: "GET /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", limit: 1, offset: 1 }
              as: PlatformAdmin
            - call: "POST /recycling/permit-allotments/${a_id}/suspend"
              payload: { suspend_reason: "Stack test overdue" }
              as: ComplianceOfficer
            - call: "GET /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", status: "ACTIVE" }
              as: ComplianceOfficer
          assert:
            - "The first create returns HTTP 201 with ${w_status} == ACTIVE, ${w_consumed} == 0.0, ${w_v} == 1 and ${w_created} == 2026-07-10T00:00:00.000Z"
            - "The single read returns HTTP 200 with ${r_id} == ${w_id}, ${r_no} == NV-W-001, ${r_cap} == 500.0 and ${r_medium} == WATER - every stored field round-trips"
            - "The medium filter returns total_count == 1 with ${air_first_id} == ${a_id}"
            - "The paged list returns total_count == 2, has_more == false and exactly one element, because offset 1 with limit 1 is the last page"
            - "After the suspend, the status filter returns total_count == 1 whose only element is ${w_id}, and PermitAllotment.${a_id}.status == SUSPENDED with suspend_reason 'Stack test overdue'"

      - name: quality_strike_action_increments_the_supplier_register
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /recycling/suppliers/{supplier_id}/quality-strikes]
          - entities.Supplier.quality_strike_count
          - calculations.quality_deduction_pct
        distinguishing_aspect: "The strike endpoint mutates a counterparty counter without any state machine behind it: three calls take quality_strike_count from 0 to 3 and the Supplier version from 1 to 4, while credit_hold and the two money fields stay untouched - the strike register and the payable ledger are independent."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one supplier with quality_strike_count 0 and credit_limit_cents 200000."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id", s_strikes: "$.data.quality_strike_count", s_v: "$.data.version" }
          trigger:
            - call: "POST /recycling/suppliers/${sup_id}/quality-strikes"
              payload: { incident_code: "QA-001" }
              as: ComplianceOfficer
              captures: { k1: "$.data.quality_strike_count", v1: "$.data.version" }
            - call: "POST /recycling/suppliers/${sup_id}/quality-strikes"
              payload: { incident_code: "QA-002" }
              as: ComplianceOfficer
              captures: { k2: "$.data.quality_strike_count", v2: "$.data.version" }
            - call: "POST /recycling/suppliers/${sup_id}/quality-strikes"
              payload: { incident_code: "QA-003" }
              as: ComplianceOfficer
              captures: { k3: "$.data.quality_strike_count", v3: "$.data.version", hold: "$.data.credit_hold", bal: "$.data.payable_balance_cents", paid: "$.data.paid_to_date_cents" }
          assert:
            - "${s_strikes} == 0 and ${s_v} == 1 before the strikes"
            - "The three calls return HTTP 200 with ${k1} == 1, ${k2} == 2, ${k3} == 3 and ${v1} == 2, ${v2} == 3, ${v3} == 4"
            - "${hold} == false, ${bal} == 0 and ${paid} == 0 - the strike register never touches the payable ledger"
            - "GET /recycling/suppliers/${sup_id} as SettlementAccountant reports quality_strike_count == 3, so the counter is durable and now at the STRIKE_ESCALATION_THRESHOLD that multiplies future quality deductions by 1.5"

