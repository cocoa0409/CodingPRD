  # ---- ConcussionCase -------------------------------------------------------
  - method: POST
    path: /concussion-program/concussion-cases/{id}/return-steps
    roles: [ClubPhysician]
    input: [stage_index]
    output: ReturnStep
    status: 201
    side_effects:
      - "creates the ReturnStep with status = IN_PROGRESS, started_at = now, attempt_index and dwell_complete_at derived"
      - "moves case_status MANDATORY_REMOVAL -> RTP_IN_PROGRESS on the first stage"
      - "increments ConcussionCase.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_CASE_STATE_INVALID, ERR_CASE_STAGE_FROZEN, ERR_STAGE_REST_BUFFER_VIOLATION, ERR_STAGE_SEQUENCE_VIOLATION, ERR_STEP_ALREADY_IN_PROGRESS]

  - method: POST
    path: /concussion-program/concussion-cases/{id}/inc-clearances
    roles: [ClubPhysician]
    input: [inc_clinician_id, expected_case_version]
    output: IncClearance
    status: 201
    side_effects:
      - "supersedes any PENDING IncClearance on the case"
      - "creates the IncClearance with status = PENDING, requested_at = now, requested_by_clinician_id = X-User-ID, documented_stage_count derived"
      - "sets case_status = PENDING_INC_CLEARANCE and increments ConcussionCase.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_CLINICIAN_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_CASE_STATE_INVALID, ERR_CASE_STAGE_FROZEN, ERR_STALE_CASE_VERSION, ERR_INC_NOT_INDEPENDENT, ERR_NO_RETURN_STEPS_RECORDED, ERR_RTP_STAGES_INCOMPLETE]

