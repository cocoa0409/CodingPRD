  - section: cross_cutting_complexity_layers
    instances:
      - name: license_amendment_with_a_stale_expected_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[LicenseAgreement]
          - validations[priority=42]
          - errors[ERR_STALE_LICENSE_VERSION]
          - endpoints[POST /convention-center/licenses/{id}/amendments]
        distinguishing_aspect: |
          The declared OCC rule guards the amendment endpoint on LicenseAgreement.version.
          After one accepted amendment the row has moved on, so re-presenting the
          pre-amendment version is refused with 412 even though the license is back at
          EXECUTED and amendment_round is only 1 of 3. Re-reading the row and presenting
          the fresh version makes the identical call succeed, and the refusal must leave
          amendment_round and pending_amendment_note untouched.
        test_recipe:
          setup:
            - "the Meeting Room 301 booking has an EXECUTED license with one accepted amendment, so amendment_round is 1"
            - "the version observed before that amendment was captured and is now stale"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
