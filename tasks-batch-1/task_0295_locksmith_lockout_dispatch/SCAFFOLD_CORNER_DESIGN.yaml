# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Locksmith & Lockout Dispatch — breadth probe over §1.1–§1.7 claims.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_service_job_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.ServiceJob.fields.job_status
          - entities.ServiceJob.fields.payment_status
          - endpoints.POST_/service-jobs
        distinguishing_aspect: "POST /service-jobs with all required fields returns 201; job_status=INTAKE, payment_status=UNPAID, amount_due_cents=0, net_paid_cents=0, is_emergency defaults false."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_type: "LOCKOUT", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobc: $.data.id, st: $.data.job_status, pst: $.data.payment_status }
          assert:
            - "response.status == 201"
            - "ServiceJob.${jobc}.job_status == INTAKE"
            - "ServiceJob.${jobc}.payment_status == UNPAID"
            - "ServiceJob.${jobc}.amount_due_cents == 0"
            - "ServiceJob.${jobc}.net_paid_cents == 0"
            - "ServiceJob.${jobc}.is_emergency == false"

      - name: create_service_job_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ServiceJob.fields.service_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required service_type on POST /service-jobs returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { errf: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_service_job_invalid_enum_service_type
        claim_type: Type Constraints
        grounds:
          - entities.ServiceJob.fields.service_type
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "service_type outside {LOCKOUT,REKEY,INSTALL,SAFE} returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_type: "PICK", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { erre: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: get_service_job_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/service-jobs/{id}
          - errors[ERR_JOB_NOT_FOUND]
        distinguishing_aspect: "GET /service-jobs/{non-existent UUID} returns 404 ERR_JOB_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /service-jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { errnf: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_JOB_NOT_FOUND"

      - name: list_service_jobs_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/service-jobs
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /service-jobs returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup:
            - "One job created."
          setup_api_calls:
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_type: "SAFE", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
          trigger:
            - call: "GET /service-jobs"
              payload: {}
              as: Dispatcher
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response has total_count and has_more"

      - name: lockpart_system_fields_initialized
        claim_type: Computed Fields
        grounds:
          - entities.LockPart.fields.units_available
          - entities.LockPart.fields.units_reserved
          - entities.LockPart.fields.units_committed
          - endpoints.POST_/lock-parts
        distinguishing_aspect: "POST /lock-parts sets units_available=units_total, units_reserved=0, units_committed=0, version=1; client cannot set them directly."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-X", units_total: 7 }
              as: InventoryManager
              captures: { lpx: $.data.id }
          assert:
            - "response.status == 201"
            - "LockPart.${lpx}.units_available == 7"
            - "LockPart.${lpx}.units_reserved == 0"
            - "LockPart.${lpx}.units_committed == 0"
            - "LockPart.${lpx}.version == 1"

      - name: key_authorization_record_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.KeyAuthorizationRecord
          - endpoints.POST_/service-jobs/{id}/key-authorizations
        distinguishing_aspect: "KeyAuthorizationRecord is common_fields:false (append-only): it carries id + created_at, exposes no version field, and has no update endpoint."
        test_recipe:
          setup:
            - "A job INTAKE exists."
          setup_api_calls:
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_type: "REKEY", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobk: $.data.id }
          trigger:
            - call: "POST /service-jobs/${jobk}/key-authorizations"
              payload: { auth_kind: "KEY_DUPLICATION", authorizing_party: "Owner", id_document_ref: "DL-1" }
              as: Technician
              as_user_id: "tech-any"
              captures: { authk: $.data.id }
          assert:
            - "response.status == 201"
            - "KeyAuthorizationRecord.${authk}.auth_kind == KEY_DUPLICATION"

      - name: invalid_time_window_eta_end_le_start
        claim_type: Type Constraints
        grounds:
          - entities.Dispatch.fields.eta_end_minute
          - errors[ERR_INVALID_TIME_WINDOW]
        distinguishing_aspect: "Dispatch with eta_end_minute <= eta_start_minute returns 422 ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup:
            - "An ON_DUTY technician and an INTAKE job exist."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tw", certified_for: ["LOCKOUT"], base_travel_minutes: 10 }
              as: Dispatcher
              captures: { techw: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C", customer_user_id: "cust-c", service_type: "LOCKOUT", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobw: $.data.id }
          trigger:
            - call: "POST /service-jobs/${jobw}/dispatches"
              payload: { technician_id: "${techw}", eta_start_minute: 650, eta_end_minute: 650 }
              as: Dispatcher
              captures: { errw: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_TIME_WINDOW"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_drafted_quote_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.OnSiteQuote.SUBMITTED_to_APPROVED
          - errors[ERR_QUOTE_INVALID_STATE]
        distinguishing_aspect: "Approving a DRAFTED (not SUBMITTED) quote returns 409 ERR_QUOTE_INVALID_STATE; no APPROVED side effect fires."
        test_recipe:
          setup:
            - "Job ON_SITE with a DRAFTED quote (not submitted)."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tq", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techq: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cq", customer_user_id: "cust-q", service_type: "REKEY", service_address: "Q St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobq: $.data.id }
            - call: "POST /service-jobs/${jobq}/dispatches"
              payload: { technician_id: "${techq}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispq: $.data.id }
            - call: "POST /dispatches/${dispq}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techq}"
            - call: "POST /dispatches/${dispq}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techq}"
            - call: "POST /service-jobs/${jobq}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techq}"
              captures: { quoteq: $.data.id }
          trigger:
            - call: "POST /quotes/${quoteq}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-q"
              captures: { errq: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_INVALID_STATE"
            - "OnSiteQuote.${quoteq}.status == DRAFTED"

      - name: cancel_already_cancelled_job_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ServiceJob.INTAKE_DISPATCHED_ON_SITE_to_CANCELLED
          - errors[ERR_JOB_NOT_CANCELLABLE]
        distinguishing_aspect: "Cancelling a CANCELLED (terminal) job returns 409 ERR_JOB_NOT_CANCELLABLE; no further side effects."
        test_recipe:
          setup:
            - "An INTAKE job that has been cancelled."
          setup_api_calls:
            - call: "POST /service-jobs"
              payload: { customer_name: "Cc", customer_user_id: "cust-cc", service_type: "SAFE", service_address: "Z St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobcc: $.data.id }
            - call: "POST /service-jobs/${jobcc}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-jobs/${jobcc}/cancel"
              payload: {}
              as: Dispatcher
              captures: { errcc: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOB_NOT_CANCELLABLE"

      - name: close_job_not_fully_paid_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceJob.WORK_COMPLETE_to_CLOSED
          - errors[ERR_JOB_NOT_FULLY_PAID]
        distinguishing_aspect: "Closing a WORK_COMPLETE job whose payment_status != PAID returns 409 ERR_JOB_NOT_FULLY_PAID."
        test_recipe:
          setup:
            - "Job ON_SITE, quote APPROVED (final 8000), complete-work done but no payment captured -> WORK_COMPLETE & UNPAID."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tp", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techp: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cp", customer_user_id: "cust-p", service_type: "REKEY", service_address: "P St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobp: $.data.id }
            - call: "POST /service-jobs/${jobp}/dispatches"
              payload: { technician_id: "${techp}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispp: $.data.id }
            - call: "POST /dispatches/${dispp}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techp}"
            - call: "POST /dispatches/${dispp}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techp}"
            - call: "POST /service-jobs/${jobp}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techp}"
              captures: { quotep: $.data.id }
            - call: "POST /quotes/${quotep}/submit"
              payload: {}
              as: Technician
              as_user_id: "${techp}"
            - call: "POST /quotes/${quotep}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-p"
            - call: "POST /service-jobs/${jobp}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${techp}"
          trigger:
            - call: "POST /service-jobs/${jobp}/close"
              payload: {}
              as: Dispatcher
              captures: { errp: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOB_NOT_FULLY_PAID"

      - name: complete_work_without_approved_quote
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceJob.ON_SITE_to_WORK_COMPLETE
          - errors[ERR_NO_APPROVED_QUOTE]
        distinguishing_aspect: "complete-work on an ON_SITE job with no APPROVED quote returns 409 ERR_NO_APPROVED_QUOTE."
        test_recipe:
          setup:
            - "Job ON_SITE with only a DRAFTED quote."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tn", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techn: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cn", customer_user_id: "cust-n", service_type: "REKEY", service_address: "N St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobn: $.data.id }
            - call: "POST /service-jobs/${jobn}/dispatches"
              payload: { technician_id: "${techn}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispn: $.data.id }
            - call: "POST /dispatches/${dispn}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techn}"
            - call: "POST /dispatches/${dispn}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techn}"
            - call: "POST /service-jobs/${jobn}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techn}"
          trigger:
            - call: "POST /service-jobs/${jobn}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${techn}"
              captures: { errn: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_APPROVED_QUOTE"

      - name: arrive_dispatch_not_en_route
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Dispatch.EN_ROUTE_to_ARRIVED
          - errors[ERR_DISPATCH_NOT_EN_ROUTE]
        distinguishing_aspect: "Arriving on an ASSIGNED (not yet departed) dispatch returns 409 ERR_DISPATCH_NOT_EN_ROUTE."
        test_recipe:
          setup:
            - "Dispatch ASSIGNED (technician dispatched, not departed)."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Ta", certified_for: ["LOCKOUT"], base_travel_minutes: 10 }
              as: Dispatcher
              captures: { techa: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Ca", customer_user_id: "cust-a", service_type: "LOCKOUT", service_address: "A St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { joba: $.data.id }
            - call: "POST /service-jobs/${joba}/dispatches"
              payload: { technician_id: "${techa}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispa: $.data.id }
          trigger:
            - call: "POST /dispatches/${dispa}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techa}"
              captures: { erra: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DISPATCH_NOT_EN_ROUTE"

      - name: reopen_non_rejected_quote_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.OnSiteQuote.REJECTED_to_DRAFTED
          - errors[ERR_QUOTE_INVALID_STATE]
        distinguishing_aspect: "Reopen on a SUBMITTED (not REJECTED) quote returns 409 ERR_QUOTE_INVALID_STATE."
        test_recipe:
          setup:
            - "Job ON_SITE with a SUBMITTED quote."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tr", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techr: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cr", customer_user_id: "cust-r", service_type: "REKEY", service_address: "R St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobr: $.data.id }
            - call: "POST /service-jobs/${jobr}/dispatches"
              payload: { technician_id: "${techr}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispr: $.data.id }
            - call: "POST /dispatches/${dispr}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techr}"
            - call: "POST /dispatches/${dispr}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techr}"
            - call: "POST /service-jobs/${jobr}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techr}"
              captures: { quoter: $.data.id }
            - call: "POST /quotes/${quoter}/submit"
              payload: {}
              as: Technician
              as_user_id: "${techr}"
          trigger:
            - call: "POST /quotes/${quoter}/reopen"
              payload: {}
              as: Technician
              as_user_id: "${techr}"
              captures: { errr: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_INVALID_STATE"

      - name: dispatch_uncertified_technician
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceJob.INTAKE_to_DISPATCHED
          - errors[ERR_TECHNICIAN_NOT_CERTIFIED]
        distinguishing_aspect: "Dispatching a technician whose certified_for excludes the job's service_type returns 409 ERR_TECHNICIAN_NOT_CERTIFIED."
        test_recipe:
          setup:
            - "Technician certified only for REKEY; a SAFE job at INTAKE."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tc", certified_for: ["REKEY"], base_travel_minutes: 10 }
              as: Dispatcher
              captures: { techc: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cc2", customer_user_id: "cust-cc2", service_type: "SAFE", service_address: "S St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobc2: $.data.id }
          trigger:
            - call: "POST /service-jobs/${jobc2}/dispatches"
              payload: { technician_id: "${techc}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { errc2: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TECHNICIAN_NOT_CERTIFIED"

      - name: second_quote_approve_already_approved
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.OnSiteQuote.SUBMITTED_to_APPROVED
          - errors[ERR_QUOTE_ALREADY_APPROVED]
        distinguishing_aspect: "Approving a second SUBMITTED quote on a job that already has an APPROVED quote returns 409 ERR_QUOTE_ALREADY_APPROVED."
        test_recipe:
          setup:
            - "Job ON_SITE with quote-1 APPROVED and quote-2 SUBMITTED."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Td", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techd: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cd", customer_user_id: "cust-d", service_type: "REKEY", service_address: "D St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobd: $.data.id }
            - call: "POST /service-jobs/${jobd}/dispatches"
              payload: { technician_id: "${techd}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispd: $.data.id }
            - call: "POST /dispatches/${dispd}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techd}"
            - call: "POST /dispatches/${dispd}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techd}"
            - call: "POST /service-jobs/${jobd}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${techd}"
              captures: { quoted1: $.data.id }
            - call: "POST /quotes/${quoted1}/submit"
              payload: {}
              as: Technician
              as_user_id: "${techd}"
            - call: "POST /quotes/${quoted1}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-d"
            - call: "POST /service-jobs/${jobd}/quotes"
              payload: { labor_hours: 2.0, part_lines: [] }
              as: Technician
              as_user_id: "${techd}"
              captures: { quoted2: $.data.id }
            - call: "POST /quotes/${quoted2}/submit"
              payload: {}
              as: Technician
              as_user_id: "${techd}"
          trigger:
            - call: "POST /quotes/${quoted2}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-d"
              captures: { errd: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QUOTE_ALREADY_APPROVED"

      - name: warranty_approve_expired_window
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WarrantyClaim.FILED_to_APPROVED
          - errors[ERR_WARRANTY_EXPIRED]
        distinguishing_aspect: "Approving a warranty claim with days_since_close > WARRANTY_DAYS returns 409 ERR_WARRANTY_EXPIRED."
        test_recipe:
          setup:
            - "Job CLOSED and PAID 8000; warranty claim FILED with days_since_close=400 (beyond WARRANTY_DAYS)."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Tx", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { techx: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "Cx", customer_user_id: "cust-x", service_type: "REKEY", service_address: "X St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { jobx: $.data.id }
            - call: "POST /service-jobs/${jobx}/dispatches"
              payload: { technician_id: "${techx}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { dispx: $.data.id }
            - call: "POST /dispatches/${dispx}/depart"
              payload: {}
              as: Technician
              as_user_id: "${techx}"
            - call: "POST /dispatches/${dispx}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${techx}"
            - call: "POST /service-jobs/${jobx}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
