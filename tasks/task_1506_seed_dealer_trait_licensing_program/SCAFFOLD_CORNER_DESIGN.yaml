  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: fk_reverse_reachability_filtered_lists_return_children
        claim_type: fk_integrity
        grounds: ["endpoints[GET /dealer/order-lines]", "endpoints[GET /dealer/orders]", entities.OrderLine.fields.order_id]
        distinguishing_aspect: "Children are discoverable from parents via filtered lists: GET /dealer/order-lines?order_id returns exactly the order's line; GET /dealer/orders?grower_id&program_id returns the order."
        test_recipe:
          setup: ["program OPEN; grower; variety; one DRAFT order with one 10-unit line"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
              captures: { ln: $.data.id }
          trigger:
            - call: "GET /dealer/order-lines"
              payload: { order_id: "${o}" }
              as: SalesRep
              captures: { first_ln: "$.data[0].id" }
            - call: "GET /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { first_o: "$.data[0].id" }
          assert:
            - "order-lines filtered by order_id: exactly 1 row, its id == the created line"
            - "orders filtered by grower_id + program_id: exactly 1 row, its id == the created order"

      - name: response_envelope_shape_on_success_and_error
        claim_type: envelope_conformance
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type; error responses carry response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /dealer/programs/${prog}"
              as: SalesRep
            - call: "GET /dealer/programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "success: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == object, data holds the program"
            - "error: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

