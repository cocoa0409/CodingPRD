      - name: open_racing_from_draft_returns_409_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Regatta.SI_PUBLISHED_to_RACING
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          open-racing is defined only out of SI_PUBLISHED, so calling it on a DRAFT regatta is 409
          ERR_INVALID_STATE - the state check speaks before the transition's own division and
          jury preconditions, which a DRAFT regatta also fails.
        test_recipe:
          setup:
            - "One regatta chair and one DRAFT regatta with no documents, divisions or panels."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /regatta-ops/regattas/${reg}/open-racing", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
          assert:
            - "the trigger call returns HTTP 409 with error_id ERR_INVALID_STATE"
            - "Regatta.${reg}.status == DRAFT and Regatta.${reg}.version == 1"
            - "Regatta.${reg}.si_revision == 0 and Regatta.${reg}.confirmed_division_count == 0"

      - name: race_document_amendment_supersedes_prior_revision_and_bumps_si_revision
        claim_type: side_effect_execution
        grounds:
          - state_machines.RaceDocument.PUBLISHED_to_SUPERSEDED
          - endpoints[POST /regatta-ops/race-documents]
          - entities.Regatta.fields.si_revision
        distinguishing_aspect: |
          Publishing an SI amendment applies all three declared side effects in one request: the
          amended row goes SUPERSEDED, the amendment takes revision 2 (predecessor revision + 1),
          and Regatta.si_revision becomes 2 while Regatta.status stays SI_PUBLISHED - the
          amendment is a revision, not a new phase.
        test_recipe:
          setup:
            - "A regatta with notice of race revision 1 (effective 2026-07-10) and sailing instructions revision 1 (effective 2026-07-15) published; Regatta.version is 3."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_nor: $.data.id } }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_si: $.data.id } }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v3: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions amendment 1: start line moved", effective_utc: "2026-07-20T00:00:00Z", amends_document_id: "${doc_si}", expected_regatta_version: "${reg_v3}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_si2: $.data.id } }
          assert:
            - "the trigger call returns HTTP 201"
            - "RaceDocument.${doc_si2}.revision == 2, status == PUBLISHED and amends_document_id == ${doc_si}"
            - "RaceDocument.${doc_si}.status == SUPERSEDED and RaceDocument.${doc_si}.revision == 1"
            - "RaceDocument.${doc_nor}.status == PUBLISHED: the NOR chain is untouched by an SI amendment"
            - "Regatta.${reg}.si_revision == 2, nor_revision == 1, status == SI_PUBLISHED and version == 4"

      - name: jury_panel_seats_bubble_up_to_seated_at_quorum
        claim_type: bubble_up
        grounds:
          - state_machines.JuryPanel.FORMING_to_SEATED
          - endpoints[POST /regatta-ops/jury-panels/{id}/seats]
          - entities.JuryPanel.fields.seated_member_count
        distinguishing_aspect: |
          A panel is created with the chair alone at seated_member_count 1 and status FORMING; the
          single seat that lifts the count to the regatta's jury_quorum_required 2 is what flips
          status to SEATED, so the bubble-up is driven by the refreshed count and not by the seat
          call itself.
        test_recipe:
          setup:
            - "A regatta with jury_quorum_required 2 and two certificated judges: a REGIONAL chair and a CLUB member."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
