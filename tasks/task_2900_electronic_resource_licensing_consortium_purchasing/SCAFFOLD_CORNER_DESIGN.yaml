scaffold_corner_design:
  - section: entities
    instances:
      - name: member_creation_persists_the_ledger_and_standing_defaults
        claim_type: creation
        grounds:
          - entities.Member
          - endpoints.POST_/erm/members
          - response_envelope.success
        distinguishing_aspect: |
          Creation of the root entity of the pricing model: the four input fields are echoed back and
          the two computed fields start at their declared defaults (annual_committed_cents 0,
          standing IN_GOOD_STANDING) with version 1, inside the fixed success envelope.
        test_recipe:
          setup:
            - "Empty database; the logical clock still reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /erm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_id: $.data.id }
          assert:
            - "response status == 201"
            - "response.response_type == object"
            - "response.meta.api_request_id is present"
            - "Member.${m_id}.name == Alpha College"
            - "Member.${m_id}.fte_count == 4000"
            - "Member.${m_id}.carnegie_class == BACCALAUREATE"
            - "Member.${m_id}.budget_ceiling_cents == 9000000"
            - "Member.${m_id}.annual_committed_cents == 0"
            - "Member.${m_id}.standing == IN_GOOD_STANDING"
            - "Member.${m_id}.version == 1"
      - name: product_retrieval_returns_the_stored_tier_bands
        claim_type: retrieval
        grounds:
          - entities.Product
          - endpoints.GET_/erm/products/{id}
        distinguishing_aspect: |
          A read of one product must return the whole tier_bands array as stored, in the order given at
          creation, together with every licensing flag - the pricing calculation depends on it.
        test_recipe:
          setup:
            - "One vendor and one product with three tier bands (1 -> 0 percent, 3 -> 10 percent, 5 -> 20 percent)."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
          trigger:
            - call: "GET /erm/products/${product_id}"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          assert:
            - "response status == 200"
            - "Product.${product_id}.base_list_price_cents == 10000000"
            - "Product.${product_id}.title_count == 400"
            - "Product.${product_id}.inflation_cap_pct == 5.00"
            - "Product.${product_id}.cancellation_notice_days == 90"
            - "Product.${product_id}.perpetual_access_mode_offered == FULL_ARCHIVE"
            - "Product.${product_id}.ill_mode_offered == SECURE_ELECTRONIC"
            - "Product.${product_id}.text_mining_offered == true"
            - "length of Product.${product_id}.tier_bands == 3"
            - "Product.${product_id}.tier_bands[1].min_participants == 3 and .discount_pct == 10"
      - name: trial_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Trial
          - endpoints.GET_/erm/trials
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three trials exist and the request asks for limit 2 at offset 0, so the array carries exactly
          two rows while total_count reports 3 and has_more is true - pagination metadata is counted over
          the whole filtered set, not over the returned page.
        test_recipe:
          setup:
            - "One vendor, three products and Member Alpha College."
            - "Alpha holds one DRAFT trial on each of the three products, all for the window 2026-08-01..2026-08-31 (different products, so no window conflict)."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { p1_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Science Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { p2_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Regional Newspapers", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { p3_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
            - call: "POST /erm/products/${p1_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_1_id: $.data.id }
            - call: "POST /erm/products/${p2_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_2_id: $.data.id }
            - call: "POST /erm/products/${p3_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_3_id: $.data.id }
          trigger:
            - call: "GET /erm/trials"
              payload: { member_id: "${m_a_id}", limit: 2, offset: 0 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          assert:
            - "response status == 200"
            - "response.response_type == array"
            - "length of response.data == 2"
            - "response.total_count == 3"
            - "response.has_more == true"
      - name: unknown_subscription_id_returns_subscription_not_found
        claim_type: not_found
        grounds:
          - validations.priority_3_path_existence
          - errors.ERR_SUBSCRIPTION_NOT_FOUND
          - endpoints.GET_/erm/subscriptions/{id}
        distinguishing_aspect: |
          A well-formed UUID that matches no row must yield ERR_SUBSCRIPTION_NOT_FOUND with HTTP 404 in
          the error envelope, not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /erm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /erm/subscriptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response status == 404"
            - "response.response_type == error"
            - "${err} == ERR_SUBSCRIPTION_NOT_FOUND"
      - name: product_creation_missing_base_list_price_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_6_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/erm/products
        distinguishing_aspect: |
          base_list_price_cents has source input with no default, so omitting it must fail the
          priority-6 shape check with ERR_INVALID_REQUEST (422) and create nothing.
        test_recipe:
          setup:
            - "One vendor exists."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /erm/products returns total_count == 0"
      - name: vendor_creation_applies_declared_field_defaults
        claim_type: defaults
        grounds:
          - entities.Vendor.fields.archival_agency_code
          - entities.Vendor.fields.vpat_on_file
          - endpoints.POST_/erm/vendors
        distinguishing_aspect: |
          Both optional vendor inputs are omitted, so archival_agency_code must default to null and
          vpat_on_file to false - the false default is what later blocks signing on accessibility.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /erm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /erm/vendors"
              payload: { name: "Meridian Press" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { v_id: $.data.id }
          assert:
            - "response status == 201"
            - "Vendor.${v_id}.name == Meridian Press"
            - "Vendor.${v_id}.archival_agency_code == null"
            - "Vendor.${v_id}.vpat_on_file == false"
            - "Vendor.${v_id}.version == 1"
      - name: commitment_projected_price_is_computed_and_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Commitment.fields.projected_price_cents
          - calculations.member_tier_price_cents
          - endpoints.POST_/erm/products/{id}/commitments
        distinguishing_aspect: |
          projected_price_cents has source computed, so the client-supplied 1 must be ignored and the
          committed_projection variant must stamp 10000000 * 0.60 * 0.75 = 4500000 at a participant
          count of 1.
        test_recipe:
          setup:
            - "One vendor, one product (base_list_price_cents 10000000, bands 1 -> 0 percent) and Member Alpha College with fte_count 4000 and carnegie_class BACCALAUREATE."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
          trigger:
            - call: "POST /erm/products/${product_id}/commitments"
              payload: { member_id: "${m_a_id}", projected_price_cents: 1 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { c_id: $.data.id }
          assert:
            - "response status == 201"
            - "Commitment.${c_id}.projected_price_cents == 4500000"
            - "Commitment.${c_id}.applied_discount_pct == 0"
            - "Commitment.${c_id}.participant_count_at_pricing == 1"
            - "Commitment.${c_id}.status == PLEDGED"
            - "Commitment.${c_id}.tier_price_cents == null"
            - "Commitment.${c_id}.subscription_id == null"
      - name: trial_creation_mints_system_fields_and_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Trial
          - endpoints.POST_/erm/products/{id}/trials
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted: supplying id and version in the body
          must not be honoured, the new row must carry version 1 and status DRAFT, and the returned id
          must not be the client's value.
        test_recipe:
          setup:
            - "One vendor, one product and Member Alpha College."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
          trigger:
            - call: "POST /erm/products/${product_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }], id: "00000000-0000-4000-8000-000000000000", version: 99 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { t_id: $.data.id }
          assert:
            - "response status == 201"
            - "${t_id} != 00000000-0000-4000-8000-000000000000"
            - "Trial.${t_id}.version == 1"
            - "Trial.${t_id}.status == DRAFT"
            - "Trial.${t_id}.provisional_score == null"
            - "Trial.${t_id}.final_score == null"
            - "Trial.${t_id}.feedback_count == 0"
            - "Trial.${t_id}.created_at is an ISO 8601 UTC instant with three fractional digits"
      - name: usage_report_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.UsageReport
          - endpoints.GET_/erm/usage-reports/{id}
          - endpoints.POST_/erm/subscriptions/{id}/usage-reports
        distinguishing_aspect: |
          UsageReport is declared common_fields false, so the row exposes id and created_at only - no
          version and no updated_at - and §1.5 offers no update or delete endpoint for it: a filed
          COUNTER month is evidence, never editable.
        test_recipe:
          setup:
            - "The subscription is signed at 9000000 cents and ACTIVE from 2027-01-02."
            - "The vendor files one usage report for 2027-01 with 1200 full-text requests."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
              payload: { vendor_id: "${vendor_id}", name: "Atlas Humanities Collection", base_list_price_cents: 10000000, title_count: 400, inflation_cap_pct: 5.00, cancellation_notice_days: 90, perpetual_access_mode_offered: "FULL_ARCHIVE", ill_mode_offered: "SECURE_ELECTRONIC", text_mining_offered: true, tier_bands: [{ min_participants: 1, discount_pct: 0 }, { min_participants: 3, discount_pct: 10 }, { min_participants: 5, discount_pct: 20 }] }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { product_id: $.data.id }
            - call: "POST /erm/members"
              payload: { name: "Alpha College", fte_count: 4000, carnegie_class: "BACCALAUREATE", budget_ceiling_cents: 9000000 }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { m_a_id: $.data.id }
            - call: "POST /erm/products/${product_id}/trials"
              payload: { member_id: "${m_a_id}", start_date: "2026-08-01", end_date: "2026-08-31", criteria: [{ code: "CONTENT_FIT", weight_pct: 100 }] }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { trial_id: $.data.id }
            - call: "POST /erm/trials/${trial_id}/open"
              payload: {}
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "FACULTY", criterion_code: "CONTENT_FIT", score: 90 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "GRADUATE", criterion_code: "CONTENT_FIT", score: 90 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/feedback"
              payload: { stakeholder_group: "LIBRARIAN", criterion_code: "CONTENT_FIT", score: 90 }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/close"
              payload: {}
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
            - call: "POST /erm/trials/${trial_id}/evaluate"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
            - call: "POST /erm/negotiations"
              payload: { product_id: "${product_id}", trial_id: "${trial_id}", target_term_start: "2027-01-01", target_term_end: "2027-12-31", requested_ill_mode: "SECURE_ELECTRONIC", requested_text_mining: true, requested_accessibility_conformance: "WCAG_2_1_AA", requested_perpetual_access: "FULL_ARCHIVE" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { negotiation_id: $.data.id }
            - call: "POST /erm/negotiations/${negotiation_id}/submit"
              payload: {}
              as: LicenseNegotiator
              as_user_id: "neg-1"
            - call: "POST /erm/negotiations/${negotiation_id}/vendor-response"
              payload: { disposition: "ACCEPT", accepted_price_cents: 9000000, granted_ill_mode: "SECURE_ELECTRONIC", granted_text_mining: true, granted_accessibility_conformance: "WCAG_2_1_AA", granted_perpetual_access: "FULL_ARCHIVE" }
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /erm/products/${product_id}/commitments"
              payload: { member_id: "${m_a_id}" }
              as: MemberLibrarian
              as_user_id: "${m_a_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /erm/negotiations/${negotiation_id}/sign"
              payload: { activation_start_date: "2027-01-01" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { sub_id: $.data.id }
            - call: "POST /erm/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
            - call: "POST /erm/subscriptions/${sub_id}/usage-reports"
              payload: { member_id: "${m_a_id}", period_month: "2027-01", full_text_requests: 1200, searches: 4000, denials: 10 }
              as: VendorRep
              as_user_id: "${vendor_id}"
          trigger:
            - call: "GET /erm/usage-reports"
              payload: { subscription_id: "${sub_id}" }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { report_id: "$.data[0].id" }
          assert:
            - "response status == 200"
            - "response.total_count == 1"
            - "response.data[0].full_text_requests == 1200"
            - "response.data[0].period_month == 2027-01"
            - "response.data[0].id is present and response.data[0].created_at is present"
            - "response.data[0] has no version field"
            - "response.data[0] has no updated_at field"
            - "no PATCH, PUT or DELETE endpoint for /erm/usage-reports/${report_id} exists in the API surface"
      - name: feedback_on_an_unknown_trial_returns_trial_not_found
        claim_type: parent_relationships
        grounds:
          - entities.FeedbackEntry
          - validations.priority_3_path_existence
          - errors.ERR_TRIAL_NOT_FOUND
          - endpoints.POST_/erm/trials/{id}/feedback
        distinguishing_aspect: |
          FeedbackEntry has parent Trial and is only reachable through the nested path, so a feedback
          post against a non-existent trial id must fail the priority-3 path-existence check with
          ERR_TRIAL_NOT_FOUND (404) before any body validation runs.
        test_recipe:
          setup:
            - "One vendor, one product and Member Alpha College; no trial exists."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /erm/products"
