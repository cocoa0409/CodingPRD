# =============================================================================
# Exotic & Seasonal Car Storage / Vehicle Vault — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty: Expert.
# =============================================================================

scenario: |
  Exotic & Seasonal Car Storage / Vehicle Vault: unit & vehicle intake/condition,
  climate/monitoring & battery-tender, in/out & detailing/start service, membership
  tier & billing, transport & event delivery, insurance/COI, waitlist, inspection

domain_name: exotic-car-storage-vault
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Facility -> StorageUnit hierarchy, plus flat FK peers (Agreement links
  # Member+Vehicle+Unit; DeliveryJob links Vehicle+Transporter).

  state_machine_shape: cyclic
  # StorageAgreement IN_STORAGE <-> CHECKED_OUT cycle; ServiceOrder branch+revert;
  # StorageUnit AVAILABLE -> RESERVED -> OCCUPIED -> AVAILABLE cycle.

  relationship_patterns:
    - one_to_many        # Facility -> StorageUnit; Member -> Vehicle; Agreement -> ServiceOrder
    - cross_aggregate    # StorageAgreement references Member, Vehicle, StorageUnit across aggregates
    - polymorphic: false

  role_model: peer_roles
  # Member owns own vehicles/agreements; VaultManager manages units/agreements/approvals;
  # ConciergeTech performs physical service/monitoring/delivery execution; BillingAdmin bills.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vault facility name" }
      - { name: total_units, type: integer, source: input, description: "Total number of storage units at the facility (must equal sum of created units eventually; used as capacity ceiling)" }
      - { name: units_available, type: integer, source: computed, description: "Count of child StorageUnit with status=AVAILABLE" }
      - { name: units_reserved, type: integer, source: computed, description: "Count of child StorageUnit with status=RESERVED" }
      - { name: units_occupied, type: integer, source: computed, description: "Count of child StorageUnit with status=OCCUPIED" }
      - { name: units_out_of_service, type: integer, source: computed, description: "Count of child StorageUnit with status=OUT_OF_SERVICE" }

  - name: StorageUnit
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the facility this unit belongs to" }
      - { name: unit_code, type: string, source: input, description: "Human-readable unit label, unique within facility" }
      - { name: unit_class, type: enum, source: input, description: "STANDARD | CLIMATE | SHOWCASE", constraints: "one of STANDARD, CLIMATE, SHOWCASE" }
      - { name: climate_controlled, type: boolean, source: computed, description: "true when unit_class in {CLIMATE, SHOWCASE}" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Base monthly storage rate in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | OCCUPIED | OUT_OF_SERVICE", default: AVAILABLE, constraints: "one of AVAILABLE, RESERVED, OCCUPIED, OUT_OF_SERVICE" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Contact email, unique across members" }
      - { name: membership_tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD | PLATINUM", default: BRONZE, constraints: "one of BRONZE, SILVER, GOLD, PLATINUM" }
      - { name: tier_discount_pct, type: number, source: computed, description: "Derived from membership_tier: BRONZE 0.00, SILVER 0.05, GOLD 0.10, PLATINUM 0.20" }
      - { name: billing_status, type: enum, source: system, description: "CURRENT | PAST_DUE | SUSPENDED", default: CURRENT, constraints: "one of CURRENT, PAST_DUE, SUSPENDED" }
      - { name: charged_cents, type: integer, source: computed, description: "Sum of total_cents over this member's Invoices in status ISSUED or PAID" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of amount_cents over this member's recorded payments" }
      - { name: held_cents, type: integer, source: computed, description: "Sum of estimated_cost_cents over this member's ServiceOrders in status APPROVED, IN_PROGRESS, or ON_HOLD" }
      - { name: account_balance_cents, type: integer, source: computed, description: "charged_cents - paid_cents; outstanding money the member owes" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of the vehicle" }
      - { name: make, type: string, source: input, description: "Vehicle make" }
      - { name: model, type: string, source: input, description: "Vehicle model" }
      - { name: model_year, type: integer, source: input, description: "Model year" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number, unique across vehicles" }
      - { name: fuel_type, type: enum, source: input, description: "ICE | HYBRID | EV", constraints: "one of ICE, HYBRID, EV" }
      - { name: declared_value_cents, type: integer, source: input, description: "Owner-declared value in cents; drives COI adequacy check", constraints: ">= 0" }
      - { name: condition_status, type: enum, source: system, description: "INTAKE_PENDING | DOCUMENTED | DAMAGE_HOLD", default: INTAKE_PENDING, constraints: "one of INTAKE_PENDING, DOCUMENTED, DAMAGE_HOLD" }
      - { name: insurance_status, type: enum, source: computed, description: "NONE | ACTIVE | LAPSED; ACTIVE iff the vehicle has a COI in status ACTIVE whose window covers the logical clock, LAPSED if it once had one that is now EXPIRED/REVOKED, else NONE" }

  - name: InsuranceCOI
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; insured vehicle" }
      - { name: policy_number, type: string, source: input, description: "Insurer policy number" }
      - { name: carrier, type: string, source: input, description: "Insurance carrier name" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Coverage limit in cents", constraints: ">= 0" }
      - { name: effective_at, type: datetime, source: input, description: "Coverage window start (inclusive), ISO 8601 UTC" }
      - { name: expiry_at, type: datetime, source: input, description: "Coverage window end (exclusive), ISO 8601 UTC" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: ACTIVE, constraints: "one of ACTIVE, EXPIRED, REVOKED" }

  - name: StorageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; billed member" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; stored vehicle" }
      - { name: unit_id, type: string, source: input, description: "FK -> StorageUnit.id; assigned unit" }
      - { name: move_in_at, type: datetime, source: input, description: "Occupancy start (inclusive), ISO 8601 UTC" }
      - { name: planned_move_out_at, type: datetime, source: input, description: "Planned occupancy end (exclusive), ISO 8601 UTC; used for unit overlap detection" }
      - { name: actual_move_out_at, type: datetime, source: system, description: "Set to the logical clock at terminate; null until CLOSED" }
      - { name: monthly_rate_cents, type: integer, source: computed, description: "Snapshot of the storage_monthly_fee calculation at creation (base + climate surcharge - capped tier discount)" }
      - { name: days_stored, type: integer, source: computed, description: "Whole days from move_in_at to actual_move_out_at, floor, at terminate; used by final proration" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_STORAGE | CHECKED_OUT | CLOSED | CANCELLED", default: PENDING, constraints: "one of PENDING, IN_STORAGE, CHECKED_OUT, CLOSED, CANCELLED" }

  - name: MonitoringSubscription
    parent: StorageAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> StorageAgreement.id; agreement being monitored" }
      - { name: monitor_type, type: enum, source: input, description: "BATTERY_TENDER | CLIMATE | BOTH", constraints: "one of BATTERY_TENDER, CLIMATE, BOTH" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monitoring add-on monthly fee in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED", default: ACTIVE, constraints: "one of ACTIVE, CANCELLED" }
      - { name: last_battery_voltage, type: number, source: system, description: "Most recent battery reading, null until a reading is recorded" }
      - { name: low_battery_alert, type: boolean, source: computed, description: "true when last_battery_voltage is not null and < BATTERY_MIN_VOLTAGE (12.4)", default: false }

  - name: ServiceOrder
    parent: StorageAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> StorageAgreement.id; agreement the service is performed under" }
      - { name: service_type, type: enum, source: input, description: "DETAIL | START_ENGINE | CHECKOUT | CHECKIN | FUEL", constraints: "one of DETAIL, START_ENGINE, CHECKOUT, CHECKIN, FUEL" }
      - { name: estimated_labor_hours, type: number, source: input, description: "Estimated labor hours quoted at request", constraints: ">= 0" }
      - { name: actual_labor_hours, type: number, source: input, description: "Actual labor hours entered at completion, null until COMPLETED" }
      - { name: parts_cents, type: integer, source: input, description: "Parts cost entered at completion, defaults 0", default: 0 }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "service_order_cost provisional variant, set at approve" }
      - { name: final_cost_cents, type: integer, source: computed, description: "service_order_cost final variant, set at complete; null until COMPLETED" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled service time set at approve, ISO 8601 UTC" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | IN_PROGRESS | ON_HOLD | COMPLETED | CANCELLED", default: REQUESTED, constraints: "one of REQUESTED, APPROVED, REJECTED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED" }

  - name: Transporter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Transport crew / carrier name" }
      - { name: buffer_minutes, type: integer, source: input, description: "Required idle buffer (travel/cleanup) between this transporter's back-to-back jobs, in minutes", default: 60, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE, constraints: "one of ACTIVE, INACTIVE" }

  - name: DeliveryJob
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle being transported to an event" }
      - { name: transporter_id, type: string, source: input, description: "FK -> Transporter.id; assigned transporter resource" }
      - { name: event_name, type: string, source: input, description: "Destination event label" }
      - { name: pickup_at, type: datetime, source: input, description: "Job window start (inclusive), ISO 8601 UTC" }
      - { name: dropoff_at, type: datetime, source: input, description: "Job window end (inclusive) — return to vault; transporter is occupied [pickup_at, dropoff_at] plus buffer_minutes after" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OUT_FOR_EVENT | RETURNED | CANCELLED", default: SCHEDULED, constraints: "one of SCHEDULED, OUT_FOR_EVENT, RETURNED, CANCELLED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member awaiting a unit" }
      - { name: desired_unit_class, type: enum, source: input, description: "STANDARD | CLIMATE | SHOWCASE", constraints: "one of STANDARD, CLIMATE, SHOWCASE" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility the member wants a unit at" }
      - { name: status, type: enum, source: system, description: "WAITING | OFFERED | CLAIMED | EXPIRED | CANCELLED", default: WAITING, constraints: "one of WAITING, OFFERED, CLAIMED, EXPIRED, CANCELLED" }
      - { name: offered_unit_id, type: string, source: system, description: "FK -> StorageUnit.id; unit reserved for this member while OFFERED, null otherwise" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Deadline to claim the offer (OFFER_TTL_HOURS = 48 hours after offer), null unless OFFERED" }

  - name: Inspection
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; inspected vehicle" }
      - { name: inspection_type, type: enum, source: input, description: "INTAKE | PERIODIC | CHECKOUT", constraints: "one of INTAKE, PERIODIC, CHECKOUT" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED", default: SCHEDULED, constraints: "one of SCHEDULED, PASSED, FAILED" }
      - { name: damage_noted, type: boolean, source: input, description: "Whether damage was recorded at inspection, set at pass/fail", default: false }
      - { name: findings, type: string, source: input, description: "Free-text findings recorded at pass/fail", default: "" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; billed member" }
      - { name: agreement_id, type: string, source: input, description: "FK -> StorageAgreement.id; agreement this invoice bills" }
      - { name: period_start_at, type: datetime, source: input, description: "Billing period start, ISO 8601 UTC" }
      - { name: period_end_at, type: datetime, source: input, description: "Billing period end, ISO 8601 UTC" }
      - { name: proration_mode, type: enum, source: input, description: "FULL_MONTH | PRORATED; selects storage_proration variant", default: FULL_MONTH, constraints: "one of FULL_MONTH, PRORATED" }
      - { name: line_items, type: array, source: computed, description: "Array of {kind, amount_cents}: STORAGE, MONITORING, SERVICE, DELIVERY lines, each rounded to whole cents" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of rounded line_items amount_cents (round-per-line-then-sum)" }
      - { name: tax_cents, type: integer, source: computed, description: "sum over line_items of round(amount_cents * TAX_RATE) — per-line tax rounding then sum (NOT round(subtotal * TAX_RATE))" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: due_at, type: datetime, source: computed, description: "issued time + INVOICE_DUE_DAYS (15 days); past-due gate compares logical clock to this" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID", default: DRAFT, constraints: "one of DRAFT, ISSUED, PAID, VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StorageUnit
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Units are seasonally interval-booked: agreement CREATE reserves a time WINDOW on the unit (overlap-checked, half-open) and bumps unit.version but does NOT change unit.status. status tracks CURRENT physical occupancy only. RESERVED is used solely for a waitlist OFFER hold."
    transitions:
      - from: [AVAILABLE, RESERVED]
        to: OCCUPIED
        trigger: "system — the booking agreement moves PENDING -> IN_STORAGE (POST /storage-agreements/{id}/move-in)"
        actor: system
        preconditions:
          - "unit.status in {AVAILABLE, RESERVED} (no other agreement currently physically occupying it)"
        side_effects:
          - "Facility unit counts recomputed (units_available/units_reserved--, units_occupied++)"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system — agreement terminated (POST /storage-agreements/{id}/terminate) releases the unit"
        actor: system
        preconditions:
          - "unit.status == OCCUPIED"
        side_effects:
          - "increments StorageUnit.version by 1"
          - "Facility unit counts recomputed (units_occupied--, units_available++)"
          - "CASCADE: unit becoming AVAILABLE triggers waitlist promotion (see WaitlistEntry WAITING->OFFERED)"
      - from: AVAILABLE
        to: RESERVED
        trigger: "system — waitlist promotion offers this unit to the top-ranked WAITING entry"
        actor: system
        preconditions:
          - "unit.status == AVAILABLE"
        side_effects:
          - "offered_unit_id set on the promoted WaitlistEntry"
          - "increments StorageUnit.version by 1"
          - "Facility unit counts recomputed (units_available--, units_reserved++)"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system — offer expiry (WaitlistEntry OFFERED->EXPIRED) or offer cancelled"
        actor: system
        preconditions:
          - "unit.status == RESERVED"
        side_effects:
          - "offered_unit_id cleared"
          - "increments StorageUnit.version by 1"
          - "Facility unit counts recomputed (units_reserved--, units_available++)"
          - "CASCADE: re-runs waitlist promotion on this unit"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /units/{id}/set-service-status with in_service=false"
        actor: VaultManager
        preconditions:
          - "unit.status == AVAILABLE"
        side_effects:
          - "Facility unit counts recomputed (units_available--, units_out_of_service++)"
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /units/{id}/set-service-status with in_service=true"
        actor: VaultManager
        preconditions:
          - "unit.status == OUT_OF_SERVICE"
        side_effects:
          - "Facility unit counts recomputed (units_out_of_service--, units_available++)"

  - entity: StorageAgreement
    field: status
    initial_state: PENDING
    terminal_states: [CLOSED, CANCELLED]
    note: "IN_STORAGE <-> CHECKED_OUT is the in/out cycle (non-linear: cyclic)."
    transitions:
      - from: PENDING
        to: IN_STORAGE
        trigger: "POST /storage-agreements/{id}/move-in"
        actor: VaultManager
        preconditions:
          - "agreement.status == PENDING"
          - "assigned StorageUnit.status in {AVAILABLE, RESERVED} (not currently OCCUPIED by another agreement; else ERR_UNIT_NOT_AVAILABLE)"
          - "Vehicle.condition_status == DOCUMENTED (intake complete)"
        side_effects:
          - "assigned StorageUnit {AVAILABLE|RESERVED} -> OCCUPIED"
      - from: IN_STORAGE
        to: CHECKED_OUT
        trigger: "POST /storage-agreements/{id}/check-out"
        actor: [Member, ConciergeTech]
        preconditions:
          - "agreement.status == IN_STORAGE"
          - "no ServiceOrder on this agreement in status IN_PROGRESS or ON_HOLD (else ERR_AGREEMENT_HAS_ACTIVE_SERVICE)"
        side_effects:
          - "Vehicle is physically out; unit remains OCCUPIED (reserved for return)"
      - from: CHECKED_OUT
        to: IN_STORAGE
        trigger: "POST /storage-agreements/{id}/check-in"
        actor: [Member, ConciergeTech]
        preconditions:
          - "agreement.status == CHECKED_OUT"
        side_effects:
          - "Vehicle returned to unit"
      - from: [IN_STORAGE, CHECKED_OUT]
        to: CLOSED
        trigger: "POST /storage-agreements/{id}/terminate"
        actor: VaultManager
        preconditions:
          - "agreement.status in {IN_STORAGE, CHECKED_OUT}"
          - "no ServiceOrder on this agreement in status IN_PROGRESS or ON_HOLD (else ERR_AGREEMENT_HAS_ACTIVE_SERVICE)"
        side_effects:
          - "actual_move_out_at = logical clock; days_stored computed; final proration available"
          - "CASCADE link 1: every ACTIVE MonitoringSubscription on this agreement -> CANCELLED"
          - "CASCADE link 2 (depth): assigned StorageUnit OCCUPIED -> AVAILABLE (this unit release itself triggers link 3)"
          - "CASCADE link 3: the unit release runs waitlist promotion — top eligible WaitlistEntry WAITING -> OFFERED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /storage-agreements/{id}/cancel"
        actor: [Member, VaultManager]
        preconditions:
          - "agreement.status == PENDING"
        side_effects:
          - "releases the booking window on the unit; increments StorageUnit.version by 1"

  - entity: ServiceOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    note: "Branch (APPROVED|REJECTED) + revert cycle (IN_PROGRESS <-> ON_HOLD): non-linear."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /service-orders/{id}/approve"
        actor: VaultManager
        preconditions:
          - "service_order.status == REQUESTED"
          - "parent StorageAgreement.status in {IN_STORAGE, CHECKED_OUT}"
        side_effects:
          - "estimated_cost_cents computed (service_order_cost provisional variant)"
          - "scheduled_at recorded"
          - "Member.held_cents recomputed (adds estimated_cost_cents)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /service-orders/{id}/reject"
        actor: VaultManager
        preconditions:
          - "service_order.status == REQUESTED"
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/start"
        actor: ConciergeTech
        preconditions:
          - "service_order.status == APPROVED"
          - "parent StorageAgreement.status == IN_STORAGE (cross-entity: cannot start while vehicle is CHECKED_OUT)"
          - "Vehicle.condition_status != DAMAGE_HOLD"
        side_effects: []
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /service-orders/{id}/hold"
        actor: ConciergeTech
        preconditions:
          - "service_order.status == IN_PROGRESS"
        side_effects: ["Work paused; still counts toward Member.held_cents"]
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/start"
        actor: ConciergeTech
        preconditions:
          - "service_order.status == ON_HOLD"
          - "parent StorageAgreement.status == IN_STORAGE"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-orders/{id}/complete"
        actor: ConciergeTech
        preconditions:
          - "service_order.status == IN_PROGRESS"
          - "actual_labor_hours provided in request body"
        side_effects:
          - "final_cost_cents computed (service_order_cost final variant, includes parts_cents)"
          - "Member.held_cents recomputed (removes this order's estimated_cost_cents)"
          - "A SERVICE line for final_cost_cents becomes eligible for the member's next invoice"
      - from: [REQUESTED, APPROVED, ON_HOLD]
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel"
        actor: [Member, VaultManager]
        preconditions:
          - "service_order.status in {REQUESTED, APPROVED, ON_HOLD}"
        side_effects:
          - "If it was APPROVED or ON_HOLD: Member.held_cents recomputed (removes estimated_cost_cents) — compensating release leaves account_balance_cents unchanged"

  - entity: DeliveryJob
    field: status
    initial_state: SCHEDULED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OUT_FOR_EVENT
        trigger: "POST /delivery-jobs/{id}/dispatch"
        actor: ConciergeTech
        preconditions:
          - "delivery_job.status == SCHEDULED"
          - "Vehicle.insurance_status == ACTIVE (re-checked at dispatch)"
        side_effects: ["Vehicle physically leaves the vault for the event"]
      - from: OUT_FOR_EVENT
        to: RETURNED
        trigger: "POST /delivery-jobs/{id}/return"
        actor: ConciergeTech
        preconditions:
          - "delivery_job.status == OUT_FOR_EVENT"
        side_effects: ["Transporter window released for that interval"]
      - from: [SCHEDULED, OUT_FOR_EVENT]
        to: CANCELLED
        trigger: "POST /delivery-jobs/{id}/cancel, OR system when the vehicle's insurance lapses (COI cascade)"
        actor: [Member, VaultManager, system]
        preconditions:
          - "delivery_job.status in {SCHEDULED, OUT_FOR_EVENT}"
        side_effects: ["Transporter window released"]

  - entity: InsuranceCOI
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /coi/{id}/revoke"
        actor: VaultManager
        preconditions:
          - "coi.status == ACTIVE"
        side_effects:
          - "CASCADE link 1: Vehicle.insurance_status recomputed -> LAPSED (no other ACTIVE covering COI)"
          - "CASCADE link 2 (depth): the vehicle lapse auto-cancels every DeliveryJob on that vehicle in status SCHEDULED -> CANCELLED (transporter windows released)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — refresh at POST /vehicles/{id}/refresh-insurance when logical clock >= expiry_at"
        actor: system
        preconditions:
          - "coi.status == ACTIVE"
          - "logical clock >= expiry_at"
        side_effects:
          - "CASCADE link 1: Vehicle.insurance_status recomputed -> LAPSED"
          - "CASCADE link 2 (depth): auto-cancel that vehicle's SCHEDULED DeliveryJobs -> CANCELLED"

  - entity: WaitlistEntry
    field: status
    initial_state: WAITING
    terminal_states: [CLAIMED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system — a StorageUnit of the entry's desired_unit_class at the entry's facility becomes AVAILABLE; the top-ranked WAITING entry is offered"
        actor: system
        preconditions:
          - "entry.status == WAITING"
          - "entry is the top-ranked eligible entry (see waitlist_promotion selector)"
        side_effects:
          - "offered_unit_id = the released unit; that StorageUnit AVAILABLE -> RESERVED"
          - "offer_expires_at = logical clock + OFFER_TTL_HOURS (48 hours)"
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /waitlist/{id}/claim"
        actor: Member
        preconditions:
          - "entry.status == OFFERED"
          - "logical clock < offer_expires_at (else ERR_OFFER_EXPIRED)"
        side_effects: ["Member may now create a StorageAgreement on offered_unit_id (unit stays RESERVED to them)"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system — refresh at POST /waitlist/{id}/refresh-offer when logical clock >= offer_expires_at"
        actor: system
        preconditions:
          - "entry.status == OFFERED"
          - "logical clock >= offer_expires_at"
        side_effects:
          - "offered_unit_id StorageUnit RESERVED -> AVAILABLE (re-runs promotion to next-ranked entry)"
      - from: [WAITING, OFFERED]
        to: CANCELLED
        trigger: "POST /waitlist/{id}/cancel"
        actor: [Member, VaultManager]
        preconditions:
          - "entry.status in {WAITING, OFFERED}"
        side_effects:
          - "If OFFERED: offered_unit_id RESERVED -> AVAILABLE (re-runs promotion)"

  - entity: Inspection
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/pass"
        actor: [ConciergeTech, VaultManager]
        preconditions:
          - "inspection.status == SCHEDULED"
        side_effects:
          - "If inspection_type == INTAKE: Vehicle.condition_status INTAKE_PENDING -> DOCUMENTED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/fail"
        actor: [ConciergeTech, VaultManager]
        preconditions:
          - "inspection.status == SCHEDULED"
        side_effects:
          - "Vehicle.condition_status -> DAMAGE_HOLD (blocks service start and move-in until a later INTAKE inspection passes)"

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == DRAFT"
        side_effects:
          - "due_at = logical clock + INVOICE_DUE_DAYS (15 days)"
          - "Member.charged_cents recomputed (adds total_cents)"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: [Member, BillingAdmin]
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "records a payment of total_cents; Member.paid_cents recomputed; account_balance_cents falls by total_cents"
      - from: [DRAFT, ISSUED]
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "invoice.status in {DRAFT, ISSUED}"
        side_effects:
          - "If it was ISSUED: Member.charged_cents recomputed (removes total_cents) — compensating void leaves account_balance_cents at its pre-issue value"

  - entity: Member
    field: billing_status
    initial_state: CURRENT
    terminal_states: []
    note: "Independent billing dimension on Member (parallel to membership_tier)."
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system — POST /members/{id}/refresh-billing when an ISSUED invoice has due_at <= logical clock and is unpaid"
        actor: system
        preconditions:
          - "member.billing_status == CURRENT"
          - "exists ISSUED invoice with due_at <= clock"
        side_effects: []
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "system — POST /members/{id}/refresh-billing when a past-due ISSUED invoice remains unpaid and due_at + SUSPEND_GRACE_DAYS (30 days) <= logical clock"
        actor: system
        preconditions:
          - "member.billing_status == PAST_DUE"
          - "exists ISSUED invoice with due_at + SUSPEND_GRACE_DAYS (30 days) <= clock"
        side_effects: []
      - from: [PAST_DUE, SUSPENDED]
        to: CURRENT
        trigger: "system — POST /members/{id}/refresh-billing when no ISSUED invoice is past due (account_balance settled)"
        actor: system
        preconditions:
          - "no ISSUED invoice with due_at <= clock"
        side_effects: []

  - entity: MonitoringSubscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "system — parent StorageAgreement terminated (POST /storage-agreements/{id}/terminate)"
        actor: system
        preconditions:
          - "monitoring.status == ACTIVE"
        side_effects:
          - "Stops accruing monitoring fees; no longer billed on subsequent invoices"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-unit
    parent_entity: StorageUnit
    write_endpoint: "POST /storage-agreements"
    occ_field: "expected_unit_version"
    description: |
      Creating a StorageAgreement against a StorageUnit whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another agreement has already recorded a booking window on the unit (a
      legitimate non-overlapping season that supersedes the client's read) — bumping
      its version — so the current writer's view of the unit's booking schedule is stale.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: storage_monthly_fee
    trigger: "StorageAgreement create (POST /storage-agreements); snapshot stored on agreement.monthly_rate_cents"
    algorithm: tiered_pricing
    formula: |
      base = unit.monthly_rate_cents
      surcharge = 0
      if unit.unit_class == CLIMATE:  surcharge = CLIMATE_SURCHARGE_CENTS
      if unit.unit_class == SHOWCASE: surcharge = SHOWCASE_SURCHARGE_CENTS
      gross = base + surcharge
      raw_discount = gross * member.tier_discount_pct
      discount = min(raw_discount, MAX_DISCOUNT_CENTS)          # non-linear cap
      monthly_rate_cents = round(gross - discount)               # round_half_up, whole cents
    input_set: "single StorageUnit (unit_class, monthly_rate_cents) x single Member (tier_discount_pct)"
    constants:
      CLIMATE_SURCHARGE_CENTS: 5000
      SHOWCASE_SURCHARGE_CENTS: 12000
      MAX_DISCOUNT_CENTS: 20000
      TIER_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.20 }
    precision: "whole cents, round_half_up"

  - name: storage_proration
    trigger: "STORAGE line built during invoice generation (POST /invoices/generate)"
    algorithm: threshold
    formula: |
      # DUAL-VARIANT on the StorageAgreement billing domain.
      monthly = agreement.monthly_rate_cents
      variant FULL_MONTH (provisional, agreement still IN_STORAGE/CHECKED_OUT):
        storage_line_cents = monthly
      variant PRORATED (final, agreement CLOSED — days_stored known):
        storage_line_cents = round(monthly * min(days_stored, PRORATION_DAYS_IN_MONTH) / PRORATION_DAYS_IN_MONTH)
    input_set: "one StorageAgreement; variant chosen by invoice.proration_mode and agreement.status"
    constants:
      PRORATION_DAYS_IN_MONTH: 30
    precision: "whole cents, round_half_up"
    variants:
      - { name: FULL_MONTH, when: "invoice.proration_mode == FULL_MONTH (recurring monthly bill while stored)", difference: "charges the whole monthly rate regardless of days" }
      - { name: PRORATED, when: "invoice.proration_mode == PRORATED (final bill after terminate)", difference: "charges monthly * days_stored/30, capped at one month" }

  - name: service_order_cost
    trigger: "estimated at POST /service-orders/{id}/approve; final at POST /service-orders/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      # DUAL-VARIANT on the ServiceOrder domain (different entity than storage_proration).
      base = SERVICE_BASE_CENTS[service_type]
      variant estimate (at approve):
        estimated_cost_cents = round(base + estimated_labor_hours * LABOR_RATE_CENTS)
      variant final (at complete):
        final_cost_cents = round(base + actual_labor_hours * LABOR_RATE_CENTS + parts_cents)
    input_set: "one ServiceOrder (service_type, estimated_labor_hours or actual_labor_hours, parts_cents)"
    constants:
      LABOR_RATE_CENTS: 12000
      SERVICE_BASE_CENTS: { DETAIL: 15000, START_ENGINE: 3000, CHECKOUT: 5000, CHECKIN: 5000, FUEL: 4000 }
    precision: "whole cents, round_half_up"
    variants:
      - { name: estimate, when: "at approve, before work", difference: "uses estimated_labor_hours, excludes parts" }
      - { name: final, when: "at complete, after work", difference: "uses actual_labor_hours and adds parts_cents" }

  - name: invoice_total
    trigger: "POST /invoices/generate"
    algorithm: aggregation
    formula: |
      # COMBINATORIAL mode (b): rounding order is pinned as round-per-line-then-sum.
      # Line kinds gathered for (member_id, agreement_id) over the billing period:
      #   STORAGE   = storage_proration (per variant above), one line
      #   MONITORING= sum over ACTIVE MonitoringSubscription on the agreement of monthly_fee_cents, ONE combined line, rounded
      #   SERVICE   = one line per COMPLETED ServiceOrder on the agreement not yet invoiced, each = final_cost_cents (already whole cents)
      #   DELIVERY  = one line per RETURNED DeliveryJob for the agreement's vehicle not yet invoiced, each = DELIVERY_FLAT_CENTS
      subtotal_cents = sum(line.amount_cents for line in line_items)         # lines already whole cents
      # PINNED rounding order — tax is rounded PER LINE then summed, NOT round(subtotal * TAX_RATE):
      tax_cents      = sum(round(line.amount_cents * TAX_RATE) for line in line_items)   # round-per-line then sum
      total_cents    = subtotal_cents + tax_cents
    input_set: "STORAGE (1) + MONITORING (1 combined) + SERVICE (n COMPLETED, uninvoiced) + DELIVERY (n RETURNED, uninvoiced) lines for the agreement"
    constants:
      TAX_RATE: 0.08
      DELIVERY_FLAT_CENTS: 25000
    precision: "tax computed per line (round_half_up on each line's amount*TAX_RATE) THEN summed — round-per-line-then-sum, which diverges from round(subtotal*TAX_RATE) at fractional-cent lines"

  - name: facility_unit_counts
    trigger: "any StorageUnit status change (create/reserve/occupy/release/service-status)"
    algorithm: aggregation
    formula: |
      units_available      = count(StorageUnit where facility_id == F.id and status == AVAILABLE)
      units_reserved       = count(StorageUnit where facility_id == F.id and status == RESERVED)
      units_occupied       = count(StorageUnit where facility_id == F.id and status == OCCUPIED)
      units_out_of_service = count(StorageUnit where facility_id == F.id and status == OUT_OF_SERVICE)
      INVARIANT (conserved quantity = unit count):
        units_available + units_reserved + units_occupied + units_out_of_service
          == count(all StorageUnit where facility_id == F.id)
    input_set: "all StorageUnit rows under the facility"
    precision: "integer counts"

  - name: member_account_balance
    trigger: "invoice issue/pay/void; service approve/complete/cancel; payment recorded"
    algorithm: aggregation
    formula: |
      charged_cents = sum(total_cents for Invoice where member_id == M.id and status in {ISSUED, PAID})
      paid_cents    = sum(amount_cents for recorded payments of member M)
      held_cents    = sum(estimated_cost_cents for ServiceOrder where agreement.member_id == M.id and status in {APPROVED, IN_PROGRESS, ON_HOLD})
      account_balance_cents = charged_cents - paid_cents
      INVARIANT (conserved quantity = money): approving a ServiceOrder then cancelling it
        (compensating pair) restores held_cents and leaves account_balance_cents unchanged;
        issuing an Invoice then voiding it restores charged_cents to its pre-issue value.
    input_set: "the member's Invoices (ISSUED/PAID), recorded payments, and non-terminal ServiceOrders"
    precision: "whole cents"

  - name: waitlist_promotion
    trigger: "a StorageUnit becomes AVAILABLE (agreement terminate/cancel, offer expiry, unit restored to service)"
    algorithm: weighted_scoring
    formula: |
      # SELECTOR — candidate set, ranking, tie-break, empty fallback all pinned.
      eligible = WaitlistEntry where status == WAITING
                 and facility_id == unit.facility_id
                 and desired_unit_class == unit.unit_class
      rank key: (TIER_RANK[member.membership_tier] DESC, entry.created_at ASC)
        TIER_RANK = { PLATINUM: 4, GOLD: 3, SILVER: 2, BRONZE: 1 }
      tie-break: entry.created_at ASC (created_at is unique enough; id is NEVER used)
      selected = first eligible under the rank key
      fallback (eligible empty): unit stays AVAILABLE, no offer made
    input_set: "WAITING WaitlistEntry rows matching the released unit's facility and class"
    precision: "n/a (selection)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed Member acting on a resource must own it (resource.member_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "Uniqueness: Member.email, Vehicle.vin, StorageUnit.unit_code within facility"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /members, POST /vehicles, POST /facilities/{id}/units"
  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_referential
    check: "Cross-entity state precondition holds (e.g., ServiceOrder start requires parent StorageAgreement IN_STORAGE; move-in requires Vehicle DOCUMENTED)"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /service-orders/{id}/start, POST /storage-agreements/{id}/move-in"
  - priority: 8
    category: business_temporal
    check: "StorageUnit occupancy overlap: [move_in_at, planned_move_out_at) half-open interval must not overlap any non-terminal agreement on the same unit"
    error_id: ERR_UNIT_OVERLAP
    http_status: 409
    applies_to: "POST /storage-agreements"
  - priority: 9
    category: business_temporal
    check: "Transporter double-booking: [pickup_at, dropoff_at] closed interval PLUS buffer_minutes after dropoff must not overlap another job on the same transporter"
    error_id: ERR_TRANSPORTER_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-jobs"
  - priority: 10
    category: business_safety
    check: "DeliveryJob create/dispatch requires the vehicle's insurance_status == ACTIVE"
    error_id: ERR_INSURANCE_LAPSED
    http_status: 409
    applies_to: "POST /delivery-jobs, POST /delivery-jobs/{id}/dispatch"
  - priority: 11
    category: business_referential
    check: "COI coverage adequacy: on delivery create, chosen vehicle's ACTIVE COI coverage_amount_cents >= vehicle.declared_value_cents (>= boundary)"
    error_id: ERR_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /delivery-jobs"
  - priority: 12
    category: business_fiscal
    check: "Member billing gate: member.billing_status != SUSPENDED for chargeable operations"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 402
    applies_to: "POST /storage-agreements, POST /service-orders, POST /delivery-jobs"
  - priority: 13
    category: business_constraint
    check: "Waitlist join only when no AVAILABLE StorageUnit of desired_unit_class exists at the facility (units_available_of_class == 0)"
    error_id: ERR_UNITS_AVAILABLE
    http_status: 409
    applies_to: "POST /waitlist"
  - priority: 14
    category: business_constraint
    check: "OCC: expected_unit_version must equal the assigned StorageUnit.version (stale -> ERR_STALE_UNIT_VERSION 412)"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /storage-agreements"
  - priority: 15
    category: business_constraint
    check: "Facility unit ceiling: count of a facility's StorageUnits must not exceed its total_units when creating a new unit"
    error_id: ERR_FACILITY_UNIT_LIMIT
    http_status: 409
    applies_to: "POST /facilities/{id}/units"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Facility ----
  - method: POST
    path: "/facilities"
    description: "Create a vault facility"
    roles: [VaultManager]
    code: 201
    input: [name, total_units]
    output: Facility
    side_effects: ["all unit counters initialized to 0"]
  - method: GET
    path: "/facilities/{id}"
    description: "Get facility with live unit counters"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/facilities/{id}/units"
    description: "List units at a facility (reverse of StorageUnit.facility_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: ["status?"]
    output: StorageUnit[]
    side_effects: []

  # ---- StorageUnit ----
  - method: POST
    path: "/facilities/{id}/units"
    description: "Create a storage unit under a facility"
    roles: [VaultManager]
    code: 201
    input: [unit_code, unit_class, monthly_rate_cents]
    output: StorageUnit
    side_effects: ["status=AVAILABLE", "facility_unit_counts recomputed", "climate_controlled derived from unit_class"]
  - method: GET
    path: "/units/{id}"
    description: "Get a storage unit"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: StorageUnit
    side_effects: []
  - method: POST
    path: "/units/{id}/set-service-status"
    description: "Take a unit out of service or restore it"
    roles: [VaultManager]
    code: 200
    input: [in_service]
    output: StorageUnit
    side_effects:
      - "in_service=false: AVAILABLE -> OUT_OF_SERVICE"
      - "in_service=true: OUT_OF_SERVICE -> AVAILABLE (re-runs waitlist promotion)"
      - "facility_unit_counts recomputed"

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [VaultManager, BillingAdmin]
    code: 201
    input: [full_name, email, "membership_tier?"]
    output: Member
    side_effects: ["billing_status=CURRENT", "tier_discount_pct derived from membership_tier"]
  - method: GET
    path: "/members/{id}"
    description: "Get a member with computed balance fields"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members/{id}/vehicles"
    description: "List a member's vehicles (reverse of Vehicle.member_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Vehicle[]
    side_effects: []
  - method: GET
    path: "/members/{id}/waitlist"
    description: "List a member's waitlist entries (reverse of WaitlistEntry.member_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: WaitlistEntry[]
    side_effects: []
  - method: POST
    path: "/members/{id}/record-payment"
    description: "Record a payment against the member's account"
    roles: [BillingAdmin]
    code: 200
    input: [amount_cents]
    output: Member
    side_effects: ["paid_cents recomputed", "account_balance_cents recomputed"]
  - method: POST
    path: "/members/{id}/refresh-billing"
    description: "Recompute billing_status from ISSUED invoices vs the logical clock"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "CURRENT->PAST_DUE when an ISSUED invoice has due_at <= clock"
      - "PAST_DUE->SUSPENDED when a past-due invoice remains and due_at + SUSPEND_GRACE_DAYS (30 days) <= clock"
      - "->CURRENT when no ISSUED invoice is past due"

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Add a vehicle for a member"
    roles: [Member, VaultManager]
    code: 201
    input: [member_id, make, model, model_year, vin, fuel_type, declared_value_cents]
    output: Vehicle
    side_effects: ["condition_status=INTAKE_PENDING", "insurance_status=NONE"]
  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles/{id}/coi"
    description: "List a vehicle's COIs (reverse of InsuranceCOI.vehicle_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: InsuranceCOI[]
    side_effects: []
  - method: GET
    path: "/vehicles/{id}/inspections"
    description: "List a vehicle's inspections (reverse of Inspection.vehicle_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/vehicles/{id}/refresh-insurance"
    description: "Expire COIs whose window has passed and recompute insurance_status"
    roles: [VaultManager, ConciergeTech]
    code: 200
    input: []
    output: Vehicle
    side_effects:
      - "each ACTIVE COI with clock >= expiry_at -> EXPIRED"
      - "insurance_status recomputed"
      - "CASCADE: if now LAPSED, that vehicle's SCHEDULED DeliveryJobs -> CANCELLED"

  # ---- InsuranceCOI ----
  - method: POST
    path: "/vehicles/{id}/coi"
    description: "Attach a certificate of insurance to a vehicle"
    roles: [Member, VaultManager]
    code: 201
    input: [policy_number, carrier, coverage_amount_cents, effective_at, expiry_at]
    output: InsuranceCOI
    side_effects: ["status=ACTIVE", "Vehicle.insurance_status recomputed -> ACTIVE if window covers clock"]
  - method: POST
    path: "/coi/{id}/revoke"
    description: "Revoke a COI"
    roles: [VaultManager]
    code: 200
    input: []
    output: InsuranceCOI
    side_effects:
      - "status=REVOKED"
      - "CASCADE link 1: Vehicle.insurance_status -> LAPSED"
      - "CASCADE link 2: vehicle's SCHEDULED DeliveryJobs -> CANCELLED"

  # ---- StorageAgreement ----
  - method: POST
    path: "/storage-agreements"
    description: "Create a storage agreement, reserving a unit (OCC on unit.version)"
    roles: [VaultManager]
    code: 201
    input: [member_id, vehicle_id, unit_id, move_in_at, planned_move_out_at, expected_unit_version]
    output: StorageAgreement
    side_effects:
      - "storage_monthly_fee computed -> monthly_rate_cents snapshot"
      - "records the booking window [move_in_at, planned_move_out_at) on the unit (overlap-checked, half-open)"
      - "increments StorageUnit.version by 1"
      - "unit.status is NOT changed at create (booking only; occupancy happens at move-in)"
  - method: GET
    path: "/storage-agreements/{id}"
    description: "Get a storage agreement"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: []
  - method: GET
    path: "/storage-agreements"
    description: "List/filter agreements (reverse of member_id, vehicle_id, unit_id FKs)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: ["member_id?", "vehicle_id?", "unit_id?", "status?"]
    output: StorageAgreement[]
    side_effects: []
  - method: POST
    path: "/storage-agreements/{id}/move-in"
    description: "Activate an agreement; occupy the unit"
    roles: [VaultManager]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["PENDING -> IN_STORAGE", "unit RESERVED -> OCCUPIED"]
  - method: POST
    path: "/storage-agreements/{id}/check-out"
    description: "Check the vehicle out for use (in/out cycle)"
    roles: [Member, ConciergeTech]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["IN_STORAGE -> CHECKED_OUT"]
  - method: POST
    path: "/storage-agreements/{id}/check-in"
    description: "Return the vehicle to storage (in/out cycle)"
    roles: [Member, ConciergeTech]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["CHECKED_OUT -> IN_STORAGE"]
  - method: POST
    path: "/storage-agreements/{id}/terminate"
    description: "Close an agreement (move-out); releases unit and cascades"
    roles: [VaultManager]
    code: 200
    input: []
    output: StorageAgreement
    side_effects:
      - "-> CLOSED; actual_move_out_at set; days_stored computed"
      - "CASCADE: MonitoringSubscriptions -> CANCELLED; unit OCCUPIED -> AVAILABLE; unit release -> waitlist promotion"
  - method: POST
    path: "/storage-agreements/{id}/cancel"
    description: "Cancel a PENDING agreement, releasing the reservation"
    roles: [Member, VaultManager]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["PENDING -> CANCELLED", "unit RESERVED -> AVAILABLE (re-runs promotion)"]

  # ---- MonitoringSubscription ----
  - method: POST
    path: "/storage-agreements/{id}/monitoring"
    description: "Add a monitoring / battery-tender subscription to an agreement"
    roles: [ConciergeTech, VaultManager]
    code: 201
    input: [monitor_type, monthly_fee_cents]
    output: MonitoringSubscription
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/storage-agreements/{id}/monitoring"
    description: "List monitoring subs on an agreement (reverse of agreement_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: MonitoringSubscription[]
    side_effects: []
  - method: POST
    path: "/monitoring/{id}/record-reading"
    description: "Record a battery-tender voltage reading"
    roles: [ConciergeTech]
    code: 200
    input: [battery_voltage]
    output: MonitoringSubscription
    side_effects: ["last_battery_voltage set", "low_battery_alert = battery_voltage < BATTERY_MIN_VOLTAGE (12.4)"]

  # ---- ServiceOrder ----
  - method: POST
    path: "/service-orders"
    description: "Request a service (detail/start/checkout/checkin/fuel) on an agreement"
    roles: [Member, VaultManager]
    code: 201
    input: [agreement_id, service_type, estimated_labor_hours]
    output: ServiceOrder
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/storage-agreements/{id}/service-orders"
    description: "List service orders on an agreement (reverse of agreement_id)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: ServiceOrder[]
    side_effects: []
  - method: GET
    path: "/service-orders/{id}"
    description: "Get a service order"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []
  - method: POST
    path: "/service-orders/{id}/approve"
    description: "Approve and schedule a service order"
    roles: [VaultManager]
    code: 200
    input: [scheduled_at]
    output: ServiceOrder
    side_effects: ["REQUESTED -> APPROVED", "estimated_cost_cents computed", "Member.held_cents recomputed"]
  - method: POST
    path: "/service-orders/{id}/reject"
    description: "Reject a requested service order"
    roles: [VaultManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["REQUESTED -> REJECTED"]
  - method: POST
    path: "/service-orders/{id}/start"
    description: "Begin work (also resumes an ON_HOLD order)"
    roles: [ConciergeTech]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["APPROVED|ON_HOLD -> IN_PROGRESS (requires agreement IN_STORAGE)"]
  - method: POST
    path: "/service-orders/{id}/hold"
    description: "Pause work in progress"
    roles: [ConciergeTech]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["IN_PROGRESS -> ON_HOLD"]
  - method: POST
    path: "/service-orders/{id}/complete"
    description: "Complete work; compute final cost"
    roles: [ConciergeTech]
    code: 200
    input: [actual_labor_hours, "parts_cents?"]
    output: ServiceOrder
    side_effects: ["IN_PROGRESS -> COMPLETED", "final_cost_cents computed", "Member.held_cents recomputed"]
  - method: POST
    path: "/service-orders/{id}/cancel"
    description: "Cancel a non-started / held service order"
    roles: [Member, VaultManager]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["REQUESTED|APPROVED|ON_HOLD -> CANCELLED", "Member.held_cents recomputed if it was held"]

  # ---- Transporter ----
  - method: POST
    path: "/transporters"
    description: "Create a transporter resource"
    roles: [VaultManager]
    code: 201
    input: [name, "buffer_minutes?"]
    output: Transporter
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/transporters/{id}"
    description: "Get a transporter"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Transporter
    side_effects: []

  # ---- DeliveryJob ----
  - method: POST
    path: "/delivery-jobs"
    description: "Schedule an event delivery (transporter overlap + insurance + coverage checks)"
    roles: [Member, VaultManager]
    code: 201
    input: [vehicle_id, transporter_id, event_name, pickup_at, dropoff_at]
    output: DeliveryJob
    side_effects: ["status=SCHEDULED", "reserves transporter window [pickup_at, dropoff_at] + buffer_minutes"]
  - method: GET
    path: "/delivery-jobs/{id}"
    description: "Get a delivery job"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: []
  - method: GET
    path: "/delivery-jobs"
    description: "List/filter delivery jobs (reverse of vehicle_id, transporter_id FKs)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: ["vehicle_id?", "transporter_id?", "status?"]
    output: DeliveryJob[]
    side_effects: []
  - method: POST
    path: "/delivery-jobs/{id}/dispatch"
    description: "Send the vehicle out to the event"
    roles: [ConciergeTech]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: ["SCHEDULED -> OUT_FOR_EVENT (re-checks insurance ACTIVE)"]
  - method: POST
    path: "/delivery-jobs/{id}/return"
    description: "Return the vehicle to the vault"
    roles: [ConciergeTech]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: ["OUT_FOR_EVENT -> RETURNED", "transporter window released"]
  - method: POST
    path: "/delivery-jobs/{id}/cancel"
    description: "Cancel a delivery job"
    roles: [Member, VaultManager]
    code: 200
    input: []
    output: DeliveryJob
    side_effects: ["SCHEDULED|OUT_FOR_EVENT -> CANCELLED", "transporter window released"]

  # ---- WaitlistEntry ----
  - method: POST
    path: "/waitlist"
    description: "Join the waitlist for a unit class at a facility (only when none available)"
    roles: [Member]
    code: 201
    input: [member_id, facility_id, desired_unit_class]
    output: WaitlistEntry
    side_effects: ["status=WAITING"]
  - method: GET
    path: "/waitlist/{id}"
    description: "Get a waitlist entry"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: GET
    path: "/waitlist"
    description: "List/filter waitlist entries (reverse of member_id, facility_id, offered_unit_id FKs)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: ["member_id?", "facility_id?", "offered_unit_id?", "status?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: POST
    path: "/waitlist/{id}/claim"
    description: "Claim an offered unit before the offer expires"
    roles: [Member]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["OFFERED -> CLAIMED (requires clock < offer_expires_at)"]
  - method: POST
    path: "/waitlist/{id}/cancel"
    description: "Leave the waitlist"
    roles: [Member, VaultManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["WAITING|OFFERED -> CANCELLED", "if OFFERED: unit RESERVED -> AVAILABLE (re-runs promotion)"]
  - method: POST
    path: "/waitlist/{id}/refresh-offer"
    description: "Expire an OFFERED entry whose offer window has passed"
    roles: [VaultManager]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["OFFERED -> EXPIRED when clock >= offer_expires_at; unit RESERVED -> AVAILABLE (re-runs promotion)"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection for a vehicle"
    roles: [ConciergeTech, VaultManager]
    code: 201
    input: [vehicle_id, inspection_type]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/pass"
    description: "Pass an inspection"
    roles: [ConciergeTech, VaultManager]
    code: 200
    input: ["damage_noted?", "findings?"]
    output: Inspection
    side_effects: ["SCHEDULED -> PASSED", "if INTAKE: Vehicle INTAKE_PENDING -> DOCUMENTED"]
  - method: POST
    path: "/inspections/{id}/fail"
    description: "Fail an inspection"
    roles: [ConciergeTech, VaultManager]
    code: 200
    input: ["damage_noted?", "findings?"]
    output: Inspection
    side_effects: ["SCHEDULED -> FAILED", "Vehicle.condition_status -> DAMAGE_HOLD"]

  # ---- Invoice ----
  - method: POST
    path: "/invoices/generate"
    description: "Generate a DRAFT invoice for a member+agreement over a billing period"
    roles: [BillingAdmin]
    code: 201
    input: [member_id, agreement_id, period_start_at, period_end_at, "proration_mode?"]
    output: Invoice
    side_effects: ["invoice_total computed (round-per-line then sum)", "status=DRAFT"]
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List/filter invoices (reverse of member_id, agreement_id FKs)"
    roles: [Member, VaultManager, ConciergeTech, BillingAdmin]
    code: 200
    input: ["member_id?", "agreement_id?", "status?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue a draft invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT -> ISSUED", "due_at set", "Member.charged_cents recomputed"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an issued invoice"
    roles: [Member, BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["ISSUED -> PAID", "records payment of total_cents", "Member.paid_cents recomputed"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a draft or issued invoice (compensating)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT|ISSUED -> VOID", "if ISSUED: Member.charged_cents recomputed (restores pre-issue balance)"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (UTC). Startup default is 2026-05-01T00:00:00Z; before any set_current_utc the clock reads exactly this default and never falls back to wall-clock time."
    roles: [VaultManager, BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601; used by all deadline/expiry/window rules"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or Member acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, or enum value out of range" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: Member.email, Vehicle.vin, or StorageUnit.unit_code within facility" }
  - { id: ERR_FACILITY_UNIT_LIMIT, http: 409, condition: "Creating a unit would exceed the facility's total_units ceiling" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_CROSS_ENTITY_STATE, http: 409, condition: "Cross-entity precondition unmet (e.g., ServiceOrder start requires agreement IN_STORAGE; move-in requires Vehicle DOCUMENTED)" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Move-in blocked because the assigned StorageUnit is currently OCCUPIED by another agreement (status not AVAILABLE/RESERVED)" }
  - { id: ERR_AGREEMENT_HAS_ACTIVE_SERVICE, http: 409, condition: "Check-out or terminate blocked while a ServiceOrder on the agreement is IN_PROGRESS or ON_HOLD" }
  - { id: ERR_UNIT_OVERLAP, http: 409, condition: "StorageUnit occupancy [move_in_at, planned_move_out_at) overlaps an existing non-terminal agreement on the same unit" }
  - { id: ERR_TRANSPORTER_CONFLICT, http: 409, condition: "Transporter already booked for an overlapping [pickup_at, dropoff_at] + buffer_minutes window" }
  - { id: ERR_INSURANCE_LAPSED, http: 409, condition: "Delivery create/dispatch requires vehicle insurance_status == ACTIVE" }
  - { id: ERR_COVERAGE_INSUFFICIENT, http: 409, condition: "Vehicle's ACTIVE COI coverage_amount_cents < declared_value_cents at delivery create" }
  - { id: ERR_MEMBER_SUSPENDED, http: 402, condition: "Member.billing_status == SUSPENDED blocks chargeable operations" }
  - { id: ERR_UNITS_AVAILABLE, http: 409, condition: "Waitlist join rejected because an AVAILABLE unit of the desired class already exists" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Waitlist claim after offer_expires_at (logical clock >= offer_expires_at)" }
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "expected_unit_version does not match the assigned StorageUnit.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A vault customer. Acts on their own vehicles, agreements, COIs, waitlist entries, service/delivery requests, and pays invoices."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /waitlist — join waitlist"
      - "POST /waitlist/{id}/claim — claim an offered unit"
    shared_operations:
      - "POST /vehicles (own), POST /vehicles/{id}/coi (own vehicle)"
      - "POST /storage-agreements/{id}/check-out, .../check-in (own agreement)"
      - "POST /service-orders (own agreement), POST /service-orders/{id}/cancel (own)"
      - "POST /delivery-jobs (own vehicle), POST /delivery-jobs/{id}/cancel (own)"
      - "POST /storage-agreements/{id}/cancel (own), POST /waitlist/{id}/cancel (own)"
      - "POST /invoices/{id}/pay (own invoice)"
      - "All GET read endpoints"

  - name: VaultManager
    description: "Operations manager. Manages facilities, units, agreements lifecycle, approvals, inspections, COI revocation, transporters, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /facilities, POST /facilities/{id}/units, POST /units/{id}/set-service-status"
      - "POST /storage-agreements, .../move-in, .../terminate"
      - "POST /service-orders/{id}/approve, .../reject"
      - "POST /coi/{id}/revoke, POST /transporters"
      - "POST /waitlist/{id}/refresh-offer, POST /_clock/set_current_utc"
    shared_operations:
      - "POST /vehicles, POST /vehicles/{id}/coi, POST /vehicles/{id}/refresh-insurance"
      - "POST /members (with BillingAdmin)"
      - "POST /service-orders, .../cancel; POST /delivery-jobs, .../cancel"
      - "POST /storage-agreements/{id}/cancel; POST /waitlist/{id}/cancel"
      - "POST /storage-agreements/{id}/monitoring; POST /inspections, .../pass, .../fail"
      - "All GET read endpoints"

  - name: ConciergeTech
    description: "Physical operations technician. Executes services, monitoring readings, deliveries dispatch/return, inspections, and in/out."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-orders/{id}/start, .../hold, .../complete"
      - "POST /monitoring/{id}/record-reading"
      - "POST /delivery-jobs/{id}/dispatch, .../return"
    shared_operations:
      - "POST /storage-agreements/{id}/check-out, .../check-in"
      - "POST /storage-agreements/{id}/monitoring"
      - "POST /vehicles/{id}/refresh-insurance"
      - "POST /inspections, .../pass, .../fail"
      - "All GET read endpoints"

  - name: BillingAdmin
    description: "Billing operator. Generates/issues/voids invoices, records payments, refreshes billing status, and manages the clock for billing runs."
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/generate, .../issue, .../void"
      - "POST /members/{id}/record-payment, POST /members/{id}/refresh-billing"
    shared_operations:
      - "POST /members (with VaultManager)"
      - "POST /invoices/{id}/pay; POST /_clock/set_current_utc"
      - "All GET read endpoints"



