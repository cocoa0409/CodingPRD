  - rule_id: priority_pair_validation_conflict
    instances:
      - name: regalia_pay_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=30]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: paying a CANCELLED order
          with a wrong amount violates both; priority 8 (state) must win over
          priority 30 (fiscal). Different category pair than the
          temporal-vs-constraint instance below.
        test_recipe:
          setup:
            - "One graduate with a regalia order (GOWN 1 x 10000 -> subtotal 10000, 10% tier, total_cents == 9000) that has been CANCELLED"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
