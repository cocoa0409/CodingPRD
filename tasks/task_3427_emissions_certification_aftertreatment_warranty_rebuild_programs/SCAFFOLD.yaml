  # ==========================================================================
  # MODULE aftertreatment-specs (emissions system design + dosing calibration)
  # ==========================================================================
  - method: POST
    path: "/emissions/engine-families/{familyId}/aftertreatment-specs"
    description: "Create a new aftertreatment spec version for the family (DRAFT/UNCALIBRATED). Supersedes the current DRAFT/ACTIVE spec. OCC: expected_engine_family_version must equal the family's current version. Family must be in DESIGN or TESTING."
    roles: [CertificationEngineer]
    code: 201
    input: [scr_catalyst_part, dpf_part, doser_part, nox_sensor_count, expected_engine_family_version]
    output: AftertreatmentSpec
    side_effects: ["spec_version = max(existing) + 1; prior spec in {DRAFT, ACTIVE} -> SUPERSEDED; increments EngineFamily.version by 1"]
  - method: GET
    path: "/emissions/aftertreatment-specs/{id}"
    description: "Get an aftertreatment spec"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: AftertreatmentSpec
    side_effects: []
  - method: POST
    path: "/emissions/aftertreatment-specs/{id}/calibrate"
    description: "Run dosing_calibration_check on a DRAFT spec; persists target and deviation; sets calibration_status"
    roles: [CertificationEngineer]
    code: 200
    input: [observed_nox_ppm_avg, observed_def_consumption_g_per_kwh]
    output: AftertreatmentSpec
    side_effects: ["target_def_dosing_g_per_kwh + last_deviation_pct computed; calibration_status = CALIBRATED or UNCALIBRATED; version += 1"]
  - method: POST
    path: "/emissions/aftertreatment-specs/{id}/activate"
    description: "DRAFT -> ACTIVE; requires CALIBRATED and family in DESIGN or TESTING"
    roles: [CertificationEngineer]
    code: 200
    input: []
    output: AftertreatmentSpec
    side_effects: ["version += 1"]

  # ==========================================================================
  # MODULE test-runs (regulatory testing)
  # ==========================================================================
  - method: POST
    path: "/emissions/engine-families/{familyId}/test-runs"
    description: "Schedule a certification test run; family must be TESTING or UNDER_REVIEW; lab half-open window must not overlap"
    roles: [CertificationEngineer]
    code: 201
    input: [test_type, lab_code, scheduled_start, scheduled_end]
    output: CertificationTestRun
    side_effects: ["status SCHEDULED, result UNRECORDED"]
  - method: GET
    path: "/emissions/test-runs/{id}"
    description: "Get a certification test run"
    roles: [PlatformAdmin, CertificationEngineer, RegulatoryOfficer, FleetManager, ServiceAdvisor, WarrantyAdjudicator, RemanPlanner]
    code: 200
    input: []
    output: CertificationTestRun
    side_effects: []
  - method: POST
    path: "/emissions/test-runs/{id}/record-results"
    description: "SCHEDULED -> COMPLETED; computes adjusted emissions and PASS/FAIL result"
    roles: [CertificationEngineer]
    code: 200
    input: [measured_nox_g_per_bhp_hr, measured_pm_g_per_bhp_hr, deterioration_factor]
    output: CertificationTestRun
    side_effects: ["adjusted_emissions calculation runs; result stamped; version += 1"]
  - method: POST
    path: "/emissions/test-runs/{id}/review"
    description: "COMPLETED -> ACCEPTED (decision=ACCEPT, requires result PASS) or -> REJECTED (decision=REJECT)"
    roles: [RegulatoryOfficer]
    code: 200
    input: [decision]
    output: CertificationTestRun
    side_effects: ["reviewed_by_user_id = X-User-ID; version += 1"]
  - method: POST
    path: "/emissions/test-runs/{id}/invalidate"
    description: "ACCEPTED -> INVALIDATED; family's accepted coverage is re-evaluated lazily at submit-review / certify"
    roles: [RegulatoryOfficer]
    code: 200
    input: [reason]
    output: CertificationTestRun
    side_effects: ["invalidated_reason set; version += 1"]

