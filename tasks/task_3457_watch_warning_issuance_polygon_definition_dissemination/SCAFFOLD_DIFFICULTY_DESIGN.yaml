              as: PlatformAdmin
              captures: { e_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${e_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${e_fc}"
              captures: { e_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${e_off}", storm_event_id: "${e_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T12:00:00Z" }
              as: Forecaster
              as_user_id: "${e_fc}"
              captures: { e_w: $.data.id, e_wv: $.data.version }
            - call: "POST /alerts/products/${e_w}/issue"
              payload: { expected_product_version: "${e_wv}" }
              as: Forecaster
              as_user_id: "${e_fc}"
            - call: "POST /alerts/emergency-actions"
              payload: { zone_id: "${e_zone}", product_id: "${e_w}", action_type: "EVACUATION", effective_from: "2026-09-01T09:00:00Z", effective_until: "2026-09-01T10:00:00Z" }
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { ea_1: $.data.id }
            - call: "POST /alerts/emergency-actions"
              payload: { zone_id: "${e_zone}", product_id: "${e_w}", action_type: "SHELTER_IN_PLACE", effective_from: "2026-09-01T10:10:00Z", effective_until: "2026-09-01T11:00:00Z" }
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { ea_2: $.data.id }
          trigger:
            - call: "POST /alerts/emergency-actions/${ea_1}/order"
              payload: {}
              as: EmergencyManager
              as_user_id: "em-1"
            - call: "POST /alerts/products/${e_w}/cancel"
              payload: {}
              as: Forecaster
              as_user_id: "${e_fc}"
            - call: "POST /alerts/emergency-actions/${ea_2}/order"
              payload: {}
              as: EmergencyManager
              as_user_id: "em-1"
              captures: { e_err: $.data.error_id }
          assert:
            - "EA1 ordered successfully while Product was ISSUED (status ORDERED, ordered_at non-null)"
            - "after the product is CANCELLED, ordering EA2 fails 409 with error_id == ERR_INVALID_PRODUCT_STATE"
            - "EmergencyAction.${ea_2} remains RECOMMENDED (the failed order mutates nothing)"

