  - section: errors
    instances:
      - name: error_add_window_closed
        claim_type: error_triggerable
        grounds: ["errors[ERR_ADD_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: confirm_temporal_vs_referential_priority
          rationale: "Triggered and asserted as the winning error of the named §1.8 instance."
      - name: error_drop_window_closed
        claim_type: error_triggerable
        grounds: ["errors[ERR_DROP_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: drop_deadline_exact_second_boundary
          rationale: "Triggered one second past the inclusive drop boundary in the named §1.8 instance."
      - name: error_term_overlap
        claim_type: error_triggerable
        grounds: ["errors[ERR_TERM_OVERLAP]"]
        excluded_because:
          difficulty_instance: term_overlap_half_open_adjacency
          rationale: "Triggered by the 1-day-overlap branch of the named §1.8 instance."
      - name: error_articulation_window_overlap
        claim_type: error_triggerable
        grounds: ["errors[ERR_ARTICULATION_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: articulation_window_closed_interval_conflict
          rationale: "Triggered by the touching-endpoints branch of the named §1.8 instance."
      - name: error_instructor_not_credentialed
        claim_type: error_triggerable
        grounds: ["errors[ERR_INSTRUCTOR_NOT_CREDENTIALED]"]
        excluded_because:
          difficulty_instance: offering_open_blocked_by_credential_state
          rationale: "Triggered while the credential application is UNDER_REVIEW in the named §1.8 instance."
      - name: error_student_not_eligible
        claim_type: error_triggerable
        grounds: ["errors[ERR_STUDENT_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: confirm_blocked_by_student_suspension
          rationale: "Triggered by confirming under a SUSPENDED student in the named §1.8 instance."

