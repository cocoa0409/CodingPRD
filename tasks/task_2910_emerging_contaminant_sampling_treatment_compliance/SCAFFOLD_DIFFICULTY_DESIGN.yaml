              payload: { sample_id: "${s_q5_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 18.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-07-20T08:00:00.000Z" }
