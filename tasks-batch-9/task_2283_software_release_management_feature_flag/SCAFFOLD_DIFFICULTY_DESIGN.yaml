              as: ReleaseManager
              as_user_id: "u-rm-1"
          assert:
            - "risk_budget_consumed_points captured before the freeze == 38 and committed_change_count == 1"
            - "hop 0: ReleaseTrain.${train_id}.phase == FROZEN"
            - "hop 1: Release.${rel_id}.phase == FROZEN"
            - "hop 2: ChangeRequest.${cr_p}.state == DEFERRED"
            - "hop 3: ChangeRequest.${cr_d}.state == BLOCKED_BY_DEPENDENCY"
            - "hop 4: Release.${rel_id}.committed_change_count == 0"
            - "hop 4: Release.${rel_id}.risk_budget_consumed_points == 0"
            - "hop 5: Release.${rel_id}.readiness_score_projected == 95"
            - "ChangeRequest.${cr_d}.risk_score_final == 38 (retained, not cleared)"
            - "ChangeRequest.${cr_d}.dependency_depth == 1"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_precondition_beats_deploy_window_on_duplicate_deployment_start
        grounds:
          - validations[priority=8]
          - validations[priority=31]
          - errors[ERR_DEPLOYMENT_STATE_INVALID]
          - errors[ERR_DEPLOY_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Category pair state (priority 8) versus business_temporal (priority 31): one request violates
          both, and the response must be 409 ERR_DEPLOYMENT_STATE_INVALID, while a sibling deployment
          that violates only the window rule returns 409 ERR_DEPLOY_WINDOW_VIOLATION from the same clock
          position, proving the lower-priority rule is live rather than absent.
        test_recipe:
          setup:
            - "Environment prod-us: window hours 2..6, cooldown_minutes 30, no blackout."
            - "Release 2026.08.1 cut at clock 2026-08-08T00:00:00Z."
            - "Deployment DEP1 window 2026-08-10T02:00Z..04:00Z, already started at 02:05Z so delivery_state IN_PROGRESS."
            - "Deployment DEP2 window 2026-08-10T04:30Z..05:30Z, still SCHEDULED (04:30Z is exactly the end of DEP1's cooldown-extended occupancy, so its creation was accepted)."
            - "Clock advanced to 2026-08-10T05:45:00Z, which is outside both deployment windows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30, requires_compliance_evidence: false }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: $.data.id }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120, max_concurrent_stabilizing: 1 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: $.data.id }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "ALL_AT_ONCE", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep1_id: $.data.id }
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T04:30:00Z", window_end_at: "2026-08-10T05:30:00Z", strategy: "ALL_AT_ONCE", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800 }
              as: SRE
              as_user_id: "u-sre-1"
              captures: { dep2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T02:05:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /deployments/${dep1_id}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T05:45:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /deployments/${dep1_id}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { conflict_error: $.data.error_id }
            - call: "POST /deployments/${dep2_id}/start"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { control_error: $.data.error_id }
          assert:
            - "The first trigger returns HTTP 409 with error_id ERR_DEPLOYMENT_STATE_INVALID"
            - "The first trigger does NOT return ERR_DEPLOY_WINDOW_VIOLATION even though 05:45:00Z is outside 02:00Z..04:00Z"
            - "The second trigger returns HTTP 409 with error_id ERR_DEPLOY_WINDOW_VIOLATION"
            - "Deployment.${dep1_id}.delivery_state == IN_PROGRESS"
            - "Deployment.${dep2_id}.delivery_state == SCHEDULED"
            - "Environment.${env_id}.active_deployment_count == 1"

      - name: self_approval_safety_beats_approval_kind_referential_check
        grounds:
          - validations[priority=11]
          - validations[priority=27]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_APPROVAL_KIND_NOT_REQUIRED]
          - calculations.change_risk_score
        distinguishing_aspect: |
          Category pair business_safety (priority 11) versus business_referential (priority 27) on a
          different entity and endpoint than the other instance in this rule: a CAB approval submitted
          by the change's own author on a MEDIUM change violates both, and must return 403
          ERR_SELF_APPROVAL_FORBIDDEN, while the identical payload from a different user id returns 422
          ERR_APPROVAL_KIND_NOT_REQUIRED.
