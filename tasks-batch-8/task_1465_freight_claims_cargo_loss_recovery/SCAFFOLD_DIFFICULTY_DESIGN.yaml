scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc: two valid interpretations producing different
  # numbers on DIFFERENT entity domains.
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: limitation_of_liability_provisional_vs_final
        grounds:
          - calculations.limitation_of_liability
          - calculations.limitation_of_liability.variants.provisional_at_intake
          - calculations.limitation_of_liability.variants.final_at_assessment
        distinguishing_aspect: |
          Same Claim + Shipment + Carrier inputs produce different
          computed_liability_cents between the provisional variant (preview,
          no negligence step) and the final variant (assessment with
          negligence_flag == SHIPPER_FAULT → 0). Domain: Claim liability.
        test_recipe:
          setup:
            - "Carrier C with liability_model=PER_POUND, per_pound_cap_cents=500 (=$5/lb), max_auto_settle_cents=50000"
            - "Lane L ACTIVE with baseline_claim_ratio_bp=1000"
            - "CarrierLaneAssignment A: carrier=C, lane=L, discount=0%, effective_from=2026-01-01, effective_to=2027-01-01"
            - "Shipment S: declared_value_cents=100000, weight=100 lbs, packages=10, ship=2026-06-01T00:00:00Z, delivery=2026-06-05T00:00:00Z, commodity=GENERAL"
            - "Claim CL on S: claim_type=DAMAGE, claimed_amount_cents=80000"
            - "clock set to 2026-06-10T00:00:00Z (within filing window)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "ACME", legal_name: "Acme Trucking", liability_model: "PER_POUND", per_pound_cap_cents: 500, max_auto_settle_cents: 50000, carmack_acknowledgment_days: 30, carmack_filing_days: 270 }
              as: ClaimsManager
              captures: { cid: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "900", destination_zip3: "941", baseline_claim_ratio_bp: 1000 }
              as: ClaimsManager
              captures: { lid: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${cid}", lane_id: "${lid}", contracted_discount_pct: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-001", carrier_id: "${cid}", lane_id: "${lid}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 100000, total_weight_lbs: 100, package_count: 10, commodity_class: "GENERAL", is_concealed_damage: false }
              as: ClaimsClerk
              captures: { sid: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${sid}", claim_type: "DAMAGE", claimed_amount_cents: 80000 }
              as: ClaimsClerk
              captures: { clid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /freight-claims/claims/${clid}/liability-preview"
              payload: {}
              as: ClaimsAdjuster
              captures: { prov_liability: $.data.computed_liability_cents }
            - call: "POST /freight-claims/claims/${clid}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/bol.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { bol_id: $.data.id }
            - call: "POST /freight-claims/claims/${clid}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/inv.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { inv_id: $.data.id }
            - call: "POST /freight-claims/claims/${clid}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${clid}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${clid}/documents/${bol_id}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${clid}/documents/${inv_id}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${clid}/assessments"
              payload: { negligence_flag: "SHIPPER_FAULT" }
              as: ClaimsAdjuster
              captures: { final_liability: $.data.computed_liability_cents }
          assert:
            - "provisional computed_liability_cents == 50000 (min(80000 basis, 100 lbs * 500 cents) = 50000, no negligence step)"
            - "final computed_liability_cents == 0 (SHIPPER_FAULT zeroes the limit)"
            - "provisional != final for identical shipment/carrier/lane inputs"

      - name: claim_ratio_trailing_12m_vs_lifetime
        grounds:
          - calculations.claim_ratio_analytics
          - calculations.claim_ratio_analytics.variants.trailing_12m
          - calculations.claim_ratio_analytics.variants.lifetime
        distinguishing_aspect: |
          Same Carrier produces different claim_ratio_bp depending on whether
          the input set is filtered to trailing-12-month FILED events or
          lifetime. Domain: Carrier analytics (different from liability domain).
        test_recipe:
          setup:
            - "Carrier C2 ACTIVE, claim_ratio_bp initialized 0"
            - "Lane L2 ACTIVE"
            - "CarrierLaneAssignment A2 effective 2024-01-01 .. 2027-01-01, discount 0"
            - "Shipment S_OLD: ship_date 2025-01-15 (outside trailing 12m window relative to 2026-08-01); Claim CL_OLD FILED then PAID"
            - "Shipment S_NEW: ship_date 2026-06-01; Claim CL_NEW FILED then DECLINED (no payment)"
            - "clock initially 2026-08-01T00:00:00Z for read"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "BETA", legal_name: "Beta Logistics", liability_model: "FULL_VALUE", max_auto_settle_cents: 100000, carmack_acknowledgment_days: 30, carmack_filing_days: 270 }
              as: ClaimsManager
              captures: { c2: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "100", destination_zip3: "200", baseline_claim_ratio_bp: 800 }
              as: ClaimsManager
              captures: { l2: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c2}", lane_id: "${l2}", contracted_discount_pct: 0, effective_from: "2024-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-OLD", carrier_id: "${c2}", lane_id: "${l2}", ship_date: "2025-01-15T00:00:00Z", delivery_date: "2025-01-20T00:00:00Z", declared_value_cents: 50000, total_weight_lbs: 50, package_count: 5, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s_old: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s_old}", claim_type: "LOSS", claimed_amount_cents: 40000 }
              as: ClaimsClerk
              captures: { cl_old: $.data.id }
            - call: "POST /freight-claims/claims/${cl_old}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b1.pdf", captured_at: "2025-01-15T00:00:00Z" }
              as: ClaimsClerk
              captures: { bol_old: $.data.id }
            - call: "POST /freight-claims/claims/${cl_old}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i1.pdf", captured_at: "2025-01-15T00:00:00Z" }
              as: ClaimsClerk
              captures: { inv_old: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl_old}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl_old}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl_old}/documents/${bol_old}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl_old}/documents/${inv_old}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl_old}/assessments"
              payload: { negligence_flag: "CARRIER_NEGLIGENT" }
              as: ClaimsAdjuster
              captures: { asmt_old: $.data.id }
            - call: "POST /freight-claims/claims/${cl_old}/reserves"
              payload: { amount_cents: 40000 }
              as: FinanceController
            - call: "GET /freight-claims/claims/${cl_old}"
              payload: {}
              as: Any
              captures: { cv1: $.data.version }
            - call: "POST /freight-claims/claims/${cl_old}/settlements"
              payload: { amount_cents: 40000, expected_claim_version: "${cv1}" }
              as: ClaimsAdjuster
              captures: { stl_old: $.data.id }
            - call: "POST /freight-claims/claims/${cl_old}/settlements/${stl_old}/accept"
              payload: {}
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-NEW", carrier_id: "${c2}", lane_id: "${l2}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 30000, total_weight_lbs: 30, package_count: 3, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s_new: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s_new}", claim_type: "DAMAGE", claimed_amount_cents: 20000 }
              as: ClaimsClerk
              captures: { cl_new: $.data.id }
            - call: "POST /freight-claims/claims/${cl_new}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b2.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { bol_new: $.data.id }
            - call: "POST /freight-claims/claims/${cl_new}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i2.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { inv_new: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl_new}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl_new}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl_new}/documents/${bol_new}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl_new}/documents/${inv_new}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl_new}/assessments"
              payload: { negligence_flag: "ACT_OF_GOD" }
              as: ClaimsAdjuster
            - call: "GET /freight-claims/claims/${cl_new}"
              payload: {}
              as: Any
              captures: { cv2: $.data.version }
            - call: "POST /freight-claims/claims/${cl_new}/decline"
              payload: { expected_claim_version: "${cv2}" }
              as: ClaimsAdjuster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /freight-claims/analytics/carrier-claim-ratio?carrier_id=${c2}&window=LIFETIME"
              payload: {}
              as: Any
              captures: { ratio_lifetime: "$.data[0].claim_ratio_bp" }
            - call: "GET /freight-claims/analytics/carrier-claim-ratio?carrier_id=${c2}&window=TRAILING_12M"
              payload: {}
              as: Any
              captures: { ratio_12m: "$.data[0].claim_ratio_bp" }
          assert:
            - "lifetime ratio == 5000 bp (1 paid out of 2 filed = 0.5)"
            - "trailing_12m ratio == 0 bp (only CL_NEW in window; not paid)"
            - "two variants produce different claim_ratio_bp for identical carrier"

  # =========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes (a/b/c).
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: limitation_of_liability_tiered_with_lane_discount
        grounds:
          - calculations.limitation_of_liability
          - entities.Carrier.fields.liability_model
          - entities.CarrierLaneAssignment.fields.contracted_discount_pct
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction —
          nested min() over (claimed, declared), then model-specific cap,
          then multiplicative lane discount with floor(). Order of floor
          operations matters; floor(cap*(100-pct)/100) ≠ floor over partials.
        test_recipe:
          setup:
            - "Carrier C3: RELEASED_RATE, released_rate_cents_per_lb=250"
            - "Lane L3"
            - "Assignment A3: discount 15%, effective 2026-01-01..2027-01-01"
            - "Shipment S3: declared_value=100000, weight=80 lbs, packages=8"
            - "Claim CL3: claimed=90000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "RLSR", legal_name: "ReleasedRate Inc", liability_model: "RELEASED_RATE", released_rate_cents_per_lb: 250, max_auto_settle_cents: 50000, carmack_acknowledgment_days: 30, carmack_filing_days: 270 }
              as: ClaimsManager
              captures: { c3: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "300", destination_zip3: "400", baseline_claim_ratio_bp: 1200 }
              as: ClaimsManager
              captures: { l3: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c3}", lane_id: "${l3}", contracted_discount_pct: 15, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-RR", carrier_id: "${c3}", lane_id: "${l3}", ship_date: "2026-06-01T00:00:00Z", delivery_date: "2026-06-05T00:00:00Z", declared_value_cents: 100000, total_weight_lbs: 80, package_count: 8, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s3: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s3}", claim_type: "DAMAGE", claimed_amount_cents: 90000 }
              as: ClaimsClerk
              captures: { cl3: $.data.id }
            - call: "POST /freight-claims/claims/${cl3}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { bol3: $.data.id }
            - call: "POST /freight-claims/claims/${cl3}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-01T00:00:00Z" }
              as: ClaimsClerk
              captures: { inv3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl3}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl3}/acknowledge"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl3}/documents/${bol3}/verify"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /freight-claims/claims/${cl3}/documents/${inv3}/verify"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /freight-claims/claims/${cl3}/assessments"
              payload: { negligence_flag: "CARRIER_NEGLIGENT" }
              as: ClaimsAdjuster
              captures: { asmt3: $.data.computed_liability_cents, limit3: $.data.carrier_limit_cents, basis3: $.data.limitation_basis_cents }
          assert:
            - "limitation_basis_cents == 90000 (min(90000, 100000))"
            - "carrier_limit_cents after model cap == 20000 (min(90000, 80 * 250))"
            - "after 15% lane discount: floor(20000 * 85 / 100) == 17000"
            - "computed_liability_cents == 17000"

      - name: claim_aging_bucket_boundary_precision
        grounds:
          - calculations.claim_aging_buckets
        distinguishing_aspect: |
          Mode (b/c) — boundary rounding: floor((now-filing)/86400) with strict
          bucket edges (30-day-old claim lands in B31_60, NOT B0_30); bucket
          assignment order is well-defined only because evaluation order is
          pinned (age computed first, then bucketed).
        test_recipe:
          setup:
            - "Carrier C4 FULL_VALUE"
            - "Lane L4"
            - "Assignment A4 discount 0"
            - "Three claims filed at ages exactly 29, 30, and 91 days from reading clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/carriers"
              payload: { scac_code: "AGE1", legal_name: "AgeCarrier", liability_model: "FULL_VALUE", max_auto_settle_cents: 100000, carmack_acknowledgment_days: 30, carmack_filing_days: 270 }
              as: ClaimsManager
              captures: { c4: $.data.id }
            - call: "POST /freight-claims/lanes"
              payload: { origin_zip3: "500", destination_zip3: "600", baseline_claim_ratio_bp: 900 }
              as: ClaimsManager
              captures: { l4: $.data.id }
            - call: "POST /freight-claims/carrier-lane-assignments"
              payload: { carrier_id: "${c4}", lane_id: "${l4}", contracted_discount_pct: 0, effective_from: "2025-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ClaimsManager
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-A29", carrier_id: "${c4}", lane_id: "${l4}", ship_date: "2026-06-15T00:00:00Z", delivery_date: "2026-06-20T00:00:00Z", declared_value_cents: 10000, total_weight_lbs: 10, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s_a29: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s_a29}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { cl_a29: $.data.id }
            - call: "POST /freight-claims/claims/${cl_a29}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-15T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl_a29}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-15T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl_a29}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-A30", carrier_id: "${c4}", lane_id: "${l4}", ship_date: "2026-06-10T00:00:00Z", delivery_date: "2026-06-15T00:00:00Z", declared_value_cents: 10000, total_weight_lbs: 10, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s_a30: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s_a30}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { cl_a30: $.data.id }
            - call: "POST /freight-claims/claims/${cl_a30}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-06-10T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl_a30}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-06-10T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl_a30}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /freight-claims/shipments"
              payload: { bol_number: "BOL-A91", carrier_id: "${c4}", lane_id: "${l4}", ship_date: "2026-04-20T00:00:00Z", delivery_date: "2026-04-25T00:00:00Z", declared_value_cents: 10000, total_weight_lbs: 10, package_count: 1, commodity_class: "GENERAL" }
              as: ClaimsClerk
              captures: { s_a91: $.data.id }
            - call: "POST /freight-claims/claims"
              payload: { shipment_id: "${s_a91}", claim_type: "LOSS", claimed_amount_cents: 5000 }
              as: ClaimsClerk
              captures: { cl_a91: $.data.id }
            - call: "POST /freight-claims/claims/${cl_a91}/documents"
              payload: { document_kind: "BOL", storage_uri: "s3://x/b.pdf", captured_at: "2026-04-20T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /freight-claims/claims/${cl_a91}/documents"
              payload: { document_kind: "COMMERCIAL_INVOICE", storage_uri: "s3://x/i.pdf", captured_at: "2026-04-20T00:00:00Z" }
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-claims/claims/${cl_a91}/submit"
              payload: {}
              as: ClaimsClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /freight-claims/analytics/claim-aging"
              payload: {}
              as: Any
              captures: { b0: $.data.B0_30, b31: $.data.B31_60, b61: $.data.B61_90, b91: $.data.B91_PLUS }
          assert:
            - "age of cl_a29 = floor((2026-08-01 - 2026-07-03)/86400) = 29 days -> B0_30"
            - "age of cl_a30 = floor((2026-08-01 - 2026-07-02)/86400) = 30 days -> B31_60 (boundary inclusive of 30)"
            - "age of cl_a91 = floor((2026-08-01 - 2026-05-02)/86400) = 91 days -> B91_PLUS"
            - "B0_30 == 1, B31_60 == 1, B61_90 == 0, B91_PLUS == 1"

  # =========================================================================
  # Rule 3 — non_linear_state_machine on different entities.
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_decline_appeal_cycle
        grounds:
