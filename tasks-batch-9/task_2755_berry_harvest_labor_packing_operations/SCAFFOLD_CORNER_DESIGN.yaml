              payload: { buyer_name: "Buyer V15", buyer_user_id: "buyer-7", variety: "STRAWBERRY", volume_commitment_lbs: 100.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-02" }
