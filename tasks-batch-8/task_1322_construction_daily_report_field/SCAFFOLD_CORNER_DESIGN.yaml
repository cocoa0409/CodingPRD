        distinguishing_aspect: "RECORDABLE close of a LOST_TIME incident without OSHA notify -> ERR_OSHA_NOTIFICATION_REQUIRED; after notify but without linked media -> ERR_INCIDENT_MEDIA_REQUIRED."
        test_recipe:
          setup: ["Report DRAFT; LOST_TIME incident (recordable, deadline exists)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-ER1" }, as: SystemAdmin, captures: { proj: $.data.id } }
