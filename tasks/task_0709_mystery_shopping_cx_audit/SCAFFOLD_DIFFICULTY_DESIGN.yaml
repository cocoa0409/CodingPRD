# =============================================================================
# §1.8 Scaffold Difficulty Design — Mystery Shopping & CX-Audit (Expert)
# 9 rule_ids × 2 instances = 18 instances.
# Every grounds[] resolves to SCAFFOLD.yaml §1.1–§1.6.
# Numeric asserts pre-computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reimbursement_provisional_vs_final_diverges_on_flagged_receipt
        grounds:
          - calculations.reimbursement_amount
          - state_machines.Assignment.IN_FIELD_to_SUBMITTED
          - state_machines.Assignment.SUBMITTED_to_VALIDATED
          - entities.Assignment.fields.reimbursable_cents
        distinguishing_aspect: |
          PROVISIONAL counts the shopper's claimed_out_of_pocket (4000) but FINAL
          counts only APPROVED receipts (3000 after one 1000-receipt is FLAGGED),
          so reimbursable_cents = 6448 at SUBMITTED and 5448 at VALIDATED — a
          cost-accounting variant on the Assignment domain.
        test_recipe:
          setup:
            - "ClientAccount ACTIVE (fee_per_completed_shop_cents=15000)."
            - "Location at lat 40.5 / lng -74.5, RETAIL, ACTIVE."
            - "Shopper home lat 40.0 / lng -74.0, CERTIFIED in RETAIL, reliability 100."
            - "ScenarioScript RETAIL PUBLISHED: required_photo_count=1, receipt_required=true, reimburse_cap_cents=5000, base_fee_cents=2000, weights {greeting:0.3,cleanliness:0.3,service:0.4}, passing_score=70."
            - "ShopWave PUBLISHED, window 2026-06-01..2026-06-30."
            - "Assignment created (due 2026-06-10, travel_distance_km=69.94), accepted, IN_FIELD."
            - "One APPROVED photo; two receipts (3000 APPROVED, 1000 FLAGGED); scorecard exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "Acme Retail", billing_email: "ap@acme.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "Store 1", lat: 40.5, lng: -74.5, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "Retail Greeting", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: true, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 0.3, cleanliness: 0.3, service: 0.4 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "June Wave", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "Sam Shop", email: "sam@x.test", home_lat: 40.0, home_lng: -74.0, tax_id_on_file: true }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-10T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/p1.jpg" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { photo_id: $.data.id }
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "RECEIPT", object_uri: "s3://e/r1.jpg", receipt_amount_cents: 3000 }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { rec_ok_id: $.data.id }
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "RECEIPT", object_uri: "s3://e/r2.jpg", receipt_amount_cents: 1000 }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { rec_bad_id: $.data.id }
            - call: "POST /evidence/${photo_id}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /evidence/${rec_ok_id}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /evidence/${rec_bad_id}/review"
              payload: { decision: "FLAG" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 85, cleanliness: 82, service: 78 } }
              as: Shopper
              as_user_id: "${shopper_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { prov: $.data.reimbursable_cents }
            - call: "POST /assignments/${asg_id}/validate"
              payload: {}
              as: QaValidator
              captures: { fin: $.data.reimbursable_cents }
          assert:
            - "Assignment.${asg_id}.reimbursable_cents == 6448 immediately after submit (PROVISIONAL: min(4000,5000)+2448)"
            - "Assignment.${asg_id}.reimbursable_cents == 5448 after validate (FINAL: min(3000,5000)+2448)"

      - name: shop_score_self_report_vs_audited_diverges_on_flagged_section
        grounds:
          - calculations.shop_score
          - state_machines.ScoreCard.DRAFT_to_AUDITED
          - entities.ScoreCard.fields.estimated_score
          - entities.ScoreCard.fields.audited_score
        distinguishing_aspect: |
          SELF_REPORT weights every section (estimated_score=81) while AUDITED zeroes
          the FLAGGED 'service' section without renormalizing (audited_score=50) — a
          risk/quality-scoring variant on the ScoreCard domain, a different entity
          than reimbursement's Assignment domain.
        test_recipe:
          setup:
            - "Same client/location/script/wave/shopper as instance 1, but the FLAGGED evidence backs the 'service' section."
            - "Assignment IN_FIELD with 1 APPROVED photo, 1 APPROVED receipt (3000); a FLAGGED photo tagged to 'service'; scorecard scores greeting 85, cleanliness 82, service 78."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "Acme2", billing_email: "ap@acme2.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "Store 2", lat: 40.5, lng: -74.5, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "Retail S2", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: true, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 0.3, cleanliness: 0.3, service: 0.4 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "June W2", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "Pat Shop", email: "pat@x.test", home_lat: 40.0, home_lng: -74.0, tax_id_on_file: true }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-10T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/svc.jpg", section_key: "service" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { svc_photo_id: $.data.id }
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "RECEIPT", object_uri: "s3://e/r.jpg", receipt_amount_cents: 3000 }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /evidence/${svc_photo_id}/review"
              payload: { decision: "FLAG" }
              as: QaValidator
            - call: "POST /evidence/${rec_id}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/ok.jpg" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { ok_photo_id: $.data.id }
            - call: "POST /evidence/${ok_photo_id}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 85, cleanliness: 82, service: 78 } }
              as: Shopper
              as_user_id: "${shopper_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "GET /assignments/${asg_id}/scorecard"
              payload: {}
              as: QaValidator
              captures: { est: "$.data[0].estimated_score" }
            - call: "POST /assignments/${asg_id}/validate"
              payload: {}
              as: QaValidator
            - call: "GET /assignments/${asg_id}/scorecard"
              payload: {}
              as: QaValidator
              captures: { aud: "$.data[0].audited_score" }
          assert:
            - "ScoreCard.estimated_score == 81 (0.3*85 + 0.3*82 + 0.4*78 = 81.3 → 81)"
            - "ScoreCard.audited_score == 50 (service section zeroed, no renorm: 0.3*85 + 0.3*82 + 0 = 50.1 → 50)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: shop_score_sum_then_round_pins_rounding_order
        grounds:
          - calculations.shop_score
          - entities.ScenarioScript.fields.weights_json
          - entities.ScoreCard.fields.estimated_score
        distinguishing_aspect: |
          Mode (b) nested rounding: 'sum the weighted sections then round' yields 81
          (81.3→81) whereas 'round per section then sum' yields 82 (26→25→31 etc),
          a 1-point divergence; the scaffold pins sum-then-round explicitly.
        test_recipe:
          setup:
            - "PUBLISHED RETAIL script weights {greeting:0.3,cleanliness:0.3,service:0.4}."
            - "Assignment IN_FIELD with required evidence APPROVED; scorecard greeting 85, cleanliness 82, service 78 (none flagged)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "RoundCo", billing_email: "ap@round.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "RL", lat: 40.5, lng: -74.5, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "Round", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 0.3, cleanliness: 0.3, service: 0.4 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "RW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "Ro Shop", email: "ro@x.test", home_lat: 40.0, home_lng: -74.0, tax_id_on_file: true }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-10T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/p.jpg" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { photo_id: $.data.id }
            - call: "POST /evidence/${photo_id}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 85, cleanliness: 82, service: 78 } }
              as: Shopper
              as_user_id: "${shopper_id}"
          trigger:
            - call: "POST /assignments/${asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "GET /assignments/${asg_id}/scorecard"
              payload: {}
              as: QaValidator
              captures: { est: "$.data[0].estimated_score" }
          assert:
            - "ScoreCard.estimated_score == 81 (sum-then-round of 81.3), NOT 82 (the round-per-section-then-sum trap)"

      - name: shopper_fee_tiered_bonus_nonlinear_on_reliability_tier
        grounds:
          - calculations.shopper_fee
          - entities.Shopper.fields.reliability_score
          - entities.Assignment.fields.shopper_fee_cents
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear tier selection: shopper_fee_cents =
          base + round_half_up(base*bonus_pct) where bonus_pct is a step function of
          reliability_score (≥90→0.20, ≥75→0.10, else 0). At reliability 90 the fee is
          2400; this is a different combinatorial axis (tiered branch) than the
          rounding-order axis above.
        test_recipe:
          setup:
            - "PUBLISHED RETAIL script base_fee_cents=2000."
            - "Shopper CERTIFIED, reliability exactly 90 (started 100, one REJECT cost 10)."
            - "A second VALIDATED-eligible Assignment IN_FIELD with complete evidence and scorecard."
