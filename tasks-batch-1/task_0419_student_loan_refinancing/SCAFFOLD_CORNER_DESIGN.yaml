      - name: pagination_limit_too_large_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors[ERR_PAGINATION_INVALID]
        distinguishing_aspect: "GET /applications with limit 101 (above max 100) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup:
            - "Empty DB except an underwriter actor."
          setup_api_calls: []
          trigger:
            - call: "GET /applications"
              payload: { limit: 101, offset: 0 }
              as: Underwriter
              as_user_id: "uw-corner-15"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAGINATION_INVALID"
            - "HTTP status == 400"

      - name: pagination_negative_offset_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors[ERR_PAGINATION_INVALID]
        distinguishing_aspect: "GET /offers with offset -1 (below 0) returns ERR_PAGINATION_INVALID (400) — a different out-of-range axis than the limit ceiling on a different list endpoint."
        test_recipe:
          setup:
            - "Empty DB except a borrower actor."
          setup_api_calls: []
          trigger:
            - call: "GET /offers"
              payload: { offset: -1 }
              as: Borrower
              as_user_id: "00000000-0000-4000-8000-0000000000cc"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAGINATION_INVALID"
            - "HTTP status == 400"

      - name: payoff_exceeds_principal_boundary
        claim_type: Aggregate validation
        grounds:
          - validations[priority=14]
          - errors[ERR_PAYOFF_EXCEEDS_PRINCIPAL]
        excluded_because:
          difficulty_instance: boundary_precision_check / payoff_exceeds_principal_empty_vs_at_limit
          rationale: "The aggregate payoff-sum boundary (exactly at limit succeeds, one cent over rejects) is the named §1.8 instance."

