              as_user_id: "${l_id}"
              captures: { mem2: "$.data[0].id" }
            - call: "POST /memberships/${mem2}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /bills"
              payload: { household_id: "${hid}", bill_type: "RENT", total_amount_cents: 200000, period_start: "2026-06-01T00:00:00.000Z", period_end: "2026-06-30T00:00:00.000Z" }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /memberships/${mem2}/move-out"
              payload: {}
              as: Roommate
              as_user_id: "${m2_id}"
            - call: "GET /bills/${bill_id}/splits"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
          assert:
            - "BillSplit for M2 (profile_id == ${m2_id}).share_cents == 50000"
            - "BillSplit for M1 (profile_id == ${m1_id}).share_cents == 150000"
            - "sum of BillSplit.share_cents for bill ${bill_id} == 200000"
            - "Bill.${bill_id}.total_amount_cents == 200000"
