    grounds: §1.4 priority 18 rejects a submit whose [issue_date, expiry_date) interval overlaps another VERIFIED_ACTIVE or PENDING_VERIFICATION prescription of the same customer unless supersedes_prescription_id names it; §1.1 Prescription declares the self-referential supersedes_prescription_id.
