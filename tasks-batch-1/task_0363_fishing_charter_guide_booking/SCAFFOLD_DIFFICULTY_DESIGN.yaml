              as: FleetManager
          assert:
            - "Charter.${ch_id}.status == CANCELLED"
            - "Booking.${bk_id}.status == CANCELLED"
            - "AddOnLine.${line_id}.status == VOIDED"

      - name: charter_sail_to_noshow_to_addon_void
        grounds:
          - state_machines.Charter.transitions.SCHEDULED_to_SAILED
          - state_machines.Booking.transitions.RESERVED_to_NO_SHOW
          - state_machines.AddOnLine.transitions.PENDING_FULFILLED_to_VOIDED
        distinguishing_aspect: |
          Depth-2+ chain from a DIFFERENT trigger (sail, not cancel): SAIL mutates an
          unpaid RESERVED booking -> NO_SHOW, and that NO_SHOW itself mutates its
          AddOnLine -> VOIDED. Different originating transition than the cancel cascade.
        test_recipe:
          setup:
            - "Charter SCHEDULED, clock at/after depart; one PAID booking (kept) plus one UNPAID RESERVED booking that carries a PENDING add-on."
