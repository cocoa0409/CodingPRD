            - call: "POST /deals/${deal_id}/close"
              payload: {}
              as: Broker
          assert:
            - "the first trigger call returns HTTP 422 with error_id ERR_LICENSE_NOT_TRANSFERRED"
            - "after the first trigger call Deal.${deal_id}.status == ESCROW_FUNDED and Deal.${deal_id}.closed_at_utc == null"
            - "after the first trigger call EscrowAccount.${escrow_id}.disbursed_to_broker_cents == 0 and EscrowAccount.${escrow_id}.undisbursed_balance_cents == 171000"
            - "LicenseTransfer.${lt_tax_id}.status == APPROVED after the decide call"
