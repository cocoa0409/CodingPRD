  - rule_id: compensating_invariant
    instances:

      - name: quota_tons_are_conserved_across_dispatch_and_its_compensating_cancel
        grounds:
          - calculations.mill_contract_quota_position
          - state_machines.Load.DISPATCHED_to_CANCELLED
          - entities.MillContract.fields.reserved_tons
          - entities.MillContract.fields.delivered_tons
          - entities.MillContract.fields.available_tons
        distinguishing_aspect: |
          Conserved quantity number one is TONS: the invariant
          quota_tons == reserved_tons + delivered_tons + available_tons must hold before the
          dispatch, after the dispatch, and after the compensating cancel, and available_tons
          must return to exactly 500.00 rather than drifting by the reservation.
        test_recipe:
          setup:
            - "MillContract A has quota_tons 500.00 with reserved_tons 0.00, delivered_tons 0.00 and available_tons 500.00 before anything is dispatched"
            - "Tract Section 14 NE is ACTIVE with a COMPLIANT carrier and one truck"
            - "Load 1 of 26.50 estimated tons is DISPATCHED, so the intermediate read shows reserved_tons 26.50 and available_tons 473.50"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
