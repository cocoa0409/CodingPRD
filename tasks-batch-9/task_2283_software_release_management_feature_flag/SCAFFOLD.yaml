scenario: "2283. Software Release Management & Feature Flag Governance (software engineering release office): release train cadence with cut dates, code freeze and stabilization windows, change approval with risk classification, rollback plan and deployment window restrictions, feature flag lifecycle from creation through rollout percentage steps to permanent removal, flag inventory with ownership, expiration dates and stale flag cleanup enforcement, progressive delivery with canary analysis, automated health checks and abort criteria, incident linkage to recent releases with rollback and forward-fix decisions, release notes generation from merged changes with customer-facing filtering, compliance evidence for change control in regulated environments"
domain_name: software-release-management-feature-flag-governance
api_prefix: ""   # flat topology: every collection sits at the API root (/release-trains, /releases, /change-requests, /feature-flags, /flag-rollout-steps, /deployments, /incidents, /release-notes, /evidence-packets, /environments)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  difficulty_level: beyond_expert   # deliberately above the §0.4 Expert band per generation request
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]

  entity_topology: graph
  # graph: ChangeRequest forms a self-referential DAG through ChangeDependency; ChangeFlagLink is a
  # many-to-many junction between ChangeRequest and FeatureFlag; Deployment joins Release x Environment.

  state_machine_shape: cyclic
  # Signature shape is cyclic (FeatureFlag ACTIVE_ROLLING_OUT<->PAUSED, ReleaseTrain ACTIVE<->FROZEN,
  # Release OPEN<->FROZEN, ChangeRequest RISK_CLASSIFIED<->DEFERRED). Two further non-linear shapes
  # coexist: ChangeRequest is branching fork-join (risk-class fork -> approval join) and Deployment
  # carries two parallel state dimensions (delivery_state x verification_state).

  relationship_patterns:
    - one_to_many          # ReleaseTrain->Release, Release->ChangeRequest, Deployment->HealthSignal
    - many_to_many         # ChangeFlagLink (ChangeRequest x FeatureFlag)
    - self_referential     # ChangeDependency (ChangeRequest x ChangeRequest, DAG, cycle detection)
    - cross_aggregate      # Deployment->Environment, Incident->Release, FlagRolloutStep->Deployment

  role_model: segregation_of_duties
  # A change's author may not approve it; the CAB approver may not be the technical approver;
  # the flag owner is the only actor allowed to move that flag's rollout ladder.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: ReleaseTrain
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label of the release train", constraints: "non-empty, max 80 chars" }
      - { name: cadence_days, type: integer, source: input, description: "Nominal days between cuts on this train", constraints: ">= 1" }
      - { name: code_freeze_lead_hours, type: integer, source: input, description: "Hours before a Release.cut_at at which code freeze begins; drives Release.freeze_at", constraints: ">= 0" }
      - { name: stabilization_hours, type: integer, source: input, description: "Hours after cut_at during which a Release stabilizes; drives Release.stabilization_end_at", constraints: ">= 0" }
      - { name: max_concurrent_stabilizing, type: integer, source: input, default: 1, description: "Maximum number of Releases on this train whose closed stabilization intervals may overlap", constraints: ">= 1" }
      - { name: risk_budget_points, type: integer, source: input, description: "Per-Release ceiling on the sum of risk_score_final over approved changes", constraints: ">= 0" }
      - { name: phase, type: enum, source: computed, default: ACTIVE, description: "Train-level gate: ACTIVE (changes may flow) or FROZEN (code freeze cascaded to all open Releases)", constraints: "one of {ACTIVE, FROZEN}" }
      - { name: frozen_at, type: datetime, source: system, description: "Logical-clock instant of the most recent FREEZE action; null while ACTIVE and never frozen" }
      - { name: freeze_exception_count, type: integer, source: computed, default: 0, description: "Count of Releases on this train with freeze_exception_approved == true" }
      - { name: open_release_count, type: integer, source: computed, default: 0, description: "Count of Releases on this train with phase IN {OPEN, FROZEN}" }

  - name: Environment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Environment identifier, unique across environments", constraints: "non-empty, unique" }
      - { name: tier, type: enum, source: input, description: "Deployment tier", constraints: "one of {DEV, STAGING, PROD}" }
      - { name: cooldown_minutes, type: integer, source: input, default: 30, description: "Minutes of mandatory quiet buffer appended to every occupied deployment window on this environment", constraints: ">= 0" }
      - { name: deploy_window_start_hour_utc, type: integer, source: input, description: "First UTC hour of the daily permitted deployment window (inclusive)", constraints: "0..23" }
      - { name: deploy_window_end_hour_utc, type: integer, source: input, description: "Exclusive UTC hour bound of the daily permitted deployment window", constraints: "1..24 and > deploy_window_start_hour_utc" }
      - { name: blackout_start_at, type: datetime, source: input, description: "Inclusive start of a change-blackout interval; null when no blackout is configured" }
      - { name: blackout_end_at, type: datetime, source: input, description: "Inclusive end of the change-blackout interval; null when no blackout is configured" }
      - { name: requires_compliance_evidence, type: boolean, source: input, default: false, description: "true marks the environment as regulated: a SEALED ComplianceEvidencePacket is required before its Release may be marked RELEASED" }
      - { name: active_deployment_count, type: integer, source: computed, default: 0, description: "Count of Deployments on this environment with delivery_state IN {IN_PROGRESS, CANARY_SOAK}" }
      - { name: last_deployment_end_at, type: datetime, source: computed, description: "window_end_at of the latest-created Deployment on this environment with delivery_state NOT IN {ABORTED, ROLLED_BACK}; null when none exists" }

  - name: Release
    parent: ReleaseTrain
    common_fields: true
    fields:
      - { name: release_train_id, type: string, source: input, description: "FK -> ReleaseTrain.id; the train this release rides" }
      - { name: version_label, type: string, source: input, description: "Release label, unique within release_train_id", constraints: "non-empty, unique per train" }
      - { name: cut_at, type: datetime, source: input, description: "Scheduled cut instant of this release" }
      - { name: freeze_at, type: datetime, source: computed, description: "cut_at minus ReleaseTrain.code_freeze_lead_hours" }
      - { name: stabilization_end_at, type: datetime, source: computed, description: "cut_at plus ReleaseTrain.stabilization_hours; closed upper bound of the stabilization interval" }
      - { name: phase, type: enum, source: computed, default: OPEN, description: "Release lifecycle phase", constraints: "one of {OPEN, FROZEN, CUT, STABILIZING, RELEASED, ROLLED_BACK}" }
      - { name: committed_change_count, type: integer, source: computed, default: 0, description: "Count of ChangeRequests on this release with state IN {APPROVED, MERGED, DEPLOYED}" }
      - { name: verified_change_count, type: integer, source: computed, default: 0, description: "Count of ChangeRequests on this release with deployment_verified == true" }
      - { name: risk_budget_consumed_points, type: integer, source: computed, default: 0, description: "Sum of risk_score_final over ChangeRequests on this release with state IN {APPROVED, MERGED, DEPLOYED}" }
      - { name: readiness_score_projected, type: number, source: computed, default: 100, description: "Forward-looking readiness (calculations.release_readiness_score variant projected)" }
      - { name: readiness_score_attested, type: number, source: computed, description: "Chronological readiness pinned at cut (calculations.release_readiness_score variant attested); null before cut" }
      - { name: rollback_plan_confirmed, type: boolean, source: computed, default: true, description: "true when every ChangeRequest on this release with state IN {MERGED, DEPLOYED} and risk_class IN {HIGH, CRITICAL} has rollback_plan non-null and rollback_tested == true" }
      - { name: evidence_packet_required, type: boolean, source: computed, default: false, description: "true when at least one Deployment of this release targets an Environment with requires_compliance_evidence == true" }
      - { name: freeze_exception_approved, type: boolean, source: computed, default: false, description: "true once a ComplianceOfficer granted a freeze exception permitting merges after freeze_at" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant at which phase became RELEASED; null otherwise" }
      - { name: rolled_back_at, type: datetime, source: system, description: "Logical-clock instant at which phase became ROLLED_BACK; null otherwise" }

  - name: ChangeRequest
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id; the release this change targets" }
      - { name: title, type: string, source: input, description: "Short change title", constraints: "non-empty, max 120 chars" }
      - { name: summary_internal, type: string, source: input, description: "Internal-facing change summary", constraints: "non-empty" }
      - { name: summary_customer_facing, type: string, source: input, description: "Customer-facing copy used by CUSTOMER release notes; null when not written" }
      - { name: customer_facing, type: boolean, source: input, default: false, description: "Author's declaration that this change is customer visible" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the Engineer that created the change; frozen at creation" }
      - { name: lines_changed, type: integer, source: input, description: "Diff size in lines, an input to the risk score", constraints: ">= 0" }
      - { name: touched_subsystem_count, type: integer, source: input, description: "Number of subsystems touched, an input to the risk score", constraints: ">= 0" }
      - { name: has_schema_migration, type: boolean, source: input, default: false, description: "true when the change carries a schema migration" }
      - { name: declared_blast_radius, type: enum, source: input, description: "Author-declared blast radius", constraints: "one of {INTERNAL, SINGLE_TENANT, GLOBAL}" }
      - { name: rollback_plan, type: string, source: input, description: "Prose rollback plan; null when the author supplied none" }
      - { name: rollback_tested, type: boolean, source: input, default: false, description: "true when the rollback plan was rehearsed" }
      - { name: risk_score_preliminary, type: number, source: computed, description: "calculations.change_risk_score variant preliminary, pinned at submit; null while DRAFT" }
      - { name: risk_score_final, type: number, source: computed, description: "calculations.change_risk_score variant final, pinned on entry to APPROVED; null before approval" }
      - { name: risk_class, type: enum, source: computed, description: "Tier of risk_score_preliminary", constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}; null while DRAFT" }
      - { name: state, type: enum, source: computed, default: DRAFT, description: "Change-control lifecycle state", constraints: "one of {DRAFT, RISK_CLASSIFIED, CAB_REVIEW, APPROVED, MERGED, DEPLOYED, DEFERRED, BLOCKED_BY_DEPENDENCY, WITHDRAWN, REJECTED}" }
      - { name: approval_technical_count, type: integer, source: computed, default: 0, description: "Count of Approvals on this change with kind TECHNICAL and decision APPROVE" }
      - { name: approval_compliance_count, type: integer, source: computed, default: 0, description: "Count of Approvals on this change with kind COMPLIANCE and decision APPROVE" }
      - { name: approval_cab_count, type: integer, source: computed, default: 0, description: "Count of Approvals on this change with kind CAB and decision APPROVE" }
      - { name: dependency_depth, type: integer, source: computed, default: 0, description: "Longest prerequisite chain length reachable from this change through ChangeDependency edges (0 when it has no prerequisites)" }
      - { name: merged_at, type: datetime, source: system, description: "Logical-clock instant of the merge; null until MERGED" }
      - { name: deployment_verified, type: boolean, source: computed, default: false, description: "true while this change is DEPLOYED via a release that has not been rolled back" }

  - name: ChangeDependency
    parent: ChangeRequest
    common_fields: false
    fields:
      - { name: from_change_id, type: string, source: input, description: "FK -> ChangeRequest.id; the dependent change that must land after its prerequisite" }
      - { name: to_change_id, type: string, source: input, description: "FK -> ChangeRequest.id; the prerequisite change that must land first" }
      - { name: note, type: string, source: input, description: "Optional rationale for the edge; null when omitted" }

  - name: Approval
    parent: ChangeRequest
    common_fields: false
    fields:
      - { name: change_request_id, type: string, source: input, description: "FK -> ChangeRequest.id; the change being decided" }
      - { name: kind, type: enum, source: input, description: "Approval lane", constraints: "one of {TECHNICAL, COMPLIANCE, CAB}" }
      - { name: decision, type: enum, source: input, description: "Decision recorded in this lane", constraints: "one of {APPROVE, REJECT}" }
      - { name: comment, type: string, source: input, description: "Reviewer note; null when omitted" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the deciding actor; compared against ChangeRequest.author_user_id for segregation of duties" }
      - { name: pinned_risk_score, type: number, source: system, description: "ChangeRequest.risk_score_preliminary observed at the instant this approval was recorded" }
      - { name: pinned_change_version, type: integer, source: system, description: "ChangeRequest.version observed at the instant this approval was recorded" }

  - name: FeatureFlag
    parent: null
    common_fields: true
    fields:
      - { name: key, type: string, source: input, description: "Flag key, unique across all flags", constraints: "non-empty, unique" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque user id accountable for this flag; only this id may drive its rollout ladder", constraints: "non-empty" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Engineer that created the flag" }
      - { name: expires_at, type: datetime, source: input, description: "Contractual removal deadline used by the staleness calculation" }
      - { name: permanent, type: boolean, source: input, default: false, description: "true marks an operational kill-switch exempt from staleness debt and cleanup enforcement" }
      - { name: state, type: enum, source: computed, default: DRAFT, description: "Rollout lifecycle dimension", constraints: "one of {DRAFT, ACTIVE_ROLLING_OUT, PAUSED, FULLY_ROLLED_OUT, ARCHIVED}" }
      - { name: cleanup_state, type: enum, source: computed, default: COMPLIANT, description: "Hygiene dimension, evolving independently of state", constraints: "one of {COMPLIANT, WARNING, OVERDUE, ENFORCED}" }
      - { name: current_exposure_pct, type: number, source: computed, default: 0, description: "Percentage of traffic currently exposed; equals the largest target_pct among this flag's FlagRolloutSteps with state APPLIED, else 0" }
      - { name: applied_step_count, type: integer, source: computed, default: 0, description: "Count of this flag's FlagRolloutSteps with state APPLIED" }
      - { name: kill_switch_engaged, type: boolean, source: computed, default: false, description: "true when an abort, a release rollback, or cleanup enforcement forced this flag to PAUSED" }
      - { name: stale_debt_points, type: number, source: computed, default: 0, description: "calculations.flag_stale_debt output; refreshed by the cleanup sweep and on every step apply" }
      - { name: last_sweep_at, type: datetime, source: system, description: "Logical-clock instant of the last cleanup sweep that evaluated this flag; null before the first sweep" }
      - { name: archived_at, type: datetime, source: system, description: "Logical-clock instant of permanent removal; null until ARCHIVED" }

  - name: ChangeFlagLink
    parent: null
    common_fields: false
    fields:
      - { name: change_request_id, type: string, source: input, description: "FK -> ChangeRequest.id; the change guarded by the flag" }
      - { name: feature_flag_id, type: string, source: input, description: "FK -> FeatureFlag.id; the guarding flag" }
      - { name: guard_kind, type: enum, source: input, description: "How much of the change the flag guards", constraints: "one of {GATES_ENTIRE_CHANGE, PARTIAL}" }

  - name: FlagRolloutStep
    parent: FeatureFlag
    common_fields: true
    fields:
      - { name: feature_flag_id, type: string, source: input, description: "FK -> FeatureFlag.id; the flag whose exposure this step advances" }
      - { name: deployment_id, type: string, source: input, description: "FK -> Deployment.id; the canary deployment whose health gates this step; null for an ungated step" }
      - { name: step_index, type: integer, source: computed, description: "1-based position of this step on its flag, assigned as (count of the flag's steps with state NOT IN {VOIDED}) + 1 at creation" }
      - { name: target_pct, type: number, source: input, description: "Exposure percentage this step drives the flag to", constraints: "0 < target_pct <= 100" }
      - { name: soak_minutes, type: integer, source: input, description: "Minutes the step must soak before it may be applied", constraints: ">= 0" }
      - { name: state, type: enum, source: computed, default: PLANNED, description: "Step lifecycle", constraints: "one of {PLANNED, SOAKING, APPLIED, ABORTED, VOIDED}" }
      - { name: previous_exposure_pct, type: number, source: system, description: "FeatureFlag.current_exposure_pct captured when soak started; restored verbatim on abort; null while PLANNED" }
      - { name: soak_started_at, type: datetime, source: system, description: "Logical-clock instant soak began; null while PLANNED" }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock instant the step was applied; null unless APPLIED" }

  - name: Deployment
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id; the release being deployed" }
      - { name: environment_id, type: string, source: input, description: "FK -> Environment.id; the target environment" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the reserved deployment window" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the reserved deployment window", constraints: "> window_start_at" }
      - { name: strategy, type: enum, source: input, description: "Delivery strategy", constraints: "one of {CANARY, ALL_AT_ONCE, BLUE_GREEN}" }
      - { name: canary_pct, type: number, source: input, default: 5, description: "Share of traffic on the canary fleet", constraints: "0 < canary_pct <= 100" }
      - { name: abort_error_rate_pct, type: number, source: input, description: "Abort criterion: canary error rate at or above this value aborts the deployment", constraints: "> 0" }
      - { name: abort_latency_p95_ms, type: integer, source: input, description: "Abort criterion: canary p95 latency at or above this value aborts the deployment", constraints: "> 0" }
      - { name: min_sample_count, type: integer, source: input, default: 20, description: "Minimum canary request count in an evaluation window below which the verdict is INCONCLUSIVE", constraints: ">= 0" }
      - { name: delivery_state, type: enum, source: computed, default: SCHEDULED, description: "Delivery dimension", constraints: "one of {SCHEDULED, IN_PROGRESS, CANARY_SOAK, COMPLETED, ABORTED, ROLLED_BACK}" }
      - { name: verification_state, type: enum, source: computed, default: PENDING, description: "Health-verification dimension, evolving independently of delivery_state", constraints: "one of {PENDING, PASSING, FAILING, INCONCLUSIVE, WAIVED}" }
      - { name: health_score, type: number, source: computed, default: 0, description: "weighted_health_score of the latest-created CanaryEvaluation on this deployment; 0 before the first evaluation" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant delivery_state became COMPLETED; null otherwise" }
      - { name: rolled_back_at, type: datetime, source: system, description: "Logical-clock instant delivery_state became ROLLED_BACK; null otherwise" }

  - name: CanaryEvaluation
    parent: Deployment
    common_fields: false
    fields:
      - { name: deployment_id, type: string, source: input, description: "FK -> Deployment.id; the deployment under analysis" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the analysis window over HealthSignal.observed_at" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the analysis window over HealthSignal.observed_at", constraints: "> window_start_at" }
      - { name: sample_count, type: integer, source: computed, description: "Sum of HealthSignal.request_count for cohort CANARY inside the half-open window" }
      - { name: error_rate_pct_rounded, type: number, source: computed, description: "Request-weighted mean of per-signal rounded error rates (calculations.canary_health_verdict); 0 when INCONCLUSIVE" }
      - { name: latency_p95_ms, type: integer, source: computed, description: "Maximum HealthSignal.latency_p95_ms for cohort CANARY inside the window; 0 when no samples" }
      - { name: weighted_health_score, type: number, source: computed, description: "0.6/0.4 weighted health score; 0 when INCONCLUSIVE" }
      - { name: verdict, type: enum, source: computed, description: "Analysis outcome", constraints: "one of {PASS, FAIL, INCONCLUSIVE}" }
      - { name: abort_triggered, type: boolean, source: computed, description: "true when an abort criterion was met, which aborts the deployment" }

  - name: HealthSignal
    parent: Deployment
    common_fields: false
    fields:
      - { name: deployment_id, type: string, source: input, description: "FK -> Deployment.id; the deployment the sample belongs to" }
      - { name: observed_at, type: datetime, source: input, description: "Observation instant used for window membership" }
      - { name: cohort, type: enum, source: input, description: "Fleet the sample came from; only CANARY samples enter canary analysis", constraints: "one of {CANARY, BASELINE}" }
      - { name: request_count, type: integer, source: input, description: "Requests observed in the sample", constraints: ">= 1" }
      - { name: error_count, type: integer, source: input, description: "Errored requests in the sample", constraints: ">= 0 and <= request_count" }
      - { name: latency_p95_ms, type: integer, source: input, description: "p95 latency of the sample in milliseconds", constraints: ">= 0" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Incident title", constraints: "non-empty" }
      - { name: severity, type: enum, source: input, description: "Incident severity", constraints: "one of {SEV1, SEV2, SEV3, SEV4}" }
      - { name: detected_at, type: datetime, source: input, description: "Detection instant used for release linkage" }
      - { name: release_train_id, type: string, source: input, description: "FK -> ReleaseTrain.id; the train whose recent releases are candidates for linkage" }
      - { name: linked_release_id, type: string, source: computed, description: "FK -> Release.id; release selected by calculations.incident_release_linkage; null when the candidate set is empty" }
      - { name: linked_deployment_id, type: string, source: computed, description: "FK -> Deployment.id; deployment selected by calculations.incident_release_linkage; null when none qualifies" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the reporting actor" }
      - { name: state, type: enum, source: computed, default: OPEN, description: "Incident lifecycle", constraints: "one of {OPEN, DECIDED}" }
      - { name: decision, type: enum, source: computed, description: "Release-office decision", constraints: "one of {ROLLBACK, FORWARD_FIX, NO_ACTION}; null while OPEN" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the decision; null while OPEN" }

  - name: ReleaseNoteDocument
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id; the release the notes describe" }
      - { name: audience, type: enum, source: input, description: "Filtering audience", constraints: "one of {CUSTOMER, INTERNAL}" }
      - { name: state, type: enum, source: computed, default: DRAFT, description: "Document lifecycle", constraints: "one of {DRAFT, PUBLISHED}" }
      - { name: included_change_ids, type: array, source: computed, description: "Ordered ChangeRequest ids selected by calculations.release_note_generation" }
      - { name: entry_count, type: integer, source: computed, default: 0, description: "Length of included_change_ids" }
      - { name: excluded_change_count, type: integer, source: computed, default: 0, description: "Candidate changes filtered out by the audience rule" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock instant of generation" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of publication; null while DRAFT" }

  - name: ComplianceEvidencePacket
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id; the release whose change control is evidenced" }
      - { name: state, type: enum, source: computed, default: DRAFT, description: "Packet lifecycle", constraints: "one of {DRAFT, SEALED, SUPERSEDED}" }
      - { name: base_index, type: number, source: computed, description: "Sum of the weights of satisfied evidence items, before any waiver credit" }
      - { name: waiver_credit_points, type: number, source: computed, default: 0, description: "Capped waiver credit, where the cap tier is selected from base_index" }
      - { name: waiver_count, type: integer, source: computed, default: 0, description: "Number of entries in waivers" }
      - { name: completeness_index, type: number, source: computed, description: "min(100, base_index + waiver_credit_points)" }
      - { name: missing_items, type: array, source: computed, description: "Item codes of unsatisfied, unwaived evidence items" }
      - { name: waivers, type: array, source: computed, description: "Objects { item_code, justification, waived_by_user_id } appended by the waiver endpoint" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock instant of sealing; null unless SEALED" }
      - { name: sealed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer that sealed the packet; null unless SEALED" }

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: ReleaseTrain
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /release-trains/{id}/freeze-state with action FREEZE"
        actor: ReleaseManager
        preconditions:
          - "ReleaseTrain.phase == ACTIVE"
          - "open_release_count >= 1 (at least one Release on the train has phase IN {OPEN, FROZEN})"
        side_effects:
          - "frozen_at = current logical clock; phase = FROZEN; version += 1"
          - "CASCADE HOP 1: every Release on this train with phase == OPEN -> phase = FROZEN (its version += 1)"
          - "CASCADE HOP 2 (caused by hop 1): on each Release that just became FROZEN, every ChangeRequest with state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW} -> state = DEFERRED"
          - "CASCADE HOP 3 (caused by hop 2): for each ChangeRequest that just became DEFERRED, every ChangeDependency with to_change_id == that change is walked and its from_change_id ChangeRequest, when state == APPROVED, -> state = BLOCKED_BY_DEPENDENCY"
          - "CASCADE HOP 4 (caused by hop 3): each change that just left APPROVED decrements its Release.committed_change_count by 1 and subtracts its risk_score_final from Release.risk_budget_consumed_points"
          - "CASCADE HOP 5 (caused by hops 2-4): readiness_score_projected recomputed on every Release touched above (calculations.release_readiness_score variant projected)"
        note: "Hop order is pinned: freeze releases, then defer changes, then block APPROVED dependents, then reconcile counters, then recompute readiness."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /release-trains/{id}/freeze-state with action UNFREEZE"
        actor: ReleaseManager
        preconditions:
          - "ReleaseTrain.phase == FROZEN"
        side_effects:
          - "phase = ACTIVE; frozen_at retained as the historical freeze instant; version += 1"
          - "every Release on this train with phase == FROZEN and cut_at > current logical clock -> phase = OPEN"
          - "on each Release that just returned to OPEN, every ChangeRequest with state == DEFERRED -> state = RISK_CLASSIFIED (compensating the freeze cascade); every ChangeRequest with state == BLOCKED_BY_DEPENDENCY whose prerequisites are all in state NOT IN {DEFERRED, WITHDRAWN, REJECTED} -> state = APPROVED, re-incrementing Release.committed_change_count and re-adding risk_score_final to Release.risk_budget_consumed_points"
          - "readiness_score_projected recomputed on every Release touched above"

  - entity: Release
    initial_state: OPEN
    terminal_states: [ROLLED_BACK]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system event: ReleaseTrain ACTIVE->FROZEN cascade hop 1"
        actor: system
        preconditions: ["Release.phase == OPEN"]
        side_effects: ["phase = FROZEN; version += 1; ReleaseTrain.open_release_count unchanged (FROZEN still counts as open)"]
      - from: FROZEN
        to: OPEN
        trigger: "system event: ReleaseTrain FROZEN->ACTIVE cascade"
        actor: system
        preconditions: ["Release.phase == FROZEN", "Release.cut_at > current logical clock"]
        side_effects: ["phase = OPEN; version += 1"]
      - from: OPEN
        to: CUT
        trigger: "POST /releases/{id}/cut"
        actor: ReleaseManager
        preconditions:
          - "Release.phase IN {OPEN, FROZEN}"
          - "current logical clock >= Release.freeze_at"
          - "count of other Releases on the same train with phase IN {CUT, STABILIZING} whose closed interval [cut_at, stabilization_end_at] intersects this release's closed interval, plus 1, <= ReleaseTrain.max_concurrent_stabilizing"
        side_effects:
          - "every ChangeRequest on this release with state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW} -> state = DEFERRED (pinned to run BEFORE the attested score is computed)"
          - "readiness_score_attested = calculations.release_readiness_score variant attested (pinned, never recomputed afterwards)"
          - "readiness_score_projected recomputed; rollback_plan_confirmed recomputed; phase = CUT; ReleaseTrain.open_release_count decremented by 1; version += 1"
      - from: FROZEN
        to: CUT
        trigger: "POST /releases/{id}/cut"
        actor: ReleaseManager
        preconditions: ["same preconditions as OPEN->CUT"]
        side_effects: ["same side effects as OPEN->CUT"]
      - from: CUT
        to: STABILIZING
        trigger: "system event: first Deployment of this release enters delivery_state IN_PROGRESS"
        actor: system
        preconditions: ["Release.phase == CUT"]
        side_effects: ["phase = STABILIZING; version += 1"]
      - from: STABILIZING
        to: RELEASED
        trigger: "POST /releases/{id}/release"
        actor: ReleaseManager
        preconditions:
          - "Release.phase == STABILIZING"
          - "Release.readiness_score_attested >= 80"
          - "Release.rollback_plan_confirmed == true"
          - "at least one Deployment of this release has delivery_state == COMPLETED on an Environment with tier == PROD"
          - "if that Environment has requires_compliance_evidence == true, a ComplianceEvidencePacket for this release exists with state == SEALED"
        side_effects:
          - "phase = RELEASED; released_at = current logical clock; version += 1"
          - "every ChangeRequest on this release with state == MERGED -> state = DEPLOYED and deployment_verified = true"
          - "verified_change_count = count of ChangeRequests on this release with deployment_verified == true"
      - from: STABILIZING
        to: ROLLED_BACK
        trigger: "system event: Deployment COMPLETED->ROLLED_BACK cascade (incident decision ROLLBACK or POST /deployments/{id}/rollback)"
        actor: system
        preconditions: ["Release.phase IN {STABILIZING, RELEASED}"]
        side_effects: ["see RELEASED->ROLLED_BACK side effects (identical)"]
      - from: RELEASED
        to: ROLLED_BACK
        trigger: "system event: Deployment COMPLETED->ROLLED_BACK cascade (incident decision ROLLBACK or POST /deployments/{id}/rollback)"
        actor: system
        preconditions: ["Release.phase IN {STABILIZING, RELEASED}"]
        side_effects:
          - "phase = ROLLED_BACK; rolled_back_at = current logical clock; version += 1"
          - "CASCADE HOP 3 (caused by the release rollback): every FeatureFlag reachable through ChangeFlagLink from a ChangeRequest of this release with flag state == ACTIVE_ROLLING_OUT -> state = PAUSED, kill_switch_engaged = true"
          - "CASCADE HOP 4 (caused by hop 3): on each flag just paused, every FlagRolloutStep with state == PLANNED -> state = VOIDED, and every FlagRolloutStep with state == SOAKING -> state = ABORTED with FeatureFlag.current_exposure_pct restored to that step's previous_exposure_pct"
          - "every ChangeRequest of this release with state == DEPLOYED keeps state DEPLOYED but sets deployment_verified = false; verified_change_count recomputed to 0"

  - entity: ChangeRequest
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, REJECTED]
    transitions:
      - from: DRAFT
        to: RISK_CLASSIFIED
        trigger: "POST /change-requests/{id}/submit"
        actor: Engineer
        preconditions:
          - "ChangeRequest.state == DRAFT"
          - "X-User-ID == ChangeRequest.author_user_id"
          - "Release.phase IN {OPEN}"
        side_effects:
          - "risk_score_preliminary = calculations.change_risk_score variant preliminary; risk_class = tier of risk_score_preliminary; version += 1"
          - "Release.readiness_score_projected recomputed"
        note: "Fork point. The system immediately auto-transitions out of RISK_CLASSIFIED for the LOW and CRITICAL branches (next two rows)."
      - from: RISK_CLASSIFIED
        to: APPROVED
        trigger: "system event: auto-approval branch taken when risk_class == LOW immediately after submit"
        actor: system
        preconditions: ["risk_class == LOW"]
        side_effects:
          - "risk_score_final = calculations.change_risk_score variant final; no Approval rows are created"
          - "Release.committed_change_count += 1; Release.risk_budget_consumed_points += risk_score_final; Release.readiness_score_projected recomputed"
      - from: RISK_CLASSIFIED
        to: CAB_REVIEW
        trigger: "system event: CAB branch taken when risk_class == CRITICAL immediately after submit"
        actor: system
        preconditions: ["risk_class == CRITICAL"]
        side_effects: ["state = CAB_REVIEW; no budget is consumed yet"]
        note: "MEDIUM and HIGH changes remain in RISK_CLASSIFIED and collect approvals there (third branch)."
      - from: RISK_CLASSIFIED
        to: APPROVED
        trigger: "system event: approval join reached by POST /change-requests/{id}/approvals"
        actor: system
        preconditions:
          - "risk_class == MEDIUM and approval_technical_count >= 1; or risk_class == HIGH and approval_technical_count >= 1 and approval_compliance_count >= 1"
        side_effects:
          - "risk_score_final = calculations.change_risk_score variant final"
          - "Release.committed_change_count += 1; Release.risk_budget_consumed_points += risk_score_final; Release.readiness_score_projected recomputed"
      - from: CAB_REVIEW
        to: APPROVED
        trigger: "system event: approval join reached by POST /change-requests/{id}/approvals"
        actor: system
        preconditions: ["approval_technical_count >= 1 and approval_compliance_count >= 1 and approval_cab_count >= 1"]
        side_effects: ["identical to the RISK_CLASSIFIED->APPROVED join side effects"]
      - from: RISK_CLASSIFIED
        to: REJECTED
        trigger: "POST /change-requests/{id}/approvals with decision REJECT"
        actor: ChangeApprover | ComplianceOfficer
        preconditions: ["ChangeRequest.state IN {RISK_CLASSIFIED, CAB_REVIEW}"]
        side_effects: ["state = REJECTED; Release.readiness_score_projected recomputed"]
      - from: CAB_REVIEW
        to: REJECTED
        trigger: "POST /change-requests/{id}/approvals with decision REJECT"
        actor: ChangeApprover | ComplianceOfficer
        preconditions: ["ChangeRequest.state IN {RISK_CLASSIFIED, CAB_REVIEW}"]
        side_effects: ["state = REJECTED; Release.readiness_score_projected recomputed"]
      - from: APPROVED
        to: MERGED
        trigger: "POST /change-requests/{id}/merge"
        actor: Engineer
        preconditions:
          - "ChangeRequest.state == APPROVED"
          - "X-User-ID == ChangeRequest.author_user_id"
          - "Release.phase == OPEN, or Release.phase IN {FROZEN, CUT} and Release.freeze_exception_approved == true"
          - "current logical clock < Release.freeze_at, or Release.freeze_exception_approved == true"
          - "risk_class IN {HIGH, CRITICAL} implies rollback_plan is non-null and rollback_tested == true"
          - "every ChangeDependency with from_change_id == this change points to a to_change_id whose state IN {MERGED, DEPLOYED}"
          - "Release.risk_budget_consumed_points <= ReleaseTrain.risk_budget_points"
        side_effects:
          - "state = MERGED; merged_at = current logical clock; version += 1"
          - "Release.rollback_plan_confirmed recomputed; Release.readiness_score_projected recomputed"
          - "every ChangeRequest with state == BLOCKED_BY_DEPENDENCY whose full prerequisite set is now in state IN {MERGED, DEPLOYED} -> state = APPROVED, re-incrementing Release.committed_change_count and re-adding its risk_score_final to Release.risk_budget_consumed_points"
      - from: MERGED
        to: DEPLOYED
        trigger: "system event: Release STABILIZING->RELEASED cascade"
        actor: system
        preconditions: ["ChangeRequest.state == MERGED"]
        side_effects: ["state = DEPLOYED; deployment_verified = true; Release.verified_change_count recomputed"]
      - from: RISK_CLASSIFIED
        to: DEFERRED
        trigger: "system event: ReleaseTrain freeze cascade hop 2, or POST /releases/{id}/cut side effect"
        actor: system
        preconditions: ["ChangeRequest.state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW}"]
        side_effects: ["state = DEFERRED; Release.readiness_score_projected recomputed"]
      - from: CAB_REVIEW
        to: DEFERRED
        trigger: "system event: ReleaseTrain freeze cascade hop 2, or POST /releases/{id}/cut side effect"
        actor: system
        preconditions: ["ChangeRequest.state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW}"]
        side_effects: ["state = DEFERRED; Release.readiness_score_projected recomputed"]
      - from: DRAFT
        to: DEFERRED
        trigger: "system event: ReleaseTrain freeze cascade hop 2, or POST /releases/{id}/cut side effect"
        actor: system
        preconditions: ["ChangeRequest.state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW}"]
        side_effects: ["state = DEFERRED; Release.readiness_score_projected recomputed"]
      - from: DEFERRED
        to: RISK_CLASSIFIED
        trigger: "system event: ReleaseTrain FROZEN->ACTIVE cascade"
        actor: system
        preconditions: ["ChangeRequest.state == DEFERRED", "owning Release.phase == OPEN"]
        side_effects: ["state = RISK_CLASSIFIED; Release.readiness_score_projected recomputed"]
        note: "Completes the DEFERRED cycle: RISK_CLASSIFIED -> DEFERRED -> RISK_CLASSIFIED."
      - from: APPROVED
        to: BLOCKED_BY_DEPENDENCY
        trigger: "system event: ReleaseTrain freeze cascade hop 3, or POST /change-requests/{id}/withdraw of a prerequisite"
        actor: system
        preconditions: ["ChangeRequest.state == APPROVED", "some prerequisite reached state IN {DEFERRED, WITHDRAWN, REJECTED}"]
        side_effects:
          - "state = BLOCKED_BY_DEPENDENCY"
          - "Release.committed_change_count -= 1; Release.risk_budget_consumed_points -= risk_score_final; Release.readiness_score_projected recomputed"
      - from: BLOCKED_BY_DEPENDENCY
        to: APPROVED
        trigger: "system event: prerequisite reached MERGED (POST /change-requests/{id}/merge) or ReleaseTrain FROZEN->ACTIVE cascade"
        actor: system
        preconditions: ["every prerequisite is in state IN {MERGED, DEPLOYED}, or (unfreeze path) no prerequisite is in state IN {DEFERRED, WITHDRAWN, REJECTED}"]
        side_effects:
          - "state = APPROVED"
          - "Release.committed_change_count += 1; Release.risk_budget_consumed_points += risk_score_final; Release.readiness_score_projected recomputed"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /change-requests/{id}/withdraw"
        actor: Engineer
        preconditions: ["ChangeRequest.state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW, APPROVED, BLOCKED_BY_DEPENDENCY, DEFERRED}", "X-User-ID == ChangeRequest.author_user_id"]
        side_effects: ["state = WITHDRAWN; Release.readiness_score_projected recomputed"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /change-requests/{id}/withdraw"
        actor: Engineer
        preconditions: ["ChangeRequest.state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW, APPROVED, BLOCKED_BY_DEPENDENCY, DEFERRED}", "X-User-ID == ChangeRequest.author_user_id"]
        side_effects:
          - "state = WITHDRAWN; version += 1"
          - "COMPENSATION: Release.committed_change_count -= 1 and Release.risk_budget_consumed_points -= risk_score_final, restoring both quantities to their pre-approval values"
          - "every ChangeRequest with state == APPROVED that depends on this change -> state = BLOCKED_BY_DEPENDENCY (with its own counter decrements)"
          - "Release.readiness_score_projected recomputed"
      - from: RISK_CLASSIFIED
        to: WITHDRAWN
        trigger: "POST /change-requests/{id}/withdraw"
        actor: Engineer
        preconditions: ["ChangeRequest.state IN {DRAFT, RISK_CLASSIFIED, CAB_REVIEW, APPROVED, BLOCKED_BY_DEPENDENCY, DEFERRED}", "X-User-ID == ChangeRequest.author_user_id"]
        side_effects: ["state = WITHDRAWN; Release.readiness_score_projected recomputed"]

  - entity: FeatureFlag
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE_ROLLING_OUT
        trigger: "system event: first FlagRolloutStep of this flag enters SOAKING (POST /flag-rollout-steps/{id}/start-soak)"
        actor: system
        preconditions: ["FeatureFlag.state == DRAFT"]
        side_effects: ["state = ACTIVE_ROLLING_OUT; version += 1"]
      - from: ACTIVE_ROLLING_OUT
        to: PAUSED
        trigger: "POST /feature-flags/{id}/pause, or system event (canary abort cascade, release rollback cascade hop 3, cleanup sweep enforcement)"
        actor: Engineer | SRE | system
        preconditions: ["FeatureFlag.state == ACTIVE_ROLLING_OUT"]
        side_effects:
          - "state = PAUSED; version += 1; kill_switch_engaged = true when the trigger was a system event, unchanged when the trigger was the manual pause endpoint"
          - "current_exposure_pct is NOT changed by the pause itself (only a step abort restores exposure)"
      - from: PAUSED
        to: ACTIVE_ROLLING_OUT
        trigger: "POST /feature-flags/{id}/resume"
        actor: Engineer
        preconditions:
          - "FeatureFlag.state == PAUSED"
          - "X-User-ID == FeatureFlag.owner_user_id"
          - "FeatureFlag.cleanup_state != ENFORCED"
        side_effects: ["state = ACTIVE_ROLLING_OUT; kill_switch_engaged = false; version += 1"]
        note: "Closes the rollout cycle ACTIVE_ROLLING_OUT -> PAUSED -> ACTIVE_ROLLING_OUT."
      - from: ACTIVE_ROLLING_OUT
        to: FULLY_ROLLED_OUT
        trigger: "system event: a FlagRolloutStep with target_pct == 100 reaches APPLIED"
        actor: system
        preconditions: ["FeatureFlag.state == ACTIVE_ROLLING_OUT"]
        side_effects: ["state = FULLY_ROLLED_OUT; current_exposure_pct = 100; version += 1"]
      - from: FULLY_ROLLED_OUT
        to: ARCHIVED
        trigger: "POST /feature-flags/{id}/archive"
        actor: Engineer
        preconditions:
          - "FeatureFlag.state IN {FULLY_ROLLED_OUT, PAUSED}"
          - "X-User-ID == FeatureFlag.owner_user_id"
          - "every ChangeRequest linked through ChangeFlagLink has state IN {DEPLOYED, WITHDRAWN, REJECTED}"
        side_effects: ["state = ARCHIVED; archived_at = current logical clock; cleanup_state = COMPLIANT; stale_debt_points = 0; every FlagRolloutStep with state == PLANNED -> VOIDED; version += 1"]
      - from: PAUSED
        to: ARCHIVED
        trigger: "POST /feature-flags/{id}/archive"
        actor: Engineer
        preconditions:
          - "FeatureFlag.state IN {FULLY_ROLLED_OUT, PAUSED}"
          - "X-User-ID == FeatureFlag.owner_user_id"
          - "every ChangeRequest linked through ChangeFlagLink has state IN {DEPLOYED, WITHDRAWN, REJECTED}"
        side_effects: ["identical to FULLY_ROLLED_OUT->ARCHIVED side effects"]
    note: "cleanup_state (COMPLIANT/WARNING/OVERDUE/ENFORCED) is a second, parallel state dimension on the same row; it is written only by calculations.flag_stale_debt through POST /flag-cleanup-sweeps and by the ARCHIVED transition, and it never blocks the rollout dimension except through the PAUSED->ACTIVE_ROLLING_OUT precondition."

  - entity: FlagRolloutStep
    initial_state: PLANNED
    terminal_states: [APPLIED, ABORTED, VOIDED]
    transitions:
      - from: PLANNED
        to: SOAKING
        trigger: "POST /flag-rollout-steps/{id}/start-soak"
        actor: Engineer
        preconditions:
          - "FlagRolloutStep.state == PLANNED"
          - "X-User-ID == FeatureFlag.owner_user_id"
          - "FeatureFlag.state IN {DRAFT, ACTIVE_ROLLING_OUT}"
          - "FeatureFlag.cleanup_state != ENFORCED"
          - "no other FlagRolloutStep of this flag has state == SOAKING"
          - "step_index == FeatureFlag.applied_step_count + 1"
          - "every ChangeRequest linked to this flag through ChangeFlagLink has state == DEPLOYED"
          - "if deployment_id is non-null, that Deployment has delivery_state IN {IN_PROGRESS, CANARY_SOAK}"
        side_effects:
          - "state = SOAKING; soak_started_at = current logical clock; previous_exposure_pct = FeatureFlag.current_exposure_pct; version += 1"
          - "FeatureFlag DRAFT -> ACTIVE_ROLLING_OUT when applicable"
      - from: SOAKING
        to: APPLIED
        trigger: "POST /flag-rollout-steps/{id}/apply"
        actor: Engineer
        preconditions:
          - "FlagRolloutStep.state == SOAKING"
          - "X-User-ID == FeatureFlag.owner_user_id"
          - "FeatureFlag.state == ACTIVE_ROLLING_OUT"
          - "current logical clock >= soak_started_at + soak_minutes"
          - "if deployment_id is non-null, that Deployment has verification_state == PASSING"
        side_effects:
          - "state = APPLIED; applied_at = current logical clock; version += 1"
          - "FeatureFlag.current_exposure_pct = target_pct; FeatureFlag.applied_step_count += 1; FeatureFlag.stale_debt_points recomputed"
          - "FeatureFlag ACTIVE_ROLLING_OUT -> FULLY_ROLLED_OUT when target_pct == 100"
      - from: SOAKING
        to: ABORTED
        trigger: "system event: CanaryEvaluation with abort_triggered == true on the step's deployment_id, or Release rollback cascade hop 4, or cleanup sweep enforcement"
        actor: system
        preconditions: ["FlagRolloutStep.state == SOAKING"]
        side_effects:
          - "state = ABORTED; version += 1"
          - "COMPENSATION: FeatureFlag.current_exposure_pct = previous_exposure_pct; FeatureFlag.applied_step_count unchanged"
          - "FeatureFlag ACTIVE_ROLLING_OUT -> PAUSED with kill_switch_engaged = true"
      - from: PLANNED
        to: VOIDED
        trigger: "system event: Release rollback cascade hop 4, cleanup sweep enforcement, or FeatureFlag archive"
        actor: system
        preconditions: ["FlagRolloutStep.state == PLANNED"]
        side_effects: ["state = VOIDED; version += 1; FeatureFlag.current_exposure_pct and applied_step_count unchanged"]

  - entity: Deployment
    initial_state: SCHEDULED
    terminal_states: [ABORTED, ROLLED_BACK]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /deployments/{id}/start"
        actor: SRE
        preconditions:
          - "Deployment.delivery_state == SCHEDULED"
          - "Release.phase IN {CUT, STABILIZING, RELEASED}"
          - "current logical clock >= window_start_at and current logical clock < window_end_at"
          - "Environment blackout interval [blackout_start_at, blackout_end_at] (closed) does not contain the current logical clock"
        side_effects:
          - "delivery_state = IN_PROGRESS; version += 1"
          - "Environment.active_deployment_count += 1"
          - "Release CUT -> STABILIZING when the release is still CUT (bubble up)"
      - from: IN_PROGRESS
        to: CANARY_SOAK
        trigger: "system event: first HealthSignal with cohort == CANARY ingested for this deployment"
        actor: system
        preconditions: ["Deployment.delivery_state == IN_PROGRESS", "Deployment.strategy == CANARY"]
        side_effects: ["delivery_state = CANARY_SOAK; version += 1"]
      - from: CANARY_SOAK
        to: ABORTED
        trigger: "system event: POST /deployments/{id}/canary-evaluations produced abort_triggered == true"
        actor: system
        preconditions: ["Deployment.delivery_state IN {IN_PROGRESS, CANARY_SOAK}"]
        side_effects:
          - "CASCADE HOP 1: delivery_state = ABORTED, verification_state = FAILING, version += 1; Environment.active_deployment_count -= 1"
          - "CASCADE HOP 2 (caused by hop 1): every FlagRolloutStep with deployment_id == this deployment and state == SOAKING -> ABORTED, restoring FeatureFlag.current_exposure_pct to that step's previous_exposure_pct"
          - "CASCADE HOP 3 (caused by hop 2): each such FeatureFlag with state == ACTIVE_ROLLING_OUT -> PAUSED with kill_switch_engaged = true"
          - "CASCADE HOP 4 (caused by hop 3): every ChangeRequest linked to those flags with state == DEPLOYED sets deployment_verified = false, and its Release.verified_change_count is recomputed"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /deployments/{id}/complete"
        actor: SRE
        preconditions:
          - "Deployment.delivery_state IN {IN_PROGRESS, CANARY_SOAK}"
          - "if strategy == CANARY then verification_state IN {PASSING, WAIVED}; otherwise verification_state IN {PENDING, PASSING, WAIVED}"
        side_effects:
          - "delivery_state = COMPLETED; completed_at = current logical clock; version += 1"
          - "Environment.active_deployment_count -= 1; Environment.last_deployment_end_at recomputed"
          - "Release.evidence_packet_required recomputed"
      - from: CANARY_SOAK
        to: COMPLETED
        trigger: "POST /deployments/{id}/complete"
        actor: SRE
        preconditions: ["same preconditions as IN_PROGRESS->COMPLETED"]
        side_effects: ["same side effects as IN_PROGRESS->COMPLETED"]
      - from: COMPLETED
        to: ROLLED_BACK
        trigger: "POST /deployments/{id}/rollback, or system event: Incident decision ROLLBACK cascade hop 1"
        actor: SRE | system
        preconditions: ["Deployment.delivery_state == COMPLETED"]
        side_effects:
          - "delivery_state = ROLLED_BACK; rolled_back_at = current logical clock; version += 1; Environment.last_deployment_end_at recomputed"
          - "CASCADE HOP 2 (caused by hop 1): Release phase IN {STABILIZING, RELEASED} -> ROLLED_BACK, which itself fires the release rollback cascade hops 3 and 4 (flags paused, steps voided/aborted, changes unverified)"
    note: "verification_state is the second, parallel dimension: PENDING -> PASSING | FAILING | INCONCLUSIVE by CanaryEvaluation verdict (PASS/FAIL/INCONCLUSIVE respectively), and PENDING|INCONCLUSIVE -> WAIVED by POST /deployments/{id}/complete with waive_verification == true on a non-PROD environment. delivery_state and verification_state advance independently on the same row."

  - entity: Incident
    initial_state: OPEN
    terminal_states: [DECIDED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "POST /incidents/{id}/decide"
        actor: SRE
        preconditions:
          - "Incident.state == OPEN"
          - "decision == ROLLBACK implies linked_release_id is non-null, the linked Release.phase IN {STABILIZING, RELEASED}, and linked_deployment_id is non-null with that Deployment.delivery_state == COMPLETED"
          - "decision == NO_ACTION implies severity IN {SEV3, SEV4}"
        side_effects:
          - "state = DECIDED; decision recorded; decided_at = current logical clock; version += 1"
          - "decision == ROLLBACK fires CASCADE HOP 1: the linked Deployment COMPLETED -> ROLLED_BACK, whose own cascade rolls the Release back (hop 2), which pauses the release's ACTIVE_ROLLING_OUT flags (hop 3), which voids/aborts their steps and unverifies their changes (hop 4)"
          - "decision == FORWARD_FIX leaves the Release and its Deployments untouched"

  - entity: ReleaseNoteDocument
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /release-notes/{id}/publish"
        actor: ReleaseManager
        preconditions:
          - "ReleaseNoteDocument.state == DRAFT"
          - "entry_count >= 1"
          - "Release.phase IN {CUT, STABILIZING, RELEASED}"
        side_effects: ["state = PUBLISHED; published_at = current logical clock; version += 1; every DRAFT ComplianceEvidencePacket of the same release recomputes base_index, waiver_credit_points and completeness_index"]

  - entity: ComplianceEvidencePacket
    initial_state: DRAFT
    terminal_states: [SEALED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /evidence-packets/{id}/seal"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceEvidencePacket.state == DRAFT"
          - "completeness_index >= 90"
        side_effects: ["state = SEALED; sealed_at = current logical clock; sealed_by_user_id = X-User-ID; version += 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: a newer ComplianceEvidencePacket is created for the same release (POST /releases/{id}/evidence-packets)"
        actor: system
        preconditions: ["ComplianceEvidencePacket.state == DRAFT"]
        side_effects: ["state = SUPERSEDED; version += 1"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: rollout-step-create-stale-flag
    parent_entity: FeatureFlag
    write_endpoint: "POST /feature-flags/{id}/rollout-steps"
    occ_field: "expected_feature_flag_version"
    description: |
      Creating a FlagRolloutStep against a FeatureFlag whose version has advanced
      since the client last observed it is rejected. A newly created step
      legitimately supersedes any still-PLANNED step as the flag's next ladder
      rung (the ladder ceiling in calculations.rollout_step_ladder is derived from
      the flag's exposure at creation time), so a writer holding a stale view of
      the flag would otherwise plan a rung against an obsolete ceiling.
    error_id: ERR_STALE_FLAG_VERSION
    http_status: 412
  - rule_id: evidence-packet-create-stale-release
    parent_entity: Release
    write_endpoint: "POST /releases/{id}/evidence-packets"
    occ_field: "expected_release_version"
    description: |
      Creating a ComplianceEvidencePacket against a Release whose version has
      advanced since the client last observed it is rejected. A new packet
      legitimately supersedes the prior DRAFT packet for the same release, and its
      base_index is computed from the release's approval, freeze and deployment
      facts, so a stale view of the release would seal evidence about a state that
      no longer exists.
    error_id: ERR_STALE_RELEASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: change_risk_score
    trigger: "On POST /change-requests/{id}/submit (variant preliminary, written to ChangeRequest.risk_score_preliminary and risk_class) and on every entry into ChangeRequest state APPROVED (variant final, written to ChangeRequest.risk_score_final)"
    algorithm: weighted_scoring
    formula: |
      size_points        = min(30, ceil(lines_changed / 100) * 5)
      spread_points      = min(20, touched_subsystem_count * 4)
      migration_points   = 25 if has_schema_migration else 0
      blast_points       = BLAST_POINTS[declared_blast_radius]
      dependency_points  = min(15, DEPTH_INPUT * 5)
      raw_points         = size_points + spread_points + migration_points + blast_points + dependency_points

      rollback_credit    = -10 if (rollback_plan is not null and rollback_tested == true)
                           else -5 if (rollback_plan is not null)
                           else 0
      flag_credit        = -15 if EXISTS ChangeFlagLink(change) with guard_kind == GATES_ENTIRE_CHANGE
                                  AND that FeatureFlag.state IN CREDIT_STATES
                           else -5 if EXISTS ChangeFlagLink(change) with guard_kind == PARTIAL
                                  AND that FeatureFlag.state IN CREDIT_STATES
                           else 0
      score              = max(0, min(100, raw_points + rollback_credit + flag_credit))

      risk_class         = LOW      if score < 25
                           MEDIUM   if 25 <= score < 50
                           HIGH     if 50 <= score < 70
                           CRITICAL if score >= 70
      # Evaluation order is pinned: raw_points first, then credits, then clamp, then tier selection.
      # When several ChangeFlagLinks qualify, the largest credit magnitude wins (GATES_ENTIRE_CHANGE over PARTIAL).
    input_set: "The ChangeRequest's own input fields, plus its ChangeFlagLink rows joined to FeatureFlag.state, plus DEPTH_INPUT as defined per variant."
    constants:
      BLAST_POINTS: { INTERNAL: 0, SINGLE_TENANT: 10, GLOBAL: 20 }
      CREDIT_STATES: [DRAFT, ACTIVE_ROLLING_OUT, FULLY_ROLLED_OUT]
      SIZE_POINTS_CAP: 30
      SPREAD_POINTS_CAP: 20
      DEPENDENCY_POINTS_CAP: 15
      LOW_CEILING: 25
      MEDIUM_CEILING: 50
      HIGH_CEILING: 70
      APPROVALS_REQUIRED: { LOW: [], MEDIUM: [TECHNICAL], HIGH: [TECHNICAL, COMPLIANCE], CRITICAL: [TECHNICAL, COMPLIANCE, CAB] }
    precision: "Integer points; no fractional arithmetic. All tier comparisons are inclusive on the lower bound (>=) and exclusive on the upper bound (<)."
    variants:
      - name: preliminary
        when: "Computed once at POST /change-requests/{id}/submit and never recomputed."
        difference: "DEPTH_INPUT = 0 unconditionally — prerequisite edges are treated as unknown at submit time. Flag credit is read from the ChangeFlagLink rows that exist at submit."
      - name: final
        when: "Computed once on entry into state APPROVED (LOW auto-approval branch, the RISK_CLASSIFIED join, or the CAB_REVIEW join) and never recomputed afterwards."
        difference: "DEPTH_INPUT = ChangeRequest.dependency_depth as it stands at approval, so every ChangeDependency edge added after submit raises the score by 5 per depth level (capped at 15). Flag credit ignores flags whose state IS NOT IN CREDIT_STATES (a PAUSED or ARCHIVED guard earns no credit at approval time)."

  - name: release_readiness_score
    trigger: "Variant projected recomputed on every ChangeRequest state transition on the release, on every ChangeFlagLink creation, on flag cleanup_state changes from POST /flag-cleanup-sweeps, and written to Release.readiness_score_projected. Variant attested computed exactly once during POST /releases/{id}/cut (after the auto-defer side effect) and written to Release.readiness_score_attested."
    algorithm: forward_looking
    formula: |
      # --- shared penalty terms over a change set S ---
      penalty(S) = 4 * count(c in S where c.risk_class IN {HIGH, CRITICAL} and c.rollback_tested == false)
                 + 5 * count(c in S where c.state == BLOCKED_BY_DEPENDENCY)
                 + 3 * count(distinct FeatureFlag f linked through ChangeFlagLink to any c in S
                              where f.cleanup_state IN {OVERDUE, ENFORCED})

      # --- variant projected ---
      S_proj  = ChangeRequest[release_id = R] with state IN
                {RISK_CLASSIFIED, CAB_REVIEW, APPROVED, MERGED, DEPLOYED, BLOCKED_BY_DEPENDENCY}
      readiness_score_projected = max(0, 100 - penalty(S_proj))

      # --- variant attested ---
      S_att   = ChangeRequest[release_id = R] with state IN {MERGED, DEPLOYED}
                AND merged_at < Release.freeze_at
      late    = count(ChangeRequest[release_id = R] with state IN {MERGED, DEPLOYED}
                      AND merged_at >= Release.freeze_at)
      unlanded= count(ChangeRequest[release_id = R] with state IN
                      {RISK_CLASSIFIED, CAB_REVIEW, APPROVED, BLOCKED_BY_DEPENDENCY, DEFERRED})
      readiness_score_attested = max(0, 100 - penalty(S_att) - 6 * late - 6 * unlanded)
    input_set: "ChangeRequests of the release filtered by the state sets named above; WITHDRAWN, REJECTED and DRAFT changes never enter either set. Flag penalties count distinct FeatureFlags, not links."
    constants:
      UNTESTED_HIGH_RISK_PENALTY: 4
      BLOCKED_PENALTY: 5
      STALE_FLAG_PENALTY: 3
      NOT_LANDED_BY_FREEZE_PENALTY: 6
      RELEASE_READINESS_FLOOR: 80
    precision: "Integer points, floored at 0. The freeze comparison is strict: merged_at < freeze_at counts as landed on time, merged_at == freeze_at counts as late."
    variants:
      - name: projected
        when: "Continuously, from release creation until it is rolled back."
        difference: "Forward-looking: unapproved-but-live changes (RISK_CLASSIFIED, CAB_REVIEW) are assumed to land and attract NO not-landed penalty, and merge timing is ignored entirely."
      - name: attested
        when: "Pinned once at cut and used as the release gate (>= RELEASE_READINESS_FLOOR)."
        difference: "Chronological: only changes merged strictly before freeze_at count as landed; everything still in flight at cut (now DEFERRED) and everything merged at or after freeze_at each cost 6 points."

  - name: canary_health_verdict
    trigger: "POST /deployments/{id}/canary-evaluations; writes every computed CanaryEvaluation field and then Deployment.verification_state, Deployment.health_score, and (on abort) the Deployment CANARY_SOAK->ABORTED cascade"
    algorithm: aggregation
    formula: |
      rows = HealthSignal[deployment_id = D]
             where cohort == CANARY
               and observed_at >= window_start_at
               and observed_at <  window_end_at          # half-open window
             ordered by observed_at ASC, created_at ASC   # order is irrelevant to the result but pinned for reproducibility

      sample_count = sum(r.request_count for r in rows)

      if sample_count < Deployment.min_sample_count:
          verdict = INCONCLUSIVE; abort_triggered = false
          error_rate_pct_rounded = 0; latency_p95_ms = 0; weighted_health_score = 0
      else:
          # STEP 1 (pinned first): round EACH signal's error rate to 1 decimal, half-up.
          row_rate(r)  = round_half_up(r.error_count / r.request_count * 100, 1)
          # STEP 2: request-weighted mean of the ALREADY ROUNDED per-row rates, then round to 2 decimals.
          error_rate_pct_rounded = round_half_up(
              sum(row_rate(r) * r.request_count for r in rows) / sample_count, 2)
          latency_p95_ms = max(r.latency_p95_ms for r in rows)

          # STEP 3: components at full precision; ONLY the final score is rounded.
          error_component   = max(0, 100 - (error_rate_pct_rounded / Deployment.abort_error_rate_pct) * 60)
          latency_component = max(0, 100 - (latency_p95_ms / Deployment.abort_latency_p95_ms) * 40)
          weighted_health_score = round_half_up(
              ERROR_WEIGHT * error_component + LATENCY_WEIGHT * latency_component, 2)

          abort_triggered = (error_rate_pct_rounded >= Deployment.abort_error_rate_pct)
                            or (latency_p95_ms >= Deployment.abort_latency_p95_ms)
          verdict = FAIL if abort_triggered else PASS

      Deployment.verification_state = PASSING if verdict == PASS
                                      FAILING if verdict == FAIL
                                      INCONCLUSIVE if verdict == INCONCLUSIVE
      Deployment.health_score = weighted_health_score
    input_set: "Only HealthSignal rows of this deployment with cohort == CANARY inside the half-open window; BASELINE rows are excluded from every term, including sample_count."
    constants:
      ERROR_WEIGHT: 0.6
      LATENCY_WEIGHT: 0.4
      ERROR_COMPONENT_SPAN: 60
      LATENCY_COMPONENT_SPAN: 40
      ROW_RATE_DECIMALS: 1
      AGGREGATE_DECIMALS: 2
    precision: "Two-stage rounding, order pinned: per-signal error rate to 1 decimal (round_half_up) BEFORE weighting, aggregate to 2 decimals (round_half_up) AFTER weighting. Summing raw error_count over raw request_count and rounding once at the end is explicitly NOT the specified algorithm and yields a different value."

  - name: flag_stale_debt
    trigger: "POST /flag-cleanup-sweeps for every FeatureFlag with state != ARCHIVED, and on POST /flag-rollout-steps/{id}/apply for the applied step's flag; writes FeatureFlag.stale_debt_points and FeatureFlag.cleanup_state"
    algorithm: threshold
    formula: |
      if permanent == true or state == ARCHIVED:
          stale_debt_points = 0; cleanup_state = COMPLIANT
      else:
          days_past_expiry = floor((now - expires_at) / 86400) if now > expires_at else 0
          exposure_penalty = 20 if (state == PAUSED and current_exposure_pct > 0) else 0
          orphan_penalty   = 15 if count(ChangeFlagLink[feature_flag_id = flag]) == 0 else 0
          stale_debt_points = min(100, days_past_expiry * DEBT_PER_DAY
                                        + exposure_penalty + orphan_penalty)

          cleanup_state = ENFORCED if stale_debt_points >= ENFORCED_THRESHOLD
                          OVERDUE  if stale_debt_points >= OVERDUE_THRESHOLD
                          WARNING  if stale_debt_points > 0
                          WARNING  if (expires_at - now) <= WARNING_LEAD_SECONDS
                          COMPLIANT otherwise
      last_sweep_at = now   # only when written by POST /flag-cleanup-sweeps
    input_set: "The flag's own fields plus the count of its ChangeFlagLink rows; `now` is the logical clock (default 2026-08-01T00:00:00Z)."
    constants:
      DEBT_PER_DAY: 3
      ENFORCED_THRESHOLD: 60
      OVERDUE_THRESHOLD: 30
      PAUSED_EXPOSURE_PENALTY: 20
      ORPHAN_PENALTY: 15
      WARNING_LEAD_SECONDS: 604800
      DEBT_CAP: 100
    precision: "Integer points. days_past_expiry uses floor over whole 86400-second days. Threshold comparisons are inclusive (>=), so exactly 60 points is ENFORCED and exactly 30 points is OVERDUE."

  - name: evidence_completeness_index
    trigger: "POST /releases/{id}/evidence-packets (initial computation), POST /evidence-packets/{id}/waivers (recomputation), and ReleaseNoteDocument DRAFT->PUBLISHED (recomputation of the release's DRAFT packets); writes base_index, waiver_credit_points, completeness_index, missing_items, waiver_count"
    algorithm: constraint_propagation
    formula: |
      # --- item satisfaction over the packet's Release R ---
      merged = ChangeRequest[release_id = R] with state IN {MERGED, DEPLOYED}
      approvals_complete  = every c in merged has, for each kind in
                            APPROVALS_REQUIRED[c.risk_class], at least one Approval with that
                            kind and decision APPROVE            (weight 25)
      rollback_plans      = every c in merged with risk_class IN {HIGH, CRITICAL} has
                            rollback_plan non-null and rollback_tested == true   (weight 20)
      canary_pass         = EXISTS Deployment[release_id = R] on an Environment with tier == PROD
                            whose verification_state == PASSING  (weight 15)
      freeze_discipline   = every c in merged has merged_at < R.freeze_at,
                            OR R.freeze_exception_approved == true               (weight 15)
      flag_hygiene        = no FeatureFlag reachable through ChangeFlagLink from any c in merged
                            has cleanup_state IN {OVERDUE, ENFORCED}             (weight 15)
      release_notes       = EXISTS ReleaseNoteDocument[release_id = R] with audience == CUSTOMER
                            and state == PUBLISHED                               (weight 10)

      # --- STEP 1 (pinned first): base index, waivers excluded ---
      base_index = sum(ITEM_WEIGHTS[i] for i in ITEMS if satisfied(i))

      # --- STEP 2: the credit cap tier is selected from base_index, NOT from the running total ---
      cap = 15 if base_index >= 85
            10 if base_index >= 70
             5 if base_index >= 50
             0 otherwise

      # --- STEP 3: waiver credit, then clamp ---
      raw_credit           = round_half_up(sum(ITEM_WEIGHTS[w.item_code] * WAIVER_CREDIT_RATE
                                               for w in waivers), 2)
      waiver_credit_points = min(cap, raw_credit)
      completeness_index   = min(100, base_index + waiver_credit_points)
      missing_items        = [i for i in ITEMS if not satisfied(i)
                                and i not in {w.item_code for w in waivers}]
      waiver_count         = len(waivers)
      # The cap tier is deliberately keyed on base_index even though the credit raises
      # completeness_index into a higher tier; re-selecting the tier from the post-credit
      # index is the wrong reading and yields a larger index.
    input_set: "The release's MERGED/DEPLOYED changes with their Approvals and linked flags, its PROD deployments, its published CUSTOMER release notes, and the packet's own waivers array. DRAFT/RISK_CLASSIFIED/WITHDRAWN changes never affect any item."
    constants:
      ITEM_WEIGHTS: { approvals_complete: 25, rollback_plans: 20, canary_pass: 15, freeze_discipline: 15, flag_hygiene: 15, release_notes: 10 }
      WAIVER_CREDIT_RATE: 0.5
      CAP_TIERS: { "85": 15, "70": 10, "50": 5, "0": 0 }
      SEAL_FLOOR: 90
    precision: "base_index is an integer 0..100. Waiver credit is rounded half-up to 2 decimals AFTER summing all waived weights, then capped. Tier boundaries are inclusive on the lower bound."

  - name: rollout_step_ladder
    trigger: "POST /feature-flags/{id}/rollout-steps (validates target_pct and soak_minutes and assigns step_index) and POST /flag-rollout-steps/{id}/apply (validates the soak boundary)"
    algorithm: threshold
    formula: |
      prev_pct  = FeatureFlag.current_exposure_pct       # 0 when applied_step_count == 0
      max_next  = min(100, max(FIRST_RUNG_PCT, prev_pct * RUNG_MULTIPLIER))
      valid target_pct  <=> target_pct > prev_pct and target_pct <= max_next

      required_soak_minutes = 30  if target_pct <= 10
                              60  if 10 < target_pct <= 50
                              120 if target_pct > 50
      valid soak_minutes <=> soak_minutes >= required_soak_minutes

      step_index = count(FlagRolloutStep[feature_flag_id = flag] with state != VOIDED) + 1

      apply is permitted <=> now >= soak_started_at + soak_minutes * 60      # inclusive boundary
    input_set: "The flag's current exposure and its non-VOIDED steps; the step's own target_pct and soak_minutes."
    constants:
      FIRST_RUNG_PCT: 5
      RUNG_MULTIPLIER: 3
      SOAK_SMALL_PCT_CEILING: 10
      SOAK_MEDIUM_PCT_CEILING: 50
      SOAK_MINUTES_SMALL: 30
      SOAK_MINUTES_MEDIUM: 60
      SOAK_MINUTES_LARGE: 120
    precision: "target_pct compared with 2-decimal precision; the ladder ceiling is inclusive (target_pct <= max_next) and the floor is exclusive (target_pct > prev_pct). The soak boundary is inclusive: applying at exactly soak_started_at + soak_minutes succeeds."

  - name: release_note_generation
    trigger: "POST /releases/{id}/release-notes; writes included_change_ids, entry_count, excluded_change_count, generated_at"
    algorithm: aggregation
    formula: |
      candidates = ChangeRequest[release_id = R]
                   where state IN {MERGED, DEPLOYED}
                     and merged_at <= R.cut_at                 # inclusive upper bound
      if audience == CUSTOMER:
          included = [c in candidates where c.customer_facing == true
                                        and c.summary_customer_facing is not null
                                        and c.summary_customer_facing != ""]
      else:  # INTERNAL
          included = candidates
      included ordered by merged_at ASC, then created_at ASC   # tie-break, never by id
      included_change_ids   = [c.id for c in included]
      entry_count           = len(included)
      excluded_change_count = len(candidates) - entry_count
    input_set: "Only MERGED/DEPLOYED changes whose merged_at is at or before cut_at. DEFERRED, WITHDRAWN, REJECTED, APPROVED and BLOCKED_BY_DEPENDENCY changes are excluded from candidates entirely, and therefore from excluded_change_count as well."
    constants:
      CUSTOMER_REQUIRES_SUMMARY: true
    precision: "Counts are integers; entry_count == 0 is a legal generation result but blocks publication."

  - name: incident_release_linkage
    trigger: "POST /incidents; writes Incident.linked_release_id and Incident.linked_deployment_id at creation and never recomputes them"
    algorithm: chronological
    formula: |
      # (a) eligibility filter
      candidates = Release[release_train_id = Incident.release_train_id]
                   where phase IN {CUT, STABILIZING, RELEASED}
                     and cut_at <= Incident.detected_at
                     and (Incident.detected_at - cut_at) <= LINKAGE_WINDOW_HOURS * 3600
      # (b) ranking expression
      ranked = candidates ordered by cut_at DESC
      # (c) tie-break when two releases share cut_at
      ranked = candidates ordered by cut_at DESC, created_at ASC
      # (d) empty-pool fallback
      linked_release_id = ranked[0].id if ranked else null
      # linked deployment on the selected release
      dep_candidates = Deployment[release_id = linked_release_id]
                       where delivery_state == COMPLETED
      linked_deployment_id = (dep_candidates ordered by window_start_at DESC, created_at ASC)[0].id
                             if dep_candidates else null
    input_set: "Releases on the incident's train inside the linkage window with phase IN {CUT, STABILIZING, RELEASED}; ROLLED_BACK, OPEN and FROZEN releases are never candidates. Deployment candidates are restricted to delivery_state == COMPLETED."
    constants:
      LINKAGE_WINDOW_HOURS: 72
    precision: "Both interval bounds are inclusive (cut_at <= detected_at and detected_at - cut_at <= 72h). Ranking and tie-breaks use cut_at / window_start_at and created_at only; entity ids never participate."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first failing row decides the response, and no side effect has run yet)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, non-blank, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: every required input field is present, types match, enum values are members of the declared set, numeric constraints hold (cadence_days >= 1, 0 < target_pct <= 100, window_end_at > window_start_at, deploy_window_end_hour_utc > deploy_window_start_hour_utc, error_count <= request_count, pagination limit in 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path id resolves, validated left-to-right: ERR_RELEASE_TRAIN_NOT_FOUND, ERR_RELEASE_NOT_FOUND, ERR_CHANGE_REQUEST_NOT_FOUND, ERR_FEATURE_FLAG_NOT_FOUND, ERR_ROLLOUT_STEP_NOT_FOUND, ERR_DEPLOYMENT_NOT_FOUND, ERR_RESOURCE_NOT_FOUND (Environment, Incident, ReleaseNoteDocument, ComplianceEvidencePacket)"
    error_id: ERR_RELEASE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves: environment_id, release_train_id, feature_flag_id, deployment_id, to_change_id"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /releases/{id}/deployments, POST /incidents, POST /change-requests/{id}/flag-links, POST /change-requests/{id}/dependencies, POST /feature-flags/{id}/rollout-steps"

  - priority: 6
    category: business_constraint
    check: "Scoped uniqueness: FeatureFlag.key is unique globally (ERR_FLAG_KEY_DUPLICATE); Release.version_label is unique within release_train_id (ERR_VERSION_LABEL_DUPLICATE); Environment.name is unique globally (ERR_FLAG_KEY_DUPLICATE is NOT used here — ERR_INVALID_REQUEST is, since name collisions on environments are a fixture error)"
    error_id: ERR_FLAG_KEY_DUPLICATE
    http_status: 409
    applies_to: "POST /feature-flags, POST /release-trains/{id}/releases"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_feature_flag_version equals FeatureFlag.version (ERR_STALE_FLAG_VERSION); expected_release_version equals Release.version (ERR_STALE_RELEASE_VERSION)"
    error_id: ERR_STALE_FLAG_VERSION
    http_status: 412
    applies_to: "POST /feature-flags/{id}/rollout-steps, POST /releases/{id}/evidence-packets"

  - priority: 8
    category: state
    check: "The target resource named in the path is in a state that permits this transition per §1.2: ERR_RELEASE_PHASE_INVALID, ERR_CHANGE_STATE_INVALID, ERR_FLAG_STATE_INVALID, ERR_STEP_STATE_INVALID, ERR_DEPLOYMENT_STATE_INVALID, ERR_PACKET_STATE_INVALID, ERR_NOTE_ALREADY_PUBLISHED, ERR_INCIDENT_ALREADY_DECIDED"
    error_id: ERR_DEPLOYMENT_STATE_INVALID
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "Cross-entity state preconditions on a DIFFERENT entity than the path target: creating or starting a Deployment requires Release.phase IN {CUT, STABILIZING, RELEASED} (ERR_RELEASE_PHASE_INVALID); submitting a change requires Release.phase == OPEN (ERR_RELEASE_PHASE_INVALID); starting a step's soak requires every linked ChangeRequest to be DEPLOYED (ERR_CHANGE_STATE_INVALID); applying a step requires FeatureFlag.state == ACTIVE_ROLLING_OUT (ERR_FLAG_STATE_INVALID)"
    error_id: ERR_RELEASE_PHASE_INVALID
    http_status: 409
    applies_to: "POST /releases/{id}/deployments, POST /deployments/{id}/start, POST /change-requests/{id}/submit, POST /flag-rollout-steps/{id}/start-soak, POST /flag-rollout-steps/{id}/apply"

  - priority: 10
    category: business_safety
    check: "Ownership: X-User-ID equals FeatureFlag.owner_user_id for rollout-step creation, start-soak, apply, resume and archive; X-User-ID equals ChangeRequest.author_user_id for submit, merge and withdraw"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /feature-flags/{id}/rollout-steps, POST /flag-rollout-steps/{id}/start-soak, POST /flag-rollout-steps/{id}/apply, POST /feature-flags/{id}/resume, POST /feature-flags/{id}/archive, POST /change-requests/{id}/submit, POST /change-requests/{id}/merge, POST /change-requests/{id}/withdraw"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: Approval.approver_user_id (the X-User-ID) must differ from ChangeRequest.author_user_id for every kind, and a CAB approval must additionally come from a user id that has not already recorded the TECHNICAL approval on the same change"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /change-requests/{id}/approvals"

  - priority: 12
    category: business_safety
    check: "Approval lane matches the acting role: kind TECHNICAL and kind CAB require role ChangeApprover; kind COMPLIANCE requires role ComplianceOfficer"
    error_id: ERR_APPROVAL_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /change-requests/{id}/approvals"

  - priority: 13
    category: business_safety
    check: "A FeatureFlag whose cleanup_state == ENFORCED may not resume, start a new soak, or receive a new rollout step until its staleness is cleared"
    error_id: ERR_FLAG_CLEANUP_ENFORCED
    http_status: 409
    applies_to: "POST /feature-flags/{id}/resume, POST /flag-rollout-steps/{id}/start-soak, POST /feature-flags/{id}/rollout-steps"

  - priority: 14
    category: business_safety
    check: "A change with risk_class IN {HIGH, CRITICAL} may only merge when rollback_plan is non-null and rollback_tested == true"
    error_id: ERR_ROLLBACK_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /change-requests/{id}/merge"

  - priority: 15
    category: business_safety
    check: "A Release whose completed PROD Deployment sits on an Environment with requires_compliance_evidence == true may only be marked RELEASED when a ComplianceEvidencePacket for it has state == SEALED"
    error_id: ERR_EVIDENCE_PACKET_REQUIRED
    http_status: 409
    applies_to: "POST /releases/{id}/release"

  - priority: 16
    category: business_safety
    check: "A ComplianceEvidencePacket may only be sealed when completeness_index >= 90"
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /evidence-packets/{id}/seal"

  - priority: 17
    category: business_safety
    check: "A waiver may only be recorded when the packet's base_index >= 50 (cap tier greater than zero) and item_code names an item that is currently unsatisfied and not already waived"
    error_id: ERR_WAIVER_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /evidence-packets/{id}/waivers"

  - priority: 18
    category: business_safety
    check: "A CANARY-strategy Deployment may only complete when verification_state IN {PASSING, WAIVED}; waive_verification == true is only honoured when verification_state == INCONCLUSIVE and the Environment tier != PROD"
    error_id: ERR_CANARY_NOT_PASSING
    http_status: 409
    applies_to: "POST /deployments/{id}/complete"

  - priority: 19
    category: business_constraint
    check: "A ChangeDependency may not create a cycle in the prerequisite graph, and may not point a change at itself; both endpoints must belong to the same Release"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 409
    applies_to: "POST /change-requests/{id}/dependencies"

  - priority: 20
    category: business_constraint
    check: "Every prerequisite of the merging change must already be in state IN {MERGED, DEPLOYED}"
    error_id: ERR_PREREQUISITE_NOT_MERGED
    http_status: 409
    applies_to: "POST /change-requests/{id}/merge"

  - priority: 21
    category: business_constraint
    check: "At most one FlagRolloutStep per FeatureFlag may be in state SOAKING"
    error_id: ERR_STEP_ALREADY_SOAKING
    http_status: 409
    applies_to: "POST /flag-rollout-steps/{id}/start-soak"

  - priority: 22
    category: business_constraint
    check: "The step starting its soak must satisfy step_index == FeatureFlag.applied_step_count + 1 (the ladder is walked in order)"
    error_id: ERR_STEP_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /flag-rollout-steps/{id}/start-soak"

  - priority: 23
    category: business_constraint
    check: "target_pct must satisfy prev_pct < target_pct <= min(100, max(5, prev_pct * 3)) per calculations.rollout_step_ladder"
    error_id: ERR_ROLLOUT_STEP_TOO_LARGE
    http_status: 422
    applies_to: "POST /feature-flags/{id}/rollout-steps"

  - priority: 24
    category: business_constraint
    check: "soak_minutes must be >= the required soak for the requested target_pct (30 / 60 / 120 minutes)"
    error_id: ERR_SOAK_TOO_SHORT
    http_status: 422
    applies_to: "POST /feature-flags/{id}/rollout-steps"

  - priority: 25
    category: business_constraint
    check: "A ReleaseNoteDocument with entry_count == 0 may not be published"
    error_id: ERR_EMPTY_RELEASE_NOTES
    http_status: 422
    applies_to: "POST /release-notes/{id}/publish"

  - priority: 26
    category: business_constraint
    check: "An incident decision of ROLLBACK requires linked_release_id and linked_deployment_id to be non-null, with the linked Release.phase IN {STABILIZING, RELEASED} and the linked Deployment.delivery_state == COMPLETED; a decision of NO_ACTION requires severity IN {SEV3, SEV4}"
    error_id: ERR_NO_LINKED_RELEASE
    http_status: 409
    applies_to: "POST /incidents/{id}/decide"

  - priority: 27
    category: business_referential
    check: "The submitted approval kind must appear in APPROVALS_REQUIRED[risk_class] for the change's current risk_class (a LOW change needs none, a MEDIUM change needs only TECHNICAL, a HIGH change needs TECHNICAL and COMPLIANCE, a CRITICAL change needs all three)"
    error_id: ERR_APPROVAL_KIND_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /change-requests/{id}/approvals"

  - priority: 28
    category: business_constraint
    check: "The same approval kind may not be recorded twice with decision APPROVE on one change"
    error_id: ERR_DUPLICATE_APPROVAL_KIND
    http_status: 409
    applies_to: "POST /change-requests/{id}/approvals"

  - priority: 29
    category: business_temporal
    check: "A release may only be cut once the logical clock has reached its freeze_at (inclusive)"
    error_id: ERR_CUT_BEFORE_FREEZE
    http_status: 409
    applies_to: "POST /releases/{id}/cut"

  - priority: 30
    category: business_temporal
    check: "A change may not merge once the logical clock has reached Release.freeze_at, nor while Release.phase IN {FROZEN, CUT}, unless Release.freeze_exception_approved == true"
    error_id: ERR_CODE_FREEZE_ACTIVE
    http_status: 409
    applies_to: "POST /change-requests/{id}/merge"

  - priority: 31
    category: business_temporal
    check: "Deployment window geometry: [window_start_at, window_end_at) must fall on a single UTC date, with window_start_at hour >= Environment.deploy_window_start_hour_utc and window_end_at at or before that date at Environment.deploy_window_end_hour_utc. On POST /deployments/{id}/start the logical clock must additionally satisfy window_start_at <= now < window_end_at"
    error_id: ERR_DEPLOY_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /releases/{id}/deployments, POST /deployments/{id}/start"

  - priority: 32
    category: business_temporal
    check: "The logical clock must not fall inside the Environment's closed blackout interval [blackout_start_at, blackout_end_at]"
    error_id: ERR_BLACKOUT_ACTIVE
    http_status: 409
    applies_to: "POST /deployments/{id}/start"

  - priority: 33
    category: business_temporal
    check: "Half-open occupancy with trailing buffer: the requested [window_start_at, window_end_at) must not intersect [other.window_start_at, other.window_end_at + Environment.cooldown_minutes) of any Deployment on the same environment whose delivery_state NOT IN {ABORTED, ROLLED_BACK}"
    error_id: ERR_DEPLOYMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /releases/{id}/deployments"

  - priority: 34
    category: business_temporal
    check: "Closed-interval aggregate capacity: the count of other Releases on the same train with phase IN {CUT, STABILIZING} whose CLOSED interval [cut_at, stabilization_end_at] intersects this release's closed interval (touching endpoints counts as intersecting), plus 1, must not exceed ReleaseTrain.max_concurrent_stabilizing"
    error_id: ERR_STABILIZATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /releases/{id}/cut"

  - priority: 35
    category: business_temporal
    check: "A step may only be applied once the logical clock has reached soak_started_at + soak_minutes (inclusive)"
    error_id: ERR_SOAK_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /flag-rollout-steps/{id}/apply"

  - priority: 36
    category: business_fiscal
    check: "Entering APPROVED must not push Release.risk_budget_consumed_points above ReleaseTrain.risk_budget_points"
    error_id: ERR_RISK_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /change-requests/{id}/approvals, POST /change-requests/{id}/submit"

  - priority: 37
    category: business_fiscal
    check: "A release may only be marked RELEASED when readiness_score_attested >= 80 and rollback_plan_confirmed == true"
    error_id: ERR_RELEASE_NOT_READY
    http_status: 409
    applies_to: "POST /releases/{id}/release"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and it NEVER falls back to real wall-clock time, so every freeze, soak, blackout, expiry and linkage rule is deterministic before the first call."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock repositioned; no entity is recomputed as a side effect of the move itself"]

  - method: POST
    path: "/environments"
    description: "Register a deployment environment with its daily deployment window, cooldown buffer, blackout interval and regulated-evidence flag"
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier, deploy_window_start_hour_utc, deploy_window_end_hour_utc, "cooldown_minutes?", "blackout_start_at?", "blackout_end_at?", "requires_compliance_evidence?"]
    output: Environment
    side_effects: ["active_deployment_count = 0; last_deployment_end_at = null"]

  - method: GET
    path: "/environments/{id}"
    description: "Read one environment including its computed occupancy fields"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: Environment
    side_effects: []

  - method: POST
    path: "/release-trains"
    description: "Create a release train with cadence, freeze lead, stabilization length, stabilization capacity and per-release risk budget"
    roles: [ReleaseManager]
    code: 201
    input: [name, cadence_days, code_freeze_lead_hours, stabilization_hours, risk_budget_points, "max_concurrent_stabilizing?"]
    output: ReleaseTrain
    side_effects: ["phase = ACTIVE; open_release_count = 0; freeze_exception_count = 0"]

  - method: GET
    path: "/release-trains/{id}"
    description: "Read one release train including its computed counters"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: ReleaseTrain
    side_effects: []

  - method: POST
    path: "/release-trains/{id}/freeze-state"
    description: "Enter or leave code freeze on the whole train (action FREEZE or UNFREEZE), cascading into releases, change requests and blocked dependents"
    roles: [ReleaseManager]
    code: 200
    input: [action]
    output: ReleaseTrain
    side_effects: ["ReleaseTrain ACTIVE<->FROZEN per §1.2 with the pinned five-hop freeze cascade (or its compensating unfreeze cascade); increments ReleaseTrain.version by 1"]

  - method: POST
    path: "/release-trains/{id}/releases"
    description: "Open a release on the train; freeze_at and stabilization_end_at are derived from the train's lead and stabilization hours"
    roles: [ReleaseManager]
    code: 201
    input: [version_label, cut_at]
    output: Release
    side_effects: ["freeze_at = cut_at - code_freeze_lead_hours; stabilization_end_at = cut_at + stabilization_hours; phase = OPEN; readiness_score_projected = 100; ReleaseTrain.open_release_count += 1"]

  - method: GET
    path: "/release-trains/{id}/releases"
    description: "List the releases of a train (reverse-reachability for Release.release_train_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["phase?", "limit?", "offset?"]
    output: Release[]
    side_effects: []

  - method: GET
    path: "/releases/{id}"
    description: "Read one release including both readiness variants and its ledger counters"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: Release
    side_effects: []

  - method: POST
    path: "/releases/{id}/cut"
    description: "Cut the release: defer everything still in flight, pin the attested readiness score, and take a stabilization slot on the train"
    roles: [ReleaseManager]
    code: 200
    input: []
    output: Release
    side_effects: ["in-flight changes -> DEFERRED; readiness_score_attested pinned (calculations.release_readiness_score variant attested); phase = CUT; ReleaseTrain.open_release_count -= 1"]

  - method: POST
    path: "/releases/{id}/release"
    description: "Mark a stabilized release as RELEASED, promoting its merged changes to DEPLOYED"
    roles: [ReleaseManager]
    code: 200
    input: []
    output: Release
    side_effects: ["phase = RELEASED; released_at stamped; MERGED changes -> DEPLOYED with deployment_verified = true; verified_change_count recomputed"]

  - method: POST
    path: "/releases/{id}/freeze-exceptions"
    description: "Grant a compliance-approved freeze exception permitting merges into a frozen or cut release"
    roles: [ComplianceOfficer]
    code: 200
    input: [justification]
    output: Release
    side_effects: ["freeze_exception_approved = true; ReleaseTrain.freeze_exception_count += 1; version += 1"]

  - method: POST
    path: "/releases/{id}/change-requests"
    description: "Create a change request against an open release"
    roles: [Engineer]
    code: 201
    input: [title, summary_internal, lines_changed, touched_subsystem_count, declared_blast_radius, "summary_customer_facing?", "customer_facing?", "has_schema_migration?", "rollback_plan?", "rollback_tested?"]
    output: ChangeRequest
    side_effects: ["state = DRAFT; author_user_id = X-User-ID; risk fields null until submit"]

  - method: GET
    path: "/releases/{id}/change-requests"
    description: "List the change requests of a release (reverse-reachability for ChangeRequest.release_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []

  - method: GET
    path: "/change-requests/{id}"
    description: "Read one change request including both risk score variants and its approval counters"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/submit"
    description: "Submit a change for change control: classify its risk and take the LOW / MEDIUM-HIGH / CRITICAL branch"
    roles: [Engineer]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["risk_score_preliminary and risk_class pinned; LOW auto-approves (risk_score_final pinned, Release counters and risk budget updated); CRITICAL moves to CAB_REVIEW; MEDIUM and HIGH stay in RISK_CLASSIFIED; Release.readiness_score_projected recomputed"]

  - method: POST
    path: "/change-requests/{id}/dependencies"
    description: "Declare that this change depends on a prerequisite change in the same release"
    roles: [Engineer]
    code: 201
    input: [to_change_id, "note?"]
    output: ChangeDependency
    side_effects: ["cycle check over the prerequisite graph; from_change.dependency_depth recomputed (longest prerequisite chain); Release.readiness_score_projected recomputed"]

  - method: GET
    path: "/change-requests/{id}/dependencies"
    description: "List the dependency edges touching this change (reverse-reachability for ChangeDependency.from_change_id and .to_change_id); direction defaults to OUTGOING"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["direction?", "limit?", "offset?"]
    output: ChangeDependency[]
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/flag-links"
    description: "Link a feature flag as the guard of this change"
    roles: [Engineer]
    code: 201
    input: [feature_flag_id, guard_kind]
    output: ChangeFlagLink
    side_effects: ["Release.readiness_score_projected recomputed; the flag's orphan penalty disappears at its next staleness evaluation"]

  - method: GET
    path: "/change-requests/{id}/flag-links"
    description: "List the flag links of a change (reverse-reachability for ChangeFlagLink.change_request_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["limit?", "offset?"]
    output: ChangeFlagLink[]
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/approvals"
    description: "Record a decision in one approval lane (TECHNICAL, COMPLIANCE or CAB), enforcing segregation of duties"
    roles: [ChangeApprover, ComplianceOfficer]
    code: 201
    input: [kind, decision, "comment?"]
    output: Approval
    side_effects: ["approver_user_id, pinned_risk_score and pinned_change_version stamped; the change's approval counter for that kind incremented; the approval join may move the change to APPROVED (pinning risk_score_final and consuming risk budget); decision REJECT moves the change to REJECTED"]

  - method: GET
    path: "/change-requests/{id}/approvals"
    description: "List the approvals of a change (reverse-reachability for Approval.change_request_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: Approval[]
    side_effects: []

  - method: POST
    path: "/change-requests/{id}/merge"
    description: "Merge an approved change into its release, honouring freeze windows, rollback-plan policy and prerequisite ordering"
    roles: [Engineer]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["state = MERGED; merged_at stamped; Release.rollback_plan_confirmed and readiness_score_projected recomputed; dependents whose prerequisites are now all merged return from BLOCKED_BY_DEPENDENCY to APPROVED"]

  - method: POST
    path: "/change-requests/{id}/withdraw"
    description: "Withdraw a change, compensating every ledger effect its approval caused"
    roles: [Engineer]
    code: 200
    input: ["reason?"]
    output: ChangeRequest
    side_effects: ["state = WITHDRAWN; when the change was APPROVED, Release.committed_change_count -= 1 and Release.risk_budget_consumed_points -= risk_score_final; APPROVED dependents -> BLOCKED_BY_DEPENDENCY; Release.readiness_score_projected recomputed"]

  - method: POST
    path: "/feature-flags"
    description: "Create a feature flag in the inventory with an accountable owner and an expiration date"
    roles: [Engineer]
    code: 201
    input: [key, owner_user_id, expires_at, "permanent?"]
    output: FeatureFlag
    side_effects: ["state = DRAFT; cleanup_state = COMPLIANT; current_exposure_pct = 0; applied_step_count = 0; created_by_user_id = X-User-ID"]

  - method: GET
    path: "/feature-flags/{id}"
    description: "Read one flag including both of its state dimensions and its staleness debt"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: FeatureFlag
    side_effects: []

  - method: GET
    path: "/feature-flags"
    description: "Flag inventory listing with hygiene and ownership filters plus pagination"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["state?", "cleanup_state?", "owner_user_id?", "limit?", "offset?"]
    output: FeatureFlag[]
    side_effects: []

  - method: GET
    path: "/feature-flags/{id}/change-links"
    description: "List the change links of a flag (reverse-reachability for ChangeFlagLink.feature_flag_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["limit?", "offset?"]
    output: ChangeFlagLink[]
    side_effects: []

  - method: POST
    path: "/feature-flags/{id}/rollout-steps"
    description: "Plan the next rung of a flag's rollout ladder; guarded by optimistic concurrency on the flag's version"
    roles: [Engineer]
    code: 201
    input: [target_pct, soak_minutes, expected_feature_flag_version, "deployment_id?"]
    output: FlagRolloutStep
    side_effects: ["ladder ceiling and required soak validated (calculations.rollout_step_ladder); step_index assigned; state = PLANNED; increments FeatureFlag.version by 1"]

  - method: GET
    path: "/flag-rollout-steps/{id}"
    description: "Read one rollout step"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: FlagRolloutStep
    side_effects: []

  - method: GET
    path: "/flag-rollout-steps"
    description: "List rollout steps filtered by flag, canary deployment or state (reverse-reachability for FlagRolloutStep.feature_flag_id and .deployment_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["feature_flag_id?", "deployment_id?", "state?", "limit?", "offset?"]
    output: FlagRolloutStep[]
    side_effects: []

  - method: POST
    path: "/flag-rollout-steps/{id}/start-soak"
    description: "Begin soaking a planned rung, capturing the exposure it will restore on abort"
    roles: [Engineer]
    code: 200
    input: []
    output: FlagRolloutStep
    side_effects: ["state = SOAKING; soak_started_at stamped; previous_exposure_pct captured; FeatureFlag DRAFT -> ACTIVE_ROLLING_OUT"]

  - method: POST
    path: "/flag-rollout-steps/{id}/apply"
    description: "Apply a soaked rung, advancing the flag's exposure"
    roles: [Engineer]
    code: 200
    input: []
    output: FlagRolloutStep
    side_effects: ["state = APPLIED; FeatureFlag.current_exposure_pct = target_pct; applied_step_count += 1; stale_debt_points recomputed; flag -> FULLY_ROLLED_OUT when target_pct == 100"]

  - method: POST
    path: "/feature-flags/{id}/pause"
    description: "Pause a rolling-out flag (manual kill switch); SRE may pause any flag during an incident"
    roles: [Engineer, SRE]
    code: 200
    input: ["reason?"]
    output: FeatureFlag
    side_effects: ["state = PAUSED; kill_switch_engaged unchanged (manual pause); current_exposure_pct unchanged"]

  - method: POST
    path: "/feature-flags/{id}/resume"
    description: "Resume a paused flag, closing the rollout cycle; blocked while cleanup enforcement is active"
    roles: [Engineer]
    code: 200
    input: []
    output: FeatureFlag
    side_effects: ["state = ACTIVE_ROLLING_OUT; kill_switch_engaged = false"]

  - method: POST
    path: "/feature-flags/{id}/archive"
    description: "Permanently remove a flag from the inventory once its guarded changes have landed"
    roles: [Engineer]
    code: 200
    input: []
    output: FeatureFlag
    side_effects: ["state = ARCHIVED; archived_at stamped; stale_debt_points = 0; cleanup_state = COMPLIANT; PLANNED steps -> VOIDED"]

  - method: POST
    path: "/flag-cleanup-sweeps"
    description: "Ops-run checkpoint: re-evaluate staleness debt for every non-archived flag and enforce cleanup on the ENFORCED ones"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: { evaluated_count: integer, warning_count: integer, overdue_count: integer, enforced_count: integer, paused_flag_count: integer, voided_step_count: integer, aborted_step_count: integer }
    side_effects: ["stale_debt_points and cleanup_state rewritten on every flag with state != ARCHIVED; last_sweep_at stamped; flags newly ENFORCED with state == ACTIVE_ROLLING_OUT -> PAUSED with kill_switch_engaged = true; their PLANNED steps -> VOIDED and SOAKING steps -> ABORTED with exposure restored; readiness_score_projected recomputed on releases linked to affected flags"]

  - method: POST
    path: "/releases/{id}/deployments"
    description: "Reserve a deployment window for a cut release on an environment, honouring window geometry and the cooldown buffer"
    roles: [SRE]
    code: 201
    input: [environment_id, window_start_at, window_end_at, strategy, abort_error_rate_pct, abort_latency_p95_ms, "canary_pct?", "min_sample_count?"]
    output: Deployment
    side_effects: ["delivery_state = SCHEDULED; verification_state = PENDING; Release.evidence_packet_required recomputed"]

  - method: GET
    path: "/deployments/{id}"
    description: "Read one deployment including both of its parallel state dimensions"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: Deployment
    side_effects: []

  - method: GET
    path: "/deployments"
    description: "List deployments filtered by release, environment or delivery state (reverse-reachability for Deployment.release_id and .environment_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["release_id?", "environment_id?", "delivery_state?", "limit?", "offset?"]
    output: Deployment[]
    side_effects: []

  - method: POST
    path: "/deployments/{id}/start"
    description: "Start a scheduled deployment inside its reserved window, bubbling the release into stabilization"
    roles: [SRE]
    code: 200
    input: []
    output: Deployment
    side_effects: ["delivery_state = IN_PROGRESS; Environment.active_deployment_count += 1; Release CUT -> STABILIZING"]

  - method: POST
    path: "/deployments/{id}/health-signals"
    description: "Ingest one automated health-check sample for a running deployment"
    roles: [SRE, PlatformAdmin]
    code: 201
    input: [observed_at, cohort, request_count, error_count, latency_p95_ms]
    output: HealthSignal
    side_effects: ["the first CANARY sample moves a CANARY-strategy deployment IN_PROGRESS -> CANARY_SOAK"]

  - method: GET
    path: "/deployments/{id}/health-signals"
    description: "List the health samples of a deployment (reverse-reachability for HealthSignal.deployment_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["cohort?", "limit?", "offset?"]
    output: HealthSignal[]
    side_effects: []

  - method: POST
    path: "/deployments/{id}/canary-evaluations"
    description: "Run canary analysis over a half-open observation window and apply the abort criteria"
    roles: [SRE]
    code: 201
    input: [window_start_at, window_end_at]
    output: CanaryEvaluation
    side_effects: ["calculations.canary_health_verdict computed; Deployment.verification_state and health_score updated; abort_triggered fires the four-hop abort cascade (deployment ABORTED, soaking step ABORTED with exposure restored, flag PAUSED with kill switch, linked changes unverified)"]

  - method: GET
    path: "/deployments/{id}/canary-evaluations"
    description: "List the canary evaluations of a deployment (reverse-reachability for CanaryEvaluation.deployment_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["limit?", "offset?"]
    output: CanaryEvaluation[]
    side_effects: []

  - method: POST
    path: "/deployments/{id}/complete"
    description: "Complete a running deployment; an inconclusive verification may be waived on non-PROD tiers"
    roles: [SRE]
    code: 200
    input: ["waive_verification?"]
    output: Deployment
    side_effects: ["delivery_state = COMPLETED; completed_at stamped; Environment.active_deployment_count -= 1 and last_deployment_end_at recomputed; verification_state = WAIVED when waived"]

  - method: POST
    path: "/deployments/{id}/rollback"
    description: "Roll a completed deployment back, cascading into the release, its flags and their steps"
    roles: [SRE]
    code: 200
    input: ["reason?"]
    output: Deployment
    side_effects: ["delivery_state = ROLLED_BACK; the release rollback cascade runs (release ROLLED_BACK, flags PAUSED, steps VOIDED/ABORTED, changes unverified)"]

  - method: POST
    path: "/incidents"
    description: "Report an incident; the server links it to the most recent qualifying release and deployment on the train"
    roles: [SRE, Engineer]
    code: 201
    input: [title, severity, detected_at, release_train_id]
    output: Incident
    side_effects: ["linked_release_id and linked_deployment_id pinned by calculations.incident_release_linkage; state = OPEN"]

  - method: GET
    path: "/incidents/{id}"
    description: "Read one incident including its computed linkage"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/incidents"
    description: "List incidents filtered by train, linked release, linked deployment or state (reverse-reachability for Incident.release_train_id, .linked_release_id and .linked_deployment_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["release_train_id?", "linked_release_id?", "linked_deployment_id?", "state?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/incidents/{id}/decide"
    description: "Record the release-office decision: ROLLBACK (fires the full rollback cascade), FORWARD_FIX, or NO_ACTION"
    roles: [SRE]
    code: 200
    input: [decision]
    output: Incident
    side_effects: ["state = DECIDED; ROLLBACK rolls the linked deployment back, which rolls the release back, which pauses its rolling-out flags, which voids/aborts their steps and unverifies their changes"]

  - method: POST
    path: "/releases/{id}/release-notes"
    description: "Generate a release-notes document for an audience, filtering merged changes by the customer-facing rule"
    roles: [ReleaseManager]
    code: 201
    input: [audience]
    output: ReleaseNoteDocument
    side_effects: ["calculations.release_note_generation computed; state = DRAFT; generated_at stamped"]

  - method: GET
    path: "/releases/{id}/release-notes"
    description: "List the release-notes documents of a release (reverse-reachability for ReleaseNoteDocument.release_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["audience?", "limit?", "offset?"]
    output: ReleaseNoteDocument[]
    side_effects: []

  - method: POST
    path: "/release-notes/{id}/publish"
    description: "Publish a non-empty release-notes document, which also refreshes the release's draft evidence packets"
    roles: [ReleaseManager]
    code: 200
    input: []
    output: ReleaseNoteDocument
    side_effects: ["state = PUBLISHED; published_at stamped; DRAFT ComplianceEvidencePackets of the same release recompute base_index, waiver_credit_points and completeness_index"]

  - method: POST
    path: "/releases/{id}/evidence-packets"
    description: "Assemble a change-control evidence packet for the release; guarded by optimistic concurrency on the release's version"
    roles: [ComplianceOfficer]
    code: 201
    input: [expected_release_version]
    output: ComplianceEvidencePacket
    side_effects: ["calculations.evidence_completeness_index computed; any prior DRAFT packet of the release -> SUPERSEDED; increments Release.version by 1"]

  - method: GET
    path: "/releases/{id}/evidence-packets"
    description: "List the evidence packets of a release (reverse-reachability for ComplianceEvidencePacket.release_id)"
    roles: [PlatformAdmin, ReleaseManager, Engineer, ChangeApprover, ComplianceOfficer, SRE]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ComplianceEvidencePacket[]
    side_effects: []

  - method: POST
    path: "/evidence-packets/{id}/waivers"
    description: "Waive one unsatisfied evidence item, earning capped partial credit"
    roles: [ComplianceOfficer]
    code: 200
    input: [item_code, justification]
    output: ComplianceEvidencePacket
    side_effects: ["waiver appended; waiver_count, waiver_credit_points, completeness_index and missing_items recomputed with the cap tier keyed on base_index"]

  - method: POST
    path: "/evidence-packets/{id}/seal"
    description: "Seal a sufficiently complete evidence packet, unlocking release of a regulated environment"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceEvidencePacket
    side_effects: ["state = SEALED; sealed_at and sealed_by_user_id stamped"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing/blank, or the role is not one of the six declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member, violated numeric constraint, duplicate Environment.name, or pagination limit outside 1..100" }
  - { id: ERR_RELEASE_TRAIN_NOT_FOUND, http: 404, condition: "No ReleaseTrain with the given id" }
  - { id: ERR_RELEASE_NOT_FOUND, http: 404, condition: "No Release with the given id" }
  - { id: ERR_CHANGE_REQUEST_NOT_FOUND, http: 404, condition: "No ChangeRequest with the given id, in the path or as to_change_id" }
  - { id: ERR_FEATURE_FLAG_NOT_FOUND, http: 404, condition: "No FeatureFlag with the given id, in the path or as feature_flag_id" }
  - { id: ERR_ROLLOUT_STEP_NOT_FOUND, http: 404, condition: "No FlagRolloutStep with the given id" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "No Deployment with the given id, in the path or as deployment_id" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "No Environment, Incident, ReleaseNoteDocument or ComplianceEvidencePacket with the given id" }
  - { id: ERR_FLAG_KEY_DUPLICATE, http: 409, condition: "A FeatureFlag with the same key already exists" }
  - { id: ERR_VERSION_LABEL_DUPLICATE, http: 409, condition: "A Release with the same version_label already exists on the train" }
  - { id: ERR_STALE_FLAG_VERSION, http: 412, condition: "expected_feature_flag_version does not equal FeatureFlag.version" }
  - { id: ERR_STALE_RELEASE_VERSION, http: 412, condition: "expected_release_version does not equal Release.version" }
  - { id: ERR_RELEASE_PHASE_INVALID, http: 409, condition: "The release's phase forbids the requested operation, either on the release itself or as a cross-entity precondition of a child operation" }
  - { id: ERR_CHANGE_STATE_INVALID, http: 409, condition: "The change request's state forbids the requested transition, or a linked change is not DEPLOYED when a rollout step needs it to be" }
  - { id: ERR_FLAG_STATE_INVALID, http: 409, condition: "The feature flag's rollout state forbids the requested transition" }
  - { id: ERR_STEP_STATE_INVALID, http: 409, condition: "The rollout step's state forbids the requested transition" }
  - { id: ERR_DEPLOYMENT_STATE_INVALID, http: 409, condition: "The deployment's delivery_state forbids the requested transition" }
  - { id: ERR_PACKET_STATE_INVALID, http: 409, condition: "The evidence packet is not DRAFT and therefore cannot be waived or sealed" }
  - { id: ERR_NOTE_ALREADY_PUBLISHED, http: 409, condition: "The release-notes document is already PUBLISHED" }
  - { id: ERR_INCIDENT_ALREADY_DECIDED, http: 409, condition: "The incident already carries a decision" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "X-User-ID is neither the flag's owner_user_id (flag operations) nor the change's author_user_id (submit/merge/withdraw)" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "The approver's X-User-ID equals the change's author_user_id, or a CAB approval reuses the TECHNICAL approver's user id" }
  - { id: ERR_APPROVAL_ROLE_MISMATCH, http: 403, condition: "The approval kind does not match the acting role (TECHNICAL/CAB need ChangeApprover, COMPLIANCE needs ComplianceOfficer)" }
  - { id: ERR_FLAG_CLEANUP_ENFORCED, http: 409, condition: "The flag's cleanup_state is ENFORCED, blocking resume, new steps and new soaks" }
  - { id: ERR_ROLLBACK_PLAN_REQUIRED, http: 422, condition: "A HIGH or CRITICAL change tried to merge without a tested rollback plan" }
  - { id: ERR_EVIDENCE_PACKET_REQUIRED, http: 409, condition: "A release on a regulated environment tried to reach RELEASED without a SEALED evidence packet" }
  - { id: ERR_EVIDENCE_INCOMPLETE, http: 422, condition: "Sealing was attempted while completeness_index < 90" }
  - { id: ERR_WAIVER_NOT_ALLOWED, http: 422, condition: "Waiver rejected: base_index < 50, or item_code is already satisfied or already waived" }
  - { id: ERR_CANARY_NOT_PASSING, http: 409, condition: "A CANARY deployment tried to complete while verification_state is not PASSING/WAIVED, or a waiver was requested on a PROD tier or from a non-INCONCLUSIVE state" }
  - { id: ERR_DEPENDENCY_CYCLE, http: 409, condition: "The dependency edge would close a cycle, points a change at itself, or crosses releases" }
  - { id: ERR_PREREQUISITE_NOT_MERGED, http: 409, condition: "A prerequisite change is not yet MERGED or DEPLOYED at merge time" }
  - { id: ERR_STEP_ALREADY_SOAKING, http: 409, condition: "Another rollout step of the same flag is already SOAKING" }
  - { id: ERR_STEP_OUT_OF_ORDER, http: 409, condition: "step_index does not equal FeatureFlag.applied_step_count + 1" }
  - { id: ERR_ROLLOUT_STEP_TOO_LARGE, http: 422, condition: "target_pct is not greater than the current exposure, or exceeds min(100, max(5, exposure * 3))" }
  - { id: ERR_SOAK_TOO_SHORT, http: 422, condition: "soak_minutes is below the required soak for the requested target_pct" }
  - { id: ERR_EMPTY_RELEASE_NOTES, http: 422, condition: "Publication was attempted on a document with entry_count == 0" }
  - { id: ERR_NO_LINKED_RELEASE, http: 409, condition: "A ROLLBACK decision has no eligible linked release/deployment, or a NO_ACTION decision was used on a SEV1/SEV2 incident" }
  - { id: ERR_APPROVAL_KIND_NOT_REQUIRED, http: 422, condition: "The submitted approval kind is not required by the change's risk_class" }
  - { id: ERR_DUPLICATE_APPROVAL_KIND, http: 409, condition: "That approval kind was already recorded with decision APPROVE on this change" }
  - { id: ERR_CUT_BEFORE_FREEZE, http: 409, condition: "The cut was attempted before the logical clock reached freeze_at" }
  - { id: ERR_CODE_FREEZE_ACTIVE, http: 409, condition: "A merge was attempted at or after freeze_at, or into a FROZEN/CUT release, without an approved freeze exception" }
  - { id: ERR_DEPLOY_WINDOW_VIOLATION, http: 409, condition: "The requested window falls outside the environment's daily deployment window or spans UTC dates, or the start was attempted outside [window_start_at, window_end_at)" }
  - { id: ERR_BLACKOUT_ACTIVE, http: 409, condition: "The logical clock lies inside the environment's closed blackout interval" }
  - { id: ERR_DEPLOYMENT_WINDOW_CONFLICT, http: 409, condition: "The requested window intersects another live deployment's window extended by the environment's cooldown buffer" }
  - { id: ERR_STABILIZATION_CAPACITY_EXCEEDED, http: 409, condition: "Cutting would exceed the train's max_concurrent_stabilizing over closed stabilization intervals" }
  - { id: ERR_SOAK_NOT_ELAPSED, http: 409, condition: "A step was applied before soak_started_at + soak_minutes" }
  - { id: ERR_RISK_BUDGET_EXCEEDED, http: 409, condition: "Approving the change would push Release.risk_budget_consumed_points above the train's risk_budget_points" }
  - { id: ERR_RELEASE_NOT_READY, http: 409, condition: "RELEASED was attempted with readiness_score_attested < 80, without a completed PROD deployment, or with rollback_plan_confirmed == false" }

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties)
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Release-office platform operator: owns environment configuration and the logical clock; never touches change control"
    identity: opaque
    exclusive_operations:
      - "POST /environments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /deployments/{id}/health-signals (shared with SRE)"
      - "all GET endpoints"

  - name: ReleaseManager
    description: "Owns release trains, releases, code freeze and release notes; cannot author, approve or deploy changes"
    identity: opaque
    exclusive_operations:
      - "POST /release-trains"
      - "POST /release-trains/{id}/freeze-state"
      - "POST /release-trains/{id}/releases"
      - "POST /releases/{id}/cut"
      - "POST /releases/{id}/release"
      - "POST /releases/{id}/release-notes"
      - "POST /release-notes/{id}/publish"
    shared_operations:
      - "all GET endpoints"

  - name: Engineer
    description: "Change author and flag owner: creates and merges changes, owns the flag inventory and drives rollout ladders. X-User-ID is compared with ChangeRequest.author_user_id and FeatureFlag.owner_user_id, so an Engineer can never approve their own change"
    identity: opaque
    exclusive_operations:
      - "POST /releases/{id}/change-requests"
      - "POST /change-requests/{id}/submit"
      - "POST /change-requests/{id}/merge"
      - "POST /change-requests/{id}/withdraw"
      - "POST /change-requests/{id}/dependencies"
      - "POST /change-requests/{id}/flag-links"
      - "POST /feature-flags"
      - "POST /feature-flags/{id}/rollout-steps"
      - "POST /flag-rollout-steps/{id}/start-soak"
      - "POST /flag-rollout-steps/{id}/apply"
      - "POST /feature-flags/{id}/resume"
      - "POST /feature-flags/{id}/archive"
    shared_operations:
      - "POST /feature-flags/{id}/pause (shared with SRE)"
      - "POST /incidents (shared with SRE)"
      - "all GET endpoints"

  - name: ChangeApprover
    description: "Technical reviewer and change advisory board member; records TECHNICAL and CAB decisions but may never author, merge or deploy"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /change-requests/{id}/approvals with kind TECHNICAL or CAB (endpoint shared with ComplianceOfficer, lanes disjoint)"
      - "all GET endpoints"

  - name: ComplianceOfficer
    description: "Change-control compliance authority: records COMPLIANCE decisions, grants freeze exceptions, assembles and seals evidence, and runs the stale-flag cleanup sweep"
    identity: opaque
    exclusive_operations:
      - "POST /releases/{id}/freeze-exceptions"
      - "POST /releases/{id}/evidence-packets"
      - "POST /evidence-packets/{id}/waivers"
      - "POST /evidence-packets/{id}/seal"
      - "POST /flag-cleanup-sweeps"
    shared_operations:
      - "POST /change-requests/{id}/approvals with kind COMPLIANCE (endpoint shared with ChangeApprover, lanes disjoint)"
      - "all GET endpoints"

  - name: SRE
    description: "Progressive-delivery operator: reserves and drives deployment windows, ingests health signals, runs canary analysis, rolls back and decides incidents"
    identity: opaque
    exclusive_operations:
      - "POST /releases/{id}/deployments"
      - "POST /deployments/{id}/start"
      - "POST /deployments/{id}/canary-evaluations"
      - "POST /deployments/{id}/complete"
      - "POST /deployments/{id}/rollback"
      - "POST /incidents/{id}/decide"
    shared_operations:
      - "POST /deployments/{id}/health-signals (shared with PlatformAdmin)"
      - "POST /feature-flags/{id}/pause (shared with Engineer)"
      - "POST /incidents (shared with Engineer)"
      - "all GET endpoints"
