            - call: "POST /improvement-actions/${act}/start"
              payload: {}
              as: EvaluationLead
            - call: "POST /improvement-actions/${act}/implement"
              payload: {}
              as: EvaluationLead
            - call: "POST /improvement-actions/${act}/verify"
              payload: { outcome: "EFFECTIVE" }
              as: ProgramDirector
              captures: { act_status: $.data.status, act_reviewed: $.data.effectiveness_reviewed_at }
          assert:
            - "first pass ends VERIFIED_INEFFECTIVE; reopen returns the SAME entity to PROPOSED"
            - "second pass reaches VERIFIED_EFFECTIVE; effectiveness_reviewed_at is non-null"

  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_revoke_depth3
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.Participant.ACTIVE_to_WITHDRAWN
          - state_machines.Observation.VALIDATED_to_EXCLUDED
          - entities.ProgramCycle.fields.data_completeness_pct
        distinguishing_aspect: |
          Depth-3 chain from POST /consents/{id}/revoke: consent REVOKED ->
          participant WITHDRAWN -> both observations EXCLUDED (reason
          CONSENT_REVOKED) -> cycle counters recomputed (totals to 0,
          completeness to null because the eligible-participant set empties).
        test_recipe:
          setup:
            - "Cycle ACTIVE; participant P-001 ACTIVE with CURRENT consent; obs1 value 80 VALIDATED, obs2 value 20 PENDING"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Legal Aid", code: "LGL" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
