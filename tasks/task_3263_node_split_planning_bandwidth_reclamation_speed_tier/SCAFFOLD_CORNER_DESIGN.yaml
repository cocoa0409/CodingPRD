              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-OC2", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /speed-tiers"
              payload: { tier_code: "T10", downstream_mbps: 10, upstream_mbps: 2, min_capability_class: "D30", min_upstream_config: "LEGACY" }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-OCC", address: "1 Version Ave" }
              as: ProvisioningAgent
              captures: { cp: $.data.id, cp_v: $.data.version }
            - call: "POST /customer-premises/${cp}/equipment"
              payload: { model: "XB8", docsis_version: "4.0", capability_class: "D40", max_downstream_mbps: 1000, video_legacy: false }
              as: ProvisioningAgent
            - call: "POST /customer-premises/${cp}/provisioning-requests"
              payload: { speed_tier_id: "${tier}", expected_customer_premise_version: "${cp_v}" }
              as: ProvisioningAgent
          trigger:
            - call: "POST /customer-premises/${cp}/provisioning-requests"
              payload: { speed_tier_id: "${tier}", expected_customer_premise_version: "${cp_v}" }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger responds 412 ERR_STALE_VERSION"

      - name: occ_stale_project_version_on_schedule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[nsp-schedule-stale-project]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Scheduling with expected version N-1 after a prior adjudication bumped the project to N fails 412 ERR_STALE_VERSION; re-reading and scheduling with the fresh version succeeds."
        test_recipe:
          setup:
            - "Project PERMIT_GRANTED; client holds the pre-adjudication version"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-OC3", homes_passed: 600, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-OC3", homes_passed: 600, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "NODE_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/node-split-projects"
              payload: { child_count: 2, min_homes_per_child: 200, max_homes_per_child: 400 }
              as: NetworkPlanner
              captures: { nsp: $.data.id, nsp_v_pre: $.data.version }
            - call: "POST /node-split-projects/${nsp}/adjudicate-permit"
              payload: { decision: "GRANTED" }
              as: FranchiseAdmin
          trigger:
            - call: "POST /node-split-projects/${nsp}/schedule"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", expected_node_split_project_version: "${nsp_v_pre}" }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger responds 412 ERR_STALE_VERSION (adjudication advanced the version beyond the client's observation)"
            - "NodeSplitProject.${nsp}.status remains PERMIT_GRANTED"

      - name: derived_fields_reconcile_after_block_reclaim_and_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.sg_downstream_capacity
          - entities.ServiceGroup.fields.downstream_capacity_mbps
        distinguishing_aspect: "Capacity is 304 before begin, stays 304 while the target block sits RECLAIM_PENDING, becomes 456 after complete, and returns to 304 if a second reclaim action is begun then cancelled — the derived field tracks source-block state in both directions."
        test_recipe:
          setup:
            - "Node NE-DR: VIDEO 24 x2 + DATA 48; SG-DR; reclaim action A IN_PROGRESS targeting v1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-DR", homes_passed: 100, downstream_spectrum_mhz: 96, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
              captures: { v1: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
              captures: { v2: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-DR", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "SPECTRUM_RECLAIM", target_block_ids: ["${v1}"], expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { caA: $.data.id }
            - call: "POST /capacity-actions/${caA}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${caA}/begin"
              as: CapacityEngineer
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-DR1", address: "1 Derive Dr" }
              as: ProvisioningAgent
              captures: { cp: $.data.id }
            - call: "POST /customer-premises/${cp}/equipment"
              payload: { model: "SB6183", docsis_version: "3.0", capability_class: "D30", max_downstream_mbps: 300, video_legacy: true }
              as: ProvisioningAgent
              captures: { cpe: $.data.id }
            - call: "POST /capacity-actions/${caA}/migration-waves"
              payload: { wave_code: "W1", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-02T00:00:00Z", target_cpe_ids: ["${cpe}"] }
              as: NetworkPlanner
              captures: { w1: $.data.id }
            - call: "POST /migration-waves/${w1}/execute"
              as: FieldOpsCoordinator
          trigger:
            - call: "GET /service-groups/${sg}"
              as: Any
            - call: "POST /capacity-actions/${caA}/complete"
              as: CapacityEngineer
            - call: "GET /service-groups/${sg}"
              as: Any
          assert:
            - "before complete: downstream_capacity_mbps == 304 (RECLAIM_PENDING blocks contribute 0 and v1 was not DATA before)"
            - "after complete: downstream_capacity_mbps == 456 (v1 flipped DATA_ACTIVE adds 152)"
            - "SpectrumBlock.${v2}.status remains VIDEO_ACTIVE throughout"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_cutover_visible_in_same_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.NodeSplitProject.IN_CONSTRUCTION_to_COMPLETED
        distinguishing_aspect: "All cutover side effects (child node, child service groups, parent retirement, action completion) are visible in the immediately following GETs with no delay or reconciliation lag."
        test_recipe:
          setup:
            - "NE-IM2 fully prepared for cutover (600 homes, child_count 2, IN_CONSTRUCTION)"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-IM2", homes_passed: 600, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-IM2", homes_passed: 600, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "NODE_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/node-split-projects"
              payload: { child_count: 2, min_homes_per_child: 200, max_homes_per_child: 400 }
              as: NetworkPlanner
              captures: { nsp: $.data.id }
            - call: "POST /node-split-projects/${nsp}/adjudicate-permit"
              payload: { decision: "GRANTED" }
              as: FranchiseAdmin
              captures: { nsp_v: $.data.version }
            - call: "POST /node-split-projects/${nsp}/schedule"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-05T00:00:00Z", expected_node_split_project_version: "${nsp_v}" }
              as: NetworkPlanner
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /node-split-projects/${nsp}/begin-construction"
              as: FieldOpsCoordinator
          trigger:
