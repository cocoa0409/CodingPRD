            - { call: "POST /api/projects/${proj2}/schedule-installation", payload: { install_start_date: "2026-08-15T08:00:00Z", install_end_date: "2026-08-18T17:00:00Z" }, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /api/projects/${proj2}/complete-installation", payload: { serial_number: "SN-200" }, as: Installer, as_user_id: "${t_inst}" }
            - { call: "GET /api/units?project_id=${proj2}", payload: {}, as: ProjectCoordinator, captures: { unit2: "$.data[0].id" } }
            - { call: "POST /api/inspections", payload: { unit_id: "${unit2}", project_id: "${proj2}", inspection_type: "MODERNIZATION_ACCEPTANCE", inspector_technician_id: "${t_insp}", scheduled_start: "2026-08-15T10:00:00Z", scheduled_end: "2026-08-15T11:00:00Z" }, as: ProjectCoordinator, captures: { inspM: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:05:00Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /api/inspections/${inspM}/record-result", payload: { result: "PASSED" }, as: Inspector, as_user_id: "${t_insp}" }
          assert:
            - "ElevatorUnit.${unit1}.equipment_status == DECOMMISSIONED (old unit retired by the acceptance pass)"
            - "ElevatorUnit.${unit2}.modernized_from_unit_id == ${unit1} (self-referential lineage)"
            - "GET /api/units?property_id=${prop} returns 2 units, exactly 1 with equipment_status != DECOMMISSIONED (count conserved: 1 before, 1 after)"
            - "Project.${proj2}.status == AWAITING_REGISTRATION"
