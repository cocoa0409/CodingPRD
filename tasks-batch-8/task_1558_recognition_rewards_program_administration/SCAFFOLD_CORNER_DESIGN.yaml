            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${e2}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "orig", idempotency_key: "K1" }, as: Employee, as_user_id: "${e1}", captures: { replay: $.data.id } }
