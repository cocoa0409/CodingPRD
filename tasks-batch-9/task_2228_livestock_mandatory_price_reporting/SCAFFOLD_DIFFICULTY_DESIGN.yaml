      - name: entity_penalty_ledger_restored_by_waiver
        grounds:
          - calculations.entity_penalty_ledger
          - calculations.delinquency_points_and_tier
          - entities.ReportingEntity.fields.outstanding_penalty_cents
          - state_machines.PenaltyAssessment.ASSESSED_to_WAIVED
          - state_machines.PenaltyAssessment.ASSESSED_to_PAID
          - state_machines.Registration.SUSPENDED_to_ACTIVE
        conserved_quantity: "ReportingEntity.assessed_penalty_cents == paid_penalty_cents + waived_penalty_cents + outstanding_penalty_cents (integer cents), together with delinquency_points == sum of points over ASSESSED and PAID assessments"
        distinguishing_aspect: |
          A different conserved quantity from the head ledger: a four-way money
          partition in integer cents plus a point total, and the compensation is
          partial by design. Waiving moves cents from outstanding to waived and
          subtracts that row's points, which reverses the tier breach and reinstates the
          registration; paying moves cents from outstanding to paid and deliberately
          does NOT return points. The gross assessed total is invariant under both
          settlements, and the VOIDED submissions are NOT resurrected — showing which
          side effects are compensable and which are not.
        test_recipe:
          setup:
            - "Alpha Packing with plant EST-101 and an ACTIVE MANDATORY 2026 registration whose measured_head is 126000 (volume_factor 1.126)."
            - "One OPEN weekly CATTLE window with one DRAFT submission from EST-101 (100 head attached, never submitted)."
