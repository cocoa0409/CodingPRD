              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: SystemOperator
            - call: "POST /_ops/run-daily-cycle"
              payload: {}
              as: SystemOperator
              captures: { esc_0: $.data.escalated_margin_call_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T01:00:00Z" }
              as: SystemOperator
            - call: "POST /_ops/run-daily-cycle"
              payload: {}
              as: SystemOperator
              captures: { esc_1: $.data.escalated_margin_call_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:30:00Z" }
              as: SystemOperator
            - call: "POST /_ops/run-daily-cycle"
              payload: {}
              as: SystemOperator
              captures: { brk_0: $.data.breached_margin_call_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T02:00:00Z" }
              as: SystemOperator
            - call: "POST /_ops/run-daily-cycle"
              payload: {}
              as: SystemOperator
              captures: { brk_1: $.data.breached_margin_call_count }
          assert:
            - "CYCLE 1 (before cure_deadline_at): escalated_margin_call_count == 0, breached_margin_call_count == 0, suspended_depository_count == 0, stale_priced_asset_count == 0 (the asset was priced 12h ago, under PRICE_STALE_HOURS 48); MarginCall.${call_id} is untouched at status 'ISSUED'"
            - "CYCLE 1 current_utc == '2026-08-01T12:00:00Z' — the checkpoint echoes the logical clock it swept at, which is what makes the sweep reproducible"
            - "CYCLE 2 (1h past cure_deadline_at): escalated_margin_call_count == 1; MarginCall.${call_id}.status == 'ESCALATED', escalated_at == 2026-08-02T01:00:00Z, and breach_deadline_at is REWRITTEN from 2026-08-03T00:00:00Z to 2026-08-03T01:00:00Z == escalated_at + ESCALATION_GRACE_HOURS 24"
            - "CYCLE 3 (at 2026-08-03T00:30:00Z, i.e. PAST the original breach deadline but before the rewritten one): breached_margin_call_count == 0 and the call is still 'ESCALATED' — the escalation bought 1 extra hour, so a naive implementation that kept the issuance-time deadline breaches here and fails"
            - "CYCLE 3 also reports stale_priced_asset_count == 1: CollateralAsset.${asset_id}.priced_at 2026-08-01T00:00:00Z is 48.5h old, past PRICE_STALE_HOURS 48, and the sweep only COUNTS it (eligibility_status stays 'ELIGIBLE', version unchanged)"
            - "CYCLE 4 (past the rewritten deadline): breached_margin_call_count == 1, suspended_depository_count == 1; MarginCall.${call_id}.status == 'BREACHED'"
            - "CYCLE 4 cascade hop 1-2: Depository.${dep_id}.approval_status == 'SUSPENDED' and DepositAccount.${acct_id}.funding_status == 'RESTRICTED' with restricted_reason set"
            - "CYCLE 4 cascade hop 3-4: PublicUnit.${unit_id}.exposure_status == 'ESCALATED' and RunoffForecast.${fc_id}.status == 'STALE' with requires_reforecast true — four levels deep from a checkpoint that received an empty body"
            - "Re-running the cycle a fifth time at the same clock returns all-zero counts: the sweep is idempotent because the statuses it selects on are no longer present"

      - name: pooled_program_computed_reads_after_waterfall
        claim_type: computed_read
        grounds: [entities.PooledCollateralProgram, calculations.pooled_collateral_waterfall]
        excluded_because:
