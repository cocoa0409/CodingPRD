  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: update_bin_agreement_occ_success_path
        claim_type: conditional_action
        grounds:
          - "endpoints[PUT /vmi/bin-agreements/{id}]"
          - "concurrency_rules[bin-agreement-update-stale-version]"
        distinguishing_aspect: "PUT with the current expected_bin_agreement_version succeeds and bumps version by 1; the response reflects the new min/max."
        test_recipe:
          setup: ["Site S, part P, agreement min 10 max 100 (version 1)"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "OC2-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "OC2-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "OC1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id, agr_v: $.data.version }
          trigger:
            - call: "PUT /vmi/bin-agreements/${agr_id}"
              payload: { expected_bin_agreement_version: "${agr_v}", min_qty: 20, max_qty: 120 }
              as: DistributorAdmin
          assert:
            - "BinAgreement.${agr_id}.min_qty == 20 and max_qty == 120"
            - "BinAgreement.${agr_id}.version == ${agr_v} + 1"

      - name: update_bin_agreement_stale_version_rejected
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[bin-agreement-update-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A second PUT carrying the pre-update version is rejected with ERR_STALE_VERSION (412) — OCC resolves the stale write deterministically."
        test_recipe:
          setup: ["Agreement created (version 1) and updated once (version 2)"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "OC3-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "OC3-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "OC2", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id, agr_v: $.data.version }
            - call: "PUT /vmi/bin-agreements/${agr_id}"
              payload: { expected_bin_agreement_version: "${agr_v}", min_qty: 15 }
              as: DistributorAdmin
          trigger:
            - call: "PUT /vmi/bin-agreements/${agr_id}"
              payload: { expected_bin_agreement_version: "${agr_v}", min_qty: 25 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (http 412)"
            - "BinAgreement.${agr_id}.min_qty == 15 (first writer's value retained)"

      - name: create_route_stale_site_version_rejected
        claim_type: violation_to_error
        grounds:
          - "concurrency_rules[route-create-stale-site]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "POST /vmi/routes with an expected_site_version captured before another route creation (which bumped the site version) fails with ERR_STALE_VERSION — the OCC field on route create is enforced."
        test_recipe:
          setup: ["Site S created; site version captured; one route created (site version advances)"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "OC4-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T10:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T14:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (http 412) — the captured site version went stale when the first route bumped it"

      - name: route_window_inverted_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_ROUTE_WINDOW_OVERLAP]"
        distinguishing_aspect: "window_start >= window_end is rejected under the same window validation as overlap."
        test_recipe:
          setup: ["Site S exists"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "INV-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id, site_v: $.data.version }
          trigger:
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T08:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_WINDOW_OVERLAP (http 422)"

      - name: overlapping_route_window_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_ROUTE_WINDOW_OVERLAP]"
        distinguishing_aspect: "A route whose window starts one minute before an existing route's window_end (genuine intersection, not adjacency) is rejected."
        test_recipe:
          setup: ["Site S with route 08:00-12:00 on 2026-08-10"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "OV-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v1: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v1}" }
              as: DistributorAdmin
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v2: $.data.version }
          trigger:
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T11:59:00Z", window_end: "2026-08-10T13:00:00Z", expected_site_version: "${site_v2}" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROUTE_WINDOW_OVERLAP (http 422)"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationships
        grounds: [entities.BinAgreement.fields.site_id, entities.RouteStop.fields.route_id, entities.ReplenishmentOrder.fields.bin_agreement_id]
        distinguishing_aspect: "Every declared FK is traversable from its parent: GET /vmi/bin-agreements?site_id=..., GET /vmi/routes/{id}/stops, GET /vmi/replenishment-orders?bin_agreement_id=... each return arrays scoped to the parent."
        test_recipe:
          setup: ["Site S, part P, agreement, route with one stop"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "FK-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "FK-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "FK1", pricing_mode: "UNIT_PRICE", min_qty: 1, max_qty: 10 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "GET /vmi/bin-agreements?site_id=${site_id}"
              payload: {}
              as: DistributorAdmin
            - call: "GET /vmi/routes/${route_id}/stops"
              payload: {}
              as: RouteDriver
            - call: "GET /vmi/replenishment-orders?bin_agreement_id=${agr_id}"
              payload: {}
              as: DistributorAdmin
          assert:
            - "bin-agreements filtered list contains exactly ${agr_id}"
            - "route stops list contains exactly ${stop_id}"
            - "orders filtered list is an empty array (total_count == 0) — 0-length FK reverse traversal is valid"

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Error responses carry the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type 'error', data.error_id and data.message keys."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vmi/parts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == 'error'"
            - "data.error_id == 'ERR_NOT_FOUND' and data.message is a non-empty string"
            - "meta contains api_request_id and api_request_timestamp"

      - name: error_route_empty_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ROUTE_EMPTY]"
        excluded_because:
          difficulty_instance: route_close_with_zero_submitted_stops_rejected
          rationale: "Asserted as the failure path of the named §1.8 boundary instance."

  # =========================================================================
  # Section: roles (RBAC)
  # =========================================================================
  - section: roles
    instances:
      - name: route_driver_cannot_create_parts
        claim_type: rbac_denial
        grounds:
          - "roles[DistributorAdmin]"
          - "roles[RouteDriver]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "RouteDriver calling POST /vmi/parts (DistributorAdmin-exclusive) returns ERR_UNAUTHORIZED (403), not ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vmi/parts"
              payload: { sku: "RB-1", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 1 }
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (http 403)"

      - name: warehouse_operator_cannot_submit_route_stops
        claim_type: rbac_denial
        grounds:
          - "roles[RouteDriver]"
          - "roles[WarehouseOperator]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "WarehouseOperator is excluded from the route surface: submitting a stop returns ERR_UNAUTHORIZED — peer-role isolation, not a hierarchical override."
        test_recipe:
          setup: ["Site, part, agreement, route started, stop created (setup uses correct roles)"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "RB-2", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "RB-2P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "RB1", pricing_mode: "UNIT_PRICE", min_qty: 1, max_qty: 10 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: WarehouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (http 403)"
            - "RouteStop.${stop_id}.status == PENDING (unchanged)"

      - name: distributor_admin_cannot_drive_kit_lifecycle
        claim_type: rbac_denial
        grounds:
          - "roles[DistributorAdmin]"
          - "roles[WarehouseOperator]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "The admin is NOT a superset: DistributorAdmin calling POST /vmi/kit-jobs/{id}/start-picking (WarehouseOperator-exclusive) returns ERR_UNAUTHORIZED — peer_roles model, no hierarchical override."
        test_recipe:
          setup: ["Site S, part P stock 100, kit job created"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "RB-3", credit_limit_cents: 100000, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "RB-3P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/kit-jobs"
              payload: { site_id: "${site_id}", kit_name: "k", component_part_ids: ["${part_id}"], qty_per_part: 1, kit_count: 1, station_window_start: "2026-08-10T08:00:00Z", station_window_end: "2026-08-10T09:00:00Z" }
              as: WarehouseOperator
              captures: { kit_id: $.data.id }
          trigger:
            - call: "POST /vmi/kit-jobs/${kit_id}/start-picking"
              payload: {}
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED (http 403)"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401), which outranks authorization and existence — priority 1 before all other checks."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vmi/sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (http 401) even though the id would otherwise be a 404"

  # =========================================================================
  # Section: cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: derived_fields_reconcile_through_delivery_chain
        claim_type: derived_field_reconciliation
        grounds: [entities.BinAgreement.fields.on_hand_qty, entities.BinAgreement.fields.open_order_qty]
        distinguishing_aspect: "Derived fields stay consistent through the full order lifecycle: submit sets on_hand to the count; confirm raises open_order_qty; deliver moves qty from open_order_qty into on_hand — at every step the pair reconciles."
        test_recipe:
          setup: ["Site S (credit high), part P unit 1000, agreement min 10 max 100, route started, stop at count 5"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "DF-1", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "DF-P", description: "p", is_critical: false, unit_price_cents: 1000, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "DF1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 100 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 5 }
              as: RouteDriver
              captures: { order_id: $.data.generated_order_id }
          trigger:
            - call: "POST /vmi/replenishment-orders/${order_id}/confirm"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/replenishment-orders/${order_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/replenishment-orders/${order_id}/deliver"
              payload: {}
              as: RouteDriver
            - call: "GET /vmi/bin-agreements/${agr_id}"
              payload: {}
              as: DistributorAdmin
              captures: { on_hand: $.data.on_hand_qty, open_q: $.data.open_order_qty, status: $.data.status }
          assert:
            - "After submit+confirm: open_order_qty was 95 (observed post-confirm via GET in test)"
            - "After deliver: BinAgreement.${agr_id}.on_hand_qty == 100 (5 + 95)"
            - "After deliver: BinAgreement.${agr_id}.open_order_qty == 0"
            - "BinAgreement.${agr_id}.status == AT_CAPACITY (on_hand 100 >= max 100 after delivery)"

      - name: posture_auto_transition_threshold_gating
        claim_type: rate_threshold_triggers
        grounds: [state_machines.BinAgreement.ACTIVE_to_AT_CAPACITY, state_machines.BinAgreement.AT_CAPACITY_to_ACTIVE]
        distinguishing_aspect: "Posture threshold uses >= : on_hand + open exactly == max_qty flips AT_CAPACITY; one unit below stays ACTIVE — verified by direct scan-to-full (no order) vs scan-plus-confirm paths."
        test_recipe:
          setup: ["Site S, part P unit 100, agreement min 10 max 50; route started"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "PT-1", credit_limit_cents: 100000000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "PT-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100000 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "PT1", pricing_mode: "UNIT_PRICE", min_qty: 10, max_qty: 50 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /vmi/sites/${site_id}"
              payload: {}
              as: DistributorAdmin
              captures: { site_v: $.data.version }
            - call: "POST /vmi/routes"
              payload: { site_id: "${site_id}", route_date: "2026-08-10T00:00:00Z", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_site_version: "${site_v}" }
              as: DistributorAdmin
              captures: { route_id: $.data.id }
            - call: "POST /vmi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: DistributorAdmin
            - call: "POST /vmi/routes/${route_id}/start"
              payload: {}
              as: RouteDriver
            - call: "POST /vmi/routes/${route_id}/stops"
              payload: { bin_agreement_id: "${agr_id}" }
              as: RouteDriver
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /vmi/route-stops/${stop_id}/submit"
              payload: { counted_qty: 49 }
              as: RouteDriver
            - call: "GET /vmi/bin-agreements/${agr_id}"
              payload: {}
              as: DistributorAdmin
              captures: { st49: $.data.status }
          assert:
            - "At on_hand 49 (< max 50): status == ACTIVE and no order generated (49 >= min 10)"
            - "Boundary evidence: with on_hand + open == 49 < 50 the posture remains ACTIVE, consistent with the >= rule verified at equality in stop_submit_to_order_to_capacity_posture_depth3"

