scenario: "Meals on Wheels & Home-Delivered Meals: client intake & nutritional/functional assessment, route & delivery-day scheduling, meal type (frozen/hot/therapeutic) & counts, wellness-check & welfare-alert escalation, suggested-contribution & donation, volunteer-driver assignment, vacation hold, Older Americans Act units"
domain_name: "meals-on-wheels"
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  # Client is a hub with sub-resources (assessments, meal-plans, contributions,
  # vacation-holds) while Route/VolunteerDriver/Delivery form a cross-cutting
  # scheduling mesh linked to Client by foreign key.
  state_machine_shape: branching
  # Delivery forks SCHEDULED -> {DELIVERED, NO_ANSWER, SKIPPED, CANCELLED} with
  # divergent side-effect sets; Client (ACTIVE<->ON_HOLD) and MealPlan
  # (ACTIVE<->SUSPENDED) carry revert cycles; WelfareAlert branches
  # OPEN -> {ACKNOWLEDGED, ESCALATED} -> RESOLVED.
  relationship_patterns:
    - one_to_many          # Client -> Assessment / MealPlan / Delivery / Contribution / VacationHold
    - cross_aggregate      # Delivery references Client, MealPlan and Route across aggregate boundaries
  role_model: peer_roles
  # Intake/Nutrition/Routing/Driving/Contribution operators each own distinct
  # resource types; ProgramAdmin owns the volunteer roster.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Older-adult client's full name"
      - name: birth_date
        type: datetime
        source: input
        description: "Date of birth (ISO 8601 date); drives OAA age eligibility at intake"
        constraints: "must be a date strictly before created_at"
      - name: household_size
        type: integer
        source: input
        description: "Number of people in household; drives federal poverty line"
        constraints: ">= 1"
      - name: monthly_income_cents
        type: integer
        source: input
        description: "Self-reported gross monthly household income in cents"
        constraints: ">= 0"
      - name: address_zone
        type: string
        source: input
        description: "Delivery zone code (e.g. Z1); a MealPlan's route zone must equal this"
      - name: phone
        type: string
        source: input
        description: "Contact phone"
      - name: enrollment_status
        type: enum
        source: system
        default: INTAKE
        description: "Client lifecycle state"
        constraints: "one of INTAKE, ASSESSED, ACTIVE, ON_HOLD, DISCHARGED"
      - name: oaa_eligible
        type: boolean
        source: computed
        description: "True when age at created_at >= OAA_MIN_AGE (60); see calc client_oaa_eligibility"
      - name: income_tier
        type: enum
        source: computed
        description: "Contribution tier from income vs poverty line; see calc client_income_tier"
        constraints: "one of TIER_A, TIER_B, TIER_C"
      - name: suggested_contribution_cents
        type: integer
        source: computed
        description: "Monthly suggested (never mandatory) contribution; see calc suggested_contribution"
        default: 0
      - name: donation_balance_cents
        type: integer
        source: computed
        description: "Reconciled sum of RECORDED contributions; see calc donation_balance_reconciliation"
        default: 0
      - name: lifetime_oaa_units
        type: integer
        source: computed
        description: "Reconciled count of delivered OAA meal units; see calc oaa_units_reporting (delivered variant)"
        default: 0
      - name: consecutive_no_answer
        type: integer
        source: system
        default: 0
        description: "Running count of consecutive NO_ANSWER deliveries; reset to 0 on a DELIVERED delivery"

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the assessed client"
      - name: nutrition_determine_points
        type: integer
        source: input
        description: "DETERMINE checklist total nutritional-risk points"
        constraints: "0..21"
      - name: nutrition_risk_category
        type: enum
        source: computed
        description: "Risk band from points; see calc nutrition_risk_category"
        constraints: "one of GOOD, MODERATE, HIGH"
      - name: adl_score
        type: integer
        source: input
        description: "Count of Activities of Daily Living requiring help (functional assessment)"
        constraints: "0..6"
      - name: functional_level
        type: enum
        source: computed
        description: "Functional band from adl_score; see calc functional_level"
        constraints: "one of INDEPENDENT, PARTIAL, DEPENDENT"
      - name: therapeutic_diet_required
        type: boolean
        source: input
        default: false
        description: "Whether a therapeutic (medically tailored) diet is clinically indicated"
      - name: therapeutic_diet_type
        type: enum
        source: input
        default: NONE
        description: "Prescribed therapeutic diet type"
        constraints: "one of NONE, RENAL, DIABETIC, LOW_SODIUM, PUREED"
      - name: recommended_meals_per_day
        type: integer
        source: input
        description: "Clinically recommended meals per day"
        constraints: "1..3"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Assessment lifecycle"
        constraints: "one of DRAFT, FINALIZED, SUPERSEDED"

  - name: MealPlan
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; owner of this standing meal order"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the FINALIZED assessment this plan is built from (must belong to client_id)"
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the ACTIVE route (zone must equal client's address_zone) that serves this plan"
      - name: meal_type
        type: enum
        source: input
        description: "Delivery/meal modality"
        constraints: "one of FROZEN, HOT, THERAPEUTIC"
      - name: therapeutic_diet_type
        type: enum
        source: input
        default: NONE
        description: "Therapeutic diet type; must equal assessment.therapeutic_diet_type when meal_type == THERAPEUTIC"
        constraints: "one of NONE, RENAL, DIABETIC, LOW_SODIUM, PUREED"
      - name: meals_per_day
        type: integer
        source: input
        description: "Meals delivered per delivery day"
        constraints: "1..3"
      - name: delivery_days
        type: array
        source: input
        description: "Non-empty set of service weekdays for this plan (subset of MON..SUN)"
        constraints: "non-empty; each in {MON,TUE,WED,THU,FRI,SAT,SUN}"
      - name: weekly_meal_count
        type: integer
        source: computed
        description: "Meals provisioned per week; see calc weekly_meal_count"
      - name: suggested_contribution_per_meal_cents
        type: integer
        source: computed
        description: "Per-meal suggested contribution rounded to the cent; see calc suggested_contribution"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Meal-plan lifecycle"
        constraints: "one of ACTIVE, SUSPENDED, CANCELLED"

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Route label"
      - name: zone
        type: string
        source: input
        description: "Delivery zone this route covers; MealPlan.client address_zone must match"
      - name: service_days
        type: array
        source: input
        description: "Non-empty set of weekdays this route runs (subset of MON..SUN); used for driver-day overlap"
        constraints: "non-empty; each in {MON,TUE,WED,THU,FRI,SAT,SUN}"
      - name: driver_id
        type: string
        source: input
        default: null
        description: "FK -> VolunteerDriver.id; assigned volunteer driver (null until assign-driver)"
      - name: max_meals_per_run
        type: integer
        source: input
        description: "Capacity: max total meal_count of SCHEDULED deliveries on this route for any single date"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Route lifecycle"
        constraints: "one of DRAFT, ACTIVE"

  - name: VolunteerDriver
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Volunteer driver name"
      - name: phone
        type: string
        source: input
        description: "Contact phone"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Driver lifecycle"
        constraints: "one of PENDING, ACTIVE"

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - name: meal_plan_id
        type: string
        source: input
        description: "FK -> MealPlan.id; the standing plan this delivery instantiates"
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from meal_plan.client_id at creation"
      - name: route_id
        type: string
        source: computed
        description: "FK -> Route.id; copied from meal_plan.route_id at creation"
      - name: scheduled_date
        type: datetime
        source: input
        description: "Date of this delivery (ISO 8601 date); its weekday must be in meal_plan.delivery_days"
      - name: meal_type
        type: enum
        source: computed
        description: "Copied from meal_plan.meal_type"
        constraints: "one of FROZEN, HOT, THERAPEUTIC"
      - name: meal_count
        type: integer
        source: computed
        description: "Meals in this delivery; see calc delivery_meal_count"
      - name: oaa_units_accrued
        type: integer
        source: computed
        default: 0
        description: "OAA units credited by this delivery: meal_count when DELIVERED, else 0"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Delivery lifecycle"
        constraints: "one of SCHEDULED, DELIVERED, NO_ANSWER, SKIPPED, CANCELLED, VOIDED"
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: "Timestamp set when status becomes DELIVERED"

  - name: WellnessCheck
    parent: null
    common_fields: false
    fields:
      - name: delivery_id
        type: string
        source: input
        description: "FK -> Delivery.id; the delivery during which this check was made"
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; copied from the delivery"
      - name: outcome
        type: enum
        source: system
        description: "Wellness observation recorded at delivery time"
        constraints: "one of OK, NO_ANSWER"
      - name: notes
        type: string
        source: input
        default: null
        description: "Free-text driver notes"

  - name: WelfareAlert
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: computed
        description: "FK -> Client.id; the at-risk client"
      - name: triggering_wellness_check_id
        type: string
        source: computed
        description: "FK -> WellnessCheck.id; the NO_ANSWER check that opened this alert"
      - name: severity
        type: enum
        source: computed
        description: "Severity from client's consecutive_no_answer at open time; see calc welfare_severity"
        constraints: "one of LOW, HIGH"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Alert lifecycle"
        constraints: "one of OPEN, ACKNOWLEDGED, ESCALATED, RESOLVED"
      - name: acknowledged_by
        type: string
        source: system
        default: null
        description: "Opaque user id (X-User-ID) that acknowledged the alert"

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the donating client"
      - name: amount_cents
        type: integer
        source: input
        description: "Donation amount in cents"
        constraints: "> 0"
      - name: period_month
        type: string
        source: input
        description: "Attribution month, format YYYY-MM"
      - name: status
        type: enum
        source: system
        default: RECORDED
        description: "Contribution lifecycle"
        constraints: "one of RECORDED, VOIDED"

  - name: VacationHold
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client pausing service"
      - name: start_date
        type: datetime
        source: input
        description: "First held date (ISO 8601 date), inclusive"
      - name: end_date
        type: datetime
        source: input
        description: "Last held date (ISO 8601 date), inclusive"
        constraints: "end_date >= start_date"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Hold lifecycle"
        constraints: "one of ACTIVE, COMPLETED, CANCELLED"

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Client
    initial_state: INTAKE
    terminal_states: [DISCHARGED]
    transitions:
      - from: INTAKE
        to: ASSESSED
        trigger: "POST /assessments/{id}/finalize (first FINALIZED assessment for this client)"
        actor: Nutritionist
        preconditions: ["client.enrollment_status == INTAKE"]
        side_effects:
          - "increments Client.version by 1"
        note: "Cross-entity: Assessment finalize drives the Client forward."
      - from: ASSESSED
        to: ACTIVE
        trigger: "POST /clients/{id}/activate"
        actor: IntakeCoordinator
        preconditions:
          - "client.enrollment_status == ASSESSED"
          - "client has exactly one MealPlan with status == ACTIVE"
        side_effects:
          - "increments Client.version by 1"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /clients/{id}/vacation-holds (system, on hold creation)"
        actor: system
        preconditions: ["client.enrollment_status == ACTIVE"]
        side_effects:
          - "the client's ACTIVE MealPlan transitions ACTIVE -> SUSPENDED (cascade)"
          - "increments Client.version by 1"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /vacation-holds/{id}/end (system, on hold release)"
        actor: system
        preconditions: ["client.enrollment_status == ON_HOLD", "no other ACTIVE VacationHold for client"]
        side_effects:
          - "the client's SUSPENDED MealPlan transitions SUSPENDED -> ACTIVE (cascade)"
          - "increments Client.version by 1"
      - from: ASSESSED
        to: DISCHARGED
        trigger: "POST /clients/{id}/discharge"
        actor: IntakeCoordinator
        preconditions: ["client.enrollment_status in {ASSESSED, ACTIVE, ON_HOLD}"]
        side_effects:
          - "the client's ACTIVE or SUSPENDED MealPlan (if any) transitions to CANCELLED (cascade)"
          - "every SCHEDULED Delivery for this client transitions to CANCELLED (cascade)"
          - "every ACTIVE VacationHold for this client transitions to CANCELLED (cascade)"
          - "increments Client.version by 1"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /clients/{id}/discharge"
        actor: IntakeCoordinator
        preconditions: ["client.enrollment_status in {ASSESSED, ACTIVE, ON_HOLD}"]
        side_effects:
          - "the client's ACTIVE MealPlan transitions to CANCELLED (cascade)"
          - "every SCHEDULED Delivery for this client transitions to CANCELLED (cascade)"
          - "increments Client.version by 1"
      - from: ON_HOLD
        to: DISCHARGED
        trigger: "POST /clients/{id}/discharge"
        actor: IntakeCoordinator
        preconditions: ["client.enrollment_status in {ASSESSED, ACTIVE, ON_HOLD}"]
        side_effects:
          - "the client's SUSPENDED MealPlan transitions to CANCELLED (cascade)"
          - "every SCHEDULED Delivery for this client transitions to CANCELLED (cascade)"
          - "every ACTIVE VacationHold for this client transitions to CANCELLED (cascade)"
          - "increments Client.version by 1"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /assessments/{id}/finalize"
        actor: Nutritionist
        preconditions: ["assessment.status == DRAFT"]
        side_effects:
          - "any prior FINALIZED Assessment for the same client transitions FINALIZED -> SUPERSEDED (cascade)"
          - "if client.enrollment_status == INTAKE, Client transitions INTAKE -> ASSESSED (cascade)"
          - "increments Assessment.version by 1"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /assessments/{id}/finalize on a newer Assessment of the same client (system)"
        actor: system
        preconditions: ["assessment.status == FINALIZED"]
        side_effects:
          - "increments Assessment.version by 1"

  - entity: MealPlan
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/vacation-holds (system cascade)"
        actor: system
        preconditions: ["meal_plan.status == ACTIVE"]
        side_effects:
          - "every SCHEDULED Delivery of this plan whose scheduled_date is within [hold.start_date, hold.end_date] transitions SCHEDULED -> CANCELLED (cascade)"
          - "increments MealPlan.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vacation-holds/{id}/end (system cascade)"
        actor: system
        preconditions: ["meal_plan.status == SUSPENDED"]
        side_effects:
          - "increments MealPlan.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /meal-plans/{id}/cancel; or superseded by POST /clients/{id}/meal-plans; or Client discharge (cascade)"
        actor: RouteManager
        preconditions: ["meal_plan.status == ACTIVE"]
        side_effects:
          - "every SCHEDULED Delivery of this plan transitions SCHEDULED -> CANCELLED (cascade)"
          - "increments MealPlan.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "Client discharge (cascade)"
        actor: system
        preconditions: ["meal_plan.status == SUSPENDED"]
        side_effects:
          - "increments MealPlan.version by 1"

  - entity: Route
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /routes/{id}/activate"
        actor: RouteManager
        preconditions:
          - "route.driver_id is not null"
          - "the assigned VolunteerDriver.status == ACTIVE"
        side_effects:
          - "increments Route.version by 1"

  - entity: VolunteerDriver
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /drivers/{id}/activate"
        actor: ProgramAdmin
        preconditions: ["driver.status == PENDING"]
        side_effects:
          - "increments VolunteerDriver.version by 1"

  - entity: Delivery
    initial_state: SCHEDULED
    terminal_states: [SKIPPED, CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /deliveries/{id}/complete (outcome=DELIVERED)"
        actor: VolunteerDriver
        preconditions:
          - "delivery.status == SCHEDULED"
          - "the acting VolunteerDriver (X-User-ID) is the driver_id of delivery.route_id"
        side_effects:
          - "sets delivery.oaa_units_accrued = delivery.meal_count"
          - "sets delivery.delivered_at"
          - "adds delivery.meal_count to Client.lifetime_oaa_units (cascade, ledger sync)"
          - "resets Client.consecutive_no_answer to 0"
          - "creates a WellnessCheck with outcome OK for this delivery/client"
          - "increments Delivery.version by 1; increments Client.version by 1"
      - from: SCHEDULED
        to: NO_ANSWER
        trigger: "POST /deliveries/{id}/complete (outcome=NO_ANSWER)"
        actor: VolunteerDriver
        preconditions:
          - "delivery.status == SCHEDULED"
          - "the acting VolunteerDriver (X-User-ID) is the driver_id of delivery.route_id"
        side_effects:
          - "creates a WellnessCheck with outcome NO_ANSWER for this delivery/client (cascade hop 1)"
          - "that WellnessCheck increments Client.consecutive_no_answer by 1 (cascade hop 2)"
          - "that WellnessCheck opens a WelfareAlert (status OPEN) referencing it, severity from calc welfare_severity (cascade hop 3)"
          - "increments Delivery.version by 1; increments Client.version by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /deliveries/{id}/complete (outcome=SKIPPED)"
        actor: VolunteerDriver
        preconditions:
          - "delivery.status == SCHEDULED"
          - "the acting VolunteerDriver (X-User-ID) is the driver_id of delivery.route_id"
        side_effects:
          - "no OAA accrual; Client.consecutive_no_answer unchanged"
          - "increments Delivery.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "MealPlan suspend/cancel or Client discharge (system cascade)"
        actor: system
        preconditions: ["delivery.status == SCHEDULED"]
        side_effects:
          - "increments Delivery.version by 1"
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /deliveries/{id}/void"
        actor: RouteManager
        preconditions: ["delivery.status == DELIVERED"]
        side_effects:
          - "subtracts delivery.meal_count from Client.lifetime_oaa_units (compensation, ledger sync)"
          - "sets delivery.oaa_units_accrued = 0"
          - "increments Delivery.version by 1; increments Client.version by 1"

  - entity: WelfareAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /welfare-alerts/{id}/acknowledge"
        actor: VolunteerDriver
        preconditions: ["alert.status == OPEN"]
        side_effects:
          - "sets alert.acknowledged_by = X-User-ID"
          - "increments WelfareAlert.version by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /welfare-alerts/{id}/escalate"
        actor: RouteManager
        preconditions: ["alert.status == OPEN"]
        side_effects:
          - "increments WelfareAlert.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /welfare-alerts/{id}/escalate"
        actor: RouteManager
        preconditions: ["alert.status == ACKNOWLEDGED"]
        side_effects:
          - "increments WelfareAlert.version by 1"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /welfare-alerts/{id}/resolve"
        actor: RouteManager
        preconditions: ["alert.status == ACKNOWLEDGED"]
        side_effects:
          - "increments WelfareAlert.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /welfare-alerts/{id}/resolve"
        actor: RouteManager
        preconditions: ["alert.status == ESCALATED"]
        side_effects:
          - "increments WelfareAlert.version by 1"

  - entity: Contribution
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /contributions/{id}/void"
        actor: ContributionClerk
        preconditions: ["contribution.status == RECORDED"]
        side_effects:
          - "subtracts amount_cents from Client.donation_balance_cents (compensation)"
          - "increments Contribution.version by 1; increments Client.version by 1"

  - entity: VacationHold
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /vacation-holds/{id}/end"
        actor: IntakeCoordinator
        preconditions: ["hold.status == ACTIVE"]
        side_effects:
          - "Client transitions ON_HOLD -> ACTIVE (cascade), which resumes the SUSPENDED MealPlan"
          - "increments VacationHold.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "Client discharge (system cascade)"
        actor: system
        preconditions: ["hold.status == ACTIVE"]
        side_effects:
          - "increments VacationHold.version by 1"

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: meal-plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/meal-plans"
    occ_field: "expected_client_version"
    description: |
      Creating a MealPlan against a Client whose version has advanced since the
      client was last observed is rejected. A newly created plan legitimately
      supersedes the client's prior ACTIVE plan (cancelling it), so a create
      that carries a stale expected_client_version is rejected before it can
      supersede a plan the writer never saw. Stated purely in OCC terms: the
      supplied expected_client_version no longer equals Client.version.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: client_oaa_eligibility
    trigger: "on Client creation (POST /clients)"
    algorithm: threshold
    formula: |
      age_years = floor( (created_at_date - birth_date) / 365.2425 days )
      oaa_eligible = (age_years >= OAA_MIN_AGE)
    input_set: "the single Client being created; birth_date vs created_at"
    constants:
      OAA_MIN_AGE: 60
    precision: "integer years, floor"

  - name: client_income_tier
    trigger: "on Client creation (POST /clients) and on PATCH /clients/{id} when monthly_income_cents or household_size changes"
    algorithm: threshold
    formula: |
      poverty_monthly_cents = FPL_BASE_MONTHLY_CENTS + (household_size - 1) * FPL_INCREMENT_CENTS
      ratio = monthly_income_cents / poverty_monthly_cents          # exact rational, not rounded
      if ratio <= TIER_A_MAX_RATIO:      income_tier = TIER_A
      elif ratio <= TIER_B_MAX_RATIO:    income_tier = TIER_B
      else:                              income_tier = TIER_C
    input_set: "the single Client; boundaries are inclusive on the upper edge (<=)"
    constants:
      FPL_BASE_MONTHLY_CENTS: 125500
      FPL_INCREMENT_CENTS: 44000
      TIER_A_MAX_RATIO: 1.00
      TIER_B_MAX_RATIO: 1.85
    precision: "ratio compared exactly; <= is inclusive"

  - name: nutrition_risk_category
    trigger: "on Assessment creation (POST /clients/{id}/assessments)"
    algorithm: threshold
    formula: |
      if nutrition_determine_points >= HIGH_MIN:        nutrition_risk_category = HIGH
      elif nutrition_determine_points >= MODERATE_MIN:  nutrition_risk_category = MODERATE
      else:                                             nutrition_risk_category = GOOD
    input_set: "the single Assessment"
    constants:
      MODERATE_MIN: 3
      HIGH_MIN: 6
    precision: ">= is inclusive; HIGH begins exactly at 6 (5 is MODERATE)"

  - name: functional_level
    trigger: "on Assessment creation (POST /clients/{id}/assessments)"
    algorithm: threshold
    formula: |
      if adl_score >= DEPENDENT_MIN:      functional_level = DEPENDENT
      elif adl_score >= PARTIAL_MIN:      functional_level = PARTIAL
      else:                               functional_level = INDEPENDENT
    input_set: "the single Assessment"
    constants:
      PARTIAL_MIN: 2
      DEPENDENT_MIN: 5
    precision: ">= inclusive"

  - name: weekly_meal_count
    trigger: "on MealPlan creation (POST /clients/{id}/meal-plans)"
    algorithm: constraint_propagation
    formula: |
      n_days = count(delivery_days)
      if meal_type == FROZEN:
        # frozen is delivered in ONE bulk run/week covering a full 7-day week
        weekly_meal_count = min(meals_per_day * FROZEN_DAYS_COVERED, MAX_WEEKLY_MEALS)
      else:  # HOT or THERAPEUTIC: fresh meals only on each service day
        weekly_meal_count = min(meals_per_day * n_days, MAX_WEEKLY_MEALS)
    input_set: "the single MealPlan; branch on meal_type; three inputs (meal_type, meals_per_day, n_days) plus the MAX cap"
    constants:
      FROZEN_DAYS_COVERED: 7
      MAX_WEEKLY_MEALS: 21
    precision: "integer meals; min() cap applied after multiplication"

  - name: delivery_meal_count
    trigger: "on Delivery creation (POST /deliveries)"
    algorithm: constraint_propagation
    formula: |
      if meal_plan.meal_type == FROZEN:
        # the single weekly bulk run carries the whole week's meals
        meal_count = meal_plan.weekly_meal_count
      else:  # HOT or THERAPEUTIC: one delivery per service day carries that day's meals
        meal_count = meal_plan.meals_per_day
    input_set: "the delivery's MealPlan; branch on meal_type"
    precision: "integer meals"

  - name: suggested_contribution
    trigger: "on MealPlan creation (per-meal) and on read of GET /clients/{id}/summary (monthly)"
    algorithm: tiered_pricing
    formula: |
      # per-meal, rounded to the cent FIRST (pinned rounding order)
      tier_factor = TIER_FACTORS[client.income_tier]
      suggested_contribution_per_meal_cents = round_half_up(BASE_MEAL_COST_CENTS * tier_factor)
      # monthly total: multiply the ALREADY-ROUNDED per-meal figure (NOT base*factor*count then round)
      projected_monthly_meals = meal_plan.weekly_meal_count * WEEKS_PER_MONTH
      suggested_contribution_cents = suggested_contribution_per_meal_cents * projected_monthly_meals
    input_set: "client.income_tier + the client's ACTIVE MealPlan; if no ACTIVE plan, monthly suggested = 0"
    constants:
      BASE_MEAL_COST_CENTS: 725
      WEEKS_PER_MONTH: 4
      TIER_FACTORS: { TIER_A: 0.15, TIER_B: 0.35, TIER_C: 0.55 }
    precision: "round_half_up to whole cents at the per-meal step; monthly is exact integer product"
    variants:
      - name: provisional_at_intake
        when: "income_tier as computed at Client creation (POST /clients)"
        difference: "uses the intake income_tier; produces the initial per-meal / monthly figures"
      - name: reconciled_after_income_update
        when: "after PATCH /clients/{id} changes monthly_income_cents (and thus income_tier)"
        difference: "recomputes per-meal and monthly from the NEW income_tier; the delta vs provisional is the reconciliation"

  - name: oaa_units_reporting
    trigger: "on GET /clients/{id}/summary; delivered variant also maintained live on Client.lifetime_oaa_units"
    algorithm: aggregation
    formula: |
      # provisioned: what the ACTIVE plan is scheduled to deliver in a month
      provisioned_monthly_units = (client's ACTIVE MealPlan).weekly_meal_count * WEEKS_PER_MONTH
      # delivered: units actually credited by DELIVERED (non-VOIDED) deliveries
      delivered_units = sum( d.meal_count for d in Delivery
                             where d.client_id == client.id and d.status == DELIVERED )
    input_set: "provisioned = ACTIVE MealPlan only; delivered = Delivery rows with status == DELIVERED (VOIDED/SKIPPED/NO_ANSWER/CANCELLED excluded)"
    constants:
      WEEKS_PER_MONTH: 4
    precision: "integer units"
    variants:
      - name: provisioned_units
        when: "planning / capacity view"
        difference: "counts scheduled/planned weekly meals * 4; independent of what was actually delivered"
      - name: delivered_units
        when: "OAA reporting view (units reportable to the funder)"
        difference: "counts only DELIVERED deliveries' meal_count; diverges from provisioned whenever a delivery is SKIPPED, NO_ANSWER, CANCELLED, or VOIDED"

  - name: welfare_severity
    trigger: "on WelfareAlert creation (side effect of a NO_ANSWER delivery)"
    algorithm: threshold
    formula: |
      # evaluated AFTER Client.consecutive_no_answer has been incremented by this event
      severity = HIGH if client.consecutive_no_answer >= HIGH_SEVERITY_MIN else LOW
    input_set: "the client's consecutive_no_answer counter after the triggering increment"
    constants:
      HIGH_SEVERITY_MIN: 2
    precision: ">= inclusive; the 2nd consecutive NO_ANSWER yields HIGH"

  - name: donation_balance_reconciliation
    trigger: "on Contribution create/void; read on GET /clients/{id}/summary"
    algorithm: aggregation
    formula: |
      donation_balance_cents = sum( c.amount_cents for c in Contribution
                                    where c.client_id == client.id and c.status == RECORDED )
    input_set: "Contribution rows for the client with status == RECORDED (VOIDED excluded)"
    precision: "integer cents; VOIDED contributions never counted"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint (per §1.7 RBAC)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_safety
    check: "on POST /deliveries/{id}/complete the acting VolunteerDriver's X-User-ID equals the driver_id of the delivery's route"
    error_id: ERR_NOT_ROUTE_DRIVER
    http_status: 403
    applies_to: "POST /deliveries/{id}/complete"

  - priority: 4
    category: business_constraint
    check: "request body has all required fields with correct primitive types"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "field values within range / valid enum members (household_size>=1, amount_cents>0, adl_score 0..6, nutrition_determine_points 0..21, meals_per_day 1..3, end_date>=start_date, non-empty delivery_days/service_days, birth_date before now)"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: all

  - priority: 6
    category: existence
    check: "path-referenced resource exists (validated left-to-right in path)"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameter endpoints (returns the resource-specific NOT_FOUND error)"

  - priority: 7
    category: existence
    check: "body-referenced foreign keys exist (assessment_id, route_id, meal_plan_id, driver_id, client_id)"
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /clients/{id}/meal-plans, POST /routes/{id}/assign-driver, POST /deliveries (returns the resource-specific NOT_FOUND error)"

  - priority: 8
    category: business_referential
    check: "on POST /clients/{id}/meal-plans the referenced assessment_id belongs to the same client_id in the path"
    error_id: ERR_ASSESSMENT_CLIENT_MISMATCH
    http_status: 422
    applies_to: "POST /clients/{id}/meal-plans"

  - priority: 9
    category: state
    check: "on POST /clients/{id}/meal-plans the referenced Assessment.status == FINALIZED"
    error_id: ERR_ASSESSMENT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /clients/{id}/meal-plans"

  - priority: 9
    category: state
    check: "on POST /clients/{id}/meal-plans the referenced Route.status == ACTIVE"
    error_id: ERR_ROUTE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /clients/{id}/meal-plans"

  - priority: 9
    category: state
    check: "on POST /clients/{id}/meal-plans client.enrollment_status in {ASSESSED, ACTIVE}"
    error_id: ERR_CLIENT_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /clients/{id}/meal-plans, POST /clients/{id}/activate (activate additionally requires exactly ASSESSED)"

  - priority: 9
    category: state
    check: "client.enrollment_status == ACTIVE (delivery scheduling requires an active client; vacation-hold creation requires an active client)"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deliveries, POST /clients/{id}/vacation-holds"

  - priority: 9
    category: state
    check: "on POST /deliveries the referenced MealPlan.status == ACTIVE (also used by POST /meal-plans/{id}/cancel)"
    error_id: ERR_MEAL_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deliveries, POST /meal-plans/{id}/cancel"

  - priority: 9
    category: state
    check: "target resource is in a valid state for the transition (assessment finalize needs DRAFT; delivery complete needs SCHEDULED; delivery void needs DELIVERED; hold end needs ACTIVE; alert transitions need their from-state; driver activate needs PENDING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /assessments/{id}/finalize, POST /deliveries/{id}/complete, POST /deliveries/{id}/void, POST /vacation-holds/{id}/end, POST /welfare-alerts/{id}/*, POST /drivers/{id}/activate (returns the resource-specific state error: ERR_ASSESSMENT_NOT_DRAFT, ERR_DELIVERY_NOT_SCHEDULED, ERR_DELIVERY_NOT_DELIVERED, ERR_HOLD_NOT_ACTIVE, ERR_ALERT_INVALID_STATE, ERR_DRIVER_NOT_PENDING)"

  - priority: 9
    category: state
    check: "on POST /routes/{id}/activate the route has a driver assigned"
    error_id: ERR_ROUTE_HAS_NO_DRIVER
    http_status: 409
    applies_to: "POST /routes/{id}/activate"

  - priority: 10
    category: state
    check: "on POST /routes/{id}/activate the assigned VolunteerDriver.status == ACTIVE (cross-entity)"
    error_id: ERR_DRIVER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /routes/{id}/activate"

  - priority: 11
    category: business_safety
    check: "on POST /clients/{id}/meal-plans with meal_type == THERAPEUTIC, the referenced Assessment.therapeutic_diet_required == true AND Assessment.therapeutic_diet_type == plan.therapeutic_diet_type"
    error_id: ERR_THERAPEUTIC_DIET_MISMATCH
    http_status: 422
    applies_to: "POST /clients/{id}/meal-plans"

  - priority: 12
    category: business_temporal
    check: "on POST /deliveries the weekday of scheduled_date is a member of meal_plan.delivery_days"
    error_id: ERR_DELIVERY_DAY_MISMATCH
    http_status: 422
    applies_to: "POST /deliveries"

  - priority: 12
    category: business_temporal
    check: "on POST /clients/{id}/vacation-holds no other VacationHold for the client with status in {ACTIVE, COMPLETED} overlaps [start_date,end_date] inclusive (touching endpoints count as overlap: start_new <= end_existing AND start_existing <= end_new; CANCELLED holds are ignored)"
    error_id: ERR_HOLD_OVERLAP
    http_status: 409
    applies_to: "POST /clients/{id}/vacation-holds"

  - priority: 12
    category: business_temporal
    check: "on POST /routes/{id}/assign-driver the driver is not already assigned to another Route (status DRAFT or ACTIVE) whose service_days share at least one weekday with this route's service_days"
    error_id: ERR_DRIVER_DAY_CONFLICT
    http_status: 409
    applies_to: "POST /routes/{id}/assign-driver"

  - priority: 13
    category: business_constraint
    check: "on POST /clients/{id}/meal-plans the referenced Route.zone == client.address_zone"
    error_id: ERR_ROUTE_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /clients/{id}/meal-plans"

  - priority: 13
    category: business_constraint
    check: "on POST /deliveries the sum of meal_count of existing SCHEDULED deliveries on route_id for scheduled_date, plus this delivery's meal_count, does not exceed route.max_meals_per_run"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /deliveries"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_client_version equals current Client.version"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /clients/{id}/meal-plans, PATCH /clients/{id}"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "Intake a new client (starts INTAKE)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, birth_date, household_size, monthly_income_cents, address_zone, phone]
    output: Client
    side_effects: ["computes oaa_eligible (calc client_oaa_eligibility)", "computes income_tier (calc client_income_tier)"]

  - method: GET
    path: "/clients/{id}"
    description: "Read a client"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: Client

  - method: PATCH
    path: "/clients/{id}"
    description: "Update client demographics/income; recomputes income_tier (OCC-guarded)"
    roles: [IntakeCoordinator]
    code: 200
    input: ["household_size?", "monthly_income_cents?", "address_zone?", "phone?", expected_client_version]
    output: Client
    side_effects: ["recomputes income_tier (calc client_income_tier)", "recomputes suggested_contribution reconciled variant", "increments Client.version by 1"]

  - method: POST
    path: "/clients/{id}/activate"
    description: "Enroll an assessed client into active service"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Client
    side_effects: ["Client ASSESSED -> ACTIVE", "increments Client.version by 1"]

  - method: POST
    path: "/clients/{id}/discharge"
    description: "Discharge a client; cascades to plan, deliveries and holds"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Client
    side_effects: ["Client -> DISCHARGED", "cancels ACTIVE/SUSPENDED MealPlan", "cancels SCHEDULED Deliveries", "cancels ACTIVE VacationHolds", "increments Client.version by 1"]

  - method: GET
    path: "/clients/{id}/summary"
    description: "Computed client roll-up (contribution, OAA units, tier)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: "{ income_tier: string, oaa_eligible: boolean, suggested_contribution_cents: integer, donation_balance_cents: integer, provisioned_monthly_units: integer, delivered_units: integer, lifetime_oaa_units: integer }"

  # ---- Assessments ----
  - method: POST
    path: "/clients/{id}/assessments"
    description: "Create a DRAFT nutritional/functional assessment"
    roles: [Nutritionist]
    code: 201
    input: [nutrition_determine_points, adl_score, "therapeutic_diet_required?", "therapeutic_diet_type?", recommended_meals_per_day]
    output: Assessment
    side_effects: ["computes nutrition_risk_category (calc)", "computes functional_level (calc)"]

  - method: GET
    path: "/clients/{id}/assessments"
    description: "List a client's assessments (reverse-reachability for Assessment.client_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Assessment[]"

  - method: POST
    path: "/assessments/{id}/finalize"
    description: "Finalize a DRAFT assessment; supersedes prior; may advance client to ASSESSED"
    roles: [Nutritionist]
    code: 200
    input: []
    output: Assessment
    side_effects: ["Assessment DRAFT -> FINALIZED", "prior FINALIZED assessment -> SUPERSEDED", "Client INTAKE -> ASSESSED if applicable", "increments Assessment.version by 1"]

  # ---- Meal Plans ----
  - method: POST
    path: "/clients/{id}/meal-plans"
    description: "Create an ACTIVE standing meal plan; supersedes the client's prior ACTIVE plan (OCC-guarded on Client)"
    roles: [RouteManager]
    code: 201
    input: [assessment_id, route_id, meal_type, "therapeutic_diet_type?", meals_per_day, delivery_days, expected_client_version]
    output: MealPlan
    side_effects: ["computes weekly_meal_count (calc)", "computes suggested_contribution_per_meal_cents (calc)", "prior ACTIVE MealPlan -> CANCELLED (cancels its SCHEDULED deliveries)", "increments Client.version by 1"]

  - method: GET
    path: "/meal-plans/{id}"
    description: "Read a meal plan"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: MealPlan

  - method: GET
    path: "/meal-plans"
    description: "List/filter meal plans (reverse-reachability for MealPlan.client_id/assessment_id/route_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["client_id?", "assessment_id?", "route_id?", "status?", "limit?", "offset?"]
    output: "MealPlan[]"

  - method: POST
    path: "/meal-plans/{id}/cancel"
    description: "Cancel an ACTIVE meal plan"
    roles: [RouteManager]
    code: 200
    input: []
    output: MealPlan
    side_effects: ["MealPlan ACTIVE -> CANCELLED", "cancels its SCHEDULED deliveries", "increments MealPlan.version by 1"]

  # ---- Routes ----
  - method: POST
    path: "/routes"
    description: "Create a delivery route (DRAFT, no driver)"
    roles: [RouteManager]
    code: 201
    input: [name, zone, service_days, max_meals_per_run]
    output: Route

  - method: GET
    path: "/routes/{id}"
    description: "Read a route"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: Route

  - method: GET
    path: "/routes"
    description: "List/filter routes (reverse-reachability for Route.driver_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["driver_id?", "zone?", "status?", "limit?", "offset?"]
    output: "Route[]"

  - method: POST
    path: "/routes/{id}/assign-driver"
    description: "Assign a volunteer driver to a route (driver-day overlap enforced)"
    roles: [RouteManager]
    code: 200
    input: [driver_id]
    output: Route
    side_effects: ["sets route.driver_id", "increments Route.version by 1"]

  - method: POST
    path: "/routes/{id}/activate"
    description: "Activate a route (requires an ACTIVE assigned driver)"
    roles: [RouteManager]
    code: 200
    input: []
    output: Route
    side_effects: ["Route DRAFT -> ACTIVE", "increments Route.version by 1"]

  # ---- Volunteer Drivers ----
  - method: POST
    path: "/drivers"
    description: "Register a volunteer driver (PENDING)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, phone]
    output: VolunteerDriver

  - method: GET
    path: "/drivers"
    description: "List/filter volunteer drivers"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VolunteerDriver[]"

  - method: POST
    path: "/drivers/{id}/activate"
    description: "Activate a PENDING volunteer driver"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: VolunteerDriver
    side_effects: ["VolunteerDriver PENDING -> ACTIVE", "increments VolunteerDriver.version by 1"]

  # ---- Deliveries ----
  - method: POST
    path: "/deliveries"
    description: "Schedule a delivery for a meal plan on a date"
    roles: [RouteManager]
    code: 201
    input: [meal_plan_id, scheduled_date]
    output: Delivery
    side_effects: ["copies client_id/route_id/meal_type from plan", "computes meal_count (calc delivery_meal_count)", "enforces route capacity per date"]

  - method: GET
    path: "/deliveries/{id}"
    description: "Read a delivery"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: Delivery

  - method: GET
    path: "/deliveries"
    description: "List/filter deliveries (reverse-reachability for Delivery.meal_plan_id/client_id/route_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["meal_plan_id?", "client_id?", "route_id?", "status?", "scheduled_date?", "limit?", "offset?"]
    output: "Delivery[]"

  - method: POST
    path: "/deliveries/{id}/complete"
    description: "Record delivery outcome (DELIVERED/NO_ANSWER/SKIPPED); driver must own the route"
    roles: [VolunteerDriver]
    code: 200
    input: [outcome, "wellness_notes?"]
    output: Delivery
    side_effects: ["DELIVERED: accrues meal_count to Client.lifetime_oaa_units, resets consecutive_no_answer, creates WellnessCheck(OK)", "NO_ANSWER: creates WellnessCheck(NO_ANSWER) -> increments consecutive_no_answer -> opens WelfareAlert", "SKIPPED: no accrual", "increments Delivery.version by 1"]

  - method: POST
    path: "/deliveries/{id}/void"
    description: "Void a DELIVERED delivery (compensating action)"
    roles: [RouteManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["Delivery DELIVERED -> VOIDED", "subtracts meal_count from Client.lifetime_oaa_units", "sets oaa_units_accrued = 0", "increments Delivery.version by 1"]

  # ---- Wellness Checks ----
  - method: GET
    path: "/wellness-checks/{id}"
    description: "Read a wellness check"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: WellnessCheck

  - method: GET
    path: "/wellness-checks"
    description: "List/filter wellness checks (reverse-reachability for WellnessCheck.delivery_id/client_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["delivery_id?", "client_id?", "outcome?", "limit?", "offset?"]
    output: "WellnessCheck[]"

  # ---- Welfare Alerts ----
  - method: GET
    path: "/welfare-alerts/{id}"
    description: "Read a welfare alert"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: WelfareAlert

  - method: GET
    path: "/welfare-alerts"
    description: "List/filter welfare alerts (reverse-reachability for WelfareAlert.client_id/triggering_wellness_check_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["client_id?", "triggering_wellness_check_id?", "status?", "severity?", "limit?", "offset?"]
    output: "WelfareAlert[]"

  - method: POST
    path: "/welfare-alerts/{id}/acknowledge"
    description: "Acknowledge an OPEN welfare alert"
    roles: [VolunteerDriver, RouteManager]
    code: 200
    input: []
    output: WelfareAlert
    side_effects: ["OPEN -> ACKNOWLEDGED", "sets acknowledged_by", "increments WelfareAlert.version by 1"]

  - method: POST
    path: "/welfare-alerts/{id}/escalate"
    description: "Escalate an OPEN or ACKNOWLEDGED welfare alert"
    roles: [RouteManager]
    code: 200
    input: []
    output: WelfareAlert
    side_effects: ["OPEN/ACKNOWLEDGED -> ESCALATED", "increments WelfareAlert.version by 1"]

  - method: POST
    path: "/welfare-alerts/{id}/resolve"
    description: "Resolve an ACKNOWLEDGED or ESCALATED welfare alert"
    roles: [RouteManager, IntakeCoordinator]
    code: 200
    input: []
    output: WelfareAlert
    side_effects: ["ACKNOWLEDGED/ESCALATED -> RESOLVED", "increments WelfareAlert.version by 1"]

  # ---- Contributions ----
  - method: POST
    path: "/clients/{id}/contributions"
    description: "Record a donation for a client"
    roles: [ContributionClerk]
    code: 201
    input: [amount_cents, period_month]
    output: Contribution
    side_effects: ["adds amount_cents to Client.donation_balance_cents", "increments Client.version by 1"]

  - method: GET
    path: "/contributions/{id}"
    description: "Read a contribution"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: Contribution

  - method: GET
    path: "/contributions"
    description: "List/filter contributions (reverse-reachability for Contribution.client_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["client_id?", "status?", "period_month?", "limit?", "offset?"]
    output: "Contribution[]"

  - method: POST
    path: "/contributions/{id}/void"
    description: "Void a RECORDED contribution (compensating action)"
    roles: [ContributionClerk]
    code: 200
    input: []
    output: Contribution
    side_effects: ["RECORDED -> VOIDED", "subtracts amount_cents from Client.donation_balance_cents", "increments Client.version by 1"]

  # ---- Vacation Holds ----
  - method: POST
    path: "/clients/{id}/vacation-holds"
    description: "Place an ACTIVE vacation hold on a client (suspends the plan, cancels in-window deliveries)"
    roles: [IntakeCoordinator]
    code: 201
    input: [start_date, end_date]
    output: VacationHold
    side_effects: ["Client ACTIVE -> ON_HOLD", "ACTIVE MealPlan -> SUSPENDED", "SCHEDULED deliveries within [start_date,end_date] -> CANCELLED", "increments Client.version by 1"]

  - method: GET
    path: "/vacation-holds/{id}"
    description: "Read a vacation hold"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: []
    output: VacationHold

  - method: GET
    path: "/vacation-holds"
    description: "List/filter vacation holds (reverse-reachability for VacationHold.client_id)"
    roles: [IntakeCoordinator, Nutritionist, RouteManager, ProgramAdmin, ContributionClerk, VolunteerDriver]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "VacationHold[]"

  - method: POST
    path: "/vacation-holds/{id}/end"
    description: "End an ACTIVE vacation hold (resumes the plan)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: VacationHold
    side_effects: ["VacationHold ACTIVE -> COMPLETED", "Client ON_HOLD -> ACTIVE", "SUSPENDED MealPlan -> ACTIVE", "increments VacationHold.version by 1"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this endpoint"
  - id: ERR_NOT_ROUTE_DRIVER
    http: 403
    condition: "acting VolunteerDriver's X-User-ID is not the driver of the delivery's route"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field or wrong primitive type"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "field out of range or invalid enum member (incl. end_date<start_date, empty delivery_days/service_days, birth_date not in past)"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "referenced Client does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "referenced Assessment does not exist"
  - id: ERR_MEAL_PLAN_NOT_FOUND
    http: 404
    condition: "referenced MealPlan does not exist"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "referenced Route does not exist"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "referenced VolunteerDriver does not exist"
  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "referenced Delivery does not exist"
  - id: ERR_WELLNESS_CHECK_NOT_FOUND
    http: 404
    condition: "referenced WellnessCheck does not exist"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "referenced WelfareAlert does not exist"
  - id: ERR_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "referenced Contribution does not exist"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "referenced VacationHold does not exist"
  - id: ERR_ASSESSMENT_CLIENT_MISMATCH
    http: 422
    condition: "meal-plan's assessment_id belongs to a different client than the path client"
  - id: ERR_ASSESSMENT_NOT_FINALIZED
    http: 409
    condition: "meal-plan references an Assessment whose status is not FINALIZED"
  - id: ERR_ROUTE_NOT_ACTIVE
    http: 409
    condition: "meal-plan references a Route whose status is not ACTIVE"
  - id: ERR_CLIENT_NOT_ASSESSED
    http: 409
    condition: "operation requires client ASSESSED (activate) or ASSESSED/ACTIVE (meal-plan create)"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "operation requires client.enrollment_status == ACTIVE"
  - id: ERR_MEAL_PLAN_NOT_ACTIVE
    http: 409
    condition: "operation requires MealPlan.status == ACTIVE"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "generic invalid state transition (resource-specific alias returned where noted)"
  - id: ERR_ASSESSMENT_NOT_DRAFT
    http: 409
    condition: "finalize called on an Assessment not in DRAFT"
  - id: ERR_DELIVERY_NOT_SCHEDULED
    http: 409
    condition: "complete called on a Delivery not in SCHEDULED"
  - id: ERR_DELIVERY_NOT_DELIVERED
    http: 409
    condition: "void called on a Delivery not in DELIVERED"
  - id: ERR_HOLD_NOT_ACTIVE
    http: 409
    condition: "end called on a VacationHold not in ACTIVE"
  - id: ERR_ALERT_INVALID_STATE
    http: 409
    condition: "welfare-alert transition invalid from current state"
  - id: ERR_DRIVER_NOT_PENDING
    http: 409
    condition: "activate called on a VolunteerDriver not in PENDING"
  - id: ERR_ROUTE_HAS_NO_DRIVER
    http: 409
    condition: "activate called on a Route with no assigned driver"
  - id: ERR_DRIVER_NOT_ACTIVE
    http: 409
    condition: "route activate requires the assigned driver to be ACTIVE"
  - id: ERR_THERAPEUTIC_DIET_MISMATCH
    http: 422
    condition: "THERAPEUTIC meal-plan's diet type/required flag does not match the referenced Assessment"
  - id: ERR_DELIVERY_DAY_MISMATCH
    http: 422
    condition: "scheduled_date weekday not in meal_plan.delivery_days"
  - id: ERR_HOLD_OVERLAP
    http: 409
    condition: "new vacation hold overlaps (inclusive/touching) an existing ACTIVE or COMPLETED hold for the client"
  - id: ERR_DRIVER_DAY_CONFLICT
    http: 409
    condition: "driver already assigned to another route sharing a service weekday"
  - id: ERR_ROUTE_ZONE_MISMATCH
    http: 422
    condition: "meal-plan route zone != client address_zone"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "scheduling delivery would exceed route.max_meals_per_run for that date"
  - id: ERR_STALE_CLIENT_VERSION
    http: 412
    condition: "expected_client_version != current Client.version (OCC)"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: IntakeCoordinator
    description: "Owns client intake, activation, discharge, vacation holds; can resolve alerts"
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "PATCH /clients/{id}"
      - "POST /clients/{id}/activate"
      - "POST /clients/{id}/discharge"
      - "POST /clients/{id}/vacation-holds"
      - "POST /vacation-holds/{id}/end"
    shared_operations:
      - "POST /welfare-alerts/{id}/resolve (shared with RouteManager)"
      - "all GET reads"

  - name: Nutritionist
    description: "Owns nutritional/functional assessments"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/assessments"
      - "POST /assessments/{id}/finalize"
    shared_operations:
      - "all GET reads"

  - name: RouteManager
    description: "Owns routes, driver assignment, meal plans, delivery scheduling, delivery void, alert escalation"
    identity: opaque
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/assign-driver"
      - "POST /routes/{id}/activate"
      - "POST /clients/{id}/meal-plans"
      - "POST /meal-plans/{id}/cancel"
      - "POST /deliveries"
      - "POST /deliveries/{id}/void"
      - "POST /welfare-alerts/{id}/escalate"
    shared_operations:
      - "POST /welfare-alerts/{id}/acknowledge (shared with VolunteerDriver)"
      - "POST /welfare-alerts/{id}/resolve (shared with IntakeCoordinator)"
      - "all GET reads"

  - name: ProgramAdmin
    description: "Owns the volunteer-driver roster"
    identity: opaque
    exclusive_operations:
      - "POST /drivers"
      - "POST /drivers/{id}/activate"
    shared_operations:
      - "all GET reads"

  - name: ContributionClerk
    description: "Records and voids donations"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/contributions"
      - "POST /contributions/{id}/void"
    shared_operations:
      - "all GET reads"

  - name: VolunteerDriver
    description: "Records deliveries and wellness checks on own route; can acknowledge alerts"
    identity: "entity_backed:VolunteerDriver"
    exclusive_operations:
      - "POST /deliveries/{id}/complete (only for a delivery whose route.driver_id == X-User-ID)"
    shared_operations:
      - "POST /welfare-alerts/{id}/acknowledge (shared with RouteManager)"
      - "all GET reads"


