    output: CertificationRecord
    side_effects: ["status initialized to VALID", "recertification_due_at computed", "increments Piercer.version by 1", "Recomputes Piercer.active_certification_id via selector piercer_governing_certification", "Recomputes Piercer.eligibility_score via piercer_eligibility_score"]

  - method: GET
    path: "/piercing-services/certifications"
    description: "List certification records, optionally filtered by piercer"
    roles: [AnyAuthenticated]
    code: 200
    input: ["piercer_id?"]
    output: "CertificationRecord[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/certifications/{certificationId}"
    description: "Get one certification record"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: CertificationRecord
    side_effects: []

  - method: POST
