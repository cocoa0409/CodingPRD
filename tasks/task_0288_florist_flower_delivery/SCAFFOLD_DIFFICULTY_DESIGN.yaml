              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "Order.${ord_id}.fulfillment_status == BOOKED"
            - "the adjacent [720,900) booking succeeds because half-open intervals do not overlap at the shared endpoint 720"

      - name: florist_daily_aggregate_capacity_overlap
        grounds:
          - validations[priority=12]
          - entities.Florist.fields.daily_capacity
          - errors[ERR_NO_FLORIST_AVAILABLE]
        distinguishing_aspect: |
          INTERVAL SEMANTICS B — aggregate per-DAY capacity on Florist (not window geometry): two
          orders on the SAME delivery date but DISJOINT windows still both consume the florist's
          daily_capacity, so with daily_capacity=1 the second booking fails even though its window
          does not overlap the first. Different resource and different interval treatment than rule8a.
        test_recipe:
          setup:
            - "Single florist daily_capacity=1; two orders same date 2026-09-10 but non-overlapping windows; first booked."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
