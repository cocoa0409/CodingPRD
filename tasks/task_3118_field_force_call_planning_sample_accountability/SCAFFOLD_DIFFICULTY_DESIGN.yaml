  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: variance_pct_2_00_exact_triggers_counseling_but_1_99_does_not
        grounds:
          - calculations.count_variance_and_discipline
          - entities.InventoryCountSession.fields.disciplinary_tier
        distinguishing_aspect: |
          Metric = count variance_pct (numeric threshold, >= on the lower edge).
          At exactly 2.00% the tier is COUNSELING; at 1.99% it is NONE. The
          boundary is crossed by a single hundredth of a percent.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Custodian C (manager M), counter K."
            - "Session A: C holds expected 10000 units across one lot (issued 10000); counted 9801 -> variance_pct 1.99 -> NONE."
            - "Session B (window >= 24h after A ends): counted 9800 -> variance_pct 2.00 -> COUNSELING."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "IL-01", name: "Illinois" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
