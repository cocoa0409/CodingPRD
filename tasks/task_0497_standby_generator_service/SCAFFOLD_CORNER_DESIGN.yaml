# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe) — task_0497
# Enumerative coverage of testable claims beyond the §1.8 difficulty instances.
# section: / claim_type: values come from references/claim-extraction-guide.md.
# excluded_because stubs cite §1.8 instances by name (must exist there).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with email/full_name/service_address returns 201 and a Customer with system id, created_at, version=1, registration defaults; elevation_ft defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "Cee", service_address: "1 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
          assert:
            - "Response code 201"
            - "Customer.${cid}.elevation_ft == 0 (default applied)"
            - "Customer.${cid}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{bogus} for a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 404 with error_id == ERR_NOT_FOUND"

      - name: create_project_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.GeneratorProject.fields.fuel_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /projects without fuel_type (a required input with no default) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rf@x.com", full_name: "RF", service_address: "2 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cid}" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 400 with error_id == ERR_INVALID_REQUEST"

      - name: load_assessment_starting_below_running_returns_422
        claim_type: Type Constraints
        grounds: [entities.LoadAssessment.fields.appliances, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An appliance with starting_watts < running_watts violates the field rule; POST returns 422 ERR_VALIDATION (parses but semantically invalid)."
        test_recipe:
          setup: ["A customer and a DRAFT project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "vc@x.com", full_name: "VC", service_address: "3 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/load-assessments"
              payload: { appliances: [ {name: "bad", running_watts: 5000, starting_watts: 1000} ] }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 422 with error_id == ERR_VALIDATION"

      - name: empty_appliances_array_returns_400
        claim_type: Type Constraints
        grounds: [entities.LoadAssessment.fields.appliances, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An empty appliances array (boundary: zero-length collection) is rejected with 400 ERR_INVALID_REQUEST — distinct from the per-item 422 semantic rule."
        test_recipe:
          setup: ["A customer and a DRAFT project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ea@x.com", full_name: "EA", service_address: "4 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/load-assessments"
              payload: { appliances: [] }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 400 with error_id == ERR_INVALID_REQUEST"

      - name: unit_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Unit.fields.serial_no, entities.Unit.fields.warranty_start]
        distinguishing_aspect: "On activation the Unit's warranty_start is the logical clock (system), not client-supplied; the activate body only accepts serial_no and monitoring_enabled."
        test_recipe:
          setup: ["A project sized/permitted/installed and ready to activate at default clock 2026-01-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sf@x.com", full_name: "SF", service_address: "5 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T", license_no: "LICSF1", gas_certified: true }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /models"
              payload: { sku: "SFSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
            - call: "POST /projects/${pid}/permit"
              payload: { permit_number: "PSF1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${pid}/install"
              payload: { install_tech_id: "${tid}", ats_amps: 200 }
              as: ServiceManager
          trigger:
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNSF1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
          assert:
            - "Unit.${unit}.warranty_start == 2026-01-01T00:00:00Z (system clock, not client input)"
            - "Unit.${unit}.warranty_total_months == 60 (snapshot of model.warranty_months)"

      - name: list_customer_projects_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, entities.GeneratorProject]
        distinguishing_aspect: "GET /customers/{id}/projects returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["A customer with one project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "lp@x.com", full_name: "LP", service_address: "6 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "PROPANE" }
              as: ServiceManager
          trigger:
            - call: "GET /customers/${cid}/projects"
              payload: { limit: 10, offset: 0 }
              as: ServiceManager
          assert:
            - "response_type == array; meta.total_count == 1; has_more == false"

      - name: model_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.GeneratorModel]
        distinguishing_aspect: "GeneratorModel has common_fields:false; its read carries id and created_at but no version field and there is no model UPDATE endpoint."
        test_recipe:
          setup: ["A model exists."]
          setup_api_calls:
            - call: "POST /models"
              payload: { sku: "IMSKU1", rated_kw: 18, fuel_types: ["NG","PROPANE"], unit_price_cents: 600000, warranty_months: 48 }
              as: ServiceManager
              captures: { mid: $.data.id }
          trigger:
            - call: "GET /models/${mid}"
              payload: {}
              as: ServiceManager
          assert:
            - "GeneratorModel.${mid}.created_at present; no PUT/PATCH /models/{id} endpoint exists in §1.5"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_activated_project_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.GeneratorProject.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is allowed only from DRAFT/SIZED/PERMITTED/INSTALLED; cancelling an ACTIVATED project returns 409 ERR_INVALID_STATE (no Unit teardown via cancel)."
        test_recipe:
          setup: ["An ACTIVATED project."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ca@x.com", full_name: "CA", service_address: "7 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T", license_no: "LICCA1", gas_certified: true }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /models"
              payload: { sku: "CASKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
            - call: "POST /projects/${pid}/permit"
              payload: { permit_number: "PCA1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${pid}/install"
              payload: { install_tech_id: "${tid}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNCA1" }
              as: ServiceManager
          trigger:
            - call: "POST /projects/${pid}/cancel"
              payload: { cancellation_reason: "changed mind" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: size_without_assessment_returns_no_assessment
        claim_type: Precondition Enforcement
        grounds: [state_machines.GeneratorProject.DRAFT_to_SIZED, "errors[ERR_NO_ASSESSMENT]"]
        distinguishing_aspect: "Sizing references an assessment_id not present on the project (none created) -> 409 ERR_NO_ASSESSMENT, a precondition failure distinct from undersized/inactive model."
        test_recipe:
          setup: ["A DRAFT project with NO load assessments, and an active model."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "na@x.com", full_name: "NA", service_address: "8 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /models"
              payload: { sku: "NASKU1", rated_kw: 30, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "00000000-0000-4000-8000-000000000001", model_id: "${mid}" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_NO_ASSESSMENT"

      - name: activate_before_permit_approved_returns_permit_not_approved
        claim_type: Precondition Enforcement
        grounds: [state_machines.GeneratorProject.INSTALLED_to_ACTIVATED, "errors[ERR_PERMIT_NOT_APPROVED]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activation is only reachable from INSTALLED; attempting activate on a SIZED project (not yet permitted/installed) returns 409 ERR_INVALID_STATE because the from-state is wrong (permit gate is unreachable until INSTALLED)."
        test_recipe:
          setup: ["A SIZED project (assessment+model locked) but not permitted/installed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pa@x.com", full_name: "PA", service_address: "9 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /models"
              payload: { sku: "PASKU1", rated_kw: 30, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
          trigger:
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNPA1" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: campaign_close_with_open_remediation_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.RecallCampaign.OPEN_to_CLOSED, "errors[ERR_CAMPAIGN_HAS_OPEN_REMEDIATIONS]"]
        distinguishing_aspect: "Closing an OPEN campaign that still has a PENDING remediation returns 409 ERR_CAMPAIGN_HAS_OPEN_REMEDIATIONS."
        test_recipe:
          setup: ["An OPEN ADVISORY campaign with one PENDING remediation (one affected unit)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "co@x.com", full_name: "CO", service_address: "10 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T", license_no: "LICCO1", gas_certified: true }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /models"
              payload: { sku: "COSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
            - call: "POST /projects/${pid}/permit"
              payload: { permit_number: "PCO1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${pid}/install"
              payload: { install_tech_id: "${tid}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNCO1" }
              as: ServiceManager
            - call: "POST /recall-campaigns"
              payload: { model_id: "${mid}", code: "CO-1", severity: "ADVISORY", remediation_window_days: 90 }
              as: ComplianceOfficer
              captures: { camp: $.data.id }
            - call: "POST /recall-campaigns/${camp}/open"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /recall-campaigns/${camp}/close"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_CAMPAIGN_HAS_OPEN_REMEDIATIONS"

      - name: withdrawn_claim_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WarrantyClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A WITHDRAWN claim is terminal; a subsequent withdraw returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A unit with a WITHDRAWN warranty claim."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tl2@x.com", full_name: "TL2", service_address: "11 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T", license_no: "LICTL2", gas_certified: true }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /models"
              payload: { sku: "TL2SKU", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
            - call: "POST /projects/${pid}/permit"
              payload: { permit_number: "PTL2", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${pid}/install"
              payload: { install_tech_id: "${tid}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNTL2" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "GET /units/${unit}"
              payload: {}
              as: ServiceManager
              captures: { u_v: $.data.version }
            - call: "POST /units/${unit}/warranty-claims"
              payload: { description: "x", expected_unit_version: "${u_v}" }
              as: ServiceManager
              captures: { claim: $.data.id }
            - call: "POST /warranty-claims/${claim}/withdraw"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /warranty-claims/${claim}/withdraw"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: dispatch_cancel_in_progress_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.RepairDispatch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is allowed only from REQUESTED/DISPATCHED; cancelling an IN_PROGRESS dispatch returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PAID dispatch that has been started (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ip@x.com", full_name: "IP", service_address: "12 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T", license_no: "LICIP1", gas_certified: true }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /models"
              payload: { sku: "IPSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
            - call: "POST /projects/${pid}/permit"
              payload: { permit_number: "PIP1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${pid}/install"
              payload: { install_tech_id: "${tid}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNIP1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/repair-dispatches"
              payload: { labor_cents: 5000 }
              as: ServiceManager
              captures: { disp: $.data.id, dv: $.data.version }
            - call: "POST /repair-dispatches/${disp}/assign"
              payload: { assigned_tech_id: "${tid}", expected_dispatch_version: "${dv}" }
              as: ServiceManager
            - call: "POST /repair-dispatches/${disp}/start"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /repair-dispatches/${disp}/cancel"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 409 with error_id == ERR_INVALID_STATE"

      - name: bubble_up_warranty_repair_dispatch_spawned
        claim_type: Side Effect Execution
        grounds: [state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED, entities.WarrantyClaim.fields.dispatch_id]
        distinguishing_aspect: "Adjudicating APPROVE with resolution REPAIR_COVERED spawns a RepairDispatch(origin=WARRANTY) and sets claim.dispatch_id; the dispatch is discoverable via the warranty_claim_id filter."
        test_recipe:
          setup: ["A unit (warranty ACTIVE) with a claim moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "bu@x.com", full_name: "BU", service_address: "13 St" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T", license_no: "LICBU1", gas_certified: true }
              as: ServiceManager
              captures: { tid: $.data.id }
            - call: "POST /models"
              payload: { sku: "BUSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { mid: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cid}", fuel_type: "NG" }
              as: ServiceManager
              captures: { pid: $.data.id }
            - call: "POST /projects/${pid}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { aid: $.data.id }
            - call: "POST /projects/${pid}/size"
              payload: { assessment_id: "${aid}", model_id: "${mid}" }
              as: ServiceManager
            - call: "POST /projects/${pid}/permit"
              payload: { permit_number: "PBU1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${pid}/install"
              payload: { install_tech_id: "${tid}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${pid}/activate"
              payload: { serial_no: "SNBU1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "GET /units/${unit}"
              payload: {}
              as: ServiceManager
              captures: { u_v: $.data.version }
            - call: "POST /units/${unit}/warranty-claims"
              payload: { description: "covered defect", expected_unit_version: "${u_v}" }
              as: ServiceManager
              captures: { claim: $.data.id }
            - call: "POST /warranty-claims/${claim}/review"
              payload: {}
