            - "AcademicTerm.${term_id}.sis_sync_epoch == ${batch_seq} == 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: academic_term_reverse_edge_and_cross_dimension_guard_between_lifecycle_and_posture
        grounds:
          - state_machines.AcademicTerm.lifecycle_state.FINALS_to_IN_SESSION
          - state_machines.AcademicTerm.lifecycle_state.FINALS_to_GRADING
          - state_machines.AcademicTerm.continuity_posture.NORMAL_to_ELEVATED
          - state_machines.AcademicTerm.continuity_posture.ELEVATED_to_CONTINUITY_MODE
          - state_machines.AcademicTerm.continuity_posture.CONTINUITY_MODE_to_ELEVATED
          - state_machines.ContinuityWindow.window_state.null_to_OPEN
          - validations[priority=29]
          - errors[ERR_TERM_POSTURE_FROZEN]
        distinguishing_aspect: |
          Non-linearity of the AcademicTerm: two independent state dimensions on
          one row, a BACKWARD edge (FINALS -> IN_SESSION) that exists only while
          the other dimension sits in CONTINUITY_MODE, and a forward edge
          (FINALS -> GRADING) that the same posture forbids. One identical
          request (target_state=GRADING) is therefore rejected and then accepted
          with no change to the lifecycle dimension at all. The other
          non_linear_state_machine instance is a different entity
          (ToolIntegration) exercising a three-way fork on one trigger plus a
          full review CYCLE, not a two-dimension guard.
        test_recipe:
          setup:
            - "Term 2026FA is walked PLANNING -> REGISTRATION_OPEN -> IN_SESSION -> FINALS; continuity_posture is still NORMAL."
            - "The logical clock stays at its 2026-08-01T00:00:00Z default; every continuity window used here lies in the future, so no window has started."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id, posture_at_create: $.data.continuity_posture, lifecycle_at_create: $.data.lifecycle_state }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              captures: { pct_at_open: $.data.rollover_completion_pct }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
              captures: { v_at_finals: $.data.version }
          trigger:
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "CONTINUITY_MODE", reason: "skipping the ELEVATED step" }
              as: LmsAdmin
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "regional storm watch" }
              as: LmsAdmin
              captures: { posture_elevated: $.data.continuity_posture, v_at_elevated: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-12-07T08:00:00Z", window_end: "2026-12-08T08:00:00Z", expected_term_version: "${v_at_elevated}" }
              as: LmsAdmin
              captures: { win_id: $.data.id, win_state: $.data.window_state, win_affected: $.data.affected_enrollment_count, win_ext_days: $.data.extension_days_granted }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "CONTINUITY_MODE", reason: "campus network outage during finals" }
              as: LmsAdmin
              captures: { posture_frozen: $.data.continuity_posture }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              captures: { lifecycle_reversed: $.data.lifecycle_state }
            - call: "POST /continuity-windows/${win_id}/transitions"
              payload: { action: "CLOSE" }
              as: LmsAdmin
              captures: { win_state_closed: $.data.window_state }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { posture_still_frozen: $.data.continuity_posture }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "outage resolved" }
              as: LmsAdmin
              captures: { posture_back: $.data.continuity_posture }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
              captures: { lifecycle_final: $.data.lifecycle_state }
          assert:
            - "${lifecycle_at_create} == PLANNING and ${posture_at_create} == NORMAL (independent initial states on one row)"
            - "${pct_at_open} == 100.00 (empty eligible-shell set passes the rollover gate)"
            - "the first posture call (NORMAL -> CONTINUITY_MODE) returns ERR_INVALID_STATE_TRANSITION (409): the posture dimension has no direct edge and the term's version stays ${v_at_finals}"
            - "${posture_elevated} == ELEVATED and ${v_at_elevated} == ${v_at_finals} + 1"
            - "the term is still in FINALS when the posture reaches CONTINUITY_MODE, so the rejection below is attributable to the posture dimension alone"
            - "${win_state} == OPEN, ${win_affected} == 0 (term-wide window over total_active_enrollments 0) and ${win_ext_days} == 0 (kind is OUTAGE, not EXTENSION)"
            - "${posture_frozen} == CONTINUITY_MODE and AcademicTerm.${term_id}.lifecycle_state is still FINALS (the posture change never moves the lifecycle dimension)"
            - "the second target_state=GRADING call returns ERR_TERM_POSTURE_FROZEN (409) — same request, same from-state, opposite outcome, decided purely by the sibling dimension"
            - "${lifecycle_reversed} == IN_SESSION: the backward edge is reachable only in CONTINUITY_MODE"
            - "${win_state_closed} == CLOSED and ${posture_still_frozen} == CONTINUITY_MODE — closing the last OPEN OUTAGE window does not walk the posture back by itself"
            - "${posture_back} == ELEVATED (now legal because no OPEN OUTAGE window remains) and ${lifecycle_final} == GRADING"
            - "ContinuityWindow.${win_id}.closed_at == \"2026-08-01T00:00:00Z\" (the logical clock, never a wall clock)"

      - name: tool_integration_three_way_finalize_fork_and_full_review_cycle_reset
        grounds:
          - state_machines.ToolIntegration.approval_state.UNDER_REVIEW_to_CONDITIONAL
          - state_machines.ToolIntegration.approval_state.CONDITIONAL_to_SUSPENDED
          - state_machines.ToolIntegration.approval_state.SUSPENDED_to_UNDER_REVIEW
          - state_machines.ToolIntegration.privacy_review_state.PENDING_to_CONDITIONAL
          - state_machines.ToolIntegration.privacy_review_state.CONDITIONAL_to_PENDING
          - state_machines.ToolIntegration.accessibility_review_state.PENDING_to_CLEARED
          - validations[priority=18]
          - validations[priority=19]
        distinguishing_aspect: |
          Non-linearity of the ToolIntegration: ONE trigger (FINALIZE_REVIEW)
          forks three ways, and the fork is not a pure function of the risk
          score — a CONDITIONS decision drags a 13.00-point tool into
          CONDITIONAL where the number alone would have said APPROVED. The row
          then completes a genuine cycle (UNDER_REVIEW -> CONDITIONAL ->
          SUSPENDED -> UNDER_REVIEW) whose closing edge RESETS two sibling
          dimensions to PENDING and clears approved_version, opening a fresh
          review round in which a second ToolReview on an already-reviewed
          dimension is legal. Different entity and different non-linearity from
          the AcademicTerm instance, which has no fork and no cycle-reset.
        test_recipe:
          setup:
            - "One ToolIntegration is registered with pii_tier 0, data_sharing_scope ROSTER_ONLY, vpat_score 90.00, wcag_level AA and tool_version 1.0.0, so its risk_score is 0 + 10 + 3.00 + 0 + 0 = 13.00 — comfortably below the 40.00 CONDITIONAL threshold."
            - "It is moved DRAFT -> UNDER_REVIEW."
            - "Round one: PRIVACY is decided CONDITIONS by priv-rev-1 (with a conditions_note) and ACCESSIBILITY is CLEARED by acc-rev-1."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "OpenCampus", tool_name: "PeerNotes", tool_version: "1.0.0", data_sharing_scope: "ROSTER_ONLY", pii_tier: 0, vpat_score: 90.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_id: $.data.id, approval_at_create: $.data.approval_state, priv_at_create: $.data.privacy_review_state, acc_at_create: $.data.accessibility_review_state }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
              captures: { approval_under_review: $.data.approval_state }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY", decision: "CONDITIONS", conditions_note: "no third-party analytics on roster data" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
              captures: { review_1_id: $.data.id }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
              captures: { review_2_id: $.data.id }
            - call: "GET /tool-integrations/${tool_id}"
              payload: {}
              as: LmsAdmin
              captures: { priv_round_1: $.data.privacy_review_state, acc_round_1: $.data.accessibility_review_state }
          trigger:
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { approval_forked: $.data.approval_state, score_forked: $.data.risk_score, approved_version_forked: $.data.approved_version }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "SUSPEND", reason: "vendor breach notification" }
              as: LmsAdmin
              captures: { approval_suspended: $.data.approval_state, suspension_reason: $.data.suspension_reason, placements_after_suspend: $.data.active_placement_count }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "REOPEN_REVIEW" }
              as: LmsAdmin
              captures: { approval_reopened: $.data.approval_state, priv_reset: $.data.privacy_review_state, acc_reset: $.data.accessibility_review_state, approved_version_reset: $.data.approved_version, suspension_reason_kept: $.data.suspension_reason }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
              captures: { review_3_id: $.data.id }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { approval_round_2: $.data.approval_state, score_round_2: $.data.risk_score, approved_version_round_2: $.data.approved_version }
          assert:
            - "${approval_at_create} == DRAFT, ${priv_at_create} == PENDING, ${acc_at_create} == PENDING and ${approval_under_review} == UNDER_REVIEW"
            - "${priv_round_1} == CONDITIONAL and ${acc_round_1} == CLEARED (one POST /tool-reviews moves one sibling dimension and nothing else)"
            - "${score_forked} == 13.00 and ${approval_forked} == CONDITIONAL — the score alone would have selected APPROVED; the CONDITIONS decision picks the middle branch"
            - "${approved_version_forked} == \"1.0.0\" (the CONDITIONAL branch does pin approved_version, unlike REJECTED)"
            - "${approval_suspended} == SUSPENDED, ${suspension_reason} == \"vendor breach notification\" and ${placements_after_suspend} == 0"
            - "${approval_reopened} == UNDER_REVIEW, ${priv_reset} == PENDING, ${acc_reset} == PENDING, ${approved_version_reset} is null and ${suspension_reason_kept} == \"vendor breach notification\" (kept as history)"
            - "the round-two PRIVACY review is accepted (201) even though ${review_1_id} already exists on that dimension: the conflict rule is scoped to one review round, so a per-tool-and-dimension unique index is the wrong implementation"
            - "the FINALIZE_REVIEW attempted between the two round-two reviews returns ERR_REVIEW_INCOMPLETE (422) because accessibility_review_state is back to PENDING"
            - "${approval_round_2} == APPROVED, ${score_round_2} == 13.00 and ${approved_version_round_2} == \"1.0.0\" — the same inputs now select the first branch of the fork"
            - "GET /tool-reviews filtered by tool_id returns 3 rows (${review_1_id}, ${review_2_id}, ${review_3_id}); ToolReview rows are immutable history and are never rewritten by a reopen"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: tool_suspension_cascades_four_hops_from_placement_to_term_published_count
        grounds:
          - state_machines.ToolIntegration.approval_state.APPROVED_to_SUSPENDED
          - state_machines.ToolPlacement.placement_state.ACTIVE_to_BLOCKED
          - state_machines.CourseShell.provisioning_state.PUBLISHED_to_PROVISIONED
          - entities.CourseShell.fields.blocked_placement_count
          - entities.CourseShell.fields.publish_readiness
          - entities.AcademicTerm.fields.published_shell_count
          - calculations.tool_approval_risk_score
        distinguishing_aspect: |
          Depth-4 chain fired by ONE privacy-office action on a ToolIntegration:
          hop 1 blocks the placement, hop 2 is caused by that block (the shell's
          blocked_placement_count / publish_readiness), hop 3 is caused by
          publish_readiness turning false (the shell unpublishes itself), and
          hop 4 is caused by that unpublish (the term's published_shell_count).
          Three different entities downstream of the trigger entity, and the
          third hop is a state transition rather than a counter. The other
          transitive_cascade instance is triggered on an Enrollment and its
          middle hop is a queue re-ordering, not an unpublish.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION with continuity_posture NORMAL, published_shell_count 0."
            - "Shell CS401-01 is OFFICIAL and PROVISIONED with no enrollments, so no FERPA block can interfere with placement activation."
            - "Tool PeerNotes 1.0.0 (pii_tier 0, ROSTER_ONLY, vpat_score 90.00, AA) is APPROVED with approved_version 1.0.0 and risk_score 13.00."
            - "A ToolPlacement of that tool on that shell is ACTIVATEd, which lifts publish_readiness back to true, and the shell is then PUBLISHED."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS401-01", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { readiness_at_approve: $.data.publish_readiness }
            - call: "POST /tool-integrations"
              payload: { vendor_name: "OpenCampus", tool_name: "PeerNotes", tool_version: "1.0.0", data_sharing_scope: "ROSTER_ONLY", pii_tier: 0, vpat_score: 90.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_id: $.data.id }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { tool_state: $.data.approval_state, score_before_placement: $.data.risk_score }
            - call: "POST /tool-placements"
              payload: { tool_id: "${tool_id}", shell_id: "${shell_id}" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { placement_id: $.data.id, placement_state_at_create: $.data.placement_state }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { readiness_with_requested_placement: $.data.publish_readiness }
            - call: "POST /tool-placements/${placement_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { placement_active: $.data.placement_state, pinned_version: $.data.pinned_tool_version }
            - call: "GET /tool-integrations/${tool_id}"
              payload: {}
              as: LmsAdmin
              captures: { score_with_placement: $.data.risk_score, placements_before: $.data.active_placement_count }
            - call: "POST /course-shells/${shell_id}/publish"
              payload: {}
              as: LmsAdmin
              captures: { shell_published: $.data.provisioning_state }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { published_before: $.data.published_shell_count }
          trigger:
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "SUSPEND", reason: "vendor privacy incident" }
              as: LmsAdmin
              captures: { tool_state_after: $.data.approval_state, placements_after: $.data.active_placement_count, score_after: $.data.risk_score }
            - call: "GET /tool-placements/${placement_id}"
              payload: {}
              as: LmsAdmin
              captures: { placement_after: $.data.placement_state, blocked_reason: $.data.blocked_reason }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { shell_after: $.data.provisioning_state, blocked_count_after: $.data.blocked_placement_count, readiness_after: $.data.publish_readiness, unpublish_reason: $.data.unpublish_reason }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { published_after: $.data.published_shell_count }
          assert:
            - "${readiness_at_approve} == true, ${placement_state_at_create} == REQUESTED and ${readiness_with_requested_placement} == false — a merely REQUESTED placement already blocks publication"
            - "${placement_active} == ACTIVE, ${pinned_version} == \"1.0.0\", ${tool_state} == APPROVED"
            - "${score_before_placement} == 13.00 and ${score_with_placement} == 16.00 (one placement adds EXPOSURE_PER_PLACEMENT 3), ${placements_before} == 1"
            - "${shell_published} == PUBLISHED and ${published_before} == 1"
            - "hop 0 (trigger): ${tool_state_after} == SUSPENDED"
            - "hop 1: ${placement_after} == BLOCKED with ${blocked_reason} non-null"
            - "hop 2: ${blocked_count_after} == 1 and ${readiness_after} == false — caused by hop 1, not by the suspension directly"
            - "hop 3: ${shell_after} == PROVISIONED with ${unpublish_reason} == \"tool placement blocked\" — caused by hop 2; the system form of the unpublish ignores the posture gate"
            - "hop 4: ${published_after} == 0 — caused by hop 3, not recomputed from scratch"
            - "${placements_after} == 0 and ${score_after} == 13.00 (exposure removed with the placement)"
            - "the shell CANNOT simply be republished: POST /course-shells/{id}/publish now returns ERR_SHELL_NOT_PUBLISH_READY (422) until the BLOCKED placement is REMOVEd"

      - name: enrollment_drop_cascades_waitlist_promotion_renumbering_and_term_headcount
        grounds:
          - state_machines.Enrollment.enrollment_state.ACTIVE_to_DROPPED
          - state_machines.Enrollment.enrollment_state.WAITLISTED_to_ACTIVE
          - calculations.waitlist_promotion_capacity
          - entities.Enrollment.fields.waitlist_position
          - entities.CourseShell.fields.waitlisted_enrollment_count
          - entities.AcademicTerm.fields.total_active_enrollments
        distinguishing_aspect: |
          Depth-3 chain fired on an Enrollment by a Registrar DROP: hop 1
          decrements two counters, hop 2 is caused by the freed seat (the
          waitlist head is promoted), hop 3 is caused by that promotion (the
          surviving queue is renumbered from 1 and the shell's derived seat
          fields are recomputed). The net effect on the term's headcount is ZERO,
          which is exactly what a naive implementation gets wrong by decrementing
          without re-incrementing. Different trigger entity, different hop
          semantics and a shorter chain than the tool-suspension instance.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION, continuity_posture NORMAL, so overflow_allowance is floor(2 * 0.00) = 0 and effective_seat_cap == base_seat_cap == 2."
            - "Shell CS150-01 is OFFICIAL and PROVISIONED with base_seat_cap 2."
            - "Four STUDENT people exist. S-2001 and S-2002 hold ACTIVE seats; S-2003 is WAITLISTED at position 1 and S-2004 at position 2."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS150-01", shell_type: "OFFICIAL", base_seat_cap: 2 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { cap: $.data.effective_seat_cap }
            - call: "POST /people"
              payload: { sis_person_id: "S-2001", full_name: "Stu One", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2002", full_name: "Stu Two", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s2: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2003", full_name: "Stu Three", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s3: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2004", full_name: "Stu Four", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s4: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e1: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s2}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e2: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s3}", role: "STUDENT", requested_state: "WAITLISTED" }
              as: Registrar
              captures: { e3: $.data.id, e3_pos: $.data.waitlist_position }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s4}", role: "STUDENT", requested_state: "WAITLISTED" }
              as: Registrar
              captures: { e4: $.data.id, e4_pos: $.data.waitlist_position }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active_before: $.data.active_enrollment_count, waiting_before: $.data.waitlisted_enrollment_count, util_before: $.data.seat_utilization_pct }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { headcount_before: $.data.total_active_enrollments }
          trigger:
            - call: "POST /enrollments/${e1}/transitions"
              payload: { action: "DROP", reason: "student withdrew from the course" }
              as: Registrar
              captures: { e1_state: $.data.enrollment_state, e1_dropped_at: $.data.dropped_at }
            - call: "GET /enrollments/${e3}"
              payload: {}
              as: Registrar
              captures: { e3_state: $.data.enrollment_state, e3_pos_after: $.data.waitlist_position }
            - call: "GET /enrollments/${e4}"
              payload: {}
              as: Registrar
              captures: { e4_state: $.data.enrollment_state, e4_pos_after: $.data.waitlist_position }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active_after: $.data.active_enrollment_count, waiting_after: $.data.waitlisted_enrollment_count, util_after: $.data.seat_utilization_pct, overflow_after: $.data.overflow_flag }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { headcount_after: $.data.total_active_enrollments, overflow_shells_after: $.data.overflow_shell_count }
          assert:
            - "${cap} == 2, ${e3_pos} == 1 and ${e4_pos} == 2 (positions are assigned from waitlisted_enrollment_count + 1, not from row order)"
            - "${active_before} == 2, ${waiting_before} == 2, ${util_before} == 100.00, ${headcount_before} == 2"
            - "hop 0 (trigger): ${e1_state} == DROPPED and ${e1_dropped_at} == \"2026-08-01T00:00:00Z\" (the logical clock)"
            - "hop 1: the freed seat drops shell.active_enrollment_count to 1 and term.total_active_enrollments to 1 transiently"
            - "hop 2: ${e3_state} == ACTIVE with ${e3_pos_after} null — the HEAD of the queue is promoted, never S-2004"
            - "hop 3: ${e4_pos_after} == 1 (the surviving queue is renumbered from 1) and ${waiting_after} == 1"
            - "${active_after} == 2 and ${headcount_after} == 2 — the cascade's net effect on the term headcount is exactly zero"
            - "${util_after} == 100.00 and ${overflow_after} == false and ${overflow_shells_after} == 0 (2 active over base_seat_cap 2)"
            - "exactly ONE promotion happens: promotable_count = min(open_seats 1, waitlisted 2) = 1, so S-2004 stays queued"
            - "Enrollment.${e2}.enrollment_state is still ACTIVE and Enrollment.${e2}.waitlist_position is null (untouched by the cascade)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: segregation_of_duties_outranks_review_dimension_conflict_on_tool_reviews
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REVIEW_DIMENSION_CONFLICT]
          - roles.PrivacyReviewer
          - roles.AccessibilityReviewer
        distinguishing_aspect: |
          Pairs business_safety (priority 17) against business_referential
          (priority 18) — two priorities that are ADJACENT, so an implementation
          that evaluates referential integrity before duty separation flips the
          answer with no other visible difference: both errors are 409 on the
          same endpoint, so only the error_id distinguishes them. The other
          priority_pair instance pairs a completely different pair of categories
          (business_temporal 23 against business_fiscal 43) on a different
          endpoint, and there the two candidate errors even carry different HTTP
          statuses.
        test_recipe:
          setup:
            - "One ToolIntegration is UNDER_REVIEW."
            - "Reviewer rev-x has already decided its PRIVACY dimension (CLEAR) while wearing the PrivacyReviewer role."
            - "Reviewer rev-y has already decided its ACCESSIBILITY dimension (CLEAR) while wearing the AccessibilityReviewer role."
            - "The tool is therefore in a state where BOTH a duplicate-dimension review and a duty violation are possible in a single request."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "OpenCampus", tool_name: "PeerNotes", tool_version: "1.0.0", data_sharing_scope: "ROSTER_ONLY", pii_tier: 0, vpat_score: 90.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_id: $.data.id }
            - call: "POST /tool-integrations/${tool_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "rev-x"
              captures: { priv_review_id: $.data.id, priv_reviewer: $.data.reviewer_user_id }
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "rev-y"
              captures: { acc_review_id: $.data.id }
          trigger:
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "ACCESSIBILITY", decision: "BLOCK" }
              as: AccessibilityReviewer
              as_user_id: "rev-x"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_id}", dimension: "PRIVACY", decision: "BLOCK" }
              as: PrivacyReviewer
              as_user_id: "rev-z"
            - call: "GET /tool-integrations/${tool_id}"
              payload: {}
              as: LmsAdmin
              captures: { priv_state: $.data.privacy_review_state, acc_state: $.data.accessibility_review_state }
          assert:
            - "${priv_reviewer} == \"rev-x\" (reviewer_user_id is taken from the X-User-ID header, never from the body)"
            - "the first trigger call violates BOTH rules at once: rev-x already holds this tool's PRIVACY review (priority 17) and an ACCESSIBILITY review already exists for this round (priority 18)"
            - "it returns ERR_SEGREGATION_OF_DUTIES (409), NOT ERR_REVIEW_DIMENSION_CONFLICT — priority 17 wins"
            - "the second trigger call (rev-z, a user with no review on this tool, duplicating the PRIVACY dimension) violates ONLY priority 18 and returns ERR_REVIEW_DIMENSION_CONFLICT (409), which proves rule 18 was live and would have fired first if the ordering were wrong"
            - "${priv_state} == CLEARED and ${acc_state} == CLEARED — neither rejected request moved a review dimension"
            - "GET /tool-reviews filtered by tool_id still returns exactly 2 rows (${priv_review_id}, ${acc_review_id}); a rejected review must not be persisted"
            - "ToolIntegration.${tool_id}.approval_state is still UNDER_REVIEW and its version is unchanged by the two rejections"

      - name: add_drop_window_closed_outranks_seat_cap_exceeded_on_enrollment_reinstate
        grounds:
          - validations[priority=23]
          - validations[priority=43]
          - errors[ERR_ADD_DROP_WINDOW_CLOSED]
          - errors[ERR_SEAT_CAP_EXCEEDED]
          - state_machines.Enrollment.enrollment_state.DROPPED_to_ACTIVE
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Pairs business_temporal (priority 23, a 409) against business_fiscal
          (priority 43, a 422) on POST /enrollments/{id}/transitions — a
          DIFFERENT category pair, a different endpoint and a different HTTP
          status pair from the reviewer instance. Both single-violation controls
          are exercised in the same recipe, so the winner cannot be explained by
          one of the rules simply being unimplemented, and the deciding input is
          the logical clock rather than an actor identity.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION with add_drop_deadline_at pinned to 2026-09-07T00:00:00Z; the clock starts at its 2026-08-01T00:00:00Z default, inside the add/drop window."
            - "Shell CS160-01 is OFFICIAL and PROVISIONED with base_seat_cap 2 under NORMAL posture, so effective_seat_cap is 2 and there is no waitlist to absorb a freed seat."
            - "S-2001 and S-2002 hold the two ACTIVE seats; S-2001 is then DROPPED and S-2003 immediately takes the freed seat, so the shell is full again and S-2001's row is DROPPED."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", add_drop_deadline_at: "2026-09-07T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id, deadline: $.data.add_drop_deadline_at }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS160-01", shell_type: "OFFICIAL", base_seat_cap: 2 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /people"
              payload: { sis_person_id: "S-2001", full_name: "Stu One", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2002", full_name: "Stu Two", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s2: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2003", full_name: "Stu Three", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s3: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e1: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s2}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e2: $.data.id }
            - call: "POST /enrollments/${e1}/transitions"
              payload: { action: "DROP", reason: "schedule conflict" }
              as: Registrar
              captures: { e1_state: $.data.enrollment_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s3}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e3: $.data.id }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active_full: $.data.active_enrollment_count, cap: $.data.effective_seat_cap }
          trigger:
            - call: "POST /enrollments/${e1}/transitions"
              payload: { action: "REINSTATE", reason: "advisor override, inside the window" }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T09:00:00Z" }
              as: LmsAdmin
            - call: "POST /enrollments/${e1}/transitions"
              payload: { action: "REINSTATE", reason: "advisor override, both rules violated" }
              as: Registrar
            - call: "POST /enrollments/${e3}/transitions"
              payload: { action: "DROP", reason: "freeing the seat to isolate the temporal rule" }
              as: Registrar
              captures: { e3_state: $.data.enrollment_state }
            - call: "POST /enrollments/${e1}/transitions"
              payload: { action: "REINSTATE", reason: "advisor override, only the window is closed" }
              as: Registrar
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: Registrar
              captures: { e1_state_final: $.data.enrollment_state, e1_reinstatements: $.data.reinstatement_count }
          assert:
            - "${deadline} == \"2026-09-07T00:00:00Z\", ${cap} == 2, ${active_full} == 2 and ${e1_state} == DROPPED"
            - "trigger call 1 (clock 2026-08-01, inside the window, shell full) violates ONLY priority 43 and returns ERR_SEAT_CAP_EXCEEDED (422) — the fiscal rule is demonstrably live"
            - "trigger call 3 (clock 2026-09-20, shell still full) violates BOTH priority 23 and priority 43 and MUST return ERR_ADD_DROP_WINDOW_CLOSED (409), not the 422"
            - "trigger call 5 (clock 2026-09-20, one free seat after ${e3_state} == DROPPED) violates ONLY priority 23 and returns ERR_ADD_DROP_WINDOW_CLOSED (409) — the temporal rule is demonstrably live on its own"
            - "${e1_state_final} == DROPPED and ${e1_reinstatements} == 0 — none of the three rejected reinstatements had any effect"
            - "CourseShell.${shell_id}.active_enrollment_count == 1 and AcademicTerm.${term_id}.total_active_enrollments == 1 after the isolating drop"
            - "the boundary itself is inclusive: a REINSTATE with the clock exactly at 2026-09-07T00:00:00Z would pass rule 23 (now <= add_drop_deadline_at)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: rollover_completion_pct_empty_set_convention_versus_zero_percent_at_the_registration_gate
        grounds:
          - calculations.term_rollover_completion_pct
          - state_machines.AcademicTerm.lifecycle_state.PLANNING_to_REGISTRATION_OPEN
          - validations[priority=39]
          - errors[ERR_ROLLOVER_INCOMPLETE]
        distinguishing_aspect: |
          Boundary on the METRIC rollover_completion_pct at the endpoint POST
          /academic-terms/{id}/lifecycle-transitions. The interesting boundary is
          the empty INPUT SET, not a numeric threshold: zero-of-zero must read
          100.00 (vacuously ready) while zero-of-one must read 0.00 (blocked).
          An implementation that returns 0.00 for the empty set bricks every new
          term, and one that skips the recompute lets an unprepared term open.
          The SANDBOX probe additionally pins the denominator's filter. Different
          metric and different endpoint from the seat-cap floor instance and the
          risk-threshold instance.
        test_recipe:
          setup:
            - "Term A (2027SP) is brand new and owns no shells at all."
            - "Term B (2027SU) owns exactly one OFFICIAL PROVISIONED shell that is the target of no COMPLETED RolloverJob."
            - "Term C (2027FA) owns exactly one SANDBOX PROVISIONED shell and nothing else."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-04-21T00:00:00Z" }
              as: Registrar
              captures: { term_a: $.data.id, pct_a_at_create: $.data.rollover_completion_pct }
            - call: "POST /academic-terms"
              payload: { term_code: "2027SU", term_start_at: "2027-05-10T00:00:00Z", term_end_at: "2027-08-06T00:00:00Z" }
              as: Registrar
              captures: { term_b: $.data.id }
            - call: "POST /academic-terms"
              payload: { term_code: "2027FA", term_start_at: "2027-08-23T00:00:00Z", term_end_at: "2027-12-10T00:00:00Z" }
              as: Registrar
              captures: { term_c: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_b}", owner_person_id: "${prof_id}", sis_section_code: "SU-CS101", shell_type: "OFFICIAL", base_seat_cap: 25 }
              as: LmsAdmin
              captures: { shell_b: $.data.id }
            - call: "POST /course-shells/${shell_b}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${term_c}", owner_person_id: "${prof_id}", sis_section_code: "FA-SBX", shell_type: "SANDBOX", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { shell_c: $.data.id }
            - call: "POST /course-shells/${shell_c}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
          trigger:
            - call: "POST /academic-terms/${term_a}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              captures: { state_a: $.data.lifecycle_state, pct_a: $.data.rollover_completion_pct }
            - call: "POST /academic-terms/${term_b}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "GET /academic-terms/${term_b}"
              payload: {}
              as: Registrar
              captures: { state_b: $.data.lifecycle_state, pct_b: $.data.rollover_completion_pct }
            - call: "POST /academic-terms/${term_c}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              captures: { state_c: $.data.lifecycle_state, pct_c: $.data.rollover_completion_pct }
          assert:
            - "${pct_a_at_create} == 100.00 (the field's declared default, before any recompute)"
            - "${state_a} == REGISTRATION_OPEN and ${pct_a} == 100.00 — 0 eligible shells is the EMPTY_SET_RESULT, not 0.00"
            - "term B's transition returns ERR_ROLLOVER_INCOMPLETE (422); ${state_b} == PLANNING and ${pct_b} == 0.00 (0 completed of 1 eligible, and the recompute is persisted even though the transition failed)"
            - "${state_c} == REGISTRATION_OPEN and ${pct_c} == 100.00 — a SANDBOX shell is not eligible, so term C's denominator is still empty; counting it would have produced 0.00 and blocked the term"
            - "the gate is >= ROLLOVER_READINESS_PCT (100.00), so 99.99 would fail; only an exact 100.00 opens registration"

      - name: seat_cap_overflow_allowance_floor_boundary_at_nine_ten_and_nineteen_seats
        grounds:
          - calculations.waitlist_promotion_capacity
          - entities.CourseShell.fields.effective_seat_cap
          - endpoints[POST /academic-terms/{id}/posture-changes]
          - state_machines.AcademicTerm.continuity_posture.NORMAL_to_ELEVATED
        distinguishing_aspect: |
          Boundary on the METRIC effective_seat_cap at the endpoint POST
          /academic-terms/{id}/posture-changes. floor() is the whole point: at
          OVERFLOW_RATIO_ELEVATED 0.10 a 9-seat shell buys nothing (floor 0.90 =
          0) while a 10-seat shell buys exactly one seat, and a 19-seat shell
          still buys only one (floor 1.90 = 1) where round() would wrongly buy
          two. Three shells share one term so a single request recomputes all
          three, which also proves the recompute is not scoped to one shell.
          Different metric, different endpoint and a different rounding mode
          (floor, not round_half_up) than the other two boundary instances.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION with continuity_posture NORMAL."
            - "Three OFFICIAL PROVISIONED shells in that term have base_seat_cap 9, 10 and 19; all three start with effective_seat_cap equal to base_seat_cap."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "NINE-01", shell_type: "OFFICIAL", base_seat_cap: 9 }
              as: LmsAdmin
              captures: { shell_9: $.data.id }
            - call: "POST /course-shells/${shell_9}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { cap_9_normal: $.data.effective_seat_cap }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "TEN-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { shell_10: $.data.id }
            - call: "POST /course-shells/${shell_10}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { cap_10_normal: $.data.effective_seat_cap }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "NINETEEN-01", shell_type: "OFFICIAL", base_seat_cap: 19 }
              as: LmsAdmin
              captures: { shell_19: $.data.id }
            - call: "POST /course-shells/${shell_19}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { cap_19_normal: $.data.effective_seat_cap }
          trigger:
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "boundary probe" }
              as: LmsAdmin
              captures: { posture: $.data.continuity_posture }
            - call: "GET /course-shells/${shell_9}"
              payload: {}
              as: LmsAdmin
              captures: { cap_9: $.data.effective_seat_cap, util_9: $.data.seat_utilization_pct }
            - call: "GET /course-shells/${shell_10}"
              payload: {}
              as: LmsAdmin
              captures: { cap_10: $.data.effective_seat_cap }
            - call: "GET /course-shells/${shell_19}"
              payload: {}
              as: LmsAdmin
              captures: { cap_19: $.data.effective_seat_cap }
          assert:
            - "${cap_9_normal} == 9, ${cap_10_normal} == 10 and ${cap_19_normal} == 19 (under NORMAL the ratio is 0.00, so no shell buys a seat)"
            - "${posture} == ELEVATED"
            - "${cap_9} == 9  # floor(9 * 0.10) = floor(0.90) = 0 — the boundary just BELOW one whole seat"
            - "${cap_10} == 11 # floor(10 * 0.10) = floor(1.00) = 1 — the boundary exactly AT one whole seat"
            - "${cap_19} == 20 # floor(19 * 0.10) = floor(1.90) = 1 — round_half_up would give 2 and is wrong here"
            - "${util_9} == 0.00 with zero enrollments (0 / 9 * 100), and overflow_flag is false on all three shells"
            - "base_seat_cap is never mutated by a posture change: CourseShell.${shell_9}.base_seat_cap == 9, CourseShell.${shell_19}.base_seat_cap == 19"

      - name: tool_risk_thresholds_are_inclusive_on_the_lower_side_at_forty_and_seventy_points
        grounds:
          - calculations.tool_approval_risk_score
          - state_machines.ToolIntegration.approval_state.UNDER_REVIEW_to_APPROVED
          - state_machines.ToolIntegration.approval_state.UNDER_REVIEW_to_CONDITIONAL
          - state_machines.ToolIntegration.approval_state.UNDER_REVIEW_to_REJECTED
          - endpoints[POST /tool-integrations/{id}/transitions]
        distinguishing_aspect: |
          Boundary on the METRIC risk_score at the endpoint POST
          /tool-integrations/{id}/transitions. Both thresholds are probed exactly
          ON their value (40.00 and 70.00) and one is probed 0.30 BELOW (39.70,
          reachable only because VPAT_WEIGHT is 0.30 and vpat_score moves in
          whole points), so a `<=` written where `<` belongs changes the branch
          for two of the three tools. Unlike the empty-set and floor instances,
          the observable consequence is a STATE FORK rather than a number, and
          the third fork (REJECTED) additionally decides whether approved_version
          is pinned at all.
        test_recipe:
          setup:
            - "Three tools are registered and moved to UNDER_REVIEW, each with both dimensions CLEARED by distinct reviewers (priv-rev-1 and acc-rev-1), so no BLOCK and no CONDITIONS decision can influence the fork and the branch is decided by the number alone."
            - "Tool P: pii_tier 0, ROSTER_AND_GRADES, vpat_score 50.00, wcag AA -> 0 + 25 + 15.00 + 0 = 40.00 exactly."
            - "Tool Q: identical except vpat_score 51.00 -> 0 + 25 + 14.70 + 0 = 39.70."
            - "Tool R: identical to P except pii_tier 3 -> 30 + 25 + 15.00 + 0 = 70.00 exactly."
          setup_api_calls:
            - call: "POST /tool-integrations"
              payload: { vendor_name: "VendorP", tool_name: "AtThreshold", tool_version: "1.0.0", data_sharing_scope: "ROSTER_AND_GRADES", pii_tier: 0, vpat_score: 50.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_p: $.data.id }
            - call: "POST /tool-integrations/${tool_p}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_p}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_p}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
            - call: "POST /tool-integrations"
              payload: { vendor_name: "VendorQ", tool_name: "JustUnder", tool_version: "1.0.0", data_sharing_scope: "ROSTER_AND_GRADES", pii_tier: 0, vpat_score: 51.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_q: $.data.id }
            - call: "POST /tool-integrations/${tool_q}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_q}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_q}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
            - call: "POST /tool-integrations"
              payload: { vendor_name: "VendorR", tool_name: "AtReject", tool_version: "1.0.0", data_sharing_scope: "ROSTER_AND_GRADES", pii_tier: 3, vpat_score: 50.00, wcag_level: "AA" }
              as: LmsAdmin
              captures: { tool_r: $.data.id }
            - call: "POST /tool-integrations/${tool_r}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: LmsAdmin
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_r}", dimension: "PRIVACY", decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "priv-rev-1"
            - call: "POST /tool-reviews"
              payload: { tool_id: "${tool_r}", dimension: "ACCESSIBILITY", decision: "CLEAR" }
              as: AccessibilityReviewer
              as_user_id: "acc-rev-1"
          trigger:
            - call: "POST /tool-integrations/${tool_p}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { p_state: $.data.approval_state, p_score: $.data.risk_score, p_version: $.data.approved_version }
            - call: "POST /tool-integrations/${tool_q}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { q_state: $.data.approval_state, q_score: $.data.risk_score, q_version: $.data.approved_version }
            - call: "POST /tool-integrations/${tool_r}/transitions"
              payload: { action: "FINALIZE_REVIEW" }
              as: LmsAdmin
              captures: { r_state: $.data.approval_state, r_score: $.data.risk_score, r_version: $.data.approved_version }
          assert:
            - "${p_score} == 40.00 and ${p_state} == CONDITIONAL — RISK_CONDITIONAL_THRESHOLD is inclusive on the lower side, so exactly 40.00 is NOT approved"
            - "${q_score} == 39.70 and ${q_state} == APPROVED — one whole VPAT point (0.30 risk points) separates Q from P"
            - "${r_score} == 70.00 and ${r_state} == REJECTED — RISK_REJECT_THRESHOLD is inclusive too, so exactly 70.00 is not merely CONDITIONAL"
            - "${p_version} == \"1.0.0\" and ${q_version} == \"1.0.0\" but ${r_version} is null (only the REJECTED branch leaves approved_version unset)"
            - "all three scores carry exactly 2 decimals; 39.7 or 40 without the cents is a precision failure"
            - "ToolIntegration.${tool_r}.active_placement_count == 0 so no placement cascade is triggered by the REJECTED branch here"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: grade_passback_submit_depends_on_the_academic_terms_continuity_posture
        grounds:
          - state_machines.GradePassback.passback_state.STAGED_to_SUBMITTED
          - state_machines.AcademicTerm.continuity_posture.ELEVATED_to_CONTINUITY_MODE
          - state_machines.ContinuityWindow.window_state.OPEN_to_CLOSED
          - validations[priority=29]
          - errors[ERR_TERM_POSTURE_FROZEN]
        distinguishing_aspect: |
          Entity pair GradePassback -> AcademicTerm, and the dependency is on the
          GRANDPARENT: the passback's own state, its shell and its enrollments are
          all unchanged between the rejected and the accepted SUBMIT — only the
          term's posture dimension moved, and it moved because a sibling entity
          (ContinuityWindow) was closed. The other cross_entity instance is the
          pair ToolPlacement -> ToolIntegration, a direct FK parent, and its
          gating input is a version string rather than a state enum.
        test_recipe:
          setup:
            - "Term 2026FA is walked to FINALS; shell CS210-01 is OFFICIAL and PUBLISHED before the freeze (publishing is itself posture-gated)."
            - "One STUDENT enrollment carries a 75.00-point grade record against a single 100.00-point ASSIGNMENT, so ERR_NO_GRADES_STAGED cannot fire and the person has no ferpa_block."
            - "A GradePassback is STAGED on that shell."
            - "The term is then driven NORMAL -> ELEVATED -> CONTINUITY_MODE, which requires one OPEN OUTAGE ContinuityWindow."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 30, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-1001", full_name: "Ada Byron", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-2001", full_name: "Stu One", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS210-01", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/publish"
              payload: {}
              as: LmsAdmin
              captures: { shell_state: $.data.provisioning_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${s1}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { e1: $.data.id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "ASSIGNMENT", title: "Final Project", points_possible: 100.00, storage_mb: 0.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_id: $.data.id }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${e1}", content_item_id: "${item_id}", earned_points: 75.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { earned: $.data.earned_points_total }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /grade-passbacks"
              payload: { shell_id: "${shell_id}" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb_id: $.data.id, pb_state: $.data.passback_state, staged: $.data.staged_enrollment_count }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "severe weather watch" }
              as: LmsAdmin
              captures: { term_v: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${term_id}", kind: "OUTAGE", window_start: "2026-12-07T08:00:00Z", window_end: "2026-12-08T08:00:00Z", expected_term_version: "${term_v}" }
              as: LmsAdmin
              captures: { win_id: $.data.id, win_affected: $.data.affected_enrollment_count }
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "CONTINUITY_MODE", reason: "datacentre outage during finals" }
              as: LmsAdmin
              captures: { posture_frozen: $.data.continuity_posture }
          trigger:
            - call: "POST /grade-passbacks/${pb_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "GET /grade-passbacks/${pb_id}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb_state_after_reject: $.data.passback_state, variant_after_reject: $.data.variant_applied }
            - call: "POST /continuity-windows/${win_id}/transitions"
              payload: { action: "CLOSE" }
              as: LmsAdmin
            - call: "POST /academic-terms/${term_id}/posture-changes"
              payload: { target_posture: "ELEVATED", reason: "service restored" }
              as: LmsAdmin
              captures: { posture_thawed: $.data.continuity_posture }
            - call: "POST /grade-passbacks/${pb_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { pb_state_final: $.data.passback_state, variant_final: $.data.variant_applied, submitted_total: $.data.submitted_points_total }
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: Registrar
              captures: { final_pct: $.data.final_grade_pct }
          assert:
            - "${shell_state} == PUBLISHED, ${earned} == 75.00, ${pb_state} == STAGED and ${staged} == 1"
            - "${win_affected} == 1 (a term-wide window snapshots term.total_active_enrollments, which is 1)"
            - "${posture_frozen} == CONTINUITY_MODE"
            - "the first SUBMIT returns ERR_TERM_POSTURE_FROZEN (409) although the passback itself is in a perfectly legal STAGED state"
            - "${pb_state_after_reject} == STAGED and ${variant_after_reject} == PROVISIONAL — the rejected transition applied none of its side effects"
            - "${posture_thawed} == ELEVATED (legal only because the OUTAGE window is now CLOSED)"
            - "${pb_state_final} == SUBMITTED, ${variant_final} == FINAL and ${submitted_total} == 75.00 — identical request, identical passback, opposite outcome, decided by the term row"
            - "${final_pct} == 75.00 (75.00 / total_points_possible 100.00) and AcademicTerm.${term_id}.lifecycle_state is still FINALS throughout"

      - name: tool_placement_activation_depends_on_the_tool_integrations_approval_and_version
        grounds:
          - state_machines.ToolPlacement.placement_state.REQUESTED_to_ACTIVE
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_TOOL_NOT_APPROVED]
          - errors[ERR_TOOL_VERSION_DRIFT]
          - endpoints[PATCH /tool-integrations/{id}]
        distinguishing_aspect: |
          Entity pair ToolPlacement -> ToolIntegration. The same ACTIVATE request
          is refused twice for two DIFFERENT reasons on the parent (first the
          parent's approval_state, then the parent's version STRING drifting away
          from approved_version) and then accepted, with the placement row itself
          untouched the whole time. The second refusal is the interesting one: the
          parent is fully APPROVED, so a naive implementation that only checks the
          parent's state lets a vendor upgrade slip into classrooms. Different
          entity pair and a different kind of gating field than the
          passback/posture instance.
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION; shell CS220-01 is OFFICIAL and PROVISIONED with no enrollments."
            - "Tool ReadEasy 1.0.0 (pii_tier 0, ROSTER_ONLY, vpat_score 90.00, AA -> risk 13.00) is UNDER_REVIEW with both dimensions CLEARED but has NOT been finalized."
            - "A ToolPlacement of that tool on that shell exists in REQUESTED."
          setup_api_calls:
            - call: "POST /academic-terms"
