  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: election_approval_gated_by_eligibility_determination_status
        grounds:
          - state_machines.ContributionElection.SUBMITTED_to_EFFECTIVE
          - calculations.eligibility_determination
          - validations[priority=19]
          - errors[ERR_PARTICIPANT_NOT_ELIGIBLE]
          - endpoints[PATCH /plan-admin/participants/{id}]
        distinguishing_aspect: |
          Entity pair ContributionElection -> EligibilityDetermination: the election's
          SUBMITTED -> EFFECTIVE transition is legal only while the latest non-superseded
          determination for the same (plan, participant) reads ELIGIBLE. With the
          participant flagged as a student the approval is refused with
          ERR_PARTICIPANT_NOT_ELIGIBLE; clearing the flag and re-running the determination
          makes the identical approval succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan and a valid 2026 universal availability notice."
            - "One participant flagged is_student_performing_services true, holding one contract."
            - "An eligibility determination made by compliance officer co-1 that therefore reads EXCLUDED_STUDENT."
            - "A SUBMITTED election for 1000000 cents with catchup_election NONE over [2026-09-01, 2026-12-31]."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
            - call: "POST /plan-admin/vendors"
              payload: { legal_name: "Northline Annuity", vendor_code: "NLA", contact_email: "ops@northline.example" }
              as: SystemOperator
              captures: { v1_id: $.data.id }
            - call: "POST /plan-admin/plans"
              payload: { employer_id: "${emp_id}", plan_name: "Riverbend 403(b)", plan_type: "PLAN_403B", plan_year: 2026, reported_participant_count: 250 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { p403_id: $.data.id }
            - call: "POST /plan-admin/plans/${p403_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/plans/${p403_id}/universal-availability-notices"
              payload: { plan_year: 2026, issued_date: "2026-01-05", delivery_method: "EMAIL", recipient_count: 250, describes_effective_opportunity: true }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Sam Student", date_of_birth: "1998-02-02", hire_date: "2024-09-01", scheduled_hours_per_week: 25, prior_year_hours_worked: 1200, includible_compensation_cents: 2000000, years_of_service: 2, is_student_performing_services: true }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /plan-admin/vendor-accounts"
              payload: { participant_id: "${ps_id}", plan_id: "${p403_id}", vendor_id: "${v1_id}", contract_number: "NLA-S001", accumulated_benefit_cents: 500000, vested_percentage_bps: 10000 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { as_id: $.data.id }
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${ps_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { det1_id: $.data.id }
            - call: "GET /plan-admin/participants/${ps_id}"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { ps_v: $.data.version }
            - call: "POST /plan-admin/contribution-elections"
              payload: { participant_id: "${ps_id}", plan_id: "${p403_id}", vendor_account_id: "${as_id}", annual_deferral_amount_cents: 1000000, effective_from: "2026-09-01", effective_through: "2026-12-31", expected_participant_version: "${ps_v}" }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { el_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/contribution-elections/${el_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
            - call: "PATCH /plan-admin/participants/${ps_id}"
              payload: { is_student_performing_services: false }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/eligibility-determinations"
              payload: { plan_id: "${p403_id}", participant_id: "${ps_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { det2_id: $.data.id }
            - call: "POST /plan-admin/contribution-elections/${el_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "EligibilityDetermination.${det1_id}.status == EXCLUDED_STUDENT"
            - "the first approval responds 422 with data.error_id == ERR_PARTICIPANT_NOT_ELIGIBLE"
            - "after the first approval attempt, ContributionElection.${el_id}.state == SUBMITTED"
            - "EligibilityDetermination.${det1_id}.superseded == true after the second determination is created"
            - "EligibilityDetermination.${det2_id}.status == ELIGIBLE and notice_status == CURRENT"
            - "the second approval responds 200 and ContributionElection.${el_id}.state == EFFECTIVE"
            - "ContributionElection.${el_id}.basic_deferral_attributed_cents == 1000000"

      - name: loan_approval_gated_by_every_contract_information_sharing_agreement
        grounds:
          - state_machines.ParticipantRequest.UNDER_REVIEW_to_APPROVED
          - validations[priority=25]
          - errors[ERR_ISA_DATA_STALE]
          - entities.InformationSharingAgreement.fields.data_stale
