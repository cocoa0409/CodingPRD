            - "Episode.${ep2_id}.sequence_no == 2"
            - "Season.${season_id}.scheduled_episode_count == 2"
            - "Season.${season_id}.cadence_debt_days == 5"
            - "Season.${season_id}.content_posture == ON_TRACK"

      - name: corner_calc_dual_variant_divergence_and_selection
        claim_type: Variant Divergence
        grounds:
          - calculations.season_sink_faucet_ratio_bp
          - calculations.player_pacing_bp
        excluded_because:
          difficulty_instance: "dual_variant_calc / season_sink_faucet_ratio_epoch_vs_lifetime"
          rationale: |
            Both dual-variant calculations are already driven end to end by the dual_variant_calc
            instances, which assert the divergent numbers (4000 vs 7273 and 8000 vs 3333), the
            band each variant implies and which variant is the persisted one.

      - name: corner_calc_constraint_propagation_reaches_fixed_point
        claim_type: Change propagates through chain; reaches fixed point; no infinite loop
        grounds:
          - calculations.episode_grant_recipient_set
          - entities.Season.fields.lifetime_ratio_bp
        excluded_because:
          difficulty_instance: "transitive_cascade / episode_release_faucet_cascade_to_season_ratio"
          rationale: |
            That instance follows the selector's propagation from the episode through the ledger,
            the accounts and the season's derived ratio and asserts the terminal values, i.e. the
            fixed point, of a single release call.

      - name: corner_calc_aggregation_running_total_after_reversal
        claim_type: Running total correct after add; correct after reversal; floor/ceiling honored
        grounds:
          - calculations.season_sink_faucet_ratio_bp
          - entities.EconomyLedgerEntry.fields.reversal_of_entry_id
        excluded_because:
          difficulty_instance: "dual_variant_calc / season_sink_faucet_ratio_epoch_vs_lifetime"
          rationale: |
            The reversal-pair fixture in that instance is exactly the add-then-reverse aggregation
            scenario, and it asserts both the net-of-reversal total and the gross total over the
            same rows.

  # ===========================================================================
  - section: validations
    instances:
      - name: corner_val_disclosure_probability_sum_violation
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_DISCLOSURE_PROBABILITY_SUM]
          - endpoints["POST /offers/{offer_id}/disclosures"]
        distinguishing_aspect: |
          A randomized-item table whose probabilities total 9900 bp is rejected with
          ERR_DISCLOSURE_PROBABILITY_SUM (422) and creates no ProbabilityDisclosure row, so the
          sum must equal 10000 exactly rather than merely staying under it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer CRATE_A is a DRAFT LOOT_BOX (list 300, declared 400)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LOOT_BOX", sku: "CRATE_A", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "CRATE_KEY", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { crate_id: $.data.id }
          trigger:
            - call: "POST /offers/${crate_id}/disclosures"
              payload: { entries: [{ item_sku: "COMMON_SKIN", probability_bp: 8400, declared_value_minor: 200 }, { item_sku: "RARE_SKIN", probability_bp: 1400, declared_value_minor: 1500 }, { item_sku: "MYTHIC_SKIN", probability_bp: 100, declared_value_minor: 9000 }] }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_DISCLOSURE_PROBABILITY_SUM"
            - "GET /offers/${crate_id}/disclosures returns total_count 0"
            - "Offer.${crate_id}.disclosure_state == REQUIRED_MISSING"

      - name: corner_val_publish_satisfies_every_gate
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - endpoints["POST /offers/{offer_id}/publish"]
          - entities.Offer.fields.availability_status
        distinguishing_aspect: |
          When the probability table sums to exactly 10000 and is PUBLISHED, the fairness index
          clears the floor and no SKU window conflicts, the same publish call returns 200 with
          availability_status LIVE and increments the season's live_offer_count to 1.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer CRATE_A (LOOT_BOX, list 300, declared 400, fairness 13333) is APPROVED."
            - "Its probability table 8500/1400/100 bp sums to 10000 and is published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LOOT_BOX", sku: "CRATE_A", price_tier: "T1", list_price_minor: 300, line_items: [{ sku: "CRATE_KEY", base_price_minor: 300, declared_value_minor: 400, granted_currency_code: "HARD_GEM", granted_amount_minor: 300 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { crate_id: $.data.id }
            - call: "POST /offers/${crate_id}/disclosures"
              payload: { entries: [{ item_sku: "COMMON_SKIN", probability_bp: 8500, declared_value_minor: 200 }, { item_sku: "RARE_SKIN", probability_bp: 1400, declared_value_minor: 1500 }, { item_sku: "MYTHIC_SKIN", probability_bp: 100, declared_value_minor: 9000 }] }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { disc_id: $.data.id }
            - call: "POST /offers/${crate_id}/disclosures/${disc_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /offers/${crate_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${crate_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
          trigger:
            - call: "POST /offers/${crate_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
          assert:
            - "response status == 200"
            - "ProbabilityDisclosure.${disc_id}.total_probability_bp == 10000"
            - "ProbabilityDisclosure.${disc_id}.expected_value_minor == 470"
            - "Offer.${crate_id}.disclosure_state == PUBLISHED"
            - "Offer.${crate_id}.fairness_index_bp == 13333"
            - "Offer.${crate_id}.approval_status == APPROVED"
            - "Offer.${crate_id}.availability_status == LIVE"
            - "Season.${season_id}.live_offer_count == 1"

      - name: corner_val_unauthorized_role_precedes_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_SEASON_NOT_FOUND]
        distinguishing_aspect: |
          A Player-role caller aiming a season status change at a season id that does not exist
          receives ERR_UNAUTHORIZED (403), not ERR_SEASON_NOT_FOUND (404): role screening at
          priority 2 runs before existence resolution at priority 4 and therefore leaks nothing
          about which ids exist.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Player pz exists so the X-User-ID resolves to a real Player entity."
            - "No Season with id 00000000-0000-4000-8000-000000000000 has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pz", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pz_id: $.data.id }
          trigger:
            - call: "POST /seasons/00000000-0000-4000-8000-000000000000/status"
              payload: { to_status: "LIVE" }
              as: Player
              as_user_id: "${pz_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"
            - "response data.error_id != ERR_SEASON_NOT_FOUND"

      - name: corner_val_stale_version_precedes_window_gate
        claim_type: Priority conflict
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_STALE_OFFER_VERSION]
          - errors[ERR_OFFER_WINDOW_CLOSED]
        distinguishing_aspect: |
          A purchase carrying the offer version captured before two availability writes, aimed at
          an offer whose window has also already closed, returns ERR_STALE_OFFER_VERSION (412) —
          the priority-7 concurrency guard, not the priority-24 window guard.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offer WIN_PACK (LIMITED_TIME, list 900, declared 1200) is APPROVED and published; its version is captured immediately after publish."
            - "The offer is then SUSPENDED and resumed to LIVE, bumping its version twice while still inside the window."
            - "The clock is then moved to 2026-08-25, five days past window_end 2026-08-20."
            - "Player pw (NA, adult) holds a HARD_GEM account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pw", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pw_id: $.data.id }
            - call: "POST /players/${pw_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { pw_gem_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LIMITED_TIME", sku: "WIN_PACK", price_tier: "T1", list_price_minor: 900, line_items: [{ sku: "WIN_COINS", base_price_minor: 900, declared_value_minor: 1200, granted_currency_code: "HARD_GEM", granted_amount_minor: 900 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { win_id: $.data.id }
            - call: "POST /offers/${win_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${win_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
            - call: "POST /offers/${win_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { win_v_stale: $.data.version }
            - call: "POST /offers/${win_id}/availability"
              payload: { to_status: "SUSPENDED", reason: "Art fix" }
              as: LiveOpsCommander
            - call: "POST /offers/${win_id}/availability"
              payload: { to_status: "LIVE", reason: "Art fix shipped" }
              as: LiveOpsCommander
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /purchases"
              payload: { player_id: "${pw_id}", offer_id: "${win_id}", expected_offer_version: "${win_v_stale}" }
              as: Player
              as_user_id: "${pw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response data.error_id == ERR_STALE_OFFER_VERSION"
            - "response data.error_id != ERR_OFFER_WINDOW_CLOSED"
            - "GET /purchases?player_id=${pw_id} returns total_count 0"
            - "CurrencyAccount.${pw_gem_id}.balance_minor == 0"

      - name: corner_val_cross_entity_frozen_account_blocks_adjustment
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=9]
          - errors[ERR_CURRENCY_ACCOUNT_FROZEN]
          - state_machines.Player.UNRESTRICTED_to_FROZEN
          - endpoints["POST /currency-accounts/{account_id}/adjustments"]
        distinguishing_aspect: |
          The same FAUCET adjustment succeeds while the owning player is UNRESTRICTED and is
          rejected with ERR_CURRENCY_ACCOUNT_FROZEN (409) after a compliance LOCK froze the
          account — validity depends on the owner's spend_state, not on the account's own inputs.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Player pf (NA, adult) holds a SOFT_COIN account with balance 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pf", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pf_id: $.data.id }
            - call: "POST /players/${pf_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { pf_soft_id: $.data.id }
            - call: "POST /currency-accounts/${pf_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 500, source_kind: "COMPENSATION" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /players/${pf_id}/spend-guard"
              payload: { action: "LOCK", note: "Chargeback investigation" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "POST /currency-accounts/${pf_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 500, source_kind: "COMPENSATION" }
              as: LiveOpsCommander
              captures: { err: $.data.error_id }
          assert:
            - "the pre-lock adjustment returned status 201"
            - "Player.${pf_id}.spend_state == LOCKED"
            - "CurrencyAccount.${pf_soft_id}.status == FROZEN"
            - "second adjustment response status == 409"
            - "second adjustment response data.error_id == ERR_CURRENCY_ACCOUNT_FROZEN"
            - "CurrencyAccount.${pf_soft_id}.balance_minor == 500"
            - "GET /ledger-entries?currency_account_id=${pf_soft_id} returns total_count 1"

      - name: corner_val_conditional_guardian_flag_only_for_minors
        claim_type: Conditional validation
        grounds:
          - validations[priority=11]
          - errors[ERR_GUARDIAN_VERIFICATION_REQUIRED]
          - entities.Player.fields.is_minor
          - entities.Player.fields.guardian_verified
        distinguishing_aspect: |
          The guardian gate is keyed on is_minor alone: an unverified minor is refused with
          ERR_GUARDIAN_VERIFICATION_REQUIRED (409) while an adult with an identical (false)
          guardian_verified flag buys the very same 300-minor offer successfully.
