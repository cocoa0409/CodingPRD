              payload: { service_area_id: "${sa_id}", kind: "NO_FLY", center_lat: 37.05, center_lon: -122.0, radius_km: 1.0, effective_from: "2026-06-01T08:00:00Z", effective_to: "2026-06-01T18:00:00Z" }
              as: FlightDirector
              as_user_id: "fd-1"
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /geofence-zones/${zone_id}/lift"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "the first launch -> 409 with error_id ERR_GEOFENCE_VIOLATION; Flight.${flight_id}.ops_state == PLANNED"
            - "GeofenceZone.${zone_id}.status == LIFTED after the lift"
            - "the second launch -> 200; Flight.${flight_id}.ops_state == LAUNCHED"
            - "Drone.${drone_id}.status == IN_FLIGHT and Battery.${bat_id}.state == IN_USE"

      - name: weather_thresholds_are_inclusive_at_35_kph_and_45_kph_gust
        claim_type: constants_applied
        grounds: [calculations.weather_flyability, entities.WeatherObservation.fields.flyable]
        distinguishing_aspect: "flyable uses wind_kph <= 35 AND gust_kph <= 45 AND visibility_km >= 1.5: an observation at exactly 35 / 45 / 1.5 is flyable == true, while 35.1 kph wind is flyable == false."
        test_recipe:
          setup: ["Bay service area."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /weather-observations"
              payload: { service_area_id: "${sa_id}", observed_at: "2026-05-01T07:00:00Z", wind_kph: 35, gust_kph: 45, visibility_km: 1.5, precip: "LIGHT" }
              as: PlatformAdmin
              captures: { obs_edge: $.data.id }
            - call: "POST /weather-observations"
              payload: { service_area_id: "${sa_id}", observed_at: "2026-05-01T08:00:00Z", wind_kph: 35.1, gust_kph: 45, visibility_km: 1.5, precip: "LIGHT" }
              as: PlatformAdmin
              captures: { obs_over: $.data.id }
          assert:
            - "WeatherObservation.${obs_edge}.flyable == true"
            - "WeatherObservation.${obs_over}.flyable == false"

      - name: selector_ranks_by_charge_then_hours_then_created_at
        claim_type: correct_result
        grounds: [calculations.dispatch_drone_selection, entities.Drone.fields.hours_since_service]
        distinguishing_aspect: "Ranking is charge_pct DESC, then hours_since_service ASC, then created_at ASC: among three eligible airframes (100%/20 h, 100%/5 h, 90%/0 h) the selector picks the 100%/5 h drone — never the freshest airframe and never a UUID-ordered pick."
