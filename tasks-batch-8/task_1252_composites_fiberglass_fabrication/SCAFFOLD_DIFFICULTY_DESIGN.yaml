      - name: mold_maintenance_cycle_returns_to_active
        grounds:
          - state_machines.Mold.ACTIVE_to_MAINTENANCE_DUE
          - state_machines.Mold.MAINTENANCE_DUE_to_IN_MAINTENANCE
          - state_machines.Mold.IN_MAINTENANCE_to_ACTIVE
        distinguishing_aspect: |
          Mold machine is cyclic: ACTIVE -> MAINTENANCE_DUE -> IN_MAINTENANCE ->
          ACTIVE, with the loop closed by a maintenance completion that resets
          cycles_since_maintenance to 0. Companion instance is on a different
          entity (WorkOrder repair loop).
        test_recipe:
          setup:
            - "Clock T0; permit; approved PN-100; PRODUCTION mold with maintenance_interval_cycles=1; WO-MC1 cured once on that mold"
