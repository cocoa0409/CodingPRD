              captures: { s1: $.data.id }
            - call: "POST /field-force/inventory-count-sessions/${s1}/void"
              payload: {}
              as: DistrictManager
              as_user_id: "${m_id}"
            - call: "POST /field-force/inventory-count-sessions"
              payload: { representative_id: "${c_id}", counter_rep_id: "${k_id}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-11T00:00:00Z" }
              as: DistrictManager
              as_user_id: "${m_id}"
              captures: { s2: $.data.id }
          trigger:
