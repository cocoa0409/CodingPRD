              captures: { st: $.data.status, price: $.data.price_cents }
          assert:
            - "the confirm response itself has status == CONFIRMED and price_cents == 2000 (STANDARD, no discount) — all effects visible in the same response"
            - "a subsequent GET shows identical values (no eventual-consistency drift)"
