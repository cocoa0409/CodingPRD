            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Three" }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Four" }, as: SchoolCoach, as_user_id: "${s_a}" }
          trigger:
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Five" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
            - { call: "GET /entries?school_id=${s_a}&division_id=${d}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "the 4th create succeeded (count 4 == cap 4 is allowed; the cap blocks only what would exceed it)"
            - "5th create rejected with ERR_SCHOOL_ENTRY_CAP_EXCEEDED (409)"
            - "GET /entries?school_id&division_id returns total_count == 4 (rejected entry not persisted)"

      - name: speaker_point_range_boundary
        grounds:
          - validations[priority=11]
          - entities.Ballot.fields.speaker_points
        distinguishing_aspect: |
          Metric: speaker point integer against the inclusive [20,30] range — 30 accepted,
          31 rejected, 19 rejected. Endpoint: POST /ballots — a third distinct endpoint and
          metric, complementing the win-count and entry-count boundaries.
        test_recipe:
          setup:
            - "Same reachable state as the ballot-cycle fixture: tournament (prelim_round_count 2), DEBATE/CX/VARSITY division, schools A-D with 1 confirmed entry each, school E with 2 committed judges, locked, round 1 paired (A1,B1) and (C1,D1), staffed with E judges, ballots open."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts SR", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 2, entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
