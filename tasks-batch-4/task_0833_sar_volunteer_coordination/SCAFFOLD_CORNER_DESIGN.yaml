              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/after-action-reports"
              payload: { incident_id: "${inc_id}", summary: "prelim" }
              as: Coordinator
              captures: { aar_id: $.data.id }
          trigger:
            - call: "POST /sar/after-action-reports/${aar_id}/finalize"
              payload: {}
              as: IncidentCommander
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INCIDENT_NOT_CLOSED"

