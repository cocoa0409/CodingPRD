              captures: { off101cb: "$.data.id" }
            - call: "POST /fire-ops/vacancies/${v101b}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off101vo: "$.data.id" }
          assert:
            - "CALLBACK: OvertimeOffer.${off101cb}.firefighter_id == ${ff101d} — the senior, cheaper platoon C member is excluded because his platoon is on duty"
            - "CALLBACK: hiring_mode == \"CALLBACK\", roster_id == ${r101cb}, projected_cost_cents == 33896 (4237 * max(4,3) * 2.0)"
            - "VOLUNTARY: OvertimeOffer.${off101vo}.firefighter_id == ${ff101c} — no platoon filter applies and he is not on a Kelly day"
            - "VOLUNTARY: roster_id == ${r101vo} and projected_cost_cents == 144000 (4000 * 24 * 1.5)"
            - "Station.${st101}.ot_committed_cents == 177896 and both vacancies are OFFERING"
            - "HiringRoster.${r101cb}.dispatch_count == 1 and HiringRoster.${r101vo}.dispatch_count == 1"

