            - call: "POST /print-jobs/${job2}/approve-proof"
              payload: {}
              as: ElectionsDirector
          assert:
            - "Call 1 returns ERR_STYLE_STATE_INVALID with HTTP 409: the payload is well formed and the pinned version is current, but S-200 is DRAFT and print-job creation requires APPROVED or LOCKED. No PrintJob row is created for S-200."
            - "Call 2 succeeds: BallotStyle.${st1}.status == LOCKED, S-200 stays DRAFT (no precinct points at it), Election.${el}.status == STYLES_LOCKED, and BallotStyle.${st1}.version is strictly greater than ${st1_v_approved}."
