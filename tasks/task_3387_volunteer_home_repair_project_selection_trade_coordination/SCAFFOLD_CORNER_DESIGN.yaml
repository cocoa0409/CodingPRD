              as: Any
              captures: { si: "$.data[0].id" }
            - call: "POST /rebuild/trade-contractors"
              payload: { legal_name: "Sched Co", trade: "ELECTRICAL", license_number: "E-18", license_expires_on: "2028-01-01", insurance_expires_on: "2028-01-01" }
              as: PlatformAdmin
              captures: { contr: $.data.id }
            - call: "POST /rebuild/trade-work-orders"
              payload: { project_id: "${proj}", contractor_id: "${contr}", scope_item_ids: ["${si}"] }
              as: AffiliateStaff
              captures: { wo: $.data.id }
