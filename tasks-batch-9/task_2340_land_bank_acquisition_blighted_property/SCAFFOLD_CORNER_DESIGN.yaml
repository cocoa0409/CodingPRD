              as_user_id: "intake-1"
              captures: { pk2_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk2_id}/board-approval"
              payload: { resolution_no: "R-2026-771" }
              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk2_id}/close"
              payload: { deed_reference: "BK-4970-PG-02" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p3_id}", funding_source_id: "${fs_id}", channel: "DONATION", offer_price_cents: 0, title_search_fee_cents: 3000, donor_name: "Yew Trust" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk3_id: $.data.id }
