        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: cake_quote_applies_rush_fee_before_volume_discount
          rationale: "The §1.8 combinatorial_formula instance already pins every tier boundary of the quote (rush bracket off the subtotal, discount bracket off the fee-inflated total) with the divergent 19246 vs 20315 comparison."

      - name: oven_deck_interval_merge_treats_the_buffer_as_part_of_the_occupation
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: oven_deck_rejects_run_inside_the_changeover_buffer
          rationale: "The §1.8 resource_temporal_overlap instance already tests the buffered deck interval at the exact release instant and one minute inside it, which is the interval_merge adjacency claim for this calculation."

