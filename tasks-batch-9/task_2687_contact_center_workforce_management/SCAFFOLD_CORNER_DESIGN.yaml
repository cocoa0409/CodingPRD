            - "gen is an empty array: the waterfall's eligible pool for a CHAT_EN interval excludes the VOICE_EN-only partner rather than erroring"
            - "unserved == 82 and IntervalPlan.${ip0_id}.partner_committed_volume == 0"
            - "GET /partner-allocations filtered to interval_plan_id ${ip0_id} returns total_count 0"

      - name: expired_intraday_action_response_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=130]
          - state_machines.IntradayAction.OFFERED_to_EXPIRED
          - errors.ERR_ACTION_EXPIRED
        distinguishing_aspect: |
          The expiry comparison is "strictly before expires_at", so a response at EXACTLY
          2026-09-06T12:00:00Z is late. This is the scaffold's only edge that both refuses the
          request (409 ERR_ACTION_EXPIRED) and mutates the row in the same breath: the action moves
          OFFERED -> EXPIRED. No ledger field moves, so the cycle overtime spend stays 0 and the
          shift keeps its original end_at, and a second response attempt now answers
          ERR_ACTION_NOT_OFFERED instead because the row is terminal.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; cycle W37-EXP over 2026-09-07..2026-09-13, posture REQUIREMENTS_LOCKED."
            - "One VOICE_EN agent under LA-CORE with one published Monday shift (08:00-16:00, paid 7.50)."
            - "One OFFERED OT_OFFER of 1.0 hour on that shift with expires_at 2026-09-06T12:00:00Z."
