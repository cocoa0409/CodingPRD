            - "Severity S: base = 100.0*min(1.0, 10000/200000) = 5.00; raw = 5.00*0.90 + 0.0 + 0.0 + 20.0*0.1000 = 6.50 -> FAST_TRACK; reported 10000.00 <= 10000.00 -> DESK."
            - "Claim T: identical except reported_loss_amount 10000.01. base = 5.0000025; raw = 4.50000225 + 2.0 = 6.50000225 -> round_half_up 2dp = 6.50 -> FAST_TRACK; reported 10000.01 > 10000.00 -> FIELD."
