          assert:
            - "DistributionCenter.${dc_id}.operations_posture == OPEN on creation"
            - "CatalogItem.${item_id}.curation_review_state == UNREVIEWED on creation and curation_last_reviewed_by is null"
            - "CatalogItem.${item_id}.catalog_status == ACTIVE on creation"
            - "no POST payload accepted curation_review_state or catalog_status as an input on either creation call"

      - name: curation_review_revoke_is_idempotent_in_effect
        claim_type: Idempotency
        grounds:
          - state_machines.CatalogItem.APPROVED_to_UNREVIEWED
          - endpoints.POST_/curation-reviews/{id}/revoke
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A second revoke of the same review batch is refused with 409 ERR_INVALID_STATE because the batch is already REVOKED, and the items it returned to UNREVIEWED are not touched a second time."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One item curated and approved through one review batch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
