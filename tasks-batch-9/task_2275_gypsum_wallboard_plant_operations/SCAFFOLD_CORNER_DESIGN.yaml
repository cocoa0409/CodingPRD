            - "ProductionRun.${r1_id}.stucco_consumed_tons == 199.125 (295.000 * 1350 / 2000, scrap not charged)"
            - "ProductionRun.${r1_id}.net_good_msf == 290.000 and available_msf == 290.000"
            - "Plant.${plant_id}.stucco_committed_tons == 0.000 and stucco_on_hand_tons == 5.405"
            - "Plant.${plant_id}.stucco_available_tons == 5.405 and production_posture == RESTRICTED"
            - "ProductionRun.${r1_id}.quality_state == UNTESTED and saleable_grade == UNGRADED (the quality dimension is untouched)"
            - "BoardLine.${line_id}.status == AVAILABLE"

      - name: lot_reassay_cycle_is_bounded
        claim_type: cyclic
        grounds:
          - state_machines.GypsumLot.status.QUARANTINED_to_RECEIVED
        excluded_because:
          difficulty_instance: non_linear_state_machine / lot_quarantine_reassay_cycle_bounded_at_three
          rationale: "That instance walks the QUARANTINED -> RECEIVED -> APPROVED/QUARANTINED loop twice and proves the third re-assay is refused with ERR_MAX_ASSAYS_REACHED."

      - name: outage_defer_repropose_cycle
        claim_type: cyclic
        grounds:
          - state_machines.MaintenanceOutage.status.DEFERRED_to_PROPOSED
        excluded_because:
          difficulty_instance: non_linear_state_machine / outage_defer_repropose_cycle_unlocks_seasonality_gate
          rationale: "That instance shows the defer/repropose loop both counting deferrals and, at deferral_count 2, unlocking the seasonality gate that blocked the first proposal."

      - name: run_status_and_quality_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.ProductionRun.status
          - state_machines.ProductionRun.quality_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / run_status_and_quality_dimensions_advance_independently
          rationale: "That instance advances the two parallel dimensions in interleaved order and asserts neither constrains the other except at the declared ship gate."

      - name: outage_approval_cascades_down_to_line_and_run
        claim_type: cascade_down
        grounds:
          - state_machines.MaintenanceOutage.status.PROPOSED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / emergency_outage_approval_cascades_line_run_plant
          rationale: "That instance follows the depth-3 cascade outage -> line -> run -> plant posture on an EMERGENCY approval."

      - name: batch_abort_compensates_lot_balances
        claim_type: compensation
        grounds:
          - state_machines.CalcinerBatch.status.FEEDING_to_ABORTED
        excluded_because:
          difficulty_instance: compensating_invariant / gypsum_mass_conservation_across_feed_abort
          rationale: "That instance proves the abort restores every feed's tonnage and pulls DEPLETED lots back to APPROVED, conserving received_tons."

      - name: run_start_is_guarded_by_batch_completion
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProductionRun.status.SCHEDULED_to_RUNNING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_start_blocked_until_calciner_batch_completed
          rationale: "That instance holds the batch in CALCINING, shows start rejected, then passes the stucco test and shows the same call succeed."

  - section: calculations
    instances:

      - name: planned_yield_applies_hemihydrate_factor_only_to_the_gypsum_fraction
        claim_type: constants_applied
        grounds:
          - calculations.stucco_yield_tons
          - endpoints[POST /plant-ops/calciner-batches/{batchId}/close-feed]
        distinguishing_aspect: |
          On a single 100.000 t feed at 10.00 % moisture and 90.0 % purity the HEMIHYDRATE_FACTOR 0.8437
          multiplies only the 81.00 t gypsum fraction; the 9.00 t of inert passes through at 1.0, so the
          planned yield is 77.340 t and not 76.233 t (factor over the whole dry mass) nor 81.000 t.
        test_recipe:
          setup:
            - "Plant GYP-1 with a 100.000 t synthetic lot assayed 10.00 % / 90.0 % and batch BM in FEEDING with that single feed."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_m_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_m_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_m_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 80.000, calcination_temp_f: 320.0, feed_rate_tph: 25.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { bm_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bm_id}/feeds"
              payload: { lot_id: "${lot_m_id}", tons_fed: 100.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_m_v}" }
              as: MaterialsController
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bm_id}/close-feed"
              payload: {}
              as: MaterialsController
          assert:
            - "response status == 200"
            - "CalcinerBatch.${bm_id}.feed_tons_total == 100.000, feed_moisture_weighted_pct == 10.00, feed_purity_weighted_pct == 90.00"
            - "dry_tons 90.000 splits into gypsum 81.000 and inert 9.000"
            - "CalcinerBatch.${bm_id}.stucco_yield_planned_tons == 77.340 (81.000 * 0.8437 = 68.3397, + 9.000, rounded once at 3 dp)"
            - "CalcinerBatch.${bm_id}.status == CALCINING and stucco_yield_actual_tons == 0.000 (nothing credited yet)"
            - "Plant.${plant_id}.stucco_on_hand_tons == 0.000"

      - name: required_paper_tension_scales_with_line_speed_above_the_pivot
        claim_type: correct_result
        grounds:
          - calculations.paper_tension_window
          - entities.ProductionRun.fields.required_paper_tension_lb
        distinguishing_aspect: |
          required_paper_tension_lb is spec.paper_tension_min_lb + (line_speed_fpm - 250) * 0.06, so the
          REGULAR SKU at 400 fpm requires 37.00 lb while the TYPE_X SKU at 380 fpm requires 39.80 lb —
          the pivot speed 250 and the slope 0.06 are shared, the floor is per SKU.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 (500 fpm), the REGULAR SKU (min 28.0 lb, max speed 480) and the TYPE_X SKU (min 32.0 lb, max speed 420)."
            - "One PLANNED batch so the runs can be drafted; neither run is scheduled."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "REG-050-4X12", thickness_in: 0.5, board_type: "REGULAR", fire_rated: false, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 1600.0, stucco_lb_per_msf: 1350.0, slurry_water_stucco_ratio: 0.75, line_speed_max_fpm: 480, paper_tension_min_lb: 28.0, paper_tension_max_lb: 46.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 77.0, flexural_cross_min_lbf: 36.0, max_boards_per_bundle: 48, changeover_family: "STANDARD" }
              as: PlantAdmin
              captures: { spec_reg_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/product-specs"
              payload: { sku_code: "TYPEX-0625-4X12", thickness_in: 0.625, board_type: "TYPE_X", fire_rated: true, board_width_in: 48.0, board_length_ft: 12.0, target_board_weight_lb_per_msf: 2100.0, stucco_lb_per_msf: 1820.0, slurry_water_stucco_ratio: 0.70, line_speed_max_fpm: 420, paper_tension_min_lb: 32.0, paper_tension_max_lb: 52.0, core_hardness_min_lbf: 15.0, nail_pull_min_lbf: 87.0, flexural_cross_min_lbf: 40.0, max_boards_per_bundle: 38, changeover_family: "FIRE_RATED" }
              as: PlantAdmin
              captures: { spec_tx_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 100.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T13:00:00Z" }
              as: MaterialsController
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_reg_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 400, paper_tension_lb: 38.0, kiln_dwell_minutes: 40, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r_reg_id: $.data.id }
            - call: "POST /plant-ops/production-runs"
              payload: { plant_id: "${plant_id}", line_id: "${line_id}", product_spec_id: "${spec_tx_id}", calciner_batch_id: "${b_id}", window_start: "2026-08-04T06:00:00Z", window_end: "2026-08-04T10:00:00Z", requested_planned_msf: 100.000, line_speed_fpm: 380, paper_tension_lb: 40.0, kiln_dwell_minutes: 50, kiln_exit_moisture_target_pct: 0.50 }
              as: ProductionScheduler
              captures: { r_tx_id: $.data.id }
          assert:
            - "both creations returned 201 with status == DRAFT"
            - "ProductionRun.${r_reg_id}.required_paper_tension_lb == 37.00 (28.0 + (400 - 250) * 0.06)"
            - "ProductionRun.${r_tx_id}.required_paper_tension_lb == 39.80 (32.0 + (380 - 250) * 0.06)"
            - "both supplied tensions sit inside [required, spec.paper_tension_max_lb], so neither call raised ERR_PAPER_TENSION_OUT_OF_RANGE"

