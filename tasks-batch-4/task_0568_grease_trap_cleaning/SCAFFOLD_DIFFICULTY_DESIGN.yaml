              as_user_id: "${tech_id}"
            - call: "POST /pump-out-manifests"
              payload: { work_order_id: "${wo_id}", disposal_facility_name: "Acme", disposal_facility_permit: "FAC-6", hazmat_certified: false, volume_gallons: 800, fog_percentage: 5.0 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { man_id: $.data.id }
          trigger:
            - call: "POST /pump-out-manifests/${man_id}/void"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { man_status: $.data.status }
          assert:
            - "PumpOutManifest.${man_id}.status == VOIDED"
            - "Equipment.${eq_id}.lifetime_pumped_gallons == 0"
