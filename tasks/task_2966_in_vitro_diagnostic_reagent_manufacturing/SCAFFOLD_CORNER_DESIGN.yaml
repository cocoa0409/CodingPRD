            - "the lot's allocation list returns an empty paginated array with total_count 0 and has_more false rather than a 404, since the lot has never been allocated"

      - name: the_clock_endpoint_is_shared_by_every_role_and_governs_every_derived_timestamp
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_clock_set_current_utc
          - roles.shared_operations
        distinguishing_aspect: "The clock is the only operation every one of the six roles may call, and it is the sole source of created_at, received_at, performed_at and every deadline in the domain. Pinning it as a shared operation also pins the harness contract that later corners depend on: the same instant set twice must produce identical stamps on two different entities."
        test_recipe:
          setup:
            - "No fixtures beyond the calls below."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T08:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { clock_qc: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T09:00:00Z" }
              as: ProductionOperator
              captures: { clock_po: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T10:00:00Z" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { clock_qa: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T11:00:00Z" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { clock_ra: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: DistributionPlanner
              as_user_id: "dp-01"
              captures: { clock_dp: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T13:00:00Z" }
              as: PlatformAdmin
              captures: { clock_admin: $.data.current_utc }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-EP-4", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_created: $.data.created_at, ms_updated: $.data.updated_at }
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-EP-4", reference_material_code: "REF-EP4", required_material_codes: ["AB-EP-4"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_created: $.data.created_at }
          assert:
            - "all six roles set the clock successfully, so it is a shared operation and not the PlatformAdmin's private endpoint"
            - "each response echoes the instant that was set, normalised to three fractional digits"
            - "the MaterialSpecification created after the last clock call carries created_at AND updated_at equal to 2026-07-01T13:00:00.000Z"
            - "the ProductSpecification created immediately afterwards carries the SAME created_at, proving the timestamp is read from the logical clock and not from wall time"

      - name: action_endpoints_apply_their_declared_transitions_and_side_effects
