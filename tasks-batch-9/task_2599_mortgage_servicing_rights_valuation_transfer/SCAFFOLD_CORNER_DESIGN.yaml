# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# Task 2599 — Mortgage Servicing Rights Valuation & Transfer
#
# Walked row-by-row against references/claim-extraction-guide.md. Sections and
# claim_type values are taken from that guide; nothing is invented here.
# Corners already asserted by a §1.8 instance carry an `excluded_because:` stub
# naming that instance instead of a duplicate recipe.
#
# Fixture vocabulary is identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml: logical
# clock default 2026-08-01T00:00:00Z, AssumptionSet desk-base
# (cpr 8.0 / discount 10.0 / cost 9000 / float 4.0 / years 3), RateCurveSnapshot
# C1 (2026-07-31, 4000 bps), Fixture T = four 10000050 loans at 25 bps in
# CA / TX / FL / NY, opaque actors va-001 / tm-001 / ag-001 / ag-002 / co-001 /
# co-002 / hd-001 / admin-001.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: counterparty_created_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Counterparty
          - endpoints[POST /msr/counterparties]
        distinguishing_aspect: "A POST carrying all five input fields returns 201 and every §1.1 field of Counterparty, including the system defaults, in one response."
        test_recipe:
          setup: ["Empty database; logical clock pinned to the 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
          trigger:
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { cp_id: "$.data.id", cp_status: "$.data.status", cp_open: "$.data.open_transfer_count", cp_v: "$.data.version" }
          assert:
            - "201 with response_type object and meta.api_request_id present"
            - "legal_name == Alpha Servicing LLC, role_type == SELLER, net_worth_cents == 500000000, servicer_rating == TIER_1, agency_approvals == [FNMA, FHLMC]"
            - "${cp_status} == ACTIVE and suspended_at is null"
            - "${cp_open} == 0 and ${cp_v} == 1"

      - name: loan_retrieval_returns_the_stored_field_values
        claim_type: retrieval
        grounds:
          - entities.Loan
          - endpoints[GET /msr/loans/{id}]
        distinguishing_aspect: "GET by id echoes every stored Loan field, including the two mapping-snapshot system fields which are null before any escrow sweep."
        test_recipe:
          setup: ["Portfolio Pool-T exists in DRAFT with one loan T-0001 (10000050 UPB, 25 bps, escrow 100000, suspense 25000, CURRENT, NONE, CA)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Bravo Servicing Inc", role_type: BUYER, net_worth_cents: 1200000000, servicer_rating: TIER_1, agency_approvals: [FNMA] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { buyer_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0001", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan1_id: "$.data.id" }
          trigger:
            - call: "GET /msr/loans/${loan1_id}"
              payload: {}
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { got_upb: "$.data.upb_cents", got_state: "$.data.state_code", got_status: "$.data.status", got_stamp: "$.data.escrow_balance_at_mapping_cents" }
          assert:
            - "200 with ${got_upb} == 10000050, ${got_state} == CA and note_rate_pct == 6.5"
            - "${got_status} == ACTIVE and transferred_at is null"
            - "${got_stamp} is null — the mapping snapshot is only written by map-escrow"
            - "portfolio_id equals ${pf_id}"

      - name: portfolio_listing_returns_the_declared_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /msr/portfolios]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint honours the declared defaults (limit 10, offset 0) and reports limit, offset, total_count and has_more; a limit of 1 against two portfolios sets has_more true."
        test_recipe:
          setup: ["Seller Alpha owns two portfolios, Pool-T and Pool-M."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Bravo Servicing Inc", role_type: BUYER, net_worth_cents: 1200000000, servicer_rating: TIER_1, agency_approvals: [FNMA] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { buyer_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-M", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pfm_id: "$.data.id" }
          trigger:
            - call: "GET /msr/portfolios"
              payload: { seller_id: "${seller_id}", limit: 1, offset: 0 }
              as: TransactionManager
              as_user_id: tm-001
              captures: { first_id: "$.data[0].id" }
          assert:
            - "200 with response_type array and exactly 1 item in data"
            - "total_count == 2, limit == 1, offset == 0, has_more == true"
            - "${first_id} is one of ${pf_id} or ${pfm_id}"
            - "the same call with offset 1 returns the other portfolio and has_more == false"
            - "omitting limit and offset entirely returns both portfolios with limit 10 and offset 0"

      - name: get_absent_portfolio_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PORTFOLIO_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unknown path id is a 404 with the entity-specific error id, not a generic 422."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
          trigger:
            - call: "GET /msr/portfolios/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TransactionManager
              as_user_id: tm-001
              captures: { err: "$.data.error_id" }
          assert:
            - "404 with ${err} == ERR_PORTFOLIO_NOT_FOUND and response_type error"
            - "the same unknown id on GET /msr/bid-packages/{id} returns ERR_BID_PACKAGE_NOT_FOUND, so the catalog is entity-specific"

      - name: create_loan_missing_required_upb_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Loan.fields.upb_cents
          - endpoints[POST /msr/portfolios/{id}/loans]
          - validations[priority=3]
        distinguishing_aspect: "upb_cents has source input and no default, so omitting it is a shape error at priority 3 — ahead of every state or business check."
        test_recipe:
          setup: ["Portfolio Pool-T exists in DRAFT with no loans."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Bravo Servicing Inc", role_type: BUYER, net_worth_cents: 1200000000, servicer_rating: TIER_1, agency_approvals: [FNMA] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { buyer_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
          trigger:
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0001", note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "422 with ${err} == ERR_INVALID_REQUEST"
            - "GET /msr/portfolios/${pf_id} still shows loan_count 0 and total_upb_cents 0"
            - "omitting loan_number, note_rate_pct, servicing_fee_bps or state_code fails the same way"

      - name: omitted_optional_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Counterparty.fields.agency_approvals
          - entities.Loan.fields.escrow_balance_cents
          - entities.Loan.fields.delinquency_bucket
          - entities.Loan.fields.loss_mit_status
        distinguishing_aspect: "Four different defaults are exercised in one chain: an empty agency_approvals list on Counterparty, and 0 / CURRENT / NONE on Loan — with the empty list distinguished from null."
        test_recipe:
          setup: ["Logical clock at the default instant; a SELLER counterparty is created without agency_approvals."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Delta Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_2 }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { d_id: "$.data.id", d_appr: "$.data.agency_approvals" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${d_id}", portfolio_name: "Pool-D", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${d_id}"
              captures: { pfd_id: "$.data.id" }
          trigger:
            - call: "POST /msr/portfolios/${pfd_id}/loans"
              payload: { loan_number: "D-0001", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${d_id}"
              captures: { l_escrow: "$.data.escrow_balance_cents", l_susp: "$.data.suspense_balance_cents", l_dq: "$.data.delinquency_bucket", l_lm: "$.data.loss_mit_status" }
          assert:
            - "${d_appr} == [] (an empty array, not null)"
            - "${l_escrow} == 0 and ${l_susp} == 0"
            - "${l_dq} == CURRENT and ${l_lm} == NONE"
            - "GET /msr/portfolios/${pfd_id} shows custodial_funds_total_cents 0 as a consequence of the two zero defaults"

      - name: portfolio_aggregates_are_computed_from_its_loans
        claim_type: computed_fields
        grounds:
          - entities.ServicingPortfolio.fields.loan_count
          - entities.ServicingPortfolio.fields.total_upb_cents
          - entities.ServicingPortfolio.fields.weighted_avg_note_rate_pct
          - entities.ServicingPortfolio.fields.custodial_funds_total_cents
        distinguishing_aspect: "All four aggregates are derived from the Loan rows and are re-derived on each insert; the weighted average is UPB-weighted, which a plain mean would get wrong on the mixed Fixture V pool (6.5833 versus 6.5000)."
        test_recipe:
          setup: ["Portfolio Pool-V is created and the three Fixture V loans are added one at a time."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Bravo Servicing Inc", role_type: BUYER, net_worth_cents: 1200000000, servicer_rating: TIER_1, agency_approvals: [FNMA] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { buyer_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "V-0001", upb_cents: 20000000, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 300000, suspense_balance_cents: 0, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
            - call: "GET /msr/portfolios/${pf_id}"
              payload: {}
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { c1_count: "$.data.loan_count", c1_upb: "$.data.total_upb_cents", c1_wavg: "$.data.weighted_avg_note_rate_pct" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "V-0002", upb_cents: 15000000, note_rate_pct: 7.25, servicing_fee_bps: 25, escrow_balance_cents: 200000, suspense_balance_cents: 50000, delinquency_bucket: DQ_60_89, loss_mit_status: FORBEARANCE, state_code: "TX" }
              as: SellerServicer
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "V-0003", upb_cents: 10000000, note_rate_pct: 5.75, servicing_fee_bps: 25, escrow_balance_cents: 150000, suspense_balance_cents: 0, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "FL" }
              as: SellerServicer
              as_user_id: "${seller_id}"
          assert:
            - "${c1_count} == 1, ${c1_upb} == 20000000 and ${c1_wavg} == 6.5000 after the first loan"
            - "GET /msr/portfolios/${pf_id} after the trigger shows loan_count 3 and total_upb_cents 45000000"
            - "weighted_avg_note_rate_pct == 6.5833 (UPB-weighted, rounded half-up to 4 decimals), not the unweighted 6.5000"
            - "custodial_funds_total_cents == 700000 == (300000 + 0) + (200000 + 50000) + (150000 + 0)"
            - "valuation_freshness is still NONE because no ValuationRun exists yet"

      - name: system_fields_are_minted_by_the_server_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.BidPackage.fields.status
          - entities.BidPackage.fields.published_at
          - complexity_profile.consistency_model
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted; version starts at 1 and every mutation bumps it by exactly one, while status and published_at cannot be seeded from the request because they are not declared inputs."
        test_recipe:
          setup: ["Fixture T is TAPE_LOCKED and valued, so a BidPackage can be created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: admin-001
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Alpha Servicing LLC", role_type: SELLER, net_worth_cents: 500000000, servicer_rating: TIER_1, agency_approvals: [FNMA, FHLMC] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { seller_id: "$.data.id" }
            - call: "POST /msr/counterparties"
              payload: { legal_name: "Bravo Servicing Inc", role_type: BUYER, net_worth_cents: 1200000000, servicer_rating: TIER_1, agency_approvals: [FNMA] }
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { buyer_id: "$.data.id" }
            - call: "POST /msr/assumption-sets"
              payload: { assumption_name: "desk-base", cpr_pct: 8.0, discount_rate_pct: 10.0, cost_to_service_annual_cents: 9000, float_earnings_rate_pct: 4.0, projection_years: 3 }
              as: ValuationAnalyst
              as_user_id: va-001
              captures: { as_id: "$.data.id" }
            - call: "POST /msr/rate-curves"
              payload: { as_of_date: "2026-07-31", base_rate_bps: 4000, primary_secondary_spread_bps: 85 }
              as: HedgeDesk
              as_user_id: hd-001
              captures: { c1_id: "$.data.id" }
            - call: "POST /msr/portfolios"
              payload: { seller_id: "${seller_id}", portfolio_name: "Pool-T", agency_type: FNMA }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0001", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "CA" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan1_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0002", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "TX" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan2_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0003", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "FL" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan3_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/loans"
              payload: { loan_number: "T-0004", upb_cents: 10000050, note_rate_pct: 6.5, servicing_fee_bps: 25, escrow_balance_cents: 100000, suspense_balance_cents: 25000, delinquency_bucket: CURRENT, loss_mit_status: NONE, state_code: "NY" }
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { loan4_id: "$.data.id" }
            - call: "POST /msr/portfolios/${pf_id}/lock-tape"
              payload: {}
              as: SellerServicer
              as_user_id: "${seller_id}"
              captures: { pf_v1: "$.data.version" }
            - call: "POST /msr/portfolios/${pf_id}/valuation-runs"
              payload: { assumption_set_id: "${as_id}", method: DETERMINISTIC_STATIC, expected_portfolio_version: "${pf_v1}" }
              as: ValuationAnalyst
