          - calculations.confirming_bank_selection.constants.RATING_POINTS
          - endpoints.POST_/credits/{id}/confirmation-requests
        distinguishing_aspect: |
          Eight banks are on file and the request omits confirming_bank_id, so the
          selector must apply every filter before scoring: B6 (AE, risk 10, AA)
          scores 940 and B8 (JP, risk 5, AA) scores 970 - the two highest scores of
          all - yet B6 is dropped for sanctions_flag and B8 for an appetite of
          5000000 that cannot hold the 10000000 gross exposure; B5 (TR, risk 70) is
          dropped by the risk ceiling of 60; ALV scores 750 but sits in the
          beneficiary's own country LV. Of the survivors B1 (DE) and B7 (NL) TIE at
          880 with identical country_risk_score 20, so the created_at tie-break
