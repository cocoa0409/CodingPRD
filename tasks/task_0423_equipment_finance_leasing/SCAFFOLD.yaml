# =============================================================================
# Equipment Finance & Leasing (Lessor) — benchmark seed tables (v1)
# Target difficulty: EXPERT (§0.4)
# =============================================================================

scenario: |
  Equipment Finance & Leasing (Lessor): credit application & approval, lease type
  (FMV/$1-out/TRAC), payment schedule & advance/security deposit, vendor funding &
  UCC-1 filing, sales/use & property tax, mid-term add-on/upgrade, end-of-term
  (renew/return/buyout), residual & remarketing

domain_name: equipment-finance-leasing
api_prefix: /lessors/{lessorId}

# -----------------------------------------------------------------------------
# Complexity profile (§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on Lease.version for booking races (§1.2.1)
    - cascading_side_effects        # fund -> UCC + tax + schedule + equipment cascades
    - dual_variant_calculation      # residual/buyout differ by lease_type; tax sales vs use
    - rate_threshold_triggers       # advance-rate floor, TRAC residual band boundary

  entity_topology: flat
  # Peer entities linked by foreign keys (lessor, vendor, credit app, lessee, lease,
  # equipment, schedule, invoice, payment, ucc, tax, add-on, eot) — no deep URL nesting.

  state_machine_shape: parallel
  # Lease carries two independent dimensions: lifecycle_status (origination -> booked ->
  # active -> end-of-term -> terminated) and funding_status (PENDING_FUNDING -> FUNDED).
  # CreditApplication is cyclic (revision loop). EquipmentUnit / EndOfTermElection branch.

  relationship_patterns:
    - one_to_many        # Lease -> EquipmentUnit, ScheduleLine, Invoice, AddOn
    - cross_aggregate    # Lease.funding gated on CreditApplication.status and Vendor.status

  role_model: segregation_of_duties
  # CreditAnalyst underwrites, FundingOfficer funds & files UCC, Servicer bills/collects
  # and runs end-of-term, AssetManager remarkets returned equipment. The analyst who
  # SUBMITTED a credit application cannot also APPROVE it (SoD).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Lessor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Lessor legal entity name" }
      - { name: home_state_code, type: string, source: input, description: "Two-letter US state of the lessor's filing office" }
      - { name: sales_tax_rate_bps, type: integer, source: input, description: "Sales/use tax rate in basis points applied to taxable amounts (e.g., 825 = 8.25%)" }
      - { name: property_tax_rate_bps, type: integer, source: input, description: "Annual property-tax rate in basis points applied to assessed equipment value" }
      - { name: portfolio_value_cents, type: integer, source: computed, default: 0, description: "Sum of original_cost_cents over all EquipmentUnit rows whose lease lifecycle_status IN {BOOKED, ACTIVE, END_OF_TERM}" }
      - { name: clock_utc, type: datetime, source: system, description: "Lessor-scoped logical clock; advanced only by the clock-set endpoint; all temporal comparisons read this" }

  - name: Vendor
    parent: Lessor
    common_fields: true
    fields:
      - { name: lessor_id, type: string, source: system, description: "FK -> Lessor.id" }
      - { name: name, type: string, source: input, description: "Equipment vendor / supplier name" }
      - { name: remit_account, type: string, source: input, description: "Funding remit account reference" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | SUSPENDED; only APPROVED vendors may receive funding" }

  - name: CreditApplication
    parent: Lessor
    common_fields: true
    fields:
      - { name: lessor_id, type: string, source: system, description: "FK -> Lessor.id" }
      - { name: applicant_legal_name, type: string, source: input, description: "Legal name of the prospective lessee" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested financed amount; must be > 0" }
      - { name: credit_score, type: integer, source: input, description: "Applicant bureau score 300..850" }
      - { name: approved_amount_cents, type: integer, source: system, default: null, description: "Approved credit line set on APPROVE; <= requested_amount_cents" }
      - { name: pricing_tier, type: enum, source: computed, default: null, description: "PRIME | NEAR_PRIME | SUBPRIME derived from credit_score at approval time" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the analyst who SUBMITTED; used for segregation-of-duties on APPROVE" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of times the application returned to DRAFT from RETURNED_FOR_INFO" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | RETURNED_FOR_INFO | APPROVED | DECLINED; cyclic via RETURNED_FOR_INFO -> DRAFT" }

  - name: Lessee
    parent: Lessor
    common_fields: true
    fields:
      - { name: lessor_id, type: string, source: system, description: "FK -> Lessor.id" }
      - { name: credit_application_id, type: string, source: system, description: "FK -> CreditApplication.id; the APPROVED application that minted this lessee" }
      - { name: legal_name, type: string, source: system, description: "Copied from the approved application's applicant_legal_name" }
      - { name: approved_credit_cents, type: integer, source: system, description: "Copied from CreditApplication.approved_amount_cents at mint time" }
      - { name: committed_credit_cents, type: integer, source: computed, default: 0, description: "Sum of financed_amount_cents over this lessee's leases whose lifecycle_status IN {ORIGINATION, BOOKED, ACTIVE, END_OF_TERM}" }
      - { name: available_credit_cents, type: integer, source: computed, default: 0, description: "approved_credit_cents - committed_credit_cents" }

  - name: Lease
    parent: Lessee
    common_fields: true
    fields:
      - { name: lessee_id, type: string, source: system, description: "FK -> Lessee.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; supplier funded at booking" }
      - { name: lease_type, type: enum, source: input, description: "FMV | DOLLAR_OUT | TRAC; determines residual and buyout math" }
      - { name: equipment_cost_cents, type: integer, source: input, description: "Vendor invoice cost of the financed equipment; > 0" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly payments; > 0" }
      - { name: monthly_rate_factor_bps, type: integer, source: input, description: "Lease rate factor in basis points of equipment_cost_cents charged per month" }
      - { name: trac_residual_pct_bps, type: integer, source: input, default: null, description: "Stipulated TRAC residual as basis points of equipment_cost_cents; required iff lease_type == TRAC, forbidden otherwise" }
      - { name: advance_payment_count, type: integer, source: input, default: 0, description: "Number of monthly payments collected in advance at booking" }
      - { name: security_deposit_cents, type: integer, source: input, default: 0, description: "Refundable security deposit collected at booking" }
      - { name: financed_amount_cents, type: integer, source: computed, default: 0, description: "equipment_cost_cents - (advance_payment_count * monthly_payment_cents) - security_deposit_cents; the credit exposure" }
      - { name: monthly_payment_cents, type: integer, source: computed, default: 0, description: "round_half_up(equipment_cost_cents * monthly_rate_factor_bps / 10000); base scheduled rent before tax" }
      - { name: residual_value_cents, type: integer, source: computed, default: 0, description: "End-of-term residual; depends on lease_type (see §1.3 residual_value)" }
      - { name: booked_clock_utc, type: datetime, source: system, default: null, description: "Lessor.clock_utc captured at the book transition; depreciation/assessed_value measures months in service from here" }
      - { name: lifecycle_status, type: enum, source: system, default: "ORIGINATION", description: "ORIGINATION | BOOKED | ACTIVE | END_OF_TERM | TERMINATED; independent of funding_status" }
      - { name: funding_status, type: enum, source: system, default: "PENDING_FUNDING", description: "PENDING_FUNDING | FUNDED; independent of lifecycle_status, advanced by fund action" }
      - { name: paid_installment_count, type: integer, source: computed, default: 0, description: "Count of ScheduleLine rows for this lease whose status == PAID" }

  - name: EquipmentUnit
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique per Lessor across non-DISPOSED units, and subject to a SERIAL_REUSE_BUFFER_DAYS gap after a prior unit with the same serial is DISPOSED" }
      - { name: description, type: string, source: input, description: "Equipment description" }
      - { name: original_cost_cents, type: integer, source: input, description: "Capitalized cost of this unit; > 0" }
      - { name: assessed_value_cents, type: integer, source: computed, default: 0, description: "Depreciated value for property tax (see §1.3 assessed_value)" }
      - { name: status, type: enum, source: system, default: "ON_LEASE", description: "ON_LEASE | RETURNED | LISTED | SOLD | DISPOSED; remarketing lifecycle" }
      - { name: disposed_clock_utc, type: datetime, source: system, default: null, description: "Lessor.clock_utc when this unit reached DISPOSED; the serial-reuse buffer window [disposed, disposed + buffer] is measured from here" }
      - { name: sale_proceeds_cents, type: integer, source: system, default: null, description: "Net proceeds recorded when a LISTED unit is SOLD" }

  - name: ScheduleLine
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: installment_number, type: integer, source: system, description: "1-based monthly installment index" }
      - { name: due_clock_utc, type: datetime, source: system, description: "Logical due date = booking clock + installment_number months" }
      - { name: base_rent_cents, type: integer, source: system, description: "Scheduled base rent = Lease.monthly_payment_cents" }
      - { name: is_advance, type: boolean, source: system, default: false, description: "True for the first advance_payment_count installments collected at booking" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | INVOICED | PAID | WAIVED; WAIVED set only for advance installments at booking" }

  - name: Invoice
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: schedule_line_id, type: string, source: input, description: "FK -> ScheduleLine.id; the installment being billed" }
      - { name: base_rent_cents, type: integer, source: computed, description: "Copied from the schedule line's base_rent_cents at invoice time" }
      - { name: sales_tax_cents, type: integer, source: computed, description: "Per-invoice sales/use tax (see §1.3 invoice_sales_tax)" }
      - { name: total_due_cents, type: integer, source: computed, description: "base_rent_cents + sales_tax_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this invoice's CLEARED payments" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | PAID | VOID" }

  - name: Payment
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; denormalized for lease-scoped lookups" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; > 0 and <= invoice outstanding at apply time" }
      - { name: status, type: enum, source: system, default: "CLEARED", description: "CLEARED | REVERSED" }

  - name: UccFiling
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: jurisdiction_state_code, type: string, source: input, description: "State filing office; must equal the Lessor.home_state_code at filing time" }
      - { name: filing_number, type: string, source: system, default: null, description: "Assigned on FILED" }
      - { name: filed_clock_utc, type: datetime, source: system, default: null, description: "Logical clock at FILED; coverage window starts here" }
      - { name: coverage_end_clock_utc, type: datetime, source: computed, default: null, description: "filed_clock_utc + UCC_LAPSE_MONTHS (60); coverage window is half-open [filed, coverage_end)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | FILED | LAPSED | TERMINATED; LAPSED when Lessor.clock_utc >= coverage_end_clock_utc" }

  - name: TaxAssessment
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: tax_type, type: enum, source: input, description: "SALES_USE | PROPERTY" }
      - { name: assessment_clock_utc, type: datetime, source: system, description: "Logical clock when the assessment was generated" }
      - { name: taxable_base_cents, type: integer, source: computed, description: "For SALES_USE: equipment_cost_cents; for PROPERTY: sum of assessed_value_cents over the lease's non-DISPOSED units" }
      - { name: tax_amount_cents, type: integer, source: computed, description: "See §1.3 assessment_tax_amount; sales vs property use different rates and bases" }
      - { name: status, type: enum, source: system, default: "ASSESSED", description: "ASSESSED | REMITTED" }

  - name: AddOn
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: kind, type: enum, source: input, description: "ADD_ON | UPGRADE; UPGRADE replaces an existing unit, ADD_ON appends one" }
      - { name: replaces_equipment_unit_id, type: string, source: input, default: null, description: "FK -> EquipmentUnit.id; required iff kind == UPGRADE, forbidden iff kind == ADD_ON" }
      - { name: added_cost_cents, type: integer, source: input, description: "Capitalized cost of the added/upgraded equipment; > 0" }
      - { name: incremental_payment_cents, type: integer, source: computed, description: "round_half_up(added_cost_cents * Lease.monthly_rate_factor_bps / 10000) prorated over remaining installments (see §1.3 addon_incremental_payment)" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | APPLIED | REJECTED" }

  - name: EndOfTermElection
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id" }
      - { name: election, type: enum, source: input, description: "RENEW | RETURN | BUYOUT" }
      - { name: renewal_months, type: integer, source: input, default: null, description: "Extension term in months; required iff election == RENEW, forbidden otherwise; > 0" }
      - { name: quoted_amount_cents, type: integer, source: computed, default: null, description: "BUYOUT: buyout price (see §1.3 buyout_quote); RENEW: renewal monthly rent; RETURN: 0" }
      - { name: status, type: enum, source: system, default: "ELECTED", description: "ELECTED | EXERCISED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- CreditApplication: cyclic (revision loop) + branching (approve/decline) ----
  - entity: CreditApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /lessors/{lessorId}/credit-applications/{id}/submit"
        actor: CreditAnalyst
        preconditions:
          - "requested_amount_cents > 0 and credit_score in 300..850 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_by_user_id = X-User-ID of the submitting analyst"

      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /lessors/{lessorId}/credit-applications/{id}/return-for-info"
        actor: CreditAnalyst
        preconditions: []
        side_effects: []

      - from: RETURNED_FOR_INFO
        to: DRAFT
        trigger: "POST /lessors/{lessorId}/credit-applications/{id}/revise"
        actor: CreditAnalyst
        preconditions: []
        side_effects:
          - "revision_count += 1"
          - "submitted_by_user_id = null (a fresh submit must re-stamp the submitter)"
        note: "Cyclic: RETURNED_FOR_INFO -> DRAFT -> SUBMITTED forms a revision loop."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /lessors/{lessorId}/credit-applications/{id}/approve"
        actor: CreditAnalyst
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "approved_amount_cents in request, > 0 and <= requested_amount_cents (else ERR_APPROVED_EXCEEDS_REQUESTED)"
          - "credit_score >= 580 (else ERR_SCORE_BELOW_FLOOR)"
        side_effects:
          - "approved_amount_cents = request value"
          - "pricing_tier computed from credit_score (§1.3 pricing_tier)"
          - "Cross-entity: create a Lessee (status fields initialized) bound to this application (credit_application_id = this app)"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /lessors/{lessorId}/credit-applications/{id}/decline"
        actor: CreditAnalyst
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  # ---- Vendor: linear onboarding ----
  - entity: Vendor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /lessors/{lessorId}/vendors/{id}/approve"
        actor: FundingOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /lessors/{lessorId}/vendors/{id}/suspend"
        actor: FundingOfficer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /lessors/{lessorId}/vendors/{id}/approve"
        actor: FundingOfficer
        preconditions: []
        side_effects: []

  # ---- Lease: PARALLEL dimensions (lifecycle_status x funding_status) ----
  - entity: Lease
    initial_state: ORIGINATION
    terminal_states: [TERMINATED]
    transitions:
      # lifecycle dimension
      - from: ORIGINATION
        to: BOOKED
        trigger: "POST /lessors/{lessorId}/leases/{id}/book"
        actor: FundingOfficer
        preconditions:
          - "expected_lease_version present and matches Lease.version (else ERR_STALE_VERSION)"
          - "Cross-entity: Lessee.available_credit_cents >= financed_amount_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
          - "At least one EquipmentUnit attached (else ERR_NO_EQUIPMENT)"
          - "lease_type == TRAC iff trac_residual_pct_bps is set (else ERR_TRAC_RESIDUAL_REQUIRED)"
        side_effects:
          - "lifecycle_status = BOOKED"
          - "booked_clock_utc = Lessor.clock_utc"
          - "monthly_payment_cents computed (§1.3 monthly_payment)"
          - "financed_amount_cents computed (§1.3 financed_amount)"
          - "residual_value_cents computed (§1.3 residual_value)"
          - "Generate term_months ScheduleLine rows; first advance_payment_count are is_advance=true, status=WAIVED; rest status=SCHEDULED"
          - "increments Lease.version by 1"
          - "Cascade: Lessee.committed_credit_cents and available_credit_cents recomputed"
          - "Cascade: Lessor.portfolio_value_cents recomputed"

      - from: BOOKED
        to: ACTIVE
        trigger: "system (automatic when funding_status reaches FUNDED while lifecycle_status == BOOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status = ACTIVE"
        note: "Parallel-dimension coupling: ACTIVE is reached only once BOTH lifecycle==BOOKED AND funding==FUNDED hold."

      - from: ACTIVE
        to: END_OF_TERM
        trigger: "POST /lessors/{lessorId}/leases/{id}/begin-end-of-term"
        actor: Servicer
        preconditions:
          - "paid_installment_count >= (term_months - advance_payment_count) (else ERR_TERM_NOT_COMPLETE)"
        side_effects:
          - "lifecycle_status = END_OF_TERM"

      - from: END_OF_TERM
        to: TERMINATED
        trigger: "POST /lessors/{lessorId}/leases/{id}/terminate"
        actor: Servicer
        preconditions:
          - "An EndOfTermElection for this lease is in status EXERCISED (else ERR_ELECTION_NOT_EXERCISED)"
          - "No Invoice for this lease in status OPEN with total_due_cents > amount_paid_cents (else ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "lifecycle_status = TERMINATED"
          - "security_deposit refund obligation recorded (deposit_refundable = true)"
          - "Cascade: Lessee.committed_credit_cents and available_credit_cents recomputed (lease drops out of committed set)"
          - "Cascade: Lessor.portfolio_value_cents recomputed"

      # funding dimension (independent axis)
      - from: PENDING_FUNDING
        to: FUNDED
        trigger: "POST /lessors/{lessorId}/leases/{id}/fund"
        actor: FundingOfficer
        preconditions:
          - "lifecycle_status == BOOKED (else ERR_NOT_BOOKED)"
          - "Cross-entity: Vendor.status == APPROVED (else ERR_VENDOR_NOT_APPROVED)"
          - "No existing FILED UccFiling required first? No — funding creates the filing (see side effects)"
        side_effects:
          - "funding_status = FUNDED"
          - "Cascade depth-3: create UccFiling (PENDING) -> auto-file it (FILED, filing_number assigned, filed_clock_utc=Lessor.clock_utc) -> generate SALES_USE TaxAssessment whose taxable_base feeds Lessor liability"
          - "Trigger automatic lifecycle BOOKED -> ACTIVE transition"

  # ---- EquipmentUnit: branching remarketing lifecycle ----
  - entity: EquipmentUnit
    initial_state: ON_LEASE
    terminal_states: [SOLD, DISPOSED]
    transitions:
      - from: ON_LEASE
        to: RETURNED
        trigger: "POST /lessors/{lessorId}/equipment/{id}/return"
        actor: AssetManager
        preconditions:
          - "Cross-entity: the unit's Lease.lifecycle_status == END_OF_TERM (else ERR_LEASE_NOT_END_OF_TERM)"
          - "The lease's EndOfTermElection.election == RETURN and status == EXERCISED (else ERR_ELECTION_MISMATCH)"
        side_effects:
          - "status = RETURNED"

      - from: RETURNED
        to: LISTED
        trigger: "POST /lessors/{lessorId}/equipment/{id}/list"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "status = LISTED"

      - from: LISTED
        to: SOLD
        trigger: "POST /lessors/{lessorId}/equipment/{id}/record-sale"
        actor: AssetManager
        preconditions:
          - "sale_proceeds_cents in request, >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = SOLD"
          - "sale_proceeds_cents = request value"
          - "Compute remarketing_gain_loss (§1.3) against residual_value_cents"
          - "Cascade: Lessor.portfolio_value_cents recomputed (unit leaves the active book if its lease terminated)"

      - from: RETURNED
        to: DISPOSED
        trigger: "POST /lessors/{lessorId}/equipment/{id}/dispose"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "status = DISPOSED"
          - "disposed_clock_utc = Lessor.clock_utc (starts the serial-reuse buffer window)"

      - from: LISTED
        to: DISPOSED
        trigger: "POST /lessors/{lessorId}/equipment/{id}/dispose"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "status = DISPOSED"
          - "disposed_clock_utc = Lessor.clock_utc (starts the serial-reuse buffer window)"

  # ---- Invoice: linear billing ----
  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "system (automatic when amount_paid_cents >= total_due_cents after a payment clears)"
        actor: system
        preconditions: []
        side_effects:
          - "status = PAID"
          - "Cascade: the linked ScheduleLine.status = PAID; Lease.paid_installment_count recomputed"

      - from: OPEN
        to: VOID
        trigger: "POST /lessors/{lessorId}/invoices/{id}/void"
        actor: Servicer
        preconditions:
          - "amount_paid_cents == 0 (else ERR_INVOICE_HAS_PAYMENTS)"
        side_effects:
          - "status = VOID"
          - "Cascade: linked ScheduleLine.status reverts to SCHEDULED"

  # ---- UccFiling: temporal coverage window with lapse ----
  - entity: UccFiling
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /lessors/{lessorId}/leases/{id}/ucc-filings (manual continuation) OR system (auto on lease fund)"
        actor: FundingOfficer
        preconditions:
          - "jurisdiction_state_code == Lessor.home_state_code (else ERR_UCC_WRONG_JURISDICTION)"
          - "No existing FILED UccFiling for the same lease+jurisdiction whose coverage window [filed, coverage_end) contains Lessor.clock_utc (else ERR_UCC_OVERLAP)"
        side_effects:
          - "status = FILED"
          - "filed_clock_utc = Lessor.clock_utc"
          - "coverage_end_clock_utc = filed_clock_utc + 60 months"
          - "filing_number assigned"

      - from: FILED
        to: LAPSED
        trigger: "system (automatic when Lessor.clock_utc >= coverage_end_clock_utc; evaluated on read and on new-filing overlap checks)"
        actor: system
        preconditions: []
        side_effects:
          - "status = LAPSED"
        note: "A LAPSED filing no longer occupies the coverage interval, so a continuation filing at-or-after coverage_end is accepted (half-open boundary)."

      - from: FILED
        to: TERMINATED
        trigger: "POST /lessors/{lessorId}/ucc-filings/{id}/terminate"
        actor: FundingOfficer
        preconditions: []
        side_effects:
          - "status = TERMINATED"

  # ---- EndOfTermElection: branching by election value ----
  - entity: EndOfTermElection
    initial_state: ELECTED
    terminal_states: [EXERCISED, CANCELLED]
    transitions:
      - from: ELECTED
        to: EXERCISED
        trigger: "POST /lessors/{lessorId}/leases/{id}/eot-elections/{id}/exercise"
        actor: Servicer
        preconditions:
          - "Cross-entity: Lease.lifecycle_status == END_OF_TERM (else ERR_LEASE_NOT_END_OF_TERM)"
          - "If election == BUYOUT: request body buyout_payment_cents is present and equals quoted_amount_cents (else ERR_BUYOUT_NOT_PAID)"
        side_effects:
          - "status = EXERCISED"
          - "If election == RENEW: append renewal_months new ScheduleLine rows; Lease.term_months += renewal_months"
          - "If election == BUYOUT: each EquipmentUnit on the lease set status = SOLD with sale_proceeds_cents = quoted_amount_cents divided across the units (integer split, remainder to the unit with the earliest created_at)"

      - from: ELECTED
        to: CANCELLED
        trigger: "POST /lessors/{lessorId}/leases/{id}/eot-elections/{id}/cancel"
        actor: Servicer
        preconditions: []
        side_effects:
          - "status = CANCELLED"

  # ---- AddOn: branching by kind, with cascade ----
  - entity: AddOn
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /lessors/{lessorId}/leases/{id}/add-ons/{id}/apply"
        actor: Servicer
        preconditions:
          - "Cross-entity: Lease.lifecycle_status == ACTIVE (else ERR_LEASE_NOT_ACTIVE)"
          - "Cross-entity: Lessee.available_credit_cents >= added_cost_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
          - "If kind == UPGRADE: replaces_equipment_unit_id references a unit on this lease with status ON_LEASE (else ERR_INVALID_REQUEST)"
        side_effects:
          - "status = APPLIED"
          - "incremental_payment_cents computed (§1.3 addon_incremental_payment)"
          - "Cascade depth-3: bump base_rent_cents on all remaining SCHEDULED lines by incremental_payment_cents -> Lease.financed_amount_cents increased by added_cost_cents -> Lessee.committed_credit_cents and available_credit_cents recomputed -> Lessor.portfolio_value_cents recomputed"
          - "Create a new EquipmentUnit (ON_LEASE) for the added equipment"
          - "If kind == UPGRADE: replaced EquipmentUnit.status = DISPOSED"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /lessors/{lessorId}/leases/{id}/add-ons/{id}/reject"
        actor: Servicer
        preconditions: []
        side_effects:
          - "status = REJECTED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lease-book-stale-version
    parent_entity: Lease
    write_endpoint: "POST /lessors/{lessorId}/leases/{id}/book"
    occ_field: "expected_lease_version"
    description: |
      Booking a Lease whose version has advanced since the client last observed it
      is rejected. A booking commits credit against the lessee and snapshots the
      computed financed_amount; a concurrently-applied add-on or a competing book
      attempt against the same lessee legitimately changes credit exposure, so a
      booking carrying a stale lease version is rejected on a stale-version check
      rather than committing credit twice.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_payment
    trigger: "Lease book transition (ORIGINATION -> BOOKED)"
    algorithm: aggregation
    formula: |
      monthly_payment_cents = round_half_up(equipment_cost_cents * monthly_rate_factor_bps / 10000)
    input_set: "The lease's own equipment_cost_cents and monthly_rate_factor_bps"
    precision: "integer cents, round_half_up at the single division"

  - name: financed_amount
    trigger: "Lease book transition (ORIGINATION -> BOOKED)"
    algorithm: aggregation
    formula: |
      # Evaluation order is pinned: monthly_payment is resolved FIRST (it depends only on
      # equipment_cost and rate factor), THEN financed_amount subtracts advance + deposit.
      mp = monthly_payment_cents                      # already computed by monthly_payment
      financed_amount_cents = equipment_cost_cents
                              - (advance_payment_count * mp)
                              - security_deposit_cents
    input_set: "The lease's own fields; depends on the prior monthly_payment result"
    constants: {}
    precision: "integer cents; no rounding (all inputs integer)"
    note: "Circular-looking only in prose: financed_amount needs monthly_payment, which is fully determined upstream, so evaluation order makes it well-defined."

  - name: residual_value
    trigger: "Lease book transition (ORIGINATION -> BOOKED)"
    algorithm: threshold
    formula: |
      if lease_type == DOLLAR_OUT:
        residual_value_cents = 100          # nominal $1 buyout
      elif lease_type == FMV:
        # Fair-market-value residual: tiered by term_months bands (basis points of cost)
        if term_months <= 24:   band_bps = 2000   # 20%
        elif term_months <= 48: band_bps = 1500   # 15%
        else:                   band_bps = 1000   # 10%
        residual_value_cents = round_half_up(equipment_cost_cents * band_bps / 10000)
      elif lease_type == TRAC:
        # Stipulated TRAC residual; must respect the regulatory floor band.
        residual_value_cents = round_half_up(equipment_cost_cents * trac_residual_pct_bps / 10000)
    input_set: "The lease's lease_type, term_months, equipment_cost_cents, trac_residual_pct_bps"
    constants:
      FMV_BAND_SHORT_BPS: 2000
      FMV_BAND_MID_BPS: 1500
      FMV_BAND_LONG_BPS: 1000
      DOLLAR_OUT_RESIDUAL_CENTS: 100
      TRAC_FLOOR_BPS: 1000        # TRAC residual must be >= 10% of cost
    precision: "integer cents, round_half_up"
    variants:
      - name: dollar_out_nominal
        when: "lease_type == DOLLAR_OUT"
        difference: "Fixed nominal $1 (100 cents) regardless of term or cost"
      - name: fmv_tiered
        when: "lease_type == FMV"
        difference: "Tiered band on term_months applied to equipment_cost_cents"
      - name: trac_stipulated
        when: "lease_type == TRAC"
        difference: "Client-stipulated basis points, validated against TRAC_FLOOR_BPS"

  - name: buyout_quote
    trigger: "EndOfTermElection creation with election == BUYOUT"
    algorithm: threshold
    formula: |
      # Buyout price differs by lease_type — a different entity-domain dual-variant from
      # tax (tax is on the lease's tax base; this is on the residual + remaining rent).
      remaining_installments = term_months - paid_installment_count - advance_payment_count
      if remaining_installments < 0: remaining_installments = 0
      remaining_rent_cents = remaining_installments * monthly_payment_cents
      if lease_type == DOLLAR_OUT:
        quoted_amount_cents = 100                                  # $1 out
      elif lease_type == FMV:
        # FMV buyout = residual + any remaining rent (lessee buys at fair value)
        quoted_amount_cents = residual_value_cents + remaining_rent_cents
      elif lease_type == TRAC:
        # TRAC buyout = stipulated residual only (TRAC adjusts at sale, not buyout)
        quoted_amount_cents = residual_value_cents
    input_set: "The lease's lease_type, residual_value_cents, monthly_payment_cents, term_months, paid_installment_count, advance_payment_count"
    precision: "integer cents"
    variants:
      - name: dollar_out_buyout
        when: "lease_type == DOLLAR_OUT"
        difference: "Always 100 cents"
      - name: fmv_buyout
        when: "lease_type == FMV"
        difference: "residual + remaining_rent"
      - name: trac_buyout
        when: "lease_type == TRAC"
        difference: "residual only"

  - name: invoice_sales_tax
    trigger: "Invoice creation (billing a ScheduleLine)"
    algorithm: tiered_pricing
    formula: |
      # Per-line rounding pinned: tax is computed and rounded on EACH invoice's base_rent,
      # NOT by summing all base rents then taxing the total. round-then-this-order is fixed.
      sales_tax_cents = round_half_up(base_rent_cents * Lessor.sales_tax_rate_bps / 10000)
      total_due_cents = base_rent_cents + sales_tax_cents
    input_set: "This invoice's base_rent_cents and the owning Lessor.sales_tax_rate_bps"
    precision: "integer cents, round_half_up PER INVOICE (round-per-line, then no further rounding)"
    note: "Pins the round-then-sum order: per-invoice rounding, so two $33.33 rents at 8.25% each round to 275 cents independently (550 total), not summed-then-taxed."

  - name: assessment_tax_amount
    trigger: "TaxAssessment generation (SALES_USE on funding; PROPERTY on demand)"
    algorithm: threshold
    formula: |
      if tax_type == SALES_USE:
        taxable_base_cents = Lease.equipment_cost_cents
        tax_amount_cents = round_half_up(taxable_base_cents * Lessor.sales_tax_rate_bps / 10000)
      elif tax_type == PROPERTY:
        # Property tax base = sum of assessed_value_cents over the lease's non-DISPOSED units
        taxable_base_cents = sum(u.assessed_value_cents for u in lease.units if u.status != DISPOSED)
        tax_amount_cents = round_half_up(taxable_base_cents * Lessor.property_tax_rate_bps / 10000)
    input_set: "Lease.equipment_cost_cents (sales/use) OR sum of unit assessed_value over non-DISPOSED units (property)"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: sales_use_on_cost
        when: "tax_type == SALES_USE"
        difference: "Base = equipment_cost_cents; rate = sales_tax_rate_bps"
      - name: property_on_assessed
        when: "tax_type == PROPERTY"
        difference: "Base = depreciated assessed_value sum over non-DISPOSED units; rate = property_tax_rate_bps"

  - name: assessed_value
    trigger: "TaxAssessment(PROPERTY) generation; read of EquipmentUnit.assessed_value_cents"
    algorithm: decay_function
    formula: |
      # Straight-line annual depreciation floored at 20% of original cost.
      months_in_service = months_between(Lease.booked_clock_utc, Lessor.clock_utc)   # >= 0; 0 if not yet booked
      years_in_service = floor(months_in_service / 12)
      depreciated = original_cost_cents - round_half_up(original_cost_cents * 0.10 * years_in_service)
      floor_cents = round_half_up(original_cost_cents * 0.20)
      assessed_value_cents = max(depreciated, floor_cents)
    input_set: "The unit's original_cost_cents, its Lease.booked_clock_utc, and Lessor.clock_utc"
    constants:
      ANNUAL_DEPRECIATION_PCT: 0.10
      RESIDUAL_FLOOR_PCT: 0.20
    precision: "integer cents, round_half_up; floor applied AFTER depreciation"

  - name: addon_incremental_payment
    trigger: "AddOn apply transition (PROPOSED -> APPLIED)"
    algorithm: aggregation
    formula: |
      # Incremental monthly rent for the add-on, computed on the add-on cost at the lease
      # rate factor; charged on the REMAINING SCHEDULED installments only.
      remaining_scheduled = count(ScheduleLine where lease_id == lease.id and status == SCHEDULED)
      raw = round_half_up(added_cost_cents * Lease.monthly_rate_factor_bps / 10000)
      if remaining_scheduled == 0:
        incremental_payment_cents = 0           # boundary: empty remaining set
      else:
        incremental_payment_cents = raw
    input_set: "added_cost_cents, Lease.monthly_rate_factor_bps, count of SCHEDULED ScheduleLine rows"
    precision: "integer cents, round_half_up"
    note: "Empty-set boundary: when no SCHEDULED installments remain, incremental is 0 (cannot spread)."

  - name: remarketing_gain_loss
    trigger: "EquipmentUnit record-sale transition (LISTED -> SOLD)"
    algorithm: aggregation
    formula: |
      # Gain/loss against booked residual. Positive => gain, negative => loss.
      remarketing_gain_loss_cents = sale_proceeds_cents - Lease.residual_value_cents
    input_set: "sale_proceeds_cents and the owning Lease.residual_value_cents"
    precision: "integer cents"

  - name: ucc_coverage_window
    trigger: "UccFiling FILED transition (manual create or auto on funding)"
    algorithm: interval_merge
    formula: |
      # Half-open coverage interval. A second FILED filing for the same lease+jurisdiction
      # collides iff its proposed start (Lessor.clock_utc) lies in [existing.filed, existing.coverage_end).
      filed_clock_utc = Lessor.clock_utc
      coverage_end_clock_utc = add_months(filed_clock_utc, UCC_LAPSE_MONTHS)   # 60 months
      # Lapse: an existing filing whose coverage_end_clock_utc <= Lessor.clock_utc is LAPSED and
      # no longer occupies the interval, so a continuation filing exactly at coverage_end is accepted.
      overlap = exists FILED f2 (same lease+jurisdiction) with f2.filed <= now < f2.coverage_end
    input_set: "Existing FILED UccFiling rows for the same lease+jurisdiction; Lessor.clock_utc"
    constants:
      UCC_LAPSE_MONTHS: 60
    precision: "datetime; half-open interval [filed, coverage_end) — boundary at coverage_end is NOT covered"
    note: "Interval semantics: half-open. Distinct from serial_reuse_window which is a closed buffer."

  - name: serial_reuse_window
    trigger: "EquipmentUnit create / add-on apply (new unit) when no non-DISPOSED unit holds the serial"
    algorithm: interval_merge
    formula: |
      # Closed buffer window measured from the most recent DISPOSED unit with the same serial.
      # Reuse is blocked while Lessor.clock_utc is in [disposed_clock_utc, disposed_clock_utc + buffer]
      # (both ends inclusive). Reuse is allowed strictly AFTER the buffer end.
      D = max(disposed_clock_utc over DISPOSED units with this serial)   # most recent
      blocked = (D is not null) and (Lessor.clock_utc <= add_days(D, SERIAL_REUSE_BUFFER_DAYS))
    input_set: "DISPOSED EquipmentUnit rows sharing the serial; Lessor.clock_utc"
    constants:
      SERIAL_REUSE_BUFFER_DAYS: 30
    precision: "datetime; closed buffer [D, D+30d] inclusive — reuse permitted only when now > D+30d"
    note: "Interval semantics: closed buffer (inclusive both ends). Distinct from ucc_coverage_window's half-open interval."

  - name: pricing_tier
    trigger: "CreditApplication approve transition (SUBMITTED -> APPROVED)"
    algorithm: threshold
    formula: |
      if credit_score >= 720:   pricing_tier = PRIME
      elif credit_score >= 640: pricing_tier = NEAR_PRIME
      else:                     pricing_tier = SUBPRIME   # 580..639 (below 580 is rejected earlier)
    input_set: "The application's credit_score"
    constants:
      PRIME_FLOOR: 720
      NEAR_PRIME_FLOOR: 640
      APPROVAL_SCORE_FLOOR: 580
    precision: "exact integer thresholds; >= boundaries"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts > 0 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "Lease book carries expected_lease_version equal to Lease.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /lessors/{lessorId}/leases/{id}/book"

  - priority: 7
    category: business_safety
    check: "On credit-application approve/decline, X-User-ID must differ from submitted_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "credit-application approve, decline"

  - priority: 8
    category: business_constraint
    check: "On approve: approved_amount_cents <= requested_amount_cents"
    error_id: ERR_APPROVED_EXCEEDS_REQUESTED
    http_status: 409
    applies_to: "credit-application approve"

  - priority: 9
    category: business_safety
    check: "On approve: credit_score >= 580 underwriting floor"
    error_id: ERR_SCORE_BELOW_FLOOR
    http_status: 409
    applies_to: "credit-application approve"

  - priority: 10
    category: business_referential
    check: "On lease book: lease_type == TRAC iff trac_residual_pct_bps is provided; and if TRAC, trac_residual_pct_bps >= TRAC_FLOOR_BPS (1000)"
    error_id: ERR_TRAC_RESIDUAL_REQUIRED
    http_status: 409
    applies_to: "lease book, lease create"

  - priority: 11
    category: business_referential
    check: "On lease book: at least one EquipmentUnit attached"
    error_id: ERR_NO_EQUIPMENT
    http_status: 409
    applies_to: "lease book"

  - priority: 12
    category: business_referential
    check: "On lease fund: the lease's Vendor.status == APPROVED"
    error_id: ERR_VENDOR_NOT_APPROVED
    http_status: 409
    applies_to: "lease fund"

  - priority: 13
    category: business_referential
    check: "On lease fund: lifecycle_status == BOOKED before funding"
    error_id: ERR_NOT_BOOKED
    http_status: 409
    applies_to: "lease fund"

  - priority: 14
    category: business_fiscal
    check: "On lease book / add-on apply: committing financed/added cost must not exceed Lessee.available_credit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "lease book, add-on apply"

  - priority: 15
    category: business_temporal
    check: "On begin-end-of-term: paid_installment_count >= term_months - advance_payment_count (term complete)"
    error_id: ERR_TERM_NOT_COMPLETE
    http_status: 409
    applies_to: "lease begin-end-of-term"

  - priority: 16
    category: business_referential
    check: "On equipment return: owning lease lifecycle_status == END_OF_TERM and its election is RETURN/EXERCISED"
    error_id: ERR_LEASE_NOT_END_OF_TERM
    http_status: 409
    applies_to: "equipment return, eot-election exercise"

  - priority: 17
    category: business_fiscal
    check: "On eot-election exercise (BUYOUT): request buyout_payment_cents present and == quoted_amount_cents"
    error_id: ERR_BUYOUT_NOT_PAID
    http_status: 409
    applies_to: "eot-election exercise"

  - priority: 18
    category: business_constraint
    check: "On invoice void: invoice has no cleared payments (amount_paid_cents == 0)"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "invoice void"

  - priority: 19
    category: business_fiscal
    check: "On lease terminate: no OPEN invoice with outstanding balance"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "lease terminate"

  - priority: 20
    category: business_referential
    check: "On lease terminate: an EndOfTermElection in status EXERCISED exists"
    error_id: ERR_ELECTION_NOT_EXERCISED
    http_status: 409
    applies_to: "lease terminate"

  - priority: 21
    category: business_constraint
    check: "EquipmentUnit.serial_number unique per Lessor across non-DISPOSED units (instantaneous uniqueness)"
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "equipment create, add-on apply (new unit)"

  - priority: 22
    category: business_temporal
    check: "EquipmentUnit serial reuse buffer: a serial last DISPOSED at clock D may only be re-attached once Lessor.clock_utc > D + SERIAL_REUSE_BUFFER_DAYS (closed-end buffer window [D, D+buffer] blocks reuse; checked only when no non-DISPOSED unit holds the serial, i.e. after ERR_DUPLICATE_SERIAL does not apply)"
    error_id: ERR_SERIAL_REUSE_TOO_SOON
    http_status: 409
    applies_to: "equipment create, add-on apply (new unit)"

  - priority: 23
    category: business_temporal
    check: "UCC filing coverage overlap: a new FILED window [filed, coverage_end) for the same lease+jurisdiction must not contain Lessor.clock_utc while an existing FILED filing's half-open window still covers it (LAPSED/TERMINATED windows free the interval)"
    error_id: ERR_UCC_OVERLAP
    http_status: 409
    applies_to: "ucc-filing manual create"

  - priority: 24
    category: business_referential
    check: "UCC filing jurisdiction_state_code == Lessor.home_state_code"
    error_id: ERR_UCC_WRONG_JURISDICTION
    http_status: 409
    applies_to: "ucc-filing manual create"

  - priority: 25
    category: business_referential
    check: "On add-on apply: owning lease lifecycle_status == ACTIVE"
    error_id: ERR_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "add-on apply"

  - priority: 26
    category: business_fiscal
    check: "On payment apply: amount_cents <= invoice outstanding (total_due_cents - amount_paid_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_DUE
    http_status: 409
    applies_to: "payment create"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Lessor ----
  - method: POST
    path: "/lessors"
    description: "Create a Lessor (book of business)"
    roles: [FundingOfficer]
    code: 201
    input: [legal_name, home_state_code, sales_tax_rate_bps, property_tax_rate_bps]
    output: Lessor
    side_effects: ["clock_utc initialized; portfolio_value_cents=0"]

  - method: GET
    path: "/lessors/{lessorId}"
    description: "Get a Lessor"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: Lessor
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/_clock/set"
    description: "Set the Lessor logical clock (test-driving; advances time deterministically)"
    roles: [FundingOfficer, Servicer]
    code: 200
    input: [to_iso8601]
    output: Lessor
    side_effects: ["clock_utc = to_iso8601"]

  # ---- Vendor ----
  - method: POST
    path: "/lessors/{lessorId}/vendors"
    description: "Create a Vendor"
    roles: [FundingOfficer]
    code: 201
    input: [name, remit_account]
    output: Vendor
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/lessors/{lessorId}/vendors/{id}"
    description: "Get a Vendor"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/vendors"
    description: "List Vendors for a Lessor"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["lessor_id?", "status?"]
    output: "Vendor[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/vendors/{id}/approve"
    description: "Approve a Vendor for funding"
    roles: [FundingOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/lessors/{lessorId}/vendors/{id}/suspend"
    description: "Suspend an approved Vendor"
    roles: [FundingOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> SUSPENDED"]

  # ---- CreditApplication ----
  - method: POST
    path: "/lessors/{lessorId}/credit-applications"
    description: "Create a credit application (DRAFT)"
    roles: [CreditAnalyst]
    code: 201
    input: [applicant_legal_name, requested_amount_cents, credit_score]
    output: CreditApplication
    side_effects: ["status=DRAFT, revision_count=0"]

  - method: GET
    path: "/lessors/{lessorId}/credit-applications/{id}"
    description: "Get a credit application"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: CreditApplication
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/credit-applications"
    description: "List credit applications for a Lessor"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["lessor_id?", "status?"]
    output: "CreditApplication[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/credit-applications/{id}/submit"
    description: "Submit a DRAFT application for review"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: CreditApplication
    side_effects: ["status -> SUBMITTED; submitted_by_user_id = caller"]

  - method: POST
    path: "/lessors/{lessorId}/credit-applications/{id}/return-for-info"
    description: "Return a SUBMITTED application for more information"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: CreditApplication
    side_effects: ["status -> RETURNED_FOR_INFO"]

  - method: POST
    path: "/lessors/{lessorId}/credit-applications/{id}/revise"
    description: "Return a RETURNED_FOR_INFO application to DRAFT for revision"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: CreditApplication
    side_effects: ["status -> DRAFT; revision_count += 1; submitted_by_user_id = null"]

  - method: POST
    path: "/lessors/{lessorId}/credit-applications/{id}/approve"
    description: "Approve a SUBMITTED application; mints a Lessee"
    roles: [CreditAnalyst]
    code: 200
    input: [approved_amount_cents]
    output: CreditApplication
    side_effects: ["status -> APPROVED; pricing_tier set; Lessee created"]

  - method: POST
    path: "/lessors/{lessorId}/credit-applications/{id}/decline"
    description: "Decline a SUBMITTED application"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: CreditApplication
    side_effects: ["status -> DECLINED"]

  # ---- Lessee ----
  - method: GET
    path: "/lessors/{lessorId}/lessees/{id}"
    description: "Get a Lessee (minted by application approval)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: Lessee
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/lessees"
    description: "List Lessees; filter by credit_application_id for reverse lookup"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["lessor_id?", "credit_application_id?"]
    output: "Lessee[]"
    side_effects: []

  # ---- Lease ----
  - method: POST
    path: "/lessors/{lessorId}/lessees/{id}/leases"
    description: "Create a Lease (ORIGINATION / PENDING_FUNDING)"
    roles: [FundingOfficer]
    code: 201
    input: [vendor_id, lease_type, equipment_cost_cents, term_months, monthly_rate_factor_bps, "trac_residual_pct_bps?", "advance_payment_count?", "security_deposit_cents?"]
    output: Lease
    side_effects: ["lifecycle_status=ORIGINATION, funding_status=PENDING_FUNDING"]

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}"
    description: "Get a Lease"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases"
    description: "List Leases; filter by lessee_id or vendor_id"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["lessee_id?", "vendor_id?", "lifecycle_status?", "funding_status?"]
    output: "Lease[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/book"
    description: "Book a lease: commit credit, price it, generate the schedule (OCC on lease version)"
    roles: [FundingOfficer]
    code: 200
    input: [expected_lease_version]
    output: Lease
    side_effects:
      - "lifecycle_status -> BOOKED"
      - "monthly_payment_cents, financed_amount_cents, residual_value_cents computed"
      - "ScheduleLine rows generated"
      - "increments Lease.version by 1"
      - "Lessee credit + Lessor portfolio recomputed"

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/fund"
    description: "Fund the vendor: file UCC-1, generate sales/use tax, drive lease ACTIVE"
    roles: [FundingOfficer]
    code: 200
    input: []
    output: Lease
    side_effects:
      - "funding_status -> FUNDED"
      - "UccFiling created and auto-filed"
      - "SALES_USE TaxAssessment generated"
      - "lifecycle BOOKED -> ACTIVE (automatic)"

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/begin-end-of-term"
    description: "Move an ACTIVE lease into END_OF_TERM"
    roles: [Servicer]
    code: 200
    input: []
    output: Lease
    side_effects: ["lifecycle_status -> END_OF_TERM"]

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/terminate"
    description: "Terminate an END_OF_TERM lease whose election is exercised and balance clear"
    roles: [Servicer]
    code: 200
    input: []
    output: Lease
    side_effects: ["lifecycle_status -> TERMINATED; Lessee credit + Lessor portfolio recomputed"]

  # ---- EquipmentUnit ----
  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/equipment"
    description: "Attach an EquipmentUnit to a lease (ON_LEASE)"
    roles: [FundingOfficer]
    code: 201
    input: [serial_number, description, original_cost_cents]
    output: EquipmentUnit
    side_effects: ["status=ON_LEASE; ERR_DUPLICATE_SERIAL if serial in use among non-DISPOSED units"]

  - method: GET
    path: "/lessors/{lessorId}/equipment/{id}"
    description: "Get an EquipmentUnit"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/equipment"
    description: "List EquipmentUnits on a lease (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: "EquipmentUnit[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/equipment/{id}/return"
    description: "Mark a returned unit (lease at end-of-term, election RETURN)"
    roles: [AssetManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> RETURNED"]

  - method: POST
    path: "/lessors/{lessorId}/equipment/{id}/list"
    description: "List a returned unit for remarketing"
    roles: [AssetManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> LISTED"]

  - method: POST
    path: "/lessors/{lessorId}/equipment/{id}/record-sale"
    description: "Record sale of a listed unit; compute remarketing gain/loss"
    roles: [AssetManager]
    code: 200
    input: [sale_proceeds_cents]
    output: EquipmentUnit
    side_effects: ["status -> SOLD; remarketing_gain_loss computed; Lessor portfolio recomputed"]

  - method: POST
    path: "/lessors/{lessorId}/equipment/{id}/dispose"
    description: "Dispose a returned or listed unit"
    roles: [AssetManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> DISPOSED"]

  # ---- ScheduleLine ----
  - method: GET
    path: "/lessors/{lessorId}/schedule-lines/{id}"
    description: "Get a ScheduleLine"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: ScheduleLine
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/schedule-lines"
    description: "List ScheduleLines for a lease (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["status?"]
    output: "ScheduleLine[]"
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/schedule-lines/{id}/invoices"
    description: "List Invoices billing this ScheduleLine (FK reverse-reachability for Invoice.schedule_line_id)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/invoices"
    description: "Bill a SCHEDULED installment: create an Invoice (computes sales tax)"
    roles: [Servicer]
    code: 201
    input: [schedule_line_id]
    output: Invoice
    side_effects: ["status=OPEN; base_rent/sales_tax/total_due computed; ScheduleLine.status -> INVOICED"]

  - method: GET
    path: "/lessors/{lessorId}/invoices/{id}"
    description: "Get an Invoice"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/invoices"
    description: "List Invoices for a lease (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["status?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/invoices/{id}/void"
    description: "Void an unpaid Invoice; revert the schedule line"
    roles: [Servicer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID; ScheduleLine -> SCHEDULED"]

  # ---- Payment ----
  - method: POST
    path: "/lessors/{lessorId}/invoices/{id}/payments"
    description: "Record a payment against an invoice (auto PAID + schedule cascade when covered)"
    roles: [Servicer]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "status=CLEARED; invoice amount_paid_cents += amount_cents"
      - "If amount_paid_cents >= total_due_cents: Invoice -> PAID; ScheduleLine -> PAID; Lease.paid_installment_count recomputed"

  - method: GET
    path: "/lessors/{lessorId}/payments/{id}"
    description: "Get a Payment"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/invoices/{id}/payments"
    description: "List Payments for an invoice (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/payments"
    description: "List Payments for a lease (FK reverse-reachability on Payment.lease_id)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: "Payment[]"
    side_effects: []

  # ---- UccFiling ----
  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/ucc-filings"
    description: "Manually file a UCC-1 continuation (auto-filed copy is created at funding); rejects overlapping coverage windows"
    roles: [FundingOfficer]
    code: 201
    input: [jurisdiction_state_code]
    output: UccFiling
    side_effects: ["status=FILED; filed_clock_utc set; coverage_end_clock_utc = filed + 60 months; filing_number assigned"]

  - method: GET
    path: "/lessors/{lessorId}/ucc-filings/{id}"
    description: "Get a UCC filing"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: UccFiling
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/ucc-filings"
    description: "List UCC filings for a lease (FK reverse-reachability; cascade-created at funding)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["status?"]
    output: "UccFiling[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/ucc-filings/{id}/terminate"
    description: "Terminate a FILED UCC filing"
    roles: [FundingOfficer]
    code: 200
    input: []
    output: UccFiling
    side_effects: ["status -> TERMINATED"]

  # ---- TaxAssessment ----
  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/tax-assessments"
    description: "Generate a PROPERTY tax assessment on demand (SALES_USE is auto on funding)"
    roles: [Servicer]
    code: 201
    input: [tax_type]
    output: TaxAssessment
    side_effects: ["taxable_base + tax_amount computed; status=ASSESSED"]

  - method: GET
    path: "/lessors/{lessorId}/tax-assessments/{id}"
    description: "Get a tax assessment"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: TaxAssessment
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/tax-assessments"
    description: "List tax assessments for a lease (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["tax_type?", "status?"]
    output: "TaxAssessment[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/tax-assessments/{id}/remit"
    description: "Mark a tax assessment remitted"
    roles: [Servicer]
    code: 200
    input: []
    output: TaxAssessment
    side_effects: ["status -> REMITTED"]

  # ---- AddOn ----
  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/add-ons"
    description: "Propose a mid-term add-on or upgrade (PROPOSED)"
    roles: [Servicer]
    code: 201
    input: [kind, added_cost_cents, "replaces_equipment_unit_id?", serial_number, description]
    output: AddOn
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/lessors/{lessorId}/add-ons/{id}"
    description: "Get an add-on"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/add-ons"
    description: "List add-ons for a lease (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["status?"]
    output: "AddOn[]"
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/equipment/{id}/add-ons"
    description: "List add-ons that replace this EquipmentUnit (FK reverse-reachability for AddOn.replaces_equipment_unit_id)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: "AddOn[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/add-ons/{id}/apply"
    description: "Apply an add-on: bump schedule, credit, portfolio; create/replace equipment"
    roles: [Servicer]
    code: 200
    input: []
    output: AddOn
    side_effects:
      - "status -> APPLIED; incremental_payment computed"
      - "remaining SCHEDULED lines bumped; Lease.financed_amount += added_cost; Lessee credit + Lessor portfolio recomputed"
      - "new EquipmentUnit created; replaced unit DISPOSED if UPGRADE"

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/add-ons/{id}/reject"
    description: "Reject a proposed add-on"
    roles: [Servicer]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status -> REJECTED"]

  # ---- EndOfTermElection ----
  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/eot-elections"
    description: "Record an end-of-term election (RENEW/RETURN/BUYOUT); computes quote"
    roles: [Servicer]
    code: 201
    input: [election, "renewal_months?"]
    output: EndOfTermElection
    side_effects: ["status=ELECTED; quoted_amount_cents computed (buyout_quote / renewal rent / 0)"]

  - method: GET
    path: "/lessors/{lessorId}/eot-elections/{id}"
    description: "Get an end-of-term election"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: []
    output: EndOfTermElection
    side_effects: []

  - method: GET
    path: "/lessors/{lessorId}/leases/{id}/eot-elections"
    description: "List end-of-term elections for a lease (FK reverse-reachability)"
    roles: [CreditAnalyst, FundingOfficer, Servicer, AssetManager]
    code: 200
    input: ["status?"]
    output: "EndOfTermElection[]"
    side_effects: []

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/eot-elections/{id}/exercise"
    description: "Exercise an elected end-of-term option (BUYOUT requires buyout_payment_cents == quoted_amount_cents)"
    roles: [Servicer]
    code: 200
    input: ["buyout_payment_cents?"]
    output: EndOfTermElection
    side_effects: ["status -> EXERCISED; RENEW extends schedule, BUYOUT sells units"]

  - method: POST
    path: "/lessors/{lessorId}/leases/{id}/eot-elections/{id}/cancel"
    description: "Cancel an elected end-of-term option"
    roles: [Servicer]
    code: 200
    input: []
    output: EndOfTermElection
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, bad enum, missing required field, or non-positive amount"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state from which the requested transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_lease_version does not match Lease.version on book (OCC)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver/decliner is the same user who submitted the credit application"
  - id: ERR_APPROVED_EXCEEDS_REQUESTED
    http: 409
    condition: "approved_amount_cents exceeds requested_amount_cents on approve"
  - id: ERR_SCORE_BELOW_FLOOR
    http: 409
    condition: "credit_score below the 580 underwriting floor on approve"
  - id: ERR_TRAC_RESIDUAL_REQUIRED
    http: 409
    condition: "trac_residual_pct_bps presence inconsistent with lease_type==TRAC, or below TRAC_FLOOR_BPS"
  - id: ERR_NO_EQUIPMENT
    http: 409
    condition: "Lease book attempted with no EquipmentUnit attached"
  - id: ERR_VENDOR_NOT_APPROVED
    http: 409
    condition: "Lease fund attempted with a Vendor not in APPROVED status"
  - id: ERR_NOT_BOOKED
    http: 409
    condition: "Lease fund attempted before lifecycle_status == BOOKED"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "Committing financed/added cost would exceed Lessee.available_credit_cents"
  - id: ERR_TERM_NOT_COMPLETE
    http: 409
    condition: "begin-end-of-term before the scheduled term is fully paid"
  - id: ERR_LEASE_NOT_END_OF_TERM
    http: 409
    condition: "Operation requires the lease in END_OF_TERM but it is not"
  - id: ERR_BUYOUT_NOT_PAID
    http: 409
    condition: "Exercising a BUYOUT election without a payment covering quoted_amount_cents"
  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 409
    condition: "Voiding an invoice that has cleared payments"
  - id: ERR_OUTSTANDING_BALANCE
    http: 409
    condition: "Terminating a lease with an OPEN invoice still owing"
  - id: ERR_ELECTION_NOT_EXERCISED
    http: 409
    condition: "Terminating a lease without an EXERCISED end-of-term election"
  - id: ERR_ELECTION_MISMATCH
    http: 409
    condition: "Equipment return when the lease's election is not RETURN/EXERCISED"
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "EquipmentUnit serial_number already in use among non-DISPOSED units of the Lessor"
  - id: ERR_LEASE_NOT_ACTIVE
    http: 409
    condition: "Add-on apply when the lease is not ACTIVE"
  - id: ERR_PAYMENT_EXCEEDS_DUE
    http: 409
    condition: "Payment amount exceeds the invoice's outstanding balance"
  - id: ERR_SERIAL_REUSE_TOO_SOON
    http: 409
    condition: "Serial reused within the SERIAL_REUSE_BUFFER_DAYS window after the prior unit was DISPOSED"
  - id: ERR_UCC_OVERLAP
    http: 409
    condition: "Manual UCC filing overlaps an existing active coverage window for the same lease+jurisdiction"
  - id: ERR_UCC_WRONG_JURISDICTION
    http: 409
    condition: "UCC filing jurisdiction_state_code does not equal Lessor.home_state_code"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CreditAnalyst
    description: "Underwrites credit applications: create, submit, return-for-info, revise, approve, decline. Subject to segregation of duties — the submitter cannot approve/decline."
    identity: "opaque"
    exclusive_operations:
      - "POST /lessors/{id}/credit-applications — Create application"
      - "POST .../credit-applications/{id}/submit — Submit"
      - "POST .../credit-applications/{id}/return-for-info — Return for info"
      - "POST .../credit-applications/{id}/revise — Revise"
      - "POST .../credit-applications/{id}/approve — Approve (mints Lessee)"
      - "POST .../credit-applications/{id}/decline — Decline"
    shared_operations:
      - "GET endpoints (all read paths)"

  - name: FundingOfficer
    description: "Onboards vendors, creates/books/funds leases, attaches equipment, manages UCC filings."
    identity: "opaque"
    exclusive_operations:
      - "POST /lessors — Create lessor"
      - "POST .../vendors — Create vendor"
      - "POST .../vendors/{id}/approve — Approve vendor"
      - "POST .../vendors/{id}/suspend — Suspend vendor"
      - "POST .../lessees/{id}/leases — Create lease"
      - "POST .../leases/{id}/book — Book lease"
      - "POST .../leases/{id}/fund — Fund lease"
      - "POST .../leases/{id}/equipment — Attach equipment"
      - "POST .../ucc-filings/{id}/terminate — Terminate UCC filing"
    shared_operations:
      - "POST .../_clock/set — Set clock (shared with Servicer)"
      - "GET endpoints (all read paths)"

  - name: Servicer
    description: "Bills installments, records payments, voids invoices, runs end-of-term elections, applies add-ons, generates property tax."
    identity: "opaque"
    exclusive_operations:
      - "POST .../leases/{id}/begin-end-of-term — Begin end-of-term"
      - "POST .../leases/{id}/terminate — Terminate lease"
      - "POST .../leases/{id}/invoices — Create invoice"
      - "POST .../invoices/{id}/void — Void invoice"
      - "POST .../invoices/{id}/payments — Record payment"
      - "POST .../leases/{id}/tax-assessments — Generate property tax"
      - "POST .../tax-assessments/{id}/remit — Remit tax"
      - "POST .../leases/{id}/add-ons — Propose add-on"
      - "POST .../leases/{id}/add-ons/{id}/apply — Apply add-on"
      - "POST .../leases/{id}/add-ons/{id}/reject — Reject add-on"
      - "POST .../leases/{id}/eot-elections — Record election"
      - "POST .../leases/{id}/eot-elections/{id}/exercise — Exercise election"
      - "POST .../leases/{id}/eot-elections/{id}/cancel — Cancel election"
    shared_operations:
      - "POST .../_clock/set — Set clock (shared with FundingOfficer)"
      - "GET endpoints (all read paths)"

  - name: AssetManager
    description: "Manages returned-asset remarketing: return, list, record-sale, dispose."
    identity: "opaque"
    exclusive_operations:
      - "POST .../equipment/{id}/return — Return unit"
      - "POST .../equipment/{id}/list — List unit"
      - "POST .../equipment/{id}/record-sale — Record sale"
      - "POST .../equipment/{id}/dispose — Dispose unit"
    shared_operations:
      - "GET endpoints (all read paths)"
