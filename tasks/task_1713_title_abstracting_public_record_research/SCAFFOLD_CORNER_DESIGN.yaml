  # =====================================================================
  # Section: cross-cutting complexity layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_patch_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-patch-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The PATCH write-path is OCC-guarded: a fresh version succeeds (and recomputes RUSH fees), a replayed stale version is rejected 412. Two strictly sequential requests."
        test_recipe:
          setup: ["STANDARD order in RECEIVED; client holds version 1"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_871", property_address: "90 Cedar Park", county: "Travis", state_code: "TX", legal_description_text: "LOT 1 BLK H", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_871
              captures: { ord: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /api/abstract-orders/${ord}"
              payload: { expected_abstract_order_version: "${v1}", sla_tier: "RUSH" }
              as: OperationsManager
              captures: { v2: $.data.version, prov: $.data.provisional_fee_cents, acc: $.data.accrued_fees_cents }
            - call: "PATCH /api/abstract-orders/${ord}"
              payload: { expected_abstract_order_version: "${v1}", liability_tier: "EXTENDED" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH: captured v2 == 2 (version incremented), prov == 75000 and acc == 50000 (RUSH premium recomputed)"
            - "second PATCH with the stale captured v1: captured err == ERR_STALE_VERSION and HTTP status == 412"

      - name: occ_stale_report_create_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-create-stale-order]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The report-create write-path is OCC-guarded: a drafter holding the creation-time version (1) is stale by the time the order reaches SEARCH_COMPLETE (cascades bumped it), so the create is rejected 412; re-reading and retrying succeeds."
        test_recipe:
          setup: ["order driven to SEARCH_COMPLETE; drafter still holds the creation-time version"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_872", property_address: "91 Cedar Park", county: "Travis", state_code: "TX", legal_description_text: "LOT 2 BLK H", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_872
              captures: { ord: $.data.id, v_create: $.data.version }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_872", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-872-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_872
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_872
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_872
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_872
          trigger:
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord}", title: "Report 872 stale attempt", expected_abstract_order_version: "${v_create}" }
              as: Abstracter
              as_user_id: abs_872
              captures: { err: $.data.error_id }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { v_fresh: $.data.version }
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord}", title: "Report 872", expected_abstract_order_version: "${v_fresh}" }
              as: Abstracter
              as_user_id: abs_872
              captures: { rep: $.data.id, rst: $.data.status }
          assert:
            - "stale create captured err == ERR_STALE_VERSION and HTTP status == 412"
            - "fresh create succeeds: captured rst == DRAFT (HTTP 201)"
            - "captured v_fresh != v_create (cascades advanced the order version between the client's read and its write)"

      - name: scheduled_clock_drives_is_overdue
        claim_type: scheduled_actions
        grounds:
          - calculations.sla_due_and_late_credit
          - entities.AbstractOrder.fields.is_overdue
          - endpoints POST /api/_clock/set_current_utc
        distinguishing_aspect: "The logical clock (startup default 2026-08-01T00:00:00Z) drives the derived is_overdue flag: false before due_at, true after — with no wall-clock dependency."
        test_recipe:
          setup: ["RUSH order created under the default clock (due_at 2026-08-02T00:00:00Z), one assignment"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_873", property_address: "92 Cedar Park", county: "Travis", state_code: "TX", legal_description_text: "LOT 3 BLK H", search_period_years: 30, effective_date: "2026-01-15", sla_tier: "RUSH" }
              as: Client
              as_user_id: client_873
              captures: { ord: $.data.id, rec: $.data.received_at }
          trigger:
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { od_before: $.data.is_overdue }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OperationsManager
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { od_after: $.data.is_overdue }
          assert:
            - "captured rec == 2026-08-01T00:00:00Z (server startup default, no wall clock)"
            - "captured od_before == false"
            - "captured od_after == true (24h past the RUSH due_at, order still non-terminal)"

      - name: derived_counters_reconcile_immediately
        claim_type: derived_field_reconciliation
        grounds:
          - entities.AbstractOrder.fields.open_curative_count
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the read directly after a curative raise/satisfy reflects the recomputed open_curative_count — no lag, no stale cache."
        test_recipe:
          setup: ["order in SEARCH_IN_PROGRESS with an assignment"]
