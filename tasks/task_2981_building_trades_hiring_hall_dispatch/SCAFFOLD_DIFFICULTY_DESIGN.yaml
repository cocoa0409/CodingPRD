              as: Member
              as_user_id: "${m_ash_id}"
              captures: { late_accept_error: $.data.error_id }
            - call: "POST /hiring-hall/dispatch-runs"
              payload: {}
              as: Dispatcher
              captures: { sweep_past_deadline: $.data.expired_referral_count, demoted_past_deadline: $.data.demoted_registration_count }
            - call: "GET /hiring-hall/referrals/${refB_id}"
              payload: {}
              as: Dispatcher
              captures: { refB_status: $.data.status }
            - call: "GET /hiring-hall/registrations/${reg_ash_id}"
              payload: {}
              as: Dispatcher
              captures: { ash_status: $.data.status, ash_dem: $.data.demotion_count, ash_pos: $.data.position_number }
          assert:
            - "${refA_issued} == 2026-09-02T00:00:00.000Z and ${refA_deadline} == ${refB_deadline} == 2026-09-03T00:00:00.000Z"
            - "${refA_reg} == ${reg_zoe_id} and ${refB_reg} == ${reg_ash_id}"
            - "At clock EXACTLY 2026-09-03T00:00:00.000Z the accept returns 201 with ${dispA_status} == WORKING — the window is inclusive of its right edge"
            - "${sweep_at_deadline} == 0 and ${demoted_at_deadline} == 0 — at the same instant the sweep expires nothing, because expiry needs clock STRICTLY greater than acceptance_deadline"
            - "One millisecond later the accept returns 409 with ${late_accept_error} == ERR_ACCEPTANCE_WINDOW_CLOSED"
            - "${sweep_past_deadline} == 1 and ${demoted_past_deadline} == 1 — the same sweep call that did nothing at the deadline now expires exactly one referral"
            - "${refB_status} == EXPIRED, ${ash_status} == REGISTERED, ${ash_dem} == 1 and ${ash_pos} == 1 — the unanswered referral is charged like a no-cause refusal"
      - name: apprentice_ratio_cap_zero_before_first_journeyworker_accept
        grounds:
          - calculations.apprentice_ratio_cap
          - entities.JobRequest.fields.max_apprentices_allowed
          - entities.RatioPolicy.fields.first_apprentice_at_jw_count
          - validations[priority=36]
          - endpoints["POST /hiring-hall/job-requests/{id}/referrals"]
        distinguishing_aspect: |
          METRIC: an INTEGER headcount cap probed at the 0 / 1 boundary on a single
          endpoint (referral issuance for an APPRENTICE slot). The cap counts ACCEPTED
          journeyworker referrals only, so an ISSUED-but-unaccepted journeyworker leaves
