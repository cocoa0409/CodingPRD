            - { call: "POST /api/partner-institutions/${inst_id}/suspend", payload: {}, as: CoalitionAdmin }
          trigger:
            - { call: "POST /api/account-applications/${app_id}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "Decision fails with error_id == ERR_INSTITUTION_NOT_CERTIFIED (institution SUSPENDED at decision time)"
            - "AccountApplication.${app_id}.status remains SUBMITTED; no account_number minted; no RetentionCheckpoints created"

      - name: report_submit_requires_active_grant
        grounds:
          - state_machines.PartnerReport.DRAFT_to_SUBMITTED
          - "validations[priority=9]"
          - "errors[ERR_GRANT_NOT_ACTIVE]"
        distinguishing_aspect: |
          Entity pair PartnerReport -> FundingGrant (distinct from Application->Institution):
          a DRAFT report cannot be submitted while its grant is SUSPENDED, even though the
          report's own state precondition (DRAFT) is satisfied.
        test_recipe:
          setup:
            - "CERTIFIED institution with one OPENED account; grant ACTIVE; report created in DRAFT (claim 4963)"
            - "Grant then SUSPENDED (report is DRAFT so the suspend cascade leaves it untouched)"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
