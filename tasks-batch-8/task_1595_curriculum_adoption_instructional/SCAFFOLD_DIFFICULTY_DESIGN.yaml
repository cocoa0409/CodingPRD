              as: DistrictAdmin
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: BOARD_PENDING }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cy_id}/board-decision"
              payload: { material_id: "${mat_id}", decision: ADOPT }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cy_id}/quotes"
              payload: { material_id: "${mat_id}", publisher_name: "PubFree1", print_unit_price: 0, print_quantity: 100, digital_seat_rate: 0, digital_seat_count: 0, training_sessions: 10, license_years: 5 }
