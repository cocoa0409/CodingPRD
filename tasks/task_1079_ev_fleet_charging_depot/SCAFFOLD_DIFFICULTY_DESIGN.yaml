            - "ChargeSession.${s_id}.status == INTERRUPTED"
            - "ChargeSession.${s_id}.final_cost_cents == 0"
            - "Depot.${d_id}.reserved_load_kw == 0"

  # =================================================================
  # RULE 5 — priority_pair_validation_conflict  (≥2, different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: schedule_temporal_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_CHARGER_TIME_CONFLICT]
        distinguishing_aspect: "PAIR (business_temporal vs business_fiscal): a schedule request that both overlaps the charger's window (priority 9) AND exceeds depot capacity 250>200 (priority 11) returns the lower-priority ERR_CHARGER_TIME_CONFLICT, proving temporal outranks fiscal."
        test_recipe:
          setup:
            - "Depot D max_load 200. Charger C1 CCS 150kW. Existing session E on C1 [10:00,12:00) power 150 (reserved 150)."
            - "New request N on the SAME charger [10:30,11:30) power 100 both overlaps E and would push reserved to 250 (>200)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 200, contracted_capacity_kw: 200, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VB", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { vb_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c1_id}", vehicle_id: "${va_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 150, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { e_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c1_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-05-10T10:30:00Z", scheduled_end: "2026-05-10T11:30:00Z", target_soc_pct: 50, power_kw: 100, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHARGER_TIME_CONFLICT (HTTP 409)"
            - "Depot.${d_id}.reserved_load_kw == 150 (N not reserved)"

      - name: assign_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_ROUTE_NOT_PLANNED]
        distinguishing_aspect: "PAIR (state vs business_safety), a DIFFERENT pair: assigning a route that is COMPLETED (state, priority 5) while its vehicle is also GROUNDED (safety, priority 6) returns ERR_ROUTE_NOT_PLANNED, proving state outranks safety."
        test_recipe:
          setup:
            - "Depot D; Vehicle V SOC 90 READY; Driver DR; Route R required_soc 80 assigned then COMPLETED."
            - "After completion, a VEHICLE work order grounds V (no ASSIGNED route remains to revert)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 90 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/route-assignments"
              payload: { depot_id: "${d_id}", vehicle_id: "${v_id}", driver_id: "${dr_id}", route_name: "R", distance_km: 100, required_soc_pct: 80, scheduled_departure: "2026-05-12T06:00:00Z" }
              as: DepotOperator
              captures: { r_id: $.data.id }
            - call: "POST /fleet/route-assignments/${r_id}/assign"
              payload: {}
              as: DepotOperator
            - call: "POST /fleet/route-assignments/${r_id}/complete"
              payload: {}
              as: DepotOperator
            - call: "POST /fleet/work-orders"
              payload: { asset_type: "VEHICLE", vehicle_id: "${v_id}", issue: "tires", severity: "HIGH" }
              as: MaintenanceTech
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /fleet/route-assignments/${r_id}/assign"
              payload: {}
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROUTE_NOT_PLANNED (HTTP 409)"
            - "RouteAssignment.${r_id}.status == COMPLETED (unchanged)"

  # =================================================================
  # RULE 6 — boundary_precision_check  (≥2, different metrics/endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: assign_soc_at_required_threshold
        grounds:
          - validations[priority=10]
          - state_machines.RouteAssignment.PLANNED_to_ASSIGNED
          - errors[ERR_SOC_BELOW_ROUTE_REQUIREMENT]
        distinguishing_aspect: "SOC metric on the assign endpoint: current_soc_pct == required_soc_pct == 90 passes the >= gate (89 would fail); readiness passes since 90 >= MIN_READY_SOC 80."
        test_recipe:
          setup:
            - "Depot D; Vehicle V SOC exactly 90 IN_SERVICE; Driver DR; Route R required_soc_pct 90."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 90 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/route-assignments"
              payload: { depot_id: "${d_id}", vehicle_id: "${v_id}", driver_id: "${dr_id}", route_name: "R", distance_km: 100, required_soc_pct: 90, scheduled_departure: "2026-05-12T06:00:00Z" }
              as: DepotOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /fleet/route-assignments/${r_id}/assign"
              payload: {}
              as: DepotOperator
          assert:
            - "RouteAssignment.${r_id}.status == ASSIGNED"

      - name: schedule_capacity_at_max_load_boundary
        grounds:
          - validations[priority=11]
          - entities.Depot.fields.reserved_load_kw
          - errors[ERR_DEPOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Power-kW metric on the charge-session-create endpoint: reserved 400 + new 100 == max_load 500 passes the <= gate (501 would fail) — a different metric and endpoint than the SOC boundary."
        test_recipe:
          setup:
            - "Depot D max_load 500. Chargers CA/CB (500kW), Vehicles VA/VB. Session A power 400 SCHEDULED (reserved 400)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 500, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CA", connector_type: "CCS", max_power_kw: 500 }
              as: FleetManager
              captures: { ca_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "CCS", max_power_kw: 500 }
              as: FleetManager
              captures: { cb_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VB", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { vb_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${ca_id}", vehicle_id: "${va_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 400, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { sa_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${cb_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 100, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { sb_id: $.data.id }
          assert:
            - "ChargeSession.${sb_id}.status == SCHEDULED"
            - "Depot.${d_id}.reserved_load_kw == 500"

  # =================================================================
  # RULE 7 — cross_entity_state_dependency  (≥2, different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_requires_vehicle_ready
        grounds:
          - state_machines.RouteAssignment.PLANNED_to_ASSIGNED
          - entities.Vehicle.fields.readiness_status
          - errors[ERR_VEHICLE_NOT_READY]
        distinguishing_aspect: "Entity pair RouteAssignment->Vehicle: assign is gated on Vehicle.readiness_status. Vehicle SOC 50 (< MIN_READY 80) => NOT_READY => ERR_VEHICLE_NOT_READY, even though the route's required_soc 40 would otherwise pass."
        test_recipe:
          setup:
            - "Depot D; Vehicle V SOC 50 IN_SERVICE (NOT_READY since 50<80); Driver DR; Route R required_soc 40."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 50 }
