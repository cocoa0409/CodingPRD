    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant]
    code: 200
    input: ["lease_id?", "reconciliation_id?", "recovery_billing_id?", "status?", "limit?", "offset?"]
    output: TenantChallenge[]
    side_effects: []

  - method: GET
    path: "/lease-admin/audit-rights"
    description: "Filtered list of AuditRights (FK reverse-reachability)"
    roles: [PlatformAdmin, PortfolioManager, PropertyManager, LeaseAccountant]
    code: 200
    input: ["lease_id?", "reconciliation_id?", "status?", "limit?", "offset?"]
    output: AuditRight[]
    side_effects: []

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing or malformed required field; enum out of set; integer out of range" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "period_start >= period_end, commencement >= expiration, effective_date before commencement, or due_date in the past" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in correct state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lease_version does not match Lease.version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same user attempting both sides of a segregation-controlled transition" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Referenced entity missing or in incompatible state (escalation_step on wrong lease, linked amendment not APPLIED, etc.)" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "New RentScheduleLine overlaps an existing line on the same lease (half-open)" }
  - { id: ERR_SCHEDULE_GAP, http: 409, condition: "Activation blocked: RentScheduleLine coverage has a gap within [commencement_date, expiration_date)" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Accepting ComplianceDoc would create overlapping ACCEPTED coverage for same (lease, kind)" }
  - { id: ERR_PROPERTY_OVERCOMMITTED, http: 409, condition: "EXPANSION would push total leased_sf over Property.total_rentable_sf" }
  - { id: ERR_ABSTRACTION_NOT_CERTIFIED, http: 409, condition: "Lease.abstraction_status != CERTIFIED at activation" }
  - { id: ERR_BILLING_NOT_INITIALIZED, http: 409, condition: "No DRAFT/ISSUED RecoveryBilling for current fiscal year at activation" }
  - { id: ERR_OUTSTANDING_BILLING, http: 409, condition: "Termination blocked: outstanding ISSUED unpaid RecoveryBilling exists" }
  - { id: ERR_OPEN_RECONCILIATION, http: 409, condition: "Termination blocked: Reconciliation in OPEN or CHALLENGED state" }
  - { id: ERR_OPEN_CHALLENGE, http: 409, condition: "Reconciliation close blocked: TenantChallenge in OPEN/UNDER_REVIEW/ESCALATED" }
  - { id: ERR_POOL_NOT_CLOSED, http: 409, condition: "Reconciliation post blocked: at least one RecoveryPool missing actual_cents for the fiscal year" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Operation requires Lease.status == ACTIVE" }
  - { id: ERR_NOTIFICATION_NOT_YET_DUE, http: 409, condition: "CriticalDate notify before (due_date - advance_notice_days)" }
  - { id: ERR_NOTIFICATION_WINDOW_MISSED, http: 409, condition: "CriticalDate notify on or after due_date" }
  - { id: ERR_DATE_PASSED, http: 409, condition: "CriticalDate exercise after due_date" }
  - { id: ERR_NOT_EXERCISABLE, http: 409, condition: "CriticalDate kind is not OPTION_EXERCISE / RENEWAL_WINDOW_*" }
  - { id: ERR_AMENDMENT_NOT_APPLIED, http: 409, condition: "linked_amendment_id references an Amendment not in APPLIED state" }
  - { id: ERR_EXTENSION_MUST_EXTEND, http: 409, condition: "EXTENSION Amendment must set new_expiration_date > current expiration" }
  - { id: ERR_EXPANSION_MUST_EXPAND, http: 409, condition: "EXPANSION Amendment must set new_leased_sf > current leased_sf" }
  - { id: ERR_CONTRACTION_MUST_CONTRACT, http: 409, condition: "CONTRACTION Amendment must set new_leased_sf < current leased_sf" }
  - { id: ERR_AUDIT_WINDOW_CLOSED, http: 409, condition: "AuditRight action attempted on or after window_close_date" }
  - { id: ERR_MAX_ROUNDS_REACHED, http: 409, condition: "TenantChallenge reopen blocked: round_index >= 3" }
  - { id: ERR_INVALID_RESOLUTION_SIGN, http: 409, condition: "Resolution outcome/delta sign mismatch (ACCEPTED requires negative delta; REJECTED requires zero)" }
  - { id: ERR_RESOLUTION_EXCEEDS_TRUE_UP, http: 409, condition: "abs(resolution_delta_cents) > abs(Reconciliation.true_up_cents)" }
  - { id: ERR_REJECTION_REASON_REQUIRED, http: 400, condition: "ComplianceDoc reject called without rejection_reason" }

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator; only role that can create Property and set the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /lease-admin/properties"
      - "POST /lease-admin/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all)"

  - name: PortfolioManager
    description: "Senior asset manager; approves amendments, closes reconciliations, resolves challenges"
    identity: "opaque"
    exclusive_operations:
      - "POST /lease-admin/properties/{id}/leases — Create Lease"
      - "POST /lease-admin/leases/{id}/activate — Activate"
      - "POST /lease-admin/leases/{id}/terminate — Terminate"
      - "POST /lease-admin/leases/{id}/reopen-abstraction — Reopen abstraction (OCC)"
      - "POST /lease-admin/leases/{id}/rent-schedule-lines — Create schedule line"
      - "POST /lease-admin/leases/{id}/escalation-steps — Create escalation step"
      - "POST /lease-admin/leases/{id}/amendments — Propose amendment"
      - "POST /lease-admin/amendments/{id}/approve — Approve amendment (OCC)"
      - "POST /lease-admin/amendments/{id}/apply — Apply amendment"
      - "POST /lease-admin/amendments/{id}/reject — Reject amendment"
      - "POST /lease-admin/reconciliations/{id}/approve — Approve reconciliation"
      - "POST /lease-admin/reconciliations/{id}/close — Close reconciliation"
      - "POST /lease-admin/tenant-challenges/{id}/resolve — Resolve challenge"
      - "POST /lease-admin/critical-dates/{id}/waive — Waive date"
      - "POST /lease-admin/audit-rights/{id}/settle — Settle audit"
    shared_operations:
      - "GET endpoints (all)"

  - name: PropertyManager
    description: "Property-level operator; manages critical dates, compliance, challenges, audits"
    identity: "opaque"
    exclusive_operations:
      - "POST /lease-admin/leases/{id}/critical-dates — Create critical date"
      - "POST /lease-admin/critical-dates/{id}/notify — Notify"
      - "POST /lease-admin/critical-dates/{id}/exercise — Exercise"
      - "POST /lease-admin/critical-dates/{id}/lapse — Lapse"
      - "POST /lease-admin/leases/{id}/compliance-docs — Submit doc"
      - "POST /lease-admin/compliance-docs/{id}/start-review"
      - "POST /lease-admin/compliance-docs/{id}/accept"
      - "POST /lease-admin/compliance-docs/{id}/reject"
      - "POST /lease-admin/leases/{id}/tenant-challenges — Open challenge"
      - "POST /lease-admin/tenant-challenges/{id}/escalate"
      - "POST /lease-admin/tenant-challenges/{id}/withdraw"
      - "POST /lease-admin/leases/{id}/audit-rights — Invoke audit"
      - "POST /lease-admin/audit-rights/{id}/start-fieldwork"
      - "POST /lease-admin/audit-rights/{id}/issue-findings"
    shared_operations:
      - "GET endpoints (all)"

  - name: LeaseAccountant
    description: "Accountant; owns recovery pools, billings, reconciliations (posts but cannot approve)"
    identity: "opaque"
    exclusive_operations:
      - "POST /lease-admin/properties/{id}/recovery-pools — Create pool"
      - "PUT /lease-admin/recovery-pools/{id}/actuals — Record actuals"
      - "POST /lease-admin/leases/{id}/recovery-billings — Create billing"
      - "POST /lease-admin/recovery-billings/{id}/issue"
      - "POST /lease-admin/recovery-billings/{id}/mark-paid"
      - "POST /lease-admin/recovery-billings/{id}/void"
      - "POST /lease-admin/leases/{id}/reconciliations — Open reconciliation"
      - "POST /lease-admin/reconciliations/{id}/post — Post reconciliation"
      - "POST /lease-admin/tenant-challenges/{id}/start-review"
      - "POST /lease-admin/tenant-challenges/{id}/reopen"
    shared_operations:
      - "GET endpoints (all)"

  - name: Abstractor
    description: "Lease abstractor; performs abstraction, cannot certify own work"
    identity: "opaque"
    exclusive_operations:
      - "POST /lease-admin/leases/{id}/abstract — Submit abstraction"
    shared_operations:
      - "GET endpoints (all)"

  - name: Certifier
    description: "Quality reviewer; certifies abstraction submitted by a different Abstractor"
    identity: "opaque"
    exclusive_operations:
      - "POST /lease-admin/leases/{id}/certify — Certify abstraction"
    shared_operations:
      - "GET endpoints (all)"
