              as: Concessionaire
              as_user_id: "${cnr_id}"
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 100, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
              captures: { net_before: $.data.net_payment_cents }
          trigger:
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "UNAVAILABILITY", points: 400 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
              captures: { de1_id: $.data.id, de1_allowed: $.data.allowed_amount_cents }
            - call: "POST /ppp/deduction-events/${de1_id}/withdraw"
              payload: { withdrawal_reason: "the March log was double counted against the wrong asset" }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
              captures: { de1_status_after: $.data.status, de1_allowed_after: $.data.allowed_amount_cents }
          assert:
            - "BEFORE — ServicePeriod.${sp1_id}.total_deduction_cents == 0, relief_credit_cents == 0, net_payment_cents == 8604167; Concession.${csn_id}.availability_deduction_ytd_cents == 0 and deduction_points_ytd == 0"
            - "AFTER THE ISSUE — DeductionEvent.${de1_id}.sequence_no == 1, points == 400, raw_amount_cents == 500000, allowed_amount_cents == 500000, pro_rata_amount_cents == 500000, status == ISSUED"
            - "AFTER THE ISSUE — ServicePeriod.${sp1_id}.total_deduction_cents == 500000 and net_payment_cents == 8104167; Concession.${csn_id}.availability_deduction_ytd_cents == 500000 and deduction_points_ytd == 400 and persistent_breach_flag == false (400 < 500)"
            - "AFTER THE WITHDRAWAL — DeductionEvent.${de1_id}.status == WITHDRAWN, allowed_amount_cents == 0, pro_rata_amount_cents == 0, withdrawal_reason recorded, and points is STILL 400 (preserved for audit, not zeroed)"
            - "CONSERVED — ServicePeriod.${sp1_id}.total_deduction_cents is back to 0 and net_payment_cents is back to exactly 8604167, its pre-issue value"
            - "CONSERVED — Concession.${csn_id}.availability_deduction_ytd_cents is back to 0 and deduction_points_ytd is back to 0, because the WITHDRAWN event left the {ISSUED, DISPUTED} input set"
            - "CONSERVED — persistent_breach_flag is still false and no EnforcementAction was created: GET /ppp/enforcement-actions?concession_id=${csn_id} returns total_count 0"
            - "NO ROW DELETED — GET /ppp/deduction-events?service_period_id=${sp1_id} returns total_count 1, and GET /ppp/deduction-events?service_period_id=${sp1_id}&status=WITHDRAWN also returns total_count 1"
            - "NO PHANTOM PAYMENT EDGE — ServicePeriod.${sp1_id}.payment_status is still UNBILLED and reporting_status still VERIFIED; the PAID -> ADJUSTED edge did not fire because the period was never invoiced or paid"
            - "the identity holds at both ends: 8604167 - max(0, 0 - 0) == 8604167 before, and again after the compensating withdrawal"
