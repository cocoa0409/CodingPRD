          - entities.ProductionSlot.fields.window_start
          - entities.ProductionSlot.fields.window_end
        distinguishing_aspect: |
          Single-resource exclusivity on a CLOSED, buffer-padded interval: a build line may hold
          only one active slot at a time and needs 12 changeover hours after it, so a window
          starting at exactly existing.window_end + 12h (2026-09-11T12:00:00Z) is REJECTED while one
          starting a single second later (2026-09-11T12:00:01Z) is accepted. This is the opposite
          adjacency convention from the firmware-campaign instance, which is half-open, unpadded and
          capacity-based rather than exclusive.
