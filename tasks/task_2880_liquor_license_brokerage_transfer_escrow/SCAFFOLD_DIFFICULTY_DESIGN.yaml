# Scaffold Difficulty Design - task 2880 Liquor License Brokerage & Transfer Escrow
# Test-targeting index over SCAFFOLD.yaml 1.1-1.7. Every literal in an assert
# was computed by executing the referenced calculations[].formula in code.
# Logical clock default (unset) is 2026-08-01T00:00:00Z.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: listing_valuation_basis_divergence
        grounds:
          - calculations.listing_market_valuation
          - calculations.quota_scarcity_multiplier
          - entities.Listing.fields.market_price_cents
          - entities.Listing.fields.valuation_basis
          - entities.Listing.fields.comp_count_at_activation
        distinguishing_aspect: |
          On one identical inventory the COMPARABLE_SALES variant prices the listing at 18500000
          (median of three peer transfer prices, subject receipts ignored) while the INCOME_MULTIPLE
          variant prices it at 21600000 (18% of the subject's annual_gross_receipts_cents, every peer
          sale ignored), a signed divergence of exactly 3100000 cents on the Listing/License market-pricing
          domain.
        test_recipe:
          setup:
            - "One county SON with quota_licenses_total 100 and default_valuation_basis COMPARABLE_SALES, so quota_utilization_bps is 400 and scarcity_bps is 0."
            - "Three ACTIVE CLASS_47_ONSALE_GENERAL comparable licenses with last_transfer_price_cents 16000000, 18500000 and 21000000."
            - "A fourth CLASS_47_ONSALE_GENERAL subject license with annual_gross_receipts_cents 120000000 and no last_transfer_price_cents."
            - "One DRAFT listing on the subject license; logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100, default_valuation_basis: "COMPARABLE_SALES" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575, dual_agency_policy: "ALLOWED_WITH_DISCLOSURE" }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "COMP-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 50000000, last_active_date: "2026-07-01", last_transfer_price_cents: 16000000 }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "COMP-2", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 60000000, last_active_date: "2026-07-01", last_transfer_price_cents: 18500000 }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "COMP-3", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 70000000, last_active_date: "2026-07-01", last_transfer_price_cents: 21000000 }
              as: PlatformAdmin
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SUBJ-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
          trigger:
            - call: "GET /listings/${lst_id}/valuation-preview"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: { valuation_basis: "INCOME_MULTIPLE" }
              as: Broker
              as_user_id: "${brk_id}"
          assert:
            - "valuation-preview data.comp_count == 3"
            - "valuation-preview data.comp_median_cents == 18500000"
            - "valuation-preview data.scarcity_bps == 0"
            - "valuation-preview data.comparable_sales_price_cents == 18500000"
            - "valuation-preview data.income_multiple_price_cents == 21600000"
            - "valuation-preview data.divergence_cents == 3100000"
            - "Listing.${lst_id}.valuation_basis == INCOME_MULTIPLE"
            - "Listing.${lst_id}.market_price_cents == 21600000"
            - "Listing.${lst_id}.comp_count_at_activation == 3"
            - "Listing.${lst_id}.scarcity_bps_at_activation == 0"
            - "Listing.${lst_id}.market_price_cents != 18500000 (the COMPARABLE_SALES figure the same call would have written)"

      - name: buyer_qualification_mode_band_drop
        grounds:
          - calculations.buyer_qualification_score
          - entities.BuyerProfile.fields.qualification_score
          - entities.BuyerProfile.fields.qualification_status
          - entities.BuyerProfile.fields.qualification_mode
          - validations[priority=44]
        distinguishing_aspect: |
          The same BuyerProfile row scores 70/QUALIFIED under PRE_CHECK and 40/UNQUALIFIED under
          FINAL_REVIEW - a two-band drop caused solely by the 15+15 premises deductions - so the
          dual-variant behaviour sits on regulatory risk scoring of a party, not on money or on the Listing.
        test_recipe:
          setup:
            - "County SON in state CA with quota_licenses_total 100."
            - "One buyer registered with residency_state NV (nonresident, -10) and citizenship_verified false (-20), no felony, zero prior revocations, so base score is 70."
            - "One premises for that buyer in SON with lawful distances 900/900 and zoning C1, left at conditional_use_permit_status REQUIRED_NOT_FILED and landlord_consent_status PENDING."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Nevada Hospitality LLC", entity_type: "LLC", residency_state: "NV", felony_disclosure: false, prior_revocation_count: 0, citizenship_verified: false }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "1 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { prem_id: $.data.id }
          trigger:
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "PRE_CHECK", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "FINAL_REVIEW", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Premises.${prem_id}.suitability_status == CONDITIONAL"
            - "Premises.${prem_id}.suitability_reason_code == CUP_OUTSTANDING"
            - "after the PRE_CHECK call BuyerProfile.${b_id}.qualification_score == 70"
            - "after the PRE_CHECK call BuyerProfile.${b_id}.qualification_status == QUALIFIED"
            - "after the PRE_CHECK call BuyerProfile.${b_id}.qualification_mode == PRE_CHECK"
            - "after the FINAL_REVIEW call BuyerProfile.${b_id}.qualification_score == 40"
            - "after the FINAL_REVIEW call BuyerProfile.${b_id}.qualification_status == UNQUALIFIED"
            - "after the FINAL_REVIEW call BuyerProfile.${b_id}.qualification_mode == FINAL_REVIEW"
            - "BuyerProfile.${b_id}.version == 3 (two reviews on a row created at version 1)"

  - rule_id: combinatorial_formula
    instances:

      - name: escrow_deposit_nested_clamp_mode_a
        grounds:
          - calculations.escrow_deposit_requirement
          - calculations.quota_scarcity_multiplier
          - entities.PurchaseAgreement.fields.required_deposit_cents
          - entities.License.fields.license_class
          - concurrency_rules[agreement-create-stale-listing]
        distinguishing_aspect: |
          Mode (a): required_deposit_cents combines four inputs (request deposit_pct_bps, the
          enum-keyed CLASS_SURCHARGE_BPS, the integer division floor(scarcity_bps/5) and the price)
          through a min against EFFECTIVE_BPS_CAP and then a nested max(floor, min(cap, round_half_up(raw))),
          so the same call yields 2405001 in the linear region and 7500000 once both clamps bite.
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100 so scarcity_bps is 0 and floor(scarcity_bps/5) is 0."
            - "One CLASS_47_ONSALE_GENERAL license (class surcharge 300 bps), one ACTIVE listing on it, one buyer with a premises in SON."
            - "Listing activated so scarcity_bps_at_activation is frozen at 0."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Coast Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SUBJ-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "1 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
          trigger:
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", contingency_days: 30, expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_a: $.data.id }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v2: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 30000000, deposit_pct_bps: 3300, closing_window_start: "2026-10-01T00:00:00Z", contingency_days: 30, expected_listing_version: "${lst_v2}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_b: $.data.id }
          assert:
            - "Listing.${lst_id}.scarcity_bps_at_activation == 0"
            - "PurchaseAgreement.${agr_a}.required_deposit_cents == 2405001"
            - "PurchaseAgreement.${agr_a}.contingency_deadline_at == 2026-10-01T00:00:00Z"
            - "PurchaseAgreement.${agr_b}.required_deposit_cents == 7500000"
            - "PurchaseAgreement.${agr_b}.required_deposit_cents != 10500000 (the unclamped round_half_up(30000000 * 3500 / 10000))"
            - "Listing.${lst_id}.open_offer_count == 2"

      - name: transfer_filing_fee_pinned_evaluation_order_mode_c
        grounds:
          - calculations.transfer_filing_fee
          - entities.TransferApplication.fields.filing_fee_cents
          - entities.TransferApplication.fields.fee_paid_total_cents
          - entities.TransferApplication.fields.deficiency_round_count
          - validations[priority=82]
        distinguishing_aspect: |
          Mode (c): the surcharge tier is keyed on the step-1 subtotal, never on the step-3 total, so
          the round-1 refiling fee is exactly 204750 (subtotal 195000 at 500 bps) and not 210600
          (the self-referential reading that tiers the 200000+ total at 800 bps).
        test_recipe:
          setup:
            - "Full CLASS_47_ONSALE_GENERAL happy path up to an EXECUTED agreement with 2405001 cents held in escrow."
            - "Seller tax_clearance_status CLEARED, buyer QUALIFIED under FINAL_REVIEW, premises SUITABLE."
            - "Logical clock at its 2026-08-01T00:00:00Z default; contingency_deadline_at is 2026-12-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100, protest_window_days: 15 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Coast Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SUBJ-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "1 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "GRANTED" }
              as: RegulatorAnalyst
            - call: "POST /premises/${prem_id}/landlord-consent"
              payload: { landlord_consent_status: "GRANTED" }
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "FINAL_REVIEW", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /dual-agency-disclosures"
              payload: { agreement_id: "${agr_id}", represents_seller: true, represents_buyer: true }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { disc_id: $.data.id }
            - call: "POST /dual-agency-disclosures/${disc_id}/acknowledge"
              payload: { party: "SELLER" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /dual-agency-disclosures/${disc_id}/acknowledge"
              payload: { party: "BUYER" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /purchase-agreements/${agr_id}/escrow-deposit"
              payload: { amount_cents: 2405001 }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /purchase-agreements/${agr_id}/execute"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
          trigger:
            - call: "POST /transfer-applications"
              payload: { agreement_id: "${agr_id}", fee_paid_cents: 173250 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { app_id: $.data.id }
            - call: "POST /transfer-applications/${app_id}/accept-review"
              payload: {}
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /transfer-applications/${app_id}/deficiency"
              payload: { deficiency_codes: ["MISSING_FINANCIALS"] }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /transfer-applications/${app_id}/resubmit"
              payload: { fee_paid_cents: 210600 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { err_naive: $.data.error_id }
            - call: "POST /transfer-applications/${app_id}/resubmit"
              payload: { fee_paid_cents: 204750 }
              as: Broker
              as_user_id: "${brk_id}"
          assert:
            - "at creation TransferApplication.${app_id}.filing_fee_cents == 173250 (subtotal 165000 + 500 bps surcharge 8250)"
            - "at creation TransferApplication.${app_id}.fee_paid_total_cents == 173250"
            - "the resubmit paying 210600 returns HTTP 422 with ${err_naive} == ERR_FILING_FEE_MISMATCH"
            - "the resubmit paying 204750 returns HTTP 200"
            - "after the accepted resubmit TransferApplication.${app_id}.filing_fee_cents == 204750"
            - "after the accepted resubmit TransferApplication.${app_id}.fee_paid_total_cents == 378000"
            - "after the accepted resubmit TransferApplication.${app_id}.deficiency_round_count == 1"
            - "after the accepted resubmit TransferApplication.${app_id}.status == SUBMITTED"

      - name: commission_round_per_line_then_sum_mode_b
        grounds:
          - calculations.commission_disbursement
          - entities.PurchaseAgreement.fields.commission_total_cents
          - entities.PurchaseAgreement.fields.seller_net_cents
          - entities.EscrowLedgerEntry.fields.entry_type
          - state_machines.PurchaseAgreement.HELD_to_RELEASED
        distinguishing_aspect: |
          Mode (b): on a gross commission of exactly 1063750.575 cents the pinned round-per-line-then-sum
          order yields commission_total_cents == 1063750 (638250 + 425500) whereas the sum-then-round
          reading yields 1063751, so the one-cent difference lands visibly in RELEASE_COMMISSION and is
          mirrored by seller_net_cents == 1063751.
        test_recipe:
          setup:
            - "Full CLASS_47_ONSALE_GENERAL happy path with purchase_price_cents 18500010, brokerage commission_rate_bps 575, county transfer_fee_bps 150."
            - "Dual-agency disclosure fully acknowledged by both parties, so commission_mode is DUAL_AGENCY."
            - "2405001 cents held in escrow, transfer application APPROVED, agreement CLOSED, clock at 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100, transfer_fee_bps: 150, protest_window_days: 15 }
              as: PlatformAdmin
