            - "the replay with ${la_v1} -> 412 with data.error_id == ERR_STALE_LINE_VERSION (rung 10, ahead of every state and business rung the same body would also have to clear)"
            - "that 412 changed nothing: AdvancementDecision.${hold_id}.is_superseded is still false, BreedingLine.${line_a}.pipeline_stage is still NURSERY, version is still ${la_v2}, and BreedingProgram.${prog_id}.committed_plot_count is still 18"
            - "the retry with ${la_v2} -> 201 with decision_index_value == 94.10 (>= the 85.00 bar), granted_plots 60"
            - "after the retry AdvancementDecision.${hold_id}.is_superseded == true, the new decision ${adv_id}.is_superseded == false, and the list returns total_count == 2"
            - "${la_v3} == ${la_v2} + 1 - every accepted write increments version exactly once, and a refused write increments it not at all"
            - "BreedingLine.${line_a}.pipeline_stage == STAGE_1 and BreedingProgram.${prog_id}.committed_plot_count == 78 (18 trial plots + 60 granted)"

      - name: analysis_writes_reject_a_version_the_previous_analysis_already_burned
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[analysis-create-stale-series]
          - validations[priority=11]
          - errors[ERR_STALE_SERIES_VERSION]
        distinguishing_aspect: "The series OCC field is burned by the analysis endpoint itself, so running a second variant with the version that was valid a moment ago must fail - and it must fail even though the second variant targets a different variant slot and would therefore not even collide on supersession. The version guard is per-series, not per-variant."
        test_recipe:
          setup:
            - "One program, one objective, lines SX-1001 and SX-1002."
            - "One site, one STAGE_1 series (rep 3, min_locations 1) with 9-plot entries for both lines, planted, observed 15.0 x3 and 14.0 x3, and both entries finalized so the series is DATA_COMPLETE."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
