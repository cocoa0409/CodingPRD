      - name: analyze_with_empty_consumption_fact_set_yields_null_roi
        boundary_metric: "post_event_analysis promoted-week fact count"
        boundary_value: "0 facts (empty input set)"
        endpoint: "POST /trade-marketing/promotions/{promotionId}/analyze"
        grounds:
          - calculations.post_event_analysis
          - entities.PostEventAnalysis.fields.data_status
          - entities.Promotion.fields.performance_flag
        distinguishing_aspect: |
          A different metric on a different endpoint from the spend-ratio instance: the boundary
          is the empty input set, not a numeric threshold. The promotion accrued real money from
          a SHIPMENT fact, but post_event_analysis reads CONSUMPTION rows only, and there are
          none inside [2026-08-03, 2026-08-17). data_status must be INSUFFICIENT_DATA, every
          unit and profit figure must be 0.00, roi must be null rather than 0.0000, net_spend
          must still be the real 1000.00, and performance_flag must be UNRATED rather than
          UNDERPERFORMING. An implementation that reads the SHIPMENT fact computes a lift and
          returns a non-null roi; one that divides by a zero denominator crashes; one that
          coerces null to 0.0000 flags the promotion UNDERPERFORMING and wrongly raises
          BudgetAllocation.at_risk_amount.
