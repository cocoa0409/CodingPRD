            - "approve with no ASSIGNED ACTIVE policy: error_id == ERR_INSURANCE_NOT_ASSIGNED (${err}); draw stays REQUESTED"
            - "after new policy assigned: approve succeeds, status == APPROVED (${st})"

      - name: claim_create_requires_policy_assigned_to_that_loan
        grounds:
