          setup:
            - "Logical clock 2026-08-03T09:00:00Z (Monday, ISO week 2026-08-03)."
            - "MERIDIAN client, DOMESTIC partner P1, DOMESTIC senior S1 (base cap 40.00 -> effective 50.00, daily capacity 10.00)."
            - "Engagement E1 (deadline 2026-10-15, budget 6000.00) with phase PH1 FIELDWORK expecting 45.00 hours in 2026-08-03..2026-08-31 (SENIOR + MANUFACTURING + CPA)."
            - "S1 booked 20.00 hours over [2026-08-03, 2026-08-10) -> daily_hours 2.86; E1 scheduled (PH1 PARTIALLY_STAFFED)."
