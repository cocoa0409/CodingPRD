      - name: badge_grant_depends_on_live_signed_waiver
        entity_pair: "Member <- LiabilityWaiver"
        grounds:
          - state_machines.Member[access_status].NO_BADGE_to_ACTIVE
          - state_machines.Member[access_status].ACTIVE_to_REVOKED
          - state_machines.LiabilityWaiver.SIGNED_to_EXPIRED
          - validations[priority 17].ERR_WAIVER_REQUIRED
          - endpoints[POST /members/{id}/badge-access]
          - endpoints[POST /operations/daily-readiness-run]
        distinguishing_aspect: |
          A different entity pair: the Member access dimension is gated by the state
          of its LiabilityWaiver rows. The same GRANT payload fails with 422
          ERR_WAIVER_REQUIRED before any waiver exists, succeeds once a SIGNED
          waiver is on file, and the badge is then pulled back to REVOKED by the ops
          run purely because the waiver crossed SIGNED -> EXPIRED — no operator
          action on the Member at all. A repeat GRANT after the expiry fails again,
          proving the dependency is evaluated live and not cached at first grant.
