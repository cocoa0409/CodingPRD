          - errors.ERR_TARIFF_CARRIER_MISMATCH
        distinguishing_aspect: "A TARIFF-basis invoice naming a tariff that belongs to a different carrier is a 422 ERR_TARIFF_CARRIER_MISMATCH — the tariff exists (no 404) but the reference crosses the aggregate boundary."
        test_recipe:
          setup:
