            - call: "POST /packaging-distribution/inventory"
              payload: { product_id: "${prod}", warehouse_id: "${wh_rno}", on_hand_qty: 50 }
              as: WarehouseOps
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 5 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord_a: $.data.id }
            - call: "POST /packaging-distribution/orders/${ord_a}/lines"
              payload: { product_id: "${prod}", qty: 1 }
              as: Buyer
              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/orders"
              payload: { account_id: "${acct}", ship_zone: 3 }
              as: Buyer
              as_user_id: "${acct}"
              captures: { ord_b: $.data.id }
