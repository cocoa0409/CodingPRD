        distinguishing_aspect: "The SettlementAnalyst role is absent from the settle endpoint's roles, so a valid settle request carries returns 403 with ERR_UNAUTHORIZED while the identical request from SettlementApprover returns 200 — the segregation-of-duties boundary is enforced, not merely described."
