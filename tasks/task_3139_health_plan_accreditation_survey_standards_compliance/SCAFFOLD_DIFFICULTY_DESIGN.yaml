# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3139_health_plan_accreditation_survey_standards_compliance
# 9 rules x >=2 instances. Anchors build a canonical base chain reused per file.
# Base chain (b_*): clock -> edition 2026 + 5 elements -> publish -> plan ->
# scope -> application (DRAFT). Review window 2025-01-01..2025-12-31.
# Elements: UM-1 (4pts, must_pass, ev_req 2), UM-2 (2pts, ev_req 0),
#           CR-1 (4pts, must_pass, ev_req 1), MRR-1 (2pts, ev_req 0),
#           QI-1 (4pts, ev_req 1).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: file_case_timeliness_basis_divergence
        grounds:
          - calculations.file_case_timeliness
          - entities.FileReviewCase.fields.is_timely
          - entities.FileReviewSample.fields.timeliness_basis
        distinguishing_aspect: |
          Dual variant on the FileReviewCase domain: identical case data
          (service 2025-03-01, decision 2025-03-20 = 19 days, resolution
          2025-04-25 = 55 days, turnaround 30) is TIMELY in a DECISION_DATE
          sample and NOT TIMELY in a RESOLUTION_DATE sample.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Application in EVIDENCE_REVIEW."
            - "Two DENIAL samples (required_size 5, edition min 5): sample_dec with timeliness_basis DECISION_DATE and sample_res with timeliness_basis RESOLUTION_DATE."
          setup_api_calls:
            - &b_clock
              call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &b_edition
              call: "POST /accreditation/standards-editions"
              payload: { edition_year: 2026, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-12-31T23:59:59Z", min_file_sample_per_category: 5, timeliness_threshold: 0.90 }
              as: PlatformAdmin
              captures: { edition_id: $.data.id }
            - &b_el_um1
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "UM-1", category: "UM", max_points: 4, is_must_pass: true, evidence_required_count: 2 }
              as: PlatformAdmin
              captures: { el_um1: $.data.id }
            - &b_el_um2
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "UM-2", category: "UM", max_points: 2, is_must_pass: false, evidence_required_count: 0 }
              as: PlatformAdmin
              captures: { el_um2: $.data.id }
            - &b_el_cr1
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "CR-1", category: "CR", max_points: 4, is_must_pass: true, evidence_required_count: 1 }
              as: PlatformAdmin
              captures: { el_cr1: $.data.id }
            - &b_el_mrr1
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "MRR-1", category: "MRR", max_points: 2, is_must_pass: false, evidence_required_count: 0 }
              as: PlatformAdmin
              captures: { el_mrr1: $.data.id }
            - &b_el_qi1
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "QI-1", category: "QI", max_points: 4, is_must_pass: false, evidence_required_count: 1 }
              as: PlatformAdmin
              captures: { el_qi1: $.data.id }
            - &b_publish
              call: "POST /accreditation/standards-editions/${edition_id}/publish"
              payload: {}
              as: PlatformAdmin
            - &b_plan
              call: "POST /accreditation/health-plans"
              payload: { name: "Meridian Health Alliance", plan_code: "MHA-01" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - &b_scope
              call: "POST /accreditation/health-plans/${plan_id}/product-line-scopes"
              payload: { product_line: "COMMERCIAL", state_codes: ["OR", "WA"], member_count: 120000 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { scope_id: $.data.id }
            - &b_app
              call: "POST /accreditation/health-plans/${plan_id}/applications"
              payload: { product_line_scope_id: "${scope_id}", standards_edition_id: "${edition_id}", review_period_start: "2025-01-01T00:00:00Z", review_period_end: "2025-12-31T23:59:59Z" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - &b_submit
              call: "POST /accreditation/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { app_vs: $.data.version }
            - &b_begin
              call: "POST /accreditation/applications/${app_id}/begin-evidence-review"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/file-review-samples"
              payload: { sample_type: "DENIAL", required_size: 5, timeliness_basis: "DECISION_DATE" }
              as: AccreditationOfficer
              captures: { sample_dec: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/file-review-samples"
              payload: { sample_type: "DENIAL", required_size: 5, timeliness_basis: "RESOLUTION_DATE" }
              as: AccreditationOfficer
              captures: { sample_res: $.data.id }
          trigger:
            - call: "POST /accreditation/file-review-samples/${sample_dec}/cases"
              payload: { case_reference: "DN-100", service_date: "2025-03-01T00:00:00Z", decision_date: "2025-03-20T00:00:00Z", resolution_date: "2025-04-25T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { case_dec: $.data.id }
            - call: "POST /accreditation/file-review-samples/${sample_res}/cases"
              payload: { case_reference: "DN-200", service_date: "2025-03-01T00:00:00Z", decision_date: "2025-03-20T00:00:00Z", resolution_date: "2025-04-25T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { case_res: $.data.id }
          assert:
            - "FileReviewCase.${case_dec}.days_to_basis == 19 and FileReviewCase.${case_res}.days_to_basis == 55"
            - "after scoring both samples, FileReviewCase.${case_dec}.is_timely == true"
            - "after scoring both samples, FileReviewCase.${case_res}.is_timely == false"
            - "identical dates and turnaround produce divergent is_timely purely from timeliness_basis"

      - name: accreditation_status_gate_first_vs_points_first
        grounds:
          - calculations.accreditation_status_determination
          - entities.AccreditationOutcome.fields.must_pass_failure_count
          - entities.AccreditationOutcome.fields.status
        distinguishing_aspect: |
          Dual variant on the AccreditationOutcome domain: with composite_score
          91.40 and exactly 1 must-pass failure, the pinned gate-first order
          yields ACCREDITED_WITH_CAP while the trap points-first reading would
          yield ACCREDITED (91.40 >= 90.00).
        test_recipe:
          setup:
            - "Base chain; application driven to SCORING via a completed FULL survey during which 6 gap-confirmed questions hit UM-1."
            - "UM file sample rate 1.0000 (5/5 timely DENIAL cases) so UM-1 raw = file 2.40 + evidence 1.60 = 4.00; 6 confirmed gaps deduct round(4*0.1*6,2)=2.40 -> UM-1 awarded 1.60 (< max/2 = 2.0 -> 1 must-pass failure)."
            - "UM-2 = round(2*0.6*1,2)+round(2*0.4,2) = 1.20+0.80 = 2.00; CR-1 = 4.00; MRR-1 = 2.00; QI-1 = 4.00."
            - "Category ratios: UM = round((1.60+2.00)/6,4) = 0.6000; CR/MRR/QI = 1.0000 -> base = 0.6000*0.30+0.30+0.20+0.20 = 0.88."
            - "Measures: one reportable percentile 100 for 2025 -> quality component 2.00; consumer 100.00 for 2025 -> consumer component 2.00; measure_bonus = 4.00."
            - "composite = round(0.88*100 + 4.00, 2) = 92.00."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_el_um2
            - *b_el_cr1
            - *b_el_mrr1
            - *b_el_qi1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - &b_ev1
              call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM policy", expected_application_version: "${app_vs}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev1: $.data.id }
            - &b_appv2
              call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v2: $.data.version }
            - &b_ev2
              call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM procedure", expected_application_version: "${app_v2}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev2: $.data.id }
            - &b_appv3
              call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v3: $.data.version }
            - &b_ev3
              call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_cr1}", title: "CR committee minutes", expected_application_version: "${app_v3}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev3: $.data.id }
            - &b_appv4
              call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v4: $.data.version }
            - &b_ev4
              call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_qi1}", title: "QI program description", expected_application_version: "${app_v4}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev4: $.data.id }
            - &b_acc1
              call: "POST /accreditation/evidence-items/${ev1}/accept"
              payload: {}
              as: AccreditationOfficer
            - &b_acc2
              call: "POST /accreditation/evidence-items/${ev2}/accept"
              payload: {}
              as: AccreditationOfficer
            - &b_acc3
              call: "POST /accreditation/evidence-items/${ev3}/accept"
              payload: {}
              as: AccreditationOfficer
            - &b_acc4
              call: "POST /accreditation/evidence-items/${ev4}/accept"
              payload: {}
              as: AccreditationOfficer
            - &b_sample
              call: "POST /accreditation/applications/${app_id}/file-review-samples"
              payload: { sample_type: "DENIAL", required_size: 5, timeliness_basis: "DECISION_DATE" }
              as: AccreditationOfficer
              captures: { sample_id: $.data.id }
            - &b_case1
              call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-01", service_date: "2025-02-01T00:00:00Z", decision_date: "2025-02-10T00:00:00Z", resolution_date: "2025-02-10T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_case2
              call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-02", service_date: "2025-03-01T00:00:00Z", decision_date: "2025-03-05T00:00:00Z", resolution_date: "2025-03-05T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_case3
              call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-03", service_date: "2025-04-01T00:00:00Z", decision_date: "2025-04-20T00:00:00Z", resolution_date: "2025-04-20T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_case4
              call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-04", service_date: "2025-05-01T00:00:00Z", decision_date: "2025-05-30T00:00:00Z", resolution_date: "2025-05-30T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_case5
              call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-05", service_date: "2025-06-01T00:00:00Z", decision_date: "2025-06-01T00:00:00Z", resolution_date: "2025-06-01T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_sample_submit
              call: "POST /accreditation/file-review-samples/${sample_id}/submit"
              payload: {}
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_sample_score
              call: "POST /accreditation/file-review-samples/${sample_id}/score"
              payload: {}
              as: AccreditationOfficer
            - &b_advance
              call: "POST /accreditation/applications/${app_id}/advance-to-survey-scheduling"
              payload: {}
              as: AccreditationOfficer
            - &b_appv5
              call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v5: $.data.version }
            - &b_survey
              call: "POST /accreditation/applications/${app_id}/surveys"
              payload: { survey_type: "FULL", mode: "VIRTUAL", start_date: "2026-10-05", end_date: "2026-10-09", budgeted_surveyor_hours: 8, expected_application_version: "${app_v5}" }
              as: AccreditationOfficer
              captures: { survey_id: $.data.id }
            - &b_surveyor
              call: "POST /accreditation/surveyors"
              payload: { name: "Dana Lead", credential_level: "LEAD" }
              as: PlatformAdmin
              captures: { surveyor_id: $.data.id }
            - &b_session
              call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 540, end_minute: 660, is_onsite: false }
              as: AccreditationOfficer
              captures: { session_id: $.data.id }
            - &b_confirm
              call: "POST /accreditation/surveys/${survey_id}/confirm"
              payload: {}
              as: AccreditationOfficer
            - &b_q1
              call: "POST /accreditation/survey-sessions/${session_id}/questions"
              payload: { standard_element_id: "${el_um1}", question_text: "UM turnaround controls q1", raises_gap: true }
              as: Surveyor
              as_user_id: "${surveyor_id}"
              captures: { q1: $.data.id }
            - &b_q2
              call: "POST /accreditation/survey-sessions/${session_id}/questions"
              payload: { standard_element_id: "${el_um1}", question_text: "UM turnaround controls q2", raises_gap: true }
              as: Surveyor
              as_user_id: "${surveyor_id}"
              captures: { q2: $.data.id }
            - &b_q3
              call: "POST /accreditation/survey-sessions/${session_id}/questions"
              payload: { standard_element_id: "${el_um1}", question_text: "UM turnaround controls q3", raises_gap: true }
              as: Surveyor
              as_user_id: "${surveyor_id}"
              captures: { q3: $.data.id }
            - &b_q4
              call: "POST /accreditation/survey-sessions/${session_id}/questions"
              payload: { standard_element_id: "${el_um1}", question_text: "UM turnaround controls q4", raises_gap: true }
              as: Surveyor
              as_user_id: "${surveyor_id}"
              captures: { q4: $.data.id }
            - &b_q5
              call: "POST /accreditation/survey-sessions/${session_id}/questions"
              payload: { standard_element_id: "${el_um1}", question_text: "UM turnaround controls q5", raises_gap: true }
              as: Surveyor
              as_user_id: "${surveyor_id}"
              captures: { q5: $.data.id }
            - &b_q6
              call: "POST /accreditation/survey-sessions/${session_id}/questions"
              payload: { standard_element_id: "${el_um1}", question_text: "UM turnaround controls q6", raises_gap: true }
              as: Surveyor
              as_user_id: "${surveyor_id}"
              captures: { q6: $.data.id }
            - &b_qa1
              call: "POST /accreditation/surveyor-questions/${q1}/adjudicate"
              payload: { gap_confirmed: true }
              as: AccreditationOfficer
            - &b_qa2
              call: "POST /accreditation/surveyor-questions/${q2}/adjudicate"
              payload: { gap_confirmed: true }
              as: AccreditationOfficer
            - &b_qa3
              call: "POST /accreditation/surveyor-questions/${q3}/adjudicate"
              payload: { gap_confirmed: true }
              as: AccreditationOfficer
            - &b_qa4
              call: "POST /accreditation/surveyor-questions/${q4}/adjudicate"
              payload: { gap_confirmed: true }
              as: AccreditationOfficer
            - &b_qa5
              call: "POST /accreditation/surveyor-questions/${q5}/adjudicate"
              payload: { gap_confirmed: true }
              as: AccreditationOfficer
            - &b_qa6
              call: "POST /accreditation/surveyor-questions/${q6}/adjudicate"
              payload: { gap_confirmed: true }
              as: AccreditationOfficer
            - &b_sess_complete
              call: "POST /accreditation/survey-sessions/${session_id}/complete"
              payload: {}
              as: Surveyor
              as_user_id: "${surveyor_id}"
            - &b_survey_complete
              call: "POST /accreditation/surveys/${survey_id}/complete"
              payload: {}
              as: AccreditationOfficer
            - &b_qm
              call: "POST /accreditation/product-line-scopes/${scope_id}/quality-measure-results"
              payload: { measure_code: "HEDIS-CBP", measurement_year: 2025, percentile: 100, is_reportable: true }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_cs
              call: "POST /accreditation/product-line-scopes/${scope_id}/consumer-survey-scores"
              payload: { survey_year: 2025, composite_score: 100.00, response_count: 900 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - &b_sc_um1
              call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um1}" }
              as: AccreditationOfficer
              captures: { score_um1: $.data.id }
            - &b_sc_um2
              call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um2}" }
              as: AccreditationOfficer
              captures: { score_um2: $.data.id }
            - &b_sc_cr1
              call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_cr1}" }
              as: AccreditationOfficer
              captures: { score_cr1: $.data.id }
            - &b_sc_mrr1
              call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_mrr1}" }
              as: AccreditationOfficer
              captures: { score_mrr1: $.data.id }
            - &b_sc_qi1
              call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_qi1}" }
              as: AccreditationOfficer
              captures: { score_qi1: $.data.id }
            - &b_fin_um1
              call: "POST /accreditation/element-scores/${score_um1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - &b_fin_um2
              call: "POST /accreditation/element-scores/${score_um2}/finalize"
              payload: {}
              as: AccreditationOfficer
            - &b_fin_cr1
              call: "POST /accreditation/element-scores/${score_cr1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - &b_fin_mrr1
              call: "POST /accreditation/element-scores/${score_mrr1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - &b_fin_qi1
              call: "POST /accreditation/element-scores/${score_qi1}/finalize"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/applications/${app_id}/outcome"
              payload: {}
              as: AccreditationOfficer
              captures: { outcome_id: $.data.id }
          assert:
            - "ElementScore.${score_um1}.awarded_points == 1.60 (4.00 raw - 6*0.40 gap deduction) and must_pass_failure_count counts it (1.60 < 4/2 = 2.0)"
            - "AccreditationOutcome.${outcome_id}.must_pass_failure_count == 1"
            - "AccreditationOutcome.${outcome_id}.composite_score == 92.00"
            - "AccreditationOutcome.${outcome_id}.measure_bonus == 4.00"
            - "AccreditationOutcome.${outcome_id}.status == ACCREDITED_WITH_CAP"
            - "AccreditationOutcome.${outcome_id}.status != ACCREDITED even though composite_score 92.00 >= 90.00 — the must-pass gate is evaluated first"
            - "AccreditationApplication.${app_id}.status == CORRECTIVE_ACTION (an AUTO CAP was created for UM-1)"

      - name: element_score_provisional_vs_final_gap_deduction
        grounds:
          - calculations.element_score
          - entities.ElementScore.fields.gap_count_used
          - state_machines.ElementScore.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Dual variant on the ElementScore domain: the same application data
          (UM sample rate 0.9000, 2/2 evidence) yields provisional awarded
          3.76 (gap_count_used == 0 pinned) and final awarded 3.36 once one
          gap is confirmed — same inputs, different results per variant.
        test_recipe:
          setup:
            - "Base chain to SCORING, but the DENIAL sample has 10 cases with 9 timely (rate 0.9000) and exactly 1 gap-confirmed question on UM-1."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_el_um2
            - *b_el_cr1
            - *b_el_mrr1
            - *b_el_qi1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_appv3
            - *b_ev3
            - *b_appv4
            - *b_ev4
            - *b_acc1
            - *b_acc2
            - *b_acc3
            - *b_acc4
            - *b_sample
            - *b_case1
            - *b_case2
            - *b_case3
            - *b_case4
            - *b_case5
            - call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-06", service_date: "2025-07-01T00:00:00Z", decision_date: "2025-07-15T00:00:00Z", resolution_date: "2025-07-15T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-07", service_date: "2025-08-01T00:00:00Z", decision_date: "2025-08-10T00:00:00Z", resolution_date: "2025-08-10T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-08", service_date: "2025-09-01T00:00:00Z", decision_date: "2025-09-20T00:00:00Z", resolution_date: "2025-09-20T00:00:00Z", required_turnaround_days: 30 }
