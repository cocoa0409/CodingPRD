              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /screening-cycles/${cyc}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /_clock/set_current_utc"
