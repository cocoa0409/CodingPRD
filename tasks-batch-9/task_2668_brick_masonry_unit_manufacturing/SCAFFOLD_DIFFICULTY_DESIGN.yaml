  # =======================================================================
  # RULE 3 - non_linear_state_machine
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sample_panel_revision_cycle_capped_at_three_rounds
        grounds:
          - state_machines.SamplePanel.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.SamplePanel.REVISION_REQUESTED_to_SUBMITTED
          - entities.SamplePanel.fields.revision_round
          - validations[priority=42]
        distinguishing_aspect: |
          This instance exercises a CYCLE on SamplePanel - the pair
          SUBMITTED -> REVISION_REQUESTED -> SUBMITTED can be traversed repeatedly and
          is bounded only by the revision_round counter, which terminates the loop at
          PANEL_MAX_REVISION_ROUNDS 3; the other instance in this rule is a PARALLEL
          two-dimension machine on a different entity (Order) where no state is ever
          revisited.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE, formulation F1 QUALIFIED, fired lot L1 minted at kiln position 3 with color_index 52.18"
            - "Order O1 ASSIGNED to P1 with requires_panel_approval true"
            - "SamplePanel PN1 laid up in DRAFT against F1 and dye lot L1, then driven through three full revision rounds so revision_round == 3 and status == SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
