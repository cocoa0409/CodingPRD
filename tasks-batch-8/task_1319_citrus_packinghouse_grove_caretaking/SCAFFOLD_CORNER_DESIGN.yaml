      - name: quarantine_release_unholds_deliveries
        claim_type: violation_to_error
        grounds: [state_machines.QuarantineOrder.ACTIVE_to_RELEASED, state_machines.Delivery.regulatory_status]
        distinguishing_aspect: "The release cascade is the compensating direction: HELD deliveries of the grove return to RELEASED only when NO other ACTIVE order covers the grove (two orders, release one, still HELD; release the other, RELEASED)."
        test_recipe:
          setup: ["Delivery received CLEAR; then TWO GROVE-scope quarantines (CANKER by co_uh_a, BLACK_SPOT by co_uh_b) hold the delivery"]
