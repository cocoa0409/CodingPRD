        claim_type: variant_divergence
        grounds:
          - "calculations.appraised_value_by_methodology"
          - "entities.Property.fields.appraisal_methodology"
          - "entities.Property.fields.appraised_value_usd"
          - "state_machines.Property.SUBMITTED_to_NONE"
        distinguishing_aspect: |
          One tract, one cruise, three methodologies: MARKET reads 1200.00 acres at 3250.00 =
          3900000.00, INCOME capitalises 210000.00 at 575 bps = 3652173.91, and COST adds
          1200.00 acres of bare land at 1150.00 to the 4647.12 cruised tons at 26.50 =
          1503148.68. The spread between MARKET and COST is 2396851.32 on identical inputs, so
          the stored value must track the chosen methodology and not a single blended number.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund and Piney Creek Tract (1200.00 acres, PROSPECT)."
            - "Stand PC-01 cruise-closed at 4647.12 tons, so timber_basis_tons for the COST variant is 4647.12."
            - "Each submission is invalidated (SUBMITTED -> NONE) before the next one so the appraisal dimension is re-entered from NONE."
