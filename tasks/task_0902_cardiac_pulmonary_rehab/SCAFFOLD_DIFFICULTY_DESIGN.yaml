            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clinA}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clinA}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clinA}", station_id: "${st1}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { s1: $.data.id } }
            - { call: "GET /rehab/programs/${prog}", payload: {}, as: RehabCoordinator, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clinA}", station_id: "${st2}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T10:10:00Z", scheduled_end: "2026-05-04T11:10:00Z", expected_program_version: "${pv2}" }, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_CLINICIAN_UNAVAILABLE (10-min gap < 15-min buffer, different station)"
            - "trigger HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_completed_session_conserves_session_cap
        grounds:
          - state_machines.RehabSession.COMPLETED_to_VOIDED
          - state_machines.RehabSession.SCHEDULED_to_COMPLETED
          - entities.RehabProgram.fields.sessions_used
          - entities.RehabProgram.fields.sessions_remaining_authorized
        distinguishing_aspect: "Conserved quantity = authorized_session_cap (visit count): after complete-then-void, sessions_used returns to 0 and the invariant sessions_used + sessions_remaining_authorized == authorized_session_cap (5) holds at every step with zero drift."
        test_recipe:
          setup:
            - "ACTIVE program authorized_session_cap=5; one COMPLETED session (no claim references it)"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-017", full_name: "Pat Seventeen", date_of_birth: "1944-04-14" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000017" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Seventeen", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-17", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}", authorized_session_cap: 5 }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 95, rpe: 12, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
          trigger:
            - { call: "POST /rehab/sessions/${sess}/void", payload: {}, as: RehabCoordinator }
          assert:
            - "after complete (before void): RehabProgram.${prog}.sessions_used == 1 and sessions_remaining_authorized == 4"
            - "after void: RehabSession.${sess}.status == VOIDED"
            - "after void: RehabProgram.${prog}.sessions_used == 0 and sessions_remaining_authorized == 5"

      - name: void_claim_conserves_program_money_identity
        grounds:
          - state_machines.BillingClaim.SUBMITTED_to_VOID
          - entities.RehabProgram.fields.total_billed_cents
          - entities.RehabProgram.fields.total_reimbursed_cents
          - entities.RehabProgram.fields.total_patient_responsibility_cents
        distinguishing_aspect: "Conserved quantity = money identity (total_billed_cents == total_reimbursed_cents + total_patient_responsibility_cents): after submit-then-void the three totals return to 0 with the identity holding at every step — a different conserved quantity than the session-count invariant."
        test_recipe:
          setup:
            - "ACTIVE MODERATE program on TELEMETRY station; one COMPLETED session; a SUBMITTED claim billed 19500 (reimb 16000, resp 3500)"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-018", full_name: "Pat Eighteen", date_of_birth: "1943-03-13" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000018" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Eighteen", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-18", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/authorizations/${auth}/approve", payload: {}, as: RehabCoordinator }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { pv1: $.data.version } }
            - { call: "POST /rehab/sessions", payload: { program_id: "${prog}", clinician_id: "${clin}", station_id: "${st}", session_type: "MONITORED_EXERCISE", phase: "PHASE_II", scheduled_start: "2026-05-04T09:00:00Z", scheduled_end: "2026-05-04T10:00:00Z", expected_program_version: "${pv1}" }, as: RehabCoordinator, captures: { sess: $.data.id } }
            - { call: "POST /rehab/sessions/${sess}/complete", payload: { post_spo2: 95, rpe: 12, exercise_minutes: 30 }, as: RehabClinician, as_user_id: "${clin}" }
            - { call: "POST /rehab/claims", payload: { program_id: "${prog}", session_id: "${sess}", authorization_id: "${auth}" }, as: BillingSpecialist, captures: { claim: $.data.id } }
            - { call: "POST /rehab/claims/${claim}/submit", payload: {}, as: BillingSpecialist }
          trigger:
            - { call: "POST /rehab/claims/${claim}/void", payload: {}, as: BillingSpecialist }
          assert:
            - "after submit (before void): RehabProgram.${prog}.total_billed_cents == 19500, total_reimbursed_cents == 16000, total_patient_responsibility_cents == 3500 (19500 == 16000 + 3500)"
            - "after void: BillingClaim.${claim}.status == VOID"
            - "after void: RehabProgram.${prog}.total_billed_cents == 0, total_reimbursed_cents == 0, total_patient_responsibility_cents == 0 (identity 0 == 0 + 0 preserved)"
