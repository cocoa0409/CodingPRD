            - "Ratifying S2 while THERMOSTAT has only an OPTIONAL set returns 409 ERR_MANDATORY_COVERAGE_INCOMPLETE"
            - "After the MANDATORY set is added the same call returns 200 with status == \"RATIFIED\" and ratified_at == \"2026-09-01T00:00:00Z\""
            - "The second ratify returns 409 ERR_INVALID_SPECIFICATION_STATE - the trigger is not idempotent"
            - "Specification.${s2_id}.feature_set_count == 2 and version == 2 (create then ratify); the refused second ratify did not bump version"

      - name: specification_retires_only_without_live_submissions_and_then_locks
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Specification.transitions.DEPRECATED_to_RETIRED
          - state_machines.Specification.terminal_states
          - validations[priority=13]
        distinguishing_aspect: >
          One endpoint drives two demotion steps, so the reached state depends on the current status:
          RATIFIED -> DEPRECATED unconditionally, DEPRECATED -> RETIRED only when no submission of the
          specification is live. RETIRED is terminal - both a further deprecate and a fresh IP
          commitment scoped to it are refused with ERR_INVALID_SPECIFICATION_STATE.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification S with one LIGHTING MANDATORY feature set."
            - "Member M1 in good standing owns one DRAFT submission against S. Member M2 is only REGISTERED."
          setup_api_calls:
