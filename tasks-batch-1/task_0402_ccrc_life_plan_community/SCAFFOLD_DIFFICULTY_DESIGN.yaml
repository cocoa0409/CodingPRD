              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "SKILLED" }
              as: CareCoordinator
              captures: { ctid: $.data.id }
          trigger:
            - call: "POST /ccrc/care-transitions/${ctid}/apply"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_CARE_STEP (pri 9 wins over pri 10 ERR_NO_BED_OCCUPIED)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_met_at_exact_threshold_votes
        grounds:
          - state_machines.CouncilResolution.OPEN_to_PASSED
          - validations[priority=16]
          - entities.CouncilResolution.fields.eligible_voter_count
        distinguishing_aspect: |
          `>=` boundary on the quorum metric: with eligible_voter_count=4 and quorum_pct_bps=5000,
          exactly 2 votes cast (2*10000 == 4*5000) satisfies quorum and the resolution closes PASSED;
          1 vote (1*10000 < 20000) would fail. The boundary is reachable through the close endpoint.
        test_recipe:
          setup:
            - "Community c with exactly 4 ACTIVE residencies; a council (quorum 5000bps) with one OPEN resolution carrying 2 YES votes and 0 NO votes."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Vote Town", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
