            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING", "SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases", payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-16T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "GET /api/annual-statistics/2026", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { counts: $.data.counts } }
          assert:
            - "data.counts.reports_received == 2"
