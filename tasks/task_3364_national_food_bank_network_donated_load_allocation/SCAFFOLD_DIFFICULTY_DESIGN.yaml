          assert:
            - "the first recall is created with ${rc1_status} == OPEN"
            - "after trace ${rc1_traced} == 1 and ${rc1_held} == 800, and ProductRecall.${rc1}.recall_status == TRACING"
            - "after resolve ${rc1_final} == RESOLVED and ProductRecall.${rc1}.held_lbs == 0"
            - "the second recall for the same lot is created with ${rc2_status} == REOPENED, not OPEN"
            - "after its trace ${rc2_final} == TRACING and ${rc2_traced} == 1, so the cycle closed back into TRACING"
            - "DonatedLoad.${r800}.safety_status == CLEAR after the first recall resolved, and DonatedLoad.${r400}.safety_status == CLEAR throughout (lot LOT-88 never matched)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: award_cascade_share_floor_to_probation_to_bid_withdrawal
        grounds:
          - state_machines.DonatedLoad.BIDDING_to_AWARDED
          - state_machines.MemberFoodBank.CERTIFIED_to_PROBATION
          - state_machines.LoadBid.SUBMITTED_to_WITHDRAWN
          - calculations.share_balance_recompute
        distinguishing_aspect: |
          Depth-4 chain from the award trigger: award L_A (hop 1) debits the winner below the
          50-share floor (hop 2), which flips the member to PROBATION (hop 3), which auto-withdraws
          that member's unrelated SUBMITTED bid on L_B and releases its hold (hop 4) — each hop
          caused by the previous one, not by the original award.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Loads L_A (40000 lbs, 620 miles) and L_B (30000 lbs, 300 miles) are BIDDING under one ACTIVE agreement."
            - "Member M1 is CERTIFIED with exactly 100000 granted shares and holds two SUBMITTED bids: 99980 shares on L_A and 10 shares on L_B."
          setup_api_calls:
            - *clk_sep
            - *agr_dry
            - *agr_dry_act
            - &load_ca
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 40000, lot_code: "LOT-CA", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 620 }
              as: NetworkAdmin
              captures: { la: $.data.id }
            - call: "POST /network/loads/${la}/post"
              payload: {}
              as: NetworkAdmin
              captures: { la_v: $.data.version }
            - &load_cb
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 30000, lot_code: "LOT-CB", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 300 }
              as: NetworkAdmin
              captures: { lb: $.data.id }
            - call: "POST /network/loads/${lb}/post"
              payload: {}
              as: NetworkAdmin
              captures: { lb_v: $.data.version }
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - *grant_m1_solo
            - call: "POST /network/loads/${la}/bids"
              payload: { member_id: "${m1}", shares_offered: 99980, preference_rank: 1, can_self_transport: false, expected_load_version: "${la_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid_a: $.data.id }
            - call: "POST /network/loads/${lb}/bids"
              payload: { member_id: "${m1}", shares_offered: 10, preference_rank: 2, can_self_transport: false, expected_load_version: "${lb_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid_b: $.data.id }
          trigger:
            - call: "POST /network/loads/${la}/award"
              payload: {}
              as: NetworkAdmin
              captures: { la_a: $.data.version }
          assert:
            - "DonatedLoad.${la}.status == AWARDED and LoadBid.${bid_a}.bid_status == AWARDED"
            - "MemberFoodBank.${m1}.share_balance == 20 after the full chain (100000 - 99980 hold + 99980 release - 99980 debit - 10 hold + 10 release)"
            - "MemberFoodBank.${m1}.certification_status == PROBATION because the post-debit balance 10 is below the 50-share floor"
            - "LoadBid.${bid_b}.bid_status == WITHDRAWN with rejection_reason MEMBER_PROBATION — the hop-4 side effect on an unrelated load"
            - "MemberFoodBank.${m1}.active_bid_count == 0 and MemberFoodBank.${m1}.share_reserved == 0"
            - "sum(ShareLedgerEntry.amount) over M1's six entries == 20 == MemberFoodBank.${m1}.share_balance"

      - name: audit_failure_cascade_to_program_suspension_and_missed_pickup
        grounds:
          - state_machines.MemberAudit.IN_PROGRESS_to_FAILED
          - state_machines.MemberFoodBank.CERTIFIED_to_PROBATION
          - state_machines.StoreDonationProgram.ACTIVE_to_SUSPENDED
          - state_machines.StorePickup.SCHEDULED_to_MISSED
        distinguishing_aspect: |
          Depth-3 chain from the audit-completion trigger: the failed audit (hop 1) drops the
          member to PROBATION (hop 2), which suspends its ACTIVE store program (hop 3), which marks
          that program's still-SCHEDULED pickup MISSED (hop 4) — a different propagation pattern
          from the award cascade, originating at a different trigger.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Member M1 is CERTIFIED with an ACTIVE store program PROG and one SCHEDULED pickup on 2026-09-10."
            - "A second STORAGE audit AUD2 with scores 80/90/90 (weighted 84.0) is IN_PROGRESS."
          setup_api_calls:
            - *clk_sep
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - call: "POST /network/store-programs"
              payload: { member_id: "${m1}", store_name: "Kroger Dublin", store_chain: "Kroger", pickup_frequency: "WEEKLY", expected_weekly_lbs: 1200 }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { prog: $.data.id, prog_status: $.data.program_status }
            - call: "POST /network/store-programs/${prog}/pickups"
              payload: { scheduled_date: "2026-09-10T00:00:00Z", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { pk: $.data.id }
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "STORAGE", storage_score: 80, distribution_score: 90, reporting_score: 90 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud2: $.data.id }
          trigger:
            - call: "POST /network/audits/${aud2}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
              captures: { aud2_status: $.data.audit_status }
          assert:
            - "the program was ACTIVE before the trigger: ${prog_status} == ACTIVE"
            - "MemberAudit.${aud2}.weighted_score == 84.0 and ${aud2_status} == FAILED (below the 85 threshold)"
            - "MemberFoodBank.${m1}.certification_status == PROBATION and MemberFoodBank.${m1}.audit_score == 84"
            - "StoreDonationProgram.${prog}.program_status == SUSPENDED"
            - "StorePickup.${pk}.pickup_status == MISSED although no pickup endpoint was called"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_bid_for_unopened_load
        grounds:
          - validations[priority=16]
          - validations[priority=31]
