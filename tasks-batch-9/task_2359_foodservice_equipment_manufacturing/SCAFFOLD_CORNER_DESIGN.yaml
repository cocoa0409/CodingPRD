  - section: state_machines
    instances:
      - name: listing_submission_moves_draft_to_submitted_and_stamps_the_submitter
        claim_type: Valid Transition
        grounds:
          - state_machines.CertificationListing["DRAFT -> SUBMITTED"]
          - endpoints["POST /certification-listings/{id}/submissions"]
        distinguishing_aspect: "The first submission of a DRAFT listing must reach SUBMITTED, record submitted_by_user_id as the acting X-User-ID, and leave revision at 0 -- the revision counter only moves on the CONDITIONS_REQUESTED re-entry."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel with a DRAFT AGENCY_GAMMA listing for [SANITATION, ELECTRICAL]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { st: $.data.status, rev: $.data.revision, submitter: $.data.submitted_by_user_id }
          assert:
            - "HTTP status == 200"
            - "${st} == SUBMITTED"
            - "${rev} == 0"
            - "${submitter} == 'ce-1'"
            - "EquipmentModel.${model_id}.certification_posture == UNLISTED"

      - name: second_listing_for_same_model_and_agency_cannot_be_submitted_while_first_is_listed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CertificationListing["DRAFT -> SUBMITTED"].preconditions
          - validations[priority=37]
          - errors[ERR_DUPLICATE_LISTING_APPLICATION]
        distinguishing_aspect: "The duplicate-application guard blocks the submission, not the create: a second AGENCY_GAMMA listing row for the same model may be created freely and only fails at DRAFT -> SUBMITTED while the sibling sits in LISTED, and the blocked row stays in DRAFT."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900 with AGENCY_GAMMA listing L1 already LISTED; a second AGENCY_GAMMA listing L2 created in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { l1: $.data.id }
            - call: "POST /certification-listings/${l1}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${l1}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /certification-listings/${l1}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { l2: $.data.id, l2_status_at_create: $.data.status }
