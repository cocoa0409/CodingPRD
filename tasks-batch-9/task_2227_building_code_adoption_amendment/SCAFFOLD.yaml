# =============================================================================
# PRD Benchmark Seed Tables — task_2227_building_code_adoption_amendment
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2227. Building Code Adoption & Amendment (state building code council): model code cycle review with committee assignment by discipline, proposed state amendment intake from industry, fire service and local jurisdictions, cost-benefit and energy impact analysis for each amendment, public comment periods, hearings and committee deliberation with vote records, adoption rulemaking with effective dates and transition rules for projects in review, local amendment authority, filing requirements and stringency limits, code interpretation requests and formal opinion issuance, training rollout for building officials and design professionals before enforcement begins

domain_name: state-building-code-council
api_prefix: "/"   # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - version_pinning_on_approval

  entity_topology: graph
  # VoteRecord is a junction between Hearing and AmendmentProposal;
  # InterpretationRequest.supersedes_request_id is self-referential;
  # TrainingSession/LocalAmendment/InterpretationRequest each reference two or
  # three aggregates (AdoptionRule, Jurisdiction, DisciplineCommittee).

  state_machine_shape: parallel
  # AmendmentProposal carries two independent dimensions on one row
  # (review_status × analysis_status) plus two revision cycles
  # (APPROVED→SCREENED via reopen, RETURNED_FOR_REVISION→SCREENED via screening).
  # InterpretationRequest is cyclic (PUBLISHED→ASSIGNED on appeal);
  # LocalAmendment is cyclic + branching; CodeCycle is compound
  # (RULEMAKING gate derives from child proposal states).

  relationship_patterns:
    - one_to_many
    - many_to_many        # VoteRecord (Hearing × AmendmentProposal)
    - self_referential    # InterpretationRequest.supersedes_request_id
    - cross_aggregate     # TrainingSession → AdoptionRule + Jurisdiction

  role_model: segregation_of_duties
  # The X-User-ID that prepares an ImpactAnalysis may not review it; the one that
  # FILEs an AdoptionRule may not PUBLISH it; the one that drafts a formal
  # opinion may not publish it.

  consistency_model: immediate
  difficulty_level: expert_plus
  # 14 entities / 72 endpoints / 10 state machines / 11 calculations / 76 errors /
  # 27 priority-ordered validation rows / 6 roles / 2 OCC rules.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CodeCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_year, type: integer, source: input, description: "Calendar year of the model-code adoption cycle", constraints: "2020..2050; unique together with model_code_edition" }
      - { name: model_code_edition, type: string, source: input, description: "Model code edition under review, e.g. IBC-2027" }
      - { name: intake_opens_at, type: datetime, source: input, description: "Declared start of amendment intake (informational; INTAKE_OPEN is operator-driven)" }
      - { name: intake_closes_at, type: datetime, source: input, description: "Declared end of amendment intake (informational)" }
      - { name: status, type: enum, source: system, description: "DRAFT | INTAKE_OPEN | INTAKE_CLOSED | DELIBERATION | RULEMAKING | ADOPTED | ABANDONED", default: DRAFT }
      - { name: seated_committee_count, type: integer, source: computed, description: "Count of child DisciplineCommittee rows with status == SEATED" }
      - { name: proposal_count, type: integer, source: computed, description: "Count of AmendmentProposal rows with code_cycle_id == this.id (any review_status)" }
      - { name: approved_proposal_count, type: integer, source: computed, description: "Count of AmendmentProposal rows with code_cycle_id == this.id AND review_status == APPROVED" }
      - { name: approved_incremental_cost_cents, type: integer, source: computed, description: "Ledger: sum of statewide_incremental_cost_cents over AmendmentProposal rows with code_cycle_id == this.id AND review_status == APPROVED (see calculations.cycle_cost_ledger)", default: 0 }
      - { name: approved_permit_backlog_count, type: integer, source: computed, description: "Sum of affected_permit_count over AmendmentProposal rows with code_cycle_id == this.id AND review_status == APPROVED", default: 0 }

  - name: DisciplineCommittee
    parent: null
    common_fields: true
    fields:
      - { name: code_cycle_id, type: string, source: system, description: "FK -> CodeCycle.id; owning model-code cycle (taken from the path, not the body)" }
      - { name: discipline, type: enum, source: input, description: "BUILDING | STRUCTURAL | FIRE_AND_LIFE_SAFETY | ENERGY | MECHANICAL | PLUMBING | ELECTRICAL | ACCESSIBILITY", constraints: "unique per (code_cycle_id, discipline)" }
      - { name: voting_seat_count, type: integer, source: input, description: "Configured cap on voting seats for this committee", constraints: "3..12" }
      - { name: active_voting_member_count, type: integer, source: computed, description: "Count of child CommitteeMember rows with voting_seat == true AND status == ACTIVE" }
      - { name: quorum_required, type: integer, source: computed, description: "ceil(active_voting_member_count * 2 / 3); see calculations.vote_tally_and_outcome" }
      - { name: sector_coverage_complete, type: boolean, source: computed, description: "true when child ACTIVE members cover all of {INDUSTRY, FIRE_SERVICE, LOCAL_JURISDICTION}" }
      - { name: chair_member_count, type: integer, source: computed, description: "Count of child CommitteeMember rows with is_chair == true AND status == ACTIVE" }
      - { name: status, type: enum, source: computed, description: "FORMING | SEATED | DISSOLVED — derived; see state_machines.DisciplineCommittee", default: FORMING }

  - name: CommitteeMember
    parent: DisciplineCommittee
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: system, description: "FK -> DisciplineCommittee.id; committee this seat belongs to (from the path)" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: sector, type: enum, source: input, description: "INDUSTRY | FIRE_SERVICE | LOCAL_JURISDICTION | DESIGN_PROFESSIONAL | PUBLIC" }
      - { name: voting_seat, type: boolean, source: input, description: "Whether the seat carries a vote", default: true }
      - { name: is_chair, type: boolean, source: input, description: "Whether this member presides; at most one ACTIVE chair per committee", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | RECUSED | RESIGNED", default: ACTIVE }
      - { name: recusal_reason, type: string, source: input, description: "Reason captured on the most recent RECUSE action", default: null }

  - name: AmendmentProposal
    parent: null
    common_fields: true
    fields:
      - { name: code_cycle_id, type: string, source: input, description: "FK -> CodeCycle.id; cycle the amendment is proposed into" }
      - { name: committee_id, type: string, source: computed, description: "FK -> DisciplineCommittee.id; assigned by the server from discipline (see calculations.committee_assignment_by_discipline)" }
      - { name: code_section, type: string, source: input, description: "Model-code section the amendment edits, e.g. C402.1.4" }
      - { name: discipline, type: enum, source: input, description: "BUILDING | STRUCTURAL | FIRE_AND_LIFE_SAFETY | ENERGY | MECHANICAL | PLUMBING | ELECTRICAL | ACCESSIBILITY" }
      - { name: title, type: string, source: input, description: "Short title of the proposed amendment" }
      - { name: proposed_text, type: string, source: input, description: "Verbatim proposed code text" }
      - { name: stringency_direction, type: enum, source: input, description: "MORE_STRINGENT | LESS_STRINGENT | NEUTRAL | CLARIFYING" }
      - { name: proposer_sector, type: enum, source: input, description: "INDUSTRY | FIRE_SERVICE | LOCAL_JURISDICTION | DESIGN_PROFESSIONAL | PUBLIC" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter" }
      - { name: review_status, type: enum, source: system, description: "Dimension 1: SUBMITTED | SCREENED | COMMENT_OPEN | COMMENT_CLOSED | APPROVED | REJECTED | RETURNED_FOR_REVISION | WITHDRAWN", default: SUBMITTED }
      - { name: analysis_status, type: enum, source: computed, description: "Dimension 2 (evolves independently of review_status): NOT_STARTED | PENDING | PARTIAL | COMPLETE | STALE", default: NOT_STARTED }
      - { name: energy_analysis_required, type: boolean, source: computed, description: "true when discipline == ENERGY OR stringency_direction == MORE_STRINGENT" }
      - { name: affected_permit_count, type: integer, source: computed, description: "affected_permit_count copied from the ACCEPTED COST_BENEFIT ImpactAnalysis; null when none", default: null }
      - { name: statewide_incremental_cost_cents, type: integer, source: computed, description: "Certified statewide first-cost; see calculations.statewide_incremental_cost_rollup", default: null }
      - { name: preliminary_benefit_cost_ratio, type: number, source: computed, description: "PRELIMINARY variant of calculations.amendment_benefit_cost_ratio", default: null }
      - { name: final_benefit_cost_ratio, type: number, source: computed, description: "FINAL variant of calculations.amendment_benefit_cost_ratio", default: null }
      - { name: support_comment_count, type: integer, source: computed, description: "Count of PublicComment rows for this proposal with position == SUPPORT AND comment_round == this.comment_round", default: 0 }
      - { name: oppose_comment_count, type: integer, source: computed, description: "Count of PublicComment rows for this proposal with position == OPPOSE AND comment_round == this.comment_round", default: 0 }
      - { name: total_comment_count, type: integer, source: computed, description: "Count of PublicComment rows for this proposal with comment_round == this.comment_round (all positions)", default: 0 }
      - { name: comment_window_status, type: enum, source: computed, description: "NONE | OPEN | CLOSED", default: NONE }
      - { name: comment_opens_at, type: datetime, source: computed, description: "Start of the current comment window (inclusive)", default: null }
      - { name: comment_closes_at, type: datetime, source: computed, description: "End of the current comment window (EXCLUSIVE — see validations priority 20)", default: null }
      - { name: comment_extension_count, type: integer, source: computed, description: "Extensions granted in the current comment round", default: 0 }
      - { name: comment_round, type: integer, source: computed, description: "Increments on every comment-window OPEN action", default: 0 }
      - { name: revision_round, type: integer, source: computed, description: "Increments on every entry into RETURNED_FOR_REVISION or on reopen from APPROVED", default: 0 }
      - { name: base_docket_score, type: number, source: computed, description: "Weighted score fixed at comment-window CLOSE; see calculations.docket_priority_score", default: null }
      - { name: docket_queue_rank, type: integer, source: computed, description: "1-indexed rank of base_docket_score inside the eligible pool at agenda time", default: null }
      - { name: docket_priority_score, type: number, source: computed, description: "base_docket_score + rank_adjustment; see calculations.docket_priority_score", default: null }

  - name: ImpactAnalysis
    parent: AmendmentProposal
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> AmendmentProposal.id; proposal under analysis (from the path)" }
      - { name: analysis_type, type: enum, source: input, description: "COST_BENEFIT | ENERGY_IMPACT" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID that filed the analysis (segregation-of-duties subject)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID that accepted or returned the analysis", default: null }
      - { name: incremental_cost_by_occupancy, type: object, source: input, description: "Map of occupancy class -> incremental first cost in cents per permit; required for COST_BENEFIT", default: null, constraints: "keys must be members of OCCUPANCY_PERMIT_SHARE" }
      - { name: affected_permit_count, type: integer, source: input, description: "Annual statewide permits touched by the amendment; required for COST_BENEFIT", default: null, constraints: ">= 0" }
      - { name: annual_cost_savings_cents, type: integer, source: input, description: "Annual statewide operating savings in cents; required for COST_BENEFIT", default: null, constraints: ">= 0" }
      - { name: measure_life_years, type: integer, source: input, description: "Analyst measure life; required for COST_BENEFIT", default: null, constraints: "1..40" }
      - { name: annual_energy_savings_kwh, type: number, source: input, description: "Annual statewide kWh saved; required for ENERGY_IMPACT", default: null }
      - { name: energy_delta_pct, type: number, source: input, description: "Modelled whole-building energy change in percent (negative = savings); required for ENERGY_IMPACT", default: null }
      - { name: statewide_incremental_cost_cents, type: integer, source: computed, description: "Rollup of incremental_cost_by_occupancy; null for ENERGY_IMPACT", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | RETURNED | SUPERSEDED", default: SUBMITTED }

  - name: PublicComment
    parent: AmendmentProposal
    common_fields: false
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> AmendmentProposal.id; proposal commented on (from the path)" }
      - { name: commenter_sector, type: enum, source: input, description: "INDUSTRY | FIRE_SERVICE | LOCAL_JURISDICTION | DESIGN_PROFESSIONAL | PUBLIC" }
      - { name: position, type: enum, source: input, description: "SUPPORT | OPPOSE | NEUTRAL" }
      - { name: body, type: string, source: input, description: "Comment text" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the commenter" }
      - { name: comment_round, type: integer, source: computed, description: "Snapshot of AmendmentProposal.comment_round at receipt" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant at receipt" }

  - name: Hearing
    parent: DisciplineCommittee
    common_fields: true
    fields:
      - { name: committee_id, type: string, source: input, description: "FK -> DisciplineCommittee.id; committee that holds the hearing" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end (exclusive)", constraints: "scheduled_end > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONVENED | ADJOURNED | CANCELLED", default: SCHEDULED }
      - { name: agenda_proposal_ids, type: array, source: computed, description: "Ordered agenda: AmendmentProposal ids in the order produced by calculations.agenda_selection", default: [] }
      - { name: present_member_ids, type: array, source: input, description: "CommitteeMember ids recorded present at convene", default: null }
      - { name: present_voting_count, type: integer, source: computed, description: "Count of present_member_ids that are ACTIVE voting members of committee_id", default: null }
      - { name: quorum_required_at_convene, type: integer, source: computed, description: "committee.quorum_required snapshot taken at convene", default: null }
      - { name: convened_at, type: datetime, source: system, description: "Logical-clock instant of convene", default: null }
      - { name: adjourned_at, type: datetime, source: system, description: "Logical-clock instant of adjourn", default: null }

  - name: VoteRecord
    parent: Hearing
    common_fields: false
    fields:
      - { name: hearing_id, type: string, source: system, description: "FK -> Hearing.id; hearing at which the vote was taken (from the path)" }
      - { name: proposal_id, type: string, source: input, description: "FK -> AmendmentProposal.id; proposal voted on" }
      - { name: ballots, type: array, source: input, description: "Array of { member_id, ballot } where ballot is YES | NO | ABSTAIN" }
      - { name: voting_seats_at_call, type: integer, source: computed, description: "committee.active_voting_member_count at the moment of the call (RECUSED and RESIGNED members excluded)" }
      - { name: quorum_required, type: integer, source: computed, description: "ceil(voting_seats_at_call * 2 / 3)" }
      - { name: yes_count, type: integer, source: computed, description: "Ballots with ballot == YES" }
      - { name: no_count, type: integer, source: computed, description: "Ballots with ballot == NO" }
      - { name: abstain_count, type: integer, source: computed, description: "Ballots with ballot == ABSTAIN" }
      - { name: absent_count, type: integer, source: computed, description: "voting_seats_at_call - (yes_count + no_count + abstain_count)" }
      - { name: outcome, type: enum, source: computed, description: "APPROVED | REJECTED" }
      - { name: outcome_reason, type: enum, source: computed, description: "MAJORITY_APPROVED | SIMPLE_MAJORITY_FAILED | SUPERMAJORITY_FAILED | FIRE_SERVICE_VETO" }
      - { name: final_benefit_cost_ratio_at_vote, type: number, source: computed, description: "AmendmentProposal.final_benefit_cost_ratio as computed for this call", default: null }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the presiding chair that recorded the vote" }

  - name: AdoptionRule
    parent: CodeCycle
    common_fields: true
    fields:
      - { name: code_cycle_id, type: string, source: input, description: "FK -> CodeCycle.id; cycle being adopted" }
      - { name: title, type: string, source: input, description: "Rulemaking order title" }
      - { name: base_date, type: datetime, source: computed, description: "UTC midnight of created_at; anchor for all schedule arithmetic", default: null }
      - { name: projected_permit_backlog, type: integer, source: computed, description: "See calculations.adoption_schedule step 3 (uses the statutory provisional window, never the final effective window)", default: null }
      - { name: transition_grace_days, type: integer, source: computed, description: "Tier selected from projected_permit_backlog", default: null }
      - { name: notice_days, type: integer, source: computed, description: "max(MIN_NOTICE_DAYS, transition_grace_days)", default: null }
      - { name: effective_date, type: datetime, source: computed, description: "base_date + notice_days at 00:00:00Z; enforcement begins", default: null }
      - { name: transition_cutoff_date, type: datetime, source: computed, description: "Equals effective_date; permit applications received at or before this instant may complete under the prior edition", default: null }
      - { name: prior_code_expiry_date, type: datetime, source: computed, description: "effective_date + PRIOR_CODE_PROJECT_WINDOW_DAYS; last day a project in review may use the prior edition", default: null }
      - { name: approved_incremental_cost_cents_at_filing, type: integer, source: computed, description: "CodeCycle.approved_incremental_cost_cents frozen at FILE", default: null }
      - { name: pinned_amendment_versions, type: object, source: computed, description: "Map of AmendmentProposal.id -> version frozen at FILE (version-pinning on approval)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | PUBLISHED | EFFECTIVE | WITHDRAWN | SUPERSEDED", default: DRAFT }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID that filed the rule", default: null }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID that published the rule; must differ from filed_by_user_id", default: null }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of publication; anchors the local-filing and appeal windows", default: null }
      - { name: statewide_readiness_pct_at_effective, type: number, source: computed, description: "calculations.statewide_training_readiness value snapshot when the rule went EFFECTIVE", default: null }
      - { name: withdrawal_reason, type: string, source: input, description: "Reason recorded on WITHDRAW", default: null }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Local jurisdiction name", constraints: "unique" }
      - { name: population, type: integer, source: input, description: "Resident population" }
      - { name: local_authority_level, type: enum, source: input, description: "FULL | LIMITED | NONE — delegated local-amendment authority" }
      - { name: host_seat_capacity, type: integer, source: input, description: "Total training seats the jurisdiction can host at any one instant" }
      - { name: official_headcount, type: integer, source: input, description: "Building officials required to be trained before enforcement", constraints: ">= 1" }
      - { name: compliance_pct_enrollment_basis, type: number, source: computed, description: "ENROLLMENT_BASIS variant of calculations.jurisdiction_training_compliance", default: 0 }
      - { name: compliance_pct_attendance_basis, type: number, source: computed, description: "ATTENDANCE_BASIS variant of calculations.jurisdiction_training_compliance", default: 0 }
      - { name: enforcement_readiness, type: enum, source: computed, description: "READY when compliance_pct_attendance_basis >= READINESS_THRESHOLD_PCT else NOT_READY", default: NOT_READY }
      - { name: effective_local_amendment_count, type: integer, source: computed, description: "Count of LocalAmendment rows with jurisdiction_id == this.id AND status == FILED_EFFECTIVE", default: 0 }

  - name: LocalAmendment
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; filing jurisdiction" }
      - { name: adoption_rule_id, type: string, source: input, description: "FK -> AdoptionRule.id; state rule the local amendment modifies" }
      - { name: code_section, type: string, source: input, description: "Section amended locally", constraints: "unique per (jurisdiction_id, adoption_rule_id, code_section) among rows with status NOT IN {REJECTED, VOIDED}" }
      - { name: local_text, type: string, source: input, description: "Local amendment text" }
      - { name: stringency_direction, type: enum, source: input, description: "MORE_STRINGENT | NEUTRAL | CLARIFYING | LESS_STRINGENT (LESS_STRINGENT is rejected — see validations priority 18)" }
      - { name: justification, type: string, source: input, description: "Local findings supporting the amendment" }
      - { name: filed_within_window, type: boolean, source: computed, description: "true when created_at <= adoption_rule.published_at + LOCAL_FILING_WINDOW_DAYS" }
      - { name: revision_round, type: integer, source: computed, description: "Increments on each resubmit after RETURNED", default: 0 }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing council staffer", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | RETURNED | FILED_EFFECTIVE | REJECTED | VOIDED", default: SUBMITTED }

  - name: InterpretationRequest
    parent: null
    common_fields: true
    fields:
      - { name: adoption_rule_id, type: string, source: input, description: "FK -> AdoptionRule.id; rule whose text is being interpreted" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; requesting jurisdiction (null when an industry petitioner asks)", default: null }
      - { name: supersedes_request_id, type: string, source: input, description: "FK -> InterpretationRequest.id; prior published opinion this request replaces", default: null }
      - { name: assigned_committee_id, type: string, source: computed, description: "FK -> DisciplineCommittee.id; committee assigned to draft the opinion", default: null }
      - { name: code_section, type: string, source: input, description: "Section the question concerns" }
      - { name: question, type: string, source: input, description: "Interpretation question text" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requester" }
      - { name: opinion_text, type: string, source: input, description: "Drafted formal opinion text", default: null }
      - { name: binding_scope, type: enum, source: input, description: "STATEWIDE | REQUESTING_JURISDICTION_ONLY", default: null }
      - { name: opinion_number, type: integer, source: computed, description: "Monotonic per adoption_rule_id, assigned at PUBLISH starting at 1 as 1 + the highest number ever issued under that rule; numbers are never reused after an appeal clears one", default: null }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID that drafted the opinion", default: null }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID that published the opinion; must differ from drafted_by_user_id", default: null }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of publication; anchors the appeal window", default: null }
      - { name: appeal_round, type: integer, source: computed, description: "Number of granted appeals; capped at APPEAL_ROUNDS_MAX", default: 0 }
      - { name: decline_reason, type: string, source: input, description: "Reason recorded when the council declines to opine", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ASSIGNED | OPINION_DRAFTED | PUBLISHED | DECLINED | SUPERSEDED", default: SUBMITTED }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: adoption_rule_id, type: string, source: input, description: "FK -> AdoptionRule.id; rule whose content is taught" }
      - { name: host_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction hosting the room" }
      - { name: discipline, type: enum, source: input, description: "BUILDING | STRUCTURAL | FIRE_AND_LIFE_SAFETY | ENERGY | MECHANICAL | PLUMBING | ELECTRICAL | ACCESSIBILITY" }
      - { name: audience, type: enum, source: input, description: "BUILDING_OFFICIAL | DESIGN_PROFESSIONAL | BOTH" }
      - { name: seat_capacity, type: integer, source: input, description: "Seats in the room", constraints: ">= 1" }
      - { name: starts_at, type: datetime, source: input, description: "Half-open occupancy interval start [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Half-open occupancy interval end (exclusive)", constraints: "ends_at > starts_at" }
      - { name: seats_available, type: integer, source: computed, description: "seat_capacity - (enrolled_count + attended_count + no_show_count); see calculations.session_seat_ledger" }
      - { name: enrolled_count, type: integer, source: computed, description: "Child TrainingEnrollment rows with status == ENROLLED", default: 0 }
      - { name: attended_count, type: integer, source: computed, description: "Child TrainingEnrollment rows with status == ATTENDED", default: 0 }
      - { name: no_show_count, type: integer, source: computed, description: "Child TrainingEnrollment rows with status == NO_SHOW", default: 0 }
      - { name: cancellation_reason, type: string, source: input, description: "Reason recorded on CANCELLED", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ENROLLMENT_OPEN | ENROLLMENT_CLOSED | DELIVERED | CANCELLED", default: SCHEDULED }

  - name: TrainingEnrollment
    parent: TrainingSession
    common_fields: true
    fields:
      - { name: training_session_id, type: string, source: system, description: "FK -> TrainingSession.id; session enrolled in (from the path)" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; employer jurisdiction of the attendee" }
      - { name: attendee_name, type: string, source: input, description: "Attendee name", constraints: "unique per (training_session_id, attendee_name) among rows with status != CANCELLED" }
      - { name: attendee_role, type: enum, source: input, description: "BUILDING_OFFICIAL | DESIGN_PROFESSIONAL" }
      - { name: enrolled_by_user_id, type: string, source: system, description: "X-User-ID that created the enrollment" }
      - { name: status, type: enum, source: system, description: "ENROLLED | ATTENDED | NO_SHOW | CANCELLED", default: ENROLLED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- CodeCycle
  - entity: CodeCycle
    initial_state: DRAFT
    terminal_states: [ADOPTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: INTAKE_OPEN
        trigger: "POST /code-cycles/{code_cycle_id}/status {to_status: INTAKE_OPEN}"
        actor: CouncilAdmin
        preconditions:
          - "seated_committee_count >= 1 (cross-entity: at least one child DisciplineCommittee with status == SEATED) else ERR_COMMITTEE_NOT_SEATED"
        side_effects: ["increments CodeCycle.version by 1"]
      - from: INTAKE_OPEN
        to: INTAKE_CLOSED
        trigger: "POST /code-cycles/{code_cycle_id}/status {to_status: INTAKE_CLOSED}"
        actor: CouncilAdmin
        preconditions: []
        side_effects:
          - "AmendmentProposal rows with review_status == SUBMITTED remain SUBMITTED and stay screenable"
          - "increments CodeCycle.version by 1"
      - from: INTAKE_CLOSED
        to: DELIBERATION
        trigger: "POST /code-cycles/{code_cycle_id}/status {to_status: DELIBERATION}"
        actor: CouncilAdmin
        preconditions: []
        side_effects: ["increments CodeCycle.version by 1"]
      - from: DELIBERATION
        to: RULEMAKING
        trigger: "POST /code-cycles/{code_cycle_id}/status {to_status: RULEMAKING}"
        actor: CouncilAdmin
        preconditions:
          - "COMPOUND GATE: every AmendmentProposal with code_cycle_id == this.id has review_status IN {APPROVED, REJECTED, WITHDRAWN} else ERR_PROPOSALS_UNRESOLVED"
        side_effects:
          - "recomputes approved_incremental_cost_cents and approved_permit_backlog_count (calculations.cycle_cost_ledger)"
          - "increments CodeCycle.version by 1"
      - from: RULEMAKING
        to: DELIBERATION
        trigger: "system event: an AmendmentProposal of this cycle leaves review_status APPROVED via POST /amendment-proposals/{proposal_id}/reopen"
        actor: system
        preconditions:
          - "cycle.status == RULEMAKING at the moment of the reopen"
        side_effects:
          - "AUTO (bubble-up): cycle reverts to DELIBERATION because the compound RULEMAKING gate no longer holds"
          - "increments CodeCycle.version by 1"
      - from: RULEMAKING
        to: ADOPTED
        trigger: "system event: an AdoptionRule of this cycle reaches EFFECTIVE"
        actor: system
        preconditions: ["the AdoptionRule that became EFFECTIVE has code_cycle_id == this.id"]
        side_effects: ["increments CodeCycle.version by 1"]
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /code-cycles/{code_cycle_id}/status {to_status: ABANDONED}"
        actor: CouncilAdmin
        preconditions: ["proposal_count == 0 else ERR_PROPOSALS_UNRESOLVED"]
        side_effects:
          - "all child DisciplineCommittee rows -> DISSOLVED (cascade down)"
          - "increments CodeCycle.version by 1"
      - from: INTAKE_OPEN
        to: ABANDONED
        trigger: "POST /code-cycles/{code_cycle_id}/status {to_status: ABANDONED}"
        actor: CouncilAdmin
        preconditions: ["proposal_count == 0 else ERR_PROPOSALS_UNRESOLVED"]
        side_effects:
          - "all child DisciplineCommittee rows -> DISSOLVED (cascade down)"
          - "increments CodeCycle.version by 1"

  # ------------------------------------------------------- DisciplineCommittee
  - entity: DisciplineCommittee
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: SEATED
        trigger: "system event on POST /discipline-committees/{committee_id}/members or POST /committee-members/{member_id}/recusal {action: REINSTATE}"
        actor: system
        preconditions:
          - "active_voting_member_count >= ceil(voting_seat_count * 2 / 3)"
          - "sector_coverage_complete == true"
          - "chair_member_count == 1"
        side_effects:
          - "AUTO (bubble-up from children): recomputes active_voting_member_count, quorum_required, sector_coverage_complete"
          - "increments DisciplineCommittee.version by 1"
      - from: SEATED
        to: FORMING
        trigger: "system event on POST /committee-members/{member_id}/recusal {action: RECUSE}"
        actor: system
        preconditions:
          - "after the recusal, active_voting_member_count < ceil(voting_seat_count * 2 / 3) OR sector_coverage_complete == false OR chair_member_count != 1"
        side_effects:
          - "AUTO: committee un-seats; Hearing creation is blocked while FORMING (ERR_COMMITTEE_NOT_SEATED)"
          - "increments DisciplineCommittee.version by 1"
      - from: SEATED
        to: DISSOLVED
        trigger: "system event: parent CodeCycle -> ABANDONED"
        actor: system
        preconditions: []
        side_effects: ["increments DisciplineCommittee.version by 1"]
      - from: FORMING
        to: DISSOLVED
        trigger: "system event: parent CodeCycle -> ABANDONED"
        actor: system
        preconditions: []
        side_effects: ["increments DisciplineCommittee.version by 1"]

  # ------------------------------------------------- AmendmentProposal (parallel)
  # Dimension 1 = review_status. Dimension 2 = analysis_status. The two dimensions
  # advance on different triggers and are only coupled by the two guards noted below.
  - entity: AmendmentProposal
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      # -- dimension 1: review_status
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /amendment-proposals/{proposal_id}/screening {decision: ACCEPT_FOR_ANALYSIS}"
        actor: TechnicalStaff
        preconditions:
          - "parent CodeCycle.status IN {INTAKE_OPEN, INTAKE_CLOSED} else ERR_CYCLE_STATE_INVALID"
        side_effects:
          - "analysis_status NOT_STARTED -> PENDING (dimension 2 advanced by the same call)"
          - "sets energy_analysis_required = (discipline == ENERGY OR stringency_direction == MORE_STRINGENT)"
          - "increments AmendmentProposal.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /amendment-proposals/{proposal_id}/screening {decision: REJECT}"
        actor: TechnicalStaff
        preconditions: ["parent CodeCycle.status IN {INTAKE_OPEN, INTAKE_CLOSED} else ERR_CYCLE_STATE_INVALID"]
        side_effects: ["analysis_status stays NOT_STARTED", "increments AmendmentProposal.version by 1"]
      - from: RETURNED_FOR_REVISION
        to: SCREENED
        trigger: "POST /amendment-proposals/{proposal_id}/screening {decision: ACCEPT_FOR_ANALYSIS}"
        actor: TechnicalStaff
        preconditions: ["parent CodeCycle.status IN {INTAKE_OPEN, INTAKE_CLOSED, DELIBERATION} else ERR_CYCLE_STATE_INVALID"]
        side_effects:
          - "CYCLE: revision loop re-enters the pipeline; analysis_status STALE -> PENDING"
          - "increments AmendmentProposal.version by 1"
      - from: SCREENED
        to: COMMENT_OPEN
        trigger: "POST /amendment-proposals/{proposal_id}/comment-window {action: OPEN}"
        actor: CouncilAdmin
        preconditions:
          - "GUARD across dimensions: analysis_status == COMPLETE else ERR_ANALYSIS_INCOMPLETE"
          - "parent CodeCycle.status IN {INTAKE_CLOSED, DELIBERATION} else ERR_CYCLE_STATE_INVALID"
          - "closes_at - opens_at >= COMMENT_MIN_DAYS else ERR_COMMENT_PERIOD_TOO_SHORT"
        side_effects:
          - "comment_window_status NONE|CLOSED -> OPEN; comment_round += 1; comment_extension_count = 0"
          - "support_comment_count / oppose_comment_count / total_comment_count reset to 0 for the new round"
          - "increments AmendmentProposal.version by 1"
      - from: COMMENT_OPEN
        to: COMMENT_CLOSED
        trigger: "POST /amendment-proposals/{proposal_id}/comment-window {action: CLOSE}"
        actor: CouncilAdmin
        preconditions:
          - "current_utc >= comment_closes_at else ERR_COMMENT_WINDOW_STILL_OPEN"
        side_effects:
          - "comment_window_status -> CLOSED"
          - "recomputes support/oppose/total comment counts for comment_round"
          - "computes base_docket_score (calculations.docket_priority_score step 1)"
          - "increments AmendmentProposal.version by 1"
      - from: COMMENT_CLOSED
        to: APPROVED
        trigger: "POST /hearings/{hearing_id}/votes — VoteRecord.outcome == APPROVED"
        actor: CouncilChair
        preconditions:
          - "proposal_id is in hearing.agenda_proposal_ids else ERR_PROPOSAL_NOT_ON_AGENDA"
          - "hearing.status == CONVENED else ERR_HEARING_STATE_INVALID"
          - "analysis_status == COMPLETE else ERR_ANALYSIS_INCOMPLETE"
          - "NOT (stringency_direction == LESS_STRINGENT AND code_section IN LIFE_SAFETY_SECTIONS) else ERR_STRINGENCY_FLOOR_VIOLATION"
          - "final_benefit_cost_ratio >= BCR_FLOOR else ERR_BENEFIT_COST_BELOW_FLOOR"
        side_effects:
          - "computes final_benefit_cost_ratio (FINAL variant) before the outcome is evaluated"
          - "LEDGER SYNC: CodeCycle.approved_incremental_cost_cents += statewide_incremental_cost_cents; CodeCycle.approved_permit_backlog_count += affected_permit_count; CodeCycle.approved_proposal_count += 1"
          - "creates the immutable VoteRecord"
          - "increments AmendmentProposal.version by 1 and CodeCycle.version by 1"
      - from: COMMENT_CLOSED
        to: REJECTED
        trigger: "POST /hearings/{hearing_id}/votes — VoteRecord.outcome == REJECTED"
        actor: CouncilChair
        preconditions:
          - "proposal_id is in hearing.agenda_proposal_ids else ERR_PROPOSAL_NOT_ON_AGENDA"
          - "hearing.status == CONVENED else ERR_HEARING_STATE_INVALID"
        side_effects:
          - "creates the immutable VoteRecord with outcome_reason IN {SIMPLE_MAJORITY_FAILED, SUPERMAJORITY_FAILED, FIRE_SERVICE_VETO}"
          - "no change to CodeCycle.approved_incremental_cost_cents"
          - "increments AmendmentProposal.version by 1"
      - from: COMMENT_CLOSED
        to: RETURNED_FOR_REVISION
        trigger: "POST /amendment-proposals/{proposal_id}/reopen"
        actor: CouncilAdmin
        preconditions: ["parent CodeCycle.status IN {DELIBERATION, RULEMAKING} else ERR_CYCLE_STATE_INVALID"]
        side_effects:
          - "revision_round += 1; analysis_status COMPLETE -> STALE"
          - "CASCADE L2: because analysis_status became STALE, every child ImpactAnalysis with status == ACCEPTED -> SUPERSEDED"
          - "CASCADE L3: because no ACCEPTED analysis remains, statewide_incremental_cost_cents, affected_permit_count, preliminary_benefit_cost_ratio and final_benefit_cost_ratio are set to null"
          - "increments AmendmentProposal.version by 1"
      - from: APPROVED
        to: RETURNED_FOR_REVISION
        trigger: "POST /amendment-proposals/{proposal_id}/reopen"
        actor: CouncilAdmin
        preconditions:
          - "parent CodeCycle.status IN {DELIBERATION, RULEMAKING} else ERR_CYCLE_STATE_INVALID"
          - "no AdoptionRule of this cycle has status IN {FILED, PUBLISHED, EFFECTIVE} else ERR_ADOPTION_RULE_STATE_INVALID"
        side_effects:
          - "CYCLE (APPROVED -> RETURNED_FOR_REVISION -> SCREENED -> ... -> APPROVED): revision_round += 1; analysis_status COMPLETE -> STALE"
          - "CASCADE L2: because analysis_status became STALE, every child ImpactAnalysis with status == ACCEPTED -> SUPERSEDED"
          - "CASCADE L3: because no ACCEPTED analysis remains, statewide_incremental_cost_cents / affected_permit_count / preliminary_benefit_cost_ratio / final_benefit_cost_ratio are cleared to null"
          - "CASCADE L4: because the certified cost was cleared, CodeCycle.approved_incremental_cost_cents -= the cleared statewide_incremental_cost_cents, CodeCycle.approved_permit_backlog_count -= the cleared affected_permit_count, CodeCycle.approved_proposal_count -= 1"
          - "CASCADE L5: because the cycle backlog changed, every AdoptionRule of the cycle with status == DRAFT recomputes projected_permit_backlog, transition_grace_days, notice_days, effective_date, transition_cutoff_date, prior_code_expiry_date (base_date unchanged)"
          - "CASCADE L6: because the compound RULEMAKING gate no longer holds, CodeCycle RULEMAKING -> DELIBERATION"
          - "increments AmendmentProposal.version, CodeCycle.version and each recomputed AdoptionRule.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /amendment-proposals/{proposal_id}/screening {decision: WITHDRAW}"
        actor: TechnicalStaff
        preconditions: ["parent CodeCycle.status IN {INTAKE_OPEN, INTAKE_CLOSED, DELIBERATION} else ERR_CYCLE_STATE_INVALID"]
        side_effects: ["increments AmendmentProposal.version by 1"]
      # -- dimension 2: analysis_status
      - from: PENDING
        to: PARTIAL
        trigger: "POST /impact-analyses/{analysis_id}/review {decision: ACCEPT} — first ACCEPTED analysis"
        actor: CouncilAdmin
        preconditions: ["review_status IN {SCREENED, COMMENT_OPEN, COMMENT_CLOSED} else ERR_PROPOSAL_STAGE_INVALID"]
        side_effects:
          - "if the accepted analysis is COST_BENEFIT: computes statewide_incremental_cost_cents, copies affected_permit_count, computes preliminary_benefit_cost_ratio (PRELIMINARY variant)"
          - "analysis_status becomes COMPLETE instead of PARTIAL when energy_analysis_required == false and the accepted analysis is COST_BENEFIT"
          - "increments AmendmentProposal.version by 1"
        note: "Dimension 2 moves without touching review_status — the two dimensions are independent."
      - from: PARTIAL
        to: COMPLETE
        trigger: "POST /impact-analyses/{analysis_id}/review {decision: ACCEPT} — the second required analysis type is accepted"
        actor: CouncilAdmin
        preconditions: ["an ACCEPTED COST_BENEFIT analysis and (if energy_analysis_required) an ACCEPTED ENERGY_IMPACT analysis both exist"]
        side_effects: ["increments AmendmentProposal.version by 1"]
      - from: COMPLETE
        to: STALE
        trigger: "POST /amendment-proposals/{proposal_id}/reopen"
        actor: CouncilAdmin
        preconditions: []
        side_effects: ["see the reopen cascade above"]
      - from: STALE
        to: PENDING
        trigger: "POST /amendment-proposals/{proposal_id}/screening {decision: ACCEPT_FOR_ANALYSIS} after a revision"
        actor: TechnicalStaff
        preconditions: []
        side_effects: ["increments AmendmentProposal.version by 1"]

  # ------------------------------------------------------------ ImpactAnalysis
  - entity: ImpactAnalysis
    initial_state: SUBMITTED
    terminal_states: [RETURNED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /impact-analyses/{analysis_id}/review {decision: ACCEPT}"
        actor: CouncilAdmin
        preconditions:
          - "X-User-ID != prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "parent AmendmentProposal.review_status IN {SCREENED, COMMENT_OPEN, COMMENT_CLOSED} else ERR_PROPOSAL_STAGE_INVALID"
        side_effects:
          - "sets reviewed_by_user_id"
          - "any other ImpactAnalysis of the same proposal with the same analysis_type and status == ACCEPTED -> SUPERSEDED"
          - "advances parent AmendmentProposal.analysis_status (dimension 2)"
          - "increments ImpactAnalysis.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /impact-analyses/{analysis_id}/review {decision: RETURN}"
        actor: CouncilAdmin
        preconditions: ["X-User-ID != prepared_by_user_id else ERR_SEGREGATION_OF_DUTIES"]
        side_effects: ["sets reviewed_by_user_id", "parent analysis_status unchanged", "increments ImpactAnalysis.version by 1"]
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system event: a newer analysis of the same analysis_type is ACCEPTED, or the parent proposal is reopened"
        actor: system
        preconditions: []
        side_effects: ["increments ImpactAnalysis.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system event: parent AmendmentProposal is reopened while this analysis is still under review"
        actor: system
        preconditions: []
        side_effects: ["increments ImpactAnalysis.version by 1"]

  # ------------------------------------------------------------------- Hearing
  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONVENED
        trigger: "POST /hearings/{hearing_id}/convene"
        actor: CouncilChair
        preconditions:
          - "current_utc >= scheduled_start else ERR_HEARING_NOT_STARTED"
          - "agenda_proposal_ids is non-empty else ERR_AGENDA_EMPTY"
          - "present_voting_count >= committee.quorum_required else ERR_QUORUM_NOT_MET"
          - "committee.status == SEATED else ERR_COMMITTEE_NOT_SEATED"
        side_effects:
          - "snapshots quorum_required_at_convene and present_voting_count; sets convened_at"
          - "increments Hearing.version by 1"
      - from: CONVENED
        to: ADJOURNED
        trigger: "POST /hearings/{hearing_id}/adjourn"
        actor: CouncilChair
        preconditions: []
        side_effects:
          - "sets adjourned_at"
          - "agenda proposals still in review_status COMMENT_CLOSED are left untouched and become eligible for a later hearing's agenda"
          - "increments Hearing.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: committee un-seats (SEATED -> FORMING) while the hearing has not convened"
        actor: system
        preconditions: []
        side_effects:
          - "agenda_proposal_ids is emptied so the listed proposals become eligible again"
          - "increments Hearing.version by 1"

  # --------------------------------------------------------------- AdoptionRule
  - entity: AdoptionRule
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /adoption-rules/{adoption_rule_id}/status {to_status: FILED}"
        actor: CouncilAdmin
        preconditions:
          - "parent CodeCycle.status == RULEMAKING else ERR_CYCLE_STATE_INVALID"
          - "CodeCycle.approved_proposal_count >= 1 else ERR_NO_APPROVED_AMENDMENTS"
        side_effects:
          - "VERSION PINNING: pinned_amendment_versions = { proposal.id: proposal.version } for every APPROVED proposal of the cycle"
          - "freezes approved_incremental_cost_cents_at_filing; schedule fields stop recomputing"
          - "sets filed_by_user_id from X-User-ID"
          - "increments AdoptionRule.version by 1"
      - from: FILED
        to: PUBLISHED
        trigger: "POST /adoption-rules/{adoption_rule_id}/status {to_status: PUBLISHED}"
        actor: CouncilAdmin
        preconditions:
          - "X-User-ID != filed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets published_by_user_id and published_at = current_utc (anchors LOCAL_FILING_WINDOW_DAYS and the appeal window)"
          - "increments AdoptionRule.version by 1"
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "POST /adoption-rules/{adoption_rule_id}/status {to_status: EFFECTIVE}"
        actor: CouncilAdmin
        preconditions:
          - "current_utc >= effective_date else ERR_EFFECTIVE_DATE_NOT_REACHED"
          - "CROSS-ENTITY AGGREGATE: calculations.statewide_training_readiness >= READINESS_THRESHOLD_PCT else ERR_TRAINING_READINESS_NOT_MET"
        side_effects:
          - "snapshots statewide_readiness_pct_at_effective"
          - "every other AdoptionRule of the same cycle with status == EFFECTIVE -> SUPERSEDED"
          - "parent CodeCycle RULEMAKING -> ADOPTED (bubble-up)"
          - "increments AdoptionRule.version and CodeCycle.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /adoption-rules/{adoption_rule_id}/status {to_status: WITHDRAWN}"
        actor: CouncilAdmin
        preconditions: []
        side_effects:
          - "records withdrawal_reason"
          - "increments AdoptionRule.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /adoption-rules/{adoption_rule_id}/status {to_status: WITHDRAWN}"
        actor: CouncilAdmin
        preconditions: []
        side_effects:
          - "records withdrawal_reason"
          - "CASCADE L2: because the rule is withdrawn, every TrainingSession with adoption_rule_id == this.id and status IN {SCHEDULED, ENROLLMENT_OPEN, ENROLLMENT_CLOSED, DELIVERED} -> CANCELLED (training delivered on a withdrawn edition no longer counts, so even a DELIVERED session is cancelled)"
          - "CASCADE L3: because those sessions were cancelled, every TrainingEnrollment on them with status IN {ENROLLED, ATTENDED, NO_SHOW} -> CANCELLED and each session's seats_available returns to seat_capacity while enrolled_count / attended_count / no_show_count return to 0"
          - "CASCADE L4: because those enrollments were cancelled, every Jurisdiction that had an affected enrollment recomputes compliance_pct_enrollment_basis and compliance_pct_attendance_basis (both fall to 0.00 when the withdrawn rule carried all of its training)"
          - "CASCADE L5: because the recomputed compliance_pct_attendance_basis fell below READINESS_THRESHOLD_PCT, that Jurisdiction.enforcement_readiness -> NOT_READY"
          - "FAN-OUT (not part of the chain above): every LocalAmendment with adoption_rule_id == this.id and status IN {SUBMITTED, UNDER_REVIEW, RETURNED, FILED_EFFECTIVE} -> VOIDED, and each affected Jurisdiction.effective_local_amendment_count is recomputed"
          - "FAN-OUT: every InterpretationRequest with adoption_rule_id == this.id and status IN {SUBMITTED, ASSIGNED, OPINION_DRAFTED} -> DECLINED with decline_reason 'underlying rule withdrawn'"
          - "increments AdoptionRule.version and every mutated child's version by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system event: a later AdoptionRule of the same cycle reaches EFFECTIVE"
        actor: system
        preconditions: []
        side_effects: ["increments AdoptionRule.version by 1"]

  # -------------------------------------------------------------- LocalAmendment
  - entity: LocalAmendment
    initial_state: SUBMITTED
    terminal_states: [FILED_EFFECTIVE, REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /local-amendments/{local_amendment_id}/review {decision: START_REVIEW}"
        actor: CouncilAdmin
        preconditions:
          - "CROSS-ENTITY: adoption_rule.status IN {PUBLISHED, EFFECTIVE} else ERR_ADOPTION_RULE_NOT_IN_FORCE"
        side_effects: ["sets reviewed_by_user_id", "increments LocalAmendment.version by 1"]
      - from: UNDER_REVIEW
        to: FILED_EFFECTIVE
        trigger: "POST /local-amendments/{local_amendment_id}/review {decision: ACCEPT}"
        actor: CouncilAdmin
        preconditions:
          - "stringency_direction != LESS_STRINGENT else ERR_LOCAL_LESS_STRINGENT_FORBIDDEN"
          - "filed_within_window == true else ERR_LOCAL_FILING_DEADLINE_PASSED"
          - "jurisdiction.local_authority_level IN {FULL, LIMITED} else ERR_LOCAL_AUTHORITY_ABSENT"
        side_effects:
          - "jurisdiction.effective_local_amendment_count += 1"
          - "increments LocalAmendment.version and Jurisdiction.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /local-amendments/{local_amendment_id}/review {decision: RETURN}"
        actor: CouncilAdmin
        preconditions: []
        side_effects: ["increments LocalAmendment.version by 1"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /local-amendments/{local_amendment_id}/resubmit"
        actor: JurisdictionOfficial
        preconditions:
          - "X-User-ID == jurisdiction_id else ERR_JURISDICTION_MISMATCH"
          - "revision_round < LOCAL_REVISION_ROUNDS_MAX else ERR_LOCAL_REVISION_ROUNDS_EXHAUSTED"
        side_effects:
          - "CYCLE: revision_round += 1; local_text / stringency_direction / justification replaced"
          - "filed_within_window is re-evaluated against current_utc"
          - "increments LocalAmendment.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /local-amendments/{local_amendment_id}/review {decision: REJECT}"
        actor: CouncilAdmin
        preconditions: []
        side_effects: ["increments LocalAmendment.version by 1"]
      - from: FILED_EFFECTIVE
        to: VOIDED
        trigger: "system event: adoption_rule PUBLISHED -> WITHDRAWN"
        actor: system
        preconditions: []
        side_effects:
          - "jurisdiction.effective_local_amendment_count -= 1"
          - "increments LocalAmendment.version and Jurisdiction.version by 1"

  # --------------------------------------------------------- InterpretationRequest
  - entity: InterpretationRequest
    initial_state: SUBMITTED
    terminal_states: [DECLINED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ASSIGNED
        trigger: "POST /interpretation-requests/{request_id}/actions {action: ASSIGN}"
        actor: CouncilAdmin
        preconditions:
          - "the assigned DisciplineCommittee belongs to adoption_rule.code_cycle_id else ERR_COMMITTEE_CYCLE_MISMATCH"
          - "adoption_rule.status IN {PUBLISHED, EFFECTIVE} else ERR_ADOPTION_RULE_NOT_IN_FORCE"
        side_effects: ["sets assigned_committee_id", "increments InterpretationRequest.version by 1"]
      - from: ASSIGNED
        to: OPINION_DRAFTED
        trigger: "POST /interpretation-requests/{request_id}/actions {action: ISSUE_OPINION}"
        actor: TechnicalStaff
        preconditions: ["opinion_text and binding_scope are present else ERR_INVALID_REQUEST"]
        side_effects: ["sets drafted_by_user_id, opinion_text, binding_scope", "increments InterpretationRequest.version by 1"]
      - from: OPINION_DRAFTED
        to: PUBLISHED
        trigger: "POST /interpretation-requests/{request_id}/actions {action: PUBLISH}"
        actor: CouncilAdmin
        preconditions:
          - "X-User-ID != drafted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "assigns opinion_number = 1 + the highest opinion_number ever assigned under the same adoption_rule_id; numbers are never reused, so a re-publication after an appeal receives a fresh number even though the appeal cleared the old one"
          - "sets published_by_user_id and published_at = current_utc"
          - "if supersedes_request_id is set and that request has status == PUBLISHED, that request -> SUPERSEDED (self-referential cascade)"
          - "increments InterpretationRequest.version by 1 (and the superseded request's version by 1)"
      - from: PUBLISHED
        to: ASSIGNED
        trigger: "POST /interpretation-requests/{request_id}/actions {action: APPEAL}"
        actor: JurisdictionOfficial
        preconditions:
          - "current_utc <= published_at + APPEAL_WINDOW_DAYS else ERR_APPEAL_WINDOW_EXPIRED"
          - "appeal_round < APPEAL_ROUNDS_MAX else ERR_APPEAL_ROUNDS_EXHAUSTED"
          - "jurisdiction_id is not null AND X-User-ID == jurisdiction_id else ERR_JURISDICTION_MISMATCH"
        side_effects:
          - "CYCLE: appeal_round += 1; opinion_text, binding_scope, drafted_by_user_id, published_by_user_id, published_at and opinion_number are cleared to null so the opinion must be re-drafted and re-published"
          - "increments InterpretationRequest.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /interpretation-requests/{request_id}/actions {action: DECLINE}"
        actor: CouncilAdmin
        preconditions: ["decline_reason is present else ERR_INVALID_REQUEST"]
        side_effects: ["increments InterpretationRequest.version by 1"]
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /interpretation-requests/{request_id}/actions {action: DECLINE}"
        actor: CouncilAdmin
        preconditions: ["decline_reason is present else ERR_INVALID_REQUEST"]
        side_effects: ["increments InterpretationRequest.version by 1"]
      - from: OPINION_DRAFTED
        to: DECLINED
        trigger: "system event: adoption_rule PUBLISHED -> WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: ["sets decline_reason 'underlying rule withdrawn'", "increments InterpretationRequest.version by 1"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: a later InterpretationRequest whose supersedes_request_id == this.id is PUBLISHED"
        actor: system
        preconditions: []
        side_effects: ["increments InterpretationRequest.version by 1"]

  # -------------------------------------------------------------- TrainingSession
  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ENROLLMENT_OPEN
        trigger: "POST /training-sessions/{training_session_id}/status {to_status: ENROLLMENT_OPEN}"
        actor: CouncilAdmin
        preconditions: ["adoption_rule.status IN {PUBLISHED, EFFECTIVE} else ERR_ADOPTION_RULE_NOT_IN_FORCE"]
        side_effects: ["increments TrainingSession.version by 1"]
      - from: ENROLLMENT_OPEN
        to: ENROLLMENT_CLOSED
        trigger: "POST /training-sessions/{training_session_id}/status {to_status: ENROLLMENT_CLOSED}"
        actor: CouncilAdmin
        preconditions: []
        side_effects: ["increments TrainingSession.version by 1"]
      - from: ENROLLMENT_CLOSED
        to: DELIVERED
        trigger: "POST /training-sessions/{training_session_id}/attendance"
        actor: CouncilAdmin
        preconditions:
          - "current_utc >= ends_at else ERR_SESSION_NOT_FINISHED"
          - "every record.enrollment_id belongs to this session and has status == ENROLLED else ERR_ENROLLMENT_STATE_INVALID"
        side_effects:
          - "each listed TrainingEnrollment -> ATTENDED or NO_SHOW; unlisted ENROLLED enrollments -> NO_SHOW"
          - "recomputes enrolled_count / attended_count / no_show_count / seats_available"
          - "each affected Jurisdiction recomputes compliance_pct_enrollment_basis, compliance_pct_attendance_basis and enforcement_readiness"
          - "increments TrainingSession.version, each enrollment's version and each Jurisdiction.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /training-sessions/{training_session_id}/status {to_status: CANCELLED} or system event: adoption_rule -> WITHDRAWN"
        actor: CouncilAdmin
        preconditions: []
        side_effects:
          - "child ENROLLED enrollments -> CANCELLED; seats_available returns to seat_capacity"
          - "each affected Jurisdiction recomputes compliance and enforcement_readiness"
          - "increments TrainingSession.version by 1"
      - from: ENROLLMENT_OPEN
        to: CANCELLED
        trigger: "POST /training-sessions/{training_session_id}/status {to_status: CANCELLED} or system event: adoption_rule -> WITHDRAWN"
        actor: CouncilAdmin
        preconditions: []
        side_effects:
          - "child ENROLLED enrollments -> CANCELLED; seats_available returns to seat_capacity"
          - "each affected Jurisdiction recomputes compliance and enforcement_readiness"
          - "increments TrainingSession.version by 1"
      - from: ENROLLMENT_CLOSED
        to: CANCELLED
        trigger: "POST /training-sessions/{training_session_id}/status {to_status: CANCELLED} or system event: adoption_rule -> WITHDRAWN"
        actor: CouncilAdmin
        preconditions: []
        side_effects:
          - "child ENROLLED enrollments -> CANCELLED; seats_available returns to seat_capacity"
          - "each affected Jurisdiction recomputes compliance and enforcement_readiness"
          - "increments TrainingSession.version by 1"
      - from: DELIVERED
        to: CANCELLED
        trigger: "system event: adoption_rule PUBLISHED -> WITHDRAWN (POST /training-sessions/{training_session_id}/status is rejected on a DELIVERED session with ERR_SESSION_STATE_INVALID — only the cascade may cancel it)"
        actor: system
        preconditions: []
        side_effects:
          - "child enrollments with status IN {ENROLLED, ATTENDED, NO_SHOW} -> CANCELLED; seats_available returns to seat_capacity; enrolled_count / attended_count / no_show_count return to 0"
          - "each affected Jurisdiction recomputes compliance on both bases and enforcement_readiness"
          - "increments TrainingSession.version by 1"

  # ----------------------------------------------------------- TrainingEnrollment
  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [CANCELLED]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /training-sessions/{training_session_id}/attendance with outcome ATTENDED"
        actor: CouncilAdmin
        preconditions: ["session.status == ENROLLMENT_CLOSED else ERR_SESSION_STATE_INVALID"]
        side_effects:
          - "session.attended_count += 1; enrolled_count -= 1 (seats_available unchanged — the seat stays consumed)"
          - "jurisdiction compliance recomputed on both bases"
          - "increments TrainingEnrollment.version by 1"
      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /training-sessions/{training_session_id}/attendance with outcome NO_SHOW or omission from records"
        actor: CouncilAdmin
        preconditions: ["session.status == ENROLLMENT_CLOSED else ERR_SESSION_STATE_INVALID"]
        side_effects:
          - "session.no_show_count += 1; enrolled_count -= 1 (seats_available unchanged)"
          - "jurisdiction compliance recomputed on both bases; the ENROLLMENT_BASIS numerator loses this attendee"
          - "increments TrainingEnrollment.version by 1"
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /training-enrollments/{enrollment_id}/cancel or system event: session -> CANCELLED"
        actor: JurisdictionOfficial
        preconditions:
          - "X-User-ID == jurisdiction_id else ERR_JURISDICTION_MISMATCH (skipped for the system cascade)"
          - "session.status IN {ENROLLMENT_OPEN, ENROLLMENT_CLOSED, SCHEDULED} else ERR_SESSION_STATE_INVALID"
        side_effects:
          - "COMPENSATION: session.enrolled_count -= 1 and seats_available += 1, restoring the seat ledger identity exactly"
          - "jurisdiction compliance recomputed on both bases"
          - "increments TrainingEnrollment.version and TrainingSession.version by 1"
      - from: ATTENDED
        to: CANCELLED
        trigger: "system event: session DELIVERED -> CANCELLED because adoption_rule PUBLISHED -> WITHDRAWN"
        actor: system
        preconditions: []
        side_effects:
          - "session.attended_count -= 1 and seats_available += 1"
          - "jurisdiction compliance recomputed on both bases; the ATTENDANCE_BASIS numerator loses this attendee, which is the only way a READY jurisdiction can fall back to NOT_READY"
          - "increments TrainingEnrollment.version by 1"
      - from: NO_SHOW
        to: CANCELLED
        trigger: "system event: session DELIVERED -> CANCELLED because adoption_rule PUBLISHED -> WITHDRAWN"
        actor: system
        preconditions: []
        side_effects:
          - "session.no_show_count -= 1 and seats_available += 1"
          - "jurisdiction compliance recomputed on both bases"
          - "increments TrainingEnrollment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: impact-analysis-create-stale-proposal
    parent_entity: AmendmentProposal
    write_endpoint: "POST /amendment-proposals/{proposal_id}/impact-analyses"
    occ_field: "expected_proposal_version"
    description: |
      Filing an ImpactAnalysis against an AmendmentProposal whose version has
      advanced since the client last read it is rejected. A newly ACCEPTED
      analysis of the same analysis_type legitimately supersedes the prior one
      and moves the proposal's analysis_status, so a writer holding a stale view
      of the proposal must re-read before filing.
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412

  - rule_id: local-amendment-create-stale-jurisdiction
    parent_entity: Jurisdiction
    write_endpoint: "POST /local-amendments"
    occ_field: "expected_jurisdiction_version"
    description: |
      Filing a LocalAmendment while carrying a stale Jurisdiction.version is
      rejected. A jurisdiction's filing set legitimately changes when another
      filing is accepted (effective_local_amendment_count moves), so the
      section-uniqueness decision must be made against a current read.
    error_id: ERR_STALE_JURISDICTION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: committee_assignment_by_discipline
    description: |
      Routes an AmendmentProposal to the DisciplineCommittee of its cycle whose
      `discipline` equals the proposal's `discipline`. Assignment is server-side;
      a client-supplied committee_id is ignored.
    trigger: "POST /amendment-proposals (create)"
    input_set: ["AmendmentProposal.code_cycle_id", "AmendmentProposal.discipline", "DisciplineCommittee rows of that cycle"]
    algorithm: aggregation
    formula: |
      candidates = DisciplineCommittee[code_cycle_id == p.code_cycle_id
                                       AND discipline == p.discipline
                                       AND status != DISSOLVED]
      if candidates is empty: reject with ERR_NO_COMMITTEE_FOR_DISCIPLINE
      committee_id = candidates[0].id          # (code_cycle_id, discipline) is unique, so |candidates| <= 1
    constants: {}
    precision: "n/a (identifier assignment)"

  - name: statewide_incremental_cost_rollup
    description: |
      Certifies the statewide first-cost of an amendment from the analyst's
      per-occupancy-class per-permit costs. Permits are indivisible, so the
      annual permit population is FIRST split into whole permits per occupancy
      class (round_half_up at the permit level), and only THEN multiplied by that
      class's per-permit cost. No residual reconciliation is performed: the sum of
      the rounded per-class permit counts is allowed to differ from
      affected_permit_count, and the certified cost is the sum of the exact
      per-class products. Rounding the money instead of the permits, or keeping
      fractional permits, both give a different answer.
    trigger: "POST /impact-analyses/{analysis_id}/review {decision: ACCEPT} on a COST_BENEFIT analysis"
    input_set: ["ImpactAnalysis.incremental_cost_by_occupancy", "ImpactAnalysis.affected_permit_count", "OCCUPANCY_PERMIT_SHARE"]
    algorithm: aggregation
    formula: |
      total_cents = 0
      for class_key in ORDER ["R3", "R2", "B", "A2"]:                  # fixed evaluation order
          share          = OCCUPANCY_PERMIT_SHARE[class_key]
          class_permits  = round_half_up(affected_permit_count * share, 0)   # WHOLE permits
          per_permit     = incremental_cost_by_occupancy[class_key]          # integer cents, 0 if key absent
          total_cents   += class_permits * per_permit                        # exact integer product
      statewide_incremental_cost_cents = total_cents                         # integer cents, no final rounding
    constants:
      OCCUPANCY_PERMIT_SHARE: { R3: 0.62, R2: 0.18, B: 0.12, A2: 0.08 }
    precision: "permit split: 0 decimal places, round_half_up; money: exact integer cents (no money rounding)"
    worked_example: |
      affected_permit_count = 2410,
      incremental_cost_by_occupancy = { R3: 42375, R2: 61250, B: 118900, A2: 97150 }
        R3: round_half_up(2410*0.62)=1494 -> 1494*42375 =  63,308,250
        R2: round_half_up(2410*0.18)= 434 ->  434*61250 =  26,582,500
        B : round_half_up(2410*0.12)= 289 ->  289*118900=  34,362,100
        A2: round_half_up(2410*0.08)= 193 ->  193*97150 =  18,749,950
      statewide_incremental_cost_cents = 143,002,800
      (fractional-permit arithmetic would yield 143,003,375 — a 575-cent divergence)

  - name: amendment_benefit_cost_ratio
    description: |
      Benefit-cost ratio of an amendment. Two variants over identical stored data:
      PRELIMINARY uses a flat statutory 15-year undiscounted horizon and is
      recorded when the COST_BENEFIT analysis is accepted; FINAL uses the
      analyst's measure life discounted at the state rate and is recomputed at
      the moment of the committee vote. Only FINAL is gated against BCR_FLOOR,
      and the gate compares the ROUNDED 2-decimal value.
    trigger: "PRELIMINARY: POST /impact-analyses/{analysis_id}/review ACCEPT (COST_BENEFIT). FINAL: POST /hearings/{hearing_id}/votes"
    input_set: ["ImpactAnalysis.annual_cost_savings_cents", "ImpactAnalysis.measure_life_years", "AmendmentProposal.statewide_incremental_cost_cents"]
    algorithm: threshold
    formula: |
      # ---- PRELIMINARY -------------------------------------------------------
      preliminary_benefit_cost_ratio =
          round_half_up( (annual_cost_savings_cents * PRELIM_HORIZON_YEARS)
                         / statewide_incremental_cost_cents , 2 )

      # ---- FINAL -------------------------------------------------------------
      annuity_factor = round_half_up(
          (1 - (1 + DISCOUNT_RATE) ** (-measure_life_years)) / DISCOUNT_RATE , 6 )
      final_benefit_cost_ratio =
          round_half_up( (annual_cost_savings_cents * annuity_factor)
                         / statewide_incremental_cost_cents , 2 )

      # ---- gate (FINAL only, on the rounded value) ---------------------------
      if final_benefit_cost_ratio < BCR_FLOOR: reject ERR_BENEFIT_COST_BELOW_FLOOR
      # statewide_incremental_cost_cents == 0 -> both ratios are null and the gate
      # is skipped (a zero-cost amendment is never blocked on cost-effectiveness)
    constants:
      PRELIM_HORIZON_YEARS: 15
      DISCOUNT_RATE: 0.03
      BCR_FLOOR: 1.00
    precision: "annuity_factor: 6 decimal places, round_half_up (intermediate is rounded before use); both ratios: 2 decimal places, round_half_up"
    variants:
      - name: PRELIMINARY
        when: "recorded on AmendmentProposal.preliminary_benefit_cost_ratio when the COST_BENEFIT analysis is ACCEPTED"
        difference: "flat 15-year multiplier; DISCOUNT_RATE and measure_life_years are ignored; never gated"
      - name: FINAL
        when: "recorded on AmendmentProposal.final_benefit_cost_ratio and VoteRecord.final_benefit_cost_ratio_at_vote at vote time"
        difference: "discounted annuity over measure_life_years at DISCOUNT_RATE; this is the only variant compared against BCR_FLOOR"
    worked_example: |
      cost = 143,002,800; annual_cost_savings_cents = 14,500,000; measure_life_years = 12
        PRELIMINARY: 14,500,000*15 / 143,002,800 = 1.520949... -> 1.52
        annuity_factor(12 @ 3%) = 9.954003993... -> 9.954004
        FINAL:       14,500,000*9.954004 / 143,002,800 = 1.009302... -> 1.01
      Same row, measure_life_years = 20: annuity_factor = 14.877475 -> FINAL = 1.51
      Floor boundary: annual_cost_savings_cents = 14,295,000, measure_life_years = 12
        raw = 0.995032... -> rounds to 1.00 -> PASSES (>= BCR_FLOOR)
      One notch lower: annual_cost_savings_cents = 14,223,000
        raw = 0.990021... -> rounds to 0.99 -> ERR_BENEFIT_COST_BELOW_FLOOR

  - name: docket_priority_score
    description: |
      Ranks comment-closed proposals for hearing agendas. Computed in two stages:
      base_docket_score is frozen when the comment window closes; the rank bonus
      is applied later, at agenda time, from the rank of the BASE score inside
      the eligible pool (never from the already-adjusted score, so the bonus can
      never feed back into the ordering).
    trigger: "base_docket_score: POST /amendment-proposals/{proposal_id}/comment-window {action: CLOSE}. docket_queue_rank + docket_priority_score: POST /hearings/{hearing_id}/agenda"
    input_set: ["AmendmentProposal.support_comment_count", "AmendmentProposal.oppose_comment_count", "AmendmentProposal.stringency_direction", "AmendmentProposal.statewide_incremental_cost_cents"]
    algorithm: weighted_scoring
    formula: |
      # ---- stage 1: base score (frozen at comment-window CLOSE) --------------
      decisive = support_comment_count + oppose_comment_count      # NEUTRAL comments excluded
      support_ratio = SUPPORT_RATIO_DEFAULT if decisive == 0
                      else round_half_up(support_comment_count / decisive, 4)
      stringency_points = STRINGENCY_POINTS[stringency_direction]
      cost_ratio  = 1 if statewide_incremental_cost_cents is null
                    else min(statewide_incremental_cost_cents / COST_POINTS_CAP_CENTS, 1)
      cost_points = round_half_up(1 - cost_ratio, 6)
      base_docket_score = round_half_up(
          (WEIGHT_SUPPORT    * support_ratio
         + WEIGHT_STRINGENCY * stringency_points
         + WEIGHT_COST       * cost_points) * 100 , 2)

      # ---- stage 2: rank + bonus (at agenda time) ---------------------------
      pool = agenda_selection.eligible_pool
      order pool by base_docket_score DESC, then created_at ASC
      docket_queue_rank = 1-indexed position in that order
      rank_adjustment   = RANK1_BONUS if docket_queue_rank == 1
                          else RANK2_BONUS if docket_queue_rank == 2
                          else 0.00
      docket_priority_score = round_half_up(base_docket_score + rank_adjustment, 2)
    constants:
      WEIGHT_SUPPORT: 0.45
      WEIGHT_STRINGENCY: 0.35
      WEIGHT_COST: 0.20
      STRINGENCY_POINTS: { MORE_STRINGENT: 1.00, NEUTRAL: 0.60, CLARIFYING: 0.40, LESS_STRINGENT: 0.20 }
      COST_POINTS_CAP_CENTS: 200000000
      SUPPORT_RATIO_DEFAULT: 0.5000
      RANK1_BONUS: 5.00
      RANK2_BONUS: 2.00
    precision: "support_ratio: 4 dp round_half_up; cost_points: 6 dp round_half_up; scores: 2 dp round_half_up"
    worked_example: |
      P1: support 7 / oppose 3 -> 0.7000; MORE_STRINGENT -> 1.00;
          cost 143,002,800 / 200,000,000 = 0.715014 -> cost_points 0.284986
          base = (0.45*0.7 + 0.35*1.00 + 0.20*0.284986)*100 = 72.19972 -> 72.20
      P2: support 4 / oppose 6 -> 0.4000; NEUTRAL -> 0.60; cost 40,000,000 -> cost_points 0.800000
          base = (0.18 + 0.21 + 0.16)*100 = 55.00
      Agenda: P1 rank 1 -> 77.20, P2 rank 2 -> 57.00

  - name: agenda_selection
    description: |
      Builds the ordered hearing agenda. A proposal may sit on only one live
      agenda at a time, so a proposal already listed on a SCHEDULED or CONVENED
      hearing is excluded; a CANCELLED or ADJOURNED hearing releases its items.
    trigger: "POST /hearings/{hearing_id}/agenda {mode: AUTO_FILL}"
    input_set: ["Hearing.committee_id", "AmendmentProposal rows", "Hearing rows"]
    algorithm: aggregation
    formula: |
      committee = DisciplineCommittee[hearing.committee_id]
      eligible_pool = AmendmentProposal[
            committee_id   == hearing.committee_id
        AND code_cycle_id  == committee.code_cycle_id
        AND review_status  == COMMENT_CLOSED
        AND analysis_status == COMPLETE
        AND id NOT IN (union of agenda_proposal_ids over Hearing rows
                       where id != hearing.id AND status IN {SCHEDULED, CONVENED}) ]
      if eligible_pool is empty: reject ERR_NO_ELIGIBLE_PROPOSALS
      order eligible_pool by base_docket_score DESC, created_at ASC
      agenda_proposal_ids = first AGENDA_MAX_ITEMS ids of that order
      then run docket_priority_score stage 2 over the SELECTED items
    constants:
      AGENDA_MAX_ITEMS: 8
    precision: "n/a (ordering)"

  - name: vote_tally_and_outcome
    description: |
      Tallies a committee ballot. Quorum is measured against SEATS
      (active voting members at the call, so recused members shrink the
      denominator), while the supermajority is measured against BALLOTS CAST FOR
      OR AGAINST (abstentions shrink that denominator but still count toward
      quorum). A NO ballot from any FIRE_SERVICE member vetoes a proposal that
      would relax the code, whatever the arithmetic says.
    trigger: "POST /hearings/{hearing_id}/votes"
    input_set: ["VoteRecord.ballots", "DisciplineCommittee.active_voting_member_count", "CommitteeMember.sector", "AmendmentProposal.stringency_direction"]
    algorithm: threshold
    formula: |
      voting_seats_at_call = committee.active_voting_member_count
      quorum_required      = ceil(voting_seats_at_call * QUORUM_NUMERATOR / QUORUM_DENOMINATOR)
      yes_count / no_count / abstain_count = counts over ballots
      cast_total   = yes_count + no_count + abstain_count
      absent_count = voting_seats_at_call - cast_total
      if cast_total < quorum_required: reject ERR_QUORUM_NOT_MET   # no VoteRecord is created

      decisive_total          = yes_count + no_count               # abstentions excluded here
      supermajority_required  = ceil(SUPERMAJORITY_RATIO * decisive_total)

      # ordered outcome branches — first match wins
      if stringency_direction == LESS_STRINGENT
         AND any ballot with ballot == NO belongs to a member with sector == FIRE_SERVICE:
             outcome = REJECTED, outcome_reason = FIRE_SERVICE_VETO
      elif yes_count <= no_count:
             outcome = REJECTED, outcome_reason = SIMPLE_MAJORITY_FAILED
      elif yes_count < supermajority_required:
             outcome = REJECTED, outcome_reason = SUPERMAJORITY_FAILED
      else:  outcome = APPROVED, outcome_reason = MAJORITY_APPROVED
    constants:
      QUORUM_NUMERATOR: 2
      QUORUM_DENOMINATOR: 3
      SUPERMAJORITY_RATIO: 0.60
    precision: "integer ballot counts; ceil() on both thresholds"
    worked_example: |
      6 active voting seats -> quorum_required = ceil(4) = 4
        4 YES / 2 NO             : cast 6, decisive 6, need ceil(3.6)=4, yes 4 -> APPROVED
        3 YES / 2 NO / 1 ABSTAIN : cast 6, decisive 5, need ceil(3.0)=3, yes 3 -> APPROVED
        2 YES / 1 NO             : cast 3 < 4                              -> ERR_QUORUM_NOT_MET
      9 active voting seats -> quorum_required = ceil(6) = 6
        5 YES / 4 NO             : decisive 9, need ceil(5.4)=6, yes 5      -> SUPERMAJORITY_FAILED
      LESS_STRINGENT proposal, 5 YES / 1 NO where the NO is FIRE_SERVICE    -> FIRE_SERVICE_VETO

  - name: adoption_schedule
    description: |
      Derives the rulemaking calendar. Three different operator families are
      chained: (1) the approved permit backlog is ANNUALIZED down to the
      statutory 60-day provisional review window with floor division,
      (2) that figure selects a transition grace TIER by lookup, and
      (3) the notice period CLAMPS the tier up to the statutory minimum.
      The annualization always uses PROVISIONAL_REVIEW_WINDOW_DAYS — never the
      notice period that this same calculation goes on to produce.
    trigger: "POST /adoption-rules (create) and re-run on every DRAFT AdoptionRule whenever CodeCycle.approved_permit_backlog_count changes"
    input_set: ["CodeCycle.approved_permit_backlog_count", "AdoptionRule.created_at"]
    algorithm: threshold
    formula: |
      base_date = created_at truncated to 00:00:00Z (never recomputed after creation)
      projected_permit_backlog = floor( approved_permit_backlog_count
                                        * PROVISIONAL_REVIEW_WINDOW_DAYS / DAYS_PER_YEAR )
      transition_grace_days = GRACE_DAYS_SMALL  if projected_permit_backlog <  BACKLOG_TIER_MEDIUM_MIN
                              GRACE_DAYS_MEDIUM if projected_permit_backlog <  BACKLOG_TIER_LARGE_MIN
                              GRACE_DAYS_LARGE  otherwise
      notice_days             = max(MIN_NOTICE_DAYS, transition_grace_days)
      effective_date          = base_date + notice_days days, at 00:00:00Z
      transition_cutoff_date  = effective_date
        # permit applications received AT or BEFORE transition_cutoff_date may finish
        # under the prior edition (inclusive boundary — contrast the comment window,
        # whose closes_at is exclusive)
      prior_code_expiry_date  = effective_date + PRIOR_CODE_PROJECT_WINDOW_DAYS days
    constants:
      PROVISIONAL_REVIEW_WINDOW_DAYS: 60
      DAYS_PER_YEAR: 365
      BACKLOG_TIER_MEDIUM_MIN: 500
      BACKLOG_TIER_LARGE_MIN: 5000
      GRACE_DAYS_SMALL: 90
      GRACE_DAYS_MEDIUM: 180
      GRACE_DAYS_LARGE: 365
      MIN_NOTICE_DAYS: 120
      PRIOR_CODE_PROJECT_WINDOW_DAYS: 365
    precision: "floor() on the annualization; whole days on all date arithmetic; all derived instants at 00:00:00Z"
    worked_example: |
      base_date 2026-08-01T00:00:00Z, approved_permit_backlog_count = 2410
        projected = floor(2410*60/365) = floor(396.16) = 396  -> tier SMALL  -> grace  90
        notice_days = max(120, 90) = 120
        effective_date = 2026-11-29T00:00:00Z, transition_cutoff_date = 2026-11-29T00:00:00Z
        prior_code_expiry_date = 2027-11-29T00:00:00Z
      Tier boundary: backlog 3041 -> floor(499.89) = 499 -> SMALL  -> grace  90 -> notice 120
                     backlog 3042 -> floor(500.05) = 500 -> MEDIUM -> grace 180 -> notice 180
      Clamp: only a MEDIUM or LARGE tier ever escapes MIN_NOTICE_DAYS

  - name: jurisdiction_training_compliance
    description: |
      Share of a jurisdiction's building officials trained on the new edition.
      Two variants over identical enrollment data: ENROLLMENT_BASIS credits every
      official who ever held a live seat (so a no-show still counts as "covered"),
      ATTENDANCE_BASIS credits only officials who actually attended. Only
      ATTENDANCE_BASIS drives enforcement_readiness and the EFFECTIVE gate.
    trigger: "any TrainingEnrollment create/cancel, POST /training-sessions/{training_session_id}/attendance, TrainingSession cancellation"
    input_set: ["TrainingEnrollment rows for the jurisdiction", "TrainingSession.status", "Jurisdiction.official_headcount"]
    algorithm: aggregation
    formula: |
      rows = TrainingEnrollment[ jurisdiction_id == j.id
                                AND attendee_role == BUILDING_OFFICIAL
                                AND session.status != CANCELLED ]

      enrollment_numerator = count of DISTINCT attendee_name in rows
                             with status IN {ENROLLED, ATTENDED, NO_SHOW}
      attendance_numerator = count of DISTINCT attendee_name in rows
                             with status == ATTENDED
      # CANCELLED enrollments are excluded from both numerators

      compliance_pct_enrollment_basis = min( round_half_up(
              100 * enrollment_numerator / official_headcount , 2), 100.00)
      compliance_pct_attendance_basis = min( round_half_up(
              100 * attendance_numerator / official_headcount , 2), 100.00)

      enforcement_readiness = READY if compliance_pct_attendance_basis >= READINESS_THRESHOLD_PCT
                              else NOT_READY
    constants:
      READINESS_THRESHOLD_PCT: 80.00
    precision: "2 decimal places, round_half_up, then capped at 100.00"
    variants:
      - name: ENROLLMENT_BASIS
        when: "reported on Jurisdiction.compliance_pct_enrollment_basis (planning view)"
        difference: "numerator counts ENROLLED + ATTENDED + NO_SHOW; never gates anything"
      - name: ATTENDANCE_BASIS
        when: "reported on Jurisdiction.compliance_pct_attendance_basis and used for enforcement_readiness and statewide_training_readiness"
        difference: "numerator counts ATTENDED only; the two bases stay apart permanently once no-shows exist"
    worked_example: |
      official_headcount = 25, 21 distinct officials held seats, 19 attended, 2 no-showed
        ENROLLMENT_BASIS = 100*21/25 = 84.00  -> would read READY
        ATTENDANCE_BASIS = 100*19/25 = 76.00  -> enforcement_readiness = NOT_READY
      The 80.00 threshold sits between the two variants.

  - name: statewide_training_readiness
    description: |
      Population-weighted statewide readiness, evaluated at the moment an
      AdoptionRule is asked to go EFFECTIVE. EVERY Jurisdiction row is in the
      denominator — including one created moments earlier with no training at
      all — because enforcement begins statewide.
    trigger: "POST /adoption-rules/{adoption_rule_id}/status {to_status: EFFECTIVE}"
    input_set: ["Jurisdiction.population", "Jurisdiction.compliance_pct_attendance_basis"]
    algorithm: aggregation
    formula: |
      rows = all Jurisdiction rows (no filter)
      if rows is empty or sum(population) == 0: statewide_pct = 0.00
      else: statewide_pct = round_half_up(
              sum(population_j * compliance_pct_attendance_basis_j) / sum(population_j) , 2)
      if statewide_pct < READINESS_THRESHOLD_PCT: reject ERR_TRAINING_READINESS_NOT_MET
      else: AdoptionRule.statewide_readiness_pct_at_effective = statewide_pct
    constants:
      READINESS_THRESHOLD_PCT: 80.00
    precision: "products kept at full precision; final value 2 decimal places, round_half_up"
    worked_example: |
      J1 population 1,200,000 at 76.00 and J2 population 300,000 at 100.00
        (1,200,000*76.00 + 300,000*100.00) / 1,500,000 = 121,200,000 / 1,500,000 = 80.80 -> EFFECTIVE allowed
      Add J3 population 500,000 at 0.00
        121,200,000 / 2,000,000 = 60.60 -> ERR_TRAINING_READINESS_NOT_MET

  - name: session_seat_ledger
    description: |
      Conserved quantity on TrainingSession. Attendance marking moves a seat
      between buckets without releasing it; only cancellation releases a seat.
      The identity below must hold after every write that touches the session.
    trigger: "TrainingEnrollment create, POST /training-enrollments/{enrollment_id}/cancel, POST /training-sessions/{training_session_id}/attendance, session cancellation"
    input_set: ["TrainingSession.seat_capacity", "child TrainingEnrollment statuses"]
    algorithm: aggregation
    formula: |
      INVARIANT: seat_capacity
                 == seats_available + enrolled_count + attended_count + no_show_count
      enroll   : enrolled_count += 1, seats_available -= 1
      attend   : enrolled_count -= 1, attended_count += 1, seats_available unchanged
      no-show  : enrolled_count -= 1, no_show_count  += 1, seats_available unchanged
      cancel   : enrolled_count -= 1, seats_available += 1   (full compensation)
      Enrolling when seats_available == 0 -> ERR_SESSION_FULL
    constants: {}
    precision: "integer seats; the invariant is exact — no drift is tolerated after any sequence of writes"

  - name: cycle_cost_ledger
    description: |
      Conserved quantities on CodeCycle. The rollup must equal a fresh sum over
      the cycle's APPROVED proposals at all times, including after a reopen has
      compensated an approval away.
    trigger: "AmendmentProposal entering or leaving review_status APPROVED"
    input_set: ["AmendmentProposal.review_status", "AmendmentProposal.statewide_incremental_cost_cents", "AmendmentProposal.affected_permit_count"]
    algorithm: aggregation
    formula: |
      INVARIANT A: approved_incremental_cost_cents
                   == sum(statewide_incremental_cost_cents) over
                      AmendmentProposal[code_cycle_id == cycle.id AND review_status == APPROVED]
      INVARIANT B: approved_permit_backlog_count
                   == sum(affected_permit_count) over the same set
      INVARIANT C: approved_proposal_count == |that set|
      on APPROVE: add the proposal's certified figures
      on reopen from APPROVED: subtract exactly the figures that were added,
        then clear them on the proposal (compensation must leave no residue —
        a cycle whose last approval is reopened returns to 0 / 0 / 0)
    constants: {}
    precision: "integer cents and integer permits; exact reconciliation required"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first violated rule is the only error reported)
# =============================================================================
validations:

  # ---- P1..P3 authentication / authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID header present and non-empty AND X-Role header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Checked before anything else, including before the request body is parsed."
  - priority: 2
    category: auth
    check: "X-Role is one of the endpoint's authorized_roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
    description: "Role-level gate; precedes every existence check, so an unauthorized role probing a random id still gets 403, never 404."
  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID resolves to a live row of the backing entity (CommitteeMember for CommitteeMember/CouncilChair, Jurisdiction for JurisdictionOfficial)"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: ["all endpoints whose authorized_roles include CommitteeMember, CouncilChair or JurisdictionOfficial"]
    description: "Identity resolution failure is an authorization problem, not a 404."

  # ---- P4..P5 request shape ------------------------------------------------
  - priority: 4
    category: validation
    check: "body matches the endpoint schema: required fields present, types correct, enum members valid, numeric ranges honored, datetimes ISO-8601 UTC, and every declared interval satisfies end > start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
    description: "Includes cycle_year 2020..2050, voting_seat_count 3..12, measure_life_years 1..40, seat_capacity >= 1, official_headcount >= 1, affected_permit_count >= 0, occupancy keys drawn from OCCUPANCY_PERMIT_SHARE, and per-analysis-type required-field sets."
  - priority: 5
    category: validation
    check: "limit within 1..100 and offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: ["all list endpoints"]
    description: "limit defaults to 10 and offset to 0 when omitted."

  # ---- P6..P7 existence ----------------------------------------------------
  - priority: 6
    category: existence
    check: "every id in the request path resolves to a live row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["all endpoints with a path parameter"]
    description: "Outer path segments are resolved before inner ones (cycle before committee before member)."
  - priority: 7
    category: existence
    check: "every foreign key supplied in the body resolves to a live row, and nested path ancestry is consistent (a child id must belong to the parent id in the path)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /amendment-proposals", "POST /hearings", "POST /adoption-rules", "POST /local-amendments", "POST /interpretation-requests", "POST /training-sessions", "POST /training-sessions/{training_session_id}/enrollments", "POST /hearings/{hearing_id}/votes", "POST /interpretation-requests/{request_id}/actions"]
    description: "A committee_id that exists but belongs to a different cycle is a P15 referential error, not a 404."

  # ---- P8..P9 ownership ----------------------------------------------------
  - priority: 8
    category: auth
    check: "for JurisdictionOfficial, X-User-ID equals the jurisdiction_id of the resource being written (LocalAmendment.jurisdiction_id, TrainingEnrollment.jurisdiction_id, InterpretationRequest.jurisdiction_id)"
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 403
    applies_to: ["POST /local-amendments", "POST /local-amendments/{local_amendment_id}/resubmit", "POST /training-sessions/{training_session_id}/enrollments", "POST /training-enrollments/{enrollment_id}/cancel", "POST /interpretation-requests/{request_id}/actions"]
    description: "One jurisdiction may not act on another jurisdiction's filings, enrollments or appeals."
  - priority: 9
    category: auth
    check: "for CouncilChair, X-User-ID resolves to a CommitteeMember with is_chair == true, status == ACTIVE and committee_id == the hearing's committee_id"
    error_id: ERR_NOT_COMMITTEE_CHAIR
    http_status: 403
    applies_to: ["POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/adjourn", "POST /hearings/{hearing_id}/votes"]
    description: "The chair of another committee holds the CouncilChair role but cannot preside here."

  # ---- P10 optimistic concurrency -----------------------------------------
  - priority: 10
    category: concurrency
    check: "expected_proposal_version equals AmendmentProposal.version / expected_jurisdiction_version equals Jurisdiction.version"
    error_id: "ERR_STALE_PROPOSAL_VERSION | ERR_STALE_JURISDICTION_VERSION"
    http_status: 412
    applies_to: ["POST /amendment-proposals/{proposal_id}/impact-analyses", "POST /local-amendments"]
    description: "PRIORITY PAIR 1 vs P11: a stale expected_proposal_version on a proposal whose review_status also forbids analysis returns ERR_STALE_PROPOSAL_VERSION, not the state error."

  # ---- P11..P12 state ------------------------------------------------------
  - priority: 11
    category: state
    check: "the target entity's own current state permits the requested transition (see §1.2)"
    error_id: "ERR_CYCLE_STATE_INVALID | ERR_PROPOSAL_STATE_INVALID | ERR_ANALYSIS_STATE_INVALID | ERR_HEARING_STATE_INVALID | ERR_ADOPTION_RULE_STATE_INVALID | ERR_LOCAL_AMENDMENT_STATE_INVALID | ERR_INTERPRETATION_STATE_INVALID | ERR_SESSION_STATE_INVALID | ERR_ENROLLMENT_STATE_INVALID"
    http_status: 409
    applies_to: ["all action and status endpoints"]
    description: "Also covers terminal-state lockdown and second-attempt idempotency failures."
  - priority: 12
    category: state
    check: "the state of a DIFFERENT entity that this operation depends on is acceptable"
    error_id: "ERR_CYCLE_STATE_INVALID | ERR_COMMITTEE_NOT_SEATED | ERR_ADOPTION_RULE_NOT_IN_FORCE | ERR_PROPOSAL_STAGE_INVALID | ERR_ANALYSIS_INCOMPLETE | ERR_LOCAL_AUTHORITY_ABSENT"
    http_status: 409
    applies_to: ["POST /amendment-proposals", "POST /amendment-proposals/{proposal_id}/screening", "POST /amendment-proposals/{proposal_id}/comment-window", "POST /amendment-proposals/{proposal_id}/comments", "POST /impact-analyses/{analysis_id}/review", "POST /hearings", "POST /adoption-rules/{adoption_rule_id}/status", "POST /local-amendments/{local_amendment_id}/review", "POST /training-sessions/{training_session_id}/status", "POST /interpretation-requests/{request_id}/actions"]
    description: "Cross-entity gates: intake requires an INTAKE_OPEN cycle, hearings require a SEATED committee, opening a comment window requires analysis_status COMPLETE, local filings and training require an in-force AdoptionRule."

  # ---- P13 segregation of duties ------------------------------------------
  - priority: 13
    category: business_safety
    check: "the acting X-User-ID differs from the user recorded for the paired earlier step (prepared_by_user_id / filed_by_user_id / drafted_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: ["POST /impact-analyses/{analysis_id}/review", "POST /adoption-rules/{adoption_rule_id}/status", "POST /interpretation-requests/{request_id}/actions"]
    description: "Evaluated after state so that a wrongly-staged request reports the state problem first."

  # ---- P14 business safety -------------------------------------------------
  - priority: 14
    category: business_safety
    check: "an approving vote may not relax a life-safety section: NOT (stringency_direction == LESS_STRINGENT AND code_section starts with a member of LIFE_SAFETY_SECTION_PREFIXES)"
    error_id: ERR_STRINGENCY_FLOOR_VIOLATION
    http_status: 422
    applies_to: ["POST /hearings/{hearing_id}/votes"]
    description: "PRIORITY PAIR 2 vs P18: a LESS_STRINGENT life-safety proposal whose FINAL benefit-cost ratio is also below BCR_FLOOR returns ERR_STRINGENCY_FLOOR_VIOLATION, not ERR_BENEFIT_COST_BELOW_FLOOR. LIFE_SAFETY_SECTION_PREFIXES = ['9', '10']."
  - priority: 14
    category: business_safety
    check: "a local amendment may not be less stringent than the state rule"
    error_id: ERR_LOCAL_LESS_STRINGENT_FORBIDDEN
    http_status: 422
    applies_to: ["POST /local-amendments/{local_amendment_id}/review"]
    description: "Stringency limit on delegated local authority; checked at ACCEPT, not at intake."
  - priority: 14
    category: business_safety
    check: "ballots cast (YES + NO + ABSTAIN) >= committee.quorum_required"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: ["POST /hearings/{hearing_id}/votes", "POST /hearings/{hearing_id}/convene"]
    description: "No VoteRecord row is created when quorum fails."

  # ---- P15 business referential -------------------------------------------
  - priority: 15
    category: business_referential
    check: "the referenced row exists but is attached to the wrong graph position"
    error_id: "ERR_PROPOSAL_NOT_ON_AGENDA | ERR_COMMITTEE_CYCLE_MISMATCH | ERR_BALLOT_MEMBER_NOT_ON_COMMITTEE | ERR_NO_COMMITTEE_FOR_DISCIPLINE | ERR_ENROLLMENT_SESSION_MISMATCH"
    http_status: 409
    applies_to: ["POST /hearings/{hearing_id}/votes", "POST /interpretation-requests/{request_id}/actions", "POST /amendment-proposals", "POST /training-sessions/{training_session_id}/attendance"]
    description: "PRIORITY PAIR 3 vs P17: a duplicate ballot for a member who is not even on the committee returns ERR_BALLOT_MEMBER_NOT_ON_COMMITTEE, not ERR_DUPLICATE_BALLOT."
  - priority: 15
    category: business_referential
    check: "jurisdiction.local_authority_level != NONE when a local amendment is filed"
    error_id: ERR_LOCAL_AUTHORITY_ABSENT
    http_status: 409
    applies_to: ["POST /local-amendments", "POST /local-amendments/{local_amendment_id}/review"]
    description: "A jurisdiction with no delegated authority cannot file at all — this outranks the duplicate-section constraint at P17."

  # ---- P16 business temporal ----------------------------------------------
  - priority: 16
    category: business_temporal
    check: "comment window: OPEN requires closes_at - opens_at >= COMMENT_MIN_DAYS; a comment requires comment_opens_at <= current_utc < comment_closes_at (half-open, closes_at EXCLUSIVE); CLOSE requires current_utc >= comment_closes_at; an extension requires comment_extension_count < COMMENT_EXTENSIONS_MAX"
    error_id: "ERR_COMMENT_PERIOD_TOO_SHORT | ERR_COMMENT_WINDOW_CLOSED | ERR_COMMENT_WINDOW_STILL_OPEN"
    http_status: 409
    applies_to: ["POST /amendment-proposals/{proposal_id}/comment-window", "POST /amendment-proposals/{proposal_id}/comments"]
    description: "COMMENT_MIN_DAYS = 30 and the boundary is inclusive: exactly 30 days is accepted, 29 days 23:59:59 is not. A comment landing exactly at comment_closes_at is rejected."
  - priority: 16
    category: business_temporal
    check: "hearing scheduling: scheduled_start >= current_utc + HEARING_NOTICE_DAYS, and the interval [scheduled_start, scheduled_end) expanded by HEARING_BUFFER_MINUTES on both sides must not overlap another SCHEDULED or CONVENED hearing of the same committee"
    error_id: "ERR_HEARING_NOTICE_TOO_SHORT | ERR_HEARING_TIME_CONFLICT"
    http_status: 409
    applies_to: ["POST /hearings"]
    description: "HEARING_NOTICE_DAYS = 14 (inclusive), HEARING_BUFFER_MINUTES = 60. Half-open intervals: a gap of exactly 60 minutes is allowed, 59 minutes is not, and a back-to-back booking (gap 0) is not."
  - priority: 16
    category: business_temporal
    check: "training sessions in the same host jurisdiction may share an instant, but the seat capacity committed across every non-CANCELLED session overlapping the requested half-open interval [starts_at, ends_at) must satisfy sum(seat_capacity) <= jurisdiction.host_seat_capacity"
    error_id: "ERR_HOST_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: ["POST /training-sessions"]
    description: "Zero buffer here — deliberately different interval semantics from hearings. A session starting exactly when another ends does not overlap and never consumes shared capacity."
  - priority: 16
    category: business_temporal
    check: "clock-gated actions: convene requires current_utc >= scheduled_start; EFFECTIVE requires current_utc >= effective_date; attendance requires current_utc >= session.ends_at; an appeal requires current_utc <= published_at + APPEAL_WINDOW_DAYS; a local filing requires created_at <= adoption_rule.published_at + LOCAL_FILING_WINDOW_DAYS"
    error_id: "ERR_HEARING_NOT_STARTED | ERR_EFFECTIVE_DATE_NOT_REACHED | ERR_SESSION_NOT_FINISHED | ERR_APPEAL_WINDOW_EXPIRED | ERR_LOCAL_FILING_DEADLINE_PASSED"
    http_status: 409
    applies_to: ["POST /hearings/{hearing_id}/convene", "POST /adoption-rules/{adoption_rule_id}/status", "POST /training-sessions/{training_session_id}/attendance", "POST /interpretation-requests/{request_id}/actions", "POST /local-amendments/{local_amendment_id}/review"]
    description: "PRIORITY PAIR 1 vs P11: convening a CANCELLED hearing before its scheduled_start returns ERR_HEARING_STATE_INVALID (P11), not ERR_HEARING_NOT_STARTED. APPEAL_WINDOW_DAYS = 30 inclusive; LOCAL_FILING_WINDOW_DAYS = 90 inclusive."

  # ---- P17 business constraint --------------------------------------------
  - priority: 17
    category: business_constraint
    check: "uniqueness: (cycle_year, model_code_edition) on CodeCycle; (code_cycle_id, discipline) on DisciplineCommittee; Jurisdiction.name; (jurisdiction_id, adoption_rule_id, code_section) on LocalAmendment rows not in {REJECTED, VOIDED}; (training_session_id, attendee_name) on TrainingEnrollment rows not CANCELLED; one ballot per member_id within a VoteRecord; one VoteRecord per (hearing_id, proposal_id)"
    error_id: "ERR_DUPLICATE_CODE_CYCLE | ERR_DUPLICATE_COMMITTEE_DISCIPLINE | ERR_DUPLICATE_JURISDICTION | ERR_DUPLICATE_LOCAL_AMENDMENT | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_BALLOT | ERR_DUPLICATE_VOTE_RECORD"
    http_status: 409
    applies_to: ["POST /code-cycles", "POST /code-cycles/{code_cycle_id}/discipline-committees", "POST /jurisdictions", "POST /local-amendments", "POST /training-sessions/{training_session_id}/enrollments", "POST /hearings/{hearing_id}/votes"]
    description: "Uniqueness is scoped so that a REJECTED or VOIDED local filing frees its section again."
  - priority: 17
    category: business_constraint
    check: "capacity and round limits: seats_available >= 1 to enroll; at most one ACTIVE chair per committee; active voting members <= voting_seat_count; comment_extension_count < COMMENT_EXTENSIONS_MAX; appeal_round < APPEAL_ROUNDS_MAX; revision_round < LOCAL_REVISION_ROUNDS_MAX; agenda non-empty at convene; eligible pool non-empty at AUTO_FILL"
    error_id: "ERR_SESSION_FULL | ERR_CHAIR_ALREADY_SEATED | ERR_SEAT_LIMIT_EXCEEDED | ERR_COMMENT_EXTENSIONS_EXHAUSTED | ERR_APPEAL_ROUNDS_EXHAUSTED | ERR_LOCAL_REVISION_ROUNDS_EXHAUSTED | ERR_AGENDA_EMPTY | ERR_NO_ELIGIBLE_PROPOSALS"
    http_status: 409
    applies_to: ["POST /training-sessions/{training_session_id}/enrollments", "POST /discipline-committees/{committee_id}/members", "POST /amendment-proposals/{proposal_id}/comment-window", "POST /interpretation-requests/{request_id}/actions", "POST /local-amendments/{local_amendment_id}/resubmit", "POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/agenda"]
    description: "COMMENT_EXTENSIONS_MAX = 2, APPEAL_ROUNDS_MAX = 2, LOCAL_REVISION_ROUNDS_MAX = 2."

  # ---- P18 business fiscal -------------------------------------------------
  - priority: 18
    category: business_fiscal
    check: "final_benefit_cost_ratio (rounded to 2 dp) >= BCR_FLOOR before a vote may be recorded as APPROVED"
    error_id: ERR_BENEFIT_COST_BELOW_FLOOR
    http_status: 422
    applies_to: ["POST /hearings/{hearing_id}/votes"]
    description: "PRIORITY PAIR 2 vs P14 (see above). Skipped when statewide_incremental_cost_cents == 0."
  - priority: 18
    category: business_fiscal
    check: "statewide_training_readiness >= READINESS_THRESHOLD_PCT before enforcement begins"
    error_id: ERR_TRAINING_READINESS_NOT_MET
    http_status: 422
    applies_to: ["POST /adoption-rules/{adoption_rule_id}/status"]
    description: "Training rollout must precede enforcement; evaluated over every Jurisdiction row at the instant of the EFFECTIVE request."
  - priority: 18
    category: business_fiscal
    check: "a rule may only be filed when the cycle has at least one APPROVED amendment; a cycle may only enter RULEMAKING when no proposal is still open; a cycle may only be ABANDONED when it has no proposals"
    error_id: "ERR_NO_APPROVED_AMENDMENTS | ERR_PROPOSALS_UNRESOLVED"
    http_status: 422
    applies_to: ["POST /adoption-rules/{adoption_rule_id}/status", "POST /code-cycles/{code_cycle_id}/status"]
    description: "The RULEMAKING gate is compound: every proposal of the cycle must be APPROVED, REJECTED or WITHDRAWN."

# =============================================================================
# §1.5 API Endpoint Table
#
# api_prefix is "/" — every collection is a top-level path segment.
