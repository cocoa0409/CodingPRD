  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: lot_not_approved_precedes_lot_tons_insufficient
        grounds:
          - validations[priority=8]
          - validations[priority=20]
          - errors[ERR_LOT_NOT_APPROVED]
          - errors[ERR_LOT_TONS_INSUFFICIENT]
          - state_machines.CalcinerBatch.PLANNED_to_FEEDING
        distinguishing_aspect: |
          Category pair state (priority 8) vs business_fiscal (priority 20): one call violates both
          — the lot is still RECEIVED and the requested 500.000 t exceeds its 300.000 t remaining —
          and the response must be ERR_LOT_NOT_APPROVED (409), never ERR_LOT_TONS_INSUFFICIENT (409).
        test_recipe:
          setup:
            - "Plant GYP-1 registered."
            - "SYNTHETIC lot of 300.000 t received and NOT assayed, so status is RECEIVED and version is 1."
            - "Batch B1 PLANNED for the 2026-08-02 08:00-14:00 window at 40.0 tph."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 300.000, declared_free_moisture_pct: 9.50, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 230.000, calcination_temp_f: 320.0, feed_rate_tph: 40.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T14:00:00Z" }
              as: MaterialsController
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/calciner-batches/${b1_id}/feeds"
              payload: { lot_id: "${lot_id}", tons_fed: 500.000, measured_free_moisture_pct: 9.40, expected_lot_version: "${lot_v}" }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger response status == 409 and ${err_id} == ERR_LOT_NOT_APPROVED"
            - "${err_id} != ERR_LOT_TONS_INSUFFICIENT"
            - "GypsumLot.${lot_id}.status == RECEIVED and GypsumLot.${lot_id}.consumed_tons == 0.000"
            - "GypsumLot.${lot_id}.remaining_tons == 300.000 and GypsumLot.${lot_id}.version == 1"
            - "CalcinerBatch.${b1_id}.status == PLANNED and CalcinerBatch.${b1_id}.feed_tons_total == 0.000"
            - "GET /plant-ops/calciner-batches/${b1_id}/feeds returns total_count == 0"

