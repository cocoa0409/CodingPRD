              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. I Marchetti", provider_type: "PHYSICAL_THERAPIST", provider_license_number: "PT-2210" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["lower limb amputation"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_number: "V-0002", wheelchair_positions: 1, ambulatory_seats: 2, status: "IN_SERVICE" }
              as: AccessibilityOfficeAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T08:45:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { bk1: $.data.id }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:45:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { bk2: $.data.id }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:44:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { overlap_err: $.data.error_id }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:44:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: false }
              as: IntakeClerk
              captures: { bk4: $.data.id }
          assert:
            - "booking 1 (08:00-08:45, wheelchair) returns HTTP 201 with data.status == \"RESERVED\""
            - "booking 2 (08:45-09:00, wheelchair) returns HTTP 201 — adjacency where a.end == b.start is NOT an overlap even though the lane capacity is only 1"
            - "after booking 2 Vehicle.${veh_id}.open_wheelchair_reservations == 2 and open_ambulatory_reservations == 0"
            - "booking 3 (08:44-09:00, wheelchair) returns HTTP 409 with data.error_id == \"ERR_VEHICLE_WINDOW_CONFLICT\" (it overlaps both existing reservations: 2 + 1 > 1)"
            - "booking 3 does NOT return ERR_VEHICLE_NOT_ACCESSIBLE (wheelchair_positions is 1) and does NOT return ERR_PICKUP_WINDOW_LATE (end == the slot start)"
            - "booking 4 (08:44-09:00, ambulatory) returns HTTP 201 — the lanes are counted separately and ambulatory_seats is 2"
            - "after booking 4 Vehicle.${veh_id}.open_wheelchair_reservations == 2 and open_ambulatory_reservations == 1"
            - "GET /transportation-bookings?vehicle_id=${veh_id} returns total_count == 3"

  - rule_id: compensating_invariant
    instances:
      - name: vehicle_open_reservation_counter_restored_by_booking_cancel
        grounds:
          - state_machines.TransportationBooking.RESERVED_to_CANCELLED
          - entities.Vehicle.fields.open_wheelchair_reservations
          - calculations.vehicle_window_occupancy
          - endpoints.POST_/transportation-bookings/{id}/cancel
        distinguishing_aspect: |
          The conserved quantity is Vehicle.open_wheelchair_reservations, defined as the count of RESERVED
          bookings in the wheelchair lane. Creating a booking increments it to 1, cancelling restores it
          to exactly 0, and the released lane is provably free again because an identical-window rebooking
          that was refused while the first booking was RESERVED now succeeds. A CANCELLED booking must
          not keep occupying the lane and the counter must not drift to -1 or 2 on double cancel.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Applicant with a SCHEDULED FunctionalAssessment on the 2026-08-05T09:00:00Z slot"
            - "one IN_SERVICE Vehicle with wheelchair_positions 1 and ambulatory_seats 2 and no bookings, so open_wheelchair_reservations == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Cyrus Adeleke", date_of_birth: "1961-10-09", residence_zone: "IN_SERVICE_AREA", mobility_aid: "SCOOTER" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${rider_id}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 80, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { appn_id: $.data.id }
            - call: "POST /applications/${appn_id}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${appn_id}/verifications"
              payload: { provider_name: "Dr. J Sorensen", provider_type: "PHYSICIAN", provider_license_number: "MD-64003" }
              as: IntakeClerk
              captures: { ver_id: $.data.id }
            - call: "POST /applications/${appn_id}/verifications/${ver_id}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["severe COPD"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "Central Mobility Center", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applications/${appn_id}/assessments"
              payload: { slot_id: "${slot_id}", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { asmt_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vehicle_number: "V-0003", wheelchair_positions: 1, ambulatory_seats: 2, status: "IN_SERVICE" }
              as: AccessibilityOfficeAdmin
              captures: { veh_id: $.data.id }
            - call: "GET /vehicles/${veh_id}"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { wc_before: $.data.open_wheelchair_reservations }
          trigger:
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { bk1: $.data.id }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { while_held_err: $.data.error_id }
            - call: "POST /transportation-bookings/${bk1}/cancel"
              payload: { cancelled_reason: "Rider arranged their own ride" }
              as: IntakeClerk
              captures: { cancelled_status: $.data.status }
            - call: "POST /transportation-bookings"
              payload: { assessment_id: "${asmt_id}", vehicle_id: "${veh_id}", pickup_window_start: "2026-08-05T08:00:00Z", pickup_window_end: "2026-08-05T09:00:00Z", requires_wheelchair_position: true }
              as: IntakeClerk
              captures: { bk2: $.data.id }
          assert:
            - "before the trigger Vehicle.${veh_id}.open_wheelchair_reservations == 0"
            - "after booking 1 Vehicle.${veh_id}.open_wheelchair_reservations == 1"
            - "the duplicate-window booking while booking 1 is RESERVED returns HTTP 409 with data.error_id == \"ERR_VEHICLE_WINDOW_CONFLICT\" and does NOT change open_wheelchair_reservations"
            - "after the cancel TransportationBooking.${bk1}.status == \"CANCELLED\" and cancelled_reason == \"Rider arranged their own ride\""
            - "after the cancel Vehicle.${veh_id}.open_wheelchair_reservations == 0 — exactly the pre-booking value, not -1 and not 1"
            - "the identical rebooking after the cancel returns HTTP 201 with data.status == \"RESERVED\", proving the lane was really released"
            - "after the rebooking Vehicle.${veh_id}.open_wheelchair_reservations == 1 and open_ambulatory_reservations == 0"
            - "GET /transportation-bookings?vehicle_id=${veh_id} returns total_count == 2 (one CANCELLED, one RESERVED) while the counter counts only the RESERVED one"
            - "a second POST /transportation-bookings/${bk1}/cancel returns HTTP 409 with data.error_id == \"ERR_BOOKING_NOT_CANCELLABLE\" and leaves open_wheelchair_reservations == 1"

      - name: suspension_day_ledger_conserved_across_mid_service_rescind
        grounds:
          - calculations.suspension_day_ledger
          - calculations.suspension_duration_ladder
          - state_machines.SuspensionProceeding.ACTIVE_to_VOID
          - entities.Applicant.fields.suspension_days_ledger_total
          - entities.SuspensionProceeding.fields.days_served
          - entities.SuspensionProceeding.fields.days_forgiven
          - endpoints.POST_/suspension-proceedings/{id}/rescind
        distinguishing_aspect: |
          A different conserved quantity, Applicant.suspension_days_ledger_total, with a two-part
          invariant: per proceeding days_served + days_forgiven == duration_days, and per applicant the
          ledger total equals the sum of duration_days. Rescinding on day 3 of a 7-day suspension moves
          4 days from served to forgiven WITHOUT changing the total, so an implementation that decrements
          the ledger by the unserved balance (total 3) or that forgets days_forgiven (sum 3 != 7) breaks
          the invariant even though the visible service_status is right.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z during setup"
            - "one Applicant with three unexcused NO_SHOW TripEvents on 2026-06-01, 2026-06-15 and 2026-07-01 (points 6, misses 3, ratio 100.0), none of them excused"
            - "the auto-proposed SuspensionProceeding has had its notice sent by co-1 and the rider has responded, so it is RIDER_RESPONDED"
            - "prior_upheld_suspension_count is 0, so the ladder yields LADDER[0] == 7 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Ivy Castellanos", date_of_birth: "1968-03-16", residence_zone: "IN_SERVICE_AREA", mobility_aid: "NONE" }
              as: IntakeClerk
              captures: { rider_id: $.data.id }
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-06-01", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-06-15", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /trip-events"
              payload: { applicant_id: "${rider_id}", trip_date: "2026-07-01", event_type: "NO_SHOW" }
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "GET /applicants/${rider_id}/suspension-proceedings"
              payload: {}
              as: ConductOfficer
              captures: { prc_id: "$.data[0].id" }
            - call: "POST /suspension-proceedings/${prc_id}/send-notice"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-1"
            - call: "POST /suspension-proceedings/${prc_id}/respond"
              payload: { rider_response_note: "I acknowledge the missed trips" }
              as: Applicant
              as_user_id: "${rider_id}"
            - call: "GET /applicants/${rider_id}"
              payload: {}
              as: ConductOfficer
              captures: { ledger_before: $.data.suspension_days_ledger_total, priors_before: $.data.prior_upheld_suspension_count }
          trigger:
            - call: "POST /suspension-proceedings/${prc_id}/decide"
              payload: { decision: "UPHELD", suspension_start_date: "2026-09-01" }
              as: ConductOfficer
              as_user_id: "co-2"
              captures: { dur: $.data.duration_days, end_date: $.data.suspension_end_date }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /_ops/day-close"
              payload: {}
              as: AccessibilityOfficeAdmin
              captures: { advanced: $.data.proceedings_advanced_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /suspension-proceedings/${prc_id}/rescind"
              payload: {}
              as: ConductOfficer
              as_user_id: "co-1"
              captures: { void_status: $.data.status, served: $.data.days_served, forgiven: $.data.days_forgiven }
          assert:
            - "before the trigger Applicant.${rider_id}.suspension_days_ledger_total == 0 and prior_upheld_suspension_count == 0"
            - "the UPHELD decide returns HTTP 200 with data.status == \"UPHELD_PENDING\", duration_days == 7 (LADDER[min(0, 3)]) and suspension_end_date == \"2026-09-07\""
            - "immediately after the decide SuspensionProceeding.${prc_id}.days_served == 0 and days_forgiven == 7 (0 + 7 == duration_days)"
            - "immediately after the decide Applicant.${rider_id}.suspension_days_ledger_total == 7 and prior_upheld_suspension_count == 1"
            - "the day-close at 2026-09-01 returns proceedings_advanced_count == 1 and moves SuspensionProceeding.${prc_id} to \"ACTIVE\""
            - "while ACTIVE at clock 2026-09-01 days_served == 1, days_forgiven == 6 and Applicant.${rider_id}.service_status == \"SUSPENDED\""
            - "the rescind at clock 2026-09-03 returns HTTP 200 with data.status == \"VOID\""
            - "after the rescind SuspensionProceeding.${prc_id}.days_served == 3 (2026-09-01..2026-09-03 inclusive) and days_forgiven == 4"
            - "after the rescind days_served + days_forgiven == 7 == duration_days (invariant A holds)"
            - "after the rescind Applicant.${rider_id}.suspension_days_ledger_total == 7 — UNCHANGED by the rescind (invariant B holds)"
            - "after the rescind Applicant.${rider_id}.service_status == \"ACTIVE\" and prior_upheld_suspension_count == 1 (a VOID-after-upheld still counts toward the ladder)"
            - "a POST /_ops/day-close at clock 2026-09-08 leaves SuspensionProceeding.${prc_id} in \"VOID\" (a terminal state is never advanced to SERVED) and the ledger total at 7"
