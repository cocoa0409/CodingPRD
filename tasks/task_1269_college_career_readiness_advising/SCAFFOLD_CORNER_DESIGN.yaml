            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { ap1: $.data.id } }
            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "Tech C", program_type: "COLLEGE_2YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { ap2: $.data.id } }
            - { call: "GET /ccr/applications/${ap1}/milestones", as: Student, as_user_id: "${s}", captures: { m0: "$.data[0].id" } }
          trigger:
            - call: "POST /ccr/applications/${ap2}/milestones"
              payload: { kind: "INTERVIEW", due_at: "2026-06-01T00:00:00Z", depends_on_milestone_id: "${m0}" }
              as: Student
              as_user_id: "${s}"
              captures: { err: $.data.error_id }
          assert:
