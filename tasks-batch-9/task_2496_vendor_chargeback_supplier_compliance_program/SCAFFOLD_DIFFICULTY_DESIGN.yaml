  - rule_id: boundary_precision_check
    instances:
      - name: boundary_in_full_at_exactly_the_fill_tolerance_threshold
        grounds:
          - calculations.otif_scorecard_measurement
          - entities.Scorecard.fields.fill_tolerance_pct
          - entities.Scorecard.fields.in_full_count
          - endpoints[POST /compliance/scorecards/{id}/measure]
        distinguishing_aspect: |
          METRIC: the per-order fill-rate percentage against the in_full threshold
          (100.00 - fill_tolerance_pct = 98.00), tested on POST
          /compliance/scorecards/{id}/measure. One order lands EXACTLY on 98.00 and must count as
          in_full because the comparison is `>=`; a second order at 97.90 must not. An
          implementation using a strict `>` yields in_full_count 0, otif_pct 0.00 and composite
          49.18 - visibly different from the expected 1 / 50.00 / 69.18.
        test_recipe:
          setup:
            - "Vendor V-1201 with two purchase orders of 1000 ordered units each, must_arrive_by 2026-08-10 and 2026-08-11."
            - "PO-1 received 980 units on 2026-08-10 (fill 98.00, exactly on the threshold); PO-2 received 979 units on 2026-08-11 (fill 97.90, one notch under)."
            - "A DRAFT scorecard for 2026-08-01..2026-08-31 taking all three tolerance defaults (early 2, late 0, fill 2.00)."
