      - name: analyst_cannot_confirm_own_recorded_result
        claim_type: segregation_of_duties
        grounds: ["state_machines.TestSample.RESULT_RECORDED_to_CONFIRMED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties by X-User-ID: the recording analyst (lab-1) cannot confirm their own result (403 ERR_SEGREGATION_OF_DUTIES); a different analyst (lab-2) confirms successfully."
        test_recipe:
          setup: ["UNDER_EVALUATION product, ACTIVE plan (required 1), sample recorded at 0.10 by lab-1"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
