          assert:
            - "removal visit slot_need == 3; reserved 2 + 3 = 5 > 4: status 422 and error_id == ERR_WINDOW_CAPACITY_EXCEEDED"
            - "both visits occupy the same wall-clock window — rejection is purely aggregate arithmetic, not interval intersection"
            - "DeliveryWindow.${win_id}.reserved_slots remains 2"

      - name: team_window_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=12]
          - errors.ERR_WINDOW_TEAM_OVERLAP
        distinguishing_aspect: |
          Half-open interval-geometry semantics on the (store_id, team_id)
          timeline resource: a window [08:00, 12:00) rejects a same-team
          window starting 11:00 (positive-length intersection) but ADMITS one
          starting exactly 12:00 (adjacency, gap = 0, allowed because the
          interval is end-exclusive). Distinct semantics (geometric adjacency)
          from the sibling's aggregate capacity.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Store S; existing window for team T1 on 2026-09-02 [08:00, 12:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
