            - call: "POST /ticket-tiers/${cc_ttx_id}/sales"
              payload: { qty: 20 }
              as: TalentBuyer
            # ---- show Y ------------------------------------------------
            - call: "POST /shows"
              payload: { artist_id: "${cc_ary_id}", venue_id: "${cc_vn_id}", event_at: "2026-10-22T02:00:00.000Z", load_in_at: "2026-10-21T14:00:00.000Z", load_out_at: "2026-10-22T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
