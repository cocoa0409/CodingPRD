      - name: c_lot_auto_close_on_zero_available_via_assessment
        claim_type: valid_transition
        grounds:
          - "state_machines.FieldLot.BINNED_to_CLOSED"
          - "calculations.shrink_reconciliation"
        distinguishing_aspect: "An assessment whose cumulative_shrink_cwt exactly equals original_weight_cwt (boundary: <= constraint, equality allowed) drives available_cwt to 0 and auto-closes the lot."
        test_recipe:
          setup: ["BINNED lot of 100.00 cwt"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower O", grower_code: "G-O" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed CJ" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
          trigger:
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-01", us1_pct: 0.0, us2_pct: 0.0, cull_pct: 100.0, cumulative_shrink_cwt: 100.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "GET /potato-shed/field-lots/${l_id}", payload: {}, as: StorageManager, captures: { l_status: "$.data.storage_status", l_avail: "$.data.available_cwt" } }
          assert:
