scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: segment_cost_preliminary_versus_bid_ready_rounding_divergence
        grounds:
          - calculations.segment_construction_cost
          - calculations.segment_construction_cost.variants.PRELIMINARY
          - calculations.segment_construction_cost.variants.BID_READY
          - entities.RouteSegment.fields.preliminary_cost_cents
          - entities.RouteSegment.fields.bid_ready_cost_cents
          - entities.Route.fields.total_preliminary_cost_cents
          - entities.Route.fields.total_bid_ready_cost_cents
          - state_machines.RouteSegment.transitions.engineering_status_METHOD_SELECTED_to_DESIGN_LOCKED
        distinguishing_aspect: |
          This instance's two variants live in the RouteSegment COST domain and diverge purely on rounding
          granularity: PRELIMINARY rounds the whole 1250-foot length once (1971469) while BID_READY rounds each
          100-foot station block before summing (1971475), so the same segment carries two different cost figures
          six cents apart on the same row at the same instant.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' with topology_objective RING_CLOSURE and budget_authorized_cents 250000000, status PLANNING"
            - "one RouteSegment on that route: sequence_index 1, length_feet 1250, terrain_class URBAN_PAVED, street_name 'Ridge Ave', municipality_code 'MUN-014'"
            - "that segment has engineering_status WALKED because its only FieldWalkout is ACCEPTED with obstruction_count 0"
            - "no MoratoriumWindow rows exist at all, so the segment resolves to moratorium_class NONE"
            - "the route's current version has been read back so the OCC field can be supplied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 1250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-25", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "clear aerial span, no obstructions" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv1}" }
              as: RouteEngineer
              captures: { prelim: $.data.preliminary_cost_cents }
            - call: "POST /segments/${seg_id}/bid-ready-estimate"
              payload: {}
              as: RouteEngineer
              captures: { bidready: $.data.bid_ready_cost_cents }
          assert:
            - "RouteSegment.${seg_id}.preliminary_cost_cents == 1971469"
            - "RouteSegment.${seg_id}.bid_ready_cost_cents == 1971475"
            - "RouteSegment.${seg_id}.bid_ready_cost_cents - RouteSegment.${seg_id}.preliminary_cost_cents == 6"
            - "RouteSegment.${seg_id}.moratorium_class == NONE"
            - "RouteSegment.${seg_id}.restoration_cost_cents == 0"
            - "RouteSegment.${seg_id}.accepted_obstruction_count == 0"
            - "RouteSegment.${seg_id}.engineering_status == DESIGN_LOCKED"
            - "Route.${route_id}.total_preliminary_cost_cents == 1971469"
            - "Route.${route_id}.total_bid_ready_cost_cents == 1971475"

      - name: route_complexity_planned_versus_live_authority_mix
        grounds:
          - calculations.route_permitting_complexity_index
          - calculations.route_permitting_complexity_index.variants.PLANNED
          - calculations.route_permitting_complexity_index.variants.LIVE
          - entities.Route.fields.planned_complexity_index
          - entities.Route.fields.live_complexity_index
          - state_machines.Route.transitions.PLANNING_to_SCOPE_LOCKED
          - state_machines.PermitApplication.transitions.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          This instance's two variants live in the Route PERMITTING-RISK domain and diverge on INPUT SET, not on
          rounding: PLANNED sums the authority weights implied by terrain across all three segments (2500) while LIVE
          sums the filed applications weighted by their current status factor (3208), so the same route reports a
          different complexity index for the plan than for reality.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Trident Backbone', topology_objective EXPRESS_BACKBONE, budget_authorized_cents 400000000"
            - "three RouteSegments on it: seq 1 URBAN_PAVED 250 ft, seq 2 RAIL_CROSSING 300 ft, seq 3 HIGHWAY_CROSSING 400 ft"
            - "each of the three segments has an ACCEPTED FieldWalkout, so all three are engineering_status WALKED"
            - "the route is SCOPE_LOCKED, which froze planned_complexity_index and seeded live_complexity_index with the same value"
            - "three PermitApplications, one per segment: MUNICIPAL_ROW, RAILROAD and STATE_HIGHWAY, all three UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Trident Backbone", topology_objective: "EXPRESS_BACKBONE", target_in_service_date: "2027-06-01", budget_authorized_cents: 400000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20", existing_conduit_available: true }
              as: RouteEngineer
              captures: { seg1_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 2, street_name: "Depot Street", municipality_code: "MUN-014", length_feet: 300, terrain_class: "RAIL_CROSSING", planned_work_start_on: "2026-09-21", planned_work_end_on: "2026-09-28", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg2_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 3, street_name: "Highway 9 Shoulder", municipality_code: "MUN-014", length_feet: 400, terrain_class: "HIGHWAY_CROSSING", planned_work_start_on: "2026-09-29", planned_work_end_on: "2026-10-06", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg3_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg1_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: true, surveyor_note: "existing conduit usable" }
              as: FieldSurveyor
              captures: { wo1_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo1_id}", pole_tag: "P-101", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 1 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /walkouts"
              payload: { segment_id: "${seg2_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "rail crossing, bore required" }
              as: FieldSurveyor
              captures: { wo2_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo2_id}", pole_tag: "P-201", pole_owner: "ELECTRIC_UTILITY", condition_grade: "B", available_vertical_clearance_in: 44, existing_attachment_count: 3 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo2_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo2_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /walkouts"
              payload: { segment_id: "${seg3_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "highway shoulder bore" }
              as: FieldSurveyor
              captures: { wo3_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo3_id}", pole_tag: "P-301", pole_owner: "MUNICIPAL_LIGHT", condition_grade: "A", available_vertical_clearance_in: 50, existing_attachment_count: 0 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo3_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo3_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
              as: RouteEngineer
              captures: { planned_at_lock: $.data.planned_complexity_index }
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg1_id}", authority_type: "MUNICIPAL_ROW", authority_name: "City of Ridgefield DPW", work_window_start_on: "2026-09-15", work_window_end_on: "2026-09-20" }
              as: PermitCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /permit-applications/${p1_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg2_id}", authority_type: "RAILROAD", authority_name: "Northern Line Railway", work_window_start_on: "2026-09-21", work_window_end_on: "2026-09-28" }
              as: PermitCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /permit-applications/${p2_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /permit-applications"
              payload: { segment_id: "${seg3_id}", authority_type: "STATE_HIGHWAY", authority_name: "State DOT District 4", work_window_start_on: "2026-09-29", work_window_end_on: "2026-10-06" }
              as: PermitCoordinator
              captures: { p3_id: $.data.id }
            - call: "POST /permit-applications/${p3_id}/submit"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /permit-applications/${p2_id}/review"
              payload: { decision: "DENIED", decision_note: "flagging plan does not meet crossing standard" }
              as: AuthorityReviewer
              as_user_id: "rail-reviewer-1"
            - call: "POST /permit-applications/${p3_id}/review"
              payload: { decision: "APPROVED", decision_note: "shoulder bore approved" }
              as: AuthorityReviewer
              as_user_id: "dot-reviewer-1"
          assert:
            - "Route.${route_id}.planned_complexity_index == 2500"
            - "Route.${route_id}.live_complexity_index == 3208"
            - "Route.${route_id}.planned_complexity_index != Route.${route_id}.live_complexity_index"
            - "Route.${route_id}.segment_count == 3"
            - "Route.${route_id}.status == PERMITTING"
            - "PermitApplication.${p1_id}.status == UNDER_REVIEW"
            - "PermitApplication.${p2_id}.status == DENIED"
            - "PermitApplication.${p3_id}.status == APPROVED"
            - "RouteSegment.${seg1_id}.permit_status == PENDING"
            - "RouteSegment.${seg2_id}.permit_status == BLOCKED"
            - "RouteSegment.${seg3_id}.permit_status == CLEARED"

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bid_ready_station_block_rounding_order_pinned
        grounds:
          - calculations.segment_construction_cost
          - calculations.segment_restoration_cost
          - entities.RouteSegment.fields.restoration_cost_cents
          - entities.RouteSegment.fields.accepted_obstruction_count
          - entities.RouteSegment.fields.bid_ready_cost_cents
        distinguishing_aspect: |
          Combination mode (b): the BID_READY figure is a composition of four terms whose EVALUATION ORDER is pinned —
          per-100-foot-block rounding must happen before summation (11 * 426888 + 213444 = 4909212, whereas rounding
          the whole length once gives 4909206), and only then are the obstruction surcharge and the moratorium-derived
          restoration cost added; reordering the rounding site changes the answer.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Rural Spur South', topology_objective SPUR, budget_authorized_cents 100000000"
            - "one RouteSegment: sequence_index 1, length_feet 1150, terrain_class RURAL_SHOULDER, street_name 'County Road 12', municipality_code 'MUN-031', planned_work_start_on 2026-09-15"
            - "the segment's only FieldWalkout is ACCEPTED with obstruction_count 1, so accepted_obstruction_count is 1"
            - "no MoratoriumWindow rows exist, so moratorium_class resolves to NONE and the DIRECTIONAL_BORE / NONE restoration rate of 260 cents per foot applies"
            - "the route's current version has been read back so the OCC field can be supplied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Rural Spur South", topology_objective: "SPUR", target_in_service_date: "2027-04-15", budget_authorized_cents: 100000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "County Road 12", municipality_code: "MUN-031", length_feet: 1150, terrain_class: "RURAL_SHOULDER", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-30", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 1, conduit_available_confirmed: false, surveyor_note: "one culvert obstruction at station 400" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-401", pole_owner: "MUNICIPAL_LIGHT", condition_grade: "B", available_vertical_clearance_in: 46, existing_attachment_count: 1 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "DIRECTIONAL_BORE", expected_route_version: "${rv1}" }
              as: RouteEngineer
          trigger:
            - call: "POST /segments/${seg_id}/bid-ready-estimate"
              payload: {}
              as: RouteEngineer
              captures: { bidready: $.data.bid_ready_cost_cents }
          assert:
            - "RouteSegment.${seg_id}.moratorium_class == NONE"
            - "RouteSegment.${seg_id}.restoration_cost_cents == 299000"
            - "RouteSegment.${seg_id}.preliminary_cost_cents == 4909206"
            - "RouteSegment.${seg_id}.accepted_obstruction_count == 1"
            - "RouteSegment.${seg_id}.bid_ready_cost_cents == 5283212"
            - "the block-rounded construction subtotal inside 5283212 is 4909212 (= 11 * 426888 + 213444); an implementation that rounds once over the whole 1150 feet produces 4909206 and a total of 5283206, which MUST NOT be accepted"
            - "RouteSegment.${seg_id}.engineering_status == DESIGN_LOCKED"
            - "Route.${route_id}.total_bid_ready_cost_cents == 5283212"

      - name: make_ready_admin_fee_tier_keyed_on_pre_fee_subtotal
        grounds:
          - calculations.make_ready_cost_and_schedule
          - entities.PoleAttachmentApplication.fields.make_ready_items_subtotal_cents
          - entities.PoleAttachmentApplication.fields.make_ready_admin_fee_bp
          - entities.PoleAttachmentApplication.fields.make_ready_admin_fee_cents
          - entities.PoleAttachmentApplication.fields.make_ready_cost_cents
          - entities.MakeReadyItem.fields.extended_cost_cents
          - state_machines.PoleAttachmentApplication.transitions.SUBMITTED_to_MAKE_READY_ESTIMATED
        distinguishing_aspect: |
          Combination mode (c): the admin-fee tier is keyed on a quantity that LOOKS like the total but is pinned to the
          PRE-FEE subtotal — subtotal 456250 selects 1200 bp giving a total of 511000, whereas re-deriving the tier from
          that 511000 total selects 900 bp and yields 497313, which selects 1200 bp again; the calculation only converges
          because the scaffold pins the tier input to the subtotal.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE) with budget_authorized_cents 250000000"
            - "one RouteSegment: sequence_index 1, length_feet 250, terrain_class URBAN_PAVED"
            - "the segment's only FieldWalkout is ACCEPTED with a grade-A pole, so engineering_status is WALKED"
            - "one PoleAttachmentApplication on that segment: pole_owner TELCO (multiplier 10000 bp), pole_count 10, status SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "ten poles, all serviceable" }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "POST /pole-attachment-applications"
              payload: { segment_id: "${seg_id}", pole_owner: "TELCO", pole_count: 10 }
              as: PermitCoordinator
              captures: { paa_id: $.data.id }
            - call: "POST /pole-attachment-applications/${paa_id}/submit"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /pole-attachment-applications/${paa_id}/owner-response"
              payload: { outcome: "ESTIMATED", make_ready_items: [{ pole_tag: "P-001", work_class: "TRANSFER", quantity: 10 }, { pole_tag: "P-002", work_class: "CLEARANCE_TRIM", quantity: 1 }], owner_note: "ten transfers plus one trim" }
              as: PoleOwner
              as_user_id: "telco-owner-1"
              captures: { mr_cost: $.data.make_ready_cost_cents }
          assert:
            - "PoleAttachmentApplication.${paa_id}.status == MAKE_READY_ESTIMATED"
            - "PoleAttachmentApplication.${paa_id}.make_ready_items_subtotal_cents == 456250"
            - "PoleAttachmentApplication.${paa_id}.make_ready_admin_fee_bp == 1200"
            - "PoleAttachmentApplication.${paa_id}.make_ready_admin_fee_cents == 54750"
            - "PoleAttachmentApplication.${paa_id}.make_ready_cost_cents == 511000"
            - "PoleAttachmentApplication.${paa_id}.make_ready_days == 50"
            - "GET /pole-attachment-applications/${paa_id}/make-ready-items returns exactly 2 rows; the TRANSFER row has extended_cost_cents == 425000 and lead_days == 30, the CLEARANCE_TRIM row has extended_cost_cents == 31250 and lead_days == 15"
            - "keying the tier on the make_ready_cost_cents total (511000) instead of the subtotal would give make_ready_admin_fee_bp == 900, make_ready_admin_fee_cents == 41063 and make_ready_cost_cents == 497313, which MUST NOT be accepted"
            - "Route.${route_id}.budget_committed_cents == 0"

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: segment_parallel_dimensions_advance_independently
        grounds:
          - state_machines.RouteSegment
          - state_machines.RouteSegment.transitions.permit_status_NOT_REQUIRED_to_PENDING
          - state_machines.RouteSegment.transitions.engineering_status_METHOD_SELECTED_to_DESIGN_LOCKED
          - entities.RouteSegment.fields.engineering_status
          - entities.RouteSegment.fields.permit_status
          - state_machines.Route.transitions.SCOPE_LOCKED_to_PERMITTING
        distinguishing_aspect: |
          Non-linearity by PARALLEL DIMENSIONS on one row: the permit_status axis moves NOT_REQUIRED -> PENDING while the
          engineering_status axis stays pinned at DESIGN_LOCKED and bid_ready_cost_cents stays 394295, proving the two
          dimensions of the same RouteSegment are not a single linear enum.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Ridge Ring' (RING_CLOSURE), budget_authorized_cents 250000000"
            - "one RouteSegment: sequence_index 1, length_feet 250, terrain_class URBAN_PAVED"
            - "that segment is engineering_status DESIGN_LOCKED with construction_method AERIAL, preliminary_cost_cents 394294 and bid_ready_cost_cents 394295, and permit_status NOT_REQUIRED"
            - "the Route is SCOPE_LOCKED"
            - "one PermitApplication on the segment: MUNICIPAL_ROW, status DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Ridge Ring", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Ridge Ave", municipality_code: "MUN-014", length_feet: 250, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20", existing_conduit_available: false }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
