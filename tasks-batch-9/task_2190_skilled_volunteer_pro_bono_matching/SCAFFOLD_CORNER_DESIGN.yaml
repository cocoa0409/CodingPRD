# §1.9 Scaffold Corner Design — breadth test-targeting index for
# task_2190_skilled_volunteer_pro_bono_matching.
#
# Shared fixture literals used by every chain below (all timestamps are on the
# logical clock, whose startup default is exactly 2026-08-01T00:00:00Z):
#   PartnerOrg "Riverside Literacy Trust"  annual_budget_usd 3000000.00 -> MID / max 4
#   ProgramCycle "2026-Q4"                 [2026-08-01T00:00:00Z, 2026-12-01T00:00:00Z)
#   Volunteer "Dana Okafor"                SENIOR, rate 200.00, skill TAX_LAW prof 4
#   AvailabilityWindow                     [2026-08-01T00:00:00Z, 2026-11-01T00:00:00Z) HARD 200.00h
#   ScopeDefinition                        estimated_hours 40.00 x complexity 1.00 -> 40.00 reserved
#   Deliverables                           seq 1 weight 60.00, seq 2 weight 40.00
#   Derived winner score                   match_score 0.8990, expires_at 2026-08-06T00:00:00Z
# Opaque operator ids: ProgramManager "pm-1", ScopingSpecialist "spec-1",
# QualityReviewer "qr-1" / "qr-2". Nonexistent id literal: 00000000-0000-4000-8000-000000000000.

scaffold_corner_design:
  - section: entities
    instances:
      - name: create_partner_org_derives_capacity_class_and_seeds_defaults
        claim_type: creation
        grounds: [entities.PartnerOrg, "endpoints[POST /partner-orgs]", calculations.partner_capacity_class]
        distinguishing_aspect: "A 3,000,000.00 budget sits in the MID band [2000000.00, 10000000.00) so capacity_class is MID and max_concurrent_engagements is 4 in the very creation response; satisfaction_index is null (not 0.00) because satisfaction_sample_size is 0."
        test_recipe:
          setup: ["Empty database; logical clock pinned to its startup default."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
          assert:
            - "HTTP 201"
            - "data.capacity_class == \"MID\""
            - "data.max_concurrent_engagements == 4"
            - "data.open_engagement_count == 0"
            - "data.status == \"ACTIVE\""
            - "data.probation_reason == null"
            - "data.satisfaction_index == null"
            - "data.satisfaction_sample_size == 0"
            - "data.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present; response_type == \"object\""

      - name: get_partner_org_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds: [entities.PartnerOrg, "endpoints[GET /partner-orgs/{id}]"]
        distinguishing_aspect: "The read-back of a freshly created MICRO partner (budget 90000.00 < 250000.00) returns max_concurrent_engagements 1, proving capacity_class is persisted/derived per row rather than a constant."
        test_recipe:
          setup: ["One PartnerOrg with annual_budget_usd 90000.00 exists."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Harbor Arts Collective", contact_email: "admin@harborarts.example", sector: ARTS, annual_budget_usd: 90000.00}, captures: {micro_partner_id: "$.data.id"}}
          trigger:
            - {call: "GET /partner-orgs/${micro_partner_id}", as: ScopingSpecialist, as_user_id: "spec-1"}
          assert:
            - "HTTP 200"
            - "data.id == ${micro_partner_id}"
            - "data.name == \"Harbor Arts Collective\""
            - "data.sector == \"ARTS\""
            - "data.capacity_class == \"MICRO\""
            - "data.max_concurrent_engagements == 1"

      - name: list_project_requests_returns_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /project-requests]", response_envelope.pagination_fields]
        distinguishing_aspect: "With two requests on one partner and limit 1, total_count is 2 (the full filtered set) while the page carries exactly 1 row and has_more is true — total_count counts the filter result, not the page."
        test_recipe:
          setup: ["One partner, one cycle, two DRAFT ProjectRequest rows on that partner."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Donor CRM migration", discipline: TECHNOLOGY, required_skill_code: "CRM_ADMIN", min_proficiency: 2, requested_hours: 25.00, urgency: ROUTINE}}
          trigger:
            - {call: "GET /project-requests", as: ProgramManager, as_user_id: "pm-1", payload: {partner_org_id: "${partner_id}", limit: 1, offset: 0}}
          assert:
            - "HTTP 200"
            - "response_type == \"array\""
            - "meta/pagination reports total_count == 2, limit == 1, offset == 0, has_more == true"
            - "len(data) == 1"

      - name: list_engagements_with_limit_zero_returns_invalid_pagination
        claim_type: listing
        grounds: ["validations[priority=18]", "errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "limit == 0 is below the declared minimum of 1, so the list is rejected with ERR_INVALID_PAGINATION (400) rather than silently coerced to the default 10."
        test_recipe:
          setup: ["Empty database; no engagements are needed because pagination is checked before any query runs."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "GET /engagements", as: ProgramManager, as_user_id: "pm-1", payload: {limit: 0, offset: 0}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_PAGINATION\""

      - name: get_partner_org_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_PARTNER_ORG_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but unused UUID yields ERR_PARTNER_ORG_NOT_FOUND (404), not an empty 200 body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "GET /partner-orgs/00000000-0000-4000-8000-000000000000", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PARTNER_ORG_NOT_FOUND\""

      - name: recalculate_unknown_cycle_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_PROGRAM_CYCLE_NOT_FOUND]"]
        distinguishing_aspect: "The existence check on the path cycle precedes the sweep, so recalculate on an unknown cycle answers ERR_PROGRAM_CYCLE_NOT_FOUND and sweeps nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /program-cycles/00000000-0000-4000-8000-000000000000/recalculate", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PROGRAM_CYCLE_NOT_FOUND\""

      - name: match_unknown_project_request_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_PROJECT_REQUEST_NOT_FOUND]"]
        distinguishing_aspect: "Path existence (priority 5) beats the state check (priority 20) and the selector (priority 57): an unknown request id never reaches match_score."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /project-requests/00000000-0000-4000-8000-000000000000/match", as: ScopingSpecialist, as_user_id: "spec-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PROJECT_REQUEST_NOT_FOUND\""

      - name: add_deliverable_to_unknown_scope_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=6]", "errors[ERR_SCOPE_DEFINITION_NOT_FOUND]"]
        distinguishing_aspect: "The scope-revision existence check (priority 6) runs before the DRAFT state check (priority 21) and before the weight-total check (priority 47)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /scope-definitions/00000000-0000-4000-8000-000000000000/deliverables", as: ScopingSpecialist, as_user_id: "spec-1", payload: {title: "Findings memo", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "Board-ready memo with cited findings."}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_SCOPE_DEFINITION_NOT_FOUND\""

      - name: vet_unknown_volunteer_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=7]", "errors[ERR_VOLUNTEER_NOT_FOUND]"]
        distinguishing_aspect: "Vetting an unknown volunteer id answers ERR_VOLUNTEER_NOT_FOUND and stamps no credential_verified_at anywhere."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /volunteers/00000000-0000-4000-8000-000000000000/vet", as: ProgramManager, as_user_id: "pm-1", payload: {verify_skill_codes: ["TAX_LAW"]}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_VOLUNTEER_NOT_FOUND\""

      - name: accept_unknown_match_offer_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=8]", "errors[ERR_MATCH_OFFER_NOT_FOUND]"]
        distinguishing_aspect: "Offer existence (priority 8) precedes the OFFERED state check (priority 22) and the expiry check (priority 38)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /match-offers/00000000-0000-4000-8000-000000000000/accept", as: Volunteer, as_user_id: "00000000-0000-4000-8000-000000000001", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_MATCH_OFFER_NOT_FOUND\""

      - name: get_engagement_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=9]", "errors[ERR_ENGAGEMENT_NOT_FOUND]"]
        distinguishing_aspect: "Every /engagements/{id} path shares one existence rule, so a plain read of an unknown engagement is ERR_ENGAGEMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "GET /engagements/00000000-0000-4000-8000-000000000000", as: QualityReviewer, as_user_id: "qr-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_ENGAGEMENT_NOT_FOUND\""

      - name: send_unknown_agreement_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=10]", "errors[ERR_AGREEMENT_NOT_FOUND]"]
        distinguishing_aspect: "The agreement is addressed by its own id (not through the engagement), so an unknown agreement id is ERR_AGREEMENT_NOT_FOUND rather than ERR_ENGAGEMENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /agreements/00000000-0000-4000-8000-000000000000/send", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_AGREEMENT_NOT_FOUND\""

      - name: hold_unknown_milestone_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=11]", "errors[ERR_MILESTONE_NOT_FOUND]"]
        distinguishing_aspect: "Milestone existence (priority 11) precedes both the SCHEDULED check (priority 26) and the grace-window temporal check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /milestones/00000000-0000-4000-8000-000000000000/hold", as: ProgramManager, as_user_id: "pm-1", payload: {reported_cumulative_hours: 8.00}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_MILESTONE_NOT_FOUND\""

      - name: decide_unknown_scope_change_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=12]", "errors[ERR_SCOPE_CHANGE_NOT_FOUND]"]
        distinguishing_aspect: "ERR_SCOPE_CHANGE_NOT_FOUND is distinct from ERR_SCOPE_DEFINITION_NOT_FOUND: the change-request namespace is /scope-change-requests, not /scope-definitions."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /scope-change-requests/00000000-0000-4000-8000-000000000000/decide", as: ProgramManager, as_user_id: "pm-1", payload: {decision: "APPROVE"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_SCOPE_CHANGE_NOT_FOUND\""

      - name: score_unknown_quality_review_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=13]", "errors[ERR_QUALITY_REVIEW_NOT_FOUND]"]
        distinguishing_aspect: "Review existence (priority 13) precedes the OPEN-status check (priority 27) and the deliverable-set check (priority 48)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /quality-reviews/00000000-0000-4000-8000-000000000000/score", as: QualityReviewer, as_user_id: "qr-1", payload: {deliverable_scores: [{deliverable_id: "00000000-0000-4000-8000-000000000002", score: 4}]}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_QUALITY_REVIEW_NOT_FOUND\""

      - name: create_volunteer_missing_required_seniority_is_rejected
        claim_type: required_fields
        grounds: ["endpoints[POST /volunteers]", "validations[priority=17]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "seniority has source: input and no default, so omitting it is ERR_VALIDATION (422) — it must not fall back to ASSOCIATE."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, weekly_hours_cap: 20}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
            - "no Volunteer row is created: GET /volunteers/{any} for the omitted body returns nothing to read"

      - name: create_project_request_omitting_urgency_applies_routine_default
        claim_type: defaults
        grounds: [entities.ProjectRequest.fields.urgency, "endpoints[POST /project-requests]"]
        distinguishing_aspect: "urgency is the only optional body field on request creation; omitting it yields ROUTINE, which later selects OFFER_TTL_HOURS 120 and URGENCY_AVAILABILITY_WEIGHT 0.20."
        test_recipe:
          setup: ["One partner and one cycle exist."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00}}
          assert:
            - "HTTP 201"
            - "data.urgency == \"ROUTINE\""
            - "data.status == \"DRAFT\""
            - "data.rescope_count == 0"
            - "data.failed_match_rounds == 0"
            - "data.active_scope_revision_no == 0"
            - "data.closed_at == null"

      - name: create_volunteer_client_supplied_system_fields_are_input_ignored
        claim_type: system_fields
        grounds: [entities.Volunteer.fields.status, entities.Volunteer.fields.reliability_score, "endpoints[POST /volunteers]"]
        distinguishing_aspect: "status, credential_verified_at and reliability_score are source: system/computed; a body that tries to set status ACTIVE and reliability_score 1.0000 still yields PENDING_VETTING, null credential and the 0.7500 baseline."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20, status: "ACTIVE", reliability_score: 1.0000, credential_verified_at: "2026-07-01T00:00:00Z"}}
          assert:
            - "HTTP 201 (unknown system fields are ignored, not fatal)"
            - "data.status == \"PENDING_VETTING\""
            - "data.credential_verified_at == null"
            - "data.reliability_score == 0.7500"
            - "data.reliability_score_lifetime == 0.7500"
            - "data.lifetime_valued_usd == 0.00"
            - "data.version == 1"

      - name: create_partner_org_with_invalid_enum_sector_is_rejected
        claim_type: type_constraints
        grounds: [entities.PartnerOrg.fields.sector, "validations[priority=17]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "sector is closed over {HEALTH, EDUCATION, HOUSING, ENVIRONMENT, ARTS, CIVIC}; the out-of-set value SPORTS is ERR_VALIDATION (422), not a stored free-text sector."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: "SPORTS", annual_budget_usd: 3000000.00}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""

      - name: first_scope_revision_computes_revision_no_one_and_records_author
        claim_type: computed_fields
        grounds: [entities.ScopeDefinition.fields.revision_no, entities.ScopeDefinition.fields.authored_by_user_id, "endpoints[POST /project-requests/{id}/scope-definitions]"]
        distinguishing_aspect: "revision_no is max(sibling revision_no) + 1, so the first revision is 1 with supersedes_scope_id null, and authored_by_user_id is stamped from the caller X-User-ID (spec-1), never from the body."
        test_recipe:
          setup: ["One partner, one cycle, one ProjectRequest moved to SCOPING."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
            - {call: "POST /project-requests/${req_id}/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}", captures: {req_v: "$.data.version"}}
          trigger:
            - {call: "POST /project-requests/${req_id}/scope-definitions", as: ScopingSpecialist, as_user_id: "spec-1", payload: {expected_project_request_version: "${req_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: STANDARD, ip_disposition: ASSIGN_TO_PARTNER}}
          assert:
            - "HTTP 201"
            - "data.revision_no == 1"
            - "data.supersedes_scope_id == null"
            - "data.authored_by_user_id == \"spec-1\""
            - "data.status == \"DRAFT\""
            - "data.deliverable_count == 0"
