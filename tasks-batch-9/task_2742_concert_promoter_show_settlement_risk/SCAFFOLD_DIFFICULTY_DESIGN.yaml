              as_user_id: "acct-alice"
              captures: { inv_mkt_id: $.data.id }
            - call: "POST /vendor-invoices/${inv_mkt_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
            - call: "POST /vendor-invoices/${inv_mkt_id}/approve"
              payload: {}
