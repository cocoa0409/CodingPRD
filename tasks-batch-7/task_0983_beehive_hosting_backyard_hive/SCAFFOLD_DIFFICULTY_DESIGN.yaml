            - "captured ${net_b} == 9.980 (moisture 18.7: 10.000 * (0.1/100) * 2.0 = 0.020 penalty)"

      - name: removal_cooling_off_exact_24h_free
        grounds:
          - calculations.cancellation_fee
          - state_machines.RemovalJob.REQUESTED_to_CANCELLED
        distinguishing_aspect: |
          Metric: elapsed hours since requested_at, via POST /api/removal-jobs/{id}/cancel.
          Exactly 24h is free (inclusive boundary, fee 0); 24h and 1 minute incurs the full
          7500-cent fee. Two removals on the same hive exercised sequentially.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver signed at default clock 2026-05-01T00:00:00Z; site/agreement/hive in place; no subscription (balance 0)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Eighteen", email: "h18@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "18 Magnolia Ave", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv}", reason: "RELOCATION" }, as: Host, as_user_id: "${h}", captures: { rj1: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/removal-jobs/${rj1}/cancel", payload: {}, as: Host, as_user_id: "${h}", captures: { fee1: $.data.cancellation_fee_cents, st1: $.data.status } }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv}", reason: "NUISANCE" }, as: Host, as_user_id: "${h}", captures: { rj2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:01:00Z" }, as: PlatformOps }
            - { call: "POST /api/removal-jobs/${rj2}/cancel", payload: {}, as: Host, as_user_id: "${h}", captures: { fee2: $.data.cancellation_fee_cents, st2: $.data.status } }
          assert:
            - "captured ${st1} == CANCELLED and ${fee1} == 0 (exactly requested_at + 24h is inside the free window, inclusive)"
            - "captured ${st2} == CANCELLED and ${fee2} == 7500 (24h 1m elapsed — one minute past the boundary flips the fee)"
            - "RemovalJob.${rj2} creation succeeded only because ${rj1} was already CANCELLED (one non-terminal job per hive)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: three instances crossing DIFFERENT
  # entity pairs: Harvest->Agreement, RemovalJob->Incident, Hive->Site
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: harvest_blocked_when_agreement_expired
        grounds:
          - state_machines.Agreement.ACTIVE_to_EXPIRED
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Harvest -> Agreement: the harvest's own state is fine and its inspection is
          fresh, but the hive's Agreement lazily transitioned to EXPIRED when the logical
          clock passed term_end_date (2026-05-31); creation is rejected with
          ERR_AGREEMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; site CLEAR; agreement ACTIVE with term [2026-01-01, 2026-05-31]; hive installed"
            - "Verified inspection at 2026-05-20; logical clock advanced to 2026-06-02 (past term end)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Nineteen", email: "h19@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "19 Chestnut St", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-05-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv}", inspected_at: "2026-05-20T00:00:00Z", mites_counted: 0, bees_sampled: 300, disease_flag: false, brood_score: 9, queen_seen: true, stores_kg: 12.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-06-01T00:00:00Z", gross_kg: 3.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PlatformOps, captures: { ag_status: $.data.status } }
          assert:
            - "captured ${err} == ERR_AGREEMENT_NOT_ACTIVE (Harvest creation gated by the Agreement entity's state)"
            - "captured ${ag_status} == EXPIRED (lazy transition materialized by the access)"
            - "the inspection freshness window held (2026-05-20 within [2026-05-02, 2026-06-01]), isolating the failure to the agreement dependency"

      - name: removal_approve_blocked_by_open_incident
        grounds:
          - state_machines.RemovalJob.REQUESTED_to_APPROVED
          - errors[ERR_SITE_HAS_OPEN_INCIDENTS]
        distinguishing_aspect: |
          Pair RemovalJob -> Incident: approval of a removal is gated by the state of Incident
          entities on the hive's site — a single REPORTED (MINOR) incident blocks approval with
          ERR_SITE_HAS_OPEN_INCIDENTS; resolving it DISMISSED unblocks the same call.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver; site CLEAR; agreement ACTIVE; hive installed; no subscription (balance 0)"
            - "RemovalJob REQUESTED for the hive; one MINOR incident REPORTED on the site"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Twenty", email: "h20@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "20 Dogwood Dr", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv}", reason: "NUISANCE" }, as: Host, as_user_id: "${h}", captures: { rj: $.data.id } }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "MINOR", occurred_at: "2026-05-03T00:00:00Z", description: "sting near the fence" }, as: Host, as_user_id: "${h}", captures: { inc: $.data.id } }
          trigger:
            - { call: "POST /api/removal-jobs/${rj}/approve", payload: { decision: "APPROVE" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/incidents/${inc}/resolve", payload: { outcome: "DISMISSED", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/removal-jobs/${rj}/approve", payload: { decision: "APPROVE" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { st_after: $.data.status } }
          assert:
            - "captured ${err} == ERR_SITE_HAS_OPEN_INCIDENTS while Incident.${inc} was REPORTED"
            - "Site.${site}.status == CLEAR throughout (one MINOR report does not block the site; the removal gate is a separate cross-entity rule)"
            - "after DISMISSED resolution the identical approve succeeds: captured ${st_after} == APPROVED"

      - name: hive_install_blocked_when_site_blocked
        grounds:
          - state_machines.Site.CLEAR_to_BLOCKED
          - errors[ERR_SITE_BLOCKED]
        distinguishing_aspect: |
          Pair Hive -> Site: a SEVERE incident report flips the Site to BLOCKED, and the
          hive-install endpoint (which passes every hive-local check) is rejected with
          ERR_SITE_BLOCKED until a manager unblocks the site.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver; site CLEAR with capacity 2 and one hive already installed"
            - "SEVERE incident reported on the site (site auto-blocks)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host TwentyOne", email: "h21@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "21 Juniper Ct", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/incidents", payload: { site_id: "${site}", severity: "SEVERE", occurred_at: "2026-05-03T00:00:00Z", description: "neighbor hospitalized after multiple stings" }, as: Host, as_user_id: "${h}", captures: { inc: $.data.id } }
          trigger:
            - { call: "GET /api/sites/${site}", payload: {}, as: PlatformOps, captures: { site_st: $.data.status } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/incidents/${inc}/resolve", payload: { outcome: "NO_FAULT", liability_cents: 0 }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/sites/${site}/unblock", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
          assert:
            - "captured ${site_st} == BLOCKED (SEVERE report auto-blocks the site)"
            - "captured ${err} == ERR_SITE_BLOCKED (Hive install gated by Site state)"
            - "after resolve + unblock the identical install succeeds: Hive.${hv2} created"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: three instances with DIFFERENT interval
  # semantics on DIFFERENT resources (half-open on Hive, buffer-gap on crew
  # schedule, closed-interval on Site)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: treatment_window_half_open_adjacency
        grounds:
          - entities.Treatment.fields.start_date
          - entities.Treatment.fields.end_date
          - errors[ERR_TREATMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Semantics: half-open [start_date, end_date) on the Hive resource — a new treatment
          starting exactly when the previous ends is ALLOWED (adjacency is not overlap);
          one day of true intersection is rejected. Resource: Hive.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; site CLEAR; agreement ACTIVE; one hive ACTIVE"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host TwentyTwo", email: "h22@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "22 Sassafras Way", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
          trigger:
            - { call: "POST /api/treatments", payload: { hive_id: "${hv}", product: "APIVAR", start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { t1: $.data.id } }
            - { call: "POST /api/treatments", payload: { hive_id: "${hv}", product: "FORMIC_ACID", start_date: "2026-05-10T00:00:00Z", end_date: "2026-05-20T00:00:00Z" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { t2: $.data.id } }
            - { call: "POST /api/treatments", payload: { hive_id: "${hv}", product: "OXALIC_ACID", start_date: "2026-05-09T00:00:00Z", end_date: "2026-05-11T00:00:00Z" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "Treatment.${t1} created (window [05-01, 05-10))"
            - "Treatment.${t2} created: start 05-10 == t1 end 05-10 is adjacency, allowed under half-open semantics"
            - "captured ${err} == ERR_TREATMENT_WINDOW_OVERLAP for [05-09, 05-11): intersects both existing windows"
            - "Treatment.${t1}.withdrawal_end_date == 2026-05-24T00:00:00Z (end_date + 14 days, computed at creation)"

      - name: crew_schedule_buffer_gap_semantics
        grounds:
          - state_machines.RemovalJob.APPROVED_to_SCHEDULED
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Semantics: mandatory 2h buffer between job windows on the crew-schedule resource —
          unlike the treatment half-open rule, touching is NOT allowed; a gap of exactly 2h
          is allowed. A 30-minute gap is rejected; exactly 2h succeeds on retry. Resource:
          crew calendar (crew_id), distinct from the Hive resource of the treatment rule.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; site capacity 2 with two hives; agreement ACTIVE"
            - "removal1 (hive1) APPROVED; removal2 (hive2) APPROVED; logical clock at default 2026-05-01"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host TwentyThree", email: "h23@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "23 Redbud Rd", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv1}", reason: "RELOCATION" }, as: Host, as_user_id: "${h}", captures: { rj1: $.data.id } }
            - { call: "POST /api/removal-jobs/${rj1}/approve", payload: { decision: "APPROVE" }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv2}", reason: "EXIT" }, as: Host, as_user_id: "${h}", captures: { rj2: $.data.id } }
            - { call: "POST /api/removal-jobs/${rj2}/approve", payload: { decision: "APPROVE" }, as: ApiaryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/removal-jobs/${rj1}/schedule", payload: { scheduled_start: "2026-06-10T09:00:00Z", crew_id: "crew-1" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { st1: $.data.status } }
            - { call: "POST /api/removal-jobs/${rj2}/schedule", payload: { scheduled_start: "2026-06-10T11:30:00Z", crew_id: "crew-1" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/removal-jobs/${rj2}/schedule", payload: { scheduled_start: "2026-06-10T13:00:00Z", crew_id: "crew-1" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { st2: $.data.status } }
          assert:
            - "captured ${st1} == SCHEDULED (job1 occupies [09:00, 11:00) for crew-1)"
            - "captured ${err} == ERR_CREW_SCHEDULE_CONFLICT for 11:30 (gap 30 min < required 2h — touching/near-touching disallowed)"
            - "captured ${st2} == SCHEDULED for 13:00 (gap exactly 2h is allowed — >= boundary inclusive)"
            - "a different crew is unaffected: the conflict rule is scoped by crew_id, not by site or hive"

      - name: agreement_term_closed_interval_overlap
        grounds:
          - entities.Agreement.fields.term_start_date
          - entities.Agreement.fields.term_end_date
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Semantics: closed (both-endpoints-inclusive) date intervals on the Site resource —
          unlike half-open treatments, a new term starting ON the existing term's end date
          collides; starting the next day is free. Resource: Site (its agreement coverage).
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver; site CLEAR; agreement A1 live in PENDING_SIGNATURE with term [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host TwentyFour", email: "h24@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
