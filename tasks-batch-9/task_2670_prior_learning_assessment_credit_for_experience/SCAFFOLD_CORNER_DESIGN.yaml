        grounds:
          - state_machines.AssessorAssignment.transitions.ASSIGNED_to_DECLINED
          - calculations.assessor_selection_rank
          - entities.AssessorAssignment.fields.selection_reason
          - entities.FacultyAssessor.fields.active_assignment_count
          - endpoints[POST /assessor-assignments/{assignment_id}/decline]
        distinguishing_aspect: |
          Declining E-9001's assignment applies all four declared side effects in
          one call: the row becomes DECLINED with decline_reason recorded,
          E-9001.active_assignment_count drops from 1 to 0, a replacement
          assignment with selection_reason AUTO_REPLACEMENT is created for E-9002
