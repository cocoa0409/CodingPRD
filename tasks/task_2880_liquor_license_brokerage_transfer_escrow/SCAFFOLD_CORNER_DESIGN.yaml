              expect_error: true
              captures: { e_stale: $.data.error_id }
            - call: "GET /listings/${lst_id}"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v2: $.data.version, offers: $.data.open_offer_count }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 19000000, deposit_pct_bps: 1000, closing_window_start: "2026-12-30T00:00:00Z", expected_listing_version: "${lst_v2}" }
              as: Broker
              as_user_id: "${brk_id}"
