              as: MuseumOperations
              as_user_id: ops-01
              captures: { zone1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.14.3", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, security_class: "ENHANCED", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { art1: $.data.id }
            - call: "POST /exhibit-projects/${proj}/artifact-cases"
              payload: { zone_id: "${zone1}", case_code: "C-01", objective_code: "OBJ-EXTINCTION", security_tier: "ENHANCED", target_rh_pct: 50.0, rh_tolerance_pct: 2.0, target_lux: 50.0, uv_microwatt_per_lumen: 20.0, interior_l_cm: 120.0, interior_w_cm: 60.0, interior_h_cm: 90.0, air_exchanges_per_day: 0.4 }
              as: Curator
              as_user_id: cur-01
              captures: { case1: $.data.id, case_v1: $.data.version }
            - call: "POST /exhibit-projects"
              payload: { name: "Sky Bridge Gallery", museum_name: "Ridgeline Museum", storyline_title: "Above the Canopy", objective_codes: ["OBJ-CANOPY"], target_open_date: "2027-09-01T00:00:00Z", contract_value_cents: 4000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { projb: $.data.id }
            - call: "POST /exhibit-projects/${projb}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
            - call: "POST /exhibit-projects/${projb}/gallery-zones"
              payload: { zone_code: "Z-B", visitor_route_order: 1, max_noise_dba: 70.0, case_slot_capacity: 3, closure_allowed: false }
              as: MuseumOperations
