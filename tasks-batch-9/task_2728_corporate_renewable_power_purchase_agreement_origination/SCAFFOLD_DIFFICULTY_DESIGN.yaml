              as: Originator
              as_user_id: "u_orig_1"
              captures: { rf_id: $.data.id }
            - call: "POST /ppa/settlement-periods/${period_id}/calculate"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "POST /ppa/settlement-periods/${period_id}/advance"
