        distinguishing_aspect: "Accept on a non-existent offer returns 404 ERR_OFFER_NOT_FOUND (existence p4) before any state check (p7)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reuse/donation-offers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/accept"
              payload: {}
              as: IntakeStaff
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with error_id == ERR_OFFER_NOT_FOUND"

      - name: role_denial_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Cashier calling offer-accept gets 403 ERR_FORBIDDEN_ROLE even when the offer id does not exist (auth p2 precedes existence p4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reuse/donation-offers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/accept"
