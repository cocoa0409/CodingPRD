  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_window_closed_interval_touch_conflicts
        grounds:
          - validations[priority=16]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource ProgramCycle, CLOSED-interval semantics: a sibling cycle
          whose cycle_start equals the existing cycle's cycle_end shares one
          instant and MUST conflict; shifting the start one second past the
          boundary is accepted.
        test_recipe:
          setup:
            - "Program ACTIVE; cycle A occupying closed interval [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z]"
          setup_api_calls:
            - call: "POST /programs"
