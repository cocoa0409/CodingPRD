# =============================================================================
# PRD Benchmark Scaffold — Scholarly Journal Peer Review & Publishing
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2464. Scholarly Journal Peer Review & Publishing (academic society journal publisher): submission intake with scope screening, formatting checks and integrity screening for image manipulation and plagiarism, editor assignment by subject area with conflict declarations and workload balancing, reviewer invitation, acceptance rates and reminder cadence with reviewer database quality tracking, decision categories with revision rounds and appeal handling, publication ethics case management for authorship disputes, data availability and retraction decisions, open access licensing options, fee waivers and embargo settings, production workflow across copyediting, typesetting and proof approval, indexing, metrics reporting and archival deposit

domain_name: scholarly-journal-peer-review
# Flat topology: every collection is a root-level path, so the API prefix is empty
# and each endpoint `path:` below is already the complete route.
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nesting in URL paths beyond
  # sub-resource reads (Manuscript is referenced by FK from every workflow entity
  # rather than owning them in the path).

  state_machine_shape: cyclic
  # Manuscript loops REVISION_REQUESTED -> REVISION_SUBMITTED -> UNDER_REVIEW ->
  # DECISION_PENDING -> REVISION_REQUESTED (capped by Journal.max_revision_rounds)
  # and REJECTED -> UNDER_APPEAL -> UNDER_REVIEW; ProductionJob carries two
  # independent (parallel) stage dimensions and a proof-rejection loop.

  relationship_patterns:
    - one_to_many          # Journal -> Editor; Manuscript -> ReviewInvitation
    - many_to_many         # Reviewer <-> Manuscript through ReviewInvitation
    - self_referential     # Manuscript.supersedes_manuscript_id -> Manuscript.id
    - cross_aggregate      # ProductionJob gate reads APCInvoice; Appeal reads Decision

  role_model: segregation_of_duties
  # The Editor who issued a Decision may not adjudicate its Appeal; an Editor
  # holding an ACTIVE assignment on a Manuscript may not review it; the
  # corresponding Author approves proofs but may not settle the APC invoice.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Journal
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Journal title.
      - name: subject_areas
        type: array
        source: input
        description: Subject areas in scope; each element is an uppercase slug.
        constraints: "non-empty array of strings; a Manuscript.subject_area outside this set is out of scope"
      - name: doi_prefix
        type: string
        source: input
        description: DOI registrant prefix used when minting DOIs at publication.
        default: "10.5555"
      - name: min_completed_reviews_for_decision
        type: integer
        source: input
        description: Submitted reviews required in the current round before a Decision may be issued.
        default: 2
        constraints: ">= 1"
      - name: max_revision_rounds
        type: integer
        source: input
        description: Maximum number of revision rounds a Manuscript may be sent through.
        default: 2
        constraints: ">= 0"
      - name: review_target_days
        type: integer
        source: input
        description: Days from invitation creation to ReviewInvitation.due_at.
        default: 21
        constraints: ">= 1"
      - name: reminder_cadence_days
        type: integer
        source: input
        description: Days between reminder emails for an INVITED invitation.
        default: 7
        constraints: ">= 1"
      - name: max_reminders_per_invitation
        type: integer
        source: input
        description: Cap on reminders sent per ReviewInvitation.
        default: 2
        constraints: ">= 0"
      - name: reviewer_concurrent_window_limit
        type: integer
        source: input
        description: Maximum open ReviewInvitation windows one Reviewer may hold that overlap a new window.
        default: 3
        constraints: ">= 1"
      - name: consensus_mode
        type: enum
        source: input
        description: Selects which decision_consensus_index variant the decision endpoint applies.
        default: UNWEIGHTED
        constraints: "UNWEIGHTED | RELIABILITY_WEIGHTED"
      - name: max_page_count
        type: integer
        source: input
        description: Formatting limit on Manuscript.page_count.
        default: 30
        constraints: ">= 1"
      - name: max_figure_count
        type: integer
        source: input
        description: Formatting limit on Manuscript.figure_count.
        default: 10
        constraints: ">= 0"
      - name: requires_data_availability_statement
        type: boolean
        source: input
        description: When true an ACCEPT decision requires a non-empty Manuscript.data_availability_statement.
        default: true
      - name: apc_base_cents
        type: integer
        source: input
        description: List article processing charge in cents before license multiplier.
        default: 180000
        constraints: ">= 0"
      - name: page_charge_cents_per_page
        type: integer
        source: input
        description: Surcharge per charged page on the APC invoice.
        default: 4000
        constraints: ">= 0"
      - name: color_figure_charge_cents
        type: integer
        source: input
        description: Surcharge per color figure on the APC invoice.
        default: 25000
        constraints: ">= 0"
      - name: embargo_months
        type: integer
        source: input
        description: Embargo length applied to GREEN_SELF_ARCHIVE manuscripts at publication.
        default: 12
        constraints: ">= 0"
      - name: typeset_changeover_buffer_days
        type: integer
        source: input
        description: Buffer days that must separate two typesetting slots on this journal's desk.
        default: 2
        constraints: ">= 0"
      - name: max_proof_rounds
        type: integer
        source: input
        description: Maximum proof rounds before ERR_PROOF_ROUNDS_EXHAUSTED.
        default: 2
        constraints: ">= 1"
      - name: manuscript_intake_count
        type: integer
        source: computed
        description: Count of Manuscript rows with this journal_id; drives Manuscript.journal_sequence_number.
        default: 0
      - name: published_article_count
        type: integer
        source: computed
        description: Count of Manuscript rows for this journal whose status IN {PUBLISHED, CORRECTED}.
        default: 0
      - name: retracted_article_count
        type: integer
        source: computed
        description: Count of Manuscript rows for this journal whose status == RETRACTED.
        default: 0
      - name: apc_receivable_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of APCInvoice.total_due_cents over invoices of this journal's manuscripts whose status == ISSUED."
        default: 0
      - name: apc_waived_cents
        type: integer
        source: computed
        description: "Conserved ledger: sum of APCInvoice.total_due_cents over invoices of this journal's manuscripts whose status == WAIVED."
        default: 0

  - name: Editor
    parent: null
    common_fields: true
    fields:
      - name: journal_id
        type: string
        source: input
        description: "FK -> Journal.id; the editorial board this editor sits on."
      - name: email
        type: string
        source: input
        description: Editor email; compared against Manuscript author emails for conflict detection.
        constraints: "unique across Editor rows sharing journal_id"
      - name: full_name
        type: string
        source: input
        description: Editor display name.
      - name: affiliation
        type: string
        source: input
        description: Institution string; an exact match with the corresponding author's affiliation is a conflict.
      - name: subject_areas
        type: array
        source: input
        description: Subject areas this editor handles; must contain Manuscript.subject_area to be assignable.
        constraints: "non-empty array of strings"
      - name: role_level
        type: enum
        source: input
        description: HANDLING editors run peer review; CHIEF editors assign, adjudicate appeals and run ethics cases.
        constraints: "HANDLING | CHIEF"
      - name: status
        type: enum
        source: input
        description: ACTIVE editors are assignable; ON_LEAVE editors are excluded from assignment.
        default: ACTIVE
        constraints: "ACTIVE | ON_LEAVE"
      - name: max_concurrent_assignments
        type: integer
        source: input
        description: Workload ceiling used by the editor selector and the capacity check.
        default: 3
        constraints: ">= 1"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of EditorAssignment rows where editor_id == this Editor.id AND state IN {PROPOSED, ACTIVE}."
        default: 0

  - name: Author
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Corresponding author email; conflict checks compare it to Editor.email and Reviewer.email.
        constraints: "unique across Author rows"
      - name: full_name
        type: string
        source: input
        description: Author display name.
      - name: affiliation
        type: string
        source: input
        description: Institution string used for affiliation-overlap conflict checks.
      - name: country_income_band
        type: enum
        source: input
        description: World-bank style band driving the APC waiver percentage.
        default: HIGH
        constraints: "HIGH | UPPER_MIDDLE | LOWER_MIDDLE | LOW"
      - name: institutional_agreement
        type: boolean
        source: input
        description: When true a 15 percent institutional discount applies to the post-waiver remainder.
        default: false

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Reviewer email; matched against manuscript author emails for conflict of interest.
        constraints: "unique across Reviewer rows"
      - name: full_name
        type: string
        source: input
        description: Reviewer display name.
      - name: affiliation
        type: string
        source: input
        description: Institution string used for affiliation-overlap conflict checks.
      - name: subject_areas
        type: array
        source: input
        description: Subject areas the reviewer covers; must contain Manuscript.subject_area for auto-selection.
        constraints: "non-empty array of strings"
      - name: status
        type: enum
        source: input
        description: ACTIVE is auto-selectable; PROBATION may only be invited by explicit reviewer_id; RETIRED is never invitable.
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | RETIRED"
      - name: invited_count
        type: integer
        source: computed
        description: Lifetime count of ReviewInvitation rows for this reviewer (monotone audit counter, never decremented).
        default: 0
      - name: accepted_count
        type: integer
        source: computed
        description: "Lifetime count of this reviewer's invitations whose state IN {ACCEPTED, SUBMITTED}."
        default: 0
      - name: declined_count
        type: integer
        source: computed
        description: Lifetime count of this reviewer's invitations whose state == DECLINED.
        default: 0
      - name: expired_count
        type: integer
        source: computed
        description: Lifetime count of this reviewer's invitations whose state == EXPIRED.
        default: 0
      - name: submitted_count
        type: integer
        source: computed
        description: Lifetime count of this reviewer's invitations whose state == SUBMITTED.
        default: 0
      - name: late_days_total
        type: integer
        source: computed
        description: Lifetime sum of Review.days_late over reviews submitted by this reviewer.
        default: 0
      - name: open_invitation_count
        type: integer
        source: computed
        description: "Conserved load: count of this reviewer's invitations whose state IN {INVITED, ACCEPTED}."
        default: 0
      - name: reliability_score_rolling
        type: number
        source: computed
        description: reviewer_reliability_score under the ROLLING variant (invitations created within the last 180 days).
        default: 50.0
        constraints: "0.00 .. 100.00, two decimals"
      - name: reliability_score_lifetime
        type: number
        source: computed
        description: reviewer_reliability_score under the LIFETIME variant (all invitations ever).
        default: 50.0
        constraints: "0.00 .. 100.00, two decimals"

  - name: Manuscript
    parent: null
    common_fields: true
    fields:
      - name: journal_id
        type: string
        source: input
        description: "FK -> Journal.id; owning journal whose configuration governs every rule on this manuscript."
      - name: corresponding_author_id
        type: string
        source: input
        description: "FK -> Author.id; the only Author allowed to revise, appeal and approve proofs for this manuscript."
      - name: supersedes_manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; set on a resubmission, must point at a manuscript whose latest Decision.category == REJECT_AND_RESUBMIT."
        default: null
      - name: title
        type: string
        source: input
        description: Manuscript title.
      - name: subject_area
        type: string
        source: input
        description: Subject area slug; must be a member of Journal.subject_areas at submission.
      - name: oa_license
        type: enum
        source: input
        description: Open-access option chosen at submission; drives the APC license multiplier and the embargo rule.
        constraints: "CC_BY | CC_BY_NC | CC_BY_NC_ND | GREEN_SELF_ARCHIVE"
      - name: page_count
        type: integer
        source: input
        description: Typeset page estimate checked against Journal.max_page_count.
        constraints: ">= 1"
      - name: figure_count
        type: integer
        source: input
        description: Figure count checked against Journal.max_figure_count.
        constraints: ">= 0"
      - name: coauthor_emails
        type: array
        source: input
        description: Co-author emails; any Editor or Reviewer whose email appears here has a conflict of interest.
        default: []
      - name: data_availability_statement
        type: string
        source: input
        description: Data availability text; required for an ACCEPT decision when Journal.requires_data_availability_statement is true.
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see the Manuscript state machine.
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | DECISION_PENDING | REVISION_REQUESTED | REVISION_SUBMITTED | REJECTED | UNDER_APPEAL | IN_PRODUCTION | PUBLISHED | CORRECTED | DESK_REJECTED | RETRACTED"
      - name: revision_round
        type: integer
        source: system
        description: 0 for the original submission; incremented on each accepted revision upload.
        default: 0
      - name: journal_sequence_number
        type: integer
        source: system
        description: Journal.manuscript_intake_count + 1 at creation; the deterministic component of the minted DOI.
      - name: integrity_status
        type: enum
        source: computed
        description: Worst verdict across IntegrityScreening rows of the current revision_round (BLOCK > FLAG > PASS); PENDING when the current round has no screening.
        default: PENDING
        constraints: "PENDING | PASS | FLAG | BLOCK"
      - name: formatting_status
        type: enum
        source: computed
        description: COMPLIANT when page_count <= Journal.max_page_count AND figure_count <= Journal.max_figure_count, else NON_COMPLIANT.
        default: COMPLIANT
        constraints: "COMPLIANT | NON_COMPLIANT"
      - name: submitted_review_count
        type: integer
        source: computed
        description: "Count of Review rows whose invitation.manuscript_id == this id AND invitation.round == this revision_round."
        default: 0
      - name: review_shortfall_flag
        type: boolean
        source: computed
        description: True when the current round has fewer submitted reviews than Journal.min_completed_reviews_for_decision and no invitation remains in {INVITED, ACCEPTED}.
        default: false
      - name: handling_gap_flag
        type: boolean
        source: computed
        description: True when the last recusal found no eligible replacement editor, so the manuscript has no ACTIVE EditorAssignment.
        default: false
      - name: consensus_index_at_last_decision
        type: number
        source: computed
        description: decision_consensus_index value stored by the most recent Decision on this manuscript.
        default: null
      - name: decision_count
        type: integer
        source: computed
        description: Count of Decision rows for this manuscript.
        default: 0
      - name: publication_date
        type: string
        source: input
        description: Issue publication date (YYYY-MM-DD) supplied at publication; null before publication.
        default: null
      - name: embargo_end_date
        type: string
        source: computed
        description: publication_date plus Journal.embargo_months with end-of-month clamping for GREEN_SELF_ARCHIVE; equals publication_date for CC_* licenses.
        default: null
      - name: doi
        type: string
        source: computed
        description: "Minted at publication as `{Journal.doi_prefix}/{issue_label}.{journal_sequence_number zero-padded to 4}`."
        default: null
      - name: retracted_at
        type: datetime
        source: system
        description: Timestamp of the retraction cascade; null unless status == RETRACTED.
        default: null

  - name: IntegrityScreening
    parent: null
    common_fields: false
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; the screened manuscript."
      - name: round
        type: integer
        source: system
        description: Manuscript.revision_round captured at screening time.
      - name: scan_type
        type: enum
        source: input
        description: PLAGIARISM screens text similarity; IMAGE_FORENSICS screens figures for manipulation.
        constraints: "PLAGIARISM | IMAGE_FORENSICS"
      - name: similarity_pct
        type: number
        source: input
        description: Text similarity percentage; required for PLAGIARISM, must be omitted for IMAGE_FORENSICS.
        default: null
        constraints: "0.00 .. 100.00"
      - name: manipulated_figure_count
        type: integer
        source: input
        description: Number of figures flagged as manipulated; required for IMAGE_FORENSICS, must be omitted for PLAGIARISM.
        default: null
        constraints: ">= 0"
      - name: verdict
        type: enum
        source: computed
        description: PLAGIARISM - similarity_pct >= 40.0 BLOCK, >= 20.0 FLAG, else PASS. IMAGE_FORENSICS - manipulated_figure_count >= 2 BLOCK, == 1 FLAG, else PASS.
        constraints: "PASS | FLAG | BLOCK"

  - name: EditorAssignment
    parent: null
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; the assigned manuscript."
      - name: editor_id
        type: string
        source: input
        description: "FK -> Editor.id; the handling editor, supplied explicitly or chosen by the editor_assignment_selection selector."
      - name: selected_by
        type: enum
        source: system
        description: EXPLICIT when the request named editor_id; SELECTOR when the server ranked the eligible pool.
        constraints: "EXPLICIT | SELECTOR"
      - name: state
        type: enum
        source: system
        description: Assignment lifecycle; see the EditorAssignment state machine.
        default: PROPOSED
        constraints: "PROPOSED | ACTIVE | RECUSED | RELEASED"
      - name: declared_conflict
        type: boolean
        source: input
        description: Conflict declaration answer; true routes the assignment to RECUSED.
        default: null
      - name: conflict_type
        type: enum
        source: input
        description: Declared conflict kind; required when declared_conflict is true.
        default: null
        constraints: "CO_AUTHOR | SAME_INSTITUTION | FINANCIAL | PERSONAL"
      - name: replaced_assignment_id
        type: string
        source: system
        description: "FK -> EditorAssignment.id; set on the replacement assignment created by a recusal cascade."
        default: null
      - name: released_reason
        type: enum
        source: system
        description: Why the assignment left ACTIVE.
        default: null
        constraints: "DECISION_FINAL | RECUSAL | RETRACTION"

  - name: ReviewInvitation
    parent: null
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; the manuscript under review."
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> Reviewer.id; supplied explicitly or chosen by the reviewer_invitation_selection selector."
      - name: round
        type: integer
        source: system
        description: Manuscript.revision_round captured at invitation creation.
      - name: state
        type: enum
        source: system
        description: Invitation lifecycle; see the ReviewInvitation state machine.
        default: INVITED
        constraints: "INVITED | ACCEPTED | DECLINED | EXPIRED | SUBMITTED | WITHDRAWN"
      - name: selected_by
        type: enum
        source: system
        description: EXPLICIT when the request named reviewer_id; SELECTOR when the server ranked the eligible pool.
        constraints: "EXPLICIT | SELECTOR"
      - name: invited_at
        type: datetime
        source: system
        description: Logical clock time at creation; start of the half-open occupancy window on the reviewer.
      - name: due_at
        type: datetime
        source: system
        description: invited_at plus due_days (defaulting to Journal.review_target_days); exclusive end of the occupancy window.
      - name: responded_at
        type: datetime
        source: system
        description: Clock time of the ACCEPT or DECLINE response.
        default: null
      - name: decline_reason
        type: string
        source: input
        description: Free text supplied with a DECLINE response.
        default: null
      - name: reminder_count
        type: integer
        source: computed
        description: Reminders emitted by the reminder sweep for this invitation.
        default: 0
      - name: last_reminder_at
        type: datetime
        source: computed
        description: Clock time of the most recent reminder; null until the first reminder.
        default: null
      - name: closed_reason
        type: enum
        source: system
        description: Why the invitation left an open state.
        default: null
        constraints: "REVIEW_SUBMITTED | REVIEWER_DECLINED | SWEEP_EXPIRY | EDITOR_WITHDRAWN | DECISION_CASCADE"

  - name: Review
    parent: null
    common_fields: false
    fields:
      - name: invitation_id
        type: string
        source: input
        description: "FK -> ReviewInvitation.id; the invitation this review answers."
      - name: recommendation
        type: enum
        source: input
        description: Reviewer recommendation; mapped to 4/3/2/1 by decision_consensus_index.
        constraints: "ACCEPT | MINOR_REVISION | MAJOR_REVISION | REJECT"
      - name: novelty_score
        type: integer
        source: input
        description: Novelty rating.
        constraints: "1 .. 5"
      - name: rigor_score
        type: integer
        source: input
        description: Methodological rigor rating.
        constraints: "1 .. 5"
      - name: clarity_score
        type: integer
        source: input
        description: Presentation clarity rating.
        constraints: "1 .. 5"
      - name: comments
        type: string
        source: input
        description: Reviewer comments to the editor.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical clock time at submission.
      - name: days_late
        type: integer
        source: computed
        description: "max(0, ceil((submitted_at - invitation.due_at) / 86400000 ms)); 0 when submitted at or before due_at."
        default: 0
      - name: reliability_weight
        type: number
        source: computed
        description: "max(0.25, round_half_up(Reviewer.reliability_score_rolling / 100, 4)) frozen at submission time for the RELIABILITY_WEIGHTED consensus variant."
        constraints: "0.2500 .. 1.0000, four decimals"

  - name: Decision
    parent: null
    common_fields: false
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; the decided manuscript."
      - name: decided_by_editor_id
        type: string
        source: system
        description: "FK -> Editor.id; X-User-ID of the handling editor who issued the decision, pinned for the appeal segregation-of-duties check."
      - name: round
        type: integer
        source: system
        description: Manuscript.revision_round at decision time.
      - name: category
        type: enum
        source: input
        description: Decision category; when omitted the server writes the auto category derived from consensus_index.
        constraints: "ACCEPT | MINOR_REVISION | MAJOR_REVISION | REJECT | REJECT_AND_RESUBMIT"
      - name: category_source
        type: enum
        source: system
        description: EXPLICIT when the request named category; AUTO when derived from consensus_index thresholds.
        constraints: "EXPLICIT | AUTO"
      - name: consensus_mode
        type: enum
        source: system
        description: Journal.consensus_mode captured at decision time.
        constraints: "UNWEIGHTED | RELIABILITY_WEIGHTED"
      - name: consensus_index
        type: number
        source: computed
        description: decision_consensus_index over the current round's submitted reviews, two decimals.
      - name: auto_category
        type: enum
        source: computed
        description: Category implied by consensus_index thresholds, recorded even when category was explicit.
        constraints: "ACCEPT | MINOR_REVISION | MAJOR_REVISION | REJECT"
      - name: reviews_counted
        type: integer
        source: computed
        description: Number of Review rows that entered the consensus computation.
      - name: editorial_note
        type: string
        source: input
        description: Editor letter text sent to the author.

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: decision_id
        type: string
        source: input
        description: "FK -> Decision.id; the appealed decision, whose category must be REJECT or REJECT_AND_RESUBMIT."
      - name: manuscript_id
        type: string
        source: system
        description: "FK -> Manuscript.id; copied from the appealed decision for filtering."
      - name: adjudicated_by_editor_id
        type: string
        source: system
        description: "FK -> Editor.id; CHIEF editor who adjudicated; must differ from Decision.decided_by_editor_id."
        default: null
      - name: state
        type: enum
        source: system
        description: Appeal lifecycle; see the Appeal state machine.
        default: FILED
        constraints: "FILED | UPHELD | OVERTURNED"
      - name: grounds
        type: string
        source: input
        description: Author's stated grounds for appeal.
      - name: rationale
        type: string
        source: input
        description: Chief editor's adjudication rationale.
        default: null
      - name: adjudicated_at
        type: datetime
        source: system
        description: Clock time of adjudication.
        default: null

  - name: EthicsCase
    parent: null
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; the manuscript under investigation."
      - name: case_type
        type: enum
        source: input
        description: Category of publication-ethics concern.
        constraints: "AUTHORSHIP_DISPUTE | DATA_AVAILABILITY | IMAGE_INTEGRITY | PLAGIARISM"
      - name: severity
        type: enum
        source: input
        description: Severity band; HIGH cases block decisions and production while open.
        constraints: "LOW | MEDIUM | HIGH"
      - name: opened_by
        type: enum
        source: system
        description: MANUAL when created through the ethics-cases endpoint; SCREENING_CASCADE when auto-opened by a BLOCK integrity screening.
        constraints: "MANUAL | SCREENING_CASCADE"
      - name: state
        type: enum
        source: system
        description: Case lifecycle; see the EthicsCase state machine.
        default: OPEN
        constraints: "OPEN | INVESTIGATION | AUTHOR_RESPONSE_REQUESTED | COMMITTEE_REVIEW | RESOLVED_NO_ACTION | CORRECTION_ISSUED | RETRACTION_APPROVED"
      - name: description
        type: string
        source: input
        description: Allegation text.
      - name: resolution_statement
        type: string
        source: input
        description: Published resolution statement written at resolution time.
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Clock time the case reached a resolved state.
        default: null

  - name: ProductionJob
    parent: null
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; created by the ACCEPT decision cascade, never by a direct client call."
      - name: content_stage
        type: enum
        source: system
        description: First (content) state dimension - copyediting through proof approval.
        default: COPYEDITING
        constraints: "COPYEDITING | TYPESETTING | PROOF_SENT | PROOF_APPROVED | TERMINATED"
      - name: clearance_stage
        type: enum
        source: system
        description: Second (clearance) state dimension - licensing/fee settlement through archival deposit, evolving independently of content_stage.
        default: LICENSE_PENDING
        constraints: "LICENSE_PENDING | FEE_CLEARED | DEPOSIT_CONFIRMED | WITHDRAWN"
      - name: proof_round
        type: integer
        source: system
        description: Incremented each time an author rejects a proof and the job loops back to TYPESETTING.
        default: 0
      - name: slot_start
        type: string
        source: input
        description: Typesetting slot start date (YYYY-MM-DD), inclusive endpoint of a closed occupancy interval on the journal's typesetting desk.
        default: null
      - name: slot_end
        type: string
        source: input
        description: Typesetting slot end date (YYYY-MM-DD), inclusive endpoint of the closed occupancy interval.
        default: null
      - name: archival_repository
        type: enum
        source: input
        description: Preservation archive receiving the deposit.
        default: null
        constraints: "CLOCKSS | PORTICO | LOCKSS"
      - name: deposit_reference
        type: string
        source: input
        description: Archive-side deposit receipt identifier.
        default: null
      - name: indexing_status
        type: enum
        source: computed
        description: NOT_INDEXED until publication, INDEXED at publication, WITHDRAWN after a retraction cascade.
        default: NOT_INDEXED
        constraints: "NOT_INDEXED | INDEXED | WITHDRAWN"
      - name: issue_label
        type: string
        source: input
        description: Issue label used in the DOI, e.g. "2027-01".
        default: null
      - name: published_at
        type: datetime
        source: system
        description: Clock time the publication endpoint succeeded.
        default: null

  - name: APCInvoice
    parent: null
    common_fields: true
    fields:
      - name: manuscript_id
        type: string
        source: input
        description: "FK -> Manuscript.id; the invoiced manuscript."
      - name: license_at_issue
        type: enum
        source: system
        description: Manuscript.oa_license captured at issue time.
        constraints: "CC_BY | CC_BY_NC | CC_BY_NC_ND | GREEN_SELF_ARCHIVE"
      - name: base_cents
        type: integer
        source: computed
        description: "Step 1 of apc_net_amount: round_half_up(Journal.apc_base_cents * license_multiplier)."
      - name: waiver_pct
        type: integer
        source: computed
        description: Waiver percentage from Author.country_income_band.
      - name: waiver_cents
        type: integer
        source: computed
        description: "Step 2: round_half_up(base_cents * waiver_pct / 100)."
      - name: institutional_pct
        type: integer
        source: computed
        description: 15 when Author.institutional_agreement is true, else 0.
      - name: institutional_cents
        type: integer
        source: computed
        description: "Step 3: round_half_up((base_cents - waiver_cents) * institutional_pct / 100) - applied to the post-waiver remainder, not to base_cents."
      - name: net_apc_cents
        type: integer
        source: computed
        description: "Step 4/5: base_cents - waiver_cents - institutional_cents, forced to 0 when strictly below MIN_BILLABLE_CENTS."
      - name: auto_waived
        type: boolean
        source: computed
        description: True when step 5 forced net_apc_cents from a positive value to 0.
        default: false
      - name: page_charge_count
        type: integer
        source: input
        description: Chargeable pages billed on this invoice.
        default: 0
        constraints: ">= 0"
      - name: color_figure_count
        type: integer
        source: input
        description: Chargeable color figures billed on this invoice.
        default: 0
        constraints: ">= 0"
      - name: raw_surcharge_cents
        type: integer
        source: computed
        description: page_charge_count * Journal.page_charge_cents_per_page + color_figure_count * Journal.color_figure_charge_cents.
      - name: provisional_total_cents
        type: integer
        source: computed
        description: net_apc_cents + raw_surcharge_cents; the single value the relief bracket is keyed on.
      - name: surcharge_relief_pct
        type: integer
        source: computed
        description: Bracket relief from provisional_total_cents, never re-derived from total_due_cents.
        constraints: "0 | 10 | 20"
      - name: surcharge_cents
        type: integer
        source: computed
        description: raw_surcharge_cents - round_half_up(raw_surcharge_cents * surcharge_relief_pct / 100).
      - name: total_due_cents
        type: integer
        source: computed
        description: net_apc_cents + surcharge_cents; the amount carried in Journal.apc_receivable_cents while status == ISSUED.
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle; see the APCInvoice state machine.
        default: ISSUED
        constraints: "ISSUED | PAID | WAIVED | CANCELLED"
      - name: waiver_reason
        type: string
        source: input
        description: Reason recorded with a WAIVE settlement.
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: Clock time of the settlement action.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Manuscript
    initial_state: SUBMITTED
    terminal_states: [DESK_REJECTED, RETRACTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /manuscripts/{id}/screening-decision with action=ADVANCE_TO_REVIEW"
        actor: HandlingEditor
        preconditions:
          - "manuscript.status == SUBMITTED"
          - "exactly one EditorAssignment with manuscript_id == manuscript.id AND state == ACTIVE exists, and its editor_id == X-User-ID"
          - "manuscript.integrity_status IN {PASS, FLAG}"
          - "manuscript.formatting_status == COMPLIANT"
          - "manuscript.subject_area IN journal.subject_areas"
        side_effects:
          - "manuscript.status = UNDER_REVIEW"
          - "manuscript.review_shortfall_flag = false"
          - "increments Manuscript.version by 1"
      - from: SUBMITTED
        to: DESK_REJECTED
        trigger: "POST /manuscripts/{id}/screening-decision with action=DESK_REJECT"
        actor: HandlingEditor
        preconditions:
          - "manuscript.status == SUBMITTED"
          - "exactly one EditorAssignment with manuscript_id == manuscript.id AND state == ACTIVE exists, and its editor_id == X-User-ID"
        side_effects:
          - "manuscript.status = DESK_REJECTED (terminal)"
          - "the ACTIVE EditorAssignment moves to RELEASED with released_reason = DECISION_FINAL, which decrements that Editor.active_assignment_count by 1"
          - "increments Manuscript.version by 1"
        note: "A DESK_REJECT is permitted while integrity_status == BLOCK or formatting_status == NON_COMPLIANT; only ADVANCE_TO_REVIEW is gated."
      - from: UNDER_REVIEW
        to: DECISION_PENDING
        trigger: "system: POST /review-invitations/{id}/reviews raises submitted_review_count to journal.min_completed_reviews_for_decision"
        actor: system
        preconditions:
          - "manuscript.status == UNDER_REVIEW"
          - "count(Review rows whose invitation.manuscript_id == manuscript.id AND invitation.round == manuscript.revision_round) >= journal.min_completed_reviews_for_decision"
        side_effects:
          - "manuscript.status = DECISION_PENDING"
          - "increments Manuscript.version by 1"
        note: "Auto-transition inside the review-submission request; further reviews may still be submitted while DECISION_PENDING."
      - from: DECISION_PENDING
        to: REVISION_REQUESTED
        trigger: "POST /manuscripts/{id}/decisions resolving to category MINOR_REVISION or MAJOR_REVISION"
        actor: HandlingEditor
        preconditions:
          - "manuscript.status == DECISION_PENDING"
          - "manuscript.revision_round < journal.max_revision_rounds"
          - "no EthicsCase for this manuscript in state IN {OPEN, INVESTIGATION, AUTHOR_RESPONSE_REQUESTED, COMMITTEE_REVIEW} with severity == HIGH"
        side_effects:
          - "manuscript.status = REVISION_REQUESTED"
          - "manuscript.consensus_index_at_last_decision = Decision.consensus_index"
          - "manuscript.decision_count += 1"
          - "every ReviewInvitation of this manuscript in state IN {INVITED, ACCEPTED} moves to WITHDRAWN with closed_reason = DECISION_CASCADE; each such move decrements that Reviewer.open_invitation_count by 1 and re-runs reviewer_reliability_score for that reviewer, whose new score may move the Reviewer between ACTIVE and PROBATION"
          - "increments Manuscript.version by 1"
      - from: DECISION_PENDING
        to: IN_PRODUCTION
        trigger: "POST /manuscripts/{id}/decisions resolving to category ACCEPT"
        actor: HandlingEditor
        preconditions:
          - "manuscript.status == DECISION_PENDING"
          - "journal.requires_data_availability_statement == false OR manuscript.data_availability_statement is a non-empty string"
          - "no EthicsCase for this manuscript in state IN {OPEN, INVESTIGATION, AUTHOR_RESPONSE_REQUESTED, COMMITTEE_REVIEW} with severity == HIGH"
        side_effects:
          - "manuscript.status = IN_PRODUCTION"
          - "manuscript.consensus_index_at_last_decision = Decision.consensus_index"
          - "manuscript.decision_count += 1"
          - "one ProductionJob is created for this manuscript with content_stage = COPYEDITING and clearance_stage = LICENSE_PENDING"
          - "every ReviewInvitation of this manuscript in state IN {INVITED, ACCEPTED} moves to WITHDRAWN with closed_reason = DECISION_CASCADE; each such move decrements that Reviewer.open_invitation_count by 1 and re-runs reviewer_reliability_score for that reviewer"
          - "the ACTIVE EditorAssignment moves to RELEASED with released_reason = DECISION_FINAL, which decrements that Editor.active_assignment_count by 1"
          - "increments Manuscript.version by 1"
      - from: DECISION_PENDING
        to: REJECTED
        trigger: "POST /manuscripts/{id}/decisions resolving to category REJECT or REJECT_AND_RESUBMIT"
        actor: HandlingEditor
        preconditions:
          - "manuscript.status == DECISION_PENDING"
          - "no EthicsCase for this manuscript in state IN {OPEN, INVESTIGATION, AUTHOR_RESPONSE_REQUESTED, COMMITTEE_REVIEW} with severity == HIGH"
        side_effects:
          - "manuscript.status = REJECTED"
          - "manuscript.consensus_index_at_last_decision = Decision.consensus_index; manuscript.decision_count += 1"
          - "CASCADE LINK 2: every ReviewInvitation of this manuscript in state IN {INVITED, ACCEPTED} moves to WITHDRAWN with closed_reason = DECISION_CASCADE"
          - "CASCADE LINK 3 (caused by link 2, once per withdrawn invitation, processed in invitation created_at ASC order): that invitation's Reviewer has open_invitation_count decremented by 1 and reviewer_reliability_score re-run for both variants"
          - "CASCADE LINK 4 (caused by link 3): a Reviewer whose recomputed reliability_score_rolling < 40.00 with at least 3 CLOSED invitations in the rolling window moves from ACTIVE to PROBATION"
          - "the ACTIVE EditorAssignment moves to RELEASED with released_reason = DECISION_FINAL, decrementing that Editor.active_assignment_count by 1"
          - "increments Manuscript.version by 1"
      - from: REVISION_REQUESTED
        to: REVISION_SUBMITTED
        trigger: "POST /manuscripts/{id}/revisions"
        actor: Author
        preconditions:
          - "manuscript.status == REVISION_REQUESTED"
          - "X-User-ID == manuscript.corresponding_author_id"
        side_effects:
          - "manuscript.status = REVISION_SUBMITTED"
          - "manuscript.revision_round += 1"
          - "manuscript.page_count and figure_count replaced by the request values, so formatting_status is recomputed"
          - "manuscript.integrity_status returns to PENDING because the new round has no screening yet"
          - "manuscript.submitted_review_count recomputed for the new round (0)"
          - "increments Manuscript.version by 1"
      - from: REVISION_SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: POST /manuscripts/{id}/integrity-screenings whose verdict is PASS or FLAG for the current round"
        actor: system
        preconditions:
          - "manuscript.status == REVISION_SUBMITTED"
          - "the screening just recorded has round == manuscript.revision_round and verdict IN {PASS, FLAG}"
          - "manuscript.formatting_status == COMPLIANT"
        side_effects:
          - "manuscript.status = UNDER_REVIEW"
          - "manuscript.review_shortfall_flag = false"
          - "increments Manuscript.version by 1"
        note: "When the verdict is BLOCK the manuscript stays REVISION_SUBMITTED and an EthicsCase is auto-opened instead."
      - from: REJECTED
        to: UNDER_APPEAL
        trigger: "POST /appeals"
        actor: Author
        preconditions:
          - "manuscript.status == REJECTED"
          - "decision.manuscript_id == manuscript.id AND decision.category IN {REJECT, REJECT_AND_RESUBMIT}"
          - "no Appeal row already exists for that decision_id"
        side_effects:
          - "manuscript.status = UNDER_APPEAL"
          - "increments Manuscript.version by 1"
      - from: UNDER_APPEAL
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/adjudication with outcome=OVERTURNED"
        actor: EditorInChief
        preconditions:
          - "manuscript.status == UNDER_APPEAL"
          - "appeal.state == FILED"
          - "X-User-ID != decision.decided_by_editor_id"
        side_effects:
          - "appeal.state = OVERTURNED"
          - "CASCADE LINK 2: manuscript.status = UNDER_REVIEW and review_shortfall_flag recomputed"
          - "CASCADE LINK 3 (caused by link 2): editor_assignment_selection runs over the eligible pool excluding decision.decided_by_editor_id and creates a fresh EditorAssignment in state PROPOSED, or sets manuscript.handling_gap_flag = true when the pool is empty"
          - "CASCADE LINK 4 (caused by link 3, only when an assignment was created): that Editor.active_assignment_count += 1"
          - "increments Manuscript.version by 1"
      - from: UNDER_APPEAL
        to: REJECTED
        trigger: "POST /appeals/{id}/adjudication with outcome=UPHELD"
        actor: EditorInChief
        preconditions:
          - "manuscript.status == UNDER_APPEAL"
          - "appeal.state == FILED"
          - "X-User-ID != decision.decided_by_editor_id"
        side_effects:
          - "appeal.state = UPHELD"
          - "manuscript.status = REJECTED"
          - "increments Manuscript.version by 1"
      - from: IN_PRODUCTION
        to: PUBLISHED
        trigger: "POST /production-jobs/{id}/publication"
        actor: ProductionStaff
        preconditions:
          - "manuscript.status == IN_PRODUCTION"
          - "job.content_stage == PROOF_APPROVED"
          - "job.clearance_stage == DEPOSIT_CONFIRMED"
          - "no APCInvoice for this manuscript in status ISSUED"
          - "no EthicsCase for this manuscript in state IN {OPEN, INVESTIGATION, AUTHOR_RESPONSE_REQUESTED, COMMITTEE_REVIEW}"
        side_effects:
          - "manuscript.status = PUBLISHED; publication_date set from the request; embargo_end_date computed by embargo_end_date_projection; doi minted"
          - "job.indexing_status = INDEXED and job.published_at = current_utc"
          - "journal.published_article_count += 1"
          - "increments Manuscript.version by 1 and ProductionJob.version by 1"
      - from: PUBLISHED
        to: CORRECTED
        trigger: "POST /ethics-cases/{id}/resolution with resolution=CORRECTION"
        actor: EditorInChief
        preconditions:
          - "manuscript.status == PUBLISHED"
          - "case.state == COMMITTEE_REVIEW"
        side_effects:
          - "case.state = CORRECTION_ISSUED"
          - "manuscript.status = CORRECTED"
          - "journal.published_article_count unchanged (CORRECTED still counts as published)"
          - "increments Manuscript.version by 1"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /ethics-cases/{id}/resolution with resolution=RETRACTION"
        actor: EditorInChief
        preconditions:
          - "manuscript.status IN {PUBLISHED, CORRECTED}"
          - "case.state == COMMITTEE_REVIEW"
        side_effects:
          - "CASCADE LINK 1: case.state = RETRACTION_APPROVED and case.resolved_at = current_utc"
          - "CASCADE LINK 2 (caused by link 1): manuscript.status = RETRACTED (terminal) and manuscript.retracted_at = current_utc"
          - "CASCADE LINK 3 (caused by link 2): the manuscript's ProductionJob moves content_stage to TERMINATED, clearance_stage to WITHDRAWN and indexing_status to WITHDRAWN, freeing its typesetting slot occupancy"
          - "CASCADE LINK 4 (caused by link 3): journal.published_article_count -= 1 and journal.retracted_article_count += 1"
          - "increments Manuscript.version by 1 and ProductionJob.version by 1"
      - from: CORRECTED
        to: RETRACTED
        trigger: "POST /ethics-cases/{id}/resolution with resolution=RETRACTION"
        actor: EditorInChief
        preconditions:
          - "manuscript.status == CORRECTED"
          - "case.state == COMMITTEE_REVIEW"
        side_effects:
          - "identical four-link cascade as PUBLISHED -> RETRACTED"
          - "increments Manuscript.version by 1"

  - entity: EditorAssignment
    initial_state: PROPOSED
    terminal_states: [RECUSED, RELEASED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /editor-assignments/{id}/conflict-declaration with declared_conflict=false"
        actor: HandlingEditor
        preconditions:
          - "assignment.state == PROPOSED"
          - "X-User-ID == assignment.editor_id"
        side_effects:
          - "assignment.state = ACTIVE; declared_conflict = false"
          - "manuscript.handling_gap_flag = false"
          - "increments EditorAssignment.version by 1"
      - from: PROPOSED
        to: RECUSED
        trigger: "POST /editor-assignments/{id}/conflict-declaration with declared_conflict=true"
        actor: HandlingEditor
        preconditions:
          - "assignment.state == PROPOSED"
          - "X-User-ID == assignment.editor_id"
          - "conflict_type is present"
        side_effects:
          - "assignment.state = RECUSED with released_reason = RECUSAL"
          - "that Editor.active_assignment_count -= 1"
          - "editor_assignment_selection runs excluding every Editor that already has a RECUSED assignment on this manuscript; on success a replacement EditorAssignment is created in PROPOSED with replaced_assignment_id set and that editor's active_assignment_count += 1; on an empty pool manuscript.handling_gap_flag = true"
          - "increments EditorAssignment.version by 1"
      - from: ACTIVE
        to: RECUSED
        trigger: "POST /editor-assignments/{id}/recusal"
        actor: HandlingEditor
        preconditions:
          - "assignment.state == ACTIVE"
          - "X-User-ID == assignment.editor_id OR the caller is an EditorInChief of manuscript.journal_id"
          - "manuscript.status NOT IN {DESK_REJECTED, RETRACTED}"
        side_effects:
          - "assignment.state = RECUSED with released_reason = RECUSAL"
          - "that Editor.active_assignment_count -= 1"
          - "replacement selection identical to the PROPOSED -> RECUSED transition"
          - "increments EditorAssignment.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system: manuscript reaches DESK_REJECTED, REJECTED or IN_PRODUCTION"
        actor: system
        preconditions:
          - "assignment.state == ACTIVE"
        side_effects:
          - "assignment.state = RELEASED with released_reason = DECISION_FINAL"
          - "that Editor.active_assignment_count -= 1"
          - "increments EditorAssignment.version by 1"

  - entity: ReviewInvitation
    initial_state: INVITED
    terminal_states: [DECLINED, EXPIRED, SUBMITTED, WITHDRAWN]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /review-invitations/{id}/response with response=ACCEPT"
        actor: Reviewer
        preconditions:
          - "invitation.state == INVITED"
          - "X-User-ID == invitation.reviewer_id"
          - "current_utc < invitation.due_at"
        side_effects:
          - "invitation.state = ACCEPTED; responded_at = current_utc"
          - "Reviewer.accepted_count += 1 and reviewer_reliability_score re-run for both variants (open_invitation_count unchanged: ACCEPTED still occupies the window)"
          - "increments ReviewInvitation.version by 1"
      - from: INVITED
        to: DECLINED
        trigger: "POST /review-invitations/{id}/response with response=DECLINE"
        actor: Reviewer
        preconditions:
          - "invitation.state == INVITED"
          - "X-User-ID == invitation.reviewer_id"
        side_effects:
          - "invitation.state = DECLINED with closed_reason = REVIEWER_DECLINED; responded_at = current_utc"
          - "Reviewer.declined_count += 1; open_invitation_count -= 1; reviewer_reliability_score re-run for both variants; a recomputed reliability_score_rolling < 40.00 with >= 3 closed invitations in the rolling window moves ACTIVE -> PROBATION"
          - "manuscript.review_shortfall_flag recomputed"
          - "increments ReviewInvitation.version by 1"
      - from: INVITED
        to: EXPIRED
        trigger: "system: POST /_ops/run-reminder-sweep with current_utc >= invitation.due_at"
        actor: system
        preconditions:
          - "invitation.state == INVITED"
          - "current_utc >= invitation.due_at"
        side_effects:
          - "invitation.state = EXPIRED with closed_reason = SWEEP_EXPIRY"
          - "Reviewer.expired_count += 1; open_invitation_count -= 1; reviewer_reliability_score re-run; ACTIVE -> PROBATION when the new rolling score < 40.00 with >= 3 closed invitations in the rolling window"
          - "manuscript.review_shortfall_flag recomputed"
          - "increments ReviewInvitation.version by 1"
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /review-invitations/{id}/reviews"
        actor: Reviewer
        preconditions:
          - "invitation.state == ACCEPTED"
          - "X-User-ID == invitation.reviewer_id"
          - "manuscript.status IN {UNDER_REVIEW, DECISION_PENDING}"
        side_effects:
          - "a Review row is created; submitted_at = current_utc; days_late computed"
          - "invitation.state = SUBMITTED with closed_reason = REVIEW_SUBMITTED"
          - "Reviewer.submitted_count += 1; late_days_total += Review.days_late; open_invitation_count -= 1; reviewer_reliability_score re-run for both variants BEFORE Review.reliability_weight is frozen, so the weight already reflects this submission"
          - "manuscript.submitted_review_count recomputed; the UNDER_REVIEW -> DECISION_PENDING auto-transition fires when the threshold is reached"
          - "increments ReviewInvitation.version by 1"
      - from: INVITED
        to: WITHDRAWN
        trigger: "POST /review-invitations/{id}/withdraw, or the decision cascade"
        actor: HandlingEditor
        preconditions:
          - "invitation.state == INVITED"
          - "for the explicit endpoint: X-User-ID is the editor_id of the manuscript's ACTIVE EditorAssignment"
        side_effects:
          - "invitation.state = WITHDRAWN with closed_reason = EDITOR_WITHDRAWN (or DECISION_CASCADE when triggered by a decision)"
          - "Reviewer.open_invitation_count -= 1, restoring the conserved open-load quantity to its pre-invitation value; invited_count is NOT decremented"
          - "reviewer_reliability_score re-run for both variants"
          - "increments ReviewInvitation.version by 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /review-invitations/{id}/withdraw, or the decision cascade"
        actor: HandlingEditor
        preconditions:
          - "invitation.state == ACCEPTED"
          - "for the explicit endpoint: X-User-ID is the editor_id of the manuscript's ACTIVE EditorAssignment"
        side_effects:
          - "identical to INVITED -> WITHDRAWN"
          - "increments ReviewInvitation.version by 1"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /appeals/{id}/adjudication with outcome=UPHELD"
        actor: EditorInChief
        preconditions:
          - "appeal.state == FILED"
          - "the acting Editor has role_level == CHIEF and journal_id == manuscript.journal_id"
          - "X-User-ID != decision.decided_by_editor_id (segregation of duties)"
        side_effects:
          - "appeal.state = UPHELD; adjudicated_by_editor_id = X-User-ID; adjudicated_at = current_utc"
          - "manuscript.status returns to REJECTED"
          - "increments Appeal.version by 1"
      - from: FILED
        to: OVERTURNED
        trigger: "POST /appeals/{id}/adjudication with outcome=OVERTURNED"
        actor: EditorInChief
        preconditions:
          - "appeal.state == FILED"
          - "the acting Editor has role_level == CHIEF and journal_id == manuscript.journal_id"
          - "X-User-ID != decision.decided_by_editor_id (segregation of duties)"
        side_effects:
          - "appeal.state = OVERTURNED; adjudicated_by_editor_id = X-User-ID; adjudicated_at = current_utc"
          - "drives the Manuscript UNDER_APPEAL -> UNDER_REVIEW four-link cascade"
          - "increments Appeal.version by 1"

  - entity: EthicsCase
    initial_state: OPEN
    terminal_states: [RESOLVED_NO_ACTION, CORRECTION_ISSUED, RETRACTION_APPROVED]
    transitions:
      - from: OPEN
        to: INVESTIGATION
        trigger: "POST /ethics-cases/{id}/advance with to_state=INVESTIGATION"
        actor: EditorInChief
        preconditions: ["case.state == OPEN"]
        side_effects: ["case.state = INVESTIGATION", "increments EthicsCase.version by 1"]
      - from: INVESTIGATION
        to: AUTHOR_RESPONSE_REQUESTED
        trigger: "POST /ethics-cases/{id}/advance with to_state=AUTHOR_RESPONSE_REQUESTED"
        actor: EditorInChief
        preconditions: ["case.state == INVESTIGATION"]
        side_effects: ["case.state = AUTHOR_RESPONSE_REQUESTED", "increments EthicsCase.version by 1"]
        note: "Fork branch A of the OPEN -> COMMITTEE_REVIEW fan-out; authorship disputes normally take this branch."
      - from: INVESTIGATION
        to: COMMITTEE_REVIEW
        trigger: "POST /ethics-cases/{id}/advance with to_state=COMMITTEE_REVIEW"
        actor: EditorInChief
        preconditions: ["case.state == INVESTIGATION"]
        side_effects: ["case.state = COMMITTEE_REVIEW", "increments EthicsCase.version by 1"]
        note: "Fork branch B skips the author-response step; both branches join at COMMITTEE_REVIEW."
      - from: AUTHOR_RESPONSE_REQUESTED
        to: COMMITTEE_REVIEW
        trigger: "POST /ethics-cases/{id}/advance with to_state=COMMITTEE_REVIEW"
        actor: EditorInChief
        preconditions: ["case.state == AUTHOR_RESPONSE_REQUESTED"]
        side_effects: ["case.state = COMMITTEE_REVIEW", "increments EthicsCase.version by 1"]
      - from: COMMITTEE_REVIEW
        to: RESOLVED_NO_ACTION
        trigger: "POST /ethics-cases/{id}/resolution with resolution=NO_ACTION"
        actor: EditorInChief
        preconditions: ["case.state == COMMITTEE_REVIEW"]
        side_effects:
          - "case.state = RESOLVED_NO_ACTION; resolved_at = current_utc; resolution_statement stored"
          - "manuscript.status unchanged; the HIGH-severity block on decisions and production lifts because the case is no longer open"
          - "increments EthicsCase.version by 1"
      - from: COMMITTEE_REVIEW
        to: CORRECTION_ISSUED
        trigger: "POST /ethics-cases/{id}/resolution with resolution=CORRECTION"
        actor: EditorInChief
        preconditions:
          - "case.state == COMMITTEE_REVIEW"
          - "manuscript.status == PUBLISHED"
        side_effects:
          - "case.state = CORRECTION_ISSUED; resolved_at = current_utc"
          - "manuscript.status = CORRECTED; journal.published_article_count unchanged; ProductionJob.indexing_status stays INDEXED"
          - "increments EthicsCase.version by 1"
        note: "Divergent branch: correction keeps the article in the index; retraction withdraws it."
      - from: COMMITTEE_REVIEW
        to: RETRACTION_APPROVED
        trigger: "POST /ethics-cases/{id}/resolution with resolution=RETRACTION"
        actor: EditorInChief
        preconditions:
          - "case.state == COMMITTEE_REVIEW"
          - "manuscript.status IN {PUBLISHED, CORRECTED}"
        side_effects:
          - "case.state = RETRACTION_APPROVED; resolved_at = current_utc"
          - "drives the four-link retraction cascade documented on Manuscript PUBLISHED -> RETRACTED"
          - "increments EthicsCase.version by 1"

  - entity: ProductionJob
    initial_state: "content_stage=COPYEDITING & clearance_stage=LICENSE_PENDING"
    terminal_states: ["content_stage=TERMINATED", "clearance_stage=WITHDRAWN"]
    transitions:
      - from: "content_stage=COPYEDITING"
        to: "content_stage=TYPESETTING"
        trigger: "POST /production-jobs/{id}/content-advance with to_stage=TYPESETTING"
        actor: ProductionStaff
        preconditions:
          - "job.content_stage == COPYEDITING"
          - "job.slot_start is not null (a typesetting slot has been booked)"
          - "manuscript.status == IN_PRODUCTION"
        side_effects:
          - "job.content_stage = TYPESETTING"
          - "increments ProductionJob.version by 1"
        note: "First state dimension; clearance_stage is untouched by this transition."
      - from: "content_stage=TYPESETTING"
        to: "content_stage=PROOF_SENT"
        trigger: "POST /production-jobs/{id}/content-advance with to_stage=PROOF_SENT"
        actor: ProductionStaff
        preconditions:
          - "job.content_stage == TYPESETTING"
          - "manuscript.status == IN_PRODUCTION"
        side_effects:
          - "job.content_stage = PROOF_SENT; job.proof_round += 1"
          - "increments ProductionJob.version by 1"
      - from: "content_stage=PROOF_SENT"
        to: "content_stage=PROOF_APPROVED"
        trigger: "POST /production-jobs/{id}/proof-approval with approved=true"
        actor: Author
        preconditions:
          - "job.content_stage == PROOF_SENT"
          - "X-User-ID == manuscript.corresponding_author_id"
        side_effects:
          - "job.content_stage = PROOF_APPROVED"
          - "increments ProductionJob.version by 1"
      - from: "content_stage=PROOF_SENT"
        to: "content_stage=TYPESETTING"
        trigger: "POST /production-jobs/{id}/proof-approval with approved=false"
        actor: Author
        preconditions:
          - "job.content_stage == PROOF_SENT"
          - "X-User-ID == manuscript.corresponding_author_id"
          - "job.proof_round < journal.max_proof_rounds"
        side_effects:
          - "job.content_stage = TYPESETTING (proof-rejection loop on the content dimension)"
          - "increments ProductionJob.version by 1"
      - from: "clearance_stage=LICENSE_PENDING"
        to: "clearance_stage=FEE_CLEARED"
        trigger: "system: POST /apc-invoices/{id}/settlement with action=PAY or WAIVE, or an invoice issued with total_due_cents == 0"
        actor: system
        preconditions:
          - "job.clearance_stage == LICENSE_PENDING"
          - "no APCInvoice for this manuscript remains in status ISSUED"
        side_effects:
          - "job.clearance_stage = FEE_CLEARED"
          - "increments ProductionJob.version by 1"
        note: "Second state dimension; content_stage is untouched, so a job can be FEE_CLEARED while still COPYEDITING."
      - from: "clearance_stage=FEE_CLEARED"
        to: "clearance_stage=DEPOSIT_CONFIRMED"
        trigger: "POST /production-jobs/{id}/archival-deposit"
        actor: ProductionStaff
        preconditions:
          - "job.clearance_stage == FEE_CLEARED"
          - "manuscript.status == IN_PRODUCTION"
        side_effects:
          - "job.clearance_stage = DEPOSIT_CONFIRMED; archival_repository and deposit_reference stored"
          - "increments ProductionJob.version by 1"
      - from: "content_stage=PROOF_APPROVED & clearance_stage=DEPOSIT_CONFIRMED"
        to: "content_stage=PROOF_APPROVED & clearance_stage=DEPOSIT_CONFIRMED (published)"
        trigger: "POST /production-jobs/{id}/publication"
        actor: ProductionStaff
        preconditions:
          - "both dimensions are at their final non-terminal value, which is the join condition for publication"
        side_effects:
          - "drives the Manuscript IN_PRODUCTION -> PUBLISHED transition; job.indexing_status = INDEXED; job.published_at = current_utc"
          - "increments ProductionJob.version by 1"
      - from: "any content_stage & any clearance_stage"
        to: "content_stage=TERMINATED & clearance_stage=WITHDRAWN"
        trigger: "system: retraction cascade from EthicsCase RETRACTION_APPROVED"
        actor: system
        preconditions:
          - "manuscript.status becomes RETRACTED"
        side_effects:
          - "job.content_stage = TERMINATED; job.clearance_stage = WITHDRAWN; job.indexing_status = WITHDRAWN; the slot_start/slot_end occupancy no longer blocks other slot bookings"
          - "increments ProductionJob.version by 1"

  - entity: APCInvoice
    initial_state: ISSUED
    terminal_states: [PAID, WAIVED, CANCELLED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /apc-invoices/{id}/settlement with action=PAY"
        actor: ProductionStaff
        preconditions:
          - "invoice.status == ISSUED"
          - "invoice.total_due_cents > 0"
        side_effects:
          - "invoice.status = PAID; settled_at = current_utc"
          - "journal.apc_receivable_cents -= invoice.total_due_cents"
          - "the manuscript's ProductionJob advances clearance_stage LICENSE_PENDING -> FEE_CLEARED"
          - "increments APCInvoice.version by 1"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /apc-invoices/{id}/settlement with action=WAIVE"
        actor: SystemAdmin
        preconditions:
          - "invoice.status == ISSUED"
          - "waiver_reason is a non-empty string"
        side_effects:
          - "invoice.status = WAIVED; settled_at = current_utc"
          - "journal.apc_receivable_cents -= invoice.total_due_cents and journal.apc_waived_cents += invoice.total_due_cents"
          - "the manuscript's ProductionJob advances clearance_stage LICENSE_PENDING -> FEE_CLEARED"
          - "increments APCInvoice.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /apc-invoices/{id}/settlement with action=CANCEL"
        actor: ProductionStaff
        preconditions:
          - "invoice.status == ISSUED"
          - "the manuscript has no ProductionJob yet, or its ProductionJob.clearance_stage is still LICENSE_PENDING"
        side_effects:
          - "invoice.status = CANCELLED; settled_at = current_utc"
          - "journal.apc_receivable_cents -= invoice.total_due_cents, restoring the conserved receivable ledger to its pre-issue value; journal.apc_waived_cents unchanged"
          - "clearance_stage stays LICENSE_PENDING, so a corrected invoice can be issued"
          - "increments APCInvoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: editor-assignment-create-stale-manuscript
    parent_entity: Manuscript
    write_endpoint: "POST /editor-assignments"
    occ_field: "expected_manuscript_version"
    description: |
      Creating an EditorAssignment against a Manuscript whose version has
      advanced since the client last read it is rejected. A second assignment
      legitimately supersedes an earlier PROPOSED one under the reassignment
      rule, so the stale-version check is the only thing that distinguishes a
      deliberate reassignment from one written against an outdated view of the
      manuscript (for example after an integrity screening changed
      integrity_status, or after a recusal cascade rewired the handling editor).
    error_id: ERR_STALE_MANUSCRIPT_VERSION
    http_status: 412
  - rule_id: apc-invoice-issue-stale-manuscript
    parent_entity: Manuscript
    write_endpoint: "POST /manuscripts/{id}/apc-invoices"
    occ_field: "expected_manuscript_version"
    description: |
      Issuing an APCInvoice against a Manuscript whose version has advanced
      since the client last read it is rejected. Re-issuing an invoice after a
      cancelled one is a legitimate operation, so nothing in the invoice state
      machine rejects a second issue; the stale-version check is what stops an
      invoice being priced from an outdated view of the manuscript's license,
      page count or author waiver band.
    error_id: ERR_STALE_MANUSCRIPT_VERSION
    http_status: 412
  - rule_id: typeset-slot-book-stale-job
    parent_entity: ProductionJob
    write_endpoint: "POST /production-jobs/{id}/typeset-slot"
    occ_field: "expected_production_job_version"
    description: |
      Booking a typesetting slot on a ProductionJob whose version has advanced
      since the client last read it is rejected. A later booking legitimately
      supersedes the previous slot (rebooking is allowed while content_stage is
      COPYEDITING or TYPESETTING), so only the stale-version check separates an
      intentional rebooking from one written against an outdated job view.
    error_id: ERR_STALE_PRODUCTION_JOB_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reviewer_reliability_score
    trigger: "Every ReviewInvitation state change that CLOSES an invitation (decline, sweep expiry, review submission, withdrawal, including the withdrawals fired by the decision cascade); both variants are recomputed and written to Reviewer.reliability_score_rolling and Reviewer.reliability_score_lifetime in the same request."
    algorithm: weighted_scoring
    formula: |
      # W is the CLOSED-invitation set selected by the active variant (see `variants:`).
      # Only closed invitations score: an invitation still INVITED or ACCEPTED is
      # in flight and contributes nothing, so a fresh reviewer holding open
      # invitations keeps the neutral seed instead of being punished for silence.
      CLOSED_STATES = {DECLINED, EXPIRED, SUBMITTED, WITHDRAWN}
      n_closed    = count(inv in W)
      n_submitted = count(inv in W where inv.state == SUBMITTED)
      n_expired   = count(inv in W where inv.state == EXPIRED)
      n_on_time   = count(inv in W where inv.state == SUBMITTED and its Review.days_late == 0)
      late_days   = sum(Review.days_late for inv in W where inv.state == SUBMITTED)

      if n_closed == 0:
          score = 50.00                                    # neutral seed, also the create-time default
      else:
          delivery_rate       = n_submitted / n_closed                 # exact rational, no intermediate rounding
          on_time_rate        = (n_on_time / n_submitted) if n_submitted > 0 else 0
          responsiveness_rate = 1 - (n_expired / n_closed)             # declining promptly costs nothing; lapsing does
          lateness_penalty    = min(MAX_LATENESS_PENALTY, LATE_DAY_PENALTY * late_days)
          raw = 100 * (W_DELIVERY * delivery_rate
                       + W_ON_TIME * on_time_rate
                       + W_RESPONSIVENESS * responsiveness_rate)
                - lateness_penalty
          score = round_half_up(max(0.0, min(100.0, raw)), 2)

      # Status cascade evaluated after the ROLLING variant is written:
      #   ACTIVE -> PROBATION  when reliability_score_rolling < PROBATION_FLOOR
      #                        AND n_closed(ROLLING) >= PROBATION_MIN_CLOSED
      #   PROBATION -> ACTIVE  when reliability_score_rolling >= REINSTATE_CEILING
      #   RETIRED is never changed by this calculation
    input_set: "Closed ReviewInvitation rows of the reviewer regardless of manuscript or journal; INVITED and ACCEPTED invitations are excluded entirely, and a WITHDRAWN invitation counts as a closed non-delivery, which is why the decision cascade's withdrawals move a reviewer's score."
    constants:
      W_DELIVERY: 0.45
      W_ON_TIME: 0.35
      W_RESPONSIVENESS: 0.20
      LATE_DAY_PENALTY: 2.5
      MAX_LATENESS_PENALTY: 20.0
      PROBATION_FLOOR: 40.0
      PROBATION_MIN_CLOSED: 3
      REINSTATE_CEILING: 60.0
      ROLLING_WINDOW_DAYS: 180
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"
    variants:
      - name: ROLLING
        when: "Written to Reviewer.reliability_score_rolling; also the score the reviewer selector ranks on, the source of Review.reliability_weight, and the only variant the PROBATION guard reads."
        difference: "W = closed invitations whose created_at >= current_utc - 180 days (inclusive lower bound)."
      - name: LIFETIME
        when: "Written to Reviewer.reliability_score_lifetime; reported for audit and used for nothing else."
        difference: "W = every closed invitation of the reviewer ever created, so behaviour older than 180 days keeps its full weight and the two variants disagree whenever conduct changed across that boundary."

  - name: decision_consensus_index
    trigger: "POST /manuscripts/{id}/decisions, before the decision category is resolved; written to Decision.consensus_index, Decision.auto_category and Manuscript.consensus_index_at_last_decision."
    algorithm: weighted_scoring
    formula: |
      REC_VALUE = { ACCEPT: 4, MINOR_REVISION: 3, MAJOR_REVISION: 2, REJECT: 1 }
      # Review.reliability_weight is frozen at review-submission time, AFTER that
      # submission has already been folded into the reviewer's rolling score:
      #   reliability_weight = max(MIN_WEIGHT,
      #                            round_half_up(reviewer.reliability_score_rolling / 100, 4))
      R = Review rows r such that r.invitation.manuscript_id == manuscript.id
          AND r.invitation.round == manuscript.revision_round
          AND r.invitation.state == SUBMITTED
      n = count(R)                                    # n >= journal.min_completed_reviews_for_decision is a precondition
      if journal.consensus_mode == UNWEIGHTED:
          index = round_half_up(sum(REC_VALUE[r.recommendation] for r in R) / n, 2)
      else:                                            # RELIABILITY_WEIGHTED
          num = sum(REC_VALUE[r.recommendation] * r.reliability_weight for r in R)
          den = sum(r.reliability_weight for r in R)
          index = round_half_up(num / den, 2)
      auto_category = ACCEPT          if index >= 3.50
                 else MINOR_REVISION  if index >= 2.50
                 else MAJOR_REVISION  if index >= 1.75
                 else REJECT
      # The stored Decision.category equals the request's category when supplied
      # (category_source = EXPLICIT) and equals auto_category otherwise
      # (category_source = AUTO). auto_category is recorded either way.
    input_set: "Only the current round's SUBMITTED invitations; reviews from earlier rounds and invitations in DECLINED, EXPIRED or WITHDRAWN are excluded."
    constants:
      ACCEPT_THRESHOLD: 3.50
      MINOR_THRESHOLD: 2.50
      MAJOR_THRESHOLD: 1.75
      MIN_WEIGHT: 0.25
    precision: "2 decimal places, round_half_up; thresholds are inclusive lower bounds (>=), so an index of exactly 2.50 resolves to MINOR_REVISION"
    variants:
      - name: UNWEIGHTED
        when: "journal.consensus_mode == UNWEIGHTED (the default)"
        difference: "Every review counts exactly 1; a low-reliability reviewer moves the index as much as a perfect one."
      - name: RELIABILITY_WEIGHTED
        when: "journal.consensus_mode == RELIABILITY_WEIGHTED"
        difference: "Each review is weighted by its frozen Review.reliability_weight, so the same review set can land in a different auto_category band than the UNWEIGHTED variant."

  - name: apc_net_amount
    trigger: "POST /manuscripts/{id}/apc-invoices; writes APCInvoice.base_cents, waiver_pct, waiver_cents, institutional_pct, institutional_cents, net_apc_cents and auto_waived."
    algorithm: waterfall_allocation
    formula: |
      LICENSE_MULTIPLIER = { CC_BY: 1.00, CC_BY_NC: 0.90, CC_BY_NC_ND: 0.85, GREEN_SELF_ARCHIVE: 0.00 }
      WAIVER_PCT         = { HIGH: 0, UPPER_MIDDLE: 25, LOWER_MIDDLE: 50, LOW: 100 }

      # STEP 1 — round the license-adjusted list price to whole cents FIRST
      base_cents = round_half_up(journal.apc_base_cents * LICENSE_MULTIPLIER[manuscript.oa_license])
      # STEP 2 — income-band waiver computed on base_cents, rounded to cents
      waiver_pct   = WAIVER_PCT[author.country_income_band]
      waiver_cents = round_half_up(base_cents * waiver_pct / 100)
      # STEP 3 — institutional discount computed on the POST-WAIVER REMAINDER
      #          (base_cents - waiver_cents), NOT on base_cents, and rounded
      #          to cents on its own before subtraction. This ordering is
      #          pinned: computing both discounts against base_cents and
      #          subtracting them together yields a different number of cents.
      institutional_pct   = 15 if author.institutional_agreement else 0
      institutional_cents = round_half_up((base_cents - waiver_cents) * institutional_pct / 100)
      # STEP 4 — net
      net_apc_cents = base_cents - waiver_cents - institutional_cents
      # STEP 5 — small-balance write-off, strict inequality on the floor
      auto_waived = false
      if 0 < net_apc_cents < MIN_BILLABLE_CENTS:
          net_apc_cents = 0
          auto_waived = true
    input_set: "The manuscript's own oa_license and the corresponding Author's country_income_band / institutional_agreement as they stand at issue time; nothing is read from earlier invoices."
    constants:
      MIN_BILLABLE_CENTS: 2000
      INSTITUTIONAL_PCT: 15
    precision: "integer cents throughout; each of steps 1, 2 and 3 rounds half-up to a whole cent before the next step consumes it"

  - name: invoice_total_with_surcharge
    trigger: "POST /manuscripts/{id}/apc-invoices, immediately after apc_net_amount; writes raw_surcharge_cents, provisional_total_cents, surcharge_relief_pct, surcharge_cents and total_due_cents."
    algorithm: threshold
    formula: |
      # STEP 1 — raw surcharge from the billed pages and color figures
      raw_surcharge_cents = page_charge_count * journal.page_charge_cents_per_page
                          + color_figure_count * journal.color_figure_charge_cents
      # STEP 2 — the relief bracket is keyed on the PROVISIONAL total, which is
      #          the only reading of the total the bracket ever sees
      provisional_total_cents = net_apc_cents + raw_surcharge_cents
      surcharge_relief_pct = 20 if provisional_total_cents >= RELIEF_TIER_2_CENTS
                        else 10 if provisional_total_cents >= RELIEF_TIER_1_CENTS
                        else 0
      # STEP 3 — relief applies to the surcharge only
      surcharge_cents = raw_surcharge_cents
                      - round_half_up(raw_surcharge_cents * surcharge_relief_pct / 100)
      # STEP 4 — final amount. EVALUATION ORDER IS PINNED: the bracket is NOT
      #          re-derived from total_due_cents even when the relief pushes the
      #          total back below the bracket floor. Exactly one pass.
      total_due_cents = net_apc_cents + surcharge_cents
    input_set: "net_apc_cents from apc_net_amount plus the page_charge_count / color_figure_count supplied on the issue request; journal rates are read at issue time."
    constants:
      RELIEF_TIER_1_CENTS: 150000
      RELIEF_TIER_2_CENTS: 250000
    precision: "integer cents; the single round_half_up in step 3 is the only rounding, and tier floors are inclusive (>=)"

  - name: editor_assignment_selection
    trigger: "POST /editor-assignments when editor_id is omitted, and inside the recusal / appeal-overturn cascades that need a replacement handling editor."
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter — explicit predicate over Editor fields
      candidates = Editor rows e where
            e.journal_id == manuscript.journal_id
        AND e.status == ACTIVE
        AND e.role_level == HANDLING
        AND manuscript.subject_area IN e.subject_areas
        AND e.active_assignment_count < e.max_concurrent_assignments
        AND e.email != correspondingAuthor.email
        AND e.email NOT IN manuscript.coauthor_emails
        AND e.affiliation != correspondingAuthor.affiliation
        AND no EditorAssignment exists with manuscript_id == manuscript.id
            AND editor_id == e.id AND state == RECUSED
        AND (when invoked from the appeal-overturn cascade) e.id != decision.decided_by_editor_id
      # (b) ranking expression — lowest relative workload first
      sort key 1: workload_ratio = e.active_assignment_count / e.max_concurrent_assignments  ASC
      # (c) tie-breaks, in order
      sort key 2: e.max_concurrent_assignments DESC
      sort key 3: e.created_at ASC
      # (d) empty candidate set
      #     direct call  -> ERR_NO_ELIGIBLE_EDITOR (409)
      #     cascade call -> no assignment is created and manuscript.handling_gap_flag = true
      winner = first row after sorting
    input_set: "All Editor rows of the manuscript's journal; workload_ratio reads the live active_assignment_count, which counts PROPOSED and ACTIVE assignments."
    constants: {}
    precision: "workload_ratio compared as an exact rational; no rounding"

  - name: reviewer_invitation_selection
    trigger: "POST /review-invitations when reviewer_id is omitted."
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter
      candidates = Reviewer rows r where
            r.status == ACTIVE
        AND manuscript.subject_area IN r.subject_areas
        AND r.email != correspondingAuthor.email
        AND r.email NOT IN manuscript.coauthor_emails
        AND r.affiliation != correspondingAuthor.affiliation
        AND r.email != (email of the Editor holding the manuscript's ACTIVE EditorAssignment)
        AND no ReviewInvitation exists with manuscript_id == manuscript.id
            AND reviewer_id == r.id AND state IN {INVITED, ACCEPTED, SUBMITTED}
        AND overlapping_open_windows(r, new_window) < journal.reviewer_concurrent_window_limit
      # (b) ranking expression
      sort key 1: r.reliability_score_rolling DESC
      # (c) tie-breaks, in order
      sort key 2: r.open_invitation_count ASC
      sort key 3: r.created_at ASC
      # (d) empty candidate set -> ERR_NO_ELIGIBLE_REVIEWER (409)
      winner = first row after sorting
    input_set: "The global Reviewer table (the society reviewer database is shared across journals); PROBATION and RETIRED reviewers are never auto-selected, though PROBATION reviewers remain invitable by explicit reviewer_id."
    constants: {}
    precision: "reliability_score_rolling compared at its stored 2-decimal precision"

  - name: reviewer_window_occupancy
    trigger: "POST /review-invitations (both explicit and selector paths), before the invitation row is created."
    algorithm: interval_merge
    formula: |
      new_window      = [current_utc, current_utc + due_days days)         # HALF-OPEN
      existing_window = [inv.invited_at, inv.due_at)                       # HALF-OPEN, per open invitation
      overlaps(a, b)  = a.start < b.end AND b.start < a.end                # strict on both sides,
                                                                           # so touching windows do NOT overlap
      occupied = count(inv where inv.reviewer_id == reviewer.id
                              AND inv.state IN {INVITED, ACCEPTED}
                              AND overlaps(new_window, [inv.invited_at, inv.due_at)))
      if occupied >= journal.reviewer_concurrent_window_limit:
          reject with ERR_REVIEWER_WINDOW_CAPACITY        # aggregate capacity, not exclusivity
    input_set: "Only the invited reviewer's own invitations in state INVITED or ACCEPTED, across every journal and manuscript; closed invitations release their window immediately."
    constants:
      DEFAULT_DUE_DAYS_SOURCE: "journal.review_target_days"
    precision: "millisecond timestamps; adjacency (new_window.start == existing_window.end) is explicitly non-overlapping"

  - name: typeset_slot_occupancy
    trigger: "POST /production-jobs/{id}/typeset-slot, before slot_start / slot_end are written."
    algorithm: interval_merge
    formula: |
      new_slot      = [slot_start, slot_end]                    # CLOSED at both ends, whole dates
      existing_slot = [job.slot_start, job.slot_end]            # CLOSED, per other job of the same journal
      buffer        = journal.typeset_changeover_buffer_days
      conflicts(new, existing) =
              new.start <= existing.end + buffer days
          AND existing.start <= new.end + buffer days
      # Capacity is exactly 1: the journal runs a single typesetting desk, so any
      # conflicting occupancy is fatal rather than counted.
      blockers = other ProductionJob rows j where
            j.manuscript.journal_id == manuscript.journal_id
        AND j.id != this job.id
        AND j.slot_start is not null
        AND j.content_stage NOT IN {TERMINATED}
        AND conflicts(new_slot, [j.slot_start, j.slot_end])
      if slot_end < slot_start:            reject with ERR_INVALID_INTERVAL
      if count(blockers) > 0:              reject with ERR_TYPESET_SLOT_CONFLICT
    input_set: "ProductionJob rows of the same journal whose content_stage != TERMINATED and whose slot dates are set; a retracted job's slot is released because its content_stage becomes TERMINATED."
    constants: {}
    precision: "whole calendar dates; both endpoints inclusive and the buffer is applied symmetrically, so the first legal start is existing.end + buffer + 1 day"

  - name: review_lateness_and_reminder_sweep
    trigger: "POST /_ops/run-reminder-sweep for one journal, and (for days_late only) POST /review-invitations/{id}/reviews."
    algorithm: chronological
    formula: |
      days_late(review) = max(0, ceil((review.submitted_at - invitation.due_at) / 86_400_000 ms))
      # Sweep: process the journal's invitations in state INVITED ordered by
      # created_at ASC (created_at is unique per row at millisecond precision;
      # never order by id), and apply exactly one action per invitation:
      for inv in [invitations of this journal's manuscripts where state == INVITED] ordered by created_at ASC:
          if current_utc >= inv.due_at:                                  # inclusive: due_at itself expires
              expire(inv)                                                # -> EXPIRED, reviewer counters, reliability
          else:
              anchor = inv.last_reminder_at if inv.last_reminder_at is not null else inv.invited_at
              if inv.reminder_count < journal.max_reminders_per_invitation
                 AND current_utc >= anchor + journal.reminder_cadence_days days:   # inclusive boundary
                  inv.reminder_count += 1
                  inv.last_reminder_at = current_utc
      return { reminded_invitation_count, expired_invitation_count,
               probation_reviewer_count,           # reviewers moved ACTIVE -> PROBATION by this sweep
               shortfall_manuscript_ids }          # manuscripts whose review_shortfall_flag became true
    input_set: "Only invitations in state INVITED whose manuscript belongs to the swept journal; ACCEPTED invitations are never expired (an accepted reviewer may submit late and accrue days_late instead)."
    constants:
      MS_PER_DAY: 86400000
    precision: "integer days; both the expiry test and the cadence test use inclusive >= comparisons"

  - name: integrity_verdict_rollup
    trigger: "POST /manuscripts/{id}/integrity-screenings and POST /manuscripts/{id}/revisions; writes Manuscript.integrity_status."
    algorithm: aggregation
    formula: |
      per-screening verdict:
        PLAGIARISM:      BLOCK if similarity_pct >= 40.0 else FLAG if similarity_pct >= 20.0 else PASS
        IMAGE_FORENSICS: BLOCK if manipulated_figure_count >= 2 else FLAG if manipulated_figure_count == 1 else PASS
      S = IntegrityScreening rows where manuscript_id == manuscript.id
                                   AND round == manuscript.revision_round
      integrity_status = PENDING                        if count(S) == 0
                    else BLOCK                          if any s in S has verdict == BLOCK
                    else FLAG                           if any s in S has verdict == FLAG
                    else PASS
      # A BLOCK verdict also auto-opens an EthicsCase (opened_by = SCREENING_CASCADE,
      # severity = HIGH, case_type = PLAGIARISM for a plagiarism scan and
      # IMAGE_INTEGRITY for an image scan) unless an unresolved case with that
      # same case_type already exists for the manuscript.
    input_set: "Screenings of the current revision_round only; screenings from earlier rounds are retained for audit but never re-enter the rollup."
    constants:
      PLAGIARISM_BLOCK_PCT: 40.0
      PLAGIARISM_FLAG_PCT: 20.0
      IMAGE_BLOCK_FIGURES: 2
    precision: "similarity_pct compared at 2 decimals with inclusive thresholds (>=); severity order BLOCK > FLAG > PASS"

  - name: embargo_end_date_projection
    trigger: "POST /production-jobs/{id}/publication; writes Manuscript.embargo_end_date."
    algorithm: interval_merge
    formula: |
      if manuscript.oa_license == GREEN_SELF_ARCHIVE:
          y, m, d = parts of publication_date
          target_month = m + journal.embargo_months               # normalised into (year, month)
          last_day = last calendar day of target_month
          embargo_end_date = date(target_year, target_month, min(d, last_day))   # end-of-month clamping
      else:
          embargo_end_date = publication_date                     # immediate open access
    input_set: "The publication_date supplied on the publication request and the journal's embargo_months at that moment."
    constants: {}
    precision: "whole dates, ISO YYYY-MM-DD; day-of-month is clamped down to the target month's last day (2027-01-31 + 1 month = 2027-02-28)"

  - name: journal_metrics_rollup
    trigger: "GET /journals/{id}/metrics (computed on read, never stored)."
    algorithm: aggregation
    formula: |
      M   = Manuscript rows where journal_id == journal.id                    # every status
      DEC = M rows whose status IN {DESK_REJECTED, REJECTED, IN_PRODUCTION, PUBLISHED, CORRECTED, RETRACTED}
      ACC = M rows whose status IN {IN_PRODUCTION, PUBLISHED, CORRECTED, RETRACTED}
      INV = ReviewInvitation rows whose manuscript_id IN M
      submitted_count      = count(M)
      desk_rejected_count  = count(M where status == DESK_REJECTED)
      published_count      = count(M where status IN {PUBLISHED, CORRECTED})
      retracted_count      = count(M where status == RETRACTED)
      acceptance_rate_pct  = 0.00 if count(DEC) == 0
                             else round_half_up(100 * count(ACC) / count(DEC), 2)
      # first-decision latency, in whole days, over manuscripts that have at least
      # one Decision; the first Decision is the one with the smallest created_at
      d_list = sorted([ ceil((first Decision.created_at - m.created_at) / 86_400_000) for m in M with decision_count > 0 ]) ASC
      median_days_to_first_decision = null                       if len(d_list) == 0
              else d_list[(len-1)/2]                             if len is odd
              else round_half_up((d_list[len/2 - 1] + d_list[len/2]) / 2, 2)
      reviewer_invitation_acceptance_rate_pct =
              0.00 if count(INV) == 0
              else round_half_up(100 * count(INV where state IN {ACCEPTED, SUBMITTED}) / count(INV), 2)
      reviewers_on_probation_count = count(Reviewer rows where status == PROBATION)   # global reviewer database
      apc_receivable_cents = journal.apc_receivable_cents
      apc_waived_cents     = journal.apc_waived_cents
    input_set: "Explicit status filters above; RETRACTED manuscripts still count as accepted for the acceptance-rate denominator and numerator, and reviewer probation is counted across the whole reviewer database rather than per journal."
    constants:
      MS_PER_DAY: 86400000
    precision: "percentages and the median to 2 decimals, round_half_up; every empty aggregate yields 0.00 except the median, which yields null"

# =============================================================================
# §1.4 Validation Rules (ordered — priority 1 is evaluated first and its error
# is the one returned whenever two or more rules are violated by the same
# request; evaluation stops at the first violated rule)
# =============================================================================
validations:
  - priority: 1
    check: "The X-User-Role header must be present and must name one of the six declared roles."
    category: auth
    error_id: ERR_ROLE_HEADER_MISSING
    http_status: 400
    applies_to: "every endpoint"

  - priority: 2
    check: "The X-User-Role must be listed in the target endpoint's roles."
    category: auth
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint"

  - priority: 3
    check: "For an entity_backed role, X-User-ID must be present and must resolve to an existing row of that role's backing entity (Editor, Reviewer or Author)."
    category: auth
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "every endpoint whose roles include EditorInChief, HandlingEditor, Reviewer or Author"

  - priority: 4
    check: "Every path parameter must reference an existing row of its entity."
    category: existence
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    check: "Every foreign key supplied in the body must reference an existing row of the target entity."
    category: existence
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "every write endpoint carrying a foreign key"

  - priority: 6
    check: "A referenced child must belong to the parent named in the path (a Review's invitation, an invitation's manuscript, a job's manuscript, an invoice's manuscript)."
    category: business_referential
    error_id: ERR_PARENT_MISMATCH
    http_status: 409
    applies_to: "POST /review-invitations/{id}/reviews, POST /manuscripts/{id}/decisions, POST /production-jobs/{id}/publication, POST /manuscripts/{id}/apc-invoices"

  - priority: 7
    check: "The request body must contain every required field, each field must have its declared JSON type, enum fields must carry a declared member, monetary and count fields must be non-negative integers, and percentage fields must fall in [0, 100]."
    category: business_constraint
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every write endpoint"

  - priority: 8
    check: "An interval must not end before it starts (slot_end >= slot_start, due_at > invited_at)."
    category: business_temporal
    error_id: ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: "POST /production-jobs/{id}/typeset-slot, POST /review-invitations"

  - priority: 9
    check: "When an OCC-guarded write supplies expected_<parent>_version, it must equal the parent's current version."
    category: business_constraint
    error_id: "the concurrency rule's declared error_id (ERR_STALE_MANUSCRIPT_VERSION / ERR_STALE_PRODUCTION_JOB_VERSION)"
    http_status: 412
    applies_to: "POST /editor-assignments, POST /manuscripts/{id}/apc-invoices, POST /production-jobs/{id}/typeset-slot"

  - priority: 10
    check: "Unique keys must not collide: (Journal.name), (Editor.journal_id, Editor.email), (Reviewer.email), (Author.email), at most one ProductionJob per manuscript, at most one IntegrityScreening per (manuscript_id, round, scan_type), and at most one unresolved EthicsCase per (manuscript_id, case_type)."
    category: business_constraint
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /journals, POST /editors, POST /reviewers, POST /authors, POST /manuscripts/{id}/integrity-screenings, POST /manuscripts/{id}/ethics-cases"

  - priority: 11
    check: "The acting entity_backed identity must own the resource it addresses: an Author may only act on manuscripts whose corresponding_author_id is that Author, and a Reviewer may only submit a review for an invitation whose reviewer_id is that Reviewer."
    category: auth
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /manuscripts/{id}/revisions, POST /appeals, POST /review-invitations/{id}/response, POST /review-invitations/{id}/reviews, POST /production-jobs/{id}/proof-approval"

  - priority: 12
    check: "Segregation of duties: the X-User-ID deciding an appeal must differ from the Editor who issued the appealed Decision, and the X-User-ID resolving an EthicsCase must differ from the Editor who opened it."
    category: auth
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/adjudication, POST /ethics-cases/{id}/resolution"

  - priority: 13
    check: "The subject entity must currently sit in a state from which the requested trigger is declared in §1.2. Carve-out A: for POST /production-jobs/{id}/publication the stage gate is rule 15 (ERR_PRODUCTION_STAGE_NOT_READY), which is evaluated instead of this rule. Carve-out B: for POST /review-invitations/{id}/reviews the invitation-state gate is rule 27 (ERR_INVITATION_NOT_ACCEPTED), which is evaluated instead of this rule, so a review attempted on an invitation in any state other than ACCEPTED (INVITED, DECLINED, EXPIRED, SUBMITTED or WITHDRAWN) returns ERR_INVITATION_NOT_ACCEPTED rather than ERR_INVALID_INVITATION_STATE."
    category: state
    error_id: "ERR_INVALID_<ENTITY>_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 14
    check: "A terminal state accepts no further transitions (DESK_REJECTED and RETRACTED manuscripts, RESOLVED_* ethics cases, UPHELD/OVERTURNED appeals, PAID/WAIVED/CANCELLED invoices)."
    category: state
    error_id: ERR_TERMINAL_STATE_LOCKED
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 15
    check: "Publication requires ProductionJob.content_stage == PROOF_APPROVED and clearance_stage == DEPOSIT_CONFIRMED (the join condition across both parallel dimensions)."
    category: state
    error_id: ERR_PRODUCTION_STAGE_NOT_READY
    http_status: 409
    applies_to: "POST /production-jobs/{id}/publication"

  - priority: 16
    check: "An integrity BLOCK verdict on the current round bars advancing the manuscript to review; the manuscript must be desk-rejected or cleared by a resolved ethics case first."
    category: business_safety
    error_id: ERR_INTEGRITY_BLOCK
    http_status: 409
    applies_to: "POST /manuscripts/{id}/screening-decision"

  - priority: 17
    check: "An unresolved EthicsCase of severity HIGH freezes decision issuance, publication and invoice issuance for its manuscript."
    category: business_safety
    error_id: ERR_ETHICS_HOLD
    http_status: 409
    applies_to: "POST /manuscripts/{id}/decisions, POST /production-jobs/{id}/publication, POST /manuscripts/{id}/apc-invoices"

  - priority: 18
    check: "A manuscript may only advance to review when its formatting_status == COMPLIANT (page_count <= journal.max_page_count, figure_count <= journal.max_figure_count, and a data availability statement present when the journal requires one)."
    category: business_constraint
    error_id: ERR_FORMATTING_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /manuscripts/{id}/screening-decision"

  - priority: 19
    check: "An editor assignment requires a completed conflict declaration with declared_conflict == false before the assignment can become ACTIVE, and an editor who has declared a conflict on the manuscript can never be reassigned to it."
    category: business_constraint
    error_id: ERR_EDITOR_CONFLICT_DECLARED
    http_status: 409
    applies_to: "POST /editor-assignments, POST /editor-assignments/{id}/conflict-declaration"

  - priority: 20
    check: "An editor's active_assignment_count must stay below max_concurrent_assignments, and an explicitly named editor must serve the manuscript's subject_area."
    category: business_constraint
    error_id: ERR_EDITOR_WORKLOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /editor-assignments"

  - priority: 21
    check: "A reviewer invitation must not create a conflict of interest: the reviewer's email must differ from the corresponding author's and from every coauthor email, the affiliation must differ from the corresponding author's, and the reviewer must not already hold an open invitation on this manuscript."
    category: business_constraint
    error_id: ERR_REVIEWER_CONFLICT
    http_status: 409
    applies_to: "POST /review-invitations"

  - priority: 22
    check: "The reviewer's open half-open [invited_at, due_at) windows overlapping the new window must number fewer than journal.reviewer_concurrent_window_limit."
    category: business_temporal
    error_id: ERR_REVIEWER_WINDOW_CAPACITY
    http_status: 409
    applies_to: "POST /review-invitations"

  - priority: 23
    check: "A typesetting slot must not conflict with another live job of the same journal once the symmetric typeset_changeover_buffer_days buffer is applied to the closed [slot_start, slot_end] intervals."
    category: business_temporal
    error_id: ERR_TYPESET_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /production-jobs/{id}/typeset-slot"

  - priority: 24
    check: "A decision requires at least journal.min_completed_reviews_for_decision Reviews submitted in the manuscript's current revision_round; the threshold is read live at decision time, so raising it via PATCH /journals/{id} after the manuscript reached DECISION_PENDING blocks the decision until more reviews arrive."
    category: business_constraint
    error_id: ERR_INSUFFICIENT_REVIEWS
    http_status: 409
    applies_to: "POST /manuscripts/{id}/decisions"

  - priority: 25
    check: "A revision request must not exceed journal.max_revision_rounds; the round after the last permitted one cannot be opened."
    category: business_constraint
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /manuscripts/{id}/decisions"

  - priority: 26
    check: "An appeal may only be filed against the manuscript's most recent REJECT decision, within APPEAL_WINDOW_DAYS (30) of that decision, and at most once per decision."
    category: business_temporal
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 27
    check: "A review may only be submitted for an invitation in state ACCEPTED, and its recommendation must be one of ACCEPT, MINOR_REVISION, MAJOR_REVISION, REJECT."
    category: state
    error_id: ERR_INVITATION_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /review-invitations/{id}/reviews"

  - priority: 28
    check: "Publication requires that the manuscript carry no APCInvoice in status ISSUED; the invoice must be PAID, WAIVED or CANCELLED first."
    category: business_fiscal
    error_id: ERR_UNPAID_APC_INVOICE
    http_status: 409
    applies_to: "POST /production-jobs/{id}/publication"

  - priority: 29
    check: "A settlement with action=PAY must supply amount_cents equal to the invoice's total_due_cents exactly; partial and over-payments are rejected, and an invoice whose total_due_cents == 0 cannot be paid."
    category: business_fiscal
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /apc-invoices/{id}/settlement with action=PAY"

  - priority: 30
    check: "A settlement with action=WAIVE requires a non-empty waiver_reason, and action=CANCEL requires that the manuscript either has no ProductionJob yet or that its ProductionJob is still at clearance_stage LICENSE_PENDING."
    category: business_fiscal
    error_id: ERR_WAIVER_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /apc-invoices/{id}/settlement with action=WAIVE or action=CANCEL"

  - priority: 31
    check: "An embargo may only be set for the GREEN_SELF_ARCHIVE license; CC_* licenses publish immediately and reject an embargo request."
    category: business_constraint
    error_id: ERR_EMBARGO_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /manuscripts/{id}/licensing"

  - priority: 32
    check: "An ethics resolution of CORRECTION requires manuscript.status == PUBLISHED and a resolution of RETRACTION requires manuscript.status IN {PUBLISHED, CORRECTED}; an unpublished manuscript cannot be corrected or retracted."
    category: business_referential
    error_id: ERR_RETRACTION_NOT_SUPPORTED
    http_status: 409
    applies_to: "POST /ethics-cases/{id}/resolution"

  - priority: 33
    check: "An archival deposit may only be recorded while the manuscript is IN_PRODUCTION and the job has reached clearance_stage FEE_CLEARED; a deposit cannot be recorded before the fees clear."
    category: state
    error_id: ERR_DEPOSIT_NOT_READY
    http_status: 409
    applies_to: "POST /production-jobs/{id}/archival-deposit"

  - priority: 34
    check: "The selector must find at least one eligible candidate when the caller omits the explicit id."
    category: business_constraint
    error_id: "ERR_NO_ELIGIBLE_EDITOR / ERR_NO_ELIGIBLE_REVIEWER"
    http_status: 409
    applies_to: "POST /editor-assignments, POST /review-invitations"

  - priority: 35
    check: "The logical clock may only move forward; a requested current_utc earlier than the stored clock is rejected."
    category: business_temporal
    error_id: ERR_CLOCK_REWIND
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "" — every path below is complete as written. Path parameters
# are always named {id} for the addressed resource.
# =============================================================================
endpoints:
  # --- registry / configuration -------------------------------------------
  - method: POST
    path: "/journals"
    description: "Register a society journal with its editorial, fee and production configuration."
    roles: [SystemAdmin]
    code: 201
    input: ["name", "subject_areas", "doi_prefix?", "min_completed_reviews_for_decision?", "max_revision_rounds?", "review_target_days?", "reminder_cadence_days?", "max_reminders_per_invitation?", "reviewer_concurrent_window_limit?", "consensus_mode?", "max_page_count?", "max_figure_count?", "requires_data_availability_statement?", "apc_base_cents?", "page_charge_cents_per_page?", "color_figure_charge_cents?", "embargo_months?", "typeset_changeover_buffer_days?", "max_proof_rounds?"]
    output: Journal
    side_effects:
      - "creates Journal with every omitted configuration field set to its §1.1 default"
      - "manuscript_intake_count, published_article_count, retracted_article_count, apc_receivable_cents and apc_waived_cents all start at 0"

  - method: PATCH
    path: "/journals/{id}"
    description: "Update a journal's configuration; only the supplied fields change."
    roles: [SystemAdmin]
    code: 200
    input: ["min_completed_reviews_for_decision?", "max_revision_rounds?", "review_target_days?", "reminder_cadence_days?", "max_reminders_per_invitation?", "reviewer_concurrent_window_limit?", "consensus_mode?", "max_page_count?", "max_figure_count?", "requires_data_availability_statement?", "apc_base_cents?", "page_charge_cents_per_page?", "color_figure_charge_cents?", "embargo_months?", "typeset_changeover_buffer_days?", "max_proof_rounds?"]
    output: Journal
    side_effects:
      - "updates only the supplied configuration fields"
      - "increments Journal.version by 1"
      - "already-issued Decision rows keep their frozen consensus_mode and consensus_index; already-issued APCInvoice rows keep their frozen amounts"

  - method: POST
    path: "/editors"
    description: "Register an editor on a journal at CHIEF or HANDLING level."
    roles: [SystemAdmin]
    code: 201
    input: ["journal_id", "email", "full_name", "affiliation", "subject_areas", "role_level", "status?", "max_concurrent_assignments?"]
    output: Editor
    side_effects:
      - "creates Editor with active_assignment_count = 0"

  - method: POST
    path: "/authors"
    description: "Register an author account, including the income band and institutional agreement that drive APC waivers."
    roles: [SystemAdmin]
    code: 201
    input: ["email", "full_name", "affiliation", "country_income_band?", "institutional_agreement?"]
    output: Author
    side_effects:
      - "creates Author"

  - method: POST
    path: "/reviewers"
    description: "Add a reviewer to the society reviewer database."
    roles: [SystemAdmin, EditorInChief]
    code: 201
    input: ["email", "full_name", "affiliation", "subject_areas", "status?"]
    output: Reviewer
    side_effects:
      - "creates Reviewer with every counter at 0 and both reliability variants seeded at 50.00"

  # --- submission intake ----------------------------------------------------
  - method: POST
    path: "/manuscripts"
    description: "Submit a manuscript to a journal; the acting Author becomes the corresponding author."
    roles: [Author]
    code: 201
    input: ["journal_id", "corresponding_author_id", "title", "subject_area", "oa_license", "page_count", "figure_count", "coauthor_emails?", "data_availability_statement?", "supersedes_manuscript_id?"]
    output: Manuscript
    side_effects:
      - "creates Manuscript with status = SUBMITTED, revision_round = 0 and integrity_status = PENDING"
      - "journal_sequence_number = journal.manuscript_intake_count + 1 and journal.manuscript_intake_count += 1"
      - "formatting_status computed as COMPLIANT only when page_count <= journal.max_page_count, figure_count <= journal.max_figure_count and (journal.requires_data_availability_statement == false OR data_availability_statement is a non-empty string)"
      - "corresponding_author_id must equal X-User-ID"

  - method: POST
    path: "/manuscripts/{id}/integrity-screenings"
    description: "Record a plagiarism or image-forensics screening for the manuscript's current revision round."
    roles: [SystemAdmin, HandlingEditor]
    code: 201
    input: ["scan_type", "similarity_pct?", "manipulated_figure_count?"]
    output: IntegrityScreening
    side_effects:
      - "creates IntegrityScreening with round = manuscript.revision_round and verdict from integrity_verdict_rollup"
      - "manuscript.integrity_status recomputed by integrity_verdict_rollup over the current round's screenings"
      - "a BLOCK verdict auto-opens an EthicsCase with opened_by = SCREENING_CASCADE and severity = HIGH unless an unresolved case of that case_type already exists"
      - "when the manuscript is REVISION_SUBMITTED and the new verdict is PASS or FLAG with formatting_status == COMPLIANT, the manuscript auto-transitions to UNDER_REVIEW"
      - "increments Manuscript.version by 1"

  - method: POST
    path: "/manuscripts/{id}/licensing"
    description: "Change the manuscript's open-access licence and optionally request a green-route embargo."
    roles: [Author]
    code: 200
    input: ["oa_license", "embargo_requested?"]
    output: Manuscript
    side_effects:
      - "manuscript.oa_license updated; permitted only while status NOT IN {PUBLISHED, CORRECTED, RETRACTED, DESK_REJECTED}"
      - "embargo_requested = true is rejected with ERR_EMBARGO_NOT_APPLICABLE for any CC_* licence"
      - "increments Manuscript.version by 1"

  # --- editor assignment ----------------------------------------------------
  - method: POST
    path: "/editor-assignments"
    description: "Assign a handling editor to a manuscript, either explicitly or through editor_assignment_selection. OCC-guarded on the manuscript."
    roles: [EditorInChief]
    code: 201
    input: ["manuscript_id", "expected_manuscript_version", "editor_id?"]
    output: EditorAssignment
    side_effects:
      - "creates EditorAssignment in state PROPOSED with selected_by = EXPLICIT when editor_id is supplied and SELECTOR otherwise"
      - "runs editor_assignment_selection when editor_id is omitted"
      - "that Editor.active_assignment_count += 1"
      - "increments Manuscript.version by 1"

  - method: POST
    path: "/editor-assignments/{id}/conflict-declaration"
    description: "The proposed handling editor declares whether a conflict of interest exists; a clean declaration activates the assignment."
    roles: [HandlingEditor]
    code: 200
    input: ["declared_conflict", "conflict_type?"]
    output: EditorAssignment
    side_effects:
      - "declared_conflict = false moves PROPOSED -> ACTIVE and clears manuscript.handling_gap_flag"
      - "declared_conflict = true requires conflict_type, moves PROPOSED -> RECUSED, decrements that Editor.active_assignment_count by 1, and runs the replacement-selection cascade"
      - "increments EditorAssignment.version by 1"

  - method: POST
    path: "/editor-assignments/{id}/recusal"
    description: "Recuse an active handling editor and select a replacement."
    roles: [HandlingEditor, EditorInChief]
    code: 200
    input: ["reason?"]
    output: EditorAssignment
    side_effects:
      - "assignment ACTIVE -> RECUSED with released_reason = RECUSAL and that Editor.active_assignment_count -= 1"
      - "editor_assignment_selection creates a replacement EditorAssignment in PROPOSED with replaced_assignment_id set and that editor's active_assignment_count += 1"
      - "an empty replacement pool sets manuscript.handling_gap_flag = true and creates no assignment"
      - "increments EditorAssignment.version by 1"

  - method: POST
    path: "/manuscripts/{id}/screening-decision"
    description: "The handling editor advances the manuscript to peer review or desk-rejects it after scope, formatting and integrity screening."
    roles: [HandlingEditor]
    code: 200
    input: ["action", "note?"]
    output: Manuscript
    side_effects:
      - "action = ADVANCE_TO_REVIEW moves SUBMITTED -> UNDER_REVIEW and clears review_shortfall_flag"
      - "action = DESK_REJECT moves SUBMITTED -> DESK_REJECTED (terminal) and releases the ACTIVE EditorAssignment with released_reason = DECISION_FINAL, decrementing that Editor.active_assignment_count by 1"
      - "increments Manuscript.version by 1"

  # --- reviewer invitation and review ---------------------------------------
  - method: POST
    path: "/review-invitations"
    description: "Invite a reviewer for the manuscript's current round, either explicitly or through reviewer_invitation_selection."
    roles: [HandlingEditor]
    code: 201
    input: ["manuscript_id", "reviewer_id?", "due_days?"]
    output: ReviewInvitation
    side_effects:
      - "creates ReviewInvitation in state INVITED with round = manuscript.revision_round, invited_at = current_utc and due_at = current_utc + (due_days or journal.review_target_days) days"
      - "selected_by = EXPLICIT when reviewer_id is supplied and SELECTOR otherwise"
      - "reviewer_window_occupancy enforces the aggregate half-open window capacity before the row is created"
      - "Reviewer.invited_count += 1 and open_invitation_count += 1; reviewer_reliability_score re-run for both variants"

  - method: POST
    path: "/review-invitations/{id}/response"
    description: "The invited reviewer accepts or declines."
    roles: [Reviewer]
    code: 200
    input: ["response", "decline_reason?"]
    output: ReviewInvitation
    side_effects:
      - "response = ACCEPT moves INVITED -> ACCEPTED, sets responded_at and increments Reviewer.accepted_count (open_invitation_count unchanged)"
      - "response = DECLINE moves INVITED -> DECLINED with closed_reason = REVIEWER_DECLINED, increments declined_count, decrements open_invitation_count and recomputes manuscript.review_shortfall_flag"
      - "reviewer_reliability_score re-run for both variants; a rolling score below 40.00 with at least 3 closed invitations in the rolling window moves the Reviewer ACTIVE -> PROBATION"
      - "increments ReviewInvitation.version by 1"

  - method: POST
    path: "/review-invitations/{id}/reviews"
    description: "The reviewer submits the review; lateness and the frozen reliability weight are computed here."
    roles: [Reviewer]
    code: 201
    input: ["recommendation", "novelty_score", "rigor_score", "clarity_score", "comments?"]
    output: Review
    side_effects:
      - "creates Review with submitted_at = current_utc and days_late from review_lateness_and_reminder_sweep"
      - "invitation ACCEPTED -> SUBMITTED with closed_reason = REVIEW_SUBMITTED"
      - "Reviewer.submitted_count += 1, late_days_total += days_late, open_invitation_count -= 1, and reviewer_reliability_score re-run for both variants BEFORE Review.reliability_weight is frozen from the new reliability_score_rolling / 100"
      - "manuscript.submitted_review_count recomputed; reaching journal.min_completed_reviews_for_decision auto-moves the manuscript UNDER_REVIEW -> DECISION_PENDING"
      - "increments ReviewInvitation.version by 1 and Manuscript.version by 1"

  - method: POST
    path: "/review-invitations/{id}/withdraw"
    description: "The handling editor withdraws an open invitation, releasing the reviewer's window and open load."
    roles: [HandlingEditor]
    code: 200
    input: ["reason?"]
    output: ReviewInvitation
    side_effects:
      - "invitation INVITED or ACCEPTED -> WITHDRAWN with closed_reason = EDITOR_WITHDRAWN"
      - "Reviewer.open_invitation_count -= 1 while invited_count stays as it was"
      - "reviewer_reliability_score re-run for both variants"
      - "increments ReviewInvitation.version by 1"

  # --- decisions, revisions, appeals ---------------------------------------
  - method: POST
    path: "/manuscripts/{id}/decisions"
    description: "The handling editor issues an editorial decision; the consensus index and auto_category are computed from the current round's reviews. Omitting category adopts auto_category."
    roles: [HandlingEditor]
    code: 201
    input: ["editorial_note", "category?"]
    output: Decision
    side_effects:
      - "creates Decision with round = manuscript.revision_round, decided_by_editor_id = X-User-ID, consensus_mode frozen from journal.consensus_mode, consensus_index and auto_category from decision_consensus_index, reviews_counted = the number of current-round SUBMITTED reviews, and category_source = EXPLICIT or AUTO"
      - "manuscript.consensus_index_at_last_decision = Decision.consensus_index and manuscript.decision_count += 1"
      - "MINOR_REVISION or MAJOR_REVISION moves the manuscript DECISION_PENDING -> REVISION_REQUESTED"
      - "ACCEPT moves the manuscript to IN_PRODUCTION, creates one ProductionJob at content_stage = COPYEDITING / clearance_stage = LICENSE_PENDING, and releases the ACTIVE EditorAssignment with released_reason = DECISION_FINAL"
      - "REJECT or REJECT_AND_RESUBMIT moves the manuscript to REJECTED"
      - "every ReviewInvitation of this manuscript still INVITED or ACCEPTED moves to WITHDRAWN with closed_reason = DECISION_CASCADE, in invitation created_at ASC order, each decrementing that Reviewer.open_invitation_count by 1 and re-running reviewer_reliability_score, which may move a Reviewer ACTIVE -> PROBATION"
      - "increments Manuscript.version by 1"

  - method: POST
    path: "/manuscripts/{id}/revisions"
    description: "The corresponding author submits a revised manuscript, opening the next revision round."
    roles: [Author]
    code: 200
    input: ["page_count", "figure_count", "response_letter", "data_availability_statement?"]
    output: Manuscript
    side_effects:
      - "manuscript REVISION_REQUESTED -> REVISION_SUBMITTED and revision_round += 1"
      - "page_count, figure_count and data_availability_statement replaced, so formatting_status is recomputed"
      - "integrity_status returns to PENDING because the new round has no screening yet, and submitted_review_count resets to 0 for the new round"
      - "increments Manuscript.version by 1"

  - method: POST
    path: "/appeals"
    description: "The corresponding author appeals a rejection decision."
    roles: [Author]
    code: 201
    input: ["decision_id", "grounds"]
    output: Appeal
    side_effects:
      - "creates Appeal in state FILED with manuscript_id copied from the decision"
      - "manuscript REJECTED -> UNDER_APPEAL"
      - "increments Manuscript.version by 1"

  - method: POST
    path: "/appeals/{id}/adjudication"
    description: "An editor-in-chief who did not issue the appealed decision upholds or overturns it."
    roles: [EditorInChief]
    code: 200
    input: ["outcome", "rationale?"]
    output: Appeal
    side_effects:
      - "outcome = UPHELD sets appeal.state = UPHELD and returns the manuscript to REJECTED"
      - "outcome = OVERTURNED sets appeal.state = OVERTURNED, moves the manuscript UNDER_APPEAL -> UNDER_REVIEW, runs editor_assignment_selection excluding decision.decided_by_editor_id to create a fresh PROPOSED EditorAssignment (or sets handling_gap_flag = true on an empty pool), and increments that Editor.active_assignment_count by 1"
      - "adjudicated_by_editor_id = X-User-ID and adjudicated_at = current_utc"
      - "increments Appeal.version by 1 and Manuscript.version by 1"

  # --- publication ethics ---------------------------------------------------
  - method: POST
    path: "/manuscripts/{id}/ethics-cases"
    description: "Open a publication-ethics case (authorship dispute, plagiarism, image integrity or data availability) against a manuscript."
    roles: [EditorInChief, SystemAdmin]
    code: 201
    input: ["case_type", "severity", "description"]
    output: EthicsCase
    side_effects:
      - "creates EthicsCase in state OPEN with opened_by = MANUAL"
      - "a HIGH-severity unresolved case blocks decisions, invoice issuance and publication for this manuscript"

  - method: POST
    path: "/ethics-cases/{id}/advance"
    description: "Advance an ethics case along the investigation path; INVESTIGATION may fork to AUTHOR_RESPONSE_REQUESTED or straight to COMMITTEE_REVIEW."
    roles: [EditorInChief]
    code: 200
    input: ["to_state", "note?"]
    output: EthicsCase
    side_effects:
      - "case.state = to_state when the transition is declared in §1.2"
      - "increments EthicsCase.version by 1"

  - method: POST
    path: "/ethics-cases/{id}/resolution"
    description: "Resolve an ethics case in committee review with NO_ACTION, CORRECTION or RETRACTION; the resolution drives the manuscript's post-publication outcome."
    roles: [EditorInChief]
    code: 200
    input: ["resolution", "resolution_statement"]
    output: EthicsCase
    side_effects:
      - "NO_ACTION sets case.state = RESOLVED_NO_ACTION and lifts the HIGH-severity hold"
      - "CORRECTION sets case.state = CORRECTION_ISSUED and moves the manuscript PUBLISHED -> CORRECTED while indexing_status stays INDEXED"
      - "RETRACTION sets case.state = RETRACTION_APPROVED and runs the four-link retraction cascade: manuscript -> RETRACTED with retracted_at, ProductionJob content_stage = TERMINATED / clearance_stage = WITHDRAWN / indexing_status = WITHDRAWN releasing the typesetting slot, journal.published_article_count -= 1 and journal.retracted_article_count += 1"
      - "resolved_at = current_utc; the acting X-User-ID must differ from the editor who opened the case"
      - "increments EthicsCase.version by 1"

  # --- fees and licensing ---------------------------------------------------
  - method: POST
    path: "/manuscripts/{id}/apc-invoices"
    description: "Issue an article-processing-charge invoice for the manuscript; permitted at any point while manuscript.status NOT IN {DESK_REJECTED, RETRACTED}, so fees can be billed before or during production. OCC-guarded on the manuscript."
    roles: [ProductionStaff]
    code: 201
    input: ["expected_manuscript_version", "page_charge_count?", "color_figure_count?"]
    output: APCInvoice
    side_effects:
      - "creates APCInvoice in status ISSUED with license_at_issue frozen from manuscript.oa_license"
      - "base_cents, waiver_pct, waiver_cents, institutional_pct, institutional_cents, net_apc_cents and auto_waived from apc_net_amount"
      - "raw_surcharge_cents, provisional_total_cents, surcharge_relief_pct, surcharge_cents and total_due_cents from invoice_total_with_surcharge"
      - "journal.apc_receivable_cents += total_due_cents"
      - "an invoice whose total_due_cents == 0 immediately advances the ProductionJob clearance_stage LICENSE_PENDING -> FEE_CLEARED"
      - "increments Manuscript.version by 1"

  - method: POST
    path: "/apc-invoices/{id}/settlement"
    description: "Settle an issued invoice by payment, waiver or cancellation."
    roles: [ProductionStaff, SystemAdmin]
    code: 200
    input: ["action", "amount_cents?", "waiver_reason?"]
    output: APCInvoice
    side_effects:
      - "action = PAY requires amount_cents == total_due_cents and total_due_cents > 0; status = PAID and journal.apc_receivable_cents -= total_due_cents"
      - "action = WAIVE requires a non-empty waiver_reason; status = WAIVED, journal.apc_receivable_cents -= total_due_cents and journal.apc_waived_cents += total_due_cents"
      - "action = CANCEL requires that the manuscript either has no ProductionJob yet or that its clearance_stage is still LICENSE_PENDING; status = CANCELLED and journal.apc_receivable_cents -= total_due_cents while apc_waived_cents is untouched"
      - "PAY and WAIVE advance the ProductionJob clearance_stage LICENSE_PENDING -> FEE_CLEARED once no invoice of the manuscript remains ISSUED"
      - "settled_at = current_utc; increments APCInvoice.version by 1"

  # --- production ----------------------------------------------------------
  - method: POST
    path: "/production-jobs/{id}/typeset-slot"
    description: "Book the journal's single typesetting desk for a closed date interval. OCC-guarded on the production job."
    roles: [ProductionStaff]
    code: 200
    input: ["slot_start", "slot_end", "expected_production_job_version"]
    output: ProductionJob
    side_effects:
      - "typeset_slot_occupancy rejects the booking when another live job of the same journal conflicts once the symmetric typeset_changeover_buffer_days buffer is applied"
      - "slot_start and slot_end stored on the job"
      - "increments ProductionJob.version by 1"

  - method: POST
    path: "/production-jobs/{id}/content-advance"
    description: "Advance the content dimension of the production workflow from copyediting to typesetting to proof."
    roles: [ProductionStaff]
    code: 200
    input: ["to_stage"]
    output: ProductionJob
    side_effects:
      - "to_stage = TYPESETTING requires slot_start to be set"
      - "to_stage = PROOF_SENT increments proof_round by 1"
      - "the clearance dimension is untouched"
      - "increments ProductionJob.version by 1"

  - method: POST
    path: "/production-jobs/{id}/proof-approval"
    description: "The corresponding author approves or rejects the proof."
    roles: [Author]
    code: 200
    input: ["approved", "proof_comments?"]
    output: ProductionJob
    side_effects:
      - "approved = true moves content_stage PROOF_SENT -> PROOF_APPROVED"
      - "approved = false moves content_stage PROOF_SENT -> TYPESETTING while proof_round < journal.max_proof_rounds, otherwise ERR_PROOF_ROUND_LIMIT_REACHED"
      - "increments ProductionJob.version by 1"

  - method: POST
    path: "/production-jobs/{id}/archival-deposit"
    description: "Record the dark-archive deposit that clears the job for publication."
    roles: [ProductionStaff]
    code: 200
    input: ["archival_repository", "deposit_reference"]
    output: ProductionJob
    side_effects:
      - "clearance_stage FEE_CLEARED -> DEPOSIT_CONFIRMED with archival_repository and deposit_reference stored"
      - "the content dimension is untouched"
      - "increments ProductionJob.version by 1"

  - method: POST
    path: "/production-jobs/{id}/publication"
    description: "Publish the article once both production dimensions have joined at PROOF_APPROVED and DEPOSIT_CONFIRMED."
    roles: [ProductionStaff]
    code: 200
    input: ["publication_date", "issue_label?"]
    output: ProductionJob
    side_effects:
      - "manuscript IN_PRODUCTION -> PUBLISHED with publication_date stored, embargo_end_date from embargo_end_date_projection, and doi minted as journal.doi_prefix + '/' + journal name slug + '.' + journal_sequence_number"
      - "job.indexing_status = INDEXED and job.published_at = current_utc"
      - "journal.published_article_count += 1"
      - "increments ProductionJob.version by 1 and Manuscript.version by 1"

  # --- operations / test-driving --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly its startup default 2026-08-01T00:00:00Z and never falls back to wall-clock time; the clock may only move forward."
    roles: [SystemAdmin]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: datetime }"
    side_effects:
      - "stores the logical clock; every later current_utc read (invited_at, due_at, submitted_at, responded_at, settled_at, resolved_at, published_at, retracted_at, rolling-window boundaries) uses it"
      - "a current_utc earlier than the stored clock is rejected with ERR_CLOCK_REWIND"

  - method: POST
    path: "/_ops/run-reminder-sweep"
    description: "Run the reminder and expiry sweep for one journal's open review invitations, in invitation created_at ASC order."
    roles: [SystemAdmin]
    code: 200
    input: ["journal_id"]
    output: "{ reminded_invitation_count: integer, expired_invitation_count: integer, probation_reviewer_count: integer, shortfall_manuscript_ids: string_array }"
    side_effects:
      - "applies review_lateness_and_reminder_sweep: exactly one action per INVITED invitation, expiry taking precedence over a reminder"
      - "expired invitations move to EXPIRED with closed_reason = SWEEP_EXPIRY, decrement that Reviewer.open_invitation_count and re-run reviewer_reliability_score, which may move a Reviewer ACTIVE -> PROBATION"
      - "reminder_count and last_reminder_at updated on reminded invitations"
      - "manuscript.review_shortfall_flag recomputed for affected manuscripts"

