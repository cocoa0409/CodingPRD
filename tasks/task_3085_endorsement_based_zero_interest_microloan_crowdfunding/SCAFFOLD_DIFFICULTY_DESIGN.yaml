      - name: impact_report_simple_vs_principal_weighted
        grounds:
          - calculations.lender_impact_report
          - entities.ImpactReport.fields.is_mid_term
        distinguishing_aspect: |
          Dual-variant on the ImpactReport domain: with two loans each
          reporting jobs_created, the SIMPLE_IMPACT variant (all reports
          mid-term) returns the unweighted mean, while STANDARD_IMPACT (at
          least one report past mid-term) weights by the lender's principal
          share. Lender KA funds 375000 of the 400000 loan P (jobs 4) and
          500000 of the 1600000 loan Q (jobs 12): with only P's mid-term
          report on file the read returns 4; once Q's non-mid-term report
          lands the same endpoint returns round((375000*4 + 500000*12)/875000)
          = 9 — different numbers for the same lender purely from variant
          selection.
        test_recipe:
