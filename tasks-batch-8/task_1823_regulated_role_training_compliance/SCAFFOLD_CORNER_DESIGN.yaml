          assert:
            - "err == \"ERR_EXTENSION_DAYS_INVALID\" (422; range is 1..30 inclusive)"

      - name: evidence_tier_and_uri_enforced_in_order
        claim_type: conditional_validation
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_EVIDENCE_TYPE_INSUFFICIENT]"
          - "errors[ERR_EVIDENCE_URI_MISSING]"
          - "entities.Curriculum.fields.evidence_requirement"
        distinguishing_aspect: "Evidence tiers are ordered NONE < CERTIFICATE < PROCTORED_CERTIFICATE: CERTIFICATE against a PROCTORED_CERTIFICATE requirement fails tier; PROCTORED without uri fails presence; PROCTORED with uri and passing score succeeds."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-EV; curriculum CUR-EV ACTIVE (passing 80, evidence_requirement PROCTORED_CERTIFICATE); role R-EV with SOFT INITIAL_ONLY req; employee E-EV holds A ASSIGNED"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
