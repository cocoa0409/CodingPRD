# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Package Locker & Mailbox Rental — Expert tier
# Breadth probe over the claim-extraction-guide sections; depth lives in §1.8.
# Every active instance is empty-DB executable against SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Facility, endpoints]
        distinguishing_aspect: "POST /facilities with name returns 201, time_zone defaults to UTC, current_utc defaults to 1970 epoch, counters 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id, tz: $.data.time_zone, ver: $.data.version, avail: $.data.available_locker_count }
          assert:
            - "HTTP 201; Facility.time_zone == UTC (default applied), version == 1, available_locker_count == 0"

      - name: create_locker_missing_size_tier_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.LockerUnit.fields.size_tier, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /locker-units omitting size_tier returns ERR_INVALID_REQUEST (422); no locker created."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1" }
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: create_locker_bad_enum_size_tier_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.LockerUnit.fields.size_tier, "validations[priority=4]"]
        distinguishing_aspect: "size_tier=HUGE is not in {SMALL,MEDIUM,LARGE,XL} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
          trigger:
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "HUGE" }
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: get_package_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Package, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /packages/{random uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
          trigger:
            - call: "GET /packages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_rental_agreement_unknown_mailbox_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.RentalAgreement.fields.mailbox_unit_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /rental-agreements with a mailbox_unit_id that does not resolve -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Facility + customer + verified-able form, but a bogus mailbox id."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "Z", email: "z@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "00000000-0000-4000-8000-000000000001", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: duplicate_customer_email_returns_duplicate
        claim_type: Type Constraints
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE]", entities.Customer.fields.email]
        distinguishing_aspect: "Second customer with the same email in the same facility -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Facility with one customer c@x.com."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "c@x.com", phone: "1" }
              as: FacilityOperator
          trigger:
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "B", email: "c@x.com", phone: "2" }
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_DUPLICATE"

      - name: package_oversize_fee_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Package.fields.oversize_fee_cents, calculations.oversize_fee]
        distinguishing_aspect: "oversize_fee_cents is server-computed; even if a client tried to send it, the response equals the formula result (0 for an in-tier package)."
        test_recipe:
          setup: ["Facility, MEDIUM locker, ACTIVE rental. Receive in-tier MEDIUM package (dim 40, weight 3000)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "A", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
          trigger:
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { ofee: $.data.oversize_fee_cents, code: $.data.pickup_code }
          assert:
            - "Package.oversize_fee_cents == 0 (in-tier); pickup_code is a server-minted 6-digit string"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pickup_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Package.NOTIFIED_to_PICKED_UP, "validations[priority=5]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_pickup_code_mismatch
          rationale: "The state-precondition rejection of pickup from RECEIVED is exercised as the winning error of that §1.8 priority-conflict instance."

      - name: verify_form_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Form1583.SUBMITTED_to_VERIFIED, "validations[priority=5]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying a Form1583 that is still DRAFT (never submitted) -> ERR_INVALID_STATE (409); no verified_at set."
        test_recipe:
          setup: ["A DRAFT Form1583 (no recipients, never submitted)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
          trigger:
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Form1583.status stays DRAFT"

      - name: submit_form_without_recipients_returns_no_recipients
        claim_type: precondition_violation
        grounds: [state_machines.Form1583.DRAFT_to_SUBMITTED, "errors[ERR_NO_RECIPIENTS]"]
        distinguishing_aspect: "Submitting a DRAFT Form1583 that has zero AuthorizedRecipient rows -> ERR_NO_RECIPIENTS (409)."
        test_recipe:
          setup: ["A DRAFT Form1583 with no recipients added."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
          trigger:
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_NO_RECIPIENTS; Form1583.status stays DRAFT"

      - name: form_reject_resubmit_cycle_increments_submission_count
        claim_type: cyclic
        grounds: [state_machines.Form1583.SUBMITTED_to_REJECTED, state_machines.Form1583.REJECTED_to_SUBMITTED, entities.Form1583.fields.submission_count]
        distinguishing_aspect: "DRAFT->SUBMITTED (count 1) ->REJECTED ->SUBMITTED again (count 2) clears rejection_reason; cycle loops and submission_count == 2."
        test_recipe:
          setup: ["A Form1583 with one recipient, submitted then rejected."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "A", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/reject"
              payload: { rejection_reason: "blurry id" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
              captures: { sc: $.data.submission_count, st: $.data.status }
          assert:
            - "Form1583.status == SUBMITTED, submission_count == 2, rejection_reason == null after resubmit"

      - name: terminal_form_verified_cannot_resubmit
        claim_type: terminal_lockdown
        grounds: [entities.Form1583.fields.status, "validations[priority=5]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal for Form1583; submit/verify/reject from VERIFIED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A VERIFIED Form1583."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "A", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Form1583.status stays VERIFIED"

      - name: close_blocked_by_unresolved_package
        claim_type: precondition_violation
        grounds: [state_machines.RentalAgreement.ACTIVE_to_CLOSED, "validations[priority=11]", "errors[ERR_UNRESOLVED_PACKAGES]"]
        distinguishing_aspect: "Closing an ACTIVE rental that still has a RECEIVED package -> ERR_UNRESOLVED_PACKAGES (409); status stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE rental with one RECEIVED (un-notified) package occupying a locker."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "A", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1 }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkg: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${agr}/close"
              payload: {}
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_UNRESOLVED_PACKAGES; RentalAgreement.status stays ACTIVE"

      - name: agreement_abandonment_sweep_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.RentalAgreement.PENDING_AUTH_to_ABANDONED
          - state_machines.MailboxUnit.RENTED_to_VACANT
          - state_machines.Package.RECEIVED_to_ABANDONED
          - entities.Invoice.fields.status
        distinguishing_aspect: "Clock past term_end+30d with positive balance abandons the agreement: mailbox -> VACANT, its RECEIVED package -> ABANDONED (locker released), STORED mail -> SHREDDED, Invoice -> WRITTEN_OFF."
        test_recipe:
          setup: ["1-month ACTIVE rental (term_start 2026-06-01, term_end 2026-07-01), autopay OFF (balance 3000>0), one RECEIVED package and one STORED mail item. Clock advanced to 2026-08-01 (> 2026-07-31 = term_end+30)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "A", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 1, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", carrier: "UPS", size_tier: "MEDIUM", longest_dim_cm: 40, weight_g: 3000 }
              as: FacilityOperator
              captures: { pkg: $.data.id }
            - call: "POST /mail-items"
              payload: { facility_id: "${fac}", rental_agreement_id: "${agr}", mail_class: "FIRST_CLASS" }
              as: FacilityOperator
              captures: { mi: $.data.id }
          trigger:
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "GET /rental-agreements/${agr}"
              payload: {}
              as: FacilityOperator
              captures: { agr_st: $.data.status }
            - call: "GET /mailbox-units/${box}"
              payload: {}
              as: FacilityOperator
              captures: { box_st: $.data.status }
            - call: "GET /packages/${pkg}"
              payload: {}
              as: FacilityOperator
              captures: { pkg_st: $.data.status }
          assert:
            - "RentalAgreement.${agr}.status == ABANDONED, MailboxUnit.${box}.status == VACANT, Package.${pkg}.status == ABANDONED"
            - "MailItem.${mi}.status == SHREDDED; the agreement Invoice.status == WRITTEN_OFF"

      - name: package_abandonment_sweep_releases_locker
        claim_type: side_effect_execution
        grounds: [state_machines.Package.NOTIFIED_to_ABANDONED, state_machines.LockerUnit.OCCUPIED_to_AVAILABLE]
        distinguishing_aspect: "Clock past notified_at+14d abandons a NOTIFIED package: status -> ABANDONED and its locker returns to AVAILABLE."
        test_recipe:
          setup: ["NOTIFIED MEDIUM package, notified 2026-06-01; clock advanced to 2026-06-16 (> notified_at+14)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Depot", time_zone: "UTC" }
              as: FacilityOperator
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: FacilityOperator
            - call: "POST /mailbox-units"
              payload: { facility_id: "${fac}", box_number: "B1", size_tier: "MEDIUM", monthly_fee_cents: 3000 }
              as: FacilityOperator
              captures: { box: $.data.id }
            - call: "POST /locker-units"
              payload: { facility_id: "${fac}", label: "L1", size_tier: "MEDIUM" }
              as: FacilityOperator
              captures: { lkr: $.data.id }
            - call: "POST /customers"
              payload: { facility_id: "${fac}", full_name: "A", email: "a@x.com", phone: "1" }
              as: FacilityOperator
              captures: { cust: $.data.id }
            - call: "POST /forms-1583"
              payload: { facility_id: "${fac}", customer_id: "${cust}", primary_id_type: "PASSPORT", address_proof_type: "LEASE" }
              as: FacilityOperator
              captures: { form: $.data.id }
            - call: "POST /forms-1583/${form}/recipients"
              payload: { recipient_name: "A", relationship: "SELF" }
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/submit"
              payload: {}
              as: FacilityOperator
            - call: "POST /forms-1583/${form}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /rental-agreements"
              payload: { facility_id: "${fac}", customer_id: "${cust}", mailbox_unit_id: "${box}", form_1583_id: "${form}", term_months: 6, autopay_enabled: false }
              as: FacilityOperator
              captures: { agr: $.data.id }
            - call: "POST /rental-agreements/${agr}/activate"
              payload: {}
              as: FacilityOperator
            - call: "POST /packages"
