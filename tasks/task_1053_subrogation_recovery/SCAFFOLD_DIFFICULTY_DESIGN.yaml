        distinguishing_aspect: "Arbitration/AdverseParty docket resource, buffer-based adjacency (HEARING_BUFFER_DAYS=7): a second hearing window (2026-08-05..08-06) only 3 days after the first (ends 2026-08-02) on the same adverse party is rejected with ERR_HEARING_WINDOW_CONFLICT — buffer semantics, unlike the half-open demand overlap."
