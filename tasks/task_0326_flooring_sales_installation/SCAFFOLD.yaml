scenario: "Flooring Sales & Installation: product catalog (hardwood/LVP/tile/carpet) & sq-ft, in-home measure, material + labor + underlayment estimate, special order & lead time, tear-out/haul-away, install scheduling & crew, waste/overage factor, warranty."
domain_name: "flooring-sales-installation"
api_prefix: "/flooring"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Dual-variant calculation"      # provisional pre-measure estimate vs measured final estimate; warranty risk score on Job
    - "Optimistic concurrency"        # OCC on Job.version for estimate (re)issue
    - "Cascading side effects"        # measure -> estimate recompute -> order/schedule re-validation
    - "Rate / threshold triggers"     # waste-factor tier breakpoints; crew-capacity overage

  entity_topology: flat
  # Peer entities linked by FK. Product, Job, Estimate, MaterialOrder, InstallCrew,
  # InstallSlot, WarrantyClaim reference each other by id in request bodies, not nested URLs.

  state_machine_shape: branching
  # Estimate: DRAFT -> {ISSUED, VOIDED}; ISSUED -> {ACCEPTED, EXPIRED, VOIDED}; ACCEPTED branch forks
  #   into MaterialOrder + InstallSlot. Job has a revert loop (MEASURED -> RE_MEASURE -> MEASURED).
  # MaterialOrder: cyclic special-order path (ORDERED -> BACKORDERED -> ORDERED).

  relationship_patterns:
    - one_to_many        # Job has many Estimates (re-issued on re-measure); Crew has many Slots
    - cross_aggregate    # InstallSlot occupies InstallCrew capacity; MaterialOrder gates InstallSlot scheduling

  role_model: peer_roles
  # SalesRep owns Job/Estimate; Estimator owns measurements; Scheduler owns crew + slots;
  # Customer is entity_backed and accepts estimates / files warranty claims; Admin overrides catalog.

  consistency_model: immediate
  # All cascades (measure -> estimate recompute -> order/schedule re-validation) resolve in one request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Used as the deterministic tie-break key for catalog selection."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation."
      - name: sku
        type: string
        source: input
        description: "Catalog stock-keeping code; unique among non-DISCONTINUED Products."
        constraints: "Unique where status IN {ACTIVE}; case-sensitive."
      - name: name
        type: string
        source: input
        description: "Display name of the flooring product."
      - name: category
        type: enum
        source: input
        description: "Flooring family."
        constraints: "One of {HARDWOOD, LVP, TILE, CARPET}."
      - name: material_cost_per_sqft_cents
        type: integer
        source: input
        description: "Wholesale material cost per square foot, in integer cents. Must be > 0."
        constraints: ">= 1"
      - name: labor_rate_per_sqft_cents
        type: integer
        source: input
        description: "Base install labor rate per square foot for this category, integer cents. Must be > 0."
        constraints: ">= 1"
      - name: requires_underlayment
        type: boolean
        source: input
        description: "True when this product is installed over underlayment (LVP, some HARDWOOD)."
        default: false
      - name: underlayment_cost_per_sqft_cents
        type: integer
        source: input
        description: "Underlayment material cost per square foot, integer cents. Must be 0 when requires_underlayment is false; must be >= 1 when true."
        default: 0
      - name: lead_time_days
        type: integer
        source: input
        description: "Vendor lead time in days for a special order of this product. 0 means stocked."
        default: 0
        constraints: ">= 0"
      - name: warranty_years
        type: integer
        source: input
        description: "Manufacturer warranty length in whole years for installations using this product."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Catalog lifecycle. Starts ACTIVE on create."
        constraints: "One of {ACTIVE, DISCONTINUED}. Set by §1.2 Product machine."

  - name: Job
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation; the OCC field for estimate re-issue and acceptance."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the homeowner this job belongs to."
      - name: sales_rep_id
        type: string
        source: input
        description: "FK -> SalesRep.id; the rep who created and owns the job."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the selected flooring product. Must reference an ACTIVE Product at job-create time."
      - name: declared_sqft
        type: number
        source: input
        description: "Rough square footage the customer/rep declares before the in-home measure. Used for the PROVISIONAL estimate. Must be > 0."
        constraints: "> 0"
      - name: measured_sqft
        type: number
        source: system
        description: "Square footage captured by the Estimator at the in-home measure. Null until status reaches MEASURED. Used for the MEASURED (final) estimate."
      - name: tear_out_sqft
        type: number
        source: system
        description: "Square footage of existing floor to tear out and haul away, captured at measure. 0 when no tear-out. Null until MEASURED."
      - name: room_count
        type: integer
        source: system
        description: "Number of discrete rooms/spaces measured; drives crew-hours and the waste seam allowance. Null until MEASURED."
      - name: waste_factor_pct
        type: number
        source: computed
        description: "Overage/waste percentage applied to material square footage; derived from category and measured geometry per §1.3 waste_factor. Null until MEASURED."
      - name: status
        type: enum
        source: system
        description: "Job lifecycle. Starts DRAFT."
        constraints: "One of {DRAFT, MEASURED, RE_MEASURE, ESTIMATED, ACCEPTED, IN_INSTALL, COMPLETED, CANCELLED}. Set by §1.2 Job machine."
      - name: warranty_risk_score
        type: number
        source: computed
        description: "0-100 risk score for the warranty (higher = riskier install) computed at COMPLETED per §1.3 warranty_risk; gates WarrantyClaim approval. Null until COMPLETED."

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Tie-break key when selecting the latest estimate for a job."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation."
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job this estimate prices."
      - name: variant
        type: enum
        source: system
        description: "Which pricing variant produced this estimate."
        constraints: "One of {PROVISIONAL, MEASURED}. PROVISIONAL uses declared_sqft; MEASURED uses measured_sqft + tear-out + waste."
      - name: billable_sqft
        type: number
        source: computed
        description: "Material square footage after waste factor (MEASURED) or raw declared_sqft (PROVISIONAL); the basis for material cost. Per §1.3 estimate_total."
      - name: material_cost_cents
        type: integer
        source: computed
        description: "Material line total in integer cents, per §1.3 estimate_total."
      - name: underlayment_cost_cents
        type: integer
        source: computed
        description: "Underlayment line total in integer cents; 0 when product.requires_underlayment is false."
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "Install labor line total in integer cents, per §1.3 estimate_total (includes tear-out/haul-away labor in MEASURED)."
      - name: total_cents
        type: integer
        source: computed
        description: "Grand total in integer cents, per §1.3 estimate_total rounding order."
      - name: status
        type: enum
        source: system
        description: "Estimate lifecycle. Starts DRAFT."
        constraints: "One of {DRAFT, ISSUED, ACCEPTED, EXPIRED, VOIDED}. Set by §1.2 Estimate machine."
      - name: valid_until
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which an ISSUED estimate is EXPIRED. Must be strictly after issue time."
      - name: expected_job_version
        type: integer
        source: input
        description: "OCC: the Job.version the client observed; rejected if stale. Required on issue."

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation."
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job whose accepted estimate this order fulfills."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product being ordered (copied from job at order time)."
      - name: order_sqft
        type: number
        source: system
        description: "Billable square footage ordered, copied from the accepted MEASURED estimate's billable_sqft."
      - name: lead_time_days
        type: integer
        source: system
        description: "Lead time snapshot copied from product.lead_time_days at order creation; drives expected_ready_date."
      - name: expected_ready_date
        type: datetime
        source: computed
        description: "ISO 8601 UTC = order creation clock + lead_time_days days; the material-ready gate for scheduling. Recomputed on re-order after BACKORDERED."
      - name: status
        type: enum
        source: system
        description: "Special-order lifecycle. Starts ORDERED."
        constraints: "One of {ORDERED, BACKORDERED, RECEIVED, CANCELLED}. Set by §1.2 MaterialOrder machine."
      - name: backorder_count
        type: integer
        source: system
        description: "Number of times this order has cycled through BACKORDERED; informational, increments on each backorder."
        default: 0

  - name: InstallCrew
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Deterministic tie-break key in crew selection / overlap ordering."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation."
      - name: name
        type: string
        source: input
        description: "Crew display name."
      - name: skill_categories
        type: array
        source: input
        description: "Set of Product categories this crew can install; subset of {HARDWOOD, LVP, TILE, CARPET}. Non-empty."
        constraints: "Each element in {HARDWOOD, LVP, TILE, CARPET}; array length >= 1."
      - name: daily_sqft_capacity
        type: integer
        source: input
        description: "Maximum billable square footage this crew can install per calendar day across all its slots. Must be > 0."
        constraints: "> 0"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Mandatory travel/cleanup buffer in minutes that must separate this crew's adjacent slots. Must be >= 0."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Crew lifecycle. Starts AVAILABLE."
        constraints: "One of {AVAILABLE, INACTIVE}. Set by §1.2 InstallCrew machine."

  - name: InstallSlot
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Tie-break key for overlap ordering."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation including cascades."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation."
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the job being installed in this slot."
      - name: crew_id
        type: string
        source: input
        description: "FK -> InstallCrew.id; the crew assigned to this slot."
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC slot start (inclusive). Must be strictly before end_at."
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC slot end (exclusive). Must be strictly after start_at."
      - name: scheduled_sqft
        type: number
        source: system
        description: "Billable square footage this slot consumes against the crew's daily_sqft_capacity; copied from the job's accepted MEASURED estimate."
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle. Starts SCHEDULED."
        constraints: "One of {SCHEDULED, CANCELLED, DONE}. Set by §1.2 InstallSlot machine."

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; refreshed on every mutation."
      - name: version
        type: integer
        source: system
        description: "Starts at 1; increments by one on every mutation."
      - name: job_id
        type: string
        source: input
        description: "FK -> Job.id; the completed job the claim is filed against."
      - name: filed_at
        type: datetime
        source: system
        description: "Clock instant the claim was filed; snapshotted from the system clock at create."
      - name: defect_description
        type: string
        source: input
        description: "Free-text description of the reported defect."
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle. Starts FILED."
        constraints: "One of {FILED, APPROVED, DENIED}. Set by §1.2 WarrantyClaim machine."
      - name: resolution_note
        type: string
        source: input
        description: "Adjudicator note recorded on APPROVED or DENIED."

  - name: Customer
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Equals X-User-ID when acting as the Customer role. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: full_name
        type: string
        source: input
        description: "Homeowner name."
      - name: address
        type: string
        source: input
        description: "Install site address."
      - name: email
        type: string
        source: input
        description: "Contact email; unique among Customers."
        constraints: "Unique; case-insensitive."

  - name: SalesRep
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no prefix. Equals X-User-ID when acting as the SalesRep role. Identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: name
        type: string
        source: input
        description: "Sales representative name."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /flooring/products/{id}/discontinue"
        actor: Admin
        preconditions:
          - "No Job referencing this product is in a non-terminal status {DRAFT, MEASURED, RE_MEASURE, ESTIMATED, ACCEPTED, IN_INSTALL}."
        side_effects:
          - "Set Product.status = DISCONTINUED."
          - "increments Product.version by 1"
        note: "Discontinue is blocked while live jobs depend on the product, protecting in-flight estimates."

  - entity: Job
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: MEASURED
        trigger: "POST /flooring/jobs/{id}/measure"
        actor: Estimator
        preconditions:
          - "Job.status == DRAFT."
          - "measured_sqft > 0; tear_out_sqft >= 0; room_count >= 1."
        side_effects:
          - "Set measured_sqft, tear_out_sqft, room_count from the request."
          - "Compute Job.waste_factor_pct per §1.3 waste_factor."
          - "increments Job.version by 1"
        note: "In-home measure. waste_factor_pct now defined."
      - from: MEASURED
        to: RE_MEASURE
        trigger: "POST /flooring/jobs/{id}/request-remeasure"
        actor: SalesRep
        preconditions:
          - "Job.status IN {MEASURED, ESTIMATED}."
        side_effects:
          - "Set Job.status = RE_MEASURE."
          - "VOID the job's latest ISSUED Estimate if one exists (Estimate ISSUED->VOIDED cascade)."
          - "increments Job.version by 1"
        note: "Revert loop entry: customer disputes the measure. Reachable from MEASURED or after an estimate is ISSUED (ESTIMATED)."
      - from: ESTIMATED
        to: RE_MEASURE
        trigger: "POST /flooring/jobs/{id}/request-remeasure"
        actor: SalesRep
        preconditions:
          - "Job.status IN {MEASURED, ESTIMATED}."
        side_effects:
          - "Set Job.status = RE_MEASURE."
          - "VOID the job's ISSUED Estimate (Estimate ISSUED->VOIDED cascade)."
          - "increments Job.version by 1"
        note: "Customer disputes after an estimate was issued: voids the issued estimate and reopens measurement."
      - from: RE_MEASURE
        to: MEASURED
        trigger: "POST /flooring/jobs/{id}/measure"
        actor: Estimator
        preconditions:
          - "Job.status == RE_MEASURE."
          - "measured_sqft > 0; tear_out_sqft >= 0; room_count >= 1."
        side_effects:
          - "Overwrite measured_sqft, tear_out_sqft, room_count from the request."
          - "Recompute Job.waste_factor_pct per §1.3 waste_factor."
          - "increments Job.version by 1"
        note: "Cycle closes: re-measure replaces geometry."
      - from: MEASURED
        to: ESTIMATED
        trigger: "POST /flooring/estimates/{id}/issue (variant MEASURED)"
        actor: SalesRep
        preconditions:
          - "Job.status == MEASURED."
          - "The issued Estimate transitions DRAFT->ISSUED in the same call."
          - "expected_job_version matches current Job.version (OCC)."
        side_effects:
          - "Set Job.status = ESTIMATED."
          - "increments Job.version by 1"
        note: "Bubble-up: issuing the first MEASURED estimate advances the job out of MEASURED."
      - from: ESTIMATED
        to: ESTIMATED
        trigger: "POST /flooring/estimates/{id}/issue (variant MEASURED) — re-issue supersede"
        actor: SalesRep
        preconditions:
          - "Job.status == ESTIMATED (a prior estimate is already ISSUED)."
          - "The issued Estimate transitions DRAFT->ISSUED in the same call."
          - "expected_job_version matches current Job.version (OCC)."
        side_effects:
          - "Job.status stays ESTIMATED; VOID the prior ISSUED estimate (Estimate ISSUED->VOIDED)."
          - "increments Job.version by 1"
        note: "Self-loop: re-issuing a fresh estimate supersedes the prior ISSUED one without re-measure. This is the live supersede path the OCC rule guards."
      - from: ESTIMATED
        to: ACCEPTED
        trigger: "POST /flooring/estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "Job.status == ESTIMATED."
          - "The accepted Estimate is ISSUED, variant MEASURED, and not past valid_until."
        side_effects:
          - "Set Job.status = ACCEPTED; set the Estimate ISSUED->ACCEPTED."
          - "Create a MaterialOrder in ORDERED with order_sqft = estimate.billable_sqft, lead_time_days = product.lead_time_days, expected_ready_date per §1.3 ready_date (cascade)."
          - "increments Job.version by 1"
        note: "Branch fork: acceptance spawns the material-order arm."
      - from: ACCEPTED
        to: IN_INSTALL
        trigger: "POST /flooring/install-slots/{id}/start"
        actor: Scheduler
        preconditions:
          - "Job.status == ACCEPTED."
          - "The slot's job is this job; slot.status == SCHEDULED."
          - "The job's MaterialOrder is RECEIVED (material on hand)."
        side_effects:
          - "Set Job.status = IN_INSTALL."
          - "increments Job.version by 1"
        note: "Cross-entity guard: install cannot start until material RECEIVED."
      - from: IN_INSTALL
        to: COMPLETED
        trigger: "POST /flooring/install-slots/{id}/complete"
        actor: Scheduler
        preconditions:
          - "Job.status == IN_INSTALL."
          - "slot.status == SCHEDULED (the active slot for this job)."
        side_effects:
          - "Set Job.status = COMPLETED; set slot.status = DONE."
          - "Compute Job.warranty_risk_score per §1.3 warranty_risk."
          - "increments Job.version by 1"
        note: "Completion finalizes warranty risk; enables WarrantyClaim filing."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /flooring/jobs/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Job.status IN {DRAFT, MEASURED, RE_MEASURE, ESTIMATED, ACCEPTED}."
        side_effects:
          - "Set Job.status = CANCELLED."
          - "VOID every non-terminal Estimate of this job (ISSUED/DRAFT -> VOIDED cascade)."
          - "CANCEL the job's MaterialOrder if it is in {ORDERED, BACKORDERED} (cascade)."
          - "CANCEL every SCHEDULED InstallSlot of this job, releasing crew capacity (cascade)."
          - "increments Job.version by 1"
        note: "Depth-3 teardown cascade: Job -> Estimate/MaterialOrder/InstallSlot. Same trigger allowed from any listed non-terminal status."
      - from: MEASURED
        to: CANCELLED
        trigger: "POST /flooring/jobs/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Job.status IN {DRAFT, MEASURED, RE_MEASURE, ESTIMATED, ACCEPTED}."
        side_effects:
          - "Same teardown cascade as the DRAFT->CANCELLED row."
          - "increments Job.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /flooring/jobs/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "Job.status IN {DRAFT, MEASURED, RE_MEASURE, ESTIMATED, ACCEPTED}."
        side_effects:
          - "Same teardown cascade as the DRAFT->CANCELLED row."
          - "increments Job.version by 1"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /flooring/estimates/{id}/issue"
        actor: SalesRep
        preconditions:
          - "Estimate.status == DRAFT."
          - "valid_until is strictly after the current clock."
          - "expected_job_version matches Job.version (OCC); Job.status IN {MEASURED, ESTIMATED}."
          - "Estimate.variant == MEASURED."
        side_effects:
          - "Set Estimate.status = ISSUED."
          - "If Job is MEASURED, advance it MEASURED->ESTIMATED (bubble-up); if already ESTIMATED, it stays ESTIMATED (self-loop)."
          - "VOID any prior ISSUED estimate of the same job (only one ISSUED estimate per job at any time)."
          - "increments Job.version by 1"
        note: "Issuing supersedes the prior ISSUED estimate; reachable from both MEASURED (first issue) and ESTIMATED (re-issue)."
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /flooring/estimates/{id}/accept"
        actor: Customer
        preconditions:
          - "Estimate.status == ISSUED."
          - "Current clock is strictly before valid_until."
          - "The acting Customer owns the estimate's job."
        side_effects:
          - "Set Estimate.status = ACCEPTED."
          - "Advance Job ESTIMATED->ACCEPTED and spawn the MaterialOrder (see Job machine)."
          - "increments Job.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /flooring/estimates/{id}/expire-check"
        actor: system
        preconditions:
          - "Estimate.status == ISSUED."
          - "Current clock is at or after valid_until."
        side_effects:
          - "Set Estimate.status = EXPIRED."
        note: "Lazy expiry: only fires when the current clock has reached valid_until."
      - from: ISSUED
        to: VOIDED
        trigger: "Cascade from Job request-remeasure / cancel"
        actor: system
        preconditions:
          - "Estimate.status IN {DRAFT, ISSUED}."
        side_effects:
          - "Set Estimate.status = VOIDED."
        note: "Cascade target, not a direct endpoint."

  - entity: MaterialOrder
    initial_state: ORDERED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: ORDERED
        to: BACKORDERED
        trigger: "POST /flooring/material-orders/{id}/backorder"
        actor: Scheduler
        preconditions:
          - "MaterialOrder.status == ORDERED."
        side_effects:
          - "Set status = BACKORDERED; increment backorder_count by 1."
          - "increments MaterialOrder.version by 1"
        note: "Vendor reports stock-out."
      - from: BACKORDERED
        to: ORDERED
        trigger: "POST /flooring/material-orders/{id}/reorder"
        actor: Scheduler
        preconditions:
          - "MaterialOrder.status == BACKORDERED."
        side_effects:
          - "Set status = ORDERED; recompute expected_ready_date = current clock + lead_time_days days (cascade onto schedulability)."
          - "increments MaterialOrder.version by 1"
        note: "Cyclic special-order path; reorder pushes the ready date out."
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /flooring/material-orders/{id}/receive"
        actor: Scheduler
        preconditions:
          - "MaterialOrder.status == ORDERED."
          - "Current clock is at or after expected_ready_date."
        side_effects:
          - "Set status = RECEIVED (unlocks slot start for the job)."
          - "increments MaterialOrder.version by 1"
        note: "Material cannot be received before its expected_ready_date."
      - from: ORDERED
        to: CANCELLED
        trigger: "Cascade from Job cancel"
        actor: system
        preconditions:
          - "MaterialOrder.status IN {ORDERED, BACKORDERED}."
        side_effects:
          - "Set status = CANCELLED."
        note: "Cascade target."

  - entity: InstallCrew
    initial_state: AVAILABLE
    terminal_states: [INACTIVE]
    transitions:
      - from: AVAILABLE
        to: INACTIVE
        trigger: "POST /flooring/install-crews/{id}/deactivate"
        actor: Scheduler
        preconditions:
          - "InstallCrew.status == AVAILABLE."
          - "No InstallSlot of this crew is in SCHEDULED status."
        side_effects:
          - "Set status = INACTIVE."
          - "increments InstallCrew.version by 1"

  - entity: InstallSlot
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, DONE]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /flooring/install-slots/{id}/cancel"
        actor: Scheduler
        preconditions:
          - "InstallSlot.status == SCHEDULED."
        side_effects:
          - "Set status = CANCELLED; release scheduled_sqft from the crew's day capacity (capacity recomputed from remaining SCHEDULED slots)."
          - "increments InstallSlot.version by 1"
      - from: SCHEDULED
        to: DONE
        trigger: "POST /flooring/install-slots/{id}/complete"
        actor: Scheduler
        preconditions:
          - "InstallSlot.status == SCHEDULED."
          - "Parent Job.status == IN_INSTALL."
        side_effects:
          - "Set status = DONE; advance Job IN_INSTALL->COMPLETED (bubble-up; see Job machine)."
          - "increments InstallSlot.version by 1"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /flooring/warranty-claims/{id}/approve"
        actor: Admin
        preconditions:
          - "WarrantyClaim.status == FILED."
          - "filed_at is within the parent job's warranty window: filed_at < job.completed_at-anchored window end = job COMPLETED clock + product.warranty_years years."
          - "Parent Job.warranty_risk_score <= 70 (high-risk installs are referred to manual denial)."
        side_effects:
          - "Set status = APPROVED; record resolution_note."
          - "increments WarrantyClaim.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /flooring/warranty-claims/{id}/deny"
        actor: Admin
        preconditions:
          - "WarrantyClaim.status == FILED."
        side_effects:
          - "Set status = DENIED; record resolution_note."
          - "increments WarrantyClaim.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: estimate-issue-stale-job
    parent_entity: Job
    write_endpoint: "POST /flooring/estimates/{id}/issue"
    occ_field: "expected_job_version"
    description: |
      Issuing a MEASURED Estimate against a Job whose version has advanced
      since the client last observed it is rejected on a stale version. This
      captures the case where another writer has already issued an estimate
      (which legitimately supersedes the prior under the one-ISSUED-per-job
      rule and bumps Job.version via the issue transition); the current
      writer holds a DRAFT estimate it built from a now-stale job view, so
      its issue carries the old expected_job_version and is rejected.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: waste_factor
    trigger: "Job DRAFT->MEASURED and RE_MEASURE->MEASURED transitions"
    algorithm: threshold
    formula: |
      # Waste/overage percentage applied to material square footage.
      # base by category:
      base_pct = { HARDWOOD: 10.0, LVP: 8.0, TILE: 12.0, CARPET: 5.0 }[product.category]
      # seam allowance: each room beyond the first adds 1.0 pct (more seams = more waste),
      # capped at +6.0 pct.
      seam_pct = min((room_count - 1) * 1.0, 6.0)
      # diagonal/large-area surcharge: TILE and HARDWOOD over 600 sqft add a flat 3.0 pct.
      big_area_pct = 3.0 if (product.category IN {TILE, HARDWOOD} AND measured_sqft > 600) else 0.0
      waste_factor_pct = base_pct + seam_pct + big_area_pct
    input_set: "Single Job at measure time; product.category, measured_sqft, room_count."
    constants:
      BASE_HARDWOOD: 10.0
      BASE_LVP: 8.0
      BASE_TILE: 12.0
      BASE_CARPET: 5.0
      SEAM_PER_ROOM_PCT: 1.0
      SEAM_CAP_PCT: 6.0
      BIG_AREA_THRESHOLD_SQFT: 600
      BIG_AREA_SURCHARGE_PCT: 3.0
    precision: "waste_factor_pct kept at 1 decimal place, round_half_up. Threshold is strict: measured_sqft > 600 triggers big_area, exactly 600 does not."
    variants: []

  - name: estimate_total
    trigger: "POST /flooring/estimates (create) — computes all cost fields for the new estimate"
    algorithm: tiered_pricing
    formula: |
      # Variant selection: PROVISIONAL uses declared_sqft with NO waste/tear-out;
      # MEASURED uses measured geometry + waste + tear-out/haul-away labor.
      if variant == PROVISIONAL:
        billable_sqft = declared_sqft                      # raw, no waste
        material_cents = round_half_up(billable_sqft * product.material_cost_per_sqft_cents)
        underlayment_cents = round_half_up(billable_sqft * product.underlayment_cost_per_sqft_cents) if product.requires_underlayment else 0
        labor_cents = round_half_up(declared_sqft * product.labor_rate_per_sqft_cents)
        total_cents = material_cents + underlayment_cents + labor_cents
      else:  # MEASURED
        # ROUNDING ORDER IS PINNED: round EACH line item to whole cents, THEN sum.
        billable_sqft = round_half_up(measured_sqft * (1 + waste_factor_pct/100.0), 2)   # 2 dp sqft
        material_cents = round_half_up(billable_sqft * product.material_cost_per_sqft_cents)
        underlayment_cents = round_half_up(billable_sqft * product.underlayment_cost_per_sqft_cents) if product.requires_underlayment else 0
        # Labor: install over MEASURED sqft (NOT billable_sqft — labor is per installed area)
        #        + tear-out/haul-away labor over tear_out_sqft at TEAR_OUT_LABOR_CENTS/sqft.
        install_labor_cents = round_half_up(measured_sqft * product.labor_rate_per_sqft_cents)
        tear_out_labor_cents = round_half_up(tear_out_sqft * TEAR_OUT_LABOR_CENTS_PER_SQFT)
        labor_cents = install_labor_cents + tear_out_labor_cents
        total_cents = material_cents + underlayment_cents + labor_cents
    input_set: "Single Job + its Product. PROVISIONAL needs declared_sqft; MEASURED needs measured_sqft, tear_out_sqft, waste_factor_pct (must be set, i.e. Job MEASURED)."
    constants:
      TEAR_OUT_LABOR_CENTS_PER_SQFT: 150
    precision: "All cents fields integer. Per-line round_half_up to whole cents, THEN sum (sum of rounded lines, NOT round of summed reals). billable_sqft rounded to 2 dp before costing."
    variants:
      - name: PROVISIONAL
        when: "Estimate created with variant=PROVISIONAL (job in DRAFT, no measure yet)."
        difference: "Uses raw declared_sqft; waste_factor and tear-out labor are excluded; material/labor priced off declared_sqft."
      - name: MEASURED
        when: "Estimate created with variant=MEASURED (job MEASURED or RE_MEASURE-then-MEASURED)."
        difference: "Material priced off waste-inflated billable_sqft; labor priced off measured_sqft plus tear-out/haul-away labor over tear_out_sqft."

  - name: ready_date
    trigger: "MaterialOrder creation (Job acceptance cascade) and MaterialOrder BACKORDERED->ORDERED reorder"
    algorithm: aggregation
    formula: |
      # expected_ready_date = the clock instant at order/reorder + lead_time_days calendar days.
      expected_ready_date = current_clock_utc + (lead_time_days * 86400 seconds)
    input_set: "Single MaterialOrder; lead_time_days snapshot + current clock."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "ISO 8601 UTC, three fractional digits. Whole-day offset; no timezone math beyond UTC."
    variants: []

  - name: crew_day_load
    trigger: "InstallSlot create validation and InstallSlot cancel (capacity recompute)"
    algorithm: aggregation
    formula: |
      # For a candidate slot on crew C covering calendar day D (UTC date of start_at):
      # day_load(C, D) = SUM(slot.scheduled_sqft) over crew C's slots where
      #   slot.status == SCHEDULED AND UTC-date(slot.start_at) == D.
      # A new slot is admissible only if day_load(C, D) + candidate.scheduled_sqft <= C.daily_sqft_capacity.
      existing = sum(s.scheduled_sqft for s in crew.slots
                     if s.status == SCHEDULED and utc_date(s.start_at) == utc_date(candidate.start_at))
      admissible = (existing + candidate.scheduled_sqft) <= crew.daily_sqft_capacity
    input_set: "All SCHEDULED InstallSlots of one crew on one UTC calendar day."
    constants: {}
    precision: "scheduled_sqft compared as real numbers; boundary is inclusive (<= capacity admits; capacity+epsilon rejects). Day bucket = UTC calendar date of start_at."
    variants: []

  - name: warranty_risk
    trigger: "Job IN_INSTALL->COMPLETED transition"
    algorithm: weighted_scoring
    formula: |
      # 0-100 risk score (higher = riskier). Pinned evaluation order: compute each
      # additive component, sum, then clamp to [0, 100].
      base = { HARDWOOD: 30, LVP: 15, TILE: 40, CARPET: 10 }[product.category]
      # tear-out raises risk: +1 per 50 sqft of tear_out_sqft (floor division), capped at +20.
      tear_component = min((floor(tear_out_sqft / 50.0)) * 1.0, 20.0)
      # backorder churn raises risk: +5 per backorder on the job's MaterialOrder, capped at +25.
      backorder_component = min(material_order.backorder_count * 5.0, 25.0)
      # re-measure churn raises risk: +10 flat if the job ever entered RE_MEASURE.
      remeasure_component = 10.0 if job_ever_remeasured else 0.0
      raw = base + tear_component + backorder_component + remeasure_component
      warranty_risk_score = max(0.0, min(100.0, raw))
    input_set: "Single Job + Product + its MaterialOrder. Order matters: sum components THEN clamp."
    constants:
      BASE_HARDWOOD: 30
      BASE_LVP: 15
      BASE_TILE: 40
      BASE_CARPET: 10
      TEAR_PER_50_SQFT: 1.0
      TEAR_CAP: 20.0
      BACKORDER_PER_EVENT: 5.0
      BACKORDER_CAP: 25.0
      REMEASURE_FLAT: 10.0
      RISK_FLOOR: 0.0
      RISK_CEILING: 100.0
      APPROVAL_RISK_MAX: 70
    precision: "Integer-valued components summed as reals, clamped to [0,100], stored to 1 decimal place round_half_up. Approval gate uses score <= 70 (strict-greater is referred to denial)."
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /flooring/customers, POST /flooring/sales-reps (registration)"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed Customer actions, X-User-ID equals the job's customer_id (ownership)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /flooring/estimates/{id}/accept, POST /flooring/warranty-claims (file)"

  - priority: 4
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in the path then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2 from-state)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "On Job create, product_id references an ACTIVE (not DISCONTINUED) Product."
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 409
    applies_to: "POST /flooring/jobs"

  - priority: 7
    category: business_constraint
    check: "Product.sku is unique among ACTIVE products; Customer.email is unique among customers."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /flooring/products, POST /flooring/customers"

  - priority: 8
    category: business_constraint
    check: "On estimate create with variant MEASURED, the job is in MEASURED or ESTIMATED status (measured_sqft set). On variant PROVISIONAL, the job is in DRAFT."
    error_id: ERR_VARIANT_STATE_MISMATCH
    http_status: 409
    applies_to: "POST /flooring/estimates"

  - priority: 9
    category: business_temporal
    check: "On estimate issue, valid_until is strictly after the current clock."
    error_id: ERR_VALID_UNTIL_IN_PAST
    http_status: 422
    applies_to: "POST /flooring/estimates/{id}/issue"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_job_version equals the current Job.version on estimate issue and on accept-driven version checks."
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412
    applies_to: "POST /flooring/estimates/{id}/issue"

  - priority: 11
    category: business_temporal
    check: "On estimate accept, current clock is strictly before the estimate's valid_until."
    error_id: ERR_ESTIMATE_EXPIRED
    http_status: 409
    applies_to: "POST /flooring/estimates/{id}/accept"

  - priority: 12
    category: business_referential
    check: "On install-slot create, the job is ACCEPTED and has an accepted MEASURED estimate (scheduled_sqft source). Checked before slot geometry because scheduled_sqft is undefined otherwise."
    error_id: ERR_JOB_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /flooring/install-slots"

  - priority: 13
    category: business_referential
    check: "On install-slot create, the crew's skill_categories includes the job's product.category."
    error_id: ERR_CREW_SKILL_MISMATCH
    http_status: 409
    applies_to: "POST /flooring/install-slots"

  - priority: 14
    category: business_temporal
    check: "On install-slot create, start_at < end_at; both required."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /flooring/install-slots"

  - priority: 15
    category: business_temporal
    check: "On install-slot create, the job has no other SCHEDULED InstallSlot whose closed interval [start_at,end_at] intersects the candidate's closed interval (single-occupancy: a job cannot be installed in two places that share any instant, endpoints inclusive)."
    error_id: ERR_JOB_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /flooring/install-slots"

  - priority: 16
    category: business_temporal
    check: "On install-slot create, the candidate [start_at,end_at) does not overlap any SCHEDULED slot of the same crew once each existing slot is expanded by buffer_minutes on each side (adjacency-with-buffer semantics, half-open)."
    error_id: ERR_CREW_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /flooring/install-slots"

  - priority: 17
    category: business_constraint
    check: "On install-slot create, day_load(crew, UTC-date(start_at)) + scheduled_sqft <= crew.daily_sqft_capacity (aggregate capacity semantics)."
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /flooring/install-slots"

  - priority: 18
    category: business_temporal
    check: "On material-order receive, current clock is at or after expected_ready_date."
    error_id: ERR_MATERIAL_NOT_READY
    http_status: 409
    applies_to: "POST /flooring/material-orders/{id}/receive"

  - priority: 19
    category: state
    check: "On slot start, the job's MaterialOrder is RECEIVED."
    error_id: ERR_MATERIAL_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /flooring/install-slots/{id}/start"

  - priority: 20
    category: business_temporal
    check: "On warranty-claim approve, filed_at is within the warranty window (job COMPLETED clock + product.warranty_years years)."
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /flooring/warranty-claims/{id}/approve"

  - priority: 21
    category: business_safety
    check: "On warranty-claim approve, the parent Job.warranty_risk_score <= 70 (high-risk installs cannot be auto-approved)."
    error_id: ERR_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /flooring/warranty-claims/{id}/approve"

  - priority: 22
    category: business_constraint
    check: "Numeric/enum field bounds: positive sqft, valid category/skill enums, non-negative buffers/lead-times, underlayment cost consistency."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/measure endpoints"

  - priority: 23
    category: business_referential
    check: "On warranty-claim file, the parent Job.status == COMPLETED."
    error_id: ERR_JOB_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /flooring/warranty-claims"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---- Registration / actors ----
  - method: POST
    path: "/flooring/customers"
    description: "Register a homeowner customer."
    roles: [Anonymous, Admin]
    code: 201
    input: [full_name, address, email]
    output: Customer
    side_effects: ["Create Customer with new id."]

  - method: GET
    path: "/flooring/customers/{id}"
    description: "Fetch a customer."
    roles: [Admin, SalesRep, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/flooring/sales-reps"
    description: "Register a sales rep."
    roles: [Anonymous, Admin]
    code: 201
    input: [name]
    output: SalesRep
    side_effects: ["Create SalesRep with new id."]

  - method: GET
    path: "/flooring/sales-reps/{id}"
    description: "Fetch a sales rep."
    roles: [Admin, SalesRep]
    code: 200
    input: []
    output: SalesRep
    side_effects: []

  # ---- Catalog ----
  - method: POST
    path: "/flooring/products"
    description: "Create a catalog product."
    roles: [Admin]
    code: 201
    input: [sku, name, category, material_cost_per_sqft_cents, labor_rate_per_sqft_cents, "requires_underlayment?", "underlayment_cost_per_sqft_cents?", "lead_time_days?", warranty_years]
    output: Product
    side_effects: ["Create Product status=ACTIVE, version=1."]

  - method: GET
    path: "/flooring/products/{id}"
    description: "Fetch a product."
    roles: [Admin, SalesRep, Estimator, Scheduler, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/flooring/products"
    description: "List products with pagination; optional category filter."
    roles: [Admin, SalesRep, Estimator, Scheduler, Customer]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: POST
    path: "/flooring/products/{id}/discontinue"
    description: "Discontinue a product (blocked if live jobs depend on it)."
    roles: [Admin]
    code: 200
    input: []
    output: Product
    side_effects: ["Product ACTIVE->DISCONTINUED; increments Product.version by 1."]

  # ---- Jobs ----
  - method: POST
    path: "/flooring/jobs"
    description: "Create a flooring job in DRAFT for a customer + product + rep."
    roles: [SalesRep, Admin]
    code: 201
    input: [customer_id, sales_rep_id, product_id, declared_sqft]
    output: Job
    side_effects: ["Create Job status=DRAFT, version=1."]

  - method: GET
    path: "/flooring/jobs/{id}"
    description: "Fetch a job (includes computed waste_factor_pct, warranty_risk_score when set)."
    roles: [Admin, SalesRep, Estimator, Scheduler, Customer]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/flooring/jobs"
    description: "List jobs; filter by customer_id, sales_rep_id, product_id, or status."
    roles: [Admin, SalesRep, Estimator, Scheduler, Customer]
    code: 200
    input: ["customer_id?", "sales_rep_id?", "product_id?", "status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []

  - method: POST
    path: "/flooring/jobs/{id}/measure"
    description: "Record the in-home measure (DRAFT->MEASURED or RE_MEASURE->MEASURED)."
    roles: [Estimator]
    code: 200
    input: [measured_sqft, tear_out_sqft, room_count]
    output: Job
    side_effects: ["Set measured geometry; compute waste_factor_pct; increments Job.version by 1."]

  - method: POST
    path: "/flooring/jobs/{id}/request-remeasure"
    description: "Send a MEASURED or ESTIMATED job back for re-measure; voids the latest ISSUED estimate."
    roles: [SalesRep, Admin]
    code: 200
    input: []
    output: Job
    side_effects: ["Job {MEASURED,ESTIMATED}->RE_MEASURE; VOID latest ISSUED estimate; increments Job.version by 1."]

  - method: POST
    path: "/flooring/jobs/{id}/cancel"
    description: "Cancel a job and tear down its estimates, material order, and slots."
    roles: [SalesRep, Admin]
    code: 200
    input: []
    output: Job
    side_effects: ["Job ->CANCELLED; cascade VOID estimates, CANCEL material order, CANCEL slots; increments Job.version by 1."]

  - method: GET
    path: "/flooring/jobs/{id}/estimates"
    description: "List all estimates of a job (reverse-reachability for Estimate.job_id)."
    roles: [Admin, SalesRep, Estimator, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Estimate[]
    side_effects: []

  - method: GET
    path: "/flooring/jobs/{id}/material-orders"
    description: "List material orders of a job (reverse-reachability for MaterialOrder.job_id)."
    roles: [Admin, SalesRep, Scheduler]
    code: 200
    input: ["limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []

  - method: GET
    path: "/flooring/jobs/{id}/install-slots"
    description: "List install slots of a job (reverse-reachability for InstallSlot.job_id)."
    roles: [Admin, SalesRep, Scheduler]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallSlot[]
    side_effects: []

  - method: GET
    path: "/flooring/jobs/{id}/warranty-claims"
    description: "List warranty claims of a job (reverse-reachability for WarrantyClaim.job_id)."
    roles: [Admin, SalesRep, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  # ---- Estimates ----
  - method: POST
    path: "/flooring/estimates"
    description: "Create a DRAFT estimate for a job; computes cost fields per the chosen variant."
    roles: [SalesRep, Admin]
    code: 201
    input: [job_id, variant, valid_until]
    output: Estimate
    side_effects: ["Create Estimate status=DRAFT; compute billable_sqft, material/underlayment/labor/total cents per §1.3 estimate_total."]

  - method: GET
    path: "/flooring/estimates/{id}"
    description: "Fetch an estimate."
    roles: [Admin, SalesRep, Estimator, Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: []

  - method: GET
    path: "/flooring/estimates"
    description: "List estimates; filter by job_id, status, or variant."
    roles: [Admin, SalesRep, Estimator, Customer]
    code: 200
    input: ["job_id?", "status?", "variant?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: []

  - method: POST
    path: "/flooring/estimates/{id}/issue"
    description: "Issue a DRAFT MEASURED estimate; OCC on Job.version; supersedes prior ISSUED."
    roles: [SalesRep, Admin]
    code: 200
    input: [expected_job_version]
    output: Estimate
    side_effects: ["Estimate DRAFT->ISSUED; Job MEASURED->ESTIMATED; VOID prior ISSUED estimate; increments Job.version by 1."]

  - method: POST
    path: "/flooring/estimates/{id}/accept"
    description: "Customer accepts an ISSUED MEASURED estimate; spawns the material order."
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate ISSUED->ACCEPTED; Job ESTIMATED->ACCEPTED; create MaterialOrder ORDERED; increments Job.version by 1."]

  - method: POST
    path: "/flooring/estimates/{id}/expire-check"
    description: "Lazily expire an ISSUED estimate whose valid_until has passed."
    roles: [SalesRep, Admin, Scheduler]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate ISSUED->EXPIRED when clock >= valid_until."]

  # ---- Material orders ----
  - method: GET
    path: "/flooring/material-orders/{id}"
    description: "Fetch a material order."
    roles: [Admin, SalesRep, Scheduler]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []

  - method: GET
    path: "/flooring/material-orders"
    description: "List material orders; filter by job_id, product_id, or status (reverse-reachability for MaterialOrder.product_id)."
    roles: [Admin, SalesRep, Scheduler]
    code: 200
    input: ["job_id?", "product_id?", "status?", "limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []

  - method: POST
    path: "/flooring/material-orders/{id}/backorder"
    description: "Mark an ORDERED material order BACKORDERED."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder ORDERED->BACKORDERED; backorder_count += 1; increments MaterialOrder.version by 1."]

  - method: POST
    path: "/flooring/material-orders/{id}/reorder"
    description: "Re-place a BACKORDERED order; recomputes expected_ready_date from now."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder BACKORDERED->ORDERED; recompute expected_ready_date; increments MaterialOrder.version by 1."]

  - method: POST
    path: "/flooring/material-orders/{id}/receive"
    description: "Receive an ORDERED order at/after its expected_ready_date."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["MaterialOrder ORDERED->RECEIVED; increments MaterialOrder.version by 1."]

  # ---- Crews ----
  - method: POST
    path: "/flooring/install-crews"
    description: "Create an install crew."
    roles: [Scheduler, Admin]
    code: 201
    input: [name, skill_categories, daily_sqft_capacity, "buffer_minutes?"]
    output: InstallCrew
    side_effects: ["Create InstallCrew status=AVAILABLE, version=1."]

  - method: GET
    path: "/flooring/install-crews/{id}"
    description: "Fetch a crew."
    roles: [Admin, Scheduler]
    code: 200
    input: []
    output: InstallCrew
    side_effects: []

  - method: GET
    path: "/flooring/install-crews"
    description: "List crews; filter by status."
    roles: [Admin, Scheduler]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallCrew[]
    side_effects: []

  - method: POST
    path: "/flooring/install-crews/{id}/deactivate"
    description: "Deactivate an AVAILABLE crew with no SCHEDULED slots."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: InstallCrew
    side_effects: ["InstallCrew AVAILABLE->INACTIVE; increments InstallCrew.version by 1."]

  - method: GET
    path: "/flooring/install-crews/{id}/install-slots"
    description: "List a crew's slots (reverse-reachability for InstallSlot.crew_id)."
    roles: [Admin, Scheduler]
    code: 200
    input: ["limit?", "offset?"]
    output: InstallSlot[]
    side_effects: []

  # ---- Install slots ----
  - method: POST
    path: "/flooring/install-slots"
    description: "Schedule an install slot for an ACCEPTED job on a crew; enforces skill, interval, buffer-overlap, and daily capacity."
    roles: [Scheduler, Admin]
    code: 201
    input: [job_id, crew_id, start_at, end_at]
    output: InstallSlot
    side_effects: ["Create InstallSlot status=SCHEDULED; scheduled_sqft = accepted MEASURED estimate billable_sqft; consume crew day capacity."]

  - method: GET
    path: "/flooring/install-slots/{id}"
    description: "Fetch an install slot."
    roles: [Admin, Scheduler, SalesRep]
    code: 200
    input: []
    output: InstallSlot
    side_effects: []

  - method: POST
    path: "/flooring/install-slots/{id}/start"
    description: "Start install (Job ACCEPTED->IN_INSTALL); requires material RECEIVED."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: InstallSlot
    side_effects: ["Job ACCEPTED->IN_INSTALL; increments Job.version by 1."]

  - method: POST
    path: "/flooring/install-slots/{id}/complete"
    description: "Complete install (slot SCHEDULED->DONE; Job IN_INSTALL->COMPLETED)."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: InstallSlot
    side_effects: ["InstallSlot SCHEDULED->DONE; Job IN_INSTALL->COMPLETED; compute warranty_risk_score; increments Job.version by 1."]

  - method: POST
    path: "/flooring/install-slots/{id}/cancel"
    description: "Cancel a SCHEDULED slot and release its crew capacity."
    roles: [Scheduler, Admin]
    code: 200
    input: []
    output: InstallSlot
    side_effects: ["InstallSlot SCHEDULED->CANCELLED; release scheduled_sqft from crew day capacity; increments InstallSlot.version by 1."]

  # ---- Warranty claims ----
  - method: POST
    path: "/flooring/warranty-claims"
    description: "File a warranty claim against a COMPLETED job (customer must own the job)."
    roles: [Customer, Admin]
    code: 201
    input: [job_id, defect_description]
    output: WarrantyClaim
    side_effects: ["Create WarrantyClaim status=FILED; filed_at = current clock."]

  - method: GET
    path: "/flooring/warranty-claims/{id}"
    description: "Fetch a warranty claim."
    roles: [Admin, SalesRep, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/flooring/warranty-claims/{id}/approve"
    description: "Approve a FILED claim within window and risk gate."
    roles: [Admin]
    code: 200
    input: [resolution_note]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim FILED->APPROVED; record resolution_note; increments WarrantyClaim.version by 1."]

  - method: POST
    path: "/flooring/warranty-claims/{id}/deny"
    description: "Deny a FILED claim."
    roles: [Admin]
    code: 200
    input: [resolution_note]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim FILED->DENIED; record resolution_note; increments WarrantyClaim.version by 1."]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving)."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock set to the supplied instant for subsequent time-gated checks."]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers on a protected endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint per §1.7."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Customer acts on a job/estimate/claim they do not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id (path or body FK) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_PRODUCT_DISCONTINUED
    http: 409
    condition: "Job create references a DISCONTINUED product."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Product.sku duplicate among ACTIVE products, or Customer.email duplicate."
  - id: ERR_VARIANT_STATE_MISMATCH
    http: 409
    condition: "Estimate variant (PROVISIONAL/MEASURED) does not match the job's status (DRAFT/MEASURED)."
  - id: ERR_VALID_UNTIL_IN_PAST
    http: 422
    condition: "Estimate issue with valid_until at or before the current clock."
  - id: ERR_STALE_JOB_VERSION
    http: 412
    condition: "expected_job_version does not equal current Job.version on estimate issue (OCC)."
  - id: ERR_ESTIMATE_EXPIRED
    http: 409
    condition: "Estimate accept at or after the estimate's valid_until."
  - id: ERR_CREW_SKILL_MISMATCH
    http: 409
    condition: "Install slot crew lacks the job's product category in skill_categories."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Install slot start_at not strictly before end_at."
  - id: ERR_CREW_TIME_CONFLICT
    http: 409
    condition: "Install slot overlaps another SCHEDULED slot of the same crew once expanded by buffer_minutes."
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "Install slot would push the crew's day load above daily_sqft_capacity."
  - id: ERR_JOB_SLOT_OVERLAP
    http: 409
    condition: "Install slot's closed interval intersects another SCHEDULED slot of the same job (single-occupancy per job)."
  - id: ERR_JOB_NOT_ACCEPTED
    http: 409
    condition: "Install slot create for a job not in ACCEPTED status / without an accepted MEASURED estimate."
  - id: ERR_MATERIAL_NOT_READY
    http: 409
    condition: "Material-order receive before expected_ready_date."
  - id: ERR_MATERIAL_NOT_RECEIVED
    http: 409
    condition: "Slot start while the job's material order is not RECEIVED."
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "Warranty claim approve when filed_at is outside the warranty window."
  - id: ERR_RISK_TOO_HIGH
    http: 409
    condition: "Warranty claim approve when job.warranty_risk_score > 70."
  - id: ERR_JOB_NOT_COMPLETED
    http: 409
    condition: "Warranty claim file when the job is not COMPLETED."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Field bound/enum/type violation (non-positive sqft, bad category, negative buffer/lead time, underlayment cost inconsistency, missing required field, malformed body)."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Admin
    description: "Catalog owner and warranty adjudicator; superset operational override."
    identity: "opaque"
    exclusive_operations:
      - "POST /flooring/products"
      - "POST /flooring/products/{id}/discontinue"
      - "POST /flooring/warranty-claims/{id}/approve"
      - "POST /flooring/warranty-claims/{id}/deny"
    shared_operations:
      - "All SalesRep, Estimator, Scheduler write operations (override)."
      - "Read operations on every resource."

  - name: SalesRep
    description: "Owns jobs and estimates; drives the sales workflow."
    identity: "entity_backed:SalesRep"
    exclusive_operations:
      - "POST /flooring/jobs"
      - "POST /flooring/jobs/{id}/request-remeasure"
      - "POST /flooring/jobs/{id}/cancel"
      - "POST /flooring/estimates"
      - "POST /flooring/estimates/{id}/issue"
    shared_operations:
      - "POST /flooring/estimates/{id}/expire-check (with Scheduler, Admin)."
      - "Read jobs, estimates, products, slots, claims."

  - name: Estimator
    description: "Performs the in-home measure; owns measured geometry."
    identity: "opaque"
    exclusive_operations:
      - "POST /flooring/jobs/{id}/measure"
    shared_operations:
      - "Read jobs, estimates, products."

  - name: Scheduler
    description: "Owns crews, material orders, and install slots."
    identity: "opaque"
    exclusive_operations:
      - "POST /flooring/install-crews"
      - "POST /flooring/install-crews/{id}/deactivate"
      - "POST /flooring/install-slots"
      - "POST /flooring/install-slots/{id}/start"
      - "POST /flooring/install-slots/{id}/complete"
      - "POST /flooring/install-slots/{id}/cancel"
      - "POST /flooring/material-orders/{id}/backorder"
      - "POST /flooring/material-orders/{id}/reorder"
      - "POST /flooring/material-orders/{id}/receive"
    shared_operations:
      - "POST /flooring/estimates/{id}/expire-check (with SalesRep, Admin)."
      - "Read crews, slots, material orders, jobs."

  - name: Customer
    description: "Homeowner; accepts estimates and files warranty claims on own jobs."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /flooring/estimates/{id}/accept"
    shared_operations:
      - "POST /flooring/warranty-claims (with Admin)."
      - "Read own jobs, estimates, claims, products."

  - name: Anonymous
    description: "Unauthenticated caller; only self-registration."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /flooring/customers"
      - "POST /flooring/sales-reps"
