              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/request-changes"
              payload: { change_note: "Confirm the second tranche date." }
              as: BoardMember
              as_user_id: "board-1"
            - call: "POST /grants/${g_id}/revise"
              payload: { target_shares: 12000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
