  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_access_windows_touching_at_one_instant_are_accepted_half_open
        grounds:
          - validations[priority=53]
          - errors[ERR_UNIT_ACCESS_WINDOW_CONFLICT]
          - calculations.notice_lead_hours
          - state_machines.SampleSelection.NOT_NOTIFIED_to_NOTIFIED
        distinguishing_aspect: |
          Unit access windows are HALF-OPEN with no buffer, so a second window on the SAME unit
          whose access_window_start equals the first window's access_window_end must be accepted -
          the opposite outcome from the CLOSED-interval inspection scheduling rule at priority 52.
          The two competing windows also belong to two different Inspections of the same property,
          so the conflict scan has to be unit-scoped rather than inspection-scoped.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard; Property Cedar Walk (total_unit_count 1) with unit 101 OCCUPIED."
            - "Two inspections are scheduled far enough apart (2026-09-10 and 2026-09-20) that their 72-hour expanded windows do not touch, and both sample unit 101 because the exclusion filter is per-inspection."
            - "Inspection A's selection is noticed for [2026-09-10T09:00:00.000Z, 2026-09-10T12:00:00.000Z), lead 864.00 hours."
          setup_api_calls:
            - call: "POST /inspection-standards"
