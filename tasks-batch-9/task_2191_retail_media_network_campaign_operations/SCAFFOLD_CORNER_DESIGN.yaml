              payload: { invoice_id: "${inv_id}", dispute_category: "IMPRESSION_DISCREPANCY", claimed_amount_cents: 300, line_item_id: "${li_id}", evidence_note: "Over-claim beyond the invoice", expected_invoice_version: "${inv_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_CLAIM_EXCEEDS_INVOICE"
