  - section: consistency_model
    instances:
      - name: immediate_read_after_accept
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Engagement.PENDING_ACCEPTANCE_to_IN_PROGRESS]
        distinguishing_aspect: "Immediate consistency: the GET after accept reflects IN_PROGRESS, the locked final_fee_cents 450000, accepted_at at the default clock, and due_date 30 days later in the same request sequence."
        test_recipe:
          setup: ["engagement submitted (TIERED STANDARD, 1 approach, 30-day turnaround, client total 0 -> quote 450000)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "100 Main St", property_type: "OFFICE", building_sf: 30000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1, fee_schedule: "TIERED", is_contingent_fee: false }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/submit"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /engagements/${eng_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "GET /engagements/${eng_id}"
              as: EngagementManager
              captures: { st: $.data.status, fee: $.data.final_fee_cents, acc: $.data.accepted_at, due: $.data.due_date }
          assert:
            - "Engagement.${eng_id}.status == IN_PROGRESS"
