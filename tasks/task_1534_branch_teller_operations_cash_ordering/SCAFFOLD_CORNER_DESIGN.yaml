            - "${au_status} == IN_PROGRESS"
            - "${au_freeze} == true"
            - "${b_status} == AUDIT_FROZEN"

      - name: scheduled_audit_begin_on_wrong_date_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AuditSession.PLANNED_to_IN_PROGRESS, "errors[ERR_AUDIT_NOT_DUE]"]
        distinguishing_aspect: "begin requires the logical date to equal scheduled_date; at the default clock (2026-08-01) a 2026-08-07 audit cannot begin (ERR_AUDIT_NOT_DUE)."
        test_recipe:
          setup: ["Branch B; a SCHEDULED audit for 2026-08-07 (a Friday)"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/audits"
              payload: { type: "SCHEDULED", scheduled_date: "2026-08-07" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /api/audits/${au_id}/begin"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_AUDIT_NOT_DUE"

      - name: rejected_cash_order_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.CashOrder.PENDING_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal REJECTED no further transition is possible: approve on a rejected order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Branch B; teller T; order created then rejected"]
          setup_api_calls:
            - call: "POST /api/branches"
