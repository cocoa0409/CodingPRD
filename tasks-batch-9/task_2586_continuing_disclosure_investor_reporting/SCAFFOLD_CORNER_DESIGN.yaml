            - "${n_status_after} == MISSED; ${eng_status_after} == ACTIVE with ${eng_lapse_after} == 31 — 31 <= 45, so step 4 skips it"
            - "${u1_late} == 2, ${u1_missed} == 1, ${u1_delq} == 2"
            - "${u1_score} == 74.00 — base 12*2 + 20*1 + 15*2 = 74 times the prior TIER_0 multiplier 1.00, applied ONCE for the whole sweep and not once per row"
            - "${u1_tier} == TIER_2 and ${u1_posture} == DELINQUENT; ${fte_total} == 3"
            - "${s2_matured} == 0, ${s2_delinquent} == 0, ${s2_missed} == 0, ${s2_suspended} == 0, ${s2_failures} == 0 — the second sweep at the same clock finds no candidates"
            - "${u2_score} == 74.00, ${u2_tier} == TIER_2, ${u2_late} == 2 and ${fte_total2} == 3 — a no-op sweep must not re-multiply the score to 92.50 nor mint duplicate failures"

      - name: submit_is_a_conditional_action_on_engagement_state
