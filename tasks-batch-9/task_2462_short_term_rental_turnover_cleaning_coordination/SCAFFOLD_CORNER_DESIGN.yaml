# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  --  section 1.9 (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe for tasks/task_2462_short_term_rental_turnover_cleaning_coordination.
# Walked row-by-row from references/claim-extraction-guide.md against SCAFFOLD.yaml
# sections 1.1-1.7. `section:` values and `claim_type:` values are taken verbatim from that
# guide's nine sections and per-section tables; no category is invented.
#
# Corners already asserted by a named instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no `test_recipe:`.
#
# Fixture world shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   logical clock starts at 2026-08-01T00:00:00Z (POST /_clock/set_current_utc drives it)
#   P1 "AUS-101" ZONE_A TWO_BR 2 bath / 3 beds, local_utc_offset_minutes -300,
#      min_clean_minutes 120, min_skill_level 2  -> required_minutes 198
#   Cleaner C  ZONE_A skill 4 quality 92.00 max_daily_turnovers 3
#   OUT-1 [2026-08-05T21:00Z, 2026-08-08T16:00Z)  IN-1 [2026-08-08T21:00Z, 2026-08-11T16:00Z)
#      -> T1 window 16:00Z-20:30Z, window_minutes 270, slack 72, SAME_DAY, is_tight false
#   acting user ids: coord-1 (assign), coord-2 (review), auditor-1 (audit)
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_property_creation_echoes_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Property
          - endpoints["POST /properties"]
        distinguishing_aspect: |
          POST /properties with every optional field supplied returns 201 and echoes all
          fifteen declared fields; open_issue_count is initialised to 0 and
          last_turnover_completed_at to null even though neither is an input.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2, owner_notify_min_cost_cents: 5000, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { p1: "$.data.id", p_open: "$.data.open_issue_count", p_last: "$.data.last_turnover_completed_at", p_status: "$.data.status", p_ver: "$.data.version" }
          assert:
            - "HTTP 201"
            - "Property.${p1}.code == AUS-101 and name == Barton Loft and zone_code == ZONE_A and size_tier == TWO_BR"
            - "Property.${p1}.bedroom_count == 2 and bathroom_count == 2 and bed_count == 3"
            - "Property.${p1}.local_utc_offset_minutes == -300 and min_clean_minutes == 120 and min_skill_level == 2"
            - "Property.${p1}.owner_contact_email == owner1@example.com and owner_notify_min_cost_cents == 5000"
            - "${p_status} == ACTIVE, ${p_open} == 0, ${p_last} == null, ${p_ver} == 1"

      - name: corner_property_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.Property.fields.bedroom_count
          - entities.Property.fields.min_clean_minutes
          - entities.Property.fields.owner_notify_min_cost_cents
          - endpoints["POST /properties"]
        distinguishing_aspect: |
          Only the five required fields are supplied, so every documented default must
          materialise: bedroom_count/bathroom_count/bed_count 1, local_utc_offset_minutes 0,
          min_clean_minutes 60, min_skill_level 1, owner_notify_min_cost_cents 5000,
          status ACTIVE. A STUDIO with those defaults therefore has required_minutes
          MAX(60, 90 + 12 + 8) == 110, not 90.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { code: "AUS-110", name: "Minimal Studio", zone_code: "ZONE_A", size_tier: "STUDIO", owner_contact_email: "owner10@example.com" }
              as: PlatformAdmin
              captures: { p: "$.data.id", bed: "$.data.bedroom_count", bath: "$.data.bathroom_count", beds: "$.data.bed_count", off: "$.data.local_utc_offset_minutes", mcm: "$.data.min_clean_minutes", msl: "$.data.min_skill_level", notify: "$.data.owner_notify_min_cost_cents", st: "$.data.status" }
          assert:
            - "HTTP 201"
            - "${bed} == 1 and ${bath} == 1 and ${beds} == 1"
            - "${off} == 0 and ${mcm} == 60 and ${msl} == 1"
            - "${notify} == 5000 and ${st} == ACTIVE"

      - name: corner_supply_line_computed_below_par_derives_from_on_hand_and_reorder_point
        claim_type: Computed Fields
        grounds:
          - entities.SupplyLine.fields.on_hand_qty
          - entities.SupplyLine.fields.below_par
          - calculations.supply_on_hand_projection
          - endpoints["POST /properties/{id}/supply-lines"]
        distinguishing_aspect: |
          below_par is computed as on_hand_qty <= reorder_point, NOT as on_hand_qty < par_qty.
          A line seeded 2 units against par 6 with reorder_point 0 is therefore below_par
          false, while an identical line seeded 0 units is below_par true. on_hand_qty comes
          from the SEED movement, never from a client field.
        test_recipe:
          setup:
            - "Property P1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 2 }
              as: PlatformAdmin
              captures: { sl_a: "$.data.id", a_qty: "$.data.on_hand_qty", a_below: "$.data.below_par", a_reorder: "$.data.reorder_point", a_unit: "$.data.unit", a_status: "$.data.status" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "CON-COFFEE", name: "Coffee pods", category: "CONSUMABLE", unit_cost_cents: 340, par_qty: 4 }
              as: PlatformAdmin
              captures: { sl_b: "$.data.id", b_qty: "$.data.on_hand_qty", b_below: "$.data.below_par", b_unit: "$.data.unit" }
            - call: "GET /stock-movements"
              payload: { supply_line_id: "${sl_a}" }
              as: Coordinator
              captures: { mv_reason: "$.data[0].reason", mv_delta: "$.data[0].delta_qty", mv_charge: "$.data[0].charge_cents", mv_cost: "$.data[0].unit_cost_cents_at_time" }
          assert:
            - "${a_qty} == 2, ${a_reorder} == 0, ${a_below} == false (2 <= 0 is false), ${a_unit} == SET, ${a_status} == ACTIVE"
            - "${b_qty} == 0, ${b_below} == true (0 <= 0), ${b_unit} == each (declared default)"
            - "${mv_reason} == SEED, ${mv_delta} == 2, ${mv_charge} == 0, ${mv_cost} == 260"

      - name: corner_stock_movement_is_immutable_append_only_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.StockMovement
          - calculations.supply_on_hand_projection
          - endpoints["GET /stock-movements"]
        distinguishing_aspect: |
          StockMovement declares common_fields false, so rows carry id and created_at but
          NO updated_at and NO version, and section 1.5 exposes no PUT/PATCH/DELETE for them. A
          replenishment appends a second row rather than editing the SEED row, and
          on_hand_qty stays equal to SUM(delta_qty) over the whole log.
        test_recipe:
          setup:
            - "Property P1 with LIN-SHEET-Q seeded at 6 units (one SEED movement, sequence_no 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: PlatformAdmin
              captures: { sl1: "$.data.id", sl1_v: "$.data.version" }
          trigger:
            - call: "POST /supply-lines/${sl1}/replenish"
              payload: { qty: 4, expected_supply_line_version: "${sl1_v}", note: "delivery 8817" }
              as: PlatformAdmin
              captures: { r_qty: "$.data.on_hand_qty", r_ver: "$.data.version" }
            - call: "GET /stock-movements"
              payload: { supply_line_id: "${sl1}" }
              as: PlatformAdmin
              captures: { m0_seq: "$.data[0].sequence_no", m0_delta: "$.data[0].delta_qty", m1_seq: "$.data[1].sequence_no", m1_delta: "$.data[1].delta_qty", m1_reason: "$.data[1].reason", m1_note: "$.data[1].note" }
          assert:
            - "${r_qty} == 10 and ${r_ver} == 2 (the SupplyLine has a version; the movements do not)"
            - "${m0_seq} == 1 and ${m0_delta} == 6 - the SEED row is unchanged by the replenishment"
            - "${m1_seq} == 2, ${m1_delta} == 4, ${m1_reason} == REPLENISH, ${m1_note} == delivery 8817"
            - "each StockMovement payload exposes id and created_at but no updated_at and no version field"
            - "GET /stock-movements?supply_line_id=${sl1} has total_count == 2 and 6 + 4 == 10 == on_hand_qty"

      - name: corner_cleaner_retrieval_returns_stored_inputs_and_zeroed_derived_counters
        claim_type: Retrieval
        grounds:
          - entities.Cleaner
          - endpoints["POST /cleaners"]
          - endpoints["GET /cleaners/{id}"]
        distinguishing_aspect: |
          GET /cleaners/{id} returns exactly what POST stored, and the four computed
          counters (pending_payout_cents, completed_turnover_count, decline_count,
          strike_count) all read 0 on a freshly onboarded cleaner while quality_score
          reflects the supplied initial_quality_score rather than the 80.0 default.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, secondary_zone_codes: ["ZONE_B"], accepts_cross_zone: true, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
          trigger:
            - call: "GET /cleaners/${cc}"
              payload: {}
              as: Coordinator
              captures: { g_name: "$.data.name", g_home: "$.data.home_zone_code", g_sec: "$.data.secondary_zone_codes", g_cross: "$.data.accepts_cross_zone", g_skill: "$.data.skill_level", g_cap: "$.data.max_daily_turnovers", g_q: "$.data.quality_score", g_st: "$.data.status", g_pay: "$.data.pending_payout_cents", g_done: "$.data.completed_turnover_count", g_dec: "$.data.decline_count", g_strike: "$.data.strike_count" }
          assert:
            - "HTTP 200"
            - "${g_name} == Cleaner C, ${g_home} == ZONE_A, ${g_sec} == [ZONE_B], ${g_cross} == true"
            - "${g_skill} == 4, ${g_cap} == 3, ${g_q} == 92.00, ${g_st} == ACTIVE"
            - "${g_pay} == 0, ${g_done} == 0, ${g_dec} == 0, ${g_strike} == 0"

      - name: corner_turnover_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /turnovers"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three turnovers exist on P1. GET /turnovers?limit=2&offset=0 returns 2 rows with
          total_count 3 and has_more true; offset=2 returns 1 row with has_more false. The
          declared order is window_start_at ascending then created_at ascending, so the page
          boundary is deterministic: window starts 16:00Z, 18:00Z, 20:00Z on 2026-08-08.
        test_recipe:
          setup:
            - "Property P1 exists."
            - "Three outgoing bookings on P1 with non-overlapping half-open stays and contracted checkouts at 2026-08-08T16:00Z, 18:00Z and 20:00Z, each opened as a VACANT_GAP turnover (no incoming booking), so window_start_at is exactly the checkout instant and window_minutes is 2880."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "PG-1", guest_name: "Guest One", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { bk1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "PG-2", guest_name: "Guest Two", checkin_at: "2026-08-08T16:00:00Z", checkout_at: "2026-08-08T18:00:00Z" }
              as: Coordinator
              captures: { bk2: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "PG-3", guest_name: "Guest Three", checkin_at: "2026-08-08T18:00:00Z", checkout_at: "2026-08-08T20:00:00Z" }
              as: Coordinator
              captures: { bk3: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${bk1}" }
              as: Coordinator
              captures: { tg1: "$.data.id", tg1_type: "$.data.turn_type", tg1_min: "$.data.window_minutes" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${bk2}" }
              as: Coordinator
              captures: { tg2: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${bk3}" }
              as: Coordinator
              captures: { tg3: "$.data.id" }
          trigger:
            - call: "GET /turnovers"
              payload: { property_id: "${p1}", limit: 2, offset: 0 }
              as: Coordinator
              captures: { pg1_first: "$.data[0].id", pg1_second: "$.data[1].id" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}", limit: 2, offset: 2 }
              as: Coordinator
              captures: { pg2_first: "$.data[0].id" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}" }
              as: Coordinator
          assert:
            - "${tg1_type} == VACANT_GAP and ${tg1_min} == 2880 (48 h vacant window)"
            - "page one: response_type == array, meta carries api_request_id and api_request_timestamp, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "${pg1_first} == ${tg1} and ${pg1_second} == ${tg2} (window_start_at ascending)"
            - "page two: limit == 2, offset == 2, total_count == 3, has_more == false, exactly 1 row"
            - "${pg2_first} == ${tg3}"
            - "the unparameterised list applies the declared defaults limit == 10 and offset == 0 and returns all 3 rows with has_more == false"

      - name: corner_booking_not_found_for_unknown_uuid
        claim_type: Not Found
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
          - endpoints["GET /bookings/{id}"]
        distinguishing_aspect: |
          A well-formed UUID that addresses no Booking yields ERR_BOOKING_NOT_FOUND with
          HTTP 404 and the error envelope (response_type "error", data.error_id,
          data.message) - not 200 with a null body and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coordinator
          assert:
            - "HTTP 404 with data.error_id == ERR_BOOKING_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present"

      - name: corner_booking_required_field_missing_is_rejected
        claim_type: Required Fields
        grounds:
          - endpoints["POST /bookings"]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority 3]
        distinguishing_aspect: |
          POST /bookings declares five required inputs. Omitting checkout_at (a required
          datetime with no default) returns ERR_INVALID_REQUEST 400 at priority 3 - before any
          existence, interval or overlap check - and creates no Booking row.
        test_recipe:
          setup:
            - "Property P1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z" }
              as: Coordinator
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /bookings?property_id=${p1} returns total_count == 0"

      - name: corner_property_rejects_unknown_size_tier_enum_value
        claim_type: Type Constraints
        grounds:
          - entities.Property.fields.size_tier
          - errors[ERR_INVALID_REQUEST]
          - calculations.turnover_window_and_requirement.constants.SIZE_BASE_MINUTES
        distinguishing_aspect: |
          size_tier is an enum whose only members are the four SIZE_BASE_MINUTES keys.
          "FOUR_BR" is not one of them, so the create is refused with ERR_INVALID_REQUEST 400
          rather than silently defaulting to a tier - a property with no base minutes could
          not compute required_minutes at all.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { code: "AUS-199", name: "Bad Tier", zone_code: "ZONE_A", size_tier: "FOUR_BR", owner_contact_email: "owner99@example.com" }
              as: PlatformAdmin
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Property with code AUS-199 exists afterwards"

      - name: corner_system_and_computed_fields_are_server_minted_on_turnover_create
        claim_type: System Fields
        grounds:
          - entities.Turnover.fields.property_id
          - entities.Turnover.fields.status
          - entities.Turnover.fields.window_start_at
          - endpoints["POST /turnovers"]
        distinguishing_aspect: |
          POST /turnovers accepts only outgoing_booking_id, incoming_booking_id and
          override_reason; property_id, the four window fields, turn_type, is_tight and status
          are all server-derived. The response therefore carries property_id == P1 (copied
          from the booking, never from the request), status PENDING_ASSIGNMENT, version 1,
          a UUID id with no type prefix and created_at/updated_at in ISO 8601 UTC.
        test_recipe:
          setup:
            - "Property P1 with OUT-1 and IN-1 as declared in the shared fixture world."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t_prop: "$.data.property_id", t_start: "$.data.window_start_at", t_end: "$.data.window_end_at", t_min: "$.data.window_minutes", t_req: "$.data.required_minutes", t_slack: "$.data.slack_minutes", t_type: "$.data.turn_type", t_tight: "$.data.is_tight", t_status: "$.data.status", t_ver: "$.data.version", t_hold: "$.data.pre_hold_status", t_tasks: "$.data.checklist_task_count" }
          assert:
            - "HTTP 201"
            - "${t_prop} == ${p1} (copied from the outgoing booking, not supplied)"
            - "${t_start} == 2026-08-08T16:00:00Z and ${t_end} == 2026-08-08T20:30:00Z"
            - "${t_min} == 270, ${t_req} == 198, ${t_slack} == 72, ${t_type} == SAME_DAY, ${t_tight} == false"
            - "${t_status} == PENDING_ASSIGNMENT, ${t_ver} == 1, ${t_hold} == null, ${t_tasks} == 0"
            - "${t1} is a bare UUID with no type prefix; created_at and updated_at are ISO 8601 UTC with three fractional digits"

      - name: corner_supply_line_parent_must_exist_on_nested_create
        claim_type: Parent Relationships
        grounds:
          - entities.SupplyLine.fields.property_id
          - errors[ERR_PROPERTY_NOT_FOUND]
          - endpoints["POST /properties/{id}/supply-lines"]
        distinguishing_aspect: |
          The nested route carries the parent id. Posting a supply line under a UUID that
          addresses no Property returns ERR_PROPERTY_NOT_FOUND 404 (priority 5, existence)
          rather than creating an orphan line - SupplyLine.property_id is computed from the
          path, so there is no other way to bind it.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties/00000000-0000-4000-8000-000000000000/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6 }
              as: PlatformAdmin
          assert:
            - "HTTP 404 with data.error_id == ERR_PROPERTY_NOT_FOUND"

      - name: corner_flat_topology_cross_property_booking_pair_is_rejected
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_PROPERTY_MISMATCH]
          - validations[priority 10]
          - endpoints["POST /turnovers"]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so a Turnover binds two Booking foreign keys that must agree
          on property. An incoming booking belonging to a different property is refused with
          ERR_PROPERTY_MISMATCH 422 at priority 10 - after both existence checks pass and
          before any window arithmetic runs, so no partially derived Turnover is persisted.
        test_recipe:
          setup:
            - "Properties P1 (AUS-101) and P2 (AUS-102) both exist and are ACTIVE."
            - "OUT-1 is on P1; IN-X is on P2 with an interval that would otherwise yield a valid window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Zilker Flat", zone_code: "ZONE_A", size_tier: "ONE_BR", owner_contact_email: "owner2@example.com" }
              as: PlatformAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p2}", external_ref: "IN-X", guest_name: "Guest Other", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_other: "$.data.id" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_other}" }
              as: Coordinator
          assert:
            - "HTTP 422 with data.error_id == ERR_PROPERTY_MISMATCH"
            - "GET /turnovers?outgoing_booking_id=${b_out} returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_initial_states_of_booking_turnover_and_assignment
        claim_type: Initial State
        grounds:
          - state_machines.Booking.initial_state
          - state_machines.Turnover.initial_state
          - state_machines.Assignment.initial_state
          - state_machines.ChecklistTask.initial_state
        distinguishing_aspect: |
          Every machine's declared initial_state materialises on create and nothing else:
          Booking SCHEDULED with checkin_gate OPEN and guest_notice_code NONE, Turnover
          PENDING_ASSIGNMENT, Assignment OFFERED (not ACCEPTED - an offer is not an
          acceptance), and the generated ChecklistTasks all PENDING.
        test_recipe:
          setup:
            - "Property P1, Cleaner C, bookings OUT-1 and IN-1 as declared in the shared fixture world."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id", b_status: "$.data.status", b_gate: "$.data.checkin_gate", b_notice: "$.data.guest_notice_code", b_rating: "$.data.cleanliness_rating", b_actual: "$.data.actual_checkout_at" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version", t_status: "$.data.status" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id", a_status: "$.data.status", a_seq: "$.data.sequence_no", a_acc: "$.data.accepted_at", a_dec: "$.data.declined_at", a_rev: "$.data.revoked_at" }
          assert:
            - "${b_status} == SCHEDULED, ${b_gate} == OPEN, ${b_notice} == NONE, ${b_rating} == null, ${b_actual} == null"
            - "${t_status} == PENDING_ASSIGNMENT and ${t1_v} == 1"
            - "${a_status} == OFFERED, ${a_seq} == 1, ${a_acc} == null, ${a_dec} == null, ${a_rev} == null"
            - "Cleaner.${cc}.status == ACTIVE (declared initial_state) and SupplyLine/ChecklistTask rows do not yet exist"

      - name: corner_assignment_offered_to_declined_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.Assignment.OFFERED_to_DECLINED
          - endpoints["POST /assignments/{id}/decline"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / assignment_offered_fork_decline_leaves_turnover_version_untouched
          rationale: "That instance drives the OFFERED -> DECLINED transition, asserts declined_at, decline_count 1 and the un-incremented Turnover.version, and then re-offers - the full valid-transition claim plus its branch divergence."

      - name: corner_cancelling_an_already_cancelled_booking_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Booking.SCHEDULED_to_CANCELLED
          - errors[ERR_BOOKING_NOT_SCHEDULED]
          - validations[priority 12]
        distinguishing_aspect: |
          CANCELLED is a terminal occupancy state, so the second cancel returns
          ERR_BOOKING_NOT_SCHEDULED 409 and fires no side effect: the version stays exactly
          where the first cancel left it, proving the request was refused rather than replayed.
        test_recipe:
          setup:
            - "Property P1 with booking OUT-1 in SCHEDULED and no turnover on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
          trigger:
            - call: "POST /bookings/${b_out}/cancel"
              payload: { cancellation_reason: "guest cancelled" }
              as: Coordinator
              captures: { c1_status: "$.data.status", c1_ver: "$.data.version" }
            - call: "POST /bookings/${b_out}/cancel"
              payload: { cancellation_reason: "duplicate request" }
              as: Coordinator
            - call: "GET /bookings/${b_out}"
              payload: {}
              as: Coordinator
              captures: { after_status: "$.data.status", after_ver: "$.data.version" }
          assert:
            - "first cancel: HTTP 200, ${c1_status} == CANCELLED, ${c1_ver} == 2"
            - "second cancel: HTTP 409 with data.error_id == ERR_BOOKING_NOT_SCHEDULED"
            - "${after_status} == CANCELLED and ${after_ver} == 2 (unchanged - the refusal mutated nothing)"

      - name: corner_cancelled_booking_rejects_checkout_and_schedule_change
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Booking.terminal_states
          - errors[ERR_BOOKING_NOT_SCHEDULED]
          - endpoints["POST /bookings/{id}/checkout"]
          - endpoints["POST /bookings/{id}/schedule-change"]
        distinguishing_aspect: |
          From the terminal CANCELLED state no occupancy transition exists at all: both
          checkout and schedule-change return ERR_BOOKING_NOT_SCHEDULED 409, and
          actual_checkout_at and late_checkout_until_at both stay null.
        test_recipe:
          setup:
            - "Property P1 with booking OUT-1 already CANCELLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings/${b_out}/cancel"
              payload: { cancellation_reason: "guest cancelled" }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
            - call: "POST /bookings/${b_out}/schedule-change"
              payload: { change_type: "LATE_CHECKOUT", new_time_at: "2026-08-08T18:00:00Z" }
              as: Coordinator
            - call: "GET /bookings/${b_out}"
              payload: {}
              as: Coordinator
              captures: { f_status: "$.data.status", f_actual: "$.data.actual_checkout_at", f_late: "$.data.late_checkout_until_at", f_ver: "$.data.version" }
          assert:
            - "checkout: HTTP 409 with data.error_id == ERR_BOOKING_NOT_SCHEDULED"
            - "schedule-change: HTTP 409 with data.error_id == ERR_BOOKING_NOT_SCHEDULED"
            - "${f_status} == CANCELLED, ${f_actual} == null, ${f_late} == null, ${f_ver} == 2"

      - name: corner_submitting_a_verified_checklist_task_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ChecklistTask.PENDING_to_SUBMITTED
          - errors[ERR_INVALID_TASK_STATE]
          - validations[priority 12]
        distinguishing_aspect: |
          The submit trigger is declared only from PENDING and from REJECTED. A VERIFIED task
          has no submit edge, so re-submitting it returns ERR_INVALID_TASK_STATE 409, the task
          keeps status VERIFIED and its submitted_at is not refreshed - the photo-rework loop
          cannot be re-entered from VERIFIED, only WAIVE can leave it.
        test_recipe:
          setup:
            - "P1 with LIN-SHEET-Q (LINEN 260c par 6 on_hand 6), Cleaner C, T1 IN_PROGRESS at clock 2026-08-08T16:00:00Z with 4 PENDING tasks."
            - "The STRIP_LINENS task (sequence_no 10, requires_photo false) has been submitted and APPROVED, so it is VERIFIED."
