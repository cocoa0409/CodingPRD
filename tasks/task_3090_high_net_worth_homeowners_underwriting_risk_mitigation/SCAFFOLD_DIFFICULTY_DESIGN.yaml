  # ===========================================================================
  # Rule 6 — boundary-precision checks on different metrics and endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: scheduled_aggregate_cap_exactly_at_boundary_is_accepted
        grounds:
          - validations[priority=12]
          - calculations.replacement_cost_valuation
          - entities.Property.fields.total_insured_value_cents
        distinguishing_aspect: "An aggregate numeric boundary on one endpoint: the scheduled value cap is tested as sum <= round_half_up(0.60 x total_insured_value_cents), so 150000000 against a bound of 150000000 is ACCEPTED while 150000001 is refused — the >= versus > decision is the whole assertion."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A property appraised at 200000000 with one collection of 50000000 already APPROVED, so total_insured_value_cents is exactly 250000000 and the 60 percent cap is exactly 150000000."
          setup_api_calls:
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZL1", state_code: "CA", wildland_urban_interface_band: "ADJACENT_WUI", sustained_wind_mph: 35, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "ELEVATED" }
              as: PlatformAdmin
