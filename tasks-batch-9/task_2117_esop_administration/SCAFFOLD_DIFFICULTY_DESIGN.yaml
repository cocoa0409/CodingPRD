  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: allocation_void_conserves_total_plan_shares
        grounds:
          - state_machines.AllocationRun.FINALIZED_to_VOID
          - entities.EsopPlan.fields.total_plan_shares
          - entities.EsopPlan.fields.allocated_shares_total
          - endpoints.POST /allocation-runs/{run_id}/void
        distinguishing_aspect: |
          The conserved quantity is shares: the identity total_plan_shares ==
          suspense_shares + allocated_shares_total + unallocated_released_shares +
          unallocated_forfeiture_shares + reacquired_shares must read 600000 == 600000 + 0 +
          0 + 0 + 0 both before the finalize and after the void, with zero drift on any of
          the five components.
        test_recipe:
          setup:
            - "The three-participant Ironwood plan with a loan pledging 600000 shares, an APPROVED valuation at 7875 cents and a DRAFT run contributing 2000 shares."
            - "Before the finalize the share identity reads 600000 == 600000 + 0 + 0 + 0 + 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Ironwood Manufacturing ESOP", sponsor_name: "Ironwood Manufacturing Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT", annual_compensation_limit_cents: 34500000, annual_additions_limit_cents: 6900000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /esop-loans"
              payload: { plan_id: "${plan_id}", lender_name: "First Meridian Bank", original_principal_cents: 4000000000, original_interest_cents: 1600000000, shares_pledged: 600000, release_method: "PRINCIPAL_ONLY" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-001", date_of_birth: "1980-04-11", hire_date: "2015-01-05", eligible_compensation_cents: 40000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pa_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-002", date_of_birth: "1982-09-23", hire_date: "2016-06-01", eligible_compensation_cents: 20000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pb_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-003", date_of_birth: "1990-02-14", hire_date: "2019-03-15", eligible_compensation_cents: 10000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pc_id: $.data.id }
            - call: "POST /plans/${plan_id}/close-year"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_v_closed: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { plan_v_priced: $.data.version }
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 2000, expected_plan_version: "${plan_v_priced}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${run_id}/finalize"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-02"
            - call: "POST /allocation-runs/${run_id}/void"
              payload: { reason: "Restated appraisal, allocation withdrawn." }
              as: Trustee
              as_user_id: "trustee-01"
          assert:
            - "after the finalize, EsopPlan.${plan_id}.total_plan_shares == 602000 and allocated_shares_total == 2000"
            - "after the void, EsopPlan.${plan_id}.total_plan_shares == 600000, suspense_shares == 600000, allocated_shares_total == 0, unallocated_released_shares == 0, unallocated_forfeiture_shares == 0 and reacquired_shares == 0"
            - "Participant.${pa_id}.allocated_shares == 0, Participant.${pb_id}.allocated_shares == 0 and Participant.${pc_id}.allocated_shares == 0"
            - "AllocationRun.${run_id}.status == VOID and void_reason == Restated appraisal, allocation withdrawn."
            - "EsopPlan.${plan_id}.plan_status == VALUATION_PENDING"
            - "GET /share-allocations?allocation_run_id=${run_id} still returns the three reversed lines with allocated_shares 876, 749 and 375"
            - "GET /participant-statements?allocation_run_id=${run_id} returns an empty array with total_count 0"
            - "EsopPlan.${plan_id}.forfeiture_posture == CLEAR"

      - name: put_cancel_conserves_repurchase_cash
        grounds:
          - state_machines.PutOptionExercise.FUNDED_to_CANCELLED
          - entities.EsopPlan.fields.cumulative_repurchase_funding_cents
          - entities.EsopPlan.fields.committed_repurchase_cents
          - endpoints.POST /put-option-exercises/{exercise_id}/cancel
