      - call: POST /tlo/disclosures/${disc_id}/decision
        payload:
          decision: SHELF
        as: SystemAdmin
        captures:
          e4: $.data.error_id
      - call: POST /tlo/disclosures/${disc_id}/licenses
        payload:
          licensee_name: Evil
          exclusivity: NON_EXCLUSIVE
          effective_date: '2026-01-01T00:00:00Z'
          expiration_date: '2030-01-01T00:00:00Z'
          royalty_rate_bp: 500
          minimum_annual_royalty_cents: 0
          upfront_fee_cents: 0
        as: TechTransferOfficer
        captures:
          e5: $.data.error_id
      assert:
      - "e1 == ERR_FORBIDDEN (ComplianceOfficer cannot certify \u2014 segregation is structural, not just same-user)"
      - e2 == ERR_FORBIDDEN (FinanceOfficer cannot approve)
      - e3 == ERR_FORBIDDEN (LicensingManager cannot accept; note report already ACCEPTED but role check p2 precedes state
        p5)
      - e4 == ERR_FORBIDDEN (SystemAdmin cannot decide)
      - e5 == ERR_FORBIDDEN (TechTransferOfficer cannot create licenses)
- section: cross_cutting_layers
  instances:
  - name: occ_finalize_stale_after_dispute
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[inventorship-finalize-stale-disclosure]
    distinguishing_aspect: "OCC on disclosure: officer reads version V, a dispute is raised (version V+1), finalize with expected_disclosure_version\
      \ V -> ERR_STALE_VERSION (412); re-reading and re-issuing with V+1... still blocked because status changed to DISPUTED\
      \ (ERR_INVENTORSHIP_NOT_FINALIZABLE) \u2014 the two error layers are distinct."
    test_recipe:
      setup:
      - disclosure INVENTORSHIP_REVIEW, two entries both CONFIRMED (6000/4000); officer holds version snapshot
      setup_api_calls:
      - call: POST /tlo/departments
        payload:
          name: EECS
          college_name: Engineering
        as: SystemAdmin
        captures:
          dept_id: $.data.id
