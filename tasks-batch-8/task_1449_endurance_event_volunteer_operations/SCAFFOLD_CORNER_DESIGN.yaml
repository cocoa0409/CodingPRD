            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { cnt: $.data.confirmed_count, st: $.data.status, ver: $.data.version, upd: $.data.updated_at } }
          assert:
            - "immediately after cancel: confirmed_count == 0 (${cnt}) and status == OPEN (${st})"
            - "Shift.updated_at advanced (${upd}) and version incremented — cascaded mutations refresh common fields"
      - name: cascades_skip_terminal_children
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Event.DRAFT_to_CANCELLED
        distinguishing_aspect: "Conditional cascade: cancelling the event leaves an already-CANCELLED signup untouched (no double-cancel, no error) while its sibling REQUESTED signup is cancelled."
        test_recipe:
          setup: ["PUBLISHED event; S1 REQUESTED, S2 cancelled by its owner beforehand"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg2}/cancel", payload: {}, as: Volunteer, as_user_id: "${v2}" }
          trigger:
            - { call: "POST /volunteer-ops/events/${ev}/cancel", payload: {}, as: EventDirector, captures: { ev_st: $.data.status } }
            - { call: "GET /volunteer-ops/signups/${sg1}", as: VolunteerCoordinator, captures: { s1: $.data.status } }
            - { call: "GET /volunteer-ops/signups/${sg2}", as: VolunteerCoordinator, captures: { s2: $.data.status } }
          assert:
            - "event cancelled (${ev_st} == CANCELLED); REQUESTED signup -> CANCELLED (${s1})"
            - "already-CANCELLED signup remains CANCELLED (${s2}) — the cascade is conditional on non-terminal status and never errors on terminal children"
      - name: no_show_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Signup.CONFIRMED_to_NO_SHOW
        excluded_because:
          difficulty_instance: no_show_strike_suspension_backfill_cascade
          rationale: "Full strike -> suspension -> cancel -> reopen -> backfill chain asserted in the named §1.8 instance."
      - name: event_cancel_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Event.RACE_DAY_to_CANCELLED
        excluded_because:
          difficulty_instance: event_cancel_deep_cascade
          rationale: "Event -> shift -> signup -> distribution revoke chain asserted in the named §1.8 instance."
      - name: training_expiry_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TrainingRecord.PASSED_to_EXPIRED
        excluded_because:
          difficulty_instance: training_expiry_waitlist_cascade
          rationale: "Expiry -> cancel -> reopen -> promote chain asserted in the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: writes_visible_immediately_in_same_response
        claim_type: immediate
        grounds:
          - entities.Signup
        distinguishing_aspect: "Immediate consistency: the POST /signups response itself carries the routed status (REQUESTED), and an immediate GET agrees — no read-your-writes lag anywhere."
        test_recipe:
          setup: ["PUBLISHED event with OPEN shift; ELIGIBLE volunteer"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg: $.data.id, st: $.data.status, or_: $.data.origin, rat: $.data.requested_at } }
            - { call: "GET /volunteer-ops/signups/${sg}", as: VolunteerCoordinator, captures: { st2: $.data.status } }
          assert:
            - "create response shows status == REQUESTED (${st}), origin == DIRECT (${or_}), requested_at set (${rat})"
            - "immediate GET agrees: status == REQUESTED (${st2})"
      - name: adjustment_apply_forward_looking_only
        claim_type: immediate
        grounds:
          - state_machines.RoleAdjustment.APPROVED_to_APPLIED
        distinguishing_aspect: "Applying a min_age change mutates the role but does NOT re-validate an existing CONFIRMED signup whose volunteer now violates the new min_age — the forward-looking-only side effect is pinned."
        test_recipe:
          setup: ["DEBRIEF_OPEN; role min_age 16 with V1 (age 17) CONFIRMED on its shift; ACKNOWLEDGED debrief; APPROVED adjustment raising min_age to 21"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id, rv: $.data.version } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T10:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Cap", date_of_birth: "2009-10-04", is_returning: false }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v1}", module_code: CAPTAIN_COURSE }, as: VolunteerCoordinator, captures: { tr1: $.data.id } }
            - { call: "POST /volunteer-ops/training-records/${tr1}/pass", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups/${sg1}/assign-captain", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T10:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T22:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/complete", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/open-debrief", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/debrief-reports", payload: { event_id: "${ev}", shift_id: "${sh}", author_volunteer_id: "${v1}", headcount_actual: 1, role_effectiveness_rating: 2 }, as: Captain, as_user_id: "${v1}", captures: { db1: $.data.id } }
            - { call: "POST /volunteer-ops/debrief-reports/${db1}/submit", payload: {}, as: Captain, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/debrief-reports/${db1}/acknowledge", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/role-adjustments", payload: { event_id: "${ev}", role_entry_id: "${role}", debrief_report_id: "${db1}", proposed_min_age_years: 21 }, as: VolunteerCoordinator, captures: { adj: $.data.id } }
            - { call: "POST /volunteer-ops/role-adjustments/${adj}/approve", payload: {}, as: EventDirector }
          trigger:
            - { call: "POST /volunteer-ops/role-adjustments/${adj}/apply", payload: { expected_role_version: "${rv}" }, as: VolunteerCoordinator, captures: { ast: $.data.status } }
            - { call: "GET /volunteer-ops/role-catalog-entries/${role}", as: VolunteerCoordinator, captures: { r_age: $.data.min_age_years, r_ver: $.data.version } }
            - { call: "GET /volunteer-ops/signups/${sg1}", as: VolunteerCoordinator, captures: { sg_st: $.data.status } }
          assert:
            - "adjustment APPLIED (${ast}); role min_age_years == 21 (${r_age}) and version bumped (${r_ver} == ${rv} + 1)"
            - "the existing signup (volunteer age 17 < new min 21) remains COMPLETED (${sg_st}) — applied adjustments never re-validate existing signups"
