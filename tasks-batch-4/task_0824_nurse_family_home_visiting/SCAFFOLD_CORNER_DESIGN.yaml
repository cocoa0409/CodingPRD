scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_returns_all_fields
        claim_type: Creation
        grounds:
          - "entities.Client.fields.gestational_age_weeks"
          - "endpoints.POST_/clients"
        distinguishing_aspect: "POST /clients with all required fields returns 201 with a server-minted id, consent_signed=false default, and risk_tier=LOW default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { full_name: "C New", mother_dob: "2002-01-01", first_time_mother: true, gestational_age_weeks: 22 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
          assert:
            - "response http status == 201"
            - "response.data.consent_signed == false"
            - "response.data.risk_tier == LOW"

      - name: enrollment_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/enrollments/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /enrollments/{id} for an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response http status == 404"

      - name: enrollment_create_missing_client_id_returns_validation
        claim_type: Required Fields
        grounds:
          - "endpoints.POST_/enrollments"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /enrollments with no client_id returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /enrollments"
              payload: {}
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response http status == 422"

      - name: visit_scheduled_id_is_uuid_without_prefix
        claim_type: System Fields
        grounds:
          - "entities.Visit.fields.status"
        distinguishing_aspect: "A created visit's id is a bare UUID (no type prefix) and status defaults to SCHEDULED; client-supplied status is ignored."
        excluded_because:
          difficulty_instance: non_linear_state_machine / visit_reschedule_cycle_scheduled_to_rescheduled_to_scheduled
          rationale: "Visit creation and its SCHEDULED initial state are exercised in the reschedule-cycle setup."

  - section: state_machines
    instances:
      - name: referral_connect_from_open_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Referral.CONTACTED_to_CONNECTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "connect requires CONTACTED; calling connect while the referral is still OPEN returns ERR_INVALID_STATE (409) with no connected_at set."
        test_recipe:
          setup: ["One ENROLLED enrollment with consent; one OPEN referral (never contacted)."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Rc", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Rc", mother_dob: "2002-02-02", first_time_mother: true, gestational_age_weeks: 18 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /referrals"
              payload: { enrollment_id: "${enr_id}", benefit_type: "MEDICAID" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/connect"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: referral_connect_stamps_connected_at
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Referral.CONTACTED_to_CONNECTED"
          - "entities.Referral.fields.connected_at"
        distinguishing_aspect: "contact then connect drives OPEN->CONTACTED->CONNECTED and stamps connected_at with the logical clock time 2026-06-01T00:00:00Z."
        test_recipe:
          setup: ["One ENROLLED enrollment with consent; one OPEN referral; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Cn", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Cn", mother_dob: "2002-03-03", first_time_mother: true, gestational_age_weeks: 18 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /referrals"
              payload: { enrollment_id: "${enr_id}", benefit_type: "HOUSING" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/contact"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/connect"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
          assert:
            - "response.data.status == CONNECTED"
            - "response.data.connected_at == 2026-06-01T00:00:00Z"

      - name: graduate_before_toddlerhood_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Enrollment.ACTIVE_to_GRADUATED"
          - "errors[ERR_GRADUATION_TOO_EARLY]"
        distinguishing_aspect: "graduate on an ACTIVE enrollment still in PREGNANCY returns ERR_GRADUATION_TOO_EARLY (409)."
        test_recipe:
          setup: ["ACTIVE enrollment in PREGNANCY phase (assigned, no birth recorded)."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Gr", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Gr" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Gr", mother_dob: "2002-04-04", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/graduate"
              payload: {}
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GRADUATION_TOO_EARLY"
            - "response http status == 409"

      - name: supervision_sign_clears_review_and_pending_count
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.SupervisionSession.DRAFT_to_SIGNED"
          - "entities.Nurse.fields.pending_supervision_count"
        distinguishing_aspect: "Signing a session that reviews the alerted enrollment clears Assignment.review_required and decrements Nurse.pending_supervision_count from 1 to 0."
        test_recipe:
          setup:
            - "ACTIVE enrollment assigned to nurse N with a dosage alert (pending_supervision_count==1) produced by a missed visit; clock 2026-06-01; a DRAFT supervision session by supervisor S reviewing that enrollment."
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Sup", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Sup" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Sup", mother_dob: "2002-05-05", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-05-01", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/mark-missed"
              payload: {}
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
            - call: "POST /supervision-sessions"
              payload: { nurse_id: "${nurse_id}", supervisor_id: "${sup_id}", period_start: "2026-05-01", period_end: "2026-06-30", reviewed_enrollment_ids: ["${enr_id}"] }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { ses_id: $.data.id }
          trigger:
            - call: "POST /supervision-sessions/${ses_id}/sign"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "response.data.status == SIGNED"
            - "GET /nurses/${nurse_id} Nurse.pending_supervision_count == 0"

  - section: validations
    instances:
      - name: referral_create_without_consent_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_CONSENT_REQUIRED]"
        distinguishing_aspect: "POST /referrals for an enrollment whose client has not signed consent returns ERR_CONSENT_REQUIRED (422)."
        test_recipe:
          setup: ["Enrollment for a client WITHOUT consent."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Nc", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Nc", mother_dob: "2002-06-06", first_time_mother: true, gestational_age_weeks: 18 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { enrollment_id: "${enr_id}", benefit_type: "WIC" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CONSENT_REQUIRED"
            - "response http status == 422"

      - name: enrollment_second_active_for_client_rejected
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_ENROLLMENT_EXISTS]"
        distinguishing_aspect: "A second POST /enrollments for a client who already has a non-EXITED enrollment returns ERR_ENROLLMENT_EXISTS (409)."
        test_recipe:
          setup: ["Client with one existing PROSPECT enrollment."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C Dup", mother_dob: "2002-07-07", first_time_mother: true, gestational_age_weeks: 18 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ENROLLMENT_EXISTS"
            - "response http status == 409"

      - name: visit_schedule_window_invalid_rejected
        claim_type: Violation -> Error
        grounds:
          - "endpoints.POST_/visits"
          - "errors[ERR_SCHEDULE_WINDOW_INVALID]"
        distinguishing_aspect: "POST /visits where scheduled_end is not strictly after scheduled_start returns ERR_SCHEDULE_WINDOW_INVALID (422)."
        test_recipe:
          setup: ["ACTIVE enrollment with nurse N."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Win", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Win" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Win", mother_dob: "2002-08-08", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-06-01", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SCHEDULE_WINDOW_INVALID"
            - "response http status == 422"

      - name: enrollment_not_first_time_mother_excluded
        claim_type: Violation -> Error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_FIRST_TIME_MOTHER]"
        excluded_because:
          difficulty_instance: boundary_precision_check / gestational_age_28_enrolls_29_ineligible
          rationale: "The eligibility gate family (first_time_mother + gestational age) is anchored by the boundary difficulty instance; this is its sibling category and shares the enrollment-create validation path."

  - section: endpoints
    instances:
      - name: enrollments_list_is_paginated
        claim_type: Listing
        grounds:
          - "endpoints.GET_/enrollments"
        distinguishing_aspect: "GET /enrollments returns a paginated array envelope with total_count and has_more; filtering by client_id returns only that client's enrollment."
        test_recipe:
          setup: ["Two clients each with one enrollment."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "C L1", mother_dob: "2002-09-09", first_time_mother: true, gestational_age_weeks: 18 }
              as: IntakeCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { client_id: "${c1_id}" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C L2", mother_dob: "2002-10-10", first_time_mother: true, gestational_age_weeks: 19 }
              as: IntakeCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { client_id: "${c2_id}" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
          trigger:
            - call: "GET /enrollments"
              payload: { client_id: "${c1_id}" }
              as: IntakeCoordinator
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].id == ${e1_id}"
            - "response.meta present; pagination total_count == 1 and has_more == false"

      - name: visits_filtered_by_enrollment_reverse_reachability
        claim_type: Retrieval
        grounds:
          - "entities.Visit.fields.enrollment_id"
          - "endpoints.GET_/visits"
        distinguishing_aspect: "GET /visits?enrollment_id={id} returns the enrollment's visits (FK reverse-reachability), each with status SCHEDULED."
        test_recipe:
          setup: ["ACTIVE enrollment with nurse N and one SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Fr", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /supervisors"
              payload: { full_name: "S Fr" }
              as: ProgramAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Fr", mother_dob: "2002-11-11", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /visits"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", phase: "PREGNANCY", target_date: "2026-06-15", scheduled_start: "2026-06-15T09:00:00Z", scheduled_end: "2026-06-15T10:00:00Z" }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /visits"
              payload: { enrollment_id: "${enr_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].id == ${v1_id}"
            - "response.data[0].status == SCHEDULED"

  - section: rbac
    instances:
      - name: nurse_cannot_create_client
        claim_type: RBAC denial
        grounds:
          - "roles.HomeVisitNurse"
          - "endpoints.POST_/clients"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A HomeVisitNurse calling POST /clients (an IntakeCoordinator-exclusive op) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One nurse exists to act as."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Rb", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { full_name: "C Rb", mother_dob: "2002-12-12", first_time_mother: true, gestational_age_weeks: 20 }
              as: HomeVisitNurse
              as_user_id: "${nurse_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response http status == 403"

      - name: intake_cannot_create_assignment
        claim_type: RBAC denial
        grounds:
          - "roles.Supervisor"
          - "endpoints.POST_/assignments"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "An IntakeCoordinator calling POST /assignments (a Supervisor-exclusive op) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A nurse and an ENROLLED enrollment."]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "N Rb2", credential_type: "RN" }
              as: ProgramAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Rb2", mother_dob: "2003-01-01", first_time_mother: true, gestational_age_weeks: 20 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/consent"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /enrollments"
              payload: { client_id: "${client_id}" }
              as: IntakeCoordinator
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate-enrollment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_v2: $.data.version }
          trigger:
            - call: "POST /assignments"
              payload: { enrollment_id: "${enr_id}", nurse_id: "${nurse_id}", expected_enrollment_version: "${enr_v2}", high_needs: false }
              as: IntakeCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response http status == 403"

  - section: cross_cutting
    instances:
      - name: assignment_occ_stale_enrollment_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[assignment-create-stale-enrollment]"
          - "errors[ERR_STALE_ENROLLMENT_VERSION]"
        distinguishing_aspect: "After a first assignment advances Enrollment.version, a second POST /assignments carrying the pre-advance expected_enrollment_version is rejected with ERR_STALE_ENROLLMENT_VERSION (412)."
        test_recipe:
          setup: ["ENROLLED enrollment; two nurses; version captured just after activation."]
          setup_api_calls:
            - call: "POST /nurses"
