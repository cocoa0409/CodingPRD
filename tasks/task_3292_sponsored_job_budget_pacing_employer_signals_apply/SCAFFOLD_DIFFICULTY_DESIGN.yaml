          - errors[ERR_EMPLOYER_SUSPENDED]
        distinguishing_aspect: "The (Campaign, Employer) pair: resuming a PAUSED campaign is gated on the owning employer being ACTIVE, so once the employer is SUSPENDED the resume is rejected with ERR_EMPLOYER_SUSPENDED even though the campaign budget is untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One employer, one posting, one ACTIVE CPC campaign and one sponsored job; the employer is then suspended, pausing the campaign."
          setup_api_calls:
            - call: "POST /api/employers"
              payload: { legal_name: "GateCo", domain: "gate.example", ats_provider: "NONE" }
              as: PlatformAdmin
              captures: { emp_gt: $.data.id }
