        grounds: [state_machines.Client.ACTIVE_to_DISCHARGED]
        excluded_because:
          difficulty_instance: transitive_cascade / discharge_cascade_client_to_material
          rationale: "Full discharge cascade (plan/goal/session/enrollment/material) asserted in §1.8."
      - name: superbill_void_reverts_billing_excluded
