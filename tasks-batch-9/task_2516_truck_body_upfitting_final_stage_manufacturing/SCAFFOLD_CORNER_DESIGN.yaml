      - name: aux_load_counts_only_planned_installs_and_approved_interfaces
        claim_type: Input Set Filtering
        grounds:
          - calculations.aux_electrical_load
          - entities.UpfitOrder.fields.committed_aux_amp_draw
          - state_machines.ElectricalInterface.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          Four rows exist and only two count: a REMOVED crane (10 A) and a REJECTED interface (25 A)
          must both drop out while the PLANNED liftgate (30 A) and the body (12 A) stay in. A PROPOSED
          interface must not count either — the amps only become real when a ComplianceOfficer
          approves them, which is why the ceiling test at approve time is where a rejection bites.
        test_recipe:
          setup:
            - "A CUSTOMER_SPECIFIC service order on F550-DRW-84CA (ceiling 60 A) with a PLANNED liftgate (30 A), a crane that was planned and then removed (10 A), and one PROPOSED DIRECT_SPLICE interface drawing 25 A on DISCRETE_CIRCUIT."
