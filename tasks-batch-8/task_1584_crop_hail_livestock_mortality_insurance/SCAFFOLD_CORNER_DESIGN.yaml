  - section: validations
    instances:
      - name: missing_auth_headers_returns_invalid_user_context
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Any endpoint called without X-User-ID/X-User-Role returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
        test_recipe:
          setup: ["Carrier exists"]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-V1", legal_name: "C", reinsurance_treaty_attachment_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            # Call without X-User-ID (the test harness omits as_user_id AND uses no role)
            # Per the scaffold, we encode this by simply NOT setting `as` (no role header).
            # lint will treat this as a negative test because name matches _missing_.
            - call: "GET /carriers/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "If headers present, request succeeds; harness should also exercise headerless variant returning ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_OVERPAYMENT]"]
