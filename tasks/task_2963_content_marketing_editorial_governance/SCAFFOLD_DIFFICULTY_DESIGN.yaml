  - rule_id: compensating_invariant
    instances:

      - name: prune_returns_slot_points_and_releases_asset_uses_without_drift
        grounds:
          - endpoints[POST /editorial/content-items/{id}/prune]
          - state_machines.ContentItem.transitions[NEEDS_REFRESH->PRUNED]
          - entities.CalendarSlot.fields.committed_points
          - entities.Campaign.fields.committed_points_total
          - entities.Asset.fields.remaining_licensed_uses
          - calculations.content_decay_pct
        distinguishing_aspect: |
          Prune is the full compensation: the slot was driven to exactly capacity (16 of 16, FULL) and
          one of the asset's two licensed uses was consumed, and after the prune every ledger must be
          back at its pre-commit reading - committed_points 0, utilization_pct 0.00, status back to
          OPEN, Campaign.committed_points_total 0, remaining_licensed_uses 2 - while the derived
          measurement fields (decay_pct 91.67) are preserved rather than reset.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-03T08:00:00.000Z and advances to 2026-10-05T00:00:00.000Z before the audit."
            - "Campaign CMP-COMP1 is ACTIVE with a DECISION CalendarSlot for week 2026-08-03 whose capacity_points is exactly 16, so the single 16-point item drives it to FULL at 100.00 percent."
            - "The item has no Claim rows, so its gates are SME, BRAND and ACCESSIBILITY; all three are APPROVED and the item is published on OWNED and EMAIL with scheduled_at equal to the clock, giving two LIVE distributions."
            - "Asset AST-COMP is STOCK, licensed for OWNED and EMAIL, max_licensed_uses 2, with one ACTIVE usage on OWNED, so remaining_licensed_uses reads 1 before the prune."
            - "Two snapshots make the decay unambiguous: the baseline 2026-08-04T00:00:00.000Z to 2026-08-11T00:00:00.000Z carries 1200 engaged_sessions and the trailing 2026-09-10T00:00:00.000Z to 2026-09-17T00:00:00.000Z carries 100, so decay_pct is 91.67, which is at or above the 85.00 prune threshold."
