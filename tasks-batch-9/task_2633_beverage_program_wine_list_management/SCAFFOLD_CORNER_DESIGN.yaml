            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "00000000-0000-4000-8000-000000000000", bin_id: "${bin1_id}", bottles_received: 6, unit_cost_cents: 2400, received_at: "2026-08-10T00:00:00Z" }
