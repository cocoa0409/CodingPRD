      setup:
      - A DOCTOR_LOOKUP prescription is submitted and a first verification round is sent at 2026-09-08T10:00:00Z; the prescriber answers CORRECTED with -2.50 and -4.00, then the clock advances past the 4-business-hour contact cooldown to the next morning.
