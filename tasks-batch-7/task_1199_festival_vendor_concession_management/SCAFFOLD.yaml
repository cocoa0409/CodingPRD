# =============================================================================
# Task 1199: Festival Vendor & Concession Management — seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  generate task hard than expert level! 1199. Festival Vendor & Concession Management (music festival operations): vendor application, curation & category exclusivity, booth assignment & utility (power/water) requirements, permit/health inspection coordination, revenue share vs flat fee & POS reporting, load-in scheduling & vehicle access windows, waste/compost compliance & fines, cashless payment integration & settlement, vendor performance & return invitation

domain_name: festival-vendor-concessions
api_prefix: "/"   # flat topology: all resources are peers at the API root

complexity_profile:
  primary_archetype: quota_allocation       # booth slots, zone power/water budgets, category exclusivity caps
  secondary_archetype: temporal_windowing   # load-in vehicle windows, slot lock cutoff, check-in grace
  complexity_layers:
    - optimistic_concurrency                # OCC on BoothAssignment.version (reassign) and Settlement.version (POS void)
    - cascading_side_effects                # fine→strike→suspend→reject; noshow→forfeit→release→promote
    - dual_variant_calculation              # settlement provisional-vs-final; performance official-vs-strict
    - ops_run_checkpoint                    # sweep-operations epoch: no-show marking, forfeits, waitlist promotion
  entity_topology: flat                     # peer entities joined by FK references; filtered-list GETs for reverse reachability
  state_machine_shape: cyclic               # application revision loop + settlement dispute loop; assignment has parallel dimensions
  relationship_patterns:
    - one_to_many                           # Festival→Zone, Zone→Booth, Assignment→PosTransaction/Fine/Inspection
    - many_to_many                          # Vendor×Festival via VendorApplication; Assignment×LoadInSlot via LoadInReservation
    - self_referential                      # VendorApplication.supersedes_application_id (resubmission chain)
    - cross_aggregate                       # PosTransaction→Settlement (via assignment), PerformanceReview percentiles across assignments
  role_model: segregation_of_duties         # fine issuer ≠ fine waver; settlement reconciler ≠ settlement finalizer
  consistency_model: immediate              # all mutations + cascades atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Festival
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Festival display name" }
      - { name: event_start, type: datetime, source: input, description: "Gates-open instant (ISO8601 UTC); LIVE requires clock >= event_start" }
      - { name: event_end, type: datetime, source: input, description: "Festival end instant (ISO8601 UTC); SETTLEMENT requires clock > event_end; PosTransaction.occurred_at must lie inside [event_start, event_end]" }
      - { name: category_cap_per_category, type: integer, source: input, description: "Max applications that may be ACCEPTED per category within this festival" }
      - { name: status, type: enum, source: system, description: "PLANNING | APPLICATIONS_OPEN | CURATED | LIVE | SETTLEMENT | CLOSED", constraints: "linear forward-only; see state_machines.Festival" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal name (used as deterministic tie-break in waitlist promotion)" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact email" }
      - { name: status, type: enum, source: system, description: "APPROVED | SUSPENDED", default: "APPROVED", constraints: "SUSPENDED vendors may not submit applications" }
      - { name: compliance_strikes, type: integer, source: computed, description: "Count of own ComplianceFines that entered PAID; >= 3 auto-suspends vendor", default: 0 }

  - name: VendorApplication
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; acting Vendor user's X-User-ID must equal this" }
      - { name: festival_id, type: string, source: input, description: "FK -> Festival.id" }
      - { name: category, type: enum, source: input, description: "FOOD_HOT | FOOD_COLD | BEVERAGE_ALCOHOL | BEVERAGE_NA | DESSERT | MERCHANDISE" }
      - { name: fee_model, type: enum, source: input, description: "FLAT_FEE | REVENUE_SHARE | HYBRID" }
      - { name: proposed_flat_fee_cents, type: integer, source: input, description: "Proposed flat fee; required when fee_model is FLAT_FEE or HYBRID", constraints: ">= 0" }
      - { name: proposed_revenue_share_pct_bp, type: integer, source: input, description: "Proposed revenue share in basis points; required when fee_model is REVENUE_SHARE or HYBRID", constraints: "1..10000" }
      - { name: power_needed_amps, type: integer, source: input, description: "Peak electrical draw the booth must supply", constraints: ">= 1" }
      - { name: requires_water, type: boolean, source: input, description: "Whether the booth needs a potable water hookup" }
      - { name: supersedes_application_id, type: string, source: input, description: "FK -> VendorApplication.id; self-reference for resubmission of a CHANGES_REQUESTED application (same vendor, same festival)", constraints: "optional; source must be CHANGES_REQUESTED" }
      - { name: review_round, type: integer, source: system, description: "0 for fresh applications; supersedes_application_id chains inherit source.review_round + 1", default: 0 }
      - { name: curated_fee_model, type: enum, source: system, description: "Final fee model fixed by curation decision (FLAT_FEE | REVENUE_SHARE | HYBRID)" }
      - { name: curated_flat_fee_cents, type: integer, source: system, description: "Final flat fee fixed by curation decision" }
      - { name: curated_revenue_share_pct_bp, type: integer, source: system, description: "Final revenue share in basis points fixed by curation decision" }
      - { name: curated_tier_mode, type: enum, source: system, description: "MARGINAL | WHOLE_TIER; required when curated_fee_model = REVENUE_SHARE" }
      - { name: curated_minimum_guarantee_cents, type: integer, source: system, description: "Minimum festival take; required when curated_fee_model = HYBRID" }
      - { name: curated_free_allowance_cents, type: integer, source: system, description: "Gross sales exempt from variable share; required when curated_fee_model = HYBRID" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | CHANGES_REQUESTED | ACCEPTED | REJECTED | WAITLISTED | WITHDRAWN | SUPERSEDED" }

  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: festival_id, type: string, source: input, description: "FK -> Festival.id" }
      - { name: name, type: string, source: input, description: "Zone name (e.g., North Meadow)" }
      - { name: power_capacity_amps, type: integer, source: input, description: "Total electrical capacity of the zone", constraints: ">= 1" }
      - { name: water_hookup_total, type: integer, source: input, description: "Total water hookups available in the zone", constraints: ">= 0" }
      - { name: reserved_power_amps, type: integer, source: computed, description: "Sum of power_draw_amps over this zone's BoothAssignments in {RESERVED, CONFIRMED, ACTIVE}", default: 0 }
      - { name: reserved_water_hookups, type: integer, source: computed, description: "Count of this zone's BoothAssignments in {RESERVED, CONFIRMED, ACTIVE} with requires_water = true", default: 0 }

  - name: Booth
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: label, type: string, source: input, description: "Booth label (e.g., N-12)" }
      - { name: power_outlet_max_amps, type: integer, source: input, description: "Maximum deliverable amps at this booth's outlet", constraints: ">= 1" }
      - { name: has_water_hookup, type: boolean, source: input, description: "Whether this booth provides a water connection" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | ASSIGNED; driven solely by BoothAssignment side effects", default: "AVAILABLE" }

  - name: BoothAssignment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> VendorApplication.id; application must be ACCEPTED" }
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id; booth must be AVAILABLE and in the same festival as the application" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from booth.zone.festival_id at creation" }
      - { name: zone_id, type: string, source: computed, description: "FK -> Zone.id; denormalized from booth.zone_id at creation; refreshed on reassign" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | ACTIVE | COMPLETED | RELEASED | FORFEITED" }
      - { name: utility_status, type: enum, source: system, description: "PENDING | PROVISIONED; parallel state dimension independent of status", default: "PENDING" }
      - { name: power_draw_amps, type: integer, source: input, description: "Reserved electrical draw; <= booth.power_outlet_max_amps; counts against zone budget while status in {RESERVED, CONFIRMED, ACTIVE}", constraints: ">= 1" }
      - { name: requires_water, type: boolean, source: input, description: "Whether this assignment consumes a water hookup" }
      - { name: fee_model, type: enum, source: system, description: "Fee terms snapshot pinned at confirm from the application's curated terms (FLAT_FEE | REVENUE_SHARE | HYBRID)" }
      - { name: flat_fee_cents, type: integer, source: system, description: "Snapshot of curated_flat_fee_cents at confirm" }
      - { name: revenue_share_pct_bp, type: integer, source: system, description: "Snapshot of curated_revenue_share_pct_bp at confirm" }
      - { name: tier_mode, type: enum, source: system, description: "Snapshot of curated_tier_mode at confirm (MARGINAL | WHOLE_TIER)" }
      - { name: minimum_guarantee_cents, type: integer, source: system, description: "Snapshot of curated_minimum_guarantee_cents at confirm" }
      - { name: free_allowance_cents, type: integer, source: system, description: "Snapshot of curated_free_allowance_cents at confirm" }

  - name: InspectionRecord
    parent: null
    common_fields: false   # immutable event: id + created_at only; no update endpoints
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from assignment.festival_id" }
      - { name: type, type: enum, source: input, description: "HEALTH_PREOPEN | HEALTH_SPOT | FIRE_SAFETY" }
      - { name: result, type: enum, source: input, description: "PASS | CONDITIONAL_PASS | FAIL" }
      - { name: notes, type: string, source: input, description: "Inspector notes", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "Always COMPLETED at creation (walk-up inspection recorded with outcome)", default: "COMPLETED" }

  - name: LoadInSlot
    parent: null
    common_fields: true
    fields:
      - { name: festival_id, type: string, source: input, description: "FK -> Festival.id" }
      - { name: gate, type: enum, source: input, description: "GATE_A | GATE_B | GATE_C" }
      - { name: window_start, type: datetime, source: input, description: "Window open instant (ISO8601 UTC); half-open lower bound" }
      - { name: window_end, type: datetime, source: input, description: "Window close instant (ISO8601 UTC); half-open upper bound; must be > window_start" }
      - { name: max_vehicles, type: integer, source: input, description: "Aggregate vehicle capacity for this slot window", constraints: ">= 1" }
      - { name: reserved_vehicle_count, type: integer, source: computed, description: "Sum of vehicle_count over this slot's LoadInReservations in {BOOKED, CHECKED_IN}", default: 0 }

  - name: LoadInReservation
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id" }
      - { name: slot_id, type: string, source: input, description: "FK -> LoadInSlot.id; slot must belong to the same festival as the assignment" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from slot.festival_id" }
      - { name: vehicle_count, type: integer, source: input, description: "Vehicles admitted under this reservation", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: checked_in_at, type: datetime, source: system, description: "Set when status moves BOOKED -> CHECKED_IN" }

  - name: PosTransaction
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id; must be ACTIVE at report time" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from assignment.festival_id" }
      - { name: amount_cents, type: integer, source: input, description: "Gross sale amount", constraints: ">= 1" }
      - { name: occurred_at, type: datetime, source: input, description: "Sale instant; must lie inside [festival.event_start, festival.event_end]" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; unique per assignment_id — a duplicate POST returns HTTP 200 with the existing transaction and creates nothing" }
      - { name: status, type: enum, source: system, description: "REPORTED | SETTLED | VOIDED", default: "REPORTED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id; exactly one Settlement per assignment ever" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from assignment.festival_id" }
      - { name: status, type: enum, source: system, description: "OPEN | RECONCILING | DISPUTED | FINALIZED | PAID" }
      - { name: provisional_gross_cents, type: integer, source: computed, description: "Gross over transactions in REPORTED at reconcile time (excludes VOIDED)" }
      - { name: provisional_share_cents, type: integer, source: computed, description: "Festival share under the provisional variant (no fine deduction)" }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "provisional_gross_cents - provisional_share_cents, floored at 0" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Final gross: all non-VOIDED transactions with occurred_at inside the festival window, including late arrivals" }
      - { name: festival_share_cents, type: integer, source: computed, description: "Final festival share per fee terms snapshot" }
      - { name: fine_deduction_cents, type: integer, source: computed, description: "Sum of amount_cents of the assignment's fines in ACKNOWLEDGED at finalize (liability accepted, not yet collected); ISSUED/DISPUTED block finalize; WAIVED and PAID excluded" }
      - { name: vendor_payout_cents, type: integer, source: computed, description: "max(0, gross_sales_cents - festival_share_cents) - deductions_applied; see calculations.settlement_financials" }
      - { name: vendor_balance_due_cents, type: integer, source: computed, description: "max(0, festival_share_cents + fine_deduction_cents - gross_sales_cents); amount the vendor still owes the festival" }
      - { name: reconciled_by_user_id, type: string, source: system, description: "X-User-ID of the most recent reconcile call (SoD: may not finalize)" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the finalize call" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded on the most recent RECONCILING -> DISPUTED transition" }

  - name: ComplianceFine
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from assignment.festival_id" }
      - { name: type, type: enum, source: input, description: "WASTE_SORTING | COMPOST_CONTAMINATION | GREASE_DISPOSAL | HEALTH_VIOLATION | NO_SHOW_PENALTY" }
      - { name: amount_cents, type: integer, source: input, description: "Fine amount", constraints: ">= 1" }
      - { name: description, type: string, source: input, description: "Free-text reason", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACKNOWLEDGED | DISPUTED | PAID | WAIVED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the issuer, or the literal 'system' for auto-issued fines" }
      - { name: waived_by_user_id, type: string, source: system, description: "X-User-ID of the waiving FestivalDirector" }

  - name: PerformanceReview
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> BoothAssignment.id; review is auto-created (status PENDING) when the assignment's settlement is FINALIZED" }
      - { name: festival_id, type: string, source: computed, description: "FK -> Festival.id; denormalized from assignment.festival_id" }
      - { name: vendor_id, type: string, source: computed, description: "FK -> Vendor.id; denormalized from the application's vendor_id" }
      - { name: status, type: enum, source: system, description: "PENDING | SCORED | INVITED | ACCEPTED | DECLINED | INELIGIBLE" }
      - { name: sales_percentile, type: integer, source: computed, description: "Percentile of this assignment's final gross among all same-festival assignments whose settlement is in {FINALIZED, PAID} at compute time; 0..100" }
      - { name: compliance_component, type: integer, source: computed, description: "100 - 15 per counted fine (official variant); floor 0" }
      - { name: operations_component, type: integer, source: computed, description: "100 - 30 per NO_SHOW reservation; 0 if assignment FORFEITED; floor 0" }
      - { name: official_score, type: integer, source: computed, description: "round_half_up(0.4*sales_percentile + 0.3*compliance_component + 0.3*operations_component); WAIVED fines excluded" }
      - { name: strict_score, type: integer, source: computed, description: "Same weights but WAIVED fines still count at 8 points each; used for suspension audits" }

# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: Festival
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: APPLICATIONS_OPEN
        trigger: "POST /festivals/{festivalId}/advance-status (to_status=APPLICATIONS_OPEN)"
        actor: FestivalDirector
        preconditions:
          - "At least one Zone exists for the festival (ERR_FESTIVAL_NOT_CONFIGURED)"
        side_effects: []
      - from: APPLICATIONS_OPEN
        to: CURATED
        trigger: "POST /festivals/{festivalId}/advance-status (to_status=CURATED)"
        actor: FestivalDirector
        preconditions:
          - "No VendorApplication of this festival in {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED} (ERR_APPLICATIONS_PENDING_REVIEW); WAITLISTED applications may remain"
        side_effects: []
      - from: CURATED
        to: LIVE
        trigger: "POST /festivals/{festivalId}/advance-status (to_status=LIVE)"
        actor: FestivalDirector
        preconditions:
          - "No BoothAssignment of this festival in RESERVED (ERR_ASSIGNMENTS_UNCONFIRMED)"
          - "Logical clock >= festival.event_start (ERR_FESTIVAL_NOT_STARTED)"
        side_effects: []
      - from: LIVE
        to: SETTLEMENT
        trigger: "POST /festivals/{festivalId}/advance-status (to_status=SETTLEMENT)"
        actor: FestivalDirector
        preconditions:
          - "Logical clock > festival.event_end (ERR_FESTIVAL_NOT_ENDED)"
        side_effects:
          - "Every BoothAssignment of this festival in ACTIVE -> COMPLETED (its zone reservation stops counting: COMPLETED is outside {RESERVED, CONFIRMED, ACTIVE}, so zone reserved_power_amps / reserved_water_hookups decrease)"
      - from: SETTLEMENT
        to: CLOSED
        trigger: "POST /festivals/{festivalId}/advance-status (to_status=CLOSED)"
        actor: FestivalDirector
        preconditions:
          - "Every Settlement of this festival is PAID (ERR_SETTLEMENTS_OPEN)"
        side_effects: []

  - entity: VendorApplication
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /vendor-applications/{applicationId}/start-review"
        actor: VendorManager
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: UNDER_REVIEW
        trigger: "POST /vendor-applications/{applicationId}/start-review OR system (automatic waitlist promotion after a booth release/forfeit frees matching capacity)"
        actor: VendorManager | system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /vendor-applications/{applicationId}/request-changes"
        actor: VendorManager
        preconditions:
          - "review_round < 3 (ERR_REVIEW_ROUND_LIMIT when review_round >= 3)"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "system (the vendor resubmits by POST /vendor-applications with supersedes_application_id pointing at this application; the NEW application enters SUBMITTED with review_round = source.review_round + 1, and THIS application moves CHANGES_REQUESTED -> SUPERSEDED)"
        actor: system
        preconditions:
          - "Superseding application references this application, same vendor_id, same festival_id (ERR_SUPERSEDE_SOURCE_INVALID)"
        side_effects:
          - "Source application -> SUPERSEDED"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /vendor-applications/{applicationId}/decide (decision=ACCEPTED)"
        actor: VendorManager
        preconditions:
          - "Curated fee terms complete for the curated_fee_model (ERR_FEE_TERMS_INCOMPLETE): FLAT_FEE needs curated_flat_fee_cents; REVENUE_SHARE needs curated_revenue_share_pct_bp + curated_tier_mode; HYBRID needs curated_flat_fee_cents + curated_revenue_share_pct_bp + curated_minimum_guarantee_cents + curated_free_allowance_cents"
          - "Count of this festival's ACCEPTED applications with the same category < festival.category_cap_per_category (ERR_CATEGORY_CAP_REACHED)"
        side_effects:
          - "Curated terms written onto the application (immutable afterwards)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /vendor-applications/{applicationId}/decide (decision=REJECTED)"
        actor: VendorManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /vendor-applications/{applicationId}/decide (decision=WAITLISTED)"
        actor: VendorManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{applicationId}/withdraw"
        actor: Vendor
        preconditions:
          - "Acting vendor owns the application (X-User-ID == vendor_id, ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{applicationId}/withdraw"
        actor: Vendor
        preconditions: ["ownership as above"]
        side_effects: []
      - from: CHANGES_REQUESTED
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{applicationId}/withdraw"
        actor: Vendor
        preconditions: ["ownership as above"]
        side_effects: []
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /vendor-applications/{applicationId}/withdraw"
        actor: Vendor
        preconditions: ["ownership as above"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (strike contagion: owning Vendor becomes SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (strike contagion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHANGES_REQUESTED
        to: REJECTED
        trigger: "system (strike contagion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: REJECTED
        trigger: "system (strike contagion)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BoothAssignment
    initial_state: RESERVED
    terminal_states: [COMPLETED, RELEASED, FORFEITED]
    note: "Parallel dimensions: status (lifecycle) and utility_status (PENDING | PROVISIONED) evolve independently; only activate couples them."
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /booth-assignments/{assignmentId}/confirm"
        actor: OperationsLead
        preconditions: []
        side_effects:
          - "Fee terms snapshot pinned from the application's curated terms onto fee_model / flat_fee_cents / revenue_share_pct_bp / tier_mode / minimum_guarantee_cents / free_allowance_cents"
          - "Booth.status RESERVED -> ASSIGNED"
      - from: RESERVED
        to: RESERVED
        trigger: "POST /booth-assignments/{assignmentId}/reassign"
        actor: OperationsLead
        preconditions:
          - "OCC: payload expected_assignment_version == current version (ERR_STALE_VERSION)"
          - "New booth AVAILABLE, same festival, outlet/water/capacity/exclusivity checks re-run against the new booth and its zone"
        side_effects:
          - "Old booth -> AVAILABLE; old zone reserved totals decrease by this assignment's draw"
          - "New booth -> RESERVED; new zone reserved totals increase"
          - "zone_id / booth_id refreshed; version += 1"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /booth-assignments/{assignmentId}/reassign"
        actor: OperationsLead
        preconditions: ["same as RESERVED reassign"]
        side_effects: ["same as RESERVED reassign"]
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /booth-assignments/{assignmentId}/activate"
        actor: OperationsLead
        preconditions:
          - "utility_status == PROVISIONED (ERR_UTILITIES_NOT_PROVISIONED)"
          - "Latest InspectionRecord of type HEALTH_PREOPEN for this assignment has result == PASS (ERR_PREOPEN_INSPECTION_MISSING when none exists or latest is CONDITIONAL_PASS/FAIL; latest = greatest created_at)"
          - "Festival is LIVE (ERR_FESTIVAL_NOT_LIVE)"
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: "POST /booth-assignments/{assignmentId}/release"
        actor: OperationsLead
        preconditions: []
        side_effects:
          - "Booth -> AVAILABLE; zone reserved totals decrease"
          - "Waitlist promotion runs for this festival + freed zone (see calculations.waitlist_promotion)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /booth-assignments/{assignmentId}/release"
        actor: OperationsLead
        preconditions: []
        side_effects: ["same cascade as RESERVED -> RELEASED"]
      - from: CONFIRMED
        to: FORFEITED
        trigger: "system (sweep-operations: logical clock > festival.event_start and assignment never activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Booth -> AVAILABLE; zone reserved totals decrease"
          - "Waitlist promotion runs for this festival + freed zone"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (Festival LIVE -> SETTLEMENT side effect)"
        actor: system
        preconditions: []
        side_effects:
          - "Zone reserved totals decrease (COMPLETED no longer counts)"
    # utility_status dimension (same entity, independent axis):
      - from: "utility PENDING"
        to: "utility PROVISIONED"
        trigger: "POST /booth-assignments/{assignmentId}/provision-utilities"
        actor: OperationsLead
        preconditions:
          - "status == CONFIRMED (ERR_INVALID_STATE_TRANSITION)"
          - "Zone budget still sufficient after re-validation (ERR_POWER_CAPACITY_EXCEEDED / ERR_WATER_CAPACITY_EXCEEDED)"
        side_effects: []

  - entity: LoadInReservation
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /load-in-reservations/{reservationId}/check-in"
        actor: OperationsLead
        preconditions:
          - "slot.window_start <= logical clock <= slot.window_end + 30 minutes grace (ERR_CHECKIN_WINDOW_CLOSED)"
        side_effects:
          - "checked_in_at = logical clock"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /load-in-reservations/{reservationId}/cancel"
        actor: OperationsLead | Vendor
        preconditions:
          - "Logical clock < slot.window_start - 120 minutes lock horizon (ERR_SLOT_LOCKED)"
          - "Vendor actor must own the reservation's vendor (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Slot reserved_vehicle_count decreases by vehicle_count"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (sweep-operations: logical clock > slot.window_end + 30 minutes grace)"
        actor: system
        preconditions: []
        side_effects:
          - "Slot reserved_vehicle_count decreases by vehicle_count"
          - "Auto-issue ComplianceFine type=NO_SHOW_PENALTY, amount_cents=25000, created_by_user_id='system', status=ISSUED on the reservation's assignment"
          - "If the assignment is still CONFIRMED and logical clock > festival.event_start: assignment -> FORFEITED (booth -> AVAILABLE, zone totals decrease, waitlist promotion runs)"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (sweep-operations: logical clock > slot.window_end + 30 minutes grace)"
        actor: system
        preconditions: []
        side_effects:
          - "Slot reserved_vehicle_count decreases by vehicle_count"

  - entity: PosTransaction
    initial_state: REPORTED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: REPORTED
        to: VOIDED
        trigger: "POST /pos-transactions/{transactionId}/void"
        actor: FinanceLead
        preconditions:
          - "A Settlement exists for the transaction's assignment (ERR_SETTLEMENT_NOT_FOUND)"
          - "Settlement.status in {OPEN, RECONCILING, DISPUTED} (ERR_INVALID_STATE_TRANSITION)"
          - "OCC: payload expected_settlement_version == settlement.version (ERR_STALE_SETTLEMENT_VERSION)"
        side_effects:
          - "Settlement.version += 1"
          - "If settlement is RECONCILING: provisional_* fields recomputed over remaining REPORTED transactions"
      - from: REPORTED
        to: SETTLED
        trigger: "system (Settlement RECONCILING -> FINALIZED sweeps all of the assignment's REPORTED transactions)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: RECONCILING
        trigger: "POST /settlements/{settlementId}/reconcile"
        actor: FinanceLead
        preconditions: []
        side_effects:
          - "Provisional variant computed (calculations.settlement_financials provisional) and stored on provisional_* fields"
          - "reconciled_by_user_id = X-User-ID"
      - from: DISPUTED
        to: RECONCILING
        trigger: "POST /settlements/{settlementId}/reconcile"
        actor: FinanceLead
        preconditions: []
        side_effects:
          - "Provisional variant recomputed over current REPORTED set (voids and late reports since last reconcile are reflected)"
          - "reconciled_by_user_id = X-User-ID (overwrites previous)"
      - from: RECONCILING
        to: DISPUTED
        trigger: "POST /settlements/{settlementId}/dispute"
        actor: Vendor
        preconditions:
          - "Acting vendor owns the settlement's assignment's vendor (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "dispute_reason recorded"
      - from: RECONCILING
        to: FINALIZED
        trigger: "POST /settlements/{settlementId}/finalize"
        actor: FinanceLead
        preconditions:
          - "SoD: X-User-ID != reconciled_by_user_id (ERR_SOD_SETTLEMENT_FINALIZE)"
          - "No ComplianceFine of the assignment in {ISSUED, DISPUTED} (ERR_FINES_UNRESOLVED); ACKNOWLEDGED fines are allowed and will be deducted"
          - "Logical clock > festival.event_end (ERR_FESTIVAL_NOT_ENDED)"
        side_effects:
          - "Final variant computed: gross includes all non-VOIDED transactions (even reported after reconcile), fine_deduction_cents from {ISSUED, ACKNOWLEDGED} fines, vendor_payout_cents / vendor_balance_due_cents pinned per conservation formula"
          - "All REPORTED PosTransactions of the assignment -> SETTLED"
          - "PerformanceReview auto-created for the assignment (status PENDING) if none exists"
          - "finalized_by_user_id = X-User-ID"
      - from: FINALIZED
        to: PAID
        trigger: "POST /settlements/{settlementId}/mark-paid"
        actor: FinanceLead
        preconditions: []
        side_effects: []

  - entity: ComplianceFine
    initial_state: ISSUED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /compliance-fines/{fineId}/respond (response=ACKNOWLEDGED)"
        actor: Vendor
        preconditions: ["Acting vendor owns the fine's assignment's vendor (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: DISPUTED
        to: ACKNOWLEDGED
        trigger: "POST /compliance-fines/{fineId}/respond (response=ACKNOWLEDGED)"
        actor: Vendor
        preconditions: ["ownership as above"]
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /compliance-fines/{fineId}/respond (response=DISPUTED)"
        actor: Vendor
        preconditions: ["ownership as above"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: PAID
        trigger: "POST /compliance-fines/{fineId}/mark-paid"
        actor: FinanceLead
        preconditions: []
        side_effects:
          - "Vendor.compliance_strikes += 1"
          - "If vendor.compliance_strikes >= 3: Vendor -> SUSPENDED, and every application of that vendor in {SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, WAITLISTED} -> REJECTED (strike contagion)"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /compliance-fines/{fineId}/waive"
        actor: FestivalDirector
        preconditions:
          - "SoD: X-User-ID != fine.created_by_user_id unless created_by_user_id == 'system' (ERR_SOD_FINE_WAIVER)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: WAIVED
        trigger: "POST /compliance-fines/{fineId}/waive"
        actor: FestivalDirector
        preconditions: ["SoD as above"]
        side_effects: []
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /compliance-fines/{fineId}/waive"
        actor: FestivalDirector
        preconditions: ["SoD as above"]
        side_effects: []

  - entity: PerformanceReview
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, INELIGIBLE]
    transitions:
      - from: PENDING
        to: SCORED
        trigger: "POST /performance-reviews/{reviewId}/compute-score"
        actor: VendorManager
        preconditions: []
        side_effects:
          - "sales_percentile / compliance_component / operations_component / official_score / strict_score computed (calculations.performance_score)"
          - "If official_score < 70: review moves directly to INELIGIBLE instead of SCORED (auto-threshold)"
      - from: SCORED
        to: INVITED
        trigger: "POST /performance-reviews/{reviewId}/issue-invitation"
        actor: VendorManager
        preconditions:
          - "Calling issue-invitation on an INELIGIBLE review (official_score < 70 landed it there) returns ERR_SCORE_THRESHOLD_NOT_MET; SCORED implies score >= 70, so the transition itself always satisfies the threshold"
        side_effects: []
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /performance-reviews/{reviewId}/respond (response=ACCEPTED)"
        actor: Vendor
        preconditions: ["Acting vendor owns the review's vendor (ERR_NOT_RESOURCE_OWNER)"]
        side_effects: []
      - from: INVITED
        to: DECLINED
        trigger: "POST /performance-reviews/{reviewId}/respond (response=DECLINED)"
        actor: Vendor
        preconditions: ["ownership as above"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-reassign-stale-version
    parent_entity: BoothAssignment
    write_endpoint: "POST /booth-assignments/{assignmentId}/reassign"
    occ_field: expected_assignment_version
    description: |
      Reassigning a BoothAssignment whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just reassigned the same assignment to a different booth (a legitimate,
      state-preserving mutation that bumps the version) and the current writer's
      view of the assignment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-void-stale-version
    parent_entity: Settlement
    write_endpoint: "POST /pos-transactions/{transactionId}/void"
    occ_field: expected_settlement_version
    description: |
      Voiding a PosTransaction against a Settlement whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just voided a different transaction on the same
      settlement (a legitimate mutation that bumps the settlement version and
      recomputes provisionals) and the current writer's view is therefore stale.
    error_id: ERR_STALE_SETTLEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: zone_utility_reservation
    trigger: "booth-assignment create / reassign / release / forfeit / complete (any transition that enters or leaves {RESERVED, CONFIRMED, ACTIVE})"
    algorithm: aggregation
    formula: |
      zone.reserved_power_amps =
        sum(power_draw_amps) over BoothAssignments with zone_id == zone.id
        AND status IN {RESERVED, CONFIRMED, ACTIVE}
      zone.reserved_water_hookups =
        count(BoothAssignments with zone_id == zone.id
        AND status IN {RESERVED, CONFIRMED, ACTIVE} AND requires_water == true)
      Admission check on create/reassign (boundary is INCLUSIVE):
        reject when reserved_power_amps + power_draw_amps > zone.power_capacity_amps   (ERR_POWER_CAPACITY_EXCEEDED)
        reject when requires_water AND reserved_water_hookups + 1 > zone.water_hookup_total  (ERR_WATER_CAPACITY_EXCEEDED)
        i.e. landing exactly ON the capacity is allowed; one unit over is rejected.
    input_set: "BoothAssignments of the zone in status {RESERVED, CONFIRMED, ACTIVE} only; RELEASED/FORFEITED/COMPLETED never count"
    constants: {}
    precision: "integer amps; no rounding"

  - name: festival_share_tiered
    trigger: "settlement reconcile (provisional variant) and finalize (final variant), for assignments whose fee_model == REVENUE_SHARE"
    algorithm: tiered_pricing
    formula: |
      Evaluation is CHRONOLOGICAL: order the included PosTransactions by
      occurred_at ASC, tie-break created_at ASC (never by id).
      Maintain running_gross_cents (gross of transactions already processed).
      Tier ceilings on running gross: T1 = 500000, T2 = 2000000.
      Tier multipliers (basis points): M1 = 10000 (1.0x), M2 = 15000 (1.5x), M3 = 20000 (2.0x).
      effective_bp(tier) = round_half_up(revenue_share_pct_bp * M_tier / 10000)
      MARGINAL mode: each transaction amount is split across tiers according to
        where it lands on the running-gross ladder; each tier portion's share is
        round_half_up(portion_cents * effective_bp(tier) / 10000); the transaction
        share is the sum of its tier portions.
      WHOLE_TIER mode: the multiplier is selected ONCE per transaction by the
        tier the running gross sits in AFTER adding the transaction
        (running_gross <= T1 -> M1; <= T2 -> M2; else M3), and the whole
        transaction amount is charged at that multiplier.
      festival_share = sum over transactions of their per-transaction shares.
      Per-transaction rounding (NOT sum-then-round) is the pinned order — see
      calculations.per_transaction_rounding_policy.
    input_set: "provisional: transactions in REPORTED at compute time; final: all non-VOIDED transactions with occurred_at inside [event_start, event_end], including late arrivals"
    constants:
      TIER1_CEILING_CENTS: 500000
      TIER2_CEILING_CENTS: 2000000
      TIER1_MULTIPLIER_BP: 10000
      TIER2_MULTIPLIER_BP: 15000
      TIER3_MULTIPLIER_BP: 20000
    precision: "integer cents; round_half_up at every multiplication"

  - name: hybrid_fee
    trigger: "settlement reconcile/finalize, for assignments whose fee_model == HYBRID"
    algorithm: threshold
    formula: |
      variable_cents = round_half_up(revenue_share_pct_bp * max(0, gross_cents - free_allowance_cents) / 10000)
      festival_share_cents = max(minimum_guarantee_cents, flat_fee_cents + variable_cents)
      Inputs interact non-linearly: the allowance gates the variable part, the
      guarantee floors the total. fee_model FLAT_FEE: festival_share_cents = flat_fee_cents.
    input_set: "same inclusion set as festival_share_tiered for the gross figure"
    constants: {}
    precision: "integer cents; round_half_up"

  - name: per_transaction_rounding_policy
    trigger: "inside festival_share_tiered and hybrid_fee whenever a per-transaction or per-portion share is produced"
    algorithm: aggregation
    formula: |
      PINNED ORDER: each per-transaction (or per-tier-portion) share is rounded
      round_half_up to whole cents FIRST; the festival share is the SUM of those
      rounded shares. The alternative (sum raw fractional shares, round once at
      the end) is a DIFFERENT number and is explicitly rejected.
      Example pinned by the scaffold author: pct = 1000 bp (10%), MARGINAL, three
      REPORTED transactions of 101 cents each, all under T1:
        per-transaction share = round_half_up(101 * 1000 / 10000) = round_half_up(10.1) = 10
        festival_share = 10 + 10 + 10 = 30
        (sum-then-round would give round_half_up(30.3) = 30 here; with amounts
        105 cents each: per-line gives 11*3 = 33, sum-then-round gives
        round_half_up(31.5) = 32 -> 33 != 32, so the pinned order is observable.)
    constants: {}
    precision: "integer cents; round_half_up per line"

  - name: settlement_financials
    trigger: "POST /settlements/{id}/reconcile (provisional variant) and POST /settlements/{id}/finalize (final variant)"
    algorithm: aggregation
    formula: |
      gross = sum(amount_cents) of included transactions (see variants)
      share = per fee_model: FLAT_FEE -> flat_fee_cents
                             REVENUE_SHARE -> calculations.festival_share_tiered
                             HYBRID -> calculations.hybrid_fee
      FINAL only: fine_deduction_cents = sum(amount_cents) of the assignment's
        ComplianceFines in ACKNOWLEDGED at finalize time
        (ISSUED/DISPUTED block finalize per the state machine; WAIVED excluded — forgiven;
        PAID excluded — already collected out of band)
      Conservation pinning (holds for the FINAL variant):
        net_after_share = gross - share                              (may be negative)
        deductions_applied = min(fine_deduction_cents, max(0, net_after_share))
        vendor_payout_cents = max(0, net_after_share) - deductions_applied
        vendor_balance_due_cents = max(0, share + fine_deduction_cents - gross)
      Therefore: gross + vendor_balance_due_cents == share + vendor_payout_cents + deductions_applied   (exact, always)
      PROVISIONAL variant: fine_deduction = 0, provisional_payout = max(0, gross - share)
    input_set: "provisional: REPORTED transactions at reconcile; final: all non-VOIDED transactions in window (late arrivals included)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "reconcile (OPEN->RECONCILING and DISPUTED->RECONCILING)"
        difference: "Includes only transactions in REPORTED at compute time; zero fine deduction; stored on provisional_* fields"
      - name: final
        when: "finalize (RECONCILING->FINALIZED)"
        difference: "Includes late-arriving non-VOIDED transactions reported after reconcile; deducts {ISSUED, ACKNOWLEDGED} fines; pins conservation identity"

  - name: sales_percentile
    trigger: "performance-review compute-score"
    algorithm: weighted_scoring
    formula: |
      CIRCULAR-LOOKING DEPENDENCY PINNED: a review's percentile depends on the
      gross of PEER reviews, so evaluation order is fixed:
        1. Population P = all BoothAssignments of the same festival whose
           Settlement.status IN {FINALIZED, PAID} at compute time (self included).
        2. Read each peer's settlement.gross_sales_cents (already final — no
           recursion into scoring).
        3. sales_percentile = round_half_up(100 * |{p in P : p.gross < self.gross}| / |P|)
      Only after every population gross is known may any score be computed.
    input_set: "same-festival assignments with settlement in {FINALIZED, PAID}"
    constants: {}
    precision: "integer 0..100, round_half_up"

  - name: performance_score
    trigger: "performance-review compute-score"
    algorithm: weighted_scoring
    formula: |
      sp = calculations.sales_percentile
      fine_base = 100 - 15 * (count of the assignment's fines in {ISSUED, ACKNOWLEDGED, PAID}); floor 0
      ops_base  = 0 if assignment.status == FORFEITED
                  else 100 - 30 * (count of the assignment's LoadInReservations in NO_SHOW); floor 0
      compliance_component = fine_base
      operations_component = ops_base
      official_score = round_half_up((40*sp + 30*fine_base + 30*ops_base) / 100)     # integer 0..100
      strict_score   = round_half_up((40*sp + 30*max(0, fine_base - 8*waived_count) + 30*ops_base) / 100)
        where waived_count = count of the assignment's fines in WAIVED
      auto-threshold: official_score < 70 -> review status INELIGIBLE (not SCORED)
    input_set: "fines and reservations of this assignment; peer grosses per sales_percentile"
    constants:
      SALES_WEIGHT: 40
      COMPLIANCE_WEIGHT: 30
      OPERATIONS_WEIGHT: 30
      FINE_PENALTY: 15
      WAIVED_FINE_PENALTY: 8
      NO_SHOW_PENALTY_POINTS: 30
      RETURN_THRESHOLD: 70
    precision: "integer 0..100, round_half_up"
    variants:
      - name: official
        when: "return-invitation eligibility (compute-score auto-threshold and issue-invitation gate)"
        difference: "WAIVED fines excluded from the compliance component"
      - name: strict
        when: "suspension audits / vendor standing reviews"
        difference: "WAIVED fines still subtract 8 points each — a waiver forgives money, not the incident; identical inputs yield a lower score whenever waived fines exist"

  - name: load_in_capacity
    trigger: "load-in-reservation create"
    algorithm: aggregation
    formula: |
      slot.reserved_vehicle_count = sum(vehicle_count) over the slot's
        LoadInReservations in {BOOKED, CHECKED_IN}
      Admission (INCLUSIVE boundary): reject when
        reserved_vehicle_count + vehicle_count > slot.max_vehicles   (ERR_SLOT_CAPACITY_EXCEEDED)
      Aggregate-count semantics: two reservations never 'overlap' at the slot
      level — the slot only counts vehicles; geometric overlap is a separate,
      per-assignment rule (calculations.reservation_overlap).
    input_set: "reservations of the slot in {BOOKED, CHECKED_IN}"
    constants: {}
    precision: "integer vehicles"

  - name: reservation_overlap
    trigger: "load-in-reservation create"
    algorithm: interval_merge
    formula: |
      For the SAME assignment, the new reservation's slot window [s, e) must be
      geometrically disjoint from the window of every other reservation of that
      assignment in {BOOKED, CHECKED_IN, COMPLETED}:
        overlap iff existing.window_start < new.window_end AND new.window_start < existing.window_end
      Half-open semantics: adjacency is allowed — existing.window_end == new.window_start
      (or vice versa) is NOT an overlap. Violation -> ERR_VEHICLE_WINDOW_OVERLAP.
    input_set: "the assignment's reservations in {BOOKED, CHECKED_IN, COMPLETED}"
    constants: {}
    precision: "exact datetime comparison"

  - name: no_show_marking
    trigger: "POST /festivals/{festivalId}/sweep-operations"
    algorithm: threshold
    formula: |
      For every LoadInReservation of the festival in BOOKED with
        logical_clock > slot.window_end + 30 minutes:  -> NO_SHOW
      For every LoadInReservation of the festival in CHECKED_IN with
        logical_clock > slot.window_end + 30 minutes:  -> COMPLETED
      Every new NO_SHOW auto-issues a NO_SHOW_PENALTY fine (25000 cents, 'system').
      Every CONFIRMED assignment of the festival with logical_clock > festival.event_start
        -> FORFEITED (with booth/zone release and waitlist promotion).
      Boundary: clock == window_end + 30min exactly does NOT mark (strict >).
    constants:
      CHECKIN_GRACE_MINUTES: 30
      NO_SHOW_FINE_CENTS: 25000
    precision: "exact datetime comparison"

  - name: strike_contagion
    trigger: "compliance-fine mark-paid"
    algorithm: threshold
    formula: |
      vendor.compliance_strikes += 1
      if vendor.compliance_strikes >= 3:
        vendor.status = SUSPENDED
        every VendorApplication of the vendor in {SUBMITTED, UNDER_REVIEW,
        CHANGES_REQUESTED, WAITLISTED} -> REJECTED (same request, immediate)
      Boundary: strikes == 3 suspends (>=, not >).
    constants:
      STRIKE_SUSPENSION_THRESHOLD: 3
    precision: "integer"

  - name: waitlist_promotion
    trigger: "booth-assignment release or forfeit (after booth/zone release side effects land)"
    algorithm: selector_policy
    formula: |
      Eligibility filter (ALL must hold), evaluated against the freed zone Z and festival F:
        - application.status == WAITLISTED and application.festival_id == F.id
        - no assignment in {RESERVED, CONFIRMED, ACTIVE} exists in Z with the
          application's category (category exclusivity within a zone)
        - count of F's ACCEPTED applications with the application's category
          < F.category_cap_per_category
        - application.power_needed_amps <= Z.power_capacity_amps - Z.reserved_power_amps (post-release)
        - (not application.requires_water) OR Z.reserved_water_hookups < Z.water_hookup_total
      Ranking: created_at ASC; tie-break vendor.legal_name ASC (never id).
      Fallback: empty candidate set -> no-op (no error).
      Effect: the top candidate moves WAITLISTED -> UNDER_REVIEW (exactly one per trigger).
    constants: {}
    precision: "deterministic selector"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Segregation of duties: fine waver != fine issuer (unless issuer is 'system'); settlement finalizer != settlement reconciler"
    error_id: "ERR_SOD_FINE_WAIVER | ERR_SOD_SETTLEMENT_FINALIZE"
    http_status: 403
    applies_to: "POST /compliance-fines/{fineId}/waive, POST /settlements/{settlementId}/finalize"
  - priority: 4
    category: existence
    check: "Path ids exist, evaluated left-to-right; body FK references exist"
    error_id: "ERR_<RESOURCE>_NOT_FOUND (ERR_FESTIVAL_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_BOOTH_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_TRANSACTION_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND, ERR_FINE_NOT_FOUND, ERR_REVIEW_NOT_FOUND)"
    http_status: 404
    applies_to: "all parameterized endpoints"
  - priority: 5
    category: auth
    check: "Entity-backed ownership: a Vendor actor may only touch resources whose vendor chain resolves to X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Vendor-role write endpoints (applications submit/withdraw, reservations book/cancel, pos report, settlement dispute, fine respond, review respond)"
  - priority: 6
    category: state
    check: "Festival posture gates child writes: application submit requires APPLICATIONS_OPEN; booth-assignment create requires CURATED; pos report / assignment activate require LIVE; settlement create requires LIVE or SETTLEMENT"
    error_id: "ERR_FESTIVAL_NOT_ACCEPTING_APPLICATIONS | ERR_FESTIVAL_NOT_ACCEPTING_ASSIGNMENTS | ERR_FESTIVAL_NOT_LIVE | ERR_FESTIVAL_NOT_IN_SETTLEMENT"
    http_status: 409
    applies_to: "POST /vendor-applications, POST /booth-assignments, POST /pos-transactions, POST /booth-assignments/{id}/activate, POST /settlements"
  - priority: 7
    category: state
    check: "Vendor standing: a SUSPENDED vendor may not submit applications"
    error_id: ERR_VENDOR_SUSPENDED
    http_status: 409
    applies_to: "POST /vendor-applications"
  - priority: 8
    category: state
    check: "Resource state-machine legality for the requested operation (including terminal lockdown, non-ACTIVE assignment on POS report / inspection-agnostic creates, and request-shape errors such as missing/invalid fields and enum violations surfaced as ERR_INVALID_REQUEST at 400)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "all transition endpoints and state-gated creates"
  - priority: 9
    category: business_referential
    check: "Cross-FK integrity: assignment's application.festival_id == booth.zone.festival_id; reservation's assignment and slot share a festival; supersede source is CHANGES_REQUESTED + same vendor + same festival; exactly one Settlement per assignment; finalize blocked by non-terminal fines; festival close blocked by non-PAID settlements"
    error_id: "ERR_CROSS_FESTIVAL_REFERENCE | ERR_SUPERSEDE_SOURCE_INVALID | ERR_SETTLEMENT_EXISTS | ERR_FINES_UNRESOLVED | ERR_SETTLEMENTS_OPEN"
    http_status: 409
    applies_to: "POST /booth-assignments, POST /load-in-reservations, POST /vendor-applications (supersede), POST /settlements, POST /settlements/{id}/finalize, festival advance-status"
  - priority: 10
    category: business_safety
    check: "Public-safety gate: assignment activation requires latest HEALTH_PREOPEN inspection result == PASS"
    error_id: ERR_PREOPEN_INSPECTION_MISSING
    http_status: 409
    applies_to: "POST /booth-assignments/{assignmentId}/activate"
  - priority: 11
    category: business_temporal
    check: "Clock rules: reservation create/cancel rejected once logical clock >= slot.window_start - 120min; check-in allowed only inside [window_start, window_end + 30min]; pos occurred_at inside [event_start, event_end]; slot window_end > window_start; LIVE requires clock >= event_start; SETTLEMENT requires clock > event_end"
    error_id: "ERR_SLOT_LOCKED | ERR_CHECKIN_WINDOW_CLOSED | ERR_TRANSACTION_OUT_OF_WINDOW | ERR_INVALID_WINDOW | ERR_FESTIVAL_NOT_STARTED | ERR_FESTIVAL_NOT_ENDED"
    http_status: 409
    applies_to: "POST /load-in-reservations, POST /load-in-reservations/{id}/cancel, POST /load-in-reservations/{id}/check-in, POST /pos-transactions, POST /load-in-slots, festival advance-status"
  - priority: 12
    category: business_constraint
    check: "Resource constraints: category exclusivity per zone; category cap per festival at ACCEPT time; booth AVAILABLE; draw <= outlet; water hookup on booth; zone power/water budgets; slot vehicle capacity; per-assignment window overlap; review_round < 3"
    error_id: "ERR_CATEGORY_EXCLUSIVITY_CONFLICT | ERR_CATEGORY_CAP_REACHED | ERR_BOOTH_NOT_AVAILABLE | ERR_POWER_DRAW_EXCEEDS_OUTLET | ERR_WATER_HOOKUP_UNAVAILABLE | ERR_POWER_CAPACITY_EXCEEDED | ERR_WATER_CAPACITY_EXCEEDED | ERR_SLOT_CAPACITY_EXCEEDED | ERR_VEHICLE_WINDOW_OVERLAP | ERR_REVIEW_ROUND_LIMIT"
    http_status: 409
    applies_to: "POST /booth-assignments, POST /booth-assignments/{id}/reassign, POST /vendor-applications/{id}/decide, POST /load-in-reservations, POST /vendor-applications/{id}/request-changes"
  - priority: 13
    category: business_fiscal
    check: "Fee-term completeness for the curated fee model at ACCEPT; amount_cents >= 1 on transactions and fines; OCC version freshness on guarded writes"
    error_id: "ERR_FEE_TERMS_INCOMPLETE | ERR_INVALID_AMOUNT | ERR_STALE_VERSION | ERR_STALE_SETTLEMENT_VERSION"
    http_status: 400
    applies_to: "POST /vendor-applications/{id}/decide, POST /pos-transactions, POST /compliance-fines, POST /booth-assignments/{id}/reassign, POST /pos-transactions/{id}/void"

# =============================================================================
# §1.5 API Endpoint Table (63 endpoints)
# =============================================================================
endpoints:
  # --- Festival (5) ---
  - { method: POST, path: "/festivals", description: "Create a festival", roles: [FestivalDirector], code: 201, input: [name, event_start, event_end, category_cap_per_category], output: Festival, side_effects: ["status=PLANNING"] }
  - { method: GET, path: "/festivals", description: "List festivals", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "status?"], output: "Festival[]", side_effects: [] }
  - { method: GET, path: "/festivals/{festivalId}", description: "Get a festival", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: [], output: Festival, side_effects: [] }
  - { method: POST, path: "/festivals/{festivalId}/advance-status", description: "Advance festival lifecycle one step (to_status must be the immediate successor)", roles: [FestivalDirector], code: 200, input: [to_status], output: Festival, side_effects: ["LIVE->SETTLEMENT completes ACTIVE assignments and releases their zone reservations"] }
  - { method: POST, path: "/festivals/{festivalId}/sweep-operations", description: "Ops-run checkpoint: mark no-shows, complete checked-in reservations, forfeit never-activated CONFIRMED assignments, auto-issue NO_SHOW fines, run waitlist promotion", roles: [OperationsLead, FestivalDirector], code: 200, input: [], output: "{ no_shows_marked: integer, forfeited_assignment_ids: string[], promoted_application_ids: string[] }", side_effects: ["calculations.no_show_marking", "calculations.waitlist_promotion"] }

  # --- Vendor (3) ---
  - { method: POST, path: "/vendors", description: "Onboard a vendor", roles: [FestivalDirector, VendorManager], code: 201, input: [legal_name, contact_email], output: Vendor, side_effects: ["status=APPROVED, compliance_strikes=0"] }
  - { method: GET, path: "/vendors", description: "List vendors", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead], code: 200, input: ["limit?", "offset?", "status?"], output: "Vendor[]", side_effects: [] }
  - { method: GET, path: "/vendors/{vendorId}", description: "Get a vendor", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: [], output: Vendor, side_effects: [] }

  # --- VendorApplication (7) ---
  - { method: POST, path: "/vendor-applications", description: "Submit (or resubmit via supersedes_application_id) an application", roles: [Vendor], code: 201, input: [vendor_id, festival_id, category, fee_model, power_needed_amps, requires_water, "proposed_flat_fee_cents?", "proposed_revenue_share_pct_bp?", "supersedes_application_id?"], output: VendorApplication, side_effects: ["supersede: source CHANGES_REQUESTED -> SUPERSEDED, new review_round = source + 1"] }
  - { method: GET, path: "/vendor-applications", description: "List/filter applications", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "festival_id?", "vendor_id?", "status?", "category?", "supersedes_application_id?"], output: "VendorApplication[]", side_effects: [] }
  - { method: GET, path: "/vendor-applications/{applicationId}", description: "Get an application", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: [], output: VendorApplication, side_effects: [] }
  - { method: POST, path: "/vendor-applications/{applicationId}/start-review", description: "SUBMITTED or WAITLISTED -> UNDER_REVIEW", roles: [VendorManager], code: 200, input: [], output: VendorApplication, side_effects: [] }
  - { method: POST, path: "/vendor-applications/{applicationId}/request-changes", description: "UNDER_REVIEW -> CHANGES_REQUESTED; blocked when review_round >= 3", roles: [VendorManager], code: 200, input: ["notes?"], output: VendorApplication, side_effects: [] }
  - { method: POST, path: "/vendor-applications/{applicationId}/decide", description: "UNDER_REVIEW -> ACCEPTED | REJECTED | WAITLISTED with curated terms", roles: [VendorManager], code: 200, input: [decision, "curated_fee_model?", "curated_flat_fee_cents?", "curated_revenue_share_pct_bp?", "curated_tier_mode?", "curated_minimum_guarantee_cents?", "curated_free_allowance_cents?"], output: VendorApplication, side_effects: ["ACCEPTED: curated terms pinned, category cap enforced"] }
  - { method: POST, path: "/vendor-applications/{applicationId}/withdraw", description: "Owner withdraws a non-terminal application", roles: [Vendor], code: 200, input: [], output: VendorApplication, side_effects: [] }

  # --- Zone (3) ---
  - { method: POST, path: "/zones", description: "Create a zone with utility budgets", roles: [OperationsLead], code: 201, input: [festival_id, name, power_capacity_amps, water_hookup_total], output: Zone, side_effects: [] }
  - { method: GET, path: "/zones", description: "List zones", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "festival_id?"], output: "Zone[]", side_effects: [] }
  - { method: GET, path: "/zones/{zoneId}", description: "Get a zone (incl. computed reserved totals)", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: [], output: Zone, side_effects: [] }

  # --- Booth (3) ---
  - { method: POST, path: "/booths", description: "Create a booth in a zone", roles: [OperationsLead], code: 201, input: [zone_id, label, power_outlet_max_amps, has_water_hookup], output: Booth, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/booths", description: "List booths", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "zone_id?", "status?"], output: "Booth[]", side_effects: [] }
  - { method: GET, path: "/booths/{boothId}", description: "Get a booth", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: [], output: Booth, side_effects: [] }

  # --- BoothAssignment (8) ---
  - { method: POST, path: "/booth-assignments", description: "Reserve a booth for an ACCEPTED application; holds zone utility budget", roles: [OperationsLead], code: 201, input: [application_id, booth_id, power_draw_amps, requires_water], output: BoothAssignment, side_effects: ["booth AVAILABLE->RESERVED", "zone reserved totals increase"] }
  - { method: GET, path: "/booth-assignments", description: "List assignments", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "festival_id?", "application_id?", "booth_id?", "zone_id?", "status?"], output: "BoothAssignment[]", side_effects: [] }
  - { method: GET, path: "/booth-assignments/{assignmentId}", description: "Get an assignment", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: [], output: BoothAssignment, side_effects: [] }
  - { method: POST, path: "/booth-assignments/{assignmentId}/confirm", description: "RESERVED -> CONFIRMED; pins fee-terms snapshot from curated application terms", roles: [OperationsLead], code: 200, input: [], output: BoothAssignment, side_effects: ["booth RESERVED->ASSIGNED", "fee snapshot pinned"] }
  - { method: POST, path: "/booth-assignments/{assignmentId}/reassign", description: "Move assignment to a different booth (OCC-guarded)", roles: [OperationsLead], code: 200, input: [new_booth_id, expected_assignment_version], output: BoothAssignment, side_effects: ["old booth -> AVAILABLE and zone totals decrease; new booth held; increments BoothAssignment.version by 1"] }
  - { method: POST, path: "/booth-assignments/{assignmentId}/provision-utilities", description: "utility_status PENDING -> PROVISIONED (requires status CONFIRMED)", roles: [OperationsLead], code: 200, input: [], output: BoothAssignment, side_effects: [] }
  - { method: POST, path: "/booth-assignments/{assignmentId}/activate", description: "CONFIRMED -> ACTIVE; requires PROVISIONED utilities, latest HEALTH_PREOPEN PASS, festival LIVE", roles: [OperationsLead], code: 200, input: [], output: BoothAssignment, side_effects: [] }
  - { method: POST, path: "/booth-assignments/{assignmentId}/release", description: "RESERVED/CONFIRMED -> RELEASED; frees booth + zone budget; triggers waitlist promotion", roles: [OperationsLead], code: 200, input: [], output: BoothAssignment, side_effects: ["booth -> AVAILABLE", "zone totals decrease", "calculations.waitlist_promotion"] }

  # --- InspectionRecord (3) ---
  - { method: POST, path: "/inspection-records", description: "Record a completed walk-up inspection (result included); HEALTH_SPOT FAIL auto-issues a 50000-cent HEALTH_VIOLATION fine by 'system'", roles: [HealthInspector], code: 201, input: [assignment_id, type, result, "notes?"], output: InspectionRecord, side_effects: ["HEALTH_SPOT + FAIL -> auto ComplianceFine"] }
  - { method: GET, path: "/inspection-records", description: "List inspection records", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "assignment_id?", "festival_id?", "type?", "result?"], output: "InspectionRecord[]", side_effects: [] }
  - { method: GET, path: "/inspection-records/{inspectionId}", description: "Get an inspection record", roles: [FestivalDirector, VendorManager, OperationsLead, HealthInspector, FinanceLead, Vendor], code: 200, input: [], output: InspectionRecord, side_effects: [] }

  # --- LoadInSlot (3) ---
  - { method: POST, path: "/load-in-slots", description: "Create a vehicle access window (window_end must be > window_start)", roles: [OperationsLead], code: 201, input: [festival_id, gate, window_start, window_end, max_vehicles], output: LoadInSlot, side_effects: [] }
  - { method: GET, path: "/load-in-slots", description: "List load-in slots", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "festival_id?", "gate?"], output: "LoadInSlot[]", side_effects: [] }
  - { method: GET, path: "/load-in-slots/{slotId}", description: "Get a slot (incl. reserved_vehicle_count)", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: [], output: LoadInSlot, side_effects: [] }

  # --- LoadInReservation (5) ---
  - { method: POST, path: "/load-in-reservations", description: "Book vehicles into a slot window for an assignment", roles: [OperationsLead, Vendor], code: 201, input: [assignment_id, slot_id, vehicle_count], output: LoadInReservation, side_effects: ["slot reserved_vehicle_count increases"] }
  - { method: GET, path: "/load-in-reservations", description: "List reservations", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "assignment_id?", "slot_id?", "festival_id?", "status?"], output: "LoadInReservation[]", side_effects: [] }
  - { method: GET, path: "/load-in-reservations/{reservationId}", description: "Get a reservation", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: [], output: LoadInReservation, side_effects: [] }
  - { method: POST, path: "/load-in-reservations/{reservationId}/check-in", description: "BOOKED -> CHECKED_IN inside [window_start, window_end + 30min]", roles: [OperationsLead], code: 200, input: [], output: LoadInReservation, side_effects: ["checked_in_at set"] }
  - { method: POST, path: "/load-in-reservations/{reservationId}/cancel", description: "BOOKED -> CANCELLED before the slot lock horizon", roles: [OperationsLead, Vendor], code: 200, input: [], output: LoadInReservation, side_effects: ["slot reserved_vehicle_count decreases"] }

  # --- PosTransaction (4) ---
  - { method: POST, path: "/pos-transactions", description: "Report a cashless sale; idempotent on (assignment_id, idempotency_key) — duplicates return 200 with the existing row", roles: [Vendor, FinanceLead], code: 201, input: [assignment_id, amount_cents, occurred_at, idempotency_key], output: PosTransaction, side_effects: ["status=REPORTED"] }
  - { method: GET, path: "/pos-transactions", description: "List transactions", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "assignment_id?", "festival_id?", "status?", "idempotency_key?"], output: "PosTransaction[]", side_effects: [] }
  - { method: GET, path: "/pos-transactions/{transactionId}", description: "Get a transaction", roles: [FestivalDirector, VendorManager, OperationsLead, FinanceLead, Vendor], code: 200, input: [], output: PosTransaction, side_effects: [] }
  - { method: POST, path: "/pos-transactions/{transactionId}/void", description: "REPORTED -> VOIDED (OCC on the parent settlement)", roles: [FinanceLead], code: 200, input: [expected_settlement_version], output: PosTransaction, side_effects: ["increments Settlement.version by 1", "recompute provisional_* when settlement is RECONCILING"] }

  # --- Settlement (7) ---
  - { method: POST, path: "/settlements", description: "Create the (single) settlement for an assignment", roles: [FinanceLead], code: 201, input: [assignment_id], output: Settlement, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/settlements", description: "List settlements", roles: [FestivalDirector, VendorManager, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "assignment_id?", "festival_id?", "status?"], output: "Settlement[]", side_effects: [] }
  - { method: GET, path: "/settlements/{settlementId}", description: "Get a settlement", roles: [FestivalDirector, VendorManager, FinanceLead, Vendor], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: POST, path: "/settlements/{settlementId}/reconcile", description: "OPEN|DISPUTED -> RECONCILING; computes the provisional variant", roles: [FinanceLead], code: 200, input: [], output: Settlement, side_effects: ["provisional_* computed", "reconciled_by_user_id recorded"] }
  - { method: POST, path: "/settlements/{settlementId}/dispute", description: "RECONCILING -> DISPUTED (vendor owner)", roles: [Vendor], code: 200, input: [reason], output: Settlement, side_effects: ["dispute_reason recorded"] }
  - { method: POST, path: "/settlements/{settlementId}/finalize", description: "RECONCILING -> FINALIZED; SoD vs reconciler; sweeps REPORTED -> SETTLED; auto-creates PerformanceReview", roles: [FinanceLead], code: 200, input: [], output: Settlement, side_effects: ["final variant computed with fine deductions", "transactions SETTLED", "PerformanceReview created (PENDING)"] }
  - { method: POST, path: "/settlements/{settlementId}/mark-paid", description: "FINALIZED -> PAID", roles: [FinanceLead], code: 200, input: [], output: Settlement, side_effects: [] }

  # --- ComplianceFine (6) ---
  - { method: POST, path: "/compliance-fines", description: "Issue a waste/compost/health fine against an assignment", roles: [SustainabilityOfficer, FestivalDirector], code: 201, input: [assignment_id, type, amount_cents, "description?"], output: ComplianceFine, side_effects: ["status=ISSUED, created_by_user_id recorded"] }
  - { method: GET, path: "/compliance-fines", description: "List fines", roles: [FestivalDirector, VendorManager, OperationsLead, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "assignment_id?", "festival_id?", "status?", "type?"], output: "ComplianceFine[]", side_effects: [] }
  - { method: GET, path: "/compliance-fines/{fineId}", description: "Get a fine", roles: [FestivalDirector, VendorManager, OperationsLead, SustainabilityOfficer, FinanceLead, Vendor], code: 200, input: [], output: ComplianceFine, side_effects: [] }
  - { method: POST, path: "/compliance-fines/{fineId}/respond", description: "Vendor owner responds: response=ACKNOWLEDGED|DISPUTED", roles: [Vendor], code: 200, input: [response], output: ComplianceFine, side_effects: [] }
  - { method: POST, path: "/compliance-fines/{fineId}/waive", description: "Waive a non-terminal fine; SoD: waver != issuer unless issuer is 'system'", roles: [FestivalDirector], code: 200, input: [], output: ComplianceFine, side_effects: ["waived_by_user_id recorded"] }
  - { method: POST, path: "/compliance-fines/{fineId}/mark-paid", description: "ACKNOWLEDGED -> PAID; strike contagion on the vendor", roles: [FinanceLead], code: 200, input: [], output: ComplianceFine, side_effects: ["calculations.strike_contagion"] }

  # --- PerformanceReview (5) ---
  - { method: GET, path: "/performance-reviews", description: "List reviews", roles: [FestivalDirector, VendorManager, FinanceLead, Vendor], code: 200, input: ["limit?", "offset?", "assignment_id?", "festival_id?", "vendor_id?", "status?"], output: "PerformanceReview[]", side_effects: [] }
  - { method: GET, path: "/performance-reviews/{reviewId}", description: "Get a review", roles: [FestivalDirector, VendorManager, FinanceLead, Vendor], code: 200, input: [], output: PerformanceReview, side_effects: [] }
  - { method: POST, path: "/performance-reviews/{reviewId}/compute-score", description: "PENDING -> SCORED (or INELIGIBLE when official_score < 70)", roles: [VendorManager], code: 200, input: [], output: PerformanceReview, side_effects: ["calculations.performance_score + sales_percentile"] }
  - { method: POST, path: "/performance-reviews/{reviewId}/issue-invitation", description: "SCORED -> INVITED (requires official_score >= 70)", roles: [VendorManager], code: 200, input: [], output: PerformanceReview, side_effects: [] }
  - { method: POST, path: "/performance-reviews/{reviewId}/respond", description: "Vendor owner responds to invitation: response=ACCEPTED|DECLINED", roles: [Vendor], code: 200, input: [response], output: PerformanceReview, side_effects: [] }

  # --- Test-driving clock (1) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time; all temporal rules (slot lock, check-in grace, festival start/end gates, sweeps) read this clock.", roles: [FestivalDirector], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog (52)
# =============================================================================
errors:
  # --- auth / RBAC ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed Vendor actor does not own the target resource" }
  - { id: ERR_SOD_FINE_WAIVER, http: 403, condition: "Fine waver equals fine issuer (issuer is not 'system')" }
  - { id: ERR_SOD_SETTLEMENT_FINALIZE, http: 403, condition: "Settlement finalizer equals the recorded reconciler" }
  # --- existence (13) ---
  - { id: ERR_FESTIVAL_NOT_FOUND, http: 404, condition: "festivalId does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "vendorId / vendor_id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "applicationId / application_id does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "zoneId / zone_id does not exist" }
  - { id: ERR_BOOTH_NOT_FOUND, http: 404, condition: "boothId / booth_id / new_booth_id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId / assignment_id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspectionId does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "slotId / slot_id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservationId does not exist" }
  - { id: ERR_TRANSACTION_NOT_FOUND, http: 404, condition: "transactionId does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlementId does not exist, or void attempted with no settlement on the assignment" }
  - { id: ERR_FINE_NOT_FOUND, http: 404, condition: "fineId does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "reviewId does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or enum violation" }
  - { id: ERR_INVALID_AMOUNT, http: 400, condition: "amount_cents < 1 on a transaction or fine" }
  # --- state / posture ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not permitted from the resource's current state (incl. terminal lockdown and non-successor advance-status)" }
  - { id: ERR_FESTIVAL_NOT_ACCEPTING_APPLICATIONS, http: 409, condition: "Application submit while festival is not APPLICATIONS_OPEN" }
  - { id: ERR_FESTIVAL_NOT_ACCEPTING_ASSIGNMENTS, http: 409, condition: "Booth-assignment create while festival is not CURATED" }
  - { id: ERR_FESTIVAL_NOT_LIVE, http: 409, condition: "POS report or assignment activate while festival is not LIVE" }
  - { id: ERR_FESTIVAL_NOT_IN_SETTLEMENT, http: 409, condition: "Settlement create while festival is neither LIVE nor SETTLEMENT" }
  - { id: ERR_FESTIVAL_NOT_CONFIGURED, http: 409, condition: "PLANNING->APPLICATIONS_OPEN with zero zones" }
  - { id: ERR_APPLICATIONS_PENDING_REVIEW, http: 409, condition: "APPLICATIONS_OPEN->CURATED while applications remain in SUBMITTED/UNDER_REVIEW/CHANGES_REQUESTED" }
  - { id: ERR_ASSIGNMENTS_UNCONFIRMED, http: 409, condition: "CURATED->LIVE while any assignment is RESERVED" }
  - { id: ERR_SETTLEMENTS_OPEN, http: 409, condition: "SETTLEMENT->CLOSED while any settlement is not PAID" }
  - { id: ERR_FESTIVAL_NOT_STARTED, http: 409, condition: "CURATED->LIVE before event_start on the logical clock" }
  - { id: ERR_FESTIVAL_NOT_ENDED, http: 409, condition: "LIVE->SETTLEMENT or settlement finalize before event_end on the logical clock" }
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "Application submit by a SUSPENDED vendor" }
  # --- referential ---
  - { id: ERR_CROSS_FESTIVAL_REFERENCE, http: 409, condition: "Linked resources belong to different festivals (booth's zone vs application; slot vs assignment)" }
  - { id: ERR_SUPERSEDE_SOURCE_INVALID, http: 409, condition: "supersedes_application_id missing, not CHANGES_REQUESTED, or different vendor/festival" }
  - { id: ERR_SETTLEMENT_EXISTS, http: 409, condition: "A settlement already exists for the assignment" }
  - { id: ERR_FINES_UNRESOLVED, http: 409, condition: "Finalize with any fine in {ISSUED, DISPUTED}" }
  # --- safety ---
  - { id: ERR_PREOPEN_INSPECTION_MISSING, http: 409, condition: "Activate without a latest HEALTH_PREOPEN inspection of result PASS" }
  - { id: ERR_UTILITIES_NOT_PROVISIONED, http: 409, condition: "Activate while utility_status is PENDING" }
  # --- temporal ---
  - { id: ERR_SLOT_LOCKED, http: 409, condition: "Reservation create/cancel at or after slot.window_start - 120min on the logical clock" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "Check-in outside [window_start, window_end + 30min]" }
  - { id: ERR_TRANSACTION_OUT_OF_WINDOW, http: 400, condition: "occurred_at outside [event_start, event_end]" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "window_end <= window_start" }
  # --- constraints ---
  - { id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT, http: 409, condition: "An assignment in {RESERVED, CONFIRMED, ACTIVE} with the same category already exists in the zone" }
  - { id: ERR_CATEGORY_CAP_REACHED, http: 409, condition: "ACCEPT would reach/exceed festival.category_cap_per_category for the category" }
  - { id: ERR_BOOTH_NOT_AVAILABLE, http: 409, condition: "Booth is not AVAILABLE" }
  - { id: ERR_POWER_DRAW_EXCEEDS_OUTLET, http: 400, condition: "power_draw_amps > booth.power_outlet_max_amps" }
  - { id: ERR_WATER_HOOKUP_UNAVAILABLE, http: 400, condition: "requires_water=true but booth.has_water_hookup=false" }
  - { id: ERR_POWER_CAPACITY_EXCEEDED, http: 409, condition: "Zone reserved_power_amps + draw > power_capacity_amps" }
  - { id: ERR_WATER_CAPACITY_EXCEEDED, http: 409, condition: "Zone reserved_water_hookups + 1 > water_hookup_total" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "reserved_vehicle_count + vehicle_count > max_vehicles" }
  - { id: ERR_VEHICLE_WINDOW_OVERLAP, http: 409, condition: "Same-assignment reservation windows geometrically overlap (half-open; adjacency allowed)" }
  - { id: ERR_REVIEW_ROUND_LIMIT, http: 409, condition: "request-changes when review_round >= 3" }
  # --- fiscal ---
  - { id: ERR_FEE_TERMS_INCOMPLETE, http: 400, condition: "ACCEPT without the curated terms required by the curated fee model" }
  - { id: ERR_SCORE_THRESHOLD_NOT_MET, http: 409, condition: "issue-invitation called on an INELIGIBLE review (official_score < 70)" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_assignment_version != current BoothAssignment.version on reassign" }
  - { id: ERR_STALE_SETTLEMENT_VERSION, http: 412, condition: "expected_settlement_version != current Settlement.version on POS void" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FestivalDirector
    description: "Festival executive: owns lifecycle, waives fines, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /festivals"
      - "POST /festivals/{festivalId}/advance-status"
      - "POST /compliance-fines/{fineId}/waive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /vendors (with VendorManager)"
      - "POST /festivals/{festivalId}/sweep-operations (with OperationsLead)"
      - "POST /compliance-fines (with SustainabilityOfficer)"
      - "All GET list/detail endpoints"
  - name: VendorManager
    description: "Curation and vendor-performance owner"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-applications/{applicationId}/start-review"
      - "POST /vendor-applications/{applicationId}/request-changes"
      - "POST /vendor-applications/{applicationId}/decide"
      - "POST /performance-reviews/{reviewId}/compute-score"
      - "POST /performance-reviews/{reviewId}/issue-invitation"
    shared_operations:
      - "POST /vendors (with FestivalDirector)"
      - "All GET list/detail endpoints"
  - name: OperationsLead
    description: "Site operations: zones, booths, assignments, load-in logistics, sweeps, gate check-in"
    identity: opaque
    exclusive_operations:
      - "POST /zones"
      - "POST /booths"
      - "POST /booth-assignments (+ confirm / reassign / provision-utilities / activate / release)"
      - "POST /load-in-slots"
      - "POST /load-in-reservations/{reservationId}/check-in"
    shared_operations:
      - "POST /load-in-reservations and /cancel (with owning Vendor)"
      - "POST /festivals/{festivalId}/sweep-operations (with FestivalDirector)"
      - "All GET list/detail endpoints"
  - name: HealthInspector
    description: "Records health and fire inspection outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /inspection-records"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: SustainabilityOfficer
    description: "Waste/compost compliance: issues fines (may never waive)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /compliance-fines (with FestivalDirector)"
      - "All GET list/detail endpoints"
  - name: FinanceLead
    description: "Cashless settlement owner: reconciles, finalizes, pays, voids transactions, collects fines"
    identity: opaque
    exclusive_operations:
      - "POST /settlements (+ reconcile / finalize / mark-paid)"
      - "POST /pos-transactions/{transactionId}/void"
      - "POST /compliance-fines/{fineId}/mark-paid"
    shared_operations:
      - "POST /pos-transactions (with owning Vendor)"
      - "All GET list/detail endpoints"
  - name: Vendor
    description: "Entity-backed vendor user; X-User-ID equals the Vendor.id it acts as"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendor-applications"
      - "POST /vendor-applications/{applicationId}/withdraw"
      - "POST /settlements/{settlementId}/dispute"
      - "POST /compliance-fines/{fineId}/respond"
      - "POST /performance-reviews/{reviewId}/respond"
    shared_operations:
      - "POST /load-in-reservations and /cancel (own assignments only)"
      - "POST /pos-transactions (own assignments only)"
      - "All GET list/detail endpoints"
