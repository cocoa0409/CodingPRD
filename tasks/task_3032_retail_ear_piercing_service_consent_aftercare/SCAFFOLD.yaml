  # --- Appointments ----------------------------------------------------------
  - method: POST
    path: "/piercing-services/appointments"
    description: "Book an appointment or walk-in slot"
    roles: [IntakeAssociate]
    code: 201
    input: [store_location_id, customer_id, piercer_id, jurisdiction_id, intake_type, site_requested, slot_start_at, slot_end_at]
    output: Appointment
    side_effects: ["status initialized to BOOKED", "reschedule_count initialized to 0"]

  - method: GET
    path: "/piercing-services/appointments"
    description: "List appointments, optionally filtered by store, piercer, customer or jurisdiction"
    roles: [AnyAuthenticated]
    code: 200
    input: ["store_location_id?", "piercer_id?", "customer_id?", "jurisdiction_id?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/appointments/{appointmentId}"
    description: "Get one appointment"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/piercing-services/appointments/{appointmentId}/screenings"
    description: "List screenings recorded against an appointment"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: "AnatomyScreening[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/appointments/{appointmentId}/sessions"
    description: "List piercing sessions recorded against an appointment"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: "PiercingSession[]"
    side_effects: []

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/confirm"
    description: "Confirm an appointment after slot validation"
    roles: [IntakeAssociate]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = CONFIRMED"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/check-in"
    description: "Check the customer in at the store"
    roles: [IntakeAssociate]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = CHECKED_IN"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/screen"
    description: "Perform the anatomy screening at the chair"
    roles: [Piercer]
    code: 200
    input: [anatomy_sites_examined, contraindication_codes]
    output: Appointment
    side_effects: ["status = SCREENED", "AnatomyScreening created in outcome PENDING"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/start-service"
    description: "Begin the piercing service"
    roles: [Piercer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = IN_SERVICE", "Piercer.assigned_session_count += 1", "PiercingSession created in service_status IN_PROGRESS", "The session's cartridge_lot_id is selected by selector policy `store_available_lot`: (a) candidate set = CartridgeLot rows with store_location_id == store.id, site_type == site_requested, status IN {AVAILABLE}, units_available >= 1, expiration_date > clock; (b) ranking = units_available DESC, then expiration_date ASC; (c) tie-break = created_at ASC, never id; (d) empty-pool fallback = ERR_CARTRIDGE_LOT_UNAVAILABLE", "CartridgeLot.units_consumed += 1, units_available -= 1 on the selected lot"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/refuse"
    description: "Refuse service on screening grounds"
    roles: [Piercer]
    code: 200
    input: [refusal_reason_code]
    output: Appointment
    side_effects: ["status = REFUSED"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/complete"
    description: "Complete the service"
    roles: [Piercer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = COMPLETED", "Piercer.assigned_session_count -= 1", "PiercingSession.service_status = COMPLETED", "CartridgeLot.units_consumed += 1", "HealingOutcome created in status ASSESSED", "follow_up_reminder_due_at scheduled"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/abort"
    description: "Abort the service mid-procedure"
    roles: [Piercer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = CANCELLED", "Piercer.assigned_session_count -= 1", "PiercingSession.service_status = ABORTED", "CartridgeLot.units_quarantined += 1"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/reschedule"
    description: "Move an appointment to a new slot"
    roles: [IntakeAssociate]
    code: 200
    input: [new_slot_start_at, new_slot_end_at, expected_appointment_version]
    output: Appointment
    side_effects: ["status = RESCHEDULED", "reschedule_count += 1", "increments Appointment.version by 1"]

  - method: POST
    path: "/piercing-services/appointments/{appointmentId}/cancel"
    description: "Cancel an appointment"
    roles: [IntakeAssociate]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status = CANCELLED"]

  # --- Screenings ------------------------------------------------------------
  - method: POST
    path: "/piercing-services/screenings"
    description: "Record an anatomy screening for an appointment"
    roles: [Piercer]
    code: 201
    input: [appointment_id, piercer_id, anatomy_sites_examined, contraindication_codes, expected_appointment_version]
    output: AnatomyScreening
    side_effects: ["outcome initialized to PENDING", "increments Appointment.version by 1"]

  - method: GET
    path: "/piercing-services/screenings"
    description: "List screenings, optionally filtered by appointment or piercer"
    roles: [AnyAuthenticated]
    code: 200
    input: ["appointment_id?", "piercer_id?"]
    output: "AnatomyScreening[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/screenings/{screeningId}"
    description: "Get one screening"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: AnatomyScreening
    side_effects: []

  - method: POST
    path: "/piercing-services/screenings/{screeningId}/evaluate"
    description: "Evaluate a screening against contraindication and permitted-site rules"
    roles: [Piercer]
    code: 200
    input: []
    output: AnatomyScreening
    side_effects: ["outcome = CLEARED, REFUSED or ESCALATED", "refusal_reason_code computed via contraindication_severity_rank"]

  - method: POST
    path: "/piercing-services/screenings/{screeningId}/override"
    description: "Override an escalated screening with medical clearance"
    roles: [ComplianceOfficer]
    code: 200
    input: [medical_clearance_ref, "override_outcome?"]
    output: AnatomyScreening
    side_effects: ["outcome = CLEARED or REFUSED"]

  - method: POST
    path: "/piercing-services/screenings/{screeningId}/escalate"
    description: "Escalate a refused screening for medical review"
    roles: [Piercer]
    code: 200
    input: []
    output: AnatomyScreening
    side_effects: ["outcome = ESCALATED"]

  # --- Piercing sessions -----------------------------------------------------
  - method: POST
    path: "/piercing-services/sessions"
    description: "Open the piercing session for an appointment"
    roles: [Piercer]
    code: 201
    input: [appointment_id, piercer_id, cartridge_lot_id, site_pierced, base_fee_cents, aftercare_kit_included, solution_lot_number]
    output: PiercingSession
    side_effects: ["service_status initialized to IN_PROGRESS", "healing_status initialized to HEALING", "net_fee_cents computed via net_service_fee", "CartridgeLot.units_consumed += 1 and units_available -= 1", "Recomputes CartridgeLot.units_available via cartridge_lot_availability", "Piercer.assigned_session_count += 1", "Session is created only when no existing session for this appointment is in service_status IN_PROGRESS"]

  - method: POST
    path: "/piercing-services/sessions/fee-quote"
    description: "Quote the net service fee for a prospective service without persisting a session"
    roles: [IntakeAssociate, Piercer]
    code: 200
    input: [base_fee_cents, aftercare_kit_included, site_pierced, is_re_pierce, downgraded_sites]
    output: { net_fee_cents: integer, discount_rate: number, re_pierce_discount_cents: integer, downgrade_credited_cents: integer, surcharge_cents: integer }
    side_effects: ["Runs net_service_fee, downgrade_credit_amount and site_complexity_surcharge read-only; persists nothing"]

  - method: GET
    path: "/piercing-services/sessions"
    description: "List sessions, optionally filtered by appointment, piercer or lot"
    roles: [AnyAuthenticated]
    code: 200
    input: ["appointment_id?", "piercer_id?", "cartridge_lot_id?"]
    output: "PiercingSession[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/sessions/{sessionId}"
    description: "Get one piercing session"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: PiercingSession
    side_effects: []

  - method: GET
    path: "/piercing-services/sessions/{sessionId}/incidents"
    description: "List incident reports filed against a session"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: "IncidentReport[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/sessions/{sessionId}/healing-outcomes"
    description: "List healing outcomes recorded for a session"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: "HealingOutcome[]"
    side_effects: []

  - method: POST
    path: "/piercing-services/sessions/{sessionId}/healing-assessment"
    description: "Record a healing assessment for the session"
    roles: [Piercer]
    code: 200
    input: [assessed_at, failure_codes]
    output: PiercingSession
    side_effects: ["healing_status = HEALED or FAILED", "HealingOutcome updated", "IncidentReport created on failure"]

  - method: POST
    path: "/piercing-services/sessions/{sessionId}/re-pierce"
    description: "Re-pierce a healed-but-failed site under the re-pierce policy"
    roles: [Piercer]
    code: 200
    input: []
    output: PiercingSession
    side_effects: ["healing_status = HEALING", "HealingOutcome.status = RE_PIERCED", "CartridgeLot.units_consumed += 1", "net_fee_cents recomputed with the re-pierce discount"]

  - method: POST
    path: "/piercing-services/sessions/{sessionId}/downgrade"
    description: "Downgrade a healed site to a lower-complexity site"
    roles: [Piercer]
    code: 200
    input: [downgraded_sites]
    output: PiercingSession
    side_effects: ["healing_status = RE_PIERCED", "HealingOutcome.downgrade_credited_cents computed", "Customer.aftercare_credit_cents += downgrade_credited_cents"]

  - method: POST
    path: "/piercing-services/sessions/{sessionId}/follow-up/acknowledge"
    description: "Acknowledge the aftercare follow-up reminder"
    roles: [Customer]
    code: 200
    input: []
    output: PiercingSession
    side_effects: ["follow_up_acknowledged = true"]

  # --- Incidents -------------------------------------------------------------
  - method: POST
    path: "/piercing-services/incidents"
    description: "File an adverse-reaction incident report"
    roles: [ComplianceOfficer]
    code: 201
    input: [session_id, reported_at, severity, reaction_codes, expected_session_version]
    output: IncidentReport
    side_effects: ["escalation_status initialized to LOGGED", "increments PiercingSession.version by 1"]

  - method: GET
    path: "/piercing-services/incidents"
    description: "List incident reports, optionally filtered by session or store"
    roles: [AnyAuthenticated]
    code: 200
    input: ["session_id?", "store_location_id?"]
    output: "IncidentReport[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/incidents/{incidentId}"
    description: "Get one incident report"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: POST
    path: "/piercing-services/incidents/{incidentId}/triage"
    description: "Triage an incident and compute the provisional refund"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["escalation_status = TRIAGED", "refund_amount_cents computed via incident_refund_allocation provisional variant", "refund_status = PENDING"]

  - method: POST
    path: "/piercing-services/incidents/{incidentId}/escalate"
    description: "Escalate an incident and cascade its session into healing failure"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["escalation_status = ESCALATED", "Cascades PiercingSession.healing_status to FAILED", "Recomputes StoreLocation.open_incident_count and compliance_posture"]

  - method: POST
    path: "/piercing-services/incidents/{incidentId}/resolve"
    description: "Resolve an incident and finalize the refund"
    roles: [ComplianceOfficer]
    code: 200
    input: [resolution_note]
    output: IncidentReport
    side_effects: ["escalation_status = RESOLVED", "refund_amount_cents recomputed via incident_refund_allocation final variant"]

  - method: POST
    path: "/piercing-services/incidents/{incidentId}/issue-refund"
    description: "Settle the incident refund; an explicit requested amount above the computed cap is rejected"
    roles: [StoreManager]
    code: 200
    input: [refund_destination, "requested_refund_cents?"]
    output: IncidentReport
    side_effects: ["escalation_status = REFUND_ISSUED", "refund_status = SETTLED", "Customer.refunded_cents and retained_cents updated"]

  - method: POST
    path: "/piercing-services/incidents/{incidentId}/reopen"
    description: "Reopen a resolved incident inside the reopen window"
    roles: [ComplianceOfficer]
    code: 200
    input: [reopen_reason]
    output: IncidentReport
    side_effects: ["escalation_status = REOPENED"]

  # --- Healing outcomes ------------------------------------------------------
  - method: POST
    path: "/piercing-services/healing-outcomes"
    description: "Create a healing outcome record for a session"
    roles: [Piercer]
    code: 201
    input: [session_id, assessed_at, expected_session_version]
    output: HealingOutcome
    side_effects: ["status initialized to ASSESSED", "increments PiercingSession.version by 1"]

  - method: GET
    path: "/piercing-services/healing-outcomes"
    description: "List healing outcomes, optionally filtered by session"
    roles: [AnyAuthenticated]
    code: 200
    input: ["session_id?"]
    output: "HealingOutcome[]"
    side_effects: []

  - method: GET
    path: "/piercing-services/healing-outcomes/{outcomeId}"
    description: "Get one healing outcome"
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: HealingOutcome
    side_effects: []

  - method: POST
    path: "/piercing-services/healing-outcomes/{outcomeId}/downgrade"
    description: "Downgrade a healed site and credit the customer"
    roles: [Piercer]
    code: 200
    input: [downgraded_sites]
    output: HealingOutcome
    side_effects: ["status = DOWNGRADED", "downgrade_credited_cents computed via downgrade_credit_amount", "Customer.aftercare_credit_cents incremented"]

  - method: POST
    path: "/piercing-services/healing-outcomes/{outcomeId}/claim-re-pierce"
    description: "Claim the re-pierce entitlement"
    roles: [Piercer]
    code: 200
    input: []
    output: HealingOutcome
    side_effects: ["status = RE_PIERCED", "re_pierce_claim_count = 1", "re_pierce_eligible = false"]

  - method: POST
    path: "/piercing-services/healing-outcomes/{outcomeId}/close"
    description: "Close a healing outcome"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: HealingOutcome
    side_effects: ["status = CLOSED"]

  # --- Test-driving endpoints ------------------------------------------------
  - method: POST
    path: "/piercing-services/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ComplianceOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Logical clock set; drives recertification windows, consent expiry, follow-up reminders and no-show detection"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & authorization ---------------------------------------
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or malformed"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "The acting role is not permitted for the requested operation"

  # --- Not found -------------------------------------------------------------
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Generic resource not found"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "Jurisdiction profile not found"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "Store location not found"
  - id: ERR_PIERCER_NOT_FOUND
    http: 404
    condition: "Piercer not found"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "Certification record not found"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Customer not found"
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "Consent record not found"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "Appointment not found"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "Anatomy screening not found"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Piercing session not found"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "Incident report not found"
  - id: ERR_HEALING_OUTCOME_NOT_FOUND
    http: 404
    condition: "Healing outcome not found"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "Sterilization cycle not found"
  - id: ERR_CARTRIDGE_LOT_NOT_FOUND
    http: 404
    condition: "Cartridge lot not found"

  # --- State errors ----------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a state from which the requested transition is declared"
  - id: ERR_SCREENING_ALREADY_EVALUATED
    http: 409
    condition: "The screening already carries a terminal outcome and cannot be re-evaluated"
  - id: ERR_SCREENING_NOT_CLEARED
    http: 409
    condition: "Service attempted while Appointment.governing_screening_id resolves to null or a screening whose outcome is not CLEARED"
  - id: ERR_STORE_POSTURE_BLOCKS_SERVICE
    http: 409
    condition: "Service attempted at a store whose compliance_posture is RESTRICTED or FROZEN"
  - id: ERR_PIERCER_SESSION_IN_PROGRESS
    http: 409
    condition: "The piercer already holds a session in service_status IN_PROGRESS"
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "The appointment has already been rescheduled twice"
  - id: ERR_CERTIFICATION_RECERT_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "The certification has consumed three recertification practical attempts"
  - id: ERR_AUTOCLAVE_CYCLE_OVERLAP
    http: 409
    condition: "The new cycle's closed interval [cycle_start_at, cycle_end_at] overlaps an existing cycle on the same autoclave unit"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "The new half-open slot overlaps another non-cancelled appointment for the same store and piercer"
  - id: ERR_STORE_ROOM_CAPACITY_EXCEEDED
    http: 409
    condition: "Concurrently-occupied slots at the store would exceed piercing_room_count"

  # --- Compliance and safety errors -----------------------------------------
  - id: ERR_AGE_BELOW_JURISDICTION_MINIMUM
    http: 422
    condition: "The customer's age falls below the jurisdiction's consent or absolute age floor"
  - id: ERR_MEDICAL_CONTRAINDICATION
    http: 422
    condition: "A contraindication code requires refusal or escalation and cannot clear"
  - id: ERR_SITE_NOT_PERMITTED_IN_JURISDICTION
    http: 422
    condition: "The requested or pierced site is not in the jurisdiction's permitted_sites for this consent class"
  - id: ERR_GUARDIAN_VERIFICATION_REQUIRED
    http: 422
    condition: "Guardian verification is not VERIFIED, or a notarized consent is used where guardian presence is mandated"
  - id: ERR_IDENTIFICATION_TYPE_MISMATCH
    http: 422
    condition: "The presented identification type does not match required_identification_type"
  - id: ERR_PIERCER_NOT_CERTIFIED
    http: 422
    condition: "The assigned piercer holds no certification whose status is VALID and whose protocol matches the store's"
  - id: ERR_CARTRIDGE_LOT_UNAVAILABLE
    http: 422
    condition: "The cartridge lot is quarantined, discarded, depleted, expired, or bound to a non-released cycle"
  - id: ERR_AFTERCARE_KIT_REQUIRED
    http: 422
    condition: "The jurisdiction mandates an aftercare kit (record_retention_years >= 5) and the session did not include one"
  - id: ERR_RE_PIERCE_NOT_ELIGIBLE
    http: 422
    condition: "No unconsumed re-pierce entitlement exists for the session"

  # --- Fiscal and concurrency errors ----------------------------------------
  - id: ERR_REFUND_EXCEEDS_ALLOWABLE
    http: 422
    condition: "The requested refund exceeds gross fee minus the retain floor, or exceeds the session's net fee"
  - id: ERR_INSUFFICIENT_AFTERCARE_CREDIT
    http: 402
    condition: "The aftercare credit redemption exceeds the customer's available credit"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_<parent>_version does not equal the parent row's current version"

  # --- Request shape errors --------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required field is absent, malformed, or violates a declared constraint"
  - id: ERR_FOLLOW_UP_NOT_DUE
    http: 409
    condition: "The aftercare follow-up reminder is acknowledged before it is due or after its seven-day window closed"
  - id: ERR_NOT_CERTIFICATION_OWNER
    http: 403
    condition: "A recertification was submitted by a piercer other than the certification owner"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeAssociate
    description: "Front-of-store intake staff who capture customers, consents and appointments."
    identity: opaque
    exclusive_operations:
      - "POST/piercing-services/customers"
      - "POST/piercing-services/consents"
      - "POST/piercing-services/consents/{id}/verify"
      - "POST/piercing-services/consents/{id}/reject"
      - "POST/piercing-services/consents/{id}/renew"
      - "POST/piercing-services/consents/{id}/guardian-verification"
      - "POST/piercing-services/appointments"
      - "POST/piercing-services/appointments/{id}/confirm"
      - "POST/piercing-services/appointments/{id}/check-in"
      - "POST/piercing-services/appointments/{id}/reschedule"
      - "POST/piercing-services/appointments/{id}/cancel"
      - "POST/piercing-services/customers/{id}/credit-redemptions"
    shared_operations: []

  - name: Piercer
    description: "Licensed piercer who screens anatomy, performs services and assesses healing."
    identity: "entity_backed:Piercer"
    exclusive_operations:
      - "POST/piercing-services/appointments/{id}/screen"
      - "POST/piercing-services/appointments/{id}/start-service"
      - "POST/piercing-services/appointments/{id}/refuse"
      - "POST/piercing-services/appointments/{id}/complete"
      - "POST/piercing-services/appointments/{id}/abort"
      - "POST/piercing-services/screenings"
      - "POST/piercing-services/screenings/{id}/evaluate"
      - "POST/piercing-services/screenings/{id}/escalate"
      - "POST/piercing-services/sessions"
      - "POST/piercing-services/sessions/{id}/healing-assessment"
      - "POST/piercing-services/sessions/{id}/re-pierce"
      - "POST/piercing-services/sessions/{id}/downgrade"
      - "POST/piercing-services/healing-outcomes"
      - "POST/piercing-services/healing-outcomes/{id}/downgrade"
      - "POST/piercing-services/healing-outcomes/{id}/claim-re-pierce"
      - "POST/piercing-services/certifications/{id}/recertify"
    shared_operations: []

  - name: StoreManager
    description: "Store manager who owns piercer roster and refund settlement."
    identity: opaque
    exclusive_operations:
      - "POST/piercing-services/piercers"
      - "POST/piercing-services/piercers/{id}/reinstate"
      - "POST/piercing-services/piercers/{id}/deactivate"
      - "POST/piercing-services/cartridge-lots"
      - "POST/piercing-services/incidents/{id}/issue-refund"
    shared_operations: []

  - name: ComplianceOfficer
    description: "Compliance officer who owns jurisdictional rules, posture gating and incident escalation."
    identity: opaque
    exclusive_operations:
      - "POST/piercing-services/jurisdictions"
      - "POST/piercing-services/jurisdictions/{id}/supersede"
      - "POST/piercing-services/certifications"
      - "POST/piercing-services/certifications/{id}/revoke"
      - "POST/piercing-services/stores"
      - "POST/piercing-services/stores/{id}/posture/freeze"
      - "POST/piercing-services/stores/{id}/posture/unfreeze"
