        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_NOTICE_PERIOD_VIOLATED
        distinguishing_aspect: "scheduled_for at current_utc + 13 days fails ERR_NOTICE_PERIOD_VIOLATED (boundary at +14)."
        test_recipe:
          setup:
            - "ForeclosureCase in MEDIATION_REQUIRED; clock at 2025-11-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
