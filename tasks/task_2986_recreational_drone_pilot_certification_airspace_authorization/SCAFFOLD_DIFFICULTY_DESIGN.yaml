# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2986 - Recreational Drone Pilot Certification & Airspace Authorization
#
# Nine rule_ids from §0.5, 21 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1-§1.7 and is driven from an empty database by the ordered setup_api_calls
# chain below it. The logical clock starts at 2026-08-01T00:00:00Z; every chain
# that cares about time moves it forward explicitly and never backwards.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: currency_expiry_recreational_basis_versus_commercial_basis
        grounds:
          - calculations.pilot_currency_expiry
          - entities.Pilot.fields.currency_expires_at
          - entities.Pilot.fields.currency_basis
          - entities.Pilot.fields.last_completed_flight_end
          - entities.Certification.fields.issued_at
        distinguishing_aspect: |
          Pilot-domain variant pair: on one certificate issued 2026-02-01T00:00:00Z and one
          completed flight ending 2026-03-15T12:00:00Z, RECREATIONAL_BASIS projects
          2028-02-01T00:00:00Z (24 calendar months of certificate validity) while
          COMMERCIAL_BASIS projects 2026-06-13T12:00:00Z (the 90-day recency clamp), a
          20-month divergence from byte-identical stored data.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "One COMMERCIAL pilot, CERTIFIED, whose single ACTIVE Certification was issued at 2026-02-01T00:00:00Z (so base_expiry is 2028-02-01T00:00:00Z)."
            - "That pilot has exactly one COMPLETED flight whose actual_end is 2026-03-15T12:00:00Z, so last_completed_flight_end is 2026-03-15T12:00:00Z and recency_expiry is 2026-06-13T12:00:00Z."
            - "The flight was flown RECREATIONAL in an uncontrolled class G zone with a 249 g airframe, so no insurance policy, authorization or remote-ID module participates."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 88 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Skylark Mini", serial_number: "SN-249-A", takeoff_weight_g: 249, max_altitude_ft: 1200 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-01", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "RECREATIONAL", planned_start: "2026-03-15T11:00:00Z", planned_end: "2026-03-15T12:00:00Z", planned_max_altitude_ft: 350, launch_latitude: 47.62, launch_longitude: -122.35 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T11:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/flights/${fid}/complete"
              payload: { actual_end: "2026-03-15T12:00:00Z", max_altitude_reached_ft: 320, incident_occurred: false }
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /drone-ops/pilots/${pid}/currency-projection"
              payload: { basis: "RECREATIONAL_BASIS" }
              as: ComplianceOfficer
              captures: { rec_expiry: $.data.projected_expires_at }
            - call: "GET /drone-ops/pilots/${pid}/currency-projection"
              payload: { basis: "COMMERCIAL_BASIS" }
              as: ComplianceOfficer
              captures: { com_expiry: $.data.projected_expires_at }
          assert:
            - "the RECREATIONAL_BASIS projection returns projected_expires_at == \"2028-02-01T00:00:00Z\" and basis_applied == \"RECREATIONAL_BASIS\""
            - "the COMMERCIAL_BASIS projection returns projected_expires_at == \"2026-06-13T12:00:00Z\" and basis_applied == \"COMMERCIAL_BASIS\""
            - "both projections report base_expiry == \"2028-02-01T00:00:00Z\" and recency_expiry == \"2026-06-13T12:00:00Z\" - the stored data is identical, only the variant differs"
            - "${rec_expiry} != ${com_expiry}"
            - "Pilot.${pid}.currency_expires_at == \"2026-06-13T12:00:00Z\" and Pilot.${pid}.currency_basis == \"COMMERCIAL_BASIS\" (the stored value follows operator_category)"
            - "Pilot.${pid}.last_completed_flight_end == \"2026-03-15T12:00:00Z\""
            - "both projections report lapse_due == false"

      - name: accident_provisional_reserve_versus_final_settlement
        grounds:
          - calculations.accident_settlement
          - calculations.coverage_ledger_conservation
          - entities.AccidentReport.fields.reserved_cents
          - entities.AccidentReport.fields.settlement_cents
          - entities.InsurancePolicy.fields.remaining_coverage_cents
        distinguishing_aspect: |
          Insurance-money-domain variant pair on a different entity from the currency instance:
          the same accident yields a PROVISIONAL hold of 1796294 cents at filing and a FINAL
          payout of 1021509 cents at close, because the provisional variant inflates a single
          reported figure by 1.25 and adds a flat injury reserve while the final variant
          applies per-line coinsurance, the deductible and a tier surcharge.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z with an ACTIVE InsurancePolicy: coverage_limit_cents 5000000, deductible_cents 50000, indemnification accepted, remaining_coverage_cents 5000000, settled_cents_total 0."
            - "One COMPLETED COMMERCIAL flight covered by that policy, flown 2026-08-10T09:00:00Z to 2026-08-10T10:00:00Z with incident_occurred true."
            - "No accident report has been filed yet, so open_reserved_cents_total is 0."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ivo Marek", email: "ivo.marek@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 90 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Cargo Quad 2", serial_number: "SN-249-B", takeoff_weight_g: 249, max_altitude_ft: 1500 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-02", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Skyline Mutual", policy_number: "POL-5M-01", coverage_limit_cents: 5000000, deductible_cents: 50000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", operation_category: "COMMERCIAL", planned_start: "2026-08-10T09:00:00Z", planned_end: "2026-08-10T10:00:00Z", planned_max_altitude_ft: 380, launch_latitude: 47.60, launch_longitude: -122.33 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { fid: $.data.id }
            - call: "POST /drone-ops/flights/${fid}/preflight-check"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/flights/${fid}/launch"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/flights/${fid}/complete"
              payload: { actual_end: "2026-08-10T10:00:00Z", max_altitude_reached_ft: 360, incident_occurred: true, incident_summary: "Hard landing, propeller strike on gravel apron." }
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fid}", occurred_at: "2026-08-10T09:45:00Z", injury_level: "MINOR", reported_property_damage_cents: 1237035, narrative: "Propeller strike during landing; one bystander treated for a minor laceration." }
              as: InvestigationOfficer
              as_user_id: "inv-01"
              captures: { arid: $.data.id, prov_reserve: $.data.reserved_cents }
            - call: "POST /drone-ops/accident-reports/${arid}/open-investigation"
              payload: {}
              as: InvestigationOfficer
              as_user_id: "inv-01"
            - call: "POST /drone-ops/accident-reports/${arid}/close"
              payload: { damage_line_items: [{ label: "Airframe", amount_cents: 412345 }, { label: "Payload", amount_cents: 412345 }, { label: "Third-party property", amount_cents: 412345 }], probable_cause: "Late flare on approach in gusting crosswind." }
              as: InvestigationOfficer
              as_user_id: "inv-01"
              captures: { final_settlement: $.data.settlement_cents }
          assert:
            - "${prov_reserve} == 1796294 (round_half_up(1237035 * 1.25) = 1546294 plus the MINOR injury reserve 250000)"
            - "immediately after filing, InsurancePolicy.${polid}.remaining_coverage_cents == 3203706 and open_reserved_cents_total == 1796294 and coverage_status == \"ACTIVE\""
            - "${final_settlement} == 1021509 (per-line 350493 x 3 = 1051479, minus deductible 50000 = 1001479, plus 2% tier surcharge 20030)"
            - "${prov_reserve} != ${final_settlement} - the same accident produces two different cent figures"
            - "after close, AccidentReport.${arid}.reserved_cents == 0 and AccidentReport.${arid}.status == \"CLOSED\""
            - "after close, InsurancePolicy.${polid}.settled_cents_total == 1021509, open_reserved_cents_total == 0 and remaining_coverage_cents == 3978491"
            - "5000000 == 3978491 + 0 + 1021509 (calculations.coverage_ledger_conservation holds)"
            - "Flight.${fid}.investigation_status == \"CLOSED\" and Flight.${fid}.status == \"COMPLETED\""

  - rule_id: combinatorial_formula
    instances:
      - name: authorization_ceiling_nested_min_max_over_four_competing_caps
        grounds:
          - calculations.authorization_altitude_ceiling
          - entities.AirspaceAuthorization.fields.granted_ceiling_ft
          - entities.AirspaceZone.fields.structure_relief_eligible
          - entities.Waiver.fields.granted_ceiling_ft
          - validations.priority_26
          - endpoints.POST_/drone-ops/airspace-authorizations/{id}/decide
        distinguishing_aspect: |
          Mode (a) - a single expression combining four independent inputs non-linearly:
          min(requested, class_cap, aircraft_cap, max(waiver_cap, category_cap)). The nested
          max inside the min means the result is not monotone in any one input taken alone:
          holding the request at 700 ft, the answer is 600 without a waiver and 700 with one,
          and dropping the request to 550 makes the request itself the binding term while both
          caps stay unchanged. Three approvals on one zone therefore yield 600 / 700 / 550.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One COMMERCIAL pilot, CERTIFIED, with an ACTIVE indemnified InsurancePolicy of 8000000 cents covering 2026-08-01T00:00:00Z .. 2027-08-01T00:00:00Z."
            - "One REGISTERED 249 g aircraft with max_altitude_ft 900 (so remote_id_required is false)."
            - "One class D zone: class_ceiling_ft 700, requires_authorization true, structure_relief_eligible true, max_concurrent_authorizations 2."
            - "One APPROVED BVLOS Waiver on that pilot and aircraft with granted_ceiling_ft 1000 and valid_until 2027-02-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Nadia Frost", email: "nadia.frost@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 91 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Vector 900", serial_number: "SN-CEIL-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Skyline Mutual", policy_number: "POL-CEIL-01", coverage_limit_cents: 8000000, deductible_cents: 50000, effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-D-CEIL", class_code: "D", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 2, structure_relief_eligible: true }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pv: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "BVLOS", requested_ceiling_ft: 1000, operation_description: "Linear infrastructure survey beyond visual line of sight along a rail corridor.", expected_pilot_version: "${pv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wid: $.data.id }
            - call: "POST /drone-ops/waivers/${wid}/safety-cases"
              payload: { mitigation_summary: "Two visual observers, corridor closed to public access, parachute recovery fitted.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Lost-link returns to home at 200 ft; observers hold the corridor until recovery." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { scid: $.data.id }
            - call: "POST /drone-ops/waivers/${wid}/submit"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
            - call: "POST /drone-ops/waivers/${wid}/begin-review"
              payload: {}
              as: SafetyReviewer
              as_user_id: "rev-01"
            - call: "POST /drone-ops/waivers/${wid}/clear-safety-case"
              payload: { reviewer_findings: "Mitigations adequate for SAIL 4." }
              as: SafetyReviewer
              as_user_id: "rev-01"
            - call: "POST /drone-ops/waivers/${wid}/decide"
              payload: { decision: "APPROVE", granted_ceiling_ft: 1000 }
              as: WaiverApprover
              as_user_id: "app-01"
              captures: { wvalid: $.data.valid_until }
          trigger:
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv1: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", requested_ceiling_ft: 700, window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z", expected_zone_version: "${zv1}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { a1: $.data.id }
            - call: "POST /drone-ops/airspace-authorizations/${a1}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-01"
              captures: { g1: $.data.granted_ceiling_ft }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv2: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", waiver_id: "${wid}", requested_ceiling_ft: 700, window_start: "2026-08-21T09:00:00Z", window_end: "2026-08-21T11:00:00Z", expected_zone_version: "${zv2}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { a2: $.data.id }
            - call: "POST /drone-ops/airspace-authorizations/${a2}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-01"
              captures: { g2: $.data.granted_ceiling_ft }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv3: $.data.version }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", zone_id: "${zid}", waiver_id: "${wid}", requested_ceiling_ft: 550, window_start: "2026-08-22T09:00:00Z", window_end: "2026-08-22T11:00:00Z", expected_zone_version: "${zv3}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { a3: $.data.id }
            - call: "POST /drone-ops/airspace-authorizations/${a3}/decide"
              payload: { decision: "APPROVE" }
              as: AirspaceAuthority
              as_user_id: "aa-01"
              captures: { g3: $.data.granted_ceiling_ft }
          assert:
            - "SafetyCase.${scid}.sail_level == 4 (ground_risk_class 2 + ARC_B index 1 + BVLOS uplift 1)"
            - "${wvalid} == \"2027-02-01T00:00:00Z\" (2026-08-05T00:00:00Z + 180 days), which is strictly after every authorization window_end below"
            - "${g1} == 600 - no waiver cited, so waiver_cap is BASE_CEILING_FT 400 and category_cap is 400 + 200 structure relief; min(700, 700, 900, max(400, 600)) == 600"
            - "${g2} == 700 - identical request, but the APPROVED BVLOS waiver lifts waiver_cap to 1000; min(700, 700, 900, max(1000, 600)) == 700"
            - "${g3} == 550 - same waiver, smaller request; min(550, 700, 900, max(1000, 600)) == 550"
            - "${g1} != ${g2} on byte-identical requested_ceiling_ft, class_ceiling_ft and max_altitude_ft - only the nested max term moved"
            - "a naive implementation that adds the relief terms (400 + 200 + 1000) or that takes min(requested, class_cap, aircraft_cap, waiver_cap) without the inner max returns 700 for the first authorization instead of 600"
            - "all three authorizations end in status \"APPROVED\" and AirspaceZone.${zid}.reserved_slot_count == 3"

      - name: accident_final_settlement_per_line_rounding_then_pre_surcharge_tier
        grounds:
          - calculations.accident_settlement
          - entities.AccidentReport.fields.damage_line_items
          - entities.AccidentReport.fields.settlement_cents
          - entities.InsurancePolicy.fields.remaining_coverage_cents
          - endpoints.POST_/drone-ops/accident-reports/{id}/close
        distinguishing_aspect: |
          Modes (b) and (c) in one expression, and neither appears in the ceiling instance:
          (b) the two damage lines 1100010 and 1265630 each land on an exact half cent at
          COINSURANCE_RATE 0.85, so rounding per line then summing gives 2010795 while summing
          then rounding once gives 2010794; (c) the surcharge tier is selected from the
          pre-surcharge net 1960795 - which sits just below SURCHARGE_TIER2_MAX_CENTS - even
          though adding the resulting surcharge pushes the total past that same boundary, so a
          plausible reading that re-derives the tier from the finished total returns 2058835
          instead of 2000011.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-08-05T00:00:00Z with an ACTIVE indemnified InsurancePolicy: coverage_limit_cents 8000000, deductible_cents 50000, settled_cents_total 0, remaining_coverage_cents 8000000."
            - "One COMPLETED COMMERCIAL flight covered by that policy, flown 2026-08-10T09:00:00Z .. 2026-08-10T10:00:00Z with incident_occurred true, in an uncontrolled class G zone with a 249 g airframe."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Owen Salt", email: "owen.salt@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 70 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Hauler 8", serial_number: "SN-ROUND-01", takeoff_weight_g: 249, max_altitude_ft: 1200 }
              as: Pilot
