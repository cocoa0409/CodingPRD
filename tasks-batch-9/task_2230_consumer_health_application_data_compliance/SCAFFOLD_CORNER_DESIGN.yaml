            - call: "POST /health-data/geofence-zones"
              payload: { app_product_id: "${prod_id}", zone_name: "Reproductive Health Center", state_code: "CT", facility_kind: "SENSITIVE_HEALTH", center_label: "Elm Street clinic", radius_meters: 301 }
              as: PlatformAdmin
