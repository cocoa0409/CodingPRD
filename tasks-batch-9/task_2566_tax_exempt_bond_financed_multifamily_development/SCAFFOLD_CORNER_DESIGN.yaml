      - name: project_read_is_shared_by_the_sponsor_the_two_agency_desks_and_the_trustee_with_identical_bodies
        claim_type: role_shared_operation
        grounds:
          - roles.Developer.shared_operations
          - roles.HfaAllocationOfficer.shared_operations
          - roles.HfaComplianceOfficer.shared_operations
          - roles.BondTrustee.shared_operations
          - endpoints[GET /projects/{id}].roles
          - endpoints[GET /projects].roles
        distinguishing_aspect: |
          The positive half of the RBAC surface, which denial sweeps never prove:
          GET /projects/{id} appears in four different roles' shared_operations, and
          all four must receive the same body - no role-dependent field masking, no
          sponsor-scoped filtering on a read the trustee is also entitled to. The
