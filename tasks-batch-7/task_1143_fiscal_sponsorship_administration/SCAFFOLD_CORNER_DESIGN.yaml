            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_sj }
            - { call: "POST /fsa/projects/${p}/exit-plans", payload: { successor_entity_name: "X", successor_ein: "11-1111111", reason: "r" }, as: ProjectLead, as_user_id: "${p}", captures: { ep: $.data.id } }
            - { call: "POST /fsa/exit-plans/${ep}/begin-due-diligence", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1 }
          trigger:
            - { call: "POST /fsa/exit-plans/${ep}/signoff", payload: { party: "SPONSOR_BOARD" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { st1: $.data.status } }
            - { call: "POST /fsa/exit-plans/${ep}/signoff", payload: { party: "SPONSOR_BOARD" }, as: SponsorAdmin, as_user_id: user_sa_2, captures: { e1: $.data.error_id } }
            - { call: "POST /fsa/exit-plans/${ep}/signoff", payload: { party: "SUCCESSOR_REP" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e2: $.data.error_id } }
            - { call: "POST /fsa/exit-plans/${ep}/signoff", payload: { party: "PROJECT_LEAD" }, as: ProjectLead, as_user_id: "${p}", captures: { st2: $.data.status } }
            - { call: "POST /fsa/exit-plans/${ep}/signoff", payload: { party: "SUCCESSOR_REP" }, as: SponsorAdmin, as_user_id: user_sa_2, captures: { st3: $.data.status } }
          assert:
            - "st1 == DUE_DILIGENCE after first signoff (join not complete)"
            - "e1 == ERR_SIGNOFF_PARTY_REPEATED (same party twice, even by a different signer)"
            - "e2 == ERR_SIGNER_REUSED (user_sa_1 already signed as SPONSOR_BOARD)"
            - "st2 == DUE_DILIGENCE after two distinct parties; st3 == APPROVED at the third distinct party"

