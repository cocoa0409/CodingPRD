        distinguishing_aspect: "A RESTRICTED producer's NORMAL animal is invisible to StateAnimalHealthOfficial and to FederalTraceAnalyst (403), visible to its own producer and to ProgramAdmin; once the animal is TRACE_HIT the state official may read it."
        test_recipe:
          setup:
            - "Producer R has privacy_level RESTRICTED, one ACTIVE premises and one animal with trace_status NORMAL."
            - "No trace request references the animal yet."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Restricted Ranch", contact_email: "ops@restricted.example", state_code: "CO", privacy_level: "RESTRICTED" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_pv: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_pv}", pin: "COV0001", operation_type: "COW_CALF", state_code: "CO", capacity: 10 }
              as: Producer
              as_user_id: "${prod_pv}"
              captures: { ppv: $.data.id }
            - call: "POST /premises/${ppv}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-co-1"
