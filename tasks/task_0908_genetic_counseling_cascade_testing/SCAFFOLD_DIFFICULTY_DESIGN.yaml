            - { call: "POST /test-orders", payload: { counseling_case_id: "${case1}", lab_id: "${lid}", panel_name: "P1", list_price_cents: 200000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-20T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order1: $.data.id } }
