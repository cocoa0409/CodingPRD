              as: TerminalAdmin
              captures: { g_aurora: $.data.id }
            - call: "GET /exclusivity-grants/${g_aurora}"
              as: StockController
            - call: "GET /brands"
              payload: { category: "LIQUOR", status: "ACTIVE" }
              as: TerminalAdmin
          assert:
            - "Brand.${b_aurora}.name == Aurora Spirits and category == LIQUOR"
            - "Brand.${b_aurora}.status == ACTIVE and suspended_at == null"
            - "AllowanceRule.${ar_au}.allowance_units == 10 and advisory_text is byte-identical to the input string"
            - "AllowanceRule.${ar_au}.status == ACTIVE and superseded_at == null"
            - "ExclusivityGrant.${g_aurora}.scope == CATEGORY_PREFERRED and status == ACTIVE and revoked_at == null"
            - "ExclusivityGrant.${g_aurora}.effective_from == 2026-08-01T00:00:00Z and effective_to == 2026-12-01T00:00:00Z"
            - "the filtered brand list returns exactly one row, ${b_aurora}"

      - name: the_logical_clock_starts_at_the_mandated_default_and_stamps_every_write
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Before any clock call the logical time MUST already be exactly 2026-08-01T00:00:00Z - not
          real wall-clock time - and that instant MUST be the created_at of the first write. Every
          later write is stamped from the logical clock, so two entities created after the same
          advance share an identical created_at. An implementation that falls back to
          datetime.now() makes every temporal assertion in this benchmark unreproducible.
        test_recipe:
          setup:
            - "An empty database with the clock untouched"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:30:00Z" }
              as: TerminalAdmin
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /brands"
              payload: { name: "Embassy Cigars", category: "TOBACCO" }
              as: TerminalAdmin
              captures: { b_emb: $.data.id }
            - call: "POST /brands/${b_aurora}/suspend"
              payload: {}
              as: TerminalAdmin
          assert:
            - "Terminal.${t_sin}.created_at == 2026-08-01T00:00:00Z - the untouched startup default"
            - "the clock call returns current_utc == 2026-08-15T06:30:00Z inside the data key"
            - "Brand.${b_aurora}.created_at == 2026-08-15T06:30:00Z"
            - "Brand.${b_emb}.created_at == 2026-08-15T06:30:00Z - identical, because the clock did not move between the two writes"
            - "Brand.${b_aurora}.suspended_at == 2026-08-15T06:30:00Z and status == SUSPENDED"
            - "Brand.${b_emb}.status == ACTIVE - suspension is per brand, not per category"

  # =====================================================================
  # SECTION 6 - From Table 6 (Errors): every error_id must be triggerable.
  # The instances below close out the error ids that no other section
  # already provokes.
  # =====================================================================
  - section: errors
    instances:
      - name: each_remaining_aggregate_read_returns_its_own_entity_specific_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_BRAND_NOT_FOUND
          - errors.ERR_GRANT_NOT_FOUND
          - errors.ERR_ALLOWANCE_RULE_NOT_FOUND
          - errors.ERR_MOVEMENT_NOT_FOUND
          - errors.ERR_ITINERARY_NOT_FOUND
          - errors.ERR_SALE_LINE_NOT_FOUND
          - errors.ERR_SEALED_BAG_NOT_FOUND
          - errors.ERR_PRE_ORDER_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: |
          Nine distinct 404 ids exist and each MUST be returned by its OWN aggregate's read - a
          shared generic ERR_NOT_FOUND, or reusing ERR_TERMINAL_NOT_FOUND everywhere, fails. The
          database is deliberately non-empty (one terminal exists) so a blanket "empty DB" answer
          cannot masquerade as correct behaviour.
        test_recipe:
          setup:
            - "Exactly one Terminal exists; no brand, grant, allowance rule, movement, itinerary, sale line, sealed bag, pre-order or agreement has ever been created"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
          trigger:
            - call: "GET /brands/00000000-0000-0000-0000-0000000000b1"
              as: TerminalAdmin
            - call: "GET /exclusivity-grants/00000000-0000-0000-0000-0000000000g1"
              as: TerminalAdmin
            - call: "GET /allowance-rules/00000000-0000-0000-0000-0000000000a1"
              as: Passenger
            - call: "GET /bonded-movements/00000000-0000-0000-0000-0000000000m1"
              as: StockController
            - call: "GET /itineraries/00000000-0000-0000-0000-0000000000i1"
              as: SalesAssociate
            - call: "GET /sale-lines/00000000-0000-0000-0000-0000000000l1"
              as: SalesAssociate
            - call: "GET /sealed-bags/00000000-0000-0000-0000-0000000000s1"
              as: SalesAssociate
            - call: "GET /pre-orders/00000000-0000-0000-0000-0000000000p1"
              as: StockController
            - call: "GET /concession-agreements/00000000-0000-0000-0000-0000000000c1"
              as: TerminalAdmin
          assert:
            - "the brand read returns HTTP 404 with error_id ERR_BRAND_NOT_FOUND"
            - "the exclusivity-grant read returns HTTP 404 with error_id ERR_GRANT_NOT_FOUND"
            - "the allowance-rule read returns HTTP 404 with error_id ERR_ALLOWANCE_RULE_NOT_FOUND"
            - "the bonded-movement read returns HTTP 404 with error_id ERR_MOVEMENT_NOT_FOUND"
            - "the itinerary read returns HTTP 404 with error_id ERR_ITINERARY_NOT_FOUND"
            - "the sale-line read returns HTTP 404 with error_id ERR_SALE_LINE_NOT_FOUND"
            - "the sealed-bag read returns HTTP 404 with error_id ERR_SEALED_BAG_NOT_FOUND"
            - "the pre-order read returns HTTP 404 with error_id ERR_PRE_ORDER_NOT_FOUND"
            - "the concession-agreement read returns HTTP 404 with error_id ERR_AGREEMENT_NOT_FOUND"
            - "every one of the nine responses carries data null and a non-empty message"
            - "GET /terminals/${t_sin} still returns HTTP 200 - the failures did not poison the session"

      - name: duplicate_boarding_pass_and_seal_number_are_rejected_at_their_scoped_unique_keys
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_BOARDING_PASS
          - errors.ERR_DUPLICATE_SEAL_NUMBER
          - validations[priority=46]
          - validations[priority=50]
        distinguishing_aspect: |
          boarding_pass_barcode is globally unique across PassengerItinerary and seal_number is
          globally unique across SealedBag. Both MUST be enforced on the second write with the
          aggregate's own 409 id, and the first record MUST remain untouched. Reusing a seal number
          across two different sales is exactly how physically swapped bags enter the audit trail.
        test_recipe:
