              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004353", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-16", suspect_part_number: 1501, region_code: "NE", sale_status: "SOLD", owner_name: "Ben Ito" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh2_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004354", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-17", suspect_part_number: 1502, region_code: "NE", sale_status: "SOLD", owner_name: "Cara Lu" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh3_id: $.data.id }
            - call: "POST /vehicles"
