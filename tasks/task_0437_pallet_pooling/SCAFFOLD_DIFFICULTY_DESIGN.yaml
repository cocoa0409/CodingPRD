              as: PoolOperator
              captures: { t1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "T2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { t2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "T3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${a_id}" }
              as: PoolOperator
              captures: { t3: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${a_id}", to_location_id: "${b_id}", kind: "TRANSFER", asset_ids: ["${t1}","${t2}","${t3}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
          trigger:
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
            - call: "GET /assets/${t1}"
              payload: {}
              as: PoolOperator
              captures: { cond1: $.data.condition }
            - call: "GET /locations/${a_id}"
