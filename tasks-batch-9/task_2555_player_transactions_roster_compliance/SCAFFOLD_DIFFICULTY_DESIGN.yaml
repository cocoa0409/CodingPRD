  - rule_id: cross_entity_state_dependency
    instances:
      - name: signing_approval_depends_on_unexpired_physical_exam_state
        grounds:
          - validations[priority=17]
          - errors[ERR_PHYSICAL_NOT_PASSED]
          - calculations.physical_validity
          - entities.PhysicalExam.fields.expires_at
          - entities.Transaction.fields.requires_physical
          - state_machines.Transaction.FILED_to_APPROVED
        distinguishing_aspect: |
          The dependent pair is Transaction -> PhysicalExam: the filing is impeccable in its
          own right (FILED, inside the window, club COMPLIANT, cap fine) and is rejected purely
          because the other entity's expires_at 2026-08-24T14:00:00Z is no longer strictly
          greater than the logical clock.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Club Harbor Kings (cap 500000000) with Ray Alder's 3-year SIGNING filing FILED (requires_physical true) and an ENTRY_PHYSICAL recorded PASSED at performed_at 2026-08-10T14:00:00Z, so expires_at is 2026-08-24T14:00:00Z."
            - "Logical clock advanced to exactly 2026-08-24T14:00:00Z — equal to expires_at, which the strict citability test excludes."
            - "No compliance sweep has run, so the exam row is still PASSED rather than EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn1_id: $.data.id, c1_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${txn1_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex1_id: $.data.id }
            - call: "POST /physical-exams/${ex1_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex1_expires: $.data.expires_at }
            - call: "POST /transactions/${txn1_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T14:00:00Z" }
              as: LeagueOfficer
          trigger:
            - call: "POST /transactions/${txn1_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
              captures: { err_id5: $.data.error_id }
          assert:
            - "the captured ${err_id5} == ERR_PHYSICAL_NOT_PASSED with HTTP 422"
            - "the captured ${ex1_expires} == 2026-08-24T14:00:00Z, exactly the logical clock"
            - "PhysicalExam.${ex1_id}.status == PASSED (still, because no sweep has run) yet it is not citable"
            - "Transaction.${txn1_id}.status == FILED and decided_at == null"
            - "Contract.${c1_id}.status == PENDING_APPROVAL"
            - "Player.${p1_id}.roster_designation == UNROSTERED and current_team_id == null"
            - "Team.${team_a_id}.active_roster_count == 0 and provisional_cap_committed_cents == 83333333"

