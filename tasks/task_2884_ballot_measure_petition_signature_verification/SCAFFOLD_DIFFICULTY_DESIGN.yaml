      - name: assignment_closed_interval_buffer_on_circulator
        grounds:
          - entities.CirculationAssignment.effective_from
          - entities.CirculationAssignment.effective_to
          - validations[priority=14]
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
          - endpoints[POST /circulation-assignments]
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the resource is the Circulator's
          own calendar and each CirculationAssignment occupies the CLOSED interval
          [effective_from, effective_to] widened by a mandatory ASSIGNMENT_BUFFER_DAYS == 3 gap on
          both sides. Adjacency is therefore FORBIDDEN — the mirror image of the cure-period rule — so
          a window starting exactly at the previous effective_to is refused, a two-day gap is still
          refused, and only a gap of exactly three days is accepted. The accepted attempt reuses the
          same expected_circulator_version as the refused ones, proving a rejected create advances
          nothing.
