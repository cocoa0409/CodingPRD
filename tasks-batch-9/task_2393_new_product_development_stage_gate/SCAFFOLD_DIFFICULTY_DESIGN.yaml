  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_check_precedes_occ_on_superseded_formulation
        grounds:
          - validations[priority 6 state ERR_<ENTITY>_INVALID_STATE]
          - validations[priority 7 concurrency ERR_FORMULATION_VERSION_CONFLICT]
          - concurrency_rules[shelf-life-study-create-stale-formulation]
        distinguishing_aspect: |
          Pairs the priority-6 state category (409) against the priority-7 concurrency category
          (412) on POST /formulations/{id}/shelf-life-studies: both are violated at
          once and the earlier rung must answer, so the response is ERR_FORMULATION_INVALID_STATE
          rather than ERR_FORMULATION_VERSION_CONFLICT.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "One BEVERAGE project in dev_status IDEA."
            - "Revision 1 of its formulation, whose version was read before it was superseded."
            - "Revision 2 created, which supersedes revision 1 and bumps revision 1's version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "State Beats OCC Probe", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { sb_id: $.data.id, sb_v1: $.data.version }
            - call: "POST /innovation-projects/${sb_id}/formulations"
              payload: { expected_project_version: "${sb_v1}", spec_summary: "Yuzu base rev A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { sb_f1_id: $.data.id, sb_f1_v1: $.data.version }
            - call: "GET /innovation-projects/${sb_id}"
              as: RnDLead
              captures: { sb_v2: $.data.version }
            - call: "POST /innovation-projects/${sb_id}/formulations"
              payload: { expected_project_version: "${sb_v2}", spec_summary: "Yuzu base rev B", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0600 }
              as: RnDLead
              captures: { sb_f2_id: $.data.id }
          trigger:
            - call: "POST /formulations/${sb_f1_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${sb_f1_v1}", duration_days: 30, committed_cost_usd: 10000.00, start_at: "2026-08-07T09:00:00Z" }
              as: RnDLead
          assert:
            - "the response is 409 with error_id ERR_FORMULATION_INVALID_STATE"
            - "the response is not 412 and not ERR_FORMULATION_VERSION_CONFLICT, even though ${sb_f1_v1} is stale"
            - "Formulation.${sb_f1_id}.status == SUPERSEDED and Formulation.${sb_f2_id}.revision == 2"
            - "GET /formulations/${sb_f1_id}/shelf-life-studies returns total_count 0"
            - "InnovationProject.${sb_id}.development_budget_committed_usd == 0.00"

      - name: occ_check_precedes_dev_budget_on_stale_formulation
        grounds:
          - validations[priority 7 concurrency ERR_FORMULATION_VERSION_CONFLICT]
          - validations[priority 13 business_fiscal ERR_DEV_BUDGET_EXCEEDED]
          - calculations.committed_development_budget
        distinguishing_aspect: |
          A different category pair from the previous instance: priority-7 concurrency (412) against
          priority-13 business_fiscal (422) on the same study-creation endpoint. The requested
          60000.00 study would push the committed ledger to 120000.00 against a 100000.00 cap, yet
          the stale expected_formulation_version answers first with ERR_FORMULATION_VERSION_CONFLICT.
        test_recipe:
          setup:
            - "Clock walked 2026-08-03 -> 2026-08-06T08:00."
            - "A BEVERAGE project with development_budget_cap_usd 100000.00."
            - "A formulation whose pilot run completed at 85.00 percent yield, committing 60000.00."
            - "The formulation version read after the run, so ${ob_f_v} - 1 is provably stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Akron Pilot", line_code: "AKR-2", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 800.00 }
              as: PortfolioAdmin
              captures: { ob_pl_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "OCC Beats Budget Probe", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { ob_id: $.data.id, ob_v1: $.data.version }
            - call: "POST /innovation-projects/${ob_id}/formulations"
              payload: { expected_project_version: "${ob_v1}", spec_summary: "Yuzu base rev A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { ob_f_id: $.data.id }
            - call: "POST /formulations/${ob_f_id}/pilot-runs"
              payload: { pilot_line_id: "${ob_pl_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 60000.00 }
              as: RnDLead
              captures: { ob_run_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-runs/${ob_run_id}/start"
              payload: {}
              as: RnDLead
            - call: "POST /pilot-runs/${ob_run_id}/complete"
              payload: { actual_units: 8500 }
              as: RnDLead
            - call: "GET /formulations/${ob_f_id}"
              as: RnDLead
              captures: { ob_f_v: $.data.version }
          trigger:
            - call: "POST /formulations/${ob_f_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${ob_f_v} - 1", duration_days: 30, committed_cost_usd: 60000.00, start_at: "2026-08-07T09:00:00Z" }
              as: RnDLead
          assert:
            - "the response is 412 with error_id ERR_FORMULATION_VERSION_CONFLICT"
            - "the response is not 422 and not ERR_DEV_BUDGET_EXCEEDED, although 60000.00 + 60000.00 exceeds the 100000.00 cap"
            - "InnovationProject.${ob_id}.development_budget_committed_usd == 60000.00"
            - "Formulation.${ob_f_id}.status == PILOT_PASSED with best_pilot_yield_pct 85.00"
            - "GET /formulations/${ob_f_id}/shelf-life-studies returns total_count 0"

      - name: quorum_check_precedes_checklist_completeness_on_close
        grounds:
          - validations[priority 9 business_safety ERR_QUORUM_NOT_MET]
          - validations[priority 12 business_constraint ERR_DELIVERABLE_CHECKLIST_INCOMPLETE]
          - calculations.deliverable_completeness_pct
          - state_machines.GateReview.IN_SESSION_to_PASSED
        distinguishing_aspect: |
          A third, disjoint category pair: priority-9 business_safety (409) against priority-12
          business_constraint (422) on POST /gate-reviews/{id}/close. Only one of the
          two required votes was cast and the single required deliverable is still PENDING, so the
          quorum error answers and the 422 completeness error stays hidden.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 requiring [CONSUMER_CONCEPT_TEST] with quorum_size 2."
            - "A SNACK project screened to SCREENED, which auto-created the PENDING concept-test deliverable."
            - "No ConceptTest was ever fielded, so the checklist stays at 0.00 percent."
            - "The review is IN_SESSION with exactly one APPROVE vote."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST"], quorum_size: 2, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { qg2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Quorum Probe", brand: "SnackWorks", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              as_user_id: "lead-qp"
              captures: { qp_id: $.data.id }
            - call: "POST /innovation-projects/${qp_id}/screen"
              payload: {}
              as: GateChair
              as_user_id: "chair-qp"
            - call: "POST /innovation-projects/${qp_id}/gate-reviews"
              payload: { gate_id: "${qg2_id}", scheduled_at: "2026-08-05T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-qp"
              captures: { qgr_id: $.data.id }
            - call: "POST /gate-reviews/${qgr_id}/open"
              payload: {}
              as: GateChair
              as_user_id: "chair-qp"
            - call: "POST /gate-reviews/${qgr_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE" }
              as: FunctionalReviewer
              as_user_id: "rev-ops"
          trigger:
            - call: "POST /gate-reviews/${qgr_id}/close"
              payload: {}
              as: GateChair
              as_user_id: "chair-qp"
          assert:
            - "the response is 409 with error_id ERR_QUORUM_NOT_MET"
            - "the response is not 422 and not ERR_DELIVERABLE_CHECKLIST_INCOMPLETE"
            - "GateReview.${qgr_id}.status == IN_SESSION with decision null and vote_count == 1"
            - "GateReview.${qgr_id}.deliverable_completeness_pct == 0.00, confirming the priority-12 rule was also violated"
            - "InnovationProject.${qp_id}.dev_status == SCREENED and next_gate_number == 2"

  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: screening_score_at_pass_floor_versus_one_hundredth_below
        grounds:
          - calculations.screening_score
          - state_machines.InnovationProject.dev_status.IDEA_to_SCREENED
          - state_machines.InnovationProject.dev_status.IDEA_to_KILLED
        distinguishing_aspect: |
          Metric: screening_score against SCREENING_PASS_FLOOR 60.00, exercised on
          POST /innovation-projects/{id}/screen. A target_gross_margin_pct of 24 lands the
          score on exactly 60.00 and passes; 23.99 lands it on 59.99 and kills the idea, so the
          comparison is proven inclusive at the floor to two decimals.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "A BEVERAGE gate 2 exists so the passing branch has a checklist to create."
            - "Two BEVERAGE LINE_EXTENSION projects differing only in target_gross_margin_pct."
            - "The 24-percent project already screened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "BEVERAGE", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { fg2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Floor Exact", brand: "AquaVida", category: "BEVERAGE", project_type: "LINE_EXTENSION", strategic_fit_score: 6, consumer_need_score: 6, target_gross_margin_pct: 24, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { fe_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Floor Minus One Hundredth", brand: "AquaVida", category: "BEVERAGE", project_type: "LINE_EXTENSION", strategic_fit_score: 6, consumer_need_score: 6, target_gross_margin_pct: 23.99, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { fb_id: $.data.id }
            - call: "POST /innovation-projects/${fe_id}/screen"
              payload: { screening_notes: "Exactly at the floor" }
              as: GateChair
          trigger:
            - call: "POST /innovation-projects/${fb_id}/screen"
              payload: { screening_notes: "One hundredth below the floor" }
              as: GateChair
          assert:
            - "InnovationProject.${fe_id}.screening_score == 60.00 with screening_decision PASSED and dev_status SCREENED"
            - "InnovationProject.${fb_id}.screening_score == 59.99 with screening_decision REJECTED and dev_status KILLED"
            - "GET /deliverables?project_id=${fe_id}&gate_id=${fg2_id} returns total_count 1"
            - "GET /deliverables?project_id=${fb_id}&gate_id=${fg2_id} returns total_count 0"
            - "the two projects differ only in target_gross_margin_pct, so the 0.01 step across the floor is the sole cause"

      - name: empty_required_checklist_is_vacuously_complete
        grounds:
          - calculations.deliverable_completeness_pct
          - calculations.gate_readiness_index
          - state_machines.GateReview.SCHEDULED_to_IN_SESSION
        distinguishing_aspect: |
          Metric: deliverable_completeness_pct at the zero-denominator boundary, exercised on the
          distinct endpoint POST /gate-reviews/{id}/open. With required_deliverable_types
          empty the ratio 0/0 is undefined, so EMPTY_CHECKLIST_RESULT pins the answer at 100.00 while
          the readiness index still lands on 30.00 because concept, hurdle and yield are all 0.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 whose required_deliverable_types is the empty array."
            - "One SNACK LINE_EXTENSION project screened to SCREENED, with no ConceptTest, no BusinessCase and no Formulation."
            - "A gate review SCHEDULED against that gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { eg2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Empty Checklist Probe", brand: "SnackWorks", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              as_user_id: "lead-ec"
              captures: { ec_id: $.data.id }
            - call: "POST /innovation-projects/${ec_id}/screen"
              payload: {}
              as: GateChair
              as_user_id: "chair-ec"
            - call: "POST /innovation-projects/${ec_id}/gate-reviews"
              payload: { gate_id: "${eg2_id}", scheduled_at: "2026-08-05T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-ec"
              captures: { egr_id: $.data.id }
          trigger:
            - call: "POST /gate-reviews/${egr_id}/open"
              payload: {}
              as: GateChair
              as_user_id: "chair-ec"
          assert:
            - "GateReview.${egr_id}.status == IN_SESSION"
            - "GateReview.${egr_id}.deliverable_completeness_pct == 100.00"
            - "GET /deliverables?project_id=${ec_id}&gate_id=${eg2_id} returns total_count 0, so 100.00 came from EMPTY_CHECKLIST_RESULT and not from counting rows"
            - "GateReview.${egr_id}.readiness_index == 30.00, being 0.30 * 100.00 completeness with concept, hurdle and yield all 0.00 and CATEGORY_FACTOR SNACK 1.00"
            - "GateReview.${egr_id}.deliverable_completeness_pct != 0.00, the value a naive satisfied-over-total implementation returns for an empty list"

      - name: pilot_yield_at_floor_versus_one_hundredth_below
        grounds:
          - entities.PilotRun.fields.yield_pct
          - state_machines.Formulation.DRAFT_to_PILOT_PASSED
          - state_machines.Formulation.DRAFT_to_PILOT_FAILED
        distinguishing_aspect: |
          Metric: yield_pct against PILOT_YIELD_FLOOR_PCT 85.00, exercised on the distinct endpoint
          POST /pilot-runs/{id}/complete. Out of 10000 planned units, 8500 gives exactly
          85.00 and clears the formulation, while 8499 gives 84.99 and fails it, so the floor is
          proven inclusive at two-decimal precision on a metric unrelated to screening.
        test_recipe:
          setup:
            - "Clock walked 2026-08-03 -> 2026-08-06T08:00."
            - "Two pilot lines so both runs can be RUNNING without a line conflict."
            - "Two BEVERAGE projects, each with one DRAFT formulation and one SCHEDULED run of 10000 planned units."
            - "Both runs started; the 8500-unit run already completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Akron Pilot", line_code: "AKR-1", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 800.00 }
              as: PortfolioAdmin
              captures: { yl1_id: $.data.id }
            - call: "POST /pilot-lines"
              payload: { plant_name: "Akron Pilot", line_code: "AKR-2", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 800.00 }
              as: PortfolioAdmin
              captures: { yl2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Yield Exact", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { ye_id: $.data.id, ye_v1: $.data.version }
            - call: "POST /innovation-projects"
              payload: { name: "Yield Below", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { yb_id: $.data.id, yb_v1: $.data.version }
            - call: "POST /innovation-projects/${ye_id}/formulations"
              payload: { expected_project_version: "${ye_v1}", spec_summary: "Yuzu base A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { yef_id: $.data.id }
            - call: "POST /innovation-projects/${yb_id}/formulations"
              payload: { expected_project_version: "${yb_v1}", spec_summary: "Yuzu base A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { ybf_id: $.data.id }
            - call: "POST /formulations/${yef_id}/pilot-runs"
              payload: { pilot_line_id: "${yl1_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 20000.00 }
              as: RnDLead
              captures: { yer_id: $.data.id }
            - call: "POST /formulations/${ybf_id}/pilot-runs"
              payload: { pilot_line_id: "${yl2_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 20000.00 }
              as: RnDLead
              captures: { ybr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-runs/${yer_id}/start"
              payload: {}
              as: RnDLead
            - call: "POST /pilot-runs/${ybr_id}/start"
              payload: {}
              as: RnDLead
            - call: "POST /pilot-runs/${yer_id}/complete"
              payload: { actual_units: 8500 }
              as: RnDLead
          trigger:
            - call: "POST /pilot-runs/${ybr_id}/complete"
              payload: { actual_units: 8499 }
              as: RnDLead
          assert:
            - "PilotRun.${yer_id}.yield_pct == 85.00 with status COMPLETED"
            - "PilotRun.${ybr_id}.yield_pct == 84.99 with status COMPLETED"
            - "Formulation.${yef_id}.status == PILOT_PASSED and best_pilot_yield_pct == 85.00"
            - "Formulation.${ybf_id}.status == PILOT_FAILED and best_pilot_yield_pct == 84.99"
            - "a single unit of the 10000 planned separates a cleared formulation from a failed one"
            - "InnovationProject.${ye_id}.development_budget_committed_usd == 20000.00 == InnovationProject.${yb_id}.development_budget_committed_usd"

  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: label_submit_depends_on_formulation_shelf_life_state
        grounds:
          - state_machines.LabelApproval.DRAFT_to_IN_REVIEW
          - state_machines.Formulation.PILOT_PASSED_to_SHELF_LIFE_CLEARED
          - errors.ERR_FORMULATION_INVALID_STATE
        distinguishing_aspect: |
          Entity pair LabelApproval depends on Formulation: the byte-identical submit request is
          refused with ERR_FORMULATION_INVALID_STATE while the formulation is only PILOT_PASSED and
          accepted once a shelf-life timepoint closes the study PASSED and moves the formulation to
          SHELF_LIFE_CLEARED. Nothing about the LabelApproval row itself changes between the two.
        test_recipe:
          setup:
            - "Clock walked 2026-08-03 -> 2026-08-06T08:00."
            - "One BEVERAGE project with a formulation whose pilot run completed at 85.00 percent."
            - "An ACTIVE 30-day shelf-life study on that formulation with no timepoints yet."
            - "A DRAFT LabelApproval describing that formulation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Akron Pilot", line_code: "AKR-3", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 800.00 }
              as: PortfolioAdmin
              captures: { xl_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Label Gate Probe", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 100000.00 }
              as: InnovationLead
              captures: { xp_id: $.data.id, xp_v1: $.data.version }
            - call: "POST /innovation-projects/${xp_id}/formulations"
              payload: { expected_project_version: "${xp_v1}", spec_summary: "Yuzu base A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { xf_id: $.data.id }
            - call: "POST /formulations/${xf_id}/pilot-runs"
              payload: { pilot_line_id: "${xl_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 20000.00 }
              as: RnDLead
              captures: { xr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-runs/${xr_id}/start"
              payload: {}
              as: RnDLead
            - call: "POST /pilot-runs/${xr_id}/complete"
              payload: { actual_units: 8500 }
              as: RnDLead
            - call: "GET /formulations/${xf_id}"
              as: RnDLead
              captures: { xf_v2: $.data.version }
            - call: "POST /formulations/${xf_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${xf_v2}", duration_days: 30, committed_cost_usd: 30000.00, start_at: "2026-08-06T17:00:00Z" }
              as: RnDLead
              captures: { xs_id: $.data.id }
            - call: "POST /innovation-projects/${xp_id}/label-approvals"
              payload: { formulation_id: "${xf_id}", label_version: "LG-v1", claims: ["Sparkling yuzu, no added sugar"] }
              as: InnovationLead
              captures: { xlab_id: $.data.id }
          trigger:
            - call: "POST /label-approvals/${xlab_id}/submit"
              payload: {}
              as: InnovationLead
            - call: "POST /shelf-life-studies/${xs_id}/timepoints"
              payload: { day_index: 30, quality_score: 88.00 }
              as: RnDLead
            - call: "POST /label-approvals/${xlab_id}/submit"
              payload: {}
              as: InnovationLead
          assert:
            - "the first submit returns 409 with error_id ERR_FORMULATION_INVALID_STATE while Formulation.${xf_id}.status == PILOT_PASSED"
            - "after the timepoint, ShelfLifeStudy.${xs_id}.status == PASSED with verdict PASS and min_quality_score 88.00"
            - "Formulation.${xf_id}.status == SHELF_LIFE_CLEARED"
            - "the second, identical submit returns 200 and LabelApproval.${xlab_id}.status == IN_REVIEW"
            - "no field of LabelApproval.${xlab_id} changed between the two attempts, so the other entity's state is the only cause"

      - name: sell_in_presentation_depends_on_project_dev_status
        grounds:
          - state_machines.InnovationProject.commercial_status.NOT_STARTED_to_SELL_IN_SCHEDULED
          - state_machines.InnovationProject.dev_status.SCREENED_to_PILOT_QUALIFIED
