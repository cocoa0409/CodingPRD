              captures: { posture_after: $.data.school_posture }
          assert:
            - "Grievance.${griev_id}.grievance_status == ESCALATED_TO_OCR (level 1)"
            - "posture_after == AUDIT_HOLD (level 2 — ocr_escalation_flag forced)"
            - "ComplianceAuditEvent GRIEVANCE_ESCALATED exists for school ${school_id}"

