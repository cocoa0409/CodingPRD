      - name: change_request_revision_cycle_terminates_at_max_revisions
        grounds:
          - state_machines.ProgrammingChangeRequest.DRAFT_to_SUBMITTED
          - state_machines.ProgrammingChangeRequest.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.ProgrammingChangeRequest.CHANGES_REQUESTED_to_SUBMITTED
          - validations[priority=37]
          - entities.ProgrammingChangeRequest.fields.revision_count
        distinguishing_aspect: |
          Non-linearity is a TRUE CYCLE on a different entity
          (ProgrammingChangeRequest, not SubscriberUnit): SUBMITTED ->
