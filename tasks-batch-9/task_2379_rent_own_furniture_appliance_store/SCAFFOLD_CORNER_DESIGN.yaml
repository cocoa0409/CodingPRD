# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe) — task_2379
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# 25 executable instances + 18 `excluded_because:` stubs that defer to a named
# §1.8 instance. Every chain starts from an empty database, uses only §1.5
# endpoints, and every numeric literal in an `assert:` was produced by running
# the §1.3 formula in code against the pinned setup.
#
# Fixture constants reused across every chain in this file (identical to §1.8):
#   TX rule: grace 3, pct 0.10, cap 1000, reinst 500, PCT_OF_REMAINING 0.55,
#            fee cap 5000, contacts 3/wk, quiet 20..8, repo limit 0.60,
#            credit inquiry prohibited, max renewals 78
#   MN rule: grace 5, pct 0.05, cap 600, reinst 0, CASH_PRICE_MINUS_CREDIT,
#            fee cap 0, contacts 2/wk, quiet 21..9, repo limit 0.50,
#            credit inquiry allowed, max renewals 24
#   Units:   SOFA-3S-GRY FURNITURE 120000 / WASH-TL-WHT APPLIANCE 30000
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: agreement_prices_off_the_stores_state_rule_not_the_customers
        claim_type: parent_relationships
        grounds:
          - entities.Agreement.fields.state_code_snapshot
          - entities.Store.fields.state_code
          - validations[priority=8].ERR_STATE_RULE_NOT_CONFIGURED
          - endpoints[POST /stores]
          - endpoints[GET /agreements/{id}/disclosure]
        distinguishing_aspect: |
          A TX-resident customer signs at an NV store. The agreement must pin
          state_code_snapshot = NV and charge the NV processing-fee cap (4000,
          total_of_payments 268004), NOT the customer's TX cap (5000, total
          269004) — the parent chain that decides the rule is
          Agreement -> unit -> Store -> StateRtoRule, never Customer. The same
          rule row is also a hard parent for store creation: an OK store with
          no OK rule is refused.
        test_recipe:
          setup:
            - "a TX StateRtoRule (processing_fee_max_cents 5000) and an NV StateRtoRule (processing_fee_max_cents 4000, otherwise identical)"
            - "one NV store holding one NEW FURNITURE unit of cash_price_cents 120000, and no store in OK"
            - "one VERIFIED customer whose own state_code is TX"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "NV", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 4000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: false, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Reno Main", state_code: "NV", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_nv_id: $.data.id }
            - call: "POST /stores/${store_nv_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-NV-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_nv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Ruth Vega", relationship: "FAMILY", phone: "+15125550102" }
              as: SalesAssociate
              captures: { ref1_id: $.data.id }
            - call: "POST /customers/${cust_id}/references"
              payload: { reference_name: "Sam Ortiz", relationship: "LANDLORD", phone: "+15125550103" }
              as: SalesAssociate
              captures: { ref2_id: $.data.id }
            - call: "POST /customer-references/${ref1_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customer-references/${ref2_id}/check"
              payload: { result: "VERIFIED" }
              as: SalesAssociate
            - call: "POST /customers/${cust_id}/verify"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_officer_1"
          trigger:
            - call: "POST /stores"
              payload: { name: "Tulsa Main", state_code: "OK", service_bay_capacity: 1 }
              as: PlatformAdmin
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "${unit_nv_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
              captures: { agr_nv_id: $.data.id }
            - call: "GET /agreements/${agr_nv_id}/disclosure"
              as: SalesAssociate
          assert:
            - "the OK store creation returns 422 ERR_STATE_RULE_NOT_CONFIGURED and GET /stores reports total_count == 1"
            - "the agreement creation returns 201 and Agreement.${agr_nv_id}.state_code_snapshot == NV even though Customer.${cust_id}.state_code == TX"
            - "Agreement.${agr_nv_id}.adjusted_cash_price_cents == 120000, renewal_rate_cents == 5077, rent_subtotal_cents == 264004"
            - "Agreement.${agr_nv_id}.processing_fee_cents == 4000 (the NV cap), NOT 5000, and total_of_payments_cents == 268004, NOT 269004"
            - "Agreement.${agr_nv_id}.monthly_equivalent_rate_cents == 22000, version == 1, payment_status == CURRENT, possession_status == PENDING_DELIVERY, cycle_anchor_at is null, current_period_due_at is null, paid_pct == 0.0000"
            - "the disclosure read returns state_code == NV, early_purchase_formula == PCT_OF_REMAINING, total_of_payments_cents == 268004 and cost_of_rental_cents == 148004"
            - "InventoryUnit.${unit_nv_id}.status == RESERVED and Customer.${cust_id}.verification_status == VERIFIED"

      - name: customer_create_applies_every_declared_default
        claim_type: defaults
        grounds:
          - entities.Customer.fields.verification_status
          - entities.Customer.fields.employer_verified
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.account_flag
          - endpoints[POST /customers]
        distinguishing_aspect: |
          A minimal customer body (only the six required fields) must yield
          every declared default in one response: the three optional booleans
          false, verification_status PENDING with score 0, loyalty STANDARD
          with balance and lifetime 0, account_flag NORMAL and both adverse /
          delinquency counters 0 — none of which the client supplied and none
          of which POST /customers accepts as input.
        test_recipe:
          setup:
            - "a TX StateRtoRule exists; the customer table is otherwise empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Milo Chen", email: "milo@example.com", phone: "+15125550190", state_code: "TX", monthly_income_cents: 180000, residence_months: 4 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "GET /customers/${cust_id}"
              as: StoreManager
          assert:
            - "Customer.${cust_id}.employer_verified == false, government_id_verified == false, in_person_contact_consent == false"
            - "Customer.${cust_id}.verification_status == PENDING and verification_score == 0 and verified_reference_count == 0"
            - "Customer.${cust_id}.loyalty_points_balance == 0, loyalty_points_lifetime == 0, loyalty_tier == STANDARD, credit_balance_cents == 0"
            - "Customer.${cust_id}.account_flag == NORMAL, adverse_agreement_count == 0, lifetime_delinquency_count == 0"
            - "Customer.${cust_id}.version == 1 and the GET response repeats exactly the same field values as the POST response"

      - name: duplicate_serial_is_store_scoped_while_state_rules_are_globally_unique
        claim_type: creation
        grounds:
          - entities.InventoryUnit.fields.serial_number
          - entities.StateRtoRule.fields.state_code
          - validations[priority=34].ERR_DUPLICATE_SERIAL
          - validations[priority=34].ERR_DUPLICATE_STATE_RULE
        distinguishing_aspect: |
          Serial uniqueness is scoped to store_id, state-rule uniqueness is
          global. The identical serial SN-DUP-0001 must be refused at the store
          that already holds it (409 ERR_DUPLICATE_SERIAL) yet accepted at a
          second store, while a second TX rule row is refused outright (409
          ERR_DUPLICATE_STATE_RULE) — two codes from one validation priority
          with opposite scoping.
        test_recipe:
          setup:
            - "TX and MN StateRtoRules exist"
            - "one TX store already holding a unit with serial_number SN-DUP-0001, and one MN store holding nothing"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "MN", late_fee_grace_days: 5, late_fee_pct: 0.05, late_fee_max_cents: 600, reinstate_threshold_months: 2, reinstate_days_short: 7, reinstate_days_long: 21, reinstatement_fee_cents: 0, early_purchase_formula: "CASH_PRICE_MINUS_CREDIT", early_purchase_pct: 0.55, rent_credit_pct: 0.55, processing_fee_max_cents: 0, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 2, quiet_hours_start_utc_hour: 21, quiet_hours_end_utc_hour: 9, repossession_paid_pct_limit: 0.50, credit_inquiry_prohibited: false, max_term_renewals: 24 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Duluth Main", state_code: "MN", service_bay_capacity: 2 }
              as: PlatformAdmin
              captures: { store_mn_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-DUP-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_first_id: $.data.id }
          trigger:
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-DUP-0001", cash_price_cents: 120000 }
              as: StoreManager
            - call: "POST /stores/${store_mn_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-DUP-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_second_id: $.data.id }
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 7, late_fee_pct: 0.20, late_fee_max_cents: 2000, reinstate_threshold_months: 3, reinstate_days_short: 9, reinstate_days_long: 30, reinstatement_fee_cents: 900, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.70, rent_credit_pct: 0.40, processing_fee_max_cents: 9000, disclosure_requires_total_of_payments: false, max_collection_contacts_per_week: 9, quiet_hours_start_utc_hour: 22, quiet_hours_end_utc_hour: 6, repossession_paid_pct_limit: 0.90, credit_inquiry_prohibited: false, max_term_renewals: 99 }
              as: PlatformAdmin
          assert:
            - "the second SN-DUP-0001 at the TX store returns 409 ERR_DUPLICATE_SERIAL"
            - "the SN-DUP-0001 at the MN store returns 201 and InventoryUnit.${unit_second_id}.store_id == ${store_mn_id}, so ${unit_first_id} and ${unit_second_id} coexist with the same serial_number"
            - "the second TX state rule returns 409 ERR_DUPLICATE_STATE_RULE"
            - "GET /state-rto-rules?state_code=TX reports total_count == 1 and the surviving row still has late_fee_grace_days == 3 and processing_fee_max_cents == 5000 (the rejected write changed nothing)"
            - "GET /stores/${store_tx_id}/inventory-units reports total_count == 1"

      - name: unknown_ids_return_the_entity_specific_not_found_code
        claim_type: not_found
        grounds:
          - validations[priority=4].ERR_AGREEMENT_NOT_FOUND
          - validations[priority=4].ERR_STATE_RULE_NOT_FOUND
          - validations[priority=7].ERR_CUSTOMER_NOT_FOUND
          - validations[priority=7].ERR_UNIT_NOT_FOUND
        distinguishing_aspect: |
          Priority 4 resolves PATH ids and priority 7 resolves BODY foreign
          keys, and each reports the code of the entity that failed, not a
          generic 404: an unknown path agreement id gives
          ERR_AGREEMENT_NOT_FOUND, an unknown path rule id gives
          ERR_STATE_RULE_NOT_FOUND, and on POST /agreements an unknown
          customer_id gives ERR_CUSTOMER_NOT_FOUND while a real customer with
          an unknown unit_id gives ERR_UNIT_NOT_FOUND.
        test_recipe:
          setup:
            - "a TX StateRtoRule, one TX store and one FURNITURE unit exist; the customer table is empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_tx_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "+15125550101", state_code: "TX", employer_name: "Bluebonnet Foods", employer_verified: true, monthly_income_cents: 300000, residence_months: 18, government_id_verified: true, in_person_contact_consent: true }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /agreements/00000000-0000-4000-8000-000000000009"
              as: StoreManager
            - call: "GET /state-rto-rules/00000000-0000-4000-8000-000000000008"
              as: StoreManager
            - call: "POST /agreements"
              payload: { customer_id: "00000000-0000-4000-8000-000000000007", unit_id: "${unit_tx_id}", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
            - call: "POST /agreements"
              payload: { customer_id: "${cust_id}", unit_id: "00000000-0000-4000-8000-000000000006", term_type: "WEEKLY", renewal_count: 52, disclosure_acknowledged: true }
              as: SalesAssociate
          assert:
            - "the agreement read returns 404 ERR_AGREEMENT_NOT_FOUND"
            - "the state-rule read returns 404 ERR_STATE_RULE_NOT_FOUND"
            - "the unknown customer_id create returns 404 ERR_CUSTOMER_NOT_FOUND (priority 7 body-FK check), not ERR_CUSTOMER_NOT_VERIFIED"
            - "the unknown unit_id create returns 404 ERR_UNIT_NOT_FOUND even though the customer exists but is still PENDING, proving priority 7 outranks priority 30"
            - "GET /agreements reports total_count == 0 and InventoryUnit.${unit_tx_id}.status is still AVAILABLE"

      - name: inventory_unit_listing_paginates_and_orders_by_created_at
        claim_type: listing
        grounds:
          - endpoints[GET /stores/{id}/inventory-units]
          - endpoints[GET /inventory-units]
          - response_envelope.pagination_fields
          - validations[priority=6].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Three units created in a known order must page back in created_at ASC
          order with total_count 3 / has_more flipping true then false, the
          status and category filters must narrow the same list without
          disturbing total_count semantics, and limit 0 must be refused by
          priority 6 rather than silently clamped.
        test_recipe:
          setup:
            - "a TX StateRtoRule and one TX store holding exactly three units created in the order SN-TX-0001 (FURNITURE), SN-TX-0002 (APPLIANCE), SN-TX-0003 (FURNITURE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0001", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_1_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "WASH-TL-WHT", category: "APPLIANCE", serial_number: "SN-TX-0002", cash_price_cents: 30000 }
              as: StoreManager
              captures: { unit_2_id: $.data.id }
            - call: "POST /stores/${store_tx_id}/inventory-units"
              payload: { model_code: "SOFA-3S-GRY", category: "FURNITURE", serial_number: "SN-TX-0003", cash_price_cents: 120000 }
              as: StoreManager
              captures: { unit_3_id: $.data.id }
          trigger:
            - call: "GET /stores/${store_tx_id}/inventory-units?limit=2&offset=0"
              as: SalesAssociate
            - call: "GET /stores/${store_tx_id}/inventory-units?limit=2&offset=2"
              as: SalesAssociate
            - call: "GET /inventory-units?store_id=${store_tx_id}&category=APPLIANCE&limit=10&offset=0"
              as: SalesAssociate
            - call: "GET /stores/${store_tx_id}/inventory-units?limit=0&offset=0"
              as: SalesAssociate
          assert:
            - "page one returns response_type array with limit == 2, offset == 0, total_count == 3, has_more == true and data ids exactly [${unit_1_id}, ${unit_2_id}] in that created_at ASC order"
            - "page two returns limit == 2, offset == 2, total_count == 3, has_more == false and data ids exactly [${unit_3_id}]"
            - "the APPLIANCE filter returns total_count == 1 with data ids exactly [${unit_2_id}] and status AVAILABLE"
            - "limit=0 returns 400 ERR_INVALID_REQUEST (limit must be 1..100), it is not clamped to the default 10"

      - name: malformed_requests_are_rejected_before_any_business_rule
        claim_type: type_constraints
        grounds:
          - validations[priority=6].ERR_INVALID_REQUEST
          - entities.InventoryUnit.fields.category
          - entities.InventoryUnit.fields.cash_price_cents
          - endpoints[POST /agreements]
        distinguishing_aspect: |
          Priority 6 fires ahead of every referential and business rule: an
          illegal category enum, a cash_price_cents below the declared 1000
          floor, and a POST /agreements body missing disclosure_acknowledged
          all return 400 ERR_INVALID_REQUEST even though the same bodies also
          violate later rules (an unverified customer at priority 30 in the
          third case).
        test_recipe:
          setup:
            - "a TX StateRtoRule, one TX store and one PENDING customer exist; no unit has been created yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /state-rto-rules"
              payload: { state_code: "TX", late_fee_grace_days: 3, late_fee_pct: 0.10, late_fee_max_cents: 1000, reinstate_threshold_months: 2, reinstate_days_short: 5, reinstate_days_long: 15, reinstatement_fee_cents: 500, early_purchase_formula: "PCT_OF_REMAINING", early_purchase_pct: 0.55, rent_credit_pct: 0.50, processing_fee_max_cents: 5000, disclosure_requires_total_of_payments: true, max_collection_contacts_per_week: 3, quiet_hours_start_utc_hour: 20, quiet_hours_end_utc_hour: 8, repossession_paid_pct_limit: 0.60, credit_inquiry_prohibited: true, max_term_renewals: 78 }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Austin Main", state_code: "TX", service_bay_capacity: 1 }
              as: PlatformAdmin
              captures: { store_tx_id: $.data.id }
            - call: "POST /customers"
