        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / existence_beats_business_constraint_on_claim_create
          rationale: "The ID-verification business constraint (priority 10) is the lower-priority member exercised in the §1.8 existence-vs-business-constraint conflict; that instance establishes priority-10 is reachable and ordered. A standalone empty-gov-id claim is the same priority-10 trigger and would require a player with an empty government_id_number, which POST /players (required field) does not permit — so the standalone form is not independently reachable and is folded here."

