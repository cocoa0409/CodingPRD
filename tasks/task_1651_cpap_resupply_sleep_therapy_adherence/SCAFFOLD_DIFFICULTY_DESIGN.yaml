              captures: { sod_err: $.data.error_id }
          assert:
            - "dual-failure rejected with ${sod_err} == 'ERR_SEGREGATION_OF_DUTIES'   # priority 13 (business_safety) beats 14 (business_constraint OCC)"

  # ---------------------------------------------------------------------------
