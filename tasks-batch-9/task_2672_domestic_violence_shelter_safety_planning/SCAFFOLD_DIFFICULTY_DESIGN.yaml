              captures: { reserved_mid: "$.data.reserved_beds", available_mid: "$.data.available_beds" }
          trigger:
            - call: "POST /shelter-admissions/${adm_id}/cancel"
              payload: { cancel_reason: "Household found a relative to stay with before the entry date." }
              as: ShelterManager
              as_user_id: "${mgr_id}"
          assert:
            - "${capacity_before} == 4 and ${available_before} == 4 and ${reserved_mid} == 3 and ${available_mid} == 1 and ${projected} == 57000"
            - "ShelterAdmission.${adm_id}.occupancy_status == CANCELLED and cancel_reason is the submitted string"
            - "ShelterAdmission.${adm_id}.settled_stay_cost_cents == null and projected_stay_cost_cents == 57000 (the estimate is history, not a live claim on beds)"
            - "ShelterUnit.${unit_id}.reserved_beds == 0 and occupied_beds == 0 and available_beds == 4 and status == AVAILABLE"
            - "Invariant holds exactly: ShelterUnit.${unit_id}.bed_capacity == available_beds + reserved_beds + occupied_beds, i.e. 4 == 4 + 0 + 0"
            - "Shelter.${shelter_id}.available_beds == 4 and total_bed_capacity == 4 and capacity_posture == OPEN"
            - "Shelter.${shelter_id}.settled_revenue_cents == 0 (a cancellation bills nothing)"
            - "ScreeningRequest.${sr_id}.status == APPROVED and StaffMember.${adv_id}.active_caseload_count == 1 (the round trip leaves the caseload undisturbed)"

