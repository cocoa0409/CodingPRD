          - entities.Rebuilder.fields.suspended_by_user_id
        distinguishing_aspect: "Priority 73 tracks X-User-ID, not role: admin-01 may suspend but may not reinstate what it suspended, while admin-02 with the identical role passes the segregation gate, and because 73 precedes 96 the same admin is refused before the recordkeeping score is ever consulted."
