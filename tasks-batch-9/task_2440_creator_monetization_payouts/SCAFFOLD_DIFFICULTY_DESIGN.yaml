  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_info_request_cycle_exhausts_revision_rounds
        entity: Appeal
        shape: "cycle"
        grounds:
          - state_machines.Appeal
          - "state_machines.Appeal.transitions[SUBMITTED -> UNDER_REVIEW]"
          - "state_machines.Appeal.transitions[UNDER_REVIEW -> INFO_REQUESTED]"
          - "state_machines.Appeal.transitions[INFO_REQUESTED -> SUBMITTED]"
          - entities.Appeal.fields.revision_round
          - entities.Appeal.fields.state
          - "validations.priority_24"
          - errors.ERR_APPEAL_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          Appeal is a genuine cycle, not a line: SUBMITTED -> UNDER_REVIEW ->
          INFO_REQUESTED -> SUBMITTED revisits SUBMITTED, and only the
          monotonically increasing revision_round counter (bounded by
          APPEAL_MAX_ROUNDS == 2) terminates it. The same Appeal row is
          therefore in SUBMITTED at revision_round 0, 1 and 2, and the third
          /respond is rejected with ERR_APPEAL_ROUNDS_EXHAUSTED while the row
          stays parked in INFO_REQUESTED - a state no linear machine can
          produce.
        test_recipe:
          setup:
            - "One GB Creator (follower_count 10000, watch_time_minutes_365d 240000) with one ContentItem published 2026-07-01T00:00:00Z."
            - "PolicyReviewer reviewer-r1 rated that ContentItem RED with rating_source MANUAL, so suitability_rating == RED and monetization_state == DEMONETIZED and last_rated_by_user_id == reviewer-r1."
            - "The creator filed an Appeal requesting GREEN; the appeal has already traversed the info-request cycle twice, so state == INFO_REQUESTED, revision_round == 2, response_statement == 'Round two evidence.' and open_appeal_count == 1."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Fay Appeal", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr_id}", title: "Contested Clip", published_at: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ci_id: "$.data.id" }
            - call: "POST /monetization/content-items/${ci_id}/rate"
              payload: { suitability_rating: "RED", rating_source: "MANUAL", note: "Graphic imagery." }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
            - call: "POST /monetization/appeals"
              payload: { content_item_id: "${ci_id}", requested_rating: "GREEN", statement_text: "The clip is documentary footage and is advertiser friendly." }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { ap_id: "$.data.id", ap_round0: "$.data.revision_round" }
            - call: "POST /monetization/appeals/${ap_id}/start-review"
              payload: {}
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
            - call: "POST /monetization/appeals/${ap_id}/request-info"
              payload: { info_request: "Provide the licence for the source footage." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
            - call: "POST /monetization/appeals/${ap_id}/respond"
              payload: { response_statement: "Round one evidence." }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { ap_round1: "$.data.revision_round", ap_state1: "$.data.state" }
            - call: "POST /monetization/appeals/${ap_id}/start-review"
              payload: {}
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
            - call: "POST /monetization/appeals/${ap_id}/request-info"
              payload: { info_request: "The licence is unreadable; resend it." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
            - call: "POST /monetization/appeals/${ap_id}/respond"
              payload: { response_statement: "Round two evidence." }
              as: Creator
              as_user_id: "${cr_id}"
              captures: { ap_round2: "$.data.revision_round", ap_state2: "$.data.state" }
            - call: "POST /monetization/appeals/${ap_id}/start-review"
              payload: {}
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
            - call: "POST /monetization/appeals/${ap_id}/request-info"
              payload: { info_request: "Third request for the licence." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
          trigger:
            - call: "POST /monetization/appeals/${ap_id}/respond"
              payload: { response_statement: "Round three evidence." }
              as: Creator
              as_user_id: "${cr_id}"
          assert:
            - "${ap_round0} == 0 and ${ap_round1} == 1 and ${ap_round2} == 2 (the same row re-entered SUBMITTED three times)"
            - "${ap_state1} == SUBMITTED and ${ap_state2} == SUBMITTED"
            - "trigger returns HTTP 409 with error_id ERR_APPEAL_ROUNDS_EXHAUSTED"
            - "Appeal.${ap_id}.state == INFO_REQUESTED (unchanged; the cycle terminates parked, not at a fresh terminal state)"
            - "Appeal.${ap_id}.revision_round == 2 and response_statement == 'Round two evidence.' and info_request == 'Third request for the licence.'"
            - "Appeal.${ap_id}.decided_by_user_id == null and decided_at == null and rationale == null"
            - "ContentItem.${ci_id}.open_appeal_count == 1 and suitability_rating == RED and monetization_state == DEMONETIZED"
            - "POST /monetization/appeals with the same content_item_id returns HTTP 409 ERR_APPEAL_ALREADY_OPEN (open_appeal_count is still 1)"

      - name: payout_retry_cycle_forks_to_abandoned_on_exhaustion
        entity: Payout
        shape: "branching_with_cycle"
        grounds:
          - state_machines.Payout
          - "state_machines.Payout.transitions[PROCESSING -> FAILED]"
          - "state_machines.Payout.transitions[FAILED -> PROCESSING]"
          - "state_machines.Payout.transitions[PROCESSING -> ABANDONED]"
          - entities.Payout.fields.retry_count
          - entities.Payout.fields.state
          - entities.Creator.fields.consecutive_payment_failures
          - calculations.payout_fee_and_amount
          - errors.ERR_PAYOUT_NOT_FAILED
        distinguishing_aspect: |
          Payout is branching AND cyclic on a different entity than Appeal:
          PROCESSING forks on the settlement outcome, and the FAILED ->
          PROCESSING retry edge closes a loop that is traversed twice before the
          SAME PROCESSING -> record-settlement(FAILED) call takes the other
          branch (ABANDONED) purely because retry_count has reached
          MAX_PAYOUT_RETRIES == 2. fee_cents and amount_cents are frozen at 200
          and 19800 across all three attempts because the fee waterfall never
          re-runs on retry, and ABANDONED is terminal, so a fourth /retry is
          rejected.
