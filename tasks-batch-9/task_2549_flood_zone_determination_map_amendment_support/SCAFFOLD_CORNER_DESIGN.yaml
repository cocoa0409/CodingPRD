              captures: { fp_premium: $.data.force_placed_premium_cents }
          trigger:
            - call: "GET /flood-zone/compliance-notices/${n1_id}"
              as: ProviderAnalyst
              captures: { n1_estimate_after: $.data.estimated_force_place_premium_cents, n1_status_after: $.data.status }
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: ProviderAnalyst
              captures: { folio_actual_after: $.data.force_placed_premium_cents }
          assert:
            - "${n1_estimate_after} == 144000 - identical to ${n1_estimate} at send time, even though the actual came out at 142027"
            - "${folio_actual_after} == 142027 and ${n1_status_after} == EXPIRED: the notice's transition out of SENT does not clear or recompute its stored estimate"
            - "the 1973-cent gap is never posted anywhere: cumulative_earned_premium_cents is still 0 and escrow_balance_cents == 357973 reflects the actual only"
            - "each variant is written by exactly one endpoint - the notice POST never writes LoanFolio.force_placed_premium_cents and the force-placement POST never writes ComplianceNotice.estimated_force_place_premium_cents"
            - "a second MANDATORY_PURCHASE notice cannot be sent while the folio is FORCE_PLACED, so the estimate on ${n1_id} remains the only forward-looking figure on the folio"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_panel_effective_cascade_is_readable_with_no_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model.immediate
          - endpoints.POST_/flood-zone/map-panels/{map_panel_id}/effective
        distinguishing_aspect: "The deepest write in the system is a five-hop cascade across four entities; under the immediate model every hop is durable before the 200 is returned, so the first read after the response - with no retry, poll or delay - already shows the terminal values."
        test_recipe:
          setup:
            - "FL chain on panel seq 1 with an ISSUED determination and a SENT MANDATORY_PURCHASE notice"
            - "panel seq 2 walked PRELIMINARY -> APPEAL_OPEN -> LFD_ISSUED with the clock advanced past the 180-day waiting period"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL", participation_status: "REGULAR" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
