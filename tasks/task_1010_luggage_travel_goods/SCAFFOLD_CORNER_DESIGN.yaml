              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SER-30", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
