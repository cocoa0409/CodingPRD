  - rule_id: cross_entity_state_dependency
    instances:
      - name: queue_call_depends_on_the_content_versions_own_pin_state
        grounds:
          - validations[priority=36]
          - errors[ERR_VERSION_NOT_PINNED]
          - state_machines.ContentVersion.initial_state
          - entities.ContentVersion.fields.state
          - calculations.feed_slot_reservation_ledger
        distinguishing_aspect: |
          Two queue calls that differ only in content_version_id split on the referenced
          ContentVersion's own state: the DRAFT revision 2 is rejected with ERR_VERSION_NOT_PINNED even
          though the listing, retailer, capacity, window and completeness inputs are all identical and
          valid, while revision 1 in PINNED succeeds. Validating only the listing would accept both.
        test_recipe:
          setup:
            - "Retailer BigBox is ACTIVE with min_image_count 4, feed_slot_capacity 10, max_concurrent_feed_windows 2 and three REQUIRED requirement rows (title weight 40, description weight 30, brand weight 10), so the completeness denominator D == 80 + IMAGE_WEIGHT 20 == 100"
            - "product SKU-B-1 has revision 1 PINNED on the BigBox listing with title and description present, brand ABSENT and image_count 4, and exactly three APPROVED image assets against min_image_count 4"
            - "therefore RetailerListing.completeness_score_certified == 85.00, completeness_score_declared == 90.00, readiness_score == 51.00, syndication_state == NOT_SYNDICATED, shelf_state == OK"
            - "Retailer.feed_slots_reserved == 0, Retailer.version == 1 and the logical clock stands at 2026-08-10T00:00:00Z"
            - "a second revision (revision 2) of the same product exists in state DRAFT carrying title, description and brand with image_count 4; no ChangeRequest has been raised for it, so it has never been pinned and its pin_count is 0"
            - "revision 1 is the PINNED revision of the BigBox listing, so the certified score used by the queue gate is unaffected by revision 2"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "brand", data_type: "STRING", taxonomy_group: "CORE", max_chars: 60, base_weight: 10.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "BigBox", retailer_code: "RETB", status: "ACTIVE", min_image_count: 4, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rb_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rb_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rb_id}/requirements"
              payload: { attribute_key: "description", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rb_id}/requirements"
              payload: { attribute_key: "brand", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-B-1", gtin: "00012345678929", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pb_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pb_id}", retailer_id: "${rb_id}", account_team_user_id: "acct_bigbox_1" }
              as: ContentAuthor
              captures: { lb_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pb_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/b/hero.jpg" }
