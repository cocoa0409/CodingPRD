              as: PlatformAdmin
              captures: { newdevice: $.data.sold_device_id }
            - call: "GET /fitness/devices/${newdevice}"
              payload: {}
              as: ServiceTechnician
              captures: { nd_warranty: $.data.warranty_expires_at, nd_cycles: $.data.resale_cycle_count, nd_cond: $.data.condition }
          assert:
            - "Device.${d_id}.warranty_expires_at == 2027-09-05T13:30:00Z, the original 365-day NEW_SALE window"
            - "Device.${newdevice}.warranty_expires_at == 2026-12-04T13:30:00Z, the RESALE window of 90 days from the sale instant (captured as ${nd_warranty})"
            - "the two windows differ: the resale window is NOT the lineage window plus 90 days"
            - "Device.${newdevice}.condition == REFURBISHED (captured as ${nd_cond}) and Device.${newdevice}.resale_cycle_count == 1 (captured as ${nd_cycles})"
            - "Device.${newdevice}.certifying_device_id == ${d_id} and Device.${newdevice}.provenance_source == RESALE"
            - "POST /fitness/devices/${d_id}/warranty-reset is still refused on the lineage unit because its provenance is NEW_SALE"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: membership_household_users_view_without_inflight_cancellation
        claim_type: Derived field reconciliation
        grounds:
          - endpoints.GET_/fitness/memberships/{membershipId}/household-users
          - state_machines.HouseholdUser.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Every field a write returns is immediately readable from the sibling read endpoint with no reconciliation delay, so the cascade-created suspension is visible in the same request's follow-up read."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-17T12:00:00Z. ACTIVE membership with a verified OWNER and a delivered linked ACTIVE device."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - *c_d_get
            - *c_d_link
            - *c_m_get
            - *c_m_act
            - call: "POST /fitness/_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /fitness/memberships/${m_id}"
              payload: {}
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_v_now: $.data.version }
          trigger:
            - call: "POST /fitness/memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_v_now}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { m_credit: $.data.accrued_pause_credit_cents, m_posture: $.data.posture }
            - call: "GET /fitness/household-users"
              payload: { membership_id: "${m_id}", status: "SUSPENDED" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { first_status: "$.data[0].status", first_reason: "$.data[0].suspended_reason" }
          assert:
            - "the cancel response reports posture FROZEN and accrued_pause_credit_cents 2600 (captured as ${m_posture} and ${m_credit})"
            - "the immediately following filtered list returns exactly 1 row with total_count == 1, has_more == false, and data[0].status == SUSPENDED with suspended_reason MEMBERSHIP_CANCELLED (captured as ${first_status} and ${first_reason})"
            - "GET /fitness/memberships/${m_id} reports active_user_count == 0, matching the same request's cascade"
            - "no read-after-write delay is needed: the values agree across the write response and the two follow-up reads"
