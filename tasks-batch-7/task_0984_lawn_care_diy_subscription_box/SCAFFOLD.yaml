# =============================================================================
# Task 984 — Lawn-Care DIY Subscription Box (Sunday style)
# Scaffold seed tables (§1.0–§1.7). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  984. Lawn-Care DIY Subscription Box (Sunday style): soil test & custom plan,
  seasonal product shipment & timing, application reminder & weather,
  subscription & auto-ship, pest/weed add-on, skip/pause, satisfaction,
  referral

domain_name: lawn-care-diy-subscription
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique across customers", constraints: "unique, case-insensitive" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: climate_zone, type: enum, source: input, description: "COOL | TRANSITION | WARM — drives application windows" }
      - { name: referral_code, type: string, source: system, description: "Server-minted unique referral code (e.g. REF-XXXXXX)" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum of the customer's CreditLedgerEntry.amount_cents; never negative", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CHURNED" }

  - name: LawnProfile
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of this lawn" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Front yard'" }
      - { name: lawn_size_sqm, type: integer, source: input, description: "Lawn area in square meters; drives pricing tier (t1 < 500, t2 500..1999, t3 >= 2000)", constraints: "> 0" }
      - { name: grass_type, type: enum, source: input, description: "COOL_SEASON | WARM_SEASON | MIXED" }
      - { name: region, type: string, source: input, description: "Weather-advisory region key used by the weather gate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED (soft delete)" }

  - name: SoilTestKit
    parent: null
    common_fields: true
    fields:
      - { name: lawn_id, type: string, source: input, description: "FK -> LawnProfile.id; lawn being tested" }
      - { name: status, type: enum, source: system, description: "KIT_SHIPPED | SAMPLE_RETURNED | ANALYZED (SAMPLE_REJECTED is transient: rejection reships the kit back to KIT_SHIPPED)" }
      - { name: reship_count, type: integer, source: system, description: "Number of times a rejected sample forced a kit reship", default: 0 }
      - { name: rejection_reason, type: string, source: system, description: "Last lab rejection reason; null when never rejected" }
      - { name: ph, type: number, source: input, description: "Soil pH recorded at lab analysis (null until analyzed)" }
      - { name: nitrogen_ppm, type: number, source: input, description: "Nitrogen ppm recorded at lab analysis" }
      - { name: phosphorus_ppm, type: number, source: input, description: "Phosphorus ppm recorded at lab analysis" }
      - { name: potassium_ppm, type: number, source: input, description: "Potassium ppm recorded at lab analysis" }
      - { name: organic_matter_pct, type: number, source: input, description: "Organic matter percent recorded at lab analysis" }
      - { name: analyzed_at, type: datetime, source: system, description: "Logical-clock timestamp of analysis; null until ANALYZED" }

  - name: PlanVersion
    parent: null
    common_fields: true
    fields:
      - { name: lawn_id, type: string, source: input, description: "FK -> LawnProfile.id; lawn this plan treats" }
      - { name: soil_test_id, type: string, source: input, description: "FK -> SoilTestKit.id; must be ANALYZED" }
      - { name: season_year, type: integer, source: input, description: "Calendar year the plan covers, e.g. 2026" }
      - { name: plan_lines, type: array, source: input, description: "Array of {product_sku, qty_units, target_month}; every sku must exist in CatalogProduct" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | ACTIVE | SUPERSEDED" }
      - { name: provisional_value_cents, type: integer, source: computed, description: "plan_value_calc provisional variant: sum over plan_lines of qty_units x catalog list_price_cents" }
      - { name: committed_value_cents, type: integer, source: computed, description: "plan_value_calc committed variant: provisional x (1 - locked subscription discount); null until a subscription references this plan" }
      - { name: discount_pct_locked, type: number, source: system, description: "Billing-cycle discount locked at subscription creation (ANNUAL 0.10, MONTHLY 0.00); null until locked" }
      - { name: supersedes_plan_id, type: string, source: system, description: "FK -> PlanVersion.id; the ACTIVE plan this version replaced at activation; null for first activation" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; null until ACTIVE" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscriber" }
      - { name: plan_id, type: string, source: input, description: "FK -> PlanVersion.id; must be ACTIVE at creation" }
      - { name: billing_cycle, type: enum, source: input, description: "MONTHLY | ANNUAL; locks the plan discount" }
      - { name: auto_ship, type: boolean, source: input, description: "When true, the clock sweep auto-generates the next SEASONAL ShipmentBox at next_ship_date", default: true }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | PAST_DUE | CANCELLED" }
      - { name: next_ship_date, type: datetime, source: input, description: "Next auto-ship date; required when auto_ship is true" }
      - { name: skips_used_in_window, type: integer, source: system, description: "Skips consumed in the current rolling 365-day window", default: 0 }
      - { name: skip_window_anchor, type: datetime, source: system, description: "Timestamp of the first skip in the current window; null until first skip" }

  - name: ShipmentBox
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: box_kind, type: enum, source: input, description: "SEASONAL | ADDON | REPLACEMENT" }
      - { name: fulfillment_status, type: enum, source: system, description: "SCHEDULED | PICKING | SHIPPED | DELIVERED | HELD | SKIPPED | CANCELLED (parallel dimension 1)" }
      - { name: billing_status, type: enum, source: system, description: "PENDING | INVOICED | PAID | FAILED | VOID (parallel dimension 2)" }
      - { name: ship_date, type: datetime, source: input, description: "Planned ship date; drives the EARLY_SEASON discount" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Delivery window start (inclusive)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Delivery window end (exclusive) — half-open [start, end)" }
      - { name: lines, type: array, source: input, description: "Array of {product_sku, qty_units}; every sku must exist in CatalogProduct" }
      - { name: provisional_charge_cents, type: integer, source: computed, description: "shipment_charge_calc provisional variant, computed at creation and recomputed whenever a CONFIRMED AddOnOrder attaches" }
      - { name: final_charge_cents, type: integer, source: computed, description: "shipment_charge_calc final variant, computed at DELIVERED using delivered_at for the early-season discount; null until delivered" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp of DELIVERED; null until delivered" }
      - { name: source_claim_id, type: string, source: system, description: "FK -> SatisfactionClaim.id; set on REPLACEMENT boxes created by a claim resolution; null otherwise" }

  - name: ApplicationTask
    parent: null
    common_fields: true
    fields:
      - { name: lawn_id, type: string, source: input, description: "FK -> LawnProfile.id; resource whose applications must respect the 14-day category buffer" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: shipment_id, type: string, source: input, description: "FK -> ShipmentBox.id; must be DELIVERED before scheduling" }
      - { name: product_sku, type: string, source: input, description: "CatalogProduct sku being applied; category derived from catalog" }
      - { name: scheduled_date, type: string, source: input, description: "Planned application date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "AWAITING_DELIVERY | SCHEDULED | FROZEN | APPLIED | CANCELLED" }
      - { name: window_start_date, type: string, source: computed, description: "Product window start (inclusive) for the scheduled year, from CatalogProduct window_start_md" }
      - { name: window_end_date, type: string, source: computed, description: "Product window end (exclusive) — half-open [start, end)" }
      - { name: snooze_count, type: integer, source: system, description: "Number of reschedules (weather or customer driven)", default: 0 }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock timestamp of APPLIED; null until applied" }

  - name: WeatherAdvisory
    parent: null
    common_fields: true
    fields:
      - { name: region, type: string, source: input, description: "Region key matched against LawnProfile.region" }
      - { name: date, type: string, source: input, description: "Advisory date (YYYY-MM-DD); unique per region" }
      - { name: rain_probability, type: number, source: input, description: "0..1; gate blocks when >= 0.40" }
      - { name: wind_kph, type: integer, source: input, description: "Gate blocks when > 24" }
      - { name: temp_high_c, type: integer, source: input, description: "Gate blocks when < 5 or > 32" }

  - name: AddOnOrder
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: add_on_sku, type: string, source: input, description: "CatalogProduct sku; category must be PEST or WEED" }
      - { name: qty_units, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | FULFILLED | CANCELLED | EXPIRED" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "qty_units x catalog add_on_flat_price_cents at quote time" }
      - { name: quote_expires_at, type: datetime, source: system, description: "created_at + 7 days; clock sweep flips QUOTED -> EXPIRED once now >= quote_expires_at" }
      - { name: attached_shipment_id, type: string, source: system, description: "FK -> ShipmentBox.id; the SCHEDULED box this add-on rides with; null until attached" }

  - name: SatisfactionClaim
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: shipment_id, type: string, source: input, description: "FK -> ShipmentBox.id; must be DELIVERED" }
      - { name: claim_reason, type: enum, source: input, description: "INEFFECTIVE | DAMAGED | WRONG_PRODUCT | OTHER" }
      - { name: evidence_url, type: string, source: input, description: "Photo evidence URL (optional)", default: null }
      - { name: status, type: enum, source: system, description: "FILED | RESOLVED | DENIED" }
      - { name: resolution_type, type: enum, source: system, description: "RESHIP | CREDIT | REFUND; null until RESOLVED" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "For CREDIT resolutions: min(shipment.final_charge_cents, SATISFACTION_CREDIT_CAP_CENTS); null until RESOLVED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at filing; must be within 30 days of shipment.delivered_at" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referrer_customer_id, type: string, source: system, description: "FK -> Customer.id; owner of the code used" }
      - { name: referee_customer_id, type: string, source: system, description: "FK -> Customer.id; the newly registered customer" }
      - { name: referral_code_used, type: string, source: system, description: "The referral_code presented at referee registration" }
      - { name: status, type: enum, source: system, description: "PENDING | QUALIFIED | REVOKED" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "referral_credit_calc provisional variant: flat 2000 shown while PENDING" }
      - { name: qualified_credit_cents, type: integer, source: computed, description: "referral_credit_calc qualified variant: min(5000, round_half_up(0.20 x referee first PAID invoice total_cents)); null until QUALIFIED" }
      - { name: referee_first_invoice_id, type: string, source: system, description: "FK -> Invoice.id; the referee's first PAID invoice; null until qualification" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; copied from the shipped box" }
      - { name: shipment_id, type: string, source: system, description: "FK -> ShipmentBox.id; the box being billed" }
      - { name: line_items, type: array, source: system, description: "Array of {product_sku, qty_units, unit_price_cents, line_discount_pct, line_total_cents} built at SHIPPED from box lines + attached add-ons" }
      - { name: subtotal_cents, type: integer, source: computed, description: "invoice_total_calc: per-line round_half_up then sum (pinned rounding order)" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "min(customer.credit_balance_cents at issue, subtotal_cents); auto-redeemed at issue" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - credit_applied_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | FAILED | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issue" }

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; whose balance this entry moves" }
      - { name: entry_type, type: enum, source: system, description: "EARN_REFERRAL | REVOKE_REFERRAL | EARN_SATISFACTION | REDEEM_INVOICE | RESTORE_VOID_INVOICE | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; positive earns, negative redeems/revokes" }
      - { name: reference_id, type: string, source: system, description: "Polymorphic reference: Referral.id, SatisfactionClaim.id, or Invoice.id; null for ADJUSTMENT" }
      - { name: note, type: string, source: input, description: "Operator note for ADJUSTMENT entries", default: null }

  - name: CatalogProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique product sku", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "FERTILIZER | WEED | PEST | SEED | SOIL_AMENDMENT" }
      - { name: list_price_cents, type: integer, source: input, description: "Per-unit list price used by plan_value_calc" }
      - { name: tier_t1_cents, type: integer, source: input, description: "Per-unit shipment rate for lawns < 500 sqm" }
      - { name: tier_t2_cents, type: integer, source: input, description: "Per-unit shipment rate for lawns 500..1999 sqm" }
      - { name: tier_t3_cents, type: integer, source: input, description: "Per-unit shipment rate for lawns >= 2000 sqm" }
      - { name: add_on_flat_price_cents, type: integer, source: input, description: "Flat per-unit price when ordered as an add-on (PEST/WEED only)", default: null }
      - { name: window_start_md, type: string, source: input, description: "Application window start MM-DD (inclusive)" }
      - { name: window_end_md, type: string, source: input, description: "Application window end MM-DD (exclusive) — half-open" }
      - { name: conflicting_categories, type: array, source: input, description: "Categories that must respect the min-gap buffer against this product on the same lawn" }
      - { name: min_gap_days, type: integer, source: input, description: "Minimum days between this product and conflicting-category applications on the same lawn", default: 14 }
      - { name: active, type: boolean, source: input, description: "Inactive products cannot appear in new plan lines or boxes", default: true }

# =============================================================================
# §1.2 State Machine Table (11 machines)
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CHURNED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/customers/{id}/status {to_status: SUSPENDED}"
        actor: PlatformAdmin
        preconditions:
          - "Customer must be ACTIVE (ERR_CUSTOMER_NOT_ACTIVE_FOR_STATUS)"
        side_effects:
          - "increments Customer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/customers/{id}/status {to_status: ACTIVE}"
        actor: PlatformAdmin
        preconditions:
          - "Customer must be SUSPENDED (ERR_CUSTOMER_NOT_SUSPENDED)"
        side_effects:
          - "increments Customer.version by 1"
      - from: ACTIVE
        to: CHURNED
        trigger: "POST /api/customers/{id}/status {to_status: CHURNED}"
        actor: PlatformAdmin
        preconditions:
          - "Customer must be ACTIVE (ERR_CUSTOMER_NOT_ACTIVE_FOR_STATUS)"
          - "All of the customer's subscriptions must be CANCELLED (ERR_SUBSCRIPTIONS_STILL_OPEN)"
        side_effects:
          - "increments Customer.version by 1"

  - entity: LawnProfile
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "PATCH /api/lawns/{id} {status: ARCHIVED}"
        actor: Customer
        preconditions:
          - "Acting customer must own the lawn (ERR_OWNERSHIP_MISMATCH)"
          - "No ApplicationTask of this lawn may be in SCHEDULED, FROZEN, or AWAITING_DELIVERY (ERR_LAWN_HAS_OPEN_APPLICATIONS)"
        side_effects:
          - "increments LawnProfile.version by 1"

  - entity: SoilTestKit
    initial_state: KIT_SHIPPED
    terminal_states: [ANALYZED]
    transitions:
      - from: KIT_SHIPPED
        to: SAMPLE_RETURNED
        trigger: "POST /api/soil-tests/{id}/return-sample"
        actor: Customer
        preconditions:
          - "Kit must be KIT_SHIPPED (ERR_SOIL_TEST_NOT_SHIPPED)"
          - "Acting customer must own the kit's lawn (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "increments SoilTestKit.version by 1"
      - from: SAMPLE_RETURNED
        to: ANALYZED
        trigger: "POST /api/soil-tests/{id}/lab-result {outcome: ANALYZED, ph, nitrogen_ppm, phosphorus_ppm, potassium_ppm, organic_matter_pct}"
        actor: Agronomist
        preconditions:
          - "Kit must be SAMPLE_RETURNED (ERR_SOIL_TEST_NOT_RETURNED)"
        side_effects:
          - "lab fields recorded; analyzed_at = logical clock"
          - "increments SoilTestKit.version by 1"
      - from: SAMPLE_RETURNED
        to: KIT_SHIPPED
        trigger: "POST /api/soil-tests/{id}/lab-result {outcome: REJECTED, rejection_reason}"
        actor: Agronomist
        preconditions:
          - "Kit must be SAMPLE_RETURNED (ERR_SOIL_TEST_NOT_RETURNED)"
        side_effects:
          - "reship_count += 1; rejection_reason recorded; a fresh kit is sent (cycle back to KIT_SHIPPED)"
          - "increments SoilTestKit.version by 1"
        note: "Resample loop: SAMPLE_RETURNED -> KIT_SHIPPED -> SAMPLE_RETURNED is an allowed cycle"

  - entity: PlanVersion
    initial_state: DRAFT
    terminal_states: [ACTIVE, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /api/plans/{id}/submit-review"
        actor: Agronomist
        preconditions:
          - "Plan must be DRAFT (ERR_PLAN_NOT_DRAFT)"
        side_effects:
          - "increments PlanVersion.version by 1"
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "PATCH /api/plans/{id} (any edit while PENDING_REVIEW sends it back to DRAFT)"
        actor: Agronomist
        preconditions:
          - "Plan must be DRAFT or PENDING_REVIEW (ERR_PLAN_NOT_DRAFT)"
        side_effects:
          - "plan_lines replaced when supplied; provisional_value_cents recomputed"
          - "status returns to DRAFT when edited from PENDING_REVIEW (revision cycle)"
          - "increments PlanVersion.version by 1"
        note: "Revision loop: DRAFT -> PENDING_REVIEW -> DRAFT is an allowed cycle"
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /api/plans/{id}/activate"
        actor: Customer
        preconditions:
          - "Plan must be PENDING_REVIEW (ERR_PLAN_NOT_ACTIVATABLE)"
          - "Acting customer must own the plan's lawn (ERR_OWNERSHIP_MISMATCH)"
          - "Plan's soil_test_id must be ANALYZED (ERR_SOIL_TEST_NOT_ANALYZED)"
          - "Plan's lawn must be ACTIVE (ERR_LAWN_ARCHIVED)"
          - "OCC: expected_lawn_version must equal LawnProfile.version (ERR_STALE_VERSION)"
        side_effects:
          - "activated_at = logical clock"
          - "the lawn's previous ACTIVE plan (if any) flips to SUPERSEDED and this plan's supersedes_plan_id is set to it"
          - "increments PlanVersion.version by 1; increments LawnProfile.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another plan for the same lawn is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "the newly activated plan records supersedes_plan_id = this plan"
          - "increments PlanVersion.version by 1"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/subscriptions/{id}/status {to_status: PAUSED}"
        actor: Customer
        preconditions:
          - "Subscription must be ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "Acting customer must own the subscription (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "cascade: each of its ShipmentBoxes in SCHEDULED flips to HELD"
          - "cascade: each of its ApplicationTasks in SCHEDULED flips to FROZEN"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/status {to_status: ACTIVE}"
        actor: Customer
        preconditions:
          - "Subscription must be PAUSED (ERR_SUBSCRIPTION_NOT_PAUSED)"
          - "Acting customer must own the subscription (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "cascade: each of its ShipmentBoxes in HELD flips back to SCHEDULED"
          - "cascade: each of its ApplicationTasks in FROZEN flips back to SCHEDULED"
          - "increments Subscription.version by 1"
        note: "Pause/resume cycle ACTIVE <-> PAUSED is unlimited"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (POST /api/invoices/{id}/record-payment {outcome: FAILED} on one of its invoices)"
        actor: system
        preconditions:
          - "Invoice belongs to this subscription and transition ISSUED/FAILED -> FAILED fires"
        side_effects:
          - "increments Subscription.version by 1"
        note: "Boxes are NOT held on PAST_DUE; instead advance-fulfillment is rejected with ERR_SUBSCRIPTION_NOT_ACTIVE"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (POST /api/invoices/{id}/record-payment {outcome: SUCCEEDED} settles the failed invoice)"
        actor: system
        preconditions:
          - "Invoice belongs to this subscription and transitions to PAID"
        side_effects:
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "Subscription must not already be CANCELLED (ERR_SUBSCRIPTION_ALREADY_CANCELLED)"
          - "Acting customer must own the subscription (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "cascade: each ShipmentBox not in DELIVERED/SKIPPED/CANCELLED flips to CANCELLED"
          - "cascade: each such box cancellation flips its ISSUED Invoice to VOID and posts a RESTORE_VOID_INVOICE ledger entry returning that invoice's credit_applied_cents"
          - "cascade: each ApplicationTask not in APPLIED/CANCELLED flips to CANCELLED"
          - "cascade: each QUOTED/CONFIRMED AddOnOrder flips to CANCELLED"
          - "increments Subscription.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "Same as ACTIVE -> CANCELLED"
        side_effects:
          - "Same cascades as ACTIVE -> CANCELLED"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "Same as ACTIVE -> CANCELLED"
        side_effects:
          - "Same cascades as ACTIVE -> CANCELLED"

  - entity: ShipmentBox
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, SKIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PICKING
        trigger: "POST /api/shipments/{id}/advance-fulfillment {to_status: PICKING}"
        actor: FulfillmentOps
        preconditions:
          - "fulfillment_status must be SCHEDULED (ERR_INVALID_FULFILLMENT_TRANSITION)"
          - "Subscription must be ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "increments ShipmentBox.version by 1"
      - from: PICKING
        to: SHIPPED
        trigger: "POST /api/shipments/{id}/advance-fulfillment {to_status: SHIPPED}"
        actor: FulfillmentOps
        preconditions:
          - "fulfillment_status must be PICKING (ERR_INVALID_FULFILLMENT_TRANSITION)"
          - "Subscription must be ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "billing_status PENDING -> INVOICED"
          - "creates the Invoice (invoice_total_calc): status ISSUED, auto-redeems customer credit via a REDEEM_INVOICE ledger entry when credit_applied_cents > 0"
          - "increments ShipmentBox.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /api/shipments/{id}/advance-fulfillment {to_status: DELIVERED}"
        actor: FulfillmentOps
        preconditions:
          - "fulfillment_status must be SHIPPED (ERR_INVALID_FULFILLMENT_TRANSITION)"
        side_effects:
          - "delivered_at = logical clock; final_charge_cents computed (final variant uses delivered_at for the early-season discount)"
          - "cascade: each attached CONFIRMED AddOnOrder flips to FULFILLED"
          - "cascade: each ApplicationTask of this box in AWAITING_DELIVERY flips to SCHEDULED with scheduled_date = delivered_at date"
          - "increments ShipmentBox.version by 1"
      - from: SCHEDULED
        to: HELD
        trigger: "system (subscription pause cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ShipmentBox.version by 1"]
      - from: HELD
        to: SCHEDULED
        trigger: "system (subscription resume cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ShipmentBox.version by 1"]
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system (POST /api/subscriptions/{id}/skip-next-shipment selects this box)"
        actor: system
        preconditions: []
        side_effects: ["increments ShipmentBox.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "its ISSUED Invoice flips to VOID and a RESTORE_VOID_INVOICE ledger entry returns credit_applied_cents"
          - "increments ShipmentBox.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["same invoice-void cascade as SCHEDULED -> CANCELLED", "increments ShipmentBox.version by 1"]
      - from: PICKING
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["same invoice-void cascade as SCHEDULED -> CANCELLED", "increments ShipmentBox.version by 1"]
      - from: SHIPPED
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["its ISSUED Invoice flips to VOID and a RESTORE_VOID_INVOICE ledger entry returns credit_applied_cents", "increments ShipmentBox.version by 1"]
    note: "Parallel dimensions: fulfillment_status evolves via advance-fulfillment while billing_status evolves via invoice events; both live on the same row."

  - entity: ApplicationTask
    initial_state: SCHEDULED
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /api/applications/{id}/reschedule {new_date}"
        actor: Customer
        preconditions:
          - "Task must be SCHEDULED (ERR_APPLICATION_NOT_SCHEDULED)"
          - "Acting customer must own the task's subscription (ERR_OWNERSHIP_MISMATCH)"
          - "Weather gate must not block new_date (ERR_WEATHER_GATE_BLOCKED)"
          - "new_date must be inside the product window [window_start_date, window_end_date) (ERR_APPLICATION_WINDOW_VIOLATION)"
          - "new_date must respect the category buffer on the lawn (ERR_APPLICATION_BUFFER_CONFLICT)"
        side_effects:
          - "scheduled_date = new_date; snooze_count += 1"
          - "increments ApplicationTask.version by 1"
        note: "Self-loop reschedule is an allowed cycle; each reschedule bumps snooze_count"
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /api/applications/{id}/mark-applied"
        actor: Customer
        preconditions:
          - "Task must be SCHEDULED (ERR_APPLICATION_NOT_SCHEDULED)"
          - "Acting customer must own the task's subscription (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "applied_at = logical clock"
          - "increments ApplicationTask.version by 1"
      - from: SCHEDULED
        to: FROZEN
        trigger: "system (subscription pause cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationTask.version by 1"]
      - from: FROZEN
        to: SCHEDULED
        trigger: "system (subscription resume cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationTask.version by 1"]
      - from: AWAITING_DELIVERY
        to: SCHEDULED
        trigger: "system (parent box reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects:
          - "scheduled_date = box delivered_at date; window fields recomputed for that year"
          - "increments ApplicationTask.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationTask.version by 1"]
      - from: FROZEN
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationTask.version by 1"]
      - from: AWAITING_DELIVERY
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationTask.version by 1"]

  - entity: AddOnOrder
    initial_state: QUOTED
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /api/add-ons/{id}/confirm"
        actor: Customer
        preconditions:
          - "Add-on must be QUOTED (ERR_ADD_ON_NOT_QUOTED); a quote past quote_expires_at has already been flipped to EXPIRED by the clock sweep, so expiry reaches this transition only as the state error"
          - "Subscription must be ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "Acting customer must own the subscription (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "attaches to the subscription's earliest SCHEDULED ShipmentBox (selector: status SCHEDULED, ship_date ASC, tie-break created_at ASC; none -> stays CONFIRMED with attached_shipment_id null and attaches to the next box when one is created)"
          - "on attach: the box's provisional_charge_cents is recomputed including the add-on lines (box version increments)"
          - "increments AddOnOrder.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /api/add-ons/{id}/cancel"
        actor: Customer
        preconditions:
          - "Add-on must be QUOTED or CONFIRMED (ERR_ADD_ON_NOT_CANCELLABLE)"
          - "Acting customer must own the subscription (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "if attached: detaches from the box and the box's provisional_charge_cents is recomputed without the add-on (compensating action)"
          - "increments AddOnOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/add-ons/{id}/cancel"
        actor: Customer
        preconditions:
          - "Same as QUOTED -> CANCELLED"
        side_effects:
          - "Same detach-and-recompute compensation as QUOTED -> CANCELLED"
          - "increments AddOnOrder.version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "system (attached box reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects: ["increments AddOnOrder.version by 1"]
      - from: QUOTED
        to: EXPIRED
        trigger: "system (clock sweep: now >= quote_expires_at)"
        actor: system
        preconditions: []
        side_effects: ["increments AddOnOrder.version by 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments AddOnOrder.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (subscription cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["detach-and-recompute compensation", "increments AddOnOrder.version by 1"]

  - entity: SatisfactionClaim
    initial_state: FILED
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: FILED
        to: RESOLVED
        trigger: "POST /api/claims/{id}/resolve {resolution_type: RESHIP | CREDIT | REFUND}"
        actor: Agronomist
        preconditions:
          - "Claim must be FILED (ERR_CLAIM_NOT_FILED)"
          - "For resolution_type REFUND only: the shipment's billing_status must be PAID (ERR_SHIPMENT_NOT_PAID)"
        side_effects:
          - "branch RESHIP: creates a REPLACEMENT ShipmentBox (SCHEDULED, source_claim_id = this claim, lines copied from the original box, ship_date = logical clock) AND that box creation attaches any unattached CONFIRMED AddOnOrders of the subscription AND recomputes its provisional_charge_cents, AND creates one AWAITING_DELIVERY ApplicationTask per replacement line"
          - "branch CREDIT: credit_amount_cents = min(shipment.final_charge_cents, 10000); posts an EARN_SATISFACTION ledger entry to the customer"
          - "branch REFUND: flips the shipment's billing_status PAID -> VOID and posts a RESTORE_VOID_INVOICE entry only for credit_applied_cents (money already collected is returned out-of-band)"
          - "increments SatisfactionClaim.version by 1"
        note: "Branching fork: one trigger, three divergent side-effect sets selected by resolution_type"
      - from: FILED
        to: DENIED
        trigger: "POST /api/claims/{id}/resolve {resolution_type: DENY}"
        actor: Agronomist
        preconditions:
          - "Claim must be FILED (ERR_CLAIM_NOT_FILED)"
        side_effects:
          - "increments SatisfactionClaim.version by 1"

  - entity: Referral
    initial_state: PENDING
    terminal_states: [QUALIFIED, REVOKED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "system (the referee's first Invoice reaches PAID via POST /api/invoices/{id}/record-payment {outcome: SUCCEEDED})"
        actor: system
        preconditions:
          - "Referee has no earlier PAID invoice"
        side_effects:
          - "qualified_credit_cents computed (referral_credit_calc qualified variant); referee_first_invoice_id recorded"
          - "posts an EARN_REFERRAL ledger entry of qualified_credit_cents to the REFERRER"
          - "increments Referral.version by 1"
      - from: PENDING
        to: REVOKED
        trigger: "POST /api/referrals/{id}/revoke"
        actor: PlatformAdmin
        preconditions:
          - "Referral must be PENDING or QUALIFIED (ERR_REFERRAL_NOT_REVOKABLE)"
        side_effects:
          - "if it was QUALIFIED: posts a REVOKE_REFERRAL ledger entry of -qualified_credit_cents to the referrer (compensation)"
          - "increments Referral.version by 1"
      - from: QUALIFIED
        to: REVOKED
        trigger: "POST /api/referrals/{id}/revoke"
        actor: PlatformAdmin
        preconditions:
          - "Same as PENDING -> REVOKED"
        side_effects:
          - "posts a REVOKE_REFERRAL ledger entry of -qualified_credit_cents to the referrer (compensation)"
          - "increments Referral.version by 1"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{id}/record-payment {outcome: SUCCEEDED}"
        actor: PlatformAdmin
        preconditions:
          - "Invoice must be ISSUED or FAILED (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "box billing_status -> PAID"
          - "if the subscription is PAST_DUE: subscription -> ACTIVE"
          - "referral check: if the subscriber is the referee of a PENDING Referral and this is their first PAID invoice, that Referral qualifies (see Referral PENDING -> QUALIFIED)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: FAILED
        trigger: "POST /api/invoices/{id}/record-payment {outcome: FAILED}"
        actor: PlatformAdmin
        preconditions:
          - "Invoice must be ISSUED or FAILED (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "box billing_status -> FAILED"
          - "if the subscription is ACTIVE: subscription -> PAST_DUE"
          - "increments Invoice.version by 1"
      - from: FAILED
        to: PAID
        trigger: "POST /api/invoices/{id}/record-payment {outcome: SUCCEEDED}"
        actor: PlatformAdmin
        preconditions:
          - "Invoice must be ISSUED or FAILED (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "Same as ISSUED -> PAID (payment retry recovery loop)"
      - from: FAILED
        to: FAILED
        trigger: "POST /api/invoices/{id}/record-payment {outcome: FAILED}"
        actor: PlatformAdmin
        preconditions:
          - "Invoice must be ISSUED or FAILED (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "box billing_status stays FAILED; subscription stays PAST_DUE; increments Invoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "system (parent box cancellation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "posts RESTORE_VOID_INVOICE ledger entry of +credit_applied_cents when credit_applied_cents > 0"
          - "increments Invoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-activation-stale-lawn
    parent_entity: LawnProfile
    write_endpoint: "POST /api/plans/{id}/activate"
    occ_field: expected_lawn_version
    description: |
      Activating a plan against a LawnProfile whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another plan for the same lawn has just been activated (which legitimately
      supersedes the previously ACTIVE plan and bumps the lawn version), so the
      current writer's view of the lawn is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: subscription-patch-stale-version
    parent_entity: Subscription
    write_endpoint: "PATCH /api/subscriptions/{id}"
    occ_field: expected_subscription_version
    description: |
      Patching a Subscription whose version has advanced since the client last
      observed it is rejected. A pause/resume cycle or a payment-state cascade
      legitimately bumps the subscription version, so a patch carrying an older
      expected_subscription_version is operating on a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (8 calculations)
# =============================================================================
calculations:
  - name: plan_value_calc
    trigger: "plan create (provisional), PATCH /api/plans/{id} (provisional recompute), POST /api/subscriptions (committed lock)"
    algorithm: forward_looking
    formula: |
      provisional_value_cents = SUM over plan_lines of (qty_units x list_price_cents of the sku)
      committed_value_cents  = round_half_up(provisional_value_cents x (1 - discount_pct_locked))
      where discount_pct_locked = 0.10 when the subscribing billing_cycle is ANNUAL, else 0.00.
      committed_value_cents is null until a Subscription references this plan.
    input_set: "All plan_lines of the PlanVersion; catalog list prices of each sku"
    constants:
      ANNUAL_DISCOUNT_PCT: 0.10
      MONTHLY_DISCOUNT_PCT: 0.00
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "plan build / edit"
        difference: "list-price sum, no discount"
      - name: committed
        when: "subscription creation locks the billing-cycle discount"
        difference: "discounted value; identical lines yield a lower value whenever the discount is non-zero"

  - name: referral_credit_calc
    trigger: "customer registration with a valid referred_by_code (provisional); referee's first invoice reaching PAID (qualified)"
    algorithm: threshold
    formula: |
      provisional_credit_cents = 2000  (flat, while PENDING)
      qualified_credit_cents   = min(5000, round_half_up(0.20 x referee_first_paid_invoice.total_cents))
      Evaluation order pinned: invoice total_cents first (invoice_total_calc), then the
      20% share, then the 5000 cap. The qualified value REPLACES the provisional value;
      only the qualified amount is ever posted to the referrer's ledger.
    input_set: "The referee's first PAID Invoice (its total_cents)"
    constants:
      PROVISIONAL_FLAT_CENTS: 2000
      QUALIFIED_SHARE_PCT: 0.20
      QUALIFIED_CAP_CENTS: 5000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "referral PENDING"
        difference: "flat 2000 regardless of any invoice"
      - name: qualified
        when: "referee's first invoice PAID"
        difference: "20% of the paid invoice total, capped at 5000; equals the provisional 2000 only when the invoice total is exactly 10000"

  - name: shipment_charge_calc
    trigger: "box create, add-on attach/detach (provisional); box DELIVERED (final)"
    algorithm: tiered_pricing
    formula: |
      tier(lawn_size_sqm): t1 if size < 500; t2 if 500 <= size < 2000; t3 if size >= 2000
      product_part = SUM over lines of (qty_units x tier rate of the sku for the subscription's lawn tier)
      addon_part   = SUM over attached CONFIRMED AddOnOrders of (qty_units x add_on_flat_price_cents)
      pre_discount = product_part + addon_part
      discount_pct = 0.10 if ship_date month-day in [03-01, 06-01) else 0.00   (EARLY_SEASON)
      discounted   = round_half_up(pre_discount x (1 - discount_pct))
      charge_cents = min(25000, max(1900, discounted))
      Final variant: identical formula but the EARLY_SEASON test uses delivered_at
      instead of the planned ship_date, and the rate tier is re-read at delivery.
    input_set: "Box lines, attached CONFIRMED AddOnOrders, lawn size tier, ship_date (provisional) or delivered_at (final)"
    constants:
      EARLY_SEASON_DISCOUNT_PCT: 0.10
      MIN_CHARGE_CENTS: 1900
      MAX_CHARGE_CENTS: 25000
      TIER_T2_MIN_SQM: 500
      TIER_T3_MIN_SQM: 2000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "creation and add-on attach/detach"
        difference: "discount determined by planned ship_date"
      - name: final
        when: "box reaches DELIVERED"
        difference: "discount determined by actual delivered_at; a box planned inside the early window but delivered outside it (or vice versa) yields a different charge for identical lines"

  - name: invoice_total_calc
    trigger: "box SHIPPED (invoice creation)"
    algorithm: aggregation
    formula: |
      For each box line and each attached CONFIRMED add-on, build one invoice line:
        unit_price_cents  = tier rate of the sku for the lawn tier (products) or add_on_flat_price_cents (add-ons)
        line_discount_pct = EARLY_SEASON discount (0.10) if ship_date in [03-01, 06-01), else 0.00
        line_total_cents  = round_half_up(qty_units x unit_price_cents x (1 - line_discount_pct))   # ROUND PER LINE FIRST
      subtotal_cents       = SUM of line_total_cents                                             # THEN SUM
      credit_applied_cents = min(customer.credit_balance_cents at issue, subtotal_cents)
      total_cents          = subtotal_cents - credit_applied_cents
      PINNED ROUNDING ORDER: round each line to integer cents BEFORE summing. The alternative
      order (sum exact values, then round once) yields different cents and is non-conformant.
    input_set: "Box lines + attached CONFIRMED add-ons, catalog rates, customer credit balance at issue"
    constants:
      EARLY_SEASON_DISCOUNT_PCT: 0.10
    precision: "integer cents, round_half_up per line"

  - name: skip_allowance_calc
    trigger: "POST /api/subscriptions/{id}/skip-next-shipment"
    algorithm: threshold
    formula: |
      If skip_window_anchor is null OR logical_now >= skip_window_anchor + 365 days:
        reset skips_used_in_window to 0 and re-anchor at this skip's timestamp.
      Allowed when skips_used_in_window < 3 (the 3rd skip succeeds; the 4th is rejected
      with ERR_SKIP_ALLOWANCE_EXHAUSTED). On success: skips_used_in_window += 1 and the
      earliest SCHEDULED box (ship_date ASC, tie-break created_at ASC) flips to SKIPPED.
    input_set: "Subscription skip counters, logical clock"
    constants:
      MAX_SKIPS_PER_WINDOW: 3
      WINDOW_DAYS: 365
    precision: "integer counts; boundary is skips_used < 3 (>= 3 blocks)"

  - name: weather_gate_calc
    trigger: "application create, application reschedule, reminder evaluation"
    algorithm: threshold
    formula: |
      Advisory = WeatherAdvisory for (lawn.region, scheduled_date); absent advisory => not blocked.
      blocked = rain_probability >= 0.40 OR wind_kph > 24 OR temp_high_c < 5 OR temp_high_c > 32
      Boundary pins: rain 0.40 blocks (>=), 0.39 passes; wind 24 passes, 25 blocks (>);
      temp_high 5 and 32 pass, 4 and 33 block.
    input_set: "WeatherAdvisory for the lawn region on the scheduled date"
    constants:
      RAIN_BLOCK_PCT: 0.40
      WIND_BLOCK_KPH: 24
      TEMP_LOW_BLOCK_C: 5
      TEMP_HIGH_BLOCK_C: 32
    precision: "rain_probability compared at 2-decimal precision"

  - name: application_window_calc
    trigger: "application create and reschedule"
    algorithm: interval_merge
    formula: |
      Window for product sku in year Y: [window_start_md-Y, window_end_md-Y) — half-open:
      scheduled_date >= window_start_date AND scheduled_date < window_end_date.
      Buffer rule: for the same lawn, any existing ApplicationTask in SCHEDULED, FROZEN, or
      APPLIED whose product category conflicts with the new product's category (either
      direction of conflicting_categories) must satisfy ABS(new_date - existing_date) >=
      min_gap_days of the NEW product. |delta| == min_gap_days passes; |delta| == min_gap_days - 1
      fails with ERR_APPLICATION_BUFFER_CONFLICT.
    input_set: "CatalogProduct window fields; the lawn's non-terminal ApplicationTasks"
    constants:
      DEFAULT_MIN_GAP_DAYS: 14
    precision: "whole days; half-open window; >= gap passes"

  - name: credit_balance_calc
    trigger: "any CreditLedgerEntry insertion"
    algorithm: aggregation
    formula: |
      customer.credit_balance_cents = SUM of CreditLedgerEntry.amount_cents for that customer.
      INVARIANT (compensating pairs): a forward entry and its compensating entry leave the
      balance unchanged — EARN_REFERRAL(+q) followed by REVOKE_REFERRAL(-q) restores the
      prior balance; REDEEM_INVOICE(-c) followed by RESTORE_VOID_INVOICE(+c) restores it.
    input_set: "All CreditLedgerEntry rows of the customer (no status filter — the log is append-only)"
    constants: {}
    precision: "integer cents; balance never negative (redemption is min-capped at issue)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints except POST /api/customers/register"

  - priority: 2
    category: auth
    check: "Role must be permitted for the operation per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Entity-backed role ownership: acting Customer must own the target resource (directly or via lawn/subscription chain)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "customer-scoped writes and reads"

  - priority: 4
    category: existence
    check: "Path ids and body FK references must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource state preconditions (subscription ACTIVE/PAUSED, plan DRAFT/PENDING_REVIEW, shipment DELIVERED, task SCHEDULED, claim FILED, invoice ISSUED/FAILED, add-on QUOTED, customer ACTIVE, lawn not ARCHIVED)"
    error_id: "state-specific (ERR_SUBSCRIPTION_NOT_ACTIVE, ERR_PLAN_NOT_ACTIVATABLE, ERR_SHIPMENT_NOT_DELIVERED, ERR_APPLICATION_NOT_SCHEDULED, ERR_CLAIM_NOT_FILED, ERR_INVOICE_NOT_PAYABLE, ERR_ADD_ON_NOT_QUOTED, ERR_CUSTOMER_SUSPENDED, ERR_LAWN_ARCHIVED, ...)"
    http_status: 409
    applies_to: "state transition endpoints and state-guarded creates"

  - priority: 6
    category: business_safety
    check: "Weather gate: advisory on the scheduled date must not block application"
    error_id: ERR_WEATHER_GATE_BLOCKED
    http_status: 409
    applies_to: "POST /api/applications, POST /api/applications/{id}/reschedule"

  - priority: 7
    category: business_temporal
    check: "Temporal windows: application date inside product window; claim filed within 30 days of delivery"
    error_id: "ERR_APPLICATION_WINDOW_VIOLATION | ERR_CLAIM_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "application scheduling, claim filing"

  - priority: 8
    category: business_constraint
    check: "Constraint satisfaction: category buffer gap, delivery-window overlap, email/sku uniqueness, skip allowance quota, catalog sku resolvable and active"
    error_id: "ERR_APPLICATION_BUFFER_CONFLICT | ERR_DELIVERY_WINDOW_CONFLICT | ERR_EMAIL_TAKEN | ERR_SKU_TAKEN | ERR_SKIP_ALLOWANCE_EXHAUSTED | ERR_PRODUCT_NOT_FOUND | ERR_PRODUCT_INACTIVE | ERR_NO_SKIPPABLE_SHIPMENT"
    http_status: 409
    applies_to: "creates and skip"

  - priority: 9
    category: business_referential
    check: "Cross-entity referential state: plan's soil test ANALYZED at plan create/activate; subscription plan ACTIVE at subscription creation"
    error_id: "ERR_SOIL_TEST_NOT_ANALYZED | ERR_PLAN_NOT_ACTIVE_FOR_SUBSCRIPTION"
    http_status: 409
    applies_to: "POST /api/plans, POST /api/plans/{id}/activate, POST /api/subscriptions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; default logical time 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. Sweep side effects: (a) each ACTIVE subscription with auto_ship true and next_ship_date <= now generates a SEASONAL box from its ACTIVE plan's lines (ship_date = next_ship_date, delivery window [ship_date, ship_date+7d)) and advances next_ship_date by 90 days; (b) each QUOTED AddOnOrder with quote_expires_at <= now flips to EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string, boxes_generated: integer, add_ons_expired: integer }"
    side_effects: ["auto-ship sweep", "quote-expiry sweep"]

  # --- CatalogProduct ---
  - method: POST
    path: "/api/catalog/products"
    description: "Create a catalog product"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, category, list_price_cents, tier_t1_cents, tier_t2_cents, tier_t3_cents, "add_on_flat_price_cents?", window_start_md, window_end_md, "conflicting_categories?", "min_gap_days?", "active?"]
    output: CatalogProduct
    side_effects: ["sku uniqueness enforced (ERR_SKU_TAKEN)"]

  - method: GET
    path: "/api/catalog/products/{id}"
    description: "Get one catalog product"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: CatalogProduct
    side_effects: []

  - method: GET
    path: "/api/catalog/products"
    description: "List catalog products"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["category?", "active?", "limit?", "offset?"]
    output: "CatalogProduct[]"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/api/customers/register"
    description: "Register a customer; mints referral_code; when referred_by_code is valid, creates a PENDING Referral (provisional credit 2000)"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, climate_zone, "referred_by_code?"]
    output: Customer
    side_effects: ["credit_balance_cents = 0", "PENDING Referral created when referred_by_code resolves (ERR_REFERRAL_CODE_INVALID otherwise)", "email uniqueness (ERR_EMAIL_TAKEN)"]

  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/api/customers/{id}/status"
    description: "PlatformAdmin status control: ACTIVE <-> SUSPENDED, ACTIVE -> CHURNED"
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: Customer
    side_effects: ["Customer state machine transitions", "increments Customer.version by 1"]

  # --- LawnProfile ---
  - method: POST
    path: "/api/lawns"
    description: "Create a lawn profile (owner = customer_id, must equal X-User-ID)"
    roles: [Customer]
    code: 201
    input: [customer_id, label, lawn_size_sqm, grass_type, region]
    output: LawnProfile
    side_effects: ["customer must be ACTIVE (ERR_CUSTOMER_SUSPENDED)"]

  - method: GET
    path: "/api/lawns/{id}"
    description: "Get a lawn"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: LawnProfile
    side_effects: []

  - method: GET
    path: "/api/lawns"
    description: "List lawns, filterable by owner"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "LawnProfile[]"
    side_effects: []

  - method: PATCH
    path: "/api/lawns/{id}"
    description: "Update label/region, or archive with {status: ARCHIVED}"
    roles: [Customer]
    code: 200
    input: ["label?", "region?", "status?"]
    output: LawnProfile
    side_effects: ["archive precondition: no open ApplicationTasks (ERR_LAWN_HAS_OPEN_APPLICATIONS)", "increments LawnProfile.version by 1"]

  # --- SoilTestKit ---
  - method: POST
    path: "/api/soil-tests"
    description: "Order a soil test kit for a lawn (ships immediately)"
    roles: [Customer]
    code: 201
    input: [lawn_id]
    output: SoilTestKit
    side_effects: ["lawn must be ACTIVE (ERR_LAWN_ARCHIVED)", "status = KIT_SHIPPED"]

  - method: GET
    path: "/api/soil-tests/{id}"
    description: "Get a soil test kit"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: SoilTestKit
    side_effects: []

  - method: GET
    path: "/api/soil-tests"
    description: "List soil test kits"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: ["lawn_id?", "status?", "limit?", "offset?"]
    output: "SoilTestKit[]"
    side_effects: []

  - method: POST
    path: "/api/soil-tests/{id}/return-sample"
    description: "Customer marks the soil sample returned"
    roles: [Customer]
    code: 200
    input: []
    output: SoilTestKit
    side_effects: ["KIT_SHIPPED -> SAMPLE_RETURNED", "increments SoilTestKit.version by 1"]

  - method: POST
    path: "/api/soil-tests/{id}/lab-result"
    description: "Agronomist posts lab outcome: ANALYZED with lab fields, or REJECTED with rejection_reason (reships kit — resample cycle)"
    roles: [Agronomist]
    code: 200
    input: [outcome, "ph?", "nitrogen_ppm?", "phosphorus_ppm?", "potassium_ppm?", "organic_matter_pct?", "rejection_reason?"]
    output: SoilTestKit
    side_effects: ["ANALYZED: lab fields + analyzed_at recorded", "REJECTED: reship_count += 1, status back to KIT_SHIPPED", "increments SoilTestKit.version by 1"]

  # --- PlanVersion ---
  - method: POST
    path: "/api/plans"
    description: "Agronomist drafts a custom plan from an ANALYZED soil test"
    roles: [Agronomist]
    code: 201
    input: [lawn_id, soil_test_id, season_year, plan_lines]
    output: PlanVersion
    side_effects: ["soil test must be ANALYZED (ERR_SOIL_TEST_NOT_ANALYZED)", "every plan line sku must resolve to an active CatalogProduct (ERR_PRODUCT_NOT_FOUND / ERR_PRODUCT_INACTIVE)", "provisional_value_cents computed (plan_value_calc provisional)"]

  - method: GET
    path: "/api/plans/{id}"
    description: "Get a plan version"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: PlanVersion
    side_effects: []

  - method: GET
    path: "/api/plans"
    description: "List plan versions"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: ["lawn_id?", "soil_test_id?", "supersedes_plan_id?", "status?", "limit?", "offset?"]
    output: "PlanVersion[]"
    side_effects: []

  - method: POST
    path: "/api/plans/{id}/submit-review"
    description: "Move a DRAFT plan to PENDING_REVIEW"
    roles: [Agronomist]
    code: 200
    input: []
    output: PlanVersion
    side_effects: ["DRAFT -> PENDING_REVIEW", "increments PlanVersion.version by 1"]

  - method: PATCH
    path: "/api/plans/{id}"
    description: "Edit plan lines; editing a PENDING_REVIEW plan sends it back to DRAFT (revision cycle)"
    roles: [Agronomist]
    code: 200
    input: ["plan_lines?", "season_year?"]
    output: PlanVersion
    side_effects: ["provisional_value_cents recomputed", "PENDING_REVIEW -> DRAFT on edit", "increments PlanVersion.version by 1"]

  - method: POST
    path: "/api/plans/{id}/activate"
    description: "Customer activates a reviewed plan; supersedes the lawn's previous ACTIVE plan; OCC on LawnProfile.version"
    roles: [Customer]
    code: 200
    input: [expected_lawn_version]
    output: PlanVersion
    side_effects: ["PENDING_REVIEW -> ACTIVE", "previous ACTIVE plan -> SUPERSEDED with supersedes_plan_id chain", "activated_at = logical clock", "increments PlanVersion.version by 1", "increments LawnProfile.version by 1"]

  # --- Subscription ---
  - method: POST
    path: "/api/subscriptions"
    description: "Start a subscription on an ACTIVE plan"
    roles: [Customer]
    code: 201
    input: [customer_id, plan_id, billing_cycle, "auto_ship?", "next_ship_date?"]
    output: Subscription
    side_effects: ["plan must be ACTIVE (ERR_PLAN_NOT_ACTIVE_FOR_SUBSCRIPTION) and belong to the customer's lawn", "locks plan discount: committed_value_cents and discount_pct_locked written on the plan", "next_ship_date required when auto_ship is true (ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Get a subscription"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["customer_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: PATCH
    path: "/api/subscriptions/{id}"
    description: "Update auto_ship / billing_cycle / next_ship_date; OCC on Subscription.version"
    roles: [Customer]
    code: 200
    input: ["auto_ship?", "billing_cycle?", "next_ship_date?", expected_subscription_version]
    output: Subscription
    side_effects: ["increments Subscription.version by 1", "billing_cycle change re-locks the plan committed value"]

  - method: POST
    path: "/api/subscriptions/{id}/status"
    description: "Pause (ACTIVE->PAUSED) or resume (PAUSED->ACTIVE) with full box/task cascades"
    roles: [Customer]
    code: 200
    input: [to_status]
    output: Subscription
    side_effects: ["pause: SCHEDULED boxes -> HELD, SCHEDULED tasks -> FROZEN", "resume: HELD boxes -> SCHEDULED, FROZEN tasks -> SCHEDULED", "increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{id}/skip-next-shipment"
    description: "Skip the earliest SCHEDULED box; max 3 skips per rolling 365-day window"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["skip_allowance_calc", "selected box -> SKIPPED", "increments Subscription.version by 1"]

  - method: POST
    path: "/api/subscriptions/{id}/cancel"
    description: "Cancel a subscription; cascades to boxes, invoices, tasks, add-ons"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["non-terminal boxes -> CANCELLED", "their ISSUED invoices -> VOID with RESTORE_VOID_INVOICE ledger compensation", "non-terminal tasks -> CANCELLED", "QUOTED/CONFIRMED add-ons -> CANCELLED", "increments Subscription.version by 1"]

  # --- ShipmentBox ---
  - method: POST
    path: "/api/shipments"
    description: "Ops creates a SEASONAL or ADDON box for an ACTIVE subscription"
    roles: [FulfillmentOps, PlatformAdmin]
    code: 201
    input: [subscription_id, box_kind, ship_date, delivery_window_start, delivery_window_end, lines]
    output: ShipmentBox
    side_effects: ["subscription must be ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)", "delivery window must not overlap another non-terminal box's window on this subscription; half-open adjacency allowed (ERR_DELIVERY_WINDOW_CONFLICT)", "provisional_charge_cents computed (shipment_charge_calc provisional)", "billing_status = PENDING"]

  - method: GET
    path: "/api/shipments/{id}"
    description: "Get a shipment box"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: []
    output: ShipmentBox
    side_effects: []

  - method: GET
    path: "/api/shipments"
    description: "List shipment boxes"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "source_claim_id?", "fulfillment_status?", "box_kind?", "limit?", "offset?"]
    output: "ShipmentBox[]"
    side_effects: []

  - method: POST
    path: "/api/shipments/{id}/advance-fulfillment"
    description: "Advance fulfillment one step: SCHEDULED->PICKING->SHIPPED->DELIVERED (to_status must be the immediate next state)"
    roles: [FulfillmentOps]
    code: 200
    input: [to_status]
    output: ShipmentBox
    side_effects: ["SHIPPED: creates ISSUED invoice (invoice_total_calc), billing_status -> INVOICED, auto-redeems credit", "DELIVERED: delivered_at + final_charge_cents; attached add-ons -> FULFILLED; AWAITING_DELIVERY tasks -> SCHEDULED", "increments ShipmentBox.version by 1"]

  # --- ApplicationTask ---
  - method: POST
    path: "/api/applications"
    description: "Schedule an application of a delivered product"
    roles: [Customer]
    code: 201
    input: [subscription_id, shipment_id, product_sku, scheduled_date]
    output: ApplicationTask
    side_effects: ["shipment must be DELIVERED (ERR_SHIPMENT_NOT_DELIVERED) and belong to the subscription", "weather gate (ERR_WEATHER_GATE_BLOCKED)", "product window (ERR_APPLICATION_WINDOW_VIOLATION)", "category buffer (ERR_APPLICATION_BUFFER_CONFLICT)", "window fields computed from catalog"]

  - method: GET
    path: "/api/applications/{id}"
    description: "Get an application task"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: ApplicationTask
    side_effects: []

  - method: GET
    path: "/api/applications"
    description: "List application tasks"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: ["lawn_id?", "subscription_id?", "shipment_id?", "status?", "limit?", "offset?"]
    output: "ApplicationTask[]"
    side_effects: []

  - method: POST
    path: "/api/applications/{id}/reschedule"
    description: "Reschedule a SCHEDULED task (self-loop); validates weather gate, window, buffer"
    roles: [Customer]
    code: 200
    input: [new_date]
    output: ApplicationTask
    side_effects: ["scheduled_date = new_date, snooze_count += 1", "increments ApplicationTask.version by 1"]

  - method: POST
    path: "/api/applications/{id}/mark-applied"
    description: "Customer confirms the product was applied"
    roles: [Customer]
    code: 200
    input: []
    output: ApplicationTask
    side_effects: ["SCHEDULED -> APPLIED, applied_at = logical clock", "increments ApplicationTask.version by 1"]

  - method: GET
    path: "/api/applications/{id}/reminder"
    description: "Computed read: whether an application reminder should fire for the task's scheduled_date given the weather gate and window"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: "{ reminder_recommended: boolean, blocking_reasons: string[] }"
    side_effects: []

  # --- WeatherAdvisory ---
  - method: POST
    path: "/api/weather-advisories"
    description: "Upsert a weather advisory for (region, date)"
    roles: [PlatformAdmin]
    code: 201
    input: [region, date, rain_probability, wind_kph, temp_high_c]
    output: WeatherAdvisory
    side_effects: ["existing advisory for (region, date) is replaced"]

  - method: GET
    path: "/api/weather-advisories"
    description: "List weather advisories"
    roles: [Customer, Agronomist, FulfillmentOps, PlatformAdmin]
    code: 200
    input: ["region?", "date?", "limit?", "offset?"]
    output: "WeatherAdvisory[]"
    side_effects: []

  # --- AddOnOrder ---
  - method: POST
    path: "/api/add-ons"
    description: "Quote a pest/weed add-on for a subscription"
    roles: [Customer]
    code: 201
    input: [subscription_id, add_on_sku, qty_units]
    output: AddOnOrder
    side_effects: ["subscription must be ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)", "sku must be an active PEST/WEED CatalogProduct with add_on_flat_price_cents (ERR_PRODUCT_NOT_FOUND / ERR_PRODUCT_INACTIVE / ERR_NOT_AN_ADD_ON_SKU)", "quoted_price_cents computed", "quote_expires_at = logical clock + 7 days"]

  - method: GET
    path: "/api/add-ons/{id}"
    description: "Get an add-on order"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: AddOnOrder
    side_effects: []

  - method: GET
    path: "/api/add-ons"
    description: "List add-on orders"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "attached_shipment_id?", "status?", "limit?", "offset?"]
    output: "AddOnOrder[]"
    side_effects: []

  - method: POST
    path: "/api/add-ons/{id}/confirm"
    description: "Confirm a QUOTED add-on; attaches to the earliest SCHEDULED box and recomputes its charge"
    roles: [Customer]
    code: 200
    input: []
    output: AddOnOrder
    side_effects: ["QUOTED -> CONFIRMED", "attach selector: subscription's SCHEDULED boxes, ship_date ASC, tie-break created_at ASC; none -> attach deferred to next created box", "attached box provisional_charge_cents recomputed (box version increments)", "increments AddOnOrder.version by 1"]

  - method: POST
    path: "/api/add-ons/{id}/cancel"
    description: "Cancel a QUOTED/CONFIRMED add-on; detaches and recomputes the box charge (compensation)"
    roles: [Customer]
    code: 200
    input: []
    output: AddOnOrder
    side_effects: ["detach compensation recomputes attached box provisional_charge_cents", "increments AddOnOrder.version by 1"]

  # --- Invoice ---
  - method: GET
    path: "/api/invoices/{id}"
    description: "Get an invoice"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/invoices"
    description: "List invoices"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "shipment_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/api/invoices/{id}/record-payment"
    description: "Record a payment outcome; FAILED pushes the subscription to PAST_DUE, SUCCEEDED recovers it and may qualify a referral"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: Invoice
    side_effects: ["SUCCEEDED: invoice -> PAID, box billing -> PAID, PAST_DUE subscription -> ACTIVE, referee-first-paid referral qualification", "FAILED: invoice -> FAILED, box billing -> FAILED, ACTIVE subscription -> PAST_DUE", "increments Invoice.version by 1"]

  # --- SatisfactionClaim ---
  - method: POST
    path: "/api/claims"
    description: "File a satisfaction claim on a delivered box within 30 days of delivery"
    roles: [Customer]
    code: 201
    input: [subscription_id, shipment_id, claim_reason, "evidence_url?"]
    output: SatisfactionClaim
    side_effects: ["shipment must be DELIVERED (ERR_SHIPMENT_NOT_DELIVERED)", "filed within 30 days of delivered_at (ERR_CLAIM_WINDOW_EXPIRED)"]

  - method: GET
    path: "/api/claims/{id}"
    description: "Get a claim"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: []
    output: SatisfactionClaim
    side_effects: []

  - method: GET
    path: "/api/claims"
    description: "List claims"
    roles: [Customer, Agronomist, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "shipment_id?", "status?", "limit?", "offset?"]
    output: "SatisfactionClaim[]"
    side_effects: []

  - method: POST
    path: "/api/claims/{id}/resolve"
    description: "Agronomist resolves a claim; resolution_type RESHIP | CREDIT | REFUND | DENY selects the side-effect branch"
    roles: [Agronomist]
    code: 200
    input: [resolution_type]
    output: SatisfactionClaim
    side_effects: ["RESHIP: replacement box + add-on attach + charge recompute + AWAITING_DELIVERY tasks", "CREDIT: EARN_SATISFACTION ledger entry of min(final_charge_cents, 10000)", "REFUND: PAID box billing -> VOID with credit restore", "increments SatisfactionClaim.version by 1"]

  # --- Referral ---
  - method: GET
    path: "/api/referrals/{id}"
    description: "Get a referral"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/api/referrals"
    description: "List referrals"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["referrer_customer_id?", "referee_customer_id?", "referee_first_invoice_id?", "status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  - method: POST
    path: "/api/referrals/{id}/revoke"
    description: "PlatformAdmin revokes a referral; QUALIFIED referrals post a clawback ledger entry"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: ["QUALIFIED -> REVOKED posts REVOKE_REFERRAL -qualified_credit_cents to the referrer", "increments Referral.version by 1"]

  # --- CreditLedgerEntry ---
  - method: GET
    path: "/api/credit-ledger/{id}"
    description: "Get one ledger entry"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: CreditLedgerEntry
    side_effects: []

  - method: GET
    path: "/api/credit-ledger"
    description: "List ledger entries"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "entry_type?", "limit?", "offset?"]
    output: "CreditLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/api/credit-ledger/adjustments"
    description: "PlatformAdmin posts a manual ADJUSTMENT entry (positive or negative)"
    roles: [PlatformAdmin]
    code: 201
    input: [customer_id, amount_cents, "note?"]
    output: CreditLedgerEntry
    side_effects: ["customer credit_balance_cents recomputed (credit_balance_calc)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.5 roles" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Acting Customer does not own the target resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, or next_ship_date absent while auto_ship is true" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id does not exist" }
  - { id: ERR_LAWN_NOT_FOUND, http: 404, condition: "lawn id does not exist" }
  - { id: ERR_SOIL_TEST_NOT_FOUND, http: 404, condition: "soil test id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "plan id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application task id does not exist" }
  - { id: ERR_ADD_ON_NOT_FOUND, http: 404, condition: "add-on order id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoice id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "referral id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "referenced product sku does not exist in the catalog" }
  - { id: ERR_PRODUCT_INACTIVE, http: 409, condition: "referenced product sku exists but active is false" }
  - { id: ERR_NOT_AN_ADD_ON_SKU, http: 422, condition: "add-on sku is not category PEST or WEED, or lacks add_on_flat_price_cents" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "registration email already registered (case-insensitive)" }
  - { id: ERR_SKU_TAKEN, http: 409, condition: "catalog sku already exists" }
  - { id: ERR_REFERRAL_CODE_INVALID, http: 422, condition: "referred_by_code does not resolve to any customer's referral_code" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "customer is SUSPENDED; creates are blocked" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE_FOR_STATUS, http: 409, condition: "status change requires customer ACTIVE" }
  - { id: ERR_CUSTOMER_NOT_SUSPENDED, http: 409, condition: "reinstate requires customer SUSPENDED" }
  - { id: ERR_SUBSCRIPTIONS_STILL_OPEN, http: 409, condition: "churn requires all of the customer's subscriptions CANCELLED" }
  - { id: ERR_LAWN_ARCHIVED, http: 409, condition: "operation requires an ACTIVE lawn" }
  - { id: ERR_LAWN_HAS_OPEN_APPLICATIONS, http: 409, condition: "archive blocked by ApplicationTasks in SCHEDULED/FROZEN/AWAITING_DELIVERY" }
  - { id: ERR_SOIL_TEST_NOT_SHIPPED, http: 409, condition: "return-sample requires KIT_SHIPPED" }
  - { id: ERR_SOIL_TEST_NOT_RETURNED, http: 409, condition: "lab-result requires SAMPLE_RETURNED" }
  - { id: ERR_SOIL_TEST_NOT_ANALYZED, http: 409, condition: "plan create/activate requires an ANALYZED soil test" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "submit-review/edit requires DRAFT (edit also accepts PENDING_REVIEW)" }
  - { id: ERR_PLAN_NOT_ACTIVATABLE, http: 409, condition: "activate requires PENDING_REVIEW" }
  - { id: ERR_PLAN_NOT_ACTIVE_FOR_SUBSCRIPTION, http: 409, condition: "subscription creation requires an ACTIVE plan" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "operation requires subscription ACTIVE" }
  - { id: ERR_SUBSCRIPTION_NOT_PAUSED, http: 409, condition: "resume requires subscription PAUSED" }
  - { id: ERR_SUBSCRIPTION_ALREADY_CANCELLED, http: 409, condition: "operation on a CANCELLED subscription" }
  - { id: ERR_SKIP_ALLOWANCE_EXHAUSTED, http: 422, condition: "3 skips already used in the current rolling 365-day window" }
  - { id: ERR_NO_SKIPPABLE_SHIPMENT, http: 409, condition: "no SCHEDULED box exists to skip" }
  - { id: ERR_INVALID_FULFILLMENT_TRANSITION, http: 409, condition: "to_status is not the immediate next fulfillment state" }
  - { id: ERR_DELIVERY_WINDOW_CONFLICT, http: 409, condition: "delivery window overlaps another non-terminal box's window on the subscription (half-open adjacency allowed)" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "operation requires the shipment DELIVERED" }
  - { id: ERR_APPLICATION_NOT_SCHEDULED, http: 409, condition: "reschedule/mark-applied requires task SCHEDULED" }
  - { id: ERR_APPLICATION_WINDOW_VIOLATION, http: 422, condition: "scheduled date outside the product's half-open application window" }
  - { id: ERR_APPLICATION_BUFFER_CONFLICT, http: 409, condition: "conflicting-category application on the same lawn inside the min-gap buffer" }
  - { id: ERR_WEATHER_GATE_BLOCKED, http: 409, condition: "weather advisory blocks the scheduled date (rain >= 0.40, wind > 24, temp out of [5, 32])" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "claim filed more than 30 days after delivery" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "resolve requires claim FILED" }
  - { id: ERR_ADD_ON_NOT_QUOTED, http: 409, condition: "confirm requires add-on QUOTED" }
  - { id: ERR_ADD_ON_NOT_CANCELLABLE, http: 409, condition: "cancel requires add-on QUOTED or CONFIRMED" }
  - { id: ERR_SHIPMENT_NOT_PAID, http: 409, condition: "REFUND resolution requires the shipment's billing_status PAID" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "record-payment requires invoice ISSUED or FAILED" }
  - { id: ERR_REFERRAL_NOT_REVOKABLE, http: 409, condition: "revoke requires referral PENDING or QUALIFIED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers/register"
    shared_operations: []

  - name: Customer
    description: "Subscribing homeowner; owns lawns, subscriptions, applications, claims, add-ons"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/lawns, PATCH /api/lawns/{id}"
      - "POST /api/soil-tests, POST /api/soil-tests/{id}/return-sample"
      - "POST /api/plans/{id}/activate"
      - "POST /api/subscriptions, PATCH /api/subscriptions/{id}, POST /api/subscriptions/{id}/status, POST /api/subscriptions/{id}/skip-next-shipment, POST /api/subscriptions/{id}/cancel"
      - "POST /api/applications, POST /api/applications/{id}/reschedule, POST /api/applications/{id}/mark-applied"
      - "POST /api/add-ons, POST /api/add-ons/{id}/confirm, POST /api/add-ons/{id}/cancel"
      - "POST /api/claims"
    shared_operations:
      - "GET reads of own resources (ownership-checked)"

  - name: Agronomist
    description: "Lab and plan specialist; resolves satisfaction claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/soil-tests/{id}/lab-result"
      - "POST /api/plans, POST /api/plans/{id}/submit-review, PATCH /api/plans/{id}"
      - "POST /api/claims/{id}/resolve"
    shared_operations:
      - "GET reads of plans, soil tests, applications, claims, catalog, weather"

  - name: FulfillmentOps
    description: "Warehouse operator; creates boxes and advances fulfillment"
    identity: opaque
    exclusive_operations:
      - "POST /api/shipments"
      - "POST /api/shipments/{id}/advance-fulfillment"
    shared_operations:
      - "GET reads of subscriptions, shipments, catalog, weather, lawns"

  - name: PlatformAdmin
    description: "Operator with override power over config, catalog, clock, payments, customers, referrals, ledger"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/catalog/products"
      - "POST /api/weather-advisories"
      - "POST /api/customers/{id}/status"
      - "POST /api/invoices/{id}/record-payment"
      - "POST /api/referrals/{id}/revoke"
      - "POST /api/credit-ledger/adjustments"
    shared_operations:
      - "POST /api/shipments (shared with FulfillmentOps)"
      - "GET reads of all resources"
