  - rule_id: non_linear_state_machine
    instances:
      - name: committee_remand_cycle_returns_to_exception_review
        grounds:
          - state_machines.LoanApplication.COMMITTEE_REVIEW_to_EXCEPTION_REVIEW
          - state_machines.LoanApplication.COMMITTEE_REVIEW_to_TERM_SHEET_NEGOTIATION
          - state_machines.CommitteeDecision.OPEN_to_REMANDED
          - calculations.committee_quorum_rule
        distinguishing_aspect: |
          LoanApplication machine (branching with a remand CYCLE): the chair's
          REMAND vote moves the application COMMITTEE_REVIEW -> EXCEPTION_REVIEW,
          and the application travels EXCEPTION_REVIEW -> APPRAISAL_REVIEW ->
          COMMITTEE_REVIEW a second time with a FRESH CommitteeDecision, which
          then approves. A purely linear pipeline cannot express the revisit;
          the test also proves the remand does not resurrect the first
          (terminal REMANDED) decision.
        test_recipe:
          setup:
            - "Application at COMMITTEE_REVIEW, proposed == 200,000,000 (STANDARD level: quorum 2 of 3), one ACCEPTED appraisal (appraised 400,000,000), zero OPEN exceptions"
            - "STANDARD session S1 2026-08-10T14:00-15:30Z, logical clock inside the window; decision D1 open"
