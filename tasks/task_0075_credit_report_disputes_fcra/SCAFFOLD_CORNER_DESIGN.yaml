            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${filer3}", furnisher_id: "${fr3}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fr3}"
              captures: { tlr3: $.data.id }
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${filer3}", tradeline_id: "${tlr3}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${filer3_v}" }
              as: Consumer
              as_user_id: "${r3b}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 403 and $.data.error_id == 'ERR_NOT_RESOURCE_OWNER'"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[freeze-place-stale-file]
          - entities.CreditFile.fields.version
        distinguishing_aspect: "Placing a freeze with the correct expected_credit_file_version succeeds and CreditFile.version increments by 1."
        test_recipe:
          setup: ["A fresh OPEN file at version 1."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "y1@x.com", full_name: "Y One", ssn_last4: "7001" }
              as: Anonymous
              captures: { y1: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${y1}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filey1: $.data.id, filey1_v: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
          trigger:
            - call: "POST /security-freezes"
              payload: { credit_file_id: "${filey1}", freeze_type: "LOCK", effective_at: "2026-01-05T00:00:00.000Z", expected_credit_file_version: "${filey1_v}" }
              as: Consumer
              as_user_id: "${y1}"
              captures: { frzy1: $.data.id }
            - call: "GET /credit-files/${filey1}"
              payload: {}
              as: CreditBureau
              captures: { filey1_v_after: $.data.version }
          assert:
            - "Response status == 201 and SecurityFreeze.${frzy1}.status == 'ACTIVE'"
            - "CreditFile.${filey1}.version == 2 (incremented from 1)"

      - name: dispute_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispute-create-stale-file]
          - entities.CreditFile.fields.version
        distinguishing_aspect: "Filing a dispute with a stale expected_credit_file_version (one behind the current) -> ERR_STALE_FILE_VERSION (412)."
        test_recipe:
          setup: ["A file whose version was bumped by a freeze after the client read it."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "y2@x.com", full_name: "Y Two", ssn_last4: "7002" }
              as: Anonymous
              captures: { y2: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank Y2", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fy2: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${y2}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filey2: $.data.id, filey2_v0: $.data.version }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: CreditBureau
            - call: "POST /tradelines"
              payload: { credit_file_id: "${filey2}", furnisher_id: "${fy2}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2021-01-01T00:00:00.000Z", reported_delinquency_date: "2021-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fy2}"
              captures: { tly2: $.data.id }
            - call: "POST /security-freezes"
              payload: { credit_file_id: "${filey2}", freeze_type: "LOCK", effective_at: "2026-01-05T00:00:00.000Z", expected_credit_file_version: "${filey2_v0}" }
              as: Consumer
              as_user_id: "${y2}"
          trigger:
            - call: "POST /disputes"
              payload: { credit_file_id: "${filey2}", tradeline_id: "${tly2}", dispute_reason: "NOT_MINE", clock_mode: "CALENDAR", expected_credit_file_version: "${filey2_v0}" }
              as: Consumer
              as_user_id: "${y2}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412 and $.data.error_id == 'ERR_STALE_FILE_VERSION'"

      - name: reage_event_appended_on_direct_furnisher_reage
        claim_type: derived_field_reconciliation
        grounds: [endpoints, entities.ReageEvent.fields.tradeline_id, entities.ReageEvent.fields.source_dispute_id]
        distinguishing_aspect: "A direct furnisher reage appends a ReageEvent with source_dispute_id null, discoverable via GET /tradelines/{id}/reage-events."
        test_recipe:
          setup: ["A tradeline; furnisher then re-ages it directly."]
          setup_api_calls:
            - call: "POST /consumers"
              payload: { email: "y3@x.com", full_name: "Y Three", ssn_last4: "7003" }
              as: Anonymous
              captures: { y3: $.data.id }
            - call: "POST /furnishers"
              payload: { name: "Bank Y3", furnisher_type: "BANK" }
              as: Anonymous
              captures: { fy3: $.data.id }
            - call: "POST /credit-files"
              payload: { consumer_id: "${y3}", bureau_code: "EQUIFAX" }
              as: CreditBureau
              captures: { filey3: $.data.id }
            - call: "POST /tradelines"
              payload: { credit_file_id: "${filey3}", furnisher_id: "${fy3}", account_type: "REVOLVING", balance_cents: 20000, date_of_first_delinquency: "2020-03-01T00:00:00.000Z", reported_delinquency_date: "2020-03-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fy3}"
              captures: { tly3: $.data.id }
          trigger:
            - call: "POST /tradelines/${tly3}/reage"
              payload: { reported_delinquency_date: "2022-01-01T00:00:00.000Z" }
              as: Furnisher
              as_user_id: "${fy3}"
            - call: "GET /tradelines/${tly3}/reage-events"
              payload: {}
              as: Furnisher
              as_user_id: "${fy3}"
          assert:
            - "Response response_type 'array', total_count == 1, data[0].was_violation == true, data[0].source_dispute_id == null"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_cascade_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Dispute.REVERIFYING_to_RESOLVED_DELETE, calculations.open_counts_recompute]
        distinguishing_aspect: "The DELETE respond response and an immediate GET on the file reflect the cascade (tradeline DELETED, counts dropped) in the same request cycle — no eventual lag."
        excluded_because:
          difficulty_instance: transitive_cascade / furnisher_delete_cascade_depth3
          rationale: "The depth-3 DELETE cascade and its immediate visibility on CreditFile counts are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: file_frozen_blocks_dispute_create_stub
        claim_type: guarded_transition
        grounds:
          - validations[priority=8]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / dispute_create_blocked_by_frozen_file
          rationale: "FROZEN-file blocking dispute creation is the asserted failure path of the named §1.8 instance."
      - name: furnisher_suspended_blocks_reverification_stub
        claim_type: guarded_transition
        grounds:
          - validations[priority=9]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reverification_blocked_by_suspended_furnisher
          rationale: "SUSPENDED-furnisher blocking reverification dispatch is the asserted failure path of the named §1.8 instance."
      - name: freeze_overlap_same_type_stub
        claim_type: invalid_transition
        grounds:
          - validations[priority=14]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / freeze_same_type_interval_overlap
          rationale: "Same-type overlapping freeze rejection is asserted by the named §1.8 instance."
