        grounds:
          - errors[ERR_CLAIM_STATE_INVALID]
          - errors[ERR_VERIFIED_UNITS_MISMATCH]
          - errors[ERR_EVIDENCE_REQUEST_LIMIT]
          - validations[priority 9 -> ERR_CLAIM_STATE_INVALID]
          - validations[priority 15 -> ERR_VERIFIED_UNITS_MISMATCH]
          - validations[priority 15 -> ERR_EVIDENCE_REQUEST_LIMIT]
          - state_machines.Claim.UNDER_REVIEW_to_EVIDENCE_REQUESTED
        distinguishing_aspect: >
          The decision endpoint refuses five different ways on one claim: deciding a SUBMITTED
          claim gives the priority-9 ERR_CLAIM_STATE_INVALID (which permanently shadows the
          priority-15 ERR_EVIDENCE_INSUFFICIENT, since reaching UNDER_REVIEW already requires two
          evidence items), each of APPROVE/PARTIALLY_APPROVE/DENY with an inconsistent
          verified_units gives ERR_VERIFIED_UNITS_MISMATCH, and the third REQUEST_EVIDENCE gives
