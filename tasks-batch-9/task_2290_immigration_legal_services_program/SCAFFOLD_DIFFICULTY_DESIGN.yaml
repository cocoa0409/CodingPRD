              payload: { representative_id: "${arep_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS", "EOIR_IMMIGRATION_COURT"] }
              as: ProgramDirector
              captures: { acc_id: "$.data.id" }
            - call: "POST /accreditations/${acc_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
