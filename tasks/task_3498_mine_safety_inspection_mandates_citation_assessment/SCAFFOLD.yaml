# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3498_mine_safety_inspection_mandates_citation_assessment
# Domain: statutory mine-safety inspection program (MSHA-style)
# =============================================================================

scenario: |
  Mine Safety Inspection Mandates & Citation Assessment (Mine Safety and Health Administration): statutory inspection frequency requirements with underground and surface mine cycles that must be completed regardless of resources, inspector assignment, conflict avoidance and mine file review before entry, citation and order issuance with negligence and gravity determinations feeding penalty computation, imminent danger orders requiring immediate withdrawal of miners with abatement verification, pattern of violations screening leading to heightened enforcement consequences, operator contest and hearing procedures before an independent review commission, mine plan approvals for ventilation, roof control and emergency response with periodic revision, accident investigation and root cause analysis with public reports

domain_name: mine-safety-inspection
api_prefix: /msha

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat           # peer entities joined by FK references; no nested ownership URLs except convenience sub-resource reads
  state_machine_shape: parallel   # Citation and Mine each carry two independent state axes; Inspection/Mine also cycle
  relationship_patterns:
    - one_to_many
    - self_referential            # MinePlan.supersedes_plan_id
    - cross_aggregate             # PenaltyAssessment reads Operator tonnage; POV reads Citation+ImminentDangerOrder
  role_model: segregation_of_duties   # abatement verifier must differ from issuing inspector; commission is a separate role family
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Operator legal name" }
      - { name: annual_tonnage_tons, type: integer, source: input, description: "Annual production tonnage; feeds size_points. Constraints: integer >= 0" }
      - { name: home_district, type: string, source: input, description: "MSHA district code of record" }

  - name: Mine
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; owning operator" }
      - { name: mine_name, type: string, source: input, description: "Mine name" }
      - { name: mine_type, type: enum, source: input, description: "UNDERGROUND | SURFACE. Drives statutory cycle length and required plan types" }
      - { name: activation_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the mine became subject to the act; first inspection cycle starts on this date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | IDLED. IDLED mines remain subject to statutory inspection cycles" }
      - { name: production_status, type: enum, source: computed, default: NORMAL, description: "NORMAL | HALTED. HALTED while any ImminentDangerOrder at this mine is not TERMINATED" }
      - { name: pov_status, type: enum, source: computed, default: NONE, description: "NONE | POTENTIAL_POV | POV_FINAL. Pattern-of-violations posture" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: badge_number, type: string, source: input, description: "Unique badge identifier. Constraints: unique across Inspectors" }
      - { name: district_code, type: string, source: input, description: "Home district" }
      - { name: certification, type: enum, source: input, description: "UNDERGROUND | SURFACE | BOTH. Gates assignment by mine_type" }
      - { name: conflicted_operator_ids, type: array, source: input, default: [], description: "Array of Operator.id values the inspector is conflicted for (prior employment, financial interest)" }

  - name: InspectionCycle
    parent: null
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; cycle owner" }
      - { name: cycle_index, type: integer, source: computed, description: "1-based ordinal of this cycle within the mine" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive. Must equal mine.activation_date for cycle_index 1, else prior period_end + 1 day" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive. Must be period_start + 89 days for UNDERGROUND mines, + 179 days for SURFACE mines" }
      - { name: required_inspections, type: integer, source: computed, default: 1, description: "REGULAR inspections required this cycle. 1 by statute; +1 on every OPEN cycle while mine enters POV_FINAL" }
      - { name: completed_inspections, type: integer, source: computed, default: 0, description: "COMPLETED REGULAR inspections credited to this cycle (oldest-DELINQUENT-first crediting)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | COMPLIANT | DELINQUENT | CURED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; inspected mine" }
      - { name: cycle_id, type: string, source: input, description: "FK -> InspectionCycle.id; required iff kind == REGULAR, else must be omitted/null" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector" }
      - { name: kind, type: enum, source: input, description: "REGULAR | SPOT | FOLLOW_UP | ACCIDENT_INVESTIGATION" }
      - { name: accident_id, type: string, source: input, description: "FK -> Accident.id; required iff kind == ACCIDENT_INVESTIGATION, else must be omitted/null" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned entry timestamp; planned window occupies [planned_start_at, planned_end_at) half-open" }
      - { name: planned_end_at, type: datetime, source: input, description: "Planned exit timestamp; must be strictly after planned_start_at" }
      - { name: file_reviewed_at, type: datetime, source: system, description: "When the assigned inspector completed the pre-entry mine-file review; null until file-review" }
      - { name: actual_entry_at, type: datetime, source: system, description: "Set on start" }
      - { name: completed_at, type: datetime, source: system, description: "Set on complete" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | FILE_REVIEWED | IN_PROGRESS | SUSPENDED | COMPLETED | CANCELLED" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the inspection during which the citation was issued. Null only for system-issued late-report citations" }
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; cited mine" }
      - { name: issued_by_inspector_id, type: string, source: system, description: "FK -> Inspector.id; issuing inspector (X-User-ID). Null only for system-issued late-report citations" }
      - { name: standard_code, type: string, source: input, description: "Cited standard, e.g. '30 CFR 75.370'" }
      - { name: kind, type: enum, source: input, description: "CITATION | ORDER" }
      - { name: negligence, type: enum, source: input, description: "NONE | LOW | MODERATE | HIGH | RECKLESS_DISREGARD" }
      - { name: gravity_likelihood, type: enum, source: input, description: "UNLIKELY | REASONABLY_LIKELY | HIGHLY_LIKELY" }
      - { name: gravity_severity, type: enum, source: input, description: "NO_INJURY | MINOR | SERIOUS | FATAL_POTENTIAL" }
      - { name: persons_affected, type: integer, source: input, description: "Persons exposed. Constraints: integer >= 1" }
      - { name: significant_and_substantial, type: boolean, source: input, description: "S&S designation" }
      - { name: repeat_violation, type: boolean, source: input, description: "True when the same standard was cited at this mine before; applies the 1.15 repeat multiplier" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: abatement_base_days, type: integer, source: computed, description: "From gravity_severity: NO_INJURY 30 | MINOR 15 | SERIOUS 5 | FATAL_POTENTIAL 1" }
      - { name: abatement_deadline, type: datetime, source: computed, description: "issued_at + abatement_base_days (+ ceil(base/2) once if extended)" }
      - { name: abatement_extended, type: boolean, source: system, default: false, description: "True after a successful extend-abatement" }
      - { name: abated_at, type: datetime, source: system, description: "Set when operator reports abatement" }
      - { name: verified_at, type: datetime, source: system, description: "Set on verify-abatement" }
      - { name: verified_by_inspector_id, type: string, source: system, description: "FK -> Inspector.id; verifying inspector (must differ from issuer); null until verified" }
      - { name: abatement_status, type: enum, source: system, default: OPEN, description: "OPEN | ABATED | VERIFIED (independent axis)" }
      - { name: contest_status, type: enum, source: system, default: UNCONTESTED, description: "UNCONTESTED | CONTESTED | AFFIRMED | MODIFIED | VACATED (independent axis)" }
      - { name: system_issued, type: boolean, source: system, default: false, description: "True for the automatic late-accident-report citation" }

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: system, description: "FK -> Citation.id; exactly one assessment per citation" }
      - { name: points_total, type: integer, source: computed, description: "Sum of negligence+likelihood+severity+persons+S&S+history+size points at issuance" }
      - { name: proposed_penalty_cents, type: integer, source: computed, description: "Pipeline result at issuance: tiered dollars, repeat multiplier (round half-up), statutory floor; no good-faith" }
      - { name: final_penalty_cents, type: integer, source: computed, description: "Null until status FINAL. Window-lapse/AFFIRMED: pipeline with good-faith discount if verified on time. MODIFIED: max(modified_penalty_cents, floor). VACATED: 0" }
      - { name: good_faith_applied, type: boolean, source: computed, default: false, description: "True when final penalty reflects the 10% good-faith abatement discount" }
      - { name: statutory_floor_applied, type: boolean, source: computed, default: false, description: "True when the floor raised the amount" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | CONTESTED | FINAL" }

  - name: ImminentDangerOrder
    parent: null
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; ordered mine" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; inspection during which the order was issued; null for POV-auto-generated orders" }
      - { name: issued_by_inspector_id, type: string, source: system, description: "FK -> Inspector.id; issuing inspector; null for system-issued orders" }
      - { name: hazard_description, type: string, source: input, description: "Imminent danger description" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: miners_withdrawn_count, type: integer, source: input, description: "Set on confirm-withdrawal. Constraints: integer >= 0" }
      - { name: withdrawal_confirmed_at, type: datetime, source: system, description: "Set on confirm-withdrawal" }
      - { name: abatement_verified_at, type: datetime, source: system, description: "Set on verify-abatement" }
      - { name: verified_by_inspector_id, type: string, source: system, description: "FK -> Inspector.id; must differ from issued_by_inspector_id; null until verified" }
      - { name: terminated_at, type: datetime, source: system, description: "Set on terminate" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | WITHDRAWAL_CONFIRMED | ABATEMENT_VERIFIED | TERMINATED" }

  - name: Contest
    parent: null
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: input, description: "FK -> Citation.id; contested citation" }
      - { name: filed_by_operator_id, type: string, source: system, description: "FK -> Operator.id; = X-User-ID of the OperatorRep filer" }
      - { name: grounds, type: string, source: input, description: "Contest grounds text" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at filing; must be <= citation.issued_at + 30 days (inclusive)" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | DOCKETED | DECIDED | WITHDRAWN" }
      - { name: outcome, type: enum, source: system, description: "AFFIRMED | MODIFIED | VACATED; set only on decide; null until DECIDED" }
      - { name: modified_penalty_cents, type: integer, source: input, description: "Required iff outcome == MODIFIED; the adjudicated amount before the statutory floor" }
      - { name: decided_at, type: datetime, source: system, description: "Set on decide" }

  - name: MinePlan
    parent: null
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: system, description: "FK -> Mine.id; owning mine (from path)" }
      - { name: plan_type, type: enum, source: input, description: "VENTILATION | ROOF_CONTROL | EMERGENCY_RESPONSE. VENTILATION and ROOF_CONTROL apply only to UNDERGROUND mines" }
      - { name: revision_no, type: integer, source: computed, description: "1 + max(revision_no) over prior plans of same (mine_id, plan_type); server-assigned" }
      - { name: document_ref, type: string, source: input, description: "Document locator" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: supersedes_plan_id, type: string, source: system, description: "FK -> MinePlan.id; the previously APPROVED plan of same (mine_id, plan_type) that this revision replaced; null until approval, self-referential" }
      - { name: next_revision_due_at, type: datetime, source: computed, description: "approved_at + 180 days; set on approve" }
      - { name: approved_at, type: datetime, source: system, description: "Set on approve" }
      - { name: rejection_reason, type: string, source: input, description: "Required on reject" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | REJECTED | SUPERSEDED | REVISION_DUE" }

  - name: Accident
    parent: null
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: input, description: "FK -> Mine.id; mine where the accident occurred" }
      - { name: occurred_at, type: datetime, source: input, description: "When the accident occurred" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at report" }
      - { name: severity, type: enum, source: input, description: "FATAL | LOST_TIME | NO_LOST_TIME" }
      - { name: description, type: string, source: input, description: "Operator's occurrence description" }
      - { name: late_report, type: boolean, source: computed, description: "reported_at - occurred_at > 15 minutes (FATAL) or > 120 minutes (otherwise), strict greater-than" }
      - { name: root_cause, type: string, source: input, description: "Root cause analysis; required at publish-report" }
      - { name: report_text, type: string, source: input, description: "Public report body; required at publish-report" }
      - { name: published_at, type: datetime, source: system, description: "Set on publish-report" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | UNDER_INVESTIGATION | REPORT_PUBLISHED" }

  - name: POVScreening
    parent: null
    common_fields: true
    fields:
      - { name: mine_id, type: string, source: system, description: "FK -> Mine.id; screened mine (from path)" }
      - { name: variant, type: enum, source: system, description: "SCREENING (created by POST pov-screenings; counts CONTESTED-unresolved citations) | FINAL_DETERMINATION (created by POST pov-notices; excludes them)" }
      - { name: screened_at, type: datetime, source: system, description: "Logical clock at screening" }
      - { name: window_start, type: datetime, source: computed, description: "screened_at - 365 days; a citation counts iff issued_at > window_start AND issued_at <= screened_at" }
      - { name: ss_citation_count, type: integer, source: computed, description: "S&S citations in window per variant filter" }
      - { name: weighted_score, type: integer, source: computed, description: "2 per S&S citation + 1 bonus per HIGH/RECKLESS_DISREGARD citation + 5 per ImminentDangerOrder in window" }
      - { name: result, type: enum, source: computed, description: "POTENTIAL_POV if weighted_score >= 8 else BELOW_THRESHOLD (SCREENING variant); CONFIRMED_POV if weighted_score >= 8 (FINAL_DETERMINATION variant)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Mine
    initial_state: "status=ACTIVE, pov_status=NONE (two independent axes)"
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: IDLED
        trigger: "POST /msha/mines/{mineId}/idle"
        actor: MSHAAdmin
        preconditions: []
        side_effects:
          - "Mine.version += 1"
        note: "IDLED mines remain subject to statutory inspection cycles; cycles are never paused"
      - from: IDLED
        to: ACTIVE
        trigger: "POST /msha/mines/{mineId}/reactivate"
        actor: MSHAAdmin
        preconditions: []
        side_effects:
          - "Mine.version += 1"
      - from: pov_status NONE
        to: POTENTIAL_POV
        trigger: "system (POST /msha/mines/{mineId}/pov-screenings computes weighted_score >= 8)"
        actor: system
        preconditions: []
        side_effects:
          - "Mine.version += 1"
      - from: POTENTIAL_POV
        to: NONE
        trigger: "system (a later SCREENING-variant POVScreening computes weighted_score < 8)"
        actor: system
        preconditions: []
        side_effects:
          - "Mine.version += 1"
      - from: POTENTIAL_POV
        to: POV_FINAL
        trigger: "POST /msha/mines/{mineId}/pov-notices"
        actor: DistrictManager
        preconditions:
          - "FINAL_DETERMINATION variant weighted_score >= 8 (ERR_POV_SCORE_INSUFFICIENT)"
        side_effects:
          - "Mine.version += 1"
          - "Every OPEN InspectionCycle of this mine: required_inspections += 1"
          - "From now on, every newly issued S&S citation at this mine auto-creates an ImminentDangerOrder"
        note: "POV_FINAL has no exit transition within this benchmark's scope"

  - entity: InspectionCycle
    initial_state: OPEN
    terminal_states: [COMPLIANT, CURED]
    transitions:
      - from: OPEN
        to: COMPLIANT
        trigger: "POST /msha/inspection-cycles/{cycleId}/close"
        actor: MSHAAdmin
        preconditions:
          - "completed_inspections >= required_inspections (else early close rejected ERR_CYCLE_CLOSE_TOO_EARLY unless current logical date > period_end)"
        side_effects: []
      - from: OPEN
        to: DELINQUENT
        trigger: "POST /msha/inspection-cycles/{cycleId}/close when completed_inspections < required_inspections and current logical date > period_end"
        actor: MSHAAdmin
        preconditions:
          - "current logical date > period_end (closing an unmet cycle before its period has fully elapsed is ERR_CYCLE_CLOSE_TOO_EARLY)"
        side_effects:
          - "Statutory shortfall is recorded; the cycle is NOT forgiven and awaits make-up credits"
      - from: DELINQUENT
        to: CURED
        trigger: "system (inspection_quota_crediting raises completed_inspections to required_inspections)"
        actor: system
        preconditions: []
        side_effects: []
        note: "CURED preserves the delinquency history; the cycle is never re-opened"

  - entity: Inspection
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: FILE_REVIEWED
        trigger: "POST /msha/inspections/{inspectionId}/file-review"
        actor: Inspector
        preconditions:
          - "X-User-ID == inspection.inspector_id (ERR_INSPECTOR_MISMATCH)"
        side_effects:
          - "file_reviewed_at = current logical clock"
      - from: FILE_REVIEWED
        to: IN_PROGRESS
        trigger: "POST /msha/inspections/{inspectionId}/start"
        actor: Inspector
        preconditions:
          - "X-User-ID == inspection.inspector_id (ERR_INSPECTOR_MISMATCH)"
          - "business_safety: no ImminentDangerOrder at inspection.mine_id with status != TERMINATED (ERR_IMMINENT_DANGER_ACTIVE)"
          - "business_constraint: inspector has no other Inspection with status == IN_PROGRESS (ERR_INSPECTOR_ENGAGED)"
        side_effects:
          - "actual_entry_at = current logical clock"
          - "If kind == ACCIDENT_INVESTIGATION and accident_id set: linked Accident REPORTED -> UNDER_INVESTIGATION"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /msha/inspections/{inspectionId}/complete"
        actor: Inspector
        preconditions:
          - "X-User-ID == inspection.inspector_id (ERR_INSPECTOR_MISMATCH)"
          - "business_referential (REGULAR kind only): for every plan type required by mine.mine_type (UNDERGROUND: VENTILATION, ROOF_CONTROL, EMERGENCY_RESPONSE; SURFACE: EMERGENCY_RESPONSE) there exists a MinePlan of this mine with status == APPROVED (ERR_REQUIRED_PLAN_NOT_APPROVED)"
        side_effects:
          - "completed_at = current logical clock"
          - "If kind == REGULAR: run inspection_quota_crediting (credits exactly one cycle)"
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system (an ImminentDangerOrder at this inspection's mine is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Inspection.version += 1"
        note: "Production halt cascades into every IN_PROGRESS inspection at the mine"
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "system (the last non-TERMINATED ImminentDangerOrder at this inspection's mine is terminated)"
        actor: system
        preconditions: []
        side_effects:
          - "Inspection.version += 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /msha/inspections/{inspectionId}/reassign"
        actor: DistrictManager
        preconditions:
          - "new_inspector_id passes conflict and certification checks for this mine (ERR_INSPECTOR_CONFLICT / ERR_INSPECTOR_NOT_CERTIFIED)"
        side_effects:
          - "inspector_id = new_inspector_id; file_reviewed_at = null"
        note: "Self-loop: reassignment before file review keeps the inspection in ASSIGNED"
      - from: FILE_REVIEWED
        to: ASSIGNED
        trigger: "POST /msha/inspections/{inspectionId}/reassign"
        actor: DistrictManager
        preconditions:
          - "new_inspector_id passes conflict and certification checks (ERR_INSPECTOR_CONFLICT / ERR_INSPECTOR_NOT_CERTIFIED)"
        side_effects:
          - "inspector_id = new_inspector_id; file_reviewed_at = null (the new inspector must redo the file review)"
        note: "Cycle: ASSIGNED -> FILE_REVIEWED -> ASSIGNED -> FILE_REVIEWED is reachable"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /msha/inspections/{inspectionId}/cancel"
        actor: DistrictManager
        preconditions: []
        side_effects:
          - "Planned window released (no longer occupies the inspector's schedule)"
      - from: FILE_REVIEWED
        to: CANCELLED
        trigger: "POST /msha/inspections/{inspectionId}/cancel"
        actor: DistrictManager
        preconditions: []
        side_effects:
          - "Planned window released"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /msha/inspections/{inspectionId}/cancel"
        actor: DistrictManager
        preconditions: []
        side_effects:
          - "Planned window released"

  - entity: Citation
    initial_state: "abatement_status=OPEN, contest_status=UNCONTESTED (two independent axes)"
    terminal_states: ["abatement: VERIFIED", "contest: AFFIRMED | MODIFIED | VACATED"]
    transitions:
      - from: "abatement OPEN"
        to: ABATED
        trigger: "POST /msha/citations/{citationId}/abate"
        actor: OperatorRep
        preconditions:
          - "X-User-ID == mine.operator_id (ERR_OPERATOR_MISMATCH)"
        side_effects:
          - "abated_at = current logical clock"
        note: "Abatement after the deadline is accepted but forfeits good faith; there is no late-abatement error"
      - from: ABATED
        to: VERIFIED
        trigger: "POST /msha/citations/{citationId}/verify-abatement"
        actor: Inspector
        preconditions:
          - "segregation of duties: X-User-ID != citation.issued_by_inspector_id (ERR_SOD_VERIFY_SELF)"
        side_effects:
          - "verified_at = current logical clock; verified_by_inspector_id = X-User-ID"
      - from: "contest UNCONTESTED"
        to: CONTESTED
        trigger: "POST /msha/contests"
        actor: OperatorRep
        preconditions:
          - "filed_at <= issued_at + 30 days inclusive (ERR_CONTEST_WINDOW_LAPSED)"
          - "OCC: expected_citation_version matches (ERR_STALE_VERSION)"
        side_effects:
          - "Citation.version += 1"
          - "Linked PenaltyAssessment PROPOSED -> CONTESTED"
      - from: CONTESTED
        to: AFFIRMED
        trigger: "POST /msha/contests/{contestId}/decide with outcome=AFFIRMED"
        actor: CommissionJudge
        preconditions: []
        side_effects:
          - "PenaltyAssessment CONTESTED -> FINAL; final_penalty_cents = pipeline WITH good-faith discount if citation VERIFIED with verified_at <= abatement_deadline"
      - from: CONTESTED
        to: MODIFIED
        trigger: "POST /msha/contests/{contestId}/decide with outcome=MODIFIED"
        actor: CommissionJudge
        preconditions:
          - "modified_penalty_cents present and >= 0 (ERR_CONTEST_DECISION_INVALID)"
        side_effects:
          - "PenaltyAssessment CONTESTED -> FINAL; final_penalty_cents = max(modified_penalty_cents, statutory floor); good-faith discount is NOT applied to a MODIFIED outcome"
      - from: CONTESTED
        to: VACATED
        trigger: "POST /msha/contests/{contestId}/decide with outcome=VACATED"
        actor: CommissionJudge
        preconditions: []
        side_effects:
          - "PenaltyAssessment CONTESTED -> FINAL with final_penalty_cents = 0"
          - "Citation excluded from POV windows and history_points windows from decided_at onward"

  - entity: PenaltyAssessment
    initial_state: PROPOSED
    terminal_states: [FINAL]
    transitions:
      - from: PROPOSED
        to: CONTESTED
        trigger: "system (a Contest is filed against the linked citation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: FINAL
        trigger: "POST /msha/penalty-assessments/{assessmentId}/finalize"
        actor: MSHAAdmin
        preconditions:
          - "current logical clock > citation.issued_at + 30 days (ERR_FINALIZE_WINDOW_ACTIVE)"
          - "citation.contest_status == UNCONTESTED (ERR_INVALID_STATE)"
        side_effects:
          - "final_penalty_cents = pipeline WITH good-faith discount if citation VERIFIED with verified_at <= abatement_deadline"
      - from: CONTESTED
        to: FINAL
        trigger: "system (contest decided)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ImminentDangerOrder
    initial_state: ISSUED
    terminal_states: [TERMINATED]
    transitions:
      - from: ISSUED
        to: WITHDRAWAL_CONFIRMED
        trigger: "POST /msha/imminent-danger-orders/{orderId}/confirm-withdrawal"
        actor: Inspector
        preconditions:
          - "miners_withdrawn_count >= 0"
        side_effects:
          - "withdrawal_confirmed_at = current logical clock"
      - from: WITHDRAWAL_CONFIRMED
        to: ABATEMENT_VERIFIED
        trigger: "POST /msha/imminent-danger-orders/{orderId}/verify-abatement"
        actor: Inspector
        preconditions:
          - "segregation of duties: X-User-ID != order.issued_by_inspector_id (ERR_SOD_VERIFY_SELF)"
        side_effects:
          - "abatement_verified_at = current logical clock; verified_by_inspector_id = X-User-ID"
      - from: ABATEMENT_VERIFIED
        to: TERMINATED
        trigger: "POST /msha/imminent-danger-orders/{orderId}/terminate"
        actor: DistrictManager
        preconditions: []
        side_effects:
          - "terminated_at = current logical clock"
          - "If no other non-TERMINATED ImminentDangerOrder remains at this mine: mine.production_status HALTED -> NORMAL (Mine.version += 1) and every SUSPENDED Inspection at the mine -> IN_PROGRESS"

  - entity: Contest
    initial_state: FILED
    terminal_states: [DECIDED, WITHDRAWN]
    transitions:
      - from: FILED
        to: DOCKETED
        trigger: "POST /msha/contests/{contestId}/docket"
        actor: CommissionJudge
        preconditions: []
        side_effects: []
      - from: DOCKETED
        to: DECIDED
        trigger: "POST /msha/contests/{contestId}/decide"
        actor: CommissionJudge
        preconditions:
          - "outcome in {AFFIRMED, MODIFIED, VACATED}; modified_penalty_cents required iff MODIFIED (ERR_CONTEST_DECISION_INVALID)"
        side_effects:
          - "decided_at = current logical clock"
          - "Citation contest axis -> outcome value (AFFIRMED | MODIFIED | VACATED); see Citation transitions for penalty side effects"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /msha/contests/{contestId}/withdraw"
        actor: OperatorRep
        preconditions:
          - "X-User-ID == contest.filed_by_operator_id (ERR_OPERATOR_MISMATCH)"
        side_effects:
          - "Citation contest axis CONTESTED -> UNCONTESTED (compensating action)"
          - "PenaltyAssessment CONTESTED -> PROPOSED"
          - "Citation.version += 1"
        note: "Withdrawal restores the pre-contest posture; the assessment may then be finalized via the window-lapse finalize endpoint once the contest window has lapsed"
      - from: DOCKETED
        to: WITHDRAWN
        trigger: "POST /msha/contests/{contestId}/withdraw"
        actor: OperatorRep
        preconditions:
          - "X-User-ID == contest.filed_by_operator_id (ERR_OPERATOR_MISMATCH)"
        side_effects:
          - "Citation contest axis CONTESTED -> UNCONTESTED (compensating action)"
          - "PenaltyAssessment CONTESTED -> PROPOSED"
          - "Citation.version += 1"

  - entity: MinePlan
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED, REVISION_DUE]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /msha/mine-plans/{planId}/approve"
        actor: DistrictManager
        preconditions:
          - "OCC: expected_mine_version matches Mine.version (ERR_STALE_VERSION)"
        side_effects:
          - "approved_at = current logical clock; next_revision_due_at = approved_at + 180 days"
          - "Any other MinePlan of same (mine_id, plan_type) with status == APPROVED -> SUPERSEDED; this plan's supersedes_plan_id set to that plan's id"
          - "Mine.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /msha/mine-plans/{planId}/reject"
        actor: DistrictManager
        preconditions:
          - "rejection_reason present"
        side_effects: []
        note: "Rejection is terminal for this row; the operator resubmits as a new MinePlan with revision_no incremented"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer revision of the same (mine_id, plan_type) is approved)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVISION_DUE
        trigger: "system (POST /_clock/set_current_utc advances the logical clock to >= next_revision_due_at)"
        actor: system
        preconditions: []
        side_effects: []
        note: "A REVISION_DUE plan no longer satisfies the inspection-completion plan gate"

  - entity: Accident
    initial_state: REPORTED
    terminal_states: [REPORT_PUBLISHED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "system (an Inspection with kind == ACCIDENT_INVESTIGATION and accident_id == this accident transitions to IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: REPORT_PUBLISHED
        trigger: "POST /msha/accidents/{accidentId}/publish-report"
        actor: MSHAAdmin
        preconditions:
          - "business_referential: there exists an Inspection with accident_id == this accident, kind == ACCIDENT_INVESTIGATION, status == COMPLETED (ERR_ACCIDENT_INVESTIGATION_INCOMPLETE)"
          - "root_cause and report_text present (ERR_INVALID_REQUEST)"
        side_effects:
          - "published_at = current logical clock; report becomes publicly readable"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only — see SKILL.md section 1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: plan-approve-stale-mine
    parent_entity: Mine
    write_endpoint: "POST /msha/mine-plans/{planId}/approve"
    occ_field: "expected_mine_version"
    description: |
      Approving a MinePlan supersedes whichever plan of the same (mine_id,
      plan_type) is currently APPROVED. A client that read the mine at version
      N and approves after another approval (or any other Mine mutation) has
      advanced the version is acting on a stale view of which plan is current;
      the approval is rejected with a stale-version error.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contest-file-stale-citation
    parent_entity: Citation
    write_endpoint: "POST /msha/contests"
    occ_field: "expected_citation_version"
    description: |
      Filing a Contest against a Citation whose version has advanced since the
      operator last observed it (for example because an abatement extension was
      granted, which mutates the citation) is rejected: the contest must
      reference the exact instrument the operator intends to challenge.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: penalty_points
    trigger: "Citation issuance (manual or system-issued)"
    algorithm: weighted_scoring
    description: "Point total for a citation from seven additive factor tables."
    formula: |
      points_total = negligence_points + likelihood_points + severity_points
                   + persons_points + ss_surcharge + history_points + size_points
      negligence_points: NONE=0, LOW=10, MODERATE=25, HIGH=40, RECKLESS_DISREGARD=50
      likelihood_points: UNLIKELY=5, REASONABLY_LIKELY=15, HIGHLY_LIKELY=25
      severity_points:   NO_INJURY=0, MINOR=10, SERIOUS=20, FATAL_POTENTIAL=30
      persons_points:    persons_affected == 1 -> 0; 2..5 -> 5; 6..20 -> 10; >= 21 -> 20
      ss_surcharge:      significant_and_substantial == true -> 15 else 0
      history_points:    count of other Citations at the same mine with issued_at in
                         (this.issued_at - 730 days, this.issued_at] and contest_status != VACATED:
                         0..5 -> 0; 6..15 -> 5; 16..30 -> 10; >= 31 -> 20
      size_points:       operator.annual_tonnage_tons:
                         < 50000 -> 0; 50000..499999 -> 5; 500000..4999999 -> 10; >= 5000000 -> 15
    input_set: "The new citation's own factor fields; the mine's prior non-VACATED citations within the trailing 730-day window (exclusive of window start, inclusive of issued_at; the new citation itself is excluded); the mine operator's annual_tonnage_tons."
    constants:
      HISTORY_WINDOW_DAYS: 730
      SS_SURCHARGE: 15
    precision: "integer points; no rounding"

  - name: penalty_dollar_pipeline
    trigger: "Citation issuance (proposed variant) and penalty finalization or contest decision (final variant)"
    algorithm: tiered_pricing
    description: "Converts points_total to cents. Evaluation order is PINNED: (1) marginal tier dollars, (2) repeat multiplier, round half-up to whole cents, (3) good-faith discount (final variant only), round half-up to whole cents, (4) statutory floor applied LAST. Any other order is non-conformant."
    formula: |
      gross_cents = tier1 + tier2 + tier3 + tier4 where
        tier1 = min(points, 20) * 11250
        tier2 = min(max(points - 20, 0), 40) * 22500
        tier3 = min(max(points - 60, 0), 40) * 37500
        tier4 = max(points - 100, 0) * 52500
      multiplied_cents = repeat_violation ? round_half_up(gross_cents * 1.15) : gross_cents
      -- final variant only, when citation VERIFIED with verified_at <= abatement_deadline:
      discount_cents   = round_half_up(multiplied_cents * 0.10)
      net_cents        = multiplied_cents - discount_cents
      -- floor LAST:
      floor_cents      = ORDER -> 150000 | CITATION with S&S -> 120000 | CITATION without S&S -> 60000
      amount_cents     = max(net_cents, floor_cents)
    input_set: "points_total; citation.repeat_violation, kind, significant_and_substantial; (final variant) citation abatement axis state and verified_at vs abatement_deadline."
    constants:
      REPEAT_MULTIPLIER: 1.15
      GOOD_FAITH_RATE: 0.10
      FLOOR_CITATION_CENTS: 60000
      FLOOR_CITATION_SS_CENTS: 120000
      FLOOR_ORDER_CENTS: 150000
    precision: "whole cents; round_half_up after the multiplier step and again after the discount step; intermediate values are exact decimals"
    variants:
      - name: proposed
        when: "computed at issuance; stored as proposed_penalty_cents"
        difference: "No good-faith discount (steps 1, 2, 4 only). Uses the citation's alleged factors as issued."
      - name: final
        when: "computed at finalize (window lapse) or at decide with outcome=AFFIRMED; outcome=MODIFIED instead stores max(modified_penalty_cents, floor_cents) with no good-faith discount; outcome=VACATED stores 0"
        difference: "Adds step 3 good-faith discount iff citation.abatement_status == VERIFIED and verified_at <= abatement_deadline; same points_total as issued unless the decision itself replaces the amount (MODIFIED)."

  - name: pov_weighted_score
    trigger: "POST /msha/mines/{mineId}/pov-screenings (SCREENING variant) and POST /msha/mines/{mineId}/pov-notices (FINAL_DETERMINATION variant)"
    algorithm: weighted_scoring
    description: "Pattern-of-violations score over a rolling 365-day window."
    formula: |
      window: issued_at > (screened_at - 365 days) AND issued_at <= screened_at
      weighted_score = 2 * count(S&S citations in window)
                     + 1 * count(citations in window with negligence in {HIGH, RECKLESS_DISREGARD})
                     + 5 * count(ImminentDangerOrders at mine with issued_at in window)
      result (SCREENING): weighted_score >= 8 -> POTENTIAL_POV else BELOW_THRESHOLD
      result (FINAL_DETERMINATION): weighted_score >= 8 -> CONFIRMED_POV else BELOW_THRESHOLD
    input_set: "Citations at the mine in window with contest_status != VACATED; SCREENING variant ALSO counts citations with contest_status == CONTESTED whose contest is unresolved (status FILED or DOCKETED); FINAL_DETERMINATION variant EXCLUDES those unresolved-CONTESTED citations. ImminentDangerOrders are always counted regardless of status."
    constants:
      POV_WINDOW_DAYS: 365
      SS_WEIGHT: 2
      NEGLIGENCE_BONUS: 1
      IDO_WEIGHT: 5
      POV_THRESHOLD: 8
    precision: "integer score; no rounding"
    variants:
      - name: screening
        when: "POST /msha/mines/{mineId}/pov-screenings"
        difference: "Includes citations under unresolved contest (FILED/DOCKETED)."
      - name: final_determination
        when: "POST /msha/mines/{mineId}/pov-notices"
        difference: "Excludes citations under unresolved contest; identical raw data can therefore score lower."

  - name: inspection_quota_crediting
    trigger: "A REGULAR Inspection transitions to COMPLETED"
    algorithm: chronological
    description: "Credits exactly one cycle. Evaluation order is PINNED: (1) build candidate set = cycles of the mine with status == DELINQUENT and completed_inspections < required_inspections, ordered period_start ASC, tie-break created_at ASC; (2) if the candidate set is non-empty, credit the FIRST candidate only; (3) else credit the unique cycle with status == OPEN whose [period_start, period_end] contains the completion date; (4) else no credit. After crediting, a DELINQUENT cycle whose completed_inspections reaches required_inspections becomes CURED. A completion late in cycle N can therefore cure older DELINQUENT cycle N-1 while cycle N itself stays uncredited."
    formula: |
      delinquent = [c for c in mine.cycles if c.status == DELINQUENT and c.completed_inspections < c.required_inspections]
      delinquent.sort(key = (period_start ASC, created_at ASC))
      if delinquent: credit delinquent[0]
      else:
        open_hit = [c for c in mine.cycles if c.status == OPEN and c.period_start <= completed_date <= c.period_end]
        if open_hit: credit open_hit[0]   # uniqueness guaranteed by non-overlap validation
      credit(c) := c.completed_inspections += 1; if c.status == DELINQUENT and c.completed_inspections >= c.required_inspections: c -> CURED
    input_set: "All InspectionCycles of the mine; the completing inspection's completed_at date."
    precision: "integer counts"

  - name: cycle_requirement_count
    trigger: "InspectionCycle creation; POV_FINAL escalation"
    algorithm: threshold
    description: "Statutory requirement per cycle is exactly 1 COMPLETED REGULAR inspection (underground quarterly cadence and surface semiannual cadence are expressed as cycle duration). Entering POV_FINAL adds +1 to every OPEN cycle of the mine. Requirement is never waived: closing a cycle with completed_inspections < required_inspections after period_end yields DELINQUENT, not forgiveness."
    formula: |
      required_inspections = 1 + (1 if mine entered POV_FINAL while cycle OPEN else 0)
      compliant_boundary: completed_inspections >= required_inspections
    input_set: "The cycle's mine and the mine's pov transitions during the OPEN window."
    constants:
      BASE_REQUIRED: 1
      POV_ESCALATION: 1

  - name: abatement_deadline
    trigger: "Citation issuance; extend-abatement"
    algorithm: threshold
    formula: |
      base_days = NO_INJURY -> 30 | MINOR -> 15 | SERIOUS -> 5 | FATAL_POTENTIAL -> 1
      abatement_deadline = issued_at + base_days
      extend-abatement (once, only while abatement_status == OPEN and clock < abatement_deadline):
        abatement_deadline += ceil(base_days / 2)
      on-time verification boundary: verified_at <= abatement_deadline (inclusive)
    input_set: "citation.gravity_severity, issued_at, extension flag."
    constants:
      BASE_DAYS_NO_INJURY: 30
      BASE_DAYS_MINOR: 15
      BASE_DAYS_SERIOUS: 5
      BASE_DAYS_FATAL_POTENTIAL: 1
    precision: "whole seconds; comparisons at second precision"

  - name: late_report_determination
    trigger: "Accident creation (POST /msha/accidents)"
    algorithm: threshold
    formula: |
      limit_seconds = (severity == FATAL) ? 900 : 7200
      late_report = (reported_at - occurred_at) > limit_seconds   -- strict greater-than; exactly at the limit is timely
      if late_report: system auto-issues a Citation (system_issued=true, inspection_id=null,
        issued_by_inspector_id=null, kind=CITATION, negligence=MODERATE, gravity_likelihood=UNLIKELY,
        gravity_severity=NO_INJURY, persons_affected=1, significant_and_substantial=false,
        repeat_violation=false, standard_code="50.10 LATE REPORT")
    input_set: "accident.severity, occurred_at; logical clock."
    constants:
      FATAL_LIMIT_SECONDS: 900
      OTHER_LIMIT_SECONDS: 7200
    precision: "whole seconds; strict >"

  - name: statutory_frequency_windows
    trigger: "InspectionCycle creation and close"
    algorithm: interval_merge
    description: "Cycle geometry: UNDERGROUND cycles are exactly 90 days, SURFACE exactly 180 days, both with INCLUSIVE period_start and period_end. Cycles of a mine must be strictly contiguous: cycle 1 starts at mine.activation_date; every later cycle's period_start must equal the previous cycle's period_end + 1 day (zero-gap, zero-overlap). A REGULAR inspection completed with completed_at date <= period_end counts toward that period; completed on the period_end date itself counts."
    formula: |
      duration_days = (mine_type == UNDERGROUND) ? 90 : 180
      period_end = period_start + (duration_days - 1) days
      next.period_start = prev.period_end + 1 day
    input_set: "mine.mine_type, mine.activation_date, prior cycles."
    constants:
      UNDERGROUND_CYCLE_DAYS: 90
      SURFACE_CYCLE_DAYS: 180
    precision: "whole days; date-inclusive comparisons"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, no undeclared fields, enum values in their declared sets, integers in range (persons_affected >= 1, miners_withdrawn_count >= 0, annual_tonnage_tons >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right, then body FK fields resolve (operator_id, mine_id, inspector_id, cycle_id, accident_id, citation_id, new_inspector_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_mine_version == Mine.version on plan approve; expected_citation_version == Citation.version on contest file"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /msha/mine-plans/{planId}/approve; POST /msha/contests"

  - priority: 6
    category: auth
    check: "Ownership and segregation of duties: OperatorRep X-User-ID == mine.operator_id for abate/extend/contest/withdraw/plan-submit/accident-report (ERR_OPERATOR_MISMATCH); Inspector X-User-ID == inspection.inspector_id for file-review/start/complete and == order/citation inspector where required (ERR_INSPECTOR_MISMATCH); verifier != issuer for citation and IDO abatement verification (ERR_SOD_VERIFY_SELF)"
    error_id: "ERR_OPERATOR_MISMATCH / ERR_INSPECTOR_MISMATCH / ERR_SOD_VERIFY_SELF"
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 7
    category: state
    check: "Entity state preconditions per state machine (incl. ERR_MINE_NOT_ACTIVE for accident reports at IDLED mines and IDO issuance at non-ACTIVE mines; ERR_CITATION_NOT_CONTESTABLE for contest filing when citation contest_status != UNCONTESTED; ERR_POV_NOTICE_REQUIRES_POTENTIAL when mine.pov_status != POTENTIAL_POV)"
    error_id: "ERR_INVALID_STATE / ERR_MINE_NOT_ACTIVE / ERR_CITATION_NOT_CONTESTABLE / ERR_POV_NOTICE_REQUIRES_POTENTIAL"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 8
    category: business_safety
    check: "No inspection may start at a mine with a non-TERMINATED ImminentDangerOrder"
    error_id: ERR_IMMINENT_DANGER_ACTIVE
    http_status: 409
    applies_to: "POST /msha/inspections/{inspectionId}/start"

  - priority: 9
    category: business_referential
    check: "REGULAR inspection completion requires an APPROVED MinePlan for every plan type required by the mine's type; accident report publication requires a COMPLETED ACCIDENT_INVESTIGATION inspection"
    error_id: "ERR_REQUIRED_PLAN_NOT_APPROVED / ERR_ACCIDENT_INVESTIGATION_INCOMPLETE"
    http_status: 409
    applies_to: "POST /msha/inspections/{inspectionId}/complete; POST /msha/accidents/{accidentId}/publish-report"

  - priority: 10
    category: business_constraint
    check: "Inspector assignment gates: conflicted_operator_ids must not contain mine.operator_id (ERR_INSPECTOR_CONFLICT); certification must cover mine.mine_type (ERR_INSPECTOR_NOT_CERTIFIED); planned window must not overlap the inspector's other occupied windows under half-open semantics (ERR_INSPECTOR_DOUBLE_BOOKED); inspector may hold at most one IN_PROGRESS inspection (ERR_INSPECTOR_ENGAGED); plan_type must apply to mine_type (ERR_PLAN_TYPE_NOT_REQUIRED); one abatement extension per citation (ERR_ABATEMENT_EXTENSION_EXHAUSTED); no second active IDO at a mine and new issuance strictly after any prior terminated_at (ERR_IDO_ACTIVE_EXISTS); POV notice requires final-variant score >= 8 (ERR_POV_SCORE_INSUFFICIENT)"
    error_id: "ERR_INSPECTOR_CONFLICT / ERR_INSPECTOR_NOT_CERTIFIED / ERR_INSPECTOR_DOUBLE_BOOKED / ERR_INSPECTOR_ENGAGED / ERR_PLAN_TYPE_NOT_REQUIRED / ERR_ABATEMENT_EXTENSION_EXHAUSTED / ERR_IDO_ACTIVE_EXISTS / ERR_POV_SCORE_INSUFFICIENT"
    http_status: 409
    applies_to: "assignment, plan, abatement, IDO and POV endpoints"

  - priority: 11
    category: business_temporal
    check: "Temporal rules: cycle creation requires no OPEN cycle (ERR_CYCLE_OPEN_EXISTS) and exact statutory window geometry (ERR_CYCLE_PERIOD_INVALID); cycle close before period_end requires requirement met (ERR_CYCLE_CLOSE_TOO_EARLY); contest filing within issued_at + 30 days inclusive (ERR_CONTEST_WINDOW_LAPSED); abatement extension only before the current deadline (ERR_ABATEMENT_WINDOW_PASSED); penalty finalize only after the contest window has lapsed (ERR_FINALIZE_WINDOW_ACTIVE)"
    error_id: "ERR_CYCLE_OPEN_EXISTS / ERR_CYCLE_PERIOD_INVALID / ERR_CYCLE_CLOSE_TOO_EARLY / ERR_CONTEST_WINDOW_LAPSED / ERR_ABATEMENT_WINDOW_PASSED / ERR_FINALIZE_WINDOW_ACTIVE"
    http_status: 409
    applies_to: "cycle, contest, abatement-extension and finalize endpoints"

  - priority: 12
    category: business_fiscal
    check: "Contest decision payload: modified_penalty_cents required and >= 0 iff outcome == MODIFIED"
    error_id: ERR_CONTEST_DECISION_INVALID
    http_status: 422
    applies_to: "POST /msha/contests/{contestId}/decide"

# =============================================================================
# Table 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving (outside the public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call to this endpoint the clock reads exactly 2026-09-01T00:00:00Z and never wall-clock time. Advancing the clock past an APPROVED MinePlan's next_revision_due_at flips that plan to REVISION_DUE."
    roles: [MSHAAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "Every MinePlan with status == APPROVED and next_revision_due_at <= current_utc becomes REVISION_DUE"

  # --- Operator ---
  - method: POST
    path: "/msha/operators"
    description: "Register an operator"
    roles: [MSHAAdmin]
    code: 201
    input: [legal_name, annual_tonnage_tons, home_district]
    output: Operator
    side_effects: []
  - method: GET
    path: "/msha/operators/{operatorId}"
    description: "Get an operator"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: GET
    path: "/msha/operators/{id}/mines"
    description: "List mines of an operator (FK reverse reachability for Mine.operator_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["limit?", "offset?"]
    output: "Mine[]"
    side_effects: []

  # --- Mine ---
  - method: POST
    path: "/msha/mines"
    description: "Register a mine; starts with status=ACTIVE, production_status=NORMAL, pov_status=NONE and no cycles"
    roles: [MSHAAdmin]
    code: 201
    input: [operator_id, mine_name, mine_type, activation_date]
    output: Mine
    side_effects: []
  - method: GET
    path: "/msha/mines/{mineId}"
    description: "Get a mine"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: Mine
    side_effects: []
  - method: POST
    path: "/msha/mines/{mineId}/idle"
    description: "Idle a mine (inspection cycles continue regardless)"
    roles: [MSHAAdmin]
    code: 200
    input: []
    output: Mine
    side_effects: ["status ACTIVE -> IDLED", "Mine.version += 1"]
  - method: POST
