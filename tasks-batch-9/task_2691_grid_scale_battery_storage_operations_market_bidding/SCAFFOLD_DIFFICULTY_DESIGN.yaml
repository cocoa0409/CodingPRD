              as: MarketTrader
              captures: { r2: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r2}", market_type: "REAL_TIME", product: "REG_UP", direction: "DISCHARGE", delivery_start: "2026-08-11T00:00:00Z", delivery_end: "2026-08-11T04:00:00Z", offer_mw: 5.0 }
