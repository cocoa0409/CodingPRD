  # ==================================================================
  # Section: validations
  # ==================================================================
  - section: validations
    instances:
      - name: products_create_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without X-User-Role / X-User-ID headers is rejected 401 before any role or payload check runs."
        test_recipe:
          setup:
            - "Nothing required"
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku_code: "X", name: "X", product_type: "STANDARD", brand: "OWN", base_price_cents: 100, unit_weight_grams: 10, shelf_life_days: 90, packaging_component_id: "00000000-0000-0000-0000-000000000000" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with HTTP 401"

      - name: run_cancel_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A cancel against a non-existent run id returns 404 ERR_NOT_FOUND (existence precedes any state check)."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /production-runs/00000000-0000-0000-0000-000000000000/cancel"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: gift_component_undeclared_allergen_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_UNDECLARED_ALLERGEN]"]
        distinguishing_aspect: "A component whose recipe declares PEANUT cannot join a gift set whose recipes declare only [MILK] (cross-contact prevention at BOM level)."
        test_recipe:
          setup:
            - "Component product CP with recipe allergens [PEANUT]; gift product GF with recipe allergens [MILK]"
          setup_api_calls:
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "CP", name: "Peanut Cup", product_type: "STANDARD", brand: "OWN", base_price_cents: 300, unit_weight_grams: 50, shelf_life_days: 200, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { cp: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "GF", name: "Milk Gift", product_type: "GIFT_SET", brand: "OWN", base_price_cents: 5000, unit_weight_grams: 700, shelf_life_days: 120, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
              captures: { gf: $.data.id }
            - call: "POST /recipes"
              payload: { product_id: "${cp}", name: "Peanut mass", shape_code: "CUP", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: ["PEANUT"], standard_yield_pct: 0.95 }
              as: ProductionPlanner
            - call: "POST /recipes"
              payload: { product_id: "${gf}", name: "GF assembly", shape_code: "BAR", cook_temp_min_c: 80, cook_temp_max_c: 90, temper_exit_min_c: 28, temper_exit_max_c: 30, allergens: ["MILK"], standard_yield_pct: 1.0 }
              as: ProductionPlanner
          trigger:
            - call: "POST /gift-components"
              payload: { gift_product_id: "${gf}", component_product_id: "${cp}", qty_per_set: 2 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNDECLARED_ALLERGEN with HTTP 422"
            - "GET /products/${gf}/gift-components returns an empty list (edge not persisted)"

      - name: window_date_order_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_WINDOW_DATE_ORDER]"]
        distinguishing_aspect: "ship_start (2026-10-10) before build_end (2026-10-15) violates build_start <= build_end <= ship_start <= ship_end."
