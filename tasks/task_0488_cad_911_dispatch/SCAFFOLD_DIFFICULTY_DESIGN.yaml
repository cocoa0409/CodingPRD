            - "HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispatch_then_cancel_conserves_available_unit_count
        grounds:
          - state_machines.Incident.lifecycle_status.PENDING_to_DISPATCHED
          - state_machines.Assignment.DISPATCHED_to_CANCELLED
          - entities.Unit.fields.status
          - entities.Unit.fields.active_incident_id
        distinguishing_aspect: |
          Conserved quantity = count of AVAILABLE Units. Dispatch (forward) removes the unit from the
          AVAILABLE pool; CANCEL (compensating) must return it, leaving the AVAILABLE-unit count
          identical to before dispatch. Invariant: count(Units status==AVAILABLE) is unchanged across
          the dispatch+cancel pair.
        test_recipe:
          setup:
            - "POLICE agency, one PATROL unit AVAILABLE (available count = 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "PD Inv", discipline: "POLICE", response_sla_seconds: 600 }
              as: Supervisor
              captures: { pd_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${pd_id}", name: "PInv", grid_x: 65, grid_y: 65 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${pd_id}", station_id: "${stn_id}", call_sign: "PI1", capability: "PATROL", grid_x: 65, grid_y: 65 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550160", ali_grid_x: 65, ali_grid_y: 65, incident_type: "ASSAULT_IN_PROGRESS" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
          trigger:
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "CANCEL" }
              as: Dispatcher
          assert:
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Unit.${unit_id}.active_incident_id == null"
            - "count(Units with agency_id==${pd_id} AND status==AVAILABLE) == 1 (same as before dispatch)"

      - name: hold_then_resume_conserves_onscene_assignment_count
        grounds:
          - state_machines.Incident.lifecycle_status.ACTIVE_to_HELD
          - state_machines.Incident.lifecycle_status.HELD_to_ACTIVE
          - entities.Assignment.fields.status
          - entities.Incident.fields.lifecycle_status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = count of ONSCENE Assignments on the incident. HOLD (forward)
          freezes the incident without touching assignment statuses; RESUME (compensating) thaws it,
          and the ONSCENE-assignment count is identical before HOLD and after RESUME (the freeze conserves
          field state rather than draining it).
        test_recipe:
          setup:
            - "EMS agency, MEDIC_ALS unit driven to ONSCENE; incident ACTIVE with exactly one ONSCENE assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-17T00:00:00Z" }
              as: SystemClock
            - call: "POST /agencies"
              payload: { name: "EMS Hold", discipline: "EMS", response_sla_seconds: 600 }
              as: Supervisor
              captures: { ems_id: $.data.id }
            - call: "POST /stations"
              payload: { agency_id: "${ems_id}", name: "EHold", grid_x: 75, grid_y: 75 }
              as: Supervisor
              captures: { stn_id: $.data.id }
            - call: "POST /units"
              payload: { agency_id: "${ems_id}", station_id: "${stn_id}", call_sign: "MHold1", capability: "MEDIC_ALS", grid_x: 75, grid_y: 75 }
              as: Supervisor
              captures: { unit_id: $.data.id }
            - call: "POST /incidents"
              payload: { ani: "5125550170", ali_grid_x: 75, ali_grid_y: 75, incident_type: "MEDICAL_EMERGENCY" }
              as: Calltaker
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /incidents/${inc_id}/assignments"
              payload: { expected_incident_version: "${inc_v}", unit_id: "${unit_id}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ENROUTE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "PATCH /assignments/${asg_id}/status"
              payload: { status: "ONSCENE" }
              as: FieldUnit
              as_user_id: "${unit_id}"
            - call: "POST /incidents/${inc_id}/hold"
              payload: { reason: "scene_safety" }
              as: Supervisor
          trigger:
            - call: "POST /incidents/${inc_id}/resume"
              payload: {}
              as: Supervisor
          assert:
            - "Incident.${inc_id}.lifecycle_status == ACTIVE"
            - "Assignment.${asg_id}.status == ONSCENE"
            - "count(Assignments with incident_id==${inc_id} AND status==ONSCENE) == 1 (same as before HOLD)"
