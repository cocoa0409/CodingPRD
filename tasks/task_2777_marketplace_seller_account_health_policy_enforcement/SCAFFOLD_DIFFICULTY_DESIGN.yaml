            - "Seller S2 then registers reusing S1's tax_id_hash AND payout_bank_token but a fresh address and email domain -> confidence_score 0.35 + 0.45 = 0.80, matched_signals [TAX_ID, BANK_TOKEN], matched_seller_state_at_detection BANNED."
            - "0.80 >= RELATED_LINK_WATCH_SCORE (0.60) so S2 registers with registration_risk_flag true, root_seller_id S1, enforcement_state WATCHLIST, disbursement_state RESERVE_HELD."
            - "S2 is credited 300000 cents and publishes one ACTIVE listing."
