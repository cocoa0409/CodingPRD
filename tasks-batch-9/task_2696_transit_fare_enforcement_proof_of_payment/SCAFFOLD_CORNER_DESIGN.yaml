# ============================================================================
# §1.9 Scaffold Corner Design (Breadth Index)
# Task 2696 — Transit Fare Enforcement & Proof of Payment
#
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1–§1.7. Every `section:` and `claim_type:` below is taken from that guide;
# no categories are invented. Corners already asserted by a §1.8 instance are
# emitted as `excluded_because:` stubs naming that instance verbatim.
#
# Shared fixture vocabulary (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * logical clock starts at 2026-08-01T00:00:00Z
#   * zone Z1: required_sign_count 10, penalty_multiplier_bps 12000,
#     max_concurrent_deployments 2, enforcement_policy CITATION_IMMEDIATE
#   * deployment window 2026-08-05T06:00:00Z -> 2026-08-05T14:00:00Z
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: fare_zone_creation_stamps_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.FareZone.fields.designation_status
          - entities.FareZone.fields.penalty_multiplier_bps
          - entities.FareZone.fields.signage_compliance_pct
          - endpoints[POST /fare-zones]
        distinguishing_aspect: "A zone created with only its three required inputs comes back 201 with designation_status DRAFT, verified_sign_count 0, signage_compliance_pct 0.0000, version 1 and a server-minted id."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
          assert:
            - "HTTP 201 with the success envelope: meta.api_request_id present, response_type == object"
            - "FareZone.${z1}.designation_status == DRAFT"
            - "FareZone.${z1}.verified_sign_count == 0 and FareZone.${z1}.signage_compliance_pct == 0.0000"
            - "FareZone.${z1}.penalty_multiplier_bps == 10000 and FareZone.${z1}.enforcement_policy == CITATION_IMMEDIATE and FareZone.${z1}.max_concurrent_deployments == 1"
            - "FareZone.${z1}.designated_at == null and FareZone.${z1}.suspension_reason == null"
            - "FareZone.${z1}.version == 1 and FareZone.${z1}.created_at == 2026-08-01T00:00:00Z"

      - name: fare_zone_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /fare-zones/{id}]
          - entities.FareZone.fields.zone_code
        distinguishing_aspect: "GET /fare-zones/{id} returns exactly the row POST created, including the recomputed signage_compliance_pct of 1.0000 after a 10-of-10 audit."
        test_recipe:
          setup:
            - "Zone Z1 exists with required_sign_count 10 and one 10-of-10 SignageAudit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
          trigger:
            - call: "GET /fare-zones/${z1}"
              payload: {}
              as: EquityAnalyst
          assert:
            - "HTTP 200 with FareZone.${z1}.zone_code == Z1 and name == Downtown POP Zone"
            - "FareZone.${z1}.required_sign_count == 10 and verified_sign_count == 10"
            - "FareZone.${z1}.signage_compliance_pct == 1.0000"
            - "FareZone.${z1}.designation_status == DRAFT (the audit alone does not designate)"

      - name: fare_zone_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /fare-zones]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three zones stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Three zones Z1, Z2 and Z3 exist, all in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /fare-zones"
              payload: { zone_code: "Z2", name: "Midtown POP Zone", required_sign_count: 6 }
              as: EnforcementPlanner
              captures: { z2: $.data.id }
            - call: "POST /fare-zones"
              payload: { zone_code: "Z3", name: "Airport POP Zone", required_sign_count: 4 }
              as: EnforcementPlanner
              captures: { z3: $.data.id }
          trigger:
            - call: "GET /fare-zones?limit=2&offset=0"
              payload: {}
              as: EquityAnalyst
            - call: "GET /fare-zones?limit=2&offset=2"
              payload: {}
              as: EquityAnalyst
          assert:
            - "the first page returns response_type == array with exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second page returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the union of both pages is exactly {${z1}, ${z2}, ${z3}} with no duplicates"
            - "GET /fare-zones?designation_status=DESIGNATED returns 0 rows with total_count == 0"

      - name: citation_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors.ERR_CITATION_NOT_FOUND
          - endpoints[GET /citations/{id}]
        distinguishing_aspect: "A well-formed but unknown citation id returns ERR_CITATION_NOT_FOUND (404) — the entity-specific code, not a generic 404 body."
        test_recipe:
          setup:
            - "Empty database apart from the clock; no Citation rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "GET /citations/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: EnforcementPlanner
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_nf} == ERR_CITATION_NOT_FOUND"
            - "the error envelope carries response_type == error and data.message is non-empty"

      - name: transit_line_creation_without_mode_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /transit-lines]
        distinguishing_aspect: "mode is a required input with no default, so omitting it returns ERR_INVALID_REQUEST (400) and no TransitLine row is created."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /transit-lines"
              payload: { line_code: "L1", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_req} == ERR_INVALID_REQUEST"
            - "GET /transit-lines/{id} for any id returns 404 — no row was persisted"

      - name: fare_zone_creation_with_unknown_enforcement_policy_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.FareZone.fields.enforcement_policy
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "enforcement_policy is constrained to {CITATION_IMMEDIATE, WARNING_FIRST}; the value ZERO_TOLERANCE is rejected with ERR_INVALID_REQUEST (400) rather than stored verbatim."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /fare-zones"
              payload: { zone_code: "Z9", name: "Bad Enum Zone", required_sign_count: 10, enforcement_policy: "ZERO_TOLERANCE" }
              as: EnforcementPlanner
              captures: { err_enum: $.data.error_id }
          assert:
            - "HTTP 400 with ${err_enum} == ERR_INVALID_REQUEST"
            - "GET /fare-zones returns total_count == 0"

      - name: inspector_status_defaults_to_active_when_omitted
        claim_type: defaults
        grounds:
          - entities.Inspector.fields.status
          - entities.Inspector.fields.citations_issued_count
          - endpoints[POST /inspectors]
        distinguishing_aspect: "Omitting the optional status input yields status ACTIVE and citations_issued_count 0 — the default is applied server-side, not left null."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
          assert:
            - "HTTP 201 with Inspector.${i1}.status == ACTIVE"
            - "Inspector.${i1}.citations_issued_count == 0"
            - "Inspector.${i1}.certification_expiry == 2027-01-01T00:00:00Z and Inspector.${i1}.version == 1"

      - name: transit_line_system_fields_are_server_generated_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.TransitLine.fields.line_code
          - endpoints[POST /transit-lines]
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: the row comes back with version 1 and created_at equal to the logical clock 2026-08-01T00:00:00Z, independent of anything the caller sends."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id, lv1: $.data.version }
          assert:
            - "HTTP 201 with TransitLine.${l1}.version == 1 so ${lv1} == 1"
            - "TransitLine.${l1}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "TransitLine.${l1}.id is a server-minted identifier not present in the request payload"

      - name: signage_audit_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.SignageAudit.fields.signs_verified_count
          - entities.SignageAudit.fields.auditor_user_id
          - endpoints[GET /fare-zones/{id}/signage-audits]
        distinguishing_aspect: "SignageAudit is declared common_fields false: §1.5 exposes no update or delete endpoint for it, the row carries no version field, and a correcting count is filed as a second append-only row rather than an edit of the first."
        test_recipe:
          setup:
            - "Zone Z1 exists with required_sign_count 10 and one audit of 8 signs at 2026-08-01T01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 8, deficiency_note: "Two shelter signs missing." }
              as: EnforcementPlanner
              captures: { sa1: $.data.id }
          trigger:
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T02:00:00Z", signs_verified_count: 10, deficiency_note: "Signs restored." }
              as: EnforcementPlanner
              captures: { sa2: $.data.id }
            - call: "GET /fare-zones/${z1}/signage-audits"
              payload: {}
              as: EquityAnalyst
          assert:
            - "the audit list returns exactly 2 rows, ${sa1} with signs_verified_count == 8 and ${sa2} with signs_verified_count == 10"
            - "SignageAudit.${sa1}.signs_verified_count == 8 is unchanged by the later filing"
            - "neither row exposes a version field; §1.5 declares no PATCH, PUT or DELETE for SignageAudit"
            - "SignageAudit.${sa2}.auditor_user_id equals the acting X-User-ID of the second call"
            - "FareZone.${z1}.signage_compliance_pct == 1.0000 (driven by the later audited_at)"

      - name: zone_line_assignment_with_unknown_zone_returns_zone_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors.ERR_ZONE_NOT_FOUND
          - entities.ZoneLineAssignment.fields.zone_id
        distinguishing_aspect: "ZoneLineAssignment is a junction row whose two parents are validated in the endpoint's declared input order: an unknown zone_id returns ERR_ZONE_NOT_FOUND (404) even though the line_id is valid."
        test_recipe:
          setup:
            - "Line L1 exists; no FareZone row has the id used in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "00000000-0000-4000-8000-0000000000aa", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
              captures: { err_zone_nf: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_zone_nf} == ERR_ZONE_NOT_FOUND"
            - "GET /zone-line-assignments?line_id=${l1} returns 0 rows"

      - name: rider_counter_fields_are_computed_from_encounter_history
        claim_type: computed_fields
        grounds:
          - entities.Rider.fields.prior_warning_count
          - entities.Rider.fields.prior_citation_count
          - calculations.citation_offense_sequence
        distinguishing_aspect: "prior_warning_count and prior_citation_count are computed, not input: a freshly created rider reads 0/0 and the counters move to 1/0 only as a consequence of resolving an encounter WARNING_ISSUED."
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED, line L1 assigned, deployment D1 ACTIVE 2026-08-05T06:00:00Z..14:00:00Z."
            - "Rider R-100 exists with no encounter history; logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments/${d1}/activate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
            - call: "POST /inspection-encounters/${e1}/resolve"
              payload: { disposition: "WARNING_ISSUED" }
              as: FareInspector
              as_user_id: "${i1}"
          assert:
            - "immediately after POST /riders: Rider.${r1}.prior_warning_count == 0 and prior_citation_count == 0"
            - "after the WARNING_ISSUED resolve: Rider.${r1}.prior_warning_count == 1"
            - "Rider.${r1}.prior_citation_count == 0 (a warning is not a citation)"
            - "InspectionEncounter.${e1}.validation_result == NO_PROOF and outcome == WARNING_ISSUED"
            - "InspectionDeployment.${d1}.achieved_sample_count == 1 and sample_adequacy_ratio == 0.2000"

  # ==========================================================================
  - section: state_machines
    instances:

      - name: deployment_and_encounter_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines[InspectionDeployment].initial_state
          - state_machines[InspectionEncounter].initial_state
        distinguishing_aspect: "A freshly created deployment reads PLANNED (never ACTIVE) and a freshly created encounter reads PENDING with outcome PENDING, before any transition endpoint is called."
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED, line L1 assigned, inspector I1 ACTIVE, rider R1 with no history."
            - "Logical clock at 2026-08-05T09:00:00Z when the encounter is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments/${d1}/activate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
          assert:
            - "the create response for ${d1} carries status == PLANNED, achieved_sample_count == 0, voided_encounter_count == 0, sample_adequacy_ratio == 0.0000, version == 1"
            - "InspectionDeployment.${d1}.measured_evasion_rate_bps == null and enforcement_cost_cents == null before close"
            - "the create response for ${e1} carries outcome == PENDING and citation_id == null"
            - "InspectionEncounter.${e1}.validation_result == NO_PROOF (computed at creation, independent of the state machine)"

      - name: deployment_activates_from_planned_once_clock_reaches_window_start
        claim_type: valid_transition
        grounds:
          - state_machines[InspectionDeployment].transitions[PLANNED->ACTIVE]
          - endpoints[POST /inspection-deployments/{id}/activate]
