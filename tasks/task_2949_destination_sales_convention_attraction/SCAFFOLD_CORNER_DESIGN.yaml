              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Loss One", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_1_id: $.data.id }
            - call: "POST /opportunities/${opp_1_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Loss Two", arrival_date: "2028-05-10", departure_date: "2028-05-12", peak_rooms_requested: 200, total_room_nights_requested: 400, attendance_estimate: 1500, exhibit_sqft_requested: 20000, rate_ceiling_amount: 209.00 }
              as: SalesManager
              captures: { opp_2_id: $.data.id }
            - call: "POST /opportunities/${opp_2_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "Loss Three", arrival_date: "2028-06-10", departure_date: "2028-06-12", peak_rooms_requested: 300, total_room_nights_requested: 600, attendance_estimate: 2500, exhibit_sqft_requested: 30000, rate_ceiling_amount: 199.00 }
              as: SalesManager
              captures: { opp_3_id: $.data.id }
            - call: "POST /opportunities/${opp_3_id}/qualify"
              payload: {}
              as: SalesManager
            - call: "POST /opportunities/${opp_1_id}/lose"
              payload: { lost_reason: "RATE_TOO_HIGH" }
              as: SalesManager
            - call: "POST /opportunities/${opp_2_id}/lose"
              payload: { lost_reason: "RATE_TOO_HIGH" }
              as: SalesManager
            - call: "POST /opportunities/${opp_3_id}/lose"
              payload: { lost_reason: "DATES_UNAVAILABLE" }
              as: SalesManager
