        distinguishing_aspect: |
          For monthly_fee_cents=4150, rounding each component independently (insurance=3528,
          platform=415, tax=208) and summing yields amount_cents=4151 — one cent more than the
          naive "round the total once" result of 4150 — pinning the required per-component-then-sum
          order (Rule 2 combinatorial_formula mode b, deferred here from §1.8 as a breadth check).
