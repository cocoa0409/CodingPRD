            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { mv0: $.data.version, m_planned: $.data.otb_planned_cents }
          trigger:
            - call: "POST /otb/assortment-items/${item_id}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { adopt_status: $.data.status, adopt_basis: $.data.sell_through_basis, adopt_st: $.data.sell_through_bps, adopt_units: $.data.planned_units }
            - call: "GET /otb/assortment-items/${item_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { read_status: $.data.status, read_basis: $.data.sell_through_basis, read_st: $.data.sell_through_bps, read_units: $.data.planned_units }
