              captures: { th_id: $.data.id }
            - call: "POST /findings"
              payload: { study_id: "${study_id}", theme_id: "${th_id}", statement: "Teams stall at the workspace invite step", severity: "HIGH" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { f_id: $.data.id }
            - call: "POST /findings/${f_id}/evidence-links"
              payload: { artifact_id: "${a1_id}", excerpt_ref: "00:12:40", weight_class: "OBSERVED_BEHAVIOR" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { l1_id: $.data.id, l1_contribution: $.data.contribution }
            - call: "POST /findings/${f_id}/evidence-links"
              payload: { artifact_id: "${a2_id}", excerpt_ref: "00:04:05", weight_class: "OBSERVED_BEHAVIOR" }
              as: Researcher
