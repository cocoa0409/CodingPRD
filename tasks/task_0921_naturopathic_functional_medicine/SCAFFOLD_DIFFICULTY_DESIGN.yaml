# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rule_ids, 23 instances. Every arithmetic literal below was computed by
# executing the referenced calculations[].formula against its constants.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: intake_gate_booking_variant_passes_while_protocol_variant_fails
        grounds:
          - calculations.intake_completeness_score
          - entities.Patient.fields.intake_booking_score
          - entities.Patient.fields.intake_protocol_score
          - validations[priority=14]
          - state_machines.IntakeSection.SUBMITTED_to_ATTESTED
        distinguishing_aspect: |
          This instance's dual variant lives on the Patient/IntakeSection domain: one and
          the same set of five intake sections yields intake_booking_score 87 (SUBMITTED
          sections count at floor(weight/2)) and intake_protocol_score 75 (SUBMITTED
          sections count 0), so the identical chart books a visit and is refused a protocol.
        test_recipe:
          setup:
            - "One ND practitioner licensed in OR, one OR patient attached to them"
            - "CHIEF_COMPLAINT_TIMELINE, SYSTEMS_REVIEW and MEDICATIONS_SUPPLEMENTS are ATTESTED (25 + 25 + 25 = 75)"
            - "DIET_LIFESTYLE and FAMILY_HISTORY are SUBMITTED only (floor(15/2)=7 and floor(10/2)=5)"
            - "intake_booking_score == 87, intake_protocol_score == 75"
            - "A DRAFT protocol with one item exists so that issue can be attempted"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR", "WA"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}", telehealth_consent: true }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue 14 months" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_cc: $.data.id }
            - call: "POST /intake-sections/${sec_cc}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "GI and sleep" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_sr: $.data.id }
            - call: "POST /intake-sections/${sec_sr}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "MEDICATIONS_SUPPLEMENTS", payload_summary: "no prescriptions" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { sec_ms: $.data.id }
            - call: "POST /intake-sections/${sec_ms}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "mediterranean" }
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "FAMILY_HISTORY", payload_summary: "thyroid, maternal" }
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /dispensary-products"
              payload: { sku: "MAG-GLY-400", name: "Magnesium Glycinate", supplement_class: "VITAMIN_MINERAL", retail_price_cents: 4995, practitioner_cost_cents: 3000 }
              as: PracticeAdmin
              captures: { prod_id: $.data.id }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { pt_v: $.data.version, book_score: $.data.intake_booking_score, prot_score: $.data.intake_protocol_score }
            - call: "POST /protocols"
              payload: { patient_id: "${pt_id}", title: "Foundational repletion", symptom_score_baseline: 28, expected_patient_version: "${pt_v}" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /protocols/${proto_id}/items"
              payload: { product_id: "${prod_id}", dose_amount_mg: 400, frequency_per_day: 1, duration_days: 60, titration_interval_days: 14 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "IN_PERSON", scheduled_start: "2026-06-01T15:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc_id: $.data.id }
            - call: "POST /protocols/${proto_id}/issue"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { issue_err: $.data.error_id }
          assert:
            - "Patient.${pt_id}.intake_booking_score == 87"
            - "Patient.${pt_id}.intake_protocol_score == 75"
            - "POST /encounters returned 201 and Encounter.${enc_id}.scheduling_status == SCHEDULED"
            - "POST /protocols/${proto_id}/issue returned 422 with error_id ERR_INTAKE_INCOMPLETE"
            - "Protocol.${proto_id}.status == DRAFT"

      - name: analyte_in_standard_range_but_above_functional_optimal
        grounds:
          - calculations.analyte_band_classification
          - entities.LabResult.fields.standard_band
          - entities.LabResult.fields.optimal_band
          - state_machines.LabOrder.COLLECTED_to_RESULTED
        distinguishing_aspect: |
          This instance's dual variant lives on the LabResult domain, a different entity
          domain from the intake instance: TSH 4.2 with a standard range of 0.45..4.50 and
          a functional range of 1.00..2.50 classifies IN_RANGE conventionally and
          ABOVE_OPTIMAL functionally from one and the same posted value.
        test_recipe:
          setup:
            - "An ND, an OR patient, and a SERUM_METABOLIC cash lab order that has been collected"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_id: "${pt_id}", panel_code: "SERUM_METABOLIC", funding_source: "CASH", requested_collection_date: "2026-05-04", fasting_attested: true }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { lo_id: $.data.id }
            - call: "POST /lab-orders/${lo_id}/collect"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          trigger:
            - call: "POST /lab-orders/${lo_id}/results"
              payload: { analyte_code: "TSH", value: 4.2, unit: "uIU/mL", standard_low: 0.45, standard_high: 4.50, optimal_low: 1.00, optimal_high: 2.50, critical_low: 0.10, critical_high: 10.00 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { res_id: $.data.id }
          assert:
            - "LabResult.${res_id}.standard_band == IN_RANGE"
            - "LabResult.${res_id}.optimal_band == ABOVE_OPTIMAL"
            - "LabResult.${res_id}.is_critical == false"
            - "LabOrder.${lo_id}.status == RESULTED"
            - "LabOrder.${lo_id}.has_critical_result == false"

      - name: encounter_settlement_entitlement_first_versus_cash_fallback
        grounds:
          - calculations.encounter_settlement
          - entities.Encounter.fields.cash_charged_cents
          - state_machines.Encounter.ENTITLEMENT_RESERVED_to_ENTITLEMENT_CONSUMED
          - state_machines.Encounter.CASH_PENDING_to_CASH_CHARGED
        distinguishing_aspect: |
          This instance's dual variant lives on the Encounter domain: two 75-minute
          TELEHEALTH visits with identical duration and modality settle at 9000 cents when
          a membership visit unit was reserved and at 27000 cents when it was not, because
          entitlement absorbs the base fee only and extended-time blocks are always cash.
        test_recipe:
          setup:
            - "One ND licensed in OR; patient A holds a CORE membership with visits_remaining 4, patient B holds none"
            - "Both patients have intake_booking_score 65 (CHIEF 25 + SYSTEMS 25 + DIET 15 attested)"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Member", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}", telehealth_consent: true }
              as: PracticeAdmin
              captures: { pt_a: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ben Cash", email: "ben@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}", telehealth_consent: true }
              as: PracticeAdmin
              captures: { pt_b: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_a}", tier: "CORE", cycle_start_date: "2026-05-01" }
              as: PracticeAdmin
              captures: { mem_a: $.data.id }
            - call: "POST /patients/${pt_a}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_a}"
              captures: { a_cc: $.data.id }
            - call: "POST /intake-sections/${a_cc}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_a}"
            - call: "POST /patients/${pt_a}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
              as_user_id: "${pt_a}"
              captures: { a_sr: $.data.id }
            - call: "POST /intake-sections/${a_sr}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_a}"
            - call: "POST /patients/${pt_a}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "whole food" }
              as: Patient
              as_user_id: "${pt_a}"
              captures: { a_dl: $.data.id }
            - call: "POST /intake-sections/${a_dl}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_a}"
            - call: "POST /patients/${pt_b}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_b}"
              captures: { b_cc: $.data.id }
            - call: "POST /intake-sections/${b_cc}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_b}"
            - call: "POST /patients/${pt_b}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
              as_user_id: "${pt_b}"
              captures: { b_sr: $.data.id }
            - call: "POST /intake-sections/${b_sr}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_b}"
            - call: "POST /patients/${pt_b}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "whole food" }
              as: Patient
              as_user_id: "${pt_b}"
              captures: { b_dl: $.data.id }
            - call: "POST /intake-sections/${b_dl}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_b}"
            - call: "POST /encounters"
              payload: { patient_id: "${pt_a}", practitioner_id: "${nd_id}", modality: "TELEHEALTH", scheduled_start: "2026-06-01T15:00:00Z", scheduled_end: "2026-06-01T16:30:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc_a: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pt_b}", practitioner_id: "${nd_id}", modality: "TELEHEALTH", scheduled_start: "2026-06-01T17:00:00Z", scheduled_end: "2026-06-01T18:30:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc_b: $.data.id }
          trigger:
            - call: "POST /encounters/${enc_a}/complete"
              payload: { duration_minutes: 75, service_code: "99215", diagnosis_codes: ["E03.9"] }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /encounters/${enc_b}/complete"
              payload: { duration_minutes: 75, service_code: "99215", diagnosis_codes: ["E03.9"] }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          assert:
            - "Encounter.${enc_a}.billing_status == ENTITLEMENT_CONSUMED"
            - "Encounter.${enc_a}.base_fee_cents == 18000"
            - "Encounter.${enc_a}.extended_block_count == 2"
            - "Encounter.${enc_a}.cash_charged_cents == 9000"
            - "Encounter.${enc_b}.billing_status == CASH_CHARGED"
            - "Encounter.${enc_b}.extended_block_count == 2"
            - "Encounter.${enc_b}.cash_charged_cents == 27000"
            - "Patient.${pt_a}.cash_charged_total_cents == 9000"
            - "Patient.${pt_b}.cash_charged_total_cents == 27000"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: dispense_rounds_per_unit_before_multiplying_by_quantity
        grounds:
          - calculations.dispense_line_pricing
          - entities.Dispense.fields.unit_price_cents
          - entities.Dispense.fields.total_price_cents
          - entities.DispensaryProduct.fields.retail_price_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents. Retail 4995 at the
          CORE 10% discount over 3 units gives 13488 when the unit price is rounded first
          (4495.5 -> 4496, times 3) and 13487 when the line is summed first (14985 * 0.9 =
          13486.5 -> 13487). The scaffold pins per-unit rounding, so 13488 is correct.
        test_recipe:
          setup:
            - "An ND, a DispensaryTech, an OR patient with four attested intake sections (protocol score 90)"
            - "A CORE membership so the MEMBER pricing variant applies (10% discount)"
            - "A product priced 4995 retail / 3000 practitioner cost with a lot of 20 units expiring 2026-12-31"
            - "An ACTIVE protocol carrying one item for that product"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /practitioners"
              payload: { full_name: "Tess Ortiz", credential: "DISPENSARY_TECH", licensed_state_codes: ["OR"] }
              as: PracticeAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /memberships"
              payload: { patient_id: "${pt_id}", tier: "CORE", cycle_start_date: "2026-05-01" }
              as: PracticeAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s1: $.data.id }
            - call: "POST /intake-sections/${s1}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s2: $.data.id }
            - call: "POST /intake-sections/${s2}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "MEDICATIONS_SUPPLEMENTS", payload_summary: "none" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s3: $.data.id }
            - call: "POST /intake-sections/${s3}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "whole food" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s4: $.data.id }
            - call: "POST /intake-sections/${s4}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /dispensary-products"
              payload: { sku: "MAG-GLY-400", name: "Magnesium Glycinate", supplement_class: "VITAMIN_MINERAL", retail_price_cents: 4995, practitioner_cost_cents: 3000 }
              as: PracticeAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dispensary-products/${prod_id}/lots"
              payload: { lot_code: "L-2026-A", quantity_initial: 20, expiry_date: "2026-12-31" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { pt_v: $.data.version }
            - call: "POST /protocols"
              payload: { patient_id: "${pt_id}", title: "Repletion", symptom_score_baseline: 28, expected_patient_version: "${pt_v}" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /protocols/${proto_id}/items"
              payload: { product_id: "${prod_id}", dose_amount_mg: 400, frequency_per_day: 1, duration_days: 60, titration_interval_days: 14 }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { item_id: $.data.id }
            - call: "POST /protocols/${proto_id}/issue"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /protocols/${proto_id}/activate"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "GET /protocols/${proto_id}"
              payload: {}
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { proto_v: $.data.version }
          trigger:
            - call: "POST /dispenses"
              payload: { protocol_item_id: "${item_id}", quantity: 3, expected_protocol_version: "${proto_v}" }
              as: DispensaryTech
              as_user_id: "${tech_id}"
              captures: { disp_id: $.data.id }
          assert:
            - "Dispense.${disp_id}.pricing_variant == MEMBER"
            - "Dispense.${disp_id}.unit_price_cents == 4496"
            - "Dispense.${disp_id}.total_price_cents == 13488"
            - "Dispense.${disp_id}.product_lot_id == ${lot_id}"
            - "ProductLot.${lot_id}.quantity_on_hand == 17"
            - "Patient.${pt_id}.cash_charged_total_cents == 13488"

      - name: extended_visit_block_ceiling_at_and_past_the_threshold
        grounds:
          - calculations.encounter_settlement
          - entities.Encounter.fields.extended_block_count
          - entities.Encounter.fields.cash_charged_cents
          - state_machines.Encounter.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) — three inputs (modality, duration_minutes, and which billing bucket the
          encounter landed in at booking) interacting non-linearly through a ceiling and a
          conditional branch: 45 minutes buys zero blocks (22500 cents) while 46 minutes
          already buys a whole block (27000 cents) for the same IN_PERSON cash visit.
        test_recipe:
          setup:
            - "One ND and one cash-pay OR patient with intake_booking_score 65"
            - "Two IN_PERSON encounters booked on non-overlapping windows, both CASH_PENDING"
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Nora Vance", credential: "ND", licensed_state_codes: ["OR"], npi: "1234567893" }
              as: PracticeAdmin
              captures: { nd_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ben Cash", email: "ben@example.com", state_code: "OR", primary_practitioner_id: "${nd_id}" }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "CHIEF_COMPLAINT_TIMELINE", payload_summary: "fatigue" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s1: $.data.id }
            - call: "POST /intake-sections/${s1}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "SYSTEMS_REVIEW", payload_summary: "sleep" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s2: $.data.id }
            - call: "POST /intake-sections/${s2}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /patients/${pt_id}/intake-sections"
              payload: { section_type: "DIET_LIFESTYLE", payload_summary: "whole food" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { s3: $.data.id }
            - call: "POST /intake-sections/${s3}/attest"
              payload: {}
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "IN_PERSON", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc45: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pt_id}", practitioner_id: "${nd_id}", modality: "IN_PERSON", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
              captures: { enc46: $.data.id }
          trigger:
            - call: "POST /encounters/${enc45}/complete"
              payload: { duration_minutes: 45, service_code: "99214", diagnosis_codes: ["R53.83"] }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
            - call: "POST /encounters/${enc46}/complete"
              payload: { duration_minutes: 46, service_code: "99214", diagnosis_codes: ["R53.83"] }
              as: NaturopathicDoctor
              as_user_id: "${nd_id}"
          assert:
            - "Encounter.${enc45}.extended_block_count == 0"
            - "Encounter.${enc45}.cash_charged_cents == 22500"
            - "Encounter.${enc46}.extended_block_count == 1"
            - "Encounter.${enc46}.cash_charged_cents == 27000"
            - "Patient.${pt_id}.cash_charged_total_cents == 49500"

      - name: tier_change_proration_pinned_evaluation_order
        grounds:
          - calculations.membership_tier_change_proration
          - entities.Membership.fields.last_proration_net_charge_cents
          - entities.Membership.fields.visits_granted
          - concurrency_rules[tier-change-stale-membership]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned by step order. The money legs read
          remaining_days (17) before the entitlement legs rewrite the counters, and step 8
          subtracts the OLD remaining before adding the new grant: net charge 19777 - 11277
