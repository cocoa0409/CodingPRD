              captures: { g1: $.data.id }
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-02", gse_type: "PUSHBACK_TUG", condition_score: 70, service_interval_cycles: 30, cycles_since_service: 5 }
