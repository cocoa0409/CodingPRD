          assert:
            - "${posture_frozen} == FROZEN before the trigger and AdvertiserContract.${ac1_id}.guarantee_status == SUSPENDED_PENDING_RESTATEMENT"
            - "the first certify returns HTTP 409 with ${err} == ERR_PUBLICATION_FROZEN and CirculationStatement.${st_new_id}.status is still DRAFT"
            - "${st_r_total} == 1200 (all three evidence conditions of the AUDIT_VERIFIED variant hold: VERIFIED request, RETAINED document, retention_expires_at 2029-07-15 after period_end)"
            - "${st_r_status} == FILED — the FROZEN gate does not apply to the restating statement"
            - "CirculationStatement.${st1_id}.status == SUPERSEDED"
            - "Publication.${pub_id}.audit_posture == OPEN after the restatement is filed"
            - "AdvertiserContract.${ac1_id}.guarantee_status == ACTIVE again"
            - "CirculationStatement.${st_new_id}.status is still DRAFT and may now be certified"

      - name: create_request_citing_purged_source_document_rejected
        grounds:
