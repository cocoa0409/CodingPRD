      - name: attempt_event_window_is_inclusive_at_exactly_twenty_four_hours
        claim_type: weighted_scoring
        grounds:
          - calculations.patient_elopement_risk_score.variants.rolling_event_weighted
          - endpoints.POST_observation_orders__id_reassessments
        distinguishing_aspect: "The attempt component uses `occurred_at >= clock_now - 24h`, so the same event contributes 1.0 when reassessed at exactly 24h and 0.0 one second later. Two reassessments on one order make the drop observable as score_after 2.5 then score_after 1.5, with no other input changing."
