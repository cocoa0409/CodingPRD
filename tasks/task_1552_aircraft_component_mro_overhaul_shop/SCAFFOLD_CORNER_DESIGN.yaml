        distinguishing_aspect: "Every resource family returns its specific *_NOT_FOUND (or the generic ERR_NOT_FOUND for invoices) on a well-formed unknown UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mro/customers/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e1: $.data.error_id } }
            - { call: "GET /mro/part-catalog/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e2: $.data.error_id } }
            - { call: "GET /mro/units/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e3: $.data.error_id } }
            - { call: "POST /mro/parts-requisitions/00000000-0000-4000-8000-000000000000/source-approval", payload: { approved: true }, as: PartsBuyer, captures: { e4: $.data.error_id } }
            - { call: "GET /mro/test-cells/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e5: $.data.error_id } }
            - { call: "GET /mro/exchange-agreements/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e6: $.data.error_id } }
            - { call: "GET /mro/lease-agreements/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e7: $.data.error_id } }
            - { call: "GET /mro/invoices/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { e8: $.data.error_id } }
          assert:
            - "e1=='ERR_CUSTOMER_NOT_FOUND', e2=='ERR_PART_NOT_FOUND', e3=='ERR_UNIT_NOT_FOUND', e4=='ERR_REQUISITION_NOT_FOUND', e5=='ERR_TEST_CELL_NOT_FOUND', e6=='ERR_EXCHANGE_NOT_FOUND', e7=='ERR_LEASE_NOT_FOUND', e8=='ERR_NOT_FOUND' — all HTTP 404"
      - name: exchange_core_return_before_fulfill_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ExchangeAgreement, "errors[ERR_EXCHANGE_INVALID_STATE]"]
        distinguishing_aspect: "core-return on an OPEN agreement (never fulfilled) fails 409 ERR_EXCHANGE_INVALID_STATE; the state check fires before any core field validation."
        test_recipe:
          setup: ["customer, part, core unit, and an OPEN exchange agreement"]
          setup_api_calls:
