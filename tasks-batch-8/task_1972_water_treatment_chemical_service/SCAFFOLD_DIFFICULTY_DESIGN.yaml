  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across DIFFERENT error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_delivery_schedule
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_PROGRAM_NOT_ACCEPTED]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: scheduling a delivery whose
          asset lacks an ACCEPTED ProgramDesign (state gate, priority 7 tier)
          while the account is on credit_hold (fiscal gate, priority 14) must
          return ERR_PROGRAM_NOT_ACCEPTED, not ERR_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Account A on credit_hold=true; asset with NO accepted design; ONLINE station; order submitted to PENDING with OCC version captured"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "DualFail Co", credit_hold: true }
              as: AccountManager
              captures: { c5a_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c5a_acct}", asset_tag: "CT-D", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c5a_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "DF-INH", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { c5a_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c5a_asset}", product_id: "${c5a_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { c5a_fs: $.data.id }
            - { call: "POST /wt/feed-stations/${c5a_fs}/bring-online", payload: {}, as: WaterChemist }
            - call: "POST /wt/delivery-orders"
              payload: { account_id: "${c5a_acct}", station_id: "${c5a_fs}", quantity_gal: 55 }
              as: AccountManager
              captures: { c5a_do: $.data.id, c5a_do_v: $.data.version }
            - { call: "POST /wt/delivery-orders/${c5a_do}/submit", payload: {}, as: AccountManager }
          trigger:
            - call: "POST /wt/delivery-orders/${c5a_do}/schedule"
              payload: { scheduled_for: "2026-08-10T00:00:00Z", expected_delivery_order_version: "${c5a_do_v}" }
              as: AccountManager
              captures: { c5a_err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROGRAM_NOT_ACCEPTED"
            - "response error_id != ERR_CREDIT_HOLD"
            - "DeliveryOrder.${c5a_do}.status == PENDING"

      - name: safety_vs_referential_on_result_recording
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_ASSET_FROZEN]
          - errors[ERR_ASSET_MISMATCH]
        distinguishing_aspect: |
          Category pair business_safety-adjacent state gate (ERR_ASSET_FROZEN,
          priority 7 tier) vs business_referential (ERR_ASSET_MISMATCH,
          priority 13 tier): recording a result with a body asset_id that does
          not match the stop's asset while the stop's asset posture is FROZEN
          must return ERR_ASSET_FROZEN (state tier 7), not ERR_ASSET_MISMATCH
          (referential tier 13) — a different category pair than the
          state-vs-fiscal instance.
        test_recipe:
          setup:
            - "Commissioned asset AS-S (stop ST-S ARRIVED, window [2026-08-02T00:00:00Z, 2026-08-02T06:00:00Z)) whose LegionellaRiskPlan is SUSPENDED by AccountManager => posture FROZEN; second asset AS-T exists on the same account; clock 2026-08-02T01:00:00Z"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Safety Co" }
              as: AccountManager
              captures: { c5b_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c5b_acct}", asset_tag: "CT-SAFE", asset_type: "COOLING_TOWER", recirculation_rate_gpm: 300, system_volume_gal: 6000, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { c5b_asset: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${c5b_acct}", asset_tag: "CT-OTHER", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 2000, metallurgy: "STAINLESS" }
              as: WaterChemist
              captures: { c5b_other: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "SF-INH", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { c5b_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${c5b_asset}", product_id: "${c5b_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { c5b_fs: $.data.id }
            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c5b_asset}" }
              as: WaterChemist
              captures: { c5b_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c5b_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c5b_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 9.5, conductivity_max_umhos: 3000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c5b_pd}/propose"
