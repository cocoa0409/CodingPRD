              as: PassOfficeClerk
              captures: { res_ok: "$.data.id" }
          assert:
            - "first trigger: HTTP 422 with data.error_id == 'ERR_PARK_DAY_PROGRAM_MISMATCH'"
            - "GET /park-days/${day_b} → data.reserved_count == 0 and data.grant_count == 0"
            - "second trigger: HTTP 201 with data.status == 'CONFIRMED'"
            - "GET /park-days/${day_a} → data.reserved_count == 1, data.remaining_slot_count == 99, data.grant_count == 1"

      - name: reservation_succeeds_when_every_rule_is_satisfied
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=92]
          - validations[priority=100]
          - validations[priority=101]
          - endpoints[POST /reservations]
        distinguishing_aspect: "The positive control for the whole reservation rule stack: an ACTIVE, PAID_IN_FULL BRONZE pass booking its first window on an unblocked PEAK day with free day-level and window-level slots returns 201 and moves exactly one slot unit."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE and a PEAK park day 2026-09-15 (40 / 36 → 0.9000, reservation_slot_capacity 4, window_slot_capacity 2)."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL, holding no reservations."
          setup_api_calls:
