# =============================================================================
# Task 1193 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × ≥2 instances. Every instance is grounded in SCAFFOLD.yaml §1.1–§1.7
# and drives empty-DB → target state using only §1.5 endpoints.
# All formula-derived asserts were computed by executing the §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fabric_requirement_provisional_vs_final
        grounds:
          - calculations.fabric_requirement_provisional
          - calculations.fabric_requirement_final
          - entities.OrderLine.fields.required_yards_provisional
          - entities.OrderLine.fields.required_yards_final
        distinguishing_aspect: |
          Entity domain = OrderLine/CutPlan yardage. The provisional variant (spec-sheet
          width 54, pattern-match ceil, tiered waste) yields 14.950 for the fixture line,
          while the final variant (marker length 13.0 × 52 / (measured width 50 − 2))
          yields 14.083 for the SAME line — two valid algorithms, different results.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z"
            - "Model CAMDEN-SOFA: base_fabric_yards 3.0, requires_pattern_match true, TB117_2013, no required components, option rule (grade A, ESPRESSO, allowed, surcharge 0)"
            - "PLANT spec FAB-PEBBLE-A: width 54, repeat_v 9.0, STRAIGHT match"
            - "One AVAILABLE lot of 25.0 yards inspected at measured width 50"
            - "Order ORD-1001 with one PLANT_STOCK line qty 4, confirmed; FEFO reserved 14.950 yards"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "CAMDEN-SOFA", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 100000, requires_pattern_match: true, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-PEBBLE-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, pattern_repeat_v_inches: 9.0, pattern_repeat_h_inches: 0.0, match_method: "STRAIGHT", price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 25.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 25.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 25.0, rejected_yards: 0.0, measured_width_inches: 50.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-1001", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
          trigger:
            - call: "GET /mill/order-lines/${line_id}"
              as: SalesRep
              captures: { ln_v: $.data.version }
            - call: "POST /mill/order-lines/${line_id}/cut-plans"
              payload: { expected_order_line_version: "${ln_v}" }
              as: ProductionPlanner
              captures: { cp_id: $.data.id }
            - call: "POST /mill/cut-plans/${cp_id}/approve"
              payload: { marker_length_yards: 13.0 }
              as: ProductionPlanner
          assert:
            - "OrderLine.${line_id}.required_yards_provisional == 14.950 (width_factor 54/52, ceil(3.1154/0.25)=13 repeats × 0.25 × 4 units × 1.15 waste)"
            - "CutPlan.${cp_id}.required_yards_final == 14.083 (13.0 × 52 / (50 − 2))"
            - "OrderLine.${line_id}.required_yards_final == 14.083"
            - "14.083 != 14.950 — the two variants diverge on identical line data"

      - name: freight_charge_ltl_vs_white_glove
        grounds:
          - calculations.freight_charge
          - calculations.freight_classification
          - entities.Shipment.fields.method
        distinguishing_aspect: |
          Entity domain = Shipment pricing (distinct from the OrderLine/CutPlan yardage
          instance). Identical shipment data (240 lb, 60x30x36 in, 3 pieces, no declared
          value) prices at 36816 cents under the ltl_density variant (density 6.4 →
          CLASS_125 → 240 × 130 + 18% fuel) and at 30000 cents under the white_glove_flat
          variant (max(15000, 3 × 8500) + 4500).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z"
            - "Model M-LOUNGE (no pattern match), PLANT spec FAB-B, dealer DLR-001"
            - "Order O-LTL (delivery_method LTL_FREIGHT) with one line, confirmed with no stock (lands MATERIAL_HOLD — shipment create is legal in MATERIAL_HOLD)"
            - "Order O-WG (delivery_method WHITE_GLOVE) with one line, confirmed into MATERIAL_HOLD"
            - "One DRAFT shipment per order, identical weights/dims/pieces"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-LOUNGE", category: "CHAIR", base_fabric_yards: 2.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "B", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-B", origin: "PLANT", grade: "B", nominal_width_inches: 54.0, price_per_yard_cents: 2000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-LTL", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_ltl: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_ltl}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
            - call: "POST /mill/customer-orders/${order_ltl}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-WG", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "WHITE_GLOVE" }
              as: SalesRep
              captures: { order_wg: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_wg}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
            - call: "POST /mill/customer-orders/${order_wg}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/shipments"
              payload: { order_id: "${order_ltl}", carrier_name: "Averitt", weight_lb: 240.0, length_in: 60.0, width_in: 30.0, height_in: 36.0, declared_value_cents: 0, piece_count: 3 }
              as: ShippingCoordinator
              captures: { ship_ltl: $.data.id }
            - call: "POST /mill/shipments"
              payload: { order_id: "${order_wg}", carrier_name: "Averitt", weight_lb: 240.0, length_in: 60.0, width_in: 30.0, height_in: 36.0, declared_value_cents: 0, piece_count: 3 }
              as: ShippingCoordinator
              captures: { ship_wg: $.data.id }
          trigger:
            - call: "POST /mill/shipments/${ship_ltl}/rate"
              payload: {}
              as: ShippingCoordinator
            - call: "POST /mill/shipments/${ship_wg}/rate"
              payload: {}
              as: ShippingCoordinator
          assert:
            - "Shipment.${ship_ltl}.method == LTL and freight_class == CLASS_125 (density 240 / 37.5 = 6.4 ≥ 6)"
            - "Shipment.${ship_ltl}.freight_charge_cents == 36816 (base 240 × 130 = 31200; fuel 5616)"
            - "Shipment.${ship_wg}.method == WHITE_GLOVE and freight_charge_cents == 30000 (max(15000, 3 × 8500) + 4500)"
            - "36816 != 30000 — identical inputs, method-selected variants diverge"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — all distinct)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_yardage_pattern_interaction
        grounds:
          - calculations.fabric_requirement_provisional
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear interaction — width factor max(), conditional
          pattern-match branch with ceil() at repeat granularity, DROP_HALF 1.5× repeat
          multiplier, and a quantity-tiered waste factor. Same yardage base and quantity,
          three match configurations: STRAIGHT → 14.950, no-match → 14.331, DROP_HALF → 15.525.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer DLR-001"
            - "Spec FAB-STRAIGHT (repeat 9.0, STRAIGHT) and spec FAB-DROP (repeat 9.0, DROP_HALF), both PLANT grade A width 54"
            - "Model M-PM (requires_pattern_match true) and M-NP (false); both TB117_2013, base 3.0 yards, option rule (A, ESPRESSO, allowed, 0)"
            - "One order with three PLANT_STOCK lines qty 4: L1 = M-PM × FAB-STRAIGHT, L2 = M-NP × FAB-STRAIGHT, L3 = M-PM × FAB-DROP; no lots exist"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-STRAIGHT", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, pattern_repeat_v_inches: 9.0, match_method: "STRAIGHT", price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_s: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-DROP", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, pattern_repeat_v_inches: 9.0, match_method: "DROP_HALF", price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_d: $.data.id }
            - call: "POST /mill/product-models"
              payload: { model_code: "M-PM", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: true, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_pm: $.data.id }
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 40000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_np: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-PM", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_pm}", fabric_spec_id: "${spec_s}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_np}", fabric_spec_id: "${spec_s}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line2: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_pm}", fabric_spec_id: "${spec_d}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line3: $.data.id }
          trigger:
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
          assert:
            - "OrderLine.${line1}.required_yards_provisional == 14.950 (ceil(3.1154/0.25)=13 repeats)"
            - "OrderLine.${line2}.required_yards_provisional == 14.331 (no match branch: 3.0 × 54/52 × 4 × 1.15)"
            - "OrderLine.${line3}.required_yards_provisional == 15.525 (DROP_HALF repeat 0.375: ceil(3.1154/0.375)=9 × 0.375 × 4 × 1.15)"
            - "CustomerOrder.${order_id}.status == MATERIAL_HOLD (no lots; all three lines short)"

      - name: order_pricing_rounding_order
        grounds:
          - calculations.order_pricing
          - entities.OrderLine.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each unit price FIRST
          (round_half_up(10002 × 1.13) = 11302), then multiply by quantity (× 2 = 22604).
          The unpinned sum-then-round reading gives 22605; the scaffold's pinned order gives 22604.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer with credit_limit 1000000"
            - "Model M-PRICE: base_price_cents 10002, option rule (grade C, WALNUT, allowed, surcharge_pct 0.13), TB133, no components"
            - "PLANT spec FAB-C grade C; one order with one PLANT_STOCK line qty 2 finish WALNUT"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-PRICE", category: "CHAIR", base_fabric_yards: 2.0, base_price_cents: 10002, requires_pattern_match: false, flammability_standard: "TB133", required_component_codes: [], option_rules: [{ fabric_grade: "C", finish_code: "WALNUT", allowed: true, surcharge_pct: 0.13, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-C", origin: "PLANT", grade: "C", nominal_width_inches: 54.0, price_per_yard_cents: 4000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 1000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-PRICE", dealer_id: "${dealer_id}", ship_to_state: "VA", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "WALNUT", quantity: 2 }
              as: SalesRep
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
          assert:
            - "OrderLine.${line_id}.unit_price_cents == 11302 (round_half_up(10002 × 1.13) per unit, BEFORE multiplying)"
            - "OrderLine.${line_id}.line_total_cents == 22604 (11302 × 2; NOT 22605 from sum-then-round)"
            - "CustomerOrder.${order_id}.subtotal_cents == 22604 and total_cents == 22604 (no COM credit)"

      - name: freight_fuel_evaluation_order
        grounds:
          - calculations.freight_charge
          - calculations.freight_classification
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — fuel_cents is
          computed on base_cents ONLY (round_half_up(31200 × 0.18) = 5616) and total =
          base + fuel; a fuel-on-total fixed-point reading would not yield 36816.
          Distinct mode from instances (a) and (b) above.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-LOUNGE; PLANT spec FAB-B"
            - "Order ORD-FUEL (LTL_FREIGHT) with one line qty 1, confirmed into MATERIAL_HOLD"
            - "DRAFT shipment: 240 lb, 60x30x36 in, declared_value 0, 3 pieces"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-LOUNGE", category: "CHAIR", base_fabric_yards: 2.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "B", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-B", origin: "PLANT", grade: "B", nominal_width_inches: 54.0, price_per_yard_cents: 2000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-FUEL", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/shipments"
              payload: { order_id: "${order_id}", carrier_name: "Averitt", weight_lb: 240.0, length_in: 60.0, width_in: 30.0, height_in: 36.0, declared_value_cents: 0, piece_count: 3 }
              as: ShippingCoordinator
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /mill/shipments/${ship_id}/rate"
              payload: {}
              as: ShippingCoordinator
          assert:
            - "Shipment.${ship_id}.density_lb_per_cuft == 6.4 and freight_class == CLASS_125"
            - "Shipment.${ship_id}.freight_charge_cents == 36816 (base 31200 first, fuel = 18% of base = 5616 second, then sum — pinned order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_hold_and_rework_cycles
        grounds:
          - state_machines.CustomerOrder.MATERIAL_HOLD_to_CONFIRMED
          - state_machines.CustomerOrder.CONFIRMED_to_MATERIAL_HOLD
          - state_machines.CustomerOrder.QUALITY_REVIEW_to_IN_PRODUCTION
          - state_machines.OrderLine.UPHOLSTERED_to_SEWN
        distinguishing_aspect: |
          Entity = CustomerOrder (cyclic): the MATERIAL_HOLD → CONFIRMED bubble-up cycle
          runs first (COM shortfall resolved by inspection), then the QUALITY_REVIEW →
          IN_PRODUCTION rework loop runs, sending the line UPHOLSTERED → SEWN and back.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer DLR-001"
            - "Model M-HOLD (no pattern match, TB117_2013, no components, rule (COM, ANY, allowed, 0)); COM spec FAB-COM-X (grade COM, width 54, com_credit 250)"
            - "Order ORD-CYC with one COM line qty 2; confirmed → line MATERIAL_SHORTFALL, order MATERIAL_HOLD"
            - "COM lot bound to the line, received 10.0 and inspected PASS (usable 10.0, measured 54) by qi-1 → auto-allocation covers 7.165 → line ALLOCATED, order CONFIRMED"
            - "Three cells (CUTTING/SEWING/UPHOLSTERY, capacity 1, certifications [COM_HANDLING])"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-HOLD", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 80000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "COM", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-COM-X", origin: "CUSTOMER", grade: "COM", nominal_width_inches: 54.0, com_credit_per_yard_cents: 250 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-CYC", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "COM", finish_code: "ESPRESSO", quantity: 2 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", order_line_id: "${line_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
