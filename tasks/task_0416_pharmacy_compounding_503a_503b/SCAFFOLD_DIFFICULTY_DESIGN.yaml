              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Vancomycin HCl", lot_number: "V-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 100 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "STERILITY" }
              as: QualityAssurancePharmacist
              captures: { qc_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
          trigger:
            - call: "POST /pharmacy-compounding/qc-tests/${qc_id}/record"
              payload: { pass: false }
              as: QualityAssurancePharmacist
              captures: { result: $.data.result }
          assert:
            - "QualityControlTest.${qc_id}.result == FAILED"
            - "IngredientLot.${lot_id}.status == QUARANTINED (contamination-trace cascade from the failed STERILITY test on a sterile batch)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_segregation_safety_beats_anticipatory_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_ANTICIPATORY_LIMIT_EXCEEDED]
          - state_machines.CompoundingBatch.QUARANTINED_to_RELEASED
        distinguishing_aspect: |
          A single OFFICE_USE release request violates BOTH segregation of duties
          (business_safety, priority 7: releaser == compiler) AND the anticipatory
          cap (business_fiscal, priority 15). The lower-numbered safety check wins:
          ERR_SEGREGATION_OF_DUTIES (403), not ERR_ANTICIPATORY_LIMIT_EXCEEDED —
          a business_safety vs business_fiscal pairing.
