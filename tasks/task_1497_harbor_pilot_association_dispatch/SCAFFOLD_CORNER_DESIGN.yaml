      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Past
          gt: 1000
          draft_dm: 50
          order_type: ARRIVAL
          eta: '2026-07-01T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          err_past: $.data.error_id
      assert:
      - err_eq == ERR_ETA_IN_PAST (equality rejected — strictly-greater rule)
      - err_past == ERR_ETA_IN_PAST
  - name: order_patch_occ_stale_version_returns_412
    claim_type: violation_to_error
    grounds:
    - concurrency_rules[order-amend-stale-version]
    - validations[priority=4]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'Two strictly sequential PATCHes carrying the same observed version: the first succeeds (version 1->2), the second is rejected 412 ERR_STALE_VERSION.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; O1 BOOKED version 1
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Occ
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
          o_v: $.data.version
      trigger:
      - call: PATCH /pilotage/vessel-orders/${o1_id}
        payload:
          eta: '2026-08-11T00:00:00Z'
          expected_order_version: ${o_v}
        as: VesselAgent
        as_user_id: agent-1
        captures:
          ok_v: $.data.version
      - call: PATCH /pilotage/vessel-orders/${o1_id}
        payload:
          eta: '2026-08-12T00:00:00Z'
          expected_order_version: ${o_v}
        as: VesselAgent
        as_user_id: agent-1
        captures:
          err: $.data.error_id
      assert:
      - ok_v == 2 (first PATCH advanced the version)
      - err == ERR_STALE_VERSION and HTTP 412 (second PATCH carried the stale ${o_v})
      - VesselOrder(o1_id).eta == 2026-08-11T00:00:00Z (loser's write absent)
  - name: endorsement_create_occ_stale_pilot_returns_412
    claim_type: violation_to_error
    grounds:
    - concurrency_rules[endorsement-create-stale-pilot]
    - validations[priority=4]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'Create-with-supersede OCC: after a first endorsement advances Pilot.version to 2, a second create still carrying the creation-time version 1 is rejected 412.'
    test_recipe:
      setup:
      - P1 exists, version 1 at creation
      setup_api_calls:
