# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_0085_i9_everify_onboarding  (Expert)
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_onboarding_returns_201_with_computed_deadline
        claim_type: Creation
        grounds: [entities.Onboarding, endpoints]
        distinguishing_aspect: "POST /onboardings with all required fields -> 201; section2_deadline computed, status CREATED, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Al Be", employee_email: "al@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
              captures: { ob: $.data.id, dl: $.data.section2_deadline }
          assert:
            - "HTTP status == 201"
            - "Onboarding.${ob}.status == CREATED"
            - "Onboarding.${ob}.version == 1"
            - "Onboarding.${ob}.section2_deadline == 2026-06-04T23:59:59.999Z"

      - name: get_onboarding_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Onboarding
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /onboardings/{nonexistent-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /onboardings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HRReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_onboarding_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Onboarding
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /onboardings omitting citizenship_status (required, no default) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /onboardings"
              payload: { employee_full_name: "No Cs", employee_email: "nocs@x.com", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_onboarding_requires_everify_defaults_true
        claim_type: Defaults
        grounds: [entities.Onboarding.fields.requires_everify]
        distinguishing_aspect: "Omitting requires_everify -> default true applied on the created onboarding."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /onboardings"
              payload: { employee_full_name: "De Fa", employee_email: "def@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
              captures: { ob: $.data.id }
          assert:
            - "Onboarding.${ob}.requires_everify == true"

      - name: create_onboarding_invalid_enum_citizenship_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Onboarding.fields.citizenship_status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "citizenship_status outside {US_CITIZEN, NONCITIZEN_NATIONAL, LPR, ALIEN_AUTHORIZED} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Ba Dz", employee_email: "bad@x.com", citizenship_status: "MARTIAN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: system_fields_ignored_on_onboarding_create
        claim_type: System Fields
        grounds: [entities.Onboarding.fields.status, entities.Onboarding.fields.section2_deadline]
        distinguishing_aspect: "Client-supplied status/section2_deadline are ignored; server mints status=CREATED and computes section2_deadline from hire_date."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Sy St", employee_email: "sys@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
              captures: { ob: $.data.id }
          assert:
            - "Onboarding.${ob}.status == CREATED"
            - "Onboarding.${ob}.section2_deadline == 2026-06-04T23:59:59.999Z"

      - name: list_onboardings_pagination_envelope
        claim_type: Listing
        grounds: [entities.Onboarding, endpoints]
        distinguishing_aspect: "GET /onboardings returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Two onboardings created."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "P1", employee_email: "p1@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
            - call: "POST /onboardings"
              payload: { employee_full_name: "P2", employee_email: "p2@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
          trigger:
            - call: "GET /onboardings"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
              captures: { tc: $.data.0.id }
          assert:
            - "response_type == array"
            - "meta total_count == 2 and has_more == true"

      - name: immutable_audit_entry_has_no_version
        claim_type: Immutability
        grounds: [entities.AuditEntry]
        distinguishing_aspect: "AuditEntry is common_fields:false (append-only): carries id + created_at, no version, no update endpoint."
        test_recipe:
          setup: ["An onboarding through Section 2 generates at least one AuditEntry."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Au Di", employee_email: "au@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "AP", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
          trigger:
            - call: "GET /audit-entries"
              payload: { onboarding_id: "${ob}" }
              as: ComplianceOfficer
              captures: { ae: $.data.0.id }
          assert:
            - "each AuditEntry exposes id and created_at and NO version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: section1_attest_from_already_section1_complete_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Onboarding.CREATED_to_SECTION1_COMPLETE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Re-attesting Section 1 on an onboarding already SECTION1_COMPLETE -> ERR_INVALID_STATE; idempotency rejection."
        test_recipe:
          setup: ["Onboarding with Section 1 already attested."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Re At", employee_email: "re@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
          trigger:
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: new_onboarding_starts_in_created
        claim_type: Initial State
        grounds: [state_machines.Onboarding]
        distinguishing_aspect: "Newly created onboarding is in initial_state CREATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /onboardings"
              payload: { employee_full_name: "In It", employee_email: "in@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z" }
              as: HRReviewer
              captures: { ob: $.data.id }
          assert:
            - "Onboarding.${ob}.status == CREATED"

      - name: finalize_from_authorized_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Onboarding
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "AUTHORIZED is terminal; a second finalize on an AUTHORIZED onboarding -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Non-E-Verify onboarding finalized to AUTHORIZED."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Te Rm", employee_email: "te@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "TP", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
            - call: "POST /onboardings/${ob}/finalize"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /onboardings/${ob}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: everify_result_authorized_bubbles_onboarding_to_authorized
        claim_type: Side Effect Execution
        grounds: [state_machines.EVerifyCase.SUBMITTED_to_EMPLOYMENT_AUTHORIZED, state_machines.Onboarding.EVERIFY_PENDING_to_AUTHORIZED]
        distinguishing_aspect: "A SUBMITTED case result=AUTHORIZED cascades the onboarding EVERIFY_PENDING -> AUTHORIZED (cross-entity bubble-up)."
        test_recipe:
          setup: ["Onboarding in EVERIFY_PENDING with a SUBMITTED case."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Bu Up", employee_email: "bu@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob}" }
              as: HRReviewer
              captures: { form: $.data.0.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "BP", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
              captures: { v2: $.data.version }
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob}", i9_form_id: "${form}", expected_onboarding_version: "${v2}" }
              as: EVerifyOperator
              captures: { case: $.data.id }
          trigger:
            - call: "POST /everify-cases/${case}/result"
              payload: { result: "AUTHORIZED" }
              as: EVerifyOperator
          assert:
            - "EVerifyCase.${case}.status == EMPLOYMENT_AUTHORIZED"
            - "Onboarding.${ob}.status == AUTHORIZED"

      - name: refer_from_submitted_without_tnc_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EVerifyCase.TNC_ISSUED_to_REFERRED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Referring a SUBMITTED case that has no TNC issued -> ERR_INVALID_STATE (refer only valid from TNC_ISSUED)."
        test_recipe:
          setup: ["E-Verify case in SUBMITTED (no TNC)."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "No Tnc", employee_email: "nt@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob}" }
              as: HRReviewer
              captures: { form: $.data.0.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "NP", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
              captures: { v2: $.data.version }
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob}", i9_form_id: "${form}", expected_onboarding_version: "${v2}" }
              as: EVerifyOperator
              captures: { case: $.data.id }
          trigger:
            - call: "POST /everify-cases/${case}/refer"
              payload: {}
              as: EVerifyOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: reverification_due_auto_transition_on_clock_advance
        claim_type: Side Effect Execution
        grounds: [state_machines.Onboarding.AUTHORIZED_to_REVERIFICATION_DUE]
        distinguishing_aspect: "Advancing the clock past the controlling auth's effective_valid_until then advance-lifecycle moves AUTHORIZED -> REVERIFICATION_DUE."
        test_recipe:
          setup: ["AUTHORIZED non-E-Verify onboarding with a controlling EAD auth valid_until 2026-12-31."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Rv Du", employee_email: "rv@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-12-31T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob}", auth_type: "EAD", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: HRReviewer
              captures: { wa: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "EAD", document_number: "RD", expiration_date: "2026-12-31T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
            - call: "POST /onboardings/${ob}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /onboardings/${ob}/advance-lifecycle"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "Onboarding.${ob}.status == REVERIFICATION_DUE"

      - name: expired_unauthorized_when_reverification_lapses
        claim_type: Side Effect Execution
        grounds: [state_machines.Onboarding.REVERIFICATION_DUE_to_EXPIRED_UNAUTHORIZED]
        distinguishing_aspect: "REVERIFICATION_DUE with no Section 3 recorded and clock advanced past expiry -> EXPIRED_UNAUTHORIZED on advance-lifecycle."
        test_recipe:
          setup: ["Onboarding in REVERIFICATION_DUE (auth lapsed 2026-12-31), clock advanced to 2027-02-01, no Section 3."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Ex Un", employee_email: "ex@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-12-31T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob}", auth_type: "EAD", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: HRReviewer
              captures: { wa: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_A", document_title: "EAD", document_number: "EU", expiration_date: "2026-12-31T00:00:00Z" }
              as: HRReviewer
              captures: { doc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${doc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
            - call: "POST /onboardings/${ob}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /onboardings/${ob}/advance-lifecycle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /onboardings/${ob}/advance-lifecycle"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "Onboarding.${ob}.status == EXPIRED_UNAUTHORIZED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: list_b_and_c_path_accepted_correctly
        claim_type: Correct Result
        grounds: [calculations.section2_document_sufficiency, entities.I9Form.fields.chosen_document_path]
        distinguishing_aspect: "Exactly one List B + one List C -> Section 2 succeeds with chosen_document_path == LIST_B_AND_C."
        test_recipe:
          setup: ["Onboarding past Section 1 with one List B and one List C document presented."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Bc Pa", employee_email: "bc@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_B", document_title: "DRIVERS_LICENSE", document_number: "BB", expiration_date: "2029-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { db: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob}", list_category: "LIST_C", document_title: "SS_CARD", document_number: "CC" }
              as: HRReviewer
              captures: { dc: $.data.id }
            - call: "POST /onboardings/${ob}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob}/section2-complete"
              payload: { document_ids: ["${db}", "${dc}"], expected_onboarding_version: "${v1}" }
              as: HRReviewer
              captures: { st: $.data.status }
          assert:
            - "Onboarding.${ob}.status == SECTION2_COMPLETE"
            - "I9Form for ${ob} chosen_document_path == LIST_B_AND_C"

      - name: stem_cap_gap_clamped_to_180
        claim_type: Constants Applied
        grounds: [calculations.stem_extension_window, entities.WorkAuthorization.fields.cap_gap_days]
        distinguishing_aspect: "requested_gap_days=250 clamps cap_gap_days to the CAP_GAP_CEILING_DAYS=180; effective_valid_until = base.valid_until + 180."
        test_recipe:
          setup: ["Onboarding with base F1_OPT valid_until 2026-09-30; STEM extension requesting 250 days."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Cap Ex", employee_email: "cap@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-09-30T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob}", auth_type: "F1_OPT", valid_from: "2026-04-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { base: $.data.id }
          trigger:
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob}", auth_type: "F1_STEM_OPT", valid_from: "2026-09-30T00:00:00Z", valid_until: "2028-09-30T00:00:00Z", stem_extension_applied: true, supersedes_id: "${base}", requested_gap_days: 250 }
              as: HRReviewer
              captures: { stem: $.data.id }
          assert:
            - "WorkAuthorization.${stem}.cap_gap_days == 180"
            - "WorkAuthorization.${stem}.effective_valid_until == 2027-03-29T00:00:00.000Z"

      - name: receipt_document_skips_expiry_and_gets_90day_deadline
        claim_type: Input Set Filtering
        grounds: [calculations.document_validity, entities.IdentityDocument.fields.receipt_resolution_deadline]
        distinguishing_aspect: "A receipt document (is_receipt=true) is accepted despite no/expired expiration and receives receipt_resolution_deadline = section2_completed_at + 90 days."
        test_recipe:
          setup: ["Onboarding past Section 1; clock 2026-06-02; a List A receipt presented; Section 2 completed."]
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Rc Pt", employee_email: "rc@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /identity-documents"
