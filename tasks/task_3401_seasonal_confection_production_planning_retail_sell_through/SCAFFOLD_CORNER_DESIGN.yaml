              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *c_clock_0215
            - *c_g2
            - *c_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *c_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 10, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *c_g4
            - *c_adv_inprod
            - *c_clock_0715
            - *c_g5
            - *c_adv_ship
            - *c_clock_0920
            - *c_g6
            - *c_adv_onshelf
            - *c_clock_1115
            - *c_g7
            - *c_adv_disposition
            - call: "POST /confection/disposition-orders"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", units: 5, channel: "MARKDOWN", markdown_pct: 0.30 }
              as: CategoryManager
              as_user_id: "cm-alice"
              captures: { disp_md: $.data.id }
            - call: "POST /confection/disposition-orders/${disp_md}/approve"
              payload: { decision: "APPROVE" }
