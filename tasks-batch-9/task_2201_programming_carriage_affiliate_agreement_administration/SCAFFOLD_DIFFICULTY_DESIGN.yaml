      - instance_id: NL-3
        name: agreement_lifecycle_and_renewal_dimensions_advance_independently
        grounds:
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED
          - state_machines.CarriageAgreement.NOT_DUE_to_RENEWAL_ANALYSIS
          - state_machines.CarriageAgreement.RENEWAL_ANALYSIS_to_LAPSED
          - entities.CarriageAgreement.fields.lifecycle_status
          - entities.CarriageAgreement.fields.renewal_status
        title: "SM1 x SM2 — two independent dimensions on one agreement, coupled only from lifecycle to renewal"
        state_machine: "CarriageAgreement.lifecycle_status (SM1) and CarriageAgreement.renewal_status (SM2)"
        rationale: >-
          A CarriageAgreement carries two orthogonal state fields that advance on
          different endpoints. Renewal analysis can open while the agreement is
          EXECUTED and survives a suspension untouched — proving the dimensions
          are genuinely independent — but a lifecycle TERMINATE forces the
          renewal dimension to LAPSED. The coupling is one-way: no renewal action
          ever moves lifecycle_status. A single-field implementation cannot hold
          SUSPENDED and RENEWAL_ANALYSIS at once.
        distinguishing_aspect: >-
          After SUSPEND the row reads lifecycle_status SUSPENDED with
          renewal_status still RENEWAL_ANALYSIS; after TERMINATE it reads
          lifecycle_status TERMINATED with renewal_status LAPSED. A renewal
          REOPEN_ANALYSIS attempted on the terminated row answers 409
          ERR_INVALID_RENEWAL_STATE rather than resurrecting either dimension.
        test_recipe:
          setup: >-
            The Northgate agreement (term 2024-01-01..2027-12-31) is executed and
            the logical clock is advanced to 2027-06-01T00:00:00Z, which is 213
            days before term end — inside the 270-day renewal window, and short
            of term end so the clock sweep does not expire the agreement.
            Renewal analysis is opened on the renewal dimension, then the
            lifecycle dimension is suspended for manual reasons. No invoice
            exists, so the open-receivable guard on TERMINATE is inert.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_id: "id"
                a1_renewal_initial: "renewal_status"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2027-06-01T00:00:00Z"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "POST /carriage/agreements/${a1_id}/renewal"
              payload:
                action: "START_ANALYSIS"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_renewal_open: "renewal_status"
                a1_lifecycle_open: "lifecycle_status"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUSPEND"
                suspension_reason: "MANUAL_SUSPENSION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_renewal_after_suspend: "renewal_status"
                a1_lifecycle_after_suspend: "lifecycle_status"
          trigger:
            call: "POST /carriage/agreements/${a1_id}/lifecycle"
            payload:
              action: "TERMINATE"
            as: AffiliateSalesExec
            as_user_id: "u-sales-1"
          assert:
            - "the captured a1_renewal_initial equals \"NOT_DUE\""
            - "the captured a1_renewal_open equals \"RENEWAL_ANALYSIS\" and a1_lifecycle_open equals \"EXECUTED\""
            - "the captured a1_lifecycle_after_suspend equals \"SUSPENDED\" while a1_renewal_after_suspend still equals \"RENEWAL_ANALYSIS\" — the suspension did not disturb the renewal dimension"
            - "response body lifecycle_status == \"TERMINATED\""
            - "response body renewal_status == \"LAPSED\""
            - "response body suspension_reason == \"MANUAL_SUSPENSION\""
            - "a follow-up POST /carriage/agreements/${a1_id}/renewal with action=REOPEN_ANALYSIS returns 409 with data.error_id == \"ERR_INVALID_RENEWAL_STATE\""
            - "a follow-up POST /carriage/agreements/${a1_id}/lifecycle with action=REINSTATE returns 409 with data.error_id == \"ERR_INVALID_AGREEMENT_STATE\""
            - "GET /carriage/distributors/${d1_id} returns executed_agreement_count == 0"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    rule_summary: >-
      Three cascades, each triggered from a different endpoint by a different
      role, each propagating through at least four entities where every link is
      conditional on the previous link having fired. None of the chains can be
      short-circuited by writing the final field directly, because the
      intermediate rows are themselves observable.
    instances:

      - instance_id: TC-1
        name: report_acceptance_cascades_to_suspension_window_block_and_title_coverage
        grounds:
          - calculations.agreement_penetration_compliance
          - state_machines.CarriageAgreement.EXECUTED_to_SUSPENDED
          - state_machines.RightsWindow.CLEARED_to_BLOCKED
          - entities.ContentTitle.fields.distribution_coverage_status
          - entities.CarriageAgreement.fields.penetration_breach_count
        title: "Report acceptance -> penetration breach ladder -> agreement suspension -> window blocking -> title coverage"
        cascade_depth: 5
        rationale: >-
          Accepting a single subscriber report can reach four other entities. The
          FINAL fee updates agreement revenue; the compliance calculation
          increments a breach counter; the counter crossing its threshold
          auto-suspends the agreement; the suspension blocks every cleared rights
          window on that agreement; and every window that moved forces its
          ContentTitle to re-derive its cleared-window count and coverage status.
          Link 3 fires only because link 2 reached exactly 2, link 4 only because
          link 3 changed lifecycle_status, link 5 only because link 4 moved a
          window.
        distinguishing_aspect: >-
          One POST with action=ACCEPT leaves penetration_breach_count == 2,
          lifecycle_status == SUSPENDED, suspension_reason == PENETRATION_BREACH,
          the rights window at status BLOCKED with block_reason ==
          AGREEMENT_SUSPENDED, and the content title at cleared_window_count == 0
          with distribution_coverage_status == UNDISTRIBUTED. An implementation
          that stops at the counter leaves lifecycle_status EXECUTED; one that
          suspends but does not cascade leaves the window CLEARED and the title
          at LINEAR_ONLY.
        test_recipe:
          setup: >-
            Cliffside Telco (200,000 subscribers, 50% penetration floor, flat
            40.0000 on BASIC). A content title premieres on linear 2026-08-10 and
            has an EXCLUSIVE LINEAR window on the Cliffside agreement running
            2026-08-20..2026-09-20; the window is cleared, so the title reads
            cleared_window_count 1 and distribution_coverage_status LINEAR_ONLY,
            and because window_start is still in the future at the 2026-08-01
            clock the window sits at CLEARED rather than ACTIVE. The operator has
            already had one breach period: 2026-05 reported at 90,000 (45.00%
            penetration) was accepted, taking penetration_breach_count to 1 —
            one short of the 2-breach suspension threshold. In both breach months
            the FINAL billable count is lifted to the enforceable floor
            floor(0.50 * 200,000) = 100,000, so each accepted month bills
            4,000,000 cents regardless of what was reported.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_id: "id"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_version: "version"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Autumn Classic Bowl"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-10T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                t2_id: "id"
            - call: "POST /carriage/content-titles/${t2_id}/rights-status"
              payload:
                rights_status: "OWNED_CLEARED"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${a4_id}"
                content_title_id: "${t2_id}"
                platform: "LINEAR"
                territory_code: "US"
                window_start: "2026-08-20T00:00:00Z"
                window_end: "2026-09-20T00:00:00Z"
                exclusivity: "EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                w_lin_id: "id"
            - call: "POST /carriage/rights-windows/${w_lin_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                w_lin_status_before: "status"
                w_lin_holdback: "windowing_holdback_days"
            - call: "GET /carriage/content-titles/${t2_id}"
              payload: {}
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                t2_count_before: "cleared_window_count"
                t2_coverage_before: "distribution_coverage_status"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a4_id}"
                period_month: "2026-05"
                reported_subscribers: 90000
                reported_tier: "BASIC"
                expected_agreement_version: "${a4_version}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep_may_id: "id"
            - call: "POST /carriage/subscriber-reports/${rep_may_id}/review"
              payload:
                action: "ACCEPT"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "GET /carriage/agreements/${a4_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                a4_version_2: "version"
                a4_breach_before: "penetration_breach_count"
                a4_lifecycle_before: "lifecycle_status"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${a4_id}"
                period_month: "2026-06"
                reported_subscribers: 92000
                reported_tier: "BASIC"
                expected_agreement_version: "${a4_version_2}"
              as: DistributorLiaison
              as_user_id: "${d4_id}"
              captures:
                rep_jun_id: "id"
          trigger:
            call: "POST /carriage/subscriber-reports/${rep_jun_id}/review"
            payload:
              action: "ACCEPT"
            as: RevenueAccountant
            as_user_id: "u-rev-1"
          assert:
            - "the captured w_lin_status_before equals \"CLEARED\", w_lin_holdback equals 10, t2_count_before equals 1 and t2_coverage_before equals \"LINEAR_ONLY\""
            - "the captured a4_breach_before equals 1 and a4_lifecycle_before equals \"EXECUTED\""
            - "response body status == \"ACCEPTED\""
            - "response body penetration_pct == 0.4600"
            - "response body billable_subscribers == 100000"
            - "response body license_fee_due_cents == 4000000"
            - "LINK 2 — GET /carriage/agreements/${a4_id} returns penetration_breach_count == 2, consecutive_compliant_periods == 0, penetration_compliance_status == \"BREACH\" and recognized_revenue_cents == 8000000"
            - "LINK 3 — GET /carriage/agreements/${a4_id} returns lifecycle_status == \"SUSPENDED\" and suspension_reason == \"PENETRATION_BREACH\""
            - "LINK 4 — GET /carriage/rights-windows/${w_lin_id} returns status == \"BLOCKED\" and block_reason == \"AGREEMENT_SUSPENDED\""
            - "LINK 5 — GET /carriage/content-titles/${t2_id} returns cleared_window_count == 0 and distribution_coverage_status == \"UNDISTRIBUTED\""
            - "GET /carriage/distributors/${d4_id} returns executed_agreement_count == 1 (SUSPENDED agreements still count as carried)"

      - instance_id: TC-2
        name: audit_findings_cascade_to_recovery_invoice_and_collection
        grounds:
          - state_machines.AuditEngagement.FIELDWORK_to_FINDINGS_ISSUED
          - state_machines.SubscriberReport.ACCEPTED_to_AUDIT_ADJUSTED
          - state_machines.AuditEngagement.FINDINGS_ISSUED_to_RECOVERY_INVOICED
          - state_machines.AuditEngagement.RECOVERY_INVOICED_to_COLLECTED
          - entities.Distributor.fields.audit_recovery_balance_cents
        title: "Findings issuance -> report adjustment -> recovery invoice -> operator receivable -> engagement collection"
        cascade_depth: 5
        rationale: >-
          The underreporting-recovery chain crosses five entities and two roles.
          Issuing findings prices each AuditFinding, aggregates them onto the
          AuditEngagement and flips each cited SubscriberReport to
          AUDIT_ADJUSTED. Raising the AUDIT_RECOVERY invoice moves the engagement
          again and back-links recovery_invoice_id. Issuing that invoice loads
          both the operator's general receivable and its dedicated audit-recovery
          receivable. Settling it in full walks the engagement to COLLECTED and
          unloads both balances. Each step is a separate endpoint, so nothing can
          be precomputed at the first call.
        distinguishing_aspect: >-
          One recovery amount, 2943300 cents, is visible in five places in
          sequence: AuditEngagement.recovery_amount_cents,
          Invoice.gross_license_fee_cents, Invoice.net_due_cents,
          Distributor.receivable_balance_cents and
          Distributor.audit_recovery_balance_cents — and the AUDIT_RECOVERY
          invoice still stamps coop_cap_pct == 0.05 while its coop_offset_cents
          stays 0, because co-op support offsets licence fees and never audit
          recoveries. After full payment both distributor balances return to 0
          and the engagement reads COLLECTED.
        test_recipe:
          setup: >-
            Cliffside Telco reports 130,000 subscribers for 2026-06 (65.00%
            penetration, compliant) and the month is accepted at 5,200,000 cents.
            An audit engagement over 2026-06 on the PERIOD_RATE basis reaches
            FIELDWORK and records one finding: 140,000 audited against 130,000
            reported, a 10,000-subscriber variance priced at the flat 40.0000
            rate for 400,000 cents, plus one month of 0.75% interest (3,000
            cents). Aggregate underreporting is round_half_up(10000/130000, 4) =
            0.0769, which lands in the 1.10 penalty tier and shifts the
            2,500,000-cent audit cost, giving round_half_up(403000 * 1.10, 0) +
            2500000 = 2,943,300. The operator's 100,000,000-cent credit limit is
            far above the resulting receivable, so no credit-hold cascade
            interferes.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
