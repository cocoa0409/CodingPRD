              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_CHARGEBACK_NOT_PERMITTED"
            - "err_id != ERR_INVALID_STATE — CAPTURED is a valid from-state; only the method forbids it"

      - name: err_return_not_permitted_on_card
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RETURN_NOT_PERMITTED
          - state_machines.PaymentTransaction.SETTLED_to_RETURNED
        distinguishing_aspect: "ACH returns are ECHECK-only: a SETTLED CARD transaction (valid from-state) is rejected 409 ERR_RETURN_NOT_PERMITTED."
        test_recipe:
          setup:
            - "CF agency base chain; CARD transaction captured 2026-09-10 and SETTLED via batch 2026-09-11."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_clk10
            - *c_quote100k
            - *c_txn
