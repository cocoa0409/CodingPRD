  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_close_reopen_recorrelate_cycle
        grounds:
          - state_machines.NoiseComplaint.CLOSED_UNSUBSTANTIATED_to_REOPENED
          - state_machines.NoiseComplaint.REOPENED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on NoiseComplaint: UNDER_REVIEW -> CLOSED_UNSUBSTANTIATED ->
          REOPENED -> UNDER_REVIEW -> CORRELATED -> CLOSED_SUBSTANTIATED; the loop
          compensates counters (closed_count returns to 0 mid-cycle, ends at 1).
        test_recipe:
          setup:
            - "Complainant Z1; operator; flight OPERATED 2026-07-15T12:00:00Z zone Z1; complaint occurred 12:02:00Z under review, closed UNSUBSTANTIATED"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Cyc One", email: "cyc1@x.com", address_line: "9 Loop Rd", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Four", iata_code: "A4", contact_email: "ops@airfour.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "A4100", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-07-15T11:55:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { fl_id: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${fl_id}", payload: { status: "OPERATED", actual_at: "2026-07-15T12:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst, captures: { closed_st: $.data.status } }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c_id}/reopen", payload: { reason: "new evidence" }, as: Complainant, as_user_id: "${comp_id}", captures: { re_st: $.data.status } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/resume-review", payload: {}, as: NoiseAnalyst, captures: { c_v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/correlate", payload: { flight_id: "${fl_id}", expected_complaint_version: "${c_v}" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "SUBSTANTIATED" }, as: NoiseAnalyst, captures: { fin_st: $.data.status, fin_rc: $.data.reopen_count } }
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: NoiseAnalyst, captures: { p_open: $.data.open_count, p_closed: $.data.closed_count, p_subst: $.data.substantiated_count, p_filed: $.data.filed_total } }
          assert:
            - "closed_st == CLOSED_UNSUBSTANTIATED and re_st == REOPENED"
            - "fin_st == CLOSED_SUBSTANTIATED and fin_rc == 1"
            - "p_filed == 1 and p_open == 0 and p_closed == 1 and p_subst == 1"

      - name: insulation_appeal_cycle_with_parallel_funding_dimension
        grounds:
          - state_machines.SoundInsulationApplication_Eligibility.INELIGIBLE_to_APPEALED
          - state_machines.SoundInsulationApplication_Funding.UNFUNDED_to_OFFER_ISSUED
        distinguishing_aspect: |
          Parallel dimensions on one entity: eligibility cycles
          SUBMITTED->SCREENING->INELIGIBLE->APPEALED->SCREENING->ELIGIBLE_TIER2 while
          funding stays UNFUNDED; only after eligibility lands in ELIGIBLE_TIER2 can
          funding transition UNFUNDED->OFFER_ISSUED (cross-dimension guard).
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (5,000,000, intake covers 2026-08-01); ADOPTED study with RESIDENTIAL parcel (measured 66.0, modeled 67.5 -> prelim 66.0 eligible; final 66.0 band 65)"
            - "Application est 500,000 rooms 5"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 5000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Delta", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-400", land_use: "RESIDENTIAL", dnl_db_measured: 66.0, dnl_db_modeled: 67.5, zone_code: "Z4" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 5, est_cost_cents: 500000 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "INELIGIBLE" }, as: StudyCoordinator, captures: { fs_mid: $.data.funding_status } }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/appeal", payload: { reason: "new acoustics report" }, as: CommunityLiaison, captures: { ap_st: $.data.eligibility_status, ap_fs: $.data.funding_status, ap_cnt: $.data.appeal_count } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "ELIGIBLE_TIER2" }, as: StudyCoordinator, captures: { fin_es: $.data.eligibility_status, fin_fs: $.data.funding_status, fin_cap: $.data.tier_cap_cents } }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fund_v: $.data.version } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fund_v}" }, as: NoiseOfficeAdmin, captures: { off_amt: $.data.offered_amount_cents, off_fs: $.data.funding_status, off_es: $.data.eligibility_status } }
          assert:
            - "fs_mid == UNFUNDED (funding untouched by eligibility cycle)"
            - "ap_st == APPEALED and ap_fs == UNFUNDED and ap_cnt == 1"
            - "fin_es == ELIGIBLE_TIER2 and fin_cap == 4000000"
            - "off_fs == OFFER_ISSUED and off_es == ELIGIBLE_TIER2 and off_amt == 460000 (400,000 + 40,000 + 20,000)"

      - name: report_revision_loop_then_publish
        grounds:
          - state_machines.QuarterlyReport.UNDER_REVIEW_to_DRAFT
          - state_machines.QuarterlyReport.APPROVED_to_PUBLISHED
        distinguishing_aspect: |
          Cyclic machine on QuarterlyReport: DRAFT -> UNDER_REVIEW -> DRAFT (returned,
          revision_round_count 1) -> UNDER_REVIEW -> APPROVED -> PUBLISHED; publish
          then locks the quarter. Third distinct entity with non-linear shape.
        test_recipe:
          setup:
            - "DRAFT report for 2026-Q2 (period closed before default clock 2026-08-01; zero events -> gate passes), created by X-User-ID analyst-7"
          setup_api_calls:
            - { call: "POST /noise-program/quarterly-reports", payload: { quarter_label: "2026-Q2", notes: "draft v1" }, as: NoiseAnalyst, as_user_id: "analyst-7", captures: { r_id: $.data.id, r_v: $.data.version } }
            - { call: "POST /noise-program/quarterly-reports/${r_id}/submit-for-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/quarterly-reports/${r_id}/return-for-revision", payload: { reason: "missing narrative" }, as: BoardMember, as_user_id: "board-1", captures: { rr: $.data.revision_round_count, st1: $.data.status, rvd: $.data.version } }
          trigger:
            - { call: "PATCH /noise-program/quarterly-reports/${r_id}", payload: { notes: "draft v2 complete", expected_report_version: "${rvd}" }, as: NoiseAnalyst, captures: { r_v2: $.data.version } }
            - { call: "POST /noise-program/quarterly-reports/${r_id}/submit-for-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/quarterly-reports/${r_id}/approve", payload: {}, as: BoardMember, as_user_id: "board-1" }
            - { call: "POST /noise-program/quarterly-reports/${r_id}/publish", payload: {}, as: NoiseOfficeAdmin, captures: { fin_st: $.data.status, pub_at: $.data.published_at } }
          assert:
            - "st1 == DRAFT and rr == 1 after return-for-revision (cycle)"
            - "fin_st == PUBLISHED and pub_at is not null"
            - "QuarterlyReport.${r_id}.created_by_user_id == analyst-7 and approved_by_user_id == board-1"

  - rule_id: transitive_cascade
    instances:
      - name: study_adoption_cascade_parcel_application_fund
        grounds:
          - state_machines.NoiseStudy.PUBLIC_REVIEW_to_ADOPTED
          - calculations.parcel_dnl_exposure
          - calculations.insulation_priority_score
          - entities.InsulationFund.fields.projected_pipeline_cents
        distinguishing_aspect: |
          Depth-3 cascade from adopt: study ADOPTED -> parcels recompute (variant switch
          FINAL) -> applications on flipped parcels auto-INELIGIBLE and surviving
          applications rescore -> ACTIVE fund projected_pipeline_cents recomputes.
          App1 (ELIGIBLE_TIER2, obligation 460,000) drops from pipeline; App3
          (ELIGIBLE_TIER1, 1,150,000) rescores 70 -> 90 (band 70 -> 75).
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (20,000,000, intake covers 2026-08-01); study in PUBLIC_REVIEW with parcels P-1 (measured 64.8 / modeled 67.0) and P-3 (measured 75.2 / modeled 73.4), both RESIDENTIAL"
            - "App1 on P-1 est 500,000 decided ELIGIBLE_TIER2 (preliminary band 65 -> score 50); App3 on P-3 est 1,000,000 decided ELIGIBLE_TIER1 (preliminary 71.9 -> band 70 -> score 70)"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 20000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Epsilon", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-1", land_use: "RESIDENTIAL", dnl_db_measured: 64.8, dnl_db_modeled: 67.0, zone_code: "Z1" }, as: StudyCoordinator, captures: { p1: $.data.id, p1_eff_pre: $.data.dnl_db_effective } }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-3", land_use: "RESIDENTIAL", dnl_db_measured: 75.2, dnl_db_modeled: 73.4, zone_code: "Z1" }, as: StudyCoordinator, captures: { p3: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p1}", dwelling_type: "SINGLE_FAMILY", rooms_count: 4, est_cost_cents: 500000 }, as: CommunityLiaison, captures: { a1: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${a1}/record-decision", payload: { decision: "ELIGIBLE_TIER2" }, as: StudyCoordinator, captures: { a1_score_pre: $.data.priority_score } }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p3}", dwelling_type: "SINGLE_FAMILY", rooms_count: 4, est_cost_cents: 1000000 }, as: CommunityLiaison, captures: { a3: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${a3}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${a3}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${a3}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator, captures: { a3_score_pre: $.data.priority_score } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { pipe_pre: $.data.projected_pipeline_cents } }
          trigger:
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "GET /noise-program/land-use-parcels/${p1}", payload: {}, as: StudyCoordinator, captures: { p1_eff: $.data.dnl_db_effective, p1_elig: $.data.insulation_eligible } }
            - { call: "GET /noise-program/sound-insulation-applications/${a1}", payload: {}, as: StudyCoordinator, captures: { a1_es: $.data.eligibility_status } }
            - { call: "GET /noise-program/sound-insulation-applications/${a3}", payload: {}, as: StudyCoordinator, captures: { a3_score: $.data.priority_score, a3_es: $.data.eligibility_status } }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { pipe_post: $.data.projected_pipeline_cents } }
          assert:
            - "p1_eff_pre == 65.5 and p1_eff == 64.8 and p1_elig == false (hop B: variant flip)"
            - "a1_es == INELIGIBLE (hop C1: auto-flip on newly ineligible parcel)"
            - "a3_score_pre == 70 and a3_score == 90 and a3_es == ELIGIBLE_TIER1 (hop C2: rescore band 70 -> 75)"
            - "pipe_pre == 1610000 (460,000 + 1,150,000) and pipe_post == 1150000 (hop D: fund pipeline recompute)"

      - name: event_classification_cascade_corroboration_and_auto_notification
        grounds:
          - state_machines.NoiseEvent.SCREENING_to_CLASSIFIED_AIRCRAFT
          - calculations.correlation_confidence_score
          - entities.FlightOperation.fields.linked_event_count
        distinguishing_aspect: |
          Depth >= 2 cascade from event classification (distinct trigger from study
          adoption): classify AIRCRAFT -> flight.linked_event_count increments ->
          complaints correlated to that event recompute confidence WITH the +15
          corroboration bonus (58.0 -> 73.0, flipping substantiation_eligible) ->
          when the flight's count crosses 3, an OperatorNotification DRAFT is
          auto-created for the operator.
        test_recipe:
          setup:
            - "Monitor M1; operator; flight OPERATED 2026-07-20T12:00:00Z zone Z2; complainant zone Z1 (mismatch)"
            - "Complaint occurred 12:04:00Z (dt=240) CORRELATED to flight + event E1 while E1 is CLASSIFIED_MIXED -> STRICT 100-32-10 = 58.0, not eligible"
            - "E2, E3 ingested and in SCREENING"
          setup_api_calls:
            - { call: "POST /noise-program/noise-monitors", payload: { station_code: "M1", zone_code: "Z2", latitude: 47.1, longitude: -122.3, commissioned_at: "2026-01-01T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { mon_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Five", iata_code: "A5", contact_email: "ops@airfive.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "A5100", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-07-20T11:55:00Z", zone_code: "Z2" }, as: NoiseOfficeAdmin, captures: { fl_id: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${fl_id}", payload: { status: "OPERATED", actual_at: "2026-07-20T12:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/complainants", payload: { full_name: "Ev One", email: "ev1@x.com", address_line: "5 Roar Ave", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${mon_id}/events", payload: { started_at: "2026-07-20T12:00:30Z", duration_seconds: 40, lmax_db: 72.0, sel_db: 90.0 }, as: NoiseOfficeAdmin, captures: { e1: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${mon_id}/events", payload: { started_at: "2026-07-20T12:01:00Z", duration_seconds: 35, lmax_db: 70.0, sel_db: 88.0 }, as: NoiseOfficeAdmin, captures: { e2: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${mon_id}/events", payload: { started_at: "2026-07-20T12:01:30Z", duration_seconds: 35, lmax_db: 71.0, sel_db: 89.0 }, as: NoiseOfficeAdmin, captures: { e3: $.data.id } }
            - { call: "POST /noise-program/noise-events/${e1}/begin-screening", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e2}/begin-screening", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e3}/begin-screening", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e1}/classify", payload: { classification: "MIXED", flight_id: "${fl_id}" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-20T12:04:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst, captures: { c_v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/correlate", payload: { flight_id: "${fl_id}", noise_event_id: "${e1}", expected_complaint_version: "${c_v}" }, as: NoiseAnalyst, captures: { conf_pre: $.data.correlation_confidence, elig_pre: $.data.substantiation_eligible } }
          trigger:
            - { call: "POST /noise-program/noise-events/${e1}/reclassify", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e1}/classify", payload: { classification: "AIRCRAFT", flight_id: "${fl_id}" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e2}/classify", payload: { classification: "AIRCRAFT", flight_id: "${fl_id}" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e3}/classify", payload: { classification: "AIRCRAFT", flight_id: "${fl_id}" }, as: NoiseAnalyst }
            - { call: "GET /noise-program/noise-complaints/${c_id}", payload: {}, as: NoiseAnalyst, captures: { conf_post: $.data.correlation_confidence, elig_post: $.data.substantiation_eligible } }
            - { call: "GET /noise-program/flight-operations/${fl_id}", payload: {}, as: NoiseAnalyst, captures: { fl_events: $.data.linked_event_count } }
            - { call: "GET /noise-program/operators/${op_id}/operator-notifications", payload: {}, as: NoiseAnalyst, captures: { notif0_status: $.data.0.status } }
          assert:
            - "conf_pre == 58.0 and elig_pre == false (STRICT 100-40*(240/300)-10, MIXED event gives no bonus)"
            - "conf_post == 73.0 and elig_post == true (hop 2: +15 corroboration after AIRCRAFT classification)"
            - "fl_events == 3 (hop 1: MIXED +1, reclassify -1 compensation, AIRCRAFT +1, E2 +1, E3 +1)"
            - "notif0_status == DRAFT (hop 3: auto notification when count crossed to 3)"

      - name: notification_escalation_demotes_standing_and_revokes_grace
        grounds:
          - state_machines.OperatorNotification.SENT_to_ESCALATED
          - entities.Operator.fields.curfew_grace_minutes
        distinguishing_aspect: |
          Depth-2 cascade from escalation (third distinct trigger): escalate ->
          operator.compliance_standing demoted one level (hop 1) -> on reaching
          PROBATION the operator's curfew_grace_minutes is revoked to 0 (hop 2),
          changing future violation weighting (x1.25).
        test_recipe:
          setup:
            - "Operator GOOD (grace 15); complainant with two complaints; two SENT notifications N1, N2 to the operator"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Esc One", email: "esc1@x.com", address_line: "7 Roar Ave", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Six", iata_code: "A6", contact_email: "ops@airsix.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { ca: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-16T12:02:00Z", channel: "APP", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { cb: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${ca}", severity: "FORMAL", subject: "Complaint 1", body: "Please review operation." }, as: NoiseAnalyst, captures: { n1: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${cb}", severity: "FORMAL", subject: "Complaint 2", body: "Please review operation again." }, as: NoiseAnalyst, captures: { n2: $.data.id } }
            - { call: "POST /noise-program/operator-notifications/${n1}/send", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/operator-notifications/${n2}/send", payload: {}, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/operator-notifications/${n1}/escalate", payload: { escalation_reason: "no response" }, as: NoiseOfficeAdmin, captures: { n1_st: $.data.status } }
            - { call: "POST /noise-program/operator-notifications/${n2}/escalate", payload: { escalation_reason: "repeat offender" }, as: NoiseOfficeAdmin }
            - { call: "GET /noise-program/operators/${op_id}", payload: {}, as: NoiseOfficeAdmin, captures: { o_stand: $.data.compliance_standing, o_grace: $.data.curfew_grace_minutes } }
          assert:
            - "n1_st == ESCALATED (hop 0)"
            - "o_stand == PROBATION (hop 1: GOOD -> WATCH after N1, WATCH -> PROBATION after N2)"
            - "o_grace == 0 (hop 2: grace revoked only when the demotion lands on PROBATION)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_withdrawn_application_submit
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair state x business_temporal: the application is WITHDRAWN
          (state violation) AND the intake window has closed (temporal violation);
          the higher-priority state error ERR_INVALID_APPLICATION_STATE (409) must win
          over ERR_SUBMISSION_WINDOW_CLOSED (422).
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 intake [2026-07-01, 2026-08-15); ADOPTED study; eligible parcel; application submitted then WITHDRAWN; clock advanced to 2026-08-20 (intake closed)"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 5000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-08-15T00:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Zeta", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-500", land_use: "RESIDENTIAL", dnl_db_measured: 66.0, dnl_db_modeled: 67.5, zone_code: "Z5" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 4, est_cost_cents: 500000 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/withdraw", payload: {}, as: CommunityLiaison }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: NoiseOfficeAdmin }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_APPLICATION_STATE (state priority 8 beats business_temporal priority 10; NOT ERR_SUBMISSION_WINDOW_CLOSED)"

      - name: referential_beats_fiscal_on_issue_offer
        grounds:
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair business_referential x business_fiscal: the parcel's study
          is not ADOPTED (referential) AND the fund's available 100 cents is below 50%
          of the obligation (fiscal); ERR_STUDY_NOT_ADOPTED (409) must win over
          ERR_INSUFFICIENT_FUNDS (422).
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 with total 100 cents (intake covers 2026-08-01); study stuck in PUBLIC_REVIEW (never adopted) with preliminarily-eligible parcel (modeled 73.0 -> 71.5); application ELIGIBLE_TIER1 on est 7,777,777"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 100, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Eta", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-600", land_use: "RESIDENTIAL", dnl_db_measured: 72.0, dnl_db_modeled: 73.0, zone_code: "Z6" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 5, est_cost_cents: 7777777 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fund_v: $.data.version } }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fund_v}" }, as: NoiseOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STUDY_NOT_ADOPTED (referential priority 12 beats fiscal priority 13; NOT ERR_INSUFFICIENT_FUNDS)"

      - name: report_patch_missing_auth_beats_not_found
        grounds:
          - validations[priority=1]
          - validations[priority=6]
        distinguishing_aspect: |
          Error-category pair auth x existence: a PATCH to a nonexistent report id with
          no auth headers must return ERR_UNAUTHENTICATED (401), never ERR_NOT_FOUND —
          authentication is checked before any resource lookup.
        test_recipe:
          setup:
            - "One DRAFT report exists (its version captured to satisfy the OCC payload shape); the trigger targets a DIFFERENT, nonexistent id"
          setup_api_calls:
            - { call: "POST /noise-program/quarterly-reports", payload: { quarter_label: "2026-Q2" }, as: NoiseAnalyst, captures: { r_v: $.data.version } }
          trigger:
            - { call: "PATCH /noise-program/quarterly-reports/00000000-0000-0000-0000-000000000000", payload: { notes: "x", expected_report_version: "${r_v}" }, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED with http 401 (auth priority 1 beats existence priority 6)"

  - rule_id: boundary_precision_check
    instances:
      - name: repeat_standing_threshold_9_vs_10_complaints
        grounds:
          - calculations.complaints_90d_count
          - state_machines.Complainant.GOOD_STANDING_to_REPEAT
        distinguishing_aspect: |
          Boundary on complaints_90d via POST /noise-complaints: 9 filings leave the
          complainant GOOD_STANDING; the 10th (>= 10, inclusive) flips standing to
          REPEAT and auto-creates exactly one OPEN OutreachCase.
        test_recipe:
          setup:
            - "Complainant with 9 complaints filed (all RECEIVED) at default clock"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Rep One", email: "rep1@x.com", address_line: "3 Din Ct", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-01T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-02T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-03T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-04T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-05T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-06T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-07T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-08T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-09T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: CommunityLiaison, captures: { st9: $.data.standing, c9: $.data.complaints_90d } }
          trigger:
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-10T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: CommunityLiaison, captures: { st10: $.data.standing, c10: $.data.complaints_90d } }
            - { call: "GET /noise-program/complainants/${comp_id}/outreach-cases", payload: {}, as: CommunityLiaison, captures: { oc0_status: $.data.0.status, oc0_reason: $.data.0.trigger_reason } }
          assert:
            - "c9 == 9 and st9 == GOOD_STANDING (threshold not reached)"
            - "c10 == 10 and st10 == REPEAT (>= 10 inclusive boundary)"
            - "oc0_status == OPEN and oc0_reason == REPEAT_THRESHOLD (auto-created exactly once)"

      - name: dnl_eligibility_64_9_vs_65_0
        grounds:
          - calculations.parcel_dnl_exposure
          - errors[ERR_PARCEL_NOT_INCOMPATIBLE]
        distinguishing_aspect: |
          Boundary on dnl_db_effective via POST /sound-insulation-applications:
          measured 64.9 -> COMPATIBLE_WITH_MEASURES -> create rejected; measured 65.0
          -> INCOMPATIBLE_RESIDENTIAL (>= 65.0 inclusive) -> create succeeds.
          ADOPTED study so the FINAL variant (measured verbatim) governs.
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (intake covers 2026-08-01); ADOPTED study with parcel P-low (measured 64.9) and parcel P-exact (measured 65.0), both RESIDENTIAL, modeled values chosen so pre-adoption both read eligible"
          setup_api_calls:
