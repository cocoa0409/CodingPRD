  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: gpa_exactly_two_passes_vs_below_fails
        claim_type: boundary
        grounds: ['calculations.gpa_calculation', 'entities.Program.fields.min_gpa']
        distinguishing_aspect: "GPA threshold is inclusive: exactly 2.000 passes; 1.990 fails — verified on two students in the same evaluated term."
        test_recipe:
          setup:
            - "Program required_credits=120 (min_gpa default 2.0); T1; Students C and D, each attempted 12 earned 12"
            - "C: QP 24.0 gh 12 (gpa exactly 2.000); D: QP 23.88 gh 12 (gpa 1.990); grading closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-GP", name: "GpaBoundary", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-2001", full_name: "Gpa Pass", program_id: "${prog}" }, as: Registrar, captures: { stu_c: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-2002", full_name: "Gpa Fail", program_id: "${prog}" }, as: Registrar, captures: { stu_d: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_c}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e_c: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_c}/post", payload: { earned_credits: 12, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_d}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e_d: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_d}/post", payload: { earned_credits: 12, quality_points: 23.88, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu_c}&term_id=${t1}", as: AidOfficer, captures: { c_gpa: "$.data[0].cumulative_gpa", c_result: "$.data[0].result_standing" } }
            - { call: "GET /sap/evaluations?student_id=${stu_d}&term_id=${t1}", as: AidOfficer, captures: { d_gpa: "$.data[0].cumulative_gpa", d_result: "$.data[0].result_standing" } }
          assert:
            - "C: cumulative_gpa == 2.0 and result_standing == GOOD_STANDING (>= inclusive)"
            - "D: cumulative_gpa == 1.99 and result_standing == WARNING (1.990 < 2.000 despite pace 100.0)"

      - name: max_timeframe_floor_boundary
        claim_type: boundary
        grounds: ['calculations.max_timeframe_check']
        distinguishing_aspect: "Cap uses floor: required 121 -> cap 181 (not 181.5 or 182); attempted 181 with remaining 0 is WITHIN (strict >), attempted 182 is EXCEEDED."
        test_recipe:
          setup:
            - "Program required_credits=121 (cap floor(181.5) = 181); T1, T2; Students A and B"
            - "T1: both attempted 100 earned 100 QP 300.0 gh 100 -> GOOD"
            - "T2: A attempted 81 earned 21 QP 63.0 gh 81 (cumulative attempted 181, earned 121); B attempted 82 earned 22 QP 66.0 gh 82 (cumulative 182 / 122); grading closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-MTF", name: "MaxTfFloor", required_credits: 121 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
