  # =====================================================================================
  # RULE 7 — cross_entity_state_dependency
  # Three DIFFERENT entity pairs:
  #   (AnnexationCase <- PlanOfServices), (AnnexationCase <- FiscalImpactAnalysis),
  #   (PlanOfServices  <- ServiceCommitment).
  # Each instance also proves the positive half: flip the other entity's state, retry, succeed.
  # =====================================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: notice_publication_gated_on_plan_of_services_adoption_state
        grounds:
          - validations[priority=55]
          - state_machines.AnnexationCase.TERRITORY_CERTIFIED_to_HEARING_NOTICED
          - state_machines.PlanOfServices.DRAFT_to_ADOPTED
          - entities.PublicHearing.fields.notice_published_at
        distinguishing_aspect: |
          Entity pair AnnexationCase <- PlanOfServices: publishing a notice on the case's hearing is
          admissible only while a *different* entity, the PlanOfServices, has adoption_status ADOPTED;
          with the plan left DRAFT the identical call fails with ERR_PLAN_NOT_ADOPTED, and adopting
          the plan (no change whatsoever to the case or the hearing) makes the same call succeed.
        test_recipe:
          setup:
            - "One StatuteProfile authorizing INVOLUNTARY_ORDINANCE with required_service_types [POLICE]."
            - "One certified AnnexationCase with four parcels and a SCHEDULED hearing for 2026-09-10T18:00:00Z."
            - "One PlanOfServices for the case carrying an ACTIVE/FULFILLED POLICE commitment but still adoption_status DRAFT."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_pn: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_pn}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_pn: $.data.id }
            - call: "POST /municipalities/${muni_pn}/service-providers"
              payload: { provider_name: "Cedar Grove Police", service_types: ["POLICE"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
              captures: { prov_pn: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_pn: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_pn}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
              captures: { case_pn: $.data.id }
            - call: "POST /annexation-cases/${case_pn}/parcels"
              payload: { primary_owner_id: "${ow_pn}", parcel_apn: "PN-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
            - call: "POST /annexation-cases/${case_pn}/parcels"
              payload: { primary_owner_id: "${ow_pn}", parcel_apn: "PN-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
            - call: "POST /annexation-cases/${case_pn}/parcels"
              payload: { primary_owner_id: "${ow_pn}", parcel_apn: "PN-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
            - call: "POST /annexation-cases/${case_pn}/parcels"
              payload: { primary_owner_id: "${ow_pn}", parcel_apn: "PN-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
            - call: "POST /annexation-cases/${case_pn}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_pn}" }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
              captures: { plan_pn: $.data.id, plan_pn_v0: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_pn}", service_provider_id: "${prov_pn}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 0, expected_plan_of_services_version: "${plan_pn_v0}" }
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
              captures: { cm_pn: $.data.id }
            - call: "POST /service-commitments/${cm_pn}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_pn}"
            - call: "POST /public-hearings"
              payload: { annexation_case_id: "${case_pn}", municipality_id: "${muni_pn}", scheduled_start_at: "2026-09-10T18:00:00Z", scheduled_end_at: "2026-09-10T20:00:00Z", protest_window_days: 30 }
              as: CityClerk
              as_user_id: "${muni_pn}"
              captures: { hear_pn: $.data.id }
          trigger:
            - call: "POST /public-hearings/${hear_pn}/notice-publications"
              payload: { publication_type: "NEWSPAPER" }
              as: CityClerk
              as_user_id: "${muni_pn}"
              captures: { err_pn: $.data.error_id }
            - call: "POST /plans-of-services/${plan_pn}/adopt"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_pn}"
              captures: { plan_pn_status: $.data.adoption_status }
            - call: "POST /public-hearings/${hear_pn}/notice-publications"
              payload: { publication_type: "NEWSPAPER" }
              as: CityClerk
              as_user_id: "${muni_pn}"
              captures: { notice_pn: $.data.id }
          assert:
            - "${err_pn} == ERR_PLAN_NOT_ADOPTED"
            - "${plan_pn_status} == ADOPTED"
            - "NoticePublication.${notice_pn}.notice_status == PUBLISHED"
            - "NoticePublication.${notice_pn}.published_at == 2026-08-01T00:00:00Z"
            - "GET /public-hearings/${hear_pn}/notice-publications returns total_count == 1"
            - "PublicHearing.${hear_pn}.notice_published_at == 2026-08-01T00:00:00Z"
            - "PublicHearing.${hear_pn}.hearing_status == SCHEDULED"
            - "AnnexationCase.${case_pn}.status == HEARING_NOTICED"

