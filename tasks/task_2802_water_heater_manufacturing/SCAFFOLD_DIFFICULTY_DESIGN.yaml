            - call: "POST /mfg/warranty-claims"
              payload: { heater_unit_id: "${u1_id}", failure_mode: "TANK_LEAK", reported_water_hardness_gpg: 12.0 }
              as: WarrantyAnalyst
              captures: { wc1_id: $.data.id }
            - call: "POST /mfg/warranty-claims/${wc1_id}/validate"
              payload: {}
              as: WarrantyAnalyst
          trigger:
            - call: "GET /mfg/product-models/${m1_id}/warranty-analysis"
              payload: { production_period: "2026-08" }
              as: WarrantyAnalyst
            - call: "GET /mfg/product-models/${m1_id}/warranty-analysis"
              payload: { production_period: "2026-08", variant: "EXPOSURE_WEIGHTED" }
              as: WarrantyAnalyst
          assert:
            - "the first response returns variant == COHORT_NAIVE and failure_rate_ppm == 500000.0"
            - "the second response returns variant == EXPOSURE_WEIGHTED and failure_rate_ppm == 87719.3"
            - "both responses return shipped_unit_count == 2 and tank_leak_claim_count == 1"
            - "both responses return weighted_exposure_unit_months == 11.40"
            - "both responses return very_hard_unit_count == 1 and soft_unit_count == 1 and moderate_unit_count == 0 and hard_unit_count == 0"
            - "HeaterUnit.${u1_id}.months_in_service == 5 and HeaterUnit.${u1_id}.hardness_factor == 1.80"
            - "HeaterUnit.${u2_id}.months_in_service == 3 and HeaterUnit.${u2_id}.hardness_factor == 0.80"
      - name: recall_completion_notice_based_vs_population_based
