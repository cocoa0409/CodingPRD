            - "${c2} is created with 201 and ${c2_pin} == ${m1} at that same instant: priority 13's grace_until >= clock is inclusive, which is the mirror image of the sweep's strict test - the two rules cannot both be strict or the deadline instant would be unusable"
            - "${tg_status_consumed} == CONSUMED and ${tg_v_consumed} == 2: opening the cycle consumed the grant, which is a different terminal state from the one the sweep produces"
