              captures: { p4_total: $.data.total_risk_points, p4_open: $.data.open_risk_points, p4_accepted: $.data.accepted_risk_points, p4_closed: $.data.closed_risk_points, p4_dup: $.data.duplicate_risk_points }
            - call: "GET /pentest/assets/${asset_a_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { a4_exposure: $.data.exposure_state, a4_open: $.data.open_finding_count, a4_crit: $.data.open_critical_finding_count }
          assert:
            - "baseline: ${f1_points} == 40, ${f2_points} == 8, ${p0_total} == 48, ${p0_open} == 48, ${p0_accepted} == 0, ${p0_closed} == 0, ${p0_dup} == 0"
            - "after accepting F2: ${p1_total} == 48, ${p1_open} == 40, ${p1_accepted} == 8 — total unchanged, 8 points changed bucket"
            - "after accepting F1: ${p2_total} == 48, ${p2_open} == 0, ${p2_accepted} == 48"
            - "${a2_exposure} == CLEARED, ${a2_open} == 0, ${a2_crit} == 0, ${a2_cleared_at} == 2026-09-08T10:00:00Z — accepting the CRITICAL finding cleared the asset"
            - "after revoking F1: ${p3_total} == 48, ${p3_open} == 40, ${p3_accepted} == 8 and ${f1_status_revoked} == TRIAGED"
            - "${a3_exposure} == ELEVATED and ${a3_crit} == 1 — the asset travelled CLEARED -> ELEVATED on the compensating leg"
            - "after revoking F2: ${p4_total} == 48, ${p4_open} == 48, ${p4_accepted} == 0, ${p4_closed} == 0, ${p4_dup} == 0 — byte-identical to the baseline"
            - "${a4_exposure} == ELEVATED, ${a4_open} == 2, ${a4_crit} == 1 — identical to the pre-acceptance asset counters"
            - "at all five snapshots total_risk_points == open + closed + accepted + duplicate"

      - name: assignment_revocations_conserve_the_engagement_hour_ledger
        grounds:
          - calculations.assignment_hour_settlement
          - entities.Engagement.fields.hours_reserved
          - entities.Engagement.fields.hours_consumed
          - entities.Engagement.fields.hours_available
          - state_machines.TesterAssignment.PROVISIONED_to_REVOKED
          - state_machines.TesterAssignment.REQUESTED_to_REVOKED
        distinguishing_aspect: |
          A different conserved quantity — the Engagement HOUR ledger, where hours_allocated must always
          equal reserved + consumed + available — and a different compensating mechanism: revoking a
          PROVISIONED assignment converts part of its reservation into consumption (40 reserved becomes
          25 consumed and 15 given back), while revoking a never-provisioned assignment returns its
          whole reservation with settled_hours 0. Two different code paths, one invariant.
        test_recipe:
          setup:
            - "An AUTHORIZED engagement on Asset A with hours_allocated 80."
            - "Assignment A1 for tester t1: requested_hours 40, interval 2026-09-07T09:00:00Z..2026-09-14T09:00:00Z, PROVISIONED at 2026-09-07T08:00:00Z."
            - "Assignment A2 for the same tester: requested_hours 20, interval 2026-09-15T09:00:00Z..2026-09-20T09:00:00Z (disjoint from A1), left in REQUESTED."
            - "Opening ledger: hours_reserved 60, hours_consumed 0, hours_available 20. Logical clock then moved to 2026-09-08T10:00:00Z (25 hours after A1's interval_start)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
              payload: { decision: "APPROVE", note: "In scope for FY2026" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/test-plans/${plan_id}/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement"
              payload: { engagement_id: "${eng_id}", exclusions: [], allowed_techniques: ["SQLI"], emergency_stop_procedure: "Halt traffic and call the escalation contact", escalation_contact: "soc@example.com" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { roe_id: $.data.id }
            - call: "POST /pentest/authorized-targets"
              payload: { roe_id: "${roe_id}", asset_id: "${asset_a_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", technique_allowlist: ["SQLI"] }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tgt_a_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement/${roe_id}/sign"
              payload: { signature_note: "Authorized for FY2026 window" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /pentest/testers"
              payload: { full_name: "Tester One", certifications: ["OSCP", "GPEN"], clearance_expires_at: "2027-01-01T00:00:00Z", max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /pentest/testers/${t1_id}/background-check"
              payload: { result: "CLEARED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v_a: $.data.version }
            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${t1_id}", assignment_role: "LEAD", interval_start: "2026-09-07T09:00:00Z", interval_end: "2026-09-14T09:00:00Z", requested_hours: 40, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${eng_v_a}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg1_id: $.data.id }
            - call: "POST /pentest/tester-assignments/${asg1_id}/access"
              payload: { action: "PROVISION" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v_b: $.data.version }
            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${t1_id}", assignment_role: "MEMBER", interval_start: "2026-09-15T09:00:00Z", interval_end: "2026-09-20T09:00:00Z", requested_hours: 20, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${eng_v_b}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg2_id: $.data.id }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { l0_alloc: $.data.hours_allocated, l0_res: $.data.hours_reserved, l0_con: $.data.hours_consumed, l0_avail: $.data.hours_available }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/tester-assignments/${asg1_id}/access"
              payload: { action: "REVOKE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { a1_state: $.data.access_state, a1_settled: $.data.settled_hours }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { l1_res: $.data.hours_reserved, l1_con: $.data.hours_consumed, l1_avail: $.data.hours_available }
            - call: "POST /pentest/tester-assignments/${asg2_id}/access"
              payload: { action: "REVOKE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { a2_state: $.data.access_state, a2_settled: $.data.settled_hours, a2_prov_at: $.data.provisioned_at }
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { l2_res: $.data.hours_reserved, l2_con: $.data.hours_consumed, l2_avail: $.data.hours_available, l2_alloc: $.data.hours_allocated }
            - call: "GET /pentest/testers/${t1_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { t1_state: $.data.availability_state, t1_count: $.data.active_assignment_count }
          assert:
            - "opening ledger: ${l0_alloc} == 80, ${l0_res} == 60, ${l0_con} == 0, ${l0_avail} == 20 and 80 == 60 + 0 + 20"
            - "${a1_state} == REVOKED and ${a1_settled} == 25 — baseline 2026-09-07T09:00:00Z to 2026-09-08T10:00:00Z is 25.0 hours, under the 40 requested"
            - "after the provisioned revocation: ${l1_res} == 20, ${l1_con} == 25, ${l1_avail} == 35 and 80 == 20 + 25 + 35 — the 15 unused hours came back rather than vanishing"
            - "${a2_state} == REVOKED, ${a2_prov_at} == null and ${a2_settled} == 0 — a never-provisioned assignment consumes nothing"
            - "after the requested-only revocation: ${l2_res} == 0, ${l2_con} == 25, ${l2_avail} == 55, ${l2_alloc} == 80 and 80 == 0 + 25 + 55"
            - "${t1_count} == 0 and ${t1_state} == AVAILABLE"
            - "the invariant hours_allocated == hours_reserved + hours_consumed + hours_available holds at all three snapshots"
