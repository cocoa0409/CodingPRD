            - call: "POST /demo-events/${event_id}/sample-reconciliation"
              payload: { units_sampled: 4, units_wasted: 0, units_returned: 0 }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { recon_id: "$.data.id" }
            - call: "GET /demo-events/${event_id}"
              payload: {}
