      - name: room_buffer_boundary_29_versus_30_minute_gap
        grounds:
          - calculations.room_overlap_predicate
          - calculations.room_booked_minutes_total
          - validations[priority=26]
          - entities.DefenseRoom.fields.turnover_buffer_minutes
        distinguishing_aspect: |
          The room predicate uses CLOSED intervals widened by turnover_buffer_minutes on both
          sides, so a 29-minute gap after a 14:00-16:00 defense conflicts while a gap of exactly 30
          minutes is legal — a buffered-interval boundary on a physical room, unlike the unbuffered
          half-open rule the faculty predicate applies.
