# =============================================================================
# SKILL §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the claim-extraction guide's nine sections. Corners that a
# §1.8 instance already exercises appear as `excluded_because:` stubs with no
# test_recipe.
#
# Reusable setup anchors (YAML anchors, so each instance stays a self-contained
# chain that begins from empty DB):
#   &c_clock    logical clock to 2026-09-01T00:00:00Z
#   &c_season   S = 2026-Q3, PLANNED, freezes 2026-12-01
#   &c_prod     DUAL_CHANNEL ATHLETIC_SOCK, ratio 1, 1150 / 1600 cents
#   &c_act      activate that product
#   &c_line     one eligible essential variant line
#   &c_partner  APPROVED-able homeless shelter partner, captures p_id / vt_id
#   &c_eval     put the open round into EVALUATING with all four flags true
#   &c_appr     approve the round
#   &c_cap      declare a 100000-unit ceiling for 2026-Q3
#   &c_claim    register a 1000-unit SEASON claim naming that partner
#   &c_order    one CREATED RETAIL_ECOM order
#   &c_oline    one 2-unit line on that order
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: giving_partner_create_returns_declared_fields_and_opens_one_round
        claim_type: Creation
        grounds:
          - entities.GivingPartner
          - entities.GivingPartnerVetting.fields.round_number
          - state_machines.GivingPartner.CANDIDATE_to_VETTING
        distinguishing_aspect: "A partner posted with only the declared profile comes back 201 in VETTING with vetting_round 1, exactly one REQUESTED vetting round, and registry_verified computed true from the registry id shape rather than supplied."
        test_recipe:
          setup:
            - "Logical clock at the 2026-09-01T00:00:00Z default; empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
          trigger:
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Tau Harbor Shelter", partner_type: "HOMELESS_SHELTER", operating_region: "NORTHEAST", operating_state_code: "ME", service_radius_miles: 40, registry_id: "ME-CHR-190019", ein: "200300400", founded_year: 1968, unduplicated_recipients_per_facility: 4500, need_tier: "HOMELESS_SHELTER" }
              as: GivingPartnerCoordinator
              captures: { p_id: $.data.id, vt_id: $.data.latest_vetting_round_id }
          assert:
            - "the response status is 201 and response_type is object"
            - "GivingPartner.${p_id}.status == VETTING and vetting_round == 1"
            - "GivingPartner.${p_id}.version == 1 and registry_verified == true"
            - "GivingPartner.${p_id}.need_score == 77, computed as 70 + 3 + min(20, 4500 // 1000) == 77"
            - "GET /impact-program/vetting-rounds?partner_id=${p_id} returns exactly 1 row whose round_number == 1 and outcome == REQUESTED"
            - "the response data carries non-null id, created_at, updated_at and version"

      - name: giving_partner_create_missing_operating_state_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.GivingPartner.fields.operating_state_code
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "operating_state_code is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the shape check and not the 409 the vetting machine would raise one step later."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Upsilon Harbor Shelter", partner_type: "HOMELESS_SHELTER", operating_region: "NORTHEAST", registry_id: "ME-CHR-200020", ein: "200300500", founded_year: 1971, unduplicated_recipients_per_facility: 4000, need_tier: "HOMELESS_SHELTER" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /impact-program/giving-partners returns 0 rows, so nothing was partially written"

      - name: donation_product_create_computes_design_weight_and_starts_draft
        claim_type: Computed Fields
        grounds:
          - calculations.product_attribute_weight
          - entities.DonationProduct.fields.design_weight_score
          - entities.DonationProduct.fields.status
        distinguishing_aspect: "design_weight_score is computed and never accepted from the client: a reusable donation-only undergarment reports 75 while the same body declaring design_weight_score 99 in the request still reports 75."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Weight Probe Underlayer", product_kind: "UNDERGARMENT", design_channel: "DONATION_ONLY", obligation_model: "AT_VESTING", approved_donation_ratio_units: 1, retail_price_cents: 1600, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
          assert:
            - "the response status is 201 and DonationProduct.${prod_id}.status == DRAFT"
            - "DonationProduct.${prod_id}.design_weight_score == 75, computed as 45 + 20 + 10"
            - "DonationProduct.${prod_id}.obligation_units_total == 0, because no line has accrued yet"
            - "DonationProduct.${prod_id}.active_season_code is null while every season is PLANNED or OPEN"

      - name: donation_product_create_with_unknown_design_channel_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.DonationProduct.fields.design_channel
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "design_channel is a closed enum, so a value outside DONATION_ONLY and DUAL_CHANNEL is rejected at the shape check rather than defaulting to either channel."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Bad Channel Sock", product_kind: "ATHLETIC_SOCK", design_channel: "HYBRID_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 1600, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "DonationProduct.${prod_id} does not exist, so GET /impact-program/donation-products returns 0 rows"

      - name: liability_get_with_an_unknown_id_returns_liability_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/impact-program/liabilities/{liability_id}
          - errors[ERR_LIABILITY_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unissued id on the liability path produces the entity-specific 404 ERR_LIABILITY_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /impact-program/liabilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ImpactAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_LIABILITY_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: giving_partner_get_with_an_unknown_id_returns_partner_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/impact-program/giving-partners/{partner_id}
          - errors[ERR_PARTNER_NOT_FOUND]
        distinguishing_aspect: "The partner path resolves to its own 404 code rather than the product or liability code, so per-resource not-found identity is observable."
        test_recipe:
          setup:
            - "Logical clock at the default; one existing donation product, so a wrong-resource 404 cannot be confused with an empty store."
          setup_api_calls:
            - *c_clock
            - &c_prod
              call: "POST /impact-program/donation-products"
              payload: { product_name: "Cornerstone Everyday Sock", product_kind: "ATHLETIC_SOCK", design_channel: "DUAL_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 1600, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /impact-program/giving-partners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PARTNER_NOT_FOUND"
            - "the concurrent GET /impact-program/donation-products/${prod_id} still returns 200, so the store is not empty"

      - name: allocations_list_filters_by_partner_and_kind_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/impact-program/allocations
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filtering by allocation_kind ALLOCATION returns the benefit rows only, and total_count counts the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Logical clock at the default; two approved partners; three committed allocations, two benefit and one reversal."
          setup_api_calls:
            - *c_clock
            - &c_season
              call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - &c_act
              call: "POST /impact-program/donation-products/${prod_id}/activate"
              payload: {}
              as: ProductDesigner
            - &c_partner
              call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Cornerstone Harbor Shelter", partner_type: "HOMELESS_SHELTER", operating_region: "NORTHEAST", operating_state_code: "MA", service_radius_miles: 50, registry_id: "MA-CHR-310031", ein: "400500600", founded_year: 1972, unduplicated_recipients_per_facility: 15000, need_tier: "HOMELESS_SHELTER" }
              as: GivingPartnerCoordinator
              captures: { p_id: $.data.id, vt_id: $.data.latest_vetting_round_id }
            - &c_eval
              call: "PUT /impact-program/vetting-rounds/${vt_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - &c_appr
              call: "POST /impact-program/vetting-rounds/${vt_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
            - &c_cap
              call: "POST /impact-program/giving-partners/${p_id}/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_id: $.data.id }
            - &c_claim
              call: "POST /impact-program/marketing-claims"
              payload: { donation_product_id: "${prod_id}", partner_id: "${p_id}", stated_donation_units: 1000, stated_ratio_text: "one purchased = one donated", winback_multiplier: 1, stated_reference_period: "SEASON" }
              as: MarketingManager
              captures: { claim_id: $.data.id }
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 30, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v2: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 20, priority_tier: "HIGH", liquidity_cap: 10, expected_partner_version: "${p_v2}" }
              as: AllocationPlanner
          trigger:
            - call: "GET /impact-program/allocations"
              payload: { giving_partner_id: "${p_id}", allocation_kind: "ALLOCATION" }
              as: AllocationPlanner
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows are returned, both with allocation_kind ALLOCATION"
            - "total_count == 2 and has_more == false with the default limit of 10"
            - "GET /impact-program/allocations?status=PENDING_ALLOCATION returns 2 rows and GET /impact-program/allocations?status=RECEIVED returns 0 rows"

      - name: impact_season_create_defaults_status_to_planned
        claim_type: Defaults
        grounds:
          - entities.ImpactSeason.fields.status
          - endpoints.POST_/impact-program/impact-seasons
        distinguishing_aspect: "A season posted with only its three instants comes back PLANNED with every aggregate field at zero, so no aggregate is client-supplied."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q4", starts_at: "2026-12-01T00:00:00Z", ends_at: "2027-03-31T00:00:00Z", freezes_at: "2027-02-15T00:00:00Z" }
              as: ImpactAuditor
              captures: { s2_id: $.data.id }
          assert:
            - "the response status is 201 and ImpactSeason.${s2_id}.status == PLANNED"
            - "ImpactSeason.${s2_id}.claim_frozen_units_total == 0 and total_shipped_units == 0 and total_received_units == 0"
            - "ImpactSeason.${s2_id}.liability_carry_in_units == 0 and attributed_percentage_total == 0.0"
            - "ImpactSeason.${s2_id}.version == 1"

      - name: sales_order_system_fields_are_minted_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.SalesOrder
          - entities.SalesOrder.fields.status
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted, so a request that also posts status REFUNDED still yields CREATED with version 1 and a server-stamped placed_at."
        test_recipe:
          setup:
            - "Logical clock set to 2026-09-05T12:00:00Z so placed_at is a pinned literal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: ImpactAuditor
          trigger:
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-SYS-1", channel: "RETAIL_POS", status: "REFUNDED", version: 44 }
              as: CustomerService
              captures: { ord_id: $.data.id }
          assert:
            - "the response status is 201 and SalesOrder.${ord_id}.status == CREATED"
            - "SalesOrder.${ord_id}.version == 1 and fulfillment_status == PLACED"
            - "SalesOrder.${ord_id}.placed_at == 2026-09-05T12:00:00Z"
            - "SalesOrder.${ord_id}.id is a UUID with no type prefix"

      - name: vetting_round_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.GivingPartnerVetting
        distinguishing_aspect: "GivingPartnerVetting is declared with common_fields false, so its representation carries id and created_at but no version and no updated_at, unlike every mutable entity in the store."
        test_recipe:
          setup:
            - "Logical clock at the default; one partner with one open round."
          setup_api_calls:
            - *c_clock
            - *c_partner
          trigger:
            - call: "GET /impact-program/vetting-rounds/${vt_id}"
              payload: {}
              as: GivingPartnerCoordinator
          assert:
            - "the response status is 200 and data.id == ${vt_id}"
            - "data.version is absent, so the round cannot participate in any OCC guard"
            - "data.updated_at is absent while data.created_at is present"

      - name: capacity_profile_create_requires_an_existing_partner
        claim_type: Parent Relationships
        grounds:
          - entities.PartnerCapacityProfile.fields.partner_id
          - validations[priority=3]
          - errors[ERR_PARTNER_NOT_FOUND]
        distinguishing_aspect: "The capacity profile validates its partner path id left of the body, so a valid ceiling declared against an unissued partner id is a 404 rather than a 201."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/giving-partners/00000000-0000-4000-8000-000000000002/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 100, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PARTNER_NOT_FOUND"
            - "GET /impact-program/capacity-profiles returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: product_activate_with_a_ninety_nine_weight_line_still_needs_the_gate
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DonationProduct.DRAFT_to_ACTIVE
          - calculations.product_attribute_weight
          - errors[ERR_DESIGN_WEIGHT_BELOW_MINIMUM]
        distinguishing_aspect: "The activation gate reads design_weight_score, so a dual-channel apparel top that scores 50 is refused with ERR_DESIGN_WEIGHT_BELOW_MINIMUM even though every other draft precondition holds."
        test_recipe:
          setup:
            - "Logical clock at the default; one DRAFT dual-channel apparel top."
          setup_api_calls:
            - *c_clock
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Gate Probe Tee", product_kind: "APPAREL_TOP", design_channel: "DUAL_CHANNEL", obligation_model: "AT_SALE", approved_donation_ratio_units: 1, retail_price_cents: 2100, unit_cost_cents: 1400, is_reusable: true }
              as: ProductDesigner
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /impact-program/donation-products/${prod_id}/activate"
              payload: {}
              as: ProductDesigner
              captures: { err_id: $.data.error_id }
          assert:
            - "DonationProduct.${prod_id}.design_weight_score == 50, computed as 30 + 20 + 0"
            - "the response status is 409 and error_id == ERR_DESIGN_WEIGHT_BELOW_MINIMUM"
            - "DonationProduct.${prod_id}.status is still DRAFT"

      - name: season_close_from_open_returns_invalid_state_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ImpactSeason.FROZEN_to_CLOSED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Closing a season is declared only from FROZEN, so the identical call against an OPEN season is rejected by the state precondition rather than closing it silently."
        test_recipe:
          setup:
            - "Logical clock at the default; one OPEN season with no liabilities."
          setup_api_calls:
            - *c_clock
            - *c_season
          trigger:
            - call: "POST /impact-program/impact-seasons/${s_id}/close"
              payload: {}
              as: ImpactAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "ImpactSeason.${s_id}.status is still PLANNED"

      - name: claim_revoke_from_draft_returns_invalid_state_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MarketingClaim.SUBSTANTIATED_to_REVOKED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Revocation is declared only from SUBSTANTIATED and OVERSTATED, so a DRAFT claim cannot be revoked and the state error wins over any business check."
        test_recipe:
          setup:
            - "Logical clock at the default; one DRAFT claim."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_claim
          trigger:
            - call: "POST /impact-program/marketing-claims/${claim_id}/revoke"
              payload: { reason: "Legal review requested a takedown" }
              as: MarketingManager
              captures: { err_id: $.data.error_id }
          assert:
            - "MarketingClaim.${claim_id}.status == DRAFT before the trigger"
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"

      - name: allocation_cancel_after_a_shipment_returns_invalid_state_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DonationAllocation.APPROVED_to_CANCELLED
          - errors[ERR_ALLOCATION_DISTRIBUTION_EXISTS]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Once units have shipped the allocation is SHIPPED, so a cancel is refused by the state precondition and the existence-of-distribution condition is never reached."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved allocation with a 10-unit distribution already shipped."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - &c_line
              call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000601", unit_size_label: "M", is_essential_good: true, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_id: $.data.id }
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "HIGH", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 10, shipment_reference: "TRK-SM-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "GET /impact-program/allocations/${alloc_id}"
              payload: {}
              as: AllocationPlanner
              captures: { alloc_v: $.data.version }
          trigger:
            - call: "POST /impact-program/allocations/${alloc_id}/cancel"
              payload: { expected_allocation_version: "${alloc_v}" }
              as: AllocationPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "DonationAllocation.${alloc_id}.status == SHIPPED before the trigger"
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION, not ERR_ALLOCATION_DISTRIBUTION_EXISTS"
            - "DonationDistribution.${dist_id}.status is still SHIPPED"

      - name: audit_start_from_a_finalized_audit_returns_invalid_state_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ImpactAudit.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Fieldwork can only start from SCHEDULED, so restarting a FINALIZED audit is a state error and never a silent re-scoring."
        test_recipe:
          setup:
            - "Logical clock advanced past freezes_at so the season is FROZEN; one finalized annual audit."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 100, shipment_reference: "TRK-AS-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 100, receipt_reference: "RCV-AS-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/impact-seasons/${s_id}"
              payload: {}
              as: ImpactAuditor
              captures: { s_v: $.data.version }
            - call: "POST /impact-program/impact-audits"
              payload: { impact_season_id: "${s_id}", claim_id: "${claim_id}", audit_kind: "ANNUAL_IMPACT" }
              as: ImpactAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /impact-program/impact-audits/${audit_id}/start"
              payload: {}
              as: ImpactAuditor
              captures: { audit_v: $.data.version }
            - call: "POST /impact-program/impact-audits/${audit_id}/finalize"
              payload: { transaction_test_sample_size: 20, transaction_test_exceptions: 0, claimed_donation_units: 100, expected_audit_version: "${audit_v}" }
              as: ImpactAuditor
          trigger:
            - call: "POST /impact-program/impact-audits/${audit_id}/start"
              payload: {}
              as: ImpactAuditor
              captures: { err_id: $.data.error_id }
          assert:
            - "ImpactAudit.${audit_id}.status == FINALIZED before the trigger"
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "the audit's finalized_at is unchanged"

      - name: order_created_starts_at_created_and_placed_on_the_two_dimensions
        claim_type: Initial State
        grounds:
          - state_machines.SalesOrder.CREATED_to_PAID
          - entities.SalesOrder.fields.fulfillment_status
        distinguishing_aspect: "A new order starts CREATED on the payment dimension and PLACED on the independent fulfillment dimension, so the two axes are both observable from creation."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-INIT-1", channel: "RETAIL_ECOM" }
              as: CustomerService
              captures: { ord_id: $.data.id }
          assert:
            - "SalesOrder.${ord_id}.status == CREATED and fulfillment_status == PLACED"
            - "SalesOrder.${ord_id}.ordered_units == 0 and returned_units == 0 and refunded_cents == 0"

      - name: revoked_claim_is_terminal_and_refuses_further_substantiation
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.MarketingClaim.SUBSTANTIATED_to_REVOKED
          - errors[ERR_CLAIM_ALREADY_REVOKED]
        distinguishing_aspect: "REVOKED is terminal, so neither substantiate nor derive-build can move a revoked claim and the second revocation is itself a state error."
        test_recipe:
          setup:
            - "Logical clock at the default; one SUBSTANTIATED claim naming a partner with a capacity ceiling."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "POST /impact-program/marketing-claims/${claim_id}/substantiate"
              payload: {}
              as: MarketingManager
          trigger:
            - call: "POST /impact-program/marketing-claims/${claim_id}/revoke"
              payload: { reason: "Public statement withdrawn after a partner suspension" }
              as: MarketingManager
          assert:
            - "MarketingClaim.${claim_id}.status == SUBSTANTIATED before the trigger and REVOKED after it"
            - "a second identical revoke returns 409 ERR_INVALID_STATE_TRANSITION"
            - "POST /impact-program/marketing-claims/${claim_id}/substantiate returns 409 ERR_INVALID_STATE_TRANSITION"
            - "the claim never returns to SUBSTANTIATED under any subsequent call"

      - name: distribution_complete_requires_a_full_receipt
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DonationDistribution.RECEIVED_to_COMPLETED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Completion is declared only from RECEIVED, so a distribution still PARTIALLY_RECEIVED cannot be completed and its discrepancy must be handled through the write-off route instead."
        test_recipe:
          setup:
            - "Logical clock at the default; one shipped distribution partially received."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 100, shipment_reference: "TRK-DC-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 60, receipt_reference: "RCV-DC-1" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "POST /impact-program/distributions/${dist_id}/complete"
              payload: {}
              as: FulfillmentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "DonationDistribution.${dist_id}.status == PARTIALLY_RECEIVED and received_units == 60"
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "POST /impact-program/distributions/${dist_id}/discrepancies returns 200 and moves the row to DISCREPANCY_CLAIMED"

      - name: exempted_line_locks_the_return_window_while_keeping_the_obligation
        claim_type: Valid Transition
        grounds:
          - state_machines.SalesOrderLine.OPEN_to_EXEMPTED
          - entities.SalesOrderLine.fields.obligated_units
        distinguishing_aspect: "Exempting a line closes its return window with no refund at all, yet its obligated_units and the product's liability are unchanged."
        test_recipe:
          setup:
            - "Logical clock at the default; one paid order with a 2-unit line."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - &c_order
              call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-CORNER-1", channel: "RETAIL_ECOM" }
              as: CustomerService
              captures: { ord_id: $.data.id }
            - &c_oline
              call: "POST /impact-program/sales-orders/${ord_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 2, unit_price_cents: 1600, line_discount_cents: 0 }
              as: CustomerService
              captures: { soline_id: $.data.id, soline_v: $.data.version }
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_id}/lines/${soline_id}/exempt"
              payload: { request_reason: "GOODWILL" }
              as: CustomerService
          assert:
            - "SalesOrderLine.${soline_id}.status == EXEMPTED and obligated_units == 2"
            - "SalesOrder.${ord_id}.refunded_cents == 0"
            - "the liability for 2026-Q3 still reports final_liability_units == 2"

      - name: second_line_settle_on_the_same_line_returns_invalid_state_transition
        claim_type: Idempotency
        grounds:
          - state_machines.SalesOrderLine.OPEN_to_RETURN_REQUESTED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "A settled line has left its OPEN state, so repeating the settle call is a state error rather than a second accrual — the ledger does not double count."
        test_recipe:
          setup:
            - "Logical clock at the default; one paid order with a 2-unit line already settled once."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_order
            - *c_oline
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/sales-orders/${ord_id}/lines/${soline_id}/settle"
              payload: { shipped_units: 2 }
              as: FulfillmentOperator
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_id}/lines/${soline_id}/settle"
              payload: { shipped_units: 2 }
              as: FulfillmentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the second settle returns 409 and its error_id is ERR_INVALID_STATE_TRANSITION or ERR_SALES_ORDER_ALREADY_PAID"
            - "the liability for 2026-Q3 still reports final_liability_units == 2, so no second accrual happened"
            - "ImpactSeason.${s_id}.total_shipped_units == 2"

  # ===========================================================================
  - section: calculations
    instances:

      - name: refund_uses_the_discounted_effective_unit_price_at_a_mid_cent_boundary
        claim_type: Correct Result
        grounds:
          - calculations.return_refund_amount
          - entities.ReturnRequest.fields.refund_amount_cents
        distinguishing_aspect: "The discount is spread across every unit of the line, so a 1800-cent unit in a two-unit line carrying a 500-cent discount refunds 1300 and not 1550, and the half-cent 1300.0 refuses a lower-precision reading."
        test_recipe:
          setup:
            - "Logical clock at the default; one paid order with a 2-unit line discounted by 500 cents."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_order
            - call: "POST /impact-program/sales-orders/${ord_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 2, unit_price_cents: 1800, line_discount_cents: 500 }
              as: CustomerService
              captures: { soline_id: $.data.id, soline_v: $.data.version }
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/return-requests"
              payload: { sales_order_line_id: "${soline_id}", request_reason: "SIZE", requested_units: 1, is_exchange: false, expected_line_version: "${soline_v}" }
              as: CustomerService
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /impact-program/return-requests/${ret_id}/approve"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/return-requests/${ret_id}/credit"
              payload: { replacement_product_id: "00000000-0000-4000-8000-000000000000" }
              as: CustomerService
          assert:
            - "ReturnRequest.${ret_id}.refund_amount_cents == 1300, not 1550 and not 1800"
            - "ReturnRequest.${ret_id}.status == CREDITED and terminal_outcome == REFUNDED"
            - "ReturnRequest.${ret_id}.liability_delta_units == 0"
            - "the liability for 2026-Q3 still reports final_liability_units == 2, so the credit never reversed the obligation"

      - name: need_score_access_component_clamps_at_twenty_points
        claim_type: Constants Applied
        grounds:
          - calculations.need_score
          - entities.GivingPartner.fields.need_score
        distinguishing_aspect: "The access component is min(20, recipients // 1000), so 25000 and 20000 recipients both contribute 20 points and the clamp caps the score rather than scaling with recipients."
        test_recipe:
          setup:
            - "Logical clock at the default; two disaster-relief partners in the same region, one second apart, with 25000 and 20000 recipients."
          setup_api_calls:
            - *c_clock
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Phi Relief Large", partner_type: "DISASTER_RELIEF", operating_region: "MIDWEST", operating_state_code: "OH", service_radius_miles: 100, registry_id: "OH-CHR-210021", ein: "300400500", founded_year: 1961, unduplicated_recipients_per_facility: 25000, need_tier: "DISASTER_RELIEF" }
              as: GivingPartnerCoordinator
              captures: { p_big_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Chi Relief Large", partner_type: "DISASTER_RELIEF", operating_region: "MIDWEST", operating_state_code: "OH", service_radius_miles: 100, registry_id: "OH-CHR-220022", ein: "300400600", founded_year: 1961, unduplicated_recipients_per_facility: 20000, need_tier: "DISASTER_RELIEF" }
              as: GivingPartnerCoordinator
              captures: { p_small_id: $.data.id }
          trigger:
            - call: "GET /impact-program/giving-partners/${p_big_id}"
              payload: {}
              as: GivingPartnerCoordinator
          assert:
            - "GivingPartner.${p_big_id}.need_score == 100, clamped from 95 + 6 + 20 == 121"
            - "GivingPartner.${p_small_id}.need_score == 100 as well, because the 20000-recipient access component also hits the 20-point clamp"
            - "an identical partner with 19999 recipients scores 99, one point below the clamp"

      - name: rank_score_caps_each_term_and_clamps_the_total
        claim_type: Constants Applied
        grounds:
          - calculations.partner_rank_score
          - entities.DonationAllocation.fields.rank_score
        distinguishing_aspect: "Each component is capped at its own ceiling (30, 25, 10) and the total is clamped at 100, so a fit percentage of 100 contributes 30 and not 10, while an otherwise perfect EMERGENCY partner is still pinned at 100."
        test_recipe:
          setup:
            - "Logical clock at the default; one EMERGENCY-tier commit against an approved partner with a large ceiling."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "EMERGENCY", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
          assert:
            - "DonationAllocation.${alloc_id}.rank_score == 100, clamped from 40 + 30 + 7 + 10 + 0 == 87 raised by the emergency premium to the 100 ceiling"
            - "DonationAllocation.${alloc_id}.priority_tier == EMERGENCY and status == APPROVED"
            - "the same commit with priority_tier MODERATE reports a strictly lower rank_score"

      - name: attributed_percentage_residual_is_folded_into_the_last_partner
        claim_type: Precision
        grounds:
          - calculations.weighted_allocation
          - entities.GivingPartner.fields.attributed_percentage
          - entities.ImpactSeason.fields.attributed_percentage_total
        distinguishing_aspect: "Percentages are rounded to one decimal and the residual is folded into the last partner in (units DESC, created_at ASC) order, so three equal partners report 33.3 / 33.3 / 33.4 and the season total is exactly 100.0 rather than 99.9."
        test_recipe:
          setup:
            - "Logical clock at the default; three approved partners each with a 10000-unit ceiling and one 5-unit allocation each, created one second apart."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 5, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
          trigger:
            - call: "GET /impact-program/impact-seasons/${s_id}/summary"
              payload: {}
              as: ImpactAuditor
          assert:
            - "the summary's attributed_percentage_total == 100.0 exactly"
            - "the three partners report 33.3, 33.3 and 33.4, with the 0.1 residual landing on the last partner by created_at"
            - "the summary's attributed_units_total == 15"

      - name: clearance_ratio_rounds_to_four_decimals_before_weighting
        claim_type: Precision
        grounds:
          - calculations.impact_audit_reconciliation
          - calculations.partner_performance_grade
          - entities.ImpactAudit.fields.unit_clearance_rate
        distinguishing_aspect: "The clearance ratio is rounded to four decimals before it is weighted, so 250 over 300 yields 0.8333 and a clearance term of 41.665, whereas weighting the raw repeating decimal would give 41.6666 — the difference is observable in the scorecard total."
        test_recipe:
          setup:
            - "Logical clock past freezes_at; one frozen season with a 300-unit distribution of which 250 units were received, and an IN_PROGRESS partner-performance audit."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 300, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 300, shipment_reference: "TRK-PR-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 250, receipt_reference: "RCV-PR-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/impact-seasons/${s_id}"
              payload: {}
              as: ImpactAuditor
              captures: { s_v: $.data.version }
            - call: "PUT /impact-program/impact-seasons/${s_id}/frozen-state"
              payload: { is_final: false, expected_season_version: "${s_v}" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-audits"
              payload: { impact_season_id: "${s_id}", claim_id: "${claim_id}", audit_kind: "PARTNER_PERFORMANCE" }
              as: ImpactAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /impact-program/impact-audits/${audit_id}/start"
              payload: {}
              as: ImpactAuditor
              captures: { audit_v: $.data.version }
          trigger:
            - call: "POST /impact-program/impact-audits/${audit_id}/finalize"
              payload: { transaction_test_sample_size: 20, transaction_test_exceptions: 4, claimed_donation_units: 250, expected_audit_version: "${audit_v}" }
              as: ImpactAuditor
          assert:
            - "ImpactAudit.${audit_id}.unit_clearance_rate == 0.8333"
            - "ImpactAudit.${audit_id}.shipped_units_verified == 300 and received_units_verified == 250"
            - "ImpactAudit.${audit_id}.scorecard_total == 12, from 41.665 + 0 - 40 with the cycle-time term omitted and floored"
            - "ImpactAudit.${audit_id}.partner_performance_grade == PROBATION"

      - name: weighted_allocation_reports_the_pinned_liquidity_cap_boundaries
        claim_type: Constants Applied
        grounds:
          - calculations.weighted_allocation
          - endpoints.POST_/impact-program/allocation-plans/{plan_id}/allocate
        distinguishing_aspect: "liquidity_cap is bounded at 1 and 50, so a cap of 0 is refused by the shape check while a cap of 51 is refused too — the pump capacity ceiling is a hard range rather than a clamp."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a ceiling and one claim."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/allocate"
              payload: { claim_id: "${claim_id}", donation_product_id: "${prod_id}", liquidity_cap: 51, baseline_units: 2400, demand_units: 15000, pool_units: 4000 }
              as: AllocationPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the identical call with liquidity_cap 50 returns 200 with liquidity_cap == 50 in the response"
            - "the identical call with liquidity_cap 1 returns 200 and the single winning partner receives 1 unit"

      - name: donation_unit_cost_takes_the_minimum_over_already_rounded_terms
        claim_type: Correct Result
        grounds:
          - calculations.donation_unit_cost
          - entities.DonationProductLine.fields.unit_obligation_cost_cents
        distinguishing_aspect: "The dual-channel offset is subtracted before the min is taken, and both rounding steps happen first, so 1150 over a 1600 retail price yields 725 rather than the 805 a donation-only line yields for the same costs."
        test_recipe:
          setup:
            - "Logical clock at the default; one dual-channel product at 1150 / 1600 and one donation-only product at the same costs."
          setup_api_calls:
            - *c_clock
            - *c_prod
            - *c_act
            - call: "POST /impact-program/donation-products"
              payload: { product_name: "Offset Probe Underlayer", product_kind: "ATHLETIC_SOCK", design_channel: "DONATION_ONLY", obligation_model: "AT_VESTING", approved_donation_ratio_units: 1, retail_price_cents: 1600, unit_cost_cents: 1150, is_reusable: true }
              as: ProductDesigner
              captures: { prod_don_id: $.data.id }
            - call: "POST /impact-program/donation-products/${prod_don_id}/activate"
              payload: {}
              as: ProductDesigner
            - call: "POST /impact-program/donation-products/${prod_don_id}/lines"
              payload: { gtin: "00000000000402", unit_size_label: "M", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_don_id: $.data.id }
          trigger:
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000401", unit_size_label: "M", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_dual_id: $.data.id }
          assert:
            - "DonationProductLine.${pline_dual_id}.unit_obligation_cost_cents == 725, computed as min(1150, max(0, 805 - 80))"
            - "DonationProductLine.${pline_don_id}.unit_obligation_cost_cents == 805, because a donation-only line takes no retail offset"
            - "both lines report design_variant_code values that differ: retail_dual against donation_specific"

      - name: provisional_ledger_excludes_cancelled_orders_but_keeps_refunded_ones
        claim_type: Input Set Filtering
        grounds:
          - calculations.provisional_liability_accrual
          - entities.DonationLiability.fields.provisional_liability_units
        distinguishing_aspect: "The include set is an explicit status list, so a refunded order keeps its units while a cancelled order drops them, and the difference is observable as the ledger moving from 6 to 3 and back to 6."
        test_recipe:
          setup:
            - "Logical clock at the default; one product with one eligible line; a 3-unit order paid and fully refunded, and a 3-unit order still CREATED."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_order
            - call: "POST /impact-program/sales-orders/${ord_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 3, unit_price_cents: 1600, line_discount_cents: 0 }
              as: CustomerService
              captures: { soline_a_id: $.data.id, soline_a_v: $.data.version }
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/return-requests"
              payload: { sales_order_line_id: "${soline_a_id}", request_reason: "CHANGE_OF_MIND", requested_units: 3, is_exchange: false, expected_line_version: "${soline_a_v}" }
              as: CustomerService
              captures: { ret_id: $.data.id }
            - call: "POST /impact-program/return-requests/${ret_id}/approve"
              payload: {}
              as: CustomerService
            - call: "POST /impact-program/return-requests/${ret_id}/credit"
              payload: { replacement_product_id: "00000000-0000-4000-8000-000000000000" }
              as: CustomerService
            - call: "POST /impact-program/sales-orders"
              payload: { order_number: "SO-SET-2", channel: "RETAIL_POS" }
              as: CustomerService
              captures: { ord_b_id: $.data.id }
            - call: "POST /impact-program/sales-orders/${ord_b_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 3, unit_price_cents: 1600, line_discount_cents: 0 }
              as: CustomerService
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_b_id}/cancel"
              payload: { reason: "Payment not captured" }
              as: CustomerService
          assert:
            - "with both orders present provisional_liability_units == 6"
            - "the refunded order still contributes its 3 units, so its status is PARTIALLY_REFUNDED or REFUNDED and not CANCELLED"
            - "after the cancellation provisional_liability_units == 3, because CANCELLED is excluded from the include set"
            - "final_liability_units is unchanged throughout by the cancellation, since the cancelled order was never settled"

      - name: carried_in_units_enter_the_successor_season_obligation
        claim_type: Input Set Filtering
        grounds:
          - calculations.final_liability_accrual
          - entities.DonationLiability.fields.carried_in_units
        distinguishing_aspect: "carried_in_units is added to the successor season's obligation and only after that successor itself accrues, so the carried quantity is visible in the successor's frozen units and not in the current season's."
        test_recipe:
          setup:
            - "Two seasons; the earlier one closed with a 1000-unit shortfall carried out, and the successor is the running season."
          setup_api_calls:
            - *c_clock
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q2", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-08-31T00:00:00Z", freezes_at: "2026-07-15T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_prev_id: $.data.id }
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_partner
            - *c_eval
            - *c_appr
            - call: "POST /impact-program/giving-partners/${p_id}/capacity-profiles"
              payload: { season_code: "2026-Q2", max_allocatable_units: 5000, effective_from: "2026-05-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_prev_id: $.data.id }
            - call: "POST /impact-program/marketing-claims"
              payload: { donation_product_id: "${prod_id}", partner_id: "${p_id}", stated_donation_units: 2000, stated_ratio_text: "one purchased = one donated", winback_multiplier: 1, stated_reference_period: "SEASON" }
              as: MarketingManager
              captures: { claim_prev_id: $.data.id }
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_prev_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_prev_id}", donation_product_id: "${prod_id}", allocated_units: 1000, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_prev_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_prev_id}/distributions"
              payload: { shipped_units: 1000, shipment_reference: "TRK-CI-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_prev_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_prev_id}/receipts"
              payload: { received_units: 1000, receipt_reference: "RCV-CI-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: ImpactAuditor
          trigger:
            - call: "POST /impact-program/allocations/${alloc_prev_id}/reversals"
              payload: { allocated_units: 1000, claim_id: "${claim_prev_id}", priority_tier: "CRITICAL", reason: "Capacity re-declared downward for the frozen season" }
              as: AllocationPlanner
          assert:
            - "DonationAllocation.${alloc_prev_id}.status == REVERSED"
            - "a child allocation with allocation_kind REVERSAL and allocated_units == 1000 exists"
            - "PartnerCapacityProfile.${cap_prev_id}.reserved_units == 1000"
            - "the successor season 2026-Q3 DonationLiability for ${prod_id} reports carried_in_units == 1000"
            - "ImpactSeason.${s_id}.liability_carry_in_units == 1000 while the frozen season's own carry-in is unchanged"

  # ===========================================================================
  - section: validations
    instances:

      - name: stale_partner_version_returns_precondition_failed_on_commit
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - concurrency_rules[benefit-allocation-stale-partner]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The commit carries expected_partner_version, so a version one below the stored one is rejected with 412 ERR_STALE_VERSION and no capacity is debited — the OCC guard never degrades into a business error."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a ceiling and a claim."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "HIGH", liquidity_cap: 10, expected_partner_version: "${p_v} - 1" }
              as: AllocationPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "GET /impact-program/allocations returns 0 rows"
            - "the partner's committed capacity is still 0"

      - name: fresh_partner_version_commits_and_advances_the_parent_version
        claim_type: Satisfaction → Pass
        grounds:
          - concurrency_rules[benefit-allocation-stale-partner]
          - endpoints.POST_/impact-program/allocation-plans/{plan_id}/commit
        distinguishing_aspect: "The identical commit carrying the current version succeeds and bumps the partner's version, which is exactly why the stale replay of the same call is rejected."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a ceiling and a claim."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "HIGH", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
          assert:
            - "the response status is 200 and DonationAllocation.${alloc_id}.status == APPROVED"
            - "GET /impact-program/giving-partners/${p_id} reports a version strictly greater than ${p_v}"
            - "replaying the identical call with the original ${p_v} now returns 412 ERR_STALE_VERSION"

      - name: return_outside_the_window_returns_window_closed
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_RETURN_WINDOW_CLOSED]
          - entities.SalesOrderLine.fields.return_window_days
        distinguishing_aspect: "The window is paid_at plus the line's return_window_days, so a change-of-mind request 31 days after payment is a 422 and the same request 30 days after payment is accepted at the boundary."
        test_recipe:
          setup:
            - "Logical clock set to 2026-09-01T00:00:00Z; one paid order with a 2-unit line; the clock is then pushed 31 days past payment."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - *c_order
            - *c_oline
            - call: "POST /impact-program/sales-orders/${ord_id}/pay"
              payload: {}
              as: CustomerService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/sales-orders/${ord_id}/lines/${soline_id}"
              payload: {}
              as: CustomerService
              captures: { soline_v: $.data.version }
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_id}/lines/${soline_id}/return-requests"
              payload: { request_reason: "CHANGE_OF_MIND", requested_units: 1, is_exchange: false, expected_line_version: "${soline_v}" }
              as: CustomerService
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_RETURN_WINDOW_CLOSED"
            - "SalesOrderLine.${soline_id}.status is still OPEN"
            - "the same request with request_reason DEFECT returns 201, because a defect claim is exempt from the window"
            - "the same change-of-mind request issued at 2026-10-01T00:00:00Z, exactly 30 days after payment, returns 201"

      - name: capacity_utilization_exactly_at_the_ceiling_is_accepted
        claim_type: Aggregate validation
        grounds:
          - validations[priority=15]
          - entities.PartnerCapacityProfile.fields.capacity_utilization_units
        distinguishing_aspect: "The ceiling check is a strict exceedance, so a profile whose utilization lands exactly on max_allocatable_units accepts the commit while one unit more is refused — the boundary is >= on the ceiling and not >."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a 100-unit ceiling and one committed allocation of 100 units filling it exactly."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - call: "POST /impact-program/giving-partners/${p_id}/capacity-profiles"
              payload: { season_code: "2026-Q3", max_allocatable_units: 100, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-31T00:00:00Z" }
              as: GivingPartnerCoordinator
              captures: { cap_id: $.data.id }
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "GET /impact-program/capacity-profiles/${cap_id}"
              payload: {}
              as: AllocationPlanner
              captures: { cap_v: $.data.version }
          trigger:
            - call: "GET /impact-program/capacity-profiles/${cap_id}"
              payload: {}
              as: AllocationPlanner
          assert:
            - "PartnerCapacityProfile.${cap_id}.committed_units == 100 and capacity_utilization_units == 100"
            - "PartnerCapacityProfile.${cap_id}.max_allocatable_units == 100, so utilization equals the ceiling exactly"
            - "PartnerCapacityProfile.${cap_id}.status == EXHAUSTED, because the commit filled the last unit of headroom"
            - "a further 1-unit commit returns 409 ERR_CAPACITY_EXCEEDED while a 0-unit commit is refused as ERR_INVALID_REQUEST"

      - name: suspended_partner_accepts_an_emergency_allocation_and_refuses_a_normal_one
        claim_type: Conditional validation
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_PARTNER_SUSPENDED]
          - errors[ERR_PARTNER_NOT_APPROVED]
        distinguishing_aspect: "The partner-status rule is conditional on the allocation's priority_tier, so a SUSPENDED partner accepts an EMERGENCY allocation while the identical HIGH allocation is refused — the gate is on the tier rather than on the partner alone."
        test_recipe:
          setup:
            - "Logical clock at the default; one partner suspended after approval, with a ceiling and a claim."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "PUT /impact-program/giving-partners/${p_id}/status"
              payload: { status: "SUSPENDED" }
              as: ImpactAuditor
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "EMERGENCY", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
          assert:
            - "GivingPartner.${p_id}.status == SUSPENDED"
            - "the emergency commit returns 200 and DonationAllocation.${alloc_id}.status == APPROVED"
            - "GET /impact-program/giving-partners/${p_id}/capacity-profiles reports status LOCKED for the season, yet the emergency row still committed"
            - "the identical commit with priority_tier HIGH returns 409 ERR_PARTNER_SUSPENDED or ERR_PARTNER_NOT_APPROVED"

      - name: unverified_registry_check_blocks_approval_even_above_the_need_threshold
        claim_type: Cascading validation
        grounds:
          - state_machines.GivingPartner.VETTING_to_APPROVED
          - errors[ERR_REGISTRY_NOT_VERIFIED]
          - calculations.need_score
        distinguishing_aspect: "Approval requires the four verification flags and the score gate together, so a partner with a score of 88 still cannot be approved while one flag is false, and the failure names the flag rather than the score."
        test_recipe:
          setup:
            - "Logical clock at the default; one candidate partner with a high need score and three of four flags true."
          setup_api_calls:
            - *c_clock
            - *c_partner
            - call: "PUT /impact-program/vetting-rounds/${vt_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: false, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "POST /impact-program/vetting-rounds/${vt_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "GivingPartner.${p_id}.need_score == 77, well above the 40 minimum"
            - "the response status is 409 and error_id == ERR_REGISTRY_NOT_VERIFIED"
            - "GivingPartner.${p_id}.status is still VETTING"
            - "after PUT with tax_check_passed true the identical approve returns 200"

      - name: a_commit_after_the_freeze_boundary_returns_season_frozen
        claim_type: Temporal validation
        grounds:
          - validations[priority=12]
          - errors[ERR_SEASON_FROZEN]
          - entities.ImpactSeason.fields.freezes_at
        distinguishing_aspect: "The write instant is compared against freezes_at, so a commit one second after the boundary is refused while the identical commit one second before it succeeds — the comparison is inclusive on freezes_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-11-30T23:59:59Z, one second before freezes_at, with a partner, ceiling and claim ready."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T23:59:59Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 10, priority_tier: "HIGH", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "a commit issued at 2026-11-30T23:59:59Z returns 200, proving the boundary itself is inclusive"
            - "the commit issued at 2026-12-01T00:00:00Z returns 409 ERR_SEASON_FROZEN"
            - "ImpactSeason.${s_id}.status is FROZEN at the trigger instant"

      - name: gtin_mismatch_between_variant_and_capture_returns_entity_unresolved
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=18]
          - errors[ERR_ENTITY_UNRESOLVED]
          - entities.SalesOrderLine.fields.donation_product_line_id
        distinguishing_aspect: "The variant's gtin must agree with the capture on the order line, so a purchase that names a different variant's gtin is refused with ERR_ENTITY_UNRESOLVED rather than creating a liability against the wrong catalogue entry."
        test_recipe:
          setup:
            - "Logical clock at the default; one product with two eligible lines of differing gtin; one order."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_line
            - call: "POST /impact-program/donation-products/${prod_id}/lines"
              payload: { gtin: "00000000000403", unit_size_label: "L", is_essential_good: false, donation_eligible: true }
              as: ProductDesigner
              captures: { pline_other_id: $.data.id }
            - *c_order
          trigger:
            - call: "POST /impact-program/sales-orders/${ord_id}/lines"
              payload: { donation_product_line_id: "${pline_id}", quantity: 2, unit_price_cents: 1600, line_discount_cents: 0, gtin: "00000000000403" }
              as: CustomerService
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENTITY_UNRESOLVED"
            - "GET /impact-program/sales-orders/${ord_id}/lines returns 0 rows"
            - "the provisioned liability for 2026-Q3 is unchanged at 0 units"


  # ===========================================================================
  - section: endpoints
    instances:

      - name: season_summary_computed_read_reflects_the_current_receipt_position
        claim_type: Computed read
        grounds:
          - endpoints.GET_/impact-program/impact-seasons/{season_id}/summary
          - entities.ImpactSeason.fields.liability_reconciliation_delta
        distinguishing_aspect: "The season summary is derived on read from the season's claim and distribution rows, so a partial receipt moves total_received_units without moving total_shipped_units and the reconciliation delta stays pinned to the claim total."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a ceiling and a claim; a 100-unit distribution partially received at 60 units."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 100, shipment_reference: "TRK-CR-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 60, receipt_reference: "RCV-CR-1" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "GET /impact-program/impact-seasons/${s_id}/summary"
              payload: {}
              as: ImpactAuditor
          assert:
            - "the response status is 200 and response_type is object"
            - "the summary's total_shipped_units == 100 and total_received_units == 60"
            - "the summary's liability_reconciliation_delta == 100 minus the season's claim_frozen_units_total"
            - "the summary's attributed_units_total == 100 and attributed_percentage_total == 100.0, because the partner holds the only allocation in the season"

      - name: reopening_a_closed_season_returns_it_to_open_and_unfreezes_liabilities
        claim_type: Action endpoint
        grounds:
          - state_machines.ImpactSeason.CLOSED_to_OPEN
          - endpoints.POST_/impact-program/impact-seasons/{season_id}/reopen
        distinguishing_aspect: "The reopen action returns the season to OPEN and walks every one of the season's liability rows back to ACCUMULATING, so the action endpoint's side effects are observable across the liability table."
        test_recipe:
          setup:
            - "Logical clock past freezes_at; a FROZEN season with one received distribution and a carried liability; the season is then closed."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 100, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 100, shipment_reference: "TRK-RA-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
            - call: "POST /impact-program/distributions/${dist_id}/receipts"
              payload: { received_units: 100, receipt_reference: "RCV-RA-1" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "GET /impact-program/liabilities"
              payload: { donation_product_id: "${prod_id}", impact_season_id: "${s_id}" }
              as: ImpactAuditor
              captures: { liab_row_id: "$.data[0].id", liab_v: "$.data[0].version" }
            - call: "POST /impact-program/liabilities/${liab_row_id}/carry-forward"
              payload: { claim_id: "${claim_id}", expected_liability_version: "${liab_v}" }
              as: AllocationPlanner
            - call: "POST /impact-program/impact-seasons/${s_id}/close"
              payload: {}
              as: ImpactAuditor
          trigger:
            - call: "POST /impact-program/impact-seasons/${s_id}/reopen"
              payload: {}
              as: ImpactAuditor
          assert:
            - "ImpactSeason.${s_id}.status == CLOSED before the trigger and OPEN after it"
            - "every DonationLiability row for the season reports status ACCUMULATING after the trigger"
            - "the season's claim_frozen_units_total is unchanged by the reopen"
            - "the reopen returns 200 because no ImpactAudit for the season is FINALIZED"

      - name: shipping_creates_a_distribution_reachable_from_its_allocation
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/impact-program/allocations/{allocation_id}/distributions
          - endpoints.GET_/impact-program/allocations/{allocation_id}/distributions
          - entities.DonationAllocation.fields.giving_partner_id
        distinguishing_aspect: "The nested create links the distribution to its allocation, so the reverse-reachability read finds it from the allocation id and the flat list finds the same row filtered by the allocation id."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a ceiling, a claim and an approved allocation of 40 units."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 40, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /impact-program/allocations/${alloc_id}/distributions"
              payload: { shipped_units: 40, shipment_reference: "TRK-XR-1", carrier_code: "UPS" }
              as: FulfillmentOperator
              captures: { dist_id: $.data.id }
          assert:
            - "the response status is 201 and DonationDistribution.${dist_id}.allocation_id == ${alloc_id}"
            - "DonationDistribution.${dist_id}.status == SHIPPED and received_units == 0 and impact_units_confirmed == 0"
            - "GET /impact-program/allocations/${alloc_id}/distributions returns exactly 1 row whose id == ${dist_id}"
            - "GET /impact-program/distributions?allocation_id=${alloc_id} returns exactly 1 row, and filtered by giving_partner_id=${p_id} also returns exactly 1"
            - "DonationAllocation.${alloc_id}.status == SHIPPED"

      - name: partner_cannot_be_deactivated_while_an_allocation_is_live
        claim_type: Conditional action
        grounds:
          - state_machines.GivingPartner.APPROVED_to_INACTIVE
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "INACTIVE is an action conditional on every allocation of the partner being terminal, so the identical status call is refused with a live allocation and accepted once the allocation is cancelled."
        test_recipe:
          setup:
            - "Logical clock at the default; one approved partner with a ceiling, a claim and one APPROVED allocation that has not shipped."
          setup_api_calls:
            - *c_clock
            - *c_season
            - *c_prod
            - *c_act
            - *c_partner
            - *c_eval
            - *c_appr
            - *c_cap
            - *c_claim
            - call: "GET /impact-program/giving-partners/${p_id}"
              payload: {}
              as: AllocationPlanner
              captures: { p_v: $.data.version }
            - call: "POST /impact-program/allocation-plans/${s_id}/commit"
              payload: { giving_partner_id: "${p_id}", claim_id: "${claim_id}", donation_product_id: "${prod_id}", allocated_units: 40, priority_tier: "CRITICAL", liquidity_cap: 10, expected_partner_version: "${p_v}" }
              as: AllocationPlanner
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "PUT /impact-program/giving-partners/${p_id}/status"
              payload: { status: "INACTIVE" }
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
            - call: "GET /impact-program/allocations/${alloc_id}"
              payload: {}
              as: AllocationPlanner
              captures: { alloc_v: $.data.version }
            - call: "POST /impact-program/allocations/${alloc_id}/cancel"
              payload: { expected_allocation_version: "${alloc_v}" }
              as: AllocationPlanner
            - call: "PUT /impact-program/giving-partners/${p_id}/status"
              payload: { status: "INACTIVE" }
              as: GivingPartnerCoordinator
          assert:
            - "the first status call returns 409 and error_id == ERR_INVALID_STATE_TRANSITION, while GivingPartner.${p_id}.status is still APPROVED"
            - "after the cancel, DonationAllocation.${alloc_id}.status == CANCELLED"
            - "the second status call returns 200 and GivingPartner.${p_id}.status == INACTIVE"
            - "GET /impact-program/capacity-profiles?partner_id=${p_id} then reports every profile SUPERSEDED"

      - name: allocation_plan_commit_already_exercised_by_difficulty_rule_two
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/impact-program/allocation-plans/{plan_id}/allocate
          - calculations.weighted_allocation
        excluded_because:
          difficulty_instance: largest_remainder_waterfall_distributes_the_floor_shortfall
          rationale: "The multi-partner allocate action, its per-partner response rows and the largest-remainder unit split are asserted end-to-end by the named §1.8 instance."

      - name: distribution_write_off_already_exercised_by_error_section
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/impact-program/distributions/{distribution_id}/write-off
          - state_machines.DonationDistribution.DISCREPANCY_CLAIMED_to_WRITTEN_OFF
        excluded_because:
          difficulty_instance: allocation_reversal_reservations_only_overlap_rows_thirty_days_apart
          rationale: "The discrepancy and write-off path is entered by the named §1.8 instance, which reaches DISCREPANCY_CLAIMED and asserts the shipped totals exclude the written-off remainder."

