            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-18", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/joints"
              payload: { joint_number: "J18", wps_id: "${wps_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT", "UT"] }
              as: WeldLead
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/start-fabrication"
              payload: { expected_joint_version: "${j_v}" }
              as: WeldLead
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: false }
              as: Welder
              as_user_id: "${welder_id}"
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-out"
              payload: {}
              as: WeldLead
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/inspections"
              payload: { method: "VT", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T09:30:00Z", result: "PASS", result_code: "OK" }
              as: CWI
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/inspections"
              payload: { method: "UT", scheduled_start_utc: "2026-08-03T09:00:00Z", scheduled_end_utc: "2026-08-03T10:00:00Z", vendor_id: "${vendor_id}" }
              as: CWI
              captures: { ut_id: $.data.id }
            # Advance clock past scheduled_end so we can record result
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:01Z" }
              as: ShopAdmin
            - call: "POST /weld-shop/shops/${shop_id}/inspections/${ut_id}/record-result"
              payload: { result: "FAIL", result_code: "CRACK" }
              as: CWI
            # Two distortion reports — triggers FROZEN
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/distortion-reports"
              payload: { joint_id: "${j_id}", measured_deviation_mm: 5, tolerance_mm: 2 }
              as: QualityInspector
              captures: { dr1_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/distortion-reports"
