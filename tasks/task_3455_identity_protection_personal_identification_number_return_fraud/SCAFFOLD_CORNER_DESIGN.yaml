      - name: documents_after_case_deadline_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=10]", "errors[ERR_VERIFICATION_WINDOW_EXPIRED]"]
        distinguishing_aspect: "A document submitted at clock 2027-03-04 for a case created 2027-02-01 (deadline +30d = 2027-03-03T00:00:00Z) is rejected ERR_VERIFICATION_WINDOW_EXPIRED; the case itself is NOT swept by the clock and stays DOCS_REQUESTED."
        test_recipe:
          setup: ["Clock 2027-02-01; config MV-DL (w_bank_product 60, gray 25, hold 50) ACTIVE; held return; ONLINE case DOCS_REQUESTED; clock advanced past the deadline"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /identity-protection/filter-model-configs", payload: { model_version: "MV-DL", w_victim_flagged: 0, w_refund_delta: 0, w_bank_product: 60, w_preparer_flagged: 0, w_dependent_conflict: 0, interaction_bonus: 0, gray_zone_threshold: 25, hold_threshold: 50 }, as: SystemAdmin, captures: { cfg: $.data.id } }
