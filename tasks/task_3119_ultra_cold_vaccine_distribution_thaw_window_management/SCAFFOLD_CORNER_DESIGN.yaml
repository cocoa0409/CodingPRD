# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3119_ultra_cold_vaccine_distribution_thaw_window_management
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by a
# §1.8 instance appear as `excluded_because:` stubs with no test_recipe.
# Reused anchors:
#   &x_clock  logical clock at 2026-09-01T00:00:00Z
#   &x_prod   PZ-UCV-2026, MULTI_DOSE_VIAL, 6 doses per vial, 195 vials per
#             carton => 1170 doses per carton; min_order_cartons 1
#   &x_prog   MI fixed-quota program, 20 weekly cartons, reservable 0.5
#   &x_batch  12-carton batch UCV-BATCH-0001 expiring 2027-09-01
#   &x_c01    carton C-01 on that batch
#   &x_win / &x_open / &x_ent  window opened, entitlement of 10 cartons
#   &x_site / &x_verify       MI-RIV-01 with a PASSED freezer certificate
#   &x_order ... &x_deliver   accepted 2-carton order delivered ultra-cold
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: product_configuration_create_derives_doses_per_carton
        claim_type: Creation
        grounds:
          - entities.ProductConfiguration
          - endpoints.POST_/product-configurations
        distinguishing_aspect: "A product created with doses_per_vial 6 and vials_per_carton 195 comes back 201 with doses_per_carton computed to 1170, status fields absent and the pack-size defaults applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &x_clock
              call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &x_prod
              call: "POST /vaccine-distribution/product-configurations"
              payload: { product_code: "PZ-UCV-2026", presentation: "MULTI_DOSE_VIAL", doses_per_vial: 6, vials_per_carton: 195, min_order_cartons: 1 }
              as: ManufacturingQA
              captures: { prod_id: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is object"
            - "ProductConfiguration.${prod_id}.doses_per_carton == 1170"
            - "ProductConfiguration.${prod_id}.cartons_per_pallet == 12 and ship_box_cartons == 5 from the declared defaults"
            - "ProductConfiguration.${prod_id}.thaw_stability_hours == 120 and refrigerated_shelf_life_hours == 720"
            - "ProductConfiguration.${prod_id}.refreeze_prohibited == true and punctured_bud_hours == 6"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: storage_site_get_round_trips_its_configuration
        claim_type: Retrieval
        grounds:
          - entities.StorageSite
          - endpoints.GET_/storage-sites/{id}
        distinguishing_aspect: "Every declared StorageSite field round-trips through GET exactly as posted, including the zero ultra-cold capacity of a refrigerated-only site and the unpadded HH:MM:SS schedule of its program."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A fixed-quota program and one AMBIENT-capable site have been created."
          setup_api_calls:
            - *x_clock
            - &x_prog
              call: "POST /vaccine-distribution/jurisdiction-programs"
              payload: { jurisdiction_code: "MI", regulatory_body: "MI Department of Health", allocation_basis: "FIXED_QUANTITY", fixed_weekly_cartons: 20, weekly_allocation_cap_cartons: 20, min_order_cartons: 2, reservable_carton_pct: 0.5, acceptance_window_hours: 48, shipping_days: ["MONDAY", "WEDNESDAY"], shipping_cutoff_utc: "14:00:00", quarantine_on_review: true, adjudication_sla_hours: 72, segment_rule: "TIE_CONTINUE", reporting_period_days: 30 }
              as: RegulatoryAffairsOfficer
              captures: { prog_id: "$.data.id" }
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-09", site_name: "Riverbend Cold Room", jurisdiction_program_id: "${prog_id}", storage_capability: "REFRIGERATED", ultra_cold_capacity_cartons: 0, refrigerated_capacity_cartons: 12, cold_chain_equipment_type: "THERMAL_SHIPPER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 1500 }
              as: DistributionPlanner
              captures: { site9_id: "$.data.id" }
          trigger:
            - call: "GET /vaccine-distribution/storage-sites/${site9_id}"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site9_id}"
          assert:
            - "the response status is 200"
            - "StorageSite.${site9_id}.storage_capability == REFRIGERATED and ultra_cold_capacity_cartons == 0"
            - "StorageSite.${site9_id}.cold_chain_equipment_type == THERMAL_SHIPPER"
            - "StorageSite.${site9_id}.equipment_certified == false because no verification row exists"
            - "StorageSite.${site9_id}.inventory_status == OPEN and reported_entry_type == ULTRA_COLD with no cartons on site"

      - name: cartons_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/cartons
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three cartons on one batch, limit 2 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the remaining row with has_more false — total_count counts the filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One released 12-carton batch with three cartons registered."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - &x_batch
              call: "POST /vaccine-distribution/allocation-batches"
              payload: { batch_code: "UCV-BATCH-0001", product_configuration_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", released_cartons: 12, release_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z" }
              as: ManufacturingQA
              captures: { batch_id: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-02", vials_per_carton: 195 }
              as: ManufacturingQA
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-03", vials_per_carton: 195 }
              as: ManufacturingQA
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
          trigger:
            - call: "GET /vaccine-distribution/cartons"
              payload: { allocation_batch_id: "${batch_id}", limit: 2, offset: 0 }
              as: ManufacturingQA
              captures: { page_total: "$.meta.total_count", page_has_more: "$.meta.has_more" }
            - call: "GET /vaccine-distribution/cartons"
              payload: { allocation_batch_id: "${batch_id}", limit: 2, offset: 2 }
              as: ManufacturingQA
              captures: { tail_has_more: "$.meta.has_more" }
          assert:
            - "the first page returns exactly 2 rows with page_total == 3 and page_has_more == true"
            - "the second page returns exactly 1 row with tail_has_more == false"
            - "GET /vaccine-distribution/cartons?temperature_state=ULTRA_COLD returns 3 rows"
            - "GET /vaccine-distribution/cartons with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: carton_get_with_an_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/cartons/{id}
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unallocated id on the carton path returns the 404 ERR_RESOURCE_NOT_FOUND envelope rather than a 400 or a 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No carton has been registered."
          setup_api_calls:
            - *x_clock
          trigger:
            - call: "GET /vaccine-distribution/cartons/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ColdChainReviewer
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: site_order_create_missing_requested_doses_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SiteOrder.fields.requested_doses
          - validations[priority=32]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "requested_doses is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST rather than a silent 0 that would flip the order into the carton-only variant."
        test_recipe:
          setup:
            - "The anchored base fixture up to the open entitlement."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - &x_win
              call: "POST /vaccine-distribution/allocation-windows"
              payload: { allocation_batch_id: "${batch_id}", jurisdiction_program_id: "${prog_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-03T00:00:00Z" }
              as: DistributionPlanner
              captures: { win_id: "$.data.id", win_v0: "$.data.version" }
            - &x_open
              call: "POST /vaccine-distribution/allocation-windows/${win_id}/open"
              payload: { expected_allocation_window_version: "${win_v0}" }
              as: DistributionPlanner
              captures: { win_v: "$.data.version" }
            - &x_ent
              call: "GET /vaccine-distribution/allocation-windows/${win_id}/entitlements"
              payload: {}
              as: DistributionPlanner
              captures: { ent_id: "$.data[0].id" }
            - &x_site
              call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-01", site_name: "Riverbend Clinic", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 10, refrigerated_capacity_cartons: 10, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 3000 }
              as: DistributionPlanner
              captures: { site_id: "$.data.id" }
            - &x_verify
              call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0001", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
          trigger:
            - call: "POST /vaccine-distribution/site-orders"
              payload: { allocation_entitlement_id: "${ent_id}", storage_site_id: "${site_id}", requested_cartons: 2 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /vaccine-distribution/site-orders?allocation_entitlement_id=${ent_id} returns 0 rows"
            - "AllocationEntitlement.${ent_id}.held_cartons == 0"

      - name: jurisdiction_program_omitted_optional_fields_use_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.JurisdictionProgram.fields.min_order_cartons
          - entities.JurisdictionProgram.fields.reservable_carton_pct
          - endpoints.POST_/jurisdiction-programs
        distinguishing_aspect: "Omitting min_order_cartons and reservable_carton_pct stores 2 and 0.5 rather than null, so the derived entitlement comes out at 10 cartons from a 20-carton rate — a null would make the hold-back arithmetic undefined."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *x_clock
            - call: "POST /vaccine-distribution/jurisdiction-programs"
              payload: { jurisdiction_code: "NV", regulatory_body: "Nevada State Health Division", allocation_basis: "FIXED_QUANTITY", fixed_weekly_cartons: 20, weekly_allocation_cap_cartons: 30, acceptance_window_hours: 24, shipping_days: ["TUESDAY"], shipping_cutoff_utc: "11:30:00", quarantine_on_review: false, adjudication_sla_hours: 48, segment_rule: "STOP", reporting_period_days: 14 }
              as: RegulatoryAffairsOfficer
              captures: { nv_id: "$.data.id" }
          trigger:
            - call: "GET /vaccine-distribution/jurisdiction-programs/${nv_id}"
              payload: {}
              as: RegulatoryAffairsOfficer
          assert:
            - "the response status is 201"
            - "JurisdictionProgram.${nv_id}.min_order_cartons == 2 and reservable_carton_pct == 0.5 from the declared defaults"
            - "JurisdictionProgram.${nv_id}.standing_status == OPEN and released_cartons_to_date == 0 and credit_balance_cartons == 0"
            - "JurisdictionProgram.${nv_id}.lapsed_carton_count == 0"
            - "JurisdictionProgram.${nv_id}.shipping_days == [\"TUESDAY\"]"

      - name: equipment_certified_is_derived_on_read_from_the_verification_ledger
        claim_type: Computed Fields
        grounds:
          - entities.StorageSite.fields.equipment_certified
          - entities.SiteEquipmentVerification.fields.status
          - entities.StorageSite.fields.equipment_verification_id
          - endpoints.POST_/site-equipment-verifications
        distinguishing_aspect: "equipment_certified is never stored: it flips true only while a RECORDED, unexpired PASSED verification exists, and a later FAILED verification on the same equipment type invalidates the earlier one so the flag falls back to false on the next read."
        test_recipe:
          setup:
            - "The anchored base fixture up to the probed site MI-RIV-06."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-06", site_name: "Riverside Depot", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 6, refrigerated_capacity_cartons: 6, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 900 }
              as: DistributionPlanner
              captures: { site6_id: "$.data.id" }
          trigger:
            - call: "GET /vaccine-distribution/storage-sites/${site6_id}"
              payload: {}
              as: DistributionPlanner
              captures: { cert_initial: "$.data.equipment_certified" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site6_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0006A", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-01T00:00:00Z", outcome: "PASSED" }
              as: ColdChainReviewer
              captures: { first_cert_id: "$.data.id" }
            - call: "GET /vaccine-distribution/storage-sites/${site6_id}"
              payload: {}
              as: DistributionPlanner
              captures: { cert_after_pass: "$.data.equipment_certified" }
            - call: "POST /vaccine-distribution/site-equipment-verifications"
              payload: { storage_site_id: "${site6_id}", equipment_type: "ULTRA_COLD_FREEZER", certificate_number: "CERT-MI-0006B", certificate_expires_at: "2027-01-01T00:00:00Z", verified_at: "2026-09-02T00:00:00Z", outcome: "FAILED" }
              as: ColdChainReviewer
              captures: { second_cert_id: "$.data.id" }
            - call: "GET /vaccine-distribution/storage-sites/${site6_id}"
              payload: {}
              as: DistributionPlanner
              captures: { cert_after_fail: "$.data.equipment_certified" }
          assert:
            - "cert_initial is false with no verification on file"
            - "cert_after_pass is true and StorageSite.${site6_id}.equipment_verification_id == ${first_cert_id}"
            - "cert_after_fail is false because the FAILED verification superseded the PASSED one"
            - "GET /vaccine-distribution/storage-sites/${site6_id}/equipment-verifications shows SiteEquipmentVerification.${first_cert_id}.status == INVALIDATED with a non-null invalidated_at"

      - name: carton_thaw_invalid_input_extra_fields_are_ignored
        claim_type: System Fields
        grounds:
          - entities.Carton.fields.temperature_state
          - entities.Carton.fields.thawed_at
          - endpoints.POST_/cartons/{id}/thaw
        distinguishing_aspect: "temperature_state, thawed_at and version are all system fields on the carton, so extra client-supplied values for them are ignored: the carton thaws to THAWED with a server-stamped thawed_at and version 2 rather than the version 99 that was sent."
        test_recipe:
          setup:
            - "The anchored base fixture with carton C-01 back in ultra-cold at the site."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - *x_win
            - *x_open
            - *x_ent
            - *x_site
            - *x_verify
            - &x_order
              call: "POST /vaccine-distribution/site-orders"
              payload: { allocation_entitlement_id: "${ent_id}", storage_site_id: "${site_id}", requested_cartons: 2, requested_doses: 1000 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /vaccine-distribution/site-orders/${order_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
            - &x_disp
              call: "POST /vaccine-distribution/dispatches"
              payload: { site_order_id: "${order_id}", storage_site_id: "${site_id}", entry_route: "DIRECT_ULTRA_COLD" }
              as: LogisticsOperator
              captures: { disp_id: "$.data.id" }
            - call: "POST /vaccine-distribution/dispatches/${disp_id}/pack"
              payload: {}
              as: LogisticsOperator
            - &x_shipper
              call: "POST /vaccine-distribution/shippers"
              payload: { dispatch_order_id: "${disp_id}", shipper_serial: "SH-0001", dry_ice_kg: 20, packing_started_at: "2026-09-01T00:00:00Z", logger_serial: "LG-0001" }
              as: LogisticsOperator
              captures: { ship_id: "$.data.id" }
            - call: "POST /vaccine-distribution/shippers/${ship_id}/attach-carton"
              payload: { carton_id: "${c01}" }
              as: LogisticsOperator
            - call: "POST /vaccine-distribution/logger-readings"
              payload: { cold_chain_shipper_id: "${ship_id}", recorded_at: "2026-09-01T01:00:00Z", temperature_c: -75, source: "LOGGER" }
              as: LogisticsOperator
            - call: "POST /vaccine-distribution/logger-readings"
              payload: { cold_chain_shipper_id: "${ship_id}", recorded_at: "2026-09-01T06:05:00Z", temperature_c: -74, source: "LOGGER" }
              as: LogisticsOperator
            - call: "GET /vaccine-distribution/shippers/${ship_id}"
              payload: {}
              as: ColdChainReviewer
              captures: { ship_v: "$.data.version" }
            - call: "POST /vaccine-distribution/shippers/${ship_id}/seal"
              payload: { expected_shipper_version: "${ship_v}" }
              as: LogisticsOperator
            - call: "POST /vaccine-distribution/dispatches/${disp_id}/dispatch"
              payload: {}
              as: LogisticsOperator
            - &x_deliver
              call: "POST /vaccine-distribution/dispatches/${disp_id}/deliver"
              payload: { arrived_at: "2026-09-01T06:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /vaccine-distribution/cartons/${c01}/thaw"
              payload: { temperature_state: "DESTROYED", thawed_at: "2000-01-01T00:00:00Z", version: 99 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { c01_after_thaw: "$.data.temperature_state", c01_thawed_at: "$.data.thawed_at" }
          assert:
            - "the response status is 200 and c01_after_thaw == THAWED"
            - "c01_thawed_at == 2026-09-01T00:00:00Z, the logical clock, not the 2000 date that was supplied"
            - "Carton.${c01}.version == 2 rather than the supplied 99"
            - "Carton.${c01}.current_expires_at == 2026-09-06T00:00:00Z and Carton.${c01}.thaw_window_expires_at == 2026-09-06T00:00:00Z"

      - name: product_configuration_out_of_enum_presentation_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ProductConfiguration.fields.presentation
          - validations[priority=32]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "presentation is a closed enum of exactly SINGLE_DOSE_VIAL and MULTI_DOSE_VIAL, so a value such as LYOPHILIZED is refused at 400 ERR_INVALID_REQUEST rather than stored and defaulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *x_clock
          trigger:
            - call: "POST /vaccine-distribution/product-configurations"
              payload: { product_code: "PZ-BAD-1", presentation: "LYOPHILIZED", doses_per_vial: 6, vials_per_carton: 195, min_order_cartons: 1 }
              as: ManufacturingQA
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /vaccine-distribution/product-configurations returns 0 rows"
            - "no ProductConfiguration was persisted for product_code PZ-BAD-1"

      - name: reporting_period_reopen_versions_the_report
        claim_type: Retrieval
        grounds:
          - entities.ReportingPeriod.fields.report_version
          - state_machines.ReportingPeriod.transitions.SUBMITTED_to_OPEN
          - endpoints.POST_/reporting-periods/{id}/reopen
        distinguishing_aspect: "A reopened reporting period keeps report_version 1 through submission and becomes 2 only on reopen, so the version is a materialization counter rather than the row version."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One program and one empty reporting period with no activity inside it."
          setup_api_calls:
            - *x_clock
            - *x_prog
            - call: "POST /vaccine-distribution/reporting-periods"
              payload: { jurisdiction_program_id: "${prog_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z" }
              as: RegulatoryAffairsOfficer
              captures: { period_id: "$.data.id" }
          trigger:
            - call: "POST /vaccine-distribution/reporting-periods/${period_id}/submit"
              payload: {}
              as: RegulatoryAffairsOfficer
              captures: { rv_after_submit: "$.data.report_version", status_after_submit: "$.data.status" }
            - call: "POST /vaccine-distribution/reporting-periods/${period_id}/reopen"
              payload: {}
              as: RegulatoryAffairsOfficer
              captures: { rv_after_reopen: "$.data.report_version", status_after_reopen: "$.data.status" }
          assert:
            - "status_after_submit == SUBMITTED and rv_after_submit == 1"
            - "status_after_reopen == OPEN and rv_after_reopen == 2"
            - "ReportingPeriod.${period_id}.released_doses == 0 and wastage_rate_basis_points == 0 because the period is empty"
            - "ReportingPeriod.${period_id}.version is 3 after submit plus reopen while report_version is 2"

      - name: carton_family_create_links_the_two_sites_both_ways
        claim_type: Parent Relationships
        grounds:
          - entities.CartonFamily
