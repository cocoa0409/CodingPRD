scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_provisional_vs_measured_diverge_on_same_job
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.variant
          - entities.Estimate.fields.total_cents
          - state_machines.Job.DRAFT_to_MEASURED
        distinguishing_aspect: "Same Job + Product priced twice: a PROVISIONAL estimate off declared_sqft=500 yields total_cents=305000 (no waste, no tear-out labor), a MEASURED estimate off measured_sqft=520/tear_out=100/waste=10.0% yields total_cents=350920 — divergence lives on the Estimate cost-accounting domain."
        test_recipe:
          setup:
            - "Customer, SalesRep, an ACTIVE LVP Product (material 320c, labor 250c, underlayment 40c required, lead 7d, warranty 15y), clock at 2026-06-01."
            - "Job created in DRAFT with declared_sqft=500; one PROVISIONAL estimate exists; then job measured (520 sqft, 100 tear-out, 3 rooms) and a MEASURED estimate created."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Homer Owner", address: "1 Oak St", email: "homer@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Rita" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "LVP-A1", name: "Coastal LVP", category: "LVP", material_cost_per_sqft_cents: 320, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 40, lead_time_days: 7, warranty_years: 15 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 500 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "PROVISIONAL", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { prov_est_id: $.data.id, prov_total: $.data.total_cents }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 520, tear_out_sqft: 100, room_count: 3 }
              as: Estimator
              captures: { job_v_measured: $.data.version }
          trigger:
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { meas_est_id: $.data.id, meas_total: $.data.total_cents }
          assert:
            - "Estimate.${prov_est_id}.variant == PROVISIONAL"
            - "Estimate.${prov_est_id}.total_cents == 305000"
            - "Estimate.${meas_est_id}.variant == MEASURED"
            - "Estimate.${meas_est_id}.billable_sqft == 572.0"
            - "Estimate.${meas_est_id}.total_cents == 350920"
            - "Estimate.${meas_est_id}.total_cents != Estimate.${prov_est_id}.total_cents"

      - name: warranty_risk_score_on_job_domain_distinct_from_cost
        grounds:
          - calculations.warranty_risk
          - entities.Job.fields.warranty_risk_score
          - state_machines.Job.IN_INSTALL_to_COMPLETED
        distinguishing_aspect: "The second dual-variant subject is risk scoring on the Job domain (warranty_risk_score), not cost on the Estimate: a completed TILE job with 0 tear-out, 3 backorders, and a re-measure scores 65.0, whereas a CARPET job with 0 churn scores 10.0 — a different entity and a different metric than estimate_total."
        test_recipe:
          setup:
            - "Two completed jobs: TILE job that was re-measured once and whose material order backordered 3 times scores 65.0; CARPET job with no churn scores 10.0."
            - "Generic full lifecycle to COMPLETED is driven via measure->estimate->issue->accept->material receive->slot start->slot complete."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Carl Carpet", address: "2 Pine Rd", email: "carl@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Sam" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "CARP-1", name: "Plush Carpet", category: "CARPET", material_cost_per_sqft_cents: 200, labor_rate_per_sqft_cents: 150, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/install-crews"
              payload: { name: "Carpet Crew", skill_categories: ["CARPET"], daily_sqft_capacity: 2000, buffer_minutes: 0 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 300 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 300, tear_out_sqft: 0, room_count: 2 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "GET /flooring/jobs/${job_id}/material-orders"
              payload: {}
              as: Scheduler
              captures: { mo_id: "$.data[0].id" }
            - call: "POST /flooring/material-orders/${mo_id}/receive"
              payload: {}
              as: Scheduler
            - call: "POST /flooring/install-slots"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", start_at: "2026-06-02T09:00:00.000Z", end_at: "2026-06-02T15:00:00.000Z" }
              as: Scheduler
              captures: { slot_id: $.data.id }
            - call: "POST /flooring/install-slots/${slot_id}/start"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /flooring/install-slots/${slot_id}/complete"
              payload: {}
              as: Scheduler
              captures: { final_slot_status: $.data.status }
          assert:
            - "Job.${job_id}.status == COMPLETED"
            - "Job.${job_id}.warranty_risk_score == 10.0"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waste_factor_nonlinear_three_input_mode_a
        grounds:
          - calculations.waste_factor
          - entities.Job.fields.waste_factor_pct
          - state_machines.Job.DRAFT_to_MEASURED
        distinguishing_aspect: "Mode (a): waste_factor_pct combines >=3 inputs with non-linear interaction — category base, a min-capped seam term over room_count, and a conditional big-area surcharge gated on category membership AND measured_sqft>600; TILE/2 rooms/700 sqft = 12.0 + min(1,6) + 3.0 = 16.0."
        test_recipe:
          setup:
            - "ACTIVE TILE Product; Job DRAFT measured at 700 sqft, 0 tear-out, 2 rooms."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Tim Tile", address: "3 Slate Ln", email: "tim@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Tia" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "TILE-1", name: "Marble Tile", category: "TILE", material_cost_per_sqft_cents: 500, labor_rate_per_sqft_cents: 400, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 10, warranty_years: 25 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 700 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 700, tear_out_sqft: 0, room_count: 2 }
              as: Estimator
              captures: { wfp: $.data.waste_factor_pct }
          assert:
            - "Job.${job_id}.waste_factor_pct == 16.0"
            - "Job.${job_id}.status == MEASURED"

      - name: estimate_total_rounding_order_mode_b
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.total_cents
          - entities.Estimate.fields.material_cost_cents
          - entities.Estimate.fields.labor_cost_cents
        distinguishing_aspect: "Mode (b): estimate_total pins round-per-line-then-sum; with CARPET measured_sqft=110.5, waste 5.0%, billable=116.03, material_cpsf=50, labor_cpsf=51, the pinned order yields material=5802 + labor=5636 = total 11438, whereas sum-then-round would give 11437 — the cents differ, and the scaffold's pinned order is the only correct value."
        test_recipe:
          setup:
            - "ACTIVE CARPET Product (material 50c, labor 51c, no underlayment); Job measured 110.5 sqft, 0 tear-out, 1 room -> waste 5.0%, billable 116.03."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Cara Round", address: "4 Loop Ct", email: "cara@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Ron" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /flooring/products"
              payload: { sku: "CARP-R", name: "Round Carpet", category: "CARPET", material_cost_per_sqft_cents: 50, labor_rate_per_sqft_cents: 51, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 0, warranty_years: 5 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 110 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 110.5, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
          trigger:
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.billable_sqft == 116.03"
            - "Estimate.${est_id}.material_cost_cents == 5802"
            - "Estimate.${est_id}.labor_cost_cents == 5636"
            - "Estimate.${est_id}.total_cents == 11438"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: job_remeasure_cycle_measured_to_remeasure_to_measured
        grounds:
          - state_machines.Job.MEASURED_to_RE_MEASURE
          - state_machines.Job.RE_MEASURE_to_MEASURED
          - state_machines.Estimate.ISSUED_to_VOIDED
        distinguishing_aspect: "Cyclic shape on the Job entity: MEASURED -> RE_MEASURE -> MEASURED is a revision loop (not a forward-only pipeline); entering RE_MEASURE voids the latest ISSUED estimate, and a second measure re-enters MEASURED with overwritten geometry."
        test_recipe:
          setup:
            - "ACTIVE HARDWOOD Product; Job measured (500 sqft) then a MEASURED estimate issued; SalesRep requests re-measure (voids the issued estimate); Estimator re-measures with new geometry."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Hank Hard", address: "5 Elm Way", email: "hank@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Hal" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "HW-1", name: "Oak Plank", category: "HARDWOOD", material_cost_per_sqft_cents: 600, labor_rate_per_sqft_cents: 350, requires_underlayment: false, underlayment_cost_per_sqft_cents: 0, lead_time_days: 5, warranty_years: 20 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 500 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 500, tear_out_sqft: 0, room_count: 2 }
              as: Estimator
              captures: { job_v1: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v1}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/jobs/${job_id}/request-remeasure"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { rm_status: $.data.status }
          trigger:
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 640, tear_out_sqft: 50, room_count: 3 }
              as: Estimator
              captures: { wfp2: $.data.waste_factor_pct }
          assert:
            - "Job.${job_id}.status == MEASURED"
            - "Job.${job_id}.measured_sqft == 640"
            - "Job.${job_id}.waste_factor_pct == 15.0"
            - "Estimate.${est_id}.status == VOIDED"

      - name: material_order_backorder_cycle_ordered_to_backordered_to_ordered
        grounds:
          - state_machines.MaterialOrder.ORDERED_to_BACKORDERED
          - state_machines.MaterialOrder.BACKORDERED_to_ORDERED
          - entities.MaterialOrder.fields.backorder_count
        distinguishing_aspect: "Cyclic shape on a different entity (MaterialOrder): ORDERED -> BACKORDERED -> ORDERED is a special-order loop; backorder_count increments to 2 after two backorder/reorder rounds and expected_ready_date is pushed forward on each reorder."
        test_recipe:
          setup:
            - "An ACCEPTED LVP job with a spawned MaterialOrder in ORDERED; Scheduler backorders then reorders once (round 1), leaving status ORDERED, backorder_count=1."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Bo Back", address: "6 Birch Ave", email: "bo@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Bea" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "LVP-B", name: "Vendor LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 7, warranty_years: 12 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 400 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 400, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mo_id: $.data.id }
            - call: "GET /flooring/jobs/${job_id}/material-orders"
              payload: {}
              as: Scheduler
              captures: { order_id: "$.data[0].id" }
            - call: "POST /flooring/material-orders/${order_id}/backorder"
              payload: {}
              as: Scheduler
            - call: "POST /flooring/material-orders/${order_id}/reorder"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /flooring/material-orders/${order_id}/backorder"
              payload: {}
              as: Scheduler
              captures: { bo_count: $.data.backorder_count, mo_status: $.data.status }
          assert:
            - "MaterialOrder.${order_id}.status == BACKORDERED"
            - "MaterialOrder.${order_id}.backorder_count == 2"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: job_cancel_depth3_teardown_estimate_order_slot
        grounds:
          - state_machines.Job.ACCEPTED_to_CANCELLED
          - state_machines.Estimate.ISSUED_to_VOIDED
          - state_machines.MaterialOrder.ORDERED_to_CANCELLED
          - state_machines.InstallSlot.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Depth-3 cascade triggered by Job cancel: cancelling the Job voids its Estimate, cancels its MaterialOrder, and cancels its SCHEDULED InstallSlot (releasing crew capacity) — each downstream entity changes because of the Job mutation, spanning Job->Estimate, Job->MaterialOrder, Job->InstallSlot."
        test_recipe:
          setup:
            - "An ACCEPTED LVP job with: an ACCEPTED estimate (post-accept it is ACCEPTED, but a prior non-terminal exists), a spawned MaterialOrder in ORDERED, and a SCHEDULED InstallSlot consuming crew capacity."
            - "Then SalesRep cancels the job."
          setup_api_calls:
            - call: "POST /flooring/customers"
              payload: { full_name: "Cleo Cancel", address: "7 Maple Pl", email: "cleo@x.com" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /flooring/sales-reps"
              payload: { name: "Rep Cam" }
              as: Anonymous
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: Admin
            - call: "POST /flooring/products"
              payload: { sku: "LVP-C", name: "Cancel LVP", category: "LVP", material_cost_per_sqft_cents: 300, labor_rate_per_sqft_cents: 250, requires_underlayment: true, underlayment_cost_per_sqft_cents: 30, lead_time_days: 0, warranty_years: 10 }
              as: Admin
              captures: { prod_id: $.data.id }
            - call: "POST /flooring/install-crews"
              payload: { name: "LVP Crew", skill_categories: ["LVP"], daily_sqft_capacity: 1000, buffer_minutes: 0 }
              as: Scheduler
              captures: { crew_id: $.data.id }
            - call: "POST /flooring/jobs"
              payload: { customer_id: "${cust_id}", sales_rep_id: "${rep_id}", product_id: "${prod_id}", declared_sqft: 400 }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_id: $.data.id }
            - call: "POST /flooring/jobs/${job_id}/measure"
              payload: { measured_sqft: 400, tear_out_sqft: 0, room_count: 1 }
              as: Estimator
              captures: { job_v: $.data.version }
            - call: "POST /flooring/estimates"
              payload: { job_id: "${job_id}", variant: "MEASURED", valid_until: "2026-07-01T00:00:00.000Z" }
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { est_id: $.data.id }
            - call: "POST /flooring/estimates/${est_id}/issue"
              payload: { expected_job_version: "${job_v}" }
              as: SalesRep
              as_user_id: "${rep_id}"
            - call: "POST /flooring/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { mo_id: $.data.id }
            - call: "GET /flooring/jobs/${job_id}/material-orders"
              payload: {}
              as: Scheduler
              captures: { order_id: "$.data[0].id" }
            - call: "POST /flooring/install-slots"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", start_at: "2026-06-05T09:00:00.000Z", end_at: "2026-06-05T15:00:00.000Z" }
              as: Scheduler
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /flooring/jobs/${job_id}/cancel"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_id}"
              captures: { job_status: $.data.status }
          assert:
            - "Job.${job_id}.status == CANCELLED"
            - "MaterialOrder.${order_id}.status == CANCELLED"
            - "InstallSlot.${slot_id}.status == CANCELLED"

      - name: estimate_reissue_depth2_supersede_prior_and_advance_job
        grounds:
          - state_machines.Estimate.DRAFT_to_ISSUED
          - state_machines.Estimate.ISSUED_to_VOIDED
          - state_machines.Job.MEASURED_to_ESTIMATED
          - state_machines.Job.ESTIMATED_to_ESTIMATED
        distinguishing_aspect: "Depth-2 cascade from a different trigger (estimate re-issue): issuing est1 first bubbles Job MEASURED->ESTIMATED (link 1: issue causes job advance), then issuing est2 against the now-ESTIMATED job voids est1 (link 2: the second issue's job-version bump causes the prior ISSUED estimate to be VOIDED) — originates from DRAFT_to_ISSUED, distinct from the Job-cancel trigger above."
        test_recipe:
          setup:
