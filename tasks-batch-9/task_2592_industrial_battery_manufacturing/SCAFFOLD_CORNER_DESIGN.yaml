      - name: fleet_sizing_picks_the_smallest_feasible_pack_then_the_cheapest_matching_charger
        claim_type: Correct Result
        grounds:
          - calculations.motive_power_sizing
          - endpoints[POST /fleet-sizing-requests].side_effects
          - entities.FleetSizingRequest.fields.required_ah
          - entities.FleetSizingRequest.fields.fleet_capital_cents
        distinguishing_aspect: "The pinned order is design-outer / charger-inner: designs sort by nominal_capacity_ah ASC so the 465.0 Ah pack is tried before the 600.0 Ah pack, and within that pack the charger tie is broken by price_cents ASC - so the slower-but-cheaper 60 A model wins over the 50 A model even though both fit the 9.00 h window."
        test_recipe:
          setup:
            - "Two APPROVED LEAD_ACID designs at 24.0 V pack voltage: CD-LEAD-465 (465.0 Ah, 900.0 kg, 500000 cents) and CD-LEAD-600 (600.0 Ah, 950.0 kg, 700000 cents)."
