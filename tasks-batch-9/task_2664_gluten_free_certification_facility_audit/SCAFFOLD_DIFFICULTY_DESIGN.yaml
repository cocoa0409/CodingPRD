            - "One INITIAL audit closed CLOSED_PASS on 2026-08-10, so Facility.last_closed_audit_outcome is CLOSED_PASS and priority 20 is satisfied."
            - "No certificate has ever been issued for this applicant, so fee_balance_cents is 0 and current_cycle_started_on is null."
