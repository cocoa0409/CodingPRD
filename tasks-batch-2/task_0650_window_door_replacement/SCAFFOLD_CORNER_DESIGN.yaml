scaffold_corner_design:

  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_homeowner_success_returns_201_and_system_fields
        claim_type: Creation
        grounds: ["entities.Homeowner.fields.full_name", "endpoints"]
        distinguishing_aspect: "POST /homeowners with full_name/email/property_zip returns 201; id, created_at, version=1, referral_credit_cents=0 system-generated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /homeowners"
              payload: { full_name: "Ada", email: "ada@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
          assert:
            - "response status == 201"
            - "Homeowner.${ho_id}.version == 1"
            - "Homeowner.${ho_id}.referral_credit_cents == 0"

      - name: homeowner_agi_band_defaults_to_standard
        claim_type: Defaults
        grounds: ["entities.Homeowner.fields.agi_band"]
        distinguishing_aspect: "Omitting agi_band on POST /homeowners applies default STANDARD."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /homeowners"
              payload: { full_name: "Bo", email: "bo@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
          assert:
            - "Homeowner.${ho_id}.agi_band == STANDARD"

      - name: project_jurisdiction_code_computed_from_zip_west
        claim_type: Computed Fields
        grounds: ["entities.Project.fields.jurisdiction_code", "entities.Homeowner.fields.property_zip"]
        distinguishing_aspect: "A homeowner with property_zip starting in 9 produces Project.jurisdiction_code == WEST_STRICT; any client-sent jurisdiction is ignored (computed)."
        test_recipe:
          setup: ["homeowner with property_zip 94016 (first digit 9)"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "West", email: "west@x.com", property_zip: "94016" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.jurisdiction_code == WEST_STRICT"
            - "Project.${proj_id}.status == LEAD"

      - name: opening_u_factor_and_energy_qualified_computed
        claim_type: Computed Fields
        grounds: ["entities.Opening.fields.u_factor", "entities.Opening.fields.energy_qualified", "calculations.opening_unit_price"]
        distinguishing_aspect: "A STANDARD glass opening has u_factor 0.40 and energy_qualified false (0.40 > 0.30), while LOWE_DUAL has u_factor 0.27 and energy_qualified true."
        test_recipe:
          setup: ["project with a BOOKED consultation"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Eng", email: "eng@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "PICTURE", width_in: 40, height_in: 40, glass_package: "STANDARD" }
              as: SalesConsultant
              captures: { open_id: $.data.id }
          assert:
            - "Opening.${open_id}.u_factor == 0.40"
            - "Opening.${open_id}.energy_qualified == false"
            - "Opening.${open_id}.unit_price_cents == 40000"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints"]
        distinguishing_aspect: "GET /projects/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_project_missing_homeowner_id_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.Project.fields.homeowner_id"]
        distinguishing_aspect: "POST /projects without homeowner_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: {}
              as: SalesConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_opening_negative_width_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.Opening.fields.width_in"]
        distinguishing_aspect: "POST openings with width_in <= 0 returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["project with BOOKED consultation"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Neg", email: "neg@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 0, height_in: 40, glass_package: "STANDARD" }
              as: SalesConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_project_nonexistent_homeowner_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]", "entities.Project.fields.homeowner_id", "validations[priority=5]"]
        distinguishing_aspect: "POST /projects with homeowner_id that does not resolve returns ERR_REFERENCE_NOT_FOUND (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { homeowner_id: "11111111-1111-1111-1111-111111111111" }
              as: SalesConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_REFERENCE_NOT_FOUND"

      - name: list_projects_pagination_envelope_fields_present
        claim_type: Listing
        grounds: ["endpoints", "response_envelope"]
        distinguishing_aspect: "GET /projects returns response_type array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Lst", email: "lst@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
          trigger:
            - call: "GET /projects"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response status == 200"
            - "response_type == array"
            - "envelope exposes total_count >= 1 and has_more boolean"

  # ===================================================================
  # State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: cancel_consultation_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Consultation.BOOKED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a CANCELLED consultation a second time returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["consultation already CANCELLED"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Cc", email: "cc@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/cancel"
              payload: {}
              as: SalesConsultant
          trigger:
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/cancel"
              payload: {}
              as: SalesConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Consultation.${cons_id}.status == CANCELLED"

      - name: send_quote_before_measure_returns_consultation_not_measured
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Quote.DRAFT_to_SENT", "validations[priority=8]", "errors[ERR_CONSULTATION_NOT_MEASURED]"]
        distinguishing_aspect: "Sending a DRAFT quote whose consultation is still BOOKED (has an opening but never completed measure) returns ERR_CONSULTATION_NOT_MEASURED (409)."
        test_recipe:
          setup: ["DRAFT quote on a BOOKED (not MEASURED) consultation with one opening"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Sm", email: "sm@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_CONSULTATION_NOT_MEASURED"

      - name: mark_ready_before_lead_time_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ManufactureOrder.IN_BUILD_to_READY", "entities.ManufactureOrder.fields.ready_at", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Marking an IN_BUILD order READY while current_clock < ready_at returns ERR_INVALID_STATE (409); the lead-time gate is enforced."
        test_recipe:
          setup: ["IN_BUILD ManufactureOrder, clock still at default 2026-04-01 (before ready_at 2026-05-06 for a CASEMENT)"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Mr", email: "mr@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { q_ver: $.data.version }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${q_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /projects/${proj_id}/manufacture/${mo_id}/start-build"
              payload: {}
              as: OperationsCoordinator
          trigger:
            - call: "POST /projects/${proj_id}/manufacture/${mo_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "ManufactureOrder.${mo_id}.status == IN_BUILD"

      - name: newly_created_quote_initial_state_is_draft
        claim_type: Initial State
        grounds: ["state_machines.Quote.initial_state", "entities.Quote.fields.status"]
        distinguishing_aspect: "A freshly created quote starts in DRAFT with version 1."
        test_recipe:
          setup: ["MEASURED consultation with one opening"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Iq", email: "iq@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
          trigger:
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
          assert:
            - "Quote.${quote_id}.status == DRAFT"
            - "Quote.${quote_id}.version == 1"

      - name: quote_auto_expires_when_clock_passes_expires_at
        claim_type: Valid Transition
        grounds: ["state_machines.Quote.SENT_to_EXPIRED", "entities.Quote.fields.expires_at"]
        distinguishing_aspect: "Advancing the clock past a SENT quote's expires_at (SENT at default 2026-04-01 -> expires 2026-05-01) lazily transitions it to EXPIRED on read."
        test_recipe:
          setup: ["SENT quote with expires_at 2026-05-01; clock advanced to 2026-06-01"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Ex", email: "ex@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /projects/${proj_id}/quotes/${quote_id}"
              payload: {}
              as: SalesConsultant
          assert:
            - "Quote.${quote_id}.status == EXPIRED"

      - name: terminal_rejected_quote_cannot_be_sent
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Quote.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED quote (terminal) cannot be re-sent; POST send returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["REJECTED quote"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Tr", email: "tr@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/reject"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: reject_quote_cancels_submitted_financing_cross_entity
        claim_type: Cross-entity
        grounds: ["state_machines.Quote.SENT_to_REJECTED", "state_machines.FinancingApplication.SUBMITTED_to_CANCELLED", "entities.FinancingApplication.fields.status"]
        distinguishing_aspect: "Rejecting a SENT quote cascades its SUBMITTED FinancingApplication to CANCELLED."
        test_recipe:
          setup: ["SENT quote with a SUBMITTED financing application"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Rf", email: "rf@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/financing"
              payload: { quote_id: "${quote_id}", requested_amount_cents: 50000, term_months: 24 }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { fin_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/reject"
              payload: {}
              as: Homeowner
              as_user_id: "${ho_id}"
          assert:
            - "Quote.${quote_id}.status == REJECTED"
            - "FinancingApplication.${fin_id}.status == CANCELLED"

      - name: permit_reinspection_failed_to_approved_cycle
        claim_type: Valid Transition
        grounds: ["state_machines.Permit.INSPECTION_FAILED_to_APPROVED", "entities.Permit.fields.status"]
        distinguishing_aspect: "An INSPECTION_FAILED permit can be re-approved (INSPECTION_FAILED->APPROVED), resetting inspection_due_at — the failed-inspection cycle."
        test_recipe:
          setup: ["Permit at INSPECTION_FAILED on a project whose install job is COMPLETED"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pf", email: "pf@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
