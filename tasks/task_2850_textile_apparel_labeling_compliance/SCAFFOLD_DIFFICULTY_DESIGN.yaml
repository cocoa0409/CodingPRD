          The disposition payload is unchanged across two calls; what changes is the state of a different entity - the corrective label moves APPROVED -> PUBLISHED - so the first call is ERR_REFERENCE_NOT_ELIGIBLE and the second succeeds, proving the referential check tests the referenced row's state and not merely its existence or type.
