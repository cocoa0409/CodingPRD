  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: session_half_open_overlap_rejected_adjacent_allowed
        grounds:
          - calculations.session_window_overlap
          - validations[priority=12]
          - errors[ERR_SESSION_TIME_CONFLICT]
          - entities.Session.fields.scheduled_start_at
          - entities.Session.fields.scheduled_end_at
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the Session resource: a second session whose
          window [09:30,10:30) overlaps an existing non-terminal [09:00,10:00) is rejected
          ERR_SESSION_TIME_CONFLICT, but an ADJACENT window [10:00,11:00) (start == prior
          end) is accepted (half-open adjacency allowed).
        test_recipe:
          setup:
            - "ACTIVE enotary notary with one SCHEDULED session [2026-06-20T09:00,10:00)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N TO1", email: "nto1@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-20T09:00:00Z", scheduled_end_at: "2026-06-20T10:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess1: $.data.id }
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-20T10:00:00Z", scheduled_end_at: "2026-06-20T11:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess_adjacent: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-20T09:30:00Z", scheduled_end_at: "2026-06-20T10:30:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "Session.${sess_adjacent}.status == SCHEDULED"
            - "trigger response error_id == ERR_SESSION_TIME_CONFLICT"

      - name: bond_closed_interval_touching_endpoints_conflict
        grounds:
          - calculations.bond_coverage_overlap
          - validations[priority=13]
          - errors[ERR_BOND_COVERAGE_OVERLAP]
          - state_machines.Bond.PENDING_to_ACTIVE
          - entities.Bond.fields.coverage_end_at
        distinguishing_aspect: |
          CLOSED interval semantics on the Bond resource (the geometric DIFFERENCE from the
          session half-open rule): activating a second bond whose coverage [2030-06-01,
          2034-06-01] merely TOUCHES the first bond's end (2030-06-01) is rejected
          ERR_BOND_COVERAGE_OVERLAP because closed intervals conflict at shared endpoints.
        test_recipe:
          setup:
            - "Notary with first ACTIVE bond coverage [2026-06-01, 2030-06-01]; a second PENDING bond coverage [2030-06-01, 2034-06-01] (touches at 2030-06-01)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N TO2", email: "nto2@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond1: $.data.id }
            - call: "POST /bonds/${bond1}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2030-06-01T00:00:00Z", coverage_end_at: "2034-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond2: $.data.id }
          trigger:
            - call: "POST /bonds/${bond2}/activate"
              payload: {}
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_BOND_COVERAGE_OVERLAP"
            - "Bond.${bond2}.status == PENDING"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_journal_entry_conserves_lifetime_fee_ledger
        grounds:
          - calculations.lifetime_fees_collected
          - entities.Notary.fields.lifetime_fees_collected_cents
          - entities.JournalEntry.fields.fee_charged_cents
          - state_machines.JournalEntry.POSTED_to_VOID
        distinguishing_aspect: |
          Conserved quantity = the fee ledger invariant
          notary.lifetime_fees_collected_cents == SUM(fee_charged_cents of POSTED entries).
          Forward action (post entry 700) raises lifetime to 700; compensating action (void
          that entry) drops it back to 0 — the invariant holds with ZERO drift before and
          after.
        test_recipe:
          setup:
            - "ACTIVE notary in TX; one POSTED in-person journal entry fee 700 (lifetime == 700)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /jurisdictions/${jx_tx}/fee-schedules"
              payload: { act_type: "OATH", max_act_fee_cents: 1000 }
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N CI1", email: "nci1@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /journal-entries"
              payload: { notary_id: "${nota}", act_type: "OATH", signer_name: "Oath Taker", id_method: "PERSONAL_KNOWLEDGE", fee_charged_cents: 700 }
              as: Notary
              as_user_id: "${nota}"
              captures: { entry: $.data.id }
          trigger:
            - call: "POST /journal-entries/${entry}/void"
              payload: {}
              as: CommissionAuthority
          assert:
            - "JournalEntry.${entry}.status == VOID"
            - "Notary.${nota}.lifetime_fees_collected_cents == 0"

      - name: bond_settlement_conserves_face_value
        grounds:
          - calculations.bond_settlement_draw
          - entities.Bond.fields.face_value_cents
          - entities.Bond.fields.claims_paid_cents
          - entities.Bond.fields.remaining_cents
          - state_machines.Complaint.SUBSTANTIATED_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity = bond FACE VALUE (a DIFFERENT conserved quantity than the fee
          ledger): the settlement draw moves cents from remaining_cents into claims_paid_cents
          such that face_value_cents == claims_paid_cents + remaining_cents holds exactly
          before (1000000 == 0 + 1000000) and after (1000000 == 250000 + 750000) the draw.
        test_recipe:
          setup:
            - "ACTIVE notary, ACTIVE bond face 1000000; one SUBSTANTIATED FEE_OVERCHARGE complaint claim 250000"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx_tx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx_tx}", full_name: "N CI2", email: "nci2@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /complaints"
              payload: { notary_id: "${nota}", category: "FEE_OVERCHARGE", claim_amount_cents: 250000 }
              as: CommissionAuthority
              as_user_id: "auditor-2"
              captures: { cmp: $.data.id }
            - call: "POST /complaints/${cmp}/open-review"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-2"
            - call: "POST /complaints/${cmp}/substantiate"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-2"
          trigger:
            - call: "POST /complaints/${cmp}/settle"
              payload: {}
              as: CommissionAuthority
              as_user_id: "auditor-2"
          assert:
            - "Bond.${bond}.claims_paid_cents == 250000"
            - "Bond.${bond}.remaining_cents == 750000"
            - "Bond.${bond}.face_value_cents == 1000000"
            - "Bond.${bond}.status == ACTIVE"
