              as: VolunteerCoordinator
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { loc_v1: "$.data.version" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${ringer_id}", starts_at: "2026-11-16T09:00:00Z", ends_at: "2026-11-16T17:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${loc_v1}" }
              as: VolunteerCoordinator
              captures: { shift_a: "$.data.id" }
            - call: "POST /api/shifts/${shift_a}/confirm"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${shift_a}/check-in"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${shift_a}/complete"
              payload: {}
              as: VolunteerCoordinator
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { loc_v2: "$.data.version" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-17T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${ringer_id}", starts_at: "2026-11-17T09:00:00Z", ends_at: "2026-11-17T17:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${loc_v2}" }
              as: VolunteerCoordinator
              captures: { shift_b: "$.data.id" }
            - call: "POST /api/shifts/${shift_b}/confirm"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${shift_b}/check-in"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${shift_b}/complete"
              payload: {}
              as: VolunteerCoordinator
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { loc_v3: "$.data.version" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-18T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${ringer_id}", starts_at: "2026-11-18T09:00:00Z", ends_at: "2026-11-18T17:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${loc_v3}" }
              as: VolunteerCoordinator
              captures: { shift_c: "$.data.id" }
            - call: "POST /api/shifts/${shift_c}/confirm"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${shift_c}/cancel"
              payload: { reason: "site closed for inventory" }
              as: VolunteerCoordinator
            - call: "POST /api/kettle-collections"
              payload: { kettle_location_id: "${loc_id}", collected_on: "2026-11-18T18:00:00Z", declared_cents: 720000, coin_cents: 0, currency_cents: 720000, check_cents: 0 }
              as: CountingRoomTeller
              captures: { col_id: "$.data.id", col_v: "$.data.version" }
            - call: "POST /api/kettle-collections/${col_id}/verify"
              payload: { expected_kettle_collection_version: "${col_v}" }
              as: CountingRoomTeller
            - call: "POST /api/kettle-collections/${col_id}/deposit"
              payload: { deposited_cents: 716400 }
              as: FinanceOfficer
          trigger:
            - call: "GET /api/kettle-locations/${loc_id}/performance"
              payload: { on_date: "2026-11-16T00:00:00Z" }
              as: KettleCoordinator
              captures: { covered_hours: "$.data.covered_hours", cph: "$.data.cents_per_hour", idx: "$.data.performance_index", tier: "$.data.performance_tier", cov_full: "$.data.coverage_pct", under_full: "$.data.understaffed" }
            - call: "GET /api/kettle-locations/${loc_id}/performance"
              payload: { on_date: "2026-11-18T00:00:00Z" }
              as: KettleCoordinator
              captures: { cov_gap: "$.data.coverage_pct", under_gap: "$.data.understaffed" }
          assert:
            - "GET performance.covered_hours == 16 (two 480-minute COMPLETED shifts, 960 minutes)"
            - "GET performance.cents_per_hour == 45000 (floor(720000 / 16))"
            - "GET performance.performance_index == 30150 (floor(45000 * (100 - 33) / 100))"
            - "GET performance.performance_tier == PLATINUM"
            - "GET performance.coverage_pct on 2026-11-16 == 100 and understaffed == false"
            - "GET performance.coverage_pct on 2026-11-18 == 0 and understaffed == true (0 < 80 threshold)"

      - name: deposit_fee_per_denomination_rounding_order
        grounds:
          - calculations.deposit_denomination_split
          - calculations.kettle_collection_variance
          - state_machines.KettleCollection.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          deposit_denomination_split is mode (b): nested rounding where the order matters. The
          scaffold pins "floor each per-denomination fee, THEN sum", giving handling_fee_cents 384
          for coin_cents 12345 with currency 50000 and cheques 10000, whereas the sum-then-floor
          order would give 386 — so the assertion 384 (and the explicit 384 != 386) falsifies any
          implementation that rounds once at the end.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one ACTIVE campaign, APPROVED host site and ACTIVE kettle location"
            - "one KettleCollection in SUBMITTED with coin_cents 12345, currency_cents 50000, check_cents 10000 and declared_cents 72000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000, labor_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 3 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/kettle-collections"
              payload: { kettle_location_id: "${loc_id}", collected_on: "2026-11-14T18:00:00Z", declared_cents: 72000, coin_cents: 12345, currency_cents: 50000, check_cents: 10000 }
              as: CountingRoomTeller
              captures: { col_id: "$.data.id", col_v: "$.data.version" }
          trigger:
            - call: "POST /api/kettle-collections/${col_id}/verify"
              payload: { expected_kettle_collection_version: "${col_v}" }
              as: CountingRoomTeller
              captures: { fee: "$.data.handling_fee_cents", counted: "$.data.counted_total_cents", var_c: "$.data.variance_cents" }
          assert:
            - "KettleCollection.${col_id}.handling_fee_cents == 384"
            - "KettleCollection.${col_id}.handling_fee_cents != 386"
            - "KettleCollection.${col_id}.counted_total_cents == 72345"
            - "KettleCollection.${col_id}.variance_cents == 345"
            - "KettleCollection.${col_id}.deposit_status == VERIFIED"

  - rule_id: non_linear_state_machine
    instances:
      - name: shift_cycle_no_show_back_to_scheduled
        grounds:
          - state_machines.Shift.SCHEDULED_to_NO_SHOW
          - state_machines.Shift.NO_SHOW_to_SCHEDULED
          - calculations.bell_ringer_reliability_score
          - validations[priority=15]
        distinguishing_aspect: |
          The Shift machine is cyclic rather than a forward-only pipeline: NO_SHOW -> SCHEDULED is a
          legal re-entry edge, so the same Shift row visits SCHEDULED, NO_SHOW and SCHEDULED again,
          and the reliability_score moves 100 -> 85 -> 85 across the cycle rather than monotonically.
        test_recipe:
          setup:
            - "logical clock at 2026-11-20T00:00:00Z"
            - "one ACTIVE kettle location and one CLEARED, ACTIVE volunteer bell ringer"
            - "one Shift in SCHEDULED whose window 2026-11-18T09:00:00Z..2026-11-18T17:00:00Z is already in the past"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
