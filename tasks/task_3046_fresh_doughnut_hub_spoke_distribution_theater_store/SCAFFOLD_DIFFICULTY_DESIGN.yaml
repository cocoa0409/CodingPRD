# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Doughnut Hub-and-Spoke / Theater Store Operations
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: stale_credit_provisional_vs_final_diverge_on_late_stop
        grounds:
          - calculations.stale_credit
          - state_machines.StaleCredit.PROVISIONAL_to_FINALIZED
          - state_machines.Route.COMPLETED_to_RECONCILED
        distinguishing_aspect: |
          Same pulled_dozens (10) and same constants produce 7800 cents under the
          provisional variant (computed at pull creation) but 7020 cents under the
          final variant when the stop was ARRIVED after window_end (late penalty
          factor 0.9 applied before a single per-credit rounding step) — a
          calculation dual-variant on the StaleCredit/Door credit ledger domain.
        test_recipe:
          setup:
            - "Network N1 with hub H1 (capacity 500, region R1), one OPERATIONAL line L1 (rated 100/hr, service 100h)"
            - "Door D1 (SPOKE, FRANCHISE, region R1, supplied by H1)"
            - "Batch B1 COMPLETED on 2026-09-01 with produced 100 (planned 100)"
            - "Route RT1 LOCKED then DISPATCHED on 2026-09-01 with stop S1 for D1, window 08:00-10:00"
            - "Shipment SH1 on S1 from B1, 40 shipped; stop ARRIVED at 10:30 (after window_end, late-arrival-eligible), delivered 40, stop DELIVERED"
            - "Clock at 2026-09-01T12:00:00Z when stale pull of 10 dozen is created; provisional_credit_cents == 7800"
            - "Clock advanced so route auto-completes (all stops terminal already), route RECONCILED"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N1", display_name: "Net One" }
              as: NetworkAdmin
              captures: { n1: $.data.id }
            - call: "POST /networks/${n1}/hubs"
              payload: { hub_code: "H1", daily_capacity_dozens: 500, territory_region: "R1" }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /networks/${n1}/hubs/${h1}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 100 }
              as: HubManager
              captures: { l1: $.data.id }
            - call: "POST /networks/${n1}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "R1", hub_id: "${h1}" }
              as: NetworkAdmin
              captures: { d1: $.data.id }
            - call: "POST /networks/${n1}/hubs/${h1}/batches"
              payload: { equipment_line_id: "${l1}", production_date: "2026-09-01", planned_dozens: 100 }
              as: HubManager
              captures: { b1: $.data.id }
            - call: "GET /networks/${n1}/hubs/${h1}"
              payload: {}
              as: NetworkAdmin
              captures: { hub_v0: $.data.version }
            - call: "POST /networks/${n1}/hubs/${h1}/batches/${b1}/commit"
              payload: { expected_hub_version: "${hub_v0}" }
              as: HubManager
            - call: "POST /networks/${n1}/hubs/${h1}/batches/${b1}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${n1}/hubs/${h1}/batches/${b1}/complete"
              payload: { produced_dozens: 100 }
              as: HubManager
            - call: "POST /networks/${n1}/hubs/${h1}/routes"
              payload: { route_code: "RT1", service_date: "2026-09-01", vehicle_capacity_dozens: 200 }
              as: RoutePlanner
              captures: { rt1: $.data.id }
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/stops"
              payload: { door_id: "${d1}", sequence_no: 1, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T10:00:00Z" }
              as: RoutePlanner
              captures: { s1: $.data.id }
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/stops/${s1}/shipments"
              payload: { production_batch_id: "${b1}", dozens_shipped: 40 }
              as: RoutePlanner
              captures: { sh1: $.data.id }
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/dispatch"
              payload: {}
              as: RoutePlanner
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:30:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/stops/${s1}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /networks/${n1}/shipments/${sh1}/record-delivery"
              payload: { dozens_delivered: 40 }
              as: RouteDriver
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/stops/${s1}/deliver"
              payload: {}
              as: RouteDriver
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n1}/doors/${d1}/stale-credits"
              payload: { shipment_id: "${sh1}", pulled_dozens: 10 }
              as: DoorManager
              as_user_id: "${d1}"
              captures: { sc1: $.data.id, sc1_prov: $.data.provisional_credit_cents }
          trigger:
            - call: "POST /networks/${n1}/hubs/${h1}/routes/${rt1}/reconcile"
              payload: {}
              as: RoutePlanner
          assert:
            - "StaleCredit.${sc1}.provisional_credit_cents == 7800"
            - "StaleCredit.${sc1}.final_credit_cents == 7020"
            - "StaleCredit.${sc1}.credit_state == FINALIZED"
            - "Door.${d1}.credit_balance_cents reflects the final-variant delta: provisional recorded 7800, final adjustment applies (7020 - 7800) = -780"

      - name: network_posture_incremental_vs_opsrun_projection
        grounds:
          - calculations.network_posture
          - state_machines.ProductionBatch.RUNNING_to_SHORTFALL
        distinguishing_aspect: |
          The ops_run_projection variant (full recompute at POST /networks/{id}/ops-runs)
          yields DEGRADED from 2 SHORTFALL batches even when the incremental posture
          recompute left posture OPEN because each shortfall was recorded under a stale
          snapshot — posture recompute is a dual-variant calculation on the Network
          posture domain, distinct from the StaleCredit credit-ledger domain.
        test_recipe:
          setup:
            - "Network N2, hub H2 (capacity 500), line L2 OPERATIONAL"
            - "Two batches B1, B2 committed, started, and completed with produced 50 vs planned 100 (yield 0.5 < 0.85) → both SHORTFALL"
            - "After second shortfall, incremental posture recompute marks network DEGRADED; ops-run full recompute confirms DEGRADED and advances ops_run_index from 0 to 1"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N2", display_name: "Net Two" }
              as: NetworkAdmin
              captures: { n2: $.data.id }
            - call: "POST /networks/${n2}/hubs"
              payload: { hub_code: "H2", daily_capacity_dozens: 500, territory_region: "R2" }
              as: NetworkAdmin
              captures: { h2: $.data.id, h2_v: $.data.version }
            - call: "POST /networks/${n2}/hubs/${h2}/lines"
              payload: { line_kind: "GLAZE_WATERFALL", rated_dozens_per_hour: 100, service_interval_hours: 200 }
              as: HubManager
              captures: { l2: $.data.id }
            - call: "POST /networks/${n2}/hubs/${h2}/batches"
              payload: { equipment_line_id: "${l2}", production_date: "2026-09-01", planned_dozens: 100 }
              as: HubManager
              captures: { b21: $.data.id }
            - call: "POST /networks/${n2}/hubs/${h2}/batches/${b21}/commit"
              payload: { expected_hub_version: "${h2_v}" }
              as: HubManager
            - call: "POST /networks/${n2}/hubs/${h2}/batches/${b21}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${n2}/hubs/${h2}/batches/${b21}/complete"
              payload: { produced_dozens: 50 }
              as: HubManager
            - call: "POST /networks/${n2}/hubs/${h2}/batches"
              payload: { equipment_line_id: "${l2}", production_date: "2026-09-01", planned_dozens: 100 }
              as: HubManager
              captures: { b22: $.data.id }
            - call: "GET /networks/${n2}/hubs/${h2}"
              payload: {}
              as: NetworkAdmin
              captures: { h2_v2: $.data.version }
            - call: "POST /networks/${n2}/hubs/${h2}/batches/${b22}/commit"
              payload: { expected_hub_version: "${h2_v2}" }
              as: HubManager
            - call: "POST /networks/${n2}/hubs/${h2}/batches/${b22}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${n2}/hubs/${h2}/batches/${b22}/complete"
              payload: { produced_dozens: 50 }
              as: HubManager
          trigger:
            - call: "POST /networks/${n2}/ops-runs"
              payload: {}
              as: NetworkAdmin
              captures: { run_posture: $.data.network_posture, run_idx: $.data.ops_run_index }
          assert:
            - "ProductionBatch.${b21}.batch_status == SHORTFALL"
            - "ProductionBatch.${b22}.batch_status == SHORTFALL"
            - "ops-run response network_posture == DEGRADED (full-recompute variant)"
            - "ops_run_index == 1"
            - "Network.${n2}.network_posture == DEGRADED on subsequent GET"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fundraiser_pricing_marginal_tiers_with_per_line_rounding
        grounds:
          - calculations.fundraiser_pricing
          - state_machines.FundraiserOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (b) nested rounding: per-dozen-line round_half_up then sum is PINNED;
          a 30-dozen charity order applies 0.10 discount per line BEFORE rounding
          (25*round(700*0.9) + 5*round(650*0.9) = 25*630 + 5*585 = 18675), whereas
          sum-then-round would give round(30 lines' unrounded total) — the pinned
          order produces 18675 and any other order produces a different cent value.
        test_recipe:
          setup:
            - "Network N3, hub H3 (capacity 1000, region R3)"
            - "Door D3 (THEATER, COMPANY, region R3, hub_id null)"
            - "Fundraiser order F1 for 30 dozen, pickup 2026-09-03T10:00:00Z (>= LEAD_TIME_HOURS from default clock 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N3", display_name: "Net Three" }
              as: NetworkAdmin
              captures: { n3: $.data.id }
            - call: "POST /networks/${n3}/hubs"
              payload: { hub_code: "H3", daily_capacity_dozens: 1000, territory_region: "R3" }
              as: NetworkAdmin
            - call: "POST /networks/${n3}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "R3" }
              as: NetworkAdmin
              captures: { d3: $.data.id }
            - call: "POST /networks/${n3}/doors/${d3}/fundraiser-orders"
              payload: { organization_name: "Licensed Charity Org", requested_dozens: 30, pickup_at: "2026-09-03T10:00:00Z" }
              as: DoorManager
              as_user_id: "${d3}"
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /networks/${n3}/doors/${d3}/fundraiser-orders/${f1}/approve"
              payload: {}
              as: DoorManager
              as_user_id: "${d3}"
              captures: { f1_quote: $.data.quoted_total_cents }
          assert:
            - "FundraiserOrder.${f1}.quoted_total_cents == 18675 (charity variant: 25*630 + 5*585 with per-line rounding)"
            - "FundraiserOrder.${f1}.fundraiser_status == APPROVED"

      - name: mix_allocation_circular_ordering_waterfall
        grounds:
          - calculations.mix_allocation
          - state_machines.ProductionBatch.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: available pool depends on prior
          allocations, and allocations must be ordered BEFORE any remainder is
          computed — fundraiser reservations (pickup_at ASC, tie-break created_at
          ASC) take precedence over mix-plan lines (effective_date, then
          Door.created_at, then MixPlanLine.created_at). With available = 50,
          fundraiser need 20, mix need 40: fundraiser gets 20, mix gets min(40,30)=30.
          Evaluating in the opposite order would give mix 40 and fundraiser 10.
        test_recipe:
          setup:
            - "Network N4, hub H4 (capacity 500, region R4), line L4 OPERATIONAL"
            - "Door D4 (SPOKE, FRANCHISE, R4, hub H4) with PUBLISHED mix plan MP4 for 2026-09-01, one line planned 40 dozen (CORE variety V4)"
            - "Fundraiser order F4 at D4 for 20 dozen, APPROVED then SCHEDULED against the covering batch, pickup 2026-09-01T15:00:00Z"
            - "Batch B4 COMPLETED with produced 50 (planned 60 → yield 0.833... < 0.85 would SHORTFALL; use planned 50 produced 50)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N4", display_name: "Net Four" }
              as: NetworkAdmin
              captures: { n4: $.data.id }
            - call: "POST /networks/${n4}/hubs"
              payload: { hub_code: "H4", daily_capacity_dozens: 500, territory_region: "R4" }
              as: NetworkAdmin
              captures: { h4: $.data.id, h4_v: $.data.version }
            - call: "POST /networks/${n4}/hubs/${h4}/lines"
              payload: { line_kind: "CONTINUOUS_FRYER", rated_dozens_per_hour: 100, service_interval_hours: 500 }
              as: HubManager
              captures: { l4: $.data.id }
            - call: "POST /networks/${n4}/varieties"
              payload: { variety_code: "GLAZED", collection_kind: "CORE", active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z", unit_cost_cents: 80 }
              as: NetworkAdmin
              captures: { v4: $.data.id }
            - call: "POST /networks/${n4}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "R4", hub_id: "${h4}" }
              as: NetworkAdmin
              captures: { d4: $.data.id }
            - call: "POST /networks/${n4}/doors/${d4}/mix-plans"
              payload: { effective_date: "2026-09-01" }
              as: DoorManager
              as_user_id: "${d4}"
              captures: { mp4: $.data.id }
            - call: "POST /networks/${n4}/doors/${d4}/mix-plans/${mp4}/lines"
              payload: { variety_id: "${v4}", planned_dozens: 40 }
              as: DoorManager
              as_user_id: "${d4}"
            - call: "GET /networks/${n4}/doors/${d4}/mix-plans/${mp4}"
              payload: {}
              as: DoorManager
              as_user_id: "${d4}"
              captures: { mp4_v: $.data.version }
            - call: "POST /networks/${n4}/doors/${d4}/mix-plans/${mp4}/publish"
              payload: { expected_mix_plan_version: "${mp4_v}" }
              as: DoorManager
              as_user_id: "${d4}"
            - call: "POST /networks/${n4}/doors/${d4}/fundraiser-orders"
              payload: { organization_name: "School PTA", requested_dozens: 20, pickup_at: "2026-09-01T15:00:00Z" }
              as: DoorManager
              as_user_id: "${d4}"
              captures: { f4: $.data.id }
            - call: "POST /networks/${n4}/doors/${d4}/fundraiser-orders/${f4}/approve"
              payload: {}
              as: DoorManager
              as_user_id: "${d4}"
            - call: "POST /networks/${n4}/hubs/${h4}/batches"
              payload: { equipment_line_id: "${l4}", production_date: "2026-09-01", planned_dozens: 50 }
              as: HubManager
              captures: { b4: $.data.id }
            - call: "POST /networks/${n4}/hubs/${h4}/batches/${b4}/commit"
              payload: { expected_hub_version: "${h4_v}" }
              as: HubManager
            - call: "POST /networks/${n4}/doors/${d4}/fundraiser-orders/${f4}/schedule"
              payload: {}
              as: DoorManager
              as_user_id: "${d4}"
            - call: "POST /networks/${n4}/hubs/${h4}/batches/${b4}/start"
              payload: {}
              as: HubManager
          trigger:
            - call: "POST /networks/${n4}/hubs/${h4}/batches/${b4}/complete"
              payload: { produced_dozens: 50 }
              as: HubManager
          assert:
            - "ProductionBatch.${b4}.batch_status == COMPLETED (yield 50/50 == 1.0 >= 0.85)"
            - "Fundraiser reservation bucket filled first: fundraiser allocation == 20"
            - "MixPlanLine for ${mp4}.allocated_dozens == 30 (min(40 need, 50-20 available)) — fundraiser-first ordering is observable"
            - "FundraiserOrder.${f4}.fundraiser_status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: fundraiser_order_approval_cycle_returns_to_submitted
        grounds:
          - state_machines.FundraiserOrder.APPROVED_to_SUBMITTED
          - state_machines.FundraiserOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine: FundraiserOrder SUBMITTED -> APPROVED -> SUBMITTED
          (return-for-changes) -> APPROVED again; the second approval recomputes
          quoted_total_cents after the cycle cleared it, proving the loop is
          re-entrant rather than a one-way pipeline.
        test_recipe:
          setup:
            - "Network N5, hub H5, THEATER COMPANY door D5 (region R5)"
            - "Order F5 for 10 dozen, pickup 2026-09-03T10:00:00Z; approved once (quote 7000)"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N5", display_name: "Net Five" }
              as: NetworkAdmin
              captures: { n5: $.data.id }
            - call: "POST /networks/${n5}/hubs"
              payload: { hub_code: "H5", daily_capacity_dozens: 1000, territory_region: "R5" }
              as: NetworkAdmin
            - call: "POST /networks/${n5}/doors"
              payload: { door_kind: "THEATER", ownership: "COMPANY", territory_region: "R5" }
              as: NetworkAdmin
              captures: { d5: $.data.id }
            - call: "POST /networks/${n5}/doors/${d5}/fundraiser-orders"
              payload: { organization_name: "Band Boosters", requested_dozens: 10, pickup_at: "2026-09-03T10:00:00Z" }
              as: DoorManager
              as_user_id: "${d5}"
              captures: { f5: $.data.id }
            - call: "POST /networks/${n5}/doors/${d5}/fundraiser-orders/${f5}/approve"
              payload: {}
              as: DoorManager
              as_user_id: "${d5}"
          trigger:
            - call: "POST /networks/${n5}/doors/${d5}/fundraiser-orders/${f5}/return-for-changes"
              payload: {}
              as: DoorManager
              as_user_id: "${d5}"
            - call: "POST /networks/${n5}/doors/${d5}/fundraiser-orders/${f5}/approve"
              payload: {}
              as: DoorManager
              as_user_id: "${d5}"
              captures: { f5_quote2: $.data.quoted_total_cents }
          assert:
            - "After return-for-changes: fundraiser_status == SUBMITTED and quoted_total_cents cleared (null)"
            - "After second approve: fundraiser_status == APPROVED again"
            - "quoted_total_cents == 7000 (10 dozen at 700, non-charity, no discount)"

      - name: shipment_parallel_dimensions_delivery_and_credit
        grounds:
          - state_machines.Shipment
        distinguishing_aspect: |
          Parallel state dimensions on one entity: Shipment.delivery_status
          (STAGED->IN_TRANSIT->PARTIAL) and Shipment.credit_status
          (NONE->PENDING_PULL->DISPUTED) evolve independently — a PARTIAL shipment
          can carry credit_status DISPUTED, showing the two axes are not a single
          linear pipeline.
        test_recipe:
          setup:
            - "Network N6, hub H6 (cap 500, region R6), line L6 OPERATIONAL"
            - "Door D6 (SPOKE, FRANCHISE, R6, hub H6)"
            - "Batch B6 COMPLETED (planned 40, produced 40); route RT6 dispatched; stop S6 window 08:00-12:00 covering current clock"
            - "Shipment SH6 40 shipped, delivered 30 (PARTIAL); stale pull of 6 created then disputed"
          setup_api_calls:
            - call: "POST /networks"
              payload: { network_code: "N6", display_name: "Net Six" }
              as: NetworkAdmin
              captures: { n6: $.data.id }
            - call: "POST /networks/${n6}/hubs"
              payload: { hub_code: "H6", daily_capacity_dozens: 500, territory_region: "R6" }
              as: NetworkAdmin
              captures: { h6: $.data.id, h6_v: $.data.version }
            - call: "POST /networks/${n6}/hubs/${h6}/lines"
              payload: { line_kind: "GLAZE_WATERFALL", rated_dozens_per_hour: 100, service_interval_hours: 300 }
              as: HubManager
              captures: { l6: $.data.id }
            - call: "POST /networks/${n6}/doors"
              payload: { door_kind: "SPOKE", ownership: "FRANCHISE", territory_region: "R6", hub_id: "${h6}" }
              as: NetworkAdmin
              captures: { d6: $.data.id }
            - call: "POST /networks/${n6}/hubs/${h6}/batches"
              payload: { equipment_line_id: "${l6}", production_date: "2026-09-01", planned_dozens: 40 }
              as: HubManager
              captures: { b6: $.data.id }
            - call: "POST /networks/${n6}/hubs/${h6}/batches/${b6}/commit"
              payload: { expected_hub_version: "${h6_v}" }
              as: HubManager
            - call: "POST /networks/${n6}/hubs/${h6}/batches/${b6}/start"
              payload: {}
              as: HubManager
            - call: "POST /networks/${n6}/hubs/${h6}/batches/${b6}/complete"
              payload: { produced_dozens: 40 }
              as: HubManager
            - call: "POST /networks/${n6}/hubs/${h6}/routes"
              payload: { route_code: "RT6", service_date: "2026-09-01", vehicle_capacity_dozens: 200 }
              as: RoutePlanner
              captures: { rt6: $.data.id }
            - call: "POST /networks/${n6}/hubs/${h6}/routes/${rt6}/stops"
              payload: { door_id: "${d6}", sequence_no: 1, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }
              as: RoutePlanner
              captures: { s6: $.data.id }
            - call: "POST /networks/${n6}/hubs/${h6}/routes/${rt6}/stops/${s6}/shipments"
              payload: { production_batch_id: "${b6}", dozens_shipped: 40 }
              as: RoutePlanner
              captures: { sh6: $.data.id }
            - call: "POST /networks/${n6}/hubs/${h6}/routes/${rt6}/lock"
              payload: {}
              as: RoutePlanner
            - call: "POST /networks/${n6}/hubs/${h6}/routes/${rt6}/dispatch"
              payload: {}
              as: RoutePlanner
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n6}/hubs/${h6}/routes/${rt6}/stops/${s6}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /networks/${n6}/shipments/${sh6}/record-delivery"
              payload: { dozens_delivered: 30 }
              as: RouteDriver
            - call: "POST /networks/${n6}/hubs/${h6}/routes/${rt6}/stops/${s6}/deliver"
              payload: {}
              as: RouteDriver
            - call: "POST /networks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T13:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks/${n6}/doors/${d6}/stale-credits"
              payload: { shipment_id: "${sh6}", pulled_dozens: 6 }
              as: DoorManager
              as_user_id: "${d6}"
