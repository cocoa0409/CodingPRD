          assert:
            - "${errD} == ERR_ROUND_NOT_OPEN   # 409 while round DRAFT"
            - "Submission.${s1}.status was QUEUED before the successful send"
            - "${stS} == SENT and ${sp} == 0   # same submission succeeds once the round is OPEN"

      - name: agreement_offer_requires_manuscript_accepted
        grounds:
          - state_machines.ClientAgreement.DRAFT_to_OFFERED
          - validations[priority=12]
        distinguishing_aspect: |
          DIFFERENT entity pair than the sibling (ClientAgreement -> Manuscript,
          not Submission -> SubmissionRound): the DRAFT -> OFFERED transition on
          the agreement is gated by the manuscript's state; while the manuscript
          is EVALUATED (not yet ACCEPTED) the offer fails
          ERR_MANUSCRIPT_NOT_ACCEPTED, and succeeds after the manuscript flips.
        test_recipe:
          setup:
            - "Agency; agent; author; manuscript EVALUATED with eval_score 75 (not accepted); agreement agr1 DRAFT referencing it"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency X2", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
