      # --- validations: claims already exercised by the difficulty design --------
      - name: validation_recheck_at_each_level_of_the_cascade
        claim_type: cascading_validation
        grounds:
          - validations.priority_12
          - calculations.casting_posture_derivation
          - state_machines.CastingCall.PUBLISHED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / execute_rollup_restricts_posture_closes_open_calls_depth4
          rationale: |
            The difficulty instance already walks the four-level chain execute ->
            stipend rollup -> posture RESTRICTED -> OPEN_CALL closure and asserts the
            state at every level, including that the derived posture is re-evaluated
            (not merely stamped) before the child closures fire. A corner restatement
            would exercise the identical endpoints and the identical derivation.

  # ===========================================================================
  - section: endpoints
    instances:

      - name: post_obligation_fulfill_sets_fulfilled_at_from_the_logical_clock
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/casting/post-obligations/{id}/fulfill
          - entities.PostObligation.fields.fulfilled_at
          - state_machines.PostObligation.SCHEDULED_to_FULFILLED
          - calculations.post_obligation_fee_allocation
        distinguishing_aspect: |
          Action-endpoint claim: fulfil is a state-changing POST with an empty body that
          stamps fulfilled_at from the logical clock (2026-08-01T00:00:00Z, untouched by
          this recipe) rather than from wall time, and it is NOT idempotent — a second
          call from SCHEDULED-less state answers ERR_INVALID_STATE_TRANSITION at 409.
          The single press appearance also fixes the FINAL stipend at 225,000 and
          produces exactly one obligation row, so the ladder length tracks the agreement
          terms rather than a fixed template.
        test_recipe:
          setup:
            - "One production; one CLEARED adult applicant; one EXECUTED agreement carrying a single press appearance and no reunion."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, press_appearance_obligation_count: 1, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id }
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { prov: $.data.provisional_stipend_cents }
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
              captures: { final_total: $.data.total_stipend_commitment_cents }
            - call: "GET /casting/participant-agreements/${agr_id}/post-obligations"
