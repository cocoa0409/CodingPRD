        distinguishing_aspect: "The 0.6500 floor is conditional on reason == ANALYTICS_SCORE: the identical score 0.5000 is refused 422 under ANALYTICS_SCORE, accepted 201 under NOTICE_MANDATE and under UNSIGNED_TRAFFIC, and the boundary value 0.6500 itself is accepted under ANALYTICS_SCORE because the comparison is >=."
