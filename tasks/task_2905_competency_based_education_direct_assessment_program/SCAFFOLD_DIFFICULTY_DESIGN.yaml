          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with units_per_credit_hour 3.0"
            - "competencies B-1 and B-2, each worth 4 units with mastery_threshold_pct 80.00 and a single-reader blueprint of two 0.5000-weight dimensions with max_score 10000"
