  - rule_id: cross_entity_state_dependency
    instances:
      - name: return_prepare_blocked_while_carrier_ifta_license_suspended
        dependency: FuelTaxReturn.prepare depends on Carrier.ifta_license_status
        grounds:
          - validations.priority_18_ERR_CARRIER_LICENSE_INACTIVE
          - state_machines.Carrier.ifta_license_status.ACTIVE_to_SUSPENDED
          - state_machines.AuditSelection.SELECTED_to_RETENTION_REVIEWED
          - calculations.audit_risk_score
        distinguishing_aspect: |
          The blocked operation lives on FuelTaxReturn but the blocking state lives on Carrier,
          two entities away from the caller's request: a retention review of the 2026 Q2
          selection pushes post_review_risk_score to 98, which suspends the IFTA licence, and
          from that moment a brand-new Q1-2026 DRAFT return cannot be prepared even though the
          return itself is in a perfectly legal state and the OCC version supplied is current.
          The suspension leaves irp_account_status ACTIVE, so the dependency is specific to the
          IFTA dimension rather than to the carrier as a whole.
        test_recipe:
          setup:
            - "Canonical Q2-2026 chain for carrier cB1: trips 700.0 / 800.0 telematics ACCEPTED, a 500.0 mi trip with a 100.0 mi gap reconstructed to IL 250.0 / KY 350.0 and ACCEPTED, and a 700.0 mi trip left GAP_FLAGGED; fuel IL 175.000 / IN 80.000 / KY 30.000."
            - "The Q2-2026 return is prepared by preparer-1 (total_amount_due 118.60) and FILED by officer-1."
            - "An AuditSelection for 2026 Q2 scores 77 with late_filing_count 0 and retention_deficiency_count 4, so it is SELECTED."
            - "officer-2 records a retention review of 14 missing records out of 20 expected: retention_deficiency_ratio 0.7000 lifts the score to 98, which is at or above LICENSE_SUSPENSION_THRESHOLD 90 while the ratio is below 1.0000, so the licence is SUSPENDED."
            - "A fresh Q1-2026 DRAFT return is created and the carrier's post-suspension version is read."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
