scenario: |
  ETC Toll Road (E-ZPass style): transponder binding, license plate recognition
  supplement, cross-state interoperability, violations and fines, low-balance
  auto-reload, Carpool HOV exemption, Toll-by-Plate.

domain_name: etc-toll-road
api_prefix: /accounts

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - dual_variant_calculation
    - contagion_risk_propagation
  entity_topology: hybrid
  state_machine_shape: branching   # TollEvent has parallel capture/billing dimensions; Violation has revert; Fine has cyclic dispute loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: holder_name
        type: string
        source: input
        description: Account holder full name
        constraints: "1..120 chars"
      - name: home_agency_code
        type: enum
        source: input
        description: Home tolling agency (state) that issued the account
        constraints: "one of {NY_EZPASS, NJ_EZPASS, PA_TURNPIKE, FL_SUNPASS}"
      - name: balance_cents
        type: integer
        source: computed
        description: Current prepaid balance in cents; updated by toll posting and reloads
        default: 0
        constraints: ">= 0 after settle; may go negative only during a settle if posting overshoots, then auto-reload runs"
      - name: auto_reload_enabled
        type: boolean
        source: input
        description: Whether low-balance auto-reload is active
        default: false
      - name: auto_reload_threshold_cents
        type: integer
        source: input
        description: Balance breakpoint that triggers auto-reload (reload runs when balance <= threshold)
        default: 1000
        constraints: ">= 0 and <= 10000"
      - name: auto_reload_topup_cents
        type: integer
        source: input
        description: Amount added to balance during an auto-reload event
        default: 4000
        constraints: ">= 1000 and <= 20000"
      - name: payment_method_token
        type: string
        source: input
        description: Opaque tokenized payment method for reloads
        constraints: "required if auto_reload_enabled is true"
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the account
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: outstanding_fine_cents
        type: integer
        source: computed
        description: Sum of Fine.amount_cents where settlement_status IN {PENDING, OVERDUE}
        default: 0

  - name: Vehicle
    parent: Account
    common_fields: true
    fields:
      - name: plate_number
        type: string
        source: input
        description: License plate number (normalized uppercase, no spaces)
        constraints: "1..10 chars, [A-Z0-9-]; unique across plate_number+plate_state"
      - name: plate_state
        type: enum
        source: input
        description: State of plate issuance
        constraints: "one of {NY, NJ, PA, FL, CA, TX, OTHER}"
      - name: axle_count
        type: integer
        source: input
        description: Number of axles for class-based rating
        default: 2
        constraints: ">= 2 and <= 7"
      - name: vehicle_class
        type: enum
        source: computed
        description: Derived class CLASS_2/3/4/5+ from axle_count
        constraints: "computed from axle_count via tiered_rate table"
      - name: hov_capable
        type: boolean
        source: input
        description: Whether vehicle is eligible to claim HOV exemption (e.g., not a single-occupancy commercial truck)
        default: true
      - name: status
        type: enum
        source: computed
        description: Vehicle status
        default: ACTIVE
        constraints: "one of {ACTIVE, BLOCKED}"

  - name: Transponder
    parent: Account
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: Manufacturer serial (unique)
        constraints: "10..24 chars, [A-Z0-9]; globally unique"
      - name: bound_vehicle_id
        type: string
        source: input
        description: Currently bound Vehicle.id; null when unbound
        default: null
      - name: status
        type: enum
        source: computed
        description: Transponder lifecycle status
        default: UNBOUND
        constraints: "one of {UNBOUND, ACTIVE, SUSPENDED, RETURNED}"
      - name: bound_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp of latest binding
        default: null

  - name: TollEvent
    parent: null
    common_fields: false
    fields:
      - name: gantry_id
        type: string
        source: input
        description: Gantry identifier (operator-defined)
        constraints: "1..32 chars"
      - name: agency_code
        type: enum
        source: input
        description: Agency that operates this gantry
        constraints: "one of {NY_EZPASS, NJ_EZPASS, PA_TURNPIKE, FL_SUNPASS}"
      - name: base_rate_cents
        type: integer
        source: input
        description: Posted gantry base rate at event time (Class 2 reference)
        constraints: ">= 0"
      - name: read_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the gantry recorded
      - name: capture_method
        type: enum
        source: computed
        description: How the event was attributed
        constraints: "one of {TRANSPONDER, PLATE, UNRESOLVED}"
      - name: transponder_serial
        type: string
        source: input
        description: Optional transponder read at gantry
        default: null
      - name: plate_number
        type: string
        source: input
        description: Optional plate read at gantry (camera)
        default: null
      - name: plate_state
        type: enum
        source: input
        description: Optional plate state read at gantry
        default: null
      - name: declared_occupants
        type: integer
        source: input
        description: Occupant count declared by lane sensor / driver app (1 means SOV)
        default: 1
        constraints: ">= 1 and <= 9"
      - name: hov_lane
        type: boolean
        source: input
        description: Whether the gantry is an HOV lane gantry
        default: false
      - name: account_id
        type: string
        source: computed
        description: Account this event is attributed to (null if UNRESOLVED)
        default: null
      - name: vehicle_id
        type: string
        source: computed
        description: Vehicle this event is attributed to (null if UNRESOLVED)
        default: null
      - name: billing_status
        type: enum
        source: computed
        description: Independent billing state
        default: PENDING
        constraints: "one of {PENDING, POSTED, TOLL_BY_PLATE_INVOICED, VIOLATED, EXEMPTED, VOIDED}"
      - name: gross_toll_cents
        type: integer
        source: computed
        description: Toll before discounts/surcharges (class-adjusted base rate)
        default: 0
      - name: net_toll_cents
        type: integer
        source: computed
        description: Final toll charged after interop discount/surcharge/HOV exemption
        default: 0
      - name: hov_exempt_applied
        type: boolean
        source: computed
        description: Whether HOV exemption was applied
        default: false
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC of insertion

  - name: ReloadEvent
    parent: Account
    common_fields: false
    fields:
      - name: kind
        type: enum
        source: input
        description: Manual reload vs auto-reload
        constraints: "one of {MANUAL, AUTO}"
      - name: amount_cents
        type: integer
        source: input
        description: Amount added to balance (positive integer)
        constraints: ">= 100 and <= 50000"
      - name: balance_before_cents
        type: integer
        source: computed
        description: Snapshot of Account.balance_cents immediately before this reload
      - name: balance_after_cents
        type: integer
        source: computed
        description: Snapshot of Account.balance_cents immediately after this reload
      - name: triggered_by_event_id
        type: string
        source: system
        description: TollEvent.id whose posting triggered an AUTO reload; null for MANUAL
        default: null
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC creation timestamp

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: toll_event_id
        type: string
        source: input
        description: TollEvent that triggered this violation
        constraints: "unique — one Violation per TollEvent at most"
      - name: account_id
        type: string
        source: computed
        description: Account derived from plate lookup; null if no plate match
        default: null
      - name: vehicle_id
        type: string
        source: computed
        description: Vehicle derived from plate lookup; null if no plate match
        default: null
      - name: reason_code
        type: enum
        source: computed
        description: Why the event became a violation
        constraints: "one of {UNREAD_TRANSPONDER_NO_PLATE, INSUFFICIENT_FUNDS_ON_PLATE_BILL, BLOCKED_VEHICLE, HOV_FRAUD}"
      - name: status
        type: enum
        source: computed
        description: Violation lifecycle
        default: OPEN
        constraints: "one of {OPEN, CLEARED, ESCALATED}"

  - name: Fine
    parent: Violation
    common_fields: true
    fields:
      - name: amount_cents
        type: integer
        source: computed
        description: Fine amount (toll + civil penalty)
        constraints: ">= 0"
      - name: civil_penalty_cents
        type: integer
        source: computed
        description: Civil penalty portion (excludes toll component)
      - name: settlement_status
        type: enum
        source: computed
        description: Fine settlement lifecycle
        default: PENDING
        constraints: "one of {PENDING, OVERDUE, DISPUTED, SETTLED, DISMISSED}"
      - name: due_at
        type: datetime
        source: system
        description: Fine due timestamp (issued_at + 30 days)
      - name: issued_at
        type: datetime
        source: system
        description: When fine was issued (matches Violation creation)
      - name: dispute_count
        type: integer
        source: computed
        description: How many DISPUTE→PENDING cycles have run for this fine
        default: 0
        constraints: ">= 0 and <= 2; third dispute attempt is rejected"

  - name: InteropPolicy
    parent: null
    common_fields: false
    fields:
      - name: home_agency
        type: enum
        source: input
        description: Account home agency code
        constraints: "one of {NY_EZPASS, NJ_EZPASS, PA_TURNPIKE, FL_SUNPASS}"
      - name: gantry_agency
        type: enum
        source: input
        description: Tolling agency operating the gantry
        constraints: "one of {NY_EZPASS, NJ_EZPASS, PA_TURNPIKE, FL_SUNPASS}"
      - name: surcharge_bps
        type: integer
        source: input
        description: Cross-state surcharge in basis points applied when home != gantry (e.g., 500 = +5%)
        default: 0
        constraints: ">= 0 and <= 5000"
      - name: discount_bps
        type: integer
        source: input
        description: Cross-state discount in basis points applied when home != gantry (e.g., 200 = -2%)
        default: 0
        constraints: ">= 0 and <= 5000"
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC of insertion

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Automatic — derived: outstanding_fine_cents >= SUSPEND_THRESHOLD_CENTS (15000) after Fine reconciliation"
        actor: system
        preconditions:
          - "Account.status == ACTIVE"
          - "Account.outstanding_fine_cents >= 15000 (post-reconciliation)"
        side_effects:
          - "Account.status := SUSPENDED; Account.version increments"
          - "All Vehicles owned by this Account: Vehicle.status := BLOCKED (cascade)"
          - "All ACTIVE Transponders owned by this Account: Transponder.status := SUSPENDED (cascade)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "Recompute after Fine settlement reconciliation when outstanding_fine_cents < SUSPEND_THRESHOLD_CENTS"
        actor: system
        preconditions:
          - "Account.outstanding_fine_cents < 15000"
        side_effects:
          - "Account.status := ACTIVE; Account.version increments"
          - "Each BLOCKED Vehicle whose only blocker was this Account suspension: Vehicle.status := ACTIVE"
          - "Each SUSPENDED Transponder bound to a now-ACTIVE Vehicle: Transponder.status := ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "DELETE /accounts/{id}"
        actor: AgencyAdmin
        preconditions:
          - "Account.outstanding_fine_cents == 0"
          - "No Transponder in {ACTIVE, SUSPENDED} bound to this Account (must be UNBOUND or RETURNED)"
        side_effects:
          - "Account.status := CLOSED"
          - "All Vehicles of this Account: Vehicle.status := BLOCKED"

  - entity: Transponder
    initial_state: UNBOUND
    terminal_states: [RETURNED]
    transitions:
      - from: UNBOUND
        to: ACTIVE
        trigger: "POST /accounts/{id}/transponders/{tid}/bind"
        actor: AccountHolder
        preconditions:
          - "Transponder.account_id == path account_id (ownership)"
          - "Vehicle exists and Vehicle.account_id == Transponder.account_id"
          - "Vehicle.status == ACTIVE"
          - "Account.status == ACTIVE"
          - "No other Transponder is bound to this Vehicle (one-to-one)"
        side_effects:
          - "Transponder.bound_vehicle_id := request.vehicle_id"
          - "Transponder.bound_at := now"
      - from: ACTIVE
        to: UNBOUND
        trigger: "POST /accounts/{id}/transponders/{tid}/unbind"
        actor: AccountHolder
        preconditions:
          - "Transponder.status == ACTIVE"
        side_effects:
          - "Transponder.bound_vehicle_id := null"
          - "Transponder.bound_at := null"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Cascade from Account ACTIVE→SUSPENDED"
        actor: system
        preconditions:
          - "Owning Account.status == SUSPENDED"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "Cascade from Account SUSPENDED→ACTIVE"
        actor: system
        preconditions:
          - "Owning Account.status == ACTIVE"
          - "Transponder.bound_vehicle_id is not null"
          - "Bound Vehicle.status == ACTIVE"
        side_effects: []
      - from: UNBOUND
        to: RETURNED
        trigger: "DELETE /accounts/{id}/transponders/{tid}"
        actor: AccountHolder
        preconditions:
          - "Transponder.status == UNBOUND"
        side_effects:
          - "Transponder is excluded from any future bind attempt"

  - entity: TollEvent
    initial_state: PENDING
    terminal_states: [POSTED, TOLL_BY_PLATE_INVOICED, VIOLATED, EXEMPTED, VOIDED]
    transitions:
      - from: PENDING
        to: EXEMPTED
        trigger: "POST /toll-events (ingest) — gantry recognizes HOV with valid occupancy and hov_capable vehicle"
        actor: system
        preconditions:
          - "TollEvent.hov_lane == true"
          - "TollEvent.declared_occupants >= HOV_MIN_OCCUPANTS (3)"
          - "Attribution resolved (TRANSPONDER or PLATE) — Vehicle.hov_capable == true"
        side_effects:
          - "TollEvent.capture_method set per attribution path; hov_exempt_applied := true"
          - "TollEvent.gross_toll_cents and net_toll_cents := 0"
          - "Calculation `toll_pricing` runs in HOV variant"
      - from: PENDING
        to: POSTED
        trigger: "POST /toll-events — attribution via TRANSPONDER read"
        actor: system
        preconditions:
          - "transponder_serial corresponds to Transponder.status == ACTIVE"
          - "Bound Vehicle.status == ACTIVE"
          - "Account.status == ACTIVE"
          - "Account.balance_cents - computed net_toll_cents (post-posting) >= -auto_reload_topup_cents OR auto_reload_enabled == true"
        side_effects:
          - "TollEvent.capture_method := TRANSPONDER"
          - "Calculation `toll_pricing` computes gross_toll_cents and net_toll_cents (interop variant)"
          - "Account.balance_cents := balance_cents - net_toll_cents"
          - "If post-debit balance_cents <= auto_reload_threshold_cents AND auto_reload_enabled == true → cascade: create ReloadEvent(kind=AUTO) — see calculation `auto_reload_topup`"
      - from: PENDING
        to: TOLL_BY_PLATE_INVOICED
        trigger: "POST /toll-events — attribution via PLATE (no transponder read) AND plate matches a registered Vehicle with sufficient post-debit balance OR auto_reload_enabled == true"
        actor: system
        preconditions:
          - "transponder_serial is null OR did not match an ACTIVE Transponder"
          - "plate_number + plate_state resolve to a Vehicle whose Account.status == ACTIVE"
          - "Vehicle.status == ACTIVE"
          - "Account.balance_cents - computed net_toll_cents >= 0 OR auto_reload_enabled == true"
        side_effects:
          - "TollEvent.capture_method := PLATE"
          - "Calculation `toll_pricing` computes gross_toll_cents and net_toll_cents (interop + plate-surcharge variant)"
          - "Account.balance_cents := balance_cents - net_toll_cents"
          - "If post-debit balance_cents <= auto_reload_threshold_cents AND auto_reload_enabled == true → cascade: create ReloadEvent(kind=AUTO)"
      - from: PENDING
        to: VIOLATED
        trigger: "POST /toll-events — attribution fails (no transponder + no plate match) OR plate-bill insufficient funds (no auto-reload) OR vehicle blocked OR HOV claim with declared_occupants < 3"
        actor: system
        preconditions:
          - "ANY of: (no transponder match AND no plate match), (PLATE match but post-debit balance_cents < 0 AND auto_reload_enabled == false), (matched Vehicle.status == BLOCKED), (hov_lane == true AND declared_occupants < 3 AND hov_capable == true — HOV fraud)"
        side_effects:
          - "TollEvent.capture_method := PLATE | UNRESOLVED depending on plate match"
          - "Violation created: reason_code per the matched branch"
          - "Fine created with calculation `fine_amount` (compounding mode)"
          - "If account_id resolved: cascade — Account.outstanding_fine_cents recomputed; may trigger Account ACTIVE→SUSPENDED"
      - from: TOLL_BY_PLATE_INVOICED
        to: VOIDED
        trigger: "POST /toll-events/{id}/void (operator correction within 24h)"
        actor: AgencyAdmin
        preconditions:
          - "TollEvent.created_at within 24 hours of now"
          - "billing_status == TOLL_BY_PLATE_INVOICED"
        side_effects:
          - "Account.balance_cents := balance_cents + net_toll_cents (refund)"
          - "TollEvent.net_toll_cents := 0; gross_toll_cents := 0"
      - from: POSTED
        to: VOIDED
        trigger: "POST /toll-events/{id}/void (operator correction within 24h)"
        actor: AgencyAdmin
        preconditions:
          - "TollEvent.created_at within 24 hours of now"
          - "billing_status == POSTED"
        side_effects:
          - "Account.balance_cents := balance_cents + net_toll_cents (refund)"
          - "TollEvent.net_toll_cents := 0; gross_toll_cents := 0"
      - from: VIOLATED
        to: VOIDED
        trigger: "POST /toll-events/{id}/void"
        actor: AgencyAdmin
        preconditions:
          - "billing_status == VIOLATED"
          - "Associated Fine.settlement_status == PENDING (must void before fine is settled or disputed)"
        side_effects:
          - "Associated Violation.status := CLEARED"
          - "Associated Fine.settlement_status := DISMISSED"
          - "Cascade — Account.outstanding_fine_cents recomputed; may trigger Account SUSPENDED→ACTIVE"

  - entity: Violation
    initial_state: OPEN
    terminal_states: [CLEARED, ESCALATED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "Cascade from Fine SETTLED or Fine DISMISSED"
        actor: system
        preconditions:
          - "Fine.settlement_status IN {SETTLED, DISMISSED}"
        side_effects:
          - "Account.outstanding_fine_cents recomputed; may trigger Account SUSPENDED→ACTIVE"
      - from: OPEN
        to: ESCALATED
        trigger: "Cascade from Fine OVERDUE second dispute_count breach"
        actor: system
        preconditions:
          - "Fine.settlement_status == OVERDUE AND Fine.dispute_count >= 2"
        side_effects:
          - "Vehicle.status := BLOCKED (registration hold)"
          - "If account_id present and Account.status == ACTIVE: Account.outstanding_fine_cents recomputed and may flip to SUSPENDED"

  - entity: Fine
    initial_state: PENDING
    terminal_states: [SETTLED, DISMISSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /fines/{id}/pay"
        actor: AccountHolder
        preconditions:
          - "Fine.settlement_status == PENDING"
          - "Request includes payment_method_token"
        side_effects:
          - "Cascade — Violation.status := CLEARED"
          - "Cascade — Account.outstanding_fine_cents := outstanding_fine_cents - Fine.amount_cents; may trigger SUSPENDED→ACTIVE"
      - from: PENDING
        to: DISPUTED
        trigger: "POST /fines/{id}/dispute"
        actor: AccountHolder
        preconditions:
          - "Fine.settlement_status == PENDING"
          - "Fine.dispute_count < 2"
        side_effects:
          - "Fine.dispute_count += 1"
          - "Account.outstanding_fine_cents recomputed (DISPUTED counts as 0 outstanding)"
          - "May trigger SUSPENDED→ACTIVE"
      - from: DISPUTED
        to: PENDING
        trigger: "POST /fines/{id}/dispute/reject"
        actor: AgencyAdmin
        preconditions:
          - "Fine.settlement_status == DISPUTED"
        side_effects:
          - "Account.outstanding_fine_cents recomputed (back to count); may trigger ACTIVE→SUSPENDED"
      - from: PENDING
        to: DISMISSED
        trigger: "Cascade from TollEvent VIOLATED→VOIDED (operator void)"
        actor: system
        preconditions:
          - "Fine.settlement_status == PENDING"
          - "Associated TollEvent.billing_status transitions VIOLATED → VOIDED"
        side_effects:
          - "Cascade — Violation.status := CLEARED"
          - "Account.outstanding_fine_cents := outstanding_fine_cents - Fine.amount_cents; may trigger SUSPENDED→ACTIVE"
      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /fines/{id}/dispute/uphold"
        actor: AgencyAdmin
        preconditions:
          - "Fine.settlement_status == DISPUTED"
        side_effects:
          - "Cascade — Violation.status := CLEARED"
          - "Cascade — Associated TollEvent.net_toll_cents stays zero; no refund"
          - "Account.outstanding_fine_cents recomputed"
      - from: PENDING
        to: OVERDUE
        trigger: "Automatic — system check at clock advance: now >= Fine.due_at AND settlement_status == PENDING"
        actor: system
        preconditions:
          - "Fine.due_at <= now"
          - "Fine.settlement_status == PENDING"
        side_effects:
          - "Fine.amount_cents := amount_cents + LATE_PENALTY_CENTS (2000); civil_penalty_cents += 2000"
          - "Account.outstanding_fine_cents recomputed; may trigger ACTIVE→SUSPENDED"
          - "If dispute_count >= 2: cascade Violation OPEN→ESCALATED (vehicle block)"
      - from: OVERDUE
        to: SETTLED
        trigger: "POST /fines/{id}/pay"
        actor: AccountHolder
        preconditions:
          - "Fine.settlement_status == OVERDUE"
        side_effects:
          - "Cascade — Violation.status := CLEARED; if Violation was ESCALATED, Vehicle.status := ACTIVE"
          - "Account.outstanding_fine_cents := outstanding_fine_cents - Fine.amount_cents; may trigger SUSPENDED→ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two bind requests on the same Vehicle from different Transponders simultaneously"
    guarantee: "At most one Transponder is bound per Vehicle at any time; second bind rejected"
    error_id: ERR_VEHICLE_ALREADY_BOUND
    http_status: 409
    serialization: "First-writer-wins on (Vehicle.id, Transponder.bound_vehicle_id) — second sees the field set and rejects"

  - scenario: "Pay and dispute on the same Fine simultaneously"
    guarantee: "Exactly one operation succeeds; loser is rejected with state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Fine.settlement_status"

  - scenario: "Void and pay on the same TollEvent's associated Fine simultaneously"
    guarantee: "Exactly one operation succeeds; loser is rejected with state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Fine.settlement_status / TollEvent.billing_status"

  - scenario: "Two toll-events ingested for the same gantry_id+read_at+vehicle within the deduplication window"
    guarantee: "At most one TollEvent recorded per (gantry_id, read_at_rounded_to_minute, plate_number+plate_state) tuple; duplicate rejected"
    error_id: ERR_DUPLICATE_TOLL_EVENT
    http_status: 409
    serialization: "First-writer-wins on the dedup tuple"

  - scenario: "Concurrent PATCH on Account auto-reload settings with stale version"
    guarantee: "Stale version write rejected"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC — Account.version must match request.version"

  - scenario: "Concurrent auto-reload on the same Account from two postings that both cross the threshold"
    guarantee: "At most one ReloadEvent per crossing of the threshold per minute; second posting observes new balance > threshold and does not reload"
    error_id: ERR_RELOAD_ALREADY_RUNNING
    http_status: 409
    serialization: "First-writer-wins on (Account.id, balance_cents) post-debit observation"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: toll_pricing
    trigger: "TollEvent transition PENDING → {POSTED, TOLL_BY_PLATE_INVOICED, EXEMPTED, VIOLATED} (computes gross_toll_cents and net_toll_cents)"
    algorithm: tiered_pricing
    formula: |
      # Class multiplier from axle_count via lookup
      class_mult = CLASS_MULT[ Vehicle.vehicle_class ]  # CLASS_2: 1.00, CLASS_3: 1.50, CLASS_4: 2.25, CLASS_5_PLUS: 3.50

      gross_toll_cents = round_half_up( TollEvent.base_rate_cents * class_mult )

      # Apply cross-state interoperability adjustment
      if Account.home_agency_code == TollEvent.agency_code:
          interop_adjust = 0
      else:
          # Look up InteropPolicy by (home, gantry); both surcharge and discount possible
          policy = lookup_interop_policy(Account.home_agency_code, TollEvent.agency_code)
          interop_adjust = round_half_up( gross_toll_cents * (policy.surcharge_bps - policy.discount_bps) / 10000 )

      # Apply plate-bill surcharge (Toll-by-Plate is more expensive than transponder)
      if capture_method == PLATE:
          plate_surcharge = round_half_up( gross_toll_cents * PLATE_BILL_SURCHARGE_BPS / 10000 )  # 1500 bps = +15%
      else:
          plate_surcharge = 0

      # HOV exemption zeros it out
      if hov_exempt_applied:
          net_toll_cents = 0
      else:
          net_toll_cents = max(0, gross_toll_cents + interop_adjust + plate_surcharge)
    input_set: "Vehicle (vehicle_class via axle_count), TollEvent (base_rate_cents, capture_method, hov flags), Account (home_agency_code), InteropPolicy (surcharge_bps, discount_bps) — only POLICIES with matching (home, gantry) pair; if none, defaults to zero adjust"
    constants:
      CLASS_MULT: { CLASS_2: 1.00, CLASS_3: 1.50, CLASS_4: 2.25, CLASS_5_PLUS: 3.50 }
      PLATE_BILL_SURCHARGE_BPS: 1500
      HOV_MIN_OCCUPANTS: 3
    precision: "All sub-products and the final value are rounded half_up to integer cents AT EACH STEP (per-step rounding, NOT once at the end). Order is pinned: class adjustment → interop adjustment → plate surcharge → HOV check."
    variants:
      - name: posted_transponder
        when: "capture_method == TRANSPONDER and not hov_exempt"
        difference: "plate_surcharge term is 0; account balance decremented"
      - name: toll_by_plate_invoiced
        when: "capture_method == PLATE and Vehicle resolved with sufficient funds (or auto_reload_enabled)"
        difference: "Adds plate_surcharge term (15%); identical interop and class logic"
      - name: hov_exempted
        when: "hov_lane==true AND declared_occupants>=3 AND Vehicle.hov_capable==true"
        difference: "net_toll_cents forced to 0 regardless of gross"

  - name: fine_amount
    trigger: "TollEvent transition PENDING → VIOLATED; also re-evaluated on Fine OVERDUE auto-transition (late penalty)"
    algorithm: threshold
    formula: |
      # Toll component: best-estimate net_toll_cents had it billed normally (using PLATE variant)
      toll_component = compute_toll_pricing_as_plate_variant(toll_event)  # uses the same formula as `toll_pricing` PLATE variant

      # Civil penalty floor + compounding by reason_code
      base_penalty = {
          UNREAD_TRANSPONDER_NO_PLATE: 5000,
          INSUFFICIENT_FUNDS_ON_PLATE_BILL: 2500,
          BLOCKED_VEHICLE: 7500,
          HOV_FRAUD: 10000
      }[reason_code]

      civil_penalty_cents = base_penalty

      # On OVERDUE auto-transition, add LATE_PENALTY_CENTS
      if going_overdue:
          civil_penalty_cents += LATE_PENALTY_CENTS

      amount_cents = toll_component + civil_penalty_cents
    input_set: "TollEvent (for toll_component), reason_code, current Fine.civil_penalty_cents on OVERDUE re-evaluation"
    constants:
      LATE_PENALTY_CENTS: 2000
      BASE_PENALTY:
        UNREAD_TRANSPONDER_NO_PLATE: 5000
        INSUFFICIENT_FUNDS_ON_PLATE_BILL: 2500
        BLOCKED_VEHICLE: 7500
        HOV_FRAUD: 10000
    precision: "Integer cents. toll_component is computed by the toll_pricing PLATE variant (per-step rounding); civil_penalty_cents is an integer constant; sum is integer."
    variants:
      - name: initial_issuance
        when: "Violation creation"
        difference: "Uses base_penalty for the reason_code"
      - name: overdue_compounding
        when: "Fine.settlement_status PENDING → OVERDUE auto-transition (now >= due_at)"
        difference: "Adds LATE_PENALTY_CENTS to civil_penalty_cents and amount_cents"

  - name: account_outstanding_fines
    trigger: "Recomputed after any Fine state transition or any TollEvent → VIOLATED that creates/links a Fine"
    algorithm: aggregation
    formula: |
      Account.outstanding_fine_cents =
          SUM( Fine.amount_cents
               WHERE Fine.account_id == Account.id
                 AND Fine.settlement_status IN {PENDING, OVERDUE} )
      # DISPUTED, SETTLED, DISMISSED fines are excluded
    input_set: "All Fine rows tied to this Account (via Violation.account_id) with settlement_status IN {PENDING, OVERDUE}; DISPUTED counts as 0; tie-break: deterministic by Fine.created_at then Fine.id ascending — irrelevant since sum is commutative, but listing endpoints sort by this order"
    constants:
      SUSPEND_THRESHOLD_CENTS: 15000
    precision: "Integer cents (no rounding required)"
    variants: []

  - name: auto_reload_topup
    trigger: "Cascade from TollEvent PENDING → {POSTED, TOLL_BY_PLATE_INVOICED} side-effect chain — runs AFTER Account.balance_cents is decremented"
    algorithm: threshold
    formula: |
      if Account.auto_reload_enabled == true
         and Account.balance_cents <= Account.auto_reload_threshold_cents:
          create ReloadEvent(
              account_id = Account.id,
              kind = AUTO,
              amount_cents = Account.auto_reload_topup_cents,
              balance_before_cents = Account.balance_cents,
              triggered_by_event_id = TollEvent.id,
          )
          Account.balance_cents += Account.auto_reload_topup_cents
          balance_after_cents = Account.balance_cents
      # Boundary precision: condition is `<=` (inclusive). A balance equal to threshold triggers reload.
    input_set: "Account (auto_reload_enabled, auto_reload_threshold_cents, auto_reload_topup_cents, current balance_cents post-debit), TollEvent whose side-effect chain we are in"
    constants: {}
    precision: "Integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is authorized for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (Account, then Vehicle/Transponder/Fine/TollEvent)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-bound endpoints"

  - priority: 5
    category: business_referential
    check: "AccountHolder is operating on resources they own (X-User-ID == Account.id, or resource.account_id == Account.id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all AccountHolder-scoped endpoints"

  - priority: 6
    category: state
    check: "Account.status == ACTIVE for any mutating action (bind transponder, pay fine, ingest toll, register vehicle)"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "[POST /accounts/{id}/transponders/{tid}/bind, POST /accounts/{id}/vehicles, POST /toll-events with attribution to this account, POST /fines/{id}/pay]"

  - priority: 7
    category: state
    check: "Transponder.status correct for the transition (UNBOUND→bind, ACTIVE→unbind, UNBOUND→delete)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "[POST /accounts/{id}/transponders/{tid}/bind, POST /accounts/{id}/transponders/{tid}/unbind, DELETE /accounts/{id}/transponders/{tid}]"

  - priority: 8
    category: state
    check: "Fine.settlement_status correct for action (PENDING/OVERDUE→pay, PENDING→dispute, DISPUTED→uphold/reject)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "[POST /fines/{id}/pay, POST /fines/{id}/dispute, POST /fines/{id}/dispute/uphold, POST /fines/{id}/dispute/reject]"

  - priority: 9
    category: state
    check: "TollEvent.billing_status correct for void (POSTED, TOLL_BY_PLATE_INVOICED, VIOLATED only)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "[POST /toll-events/{id}/void]"

  - priority: 10
    category: business_safety
    check: "Vehicle.status == ACTIVE for any transponder bind or toll attribution that involves this vehicle (BLOCKED vehicles cannot be bound)"
    error_id: ERR_VEHICLE_BLOCKED
    http_status: 409
    applies_to: "[POST /accounts/{id}/transponders/{tid}/bind, POST /toll-events]"

  - priority: 11
    category: business_safety
    check: "HOV claim must satisfy hov_lane==true AND declared_occupants>=3 AND Vehicle.hov_capable==true; otherwise treated as HOV_FRAUD violation (not a 4xx — recorded)"
    error_id: ERR_HOV_FRAUD_RECORDED
    http_status: 409
    applies_to: "[POST /toll-events]"
    note: "When the gantry hov_lane==true and claim fails, return 409 with ERR_HOV_FRAUD_RECORDED AND record the Violation/Fine — the body's response_type is error but the side effects still occur on the persisted Violation/Fine. Idempotency: re-posting the same event hits ERR_DUPLICATE_TOLL_EVENT first."

  - priority: 12
    category: business_referential
    check: "InteropPolicy lookup must find at most one row for (home_agency, gantry_agency); if multiple, use newest by created_at"
    error_id: ERR_INTEROP_POLICY_AMBIGUOUS
    http_status: 422
    applies_to: "[POST /toll-events]"

  - priority: 13
    category: business_constraint
    check: "Transponder bind: only one ACTIVE Transponder per Vehicle"
    error_id: ERR_VEHICLE_ALREADY_BOUND
    http_status: 409
    applies_to: "[POST /accounts/{id}/transponders/{tid}/bind]"

  - priority: 14
    category: business_constraint
    check: "TollEvent deduplication — same (gantry_id, read_at truncated to minute, plate_number+plate_state OR transponder_serial) tuple in DB"
    error_id: ERR_DUPLICATE_TOLL_EVENT
    http_status: 409
    applies_to: "[POST /toll-events]"

  - priority: 15
    category: business_constraint
    check: "Fine.dispute_count < 2 to start a new dispute"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "[POST /fines/{id}/dispute]"

  - priority: 16
    category: business_temporal
    check: "TollEvent void must be within 24 hours of created_at"
    error_id: ERR_VOID_WINDOW_EXPIRED
    http_status: 409
    applies_to: "[POST /toll-events/{id}/void]"

  - priority: 17
    category: business_fiscal
    check: "Manual reload amount_cents must be 100..50000"
    error_id: ERR_INVALID_RELOAD_AMOUNT
    http_status: 422
    applies_to: "[POST /accounts/{id}/reloads]"

  - priority: 18
    category: business_fiscal
    check: "Account closure requires outstanding_fine_cents == 0 AND no active/suspended Transponder"
    error_id: ERR_ACCOUNT_HAS_OBLIGATIONS
    http_status: 409
    applies_to: "[DELETE /accounts/{id}]"

  - priority: 19
    category: business_fiscal
    check: "Plate-bill ingestion: matched Account.balance_cents - net_toll_cents must be >= 0 when auto_reload_enabled == false; else VIOLATED with INSUFFICIENT_FUNDS_ON_PLATE_BILL"
    error_id: ERR_INSUFFICIENT_FUNDS_ON_PLATE_BILL
    http_status: 409
    applies_to: "[POST /toll-events]"

  - priority: 20
    category: business_fiscal
    check: "Transponder serial must be globally unique; plate (plate_number, plate_state) must be unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "[POST /accounts/{id}/transponders, POST /accounts/{id}/vehicles]"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Accounts ----
  - method: POST
    path: "/accounts"
    description: "Create a new account"
    roles: [AgencyAdmin]
    code: 201
    input: ["holder_name", "home_agency_code", "auto_reload_enabled?", "auto_reload_threshold_cents?", "auto_reload_topup_cents?", "payment_method_token?"]
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{account_id}"
    description: "Retrieve account by id"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: PATCH
    path: "/accounts/{account_id}"
    description: "Update account settings (auto-reload, payment token); OCC via version"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: ["auto_reload_enabled?", "auto_reload_threshold_cents?", "auto_reload_topup_cents?", "payment_method_token?", "version"]
    output: Account
    side_effects: []

  - method: DELETE
    path: "/accounts/{account_id}"
    description: "Close account (requires zero outstanding fines and no active transponders)"
    roles: [AgencyAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["Cascade: Vehicles BLOCKED; preconditions enforced"]

  - method: GET
    path: "/accounts"
    description: "List accounts (paginated, filterable by home_agency_code, status)"
    roles: [AgencyAdmin]
    code: 200
    input: ["home_agency_code?", "status?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: GET
    path: "/accounts/{account_id}/summary"
    description: "Computed summary: balance, outstanding_fine_cents, vehicle/transponder counts"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  # ---- Vehicles ----
  - method: POST
    path: "/accounts/{account_id}/vehicles"
    description: "Register a vehicle on account"
    roles: [AccountHolder, AgencyAdmin]
    code: 201
    input: ["plate_number", "plate_state", "axle_count?", "hov_capable?"]
    output: Vehicle
    side_effects: ["vehicle_class computed from axle_count"]

  - method: GET
    path: "/accounts/{account_id}/vehicles/{vehicle_id}"
    description: "Retrieve a vehicle"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/accounts/{account_id}/vehicles"
    description: "List vehicles on account"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  # ---- Transponders ----
  - method: POST
    path: "/accounts/{account_id}/transponders"
    description: "Order/register a transponder"
    roles: [AccountHolder, AgencyAdmin]
    code: 201
    input: ["serial_number"]
    output: Transponder
    side_effects: ["Transponder.status := UNBOUND"]

  - method: POST
    path: "/accounts/{account_id}/transponders/{transponder_id}/bind"
    description: "Bind a transponder to one of the account's vehicles"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: ["vehicle_id"]
    output: Transponder
    side_effects: ["Transponder UNBOUND→ACTIVE; one-to-one bind"]

  - method: POST
    path: "/accounts/{account_id}/transponders/{transponder_id}/unbind"
    description: "Unbind a transponder from its current vehicle"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: []
    output: Transponder
    side_effects: ["Transponder ACTIVE→UNBOUND"]

  - method: DELETE
    path: "/accounts/{account_id}/transponders/{transponder_id}"
    description: "Return (decommission) an UNBOUND transponder"
    roles: [AccountHolder, AgencyAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["Transponder UNBOUND→RETURNED"]

  # ---- Reloads ----
  - method: POST
    path: "/accounts/{account_id}/reloads"
    description: "Manual reload (deposit funds)"
    roles: [AccountHolder, AgencyAdmin]
    code: 201
    input: ["amount_cents"]
    output: ReloadEvent
    side_effects: ["Account.balance_cents += amount_cents"]

  - method: GET
    path: "/accounts/{account_id}/reloads"
    description: "List reload history"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "ReloadEvent[]"
    side_effects: []

  # ---- Toll events ----
  - method: POST
    path: "/toll-events"
    description: "Ingest a single gantry toll event; computes attribution, pricing, and triggers downstream side effects"
    roles: [GantryOperator]
    code: 201
    input: ["gantry_id", "agency_code", "base_rate_cents", "read_at", "transponder_serial?", "plate_number?", "plate_state?", "declared_occupants?", "hov_lane?"]
    output: TollEvent
    side_effects: ["Attribute → price → debit balance → optional auto-reload → optional violation/fine creation → optional account suspension cascade"]

  - method: GET
    path: "/toll-events/{toll_event_id}"
    description: "Retrieve a toll event"
    roles: [AccountHolder, AgencyAdmin, GantryOperator]
    code: 200
    input: []
    output: TollEvent
    side_effects: []

  - method: GET
    path: "/toll-events"
    description: "List toll events (filterable by account_id, vehicle_id, billing_status, agency_code, capture_method)"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: ["account_id?", "vehicle_id?", "billing_status?", "agency_code?", "capture_method?", "limit?", "offset?"]
    output: "TollEvent[]"
    side_effects: []

  - method: POST
    path: "/toll-events/{toll_event_id}/void"
    description: "Operator void within 24h; refunds balance or dismisses fine"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: TollEvent
    side_effects: ["Refund or dismiss; cascade Violation.CLEARED and Fine.DISMISSED if applicable"]

  # ---- Fines ----
  - method: GET
    path: "/fines/{fine_id}"
    description: "Retrieve a fine"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: GET
    path: "/fines"
    description: "List fines (filterable by account_id, settlement_status)"
    roles: [AccountHolder, AgencyAdmin]
    code: 200
    input: ["account_id?", "settlement_status?", "limit?", "offset?"]
    output: "Fine[]"
    side_effects: []

  - method: POST
    path: "/fines/{fine_id}/pay"
    description: "Pay a fine (PENDING or OVERDUE)"
    roles: [AccountHolder]
    code: 200
    input: ["payment_method_token"]
    output: Fine
    side_effects: ["Fine→SETTLED; Violation→CLEARED; outstanding_fine_cents recompute; vehicle unblock if escalated"]

  - method: POST
    path: "/fines/{fine_id}/dispute"
    description: "Open dispute on a PENDING fine"
    roles: [AccountHolder]
    code: 200
    input: ["reason"]
    output: Fine
    side_effects: ["Fine PENDING→DISPUTED; outstanding recompute"]

  - method: POST
    path: "/fines/{fine_id}/dispute/uphold"
    description: "Adjudicator upholds dispute → Fine DISMISSED"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Fine
    side_effects: ["Fine DISPUTED→DISMISSED; Violation→CLEARED"]

  - method: POST
    path: "/fines/{fine_id}/dispute/reject"
    description: "Adjudicator rejects dispute → Fine PENDING"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Fine
    side_effects: ["Fine DISPUTED→PENDING; outstanding recompute"]

  # ---- Interop policies ----
  - method: POST
    path: "/interop-policies"
    description: "Create a cross-agency policy row (surcharge/discount)"
    roles: [AgencyAdmin]
    code: 201
    input: ["home_agency", "gantry_agency", "surcharge_bps?", "discount_bps?"]
    output: InteropPolicy
    side_effects: []

  - method: GET
    path: "/interop-policies"
    description: "List interop policies"
    roles: [AgencyAdmin, GantryOperator]
    code: 200
    input: ["home_agency?", "gantry_agency?", "limit?", "offset?"]
    output: "InteropPolicy[]"
    side_effects: []

  # ---- System / test-driving endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance system clock — needed for Fine OVERDUE auto-transition reachability"
    roles: [AgencyAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "object"
    side_effects: ["Triggers Fine.PENDING→OVERDUE auto-sweep; cascades to outstanding_fine_cents and Account.status"]

  - method: POST
    path: "/_sweep/run"
    description: "Manually run the OVERDUE sweep without advancing the clock — needed for deterministic test ordering"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: "object"
    side_effects: ["Same as clock-advance sweep, but uses current now()"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-ID or X-User-Role header missing"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for endpoint, or AccountHolder operating on another's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource not found"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Transponder serial or (plate_number, plate_state) already registered"
  - id: ERR_VEHICLE_ALREADY_BOUND
    http: 409
    condition: "Vehicle already has an ACTIVE Transponder bound"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in valid state for operation (Fine, Transponder, TollEvent)"
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "Account.status != ACTIVE for an operation that requires it"
  - id: ERR_VEHICLE_BLOCKED
    http: 409
    condition: "Vehicle.status == BLOCKED for operation requiring ACTIVE"
  - id: ERR_INSUFFICIENT_FUNDS_ON_PLATE_BILL
    http: 409
    condition: "Plate-billed event without auto-reload would push balance below zero — recorded as Violation"
  - id: ERR_HOV_FRAUD_RECORDED
    http: 409
    condition: "HOV claim invalid (occupants < 3 or vehicle not hov_capable) — Violation and Fine recorded"
  - id: ERR_DUPLICATE_TOLL_EVENT
    http: 409
    condition: "TollEvent already exists for (gantry_id, read_at-minute, plate/transponder)"
  - id: ERR_VOID_WINDOW_EXPIRED
    http: 409
    condition: "Void requested after 24h window"
  - id: ERR_DISPUTE_LIMIT_REACHED
    http: 409
    condition: "Fine.dispute_count >= 2; cannot open a third dispute"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: request.version != current Account.version"
  - id: ERR_RELOAD_ALREADY_RUNNING
    http: 409
    condition: "Concurrent auto-reload already credited the account this minute"
  - id: ERR_INTEROP_POLICY_AMBIGUOUS
    http: 422
    condition: "More than one InteropPolicy row matched (home, gantry); resolution rule applied but reported"
  - id: ERR_INVALID_RELOAD_AMOUNT
    http: 422
    condition: "Manual reload amount outside [100, 50000]"
  - id: ERR_ACCOUNT_HAS_OBLIGATIONS
    http: 409
    condition: "Account close blocked by outstanding fines or active/suspended transponder"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic field-level validation failure (type, range, enum)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountHolder
    description: "End user who owns one Account; manages vehicles, transponders, reloads, pays/disputes fines on their own account."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /fines/{fine_id}/pay"
      - "POST /fines/{fine_id}/dispute"
    shared_operations:
      - "GET /accounts/{account_id}"
      - "PATCH /accounts/{account_id}"
      - "GET /accounts/{account_id}/summary"
      - "POST /accounts/{account_id}/vehicles"
      - "GET /accounts/{account_id}/vehicles/{vehicle_id}"
      - "GET /accounts/{account_id}/vehicles"
      - "POST /accounts/{account_id}/transponders"
      - "POST /accounts/{account_id}/transponders/{transponder_id}/bind"
      - "POST /accounts/{account_id}/transponders/{transponder_id}/unbind"
      - "DELETE /accounts/{account_id}/transponders/{transponder_id}"
      - "POST /accounts/{account_id}/reloads"
      - "GET /accounts/{account_id}/reloads"
      - "GET /toll-events/{toll_event_id}"
      - "GET /toll-events"
      - "GET /fines/{fine_id}"
      - "GET /fines"

  - name: AgencyAdmin
    description: "Tolling agency operator; can manage any account, run voids, adjudicate disputes, manage interop policies, advance system clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "DELETE /accounts/{account_id}"
      - "GET /accounts"
      - "POST /toll-events/{toll_event_id}/void"
      - "POST /fines/{fine_id}/dispute/uphold"
      - "POST /fines/{fine_id}/dispute/reject"
      - "POST /interop-policies"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations:
      - "GET /accounts/{account_id}"
      - "PATCH /accounts/{account_id}"
      - "GET /accounts/{account_id}/summary"
      - "POST /accounts/{account_id}/vehicles"
      - "GET /accounts/{account_id}/vehicles/{vehicle_id}"
      - "GET /accounts/{account_id}/vehicles"
      - "POST /accounts/{account_id}/transponders"
      - "POST /accounts/{account_id}/transponders/{transponder_id}/bind"
      - "POST /accounts/{account_id}/transponders/{transponder_id}/unbind"
      - "DELETE /accounts/{account_id}/transponders/{transponder_id}"
      - "POST /accounts/{account_id}/reloads"
      - "GET /accounts/{account_id}/reloads"
      - "GET /toll-events/{toll_event_id}"
      - "GET /toll-events"
      - "GET /fines/{fine_id}"
      - "GET /fines"
      - "GET /interop-policies"

  - name: GantryOperator
    description: "Gantry / camera operator service that posts raw toll events; cannot view account or fine details beyond what posting requires."
    identity: "opaque"
    exclusive_operations:
      - "POST /toll-events"
    shared_operations:
      - "GET /toll-events/{toll_event_id}"
      - "GET /interop-policies"
