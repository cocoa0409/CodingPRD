            - "CommunityImpactAssessment.${ia3_id}: impact_score == 34, impact_tier == LOW (exactly one point below TIER_MODERATE_MIN 35), notice_required_days == 90, requires_public_comment == false"
            - "all three rows carry market_saturation_tier_at_assessment == SATURATED and senior component 2 (floor(1600 / 800)) and access relief 15 and transit relief 3"
