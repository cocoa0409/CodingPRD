          - errors.ERR_EXCURSION_STATE_INVALID
          - calculations.cold_chain_exposure
        distinguishing_aspect: |
          RELEASE carries a second precondition beyond status == OPEN: severity must be MINOR
          or MAJOR. A 240-minute exposure lands in CRITICAL, so releasing the product is
          refused while DISPOSE on the very same excursion succeeds -- the status check alone
          would let contaminated product back into the case.
