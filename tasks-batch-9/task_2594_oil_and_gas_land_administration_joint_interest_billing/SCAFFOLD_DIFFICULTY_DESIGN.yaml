      - name: segregation_of_duties_beats_terminal_state_on_resolution
        grounds:
          - validations[priority=45, error_id=ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=49, error_id=ERR_TERMINAL_STATE]
          - state_machines.BillingDispute.OPERATOR_RESPONDED_to_RESOLVED_UPHELD
          - roles.AuditReviewer
          - endpoints.POST_/land-admin/disputes/{dispute_id}/resolution
        conflicting_pair:
          higher: { priority: 45, category: business_safety, error_id: ERR_SEGREGATION_OF_DUTIES, http: 403 }
          lower: { priority: 49, category: state, error_id: ERR_TERMINAL_STATE, http: 409 }
        distinguishing_aspect: |
          A third, different pair: a safety rule above the generic terminal-state guard. The dispute has
          already been resolved UPHELD by u-audit-1, so it is terminal, and the second attempt is made
          by u-jib-1 - the very user that prepared the disputed statement. The 403 safety answer at 45
          outranks the 409 terminal answer at 49 and also the 409 ERR_DISPUTE_NOT_RESOLVABLE at 50, so
          the caller learns it is the wrong person before it learns the work is already done. Leaking
          the state first would tell an interested preparer that the dispute is closed.
