  - method: POST
    path: "/nabs/tasting-seats/{id}/confirm"
    description: "Confirm reserved seat"
    roles: [Member, ShopStaff]
    code: 200
    input: []
    output: TastingSeat
    side_effects: []
  - method: POST
    path: "/nabs/tasting-seats/{id}/cancel"
    description: "Cancel seat"
    roles: [Member, ShopStaff]
    code: 200
    input: []
    output: TastingSeat
    side_effects: ["TastingEvent.seats_booked -= 1; if was CONFIRMED, wallet refund"]
  - method: POST
    path: "/nabs/tasting-seats/{id}/check-in"
    description: "Check in attendee"
    roles: [ShopStaff]
    code: 200
    input: []
    output: TastingSeat
    side_effects: ["loyalty_points_awarded computed; Member.loyalty balances updated"]
  - method: POST
    path: "/nabs/tasting-seats/{id}/refund"
    description: "Refund a cancelled seat"
    roles: [ShopStaff]
    code: 200
    input: []
