    side_effects: ["CASCADE: uw_status BOUND -> CANCELLED, then every COMMITTED CatReservation -> RELEASED, then every touched pool recomputes committed_cents / available_cents and bumps its version by 1", "reverses the whole premium ledger flat and zeroes every premium field", "rescinds every APPROVED or SUSPENDED Endorsement with premium_cents = 0", "cancels every SCHEDULED Inspection of the policy", "increments FarmPolicy.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FARM_POLICY_NOT_FOUND, ERR_STALE_POLICY_VERSION, ERR_POLICY_NOT_BOUND, ERR_POLICY_TERMINAL]

