              as: ProgramAdmin
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /api/referrals"
              payload: { family_id: "${fam_id}", hospital_id: "${hosp2_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"

      - name: volunteer_coordinator_cannot_verify_referral
        claim_type: role_denial
        grounds: [roles.VolunteerCoordinator, 'endpoints.POST_/api/referrals/{id}/verify', errors.ERR_FORBIDDEN]
        distinguishing_aspect: "Peer-role isolation: VolunteerCoordinator has no referral authority and gets ERR_FORBIDDEN on verify."
        test_recipe:
          setup:
            - "Hospital, family, PENDING referral."
          setup_api_calls:
