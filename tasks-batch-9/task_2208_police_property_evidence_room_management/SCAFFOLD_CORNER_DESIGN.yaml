  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: retention_determination_with_stale_item_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[retention-determination-create-stale-item]"
          - "endpoints[POST /retention-determinations]"
          - "errors[ERR_STALE_EVIDENCE_ITEM_VERSION]"
        test_recipe:
          setup:
            - "Base fixture; an item is logged into case 26-00001 and the client records the version it saw at intake."
            - "A storage assignment then advances the item's version behind the client's back."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item read before assignment", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, stale_v: $.data.version }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { fresh_v: $.data.version }
          trigger:
            - call: "POST /retention-determinations"
              payload: { evidence_item_id: "${item_id}", basis: "PRELIMINARY", expected_evidence_item_version: "${stale_v}" }
              as: PropertyRoomManager
              captures: { err: $.data.error_id }
            - call: "POST /retention-determinations"
              payload: { evidence_item_id: "${item_id}", basis: "PRELIMINARY", expected_evidence_item_version: "${fresh_v}" }
              as: PropertyRoomManager
              captures: { det_id: $.data.id }
          assert:
            - "${stale_v} == 1 and ${fresh_v} == 2 — the storage assignment counts as a write to the item"
            - "The stale create responds 412 with ${err} == 'ERR_STALE_EVIDENCE_ITEM_VERSION' and no RetentionDetermination row is added"
            - "The replay with ${fresh_v} responds 201: ${det_id} exists, the intake determination is now superseded == true, and the item's version advances to 3"
            - "OCC is required here precisely because the operation is otherwise repeatable — a second determination on unchanged state would legitimately supersede the first"

      - name: audit_session_with_stale_location_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[audit-session-create-stale-location]"
          - "endpoints[POST /audit-sessions]"
          - "errors[ERR_STALE_STORAGE_LOCATION_VERSION]"
        test_recipe:
          setup:
            - "Base fixture; the auditor reads G-01 at creation time and records its version, then a technician stores an item in that bin."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_aud
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item stored after the auditor's read", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "GET /storage-locations/${loc_g_id}"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { fresh_loc_v: $.data.version }
          trigger:
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${loc_g_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { err: $.data.error_id }
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_g_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T17:00:00Z", expected_storage_location_version: "${fresh_loc_v}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
          assert:
            - "${loc_g_v} == 1 and ${fresh_loc_v} == 2: the storage assignment incremented the location's version, invalidating the auditor's inventory snapshot"
            - "The stale schedule responds 412 with ${err} == 'ERR_STALE_STORAGE_LOCATION_VERSION' and GET /audit-sessions?storage_location_id=${loc_g_id} returns total_count == 0"
            - "The replay with ${fresh_loc_v} responds 201 with ${sess_id} in status 'SCHEDULED', and the successful create itself pushes the location to version 3"
            - "Because scheduling bumps the version, a second session cannot be scheduled with ${fresh_loc_v} either — the client must re-read between every schedule"

      - name: version_increments_on_every_write_to_evidence_item
        claim_type: optimistic_concurrency
        grounds:
          - "entities.EvidenceItem.fields.version"
          - "endpoints[POST /evidence-items/{itemId}/storage-assignment]"
          - "endpoints[POST /cases/{caseId}/adjudicate]"
        test_recipe:
          setup:
            - "Base fixture; one item is logged into case 26-00001 (statute TH-3) and stored in G-01, then the case is charged and adjudicated at 2026-08-05."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_loc_g
            - *c_tech
            - *c_inv
            - *c_case1
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item whose version we track", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, v_after_intake: $.data.version }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { v_after_store: $.data.version }
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case1_id}/adjudicate"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "GET /evidence-items/${item_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { v_after_cascade: $.data.version }
          assert:
            - "${v_after_intake} == 1, ${v_after_store} == 2 and ${v_after_cascade} == 3"
            - "The third increment comes from a write the client never issued against the item: the case-level adjudication cascade rewrote retention_release_at and retention_basis"
            - "A read does not bump the version: a second GET /evidence-items/${item_id} still reports 3"
            - "POST /cases/${case1_id}/charge does not touch the item's version — only writes that change item fields do"

      - name: derived_field_reconciliation_disposal_eligible_count_after_reject
        claim_type: derived_field_reconciliation
        grounds:
          - "entities.PropertyRoom.fields.disposal_eligible_count"
          - "state_machines.DispositionOrder.PENDING_COURT_AUTH_to_REJECTED"
          - "state_machines.EvidenceItem.ORDER_PENDING_to_RETAINED"
          - "endpoints[POST /property-rooms/{roomId}/daily-sweep]"
        test_recipe:
          setup:
            - "Base fixture; a FIREARM item of case 26-00002 (statute AB-1, 0 statutory days so retention matures at intake) is stored in the vault V-01, the case is charged and adjudicated at 2026-10-30, and the adjudication cascade makes the item DISPOSAL_ELIGIBLE."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_ab1
            - *c_loc_v
            - *c_tech
            - *c_inv
            - *c_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Firearm in the eligibility ledger", category: "FIREARM", packaging_type: "RIGID_BOX", appraised_value_cents: 45000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { count_after_adjudicate: $.data.disposal_eligible_count }
          trigger:
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "DESTRUCTION", requested_by_custodian_id: "${tech_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { order_id: $.data.id }
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { count_after_order: $.data.disposal_eligible_count }
            - call: "POST /disposition-orders/${order_id}/reject"
              payload: { reason: "Forfeiture petition still pending" }
              as: CourtClerk
            - call: "GET /property-rooms/${room_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { count_after_reject: $.data.disposal_eligible_count }
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
              captures: { count_after_sweep: $.data.disposal_eligible_count }
          assert:
            - "${count_after_adjudicate} == 1 — the derived counter is populated by the cascade, not by any direct write to the room"
            - "${count_after_order} == 0: raising the order moved the item to ORDER_PENDING, which is outside the counted set {DISPOSAL_ELIGIBLE, UNCLAIMED_ELIGIBLE}"
            - "${count_after_reject} == 0 even though the item is STORED again with retention_release_at in the past — rejection returns it to RETAINED, and RETAINED is not counted"
            - "${count_after_sweep} == 1: only the sweep re-derives eligibility, so the counter and the item's disposition_state agree at every step and the round trip is loss-free"
            - "Case.undisposed_item_count stays 1 throughout, because nothing was ever disposed"

      - name: reconcile_cascade_chain_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: audit_reconcile_missing_cascades_to_transfer_denial
          rationale: "The §1.8 instance already walks the full four-level chain from reconcile to MISSING discrepancies, item state, room posture and the denial of pending transfers, including its ordering sensitivity."

      - name: proceeds_variants_both_computed_and_delta_checked
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: auction_estimated_vs_settled_proceeds_diverge
          rationale: "The §1.8 instance already computes the ESTIMATED and SETTLED proceeds variants on the same order and asserts the exact delta when the lifecycle switches variants."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: intake_response_reflects_all_cascaded_state_immediately
        claim_type: immediate
        grounds:
          - "endpoints[POST /evidence-items]"
          - "entities.EvidenceItem.fields.retention_release_at"
          - "entities.EvidenceItem.fields.barcode"
          - "endpoints[GET /chain-events]"
        test_recipe:
          setup:
            - "Base fixture; case 26-00001 uses statute TH-3 (365 statutory days) and the clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_room
            - *c_stat_th3
            - *c_tech
            - *c_aud
            - *c_case1
          trigger:
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Item whose cascade must be visible at once", category: "GENERAL", packaging_type: "PAPER_BAG", appraised_value_cents: 100, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, barcode: $.data.barcode, release_at: $.data.retention_release_at, basis: $.data.retention_basis }
            - call: "GET /cases/${case1_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { case_items: $.data.item_count }
            - call: "GET /chain-events?evidence_item_id=${item_id}"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { first_event: "$.data[0].event_type" }
          assert:
            - "The creating response already carries every cascaded value: ${barcode} == 'CPD-26-00001-0001-2', ${basis} == 'PRELIMINARY' and ${release_at} == '2027-08-01T00:00:00.000Z' — no second read is needed to see the retention the intake cascade derived"
            - "custody_state == 'LOGGED', disposition_state == 'RETAINED', item_sequence == 1 and version == 1 are all present in that same response body"
            - "${case_items} == 1 in the immediately following read: the parent counter is not deferred to a sweep"
            - "${first_event} == 'INTAKE' with sequence_no == 1, so the chain-of-custody record is queryable in the request right after intake"

      - name: adjudication_cascade_visible_in_the_same_response
        claim_type: immediate
        excluded_because:
          difficulty_instance: case_adjudicate_cascades_to_disposal_eligibility_counter
          rationale: "The §1.8 cascade instance already asserts that the adjudicate response and the reads issued immediately after it show the rewritten retention, the new item states and the recomputed room counters with no lag."
