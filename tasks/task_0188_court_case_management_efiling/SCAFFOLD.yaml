# =============================================================================
# Scaffold: Court Case Management & e-Filing (task_0188) — Expert difficulty
# =============================================================================

scenario: "Court Case Management & e-Filing: civil docket/case number, filing/service of process, deadline/statute calendaring, motion/order tracking, fee waiver, hearing scheduling, judgment entry, appeal transmittal"

domain_name: court-case-management-efiling
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions

  entity_topology: flat
  # Case is the central business entity; Party, Filing, ServiceOfProcess,
  # Deadline, Motion, Order, FeeWaiver, Hearing, Judgment, Appeal are peer
  # entities that reference their owners by foreign key (no deep URL nesting).
  # Court is a configuration entity. Reverse reachability is provided by
  # filtered-list GETs (e.g. GET /motions?case_id=...).

  state_machine_shape: branching
  # Filing: clerk review fork (ACCEPTED vs REJECTED→resubmit cycle).
  # Motion: ruling fork (GRANTED vs DENIED vs GRANTED_IN_PART) each with a
  #   different Order side-effect set.
  # FeeWaiver: review with revision loop (PENDING→NEEDS_INFO→PENDING).
  # Case posture is a compound derived field gating child operations.

  relationship_patterns:
    - one_to_many        # Case has many Filings, Parties, Motions, Deadlines, Hearings
    - cross_aggregate    # Order references Motion; ServiceOfProcess references Party; Appeal references Judgment
    - self_referential   # Deadline.parent_deadline_id chains a statutory deadline to the event that anchors it

  role_model: peer_roles
  # Clerk owns docketing / filing acceptance / fee-waiver decisions / appeal transmittal.
  # Judge owns motion rulings, hearing scheduling, judgment entry.
  # Attorney (entity_backed:Party) submits filings/motions/fee-waivers for parties they represent.
  # SystemAdmin (opaque) configures courts and drives the clock.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Court
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Court name (e.g. 'Superior Court of CA, County of X')" }
      - { name: jurisdiction_code, type: string, source: input, description: "Two-letter jurisdiction code, e.g. CA, NY" }
      - { name: filing_fee_cents, type: integer, source: input, description: "Standard civil complaint filing fee in cents", constraints: ">= 0" }
      - { name: business_days_only, type: boolean, source: input, description: "If true, deadline/statute calendaring rolls dates forward over weekends and holidays", default: true }
      - { name: holidays, type: array, source: input, description: "Array of ISO-8601 date strings (YYYY-MM-DD) that are court holidays", default: "[]" }
      - { name: appeal_window_days, type: integer, source: input, description: "Calendar days after judgment entry within which an appeal may be filed", default: 30 }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id" }
      - { name: case_number, type: string, source: computed, description: "Server-minted civil docket number, format '<jurisdiction_code>-<YYYY>-CV-<seq6>', seq6 is a zero-padded per-court-per-year counter starting at 000001" }
      - { name: caption, type: string, source: input, description: "Case caption / title" }
      - { name: case_type, type: enum, source: input, description: "CONTRACT | TORT | PROPERTY | FAMILY", constraints: "one of the four" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | STAYED | JUDGMENT_ENTERED | ON_APPEAL | CLOSED" }
      - { name: posture, type: enum, source: computed, description: "ACTIVE | RESTRICTED | FROZEN — derived; gates child operations. See calculations.case_posture" }
      - { name: open_deadline_count, type: integer, source: computed, description: "Count of Deadline rows under this case in status PENDING" }
      - { name: total_fees_assessed_cents, type: integer, source: computed, description: "Sum of fee_cents over Filings under this case in status ACCEPTED whose fee_status is ASSESSED or PAID" }
      - { name: total_fees_paid_cents, type: integer, source: computed, description: "Sum of fee_cents over Filings under this case whose fee_status is PAID or WAIVED" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: display_name, type: string, source: input, description: "Party legal name" }
      - { name: role, type: enum, source: input, description: "PLAINTIFF | DEFENDANT", constraints: "one of the two" }
      - { name: attorney_user_id, type: string, source: input, description: "Opaque attorney user id who represents this party; equals X-User-ID for Attorney-role actions on this party's filings/motions" }
      - { name: service_status, type: enum, source: system, description: "UNSERVED | SERVED | SERVICE_FAILED — only meaningful for DEFENDANT parties" }
      - { name: served_at, type: datetime, source: system, description: "Timestamp service was completed (set when service_status -> SERVED)" }

  - name: Filing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: filed_by_party_id, type: string, source: input, description: "FK -> Party.id; the party who e-filed this document" }
      - { name: document_type, type: enum, source: input, description: "COMPLAINT | ANSWER | MOTION | EXHIBIT | PROOF_OF_SERVICE", constraints: "one of the five" }
      - { name: title, type: string, source: input, description: "Filing title" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | ACCEPTED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Clerk-supplied reason set when status -> REJECTED; null otherwise" }
      - { name: fee_cents, type: integer, source: computed, description: "Filing fee charged: Court.filing_fee_cents for a COMPLAINT, else 0" }
      - { name: fee_status, type: enum, source: system, description: "NONE | ASSESSED | PAID | WAIVED — NONE when fee_cents==0" }
      - { name: resubmits_filing_id, type: string, source: input, description: "FK -> Filing.id; set when this filing resubmits a previously REJECTED filing, null otherwise" }
      - { name: accepted_at, type: datetime, source: system, description: "Timestamp the filing was ACCEPTED (drives deadline anchoring); null until accepted" }

  - name: ServiceOfProcess
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: filing_id, type: string, source: input, description: "FK -> Filing.id; the COMPLAINT filing whose service this records" }
      - { name: served_party_id, type: string, source: input, description: "FK -> Party.id; the DEFENDANT being served" }
      - { name: method, type: enum, source: input, description: "PERSONAL | MAIL | PUBLICATION", constraints: "one of the three" }
      - { name: status, type: enum, source: system, description: "ATTEMPTED | COMPLETED | FAILED" }
      - { name: service_date, type: datetime, source: input, description: "Date/time service was attempted/completed (ISO-8601)" }
      - { name: response_due_deadline_id, type: string, source: system, description: "FK -> Deadline.id; the responsive-pleading deadline created when service COMPLETED, null otherwise" }

  - name: Deadline
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: deadline_type, type: enum, source: input, description: "RESPONSE | DISCOVERY | MOTION_HEARING | STATUTE_OF_LIMITATIONS | APPEAL", constraints: "one of the five" }
      - { name: anchor_event, type: enum, source: input, description: "SERVICE_COMPLETED | FILING_ACCEPTED | JUDGMENT_ENTERED | CASE_OPENED | MANUAL — the event that starts the count" }
      - { name: anchor_date, type: datetime, source: input, description: "The date the anchor event occurred; the count starts the day after this date" }
      - { name: interval_days, type: integer, source: input, description: "Number of days to add to anchor_date", constraints: ">= 0" }
      - { name: counting_mode, type: enum, source: input, description: "CALENDAR | COURT_DAYS — chooses the calendaring variant. See calculations.due_date_calc" }
      - { name: due_date, type: datetime, source: computed, description: "Computed due date (date at 23:59:59.000Z). See calculations.due_date_calc" }
      - { name: status, type: enum, source: system, description: "PENDING | SATISFIED | MISSED | VACATED" }
      - { name: parent_deadline_id, type: string, source: input, description: "FK -> Deadline.id; optional self-reference linking a derived deadline (e.g. APPEAL window) to the deadline/event that anchors it, null otherwise" }
      - { name: satisfied_by_filing_id, type: string, source: system, description: "FK -> Filing.id; the filing whose acceptance satisfied this deadline, null otherwise" }

  - name: Motion
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: filing_id, type: string, source: input, description: "FK -> Filing.id; the accepted MOTION-type filing that introduced this motion" }
      - { name: moving_party_id, type: string, source: input, description: "FK -> Party.id; the party that brought the motion" }
      - { name: motion_type, type: enum, source: input, description: "DISMISS | SUMMARY_JUDGMENT | CONTINUANCE | COMPEL_DISCOVERY", constraints: "one of the four" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_SUBMISSION | GRANTED | DENIED | GRANTED_IN_PART | WITHDRAWN" }
      - { name: opposed, type: boolean, source: input, description: "Whether the motion is opposed", default: false }
      - { name: hearing_id, type: string, source: system, description: "FK -> Hearing.id; the hearing scheduled to decide this motion, null until scheduled" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order entered when the motion is ruled on, null until ruled" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: motion_id, type: string, source: input, description: "FK -> Motion.id; the motion this order rules on" }
      - { name: disposition, type: enum, source: system, description: "GRANT | DENY | GRANT_IN_PART — mirrors the motion ruling that produced it" }
      - { name: text, type: string, source: input, description: "Order body text" }
      - { name: stays_case, type: boolean, source: input, description: "If true and disposition is GRANT/GRANT_IN_PART, the case transitions OPEN -> STAYED", default: false }
      - { name: entered_at, type: datetime, source: system, description: "Timestamp the order was entered" }

  - name: FeeWaiver
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: filing_id, type: string, source: input, description: "FK -> Filing.id; the filing whose fee this waiver request targets" }
      - { name: requesting_party_id, type: string, source: input, description: "FK -> Party.id; the party requesting the waiver" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Declared monthly household income in cents", constraints: ">= 0" }
      - { name: household_size, type: integer, source: input, description: "Number of people in the household", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "PENDING | NEEDS_INFO | APPROVED | DENIED" }
      - { name: eligibility_ratio, type: number, source: computed, description: "monthly_income_cents / poverty_threshold_for(household_size); < 1.25 => presumptively eligible. See calculations.fee_waiver_eligibility" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp the waiver was APPROVED or DENIED; null otherwise" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: motion_id, type: string, source: input, description: "FK -> Motion.id; the motion to be heard, null for a general case hearing" }
      - { name: courtroom, type: string, source: input, description: "Courtroom identifier; hearings in the same courtroom may not overlap" }
      - { name: judge_user_id, type: string, source: input, description: "Opaque judge user id presiding; a judge may not preside over two overlapping hearings" }
      - { name: start_at, type: datetime, source: input, description: "Hearing start (ISO-8601)" }
      - { name: end_at, type: datetime, source: input, description: "Hearing end (ISO-8601); must be after start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CONTINUED | CANCELLED" }

  - name: Judgment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: judgment_type, type: enum, source: input, description: "DEFAULT | SUMMARY | TRIAL | DISMISSAL", constraints: "one of the four" }
      - { name: prevailing_party_id, type: string, source: input, description: "FK -> Party.id; the prevailing party, null for DISMISSAL" }
      - { name: principal_cents, type: integer, source: input, description: "Principal award in cents", constraints: ">= 0", default: 0 }
      - { name: interest_rate_bps, type: integer, source: input, description: "Annual post-judgment interest rate in basis points", constraints: ">= 0", default: 0 }
      - { name: entered_at, type: datetime, source: system, description: "Timestamp judgment was entered (drives appeal window)" }
      - { name: total_with_interest_cents, type: integer, source: computed, description: "Principal plus accrued simple interest as of the current clock. See calculations.judgment_interest" }
      - { name: status, type: enum, source: system, description: "ENTERED | APPEALED | SATISFIED | VACATED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: judgment_id, type: string, source: input, description: "FK -> Judgment.id; the judgment being appealed" }
      - { name: appellant_party_id, type: string, source: input, description: "FK -> Party.id; the party filing the appeal" }
      - { name: filed_on, type: datetime, source: input, description: "Date the notice of appeal was filed (ISO-8601)" }
      - { name: status, type: enum, source: system, description: "NOTICE_FILED | RECORD_PREPARED | TRANSMITTED | DISMISSED" }
      - { name: record_page_count, type: integer, source: input, description: "Number of pages in the prepared record on appeal", constraints: ">= 0", default: 0 }
      - { name: transmittal_fee_cents, type: integer, source: computed, description: "Record transmittal fee. See calculations.appeal_transmittal_fee" }
      - { name: transmitted_at, type: datetime, source: system, description: "Timestamp the record was transmitted to the appellate court; null otherwise" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /cases/{id}/open"
        actor: Clerk
        preconditions:
          - "At least one PLAINTIFF Party and at least one DEFENDANT Party exist for the case (ERR_CASE_MISSING_PARTIES)"
          - "At least one ACCEPTED Filing with document_type COMPLAINT exists (ERR_NO_ACCEPTED_COMPLAINT)"
        side_effects:
          - "Create a Deadline (deadline_type=STATUTE_OF_LIMITATIONS, anchor_event=CASE_OPENED, status=PENDING) per court policy"
          - "Recompute Case.posture (calculations.case_posture)"
          - "increments Case.version by 1"
      - from: OPEN
        to: STAYED
        trigger: "system: Order entered with stays_case=true and disposition GRANT/GRANT_IN_PART"
        actor: system
        preconditions:
          - "Triggering Order exists and case.status == OPEN"
        side_effects:
          - "All Deadline rows under the case in status PENDING -> VACATED (cascade); each vacated Deadline decrements Case.open_deadline_count"
          - "Recompute Case.posture -> FROZEN while STAYED"
          - "increments Case.version by 1"
        note: "Cascade hop 1 of the stay chain: Case OPEN->STAYED vacates pending deadlines."
      - from: STAYED
        to: OPEN
        trigger: "POST /cases/{id}/lift-stay"
        actor: Judge
        preconditions:
          - "case.status == STAYED"
        side_effects:
          - "Recompute Case.posture"
          - "increments Case.version by 1"
      - from: OPEN
        to: JUDGMENT_ENTERED
        trigger: "system: POST /judgments creates a Judgment for the case"
        actor: system
        preconditions:
          - "No Motion under the case in status FILED or UNDER_SUBMISSION (ERR_PENDING_MOTIONS)"
          - "case.status == OPEN"
        side_effects:
          - "Create an APPEAL Deadline (anchor_event=JUDGMENT_ENTERED, interval_days=Court.appeal_window_days, counting_mode=CALENDAR)"
          - "Recompute Case.posture"
          - "increments Case.version by 1"
      - from: JUDGMENT_ENTERED
        to: ON_APPEAL
        trigger: "system: POST /appeals creates an Appeal for a judgment on the case"
        actor: system
        preconditions:
          - "case.status == JUDGMENT_ENTERED"
        side_effects:
          - "Judgment.status -> APPEALED (cascade)"
          - "Recompute Case.posture"
          - "increments Case.version by 1"
      - from: JUDGMENT_ENTERED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: Clerk
        preconditions:
          - "case.status == JUDGMENT_ENTERED"
          - "No Deadline under the case in status PENDING with deadline_type=APPEAL whose due_date >= current clock (ERR_APPEAL_WINDOW_OPEN)"
        side_effects:
          - "All Deadline rows under the case in status PENDING -> VACATED"
          - "increments Case.version by 1"
      - from: ON_APPEAL
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: Clerk
        preconditions:
          - "case.status == ON_APPEAL"
          - "Every Appeal on the case is in status TRANSMITTED or DISMISSED (ERR_APPEAL_NOT_TRANSMITTED)"
        side_effects:
          - "All Deadline rows under the case in status PENDING -> VACATED"
          - "increments Case.version by 1"

  - entity: Filing
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /filings/{id}/claim-review"
        actor: Clerk
        preconditions:
          - "filing.status == SUBMITTED"
        side_effects:
          - "increments Filing.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /filings/{id}/accept"
        actor: Clerk
        preconditions:
          - "filing.status == UNDER_REVIEW"
          - "Owning Case.posture != FROZEN (ERR_CASE_FROZEN)"
          - "If document_type==COMPLAINT and fee_cents>0: fee_status must be PAID or WAIVED (ERR_FILING_FEE_UNPAID)"
        side_effects:
          - "Set accepted_at = current clock"
          - "If document_type==COMPLAINT: set fee_status PAID->PAID / WAIVED->WAIVED (unchanged); recompute Case.total_fees_assessed_cents and Case.total_fees_paid_cents"
          - "If this filing has resubmits_filing_id and that filing satisfied a MISSED/PENDING Deadline mapping: that Deadline.status -> SATISFIED, satisfied_by_filing_id set (cascade)"
          - "increments Filing.version by 1; increments Case.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /filings/{id}/reject"
        actor: Clerk
        preconditions:
          - "filing.status == UNDER_REVIEW"
          - "rejection_reason provided (ERR_REJECTION_REASON_REQUIRED)"
        side_effects:
          - "Set rejection_reason; if fee_status==ASSESSED set fee_status->NONE and recompute Case fee aggregates"
          - "increments Filing.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /filings (new filing with resubmits_filing_id pointing at this REJECTED filing)"
        actor: Attorney
        preconditions:
          - "The referenced filing is REJECTED (ERR_RESUBMIT_TARGET_NOT_REJECTED)"
        side_effects:
          - "A NEW Filing row is created in SUBMITTED; the REJECTED filing remains REJECTED (terminal); they are linked by resubmits_filing_id"
        note: "Cyclic shape: REJECTED -> (new submission) -> SUBMITTED via a distinct row, modeling the resubmission loop."

  - entity: ServiceOfProcess
    initial_state: ATTEMPTED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: ATTEMPTED
        to: COMPLETED
        trigger: "POST /service-of-process/{id}/complete"
        actor: Clerk
        preconditions:
          - "service.status == ATTEMPTED"
          - "Owning Case.status == OPEN (ERR_CASE_NOT_OPEN)"
          - "served_party_id refers to a DEFENDANT Party with service_status != SERVED (ERR_PARTY_ALREADY_SERVED)"
        side_effects:
          - "served Party.service_status -> SERVED, served_at set (cascade hop 1)"
          - "Create a RESPONSE Deadline (anchor_event=SERVICE_COMPLETED, anchor_date=service_date, counting_mode=COURT_DAYS, interval_days=30) in PENDING; set response_due_deadline_id; this increments Case.open_deadline_count (cascade hop 2)"
          - "Recompute Case.posture (cascade hop 3: open_deadline_count change may flip RESTRICTED)"
          - "increments ServiceOfProcess.version by 1; increments Case.version by 1"
        note: "Depth-3 cascade: service complete -> party served + deadline created -> case posture recompute."
      - from: ATTEMPTED
        to: FAILED
        trigger: "POST /service-of-process/{id}/fail"
        actor: Clerk
        preconditions:
          - "service.status == ATTEMPTED"
        side_effects:
          - "served Party.service_status -> SERVICE_FAILED"
          - "increments ServiceOfProcess.version by 1"

  - entity: Deadline
    initial_state: PENDING
    terminal_states: [SATISFIED, MISSED, VACATED]
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: "system: a Filing satisfying this deadline is ACCEPTED, or POST /deadlines/{id}/satisfy"
        actor: Clerk
        preconditions:
          - "deadline.status == PENDING"
        side_effects:
          - "Set satisfied_by_filing_id when satisfied by a filing"
          - "decrement Case.open_deadline_count by 1; recompute Case.posture"
          - "increments Deadline.version by 1; increments Case.version by 1"
      - from: PENDING
        to: MISSED
        trigger: "POST /deadlines/{id}/mark-missed"
        actor: Clerk
        preconditions:
          - "deadline.status == PENDING"
          - "current clock > due_date (ERR_DEADLINE_NOT_YET_DUE)"
        side_effects:
          - "decrement Case.open_deadline_count by 1; recompute Case.posture (a MISSED RESPONSE deadline can push posture to RESTRICTED)"
          - "increments Deadline.version by 1; increments Case.version by 1"
      - from: PENDING
        to: VACATED
        trigger: "POST /deadlines/{id}/vacate, or system cascade on Case STAYED/CLOSED"
        actor: Judge
        preconditions:
          - "deadline.status == PENDING"
        side_effects:
          - "decrement Case.open_deadline_count by 1; recompute Case.posture"
          - "increments Deadline.version by 1; increments Case.version by 1"

  - entity: Motion
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, GRANTED_IN_PART, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_SUBMISSION
        trigger: "system: a Hearing for this motion transitions to HELD; or POST /motions/{id}/submit"
        actor: Judge
        preconditions:
          - "motion.status == FILED"
        side_effects:
          - "increments Motion.version by 1"
      - from: UNDER_SUBMISSION
        to: GRANTED
        trigger: "POST /motions/{id}/rule (ruling=GRANT)"
        actor: Judge
        preconditions:
          - "motion.status == UNDER_SUBMISSION"
          - "Owning Case.posture != FROZEN (ERR_CASE_FROZEN)"
        side_effects:
          - "Create an Order (disposition=GRANT) and set order_id (cascade hop 1)"
          - "If the created Order.stays_case==true: trigger Case OPEN->STAYED (cascade hop 2 -> deadline vacate hop 3)"
          - "increments Motion.version by 1; increments Case.version by 1"
        note: "Branch GRANT carries the stay cascade; DENY does not."
      - from: UNDER_SUBMISSION
        to: DENIED
        trigger: "POST /motions/{id}/rule (ruling=DENY)"
        actor: Judge
        preconditions:
          - "motion.status == UNDER_SUBMISSION"
          - "Owning Case.posture != FROZEN (ERR_CASE_FROZEN)"
        side_effects:
          - "Create an Order (disposition=DENY, stays_case forced false) and set order_id"
          - "increments Motion.version by 1; increments Case.version by 1"
        note: "Branch DENY: no stay, no deadline vacate."
      - from: UNDER_SUBMISSION
        to: GRANTED_IN_PART
        trigger: "POST /motions/{id}/rule (ruling=GRANT_IN_PART)"
        actor: Judge
        preconditions:
          - "motion.status == UNDER_SUBMISSION"
          - "Owning Case.posture != FROZEN (ERR_CASE_FROZEN)"
        side_effects:
          - "Create an Order (disposition=GRANT_IN_PART) and set order_id"
          - "If Order.stays_case==true: trigger Case OPEN->STAYED cascade"
          - "increments Motion.version by 1; increments Case.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /motions/{id}/withdraw"
        actor: Attorney
        preconditions:
          - "motion.status == FILED"
          - "Acting attorney_user_id == moving Party.attorney_user_id (ERR_NOT_MOVING_PARTY)"
        side_effects:
          - "If a Hearing is linked (hearing_id) and SCHEDULED -> Hearing CANCELLED (cascade)"
          - "increments Motion.version by 1"

  - entity: FeeWaiver
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: NEEDS_INFO
        trigger: "POST /fee-waivers/{id}/request-info"
        actor: Clerk
        preconditions:
          - "waiver.status == PENDING"
        side_effects:
          - "increments FeeWaiver.version by 1"
      - from: NEEDS_INFO
        to: PENDING
        trigger: "POST /fee-waivers/{id}/resubmit"
        actor: Attorney
        preconditions:
          - "waiver.status == NEEDS_INFO"
          - "Acting attorney_user_id == requesting Party.attorney_user_id (ERR_NOT_REQUESTING_PARTY)"
        side_effects:
          - "Optionally update monthly_income_cents / household_size; recompute eligibility_ratio (calculations.fee_waiver_eligibility)"
          - "increments FeeWaiver.version by 1"
        note: "Revision loop PENDING<->NEEDS_INFO (cyclic)."
      - from: PENDING
        to: APPROVED
        trigger: "POST /fee-waivers/{id}/approve"
        actor: Clerk
        preconditions:
          - "waiver.status == PENDING"
          - "Target Filing.fee_status == ASSESSED (ERR_FEE_NOT_ASSESSED)"
        side_effects:
          - "Target Filing.fee_status -> WAIVED (cascade hop 1)"
          - "Recompute Case.total_fees_paid_cents (cascade hop 2)"
          - "Set decided_at; increments FeeWaiver.version by 1; increments Filing.version by 1; increments Case.version by 1"
        note: "Depth-2 cascade: waiver approve -> filing fee WAIVED -> case fee aggregate recompute."
      - from: NEEDS_INFO
        to: APPROVED
        trigger: "POST /fee-waivers/{id}/approve"
        actor: Clerk
        preconditions:
          - "waiver.status == NEEDS_INFO"
          - "Target Filing.fee_status == ASSESSED (ERR_FEE_NOT_ASSESSED)"
        side_effects:
          - "Same as PENDING->APPROVED cascade"
      - from: PENDING
        to: DENIED
        trigger: "POST /fee-waivers/{id}/deny"
        actor: Clerk
        preconditions:
          - "waiver.status == PENDING"
        side_effects:
          - "Target Filing.fee_status stays ASSESSED; set decided_at; increments FeeWaiver.version by 1"
      - from: NEEDS_INFO
        to: DENIED
        trigger: "POST /fee-waivers/{id}/deny"
        actor: Clerk
        preconditions:
          - "waiver.status == NEEDS_INFO"
        side_effects:
          - "Set decided_at; increments FeeWaiver.version by 1"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/hold"
        actor: Judge
        preconditions:
          - "hearing.status == SCHEDULED"
          - "current clock >= start_at (ERR_HEARING_NOT_STARTED)"
        side_effects:
          - "If hearing has motion_id and that Motion.status==FILED: Motion FILED->UNDER_SUBMISSION (cascade)"
          - "increments Hearing.version by 1"
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /hearings/{id}/continue"
        actor: Judge
        preconditions:
          - "hearing.status == SCHEDULED"
          - "new_start_at and new_end_at provided and free of courtroom/judge overlap (ERR_HEARING_CONFLICT)"
        side_effects:
          - "A NEW Hearing row is created SCHEDULED at the new window; this hearing -> CONTINUED; linked motion_id carried to the new hearing"
          - "increments Hearing.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{id}/cancel, or system cascade on Motion WITHDRAWN"
        actor: Judge
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "If linked Motion.status==FILED it stays FILED (hearing detached)"
          - "increments Hearing.version by 1"

  - entity: Judgment
    initial_state: ENTERED
    terminal_states: [SATISFIED, VACATED]
    transitions:
      - from: ENTERED
        to: APPEALED
        trigger: "system: POST /appeals creates an Appeal referencing this judgment"
        actor: system
        preconditions:
          - "judgment.status == ENTERED"
        side_effects:
          - "Trigger Case JUDGMENT_ENTERED->ON_APPEAL (cascade)"
          - "increments Judgment.version by 1"
      - from: ENTERED
        to: SATISFIED
        trigger: "POST /judgments/{id}/satisfy"
        actor: Clerk
        preconditions:
          - "judgment.status == ENTERED"
        side_effects:
          - "increments Judgment.version by 1"
      - from: ENTERED
        to: VACATED
        trigger: "POST /judgments/{id}/vacate"
        actor: Judge
        preconditions:
          - "judgment.status == ENTERED"
          - "Case.status == JUDGMENT_ENTERED (cannot vacate once ON_APPEAL) (ERR_INVALID_STATE)"
        side_effects:
          - "Case JUDGMENT_ENTERED->OPEN (judgment reversed); APPEAL Deadline rows in PENDING -> VACATED (cascade)"
          - "increments Judgment.version by 1; increments Case.version by 1"

  - entity: Appeal
    initial_state: NOTICE_FILED
    terminal_states: [TRANSMITTED, DISMISSED]
    transitions:
      - from: NOTICE_FILED
        to: RECORD_PREPARED
        trigger: "POST /appeals/{id}/prepare-record"
        actor: Clerk
        preconditions:
          - "appeal.status == NOTICE_FILED"
          - "record_page_count > 0 (ERR_EMPTY_RECORD)"
        side_effects:
          - "Recompute transmittal_fee_cents (calculations.appeal_transmittal_fee)"
          - "increments Appeal.version by 1"
      - from: RECORD_PREPARED
        to: TRANSMITTED
        trigger: "POST /appeals/{id}/transmit"
        actor: Clerk
        preconditions:
          - "appeal.status == RECORD_PREPARED"
        side_effects:
          - "Set transmitted_at = current clock"
          - "increments Appeal.version by 1"
      - from: NOTICE_FILED
        to: DISMISSED
        trigger: "POST /appeals/{id}/dismiss"
        actor: Judge
        preconditions:
          - "appeal.status == NOTICE_FILED"
        side_effects:
          - "If no other non-terminal Appeal on the case: Judgment.status APPEALED->ENTERED and Case ON_APPEAL->JUDGMENT_ENTERED (cascade)"
          - "increments Appeal.version by 1"
      - from: RECORD_PREPARED
        to: DISMISSED
        trigger: "POST /appeals/{id}/dismiss"
        actor: Judge
        preconditions:
          - "appeal.status == RECORD_PREPARED"
        side_effects:
          - "Same cascade as NOTICE_FILED->DISMISSED"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: judgment-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /judgments"
    occ_field: "expected_case_version"
    description: |
      Entering a Judgment against a Case whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just ruled a final motion or recomputed posture (legitimately
      advancing the case toward JUDGMENT_ENTERED) and the current writer's view
      of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appeal-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /appeals"
    occ_field: "expected_case_version"
    description: |
      Filing a notice of Appeal against a Case whose version has advanced since
      the client last observed it is rejected. The new appeal legitimately
      supersedes the prior case view by driving the case to ON_APPEAL; a stale
      version means the writer did not see an intervening transition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: due_date_calc
    trigger: "Deadline creation (POST /deadlines or system-created RESPONSE/APPEAL/STATUTE deadlines)"
    algorithm: interval_merge
    formula: |
      base = date(anchor_date)            # the day the anchor event occurred
      if counting_mode == CALENDAR:
        # Variant A — pure calendar count: add interval_days calendar days,
        # starting the count the day AFTER anchor_date. If the resulting day
        # lands on a weekend or Court.holidays AND Court.business_days_only,
        # ROLL FORWARD to the next court day (the rolled day is NOT re-counted).
        d = base + interval_days days
        while business_days_only and (d is weekend or d in Court.holidays):
          d = d + 1 day
      else:   # counting_mode == COURT_DAYS
        # Variant B — court-day count: step forward one day at a time from the
        # day AFTER anchor_date, counting ONLY court days (skip weekends and
        # Court.holidays without consuming a step) until interval_days court
        # days have been counted. The final landing day is always a court day.
        d = base
        counted = 0
        while counted < interval_days:
          d = d + 1 day
          if not (business_days_only and (d is weekend or d in Court.holidays)):
            counted = counted + 1
      due_date = datetime(d, 23:59:59.000Z)
    input_set: "Single Deadline row plus its Court's business_days_only and holidays config"
    constants:
      WEEKEND_DOW: "SAT, SUN"
    precision: "Whole days; due_date pinned to 23:59:59.000Z of the landing day"
    variants:
      - name: calendar_count
        when: "counting_mode == CALENDAR"
        difference: "Adds the full interval in calendar days first, then rolls a weekend/holiday landing forward without re-counting."
      - name: court_day_count
        when: "counting_mode == COURT_DAYS"
        difference: "Counts only court days while stepping; weekends/holidays consume zero of the interval, so the same interval_days yields a later date than calendar_count."

  - name: judgment_interest
    trigger: "Read of Judgment.total_with_interest_cents (computed on every Judgment GET and on /judgments/{id}/payoff)"
    algorithm: aggregation
    formula: |
      # Simple post-judgment interest, accrued per calendar day from the day
      # AFTER entered_at through the current clock (inclusive of the current day).
      elapsed_days = max(0, floor((current_clock_date - date(entered_at)).days))
      daily_rate = interest_rate_bps / 10000 / 365
      interest_cents = round_half_up(principal_cents * daily_rate * elapsed_days)
      total_with_interest_cents = principal_cents + interest_cents
    input_set: "Single Judgment row; current clock supplied by the system clock"
    constants:
      BPS_DIVISOR: 10000
      DAYS_PER_YEAR: 365
    precision: "2 decimal places at cents granularity, round_half_up; interest computed once over the whole elapsed span (NOT day-by-day compounding)"
    variants:
      - name: simple_to_date
        when: "Judgment GET / payoff read"
        difference: "Interest is simple (principal only), computed over the full elapsed-day span in one multiplication — not compounded daily."

  - name: fee_waiver_eligibility
    trigger: "FeeWaiver creation and on /fee-waivers/{id}/resubmit"
    algorithm: threshold
    formula: |
      threshold_cents = POVERTY_BASE_CENTS + (household_size - 1) * POVERTY_PER_PERSON_CENTS
      eligibility_ratio = round_half_up(monthly_income_cents / threshold_cents, 4)
      # presumptively eligible when ratio < 1.25 (strictly less than)
      presumptively_eligible = (eligibility_ratio < 1.25)
    input_set: "Single FeeWaiver row (monthly_income_cents, household_size)"
    constants:
      POVERTY_BASE_CENTS: 130000
      POVERTY_PER_PERSON_CENTS: 47000
      ELIGIBILITY_CUTOFF: 1.25
    precision: "eligibility_ratio to 4 decimal places, round_half_up; cutoff is strict < 1.25"

  - name: appeal_transmittal_fee
    trigger: "Appeal NOTICE_FILED->RECORD_PREPARED transition"
    algorithm: tiered_pricing
    formula: |
      # Tiered per-page record fee with a flat base, marginal rates per tier.
      # Tier boundaries are on cumulative record_page_count.
      base = APPEAL_BASE_FEE_CENTS
      p = record_page_count
      tier1_pages = min(p, 100)                      # pages 1..100
      tier2_pages = min(max(p - 100, 0), 400)        # pages 101..500
      tier3_pages = max(p - 500, 0)                  # pages 501+
      per_page = tier1_pages*RATE1 + tier2_pages*RATE2 + tier3_pages*RATE3
      transmittal_fee_cents = base + per_page
    input_set: "Single Appeal row (record_page_count)"
    constants:
      APPEAL_BASE_FEE_CENTS: 5000
      RATE1: 50      # cents/page for pages 1-100
      RATE2: 30      # cents/page for pages 101-500
      RATE3: 15      # cents/page for pages 501+
    precision: "Integer cents; marginal (per-tier) rates, NOT a flat average rate"
    variants:
      - name: marginal_tiers
        when: "always"
        difference: "Each page is charged at its own tier's marginal rate; a 600-page record pays RATE1 on 100, RATE2 on 400, RATE3 on 100 — not 600*RATE_for_tier3."

  - name: case_posture
    trigger: "Recomputed on every transition that changes deadlines, motions, judgments, or case status"
    algorithm: aggregation
    formula: |
      if case.status in {STAYED}:
        posture = FROZEN
      elif (count of Deadline under case with status==MISSED) >= 1
           or (count of Deadline under case with status==PENDING) >= POSTURE_DEADLINE_LIMIT:
        posture = RESTRICTED
      else:
        posture = ACTIVE
      # FROZEN blocks Filing accept and Motion ruling.
      # RESTRICTED blocks new Motion filing (ERR_CASE_RESTRICTED) but allows
      # deadline-satisfying filings.
    input_set: "All Deadline rows under the case; case.status"
    constants:
      POSTURE_DEADLINE_LIMIT: 5
    precision: "Exact integer counts; PENDING threshold uses >= POSTURE_DEADLINE_LIMIT"

  - name: case_number_sequence
    trigger: "Case creation (POST /cases) when transitioning DRAFT (on open the number is finalized) — minted at create time"
    algorithm: chronological
    formula: |
      year = year_of(current_clock)
      seq = 1 + (count of Case rows with same court_id and same mint-year,
                 ordered by created_at ASC)   # per-court, per-year monotonic counter
      case_number = format("%s-%04d-CV-%06d", Court.jurisdiction_code, year, seq)
    input_set: "All prior Case rows for the same court in the same calendar year, ordered by created_at ASC"
    constants:
      SEQ_START: 1
    precision: "seq6 zero-padded to 6 digits; ordering by created_at ASC, ties broken by created_at then by insertion order (never by id)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of Clerk|Judge|Attorney|SystemAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body conforms: required fields present, enums valid, numbers non-negative, end_at > start_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"
  - priority: 5
    category: business_referential
    check: "FK targets belong to the same Case as the operation (e.g. Motion.moving_party_id is a Party of Motion.case_id; ServiceOfProcess.served_party_id is a DEFENDANT of the case)"
    error_id: ERR_CROSS_CASE_REFERENCE
    http_status: 422
    applies_to: "POST /motions, POST /service-of-process, POST /orders, POST /fee-waivers, POST /appeals, POST /hearings"
  - priority: 6
    category: state
    check: "Optimistic-concurrency: expected_case_version matches Case.version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /judgments, POST /appeals"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /{id}/<action> transition endpoints"
  - priority: 8
    category: business_safety
    check: "Case posture gate: FROZEN blocks filing acceptance and motion rulings; STAYED case rejects new substantive work"
    error_id: ERR_CASE_FROZEN
    http_status: 409
    applies_to: "POST /filings/{id}/accept, POST /motions/{id}/rule"
  - priority: 9
    category: business_safety
    check: "Case posture gate: RESTRICTED blocks new Motion filing"
    error_id: ERR_CASE_RESTRICTED
    http_status: 409
    applies_to: "POST /motions"
  - priority: 10
    category: business_temporal
    check: "Hearing window does not overlap an existing SCHEDULED hearing in the same courtroom, and does not overlap an existing SCHEDULED hearing for the same judge_user_id"
    error_id: ERR_HEARING_CONFLICT
    http_status: 409
    applies_to: "POST /hearings, POST /hearings/{id}/continue"
  - priority: 11
    category: business_temporal
    check: "STATUTE_OF_LIMITATIONS: a COMPLAINT filing cannot be accepted after the case's STATUTE_OF_LIMITATIONS deadline due_date has passed"
    error_id: ERR_STATUTE_EXPIRED
    http_status: 409
    applies_to: "POST /filings/{id}/accept"
  - priority: 12
    category: business_fiscal
    check: "A COMPLAINT filing with fee_cents>0 cannot be ACCEPTED while fee_status is ASSESSED (must be PAID or WAIVED first)"
    error_id: ERR_FILING_FEE_UNPAID
    http_status: 409
    applies_to: "POST /filings/{id}/accept"
  - priority: 13
    category: business_constraint
    check: "Appeal filed_on must be within Court.appeal_window_days of the judgment entered_at (inclusive); otherwise the appeal window has closed"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appeals"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Court (config) ----
  - method: POST
    path: "/courts"
    description: "Create a court (configuration)"
    roles: [SystemAdmin]
    code: 201
    input: [name, jurisdiction_code, filing_fee_cents, "business_days_only?", "holidays?", "appeal_window_days?"]
    output: Court
    side_effects: []
  - method: GET
    path: "/courts/{id}"
    description: "Get a court"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Court
    side_effects: []

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock used for due_date_calc, judgment_interest, deadline due checks, and appeal-window checks"
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All subsequent time-relative computations use this clock"]

  # ---- Case ----
  - method: POST
    path: "/cases"
    description: "Create a case (DRAFT); mints case_number"
    roles: [Clerk]
    code: 201
    input: [court_id, caption, case_type]
    output: Case
    side_effects: ["status=DRAFT", "posture=ACTIVE", "case_number minted (calculations.case_number_sequence)"]
  - method: GET
    path: "/cases/{id}"
    description: "Get a case (includes computed posture and fee/deadline aggregates)"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases, filterable by court_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["court_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/open"
    description: "Open a DRAFT case"
    roles: [Clerk]
    code: 200
    input: []
    output: Case
    side_effects: ["DRAFT->OPEN", "create STATUTE_OF_LIMITATIONS deadline", "recompute posture"]
  - method: POST
    path: "/cases/{id}/lift-stay"
    description: "Lift a stay (STAYED->OPEN)"
    roles: [Judge]
    code: 200
    input: []
    output: Case
    side_effects: ["STAYED->OPEN", "recompute posture"]
  - method: POST
    path: "/cases/{id}/close"
    description: "Close a case (JUDGMENT_ENTERED or ON_APPEAL -> CLOSED)"
    roles: [Clerk]
    code: 200
    input: []
    output: Case
    side_effects: ["->CLOSED", "vacate pending deadlines"]

  # ---- Party ----
  - method: POST
    path: "/parties"
    description: "Add a party to a case"
    roles: [Clerk]
    code: 201
    input: [case_id, display_name, role, attorney_user_id]
    output: Party
    side_effects: ["service_status=UNSERVED for DEFENDANT"]
  - method: GET
    path: "/parties/{id}"
    description: "Get a party"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Party
    side_effects: []
  - method: GET
    path: "/parties"
    description: "List parties, filterable by case_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "role?", "limit?", "offset?"]
    output: Party[]
    side_effects: []

  # ---- Filing ----
  - method: POST
    path: "/filings"
    description: "e-File a document (SUBMITTED); resubmits_filing_id links a resubmission of a REJECTED filing"
    roles: [Attorney]
    code: 201
    input: [case_id, filed_by_party_id, document_type, title, "resubmits_filing_id?"]
    output: Filing
    side_effects: ["status=SUBMITTED", "fee_cents computed (COMPLAINT=Court.filing_fee_cents else 0)", "fee_status=ASSESSED if fee_cents>0 else NONE"]
  - method: GET
    path: "/filings/{id}"
    description: "Get a filing"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Filing
    side_effects: []
  - method: GET
    path: "/filings"
    description: "List filings, filterable by case_id, filed_by_party_id, resubmits_filing_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "filed_by_party_id?", "resubmits_filing_id?", "status?", "limit?", "offset?"]
    output: Filing[]
    side_effects: []
  - method: POST
    path: "/filings/{id}/claim-review"
    description: "Clerk claims a SUBMITTED filing for review"
    roles: [Clerk]
    code: 200
    input: []
    output: Filing
    side_effects: ["SUBMITTED->UNDER_REVIEW"]
  - method: POST
    path: "/filings/{id}/accept"
    description: "Accept a filing under review"
    roles: [Clerk]
    code: 200
    input: []
    output: Filing
    side_effects: ["UNDER_REVIEW->ACCEPTED", "set accepted_at", "satisfy mapped deadline if resubmission", "recompute case fee aggregates"]
  - method: POST
    path: "/filings/{id}/reject"
    description: "Reject a filing under review"
    roles: [Clerk]
    code: 200
    input: [rejection_reason]
    output: Filing
    side_effects: ["UNDER_REVIEW->REJECTED", "set rejection_reason", "release ASSESSED fee"]
  - method: POST
    path: "/filings/{id}/pay-fee"
    description: "Record payment of an ASSESSED filing fee (fee_status ASSESSED->PAID)"
    roles: [Attorney, Clerk]
    code: 200
    input: []
    output: Filing
    side_effects: ["fee_status ASSESSED->PAID", "recompute Case.total_fees_paid_cents"]

  # ---- ServiceOfProcess ----
  - method: POST
    path: "/service-of-process"
    description: "Record a service-of-process attempt (ATTEMPTED)"
    roles: [Clerk]
    code: 201
    input: [case_id, filing_id, served_party_id, method, service_date]
    output: ServiceOfProcess
    side_effects: ["status=ATTEMPTED"]
  - method: GET
    path: "/service-of-process/{id}"
    description: "Get a service-of-process record"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: ServiceOfProcess
    side_effects: []
  - method: GET
    path: "/service-of-process"
    description: "List service-of-process records, filterable by case_id, filing_id, served_party_id, response_due_deadline_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "filing_id?", "served_party_id?", "response_due_deadline_id?", "status?", "limit?", "offset?"]
    output: ServiceOfProcess[]
    side_effects: []
  - method: POST
    path: "/service-of-process/{id}/complete"
    description: "Mark service completed (ATTEMPTED->COMPLETED)"
    roles: [Clerk]
    code: 200
    input: []
    output: ServiceOfProcess
    side_effects: ["party SERVED", "create RESPONSE deadline", "recompute posture"]
  - method: POST
    path: "/service-of-process/{id}/fail"
    description: "Mark service failed (ATTEMPTED->FAILED)"
    roles: [Clerk]
    code: 200
    input: []
    output: ServiceOfProcess
    side_effects: ["party SERVICE_FAILED"]

  # ---- Deadline ----
  - method: POST
    path: "/deadlines"
    description: "Create a deadline; computes due_date via due_date_calc"
    roles: [Clerk]
    code: 201
    input: [case_id, deadline_type, anchor_event, anchor_date, interval_days, counting_mode, "parent_deadline_id?"]
    output: Deadline
    side_effects: ["status=PENDING", "due_date computed", "increment Case.open_deadline_count", "recompute posture"]
  - method: GET
    path: "/deadlines/{id}"
    description: "Get a deadline"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Deadline
    side_effects: []
  - method: GET
    path: "/deadlines"
    description: "List deadlines, filterable by case_id, parent_deadline_id, satisfied_by_filing_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "parent_deadline_id?", "satisfied_by_filing_id?", "deadline_type?", "status?", "limit?", "offset?"]
    output: Deadline[]
    side_effects: []
  - method: POST
    path: "/deadlines/{id}/satisfy"
    description: "Manually mark a deadline SATISFIED"
    roles: [Clerk]
    code: 200
    input: ["satisfied_by_filing_id?"]
    output: Deadline
    side_effects: ["PENDING->SATISFIED", "decrement open_deadline_count", "recompute posture"]
  - method: POST
    path: "/deadlines/{id}/mark-missed"
    description: "Mark a past-due deadline MISSED"
    roles: [Clerk]
    code: 200
    input: []
    output: Deadline
    side_effects: ["PENDING->MISSED", "decrement open_deadline_count", "recompute posture"]
  - method: POST
    path: "/deadlines/{id}/vacate"
    description: "Vacate a pending deadline"
    roles: [Judge]
    code: 200
    input: []
    output: Deadline
    side_effects: ["PENDING->VACATED", "decrement open_deadline_count", "recompute posture"]

  # ---- Motion ----
  - method: POST
    path: "/motions"
    description: "File a motion (FILED) — requires an ACCEPTED MOTION-type filing"
    roles: [Attorney]
    code: 201
    input: [case_id, filing_id, moving_party_id, motion_type, "opposed?"]
    output: Motion
    side_effects: ["status=FILED"]
  - method: GET
    path: "/motions/{id}"
    description: "Get a motion"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Motion
    side_effects: []
  - method: GET
    path: "/motions"
    description: "List motions, filterable by case_id, filing_id, moving_party_id, hearing_id, order_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "filing_id?", "moving_party_id?", "hearing_id?", "order_id?", "status?", "limit?", "offset?"]
    output: Motion[]
    side_effects: []
  - method: POST
    path: "/motions/{id}/submit"
    description: "Take a motion under submission (FILED->UNDER_SUBMISSION)"
    roles: [Judge]
    code: 200
    input: []
    output: Motion
    side_effects: ["FILED->UNDER_SUBMISSION"]
  - method: POST
    path: "/motions/{id}/rule"
    description: "Rule on a motion under submission; creates an Order"
    roles: [Judge]
    code: 200
    input: [ruling, order_text, "stays_case?"]
    output: Motion
    side_effects: ["UNDER_SUBMISSION->GRANTED/DENIED/GRANTED_IN_PART", "create Order", "set order_id", "GRANT/GRANT_IN_PART with stays_case=true triggers case stay cascade"]
  - method: POST
    path: "/motions/{id}/withdraw"
    description: "Withdraw a FILED motion"
    roles: [Attorney]
    code: 200
    input: []
    output: Motion
    side_effects: ["FILED->WITHDRAWN", "cancel linked SCHEDULED hearing"]

  # ---- Order ----
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders, filterable by case_id, motion_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "motion_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ---- FeeWaiver ----
  - method: POST
    path: "/fee-waivers"
    description: "Request a fee waiver for a filing fee; computes eligibility_ratio"
    roles: [Attorney]
    code: 201
    input: [case_id, filing_id, requesting_party_id, monthly_income_cents, household_size]
    output: FeeWaiver
    side_effects: ["status=PENDING", "eligibility_ratio computed"]
  - method: GET
    path: "/fee-waivers/{id}"
    description: "Get a fee waiver"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: []
  - method: GET
    path: "/fee-waivers"
    description: "List fee waivers, filterable by case_id, filing_id, requesting_party_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "filing_id?", "requesting_party_id?", "status?", "limit?", "offset?"]
    output: FeeWaiver[]
    side_effects: []
  - method: POST
    path: "/fee-waivers/{id}/request-info"
    description: "Request more info (PENDING->NEEDS_INFO)"
    roles: [Clerk]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["PENDING->NEEDS_INFO"]
  - method: POST
    path: "/fee-waivers/{id}/resubmit"
    description: "Resubmit with updated info (NEEDS_INFO->PENDING)"
    roles: [Attorney]
    code: 200
    input: ["monthly_income_cents?", "household_size?"]
    output: FeeWaiver
    side_effects: ["NEEDS_INFO->PENDING", "recompute eligibility_ratio"]
  - method: POST
    path: "/fee-waivers/{id}/approve"
    description: "Approve a waiver (->APPROVED); waives the target filing fee"
    roles: [Clerk]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["->APPROVED", "Filing.fee_status->WAIVED", "recompute Case.total_fees_paid_cents"]
  - method: POST
    path: "/fee-waivers/{id}/deny"
    description: "Deny a waiver (->DENIED)"
    roles: [Clerk]
    code: 200
    input: []
    output: FeeWaiver
    side_effects: ["->DENIED"]

  # ---- Hearing ----
  - method: POST
    path: "/hearings"
    description: "Schedule a hearing; rejects courtroom/judge overlap"
    roles: [Judge]
    code: 201
    input: [case_id, "motion_id?", courtroom, judge_user_id, start_at, end_at]
    output: Hearing
    side_effects: ["status=SCHEDULED", "link motion_id->Motion.hearing_id if provided"]
  - method: GET
    path: "/hearings/{id}"
    description: "Get a hearing"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/hearings"
    description: "List hearings, filterable by case_id, motion_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "motion_id?", "courtroom?", "judge_user_id?", "status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{id}/hold"
    description: "Hold a hearing (SCHEDULED->HELD)"
    roles: [Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: ["SCHEDULED->HELD", "linked FILED motion -> UNDER_SUBMISSION"]
  - method: POST
    path: "/hearings/{id}/continue"
    description: "Continue a hearing to a new window (SCHEDULED->CONTINUED, new SCHEDULED created)"
    roles: [Judge]
    code: 200
    input: [new_start_at, new_end_at]
    output: Hearing
    side_effects: ["SCHEDULED->CONTINUED", "create successor SCHEDULED hearing"]
  - method: POST
    path: "/hearings/{id}/cancel"
    description: "Cancel a SCHEDULED hearing"
    roles: [Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: ["SCHEDULED->CANCELLED"]

  # ---- Judgment ----
  - method: POST
    path: "/judgments"
    description: "Enter a judgment (OCC-guarded on Case.version); drives case to JUDGMENT_ENTERED"
    roles: [Judge]
    code: 201
    input: [case_id, judgment_type, "prevailing_party_id?", "principal_cents?", "interest_rate_bps?", expected_case_version]
    output: Judgment
    side_effects: ["status=ENTERED", "Case OPEN->JUDGMENT_ENTERED", "create APPEAL deadline", "increment Case.version"]
  - method: GET
    path: "/judgments/{id}"
    description: "Get a judgment (total_with_interest_cents computed to current clock)"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Judgment
    side_effects: ["recompute total_with_interest_cents"]
  - method: GET
    path: "/judgments"
    description: "List judgments, filterable by case_id, prevailing_party_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "prevailing_party_id?", "status?", "limit?", "offset?"]
    output: Judgment[]
    side_effects: []
  - method: POST
    path: "/judgments/{id}/satisfy"
    description: "Mark a judgment SATISFIED"
    roles: [Clerk]
    code: 200
    input: []
    output: Judgment
    side_effects: ["ENTERED->SATISFIED"]
  - method: POST
    path: "/judgments/{id}/vacate"
    description: "Vacate a judgment (reverses case to OPEN)"
    roles: [Judge]
    code: 200
    input: []
    output: Judgment
    side_effects: ["ENTERED->VACATED", "Case JUDGMENT_ENTERED->OPEN", "vacate APPEAL deadlines"]

  # ---- Appeal ----
  - method: POST
    path: "/appeals"
    description: "File a notice of appeal (OCC-guarded on Case.version); drives case to ON_APPEAL"
    roles: [Attorney]
    code: 201
    input: [case_id, judgment_id, appellant_party_id, filed_on, "record_page_count?", expected_case_version]
    output: Appeal
    side_effects: ["status=NOTICE_FILED", "Judgment ENTERED->APPEALED", "Case JUDGMENT_ENTERED->ON_APPEAL", "increment Case.version"]
  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals, filterable by case_id, judgment_id, appellant_party_id"
    roles: [SystemAdmin, Clerk, Judge, Attorney]
    code: 200
    input: ["case_id?", "judgment_id?", "appellant_party_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/prepare-record"
    description: "Prepare the record on appeal (NOTICE_FILED->RECORD_PREPARED); computes transmittal_fee_cents"
    roles: [Clerk]
    code: 200
    input: [record_page_count]
    output: Appeal
    side_effects: ["NOTICE_FILED->RECORD_PREPARED", "compute transmittal_fee_cents"]
  - method: POST
    path: "/appeals/{id}/transmit"
    description: "Transmit the record to the appellate court (RECORD_PREPARED->TRANSMITTED)"
    roles: [Clerk]
    code: 200
    input: []
    output: Appeal
    side_effects: ["RECORD_PREPARED->TRANSMITTED", "set transmitted_at"]
  - method: POST
    path: "/appeals/{id}/dismiss"
    description: "Dismiss an appeal (->DISMISSED)"
    roles: [Judge]
    code: 200
    input: []
    output: Appeal
    side_effects: ["->DISMISSED", "if last appeal: Judgment APPEALED->ENTERED, Case ON_APPEAL->JUDGMENT_ENTERED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, negative number, or end_at <= start_at" }
  - { id: ERR_CROSS_CASE_REFERENCE, http: 422, condition: "An FK references a resource belonging to a different case, or a party with the wrong role" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current Case.version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state from which the requested transition is defined" }
  - { id: ERR_CASE_FROZEN, http: 409, condition: "Case posture is FROZEN; filing acceptance and motion rulings blocked" }
  - { id: ERR_CASE_RESTRICTED, http: 409, condition: "Case posture is RESTRICTED; new motion filing blocked" }
  - { id: ERR_HEARING_CONFLICT, http: 409, condition: "Hearing window overlaps another SCHEDULED hearing in the same courtroom or for the same judge" }
  - { id: ERR_STATUTE_EXPIRED, http: 409, condition: "COMPLAINT acceptance attempted after the STATUTE_OF_LIMITATIONS deadline due_date passed" }
  - { id: ERR_FILING_FEE_UNPAID, http: 409, condition: "COMPLAINT with fee_cents>0 cannot be accepted while fee_status is ASSESSED" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "Appeal filed_on is past Court.appeal_window_days after judgment entered_at" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "Cannot close a JUDGMENT_ENTERED case while an APPEAL deadline is still PENDING and not past due" }
  - { id: ERR_APPEAL_NOT_TRANSMITTED, http: 409, condition: "Cannot close an ON_APPEAL case while any appeal is not TRANSMITTED or DISMISSED" }
  - { id: ERR_CASE_MISSING_PARTIES, http: 409, condition: "Open attempted without both a PLAINTIFF and a DEFENDANT party" }
  - { id: ERR_NO_ACCEPTED_COMPLAINT, http: 409, condition: "Open attempted without an ACCEPTED COMPLAINT filing" }
  - { id: ERR_PENDING_MOTIONS, http: 409, condition: "Judgment entry attempted while a motion is FILED or UNDER_SUBMISSION" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "Service completion attempted while the case is not OPEN" }
  - { id: ERR_PARTY_ALREADY_SERVED, http: 409, condition: "Service completion targets a defendant already SERVED" }
  - { id: ERR_REJECTION_REASON_REQUIRED, http: 422, condition: "Filing rejection attempted without a rejection_reason" }
  - { id: ERR_RESUBMIT_TARGET_NOT_REJECTED, http: 409, condition: "resubmits_filing_id points at a filing that is not REJECTED" }
  - { id: ERR_FEE_NOT_ASSESSED, http: 409, condition: "Fee-waiver approval attempted while target filing fee_status is not ASSESSED" }
  - { id: ERR_DEADLINE_NOT_YET_DUE, http: 409, condition: "mark-missed attempted before the deadline due_date has passed" }
  - { id: ERR_HEARING_NOT_STARTED, http: 409, condition: "hold attempted before the hearing start_at" }
  - { id: ERR_EMPTY_RECORD, http: 409, condition: "prepare-record attempted with record_page_count <= 0" }
  - { id: ERR_NOT_MOVING_PARTY, http: 403, condition: "Attorney attempting to withdraw a motion they do not represent" }
  - { id: ERR_NOT_REQUESTING_PARTY, http: 403, condition: "Attorney attempting to resubmit a fee waiver they do not represent" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator who configures courts and drives the system clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /courts — configure courts"
      - "POST /_clock/set_current_utc — set the system clock"
    shared_operations:
      - "GET reads across all resources"
  - name: Clerk
    description: "Court clerk: docketing, filing review/acceptance/rejection, fee processing, service recording, deadline management, fee-waiver decisions, appeal record prep/transmittal, case open/close."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases, POST /cases/{id}/open, POST /cases/{id}/close — docket lifecycle"
      - "POST /parties — add parties"
      - "POST /filings/{id}/claim-review, /accept, /reject — filing review"
      - "POST /service-of-process and /complete, /fail — service recording"
      - "POST /deadlines, /satisfy, /mark-missed — deadline calendaring"
      - "POST /fee-waivers/{id}/request-info, /approve, /deny — waiver decisions"
      - "POST /judgments/{id}/satisfy — record satisfaction"
      - "POST /appeals/{id}/prepare-record, /transmit — appeal transmittal"
    shared_operations:
      - "POST /filings/{id}/pay-fee — shared with Attorney"
      - "GET reads across all resources"
  - name: Judge
    description: "Judicial officer: motion submission/rulings, hearing scheduling/holding/continuing/cancelling, judgment entry/vacatur, stay lifting, deadline vacatur, appeal dismissal."
    identity: "opaque"
    exclusive_operations:
      - "POST /motions/{id}/submit, /rule — motion rulings"
      - "POST /hearings, /hold, /continue, /cancel — hearing management"
      - "POST /judgments, /judgments/{id}/vacate — judgment entry/vacatur"
      - "POST /cases/{id}/lift-stay — lift stays"
      - "POST /deadlines/{id}/vacate — vacate deadlines"
      - "POST /appeals/{id}/dismiss — dismiss appeals"
    shared_operations:
      - "GET reads across all resources"
  - name: Attorney
    description: "Counsel of record for a party: e-files documents, files/withdraws motions, requests/resubmits fee waivers, files appeals. Acts only on resources for parties they represent (attorney_user_id == X-User-ID)."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /filings — e-file documents"
      - "POST /motions, /motions/{id}/withdraw — motion practice"
      - "POST /fee-waivers, /fee-waivers/{id}/resubmit — fee-waiver requests"
      - "POST /appeals — file notice of appeal"
    shared_operations:
      - "POST /filings/{id}/pay-fee — shared with Clerk"
      - "GET reads across all resources"
