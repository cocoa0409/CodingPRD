# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Recorder of Deeds / County Land Recording — Expert tier
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: transfer_tax_estimated_vs_final_on_package
        grounds:
          - calculations.transfer_tax
          - entities.DocumentPackage.fields.declared_consideration_cents
          - entities.DocumentPackage.fields.verified_consideration_cents
          - entities.FeeAssessment.fields.transfer_tax_cents
        distinguishing_aspect: |
          On the DocumentPackage consideration domain, the estimated transfer tax
          from declared_consideration_cents=200000 (1100c) differs from the final
          transfer tax from verified_consideration_cents=250000 (1375c) charged on
          the FeeAssessment.
        test_recipe:
          setup:
            - "Office (book_capacity 3) and ACTIVE submitter exist; clock at default 2026-01-01."
            - "Package DEED, declared_page_count 1, declared_consideration_cents 200000, margin 3.0, notary true, with 1 GRANTOR + 1 GRANTEE; in IN_EXAMINATION."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 200000, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "Alice Seller" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "Bob Buyer" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 250000, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
              captures: { fa_id: $.data.id }
          assert:
            - "FeeAssessment.${fa_id}.transfer_tax_cents == 1375"
            - "FeeAssessment.${fa_id}.records_mgmt_cents == 325"
            - "estimated transfer tax over declared_consideration_cents=200000 would be 1100, which differs from the final 1375"

      - name: escrow_settled_vs_available_on_submitter
        grounds:
          - calculations.escrow_available
          - entities.Submitter.fields.escrow_balance_cents
          - entities.Submitter.fields.escrow_available_cents
          - entities.Submitter.fields.escrow_held_cents
        distinguishing_aspect: |
          On the Submitter escrow domain (different domain from transfer_tax), the
          settled escrow_balance_cents=46000 (only the CAPTURED payment reduces it)
          differs from the forward-looking escrow_available_cents=42000 (a FINALIZED
          unpaid assessment hold of 4000 also subtracts).
        test_recipe:
          setup:
            - "Office (capacity 3), ACTIVE submitter with 50000c escrow deposited; clock default."
            - "Package P1 (DEED, exempt consideration) recorded-path paid via ESCROW (total 4000c captured)."
            - "Package P2 (DEED, exempt consideration) ASSESSED (FINALIZED total 4000c) but unpaid -> held."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 50000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 2, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /packages/${p1_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${p1_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${p1_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { p1_v0: $.data.version }
            - call: "POST /packages/${p1_id}/assessments"
              payload: { verified_page_count: 2, verified_consideration_cents: 0, expected_package_version: "${p1_v0}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${p1_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { p1_v1: $.data.version }
            - call: "POST /packages/${p1_id}/payments"
              payload: { amount_cents: 4000, method: "ESCROW", expected_package_version: "${p1_v1}" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 2, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /packages/${p2_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G2" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${p2_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E2" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${p2_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { p2_v0: $.data.version }
            - call: "POST /packages/${p2_id}/assessments"
              payload: { verified_page_count: 2, verified_consideration_cents: 0, expected_package_version: "${p2_v0}" }
              as: Examiner
              as_user_id: "ex-1"
          trigger:
            - call: "GET /submitters/${sub_id}"
              payload: {}
              as: Clerk
              captures: { bal: $.data.escrow_balance_cents, avail: $.data.escrow_available_cents }
          assert:
            - "Submitter.${sub_id}.escrow_balance_cents == 46000"
            - "Submitter.${sub_id}.escrow_held_cents == 4000"
            - "Submitter.${sub_id}.escrow_available_cents == 42000"
            - "escrow_balance_cents (46000) != escrow_available_cents (42000)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: recording_fee_tiered_page_index_doctype
        grounds:
          - calculations.recording_fee
          - entities.FeeAssessment.fields.recording_fee_cents
          - entities.DocumentPackage.fields.verified_page_count
        distinguishing_aspect: |
          Mode (a): recording_fee combines >=3 inputs (verified_page_count=3,
          party_entry_count=6, doc_type=DEED) with nested max() — page_fee
          2500+500*max(0,2)=3500, index_fee 200*max(0,6-4)=400, doctype 1000 →
          recording_fee_cents=4900.
        test_recipe:
          setup:
            - "Office (capacity 3), ACTIVE submitter; DEED package with 6 party entries (3 GRANTOR + 3 GRANTEE), margin 3.0 notary true, in IN_EXAMINATION."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 3, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G2" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G3" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E2" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E3" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 3, verified_consideration_cents: 0, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
              captures: { fa_id: $.data.id }
          assert:
            - "FeeAssessment.${fa_id}.recording_fee_cents == 4900"
            - "FeeAssessment.${fa_id}.total_due_cents == 4900"

      - name: total_amount_due_round_each_component_then_sum
        grounds:
          - calculations.total_amount_due
          - entities.FeeAssessment.fields.total_due_cents
          - entities.FeeAssessment.fields.transfer_tax_cents
          - entities.FeeAssessment.fields.records_mgmt_cents
        distinguishing_aspect: |
          Mode (b): with consideration 100074, transfer_tax_raw=550.407→550 and
          records_mgmt_raw=130.0962→130 are each rounded before summing (550+130=680);
          the forbidden sum-then-round of raws would give 681, so the pinned order
          changes the result.
        test_recipe:
          setup:
            - "Office (capacity 3), ACTIVE submitter; DEED package 1 page, 2 parties, consideration 100074, margin 3.0 notary true, IN_EXAMINATION."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 100074, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 100074, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
              captures: { fa_id: $.data.id }
          assert:
            - "FeeAssessment.${fa_id}.recording_fee_cents == 3500"
            - "FeeAssessment.${fa_id}.transfer_tax_cents == 550"
            - "FeeAssessment.${fa_id}.records_mgmt_cents == 130"
            - "FeeAssessment.${fa_id}.total_due_cents == 4180"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: package_reject_rerecord_cycle
        grounds:
          - state_machines.DocumentPackage.IN_EXAMINATION_to_REJECTED
          - state_machines.DocumentPackage.REJECTED_to_IN_EXAMINATION
          - entities.DocumentPackage.fields.resubmission_count
        distinguishing_aspect: |
          DocumentPackage exhibits a cycle (IN_EXAMINATION→REJECTED→IN_EXAMINATION):
          a rejected package re-enters examination via re-record and
          resubmission_count increments to 1, distinct from a linear pipeline.
        test_recipe:
          setup:
            - "Office, ACTIVE submitter; DEED package in IN_EXAMINATION with 1 GRANTOR + 1 GRANTEE, margin 2.0 (defective), notary true."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 2.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E1" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
            - call: "POST /packages/${pkg_id}/reject"
              payload: { reason_code: "MARGIN", detail: "top margin under 3 inches" }
              as: Examiner
              as_user_id: "ex-1"
          trigger:
            - call: "POST /packages/${pkg_id}/re-record"
              payload: { first_page_top_margin_inches: 3.0 }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_status: $.data.status, rc: $.data.resubmission_count }
          assert:
            - "DocumentPackage.${pkg_id}.status == IN_EXAMINATION"
            - "DocumentPackage.${pkg_id}.resubmission_count == 1"
            - "DocumentPackage.${pkg_id}.first_page_top_margin_inches == 3.0"

      - name: ucc_continuation_active_self_loop
        grounds:
          - state_machines.LienUccFiling.ACTIVE_to_ACTIVE
          - entities.LienUccFiling.fields.continuation_count
          - entities.LienUccFiling.fields.lapse_date
        distinguishing_aspect: |
          LienUccFiling (a different entity from DocumentPackage) has a self-loop
          ACTIVE→ACTIVE: a continuation within the window keeps status ACTIVE while
          incrementing continuation_count to 1 and extending lapse_date by 5 years.
        test_recipe:
          setup:
            - "Office, ACTIVE submitter; UCC1 filing effective 2026-01-01 (lapse 2031-01-01); clock set to 2030-08-01 (inside continuation window, before lapse)."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Lender", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "UCC1", parcel_id: "P-1", debtor_name: "Debtor A", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { fil_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-08-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /ucc-filings/${fil_id}/continue"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { cc: $.data.continuation_count, st: $.data.status }
          assert:
            - "LienUccFiling.${fil_id}.status == ACTIVE"
            - "LienUccFiling.${fil_id}.continuation_count == 1"
            - "LienUccFiling.${fil_id}.lapse_date == 2036-01-01T00:00:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: record_mints_instrument_then_rolls_book
        grounds:
          - state_machines.DocumentPackage.PAID_to_RECORDED
          - entities.RecordingOffice.fields.next_instrument_number
          - entities.RecordingOffice.fields.current_book
          - entities.RecordingOffice.fields.documents_in_current_book
        distinguishing_aspect: |
          Depth-3 cascade from the record trigger: (1) record creates a
          RecordedDocument which (2) increments office.documents_in_current_book to
          book_capacity=3, which (3) rolls the book (current_book 1→2,
          documents_in_current_book→0, current_page→1). Each link is caused by the
          previous one.
        test_recipe:
          setup:
            - "Office capacity 3, instrument_seq_start default 1000000; two DEED packages already RECORDED (docs in book = 2, next instrument 1000002, current_book 1); a third DEED package PAID and ready to record."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3, instrument_seq_start: 1000000 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            # ---- record doc #1 ----
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { a_id: $.data.id }
            - call: "POST /packages/${a_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${a_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${a_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { a_v0: $.data.version }
            - call: "POST /packages/${a_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${a_v0}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${a_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { a_v1: $.data.version }
            - call: "POST /packages/${a_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${a_v1}" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${a_id}/record"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
            # ---- record doc #2 ----
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { b_id: $.data.id }
            - call: "POST /packages/${b_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${b_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${b_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { b_v0: $.data.version }
            - call: "POST /packages/${b_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${b_v0}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${b_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { b_v1: $.data.version }
            - call: "POST /packages/${b_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${b_v1}" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${b_id}/record"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
            # ---- third package PAID, not yet recorded ----
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { c_id: $.data.id }
            - call: "POST /packages/${c_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${c_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${c_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { c_v0: $.data.version }
            - call: "POST /packages/${c_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${c_v0}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${c_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { c_v1: $.data.version }
            - call: "POST /packages/${c_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${c_v1}" }
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /packages/${c_id}/record"
