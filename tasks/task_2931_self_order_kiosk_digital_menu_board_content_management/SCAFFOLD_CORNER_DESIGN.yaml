              as: ContentManager
              captures: { zone_cluster_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${zone_cluster_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { zone_store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id, item_ver: $.data.version }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 599, effective_from_utc: "2026-08-10T00:00:00Z", justification: "Commodity cost increase", expected_menu_item_version: "${item_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id, uplift_bp: $.data.uplift_bp, need: $.data.required_approvals }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { submitted_state: $.data.state }
          trigger:
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_1"
              captures: { state_1: $.data.state, ids_1: $.data.approval_user_ids }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_analyst_1"
              captures: { self_err: $.data.error_id }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_2"
              captures: { state_2: $.data.state, ids_2: $.data.approval_user_ids }
          assert:
            - "${uplift_bp} == 716 ((599 - 559) x 10000 / 559 = 715.56 rounded half up) and ${need} == 2"
            - "${submitted_state} == PENDING_APPROVAL"
            - "${state_1} == PENDING_APPROVAL with ${ids_1} == [u_approver_1] — one of two signatures collected, no state change yet"
            - "${self_err} == ERR_SELF_APPROVAL_FORBIDDEN with HTTP 403: the requester u_analyst_1 wearing the PricingApprover role passes priority 2 and is stopped at priority 17"
            - "the refused approval did not extend the list: approval_user_ids is still [u_approver_1] immediately after it"
            - "${state_2} == APPROVED with ${ids_2} == [u_approver_1, u_approver_2] in signing order"
            - "GET /kiosk-ops/audit-events?entity_id=${pcr_id} contains exactly two APPROVE events and no event for the refused attempt"

  - section: complexity_layers
    instances:

      - name: stale_menu_item_version_blocks_the_price_change_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.price-request-create-stale-menu-item
          - errors.ERR_STALE_MENU_ITEM_VERSION
          - validations.priority_9_ERR_STALE_MENU_ITEM_VERSION
          - entities.MenuItem.fields.version
        distinguishing_aspect: "The §1.2.1 rule for MenuItem is exercised on its declared write_endpoint with its declared occ_field: an accessibility-copy write lifts version 1 to 2, the request carrying the now-stale 1 is refused with 412, and the identical request carrying 2 is created."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A used by store S001 so priority 32 is satisfied; Item A at 500 cents, created at version 1."
            - "A ComplianceOfficer rewrites the accessibility copy of Item A first, so the version the reader holds goes stale."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_ZONE", tier: "REGION" }
              as: ContentManager
              captures: { zone_cluster_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${zone_cluster_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { zone_store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id, ver1: $.data.version }
            - call: "POST /kiosk-ops/menu-items/${item_a_id}/accessibility-copy"
              payload: { expected_menu_item_version: "${ver1}", screen_reader_text: "Classic burger with lettuce and tomato", contrast_ratio: 8.4 }
              as: ComplianceOfficer
              captures: { ver2: $.data.version, acc_state: $.data.accessibility_state }
          trigger:
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 569, effective_from_utc: "2026-08-10T00:00:00Z", justification: "Commodity cost increase", expected_menu_item_version: "${ver1}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { stale_err: $.data.error_id }
            - call: "POST /kiosk-ops/menu-items/${item_a_id}/accessibility-copy"
              payload: { expected_menu_item_version: "${ver1}", screen_reader_text: "Should not land", contrast_ratio: 9.0 }
              as: ComplianceOfficer
              captures: { stale_write_err: $.data.error_id }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 569, effective_from_utc: "2026-08-10T00:00:00Z", justification: "Commodity cost increase", expected_menu_item_version: "${ver2}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id, pcr_state: $.data.state, pcr_uplift: $.data.uplift_bp }
          assert:
            - "${ver1} == 1 at creation and ${ver2} == 2 after the accessibility write, with ${acc_state} == READY — version increments on every write to MenuItem"
            - "${stale_err} == ERR_STALE_MENU_ITEM_VERSION with HTTP 412 for the request carrying version ${ver1}"
            - "${stale_write_err} == ERR_STALE_MENU_ITEM_VERSION with HTTP 412: the same occ_field guards the accessibility-copy write, and the refused write did not bump the version"
            - "GET /kiosk-ops/menu-items/${item_a_id} still reports version 2 and screen_reader_text 'Classic burger with lettuce and tomato'"
            - "the retried request returns HTTP 201 with ${pcr_state} == DRAFT and ${pcr_uplift} == 179"
            - "GET /kiosk-ops/price-change-requests?menu_item_id=${item_a_id} returns total_count 1 — the 412 created nothing"

      - name: stale_content_bundle_version_blocks_the_next_daypart_slot
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.daypart-slot-append-stale-bundle
          - errors.ERR_STALE_CONTENT_BUNDLE_VERSION
          - validations.priority_10_ERR_STALE_CONTENT_BUNDLE_VERSION
          - entities.ContentBundle.fields.version
        distinguishing_aspect: "The second §1.2.1 rule guards an append against a parent version the caller no longer holds: the first slot append lifts the bundle to version 2, a second append replaying version 1 is refused with 412 before the overlap check at priority 21 can even run, and the same slot succeeds at version 2."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST; a DRAFT bundle on CL_WEST at version 1."
            - "Slot 1 is LUNCH [660, 960) and slot 2 is DINNER [960, 1320) — deliberately non-overlapping so only the OCC check can fail."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/content-bundles"
              payload: { cluster_id: "${cl_id}", effective_from_utc: "2026-08-05T00:00:00Z" }
              as: ContentManager
              captures: { bundle_id: $.data.id, bver1: $.data.version, slots0: $.data.daypart_slots }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bver1}", daypart_code: "LUNCH", start_minute_of_day: 660, end_minute_of_day: 960, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
              captures: { bver2: $.data.version }
          trigger:
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bver1}", daypart_code: "DINNER", start_minute_of_day: 960, end_minute_of_day: 1320, layout_code: "DINNER_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
              captures: { stale_bundle_err: $.data.error_id }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bver1}", daypart_code: "LUNCH", start_minute_of_day: 700, end_minute_of_day: 800, layout_code: "LUNCH_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
              captures: { stale_beats_overlap_err: $.data.error_id }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${bver2}", daypart_code: "DINNER", start_minute_of_day: 960, end_minute_of_day: 1320, layout_code: "DINNER_GRID", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
              captures: { bver3: $.data.version, slots3: $.data.daypart_slots, state3: $.data.state }
          assert:
            - "${bver1} == 1 with ${slots0} == [] at creation, and ${bver2} == 2 after the first append"
            - "${stale_bundle_err} == ERR_STALE_CONTENT_BUNDLE_VERSION with HTTP 412"
            - "${stale_beats_overlap_err} == ERR_STALE_CONTENT_BUNDLE_VERSION with HTTP 412, not ERR_DAYPART_SLOT_OVERLAP: priority 10 precedes priority 21 even though [700, 800) sits inside the LUNCH slot"
            - "the retry at ${bver2} returns HTTP 200 with ${bver3} == 3, ${state3} == DRAFT and ${slots3} holding exactly two slots"
            - "the two refused appends left the slot list at one entry — no partial append, no version bump"

      - name: quarantine_thresholds_bite_at_the_third_miss_and_reset_on_the_next_beat
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.device_health_score.constants
          - entities.Device.fields.consecutive_missed_heartbeats
          - entities.Device.fields.health_state
          - endpoints.POST_/kiosk-ops/_clock/set_current_utc
        distinguishing_aspect: "Two thresholds are walked on one healthy kiosk: the cumulative miss counter is DEGRADED at 2 misses and QUARANTINED at exactly QUARANTINE_MISS_FLOOR 3, the rolling score never drops below HEALTH_DEGRADED_MIN so quarantine is driven by the miss floor and the worst-case variant alone, and a single fresh heartbeat resets the curve to ONLINE."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, store S001; kiosk K001 registered and heart-beating with all four channels true (base 100)."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_WEST", tier: "REGION" }
              as: ContentManager
              captures: { cl_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${cl_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /kiosk-ops/devices"
              payload: { store_id: "${store_id}", device_kind: "KIOSK", device_code: "K001", offline_cache_capacity: 2, pin_pad_firmware_version: "1.4.2" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { roll_t0: $.data.rolling_health_score, state_t0: $.data.health_state, missed_t0: $.data.consecutive_missed_heartbeats }
          trigger:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:10:00Z" }
              as: PlatformAdmin
            - call: "GET /kiosk-ops/devices/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { missed_2: $.data.consecutive_missed_heartbeats, roll_2: $.data.rolling_health_score, worst_2: $.data.worst_case_health_score, state_2: $.data.health_state }
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:15:00Z" }
              as: PlatformAdmin
            - call: "GET /kiosk-ops/devices/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { missed_3: $.data.consecutive_missed_heartbeats, roll_3: $.data.rolling_health_score, worst_3: $.data.worst_case_health_score, state_3: $.data.health_state }
            - call: "GET /kiosk-ops/stores/${store_id}"
              payload: {}
              as: PlatformAdmin
              captures: { posture_quarantined: $.data.content_posture }
            - call: "POST /kiosk-ops/devices/${dev_id}/heartbeat"
              payload: { printer_ok: true, touch_ok: true, screen_reader_ok: true, network_ok: true }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { missed_reset: $.data.consecutive_missed_heartbeats, roll_reset: $.data.rolling_health_score, state_reset: $.data.health_state, beat_reset: $.data.last_heartbeat_utc }
            - call: "GET /kiosk-ops/stores/${store_id}"
              payload: {}
              as: PlatformAdmin
              captures: { posture_reset: $.data.content_posture }
          assert:
            - "${missed_t0} == 0, ${roll_t0} == 100 and ${state_t0} == ONLINE at the baseline beat"
            - "at 17:10 ${missed_2} == 2, ${roll_2} == 70 (100 - 2 x 15), ${worst_2} == 40 (100 - min(4 x 15, 60)) and ${state_2} == DEGRADED — quarantine is withheld one miss short of the floor even though the worst case is already below 50"
            - "at 17:15 ${missed_3} == 3, ${roll_3} == 55, ${worst_3} == 40 and ${state_3} == QUARANTINED — the cumulative threshold fires at exactly QUARANTINE_MISS_FLOOR"
            - "${roll_3} == 55 is above HEALTH_DEGRADED_MIN 50, proving the QUARANTINED band was reached through the miss floor and the projected variant, not through the rolling score"
            - "${posture_quarantined} == FROZEN while the store's only kiosk is QUARANTINED"
            - "the fresh beat resets the curve: ${missed_reset} == 0, ${roll_reset} == 100, ${state_reset} == ONLINE and ${beat_reset} == 2026-08-05T17:15:00Z"
            - "${posture_reset} == OPEN once the device is healthy again — no residual penalty survives the reset"

      - name: cascading_side_effects_chain_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PriceChangeRequest
          - state_machines.StoreItemAvailability
          - entities.Store.fields.content_posture
        excluded_because:
          difficulty_instance: transitive_cascade / price_apply_cascade_depth_four_to_store_posture
          rationale: "The four-level APPLY chain (request -> zone override -> published bundle staleness -> device cache -> store posture) and the five-level 86 chain in manual_eighty_six_cascade_depth_five_to_device_cache both assert the end-to-end ordering and the untouched-terminal-children clause, so a separate breadth instance would only replay them."

      - name: derived_field_reconciliation_corner
