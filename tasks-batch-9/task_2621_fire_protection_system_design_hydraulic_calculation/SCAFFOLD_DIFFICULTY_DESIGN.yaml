            - call: "POST /hydraulic-calculations/${hc1}/seal"
              payload: {}
              as: DesignEngineer
              as_user_id: "${e1}"
          assert:
            - "WaterSupplyEvaluation.${wse_bad}.available_psi_at_demand == 43.77"
            - "WaterSupplyEvaluation.${wse_bad}.safety_margin_psi == -11.77"
            - "WaterSupplyEvaluation.${wse_bad}.margin_verdict == INADEQUATE_PUMP_REQUIRED"
            - "the first trigger call returns 409 ERR_SAFETY_MARGIN_UNRESOLVED"
            - "HydraulicCalculation.${hc1}.state == QC_PASSED after the refused seal"
            - "HydraulicCalculation.${hc1}.sealed_by_engineer_id == null after the refused seal"
            - "Project.${p1}.sealed_calculation_count == 0 after the refused seal"
            - "the second trigger call returns 201"
            - "FirePump.${fp1}.rated_flow_gpm == 2500.0"
            - "FirePump.${fp1}.suction_psi_at_rated == 41.62"
            - "FirePump.${fp1}.required_discharge_psi == 65.54"
            - "FirePump.${fp1}.rated_pressure_psi == 40"
            - "FirePump.${fp1}.churn_discharge_psi == 106.0"
            - "FirePump.${fp1}.flow_150_pct_gpm == 3750.0"
            - "FirePump.${fp1}.suction_psi_at_150_pct == 32.25"
            - "FirePump.${fp1}.available_psi_at_150_pct == 58.25"
            - "FirePump.${fp1}.sizing_verdict == ACCEPTABLE"
            - "FirePump.${fp1}.state == SIZED"
            - "WaterSupplyEvaluation.${wse_bad}.pump_sized == true"
            - "Project.${p1}.pump_required_flag == true"
            - "the third trigger call returns 200"
            - "HydraulicCalculation.${hc1}.state == SEALED"
            - "HydraulicCalculation.${hc1}.sealed_by_engineer_id == ${e1}"
            - "HydraulicCalculation.${hc1}.sealed_at == 2026-08-01T00:00:00Z"
            - "Project.${p1}.sealed_calculation_count == 1"

      - name: submittal_gate_walks_from_unsealed_calculation_to_uncoordinated_sheet_to_success
        grounds:
          - validations[priority=25]
          - validations[priority=26]
          - state_machines.Project.DESIGN_to_PERMIT_REVIEW
          - state_machines.ShopDrawing.IN_COORDINATION_to_COORDINATED
          - entities.ShopDrawing.fields.cleared_trade_count
        distinguishing_aspect: |
          The identical POST /submittals body is refused twice and then accepted, and each refusal is
          caused by the state of a different downstream entity - first the HydraulicCalculation (QC_PASSED,
          not SEALED), then the ShopDrawing (IN_COORDINATION with cleared_trade_count 2 of 3). The
          submittal itself never changes. The instance also proves the gate is per-sheet rather than
          per-project: with no sheet at all the drawing rule is vacuous, so the calculation rule at
          priority 25 must answer the first attempt.
        test_recipe:
          setup:
            - "Project FP-2601 with HC-1 at QC_PASSED and a reconciling ADEQUATE evaluation on file"
            - "No shop drawing exists yet at the first attempt"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Sam Oyelaran", license_state: "TX", license_number: "PE-88431", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e2: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
