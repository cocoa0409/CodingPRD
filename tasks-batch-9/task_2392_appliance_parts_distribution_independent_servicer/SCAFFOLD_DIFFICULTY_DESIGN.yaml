            - "PartOrder.${order_id}.invoiced_total_cents == 593000 (576000 goods + 17000 deposits + 0 freight)"
            - "ReturnAuthorization.${ra_id}.gross_return_cents == 0 and restocking_fee_cents == 0 and credit_amount_cents == 0"
            - "ReturnAuthorization.${ra_id}.core_deposit_refund_cents == 17000 and ra_status == CREDITED"
            - "after the trigger: ServicerAccount.${acct_k_id}.core_liability_cents == 0"
            - "OrderLine.${line_id}.line_status == SHIPPED and returned_units == 0 (a core return is not a goods return)"
            - "InventoryRecord.${inv_a_p2_id}.on_hand_units == 3 (cores ship to the OEM and are never restocked)"
            - "ServicerAccount.${acct_k_id}.credit_used_cents == 593000 (unchanged: the deposit release is not a goods credit)"

      - name: inventory_units_are_conserved_when_an_allocated_line_is_cancelled
        grounds:
          - calculations.inventory_availability
          - endpoints.POST_/order-lines/{id}/cancel
          - state_machines.OrderLine.ALLOCATED_to_CANCELLED
          - entities.InventoryRecord.fields.available_units
        distinguishing_aspect: |
          Conserved quantity #2 is physical UNITS rather than money: cancelling an ALLOCATED line
