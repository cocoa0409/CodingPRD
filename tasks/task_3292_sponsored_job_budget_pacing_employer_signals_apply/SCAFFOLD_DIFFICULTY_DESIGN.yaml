            - "Employer.${emp_gt}.status == SUSPENDED and Campaign.${camp_gt}.status == PAUSED before the trigger"
            - "the trigger response status is 409 and error_id == ERR_EMPLOYER_SUSPENDED"
            - "Campaign.${camp_gt}.status stays PAUSED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2 instances, different semantics+entities)
