        distinguishing_aspect: "FORWARD_LOOKING spending basis is COMPREHENSIVE-only: amending a PRE_APPROVED_GRANT agreement with a CORRECT OCC version still fails with ERR_MODEL_MISMATCH (model check, not the OCC check, fires)."
