            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_b}", inspector_id: "${insp_id}", window_start: "2026-06-02T11:00:00Z", window_end: "2026-06-02T12:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_b_v1}" }
              as: OpsAdmin
              captures: { asg_b: $.data.id }
          trigger:
            - call: "POST /dispatch-assignments/${asg_b}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "DispatchAssignment.${asg_b}.status == ACCEPTED"
            - "DispatchAssignment.${asg_a}.status == RELEASED"
