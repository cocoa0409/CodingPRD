# =============================================================================
# PRD Benchmark Seed Tables — task_3127
# Residential Addiction Treatment Admission & Level-of-Care Step-Down
# Difficulty band: BEYOND EXPERT (14 entities / 52 endpoints / 43 error codes /
#   12 calculations / 6 state machines / 4 concurrency rules)
# =============================================================================

scenario: |
  Residential Addiction Treatment Admission & Level-of-Care Step-Down (Hazelden
  Betty Ford): clinical assessment placing a patient at a level of care using
  standardized criteria across dimensions of risk, insurance authorization for
  the assigned level with concurrent review and step-down pressure, admission
  logistics including medical clearance, withdrawal management and medication
  reconciliation, treatment planning with individual, group and family
  programming schedules, step-down transitions from residential through partial
  hospitalization and intensive outpatient with bed and slot capacity, recovery
  housing and continuing care planning after discharge, alumni engagement and
  outcome measurement contacts at intervals after treatment, licensing and
  accreditation requirements by state facility

domain_name: residential-addiction-treatment-stepdown
api_prefix: /treatment-network

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - scheduled_deferred_actions
  entity_topology: hybrid            # facility → patient → episode tree, with
                                     # cross-aggregate payer / network edges
  state_machine_shape: compound      # LevelOfCareAuthorization posture gates
                                     # every bed move; TreatmentEpisode holds
                                     # two parallel state dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many                   # credentialed provider ↔ facility ↔ service
    - cross_aggregate                # authorization → episode → step-down referral
  role_model: segregation_of_duties # ClinicalDirector and UtilizationReviewer are
                                    # forbidden from co-signing the same episodes
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Facility display name"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code; drives licensure rule selection"
        constraints: "length 2, uppercase"
      - name: licensed
        type: boolean
        source: computed
        default: false
        description: "True once a LICENSE accreditation of class STATE_LICENSE has been GRANTED and not EXPIRED for this facility's state_code"
      - name: as_level_max
        type: enum
        source: computed
        default: ASAM_1_0
        description: "Highest level of care this facility is licensed to deliver: ASAM_1_0 | ASAM_2_1 | ASAM_3_1 | ASAM_3_5 | ASAM_3_7"
      - name: state_min_credential_tier
        type: enum
        source: computed
        default: TIER_1_SUPPORT
        description: "Lowest clinician credential tier the state licensure rule permits to author clinical documents at this facility: TIER_1_SUPPORT | TIER_2_COUNSELOR | TIER_3_LICENSED | TIER_4_INDEPENDENT"
      - name: is_accepting_admissions
        type: boolean
        source: computed
        default: true
        description: "False when facility_posture is FROZEN, licensed is false, or no ACCREDITATION_BODY accreditation is GRANTED"
      - name: facility_posture
        type: enum
        source: computed
        default: OPEN
        description: "OPEN | RESTRICTED | FROZEN — derived from compliance_risk_points by calculations.tiered_compliance_risk_deduction; gates admission, discharge and level-of-care changes"
      - name: compliance_risk_points
        type: integer
        source: computed
        default: 0
        description: "Accreditation-compliance penalty points; see calculations.tiered_compliance_risk_deduction"
      - name: ops_epoch
        type: integer
        source: computed
        default: 0
        description: "Incremented by exactly 1 at the start of every facility-ops run; used to scope same-epoch compensation"
      - name: last_ops_run_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of the most recent facility-ops run; null before the first run"

  # ---------------------------------------------------------------------------
  - name: Bed
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; owning facility"
      - name: unit_name
        type: string
        source: input
        description: "Unit or house name inside the facility"
      - name: bed_label
        type: string
        source: input
        description: "Human label for the bed, unique within the facility"
      - name: level_of_care
        type: enum
        source: input
        description: "ASAM level this bed is staffed for: ASAM_1_0 | ASAM_2_1 | ASAM_3_1 | ASAM_3_5 | ASAM_3_7"
      - name: cleaning_turnaround_hours
        type: integer
        source: input
        description: "Turnaround hours required between a discharge and the next occupancy window"
      - name: next_available_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC instant the bed completes its CLEANING turnaround and becomes AVAILABLE again; null while AVAILABLE or OCCUPIED"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: "AVAILABLE | OCCUPIED | CLEANING"

  # ---------------------------------------------------------------------------
  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Clinician display name"
      - name: credential_tier
        type: enum
        source: input
        description: "TIER_1_SUPPORT | TIER_2_COUNSELOR | TIER_3_LICENSED | TIER_4_INDEPENDENT"
      - name: is_medical_provider
        type: boolean
        source: input
        description: "True for physicians and advanced practice providers permitted to author medical clearance and withdrawal-management orders"

  # ---------------------------------------------------------------------------
  - name: ClinicianFacilityCredential
    parent: null
    common_fields: true
    fields:
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the credentialed clinician"
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the facility the credential applies to"
      - name: effective_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the credential becomes usable"
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the credential stops being usable; exclusive"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE | REVOKED"
      - name: is_usable
        type: boolean
        source: computed
        description: "True when status == ACTIVE and logical now is at or after effective_at and strictly before expires_at"

  # ---------------------------------------------------------------------------
  - name: ServiceOffering
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; owning facility"
      - name: service_code
        type: string
        source: input
        description: "Programming service code (for example IOP_GROUP or PH_IOP_STEP)"
      - name: level_of_care
        type: enum
        source: input
        description: "ASAM level this service belongs to: ASAM_1_0 | ASAM_2_1 | ASAM_3_1 | ASAM_3_5 | ASAM_3_7"
      - name: required_min_credential_tier
        type: enum
        source: input
        description: "Minimum clinician credential tier permitted to run this service"
      - name: requires_medical_provider
        type: boolean
        source: input
        description: "True when the service must be run by a clinician with is_medical_provider == true"

  # ---------------------------------------------------------------------------
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Payer organization name"
      - name: initial_authorized_days_by_loc
        type: object
        source: input
        description: "Map from ASAM level to the number of days the payer grants on a first authorization, for example { ASAM_3_5: 14, ASAM_3_1: 10 }"
      - name: step_down_coverage_map
        type: object
        source: input
        description: "Map from an ASAM level to the ASAM levels the payer will fund after it, in priority order, for example { ASAM_3_5: [ASAM_3_1, ASAM_2_1, ASAM_1_0] }"
      - name: concurrent_review_interval_days
        type: integer
        source: input
        description: "Number of days of authorized care that must remain before the next concurrent review is due"
      - name: credential_min_tier_by_loc
        type: object
        source: input
        description: "Map from ASAM level to the minimum clinician credential tier the payer will reimburse for utilization review on that level"

  # ---------------------------------------------------------------------------
  - name: TreatmentEpisode
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: patient_ref
        type: string
        source: input
        description: "Stable patient reference supplied by the intake desk"
      - name: assigned_level
        type: enum
        source: input
        description: "ASAM level placed by the most recent completed assessment: ASAM_1_0 | ASAM_2_1 | ASAM_3_1 | ASAM_3_5 | ASAM_3_7"
      - name: admitted_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of admission; set when the episode leaves AWAITING_ADMISSION"
      - name: discharged_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant of discharge; null until DISCHARGED"
      - name: clinical_status
        type: enum
        source: system
        default: AWAITING_ASSESSMENT
        description: "Parallel dimension 1 of the episode: AWAITING_ASSESSMENT | UNDER_ASSESSMENT | AWAITING_AUTHORIZATION | AWAITING_ADMISSION | IN_TREATMENT | COMPLETED | DISCHARGED"
      - name: care_level_status
        type: enum
        source: system
        default: NOT_STARTED
        description: "Parallel dimension 2 of the episode: NOT_STARTED | ACTIVE | STEP_DOWN_PENDING | STEPPED_DOWN"
      - name: step_down_count
        type: integer
        source: computed
        default: 0
        description: "Number of completed step-downs; capped at MAX_STEP_DOWNS_PER_EPISODE"
      - name: therapy_revenue_cents
        type: integer
        source: computed
        default: 0
        description: "Gross professional revenue accrued from completed non-cancelled session attendances repriced at discharge"
      - name: revcap_pre_step_down_cents
        type: integer
        source: computed
        description: "Frozen revenue-cap snapshot captured immediately before each step-down transition; null before the first step-down"
      - name: revcap_post_step_down_cents
        type: integer
        source: computed
        description: "Frozen revenue-cap snapshot captured immediately after each step-down transition; null before the first step-down"

  # ---------------------------------------------------------------------------
  - name: ClinicalAssessment
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the assessed episode"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: assessor_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the clinician performing the assessment"
      - name: assessed_at
        type: datetime
        source: system
        description: "Server-stamped ISO 8601 UTC instant of assessment completion"
      - name: dimension_scores
        type: object
        source: input
        description: "Six ASAM dimensions, each an integer 0..4: withdrawal_risk, biomedical_conditions, emotional_behavioral, readiness_to_change, relapse_potential, recovery_environment"
      - name: placement_basis
        type: enum
        source: system
        default: DIMENSION_SUM
        description: "Frozen record of which asam_level_placement variant produced this row's recommended_level: DIMENSION_SUM | HIGHEST_DIMENSION_FLOOR"
      - name: total_score
        type: integer
        source: computed
        description: "Weighted sum of the six dimension scores; see calculations.asam_level_placement"
      - name: recommended_level
        type: enum
        source: computed
        description: "ASAM level derived from total_score by the assessment-based variant of calculations.asam_level_placement"
      - name: status
        type: enum
        source: system
        description: "IN_PROGRESS | COMPLETED | SUPERSEDED | CANCELLED"

  # ---------------------------------------------------------------------------
  - name: LevelOfCareAuthorization
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the authorized episode"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the payer funding this authorization"
      - name: requested_level
        type: enum
        source: input
        description: "ASAM level the facility requested: ASAM_1_0 | ASAM_2_1 | ASAM_3_1 | ASAM_3_5 | ASAM_3_7"
      - name: granted_level
        type: enum
        source: system
        description: "ASAM level the payer granted on approval; may be a step down from requested_level"
      - name: authorized_days
        type: integer
        source: system
        description: "Days granted for this authorization period"
      - name: days_used
        type: integer
        source: computed
        default: 0
        description: "Whole days of ASAM_3_x care consumed inside the current authorization, banked by each burn of the ops clock"
      - name: days_remaining
        type: integer
        source: computed
        description: "authorized_days - days_used; never negative"
      - name: review_due_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC instant the next concurrent review becomes due; equal to the logical now at grant plus (authorized_days - concurrent_review_interval_days) days"
      - name: concurrent_review_count
        type: integer
        source: computed
        default: 0
        description: "Number of completed concurrent reviews for this authorization"
      - name: urgency_score
        type: number
        source: computed
        description: "Step-down pressure score; see calculations.step_down_urgency_score"
      - name: posture
        type: enum
        source: computed
        default: PENDING
        description: "PENDING | APPROVED | CONCURRENT_REVIEW_DUE | EXTENDED | STEP_DOWN_REQUIRED | DENIED | EXHAUSTED | EXPIRED"

  # ---------------------------------------------------------------------------
  - name: MedicalClearance
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the episode being cleared"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: clearance_type
        type: enum
        source: input
        description: "MEDICAL | PSYCHIATRIC | TB_SCREEN"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | CLEARED | FAILED | EXPIRED"
      - name: ordered_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the clearance was ordered"
      - name: cleared_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the clearance was recorded as CLEARED; null otherwise"
      - name: expires_at
        type: datetime
        source: system
        description: "Cleared instant plus 7 days; exclusive"
      - name: window_hours_remaining
        type: integer
        source: computed
        description: "Whole hours until expires_at, compiled by rounding the exact hour delta to an integer FIRST; 0 at or after expiry"
      - name: window_days_remaining
        type: integer
        source: computed
        description: "round_half_up(window_hours_remaining / 24) — computed from the ALREADY-ROUNDED hour value, never from the raw hour delta"
      - name: effective_status
        type: enum
        source: computed
        description: "status, except a CLEARED clearance whose window_hours_remaining is 0 reads as EXPIRED"

  # ---------------------------------------------------------------------------
  - name: WithdrawalManagementPlan
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the episode under management"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: protocol
        type: enum
        source: input
        description: "Standing withdrawal protocol: NONE | ALCOHOL_TAPER | OPIOID_AGONIST | BENZO_TAPER"
      - name: ciwa_score
        type: integer
        source: system
        description: "Latest CIWA-style withdrawal severity score, 0..30"
      - name: ciwa_recorded_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant ciwa_score was last recorded"
      - name: dose_records
        type: array
        source: input
        description: "Medication reconciliation events; each element has medication_code, dose_mg, given_at, given_by_clinician_id"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | MEDICALLY_STABLE | COMPLICATED"

  # ---------------------------------------------------------------------------
  - name: TreatmentPlan
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the planned episode"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: author_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the clinician who authored the plan"
      - name: required_sessions_per_week
        type: integer
        source: computed
        description: "Weekly session requirement for the episode's assigned_level; see calculations.weekly_session_requirement"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | PENDING_COSIGN | ACTIVE | SUPERSEDED | REJECTED"
      - name: cosign_rationale_code
        type: string
        source: input
        description: "Rationale code recorded whenever the plan moves to PENDING_COSIGN"
      - name: version
        type: integer
        source: system
        description: "Optimistic concurrency version"

  # ---------------------------------------------------------------------------
  - name: SessionAttendance
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the attending episode"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: service_id
        type: string
        source: input
        description: "FK -> ServiceOffering.id; the service attended"
      - name: clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the clinician who ran the session"
      - name: scheduled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the session is scheduled to begin"
      - name: duration_minutes
        type: integer
        source: input
        description: "Scheduled session length in minutes"
      - name: attended
        type: boolean
        source: input
        description: "True when the patient attended; false records a no-show"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "SCHEDULED | ATTENDED | NO_SHOW | CANCELLED"
      - name: billing_amount_cents
        type: integer
        source: computed
        default: 0
        description: "Professional fee for this attendance; see calculations.session_billing_amount"

  # ---------------------------------------------------------------------------
  - name: LevelOfCareChange
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the episode changing level"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: authorization_id
        type: string
        source: input
        description: "FK -> LevelOfCareAuthorization.id; the authorization funding the target level"
      - name: bed_id
        type: string
        source: input
        description: "FK -> Bed.id; the bed targeted by this change; null for outpatient-network targets"
      - name: from_level
        type: enum
        source: system
        description: "ASAM level the episode is leaving"
      - name: to_level
        type: enum
        source: input
        description: "ASAM level the episode is moving to"
      - name: change_type
        type: enum
        source: system
        description: "STEP_DOWN | STEP_UP"
      - name: effective_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the change takes effect; drives the bed occupancy window"
      - name: retry_available_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant this AWAITING_DISCHARGE row may next act on its bed; null unless status is AWAITING_DISCHARGE"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "PLANNED | PENDING_DISCHARGE_ORDER | AWAITING_DISCHARGE | COMPLETED | CANCELLED"

  # ---------------------------------------------------------------------------
  - name: ContinuingCarePlan
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the discharging episode"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: housing_selection_basis
        type: enum
        source: input
        description: "EXPLICIT | RANKED_AUTO. EXPLICIT requires housing_id in the request; RANKED_AUTO resolves the placement at activation from the ranked affordable pool"
      - name: housing_id
        type: string
        source: system
        description: "FK -> RecoveryHousing.id; the recovery housing placement, resolved at activation to either the explicitly supplied row or the top-ranked affordable OPEN licensed row"
      - name: housing_window_start
        type: datetime
        source: input
        description: "Inclusive start of the requested housing window"
      - name: housing_window_end
        type: datetime
        source: input
        description: "Exclusive end of the requested housing window"
      - name: shelter_class
        type: enum
        source: input
        description: "RANKED_AUTO only: RESIDENTIAL | TRANSITIONAL | SOBER_DORM | MATRIX. A RESIDENTIAL plan requires a licensed house"
      - name: wants_recovery_only_house
        type: boolean
        source: input
        default: true
        description: "RANKED_AUTO only: when true the ranked pool excludes houses whose licensed flag is false"
      - name: alumni_contact_interval_days
        type: integer
        source: input
        description: "Days between successive alumni outcome-measurement contacts after discharge"
      - name: alumni_contacts_required
        type: integer
        source: input
        description: "Number of alumni contacts the episode expects after discharge"
      - name: authorizing_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the clinician who signed the continuing-care plan"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | ACTIVE | SUPERSEDED | CANCELLED"

  # ---------------------------------------------------------------------------
  - name: RecoveryHousing
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; sponsoring facility"
      - name: house_name
        type: string
        source: input
        description: "Recovery house name"
      - name: proximity_rank
        type: integer
        source: input
        description: "Sponsoring facility's proximity rank, 1 = closest to the patient's home ZIP"
      - name: day_rate_cents
        type: integer
        source: input
        description: "Daily bed rate in cents"
      - name: grab_barrier_hours
        type: integer
        source: input
        default: 0
        description: "Turnaround hours this house needs between two resident placements; 0 = no barrier, occupancy windows are treated as open-ended"
      - name: capacity_beds
        type: integer
        source: input
        description: "Total resident capacity; the recovery-housing ceiling sums this over OPEN rows"
      - name: licensed
        type: boolean
        source: computed
        description: "True when an Accreditation record of class RECOVERY_HOUSE is GRANTED and not EXPIRED for this facility's state_code"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | SUSPENDED"

  # ---------------------------------------------------------------------------
  - name: AlumniContact
    parent: TreatmentEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: system
        description: "FK -> TreatmentEpisode.id; the episode being followed"
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; admitting facility"
      - name: scheduled_for
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the outcome-measurement contact is due"
      - name: attempt_number
        type: integer
        source: system
        description: "1-based ordinal of this contact within the episode's contact schedule"
      - name: outcome
        type: enum
        source: system
        description: "PENDING | REACHED | UNREACHABLE | DECLINED | NO_CONTACT"
      - name: abstinent_at_contact
        type: boolean
        source: input
        description: "Self-reported abstinence at the moment of contact; only meaningful when outcome is REACHED"
      - name: record_filed_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the outcome was recorded; null while PENDING"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AlumniCoordinator who filed the outcome"

  # ---------------------------------------------------------------------------
  - name: Accreditation
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: system
        description: "FK -> Facility.id; the facility this accreditation belongs to"
      - name: accreditation_class
        type: enum
        source: input
        description: "ACCREDITATION_BODY | STATE_LICENSE | RECOVERY_HOUSE"
      - name: granting_body
        type: string
        source: input
        description: "Name of the granting body"
      - name: status
        type: enum
        source: system
        default: GRANTED
        description: "GRANTED | SUSPENDED | REVOKED | EXPIRED"
      - name: effective_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the accreditation becomes effective"
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the accreditation stops being effective; exclusive"
      - name: license_level_max
        type: enum
        source: input
        description: "Highest ASAM level this StateLicense permits; null for non-StateLicense classes"
      - name: credential_tier_min
        type: enum
        source: input
        description: "Lowest clinician credential tier this StateLicense permits; null for non-StateLicense classes"# =============================================================================
# §1.2 State Machine Table (6 machines; TreatmentEpisode carries two parallel
# dimensions, so 7 declared machines in total)
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: TreatmentEpisode
    field: clinical_status
    initial_state: AWAITING_ASSESSMENT
    terminal_states: [DISCHARGED]
    transitions:
      - from: AWAITING_ASSESSMENT
        to: UNDER_ASSESSMENT
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/assessments"
        actor: AdmissionsIntakeNurse
        preconditions:
          - "The facility has licensed == true (ERR_FACILITY_NOT_LICENSED)"
          - "The episode's clinical_status is AWAITING_ASSESSMENT (ERR_EPISODE_NOT_AWAITING_ASSESSMENT)"
        side_effects:
          - "A ClinicalAssessment row is created with status IN_PROGRESS"

      - from: UNDER_ASSESSMENT
        to: UNDER_ASSESSMENT
        trigger: "POST /facilities/{id}/assessments/{id}/complete with a second in-flight assessment already present"
        actor: Clinician
        preconditions:
          - "At least one other ClinicalAssessment for this episode already has status IN_PROGRESS"
        side_effects:
          - "The pre-existing IN_PROGRESS assessment's status becomes SUPERSEDED"
        note: "Self-loop: the episode dimension does not move; only the sibling assessment is superseded."

      - from: UNDER_ASSESSMENT
        to: AWAITING_AUTHORIZATION
        trigger: "POST /facilities/{id}/assessments/{id}/complete"
        actor: Clinician
        preconditions:
          - "The assessment's assessor Clinician.credential_tier is at or above Facility.state_min_credential_tier (ERR_ASSESSOR_CREDENTIAL_INSUFFICIENT)"
          - "The assessor holds a ClinicianFacilityCredential for this facility with is_usable == true (ERR_ASSESSOR_CREDENTIAL_INSUFFICIENT)"
        side_effects:
          - "The assessment's total_score and recommended_level are computed (calculations.asam_level_placement)"
          - "The assessment's status becomes COMPLETED and assessed_at is stamped"
          - "TreatmentEpisode.assigned_level becomes the assessment's recommended_level"
          - "Any other IN_PROGRESS assessment for this episode becomes SUPERSEDED"

      - from: UNDER_ASSESSMENT
        to: AWAITING_ASSESSMENT
        trigger: "POST /facilities/{id}/assessments/{id}/cancel"
        actor: Clinician
        preconditions:
          - "The assessment's status is IN_PROGRESS (ERR_ASSESSMENT_NOT_IN_PROGRESS)"
        side_effects:
          - "The assessment's status becomes CANCELLED"
          - "TreatmentEpisode.assigned_level is cleared back to its prior value and the episode returns to AWAITING_ASSESSMENT"

      - from: AWAITING_AUTHORIZATION
        to: AWAITING_ASSESSMENT
        trigger: "POST /facilities/{id}/assessments/{id}/cancel"
        actor: ClinicalDirector
        preconditions:
          - "The cancelled assessment's status is COMPLETED (ERR_ASSESSMENT_NOT_IN_PROGRESS)"
        side_effects:
          - "The completed assessment's status becomes CANCELLED and its level is superseded"
          - "TreatmentEpisode.assigned_level is cleared and clinical_status returns to AWAITING_ASSESSMENT for re-assessment"
          - "Any LevelOfCareAuthorization in PENDING or APPROVED posture for this episode becomes EXPIRED"
        note: "Genuine cycle: UNDER_ASSESSMENT → AWAITING_AUTHORIZATION → AWAITING_ASSESSMENT → UNDER_ASSESSMENT."

      - from: AWAITING_AUTHORIZATION
        to: AWAITING_AUTHORIZATION
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/authorizations"
        actor: UtilizationReviewer
        preconditions:
          - "The episode's most recent LevelOfCareAuthorization posture is DENIED, EXPIRED or EXHAUSTED (ERR_AUTHORIZATION_NOT_REOPENABLE)"
        side_effects:
          - "A new LevelOfCareAuthorization row is created with posture PENDING"
          - "If requested_level is ASAM_3_1, ASAM_3_5 or ASAM_3_7 the referenced Bed.status AVAILABLE becomes OCCUPIED"
          - "If requested_level is ASAM_1_0 or ASAM_2_1 nothing is held"

      - from: AWAITING_AUTHORIZATION
        to: AWAITING_ADMISSION
        trigger: "POST /facilities/{id}/authorizations/{id}/approve"
        actor: UtilizationReviewer
        preconditions:
          - "The authorization's posture is PENDING (ERR_AUTHORIZATION_NOT_PENDING)"
          - "The authorization's requested_level does not exceed Facility.as_level_max (ERR_LEVEL_EXCEEDS_FACILITY_LICENSE)"
          - "The payer's credential_min_tier_by_loc for the requested level is satisfied by the episode's treating plan author (ERR_PAYER_CREDENTIAL_TIER_UNMET)"
        side_effects:
          - "The authorization's granted_level = min(requested_level, requested_level minus any payer step-down demand) and posture becomes APPROVED"
          - "authorized_days is set from Payer.initial_authorized_days_by_loc for granted_level"
          - "review_due_at is computed as logical now plus (authorized_days - concurrent_review_interval_days) days"

      - from: AWAITING_ADMISSION
        to: IN_TREATMENT
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/admit"
        actor: AdmissionsIntakeNurse
        preconditions:
          - "The episode holds at least one MedicalClearance of clearance_type MEDICAL with status CLEARED and at least one of clearance_type TB_SCREEN with effective_status CLEARED (ERR_MEDICAL_CLEARANCE_NOT_CLEARED)"
          - "The episode's MedicalClearance of clearance_type TB_SCREEN has expires_at strictly greater than the logical now (ERR_MEDICAL_CLEARANCE_EXPIRED)"
          - "The episode's WithdrawalManagementPlan has status ACTIVE (ERR_WITHDRAWAL_MANAGEMENT_NOT_ACTIVE)"
          - "The episode's TreatmentPlan has status ACTIVE (ERR_TREATMENT_PLAN_NOT_ACTIVE)"
          - "Facility.licensed == true and an Accreditation of class ACCREDITATION_BODY with status GRANTED is on file (ERR_FACILITY_ACCREDITATION_INVALID)"
          - "The episode's LevelOfCareAuthorization days_remaining is strictly greater than 0 (ERR_AUTHORIZATION_DAYS_EXHAUSTED)"
          - "The authorization's bed hold is still OCCUPIED by this episode (ERR_BED_NOT_HELD)"
        side_effects:
          - "admitted_at is stamped with the logical now"
          - "clinical_status becomes IN_TREATMENT and care_level_status becomes ACTIVE"
          - "AlumniContact rows are NOT yet created; they are created at discharge"

      - from: IN_TREATMENT
        to: IN_TREATMENT
        trigger: "POST /facilities/{id}/facility-ops/run"
        actor: system
        preconditions:
          - "An Accreditation of class ACCREDITATION_BODY on file at this facility has status REVOKED or EXPIRED"
        side_effects:
          - "The episode's TreatmentPlan status is forced to PENDING_COSIGN and every SCHEDULED SessionAttendance row is rewritten to CANCELLED with a replacement row scheduled (calculations.attendance_ledger, compensating-action leg)"
        note: "The episode stays IN_TREATMENT; only the operative plan signature and the un-attended schedule are voided."

      - from: IN_TREATMENT
        to: COMPLETED
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/complete-treatment"
        actor: ClinicalDirector
        preconditions:
          - "The WithdrawalManagementPlan status is MEDICALLY_STABLE (ERR_WITHDRAWAL_MANAGEMENT_NOT_STABLE)"
          - "The TreatmentPlan status is ACTIVE and it carries a recorded co-sign approval (ERR_TREATMENT_PLAN_NOT_ACTIVE)"
          - "The episode has at least one SessionAttendance row per required_sessions_per_week for the assigned_level (ERR_CURRICULUM_NOT_COMPLETE)"
        side_effects:
          - "clinical_status becomes COMPLETED"
          - "treatment_revenue_cents is recomputed from all completed SessionAttendance rows (calculations.session_billing_amount)"

      - from: IN_TREATMENT
        to: IN_TREATMENT
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/discharge"
        actor: ClinicalDirector
        preconditions:
          - "No ContinuingCarePlan with status ACTIVE exists for the episode (ERR_CONTINUING_CARE_PLAN_REQUIRED)"
        side_effects:
          - "A LevelOfCareChange row is recorded with status AWAITING_DISCHARGE, bed_id set to the episode's current bed, from_level set to the episode's assigned_level and to_level set to the first entry of the payer's step_down_coverage_map below it"
          - "retry_available_at is set to now + 24 hours"
        note: "The episode itself does not move; the release is deferred onto the change row."

      - from: COMPLETED
        to: DISCHARGED
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/discharge"
        actor: ClinicalDirector
        side_effects:
          - "The completed episode moves to DISCHARGED only when a ContinuingCarePlan with status ACTIVE exists (ERR_AUTHORIZATION_REQUIRED)"
          - "discharged_at is stamped with the logical now"
          - "The episode's Bed.status OCCUPIED becomes CLEANING for the bed's cleaning_turnaround_hours"
          - "THE OCCUPANCY REOPENS ONLY AFTER: bed -> CLEANING (hop 1) -> the bed's next available instant is now + cleaning_turnaround_hours (hop 2) -> the ops clock burn re-evaluates that instant (hop 3)"
          - "The payer's step-down coverage map is resolved (calculations.step_down_coverage_resolution) and the covering levels become STEPPED_DOWN-eligible"
          - "AlumniContact rows are created at the interval from ContinuingCarePlan.alumni_contact_interval_days"

      - from: DISCHARGED
        to: DISCHARGED
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/discharge"
        actor: ClinicalDirector
        side_effects: []
        note: "Terminal lockdown: DISCHARGED is terminal; a second discharge returns ERR_ALREADY_DISCHARGED."

  # ---------------------------------------------------------------------------
  - entity: TreatmentEpisode
    field: care_level_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: ACTIVE
        trigger: "system (episode admission)"
        actor: system
        preconditions:
          - "clinical_status just became IN_TREATMENT"
        side_effects: []

      - from: ACTIVE
        to: STEP_DOWN_PENDING
        trigger: "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"
        actor: ClinicalDirector
        preconditions:
          - "episode.step_down_count is strictly less than 2 (ERR_MAX_STEP_DOWNS_REACHED)"
          - "The episode's LevelOfCareAuthorization.payer_id and the resulting change never exceeds 5 in total (ERR_MAX_CHANGE_PER_PAYER)"
        side_effects:
          - "A LevelOfCareChange row is created with status PLANNED and change_type STEP_DOWN"
          - "The target Bed for the current occupancy is held as COMPLETED only if to_level is ASAM_3_1, ASAM_3_5 or ASAM_3_7"
          - "The target LevelOfCareChange.effective_at is captured for the canonical occupancy window"

      - from: STEP_DOWN_PENDING
        to: STEPPED_DOWN
        trigger: "system (level-of-care change completion)"
        actor: system
        preconditions:
          - "The LevelOfCareChange.status is COMPLETED"
        side_effects:
          - "step_down_count increments by 1"
          - "revcap_post_step_down_cents is frozen"
          - "The episode's old Bed.status OCCUPIED becomes CLEANING"
          - "The new Bed.status AVAILABLE becomes OCCUPIED"

      - from: STEPPED_DOWN
        to: STEP_DOWN_PENDING
        trigger: "system (payer step-down demand)"
        actor: system
        preconditions:
          - "The active LevelOfCareAuthorization.posture is STEP_DOWN_REQUIRED"
          - "The payer's step_down_coverage_map still names an unfunded lower level for the current granted_level"
        side_effects:
          - "A LevelOfCareChange row is created with status PLANNED"

      - from: STEPPED_DOWN
        to: ACTIVE
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/cancel"
        actor: ClinicalDirector
        side_effects:
          - "step_down_count decrements by 1"
          - "The level returns to the change's from_level and the episode's Bed returns to the changed-away Bed.status"
          - "STEP_DOWN_PENDING is likewise reverted to ACTIVE by the same cancel path"

  # ---------------------------------------------------------------------------
  - entity: ClinicalAssessment
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /facilities/{id}/assessments/{id}/complete"
        actor: Clinician
        preconditions:
          - "assessor_clinician_id names a Clinician with a usable credential at this facility"
        side_effects:
          - "A new ClinicalAssessment is created with status IN_PROGRESS and the episode dimension moves to AWAITING_AUTHORIZATION or stays UNDER_ASSESSMENT"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /facilities/{id}/assessments/{id}/cancel"
        actor: Clinician
        side_effects: []

      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /facilities/{id}/assessments/{id}/cancel"
        actor: ClinicalDirector
        preconditions:
          - "CareEpisode has any in-flight ClinicalAssessment"
        side_effects:
          - "The completed assessment's level is superseded by the newer assessment"
          - "TreatmentEpisode.assigned_level is cleared back to AWAITING_ASSESSMENT for re-assessment (a genuine clinical_status reversion)"

  # ---------------------------------------------------------------------------
  - entity: LevelOfCareAuthorization
    initial_state: PENDING
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /facilities/{id}/authorizations/{id}/approve"
        actor: UtilizationReviewer
        side_effects: []

      - from: PENDING
        to: DENIED
        trigger: "POST /facilities/{id}/authorizations/{id}/deny"
        actor: UtilizationReviewer
        side_effects: []

      - from: APPROVED
        to: APPROVED
        trigger: "POST /facilities/{id}/authorizations/{id}/submit-concurrent-review"
        actor: UtilizationReviewer
        side_effects:
          - "authorized_days is extended by Payer.concurrent_review_interval_days"
          - "review_due_at is recomputed from the new authorized_days"
          - "concurrent_review_count increments by 1"

      - from: APPROVED
        to: STEP_DOWN_REQUIRED
        trigger: "POST /facilities/{id}/authorizations/{id}/deny"
        actor: UtilizationReviewer
        preconditions:
          - "days_used is strictly greater than 0 (ERR_AUTHORIZATION_UNUSED)"
        side_effects:
          - "The payer's step_down_coverage_map promotes the next covered lower level and the target Bed is held for the next change"
          - "TreatmentEpisode.care_level_status ACTIVE becomes STEP_DOWN_PENDING"

      - from: CONCURRENT_REVIEW_DUE
        to: STEP_DOWN_REQUIRED
        trigger: "POST /facilities/{id}/authorizations/{id}/deny"
        actor: UtilizationReviewer
        preconditions:
          - "days_used is strictly greater than 0 (ERR_AUTHORIZATION_UNUSED)"
        side_effects:
          - "Same as APPROVED -> STEP_DOWN_REQUIRED: the coverage map is forced and the episode enters STEP_DOWN_PENDING"

      - from: DENIED
        to: DENIED
        trigger: "POST /facilities/{id}/authorizations/{id}/deny"
        actor: UtilizationReviewer
        side_effects: []
        note: "Repeated denial returns ERR_AUTHORIZATION_ALREADY_DENIED."

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (facility-ops run)"
        actor: system
        preconditions:
          - "days_remaining == 0 and the episode's clinical_status is IN_TREATMENT"
        side_effects:
          - "The payer's step_down_coverage_map is forced and the episode's care_level_status becomes STEP_DOWN_PENDING"
          - "The episode's TreatmentPlan status becomes SUPERSEDED"

      - from: EXHAUSTED
        to: EXHAUSTED
        trigger: "POST /facilities/{id}/authorizations/{id}/submit-concurrent-review"
        actor: UtilizationReviewer
        side_effects: []
        note: "An exhausted authorization cannot be extended; the review returns ERR_AUTHORIZATION_DAYS_EXHAUSTED."

  # ---------------------------------------------------------------------------
  - entity: Accreditation
    initial_state: GRANTED
    terminal_states: [REVOKED]
    transitions:
      - from: GRANTED
        to: GRANTED
        trigger: "POST /facilities/{id}/accreditations/{id}/renew"
        actor: ClinicalDirector
        side_effects:
          - "expires_at is pushed forward by 365 days"

      - from: GRANTED
        to: EXPIRED
        trigger: "system (facility-ops run)"
        actor: system
        side_effects:
          - "Facility.as_level_max is recomputed; when a STATE_LICENSE(ACCREDITATION_BODY) expires the facility drops to ASAM_1_0 and is_accepting_admissions becomes false"

      - from: GRANTED
        to: SUSPENDED
        trigger: "POST /facilities/{id}/accreditations/{id}/suspend"
        actor: ClinicalDirector
        side_effects:
          - "Any dependent LevelOfCareAuthorization whose granted_level exceeds the facility's remaining license becomes STEP_DOWN_REQUIRED"

      - from: EXPIRED
        to: GRANTED
        trigger: "POST /facilities/{id}/accreditations/{id}/renew"
        actor: ClinicalDirector
        side_effects:
          - "expires_at is pushed forward by 365 days"
          - "Facility.licensed recomputes and is_accepting_admissions becomes true again"

      - from: SUSPENDED
        to: GRANTED
        trigger: "POST /facilities/{id}/accreditations/{id}/reinstate"
        actor: ClinicalDirector
        side_effects:
          - "Facility.licensed recomputes and any episode held at CARE_HOLD returns to its carry-over status"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /facilities/{id}/accreditations/{id}/revoke"
        actor: ClinicalDirector
        side_effects:
          - "Facility.is_accepting_admissions becomes false"
          - "Facility.licensed becomes false when the revoked row is the only GRANTED StateLicense for the state_code"

  # ---------------------------------------------------------------------------
  - entity: LevelOfCareChange
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PENDING_DISCHARGE_ORDER
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/complete"
        actor: ClinicalDirector
        preconditions:
          - "The change's effective_at is at or before the logical now (ERR_CHANGE_NOT_DUE)"
          - "No direct step-down onto a bed applies: either to_level is ASAM_1_0 or ASAM_2_1, or no bed_id was supplied (ERR_CHANGE_BRANCH_NOT_APPLICABLE)"
        side_effects:
          - "The source Bed.status CLEANING window is opened only when the change completes"
          - "The change may not complete until its target authorization is APPROVED"

      - from: PLANNED
        to: COMPLETED
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/complete"
        actor: ClinicalDirector
        preconditions:
          - "The change's effective_at is at or before the logical now (ERR_CHANGE_NOT_DUE)"
          - "The change's to_level rank is strictly below its from_level rank (a genuine step-down onto a bed) (ERR_CHANGE_BRANCH_NOT_APPLICABLE)"
          - "The change's target authorization posture is APPROVED (ERR_AUTHORIZATION_NOT_APPROVED)"
        side_effects:
          - "status becomes COMPLETED; the source bed OCCUPIED becomes CLEANING and the target bed AVAILABLE becomes OCCUPIED"
          - "Episode care_level_status becomes STEPPED_DOWN; step_down_count increments by 1"
          - "revcap_pre_step_down_cents and revcap_post_step_down_cents are frozen"

      - from: PENDING_DISCHARGE_ORDER
        to: COMPLETED
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/complete"
        actor: ClinicalDirector
        preconditions:
          - "The target level authorization is APPROVED (ERR_AUTHORIZATION_NOT_APPROVED)"
        side_effects:
          - "The change's status becomes COMPLETED and the episode dimension becomes STEPPED_DOWN"

      - from: AWAITING_DISCHARGE
        to: AWAITING_DISCHARGE
        trigger: "POST /facilities/{id}/facility-ops/run (stages 3 and 7, alternating)"
        actor: system
        preconditions:
          - "The change's retry_available_at is at or before the logical now"
        side_effects:
          - "Stage 3: the change's bed_id is held in CLEANING for the run instant"
          - "Stage 7, on the following run: the bed returns to AVAILABLE and retry_available_at advances by 24 hours, so the row cycles without ever completing while the continuing-care gap persists"
        note: "This is the cyclic evidence for the change ledger: AWAITING_DISCHARGE -> bed CLEANING -> AWAITING_DISCHARGE with a fresh barrier."

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/cancel"
        actor: ClinicalDirector
        side_effects: []

      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/cancel"
        actor: ClinicalDirector
        preconditions:
          - "No facility-ops run has been performed at this facility between the change's completion and this cancel (ERR_EPOCH_STALE)"
        side_effects:
          - "The change's step_down_count delta of +1 is reversed with a -1"
          - "The target Bed.status OCCUPIED becomes AVAILABLE and the source Bed.status CLEANING becomes OCCUPIED"

      - from: COMPLETED
        to: "COMPLETED-STEP-UP"
        trigger: "POST /facilities/{id}/level-of-care-changes/{id}/step-up"
        actor: ClinicalDirector
        preconditions:
          - "The episode's WithdrawalManagementPlan.status is COMPLICATED (ERR_WITHDRAWAL_MANAGEMENT_NOT_COMPLICATED)"
          - "A Bed at the higher level is AVAILABLE within the requested window (ERR_BED_NOT_AVAILABLE)"
        side_effects:
          - "A new LevelOfCareChange with change_type STEP_UP is created and completed"
          - "The episode's assigned_level rises to the higher level and step_down_count is decremented by 1 (floor 0)"

  # ---------------------------------------------------------------------------
  - entity: AlumniContact
    initial_state: PENDING
    terminal_states: [REACHED, UNREACHABLE, DECLINED]
    transitions:
      - from: PENDING
        to: REACHED
        trigger: "POST /facilities/{id}/alumni-contacts/{id}/record"
        actor: AlumniCoordinator
        side_effects:
          - "abstinent_at_contact is stored and record_filed_at is stamped"

      - from: PENDING
        to: UNREACHABLE
        trigger: "POST /facilities/{id}/alumni-contacts/{id}/record"
        actor: AlumniCoordinator
        side_effects: []

      - from: PENDING
        to: DECLINED
        trigger: "POST /facilities/{id}/alumni-contacts/{id}/record"
        actor: AlumniCoordinator
        side_effects: []

      - from: PENDING
        to: NO_CONTACT
        trigger: "system (facility-ops run advances past the contact window)"
        actor: system
        preconditions:
          - "The contact's scheduled_for is at or before the logical now and the contact is still PENDING"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (4 OCC rules — all pass the serial-observability
# filter: a strictly sequential second request sees identical state and would
# itself legitimately succeed under the natural product semantics)
# =============================================================================
concurrency_rules:
  - rule_id: treatment-plan-create-stale-episode
    parent_entity: TreatmentEpisode
    write_endpoint: "POST /treatment-network/facilities/{id}/treatment-episodes/{episodeId}/treatment-plans"
    occ_field: "expected_treatment_episode_version"
    description: |
      Creating a TreatmentPlan against a TreatmentEpisode whose version has
      advanced since the client last observed it is rejected. A new plan
      legitimately supersedes the prior ACTIVE plan, so a later sequential
      create would otherwise succeed against a stale view of the episode.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: level-change-create-stale-episode
    parent_entity: TreatmentEpisode
    write_endpoint: "POST /treatment-network/facilities/{id}/treatment-episodes/{episodeId}/level-of-care-changes"
    occ_field: "expected_treatment_episode_version"
    description: |
      Creating a LevelOfCareChange against a TreatmentEpisode whose version
      has advanced since the client last observed it is rejected. Each row's
      step_down_count is incremented on appointment, so a later sequential
      create would otherwise succeed against a stale view of the episode.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: continuing-care-plan-create-stale-episode
    parent_entity: TreatmentEpisode
    write_endpoint: "POST /treatment-network/facilities/{id}/treatment-episodes/{episodeId}/continuing-care-plans"
    occ_field: "expected_treatment_episode_version"
    description: |
      Creating a ContinuingCarePlan against a TreatmentEpisode whose version
      has advanced since the client last observed it is rejected. A new plan
      legitimately supersedes the prior ACTIVE plan at discharge planning
      time, so a later sequential create would otherwise succeed against a
      stale view of the episode.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-void-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "PUT /treatment-network/treatment-plans/{id}"
    occ_field: "expected_treatment_plan_version"
    description: |
      Editing a TreatmentPlan whose version has advanced since the client last
      observed it is rejected. A concurrent-review co-sign legitimately bumps
      the plan version, and the edit itself would otherwise succeed against a
      stale view of the plan.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table (12 rules)
# =============================================================================
calculations:
  # ---------------------------------------------------------------------------
  - name: asam_level_placement
    trigger: "ClinicalAssessment completion (POST .../assessments/{id}/complete) and assessment re-read"
    algorithm: weighted_scoring
    formula: |
      DUAL VARIANT. Two valid readings of the same six dimension scores produce
      different ASAM levels; the caller pins which reading it wants. The chosen
      reading is frozen onto the row as ClinicalAssessment.placement_basis so
      both readings remain comparable after the placement is written.

      Reachability of variant B: an assessment is created with placement_basis
      DIMENSION_SUM, completed (variant A places the episode), then cancelled —
      which returns the episode to AWAITING_ASSESSMENT carrying the original
      dimension_scores — and re-created with the SAME dimension_scores and
      placement_basis HIGHEST_DIMENSION_FLOOR. Both assessments are then
      readable side by side.

      Common inputs: dimension_scores has exactly six integer members 0..4 —
      withdrawal_risk, biomedical_conditions, emotional_behavioral,
      readiness_to_change, relapse_potential, recovery_environment.

      total_score = 3*withdrawal_risk + 2*biomedical_conditions
                  + 2*emotional_behavioral + 1*readiness_to_change
                  + 3*relapse_potential + 1*recovery_environment
      TOTAL_SCORE_MAX = 48 and TOTAL_SCORE_MIN = 0 are the declared bounds.

      VARIANT A — dimension_sum_placement (the default; applied when
      placement_basis is absent or equals "DIMENSION_SUM"):
        recommended_level =
          ASAM_3_7 if total_score >= 44
          ASAM_3_5 if total_score >= 36 and total_score < 44
          ASAM_3_1 if total_score >= 28 and total_score < 36
          ASAM_2_1 if total_score >= 18 and total_score < 28
          ASAM_1_0 otherwise (total_score < 18)

      VARIANT B — highest_dimension_floor (applied when placement_basis equals
      "HIGHEST_DIMENSION_FLOOR"):
        single_dimension_floor =
          ASAM_3_7 if withdrawal_risk == 4
          ASAM_3_5 if withdrawal_risk == 3 or relapse_potential == 4
          ASAM_3_1 if relapse_potential == 3 or biomedical_conditions == 4
          ASAM_2_1 if emotional_behavioral == 4
          ASAM_1_0 otherwise
        recommended_level = the higher-ranked of (variant A level, single_dimension_floor)

      Rank order, lowest first: ASAM_1_0 < ASAM_2_1 < ASAM_3_1 < ASAM_3_5 < ASAM_3_7.
      Rank numbers used by every other rule: 0, 1, 2, 3, 4 in that same order.

    input_set: "Exactly one ClinicalAssessment row; the six dimension_scores and the placement_basis supplied at assessment creation"
    constants:
      WEIGHT_WITHDRAWAL_RISK: 3
      WEIGHT_BIOMEDICAL_CONDITIONS: 2
      WEIGHT_EMOTIONAL_BEHAVIORAL: 2
      WEIGHT_READINESS_TO_CHANGE: 1
      WEIGHT_RELAPSE_POTENTIAL: 3
      WEIGHT_RECOVERY_ENVIRONMENT: 1
      THRESHOLD_2_1: 18
      THRESHOLD_3_1: 28
      THRESHOLD_3_5: 36
      THRESHOLD_3_7: 44
      MAX_DIMENSION_SCORE: 4
      MAX_TOTAL_SCORE: 48
    precision: "integer points; total_score is exact, no rounding"
    variants:
      - name: dimension_sum_placement
        when: "placement_basis is absent or equals DIMENSION_SUM"
        difference: "Places purely on the weighted total; a single saturated dimension cannot pull the placement above what the total earns."
      - name: highest_dimension_floor
        when: "placement_basis equals HIGHEST_DIMENSION_FLOOR"
        difference: "Raises the placement to the floor implied by the single worst dimension regardless of the total, so identical dimension_scores can land one or more levels higher than variant A."

  # ---------------------------------------------------------------------------
  - name: step_down_urgency_score
    trigger: "authorization approval, authorization concurrent review, facility-ops run, withdrawal-management status change"
    algorithm: weighted_scoring
    formula: |
      DUAL VARIANT. Both variants read the same authorization but measure
      consumption against different denominators. Both operate on the
      LevelOfCareAuthorization / WithdrawalManagementPlan domain only — the
      payer-adjudication subject, deliberately disjoint from the
      facility-accreditation subject of tiered_compliance_risk_deduction.

      Shared sub-terms (identical in both variants):
        GRANTED_LEVEL_RANK: ASAM_3_7=4, ASAM_3_5=3, ASAM_3_1=2, ASAM_2_1=1, ASAM_1_0=0
        cost_pressure = (GRANTED_LEVEL_RANK[granted_level] - TARGET_LEVEL_RANK) * COST_UNIT
        clinical_pressure =
          +CLINICAL_STABLE_BONUS   if WithdrawalManagementPlan.status == MEDICALLY_STABLE
          +CLINICAL_ACTIVE_BONUS   if WithdrawalManagementPlan.status == ACTIVE
          -CLINICAL_COMPLICATED_PENALTY if WithdrawalManagementPlan.status == COMPLICATED
        TERM_FLOOR applies to the final sum, never to an individual term.

      VARIANT A — consumed_fraction_pressure (the value persisted in
      LevelOfCareAuthorization.urgency_score):
        time_pressure = 0 if authorized_days == 0
                        else (days_used / authorized_days) * TIME_WEIGHT
        urgency_score = round_half_up(
            max(TERM_FLOOR, time_pressure + cost_pressure + clinical_pressure), 1)

      VARIANT B — extended_window_pressure (exposed only by
      GET /facilities/{id}/treatment-episodes/{id}/utilization-summary as
      projected_step_down_urgency; never persisted):
        extended_days = authorized_days + concurrent_review_count * Payer.concurrent_review_interval_days
        time_pressure = 0 if extended_days == 0
                        else (days_used / extended_days) * TIME_WEIGHT
        projected_step_down_urgency = round_half_up(
            max(TERM_FLOOR, time_pressure + cost_pressure + clinical_pressure), 1)

      Rounding order: each variant rounds its own final sum once, at 1 decimal
      place, round_half_up. Sub-terms are never pre-rounded.

      Worked divergence and worked absolute values. Take granted_level
      ASAM_3_5, days_used 7, authorized_days 14, concurrent_review_count 1,
      payer.concurrent_review_interval_days 7, WithdrawalManagementPlan.status
      MEDICALLY_STABLE, TARGET_LEVEL_RANK 1:
        cost_pressure = (3 - 1) * 8 = 16; clinical_pressure = +15
        variant A: time_pressure = (7/14)*60 = 30.0
                   urgency_score = round_half_up(30.0 + 16 + 15, 1) = 61.0
        variant B: extended_days = 14 + 1*7 = 21; time_pressure = (7/21)*60 = 20.0
                   projected_step_down_urgency = round_half_up(20.0 + 16 + 15, 1) = 51.0
      At concurrent_review_count 0 the two variants agree exactly (both 61.0),
      so the divergence is strictly a function of completed concurrent reviews.

      TERM_FLOOR non-trigger example: granted_level ASAM_3_1 (rank 2), days_used 0,
      authorized_days 10, status ACTIVE gives 0 + (2-1)*8 + 5 = 13.0, comfortably
      above the floor, so the floor is not observable there.
      TERM_FLOOR trigger example: granted_level ASAM_3_5 (rank 3), days_used 4,
      authorized_days 14, status COMPLICATED gives (4/14)*60 = 17.142857...,
      cost_pressure 16, clinical_pressure -20; the raw sum is 13.142857... > 0,
      so the floor still does not bind. The floor binds only when cost_pressure
      alone would be negative, which cannot occur because
      TARGET_LEVEL_RANK is fixed at 1 while granted_level for a live
      authorization is never below ASAM_2_1; the floor is therefore declared
      for completeness and is asserted as a NO-OP in the corner suite.

    input_set: "One LevelOfCareAuthorization row whose posture is in {APPROVED, CONCURRENT_REVIEW_DUE, EXTENDED, STEP_DOWN_REQUIRED, EXHAUSTED}, plus its episode's WithdrawalManagementPlan"
    constants:
      TIME_WEIGHT: 60
      COST_UNIT: 8
      TARGET_LEVEL_RANK: 1
      CLINICAL_STABLE_BONUS: 15
      CLINICAL_ACTIVE_BONUS: 5
      CLINICAL_COMPLICATED_PENALTY: 20
      TERM_FLOOR: 0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: consumed_fraction_pressure
        when: "always for LevelOfCareAuthorization.urgency_score"
        difference: "Denominator is authorized_days alone, so every concurrent review raises urgency."
      - name: extended_window_pressure
        when: "only on the utilization-summary computed read"
        difference: "Denominator includes every concurrent-review extension, so the same authorization reports a strictly lower urgency than variant A once concurrent_review_count >= 1."

  # ---------------------------------------------------------------------------
  - name: tiered_compliance_risk_deduction
    trigger: "facility-ops run (POST /facilities/{id}/facility-ops/run) and accreditation status change"
    algorithm: tiered_pricing
    formula: |
      MODE (a): three inputs with non-linear interaction, nested min/max, and a
      tiered-rate selection whose multiplier is chosen from the raw score.

      Step 1 — raw accumulation:
        expired_count      = count of Accreditation rows for this facility whose
                             status == GRANTED and expires_at <= logical now
        missing_class_count = count of classes in
                             {ACCREDITATION_BODY, STATE_LICENSE, RECOVERY_HOUSE}
                             for which this facility has no GRANTED row
        longest_days_since_expiry = max over the expired rows of
                             floor((logical now - expires_at) / 1 day), or 0 when
                             expired_count == 0

      Step 2 — aged component (nested min over a max):
        aged_units   = min(AGED_CAP, floor(max(0, longest_days_since_expiry) / 30))
        aged_points  = aged_units * AGED_UNIT

      Step 3 — raw score:
        raw = expired_count * EXPIRED_UNIT + missing_class_count * MISSING_UNIT + aged_points

      Step 4 — tiered-rate selection (strictly greater-than boundaries):
        tier = PREMIUM if raw > PREMIUM_MIN
               HI      if raw > HI_MIN and raw <= PREMIUM_MIN
               MODERATE if raw > MODERATE_MIN and raw <= HI_MIN
               BASE    otherwise (raw <= MODERATE_MIN)
        multiplier = PREMIUM: 1.5, HI: 1.25, MODERATE: 1.0, BASE: 1.0

      Step 5 — final:
        compliance_risk_points = int(round_half_up(raw * multiplier, 0))

      Facility.facility_posture is then derived from the SAME final field:
        OPEN       if compliance_risk_points < POSTURE_RESTRICTED_MIN
        RESTRICTED if compliance_risk_points >= POSTURE_RESTRICTED_MIN
                      and compliance_risk_points < POSTURE_FROZEN_MIN
        FROZEN     if compliance_risk_points >= POSTURE_FROZEN_MIN
    input_set: "All Accreditation rows of one facility, filtered to status == GRANTED; the three accreditation classes; the logical clock"
    constants:
      EXPIRED_UNIT: 12
      MISSING_UNIT: 5
      AGED_CAP: 6
      AGED_UNIT: 2
      MODERATE_MIN: 10
      HI_MIN: 30
      PREMIUM_MIN: 60
      POSTURE_RESTRICTED_MIN: 45
      POSTURE_FROZEN_MIN: 60
      TIER_MULTIPLIER_BASE: 1.0
      TIER_MULTIPLIER_MODERATE: 1.0
      TIER_MULTIPLIER_HI: 1.25
      TIER_MULTIPLIER_PREMIUM: 1.5
      DAYS_PER_AGED_UNIT: 30
    precision: "integer points; the multiplier is applied once to the whole raw score, never per term"

  # ---------------------------------------------------------------------------
  - name: facility_posture_derivation
    trigger: "facility-ops run, accreditation status change, facility creation"
    algorithm: threshold
    formula: |
      MODE (a), second instance and deliberately a DIFFERENT application of the
      mode than tiered_compliance_risk_deduction: where that rule selects a
      multiplier from a tier and applies it, this rule performs a 3-way band
      selection over the SAME finalized integer with two independent cut points
      and no multiplier at all.

      facility_posture =
        FROZEN     if compliance_risk_points >= POSTURE_FROZEN_MIN
        RESTRICTED if compliance_risk_points >= POSTURE_RESTRICTED_MIN
                      and compliance_risk_points < POSTURE_FROZEN_MIN
        OPEN       if compliance_risk_points < POSTURE_RESTRICTED_MIN

      is_accepting_admissions =
        false if facility_posture == FROZEN
        false if licensed == false
        true otherwise

      BOUNDARY: compliance_risk_points == 45 lands RESTRICTED (not OPEN),
      compliance_risk_points == 44 lands OPEN, compliance_risk_points == 60
      lands FROZEN (not RESTRICTED), compliance_risk_points == 59 lands
      RESTRICTED.

    input_set: "One Facility row's compliance_risk_points, licensed flag and current accreditation set"
    constants:
      POSTURE_RESTRICTED_MIN: 45
      POSTURE_FROZEN_MIN: 60
    precision: "integer points; no rounding"

  # ---------------------------------------------------------------------------
  - name: medical_clearance_window_remaining
    trigger: "read of a MedicalClearance, and the admit precondition check"
    algorithm: threshold
    formula: |
      MODE (b): nested rounding where the order is load-bearing. The scaffold
      pins ONE order and explicitly rejects the other.

      hours_remaining_exact = (expires_at - logical now) expressed as an exact
                              decimal number of hours (may be negative)
      step1 = max(0, hours_remaining_exact)
      step2 = round_half_up(step1, 0)          # round the HOUR count to whole hours
      window_hours_remaining   = int(step2)
      clearance_window_days_remaining = round_half_up(step2 / 24.0, 0)

      PINNED ORDER — the hour count is rounded to a whole hour FIRST and only
      that whole-hour value is divided by 24. The rejected alternative order
      (divide hours_remaining_exact by 24 first, then round) is NOT what this
      rule means and produces a different answer. Worked divergence:
      hours_remaining_exact == 35.7 gives step2 == 36, so
      clearance_window_days_remaining == round_half_up(1.5, 0) == 2; the
      rejected order gives round_half_up(1.4875, 0) == 1.

      MedicalClearance.effective_status is then derived from the same field:
        CLEARED if window_hours_remaining > 0
        EXPIRED if window_hours_remaining == 0 (including the exactly-zero case)
      The admit precondition tests window_hours_remaining > 0, so an
      expires_at exactly equal to the logical now is EXPIRED, not CLEARED.
    input_set: "One MedicalClearance row with status == CLEARED, its expires_at, and the logical clock"
    constants:
      CLEARANCE_VALIDITY_DAYS: 7
      HOURS_PER_DAY: 24
    precision: "hours rounded to integer with round_half_up; days rounded to integer with round_half_up applied to the already-rounded hour value"

  # ---------------------------------------------------------------------------
  - name: step_down_coverage_resolution
    trigger: "step-down transition, discharge, and any read of a LevelOfCareAuthorization.payer coverage"
    algorithm: constraint_propagation
    formula: |
      MODE (c): a circular-LOOKING dependency whose evaluation order the
      scaffold pins so the value is well-defined. compliance_risk_points is
      produced by tiered_compliance_risk_deduction, which is itself re-run by
      the same facility-ops cycle that proposes the step-down, and
      step_down_savings_cents is derived from it. The pipeline is acyclic once
      the order is fixed.

      PINNED EVALUATION ORDER (stages never interleave):
        (i)   recompute compliance_risk_points via
              tiered_compliance_risk_deduction against the current accreditation set
        (ii)  target_level = the first entry of
              Payer.step_down_coverage_map[granted_level], read in the order the
              map lists them, whose rank is strictly below rank(granted_level);
              if the map has no such entry the resolution fails with
              ERR_STEP_DOWN_MAP_EXHAUSTED
        (iii) gross_daily_cents = BASE_DAILY_CENTS[target_level]
              net_daily_cents = int(round_half_up(gross_daily_cents
                                  * (1 - compliance_risk_points / 100), 0))
        (iv)  step_down_savings_cents =
                int(round_half_up(BASE_DAILY_CENTS[granted_level] - net_daily_cents, 0))

      The deduction is applied to the TARGET level's price only; the source
      level's price enters unadjusted at stage (iv).

      Rank order, lowest first: ASAM_1_0 < ASAM_2_1 < ASAM_3_1 < ASAM_3_5 < ASAM_3_7.
    input_set: "The authorization's payer_id, granted_level, the facility's current accreditation set, and the logical clock"
    constants:
      BASE_DAILY_CENTS:
        ASAM_3_7: 4200
        ASAM_3_5: 3600
        ASAM_3_1: 2800
        ASAM_2_1: 1400
        ASAM_1_0: 600
      SAVINGS_DEDUCTION_DENOMINATOR: 100
    precision: "cents rounded to integer with round_half_up, applied at stages (iii) and (iv) only"

  # ---------------------------------------------------------------------------
  - name: authorization_days_bank
    trigger: "facility-ops run (POST /facilities/{id}/facility-ops/run)"
    algorithm: aggregation
    formula: |
      ADVANCE-THEN-RECOMPUTE, with the boundary stated exactly.

      For each LevelOfCareAuthorization whose posture is in
      {APPROVED, CONCURRENT_REVIEW_DUE, EXTENDED, STEP_DOWN_REQUIRED}:

        burn_interval = the half-open interval
                 [max(Facility.last_ops_run_at, episode.admitted_at), logical now)
                 (on the facility's first run last_ops_run_at is null, so the
                 interval starts at episode.admitted_at)
        elapsed_whole_days = the count of whole days in burn_interval during
                 which the episode's clinical_status was IN_TREATMENT (a day
                 counts only if the WHOLE day falls inside burn_interval AND
                 inside the IN_TREATMENT span; the opening instant is inclusive
                 and the closing instant is exclusive)
        days_used    = min(authorized_days, days_used + elapsed_whole_days)
        days_remaining = authorized_days - days_used

      Posture re-derivation after the update, in this order:
        days_remaining == 0                                  -> EXHAUSTED
        days_remaining <= Payer.concurrent_review_interval_days  -> CONCURRENT_REVIEW_DUE
        otherwise                                            -> unchanged

      BOUNDARY (inclusive at the review threshold): days_remaining equal to
      exactly concurrent_review_interval_days triggers CONCURRENT_REVIEW_DUE;
      one more day does NOT. days_remaining equal to exactly 0 triggers
      EXHAUSTED and never CONCURRENT_REVIEW_DUE even when
      concurrent_review_interval_days is 0.
    input_set: "Every non-terminal LevelOfCareAuthorization row of the facility; the previous ops-run epoch; the logical clock"
    constants:
      BURN_INTERVAL_ANCHOR: "facility.last_ops_run_at, falling back to episode.admitted_at"
      REVIEW_GRACE_INCLUSIVE: true
    precision: "integer days; days_remaining never goes negative"

  # ---------------------------------------------------------------------------
  - name: weekly_session_requirement
    trigger: "TreatmentPlan creation and re-derivation on assigned_level change; curriculum compliance check on complete-treatment"
    algorithm: threshold
    formula: |
      required_sessions_per_week =
        5  if rank(assigned_level) <= rank(ASAM_2_1)      # ASAM_1_0 or ASAM_2_1
        10 if assigned_level == ASAM_3_1
        14 if assigned_level == ASAM_3_5 or assigned_level == ASAM_3_7
      rank(ASAM_1_0)=0, rank(ASAM_2_1)=1, rank(ASAM_3_1)=2, rank(ASAM_3_5)=3, rank(ASAM_3_7)=4

      For the current treatment week (the half-open interval
      [admitted_at + 7*n days, admitted_at + 7*(n+1) days) containing the logical now):
        attended_this_week = count of SessionAttendance rows whose status == ATTENDED
                             and whose scheduled_at falls in that interval
        curriculum_compliant = attended_this_week >= required_sessions_per_week
        compliance_percent = floor(100 * attended_this_week / required_sessions_per_week)

      BOUNDARY: attended_this_week equal to exactly required_sessions_per_week is
      compliant; required_sessions_per_week - 1 is not.
    input_set: "The episode's assigned_level and every SessionAttendance row of the episode"
    constants:
      REQUIRED_SESSIONS_ASAM_1_0: 5
      REQUIRED_SESSIONS_ASAM_2_1: 5
      REQUIRED_SESSIONS_ASAM_3_1: 10
      REQUIRED_SESSIONS_ASAM_3_5: 14
      REQUIRED_SESSIONS_ASAM_3_7: 14
      TREATMENT_WEEK_DAYS: 7
    precision: "integer counts; compliance_percent floors"

  # ---------------------------------------------------------------------------
  - name: bed_night_bank
    trigger: "authorization approval, step-down completion, step-down cancellation, discharge, facility-ops run"
    algorithm: aggregation
    formula: |
      INVARIANT over a named conserved quantity: committed_bed_nights.

      committed_bed_nights = count of Bed rows at this facility whose status == OCCUPIED

      FORWARD ACTION: completing a LevelOfCareChange whose to_level is a
      non-residential level (ASAM_1_0 or ASAM_2_1):
        source Bed.status OCCUPIED -> CLEANING
        committed_bed_nights decreases by exactly 1

      COMPENSATING ACTION: cancelling that same (already COMPLETED)
      LevelOfCareChange before the next facility-ops run:
        source Bed.status CLEANING -> OCCUPIED
        committed_bed_nights is restored to exactly its pre-appointment value

      INVARIANT: after any forward action immediately followed by its
      compensating action, committed_bed_nights == its pre-forward-action value.
      No step-down may leave committed_bed_nights drifted by even 1. Cancelling
      AFTER the next facility-ops run is refused (ERR_EPOCH_STALE), so the
      invariant is scoped to a same-epoch cancel.
    input_set: "Every Bed row of the facility; the LevelOfCareChange ledger of the facility since the last ops-run epoch"
    constants:
      RESIDENTIAL_MIN_RANK: 2
    precision: "integer bed count; no rounding"

  # ---------------------------------------------------------------------------
  - name: attendance_ledger
    trigger: "session scheduling, attendance recording, cancellation, plan invalidation"
    algorithm: projection
    formula: |
      INVARIANT over a named conserved quantity: attendance_ledger_entries.

      attendance_ledger_entries = total number of SessionAttendance rows ever
      created for the episode. Rows are NEVER deleted; a plan invalidation
      rewrites their status, it does not remove them.

      Derived per-row billing (also produces SessionAttendance.billing_amount_cents):
        billing_amount_cents =
          SERVICE_BASE_CENTS[service.level_of_care]
            * max(1, duration_minutes // MIN_BILLABLE_MINUTES)
          capped at MAX_SESSION_CENTS
        service.level_of_care base: ASAM_3_7=210, ASAM_3_5=180, ASAM_3_1=150,
                                   ASAM_2_1=110, ASAM_1_0=80
        a row's billing_amount_cents is 0 whenever status != ATTENDED

      Derived episode aggregate (also produces TreatmentEpisode.therapy_revenue_cents):
        therapy_revenue_cents = sum of billing_amount_cents over SessionAttendance
                                rows whose status == ATTENDED

      INVARIANT: attendance_ledger_entries ==
                 count(SCHEDULED) + count(ATTENDED) + count(NO_SHOW) + count(CANCELLED)

      COMPENSATION: when the TreatmentPlan is bumped back to PENDING_COSIGN (an
      ACCREDITATION_BODY revocation run by the facility-ops cycle), every
      SCHEDULED SessionAttendance row is rewritten to CANCELLED and a
      replacement row is scheduled for each, carrying the new plan's version.
      Re-attending the replacements must leave therapy_revenue_cents at exactly
      the pre-invalidation value.
    input_set: "Every SessionAttendance row of the episode, including CANCELLED and NO_SHOW rows"
    constants:
      SERVICE_BASE_CENTS:
        ASAM_3_7: 210
        ASAM_3_5: 180
        ASAM_3_1: 150
        ASAM_2_1: 110
        ASAM_1_0: 80
      MIN_BILLABLE_MINUTES: 60
      MAX_SESSION_CENTS: 900
    precision: "integer cents; the cap is applied once per row after the multiplier"

  # ---------------------------------------------------------------------------
  - name: facility_ops_batch
    trigger: "POST /facilities/{id}/facility-ops/run"
    algorithm: chronological
    formula: |
      A single ops-run advances the facility epoch by one. Facility.ops_epoch
      increments by 1 at the START of the run so every downstream stage reads
      the same epoch value.

      Stage order is fixed; a later stage observes the mutations of every
      earlier stage:
        1. burn the clock bucket and re-derive days_used / days_remaining /
           posture for every non-terminal LevelOfCareAuthorization
           (calculations.authorization_days_bank)
        2. recompute compliance_risk_points and facility_posture
           (calculations.tiered_compliance_risk_deduction)
        3. expire accreditations and CLEANING->AVAILABLE beds whose
           next_available_at <= logical now
        4. if facility_posture == FROZEN, force every IN_TREATMENT episode's
           TreatmentPlan status to PENDING_COSIGN and rewrite its SCHEDULED
           SessionAttendance rows to CANCELLED
        5. promote CONCURRENT_REVIEW_DUE authorizations to STEP_DOWN_REQUIRED
           when days_remaining <= concurrent_review_interval_days AND the
           episode is IN_TREATMENT AND the episode's TreatmentPlan.status is
           PENDING_COSIGN — a plan that lost its signature cannot carry the
           current level of care, so the payer must be stepped down. Then, for
           every episode whose care_level_status is STEP_DOWN_PENDING and whose
           current bed is OCCUPIED, release that bed into CLEANING
           (committed_bed_nights decremented)
        6. mark AlumniContact rows PENDING -> NO_CONTACT whose scheduled_for
           <= logical now
        7. process pending LevelOfCareChange rows in ascending
           (effective_at, created_at) order; ties on effective_at are broken by
           created_at ascending, never by id. An AWAITING_DISCHARGE row whose
           bed is still CLEANING returns that bed to AVAILABLE and advances the
           row's retry_available_at by 24 hours, leaving the row in
           AWAITING_DISCHARGE so the next run may hold the bed again

      Determinism: every ordering in this batch is pinned on entity fields —
      ascending effective_at then ascending created_at, or ascending
      attempt_number. No id, uuid or random value participates in any order.
    input_set: "All mutable children of one facility"
    constants:
      STAGE_COUNT: 7
    precision: "n/a (orchestration rule)"

  # ---------------------------------------------------------------------------
  - name: alumni_contact_schedule
    trigger: "discharge of a TreatmentEpisode with an ACTIVE ContinuingCarePlan"
    algorithm: interval_merge
    formula: |
      On discharge, exactly alumni_contacts_required AlumniContact rows are
      created; attempt_number runs 1..alumni_contacts_required ascending and
      scheduled_for = discharged_at + attempt_number * alumni_contact_interval_days
      (whole days added to the logical now at discharge).

      Only rows whose scheduled_for is strictly after discharged_at are created;
      an interval of 0 days would collapse every contact onto the discharge
      instant and is refused at plan creation with ERR_ALUMNI_INTERVAL_INVALID.

      ORDER: contacts are created and later marked NO_CONTACT in ascending
      attempt_number. Ties in scheduled_for cannot occur because
      alumni_contact_interval_days >= MIN_INTERVAL_DAYS.
    input_set: "The ContinuingCarePlan ACTIVE at the discharge instant"
    constants:
      MIN_INTERVAL_DAYS: 1
      MAX_CONTACTS: 24
    precision: "whole days"

  # ---------------------------------------------------------------------------
  - name: discharge_readiness_gate
    trigger: "POST .../complete-treatment and POST .../discharge"
    algorithm: threshold
    formula: |
      A discharge is permitted only when ALL of the following hold:
        (a) facility_posture != FROZEN
        (b) committed_bed_nights of the facility, measured AFTER releasing this
            episode's bed, is <= capacity_beds of the facility's OPEN
            RecoveryHousing rows summed — i.e. the discharge must not overfill
            recovery housing
        (c) a ContinuingCarePlan with status ACTIVE exists for the episode AND
            its authorizing_clinician_id names a Clinician whose credential
            tier is at or above the facility's state_min_credential_tier
        (d) the episode's WithdrawalManagementPlan.status is MEDICALLY_STABLE

      Boundary: the housing check is an inclusive ceiling — committed_bed_nights
      exactly equal to the summed RecoveryHousing capacity_beds passes; one more
      fails with ERR_CONTINUING_CARE_HOUSING_FULL.
    input_set: "The episode, its ContinuingCarePlan, the facility's beds and OPEN RecoveryHousing rows"
    constants:
      MIN_CREDENTIAL_TIER_FOR_DISCHARGE: TIER_3_LICENSED
    precision: "integer counts"

  # ---------------------------------------------------------------------------
  - name: ranked_housing_selection
    trigger: "activation of a ContinuingCarePlan whose housing_selection_basis is RANKED_AUTO"
    algorithm: waterfall_allocation
    formula: |
      Resolves ContinuingCarePlan.housing_id deterministically from a candidate
      pool. All four selector elements are pinned; no id or random value
      participates in any step.

      (i) CANDIDATE SET — a RecoveryHousing row qualifies only when ALL hold:
            status == OPEN
            capacity_beds - (count of ACTIVE continuing-care plans placed in it
                             whose housing_window overlaps the requested window) > 0
            day_rate_cents <= AFFORDABILITY_CEILING_CENTS
            if wants_recovery_only_house == true then licensed == true
            if shelter_class == RESIDENTIAL then licensed == true

      (ii) RANKING EXPRESSION — ascending composite:
            key = (abs(day_rate_cents - AFFORDABILITY_TARGET_CENTS), proximity_rank)
           The first element is the CHEAPEST-CLOSEST delta, the second the
           facility's proximity rank.

      (iii) TIE-BREAK — rows whose composite key ties exactly are ordered by
           ascending house_name (byte-wise, case-sensitive). created_at and id
           are never consulted.

      (iv) EMPTY POOL — when no row qualifies the activation is refused with
           ERR_HOUSING_POOL_EXHAUSTED (409). There is no fallback row and no
           partial placement.

      Worked resolution: pool = (H_A, rate 1200, proximity 3), (H_B, rate 900,
      proximity 4), (H_C, rate 1200, proximity 1). With
      AFFORDABILITY_TARGET_CENTS = 1000 and AFFORDABILITY_CEILING_CENTS = 2000:
        H_A key = (|1200-1000|, 3) = (200, 3)
        H_B key = (|900-1000|, 4)  = (100, 4)
        H_C key = (|1200-1000|, 1) = (200, 1)
      Ascending order is H_B (100,4), then H_C (200,1), then H_A (200,3),
      so housing_id resolves to H_B even though H_C is nearer and H_A ties on
      price. H_A and H_C never win.

      Oscillation example for the caller: re-running activation on the SAME
      plan after H_B is filled (capacity exhausted) resolves to H_C, not back to
      H_B; the pool is recomputed, not cached.
    input_set: "Every RecoveryHousing row of the facility, plus the ACTIVE continuing-care plans already placed in each, plus the requesting plan's shelter_class and wants_recovery_only_house"
    constants:
      AFFORDABILITY_TARGET_CENTS: 1000
      AFFORDABILITY_CEILING_CENTS: 2000
    precision: "integer cents; the ranking delta is an exact integer absolute difference"# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present; X-User-Role must name a declared role"
    error_id: ERR_MISSING_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The caller's role must appear in the endpoint's roles list, and an entity_backed role's X-User-ID must name an existing instance of its backing entity"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: business_safety
    check: "ClinicalDirector must not be the same X-User-ID that performed any UtilizationReviewer step on the same episode (assessor co-sign, payer concurrent review authoring and medical-provider cosign are the three gated steps); violation is reported before existentce checks"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/treatment-episodes/{id}/complete-treatment, POST /facilities/{id}/treatment-episodes/{id}/discharge, POST /facilities/{id}/treatment-plans/{id}/submit-for-cosign"

  - priority: 4
    category: concurrency
    check: "When the request body carries an expected_*_version field, the value must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/treatment-plans, POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes, POST /facilities/{id}/treatment-episodes/{id}/continuing-care-plans, PUT /facilities/{id}/treatment-plans/{id}"

  - priority: 5
    category: concurrency
    check: "When the Idempotency-Key header is supplied on a create, the key must not already be bound to a different request body for the same endpoint"
    error_id: ERR_IDEMPOTENCY_KEY_CONFLICT
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/authorizations, POST /facilities/{id}/treatment-episodes/{id}/sessions, POST /facilities/{id}/treatment-episodes/{id}/assessments"

  - priority: 6
    category: existence
    check: "The facility id in the path must exist"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path contains {id} directly after the api_prefix"

  - priority: 7
    category: existence
    check: "The episode id in the path must exist"
    error_id: ERR_EPISODE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path contains treatment-episodes/{episode_id}"

  - priority: 8
    category: existence
    check: "The terminal-path child resource id must exist (ERR_ASSESSMENT_NOT_FOUND, ERR_BED_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_CHANGE_NOT_FOUND, ERR_HOUSING_NOT_FOUND, ERR_ACCREDITATION_NOT_FOUND, ERR_CONTACT_NOT_FOUND, ERR_SESSION_NOT_FOUND)"
    error_id: "ERR_ASSESSMENT_NOT_FOUND | ERR_BED_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_CHANGE_NOT_FOUND | ERR_HOUSING_NOT_FOUND | ERR_ACCREDITATION_NOT_FOUND | ERR_CONTACT_NOT_FOUND | ERR_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint ending in two path ids"

  - priority: 9
    category: existence
    check: "Every id-valued body field declared as a foreign key must resolve (ERR_SERVICE_NOT_FOUND, ERR_CLINICIAN_NOT_FOUND, ERR_PAYER_NOT_FOUND); unresolved references return ERR_INVALID_REFERENCE when the field name is not itself a top-level collection id"
    error_id: "ERR_SERVICE_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_PAYER_NOT_FOUND | ERR_INVALID_REFERENCE"
    http_status: 404
    applies_to: "all create endpoints"

  - priority: 10
    category: state
    check: "The episode's clinical_status must be AWAITING_ASSESSMENT for a first assessment; AWAITING_ASSESSMENT or UNDER_ASSESSMENT for a replacement assessment"
    error_id: ERR_EPISODE_NOT_AWAITING_ASSESSMENT
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/assessments"

  - priority: 11
    category: state
    check: "The episode's clinical_status must be UNDER_ASSESSMENT for assessment completion, or AWAITING_ASSESSMENT, UNDER_ASSESSMENT or AWAITING_AUTHORIZATION for assessment cancellation"
    error_id: ERR_EPISODE_NOT_UNDER_ASSESSMENT
    http_status: 409
    applies_to: "POST /facilities/{id}/assessments/{id}/complete, POST /facilities/{id}/assessments/{id}/cancel"

  - priority: 12
    category: state
    check: "The assessment's status must be IN_PROGRESS for completion or cancellation"
    error_id: ERR_ASSESSMENT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /facilities/{id}/assessments/{id}/complete, POST /facilities/{id}/assessments/{id}/cancel"

  - priority: 13
    category: state
    check: "The episode's clinical_status must be AWAITING_AUTHORIZATION for a new authorization request"
    error_id: ERR_EPISODE_NOT_AWAITING_AUTHORIZATION
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/authorizations"

  - priority: 14
    category: state
    check: "The authorization's posture must be PENDING for approve, or PENDING, APPROVED or CONCURRENT_REVIEW_DUE for deny"
    error_id: ERR_AUTHORIZATION_NOT_PENDING
    http_status: 409
    applies_to: "POST /facilities/{id}/authorizations/{id}/approve, POST /facilities/{id}/authorizations/{id}/deny"

  - priority: 15
    category: state
    check: "An authorization already in DENIED may not be denied again"
    error_id: ERR_AUTHORIZATION_ALREADY_DENIED
    http_status: 409
    applies_to: "POST /facilities/{id}/authorizations/{id}/deny"

  - priority: 16
    category: state
    check: "A second authorization for the same episode is refused unless every prior authorization is DENIED, EXPIRED or EXHAUSTED, or the requested_level differs from every prior authorization's requested_level"
    error_id: ERR_AUTHORIZATION_NOT_REOPENABLE
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/authorizations"

  - priority: 17
    category: state
    check: "The episode's clinical_status must be AWAITING_ADMISSION for admission"
    error_id: ERR_EPISODE_NOT_AWAITING_ADMISSION
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit"

  - priority: 18
    category: state
    check: "The episode's clinical_status must be IN_TREATMENT for session scheduling, level-of-care changes, plan creation and withdrawal-management authoring"
    error_id: ERR_EPISODE_NOT_IN_TREATMENT
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/sessions, POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes, POST /facilities/{id}/treatment-episodes/{id}/treatment-plans, POST /facilities/{id}/treatment-episodes/{id}/withdrawal-management, POST /facilities/{id}/treatment-episodes/{id}/discharge"

  - priority: 19
    category: state
    check: "The episode's clinical_status must be IN_TREATMENT or COMPLETED for discharge"
    error_id: ERR_EPISODE_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/discharge"

  - priority: 20
    category: state
    check: "A DISCHARGED episode may not be discharged again"
    error_id: ERR_ALREADY_DISCHARGED
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/discharge, POST /facilities/{id}/treatment-episodes/{id}/complete-treatment"

  - priority: 21
    category: state
    check: "The level-of-care change's status must be PLANNED for completion"
    error_id: ERR_CHANGE_NOT_PLANNED
    http_status: 409
    applies_to: "POST /facilities/{id}/level-of-care-changes/{id}/complete"

  - priority: 22
    category: state
    check: "The alumni contact's outcome must be PENDING when an outcome is recorded"
    error_id: ERR_CONTACT_NOT_PENDING
    http_status: 409
    applies_to: "POST /facilities/{id}/alumni-contacts/{id}/record"

  - priority: 23
    category: business_safety
    check: "The facility must hold a GRANTED, unexpired Accreditation of class STATE_LICENSE for its own state_code before any assessment, authorization, admission or level-of-care change"
    error_id: ERR_FACILITY_NOT_LICENSED
    http_status: 403
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/assessments, POST /facilities/{id}/treatment-episodes/{id}/authorizations, POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"

  - priority: 24
    category: business_safety
    check: "The facility must hold a GRANTED, unexpired Accreditation of class ACCREDITATION_BODY before admission"
    error_id: ERR_FACILITY_ACCREDITATION_INVALID
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/treatment-episodes/{id}/discharge"

  - priority: 25
    category: business_safety
    check: "The facility must not have an Accreditation of class ACCREDITATION_BODY in REVOKED status when a clinical document or session is authored"
    error_id: ERR_FACILITY_ACCREDITATION_REVOKED
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/sessions, POST /facilities/{id}/treatment-episodes/{id}/treatment-plans"

  - priority: 26
    category: business_safety
    check: "Facility.facility_posture must not be FROZEN for admission, discharge, level-of-care change or session scheduling"
    error_id: ERR_FACILITY_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/treatment-episodes/{id}/discharge, POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes, POST /facilities/{id}/treatment-episodes/{id}/sessions"

  - priority: 27
    category: business_safety
    check: "The assessing clinician must hold credential_tier at or above Facility.state_min_credential_tier AND a ClinicianFacilityCredential for this facility with is_usable == true"
    error_id: ERR_ASSESSOR_CREDENTIAL_INSUFFICIENT
    http_status: 403
    applies_to: "POST /facilities/{id}/assessments/{id}/complete, POST /facilities/{id}/treatment-episodes/{id}/treatment-plans"

  - priority: 28
    category: business_safety
    check: "The facility's state_min_credential_tier must be at or above Payer.credential_min_tier_by_loc for the requested level; a payer whose floor exceeds the state's own minimum credential tier renders that level unfundable at this facility"
    error_id: ERR_PAYER_CREDENTIAL_TIER_UNMET
    http_status: 403
    applies_to: "POST /facilities/{id}/authorizations/{id}/approve"

  - priority: 29
    category: business_safety
    check: "Every MedicalClearance of the episode must carry the raw status CLEARED (a CLEARED row whose window has closed still passes this check and is caught by priority 30) before admission or level-of-care change completion"
    error_id: ERR_MEDICAL_CLEARANCE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/level-of-care-changes/{id}/complete"

  - priority: 30
    category: business_safety
    check: "A CLEARED clearance whose window_hours_remaining is exactly 0 has expired and blocks admission"
    error_id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http_status: 410
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit"

  - priority: 31
    category: business_safety
    check: "The episode's WithdrawalManagementPlan status must be ACTIVE for admission, and MEDICALLY_STABLE for discharge or treatment completion"
    error_id: ERR_WITHDRAWAL_MANAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/treatment-episodes/{id}/complete-treatment, POST /facilities/{id}/treatment-episodes/{id}/discharge"

  - priority: 32
    category: business_safety
    check: "A step-up requires the WithdrawalManagementPlan status to be COMPLICATED"
    error_id: ERR_WITHDRAWAL_MANAGEMENT_NOT_COMPLICATED
    http_status: 409
    applies_to: "POST /facilities/{id}/level-of-care-changes/{id}/step-up"

  - priority: 33
    category: business_safety
    check: "The episode's TreatmentPlan status must be ACTIVE (and carry a recorded cosign) for treatment completion"
    error_id: ERR_TREATMENT_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/complete-treatment, POST /facilities/{id}/treatment-episodes/{id}/discharge"

  - priority: 34
    category: business_safety
    check: "Attended sessions in the current treatment week must reach the level's required_sessions_per_week before treatment completion"
    error_id: ERR_CURRICULUM_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/complete-treatment"

  - priority: 35
    category: business_constraint
    check: "The changed-to Bed's occupancy window [effective_at, effective_at + days_remaining of the referencing authorization) must not overlap the occupancy window of any LevelOfCareChange row already recorded against that bed, whatever its current status; adjacency (one window ending exactly when the next begins) is allowed"
    error_id: ERR_BED_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes, POST /facilities/{id}/level-of-care-changes/{id}/step-up"

  - priority: 36
    category: business_constraint
    check: "The episode must still hold its authorization's bed hold when admission is attempted; a hold released by an intervening ops run is refused"
    error_id: ERR_BED_NOT_HELD
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit"

  - priority: 37
    category: business_constraint
    check: "The step-up target bed must be AVAILABLE at the requested effective instant"
    error_id: ERR_BED_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /facilities/{id}/level-of-care-changes/{id}/step-up"

  - priority: 38
    category: business_constraint
    check: "The ContinuingCarePlan housing window [housing_window_start, housing_window_end) must overlap no other ACTIVE plan's window on the same housing_id; alignment (end == start) is allowed"
    error_id: ERR_HOUSING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/continuing-care-plans"

  - priority: 39
    category: business_constraint
    check: "The summed capacity_beds of the facility's OPEN RecoveryHousing rows must be at least the count of ACTIVE continuing-care plans; the check is an inclusive ceiling"
    error_id: ERR_CONTINUING_CARE_HOUSING_FULL
    http_status: 409
    applies_to: "POST /facilities/{id}/continuing-care-plans/{id}/activate, POST /facilities/{id}/treatment-episodes/{id}/discharge"

  - priority: 40
    category: business_referential
    check: "The level route must exist in the payer's standardized-continuum table: only ASAM_3_7→ASAM_3_5, ASAM_3_7→ASAM_3_1, ASAM_3_5→ASAM_3_1, ASAM_3_5→ASAM_2_1, ASAM_3_1→ASAM_2_1, ASAM_3_1→ASAM_1_0, ASAM_2_1→ASAM_1_0 and their exact reverses as STEP_UP are permitted"
    error_id: ERR_LEVEL_ROUTE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes, POST /facilities/{id}/level-of-care-changes/{id}/step-up"

  - priority: 41
    category: business_referential
    check: "The payer's step_down_coverage_map must still name an unfunded level below the current granted_level"
    error_id: ERR_STEP_DOWN_MAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /facilities/{id}/level-of-care-changes/{id}/complete"

  - priority: 42
    category: business_constraint
    check: "TreatmentEpisode.step_down_count must be strictly less than 2 when a step-down is appointed"
    error_id: ERR_MAX_STEP_DOWNS_REACHED
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"

  - priority: 43
    category: business_constraint
    check: "The episode's level-of-care changes under one payer_id must not exceed 5 in total"
    error_id: ERR_MAX_CHANGE_PER_PAYER
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"

  - priority: 44
    category: business_constraint
    check: "The changed-to level must not exceed Facility.as_level_max"
    error_id: ERR_LEVEL_EXCEEDS_FACILITY_LICENSE
    http_status: 409
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes, POST /facilities/{id}/authorizations/{id}/approve"

  - priority: 45
    category: business_temporal
    check: "The level-of-care change's effective_at must be at or before the logical now, and the change must lie in the facility's current ops epoch"
    error_id: ERR_EPOCH_STALE
    http_status: 409
    applies_to: "POST /facilities/{id}/level-of-care-changes/{id}/cancel, POST /facilities/{id}/level-of-care-changes/{id}/complete"

  - priority: 46
    category: business_temporal
    check: "A level-of-care change may not complete before its effective_at"
    error_id: ERR_CHANGE_NOT_DUE
    http_status: 409
    applies_to: "POST /facilities/{id}/level-of-care-changes/{id}/complete"

  - priority: 47
    category: business_fiscal
    check: "LevelOfCareAuthorization.days_remaining must be strictly greater than 0; the exhausted-at-exactly-zero case is refused"
    error_id: ERR_AUTHORIZATION_DAYS_EXHAUSTED
    http_status: 402
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/admit, POST /facilities/{id}/authorizations/{id}/submit-concurrent-review"

  - priority: 48
    category: business_fiscal
    check: "A step-down may not be appointed against an authorization whose days_used is exactly 0"
    error_id: ERR_AUTHORIZATION_UNUSED
    http_status: 409
    applies_to: "POST /facilities/{id}/authorizations/{id}/deny, POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"

  - priority: 49
    category: business_constraint
    check: "ContinuingCarePlan.alumni_contact_interval_days must be at least 1 and at most 90, and alumni_contacts_required at least 1 and at most 24"
    error_id: ERR_ALUMNI_INTERVAL_INVALID
    http_status: 400
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/continuing-care-plans"

  - priority: 50
    category: business_constraint
    check: "housing_window_end must be strictly after housing_window_start"
    error_id: ERR_HOUSING_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/continuing-care-plans"

  - priority: 51
    category: business_constraint
    check: "dimension_scores must carry exactly the six declared ASAM dimensions, each an integer 0..4"
    error_id: ERR_INVALID_DIMENSION_SCORES
    http_status: 400
    applies_to: "POST /facilities/{id}/treatment-episodes/{id}/assessments"

  - priority: 52
    category: business_constraint
    check: "Enum-typed inputs must carry one of the declared members"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: all create and update endpoints

  - priority: 53
    category: existence
    check: "Required fields must be present with the declared type; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.6 Error Code Catalog (66 codes)
# =============================================================================
errors:
  # --- Context, authorization, segregation of duties ---
  - id: ERR_MISSING_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role names no declared role"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Caller's role is not permitted on this endpoint, or an entity_backed X-User-ID names no existing instance"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "The same X-User-ID performed a UtilizationReviewer step and now attempts a gated ClinicalDirector step on the same episode"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version supplied on the request does not equal the parent entity's current version"
  - id: ERR_IDEMPOTENCY_KEY_CONFLICT
    http: 409
    condition: "Idempotency-Key already bound to a different request body on the same endpoint"

  # --- Existence ---
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "No facility with the given id"
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "No treatment episode with the given id at this facility"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No clinical assessment with the given id at this facility"
  - id: ERR_BED_NOT_FOUND
    http: 404
    condition: "No bed with the given id at this facility"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "No level-of-care authorization with the given id at this facility"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No treatment plan with the given id at this facility"
  - id: ERR_CHANGE_NOT_FOUND
    http: 404
    condition: "No level-of-care change with the given id at this facility"
  - id: ERR_HOUSING_NOT_FOUND
    http: 404
    condition: "No recovery housing row with the given id at this facility"
  - id: ERR_ACCREDITATION_NOT_FOUND
    http: 404
    condition: "No accreditation with the given id at this facility"
  - id: ERR_CONTACT_NOT_FOUND
    http: 404
    condition: "No alumni contact with the given id at this facility"
  - id: ERR_SERVICE_NOT_FOUND
    http: 404
    condition: "No service offering with the given id at this facility"
  - id: ERR_CLINICIAN_NOT_FOUND
    http: 404
    condition: "No clinician with the given id"
  - id: ERR_PAYER_NOT_FOUND
    http: 404
    condition: "No payer with the given id"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "No session attendance with the given id at this facility"
  - id: ERR_INVALID_REFERENCE
    http: 404
    condition: "A body foreign key names a row that does not exist or belongs to a different facility"

  # --- Request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, or type mismatch"
  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "Enum-typed field carries a value outside its declared member set"
  - id: ERR_INVALID_DIMENSION_SCORES
    http: 400
    condition: "dimension_scores does not carry exactly the six ASAM dimensions each as an integer 0..4"
  - id: ERR_ALUMNI_INTERVAL_INVALID
    http: 400
    condition: "alumni_contact_interval_days outside 1..90 or alumni_contacts_required outside 1..24"
  - id: ERR_HOUSING_WINDOW_INVALID
    http: 400
    condition: "housing_window_end is not strictly after housing_window_start"

  # --- Episode state ---
  - id: ERR_EPISODE_NOT_AWAITING_ASSESSMENT
    http: 409
    condition: "Episode's clinical_status is not AWAITING_ASSESSMENT (nor UNDER_ASSESSMENT for a replacement)"
  - id: ERR_EPISODE_NOT_UNDER_ASSESSMENT
    http: 409
    condition: "Episode's clinical_status is not UNDER_ASSESSMENT"
  - id: ERR_EPISODE_NOT_AWAITING_AUTHORIZATION
    http: 409
    condition: "Episode's clinical_status is not AWAITING_AUTHORIZATION"
  - id: ERR_EPISODE_NOT_AWAITING_ADMISSION
    http: 409
    condition: "Episode's clinical_status is not AWAITING_ADMISSION"
  - id: ERR_EPISODE_NOT_IN_TREATMENT
    http: 409
    condition: "Episode's clinical_status is not IN_TREATMENT"
  - id: ERR_EPISODE_NOT_COMPLETED
    http: 409
    condition: "Episode's clinical_status is neither IN_TREATMENT nor COMPLETED"
  - id: ERR_CONTINUING_CARE_PLAN_REQUIRED
    http: 409
    condition: "Discharge attempted with no ACTIVE ContinuingCarePlan in place"
  - id: ERR_ALREADY_DISCHARGED
    http: 409
    condition: "Episode is already DISCHARGED (terminal state lockdown)"
  - id: ERR_ASSESSMENT_NOT_IN_PROGRESS
    http: 409
    condition: "ClinicalAssessment.status is not IN_PROGRESS"
  - id: ERR_AUTHORIZATION_NOT_PENDING
    http: 409
    condition: "LevelOfCareAuthorization.posture is not PENDING"
  - id: ERR_AUTHORIZATION_NOT_APPROVED
    http: 409
    condition: "LevelOfCareAuthorization.posture is not APPROVED"
  - id: ERR_AUTHORIZATION_ALREADY_DENIED
    http: 409
    condition: "LevelOfCareAuthorization.posture is already DENIED"
  - id: ERR_AUTHORIZATION_NOT_REOPENABLE
    http: 409
    condition: "Prior authorization posture is not DENIED, EXPIRED or EXHAUSTED"
  - id: ERR_AUTHORIZATION_UNUSED
    http: 409
    condition: "days_used is exactly 0, so no step-down pressure has accrued"
  - id: ERR_TREATMENT_PLAN_NOT_ACTIVE
    http: 409
    condition: "Episode's TreatmentPlan.status is not ACTIVE (or carries no cosign)"
  - id: ERR_CHANGE_NOT_PLANNED
    http: 409
    condition: "LevelOfCareChange.status is not PLANNED"
  - id: ERR_CHANGE_NOT_DUE
    http: 409
    condition: "LevelOfCareChange.effective_at is after the logical now"
  - id: ERR_CHANGE_BRANCH_NOT_APPLICABLE
    http: 409
    condition: "The chosen completion branch does not apply to this change's to_level and status"
  - id: ERR_CONTACT_NOT_PENDING
    http: 409
    condition: "AlumniContact.outcome is not PENDING"

  # --- Licensure, accreditation, credentials, posture ---
  - id: ERR_FACILITY_NOT_LICENSED
    http: 403
    condition: "Facility holds no GRANTED unexpired STATE_LICENSE accreditation for its state_code"
  - id: ERR_FACILITY_ACCREDITATION_INVALID
    http: 409
    condition: "Facility holds no GRANTED unexpired ACCREDITATION_BODY accreditation"
  - id: ERR_FACILITY_ACCREDITATION_REVOKED
    http: 409
    condition: "Facility holds an ACCREDITATION_BODY accreditation in REVOKED status"
  - id: ERR_FACILITY_POSTURE_FROZEN
    http: 409
    condition: "Facility.facility_posture is FROZEN"
  - id: ERR_LEVEL_EXCEEDS_FACILITY_LICENSE
    http: 409
    condition: "Requested or changed-to ASAM level exceeds Facility.as_level_max"
  - id: ERR_ASSESSOR_CREDENTIAL_INSUFFICIENT
    http: 403
    condition: "Assessing or authoring clinician's credential_tier is below Facility.state_min_credential_tier, or the clinician holds no usable facility credential"
  - id: ERR_PAYER_CREDENTIAL_TIER_UNMET
    http: 403
    condition: "Plan author clinician's credential tier is below Payer.credential_min_tier_by_loc for the requested level"

  # --- Clinical safety ---
  - id: ERR_MEDICAL_CLEARANCE_NOT_CLEARED
    http: 409
    condition: "At least one MedicalClearance of the episode does not read CLEARED"
  - id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http: 410
    condition: "A MedicalClearance reads EXPIRED because window_hours_remaining is exactly 0"
  - id: ERR_WITHDRAWAL_MANAGEMENT_NOT_ACTIVE
    http: 409
    condition: "WithdrawalManagementPlan.status is not ACTIVE (admission) or not MEDICALLY_STABLE (completion/discharge)"
  - id: ERR_WITHDRAWAL_MANAGEMENT_NOT_COMPLICATED
    http: 409
    condition: "WithdrawalManagementPlan.status is not COMPLICATED, so no step-up is indicated"
  - id: ERR_CURRICULUM_NOT_COMPLETE
    http: 409
    condition: "Attended sessions this treatment week are below the level's required_sessions_per_week"

  # --- Capacity, temporal, referential, fiscal ---
  - id: ERR_BED_OCCUPANCY_OVERLAP
    http: 409
    condition: "The target bed occupancy window overlaps an existing OCCUPIED or CLEANING window on that bed"
  - id: ERR_BED_NOT_HELD
    http: 409
    condition: "The episode no longer holds the bed its authorization reserved"
  - id: ERR_BED_NOT_AVAILABLE
    http: 409
    condition: "The step-up target bed is not AVAILABLE at the requested effective instant"
  - id: ERR_HOUSING_WINDOW_OVERLAP
    http: 409
    condition: "The requested housing window overlaps another ACTIVE continuing-care plan's window on the same housing row"
  - id: ERR_HOUSING_POOL_EXHAUSTED
    http: 409
    condition: "RANKED_AUTO housing resolution found no OPEN, licensed, affordable, capacity-available house in the candidate pool"
  - id: ERR_CONTINUING_CARE_HOUSING_FULL
    http: 409
    condition: "ACTIVE continuing-care plans would exceed the summed capacity of OPEN recovery housing"
  - id: ERR_LEVEL_ROUTE_NOT_ALLOWED
    http: 409
    condition: "The from_level → to_level route is outside the payer's standardized-continuum transition table"
  - id: ERR_STEP_DOWN_MAP_EXHAUSTED
    http: 409
    condition: "Payer.step_down_coverage_map names no unfunded level below the current granted_level"
  - id: ERR_MAX_STEP_DOWNS_REACHED
    http: 409
    condition: "TreatmentEpisode.step_down_count is already 2"
  - id: ERR_MAX_CHANGE_PER_PAYER
    http: 409
    condition: "The episode has already recorded 5 level-of-care changes under one payer_id"
  - id: ERR_EPOCH_STALE
    http: 409
    condition: "The compensation window has closed: a facility-ops run advanced the epoch since the change completed"
  - id: ERR_AUTHORIZATION_DAYS_EXHAUSTED
    http: 402
    condition: "LevelOfCareAuthorization.days_remaining is exactly 0"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: creates facilities, beds, clinicians, service offerings, payers, recovery housing, accreditations; drives the facility-ops epoch and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /facilities/{id}/_clock/set_current_utc"
      - "POST /clinicians"
      - "POST /payers"
    shared_operations:
      - "POST /facilities/{id}/facility-ops/run"
      - "POST /facilities/{id}/beds"
      - "POST /facilities/{id}/service-offerings"
      - "POST /facilities/{id}/accreditations"
      - "POST /facilities/{id}/recovery-housing"
      - "POST /clinicians/{id}/facility-credentials"

  - name: ClinicalDirector
    description: "Physician or senior clinical leader: authors and cosigns plans, admits and discharges, appointments and completes level-of-care changes, manages accreditation status"
    identity: opaque
    exclusive_operations:
      - "POST /facilities/{id}/treatment-plans/{id}/submit-for-cosign"
      - "POST /facilities/{id}/level-of-care-changes/{id}/complete"
      - "POST /facilities/{id}/level-of-care-changes/{id}/cancel"
      - "POST /facilities/{id}/level-of-care-changes/{id}/step-up"
      - "POST /facilities/{id}/treatment-episodes/{id}/complete-treatment"
      - "POST /facilities/{id}/treatment-episodes/{id}/discharge"
      - "POST /facilities/{id}/accreditations/{id}/suspend"
      - "POST /facilities/{id}/accreditations/{id}/revoke"
      - "POST /facilities/{id}/accreditations/{id}/reinstate"
      - "POST /facilities/{id}/accreditations/{id}/renew"
    shared_operations:
      - "POST /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"
      - "POST /facilities/{id}/treatment-episodes/{id}/continuing-care-plans"
      - "POST /facilities/{id}/continuing-care-plans/{id}/activate"
      - "POST /facilities/{id}/medical-clearances/{id}/clear"
      - "POST /facilities/{id}/medical-clearances/{id}/fail"
      - "PUT /facilities/{id}/treatment-plans/{id}"

  - name: UtilizationReviewer
    description: "Insurance-facing utilization reviewer: requests and approves or denies payer authorizations and files concurrent reviews"
    identity: opaque
    exclusive_operations:
      - "POST /facilities/{id}/treatment-episodes/{id}/authorizations"
      - "POST /facilities/{id}/authorizations/{id}/approve"
      - "POST /facilities/{id}/authorizations/{id}/deny"
      - "POST /facilities/{id}/authorizations/{id}/submit-concurrent-review"
    shared_operations: []

  - name: AdmissionsIntakeNurse
    description: "Intake nurse: opens episodes, initiates assessments, orders clearances, admits patients"
    identity: opaque
    exclusive_operations:
      - "POST /facilities/{id}/treatment-episodes/{id}/admit"
    shared_operations:
      - "POST /facilities/{id}/treatment-episodes"
      - "POST /facilities/{id}/treatment-episodes/{id}/assessments"
      - "POST /facilities/{id}/treatment-episodes/{id}/medical-clearances"
      - "POST /facilities/{id}/treatment-episodes/{id}/sessions"

  - name: Clinician
    description: "Credentialed counselling and medical staff, backed by the Clinician entity; X-User-ID equals the Clinician id"
    identity: entity_backed:Clinician
    exclusive_operations:
      - "POST /facilities/{id}/treatment-episodes/{id}/withdrawal-management"
      - "PUT /facilities/{id}/withdrawal-management/{id}"
    shared_operations:
      - "POST /facilities/{id}/assessments/{id}/complete"
      - "POST /facilities/{id}/assessments/{id}/cancel"
      - "POST /facilities/{id}/treatment-episodes/{id}/assessments"
      - "POST /facilities/{id}/treatment-episodes/{id}/treatment-plans"
      - "POST /facilities/{id}/treatment-episodes/{id}/medical-clearances"
      - "POST /facilities/{id}/medical-clearances/{id}/clear"
      - "POST /facilities/{id}/medical-clearances/{id}/fail"
      - "POST /facilities/{id}/treatment-episodes/{id}/sessions"
      - "POST /facilities/{id}/sessions/{id}/record-attendance"
      - "POST /facilities/{id}/sessions/{id}/cancel"
      - "PUT /facilities/{id}/treatment-plans/{id}"

  - name: AlumniCoordinator
    description: "Alumni services staff: files post-discharge outcome-measurement contacts"
    identity: opaque
    exclusive_operations:
      - "POST /facilities/{id}/treatment-episodes/{id}/alumni-contacts"
      - "POST /facilities/{id}/alumni-contacts/{id}/record"

  - name: Any
    description: "Read surface shared by every role; no write operation is granted to Any"
    identity: opaque
    shared_operations:
      - "GET /facilities"
      - "GET /facilities/{id}"
      - "GET /facilities/{id}/beds"
      - "GET /facilities/{id}/service-offerings"
      - "GET /facilities/{id}/accreditations"
      - "GET /facilities/{id}/recovery-housing"
      - "GET /facilities/{id}/clinician-credentials"
      - "GET /facilities/{id}/treatment-episodes"
      - "GET /facilities/{id}/treatment-episodes/{id}"
      - "GET /facilities/{id}/treatment-episodes/{id}/utilization-summary"
      - "GET /facilities/{id}/treatment-episodes/{id}/assessments"
      - "GET /facilities/{id}/treatment-episodes/{id}/authorizations"
      - "GET /facilities/{id}/treatment-episodes/{id}/medical-clearances"
      - "GET /facilities/{id}/treatment-episodes/{id}/withdrawal-management"
      - "GET /facilities/{id}/treatment-episodes/{id}/treatment-plans"
      - "GET /facilities/{id}/treatment-episodes/{id}/sessions"
      - "GET /facilities/{id}/treatment-episodes/{id}/level-of-care-changes"
      - "GET /facilities/{id}/treatment-episodes/{id}/continuing-care-plans"
      - "GET /facilities/{id}/treatment-episodes/{id}/alumni-contacts"
      - "GET /clinicians/{id}"
      - "GET /clinicians/{id}/facility-credentials"
      - "GET /clinicians/{id}/assessments"
      - "GET /clinicians/{id}/treatment-plans"
      - "GET /clinicians/{id}/sessions"
      - "GET /clinicians/{id}/continuing-care-plans"
      - "GET /payers/{id}"
      - "GET /payers/{id}/authorizations"# =============================================================================
# §1.5 API Endpoint Table
#
# URL conventions. api_prefix is /treatment-network.
#   • <Parent>/{id}/<segment>            — sub-resource read of a child collection
#   • /treatment-network/<collection>/{id} — segment-establishing single read
#   • /treatment-network/_<name>         — test-driving endpoint outside the
#                                          business surface
# The logical clock endpoint is declared with its startup default below.
# =============================================================================
endpoints:
  # ---------------------------------------------------------------------------
  # Facility, clock, ops epoch
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities"
    description: "Create a facility. facility_posture initializes OPEN, compliance_risk_points 0, ops_epoch 0, licensed false until a STATE_LICENSE accreditation is granted."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code]
    output: Facility
    side_effects:
      - "licensed initializes to false; as_level_max to ASAM_1_0"
      - "facility_posture initializes to OPEN; compliance_risk_points to 0; ops_epoch to 0"

  - method: GET
    path: "/treatment-network/facilities"
    description: "List facilities with filters and pagination"
    roles: [Any]
    code: 200
    input: ["state_code?", "licensed?", "facility_posture?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/facilities/{id}"
    description: "Get one facility, including derived licensed, as_level_max, facility_posture and compliance_risk_points"
    roles: [Any]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/facility-ops/run"
    description: "Run one facility-ops epoch: burn the clock bucket, re-derive authorization day banks and postures, recompute compliance risk and facility posture, expire accreditations and cleaned beds, freeze plans when FROZEN, promote step-down pressure, time out alumni contacts, and process pending level-of-care changes in (effective_at, created_at) order"
    roles: [PlatformAdmin, ClinicalDirector]
    code: 200
    input: []
    output: Facility
    side_effects:
      - "ops_epoch increments by exactly 1 at the start of the run"
      - "last_ops_run_at is stamped with the logical now"
      - "calculations.facility_ops_batch stages 1..7 run in the pinned order"
      - "increments Facility.version by 1"

  - method: POST
    path: "/treatment-network/_clock/set_current_utc"
    description: "Test-driving endpoint: set the network's logical clock. Before any call the clock reads the server startup default 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time; the default sits before every default fixture date so an unset clock is a fixed, well-defined earliest instant."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, facility_count: integer }"
    side_effects:
      - "The logical now becomes current_utc for every subsequent deadline, expiry, window, bucket, credential-window and contact-schedule calculation"

  # ---------------------------------------------------------------------------
  # Clinicians and payers (top-level)
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/clinicians"
    description: "Create a clinician"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, credential_tier, is_medical_provider]
    output: Clinician
    side_effects: []

  - method: GET
    path: "/treatment-network/clinicians/{id}"
    description: "Get one clinician"
    roles: [Any]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: POST
    path: "/treatment-network/clinicians/{clinicianId}/facility-credentials"
    description: "Grant a clinician a facility credential with an effectiveness window"
    roles: [PlatformAdmin]
    code: 201
    input: [facility_id, effective_at, expires_at]
    output: ClinicianFacilityCredential
    side_effects:
      - "status initializes ACTIVE; is_usable is derived from the window and the logical now"

  - method: GET
    path: "/treatment-network/clinicians/{id}/facility-credentials"
    description: "List a clinician's facility credentials"
    roles: [Any]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "ClinicianFacilityCredential[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/clinicians/{id}/assessments"
    description: "List assessments authored by a clinician"
    roles: [Any]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: "ClinicalAssessment[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/clinicians/{id}/treatment-plans"
    description: "List treatment plans authored by a clinician"
    roles: [Any]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/clinicians/{id}/sessions"
    description: "List sessions run by a clinician"
    roles: [Any]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: "SessionAttendance[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/clinicians/{id}/continuing-care-plans"
    description: "List continuing-care plans signed by a clinician"
    roles: [Any]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: "ContinuingCarePlan[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/payers"
    description: "Create a payer with its authorization grants, coverage map, concurrent-review interval and per-level credential floors"
    roles: [PlatformAdmin]
    code: 201
    input: [name, initial_authorized_days_by_loc, step_down_coverage_map, concurrent_review_interval_days, credential_min_tier_by_loc]
    output: Payer
    side_effects: []

  - method: GET
    path: "/treatment-network/payers/{id}"
    description: "Get one payer"
    roles: [Any]
    code: 200
    input: []
    output: Payer
    side_effects: []

  - method: GET
    path: "/treatment-network/payers/{id}/authorizations"
    description: "List authorizations funded by a payer"
    roles: [Any]
    code: 200
    input: ["episode_id?", "posture?", "limit?", "offset?"]
    output: "LevelOfCareAuthorization[]"
    side_effects: []

  # ---------------------------------------------------------------------------
  # Facility children: beds, services, housing, accreditations
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/beds"
    description: "Create a bed staffed for one ASAM level. A facility may hold several beds at the same level and may hold several accreditations of the same class (distinct granting bodies)."
    roles: [PlatformAdmin]
    code: 201
    input: [unit_name, bed_label, level_of_care, cleaning_turnaround_hours]
    output: Bed
    side_effects:
      - "status initializes AVAILABLE; next_available_at null"

  - method: GET
    path: "/treatment-network/facilities/{id}/beds"
    description: "List a facility's beds with filters and pagination"
    roles: [Any]
    code: 200
    input: ["level_of_care?", "status?", "limit?", "offset?"]
    output: "Bed[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/service-offerings"
    description: "Create a programming service offering at one ASAM level"
    roles: [PlatformAdmin]
    code: 201
    input: [service_code, level_of_care, required_min_credential_tier, requires_medical_provider]
    output: ServiceOffering
    side_effects: []

  - method: GET
    path: "/treatment-network/facilities/{id}/service-offerings"
    description: "List a facility's service offerings"
    roles: [Any]
    code: 200
    input: ["level_of_care?", "limit?", "offset?"]
    output: "ServiceOffering[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/service-offerings/{id}"
    description: "Get one service offering across the network"
    roles: [Any]
    code: 200
    input: []
    output: ServiceOffering
    side_effects: []

  - method: GET
    path: "/treatment-network/service-offerings/{id}/sessions"
    description: "List sessions delivered for one service offering"
    roles: [Any]
    code: 200
    input: ["episode_id?", "status?", "limit?", "offset?"]
    output: "SessionAttendance[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/level-of-care-changes/{id}"
    description: "Get one level-of-care change across the network"
    roles: [Any]
    code: 200
    input: []
    output: LevelOfCareChange
    side_effects: []

  - method: GET
    path: "/treatment-network/beds/{id}/level-of-care-changes"
    description: "List the level-of-care changes that targeted one bed, in either direction"
    roles: [Any]
    code: 200
    input: [bed_id]
    output: "LevelOfCareChange[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/level-of-care-changes"
    description: "List level-of-care changes across the network, filterable by bed and authorization"
    roles: [Any]
    code: 200
    input: ["bed_id?", "authorization_id?", "episode_id?", "change_type?", "status?", "limit?", "offset?"]
    output: "LevelOfCareChange[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/recovery-housing"
    description: "Create a recovery-housing house with a resident capacity and a proximity rank"
    roles: [PlatformAdmin]
    code: 201
    input: [house_name, proximity_rank, day_rate_cents, capacity_beds, "grab_barrier_hours?"]
    output: RecoveryHousing
    side_effects:
      - "status initializes OPEN; licensed derives from a GRANTED RECOVERY_HOUSE accreditation"

  - method: GET
    path: "/treatment-network/facilities/{id}/recovery-housing"
    description: "List a facility's recovery-housing rows"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RecoveryHousing[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/recovery-housing/{id}"
    description: "Get one recovery-housing row"
    roles: [Any]
    code: 200
    input: []
    output: RecoveryHousing
    side_effects: []

  - method: GET
    path: "/treatment-network/recovery-housing/{id}/continuing-care-plans"
    description: "List continuing-care plans placed into one recovery-housing row"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ContinuingCarePlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/facilities/{id}/clinician-credentials"
    description: "List clinician facility credentials issued at one facility"
    roles: [Any]
    code: 200
    input: ["clinician_id?", "status?", "limit?", "offset?"]
    output: "ClinicianFacilityCredential[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/accreditations"
    description: "Record an accreditation of class ACCREDITATION_BODY, STATE_LICENSE or RECOVERY_HOUSE"
    roles: [PlatformAdmin]
    code: 201
    input: [accreditation_class, granting_body, effective_at, expires_at, "license_level_max?", "credential_tier_min?"]
    output: Accreditation
    side_effects:
      - "status initializes GRANTED"
      - "Facility.licensed and Facility.as_level_max are recomputed when the class is STATE_LICENSE"

  - method: GET
    path: "/treatment-network/facilities/{id}/accreditations"
    description: "List a facility's accreditations"
    roles: [Any]
    code: 200
    input: ["accreditation_class?", "status?", "limit?", "offset?"]
    output: "Accreditation[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/accreditations/{id}"
    description: "Get one accreditation across the network"
    roles: [Any]
    code: 200
    input: []
    output: Accreditation
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/accreditations/{accreditationId}/renew"
    description: "Renew an accreditation, pushing expires_at forward by 365 days"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: Accreditation
    side_effects:
      - "status becomes GRANTED and expires_at advances 365 days"
      - "Facility.licensed, Facility.as_level_max and facility_posture are recomputed"

  - method: POST
    path: "/treatment-network/facilities/{id}/accreditations/{accreditationId}/suspend"
    description: "Suspend an accreditation"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: Accreditation
    side_effects:
      - "status becomes SUSPENDED"
      - "Authorizations whose granted_level exceeds the facility's remaining license become STEP_DOWN_REQUIRED"
      - "facility_posture is recomputed (a suspended ACCREDITATION_BODY counts as missing)"

  - method: POST
    path: "/treatment-network/facilities/{id}/accreditations/{accreditationId}/revoke"
    description: "Revoke an accreditation permanently"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: Accreditation
    side_effects:
      - "status becomes REVOKED"
      - "Facility.is_accepting_admissions becomes false; licensed becomes false when this is the only GRANTED STATE_LICENSE for the state_code"
      - "facility_posture is recomputed"

  - method: POST
    path: "/treatment-network/facilities/{id}/accreditations/{accreditationId}/reinstate"
    description: "Reinstate a suspended accreditation"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: Accreditation
    side_effects:
      - "status becomes GRANTED"
      - "Facility.licensed and facility_posture are recomputed"

  # ---------------------------------------------------------------------------
  # Treatment episodes
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes"
    description: "Open an admission episode. clinical_status starts AWAITING_ASSESSMENT and care_level_status NOT_STARTED."
    roles: [AdmissionsIntakeNurse, Clinician]
    code: 201
    input: [patient_ref, "assigned_level?"]
    output: TreatmentEpisode
    side_effects:
      - "clinical_status initializes AWAITING_ASSESSMENT; care_level_status NOT_STARTED; step_down_count 0"
      - "therapy_revenue_cents initializes 0"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes"
    description: "List a facility's episodes with filters and pagination"
    roles: [Any]
    code: 200
    input: ["clinical_status?", "care_level_status?", "assigned_level?", "limit?", "offset?"]
    output: "TreatmentEpisode[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}"
    description: "Get one episode inside its facility"
    roles: [Any]
    code: 200
    input: []
    output: TreatmentEpisode
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}"
    description: "Get one episode across the network"
    roles: [Any]
    code: 200
    input: []
    output: TreatmentEpisode
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{episodeId}/utilization-summary"
    description: "Computed read of one episode's utilization picture, including the extended-window step-down urgency variant that is never persisted"
    roles: [Any]
    code: 200
    input: ["authorization_id?"]
    output: "{ authorization_id: string, urgency_score: number, projected_step_down_urgency: number, days_used: integer, days_remaining: integer, curriculum_compliance_percent: integer, committed_bed_nights: integer, outstanding_formula: string, formula_version: integer, discharged_at: datetime }"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/admit"
    description: "Admit the episode: requires every clearance CLEARED and unexpired, an ACTIVE withdrawal-management plan, an ACTIVE treatment plan, valid site accreditation, an unexhausted authorization and a still-held bed"
    roles: [AdmissionsIntakeNurse]
    code: 200
    input: []
    output: TreatmentEpisode
    side_effects:
      - "clinical_status becomes IN_TREATMENT; care_level_status becomes ACTIVE; admitted_at is stamped"
      - "increments TreatmentEpisode.version by 1"

  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/complete-treatment"
    description: "Move the episode to COMPLETED once withdrawal management is stable, the plan is ACTIVE and the weekly curriculum is met"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: TreatmentEpisode
    side_effects:
      - "clinical_status becomes COMPLETED"
      - "therapy_revenue_cents is recomputed from ATTENDED session rows"
      - "increments TreatmentEpisode.version by 1"

  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/discharge"
    description: "Discharge a COMPLETED episode: releases the bed, stamps discharged_at, and materializes the alumni contact schedule. With no ACTIVE continuing-care plan the release is deferred onto an AWAITING_DISCHARGE change row instead."
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: TreatmentEpisode
    side_effects:
      - "With an ACTIVE ContinuingCarePlan: clinical_status becomes DISCHARGED, discharged_at is stamped, the OCCUPIED bed becomes CLEANING with next_available_at = now + cleaning_turnaround_hours, and AlumniContact rows are created at the plan's interval (calculations.alumni_contact_schedule)"
      - "With no ACTIVE ContinuingCarePlan: the call is refused with ERR_CONTINUING_CARE_PLAN_REQUIRED and a LevelOfCareChange row is recorded AWAITING_DISCHARGE with retry_available_at = now + 24 hours"
      - "increments TreatmentEpisode.version by 1 on success; a refused call performs no episode mutation"

  # ---------------------------------------------------------------------------
  # Clinical assessments
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/assessments"
    description: "Begin a clinical assessment. If another assessment for this episode is already IN_PROGRESS it is superseded."
    roles: [AdmissionsIntakeNurse, Clinician]
    code: 201
    input: [assessor_clinician_id, dimension_scores, "placement_basis?"]
    output: ClinicalAssessment
    side_effects:
      - "status initializes IN_PROGRESS"
      - "Episode clinical_status becomes UNDER_ASSESSMENT"
      - "Any pre-existing IN_PROGRESS assessment for this episode becomes SUPERSEDED"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/assessments"
    description: "List an episode's assessments inside its facility"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ClinicalAssessment[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/assessments"
    description: "List an episode's assessments across the network"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ClinicalAssessment[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/assessments/{assessmentId}/complete"
    description: "Complete an assessment: computes the weighted total and the recommended level, and places the episode"
    roles: [Clinician]
    code: 200
    input: []
    output: ClinicalAssessment
    side_effects:
      - "calculations.asam_level_placement runs and total_score / recommended_level are written"
      - "status becomes COMPLETED; assessed_at is stamped"
      - "TreatmentEpisode.assigned_level becomes recommended_level and clinical_status becomes AWAITING_AUTHORIZATION"

  - method: POST
    path: "/treatment-network/facilities/{id}/assessments/{assessmentId}/cancel"
    description: "Cancel an in-progress assessment and send the episode back to AWAITING_ASSESSMENT"
    roles: [Clinician, ClinicalDirector]
    code: 200
    input: []
    output: ClinicalAssessment
    side_effects:
      - "status becomes CANCELLED"
      - "TreatmentEpisode.clinical_status returns to AWAITING_ASSESSMENT"

  # ---------------------------------------------------------------------------
  # Level-of-care authorizations
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/authorizations"
    description: "Request payer authorization for a level of care. For ASAM_3_1 and above the optional bed_id is held OCCUPIED."
    roles: [UtilizationReviewer]
    code: 201
    input: [payer_id, requested_level, "bed_id?"]
    output: LevelOfCareAuthorization
    side_effects:
      - "posture initializes PENDING; days_used 0; concurrent_review_count 0"
      - "When requested_level rank >= 2 and bed_id is supplied, that AVAILABLE bed becomes OCCUPIED"
      - "Idempotency-Key is accepted on this endpoint"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/authorizations"
    description: "List an episode's authorizations"
    roles: [Any]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: "LevelOfCareAuthorization[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/authorizations"
    description: "List an episode's authorizations across the network"
    roles: [Any]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: "LevelOfCareAuthorization[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/authorizations/{id}"
    description: "Get one authorization across the network"
    roles: [Any]
    code: 200
    input: []
    output: LevelOfCareAuthorization
    side_effects: []

  - method: GET
    path: "/treatment-network/authorizations/{id}/level-of-care-changes"
    description: "List the level-of-care changes funded by one authorization"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LevelOfCareChange[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/authorizations/{authorizationId}/approve"
    description: "Approve a pending authorization: grants the level, sets authorized_days from the payer's map and computes the concurrent-review due instant"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: LevelOfCareAuthorization
    side_effects:
      - "posture becomes APPROVED; granted_level and authorized_days are written"
      - "review_due_at = now + (authorized_days - payer.concurrent_review_interval_days) days"
      - "Episode clinical_status becomes AWAITING_ADMISSION when every clearance still reads CLEARED"

  - method: POST
    path: "/treatment-network/facilities/{id}/authorizations/{authorizationId}/deny"
    description: "Deny a pending authorization, or demote an approved one into step-down pressure"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: LevelOfCareAuthorization
    side_effects:
      - "From PENDING: posture becomes DENIED"
      - "From APPROVED with days_used > 0: posture becomes STEP_DOWN_REQUIRED and the payer's coverage map promotes the next lower level"

  - method: POST
    path: "/treatment-network/facilities/{id}/authorizations/{authorizationId}/submit-concurrent-review"
    description: "File a concurrent review: extends authorized_days by the payer's review interval and recomputes the next review instant"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: LevelOfCareAuthorization
    side_effects:
      - "authorized_days extends by payer.concurrent_review_interval_days; concurrent_review_count increments by 1"
      - "review_due_at is recomputed"
      - "urgency_score is recalculated (calculations.step_down_urgency_score variant A)"

  # ---------------------------------------------------------------------------
  # Medical clearance
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/medical-clearances"
    description: "Order a medical, psychiatric or TB-screen clearance for the episode"
    roles: [AdmissionsIntakeNurse, Clinician]
    code: 201
    input: [clearance_type]
    output: MedicalClearance
    side_effects:
      - "status initializes PENDING; ordered_at is stamped"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/medical-clearances"
    description: "List an episode's clearances"
    roles: [Any]
    code: 200
    input: ["clearance_type?", "status?", "limit?", "offset?"]
    output: "MedicalClearance[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/medical-clearances"
    description: "List an episode's clearances across the network"
    roles: [Any]
    code: 200
    input: ["clearance_type?", "status?", "limit?", "offset?"]
    output: "MedicalClearance[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/medical-clearances/{clearanceId}/clear"
    description: "Record a clearance as CLEARED; the validity window closes 7 days later on the minute"
    roles: [Clinician, ClinicalDirector]
    code: 200
    input: []
    output: MedicalClearance
    side_effects:
      - "status becomes CLEARED; cleared_at is stamped; expires_at = cleared_at + 7 days"

  - method: POST
    path: "/treatment-network/facilities/{id}/medical-clearances/{clearanceId}/fail"
    description: "Record a clearance as FAILED"
    roles: [Clinician, ClinicalDirector]
    code: 200
    input: []
    output: MedicalClearance
    side_effects:
      - "status becomes FAILED"

  # ---------------------------------------------------------------------------
  # Withdrawal management
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/withdrawal-management"
    description: "Author the episode's withdrawal-management plan and its medication reconciliation series"
    roles: [Clinician]
    code: 201
    input: [protocol, ciwa_score, dose_records]
    output: WithdrawalManagementPlan
    side_effects:
      - "status initializes ACTIVE; ciwa_recorded_at is stamped"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/withdrawal-management"
    description: "List an episode's withdrawal-management plans"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "WithdrawalManagementPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/withdrawal-management"
    description: "List an episode's withdrawal-management plans across the network"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "WithdrawalManagementPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/facilities/{id}/withdrawal-management"
    description: "List every withdrawal-management plan at one facility"
    roles: [Any]
    code: 200
    input: ["status?", "episode_id?", "limit?", "offset?"]
    output: "WithdrawalManagementPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/withdrawal-management/{id}"
    description: "Get one withdrawal-management plan across the network"
    roles: [Any]
    code: 200
    input: []
    output: WithdrawalManagementPlan
    side_effects: []

  - method: PUT
    path: "/treatment-network/facilities/{id}/withdrawal-management/{planId}"
    description: "Update the withdrawal-management plan: new CIWA score, additional dose records, or a status move to MEDICALLY_STABLE or COMPLICATED"
    roles: [Clinician]
    code: 200
    input: ["ciwa_score?", "dose_records?", "status?"]
    output: WithdrawalManagementPlan
    side_effects:
      - "ciwa_score changes re-run calculations.step_down_urgency_score for the episode's live authorizations"
      - "status COMPLICATED makes the episode a step-up candidate"

  # ---------------------------------------------------------------------------
  # Treatment plans
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/treatment-plans"
    description: "Create a treatment plan for the episode; the new row supersedes the prior ACTIVE plan"
    roles: [Clinician]
    code: 201
    input: [author_clinician_id, cosign_rationale_code, expected_treatment_episode_version, "supersedes_plan_id?"]
    output: TreatmentPlan
    side_effects:
      - "status becomes DRAFT; required_sessions_per_week is derived from assigned_level"
      - "Any prior ACTIVE plan for the episode becomes SUPERSEDED"
      - "increments TreatmentEpisode.version by 1"
      - "Idempotency-Key is accepted on this endpoint"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/treatment-plans"
    description: "List an episode's treatment plans"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/treatment-plans"
    description: "List an episode's treatment plans across the network"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-plans"
    description: "List every treatment plan at one facility"
    roles: [Any]
    code: 200
    input: ["status?", "episode_id?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-plans/{id}"
    description: "Get one treatment plan across the network"
    roles: [Any]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: PUT
    path: "/treatment-network/treatment-plans/{id}"
    description: "Edit a treatment plan (author or rationale code) under optimistic concurrency"
    roles: [Clinician, ClinicalDirector]
    code: 200
    input: ["author_clinician_id?", "cosign_rationale_code?", "expected_treatment_plan_version"]
    output: TreatmentPlan
    side_effects:
      - "increments TreatmentPlan.version by 1"

  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-plans/{planId}/submit-for-cosign"
    description: "Submit a plan for clinical-director co-signature"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "status DRAFT becomes PENDING_COSIGN, then ACTIVE on acceptance in the same call"
      - "increments TreatmentPlan.version by 1"

  # ---------------------------------------------------------------------------
  # Sessions
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/sessions"
    description: "Schedule a group, individual or family session against a service offering"
    roles: [AdmissionsIntakeNurse, Clinician]
    code: 201
    input: [service_id, clinician_id, scheduled_at, duration_minutes]
    output: SessionAttendance
    side_effects:
      - "status initializes SCHEDULED; attended initializes false; billing_amount_cents 0"
      - "Idempotency-Key is accepted on this endpoint"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/sessions"
    description: "List an episode's sessions"
    roles: [Any]
    code: 200
    input: ["status?", "service_id?", "limit?", "offset?"]
    output: "SessionAttendance[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/sessions"
    description: "List an episode's sessions across the network"
    roles: [Any]
    code: 200
    input: ["status?", "service_id?", "limit?", "offset?"]
    output: "SessionAttendance[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/sessions/{id}"
    description: "Get one session attendance across the network"
    roles: [Any]
    code: 200
    input: []
    output: SessionAttendance
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/sessions/{sessionId}/record-attendance"
    description: "Record attendance or a no-show for a scheduled session"
    roles: [Clinician]
    code: 200
    input: [attended]
    output: SessionAttendance
    side_effects:
      - "status becomes ATTENDED or NO_SHOW"
      - "billing_amount_cents is computed from the service level and duration, or 0 when the row is not ATTENDED"
      - "TreatmentEpisode.therapy_revenue_cents is recomputed"

  - method: POST
    path: "/treatment-network/facilities/{id}/sessions/{sessionId}/cancel"
    description: "Cancel a scheduled session; the row is retained, never deleted"
    roles: [Clinician]
    code: 200
    input: []
    output: SessionAttendance
    side_effects:
      - "status becomes CANCELLED; billing_amount_cents becomes 0"

  # ---------------------------------------------------------------------------
  # Level-of-care changes (step-down / step-up)
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/level-of-care-changes"
    description: "Appoint a level-of-care change: step the episode down into a lower funded level or step it up into a higher bed"
    roles: [ClinicalDirector, UtilizationReviewer]
    code: 201
    input: [authorization_id, to_level, effective_at, expected_treatment_episode_version, "bed_id?"]
    output: LevelOfCareChange
    side_effects:
      - "status initializes PLANNED; change_type is STEP_DOWN or STEP_UP by rank comparison"
      - "Episode care_level_status ACTIVE becomes STEP_DOWN_PENDING for a step-down"
      - "increments TreatmentEpisode.version by 1"

  - method: GET
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/level-of-care-changes"
    description: "List an episode's level-of-care changes"
    roles: [Any]
    code: 200
    input: ["status?", "change_type?", "limit?", "offset?"]
    output: "LevelOfCareChange[]"
    side_effects: []

  - method: GET
    path: "/treatment-network/treatment-episodes/{id}/level-of-care-changes"
    description: "List an episode's level-of-care changes across the network"
    roles: [Any]
    code: 200
    input: ["status?", "change_type?", "limit?", "offset?"]
    output: "LevelOfCareChange[]"
    side_effects: []

  - method: POST
    path: "/treatment-network/facilities/{id}/level-of-care-changes/{changeId}/complete"
    description: "Complete a planned change: releases the source bed into CLEANING, occupies the target bed, freezes the revenue-cap snapshots and increments step_down_count"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: LevelOfCareChange
    side_effects:
      - "status becomes COMPLETED; episode care_level_status becomes STEPPED_DOWN"
      - "revcap_pre_step_down_cents and revcap_post_step_down_cents are frozen"
      - "Episode step_down_count increments by 1 for a step-down (calculations.bed_night_bank forward leg)"
      - "The source bed becomes CLEANING with next_available_at set; the target bed becomes OCCUPIED"

  - method: POST
    path: "/treatment-network/facilities/{id}/level-of-care-changes/{changeId}/cancel"
    description: "Cancel a planned change, or compensate a completed one inside the same ops epoch"
    roles: [ClinicalDirector]
    code: 200
    input: []
    output: LevelOfCareChange
    side_effects:
      - "From PLANNED: status becomes CANCELLED and the episode returns to ACTIVE"
      - "From COMPLETED inside the same ops epoch: step_down_count decrements by 1, the target bed returns to AVAILABLE and the source bed returns to OCCUPIED (calculations.bed_night_bank compensating leg)"

  - method: POST
    path: "/treatment-network/facilities/{id}/level-of-care-changes/{changeId}/step-up"
    description: "Raise the episode to a higher level of care when withdrawal management is COMPLICATED and a higher-level bed is free"
    roles: [ClinicalDirector]
    code: 200
    input: [bed_id]
    output: LevelOfCareChange
    side_effects:
      - "A companion STEP_UP change is recorded; assigned_level rises and step_down_count decrements by 1, floored at 0"
      - "The higher-level bed becomes OCCUPIED and the lower-level bed becomes CLEANING"

  # ---------------------------------------------------------------------------
  # Continuing care, recovery housing placement, alumni contacts
  # ---------------------------------------------------------------------------
  - method: POST
    path: "/treatment-network/facilities/{id}/treatment-episodes/{episodeId}/continuing-care-plans"
    description: "Draft the continuing-care plan: recovery-housing placement window plus the alumni contact cadence"
    roles: [ClinicalDirector, Clinician]
    code: 201
    input: [housing_selection_basis, housing_window_start, housing_window_end, alumni_contact_interval_days, alumni_contacts_required, authorizing_clinician_id, shelter_class, wants_recovery_only_house, expected_treatment_episode_version, "housing_id?"]
    output: ContinuingCarePlan
    side_effects:
      - "status becomes DRAFT"
      - "Any prior ACTIVE plan for the episode becomes SUPERSEDED"
      - "increments TreatmentEpisode.version by 1"

