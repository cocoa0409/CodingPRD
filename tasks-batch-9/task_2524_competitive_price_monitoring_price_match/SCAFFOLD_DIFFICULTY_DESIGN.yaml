  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: link_review_revision_cycle_raises_grade_then_confirms
        grounds:
          - state_machines.CompetitorProductLink.PROPOSED_to_UNDER_REVIEW
          - state_machines.CompetitorProductLink.UNDER_REVIEW_to_PROPOSED
          - state_machines.CompetitorProductLink.PROPOSED_to_CONFIRMED
          - entities.CompetitorProductLink.fields.review_round
          - calculations.match_confidence_score
        distinguishing_aspect: |
          Cycle on CompetitorProductLink: the row leaves PROPOSED, returns to PROPOSED
          through the revise edge with review_round incremented from 0 to 1 and
          confidence_bp recomputed from 8485 to 8500, then confirms — a closed loop
          A->B->A that a linear pipeline cannot express.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST, one ACTIVE product SKU-BLENDER-1, one ACTIVE PRIMARY competitor C-ALPHA."
            - "No link exists yet."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-BLENDER-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 24999, unit_cost_cents: 15000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 100, attribute_score: 60, image_score: 79 }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "OPEN_REVIEW", note: "image evidence looks weak" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches/${l_id}/revise"
              payload: { image_score: 80 }
              as: PricingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
          assert:
            - "CompetitorProductLink.${l_id}.confidence_bp == 8500 after the revise call (55*100 + 30*60 + 15*80)"
            - "CompetitorProductLink.${l_id}.match_grade == EXACT after the revise call (it was CLOSE at 8485 before)"
            - "CompetitorProductLink.${l_id}.review_round == 1 (OPEN_REVIEW does not count, the revise edge does)"
            - "CompetitorProductLink.${l_id}.status == CONFIRMED at the end of the loop"
            - "Competitor.${c1_id}.confirmed_match_count == 1"
            - "Competitor.${c1_id}.stale_share_bp == 0"
            - "CompetitorProductLink.${l_id}.data_status == INSUFFICIENT (no observation was ever posted)"
            - "CompetitorProductLink.${l_id}.gap_bp == null"

      - name: claim_verification_fork_and_evidence_cycle
        grounds:
          - state_machines.PriceMatchClaim.SUBMITTED_to_VERIFYING
          - state_machines.PriceMatchClaim.VERIFYING_to_NEEDS_EVIDENCE
          - state_machines.PriceMatchClaim.NEEDS_EVIDENCE_to_VERIFYING
          - state_machines.PriceMatchClaim.VERIFYING_to_VERIFIED
          - state_machines.PriceMatchClaim.VERIFYING_to_REJECTED
          - entities.PriceMatchClaim.fields.evidence_round
        distinguishing_aspect: |
          Non-linear shape on a different entity (PriceMatchClaim): VERIFYING forks into
          three targets with divergent side-effect sets (VERIFIED writes nothing,
          REJECTED writes rejection_reason, NEEDS_EVIDENCE parks the row) and the
          NEEDS_EVIDENCE -> VERIFYING edge closes a counted cycle (evidence_round 0 -> 1).
