            - "Both traces carry the same four in-band points (0.4000, 0.5000, 0.6000, 0.7000) plus a fifth point of 0.3000 that sits at 701 nm in the first attempt and at 700 nm in the second, so the passing average is exactly (0.4+0.5+0.6+0.7+0.3)/5 = 0.5000."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
