              captures: { rec_cd2_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_cd_id}", mrn: "CD-3000", last_name: "Vasquez", first_name: "Lupita", dob: "1985-01-08", sex: "F", ssn_last4: "1818", postal_code: "84102", phone: "8015550202", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_cd3_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_cd_id}", mrn: "CD-4000", last_name: "Vasquez", first_name: "Lupita", dob: "1985-01-08", sex: "F", ssn_last4: "1818", postal_code: "84102", phone: "8015550202", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_cd4_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
