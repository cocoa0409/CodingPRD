            - "Paternity runs the GENETIC_TEST track to an INCLUSION result, so genetic_cost_cents is 48000 and genetic_cost_liable_party is NCP."
            - "ENTERED order with monthly_obligation_cents 75000 and medical_support_monthly_cents 20000."
            - "Charges: ARREARS_JUDGMENT 30000 due 2026-08-15, CURRENT_SUPPORT 75000 and MEDICAL_SUPPORT 20000 both for period 2026-09-01..2026-10-01 due 2026-09-01."
            - "Clock advanced to 2026-09-20T00:00:00Z, where the aggregate interest receivable is 150."
