            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: TICKETED, start_at: "2026-08-10T12:00:00Z", end_at: "2026-08-10T13:00:00Z", line_space_units: 5, capacity_seats: 4, admit_concurrent_cap: 1 }, as: Organizer, captures: { session2_id: "$.data.id" } }
