          trigger:
            - call: "POST /merchant-settlements/00000000-0000-4000-8000-000000000000/release"
              as: Servicer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_grace_boundary_strict_greater
        grounds:
          - calculations.late_fee_assessment
          - entities.Installment.fields.late_fee_cents
          - state_machines.Installment.SCHEDULED_to_LATE
        distinguishing_aspect: |
          Metric = grace window on an Installment via POST /_clock/set_current_utc.
          At now == due_date + GRACE_DAYS (exactly 2026-01-11 for inst1 due 2026-01-01)
          the installment is still SCHEDULED (strict > boundary); one day later it
          becomes LATE with late_fee 1250c.
