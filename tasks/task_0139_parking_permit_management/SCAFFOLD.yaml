  - method: GET
    path: "/parking/waitlist-entries/{id}"
    description: "Read a waitlist entry"
    roles: [FacilityAdmin, Motorist]
    code: 200
    input: []
    output: PermitWaitlistEntry
    side_effects: []
  - method: POST
    path: "/parking/waitlist-entries/{id}/cancel"
    description: "Motorist cancels their own WAITING waitlist entry"
    roles: [Motorist]
    code: 200
    input: []
    output: PermitWaitlistEntry
    side_effects: ["sets CANCELLED", "increments PermitWaitlistEntry.version by 1"]

