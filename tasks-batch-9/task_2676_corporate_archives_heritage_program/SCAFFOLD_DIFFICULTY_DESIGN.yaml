            - "Then one environment reading of 20.5 C / 52.0 % RH is recorded: 20.5 exceeds TEMP_COMPLIANT_MAX_C 18.0 but not TEMP_MARGINAL_MAX_C 21.0, and 52.0 exceeds RH_COMPLIANT_MAX_PCT 50.0 but not RH_MARGINAL_MAX_PCT 55.0, so environmental_status becomes MARGINAL and reading_count becomes 2."
