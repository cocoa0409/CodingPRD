            - "first approve-security rejected with ERR_SECURITY_LEVEL_INSUFFICIENT (agreement level 2 < required 3)"
            - "after superseding activation: tour status == SECURITY_APPROVED (agreement level 3 >= 3)"
            - "agreement A status == TERMINATED (supersede cascade from the level-3 activation)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_shift_half_open_adjacency
        grounds:
          - calculations.shift_overlap
          - errors[ERR_SHIFT_OVERLAP]
          - "endpoints[POST /shifts/{id}/assignments]"
        distinguishing_aspect: |
          Half-open interval semantics on the volunteer-time resource: back-to-back
          shifts (12:00 == 12:00 boundary touch) do NOT overlap and are both
          assignable, while an 11:00-15:00 shift straddling the seam IS rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center with ACTIVE agreement; volunteer cleared"
            - "Shifts s1 08:00-12:00, s2 12:00-16:00 (adjacent), s3 11:00-15:00 (straddles) on 2026-09-03"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Omicron Center", airport_code: "AUS", occupancy_cap: 30, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 700, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
