            - "the 11:00:00Z confirm returns HTTP 200 with CustomCakeOrder.${cake_a_id}.order_status == CONFIRMED — equality with the deadline passes"
            - "${e_lead_missed} == ERR_DECORATION_LEAD_TIME_MISSED with HTTP 422 and CustomCakeOrder.${cake_b_id}.order_status is still INTAKE"
            - "PickupSlot.${slot_id}.reserved_decoration_units == 8 — only the accepted order reserved capacity"

      - name: slot_capacity_aggregates_confirmed_orders_and_allows_exact_equality
        claim_type: aggregation
        grounds:
          - calculations.pickup_slot_capacity
          - validations.priority_40
          - errors.ERR_PICKUP_SLOT_CAPACITY_EXCEEDED
        distinguishing_aspect: "Each order is individually small but the slot's 10-unit capacity is collective: after an 8-unit order is CONFIRMED a 4-unit order is refused (12 > 10) while a 2-unit order is accepted at exactly 10 == 10."
        test_recipe:
          setup:
            - "DRAFT BakeDay on 2026-08-12 with an OPEN 14:00-16:00Z slot whose decorator_capacity_units is 10 and three INTAKE orders: STANDARD 2-tier (8 units), SIMPLE 2-tier (4 units), SIMPLE 1-tier (2 units)."
          setup_api_calls:
