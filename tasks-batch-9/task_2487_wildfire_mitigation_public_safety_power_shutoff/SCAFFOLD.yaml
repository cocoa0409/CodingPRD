# =============================================================================
# PRD Benchmark Seed Tables — Wildfire Mitigation & Public Safety Power Shutoff
# Task 2487 — difficulty band: beyond Expert (§0.4 Expert + extra coupling)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2487. Wildfire Mitigation & Public Safety Power Shutoff (western electric utility): risk modeling by
  circuit with fuel, weather, terrain and equipment condition inputs, mitigation program execution across
  covered conductor, undergrounding, fast-trip settings and inspection cycles, weather monitoring with
  station networks, fire potential indices and forecast thresholds for de-energization decisions, shutoff
  scope determination balancing ignition risk against customer impact including medical baseline and
  critical facility customers, customer notification sequencing with advance warnings across languages and
  accessibility needs, community resource center activation during outages, patrol and re-energization
  procedures after weather subsides with damage assessment, plan filing, regulatory review and performance
  metric reporting

domain_name: wildfire-mitigation-psps
api_prefix: ""    # flat topology — every collection is a top-level path segment

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is its own top-level collection linked by explicit foreign keys; no entity id is nested
  # inside another entity's URL path. Circuit additionally carries a self-reference (upstream feeder),
  # and EventScope is a many-to-many junction between PSPSEvent and Circuit.

  state_machine_shape: cyclic
  # Circuit.energization_state is a true cycle (ENERGIZED -> ... -> ENERGIZED). PSPSEvent carries two
  # independent state dimensions on one row (scope_status x notification_status). MitigationProject has a
  # revision loop plus a suspend/resume loop. WildfirePlanFiling is a fork-join over two independent
  # review tracks with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Circuit -> Customer / WeatherStation / MitigationProject
    - many_to_many         # PSPSEvent <-> Circuit via EventScope
    - self_referential     # Circuit.upstream_circuit_id -> Circuit.id (feeder chain, transitive closure)
    - cross_aggregate      # PatrolAssignment references both PSPSEvent and Circuit

  role_model: segregation_of_duties
  # Three explicit SoD gates: (a) the reviewer who requested a mitigation revision cannot approve it,
  # (b) the operator who led the clearing patrol cannot re-energize the circuit, (c) one reviewer cannot
  # clear both the safety and the fiscal track of a plan filing.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Circuit
    parent: null
    common_fields: true
    fields:
      - name: circuit_code
        type: string
        source: input
        description: Operator-facing circuit identifier.
        constraints: "unique across all Circuit rows; 3..40 chars"
      - name: district_code
        type: string
        source: input
        description: Operating district the circuit belongs to; also the matching key for resource-center eligibility.
        constraints: "3..40 chars"
      - name: hftd_tier
        type: enum
        source: input
        description: CPUC high fire threat district tier of the circuit's terrain.
        constraints: "TIER_1 | TIER_2 | TIER_3 | NON_HFTD"
      - name: overhead_miles
        type: number
        source: input
        description: Immutable baseline overhead line mileage; the denominator of hardened_fraction.
        constraints: "> 0; at most 1 decimal place"
      - name: equipment_condition_index
        type: number
        source: input
        description: Asset health score where 100 is pristine; drives the equipment component of the fire potential index.
        constraints: "0 <= value <= 100"
      - name: inspection_cycle_months
        type: integer
        source: input
        default: 36
        description: Nominal months between full inspections of this circuit.
        constraints: "1 <= value <= 120"
      - name: last_inspection_completed_at
        type: datetime
        source: input
        default: null
        description: Timestamp of the most recent completed inspection; null means never inspected.
      - name: upstream_circuit_id
        type: string
        source: input
        default: null
        description: "FK -> Circuit.id; nullable self-reference naming the immediately upstream feeder circuit. Null means the circuit is fed directly from transmission."
      - name: fast_trip_enabled
        type: boolean
        source: input
        default: false
        description: Whether enhanced powerline safety (fast-trip) settings are armed on this circuit.
      - name: covered_conductor_miles
        type: number
        source: computed
        default: 0
        description: "Sum of completed_miles over this circuit's MitigationProject rows with program_type == COVERED_CONDUCTOR and status IN {IN_EXECUTION, SUSPENDED, COMPLETED}."
      - name: underground_miles
        type: number
        source: computed
        default: 0
        description: "Sum of completed_miles over this circuit's MitigationProject rows with program_type == UNDERGROUNDING and status IN {IN_EXECUTION, SUSPENDED, COMPLETED}."
      - name: hardened_fraction
        type: number
        source: computed
        default: 0
        description: Output of calculations.circuit_hardened_fraction; 4 decimal places, capped at 1.0000.
      - name: customer_count
        type: integer
        source: computed
        default: 0
        description: Count of Customer rows whose circuit_id equals this circuit's id.
      - name: medical_baseline_count
        type: integer
        source: computed
        default: 0
        description: Count of Customer rows on this circuit with medical_baseline == true.
      - name: critical_facility_count
        type: integer
        source: computed
        default: 0
        description: Count of Customer rows on this circuit with customer_class == CRITICAL_FACILITY.
      - name: energization_state
        type: enum
        source: system
        default: ENERGIZED
        description: Physical energization phase of the circuit; see state_machines.Circuit.
        constraints: "ENERGIZED | DE_ENERGIZATION_PENDING | DE_ENERGIZED | PATROL_IN_PROGRESS | CLEARED_FOR_RESTORE"
      - name: risk_posture
        type: enum
        source: computed
        default: NORMAL
        description: Output of calculations.circuit_risk_posture; gates every MitigationProject write on this circuit.
        constraints: "NORMAL | ELEVATED | EXTREME | LOCKED"
      - name: latest_forecast_fpi_score
        type: number
        source: computed
        default: null
        description: fpi_score of the FORECAST-variant FirePotentialIndex selected by calculations.circuit_risk_posture; null when none exists.
      - name: latest_forecast_fpi_tier
        type: enum
        source: computed
        default: null
        description: fpi_tier of that same selected index; null when none exists.
        constraints: "R1 | R2 | R3 | R4 | R5 | null"

  - name: WeatherStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: Station identifier in the utility's monitoring network.
        constraints: "unique across all WeatherStation rows; 3..40 chars"
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit whose fire potential index this station feeds."
      - name: elevation_ft
        type: integer
        source: input
        description: Station elevation in feet above sea level.
        constraints: "-300 <= value <= 15000"
      - name: representativeness_weight
        type: number
        source: input
        description: Weight of this station when its observations are blended into the circuit's effective weather inputs.
        constraints: "0 < value <= 1; at most 2 decimal places"
      - name: telemetry_status
        type: enum
        source: input
        default: ONLINE
        description: Health of the station's telemetry link; OFFLINE stations are excluded from index computation, DEGRADED stations are down-weighted.
        constraints: "ONLINE | DEGRADED | OFFLINE"
      - name: observation_count
        type: integer
        source: computed
        default: 0
        description: Count of WeatherObservation rows whose weather_station_id equals this station's id.
      - name: last_observation_at
        type: datetime
        source: computed
        default: null
        description: Greatest observed_at among this station's WeatherObservation rows; null when none exist.

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - name: weather_station_id
        type: string
        source: input
        description: "FK -> WeatherStation.id; the station that produced this observation."
      - name: observed_at
        type: datetime
        source: input
        description: Instant the observation applies to; the selection window of a fire potential index is expressed over this field.
      - name: wind_gust_mph
        type: number
        source: input
        description: Peak wind gust in miles per hour.
        constraints: "0 <= value <= 200; at most 1 decimal place"
      - name: relative_humidity_pct
        type: number
        source: input
        description: Relative humidity in percent.
        constraints: "0 <= value <= 100; at most 1 decimal place"
      - name: temperature_f
        type: number
        source: input
        description: Dry-bulb air temperature in degrees Fahrenheit.
        constraints: "-40 <= value <= 140; at most 1 decimal place"
      - name: dead_fuel_moisture_pct
        type: number
        source: input
        description: Dead fuel moisture content in percent; lower means drier fuel.
        constraints: "0 <= value <= 60; at most 1 decimal place"

  - name: FirePotentialIndex
    parent: null
    common_fields: false
    fields:
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit this index scores."
      - name: forecast_date
        type: string
        source: input
        description: UTC calendar day the index scores, as YYYY-MM-DD; anchors the observation selection window.
        constraints: "matches ^\\d{4}-\\d{2}-\\d{2}$"
      - name: computation_variant
        type: enum
        source: input
        description: Which variant of calculations.fire_potential_index to run.
        constraints: "FORECAST | VALIDATED"
      - name: contributing_station_count
        type: integer
        source: computed
        description: Number of eligible stations that supplied at least one in-window observation.
      - name: effective_wind_gust_mph
        type: number
        source: computed
        description: Weight-blended wind gust for the circuit under the selected variant.
      - name: effective_relative_humidity_pct
        type: number
        source: computed
        description: Weight-blended relative humidity for the circuit under the selected variant.
      - name: effective_dead_fuel_moisture_pct
        type: number
        source: computed
        description: Weight-blended dead fuel moisture for the circuit under the selected variant.
      - name: wind_component
        type: number
        source: computed
        description: Wind sub-score in 0..100.
      - name: dryness_component
        type: number
        source: computed
        description: Fuel/humidity dryness sub-score in 0..100.
      - name: terrain_component
        type: number
        source: computed
        description: Terrain sub-score in 0..100, keyed on Circuit.hftd_tier.
      - name: equipment_component
        type: number
        source: computed
        description: Equipment-condition sub-score in 0..100, including the inspection-overdue penalty.
      - name: inspection_overdue
        type: boolean
        source: computed
        description: Whether the circuit's inspection cycle had already lapsed at the logical clock instant of this computation.
      - name: hardened_fraction_applied
        type: number
        source: computed
        description: Snapshot of Circuit.hardened_fraction used to discount the raw score.
      - name: fpi_score
        type: number
        source: computed
        description: Final index, 2 decimal places.
      - name: fpi_tier
        type: enum
        source: computed
        description: Tier derived from fpi_score.
        constraints: "R1 | R2 | R3 | R4 | R5"

  - name: PSPSEvent
    parent: null
    common_fields: true
    fields:
      - name: event_code
        type: string
        source: input
        description: Operator-facing shutoff event identifier.
        constraints: "unique across all PSPSEvent rows; 3..40 chars"
      - name: trigger_fire_potential_index_id
        type: string
        source: input
        description: "FK -> FirePotentialIndex.id; the index whose tier justified opening this event."
      - name: forecast_onset_at
        type: datetime
        source: input
        description: Forecast start of the damaging-weather window; the reference instant for notification lead times.
      - name: forecast_all_clear_at
        type: datetime
        source: input
        description: Forecast end of the damaging-weather window.
        constraints: "strictly greater than forecast_onset_at"
      - name: scope_status
        type: enum
        source: system
        default: DRAFT
        description: Operational phase dimension; see state_machines.PSPSEvent (dimension scope_status).
        constraints: "DRAFT | SCOPED | ARMED | ACTIVE | RESTORING | CLOSED | CANCELLED"
      - name: notification_status
        type: enum
        source: system
        default: NOT_STARTED
        description: Customer-communication dimension; advances independently of scope_status on the same row.
        constraints: "NOT_STARTED | ADVANCE_SENT | IMMINENT_SENT | ACTIVATION_SENT | RESTORATION_SENT"
      - name: cancellation_reason
        type: string
        source: input
        default: null
        description: Free-text reason recorded when the event is cancelled; null until then.
      - name: actual_de_energized_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant at which the de-energization order executed.
      - name: actual_restored_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant at which the last CONFIRMED-scoped circuit returned to ENERGIZED.
      - name: duration_hours
        type: integer
        source: computed
        default: 0
        description: Outage duration in whole hours used by calculations.psps_net_benefit_ratio under the active variant.
      - name: benefit_variant
        type: enum
        source: computed
        default: PRE_EVENT
        description: Which variant of calculations.psps_net_benefit_ratio produced the currently stored scores.
        constraints: "PRE_EVENT | POST_EVENT"
      - name: confirmed_scope_count
        type: integer
        source: computed
        default: 0
        description: Count of this event's EventScope rows with scope_status == CONFIRMED.
      - name: excluded_scope_count
        type: integer
        source: computed
        default: 0
        description: Count of this event's EventScope rows with scope_status == EXCLUDED.
      - name: impacted_customer_count
        type: integer
        source: computed
        default: 0
        description: Sum of customer_count_snapshot over this event's EventScope rows with scope_status == CONFIRMED.
      - name: medical_baseline_customer_count
        type: integer
        source: computed
        default: 0
        description: Sum of Circuit.medical_baseline_count over the circuits of this event's CONFIRMED EventScope rows.
      - name: critical_facility_count
        type: integer
        source: computed
        default: 0
        description: Sum of Circuit.critical_facility_count over the circuits of this event's CONFIRMED EventScope rows.
      - name: ignition_risk_avoided_score
        type: number
        source: computed
        default: 0
        description: Output of calculations.ignition_risk_avoided_score, 2 decimal places.
      - name: customer_impact_score
        type: number
        source: computed
        default: 0
        description: Step 1 output of calculations.psps_net_benefit_ratio, 2 decimal places.
      - name: crc_capacity_required
        type: integer
        source: computed
        default: 0
        description: medical_baseline_customer_count + critical_facility_count.
      - name: crc_capacity_served
        type: integer
        source: computed
        default: 0
        description: Sum of site_capacity over CommunityResourceCenter rows with psps_event_id == this event and status == ACTIVATED.
      - name: crc_mitigation_credit
        type: number
        source: computed
        default: 0
        description: Step 4 output of calculations.psps_net_benefit_ratio, 2 decimal places.
      - name: adjusted_customer_impact_score
        type: number
        source: computed
        default: 0
        description: customer_impact_score minus crc_mitigation_credit, 2 decimal places.
      - name: net_benefit_ratio
        type: number
        source: computed
        default: 0
        description: Final output of calculations.psps_net_benefit_ratio, 4 decimal places.

  - name: EventScope
    parent: null
    common_fields: true
    fields:
      - name: psps_event_id
        type: string
        source: input
        description: "FK -> PSPSEvent.id; the shutoff event this scope row belongs to."
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit swept into (or explicitly held out of) the event."
      - name: inclusion_basis
        type: enum
        source: computed
        description: Why the circuit entered the scope set.
        constraints: "PRIMARY_RISK | DOWNSTREAM_DEPENDENCY"
      - name: scope_status
        type: enum
        source: system
        default: CONFIRMED
        description: Whether the circuit will actually be de-energized with the event.
        constraints: "CONFIRMED | EXCLUDED"
      - name: exclusion_justification
        type: string
        source: input
        default: null
        description: Reason the circuit is held out; set to the literal FAST_TRIP_MITIGATED_R4 by the scope calculation's exemption branch, or to the operator's text by the exclude endpoint.
      - name: customer_count_snapshot
        type: integer
        source: computed
        description: Circuit.customer_count captured at the instant this scope row was written.
      - name: fpi_score_applied
        type: number
        source: computed
        description: The fpi_score attributed to this circuit by calculations.psps_scope_determination (own index for PRIMARY_RISK, inherited for DOWNSTREAM_DEPENDENCY).
      - name: ignition_risk_term
        type: number
        source: computed
        description: This row's rounded contribution to PSPSEvent.ignition_risk_avoided_score, 2 decimal places; 0.00 when scope_status == EXCLUDED.
      - name: restored_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant at which this row's circuit returned to ENERGIZED after the event.

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: account_number
        type: string
        source: input
        description: Billing account number.
        constraints: "unique across all Customer rows; 3..40 chars"
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit serving this account."
      - name: customer_class
        type: enum
        source: input
        description: Service class of the account.
        constraints: "RESIDENTIAL | COMMERCIAL | CRITICAL_FACILITY"
      - name: medical_baseline
        type: boolean
        source: input
        default: false
        description: Whether the account is enrolled in the medical baseline program.
      - name: preferred_language
        type: enum
        source: input
        description: Language the account elected for outage notifications.
        constraints: "EN | ES | ZH | TL | VI"
      - name: notification_channels
        type: array
        source: input
        description: Channels the account has consented to, as an unordered set of enum members.
        constraints: "non-empty; members drawn from {SMS, VOICE, EMAIL}; no duplicates"
      - name: accessibility_needs
        type: array
        source: input
        default: []
        description: Accessibility accommodations on file, as an unordered set of enum members.
        constraints: "members drawn from {LARGE_PRINT, TTY, AUDIO}; no duplicates"
      - name: address_zone_code
        type: string
        source: input
        description: Service-address zone used by field crews.
        constraints: "1..20 chars"
      - name: notification_tier
        type: enum
        source: computed
        description: Output of calculations.customer_notification_tier; drives dispatch ordering and the critical-notification gate.
        constraints: "TIER_A_CRITICAL | TIER_B_MEDICAL | TIER_C_STANDARD"

  - name: NotificationBatch
    parent: null
    common_fields: true
    fields:
      - name: psps_event_id
        type: string
        source: input
        description: "FK -> PSPSEvent.id; the event this batch communicates."
      - name: stage
        type: enum
        source: input
        description: Position of this batch in the notification sequence.
        constraints: "ADVANCE_48H | ADVANCE_24H | IMMINENT_1H | ACTIVATION | RESTORATION"
      - name: scheduled_send_at
        type: datetime
        source: input
        description: Operator-planned send instant; validated against the event window but not itself the lead-time basis.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Dispatch outcome of the batch.
        constraints: "PENDING | DISPATCHED | FAILED_PARTIAL"
      - name: dispatched_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant the dispatch endpoint ran; the lead-time basis.
      - name: lead_time_minutes
        type: integer
        source: computed
        default: null
        description: Output of calculations.notification_lead_time; may be negative for post-onset stages.
      - name: target_count
        type: integer
        source: computed
        default: 0
        description: Number of NotificationRecord rows written by dispatch.
      - name: delivered_count
        type: integer
        source: computed
        default: 0
        description: Number of those records with delivery_status == DELIVERED.
      - name: unreachable_count
        type: integer
        source: computed
        default: 0
        description: Number of those records with delivery_status == UNREACHABLE.

  - name: NotificationRecord
    parent: null
    common_fields: false
    fields:
      - name: notification_batch_id
        type: string
        source: input
        description: "FK -> NotificationBatch.id; the batch that produced this record."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the account this record addresses."
      - name: attempt_order
        type: integer
        source: computed
        description: 1-based position of this record in the batch's deterministic dispatch order.
      - name: language_used
        type: enum
        source: computed
        description: Language actually rendered after the stage's language-set restriction.
        constraints: "EN | ES | ZH | TL | VI"
      - name: channel_used
        type: enum
        source: computed
        default: null
        description: Channel actually attempted; null when no consented channel survives the accessibility filter.
        constraints: "SMS | VOICE | EMAIL | null"
      - name: accessibility_format
        type: enum
        source: computed
        description: Rendering format applied to the message body.
        constraints: "STANDARD | LARGE_PRINT"
      - name: delivery_status
        type: enum
        source: computed
        description: Whether the message was deliverable at all.
        constraints: "DELIVERED | UNREACHABLE"

  - name: MitigationProject
    parent: null
    common_fields: true
    fields:
      - name: project_code
        type: string
        source: input
        description: Program-tracking identifier for this work package.
        constraints: "unique across all MitigationProject rows; 3..40 chars"
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit the work hardens."
      - name: program_type
        type: enum
        source: input
        description: Which mitigation program this project executes.
        constraints: "COVERED_CONDUCTOR | UNDERGROUNDING | FAST_TRIP_SETTING | INSPECTION_CYCLE"
      - name: plan_year
        type: integer
        source: input
        description: Wildfire mitigation plan year this project is booked against; the join key for plan-filing metrics.
        constraints: "2020 <= value <= 2100"
      - name: planned_miles
        type: number
        source: input
        description: Scope of work in circuit miles.
        constraints: "> 0; at most 1 decimal place"
      - name: unit_cost_per_mile_cents
        type: integer
        source: input
        description: Unit cost in cents per circuit mile.
        constraints: ">= 0"
      - name: budget_cents
        type: integer
        source: computed
        description: planned_miles * unit_cost_per_mile_cents, truncated to a whole cent.
      - name: completed_miles
        type: number
        source: computed
        default: 0
        description: Cumulative miles recorded by record-completion calls; reset to 0 by the WITHDRAW compensating action.
      - name: risk_reduction_score
        type: number
        source: computed
        description: Output of calculations.mitigation_risk_reduction_score, 2 decimal places.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle state; see state_machines.MitigationProject.
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | IN_EXECUTION | SUSPENDED | COMPLETED | WITHDRAWN"
      - name: review_round
        type: integer
        source: computed
        default: 0
        description: Number of REQUEST_REVISION decisions issued against this project.
      - name: last_revision_reviewer_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the reviewer who issued the most recent REQUEST_REVISION; the SoD counterparty for APPROVE.
      - name: last_review_note
        type: string
        source: computed
        default: null
        description: review_note carried by the most recent review decision.

  - name: PatrolAssignment
    parent: null
    common_fields: true
    fields:
      - name: psps_event_id
        type: string
        source: input
        description: "FK -> PSPSEvent.id; the event whose restoration this patrol serves."
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit to be walked or flown."
      - name: patrol_mode
        type: enum
        source: input
        description: How the circuit will be inspected.
        constraints: "GROUND | AERIAL | DRONE"
      - name: window_start_at
        type: datetime
        source: input
        description: Inclusive start of the reserved patrol window on this circuit.
      - name: window_end_at
        type: datetime
        source: input
        description: Inclusive end of the reserved patrol window on this circuit.
        constraints: "strictly greater than window_start_at"
      - name: patrol_lead_user_id
        type: string
        source: input
        description: Opaque operator id of the crew lead accountable for the patrol; the SoD counterparty for re-energization.
        constraints: "1..64 chars"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Lifecycle state; see state_machines.PatrolAssignment.
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED"
      - name: started_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant the patrol started.
      - name: completed_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant the patrol completed.
      - name: miles_patrolled
        type: number
        source: computed
        default: 0
        description: Miles reported at completion.
      - name: damage_finding_count
        type: integer
        source: computed
        default: 0
        description: Count of DamageFinding rows whose patrol_assignment_id equals this assignment's id.
      - name: ignition_risk_finding_count
        type: integer
        source: computed
        default: 0
        description: Count of those findings with severity == IGNITION_RISK.

  - name: DamageFinding
    parent: null
    common_fields: false
    fields:
      - name: patrol_assignment_id
        type: string
        source: input
        description: "FK -> PatrolAssignment.id; the patrol that logged this finding."
      - name: severity
        type: enum
        source: input
        description: Severity band of the observed damage.
        constraints: "MINOR | MAJOR | IGNITION_RISK"
      - name: description
        type: string
        source: input
        description: Field note describing the damage.
        constraints: "1..500 chars"
      - name: requires_repair
        type: boolean
        source: input
        description: Whether a repair order is needed before the conductor is safe to energize.
      - name: found_at
        type: datetime
        source: system
        description: Logical clock instant at which the finding was filed.

  - name: CommunityResourceCenter
    parent: null
    common_fields: true
    fields:
      - name: resource_center_code
        type: string
        source: input
        description: Site identifier for the community resource center.
        constraints: "unique across all CommunityResourceCenter rows; 3..40 chars"
      - name: district_code
        type: string
        source: input
        description: Operating district the site sits in; must match a scoped circuit's district_code for the site to be eligible.
        constraints: "3..40 chars"
      - name: site_capacity
        type: integer
        source: input
        description: Number of customers the site can serve during one activation.
        constraints: ">= 1"
      - name: accessibility_certified
        type: boolean
        source: input
        default: false
        description: Whether the site is certified for accessibility accommodations; the primary ranking key of the activation selector.
      - name: status
        type: enum
        source: system
        default: STANDBY
        description: Activation lifecycle; see state_machines.CommunityResourceCenter.
        constraints: "STANDBY | ACTIVATED | DEMOBILIZED"
      - name: psps_event_id
        type: string
        source: computed
        default: null
        description: "FK -> PSPSEvent.id; the event this site is currently or was most recently activated for. Null until first activation."
      - name: activated_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant of the most recent activation.
      - name: demobilized_at
        type: datetime
        source: computed
        default: null
        description: Logical clock instant of the most recent demobilization.
      - name: last_served_all_clear_at
        type: datetime
        source: computed
        default: null
        description: forecast_all_clear_at of the most recent event this site served; the anchor of the reset-buffer overlap rule.
      - name: activation_order
        type: integer
        source: computed
        default: null
        description: 1-based rank this site held in the waterfall the last time it was activated.

  - name: WildfirePlanFiling
    parent: null
    common_fields: true
    fields:
      - name: filing_code
        type: string
        source: input
        description: Regulatory docket identifier for the filing.
        constraints: "unique across all WildfirePlanFiling rows; 3..40 chars"
      - name: plan_year
        type: integer
        source: input
        description: Plan year the filing covers; joins MitigationProject.plan_year for metric roll-up.
        constraints: "2020 <= value <= 2100; unique across all WildfirePlanFiling rows"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Filing lifecycle; see state_machines.WildfirePlanFiling.
        constraints: "DRAFT | SUBMITTED | DEFICIENCY_ISSUED | APPROVED | REJECTED"
      - name: safety_review_state
        type: enum
        source: system
        default: PENDING
        description: Outcome of the safety review track; one of the two fork branches.
        constraints: "PENDING | CLEARED | DEFICIENT"
      - name: fiscal_review_state
        type: enum
        source: system
        default: PENDING
        description: Outcome of the fiscal review track; the other fork branch.
        constraints: "PENDING | CLEARED | DEFICIENT"
      - name: safety_reviewer_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID that decided the safety track in the current round.
      - name: fiscal_reviewer_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID that decided the fiscal track in the current round.
      - name: deficiency_round_count
        type: integer
        source: computed
        default: 0
        description: Number of rounds in which either track came back DEFICIENT.
      - name: last_deficiency_note
        type: string
        source: computed
        default: null
        description: deficiency_note from the most recent DEFICIENT decision.
      - name: qualifying_project_count
        type: integer
        source: computed
        default: 0
        description: "Count of MitigationProject rows with plan_year == this filing's plan_year and status IN {APPROVED, IN_EXECUTION, SUSPENDED, COMPLETED}."
      - name: covered_conductor_miles_reported
        type: number
        source: computed
        default: 0
        description: Sum of completed_miles over qualifying projects with program_type == COVERED_CONDUCTOR, 1 decimal place.
      - name: underground_miles_reported
        type: number
        source: computed
        default: 0
        description: Sum of completed_miles over qualifying projects with program_type == UNDERGROUNDING, 1 decimal place.
      - name: psps_event_count
        type: integer
        source: computed
        default: 0
        description: "Count of PSPSEvent rows with scope_status == CLOSED whose actual_de_energized_at falls in the filing's plan_year (UTC)."
      - name: customer_minutes_interrupted
        type: integer
        source: computed
        default: 0
        description: Output of calculations.plan_filing_performance_metrics, whole minutes.
      - name: avg_notification_lead_minutes
        type: number
        source: computed
        default: 0
        description: Output of calculations.plan_filing_performance_metrics, 2 decimal places.
      - name: compliance_score
        type: number
        source: computed
        default: 0
        description: Output of calculations.plan_filing_compliance_score, 2 decimal places.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Circuit ---
  # NON-LINEAR: true cycle. ENERGIZED -> DE_ENERGIZATION_PENDING -> DE_ENERGIZED
  # -> PATROL_IN_PROGRESS -> CLEARED_FOR_RESTORE -> ENERGIZED, plus a shortcut
  # compensating edge DE_ENERGIZATION_PENDING -> ENERGIZED on event cancellation.
  - entity: Circuit
    dimension: energization_state
    initial_state: ENERGIZED
    terminal_states: []
    transitions:
      - from: ENERGIZED
        to: DE_ENERGIZATION_PENDING
        trigger: "POST /psps-events/{id}/arm (system cascade onto every CONFIRMED-scoped circuit)"
        actor: system
        preconditions:
          - "an EventScope row links this circuit to the arming event with scope_status == CONFIRMED"
          - "circuit.energization_state == ENERGIZED"
        side_effects:
          - "sets Circuit.risk_posture = LOCKED (calculations.circuit_risk_posture, LOCKED branch)"
          - "increments Circuit.version by 1 and refreshes Circuit.updated_at"
        note: "Arming stages the shutoff without opening the breaker; customers are still served."

      - from: DE_ENERGIZATION_PENDING
        to: ENERGIZED
        trigger: "POST /psps-events/{id}/cancel, or POST /event-scopes/{id}/exclude on this circuit's scope row"
        actor: system
        preconditions:
          - "the governing PSPSEvent.scope_status IN {SCOPED, ARMED} (never ACTIVE or RESTORING)"
        side_effects:
          - "recomputes Circuit.risk_posture from the latest FORECAST FirePotentialIndex (leaves the LOCKED branch)"
          - "restores the invariant `energized_customer_total` — see calculations.energized_customer_total"
          - "increments Circuit.version by 1"
        note: "COMPENSATION edge for the arm cascade; the only way out of DE_ENERGIZATION_PENDING other than de-energizing."

      - from: DE_ENERGIZATION_PENDING
        to: DE_ENERGIZED
        trigger: "POST /psps-events/{id}/de-energize (system cascade)"
        actor: system
        preconditions:
          - "the governing PSPSEvent transitions ARMED -> ACTIVE in the same request"
        side_effects:
          - "cascade hop 2 of transitive_cascade/deenergize_locks_mitigation_execution: keeps Circuit.risk_posture == LOCKED"
          - "cascade hop 3: because the posture is LOCKED, every MitigationProject on this circuit with status == IN_EXECUTION moves to SUSPENDED"
          - "increments Circuit.version by 1"

      - from: DE_ENERGIZED
        to: PATROL_IN_PROGRESS
        trigger: "POST /patrol-assignments/{id}/start"
        actor: FieldPatrolSupervisor
        preconditions:
          - "circuit.energization_state == DE_ENERGIZED (else ERR_CIRCUIT_NOT_DE_ENERGIZED)"
          - "the assignment's PSPSEvent.scope_status == RESTORING (else ERR_EVENT_NOT_IN_RESTORATION)"
        side_effects:
          - "sets PatrolAssignment.status = IN_PROGRESS and PatrolAssignment.started_at = logical clock"
          - "increments Circuit.version by 1"

      - from: CLEARED_FOR_RESTORE
        to: PATROL_IN_PROGRESS
        trigger: "POST /patrol-assignments/{id}/start for a follow-up assignment after repair"
        actor: FieldPatrolSupervisor
        preconditions:
          - "circuit.energization_state == CLEARED_FOR_RESTORE"
          - "the assignment's PSPSEvent.scope_status == RESTORING"
        side_effects:
          - "sets PatrolAssignment.status = IN_PROGRESS and PatrolAssignment.started_at = logical clock"
          - "increments Circuit.version by 1"
        note: "BACK-EDGE that closes the restoration cycle: a circuit whose latest completed patrol filed ignition-risk damage cannot be re-energized, so it is re-patrolled after repair. The clearance rule reads only the LATEST COMPLETED patrol."

      - from: PATROL_IN_PROGRESS
        to: CLEARED_FOR_RESTORE
        trigger: "POST /patrol-assignments/{id}/complete"
        actor: FieldPatrolSupervisor
        preconditions:
          - "the completing assignment's status == IN_PROGRESS"
        side_effects:
          - "sets PatrolAssignment.status = COMPLETED, completed_at, miles_patrolled"
          - "increments Circuit.version by 1"
        note: "Unconditional: the circuit reaches CLEARED_FOR_RESTORE even when the patrol filed IGNITION_RISK damage. The damage gate lives on re-energization (validations[priority=10]), which is what makes ERR_IGNITION_RISK_DAMAGE_UNRESOLVED reachable."

      - from: CLEARED_FOR_RESTORE
        to: ENERGIZED
        trigger: "POST /circuits/{id}/re-energize"
        actor: PSPSDutyOfficer
        preconditions:
          - "circuit.energization_state == CLEARED_FOR_RESTORE (else ERR_CIRCUIT_NOT_CLEARED_FOR_RESTORE)"
          - "the governing PSPSEvent.scope_status == RESTORING (else ERR_EVENT_NOT_IN_RESTORATION)"
          - "the latest COMPLETED PatrolAssignment on this circuit has ignition_risk_finding_count == 0 (else ERR_IGNITION_RISK_DAMAGE_UNRESOLVED)"
          - "X-User-ID differs from that assignment's patrol_lead_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "cascade hop 1 of transitive_cascade/restore_demobilizes_resource_centers: recomputes Circuit.risk_posture out of LOCKED"
          - "because the posture left LOCKED, every MitigationProject on this circuit with status == SUSPENDED returns to IN_EXECUTION"
          - "sets the circuit's EventScope.restored_at = logical clock"
          - "cascade hop 2: when every CONFIRMED EventScope row of the event now has restored_at set, the event's actual_restored_at is stamped, duration_hours is recomputed and calculations.psps_net_benefit_ratio re-runs under the POST_EVENT variant"
          - "cascade hop 3: because actual_restored_at became non-null, every CommunityResourceCenter with psps_event_id == that event and status == ACTIVATED moves to DEMOBILIZED with demobilized_at stamped"
          - "aborts every PatrolAssignment on this circuit still in status SCHEDULED or IN_PROGRESS (status = ABORTED)"
          - "increments Circuit.version by 1"

  # ------------------------------------------------------- PSPSEvent phase ---
  # NON-LINEAR: two independent state dimensions live on the same PSPSEvent row.
  # This entry covers dimension 1 (scope_status); the next entry covers
  # dimension 2 (notification_status). Neither dimension gates the other's edges.
  - entity: PSPSEvent
    dimension: scope_status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /psps-events/{id}/scope"
        actor: PSPSDutyOfficer
        preconditions:
          - "expected_psps_event_version == PSPSEvent.version (else ERR_STALE_VERSION)"
          - "at least one Circuit has a FORECAST FirePotentialIndex for date(forecast_onset_at) with fpi_tier IN {R4, R5} (else ERR_NO_QUALIFYING_CIRCUITS)"
          - "no candidate circuit already sits in a CONFIRMED EventScope of another event whose window half-open-overlaps this one (else ERR_CIRCUIT_WINDOW_CONFLICT)"
        side_effects:
          - "runs calculations.psps_scope_determination, writing EventScope rows (CONFIRMED, or EXCLUDED for the fast-trip R4 exemption)"
          - "runs calculations.ignition_risk_avoided_score and calculations.psps_net_benefit_ratio under the PRE_EVENT variant"
          - "sets confirmed_scope_count, excluded_scope_count, impacted_customer_count, medical_baseline_customer_count, critical_facility_count, crc_capacity_required"
          - "increments PSPSEvent.version by 1"

      - from: SCOPED
        to: SCOPED
        trigger: "POST /psps-events/{id}/scope (re-scope after a forecast refresh)"
        actor: PSPSDutyOfficer
        preconditions:
          - "expected_psps_event_version == PSPSEvent.version (else ERR_STALE_VERSION)"
        side_effects:
          - "hard-deletes every existing EventScope row of this event, then re-runs calculations.psps_scope_determination — the superseding write guarded by concurrency_rules.psps-event-rescope-stale-version"
          - "reverts any circuit left in DE_ENERGIZATION_PENDING but no longer CONFIRMED back to ENERGIZED"
          - "increments PSPSEvent.version by 1"
        note: "Self-loop; the only endpoint in the scaffold that legitimately supersedes rows it did not create."

      - from: SCOPED
        to: ARMED
        trigger: "POST /psps-events/{id}/arm"
        actor: PSPSDutyOfficer
        preconditions:
          - "confirmed_scope_count >= 1 (else ERR_NO_CIRCUITS_IN_SCOPE)"
          - "an ADVANCE_48H NotificationBatch for this event has status IN {DISPATCHED, FAILED_PARTIAL} (else ERR_ADVANCE_NOTIFICATION_MISSING)"
          - "net_benefit_ratio >= 0.25 (else ERR_NET_BENEFIT_BELOW_THRESHOLD)"
        side_effects:
          - "cascades every CONFIRMED-scoped Circuit ENERGIZED -> DE_ENERGIZATION_PENDING"
          - "increments PSPSEvent.version by 1"

      - from: ARMED
        to: ACTIVE
        trigger: "POST /psps-events/{id}/de-energize"
        actor: PSPSDutyOfficer
        preconditions:
          - "scope_status == ARMED (else ERR_EVENT_NOT_ARMED)"
          - "an IMMINENT_1H NotificationBatch for this event has status IN {DISPATCHED, FAILED_PARTIAL}, and every Customer on a CONFIRMED-scoped circuit with notification_tier IN {TIER_A_CRITICAL, TIER_B_MEDICAL} has a NotificationRecord in that batch with delivery_status == DELIVERED (else ERR_CRITICAL_NOTIFICATION_INCOMPLETE)"
        side_effects:
          - "cascade hop 1 of transitive_cascade/deenergize_locks_mitigation_execution: stamps actual_de_energized_at = logical clock"
          - "cascades every CONFIRMED-scoped Circuit DE_ENERGIZATION_PENDING -> DE_ENERGIZED (hop 2), which locks each posture and suspends each IN_EXECUTION MitigationProject (hop 3)"
          - "increments PSPSEvent.version by 1"

      - from: ACTIVE
        to: RESTORING
        trigger: "POST /psps-events/{id}/all-clear"
        actor: MeteorologyAnalyst
        preconditions:
          - "scope_status == ACTIVE (else ERR_EVENT_NOT_ACTIVE)"
        side_effects:
          - "unblocks patrol scheduling and starting for the event's circuits"
          - "increments PSPSEvent.version by 1"
        note: "Declared by the meteorology desk, not the duty officer — the weather judgement is separated from the switching authority."

      - from: RESTORING
        to: CLOSED
        trigger: "POST /psps-events/{id}/close"
        actor: PSPSDutyOfficer
        preconditions:
          - "scope_status == RESTORING (else ERR_EVENT_NOT_IN_RESTORATION)"
          - "every CONFIRMED EventScope row of this event has restored_at set, i.e. actual_restored_at is non-null (else ERR_PATROL_NOT_COMPLETED)"
        side_effects:
          - "freezes the POST_EVENT scores; the event becomes eligible for plan-filing metric roll-up"
          - "demobilizes any CommunityResourceCenter still ACTIVATED for this event"
          - "increments PSPSEvent.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /psps-events/{id}/cancel"
        actor: PSPSDutyOfficer
        preconditions:
          - "scope_status IN {DRAFT, SCOPED, ARMED} (else ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "records cancellation_reason; increments PSPSEvent.version by 1"

      - from: SCOPED
        to: CANCELLED
        trigger: "POST /psps-events/{id}/cancel"
        actor: PSPSDutyOfficer
        preconditions:
          - "scope_status IN {DRAFT, SCOPED, ARMED} (else ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "sets every CONFIRMED EventScope row to EXCLUDED with exclusion_justification = 'EVENT_CANCELLED'"
          - "records cancellation_reason; increments PSPSEvent.version by 1"

      - from: ARMED
        to: CANCELLED
        trigger: "POST /psps-events/{id}/cancel"
        actor: PSPSDutyOfficer
        preconditions:
          - "scope_status IN {DRAFT, SCOPED, ARMED} (else ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "COMPENSATION: reverts every CONFIRMED-scoped Circuit DE_ENERGIZATION_PENDING -> ENERGIZED, restoring calculations.energized_customer_total to its pre-arm value with zero drift"
          - "sets every CONFIRMED EventScope row to EXCLUDED with exclusion_justification = 'EVENT_CANCELLED'"
          - "demobilizes any CommunityResourceCenter already ACTIVATED for this event"
          - "records cancellation_reason; increments PSPSEvent.version by 1"

  # ------------------------------------------ PSPSEvent notification track ---
  - entity: PSPSEvent
    dimension: notification_status
    initial_state: NOT_STARTED
    terminal_states: [RESTORATION_SENT]
    transitions:
      - from: NOT_STARTED
        to: ADVANCE_SENT
        trigger: "POST /notification-batches/{id}/dispatch where stage IN {ADVANCE_48H, ADVANCE_24H}"
        actor: CommunityLiaison
        preconditions:
          - "notification_status == NOT_STARTED"
        side_effects:
          - "increments PSPSEvent.version by 1"
        note: "Advances while scope_status may still be SCOPED — the two dimensions are unordered with respect to each other."
      - from: ADVANCE_SENT
        to: IMMINENT_SENT
        trigger: "POST /notification-batches/{id}/dispatch where stage == IMMINENT_1H"
        actor: CommunityLiaison
        preconditions:
          - "notification_status == ADVANCE_SENT"
        side_effects:
          - "increments PSPSEvent.version by 1"
      - from: IMMINENT_SENT
        to: ACTIVATION_SENT
        trigger: "POST /notification-batches/{id}/dispatch where stage == ACTIVATION"
        actor: CommunityLiaison
        preconditions:
          - "notification_status == IMMINENT_SENT"
        side_effects:
          - "increments PSPSEvent.version by 1"
      - from: ACTIVATION_SENT
        to: RESTORATION_SENT
        trigger: "POST /notification-batches/{id}/dispatch where stage == RESTORATION"
        actor: CommunityLiaison
        preconditions:
          - "notification_status == ACTIVATION_SENT"
        side_effects:
          - "increments PSPSEvent.version by 1"
      - from: ADVANCE_SENT
        to: ADVANCE_SENT
        trigger: "POST /notification-batches/{id}/dispatch where stage IN {ADVANCE_48H, ADVANCE_24H} and notification_status is already ADVANCE_SENT"
        actor: CommunityLiaison
        preconditions:
          - "the batch's own status == PENDING (else ERR_BATCH_ALREADY_DISPATCHED)"
        side_effects:
          - "writes NotificationRecord rows; leaves notification_status unchanged"
        note: "Self-loop: the 48h and 24h batches both land in ADVANCE_SENT, so the second one does not regress or skip the dimension."

  # -------------------------------------------------------- EventScope row ---
  - entity: EventScope
    dimension: scope_status
    initial_state: CONFIRMED
    terminal_states: [EXCLUDED]
    transitions:
      - from: CONFIRMED
        to: EXCLUDED
        trigger: "POST /event-scopes/{id}/exclude"
        actor: TransmissionEngineer
        preconditions:
          - "scope_status == CONFIRMED (else ERR_SCOPE_ALREADY_EXCLUDED)"
          - "the parent PSPSEvent.scope_status IN {SCOPED, ARMED} (else ERR_EVENT_NOT_SCOPED)"
        side_effects:
          - "sets exclusion_justification and ignition_risk_term = 0.00"
          - "reverts the circuit DE_ENERGIZATION_PENDING -> ENERGIZED when it was staged"
          - "recomputes the event's counts, calculations.ignition_risk_avoided_score and calculations.psps_net_benefit_ratio (PRE_EVENT)"
          - "increments EventScope.version and PSPSEvent.version by 1 each"
        note: "Rows may also be BORN in EXCLUDED by calculations.psps_scope_determination's fast-trip exemption branch, which is why EXCLUDED is both an initial value and the terminal state."

  # -------------------------------------------------- MitigationProject ------
  # NON-LINEAR: revision cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED, plus
  # a suspend/resume loop IN_EXECUTION <-> SUSPENDED driven by circuit posture.
  - entity: MitigationProject
    dimension: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mitigation-projects/{id}/submit"
        actor: GridPlanner
        preconditions:
          - "status IN {DRAFT, REVISION_REQUESTED} (else ERR_PROJECT_INVALID_STATE)"
          - "the project's Circuit.risk_posture != LOCKED (else ERR_CIRCUIT_POSTURE_LOCKED)"
        side_effects:
          - "recomputes risk_reduction_score against the circuit's current hftd_tier"
          - "increments MitigationProject.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /mitigation-projects/{id}/submit (resubmission)"
        actor: GridPlanner
        preconditions:
          - "status IN {DRAFT, REVISION_REQUESTED}"
          - "the project's Circuit.risk_posture != LOCKED"
        side_effects:
          - "recomputes risk_reduction_score; increments MitigationProject.version by 1"
        note: "Closes the revision cycle; review_round is NOT reset."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /mitigation-projects/{id}/review with decision == REQUEST_REVISION"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_PROJECT_INVALID_STATE)"
          - "review_round < 2 (else ERR_REVIEW_ROUND_LIMIT)"
        side_effects:
          - "increments review_round by 1"
          - "sets last_revision_reviewer_user_id = X-User-ID and last_review_note = review_note"
          - "increments MitigationProject.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mitigation-projects/{id}/review with decision == APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_PROJECT_INVALID_STATE)"
          - "X-User-ID != last_revision_reviewer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets last_review_note = review_note; increments MitigationProject.version by 1"
      - from: APPROVED
        to: IN_EXECUTION
        trigger: "POST /mitigation-projects/{id}/record-completion (first completion record)"
        actor: AssetInspector
        preconditions:
          - "status IN {APPROVED, IN_EXECUTION} (else ERR_PROJECT_INVALID_STATE)"
          - "expected_circuit_version == Circuit.version (else ERR_STALE_VERSION)"
          - "completed_miles + completed_miles_delta <= planned_miles (else ERR_MITIGATION_MILES_EXCEEDED)"
        side_effects:
          - "adds completed_miles_delta to completed_miles"
          - "for COVERED_CONDUCTOR adds the delta to Circuit.covered_conductor_miles; for UNDERGROUNDING adds it to Circuit.underground_miles; for INSPECTION_CYCLE sets Circuit.last_inspection_completed_at = completion_date"
          - "recomputes Circuit.hardened_fraction and, through it, Circuit.risk_posture"
          - "increments Circuit.version by 1 and MitigationProject.version by 1"
      - from: IN_EXECUTION
        to: IN_EXECUTION
        trigger: "POST /mitigation-projects/{id}/record-completion (subsequent partial record)"
        actor: AssetInspector
        preconditions:
          - "completed_miles + completed_miles_delta < planned_miles"
          - "expected_circuit_version == Circuit.version"
        side_effects:
          - "same ledger updates as the first record; increments Circuit.version and MitigationProject.version by 1 each"
      - from: IN_EXECUTION
        to: COMPLETED
        trigger: "POST /mitigation-projects/{id}/record-completion where completed_miles reaches planned_miles"
        actor: AssetInspector
        preconditions:
          - "completed_miles + completed_miles_delta == planned_miles"
          - "expected_circuit_version == Circuit.version"
        side_effects:
          - "for FAST_TRIP_SETTING additionally sets Circuit.fast_trip_enabled = true"
          - "increments Circuit.version and MitigationProject.version by 1 each"
      - from: IN_EXECUTION
        to: SUSPENDED
        trigger: "POST /psps-events/{id}/de-energize (system cascade, hop 3)"
        actor: system
        preconditions:
          - "the project's Circuit.risk_posture became LOCKED in this request"
          - "status == IN_EXECUTION"
        side_effects:
          - "increments MitigationProject.version by 1"
      - from: SUSPENDED
        to: IN_EXECUTION
        trigger: "POST /circuits/{id}/re-energize (system cascade)"
        actor: system
        preconditions:
          - "the project's Circuit.risk_posture left LOCKED in this request"
          - "status == SUSPENDED"
        side_effects:
          - "increments MitigationProject.version by 1"
      - from: COMPLETED
        to: WITHDRAWN
        trigger: "POST /mitigation-projects/{id}/review with decision == WITHDRAW"
        actor: RegulatoryReviewer
        preconditions:
          - "status IN {IN_EXECUTION, SUSPENDED, COMPLETED} (else ERR_PROJECT_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: subtracts this project's completed_miles from Circuit.covered_conductor_miles (COVERED_CONDUCTOR) or Circuit.underground_miles (UNDERGROUNDING), then sets completed_miles = 0"
          - "recomputes Circuit.hardened_fraction and Circuit.risk_posture; restores calculations.hardened_mileage_ledger to its pre-completion value with zero drift"
          - "increments Circuit.version and MitigationProject.version by 1 each"
      - from: IN_EXECUTION
        to: WITHDRAWN
        trigger: "POST /mitigation-projects/{id}/review with decision == WITHDRAW"
        actor: RegulatoryReviewer
        preconditions:
          - "status IN {IN_EXECUTION, SUSPENDED, COMPLETED}"
        side_effects:
          - "same compensating ledger reversal as the COMPLETED -> WITHDRAWN edge"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /mitigation-projects/{id}/review with decision == WITHDRAW"
        actor: RegulatoryReviewer
        preconditions:
          - "status IN {IN_EXECUTION, SUSPENDED, COMPLETED}"
        side_effects:
          - "same compensating ledger reversal as the COMPLETED -> WITHDRAWN edge"

  # ------------------------------------------------------ NotificationBatch --
  - entity: NotificationBatch
    dimension: status
    initial_state: PENDING
    terminal_states: [DISPATCHED, FAILED_PARTIAL]
    transitions:
      - from: PENDING
        to: DISPATCHED
        trigger: "POST /notification-batches/{id}/dispatch"
        actor: CommunityLiaison
        preconditions:
          - "status == PENDING (else ERR_BATCH_ALREADY_DISPATCHED)"
          - "the event has confirmed_scope_count >= 1 (else ERR_NO_CIRCUITS_IN_SCOPE)"
          - "calculations.notification_lead_time yields lead_time_minutes >= the stage minimum (else ERR_NOTIFICATION_LEAD_TIME_SHORT)"
          - "every produced NotificationRecord has delivery_status == DELIVERED"
        side_effects:
          - "stamps dispatched_at, lead_time_minutes, target_count, delivered_count, unreachable_count = 0"
          - "writes one NotificationRecord per target customer via calculations.notification_routing"
          - "advances PSPSEvent.notification_status per the stage map"
          - "increments NotificationBatch.version by 1"
      - from: PENDING
        to: FAILED_PARTIAL
        trigger: "POST /notification-batches/{id}/dispatch"
        actor: CommunityLiaison
        preconditions:
          - "same preconditions as the DISPATCHED edge"
          - "at least one produced NotificationRecord has delivery_status == UNREACHABLE"
        side_effects:
          - "stamps dispatched_at, lead_time_minutes, target_count, delivered_count, unreachable_count > 0"
          - "advances PSPSEvent.notification_status per the stage map (identically to the DISPATCHED branch)"
          - "increments NotificationBatch.version by 1"
        note: "Divergent branch: FAILED_PARTIAL still satisfies the ADVANCE_48H arm gate, but never satisfies the de-energize critical-notification gate if the unreachable customer is TIER_A_CRITICAL or TIER_B_MEDICAL."

  # ------------------------------------------------------- PatrolAssignment --
  - entity: PatrolAssignment
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /patrol-assignments/{id}/start"
        actor: FieldPatrolSupervisor
        preconditions:
          - "status == SCHEDULED (else ERR_PATROL_INVALID_STATE)"
          - "the assignment's Circuit.energization_state IN {DE_ENERGIZED, PATROL_IN_PROGRESS, CLEARED_FOR_RESTORE} (else ERR_CIRCUIT_NOT_DE_ENERGIZED)"
          - "the assignment's PSPSEvent.scope_status == RESTORING (else ERR_EVENT_NOT_IN_RESTORATION)"
        side_effects:
          - "stamps started_at; drives Circuit DE_ENERGIZED -> PATROL_IN_PROGRESS, or CLEARED_FOR_RESTORE -> PATROL_IN_PROGRESS on the repair back-edge"
          - "increments PatrolAssignment.version and Circuit.version by 1 each"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /patrol-assignments/{id}/complete"
        actor: FieldPatrolSupervisor
        preconditions:
          - "status == IN_PROGRESS (else ERR_PATROL_INVALID_STATE)"
        side_effects:
          - "stamps completed_at and miles_patrolled"
          - "drives Circuit PATROL_IN_PROGRESS -> CLEARED_FOR_RESTORE unconditionally; the ignition-risk damage gate is enforced later, at re-energization"
          - "increments PatrolAssignment.version and Circuit.version by 1 each"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /circuits/{id}/re-energize (system cascade) or POST /psps-events/{id}/cancel"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "increments PatrolAssignment.version by 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /circuits/{id}/re-energize (system cascade) or POST /psps-events/{id}/cancel"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "increments PatrolAssignment.version by 1"

  # ------------------------------------------- CommunityResourceCenter ------
  - entity: CommunityResourceCenter
    dimension: status
    initial_state: STANDBY
    terminal_states: []
    transitions:
      - from: STANDBY
        to: ACTIVATED
        trigger: "POST /psps-events/{id}/activate-resource-centers"
        actor: PSPSDutyOfficer
        preconditions:
          - "status == STANDBY (else the site is skipped by the selector, or rejected with ERR_RESOURCE_CENTER_ALREADY_ACTIVE when named explicitly)"
          - "district_code matches the district_code of at least one CONFIRMED-scoped circuit"
          - "no reset-buffer collision per calculations.resource_center_activation_selector (else ERR_RESOURCE_CENTER_BUFFER_CONFLICT when named explicitly)"
        side_effects:
          - "sets psps_event_id, activated_at, activation_order, last_served_all_clear_at = event.forecast_all_clear_at"
          - "recomputes PSPSEvent.crc_capacity_served and re-runs calculations.psps_net_benefit_ratio, changing crc_mitigation_credit, adjusted_customer_impact_score and net_benefit_ratio"
          - "increments CommunityResourceCenter.version and PSPSEvent.version by 1 each"
      - from: ACTIVATED
        to: DEMOBILIZED
        trigger: "POST /circuits/{id}/re-energize (cascade hop 3), POST /psps-events/{id}/close, or POST /psps-events/{id}/cancel"
        actor: system
        preconditions:
          - "status == ACTIVATED"
          - "the served event reached actual_restored_at != null, CLOSED, or CANCELLED"
        side_effects:
          - "stamps demobilized_at; leaves last_served_all_clear_at in place so the reset buffer still applies to the next event"
          - "recomputes PSPSEvent.crc_capacity_served and net_benefit_ratio"
          - "increments CommunityResourceCenter.version by 1"
      - from: DEMOBILIZED
        to: ACTIVATED
        trigger: "POST /psps-events/{id}/activate-resource-centers for a later event"
        actor: PSPSDutyOfficer
        preconditions:
          - "status == DEMOBILIZED"
          - "event.forecast_onset_at >= last_served_all_clear_at + 240 minutes (else ERR_RESOURCE_CENTER_BUFFER_CONFLICT)"
        side_effects:
          - "same activation side effects as the STANDBY -> ACTIVATED edge, overwriting psps_event_id and last_served_all_clear_at"
        note: "Re-activation loop; the reset buffer is what makes DEMOBILIZED non-terminal but not freely reusable."

  # ---------------------------------------------------- WildfirePlanFiling ---
  # NON-LINEAR: fork-join. SUBMITTED forks into two independent review tracks
  # (safety, fiscal) that join into APPROVED only when both are CLEARED; either
  # track coming back DEFICIENT short-circuits to DEFICIENCY_ISSUED with a
  # different side-effect set, and DEFICIENCY_ISSUED loops back to SUBMITTED.
  - entity: WildfirePlanFiling
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plan-filings/{id}/submit"
        actor: GridPlanner
        preconditions:
          - "status IN {DRAFT, DEFICIENCY_ISSUED} (else ERR_FILING_INVALID_STATE)"
          - "qualifying_project_count >= 1 (else ERR_FILING_METRICS_INCOMPLETE)"
        side_effects:
          - "re-snapshots every reported metric via calculations.plan_filing_performance_metrics and calculations.plan_filing_compliance_score"
          - "sets safety_review_state = PENDING and fiscal_review_state = PENDING, clearing both reviewer ids"
          - "increments WildfirePlanFiling.version by 1"
      - from: DEFICIENCY_ISSUED
        to: SUBMITTED
        trigger: "POST /plan-filings/{id}/submit (cure round)"
        actor: GridPlanner
        preconditions:
          - "status IN {DRAFT, DEFICIENCY_ISSUED}"
          - "qualifying_project_count >= 1"
        side_effects:
          - "same re-snapshot and fork reset as the DRAFT edge; deficiency_round_count is NOT reset"
        note: "Closes the filing cycle."
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /plan-filings/{id}/reviews with decision == CLEAR on the first of the two tracks"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED (else ERR_FILING_INVALID_STATE)"
          - "the named track's review state == PENDING (else ERR_REVIEW_TRACK_ALREADY_DECIDED)"
          - "the other track's reviewer id, when set, differs from X-User-ID (else ERR_SEGREGATION_OF_DUTIES)"
          - "the other track is still PENDING"
        side_effects:
          - "sets that track's state = CLEARED and its reviewer id = X-User-ID"
          - "increments WildfirePlanFiling.version by 1"
        note: "Fork branch: one leg of the join lands, the row stays SUBMITTED waiting for the other."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plan-filings/{id}/reviews with decision == CLEAR on the second track"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the named track's review state == PENDING"
          - "the other track's review state == CLEARED and its reviewer id != X-User-ID (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets that track's state = CLEARED and its reviewer id = X-User-ID"
          - "JOIN: because both tracks are now CLEARED, status becomes APPROVED"
          - "increments WildfirePlanFiling.version by 1"
      - from: SUBMITTED
        to: DEFICIENCY_ISSUED
        trigger: "POST /plan-filings/{id}/reviews with decision == DEFICIENT"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the named track's review state == PENDING"
          - "deficiency_round_count < 2"
        side_effects:
          - "sets that track's state = DEFICIENT, its reviewer id = X-User-ID, and last_deficiency_note = deficiency_note"
          - "increments deficiency_round_count by 1"
          - "SHORT-CIRCUIT: leaves the other track in whatever state it holds — the join never completes for this round"
          - "increments WildfirePlanFiling.version by 1"
        note: "Divergent side-effect set versus the CLEAR branch: this branch writes last_deficiency_note and bumps deficiency_round_count, and does not wait for the sibling track."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plan-filings/{id}/reviews with decision == DEFICIENT when deficiency_round_count == 2"
        actor: RegulatoryReviewer
        preconditions:
          - "status == SUBMITTED"
          - "the named track's review state == PENDING"
          - "deficiency_round_count == 2"
        side_effects:
          - "sets that track's state = DEFICIENT, last_deficiency_note, and deficiency_round_count = 3"
          - "increments WildfirePlanFiling.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on a parent `version` — the only sanctioned
# mechanism; both entries pass the serial-observability filter because a second
# strictly-sequential request with a refreshed version would legitimately succeed)
# =============================================================================
concurrency_rules:
  - rule_id: psps-event-rescope-stale-version
    parent_entity: PSPSEvent
    write_endpoint: "POST /psps-events/{id}/scope"
    occ_field: "expected_psps_event_version"
    description: |
      Re-scoping a PSPSEvent hard-deletes the event's existing EventScope rows and rewrites them from the
      current forecast, so a second sequential scope call is legitimate product behaviour and would succeed
      on its own merits. A call whose expected_psps_event_version no longer equals PSPSEvent.version is
      rejected instead, because the caller's view of the scope set (and of the counts and net-benefit scores
      derived from it) predates a write that already superseded it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: mitigation-completion-stale-circuit
    parent_entity: Circuit
    write_endpoint: "POST /mitigation-projects/{id}/record-completion"
    occ_field: "expected_circuit_version"
    description: |
      Recording completed mileage is intentionally repeatable — a project accretes miles over several
      records — so a second sequential record-completion call is legitimate and would succeed on its own
      merits. The call is rejected when expected_circuit_version no longer equals Circuit.version, because
      the caller's view of the circuit's hardened_fraction, covered_conductor_miles, underground_miles and
      risk_posture predates a write that already moved them.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ------------------------------------------------------------------- C1 ----
  - name: circuit_hardened_fraction
    trigger: "Recomputed on POST /mitigation-projects/{id}/record-completion and on POST /mitigation-projects/{id}/review with decision == WITHDRAW; read by fire_potential_index and ignition_risk_avoided_score."
    algorithm: aggregation
    formula: |
      covered = Circuit.covered_conductor_miles     # maintained by record-completion / WITHDRAW
      under   = Circuit.underground_miles
      raw = (covered * COVERED_CONDUCTOR_CREDIT_FACTOR + under * UNDERGROUND_CREDIT_FACTOR)
            / Circuit.overhead_miles
      hardened_fraction = min(Decimal("1.0000"), round_half_up(raw, 4))
    input_set: |
      Only MitigationProject rows on this circuit with status IN {IN_EXECUTION, SUSPENDED, COMPLETED} and
      program_type IN {COVERED_CONDUCTOR, UNDERGROUNDING} contribute mileage. DRAFT, SUBMITTED,
      REVISION_REQUESTED, APPROVED and WITHDRAWN projects contribute nothing. FAST_TRIP_SETTING and
      INSPECTION_CYCLE projects never contribute mileage regardless of status.
    constants:
      COVERED_CONDUCTOR_CREDIT_FACTOR: 0.6
      UNDERGROUND_CREDIT_FACTOR: 1.0
    precision: "4 decimal places, round_half_up, capped at 1.0000"

  # ------------------------------------------------------------------- C2 ----
  - name: fire_potential_index
    trigger: "POST /fire-potential-indices"
    algorithm: weighted_scoring
    formula: |
      # ---- step 1: eligible station set -------------------------------------
      stations = WeatherStation rows with circuit_id == request.circuit_id
                 AND telemetry_status IN {ONLINE, DEGRADED}
      effective_weight(s) = s.representativeness_weight
                            * (DEGRADED_STATION_WEIGHT_FACTOR if s.telemetry_status == DEGRADED else 1)

      # ---- step 2: observation selection window (half-open) ------------------
      day0   = parse forecast_date as YYYY-MM-DDT00:00:00Z
      window = [ day0 - 24h , day0 + 24h )        # left-inclusive, right-exclusive
      obs(s) = s's WeatherObservation rows with window.start <= observed_at < window.end

      # A station with an empty obs(s) contributes nothing and is dropped.
      contributing = [ s for s in stations if obs(s) is non-empty ]
      contributing_station_count = len(contributing)
      if contributing_station_count == 0: reject with ERR_OBSERVATION_WINDOW_EMPTY

      # ---- step 3: per-station reduction (VARIANT-DEPENDENT, see variants) ---
      # FORECAST  -> envelope:  gust = max(wind_gust_mph),
      #                         rh   = min(relative_humidity_pct),
      #                         dfm  = min(dead_fuel_moisture_pct)
      # VALIDATED -> latest:    the single observation with the greatest observed_at;
      #                         tie-break greatest created_at; its three values are used as-is.

      # ---- step 4: weight blend (VARIANT-DEPENDENT rounding) -----------------
      W = sum(effective_weight(s) for s in contributing)
      blend(field) = sum(effective_weight(s) * value(s, field) for s in contributing) / W
      # FORECAST  -> effective_* = round_half_up(blend(field), 1)   (round BEFORE components)
      # VALIDATED -> effective_* = blend(field)                     (no intermediate rounding)

      # ---- step 5: components (identical in both variants) ------------------
      wind_component      = min(100, max(0, (effective_wind_gust_mph - WIND_BASE_MPH) * WIND_SLOPE))
      dryness_component   = min(100, max(0, (100 - effective_relative_humidity_pct)
                                            + (FUEL_MOISTURE_REF_PCT - effective_dead_fuel_moisture_pct)
                                              * FUEL_MOISTURE_SLOPE))
      terrain_component   = HFTD_TERRAIN_POINTS[Circuit.hftd_tier]
      inspection_overdue  = Circuit.last_inspection_completed_at IS NULL
                            OR logical_clock_now >= Circuit.last_inspection_completed_at
                               + Circuit.inspection_cycle_months * DAYS_PER_CYCLE_MONTH days
      equipment_component = min(100, max(0, (100 - Circuit.equipment_condition_index)
                                            + (INSPECTION_OVERDUE_PENALTY if inspection_overdue else 0)))

      # ---- step 6: score and tier (identical in both variants) --------------
      raw_score = WEIGHT_WIND      * wind_component
                + WEIGHT_DRYNESS   * dryness_component
                + WEIGHT_TERRAIN   * terrain_component
                + WEIGHT_EQUIPMENT * equipment_component
      hardened_fraction_applied = Circuit.hardened_fraction
      fpi_score = round_half_up(raw_score * (1 - HARDENING_CREDIT_CAP * hardened_fraction_applied), 2)
      # exactly one rounding of the score, at the very end, in BOTH variants

      fpi_tier =  R1 if fpi_score < 20
             else R2 if fpi_score < 40
             else R3 if fpi_score < 60
             else R4 if fpi_score < 75
             else R5                       # >= 75 inclusive
    input_set: |
      Stations: circuit_id match AND telemetry_status IN {ONLINE, DEGRADED}; OFFLINE stations are dropped
      entirely. Observations: observed_at in the half-open 48-hour window centred on forecast_date's UTC
      midnight boundaries, i.e. [forecast_date-1 00:00:00Z, forecast_date+1 00:00:00Z). An observation at
      exactly day0-24h is IN; one at exactly day0+24h is OUT. Stations with no in-window observation are
      excluded from both the numerator and the denominator W.
    constants:
      WIND_BASE_MPH: 20
      WIND_SLOPE: 2.5
      FUEL_MOISTURE_REF_PCT: 12
      FUEL_MOISTURE_SLOPE: 4
      HFTD_TERRAIN_POINTS: { TIER_3: 100, TIER_2: 70, TIER_1: 40, NON_HFTD: 10 }
      INSPECTION_OVERDUE_PENALTY: 30
      DAYS_PER_CYCLE_MONTH: 30
      DEGRADED_STATION_WEIGHT_FACTOR: 0.5
      WEIGHT_WIND: 0.35
      WEIGHT_DRYNESS: 0.30
      WEIGHT_TERRAIN: 0.20
      WEIGHT_EQUIPMENT: 0.15
      HARDENING_CREDIT_CAP: 0.40
      OBSERVATION_WINDOW_HOURS: 24
    precision: "effective_* to 1 decimal place under FORECAST and unrounded under VALIDATED; fpi_score to 2 decimal places, round_half_up"
    variants:
      - name: FORECAST
        when: "request.computation_variant == FORECAST; the only variant psps_scope_determination and circuit_risk_posture read"
        difference: |
          Per-station reduction is the WORST-CASE ENVELOPE over the window (max gust, min humidity, min fuel
          moisture), and the three weight-blended effective inputs are rounded to 1 decimal place BEFORE the
          components are computed. Against the same observation rows this yields a strictly higher, and
          differently-rounded, fpi_score than VALIDATED.
      - name: VALIDATED
        when: "request.computation_variant == VALIDATED; the after-action record used for regulatory reporting"
        difference: |
          Per-station reduction takes only the LATEST observation in the window (greatest observed_at,
          tie-break greatest created_at), and the weight blend is carried at full precision into the
          components with no intermediate rounding. Same rows, different number.

  # ------------------------------------------------------------------- C3 ----
  - name: circuit_risk_posture
    trigger: "Recomputed on POST /fire-potential-indices, on every Circuit.energization_state transition, on record-completion, and on review with decision == WITHDRAW."
    algorithm: threshold
    formula: |
      if Circuit.energization_state IN {DE_ENERGIZATION_PENDING, DE_ENERGIZED,
                                       PATROL_IN_PROGRESS, CLEARED_FOR_RESTORE}:
          risk_posture = LOCKED
      else:
          idx = the FirePotentialIndex row with circuit_id == Circuit.id
                AND computation_variant == FORECAST,
                ordered by forecast_date DESC, then created_at DESC, taking the first
          if idx is null:                       risk_posture = NORMAL
          elif idx.fpi_tier IN {R4, R5}:        risk_posture = EXTREME
          elif idx.fpi_tier == R3:              risk_posture = ELEVATED
          else:                                 risk_posture = NORMAL
      latest_forecast_fpi_score = idx.fpi_score if idx else null
      latest_forecast_fpi_tier  = idx.fpi_tier  if idx else null
    input_set: |
      Only FORECAST-variant indices are consulted; VALIDATED rows never move the posture. Selection is by
      greatest forecast_date, then greatest created_at (never by id). The energization branch dominates: a
      de-energized circuit reads LOCKED no matter how benign its latest index is.
    constants:
      EXTREME_TIER_SET: [R4, R5]
      ELEVATED_TIER_SET: [R3]
    precision: "enum output; latest_forecast_fpi_score carries the source index's 2 decimal places"

  # ------------------------------------------------------------------- C4 ----
  - name: psps_scope_determination
    trigger: "POST /psps-events/{id}/scope"
    algorithm: topological
    formula: |
      target_date = the UTC calendar date of PSPSEvent.forecast_onset_at, as YYYY-MM-DD

      # ---- step 1: primary candidates --------------------------------------
      def qualifying_index(c):
          rows = FirePotentialIndex with circuit_id == c.id
                 AND computation_variant == FORECAST
                 AND forecast_date == target_date
          return max(rows, key=created_at) if rows else null      # tie-break: greatest created_at
      primary = [ c for c in all Circuits
                  if c.energization_state == ENERGIZED
                  AND qualifying_index(c) is not null
                  AND qualifying_index(c).fpi_tier IN DEENERGIZATION_TIER_SET ]
      primary is ordered by circuit.created_at ASC
      if primary is empty: reject with ERR_NO_QUALIFYING_CIRCUITS

      # ---- step 2: fast-trip exemption (boundary-sensitive) -----------------
      for c in primary, in order:
          idx = qualifying_index(c)
          if c.fast_trip_enabled AND idx.fpi_tier == FAST_TRIP_EXEMPT_TIER:      # exactly R4, NOT R5
              write EventScope(circuit_id=c.id, inclusion_basis=PRIMARY_RISK,
                               scope_status=EXCLUDED,
                               exclusion_justification="FAST_TRIP_MITIGATED_R4",
                               fpi_score_applied=idx.fpi_score, ignition_risk_term=0.00)
              # its downstream subtree is NOT walked
          else:
              write EventScope(circuit_id=c.id, inclusion_basis=PRIMARY_RISK,
                               scope_status=CONFIRMED, fpi_score_applied=idx.fpi_score)
              enqueue c for the downstream walk

      # ---- step 3: transitive downstream closure ---------------------------
      # breadth-first over the self-reference Circuit.upstream_circuit_id
      queue = the CONFIRMED primary circuits, in created_at ASC order
      while queue:
          parent = queue.pop_front()
          children = Circuits with upstream_circuit_id == parent.id
                     AND energization_state == ENERGIZED
                     AND not already in this event's scope set
          for child in children ordered by created_at ASC:
              write EventScope(circuit_id=child.id, inclusion_basis=DOWNSTREAM_DEPENDENCY,
                               scope_status=CONFIRMED,
                               fpi_score_applied = fpi_score_applied of the nearest ancestor
                                                   EventScope with inclusion_basis == PRIMARY_RISK,
                                                   found by walking upstream_circuit_id upward)
              queue.push_back(child)

      # ---- step 4: window-conflict guard -----------------------------------
      # applied to every candidate BEFORE any row is written
      for c in candidate set:
          if exists EventScope s2 with s2.circuit_id == c.id AND s2.scope_status == CONFIRMED
             AND s2.psps_event_id != this event
             AND s2's event.scope_status IN {SCOPED, ARMED, ACTIVE, RESTORING}
             AND s2_event.forecast_onset_at < this.forecast_all_clear_at
             AND this.forecast_onset_at     < s2_event.forecast_all_clear_at:      # half-open overlap
              reject with ERR_CIRCUIT_WINDOW_CONFLICT

      # ---- step 5: snapshots ------------------------------------------------
      each row's customer_count_snapshot = its Circuit.customer_count at write time
      confirmed_scope_count / excluded_scope_count / impacted_customer_count /
      medical_baseline_customer_count / critical_facility_count / crc_capacity_required are recomputed
    input_set: |
      Circuits: energization_state == ENERGIZED only. Indices: FORECAST variant, forecast_date exactly equal
      to the event's onset UTC date; when several exist for one circuit and date the one with the greatest
      created_at wins. Downstream closure follows upstream_circuit_id transitively, breadth-first, children
      ordered by created_at ASC, skipping circuits already in the set, and never traversing through an
      EXCLUDED fast-trip node.
    constants:
      DEENERGIZATION_TIER_SET: [R4, R5]
      FAST_TRIP_EXEMPT_TIER: R4
    precision: "integer counts; fpi_score_applied carries the source index's 2 decimal places"

  # ------------------------------------------------------------------- C5 ----
  - name: ignition_risk_avoided_score
    trigger: "Recomputed on POST /psps-events/{id}/scope and on POST /event-scopes/{id}/exclude."
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: round EACH per-circuit term to 2 decimals, THEN sum.
      # The alternative order (sum at full precision, round once) is explicitly NOT used and
      # produces a different cent value for the same inputs.
      for each EventScope s of the event with s.scope_status == CONFIRMED,
          taken in s.created_at ASC order:
          s.ignition_risk_term = round_half_up(
              s.fpi_score_applied * s.circuit.overhead_miles
              * (1 - s.circuit.hardened_fraction) / 100 , 2)
      for each EventScope s with s.scope_status == EXCLUDED:
          s.ignition_risk_term = 0.00
      ignition_risk_avoided_score = sum of s.ignition_risk_term over ALL of the event's EventScope rows
      # no further rounding is applied to the sum
    input_set: |
      Every EventScope row of this event; EXCLUDED rows contribute a pinned 0.00 rather than being omitted,
      so the sum is stable across exclusions. hardened_fraction is read live from the circuit at
      recomputation time, not snapshotted.
    constants:
      MILES_SCALE_DIVISOR: 100
    precision: "each term round_half_up to 2 decimal places; the sum is exact over those 2-decimal terms"

  # ------------------------------------------------------------------- C6 ----
  - name: psps_net_benefit_ratio
    trigger: "Recomputed on POST /psps-events/{id}/scope, POST /event-scopes/{id}/exclude, POST /psps-events/{id}/activate-resource-centers, on CommunityResourceCenter demobilization, and when actual_restored_at is stamped."
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER — the credit rate is keyed on the very score the credit then reduces,
      # so the order below is normative. Evaluating step 4 against the adjusted score is WRONG.
      #
      # step 1: raw customer impact
      duration_hours = ceil( (window_end - window_start) / 3600 seconds )
      base = impacted_customer_count
           + MEDICAL_BASELINE_WEIGHT   * medical_baseline_customer_count
           + CRITICAL_FACILITY_WEIGHT  * critical_facility_count
      customer_impact_score = round_half_up(base * duration_hours / IMPACT_DIVISOR, 2)
      #
      # step 2: credit RATE keyed on the STEP-1 score (never on the adjusted score)
      credit_rate =  0.00 if customer_impact_score < 20
                else 0.05 if customer_impact_score < 60
                else 0.12 if customer_impact_score < 200
                else 0.20
      #
      # step 3: coverage from activated resource centers
      crc_capacity_required = medical_baseline_customer_count + critical_facility_count
      crc_capacity_served   = sum of site_capacity over CommunityResourceCenter rows
                              with psps_event_id == event.id AND status == ACTIVATED
      coverage_ratio = min(1, crc_capacity_served / max(1, crc_capacity_required))
      #
      # step 4: credit, then adjustment
      crc_mitigation_credit          = round_half_up(customer_impact_score * credit_rate * coverage_ratio, 2)
      adjusted_customer_impact_score = round_half_up(customer_impact_score - crc_mitigation_credit, 2)
      #
      # step 5: the ratio
      net_benefit_ratio = round_half_up(
          ignition_risk_avoided_score / max(Decimal("0.01"), adjusted_customer_impact_score), 4)
    input_set: |
      Counts come from the event's CONFIRMED EventScope rows only. Capacity comes from
      CommunityResourceCenter rows with status == ACTIVATED only; DEMOBILIZED and STANDBY sites contribute
      nothing, which is why demobilization raises the ratio's denominator again. The window bounds depend on
      the variant (see variants).
    constants:
      MEDICAL_BASELINE_WEIGHT: 4
      CRITICAL_FACILITY_WEIGHT: 10
      IMPACT_DIVISOR: 10
      CREDIT_RATE_BREAKS: { under_20: 0.00, under_60: 0.05, under_200: 0.12, at_or_over_200: 0.20 }
      MIN_NET_BENEFIT_RATIO: 0.25
    precision: "customer_impact_score / crc_mitigation_credit / adjusted_customer_impact_score to 2 decimal places; net_benefit_ratio to 4 decimal places; all round_half_up"
    variants:
      - name: PRE_EVENT
        when: "benefit_variant == PRE_EVENT — from POST /psps-events/{id}/scope until actual_restored_at is stamped; this is the variant the arm threshold reads"
        difference: |
          window_start = forecast_onset_at, window_end = forecast_all_clear_at, so duration_hours is the
          FORECAST outage length. Counts are the scope-time snapshots.
      - name: POST_EVENT
        when: "benefit_variant == POST_EVENT — recomputed once actual_restored_at is stamped, and frozen at close"
        difference: |
          window_start = actual_de_energized_at, window_end = actual_restored_at, so duration_hours is the
          REALISED outage length including patrol and restoration time. Identical scope and capacity rows
          therefore yield a different customer_impact_score, a possibly different credit_rate band, and a
          different net_benefit_ratio than PRE_EVENT.

  # ------------------------------------------------------------------- C7 ----
  - name: customer_notification_tier
    trigger: "Computed on POST /customers and read by notification_routing and the de-energize critical-notification gate."
    algorithm: threshold
    formula: |
      notification_tier = TIER_A_CRITICAL if Customer.customer_class == CRITICAL_FACILITY
                     else TIER_B_MEDICAL  if Customer.medical_baseline == true
                     else TIER_C_STANDARD
    input_set: "The customer row alone; customer_class dominates medical_baseline when both apply."
    constants:
      TIER_RANK: { TIER_A_CRITICAL: 0, TIER_B_MEDICAL: 1, TIER_C_STANDARD: 2 }
    precision: "enum output"

  # ------------------------------------------------------------------- C8 ----
  - name: notification_lead_time
    trigger: "POST /notification-batches/{id}/dispatch"
    algorithm: threshold
    formula: |
      lead_time_minutes = floor( (PSPSEvent.forecast_onset_at - dispatched_at) / 60 seconds )
      # dispatched_at is the logical clock at dispatch, NOT the operator's scheduled_send_at
      required = STAGE_MIN_LEAD_MINUTES[NotificationBatch.stage]
      if lead_time_minutes < required: reject with ERR_NOTIFICATION_LEAD_TIME_SHORT
      # boundary: lead_time_minutes == required is ACCEPTED
    input_set: "The batch's own stage and its event's forecast_onset_at; ACTIVATION and RESTORATION stages have a required minimum of 0, so a negative lead time is rejected for them but any non-negative value passes."
    constants:
      STAGE_MIN_LEAD_MINUTES: { ADVANCE_48H: 2880, ADVANCE_24H: 1440, IMMINENT_1H: 60, ACTIVATION: 0, RESTORATION: 0 }
    precision: "whole minutes, floor toward negative infinity"

  # ------------------------------------------------------------------- C9 ----
  - name: notification_routing
    trigger: "POST /notification-batches/{id}/dispatch — writes one NotificationRecord per target customer."
    algorithm: waterfall_allocation
    formula: |
      # ---- target set ------------------------------------------------------
      targets = Customer rows whose circuit_id appears in an EventScope of this batch's event
                with scope_status == CONFIRMED
      # ---- deterministic dispatch order (never uses id) ---------------------
      order key = ( TIER_RANK[customer.notification_tier] ASC , customer.created_at ASC )
      attempt_order = 1-based index in that order
      # ---- language ---------------------------------------------------------
      allowed_languages = TIME_CRITICAL_LANGUAGE_SET if batch.stage IN TIME_CRITICAL_STAGES
                          else FULL_LANGUAGE_SET
      language_used = customer.preferred_language if it is in allowed_languages else DEFAULT_LANGUAGE
      # ---- channel waterfall ------------------------------------------------
      forbidden = set()
      if "TTY"   in customer.accessibility_needs: forbidden |= {VOICE}
      if "AUDIO" in customer.accessibility_needs: forbidden |= {SMS, EMAIL}
      for ch in CHANNEL_PRIORITY:                       # [SMS, VOICE, EMAIL], fixed order
          if ch in customer.notification_channels and ch not in forbidden:
              channel_used = ch ; break
      else:
          channel_used = null                           # empty permitted set
      delivery_status      = UNREACHABLE if channel_used is null else DELIVERED
      accessibility_format = LARGE_PRINT if "LARGE_PRINT" in customer.accessibility_needs else STANDARD
      # ---- batch roll-up ----------------------------------------------------
      target_count      = len(targets)
      delivered_count   = count of records with delivery_status == DELIVERED
      unreachable_count = target_count - delivered_count
      batch.status      = FAILED_PARTIAL if unreachable_count > 0 else DISPATCHED
    input_set: |
      Only customers on CONFIRMED-scoped circuits; customers on EXCLUDED-scoped circuits are never targeted.
      Ordering is by notification tier rank then created_at ASC — the resource id is never a decision input.
      The accessibility filter runs against the FIXED channel priority [SMS, VOICE, EMAIL], not against the
      order the customer listed its channels.
    constants:
      CHANNEL_PRIORITY: [SMS, VOICE, EMAIL]
      FULL_LANGUAGE_SET: [EN, ES, ZH, TL, VI]
      TIME_CRITICAL_LANGUAGE_SET: [EN, ES]
      TIME_CRITICAL_STAGES: [IMMINENT_1H, ACTIVATION]
      DEFAULT_LANGUAGE: EN
      TIER_RANK: { TIER_A_CRITICAL: 0, TIER_B_MEDICAL: 1, TIER_C_STANDARD: 2 }
    precision: "integer counts; enum outputs"

  # ------------------------------------------------------------------ C10 ----
  - name: resource_center_activation_selector
    trigger: "POST /psps-events/{id}/activate-resource-centers"
    algorithm: waterfall_allocation
    formula: |
      required = PSPSEvent.crc_capacity_required
      scoped_districts = { circuit.district_code for each CONFIRMED EventScope of the event }

      def buffer_conflict(crc):
          return crc.last_served_all_clear_at is not null
                 and event.forecast_onset_at
                     < crc.last_served_all_clear_at + CRC_RESET_BUFFER_MINUTES minutes
          # closed-interval semantics with a trailing reset buffer:
          # onset exactly at last_served_all_clear_at + 240 min is ACCEPTED

      if request.requested_resource_center_ids is provided:
          # explicit mode — every named site is validated and rejected loudly
          for crc in the named sites, in the order given by the request array:
              if crc.status == ACTIVATED:        reject ERR_RESOURCE_CENTER_ALREADY_ACTIVE
              if crc.district_code not in scoped_districts: reject ERR_RESOURCE_CENTER_DISTRICT_MISMATCH
              if buffer_conflict(crc):           reject ERR_RESOURCE_CENTER_BUFFER_CONFLICT
          activate all of them; activation_order follows the request array order (1-based)
      else:
          # selector mode — eligibility filter, ranking, tie-break, empty-pool fallback
          candidates = CommunityResourceCenter rows with
                       status IN {STANDBY, DEMOBILIZED}
                       AND district_code IN scoped_districts
                       AND not buffer_conflict(crc)
          ranked = candidates sorted by
                       ( accessibility_certified DESC ,   # true before false
                         site_capacity DESC ,
                         created_at ASC )                 # final tie-break; id is never used
          if ranked is empty and required > 0: reject ERR_NO_ELIGIBLE_RESOURCE_CENTER
          activated = [] ; cumulative = 0
          for crc in ranked:
              if cumulative >= required: break
              activate crc with activation_order = len(activated) + 1
              activated.append(crc) ; cumulative += crc.site_capacity
      activated_capacity = sum of site_capacity over the sites activated by this call
      unmet_capacity     = max(0, required - PSPSEvent.crc_capacity_served)
    input_set: |
      Candidate pool is exactly status IN {STANDBY, DEMOBILIZED} with a district_code matching some
      CONFIRMED-scoped circuit and no reset-buffer collision. ACTIVATED sites are never candidates.
      Ranking is accessibility_certified DESC, then site_capacity DESC, then created_at ASC.
    constants:
      CRC_RESET_BUFFER_MINUTES: 240
    precision: "integer capacities; activation_order is 1-based within a single call"

  # ------------------------------------------------------------------ C11 ----
  - name: mitigation_risk_reduction_score
    trigger: "Computed on POST /mitigation-projects and recomputed on every submit."
    algorithm: weighted_scoring
    formula: |
      risk_reduction_score = round_half_up(
          planned_miles
          * PROGRAM_EFFECTIVENESS[program_type]
          * HFTD_RISK_MULTIPLIER[circuit.hftd_tier], 2)
      budget_cents = int(planned_miles * unit_cost_per_mile_cents)      # truncated to a whole cent
    input_set: "The project's own planned_miles and program_type, plus the circuit's hftd_tier read live at submit time."
    constants:
      PROGRAM_EFFECTIVENESS: { COVERED_CONDUCTOR: 0.62, UNDERGROUNDING: 1.00, FAST_TRIP_SETTING: 0.45, INSPECTION_CYCLE: 0.18 }
      HFTD_RISK_MULTIPLIER: { TIER_3: 1.5, TIER_2: 1.2, TIER_1: 1.0, NON_HFTD: 0.5 }
    precision: "risk_reduction_score to 2 decimal places, round_half_up; budget_cents is an integer, truncated"

  # ------------------------------------------------------------------ C12 ----
  - name: plan_filing_performance_metrics
    trigger: "Computed on POST /plan-filings and re-snapshotted on POST /plan-filings/{id}/submit."
    algorithm: aggregation
    formula: |
      qualifying = MitigationProject rows with plan_year == filing.plan_year
                   AND status IN {APPROVED, IN_EXECUTION, SUSPENDED, COMPLETED}
      qualifying_project_count        = len(qualifying)
      covered_conductor_miles_reported = round_half_up(sum of completed_miles over qualifying
                                                       with program_type == COVERED_CONDUCTOR, 1)
      underground_miles_reported       = round_half_up(sum of completed_miles over qualifying
                                                       with program_type == UNDERGROUNDING, 1)

      closed_events = PSPSEvent rows with scope_status == CLOSED
                      AND actual_de_energized_at's UTC year == filing.plan_year
      psps_event_count = len(closed_events)

      customer_minutes_interrupted = 0
      for e in closed_events ordered by actual_de_energized_at ASC, then created_at ASC:
          for s in e's EventScope rows with scope_status == CONFIRMED, ordered by created_at ASC:
              minutes = floor((s.restored_at - e.actual_de_energized_at) / 60 seconds)
              customer_minutes_interrupted += s.customer_count_snapshot * minutes
      # whole minutes per scope row, summed as integers — no rounding ambiguity

      lead_batches = NotificationBatch rows with psps_event_id IN closed_events
                     AND stage == ADVANCE_48H AND status IN {DISPATCHED, FAILED_PARTIAL}
      avg_notification_lead_minutes = round_half_up(
          sum(lead_time_minutes over lead_batches) / len(lead_batches), 2) if lead_batches else 0.00
    input_set: |
      Projects: plan_year equality and status IN {APPROVED, IN_EXECUTION, SUSPENDED, COMPLETED}; DRAFT,
      SUBMITTED, REVISION_REQUESTED and WITHDRAWN projects are excluded. Events: scope_status == CLOSED and
      the UTC year of actual_de_energized_at equal to the plan year; CANCELLED and in-flight events are
      excluded. Batches: ADVANCE_48H stage only, in a dispatched terminal status.
    constants:
      QUALIFYING_PROJECT_STATUSES: [APPROVED, IN_EXECUTION, SUSPENDED, COMPLETED]
    precision: "customer_minutes_interrupted is a whole-minute integer; mileage to 1 decimal place; avg_notification_lead_minutes to 2 decimal places, round_half_up"

  # ------------------------------------------------------------------ C13 ----
  - name: plan_filing_compliance_score
    trigger: "Computed on POST /plan-filings and re-snapshotted on POST /plan-filings/{id}/submit, after plan_filing_performance_metrics has run."
    algorithm: weighted_scoring
    formula: |
      compliance_score = round_half_up( min(100, max(0,
            UNDERGROUND_WEIGHT * min(1, underground_miles_reported       / UNDERGROUND_TARGET_MILES)
          + COVERED_WEIGHT     * min(1, covered_conductor_miles_reported / COVERED_TARGET_MILES)
          + LEAD_WEIGHT        * min(1, avg_notification_lead_minutes    / LEAD_TARGET_MINUTES)
      )), 2)
    input_set: "Reads the three metric fields that plan_filing_performance_metrics wrote in the same request; each ratio is clamped to 1 before weighting, and the weighted sum is clamped to [0, 100] before the single rounding."
    constants:
      UNDERGROUND_WEIGHT: 40
      COVERED_WEIGHT: 30
      LEAD_WEIGHT: 30
      UNDERGROUND_TARGET_MILES: 20.0
      COVERED_TARGET_MILES: 50.0
      LEAD_TARGET_MINUTES: 2880
    precision: "2 decimal places, round_half_up; exactly one rounding, applied after both clamps"

  # ------------------------------------------------------------------ C14 ----
  - name: energized_customer_total
    trigger: "Invariant probe — not a stored field. Evaluated by tests over GET /circuits before and after an arm/cancel pair."
    algorithm: aggregation
    formula: |
      energized_customer_total = sum of Circuit.customer_count
                                 over all Circuit rows with energization_state == ENERGIZED
      # CONSERVED QUANTITY 1.
      # Forward action:      POST /psps-events/{id}/arm  (CONFIRMED circuits leave ENERGIZED)
      # Compensating action: POST /psps-events/{id}/cancel from ARMED (they return to ENERGIZED)
      # INVARIANT: energized_customer_total after the pair == energized_customer_total before the pair.
      # The same identity must hold across the full restoration cycle
      # (arm -> de-energize -> all-clear -> patrol -> re-energize).
    input_set: "All Circuit rows; only energization_state == ENERGIZED contributes. Customer rows are not mutated by any transition, so drift can only come from a missed or double-applied state cascade."
    constants: {}
    precision: "integer; exact equality is required — no tolerance"

  # ------------------------------------------------------------------ C15 ----
  - name: hardened_mileage_ledger
    trigger: "Invariant probe — not a stored field. Evaluated by tests over GET /circuits/{id} and GET /circuits/{id}/mitigation-projects before and after a record-completion / WITHDRAW pair."
    algorithm: aggregation
    formula: |
      per_circuit_ledger(c) = c.covered_conductor_miles + c.underground_miles
      project_side(c) = sum of completed_miles over MitigationProject rows on c
                        with program_type IN {COVERED_CONDUCTOR, UNDERGROUNDING}
                        AND status IN {IN_EXECUTION, SUSPENDED, COMPLETED}
      # CONSERVED QUANTITY 2 (a different kind of quantity from C14: hardened mileage, not customers).
      # INVARIANT A (always): per_circuit_ledger(c) == project_side(c) for every circuit.
      # Forward action:      POST /mitigation-projects/{id}/record-completion
      # Compensating action: POST /mitigation-projects/{id}/review with decision == WITHDRAW
      # INVARIANT B: per_circuit_ledger(c) after the pair == per_circuit_ledger(c) before the pair,
      #              and c.hardened_fraction returns to its pre-completion value exactly.
    input_set: "MitigationProject rows on the circuit, filtered to the two mileage-bearing program types and the three mileage-bearing statuses. FAST_TRIP_SETTING and INSPECTION_CYCLE projects are excluded from both sides of the identity."
    constants: {}
    precision: "1 decimal place on mileage, 4 on hardened_fraction; exact equality is required — no tolerance"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-Role appears in the called endpoint's §1.5 roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id embedded in the request path resolves to an existing row, validated left-to-right."
    error_id: "ERR_CIRCUIT_NOT_FOUND | ERR_WEATHER_STATION_NOT_FOUND | ERR_PSPS_EVENT_NOT_FOUND | ERR_EVENT_SCOPE_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_NOTIFICATION_BATCH_NOT_FOUND | ERR_NOTIFICATION_RECORD_NOT_FOUND | ERR_MITIGATION_PROJECT_NOT_FOUND | ERR_PATROL_ASSIGNMENT_NOT_FOUND | ERR_RESOURCE_CENTER_NOT_FOUND | ERR_PLAN_FILING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: business_constraint
    check: "Request body and query string are well formed: every required field is present, every enum value is a declared member, every numeric value sits in its declared range (overhead_miles > 0; 0 <= equipment_condition_index <= 100; 0 < representativeness_weight <= 1; site_capacity >= 1; planned_miles > 0; unit_cost_per_mile_cents >= 0; completed_miles_delta > 0; miles_patrolled >= 0; 2020 <= plan_year <= 2100; 1 <= limit <= 100; offset >= 0), notification_channels is a non-empty duplicate-free subset of {SMS, VOICE, EMAIL}, accessibility_needs is a duplicate-free subset of {LARGE_PRINT, TTY, AUDIO}, every datetime parses as ISO-8601 UTC, and forecast_date matches YYYY-MM-DD."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body or query parameters"

  - priority: 6
    category: existence
    check: "Every foreign-key id carried in the request body resolves to an existing row (circuit_id, weather_station_id, psps_event_id, trigger_fire_potential_index_id, patrol_assignment_id, requested_resource_center_ids members)."
    error_id: "ERR_CIRCUIT_NOT_FOUND | ERR_WEATHER_STATION_NOT_FOUND | ERR_PSPS_EVENT_NOT_FOUND | ERR_FIRE_POTENTIAL_INDEX_NOT_FOUND | ERR_PATROL_ASSIGNMENT_NOT_FOUND | ERR_RESOURCE_CENTER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /weather-stations, POST /weather-observations, POST /fire-potential-indices, POST /psps-events, POST /customers, POST /notification-batches, POST /mitigation-projects, POST /patrol-assignments, POST /damage-findings, POST /psps-events/{id}/activate-resource-centers"

  - priority: 7
    category: state
    check: "The OCC field equals the guarded parent's current version (expected_psps_event_version == PSPSEvent.version; expected_circuit_version == Circuit.version)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /psps-events/{id}/scope, POST /mitigation-projects/{id}/record-completion"

  - priority: 8
    category: state
    check: "The target resource itself is in a state that admits the requested transition."
    error_id: "ERR_EVENT_NOT_SCOPED | ERR_EVENT_NOT_ARMED | ERR_EVENT_NOT_ACTIVE | ERR_EVENT_NOT_IN_RESTORATION | ERR_EVENT_TERMINAL | ERR_EVENT_NOT_CANCELLABLE | ERR_SCOPE_ALREADY_EXCLUDED | ERR_BATCH_ALREADY_DISPATCHED | ERR_PROJECT_INVALID_STATE | ERR_PATROL_INVALID_STATE | ERR_FILING_INVALID_STATE | ERR_REVIEW_TRACK_ALREADY_DECIDED | ERR_CIRCUIT_NOT_CLEARED_FOR_RESTORE | ERR_RESOURCE_CENTER_ALREADY_ACTIVE"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: state
    check: "The governing OTHER entity is in the state this operation requires (Circuit.risk_posture != LOCKED for mitigation writes; Circuit.energization_state IN {DE_ENERGIZED, PATROL_IN_PROGRESS, CLEARED_FOR_RESTORE} for patrol scheduling and starting; PSPSEvent.scope_status == RESTORING for patrol start and re-energization; PSPSEvent.scope_status IN {SCOPED, ARMED} for scope exclusion)."
    error_id: "ERR_CIRCUIT_POSTURE_LOCKED | ERR_CIRCUIT_NOT_DE_ENERGIZED | ERR_EVENT_NOT_IN_RESTORATION | ERR_EVENT_NOT_SCOPED"
    http_status: 409
    applies_to: "POST /mitigation-projects, POST /mitigation-projects/{id}/submit, POST /patrol-assignments, POST /patrol-assignments/{id}/start, POST /circuits/{id}/re-energize, POST /event-scopes/{id}/exclude"

  - priority: 10
    category: business_safety
    check: "Field-clearance gates: re-energization requires a latest COMPLETED PatrolAssignment on the circuit with ignition_risk_finding_count == 0; closing an event requires every CONFIRMED scope row to carry restored_at."
    error_id: "ERR_IGNITION_RISK_DAMAGE_UNRESOLVED | ERR_PATROL_NOT_COMPLETED"
    http_status: 422
    applies_to: "POST /circuits/{id}/re-energize, POST /psps-events/{id}/close"

  - priority: 11
    category: business_safety
    check: "Notification-completeness gates: arming requires an ADVANCE_48H batch in status DISPATCHED or FAILED_PARTIAL; de-energizing additionally requires an IMMINENT_1H batch in which every TIER_A_CRITICAL and TIER_B_MEDICAL customer on a CONFIRMED-scoped circuit was DELIVERED."
    error_id: "ERR_ADVANCE_NOTIFICATION_MISSING | ERR_CRITICAL_NOTIFICATION_INCOMPLETE"
    http_status: 422
    applies_to: "POST /psps-events/{id}/arm, POST /psps-events/{id}/de-energize"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the APPROVE decision on a mitigation project must come from an X-User-ID other than last_revision_reviewer_user_id; re-energization must come from an X-User-ID other than the clearing patrol's patrol_lead_user_id; the two plan-filing review tracks of one round must be decided by different X-User-IDs."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mitigation-projects/{id}/review, POST /circuits/{id}/re-energize, POST /plan-filings/{id}/reviews"

  - priority: 13
    category: business_temporal
    check: "Interval and lead-time well-formedness: forecast_all_clear_at > forecast_onset_at; window_end_at > window_start_at; an advance-stage batch's scheduled_send_at is strictly before the event's forecast_onset_at; the dispatched lead time meets STAGE_MIN_LEAD_MINUTES for the stage."
    error_id: "ERR_EVENT_WINDOW_INVALID | ERR_PATROL_WINDOW_INVALID | ERR_NOTIFICATION_WINDOW_INVALID | ERR_NOTIFICATION_LEAD_TIME_SHORT"
    http_status: 422
    applies_to: "POST /psps-events, POST /patrol-assignments, POST /notification-batches, POST /notification-batches/{id}/dispatch"

  - priority: 14
    category: business_referential
    check: "Required related rows exist in the required states: the event has at least one CONFIRMED EventScope; scoping found at least one circuit with a qualifying FORECAST index; index computation found at least one in-window observation on an eligible station; a filing has at least one qualifying MitigationProject for its plan year."
    error_id: "ERR_NO_CIRCUITS_IN_SCOPE | ERR_NO_QUALIFYING_CIRCUITS | ERR_OBSERVATION_WINDOW_EMPTY | ERR_FILING_METRICS_INCOMPLETE"
    http_status: 422
    applies_to: "POST /psps-events/{id}/scope, POST /psps-events/{id}/arm, POST /notification-batches, POST /notification-batches/{id}/dispatch, POST /fire-potential-indices, POST /plan-filings/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "Natural-key uniqueness: circuit_code, station_code, event_code, account_number, project_code, resource_center_code, filing_code and WildfirePlanFiling.plan_year are each unique across all rows of their entity."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /circuits, POST /weather-stations, POST /psps-events, POST /customers, POST /mitigation-projects, POST /community-resource-centers, POST /plan-filings"

  - priority: 16
    category: business_temporal
    check: "Resource interval-occupation conflicts: a circuit may not sit in a CONFIRMED scope of two live events whose [forecast_onset_at, forecast_all_clear_at) windows half-open-overlap; a resource center may not be activated when the event's onset falls strictly inside its previous service window plus the 240-minute reset buffer; a circuit may not hold two SCHEDULED/IN_PROGRESS patrol windows whose closed [window_start_at, window_end_at] intervals intersect."
    error_id: "ERR_CIRCUIT_WINDOW_CONFLICT | ERR_RESOURCE_CENTER_BUFFER_CONFLICT | ERR_PATROL_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /psps-events/{id}/scope, POST /psps-events/{id}/activate-resource-centers, POST /patrol-assignments"

  - priority: 17
    category: business_fiscal
    check: "Ceilings and thresholds: net_benefit_ratio >= 0.25 to arm; cumulative completed_miles may not exceed planned_miles; review_round may not exceed 2 REQUEST_REVISION decisions; the activation selector must find at least one eligible site when required capacity is positive; an explicitly named site must sit in a scoped district."
    error_id: "ERR_NET_BENEFIT_BELOW_THRESHOLD | ERR_MITIGATION_MILES_EXCEEDED | ERR_REVIEW_ROUND_LIMIT | ERR_NO_ELIGIBLE_RESOURCE_CENTER | ERR_RESOURCE_CENTER_DISTRICT_MISMATCH"
    http_status: 422
    applies_to: "POST /psps-events/{id}/arm, POST /mitigation-projects/{id}/record-completion, POST /mitigation-projects/{id}/review, POST /psps-events/{id}/activate-resource-centers"

# =============================================================================
# §1.5 API Endpoint Table  (flat topology; every path parameter is spelled {id})
# =============================================================================
endpoints:

  # ------------------------------------------------------------- circuits ----
  - method: POST
    path: "/circuits"
    description: "Register a distribution circuit with its terrain, asset-condition and feeder-topology attributes."
    roles: [GridPlanner]
    code: 201
    input: ["circuit_code", "district_code", "hftd_tier", "overhead_miles", "equipment_condition_index", "inspection_cycle_months?", "last_inspection_completed_at?", "upstream_circuit_id?", "fast_trip_enabled?"]
    output: Circuit
    side_effects:
      - "initialises energization_state = ENERGIZED, risk_posture = NORMAL, hardened_fraction = 0.0000"
      - "initialises covered_conductor_miles = 0, underground_miles = 0, all customer counters = 0"

  - method: GET
    path: "/circuits"
    description: "List circuits with filters; the reverse-reachability channel for the Circuit.upstream_circuit_id self-reference."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["district_code?", "hftd_tier?", "energization_state?", "risk_posture?", "upstream_circuit_id?", "limit?", "offset?"]
    output: Circuit[]
    side_effects: []

  - method: GET
    path: "/circuits/{id}"
    description: "Read one circuit including its computed hardening, posture and customer counters."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: []
    output: Circuit
    side_effects: []

  - method: GET
    path: "/circuits/{id}/weather-stations"
    description: "List the monitoring stations feeding this circuit's fire potential index."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["telemetry_status?", "limit?", "offset?"]
    output: WeatherStation[]
    side_effects: []

  - method: GET
    path: "/circuits/{id}/customers"
    description: "List the accounts served by this circuit, including their computed notification tier."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: ["customer_class?", "medical_baseline?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/circuits/{id}/fire-potential-indices"
    description: "List the fire potential indices computed for this circuit; the discovery channel for index rows."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["computation_variant?", "forecast_date?", "limit?", "offset?"]
    output: FirePotentialIndex[]
    side_effects: []

  - method: GET
    path: "/circuits/{id}/mitigation-projects"
    description: "List the mitigation work packages booked against this circuit."
    roles: [GridPlanner, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["program_type?", "status?", "limit?", "offset?"]
    output: MitigationProject[]
    side_effects: []

  - method: GET
    path: "/circuits/{id}/event-scopes"
    description: "List every shutoff-event scope row that has ever named this circuit."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, TransmissionEngineer]
    code: 200
    input: ["scope_status?", "limit?", "offset?"]
    output: EventScope[]
    side_effects: []

  - method: POST
    path: "/circuits/{id}/re-energize"
    description: "Return a patrolled and cleared circuit to service. Segregation of duties applies: X-User-ID must differ from the clearing patrol's patrol_lead_user_id."
    roles: [PSPSDutyOfficer]
    code: 200
    input: []
    output: Circuit
    side_effects:
      - "Circuit CLEARED_FOR_RESTORE -> ENERGIZED; risk_posture recomputed out of LOCKED"
      - "every SUSPENDED MitigationProject on the circuit returns to IN_EXECUTION"
      - "stamps the circuit's EventScope.restored_at"
      - "when every CONFIRMED scope row of the event is restored: stamps PSPSEvent.actual_restored_at, recomputes duration_hours and re-runs psps_net_benefit_ratio under POST_EVENT"
      - "then demobilizes every CommunityResourceCenter still ACTIVATED for that event"
      - "aborts any SCHEDULED or IN_PROGRESS PatrolAssignment left on the circuit"
      - "increments Circuit.version by 1"

  # ------------------------------------------------------- weather network ----
  - method: POST
    path: "/weather-stations"
    description: "Add a monitoring station to a circuit's station network."
    roles: [GridPlanner, MeteorologyAnalyst]
    code: 201
    input: ["station_code", "circuit_id", "elevation_ft", "representativeness_weight", "telemetry_status?"]
    output: WeatherStation
    side_effects:
      - "initialises observation_count = 0 and last_observation_at = null"

  - method: GET
    path: "/weather-stations/{id}"
    description: "Read one monitoring station."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: []
    output: WeatherStation
    side_effects: []

  - method: GET
    path: "/weather-stations/{id}/observations"
    description: "List a station's observations in observed_at ASC order."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: WeatherObservation[]
    side_effects: []

  - method: POST
    path: "/weather-observations"
    description: "File one telemetry observation against a station."
    roles: [MeteorologyAnalyst]
    code: 201
    input: [weather_station_id, observed_at, wind_gust_mph, relative_humidity_pct, temperature_f, dead_fuel_moisture_pct]
    output: WeatherObservation
    side_effects:
      - "increments WeatherStation.observation_count and refreshes WeatherStation.last_observation_at"
      - "increments WeatherStation.version by 1"

  - method: POST
    path: "/fire-potential-indices"
    description: "Compute and persist an immutable fire potential index row for a circuit and forecast day under the requested variant."
    roles: [MeteorologyAnalyst]
    code: 201
    input: [circuit_id, forecast_date, computation_variant]
    output: FirePotentialIndex
    side_effects:
      - "runs calculations.fire_potential_index under the requested variant"
      - "for FORECAST rows, re-runs calculations.circuit_risk_posture and refreshes Circuit.latest_forecast_fpi_score / latest_forecast_fpi_tier"
      - "increments Circuit.version by 1 when the posture or the latest_* fields change"

  # ------------------------------------------------------------ psps events ---
  - method: POST
    path: "/psps-events"
    description: "Open a shutoff event against the index that justified it."
    roles: [PSPSDutyOfficer]
    code: 201
    input: [event_code, trigger_fire_potential_index_id, forecast_onset_at, forecast_all_clear_at]
    output: PSPSEvent
    side_effects:
      - "initialises scope_status = DRAFT, notification_status = NOT_STARTED and every computed score to 0"

  - method: GET
    path: "/psps-events"
    description: "List shutoff events with filters; the reverse-reachability channel for PSPSEvent.trigger_fire_potential_index_id."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["scope_status?", "notification_status?", "trigger_fire_potential_index_id?", "limit?", "offset?"]
    output: PSPSEvent[]
    side_effects: []

  - method: GET
    path: "/psps-events/{id}"
    description: "Read one shutoff event including both state dimensions and every computed score."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: []
    output: PSPSEvent
    side_effects: []

  - method: POST
    path: "/psps-events/{id}/scope"
    description: "Determine (or re-determine) the shutoff scope from the current forecast. Guarded by OCC on the event version; a re-scope hard-deletes and rewrites the event's scope rows."
    roles: [PSPSDutyOfficer]
    code: 200
    input: [expected_psps_event_version]
    output: PSPSEvent
    side_effects:
      - "runs calculations.psps_scope_determination, writing CONFIRMED and fast-trip-EXCLUDED EventScope rows"
      - "runs calculations.ignition_risk_avoided_score, then calculations.psps_net_benefit_ratio under PRE_EVENT"
      - "on a re-scope, first hard-deletes the prior EventScope rows and reverts any staged circuit to ENERGIZED"
      - "PSPSEvent DRAFT -> SCOPED (or SCOPED -> SCOPED)"
      - "increments PSPSEvent.version by 1"

  - method: GET
    path: "/psps-events/{id}/scopes"
    description: "List an event's scope rows."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["scope_status?", "limit?", "offset?"]
    output: EventScope[]
    side_effects: []

  - method: POST
    path: "/event-scopes/{id}/exclude"
    description: "Hold a circuit out of a scoped or armed event, with a written justification."
    roles: [TransmissionEngineer]
    code: 200
    input: [exclusion_justification]
    output: EventScope
    side_effects:
      - "EventScope CONFIRMED -> EXCLUDED; ignition_risk_term set to 0.00"
      - "reverts the circuit DE_ENERGIZATION_PENDING -> ENERGIZED when it was staged"
      - "recomputes the event's counts, ignition_risk_avoided_score and net_benefit_ratio (PRE_EVENT)"
      - "increments EventScope.version and PSPSEvent.version by 1 each"

  - method: POST
    path: "/psps-events/{id}/arm"
    description: "Stage the shutoff: verify the advance notification and net-benefit gates, then move every confirmed circuit to DE_ENERGIZATION_PENDING."
    roles: [PSPSDutyOfficer]
    code: 200
    input: []
    output: PSPSEvent
    side_effects:
      - "PSPSEvent SCOPED -> ARMED"
      - "cascades every CONFIRMED-scoped Circuit ENERGIZED -> DE_ENERGIZATION_PENDING and sets each risk_posture = LOCKED"
      - "increments PSPSEvent.version by 1"

  - method: POST
    path: "/psps-events/{id}/de-energize"
    description: "Execute the shutoff order after the critical-customer notification gate passes."
    roles: [PSPSDutyOfficer]
    code: 200
    input: []
    output: PSPSEvent
    side_effects:
      - "PSPSEvent ARMED -> ACTIVE; stamps actual_de_energized_at from the logical clock"
      - "cascades every CONFIRMED-scoped Circuit DE_ENERGIZATION_PENDING -> DE_ENERGIZED"
      - "because each posture is LOCKED, every IN_EXECUTION MitigationProject on those circuits moves to SUSPENDED"
      - "increments PSPSEvent.version by 1"

  - method: POST
    path: "/psps-events/{id}/all-clear"
    description: "Meteorology declares the damaging-weather window over, unlocking patrol work."
    roles: [MeteorologyAnalyst]
    code: 200
    input: []
    output: PSPSEvent
    side_effects:
      - "PSPSEvent ACTIVE -> RESTORING"
      - "increments PSPSEvent.version by 1"

  - method: POST
    path: "/psps-events/{id}/close"
    description: "Close a fully restored event and freeze its POST_EVENT performance scores."
    roles: [PSPSDutyOfficer]
    code: 200
    input: []
    output: PSPSEvent
    side_effects:
      - "PSPSEvent RESTORING -> CLOSED"
      - "demobilizes any CommunityResourceCenter still ACTIVATED for this event"
      - "makes the event eligible for plan-filing metric roll-up"
      - "increments PSPSEvent.version by 1"

  - method: POST
    path: "/psps-events/{id}/cancel"
    description: "Stand the event down before the breakers open, reverting every staged circuit."
    roles: [PSPSDutyOfficer]
    code: 200
    input: [cancellation_reason]
    output: PSPSEvent
    side_effects:
      - "PSPSEvent DRAFT|SCOPED|ARMED -> CANCELLED"
      - "COMPENSATION: reverts every DE_ENERGIZATION_PENDING circuit to ENERGIZED, restoring energized_customer_total exactly"
      - "sets every CONFIRMED EventScope row to EXCLUDED with exclusion_justification = 'EVENT_CANCELLED'"
      - "aborts any SCHEDULED or IN_PROGRESS PatrolAssignment on the event"
      - "demobilizes any CommunityResourceCenter ACTIVATED for this event"
      - "increments PSPSEvent.version by 1"

  - method: POST
    path: "/psps-events/{id}/activate-resource-centers"
    description: "Open community resource centers for an armed or active event. Omit requested_resource_center_ids to run the capacity waterfall; supply it to activate named sites and have every eligibility breach rejected."
    roles: [PSPSDutyOfficer]
    code: 200
    input: ["requested_resource_center_ids?"]
    output: "{ activated_count: integer, activated_capacity: integer, unmet_capacity: integer, activated_resource_center_ids: string[] }"
    side_effects:
      - "runs calculations.resource_center_activation_selector"
      - "moves each selected CommunityResourceCenter STANDBY|DEMOBILIZED -> ACTIVATED with activation_order and last_served_all_clear_at"
      - "recomputes PSPSEvent.crc_capacity_served and re-runs psps_net_benefit_ratio, changing crc_mitigation_credit, adjusted_customer_impact_score and net_benefit_ratio"
      - "increments PSPSEvent.version by 1"

  - method: GET
    path: "/psps-events/{id}/resource-centers"
    description: "List the community resource centers attached to this event."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommunityResourceCenter[]
    side_effects: []

  - method: GET
    path: "/psps-events/{id}/notification-batches"
    description: "List the notification batches created for this event."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: ["stage?", "status?", "limit?", "offset?"]
    output: NotificationBatch[]
    side_effects: []

  # ------------------------------------------------------------- customers ----
  - method: POST
    path: "/customers"
    description: "Register a served account with its language, channel and accessibility profile."
    roles: [GridPlanner, CommunityLiaison]
    code: 201
    input: ["account_number", "circuit_id", "customer_class", "medical_baseline?", "preferred_language", "notification_channels", "accessibility_needs?", "address_zone_code"]
    output: Customer
    side_effects:
      - "computes notification_tier via calculations.customer_notification_tier"
      - "increments Circuit.customer_count, and Circuit.medical_baseline_count / Circuit.critical_facility_count where applicable"
      - "increments Circuit.version by 1"

  - method: GET
    path: "/customers/{id}"
    description: "Read one account."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --------------------------------------------------------- notifications ----
  - method: POST
    path: "/notification-batches"
    description: "Plan one stage of an event's notification sequence."
    roles: [CommunityLiaison]
    code: 201
    input: [psps_event_id, stage, scheduled_send_at]
    output: NotificationBatch
    side_effects:
      - "initialises status = PENDING and every counter to 0"

  - method: GET
    path: "/notification-batches/{id}"
    description: "Read one notification batch including its realised lead time and delivery counters."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: []
    output: NotificationBatch
    side_effects: []

  - method: POST
    path: "/notification-batches/{id}/dispatch"
    description: "Send a planned batch: check the stage lead time, then write one notification record per targeted account."
    roles: [CommunityLiaison]
    code: 200
    input: []
    output: NotificationBatch
    side_effects:
      - "runs calculations.notification_lead_time and calculations.notification_routing"
      - "writes NotificationRecord rows in the pinned dispatch order"
      - "NotificationBatch PENDING -> DISPATCHED or -> FAILED_PARTIAL"
      - "advances PSPSEvent.notification_status per the stage map"
      - "increments NotificationBatch.version and PSPSEvent.version by 1 each"

  - method: GET
    path: "/notification-records"
    description: "List notification records; the reverse-reachability channel for both of NotificationRecord's foreign keys."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: ["notification_batch_id?", "customer_id?", "delivery_status?", "limit?", "offset?"]
    output: NotificationRecord[]
    side_effects: []

  - method: GET
    path: "/notification-records/{id}"
    description: "Read one notification record."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: []
    output: NotificationRecord
    side_effects: []

  # ---------------------------------------------------- mitigation program ----
  - method: POST
    path: "/mitigation-projects"
    description: "Book a hardening work package against a circuit."
    roles: [GridPlanner]
    code: 201
    input: [project_code, circuit_id, program_type, plan_year, planned_miles, unit_cost_per_mile_cents]
    output: MitigationProject
    side_effects:
      - "runs calculations.mitigation_risk_reduction_score, setting risk_reduction_score and budget_cents"
      - "initialises status = DRAFT, completed_miles = 0, review_round = 0"

  - method: GET
    path: "/mitigation-projects/{id}"
    description: "Read one mitigation project."
    roles: [GridPlanner, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: []
    output: MitigationProject
    side_effects: []

  - method: POST
    path: "/mitigation-projects/{id}/submit"
    description: "Submit a draft or revised project for regulatory review."
    roles: [GridPlanner]
    code: 200
    input: []
    output: MitigationProject
    side_effects:
      - "MitigationProject DRAFT|REVISION_REQUESTED -> SUBMITTED"
      - "recomputes risk_reduction_score against the circuit's current hftd_tier"
      - "increments MitigationProject.version by 1"

  - method: POST
    path: "/mitigation-projects/{id}/review"
    description: "Regulatory decision on a project. APPROVE and REQUEST_REVISION act on SUBMITTED rows; WITHDRAW is the compensating action that reverses recorded mileage."
    roles: [RegulatoryReviewer]
    code: 200
    input: ["decision", "review_note?"]
    output: MitigationProject
    side_effects:
      - "decision == REQUEST_REVISION: SUBMITTED -> REVISION_REQUESTED, review_round += 1, last_revision_reviewer_user_id = X-User-ID"
      - "decision == APPROVE: SUBMITTED -> APPROVED, subject to the segregation-of-duties check against last_revision_reviewer_user_id"
      - "decision == WITHDRAW: IN_EXECUTION|SUSPENDED|COMPLETED -> WITHDRAWN, subtracts completed_miles from the circuit's mileage ledger, zeroes completed_miles, recomputes hardened_fraction and risk_posture, increments Circuit.version by 1"
      - "increments MitigationProject.version by 1"

  - method: POST
    path: "/mitigation-projects/{id}/record-completion"
    description: "Record executed mileage against an approved project. Guarded by OCC on the circuit version, because each record moves the circuit's hardening ledger."
    roles: [AssetInspector]
    code: 200
    input: [completed_miles_delta, completion_date, expected_circuit_version]
    output: MitigationProject
    side_effects:
      - "adds completed_miles_delta to completed_miles; APPROVED -> IN_EXECUTION, or IN_EXECUTION -> COMPLETED when planned_miles is reached"
      - "COVERED_CONDUCTOR adds the delta to Circuit.covered_conductor_miles; UNDERGROUNDING to Circuit.underground_miles; INSPECTION_CYCLE sets Circuit.last_inspection_completed_at = completion_date; FAST_TRIP_SETTING sets Circuit.fast_trip_enabled = true on completion"
      - "recomputes Circuit.hardened_fraction and Circuit.risk_posture"
      - "increments Circuit.version by 1 and MitigationProject.version by 1"

  # ------------------------------------------------- patrol and restoration ---
  - method: POST
    path: "/patrol-assignments"
    description: "Reserve a patrol window on a de-energized circuit and name the accountable crew lead."
    roles: [FieldPatrolSupervisor]
    code: 201
    input: [psps_event_id, circuit_id, patrol_mode, window_start_at, window_end_at, patrol_lead_user_id]
    output: PatrolAssignment
    side_effects:
      - "initialises status = SCHEDULED, miles_patrolled = 0, damage_finding_count = 0, ignition_risk_finding_count = 0"

  - method: GET
    path: "/patrol-assignments"
    description: "List patrol assignments with filters; the reverse-reachability channel for both of PatrolAssignment's foreign keys."
    roles: [GridPlanner, PSPSDutyOfficer, RegulatoryReviewer, FieldPatrolSupervisor, TransmissionEngineer]
    code: 200
    input: ["psps_event_id?", "circuit_id?", "status?", "limit?", "offset?"]
    output: PatrolAssignment[]
    side_effects: []

  - method: GET
    path: "/patrol-assignments/{id}"
    description: "Read one patrol assignment including its damage-finding counters."
    roles: [GridPlanner, PSPSDutyOfficer, RegulatoryReviewer, FieldPatrolSupervisor, TransmissionEngineer]
    code: 200
    input: []
    output: PatrolAssignment
    side_effects: []

  - method: POST
    path: "/patrol-assignments/{id}/start"
    description: "Begin a patrol, moving the circuit into PATROL_IN_PROGRESS."
    roles: [FieldPatrolSupervisor]
    code: 200
    input: []
    output: PatrolAssignment
    side_effects:
      - "PatrolAssignment SCHEDULED -> IN_PROGRESS; stamps started_at"
      - "drives Circuit DE_ENERGIZED -> PATROL_IN_PROGRESS, or CLEARED_FOR_RESTORE -> PATROL_IN_PROGRESS on the repair back-edge"
      - "increments PatrolAssignment.version and Circuit.version by 1 each"

  - method: POST
    path: "/patrol-assignments/{id}/complete"
    description: "Close out a patrol with the miles walked or flown, moving the circuit to CLEARED_FOR_RESTORE."
    roles: [FieldPatrolSupervisor]
    code: 200
    input: [miles_patrolled]
    output: PatrolAssignment
    side_effects:
      - "PatrolAssignment IN_PROGRESS -> COMPLETED; stamps completed_at and miles_patrolled"
      - "drives Circuit PATROL_IN_PROGRESS -> CLEARED_FOR_RESTORE unconditionally; the ignition-risk gate is enforced at re-energization"
      - "increments PatrolAssignment.version and Circuit.version by 1 each"

  - method: POST
    path: "/damage-findings"
    description: "File a damage assessment finding against an in-progress patrol."
    roles: [FieldPatrolSupervisor]
    code: 201
    input: [patrol_assignment_id, severity, description, requires_repair]
    output: DamageFinding
    side_effects:
      - "stamps found_at from the logical clock"
      - "increments PatrolAssignment.damage_finding_count and, for IGNITION_RISK, ignition_risk_finding_count"
      - "increments PatrolAssignment.version by 1"

  - method: GET
    path: "/patrol-assignments/{id}/damage-findings"
    description: "List the findings filed against one patrol; the only discovery channel for cascade-created finding rows."
    roles: [GridPlanner, PSPSDutyOfficer, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: ["severity?", "limit?", "offset?"]
    output: DamageFinding[]
    side_effects: []

  # ---------------------------------------------- community resource centers --
  - method: POST
    path: "/community-resource-centers"
    description: "Register a community resource center site in a district."
    roles: [CommunityLiaison]
    code: 201
    input: ["resource_center_code", "district_code", "site_capacity", "accessibility_certified?"]
    output: CommunityResourceCenter
    side_effects:
      - "initialises status = STANDBY with psps_event_id, activated_at, demobilized_at, last_served_all_clear_at and activation_order all null"

  - method: GET
    path: "/community-resource-centers/{id}"
    description: "Read one resource center site including its activation history anchors."
    roles: [GridPlanner, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, TransmissionEngineer]
    code: 200
    input: []
    output: CommunityResourceCenter
    side_effects: []

  # -------------------------------------------------------------- filings ----
  - method: POST
    path: "/plan-filings"
    description: "Open a wildfire mitigation plan filing for a plan year and snapshot its metrics."
    roles: [GridPlanner]
    code: 201
    input: [filing_code, plan_year]
    output: WildfirePlanFiling
    side_effects:
      - "runs calculations.plan_filing_performance_metrics then calculations.plan_filing_compliance_score"
      - "initialises status = DRAFT with both review tracks PENDING and deficiency_round_count = 0"

  - method: GET
    path: "/plan-filings/{id}"
    description: "Read one filing including both review-track states and every reported metric."
    roles: [GridPlanner, PSPSDutyOfficer, RegulatoryReviewer, AssetInspector, TransmissionEngineer]
    code: 200
    input: []
    output: WildfirePlanFiling
    side_effects: []

  - method: POST
    path: "/plan-filings/{id}/submit"
    description: "File (or re-file) the plan with the regulator, re-snapshotting metrics and resetting both review tracks."
    roles: [GridPlanner]
    code: 200
    input: []
    output: WildfirePlanFiling
    side_effects:
      - "WildfirePlanFiling DRAFT|DEFICIENCY_ISSUED -> SUBMITTED"
      - "re-runs plan_filing_performance_metrics and plan_filing_compliance_score"
      - "resets safety_review_state and fiscal_review_state to PENDING and clears both reviewer ids"
      - "increments WildfirePlanFiling.version by 1"

  - method: POST
    path: "/plan-filings/{id}/reviews"
    description: "Record one regulator decision on one review track. The join to APPROVED completes only when both tracks are CLEARED by different reviewers."
    roles: [RegulatoryReviewer]
    code: 200
    input: ["review_track", "decision", "deficiency_note?"]
    output: WildfirePlanFiling
    side_effects:
      - "sets the named track's state and reviewer id"
      - "decision == CLEAR on the second track: JOIN, status -> APPROVED"
      - "decision == DEFICIENT: status -> DEFICIENCY_ISSUED, deficiency_round_count += 1, last_deficiency_note set; -> REJECTED instead when deficiency_round_count was already 2"
      - "increments WildfirePlanFiling.version by 1"

  # ------------------------------------------------------- logical clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that positions the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, lead-time, inspection-cycle and reset-buffer rule in this scaffold is evaluated against this clock."
    roles: [GridPlanner, MeteorologyAnalyst, PSPSDutyOfficer, CommunityLiaison, RegulatoryReviewer, FieldPatrolSupervisor, AssetInspector, TransmissionEngineer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; performs no entity mutation and bumps no version"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside §1.7."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The authenticated role is not listed in the called endpoint's §1.5 roles."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same person who performed the incompatible prior step: approving a project they sent back for revision, re-energizing a circuit they led the clearing patrol on, or clearing both review tracks of one filing round."
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is absent, an enum value is not a declared member, a numeric value is outside its declared range, an array contains duplicates or an undeclared member, or a datetime / forecast_date fails to parse."
  # ---- not found ----
  - id: ERR_CIRCUIT_NOT_FOUND
    http: 404
    condition: "A circuit id in the path or body does not resolve."
  - id: ERR_WEATHER_STATION_NOT_FOUND
    http: 404
    condition: "A weather-station id in the path or body does not resolve."
  - id: ERR_FIRE_POTENTIAL_INDEX_NOT_FOUND
    http: 404
    condition: "trigger_fire_potential_index_id does not resolve to a FirePotentialIndex row."
  - id: ERR_PSPS_EVENT_NOT_FOUND
    http: 404
    condition: "A shutoff-event id in the path or body does not resolve."
  - id: ERR_EVENT_SCOPE_NOT_FOUND
    http: 404
    condition: "An event-scope id in the path does not resolve."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "A customer id in the path or query filter does not resolve."
  - id: ERR_NOTIFICATION_BATCH_NOT_FOUND
    http: 404
    condition: "A notification-batch id in the path or query filter does not resolve."
  - id: ERR_NOTIFICATION_RECORD_NOT_FOUND
    http: 404
    condition: "A notification-record id in the path does not resolve."
  - id: ERR_MITIGATION_PROJECT_NOT_FOUND
    http: 404
    condition: "A mitigation-project id in the path does not resolve."
  - id: ERR_PATROL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "A patrol-assignment id in the path or body does not resolve."
  - id: ERR_RESOURCE_CENTER_NOT_FOUND
    http: 404
    condition: "A resource-center id in the path or in requested_resource_center_ids does not resolve."
  - id: ERR_PLAN_FILING_NOT_FOUND
    http: 404
    condition: "A plan-filing id in the path does not resolve."
  # ---- OCC ----
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_psps_event_version does not equal PSPSEvent.version on a scope call, or expected_circuit_version does not equal Circuit.version on a record-completion call."
  # ---- own-state ----
  - id: ERR_EVENT_NOT_SCOPED
    http: 409
    condition: "An operation requiring PSPSEvent.scope_status IN {SCOPED, ARMED} found the event elsewhere — arming a DRAFT event, or excluding a scope row on a DRAFT, ACTIVE, RESTORING, CLOSED or CANCELLED event."
  - id: ERR_EVENT_NOT_ARMED
    http: 409
    condition: "POST /psps-events/{id}/de-energize on an event whose scope_status is not ARMED."
  - id: ERR_EVENT_NOT_ACTIVE
    http: 409
    condition: "POST /psps-events/{id}/all-clear on an event whose scope_status is not ACTIVE."
  - id: ERR_EVENT_NOT_IN_RESTORATION
    http: 409
    condition: "POST /psps-events/{id}/close, POST /patrol-assignments/{id}/start or POST /circuits/{id}/re-energize while the governing event's scope_status is not RESTORING."
  - id: ERR_EVENT_TERMINAL
    http: 409
    condition: "Any state-advancing call on an event whose scope_status is already CLOSED or CANCELLED."
  - id: ERR_EVENT_NOT_CANCELLABLE
    http: 409
    condition: "POST /psps-events/{id}/cancel on an event whose scope_status is ACTIVE, RESTORING, CLOSED or CANCELLED."
  - id: ERR_SCOPE_ALREADY_EXCLUDED
    http: 409
    condition: "POST /event-scopes/{id}/exclude on a row whose scope_status is already EXCLUDED."
  - id: ERR_BATCH_ALREADY_DISPATCHED
    http: 409
    condition: "POST /notification-batches/{id}/dispatch on a batch whose status is already DISPATCHED or FAILED_PARTIAL."
  - id: ERR_PROJECT_INVALID_STATE
    http: 409
    condition: "A mitigation transition was requested from a status that does not admit it — submitting an APPROVED project, reviewing a DRAFT project, recording completion on a SUBMITTED project, or any decision on a WITHDRAWN project."
  - id: ERR_PATROL_INVALID_STATE
    http: 409
    condition: "Starting a patrol that is not SCHEDULED, completing one that is not IN_PROGRESS, or filing a damage finding against an assignment that is not IN_PROGRESS."
  - id: ERR_FILING_INVALID_STATE
    http: 409
    condition: "Submitting a filing that is not DRAFT or DEFICIENCY_ISSUED, or reviewing one that is not SUBMITTED."
  - id: ERR_REVIEW_TRACK_ALREADY_DECIDED
    http: 409
    condition: "POST /plan-filings/{id}/reviews naming a review_track whose state is already CLEARED or DEFICIENT in the current round."
  - id: ERR_CIRCUIT_NOT_CLEARED_FOR_RESTORE
    http: 409
    condition: "POST /circuits/{id}/re-energize on a circuit whose energization_state is not CLEARED_FOR_RESTORE."
  - id: ERR_RESOURCE_CENTER_ALREADY_ACTIVE
    http: 409
    condition: "An explicitly named resource center is already ACTIVATED."
  # ---- cross-entity state ----
  - id: ERR_CIRCUIT_POSTURE_LOCKED
    http: 409
    condition: "Booking or submitting a mitigation project on a circuit whose risk_posture is LOCKED."
  - id: ERR_CIRCUIT_NOT_DE_ENERGIZED
    http: 409
    condition: "Scheduling or starting a patrol on a circuit whose energization_state is not one of DE_ENERGIZED, PATROL_IN_PROGRESS or CLEARED_FOR_RESTORE."
  # ---- safety ----
  - id: ERR_IGNITION_RISK_DAMAGE_UNRESOLVED
    http: 422
    condition: "Re-energizing a circuit whose latest COMPLETED patrol filed at least one IGNITION_RISK damage finding."
  - id: ERR_PATROL_NOT_COMPLETED
    http: 422
    condition: "Closing an event while at least one CONFIRMED scope row still has restored_at == null."
  - id: ERR_ADVANCE_NOTIFICATION_MISSING
    http: 422
    condition: "Arming an event with no ADVANCE_48H batch in status DISPATCHED or FAILED_PARTIAL."
  - id: ERR_CRITICAL_NOTIFICATION_INCOMPLETE
    http: 422
    condition: "De-energizing when the IMMINENT_1H batch is absent, or when any TIER_A_CRITICAL or TIER_B_MEDICAL customer on a CONFIRMED-scoped circuit was not DELIVERED in it."
  # ---- temporal ----
  - id: ERR_EVENT_WINDOW_INVALID
    http: 422
    condition: "POST /psps-events with forecast_all_clear_at less than or equal to forecast_onset_at."
  - id: ERR_PATROL_WINDOW_INVALID
    http: 422
    condition: "POST /patrol-assignments with window_end_at less than or equal to window_start_at."
  - id: ERR_NOTIFICATION_WINDOW_INVALID
    http: 422
    condition: "POST /notification-batches for an ADVANCE_48H, ADVANCE_24H or IMMINENT_1H stage whose scheduled_send_at is at or after the event's forecast_onset_at."
  - id: ERR_NOTIFICATION_LEAD_TIME_SHORT
    http: 422
    condition: "Dispatching a batch whose realised lead_time_minutes is below STAGE_MIN_LEAD_MINUTES for its stage; exactly equal is accepted."
  # ---- referential ----
  - id: ERR_NO_CIRCUITS_IN_SCOPE
    http: 422
    condition: "Arming, creating a notification batch for, or dispatching a batch of an event whose confirmed_scope_count is 0."
  - id: ERR_NO_QUALIFYING_CIRCUITS
    http: 422
    condition: "POST /psps-events/{id}/scope found no ENERGIZED circuit with a FORECAST index for the onset date in tier R4 or R5."
  - id: ERR_OBSERVATION_WINDOW_EMPTY
    http: 422
    condition: "POST /fire-potential-indices found no ONLINE or DEGRADED station on the circuit with an observation inside the half-open 48-hour selection window."
  - id: ERR_FILING_METRICS_INCOMPLETE
    http: 422
    condition: "Submitting a filing whose plan year has no MitigationProject in status APPROVED, IN_EXECUTION, SUSPENDED or COMPLETED."
  # ---- uniqueness ----
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A natural key collides with an existing row: circuit_code, station_code, event_code, account_number, project_code, resource_center_code, filing_code, or WildfirePlanFiling.plan_year."
  # ---- interval occupation ----
  - id: ERR_CIRCUIT_WINDOW_CONFLICT
    http: 409
    condition: "Scoping would place a circuit in a CONFIRMED scope of two live events whose [forecast_onset_at, forecast_all_clear_at) windows overlap; touching windows (one's all-clear equal to the other's onset) do not conflict."
  - id: ERR_RESOURCE_CENTER_BUFFER_CONFLICT
    http: 409
    condition: "An explicitly named resource center's previous service window plus the 240-minute reset buffer extends past the new event's forecast_onset_at; onset exactly at the buffer edge is accepted."
  - id: ERR_PATROL_WINDOW_OVERLAP
    http: 409
    condition: "A new patrol window intersects the closed [window_start_at, window_end_at] interval of another SCHEDULED or IN_PROGRESS assignment on the same circuit; shared endpoints do conflict."
  # ---- fiscal / ceilings ----
  - id: ERR_NET_BENEFIT_BELOW_THRESHOLD
    http: 422
    condition: "Arming an event whose net_benefit_ratio is below 0.25; exactly 0.2500 is accepted."
  - id: ERR_MITIGATION_MILES_EXCEEDED
    http: 422
    condition: "A record-completion call would push cumulative completed_miles above planned_miles."
  - id: ERR_REVIEW_ROUND_LIMIT
    http: 422
    condition: "A third REQUEST_REVISION decision on a project whose review_round is already 2."
  - id: ERR_NO_ELIGIBLE_RESOURCE_CENTER
    http: 422
    condition: "The activation selector found no site in a scoped district that is free of a reset-buffer collision while crc_capacity_required is greater than 0."
  - id: ERR_RESOURCE_CENTER_DISTRICT_MISMATCH
    http: 422
    condition: "An explicitly named resource center's district_code matches no CONFIRMED-scoped circuit of the event."

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: GridPlanner
    description: "Owns the static grid model and the mitigation program portfolio: circuits, stations, customer records, work packages and plan filings."
    identity: opaque
    exclusive_operations:
      - "POST /circuits"
      - "POST /mitigation-projects"
      - "POST /mitigation-projects/{id}/submit"
      - "POST /plan-filings"
      - "POST /plan-filings/{id}/submit"
    shared_operations:
      - "POST /weather-stations (with MeteorologyAnalyst)"
      - "POST /customers (with CommunityLiaison)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: MeteorologyAnalyst
    description: "Runs the weather desk: files telemetry, computes fire potential indices, and is the only role that may declare the damaging-weather window over."
    identity: opaque
    exclusive_operations:
      - "POST /weather-observations"
      - "POST /fire-potential-indices"
      - "POST /psps-events/{id}/all-clear"
    shared_operations:
      - "POST /weather-stations (with GridPlanner)"
      - "GET reads on circuits, stations, observations, indices and events"
      - "POST /_clock/set_current_utc"

  - name: PSPSDutyOfficer
    description: "Holds switching authority: opens events, determines scope, arms, de-energizes, activates resource centers, re-energizes cleared circuits, closes and cancels."
    identity: opaque
    exclusive_operations:
      - "POST /psps-events"
      - "POST /psps-events/{id}/scope"
      - "POST /psps-events/{id}/arm"
      - "POST /psps-events/{id}/de-energize"
      - "POST /psps-events/{id}/close"
      - "POST /psps-events/{id}/cancel"
      - "POST /psps-events/{id}/activate-resource-centers"
      - "POST /circuits/{id}/re-energize"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: CommunityLiaison
    description: "Owns customer communication and community resource centers: notification profiles, batch planning, dispatch and site registration."
    identity: opaque
    exclusive_operations:
      - "POST /notification-batches"
      - "POST /notification-batches/{id}/dispatch"
      - "POST /community-resource-centers"
    shared_operations:
      - "POST /customers (with GridPlanner)"
      - "GET reads on circuits, customers, events, scopes, batches, records and resource centers"
      - "POST /_clock/set_current_utc"

  - name: RegulatoryReviewer
    description: "The regulator-side reviewer. Decides mitigation projects and plan-filing tracks, and is subject to every segregation-of-duties gate in the scaffold."
    identity: opaque
    exclusive_operations:
      - "POST /mitigation-projects/{id}/review"
      - "POST /plan-filings/{id}/reviews"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"

  - name: FieldPatrolSupervisor
    description: "Runs post-event patrols and damage assessment. Cannot re-energize what its own crew lead cleared."
    identity: opaque
    exclusive_operations:
      - "POST /patrol-assignments"
      - "POST /patrol-assignments/{id}/start"
      - "POST /patrol-assignments/{id}/complete"
      - "POST /damage-findings"
    shared_operations:
      - "GET reads on circuits, events, scopes, patrol assignments and damage findings"
      - "POST /_clock/set_current_utc"

  - name: AssetInspector
    description: "Records executed mitigation mileage and inspection completions against approved work packages."
    identity: opaque
    exclusive_operations:
      - "POST /mitigation-projects/{id}/record-completion"
    shared_operations:
      - "GET reads on circuits, stations, observations, indices, mitigation projects, damage findings and filings"
      - "POST /_clock/set_current_utc"

  - name: TransmissionEngineer
    description: "Reviews the determined scope and is the only role that may hold a circuit out of a scoped or armed event."
    identity: opaque
    exclusive_operations:
      - "POST /event-scopes/{id}/exclude"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
