  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_request_review_cycle
        grounds:
          - state_machines.BenefitApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.BenefitApplication.INFO_REQUESTED_to_UNDER_REVIEW
          - state_machines.BenefitApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          BenefitApplication has a non-linear review cycle: UNDER_REVIEW ->
          INFO_REQUESTED -> UNDER_REVIEW (resume via start-review) -> APPROVED,
          looping back rather than following a one-way pipeline.
        test_recipe:
          setup:
            - "INITIAL application submitted (dob 1960-05-05, income 500000) and moved to UNDER_REVIEW by spec-1"
            - "PROOF_OF_AGE document verified by spec-1"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Cycla Review", date_of_birth: "1960-05-05", annual_income_cents: 500000, residency_address: "6 Cedar St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "C-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/request-info", payload: { reason: "need income and residency documents" }, as: EligibilitySpecialist, as_user_id: "spec-1", captures: { st_info: $.data.status } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "C-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1", captures: { st_back: $.data.status } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "C-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { st_final: $.data.status, ch_id: $.data.cardholder_id } }
          assert:
            - "after request-info: status == INFO_REQUESTED and info_request_reason == 'need income and residency documents'"
            - "document upload while INFO_REQUESTED succeeds (201)"
            - "start-review resumes INFO_REQUESTED -> UNDER_REVIEW (cycle closed)"
            - "after approve: status == APPROVED and cardholder_id is non-null — the loop did not corrupt the approval path"

      - name: cardholder_recertification_cycle
        grounds:
          - state_machines.Cardholder.ACTIVE_to_RECERTIFICATION_DUE
          - state_machines.Cardholder.RECERTIFICATION_DUE_to_ACTIVE
          - calculations.age_years_at_clock
        distinguishing_aspect: |
          Cardholder has a non-linear annual cycle (different entity from
          BenefitApplication): ACTIVE -> RECERTIFICATION_DUE when the clock reaches
          due_date - 60 days (2027-06-02), then back to ACTIVE on recertification
          approval with recertification_due_date recomputed to 2028-06-01
          (2027-06-02 + 365 days).
        test_recipe:
          setup:
            - "Cardholder onboarded at default clock 2026-08-01 (dob 1961-08-01, income 1000000): ACTIVE, recertification_due_date 2027-08-01"
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Reena Cert", date_of_birth: "1961-08-01", annual_income_cents: 1000000, residency_address: "7 Walnut St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "RC-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "RC-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "RC-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { due0: $.data.recertification_due_date, st0: $.data.status } }
          trigger:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { st_due: $.data.status } }
            - { call: "POST /senior-benefits/applications", payload: { kind: RECERTIFICATION, applicant_full_name: "Reena Cert", date_of_birth: "1961-08-01", annual_income_cents: 1500000, residency_address: "7 Walnut St", cardholder_id: "${ch_id}" }, as: Cardholder, as_user_id: "${ch_id}", captures: { rapp: $.data.id } }
            - { call: "POST /senior-benefits/applications/${rapp}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-2" }
            - { call: "POST /senior-benefits/applications/${rapp}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "RC2-AGE" }, as: Cardholder, as_user_id: "${ch_id}", captures: { rdoc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${rapp}/documents/${rdoc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-2" }
            - { call: "POST /senior-benefits/applications/${rapp}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "RC2-INC" }, as: Cardholder, as_user_id: "${ch_id}", captures: { rdoc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${rapp}/documents/${rdoc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-2" }
            - { call: "POST /senior-benefits/applications/${rapp}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "RC2-RES" }, as: Cardholder, as_user_id: "${ch_id}", captures: { rdoc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${rapp}/documents/${rdoc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-2" }
            - { call: "POST /senior-benefits/applications/${rapp}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1" }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { st_final: $.data.status, due1: $.data.recertification_due_date, inc1: $.data.annual_income_cents } }
