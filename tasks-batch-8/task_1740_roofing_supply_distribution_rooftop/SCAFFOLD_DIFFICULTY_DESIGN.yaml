              payload: { job_name: "Job V", site_address: "7 Ash St" }
              as: CreditAnalyst
              captures: { ja_v1: $.data.id }
            - call: "POST /roofing/job-accounts/${ja_v1}/takeoffs"
              payload: { product_id: "${prod_v1}", roof_squares: 10.0, waste_factor_pct: 0, valley_ridge_linear_feet: 0  }
              as: SalesRep
              captures: { tk_v1: $.data.id }
            - call: "POST /roofing/takeoffs/${tk_v1}/quote"
              payload: {}
              as: SalesRep
            - call: "POST /roofing/takeoffs/${tk_v1}/convert"
              payload: { branch_id: "${br_v1}" }
              as: Contractor
              as_user_id: "${ca_v1}"
              captures: { ord_v1: $.data.id }
            - call: "GET /roofing/contractor-accounts/${ca_v1}"
              payload: {}
              as: CreditAnalyst
              captures: { ca_v1_v: $.data.version }
            - call: "POST /roofing/orders/${ord_v1}/confirm"
              payload: { expected_contractor_account_version: "${ca_v1_v}" }
