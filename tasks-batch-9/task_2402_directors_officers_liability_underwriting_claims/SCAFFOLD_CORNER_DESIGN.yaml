            - "GET /dno/claims/${claim_id} still reads status == \"DEFENSE_ADVANCING\" and the policy still reports open_claim_count == 1: expiry of the period does not close an open claim"
      - name: state_machine_cyclic_counter_loop
        claim_type: cyclic
        grounds:
          - state_machines.ExclusionTerm.transitions.COUNTERED_to_PROPOSED
          - state_machines.ExclusionTerm.transitions.COUNTERED_to_IMPASSE
        excluded_because:
          difficulty_instance: non_linear_state_machine / exclusion_term_counter_cycle_to_impasse
          rationale: "The full PROPOSED/COUNTERED loop, the round_count accumulation and the MAX_NEGOTIATION_ROUNDS exit into IMPASSE are asserted round-by-round by the named §1.8 instance."
      - name: bind_cascade_down_to_children
        claim_type: cascade_down
        grounds:
          - state_machines.Policy.transitions.None_to_INCEPTED
          - endpoints[POST /dno/quotes/{id}/accept]
        excluded_because:
          difficulty_instance: transitive_cascade / bind_cascade_policy_parts_insured_capacity
          rationale: "The bind cascade into Quote, Submission, three CoverageParts and the grandparent Insured's capacity ledger is walked hop-by-hop by the named §1.8 instance."
      - name: erosion_ledger_sync_to_policy_and_layers
        claim_type: ledger_sync
