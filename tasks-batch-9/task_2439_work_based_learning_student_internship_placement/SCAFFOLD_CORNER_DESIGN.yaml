              as: WblCoordinator
              captures: { ws_a: $.data.id, ws_a_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_a}", machinery_guarding_ok: true, hazard_findings_count: 1, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_a_v1}" }
              as: SafetyReviewer
              captures: { rev_a: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_a}/decision"
