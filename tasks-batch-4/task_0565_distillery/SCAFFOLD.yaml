# =============================================================================
# Distillery & Spirits Production (DSP/TTB) — benchmark seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  565. Distillery & Spirits Production (DSP/TTB): mash/distillation batch & proof
  gallons, barrel/aging inventory & angel's share, bottling run & lot/label (COLA),
  tasting-room POS & cocktail, federal excise (TTB) & state reporting,
  club/allocation release, self-distribution & three-tier, tour booking

domain_name: distillery-dsp
api_prefix: /dsp

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # Flat peer collections under /dsp/<collection>; FK links in bodies, no URL nesting.
  state_machine_shape: parallel
  # SalesOrder carries independent payment_status × fulfillment_status axes;
  # LabelApplication is cyclic (NEEDS_CORRECTION -> SUBMITTED); others linear/compound.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  # ProductionManager / ComplianceOfficer / SalesManager / TastingRoomStaff own
  # disjoint resource types; Customer is entity_backed and acts only on own rows.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Distillery
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Registered DSP name" }
      - { name: dsp_permit_number, type: string, source: input, description: "TTB basic permit / registry number" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of the bonded premises" }
      - { name: total_gauged_pg, type: number, source: computed, description: "Cumulative proof gallons ever gauged into bond (never decreases); conservation anchor", default: 0 }
      - { name: production_account_pg, type: number, source: computed, description: "Proof gallons in the production account: gauged spirits not yet barreled", default: 0 }
      - { name: storage_account_pg, type: number, source: computed, description: "Proof gallons in the storage account: filled into barrels and aging", default: 0 }
      - { name: processing_account_pg, type: number, source: computed, description: "Proof gallons in the processing account: bottled, in bond, not yet removed", default: 0 }
      - { name: removed_pg, type: number, source: computed, description: "Cumulative proof gallons removed from bond (all reasons)", default: 0 }
      - { name: angel_share_losses_pg, type: number, source: computed, description: "Cumulative proof gallons lost to angel's share (evaporation), realized at barrel draw/dump", default: 0 }
      - { name: bottling_losses_pg, type: number, source: computed, description: "Cumulative proof gallons lost in bottling (draw minus bottled)", default: 0 }
      - { name: destroyed_losses_pg, type: number, source: computed, description: "Cumulative proof gallons written off by barrel destruction", default: 0 }
      - { name: bonded_total_pg, type: number, source: computed, description: "production_account_pg + storage_account_pg + processing_account_pg (proof gallons still under bond)", default: 0 }
      - { name: cbma_pg_removed_ytd, type: number, source: computed, description: "Taxpaid proof gallons removed in the current calendar year (drives CBMA reduced-rate tier)", default: 0 }
      - { name: cbma_rate_tier, type: enum, source: computed, description: "REDUCED while cbma_pg_removed_ytd < 100000, else STANDARD", default: REDUCED, constraints: "REDUCED | STANDARD" }
      - { name: club_release_active, type: boolean, source: system, description: "True while a club allocation release window is open; gates CLUB SalesOrders", default: false }

  - name: MashBatch
    parent: null
    common_fields: true
    fields:
      - { name: distillery_id, type: string, source: input, description: "FK -> Distillery.id" }
      - { name: grain_bill, type: string, source: input, description: "Mash recipe descriptor" }
      - { name: volume_gallons, type: number, source: input, description: "Wash volume produced by fermentation (wine gallons)" }
      - { name: status, type: enum, source: system, description: "FERMENTING -> DISTILLED -> ARCHIVED; or DUMPED", default: FERMENTING, constraints: "FERMENTING | DISTILLED | ARCHIVED | DUMPED" }

  - name: DistillationRun
    parent: null
    common_fields: true
    fields:
      - { name: distillery_id, type: string, source: input, description: "FK -> Distillery.id" }
      - { name: mash_batch_id, type: string, source: input, description: "FK -> MashBatch.id" }
      - { name: spirit_type, type: enum, source: input, description: "WHISKEY | GIN | VODKA | RUM | BRANDY" }
      - { name: gauge_method, type: enum, source: input, description: "Selects the gauging variant applied at GAUGE: VOLUME | WEIGHT" }
      - { name: collected_wine_gallons, type: number, source: input, description: "Volume of spirits collected (wine gallons); used by the VOLUME gauge variant" }
      - { name: collected_proof, type: number, source: input, description: "Proof of collected spirits (2x ABV%)" }
      - { name: collected_weight_lbs, type: number, source: input, description: "Net weight of spirits collected (lbs); used by the WEIGHT gauge variant" }
      - { name: proof_gallons, type: number, source: computed, description: "Proof gallons determined at gauge, per gauge_method; rounded to 0.1", default: 0 }
      - { name: remaining_proof_gallons, type: number, source: computed, description: "proof_gallons minus proof gallons already filled into barrels from this run", default: 0 }
      - { name: open_barrel_count, type: integer, source: computed, description: "Count of barrels from this run still AGING (not EMPTIED/DESTROYED)", default: 0 }
      - { name: status, type: enum, source: system, description: "DISTILLING -> GAUGED -> CLOSED", default: DISTILLING, constraints: "DISTILLING | GAUGED | CLOSED" }

  - name: Barrel
    parent: null
    common_fields: true
    fields:
      - { name: distillation_run_id, type: string, source: input, description: "FK -> DistillationRun.id" }
      - { name: distillery_id, type: string, source: system, description: "FK -> Distillery.id" }
      - { name: char_level, type: enum, source: input, description: "CHAR_1 | CHAR_2 | CHAR_3 | CHAR_4" }
      - { name: rickhouse_position, type: string, source: input, description: "Warehouse rick position label" }
      - { name: fill_proof_gallons, type: number, source: input, description: "Proof gallons filled into this barrel (drawn from the run's remaining_proof_gallons)" }
      - { name: fill_date, type: datetime, source: system, description: "Logical clock at fill; angel's share accrues from this instant" }
      - { name: angel_share_pg, type: number, source: computed, description: "Proof gallons lost to angel's share between fill_date and now; rounded to 0.1", default: 0 }
      - { name: current_proof_gallons, type: number, source: computed, description: "max(0, fill_proof_gallons - angel_share_pg)", default: 0 }
      - { name: status, type: enum, source: system, description: "AGING -> EMPTIED (via bottling draw); or DESTROYED (via dump)", default: AGING, constraints: "AGING | EMPTIED | DESTROYED" }

  - name: LabelApplication
    parent: null
    common_fields: true
    fields:
      - { name: distillery_id, type: string, source: input, description: "FK -> Distillery.id" }
      - { name: brand_name, type: string, source: input, description: "Brand/fanciful name on the label" }
      - { name: spirit_type, type: enum, source: input, description: "WHISKEY | GIN | VODKA | RUM | BRANDY" }
      - { name: label_proof, type: number, source: input, description: "Proof stated on the label; used for bottling proof-gallon computation" }
      - { name: net_contents_ml, type: number, source: input, description: "Bottle net contents in mL (e.g. 750)" }
      - { name: ttb_id, type: string, source: system, description: "TTB COLA id assigned on APPROVED", default: null }
      - { name: correction_notes, type: string, source: system, description: "Reviewer notes recorded on NEEDS_CORRECTION", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | NEEDS_CORRECTION; NEEDS_CORRECTION -> SUBMITTED (resubmit loop)", default: DRAFT, constraints: "DRAFT | SUBMITTED | NEEDS_CORRECTION | APPROVED" }

  - name: BottlingRun
    parent: null
    common_fields: true
    fields:
      - { name: barrel_id, type: string, source: input, description: "FK -> Barrel.id (source barrel drawn at completion)" }
      - { name: label_application_id, type: string, source: input, description: "FK -> LabelApplication.id (must be APPROVED to start)" }
      - { name: distillery_id, type: string, source: system, description: "FK -> Distillery.id" }
      - { name: line_id, type: enum, source: input, description: "Bottling line resource: LINE_A | LINE_B" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start on line_id" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end on line_id (exclusive)" }
      - { name: bottle_size_ml, type: number, source: input, description: "Bottle size in mL" }
      - { name: bottles_per_case, type: integer, source: input, description: "Bottles per case" }
      - { name: planned_cases, type: integer, source: input, description: "Cases planned/produced by this run" }
      - { name: draw_proof_gallons, type: number, source: computed, description: "Barrel.current_proof_gallons drawn at COMPLETE", default: 0 }
      - { name: bottled_proof_gallons, type: number, source: computed, description: "Proof gallons bottled (sum-then-round; see bottling_proof_gallons calc)", default: 0 }
      - { name: bottling_loss_pg, type: number, source: computed, description: "draw_proof_gallons - bottled_proof_gallons (>= 0)", default: 0 }
      - { name: cases_bottled, type: integer, source: computed, description: "Cases produced at COMPLETE (equals planned_cases)", default: 0 }
      - { name: cases_available, type: integer, source: computed, description: "Cases on hand not reserved/shipped/removed", default: 0 }
      - { name: cases_reserved, type: integer, source: computed, description: "Cases reserved by ALLOCATED sales orders", default: 0 }
      - { name: cases_shipped, type: integer, source: computed, description: "Cases shipped out via SHIPPED sales orders", default: 0 }
      - { name: cases_removed, type: integer, source: computed, description: "Cases removed from bond via TaxRemoval", default: 0 }
      - { name: tax_status, type: enum, source: computed, description: "IN_BOND until a TAXPAID TaxRemoval exists for this run, then TAX_DETERMINED", default: IN_BOND, constraints: "IN_BOND | TAX_DETERMINED" }
      - { name: inventory_status, type: enum, source: computed, description: "IN_STOCK while cases_available > 0, else SOLD_OUT", default: IN_STOCK, constraints: "IN_STOCK | SOLD_OUT" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> BOTTLING -> COMPLETED | CANCELLED", default: SCHEDULED, constraints: "SCHEDULED | BOTTLING | COMPLETED | CANCELLED" }

  - name: TaxRemoval
    parent: null
    common_fields: true
    fields:
      - { name: bottling_run_id, type: string, source: input, description: "FK -> BottlingRun.id" }
      - { name: distillery_id, type: string, source: system, description: "FK -> Distillery.id" }
      - { name: removal_reason, type: enum, source: input, description: "TAXPAID (excise due) | TRANSFER_IN_BOND (no tax) | EXPORT (no tax)" }
      - { name: removed_cases, type: integer, source: input, description: "Cases removed from the run" }
      - { name: removed_proof_gallons, type: number, source: computed, description: "Proof gallons removed = per-case pg x removed_cases (rounded 0.1)", default: 0 }
      - { name: reduced_rate_pg, type: number, source: computed, description: "Portion of removed_proof_gallons taxed at the CBMA reduced rate", default: 0 }
      - { name: standard_rate_pg, type: number, source: computed, description: "Portion of removed_proof_gallons taxed at the standard rate", default: 0 }
      - { name: excise_tax_due_cents, type: integer, source: computed, description: "Final excise tax in cents (0 for non-TAXPAID reasons)", default: 0 }
      - { name: removal_date, type: datetime, source: system, description: "Logical clock at removal (determines calendar-year CBMA bucket)" }
      - { name: status, type: enum, source: system, description: "DETERMINED (created final)", default: DETERMINED, constraints: "DETERMINED" }

  - name: ExciseReport
    parent: null
    common_fields: true
    fields:
      - { name: distillery_id, type: string, source: input, description: "FK -> Distillery.id" }
      - { name: period_month, type: string, source: input, description: "Reporting period YYYY-MM (TTB monthly excise return)" }
      - { name: expected_distillery_version, type: integer, source: input, description: "OCC guard: Distillery.version the client last observed" }
      - { name: total_removed_pg, type: number, source: computed, description: "Sum of removed_proof_gallons for TAXPAID TaxRemovals whose removal_date falls in period_month", default: 0 }
      - { name: total_excise_due_cents, type: integer, source: computed, description: "Sum of excise_tax_due_cents for those TaxRemovals", default: 0 }
      - { name: supersedes_report_id, type: string, source: computed, description: "Id of the prior FILED report for the same period that this filing superseded, if any", default: null }
      - { name: status, type: enum, source: system, description: "FILED on create; SUPERSEDED when a later filing for the same period replaces it", default: FILED, constraints: "FILED | SUPERSEDED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Customer email (login identity)" }
      - { name: state_code, type: string, source: input, description: "Ship-to state (three-tier legality)" }
      - { name: club_tier, type: enum, source: input, description: "NONE | SILVER | GOLD | RESERVE (CLUB allocation eligibility)", default: NONE, constraints: "NONE | SILVER | GOLD | RESERVE" }
      - { name: age_verified, type: boolean, source: input, description: "Whether 21+ age verification passed", default: false }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: bottling_run_id, type: string, source: input, description: "FK -> BottlingRun.id (finished-goods source)" }
      - { name: distillery_id, type: string, source: system, description: "FK -> Distillery.id" }
      - { name: channel, type: enum, source: input, description: "THREE_TIER | SELF_DISTRIBUTION | TASTING_ROOM | CLUB" }
      - { name: cases, type: integer, source: input, description: "Cases ordered" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per case in cents" }
      - { name: includes_cocktail, type: boolean, source: input, description: "Tasting-room cocktail add-on flag", default: false }
      - { name: subtotal_cents, type: integer, source: computed, description: "unit_price_cents x cases", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal plus cocktail surcharge (see order_pricing calc)", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "Payment axis: UNPAID -> PAID -> REFUNDED", default: UNPAID, constraints: "UNPAID | PAID | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment axis: PENDING -> ALLOCATED -> SHIPPED | CANCELLED", default: PENDING, constraints: "PENDING | ALLOCATED | SHIPPED | CANCELLED" }

  - name: TourBooking
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: distillery_id, type: string, source: input, description: "FK -> Distillery.id" }
      - { name: start_time, type: datetime, source: input, description: "Tour start (tasting-room resource)" }
      - { name: end_time, type: datetime, source: input, description: "Tour end (exclusive)" }
      - { name: party_size, type: integer, source: input, description: "Number of guests (tasting-room capacity)" }
      - { name: includes_tasting, type: boolean, source: input, description: "Whether a tasting flight is included", default: false }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> CANCELLED", default: REQUESTED, constraints: "REQUESTED | CONFIRMED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MashBatch
    initial_state: FERMENTING
    terminal_states: [ARCHIVED, DUMPED]
    transitions:
      - from: FERMENTING
        to: DISTILLED
        trigger: "POST /dsp/distillation-runs/{id}/gauge (a run against this batch reaches GAUGED)"
        actor: system
        preconditions: ["MashBatch.status == FERMENTING"]
        side_effects: ["MashBatch.status -> DISTILLED"]
        note: "Cross-entity bubble from DistillationRun gauge."
      - from: FERMENTING
        to: DUMPED
        trigger: "POST /dsp/mash-batches/{id}/dump"
        actor: ProductionManager
        preconditions: ["MashBatch.status == FERMENTING"]
        side_effects: ["MashBatch.status -> DUMPED"]
      - from: DISTILLED
        to: ARCHIVED
        trigger: "system: the batch's DistillationRun reaches CLOSED (cascade from bottling completion)"
        actor: system
        preconditions: ["MashBatch.status == DISTILLED", "the run referencing this batch is CLOSED"]
        side_effects: ["MashBatch.status -> ARCHIVED"]
        note: "Cascade A hop 4: BottlingRun COMPLETE -> Barrel EMPTIED -> DistillationRun CLOSED -> MashBatch ARCHIVED."

  - entity: DistillationRun
    initial_state: DISTILLING
    terminal_states: [CLOSED]
    transitions:
      - from: DISTILLING
        to: GAUGED
        trigger: "POST /dsp/distillation-runs/{id}/gauge"
        actor: ProductionManager
        preconditions:
          - "DistillationRun.status == DISTILLING"
          - "referenced MashBatch.status == FERMENTING (ERR_MASH_NOT_AVAILABLE)"
          - "for gauge_method == WEIGHT, collected_weight_lbs > 0 (ERR_VALIDATION)"
        side_effects:
          - "proof_gallons computed via gauge_method (proof_gallons_gauge calc); remaining_proof_gallons = proof_gallons"
          - "Distillery.total_gauged_pg += proof_gallons; Distillery.production_account_pg += proof_gallons; Distillery.bonded_total_pg recomputed (proof_gallon_ledger)"
          - "referenced MashBatch FERMENTING -> DISTILLED"
      - from: GAUGED
        to: CLOSED
        trigger: "system: last open barrel from this run reaches EMPTIED or DESTROYED (open_barrel_count hits 0 with >=1 barrel ever filled)"
        actor: system
        preconditions: ["DistillationRun.status == GAUGED", "open_barrel_count == 0", "at least one Barrel was filled from this run"]
        side_effects:
          - "DistillationRun.status -> CLOSED"
          - "referenced MashBatch DISTILLED -> ARCHIVED (cascade A hop 4)"

  - entity: Barrel
    initial_state: AGING
    terminal_states: [EMPTIED, DESTROYED]
    transitions:
      - from: AGING
        to: EMPTIED
        trigger: "system: a BottlingRun drawing this barrel reaches COMPLETED and current_proof_gallons is fully drawn"
        actor: system
        preconditions: ["Barrel.status == AGING"]
        side_effects:
          - "angel_share_pg realized to Distillery.angel_share_losses_pg; Distillery.storage_account_pg -= current_proof_gallons + angel_share_pg (both leave storage)"
          - "DistillationRun.open_barrel_count -= 1 (cascade A hop 3)"
          - "if run.open_barrel_count == 0: DistillationRun GAUGED -> CLOSED (cascade A hop 3->4)"
        note: "Cascade A hop 2 (BottlingRun COMPLETE -> Barrel EMPTIED)."
      - from: AGING
        to: DESTROYED
        trigger: "POST /dsp/barrels/{id}/dump"
        actor: ProductionManager
        preconditions: ["Barrel.status == AGING"]
        side_effects:
          - "angel_share_pg realized to Distillery.angel_share_losses_pg"
          - "Distillery.storage_account_pg -= (current_proof_gallons + angel_share_pg); Distillery.destroyed_losses_pg += current_proof_gallons"
          - "DistillationRun.open_barrel_count -= 1; if 0 and run GAUGED: DistillationRun -> CLOSED -> MashBatch ARCHIVED"
        note: "Compensation for barrel fill (proof-gallon conservation, invariant #1)."

  - entity: LabelApplication
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dsp/label-applications/{id}/submit"
        actor: ComplianceOfficer
        preconditions: ["LabelApplication.status == DRAFT"]
        side_effects: ["status -> SUBMITTED"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dsp/label-applications/{id}/decide (outcome=APPROVE)"
        actor: ComplianceOfficer
        preconditions: ["LabelApplication.status == SUBMITTED"]
        side_effects: ["status -> APPROVED", "ttb_id assigned"]
      - from: SUBMITTED
        to: NEEDS_CORRECTION
        trigger: "POST /dsp/label-applications/{id}/decide (outcome=RETURN)"
        actor: ComplianceOfficer
        preconditions: ["LabelApplication.status == SUBMITTED"]
        side_effects: ["status -> NEEDS_CORRECTION", "correction_notes recorded"]
      - from: NEEDS_CORRECTION
        to: SUBMITTED
        trigger: "POST /dsp/label-applications/{id}/resubmit"
        actor: ComplianceOfficer
        preconditions: ["LabelApplication.status == NEEDS_CORRECTION"]
        side_effects: ["status -> SUBMITTED", "correction_notes cleared"]
        note: "Cyclic revision loop (NEEDS_CORRECTION -> SUBMITTED) — non-linear shape #1."

  - entity: BottlingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BOTTLING
        trigger: "POST /dsp/bottling-runs/{id}/start"
        actor: ProductionManager
        preconditions:
          - "BottlingRun.status == SCHEDULED (ERR_INVALID_STATE)"
          - "referenced LabelApplication.status == APPROVED (ERR_LABEL_NOT_APPROVED) [cross-entity dep #1]"
          - "referenced Barrel.status == AGING (ERR_BARREL_NOT_AGING)"
        side_effects: ["status -> BOTTLING"]
      - from: BOTTLING
        to: COMPLETED
        trigger: "POST /dsp/bottling-runs/{id}/complete"
        actor: ProductionManager
        preconditions:
          - "BottlingRun.status == BOTTLING"
          - "Barrel.current_proof_gallons >= bottled_proof_gallons (ERR_INSUFFICIENT_PROOF_GALLONS)"
        side_effects:
          - "bottled_proof_gallons computed (bottling_proof_gallons calc); draw_proof_gallons = Barrel.current_proof_gallons; bottling_loss_pg = draw - bottled"
          - "cases_bottled = planned_cases; cases_available = planned_cases; inventory_status = IN_STOCK; tax_status = IN_BOND"
          - "Distillery.storage_account_pg -= draw_proof_gallons; Distillery.processing_account_pg += bottled_proof_gallons; Distillery.bottling_losses_pg += bottling_loss_pg"
          - "Barrel AGING -> EMPTIED (cascade A hop 2)"
        note: "Cascade A origin (hop 1). Chain: BottlingRun->Barrel->DistillationRun->MashBatch."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /dsp/bottling-runs/{id}/cancel"
        actor: ProductionManager
        preconditions: ["BottlingRun.status == SCHEDULED"]
        side_effects: ["status -> CANCELLED"]

  - entity: SalesOrder
    initial_state: "payment=UNPAID; fulfillment=PENDING"
    terminal_states: ["fulfillment in {SHIPPED, CANCELLED}"]
    note: "Parallel dimensions — payment_status and fulfillment_status evolve independently (non-linear shape #2)."
    transitions:
      - from: "payment=UNPAID"
        to: "payment=PAID"
        trigger: "POST /dsp/sales-orders/{id}/pay"
        actor: "SalesManager | Customer(owner)"
        preconditions:
          - "SalesOrder.payment_status == UNPAID"
          - "SalesOrder.fulfillment_status == PENDING (ERR_INVALID_STATE)"
          - "Customer.age_verified == true (ERR_AGE_NOT_VERIFIED) [business_safety]"
          - "BottlingRun.cases_available >= cases (ERR_INSUFFICIENT_INVENTORY)"
          - "if channel == CLUB: Distillery.club_release_active == true AND Customer.club_tier != NONE (ERR_CLUB_NOT_ELIGIBLE)"
        side_effects:
          - "payment_status -> PAID; fulfillment_status PENDING -> ALLOCATED"
          - "BottlingRun.cases_available -= cases; BottlingRun.cases_reserved += cases"
          - "if BottlingRun.cases_available == 0: inventory_status -> SOLD_OUT"
      - from: "fulfillment=ALLOCATED"
        to: "fulfillment=SHIPPED"
        trigger: "POST /dsp/sales-orders/{id}/ship"
        actor: SalesManager
        preconditions:
          - "SalesOrder.fulfillment_status == ALLOCATED"
          - "SalesOrder.payment_status == PAID"
          - "channel == SELF_DISTRIBUTION OR channel == TASTING_ROOM OR BottlingRun.tax_status == TAX_DETERMINED (ERR_NOT_TAX_DETERMINED) [cross-entity dep #2]"
        side_effects:
          - "fulfillment_status -> SHIPPED"
          - "BottlingRun.cases_reserved -= cases; BottlingRun.cases_shipped += cases"
      - from: "fulfillment in {PENDING, ALLOCATED}"
        to: "fulfillment=CANCELLED"
        trigger: "POST /dsp/sales-orders/{id}/cancel"
        actor: "SalesManager | Customer(owner)"
        preconditions: ["SalesOrder.fulfillment_status IN {PENDING, ALLOCATED}"]
        side_effects:
          - "fulfillment_status -> CANCELLED"
          - "if was ALLOCATED: BottlingRun.cases_reserved -= cases; BottlingRun.cases_available += cases; if cases_available > 0: inventory_status -> IN_STOCK"
        note: "Compensation for pay/allocate (case-inventory conservation, invariant #2)."
      - from: "payment=PAID"
        to: "payment=REFUNDED"
        trigger: "POST /dsp/sales-orders/{id}/refund"
        actor: SalesManager
        preconditions:
          - "SalesOrder.payment_status == PAID"
          - "SalesOrder.fulfillment_status == CANCELLED (ERR_INVALID_STATE)"
        side_effects: ["payment_status -> REFUNDED"]

  - entity: TourBooking
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /dsp/tour-bookings/{id}/confirm"
        actor: TastingRoomStaff
        preconditions:
          - "TourBooking.status == REQUESTED"
          - "no CONFIRMED tour at same distillery starts within TOUR_BUFFER_MINUTES of this tour's start_time (ERR_TOUR_OVERLAP) [temporal]"
          - "sum of party_size over CONFIRMED tours overlapping [start_time, end_time) + this party_size <= TASTING_ROOM_CAPACITY (ERR_TOUR_CAPACITY) [constraint]"
        side_effects: ["status -> CONFIRMED"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /dsp/tour-bookings/{id}/cancel"
        actor: "TastingRoomStaff | Customer(owner)"
        preconditions: ["TourBooking.status == REQUESTED"]
        side_effects: ["status -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /dsp/tour-bookings/{id}/cancel"
        actor: "TastingRoomStaff | Customer(owner)"
        preconditions: ["TourBooking.status == CONFIRMED"]
        side_effects: ["status -> CANCELLED", "frees tasting-room capacity for overlapping windows"]

  - entity: ExciseReport
    initial_state: FILED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: FILED
        to: SUPERSEDED
        trigger: "system: a later ExciseReport is filed for the same distillery_id + period_month"
        actor: system
        preconditions: ["ExciseReport.status == FILED"]
        side_effects: ["status -> SUPERSEDED", "the new report's supersedes_report_id references this report's id"]
        note: "CREATE-with-supersede; the create is OCC-guarded on Distillery.version (see concurrency_rules)."

  - entity: TaxRemoval
    initial_state: DETERMINED
    terminal_states: [DETERMINED]
    transitions:
      - from: "(none)"
        to: DETERMINED
        trigger: "POST /dsp/tax-removals"
        actor: ComplianceOfficer
        preconditions:
          - "BottlingRun.status == COMPLETED"
          - "BottlingRun.cases_available >= removed_cases (ERR_INSUFFICIENT_INVENTORY) [constraint]"
          - "for TAXPAID: Distillery.bonded_total_pg >= removed_proof_gallons (ERR_INSUFFICIENT_BONDED_PG) [fiscal]"
        side_effects:
          - "removed_proof_gallons + excise split computed (excise_tax calc); excise_tax_due_cents set"
          - "BottlingRun.cases_available -= removed_cases; BottlingRun.cases_removed += removed_cases; if cases_available == 0: inventory_status -> SOLD_OUT"
          - "if TAXPAID: BottlingRun.tax_status -> TAX_DETERMINED; Distillery.processing_account_pg -= removed_proof_gallons; Distillery.removed_pg += removed_proof_gallons; Distillery.cbma_pg_removed_ytd += removed_proof_gallons; Distillery.cbma_rate_tier recomputed; Distillery.bonded_total_pg recomputed"
          - "cascade B: if BottlingRun.inventory_status becomes SOLD_OUT, every SalesOrder on this run with fulfillment_status == PENDING is auto-CANCELLED (cascade B hop 2)"
        note: "Cascade B origin: TaxRemoval -> BottlingRun (inventory) -> SalesOrder (auto-cancel). Depth 3."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: excise-report-supersede-stale-distillery
    parent_entity: Distillery
    write_endpoint: "POST /dsp/excise-reports"
    occ_field: "expected_distillery_version"
    description: |
      Filing an ExciseReport for a distillery whose version has advanced since the
      client last observed it is rejected. Filing a report snapshots the distillery's
      removal ledger and legitimately supersedes the prior FILED report for the same
      period; a filing that carries a stale expected_distillery_version reflects a view
      taken before another removal or filing mutated the ledger, so the snapshot would
      be wrong and the filing is refused on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: proof_gallons_gauge
    trigger: "DistillationRun DISTILLING -> GAUGED (POST /dsp/distillation-runs/{id}/gauge)"
    algorithm: forward_looking
    formula: |
      wine_gallons =
        VOLUME method: collected_wine_gallons
        WEIGHT method: collected_weight_lbs / SPECIFIC_WEIGHT_LBS_PER_GALLON
      proof_gallons = round(wine_gallons * (collected_proof / 100), 1)   # nearest 0.1, half_up
    input_set: "The single run being gauged; gauge_method selects the variant."
    constants:
      SPECIFIC_WEIGHT_LBS_PER_GALLON: 7.28
      PROOF_DIVISOR: 100
    precision: "1 decimal place (nearest tenth proof gallon), round_half_up"
    variants:
      - name: volume_gauge
        when: "gauge_method == VOLUME"
        difference: "wine_gallons taken directly from collected_wine_gallons"
      - name: weight_gauge
        when: "gauge_method == WEIGHT"
        difference: "wine_gallons derived from collected_weight_lbs / 7.28; same inputs yield a different proof_gallons than VOLUME"

  - name: angel_share_loss
    trigger: "Barrel current_proof_gallons read; realized at Barrel AGING -> EMPTIED / DESTROYED"
    algorithm: decay_function
    formula: |
      months_aged = whole months elapsed from fill_date to current clock (floor)
      angel_share_pg = round(fill_proof_gallons * ANGEL_SHARE_ANNUAL_RATE * (months_aged / 12), 1)
      current_proof_gallons = max(0, fill_proof_gallons - angel_share_pg)
    input_set: "The single barrel; clock position determines months_aged."
    constants:
      ANGEL_SHARE_ANNUAL_RATE: 0.05
    precision: "1 decimal place, round_half_up; current_proof_gallons floored at 0"

  - name: bottling_proof_gallons
    trigger: "BottlingRun BOTTLING -> COMPLETED (POST /dsp/bottling-runs/{id}/complete)"
    algorithm: aggregation
    formula: |
      total_ml = cases_bottled * bottles_per_case * bottle_size_ml
      wine_gallons = total_ml / ML_PER_GALLON
      bottled_proof_gallons = round(wine_gallons * (label_proof / 100), 1)
      # PINNED ORDER: sum all bottle volume first, convert to wine gallons, THEN round once.
      # Per-line rounding (round each case's pg to 0.1 then sum) is explicitly NOT used.
    input_set: "The single bottling run; label_proof from the referenced LabelApplication."
    constants:
      ML_PER_GALLON: 3785.411784
      PROOF_DIVISOR: 100
    precision: "1 decimal place, round_half_up, single rounding at the end (sum-then-round)"

  - name: excise_tax
    trigger: "POST /dsp/tax-removals (removal_reason == TAXPAID)"
    algorithm: tiered_pricing
    formula: |
      # removed proof gallons are pro-rated from the run's already-computed bottled_proof_gallons
      removed_proof_gallons = round(BottlingRun.bottled_proof_gallons * (removed_cases / BottlingRun.cases_bottled), 1)
      y = Distillery.cbma_pg_removed_ytd            # before this removal
      reduced_rate_pg = max(0, min(removed_proof_gallons, CBMA_TIER_LIMIT_PG - y))
      standard_rate_pg = removed_proof_gallons - reduced_rate_pg
      excise_tax_due_cents = round(reduced_rate_pg * CBMA_REDUCED_RATE_CENTS
                                   + standard_rate_pg * STANDARD_RATE_CENTS)   # half_up to whole cents
      # non-TAXPAID reasons: excise_tax_due_cents = 0, no CBMA consumption.
    input_set: "The removal plus the distillery's current cbma_pg_removed_ytd; TAXPAID only."
    constants:
      CBMA_TIER_LIMIT_PG: 100000
      CBMA_REDUCED_RATE_CENTS: 270      # $2.70 per proof gallon (first 100,000 pg/yr)
      STANDARD_RATE_CENTS: 1350         # $13.50 per proof gallon
      ML_PER_GALLON: 3785.411784
    precision: "proof gallons to 0.1 (half_up); excise to whole cents (half_up)"
    variants:
      - name: final_excise
        when: "computed at TaxRemoval creation from actual removed_cases and the run's bottle spec"
        difference: "authoritative excise recorded on the removal"
      - name: provisional_excise
        when: "estimated earlier for planning from planned_cases at the label_proof before removal"
        difference: "uses planned_cases (not removed_cases) and cbma tier as of planning time; diverges from final when removed_cases != planned_cases or the tier shifts"

  - name: proof_gallon_ledger
    trigger: "gauge, barrel fill, barrel EMPTIED/DESTROYED, bottling complete, tax removal"
    algorithm: aggregation
    formula: |
      bonded_total_pg = production_account_pg + storage_account_pg + processing_account_pg
      # Conservation identity (invariant #1), always holds:
      total_gauged_pg == production_account_pg + storage_account_pg + processing_account_pg
                         + removed_pg + angel_share_losses_pg + bottling_losses_pg + destroyed_losses_pg
      cbma_rate_tier = STANDARD if cbma_pg_removed_ytd >= CBMA_TIER_LIMIT_PG else REDUCED
    input_set: "Distillery-level running accounts; every production/removal event updates exactly the buckets named in its transition side_effects."
    constants:
      CBMA_TIER_LIMIT_PG: 100000
    precision: "proof gallons to 0.1"

  - name: order_pricing
    trigger: "POST /dsp/sales-orders (create)"
    algorithm: aggregation
    formula: |
      subtotal_cents = unit_price_cents * cases
      cocktail_surcharge_cents = COCKTAIL_SURCHARGE_CENTS if includes_cocktail else 0
      total_cents = subtotal_cents + cocktail_surcharge_cents
    input_set: "The single order at creation."
    constants:
      COCKTAIL_SURCHARGE_CENTS: 1200
    precision: "whole cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path ids and required FK ids in body exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: auth
    check: "Customer role may only act on rows it owns (resource.customer_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Customer-invoked sales-order and tour-booking endpoints"
  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values legal; positive quantities where required"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints
  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 7
    category: business_referential
    check: "BottlingRun start requires referenced LabelApplication.status == APPROVED"
    error_id: ERR_LABEL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /dsp/bottling-runs/{id}/start"
  - priority: 8
    category: state
    check: "Barrel referenced by a bottling start must be AGING"
    error_id: ERR_BARREL_NOT_AGING
    http_status: 409
    applies_to: "POST /dsp/bottling-runs/{id}/start"
  - priority: 9
    category: business_referential
    check: "SalesOrder ship in THREE_TIER channel requires BottlingRun.tax_status == TAX_DETERMINED (SELF_DISTRIBUTION/TASTING_ROOM exempt)"
    error_id: ERR_NOT_TAX_DETERMINED
    http_status: 409
    applies_to: "POST /dsp/sales-orders/{id}/ship"
  - priority: 10
    category: business_safety
    check: "Paying an order requires the customer age_verified == true"
    error_id: ERR_AGE_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /dsp/sales-orders/{id}/pay"
  - priority: 11
    category: business_constraint
    check: "CLUB orders require club_release_active == true and Customer.club_tier != NONE"
    error_id: ERR_CLUB_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /dsp/sales-orders/{id}/pay (channel == CLUB)"
  - priority: 12
    category: business_temporal
    check: "No CONFIRMED tour at the distillery starts within TOUR_BUFFER_MINUTES (30) of this tour's start_time"
    error_id: ERR_TOUR_OVERLAP
    http_status: 409
    applies_to: "POST /dsp/tour-bookings/{id}/confirm"
  - priority: 13
    category: business_constraint
    check: "Sum of party_size over CONFIRMED tours overlapping [start_time,end_time) plus this party_size must not exceed TASTING_ROOM_CAPACITY (20)"
    error_id: ERR_TOUR_CAPACITY
    http_status: 409
    applies_to: "POST /dsp/tour-bookings/{id}/confirm"
  - priority: 14
    category: business_temporal
    check: "No SCHEDULED/BOTTLING run on the same line_id has a [scheduled_start,scheduled_end) interval overlapping this run's (adjacency end==start allowed)"
    error_id: ERR_LINE_CONFLICT
    http_status: 409
    applies_to: "POST /dsp/bottling-runs (create)"
  - priority: 15
    category: business_constraint
    check: "Sufficient cases available for pay/allocate and tax removal"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /dsp/sales-orders/{id}/pay, POST /dsp/tax-removals"
  - priority: 16
    category: business_constraint
    check: "Barrel current_proof_gallons must cover bottled_proof_gallons at complete"
    error_id: ERR_INSUFFICIENT_PROOF_GALLONS
    http_status: 409
    applies_to: "POST /dsp/bottling-runs/{id}/complete"
  - priority: 17
    category: business_fiscal
    check: "TAXPAID removal requires Distillery.bonded_total_pg >= removed_proof_gallons"
    error_id: ERR_INSUFFICIENT_BONDED_PG
    http_status: 409
    applies_to: "POST /dsp/tax-removals"
  - priority: 18
    category: state
    check: "OCC: expected_distillery_version must equal Distillery.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dsp/excise-reports"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving ----
  - method: POST
    path: "/dsp/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [ProductionManager, ComplianceOfficer, SalesManager, TastingRoomStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]
  - method: POST
    path: "/dsp/_ledger/set_cbma_ytd"
    description: "Test-driving seed of a distillery's cbma_pg_removed_ytd (reaching the 100,000-pg CBMA tier boundary is otherwise infeasible in a black-box test)."
    roles: [ComplianceOfficer]
    code: 200
    input: [distillery_id, cbma_pg_removed_ytd]
    output: Distillery
    side_effects: ["Distillery.cbma_pg_removed_ytd set; cbma_rate_tier recomputed; Distillery.version += 1"]

  # ---- Distillery ----
  - method: POST
    path: "/dsp/distilleries"
    description: "Register a DSP"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, dsp_permit_number, state_code]
    output: Distillery
    side_effects: ["all pg accounts initialized to 0; cbma_rate_tier=REDUCED; club_release_active=false"]
  - method: GET
    path: "/dsp/distilleries/{id}"
    description: "Get a distillery (ledger snapshot)"
    roles: [ProductionManager, ComplianceOfficer, SalesManager, TastingRoomStaff]
    code: 200
    input: []
    output: Distillery
    side_effects: []
  - method: GET
    path: "/dsp/distilleries"
    description: "List distilleries"
    roles: [ProductionManager, ComplianceOfficer, SalesManager, TastingRoomStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: Distillery[]
    side_effects: []
  - method: POST
    path: "/dsp/distilleries/{id}/club-release"
    description: "Open or close the club allocation-release window"
    roles: [SalesManager]
    code: 200
    input: [active]
    output: Distillery
    side_effects: ["club_release_active set to `active`"]

  # ---- MashBatch ----
  - method: POST
    path: "/dsp/mash-batches"
    description: "Create a mash batch"
    roles: [ProductionManager]
    code: 201
    input: [distillery_id, grain_bill, volume_gallons]
    output: MashBatch
    side_effects: ["status=FERMENTING"]
  - method: GET
    path: "/dsp/mash-batches/{id}"
    description: "Get a mash batch"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: []
    output: MashBatch
    side_effects: []
  - method: GET
    path: "/dsp/mash-batches"
    description: "List mash batches (filter by distillery)"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: ["distillery_id?", "limit?", "offset?"]
    output: MashBatch[]
    side_effects: []
  - method: POST
    path: "/dsp/mash-batches/{id}/dump"
    description: "Dump a fermenting mash batch"
    roles: [ProductionManager]
    code: 200
    input: []
    output: MashBatch
    side_effects: ["status -> DUMPED"]

  # ---- DistillationRun ----
  - method: POST
    path: "/dsp/distillation-runs"
    description: "Create a distillation run against a mash batch"
    roles: [ProductionManager]
    code: 201
    input: [distillery_id, mash_batch_id, spirit_type, gauge_method, collected_wine_gallons, collected_proof, "collected_weight_lbs?"]
    output: DistillationRun
    side_effects: ["status=DISTILLING"]
  - method: GET
    path: "/dsp/distillation-runs/{id}"
    description: "Get a distillation run"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: []
    output: DistillationRun
    side_effects: []
  - method: GET
    path: "/dsp/distillation-runs"
    description: "List distillation runs (filter by mash batch or distillery)"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: ["mash_batch_id?", "distillery_id?", "limit?", "offset?"]
    output: DistillationRun[]
    side_effects: []
  - method: POST
    path: "/dsp/distillation-runs/{id}/gauge"
    description: "Gauge the run into proof gallons and enter the production account"
    roles: [ProductionManager]
    code: 200
    input: []
    output: DistillationRun
    side_effects: ["proof_gallons computed; production_account_pg/total_gauged_pg increased; MashBatch -> DISTILLED"]

  # ---- Barrel ----
  - method: POST
    path: "/dsp/barrels"
    description: "Fill a barrel from a GAUGED run (transfers pg production -> storage)"
    roles: [ProductionManager]
    code: 201
    input: [distillation_run_id, char_level, rickhouse_position, fill_proof_gallons]
    output: Barrel
    side_effects: ["status=AGING; fill_date=clock; run.remaining_proof_gallons -= fill_proof_gallons; run.open_barrel_count += 1; production_account_pg -= fill; storage_account_pg += fill"]
  - method: GET
    path: "/dsp/barrels/{id}"
    description: "Get a barrel (with angel_share_pg/current_proof_gallons at clock)"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: []
    output: Barrel
    side_effects: []
  - method: GET
    path: "/dsp/barrels"
    description: "List barrels (filter by run or distillery)"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: ["distillation_run_id?", "distillery_id?", "limit?", "offset?"]
    output: Barrel[]
    side_effects: []
  - method: POST
    path: "/dsp/barrels/{id}/dump"
    description: "Destroy an aging barrel (compensation; writes off remaining pg)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Barrel
    side_effects: ["status -> DESTROYED; storage_account_pg decreased; destroyed/angel losses increased; run.open_barrel_count -= 1 (may cascade run CLOSED -> batch ARCHIVED)"]

  # ---- LabelApplication ----
  - method: POST
    path: "/dsp/label-applications"
    description: "Create a COLA label application"
    roles: [ComplianceOfficer]
    code: 201
    input: [distillery_id, brand_name, spirit_type, label_proof, net_contents_ml]
    output: LabelApplication
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/dsp/label-applications/{id}"
    description: "Get a label application"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: []
    output: LabelApplication
    side_effects: []
  - method: GET
    path: "/dsp/label-applications"
    description: "List label applications (filter by distillery)"
    roles: [ProductionManager, ComplianceOfficer]
    code: 200
    input: ["distillery_id?", "limit?", "offset?"]
    output: LabelApplication[]
    side_effects: []
  - method: POST
    path: "/dsp/label-applications/{id}/submit"
    description: "Submit a DRAFT label application to TTB"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LabelApplication
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/dsp/label-applications/{id}/decide"
    description: "Record TTB decision on a SUBMITTED application (APPROVE or RETURN)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "correction_notes?"]
    output: LabelApplication
    side_effects: ["APPROVE -> APPROVED (+ttb_id); RETURN -> NEEDS_CORRECTION (+correction_notes)"]
  - method: POST
    path: "/dsp/label-applications/{id}/resubmit"
    description: "Resubmit a NEEDS_CORRECTION application (revision loop)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LabelApplication
    side_effects: ["status -> SUBMITTED; correction_notes cleared"]

  # ---- BottlingRun ----
  - method: POST
    path: "/dsp/bottling-runs"
    description: "Schedule a bottling run on a line (checks line interval overlap)"
    roles: [ProductionManager]
    code: 201
    input: [barrel_id, label_application_id, line_id, scheduled_start, scheduled_end, bottle_size_ml, bottles_per_case, planned_cases]
    output: BottlingRun
    side_effects: ["status=SCHEDULED; distillery_id inherited from barrel's run"]
  - method: GET
    path: "/dsp/bottling-runs/{id}"
    description: "Get a bottling run (inventory + pg)"
    roles: [ProductionManager, ComplianceOfficer, SalesManager]
    code: 200
    input: []
    output: BottlingRun
    side_effects: []
  - method: GET
    path: "/dsp/bottling-runs"
    description: "List bottling runs (filter by barrel or label application)"
    roles: [ProductionManager, ComplianceOfficer, SalesManager]
    code: 200
    input: ["barrel_id?", "label_application_id?", "distillery_id?", "limit?", "offset?"]
    output: BottlingRun[]
    side_effects: []
  - method: POST
    path: "/dsp/bottling-runs/{id}/start"
    description: "Start a scheduled run (requires APPROVED label, AGING barrel)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: BottlingRun
    side_effects: ["status -> BOTTLING"]
  - method: POST
    path: "/dsp/bottling-runs/{id}/complete"
    description: "Complete a run: bottle, draw the barrel, produce inventory (cascade A)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: BottlingRun
    side_effects: ["bottled_proof_gallons/draw/loss computed; cases produced; storage->processing; Barrel EMPTIED; run/batch cascade"]
  - method: POST
    path: "/dsp/bottling-runs/{id}/cancel"
    description: "Cancel a scheduled run"
    roles: [ProductionManager]
    code: 200
    input: []
    output: BottlingRun
    side_effects: ["status -> CANCELLED"]

  # ---- TaxRemoval ----
  - method: POST
    path: "/dsp/tax-removals"
    description: "Remove finished goods from bond; compute excise for TAXPAID (cascade B)"
    roles: [ComplianceOfficer]
    code: 201
    input: [bottling_run_id, removal_reason, removed_cases]
    output: TaxRemoval
    side_effects: ["excise computed; run inventory decreased; TAXPAID updates bond/CBMA ledger; SOLD_OUT may auto-cancel PENDING orders"]
  - method: GET
    path: "/dsp/tax-removals/{id}"
    description: "Get a tax removal"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TaxRemoval
    side_effects: []
  - method: GET
    path: "/dsp/tax-removals"
    description: "List tax removals (filter by bottling run or distillery)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["bottling_run_id?", "distillery_id?", "limit?", "offset?"]
    output: TaxRemoval[]
    side_effects: []

  # ---- ExciseReport ----
  - method: POST
    path: "/dsp/excise-reports"
    description: "File a monthly TTB excise report; supersedes prior FILED report for the period (OCC on Distillery.version)"
    roles: [ComplianceOfficer]
    code: 201
    input: [distillery_id, period_month, expected_distillery_version]
    output: ExciseReport
    side_effects: ["snapshot totals; prior FILED report for period -> SUPERSEDED; Distillery.version += 1"]
  - method: GET
    path: "/dsp/excise-reports/{id}"
    description: "Get an excise report"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExciseReport
    side_effects: []
  - method: GET
    path: "/dsp/excise-reports"
    description: "List excise reports (filter by distillery)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["distillery_id?", "limit?", "offset?"]
    output: ExciseReport[]
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/dsp/customers"
    description: "Create a customer"
    roles: [SalesManager, TastingRoomStaff]
    code: 201
    input: [name, email, state_code, "club_tier?", "age_verified?"]
    output: Customer
    side_effects: ["club_tier default NONE; age_verified default false"]
  - method: GET
    path: "/dsp/customers/{id}"
    description: "Get a customer"
    roles: [SalesManager, TastingRoomStaff, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/dsp/customers"
    description: "List customers"
    roles: [SalesManager, TastingRoomStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ---- SalesOrder ----
  - method: POST
    path: "/dsp/sales-orders"
    description: "Create a sales order (any channel; pricing computed)"
    roles: [SalesManager, TastingRoomStaff, Customer]
    code: 201
    input: [customer_id, bottling_run_id, channel, cases, unit_price_cents, "includes_cocktail?"]
    output: SalesOrder
    side_effects: ["payment_status=UNPAID; fulfillment_status=PENDING; subtotal/total computed (order_pricing)"]
  - method: GET
    path: "/dsp/sales-orders/{id}"
    description: "Get a sales order"
    roles: [SalesManager, TastingRoomStaff, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/dsp/sales-orders"
    description: "List sales orders (filter by customer or bottling run)"
    roles: [SalesManager, TastingRoomStaff, Customer]
    code: 200
    input: ["customer_id?", "bottling_run_id?", "distillery_id?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []
  - method: POST
    path: "/dsp/sales-orders/{id}/pay"
    description: "Pay an order; reserves inventory (payment+fulfillment advance)"
    roles: [SalesManager, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment PAID; fulfillment ALLOCATED; run cases_available->reserved"]
  - method: POST
    path: "/dsp/sales-orders/{id}/ship"
    description: "Ship an allocated order (three-tier requires tax-determined goods)"
    roles: [SalesManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment SHIPPED; run cases_reserved->shipped"]
  - method: POST
    path: "/dsp/sales-orders/{id}/cancel"
    description: "Cancel a PENDING/ALLOCATED order (releases reservation)"
    roles: [SalesManager, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment CANCELLED; if was ALLOCATED, cases returned to available"]
  - method: POST
    path: "/dsp/sales-orders/{id}/refund"
    description: "Refund a paid, cancelled order"
    roles: [SalesManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment REFUNDED"]

  # ---- TourBooking ----
  - method: POST
    path: "/dsp/tour-bookings"
    description: "Request a tasting-room tour"
    roles: [TastingRoomStaff, Customer]
    code: 201
    input: [customer_id, distillery_id, start_time, end_time, party_size, "includes_tasting?"]
    output: TourBooking
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/dsp/tour-bookings/{id}"
    description: "Get a tour booking"
    roles: [TastingRoomStaff, Customer]
    code: 200
    input: []
    output: TourBooking
    side_effects: []
  - method: GET
    path: "/dsp/tour-bookings"
    description: "List tour bookings (filter by customer or distillery)"
    roles: [TastingRoomStaff, Customer]
    code: 200
    input: ["customer_id?", "distillery_id?", "limit?", "offset?"]
    output: TourBooking[]
    side_effects: []
  - method: POST
    path: "/dsp/tour-bookings/{id}/confirm"
    description: "Confirm a tour (buffer + capacity checks)"
    roles: [TastingRoomStaff]
    code: 200
    input: []
    output: TourBooking
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/dsp/tour-bookings/{id}/cancel"
    description: "Cancel a tour"
    roles: [TastingRoomStaff, Customer]
    code: 200
    input: []
    output: TourBooking
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Customer acting on a row it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing/malformed field, illegal enum, or non-positive quantity" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for this transition" }
  - { id: ERR_MASH_NOT_AVAILABLE, http: 409, condition: "Referenced mash batch is not FERMENTING at gauge" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "Bottling start attempted with a label application not APPROVED" }
  - { id: ERR_BARREL_NOT_AGING, http: 409, condition: "Bottling start/complete references a barrel not AGING" }
  - { id: ERR_INSUFFICIENT_PROOF_GALLONS, http: 409, condition: "Barrel current_proof_gallons cannot cover bottled_proof_gallons" }
  - { id: ERR_LINE_CONFLICT, http: 409, condition: "Bottling line interval overlaps another run on the same line" }
  - { id: ERR_NOT_TAX_DETERMINED, http: 409, condition: "Three-tier shipment of goods still IN_BOND (no taxpaid removal)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Not enough cases_available for the order or removal" }
  - { id: ERR_INSUFFICIENT_BONDED_PG, http: 409, condition: "Taxpaid removal exceeds bonded_total_pg" }
  - { id: ERR_AGE_NOT_VERIFIED, http: 403, condition: "Payment attempted for a customer whose age is not verified" }
  - { id: ERR_CLUB_NOT_ELIGIBLE, http: 409, condition: "CLUB order without an open release or a customer with club_tier NONE" }
  - { id: ERR_TOUR_OVERLAP, http: 409, condition: "A confirmed tour starts within the buffer of this tour's start" }
  - { id: ERR_TOUR_CAPACITY, http: 409, condition: "Confirming would exceed the tasting-room capacity for the overlap window" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_distillery_version does not match Distillery.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProductionManager
    description: "Runs bonded production: mash, distillation, barreling, bottling."
    identity: "opaque"
    exclusive_operations:
      - "POST /dsp/mash-batches (+ /dump)"
      - "POST /dsp/distillation-runs (+ /gauge)"
      - "POST /dsp/barrels (+ /dump)"
      - "POST /dsp/bottling-runs (+ /start, /complete, /cancel)"
    shared_operations:
      - "GET production/label/bottling resources"
      - "POST /dsp/_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Handles DSP registration, COLA labels, TTB tax removals, and excise reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /dsp/distilleries"
      - "POST /dsp/label-applications (+ /submit, /decide, /resubmit)"
      - "POST /dsp/tax-removals"
      - "POST /dsp/excise-reports"
      - "POST /dsp/_ledger/set_cbma_ytd"
    shared_operations:
      - "GET compliance/production resources"
      - "POST /dsp/_clock/set_current_utc"

  - name: SalesManager
    description: "Owns wholesale/self-distribution sales orders and the club release window."
    identity: "opaque"
    exclusive_operations:
      - "POST /dsp/distilleries/{id}/club-release"
      - "POST /dsp/sales-orders/{id}/ship"
      - "POST /dsp/sales-orders/{id}/refund"
    shared_operations:
      - "POST /dsp/customers"
      - "POST /dsp/sales-orders (+ /pay, /cancel)"
      - "GET sales resources"
      - "POST /dsp/_clock/set_current_utc"

  - name: TastingRoomStaff
    description: "Runs tasting-room POS and tour bookings."
    identity: "opaque"
    exclusive_operations:
      - "POST /dsp/tour-bookings/{id}/confirm"
    shared_operations:
      - "POST /dsp/customers"
      - "POST /dsp/sales-orders (tasting-room POS)"
      - "POST /dsp/tour-bookings (+ /cancel)"
      - "POST /dsp/_clock/set_current_utc"

  - name: Customer
    description: "Direct/club customer acting only on its own orders and tours."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /dsp/sales-orders (own; + /pay, /cancel own)"
      - "POST /dsp/tour-bookings (own; + /cancel own)"
      - "GET own sales-orders and tour-bookings"
