      - name: attribution_window_inclusive_end_boundary
        claim_type: correct_result
        grounds: [calculations.attribution_window, entities.AttributionEvent.fields.attributed]
        distinguishing_aspect: "The window end flight_end + 30 days is inclusive: an event at exactly 2026-10-01T00:00:00Z is attributed, one second later is not, and one second before flight_start is not."
        test_recipe:
          setup: ["Advertiser; DRAFT campaign flight [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) — attribution needs no activation"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "AttrCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CA", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
          trigger:
            - call: "POST /adnet/attribution-events"
              payload: { campaign_id: "${cmp}", kind: "PROMO_CODE", promo_code: "IN30", occurred_at: "2026-10-01T00:00:00Z" }
              as: Ingestion
              captures: { ev_in: $.data.id }
            - call: "POST /adnet/attribution-events"
              payload: { campaign_id: "${cmp}", kind: "PROMO_CODE", promo_code: "OUT30", occurred_at: "2026-10-01T00:00:01Z" }
              as: Ingestion
              captures: { ev_out: $.data.id }
            - call: "POST /adnet/attribution-events"
              payload: { campaign_id: "${cmp}", kind: "PIXEL", occurred_at: "2026-07-31T23:59:59Z" }
              as: Ingestion
              captures: { ev_pre: $.data.id }
          assert:
            - "AttributionEvent.${ev_in}.attributed == true (flight_end 2026-09-01 + 30 days == 2026-10-01T00:00:00Z, inclusive)"
            - "AttributionEvent.${ev_out}.attributed == false (one second past the window)"
            - "AttributionEvent.${ev_pre}.attributed == false (before flight_start)"

