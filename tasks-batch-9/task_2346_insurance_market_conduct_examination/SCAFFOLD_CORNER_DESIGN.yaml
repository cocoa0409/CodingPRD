      - name: cycle_slots_are_a_conserved_ledger_that_refuses_the_next_attachment
        claim_type: aggregate_validation
        grounds:
          - validations[priority 68 ERR_CYCLE_SLOTS_EXHAUSTED]
          - entities.MarketAnalysisCycle.fields.slots_available
          - calculations.target_selection
        distinguishing_aspect: |
          Attaching an examination to a cycle consumes a slot from the same ledger that automated
          selection draws on, so a manually created examination is refused once selection has spent the
          capacity. The refusal is specific to the attachment: the identical examination created with no
          cycle_id succeeds, which proves the ledger governs cycle membership rather than examiner
          workload in general.
