            - call: "GET /msha/citations"
              payload: { mine_id: "${m_id}" }
              as: DistrictManager
          assert:
            - "Accident.${acc1}.late_report == false"
            - "the mine's citation list is empty (total_count == 0) — the boundary is inclusive-timely"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers is refused 401 ERR_UNAUTHENTICATED at priority 1 before any role, existence, or business check — even on a read-only endpoint."
        test_recipe:
          setup:
            - "One mine exists."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
          trigger:
            - call: "GET /msha/mines/${m_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the response is 401 with error_id ERR_UNAUTHENTICATED"

      - name: shape_error_precedes_existence_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A citation POST missing the required negligence field AND referencing a nonexistent inspection answers 400 ERR_INVALID_REQUEST — the request-shape check (priority 3) runs before FK existence (priority 4)."
        test_recipe:
          setup:
            - "One mine exists; no inspections."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
          trigger:
            - call: "POST /msha/citations"
              payload: { inspection_id: "00000000-0000-4000-8000-000000000000", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST (not 404 ERR_NOT_FOUND)"

      - name: existence_error_precedes_state_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Completing a nonexistent inspection id answers 404 ERR_NOT_FOUND; the state-machine check never sees the request."
        test_recipe:
          setup:
            - "Empty except clock."
          setup_api_calls:
            - *clk_feb10_0800
          trigger:
            - call: "POST /msha/inspections/00000000-0000-4000-8000-000000000000/complete"
              payload: {}
              as: Inspector
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id ERR_NOT_FOUND (not 409 ERR_INVALID_STATE)"

      - name: ventilation_plan_rejected_at_surface_mine
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_PLAN_TYPE_NOT_REQUIRED
        distinguishing_aspect: "VENTILATION and ROOF_CONTROL plans apply only to UNDERGROUND mines; a SURFACE mine submitting VENTILATION gets ERR_PLAN_TYPE_NOT_REQUIRED while EMERGENCY_RESPONSE is accepted."
        test_recipe:
          setup:
            - "SURFACE mine."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_sf
          trigger:
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "VENTILATION", document_ref: "doc-vent-x" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
            - call: "POST /msha/mines/${m_id}/mine-plans"
              payload: { plan_type: "EMERGENCY_RESPONSE", document_ref: "doc-erp-1" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { plan_e: $.data.id }
          assert:
            - "the VENTILATION submission answers 409 ERR_PLAN_TYPE_NOT_REQUIRED"
            - "the EMERGENCY_RESPONSE submission succeeds (201) with revision_no == 1"

      - name: extension_exhausted_outranks_window_passed
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors.ERR_ABATEMENT_EXTENSION_EXHAUSTED
        distinguishing_aspect: "A citation already extended AND past its extended deadline fails both the one-extension constraint (priority 10) and the before-deadline temporal rule (priority 11); the constraint error ERR_ABATEMENT_EXTENSION_EXHAUSTED wins."
        test_recipe:
          setup:
            - "SERIOUS citation issued 2026-02-10T09:00:00Z (deadline 2026-02-15T09:00:00Z); extension granted 2026-02-12 (new deadline 2026-02-18T09:00:00Z); clock at 2026-02-19T10:00:00Z."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.500", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "REASONABLY_LIKELY", gravity_severity: "SERIOUS", persons_affected: 2, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations/${cit1}/extend-abatement"
              payload: { justification: "parts on order" }
              as: OperatorRep
              as_user_id: "${op_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-19T10:00:00Z" }
              as: MSHAAdmin
          trigger:
            - call: "POST /msha/citations/${cit1}/extend-abatement"
              payload: { justification: "second extension attempt past the extended deadline" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_ABATEMENT_EXTENSION_EXHAUSTED (priority 10), not ERR_ABATEMENT_WINDOW_PASSED (priority 11)"
            - "Citation.${cit1}.abatement_deadline remains 2026-02-18T09:00:00Z"

      - name: modified_decision_requires_modified_amount
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors.ERR_CONTEST_DECISION_INVALID
        distinguishing_aspect: "decide with outcome MODIFIED but no modified_penalty_cents is a 422 ERR_CONTEST_DECISION_INVALID; symmetrically, AFFIRMED carrying modified_penalty_cents is the same 422 — the fiscal payload must match the outcome."
        test_recipe:
          setup:
            - "Two citations, each contested and docketed."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
            - *mk_insp1
            - *mk_spot_feb10
            - *mk_review1
            - *mk_start1
            - *clk_feb10_0900
            - *mk_citation_low_v
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.380", kind: "CITATION", negligence: "LOW", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit2: $.data.id, cv2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-12T10:00:00Z" }
              as: MSHAAdmin
            - *mk_contest1
            - call: "POST /msha/contests"
              payload: { citation_id: "${cit2}", expected_citation_version: "${cv2}", grounds: "second contest" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { con2: $.data.id }
            - call: "POST /msha/contests/${con1}/docket"
              payload: {}
              as: CommissionJudge
            - call: "POST /msha/contests/${con2}/docket"
              payload: {}
              as: CommissionJudge
          trigger:
            - call: "POST /msha/contests/${con1}/decide"
              payload: { outcome: "MODIFIED" }
              as: CommissionJudge
              captures: { err1: $.data.error_id }
            - call: "POST /msha/contests/${con2}/decide"
              payload: { outcome: "AFFIRMED", modified_penalty_cents: 5000 }
              as: CommissionJudge
              captures: { err2: $.data.error_id }
          assert:
            - "MODIFIED without modified_penalty_cents answers 422 ERR_CONTEST_DECISION_INVALID"
            - "AFFIRMED with modified_penalty_cents answers 422 ERR_CONTEST_DECISION_INVALID"
            - "both contests remain DOCKETED (no state change on invalid payloads)"

      - name: cycle_geometry_and_open_cycle_enforced
        claim_type: Violation → Error
        grounds:
          - calculations.statutory_frequency_windows
          - errors.ERR_CYCLE_PERIOD_INVALID
          - errors.ERR_CYCLE_OPEN_EXISTS
        distinguishing_aspect: "Three distinct geometric violations of the statutory window rule: an 89-day UNDERGROUND cycle, a first cycle not starting at activation_date, and a next cycle while the prior is still OPEN — each mapped to its own error id."
        test_recipe:
          setup:
            - "UNDERGROUND mine activated 2026-01-01."
          setup_api_calls:
            - *clk_feb10_0800
            - *mk_operator
            - *mk_mine_ug
          trigger:
            - call: "POST /msha/mines/${m_id}/inspection-cycles"
              payload: { period_start: "2026-01-01", period_end: "2026-03-30" }
              as: MSHAAdmin
              captures: { err_short: $.data.error_id }
            - call: "POST /msha/mines/${m_id}/inspection-cycles"
              payload: { period_start: "2026-01-02", period_end: "2026-04-01" }
              as: MSHAAdmin
              captures: { err_offset: $.data.error_id }
            - call: "POST /msha/mines/${m_id}/inspection-cycles"
              payload: { period_start: "2026-01-01", period_end: "2026-03-31" }
              as: MSHAAdmin
              captures: { cyc1: $.data.id }
            - call: "POST /msha/mines/${m_id}/inspection-cycles"
              payload: { period_start: "2026-04-01", period_end: "2026-06-29" }
              as: MSHAAdmin
              captures: { err_open: $.data.error_id }
          assert:
            - "89-day window: 422 ERR_CYCLE_PERIOD_INVALID (UNDERGROUND requires exactly 90 days inclusive)"
            - "first cycle starting 2026-01-02 (not activation_date): 422 ERR_CYCLE_PERIOD_INVALID"
            - "valid first cycle is created (201); the follow-up while it is OPEN: 409 ERR_CYCLE_OPEN_EXISTS"

  # ===========================================================================
  - section: endpoints
    instances:
