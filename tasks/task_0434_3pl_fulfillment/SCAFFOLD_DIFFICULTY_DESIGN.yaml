            - "Bin.${bin}.occupied_cc == 2000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: putaway_bin_blocked_beats_capacity_exceeded
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_BIN_BLOCKED]
          - errors[ERR_BIN_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_constraint (priority 9, ERR_BIN_BLOCKED)
          vs business_temporal (priority 10, ERR_BIN_CAPACITY_EXCEEDED): a putaway
          into a BLOCKED bin whose capacity is ALSO too small returns the lower
          priority number's error ERR_BIN_BLOCKED.
        test_recipe:
          setup:
            - "RECEIVED receipt for 10 units of an 800cc SKU; destination bin capacity 1000cc (too small for 8000cc) AND BLOCKED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Block", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
