          assert:
            - "${nf_club} == ERR_CLUB_NOT_FOUND"
            - "${nf_member} == ERR_MEMBER_NOT_FOUND"
            - "${nf_order} == ERR_SCREENING_ORDER_NOT_FOUND"
            - "${nf_assignment} == ERR_TRAINING_ASSIGNMENT_NOT_FOUND"
            - "${nf_placement} == ERR_COACH_ASSIGNMENT_NOT_FOUND"
            - "${nf_body} == ERR_INVESTIGATING_BODY_NOT_FOUND"
            - "${nf_case} == ERR_CASE_NOT_FOUND"
            - "${nf_measure} == ERR_INTERIM_MEASURE_NOT_FOUND"
            - "${nf_audit} == ERR_CLUB_AUDIT_NOT_FOUND"
            - "${nf_finding} == ERR_AUDIT_FINDING_NOT_FOUND"
            - "${nf_stay} == ERR_ROOM_STAY_NOT_FOUND"
            - "${nf_course} == ERR_TRAINING_COURSE_NOT_FOUND"
            - "HTTP status is 404 on all twelve triggers"
      - name: cheap_invalid_state_errors_are_distinguishable_per_entity
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - errors[ERR_TRAINING_ASSIGNMENT_INVALID_STATE]
          - errors[ERR_MEMBER_INVALID_STATE]
          - errors[ERR_CASE_INVALID_STATE]
          - errors[ERR_AUDIT_INVALID_STATE]
        distinguishing_aspect: |
          Priority 11 must name the entity whose machine refused the transition, so four
          different rejections in the same fixture yield four different error_ids: completing an
          assignment that was never started, renewing a member whose membership dimension is
          still PENDING (there is no renew transition out of PENDING), routing a case that is
          already CLOSED_ADMINISTRATIVE, and finalizing an audit that is already
          FINDINGS_ISSUED.
        test_recipe:
          setup:
