        grounds:
          - validations[priority=3]
          - errors.ERR_FORBIDDEN_IDENTITY
        distinguishing_aspect: "A Customer whose X-User-ID differs from the order's loyalty_account_id is rejected ERR_FORBIDDEN_IDENTITY on cancel — ownership is identity-based, not role-based."
        test_recipe:
          setup:
            - "Spring store; lot ON_SALE; order RESERVED owned by account A; account B exists; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *k_clock_mar10
            - *k_spring_store
            - *k_spring_campaign
            - *k_spring_teardown
