# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Task 1606 Boarding School Residential Life
# §1.8 Test Targeting Index: 9 rules, 19 instances (Rule 2 carries 3, one per mode).
# All chains replay from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Default logical clock is 2026-08-01T00:00:00Z unless a set_current_utc call says otherwise.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bed_utilization_physical_vs_projected
        grounds:
          - calculations.dorm_occupancy
          - entities.Dorm.fields.occupancy_physical
          - entities.Dorm.fields.occupancy_projected
        distinguishing_aspect: "Dorm-domain dual variant: identical assignment data yields occupancy_physical (CONFIRMED only) = 1 and occupancy_projected (CONFIRMED+PROPOSED) = 2 on the same Dorm read."
        test_recipe:
          setup:
            - "Dorm Winslow House (ANY) with one 2-bed room; term FALL_2026 ACTIVE"
            - "Student A CONFIRMED in the room; Student B PROPOSED in the same room (not confirmed)"
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id" } }
            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "W-101", beds: 2 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat A", email: "pa@x.com" }, as: SchoolAdmin, captures: { par_a: "$.data.id" } }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat B", email: "pb@x.com" }, as: SchoolAdmin, captures: { par_b: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu A", grade: 10, gender: "MALE", is_international: false, parent_id: "${par_a}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_a: "$.data.id", stu_a_v: "$.data.version" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu B", grade: 10, gender: "FEMALE", is_international: false, parent_id: "${par_b}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_b: "$.data.id", stu_b_v: "$.data.version" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu_a}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_a_v}" }, as: SchoolAdmin, captures: { asg_a: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments/${asg_a}/confirm", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu_b}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_b_v}" }, as: SchoolAdmin, captures: { asg_b: "$.data.id" } }
          trigger:
            - { call: "GET /reslife/dorms/${dorm_id}", payload: {}, as: SchoolAdmin }
          assert:
            - "Dorm.${dorm_id}.occupancy_physical == 1"
            - "Dorm.${dorm_id}.occupancy_projected == 2"
            - "Dorm.${dorm_id}.beds_total == 2"
            - "Dorm.${dorm_id}.beds_available == 1"
      - name: discipline_points_official_vs_provisional
        grounds:
          - calculations.discipline_points_dual
          - entities.Student.fields.demerit_points
          - entities.Student.fields.demerit_points_provisional
        distinguishing_aspect: "Discipline-domain dual variant (different entity domain than Dorm occupancy): one SANCTIONED case at 6 points plus one still-REPORTED case proposing 5 yields demerit_points = 6 and demerit_points_provisional = 11 for the same student."
        test_recipe:
          setup:
            - "Student with two cases: case1 SANCTIONED at 6 points; case2 still REPORTED with points_proposed 5"
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat C", email: "pc@x.com" }, as: SchoolAdmin, captures: { par_c: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu C", grade: 9, gender: "MALE", is_international: false, parent_id: "${par_c}", sleep_schedule: 2, cleanliness: 4, noise_tolerance: 3, guests_comfort: 5 }, as: SchoolAdmin, captures: { stu_c: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu_c}", category: "MINOR", description: "Tardy to check-in", points_proposed: 6 }, as: Dean, as_user_id: "${dean1}", captures: { case1: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case1}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case1}/record-outcome", payload: { outcome: "SANCTIONED", sanction_type: "WARNING", points_assessed: 6 }, as: Dean, as_user_id: "${dean2}" }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu_c}", category: "MINOR", description: "Candle in room", points_proposed: 5 }, as: Dean, as_user_id: "${dean1}", captures: { case2: "$.data.id" } }
          trigger:
            - { call: "GET /reslife/students/${stu_c}", payload: {}, as: SchoolAdmin }
          assert:
            - "DisciplineCase.${case2}.status == REPORTED"
            - "Student.${stu_c}.demerit_points == 6"
            - "Student.${stu_c}.demerit_points_provisional == 11"
            - "Student.${stu_c}.discipline_standing == GOOD"

  - rule_id: combinatorial_formula
    instances:
      - name: leave_allowance_tiered_standing_international
        grounds:
          - calculations.weekend_leave_allowance
          - entities.Student.fields.weekend_leave_allowance
        distinguishing_aspect: "Mode (a) >=3 inputs with non-linear interaction: tiered base by grade, standing multiplier, conditional international bonus, nested min/floor: grade 11 international GOOD -> min(10, floor(6*1.0)+1) = 7; same student at PROBATION -> min(10, floor(6*0.5)+1) = 4."
        test_recipe:
          setup:
            - "International grade-11 student with APPROVED guardian; standing GOOD, then a 10-point MINOR sanction flips standing to PROBATION"
          setup_api_calls:
            - { call: "POST /reslife/guardians", payload: { full_name: "Gua One", email: "g1@x.com", city: "Boston", max_wards: 5 }, as: SchoolAdmin, captures: { grd: "$.data.id" } }
            - { call: "POST /reslife/guardians/${grd}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat D", email: "pd@x.com" }, as: SchoolAdmin, captures: { par_d: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu D", grade: 11, gender: "FEMALE", is_international: true, parent_id: "${par_d}", guardian_id: "${grd}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_d: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "GET /reslife/students/${stu_d}", payload: {}, as: SchoolAdmin, captures: { allow_before: "$.data.weekend_leave_allowance" } }
          trigger:
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu_d}", category: "MINOR", description: "Repeated dorm noise", points_proposed: 10 }, as: Dean, as_user_id: "${dean1}", captures: { case_d: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case_d}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case_d}/record-outcome", payload: { outcome: "SANCTIONED", sanction_type: "PROBATION", points_assessed: 10 }, as: Dean, as_user_id: "${dean2}" }
            - { call: "GET /reslife/students/${stu_d}", payload: {}, as: SchoolAdmin, captures: { allow_after: "$.data.weekend_leave_allowance" } }
          assert:
            - "captured allow_before == 7"
            - "Student.${stu_d}.demerit_points == 10"
            - "Student.${stu_d}.discipline_standing == PROBATION"
            - "captured allow_after == 4"
      - name: storage_fee_per_line_rounding_then_sum
        grounds:
          - calculations.storage_fee_cents
        distinguishing_aspect: "Mode (b) nested rounding where order matters: two early-bird 1-cuft/1-week lines each round_half_up(212.5) = 213 cents, so the pinned per-line order totals 426 cents; the rejected sum-then-round order would give round_half_up(425.0) = 425."
        test_recipe:
          setup:
            - "Domestic ENROLLED student; THANKSGIVING break 2026-11-24..2026-11-29; storage unit cap 100; clock at default 2026-08-01 (>= 30 days before break, so early_bird applies)"
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat E", email: "pe@x.com" }, as: SchoolAdmin, captures: { par_e: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu E", grade: 12, gender: "MALE", is_international: false, parent_id: "${par_e}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_e: "$.data.id" } }
            - { call: "POST /reslife/break-periods", payload: { name: "THANKSGIVING_2026", kind: "THANKSGIVING", starts_on: "2026-11-24", ends_on: "2026-11-29", housing_available: true }, as: SchoolAdmin, captures: { brk: "$.data.id" } }
            - { call: "POST /reslife/storage-units", payload: { label: "UNIT-A", capacity_cuft: 100 }, as: SchoolAdmin, captures: { unit: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Skis" }, as: Student, as_user_id: "${stu_e}", captures: { res1: "$.data.id", res1_fee: "$.data.fee_cents", res1_early: "$.data.early_bird" } }
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Box of books" }, as: Student, as_user_id: "${stu_e}", captures: { res2: "$.data.id", res2_fee: "$.data.fee_cents" } }
          assert:
            - "captured res1_early == true"
            - "captured res1_fee == 213"
            - "captured res2_fee == 213"
            - "per-line sum (213 + 213) == 426, which differs from the sum-then-round alternative 425"
      - name: break_housing_total_pinned_evaluation_order
        grounds:
          - calculations.break_housing_total_due
        distinguishing_aspect: "Mode (c) circular-looking dependency pinned by evaluation order: deposit_credit is defined as 10% of (room+storage) BEFORE subtraction; with room 20000 and storage 426 the pinned order gives deposit = min(5000, round_half_up(2042.6)) = 2043 and fee = 20000 + 426 - 2043 = 18383."
        test_recipe:
          setup:
            - "International student with APPROVED guardian; THANKSGIVING break; two early-bird 1-cuft/1-week storage reservations (213 cents each); break-housing request approved"
          setup_api_calls:
            - { call: "POST /reslife/guardians", payload: { full_name: "Gua Two", email: "g2@x.com", city: "Hartford", max_wards: 5 }, as: SchoolAdmin, captures: { grd2: "$.data.id" } }
            - { call: "POST /reslife/guardians/${grd2}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat F", email: "pf@x.com" }, as: SchoolAdmin, captures: { par_f: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu F", grade: 10, gender: "FEMALE", is_international: true, parent_id: "${par_f}", guardian_id: "${grd2}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_f: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/break-periods", payload: { name: "THANKSGIVING_2026", kind: "THANKSGIVING", starts_on: "2026-11-24", ends_on: "2026-11-29", housing_available: true }, as: SchoolAdmin, captures: { brk: "$.data.id" } }
            - { call: "POST /reslife/storage-units", payload: { label: "UNIT-B", capacity_cuft: 100 }, as: SchoolAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Skis" }, as: Student, as_user_id: "${stu_f}" }
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Books" }, as: Student, as_user_id: "${stu_f}" }
            - { call: "POST /reslife/break-housing-requests", payload: { break_period_id: "${brk}", reason: "Cannot fly home" }, as: Student, as_user_id: "${stu_f}", captures: { bhr: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/break-housing-requests/${bhr}/decide", payload: { decision: "APPROVE" }, as: Dean, as_user_id: "${dean1}", captures: { room_c: "$.data.room_charge_cents", stor_c: "$.data.storage_total_cents", dep_c: "$.data.deposit_credit_cents", fee_c: "$.data.fee_cents" } }
          assert:
            - "captured room_c == 20000"
            - "captured stor_c == 426"
            - "captured dep_c == 2043"
            - "captured fee_c == 18383"
            - "BreakHousingRequest.${bhr}.status == APPROVED"

  - rule_id: non_linear_state_machine
    instances:
      - name: discipline_case_appeal_cycle_with_cap
        grounds:
          - state_machines.DisciplineCase.SANCTIONED_to_APPEALED
          - state_machines.DisciplineCase.APPEALED_to_SANCTIONED
        distinguishing_aspect: "Cyclic machine on DisciplineCase: SANCTIONED -> APPEALED -> SANCTIONED loop executes once, then the appeal_count == 1 cap rejects a second appeal with ERR_APPEAL_LIMIT_REACHED."
        test_recipe:
          setup:
            - "MAJOR case fully heard and SANCTIONED at 5 points; appeal filed; UPHOLD with adjusted_points 7 returns the case to SANCTIONED"
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat G", email: "pg@x.com" }, as: SchoolAdmin, captures: { par_g: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu G", grade: 11, gender: "MALE", is_international: false, parent_id: "${par_g}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_g: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu_g}", category: "MAJOR", description: "Fire extinguisher discharge", points_proposed: 5 }, as: Dean, as_user_id: "${dean1}", captures: { case_g: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case_g}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case_g}/schedule-hearing", payload: { hearing_at: "2026-09-10T15:00:00Z", hearing_officer_id: "${dean2}" }, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case_g}/record-outcome", payload: { outcome: "SANCTIONED", sanction_type: "PROBATION", points_assessed: 5 }, as: Dean, as_user_id: "${dean2}" }
            - { call: "POST /reslife/discipline-cases/${case_g}/appeal", payload: {}, as: Student, as_user_id: "${stu_g}" }
            - { call: "POST /reslife/discipline-cases/${case_g}/appeal-decision", payload: { decision: "UPHOLD", adjusted_points: 7 }, as: Dean, as_user_id: "${dean2}" }
          trigger:
            - { call: "POST /reslife/discipline-cases/${case_g}/appeal", payload: {}, as: Student, as_user_id: "${stu_g}", captures: { err: "$.data.error_id" } }
            - { call: "GET /reslife/discipline-cases/${case_g}", payload: {}, as: Dean, as_user_id: "${dean1}", captures: { c_status: "$.data.status", c_appeals: "$.data.appeal_count", c_points: "$.data.points_assessed" } }
            - { call: "GET /reslife/students/${stu_g}", payload: {}, as: SchoolAdmin, captures: { s_points: "$.data.demerit_points" } }
          assert:
            - "captured err == ERR_APPEAL_LIMIT_REACHED"
            - "captured c_status == SANCTIONED"
            - "captured c_appeals == 1"
            - "captured c_points == 7"
            - "captured s_points == 7"
      - name: student_parallel_dimensions_independent
        grounds:
          - state_machines.Student.ENROLLED_to_ON_LEAVE
          - state_machines.Student.GOOD_to_PROBATION
          - state_machines.Student.ON_LEAVE_to_ENROLLED
        distinguishing_aspect: "Parallel state dimensions on Student (different entity than DisciplineCase): enrollment_status cycles ENROLLED->ON_LEAVE->ENROLLED while discipline_standing independently moves GOOD->PROBATION via a sanction recorded during ON_LEAVE."
        test_recipe:
          setup:
            - "Student moved to ON_LEAVE; a 10-point MINOR sanction lands while ON_LEAVE; then student returns to ENROLLED"
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat H", email: "ph@x.com" }, as: SchoolAdmin, captures: { par_h: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu H", grade: 12, gender: "FEMALE", is_international: false, parent_id: "${par_h}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_h: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/students/${stu_h}/enrollment", payload: { to_status: "ON_LEAVE" }, as: SchoolAdmin }
            - { call: "GET /reslife/students/${stu_h}", payload: {}, as: SchoolAdmin, captures: { mid_enroll: "$.data.enrollment_status", mid_standing: "$.data.discipline_standing" } }
          trigger:
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu_h}", category: "MINOR", description: "Off campus without leave", points_proposed: 10 }, as: Dean, as_user_id: "${dean1}", captures: { case_h: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case_h}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case_h}/record-outcome", payload: { outcome: "SANCTIONED", sanction_type: "PROBATION", points_assessed: 10 }, as: Dean, as_user_id: "${dean2}" }
            - { call: "GET /reslife/students/${stu_h}", payload: {}, as: SchoolAdmin, captures: { post_enroll: "$.data.enrollment_status", post_standing: "$.data.discipline_standing" } }
            - { call: "POST /reslife/students/${stu_h}/enrollment", payload: { to_status: "ENROLLED" }, as: SchoolAdmin }
            - { call: "GET /reslife/students/${stu_h}", payload: {}, as: SchoolAdmin, captures: { fin_enroll: "$.data.enrollment_status", fin_standing: "$.data.discipline_standing" } }
          assert:
            - "captured mid_enroll == ON_LEAVE and mid_standing == GOOD"
            - "captured post_enroll == ON_LEAVE and post_standing == PROBATION"
            - "captured fin_enroll == ENROLLED and fin_standing == PROBATION"

  - rule_id: transitive_cascade
    instances:
      - name: night_check_absence_cascades_points_standing_leave_cancel
        grounds:
          - calculations.night_check_points
          - calculations.standing_reevaluation
          - state_machines.Student.PROBATION_to_SUSPENDED
          - state_machines.LeaveRequest.APPROVED_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain from a night-check trigger: NightCheck creation assesses 3 points -> Student.demerit_points 18+3=21 crosses the 20 threshold -> standing flips PROBATION->SUSPENDED -> the student's APPROVED LeaveRequest is auto-CANCELLED (denial_reason=STANDING_SUSPENDED)."
        test_recipe:
          setup:
            - "Dorm with 2-bed room; FALL_2026 ACTIVE; grade-12 student CONFIRMED in the room"
            - "One WEEKEND_OVERNIGHT leave fully APPROVED (weekend_leaves_used == 1)"
            - "An 18-point MINOR sanction already applied (standing PROBATION at 18)"
            - "A SCHEDULED WEEKDAY_NIGHT duty shift for the dorm's dorm parent on 2026-09-07"
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id", dorm_v: "$.data.version" } }
            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "W-101", beds: 2 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat I", email: "pi@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu I", grade: 12, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id", stu_v: "$.data.version" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v}" }, as: SchoolAdmin, captures: { asg: "$.data.id" } }
