  - rule_id: compensating_invariant
    instances:
      - name: lease_cancellation_reverses_the_whole_signature_cascade_and_the_concession_ledger
        grounds:
          - state_machines.Lease.contract.EXECUTED_to_CANCELLED
          - state_machines.Lease.concession.APPROVED_to_REVOKED
          - state_machines.Community.lifecycle.STABILIZED_to_LEASE_UP
          - state_machines.Community.facility.CONVERSION_PENDING_to_ADVANCE_ELIGIBLE
          - endpoints.POST_/leases/{id}/cancellation
          - entities.Community.fields.committed_concession_cents
        distinguishing_aspect: |
          Cancelling an EXECUTED lease must undo six recorded effects at once and leave the system
          byte-identical to its pre-signature state: the homesite returns from LEASED to AVAILABLE, the
          household's active_lease_count returns to 0, leased_unit_count and occupancy_ratio return to 0
          and 0.0000, lifecycle_status reverts STABILIZED -> LEASE_UP, facility_status reverts
          CONVERSION_PENDING -> ADVANCE_ELIGIBLE, and the 412685-cent concession commitment is released
          from both Community.committed_concession_cents and ConcessionProgram.committed_cents. The
          single-unit community makes every one of those reversals observable in one call, and the
          released homesite can immediately be leased again, proving no residue was left behind.
        test_recipe:
          setup:
            - "Community 'Wrenmoor' with product_mix {DETACHED: 1, COTTAGE: 0, TOWNHOME: 0}, total_planned_units 1, concession_budget_cents 2000000, plat APPROVED, posture OPEN."
            - "PUBLISHED DETACHED schedule at 285000, so gross_monthly_charge_cents is 298050."
            - "ACTIVE ConcessionProgram 'CP-WM' (STRAIGHT_LINE_NET_EFFECTIVE, free_weeks 6, max_budget_cents 2000000)."
