          - errors[ERR_INVALID_CASE_STATE]
        distinguishing_aspect: "Documenting an implant on a CANCELLED case while also naming a non-existent device_unit_id returns ERR_DEVICE_UNIT_NOT_FOUND (404) from priority 5, not ERR_INVALID_CASE_STATE (409) from priority 8."
        test_recipe:
          setup: ["One patient and one case that has been CANCELLED from SCHEDULED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
