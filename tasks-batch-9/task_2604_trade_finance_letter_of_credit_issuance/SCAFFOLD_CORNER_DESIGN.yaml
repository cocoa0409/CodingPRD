      - name: presentation_window_takes_the_min_and_mixes_closed_and_open_bounds
        claim_type: correct_result
        grounds:
          - calculations.presentation_window
          - errors.ERR_CONFIRMATION_WINDOW_CLOSED
          - endpoints.POST_/credits/{id}/confirmation-requests
        distinguishing_aspect: |
          For W1 (latest_shipment 2026-10-31 + 21 = 2026-11-21 vs expiry
          2026-11-30) the shipment cutoff wins and presentation_deadline_date is
          2026-11-21; for W2 (2026-11-25 + 21 = 2026-12-16 vs expiry 2026-12-10)
          the expiry wins and it is 2026-12-10. The two windows use OPPOSITE
          conventions: confirmation_window_end = expiry + 21 is EXCLUSIVE, so a
          confirmation request on W1 at 2026-12-20 is admitted and the same
          request at 2026-12-21 returns 422 ERR_CONFIRMATION_WINDOW_CLOSED, while
          W2 at 2026-12-21 is still inside [2026-08-10, 2026-12-31).
