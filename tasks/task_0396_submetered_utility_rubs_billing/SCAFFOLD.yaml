# =============================================================================
# Scaffold: Submetered Utility & RUBS Tenant Billing (Expert band)
# §1.0–§1.7 only. No scaffold_difficulty_design / scaffold_corner_design keys here.
# =============================================================================

scenario: |
  Submetered Utility & RUBS Tenant Billing: meter/unit assignment & read,
  consumption vs ratio (RUBS) allocation, common-area deduction, monthly tenant
  billing & late fee, move-in/out proration, dispute/re-read, vendor recovery cap
  (state law), statement

domain_name: submetered-utility-rubs-billing
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # flat: peer entities linked by foreign keys; URLs are /<collection>/{id}, not deep nesting.
  # Property is a scoping ancestor referenced by FK on children, but child URLs are flat.

  state_machine_shape: parallel
  # MeterRead carries a re-read CYCLE; Dispute carries a reopen CYCLE; TenantStatement
  # carries PARALLEL dimensions (delivery_status x payment_status evolving independently);
  # Lease, BillingCycle, VendorBill add guarded/linear lifecycles.

  relationship_patterns:
    - one_to_many       # Property has many Units, Meters, BillingCycles
    - cross_aggregate   # Statement references Lease + BillingCycle + Unit across aggregates
    - many_to_many      # Meter<->Unit association is time-windowed (MeterAssignment via effective dates)

  role_model: peer_roles
  # PropertyManager owns property/utility/billing config & runs cycles; MeterTech owns
  # reads & re-reads; Tenant owns own leases' disputes & payments; Auditor read-only.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; selects the state-law recovery-cap regime", constraints: "uppercase 2-letter; one of {CA, TX, NY, FL}" }
      - { name: recovery_cap_pct, type: number, source: input, default: 0.85, description: "State-law cap: max fraction of a VendorBill total that may be recovered from tenants", constraints: "0 < x <= 1" }
      - { name: common_area_pct, type: number, source: input, default: 0.10, description: "Fraction of every VendorBill reserved as non-recoverable common-area cost", constraints: "0 <= x < 1" }
      - { name: current_period_label, type: string, source: system, default: null, description: "Most recently opened billing period label, e.g. 2026-06 (null until first cycle opened)" }
      - { name: integrity_status, type: enum, source: computed, description: "OK | NEEDS_REVIEW — NEEDS_REVIEW when any closed BillingCycle's allocation invariant fails recompute", constraints: "OK | NEEDS_REVIEW" }

  - name: Utility
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: utility_type, type: enum, source: input, description: "WATER | ELECTRIC | GAS", constraints: "WATER | ELECTRIC | GAS" }
      - { name: allocation_method, type: enum, source: input, description: "CONSUMPTION (submeter reads) | RUBS (occupant-ratio)", constraints: "CONSUMPTION | RUBS" }
      - { name: unit_of_measure, type: string, source: input, description: "Measurement unit for reads, e.g. GAL, KWH, THERM" }
      - { name: monthly_admin_fee_cents, type: integer, source: input, default: 0, description: "Fixed per-unit monthly service/admin fee, prorated on move-in/out", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", constraints: "ACTIVE | ARCHIVED" }

  - name: Unit
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: unit_number, type: string, source: input, description: "Unit label, unique per Property among non-archived units" }
      - { name: square_feet, type: integer, source: input, description: "Unit area, used as an alternate RUBS weight basis", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "VACANT | OCCUPIED | ARCHIVED", constraints: "VACANT | OCCUPIED | ARCHIVED" }

  - name: Meter
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: utility_id, type: string, source: input, description: "FK -> Utility.id; the utility this submeter measures" }
      - { name: serial_number, type: string, source: input, description: "Vendor serial, unique per Property" }
      - { name: assigned_unit_id, type: string, source: system, default: null, description: "FK -> Unit.id; current unit this meter serves (null = unassigned)" }
      - { name: assignment_effective_from, type: datetime, source: system, default: null, description: "Inclusive start of the current assignment window (UTC date)" }
      - { name: assignment_effective_to, type: datetime, source: system, default: null, description: "Exclusive end of the current assignment window; null = open-ended" }
      - { name: last_validated_reading, type: number, source: computed, default: 0, description: "Reading value of the most recent VALIDATED MeterRead (0 if none)" }
      - { name: status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED | RETIRED", constraints: "UNASSIGNED | ASSIGNED | RETIRED" }

  - name: Lease
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the occupied unit" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: tenant_user_id, type: string, source: input, description: "Opaque tenant identifier the Tenant role authenticates as" }
      - { name: occupant_count, type: integer, source: input, description: "Number of occupants; the RUBS allocation weight", constraints: ">= 1" }
      - { name: move_in_date, type: datetime, source: input, description: "Inclusive first occupancy day (UTC date)" }
      - { name: notice_date, type: datetime, source: system, default: null, description: "Date move-out notice was recorded" }
      - { name: move_out_date, type: datetime, source: system, default: null, description: "Inclusive last occupancy day (UTC date); set on move-out" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | NOTICE_GIVEN | MOVED_OUT | CLOSED", constraints: "PENDING | ACTIVE | NOTICE_GIVEN | MOVED_OUT | CLOSED" }

  - name: VendorBill
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: utility_id, type: string, source: input, description: "FK -> Utility.id; which utility this master invoice covers" }
      - { name: period_label, type: string, source: input, description: "Billing period the invoice covers, e.g. 2026-06" }
      - { name: total_cost_cents, type: integer, source: input, description: "Master invoice amount charged by the utility vendor", constraints: "> 0" }
      - { name: common_area_cents, type: integer, source: computed, default: 0, description: "= floor(total_cost_cents * Property.common_area_pct); non-recoverable" }
      - { name: cap_cents, type: integer, source: computed, default: 0, description: "= floor(total_cost_cents * Property.recovery_cap_pct); state-law recovery ceiling" }
      - { name: recoverable_cents, type: integer, source: computed, default: 0, description: "= min(total_cost_cents - common_area_cents, cap_cents); pool allocated to tenants" }
      - { name: status, type: enum, source: system, description: "RECEIVED | APPROVED | ALLOCATED | VOIDED", constraints: "RECEIVED | APPROVED | ALLOCATED | VOIDED" }

  - name: MeterRead
    parent: Meter
    common_fields: true
    fields:
      - { name: meter_id, type: string, source: input, description: "FK -> Meter.id" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: period_label, type: string, source: input, description: "Period the read closes, e.g. 2026-06" }
      - { name: reading_value, type: number, source: input, description: "Cumulative meter reading at period end", constraints: ">= 0" }
      - { name: consumption, type: number, source: computed, default: 0, description: "= reading_value - Meter.last_validated_reading at submit time; clamped >= 0" }
      - { name: re_read_count, type: integer, source: system, default: 0, description: "Number of times this read has been sent back for re-read" }
      - { name: flag_reason, type: string, source: system, default: null, description: "Reason the read was FLAGGED, set by validation rejection" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | VALIDATED | FLAGGED | RE_READ_REQUESTED | SUPERSEDED", constraints: "PENDING | SUBMITTED | VALIDATED | FLAGGED | RE_READ_REQUESTED | SUPERSEDED" }

  - name: BillingCycle
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: utility_id, type: string, source: input, description: "FK -> Utility.id" }
      - { name: vendor_bill_id, type: string, source: input, description: "FK -> VendorBill.id; the master invoice this cycle allocates" }
      - { name: period_label, type: string, source: input, description: "Period being billed, e.g. 2026-06" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive first day of the billing period (UTC date)" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive last day of the billing period (UTC date)" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "Sum of all issued statements' utility_charge_cents for this cycle" }
      - { name: status, type: enum, source: system, description: "OPEN | READS_LOCKED | ALLOCATED | STATEMENTS_ISSUED | CLOSED", constraints: "OPEN | READS_LOCKED | ALLOCATED | STATEMENTS_ISSUED | CLOSED" }

  - name: TenantStatement
    parent: BillingCycle
    common_fields: true
    fields:
      - { name: billing_cycle_id, type: string, source: input, description: "FK -> BillingCycle.id" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the billed tenant occupancy" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: utility_charge_cents, type: integer, source: computed, default: 0, description: "Allocated utility share for this lease in this cycle (consumption or RUBS)" }
      - { name: admin_fee_cents, type: integer, source: computed, default: 0, description: "Prorated monthly admin fee for the occupancy days in the period" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "Late fee applied once the statement passes due date + grace while unpaid" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "= utility_charge_cents + admin_fee_cents + late_fee_cents - credit_cents" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Cumulative dispute-resolution credits applied to this statement" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative posted payments against this statement" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "= total_due_cents - amount_paid_cents" }
      - { name: due_date, type: datetime, source: computed, default: null, description: "= issue date + NET_DAYS; used by late-fee and delinquency checks" }
      - { name: delivery_status, type: enum, source: system, description: "DRAFT | ISSUED | DELIVERED (independent of payment_status)", constraints: "DRAFT | ISSUED | DELIVERED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIALLY_PAID | PAID | DELINQUENT | IN_COLLECTIONS (independent of delivery_status)", constraints: "UNPAID | PARTIALLY_PAID | PAID | DELINQUENT | IN_COLLECTIONS" }

  - name: Dispute
    parent: TenantStatement
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> TenantStatement.id" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: tenant_user_id, type: string, source: system, description: "Opaque id of the tenant who opened the dispute" }
      - { name: reason, type: enum, source: input, description: "HIGH_READING | WRONG_METER | RATIO_ERROR | DOUBLE_BILLED", constraints: "HIGH_READING | WRONG_METER | RATIO_ERROR | DOUBLE_BILLED" }
      - { name: requested_re_read, type: boolean, source: input, default: false, description: "If true, opening the dispute triggers a MeterRead re-read cycle" }
      - { name: credit_amount_cents, type: integer, source: input, default: 0, description: "Credit the resolver grants on resolution; 0 = reject-style resolution", constraints: ">= 0" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times this dispute has been reopened after resolution" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED | REJECTED", constraints: "OPEN | UNDER_REVIEW | RESOLVED | REJECTED" }

  - name: Payment
    parent: TenantStatement
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> TenantStatement.id" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: tenant_user_id, type: string, source: system, description: "Opaque id of the paying tenant" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount applied to the statement", constraints: "> 0" }
      - { name: expected_statement_version, type: integer, source: input, description: "OCC: TenantStatement.version the client last observed" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED", constraints: "POSTED | REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Meter
    initial_state: UNASSIGNED
    terminal_states: [RETIRED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /meters/{meterId}/assign"
        actor: PropertyManager
        preconditions:
          - "Target Unit exists and is not ARCHIVED (else ERR_UNIT_NOT_FOUND)"
          - "Requested assignment window [effective_from, effective_to) does not overlap any other meter assignment of the SAME Unit for the SAME Utility (half-open overlap; else ERR_METER_ASSIGNMENT_OVERLAP)"
        side_effects:
          - "assigned_unit_id, assignment_effective_from, assignment_effective_to set"
          - "Unit.status -> OCCUPIED is NOT changed here (occupancy is Lease-driven)"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /meters/{meterId}/assign (re-assign to a new window)"
        actor: PropertyManager
        preconditions:
          - "New window [effective_from, effective_to) does not overlap the existing window of this same meter (half-open; else ERR_METER_ASSIGNMENT_OVERLAP)"
        side_effects:
          - "Prior window closed (assignment_effective_to set to new effective_from if open-ended); new window recorded"
      - from: ASSIGNED
        to: RETIRED
        trigger: "POST /meters/{meterId}/retire"
        actor: PropertyManager
        preconditions:
          - "No MeterRead in SUBMITTED or RE_READ_REQUESTED for an OPEN BillingCycle (else ERR_METER_HAS_PENDING_READS)"
        side_effects:
          - "status -> RETIRED; assigned_unit_id retained for audit"
      - from: UNASSIGNED
        to: RETIRED
        trigger: "POST /meters/{meterId}/retire"
        actor: PropertyManager
        preconditions: []
        side_effects: ["status -> RETIRED"]

  - entity: Lease
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /leases/{leaseId}/activate"
        actor: PropertyManager
        preconditions:
          - "Unit not ARCHIVED (else ERR_UNIT_NOT_FOUND)"
          - "No other Lease of this Unit in {ACTIVE, NOTICE_GIVEN} whose occupancy interval [move_in_date, move_out_date] (move_out_date inclusive; null = open-ended) overlaps this lease's move_in_date (else ERR_LEASE_OCCUPANCY_OVERLAP)"
        side_effects:
          - "status -> ACTIVE"
          - "Unit.status -> OCCUPIED"
      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "POST /leases/{leaseId}/give-notice"
        actor: PropertyManager | Tenant
        preconditions:
          - "move_out_date in request is >= move_in_date (else ERR_INVALID_MOVE_OUT_DATE)"
        side_effects:
          - "notice_date stamped; move_out_date recorded"
      - from: NOTICE_GIVEN
        to: MOVED_OUT
        trigger: "POST /leases/{leaseId}/move-out"
        actor: PropertyManager
        preconditions:
          - "Current clock date > move_out_date (else ERR_MOVE_OUT_NOT_DUE)"
        side_effects:
          - "status -> MOVED_OUT"
          - "Unit.status -> VACANT"
      - from: MOVED_OUT
        to: CLOSED
        trigger: "POST /leases/{leaseId}/close"
        actor: PropertyManager
        preconditions:
          - "No TenantStatement of this lease with payment_status IN {UNPAID, PARTIALLY_PAID, DELINQUENT, IN_COLLECTIONS} (else ERR_LEASE_HAS_OPEN_BALANCE)"
        side_effects: ["status -> CLOSED"]

  - entity: VendorBill
    initial_state: RECEIVED
    terminal_states: [VOIDED]
    transitions:
      - from: RECEIVED
        to: APPROVED
        trigger: "POST /vendor-bills/{vendorBillId}/approve"
        actor: PropertyManager
        preconditions:
          - "total_cost_cents > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Compute common_area_cents, cap_cents, recoverable_cents (common-area deduction + recovery cap)"
      - from: APPROVED
        to: ALLOCATED
        trigger: "system (on BillingCycle ALLOCATED transition referencing this VendorBill)"
        actor: system
        preconditions:
          - "VendorBill is APPROVED"
        side_effects:
          - "status -> ALLOCATED (locks recoverable_cents)"
      - from: RECEIVED
        to: VOIDED
        trigger: "POST /vendor-bills/{vendorBillId}/void"
        actor: PropertyManager
        preconditions:
          - "No BillingCycle references this VendorBill in a non-OPEN status (else ERR_VENDOR_BILL_IN_USE)"
        side_effects: ["status -> VOIDED"]
      - from: APPROVED
        to: VOIDED
        trigger: "POST /vendor-bills/{vendorBillId}/void"
        actor: PropertyManager
        preconditions:
          - "No BillingCycle references this VendorBill in {ALLOCATED, STATEMENTS_ISSUED, CLOSED} (else ERR_VENDOR_BILL_IN_USE)"
        side_effects: ["status -> VOIDED"]

  - entity: MeterRead
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /meter-reads/{readId}/submit"
        actor: MeterTech
        preconditions:
          - "Parent BillingCycle (matching property+utility+period) is OPEN (else ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "consumption = max(0, reading_value - Meter.last_validated_reading)"
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /meter-reads/{readId}/validate"
        actor: PropertyManager
        preconditions:
          - "consumption <= Meter.last_validated_reading * HIGH_READING_MULTIPLE OR Meter.last_validated_reading == 0 (else the read must be FLAGGED, not validated)"
        side_effects:
          - "Meter.last_validated_reading = reading_value"
          - "Any other VALIDATED/SUBMITTED read for the same meter+period -> SUPERSEDED"
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /meter-reads/{readId}/flag"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "flag_reason recorded"
      - from: FLAGGED
        to: RE_READ_REQUESTED
        trigger: "POST /meter-reads/{readId}/request-re-read"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "re_read_count += 1"
      - from: RE_READ_REQUESTED
        to: SUBMITTED
        trigger: "POST /meter-reads/{readId}/submit"
        actor: MeterTech
        preconditions:
          - "Parent BillingCycle is OPEN (else ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "reading_value overwritten with re-read value; consumption recomputed = max(0, reading_value - Meter.last_validated_reading)"
        note: "Re-read CYCLE: FLAGGED -> RE_READ_REQUESTED -> SUBMITTED loops back into validation"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system (a newer read for the same meter+period is VALIDATED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: READS_LOCKED
        trigger: "POST /billing-cycles/{cycleId}/lock-reads"
        actor: PropertyManager
        preconditions:
          - "For a CONSUMPTION utility: every assigned, non-RETIRED meter of the property+utility has exactly one VALIDATED MeterRead for the period; none in SUBMITTED/FLAGGED/RE_READ_REQUESTED (else ERR_READS_NOT_VALIDATED)"
        side_effects:
          - "status -> READS_LOCKED; period reads frozen"
      - from: READS_LOCKED
        to: ALLOCATED
        trigger: "POST /billing-cycles/{cycleId}/allocate"
        actor: PropertyManager
        preconditions:
          - "Referenced VendorBill is APPROVED (else ERR_VENDOR_BILL_NOT_APPROVED)"
        side_effects:
          - "Run allocation (consumption or RUBS) over recoverable_cents -> per-Unit shares"
          - "VendorBill -> ALLOCATED (cascade); allocated_total_cents set"
      - from: ALLOCATED
        to: STATEMENTS_ISSUED
        trigger: "POST /billing-cycles/{cycleId}/issue-statements"
        actor: PropertyManager
        preconditions:
          - "At least one Lease in {ACTIVE, NOTICE_GIVEN, MOVED_OUT} occupied a billed unit during the period (else ERR_NO_BILLABLE_LEASES)"
        side_effects:
          - "Create one TenantStatement per eligible Lease (delivery_status=ISSUED, payment_status=UNPAID)"
          - "Compute admin_fee proration, due_date = issue date + NET_DAYS, total_due_cents, balance_due_cents"
      - from: STATEMENTS_ISSUED
        to: CLOSED
        trigger: "POST /billing-cycles/{cycleId}/close"
        actor: PropertyManager
        preconditions:
          - "No TenantStatement of this cycle has an OPEN or UNDER_REVIEW Dispute (else ERR_CYCLE_HAS_OPEN_DISPUTES)"
        side_effects:
          - "status -> CLOSED; recompute allocation invariant; Property.integrity_status set"

  - entity: TenantStatement
    initial_state: DRAFT
    terminal_states: []
    note: "PARALLEL dimensions: delivery_status and payment_status evolve independently."
    transitions:
      # ---- delivery_status dimension ----
      - from: "delivery:DRAFT"
        to: "delivery:ISSUED"
        trigger: "system (BillingCycle issue-statements creates statements ISSUED)"
        actor: system
        preconditions: []
        side_effects: ["due_date computed"]
      - from: "delivery:ISSUED"
        to: "delivery:DELIVERED"
        trigger: "POST /statements/{statementId}/mark-delivered"
        actor: PropertyManager
        preconditions: []
        side_effects: ["delivery_status -> DELIVERED (does not touch payment_status)"]
      # ---- payment_status dimension ----
      - from: "payment:UNPAID"
        to: "payment:PARTIALLY_PAID"
        trigger: "POST /statements/{statementId}/payments (partial)"
        actor: Tenant
        preconditions:
          - "expected_statement_version matches current TenantStatement.version (else ERR_STALE_VERSION)"
          - "0 < amount_cents < balance_due_cents"
        side_effects:
          - "amount_paid_cents += amount_cents; balance_due_cents recomputed; payment_status -> PARTIALLY_PAID; TenantStatement.version += 1"
      - from: "payment:UNPAID"
        to: "payment:PAID"
        trigger: "POST /statements/{statementId}/payments (full)"
        actor: Tenant
        preconditions:
          - "expected_statement_version matches current TenantStatement.version (else ERR_STALE_VERSION)"
          - "amount_cents == balance_due_cents"
        side_effects:
          - "amount_paid_cents += amount_cents; balance_due_cents -> 0; payment_status -> PAID; TenantStatement.version += 1"
      - from: "payment:PARTIALLY_PAID"
        to: "payment:PAID"
        trigger: "POST /statements/{statementId}/payments (clears balance)"
        actor: Tenant
        preconditions:
          - "expected_statement_version matches current TenantStatement.version (else ERR_STALE_VERSION)"
          - "amount_cents == balance_due_cents"
        side_effects:
          - "balance_due_cents -> 0; payment_status -> PAID; TenantStatement.version += 1"
      - from: "payment:UNPAID"
        to: "payment:DELINQUENT"
        trigger: "POST /statements/{statementId}/assess-late-fee OR system on clock advance past due_date+grace"
        actor: PropertyManager | system
        preconditions:
          - "current clock date > due_date + GRACE_DAYS (else ERR_NOT_YET_DELINQUENT)"
          - "balance_due_cents > 0"
        side_effects:
          - "late_fee_cents computed and added; total_due_cents and balance_due_cents recomputed; payment_status -> DELINQUENT; TenantStatement.version += 1"
      - from: "payment:PARTIALLY_PAID"
        to: "payment:DELINQUENT"
        trigger: "POST /statements/{statementId}/assess-late-fee"
        actor: PropertyManager
        preconditions:
          - "current clock date > due_date + GRACE_DAYS; balance_due_cents > 0"
        side_effects:
          - "late_fee_cents computed and added; balances recomputed; payment_status -> DELINQUENT; TenantStatement.version += 1"
      - from: "payment:DELINQUENT"
        to: "payment:IN_COLLECTIONS"
        trigger: "POST /statements/{statementId}/send-to-collections"
        actor: PropertyManager
        preconditions:
          - "balance_due_cents > 0; statement DELINQUENT for >= COLLECTIONS_GRACE_DAYS past due_date (else ERR_NOT_YET_COLLECTIONS)"
        side_effects: ["payment_status -> IN_COLLECTIONS; TenantStatement.version += 1"]
      - from: "payment:DELINQUENT"
        to: "payment:PAID"
        trigger: "POST /statements/{statementId}/payments (full, including late fee)"
        actor: Tenant
        preconditions:
          - "expected_statement_version matches current TenantStatement.version (else ERR_STALE_VERSION)"
          - "amount_cents == balance_due_cents"
        side_effects:
          - "balance_due_cents -> 0; payment_status -> PAID; TenantStatement.version += 1"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{disputeId}/start-review"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "If requested_re_read: the latest VALIDATED MeterRead for the statement's meter+period -> SUPERSEDED and a fresh RE_READ_REQUESTED read row created (re-read cascade)"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /disputes/{disputeId}/resolve"
        actor: PropertyManager
        preconditions:
          - "credit_amount_cents <= statement.total_due_cents (else ERR_CREDIT_EXCEEDS_DUE)"
        side_effects:
          - "TenantStatement.credit_cents += credit_amount_cents; total_due_cents and balance_due_cents recomputed; if balance_due_cents <= 0 then payment_status -> PAID; TenantStatement.version += 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /disputes/{disputeId}/reject"
        actor: PropertyManager
        preconditions: []
        side_effects: []
      - from: RESOLVED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{disputeId}/reopen"
        actor: Tenant | PropertyManager
        preconditions:
          - "Parent BillingCycle is not CLOSED (else ERR_CYCLE_CLOSED)"
          - "reopen_count < MAX_REOPENS (else ERR_MAX_REOPENS_REACHED)"
        side_effects:
          - "reopen_count += 1"
          - "Prior credit reversed: TenantStatement.credit_cents -= previously-granted credit_amount_cents; balances recomputed; TenantStatement.version += 1 (compensation)"
        note: "Reopen CYCLE: RESOLVED -> UNDER_REVIEW; credit compensation keeps statement money conserved"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{paymentId}/reverse"
        actor: PropertyManager
        preconditions:
          - "Parent BillingCycle not CLOSED (else ERR_CYCLE_CLOSED)"
        side_effects:
          - "TenantStatement.amount_paid_cents -= amount_cents; balance_due_cents recomputed; payment_status recomputed (PAID->PARTIALLY_PAID/UNPAID as applicable); TenantStatement.version += 1 (compensation)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: payment-post-stale-statement
    parent_entity: TenantStatement
    write_endpoint: "POST /statements/{statementId}/payments"
    occ_field: "expected_statement_version"
    description: |
      Posting a Payment against a TenantStatement whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a dispute resolution credit (or another payment) has legitimately
      changed balance_due_cents and the paying client's view of the statement
      is therefore stale; the amount it intends to pay no longer matches the
      live balance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: vendor_recoverable
    trigger: "VendorBill RECEIVED_to_APPROVED transition"
    algorithm: waterfall_allocation
    formula: |
      common_area_cents = floor(total_cost_cents * Property.common_area_pct)
      cap_cents         = floor(total_cost_cents * Property.recovery_cap_pct)
      recoverable_cents = min(total_cost_cents - common_area_cents, cap_cents)
      # Common-area deduction happens FIRST; the state-law recovery cap is a
      # SECOND, independent ceiling on the same total. recoverable_cents is the
      # smaller of (post-deduction amount) and (state-law cap).
    input_set: "single VendorBill being approved; Property.common_area_pct and recovery_cap_pct"
    constants: {}
    precision: "integer cents, floor on each percentage product"
    variants:
      - name: cap_binds
        when: "total_cost_cents - common_area_cents > cap_cents"
        difference: "recoverable_cents = cap_cents (state-law ceiling wins over post-deduction amount)"
      - name: deduction_binds
        when: "total_cost_cents - common_area_cents <= cap_cents"
        difference: "recoverable_cents = total_cost_cents - common_area_cents (common-area deduction wins)"

  - name: consumption_allocation
    trigger: "BillingCycle READS_LOCKED_to_ALLOCATED transition when Utility.allocation_method == CONSUMPTION"
    algorithm: waterfall_allocation
    formula: |
      total_consumption = sum over billed Units of the unit's VALIDATED MeterRead.consumption for the period
      for each Unit u (ordered by consumption DESC, then Unit.created_at ASC):
        floor_share[u] = floor(recoverable_cents * consumption[u] / total_consumption)
      remainder = recoverable_cents - sum(floor_share)
      distribute the `remainder` cents one-by-one to Units in (consumption DESC, created_at ASC) order
      unit_utility_charge[u] = floor_share[u] + remainder_received[u]
    input_set: "Units of the property+utility with a VALIDATED MeterRead for the period; recoverable_cents from the cycle's VendorBill"
    constants: {}
    precision: "integer cents; floor per unit then largest-remainder distribution by consumption DESC, created_at ASC tie-break"
    variants:
      - name: zero_total_consumption
        when: "total_consumption == 0"
        difference: "every unit_utility_charge = 0; recoverable_cents stays unallocated (charged as common-area shortfall, not to tenants)"

  - name: rubs_allocation
    trigger: "BillingCycle READS_LOCKED_to_ALLOCATED transition when Utility.allocation_method == RUBS"
    algorithm: waterfall_allocation
    formula: |
      total_weight = sum over billed Units of the unit's active Lease occupant_count
      for each Unit u (ordered by occupant_count DESC, then Unit.created_at ASC):
        floor_share[u] = floor(recoverable_cents * occupant_count[u] / total_weight)
      remainder = recoverable_cents - sum(floor_share)
      distribute `remainder` cents one-by-one to Units in (occupant_count DESC, created_at ASC) order
      unit_utility_charge[u] = floor_share[u] + remainder_received[u]
    input_set: "Units with a Lease in {ACTIVE, NOTICE_GIVEN, MOVED_OUT} overlapping the period; recoverable_cents from the cycle's VendorBill"
    constants: {}
    precision: "integer cents; floor per unit then largest-remainder distribution by occupant_count DESC, created_at ASC tie-break"
    variants:
      - name: no_submeters_required
        when: "Utility.allocation_method == RUBS"
        difference: "ignores MeterRead entirely; weight is occupant_count, never metered consumption"

  - name: admin_fee_proration
    trigger: "BillingCycle ALLOCATED_to_STATEMENTS_ISSUED transition (per statement)"
    algorithm: threshold
    formula: |
      period_days = (period_end - period_start) in whole days + 1   # inclusive both ends
      occ_start = max(Lease.move_in_date, period_start)
      occ_end   = min(coalesce(Lease.move_out_date, period_end), period_end)
      occupied_days = (occ_end - occ_start) in whole days + 1        # both ends inclusive
      if occupied_days <= 0: admin_fee_cents = 0
      elif occupied_days >= period_days: admin_fee_cents = Utility.monthly_admin_fee_cents
      else: admin_fee_cents = floor(Utility.monthly_admin_fee_cents * occupied_days / period_days)
    input_set: "single Lease + Utility.monthly_admin_fee_cents + cycle period_start/period_end"
    constants: {}
    precision: "integer cents, floor; both period and occupancy day-counts are inclusive of endpoints"
    variants:
      - name: full_period
        when: "occupied_days >= period_days"
        difference: "no proration; full monthly_admin_fee_cents charged"
      - name: partial_occupancy
        when: "0 < occupied_days < period_days"
        difference: "floor(fee * occupied_days / period_days)"

  - name: late_fee
    trigger: "TenantStatement payment dimension -> DELINQUENT (assess-late-fee)"
    algorithm: tiered_pricing
    formula: |
      base   = ceil(LATE_FEE_PCT * balance_due_cents)
      fee    = max(LATE_FEE_FLAT_CENTS, base)            # flat minimum
      fee    = min(fee, LATE_FEE_MAX_CENTS)              # absolute dollar cap
      fee    = min(fee, floor(Property.recovery_cap_pct * 0 + LATE_FEE_MAX_PCT * balance_due_cents))  # state-law pct cap
      late_fee_cents = fee
      # Evaluation order is fixed: percentage base -> flat floor -> absolute cap -> state-law pct cap.
    input_set: "single TenantStatement.balance_due_cents at the moment of assessment"
    constants:
      LATE_FEE_PCT: 0.05
      LATE_FEE_FLAT_CENTS: 500
      LATE_FEE_MAX_CENTS: 5000
      LATE_FEE_MAX_PCT: 0.10
    precision: "integer cents; ceil on pct base, floor on state-law cap; order pinned above"
    variants:
      - name: flat_min_binds
        when: "ceil(LATE_FEE_PCT*balance) < LATE_FEE_FLAT_CENTS AND floor(LATE_FEE_MAX_PCT*balance) >= LATE_FEE_FLAT_CENTS"
        difference: "fee = LATE_FEE_FLAT_CENTS (e.g. balance 8000 -> 500)"
      - name: pct_base_binds
        when: "LATE_FEE_FLAT_CENTS <= ceil(LATE_FEE_PCT*balance) <= LATE_FEE_MAX_CENTS AND below state-law cap"
        difference: "fee = ceil(LATE_FEE_PCT*balance) (e.g. balance 42501 -> 2126)"
      - name: absolute_cap_binds
        when: "ceil(LATE_FEE_PCT*balance) > LATE_FEE_MAX_CENTS AND state-law cap higher"
        difference: "fee = LATE_FEE_MAX_CENTS (e.g. balance 200000 -> 5000)"
      - name: statelaw_pct_cap_binds
        when: "floor(LATE_FEE_MAX_PCT*balance) < the otherwise-chosen fee"
        difference: "fee = floor(LATE_FEE_MAX_PCT*balance) (e.g. balance 3000 -> 300, below the 500 flat min)"

  - name: statement_totals
    trigger: "any mutation of utility_charge_cents, admin_fee_cents, late_fee_cents, credit_cents, or amount_paid_cents"
    algorithm: aggregation
    formula: |
      total_due_cents   = utility_charge_cents + admin_fee_cents + late_fee_cents - credit_cents
      balance_due_cents = total_due_cents - amount_paid_cents
      # Invariant: at all times balance_due_cents == total_due_cents - amount_paid_cents,
      # and total_due_cents == utility_charge_cents + admin_fee_cents + late_fee_cents - credit_cents.
    input_set: "single TenantStatement's own monetary fields"
    constants: {}
    precision: "integer cents; no rounding (all inputs already integer cents)"

  - name: read_validation_band
    trigger: "MeterRead SUBMITTED_to_VALIDATED transition (POST /meter-reads/{id}/validate)"
    algorithm: threshold
    formula: |
      baseline = Meter.last_validated_reading
      if baseline == 0:
        # first ever validated read for the meter — any non-negative consumption accepted
        accept
      elif consumption <= baseline * HIGH_READING_MULTIPLE:
        accept (status -> VALIDATED)
      else:
        reject with ERR_READING_OUT_OF_RANGE (the read must be FLAGGED, then re-read)
    input_set: "single MeterRead.consumption vs its Meter.last_validated_reading"
    constants:
      HIGH_READING_MULTIPLE: 3   # a read may not exceed 3x the prior validated reading
    precision: "exact integer/decimal comparison; boundary is `<=` (exactly 3x is accepted, 3x + epsilon is rejected)"

  - name: statement_schedule
    trigger: "BillingCycle ALLOCATED_to_STATEMENTS_ISSUED (due_date) and TenantStatement payment-dimension timing checks"
    algorithm: threshold
    formula: |
      due_date = issue_date + NET_DAYS days
      delinquent_eligible   when current_clock_date  > due_date + GRACE_DAYS days
      collections_eligible  when current_clock_date >= due_date + COLLECTIONS_GRACE_DAYS days
      reopen allowed while Dispute.reopen_count < MAX_REOPENS
    input_set: "TenantStatement.due_date, server clock, Dispute.reopen_count"
    constants:
      NET_DAYS: 21               # statement due 21 days after issue
      GRACE_DAYS: 5              # late fee only after due_date + 5
      COLLECTIONS_GRACE_DAYS: 30 # collections only at/after due_date + 30
      MAX_REOPENS: 2             # a dispute may be reopened at most twice
    precision: "whole-day date arithmetic in UTC; delinquency uses strict `>`, collections uses `>=`"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id exists (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Tenant may act only on Disputes/Payments/statements of a Lease whose tenant_user_id == X-User-ID"
    error_id: ERR_NOT_STATEMENT_OWNER
    http_status: 403
    applies_to: "POST /statements/{id}/payments, POST /statements/{id}/disputes, POST /disputes/{id}/reopen (Tenant), POST /leases/{id}/give-notice (Tenant)"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, amounts/percentages in range, enums valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/transition endpoints with a body

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_temporal
    check: "Meter assignment window must not overlap another assignment of the same Unit+Utility (half-open [from,to))"
    error_id: ERR_METER_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /meters/{id}/assign"

  - priority: 8
    category: business_temporal
    check: "Lease occupancy interval must not overlap another non-terminal lease of the same Unit ([move_in,move_out] move_out inclusive)"
    error_id: ERR_LEASE_OCCUPANCY_OVERLAP
    http_status: 409
    applies_to: "POST /leases/{id}/activate"

  - priority: 9
    category: business_safety
    check: "On validate: read consumption must not exceed last_validated_reading * HIGH_READING_MULTIPLE (unless baseline is 0); otherwise it must be FLAGGED first"
    error_id: ERR_READING_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /meter-reads/{id}/validate"

  - priority: 10
    category: business_constraint
    check: "lock-reads requires all assigned non-RETIRED meters of a CONSUMPTION utility to have exactly one VALIDATED read for the period"
    error_id: ERR_READS_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /billing-cycles/{id}/lock-reads"

  - priority: 11
    category: business_referential
    check: "allocate requires the cycle's VendorBill to be APPROVED"
    error_id: ERR_VENDOR_BILL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /billing-cycles/{id}/allocate"

  - priority: 12
    category: business_temporal
    check: "Late fee may be assessed only after due_date + GRACE_DAYS"
    error_id: ERR_NOT_YET_DELINQUENT
    http_status: 409
    applies_to: "POST /statements/{id}/assess-late-fee"

  - priority: 13
    category: business_fiscal
    check: "Dispute resolution credit must not exceed statement.total_due_cents"
    error_id: ERR_CREDIT_EXCEEDS_DUE
    http_status: 409
    applies_to: "POST /disputes/{id}/resolve"

  - priority: 14
    category: business_fiscal
    check: "OCC: expected_statement_version must equal current TenantStatement.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /statements/{id}/payments"

  - priority: 15
    category: business_constraint
    check: "Payment amount must be > 0 and <= balance_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 409
    applies_to: "POST /statements/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC instant (test-driving; enables time-gated late-fee/move-out checks)"
    roles: [PropertyManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601 for subsequent temporal checks"]

  - method: POST
    path: "/properties"
    description: "Create a Property"
    roles: [PropertyManager]
    code: 201
    input: [name, state_code, "recovery_cap_pct?", "common_area_pct?"]
    output: Property
    side_effects: ["integrity_status=OK, current_period_label=null"]

  - method: GET
    path: "/properties/{propertyId}"
    description: "Get a Property"
    roles: [PropertyManager, MeterTech, Tenant, Auditor]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/utilities"
    description: "Create a Utility config under a Property"
    roles: [PropertyManager]
    code: 201
    input: [property_id, utility_type, allocation_method, unit_of_measure, "monthly_admin_fee_cents?"]
    output: Utility
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/utilities/{utilityId}"
    description: "Get a Utility"
    roles: [PropertyManager, MeterTech, Tenant, Auditor]
    code: 200
    input: []
    output: Utility
    side_effects: []

  - method: GET
    path: "/utilities"
    description: "List Utilities filtered by property (reverse-reachability for Utility.property_id)"
    roles: [PropertyManager, MeterTech, Auditor]
    code: 200
    input: ["property_id?", "utility_type?"]
    output: Utility[]
    side_effects: []

  - method: POST
    path: "/units"
    description: "Create a Unit under a Property"
    roles: [PropertyManager]
    code: 201
    input: [property_id, unit_number, square_feet]
    output: Unit
    side_effects: ["status=VACANT; ERR_DUPLICATE_UNIT_NUMBER if unit_number reused"]

  - method: GET
    path: "/units/{unitId}"
    description: "Get a Unit"
    roles: [PropertyManager, MeterTech, Tenant, Auditor]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: GET
    path: "/units"
    description: "List Units filtered by property (reverse-reachability for Unit.property_id)"
    roles: [PropertyManager, MeterTech, Auditor]
    code: 200
    input: ["property_id?", "status?"]
    output: Unit[]
    side_effects: []

  - method: POST
    path: "/meters"
    description: "Create a Meter under a Property+Utility"
    roles: [PropertyManager]
    code: 201
    input: [property_id, utility_id, serial_number]
    output: Meter
    side_effects: ["status=UNASSIGNED; ERR_DUPLICATE_SERIAL if serial reused"]

  - method: GET
    path: "/meters/{meterId}"
    description: "Get a Meter"
    roles: [PropertyManager, MeterTech, Auditor]
    code: 200
    input: []
    output: Meter
    side_effects: []

  - method: GET
    path: "/meters"
    description: "List Meters filtered by property/utility/assigned-unit (reverse-reachability for Meter.property_id, Meter.utility_id, Meter.assigned_unit_id)"
    roles: [PropertyManager, MeterTech, Auditor]
    code: 200
    input: ["property_id?", "utility_id?", "assigned_unit_id?", "status?"]
    output: Meter[]
    side_effects: []

  - method: POST
    path: "/meters/{meterId}/assign"
    description: "Assign a Meter to a Unit for an effective window"
    roles: [PropertyManager]
    code: 200
    input: [unit_id, effective_from, "effective_to?"]
    output: Meter
    side_effects: ["status -> ASSIGNED; window recorded; overlap check"]

  - method: POST
    path: "/meters/{meterId}/retire"
    description: "Retire a Meter"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Meter
    side_effects: ["status -> RETIRED"]

  - method: POST
    path: "/leases"
    description: "Create a Lease (occupancy) on a Unit"
    roles: [PropertyManager]
    code: 201
    input: [unit_id, property_id, tenant_user_id, occupant_count, move_in_date]
    output: Lease
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/leases/{leaseId}"
    description: "Get a Lease"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "List Leases filtered by unit/property/tenant (reverse-reachability for Lease.unit_id, Lease.property_id)"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: ["unit_id?", "property_id?", "tenant_user_id?", "status?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/leases/{leaseId}/activate"
    description: "Activate a Lease (move-in)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status -> ACTIVE; Unit -> OCCUPIED; occupancy overlap check"]

  - method: POST
    path: "/leases/{leaseId}/give-notice"
    description: "Record move-out notice with intended move_out_date"
    roles: [PropertyManager, Tenant]
    code: 200
    input: [move_out_date]
    output: Lease
    side_effects: ["status -> NOTICE_GIVEN; notice_date stamped; move_out_date recorded"]

  - method: POST
    path: "/leases/{leaseId}/move-out"
    description: "Finalize move-out"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status -> MOVED_OUT; Unit -> VACANT"]

  - method: POST
    path: "/leases/{leaseId}/close"
    description: "Close a Lease after balances settled"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/vendor-bills"
    description: "Record a master utility VendorBill"
    roles: [PropertyManager]
    code: 201
    input: [property_id, utility_id, period_label, total_cost_cents]
    output: VendorBill
    side_effects: ["status=RECEIVED"]

  - method: GET
    path: "/vendor-bills/{vendorBillId}"
    description: "Get a VendorBill"
    roles: [PropertyManager, Auditor]
    code: 200
    input: []
    output: VendorBill
    side_effects: []

  - method: GET
    path: "/vendor-bills"
    description: "List VendorBills filtered by property/utility/period (reverse-reachability for VendorBill.property_id, VendorBill.utility_id)"
    roles: [PropertyManager, Auditor]
    code: 200
    input: ["property_id?", "utility_id?", "period_label?", "status?"]
    output: VendorBill[]
    side_effects: []

  - method: POST
    path: "/vendor-bills/{vendorBillId}/approve"
    description: "Approve a VendorBill; computes deduction + cap + recoverable"
    roles: [PropertyManager]
    code: 200
    input: []
    output: VendorBill
    side_effects: ["status -> APPROVED; common_area_cents, cap_cents, recoverable_cents computed"]

  - method: POST
    path: "/vendor-bills/{vendorBillId}/void"
    description: "Void a VendorBill"
    roles: [PropertyManager]
    code: 200
    input: []
    output: VendorBill
    side_effects: ["status -> VOIDED"]

  - method: POST
    path: "/meter-reads"
    description: "Create a PENDING MeterRead for a meter+period"
    roles: [MeterTech, PropertyManager]
    code: 201
    input: [meter_id, property_id, period_label, reading_value]
    output: MeterRead
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/meter-reads/{readId}"
    description: "Get a MeterRead"
    roles: [PropertyManager, MeterTech, Auditor]
    code: 200
    input: []
    output: MeterRead
    side_effects: []

  - method: GET
    path: "/meter-reads"
    description: "List MeterReads filtered by meter/property/period (reverse-reachability for MeterRead.meter_id, MeterRead.property_id)"
    roles: [PropertyManager, MeterTech, Auditor]
    code: 200
    input: ["meter_id?", "property_id?", "period_label?", "status?"]
    output: MeterRead[]
    side_effects: []

  - method: POST
    path: "/meter-reads/{readId}/submit"
    description: "Submit a read (or re-read) for validation"
    roles: [MeterTech]
    code: 200
    input: ["reading_value?"]
    output: MeterRead
    side_effects: ["status -> SUBMITTED; consumption recomputed"]

  - method: POST
    path: "/meter-reads/{readId}/validate"
    description: "Validate a submitted read"
    roles: [PropertyManager]
    code: 200
    input: []
    output: MeterRead
    side_effects: ["status -> VALIDATED; Meter.last_validated_reading updated; siblings SUPERSEDED"]

  - method: POST
    path: "/meter-reads/{readId}/flag"
    description: "Flag a suspicious submitted read"
    roles: [PropertyManager]
    code: 200
    input: [flag_reason]
    output: MeterRead
    side_effects: ["status -> FLAGGED"]

  - method: POST
    path: "/meter-reads/{readId}/request-re-read"
    description: "Request a re-read of a flagged read (re-read cycle)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: MeterRead
    side_effects: ["status -> RE_READ_REQUESTED; re_read_count += 1"]

  - method: POST
    path: "/billing-cycles"
    description: "Open a BillingCycle for a property+utility+period"
    roles: [PropertyManager]
    code: 201
    input: [property_id, utility_id, vendor_bill_id, period_label, period_start, period_end]
    output: BillingCycle
    side_effects: ["status=OPEN; Property.current_period_label = period_label"]

  - method: GET
    path: "/billing-cycles/{cycleId}"
    description: "Get a BillingCycle"
    roles: [PropertyManager, Auditor]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []

  - method: GET
    path: "/billing-cycles"
    description: "List BillingCycles filtered by property/utility/period/vendor-bill (reverse-reachability for BillingCycle.property_id, BillingCycle.utility_id, BillingCycle.vendor_bill_id)"
    roles: [PropertyManager, Auditor]
    code: 200
    input: ["property_id?", "utility_id?", "period_label?", "vendor_bill_id?", "status?"]
    output: BillingCycle[]
    side_effects: []

  - method: POST
    path: "/billing-cycles/{cycleId}/lock-reads"
    description: "Lock reads for the cycle"
    roles: [PropertyManager]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["status -> READS_LOCKED"]

  - method: POST
    path: "/billing-cycles/{cycleId}/allocate"
    description: "Run consumption or RUBS allocation over recoverable_cents"
    roles: [PropertyManager]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["status -> ALLOCATED; per-unit shares computed; VendorBill -> ALLOCATED; allocated_total_cents set"]

  - method: POST
    path: "/billing-cycles/{cycleId}/issue-statements"
    description: "Create tenant statements with prorated admin fee + due date"
    roles: [PropertyManager]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["status -> STATEMENTS_ISSUED; one TenantStatement per eligible Lease"]

  - method: POST
    path: "/billing-cycles/{cycleId}/close"
    description: "Close the cycle (recompute allocation invariant)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["status -> CLOSED; Property.integrity_status recomputed"]

  - method: GET
    path: "/statements/{statementId}"
    description: "Get a TenantStatement"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: []
    output: TenantStatement
    side_effects: []

  - method: GET
    path: "/statements"
    description: "List TenantStatements filtered by cycle/lease/unit/property (reverse-reachability for TenantStatement.billing_cycle_id, lease_id, unit_id, property_id)"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: ["billing_cycle_id?", "lease_id?", "unit_id?", "property_id?", "payment_status?"]
    output: TenantStatement[]
    side_effects: []

  - method: POST
    path: "/statements/{statementId}/mark-delivered"
    description: "Mark a statement delivered (delivery dimension only)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TenantStatement
    side_effects: ["delivery_status -> DELIVERED"]

  - method: POST
    path: "/statements/{statementId}/assess-late-fee"
    description: "Assess late fee after grace, moving payment dimension to DELINQUENT"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TenantStatement
    side_effects: ["late_fee_cents computed; payment_status -> DELINQUENT; balances recomputed; version += 1"]

  - method: POST
    path: "/statements/{statementId}/send-to-collections"
    description: "Escalate a delinquent statement to collections"
    roles: [PropertyManager]
    code: 200
    input: []
    output: TenantStatement
    side_effects: ["payment_status -> IN_COLLECTIONS; version += 1"]

  - method: POST
    path: "/statements/{statementId}/payments"
    description: "Post a tenant payment against a statement (OCC-guarded)"
    roles: [Tenant, PropertyManager]
    code: 201
    input: [amount_cents, expected_statement_version]
    output: Payment
    side_effects: ["Payment POSTED; statement amount_paid_cents/balance_due_cents/payment_status updated; TenantStatement.version += 1"]

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a Payment"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List Payments filtered by statement/property (reverse-reachability for Payment.statement_id, Payment.property_id)"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: ["statement_id?", "property_id?", "status?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/payments/{paymentId}/reverse"
    description: "Reverse a posted payment (compensation)"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> REVERSED; statement balances + payment_status recomputed; version += 1"]

  - method: POST
    path: "/statements/{statementId}/disputes"
    description: "Open a dispute against a statement (optionally requesting a re-read)"
    roles: [Tenant, PropertyManager]
    code: 201
    input: [reason, "requested_re_read?", "credit_amount_cents?"]
    output: Dispute
    side_effects: ["status=OPEN; tenant_user_id stamped from caller"]

  - method: GET
    path: "/disputes/{disputeId}"
    description: "Get a Dispute"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List Disputes filtered by statement/property (reverse-reachability for Dispute.statement_id, Dispute.property_id)"
    roles: [PropertyManager, Tenant, Auditor]
    code: 200
    input: ["statement_id?", "property_id?", "status?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/disputes/{disputeId}/start-review"
    description: "Begin review; if requested_re_read, trigger a re-read cascade"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW; optional re-read cascade"]

  - method: POST
    path: "/disputes/{disputeId}/resolve"
    description: "Resolve a dispute, granting credit to the statement"
    roles: [PropertyManager]
    code: 200
    input: ["credit_amount_cents?"]
    output: Dispute
    side_effects: ["status -> RESOLVED; statement credit applied; balances recomputed; version += 1"]

  - method: POST
    path: "/disputes/{disputeId}/reject"
    description: "Reject a dispute with no credit"
    roles: [PropertyManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/disputes/{disputeId}/reopen"
    description: "Reopen a resolved dispute (reopen cycle; reverses prior credit)"
    roles: [Tenant, PropertyManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW; reopen_count += 1; prior credit reversed; version += 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / existence / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive amount, percentage out of range" }
  - { id: ERR_NOT_STATEMENT_OWNER, http: 403, condition: "Tenant acting on a statement/lease/dispute/payment whose lease tenant_user_id != caller" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state allowing this transition" }
  # --- entity-specific not-found ---
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Referenced Unit missing or ARCHIVED" }
  # --- meter / read ---
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "Meter serial_number already used for the property" }
  - { id: ERR_METER_ASSIGNMENT_OVERLAP, http: 409, condition: "Assignment window overlaps another assignment of the same Unit+Utility (half-open)" }
  - { id: ERR_METER_HAS_PENDING_READS, http: 409, condition: "Cannot retire a meter with SUBMITTED/RE_READ_REQUESTED reads in an OPEN cycle" }
  - { id: ERR_READING_OUT_OF_RANGE, http: 409, condition: "Read consumption exceeds HIGH_READING_MULTIPLE of last validated reading; must be flagged, not validated" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Submit attempted while the matching BillingCycle is not OPEN" }
  # --- unit ---
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "Unit number already used (non-archived) for the property" }
  # --- lease ---
  - { id: ERR_LEASE_OCCUPANCY_OVERLAP, http: 409, condition: "Lease occupancy interval overlaps another non-terminal lease of the same Unit (move_out inclusive)" }
  - { id: ERR_INVALID_MOVE_OUT_DATE, http: 422, condition: "move_out_date earlier than move_in_date" }
  - { id: ERR_MOVE_OUT_NOT_DUE, http: 409, condition: "move-out finalized before the clock passes move_out_date" }
  - { id: ERR_LEASE_HAS_OPEN_BALANCE, http: 409, condition: "Cannot close a lease with statements still owing" }
  # --- vendor bill / cycle ---
  - { id: ERR_VENDOR_BILL_NOT_APPROVED, http: 409, condition: "allocate attempted while the cycle's VendorBill is not APPROVED" }
  - { id: ERR_VENDOR_BILL_IN_USE, http: 409, condition: "Cannot void a VendorBill referenced by a non-OPEN BillingCycle" }
  - { id: ERR_READS_NOT_VALIDATED, http: 409, condition: "lock-reads while some consumption meters lack a single VALIDATED read for the period" }
  - { id: ERR_NO_BILLABLE_LEASES, http: 409, condition: "issue-statements with no lease occupying a billed unit during the period" }
  - { id: ERR_CYCLE_HAS_OPEN_DISPUTES, http: 409, condition: "close while a statement of the cycle has an OPEN/UNDER_REVIEW dispute" }
  - { id: ERR_CYCLE_CLOSED, http: 409, condition: "Reopen/reverse attempted while the parent BillingCycle is CLOSED" }
  # --- statement / payment / late fee ---
  - { id: ERR_NOT_YET_DELINQUENT, http: 409, condition: "assess-late-fee before due_date + GRACE_DAYS" }
  - { id: ERR_NOT_YET_COLLECTIONS, http: 409, condition: "send-to-collections before COLLECTIONS_GRACE_DAYS past due_date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_statement_version != current TenantStatement.version" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 409, condition: "Payment amount_cents > balance_due_cents" }
  # --- dispute ---
  - { id: ERR_CREDIT_EXCEEDS_DUE, http: 409, condition: "Dispute resolution credit exceeds statement total_due_cents" }
  - { id: ERR_MAX_REOPENS_REACHED, http: 409, condition: "Dispute reopened more than MAX_REOPENS times" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Operator: configures property/utility/units/meters, records & approves vendor bills, validates reads, runs cycles, issues statements, resolves disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /properties — Create property"
      - "POST /utilities — Create utility"
      - "POST /units — Create unit"
      - "POST /meters — Create meter"
      - "POST /meters/{id}/assign — Assign meter"
      - "POST /meters/{id}/retire — Retire meter"
      - "POST /leases — Create lease"
      - "POST /leases/{id}/activate — Activate lease"
      - "POST /leases/{id}/move-out — Finalize move-out"
      - "POST /leases/{id}/close — Close lease"
      - "POST /vendor-bills — Record vendor bill"
      - "POST /vendor-bills/{id}/approve — Approve vendor bill"
      - "POST /vendor-bills/{id}/void — Void vendor bill"
      - "POST /meter-reads/{id}/validate — Validate read"
      - "POST /meter-reads/{id}/flag — Flag read"
      - "POST /meter-reads/{id}/request-re-read — Request re-read"
      - "POST /billing-cycles — Open cycle"
      - "POST /billing-cycles/{id}/lock-reads — Lock reads"
      - "POST /billing-cycles/{id}/allocate — Allocate"
      - "POST /billing-cycles/{id}/issue-statements — Issue statements"
      - "POST /billing-cycles/{id}/close — Close cycle"
      - "POST /statements/{id}/mark-delivered — Mark delivered"
      - "POST /statements/{id}/assess-late-fee — Assess late fee"
      - "POST /statements/{id}/send-to-collections — Send to collections"
      - "POST /payments/{id}/reverse — Reverse payment"
      - "POST /disputes/{id}/start-review — Start review"
      - "POST /disputes/{id}/resolve — Resolve dispute"
      - "POST /disputes/{id}/reject — Reject dispute"
      - "POST /_clock/set_current_utc — Set clock (test-driving)"
    shared_operations:
      - "POST /meter-reads — Create read (shared with MeterTech)"
      - "POST /leases/{id}/give-notice — Give notice (shared with Tenant)"
      - "POST /statements/{id}/payments — Post payment (shared with Tenant)"
      - "POST /statements/{id}/disputes — Open dispute (shared with Tenant)"
      - "POST /disputes/{id}/reopen — Reopen dispute (shared with Tenant)"

  - name: MeterTech
    description: "Field technician: creates and submits meter reads / re-reads"
    identity: "opaque"
    exclusive_operations:
      - "POST /meter-reads/{id}/submit — Submit read or re-read"
    shared_operations:
      - "POST /meter-reads — Create read (shared with PropertyManager)"

  - name: Tenant
    description: "Resident: views own statements, pays them, opens/reopens disputes, gives notice on own lease. X-User-ID is an opaque tenant identifier matched against Lease.tenant_user_id for ownership."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /statements/{id}/payments — Post payment (shared with PropertyManager)"
      - "POST /statements/{id}/disputes — Open dispute (shared with PropertyManager)"
      - "POST /disputes/{id}/reopen — Reopen dispute (shared with PropertyManager)"
      - "POST /leases/{id}/give-notice — Give notice (shared with PropertyManager)"

  - name: Auditor
    description: "Read-only oversight across all resources"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints across all collections"
