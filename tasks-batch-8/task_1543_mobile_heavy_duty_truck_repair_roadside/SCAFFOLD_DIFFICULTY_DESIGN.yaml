      - name: rate_card_closed_window_touch_conflicts
        grounds:
          - validations[priority=18]
          - entities.RateCard.fields.effective_to
        distinguishing_aspect: |
          Third interval semantics (closed-closed on RateCard.effective windows, a different
          resource class than Technician or tow unit): a new card whose window STARTS exactly on
          an existing card's end date conflicts (both inclusive); starting the next day is legal.
        test_recipe:
          setup: ["rate card A exists covering 2026-01-01T00:00:00Z through 2026-06-30T23:59:59Z"]
          setup_api_calls:
