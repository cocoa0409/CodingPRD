          assert:
            - "HTTP 201, PortRequest.status == \"SUBMITTED\", number_block_id == ${blk_id}, from_carrier_id == ${a_id}, to_carrier_id == ${b_id}, supersedes_port_request_id is null, concurred_at is null"
            - "GET /numbering/port-requests with number_block_id == ${blk_id} returns total_count == 1, and the same row is returned when filtering on from_carrier_id == ${a_id} or to_carrier_id == ${b_id}"
            - "GET /numbering/blocks/${blk_id} is unchanged: routing_status == \"LERG_PUBLISHED\", current_lrn == \"6145580000\", npac_db_version == 1 - no routing is written until activation"

      - name: rate_center_read_exposes_every_derived_counter
        claim_type: Computed read
        grounds: ["endpoints[GET /numbering/rate-centers/{rate_center_id}]", "calculations.rate_center_aggregate_utilization_pct", "entities.RateCenter.fields.accepts_initial_requests"]
        distinguishing_aspect: "A single read must reconcile four independently derived numbers at once: available_block_count 3 and assigned_block_count 2 from the block inventory, aggregate_utilization_pct 68.89 from carrier A's effective filing (3100/4500), and accepts_initial_requests false because the code slipped into JEOPARDY at three available blocks."
        test_recipe:
          setup: ["COLUMBUS under NPA 614 holds five blocks: 614-554-0..2 unassigned and 614-554-3 and 614-554-4 loaded to carrier A with mark_activated true. A is licensed and VERIFIED and its 2026-H1 filing (blocks_held 5, assigned 2500, intermediate 400, reserved 200, aging 200, administrative 300) is SUBMITTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 1 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 2 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 3, holder_carrier_id: "${a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 4, holder_carrier_id: "${a_id}", mark_activated: true }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 2500, numbers_intermediate: 400, numbers_reserved: 200, numbers_aging: 200, numbers_administrative: 300, blocks_held_at_period_end: 5, forecast_quarters: [1800, 1800, 1800, 1800] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { f_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings/${f_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
          trigger:
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: RegulatoryApprover
              as_user_id: "approver-1"
              captures: { available: "$.data.available_block_count", aggregate: "$.data.aggregate_utilization_pct" }
          assert:
            - "HTTP 200, ${available} == 3, assigned_block_count == 2, ${aggregate} == 68.89"
            - "RateCenter.jeopardy_flag == true and accepts_initial_requests == false, because NPA 614 has only 3 POOL_AVAILABLE blocks"
            - "RateCenter.pooling_status == \"NON_POOLED\", pending_request_count == 0, last_donation_block_count == 0"

      - name: activation_confirmation_is_conditional_on_the_open_window
        claim_type: Conditional action
        grounds: ["endpoints[POST /numbering/blocks/{block_id}/activation-confirmations]", "validations[priority=22]", "errors[ERR_ACTIVATION_WINDOW_EXPIRED]"]
        distinguishing_aspect: "The confirmation is allowed only at or before activation_due_at: at 2027-01-29T00:00:00Z - one day past the 180-day window and before any sweep has run - the same call that would have succeeded a day earlier returns ERR_ACTIVATION_WINDOW_EXPIRED (409) and the block stays RESERVED with activated_at null."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED and block 614-554-0 was loaded to it at 2026-08-01T00:00:00Z without mark_activated, so it is RESERVED with activation_due_at 2027-01-28T00:00:00Z. The clock now reads 2027-01-29T00:00:00Z and no reclamation sweep has been run."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, holder_carrier_id: "${a_id}" }
              as: NumberingAdministrator
              captures: { blk_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-29T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/blocks/${blk_id}/activation-confirmations"
              payload: { activated_number_count: 40 }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_ACTIVATION_WINDOW_EXPIRED\""
            - "GET /numbering/blocks/${blk_id} reads allocation_status == \"RESERVED\", activated_at is null, activation_due_at == \"2027-01-28T00:00:00Z\""
            - "GET /numbering/reclamation-orders with number_block_id == ${blk_id} returns total_count == 0 - the expiry alone issues no order, only a sweep does"
  - section: errors
    instances:
      - name: block_not_found_for_unknown_block_id
        claim_type: Not Found
        grounds: ["errors[ERR_BLOCK_NOT_FOUND]", "validations[priority=4]", "endpoints[GET /numbering/blocks/{block_id}]"]
        distinguishing_aspect: "A well-formed UUID that names no NumberBlock returns the block-specific 404 code, not the generic carrier or rate-center one, and the read is refused before any pooling or routing logic runs."
        test_recipe:
          setup: ["No NumberBlock rows exist at all."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/blocks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404, response_type == \"error\", data.error_id == \"ERR_BLOCK_NOT_FOUND\""

      - name: allocation_request_not_found_on_review_of_unknown_request
        claim_type: Not Found
        grounds: ["errors[ERR_ALLOCATION_REQUEST_NOT_FOUND]", "validations[priority=4]", "endpoints[POST /numbering/allocation-requests/{request_id}/reviews]"]
        distinguishing_aspect: "The path id is resolved at priority 4, so a REQUEST_INFO review against an unknown request id returns 404 and never reaches the action-role check at priority 7 or the info-cycle ceiling at priority 11."
        test_recipe:
          setup: ["No AllocationRequest rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/allocation-requests/00000000-0000-4000-8000-000000000000/reviews"
              payload: { action: "REQUEST_INFO", info_note: "please attach the switch inventory" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_ALLOCATION_REQUEST_NOT_FOUND\" (not ERR_ACTION_ROLE_MISMATCH, not ERR_INFO_CYCLE_LIMIT_REACHED)"

      - name: filing_not_found_for_unknown_filing_id
        claim_type: Not Found
        grounds: ["errors[ERR_FILING_NOT_FOUND]", "endpoints[GET /numbering/utilization-filings/{filing_id}]"]
        distinguishing_aspect: "The filing read is the only endpoint that can surface ERR_FILING_NOT_FOUND on a path id, and it does so for a RegulatoryApprover who is otherwise allowed to read every filing."
        test_recipe:
          setup: ["No UtilizationFiling rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/utilization-filings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryApprover
              as_user_id: "approver-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_FILING_NOT_FOUND\""

      - name: audit_finding_not_found_for_unknown_finding_id
        claim_type: Not Found
        grounds: ["errors[ERR_AUDIT_FINDING_NOT_FOUND]", "endpoints[GET /numbering/audit-findings/{finding_id}]"]
        distinguishing_aspect: "An AuditFinding is addressed by its own top-level path even though it is created underneath a filing, so an unknown finding id must yield the finding-specific 404 rather than ERR_FILING_NOT_FOUND."
        test_recipe:
          setup: ["No AuditFinding rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/audit-findings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NumberingAdministrator
              as_user_id: "admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_AUDIT_FINDING_NOT_FOUND\" (not ERR_FILING_NOT_FOUND)"

      - name: reclamation_order_not_found_for_unknown_order_id
        claim_type: Not Found
        grounds: ["errors[ERR_RECLAMATION_ORDER_NOT_FOUND]", "endpoints[GET /numbering/reclamation-orders/{order_id}]"]
        distinguishing_aspect: "ReclamationOrder rows are only ever minted by a sweep or a licence revocation, so the not-found path is the only way an unknown order id can be probed."
        test_recipe:
          setup: ["No ReclamationOrder rows exist - no sweep has run."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/reclamation-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NumberingAdministrator
              as_user_id: "admin-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_RECLAMATION_ORDER_NOT_FOUND\""

      - name: relief_plan_not_found_for_unknown_plan_id
        claim_type: Not Found
        grounds: ["errors[ERR_RELIEF_PLAN_NOT_FOUND]", "endpoints[GET /numbering/relief-plans/{plan_id}]"]
        distinguishing_aspect: "A PublicCommenter may read relief plans, so the 404 has to be produced for a role that has no other visibility into the system at all."
        test_recipe:
          setup: ["No ReliefPlan rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/relief-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PublicCommenter
              as_user_id: "commenter-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_RELIEF_PLAN_NOT_FOUND\" (the commenter role is permitted on this endpoint, so it is not ERR_ROLE_NOT_PERMITTED)"

      - name: port_request_not_found_for_unknown_port_request_id
        claim_type: Not Found
        grounds: ["errors[ERR_PORT_REQUEST_NOT_FOUND]", "endpoints[GET /numbering/port-requests/{port_request_id}]"]
        distinguishing_aspect: "PortingOperations reaches the port request by its own id and gets the port-specific 404, distinguishing it from the block-level ERR_BLOCK_NOT_FOUND that the same workflow can raise."
        test_recipe:
          setup: ["No PortRequest rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/port-requests/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PortingOperations
              as_user_id: "porting-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_PORT_REQUEST_NOT_FOUND\""

      - name: rate_center_not_found_when_the_body_names_an_unknown_rate_center
        claim_type: Not Found
        grounds: ["errors[ERR_RATE_CENTER_NOT_FOUND]", "validations[priority=5]", "endpoints[POST /numbering/allocation-requests]"]
        distinguishing_aspect: "Here the carrier foreign key resolves and only rate_center_id is unknown, so the body-FK sweep at priority 5 reports the rate center - the mirror image of the ordering corner where both ids are unknown and the carrier wins."
        test_recipe:
          setup: ["Carrier A (OCN 1234) is licensed and VERIFIED. NPA 614 and rate center COLUMBUS exist, and COLUMBUS.version is captured, but the request body points at a rate center id that does not exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id", rc_v: "$.data.version" }
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "00000000-0000-4000-8000-000000000000", request_type: "GROWTH", requested_block_count: 1, justification: "growth against an unknown rate center", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_RATE_CENTER_NOT_FOUND\""
            - "No AllocationRequest row was created and GET /numbering/rate-centers/${rc_id} still reads pending_request_count == 0"

      - name: carrier_representative_filing_for_another_carrier_is_not_the_owner
        claim_type: Violation → Error
        grounds: ["errors[ERR_NOT_RESOURCE_OWNER]", "validations[priority=6]", "endpoints[POST /numbering/utilization-filings]"]
        distinguishing_aspect: "The role is correct and every payload key is valid; only the X-User-ID differs from the carrier_id in the body, which is the sole trigger for ERR_NOT_RESOURCE_OWNER and lands at 403 rather than 404."
        test_recipe:
          setup: ["Carriers A (OCN 1234) and B (OCN 5678) both exist, licensed and VERIFIED. NPA 614 / rate center COLUMBUS exists. Carrier B's representative tries to file A's utilization report."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 36 }
              as: NumberingAdministrator
              captures: { b_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 1300, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 2, forecast_quarters: [600, 600, 600, 600] }
              as: CarrierRepresentative
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
