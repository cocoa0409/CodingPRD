            - { call: "POST /abatement/assignments", payload: { project_id: "${p_id}", worker_id: "${w_id}", role_on_site: "SUPERVISOR", start_at: "2026-08-11T00:00:00Z", end_at: "2026-09-10T00:00:00Z" }, as: ContractorAdmin, captures: { a1_id: "$.data.id" } }
          trigger:
