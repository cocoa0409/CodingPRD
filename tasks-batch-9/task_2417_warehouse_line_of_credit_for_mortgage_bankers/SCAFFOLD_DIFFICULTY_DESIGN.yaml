        grounds:
          - state_machines.WarehouseFacility.status
          - state_machines.WarehouseFacility.status.ACTIVE_to_RESTRICTED
          - state_machines.WarehouseFacility.status.RESTRICTED_to_ACTIVE
          - state_machines.WarehouseFacility.status.SUSPENDED_to_ACTIVE
          - endpoints["POST /facilities/{id}/suspend"]
          - endpoints["POST /facilities/{id}/reinstate"]
        distinguishing_aspect: |
          The facility status graph is cyclic with no terminal state: ACTIVE -> RESTRICTED ->
          ACTIVE -> SUSPENDED -> ACTIVE -> RESTRICTED is a legal walk, and re-entry into
          RESTRICTED after a full loop must recompute the margin call from scratch (98,000,000
          on the first entry, 196,000,000 on the second) rather than reuse the first snapshot.
