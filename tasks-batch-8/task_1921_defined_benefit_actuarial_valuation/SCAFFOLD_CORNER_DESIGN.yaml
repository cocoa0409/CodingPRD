        payload:
          plan_year: 2028
          source_label: c1
        as: PlanAdmin
        captures:
          batch_id: $.data.id
      trigger:
      - call: POST /v1/census-batches/${batch_id}/participants
        payload:
          participants:
          - external_ref: GOOD
            date_of_birth: '1966-01-01'
            status: ACTIVE
            years_of_service: 1
            annual_compensation: 50000
          - external_ref: BAD
            date_of_birth: '1964-01-01'
            status: RETIREE
            current_annual_benefit: 1000
        as: PlanAdmin
        captures:
          count: $.data.participant_count
      assert:
      - http 200 with participant_count == 2 (rows are stored; row-level validity is adjudicated at screening, not at append)
      - GET /v1/census-batches/${batch_id}/participants returns both rows
