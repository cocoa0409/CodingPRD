        excluded_because:
          difficulty_instance: transitive_cascade / subsidy_reversal_four_hop_cascade_blocks_settlement
          rationale: "The aggregation's behaviour under reversal, including the exclusion of REVERSAL mirrors from the sum, is asserted hop by hop in the named §1.8 instance."

      - name: corner_sold_lot_percentage_at_the_threshold
