    output: RestructuringDetermination
    roles: [HudFieldOffice]
    side_effects:
      - "Sets determination_state = APPROVED and approved_by_user_id = X-User-ID."
      - "Sets post_restructure_rent_per_unit_cents = market_rent_per_unit_cents for a MUTM_ELIGIBLE determination and round_half_up(M2M_RENT_PCT_OF_MARKET * market_rent_per_unit_cents) for an M2M_REFERRED determination."
      - "Writes post_restructure_rent_per_unit_cents onto RenewalCase.ocaf_rent_per_unit_cents and increments the case's version by 1, so a later approve-rents stamps the restructured rent."
  - method: GET
    path: /pbra/restructuring-determinations/{id}
    purpose: "Read one restructuring determination."
    input: []
    output: RestructuringDetermination
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice]
