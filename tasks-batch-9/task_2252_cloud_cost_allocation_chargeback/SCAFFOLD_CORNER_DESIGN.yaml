                payload: { name: "Network", methodology: "EVEN_SPLIT", participant_business_unit_ids: ["${bu_id}"] }
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
                captures: { pool_id: "$.data.id" }
            trigger:
              - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "POST /finops/shared-cost-pools/${pool_id}/seal"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
              - call: "GET /finops/shared-cost-pools/${pool_id}"
                payload: {}
                as: FinOpsAnalyst
                as_user_id: "analyst-1"
            assert:
              - "First seal: HTTP 200, data.status == \"SEALED\", data.version == 2."
              - "Second seal: HTTP 409 with data.error_id == \"ERR_POOL_STATE_INVALID\"."
              - "Final read: data.status == \"SEALED\" and data.version == 2 — the replay did not bump the version."

