            - { call: "POST /licensure/endorsements/${end1}/state", payload: { to_status: "ACTIVE" }, as: CredentialEvaluator }
            - { call: "POST /licensure/endorsements/${end1}/state", payload: { to_status: "REMOVED" }, as: Applicant, as_user_id: "${ap}" }
          assert:
            - "Endorsement.${end1}.status == 'REMOVED'"
            - "count of Endorsements on License.${lic} with status == 'ACTIVE' == 0 before add and after remove"
