scaffold_corner_design:

  # ===================================================================
  # Entities — creation, required fields, computed/system/default, not-found
  # ===================================================================
  - section: entities
    instances:
      - name: create_service_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.ServicePlan, endpoints]
        distinguishing_aspect: "POST /service-plans with all required fields -> 201; response data carries tier, trade, annual_fee_cents, included_visits_per_year, extra_visit_fee_cents, sla_response_hours, parts_discount_pct, plus system id/version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /home-services/service-plans"
              payload: { tier: "BASIC", trade: "PEST", annual_fee_cents: 12000, included_visits_per_year: 4, extra_visit_fee_cents: 5000, sla_response_hours: 24, parts_discount_pct: 0.0 }
              as: ContractAdmin
              captures: { plan_id: $.data.id, ver: $.data.version }
          assert:
            - "http status == 201"
            - "ServicePlan.${plan_id}.tier == BASIC"
            - "ServicePlan.${plan_id}.active == true"
            - "ServicePlan.${plan_id}.version == 1"

      - name: create_membership_missing_plan_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Membership.fields.plan_id, "validations[priority=5]"]
        distinguishing_aspect: "POST /memberships omitting required plan_id -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A customer and a site exist"]
          setup_api_calls:
            - call: "POST /home-services/customers"
              payload: { full_name: "Tina Vo", email: "tina@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "20 Teak St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: create_service_plan_invalid_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.ServicePlan.fields.tier, "validations[priority=5]"]
        distinguishing_aspect: "POST /service-plans with tier not in {BASIC,PLUS,PREMIUM} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /home-services/service-plans"
              payload: { tier: "GOLD", trade: "HVAC", annual_fee_cents: 1, included_visits_per_year: 1, extra_visit_fee_cents: 1, sla_response_hours: 1, parts_discount_pct: 0.0 }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: get_membership_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Membership, "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /memberships/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /home-services/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: membership_auto_renew_defaults_from_plan_default
        claim_type: Defaults
        grounds: [entities.Membership.fields.auto_renew, entities.ServicePlan.fields.auto_renew_default]
        distinguishing_aspect: "Creating a membership without auto_renew copies plan.auto_renew_default (true by default) onto the membership."
        test_recipe:
          setup: ["A PLUS HVAC plan (auto_renew_default true by omission), a customer and site exist"]
          setup_api_calls:
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Uma Kor", email: "uma@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "21 Vine St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id, ar: $.data.auto_renew }
          assert:
            - "Membership.${mem_id}.auto_renew == true"
            - "Membership.${mem_id}.status == PENDING_ACTIVATION"

      - name: equipment_current_charge_initialized_from_nameplate_computed
        claim_type: Computed Fields
        grounds: [entities.Equipment.fields.current_charge_grams, entities.Equipment.fields.nameplate_charge_grams]
        distinguishing_aspect: "On equipment create, current_charge_grams is server-computed to equal nameplate_charge_grams regardless of any client-sent value."
        test_recipe:
          setup: ["A customer and site exist"]
          setup_api_calls:
            - call: "POST /home-services/customers"
              payload: { full_name: "Vic Lar", email: "vic@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "22 Wren St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /home-services/equipment"
              payload: { site_id: "${site_id}", model: "HP-2", refrigerant_type: "R32", nameplate_charge_grams: 2500, warranty_expires_at: "2030-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { eq_id: $.data.id, cc: $.data.current_charge_grams }
          assert:
            - "Equipment.${eq_id}.current_charge_grams == 2500"
            - "Equipment.${eq_id}.operational_status == OPERATIONAL"
            - "Equipment.${eq_id}.warranty_status == IN_WARRANTY"

  # ===================================================================
  # State machines — invalid transitions, terminal lockdown, initial state
  # ===================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_membership_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Membership.PENDING_ACTIVATION_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling activate on an already-ACTIVE membership -> ERR_INVALID_STATE (409); no second annual-fee accrual."
        test_recipe:
          setup: ["An ACTIVE membership (already activated once)"]
          setup_api_calls:
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Wes Tan", email: "wes@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "23 Xyl St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
          trigger:
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: depart_from_scheduled_visit_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceVisit.DISPATCHED_to_EN_ROUTE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "depart requires DISPATCHED; calling it on a SCHEDULED (undispatched) visit -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED visit that has not been dispatched"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Xan Pal", email: "xan@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "24 Yarn St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /home-services/service-visits/${v_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_completed_visit_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceVisit.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED visit is terminal; POST cancel on it -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A visit driven all the way to COMPLETED"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Yan Mor", email: "yan@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "25 Zin St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v_id: $.data.id }
            - call: "POST /home-services/service-visits/${v_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${v_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /home-services/service-visits/${v_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: visit_recall_returns_to_scheduled_and_clears_tech
        claim_type: Valid Transition
        grounds: [state_machines.ServiceVisit.DISPATCHED_to_SCHEDULED, entities.ServiceVisit.fields.technician_id]
        distinguishing_aspect: "recall on a DISPATCHED visit returns status SCHEDULED and clears technician_id (revert edge)."
        test_recipe:
          setup: ["A DISPATCHED visit assigned to a tech"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Zoe Han", email: "zoe@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "26 Arc St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v_id: $.data.id }
            - call: "POST /home-services/service-visits/${v_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /home-services/service-visits/${v_id}/recall"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "ServiceVisit.${v_id}.status == SCHEDULED"
            - "ServiceVisit.${v_id}.technician_id == null"

      - name: mark_no_show_before_window_end_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceVisit.DISPATCHED_to_NO_SHOW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-no-show requires clock >= window_end; with clock before window_end the precondition fails -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DISPATCHED visit window 2026-07-02 09:00-11:00 with clock still at 2026-07-01"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Abe Doe", email: "abe@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "27 Bay St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v_id: $.data.id }
            - call: "POST /home-services/service-visits/${v_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /home-services/service-visits/${v_id}/mark-no-show"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: auto_renew_clock_advance_auto_accepts_offer
        claim_type: Valid Transition
        grounds: [state_machines.RenewalOffer.PENDING_to_AUTO_ACCEPTED, state_machines.Membership.RENEWAL_PENDING_to_ACTIVE]
        distinguishing_aspect: "Advancing the clock past expires_at on an auto_renew membership auto-accepts the offer (AUTO_ACCEPTED) and returns the membership to ACTIVE with term_index 2."
        test_recipe:
          setup: ["ACTIVE membership with auto_renew true and a PENDING offer expiring 2026-07-15"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10, auto_renew_default: true }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Bea Fox", email: "bea@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "28 Cove St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}", auto_renew: true }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/memberships/${mem_id}/renewal-offers"
              payload: { offered_plan_id: "${plan_id}", expires_at: "2026-07-15T00:00:00Z", expected_membership_version: "${mem_v1}" }
              as: ContractAdmin
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /home-services/_clock/advance"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: ContractAdmin
          assert:
            - "RenewalOffer.${offer_id}.status == AUTO_ACCEPTED"
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.term_index == 2"

      - name: no_auto_renew_clock_advance_expires_offer_membership_lapses
        claim_type: Valid Transition
        grounds: [state_machines.RenewalOffer.PENDING_to_EXPIRED, state_machines.Membership.RENEWAL_PENDING_to_LAPSED]
        distinguishing_aspect: "Advancing the clock past expires_at on a non-auto_renew membership expires the offer (EXPIRED) and lapses the membership (LAPSED)."
        test_recipe:
          setup: ["ACTIVE membership with auto_renew false and a PENDING offer expiring 2026-07-15"]
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10, auto_renew_default: false }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Cy Gat", email: "cy@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "29 Dock St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}", auto_renew: false }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
