            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["EVICTION_DEFENSE"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Dup", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app1_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app1_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app1_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Landlord LLC", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app2_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app2_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app2_id}/conflict-checks", payload: { result: "POTENTIAL_CONFLICT", notes: "opposing party is a former client" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
          trigger:
            - { call: "POST /intake-applications/${app2_id}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONFLICT_UNRESOLVED (safety tier) even though ERR_DUPLICATE_OPEN_CASE (constraint tier) is also violated"
            - "No second Case is created for client + EVICTION_DEFENSE"

  - rule_id: boundary_precision_check
    instances:
      - name: income_percentage_exactly_at_125_cap
        grounds:
          - calculations.poverty_percentage_screen
          - validations[priority=13]
        distinguishing_aspect: |
          Metric = income poverty percentage, endpoint = POST /intake-applications/{id}/screen. The cap is
          INCLUSIVE (<= 125.00): gross 1,882,500 cents lands exactly on 125.00 and is ELIGIBLE; one cent more
          (1,882,651) rounds to 125.01 and is INELIGIBLE. The sibling instance uses a different metric
          (caseload units) on a different endpoint (/cases/{id}/assign).
        test_recipe:
          setup:
            - "VenueRule exists; two clients, both household_size 1: A at exactly 125.00% FPL (1,882,500 cents), B one cent over (1,882,651)"
          setup_api_calls:
