              as: ElectionsAdmin
              captures: { e1: $.data.id }
            - call: "POST /vote-by-mail/voters"
              payload: { full_name: "Gil Pratt", party_affiliation: "DEM", residence_address: "12 Larch St", last_signature_update_at: "2026-01-05T00:00:00Z", signature_on_file_count: 1, uocava_status: "NONE" }
              as: ElectionsClerk
              captures: { v1: $.data.id, v1_v: $.data.version }
            - call: "POST /vote-by-mail/voters/${v1}/permanent-absentee-enrollments"
              payload: {}
              as: ElectionsClerk
              captures: { pae1: $.data.id }
            - call: "GET /vote-by-mail/voters/${v1}"
              payload: {}
              as: ElectionsClerk
              captures: { v1_ver_a: $.data.version }
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "PAPER", delivery_method: "MAIL", expected_voter_version: "${v1_ver_a}" }
              as: ElectionsClerk
              captures: { br1: $.data.id }
            - call: "GET /vote-by-mail/address-verifications"
              payload: { ballot_request_id: "${br1}" }
              as: ElectionsClerk
              captures: { av1: "$.data[0].id" }
            - call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_NON_FORWARDABLE" }
              as: ElectionsClerk
            - call: "GET /vote-by-mail/permanent-absentee-enrollments/${pae1}"
              payload: {}
              as: ElectionsClerk
              captures: { pae_count_1: $.data.consecutive_undeliverable_count, pae_status_1: $.data.status }
            - call: "GET /vote-by-mail/voters/${v1}"
              payload: {}
              as: ElectionsClerk
              captures: { v1_ver_b: $.data.version }
          trigger:
            - call: "POST /vote-by-mail/ballot-requests"
              payload: { voter_id: "${v1}", election_id: "${e1}", request_channel: "ONLINE", delivery_method: "MAIL", expected_voter_version: "${v1_ver_b}" }
              as: ElectionsClerk
