          assert:
            - "${rc1} == 1, ${st1} == IN_PROGRESS and ${oc1} == null (outcome, age_groups_observed and submitted_at are cleared)"
            - "${rc2} == 2"
            - "${e_third} == ERR_INVALID_INSPECTION_STATE with HTTP 409 — reopen_count < INSPECTION_MAX_REOPENS is a strict comparison"
            - "Inspection.${ins}.status == PENDING_REVIEW and reopen_count == 2 after the refused third reopen"

