      - name: dose_constraint_on_non_draft_plan_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", entities.DoseConstraint.fields.plan_id]
        distinguishing_aspect: "Constraints freeze once a plan is submitted: adding one while PENDING_PRIMARY_CHECK fails with ERR_PLAN_NOT_DRAFT."
        test_recipe:
          setup: ["plan submitted for check (PENDING_PRIMARY_CHECK)"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-V17", full_name: "Val Seventeen", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 4000, planned_fractions: 8 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
