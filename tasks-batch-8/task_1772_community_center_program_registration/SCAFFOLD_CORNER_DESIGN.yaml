        claim_type: rbac_denial
        grounds: [state_machines.InstructorContract.OFFERED_to_ACCEPTED, "errors[ERR_UNAUTHORIZED_ROLE]", "roles[Instructor]"]
        distinguishing_aspect: "Entity-backed identity: instructor I2 accepting a contract whose instructor_id is I1 returns ERR_UNAUTHORIZED_ROLE 403; I1 then accepts successfully."
