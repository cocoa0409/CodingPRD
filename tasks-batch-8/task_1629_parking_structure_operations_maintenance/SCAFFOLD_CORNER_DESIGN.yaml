- section: validations
  instances:
  - name: missing_auth_header_returns_400
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_CONTEXT_HEADER]
    distinguishing_aspect: A request without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_CONTEXT_HEADER 400 before any role or existence check.
    test_recipe:
      setup:
      - Empty database; the trigger sends NO X-User-ID and NO X-User-Role headers
      setup_api_calls: []
      trigger:
      - call: GET /ops/facilities
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_MISSING_CONTEXT_HEADER and HTTP status 400
  - name: role_forbidden_for_endpoint
    claim_type: violation_to_error
    grounds:
    - validations[priority=2]
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: 'MonthlyParker cannot create facilities: ERR_FORBIDDEN_ROLE 403.'
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /ops/facilities
        payload:
          name: Nope
          total_spaces: 10
          monthly_capacity: 1
          event_pool_spaces: 1
        as: MonthlyParker
        as_user_id: 11111111-1111-1111-1111-111111111111
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE and HTTP status 403
  - name: body_reference_not_found_returns_404
    claim_type: violation_to_error
    grounds:
    - validations[priority=6]
    - errors[ERR_REFERENCE_NOT_FOUND]
    distinguishing_aspect: Creating an agreement with a nonexistent parker_account_id yields ERR_REFERENCE_NOT_FOUND 404 (body reference, not path).
    test_recipe:
      setup:
      - One facility
      setup_api_calls:
      - call: POST /ops/facilities
        payload:
          name: Ref Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      trigger:
      - call: POST /ops/monthly-agreements
        payload:
          facility_id: ${fac}
