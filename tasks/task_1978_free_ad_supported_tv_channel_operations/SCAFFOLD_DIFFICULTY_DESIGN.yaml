          trigger:
            - { call: "POST /v1/playlist-loops/${l1}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
          assert:
            - "PlaylistLoop.${l1}.loop_status == PUBLISHED"
            - "RightsGrant.${g}.plays_used == 1 and grant_status == EXHAUSTED (plays_used >= max_plays at exact boundary)"
            - "ContentAsset.${ct}.content_status == WINDOW_EXPIRED (no remaining PENDING/ACTIVE grant)"
            - "PlaylistLoop.${l2}.loop_status == DRAFT (cascade revert of a loop the publish never touched directly)"

      - name: r4_campaign_pause_cascade_voids_provisionals_and_unmarks_break
        grounds:
          - state_machines.AdCampaign.ACTIVE_to_PAUSED
          - state_machines.FillDecision.PROVISIONAL_to_VOIDED
          - state_machines.AdBreak.DECIDED_to_MARKED
        distinguishing_aspect: |
          Depth-3 chain triggered by campaign pause (NOT by publish): pause ->
          the campaign's PROVISIONAL decision VOIDED -> its break, left with no
          PROVISIONAL/COMMITTED decisions, reverts DECIDED -> MARKED; a cascade
          distinct from the publish trigger and propagating through money-free
          provisional state (spent_cents stays 0).
        test_recipe:
          setup:
            - "Channel ch (600s); loop lp 2026-09-01 VALIDATED (entry ct540 + 60s break br)"
            - "Campaign c1 (cpm 500, budget 5000, daily 5000) ACTIVE with APPROVED creative cr1; decision run on br created d1 DIRECT (slot 0) PROVISIONAL (slot 1 slate, no house ads)"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch I", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/ad-campaigns/${c1}/pause", payload: {}, as: AdOps, as_user_id: "ops-1" }
          assert:
            - "AdCampaign.${c1}.campaign_status == PAUSED"
            - "FillDecision.${d1}.decision_status == VOIDED (pause cascade, first hop)"
            - "AdBreak.${br}.break_status == MARKED (second hop: no PROVISIONAL/COMMITTED decisions remain)"
            - "AdCampaign.${c1}.spent_cents == 0 (provisional voiding never touches spend)"
  # ---------------------------------------------------------------- rule 5 --
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: r5_publish_state_trumps_temporal_broadcast_date
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_BROADCAST_DATE_IN_PAST]
        distinguishing_aspect: |
          Error-category pair {state, business_temporal}: publishing a loop that
          is still DRAFT (never locked) with a broadcast_date already in the
          past fails TWO checks; the state error (priority 7) wins over the
          temporal error (priority 11) — ERR_INVALID_STATE_TRANSITION, not
          ERR_BROADCAST_DATE_IN_PAST.
        test_recipe:
          setup:
            - "Channel ch (600s, DRAFT — never taken live); content ct AVAILABLE with ACTIVE grant"
            - "Loop lp created at logical 2026-08-01 for broadcast_date 2026-09-01, left in DRAFT"
            - "Clock advanced to 2026-09-02 (broadcast_date now in the past)"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch J", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (state priority 7 beats temporal priority 11)"
            - "PlaylistLoop.${lp}.loop_status == DRAFT (unchanged)"

      - name: r5_creative_category_mismatch_trumps_duration_quality
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_CATEGORY_MISMATCH]
          - errors[ERR_AD_QUALITY_RULE]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_safety} —
          disjoint from the state/temporal pair: approving a creative whose
          iab_category differs from its campaign's AND whose duration is 90s
          fails both checks; the referential check (priority 9) wins over the
          ad-quality safety check (priority 10) — ERR_CATEGORY_MISMATCH, not
          ERR_AD_QUALITY_RULE.
        test_recipe:
          setup:
            - "Campaign c1 (iab_category IAB-9) in DRAFT"
            - "Creative crv under c1 with iab_category IAB-8 (mismatch) and duration_seconds 90 (fails ad quality)"
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-8", duration_seconds: 90 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
          trigger:
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CATEGORY_MISMATCH (referential priority 9 beats safety priority 10)"
            - "AdCreative.${crv}.creative_status == PENDING_REVIEW (unchanged)"

  # ---------------------------------------------------------------- rule 6 --
  - rule_id: boundary_precision_check
    instances:
      - name: r6_loop_validate_requires_exact_second_tiling
        grounds:
          - calculations.loop_tiling_check
          - errors[ERR_LOOP_NOT_TILED]
        distinguishing_aspect: |
          Boundary on the tiling metric (seconds equality) via the validate
          endpoint: used_seconds == 600 exactly validates, while 570 (one
          30-second slot short) fails with ERR_LOOP_NOT_TILED — == vs != on a
          duration metric, reachable only through POST validate.
        test_recipe:
          setup:
            - "Channel ch (loop_duration_seconds 600); content ct540 AVAILABLE; ACTIVE grant"
            - "Loop la (2026-09-01): entry ct + 60s break -> used 600; loop lb (2026-09-02): entry ct + 30s break -> used 570"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch K", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { la: $.data.id } }
            - { call: "POST /v1/playlist-loops/${la}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${la}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-02" }, as: ChannelProgrammer, captures: { lb: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lb}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lb}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer }
          trigger:
            - { call: "POST /v1/playlist-loops/${la}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lb}/validate", payload: {}, as: ChannelProgrammer, captures: { err: $.data.error_id } }
          assert:
            - "PlaylistLoop.${la}.loop_status == VALIDATED (600 == 600: exact boundary passes)"
            - "Second validate: error_id == ERR_LOOP_NOT_TILED (570 != 600)"
            - "PlaylistLoop.${lb}.loop_status == DRAFT (unchanged)"

      - name: r6_refresh_staleness_strictly_greater_than_cadence
        grounds:
          - calculations.refresh_staleness
          - calculations.channel_posture_recompute
        distinguishing_aspect: |
          Boundary on a date-threshold metric via run-ops (distinct endpoint and
          metric from tiling): with last_published_on 2026-08-01 and cadence 7,
          the ops-run at exactly 2026-08-08 leaves posture ACTIVE (== is not
          stale), while 2026-08-09 flips it to GUARDED — strict >, not >=.
        test_recipe:
          setup:
            - "Channel ch (600s, cadence 7) with loop PUBLISHED on logical 2026-08-01 (last_published_on = 2026-08-01)"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch L", genre: "movies", timezone: "UTC", loop_duration_seconds: 600, refresh_cadence_days: 7 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
          trigger:
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/channels/${ch}/run-ops", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/channels/${ch}/run-ops", payload: {}, as: PlatformAdmin }
          assert:
            - "After the 2026-08-08 ops-run: Channel.${ch}.channel_posture == ACTIVE (equality with last_published_on + cadence is NOT stale)"
            - "After the 2026-08-09 ops-run: Channel.${ch}.channel_posture == GUARDED (strictly greater flips the threshold)"

  # ---------------------------------------------------------------- rule 7 --
  - rule_id: cross_entity_state_dependency
    instances:
      - name: r7_loop_publish_requires_channel_live
        grounds:
          - state_machines.PlaylistLoop.LOCKED_to_PUBLISHED
          - errors[ERR_CHANNEL_NOT_LIVE]
        distinguishing_aspect: |
          Entity pair (PlaylistLoop, Channel): a fully LOCKED, rights-clean loop
          cannot publish while its CHANNEL is in DRAFT lifecycle state — the
          loop's valid transitions are gated by a different entity's state.
        test_recipe:
          setup:
            - "Channel ch (600s) in DRAFT (go-live never called); loop lp 2026-09-01 tiled, VALIDATED, break decided (all-slate), LOCKED"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch M", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CHANNEL_NOT_LIVE"
            - "PlaylistLoop.${lp}.loop_status == LOCKED (unchanged); Channel.${ch}.channel_status == DRAFT"

      - name: r7_campaign_activate_requires_approved_creative
        grounds:
          - state_machines.AdCampaign.DRAFT_to_ACTIVE
          - state_machines.AdCreative.PENDING_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity pair (AdCampaign, AdCreative) — distinct from (Loop, Channel):
          a campaign with zero APPROVED creatives cannot activate; only after
          its creative crosses PENDING_REVIEW -> APPROVED does the campaign
          transition become legal.
        test_recipe:
          setup:
            - "Campaign c1 (IAB-9) in DRAFT with one creative crv still PENDING_REVIEW"
          setup_api_calls:
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 5000, daily_budget_cents: 5000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { crv: $.data.id } }
          trigger:
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1", captures: { err: $.data.error_id } }
            - { call: "POST /v1/ad-creatives/${crv}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
          assert:
            - "First activate: error_id == ERR_INVALID_STATE_TRANSITION (no APPROVED creative)"
            - "After creative approval: second activate succeeds and AdCampaign.${c1}.campaign_status == ACTIVE"

  # ---------------------------------------------------------------- rule 8 --
  - rule_id: resource_temporal_overlap
    instances:
      - name: r8_rights_grant_half_open_windows_allow_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_GRANT_WINDOW_OVERLAP]
          - entities.RightsGrant.fields.window_end_utc
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on the RightsGrant
          resource: grant B starting exactly at grant A's window_end_utc is NOT
          an overlap (adjacency allowed), while a strictly interior overlap is
          rejected with ERR_GRANT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Channel ch; content ct AVAILABLE; grant g1 [2026-08-01, 2026-09-01) exists (PENDING)"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch N", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-09-01T00:00:00Z", max_plays: 5 }, as: ContentLicensing, captures: { g1: $.data.id } }
          trigger:
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 5 }, as: ContentLicensing, captures: { g2: $.data.id } }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-15T00:00:00Z", window_end_utc: "2026-08-20T00:00:00Z", max_plays: 5 }, as: ContentLicensing, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent grant created: RightsGrant.${g2} exists with grant_status == PENDING (end == start is allowed under half-open semantics)"
            - "Interior overlap rejected: error_id == ERR_GRANT_WINDOW_OVERLAP"

      - name: r8_distribution_agreement_closed_windows_reject_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
          - entities.DistributionAgreement.fields.effective_end_date
        distinguishing_aspect: |
          Interval semantics = CLOSED [start, end] on the DistributionAgreement
          resource (different resource, different geometry from rights grants):
          agreement B starting on the exact day agreement A ends IS an overlap
          (adjacency counts), while a start one day later is accepted.
        test_recipe:
          setup:
            - "Channel ch; platform p1 (ONBOARDING is fine for creation); agreement a1 [2026-01-01, 2026-06-30] exists (NEGOTIATION)"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch O", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "Roku-like", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-06-30" }, as: PlatformAdmin, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-06-30", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-07-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { a3: $.data.id } }
          assert:
            - "Adjacent agreement rejected: error_id == ERR_AGREEMENT_WINDOW_OVERLAP (2026-06-30 == 2026-06-30 counts as overlap under closed-interval semantics)"
            - "Gap-of-one-day agreement created: DistributionAgreement.${a3} exists with agreement_status == NEGOTIATION"

  # ---------------------------------------------------------------- rule 9 --
  - rule_id: compensating_invariant
    instances:
      - name: r9_commit_then_void_conserves_campaign_spent
        grounds:
          - state_machines.FillDecision.PROVISIONAL_to_COMMITTED
          - state_machines.FillDecision.COMMITTED_to_VOIDED
          - state_machines.AdCampaign.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = AdCampaign.spent_cents (money): lock commits a
          500-cent decision (spent 0 -> 500, campaign flips EXHAUSTED at the ==
          boundary), and voiding that decision refunds exactly the same amount
          (spent 500 -> 0, campaign revives to ACTIVE) — forward + compensating
          action leaves spent_cents identical to the pre-lock baseline.
        test_recipe:
          setup:
            - "Channel ch (600s); loop lp 2026-09-01 VALIDATED (entry ct540 + 30s break br)"
            - "Campaign c1 (cpm 500, total 500, daily 500) ACTIVE with APPROVED creative cr1; decision run created d1 DIRECT (committed_cost 500) PROVISIONAL; spent_cents == 0"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch P", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 570", content_type: "MOVIE", runtime_seconds: 570, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 500, daily_budget_cents: 500, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/fill-decisions/${d1}/void", payload: {}, as: AdOps, as_user_id: "ops-1" }
          assert:
            - "After lock: AdCampaign.${c1}.spent_cents == 500 and campaign_status == EXHAUSTED (spent >= budget at exact equality)"
            - "After void: AdCampaign.${c1}.spent_cents == 0 — identical to the pre-lock baseline (no drift)"
            - "After void: AdCampaign.${c1}.campaign_status == ACTIVE (EXHAUSTED revives when spend drops below budget and flight is valid)"
            - "FillDecision.${d1}.decision_status == VOIDED"

      - name: r9_publish_supersede_conserves_single_published_loop
        grounds:
          - state_machines.PlaylistLoop.LOCKED_to_PUBLISHED
          - concurrency_rules[loop-publish-stale-channel]
          - entities.PlaylistLoop.fields.supersedes_loop_id
        distinguishing_aspect: |
          Conserved quantity = cardinality of PUBLISHED loops per
          (channel_id, broadcast_date) (a count, not money): publishing L2 for
          a date that already has PUBLISHED L1 supersedes L1, so the count is
          exactly 1 before and after the forward+compensating pair, and
          L2.supersedes_loop_id points at L1.
        test_recipe:
          setup:
            - "Channel ch (600s) LIVE (via l1 LOCKED); l1 (2026-09-01) tiled and LOCKED"
            - "l1 PUBLISHED with fresh channel version"
            - "l2 created for the same (ch, 2026-09-01) — allowed because l1 is PUBLISHED, not in {DRAFT,VALIDATED,LOCKED} — tiled, VALIDATED, decided, LOCKED"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch Q", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { l1: $.data.id } }
            - { call: "POST /v1/playlist-loops/${l1}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${l1}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { b1: $.data.id, b1_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${l1}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${b1}/decision-runs", payload: { expected_break_version: "${b1_v}" }, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/playlist-loops/${l1}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv1: $.data.version } }
            - { call: "POST /v1/playlist-loops/${l1}/publish", payload: { expected_channel_version: "${cv1}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { l2: $.data.id } }
            - { call: "POST /v1/playlist-loops/${l2}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${l2}/ad-breaks", payload: { duration_seconds: 60 }, as: ChannelProgrammer, captures: { b2: $.data.id, b2_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${l2}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${b2}/decision-runs", payload: { expected_break_version: "${b2_v}" }, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/playlist-loops/${l2}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv2: $.data.version } }
          trigger:
            - { call: "POST /v1/playlist-loops/${l2}/publish", payload: { expected_channel_version: "${cv2}" }, as: ChannelProgrammer }
          assert:
            - "PlaylistLoop.${l2}.loop_status == PUBLISHED and PlaylistLoop.${l1}.loop_status == SUPERSEDED"
            - "PlaylistLoop.${l2}.supersedes_loop_id == ${l1}"
            - "count of loops for (${ch}, 2026-09-01) with loop_status == PUBLISHED == 1 (invariant: exactly one before and after)"
            - "RightsGrant.${g}.plays_used == 2 (each publish consumed one play of ct)"
