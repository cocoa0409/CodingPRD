              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_d}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_d: "$.data.id", pkg_d_v: "$.data.version" }
            - call: "POST /api/award-packages/${pkg_d}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_d}/notify"
              payload: {}
              as: AidOfficer
            - call: "GET /api/award-packages/${pkg_d}/award-lines"
              payload: {}
              as: AidOfficer
              captures: { line_d: "$.data[0].id" }
