# =============================================================================
# §1.9 Scaffold Corner Design — League Merchandise Licensing & Royalty
# Administration (task_2331)
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml. Every corner that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) already asserts is emitted as an
# `excluded_because:` stub naming that instance instead of being re-tested.
#
# Shared fixture vocabulary (identical to §1.8):
#   * logical clock is left at its MANDATORY default 2026-08-01T00:00:00Z, so
#     QUARTER_OF(clock) == 2026Q3 and only quarters <= 2026Q2 are fileable
#     (§1.4 priority 40); the clock is never moved backward (priority 42).
#   * canonical category JERSEY: tiers [0,2000000)@1200 / [2000000,5000000)@1000
#     / [5000000,null)@800, closeout_rate 500, closeout cap 1500 / hard 4000,
#     deduction cap 500 / hard 2000, mg_floor 1000000, advance_floor 2500 bps,
#     mark_usage_class LEAGUE_CLUB_AND_PLAYER.
#   * opaque actor ids: u_ops_1 (LeagueLicensingManager), u_mco_1
#     (MarkComplianceOfficer), u_fin_1 / u_fin_2 (FinanceController), u_aud_1
#     (RoyaltyAuditor), u_club_1 (ClubRepresentative), u_agent_1 (PlayerAgent).
#     Entity-backed roles act as their own row id (Licensee -> ${lic_*}).
#   * DRAFT -> PENDING_SIGNATURE requires MG >= floor, advance fully paid AND at
#     least one GRANTED TerritoryGrant, so every activation chain issues a
#     US / ALL grant over [2026-01-01, 2028-01-01) first.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: category_created_with_all_declared_fields
        claim_type: creation
        grounds:
          - entities.ProductCategory
          - endpoints.POST_/licensing/product-categories
          - response_envelope.success
        distinguishing_aspect: |
          A create returns 201 with every declared field echoed and the four
          common fields minted: id is a bare UUID with no type prefix, version
          starts at 1, created_at and updated_at are ISO-8601 UTC with three
          fractional digits. The success envelope carries meta.api_request_id,
          meta.api_request_timestamp and response_type == "object".
        test_recipe:
          setup:
            - "empty database; clock at the mandatory default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
          assert:
            - "response status is 201 and response_type == 'object'"
            - "data.category_code == 'JERSEY', data.display_name == 'Authentic Jerseys', data.base_royalty_rate_bps == 1200, data.closeout_rate_bps == 500"
            - "data.mark_usage_class == 'LEAGUE_CLUB_AND_PLAYER' and data.minimum_guarantee_floor_cents == 1000000 and data.exclusivity_allowed == true"
            - "data.tier_schedule has exactly 3 entries and its last entry has to_cents == null and rate_bps == 800"
            - "data.version == 1 and data.id is a bare UUID (36 chars, no 'cat_' prefix) and data.created_at == data.updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are both present"

      - name: licensee_defaults_prospect_status_and_zero_counters
        claim_type: defaults
        grounds:
          - entities.Licensee.fields.status
          - entities.Licensee.fields.vendor_compliance_certified
          - entities.Licensee.fields.compliance_risk_index
          - entities.Licensee.fields.agreement_count
        distinguishing_aspect: |
          Creating a licensee with only its three required inputs must apply
          every declared default: status PROSPECT (not ACTIVE — activation is a
          separate transition), vendor_compliance_certified false,
          compliance_risk_index 0, risk_index_as_of_quarter null,
          outstanding_recovery_cents 0, agreement_count 0, suspension_reason null.
          An implementation that activates on create, or that certifies vendor
          compliance by default, fails this instance.
        test_recipe:
          setup:
            - "empty database; clock at the mandatory default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Aperture Sport Group", contact_email: "ops@aperture.example", home_country_code: "CA" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_a: $.data.id }
          assert:
            - "response status is 201 and data.status == 'PROSPECT'"
            - "data.vendor_compliance_certified == false"
            - "data.compliance_risk_index == 0 and data.risk_index_as_of_quarter is null"
            - "data.outstanding_recovery_cents == 0 and data.agreement_count == 0 and data.suspension_reason is null"
            - "data.home_country_code == 'CA' and data.version == 1"

      - name: category_optional_caps_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ProductCategory.fields.closeout_cap_pct_bps
          - entities.ProductCategory.fields.closeout_hard_limit_bps
          - entities.ProductCategory.fields.deduction_cap_pct_bps
          - entities.ProductCategory.fields.deduction_hard_limit_bps
          - entities.ProductCategory.fields.advance_floor_bps_of_mg
          - entities.ProductCategory.fields.central_licensing_default
        distinguishing_aspect: |
          The six optional category knobs each carry a declared default that the
          fiscal rules later read. Omitting all six must yield exactly 1500 /
          4000 / 500 / 2000 / 2500 / true — not null and not 0, because a 0
          closeout cap would silently forbid all closeout volume and a null
          advance floor would disable §1.4 priority 27.
        test_recipe:
          setup:
            - "empty database; clock at the mandatory default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/product-categories"
              payload: { category_code: "HEADWEAR", display_name: "Sideline Headwear", base_royalty_rate_bps: 1000, tier_schedule: [{ from_cents: 0, to_cents: null, rate_bps: 1000 }], closeout_rate_bps: 400, exclusivity_allowed: false, minimum_guarantee_floor_cents: 500000, mark_usage_class: "LEAGUE_ONLY" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_headwear: $.data.id }
          assert:
            - "response status is 201"
            - "data.closeout_cap_pct_bps == 1500 and data.closeout_hard_limit_bps == 4000"
            - "data.deduction_cap_pct_bps == 500 and data.deduction_hard_limit_bps == 2000"
            - "data.advance_floor_bps_of_mg == 2500 and data.central_licensing_default == true"
            - "data.exclusivity_allowed == false (the explicitly supplied value wins over the field default true)"

      - name: royalty_report_money_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.RoyaltyReport.fields.royalty_due_cents
          - entities.RoyaltyReport.fields.status
          - endpoints.POST_/licensing/royalty-reports
        distinguishing_aspect: |
          Every money field on RoyaltyReport is source: computed and stays 0 on a
          DRAFT row no matter what the client sends. Posting royalty_due_cents
          999999 and status ACCEPTED must not be honoured: the row is created
          DRAFT with all ten money fields at 0, filed_at null and return_count 0.
          An implementation that copies client-supplied computed fields lets a
          licensee self-assess its own royalty.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_B ACTIVE with an ACTIVE agreement AGR_B on category JERSEY (MG 1000000, advance 250000 paid, US/ALL grant, term 2026-01-01..2027-12-31)"
            - "one AUTHORIZED DEPARTMENT authorization covering 2026-01-01..2028-12-31"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Bridgeport Apparel", contact_email: "ops@bridgeport.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_b: $.data.id }
            - call: "POST /licensing/licensees/${lic_b}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_b}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_b: $.data.id }
            - call: "POST /licensing/agreements/${agr_b}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_b}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_b}/contract-status"
              payload: { action: "SUBMIT_FOR_SIGNATURE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_b}/contract-status"
              payload: { action: "ACTIVATE", countersigned_by: "R. Vance" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_b}"
              as: LeagueLicensingManager
              captures: { lic_b_v1: $.data.version }
            - call: "POST /licensing/licensees/${lic_b}/retailer-authorizations"
              payload: { retailer_name: "Metro Sports", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2028-12-31", closeout_allowed: false, expected_licensee_version: "${lic_b_v1}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_b: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_b}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /licensing/agreements/${agr_b}"
              as: FinanceController
              captures: { agr_b_v1: $.data.version }
            - call: "POST /licensing/royalty-reports"
              payload: { agreement_id: "${agr_b}", period_quarter: "2026Q2", channel_lines: [{ channel_class: "DEPARTMENT", retailer_authorization_id: "${auth_b}", gross_sales_cents: 2500000, units: 5000, closeout_sales_cents: 0, deductions_cents: 0 }], expected_agreement_version: "${agr_b_v1}", royalty_due_cents: 999999, status: "ACCEPTED", total_payable_cents: 1, return_count: 7 }
              as: Licensee
              as_user_id: "${lic_b}"
              captures: { rpt_b: $.data.id }
          assert:
            - "response status is 201 and data.status == 'DRAFT' (the supplied ACCEPTED is ignored)"
            - "data.royalty_due_cents == 0, data.net_regular_total_cents == 0, data.closeout_eligible_total_cents == 0, data.applied_tier_rate_bps == 0"
            - "data.recoupment_applied_cents == 0, data.cash_due_pre_fee_cents == 0, data.late_days == 0, data.late_filing_interest_cents == 0, data.admin_fee_cents == 0, data.total_payable_cents == 0"
            - "data.return_count == 0, data.filed_at is null, data.accepted_by_user_id is null, data.adjusted_royalty_due_cents is null"
            - "data.channel_lines[0].gross_sales_cents == 2500000 (client input IS honoured for source: input fields)"

      - name: licensee_status_and_risk_index_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Licensee.fields.status
          - entities.Licensee.fields.suspension_reason
          - entities.Licensee.fields.compliance_risk_index
        distinguishing_aspect: |
          Licensee.status is source: system and Licensee.compliance_risk_index is
          source: computed, so a create that supplies status ACTIVE, an id, a
          version of 99 and a risk index of 80 must still produce a PROSPECT row
          with a server-minted id, version 1 and index 0. Only ACTIVATE moves the
          status, and only the risk calculation writes the index.
        test_recipe:
          setup:
            - "empty database; clock at the mandatory default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Beacon Merch Works", contact_email: "ops@beacon.example", home_country_code: "US", status: "ACTIVE", compliance_risk_index: 80, suspension_reason: "none", id: "11111111-1111-4111-8111-111111111111", version: 99 }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_c: $.data.id }
          assert:
            - "response status is 201 and data.status == 'PROSPECT'"
            - "data.compliance_risk_index == 0 and data.suspension_reason is null"
            - "data.id != '11111111-1111-4111-8111-111111111111' (server-minted) and data.version == 1"
            - "data.legal_name == 'Beacon Merch Works' (source: input fields are honoured)"

      - name: get_agreement_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_AGREEMENT_NOT_FOUND
          - validations.priority_5
          - endpoints.GET_/licensing/agreements/{agreementId}
        distinguishing_aspect: |
          A syntactically valid UUID that names no row must yield 404 with
          data.error_id == ERR_AGREEMENT_NOT_FOUND, not 200 with a null body and
          not 422. Existence (priority 5) is checked after auth and before every
          business rule, so the error is entity-specific rather than a generic
          ERR_VALIDATION.
        test_recipe:
          setup:
            - "empty database; clock at the mandatory default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /licensing/agreements/00000000-0000-4000-8000-000000000000"
              as: FinanceController
              captures: { err_nf: $.data.error_id }
          assert:
            - "response status is 404 and data.error_id == 'ERR_AGREEMENT_NOT_FOUND'"
            - "response_type == 'error' and meta.api_request_id is present"

      - name: create_submission_under_unknown_agreement_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ProductSubmission.fields.agreement_id
          - errors.ERR_AGREEMENT_NOT_FOUND
          - validations.priority_5
        distinguishing_aspect: |
          ProductSubmission is reached through a nested URL, so the parent must be
          resolved before the payload is even shaped: a submission posted under a
          non-existent agreementId returns ERR_AGREEMENT_NOT_FOUND (404) and NOT
          ERR_VALIDATION, even though the body also references a real mark. No
          ProductSubmission row is created.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "category JERSEY and MarkRight LEAGUE_SHIELD exist; licensee LIC_D is ACTIVE but owns no agreement"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/mark-rights"
              payload: { mark_code: "LEAGUE_SHIELD", owner_type: "LEAGUE", usage_class: "PRIMARY", royalty_share_bps: 0 }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { mark_league: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Dockside Goods", contact_email: "ops@dockside.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_d: $.data.id }
            - call: "POST /licensing/licensees/${lic_d}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /licensing/agreements/00000000-0000-4000-8000-000000000000/product-submissions"
              payload: { sku_class: "JERSEY", product_name: "Ghost Jersey", mark_ids: ["${mark_league}"], retail_price_cents: 9999, sample_required: false }
              as: Licensee
              as_user_id: "${lic_d}"
              captures: { err_parent: $.data.error_id }
          assert:
            - "response status is 404 and data.error_id == 'ERR_AGREEMENT_NOT_FOUND'"
            - "GET /licensing/product-submissions reports total_count == 0"

      - name: list_licensees_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/licensing/licensees
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list envelope must report total_count over the WHOLE filtered set
          (3) rather than the page size, and has_more must be derived from
          offset + returned < total_count: page one of two returns 2 rows with
          has_more true, the second page returns 1 row with has_more false.
          Reporting total_count as the page length, or has_more as "page is
          full", breaks one of the two pages.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "exactly three licensees exist, created in this order: Aster Apparel, Basil Brands, Cedar Sportswear"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Aster Apparel", contact_email: "ops@aster.example", home_country_code: "US" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_e1: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Basil Brands", contact_email: "ops@basil.example", home_country_code: "US" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_e2: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Cedar Sportswear", contact_email: "ops@cedar.example", home_country_code: "US" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_e3: $.data.id }
          trigger:
            - call: "GET /licensing/licensees?limit=2&offset=0"
              as: LeagueLicensingManager
              captures: { first_page_id: "$.data[0].id" }
            - call: "GET /licensing/licensees?limit=2&offset=2"
              as: LeagueLicensingManager
              captures: { last_page_id: "$.data[0].id" }
          assert:
            - "first call: response_type == 'array', data has 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: data has 1 row, total_count == 3, has_more == false, offset == 2"
            - "the two pages are disjoint and together cover all three licensee ids"

      - name: get_royalty_report_returns_stored_channel_lines
        claim_type: retrieval
        grounds:
          - endpoints.GET_/licensing/royalty-reports/{reportId}
          - entities.RoyaltyReport.fields.channel_lines
          - entities.RoyaltyReport.fields.status
        distinguishing_aspect: |
          A GET by id must return the row as stored, including the full
          channel_lines array with per-line closeout and deduction figures, and
          must not recompute or normalise them. The two lines are returned in the
          order supplied, and the money fields still read 0 because the report is
          DRAFT.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_F ACTIVE with an ACTIVE agreement AGR_F on category JERSEY (MG 1000000, advance 250000 paid, US/ALL grant)"
            - "one AUTHORIZED DEPARTMENT authorization with closeout_allowed true covering 2026-01-01..2028-12-31"
            - "a DRAFT 2026Q2 report with one DEPARTMENT line (gross 2000000, closeout 200000, deductions 50000)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
