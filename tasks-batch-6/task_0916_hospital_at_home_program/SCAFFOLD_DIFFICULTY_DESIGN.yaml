scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: waiver_vs_ffs_daily_compliance_diverge_on_identical_visit_set
        grounds:
          - calculations.daily_visit_compliance
          - entities.Episode.fields.program_track
          - entities.DailyComplianceRecord.fields.carve_out_reason
          - state_machines.DailyComplianceRecord.PENDING_to_COMPLIANT
          - state_machines.DailyComplianceRecord.PENDING_to_CARVED_OUT
        distinguishing_aspect: |
          This dual-variant lives in the DailyComplianceRecord / Visit domain: one identical
          visit set (exactly one COMPLETED and ATTESTED RN_IN_PERSON visit, no physician
          evaluation) scores CARVED_OUT under the CMS_WAIVER variant (needs 2 in-person visits
          plus a physician evaluation) and COMPLIANT under the FEE_FOR_SERVICE variant (needs 1
          in-person visit and no physician evaluation).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "Patient W and Patient F are identical apart from mrn and name, both 12.5 km from the hub."
            - "Referral W and Referral F are both ED / CHF_EXAC / STANDARD and both ELIGIBLE."
            - "Episode W is admitted on the CMS_WAIVER track; Episode F on the FEE_FOR_SERVICE track."
            - "Each episode has exactly one RN_IN_PERSON visit on 2026-06-01 that is COMPLETED and ATTESTED; neither episode has any physician visit or monitoring lapse."
            - "Each episode therefore owns exactly one DailyComplianceRecord for 2026-06-01, still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-W1", full_name: "Wanda Waiver", home_distance_km: 12.5, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_w: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-F1", full_name: "Frank Ffs", home_distance_km: 12.5, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_f: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_w}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_w: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_f}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_f: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_w}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_f}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_w}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_f}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_w}", referral_id: "${ref_w}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_w: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_f}", referral_id: "${ref_f}", program_track: "FEE_FOR_SERVICE" }
              as: AdmittingPhysician
              captures: { ep_f: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_w}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 8.0 }
              as: FieldNurse
              captures: { v_w: $.data.id }
            - call: "POST /visits/${v_w}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_w}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_w}/attest"
              payload: {}
              as: FieldNurse
            - call: "POST /visits"
              payload: { episode_id: "${ep_f}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-2", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 8.0 }
              as: FieldNurse
              captures: { v_f: $.data.id }
            - call: "POST /visits/${v_f}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_f}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_f}/attest"
              payload: {}
              as: FieldNurse
            - call: "GET /episodes/${ep_w}/compliance-days"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { cd_w: "$.data[0].id" }
            - call: "GET /episodes/${ep_f}/compliance-days"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { cd_f: "$.data[0].id" }
          trigger:
            - call: "POST /compliance-days/${cd_w}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "POST /compliance-days/${cd_f}/finalize"
              payload: {}
              as: ProgramAdmin
          assert:
            - "DailyComplianceRecord.${cd_w}.qualified_in_person_visit_count == 1"
            - "DailyComplianceRecord.${cd_f}.qualified_in_person_visit_count == 1"
            - "DailyComplianceRecord.${cd_w}.status == CARVED_OUT"
            - "DailyComplianceRecord.${cd_w}.carve_out_reason == INSUFFICIENT_IN_PERSON_VISITS"
            - "DailyComplianceRecord.${cd_f}.status == COMPLIANT"
            - "DailyComplianceRecord.${cd_f}.carve_out_reason is null"
            - "Episode.${ep_w}.billable_day_count == 0"
            - "Episode.${ep_w}.carved_out_day_count == 1"
            - "Episode.${ep_f}.billable_day_count == 1"
            - "Episode.${ep_f}.carved_out_day_count == 0"

      - name: controlled_vs_non_controlled_handling_fee_diverge_by_45_50
        grounds:
          - calculations.delivery_handling_fee
          - entities.DeliveryOrder.fields.is_controlled
          - entities.DeliveryOrder.fields.handling_fee_usd
        distinguishing_aspect: |
          This dual-variant lives in the DeliveryOrder domain, a different entity domain from the
          compliance-record variant: identical cold_chain_required and weight_kg inputs produce
          84.40 for a controlled order (45.00 base plus 12.50 witness fee) and 38.90 for a
          non-controlled one (12.00 base, no witness fee), a fixed 45.50 divergence.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE CMS_WAIVER episode for a patient 12.5 km from the hub."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-D1", full_name: "Dana Delivery", home_distance_km: 12.5, primary_diagnosis_code: "CELLULITIS", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_d: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_d}", origin: "ED", qualifying_condition_code: "CELLULITIS", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_d: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_d}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_d}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_d}", referral_id: "${ref_d}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_d: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_d}", order_kind: "MEDICATION", is_controlled: true, cold_chain_required: true, weight_kg: 3.5, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_ctrl: $.data.id }
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_d}", order_kind: "MEDICATION", is_controlled: false, cold_chain_required: true, weight_kg: 3.5, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_plain: $.data.id }
          assert:
            - "DeliveryOrder.${do_ctrl}.handling_fee_usd == 84.40"
            - "DeliveryOrder.${do_plain}.handling_fee_usd == 38.90"
            - "DeliveryOrder.${do_ctrl}.handling_fee_usd minus DeliveryOrder.${do_plain}.handling_fee_usd == 45.50"
            - "DeliveryOrder.${do_ctrl}.status == PENDING_AUTHORIZATION"
            - "DeliveryOrder.${do_plain}.status == PENDING_AUTHORIZATION"

  # =========================================================================
  # RULE 2 — combinatorial formulas across different modes (a), (b), (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: delivery_fee_nested_floor_then_cap_mode_a
        grounds:
          - calculations.delivery_handling_fee
          - entities.DeliveryOrder.fields.weight_kg
          - entities.DeliveryOrder.fields.cold_chain_required
        distinguishing_aspect: |
          MODE (a): four inputs (is_controlled, cold_chain_required, weight_kg, redelivery_count)
          feed a conditional branch and then a nested min(max(raw, 15.00), 120.00). A raw sum of
          14.80 is lifted to the 15.00 floor and a raw sum of 135.50 is cut to the 120.00 cap, so
          neither stored value equals its own raw sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE CMS_WAIVER episode."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-C1", full_name: "Cara Cap", home_distance_km: 9.0, primary_diagnosis_code: "COPD_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_c: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_c}", origin: "INPATIENT_WARD", qualifying_condition_code: "COPD_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-2" }
              as: AdmittingPhysician
              captures: { ref_c: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_c}", in_person_eval_at: "2026-06-01T07:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-2" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_c}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_c}", referral_id: "${ref_c}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_c: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_c}", order_kind: "DME", is_controlled: false, cold_chain_required: false, weight_kg: 2.0, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_floor: $.data.id }
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_c}", order_kind: "MEDICATION", is_controlled: true, cold_chain_required: true, weight_kg: 40.0, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_cap: $.data.id }
          assert:
            - "DeliveryOrder.${do_floor}.handling_fee_usd == 15.00 (raw sum 12.00 + 0.00 + 0.00 + 2.80 = 14.80 is lifted to the floor)"
            - "DeliveryOrder.${do_cap}.handling_fee_usd == 120.00 (raw sum 45.00 + 12.50 + 22.00 + 56.00 = 135.50 is cut to the cap)"
            - "DeliveryOrder.${do_floor}.handling_fee_usd != 14.80"
            - "DeliveryOrder.${do_cap}.handling_fee_usd != 135.50"

      - name: travel_reimbursement_rounds_per_visit_before_summing_mode_b
        grounds:
          - calculations.visit_travel_reimbursement
          - entities.Visit.fields.travel_payment_usd
          - entities.Episode.fields.travel_reimbursement_total_usd
        distinguishing_aspect: |
          MODE (b): nested rounding where the order changes the cents. Two visits at 25.5 km each
          produce 25.5 * 0.61 = 15.555 per visit; rounding per visit first yields 15.56 + 15.56 =
          31.12, while summing the raw products (31.110) and rounding once yields 31.11. The
          scaffold pins round-per-visit-then-sum, so 31.12 is the only correct value.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE CMS_WAIVER episode."
            - "Two RN_IN_PERSON visits on 2026-06-01, each 25.5 km, on two different staff ids so the turnaround buffer is irrelevant; both COMPLETED and ATTESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-T1", full_name: "Trina Travel", home_distance_km: 25.5, primary_diagnosis_code: "CAP_PNEUMONIA", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_t: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_t}", origin: "ED", qualifying_condition_code: "CAP_PNEUMONIA", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_t: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_t}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_t}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_t}", referral_id: "${ref_t}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_t: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_t}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 25.5 }
              as: FieldNurse
              captures: { v_t1: $.data.id }
            - call: "POST /visits/${v_t1}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_t1}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_t1}/attest"
              payload: {}
              as: FieldNurse
            - call: "POST /visits"
              payload: { episode_id: "${ep_t}", visit_type: "PARAMEDIC_IN_PERSON", staff_user_id: "medic-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:10:00Z", scheduled_end_at: "2026-06-01T09:55:00Z", distance_km: 25.5 }
              as: CommunityParamedic
              captures: { v_t2: $.data.id }
            - call: "POST /visits/${v_t2}/depart"
              payload: {}
              as: CommunityParamedic
            - call: "POST /visits/${v_t2}/complete"
              payload: {}
              as: CommunityParamedic
            - call: "POST /visits/${v_t2}/attest"
              payload: {}
              as: CommunityParamedic
          trigger:
            - call: "GET /episodes/${ep_t}/ledger"
              payload: {}
              as: AdmittingPhysician
          assert:
            - "Visit.${v_t1}.travel_payment_usd == 15.56"
            - "Visit.${v_t2}.travel_payment_usd == 15.56"
            - "the ledger response field travel_reimbursement_total_usd == 31.12"
            - "the ledger response field travel_reimbursement_total_usd != 31.11 (the sum-then-round alternative is wrong)"

      - name: claim_withhold_tier_keyed_on_gross_never_on_net_mode_c
        grounds:
          - calculations.claim_net_payable
          - calculations.episode_reimbursement_amount
          - calculations.meal_credit_accrual
          - entities.BillingClaim.fields.withhold_rate
          - "concurrency_rules[claim-build-stale-episode]"
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency. net_payable = gross - withhold and withhold is
          a rate keyed on a tier, but the scaffold pins the tier to be read off gross_amount_usd.
          With gross 9628.00 (9600.00 FFS base + 28.00 of meal credit) the pinned order picks
          0.05 and yields 9146.60; keying the tier off the net an implementation would have
          computed at 0.02 (9435.44, at or below the 9600.00 threshold) yields 9435.44 instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE FEE_FOR_SERVICE episode with a NONE diet restriction."
            - "One RN_IN_PERSON visit on 2026-06-01, COMPLETED and ATTESTED — enough for a COMPLIANT day under the FFS variant."
            - "One MealPlan activated on 2026-06-01 with daily_delivery_count 2."
            - "The 2026-06-01 compliance day is finalized to COMPLIANT, so billable_day_count == 1, reimbursement_amount_usd == 9600.00 and meal_credit_total_usd == 28.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-N1", full_name: "Nina Net", home_distance_km: 6.0, primary_diagnosis_code: "UTI_COMPLICATED", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_n: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_n}", origin: "ED", qualifying_condition_code: "UTI_COMPLICATED", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_n: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_n}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_n}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_n}", referral_id: "${ref_n}", program_track: "FEE_FOR_SERVICE" }
              as: AdmittingPhysician
              captures: { ep_n: $.data.id }
            - call: "POST /meal-plans"
              payload: { episode_id: "${ep_n}", diet_code: "NONE", daily_delivery_count: 2 }
              as: LogisticsCoordinator
              captures: { mp_n: $.data.id }
            - call: "POST /visits"
              payload: { episode_id: "${ep_n}", visit_type: "RN_IN_PERSON", staff_user_id: "rn-1", service_date: "2026-06-01", scheduled_start_at: "2026-06-01T09:00:00Z", scheduled_end_at: "2026-06-01T09:45:00Z", distance_km: 6.0 }
              as: FieldNurse
              captures: { v_n: $.data.id }
            - call: "POST /visits/${v_n}/depart"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_n}/complete"
              payload: {}
              as: FieldNurse
            - call: "POST /visits/${v_n}/attest"
              payload: {}
              as: FieldNurse
            - call: "GET /episodes/${ep_n}/compliance-days"
              payload: { service_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { cd_n: "$.data[0].id" }
            - call: "POST /compliance-days/${cd_n}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "GET /episodes/${ep_n}"
              payload: {}
              as: BillingAnalyst
              captures: { ep_n_v: $.data.version }
          trigger:
            - call: "POST /billing-claims"
              payload: { episode_id: "${ep_n}", expected_episode_version: "${ep_n_v}" }
              as: BillingAnalyst
              captures: { claim_n: $.data.id }
          assert:
            - "MealPlan.${mp_n}.credited_day_count == 1"
            - "MealPlan.${mp_n}.meal_credit_total_usd == 28.00"
            - "Episode.${ep_n}.billable_day_count == 1"
            - "Episode.${ep_n}.reimbursement_amount_usd == 9600.00"
            - "BillingClaim.${claim_n}.gross_amount_usd == 9628.00"
            - "BillingClaim.${claim_n}.withhold_rate == 0.05"
            - "BillingClaim.${claim_n}.withhold_amount_usd == 481.40"
            - "BillingClaim.${claim_n}.net_payable_usd == 9146.60"
            - "BillingClaim.${claim_n}.net_payable_usd != 9435.44 (the net-keyed evaluation order is wrong)"
            - "BillingClaim.${claim_n}.billed_day_count == 1"
            - "BillingClaim.${claim_n}.status == BUILT"

  # =========================================================================
  # RULE 3 — non-linear state-machine shapes on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: visit_scheduling_and_attestation_axes_advance_independently
        grounds:
          - state_machines.Visit.SCHEDULED_to_EN_ROUTE
          - state_machines.Visit.UNATTESTED_to_ATTESTED
          - state_machines.Visit.EN_ROUTE_to_COMPLETED
          - entities.Visit.fields.scheduling_status
          - entities.Visit.fields.attestation_status
          - calculations.daily_visit_compliance
        distinguishing_aspect: |
          PARALLEL shape on the Visit entity: the attestation axis reaches ATTESTED while the
          scheduling axis is still EN_ROUTE, proving the two dimensions evolve independently on
          the same row, and the daily requirement counts the visit only once the scheduling axis
          also reaches COMPLETED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T08:00:00Z."
            - "One ACTIVE CMS_WAIVER episode with one RN_IN_PERSON visit on 2026-06-01 already advanced to EN_ROUTE and still UNATTESTED."
            - "The 2026-06-01 DailyComplianceRecord exists and is PENDING with qualified_in_person_visit_count == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
