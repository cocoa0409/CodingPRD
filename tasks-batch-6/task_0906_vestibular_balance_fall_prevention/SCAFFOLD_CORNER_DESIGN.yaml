            - call: "GET /care-plans/${cpid}"
              payload: {}
              as: IntakeCoordinator
              captures: { cp_v1: $.data.version }
            - call: "POST /community-linkages"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", assessment_id: "${aid}", program_name: "MATTER_OF_BALANCE", expected_care_plan_version: "${cp_v1}" }
              as: IntakeCoordinator
              captures: { link1: $.data.id }
            - call: "GET /care-plans/${cpid}"
