      - name: activation_gates_are_revealed_one_tier_at_a_time_in_the_pinned_order
        claim_type: cascading_validation
        grounds:
          - validations[ERR_CLIENT_GUIDE_RATIO_UNMET]
          - validations[ERR_INDEMNIFICATION_NOT_ACKNOWLEDGED]
          - validations[ERR_INSURANCE_COVERAGE_INSUFFICIENT]
          - validations[ERR_BOND_INSUFFICIENT]
          - state_machines.Permit.administrative_status.transitions[ISSUED->ACTIVE]
        distinguishing_aspect: |
          Seven activation preconditions are unsatisfied at once, and the permit is walked to ACTIVE by
          fixing exactly one at a time. The revealed order is forced by §1.4 and is NOT the order the
          preconditions are written in §1.2: the priority-8 client-to-guide ratio surfaces FIRST, ahead
          of the priority-9 indemnification acknowledgement and both priority-12 money gates, and
          inside priority 12 the pinned intra-tier order puts insurance before bond. An implementation
