          assert:
            - "the session reported candidate_count == 2; AncillaryOffer.${offer_seat_id}.sequence_rank == 1 (offered 2091, expected_value 2302) and AncillaryOffer.${offer_board_id}.sequence_rank == 2 (offered 1376, expected_value 1515)"
            - "both offers were created with valid_from == \"2026-08-10T09:00:00Z\" and valid_until == \"2026-08-10T10:00:00Z\""
            - "the 09:59:59Z acceptance returns 200: AncillaryOffer.${offer_seat_id}.offer_status == ACCEPTED with accepted_price_cents == 2091"
            - "it posts exactly one SALE RevenueEntry: category SEAT, product_sku SEAT_STANDARD, gross 2091, tax 84, net 2007, source_ref offer:${offer_seat_id}"
