            - "AuthorizationRequest.${auth_ph}.auth_valid_to == 2026-08-31T00:00:00Z (pharmacy_validity_days 30 binds; validity_days 90 is ignored on the PHARMACY branch)"
      - name: site_score_below_threshold_allows_requested
        claim_type: correct_result
        grounds:
          - "calculations.site_steering_score"
          - "entities.SiteOfCareDetermination.fields.steered"
        distinguishing_aspect: "steer_score 1.034 (cost ratio 300000/290000, burden 0) is strictly below steer_threshold 1.50, so the determination leaves recommended_site_type == requested HOSPITAL_OUTPATIENT and steered == false."
        test_recipe:
          setup:
            - "STEER_TO_HOME policy (threshold 1.50); non-rural patient with travel_minutes_to_hospital 0; DRAFT request for HOSPITAL_OUTPATIENT"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9123", regimen_name: "Below", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000, site_policy: "STEER_TO_HOME", steer_threshold: 1.50 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_bl: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1123", full_name: "BL P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000, rural_resident: false, travel_minutes_to_hospital: 0 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_bl: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_bl}", policy_id: "${pol_bl}", requested_site_type: "HOSPITAL_OUTPATIENT", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_bl: $.data.id } }
          trigger:
            - { call: "POST /infusion/authorization-requests/${auth_bl}/site-of-care-determinations", payload: { home_allowed_cents: 290000, hospital_allowed_cents: 300000, home_billed_cents: 340000, hospital_billed_cents: 360000 }, as: MedicalDirector, as_user_id: "md-1", captures: { sc_bl: $.data.steer_score, rec_bl: $.data.recommended_site_type, st_bl: $.data.steered } }
          assert:
            - "steer_score == 1.034 (round_half_up(1.0 * 300000/290000 + 0.5 * 0, 3) = round_half_up(1.0344827..., 3))"
            - "recommended_site_type == HOSPITAL_OUTPATIENT and steered == false (score 1.034 < threshold 1.50)"
      - name: responsibility_variant_divergence_covered
        claim_type: variant_divergence
        grounds:
          - "calculations.patient_responsibility_estimate"
        excluded_because:
          difficulty_instance: responsibility_accumulator_vs_billed_variant
          rationale: "Variant divergence (ACCUMULATOR 100000 vs BILLED_CHARGES 114000) is asserted as the failure path of the named §1.8 instance."
      - name: dose_threshold_boundary_covered
        claim_type: correct_result
        grounds:
          - "calculations.dose_delta_pct"
        excluded_because:
          difficulty_instance: dose_delta_threshold_twenty_exact
          rationale: "The 20.00-exact vs 19.80 boundary is asserted by the named §1.8 boundary_precision instance."

  - section: validations
    instances:
      - name: create_policy_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers fails with ERR_UNAUTHENTICATED (401) before any role or schema check (the harness sends no auth headers for this instance despite the as: annotation)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9130", regimen_name: "NoHdr", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401; no policy persisted"
      - name: determinations_on_missing_auth_returns_404
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_AUTH_REQUEST_NOT_FOUND]"
        distinguishing_aspect: "Existence (priority 4) precedes state/OCC: determinations on an unknown request id returns ERR_AUTH_REQUEST_NOT_FOUND (404) even with a syntactically valid body."
        test_recipe:
          setup: ["One real request exists (to source a live version number)"]
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9131", regimen_name: "NF", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_nf: $.data.id } }
            - { call: "POST /infusion/patients", payload: { member_id: "M1131", full_name: "NF P", diagnosis_code: "C50", payer_code: "PAYERX", plan_year_end: "2026-12-31T00:00:00Z", deductible_remaining_cents: 50000, oop_remaining_cents: 300000 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { pat_nf: $.data.id } }
            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_nf}", policy_id: "${pol_nf}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { v_nf: $.data.version } }
