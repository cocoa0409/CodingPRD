scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ============================================================
  - rule_id: dual_variant_calc
    instances:

      - name: priority_date_continuation_vs_cip_diverges
        grounds:
          - calculations.PRIORITY_DATE
          - entities.Application.fields.priority_date
          - entities.Application.fields.continuation_type
        distinguishing_aspect: |
          Two child applications filed off the SAME parent on the SAME day produce
          DIFFERENT priority_date values: CONTINUATION inherits parent.filing_date
          (2024-02-01T00:00:00.000Z) while CIP uses its own filing_date
          (2026-05-27T12:00:00.000Z). The calculation operates on the Application
          entity domain.
        test_recipe:
          setup:
            - "Applicant A_LARGE created (entity_size=LARGE)."
            - "Server clock set to 2024-02-01T00:00:00Z."
            - "Parent Application P (UTILITY) created and FILED on 2024-02-01."
            - "Server clock advanced to 2026-05-27T12:00:00Z."
            - "Two child applications (one CONTINUATION, one CIP) created off P."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-02-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "ACME Corp", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", application_type: "UTILITY", title: "Parent invention", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { parent_app_id: $.data.id, parent_filing_date: $.data.filing_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-27T12:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", application_type: "UTILITY", title: "Child A continuation", claim_count: 10, independent_claim_count: 2, parent_application_id: "${parent_app_id}", continuation_type: "CONTINUATION" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { cont_app_id: $.data.id, cont_priority_date: $.data.priority_date }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", application_type: "UTILITY", title: "Child B CIP", claim_count: 12, independent_claim_count: 3, parent_application_id: "${parent_app_id}", continuation_type: "CIP" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { cip_app_id: $.data.id, cip_priority_date: $.data.priority_date }
          assert:
            - "Application.${cont_app_id}.priority_date == '2024-02-01T00:00:00.000Z'"
            - "Application.${cip_app_id}.priority_date == '2026-05-27T12:00:00.000Z'"
            - "Application.${cont_app_id}.priority_date != Application.${cip_app_id}.priority_date"

      - name: maintenance_fee_on_time_vs_late_diverges
        grounds:
          - calculations.MAINTENANCE_FEE
          - entities.MaintenanceFee.fields.base_fee_cents
          - state_machines.MaintenanceFee.PENDING_to_PAID
        distinguishing_aspect: |
          For the SAME W1 MaintenanceFee on a SMALL-entity issued UTILITY, paying
          on-time (current_utc inside [window_open, window_due]) expects
          amount_cents=100000 (base only); paying late (current_utc in
          [window_due, window_grace]) expects amount_cents=108000 (base + late
          surcharge 8000). The calculation operates on the MaintenanceFee entity
          domain (different from PRIORITY_DATE on Application).
        test_recipe:
          setup:
            - "Two SMALL-entity applicants A1 and A2, each owning a UTILITY application ISSUED on 2020-01-01."
            - "Each application has three PENDING MaintenanceFees generated at issuance."
            - "For app1: clock set to W1 due date exactly (2024-01-01T00:00:00Z) — on-time payment."
            - "For app2: clock set to W1 due date + 30 days (2024-01-31T00:00:00Z) — late but in grace."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Solo Inv 1", entity_size: "SMALL", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Solo Inv 2", entity_size: "SMALL", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${a1_id}", application_type: "UTILITY", title: "Widget1", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { app1_id: $.data.id, app1_v0: $.data.version }
            - call: "POST /applications"
              payload: { applicant_id: "${a2_id}", application_type: "UTILITY", title: "Widget2", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { app2_id: $.data.id, app2_v0: $.data.version }
            - call: "POST /fee-payments"
              payload: { application_id: "${app1_id}", payment_category: "FILING", amount_cents: 16000 }
              as: Applicant
              as_user_id: "${a1_id}"
            - call: "POST /fee-payments"
              payload: { application_id: "${app2_id}", payment_category: "FILING", amount_cents: 16000 }
              as: Applicant
              as_user_id: "${a2_id}"
            - call: "POST /applications/${app1_id}/docket"
              payload: {}
              as: USPTOExaminer
              captures: { app1_v1: $.data.version }
            - call: "POST /applications/${app2_id}/docket"
              payload: {}
              as: USPTOExaminer
              captures: { app2_v1: $.data.version }
            - call: "POST /office-actions"
              payload: { application_id: "${app1_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
              captures: { app1_v2: $.data.version }
            - call: "POST /office-actions"
              payload: { application_id: "${app2_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${app1_id}"
              payload: {}
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { app1_v_pre_issue: $.data.version }
            - call: "GET /applications/${app2_id}"
              payload: {}
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { app2_v_pre_issue: $.data.version }
            - call: "POST /applications/${app1_id}/pay-issue-fee"
              payload: { amount_cents: 60000, expected_application_version: "${app1_v_pre_issue}" }
              as: Applicant
              as_user_id: "${a1_id}"
            - call: "POST /applications/${app2_id}/pay-issue-fee"
              payload: { amount_cents: 60000, expected_application_version: "${app2_v_pre_issue}" }
              as: Applicant
              as_user_id: "${a2_id}"
            - call: "GET /maintenance-fees"
              payload: { application_id: "${app1_id}" }
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { app1_w1_id: "$.data[0].id" }
            - call: "GET /maintenance-fees"
              payload: { application_id: "${app2_id}" }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { app2_w1_id: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /fee-payments"
              payload: { application_id: "${app1_id}", payment_category: "MAINTENANCE_W1", amount_cents: 100000, maintenance_fee_id: "${app1_w1_id}" }
              as: Applicant
              as_user_id: "${a1_id}"
              captures: { app1_pay_status: $.data.payment_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-31T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /fee-payments"
              payload: { application_id: "${app2_id}", payment_category: "MAINTENANCE_W1", amount_cents: 108000, maintenance_fee_id: "${app2_w1_id}" }
              as: Applicant
              as_user_id: "${a2_id}"
              captures: { app2_pay_status: $.data.payment_status }
          assert:
            - "MaintenanceFee.${app1_w1_id}.fee_status == 'PAID'"
            - "MaintenanceFee.${app2_w1_id}.fee_status == 'PAID'"
            - "FeePayment.app1_w1.amount_cents == 100000 (base SMALL W1)"
            - "FeePayment.app2_w1.amount_cents == 108000 (base SMALL W1 100000 + late surcharge SMALL 8000)"

  # ============================================================
  # Rule 2 — combinatorial_formula (≥2, different modes)
  # ============================================================
  - rule_id: combinatorial_formula
    instances:

      - name: excess_claims_fee_rounding_order_pinned
        grounds:
          - calculations.EXCESS_CLAIMS_FEE
          - entities.Application.fields.claim_count
          - entities.Application.fields.independent_claim_count
        distinguishing_aspect: |
          Mode (b): rounding order matters. SCAFFOLD pins "apply multiplier per
          term, then sum, then round once" — a 21-claim 4-independent SMALL
          application yields (1*10000*0.5) + (1*48000*0.5) = 5000 + 24000 =
          29000 cents AFTER one final round_half_up. A naive "sum-then-multiply
          -then-round" pipeline produces the same value here, but the rule is
          explicit so payment 29000 succeeds and any other amount (e.g. 29001
          or 30000) is rejected with ERR_FEE_AMOUNT_MISMATCH.
        test_recipe:
          setup:
            - "Applicant ASMALL with entity_size=SMALL exists."
            - "Application AUSML created with application_type=UTILITY, claim_count=21, independent_claim_count=4 (filing fee 16000 SMALL UTILITY already POSTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-27T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Small Inv", entity_size: "SMALL", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { asml_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${asml_id}", application_type: "UTILITY", title: "Excess claims widget", claim_count: 21, independent_claim_count: 4 }
              as: Applicant
              as_user_id: "${asml_id}"
              captures: { app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${app_id}", payment_category: "FILING", amount_cents: 16000 }
              as: Applicant
              as_user_id: "${asml_id}"
          trigger:
            - call: "POST /fee-payments"
              payload: { application_id: "${app_id}", payment_category: "EXCESS_CLAIMS", amount_cents: 29000 }
              as: Applicant
              as_user_id: "${asml_id}"
              captures: { pay_status: $.data.payment_status }
          assert:
            - "FeePayment.payment_status == 'POSTED'"
            - "Application.${app_id}.total_fees_paid_cents == 45000 (16000 FILING + 29000 EXCESS_CLAIMS)"

      - name: maintenance_fee_three_input_nonlinear
        grounds:
          - calculations.MAINTENANCE_FEE
          - entities.MaintenanceFee.fields.window_number
          - entities.Applicant.fields.entity_size
        distinguishing_aspect: |
          Mode (a): formula has ≥3 inputs (window_number, entity_size,
          current_utc) interacting non-linearly via a conditional
          (current_utc > window_due_date triggers an additive surcharge term
          that is independently discounted). The (b) instance pins the rounding
          order; this one exercises the conditional-branch × tiered-rate × time
          interaction. A MICRO W2 paid on-time expects 75200; the SAME
          window/entity paid late expects 75200 + 3200 = 78400.
        test_recipe:
          setup:
            - "Applicant MICRO_M (entity_size=MICRO, gross_income=0, prior_applications_filed=0, micro_qualifying_year=2025) created."
            - "Application AMUTL (UTILITY) created on 2018-01-01 and walked through to ISSUED on 2018-01-01."
            - "W1 PAID on time (window_due_date=2022-01-01, base MICRO 40000)."
            - "Clock now set to W2 due exactly (2026-01-01T00:00:00Z) — on-time payment of W2 MICRO base = 75200 should be ACCEPTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2018-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Micro M", entity_size: "MICRO", micro_qualifying_year: 2017, gross_income_prior_year_cents: 5000000, prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { micro_m_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${micro_m_id}", application_type: "UTILITY", title: "MUtility", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${micro_m_id}"
              captures: { amutl_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${amutl_id}", payment_category: "FILING", amount_cents: 6400 }
              as: Applicant
              as_user_id: "${micro_m_id}"
            - call: "POST /applications/${amutl_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${amutl_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${amutl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${micro_m_id}"
              captures: { amutl_v_pre_issue: $.data.version }
            - call: "POST /applications/${amutl_id}/pay-issue-fee"
              payload: { amount_cents: 24000, expected_application_version: "${amutl_v_pre_issue}" }
              as: Applicant
              as_user_id: "${micro_m_id}"
            - call: "GET /maintenance-fees"
              payload: { application_id: "${amutl_id}" }
              as: Applicant
              as_user_id: "${micro_m_id}"
              captures: { w1_id: "$.data[0].id", w2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2022-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /fee-payments"
              payload: { application_id: "${amutl_id}", payment_category: "MAINTENANCE_W1", amount_cents: 40000, maintenance_fee_id: "${w1_id}" }
              as: Applicant
              as_user_id: "${micro_m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /fee-payments"
              payload: { application_id: "${amutl_id}", payment_category: "MAINTENANCE_W2", amount_cents: 75200, maintenance_fee_id: "${w2_id}" }
              as: Applicant
              as_user_id: "${micro_m_id}"
              captures: { w2_pay_status: $.data.payment_status }
          assert:
            - "FeePayment.payment_status == 'POSTED'"
            - "MaintenanceFee.${w2_id}.fee_status == 'PAID'"
            - "FeePayment.amount_cents == 75200 (W2 MICRO base, no surcharge)"

  # ============================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_office_action_revision_cycle
        grounds:
          - state_machines.Application.OFFICE_ACTION_OUTSTANDING_to_RESPONSE_FILED
          - state_machines.Application.RESPONSE_FILED_to_OFFICE_ACTION_OUTSTANDING
        distinguishing_aspect: |
          Cycle on the Application entity: OFFICE_ACTION_OUTSTANDING → RESPONSE_FILED
          → OFFICE_ACTION_OUTSTANDING again as the examiner issues a second
          (e.g. FINAL) Office Action after the applicant's first response. Two
          distinct OUTSTANDING OAs are created in sequence on the same
          Application, both reachable via the same trigger endpoint
          POST /office-actions.
        test_recipe:
          setup:
            - "LARGE applicant, UTILITY application docketed and into AWAITING_EXAMINATION; first NON_FINAL OA issued; response filed; second FINAL OA issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Cycle Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { app_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_owner_id}", application_type: "UTILITY", title: "Cycle invention", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "POST /applications/${app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { oa1_id: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${oa1_id}", extension_months_requested: 0, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${app_owner_id}"
          trigger:
            - call: "POST /office-actions"
              payload: { application_id: "${app_id}", action_type: "FINAL" }
              as: USPTOExaminer
              captures: { oa2_id: $.data.id, app_status_after: $.data.application_id }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: USPTOExaminer
              captures: { final_app_status: $.data.status }
          assert:
            - "OfficeAction.${oa1_id}.status == 'RESPONDED'"
            - "OfficeAction.${oa2_id}.status == 'OUTSTANDING'"
            - "Application.${app_id}.status == 'OFFICE_ACTION_OUTSTANDING' (cycle re-entered)"

      - name: office_action_branching_terminal_states
        grounds:
          - state_machines.OfficeAction.OUTSTANDING_to_RESPONDED
          - state_machines.OfficeAction.OUTSTANDING_to_WITHDRAWN
        distinguishing_aspect: |
          Branching shape on the OfficeAction entity: from OUTSTANDING the OA
          fans out to one of THREE different terminal states (RESPONDED,
          WITHDRAWN, EXPIRED) by three structurally distinct triggers
          (applicant response, examiner NOA-on-other-OA, deadline sweep). This
          instance pins the RESPONDED-vs-WITHDRAWN branches on two sibling OAs
          of the same Application: when the examiner issues a NOA, the
          un-responded OA is WITHDRAWN; the responded OA is RESPONDED.
        test_recipe:
          setup:
            - "LARGE applicant; UTILITY application docketed; first NON_FINAL OA issued and RESPONDED."
            - "Second NON_FINAL OA issued (Application re-enters OFFICE_ACTION_OUTSTANDING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Branch Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { bowner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${bowner_id}", application_type: "UTILITY", title: "Branch invention", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${bowner_id}"
              captures: { bapp_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${bapp_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${bowner_id}"
            - call: "POST /applications/${bapp_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${bapp_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { oaA_id: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${oaA_id}", extension_months_requested: 0, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${bowner_id}"
            - call: "POST /office-actions"
              payload: { application_id: "${bapp_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { oaB_id: $.data.id }
          trigger:
            - call: "POST /office-actions"
              payload: { application_id: "${bapp_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
              captures: { noa_id: $.data.id }
          assert:
            - "OfficeAction.${oaA_id}.status == 'RESPONDED' (responded branch)"
            - "OfficeAction.${oaB_id}.status == 'WITHDRAWN' (NOA-supersede branch)"
            - "OfficeAction.${noa_id}.status == 'OUTSTANDING' (newly-created NOA)"
            - "Application.${bapp_id}.status == 'ALLOWED'"

  # ============================================================
  # Rule 4 — transitive_cascade (≥2, depth ≥3 and ≥2, different triggers)
  # ============================================================
  - rule_id: transitive_cascade
    instances:

      - name: pay_issue_fee_cascades_to_maintenance_generation
        grounds:
          - state_machines.Application.ALLOWED_to_ISSUED
          - entities.MaintenanceFee
          - entities.FeePayment
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /applications/{id}/pay-issue-fee:
          hop1 = FeePayment row POSTED; hop2 = Application.total_fees_paid_cents
          recomputed (caused by hop1) AND Application transitions ALLOWED →
          ISSUED (also caused by the POSTED fee passing the precondition); hop3
          = three MaintenanceFee rows generated (caused by hop2's ISSUED status,
          not by hop1's FeePayment directly — the issuance is what schedules the
          maintenance windows).
        test_recipe:
          setup:
            - "Application AISS in ALLOWED state owned by SMALL applicant; filing fee paid; NOA already issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "IssueFlow Co", entity_size: "SMALL", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { iss_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${iss_owner_id}", application_type: "UTILITY", title: "Issuance widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${iss_owner_id}"
              captures: { aiss_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${aiss_id}", payment_category: "FILING", amount_cents: 16000 }
              as: Applicant
              as_user_id: "${iss_owner_id}"
            - call: "POST /applications/${aiss_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${aiss_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${aiss_id}"
              payload: {}
              as: Applicant
              as_user_id: "${iss_owner_id}"
              captures: { aiss_v_pre_issue: $.data.version }
          trigger:
            - call: "POST /applications/${aiss_id}/pay-issue-fee"
              payload: { amount_cents: 60000, expected_application_version: "${aiss_v_pre_issue}" }
              as: Applicant
              as_user_id: "${iss_owner_id}"
              captures: { aiss_status_after: $.data.status, aiss_tot: $.data.total_fees_paid_cents }
            - call: "GET /maintenance-fees"
              payload: { application_id: "${aiss_id}" }
              as: Applicant
              as_user_id: "${iss_owner_id}"
              captures: { mf_count_check: $.data }
          assert:
            - "Application.${aiss_id}.status == 'ISSUED' (hop2)"
            - "Application.${aiss_id}.total_fees_paid_cents == 76000 (16000 FILING + 60000 ISSUE — hop2 recompute)"
            - "len(GET /maintenance-fees?application_id=${aiss_id}) == 3 (hop3: three windows generated)"

      - name: deadline_sweep_cascades_oa_expiry_to_application_abandonment
        grounds:
          - state_machines.OfficeAction.OUTSTANDING_to_EXPIRED
          - state_machines.Application.OFFICE_ACTION_OUTSTANDING_to_ABANDONED
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST /_jobs/sweep-deadlines (a DIFFERENT
          triggering transition from the issue-fee cascade above): hop1 = the
          OUTSTANDING OfficeAction whose maximum_due_date has elapsed transitions
          to EXPIRED; hop2 = THIS OA's EXPIRED state causes Application to
          transition OFFICE_ACTION_OUTSTANDING → ABANDONED.
        test_recipe:
          setup:
            - "LARGE applicant; UTILITY application docketed; NON_FINAL OA issued on 2026-01-01."
            - "Clock advanced past the 6-month maximum_due_date to 2026-07-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Lapse Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { lapse_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${lapse_owner_id}", application_type: "UTILITY", title: "Lapsed widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${lapse_owner_id}"
              captures: { lapse_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${lapse_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${lapse_owner_id}"
            - call: "POST /applications/${lapse_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${lapse_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { lapse_oa_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /_jobs/sweep-deadlines"
              payload: {}
              as: USPTOAdmin
              captures: { swept: $.data }
          assert:
            - "OfficeAction.${lapse_oa_id}.status == 'EXPIRED' (hop1)"
            - "Application.${lapse_app_id}.status == 'ABANDONED' (hop2)"

  # ============================================================
  # Rule 5 — priority_pair_validation_conflict (≥2, different category pairs)
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_fiscal_pay_issue_fee_wrong_state_and_wrong_amount
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Category pair STATE (priority 6) vs BUSINESS_FISCAL (priority 15): a
          POST /applications/{id}/pay-issue-fee against an Application still in
          FILED status (NOT ALLOWED) carrying amount_cents=99999 (also wrong)
          must return ERR_INVALID_STATE (priority 6 wins), NOT
          ERR_FEE_AMOUNT_MISMATCH.
        test_recipe:
          setup:
            - "LARGE applicant; UTILITY application in FILED status (no docket, no OA), filing fee NOT yet paid (so cannot advance even if examiner tried)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "PrioP1 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { p1_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${p1_owner_id}", application_type: "UTILITY", title: "Prio P1 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${p1_owner_id}"
              captures: { p1_app_id: $.data.id, p1_v0: $.data.version }
          trigger:
            - call: "POST /applications/${p1_app_id}/pay-issue-fee"
              payload: { amount_cents: 99999, expected_application_version: "${p1_v0}" }
              as: Applicant
              as_user_id: "${p1_owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 (INVALID_STATE wins on priority)"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: temporal_vs_fiscal_maintenance_outside_window_and_wrong_amount
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - errors[ERR_MAINTENANCE_WINDOW_CLOSED]
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Category pair BUSINESS_TEMPORAL (priority 14) vs BUSINESS_FISCAL
          (priority 15): paying a W1 MaintenanceFee BEFORE its window_open_date
          (clock at issue_date + 1 day) AND with amount_cents=0 (also wrong)
          must return ERR_MAINTENANCE_WINDOW_CLOSED (priority 14), NOT
          ERR_FEE_AMOUNT_MISMATCH. Different category pair from instance 1.
        test_recipe:
          setup:
            - "LARGE UTILITY application issued on 2026-01-01 (so W1 window opens 2029-07-01)."
            - "Clock at 2026-01-02 (well before any maintenance window)."
            - "W1 MaintenanceFee row generated in PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "PrioP2 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { p2_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${p2_owner_id}", application_type: "UTILITY", title: "Prio P2 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${p2_owner_id}"
              captures: { p2_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${p2_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${p2_owner_id}"
            - call: "POST /applications/${p2_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${p2_app_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${p2_app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${p2_owner_id}"
              captures: { p2_v_pre_issue: $.data.version }
            - call: "POST /applications/${p2_app_id}/pay-issue-fee"
              payload: { amount_cents: 120000, expected_application_version: "${p2_v_pre_issue}" }
              as: Applicant
              as_user_id: "${p2_owner_id}"
            - call: "GET /maintenance-fees"
              payload: { application_id: "${p2_app_id}" }
              as: Applicant
              as_user_id: "${p2_owner_id}"
              captures: { p2_w1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /fee-payments"
              payload: { application_id: "${p2_app_id}", payment_category: "MAINTENANCE_W1", amount_cents: 0, maintenance_fee_id: "${p2_w1_id}" }
              as: Applicant
              as_user_id: "${p2_owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 (WINDOW_CLOSED wins on priority)"
            - "response.data.error_id == 'ERR_MAINTENANCE_WINDOW_CLOSED'"

  # ============================================================
  # Rule 6 — boundary_precision_check (≥2, different metrics/endpoints)
  # ============================================================
  - rule_id: boundary_precision_check
    instances:

      - name: excess_claims_at_20_boundary_zero_fee
        grounds:
          - calculations.EXCESS_CLAIMS_FEE
          - entities.Application.fields.claim_count
        distinguishing_aspect: |
          Numeric metric boundary: at EXACTLY claim_count=20 and
          independent_claim_count=3 (both = the included-without-fee thresholds),
          EXCESS_CLAIMS_FEE = max(0, 20-20)*ECB + max(0, 3-3)*EIB = 0 cents.
          Paying any positive amount would fail VAL-FEE-AMOUNT-EXACT; paying 0
          is structurally not permitted (amount_cents > 0). Test asserts that
          NO EXCESS_CLAIMS payment is needed (only FILING) and Application can
          still be docketed. Reached via POST /applications.
        test_recipe:
          setup:
            - "LARGE applicant; create application with claim_count=20, independent_claim_count=3 (exact boundary)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Boundary Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { b_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${b_owner_id}", application_type: "UTILITY", title: "Boundary widget", claim_count: 20, independent_claim_count: 3 }
              as: Applicant
              as_user_id: "${b_owner_id}"
              captures: { b_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${b_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${b_owner_id}"
          trigger:
            - call: "POST /applications/${b_app_id}/docket"
              payload: {}
              as: USPTOExaminer
              captures: { final_status: $.data.status }
          assert:
            - "Application.${b_app_id}.status == 'AWAITING_EXAMINATION' (docket succeeded with only FILING fee, no excess required)"
            - "Application.${b_app_id}.total_fees_paid_cents == 32000"

      - name: pct_phase_entry_exact_30_month_boundary_accepted
        grounds:
          - validations[priority=11]
          - calculations.PRIORITY_DATE
          - entities.PCTPhaseEntry.fields.national_phase_due_date
        distinguishing_aspect: |
          Empty/temporal-boundary metric on a DIFFERENT endpoint
          (POST /pct-phase-entries): national_phase_due_date =
          pct_international_filing_date + 30 months. Creating a PCTPhaseEntry
          at EXACTLY the 30-month mark (current_utc == national_phase_due_date)
          is ACCEPTED (<= semantics, not <), while one microsecond later
          rejects with ERR_PCT_NATIONAL_PHASE_LATE. Different endpoint and
          different metric from the claim-count boundary above.
        test_recipe:
          setup:
            - "LARGE applicant; PCT_NATIONAL application created with pct_international_filing_date 2023-11-27."
            - "Clock set to EXACTLY pct_international_filing_date + 30 months = 2026-05-27T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-27T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "PCT Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { pct_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${pct_owner_id}", application_type: "PCT_NATIONAL", title: "PCT widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${pct_owner_id}"
              captures: { pct_app_id: $.data.id }
          trigger:
            - call: "POST /pct-phase-entries"
              payload: { application_id: "${pct_app_id}", pct_international_filing_date: "2023-11-27T00:00:00.000Z" }
              as: Applicant
              as_user_id: "${pct_owner_id}"
              captures: { pct_entry_id: $.data.id, pct_due: $.data.national_phase_due_date }
          assert:
            - "PCTPhaseEntry.${pct_entry_id}.phase_status == 'ENTERED' (boundary acceptance)"
            - "PCTPhaseEntry.${pct_entry_id}.national_phase_due_date == '2026-05-27T00:00:00.000Z'"

  # ============================================================
  # Rule 7 — cross_entity_state_dependency (≥2, different entity pairs)
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: response_requires_oa_outstanding_cross_oar_oa_pair
        grounds:
          - state_machines.OfficeAction.OUTSTANDING_to_RESPONDED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair OfficeActionResponse → OfficeAction: an
          OfficeActionResponse can only be created when the referenced
          OfficeAction.status == OUTSTANDING. If the OA has already been
          RESPONDED (e.g. another response was filed first), a second
          POST /office-action-responses against the same OA is rejected with
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "LARGE applicant, UTILITY application docketed, NON_FINAL OA OA1 issued and RESPONDED via response R1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "CE1 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { ce1_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ce1_owner_id}", application_type: "UTILITY", title: "CE1 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${ce1_owner_id}"
              captures: { ce1_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${ce1_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${ce1_owner_id}"
            - call: "POST /applications/${ce1_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${ce1_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { ce1_oa_id: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${ce1_oa_id}", extension_months_requested: 0, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${ce1_owner_id}"
          trigger:
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${ce1_oa_id}", extension_months_requested: 0, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${ce1_owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "OfficeAction.${ce1_oa_id}.status == 'RESPONDED' (unchanged from setup)"

      - name: maintenance_payment_requires_application_issued_cross_feepay_app_pair
        grounds:
          - state_machines.MaintenanceFee.PENDING_to_PAID
          - validations[priority=6]
        distinguishing_aspect: |
          DIFFERENT entity pair FeePayment → Application: a MaintenanceFee
          payment is only permitted when Application.status == ISSUED. Once
          the application is EXPIRED (because some earlier window LAPSED),
          subsequent payments against still-PENDING windows must be rejected
          with ERR_INVALID_STATE — even if the maintenance window is
          chronologically open.
        test_recipe:
          setup:
            - "LARGE UTILITY application issued on 2020-01-01; W1, W2, W3 generated."
            - "Clock advanced past W1 grace (2024-07-02) without paying W1; sweep runs → W1 LAPSED, Application EXPIRED."
            - "Clock now at 2026-01-01 — W1 lapsed, W2 still PENDING but Application EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "CE2 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { ce2_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ce2_owner_id}", application_type: "UTILITY", title: "CE2 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${ce2_owner_id}"
              captures: { ce2_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${ce2_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${ce2_owner_id}"
            - call: "POST /applications/${ce2_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${ce2_app_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${ce2_app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${ce2_owner_id}"
              captures: { ce2_v_pre_issue: $.data.version }
            - call: "POST /applications/${ce2_app_id}/pay-issue-fee"
              payload: { amount_cents: 120000, expected_application_version: "${ce2_v_pre_issue}" }
              as: Applicant
              as_user_id: "${ce2_owner_id}"
            - call: "GET /maintenance-fees"
              payload: { application_id: "${ce2_app_id}" }
              as: Applicant
              as_user_id: "${ce2_owner_id}"
              captures: { ce2_w2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-07-02T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /_jobs/sweep-deadlines"
              payload: {}
              as: USPTOAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /fee-payments"
              payload: { application_id: "${ce2_app_id}", payment_category: "MAINTENANCE_W2", amount_cents: 376000, maintenance_fee_id: "${ce2_w2_id}" }
              as: Applicant
              as_user_id: "${ce2_owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE' (application not ISSUED, it is EXPIRED)"
            - "Application.${ce2_app_id}.status == 'EXPIRED'"

  # ============================================================
  # Rule 8 — resource_temporal_overlap (≥2, different interval semantics)
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: at_most_one_outstanding_oa_per_application_capacity_one
        grounds:
          - validations[priority=20]
          - errors[ERR_OFFICE_ACTION_ALREADY_OUTSTANDING]
          - state_machines.OfficeAction
        distinguishing_aspect: |
          Interval-semantics A: aggregate-capacity-of-1 overlap on the
          Application resource. The "interval" of an OUTSTANDING OA spans
          [issue_date, maximum_due_date]. Issuing a second NON_FINAL OA while
          another OA already occupies the OUTSTANDING slot overlaps that
          interval and is rejected with ERR_OFFICE_ACTION_ALREADY_OUTSTANDING.
          Only NOTICE_OF_ALLOWANCE can ride over the interval (it withdraws the
          incumbent).
        test_recipe:
          setup:
            - "LARGE UTILITY application docketed; one NON_FINAL OA OA_X issued and OUTSTANDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Overlap1 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { ov1_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ov1_owner_id}", application_type: "UTILITY", title: "Overlap1 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${ov1_owner_id}"
              captures: { ov1_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${ov1_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${ov1_owner_id}"
            - call: "POST /applications/${ov1_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${ov1_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { ov1_oa_id: $.data.id }
          trigger:
            - call: "POST /office-actions"
              payload: { application_id: "${ov1_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_OFFICE_ACTION_ALREADY_OUTSTANDING'"
            - "OfficeAction.${ov1_oa_id}.status == 'OUTSTANDING' (incumbent unchanged)"

      - name: pct_phase_entry_singleton_per_application
        grounds:
          - validations[priority=21]
          - errors[ERR_PCT_PHASE_ENTRY_DUPLICATE]
          - entities.PCTPhaseEntry
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource: singleton
          uniqueness on PCTPhaseEntry — the "interval" is the entire lifetime
          of the parent Application (not a time-bounded window). At most one
          PCTPhaseEntry may exist per Application; a second
          POST /pct-phase-entries against the same application_id is rejected
          with ERR_PCT_PHASE_ENTRY_DUPLICATE.
        test_recipe:
          setup:
            - "LARGE applicant; PCT_NATIONAL application created with pct_international_filing_date 2024-01-01; first PCTPhaseEntry already ENTERED on 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Overlap2 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { ov2_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${ov2_owner_id}", application_type: "PCT_NATIONAL", title: "Overlap2 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${ov2_owner_id}"
              captures: { ov2_app_id: $.data.id }
            - call: "POST /pct-phase-entries"
              payload: { application_id: "${ov2_app_id}", pct_international_filing_date: "2024-01-01T00:00:00.000Z" }
              as: Applicant
              as_user_id: "${ov2_owner_id}"
              captures: { ov2_entry_id: $.data.id }
          trigger:
            - call: "POST /pct-phase-entries"
              payload: { application_id: "${ov2_app_id}", pct_international_filing_date: "2024-01-01T00:00:00.000Z" }
              as: Applicant
              as_user_id: "${ov2_owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_PCT_PHASE_ENTRY_DUPLICATE'"
            - "len(GET /pct-phase-entries?application_id=${ov2_app_id}) == 1"

  # ============================================================
  # Rule 9 — compensating_invariant (≥2, different conserved quantities)
  # ============================================================
  - rule_id: compensating_invariant
    instances:

      - name: ledger_conservation_total_fees_equals_sum_of_payments
        grounds:
          - entities.Application.fields.total_fees_paid_cents
          - entities.FeePayment.fields.amount_cents
          - state_machines.Application.ALLOWED_to_ISSUED
        distinguishing_aspect: |
          Conserved quantity = monetary fee ledger (USD cents). After every
          FeePayment side-effect chain runs forward,
          Application.total_fees_paid_cents MUST equal
          sum(FeePayment.amount_cents WHERE application_id = X AND
          payment_status = POSTED). The invariant is pinned across the
          FILING → ISSUE chain: 16000 + 60000 = 76000 SMALL UTILITY.
        test_recipe:
          setup:
            - "SMALL applicant, UTILITY application created, FILING fee 16000 POSTED, application docketed and ALLOWED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Conserv1 Co", entity_size: "SMALL", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { c1_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${c1_owner_id}", application_type: "UTILITY", title: "Conserv1 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${c1_owner_id}"
              captures: { c1_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${c1_app_id}", payment_category: "FILING", amount_cents: 16000 }
              as: Applicant
              as_user_id: "${c1_owner_id}"
            - call: "POST /applications/${c1_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${c1_app_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${c1_app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${c1_owner_id}"
              captures: { c1_v_pre_issue: $.data.version }
          trigger:
            - call: "POST /applications/${c1_app_id}/pay-issue-fee"
              payload: { amount_cents: 60000, expected_application_version: "${c1_v_pre_issue}" }
              as: Applicant
              as_user_id: "${c1_owner_id}"
              captures: { post_tot: $.data.total_fees_paid_cents }
            - call: "GET /fee-payments"
              payload: { application_id: "${c1_app_id}" }
              as: Applicant
              as_user_id: "${c1_owner_id}"
              captures: { payments_list: $.data }
          assert:
            - "Application.${c1_app_id}.total_fees_paid_cents == 76000"
            - "sum(GET /fee-payments?application_id=${c1_app_id} amount_cents) == 76000"
            - "Application.${c1_app_id}.total_fees_paid_cents == sum(FeePayment.amount_cents for application_id=${c1_app_id})"

      - name: oa_population_conservation_outstanding_plus_withdrawn_equals_initial
        grounds:
          - state_machines.OfficeAction.OUTSTANDING_to_WITHDRAWN
          - state_machines.Application.OFFICE_ACTION_OUTSTANDING_to_ALLOWED
        distinguishing_aspect: |
          DIFFERENT conserved quantity: count of OfficeAction rows per
          Application is conserved across the NOA-supersede cascade. Before
          NOA: count(OAs) = N, with all in OUTSTANDING. After NOA: count(OAs)
          = N + 1 (the NOA itself is a new OA), where N OAs are WITHDRAWN and
          1 (the NOA) is OUTSTANDING. The invariant: rows are never deleted,
          only transitioned — count of all OAs strictly increases by 1 per
          POST /office-actions, never decreases. Conserved quantity is the
          total row count over the OfficeAction table for this application_id.
        test_recipe:
          setup:
            - "LARGE applicant, UTILITY application docketed."
            - "Two NON_FINAL OAs issued and RESPONDED in succession, then one third NON_FINAL OA OUTSTANDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Conserv2 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { c2_owner_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${c2_owner_id}", application_type: "UTILITY", title: "Conserv2 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${c2_owner_id}"
              captures: { c2_app_id: $.data.id }
            - call: "POST /fee-payments"
              payload: { application_id: "${c2_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${c2_owner_id}"
            - call: "POST /applications/${c2_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${c2_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { c2_oa1_id: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${c2_oa1_id}", extension_months_requested: 0, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${c2_owner_id}"
            - call: "POST /office-actions"
              payload: { application_id: "${c2_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { c2_oa2_id: $.data.id }
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${c2_oa2_id}", extension_months_requested: 0, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${c2_owner_id}"
            - call: "POST /office-actions"
              payload: { application_id: "${c2_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { c2_oa3_id: $.data.id }
          trigger:
            - call: "POST /office-actions"
              payload: { application_id: "${c2_app_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
              captures: { c2_noa_id: $.data.id }
            - call: "GET /office-actions"
              payload: { application_id: "${c2_app_id}" }
              as: USPTOExaminer
              captures: { final_oas: $.data }
          assert:
            - "len(GET /office-actions?application_id=${c2_app_id}) == 4 (row count conserved + 1 NOA)"
            - "OfficeAction.${c2_oa1_id}.status == 'RESPONDED' (terminal, untouched)"
            - "OfficeAction.${c2_oa2_id}.status == 'RESPONDED' (terminal, untouched)"
            - "OfficeAction.${c2_oa3_id}.status == 'WITHDRAWN' (NOA superseded only this OUTSTANDING one)"
            - "OfficeAction.${c2_noa_id}.status == 'OUTSTANDING'"
            - "Application.${c2_app_id}.status == 'ALLOWED'"
