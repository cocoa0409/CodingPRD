- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_beats_temporal_on_resubmit
    grounds:
    - validations[priority=7]
    - validations[priority=9]
    - state_machines.Entry.DRAFT_to_SUBMITTED
    distinguishing_aspect: 'Error-category pair state vs business_temporal: resubmitting an already-SUBMITTED entry after the late window violates both ERR_INVALID_STATE
      (priority 7) and ERR_OUTSIDE_WINDOW (priority 9); the lower-priority-number state error MUST win — distinct category pair from the safety-vs-constraint sibling.'
    test_recipe:
      setup:
      - Season GALA-PRIO1 OPEN; entry e1 already SUBMITTED at 2026-08-10; clock then advanced to 2026-09-05 (beyond late window close 2026-09-03T00:00:00Z).
      setup_api_calls:
      - call: POST /awards/_clock/set_current_utc
        as: ProgramAdmin
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
