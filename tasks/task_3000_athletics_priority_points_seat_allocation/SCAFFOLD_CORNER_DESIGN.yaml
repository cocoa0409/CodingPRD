  # ---------------------------------------------------------------------------
  # Consistency Model — claim-extraction-guide.md §9. §1.0 declares
  # consistency_model: immediate, whose single row is "all changes visible in
  # same request's response". The three claims below attack the three ways an
  # implementation can fail that: a cascade that lands after the response body is
  # built, an aggregate that is computed on the next read instead of in the
  # writing request, and a derived value that drifts between two identical reads
  # because it is reconciled lazily. No claim here may wait, retry or poll — the
  # FIRST observation is the assertion.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: the_pick_response_and_the_first_read_after_it_already_show_every_cascaded_counter
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /athletics/selection-slots/{id}/pick]
        distinguishing_aspect: |
          A pick has six declared side effects spread over four entities other
          than the row it returns. Under an immediate model all of them must be
          durable before the 201 is emitted, so the FIRST read of the Seat, the
          Section, the SelectionSlot and the SelectionEvent must already show the
          new values — no second read, no delay, no reconciliation pass. The
          section is given two seats so that seats_available lands on 1 rather
          than 0, which distinguishes a real decrement from a counter that was
          merely clamped.
        test_recipe:
          setup:
            - "Section SEC-S with seat_capacity 2, per_seat_requirement_cents 120000, required_points_per_seat 0.00 and TWO seats."
            - "One donor with certified_points 15.00 from a 1000000-cent RECEIVED ATHLETICS_ANNUAL gift dated 2026-03-01."
            - "A CERTIFIED cycle-2026 recalculation with a SEASON_TICKET event over 2026-09-01T00:00:00.000Z..2026-09-02T00:00:00.000Z at slot_minutes 1440, published and gated OPEN, so scheduled_slot_count is 1."
            - "Logical clock at 2026-09-01T06:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-S", venue_code: "STADIUM-S", seat_capacity: 2, per_seat_requirement_cents: 120000, required_points_per_seat: 0.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secs_id: "$.data.id" }
            - call: "POST /athletics/sections/${secs_id}/seats"
              payload: { row_label: "S", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seats1_id: "$.data.id" }
            - call: "POST /athletics/sections/${secs_id}/seats"
              payload: { row_label: "S", seat_number: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seats2_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Ima Immediate", email: "ima.immediate@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ima_id: "$.data.id" }
            - call: "POST /athletics/donors/${ima_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { imar_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${imar_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${imar_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${imar_id}"
