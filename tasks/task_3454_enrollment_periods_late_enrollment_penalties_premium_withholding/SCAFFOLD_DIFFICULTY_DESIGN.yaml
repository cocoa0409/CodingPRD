  - rule_id: priority_pair_validation_conflict
    instances:
      - name: no_open_window_beats_duplicate_enrollment
        grounds:
          - validations[priority=18]
          - validations[priority=21]
          - errors[ERR_NO_OPEN_ENROLLMENT_WINDOW]
          - errors[ERR_DUPLICATE_ENROLLMENT]
        distinguishing_aspect: |
          Error-category pair {business_temporal vs business_constraint}: the
          enrollment request violates BOTH the window rule (IEP expired, no SEP,
          not GEP season) and the duplicate-part rule (an ACTIVE PART_B exists).
          Priority 18 beats 21 -> ERR_NO_OPEN_ENROLLMENT_WINDOW must win.
          Different category pair than the {state vs business_fiscal} instance.
        test_recipe:
          setup:
            - "Beneficiary DOB 1960-06-10 (attainment 2025-06, IEP end 2025-09); PART_B enrolled at clock 2025-06-10 (M == T -> effective 2025-07) and activated by a cycle at 2025-07-05"
            - "Clock at 2026-06-10: no open window AND duplicate part"
          setup_api_calls:
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Polly Priority", date_of_birth: "1960-06-10" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-05T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: BenefitAdministrator
          trigger:
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NO_OPEN_ENROLLMENT_WINDOW (business_temporal, priority 18) — NOT ERR_DUPLICATE_ENROLLMENT (business_constraint, priority 21), although both conditions hold"
      - name: invoice_state_beats_payment_amount_mismatch
        grounds:
          - validations[priority=17]
          - validations[priority=37]
          - errors[ERR_INVOICE_NOT_PAYABLE]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Error-category pair {state vs business_fiscal}: paying an already-PAID
          invoice with a wrong amount violates both rules; priority 17 (state)
          beats 37 (fiscal) -> ERR_INVOICE_NOT_PAYABLE. Different pair than
          {business_temporal vs business_constraint} above.
        test_recipe:
          setup:
            - "Rate schedule 2026; beneficiary DOB 1961-04-12; PART_B effective 2026-06; cycle at 2026-06-15 issues invoice (18500, fallback, no determination)"
            - "Invoice paid in full (18500) -> PAID"
          setup_api_calls:
            - call: "POST /medicare/rate-schedules"
              payload: { coverage_year: 2026, part_b_standard_cents: 18500, part_d_national_base_cents: 3450, irmaa_brackets: [ { tier: 0, single_floor_cents: 0, joint_floor_cents: 0, part_b_surcharge_cents: 0, part_d_surcharge_cents: 0 }, { tier: 1, single_floor_cents: 10000000, joint_floor_cents: 20000000, part_b_surcharge_cents: 7400, part_d_surcharge_cents: 1370 }, { tier: 2, single_floor_cents: 13300000, joint_floor_cents: 26600000, part_b_surcharge_cents: 18500, part_d_surcharge_cents: 3530 }, { tier: 3, single_floor_cents: 16700000, joint_floor_cents: 33400000, part_b_surcharge_cents: 29590, part_d_surcharge_cents: 5680 }, { tier: 4, single_floor_cents: 20000000, joint_floor_cents: 40000000, part_b_surcharge_cents: 40680, part_d_surcharge_cents: 7850 }, { tier: 5, single_floor_cents: 50000000, joint_floor_cents: 75000000, part_b_surcharge_cents: 44390, part_d_surcharge_cents: 8580 } ] }
              as: BenefitAdministrator
            - call: "POST /medicare/beneficiaries"
              payload: { full_name: "Pete Payee", date_of_birth: "1961-04-12" }
              as: FieldOfficer
              captures: { b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /medicare/enrollments"
              payload: { beneficiary_id: "${b_id}", part: "PART_B" }
              as: Beneficiary
              as_user_id: "${b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BenefitAdministrator
            - call: "POST /_ops/run_monthly_cycle"
              as: BenefitAdministrator
            - call: "GET /medicare/beneficiaries/${b_id}/invoices"
              as: Beneficiary
              as_user_id: "${b_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /medicare/invoices/${inv_id}/pay"
              payload: { amount_cents: 18500 }
