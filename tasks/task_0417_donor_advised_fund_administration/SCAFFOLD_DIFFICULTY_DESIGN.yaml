          assert:
            - "HTTP status == 409"
            - "error_id == ERR_RECURRING_GRANT_OVERLAP (closed-window adjacency at quarter 5 collides)"
            - "GrantRecommendation.${grant_b_id}.status == APPROVED (schedule rejected)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  #   instance 1 = grant pay redeem leg conserves (cash + invested); net debit == amount_cents
  #   instance 2 = legacy split conserves residual; sum of LEGACY_DISBURSEMENT == residual
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_payout_redeem_conserves_cash_plus_invested
        grounds:
          - calculations.grant_payout_redemption
          - state_machines.GrantRecommendation.SCHEDULED_to_PAID
          - entities.DonorAccount.fields.cash_balance_cents
          - entities.DonorAccount.fields.invested_value_cents
        distinguishing_aspect: |
          Conserved quantity #1 = (cash_balance_cents + invested_value_cents). The redeem leg of
          grant pay credits cash exactly equal to invested debited at per-allocation nav, so the
          sum is unchanged BY the redemption; only the subsequent grant debit reduces it, by
          exactly amount_cents. Starting from cash 30000 + invested 150000 = 180000, after paying a
          100000-cent grant the sum is 80000 (drift == 0 across the redeem leg).
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE DonorAccount with cash_balance_cents=30000 and invested_value_cents=150000 (two ACTIVE allocations value 100000 and 50000 in a nav=2500 pool); one SCHEDULED grant of 100000 cents."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Cons Sponsor", ein: "17-8080808" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Cons Pool", risk_tier: "BALANCED", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Hospice", ein: "17-9000001", ntee_code: "P74", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Cons Fund", primary_advisor_user_id: "adv-15" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 180000 }
              as: DonorAdvisor
              as_user_id: "adv-15"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 100000, target_pct_bps: 6000 }
              as: DonorAdvisor
              as_user_id: "adv-15"
              captures: { buy1_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy1_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-15"
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 50000, target_pct_bps: 4000 }
              as: DonorAdvisor
              as_user_id: "adv-15"
              captures: { buy2_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy2_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-15"
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-15"
              captures: { ver1: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-15"
              captures: { grant_id: $.data.id }
            - call: "POST /daf/grants/${grant_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-9"
            - call: "POST /daf/grants/${grant_id}/schedule"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-9"
          trigger:
            - call: "POST /daf/grants/${grant_id}/pay"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-9"
          assert:
            - "Before pay: DonorAccount.${acct_id}.cash_balance_cents + invested_value_cents == 180000"
            - "After pay: DonorAccount.${acct_id}.cash_balance_cents == 0 and invested_value_cents == 80000"
            - "After pay: cash_balance_cents + invested_value_cents == 80000 == 180000 - 100000 (net reduction exactly amount_cents)"

      - name: legacy_split_largest_remainder_conserves_residual
        grounds:
          - calculations.legacy_split
          - state_machines.DonorAccount.WIND_DOWN_to_CLOSED
          - entities.LedgerEntry.fields.entry_type
          - entities.SuccessionPlan.fields.beneficiaries
        distinguishing_aspect: |
          Conserved quantity #2 = residual cash distributed to legacy beneficiaries (a DIFFERENT
          conserved quantity from cash+invested). With residual 100001 and share_bps
          [3334,3333,3333], floors are [33340,33330,33330] summing 100000; the largest-remainder
          rule hands the single leftover cent to beneficiary index 0 (highest fractional part),
          giving final shares [33341,33330,33330] whose sum == 100001 == residual (zero drift).
        test_recipe:
          setup:
            - "Sponsor; three VETTED charities; ACTIVE DonorAccount funded with exactly 100001 cents settled cash (no pools, no committed grants); a CONFIRMED LEGACY_GRANTS SuccessionPlan with beneficiaries share_bps [3334,3333,3333]; account moved to WIND_DOWN."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Leg Sponsor", ein: "18-9090909" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Ben One", ein: "18-9000001", ntee_code: "B82", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { ben1_id: $.data.id }
            - call: "POST /daf/charities/${ben1_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Ben Two", ein: "18-9000002", ntee_code: "B83", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { ben2_id: $.data.id }
            - call: "POST /daf/charities/${ben2_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Ben Three", ein: "18-9000003", ntee_code: "B84", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { ben3_id: $.data.id }
            - call: "POST /daf/charities/${ben3_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Leg Fund", primary_advisor_user_id: "adv-16" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 100001 }
              as: DonorAdvisor
              as_user_id: "adv-16"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/succession-plans"
              payload: { donor_account_id: "${acct_id}", plan_type: "LEGACY_GRANTS", beneficiaries: [ { charity_id: "${ben1_id}", share_bps: 3334 }, { charity_id: "${ben2_id}", share_bps: 3333 }, { charity_id: "${ben3_id}", share_bps: 3333 } ] }
              as: DonorAdvisor
              as_user_id: "adv-16"
              captures: { plan_id: $.data.id }
            - call: "POST /daf/succession-plans/${plan_id}/confirm"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-16"
            - call: "POST /daf/accounts/${acct_id}/wind-down"
              payload: {}
              as: SponsorAdmin
          trigger:
            - call: "POST /daf/accounts/${acct_id}/execute-succession"
              payload: {}
              as: SponsorAdmin
          assert:
            - "DonorAccount.${acct_id}.status == CLOSED and cash_balance_cents == 0"
            - "Three LedgerEntry with entry_type == LEGACY_DISBURSEMENT exist with signed_amount_cents [-33341, -33330, -33330]"
            - "Sum of LEGACY_DISBURSEMENT signed amounts == -100001 (abs sum == residual, zero drift)"
            - "SuccessionPlan.${plan_id}.status == EXECUTED"
