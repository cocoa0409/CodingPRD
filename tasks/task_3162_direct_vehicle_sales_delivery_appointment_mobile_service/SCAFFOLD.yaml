      - { name: entry_type, type: enum, source: input, description: "ORDER_FEE_PAYMENT | ORDER_FEE_REFUND | TRADE_IN_CREDIT | TRADE_IN_CREDIT_REVERSAL | DELIVERY_FEE_CHARGE | DELIVERY_FEE_WAIVER" }
