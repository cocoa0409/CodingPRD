              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m1}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m1}", claim_type: "LATE_ARRIVAL", reason_code: "OVERDUE_ARRIVAL" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl_occ: $.data.id, cl_occ_v1: $.data.version }
            - call: "POST /in-bond/petitions"
              payload: { claim_id: "${cl_occ}", mitigation_factors: ["FIRST_VIOLATION"], narrative_reference: "PET-0120", expected_claim_version: "${cl_occ_v1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { pet_occ: $.data.id }
          trigger:
            - call: "POST /in-bond/petitions"
              payload: { claim_id: "${cl_occ}", mitigation_factors: ["FIRST_VIOLATION", "CARGO_SECURED_INTACT"], narrative_reference: "PET-0121", expected_claim_version: "${cl_occ_v1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "HTTP status == 412"
            - "error_id == ERR_STALE_CLAIM_VERSION"
            - "GET /in-bond/ld-claims/${cl_occ}/petitions returns total_count == 1 with the single row's id == ${pet_occ}"
            - "MitigationPetition.${pet_occ}.status == SUBMITTED"
            - "MitigationPetition.${pet_occ}.mitigation_pct == 0.20"
            - "MitigationPetition.${pet_occ}.net_before_fee == 987.68"
            - "MitigationPetition.${pet_occ}.processing_fee == 100.00"
            - "MitigationPetition.${pet_occ}.offer_amount == 1087.68"
            - "LiquidatedDamagesClaim.${cl_occ}.status == PETITIONED"
            - "LiquidatedDamagesClaim.${cl_occ}.version == 2"

      - name: four_sanction_points_stay_below_the_throttle_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.carrier_sanction_points.constants.SANCTION_THROTTLE_THRESHOLD
          - calculations.transit_allowance_and_deadline
        distinguishing_aspect: "A single SEAL_VIOLATION claim scores 4.0 — one bucket below the 6.0 throttle — so the next IT filing must still earn the full 35 days with a 2026-09-09T00:00:00Z deadline and the carrier must stay ACTIVE."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; M1 filed 2026-08-01 and departed."
            - "At 2026-08-05T00:00:00Z a BROKEN_UNAUTHORIZED seal event is recorded at 3901, and OFF-1 issues a SEAL_VIOLATION claim (overdue 0 -> statutory minimum 1000.00, 4 points)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/seal-events"
              payload: { movement_id: "${m1}", event_type: "BROKEN_UNAUTHORIZED", seal_number: "SEAL-100", port_code: "3901" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m1}", claim_type: "SEAL_VIOLATION", reason_code: "SEAL_BROKEN_IN_TRANSIT" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl_sv: $.data.id, cl_sv_amt: $.data.assessed_amount }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0090", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m_next: $.data.id }
          assert:
            - "HTTP status == 201"
            - "LiquidatedDamagesClaim.${cl_sv}.overdue_days_at_issue == 0"
            - "LiquidatedDamagesClaim.${cl_sv}.assessed_amount == 1000.00 (captured as ${cl_sv_amt})"
            - "BondedCarrier.${c1}.sanction_points == 4.0"
            - "BondedCarrier.${c1}.custodial_status == ACTIVE"
            - "InBondMovement.${m_next}.transit_days_allowed == 35"
            - "InBondMovement.${m_next}.deadline_anchor_utc == 2026-08-05T00:00:00Z"
            - "InBondMovement.${m_next}.transit_deadline_utc == 2026-09-09T00:00:00Z"
            - "CustomsBond.${b1}.obligated_amount == 1083.50"
            - "CustomsBond.${b1}.available_amount == 48916.50"

      - name: cascading_side_effects_layer_stub
        claim_type: cascading_side_effects
        grounds:
