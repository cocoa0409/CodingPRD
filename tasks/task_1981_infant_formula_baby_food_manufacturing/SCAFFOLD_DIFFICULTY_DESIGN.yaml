            - "HTTP status == 422"

  # =========================================================================
  # Rule 6: boundary_precision_check — different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: audit_score_exactly_at_pass_threshold
        grounds:
          - calculations.audit_result_determination
          - validations[priority=17]
        distinguishing_aspect: |
          Boundary at score == 75.00 (PASS_THRESHOLD). A score of exactly 75.00
          with no critical or major findings produces PASS (>= 75.00), while
          74.99 produces CONDITIONAL_PASS (< 75.00). Tests the >= vs > boundary
          on the audit score metric via the audit submission endpoint.
        test_recipe:
          setup:
            - "A PENDING_AUDIT Supplier exists."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-BOUND-A"
                legal_name: "Boundary Test Supplier A"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { supb_a_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-BOUND-B"
                legal_name: "Boundary Test Supplier B"
                ingredient_categories: ["VEGETABLE_OIL"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { supb_b_id: $.data.id }
          trigger:
            - call: "POST /api/v1/suppliers/${supb_a_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Boundary Auditor"
                score: 75.00
                findings: []
              as: QUALITY_ANALYST
              captures: { audit_a: $.data }
            - call: "POST /api/v1/suppliers/${supb_b_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Boundary Auditor"
                score: 74.99
                findings: []
              as: QUALITY_ANALYST
              captures: { audit_b: $.data }
          assert:
            - "AuditRecord for SUP-BOUND-A has result == PASS (score 75.00 >= 75.00)"
            - "AuditRecord for SUP-BOUND-B has result == CONDITIONAL_PASS (score 74.99 < 75.00)"
            - "Supplier SUP-BOUND-A has qualification_status == QUALIFIED (PASS triggers qualification)"
            - "Supplier SUP-BOUND-B has qualification_status == QUALIFIED (CONDITIONAL_PASS also triggers qualification)"

