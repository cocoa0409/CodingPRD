            - call: "POST /dealers/${dlr_a_id}/credit-limit"
              payload: { credit_limit_cents: 1000000 }
              as: PlantAdmin
              captures: { st2: $.data.status, av2: $.data.credit_available_cents, dlr_v2: $.data.version }
            - call: "GET /dealer-orders/${o2_id}"
              payload: {}
              as: PlantAdmin
              captures: { o2_p2: $.data.production_status, o2_v2: $.data.version }
            - call: "POST /dealers/${dlr_a_id}/credit-limit"
              payload: { credit_limit_cents: 3999468 }
