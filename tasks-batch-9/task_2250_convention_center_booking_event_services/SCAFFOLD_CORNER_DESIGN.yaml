              as: SalesManager
              captures: { bk_id: $.data.id, bk_v1: $.data.version }
            - call: "POST /convention-center/bookings/${bk_id}/holds"
              payload: { expected_booking_version: "${bk_v1}" }
              as: SalesManager
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "00000000-0000-4000-8000-000000000000", space_id: "${sp_mr_id}", event_name: "Ghost Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-04-01", show_start_date: "2027-04-02", show_end_date: "2027-04-04", move_out_end_date: "2027-04-05" }
              as: SalesManager
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "00000000-0000-4000-8000-000000000000", event_name: "Ghost Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-04-01", show_start_date: "2027-04-02", show_end_date: "2027-04-04", move_out_end_date: "2027-04-05" }
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/service-orders"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000000", service_category: "CLEANING", ordered_quantity: 1000 }
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "00000000-0000-4000-8000-000000000000", work_category: "CLEANING", work_date: "2027-03-01", scheduled_start_hour: 8.0, scheduled_end_hour: 12.0, crew_size: 2 }
              as: EventServicesManager
            - call: "POST /convention-center/holds/${hold_id}/challenge"
              payload: { challenger_hold_id: "00000000-0000-4000-8000-000000000000" }
              as: SalesManager
            - call: "POST /convention-center/settlement-line-items"
              payload: { settlement_id: "00000000-0000-4000-8000-000000000000", line_kind: "ADJUSTMENT", amount_cents: -1000, memo: "ghost" }
              as: SettlementAnalyst
          assert:
            - "every trigger returns 404"
            - "the six error_id values are, in order, ERR_CLIENT_NOT_FOUND, ERR_SPACE_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_SETTLEMENT_NOT_FOUND"
            - "SpaceHold.${hold_id}.status == ACTIVE and challenged_by_hold_id == null"
            - "GET /convention-center/bookings filtered on ${cl_ssp_id} still returns total_count == 1"

      - name: booking_for_an_unpublished_event_class_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors[ERR_POLICY_WINDOW_MISSING]
          - entities.EventBooking.fields.policy_window_id
        distinguishing_aspect: |
          Only the LOCAL_EVENT window is published, so a CONSUMER_SHOW booking has no
          policy window to resolve. The failure is 422 ERR_POLICY_WINDOW_MISSING at
          priority 34 rather than a 404 on a body foreign key, because the request never
          names a window identifier at all; it is derived from event_class.
        test_recipe:
          setup:
            - "only the LOCAL_EVENT policy window has been published"
            - "no CONSUMER_SHOW window exists"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "LOCAL_EVENT", priority_rank: 2, open_months_before: 24, close_months_before: 3, max_holds_per_booking: 2, challenge_response_hours: 72, rental_discount_pct: 0.1, max_challenge_rounds: 2 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
