# =============================================================================
# task_2456 — Warranty Reserve & Product Liability Accrual
# §1.9 Scaffold Corner Design — BREADTH probe.
#
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs with no test_recipe.
#
# Fixed facts used throughout:
#   * logical clock starts at 2026-08-01T00:00:00Z (POST /warranty/_clock/set_current_utc)
#   * HISTORY_MATURITY_MONTHS 12 / HISTORY_MATURITY_UNITS 5000
#   * LIFETIME_DEVELOPMENT_FACTOR_BPS 25000 / ANALOG_BLEND_ENG_WEIGHT_BPS 6000
#   * LABOR_RATE_CENTS_PER_HOUR 9500
#   * POSTURE_ELEVATED_BPS 8000 / POSTURE_CONSTRAINED_BPS 10000
#   * COLLECTABILITY_BPS HIGH 9000 / MEDIUM 6000 / LOW 2500 / IMPAIRED 0
#   * REALIZATION_HOLD_BPS 7500 / REALIZATION_WATCH_BPS 4000
#   * LAG_FACTOR_PER_MONTH_BPS 1200 / LAG_FACTOR_CAP_BPS 6000
#   * IBNR_CAP_BPS 15000 / IBNR_FLOOR_CENTS_PER_UNIT 25
#   * SIGNIFICANT_EXPOSURE_THRESHOLD_CENTS 50000000
#   * the canonical analog basis reused below: ProductFamily FAM-A with 10000
#     units and 300 observed claims develops to 75000 ppm; a downstream family
#     with engineering_estimate_rate_ppm 4000 blends to 32400 ppm, so a 3000-unit
#     vintage priced at 30000 cents per claim accrues 97 * 30000 == 2910000 cents.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_create_product_family_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.ProductFamily
          - endpoints[POST /warranty/product-families]
          - response_envelope.success
        distinguishing_aspect: "POST /warranty/product-families with only the six required input fields returns 201 and a body carrying all 15 declared ProductFamily fields at their declared defaults."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C1", name: "Corner Cooktop Platform", launch_date: "2025-03-01", base_warranty_months: 24, standard_cost_per_claim_cents: 18000, reserve_cap_cents: 25000000 }
              as: WarrantyAnalyst
              captures: { fam_c1_id: $.data.id }
          trigger:
            - call: "GET /warranty/product-families/${fam_c1_id}"
              payload: {}
              as: WarrantyAnalyst
          assert:
            - "The create call returned 201"
            - "ProductFamily.${fam_c1_id}.family_code == \"FAM-C1\" and name == \"Corner Cooktop Platform\""
            - "ProductFamily.${fam_c1_id}.launch_date == \"2025-03-01\", base_warranty_months == 24, standard_cost_per_claim_cents == 18000, reserve_cap_cents == 25000000"
            - "ProductFamily.${fam_c1_id}.engineering_estimate_rate_ppm == null and analog_family_id == null"
            - "ProductFamily.${fam_c1_id}.observed_history_months == 0, observed_exposure_units == 0, units_sold_lifetime == 0"
            - "ProductFamily.${fam_c1_id}.history_maturity_status == LIMITED, warranty_reserve_balance_cents == 0, reserve_posture == NORMAL"
            - "ProductFamily.${fam_c1_id}.version == 1 and id, created_at, updated_at are all non-null"
            - "The response body carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: corner_get_vintage_returns_stored_row_unmodified
        claim_type: Retrieval
        grounds:
          - entities.ProductVintage
          - endpoints[GET /warranty/vintages/{vintageId}]
        distinguishing_aspect: "GET /warranty/vintages/{vintageId} echoes every stored input field byte-for-byte and reports the computed exposure_status ACTIVE because the logical clock 2026-08-01 precedes warranty_expiry_date 2029-02-28."
        test_recipe:
          setup:
            - "One ProductFamily and one ProductVintage exist; the logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C2", name: "Corner Freezer Platform", launch_date: "2025-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 21000, reserve_cap_cents: 30000000 }
              as: WarrantyAnalyst
              captures: { fam_c2_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c2_id}", vintage_code: "C2-MY2025", units_shipped: 1750, ship_period_code: "2025-Q1", warranty_expiry_date: "2029-02-28" }
              as: WarrantyAnalyst
              captures: { vin_c2_id: $.data.id }
          trigger:
            - call: "GET /warranty/vintages/${vin_c2_id}"
              payload: {}
              as: Actuary
          assert:
            - "The trigger call returns 200"
            - "ProductVintage.${vin_c2_id}.family_id == \"${fam_c2_id}\" and vintage_code == \"C2-MY2025\""
            - "ProductVintage.${vin_c2_id}.units_shipped == 1750, ship_period_code == \"2025-Q1\", warranty_expiry_date == \"2029-02-28\""
            - "ProductVintage.${vin_c2_id}.exposure_status == ACTIVE"

      - name: corner_list_vintages_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /warranty/vintages]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three vintages on one family, GET /warranty/vintages?family_id=..&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One ProductFamily with exactly three ProductVintage rows exists; no other vintages exist."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C3", name: "Corner Dryer Platform", launch_date: "2024-02-01", base_warranty_months: 24, standard_cost_per_claim_cents: 17000, reserve_cap_cents: 30000000 }
              as: WarrantyAnalyst
              captures: { fam_c3_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c3_id}", vintage_code: "C3-MY2024", units_shipped: 1000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-01-31" }
              as: WarrantyAnalyst
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c3_id}", vintage_code: "C3-MY2025", units_shipped: 1200, ship_period_code: "2025-Q1", warranty_expiry_date: "2029-01-31" }
              as: WarrantyAnalyst
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c3_id}", vintage_code: "C3-MY2026", units_shipped: 1400, ship_period_code: "2026-Q1", warranty_expiry_date: "2030-01-31" }
              as: WarrantyAnalyst
          trigger:
            - call: "GET /warranty/vintages"
              payload: { family_id: "${fam_c3_id}", limit: 2, offset: 0 }
              as: WarrantyAnalyst
            - call: "GET /warranty/vintages"
              payload: { family_id: "${fam_c3_id}", limit: 2, offset: 2 }
              as: WarrantyAnalyst
          assert:
            - "The first trigger call returns 200 with response_type == \"array\", exactly 2 data rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "The second trigger call returns exactly 1 data row, total_count == 3, offset == 2 and has_more == false"
            - "ProductFamily.${fam_c3_id}.observed_exposure_units == 3600"

      - name: corner_get_supplier_with_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_SUPPLIER_NOT_FOUND]
          - endpoints[GET /warranty/suppliers/{supplierId}]
        distinguishing_aspect: "A syntactically valid but non-existent supplierId returns 404 ERR_SUPPLIER_NOT_FOUND, not 200 with an empty body and not 500."
        test_recipe:
          setup:
            - "Empty database — no Supplier rows exist."
          setup_api_calls:
            - call: "POST /warranty/suppliers"
              payload: { supplier_code: "SUP-C1", name: "Corner Components Oy", credit_rating: "BBB", annual_purchase_volume_cents: 500000000, contractual_recovery_cap_bps: 1500 }
              as: WarrantyAnalyst
              captures: { sup_c1_id: $.data.id }
          trigger:
            - call: "GET /warranty/suppliers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: WarrantyAnalyst
              captures: { err_sup_nf: $.data.error_id }
          assert:
            - "The trigger call returns 404 with error_id ERR_SUPPLIER_NOT_FOUND"
            - "The pre-existing Supplier ${sup_c1_id} is unaffected and still readable"

      - name: corner_create_family_missing_reserve_cap_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /warranty/product-families]
        distinguishing_aspect: "reserve_cap_cents has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and persists no ProductFamily row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
          trigger:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C4", name: "Corner Hob Platform", launch_date: "2025-05-01", base_warranty_months: 24, standard_cost_per_claim_cents: 15000 }
              as: WarrantyAnalyst
              captures: { err_missing_cap: $.data.error_id }
            - call: "GET /warranty/product-families"
              payload: { limit: 10, offset: 0 }
              as: WarrantyAnalyst
          assert:
            - "The first trigger call returns 400 with error_id ERR_INVALID_REQUEST"
            - "The second trigger call reports total_count == 0 — no partial ProductFamily row was created"

      - name: corner_field_action_optional_regulatory_notice_defaults_false
        claim_type: Defaults
        grounds:
          - entities.FieldAction.fields.regulatory_notice_filed
          - entities.FieldAction.fields.is_safety_recall
          - endpoints[POST /warranty/field-actions]
        distinguishing_aspect: "Omitting regulatory_notice_filed yields false, and because action_type is SERVICE_CAMPAIGN the computed is_safety_recall is false while approval_state defaults to DRAFT and execution_state to NOT_STARTED."
        test_recipe:
          setup:
            - "One ProductFamily exists; no field actions exist."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C5", name: "Corner Hood Platform", launch_date: "2024-09-01", base_warranty_months: 24, standard_cost_per_claim_cents: 16000, reserve_cap_cents: 20000000 }
              as: WarrantyAnalyst
              captures: { fam_c5_id: $.data.id }
          trigger:
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_c5_id}", action_code: "FA-C5-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-02-28", affected_unit_count: 300 }
              as: QualityEngineer
              captures: { fa_c5_id: $.data.id }
          assert:
            - "The trigger call returns 201"
            - "FieldAction.${fa_c5_id}.regulatory_notice_filed == false (default applied)"
            - "FieldAction.${fa_c5_id}.is_safety_recall == false"
            - "FieldAction.${fa_c5_id}.approval_state == DRAFT and execution_state == NOT_STARTED"
            - "FieldAction.${fa_c5_id}.selected_remedy_option_id == null, specific_accrual_cents == 0, executed_cost_cents == 0, approved_period_id == null"

      - name: corner_family_exposure_metrics_recompute_on_vintage_and_observation
        claim_type: Computed Fields
        grounds:
          - calculations.history_maturity_classification
          - entities.ProductFamily.fields.observed_exposure_units
          - entities.ProductFamily.fields.observed_history_months
          - entities.ProductFamily.fields.units_sold_lifetime
        distinguishing_aspect: "observed_exposure_units is recomputed to 5500 by the second POST /warranty/vintages and observed_history_months jumps to 18 on POST /warranty/claim-observations, flipping history_maturity_status from LIMITED to MATURE; units_sold_lifetime mirrors observed_exposure_units exactly."
        test_recipe:
          setup:
            - "One AccrualPeriod 2026-Q3 exists so observation_period_code resolves."
            - "One ProductFamily with one 3000-unit vintage and one failure mode exists."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C6", name: "Corner Washer Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 30000000 }
              as: WarrantyAnalyst
              captures: { fam_c6_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c6_id}", vintage_code: "C6-MY2024", units_shipped: 3000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_c6a_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_c6_id}", mode_code: "FM-C6-01", description: "Corner bearing wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_c6_id: $.data.id }
          trigger:
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c6_id}", vintage_code: "C6-MY2025", units_shipped: 2500, ship_period_code: "2025-Q1", warranty_expiry_date: "2029-12-31" }
              as: WarrantyAnalyst
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_c6a_id}", failure_mode_id: "${fm_c6_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 18, claim_count: 60, paid_cost_cents: 1200000 }
              as: WarrantyAnalyst
          assert:
            - "After the setup chain: ProductFamily.${fam_c6_id}.observed_exposure_units == 3000, observed_history_months == 0, history_maturity_status == LIMITED"
            - "After the first trigger call: ProductFamily.${fam_c6_id}.observed_exposure_units == 5500 and units_sold_lifetime == 5500, history_maturity_status still LIMITED (0 months)"
            - "After the second trigger call: ProductFamily.${fam_c6_id}.observed_history_months == 18 and history_maturity_status == MATURE"

      - name: corner_accrual_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.WarrantyAccrual.fields.status
          - entities.WarrantyAccrual.fields.revision_index
          - entities.WarrantyAccrual.fields.proposed_by_user_id
          - entities.WarrantyAccrual.fields.posted_by_user_id
          - state_machines.WarrantyAccrual.initial_state
        distinguishing_aspect: "POST /warranty/accruals accepts no status, revision_index, proposed_by_user_id or posted_by_user_id input, and the created row reports status DRAFT, revision_index 0, both user ids null and version 1."
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists."
            - "ProductFamily FAM-A is the canonical analog basis (10000 units, 300 claims coded to 2026-Q3)."
            - "ProductFamily FAM-C7 carries analog_family_id FAM-A and engineering_estimate_rate_ppm 4000, with one ACTIVE 3000-unit vintage and one failure mode."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_c7_id: $.data.id, p_c7_ver: $.data.version }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-A", name: "Legacy Compressor Platform", launch_date: "2022-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 100000000 }
              as: WarrantyAnalyst
              captures: { fam_a_c7: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_a_c7}", vintage_code: "A-MY2022", units_shipped: 10000, ship_period_code: "2022-Q1", warranty_expiry_date: "2029-12-31" }
              as: WarrantyAnalyst
              captures: { vin_a_c7: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_a_c7}", mode_code: "FM-A-CORE", description: "Legacy compressor core wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_a_c7: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_a_c7}", failure_mode_id: "${fm_a_c7}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 24, claim_count: 300, paid_cost_cents: 6000000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C7", name: "Corner Launch Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 30000, reserve_cap_cents: 20000000, engineering_estimate_rate_ppm: 4000, analog_family_id: "${fam_a_c7}" }
              as: WarrantyAnalyst
              captures: { fam_c7_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c7_id}", vintage_code: "C7-MY2024", units_shipped: 3000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_c7_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_c7_id}", mode_code: "FM-C7-01", description: "Corner launch valve leak", severity: "FUNCTIONAL", cost_per_claim_cents: 21000 }
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p_c7_id}", vintage_id: "${vin_c7_id}", method: "ANALOG_BLEND", elapsed_exposure_bps: 2000, expected_period_version: "${p_c7_ver}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_c7_id: $.data.id }
          assert:
            - "The trigger call returns 201"
            - "WarrantyAccrual.${acc_c7_id}.status == DRAFT (the declared initial_state) and revision_index == 0"
            - "WarrantyAccrual.${acc_c7_id}.proposed_by_user_id == null and posted_by_user_id == null even though X-User-ID was ua-1"
            - "WarrantyAccrual.${acc_c7_id}.version == 1 and id / created_at / updated_at are server-generated"
            - "WarrantyAccrual.${acc_c7_id}.expected_claim_rate_ppm == 32400, cost_per_claim_basis_cents == 30000, paid_to_date_cents == 0, accrued_amount_cents == 2910000"

      - name: corner_invalid_enum_and_out_of_range_values_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - entities.FailureMode.fields.severity
          - entities.WarrantyAccrual.fields.elapsed_exposure_bps
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "severity outside {COSMETIC, FUNCTIONAL, SAFETY} and elapsed_exposure_bps above 10000 both return 400 ERR_INVALID_REQUEST, and period_end_date not strictly after period_start_date does too."
        test_recipe:
          setup:
            - "One ProductFamily exists."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C8", name: "Corner Enum Platform", launch_date: "2025-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_c8_id: $.data.id }
          trigger:
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_c8_id}", mode_code: "FM-C8-01", description: "Bad severity", severity: "CRITICAL", cost_per_claim_cents: 12000 }
              as: WarrantyAnalyst
              captures: { err_enum: $.data.error_id }
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-09-30", period_end_date: "2026-07-01" }
              as: ReserveController
              captures: { err_dates: $.data.error_id }
          assert:
            - "The first trigger call returns 400 with error_id ERR_INVALID_REQUEST and no FailureMode row is created"
            - "The second trigger call returns 400 with error_id ERR_INVALID_REQUEST and no AccrualPeriod row is created"
            - "GET /warranty/failure-modes?family_id=${fam_c8_id} reports total_count == 0"

      - name: corner_claim_observation_is_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.ClaimObservation
          - endpoints[GET /warranty/claim-observations/{observationId}]
        distinguishing_aspect: "ClaimObservation declares common_fields false, so its response body carries no version field and §1.5 exposes only POST and GET for it — there is no PATCH route to mutate a coded observation."
        test_recipe:
          setup:
            - "One AccrualPeriod 2026-Q3, one family, one vintage, one failure mode and one ClaimObservation exist."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-C9", name: "Corner Immutable Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 14000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_c9_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_c9_id}", vintage_code: "C9-MY2024", units_shipped: 900, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_c9_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_c9_id}", mode_code: "FM-C9-01", description: "Corner immutable defect", severity: "COSMETIC", cost_per_claim_cents: 4000 }
              as: WarrantyAnalyst
              captures: { fm_c9_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_c9_id}", failure_mode_id: "${fm_c9_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 6, claim_count: 3, paid_cost_cents: 12000 }
              as: WarrantyAnalyst
              captures: { obs_c9_id: $.data.id }
          trigger:
            - call: "GET /warranty/claim-observations/${obs_c9_id}"
              payload: {}
              as: ReserveController
          assert:
            - "The trigger call returns 200 and the data object contains NO `version` key"
            - "ClaimObservation.${obs_c9_id}.claim_count == 3 and paid_cost_cents == 12000, identical to the values posted"
            - "§1.5 declares no PATCH or DELETE route under /warranty/claim-observations, so the row cannot be amended once coded"

      - name: corner_flat_topology_vintage_with_unknown_family_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=6]
          - complexity_profile.entity_topology
          - errors[ERR_FAMILY_NOT_FOUND]
        distinguishing_aspect: "Under the flat topology the parent is a body FK rather than a URL segment, so POST /warranty/vintages with an unknown family_id returns 404 ERR_FAMILY_NOT_FOUND and creates nothing."
        test_recipe:
          setup:
            - "Exactly one ProductFamily exists, whose id is NOT the one supplied in the trigger."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-CA", name: "Corner FK Platform", launch_date: "2025-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 13000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_ca_id: $.data.id }
          trigger:
            - call: "POST /warranty/vintages"
              payload: { family_id: "00000000-0000-4000-8000-000000000001", vintage_code: "CA-MY2025", units_shipped: 500, ship_period_code: "2025-Q1", warranty_expiry_date: "2029-01-31" }
              as: WarrantyAnalyst
              captures: { err_fam_nf: $.data.error_id }
          assert:
            - "The trigger call returns 404 with error_id ERR_FAMILY_NOT_FOUND"
            - "GET /warranty/vintages?family_id=${fam_ca_id} reports total_count == 0"

      - name: corner_reserve_posture_computed_field_thresholds
        claim_type: Computed Fields
        grounds:
          - entities.ProductFamily.fields.reserve_posture
          - calculations.family_reserve_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / reserve_posture_boundary_exactly_eighty_and_one_hundred_percent_of_cap
          rationale: "The ELEVATED and CONSTRAINED computed-field outcomes are asserted at both `>=` thresholds by the named §1.8 instance."

      - name: corner_history_maturity_computed_field_thresholds
        claim_type: Computed Fields
        grounds:
          - entities.ProductFamily.fields.history_maturity_status
          - calculations.history_maturity_classification
        excluded_because:
          difficulty_instance: boundary_precision_check / history_maturity_boundary_exact_twelve_months_and_five_thousand_units
          rationale: "MATURE versus LIMITED is asserted at exactly 12 months / 5000 units and at both threshold-minus-one cases by the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_period_walks_open_locked_review_closed
        claim_type: Valid Transition
        grounds:
          - state_machines.AccrualPeriod
          - endpoints[POST /warranty/periods/{periodId}/lock-analysis]
          - endpoints[POST /warranty/periods/{periodId}/open-actuarial-review]
          - endpoints[POST /warranty/periods/{periodId}/close]
        distinguishing_aspect: "The happy path OPEN -> ANALYSIS_LOCKED -> ACTUARIAL_REVIEW -> CLOSED succeeds on an otherwise empty period, stamping locked_at and closed_at while leaving reopen_count at 0."
        test_recipe:
          setup:
            - "One AccrualPeriod exists; no accruals, no liability reserves."
            - "A ReserveRollforward is generated before close so ERR_ROLLFORWARD_MISSING does not fire."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_sm1_id: $.data.id }
            - call: "POST /warranty/periods/${p_sm1_id}/lock-analysis"
              payload: {}
              as: ReserveController
              captures: { p_sm1_ver2: $.data.version }
            - call: "POST /warranty/periods/${p_sm1_id}/rollforward"
              payload: { expected_period_version: "${p_sm1_ver2}" }
              as: ReserveController
              captures: { rf_sm1_id: $.data.id }
          trigger:
            - call: "POST /warranty/periods/${p_sm1_id}/open-actuarial-review"
              payload: {}
              as: ReserveController
            - call: "POST /warranty/periods/${p_sm1_id}/close"
              payload: {}
              as: ReserveController
          assert:
            - "After lock-analysis: AccrualPeriod.${p_sm1_id}.status == ANALYSIS_LOCKED and locked_at is non-null"
            - "After the first trigger call: AccrualPeriod.${p_sm1_id}.status == ACTUARIAL_REVIEW"
            - "After the second trigger call: AccrualPeriod.${p_sm1_id}.status == CLOSED, closed_at is non-null, reopen_count == 0, rollforward_generated == true"
            - "ReserveRollforward.${rf_sm1_id}.ending_balance_cents == 0 and beginning_balance_cents == 0"

      - name: corner_period_close_without_rollforward_returns_rollforward_missing
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=14]
          - errors[ERR_ROLLFORWARD_MISSING]
          - state_machines.AccrualPeriod.transitions[ACTUARIAL_REVIEW->CLOSED]
        distinguishing_aspect: "Closing a period in ACTUARIAL_REVIEW that has no ReserveRollforward returns 409 ERR_ROLLFORWARD_MISSING and leaves status ACTUARIAL_REVIEW with closed_at still null."
        test_recipe:
          setup:
            - "One AccrualPeriod advanced to ACTUARIAL_REVIEW with NO rollforward generated."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_sm2_id: $.data.id }
            - call: "POST /warranty/periods/${p_sm2_id}/lock-analysis"
              payload: {}
              as: ReserveController
            - call: "POST /warranty/periods/${p_sm2_id}/open-actuarial-review"
              payload: {}
              as: ReserveController
          trigger:
            - call: "POST /warranty/periods/${p_sm2_id}/close"
              payload: {}
              as: ReserveController
              captures: { err_rf_missing: $.data.error_id }
          assert:
            - "The trigger call returns 409 with error_id ERR_ROLLFORWARD_MISSING"
            - "AccrualPeriod.${p_sm2_id}.status == ACTUARIAL_REVIEW, closed_at == null, rollforward_generated == false"

      - name: corner_reopen_returns_only_reviewed_liability_reserves_to_draft
        claim_type: Conditional cascade
        grounds:
          - state_machines.AccrualPeriod.transitions[ACTUARIAL_REVIEW->ANALYSIS_LOCKED]
          - state_machines.LiabilityReserve
          - calculations.ibnr_liability_reserve
        distinguishing_aspect: "reopen-analysis returns the ACTUARY_REVIEWED LiabilityReserve to DRAFT (clearing reviewed_by_user_id and incrementing its return_count) while the sibling reserve already in DRAFT keeps return_count 0 — the cascade is conditional on child state."
        test_recipe:
          setup:
            - "One AccrualPeriod 2026-Q3 and two ProductFamily rows."
            - "Family FAM-L1 has one 2000-unit vintage so its IBNR floor is 2000 * 25 == 50000 cents."
            - "LiabilityReserve R1 on FAM-L1: reported_claim_count 40, asserted_case_reserve_cents 8000000, reporting_lag_months 6, severity_trend_bps 1000 -> lag_factor 7200 bps, ibnr_claim_count 29, trended severity 220000, raw IBNR 6380000, IBNR cap 12000000, floor 50000 -> ibnr_reserve_cents 6380000 and total_liability_reserve_cents 14380000."
            - "LiabilityReserve R2 on FAM-L2 stays in DRAFT."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_sm3_id: $.data.id }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-L1", name: "Liability Family One", launch_date: "2023-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 60000000 }
              as: WarrantyAnalyst
              captures: { fam_l1_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_l1_id}", vintage_code: "L1-MY2023", units_shipped: 2000, ship_period_code: "2023-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-L2", name: "Liability Family Two", launch_date: "2023-06-01", base_warranty_months: 36, standard_cost_per_claim_cents: 15000, reserve_cap_cents: 40000000 }
              as: WarrantyAnalyst
              captures: { fam_l2_id: $.data.id }
            - call: "POST /warranty/liability-reserves"
              payload: { period_id: "${p_sm3_id}", family_id: "${fam_l1_id}", reported_claim_count: 40, asserted_case_reserve_cents: 8000000, reporting_lag_months: 6, severity_trend_bps: 1000 }
              as: Actuary
              as_user_id: "uac-1"
              captures: { lr_r1_id: $.data.id }
            - call: "POST /warranty/liability-reserves"
              payload: { period_id: "${p_sm3_id}", family_id: "${fam_l2_id}", reported_claim_count: 10, asserted_case_reserve_cents: 1000000, reporting_lag_months: 0, severity_trend_bps: 0 }
              as: Actuary
              as_user_id: "uac-1"
              captures: { lr_r2_id: $.data.id }
            - call: "POST /warranty/periods/${p_sm3_id}/lock-analysis"
              payload: {}
              as: ReserveController
            - call: "POST /warranty/liability-reserves/${lr_r1_id}/actuarial-decision"
              payload: { decision: "REVIEWED" }
              as: Actuary
              as_user_id: "uac-1"
            - call: "POST /warranty/periods/${p_sm3_id}/open-actuarial-review"
              payload: {}
              as: ReserveController
          trigger:
            - call: "POST /warranty/periods/${p_sm3_id}/reopen-analysis"
              payload: {}
              as: ReserveController
          assert:
            - "The trigger call returns 200"
            - "AccrualPeriod.${p_sm3_id}.status == ANALYSIS_LOCKED and reopen_count == 1"
            - "LiabilityReserve.${lr_r1_id}.status == DRAFT, reviewed_by_user_id == null, return_count == 1"
            - "LiabilityReserve.${lr_r1_id}.lag_factor_bps == 7200, ibnr_claim_count == 29, ibnr_reserve_cents == 6380000, total_liability_reserve_cents == 14380000"
            - "LiabilityReserve.${lr_r2_id}.status == DRAFT and return_count == 0 — the already-DRAFT sibling was not touched"
            - "LiabilityReserve.${lr_r2_id}.lag_factor_bps == 0, ibnr_claim_count == 0, ibnr_reserve_cents == 0, total_liability_reserve_cents == 1000000"

      - name: corner_propose_on_posted_accrual_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WarrantyAccrual
          - validations[priority=12]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "POSTED is not a source state for the propose trigger, so re-proposing a posted accrual returns 409 ERR_INVALID_STATE_TRANSITION and leaves status POSTED with revision_index unchanged."
        test_recipe:
          setup:
            - "The canonical analog basis FAM-A plus family FAM-P1 (analog_family_id FAM-A, engineering_estimate_rate_ppm 4000, standard_cost_per_claim_cents 30000, reserve_cap_cents 20000000) with one 3000-unit vintage and one failure mode."
            - "An ANALOG_BLEND accrual for that vintage is proposed by ua-1 and posted by urc-1, so accrued_amount_cents == 2910000."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_sm4_id: $.data.id, p_sm4_ver: $.data.version }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-A", name: "Legacy Compressor Platform", launch_date: "2022-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 100000000 }
              as: WarrantyAnalyst
              captures: { fam_a_sm4: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_a_sm4}", vintage_code: "A-MY2022", units_shipped: 10000, ship_period_code: "2022-Q1", warranty_expiry_date: "2029-12-31" }
              as: WarrantyAnalyst
              captures: { vin_a_sm4: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_a_sm4}", mode_code: "FM-A-CORE", description: "Legacy compressor core wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_a_sm4: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_a_sm4}", failure_mode_id: "${fm_a_sm4}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 24, claim_count: 300, paid_cost_cents: 6000000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-P1", name: "Posted Accrual Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 30000, reserve_cap_cents: 20000000, engineering_estimate_rate_ppm: 4000, analog_family_id: "${fam_a_sm4}" }
              as: WarrantyAnalyst
              captures: { fam_p1_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_p1_id}", vintage_code: "P1-MY2024", units_shipped: 3000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_p1_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_p1_id}", mode_code: "FM-P1-01", description: "Posted platform valve leak", severity: "FUNCTIONAL", cost_per_claim_cents: 21000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p_sm4_id}", vintage_id: "${vin_p1_id}", method: "ANALOG_BLEND", elapsed_exposure_bps: 2000, expected_period_version: "${p_sm4_ver}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_p1_id: $.data.id }
            - call: "POST /warranty/accruals/${acc_p1_id}/propose"
              payload: {}
              as: WarrantyAnalyst
              as_user_id: "ua-1"
            - call: "POST /warranty/periods/${p_sm4_id}/lock-analysis"
              payload: {}
              as: ReserveController
            - call: "POST /warranty/accruals/${acc_p1_id}/post"
              payload: {}
              as: ReserveController
              as_user_id: "urc-1"
          trigger:
            - call: "POST /warranty/accruals/${acc_p1_id}/propose"
              payload: {}
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { err_bad_state: $.data.error_id }
          assert:
            - "The trigger call returns 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "WarrantyAccrual.${acc_p1_id}.status == POSTED, revision_index == 0, posted_by_user_id == \"urc-1\", proposed_by_user_id == \"ua-1\""
            - "WarrantyAccrual.${acc_p1_id}.accrued_amount_cents == 2910000 and ProductFamily.${fam_p1_id}.warranty_reserve_balance_cents == 2910000"

      - name: corner_field_action_created_in_draft_and_not_started
        claim_type: Initial State
        grounds:
          - state_machines.FieldAction.approval_dimension.initial_state
          - state_machines.FieldAction.execution_dimension.initial_state
        distinguishing_aspect: "A brand-new FieldAction sits at approval_state DRAFT and execution_state NOT_STARTED simultaneously — the two dimensions each start at their own declared initial_state."
        test_recipe:
          setup:
            - "One ProductFamily exists."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-IS", name: "Initial State Platform", launch_date: "2024-05-01", base_warranty_months: 24, standard_cost_per_claim_cents: 11000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_is_id: $.data.id }
          trigger:
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_is_id}", action_code: "FA-IS-01", action_type: "RECALL", affected_build_start_date: "2025-03-01", affected_build_end_date: "2025-04-30", affected_unit_count: 800, regulatory_notice_filed: true }
              as: QualityEngineer
              captures: { fa_is_id: $.data.id }
          assert:
            - "The trigger call returns 201"
            - "FieldAction.${fa_is_id}.approval_state == DRAFT and execution_state == NOT_STARTED"
            - "FieldAction.${fa_is_id}.is_safety_recall == true (action_type RECALL) and regulatory_notice_filed == true"
            - "FieldAction.${fa_is_id}.submitted_by_user_id == null, decided_by_user_id == null, version == 1"

      - name: corner_second_decision_on_approved_field_action_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FieldAction.approval_dimension.terminal_states
          - validations[priority=12]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "APPROVED is terminal on the approval dimension, so a second POST /decision (even with decision REJECTED) returns 409 and neither approval_state nor specific_accrual_cents changes."
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 so the booking-period selector has a candidate."
            - "One ProductFamily FAM-TL (reserve_cap_cents 30000000) with an approved SERVICE_CAMPAIGN field action over 1000 units."
            - "Its single engineering-approved remedy option: parts 2000, labor 100 centi-hours (== 9500 cents), admin 500, take rate 10000 bps -> per_unit_expected_cents 12000 and specific_accrual_cents 12000000."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_tl_id: $.data.id }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-TL", name: "Terminal Lock Platform", launch_date: "2024-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 30000000 }
              as: WarrantyAnalyst
              captures: { fam_tl_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_tl_id}", action_code: "FA-TL-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-03-31", affected_unit_count: 1000 }
              as: QualityEngineer
              captures: { fa_tl_id: $.data.id, fa_tl_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_tl_id}/remedy-options"
              payload: { option_code: "OPT-TL-1", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 2000, labor_hours_centi: 100, admin_cost_cents: 500, expected_take_rate_bps: 10000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_tl_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_tl_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_tl_ver}", remedy_option_id: "${opt_tl_id}" }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_tl_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
            - call: "POST /warranty/field-actions/${fa_tl_id}/decision"
              payload: { decision: "APPROVED" }
              as: ReserveController
              as_user_id: "urc-1"
          trigger:
            - call: "POST /warranty/field-actions/${fa_tl_id}/decision"
              payload: { decision: "REJECTED" }
              as: ReserveController
              as_user_id: "urc-1"
              captures: { err_terminal: $.data.error_id }
          assert:
            - "The trigger call returns 409 with error_id ERR_INVALID_STATE_TRANSITION"
            - "FieldAction.${fa_tl_id}.approval_state == APPROVED, approved_period_id == \"${p_tl_id}\", decided_by_user_id == \"urc-1\""
            - "FieldAction.${fa_tl_id}.per_unit_expected_cents == 12000 and specific_accrual_cents == 12000000"
            - "ProductFamily.${fam_tl_id}.warranty_reserve_balance_cents == 12000000 and reserve_posture == NORMAL (4000 bps of the 30000000 cap)"

      - name: corner_rejected_field_action_loops_back_to_draft_on_reselect
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.FieldAction.approval_dimension.transitions[REJECTED->DRAFT]
          - calculations.field_action_specific_accrual
        distinguishing_aspect: "select-remedy on a REJECTED field action loops it back to DRAFT, clearing submitted_by_user_id and decided_by_user_id and recomputing specific_accrual_cents from 0 back to 14137500 (per_unit 9425 * 1500 units)."
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod so the decision trigger has a booking-period candidate."
            - "FieldAction FA-CY over 1500 units with one engineering-approved option: parts 4000, labor 150 centi-hours (== 14250 cents), admin 600 -> gross 18850, take rate 5000 bps -> per_unit 9425."
            - "The action is selected (version 1 -> 2), submitted by uq-1 and REJECTED by urc-1."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-CY", name: "Cyclic Platform", launch_date: "2024-02-01", base_warranty_months: 24, standard_cost_per_claim_cents: 13000, reserve_cap_cents: 40000000 }
              as: WarrantyAnalyst
              captures: { fam_cy_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_cy_id}", action_code: "FA-CY-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-02-28", affected_unit_count: 1500 }
              as: QualityEngineer
              captures: { fa_cy_id: $.data.id, fa_cy_ver1: $.data.version }
            - call: "POST /warranty/field-actions/${fa_cy_id}/remedy-options"
              payload: { option_code: "OPT-CY-1", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 4000, labor_hours_centi: 150, admin_cost_cents: 600, expected_take_rate_bps: 5000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_cy_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_cy_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_cy_ver1}", remedy_option_id: "${opt_cy_id}" }
              as: QualityEngineer
              captures: { fa_cy_ver2: $.data.version }
            - call: "POST /warranty/field-actions/${fa_cy_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
            - call: "POST /warranty/field-actions/${fa_cy_id}/decision"
              payload: { decision: "REJECTED" }
              as: ReserveController
              as_user_id: "urc-1"
          trigger:
            - call: "POST /warranty/field-actions/${fa_cy_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_cy_ver2}", remedy_option_id: "${opt_cy_id}" }
              as: QualityEngineer
          assert:
            - "After the REJECTED decision: FieldAction.${fa_cy_id}.approval_state == REJECTED and specific_accrual_cents == 0"
            - "The trigger call returns 200 and FieldAction.${fa_cy_id}.approval_state == DRAFT"
            - "FieldAction.${fa_cy_id}.submitted_by_user_id == null and decided_by_user_id == null after the loop-back"
            - "FieldAction.${fa_cy_id}.per_unit_expected_cents == 9425 and specific_accrual_cents == 14137500"
            - "FieldAction.${fa_cy_id}.version == 3 — every select-remedy write increments version"

      - name: corner_liability_reserve_book_requires_period_in_actuarial_review
        claim_type: guarded transitions
        grounds:
          - state_machines.LiabilityReserve.transitions[ACTUARY_REVIEWED->BOOKED]
          - validations[priority=12]
          - roles.ReserveController
        distinguishing_aspect: "The ACTUARY_REVIEWED -> BOOKED transition is guarded by the parent AccrualPeriod being in ACTUARIAL_REVIEW: booking while the period is merely ANALYSIS_LOCKED returns 409, and the identical call succeeds once open-actuarial-review has run."
        test_recipe:
          setup:
