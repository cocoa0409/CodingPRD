              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
              payload: { season_id: "${s_id}", farm_code: "FARM-001", legal_name: "Delta Farms" }
              as: Merchandiser
              captures: { g_id: $.data.id }
            - call: "POST /mill/contracts"
              payload: { season_id: "${s_id}", grower_id: "${g_id}", variety: "LONG_GRAIN", contracted_cwt: 400.00, base_price_cents_per_cwt: 1500, grade_adjustments: { US_NO_1: 0, US_NO_2: 0, US_NO_3: 0, US_NO_4: 0, US_NO_5: 0, SAMPLE: 0 } }
              as: Merchandiser
