      - name: share_safety_rule_30_beats_constraint_rule_40
        grounds:
          - validations[priority=30]
          - validations[priority=40]
          - errors.ERR_RESIDENT_OPTED_OUT
          - errors.ERR_DEVICE_WINDOW_CONFLICT
          - state_machines.ConsentSolicitation.status.SHARED_to_SHARED
          - endpoints[POST /neighborhood-safety/residents/{id}/data-controls]
        distinguishing_aspect: |
          A DIFFERENT category pair — (business_safety, business_constraint), only 10 priority
          steps apart — on a different endpoint, POST /consent-solicitations/{id}/share. The
          resident has opted out of video requests AND is offering footage that overlaps a clip
          they already shared from the same camera, so the account-level refusal at priority 30
          must be reported rather than the interval conflict at priority 40. Reversing only the
          opt-out (OPT_IN_TO_REQUESTS) and replaying the identical share then yields
          ERR_DEVICE_WINDOW_CONFLICT, confirming the lower-priority rule was violated all
          along. The pair is also structurally interesting because the share is aimed at a
          solicitation that is already SHARED, which the SHARED -> SHARED self-loop permits, so
          priority 18 stays satisfied and cannot mask either rule under test.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3; officer with duty_role REQUESTER."
            - "Three residents R1, R2, R3 with one ACTIVE camera each at (0,10), (0,20), (0,30), all alert_radius_m 0."
            - "RequestArea (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z is LOCKED with eligible_device_count 3; the VideoRequest is justified and SUBMITTED, so three solicitations are SOLICITED with respond_deadline_utc 2026-08-15T00:00:00Z."
            - "R1 shares a first clip covering [2026-08-08T01:00:00Z, 2026-08-08T01:30:00Z), so R1's solicitation is SHARED and one RETAINED clip exists on R1's camera."
            - "R1 then exercises OPT_OUT_OF_REQUESTS; because R1 has no SOLICITED solicitation left, the receipt touches one device and zero solicitations, and the area is INVALIDATED for eligibility as a side branch."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
