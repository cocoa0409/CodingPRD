            - "The reservation committed stock: Component.${ws_id}.on_hand_qty == ${on_hand_reserved} == 5 == 25 - 4 * 5, and ProductionOrder.${po_id}.status == ${po_status_reserved} == \"COMPONENT_RESERVED\""
            - "The reservations term is empty while the order sits in COMPONENT_RESERVED: Component.${ws_id}.reserved_qty == ${reserved_reserved} == 0, because only RELEASED orders contribute to reservations"
            - "After POST /production-orders/${po_id}/release the order is ${po_status_released} == \"RELEASED\" and Component.${ws_id}.reserved_qty == ${reserved_released} == 20 == qty_per_car 4 * quantity 5"
