          - validations[priority=38]
          - errors[ERR_INVALID_BATCH_STATE]
          - errors[ERR_TANK_NOT_IN_SERVICE]
          - state_machines.FermentationBatch.status.FERMENTING_to_DISTILLING
          - state_machines.ProductTank.service_status.IN_SERVICE_to_ON_HOLD
        distinguishing_aspect: |
          A single distill call violates the state tier (priority 26, batch is
          HEALTH_WATCH not FERMENTING) and the safety tier (priority 38,
          destination tank is ON_HOLD): the 409 ERR_INVALID_BATCH_STATE wins
          because the state tier is checked before the safety tier, so the
          422 ERR_TANK_NOT_IN_SERVICE is never reached.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 5000."
            - "Tank T-101 is an ETHANOL_200_PROOF tank; contract C-1 is PRICED with one settled 940.00-bushel delivery."
            - "Batch FB-4001 is charged with 900.00 bushels and has one bad reading (lactic 1237, acetic 552, 36.9 C), so it is in HEALTH_WATCH with fermentation_health_index 41.89."
            - "Tank T-101 is then placed ON_HOLD with hold_reason OFF_SPEC, which also drives Plant.compliance_posture to RESTRICTED."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-4001", corn_bushels_charged: 900.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 12, lactic_acid_ppm: 1237, acetic_acid_ppm: 552, temperature_c: 36.9 }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/product-tanks/${t101_id}/hold"
              payload: { hold_reason: "OFF_SPEC" }
              as: ProcessOperator
              as_user_id: "op-01"
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/distill"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_BATCH_STATE with HTTP 409"
            - "${err_id} != ERR_TANK_NOT_IN_SERVICE"
            - "FermentationBatch.${b1_id}.status == HEALTH_WATCH"
            - "FermentationBatch.${b1_id}.distillation_started_at == null"
            - "FermentationBatch.${b1_id}.effective_yield_gal_per_bushel == null"
            - "ProductTank.${t101_id}.service_status == ON_HOLD and hold_reason == OFF_SPEC"
            - "Plant.${plant_id}.compliance_posture == RESTRICTED and daily_grind_cap_bushels == 108000"

      - name: shipment_posture_safety_error_precedes_tank_volume_fiscal_error
        grounds:
          - validations[priority=37]
          - validations[priority=56]
          - errors[ERR_PLANT_SUSPENDED]
          - errors[ERR_INSUFFICIENT_TANK_VOLUME]
          - calculations.permit_rolling_average
          - calculations.plant_compliance_posture
          - state_machines.PermitCondition.status.COMPLIANT_to_EXCEEDANCE
        distinguishing_aspect: |
          A single load call violates the safety tier (priority 37, plant is
          SUSPENDED by a CRITICAL air exceedance) and the fiscal tier (priority
          56, the 265900.00 gallons drawn exceed T-301's 100000.00 gallons), and
          the safety error wins — a different error-category pair
          (business_safety vs business_fiscal) than the state/safety pair above,
          on a different entity and endpoint.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 5000."
            - "Tank T-301 is a DENATURED_E100 tank opened with only 100000.00 gallons."
            - "Shipment UT-8001 is SCHEDULED from T-301 for 100 railcars of 2659.00 gallons, so planned_gallons is 265900.00 - far more than the tank holds."
            - "Permit condition PC-AIR-1 has limit_value 12.500, averaging_period_hours 24 and severity CRITICAL; a single reading of 13.000 inside the window drives it to EXCEEDANCE and the plant to SUSPENDED."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T05:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 100000.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-8001", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions"
              payload: { condition_code: "PC-AIR-1", permit_type: "AIR", parameter_name: "VOC", limit_value: 12.500, unit: "lb/hr", averaging_period_hours: 24, severity: "CRITICAL" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { pc1_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/readings"
              payload: { value: 13.000, measured_at: "2026-09-05T04:00:00Z", sample_reference: "CEMS-0001" }
              as: ProcessOperator
              as_user_id: "op-01"
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/load"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PLANT_SUSPENDED with HTTP 422"
            - "${err_id} != ERR_INSUFFICIENT_TANK_VOLUME"
            - "PermitCondition.${pc1_id}.rolling_average_value == 13.000"
            - "PermitCondition.${pc1_id}.readings_in_window == 1"
            - "PermitCondition.${pc1_id}.status == EXCEEDANCE and exceedance_count == 1"
            - "Plant.${plant_id}.compliance_posture == SUSPENDED and daily_grind_cap_bushels == 0"
            - "UnitTrainShipment.${sh1_id}.loading_status == SCHEDULED and loaded_gallons == null"
            - "ProductTank.${t301_id}.current_gallons == 100000.00"

