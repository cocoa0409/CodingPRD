    code: 200
    input: []
    output: UsageReport
    side_effects: ["report_status -> DRAFT or AMENDED; liability recompute; PLANNED batch reversed"]

  - method: GET
    path: "/usage-reports/{id}/play-lines"
    description: "List play lines of a report (FK reverse reachability)"
