              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_id: $.data.id }
            - &b_activate
              call: "POST /terminal-deployments/${dep_id}/activate"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *inv_open_tip
            - *ev_household
            - *conclude_ineligible
            - *case_hardship
            - *charge_letter
            - *case_reply
          trigger:
            - &sale_simple
              call: "POST /pos-transactions"
              payload:
                store_id: "${store_id}"
                terminal_deployment_id: "${dep_id}"
                household_ebt_card_last4: "8821"
                line_items: &basket_simple
                  - { sku: "MILK-1G", item_class: "STAPLE_FOOD", unit_price_cents: 379, qty: 2 }
                snap_benefit_available_cents: 1000
                other_tender_offered_cents: 0
              as: StoreClerk
