            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:45:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1", captures: { spill: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CONTAINED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "DECONTAMINATED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/radiation-surveys", payload: { room_id: "${room}", ambient_dose_rate_usv_h: 0.5, result: "PASS" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CLEARED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1" }
            - { call: "GET /nuclear-medicine/licenses/${lic}", as: DepartmentAdmin, captures: { poss_after: $.data.current_possession_mbq } }
          assert:
            - "possession before cascade == 200.158 (220.000 decayed 15 min at HL 110)"
            - "possession after full quarantine/clearance round-trip == 200.158 (identical clock, quarantine never removes possession)"
            - "DoseVial.${vial}.status == CALIBRATED after clearance (restored from QUARANTINED)"
