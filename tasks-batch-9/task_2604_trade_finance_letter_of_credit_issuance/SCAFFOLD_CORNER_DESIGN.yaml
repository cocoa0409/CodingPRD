# =============================================================================
# 1.9 Scaffold Corner Design - Trade Finance Letter of Credit Issuance (2604)
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against SCAFFOLD.yaml's 1.1-1.7 surface. The nine `section:` values below are
# exactly the guide's nine sections; every `claim_type:` is a row label from
# that section's table. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance carry an `excluded_because:` stub and
# no test_recipe.
#
# Shared recipe conventions (identical to 1.8):
#   * logical clock starts at 2026-08-01T00:00:00Z and is advanced only through
#     POST /_clock/set_current_utc; every recipe pins it to 2026-08-10T09:00:00Z
#     (a Monday) as its first call.
#   * operator ids: co_1 / co_2 (CreditOfficer), tfo_1 / tfo_2
#     (TradeFinanceOfficer), dx_1 / dx_2 (DocumentExaminer), cmp_1 / cmp_2
#     (ComplianceOfficer), sysop_1 (SystemOperator). Entity-backed roles
#     (ApplicantUser, BeneficiaryUser, CorrespondentBank) pass the backing row's
#     own id as X-User-ID.
#   * the "standard credit" is USD 10000000, SIGHT_PAYMENT, tenor_days 0,
#     tolerance_pct 0, incoterm FOB, latest_shipment_date 2026-10-31,
#     expiry_date 2026-11-30, presentation_period_days 21 on a 50000000
#     facility. Its derived values are pinned once here and reused verbatim:
#       max_drawable_cents        = 10000000
#       gross_exposure_cents      = 10000000
#       committed_allocation_cents= 10000000
#       commission_bps_applied    = 10        (5000001..50000000 tier)
#       validity_days             = 113  -> quarters = 2
#       base_commission_cents     = 25000     (max(25000, 20000) - the floor wins)
#       total_charge_cents        = 25000
#       chargeable_utilisation_cents = 10025000
#       presentation_deadline_date= 2026-11-21  (min(2026-11-30, 2026-10-31+21))
#       confirmation_window       = [2026-08-10, 2026-12-21)
# =============================================================================
scaffold_corner_design:

  # =======================================================================
  # SECTION 1 - From Table 1 (Entities)
  # =======================================================================
  - section: entities
    instances:
      - name: applicant_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Applicant
          - endpoints.POST_/applicants
        distinguishing_aspect: |
          POST /applicants with all five required inputs returns 201 and echoes
          legal_name, country_code, industry_code, internal_risk_grade and
          kyc_status verbatim while minting status ACTIVE, id, created_at,
          updated_at and version 1.
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /applicants"
              payload: { legal_name: "Hanseatic Grain BV", country_code: "NL", industry_code: "4620", internal_risk_grade: "BBB", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 201"
            - "Applicant.${app_id}.legal_name == \"Hanseatic Grain BV\""
            - "Applicant.${app_id}.country_code == \"NL\""
            - "Applicant.${app_id}.industry_code == \"4620\""
            - "Applicant.${app_id}.internal_risk_grade == BBB"
            - "Applicant.${app_id}.kyc_status == CLEARED"
            - "Applicant.${app_id}.sanctions_flag == false"
            - "Applicant.${app_id}.status == ACTIVE"
            - "Applicant.${app_id}.onboarded_by_user_id == \"co_1\""
            - "Applicant.${app_id}.version == 1"
            - "response meta.api_request_id is present and response_type == \"object\""

      - name: facility_retrieval_returns_the_stored_row_with_derived_ledger
        claim_type: retrieval
        grounds:
          - entities.CreditFacility
          - endpoints.GET_/facilities/{id}
          - calculations.facility_exposure_ledger
        distinguishing_aspect: |
          GET /facilities/{id} on a freshly created 50000000 facility returns
          allocated_cents 0, available_cents 50000000 and the derived
          restrict_threshold_cents 47500000 (floor(50000000*95/100)) with
          utilisation_posture OPEN.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with one USD facility of limit_cents 50000000, collateral_required_pct 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Hanseatic Grain BV", country_code: "NL", industry_code: "4620", internal_risk_grade: "BBB", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 20, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "trigger call 1 returns HTTP 200"
            - "CreditFacility.${fac_id}.applicant_id == \"${app_id}\""
            - "CreditFacility.${fac_id}.currency == \"USD\""
            - "CreditFacility.${fac_id}.limit_cents == 50000000"
            - "CreditFacility.${fac_id}.collateral_required_pct == 20"
            - "CreditFacility.${fac_id}.collateral_posted_cents == 0"
            - "CreditFacility.${fac_id}.allocated_cents == 0"
            - "CreditFacility.${fac_id}.available_cents == 50000000"
            - "CreditFacility.${fac_id}.restrict_threshold_cents == 47500000"
            - "CreditFacility.${fac_id}.utilisation_posture == OPEN"
            - "CreditFacility.${fac_id}.status == ACTIVE"
            - "CreditFacility.${fac_id}.suspended_reason IS null"

      - name: bank_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Bank
          - endpoints.GET_/banks
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three banks stored, GET /banks?limit=2&offset=0 returns exactly 2
          rows with total_count 3 and has_more true, and offset=2 returns the
          remaining 1 row with has_more false; the country_code filter narrows
          the same total_count to 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Three banks exist: one in DE, one in SG and one in BR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /banks"
              payload: { bank_name: "Westrhein Handelsbank", swift_bic: "WRHBDEFF", country_code: "DE", country_risk_score: 10, credit_rating: "AA", confirmation_appetite_cents: 100000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { b_de: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Raffles Confirming Bank", swift_bic: "RFCBSGSG", country_code: "SG", country_risk_score: 35, credit_rating: "A", confirmation_appetite_cents: 20000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { b_sg: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Banco do Atlantico", swift_bic: "BATLBRSP", country_code: "BR", country_risk_score: 55, credit_rating: "BBB", confirmation_appetite_cents: 30000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { b_br: $.data.id }
          trigger:
            - call: "GET /banks"
              payload: { limit: 2, offset: 0 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { first_page_first_id: "$.data[0].id" }
            - call: "GET /banks"
              payload: { limit: 2, offset: 2 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { second_page_first_id: "$.data[0].id" }
            - call: "GET /banks"
              payload: { country_code: "SG" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { sg_first_id: "$.data[0].id" }
          assert:
            - "trigger call 1 returns HTTP 200 with response_type == \"array\" and exactly 2 elements"
            - "trigger call 1 meta.total_count == 3"
            - "trigger call 1 meta.has_more == true"
            - "${first_page_first_id} == ${b_de}"
            - "trigger call 2 returns exactly 1 element"
            - "trigger call 2 meta.total_count == 3"
            - "trigger call 2 meta.has_more == false"
            - "${second_page_first_id} == ${b_br}"
            - "trigger call 3 meta.total_count == 1"
            - "${sg_first_id} == ${b_sg}"

      - name: credit_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.DocumentaryCredit
          - endpoints.GET_/credits/{id}
          - errors.ERR_CREDIT_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unstored UUID on GET /credits/{id} returns
          404 ERR_CREDIT_NOT_FOUND, not 422 and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "GET /credits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 404"
            - "${err_id} == ERR_CREDIT_NOT_FOUND"
            - "response_type == \"error\""

      - name: applicant_missing_required_kyc_status_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Applicant.fields.kyc_status
          - endpoints.POST_/applicants
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          kyc_status has source input and no default, so omitting it fails with
          422 ERR_INVALID_REQUEST and no Applicant row is created - as distinct
          from sanctions_flag, which is optional and defaults to false.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /applicants"
              payload: { legal_name: "Hanseatic Grain BV", country_code: "NL", industry_code: "4620", internal_risk_grade: "BBB" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "no Applicant row exists after the trigger"

      - name: credit_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DocumentaryCredit.fields.tolerance_pct
          - entities.DocumentaryCredit.fields.tenor_days
          - entities.DocumentaryCredit.fields.partial_shipment_allowed
          - entities.DocumentaryCredit.fields.transhipment_allowed
          - endpoints.POST_/credits
        distinguishing_aspect: |
          Omitting tolerance_pct, tenor_days, partial_shipment_allowed and
          transhipment_allowed yields 0, 0, false and false respectively, and
          tolerance_pct 0 makes max_drawable_cents equal amount_cents exactly
          (10000000, not 10500000).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000, one DE bank and one LV beneficiary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 201"
            - "DocumentaryCredit.${credit_id}.tolerance_pct == 0"
            - "DocumentaryCredit.${credit_id}.tenor_days == 0"
            - "DocumentaryCredit.${credit_id}.partial_shipment_allowed == false"
            - "DocumentaryCredit.${credit_id}.transhipment_allowed == false"
            - "DocumentaryCredit.${credit_id}.max_drawable_cents == 10000000"
            - "DocumentaryCredit.${credit_id}.status == DRAFT"

      - name: bank_computed_eligibility_score_overwrites_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Bank.fields.eligibility_score
          - entities.Bank.fields.confirming_line_used_cents
          - calculations.confirming_bank_selection
          - endpoints.POST_/banks
        distinguishing_aspect: |
          eligibility_score and confirming_line_used_cents are source computed:
          POST /banks does not accept them, and the stored score is
          (100-35)*6 + 75*4 == 690 for an A-rated bank at country_risk_score 35,
          with confirming_line_used_cents starting at 0.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /banks"
              payload: { bank_name: "Raffles Confirming Bank", swift_bic: "RFCBSGSG", country_code: "SG", country_risk_score: 35, credit_rating: "A", confirmation_appetite_cents: 20000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 201"
            - "Bank.${bank_id}.eligibility_score == 690"
            - "Bank.${bank_id}.confirming_line_used_cents == 0"
            - "Bank.${bank_id}.status == ACTIVE"
            - "Bank.${bank_id}.sanctions_flag == false"

      - name: bank_system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Bank
          - endpoints.POST_/banks
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          id, created_at, version, status, eligibility_score and
          confirming_line_used_cents are not members of POST /banks input, so a
          payload carrying them is rejected with 422 ERR_INVALID_REQUEST rather
          than silently honouring the client-supplied identity.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /banks"
              payload: { bank_name: "Raffles Confirming Bank", swift_bic: "RFCBSGSG", country_code: "SG", country_risk_score: 35, credit_rating: "A", confirmation_appetite_cents: 20000000, eligibility_score: 9999 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "no Bank row exists after the trigger"

      - name: credit_available_by_undeclared_enum_member_rejected
        claim_type: type_constraints
        grounds:
          - entities.DocumentaryCredit.fields.available_by
          - entities.DocumentaryCredit.fields.presentation_period_days
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          available_by outside {SIGHT_PAYMENT, ACCEPTANCE, NEGOTIATION,
          DEFERRED_PAYMENT} and presentation_period_days above the declared
          1..30 range both return 422 ERR_INVALID_REQUEST before any
          cross-entity or fiscal validation runs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000, one NO bank and one LV beneficiary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "RED_CLAUSE", incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 31 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { err_range: $.data.error_id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 99999, available_by: "SIGHT_PAYMENT", incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { err_amount: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 422 and ${err_enum} == ERR_INVALID_REQUEST"
            - "trigger call 2 returns HTTP 422 and ${err_range} == ERR_INVALID_REQUEST"
            - "trigger call 3 returns HTTP 422 and ${err_amount} == ERR_INVALID_REQUEST"
            - "no DocumentaryCredit row exists after the three triggers"

      - name: presented_document_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.PresentedDocument
          - endpoints.GET_/presentations/{id}/documents
          - errors.ERR_PRESENTATION_NOT_EXAMINABLE
        distinguishing_aspect: |
          PresentedDocument declares common_fields false: the row carries only id
          and created_at (no version, no updated_at), 1.5 exposes no update or
          delete route for it, and once the parent presentation leaves RECEIVED a
          further POST /presentations/{id}/documents is refused with 409
          ERR_PRESENTATION_NOT_EXAMINABLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, then advanced to 2026-09-14T09:00:00Z."
            - "The standard 10000000 SIGHT_PAYMENT credit is ISSUED on a 50000000 facility."
            - "A presentation carrying one COMMERCIAL_INVOICE of 2000000 and one BILL_OF_LADING has been submitted, so its examination_status is UNDER_EXAMINATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
