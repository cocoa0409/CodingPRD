        distinguishing_aspect: "The remaining two OCC rules with different parents: a second amend against the already-bumped contract fails 412 (create-with-supersede serialization), and a limits PATCH replaying the pre-mutation card version fails 412 while the fresh one applies."
        test_recipe:
