  - rule_id: cross_entity_state_dependency
    instances:
      - name: control_design_approval_requires_locked_system_description_boundary
        grounds:
          - state_machines.Control.design_status.DESIGN_MAPPED_to_DESIGN_APPROVED
          - entities.SystemDescription.fields.boundary_locked
          - entities.Engagement.fields.boundary_locked
          - validations[priority=170]
          - errors[ERR_BOUNDARY_NOT_LOCKED]
        distinguishing_aspect: |
          Entity pair (Control, SystemDescription): the Control design edge is gated on a field owned
          by a different aggregate — the APPROVED SystemDescription's boundary_locked — so the same
          APPROVE_DESIGN call returns ERR_BOUNDARY_NOT_LOCKED before lock-boundary and succeeds
          immediately after it, with nothing about the Control itself having changed.
        test_recipe:
          setup:
            - "Engagement 'Alpine' is in status SCOPING; its SystemDescription v1 is APPROVED but boundary_locked is still false, so Engagement.boundary_locked is false."
            - "Control C-01 is DESIGN_MAPPED with one ACTIVE PRIMARY mapping and owner_user_id own-1."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Alpine", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
              payload: { engagement_id: "${eng}", version_label: "v1", boundary_narrative: "Alpine platform boundary.", expected_engagement_version: "${eng_v}" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sd: $.data.id }
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "SOFTWARE", name: "Core API" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "APPROVE" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "C-01", title: "Access provisioning", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 20 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { c01: $.data.id }
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${c01}", trust_criterion_id: "${cc11}", mapping_type: "PRIMARY" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${c01}/assign-owner"
              payload: { owner_user_id: "own-1" }
              as: ComplianceLead
              as_user_id: "cl-1"
          trigger:
            - call: "POST /soc/controls/${c01}/transitions"
              payload: { action: "APPROVE_DESIGN" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${c01}/transitions"
              payload: { action: "APPROVE_DESIGN" }
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "${err} == ERR_BOUNDARY_NOT_LOCKED with HTTP status 409 on the first APPROVE_DESIGN"
            - "SystemDescription.${sd}.boundary_locked == true after lock-boundary"
            - "Engagement.${eng}.boundary_locked == true after lock-boundary"
            - "Control.${c01}.design_status == DESIGN_APPROVED after the second APPROVE_DESIGN"
            - "Control.${c01}.primary_mapping_count == 1"

      - name: evidence_submission_requires_engagement_in_observation_phase
        grounds:
          - state_machines.EvidenceRequest.SCHEDULED_to_SUBMITTED
          - entities.Engagement.fields.status
          - validations[priority=110]
          - errors[ERR_ENGAGEMENT_PHASE_INVALID]
        distinguishing_aspect: |
          Entity pair (EvidenceRequest, Engagement) — a different pair from the Control/SystemDescription
          dependency: the identical submit call by the identical owner is rejected with
          ERR_ENGAGEMENT_PHASE_INVALID while the engagement is READINESS and succeeds once the
          engagement reaches OBSERVATION, with the EvidenceRequest's own status SCHEDULED unchanged
          across both attempts.
