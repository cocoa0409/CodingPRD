      - name: packet_submission_evidence_and_resubmission_limit_errors
        claim_type: error_triggerable
        grounds: ["errors[ERR_MILESTONE_EVIDENCE_INSUFFICIENT]", "errors[ERR_PACKET_RESUBMISSION_LIMIT_REACHED]", "errors[ERR_COHORT_STATE_INVALID]", "errors[ERR_LICENSE_RECOMMENDATION_MISSING]", "validations[priority=34]", "validations[priority=53]"]
        excluded_because:
          difficulty_instance: "multi_hop_state_dependency / packet_submission_requires_closed_cohort"
          rationale: |
            Every rung of the packet-submission gate ladder shares one very
            expensive precondition set: readiness_index_live >= 85.00 from
            verified contact minutes, accepted observation cycles and credited
            seminars, a CLOSED cohort and an ATTAINED gating milestone. The §1.8
            instance already builds that chain once and walks the ladder rung by
            rung, asserting that ERR_COHORT_STATE_INVALID gives way to
            ERR_LICENSE_RECOMMENDATION_MISSING and then to the evidence check, so
            re-deriving the same state here to reach ERR_MILESTONE_EVIDENCE_INSUFFICIENT
            (fewer than three ATTAINED milestones or base_score < 75.00) and
            ERR_PACKET_RESUBMISSION_LIMIT_REACHED (a third REOPEN after two
            SUBMIT/RETURN/REOPEN cycles) would duplicate that setup without
            adding a distinguishing observation. The reachability of the
            resubmission bound is pinned by the cyclic CompletionCertification
            transitions in §1.2 (resubmission_count < 2) and by the
            ERR_ACTIVE_PACKET_EXISTS instance above, which exercises the
            ASSEMBLING/WITHDRAWN half of the same cycle cheaply.

