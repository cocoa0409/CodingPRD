              payload: {}
              as: DataProtectionOfficer
              captures: { err_cl: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_CONSUMER_HAS_OPEN_REFERRAL\""
            - "Consumer.${cl_id}.archive_status is still LIVE"
            - "the SENT referral still exists and its consent is still SEALED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:

      - name: score_alert_flat_row_is_written_suppressed_at_the_default_threshold
        claim_type: Constants Applied
        grounds:
          - calculations.score_alert_threshold
          - calculations.governance_thresholds
        distinguishing_aspect: "A 19-point move is below the default threshold of 20 and still produces a row, written SCORE_FLAT with the channel echoed rather than dropped."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z; second pull at 2026-09-02T00:00:00Z."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Flat Move", email: "flat@x.com", state_code: "CA", bureau_pin: "2468", dti_pct: 35.0 }
              as: Consumer
