              payload:
                expected_shop_visit_version: "${vc40_ver}"
                items:
                  - { item_code: "MO-2", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 110000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { r40_err: $.data.error_id }
          assert:
            - "captured r40_err == ERR_STALE_VERSION with http 412 (visit version advanced to 3 when v1 was created; the captured 2 is stale)"
      - name: cascading_side_effects_verify_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.FlightHourReport.SUBMITTED_to_VERIFIED]
        excluded_because:
