# =============================================================================
# Task 0662 — Soft-Wash & Roof/Exterior Cleaning
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_provisional_vs_final_cost_diverges
        grounds:
          - calculations.visit_provisional_cost
          - calculations.visit_final_cost
          - entities.Visit.fields.provisional_cost_cents
          - entities.Visit.fields.final_cost_cents
        distinguishing_aspect: |
          Same Visit, two algorithms on the Visit/Invoice domain: provisional uses the frozen quote
          total (92750), final re-prices on-site re-measured areas (roof 2200, siding 1600) to 100450,
          so provisional_cost_cents != final_cost_cents on the same row.
        test_recipe:
          setup:
            - "Customer (credit_limit_cents 0 → must be high enough; set 100000000), Route, Property (2 stories, roof 2000, siding 1500), ACCEPTED QUOTE_A (total 92750), a CLEAR WeatherWindow covering 2026-05-01, one AVAILABLE insured Tech with ladder_cert_max_stories 3."
            - "Visit created & scheduled (provisional_cost_cents=92750), crew confirmed, BEFORE photo, started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "Acme Owner", email: "acme@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "North Zone", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "1 Maple", stories: 2, roof_sqft: 2000, siding_sqft: 1500 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", soiling_level: "MODERATE", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 1500 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /technicians"
              payload: { full_name: "Tina Tech", ladder_cert_max_stories: 3, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-01T23:59:59Z", wind_mph: 5, precip_flag: false }
              as: Dispatcher
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { visit_id: $.data.id, visit_v: $.data.version }
            - call: "POST /visits/${visit_id}/schedule"
              payload: { expected_visit_version: "${visit_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${visit_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /crew-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${visit_id}/photos"
              payload: { phase: "BEFORE", photo_url: "http://img/before.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${visit_id}/photos"
              payload: { phase: "AFTER", photo_url: "http://img/after.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { re_measured_roof_sqft: 2200, re_measured_siding_sqft: 1600, re_measured_concrete_sqft: 0 }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "Visit.${visit_id}.provisional_cost_cents == 92750"
            - "Visit.${visit_id}.final_cost_cents == 100450"
            - "Visit.${visit_id}.final_cost_cents != Visit.${visit_id}.provisional_cost_cents"

      - name: technician_risk_projected_vs_chronological_diverges
        grounds:
          - calculations.technician_risk_score
          - entities.Technician.fields.ladder_cert_max_stories
          - entities.Technician.fields.insurance_status
        distinguishing_aspect: |
          Same Technician data, two algorithms on the Technician domain (NOT Visit/Invoice): projected counts
          BOTH committed assignments (one CONFIRMED on the completed visit + one RESERVED) → 2*20 = 40;
          chronological replays only the single COMPLETED-visit assignment with 0.5 decay → 20*0.5^0 = 20.
          Same tech, divergent numbers (40 != 20).
        test_recipe:
          setup:
            - "One Tech (ladder_cert_max_stories 2 so it may work 2-story roofs, insured), two 2-story Properties each with an ACCEPTED quote, two Visits — V1 driven all the way to COMPLETED (its assignment is CONFIRMED), V2 left SCHEDULED with a RESERVED assignment for the same tech."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "Risk Owner", email: "risk@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "Risk Zone", travel_buffer_minutes: 0 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Std Cert", ladder_cert_max_stories: 2, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-02T23:59:59Z", wind_mph: 5, precip_flag: false }
              as: Dispatcher
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "10 Tall", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { prop1_id: $.data.id, prop1_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop1_id}", soiling_level: "MODERATE", expected_property_version: "${prop1_v}" }
              as: Dispatcher
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${q1_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${q1_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "12 Tall", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { prop2_id: $.data.id, prop2_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop2_id}", soiling_level: "MODERATE", expected_property_version: "${prop2_v}" }
              as: Dispatcher
              captures: { q2_id: $.data.id }
            - call: "POST /quotes/${q2_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${q2_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${q2_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            # Visit 1 — driven all the way to COMPLETED (its CrewAssignment ends CONFIRMED)
            - call: "POST /visits"
              payload: { property_id: "${prop1_id}", quote_id: "${q1_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { v1_id: $.data.id, v1_v: $.data.version }
            - call: "POST /visits/${v1_id}/schedule"
              payload: { expected_visit_version: "${v1_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${v1_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asg1_id: $.data.id }
            - call: "POST /crew-assignments/${asg1_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${v1_id}/photos"
              payload: { phase: "BEFORE", photo_url: "http://img/b.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${v1_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${v1_id}/photos"
              payload: { phase: "AFTER", photo_url: "http://img/a.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${v1_id}/complete"
              payload: { re_measured_roof_sqft: 2000, re_measured_siding_sqft: 0, re_measured_concrete_sqft: 0 }
              as: FieldTech
              as_user_id: "${tech_id}"
            # Visit 2 — left SCHEDULED with only a RESERVED assignment for the same tech (different day, no overlap)
            - call: "POST /visits"
              payload: { property_id: "${prop2_id}", quote_id: "${q2_id}", scheduled_date: "2026-05-02", duration_minutes: 120 }
              as: Dispatcher
              captures: { v2_id: $.data.id, v2_v: $.data.version }
            - call: "POST /visits/${v2_id}/schedule"
              payload: { expected_visit_version: "${v2_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${v2_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-02T14:00:00Z" }
              as: Dispatcher
              captures: { asg2_id: $.data.id }
          trigger:
            - call: "GET /technicians/${tech_id}/risk-score?mode=projected"
              payload: {}
              as: Dispatcher
              captures: { projected: $.data.risk_score }
            - call: "GET /technicians/${tech_id}/risk-score?mode=chronological"
              payload: {}
              as: Dispatcher
              captures: { chrono: $.data.risk_score }
          assert:
            - "projected (2 committed assignments: V1 CONFIRMED + V2 RESERVED) == 40"
            - "chronological (1 COMPLETED-visit assignment, decay^0) == 20"
            - "projected != chronological (40 != 20) — same tech, divergent algorithms"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_line_rounding_order_round_per_line_then_sum
        grounds:
          - calculations.quote_line_total
          - calculations.quote_total
          - entities.QuoteLineItem.fields.line_total_cents
          - entities.ServiceQuote.fields.subtotal_cents
        distinguishing_aspect: |
          MODE (b) nested rounding order: two CONCRETE_CLEAN lines on a 1-story property each raw 1270.5 →
          rounded per line to 1271; subtotal = 1271+1271 = 2542. Sum-then-round would give 2541. Scaffold
          pins round-per-line-then-sum, so subtotal_cents == 2542 (not 2541).
        test_recipe:
          setup:
            - "Customer, Route, Property (1 story), DRAFT quote QUOTE_RND with two CONCRETE_CLEAN 105-sqft line items; quote sent to freeze totals."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rnd Owner", email: "rnd@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "R Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "5 Flat", stories: 1, concrete_sqft: 210 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", soiling_level: "MODERATE", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "CONCRETE", service_type: "CONCRETE_CLEAN", measured_sqft: 105 }
              as: Dispatcher
              captures: { li1_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "CONCRETE", service_type: "CONCRETE_CLEAN", measured_sqft: 105 }
              as: Dispatcher
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { subtotal: $.data.subtotal_cents, total: $.data.total_cents }
          assert:
            - "QuoteLineItem.${li1_id}.line_total_cents == 1271"
            - "ServiceQuote.${quote_id}.subtotal_cents == 2542"
            - "ServiceQuote.${quote_id}.total_cents == 10042"

      - name: chemical_dose_three_inputs_nested_min_max_clamps_to_minimum
        grounds:
          - calculations.chemical_dose
          - entities.QuoteLineItem.fields.chemical_dose_oz
          - entities.ServiceQuote.fields.soiling_level
        distinguishing_aspect: |
          MODE (a) ≥3 inputs (measured_sqft, service_type base oz, soiling tier) with nested min/max:
          a CONCRETE_CLEAN 105-sqft line at MODERATE yields raw (105/100)*4*1.0 = 4.2 oz, below MIN_PRIME_OZ,
          so the nested max(MIN, min(raw, MAX)) clamps chemical_dose_oz to exactly 8.0.
        test_recipe:
          setup:
            - "Customer, Route, Property (1 story), DRAFT quote at MODERATE soiling with one CONCRETE_CLEAN 105-sqft line."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dose Owner", email: "dose@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "D Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "7 Flat", stories: 1, concrete_sqft: 105 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", soiling_level: "MODERATE", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "CONCRETE", service_type: "CONCRETE_CLEAN", measured_sqft: 105 }
              as: Dispatcher
              captures: { li_id: $.data.id, dose: $.data.chemical_dose_oz }
          assert:
            - "QuoteLineItem.${li_id}.chemical_dose_oz == 8.0"
            - "QuoteLineItem.${li_id}.line_total_cents == 1271"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_sent_to_draft_to_sent
        grounds:
          - state_machines.ServiceQuote.SENT_to_DRAFT
          - state_machines.ServiceQuote.DRAFT_to_SENT
          - entities.ServiceQuote.fields.status
        distinguishing_aspect: |
          ServiceQuote cycle: DRAFT→SENT→DRAFT→SENT on the same quote (revise then re-send), proving the
          state graph is not a linear pipeline. After the second send the quote is SENT again with totals re-frozen.
        test_recipe:
          setup:
            - "Customer, Route, 1-story Property, DRAFT quote with one HOUSE_WASH line, sent once."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cyc Owner", email: "cyc@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "C Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "9 Flat", stories: 1, siding_sqft: 1000 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", soiling_level: "MODERATE", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 1000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /quotes/${quote_id}/revise"
              payload: {}
              as: Dispatcher
              captures: { st_after_revise: $.data.status }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { st_after_resend: $.data.status }
          assert:
            - "ServiceQuote.${quote_id}.status == DRAFT immediately after revise"
            - "ServiceQuote.${quote_id}.status == SENT after the second send (cycle closed)"
            - "ServiceQuote.${quote_id}.subtotal_cents == 15000 after re-send"

      - name: visit_reclean_cycle_completed_to_reclean_requested
        grounds:
          - state_machines.Visit.COMPLETED_to_RECLEAN_REQUESTED
          - state_machines.SatisfactionClaim.OPEN_to_APPROVED
          - entities.Visit.fields.reclean_of_visit_id
        distinguishing_aspect: |
          Visit cycle on a DIFFERENT entity (Visit, not ServiceQuote): a COMPLETED visit loops to
          RECLEAN_REQUESTED when its SatisfactionClaim is APPROVED, spawning a fresh REQUESTED re-clean visit
          whose reclean_of_visit_id points back to the original — non-linear, distinct from the quote cycle.
        test_recipe:
          setup:
            - "A COMPLETED one-off Visit V0 (full happy path) with an OPEN SatisfactionClaim filed by its owner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "RC Owner", email: "rc@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "RC Zone", travel_buffer_minutes: 0 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "RC Tech", ladder_cert_max_stories: 3, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-01T23:59:59Z", wind_mph: 5 }
              as: Dispatcher
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "3 Maple", stories: 2, roof_sqft: 2000, siding_sqft: 1500 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", soiling_level: "MODERATE", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 1500 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { v0_id: $.data.id, v0_v: $.data.version }
            - call: "POST /visits/${v0_id}/schedule"
              payload: { expected_visit_version: "${v0_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${v0_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /crew-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${v0_id}/photos"
              payload: { phase: "BEFORE", photo_url: "http://img/b.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${v0_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${v0_id}/photos"
              payload: { phase: "AFTER", photo_url: "http://img/a.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${v0_id}/complete"
              payload: { re_measured_roof_sqft: 2000, re_measured_siding_sqft: 1500, re_measured_concrete_sqft: 0 }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /satisfaction-claims"
              payload: { visit_id: "${v0_id}", reason: "streaks on north siding" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /satisfaction-claims/${claim_id}/approve"
              payload: {}
              as: Dispatcher
              captures: { reclean_visit_id: $.data.reclean_visit_id }
          assert:
            - "Visit.${v0_id}.status == RECLEAN_REQUESTED"
            - "SatisfactionClaim.${claim_id}.status == APPROVED and reclean_visit_id is non-null"
            - "The spawned Visit.${reclean_visit_id}.reclean_of_visit_id == ${v0_id} and status == REQUESTED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plan_cancel_cascade_depth3_plan_visit_assignment_minutes
        grounds:
          - state_machines.RecurringPlan
          - state_machines.Visit.REQUESTED_to_CANCELLED
          - state_machines.CrewAssignment.RESERVED_to_RELEASED
          - entities.Technician.fields.scheduled_minutes
        distinguishing_aspect: |
          Depth-3 cascade from plan cancel: cancel plan → plan CANCELLED (hop1) → its future SCHEDULED Visit
          → CANCELLED (hop2 caused by hop1) → that visit's CONFIRMED CrewAssignment → RELEASED (hop3 caused by
          hop2), decrementing Technician.scheduled_minutes from 120 back to 0. Each hop caused by the prior.
        test_recipe:
          setup:
