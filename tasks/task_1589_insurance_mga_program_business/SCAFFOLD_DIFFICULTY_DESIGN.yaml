  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_bind_requires_program_active
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - state_machines.Program.ACTIVE_to_RUN_OFF
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Policy <- Program: a QUOTED policy with ample capacity cannot
          bind once its Program leaves ACTIVE (RUN_OFF); the same bind succeeds while
          ACTIVE, isolating the cross-entity state precondition.
        test_recipe:
          setup:
            - "ACTIVE program, tranche 300000; policy A QUOTED (gross 155000); policy B QUOTED (gross 155000)"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier XE1", naic_code: "NAIC-XE1", contact_email: "uw@xe1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "XE1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "A", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { polA: $.data.id } }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "B", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { polB: $.data.id } }
            - { call: "POST /mga/policies/${polA}/bind", payload: {}, as: MGAUnderwriter, captures: { a_st: $.data.status } }
            - { call: "POST /mga/programs/${prog}/enter-runoff", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
          trigger:
            - { call: "POST /mga/policies/${polB}/bind", payload: {}, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "policy A bound while program ACTIVE (status BOUND, capacity ample: 155000 <= 300000)"
            - "policy B identical in every policy-local respect but program now RUN_OFF: error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "Program.${prog}.consumed_aggregate_cents == 155000 (only A consumed)"

      - name: claim_review_requires_appointment_active
        grounds:
          - state_machines.Claim.REPORTED_to_UNDER_REVIEW
          - state_machines.TPAAppointment.ACTIVE_to_SUSPENDED
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair Claim <- TPAAppointment (different pair from Policy <- Program):
          a REPORTED claim cannot enter review once its assigning appointment is
          SUSPENDED; reinstating the appointment re-enables the very same transition.
