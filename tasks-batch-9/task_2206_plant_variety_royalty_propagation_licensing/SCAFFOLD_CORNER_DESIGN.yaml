  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: tag_order_create_with_a_stale_quota_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tag-order-create-stale-quota]
          - errors.ERR_STALE_QUOTA_VERSION
          - calculations.quota_tag_inventory
        distinguishing_aspect: "The quota's version is bumped by the FIRST tag order's own inventory write, so replaying the version captured at quota creation is stale on the second order: the create returns 412 ERR_STALE_QUOTA_VERSION and the re-read version succeeds. Version increments on every write to the quota row, including the derived-inventory writes made by tag issue and reconcile."
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE agreement, one ACTIVE quota of 5000 units whose version at creation is captured as qv1 (value 1)."
            - "One tag order for 400 units already created using qv1, which advanced the quota's version."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Highfield Bramble", species: "Rubus idaeus", breeder_code: "HF", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Highfield Nursery", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id, qv1: $.data.version }
            - call: "POST /tag-orders"
              payload: { quota_id: "${q_id}", requested_units: 400, expected_quota_version: "${qv1}" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { tg1_id: $.data.id }
          trigger:
            - call: "POST /tag-orders"
              payload: { quota_id: "${q_id}", requested_units: 600, expected_quota_version: "${qv1}" }
              as: Propagator
              as_user_id: "${p_id}"
          assert:
            - "The captured qv1 was 1, and after the first tag order ProductionQuota.${q_id}.version == 2"
            - "HTTP status is 412 and data.error_id == ERR_STALE_QUOTA_VERSION"
            - "No second TagOrder row exists: GET /tag-orders?quota_id=${q_id} returns total_count == 1"
            - "ProductionQuota.${q_id}.version is still 2 - a rejected write does not bump the version"
            - "Re-reading via GET /production-quotas/${q_id} and resubmitting with that version returns 201, and the quota's version becomes 3"

