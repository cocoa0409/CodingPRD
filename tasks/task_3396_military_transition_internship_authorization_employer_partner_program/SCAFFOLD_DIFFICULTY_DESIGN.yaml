            - "link 3: InternshipMatch.${mt2}.match_status == TERMINATED_EARLY with termination_reason == EMPLOYER_REVOKED (ACTIVE at sanction time)"
            - "link 3 ledgers: EmployerOpening.${op}.filled_count == 0 and ServiceMember.${m2}.active_match_count == 0"

