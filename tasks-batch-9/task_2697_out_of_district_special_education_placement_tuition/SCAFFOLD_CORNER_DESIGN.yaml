          - "endpoints.POST_return_transition_plans_id_activate"
        excluded_because:
          difficulty_instance: return_readiness_trailing_versus_recency_weighted
          rationale: "readiness_variant is chosen per activate call and defaults to trailing_two_quarter. That §1.8 instance activates under each variant from the same accepted-report set, shows the two scores diverge, shows the default applies when the input is omitted, and shows readiness_score_at_activation records the variant actually used."
      - name: award_delta_reconciles_on_the_fiscal_account_when_the_basis_switches
        claim_type: Reconciliation
        grounds:
          - "calculations.reimbursement_award.variants"
          - "state_machines.ReimbursementClaim[AWARDED_PARTIAL->REMANDED]"
        excluded_because:
          difficulty_instance: reimbursement_strict_statutory_versus_equitable_actual_cost
          rationale: "The only way the award variant can switch on a live claim is remand-then-readjudicate, and that §1.8 instance walks exactly that path, reconciling the fiscal account cent-for-cent across the strict_statutory award, the reversal and the larger equitable_actual_cost award."
      - name: volume_credit_fills_before_the_admin_fee_is_taken
        claim_type: waterfall_allocation
        grounds:
          - "calculations.invoice_net_payable"
          - "calculations.invoice_net_payable.constants"
        excluded_because:
          difficulty_instance: net_payable_volume_tier_keyed_on_gross_not_subtotal
          rationale: "invoice_net_payable is the declared waterfall: gross feeds the volume-credit bucket, the credit is subtracted, and only then is the admin fee taken on the subtotal. That §1.8 instance pins the ordering by choosing a gross that sits above a tier floor while the post-credit subtotal sits below it, so keying the tier off the subtotal produces a visibly different number."
