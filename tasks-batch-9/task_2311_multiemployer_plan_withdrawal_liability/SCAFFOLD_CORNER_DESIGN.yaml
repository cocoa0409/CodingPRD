              captures: { err_fa: "$.data.error_id" }
            - call: "POST /liability-assessments/${la_id}/issue"
              payload: {}
              as: EmployerRepresentative
              as_user_id: "${emp_id}"
              captures: { err_emp: "$.data.error_id" }
            - call: "POST /liability-assessments/${la_id}/issue"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
              captures: { err_act: "$.data.error_id" }
          assert:
            - "All three calls return HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\"."
            - "The PlanActuary attempt returns 403 rather than the 409 ERR_SEGREGATION_OF_DUTIES it would earn on role grounds alone, proving priority 2 precedes priority 9."
            - "GET /liability-assessments/${la_id} still reports lifecycle_status == \"DRAFT\", issued_at == null and active_schedule_generation == 0."

