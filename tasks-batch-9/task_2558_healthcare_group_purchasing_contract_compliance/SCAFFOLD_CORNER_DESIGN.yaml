      - name: commitment_election_guards_report_not_elected_and_not_active
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COMMITMENT_NOT_ELECTED
          - errors.ERR_COMMITMENT_NOT_ACTIVE
          - state_machines.Commitment.ELECTED_to_TERMINATED
          - validations[priority=8]
        distinguishing_aspect: "The two election-status guards are not interchangeable: issuing a letter needs election_status ELECTED (a TERMINATED commitment whose lop_status is still NOT_ISSUED clears the lop guard and then fails with ERR_COMMITMENT_NOT_ELECTED), while opening a requalification or a measurement needs ACTIVE (or REQUAL_REVIEW) and fails with ERR_COMMITMENT_NOT_ACTIVE. The measurement case also proves the priority-8 state check runs before the priority-9 OCC check, because a perfectly fresh expected_commitment_version still returns 409 and not 412."
        test_recipe:
          setup: ["ACTIVE contract C-EG; members M-1 and M-2 each with a freshly ELECTED commitment (lop_status NOT_ISSUED)."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-EG", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
