          The funding draw is the CAPITAL figure (net_capital_cents when a quote is accepted, else
          estimated_capital_cents, always plus facility_modification_cents), never the five-year TCO, and
          it is re-derived at fund time: a request whose 100000000 draw exceeds a 60000000 allocation is
          rejected, and the very same fund call succeeds after negotiation drops the accepted price into
          the SMALL tier at 57000000.
