            - call: "POST /api/production-slots/${sl}/assign"
              payload: { bus_unit_id: "${bu_id}" }
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl}/complete-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/bus-units/${bu_id}/compliance-certificates"
              payload: { variant: COST_BASED, issued_by: "co-1" }
              as: ComplianceOfficer
            - call: "POST /api/bus-units/${bu_id}/submit-plant-inspection"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/inspection-records"
              payload: { bus_unit_id: "${bu_id}", inspection_type: PLANT, inspector_id: "insp-1", result: PASS }
              as: AgencyInspector
            - call: "POST /api/bus-units/${bu_id}/deliver"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/inspection-records"
              payload: { bus_unit_id: "${bu_id}", inspection_type: DELIVERY, inspector_id: "insp-1", result: FAIL, defects: ["DOOR_MISALIGN"] }
              as: AgencyInspector
          trigger:
            - call: "POST /api/contracts/${ct_id}/complete"
              payload: {}
              as: ProcurementOfficer
              captures: { st: $.data.status }
            - call: "POST /api/contracts/${ct_id}/terminate"
              payload: {}
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "st == COMPLETED"
            - "err == ERR_INVALID_STATE"

      - name: option_exercise_from_expired_invalid
        claim_type: invalid_transition
        grounds: [state_machines.OptionOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Exercising an EXPIRED option fails with ERR_INVALID_STATE and never recomputes pricing."
        test_recipe:
          setup: ["ACTIVE contract; option year 1 EXPIRED via clock advance to awarded_at + 366d"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Glacier Transit", agency_code: "GLT1", federally_funded: true, transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 2, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413, option_years: 1, option_specs: [ { quantity: 5, propulsion_type: DIESEL } ] }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Engine", category: PROPULSION, unit_cost_cents: 800000, is_domestic: true }
