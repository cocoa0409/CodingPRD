            - "Certificant.${cert_id}.valid_through == \"2028-08-10\" and current_cycle_id == \"${cycle2_id}\""
            - "Certificant.${cert_id}.status == ACTIVE and version == ${cert_v} + 1"
      - name: reads_with_an_unknown_id_answer_the_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - endpoints.GET_/forms/{id}
          - endpoints.GET_/applications/{id}
          - endpoints.GET_/exam-sessions/{id}
          - endpoints.GET_/exam-registrations/{id}
          - endpoints.GET_/security-incidents/{id}
          - endpoints.GET_/recertification-cycles/{id}
          - endpoints.GET_/ceu-activities/{id}
          - endpoints.GET_/disciplinary-cases/{id}
          - errors.ERR_FORM_NOT_FOUND
          - errors.ERR_APPLICATION_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_REGISTRATION_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_FOUND
          - errors.ERR_CYCLE_NOT_FOUND
          - errors.ERR_ACTIVITY_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - response_envelope
        distinguishing_aspect: |
          §1.6 declares one not-found error_id per entity rather than a single generic 404, so
          each read-by-id endpoint must answer with ITS OWN entity's error_id: the same unknown
          uuid produces eight DIFFERENT error_ids across eight endpoints, every response is 404
          with only error_id and message under data, and no two of the eight are equal. A shared
          ERR_NOT_FOUND, a 200 with a null body, or a 500 fails.
        test_recipe:
          setup:
            - "Empty database: no ExamForm, EligibilityApplication, ExamSession, ExamRegistration, SecurityIncident, RecertificationCycle, CEUActivity or DisciplinaryCase row exists."
            - "The id 00000000-0000-0000-0000-000000000000 belongs to no row of any entity. The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /programs"
              payload: {"limit": 1, "offset": 0}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /forms/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { e_form: "$.data.error_id" }
            - call: "GET /applications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { e_app: "$.data.error_id" }
            - call: "GET /exam-sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { e_sess: "$.data.error_id" }
            - call: "GET /exam-registrations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { e_reg: "$.data.error_id" }
            - call: "GET /security-incidents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { e_inc: "$.data.error_id" }
            - call: "GET /recertification-cycles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { e_cyc: "$.data.error_id" }
            - call: "GET /ceu-activities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { e_act: "$.data.error_id" }
            - call: "GET /disciplinary-cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EthicsOfficer
              as_user_id: "eth-1"
              captures: { e_case: "$.data.error_id" }
          assert:
            - "trigger[0] responds 404 with ${e_form} == ERR_FORM_NOT_FOUND"
            - "trigger[1] responds 404 with ${e_app} == ERR_APPLICATION_NOT_FOUND"
            - "trigger[2] responds 404 with ${e_sess} == ERR_SESSION_NOT_FOUND"
            - "trigger[3] responds 404 with ${e_reg} == ERR_REGISTRATION_NOT_FOUND"
            - "trigger[4] responds 404 with ${e_inc} == ERR_INCIDENT_NOT_FOUND"
            - "trigger[5] responds 404 with ${e_cyc} == ERR_CYCLE_NOT_FOUND"
            - "trigger[6] responds 404 with ${e_act} == ERR_ACTIVITY_NOT_FOUND"
            - "trigger[7] responds 404 with ${e_case} == ERR_CASE_NOT_FOUND"
            - "the eight captured error_ids are pairwise distinct and every response body carries data.error_id and data.message and nothing else"
            - "none of the eight reads is refused ERR_UNAUTHENTICATED or ERR_FORBIDDEN_ROLE — each acting role is listed on its endpoint, so the 404 is a lookup verdict"
  # =========================================================================
  - section: state_machines
    instances:
      - name: program_activation_moves_draft_to_active_and_bumps_the_version
        claim_type: valid_transition
        grounds:
          - state_machines.CertificationProgram.DRAFT_to_ACTIVE
          - endpoints.POST_/programs/{id}/activate
        distinguishing_aspect: |
          The only trigger that leaves DRAFT is the explicit activate call: it must set status
          ACTIVE and advance version from 1 to 2 without touching any input field or computed
          counter.
        test_recipe:
          setup:
            - "One DRAFT programme CPX with version 1."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "board approved"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "the response is 200 and CertificationProgram.${prog_id}.status == ACTIVE"
            - "CertificationProgram.${prog_id}.version == 2"
            - "CertificationProgram.${prog_id}.credential_code == \"CPX\" and form_length == 1 are unchanged"
            - "CertificationProgram.${prog_id}.operational_item_count == 0 and certificants_issued_count == 0"
      - name: program_activation_repeated_on_an_active_program_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CertificationProgram.DRAFT_to_ACTIVE
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          ACTIVE has no self-loop in the declared machine, so a second activate must be refused
          with 409 ERR_INVALID_STATE and must not bump the version a second time — the call is
          rejected, not treated as idempotent.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX at version 2."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "second attempt"}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is 409 with ${err} == ERR_INVALID_STATE"
            - "CertificationProgram.${prog_id}.status stays ACTIVE and version stays 2"
      - name: item_creation_starts_in_draft_with_no_approvals_and_no_statistics
        claim_type: initial_state
        grounds:
          - state_machines.Item.initial_state
          - entities.Item.fields.status
          - entities.Item.fields.approver_user_ids
        distinguishing_aspect: |
          A fresh Item must sit in the declared initial_state DRAFT with every accumulator at 0,
          both statistics null and stat_basis_applied INSUFFICIENT_DATA — never in IN_REVIEW
          just because a revision_note-bearing workflow exists.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "Fresh item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
          assert:
            - "the response is 201 and Item.${item_id}.status == DRAFT"
            - "Item.${item_id}.approver_user_ids == [] and Item.${item_id}.flag_reason == null"
            - "Item.${item_id}.pretest_response_count == 0 and Item.${item_id}.operational_response_count == 0"
            - "Item.${item_id}.p_value == null, discrimination_index == null and stat_basis_applied == INSUFFICIENT_DATA"
            - "Item.${item_id}.retired_at == null and retirement_reason == null"
      - name: item_review_after_rejection_is_locked_out_of_the_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Item.IN_REVIEW_to_REJECTED
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          REJECTED is terminal for Item: neither a further review decision nor a resubmission
          may leave it, so both calls fail with ERR_INVALID_STATE and review_round stops
          advancing.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX and one Item taken DRAFT -> IN_REVIEW -> REJECTED by isp-rev-1."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "Doomed item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "first pass"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "REJECT", "review_note": "off blueprint"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
          trigger:
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE", "review_note": "rescue attempt"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
              captures: { err_review: "$.data.error_id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "resubmission attempt"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { err_submit: "$.data.error_id" }
          assert:
            - "trigger[0] responds 409 with ${err_review} == ERR_INVALID_STATE"
            - "trigger[1] responds 409 with ${err_submit} == ERR_INVALID_STATE"
            - "Item.${item_id}.status stays REJECTED and approver_user_ids stays []"
      - name: registration_cancel_schedule_repeated_from_unscheduled_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ExamRegistration.SCHEDULED_to_UNSCHEDULED
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
          - calculations.session_seat_occupancy
        distinguishing_aspect: |
          The seat release is a transition, not an idempotent write: the second cancel finds
