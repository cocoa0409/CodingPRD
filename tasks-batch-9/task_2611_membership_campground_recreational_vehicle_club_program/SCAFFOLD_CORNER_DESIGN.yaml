      - name: affiliate_agreement_status_changes_follow_the_declared_action_transitions
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /affiliate-agreements/{id}/status-changes"]
          - state_machines.AffiliateAgreement
          - validations[priority=27]
          - errors[ERR_INVALID_AGREEMENT_STATE]
        distinguishing_aspect: "The one action endpoint that drives four states: DRAFT to SUSPENDED is rejected, DRAFT to ACTIVE is accepted, ACTIVE to SUSPENDED and back to ACTIVE exercises the revert cycle, ACTIVE to EXPIRED terminates, and EXPIRED to ACTIVE is rejected from the terminal state."
        test_recipe:
          setup:
            - "One freshly created affiliate agreement, still DRAFT, with no parks attached so nothing cascades"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /affiliate-agreements"
              payload: { partner_name: "Timberline Partner Network", effective_from: "2026-01-01", effective_to: "2026-12-31", annual_member_night_quota: 40, reciprocity_ratio: 1.5, min_tier_rank: 2, advance_window_cap_days: 45, per_stay_night_cap: 7, settlement_rate_cents_per_night: 1500 }
              as: ClubAdmin
              captures: { agr_tl_id: "$.data.id", agr_tl_initial_status: "$.data.status", agr_tl_initial_nights: "$.data.nights_consumed_ytd" }
          trigger:
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "SUSPENDED" }
              as: ClubAdmin
              captures: { draft_to_suspended_error_id: "$.data.error_id" }
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "ACTIVE" }
              as: ClubAdmin
              captures: { status_active: "$.data.status" }
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "SUSPENDED" }
              as: ClubAdmin
              captures: { status_suspended: "$.data.status" }
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "ACTIVE" }
              as: ClubAdmin
              captures: { status_active_again: "$.data.status" }
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "EXPIRED" }
              as: ClubAdmin
              captures: { status_expired: "$.data.status" }
            - call: "POST /affiliate-agreements/${agr_tl_id}/status-changes"
              payload: { new_status: "ACTIVE" }
              as: ClubAdmin
              captures: { expired_to_active_error_id: "$.data.error_id" }
          assert:
            - "The agreement is created DRAFT with nights_consumed_ytd 0 and settlement_owed_cents 0"
            - "DRAFT -> SUSPENDED: HTTP 409 with error_id ERR_INVALID_AGREEMENT_STATE and the status stays DRAFT"
            - "DRAFT -> ACTIVE: HTTP 200 with status ACTIVE"
            - "ACTIVE -> SUSPENDED then SUSPENDED -> ACTIVE both return HTTP 200, so the revert cycle is traversable in both directions"
            - "ACTIVE -> EXPIRED: HTTP 200 with status EXPIRED"
            - "EXPIRED -> ACTIVE: HTTP 409 with error_id ERR_INVALID_AGREEMENT_STATE, since EXPIRED is terminal; the status remains EXPIRED and the quota counters never moved"
  - section: errors
