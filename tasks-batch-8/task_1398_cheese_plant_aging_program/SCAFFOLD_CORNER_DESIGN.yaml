            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 500.0, wheels_produced: 4 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/cheese-batches", payload: { make_sheet_id: "${make_id}" }, as: Cheesemaker, captures: { batch_id: "$.data[0].id" } }
            - { call: "POST /plant/plants/${pid}/aging-rooms", payload: { code: "RM-1", capacity_wheels: 100, temp_c: 10.0, humidity_pct: 85.0 }, as: PlantAdmin, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /plant/aging-units", payload: { cheese_batch_id: "${batch_id}", aging_room_id: "${room_id}", wheel_count: 4, expected_aging_room_version: "${room_v}" }, as: AgingRoomOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 40.0, fat_dry_basis_pct: 50.0, body_score: 9, flavor_score: 9 }, as: QAGrader, as_user_id: "qa_carol" }
            - { call: "POST /plant/cheese-batches/${batch_id}/release", payload: {}, as: QAGrader }
          trigger:
            - { call: "POST /plant/grading-events", payload: { cheese_batch_id: "${batch_id}", moisture_pct: 40.0, fat_dry_basis_pct: 50.0, body_score: 1, flavor_score: 1 }, as: QAGrader, as_user_id: "qa_dave", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (release_decision RELEASED blocks re-grade)"
            - "CheeseBatch.${batch_id}.current_grade == GRADE_A (unchanged)"

      - name: rate_threshold_room_full_at_exact_capacity
        claim_type: rate_threshold_triggers
        grounds: [calculations.aging_room_posture]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / aging_room_capacity_aggregate_overlap
          rationale: "Exact-capacity FULL boundary asserted there (12 == 12 -> FULL)."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_in_same_read
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediately after make completion, a GET on the intake shows CONSUMED and a GET on the vat shows CLEANING — no eventual-consistency lag."
        test_recipe:
          setup: ["make started consuming the full intake volume"]
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-280" }, as: PlantAdmin, captures: { pid: $.data.id } }
            - { call: "POST /plant/plants/${pid}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${pid}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${pid}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
            - { call: "POST /plant/additive-lots/${cul_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/additive-lots/${coa_id}/release", payload: {}, as: QAGrader }
            - { call: "POST /plant/make-sheets", payload: { vat_id: "${vat_id}", milk_intake_id: "${milk_id}", variety: "MUENSTER", scheduled_start: "2026-08-01T02:00:00Z", scheduled_end: "2026-08-01T06:00:00Z", liters_committed: 5000.0, culture_lot_id: "${cul_id}", coagulant_lot_id: "${coa_id}", culture_units_planned: 5.0, coagulant_ml_planned: 250.0, expected_vat_version: "${vat_v}" }, as: MakePlanner, captures: { make_id: $.data.id } }
            - { call: "POST /plant/make-sheets/${make_id}/start", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/1/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/2/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/3/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/4/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_bob" }
            - { call: "POST /plant/make-sheets/${make_id}/steps/5/sign-off", payload: {}, as: Cheesemaker, as_user_id: "cm_alice" }
          trigger:
            - { call: "POST /plant/make-sheets/${make_id}/complete", payload: { green_weight_kg: 500.0, wheels_produced: 4 }, as: Cheesemaker, as_user_id: "cm_alice" }
            - { call: "GET /plant/milk-intakes/${milk_id}", payload: {}, as: MilkReceiver, captures: { ist: $.data.status } }
            - { call: "GET /plant/vats/${vat_id}", payload: {}, as: Cheesemaker, captures: { vst: $.data.status } }
          assert:
