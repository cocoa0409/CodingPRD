          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
      - call: POST /api/cdi-queries
        payload:
          cdi_review_id: ${rev}
          provider_id: ${prov}
          escalation_policy_id: ${ep}
          query_text: t
          clinical_indicators:
          - x
          proposed_drg_code: B
