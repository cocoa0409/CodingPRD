# =============================================================================
# Task 1830 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2+ instances. Every recipe is replayable against SCAFFOLD.yaml §1.5.
#
# Shared building blocks used across instances (all calls resolve to §1.5):
#   clock default 2026-08-01T00:00:00Z; committee terms cover 2026;
#   standard dossier = TEACHING x2 (10pp each), RESEARCH x3 (12pp, one
#   is_peer_reviewed), SERVICE x1 (5pp) — exactly meets minima 2/3/1.
#   Case version arithmetic: create -> v1; each dossier-item create bumps +1
#   (6 items -> v7); submit-dossier bumps -> v8; each invitation create +1.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: vote_tally_strict_vs_supermajority_diverge
        grounds:
          - calculations.vote_tally
          - entities.Committee.fields.pass_rule
          - state_machines.ReviewRound.TALLYING_to_COMPLETED
        distinguishing_aspect: |
          Vote-tally dual variants on the ReviewRound domain: identical ballots
          (eligible 7, YES 3, NO 1, ABSTAIN 2) certify as passed=true under
          STRICT_MAJORITY_OF_CAST (3/4 = 0.75 > 0.5) but passed=false under
          SUPERMAJORITY_OF_ENTITLED (3/7 = 0.4286 < 0.6667) — same data, two
          verdicts, selected by Committee.pass_rule.
        test_recipe:
          setup:
            - "Two independent cases (A, B), each driven to a DEPARTMENT round with 3 letters and completed midterm"
            - "Case A's department committee uses pass_rule STRICT_MAJORITY_OF_CAST; case B's uses SUPERMAJORITY_OF_ENTITLED"
            - "Both committees: 6 MEMBERs + 1 CHAIR (M = 7, no recusals, eligible = 7, quorum_required = ceil(0.5*7) = 4)"
            - "Identical ballots in both rounds: YES x3, NO x1, ABSTAIN x2 (votes_cast = 6 >= 4)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand A", employee_id: "E100", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_a: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_a}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY", waiver_signed: true }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_a: $.data.id, case_a_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_a}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_a_v}" }, as: Candidate, as_user_id: "${cand_a}", captures: { a_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_a}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_a_v} + 1" }, as: Candidate, as_user_id: "${cand_a}", captures: { a_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_a}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_a_v} + 2" }, as: Candidate, as_user_id: "${cand_a}", captures: { a_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_a}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_a_v} + 3" }, as: Candidate, as_user_id: "${cand_a}", captures: { a_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_a}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_a_v} + 4" }, as: Candidate, as_user_id: "${cand_a}", captures: { a_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_a}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_a_v} + 5" }, as: Candidate, as_user_id: "${cand_a}", captures: { a_s1: $.data.id } }
            - { call: "POST /api/dossier-items/${a_t1}/submit", as: Candidate, as_user_id: "${cand_a}" }
            - { call: "POST /api/dossier-items/${a_t2}/submit", as: Candidate, as_user_id: "${cand_a}" }
            - { call: "POST /api/dossier-items/${a_r1}/submit", as: Candidate, as_user_id: "${cand_a}" }
            - { call: "POST /api/dossier-items/${a_r2}/submit", as: Candidate, as_user_id: "${cand_a}" }
            - { call: "POST /api/dossier-items/${a_r3}/submit", as: Candidate, as_user_id: "${cand_a}" }
            - { call: "POST /api/dossier-items/${a_s1}/submit", as: Candidate, as_user_id: "${cand_a}" }
            - { call: "POST /api/cases/${case_a}/submit-dossier", as: Candidate, as_user_id: "${cand_a}", captures: { case_a_v8: $.data.version } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev A1", institution: "MIT", email: "ra1@mit.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_a1: $.data.id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev A2", institution: "CMU", email: "ra2@cmu.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_a2: $.data.id } }
            - { call: "POST /api/reviewers", payload: { full_name: "Rev A3", institution: "Stanford", email: "ra3@stanford.edu", expertise_area: "CS" }, as: ProvostOfficer, captures: { rev_a3: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_a}", reviewer_id: "${rev_a1}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_a_v8}" }, as: ProvostOfficer, captures: { inv_a1: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_a}", reviewer_id: "${rev_a2}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_a_v8} + 1" }, as: ProvostOfficer, captures: { inv_a2: $.data.id } }
            - { call: "POST /api/invitations", payload: { case_id: "${case_a}", reviewer_id: "${rev_a3}", review_window_start: "2026-08-10", review_window_end: "2026-09-10", is_arm_length: true, declared_coauthor: false, expected_case_version: "${case_a_v8} + 2" }, as: ProvostOfficer, captures: { inv_a3: $.data.id } }
            - { call: "POST /api/invitations/${inv_a1}/accept", as: ExternalReviewer, as_user_id: "${rev_a1}" }
            - { call: "POST /api/invitations/${inv_a1}/submit-letter", payload: { letter_text: "Strong." }, as: ExternalReviewer, as_user_id: "${rev_a1}" }
            - { call: "POST /api/invitations/${inv_a2}/accept", as: ExternalReviewer, as_user_id: "${rev_a2}" }
            - { call: "POST /api/invitations/${inv_a2}/submit-letter", payload: { letter_text: "Strong." }, as: ExternalReviewer, as_user_id: "${rev_a2}" }
