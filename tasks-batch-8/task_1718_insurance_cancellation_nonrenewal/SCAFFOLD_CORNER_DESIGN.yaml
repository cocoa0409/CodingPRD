            - call: "POST /carrier/reinstatement-requests"
              payload: { policy_id: "${pol_mi}", cancellation_case_id: "${case_mi}", expected_policy_version: "${pol_mi_v_stale} - 1" }
              as: Policyholder
              as_user_id: "${ph_mi}"
              captures: { err_mi: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION with http 412 (expression ${pol_mi_v_stale} - 1 is deliberately behind the current Policy.version)"
            - "No ReinstatementRequest created: GET /carrier/reinstatement-requests?policy_id=${pol_mi} returns empty list"

