      - name: every_collection_has_its_own_not_found_error_id
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRACTICE_GROUP_NOT_FOUND]
          - errors[ERR_CANDIDATE_NOT_FOUND]
          - errors[ERR_CLIENT_BOOK_ENTRY_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_VOTE_NOT_FOUND]
          - errors[ERR_PERFORMANCE_REVIEW_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          §1.6 declares SIXTEEN distinct 404 identifiers, one per addressable collection,
          and a shared ERR_NOT_FOUND shortcut would satisfy every other test in the suite
          while silently collapsing all sixteen. Sixteen reads of a well-formed but
          unallocated UUID against the sixteen singular GET routes is the only probe that
          can separate them. All sixteen run as SystemAdmin, so the auth rungs cannot
          interfere, and no fixture rows exist at all — which also proves the 404 is decided
          before any tenant or ownership logic.
        test_recipe:
          setup:
            - "No fixture rows are required: the store is empty for every entity."
