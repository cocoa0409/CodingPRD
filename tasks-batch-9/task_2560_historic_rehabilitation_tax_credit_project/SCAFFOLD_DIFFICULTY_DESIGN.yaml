              captures: { c_in_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 3000000, incurred_date: "2026-09-01", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c_start_id: $.data.id }
          assert:
            - "Project.${proj_id}.measuring_period_end_date == 2028-09-01"
            - "first call: HTTP status == 422 and data.error_id == ERR_OUTSIDE_MEASURING_PERIOD"
            - "second call: HTTP status == 201 and CostLineItem.${c_in_id}.in_measuring_period == true"
