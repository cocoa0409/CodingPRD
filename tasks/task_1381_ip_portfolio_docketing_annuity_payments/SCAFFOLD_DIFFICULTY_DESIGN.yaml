  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_windows_half_open_adjacency
        grounds:
          - validations[priority=13]
          - calculations.docket_audit_variance
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the Application audit timeline:
          [2026-08-01, 2026-08-10) then [2026-08-10, 2026-08-12) touch at the
          endpoint and are BOTH accepted (adjacency allowed), while
          [2026-08-09, 2026-08-11) is rejected for intersecting both.
        test_recipe:
          setup:
            - "US rule; client; family; one PENDING application with no docket entries (so empty register snapshots yield no variances)"
            - "Audit A1 [2026-08-01, 2026-08-10) created (OPEN)"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "AudCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "AF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-A", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/audits"
              payload: { window_start: "2026-08-01", window_end: "2026-08-10", register_entries: [] }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { a1_id: $.data.id, a1_st: $.data.status }

          trigger:
            - call: "POST /applications/${app_id}/audits"
              payload: { window_start: "2026-08-10", window_end: "2026-08-12", register_entries: [] }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { a2_id: $.data.id }

            - call: "POST /applications/${app_id}/audits"
              payload: { window_start: "2026-08-09", window_end: "2026-08-11", register_entries: [] }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_ov: $.data.error_id }

          assert:
            - "a1_st == OPEN"
            - "a2_id is a created audit id (201; adjacency at window_start == prior window_end is allowed under half-open semantics)"
            - "err_ov == ERR_AUDIT_WINDOW_OVERLAP"

      - name: instruction_exclusivity_closed_interval_touching_conflicts
        grounds:
          - validations[priority=14]
          - errors[ERR_INSTRUCTION_EXCLUSIVE_CONFLICT]
        distinguishing_aspect: |
          Closed-interval semantics on the application+instruction_type
          channel (different resource than the audit timeline): with clock at
          2026-08-02 instruction I1 (FILING, due 2026-08-20) occupies the
          closed window [2026-08-02, 2026-08-20]; a new FILING instruction
          created on 2026-08-20 (new window start touches I1's due_date) is
          REJECTED — the exact adjacency the audit rule permits — while a
          same-window instruction of a different type is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-02; US-accredited firm; PENDING app; I1 (FILING, due 2026-08-20) created and non-terminal (DRAFT suffices for occupancy)"
            - "Clock advanced to 2026-08-20 for the trigger calls"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "InsCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /counsel-firms"
              payload: { display_name: "Firm US", accredited_jurisdictions: ["US"] }
              as: PlatformAdmin
              captures: { firm_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "IF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-I", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/instructions"
              payload: { counsel_firm_id: "${firm_id}", instruction_type: "FILING", due_date: "2026-08-20" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { i1_id: $.data.id }

            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_id}/instructions"
              payload: { counsel_firm_id: "${firm_id}", instruction_type: "FILING", due_date: "2026-08-25" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_touch: $.data.error_id }

            - call: "POST /applications/${app_id}/instructions"
              payload: { counsel_firm_id: "${firm_id}", instruction_type: "OA_RESPONSE", due_date: "2026-08-25" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { i3_id: $.data.id }

          assert:
            - "err_touch == ERR_INSTRUCTION_EXCLUSIVE_CONFLICT (closed window: new created date 2026-08-20 == I1 due_date 2026-08-20 conflicts)"
            - "i3_id is a created instruction id (different instruction_type partitions the channel)"

  - rule_id: compensating_invariant
    instances:
      - name: authorize_deauthorize_conserves_committed_money
        grounds:
          - calculations.committed_forecast_rollup
          - state_machines.AnnuityObligation.AUTHORIZED_to_SCHEDULED
          - state_machines.PaymentAuthorization.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity: family committed money (USD cents). The forward
          action (approve: +10000) paired with its compensating action
          (deauthorize: -10000) leaves committed_forecast_cents exactly at its
          pre-pair value 0, the obligation back at SCHEDULED with
          authorized_amount_cents null, and the authorization SUPERSEDED —
          zero drift.
        test_recipe:
          setup:
            - "US rule; family cap 1000000, committed 0; GRANTED app; y3 obligation SCHEDULED (est 10000)"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "InvCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C Approve", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "IF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id, fam_c0: $.data.committed_forecast_cents }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-IV", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { ob_id: "$.data[0].id" }

            - call: "GET /annuity-obligations/${ob_id}"
              as: Any
              captures: { ob_v: $.data.version }

          trigger:
            - call: "POST /annuity-obligations/${ob_id}/authorizations"
              payload: { amount_cents: 10000, expected_annuity_obligation_version: "${ob_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_id: $.data.id }

            - call: "POST /authorizations/${au_id}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
            - call: "GET /families/${fam_id}"
              as: Any
              captures: { fam_c1: $.data.committed_forecast_cents }

            - call: "POST /annuity-obligations/${ob_id}/deauthorize"
              payload: {}
              as: DocketingManager
              as_user_id: mgr-1
              captures: { ob_st_end: $.data.status, ob_amt_end: $.data.authorized_amount_cents }

            - call: "GET /families/${fam_id}"
              as: Any
              captures: { fam_c2: $.data.committed_forecast_cents }

            - call: "GET /authorizations/${au_id}"
              as: Any
              captures: { au_st_end: $.data.status }

          assert:
            - "fam_c0 == 0"
            - "fam_c1 == 10000"
            - "fam_c2 == fam_c1 - 10000 == 0 (invariant: committed restored exactly)"
            - "ob_st_end == SCHEDULED"
            - "ob_amt_end == null"
            - "au_st_end == SUPERSEDED"

      - name: docket_entry_create_cancel_conserves_open_count
        grounds:
          - entities.Application.fields.open_docket_count
          - state_machines.DocketEntry.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: integer count of open docket items (different
          quantity type than committed money above). Creating an entry (+1)
          paired with cancelling it (-1) leaves
          Application.open_docket_count exactly at its pre-pair value 0.
        test_recipe:
          setup:
            - "US rule; client; family; PENDING application with open_docket_count 0"
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "CntCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "CF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-CT", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id, open0: $.data.open_docket_count }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
          trigger:
            - call: "POST /applications/${app_id}/docket-entries"
              payload: { entry_type: "RECORDATION", title: "Track recordation", base_due_date: "2026-09-01" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { en_id: $.data.id }

            - call: "GET /applications/${app_id}"
              as: Any
              captures: { open1: $.data.open_docket_count }

            - call: "POST /docket-entries/${en_id}/cancel"
              payload: {}
              as: DocketingManager
              as_user_id: mgr-1
            - call: "GET /applications/${app_id}"
              as: Any
              captures: { open2: $.data.open_docket_count }

          assert:
            - "open0 == 0"
            - "open1 == 1"
            - "open2 == 0 (invariant: open_docket_count restored exactly)"
            - "DocketEntry.${en_id}.status == CANCELLED"
