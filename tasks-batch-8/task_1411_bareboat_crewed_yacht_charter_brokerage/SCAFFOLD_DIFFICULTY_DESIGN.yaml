# =============================================================================
# §1.8 Scaffold Difficulty Design — yacht-charter-brokerage
# 9 Difficulty Rules x >=2 instances each (21 instances total).
# All fixtures assume the logical clock default 2026-08-01T00:00:00Z unless a
# recipe explicitly calls /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_pro_rata_vs_weekly_plus_daily
        grounds:
          - calculations.charter_fee_quote
          - entities.Yacht.fields.pricing_mode
          - entities.CharterRequest.fields.quoted_charter_fee_cents
        distinguishing_aspect: |
          Same weekly rate (700000) and same 10-day window quoted on two yachts
          yields different fees purely from pricing_mode: PRO_RATA gives
          700000*10/7 = 1000000, WEEKLY_PLUS_DAILY gives 700000 + 3*round(700000/6)
          = 1050001. Entity domain: Yacht/CharterRequest pricing.
        test_recipe:
          setup:
            - "Operator ACTIVE; central agent broker; client QUALIFIED (OFFSHORE)"
            - "Yacht A: PRO_RATA, weekly 700000, capacity 8, min 3, resume COASTAL, deposit 500000, LISTED"
            - "Yacht B: WEEKLY_PLUS_DAILY, weekly 700000, capacity 6, min 3, resume COASTAL, deposit 400000, LISTED"
            - "One DRAFT+SUBMITTED request per yacht, both 2026-10-01..2026-10-11 (10 days)"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /yachts", payload: { name: "Yacht B", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 6, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 400000, pricing_mode: WEEKLY_PLUS_DAILY, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { yb_id: $.data.id } }
            - { call: "POST /yachts/${yb_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rqa_id: $.data.id } }
            - { call: "POST /charter-requests/${rqa_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${yb_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rqb_id: $.data.id } }
            - { call: "POST /charter-requests/${rqb_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
          trigger:
            - { call: "POST /charter-requests/${rqa_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { fee_a: $.data.quoted_charter_fee_cents } }
            - { call: "POST /charter-requests/${rqb_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { fee_b: $.data.quoted_charter_fee_cents } }
          assert:
            - "CharterRequest.${rqa_id}.quoted_charter_fee_cents == 1000000 (PRO_RATA: 700000*10/7)"
            - "CharterRequest.${rqb_id}.quoted_charter_fee_cents == 1050001 (WEEKLY_PLUS_DAILY: 700000 + 3*round_half_up(700000/6)=700000+3*116667)"
            - "fee_a != fee_b although weekly rate and dates are identical"

      - name: apa_provisional_vs_final_position
        grounds:
          - calculations.apa_position
          - entities.ExpenseEntry.fields.status
        distinguishing_aspect: |
          Same ExpenseEntry set, two variants: PROVISIONAL counts PENDING+APPROVED
          (165000) while FINAL counts APPROVED only (120000); DISPUTED is excluded
          from both. Entity domain: ExpenseEntry/EscrowAccount APA accounting —
          different domain from quote pricing.
        test_recipe:
          setup:
            - "Fully funded agreement (fee 1000000, deposit 500000, apa_pct 0.30 -> apa_amount 300000), status IN_PREP"
            - "Expenses: e1 APA 120000 APPROVED; e2 APA 45000 PENDING; e3 APA 30000 APPROVED then DISPUTED"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-11-02", end_date: "2026-11-12", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 1000000, valid_from: "2026-10-01", valid_until: "2026-12-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}" }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1000000 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: FINAL, amount_cents: 800000 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/start-prep", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-agreements/${ag_id}/expenses", payload: { bucket: APA, description: "provisioning", amount_cents: 120000 }, as: Operator, as_user_id: "${op_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /expenses/${e1_id}/review", payload: { outcome: APPROVED }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/expenses", payload: { bucket: APA, description: "fuel estimate", amount_cents: 45000 }, as: Operator, as_user_id: "${op_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/expenses", payload: { bucket: APA, description: "mooring", amount_cents: 30000 }, as: Operator, as_user_id: "${op_id}", captures: { e3_id: $.data.id } }
            - { call: "POST /expenses/${e3_id}/review", payload: { outcome: APPROVED }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /expenses/${e3_id}/dispute", payload: {}, as: Client, as_user_id: "${cl_id}" }
          trigger:
            - { call: "GET /charter-agreements/${ag_id}/apa-position", payload: {}, as: Client, as_user_id: "${cl_id}" }
          assert:
            - "apa-position.held_apa_cents == 300000"
            - "apa-position.provisional_apa_committed_cents == 165000 (120000 APPROVED + 45000 PENDING; 30000 DISPUTED excluded)"
            - "apa-position.final_apa_spent_cents == 120000 (APPROVED only)"
            - "apa-position.projected_apa_return_cents == 135000"
            - "apa-position.final_apa_return_cents == 180000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_penalty_tier_and_retained_cap
        grounds:
          - calculations.cancellation_penalty
          - state_machines.CharterAgreement.SIGNED_to_CANCELLED
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (days_before_start, charter_fee,
          held buckets) with tiered branch selection and a nested min() cap —
          here the 30-day tier gives penalty 1000000 but only the SIGNING tranche
          was funded (held charter fee 1000000), so retained = min(1000000,
          1000000) = 1000000 engages the cap at exact equality.
        test_recipe:
          setup:
            - "Agreement on Yacht A, 2026-10-30..2026-11-19 (20 days, fee 2000000, apa 500000, deposit 500000), SIGNED"
            - "Only SIGNING tranche funded (1500000 = 1000000 fee + 500000 deposit); funds_status DEPOSIT_HELD"
            - "logical clock at 2026-09-30 -> days_before_start == 30 -> tier 0.50"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 2000000, valid_from: "2026-10-01", valid_until: "2026-12-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}" }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1500000 }, as: Client, as_user_id: "${cl_id}", captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /charter-agreements/${ag_id}/cancel", payload: { reason: "client change of plans" }, as: Client, as_user_id: "${cl_id}", captures: { pen: $.data.cancellation_penalty_cents } }
          assert:
            - "CharterAgreement.${ag_id}.days_before_start == 30"
            - "CharterAgreement.${ag_id}.cancellation_penalty_cents == 1000000 (tier 0.50 x 2000000)"
            - "retained == min(1000000, held_charter_fee 1000000) == 1000000 (cap engages at equality)"
            - "EscrowAccount.${esc_id}.total_funded_cents == 1500000 and total_released_cents == 1500000; all held_* buckets == 0"
            - "movements: RELEASE_TO_OPERATOR/CHARTER_FEE 800000; RELEASE_TO_CENTRAL_AGENT/CHARTER_FEE 100000; RELEASE_TO_RETAIL_BROKER/CHARTER_FEE 100000; REFUND_TO_CLIENT/DEPOSIT 500000; no CHARTER_FEE refund"
            - "CommissionStatement basis == CANCELLATION_PENALTY, basis_amount_cents == 1000000, commission_total_cents == 200000, retail_share_cents == 100000, central_share_cents == 100000"

      - name: commission_split_rounding_residual
        grounds:
          - calculations.commission_settlement
          - entities.CommissionStatement.fields.central_share_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: order is pinned total -> retail -> residual.
          fee 666673 x 15% = 100000.95 rounds to 100001; retail share
          round_half_up(100001 x 0.5) = 50001; central is the residual 50000 —
          independently rounding central (round(100001 x 0.5) = 50001) would
          break conservation (50001+50001 != 100001).
        test_recipe:
          setup:
            - "Agreement on Yacht B (WEEKLY_PLUS_DAILY, deposit 400000), dates 2026-10-01..2026-10-11, fee overridden to 666673 at offer"
            - "SIGNED, FULLY_FUNDED (SIGNING 733337; FINAL 533338), IN_PREP, one APA expense 150000 APPROVED, one APA expense 7777 PENDING"
            - "logical clock 2026-10-11 (>= end_date)"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht B", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 6, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 400000, pricing_mode: WEEKLY_PLUS_DAILY, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { yb_id: $.data.id } }
            - { call: "POST /yachts/${yb_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${yb_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: { quoted_charter_fee_cents: 666673 }, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 700000, valid_from: "2026-09-01", valid_until: "2026-11-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}" }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 733337 }, as: Client, as_user_id: "${cl_id}", captures: { esc_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: FINAL, amount_cents: 533338 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/start-prep", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-agreements/${ag_id}/expenses", payload: { bucket: APA, description: "provisioning", amount_cents: 150000 }, as: Operator, as_user_id: "${op_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /expenses/${e1_id}/review", payload: { outcome: APPROVED }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/expenses", payload: { bucket: APA, description: "late fuel", amount_cents: 7777 }, as: Operator, as_user_id: "${op_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/embark", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-11T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /charter-agreements/${ag_id}/complete", payload: {}, as: Operator, as_user_id: "${op_id}" }
          assert:
            - "CommissionStatement basis == CHARTER_FEE, basis_amount_cents == 666673, commission_total_cents == 100001"
            - "CommissionStatement.retail_share_cents == 50001 (round_half_up(100001 x 0.5))"
            - "CommissionStatement.central_share_cents == 50000 (residual: 100001 - 50001, NOT independently rounded 50001)"
            - "retail_share_cents + central_share_cents == commission_total_cents exactly"
            - "movements: RELEASE_TO_OPERATOR/CHARTER_FEE 566672; RELEASE_TO_OPERATOR/APA 150000; REFUND_TO_CLIENT/APA 50002; REFUND_TO_CLIENT/DEPOSIT 400000"
            - "ExpenseEntry.${e2_id}.status == REJECTED (auto-locked at settlement)"
            - "CharterAgreement.${ag_id}.status == COMPLETED and funds_status == SETTLED; EscrowAccount.${esc_id}.status == CLOSED"

      - name: funding_schedule_pinned_eval_order
        grounds:
          - calculations.escrow_funding_schedule
          - calculations.apa_pct_schedule
          - entities.CharterAgreement.fields.signing_due_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned: apa_pct is keyed on the
          fee tier, apa_amount derives from fee x apa_pct, and tranche amounts
          derive from apa_amount — with fee 666673 (< 2000000 threshold) the
          schedule must evaluate fee -> tier(0.30) -> apa 200002 -> signing
          733337 (odd cent lands in the signing half) -> final 533338.
        test_recipe:
          setup:
            - "Yacht B (deposit 400000); offer overrides fee to 666673 (odd on purpose); no apa_pct override"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht B", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 6, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 400000, pricing_mode: WEEKLY_PLUS_DAILY, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { yb_id: $.data.id } }
            - { call: "POST /yachts/${yb_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${yb_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: { quoted_charter_fee_cents: 666673 }, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
          trigger:
