              as: Underwriter
              captures: { dd_inv11_id: "$.data[0].id", dd_inv11_total: "$.data[0].total_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol11_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "gat-run-2", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_gat_err: $.data.error_id }
            - call: "POST /wc/invoices/${dd_inv11_id}/payments"
              payload: { amount_cents: "${dd_inv11_total}" }
              as: EmployerAdmin
              as_user_id: "${dd_emp11_id}"
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol11_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "gat-run-3", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_gat_status: $.data.status }
          assert:
            - "the submission while SUSPENDED fails with error_id ERR_BILLING_SUSPENDED (409) — the identical report body is gated purely by the parent policy's billing axis"
            - "after paying invoice ${dd_inv11_id} in full, Policy.${dd_pol11_id}.billing_status == CURRENT"
            - "the resubmitted identical report is ACCEPTED"

      - name: audit_verify_gated_by_invoice_payment_for_closure
        grounds:
          - state_machines.AuditReconciliation.VERIFIED_to_CLOSED
          - state_machines.PremiumInvoice.ISSUED_to_PAID
        distinguishing_aspect: |
          Entity pair AuditReconciliation -> PremiumInvoice (different pair than
          PayrollReport -> Policy): an audit stuck in VERIFIED auto-closes only
          when its trueup_invoice is PAID — while the invoice is ISSUED the
          audit stays VERIFIED even though every audit-side precondition is met.
        test_recipe:
          setup:
            - "Policy P2 fixture (variance scenario) with the audit FILED and VERIFIED and the AUDIT_TRUEUP invoice ISSUED but UNPAID."
          setup_api_calls:
            - *dd_ca_table
            - *dd_emp2
            - *dd_pol2
            - call: "POST /wc/policies/${dd_pol2_id}/bind"
              payload: {}
              as: Underwriter
            - *dd_rep_a
            - *dd_rep_b
            - *dd_q3
            - *dd_q3
            - *dd_audit
            - call: "GET /wc/policies/${dd_pol2_id}"
              as: TaxFiler
              captures: { dd_pol2_v3: $.data.version }
            - call: "POST /wc/audits/${dd_audit_id}/file"
              payload: { expected_policy_version: "${dd_pol2_v3}" }
              as: TaxFiler
              as_user_id: "tf-nina"
            - call: "POST /wc/audits/${dd_audit_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "au-sam"
            - call: "GET /wc/audits/${dd_audit_id}"
              as: Auditor
              captures: { dd_trueup2_id: $.data.trueup_invoice_id, dd_audit2_status: $.data.status }
            - call: "GET /wc/invoices/${dd_trueup2_id}"
              as: Auditor
              captures: { dd_trueup2_total: $.data.total_cents }
          trigger:
            - call: "GET /wc/audits/${dd_audit_id}"
              as: Auditor
              captures: { dd_audit_pre_pay: $.data.status }
            - call: "POST /wc/invoices/${dd_trueup2_id}/payments"
              payload: { amount_cents: "${dd_trueup2_total}" }
              as: EmployerAdmin
              as_user_id: "${dd_emp2_id}"
            - call: "GET /wc/audits/${dd_audit_id}"
              as: Auditor
              captures: { dd_audit_post_pay: $.data.status }
          assert:
            - "before payment the audit status == VERIFIED (closure precondition not met — cross-entity gate on the invoice)"
            - "after the true-up payment the audit status == CLOSED without any direct call on the audit"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: payroll_report_half_open_overlap_detection
        grounds:
          - validations.priority-10
          - errors.ERR_PAYROLL_PERIOD_OVERLAP
        distinguishing_aspect: |
          Interval semantics: strict half-open pairwise overlap — the resource
          is the Policy's payroll coverage timeline and ANY positive-duration
          intersection with an existing SUBMITTED/ACCEPTED report is rejected,
          while touching endpoints are allowed. Distinct from the rating-table
          instance which adds a per-state grouping dimension.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P12 (CA only, class CA/8810) bound; report [09-01, 09-15) ACCEPTED."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp12
              call: "POST /wc/employers"
              payload: { legal_name: "Overlap Outfitters", fein: "44-1111222", contact_email: "pr@overlap.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp12_id: $.data.id }
            - &dd_pol12
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp12_id}", policy_number: "WC-OVL-012", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol12_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol12_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol12_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "ovl-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol12_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-22T00:00:00Z", idempotency_key: "ovl-run-2", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_ovl2_status: $.data.status, dd_ovl2_fail: $.data.failure_code }
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol12_id}", period_start: "2026-09-15T00:00:00Z", period_end: "2026-09-22T00:00:00Z", idempotency_key: "ovl-run-3", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_ovl3_status: $.data.status }
          assert:
            - "the straddling report [09-08, 09-22) is REJECTED with failure_code ERR_PAYROLL_PERIOD_OVERLAP (intersects [09-01, 09-15) by 7 days)"
            - "the touching report [09-15, 09-22) is ACCEPTED (empty intersection at the boundary instant)"

      - name: rating_table_same_state_overlap_but_cross_state_free
        grounds:
          - validations.priority-11
          - errors.ERR_RATING_TABLE_OVERLAP
        distinguishing_aspect: |
          Different resource AND different interval semantics: the resource is
          the (state, effective-window) rating space — overlap is checked ONLY
          among tables of the SAME state (grouped dimension), so an NV table
          may freely overlap a CA window, and an adjacent CA table touching at
          effective_from == prior effective_to is allowed, while an interior
          collision on the same state is rejected. Payroll reports have no such
          grouping dimension.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table [2026-01-01, 2027-01-01) exists (common fixture)."
          setup_api_calls:
            - *dd_ca_table
          trigger:
            - call: "POST /wc/state-rating-tables"
              payload: { state_code: "NV", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 400, expense_constant_cents: 45000, min_payroll_threshold_cents: 0, state_minimum_premium_cents: 1, ot_basis: "GROSS", class_rates: [{class_code: "8810", rate_per_100_cents: 140}], max_payroll_per_executive_cents: 200000 }
              as: PlatformAdmin
              captures: { dd_nv_overlap_id: $.data.id }
            - call: "POST /wc/state-rating-tables"
              payload: { state_code: "CA", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 250, expense_constant_cents: 30000, min_payroll_threshold_cents: 10000, state_minimum_premium_cents: 50000, ot_basis: "NET", class_rates: [{class_code: "8810", rate_per_100_cents: 125}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
              captures: { dd_ca_overlap_err: $.data.error_id }
            - call: "POST /wc/state-rating-tables"
              payload: { state_code: "CA", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 260, expense_constant_cents: 31000, min_payroll_threshold_cents: 10000, state_minimum_premium_cents: 50000, ot_basis: "NET", class_rates: [{class_code: "8810", rate_per_100_cents: 130}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
              captures: { dd_ca_next_id: $.data.id }
          assert:
            - "the NV table fully overlapping CA's window succeeds 201 (different state group — no collision)"
            - "the CA table overlapping [2026-01-01, 2027-01-01) fails 409 with error_id ERR_RATING_TABLE_OVERLAP"
            - "the adjacent CA table starting exactly at 2027-01-01 (prior effective_to) succeeds 201 (half-open: touching allowed)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: retro_reassignment_preserves_invoice_identity_multiset
        grounds:
          - calculations.retro_adjustment_delta
          - state_machines.PayrollReport.ACCEPTED_to_SUPERSEDED
          - state_machines.PremiumInvoice.ISSUED_to_VOID
        distinguishing_aspect: |
          Conserved quantity — billed ledger integrity: for every report
          re-invoiced through the retro cascade, exactly one original invoice is
          VOID and exactly one replacement PAYROLL invoice is ISSUED (identity
          multiset conserved at count 1 non-void per report), AND
          billed_after - billed_before equals the replacement total
          plus the adjustment minus the voided original (109000 == 95000 +
          14000; the adjustment 14000 is exactly the void/replace delta
          95000 - 81000, never more).
        test_recipe:
          setup:
            - "Cascade Ceramics fixture: policy P6 bound, report [09-01, 09-08) ACCEPTED with original invoice 81000, dispute D6 in UNDER_REVIEW."
          setup_api_calls:
            - *dd_ca_table
            - *dd_emp6
            - *dd_pol6
            - call: "POST /wc/policies/${dd_pol6_id}/bind"
              payload: {}
              as: Underwriter
            - *dd_rep6
            - call: "GET /wc/policies/${dd_pol6_id}/invoices"
              as: Underwriter
              captures: { dd_orig_inv_id: "$.data[0].id", dd_orig_inv_total: "$.data[0].total_cents" }
            - call: "GET /wc/policies/${dd_pol6_id}"
              as: Underwriter
              captures: { dd_billed_before: $.data.cumulative_billed_cents }
            - call: "GET /wc/policies/${dd_pol6_id}/class-codes"
              as: Underwriter
              captures: { dd_pcc6b_id: "$.data[0].id" }
            - call: "POST /wc/disputes"
              payload: { policy_id: "${dd_pol6_id}", policy_class_code_id: "${dd_pcc6b_id}", requested_class_code: "8812", effective_from: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${dd_emp6_id}"
              captures: { dd_dispute6b_id: $.data.id }
            - call: "POST /wc/disputes/${dd_dispute6b_id}/open-review"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${dd_pol6_id}"
              as: Underwriter
              captures: { dd_pol6b_v: $.data.version }
          trigger:
            - call: "POST /wc/disputes/${dd_dispute6b_id}/decide"
              payload: { decision: "APPROVED", expected_policy_version: "${dd_pol6b_v}" }
              as: Underwriter
              as_user_id: "uw-lee"
            - call: "GET /wc/policies/${dd_pol6_id}"
              as: Underwriter
              captures: { dd_billed_after: $.data.cumulative_billed_cents }
            - call: "GET /wc/policies/${dd_pol6_id}/invoices"
              as: Underwriter
          assert:
            - "original invoice ${dd_orig_inv_id} status == VOID"
            - "exactly one non-VOID PAYROLL invoice remains for the report (replacement, total 95000) plus one RETRO_ADJUSTMENT of 14000"
            - "billed_before == 81000 and billed_after == 109000; the invariant holds exactly: 109000 == (81000 - 81000 original voided) + 95000 replacement + 14000 adjustment, and the adjustment 14000 == 95000 - 81000 (the void/replace delta) with zero drift"

      - name: payment_conserves_collected_total_and_billing_axis
        grounds:
          - state_machines.PremiumInvoice.ISSUED_to_PAID
          - state_machines.Policy.billing_status
          - entities.Policy.fields.cumulative_collected_cents
        distinguishing_aspect: |
          Conserved quantity — money collected: the compensating pair is
          (invoice issued -> invoice paid). cumulative_collected_cents changes
          by exactly the invoice total (pinned: 155250) and no other money
          field moves; the billing axis returns to CURRENT only because the
          ISSUED-invoice count returned to zero — an exact full-payment
          requirement (ERR_PAYMENT_AMOUNT_MISMATCH otherwise) keeps the ledger
          conserved.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P13 (CA only, class CA/8810, mod 1.0) bound; one report accepted -> invoice 155250 ISSUED; clock advanced to 09-10 -> billing OVERDUE."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp13
              call: "POST /wc/employers"
              payload: { legal_name: "Conserved Cabinets", fein: "55-1212343", contact_email: "treasury@conserved.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp13_id: $.data.id }
            - &dd_pol13
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp13_id}", policy_number: "WC-CSV-013", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol13_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol13_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol13_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "csv-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
            - call: "GET /wc/policies/${dd_pol13_id}/invoices"
              as: Underwriter
              captures: { dd_inv13_id: "$.data[0].id", dd_inv13_total: "$.data[0].total_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wc/policies/${dd_pol13_id}"
              as: Underwriter
              captures: { dd_collected_before: $.data.cumulative_collected_cents }
          trigger:
            - call: "POST /wc/invoices/${dd_inv13_id}/payments"
              payload: { amount_cents: "${dd_inv13_total}" }
              as: EmployerAdmin
              as_user_id: "${dd_emp13_id}"
            - call: "GET /wc/policies/${dd_pol13_id}"
              as: Underwriter
              captures: { dd_collected_after: $.data.cumulative_collected_cents, dd_billing_after: $.data.billing_status }
          assert:
            - "invoice ${dd_inv13_id}.total_cents == 155250 (125000 + 250 + 30000)"
            - "collected_before == 0 and collected_after == 155250 — the pair (ISSUED -> PAID) moves collected by exactly the invoice total"
            - "billing_after == CURRENT (compensating action restores the axis)"
            - "cumulative_billed_cents remains 155250 — billing was not double-counted by the payment"
