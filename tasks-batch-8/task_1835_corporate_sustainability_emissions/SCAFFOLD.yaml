scenario: |
  1835. Corporate Sustainability & Emissions Reporting (corporate sustainability office): activity data collection (energy/fuel/travel) by site, emission factor library & scope 1/2/3 calculation, target setting & trajectory tracking, supplier engagement for scope 3 data, assurance readiness & evidence retention, framework/questionnaire response (CDP-style) management, renewable procurement & instrument retirement linkage, disclosure review & controls

domain_name: corporate-sustainability-emissions
api_prefix: /sustainability

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # assurance readiness, evidence retention, disclosure controls, segregation of duties
  secondary_archetype: workflow_orchestration # reporting-cycle pipeline gating child workflows
  complexity_layers:
    - optimistic_concurrency                  # OCC on ReportingCycle.version (inventory recalc) and EmissionTarget.version (baseline recalc)
    - cascading_side_effects                  # record approval / instrument retirement -> inventory STALE -> target NOT_EVALUATED -> questionnaire stale
    - dual_variant_calculation                # scope 2 location-vs-market; scope 3 supplier-specific-vs-spend-based
    - version_pinning_on_approval             # ActivityRecord.factor_value_snapshot pinned at approval; cycle.pinned_library_version pinned at LOCKED
  entity_topology: hybrid                     # flat peer collections + cross-aggregate FKs + one self-referential FK (EvidenceItem.superseded_by_id)
  state_machine_shape: cyclic                 # ReportingCycle reopen loop, SupplierEngagement revision loop, QuestionnaireResponse review loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties           # submitter != approver; uploader != verifier; preparer != reviewer
  consistency_model: immediate                # every mutation + its cascades are atomic in the request

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ReportingCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cycle label, e.g. FY2026" }
      - { name: reporting_year, type: integer, source: input, description: "Calendar year the cycle reports on, e.g. 2026" }
      - { name: status, type: enum, source: system, description: "DRAFT | DATA_COLLECTION | UNDER_REVIEW | LOCKED | UNDER_ASSURANCE | ASSURED | DISCLOSED" }
      - { name: readiness_pct, type: number, source: computed, default: 0.0, description: "Share of APPROVED-record quantity covered by >=1 VERIFIED evidence, per calculation assurance_readiness_pct" }
      - { name: pinned_library_version, type: integer, source: system, description: "Null until LOCKED; at LOCKED set to max library_version across PUBLISHED EmissionFactors; retained for audit after reopen" }
      - { name: assurance_statement, type: string, source: input, description: "Attestation text supplied on the ASSURED transition; null beforehand" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: country_code, type: string, source: input, description: "ISO country code, e.g. US" }
      - { name: grid_region_code, type: string, source: input, description: "Grid region key used to resolve SCOPE2_GRID / SCOPE2_RESIDUAL_MIX factors, e.g. CA" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED" }

  - name: EmissionFactor
    parent: null
    common_fields: true
    fields:
      - { name: scope_category, type: enum, source: input, description: "SCOPE1_STATIONARY | SCOPE2_GRID | SCOPE2_RESIDUAL_MIX | SCOPE3_TRAVEL | SCOPE3_EEIO_SPEND" }
      - { name: region_code, type: string, source: input, description: "Region key the factor applies to, e.g. CA or GLOBAL" }
      - { name: unit, type: string, source: input, description: "Activity unit the factor prices, e.g. MWh | therm | passenger_km | USD" }
      - { name: value_tco2e_per_unit, type: number, source: input, description: "Emission factor value in tCO2e per unit" }
      - { name: library_version, type: integer, source: input, description: "Publication batch number of the factor library this entry belongs to" }
      - { name: valid_from, type: datetime, source: input, description: "Start of validity window (CLOSED interval start, inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "End of validity window (CLOSED interval end, inclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED" }

  - name: ActivityRecord
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ReportingCycle.id; the cycle this activity belongs to" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; the site where the activity occurred" }
      - { name: factor_id, type: string, source: input, description: "FK -> EmissionFactor.id; the emission factor selected for this record" }
      - { name: activity_type, type: enum, source: input, description: "ELECTRICITY | STATIONARY_FUEL | BUSINESS_TRAVEL" }
      - { name: quantity, type: number, source: input, description: "Activity quantity in `unit`; must be > 0" }
      - { name: unit, type: string, source: input, description: "Unit of measure; must equal the referenced factor's unit" }
      - { name: period_start, type: datetime, source: input, description: "Activity period start (HALF-OPEN interval start, inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Activity period end (HALF-OPEN interval end, exclusive)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | VOIDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creator; recorded at creation" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the latest approve/reject actor; null until decided" }
      - { name: reject_reason, type: string, source: input, description: "Reason text required on REJECTED; null otherwise" }
      - { name: factor_value_snapshot, type: number, source: computed, description: "EmissionFactor.value_tco2e_per_unit captured at APPROVED; immutable afterwards (version-pinning on approval)" }
      - { name: tco2e, type: number, source: computed, description: "round_half_up(quantity * factor_value_snapshot, 4); null until APPROVED" }

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - { name: activity_record_id, type: string, source: input, description: "FK -> ActivityRecord.id; the record this evidence supports" }
      - { name: supersedes_evidence_id, type: string, source: input, description: "FK -> EvidenceItem.id; optional earlier evidence on the same record that this upload supersedes" }
      - { name: file_name, type: string, source: input, description: "Original file name" }
      - { name: sha256_hex, type: string, source: input, description: "64-char lowercase hex digest of the evidence payload" }
      - { name: status, type: enum, source: system, description: "UPLOADED | VERIFIED | REJECTED | SUPERSEDED" }
      - { name: uploaded_by_user_id, type: string, source: system, description: "X-User-ID of the uploader; recorded at creation" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifier; null until VERIFIED" }
      - { name: retention_until, type: datetime, source: computed, description: "Evidence retention deadline = parent cycle's reporting_year-12-31T23:59:59Z + 7 years, fixed at creation" }

  - name: InventoryResult
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ReportingCycle.id; singleton per cycle (exactly one row per cycle, created with the cycle)" }
      - { name: status, type: enum, source: system, description: "STALE | CURRENT | FROZEN" }
      - { name: scope1_tco2e, type: number, source: computed, default: 0.0, description: "Sum of APPROVED STATIONARY_FUEL record tco2e, rounded per inventory_aggregation" }
      - { name: scope2_location_tco2e, type: number, source: computed, default: 0.0, description: "Sum of APPROVED ELECTRICITY record tco2e (grid factors), rounded per inventory_aggregation" }
      - { name: scope2_market_tco2e, type: number, source: computed, default: 0.0, description: "Market-based scope 2 per calculation market_based_scope2 (instrument allocation + residual mix fallback)" }
      - { name: scope3_tco2e, type: number, source: computed, default: 0.0, description: "Final scope 3: APPROVED BUSINESS_TRAVEL records + ACCEPTED engagements at supplier_tco2e + all other engagements spend-based" }
      - { name: scope3_provisional_tco2e, type: number, source: computed, default: 0.0, description: "Provisional scope 3 variant: APPROVED BUSINESS_TRAVEL records + ALL engagements spend-based" }
      - { name: total_tco2e, type: number, source: computed, default: 0.0, description: "scope1_tco2e + scope2_market_tco2e + scope3_tco2e" }
      - { name: computed_at, type: datetime, source: system, description: "Logical clock timestamp of the last successful recalculation; null until first recalc" }

  - name: SupplierEngagement
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ReportingCycle.id; the cycle this scope-3 engagement feeds" }
      - { name: supplier_name, type: string, source: input, description: "Supplier legal name" }
      - { name: category, type: enum, source: input, description: "PURCHASED_GOODS | CAPITAL_GOODS | UPSTREAM_TRANSPORT" }
      - { name: spend_usd, type: number, source: input, description: "Annual spend with this supplier in USD; must be >= 0" }
      - { name: contact_user_id, type: string, source: input, description: "X-User-ID of the SupplierContact permitted to respond" }
      - { name: due_date, type: datetime, source: input, description: "Response deadline; clock advance past it auto-closes the engagement" }
      - { name: status, type: enum, source: system, description: "INVITED | RESPONDED | NEEDS_REVISION | ACCEPTED | CLOSED_NO_DATA" }
      - { name: round, type: integer, source: system, default: 1, description: "Negotiation round; starts at 1, +1 on every REINVITE" }
      - { name: supplier_tco2e, type: number, source: input, description: "Supplier-provided emissions figure in tCO2e (2dp), supplied on respond; null until first RESPONDED" }
      - { name: responded_at, type: datetime, source: system, description: "Logical clock timestamp of the latest respond; null until first RESPONDED" }

  - name: EmissionTarget
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Target name, e.g. 50-by-2030" }
      - { name: base_year, type: integer, source: input, description: "Baseline calendar year, e.g. 2025" }
      - { name: target_year, type: integer, source: input, description: "Year by which the reduction must be achieved, e.g. 2030" }
      - { name: reduction_pct, type: number, source: input, description: "Intended reduction vs baseline, 0 < reduction_pct < 100" }
      - { name: scope_coverage, type: enum, source: input, description: "SCOPE1_2 | SCOPE1_2_3" }
      - { name: base_year_total_tco2e, type: number, source: input, description: "Provisional baseline total in tCO2e; replaced by recalculate-baseline" }
      - { name: baseline_source, type: enum, source: system, description: "PROVISIONAL | RECALCULATED" }
      - { name: baseline_shift_pct, type: number, source: computed, description: "|new - old| / old * 100 recorded at the latest recalculate-baseline; null until first recalc" }
      - { name: baseline_shift_significant, type: boolean, source: computed, description: "True iff baseline_shift_pct >= 5.0; null until first recalc" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | ACTIVE | ACHIEVED | MISSED | RETIRED" }
      - { name: trajectory_status, type: enum, source: computed, description: "ON_TRACK | OFF_TRACK | NOT_EVALUATED; re-evaluated on every inventory recalculation; NOT_EVALUATED whenever the watched cycle's inventory is STALE" }

  - name: RenewableInstrument
    parent: null
    common_fields: true
    fields:
      - { name: registry, type: string, source: input, description: "Issuing registry, e.g. M-RETS" }
      - { name: serial_number, type: string, source: input, description: "Registry serial; unique together with registry" }
      - { name: technology, type: enum, source: input, description: "SOLAR | WIND | HYDRO" }
      - { name: vintage_year, type: integer, source: input, description: "Generation year of the underlying MWh" }
      - { name: quantity_mwh, type: number, source: input, description: "Instrument size in MWh; must be > 0" }
      - { name: status, type: enum, source: system, description: "PROCURED | RETIRED | EXPIRED" }
      - { name: retired_for_cycle_id, type: string, source: system, description: "FK -> ReportingCycle.id; set at retirement, cleared by void-retirement; null while PROCURED" }
      - { name: retired_for_site_id, type: string, source: system, description: "FK -> Site.id; set at retirement, cleared by void-retirement; null while PROCURED" }

  - name: QuestionnaireResponse
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ReportingCycle.id; the cycle this disclosure response reports on" }
      - { name: framework, type: enum, source: input, description: "CDP | GRI | ECOVADIS; unique together with cycle_id" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the creator (preparer); recorded at creation" }
      - { name: sections, type: object, source: system, description: "Map section_key -> { answer_text }; keys present once answered via the answers endpoint" }
      - { name: completeness_pct, type: number, source: computed, default: 0.0, description: "Share of framework-required sections answered, per questionnaire_completeness" }
      - { name: emissions_section_stale, type: boolean, source: system, default: false, description: "True when the watched cycle's inventory went STALE after the EMISSIONS section was last answered; cleared only by re-answering EMISSIONS" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | APPROVED | SUBMITTED" }
      - { name: review_decision_by, type: string, source: system, description: "X-User-ID of the latest review-decision actor; null until first decision" }
      - { name: review_notes, type: string, source: input, description: "Reviewer notes captured on the latest review-decision; null until first decision" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReportingCycle
    initial_state: DRAFT
    terminal_states: [DISCLOSED]
    transitions:
      - from: DRAFT
        to: DATA_COLLECTION
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: DATA_COLLECTION }"
        actor: SustainabilityManager
        preconditions: ["cycle in DRAFT"]
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: DATA_COLLECTION
        to: UNDER_REVIEW
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: UNDER_REVIEW }"
        actor: SustainabilityManager
        preconditions: ["cycle in DATA_COLLECTION"]
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: UNDER_REVIEW
        to: LOCKED
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: LOCKED }"
        actor: SustainabilityManager
        preconditions:
          - "cycle in UNDER_REVIEW"
          - "no ActivityRecord of this cycle in SUBMITTED or UNDER_REVIEW (ERR_OPEN_RECORDS_REMAIN)"
          - "every SupplierEngagement of this cycle in ACCEPTED or CLOSED_NO_DATA (ERR_OPEN_ENGAGEMENTS_REMAIN)"
          - "InventoryResult.status == CURRENT (ERR_INVENTORY_STALE)"
        side_effects:
          - "pinned_library_version = max(library_version) across EmissionFactors with status PUBLISHED (0 if none)"
          - "InventoryResult.status -> FROZEN"
          - "increments ReportingCycle.version by 1"
      - from: LOCKED
        to: UNDER_ASSURANCE
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: UNDER_ASSURANCE }"
        actor: SustainabilityManager
        preconditions:
          - "cycle in LOCKED"
          - "readiness_pct >= 80.0 (ERR_READINESS_BELOW_THRESHOLD)"
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: UNDER_ASSURANCE
        to: ASSURED
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: ASSURED, assurance_statement }"
        actor: AssuranceProvider
        preconditions:
          - "cycle in UNDER_ASSURANCE"
          - "assurance_statement non-empty (ERR_INVALID_REQUEST)"
          - "InventoryResult.status == FROZEN (ERR_INVENTORY_STALE)"
        side_effects:
          - "assurance_statement stored"
          - "increments ReportingCycle.version by 1"
      - from: ASSURED
        to: DISCLOSED
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: DISCLOSED }"
        actor: SustainabilityManager
        preconditions:
          - "cycle in ASSURED"
          - "at least one QuestionnaireResponse of this cycle in SUBMITTED (ERR_NO_SUBMITTED_QUESTIONNAIRE)"
        side_effects: ["increments ReportingCycle.version by 1"]
      - from: LOCKED
        to: UNDER_REVIEW
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: UNDER_REVIEW } (reopen for restatement)"
        actor: SustainabilityManager
        preconditions: ["cycle in LOCKED"]
        side_effects:
          - "InventoryResult.status -> STALE"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status -> NOT_EVALUATED (caused by the InventoryResult mutation)"
          - "every QuestionnaireResponse of this cycle in DRAFT or IN_REVIEW or APPROVED whose EMISSIONS section is answered: emissions_section_stale -> true (caused by the target/inventory staleness cascade)"
          - "increments ReportingCycle.version by 1"
        note: "Cyclic reopen edge: LOCKED -> UNDER_REVIEW -> LOCKED is legal"
      - from: UNDER_ASSURANCE
        to: UNDER_REVIEW
        trigger: "POST /sustainability/cycles/{id}/transition { to_state: UNDER_REVIEW } (assurance findings sent back)"
        actor: SustainabilityManager
        preconditions: ["cycle in UNDER_ASSURANCE"]
        side_effects:
          - "InventoryResult.status -> STALE"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status -> NOT_EVALUATED"
          - "affected QuestionnaireResponses: emissions_section_stale -> true (same cascade as LOCKED reopen)"
          - "assurance_statement cleared to null"
          - "increments ReportingCycle.version by 1"
        note: "Second cyclic reopen edge"

  - entity: ActivityRecord
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /sustainability/activity-records/{id}/transition { to_state: UNDER_REVIEW }"
        actor: SiteDataSteward
        preconditions: ["parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects: ["increments ActivityRecord.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /sustainability/activity-records/{id}/transition { to_state: APPROVED }"
        actor: SustainabilityAnalyst
        preconditions:
          - "parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
          - "approver X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "if quantity >= 1000: record has >= 1 EvidenceItem with status VERIFIED (ERR_EVIDENCE_REQUIRED)"
          - "referenced EmissionFactor still PUBLISHED and [period_start, period_end] fully inside its [valid_from, valid_to] (ERR_FACTOR_NOT_PUBLISHED)"
        side_effects:
          - "factor_value_snapshot = factor.value_tco2e_per_unit (pinned)"
          - "tco2e = round_half_up(quantity * factor_value_snapshot, 4)"
          - "reviewed_by_user_id = approver X-User-ID"
          - "InventoryResult.status -> STALE (link 1 of approval cascade)"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status -> NOT_EVALUATED (link 2, caused by link 1)"
          - "QuestionnaireResponses of this cycle in DRAFT/IN_REVIEW/APPROVED with EMISSIONS answered: emissions_section_stale -> true (link 3, caused by link 2)"
          - "readiness_pct recomputed"
          - "increments ActivityRecord.version by 1; increments ReportingCycle.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /sustainability/activity-records/{id}/transition { to_state: REJECTED, reason }"
        actor: SustainabilityAnalyst
        preconditions:
          - "parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
          - "rejecter X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "reason non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "reject_reason stored; reviewed_by_user_id set"
          - "readiness_pct recomputed"
          - "increments ActivityRecord.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /sustainability/activity-records/{id}/transition { to_state: SUBMITTED } (resubmit)"
        actor: SiteDataSteward
        preconditions: ["parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects:
          - "reject_reason cleared to null"
          - "increments ActivityRecord.version by 1"
        note: "Cyclic revision loop REJECTED -> SUBMITTED -> UNDER_REVIEW"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /sustainability/activity-records/{id}/transition { to_state: VOIDED }"
        actor: SustainabilityManager
        preconditions: ["parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects:
          - "InventoryResult.status -> STALE (compensating reversal of the approval cascade)"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status -> NOT_EVALUATED"
          - "affected QuestionnaireResponses: emissions_section_stale -> true"
          - "readiness_pct recomputed"
          - "increments ActivityRecord.version by 1; increments ReportingCycle.version by 1"
        note: "Approve-then-void is the compensating pair of invariant approved_totals_conservation"

  - entity: EvidenceItem
    initial_state: UPLOADED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: UPLOADED
        to: VERIFIED
        trigger: "POST /sustainability/evidence-items/{id}/transition { to_state: VERIFIED }"
        actor: SustainabilityAnalyst
        preconditions:
          - "parent ActivityRecord.status in {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_INVALID_STATE)"
          - "parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
          - "verifier X-User-ID != uploaded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = verifier X-User-ID"
          - "readiness_pct of parent cycle recomputed (link 1 of verify cascade)"
          - "increments EvidenceItem.version by 1"
      - from: UPLOADED
        to: REJECTED
        trigger: "POST /sustainability/evidence-items/{id}/transition { to_state: REJECTED }"
        actor: SustainabilityAnalyst
        preconditions:
          - "parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
          - "rejecter X-User-ID != uploaded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["increments EvidenceItem.version by 1"]
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "POST /sustainability/activity-records/{id}/evidence with supersedes_evidence_id naming this item"
        actor: system
        preconditions: ["named item currently VERIFIED and belongs to the same ActivityRecord"]
        side_effects:
          - "readiness_pct unchanged (the replacement item enters UPLOADED and is uncovered until verified, so readiness is recomputed and may DROP)"
          - "increments EvidenceItem.version by 1"
        note: "Supersede is executed by the create-evidence endpoint, not by the transition endpoint"

  - entity: SupplierEngagement
    initial_state: INVITED
    terminal_states: [ACCEPTED, CLOSED_NO_DATA]
    transitions:
      - from: INVITED
        to: RESPONDED
        trigger: "POST /sustainability/supplier-engagements/{id}/respond { supplier_tco2e }"
        actor: SupplierContact
        preconditions:
          - "X-User-ID == contact_user_id (ERR_UNAUTHORIZED)"
          - "engagement in INVITED or NEEDS_REVISION"
        side_effects:
          - "supplier_tco2e stored; responded_at = logical clock now"
          - "InventoryResult.status -> STALE"
          - "increments SupplierEngagement.version by 1; increments ReportingCycle.version by 1"
      - from: NEEDS_REVISION
        to: RESPONDED
        trigger: "POST /sustainability/supplier-engagements/{id}/respond { supplier_tco2e }"
        actor: SupplierContact
        preconditions: ["X-User-ID == contact_user_id (ERR_UNAUTHORIZED)"]
        side_effects:
          - "supplier_tco2e overwritten; responded_at refreshed"
          - "InventoryResult.status -> STALE"
          - "increments SupplierEngagement.version by 1; increments ReportingCycle.version by 1"
      - from: RESPONDED
        to: ACCEPTED
        trigger: "POST /sustainability/supplier-engagements/{id}/decision { decision: ACCEPT }"
        actor: SustainabilityAnalyst
        preconditions: ["parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects:
          - "InventoryResult.status -> STALE"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status -> NOT_EVALUATED"
          - "affected QuestionnaireResponses: emissions_section_stale -> true"
          - "increments SupplierEngagement.version by 1; increments ReportingCycle.version by 1"
      - from: RESPONDED
        to: NEEDS_REVISION
        trigger: "POST /sustainability/supplier-engagements/{id}/decision { decision: REQUEST_REVISION }"
        actor: SustainabilityAnalyst
        preconditions: ["parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects: ["increments SupplierEngagement.version by 1"]
      - from: NEEDS_REVISION
        to: INVITED
        trigger: "POST /sustainability/supplier-engagements/{id}/decision { decision: REINVITE }"
        actor: SustainabilityAnalyst
        preconditions: ["parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects:
          - "round += 1"
          - "increments SupplierEngagement.version by 1"
        note: "Cyclic negotiation loop INVITED -> RESPONDED -> NEEDS_REVISION -> INVITED"
      - from: INVITED
        to: CLOSED_NO_DATA
        trigger: "system (automatic when the logical clock advances past due_date; evaluated inside POST /sustainability/_clock/set_current_utc)"
        actor: system
        preconditions: ["logical clock now > due_date"]
        side_effects:
          - "InventoryResult.status -> STALE"
          - "increments SupplierEngagement.version by 1; increments ReportingCycle.version by 1"
      - from: NEEDS_REVISION
        to: CLOSED_NO_DATA
        trigger: "system (automatic when the logical clock advances past due_date)"
        actor: system
        preconditions: ["logical clock now > due_date"]
        side_effects:
          - "InventoryResult.status -> STALE"
          - "increments SupplierEngagement.version by 1; increments ReportingCycle.version by 1"

  - entity: EmissionTarget
    initial_state: DRAFT
    terminal_states: [ACHIEVED, MISSED, RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /sustainability/targets/{id}/transition { to_state: APPROVED }"
        actor: SustainabilityManager
        preconditions: []
        side_effects: ["increments EmissionTarget.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /sustainability/targets/{id}/transition { to_state: ACTIVE }"
        actor: SustainabilityManager
        preconditions:
          - "baseline_source == RECALCULATED, OR no ReportingCycle with reporting_year == base_year has status in {LOCKED, UNDER_ASSURANCE, ASSURED, DISCLOSED} (ERR_BASELINE_RECALC_REQUIRED)"
        side_effects:
          - "trajectory_status = NOT_EVALUATED until the next watched-cycle recalculation"
          - "increments EmissionTarget.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /sustainability/targets/{id}/transition { to_state: RETIRED }"
        actor: SustainabilityManager
        preconditions: []
        side_effects: ["increments EmissionTarget.version by 1"]
      - from: ACTIVE
        to: ACHIEVED
        trigger: "system (automatic when the logical clock advances into a year > target_year; evaluated inside POST /sustainability/_clock/set_current_utc)"
        actor: system
        preconditions: ["year of logical clock now > target_year", "trajectory_status == ON_TRACK"]
        side_effects: ["increments EmissionTarget.version by 1"]
      - from: ACTIVE
        to: MISSED
        trigger: "system (automatic when the logical clock advances into a year > target_year)"
        actor: system
        preconditions: ["year of logical clock now > target_year", "trajectory_status != ON_TRACK"]
        side_effects: ["increments EmissionTarget.version by 1"]

  - entity: RenewableInstrument
    initial_state: PROCURED
    terminal_states: [EXPIRED]
    transitions:
      - from: PROCURED
        to: RETIRED
        trigger: "POST /sustainability/instruments/{id}/retire { cycle_id, site_id }"
        actor: SustainabilityManager
        preconditions:
          - "instrument in PROCURED (ERR_INVALID_STATE)"
          - "target Site.status == ACTIVE (ERR_SITE_INACTIVE)"
          - "target ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
          - "cycle.reporting_year - 3 <= vintage_year <= cycle.reporting_year (ERR_VINTAGE_INELIGIBLE)"
        side_effects:
          - "retired_for_cycle_id / retired_for_site_id set"
          - "InventoryResult.status -> STALE (link 1 of retirement cascade)"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status -> NOT_EVALUATED (link 2)"
          - "affected QuestionnaireResponses: emissions_section_stale -> true (link 3)"
          - "increments RenewableInstrument.version by 1; increments ReportingCycle.version by 1"
      - from: RETIRED
        to: PROCURED
        trigger: "POST /sustainability/instruments/{id}/void-retirement"
        actor: SustainabilityManager
        preconditions:
          - "instrument in RETIRED (ERR_INVALID_STATE)"
          - "retired_for_cycle's status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
        side_effects:
          - "retired_for_cycle_id / retired_for_site_id cleared to null"
          - "InventoryResult.status -> STALE (compensating reversal)"
          - "every ACTIVE EmissionTarget watching the formerly-linked cycle: trajectory_status -> NOT_EVALUATED"
          - "affected QuestionnaireResponses: emissions_section_stale -> true"
          - "increments RenewableInstrument.version by 1; increments ReportingCycle.version by 1"
        note: "Retire-then-void is the compensating pair of invariant instrument_quantity_conservation"
      - from: PROCURED
        to: EXPIRED
        trigger: "system (automatic when the logical clock advances into a year > vintage_year + 3)"
        actor: system
        preconditions: ["year of logical clock now > vintage_year + 3"]
        side_effects: ["increments RenewableInstrument.version by 1"]

  - entity: QuestionnaireResponse
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /sustainability/questionnaire-responses/{id}/transition { to_state: IN_REVIEW }"
        actor: DisclosureLead
        preconditions:
          - "every framework-required section answered AND emissions_section_stale == false (ERR_SECTION_INCOMPLETE)"
          - "parent ReportingCycle.status not in {LOCKED, UNDER_ASSURANCE, ASSURED, DISCLOSED} (ERR_CYCLE_NOT_COLLECTING)"
        side_effects: ["increments QuestionnaireResponse.version by 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /sustainability/questionnaire-responses/{id}/review-decision { decision: APPROVE }"
        actor: SustainabilityManager
        preconditions:
          - "decision-maker X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "review_decision_by / review_notes stored"
          - "increments QuestionnaireResponse.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /sustainability/questionnaire-responses/{id}/review-decision { decision: REQUEST_CHANGES }"
        actor: SustainabilityManager
        preconditions:
          - "decision-maker X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "review_decision_by / review_notes stored"
          - "increments QuestionnaireResponse.version by 1"
        note: "Cyclic review loop DRAFT -> IN_REVIEW -> DRAFT"
      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /sustainability/questionnaire-responses/{id}/transition { to_state: SUBMITTED }"
        actor: DisclosureLead
        preconditions: ["parent ReportingCycle.status not in {DISCLOSED} (ERR_CYCLE_NOT_COLLECTING)"]
        side_effects: ["increments QuestionnaireResponse.version by 1"]

  - entity: EmissionFactor
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /sustainability/emission-factors/{id}/transition { to_state: PUBLISHED }"
        actor: SustainabilityManager
        preconditions:
          - "no other PUBLISHED EmissionFactor with the same (scope_category, region_code) whose CLOSED [valid_from, valid_to] window intersects this one; intersection test is start <= other.valid_to AND end >= other.valid_from, so touching endpoints count as overlap (ERR_FACTOR_WINDOW_OVERLAP)"
        side_effects: ["increments EmissionFactor.version by 1"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /sustainability/emission-factors/{id}/transition { to_state: RETIRED }"
        actor: SustainabilityManager
        preconditions: []
        side_effects: ["increments EmissionFactor.version by 1"]

  - entity: InventoryResult
    initial_state: STALE
    terminal_states: []
    transitions:
      - from: STALE
        to: CURRENT
        trigger: "POST /sustainability/cycles/{id}/inventory/recalculate"
        actor: SustainabilityManager
        preconditions:
          - "parent ReportingCycle.status in {DATA_COLLECTION, UNDER_REVIEW} (ERR_CYCLE_NOT_COLLECTING)"
          - "expected_cycle_version == ReportingCycle.version (ERR_STALE_VERSION)"
        side_effects:
          - "all scope totals recomputed per calculations; computed_at = logical clock now"
          - "every ACTIVE EmissionTarget watching this cycle: trajectory_status re-evaluated per target_trajectory_status"
          - "increments InventoryResult.version by 1; increments ReportingCycle.version by 1"
      - from: CURRENT
        to: STALE
        trigger: "system (any mutation of APPROVED-set composition: record approve/void, engagement respond/accept/auto-close, instrument retire/void-retirement)"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryResult.version by 1"]
      - from: CURRENT
        to: FROZEN
        trigger: "system (cycle transition to LOCKED)"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryResult.version by 1"]
      - from: FROZEN
        to: STALE
        trigger: "system (cycle reopen transition to UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects: ["increments InventoryResult.version by 1"]

  - entity: Site
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /sustainability/sites/{id}/decommission"
        actor: SustainabilityManager
        preconditions: []
        side_effects: ["increments Site.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: recalc-stale-cycle
    parent_entity: ReportingCycle
    write_endpoint: "POST /sustainability/cycles/{id}/inventory/recalculate"
    occ_field: expected_cycle_version
    description: |
      Recalculating the inventory against a ReportingCycle whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just approved a record or retired an instrument (each legitimately
      bumps cycle.version and marks the inventory STALE), so the recalculating
      client's view of the input set is stale and the write is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: baseline-recalc-stale-target
    parent_entity: EmissionTarget
    write_endpoint: "POST /sustainability/targets/{id}/recalculate-baseline"
    occ_field: expected_target_version
    description: |
      Recalculating an EmissionTarget baseline legitimately supersedes the
      previously stored baseline, so no state precondition rejects a repeat
      recalculation. A request carrying an expected_target_version older than
      the target's current version is rejected as stale with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: record_tco2e
    trigger: "ActivityRecord transition UNDER_REVIEW -> APPROVED"
    algorithm: aggregation
    formula: |
      factor_value_snapshot = EmissionFactor[factor_id].value_tco2e_per_unit   # pinned at approval
      tco2e = round_half_up(quantity * factor_value_snapshot, 4)
    input_set: "the single ActivityRecord being approved"
    precision: "4 decimal places, round_half_up"

  - name: inventory_aggregation
    trigger: "POST /sustainability/cycles/{id}/inventory/recalculate"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each record line first, then sum the
      # rounded lines, then round the scope sum. Sum-then-round is FORBIDDEN.
      scope1_tco2e          = round_half_up( sum(tco2e of APPROVED records with activity_type == STATIONARY_FUEL), 2 )
      scope2_location_tco2e = round_half_up( sum(tco2e of APPROVED records with activity_type == ELECTRICITY), 2 )
      travel_tco2e          = round_half_up( sum(tco2e of APPROVED records with activity_type == BUSINESS_TRAVEL), 2 )
      # spend line per engagement:
      spend_line(e) = round_half_up(e.spend_usd * eeio_factor.value_tco2e_per_unit, 2)
      #   where eeio_factor is the unique PUBLISHED factor with scope_category == SCOPE3_EEIO_SPEND
      #   and region_code == GLOBAL whose CLOSED window contains the cycle midpoint
      #   (cycle midpoint = reporting_year-07-01T00:00:00Z); if none exists, spend_line(e) = 0.00
      scope3_tco2e            = round_half_up( travel_tco2e
                                 + sum(supplier_tco2e over ACCEPTED engagements of the cycle)
                                 + sum(spend_line(e) over engagements of the cycle NOT in ACCEPTED), 2 )
      scope3_provisional_tco2e = round_half_up( travel_tco2e + sum(spend_line(e) over ALL engagements of the cycle), 2 )
      total_tco2e = round_half_up( scope1_tco2e + scope2_market_tco2e + scope3_tco2e, 2 )
    input_set: "ActivityRecords of the cycle with status APPROVED (SUBMITTED/UNDER_REVIEW/REJECTED/VOIDED excluded); SupplierEngagements of the cycle in any status"
    precision: "2 decimal places at scope level, round_half_up; record lines pre-rounded to 4dp by record_tco2e"
    variants:
      - name: provisional_scope3
        when: "scope3_provisional_tco2e column — every engagement priced spend-based regardless of ACCEPTED status"
        difference: "identical engagement set, but ACCEPTED rows use spend_line instead of supplier_tco2e, so the two columns diverge whenever an ACCEPTED supplier_tco2e differs from its spend-based line"

  - name: market_based_scope2
    trigger: "POST /sustainability/cycles/{id}/inventory/recalculate"
    algorithm: waterfall_allocation
    formula: |
      for each Site s with >= 1 APPROVED ELECTRICITY record in this cycle:
        site_mwh   = sum(quantity of APPROVED ELECTRICITY records for s in this cycle)
        retired    = sum(quantity_mwh of instruments with status RETIRED,
                         retired_for_cycle_id == cycle.id, retired_for_site_id == s.id)
        covered    = min(site_mwh, retired)                       # nested min: cap at consumption
        residual   = site_mwh - covered
        rate       = residual-mix factor if one is PUBLISHED for (SCOPE2_RESIDUAL_MIX, s.grid_region_code)
                     whose CLOSED window contains the cycle midpoint (reporting_year-07-01T00:00:00Z),
                     ELSE the PUBLISHED (SCOPE2_GRID, s.grid_region_code) factor covering the midpoint,
                     ELSE 0
        line(s)    = round_half_up(covered * 0 + residual * rate, 4)   # retired instruments are zero-emission
      scope2_market_tco2e = round_half_up( sum(line(s) over all such sites), 2 )
    input_set: "APPROVED ELECTRICITY records grouped by site; RETIRED instruments linked to (cycle, site); PUBLISHED SCOPE2_RESIDUAL_MIX / SCOPE2_GRID factors"
    precision: "4 decimal places per site line then 2 at scope level, round_half_up"
    variants:
      - name: location_based_scope2
        when: "scope2_location_tco2e column in inventory_aggregation — same records priced purely at grid factors"
        difference: "identical APPROVED electricity set, but location pricing ignores RETIRED instruments and residual mix, so location and market totals diverge whenever coverage or the residual rate differs from the grid rate"

  - name: target_trajectory_status
    trigger: "inventory recalculation for a watched cycle; set to NOT_EVALUATED whenever the watched cycle's InventoryResult becomes STALE"
    algorithm: threshold
    formula: |
      watched cycles: ReportingCycles whose reporting_year is in (base_year, target_year]
      applicable coverage totals: SCOPE1_2   -> scope1_tco2e + scope2_market_tco2e
                                  SCOPE1_2_3 -> total_tco2e
      on recalculate of watched cycle c (for each ACTIVE target):
        actual_reduction_pct   = (base_year_total_tco2e - coverage_total(c)) / base_year_total_tco2e * 100
        required_reduction_pct = reduction_pct * (c.reporting_year - base_year) / (target_year - base_year)
        trajectory_status = ON_TRACK  iff actual_reduction_pct >= required_reduction_pct - 2.0
                            OFF_TRACK otherwise                      # boundary: exactly at threshold is ON_TRACK
    input_set: "ACTIVE EmissionTargets; the recalculated InventoryResult of the watched cycle"
    constants:
      TOLERANCE_PCT_POINTS: 2.0
      BASELINE_SIGNIFICANCE_PCT: 5.0   # used by baseline recalculation: |new-old|/old*100 >= 5.0 => significant
    precision: "1 decimal place comparison, round_half_up"

  - name: assurance_readiness_pct
    trigger: "record approve/reject/void; evidence verify; evidence supersede"
    algorithm: aggregation
    formula: |
      approved = ActivityRecords of the cycle with status APPROVED
      covered  = those approved records having >= 1 EvidenceItem with status VERIFIED
      readiness_pct = round_half_up( sum(quantity over covered) / sum(quantity over approved) * 100, 1 )
      if approved is empty: readiness_pct = 0.0
    input_set: "APPROVED ActivityRecords of the cycle and their VERIFIED EvidenceItems"
    precision: "1 decimal place, round_half_up"

  - name: questionnaire_completeness
    trigger: "POST /sustainability/questionnaire-responses/{id}/answers; questionnaire creation"
    algorithm: aggregation
    formula: |
      required sections: CDP      -> [GOVERNANCE, RISKS, EMISSIONS, TARGETS]
                         GRI      -> [DISCLOSURE_305, ENERGY]
                         ECOVADIS -> [ENVIRONMENT]
      completeness_pct = round_half_up( answered_required / len(required) * 100, 1 )
    input_set: "the QuestionnaireResponse's sections map"
    precision: "1 decimal place, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles AND for the specific transition target per the §1.2 actor column (e.g. ASSURED is AssuranceProvider-only; VOIDED is SustainabilityManager-only); for respond, X-User-ID must also equal contact_user_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids and body-supplied FK ids (cycle_id, site_id, factor_id, activity_record_id, supersedes_evidence_id) resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types valid, enum members valid, quantity > 0, spend_usd >= 0, datetime ISO-8601, reason/assurance_statement non-empty where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_cycle_version / expected_target_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /sustainability/cycles/{id}/inventory/recalculate", "POST /sustainability/targets/{id}/recalculate-baseline"]
  - priority: 6
    category: state
    check: "Target entity's own state permits the transition (per §1.2 from-states); parent-cycle gate for child mutations: cycle in {DATA_COLLECTION, UNDER_REVIEW}"
    error_id: "ERR_INVALID_STATE / ERR_CYCLE_NOT_COLLECTING"
    http_status: 409
    applies_to: "all transition / action endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: record approver/rejecter != submitted_by_user_id; evidence verifier/rejecter != uploaded_by_user_id; review decision-maker != prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /sustainability/activity-records/{id}/transition", "POST /sustainability/evidence-items/{id}/transition", "POST /sustainability/questionnaire-responses/{id}/review-decision"]
  - priority: 8
    category: business_safety
    check: "Evidence mandate: approving a record with quantity >= 1000 requires >= 1 VERIFIED EvidenceItem on the record"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: ["POST /sustainability/activity-records/{id}/transition"]
  - priority: 9
    category: business_temporal
    check: "Activity period fully inside cycle reporting year ([year-01-01T00:00:00Z, year+1-01-01T00:00:00Z)); instrument vintage within [cycle.reporting_year - 3, cycle.reporting_year]"
    error_id: "ERR_PERIOD_OUTSIDE_CYCLE_YEAR / ERR_VINTAGE_INELIGIBLE"
    http_status: 422
    applies_to: ["POST /sustainability/activity-records", "POST /sustainability/instruments/{id}/retire"]
  - priority: 10
    category: business_constraint
    check: "No period overlap: same (site_id, activity_type), among statuses {SUBMITTED, UNDER_REVIEW, APPROVED}, HALF-OPEN [period_start, period_end) pairwise disjoint — touching endpoints allowed"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: ["POST /sustainability/activity-records"]
  - priority: 11
    category: business_constraint
    check: "No factor-window overlap: among PUBLISHED factors with same (scope_category, region_code), CLOSED [valid_from, valid_to] pairwise disjoint — touching endpoints count as overlap"
    error_id: ERR_FACTOR_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /sustainability/emission-factors/{id}/transition"]
  - priority: 12
    category: business_constraint
    check: "Unit consistency: record.unit == factor.unit; record.activity_type maps to factor.scope_category (ELECTRICITY->SCOPE2_GRID, STATIONARY_FUEL->SCOPE1_STATIONARY, BUSINESS_TRAVEL->SCOPE3_TRAVEL)"
    error_id: ERR_UNIT_MISMATCH
    http_status: 422
    applies_to: ["POST /sustainability/activity-records"]
  - priority: 13
    category: business_constraint
    check: "Uniqueness: (registry, serial_number) among non-EXPIRED instruments; (cycle_id, framework) among questionnaire responses"
    error_id: "ERR_DUPLICATE_INSTRUMENT_SERIAL / ERR_DUPLICATE_QUESTIONNAIRE"
    http_status: 409
    applies_to: ["POST /sustainability/instruments", "POST /sustainability/questionnaire-responses"]
  - priority: 14
    category: business_constraint
    check: "Cycle lock gates: no SUBMITTED/UNDER_REVIEW records; all engagements terminal; InventoryResult CURRENT. Baseline recalculation gate: the referenced base cycle's InventoryResult must be FROZEN"
    error_id: "ERR_OPEN_RECORDS_REMAIN / ERR_OPEN_ENGAGEMENTS_REMAIN / ERR_INVENTORY_STALE"
    http_status: 409
    applies_to: ["POST /sustainability/cycles/{id}/transition", "POST /sustainability/targets/{id}/recalculate-baseline"]
  - priority: 15
    category: business_constraint
    check: "Aggregate gates: begin-assurance needs readiness_pct >= 80.0; target activation needs RECALCULATED baseline when a locked-or-later base-year cycle exists; questionnaire submit-review needs all required sections answered and EMISSIONS fresh; disclose needs a SUBMITTED questionnaire"
    error_id: "ERR_READINESS_BELOW_THRESHOLD / ERR_BASELINE_RECALC_REQUIRED / ERR_SECTION_INCOMPLETE / ERR_NO_SUBMITTED_QUESTIONNAIRE"
    http_status: 422
    applies_to: ["POST /sustainability/cycles/{id}/transition", "POST /sustainability/targets/{id}/transition", "POST /sustainability/questionnaire-responses/{id}/transition"]
  - priority: 16
    category: business_referential
    check: "Referenced factor still PUBLISHED and covering the record period at approval; referenced Site ACTIVE at record creation and instrument retirement"
    error_id: "ERR_FACTOR_NOT_PUBLISHED / ERR_SITE_INACTIVE"
    http_status: 422
    applies_to: ["POST /sustainability/activity-records", "POST /sustainability/activity-records/{id}/transition", "POST /sustainability/instruments/{id}/retire"]

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Sites ---
  - method: POST
    path: "/sustainability/sites"
    description: "Create a Site (status ACTIVE)"
    roles: [SustainabilityManager]
    code: 201
    input: [name, country_code, grid_region_code]
    output: Site
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/sustainability/sites/{id}"
    description: "Get a Site"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: POST
    path: "/sustainability/sites/{id}/decommission"
    description: "Decommission a Site (ACTIVE -> DECOMMISSIONED)"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: Site
    side_effects: ["status -> DECOMMISSIONED"]

  # --- Emission factors ---
  - method: POST
    path: "/sustainability/emission-factors"
    description: "Create an EmissionFactor (status DRAFT)"
    roles: [SustainabilityManager]
    code: 201
    input: [scope_category, region_code, unit, value_tco2e_per_unit, library_version, valid_from, valid_to]
    output: EmissionFactor
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/sustainability/emission-factors/{id}"
    description: "Get an EmissionFactor"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: EmissionFactor
    side_effects: []
  - method: POST
    path: "/sustainability/emission-factors/{id}/transition"
    description: "Publish or retire an EmissionFactor (DRAFT -> PUBLISHED, PUBLISHED -> RETIRED)"
    roles: [SustainabilityManager]
    code: 200
    input: [to_state]
    output: EmissionFactor
    side_effects: ["status -> to_state; publish enforces closed-window overlap rule"]

  # --- Reporting cycles ---
  - method: POST
    path: "/sustainability/cycles"
    description: "Create a ReportingCycle (status DRAFT); auto-creates its singleton InventoryResult (STALE, all totals 0.0)"
    roles: [SustainabilityManager]
    code: 201
    input: [name, reporting_year]
    output: ReportingCycle
    side_effects: ["status=DRAFT", "InventoryResult created with status=STALE and zero totals"]
  - method: GET
    path: "/sustainability/cycles/{id}"
    description: "Get a ReportingCycle"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: ReportingCycle
    side_effects: []
  - method: POST
    path: "/sustainability/cycles/{id}/transition"
    description: "Advance/reopen a cycle: DATA_COLLECTION | UNDER_REVIEW | LOCKED | UNDER_ASSURANCE | ASSURED | DISCLOSED per §1.2 (ASSURED is AssuranceProvider-only and requires assurance_statement)"
    roles: [SustainabilityManager, AssuranceProvider]
    code: 200
    input: [to_state, "assurance_statement?"]
    output: ReportingCycle
    side_effects: ["per §1.2 ReportingCycle transitions; increments ReportingCycle.version by 1"]
  - method: POST
    path: "/sustainability/cycles/{id}/inventory/recalculate"
    description: "Recompute the cycle's InventoryResult (STALE -> CURRENT). OCC-guarded by expected_cycle_version."
    roles: [SustainabilityManager]
    code: 200
    input: [expected_cycle_version]
    output: InventoryResult
    side_effects:
      - "recomputes all scope totals per inventory_aggregation + market_based_scope2"
      - "re-evaluates trajectory_status of ACTIVE targets watching this cycle"
      - "increments InventoryResult.version by 1; increments ReportingCycle.version by 1"
  - method: GET
    path: "/sustainability/inventory-results/{id}"
    description: "Get an InventoryResult"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: InventoryResult
    side_effects: []
  - method: GET
    path: "/sustainability/inventory-results"
    description: "List InventoryResults, optionally filtered by cycle"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: ["cycle_id?", "limit?", "offset?"]
    output: InventoryResult[]
    side_effects: []

  # --- Activity records ---
  - method: POST
    path: "/sustainability/activity-records"
    description: "Create an ActivityRecord (status SUBMITTED); records submitted_by_user_id from X-User-ID"
    roles: [SiteDataSteward]
    code: 201
    input: [cycle_id, site_id, factor_id, activity_type, quantity, unit, period_start, period_end]
    output: ActivityRecord
    side_effects: ["status=SUBMITTED", "submitted_by_user_id = X-User-ID"]
  - method: GET
    path: "/sustainability/activity-records/{id}"
    description: "Get an ActivityRecord"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: ActivityRecord
    side_effects: []
  - method: GET
    path: "/sustainability/activity-records"
    description: "List ActivityRecords with filters"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: ["cycle_id?", "site_id?", "factor_id?", "status?", "limit?", "offset?"]
    output: ActivityRecord[]
    side_effects: []
  - method: POST
    path: "/sustainability/activity-records/{id}/transition"
    description: "Record workflow: UNDER_REVIEW (steward) | APPROVED | REJECTED (analyst; reason required on REJECTED) | SUBMITTED (resubmit, steward) | VOIDED (manager)"
    roles: [SiteDataSteward, SustainabilityAnalyst, SustainabilityManager]
    code: 200
    input: [to_state, "reason?"]
    output: ActivityRecord
    side_effects: ["per §1.2 ActivityRecord transitions; approval cascade marks inventory STALE, targets NOT_EVALUATED, questionnaires stale"]

  # --- Evidence ---
  - method: POST
    path: "/sustainability/activity-records/{id}/evidence"
    description: "Upload evidence for a record (status UPLOADED); optional supersedes_evidence_id supersedes a VERIFIED item on the same record"
    roles: [SiteDataSteward]
    code: 201
    input: [file_name, sha256_hex, "supersedes_evidence_id?"]
    output: EvidenceItem
    side_effects: ["status=UPLOADED", "uploaded_by_user_id = X-User-ID", "retention_until computed", "named superseded item -> SUPERSEDED and readiness_pct recomputed"]
  - method: GET
    path: "/sustainability/evidence-items/{id}"
    description: "Get an EvidenceItem"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []
  - method: GET
    path: "/sustainability/evidence-items"
    description: "List EvidenceItems with filters (activity_record_id, supersedes_evidence_id, status)"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: ["activity_record_id?", "supersedes_evidence_id?", "status?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: POST
    path: "/sustainability/evidence-items/{id}/transition"
    description: "Verify or reject an uploaded EvidenceItem (UPLOADED -> VERIFIED | REJECTED; analyst; SoD vs uploader)"
    roles: [SustainabilityAnalyst]
    code: 200
    input: [to_state]
    output: EvidenceItem
    side_effects: ["per §1.2 EvidenceItem transitions; readiness_pct recomputed on VERIFIED"]

  # --- Supplier engagements ---
  - method: POST
    path: "/sustainability/supplier-engagements"
    description: "Create a SupplierEngagement (status INVITED, round 1)"
    roles: [SustainabilityAnalyst]
    code: 201
    input: [cycle_id, supplier_name, category, spend_usd, contact_user_id, due_date]
    output: SupplierEngagement
    side_effects: ["status=INVITED", "round=1"]
  - method: GET
    path: "/sustainability/supplier-engagements/{id}"
    description: "Get a SupplierEngagement"
    roles: [SustainabilityManager, SustainabilityAnalyst, SupplierContact, AssuranceProvider]
    code: 200
    input: []
    output: SupplierEngagement
    side_effects: []
  - method: GET
    path: "/sustainability/supplier-engagements"
    description: "List SupplierEngagements with filters"
    roles: [SustainabilityManager, SustainabilityAnalyst, SupplierContact, AssuranceProvider]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: SupplierEngagement[]
    side_effects: []
  - method: POST
    path: "/sustainability/supplier-engagements/{id}/respond"
    description: "Supplier submits its emissions figure (INVITED | NEEDS_REVISION -> RESPONDED); caller must be the engagement's contact_user_id"
    roles: [SupplierContact]
    code: 200
    input: [supplier_tco2e]
    output: SupplierEngagement
    side_effects: ["supplier_tco2e stored", "responded_at = logical clock now", "InventoryResult.status -> STALE", "increments SupplierEngagement.version by 1; increments ReportingCycle.version by 1"]
  - method: POST
    path: "/sustainability/supplier-engagements/{id}/decision"
    description: "Analyst decision: ACCEPT (RESPONDED -> ACCEPTED) | REQUEST_REVISION (RESPONDED -> NEEDS_REVISION) | REINVITE (NEEDS_REVISION -> INVITED, round += 1)"
    roles: [SustainabilityAnalyst]
    code: 200
    input: [decision]
    output: SupplierEngagement
    side_effects: ["per §1.2 SupplierEngagement transitions; ACCEPT fires the staleness cascade"]

  # --- Emission targets ---
  - method: POST
    path: "/sustainability/targets"
    description: "Create an EmissionTarget (status DRAFT, baseline_source PROVISIONAL, trajectory_status NOT_EVALUATED)"
    roles: [SustainabilityManager]
    code: 201
    input: [name, base_year, target_year, reduction_pct, scope_coverage, base_year_total_tco2e]
    output: EmissionTarget
    side_effects: ["status=DRAFT", "baseline_source=PROVISIONAL", "trajectory_status=NOT_EVALUATED"]
  - method: GET
    path: "/sustainability/targets/{id}"
    description: "Get an EmissionTarget"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: EmissionTarget
    side_effects: []
  - method: GET
    path: "/sustainability/targets"
    description: "List EmissionTargets with filters"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: ["status?", "base_year?", "limit?", "offset?"]
    output: EmissionTarget[]
    side_effects: []
  - method: POST
    path: "/sustainability/targets/{id}/transition"
    description: "Target workflow: APPROVED | ACTIVE | RETIRED per §1.2"
    roles: [SustainabilityManager]
    code: 200
    input: [to_state]
    output: EmissionTarget
    side_effects: ["per §1.2 EmissionTarget transitions"]
  - method: POST
    path: "/sustainability/targets/{id}/recalculate-baseline"
    description: "Recompute baseline from a locked-or-later base-year cycle's FROZEN inventory; applies the new baseline, records shift_pct and significance. OCC-guarded by expected_target_version."
    roles: [SustainabilityManager]
    code: 200
    input: [base_cycle_id, expected_target_version]
    output: EmissionTarget
    side_effects:
      - "base_year_total_tco2e = base cycle inventory coverage total (SCOPE1_2: scope1 + scope2_market; SCOPE1_2_3: total_tco2e)"
      - "baseline_shift_pct = |new - old| / old * 100; baseline_shift_significant = shift_pct >= 5.0"
      - "baseline_source = RECALCULATED"
      - "increments EmissionTarget.version by 1"

  # --- Renewable instruments ---
  - method: POST
    path: "/sustainability/instruments"
    description: "Register a RenewableInstrument (status PROCURED)"
    roles: [SustainabilityManager]
    code: 201
    input: [registry, serial_number, technology, vintage_year, quantity_mwh]
    output: RenewableInstrument
    side_effects: ["status=PROCURED"]
  - method: GET
    path: "/sustainability/instruments/{id}"
    description: "Get a RenewableInstrument"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: RenewableInstrument
    side_effects: []
  - method: GET
    path: "/sustainability/instruments"
    description: "List RenewableInstruments with filters"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: ["status?", "retired_for_cycle_id?", "retired_for_site_id?", "limit?", "offset?"]
    output: RenewableInstrument[]
    side_effects: []
  - method: POST
    path: "/sustainability/instruments/{id}/retire"
    description: "Retire the full instrument against a (site, cycle) for market-based scope 2 (PROCURED -> RETIRED)"
    roles: [SustainabilityManager]
    code: 200
    input: [cycle_id, site_id]
    output: RenewableInstrument
    side_effects: ["per §1.2 retire transition; retirement cascade marks inventory STALE, targets NOT_EVALUATED, questionnaires stale"]
  - method: POST
    path: "/sustainability/instruments/{id}/void-retirement"
    description: "Reverse a retirement while the cycle is still open (RETIRED -> PROCURED); compensating action of instrument_quantity_conservation"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: RenewableInstrument
    side_effects: ["per §1.2 void-retirement transition; reverses the retirement cascade"]

  # --- Questionnaire responses ---
  - method: POST
    path: "/sustainability/questionnaire-responses"
    description: "Create a QuestionnaireResponse (status DRAFT); unique per (cycle_id, framework)"
    roles: [DisclosureLead]
    code: 201
    input: [cycle_id, framework]
    output: QuestionnaireResponse
    side_effects: ["status=DRAFT", "prepared_by_user_id = X-User-ID", "sections empty", "emissions_section_stale=false"]
  - method: GET
    path: "/sustainability/questionnaire-responses/{id}"
    description: "Get a QuestionnaireResponse"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: []
    output: QuestionnaireResponse
    side_effects: []
  - method: GET
    path: "/sustainability/questionnaire-responses"
    description: "List QuestionnaireResponses with filters"
    roles: [SustainabilityManager, SustainabilityAnalyst, SiteDataSteward, DisclosureLead, AssuranceProvider]
    code: 200
    input: ["cycle_id?", "framework?", "status?", "limit?", "offset?"]
    output: QuestionnaireResponse[]
    side_effects: []
  - method: POST
    path: "/sustainability/questionnaire-responses/{id}/answers"
    description: "Upsert one section answer (DRAFT only); answering EMISSIONS clears emissions_section_stale"
    roles: [DisclosureLead]
    code: 200
    input: [section_key, answer_text]
    output: QuestionnaireResponse
    side_effects: ["sections[section_key] upserted", "completeness_pct recomputed", "if section_key == EMISSIONS: emissions_section_stale = false"]
  - method: POST
    path: "/sustainability/questionnaire-responses/{id}/transition"
    description: "Submit for review (DRAFT -> IN_REVIEW) or submit final (APPROVED -> SUBMITTED)"
    roles: [DisclosureLead]
    code: 200
    input: [to_state]
    output: QuestionnaireResponse
    side_effects: ["per §1.2 QuestionnaireResponse transitions"]
  - method: POST
    path: "/sustainability/questionnaire-responses/{id}/review-decision"
    description: "Independent review: APPROVE (IN_REVIEW -> APPROVED) | REQUEST_CHANGES (IN_REVIEW -> DRAFT); decision-maker must differ from preparer"
    roles: [SustainabilityManager]
    code: 200
    input: [decision, "review_notes?"]
    output: QuestionnaireResponse
    side_effects: ["per §1.2 QuestionnaireResponse transitions; review_decision_by / review_notes stored"]

  # --- Test-driving clock ---
  - method: POST
    path: "/sustainability/_clock/set_current_utc"
    description: "Set the server's logical clock (TEST-DRIVING). Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Advancing the clock evaluates all due-based transitions: engagements in INVITED/NEEDS_REVISION with due_date < now -> CLOSED_NO_DATA; PROCURED instruments with now_year > vintage_year + 3 -> EXPIRED; ACTIVE targets with now_year > target_year -> ACHIEVED if trajectory_status == ON_TRACK else MISSED."
    roles: [SustainabilityManager]
    code: 200
    input: [to_iso8601]
    output: { now_utc: datetime, engagements_closed: integer, instruments_expired: integer, targets_evaluated: integer }
    side_effects: ["evaluates due-based transitions listed in the description; each fired transition applies its own §1.2 side effects"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint, or SupplierContact respond with X-User-ID != contact_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type/enum, quantity <= 0, spend_usd < 0, bad datetime, empty reason/assurance_statement" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity's own state does not permit the requested transition" }
  - { id: ERR_CYCLE_NOT_COLLECTING, http: 409, condition: "Parent cycle not in a status that permits the child mutation (usually requires DATA_COLLECTION or UNDER_REVIEW)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempting both sides of a controlled step (submit/approve, upload/verify, prepare/review)" }
  - { id: ERR_EVIDENCE_REQUIRED, http: 422, condition: "Approving a record with quantity >= 1000 without any VERIFIED evidence" }
  - { id: ERR_PERIOD_OUTSIDE_CYCLE_YEAR, http: 422, condition: "Activity period not fully inside the cycle's reporting year" }
  - { id: ERR_VINTAGE_INELIGIBLE, http: 422, condition: "Instrument vintage_year outside [cycle.reporting_year - 3, cycle.reporting_year] at retirement" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Half-open activity period collides with another non-terminal record for the same (site_id, activity_type)" }
  - { id: ERR_FACTOR_WINDOW_OVERLAP, http: 409, condition: "Publishing a factor whose closed validity window touches/overlaps another PUBLISHED factor with the same (scope_category, region_code)" }
  - { id: ERR_UNIT_MISMATCH, http: 422, condition: "Record unit != factor unit, or activity_type/scope_category mapping violated" }
  - { id: ERR_DUPLICATE_INSTRUMENT_SERIAL, http: 409, condition: "Another non-EXPIRED instrument with the same (registry, serial_number) exists" }
  - { id: ERR_DUPLICATE_QUESTIONNAIRE, http: 409, condition: "A QuestionnaireResponse already exists for (cycle_id, framework)" }
  - { id: ERR_OPEN_RECORDS_REMAIN, http: 409, condition: "Cycle lock attempted while records are still SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_OPEN_ENGAGEMENTS_REMAIN, http: 409, condition: "Cycle lock attempted while engagements are not yet ACCEPTED or CLOSED_NO_DATA" }
  - { id: ERR_INVENTORY_STALE, http: 409, condition: "Cycle lock attempted while InventoryResult is not CURRENT; or attest while not FROZEN" }
  - { id: ERR_READINESS_BELOW_THRESHOLD, http: 422, condition: "Begin-assurance attempted with readiness_pct < 80.0" }
  - { id: ERR_BASELINE_RECALC_REQUIRED, http: 409, condition: "Target activation attempted with PROVISIONAL baseline while a locked-or-later base-year cycle exists" }
  - { id: ERR_SECTION_INCOMPLETE, http: 422, condition: "Questionnaire submit-review with required sections unanswered or EMISSIONS section stale" }
  - { id: ERR_NO_SUBMITTED_QUESTIONNAIRE, http: 409, condition: "Disclose attempted with no SUBMITTED QuestionnaireResponse for the cycle" }
  - { id: ERR_SITE_INACTIVE, http: 422, condition: "Record creation or instrument retirement against a DECOMMISSIONED site" }
  - { id: ERR_FACTOR_NOT_PUBLISHED, http: 422, condition: "Referenced factor not PUBLISHED or its closed validity window does not fully cover the record period (checked at creation and again at approval)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SustainabilityManager
    description: "Sustainability office lead: owns master data (sites, factors, cycles, targets, instruments), drives cycle gates, and acts as independent questionnaire reviewer"
    identity: opaque
    exclusive_operations:
      - "POST /sustainability/sites, /sites/{id}/decommission"
      - "POST /sustainability/emission-factors, /emission-factors/{id}/transition"
      - "POST /sustainability/cycles, /cycles/{id}/inventory/recalculate"
      - "POST /sustainability/targets, /targets/{id}/transition, /targets/{id}/recalculate-baseline"
      - "POST /sustainability/instruments, /instruments/{id}/retire, /instruments/{id}/void-retirement"
      - "POST /sustainability/questionnaire-responses/{id}/review-decision"
      - "POST /sustainability/_clock/set_current_utc"
      - "POST /sustainability/activity-records/{id}/transition to VOIDED"
    shared_operations:
      - "POST /sustainability/cycles/{id}/transition (shared with AssuranceProvider for ASSURED)"
      - "GET reads on all business resources (shared with Analyst, Steward, DisclosureLead, AssuranceProvider)"
  - name: SustainabilityAnalyst
    description: "Reviewer of activity data and evidence; runs supplier engagements"
    identity: opaque
    exclusive_operations:
      - "POST /sustainability/supplier-engagements, /supplier-engagements/{id}/decision"
      - "POST /sustainability/evidence-items/{id}/transition"
      - "POST /sustainability/activity-records/{id}/transition to APPROVED | REJECTED"
    shared_operations:
      - "GET reads on all business resources"
  - name: SiteDataSteward
    description: "Site-level data collector: submits activity records and uploads evidence"
    identity: opaque
    exclusive_operations:
      - "POST /sustainability/activity-records"
      - "POST /sustainability/activity-records/{id}/evidence"
      - "POST /sustainability/activity-records/{id}/transition to UNDER_REVIEW | SUBMITTED (resubmit)"
    shared_operations:
      - "GET reads on all business resources"
  - name: DisclosureLead
    description: "Preparer of framework questionnaire responses (CDP/GRI/ECOVADIS)"
    identity: opaque
    exclusive_operations:
      - "POST /sustainability/questionnaire-responses, /answers, /transition"
    shared_operations:
      - "GET reads on all business resources"
  - name: AssuranceProvider
    description: "External assurance practitioner: read-only plus the ASSURED attestation"
    identity: opaque
    exclusive_operations:
      - "POST /sustainability/cycles/{id}/transition to ASSURED (requires assurance_statement)"
    shared_operations:
      - "GET reads on all business resources"
  - name: SupplierContact
    description: "External supplier respondent: may only read its engagement and respond with scope-3 data; X-User-ID must equal the engagement's contact_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /sustainability/supplier-engagements/{id}/respond"
    shared_operations:
      - "GET /sustainability/supplier-engagements/{id} and list (shared with Manager, Analyst, AssuranceProvider)"
