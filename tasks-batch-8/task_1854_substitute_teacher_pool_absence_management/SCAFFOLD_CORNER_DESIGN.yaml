            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-09", hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { err2: $.data.error_id } }
          assert:
            - "Wednesday 2026-08-05 (weekday, outside range): err1 == ERR_TIMESHEET_OUT_OF_RANGE (409)"
            - "Sunday 2026-08-09 (not a weekday): err2 == ERR_INVALID_DATE_RANGE (422)"

      - name: extend_requires_long_term_approval_then_succeeds
        claim_type: conditional_action
        grounds:
