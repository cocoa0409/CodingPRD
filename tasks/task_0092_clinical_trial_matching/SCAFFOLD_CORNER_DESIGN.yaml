              payload: { scope: "PROTOCOL" }
              as: CoordinatorStaff
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: rbac_missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request missing X-User-Role/X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /trials"
              payload: { title: "NoAuth", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: rbac_sponsor_cannot_decide_own_review_segregation
        claim_type: Segregation of duties
        grounds:
          - validations[priority=10]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.IRBReviewer
        distinguishing_aspect: "An IRBReviewer whose X-User-ID equals the trial's sponsor_user_id cannot decide the review — segregation of duties yields ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup:
            - "A trial created by sponsor-1 with a PENDING PROTOCOL review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
