# =============================================================================
# PRD Benchmark Seed Tables — Likeness, Voice and Synthetic Media Rights
# Difficulty target: beyond Expert (§0.4) — 11 entities / 44 endpoints /
# 41 error codes / 9 calculations / 7 state machines / 2 OCC races.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2688. Likeness, Voice and Synthetic Media Rights (talent rights and clearance office): consent documentation for digital replica creation with scope, duration and permitted use specificity, compensation structures for initial creation and each subsequent use with union minimums where applicable, approval rights over generated performances with review and rejection workflow, storage and security of biometric and voice data with retention limits and deletion obligations, unauthorized use detection through monitoring with takedown and legal escalation, post-mortem rights administration with estate consent and state law variation, disclosure and labeling requirements for synthetic content in advertising and entertainment, license expiration with removal obligations from distributed content

domain_name: likeness-rights-clearance
# Flat topology: every business resource is its own top-level collection, so the
# effective API prefix is the root. No shared parent segment.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys;
  # no entity is nested in another's URL path (the only sub-resource paths are
  # read-side reverse lookups and two attestation writes).

  state_machine_shape: parallel
  # UsageLicense carries two independent state dimensions on one row
  # (distribution_status x compliance_status). ConsentGrant, BiometricAsset,
  # DigitalReplica and GeneratedPerformance are cyclic; InfringementCase is
  # branching fork with divergent side-effect sets per branch. Talent carries a
  # derived posture field (CLEAR/RESTRICTED/FROZEN) that gates child operations.

  relationship_patterns:
    - one_to_many          # Talent -> ConsentGrant -> BiometricAsset / DigitalReplica
    - cross_aggregate      # InfringementCase -> UsageLicense; CompensationEntry -> UsageLicense
    - self_referential     # CompensationEntry.reverses_entry_id -> CompensationEntry.id
    - polymorphic_lite     # CompensationEntry attaches to either a performance or a license

  role_model: segregation_of_duties
  # The RightsAdministrator user who verified an EstateAuthority may not draft a
  # ConsentGrant naming it; the ComplianceOfficer user who triaged an
  # InfringementCase may not escalate it to legal.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Talent
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the performer whose likeness and voice are administered.
        constraints: 1-200 chars, non-blank
      - name: domicile_state_code
        type: string
        source: input
        description: >-
          Two-letter US state code of legal domicile. Resolves the governing
          StateLawProfile by matching StateLawProfile.state_code (a code join,
          not an id foreign key). For a DECEASED talent this is the domicile at
          death and is frozen by POST /talents/{id}/death-record.
        constraints: exactly 2 uppercase letters
      - name: union_code
        type: enum
        source: input
        description: Collective-bargaining affiliation that supplies statutory minimums.
        default: NONE
        constraints: one of {NONE, SAG_AFTRA, AFM}
      - name: life_status
        type: enum
        source: system
        description: Living/deceased flag driving post-mortem rights administration.
        default: LIVING
        constraints: one of {LIVING, DECEASED}; LIVING at creation, DECEASED only via POST /talents/{id}/death-record
      - name: date_of_death
        type: datetime
        source: input
        description: Date of death supplied to POST /talents/{id}/death-record; null while LIVING.
        default: null
        constraints: ISO 8601 UTC; must be <= logical now at recording time
      - name: postmortem_rights_until
        type: datetime
        source: computed
        description: >-
          Domicile-law post-mortem rights expiry produced by
          calculations.postmortem_rights_expiry (DOMICILE_LAW variant). Null while LIVING.
        default: null
      - name: postmortem_registration_number
        type: string
        source: computed
        description: >-
          Registration number copied from the VERIFIED EstateAuthority of this talent
          (EstateAuthority.registration_number). Null when no VERIFIED estate authority
          exists or that authority carries no registration.
        default: null
      - name: rights_posture
        type: enum
        source: computed
        description: >-
          Derived gate over all child operations, produced by
          calculations.talent_rights_posture. Recomputed on every side effect that
          touches open_removal_obligation_count, legal_hold_asset_count, consent
          suspension or infringement escalation.
        default: CLEAR
        constraints: one of {CLEAR, RESTRICTED, FROZEN}
      - name: open_removal_obligation_count
        type: integer
        source: computed
        description: Count of this talent's UsageLicense rows whose distribution_status == REMOVAL_PENDING.
        default: 0
        constraints: ">= 0"
      - name: legal_hold_asset_count
        type: integer
        source: computed
        description: Count of this talent's BiometricAsset rows whose status == LEGAL_HOLD.
        default: 0
        constraints: ">= 0"
      - name: lifetime_compensation_cents
        type: integer
        source: computed
        description: >-
          Signed sum of CompensationEntry.amount_cents over every entry whose
          talent_id == this talent (reversals included). Integer cents.
        default: 0

  - name: StateLawProfile
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code; unique across StateLawProfile rows.
        constraints: exactly 2 uppercase letters, unique
      - name: postmortem_rights_years
        type: integer
        source: input
        description: Years of post-mortem likeness rights recognised by this state; 0 means the state recognises none.
        constraints: 0-100
      - name: postmortem_requires_registration
        type: boolean
        source: input
        description: When true, post-mortem rights are unenforceable until the estate supplies a registration_number.
      - name: biometric_retention_max_days
        type: integer
        source: input
        description: Statutory ceiling in days on retaining a biometric or voice payload from its capture date.
        constraints: 1-3650
      - name: deletion_grace_days
        type: integer
        source: input
        description: Days after a consent's effective end during which the payload may still be retained before deletion is due.
        constraints: 0-365
      - name: removal_window_days
        type: integer
        source: input
        description: Days a licensee gets to pull expired synthetic content out of distribution.
        constraints: 1-90
      - name: disclosure_required_advertising
        type: boolean
        source: input
        description: Whether synthetic-content disclosure is mandatory for channel ADVERTISING in this state.
      - name: disclosure_required_entertainment
        type: boolean
        source: input
        description: Whether synthetic-content disclosure is mandatory for channel ENTERTAINMENT in this state.
      - name: min_disclosure_rank_advertising
        type: integer
        source: input
        description: >-
          Minimum acceptable disclosure placement rank for channel ADVERTISING, on the
          fixed ladder METADATA_ONLY=1 < END_CARD=2 < PRE_ROLL=3 < PERSISTENT_BUG=4.
        constraints: 1-4
      - name: min_disclosure_rank_entertainment
        type: integer
        source: input
        description: Minimum acceptable disclosure placement rank for channel ENTERTAINMENT on the same ladder.
        constraints: 1-4

  - name: UnionMinimumSchedule
    parent: null
    common_fields: false
    fields:
      - name: union_code
        type: enum
        source: input
        description: Union whose schedule this row states.
        constraints: one of {SAG_AFTRA, AFM}
      - name: media_type
        type: enum
        source: input
        description: Media type the minimums apply to.
        constraints: one of {ADVERTISING, FEATURE_FILM, EPISODIC, VIDEO_GAME, SOCIAL}
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which this schedule row governs; selection picks the latest row at or before a consent's effective_from.
        constraints: ISO 8601 UTC
      - name: minimum_initial_cents
        type: integer
        source: input
        description: Statutory floor in cents for the initial digital-replica creation payment.
        constraints: ">= 0"
      - name: minimum_per_use_cents
        type: integer
        source: input
        description: Statutory floor in cents for each subsequent use payment.
        constraints: ">= 0"

  - name: EstateAuthority
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: FK -> Talent.id; the deceased talent whose post-mortem rights this authority administers.
      - name: executor_name
        type: string
        source: input
        description: Name of the executor or administrator named in the probate documentation.
        constraints: 1-200 chars, non-blank
      - name: court_document_ref
        type: string
        source: input
        description: Opaque reference to the filed letters testamentary / court order.
        constraints: 1-120 chars, non-blank
      - name: registration_number
        type: string
        source: input
        description: >-
          State post-mortem rights registration number. Null when the estate has not
          registered; states whose profile sets postmortem_requires_registration == true
          treat a null here as unregistered.
        default: null
      - name: status
        type: enum
        source: system
        description: Verification lifecycle of the estate documentation.
        default: SUBMITTED
        constraints: one of {SUBMITTED, VERIFIED, REJECTED}
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsAdministrator that filed the documentation.
      - name: verified_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the RightsAdministrator that verified the documentation; null until
          verified. Segregation of duties compares this against the drafter of any
          ConsentGrant naming this authority.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of verification; null until verified.
        default: null

  - name: ConsentGrant
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: FK -> Talent.id; the talent (or, post-mortem, the estate's principal) granting consent.
      - name: estate_authority_id
        type: string
        source: input
        description: >-
          FK -> EstateAuthority.id; required when grantor_kind == ESTATE, must be null when
          grantor_kind == TALENT.
        default: null
      - name: grantor_kind
        type: enum
        source: input
        description: Who executes the grant — the living talent or the verified estate.
        constraints: one of {TALENT, ESTATE}
      - name: permitted_media_types
        type: array
        source: input
        description: >-
          Explicit list of media types the replica may be used in. Every
          GeneratedPerformance.media_type must be a member of this list.
        constraints: 1-5 distinct members of {ADVERTISING, FEATURE_FILM, EPISODIC, VIDEO_GAME, SOCIAL}
      - name: permitted_use_notes
        type: string
        source: input
        description: Free-text specificity clause recording the permitted uses negotiated with the talent.
        constraints: 1-500 chars, non-blank
      - name: territory_codes
        type: array
        source: input
        description: >-
          Explicit list of ISO 3166-1 alpha-2 territory codes the grant covers. Every
          GeneratedPerformance and UsageLicense territory must be a member of this list.
        constraints: 1-20 distinct 2-letter uppercase codes
      - name: exclusivity
        type: enum
        source: input
        description: EXCLUSIVE grants block any other overlapping grant on the same talent/media/territory.
        constraints: one of {EXCLUSIVE, NON_EXCLUSIVE}
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the consent term (half-open interval start).
        constraints: ISO 8601 UTC
      - name: effective_until
        type: datetime
        source: input
        description: Exclusive end of the consent term (half-open interval end); must be strictly after effective_from.
        constraints: ISO 8601 UTC
      - name: effective_end_actual
        type: datetime
        source: computed
        description: >-
          Instant the term actually ended — effective_until on natural expiry, or the
          logical-clock instant of revocation. Null while the grant has not ended. Feeds
          calculations.biometric_retention_deadline.
        default: null
      - name: initial_creation_fee_cents
        type: integer
        source: input
        description: Negotiated fee in cents for creating the digital replica, before multipliers and union floors.
        constraints: ">= 0"
      - name: per_use_base_fee_cents
        type: integer
        source: input
        description: Negotiated base fee in cents for each subsequent use, before multipliers and union floors.
        constraints: ">= 0"
      - name: talent_share_pct
        type: number
        source: input
        description: Share of every compensation entry payable to the talent (or estate).
        default: 0.75
        constraints: 0 < value <= 1, at most 4 decimals
      - name: agency_share_pct
        type: number
        source: input
        description: Share of every compensation entry payable to the representing agency.
        default: 0.20
        constraints: 0 <= value < 1, at most 4 decimals; talent_share_pct + agency_share_pct <= 1
      - name: administrator_share_pct
        type: number
        source: computed
        description: Residual share retained by the clearance office; equals 1 - talent_share_pct - agency_share_pct.
      - name: approval_required
        type: boolean
        source: input
        description: When true, every GeneratedPerformance needs an explicit approval decision from the talent or estate representative.
        default: true
      - name: revocable
        type: boolean
        source: input
        description: When false, POST /consent-grants/{id}/revoke is refused for this grant.
        default: true
      - name: union_code_snapshot
        type: enum
        source: computed
        description: Talent.union_code copied at grant creation; pins which union schedule governs even if the talent's affiliation later changes.
        constraints: one of {NONE, SAG_AFTRA, AFM}
      - name: status
        type: enum
        source: system
        description: Consent lifecycle.
        default: PENDING_COUNTERSIGN
        constraints: one of {PENDING_COUNTERSIGN, ACTIVE, SUSPENDED, REVOKED, EXPIRED}
      - name: suspension_reason
        type: enum
        source: system
        description: Why the grant sits in SUSPENDED; null otherwise.
        default: null
        constraints: one of {DEATH_PENDING_ESTATE, COMPLIANCE_HOLD}
      - name: drafted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsAdministrator that created the grant.
      - name: countersigned_at
        type: datetime
        source: system
        description: Logical-clock instant the talent or estate representative countersigned; null before.
        default: null
      - name: initial_compensation_cents
        type: integer
        source: computed
        description: Amount posted by calculations.initial_creation_compensation at countersign, before any union top-up.
        default: 0
      - name: union_topup_cents
        type: integer
        source: computed
        description: Amount posted as the UNION_TOPUP entry at countersign; 0 when the computed initial amount already meets the floor.
        default: 0
      - name: total_compensation_cents
        type: integer
        source: computed
        description: >-
          Signed sum of CompensationEntry.amount_cents over entries whose
          consent_grant_id == this grant. Must equal that sum at all times.
        default: 0

  - name: BiometricAsset
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: FK -> Talent.id; subject of the captured biometric or voice data.
      - name: consent_grant_id
        type: string
        source: input
        description: FK -> ConsentGrant.id; the grant that authorises capture and retention of this payload.
      - name: asset_kind
        type: enum
        source: input
        description: Kind of captured payload.
        constraints: one of {FACE_SCAN, VOICE_SAMPLE, MOTION_CAPTURE}
      - name: capture_ref
        type: string
        source: input
        description: Opaque reference to the capture session record.
        constraints: 1-120 chars, non-blank
      - name: storage_class
        type: enum
        source: input
        description: Where the payload is held.
        default: ENCRYPTED_VAULT
        constraints: one of {ENCRYPTED_VAULT, COLD_ARCHIVE}
      - name: payload_digest
        type: string
        source: input
        description: Digest of the stored payload; set to null when the asset is PURGED so deletion is observable.
        constraints: 1-128 chars, non-blank at creation
      - name: status
        type: enum
        source: system
        description: Retention lifecycle of the payload.
        default: STORED
        constraints: one of {STORED, PURGE_SCHEDULED, LEGAL_HOLD, PURGED}
      - name: retention_until
        type: datetime
        source: computed
        description: >-
          Binding deletion obligation produced by calculations.biometric_retention_deadline
          (the earlier of the statutory ceiling and the consent-term obligation).
      - name: purge_due_at
        type: datetime
        source: computed
        description: retention_until + PURGE_EXECUTION_GRACE_DAYS, stamped when the asset enters PURGE_SCHEDULED; null otherwise.
        default: null
      - name: purged_at
        type: datetime
        source: system
        description: Logical-clock instant the payload was destroyed; null until PURGED.
        default: null
      - name: held_from_status
        type: enum
        source: system
        description: >-
          Status the asset occupied immediately before entering LEGAL_HOLD, so releasing the
          hold restores exactly that status. Null when status != LEGAL_HOLD.
        default: null
        constraints: one of {STORED, PURGE_SCHEDULED}

  - name: DigitalReplica
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: FK -> Talent.id; subject of the replica.
      - name: consent_grant_id
        type: string
        source: input
        description: FK -> ConsentGrant.id; the grant authorising this replica's creation and use.
      - name: replica_kind
        type: enum
        source: input
        description: Modality of the trained replica.
        constraints: one of {FACE, VOICE, FULL_PERFORMANCE}
      - name: source_asset_ids
        type: array
        source: input
        description: >-
          Array of BiometricAsset.id values the replica was trained from. Every member must
          be a BiometricAsset whose talent_id and consent_grant_id equal this replica's and
          whose status is STORED at creation time. Must contain at least one member.
        constraints: 1-10 distinct BiometricAsset.id values
      - name: build_ref
        type: string
        source: input
        description: Opaque reference to the model build artifact.
        constraints: 1-120 chars, non-blank
      - name: status
        type: enum
        source: system
        description: Replica lifecycle.
        default: BUILT
        constraints: one of {BUILT, APPROVED_FOR_USE, QUARANTINED, RETIRED}
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant the talent or estate representative approved the replica for use; null before.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the representative that approved the replica; null before approval.
        default: null
      - name: quarantine_reason
        type: enum
        source: system
        description: Why the replica sits in QUARANTINED; null otherwise.
        default: null
        constraints: one of {CONSENT_REVOKED, SOURCE_LEGAL_HOLD, ESTATE_PENDING}
      - name: held_from_status
        type: enum
        source: system
        description: >-
          Status the replica occupied immediately before entering QUARANTINED, so release
          restores exactly that status. Null when status != QUARANTINED.
        default: null
        constraints: one of {BUILT, APPROVED_FOR_USE}
      - name: open_license_count
        type: integer
        source: computed
        description: Count of UsageLicense rows on this replica's performances whose distribution_status is ISSUED or LIVE.
        default: 0

  - name: GeneratedPerformance
    parent: null
    common_fields: true
    fields:
      - name: digital_replica_id
        type: string
        source: input
        description: FK -> DigitalReplica.id; the replica that produced this output.
      - name: licensee_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the LicenseeProducer that submitted the performance. Opaque operator
          identifier, never an entity id; ownership checks compare X-User-ID to this field.
      - name: licensee_name
        type: string
        source: input
        description: Display name of the licensee organisation submitting the generated performance.
        constraints: 1-200 chars, non-blank
      - name: media_type
        type: enum
        source: input
        description: Media type the output is destined for; must be a member of the governing grant's permitted_media_types.
        constraints: one of {ADVERTISING, FEATURE_FILM, EPISODIC, VIDEO_GAME, SOCIAL}
      - name: territory_codes
        type: array
        source: input
        description: Territories the submission covers; every member must be in the governing grant's territory_codes.
        constraints: 1-20 distinct 2-letter uppercase codes
      - name: intended_use_description
        type: string
        source: input
        description: Specific description of the intended use presented to the approver.
        constraints: 1-500 chars, non-blank
      - name: projected_impressions
        type: integer
        source: input
        description: Reach the licensee projects for this output; drives the PROVISIONAL per-use variant.
        constraints: ">= 0"
      - name: scheduled_first_use_at
        type: datetime
        source: input
        description: Planned first distribution instant; must fall inside the governing grant's term.
        constraints: ISO 8601 UTC
      - name: review_status
        type: enum
        source: system
        description: Approval-rights lifecycle over the generated output.
        default: SUBMITTED
        constraints: one of {SUBMITTED, REVISION_REQUESTED, APPROVED, REJECTED, WITHDRAWN}
      - name: revision_round
        type: integer
        source: system
        description: Number of revision cycles consumed; incremented on each resubmission.
        default: 0
        constraints: 0-3
      - name: review_deadline
        type: datetime
        source: computed
        description: >-
          submitted_at + REVIEW_WINDOW_DAYS. Recomputed on every resubmission. The compliance
          sweep deems a lapsed review REJECTED rather than approved.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the representative that recorded the latest review decision; null before any decision.
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: Reason recorded when review_status becomes REJECTED; null otherwise.
        default: null
        constraints: one of {OFF_BRAND, OUT_OF_SCOPE, QUALITY, REVIEW_WINDOW_LAPSED, REVISION_LIMIT_REACHED}
      - name: review_note
        type: string
        source: input
        description: Note captured with the latest review decision; null before any decision.
        default: null
      - name: provisional_compensation_cents
        type: integer
        source: computed
        description: >-
          Amount of the PER_USE_PROVISIONAL entry posted at submission by the PROVISIONAL
          variant of calculations.per_use_compensation. Reset to 0 when the accrual is reversed.
        default: 0

  - name: UsageLicense
    parent: null
    common_fields: true
    fields:
      - name: generated_performance_id
        type: string
        source: input
        description: FK -> GeneratedPerformance.id; the APPROVED output being licensed for distribution.
      - name: licensee_user_id
        type: string
        source: computed
        description: >-
          Copied from GeneratedPerformance.licensee_user_id at issuance. Opaque operator
          identifier; LicenseeProducer ownership checks compare X-User-ID to this field.
      - name: channel
        type: enum
        source: input
        description: Distribution channel, which selects the state's disclosure rule and the compliance surcharge rate.
        constraints: one of {ADVERTISING, ENTERTAINMENT}
      - name: territory_codes
        type: array
        source: input
        description: Territories licensed for distribution; every member must be in the governing grant's territory_codes.
        constraints: 1-20 distinct 2-letter uppercase codes
      - name: distribution_start
        type: datetime
        source: input
        description: Inclusive start of the distribution window (closed interval start).
        constraints: ISO 8601 UTC
      - name: distribution_end
        type: datetime
        source: input
        description: Inclusive end of the distribution window (closed interval end); must be >= distribution_start.
        constraints: ISO 8601 UTC
      - name: actual_impressions
        type: integer
        source: input
        description: Contracted actual reach for the licensed window; drives the FINAL per-use variant.
        constraints: ">= 0"
      - name: distribution_reference
        type: string
        source: input
        description: URL or asset reference where the synthetic content is distributed; reused as suspect_url when a sweep opens a case on an overdue removal.
        constraints: 1-300 chars, non-blank
      - name: distribution_status
        type: enum
        source: system
        description: First independent state dimension — where the licensed content stands in distribution.
        default: ISSUED
        constraints: one of {ISSUED, LIVE, REMOVAL_PENDING, REMOVAL_CONFIRMED}
      - name: compliance_status
        type: enum
        source: system
        description: >-
          Second independent state dimension — where the synthetic-content disclosure stands.
          Evolves independently of distribution_status on the same row.
        default: PENDING_LABEL
        constraints: one of {PENDING_LABEL, LABELED, VERIFIED, NON_COMPLIANT}
      - name: disclosure_required
        type: boolean
        source: computed
        description: >-
          Taken from the talent's domicile StateLawProfile at issuance —
          disclosure_required_advertising for channel ADVERTISING, else
          disclosure_required_entertainment. When false, compliance_status starts at VERIFIED.
      - name: disclosure_placement
        type: enum
        source: input
        description: Placement attested by the licensee; null until attestation.
        default: null
        constraints: one of {METADATA_ONLY, END_CARD, PRE_ROLL, PERSISTENT_BUG}
      - name: disclosure_label_text
        type: string
        source: input
        description: Label copy attested by the licensee; null until attestation.
        default: null
        constraints: 1-200 chars, non-blank when supplied
      - name: disclosure_verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that verified or rejected the label; null before.
        default: null
      - name: per_use_final_cents
        type: integer
        source: computed
        description: Amount of the PER_USE_FINAL entry posted at issuance by the FINAL variant of calculations.per_use_compensation.
        default: 0
      - name: compliance_surcharge_cents
        type: integer
        source: computed
        description: >-
          Clearance-office surcharge produced by calculations.license_total_cost. Paid by the
          licensee to the office; it is deliberately NOT a CompensationEntry.
        default: 0
      - name: license_total_cents
        type: integer
        source: computed
        description: per_use_final_cents + compliance_surcharge_cents, per the pinned evaluation order in calculations.license_total_cost.
        default: 0
      - name: removal_deadline
        type: datetime
        source: computed
        description: Instant by which the content must be out of distribution once distribution_status becomes REMOVAL_PENDING; null before.
        default: null
      - name: removal_reason
        type: enum
        source: system
        description: Why removal became due; null while no removal obligation exists.
        default: null
        constraints: one of {TERM_EXPIRED, CONSENT_REVOKED, REPLICA_QUARANTINED, PERFORMANCE_WITHDRAWN}
      - name: removal_confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant the licensee confirmed removal; null before.
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the RightsAdministrator that issued the license.

  - name: CompensationEntry
    parent: null
    common_fields: false
    fields:
      - name: talent_id
        type: string
        source: computed
        description: FK -> Talent.id; copied from the governing grant so the talent ledger is filterable.
      - name: consent_grant_id
        type: string
        source: computed
        description: FK -> ConsentGrant.id; the grant this money moves under.
      - name: generated_performance_id
        type: string
        source: computed
        description: FK -> GeneratedPerformance.id; set for PER_USE_PROVISIONAL entries and for the REVERSAL that undoes one; null otherwise.
        default: null
      - name: usage_license_id
        type: string
        source: computed
        description: FK -> UsageLicense.id; set for PER_USE_FINAL entries; null otherwise.
        default: null
      - name: reverses_entry_id
        type: string
        source: computed
        description: FK -> CompensationEntry.id; set only on REVERSAL entries, naming the entry being undone.
        default: null
      - name: entry_type
        type: enum
        source: computed
        description: Kind of ledger movement.
        constraints: one of {INITIAL_CREATION, UNION_TOPUP, PER_USE_PROVISIONAL, PER_USE_FINAL, REVERSAL}
      - name: amount_cents
        type: integer
        source: computed
        description: Signed amount in cents; negative only for REVERSAL entries.
      - name: talent_share_cents
        type: integer
        source: computed
        description: Talent's slice of amount_cents per calculations.royalty_share_split (carries the rounding remainder).
      - name: agency_share_cents
        type: integer
        source: computed
        description: Agency's slice of amount_cents per calculations.royalty_share_split.
      - name: administrator_share_cents
        type: integer
        source: computed
        description: Clearance office's slice of amount_cents per calculations.royalty_share_split.
      - name: memo
        type: string
        source: computed
        description: Machine-generated description of why the entry was posted.
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the entry was appended. Entries are immutable once written.

  - name: InfringementCase
    parent: null
    common_fields: true
    fields:
      - name: talent_id
        type: string
        source: input
        description: FK -> Talent.id; the talent whose likeness or voice was detected in the suspect content.
      - name: matched_usage_license_id
        type: string
        source: input
        description: >-
          FK -> UsageLicense.id; the license the triage step matched the detection to. Null on
          creation; set only when triage resolves the detection as licensed, or when a sweep
          opens the case against an overdue removal.
        default: null
      - name: detection_source
        type: enum
        source: input
        description: How the detection arrived.
        default: MONITORING_FEED
        constraints: one of {MONITORING_FEED, SWEEP, MANUAL_REPORT}
      - name: suspect_url
        type: string
        source: input
        description: Location of the suspected unauthorized synthetic content.
        constraints: 1-300 chars, non-blank
      - name: detected_channel
        type: enum
        source: input
        description: Channel the suspect content was distributed in.
        constraints: one of {ADVERTISING, ENTERTAINMENT}
      - name: detected_state_code
        type: string
        source: input
        description: >-
          Two-letter US state code where the use was observed. Resolves the use-state
          StateLawProfile by state_code for the USE_STATE_LAW variant of
          calculations.postmortem_rights_expiry.
        constraints: exactly 2 uppercase letters
      - name: detected_view_count
        type: integer
        source: input
        description: Observed view count of the suspect content; feeds the severity score.
        constraints: ">= 0"
      - name: match_confidence
        type: number
        source: input
        description: Monitoring vendor's confidence that the content contains this talent's replica.
        constraints: 0 <= value <= 1, at most 3 decimals
      - name: severity_score
        type: number
        source: computed
        description: Weighted score produced by calculations.infringement_severity_score, rounded to 4 decimals.
      - name: use_state_rights_until
        type: datetime
        source: computed
        description: >-
          Post-mortem expiry under the detected_state_code profile (USE_STATE_LAW variant).
          Null when the talent is LIVING.
        default: null
      - name: enforceable_under_use_state
        type: boolean
        source: computed
        description: >-
          True when the talent is LIVING, or when the talent is DECEASED and the logical clock
          is at or before use_state_rights_until. False blocks takedown issuance.
        default: true
      - name: status
        type: enum
        source: system
        description: Case lifecycle; branches at triage and again at resolution.
        default: DETECTED
        constraints: one of {DETECTED, DISMISSED_LICENSED, DISMISSED_NO_ACTION, TAKEDOWN_ISSUED, RESOLVED_REMOVED, LEGAL_ESCALATED, CLOSED_SETTLED, CLOSED_LITIGATED}
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that triaged the case; null before triage.
        default: null
      - name: escalated_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the ComplianceOfficer that escalated the case to legal; null before.
          Segregation of duties forbids this equalling triaged_by_user_id.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that closed the case; null before closure.
        default: null
      - name: takedown_issued_at
        type: datetime
        source: system
        description: Logical-clock instant the takedown notice was issued; null before.
        default: null
      - name: legal_hold_applied_count
        type: integer
        source: computed
        description: Number of BiometricAsset rows this case moved into LEGAL_HOLD when it escalated; released again at closure.
        default: 0
      - name: closure_outcome
        type: enum
        source: system
        description: Outcome recorded at closure; null before.
        default: null
        constraints: one of {REMOVED, SETTLED, LITIGATED}

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Talent
    initial_state: LIVING
    terminal_states: [DECEASED]
    note: >-
      life_status is the only stored state dimension. rights_posture is a derived gate
      (calculations.talent_rights_posture) recomputed by every side effect below, never set
      directly by a request.
    transitions:
      - from: LIVING
        to: DECEASED
        trigger: "POST /talents/{id}/death-record"
        actor: RightsAdministrator
        preconditions:
          - "talent.life_status == LIVING"
          - "payload date_of_death <= logical now"
          - "a StateLawProfile row exists whose state_code == talent.domicile_state_code, else ERR_STATE_LAW_PROFILE_MISSING"
        side_effects:
          - "hop 1: sets date_of_death, life_status = DECEASED, and computes postmortem_rights_until via calculations.postmortem_rights_expiry (DOMICILE_LAW variant)"
          - "hop 2 (caused by hop 1): every ConsentGrant with talent_id == this talent, status == ACTIVE and grantor_kind == TALENT moves ACTIVE -> SUSPENDED with suspension_reason = DEATH_PENDING_ESTATE, processed created_at ASC"
          - "hop 3 (caused by hop 2): because those grants are now SUSPENDED, every DigitalReplica whose consent_grant_id is in that set and whose status is BUILT or APPROVED_FOR_USE moves to QUARANTINED with quarantine_reason = ESTATE_PENDING and held_from_status = its status before this hop, processed created_at ASC"
          - "hop 4 (caused by hop 2): because at least one grant is SUSPENDED, Talent.rights_posture is recomputed and becomes RESTRICTED unless a LEGAL_ESCALATED case already makes it FROZEN"
          - "increments Talent.version by 1, and the version of every ConsentGrant and DigitalReplica mutated above"

  - entity: ConsentGrant
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [REVOKED, EXPIRED]
    note: "Cyclic: ACTIVE <-> SUSPENDED may repeat any number of times before a terminal state."
    transitions:
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /consent-grants/{id}/countersign"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "consent.status == PENDING_COUNTERSIGN"
          - "talent.rights_posture != FROZEN"
          - "grantor_kind == TALENT: talent.life_status == LIVING and X-User-ID == consent.talent_id"
          - "grantor_kind == ESTATE: the EstateAuthority named by estate_authority_id has status == VERIFIED and X-User-ID == consent.estate_authority_id"
        side_effects:
          - "countersigned_at = logical now; status = ACTIVE"
          - "runs calculations.initial_creation_compensation: appends one CompensationEntry(entry_type=INITIAL_CREATION) and, only when the union floor strictly exceeds the computed amount, a second CompensationEntry(entry_type=UNION_TOPUP) for the difference"
          - "each appended entry's talent_share_cents / agency_share_cents / administrator_share_cents come from calculations.royalty_share_split"
          - "recomputes ConsentGrant.initial_compensation_cents, union_topup_cents and total_compensation_cents; recomputes Talent.lifetime_compensation_cents"
          - "increments ConsentGrant.version and Talent.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /consent-grants/{id}/suspension with action = SUSPEND"
        actor: ComplianceOfficer | RightsAdministrator
        preconditions:
          - "consent.status == ACTIVE"
        side_effects:
          - "suspension_reason = COMPLIANCE_HOLD"
          - "Talent.rights_posture recomputed -> RESTRICTED unless already FROZEN"
          - "deliberately does NOT quarantine replicas — contrast with the death-record cascade, which does"
          - "increments ConsentGrant.version and Talent.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /consent-grants/{id}/suspension with action = REINSTATE"
        actor: RightsAdministrator
        preconditions:
          - "consent.status == SUSPENDED"
          - "when suspension_reason == DEATH_PENDING_ESTATE: the talent has an EstateAuthority with status == VERIFIED; and if that talent's domicile StateLawProfile.postmortem_requires_registration is true then that authority's registration_number is not null, else ERR_POSTMORTEM_REGISTRATION_MISSING"
          - "when suspension_reason == DEATH_PENDING_ESTATE: logical now <= talent.postmortem_rights_until, else ERR_POSTMORTEM_RIGHTS_EXPIRED"
        side_effects:
          - "status = ACTIVE; suspension_reason = null"
          - "every DigitalReplica with consent_grant_id == this grant, status == QUARANTINED and quarantine_reason == ESTATE_PENDING is restored to its held_from_status; quarantine_reason and held_from_status are cleared, processed created_at ASC"
          - "Talent.rights_posture recomputed"
          - "increments ConsentGrant.version and Talent.version by 1"
      - from: PENDING_COUNTERSIGN
        to: REVOKED
        trigger: "POST /consent-grants/{id}/revoke"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "consent.revocable == true, else ERR_CONSENT_NOT_REVOCABLE"
          - "ownership: grantor_kind == TALENT requires X-User-ID == consent.talent_id; grantor_kind == ESTATE requires X-User-ID == consent.estate_authority_id"
        side_effects:
          - "status = REVOKED; effective_end_actual = logical now"
          - "no downstream objects exist yet at this state, so only Talent.rights_posture is recomputed"
          - "increments ConsentGrant.version and Talent.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /consent-grants/{id}/revoke"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "consent.revocable == true, else ERR_CONSENT_NOT_REVOCABLE"
          - "ownership as above"
        side_effects:
          - "hop 1: status = REVOKED; effective_end_actual = logical now"
          - "hop 2 (caused by hop 1): because the grant is REVOKED, every BiometricAsset with consent_grant_id == this grant and status in {STORED, PURGE_SCHEDULED} has retention_until recomputed by calculations.biometric_retention_deadline against the new effective_end_actual (purge_due_at recomputed when status == PURGE_SCHEDULED), processed created_at ASC"
          - "hop 2 (caused by hop 1): every DigitalReplica with consent_grant_id == this grant and status in {BUILT, APPROVED_FOR_USE} moves to QUARANTINED with quarantine_reason = CONSENT_REVOKED and held_from_status = its prior status, processed created_at ASC"
          - "hop 3 (caused by hop 2): because those replicas are QUARANTINED, every GeneratedPerformance with digital_replica_id in that set and review_status in {SUBMITTED, REVISION_REQUESTED, APPROVED} moves to WITHDRAWN, processed created_at ASC; for each withdrawn performance whose provisional_compensation_cents > 0 a CompensationEntry(entry_type=REVERSAL, amount_cents = -provisional_compensation_cents, reverses_entry_id = that PER_USE_PROVISIONAL entry) is appended and provisional_compensation_cents is set to 0"
          - "hop 4 (caused by hop 3): because those performances are WITHDRAWN, every UsageLicense with generated_performance_id in that set and distribution_status in {ISSUED, LIVE} moves to REMOVAL_PENDING with removal_reason = CONSENT_REVOKED and removal_deadline = logical now + StateLawProfile.removal_window_days of the talent's domicile state, processed created_at ASC; DigitalReplica.open_license_count is recomputed"
          - "hop 5 (caused by hop 4): because each such license now carries a removal obligation, Talent.open_removal_obligation_count is recomputed and Talent.rights_posture becomes RESTRICTED unless a LEGAL_ESCALATED case already makes it FROZEN"
          - "recomputes ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents from the appended reversals"
          - "increments the version of the grant, the talent, and every asset/replica/performance/license mutated above by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /consent-grants/{id}/revoke"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "consent.revocable == true"
          - "ownership as above"
        side_effects:
          - "identical cascade to the ACTIVE -> REVOKED transition (hops 1-5)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /compliance-sweeps phase 1"
        actor: system
        preconditions:
          - "consent.effective_until <= logical now"
        side_effects:
          - "hop 1: status = EXPIRED; effective_end_actual = effective_until"
          - "hop 2 (caused by hop 1): every BiometricAsset with consent_grant_id == this grant and status in {STORED, PURGE_SCHEDULED} has retention_until recomputed against effective_end_actual, processed created_at ASC"
          - "hop 2 (caused by hop 1): every DigitalReplica with consent_grant_id == this grant and status in {BUILT, APPROVED_FOR_USE} moves to RETIRED, processed created_at ASC"
          - "Talent.rights_posture recomputed; increments the version of every row mutated"
          - "note: expiry does NOT itself pull distributed content — each UsageLicense keeps running until its own distribution_end is reached in phase 2"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: POST /compliance-sweeps phase 1"
        actor: system
        preconditions:
          - "consent.effective_until <= logical now"
        side_effects:
          - "identical to the ACTIVE -> EXPIRED transition"

  - entity: BiometricAsset
    initial_state: STORED
    terminal_states: [PURGED]
    note: "Cyclic: STORED/PURGE_SCHEDULED <-> LEGAL_HOLD; a hold release restores exactly held_from_status."
    transitions:
      - from: STORED
        to: PURGE_SCHEDULED
        trigger: "system: POST /compliance-sweeps phase 5a"
        actor: system
        preconditions:
          - "asset.status == STORED"
          - "asset.retention_until <= logical now (inclusive: equality schedules the purge)"
        side_effects:
          - "purge_due_at = retention_until + PURGE_EXECUTION_GRACE_DAYS days"
          - "increments BiometricAsset.version by 1"
      - from: PURGE_SCHEDULED
        to: PURGED
        trigger: "system: POST /compliance-sweeps phase 5b"
        actor: system
        preconditions:
          - "asset.status == PURGE_SCHEDULED"
          - "asset.purge_due_at <= logical now"
        side_effects:
          - "payload_digest = null; purged_at = logical now"
          - "increments BiometricAsset.version by 1"
      - from: STORED
        to: PURGED
        trigger: "POST /biometric-assets/{id}/purge"
        actor: RightsAdministrator
        preconditions:
          - "asset.status in {STORED, PURGE_SCHEDULED}, else ERR_INVALID_ASSET_STATE — except LEGAL_HOLD, which reports ERR_ASSET_UNDER_LEGAL_HOLD from the priority 52 rung"
          - "asset.status != LEGAL_HOLD, else ERR_ASSET_UNDER_LEGAL_HOLD"
          - "no DigitalReplica whose source_asset_ids contains this asset id has status in {BUILT, APPROVED_FOR_USE}, else ERR_ASSET_BOUND_TO_ACTIVE_REPLICA"
        side_effects:
          - "payload_digest = null; purged_at = logical now; purge_due_at unchanged"
          - "increments BiometricAsset.version by 1"
      - from: PURGE_SCHEDULED
        to: PURGED
        trigger: "POST /biometric-assets/{id}/purge"
        actor: RightsAdministrator
        preconditions:
          - "same preconditions as the STORED -> PURGED manual purge"
        side_effects:
          - "same as the STORED -> PURGED manual purge"
      - from: STORED
        to: LEGAL_HOLD
        trigger: "system: cascade hop 2 of POST /infringement-cases/{id}/escalate"
        actor: system
        preconditions:
          - "an InfringementCase for this asset's talent has just entered LEGAL_ESCALATED"
        side_effects:
          - "held_from_status = STORED; purge_due_at is left untouched so the release can resume the same schedule"
          - "Talent.legal_hold_asset_count recomputed; InfringementCase.legal_hold_applied_count incremented"
          - "increments BiometricAsset.version by 1"
      - from: PURGE_SCHEDULED
        to: LEGAL_HOLD
        trigger: "system: cascade hop 2 of POST /infringement-cases/{id}/escalate"
        actor: system
        preconditions:
          - "an InfringementCase for this asset's talent has just entered LEGAL_ESCALATED"
        side_effects:
          - "held_from_status = PURGE_SCHEDULED; same counters as above"
      - from: LEGAL_HOLD
        to: STORED
        trigger: "system: cascade of POST /infringement-cases/{id}/close from LEGAL_ESCALATED"
        actor: system
        preconditions:
          - "asset.held_from_status == STORED"
          - "no other InfringementCase for this talent remains in LEGAL_ESCALATED"
        side_effects:
          - "held_from_status = null; Talent.legal_hold_asset_count recomputed"
          - "increments BiometricAsset.version by 1"
      - from: LEGAL_HOLD
        to: PURGE_SCHEDULED
        trigger: "system: cascade of POST /infringement-cases/{id}/close from LEGAL_ESCALATED"
        actor: system
        preconditions:
          - "asset.held_from_status == PURGE_SCHEDULED"
          - "no other InfringementCase for this talent remains in LEGAL_ESCALATED"
        side_effects:
          - "held_from_status = null; Talent.legal_hold_asset_count recomputed"

  - entity: DigitalReplica
    initial_state: BUILT
    terminal_states: [RETIRED]
    note: "Cyclic: BUILT/APPROVED_FOR_USE <-> QUARANTINED; release restores exactly held_from_status."
    transitions:
      - from: BUILT
        to: APPROVED_FOR_USE
        trigger: "POST /digital-replicas/{id}/approve-for-use"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "replica.status == BUILT, else ERR_INVALID_REPLICA_STATE"
          - "the governing ConsentGrant.status == ACTIVE, else ERR_CONSENT_NOT_ACTIVE"
          - "talent.rights_posture != FROZEN, else ERR_TALENT_RIGHTS_FROZEN"
          - "talent.life_status == DECEASED requires an EstateAuthority for this talent with status == VERIFIED, else ERR_ESTATE_AUTHORITY_UNVERIFIED"
          - "ownership: TalentRepresentative requires X-User-ID == replica.talent_id; EstateRepresentative requires X-User-ID == the VERIFIED EstateAuthority.id of replica.talent_id"
        side_effects:
          - "approved_at = logical now; approved_by_user_id = X-User-ID"
          - "increments DigitalReplica.version by 1"
      - from: BUILT
        to: QUARANTINED
        trigger: "system: cascade from consent revoke (hop 2), death record (hop 3), or case escalation (hop 3)"
        actor: system
        preconditions:
          - "the triggering cascade names this replica"
        side_effects:
          - "held_from_status = BUILT; quarantine_reason = CONSENT_REVOKED | ESTATE_PENDING | SOURCE_LEGAL_HOLD per the triggering cascade"
          - "increments DigitalReplica.version by 1"
      - from: APPROVED_FOR_USE
        to: QUARANTINED
        trigger: "system: cascade from consent revoke (hop 2), death record (hop 3), or case escalation (hop 3)"
        actor: system
        preconditions:
          - "the triggering cascade names this replica"
        side_effects:
          - "held_from_status = APPROVED_FOR_USE; quarantine_reason set per the triggering cascade"
          - "onward hop: every GeneratedPerformance under this replica in {SUBMITTED, REVISION_REQUESTED, APPROVED} moves to WITHDRAWN (see the GeneratedPerformance machine)"
      - from: QUARANTINED
        to: BUILT
        trigger: "system: cascade from consent reinstatement or case closure"
        actor: system
        preconditions:
          - "replica.held_from_status == BUILT"
          - "the release condition of the triggering cascade holds (estate VERIFIED for ESTATE_PENDING; no remaining LEGAL_ESCALATED case for SOURCE_LEGAL_HOLD)"
        side_effects:
          - "quarantine_reason = null; held_from_status = null"
          - "increments DigitalReplica.version by 1"
      - from: QUARANTINED
        to: APPROVED_FOR_USE
        trigger: "system: cascade from consent reinstatement or case closure"
        actor: system
        preconditions:
          - "replica.held_from_status == APPROVED_FOR_USE"
          - "the release condition of the triggering cascade holds"
        side_effects:
          - "quarantine_reason = null; held_from_status = null; approved_at and approved_by_user_id are preserved (no re-approval needed)"
      - from: BUILT
        to: RETIRED
        trigger: "system: POST /compliance-sweeps phase 1 (governing consent EXPIRED)"
        actor: system
        preconditions:
          - "the governing ConsentGrant has just moved to EXPIRED"
        side_effects:
          - "held_from_status and quarantine_reason are cleared; RETIRED is terminal — no release path exists"
      - from: APPROVED_FOR_USE
        to: RETIRED
        trigger: "system: POST /compliance-sweeps phase 1 (governing consent EXPIRED)"
        actor: system
        preconditions:
          - "the governing ConsentGrant has just moved to EXPIRED"
        side_effects:
          - "held_from_status and quarantine_reason are cleared; RETIRED is terminal"

  - entity: GeneratedPerformance
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    note: >-
      Cyclic: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED, at most MAX_REVISION_ROUNDS times.
      The review window never deems approval — a lapse is a rejection, because approval rights
      are protective of the talent.
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /generated-performances/{id}/review with decision = APPROVE"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "performance.review_status == SUBMITTED, else ERR_INVALID_PERFORMANCE_STATE"
          - "the governing ConsentGrant.status == ACTIVE, else ERR_CONSENT_NOT_ACTIVE"
          - "talent.rights_posture != FROZEN, else ERR_TALENT_RIGHTS_FROZEN"
          - "ownership: X-User-ID == talent.id (TalentRepresentative) or the VERIFIED EstateAuthority.id of that talent (EstateRepresentative)"
        side_effects:
          - "review_status = APPROVED; reviewed_by_user_id = X-User-ID; review_note stored"
          - "the PER_USE_PROVISIONAL accrual is retained (it is only reversed on rejection, withdrawal or resubmission)"
          - "increments GeneratedPerformance.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /generated-performances/{id}/review with decision = REQUEST_REVISION"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "performance.review_status == SUBMITTED"
          - "performance.revision_round < MAX_REVISION_ROUNDS"
          - "same consent/posture/ownership preconditions as the APPROVE transition"
        side_effects:
          - "review_status = REVISION_REQUESTED; reviewed_by_user_id = X-User-ID; review_note stored"
          - "increments GeneratedPerformance.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /generated-performances/{id}/review with decision = REJECT, or with decision = REQUEST_REVISION when revision_round == MAX_REVISION_ROUNDS"
        actor: TalentRepresentative | EstateRepresentative
        preconditions:
          - "performance.review_status == SUBMITTED"
          - "same consent/posture/ownership preconditions as the APPROVE transition"
        side_effects:
          - "review_status = REJECTED; rejection_reason = the payload's rejection_reason for an explicit REJECT, or REVISION_LIMIT_REACHED when a REQUEST_REVISION arrives at revision_round == MAX_REVISION_ROUNDS"
          - "appends CompensationEntry(entry_type=REVERSAL, amount_cents = -provisional_compensation_cents, reverses_entry_id = the live PER_USE_PROVISIONAL entry, shares = exact negation of that entry's shares) and sets provisional_compensation_cents = 0"
          - "recomputes ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents"
          - "increments GeneratedPerformance.version and Talent.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /generated-performances/{id}/resubmit"
        actor: LicenseeProducer
        preconditions:
          - "performance.review_status == REVISION_REQUESTED, else ERR_INVALID_PERFORMANCE_STATE — except when review_status == REJECTED with rejection_reason == REVISION_LIMIT_REACHED, which reports ERR_REVISION_LIMIT_REACHED"
          - "performance.revision_round < MAX_REVISION_ROUNDS, else ERR_REVISION_LIMIT_REACHED"
          - "the governing ConsentGrant.status == ACTIVE"
          - "ownership: X-User-ID == performance.licensee_user_id, else ERR_NOT_LICENSEE_OWNER"
        side_effects:
          - "revision_round += 1; projected_impressions and intended_use_description replaced by the payload; review_deadline = logical now + REVIEW_WINDOW_DAYS days; reviewed_by_user_id = null"
          - "appends CompensationEntry(entry_type=REVERSAL) undoing the live PER_USE_PROVISIONAL entry, then appends a fresh CompensationEntry(entry_type=PER_USE_PROVISIONAL) recomputed by the PROVISIONAL variant of calculations.per_use_compensation on the new projected_impressions; provisional_compensation_cents is set to the new amount"
          - "recomputes ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents"
          - "increments GeneratedPerformance.version and Talent.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: POST /compliance-sweeps phase 4 (review window lapsed)"
        actor: system
        preconditions:
          - "performance.review_status == SUBMITTED"
          - "performance.review_deadline <= logical now"
        side_effects:
          - "review_status = REJECTED; rejection_reason = REVIEW_WINDOW_LAPSED; reviewed_by_user_id stays null"
          - "same REVERSAL append and ledger recomputation as the explicit REJECT transition"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: cascade hop 3 of consent revoke / replica quarantine"
        actor: system
        preconditions:
          - "the replica behind this performance has just entered QUARANTINED"
        side_effects:
          - "review_status = WITHDRAWN; appends the REVERSAL entry for any live PER_USE_PROVISIONAL accrual and zeroes provisional_compensation_cents"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system: cascade hop 3 of consent revoke / replica quarantine"
        actor: system
        preconditions:
          - "the replica behind this performance has just entered QUARANTINED"
        side_effects:
          - "identical to the SUBMITTED -> WITHDRAWN cascade"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "system: cascade hop 3 of consent revoke / replica quarantine"
        actor: system
        preconditions:
          - "the replica behind this performance has just entered QUARANTINED"
        side_effects:
          - "review_status = WITHDRAWN; appends the REVERSAL entry for any live PER_USE_PROVISIONAL accrual"
          - "onward hop 4: every UsageLicense on this performance in {ISSUED, LIVE} moves to REMOVAL_PENDING with removal_reason = CONSENT_REVOKED when the cascade originated at a revoke, or REPLICA_QUARANTINED when it originated at a case escalation"

  - entity: UsageLicense
    initial_state: "distribution_status = ISSUED and compliance_status = PENDING_LABEL (or VERIFIED when disclosure_required is false)"
    terminal_states: [REMOVAL_CONFIRMED]
    note: >-
      Two independent state dimensions on one row. distribution_status tracks where the synthetic
      content is in the world; compliance_status tracks the disclosure label. They advance on
      separate triggers, and only the go-live transition reads across the two dimensions
      (a license cannot go LIVE until compliance_status == VERIFIED).
    transitions:
      - from: "distribution_status = ISSUED"
        to: "distribution_status = LIVE"
        trigger: "POST /usage-licenses/{id}/go-live"
        actor: LicenseeProducer
        preconditions:
          - "license.distribution_status == ISSUED, else ERR_INVALID_LICENSE_STATE"
          - "license.compliance_status == VERIFIED, else ERR_DISCLOSURE_NOT_VERIFIED"
          - "logical now is inside [distribution_start, distribution_end] inclusive, else ERR_OUTSIDE_DISTRIBUTION_WINDOW"
          - "the governing ConsentGrant.status == ACTIVE, else ERR_CONSENT_NOT_ACTIVE"
          - "ownership: X-User-ID == license.licensee_user_id, else ERR_NOT_LICENSEE_OWNER"
        side_effects:
          - "distribution_reference stored from the payload"
          - "increments UsageLicense.version by 1"
      - from: "distribution_status in {ISSUED, LIVE}"
        to: "distribution_status = REMOVAL_PENDING"
        trigger: "system: POST /compliance-sweeps phase 2 (distribution_end passed) or cascade hop 4 of consent revoke / replica quarantine"
        actor: system
        preconditions:
          - "sweep path: license.distribution_end < logical now"
          - "cascade path: the parent GeneratedPerformance has just entered WITHDRAWN"
        side_effects:
          - "removal_reason = TERM_EXPIRED (sweep) | CONSENT_REVOKED (revoke cascade) | REPLICA_QUARANTINED (escalation cascade)"
          - "removal_deadline = calculations.license_removal_deadline evaluated at logical now"
          - "Talent.open_removal_obligation_count += 1 and Talent.rights_posture recomputed by calculations.talent_rights_posture"
          - "increments UsageLicense.version and Talent.version by 1"
      - from: "distribution_status = REMOVAL_PENDING"
        to: "distribution_status = REMOVAL_CONFIRMED"
        trigger: "POST /usage-licenses/{id}/confirm-removal"
        actor: LicenseeProducer
        preconditions:
          - "license.distribution_status == REMOVAL_PENDING, else ERR_INVALID_LICENSE_STATE"
          - "ownership: X-User-ID == license.licensee_user_id, else ERR_NOT_LICENSEE_OWNER"
        side_effects:
          - "removal_confirmed_at = logical now"
          - "if removal_confirmed_at <= removal_deadline then compliance_status is left untouched; if the deadline had already lapsed the license keeps the NON_COMPLIANT compliance_status stamped by sweep phase 3"
          - "Talent.open_removal_obligation_count -= 1 and Talent.rights_posture recomputed"
          - "DigitalReplica.open_license_count -= 1"
          - "increments UsageLicense.version, Talent.version and DigitalReplica.version by 1"
      - from: "compliance_status = PENDING_LABEL"
        to: "compliance_status = LABELED"
        trigger: "POST /usage-licenses/{id}/disclosure"
        actor: LicenseeProducer
        preconditions:
          - "license.compliance_status in {PENDING_LABEL, NON_COMPLIANT}, else ERR_INVALID_DISCLOSURE_STATE"
          - "the payload's disclosure_placement rank >= the governing StateLawProfile minimum rank for the license channel, else ERR_DISCLOSURE_PLACEMENT_INSUFFICIENT"
          - "ownership: X-User-ID == license.licensee_user_id, else ERR_NOT_LICENSEE_OWNER"
        side_effects:
          - "disclosure_placement and disclosure_label_text stored; disclosure_verified_by_user_id reset to null"
          - "increments UsageLicense.version by 1"
      - from: "compliance_status = NON_COMPLIANT"
        to: "compliance_status = LABELED"
        trigger: "POST /usage-licenses/{id}/disclosure"
        actor: LicenseeProducer
        preconditions:
          - "identical to the PENDING_LABEL -> LABELED transition; re-attestation after a rejection is the cycle in this dimension"
        side_effects:
          - "identical to the PENDING_LABEL -> LABELED transition"
      - from: "compliance_status = LABELED"
        to: "compliance_status = VERIFIED"
        trigger: "POST /usage-licenses/{id}/disclosure-verification with decision = ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "license.compliance_status == LABELED, else ERR_INVALID_DISCLOSURE_STATE"
        side_effects:
          - "disclosure_verified_by_user_id = X-User-ID"
          - "increments UsageLicense.version by 1"
      - from: "compliance_status = LABELED"
        to: "compliance_status = NON_COMPLIANT"
        trigger: "POST /usage-licenses/{id}/disclosure-verification with decision = REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "license.compliance_status == LABELED, else ERR_INVALID_DISCLOSURE_STATE"
        side_effects:
          - "disclosure_verified_by_user_id = null; disclosure_placement and disclosure_label_text are retained for the audit trail"
          - "increments UsageLicense.version by 1"
      - from: "compliance_status in {PENDING_LABEL, LABELED, VERIFIED}"
        to: "compliance_status = NON_COMPLIANT"
        trigger: "system: POST /compliance-sweeps phase 3 (removal_deadline lapsed while distribution_status == REMOVAL_PENDING)"
        actor: system
        preconditions:
          - "license.distribution_status == REMOVAL_PENDING"
          - "license.removal_deadline < logical now"
          - "license.removal_confirmed_at is null"
        side_effects:
          - "compliance_status = NON_COMPLIANT — note this dimension moves while distribution_status stays REMOVAL_PENDING, which is what makes the two dimensions independent"
          - "opens an InfringementCase (detection_source = SWEEP, match_confidence = 1.000, suspect_url = license.distribution_reference, detected_state_code = the talent's domicile_state_code, matched_usage_license_id = this license)"
          - "increments UsageLicense.version by 1"

  - entity: InfringementCase
    initial_state: DETECTED
    terminal_states: [DISMISSED_LICENSED, DISMISSED_NO_ACTION, RESOLVED_REMOVED, CLOSED_SETTLED, CLOSED_LITIGATED]
    note: >-
      Branching: triage forks into three outcomes, and the takedown branch forks again into
      voluntary removal versus legal escalation. Only the escalation branch applies holds, and
      only its closure releases them.
    transitions:
      - from: DETECTED
        to: DISMISSED_LICENSED
        trigger: "POST /infringement-cases/{id}/triage with decision = DISMISS"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == DETECTED, else ERR_INVALID_CASE_STATE"
          - "case.matched_usage_license_id is not null and that license has distribution_status in {ISSUED, LIVE} — the detected use is in fact licensed"
          - "case.severity_score < SEVERITY_MANDATORY_TAKEDOWN, else ERR_TAKEDOWN_MANDATORY"
        side_effects:
          - "triaged_by_user_id = X-User-ID; closure_outcome = LICENSED_USE_CONFIRMED"
          - "increments InfringementCase.version by 1"
      - from: DETECTED
        to: DISMISSED_NO_ACTION
        trigger: "POST /infringement-cases/{id}/triage with decision = DISMISS"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == DETECTED"
          - "case.matched_usage_license_id is null, or the matched license is no longer distributable — nothing to license and nothing worth pursuing"
          - "case.severity_score < SEVERITY_MANDATORY_TAKEDOWN OR case.enforceable_under_use_state is false, else ERR_TAKEDOWN_MANDATORY — an unenforceable case is always dismissible, since no takedown could issue in the detected state"
        side_effects:
          - "triaged_by_user_id = X-User-ID; closure_outcome = BELOW_ENFORCEMENT_THRESHOLD"
          - "increments InfringementCase.version by 1"
      - from: DETECTED
        to: TAKEDOWN_ISSUED
        trigger: "POST /infringement-cases/{id}/triage with decision = ISSUE_TAKEDOWN"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == DETECTED, else ERR_INVALID_CASE_STATE"
          - "case.enforceable_under_use_state is true, else ERR_POSTMORTEM_RIGHTS_EXPIRED (a deceased talent whose rights have lapsed in the detected state cannot support a takedown)"
        side_effects:
          - "takedown_issued_at = logical now; triaged_by_user_id = X-User-ID"
          - "increments InfringementCase.version by 1"
      - from: TAKEDOWN_ISSUED
        to: RESOLVED_REMOVED
        trigger: "POST /infringement-cases/{id}/close with outcome = REMOVED"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == TAKEDOWN_ISSUED, else ERR_INVALID_CASE_STATE"
        side_effects:
          - "closed_by_user_id = X-User-ID; closure_outcome = VOLUNTARY_REMOVAL; no holds were ever applied on this branch, so nothing is released"
          - "increments InfringementCase.version by 1"
      - from: TAKEDOWN_ISSUED
        to: LEGAL_ESCALATED
        trigger: "POST /infringement-cases/{id}/escalate"
        actor: RightsAdministrator
        preconditions:
          - "case.status == TAKEDOWN_ISSUED, else ERR_INVALID_CASE_STATE"
          - "case.severity_score >= SEVERITY_ESCALATION_FLOOR, else ERR_SEVERITY_BELOW_ESCALATION_FLOOR"
          - "segregation of duties: X-User-ID != case.triaged_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "escalated_by_user_id = X-User-ID (cascade hop 1)"
          - "hop 2: every BiometricAsset of case.talent_id in {STORED, PURGE_SCHEDULED} moves to LEGAL_HOLD with held_from_status recorded; legal_hold_applied_count = the number moved"
          - "hop 3: every DigitalReplica of case.talent_id whose source_asset_ids intersects the newly held assets and whose status is in {BUILT, APPROVED_FOR_USE} moves to QUARANTINED with quarantine_reason = SOURCE_LEGAL_HOLD and held_from_status recorded"
          - "hop 4: every GeneratedPerformance under those replicas in {SUBMITTED, REVISION_REQUESTED, APPROVED} moves to WITHDRAWN with its provisional accrual reversed"
          - "hop 5: every UsageLicense on those performances in {ISSUED, LIVE} moves to distribution_status REMOVAL_PENDING with removal_reason = REPLICA_QUARANTINED and a fresh removal_deadline"
          - "Talent.legal_hold_asset_count recomputed, Talent.open_removal_obligation_count incremented per license, and Talent.rights_posture becomes FROZEN"
          - "increments InfringementCase.version and Talent.version by 1"
      - from: LEGAL_ESCALATED
        to: CLOSED_SETTLED
        trigger: "POST /infringement-cases/{id}/close with outcome = SETTLED"
        actor: RightsAdministrator
        preconditions:
          - "case.status == LEGAL_ESCALATED, else ERR_INVALID_CASE_STATE"
        side_effects:
          - "closed_by_user_id = X-User-ID; closure_outcome = SETTLED"
          - "compensating release: when no other InfringementCase of this talent remains in LEGAL_ESCALATED, every BiometricAsset in LEGAL_HOLD returns to its held_from_status and every DigitalReplica quarantined with reason SOURCE_LEGAL_HOLD returns to its held_from_status; legal_hold_applied_count is left as the historical record"
          - "Talent.legal_hold_asset_count recomputed back to its pre-escalation value and rights_posture recomputed by calculations.talent_rights_posture"
          - "WITHDRAWN performances and REMOVAL_PENDING licenses are NOT restored — those hops are irreversible by design"
          - "increments InfringementCase.version and Talent.version by 1"
      - from: LEGAL_ESCALATED
        to: CLOSED_LITIGATED
        trigger: "POST /infringement-cases/{id}/close with outcome = LITIGATED"
        actor: RightsAdministrator
        preconditions:
          - "case.status == LEGAL_ESCALATED, else ERR_INVALID_CASE_STATE"
        side_effects:
          - "closure_outcome = LITIGATED; identical release behaviour to CLOSED_SETTLED"

concurrency_rules:
  - rule_id: consent-create-stale-talent
    parent_entity: Talent
    write_endpoint: "POST /consent-grants"
    occ_field: "expected_talent_version"
    description: |
      Creating a ConsentGrant against a Talent whose version has advanced since the
      drafting agent last read that talent is rejected with a stale-version error.
      A second grant over the same media type and territory is legitimate product
      behaviour — a non-exclusive grant may sit alongside an earlier one, and an
      exclusivity change or a death record recorded in between silently rewrites the
      terms the drafter believed were in force. Because a sequential retry would
      observe no blocking status field and would itself succeed, the stale read is
      caught only by OCC on Talent.version.
    error_id: ERR_TALENT_VERSION_STALE
    http_status: 412
  - rule_id: license-issue-stale-replica
    parent_entity: DigitalReplica
    write_endpoint: "POST /usage-licenses"
    occ_field: "expected_replica_version"
    description: |
      Issuing a UsageLicense against a DigitalReplica whose version has advanced since
      the licensee last read it is rejected with a stale-version error. Issuing a second
      license over the same replica and an overlapping territory is legitimate up to the
      declared overlap cap, so a sequential retry would find the replica still
      APPROVED_FOR_USE and would itself succeed; only the advanced version reveals that
      the replica's approval, source assets or open license count changed under the
      licensee's feet.
    error_id: ERR_REPLICA_VERSION_STALE
    http_status: 412

calculations:
  - name: initial_creation_compensation
    description: >-
      One-time fee owed for building a digital replica, derived by scaling the negotiated
      creation fee by scope breadth, term length and exclusivity, then lifting the result to
      the applicable union minimum when the talent is covered by a union.
    trigger: "POST /consent-grants/{id}/countersign, before the INITIAL_CREATION ledger entry is appended"
    algorithm: threshold
    inputs:
      - "ConsentGrant.initial_creation_fee_cents"
      - "ConsentGrant.permitted_media_types"
      - "ConsentGrant.effective_from, ConsentGrant.effective_until"
      - "ConsentGrant.exclusivity"
      - "ConsentGrant.union_code_snapshot"
      - "UnionMinimumSchedule rows for that union_code"
    input_set: >-
      Exactly one ConsentGrant (the one being countersigned). The union floor is selected from
      UnionMinimumSchedule rows whose union_code == ConsentGrant.union_code_snapshot AND whose
      media_type == the governing media type; among those, the row with the greatest
      effective_from that is <= ConsentGrant.effective_from wins; if two such rows share that
      effective_from, the one with the earliest created_at wins. When union_code_snapshot is
      null the floor is 0 and no schedule lookup happens. When union_code_snapshot is not null
      and the candidate set is empty, the countersign fails with ERR_UNION_SCHEDULE_MISSING.
    formula: |
      # Step 1 — governing media type (pins "which media type" deterministically)
      MEDIA_FLOOR_RANK = { ADVERTISING: 5, FEATURE_FILM: 4, EPISODIC: 3, VIDEO_GAME: 2, SOCIAL: 1 }
      governing_media_type = the member of permitted_media_types with the greatest
                             MEDIA_FLOOR_RANK (ranks are distinct, so no tie is possible)

      # Step 2 — multiplicative chain, evaluated left to right in exactly this order
      n_media       = count(permitted_media_types)
      breadth_factor = 1.00 + BREADTH_STEP * (n_media - 1)

      term_months   = floor(whole calendar months from effective_from to effective_until)
      duration_factor = 1.00 if term_months <= SHORT_TERM_MONTHS
                        1.25 if term_months <= MID_TERM_MONTHS
                        1.60 otherwise
      exclusivity_factor = 1.35 if exclusivity == EXCLUSIVE else 1.00

      raw = initial_creation_fee_cents * breadth_factor * duration_factor * exclusivity_factor
      # exactly ONE rounding, applied to the fully composed product — never per factor
      scaled = round_half_up(raw, 0)

      # Step 3 — union floor
      floor = selected_row.minimum_initial_cents  (0 when union_code_snapshot is null)
      initial_compensation_cents = max(scaled, floor)
      union_topup_cents          = max(0, floor - scaled)
    constants:
      BREADTH_STEP: 0.15
      SHORT_TERM_MONTHS: 12
      MID_TERM_MONTHS: 36
      LONG_TERM_FACTOR: 1.60
      MID_TERM_FACTOR: 1.25
      SHORT_TERM_FACTOR: 1.00
      EXCLUSIVE_FACTOR: 1.35
      NON_EXCLUSIVE_FACTOR: 1.00
    precision: "integer cents, round_half_up applied once to the composed product; the union floor comparison uses the rounded value"
    worked_examples:
      - "fee 300000, [ADVERTISING], 2026-08-01 -> 2027-08-01 (12 months), NON_EXCLUSIVE, SAG_AFTRA/CA: 300000 * 1.00 * 1.00 * 1.00 = 300000; floor 300000; initial_compensation_cents = 300000, union_topup_cents = 0 (floor equality boundary)"
      - "fee 250000, same scope: scaled 250000; floor 300000; initial_compensation_cents = 300000, union_topup_cents = 50000"
      - "fee 300000, [ADVERTISING, EPISODIC], 2026-08-01 -> 2029-08-01 (36 months), EXCLUSIVE: 300000 * 1.15 * 1.25 * 1.35 = 582187.5 -> 582188; floor 300000; initial_compensation_cents = 582188, union_topup_cents = 0"

  - name: per_use_compensation
    description: >-
      Per-use royalty owed for one generated performance. The same formula runs twice over the
      life of a use: provisionally at submission on the licensee's own projections, and finally
      at license issuance on the license's actual reach and territory footprint.
    trigger: >-
      PROVISIONAL at POST /generated-performances and at POST /generated-performances/{id}/resubmit;
      FINAL at POST /usage-licenses
    algorithm: tiered_pricing
    inputs:
      - "ConsentGrant.per_use_base_fee_cents"
      - "GeneratedPerformance.media_type"
      - "GeneratedPerformance.projected_impressions (PROVISIONAL) or UsageLicense.actual_impressions (FINAL)"
      - "GeneratedPerformance.territory_codes (PROVISIONAL) or UsageLicense.territory_codes (FINAL)"
      - "UnionMinimumSchedule.minimum_per_use_cents for the governing union row"
    input_set: >-
      One GeneratedPerformance and its governing ConsentGrant. The union row is selected exactly
      as in initial_creation_compensation, except media_type must equal
      GeneratedPerformance.media_type; when no such row exists and union_code_snapshot is not
      null the write fails with ERR_UNION_SCHEDULE_MISSING.
    formula: |
      reach_factor = 1.00 if reach <= REACH_TIER_1
                     1.40 if reach <= REACH_TIER_2
                     1.90 otherwise
      MEDIA_MULTIPLIER = { ADVERTISING: 1.50, FEATURE_FILM: 1.30, EPISODIC: 1.15,
                           VIDEO_GAME: 1.10, SOCIAL: 1.00 }
      territory_factor = 1.00 + TERRITORY_STEP * (count(territory_set) - 1)

      raw    = per_use_base_fee_cents * reach_factor * MEDIA_MULTIPLIER[media_type] * territory_factor
      scaled = round_half_up(raw, 0)          # one rounding on the composed product
      amount = max(scaled, minimum_per_use_cents_or_zero)
    constants:
      REACH_TIER_1: 1000000
      REACH_TIER_2: 10000000
      REACH_FACTOR_1: 1.00
      REACH_FACTOR_2: 1.40
      REACH_FACTOR_3: 1.90
      TERRITORY_STEP: 0.10
    precision: "integer cents, round_half_up applied once to the composed product"
    variants:
      - name: PROVISIONAL
        when: "a GeneratedPerformance is submitted or resubmitted for approval — no license exists yet"
        difference: >-
          reach = GeneratedPerformance.projected_impressions (the licensee's own estimate) and
          territory_set = GeneratedPerformance.territory_codes. The result is written to
          GeneratedPerformance.provisional_compensation_cents and posted as a
          PER_USE_PROVISIONAL ledger entry that is reversed on rejection, withdrawal or
          resubmission.
      - name: FINAL
        when: "a UsageLicense is issued against an APPROVED performance"
        difference: >-
          reach = UsageLicense.actual_impressions (the contracted delivery) and
          territory_set = UsageLicense.territory_codes, which may be a strict subset or a
          superset-within-scope of the performance's declared territories. The result is
          written to UsageLicense.per_use_final_cents and posted as a PER_USE_FINAL entry;
          the provisional accrual is NOT reversed at issuance, so the two amounts coexist in
          the ledger and the grant total reflects both.
    worked_examples:
      - "PROVISIONAL: base 150000, ADVERTISING, projected_impressions 6000000 (tier 2 -> 1.40), 1 territory: 150000 * 1.40 * 1.50 * 1.00 = 315000"
      - "FINAL: base 150000, ADVERTISING, actual_impressions 12000000 (tier 3 -> 1.90), 2 territories (1.10): 150000 * 1.90 * 1.50 * 1.10 = 470250"
      - "Variant delta for the same performance/license pair above: 470250 - 315000 = 155250"

  - name: postmortem_rights_expiry
    description: >-
      The instant at which a deceased talent's likeness and voice rights lapse. The answer is
      state-dependent, so the system computes it twice from different law profiles: once from
      the talent's domicile (which governs administration of the estate) and once from the state
      where a suspected use was detected (which governs enforceability of a takedown).
    trigger: "POST /talents/{id}/death-record (DOMICILE_LAW) and POST /infringement-cases (USE_STATE_LAW)"
    algorithm: threshold
    inputs:
      - "Talent.date_of_death"
      - "Talent.domicile_state_code or InfringementCase.detected_state_code"
      - "StateLawProfile.postmortem_rights_years, StateLawProfile.postmortem_requires_registration"
      - "Talent.postmortem_registration_number"
    input_set: >-
      Exactly one StateLawProfile, looked up by state_code. If no profile exists for the state
      code the write fails with ERR_STATE_LAW_PROFILE_MISSING.
    formula: |
      if profile.postmortem_rights_years == 0:
          rights_until = null            # the state recognises no post-mortem right at all
      else:
          rights_until = date_of_death + profile.postmortem_rights_years years
                         (same month and day; 29 Feb collapses to 28 Feb in a non-leap year)
      enforceable = (rights_until is not null) AND (rights_until >= logical now)
    constants: {}
    precision: "whole-day resolution, stored as an ISO-8601 UTC instant at 00:00:00Z"
    variants:
      - name: DOMICILE_LAW
        when: "recording a death and thereafter administering consents and approvals"
        difference: >-
          state_code = Talent.domicile_state_code. The result is persisted as
          Talent.postmortem_rights_until and gates estate-granted consents: a consent whose
          grantor_kind is ESTATE fails with ERR_POSTMORTEM_RIGHTS_EXPIRED when
          postmortem_rights_until is null or already past, and fails with
          ERR_POSTMORTEM_REGISTRATION_MISSING when the profile requires registration and
          Talent.postmortem_registration_number is null.
      - name: USE_STATE_LAW
        when: "opening an InfringementCase for a use detected in some other state"
        difference: >-
          state_code = InfringementCase.detected_state_code. The result is persisted as
          InfringementCase.use_state_rights_until and
          InfringementCase.enforceable_under_use_state, and it — not the domicile answer —
          decides whether a takedown may be issued. Registration is NOT consulted on this
          variant, because enforcement in the use state turns on the use state's own recognition
          of the right.
    worked_examples:
      - "date_of_death 2020-03-15, domicile CA (70 years): postmortem_rights_until 2090-03-15T00:00:00Z, enforceable true"
      - "same talent, use detected in TX (0 years): use_state_rights_until null, enforceable_under_use_state false — the domicile variant says the right lives, the use-state variant says there is nothing to enforce"
      - "same talent, use detected in NY (40 years): use_state_rights_until 2060-03-15T00:00:00Z, enforceable_under_use_state true"

  - name: royalty_share_split
    description: >-
      Splits every ledger amount three ways between the talent, the agency and the rights
      administrator. Each share is rounded on its own and the signed remainder is assigned to the
      talent, so the three shares always reconstruct the entry amount exactly.
    trigger: "every CompensationEntry append (INITIAL_CREATION, UNION_TOPUP, PER_USE_PROVISIONAL, PER_USE_FINAL, REVERSAL)"
    algorithm: waterfall_allocation
    inputs:
      - "CompensationEntry.amount_cents"
      - "ConsentGrant.talent_share_pct, ConsentGrant.agency_share_pct, ConsentGrant.administrator_share_pct"
      - "for REVERSAL entries: the reversed entry's three share fields"
    input_set: "one CompensationEntry amount and the three share percentages of its governing ConsentGrant"
    formula: |
      # Non-REVERSAL entries — per-participant rounding, then a signed remainder sweep
      talent_share_cents        = round_half_up(amount_cents * talent_share_pct, 0)
      agency_share_cents        = round_half_up(amount_cents * agency_share_pct, 0)
      administrator_share_cents = round_half_up(amount_cents * administrator_share_pct, 0)

      remainder = amount_cents - (talent_share_cents + agency_share_cents + administrator_share_cents)
      talent_share_cents += remainder      # remainder may be negative; it is never dropped

      # REVERSAL entries — exact negation, NOT a re-derivation from the percentages
      reversal.amount_cents             = -reversed.amount_cents
      reversal.talent_share_cents       = -reversed.talent_share_cents
      reversal.agency_share_cents       = -reversed.agency_share_cents
      reversal.administrator_share_cents= -reversed.administrator_share_cents
    constants:
      REMAINDER_BENEFICIARY: TALENT
    precision: "integer cents; each share round_half_up independently, remainder swept into the talent share"
    worked_examples:
      - "amount 300000 at 0.75/0.20/0.05: 225000 / 60000 / 15000, remainder 0"
      - "amount 315000: 236250 / 63000 / 15750, remainder 0"
      - "amount 470250: unrounded 352687.5 / 94050 / 23512.5 -> 352688 / 94050 / 23513 sums to 470251, remainder -1 -> talent 352687, so the stored shares are 352687 / 94050 / 23513"
      - "reversal of the 315000 entry: -315000 with shares -236250 / -63000 / -15750"

  - name: biometric_retention_deadline
    description: >-
      The instant after which a stored biometric or voice sample may no longer be retained. The
      binding deadline is whichever comes first: the state's statutory retention ceiling measured
      from capture, or the end of the consent term plus that state's deletion grace period.
    trigger: >-
      POST /biometric-assets (initial value), POST /consent-grants/{id}/revoke and
      POST /consent-grants/{id}/suspension (recomputation for every non-purged asset of the grant),
      and POST /compliance-sweeps phase 1 when a grant expires
    algorithm: threshold
    inputs:
      - "BiometricAsset.created_at"
      - "ConsentGrant.effective_until, ConsentGrant.effective_end_actual"
      - "StateLawProfile.biometric_retention_max_days, StateLawProfile.deletion_grace_days"
    input_set: >-
      One BiometricAsset, its governing ConsentGrant, and the StateLawProfile of the talent's
      domicile_state_code. Assets already in PURGED are skipped; assets in LEGAL_HOLD have their
      retention_until recomputed but their purge is deferred until the hold is released.
    formula: |
      statutory_deadline = asset.created_at + profile.biometric_retention_max_days days
      consent_end        = consent.effective_end_actual if not null else consent.effective_until
      contractual_deadline = consent_end + profile.deletion_grace_days days

      retention_until = min(statutory_deadline, contractual_deadline)
      # purge_due_at is only stamped when the sweep moves the asset to PURGE_SCHEDULED
      purge_due_at    = retention_until + PURGE_EXECUTION_GRACE_DAYS days
    constants:
      PURGE_EXECUTION_GRACE_DAYS: 7
    precision: "whole-day arithmetic on ISO-8601 UTC instants; ties (statutory == contractual) resolve to that same instant"
    worked_examples:
      - "asset created 2026-08-01T00:00:00Z, CA (365 statutory days, 30 grace days), consent effective_until 2027-08-01T00:00:00Z: statutory 2027-08-01, contractual 2027-08-31, retention_until 2027-08-01T00:00:00Z (statutory binds)"
      - "same asset after the grant is revoked at 2026-09-15T00:00:00Z (effective_end_actual set): contractual 2026-10-15, statutory unchanged 2027-08-01, retention_until 2026-10-15T00:00:00Z (contractual binds) and purge_due_at 2026-10-22T00:00:00Z once scheduled"
      - "NY talent (180 statutory days, 15 grace days), asset created 2026-08-01, consent effective_until 2027-08-01: statutory 2027-01-28, contractual 2027-08-16, retention_until 2027-01-28T00:00:00Z"

  - name: license_removal_deadline
    description: >-
      The instant by which distributed synthetic content must be pulled down once its license
      stops authorising distribution, measured from the moment the removal obligation arises and
      sized by the talent's domicile state law.
    trigger: >-
      every transition of UsageLicense.distribution_status into REMOVAL_PENDING — sweep phase 2
      (term expiry) and the revoke / escalation cascades
    algorithm: threshold
    inputs:
      - "logical now at the moment the obligation arises"
      - "StateLawProfile.removal_window_days for Talent.domicile_state_code"
    input_set: "one UsageLicense and the StateLawProfile of the talent behind its replica"
    formula: |
      removal_deadline = logical_now + profile.removal_window_days days
      # overdue is strict: the sweep marks non-compliance only when removal_deadline < now
      # and removal_confirmed_at is still null. Confirming exactly at the deadline is compliant.
    constants: {}
    precision: "whole-day arithmetic on ISO-8601 UTC instants; comparison at the deadline is inclusive in the licensee's favour"
    worked_examples:
      - "obligation raised at 2027-08-02T00:00:00Z for a CA talent (14 days): removal_deadline 2027-08-16T00:00:00Z; a sweep run at exactly 2027-08-16T00:00:00Z does NOT mark the license NON_COMPLIANT, a sweep at 2027-08-17T00:00:00Z does"
      - "same obligation for a TX talent (21 days): removal_deadline 2027-08-23T00:00:00Z"

  - name: talent_rights_posture
    description: >-
      A single derived posture summarising whether the talent's likeness may currently be
      exploited. It is recomputed from scratch after any event that could change it, so it always
      reflects the current facts rather than an incrementally patched history.
    trigger: >-
      after every write that changes an InfringementCase status, a ConsentGrant status, or
      Talent.open_removal_obligation_count — including all cascade hops and every sweep phase
    algorithm: constraint_propagation
    inputs:
      - "InfringementCase.status for all cases of this talent"
      - "ConsentGrant.status for all grants of this talent"
      - "Talent.open_removal_obligation_count"
    input_set: >-
      All InfringementCase rows with talent_id == this talent, and all ConsentGrant rows with
      talent_id == this talent. Terminal case statuses (DISMISSED_LICENSED, DISMISSED_NO_ACTION,
      RESOLVED_REMOVED, CLOSED_SETTLED, CLOSED_LITIGATED) and terminal grant statuses (REVOKED,
      EXPIRED) contribute nothing.
    formula: |
      # evaluated in this order; the first matching clause wins
      if any InfringementCase of this talent has status == LEGAL_ESCALATED:
          posture = FROZEN
      elif open_removal_obligation_count > 0 or any ConsentGrant of this talent has status == SUSPENDED:
          posture = RESTRICTED
      else:
          posture = CLEAR
    constants: {}
    precision: "exact enum, no rounding"
    worked_examples:
      - "no cases, one ACTIVE grant, zero open removals -> CLEAR"
      - "one SUSPENDED grant (death recorded, estate not yet verified), zero open removals -> RESTRICTED"
      - "one LEGAL_ESCALATED case plus two open removal obligations -> FROZEN (the escalation clause wins over the removal clause)"
      - "the escalated case is closed as CLOSED_SETTLED while two removal obligations remain open -> RESTRICTED, not CLEAR"

  - name: license_total_cost
    description: >-
      Total amount billed to the licensee for one usage license: the final per-use royalty plus a
      compliance surcharge that funds disclosure labelling and monitoring. The surcharge is
      assessed on the pre-surcharge subtotal only, and it is a billing item — never a royalty, so
      it never becomes a CompensationEntry and never reaches the talent's shares.
    trigger: "POST /usage-licenses, immediately after per_use_compensation FINAL resolves"
    algorithm: waterfall_allocation
    inputs:
      - "UsageLicense.per_use_final_cents"
      - "UsageLicense.channel"
      - "UsageLicense.disclosure_required"
    input_set: "exactly one UsageLicense being issued"
    formula: |
      # Order is pinned and observable: the surcharge is computed on the PRE-surcharge
      # subtotal, and it is rounded UP (ceil), not round_half_up like the royalty amounts.
      subtotal = per_use_final_cents

      surcharge_rate = 0                          if disclosure_required is false
                       SURCHARGE_RATE_ADVERTISING if channel == ADVERTISING
                       SURCHARGE_RATE_ENTERTAINMENT if channel == ENTERTAINMENT

      compliance_surcharge_cents = ceil(subtotal * surcharge_rate)
      license_total_cents        = subtotal + compliance_surcharge_cents

      # NOT: ceil((subtotal + previously_billed) * rate), and NOT a surcharge on the
      # surcharge — a second issuance under the same performance recomputes from its own
      # subtotal alone.
    constants:
      SURCHARGE_RATE_ADVERTISING: 0.0175
      SURCHARGE_RATE_ENTERTAINMENT: 0.0125
    precision: "integer cents; the surcharge uses ceil (always rounded up, in the compliance fund's favour), unlike every royalty amount which uses round_half_up"
    worked_examples:
      - "per_use_final_cents 470250, channel ADVERTISING, disclosure_required true: 470250 * 0.0175 = 8229.375 -> ceil 8230; license_total_cents 478480"
      - "per_use_final_cents 470250, channel ENTERTAINMENT, disclosure_required true: 470250 * 0.0125 = 5878.125 -> ceil 5879; license_total_cents 476129"
      - "per_use_final_cents 470250, channel ENTERTAINMENT in a state whose disclosure_required_entertainment is false: surcharge 0; license_total_cents 470250"

  - name: infringement_severity_score
    description: >-
      Weighted score that decides how hard the office must respond to a suspected unauthorized
      use. Confidence in the match dominates, audience reach contributes a saturating term, and
      the talent's existing posture supplies the remaining weight.
    trigger: "POST /infringement-cases and POST /compliance-sweeps phase 3 (auto-opened cases)"
    algorithm: weighted_scoring
    inputs:
      - "InfringementCase.match_confidence"
      - "InfringementCase.detected_view_count"
      - "Talent.rights_posture at the moment the case is opened"
    input_set: "one candidate case; the posture factor reads the talent's posture as it stands BEFORE this case is persisted"
    formula: |
      reach_term    = min(1.0, detected_view_count / REACH_SATURATION)
      POSTURE_FACTOR = { FROZEN: 1.0, RESTRICTED: 0.6, CLEAR: 0.3 }

      severity_score = round_half_up(
            WEIGHT_CONFIDENCE * match_confidence
          + WEIGHT_REACH      * reach_term
          + WEIGHT_POSTURE    * POSTURE_FACTOR[talent.rights_posture], 4)

      # Consequences, both boundaries inclusive on the high side:
      #   severity_score >= MANDATORY_TAKEDOWN_THRESHOLD -> triage may not DISMISS
      #                                                     (ERR_TAKEDOWN_MANDATORY)
      #   severity_score <  ESCALATION_FLOOR             -> escalation is refused
      #                                                     (ERR_SEVERITY_BELOW_ESCALATION_FLOOR)
    constants:
      WEIGHT_CONFIDENCE: 0.60
      WEIGHT_REACH: 0.25
      WEIGHT_POSTURE: 0.15
      REACH_SATURATION: 10000000
      MANDATORY_TAKEDOWN_THRESHOLD: 0.7500
      ESCALATION_FLOOR: 0.5000
    precision: "4 decimal places, round_half_up; the weights sum to exactly 1.00 so the score is bounded by [0, 1]"
    worked_examples:
      - "match_confidence 0.925, detected_view_count 6000000, posture CLEAR: 0.60*0.925 = 0.5550, 0.25*0.6 = 0.1500, 0.15*0.3 = 0.0450 -> 0.7500 exactly, so a DISMISS at triage is refused with ERR_TAKEDOWN_MANDATORY"
      - "match_confidence 0.920, detected_view_count 6000000, posture CLEAR: 0.5520 + 0.1500 + 0.0450 = 0.7470 -> below the threshold, DISMISS is allowed"
      - "match_confidence 0.500, detected_view_count 400000, posture CLEAR: 0.3000 + 0.0100 + 0.0450 = 0.3550 -> below ESCALATION_FLOOR, escalation refused"
      - "sweep-opened case: match_confidence 1.000, detected_view_count 0, posture RESTRICTED: 0.6000 + 0.0000 + 0.0900 = 0.6900 -> takedown discretionary, escalation permitted"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role names a role declared in roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: >-
      request body is well formed — every required field present, enum values inside their
      declared sets, integers non-negative, monetary amounts sent as JSON numbers (never strings),
      ISO-8601 datetimes parseable, percentage fields in [0, 1], required arrays non-empty,
      pagination limit in [1, 100] and offset >= 0
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that accept a body or query parameters"
  - priority: 10
    category: existence
    check: "path or body talent_id resolves to a Talent"
    error_id: ERR_TALENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /talents/{id}, GET /talents/{id}/estate-authorities, POST /talents/{id}/death-record, POST /talents/{id}/estate-authorities, POST /consent-grants"
  - priority: 11
    category: existence
    check: "path or body estate_authority_id resolves to an EstateAuthority"
    error_id: ERR_ESTATE_AUTHORITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /estate-authorities/{id}/verify, POST /consent-grants"
  - priority: 12
    category: existence
    check: "path or body consent_grant_id resolves to a ConsentGrant"
    error_id: ERR_CONSENT_GRANT_NOT_FOUND
    http_status: 404
    applies_to: "GET /consent-grants/{id}, POST /consent-grants/{id}/countersign, POST /consent-grants/{id}/suspension, POST /consent-grants/{id}/revoke, POST /biometric-assets, POST /digital-replicas"
  - priority: 13
    category: existence
    check: "path biometric asset id, or every member of source_asset_ids, resolves to a BiometricAsset"
    error_id: ERR_BIOMETRIC_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "GET /biometric-assets/{id}, POST /biometric-assets/{id}/purge, POST /digital-replicas"
  - priority: 14
    category: existence
    check: "path or body digital_replica_id resolves to a DigitalReplica"
    error_id: ERR_DIGITAL_REPLICA_NOT_FOUND
    http_status: 404
    applies_to: "GET /digital-replicas/{id}, POST /digital-replicas/{id}/approve-for-use, POST /generated-performances"
  - priority: 15
    category: existence
    check: "path or body generated_performance_id resolves to a GeneratedPerformance"
    error_id: ERR_GENERATED_PERFORMANCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /generated-performances/{id}, POST /generated-performances/{id}/review, POST /generated-performances/{id}/resubmit, POST /usage-licenses"
  - priority: 16
    category: existence
    check: "path or body usage_license_id resolves to a UsageLicense"
    error_id: ERR_USAGE_LICENSE_NOT_FOUND
    http_status: 404
    applies_to: "GET /usage-licenses/{id}, POST /usage-licenses/{id}/disclosure, POST /usage-licenses/{id}/disclosure-verification, POST /usage-licenses/{id}/go-live, POST /usage-licenses/{id}/confirm-removal, POST /infringement-cases"
  - priority: 17
    category: existence
    check: "path infringement case id resolves to an InfringementCase"
    error_id: ERR_INFRINGEMENT_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /infringement-cases/{id}, POST /infringement-cases/{id}/triage, POST /infringement-cases/{id}/escalate, POST /infringement-cases/{id}/close"
  - priority: 18
    category: existence
    check: "path compensation entry id resolves to a CompensationEntry"
    error_id: ERR_COMPENSATION_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /compensation-entries/{id}"
  - priority: 20
    category: existence
    check: >-
      a StateLawProfile exists for every state code the operation needs — the talent's
      domicile_state_code, and additionally InfringementCase.detected_state_code when a case is
      opened
    error_id: ERR_STATE_LAW_PROFILE_MISSING
    http_status: 422
    applies_to: "POST /talents, POST /talents/{id}/death-record, POST /consent-grants, POST /biometric-assets, POST /usage-licenses, POST /usage-licenses/{id}/disclosure, POST /infringement-cases"
  - priority: 22
    category: existence
    check: >-
      when the governing grant carries a union_code_snapshot, a UnionMinimumSchedule row exists
      for that union_code and the required media_type with effective_from <= the reference date
    error_id: ERR_UNION_SCHEDULE_MISSING
    http_status: 422
    applies_to: "POST /consent-grants, POST /consent-grants/{id}/countersign, POST /generated-performances, POST /usage-licenses"
  - priority: 25
    category: auth
    check: "acting TalentRepresentative's X-User-ID equals the talent_id behind the target resource"
    error_id: ERR_NOT_TALENT_REPRESENTATIVE
    http_status: 403
    applies_to: "POST /consent-grants/{id}/countersign, POST /consent-grants/{id}/revoke, POST /digital-replicas/{id}/approve-for-use, POST /generated-performances/{id}/review"
  - priority: 26
    category: auth
    check: >-
      acting EstateRepresentative's X-User-ID equals the id of a VERIFIED EstateAuthority whose
      talent_id is the talent behind the target resource
    error_id: ERR_NOT_ESTATE_REPRESENTATIVE
    http_status: 403
    applies_to: "POST /consent-grants/{id}/countersign, POST /consent-grants/{id}/revoke, POST /digital-replicas/{id}/approve-for-use, POST /generated-performances/{id}/review"
  - priority: 27
    category: auth
    check: "acting LicenseeProducer's X-User-ID equals the licensee_user_id on the target performance or license"
    error_id: ERR_NOT_LICENSEE_OWNER
    http_status: 403
    applies_to: "POST /generated-performances/{id}/resubmit, POST /usage-licenses, POST /usage-licenses/{id}/disclosure, POST /usage-licenses/{id}/go-live, POST /usage-licenses/{id}/confirm-removal"
  - priority: 28
    category: auth
    check: >-
      segregation of duties — the RightsAdministrator verifying an EstateAuthority must differ from
      the EstateAuthority.submitted_by_user_id that filed it, and the escalating
      RightsAdministrator must differ from InfringementCase.triaged_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /estate-authorities/{id}/verify, POST /infringement-cases/{id}/escalate"
  - priority: 30
    category: state
    check: "expected_talent_version equals the current Talent.version"
    error_id: ERR_TALENT_VERSION_STALE
    http_status: 412
    applies_to: "POST /consent-grants"
  - priority: 31
    category: state
    check: "expected_replica_version equals the current DigitalReplica.version"
    error_id: ERR_REPLICA_VERSION_STALE
    http_status: 412
    applies_to: "POST /usage-licenses"
  - priority: 32
    category: state
    check: "target Talent.life_status == LIVING when a death record is being written"
    error_id: ERR_INVALID_TALENT_STATE
    http_status: 409
    applies_to: "POST /talents/{id}/death-record"
  - priority: 33
    category: state
    check: "target EstateAuthority.status == SUBMITTED when it is being verified"
    error_id: ERR_INVALID_ESTATE_AUTHORITY_STATE
    http_status: 409
    applies_to: "POST /estate-authorities/{id}/verify"
  - priority: 34
    category: state
    check: >-
      target ConsentGrant is in a status the requested operation allows —
      PENDING_COUNTERSIGN for countersign, ACTIVE or SUSPENDED for suspension, and
      PENDING_COUNTERSIGN, ACTIVE or SUSPENDED for revoke
    error_id: ERR_INVALID_CONSENT_STATE
    http_status: 409
    applies_to: "POST /consent-grants/{id}/countersign, POST /consent-grants/{id}/suspension, POST /consent-grants/{id}/revoke"
  - priority: 35
    category: state
    check: >-
      the governing ConsentGrant of the resource being created or advanced has status == ACTIVE
      (a SUSPENDED, REVOKED, EXPIRED or not-yet-countersigned grant authorises nothing)
    error_id: ERR_CONSENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /biometric-assets, POST /digital-replicas, POST /digital-replicas/{id}/approve-for-use, POST /generated-performances, POST /generated-performances/{id}/review, POST /generated-performances/{id}/resubmit, POST /usage-licenses, POST /usage-licenses/{id}/go-live"
  - priority: 36
    category: state
    check: "target BiometricAsset.status is in {STORED, PURGE_SCHEDULED, LEGAL_HOLD} when a manual purge is requested — a PURGED asset is refused here. Carve-out: a LEGAL_HOLD asset passes this rung and is refused by priority 52 instead, so the requester learns the material is impounded rather than merely in the wrong state"
    error_id: ERR_INVALID_ASSET_STATE
    http_status: 409
    applies_to: "POST /biometric-assets/{id}/purge"
  - priority: 37
    category: state
    check: >-
      target DigitalReplica.status == BUILT when approval for use is requested, and
      APPROVED_FOR_USE when a performance is submitted against it
    error_id: ERR_INVALID_REPLICA_STATE
    http_status: 409
    applies_to: "POST /digital-replicas/{id}/approve-for-use, POST /generated-performances"
  - priority: 38
    category: state
    check: >-
      target GeneratedPerformance.review_status == SUBMITTED for review, == REVISION_REQUESTED for
      resubmit, and == APPROVED when a usage license is issued against it. Carve-out: a resubmit of a
      performance already REJECTED with rejection_reason == REVISION_LIMIT_REACHED skips this rung and
      is reported by priority 84 instead, so the licensee learns why the door is shut
    error_id: ERR_INVALID_PERFORMANCE_STATE
    http_status: 409
    applies_to: "POST /generated-performances/{id}/review, POST /generated-performances/{id}/resubmit, POST /usage-licenses"
  - priority: 39
    category: state
    check: >-
      target UsageLicense.distribution_status == ISSUED for go-live and == REMOVAL_PENDING for
      confirm-removal
    error_id: ERR_INVALID_LICENSE_STATE
    http_status: 409
    applies_to: "POST /usage-licenses/{id}/go-live, POST /usage-licenses/{id}/confirm-removal"
  - priority: 40
    category: state
    check: >-
      target UsageLicense.compliance_status is in {PENDING_LABEL, NON_COMPLIANT} when a disclosure
      is attested, and == LABELED when a compliance officer verifies one
    error_id: ERR_INVALID_DISCLOSURE_STATE
    http_status: 409
    applies_to: "POST /usage-licenses/{id}/disclosure, POST /usage-licenses/{id}/disclosure-verification"
  - priority: 41
    category: state
    check: >-
      target InfringementCase.status == DETECTED for triage, == TAKEDOWN_ISSUED for escalate, and
      is in {TAKEDOWN_ISSUED, LEGAL_ESCALATED} for close with the outcome matching that branch
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /infringement-cases/{id}/triage, POST /infringement-cases/{id}/escalate, POST /infringement-cases/{id}/close"
  - priority: 44
    category: state
    check: >-
      Talent.rights_posture != FROZEN. A frozen talent is under active legal escalation, so no new
      exploitation of the likeness may be authorised or advanced. Deliberately NOT applied to
      POST /digital-replicas, whose legal-hold exposure is checked by the higher-priority
      source-asset safety rule instead.
    error_id: ERR_TALENT_RIGHTS_FROZEN
    http_status: 409
    applies_to: "POST /consent-grants, POST /consent-grants/{id}/countersign, POST /digital-replicas/{id}/approve-for-use, POST /generated-performances, POST /generated-performances/{id}/review, POST /usage-licenses, POST /usage-licenses/{id}/go-live"
  - priority: 46
    category: state
    check: >-
      Talent.rights_posture != RESTRICTED for the two operations that put new synthetic content
      into the world while an unfinished removal obligation or a suspended grant is outstanding
    error_id: ERR_TALENT_RIGHTS_RESTRICTED
    http_status: 409
    applies_to: "POST /usage-licenses, POST /usage-licenses/{id}/go-live"
  - priority: 48
    category: state
    check: >-
      when the talent's life_status == DECEASED, an EstateAuthority for that talent with
      status == VERIFIED must exist before any consent, approval or license activity proceeds
    error_id: ERR_ESTATE_AUTHORITY_UNVERIFIED
    http_status: 409
    applies_to: "POST /consent-grants, POST /consent-grants/{id}/countersign, POST /digital-replicas/{id}/approve-for-use, POST /generated-performances/{id}/review"
  - priority: 50
    category: business_safety
    check: >-
      no member of source_asset_ids is a BiometricAsset in LEGAL_HOLD — building a replica from
      material impounded for litigation is the gravest failure this office can commit, so it
      outranks every scope and referential check on the same request
    error_id: ERR_REPLICA_SOURCE_UNDER_LEGAL_HOLD
    http_status: 409
    applies_to: "POST /digital-replicas"
  - priority: 52
    category: business_safety
    check: "target BiometricAsset.status != LEGAL_HOLD when a manual purge is requested — impounded material may not be destroyed. This is the reachable form of the legal-hold refusal because the priority 36 state rung deliberately admits LEGAL_HOLD and defers to this rung"
    error_id: ERR_ASSET_UNDER_LEGAL_HOLD
    http_status: 409
    applies_to: "POST /biometric-assets/{id}/purge"
  - priority: 54
    category: business_safety
    check: >-
      no DigitalReplica in {BUILT, APPROVED_FOR_USE} lists the asset in its source_asset_ids when
      a manual purge is requested — purging would orphan a live replica's provenance
    error_id: ERR_ASSET_BOUND_TO_ACTIVE_REPLICA
    http_status: 409
    applies_to: "POST /biometric-assets/{id}/purge"
  - priority: 56
    category: business_safety
    check: >-
      when the domicile StateLawProfile has postmortem_requires_registration true, the talent
      carries a non-null postmortem_registration_number before any estate-granted consent proceeds
    error_id: ERR_POSTMORTEM_REGISTRATION_MISSING
    http_status: 422
    applies_to: "POST /consent-grants, POST /consent-grants/{id}/countersign"
  - priority: 58
    category: business_safety
    check: >-
      post-mortem rights are still live for the operation's governing law — the DOMICILE_LAW
      variant for estate-granted consents, and the USE_STATE_LAW variant
      (InfringementCase.enforceable_under_use_state) when a takedown is issued
    error_id: ERR_POSTMORTEM_RIGHTS_EXPIRED
    http_status: 422
    applies_to: "POST /consent-grants, POST /infringement-cases/{id}/triage"
  - priority: 60
    category: business_safety
    check: >-
      the attested disclosure_placement's rank is at least the domicile StateLawProfile's minimum
      rank for the license channel (METADATA_ONLY 1 < END_CARD 2 < PRE_ROLL 3 < PERSISTENT_BUG 4)
    error_id: ERR_DISCLOSURE_PLACEMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /usage-licenses/{id}/disclosure"
  - priority: 62
    category: business_safety
    check: "UsageLicense.compliance_status == VERIFIED before distribution may begin"
    error_id: ERR_DISCLOSURE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /usage-licenses/{id}/go-live"
  - priority: 64
    category: business_safety
    check: >-
      a case whose severity_score >= MANDATORY_TAKEDOWN_THRESHOLD (0.7500) may not be dismissed at
      triage — the only permitted decision is ISSUE_TAKEDOWN. Carve-out: a case whose
      enforceable_under_use_state is false remains dismissible at any severity, because no takedown
      could issue in the detected state and the case would otherwise be unresolvable.
    error_id: ERR_TAKEDOWN_MANDATORY
    http_status: 409
    applies_to: "POST /infringement-cases/{id}/triage"
  - priority: 66
    category: business_referential
    check: >-
      the requested media_type is a member of the governing ConsentGrant.permitted_media_types
      (checked for GeneratedPerformance.media_type, and for the license channel's mapped media type)
    error_id: ERR_MEDIA_TYPE_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /generated-performances, POST /usage-licenses"
  - priority: 68
    category: business_referential
    check: >-
      every requested territory code is a member of the governing ConsentGrant.territory_codes,
      and every UsageLicense territory is also a member of its performance's territory_codes
    error_id: ERR_TERRITORY_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /generated-performances, POST /usage-licenses"
  - priority: 70
    category: business_referential
    check: >-
      every member of source_asset_ids belongs to the same consent_grant_id and the same talent_id
      as the replica being built — material captured under one grant may not be reused under another
    error_id: ERR_ASSET_CONSENT_MISMATCH
    http_status: 422
    applies_to: "POST /digital-replicas"
  - priority: 72
    category: business_referential
    check: "source_asset_ids is non-empty and contains no duplicate ids"
    error_id: ERR_NO_SOURCE_ASSETS
    http_status: 422
    applies_to: "POST /digital-replicas"
  - priority: 74
    category: business_temporal
    check: >-
      ConsentGrant.effective_from is strictly before effective_until and the term is at least
      MIN_CONSENT_TERM_DAYS (30) long
    error_id: ERR_CONSENT_TERM_INVALID
    http_status: 422
    applies_to: "POST /consent-grants"
  - priority: 76
    category: business_temporal
    check: >-
      the requested distribution window [distribution_start, distribution_end] lies entirely
      inside the governing grant's [effective_from, effective_until) term — a license may not
      authorise distribution past the day consent lapses
    error_id: ERR_WINDOW_EXCEEDS_CONSENT_TERM
    http_status: 422
    applies_to: "POST /usage-licenses"
  - priority: 78
    category: business_temporal
    check: "logical now is inside [distribution_start, distribution_end] inclusive when distribution begins"
    error_id: ERR_OUTSIDE_DISTRIBUTION_WINDOW
    http_status: 409
    applies_to: "POST /usage-licenses/{id}/go-live"
  - priority: 80
    category: business_constraint
    check: >-
      an EXCLUSIVE grant's half-open [effective_from, effective_until) term must not overlap any
      other non-terminal grant for the same talent that shares at least one media type and at
      least one territory; a NON_EXCLUSIVE grant must not overlap an existing EXCLUSIVE one on the
      same basis. Adjacency (one term's effective_until equal to the next term's effective_from)
      is permitted.
    error_id: ERR_EXCLUSIVITY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /consent-grants"
  - priority: 82
    category: business_constraint
    check: >-
      at most MAX_OVERLAPPING_LICENSES (2) UsageLicense rows with distribution_status in
      {ISSUED, LIVE} may hold closed inclusive [distribution_start, distribution_end] windows that
      overlap on the same digital_replica_id and share at least one territory code; touching
      windows (one ending exactly when the next begins) DO count as overlapping
    error_id: ERR_REPLICA_OVERLAP_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /usage-licenses"
  - priority: 84
    category: business_constraint
    check: >-
      a resubmission is refused when the performance has exhausted its revision rounds — either
      review_status == REVISION_REQUESTED with revision_round >= MAX_REVISION_ROUNDS (3), or
      review_status == REJECTED with rejection_reason == REVISION_LIMIT_REACHED, which is the reachable
      form since the fourth REQUEST_REVISION rejects instead of looping. The priority 38 state rung
      defers to this rung for that rejection reason
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /generated-performances/{id}/resubmit"
  - priority: 86
    category: business_constraint
    check: "ConsentGrant.revocable is true when a revocation is requested"
    error_id: ERR_CONSENT_NOT_REVOCABLE
    http_status: 409
    applies_to: "POST /consent-grants/{id}/revoke"
  - priority: 88
    category: business_constraint
    check: "InfringementCase.severity_score >= ESCALATION_FLOOR (0.5000) when legal escalation is requested"
    error_id: ERR_SEVERITY_BELOW_ESCALATION_FLOOR
    http_status: 409
    applies_to: "POST /infringement-cases/{id}/escalate"
  - priority: 90
    category: business_fiscal
    check: >-
      for a union-covered grant, per_use_base_fee_cents must be at least
      UNION_FLOOR_RATIO (0.5) times the selected UnionMinimumSchedule.minimum_per_use_cents — the
      top-up mechanism absorbs a shortfall, but a fee below half the negotiated floor is not a
      good-faith rate at all. Ranked last so that a frozen talent, a scope breach or a term defect
      is always reported ahead of the money defect.
    error_id: ERR_COMPENSATION_BELOW_STATUTORY_FLOOR
    http_status: 422
    applies_to: "POST /consent-grants"

endpoints:
  # ---------- reference data ----------
  - method: POST
    path: "/state-law-profiles"
    description: "Register one state's likeness-rights law profile. State codes are unique; a second POST for the same state_code is rejected with ERR_INVALID_REQUEST."
    roles: [RightsAdministrator]
    code: 201
    input: [state_code, postmortem_rights_years, postmortem_requires_registration, biometric_retention_max_days, deletion_grace_days, removal_window_days, disclosure_required_advertising, disclosure_required_entertainment, min_disclosure_rank_advertising, min_disclosure_rank_entertainment]
    output: StateLawProfile
    side_effects: []
  - method: GET
    path: "/state-law-profiles/{id}"
    description: "Read one state law profile."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: []
    output: StateLawProfile
    side_effects: []
  - method: GET
    path: "/state-law-profiles"
    description: "List state law profiles, newest first by created_at then id."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: StateLawProfile[]
    side_effects: []
  - method: POST
    path: "/union-minimum-schedules"
    description: "Register one union minimum row for a union_code / media_type / effective_from triple."
    roles: [RightsAdministrator]
    code: 201
    input: [union_code, media_type, effective_from, minimum_initial_cents, minimum_per_use_cents]
    output: UnionMinimumSchedule
    side_effects: []
  - method: GET
    path: "/union-minimum-schedules/{id}"
    description: "Read one union minimum schedule row."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: []
    output: UnionMinimumSchedule
    side_effects: []
  - method: GET
    path: "/union-minimum-schedules"
    description: "List union minimum rows, ordered by effective_from ascending then created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: ["union_code?", "media_type?", "limit?", "offset?"]
    output: UnionMinimumSchedule[]
    side_effects: []

  # ---------- talent and estate ----------
  - method: POST
    path: "/talents"
    description: "Create a talent record. life_status is always LIVING at creation; date_of_death, postmortem_rights_until and every derived counter are ignored if supplied."
    roles: [RightsAdministrator]
    code: 201
    input: [legal_name, domicile_state_code, "union_code?"]
    output: Talent
    side_effects:
      - "rights_posture initialised to CLEAR; open_removal_obligation_count, legal_hold_asset_count and lifetime_compensation_cents initialised to 0"
      - "requires a StateLawProfile for domicile_state_code, else ERR_STATE_LAW_PROFILE_MISSING"
  - method: GET
    path: "/talents/{id}"
    description: "Read one talent including derived posture and counters."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: []
    output: Talent
    side_effects: []
  - method: GET
    path: "/talents"
    description: "List talents, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer]
    code: 200
    input: ["domicile_state_code?", "life_status?", "rights_posture?", "limit?", "offset?"]
    output: Talent[]
    side_effects: []
  - method: POST
    path: "/talents/{id}/death-record"
    description: "Record a talent's death, freezing domicile law and opening post-mortem administration."
    roles: [RightsAdministrator]
    code: 200
    input: [date_of_death]
    output: Talent
    side_effects:
      - "life_status = DECEASED; postmortem_rights_until = calculations.postmortem_rights_expiry DOMICILE_LAW variant"
      - "cascade hop 2: every ConsentGrant of this talent with grantor_kind == TALENT and status == ACTIVE moves to SUSPENDED with suspension_reason = DEATH_PENDING_ESTATE"
      - "cascade hop 3: every DigitalReplica under those grants in {BUILT, APPROVED_FOR_USE} moves to QUARANTINED with quarantine_reason = ESTATE_PENDING and held_from_status recorded"
      - "cascade hop 4: rights_posture recomputed by calculations.talent_rights_posture (becomes RESTRICTED)"
      - "increments Talent.version by 1"
  - method: POST
    path: "/talents/{id}/estate-authorities"
    description: "Submit an estate authority claim for a deceased talent. The submitter is recorded for segregation-of-duties enforcement at verification time."
    roles: [RightsAdministrator]
    code: 201
    input: [executor_name, court_document_ref, "registration_number?"]
    output: EstateAuthority
    side_effects:
      - "status = SUBMITTED; submitted_by_user_id = X-User-ID"
  - method: GET
    path: "/talents/{id}/estate-authorities"
    description: "List every estate authority claim for a talent, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, EstateRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EstateAuthority[]
    side_effects: []
  - method: GET
    path: "/estate-authorities/{id}"
    description: "Read one estate authority claim."
    roles: [RightsAdministrator, ComplianceOfficer, EstateRepresentative]
    code: 200
    input: []
    output: EstateAuthority
    side_effects: []
  - method: POST
    path: "/estate-authorities/{id}/verify"
    description: "Verify an estate authority claim against the court document. The verifier must not be the drafter of any consent that will rely on this authority."
    roles: [RightsAdministrator]
    code: 200
    input: []
    output: EstateAuthority
    side_effects:
      - "status = VERIFIED; verified_by_user_id = X-User-ID; verified_at = logical now"
      - "Talent.postmortem_registration_number = this authority's registration_number"
      - "cascade: every ConsentGrant of this talent in SUSPENDED with suspension_reason == DEATH_PENDING_ESTATE returns to ACTIVE, and every DigitalReplica quarantined with reason ESTATE_PENDING returns to its held_from_status"
      - "Talent.rights_posture recomputed; increments EstateAuthority.version and Talent.version by 1"

  # ---------- consent grants ----------
  - method: POST
    path: "/consent-grants"
    description: >-
      Draft a consent grant for digital replica creation. Carries expected_talent_version so a
      drafter working from a stale view of the talent is rejected rather than silently binding
      terms that no longer reflect the talent's posture, union status or life status.
    roles: [RightsAdministrator]
    code: 201
    input: [talent_id, grantor_kind, permitted_media_types, permitted_use_notes, territory_codes, exclusivity, effective_from, effective_until, initial_creation_fee_cents, per_use_base_fee_cents, expected_talent_version, "estate_authority_id?", "talent_share_pct?", "agency_share_pct?", "approval_required?", "revocable?"]
    output: ConsentGrant
    side_effects:
      - "status = PENDING_COUNTERSIGN; drafted_by_user_id = X-User-ID"
      - "union_code_snapshot = Talent.union_code at draft time (null when NONE); administrator_share_pct = 1 - talent_share_pct - agency_share_pct"
      - "increments Talent.version by 1"
  - method: GET
    path: "/consent-grants/{id}"
    description: "Read one consent grant including its compensation roll-up."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: []
    output: ConsentGrant
    side_effects: []
  - method: GET
    path: "/consent-grants"
    description: "List consent grants, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: ["talent_id?", "estate_authority_id?", "status?", "exclusivity?", "limit?", "offset?"]
    output: ConsentGrant[]
    side_effects: []
  - method: POST
    path: "/consent-grants/{id}/countersign"
    description: "Countersign a drafted grant, activating it and posting the initial creation compensation."
    roles: [TalentRepresentative, EstateRepresentative]
    code: 200
    input: []
    output: ConsentGrant
    side_effects:
      - "status = ACTIVE; countersigned_at = logical now"
      - "initial_compensation_cents and union_topup_cents computed by calculations.initial_creation_compensation"
      - "appends CompensationEntry(entry_type=INITIAL_CREATION, amount_cents = the scaled amount) and, when union_topup_cents > 0, a second CompensationEntry(entry_type=UNION_TOPUP) — both split by calculations.royalty_share_split"
      - "total_compensation_cents recomputed; Talent.lifetime_compensation_cents recomputed"
      - "increments ConsentGrant.version and Talent.version by 1"
  - method: POST
    path: "/consent-grants/{id}/suspension"
    description: "Suspend an active grant or reinstate a suspended one. SUSPEND freezes new exploitation without destroying the grant; REINSTATE returns it to ACTIVE."
    roles: [RightsAdministrator]
    code: 200
    input: [action, "suspension_reason?"]
    output: ConsentGrant
    side_effects:
      - "SUSPEND: status = SUSPENDED, suspension_reason = the supplied reason (default COMPLIANCE_HOLD)"
      - "REINSTATE: status = ACTIVE, suspension_reason = null"
      - "Talent.rights_posture recomputed by calculations.talent_rights_posture"
      - "increments ConsentGrant.version and Talent.version by 1"
  - method: POST
    path: "/consent-grants/{id}/revoke"
    description: "Revoke a consent grant. This is the deepest cascade in the system: it terminates the grant, quarantines the replicas built under it, withdraws their pending performances with the accruals reversed, and opens removal obligations on any distributed license."
    roles: [TalentRepresentative, EstateRepresentative]
    code: 200
    input: [revocation_note]
    output: ConsentGrant
    side_effects:
      - "hop 1: status = REVOKED; effective_end_actual = logical now"
      - "hop 2: every DigitalReplica under this grant in {BUILT, APPROVED_FOR_USE} moves to QUARANTINED with quarantine_reason = CONSENT_REVOKED and held_from_status recorded"
      - "hop 3: every GeneratedPerformance under those replicas in {SUBMITTED, REVISION_REQUESTED, APPROVED} moves to WITHDRAWN with its PER_USE_PROVISIONAL accrual reversed"
      - "hop 4: every UsageLicense on those performances in {ISSUED, LIVE} moves to distribution_status REMOVAL_PENDING with removal_reason = CONSENT_REVOKED and removal_deadline from calculations.license_removal_deadline"
      - "hop 5: every BiometricAsset of this grant not already PURGED has retention_until recomputed by calculations.biometric_retention_deadline against the new effective_end_actual"
      - "Talent.open_removal_obligation_count and rights_posture recomputed"
      - "increments ConsentGrant.version and Talent.version by 1"

  # ---------- biometric assets ----------
  - method: POST
    path: "/biometric-assets"
    description: "Register a captured biometric or voice sample under an active consent grant, stamping its retention deadline from the binding of statutory ceiling and consent term."
    roles: [RightsAdministrator]
    code: 201
    input: [talent_id, consent_grant_id, asset_kind, capture_ref, storage_class, payload_digest]
    output: BiometricAsset
    side_effects:
      - "status = STORED; retention_until computed by calculations.biometric_retention_deadline; purge_due_at stays null until a sweep schedules the purge"
  - method: GET
    path: "/biometric-assets/{id}"
    description: "Read one biometric asset, including its retention and hold state."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: []
    output: BiometricAsset
    side_effects: []
  - method: GET
    path: "/biometric-assets"
    description: "List biometric assets, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: ["talent_id?", "consent_grant_id?", "status?", "asset_kind?", "limit?", "offset?"]
    output: BiometricAsset[]
    side_effects: []
  - method: POST
    path: "/biometric-assets/{id}/purge"
    description: "Destroy a stored sample ahead of its scheduled purge. Refused while the material is impounded or still backing a live replica."
    roles: [RightsAdministrator]
    code: 200
    input: [purge_note]
    output: BiometricAsset
    side_effects:
      - "status = PURGED; payload_digest = null; purged_at = logical now"
      - "increments BiometricAsset.version by 1"

  # ---------- digital replicas ----------
  - method: POST
    path: "/digital-replicas"
    description: >-
      Build a digital replica from stored samples. The source-asset legal-hold check outranks the
      consent-match check here, so impounded material is reported as a safety failure even when the
      request also mixes in material from the wrong grant. The talent's FROZEN posture is
      deliberately NOT a gate on this endpoint — the legal-hold state of the specific source assets
      is the operative safety signal.
    roles: [RightsAdministrator]
    code: 201
    input: [talent_id, consent_grant_id, replica_kind, source_asset_ids, build_ref]
    output: DigitalReplica
    side_effects:
      - "status = BUILT; open_license_count = 0"
  - method: GET
    path: "/digital-replicas/{id}"
    description: "Read one digital replica, including its version for optimistic-concurrency use at license issuance."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: []
    output: DigitalReplica
    side_effects: []
  - method: GET
    path: "/digital-replicas"
    description: "List digital replicas, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: ["talent_id?", "consent_grant_id?", "status?", "replica_kind?", "limit?", "offset?"]
    output: DigitalReplica[]
    side_effects: []
  - method: POST
    path: "/digital-replicas/{id}/approve-for-use"
    description: "Talent-side (or estate-side) approval that the built replica may be exploited."
    roles: [TalentRepresentative, EstateRepresentative]
    code: 200
    input: ["approval_note?"]
    output: DigitalReplica
    side_effects:
      - "status = APPROVED_FOR_USE; approved_at = logical now; approved_by_user_id = X-User-ID"
      - "increments DigitalReplica.version by 1"

  # ---------- generated performances ----------
  - method: POST
    path: "/generated-performances"
    description: "Submit a generated performance for talent approval, accruing the provisional per-use royalty on the licensee's own projections."
    roles: [LicenseeProducer]
    code: 201
    input: [digital_replica_id, licensee_name, media_type, territory_codes, intended_use_description, projected_impressions, scheduled_first_use_at]
    output: GeneratedPerformance
    side_effects:
      - "review_status = SUBMITTED; revision_round = 0; licensee_user_id = X-User-ID; review_deadline = logical now + REVIEW_WINDOW_DAYS (7) days"
      - "provisional_compensation_cents computed by calculations.per_use_compensation PROVISIONAL variant"
      - "appends CompensationEntry(entry_type=PER_USE_PROVISIONAL) split by calculations.royalty_share_split; ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents recomputed"
      - "increments Talent.version by 1"
  - method: GET
    path: "/generated-performances/{id}"
    description: "Read one generated performance including its review state and provisional accrual."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: []
    output: GeneratedPerformance
    side_effects: []
  - method: GET
    path: "/generated-performances"
    description: "List generated performances, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: ["digital_replica_id?", "licensee_user_id?", "review_status?", "media_type?", "limit?", "offset?"]
    output: GeneratedPerformance[]
    side_effects: []
  - method: POST
    path: "/generated-performances/{id}/review"
    description: "Exercise the approval right over a generated performance: approve it, send it back for revision, or reject it outright."
    roles: [TalentRepresentative, EstateRepresentative]
    code: 200
    input: [decision, "review_note?", "rejection_reason?"]
    output: GeneratedPerformance
    side_effects:
      - "APPROVE: review_status = APPROVED, reviewed_by_user_id = X-User-ID; the provisional accrual is retained"
      - "REQUEST_REVISION below the revision cap: review_status = REVISION_REQUESTED"
      - "REJECT, or REQUEST_REVISION at revision_round == MAX_REVISION_ROUNDS (3): review_status = REJECTED with rejection_reason (REVISION_LIMIT_REACHED in the capped case) and a REVERSAL CompensationEntry that undoes the provisional accrual; provisional_compensation_cents = 0"
      - "on rejection: ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents recomputed; increments Talent.version by 1"
      - "increments GeneratedPerformance.version by 1"
  - method: POST
    path: "/generated-performances/{id}/resubmit"
    description: "Resubmit a revision-requested performance with new projections; the stale provisional accrual is reversed and replaced rather than adjusted in place."
    roles: [LicenseeProducer]
    code: 200
    input: [intended_use_description, projected_impressions]
    output: GeneratedPerformance
    side_effects:
      - "review_status = SUBMITTED; revision_round += 1; reviewed_by_user_id = null; review_deadline = logical now + REVIEW_WINDOW_DAYS (7) days"
      - "appends a REVERSAL CompensationEntry for the live PER_USE_PROVISIONAL entry, then a fresh PER_USE_PROVISIONAL entry recomputed on the new projected_impressions"
      - "provisional_compensation_cents = the new amount; ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents recomputed"
      - "increments GeneratedPerformance.version and Talent.version by 1"

  # ---------- usage licenses ----------
  - method: POST
    path: "/usage-licenses"
    description: >-
      Issue a usage license against an approved performance. Carries expected_replica_version so a
      licensee working from a stale view of the replica — one whose approval, source assets or open
      license count has since moved — is rejected instead of licensing material it never saw.
    roles: [LicenseeProducer]
    code: 201
    input: [generated_performance_id, channel, territory_codes, distribution_start, distribution_end, actual_impressions, expected_replica_version]
    output: UsageLicense
    side_effects:
      - "distribution_status = ISSUED; licensee_user_id = the performance's licensee_user_id; issued_by_user_id = X-User-ID"
      - "disclosure_required resolved from the domicile StateLawProfile for the license channel; compliance_status = PENDING_LABEL when required, VERIFIED when not"
      - "per_use_final_cents computed by calculations.per_use_compensation FINAL variant; compliance_surcharge_cents and license_total_cents by calculations.license_total_cost"
      - "appends CompensationEntry(entry_type=PER_USE_FINAL) split by calculations.royalty_share_split; the compliance surcharge is NOT posted to the ledger"
      - "DigitalReplica.open_license_count += 1; ConsentGrant.total_compensation_cents and Talent.lifetime_compensation_cents recomputed"
      - "increments DigitalReplica.version and Talent.version by 1"
  - method: GET
    path: "/usage-licenses/{id}"
    description: "Read one usage license, including both independent status dimensions and the removal obligation."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: []
    output: UsageLicense
    side_effects: []
  - method: GET
    path: "/usage-licenses"
    description: "List usage licenses, ordered by created_at ascending."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative, LicenseeProducer]
    code: 200
    input: ["generated_performance_id?", "licensee_user_id?", "distribution_status?", "compliance_status?", "channel?", "limit?", "offset?"]
    output: UsageLicense[]
    side_effects: []
  - method: POST
    path: "/usage-licenses/{id}/disclosure"
    description: "Attest the synthetic-content disclosure label and its placement. Placement must meet or exceed the state's minimum rank for the channel."
    roles: [LicenseeProducer]
    code: 200
    input: [disclosure_placement, disclosure_label_text]
    output: UsageLicense
    side_effects:
      - "compliance_status = LABELED; disclosure_verified_by_user_id = null"
      - "increments UsageLicense.version by 1"
  - method: POST
    path: "/usage-licenses/{id}/disclosure-verification"
    description: "Compliance review of an attested disclosure: accept it (VERIFIED, distribution may begin) or reject it (NON_COMPLIANT, re-attestation required)."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: UsageLicense
    side_effects:
      - "ACCEPT: compliance_status = VERIFIED, disclosure_verified_by_user_id = X-User-ID"
      - "REJECT: compliance_status = NON_COMPLIANT, disclosure_verified_by_user_id = null; the attested placement and label text are retained"
      - "increments UsageLicense.version by 1"
  - method: POST
    path: "/usage-licenses/{id}/go-live"
    description: "Begin distribution of the licensed synthetic content. Refused unless the disclosure is verified and the logical clock sits inside the licensed window."
    roles: [LicenseeProducer]
    code: 200
    input: [distribution_reference]
    output: UsageLicense
    side_effects:
      - "distribution_status = LIVE; distribution_reference stored"
      - "increments UsageLicense.version by 1"
  - method: POST
    path: "/usage-licenses/{id}/confirm-removal"
    description: "Confirm that distributed content has been pulled down, discharging the removal obligation."
    roles: [LicenseeProducer]
    code: 200
    input: []
    output: UsageLicense
    side_effects:
      - "distribution_status = REMOVAL_CONFIRMED; removal_confirmed_at = logical now"
      - "Talent.open_removal_obligation_count -= 1 and rights_posture recomputed; DigitalReplica.open_license_count -= 1"
      - "a compliance_status of NON_COMPLIANT stamped by an earlier overdue sweep is NOT cleared by a late confirmation"
      - "increments UsageLicense.version, Talent.version and DigitalReplica.version by 1"

  # ---------- compensation ledger ----------
  - method: GET
    path: "/compensation-entries/{id}"
    description: "Read one append-only compensation ledger entry."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: []
    output: CompensationEntry
    side_effects: []
  - method: GET
    path: "/compensation-entries"
    description: "List ledger entries, ordered by posted_at ascending then created_at ascending. The only discovery channel for cascade-created reversals."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: ["talent_id?", "consent_grant_id?", "generated_performance_id?", "usage_license_id?", "reverses_entry_id?", "entry_type?", "limit?", "offset?"]
    output: CompensationEntry[]
    side_effects: []

  # ---------- unauthorized-use monitoring ----------
  - method: POST
    path: "/infringement-cases"
    description: "Open a suspected unauthorized-use case from a monitoring hit, scoring its severity and resolving enforceability under the law of the state where the use was detected."
    roles: [ComplianceOfficer]
    code: 201
    input: [talent_id, detection_source, suspect_url, detected_channel, detected_state_code, detected_view_count, match_confidence, "matched_usage_license_id?"]
    output: InfringementCase
    side_effects:
      - "status = DETECTED; severity_score computed by calculations.infringement_severity_score from the talent's posture as it stands before this case is persisted"
      - "use_state_rights_until and enforceable_under_use_state computed by calculations.postmortem_rights_expiry USE_STATE_LAW variant against detected_state_code (a LIVING talent is always enforceable)"
      - "legal_hold_applied_count = 0"
  - method: GET
    path: "/infringement-cases/{id}"
    description: "Read one infringement case, including its severity score and enforceability finding."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: []
    output: InfringementCase
    side_effects: []
  - method: GET
    path: "/infringement-cases"
    description: "List infringement cases, ordered by created_at ascending. The only discovery channel for cases opened automatically by a compliance sweep."
    roles: [RightsAdministrator, ComplianceOfficer, TalentRepresentative, EstateRepresentative]
    code: 200
    input: ["talent_id?", "matched_usage_license_id?", "status?", "detection_source?", "limit?", "offset?"]
    output: InfringementCase[]
    side_effects: []
  - method: POST
    path: "/infringement-cases/{id}/triage"
    description: "Triage a detected case: dismiss it, or issue a takedown. A case at or above the mandatory-takedown severity threshold may not be dismissed."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: InfringementCase
    side_effects:
      - "triaged_by_user_id = X-User-ID"
      - "DISMISS: status = DISMISSED_LICENSED with closure_outcome = LICENSED_USE_CONFIRMED when a distributable matched license explains the hit, otherwise DISMISSED_NO_ACTION with closure_outcome = BELOW_ENFORCEMENT_THRESHOLD"
      - "ISSUE_TAKEDOWN: status = TAKEDOWN_ISSUED; takedown_issued_at = logical now"
      - "increments InfringementCase.version by 1"
  - method: POST
    path: "/infringement-cases/{id}/escalate"
    description: >-
      Escalate an issued takedown to legal action. This impounds the talent's stored samples,
      quarantines every replica built from them, withdraws the pending performances and opens
      removal obligations on distributed licenses. The escalating administrator must not be the
      officer who triaged the case.
    roles: [RightsAdministrator]
    code: 200
    input: [escalation_note]
    output: InfringementCase
    side_effects:
      - "hop 1: status = LEGAL_ESCALATED; escalated_by_user_id = X-User-ID"
      - "hop 2: every BiometricAsset of this talent in {STORED, PURGE_SCHEDULED} moves to LEGAL_HOLD with held_from_status recorded; legal_hold_applied_count = the number moved"
      - "hop 3: every DigitalReplica of this talent whose source_asset_ids intersects the newly held assets and whose status is in {BUILT, APPROVED_FOR_USE} moves to QUARANTINED with quarantine_reason = SOURCE_LEGAL_HOLD"
      - "hop 4: every GeneratedPerformance under those replicas in {SUBMITTED, REVISION_REQUESTED, APPROVED} moves to WITHDRAWN with its provisional accrual reversed"
      - "hop 5: every UsageLicense on those performances in {ISSUED, LIVE} moves to REMOVAL_PENDING with removal_reason = REPLICA_QUARANTINED"
      - "Talent.legal_hold_asset_count, open_removal_obligation_count and rights_posture (FROZEN) recomputed"
      - "increments InfringementCase.version and Talent.version by 1"
  - method: POST
    path: "/infringement-cases/{id}/close"
    description: "Close a case. Closing an escalated case releases every legal hold it applied and restores each impounded asset and quarantined replica to the exact status it held before escalation."
    roles: [RightsAdministrator, ComplianceOfficer]
    code: 200
    input: [outcome]
    output: InfringementCase
    side_effects:
      - "TAKEDOWN_ISSUED + outcome REMOVED: status = RESOLVED_REMOVED, closure_outcome = VOLUNTARY_REMOVAL, no holds to release"
      - "LEGAL_ESCALATED + outcome SETTLED or LITIGATED: status = CLOSED_SETTLED or CLOSED_LITIGATED"
      - "release: when no other InfringementCase of this talent remains LEGAL_ESCALATED, every BiometricAsset in LEGAL_HOLD returns to held_from_status and every DigitalReplica quarantined with reason SOURCE_LEGAL_HOLD returns to held_from_status; held_from_status and quarantine_reason cleared"
      - "Talent.legal_hold_asset_count and rights_posture recomputed; WITHDRAWN performances and REMOVAL_PENDING licenses are not restored"
      - "closed_by_user_id = X-User-ID; increments InfringementCase.version and Talent.version by 1"

  # ---------- operations ----------
  - method: POST
    path: "/compliance-sweeps"
    description: >-
      Run the periodic compliance sweep at the current logical clock. Phases execute in this pinned
      order, and within each phase rows are processed by created_at ascending: (1) consent expiry —
      ACTIVE/SUSPENDED grants whose effective_until <= now become EXPIRED and their replicas RETIRED;
      (2) license expiry — ISSUED/LIVE licenses whose distribution_end < now become REMOVAL_PENDING
      with removal_reason TERM_EXPIRED and a fresh removal_deadline; (3) overdue removals —
      REMOVAL_PENDING licenses whose removal_deadline < now with no removal_confirmed_at get
      compliance_status NON_COMPLIANT and an auto-opened InfringementCase (detection_source SWEEP,
      match_confidence 1.000, suspect_url = the license's distribution_reference); (4) lapsed reviews
      — SUBMITTED performances whose review_deadline <= now become REJECTED with rejection_reason
      REVIEW_WINDOW_LAPSED and their provisional accruals reversed; (5) retention — STORED assets
      whose retention_until <= now become PURGE_SCHEDULED with purge_due_at = retention_until + 7
      days, then PURGE_SCHEDULED assets whose purge_due_at <= now become PURGED with payload_digest
      cleared. Assets in LEGAL_HOLD are skipped by phase 5 entirely. Running the sweep twice at the
      same logical clock changes nothing on the second run.
    roles: [RightsAdministrator, ComplianceOfficer]
    code: 200
    input: []
    output: { sweep_id: string, run_at: datetime, expired_consent_count: integer, retired_replica_count: integer, expired_license_count: integer, removal_pending_count: integer, overdue_removal_count: integer, auto_rejected_performance_count: integer, purge_scheduled_count: integer, purged_count: integer, opened_case_count: integer }
    side_effects:
      - "all five phases as described, each recomputing Talent.open_removal_obligation_count, Talent.lifetime_compensation_cents, ConsentGrant.total_compensation_cents and Talent.rights_posture for every affected talent"
      - "increments the version of every entity row it mutates by 1"
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Test-driving endpoint that moves the server's logical clock. Before any call to this endpoint
      the logical clock reads exactly 2026-08-01T00:00:00Z — the fixed startup default — and never
      falls back to real wall-clock time. Every deadline, retention window, expiry and sweep phase
      is evaluated against this logical clock.
    roles: [RightsAdministrator, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "no entity is mutated; the clock value alone changes"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body or query — missing required field, enum out of range, negative amount, money sent as a string, unparseable datetime, empty required array, pagination limit outside [1, 100], duplicate state_code on a state law profile"
  - id: ERR_TALENT_NOT_FOUND
    http: 404
    condition: "no Talent matches the supplied id"
  - id: ERR_ESTATE_AUTHORITY_NOT_FOUND
    http: 404
    condition: "no EstateAuthority matches the supplied id"
  - id: ERR_CONSENT_GRANT_NOT_FOUND
    http: 404
    condition: "no ConsentGrant matches the supplied id"
  - id: ERR_BIOMETRIC_ASSET_NOT_FOUND
    http: 404
    condition: "no BiometricAsset matches the supplied id, including any member of source_asset_ids"
  - id: ERR_DIGITAL_REPLICA_NOT_FOUND
    http: 404
    condition: "no DigitalReplica matches the supplied id"
  - id: ERR_GENERATED_PERFORMANCE_NOT_FOUND
    http: 404
    condition: "no GeneratedPerformance matches the supplied id"
  - id: ERR_USAGE_LICENSE_NOT_FOUND
    http: 404
    condition: "no UsageLicense matches the supplied id, including matched_usage_license_id on a case"
  - id: ERR_INFRINGEMENT_CASE_NOT_FOUND
    http: 404
    condition: "no InfringementCase matches the supplied id"
  - id: ERR_COMPENSATION_ENTRY_NOT_FOUND
    http: 404
    condition: "no CompensationEntry matches the supplied id"
  - id: ERR_STATE_LAW_PROFILE_MISSING
    http: 422
    condition: "no StateLawProfile exists for a state code the operation must consult (talent domicile, or a case's detected_state_code)"
  - id: ERR_UNION_SCHEDULE_MISSING
    http: 422
    condition: "the grant carries a union_code_snapshot but no UnionMinimumSchedule row exists for that union and the required media_type with effective_from at or before the reference date"
  - id: ERR_NOT_TALENT_REPRESENTATIVE
    http: 403
    condition: "acting TalentRepresentative's X-User-ID is not the talent_id behind the target resource"
  - id: ERR_NOT_ESTATE_REPRESENTATIVE
    http: 403
    condition: "acting EstateRepresentative's X-User-ID is not a VERIFIED EstateAuthority of the talent behind the target resource"
  - id: ERR_NOT_LICENSEE_OWNER
    http: 403
    condition: "acting LicenseeProducer's X-User-ID is not the licensee_user_id on the target performance or license"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the estate verifier is the same user that submitted that authority, or the escalating administrator is the user that triaged the case"
  - id: ERR_TALENT_VERSION_STALE
    http: 412
    condition: "expected_talent_version does not equal the current Talent.version at POST /consent-grants"
  - id: ERR_REPLICA_VERSION_STALE
    http: 412
    condition: "expected_replica_version does not equal the current DigitalReplica.version at POST /usage-licenses"
  - id: ERR_INVALID_TALENT_STATE
    http: 409
    condition: "a death record is written for a talent whose life_status is already DECEASED"
  - id: ERR_INVALID_ESTATE_AUTHORITY_STATE
    http: 409
    condition: "an estate authority already VERIFIED (or REJECTED) is verified again"
  - id: ERR_INVALID_CONSENT_STATE
    http: 409
    condition: "the consent grant's status does not admit the requested operation — countersigning a non-PENDING_COUNTERSIGN grant, suspending a terminal grant, reinstating an ACTIVE grant, or revoking a REVOKED or EXPIRED grant"
  - id: ERR_CONSENT_NOT_ACTIVE
    http: 409
    condition: "the governing consent grant is not ACTIVE when a downstream asset, replica, performance or license operation is attempted"
  - id: ERR_INVALID_ASSET_STATE
    http: 409
    condition: "a manual purge targets an asset already PURGED"
  - id: ERR_INVALID_REPLICA_STATE
    http: 409
    condition: "approval targets a replica that is not BUILT, or a performance is submitted against a replica that is not APPROVED_FOR_USE"
  - id: ERR_INVALID_PERFORMANCE_STATE
    http: 409
    condition: "review targets a performance that is not SUBMITTED, resubmit targets one that is not REVISION_REQUESTED, or a license is issued against one that is not APPROVED"
  - id: ERR_INVALID_LICENSE_STATE
    http: 409
    condition: "go-live targets a license whose distribution_status is not ISSUED, or confirm-removal targets one whose distribution_status is not REMOVAL_PENDING"
  - id: ERR_INVALID_DISCLOSURE_STATE
    http: 409
    condition: "a disclosure is attested on a license whose compliance_status is LABELED or VERIFIED, or a verification decision is applied to a license whose compliance_status is not LABELED"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "triage targets a case that is not DETECTED, escalation targets one that is not TAKEDOWN_ISSUED, or a close outcome does not match the case's current branch"
  - id: ERR_TALENT_RIGHTS_FROZEN
    http: 409
    condition: "the talent's rights_posture is FROZEN because an InfringementCase of theirs is LEGAL_ESCALATED"
  - id: ERR_TALENT_RIGHTS_RESTRICTED
    http: 409
    condition: "the talent's rights_posture is RESTRICTED (an open removal obligation or a suspended grant) and the request would put new synthetic content into distribution"
  - id: ERR_ESTATE_AUTHORITY_UNVERIFIED
    http: 409
    condition: "the talent is DECEASED and no EstateAuthority for that talent has status VERIFIED"
  - id: ERR_REPLICA_SOURCE_UNDER_LEGAL_HOLD
    http: 409
    condition: "a member of source_asset_ids is a BiometricAsset in LEGAL_HOLD"
  - id: ERR_ASSET_UNDER_LEGAL_HOLD
    http: 409
    condition: "a manual purge targets a BiometricAsset in LEGAL_HOLD"
  - id: ERR_ASSET_BOUND_TO_ACTIVE_REPLICA
    http: 409
    condition: "a manual purge targets an asset still listed in the source_asset_ids of a replica in BUILT or APPROVED_FOR_USE"
  - id: ERR_POSTMORTEM_REGISTRATION_MISSING
    http: 422
    condition: "the domicile state requires post-mortem rights registration and the talent has no postmortem_registration_number"
  - id: ERR_POSTMORTEM_RIGHTS_EXPIRED
    http: 422
    condition: "an estate-granted consent is drafted after the domicile-law post-mortem term has lapsed (or the state grants none), or a takedown is issued on a case whose enforceable_under_use_state is false"
  - id: ERR_DISCLOSURE_PLACEMENT_INSUFFICIENT
    http: 422
    condition: "the attested disclosure_placement ranks below the state's minimum rank for the license channel"
  - id: ERR_DISCLOSURE_NOT_VERIFIED
    http: 409
    condition: "distribution is started while compliance_status is not VERIFIED"
  - id: ERR_TAKEDOWN_MANDATORY
    http: 409
    condition: "triage attempts DISMISS on a case whose severity_score is at or above 0.7500 while enforceable_under_use_state is true"
  - id: ERR_MEDIA_TYPE_OUT_OF_SCOPE
    http: 422
    condition: "the requested media type is not in the governing grant's permitted_media_types"
  - id: ERR_TERRITORY_OUT_OF_SCOPE
    http: 422
    condition: "a requested territory code is outside the governing grant's territory_codes, or outside the parent performance's territory_codes"
  - id: ERR_ASSET_CONSENT_MISMATCH
    http: 422
    condition: "a source asset belongs to a different consent grant or a different talent than the replica being built"
  - id: ERR_NO_SOURCE_ASSETS
    http: 422
    condition: "source_asset_ids is empty or contains duplicates"
  - id: ERR_CONSENT_TERM_INVALID
    http: 422
    condition: "effective_from is not strictly before effective_until, or the term is shorter than 30 days"
  - id: ERR_WINDOW_EXCEEDS_CONSENT_TERM
    http: 422
    condition: "the requested distribution window is not entirely inside the grant's half-open term"
  - id: ERR_OUTSIDE_DISTRIBUTION_WINDOW
    http: 409
    condition: "the logical clock is outside the license's closed inclusive distribution window when go-live is attempted"
  - id: ERR_EXCLUSIVITY_WINDOW_CONFLICT
    http: 409
    condition: "an exclusivity conflict exists with a non-terminal grant for the same talent sharing a media type and a territory over an overlapping half-open term"
  - id: ERR_REPLICA_OVERLAP_CAP_EXCEEDED
    http: 409
    condition: "issuing this license would give the replica more than 2 distributable licenses whose closed inclusive windows overlap on a shared territory"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "resubmission is attempted after the revision rounds are exhausted — at revision_round == 3, or on a performance already REJECTED with rejection_reason REVISION_LIMIT_REACHED"
  - id: ERR_CONSENT_NOT_REVOCABLE
    http: 409
    condition: "revocation is attempted on a grant whose revocable flag is false"
  - id: ERR_SEVERITY_BELOW_ESCALATION_FLOOR
    http: 409
    condition: "legal escalation is attempted on a case whose severity_score is below 0.5000"
  - id: ERR_COMPENSATION_BELOW_STATUTORY_FLOOR
    http: 422
    condition: "a union-covered grant's per_use_base_fee_cents is below half the applicable UnionMinimumSchedule.minimum_per_use_cents"

roles:
  - name: RightsAdministrator
    description: "Talent rights and clearance office staff. Owns reference data, talent records, consent drafting, asset custody, replica building and legal escalation."
    identity: opaque
    exclusive_operations:
      - "POST /state-law-profiles"
      - "POST /union-minimum-schedules"
      - "POST /talents"
      - "POST /talents/{id}/death-record"
      - "POST /talents/{id}/estate-authorities"
      - "POST /estate-authorities/{id}/verify"
      - "POST /consent-grants"
      - "POST /consent-grants/{id}/suspension"
      - "POST /biometric-assets"
      - "POST /biometric-assets/{id}/purge"
      - "POST /digital-replicas"
      - "POST /infringement-cases/{id}/escalate"
    shared_operations:
      - "all GET reads"
      - "POST /infringement-cases/{id}/close"
      - "POST /compliance-sweeps"
      - "POST /_clock/set_current_utc"
  - name: TalentRepresentative
    description: "Acts for a living talent: countersigns consent, approves replicas and generated performances, and may revoke a revocable grant."
    identity: "entity_backed:Talent"
    exclusive_operations: []
    shared_operations:
      - "POST /consent-grants/{id}/countersign"
