# =============================================================================
# PRD-Bench Scaffold — §1.0–§1.7
# Task: task_2738_loyalty_liability_breakage_accounting
#
# Difficulty band: Expert+ (12 entities, 56 endpoints, 8 calculation rules,
# 5 non-linear state machines, 2 OCC races, segregation-of-duties RBAC).
#
# UNIT CONVENTIONS (used verbatim by every calculation and every test):
#   * All money is INTEGER CENTS. No floats are ever persisted.
#   * Standalone selling price (SSP) per point is expressed in
#     `ssp_millicents_per_point` = THOUSANDTHS OF A CENT per point.
#     e.g. 1200 -> 1.200 cent/point;  1500 -> 1.500 cent/point.
#   * All rates/multipliers are BASIS POINTS (bp), 10000 bp = 1.0000.
#   * `round_half_up(x)` = decimal ROUND_HALF_UP to 0 decimal places.
#   * All calendar arithmetic is in WHOLE DAYS on the logical clock. No
#     calendar-month arithmetic anywhere.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2738. Loyalty Liability & Breakage Accounting (retail loyalty finance): point issuance recognition with deferred revenue measurement at standalone selling price, redemption rate estimation by cohort with historical patterns and program change effects, breakage recognition methodology and periodic re-estimation with catch-up adjustments, point expiration policy by state law with escheatment considerations, tier benefit costing and promotional multiplier expense allocation, partner-issued and partner-redeemed point settlement with intercompany or third-party billing, program change impact modeling on liability and member behavior, audit support with actuarial memoranda and sensitivity analysis

domain_name: loyalty-liability-breakage-accounting
api_prefix: ""          # every collection is top-level: /programs, /point-lots, /breakage-estimates, ...

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Event sourcing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Not a tree: PointLot <-> RedemptionEvent is many-to-many through the
  # append-only RedemptionAllocation junction; BreakageEstimate is
  # self-referential through `supersedes_estimate_id`; PointLot and
  # RedemptionEvent both cross-reference PartnerAgreement, which lives in a
  # different aggregate from Member/Cohort.

  state_machine_shape: cyclic
  # BreakageEstimate: SUBMITTED -> REJECTED -> SUBMITTED (bounded revision loop)
  # AccountingPeriod:  OPEN -> SOFT_CLOSED -> OPEN (bounded reopen loop)
  # SettlementStatement: ISSUED -> DISPUTED -> ISSUED (bounded dispute loop)
  # Member: ACTIVE -> DORMANT -> ACTIVE (reactivation on new issuance)
  # PointLot carries two independent state dimensions on one row
  # (`lifecycle_state` x `settlement_state`).

  relationship_patterns:
    - one_to_many          # LoyaltyProgram -> Cohort / Member / AccountingPeriod / PartnerAgreement
    - many_to_many         # PointLot <-> RedemptionEvent via RedemptionAllocation
    - self_referential     # BreakageEstimate.supersedes_estimate_id -> BreakageEstimate.id
    - cross_aggregate      # PointLot.partner_agreement_id, RedemptionEvent.partner_agreement_id

  role_model: segregation_of_duties
  # The X-User-ID that prepared a BreakageEstimate may never be the X-User-ID
  # that approves it, regardless of role. LoyaltyAccountant prepares and
  # measures; Controller approves and closes; ProgramAdmin configures;
  # PartnerOperator may only dispute its own statements; Member may only
  # request redemptions on its own account.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: LoyaltyProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program display name.
        constraints: non-empty, max 120 chars
      - name: currency_code
        type: string
        source: input
        description: ISO-4217 reporting currency of the deferred-revenue ledger.
        default: "USD"
        constraints: exactly 3 uppercase letters
      - name: status
        type: enum
        source: system
        description: Program lifecycle state; see §1.2 LoyaltyProgram machine.
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, CLOSED}"
      - name: ssp_millicents_per_point
        type: integer
        source: input
        description: Standalone selling price of one point in thousandths of a cent. Snapshotted onto every PointLot at issuance.
        constraints: ">= 1 and <= 100000"
      - name: point_expiry_days
        type: integer
        source: input
        description: Whole days from PointLot.issued_at to PointLot.expires_at.
        constraints: ">= 1 and <= 3650"
      - name: per_issuance_point_cap
        type: integer
        source: input
        description: Maximum `points_issued` a single PointLot may carry after tier and promotional multipliers are applied. Boundary is inclusive (`points_issued <= cap` passes).
        constraints: ">= 1"
      - name: tier_multiplier_bp
        type: object
        source: input
        description: "Earn multiplier in basis points keyed by member tier. MUST declare exactly the four keys BASE, SILVER, GOLD, PLATINUM."
        constraints: each value integer >= 10000 and <= 50000
      - name: promo_multiplier_cap_bp
        type: integer
        source: input
        description: Upper bound accepted for a PointLot's `promo_multiplier_bp` input.
        default: 30000
        constraints: ">= 10000 and <= 100000"
      - name: breakage_method
        type: enum
        source: input
        description: Methodology selector consumed by the `estimated_redemption_rate` calculation.
        default: COHORT_WEIGHTED
        constraints: "one of {COHORT_WEIGHTED, PROGRAM_HISTORICAL}"
      - name: historical_redemption_rate_bp
        type: integer
        source: input
        description: Program-level historical redemption rate. Used directly by the PROGRAM_HISTORICAL variant and to seed `current_breakage_rate_bp` at activation.
        constraints: ">= 200 and <= 9800"
      - name: escheat_disclosure_threshold_cents
        type: integer
        source: input
        description: Once `total_escheat_accrual_cents` reaches this value (inclusive `>=`), `escheat_disclosure_required` latches to true.
        default: 100000
        constraints: ">= 0"
      - name: current_breakage_rate_bp
        type: integer
        source: computed
        description: "PERSISTED. Set to `10000 - historical_redemption_rate_bp` by POST /programs/{id}/activate, then overwritten by every BreakageEstimate approval. Snapshotted onto each PointLot as `breakage_rate_bp_at_issue`."
        default: 0
      - name: total_escheat_accrual_cents
        type: integer
        source: computed
        description: PERSISTED running total of `escheated_cents` across every PointLot that has reached lifecycle_state ESCHEATED. Only the expiry sweep cascade mutates it.
        default: 0
      - name: escheat_disclosure_required
        type: boolean
        source: computed
        description: PERSISTED latch. Flips false -> true (never back) when `total_escheat_accrual_cents >= escheat_disclosure_threshold_cents`.
        default: false
      - name: total_deferred_revenue_cents
        type: integer
        source: computed
        description: "DERIVED ON READ, never persisted. Equals sum over this program's PointLots with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} of PointLot.remaining_deferred_cents. Reading it never bumps `version`."
      - name: recognized_breakage_ytd_cents
        type: integer
        source: computed
        description: "DERIVED ON READ, never persisted. Equals sum of AccountingPeriod.breakage_recognized_cents over this program's periods with state IN {SOFT_CLOSED, HARD_CLOSED}. Reading it never bumps `version`."

  # ---------------------------------------------------------------------------
  - name: StateExpiryRule
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code the rule governs. Unique per (program_id, state_code).
        constraints: exactly 2 uppercase letters
      - name: expiry_permitted
        type: boolean
        source: input
        description: When false, no PointLot held by a member in this state may ever transition to EXPIRED, regardless of `expires_at`.
      - name: min_dormancy_days
        type: integer
        source: input
        description: A PointLot is only expirable when the holding Member's dormancy_days is >= this value (inclusive).
        constraints: ">= 0 and <= 3650"
      - name: escheatment_required
        type: boolean
        source: input
        description: When true, a PointLot that reaches EXPIRED immediately continues to ESCHEATED and accrues escheat liability.
      - name: escheat_rate_bp
        type: integer
        source: input
        description: Fraction of the lot's `expired_gross_ssp_cents` that is escheatable to the state.
        default: 10000
        constraints: ">= 0 and <= 10000"

  # ---------------------------------------------------------------------------
  - name: Cohort
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: cohort_code
        type: string
        source: input
        description: Enrollment-vintage label. Unique per (program_id, cohort_code).
        constraints: non-empty, max 32 chars
      - name: enrollment_start_date
        type: datetime
        source: input
        description: Inclusive start of the enrollment window. Windows are CLOSED intervals per §1.4 priority 75.
      - name: enrollment_end_date
        type: datetime
        source: input
        description: Inclusive end of the enrollment window. Must be strictly after `enrollment_start_date`.
      - name: observed_redemption_rate_bp
        type: integer
        source: input
        description: Historically observed redemption rate for this vintage, before program-change effects.
        constraints: ">= 0 and <= 10000"
      - name: sample_size
        type: integer
        source: input
        description: Number of members underlying the observed rate. Recorded for the actuarial memorandum; not used in any formula.
        constraints: ">= 1"
      - name: program_change_adjustment_bp
        type: integer
        source: input
        description: Signed behavioural adjustment added to `observed_redemption_rate_bp` before clamping. Mutated by the ProgramChangeOrder apply cascade.
        default: 0
        constraints: ">= -5000 and <= 5000"

  # ---------------------------------------------------------------------------
  - name: Member
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: cohort_id
        type: string
        source: input
        description: FK -> Cohort.id; the enrollment vintage this member is weighted into.
      - name: external_member_ref
        type: string
        source: input
        description: Client-side member reference. Unique per (program_id, external_member_ref).
        constraints: non-empty, max 64 chars
      - name: state_code
        type: string
        source: input
        description: Two-letter US state of residence; selects the governing StateExpiryRule.
        constraints: exactly 2 uppercase letters
      - name: tier
        type: enum
        source: input
        description: Benefit tier; selects the earn multiplier from LoyaltyProgram.tier_multiplier_bp.
        default: BASE
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: status
        type: enum
        source: system
        description: See §1.2 Member machine. ACTIVE <-> DORMANT only.
        default: ACTIVE
        constraints: "one of {ACTIVE, DORMANT}"
      - name: enrolled_at
        type: datetime
        source: system
        description: Logical-clock reading at creation.
      - name: last_activity_at
        type: datetime
        source: system
        description: Logical-clock reading of the most recent PointLot issuance or RedemptionEvent creation for this member; initialised to `enrolled_at`.
      - name: dormancy_days
        type: integer
        source: computed
        description: "DERIVED ON READ. `floor((clock_now - last_activity_at) / 86400 seconds)`, floored at 0."
      - name: point_balance
        type: integer
        source: computed
        description: "DERIVED ON READ. Sum of PointLot.points_remaining over this member's lots with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED}."
      - name: outstanding_gross_ssp_cents
        type: integer
        source: computed
        description: "DERIVED ON READ. Sum of PointLot.remaining_gross_ssp_cents over this member's lots with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} (per-lot rounding, then sum)."

  # ---------------------------------------------------------------------------
  - name: AccountingPeriod
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: period_code
        type: string
        source: input
        description: Reporting label such as "2026-08". Unique per (program_id, period_code).
        constraints: non-empty, max 16 chars
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the period. Period windows are HALF-OPEN [start_at, end_at) per §1.4 priority 75.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the period. Must be strictly after `start_at`.
      - name: state
        type: enum
        source: system
        description: See §1.2 AccountingPeriod machine.
        default: OPEN
        constraints: "one of {OPEN, SOFT_CLOSED, HARD_CLOSED}"
      - name: opening_liability_cents
        type: integer
        source: computed
        description: "PERSISTED at soft-close. `closing_liability_cents` of this program's latest period with state IN {SOFT_CLOSED, HARD_CLOSED} and `end_at <= this.start_at`, ordered by end_at DESC then created_at DESC; 0 when no such period exists."
        default: 0
      - name: issuance_deferred_cents
        type: integer
        source: computed
        description: PERSISTED running total. Incremented by PointLot.deferred_revenue_cents on every issuance booked to this period.
        default: 0
      - name: redemption_recognized_cents
        type: integer
        source: computed
        description: PERSISTED running total of PROVISIONAL revenue released at redemption allocation. Incremented by RedemptionEvent.provisional_release_cents on ALLOCATE, decremented by the same amount on REVERSE.
        default: 0
      - name: remeasurement_delta_cents
        type: integer
        source: computed
        description: PERSISTED running total of `final_release_cents - provisional_release_cents` booked on FULFILL, reversed on REVERSE.
        default: 0
      - name: expiry_released_cents
        type: integer
        source: computed
        description: PERSISTED running total of PointLot.remaining_deferred_cents released by the expiry sweep booked to this period.
        default: 0
      - name: escheat_accrual_cents
        type: integer
        source: computed
        description: PERSISTED running total of PointLot.escheated_cents accrued by the escheatment cascade booked to this period.
        default: 0
      - name: pre_catchup_liability_cents
        type: integer
        source: computed
        description: "PERSISTED at soft-close. Step 4 of `period_close_rollforward`: opening + issuance - redemption_recognized - remeasurement_delta - expiry_released. Reset to 0 on reopen."
        default: 0
      - name: required_liability_cents
        type: integer
        source: computed
        description: "PERSISTED at soft-close. Step 5 of `period_close_rollforward`. Reset to 0 on reopen."
        default: 0
      - name: catch_up_adjustment_cents
        type: integer
        source: computed
        description: "PERSISTED at soft-close. Step 6: `required_liability_cents - pre_catchup_liability_cents`; may be negative. Reset to 0 on reopen."
        default: 0
      - name: breakage_recognized_cents
        type: integer
        source: computed
        description: "PERSISTED at soft-close. Step 8: `expiry_released_cents - catch_up_adjustment_cents`; may be negative. Reset to 0 on reopen."
        default: 0
      - name: closing_liability_cents
        type: integer
        source: computed
        description: "PERSISTED at soft-close. Step 7: `pre_catchup_liability_cents + catch_up_adjustment_cents`. Reset to 0 on reopen."
        default: 0
      - name: approved_estimate_rate_bp
        type: integer
        source: computed
        description: PERSISTED at soft-close. `estimated_redemption_rate_bp` of the APPROVED BreakageEstimate used for this close. Reset to 0 on reopen.
        default: 0
      - name: soft_closed_at
        type: datetime
        source: system
        description: Logical-clock reading at soft-close; reset to null on reopen.
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: Number of completed reopens. Monotonic; NOT reset by anything. Third reopen attempt is rejected.
        default: 0

  # ---------------------------------------------------------------------------
  - name: PartnerAgreement
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: partner_code
        type: string
        source: input
        description: Stable partner identifier. Multiple agreements may share it over disjoint, buffered effective windows.
        constraints: non-empty, max 32 chars
      - name: relationship_type
        type: enum
        source: input
        description: INTERCOMPANY settles through the intercompany ledger; THIRD_PARTY settles through external billing.
        constraints: "one of {INTERCOMPANY, THIRD_PARTY}"
      - name: issuance_rate_millicents_per_point
        type: integer
        source: input
        description: Thousandths of a cent the partner owes the program for each point the partner causes to be issued.
        constraints: ">= 0 and <= 100000"
      - name: redemption_rate_millicents_per_point
        type: integer
        source: input
        description: Thousandths of a cent the program owes the partner for each point redeemed at the partner.
        constraints: ">= 0 and <= 100000"
      - name: settlement_lag_days
        type: integer
        source: input
        description: Whole days added to AccountingPeriod.end_at to obtain SettlementStatement.due_date; also the mandatory buffer between two agreements sharing a `partner_code`.
        default: 30
        constraints: ">= 0 and <= 365"
      - name: net_settlement_enabled
        type: boolean
        source: input
        description: Selects the NET variant of `partner_settlement_net`; false selects GROSS.
        default: false
      - name: min_invoice_cents
        type: integer
        source: input
        description: Minimum billable amount. Amounts below it are carried forward instead of billed.
        default: 5000
        constraints: ">= 0"
      - name: effective_start_date
        type: datetime
        source: input
        description: Inclusive start of the agreement's effective window.
      - name: effective_end_date
        type: datetime
        source: input
        description: Inclusive end of the agreement's effective window. Must be strictly after `effective_start_date`.
      - name: status
        type: enum
        source: system
        description: See §1.2 PartnerAgreement machine.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"
      - name: deferred_below_minimum_cents
        type: integer
        source: computed
        description: PERSISTED signed carry-forward of amounts that fell below `min_invoice_cents` on the most recently created SettlementStatement. Positive = partner still owes; negative = program still owes.
        default: 0
      - name: outstanding_settlement_cents
        type: integer
        source: computed
        description: "PERSISTED. Incremented by SettlementStatement.net_due_cents when a statement is ISSUED; decremented by the same amount when that statement reaches PAID or WRITTEN_OFF."
        default: 0

  # ---------------------------------------------------------------------------
  - name: PointLot
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the holder of the points.
      - name: period_id
        type: string
        source: input
        description: FK -> AccountingPeriod.id; the period the issuance is booked to.
      - name: partner_agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; null for program-issued lots, set for partner-issued lots."
        default: null
      - name: base_points
        type: integer
        source: input
        description: Points before any multiplier.
        constraints: ">= 1"
      - name: promo_multiplier_bp
        type: integer
        source: input
        description: Promotional multiplier applied AFTER the tier multiplier. Rejected when above LoyaltyProgram.promo_multiplier_cap_bp.
        default: 10000
        constraints: ">= 10000"
      - name: tier_multiplier_bp_at_issue
        type: integer
        source: system
        description: Snapshot of LoyaltyProgram.tier_multiplier_bp[Member.tier] at issuance.
      - name: ssp_millicents_per_point_at_issue
        type: integer
        source: system
        description: Snapshot of LoyaltyProgram.ssp_millicents_per_point at issuance. Immutable thereafter, even after an SSP_CHANGE program change order.
      - name: breakage_rate_bp_at_issue
        type: integer
        source: system
        description: Snapshot of LoyaltyProgram.current_breakage_rate_bp at issuance. Drives the PROVISIONAL redemption variant and `remaining_deferred_cents`.
      - name: tier_points
        type: integer
        source: computed
        description: "Step 1 of `point_issuance_measurement`: round_half_up(base_points * tier_multiplier_bp_at_issue / 10000)."
      - name: points_issued
        type: integer
        source: computed
        description: "Step 2 of `point_issuance_measurement`: round_half_up(tier_points * promo_multiplier_bp / 10000). Never recomputed from base_points in one shot."
      - name: points_remaining
        type: integer
        source: computed
        description: PERSISTED. Starts at `points_issued`; decreased by allocations, increased by reversals, forced to 0 on expiry.
      - name: gross_ssp_cents
        type: integer
        source: computed
        description: "round_half_up(points_issued * ssp_millicents_per_point_at_issue / 1000)."
      - name: breakage_reserve_cents
        type: integer
        source: computed
        description: "round_half_up(gross_ssp_cents * breakage_rate_bp_at_issue / 10000)."
      - name: deferred_revenue_cents
        type: integer
        source: computed
        description: "`gross_ssp_cents - breakage_reserve_cents`. This is what is booked to AccountingPeriod.issuance_deferred_cents."
      - name: tier_benefit_expense_cents
        type: integer
        source: computed
        description: "round_half_up((tier_points - base_points) * ssp_millicents_per_point_at_issue / 1000)."
      - name: promo_expense_cents
        type: integer
        source: computed
        description: "round_half_up((points_issued - tier_points) * ssp_millicents_per_point_at_issue / 1000)."
      - name: remaining_gross_ssp_cents
        type: integer
        source: computed
        description: "DERIVED ON READ. round_half_up(points_remaining * ssp_millicents_per_point_at_issue / 1000)."
      - name: remaining_deferred_cents
        type: integer
        source: computed
        description: "DERIVED ON READ. remaining_gross_ssp_cents - round_half_up(remaining_gross_ssp_cents * breakage_rate_bp_at_issue / 10000)."
      - name: expired_gross_ssp_cents
        type: integer
        source: computed
        description: PERSISTED snapshot of `remaining_gross_ssp_cents` captured at the instant the lot transitions to EXPIRED, before `points_remaining` is zeroed.
        default: 0
      - name: escheated_cents
        type: integer
        source: computed
        description: "PERSISTED. round_half_up(expired_gross_ssp_cents * StateExpiryRule.escheat_rate_bp / 10000), written when the lot reaches ESCHEATED."
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock reading at issuance.
      - name: expires_at
        type: datetime
        source: computed
        description: "PERSISTED. `issued_at + LoyaltyProgram.point_expiry_days days` at issuance; recomputed by the EXPIRY_DAYS_CHANGE program-change cascade."
      - name: lifecycle_state
        type: enum
        source: system
        description: Redemption/expiry dimension. See §1.2 PointLot machine (dimension 1).
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, PARTIALLY_REDEEMED, FULLY_REDEEMED, EXPIRED, ESCHEATED}"
      - name: settlement_state
        type: enum
        source: system
        description: "Partner-billing dimension, evolves independently of `lifecycle_state`. NOT_APPLICABLE when partner_agreement_id is null, otherwise PENDING_SETTLEMENT at issuance. See §1.2 PointLot machine (dimension 2)."
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, PENDING_SETTLEMENT, SETTLED, WRITTEN_OFF}"

  # ---------------------------------------------------------------------------
  - name: RedemptionEvent
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the redeeming member.
      - name: period_id
        type: string
        source: input
        description: FK -> AccountingPeriod.id; the period the redemption is booked to.
      - name: partner_agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; null for own-catalog redemptions, set when the points are redeemed at a partner."
        default: null
      - name: points_requested
        type: integer
        source: input
        description: Points the member wants to burn.
        constraints: ">= 1"
      - name: redemption_type
        type: enum
        source: input
        description: Redemption channel. PARTNER requires a non-null `partner_agreement_id`.
        constraints: "one of {CATALOG, PARTNER, CASH_BACK}"
      - name: state
        type: enum
        source: system
        description: See §1.2 RedemptionEvent machine.
        default: REQUESTED
        constraints: "one of {REQUESTED, ALLOCATED, FULFILLED, REVERSED}"
      - name: provisional_release_cents
        type: integer
        source: computed
        description: "PERSISTED at ALLOCATE. Sum over the event's ALLOCATION rows of the per-row provisional release (round per row, then sum) — see `redemption_revenue_release` variant `provisional_at_allocation`."
        default: 0
      - name: final_release_cents
        type: integer
        source: computed
        description: "PERSISTED at FULFILL. Same rows re-measured at the period's approved rate — see variant `final_at_fulfillment`."
        default: 0
      - name: remeasurement_delta_cents
        type: integer
        source: computed
        description: "PERSISTED at FULFILL. `final_release_cents - provisional_release_cents`."
        default: 0
      - name: partner_cost_cents
        type: integer
        source: computed
        description: "PERSISTED at ALLOCATE. round_half_up(points_requested * PartnerAgreement.redemption_rate_millicents_per_point / 1000) when `partner_agreement_id` is non-null, else 0."
        default: 0
      - name: requested_at
        type: datetime
        source: system
        description: Logical-clock reading at creation.
      - name: allocated_at
        type: datetime
        source: system
        description: Logical-clock reading when the event reached ALLOCATED; null before that.
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: Free-text reason captured from the reverse request; null until reversed.
        default: null

  # ---------------------------------------------------------------------------
  - name: RedemptionAllocation
    parent: RedemptionEvent
    common_fields: false
    fields:
      - name: redemption_event_id
        type: string
        source: system
        description: FK -> RedemptionEvent.id; the event this row belongs to.
      - name: point_lot_id
        type: string
        source: system
        description: FK -> PointLot.id; the lot this row draws from.
      - name: entry_type
        type: enum
        source: system
        description: ALLOCATION rows are written by the allocate transition; REVERSAL rows are the append-only compensating entries written by the reverse transition.
        constraints: "one of {ALLOCATION, REVERSAL}"
      - name: allocation_seq
        type: integer
        source: system
        description: 1-based sequence within the event, assigned in the order rows are written (FIFO lot order for ALLOCATION rows, then the same order again for REVERSAL rows).
      - name: points_allocated
        type: integer
        source: system
        description: Points drawn from the lot. Positive on ALLOCATION rows, the exact negation on the matching REVERSAL row.
      - name: provisional_release_cents
        type: integer
        source: system
        description: Per-row provisional revenue release, negated on REVERSAL rows.
      - name: final_release_cents
        type: integer
        source: system
        description: Per-row release re-measured at fulfillment; null until the event is FULFILLED, negated on REVERSAL rows.
        default: null
      - name: line_gross_ssp_cents
        type: integer
        source: system
        description: "round_half_up(points_allocated * PointLot.ssp_millicents_per_point_at_issue / 1000) for this row; negated on REVERSAL rows."

  # ---------------------------------------------------------------------------
  - name: BreakageEstimate
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: period_id
        type: string
        source: input
        description: FK -> AccountingPeriod.id; the period this estimate supports.
      - name: cohort_id
        type: string
        source: input
        description: "FK -> Cohort.id; when non-null the estimate is measured on that single cohort (SINGLE_COHORT variant)."
        default: null
      - name: supersedes_estimate_id
        type: string
        source: system
        description: "FK -> BreakageEstimate.id; set at approval to the previously APPROVED estimate of the same program, else null."
        default: null
      - name: method_applied
        type: enum
        source: computed
        description: Variant of `estimated_redemption_rate` that actually ran.
        constraints: "one of {COHORT_WEIGHTED, SINGLE_COHORT, PROGRAM_HISTORICAL}"
      - name: estimated_redemption_rate_bp
        type: integer
        source: computed
        description: Output of `estimated_redemption_rate`, measured at creation time and frozen thereafter.
      - name: breakage_rate_bp
        type: integer
        source: computed
        description: "`10000 - estimated_redemption_rate_bp`."
      - name: outstanding_points_at_estimate
        type: integer
        source: computed
        description: "Denominator of the cohort weighting: total points_remaining over the program's lots with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} at creation time."
      - name: outstanding_gross_ssp_cents_at_estimate
        type: integer
        source: computed
        description: Sum of PointLot.remaining_gross_ssp_cents over the same lot set at creation time (per-lot rounding, then sum).
      - name: required_liability_cents
        type: integer
        source: computed
        description: "round_half_up(outstanding_gross_ssp_cents_at_estimate * estimated_redemption_rate_bp / 10000) — the liability the estimate itself measured, distinct from the period's re-measured `required_liability_cents` at soft-close."
      - name: memo_narrative
        type: string
        source: input
        description: "Actuarial memorandum text. The field MUST be present in the create request but the EMPTY STRING is accepted; it MUST be non-empty before the supported period can be hard-closed (validations[priority=71])."
        constraints: "max 2000 chars; the empty string is permitted at creation"
      - name: sensitivity_low_bp
        type: integer
        source: input
        description: "ABSOLUTE downside redemption-rate scenario in basis points (not a delta) fed to `breakage_sensitivity_bands`. Required at creation; validations[priority=87] requires it to be <= the measured `estimated_redemption_rate_bp`."
        constraints: ">= 200 and <= 9800"
      - name: sensitivity_high_bp
        type: integer
        source: input
        description: "ABSOLUTE upside redemption-rate scenario in basis points (not a delta) fed to `breakage_sensitivity_bands`. Required at creation; validations[priority=87] requires it to be >= the measured `estimated_redemption_rate_bp`."
        constraints: ">= 200 and <= 9800"
      - name: state
        type: enum
        source: system
        description: See §1.2 BreakageEstimate machine (bounded revision cycle).
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID captured at creation. Segregation of duties compares this against the approver.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID captured at approval; null before that.
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: Reason captured from the reject request; null until rejected.
        default: null
      - name: revision_count
        type: integer
        source: system
        description: Number of resubmissions after a rejection. Third resubmission attempt is rejected.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock reading of the most recent submit; null before the first submit.
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock reading at approval; null before that.
        default: null

  # ---------------------------------------------------------------------------
  - name: SettlementStatement
    parent: PartnerAgreement
    common_fields: true
    fields:
      - name: partner_agreement_id
        type: string
        source: input
        description: FK -> PartnerAgreement.id; the agreement being settled.
      - name: period_id
        type: string
        source: input
        description: FK -> AccountingPeriod.id; the period whose partner activity is settled.
      - name: state
        type: enum
        source: system
        description: See §1.2 SettlementStatement machine (bounded dispute cycle).
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, DISPUTED, PAID, WRITTEN_OFF, SUPERSEDED}"
      - name: settlement_basis
        type: enum
        source: computed
        description: NET when PartnerAgreement.net_settlement_enabled is true at creation, else GROSS. Selects the `partner_settlement_net` variant.
        constraints: "one of {GROSS, NET}"
      - name: partner_issued_points
        type: integer
        source: computed
        description: "Sum of PointLot.points_issued over lots with this `partner_agreement_id` and this `period_id`."
      - name: partner_redeemed_points
        type: integer
        source: computed
        description: "Sum of `points_requested` over RedemptionEvents with this `partner_agreement_id`, this `period_id` and state IN {ALLOCATED, FULFILLED}; REQUESTED and REVERSED events contribute nothing."
      - name: issuance_receivable_cents
        type: integer
        source: computed
        description: "round_half_up(partner_issued_points * PartnerAgreement.issuance_rate_millicents_per_point / 1000)."
      - name: redemption_payable_cents
        type: integer
        source: computed
        description: "round_half_up(partner_redeemed_points * PartnerAgreement.redemption_rate_millicents_per_point / 1000)."
      - name: carried_forward_cents
        type: integer
        source: computed
        description: Snapshot of PartnerAgreement.deferred_below_minimum_cents read at creation, before this statement overwrites it.
      - name: net_due_cents
        type: integer
        source: computed
        description: Billable amount. Positive = partner owes the program; negative = program owes the partner. Variant-dependent — see `partner_settlement_net`.
      - name: deferred_below_minimum_cents
        type: integer
        source: computed
        description: Signed remainder that fell below `min_invoice_cents` and is carried onto the agreement for the next statement.
      - name: due_date
        type: datetime
        source: computed
        description: "AccountingPeriod.end_at + PartnerAgreement.settlement_lag_days days."
      - name: dispute_reason
        type: string
        source: system
        description: Reason captured from the most recent dispute; null before the first dispute.
        default: null
      - name: resolution_note
        type: string
        source: system
        description: Note captured from the most recent dispute resolution; null before that.
        default: null
      - name: write_off_reason
        type: string
        source: system
        description: Reason captured at write-off; null before that.
        default: null
      - name: dispute_count
        type: integer
        source: system
        description: Number of completed disputes. Third dispute attempt is rejected.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock reading of the most recent ISSUED entry; null before the first issue.
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock reading at payment; null before that.
        default: null

  # ---------------------------------------------------------------------------
  - name: ProgramChangeOrder
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id; taken from the path on creation.
      - name: change_type
        type: enum
        source: input
        description: Which program parameter the order changes. Determines which `new_*` field is required.
        constraints: "one of {EXPIRY_DAYS_CHANGE, SSP_CHANGE, TIER_MULTIPLIER_CHANGE}"
      - name: new_point_expiry_days
        type: integer
        source: input
        description: Required when `change_type` is EXPIRY_DAYS_CHANGE, otherwise MUST be omitted.
        default: null
        constraints: ">= 1 and <= 3650"
      - name: new_ssp_millicents_per_point
        type: integer
        source: input
        description: Required when `change_type` is SSP_CHANGE, otherwise MUST be omitted.
        default: null
        constraints: ">= 1 and <= 100000"
      - name: new_tier_multiplier_bp
        type: object
        source: input
        description: Required when `change_type` is TIER_MULTIPLIER_CHANGE, otherwise MUST be omitted. Same four-key shape as LoyaltyProgram.tier_multiplier_bp.
        default: null
      - name: behavior_elasticity_bp
        type: integer
        source: input
        description: Signed expected shift in member redemption behaviour caused by the change. Added to every affected Cohort.program_change_adjustment_bp when the order is applied.
        constraints: ">= -5000 and <= 5000"
      - name: effective_at
        type: datetime
        source: input
        description: Earliest logical-clock reading at which the order may be applied. Must be >= the clock at creation.
      - name: state
        type: enum
        source: system
        description: See §1.2 ProgramChangeOrder machine.
        default: MODELED
        constraints: "one of {MODELED, APPROVED, EFFECTIVE, CANCELLED}"
      - name: baseline_redemption_rate_bp
        type: integer
        source: computed
        description: "`10000 - LoyaltyProgram.current_breakage_rate_bp` snapshotted at creation."
      - name: projected_redemption_rate_bp
        type: integer
        source: computed
        description: "min(9800, max(200, baseline_redemption_rate_bp + behavior_elasticity_bp))."
      - name: baseline_outstanding_gross_ssp_cents
        type: integer
        source: computed
        description: Sum of PointLot.remaining_gross_ssp_cents over the program's lots with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} at creation, using each lot's own at-issue SSP.
      - name: projected_outstanding_gross_ssp_cents
        type: integer
        source: computed
        description: Same lot set re-priced at `new_ssp_millicents_per_point` when `change_type` is SSP_CHANGE; identical to the baseline otherwise.
      - name: projected_liability_delta_cents
        type: integer
        source: computed
        description: Output of `program_change_liability_projection`; may be negative.
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock reading when the order became EFFECTIVE; null before that.
        default: null
      - name: cancelled_by_order_id
        type: string
        source: system
        description: "FK -> ProgramChangeOrder.id; set when this MODELED order was cancelled by the approval of a competing order of the same `change_type`."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: LoyaltyProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == DRAFT"
          - "at least one StateExpiryRule exists for the program"
          - "at least one Cohort exists for the program"
        side_effects:
          - "sets LoyaltyProgram.current_breakage_rate_bp = 10000 - LoyaltyProgram.historical_redemption_rate_bp"
          - "increments LoyaltyProgram.version by 1"
        note: "Point issuance, redemption, estimates and settlement all require status == ACTIVE."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "increments LoyaltyProgram.version by 1"
        note: "Suspension blocks issuance and redemption but leaves period close and settlement available."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == SUSPENDED"
        side_effects:
          - "LoyaltyProgram.current_breakage_rate_bp is left unchanged on reactivation"
          - "increments LoyaltyProgram.version by 1"
        note: "Reactivation is a cycle back into ACTIVE; unlike first activation it does NOT reseed the breakage rate."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "program.status == ACTIVE"
          - "every AccountingPeriod of the program has state == HARD_CLOSED"
        side_effects:
          - "increments LoyaltyProgram.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "program.status == SUSPENDED"
          - "every AccountingPeriod of the program has state == HARD_CLOSED"
        side_effects:
          - "increments LoyaltyProgram.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DORMANT
        trigger: "system event: POST /accounting-periods/{id}/expiry-sweep observes the member after its lots were expired"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "member.point_balance == 0 after the sweep's expiry pass"
          - "member.dormancy_days >= 730"
        side_effects:
          - "increments Member.version by 1"
        note: "Fan-out of the sweep's expiry pass, evaluated once per member touched, in Member.created_at ASC order."
      - from: DORMANT
        to: ACTIVE
        trigger: "POST /point-lots"
        actor: LoyaltyAccountant
        preconditions:
          - "member.status == DORMANT"
        side_effects:
          - "sets Member.last_activity_at = clock_now"
          - "increments Member.version by 1"
        note: "Reactivation cycle: any new issuance revives a dormant member."

  # ---------------------------------------------------------------------------
  # PointLot carries TWO INDEPENDENT STATE DIMENSIONS on one row.
  # Dimension 1 `lifecycle_state` tracks redemption and expiry.
  # Dimension 2 `settlement_state` tracks partner billing.
  # Neither dimension's transitions are preconditions of the other: a lot may
  # be FULLY_REDEEMED while still PENDING_SETTLEMENT, and it may be SETTLED
  # while still OUTSTANDING.
  # ---------------------------------------------------------------------------
  - entity: PointLot
    initial_state: OUTSTANDING
    terminal_states: [ESCHEATED, WRITTEN_OFF]
    transitions:
      # --- dimension 1: lifecycle_state ---
      - from: OUTSTANDING
        to: PARTIALLY_REDEEMED
        trigger: "POST /redemption-events/{id}/allocate"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == OUTSTANDING"
          - "0 < points_allocated_to_this_lot < lot.points_remaining"
        side_effects:
          - "decrements PointLot.points_remaining by points_allocated_to_this_lot"
          - "appends one RedemptionAllocation row with entry_type ALLOCATION"
          - "increments PointLot.version by 1"
      - from: OUTSTANDING
        to: FULLY_REDEEMED
        trigger: "POST /redemption-events/{id}/allocate"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == OUTSTANDING"
          - "points_allocated_to_this_lot == lot.points_remaining"
        side_effects:
          - "sets PointLot.points_remaining = 0"
          - "appends one RedemptionAllocation row with entry_type ALLOCATION"
          - "increments PointLot.version by 1"
      - from: PARTIALLY_REDEEMED
        to: FULLY_REDEEMED
        trigger: "POST /redemption-events/{id}/allocate"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == PARTIALLY_REDEEMED"
          - "points_allocated_to_this_lot == lot.points_remaining"
        side_effects:
          - "sets PointLot.points_remaining = 0"
          - "appends one RedemptionAllocation row with entry_type ALLOCATION"
          - "increments PointLot.version by 1"
      - from: FULLY_REDEEMED
        to: PARTIALLY_REDEEMED
        trigger: "POST /redemption-events/{id}/reverse"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == FULLY_REDEEMED"
          - "the reversal restores strictly fewer points than lot.points_issued"
        side_effects:
          - "increments PointLot.points_remaining by the reversed points"
          - "appends one RedemptionAllocation row with entry_type REVERSAL and negated amounts"
          - "increments PointLot.version by 1"
        note: "Compensating transition; `points_issued` is never touched, so the invariant sum(RedemptionAllocation.points_allocated for the lot) == points_issued - points_remaining holds at every instant."
      - from: FULLY_REDEEMED
        to: OUTSTANDING
        trigger: "POST /redemption-events/{id}/reverse"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == FULLY_REDEEMED"
          - "the reversal restores exactly lot.points_issued points"
        side_effects:
          - "sets PointLot.points_remaining = PointLot.points_issued"
          - "appends one RedemptionAllocation row with entry_type REVERSAL and negated amounts"
          - "increments PointLot.version by 1"
      - from: PARTIALLY_REDEEMED
        to: OUTSTANDING
        trigger: "POST /redemption-events/{id}/reverse"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == PARTIALLY_REDEEMED"
          - "after the reversal PointLot.points_remaining == PointLot.points_issued"
        side_effects:
          - "sets PointLot.points_remaining = PointLot.points_issued"
          - "appends one RedemptionAllocation row with entry_type REVERSAL and negated amounts"
          - "increments PointLot.version by 1"
      - from: OUTSTANDING
        to: EXPIRED
        trigger: "POST /accounting-periods/{id}/expiry-sweep"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == OUTSTANDING"
          - "lot.expires_at <= clock_now"
          - "the StateExpiryRule for (lot.member.program_id, lot.member.state_code) exists AND has expiry_permitted == true"
          - "lot.member.dormancy_days >= that rule's min_dormancy_days"
        side_effects:
          - "CASCADE LINK 1: sets PointLot.expired_gross_ssp_cents = PointLot.remaining_gross_ssp_cents, then sets PointLot.points_remaining = 0"
          - "adds the pre-zeroing PointLot.remaining_deferred_cents to AccountingPeriod.expiry_released_cents of the SWEPT period"
          - "increments PointLot.version by 1"
        note: "When the rule is missing the lot is silently skipped — a missing rule is treated as expiry_permitted == false, never as an error."
      - from: PARTIALLY_REDEEMED
        to: EXPIRED
        trigger: "POST /accounting-periods/{id}/expiry-sweep"
        actor: LoyaltyAccountant
        preconditions:
          - "lot.lifecycle_state == PARTIALLY_REDEEMED"
          - "lot.expires_at <= clock_now"
          - "the StateExpiryRule for (lot.member.program_id, lot.member.state_code) exists AND has expiry_permitted == true"
          - "lot.member.dormancy_days >= that rule's min_dormancy_days"
        side_effects:
          - "CASCADE LINK 1: sets PointLot.expired_gross_ssp_cents = PointLot.remaining_gross_ssp_cents, then sets PointLot.points_remaining = 0"
          - "adds the pre-zeroing PointLot.remaining_deferred_cents to AccountingPeriod.expiry_released_cents of the SWEPT period"
          - "increments PointLot.version by 1"
      - from: EXPIRED
        to: ESCHEATED
        trigger: "system event: the OUTSTANDING/PARTIALLY_REDEEMED -> EXPIRED transition completing on a lot whose governing StateExpiryRule has escheatment_required == true"
        actor: system
        preconditions:
          - "lot.lifecycle_state == EXPIRED"
          - "the governing StateExpiryRule has escheatment_required == true"
        side_effects:
          - "CASCADE LINK 2: sets PointLot.escheated_cents = round_half_up(PointLot.expired_gross_ssp_cents * StateExpiryRule.escheat_rate_bp / 10000)"
          - "adds PointLot.escheated_cents to AccountingPeriod.escheat_accrual_cents of the SWEPT period"
          - "adds PointLot.escheated_cents to LoyaltyProgram.total_escheat_accrual_cents"
          - "CASCADE LINK 3: when LoyaltyProgram.total_escheat_accrual_cents >= LoyaltyProgram.escheat_disclosure_threshold_cents, latches LoyaltyProgram.escheat_disclosure_required = true"
          - "increments PointLot.version by 1"
        note: "Caused by LINK 1's completion, not by the sweep request itself. LINK 3 is caused by LINK 2's accrual, not by the expiry."
      # --- dimension 2: settlement_state ---
      - from: NOT_APPLICABLE
        to: PENDING_SETTLEMENT
        trigger: "POST /point-lots with a non-null partner_agreement_id"
        actor: LoyaltyAccountant
        preconditions:
          - "the request carries a non-null partner_agreement_id"
        side_effects:
          - "increments PartnerAgreement.version by 1"
        note: "Dimension-2 initial assignment; happens at creation so the row is born PENDING_SETTLEMENT while dimension 1 is born OUTSTANDING."
      - from: PENDING_SETTLEMENT
        to: SETTLED
        trigger: "POST /settlement-statements/{id}/pay"
        actor: Controller
        preconditions:
          - "lot.settlement_state == PENDING_SETTLEMENT"
          - "lot.partner_agreement_id == statement.partner_agreement_id AND lot.period_id == statement.period_id"
        side_effects:
          - "increments PointLot.version by 1"
        note: "Independent of dimension 1 — an OUTSTANDING lot can become SETTLED, and a FULLY_REDEEMED lot can stay PENDING_SETTLEMENT."
      - from: PENDING_SETTLEMENT
        to: WRITTEN_OFF
        trigger: "POST /settlement-statements/{id}/write-off"
        actor: Controller
        preconditions:
          - "lot.settlement_state == PENDING_SETTLEMENT"
          - "lot.partner_agreement_id == statement.partner_agreement_id AND lot.period_id == statement.period_id"
        side_effects:
          - "increments PointLot.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RedemptionEvent
    initial_state: REQUESTED
    terminal_states: [REVERSED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /redemption-events/{id}/allocate"
        actor: LoyaltyAccountant
        preconditions:
          - "event.state == REQUESTED"
          - "event.member.program.status == ACTIVE"
          - "the event's AccountingPeriod.state == OPEN"
          - "sum of points_remaining over the member's lots with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} >= event.points_requested"
        side_effects:
          - "runs `redemption_revenue_release` variant `provisional_at_allocation` over the FIFO lot sequence"
          - "appends one RedemptionAllocation row per consumed lot with entry_type ALLOCATION and allocation_seq 1..N"
          - "drives each consumed PointLot's dimension-1 transition (OUTSTANDING/PARTIALLY_REDEEMED -> PARTIALLY_REDEEMED/FULLY_REDEEMED)"
          - "sets RedemptionEvent.provisional_release_cents and RedemptionEvent.partner_cost_cents"
          - "sets RedemptionEvent.allocated_at = clock_now"
          - "adds RedemptionEvent.provisional_release_cents to AccountingPeriod.redemption_recognized_cents"
          - "increments PartnerAgreement.version by 1 when event.partner_agreement_id is non-null"
          - "increments RedemptionEvent.version by 1"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /redemption-events/{id}/fulfill"
        actor: LoyaltyAccountant
        preconditions:
          - "event.state == ALLOCATED"
          - "the event's AccountingPeriod.state == OPEN"
          - "an APPROVED BreakageEstimate exists for the event's AccountingPeriod"
        side_effects:
          - "runs `redemption_revenue_release` variant `final_at_fulfillment`, writing RedemptionAllocation.final_release_cents on every ALLOCATION row"
          - "sets RedemptionEvent.final_release_cents and RedemptionEvent.remeasurement_delta_cents"
          - "adds RedemptionEvent.remeasurement_delta_cents to AccountingPeriod.remeasurement_delta_cents"
          - "increments RedemptionEvent.version by 1"
      - from: ALLOCATED
        to: REVERSED
        trigger: "POST /redemption-events/{id}/reverse"
        actor: LoyaltyAccountant
        preconditions:
          - "event.state == ALLOCATED"
          - "the event's AccountingPeriod.state == OPEN"
        side_effects:
          - "appends one REVERSAL RedemptionAllocation row per ALLOCATION row, in ascending allocation_seq order, with negated points and negated cents"
          - "restores each consumed PointLot's points_remaining and drives its dimension-1 reverse transition"
          - "subtracts RedemptionEvent.provisional_release_cents from AccountingPeriod.redemption_recognized_cents"
          - "sets RedemptionEvent.reversal_reason"
          - "increments RedemptionEvent.version by 1"
      - from: FULFILLED
        to: REVERSED
        trigger: "POST /redemption-events/{id}/reverse"
        actor: LoyaltyAccountant
        preconditions:
          - "event.state == FULFILLED"
          - "the event's AccountingPeriod.state == OPEN"
        side_effects:
          - "appends one REVERSAL RedemptionAllocation row per ALLOCATION row, in ascending allocation_seq order, with negated points, negated provisional cents and negated final cents"
          - "restores each consumed PointLot's points_remaining and drives its dimension-1 reverse transition"
          - "subtracts RedemptionEvent.provisional_release_cents from AccountingPeriod.redemption_recognized_cents"
          - "subtracts RedemptionEvent.remeasurement_delta_cents from AccountingPeriod.remeasurement_delta_cents"
          - "sets RedemptionEvent.reversal_reason"
          - "increments RedemptionEvent.version by 1"
        note: "Full compensation: both the provisional and the re-measurement legs are unwound, so AccountingPeriod.redemption_recognized_cents and AccountingPeriod.remeasurement_delta_cents return to their pre-allocate values with zero drift."

  # ---------------------------------------------------------------------------
  - entity: BreakageEstimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /breakage-estimates/{id}/submit"
        actor: LoyaltyAccountant
        preconditions:
          - "estimate.state == DRAFT"
          - "estimate.period.state == OPEN"
        side_effects:
          - "sets BreakageEstimate.submitted_at = clock_now"
          - "increments BreakageEstimate.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /breakage-estimates/{id}/reject"
        actor: Controller
        preconditions:
          - "estimate.state == SUBMITTED"
        side_effects:
          - "sets BreakageEstimate.rejection_reason"
          - "increments BreakageEstimate.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /breakage-estimates/{id}/submit"
        actor: LoyaltyAccountant
        preconditions:
          - "estimate.state == REJECTED"
          - "estimate.period.state == OPEN"
          - "estimate.revision_count < 2"
        side_effects:
          - "increments BreakageEstimate.revision_count by 1"
          - "sets BreakageEstimate.submitted_at = clock_now"
          - "increments BreakageEstimate.version by 1"
        note: "Bounded revision cycle. `estimated_redemption_rate_bp` is NEVER re-measured on resubmission — it stays frozen at the value computed at creation."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /breakage-estimates/{id}/approve"
        actor: Controller
        preconditions:
          - "estimate.state == SUBMITTED"
          - "estimate.period.state == OPEN"
          - "the request's expected_program_version equals LoyaltyProgram.version"
          - "X-User-ID != estimate.prepared_by_user_id"
        side_effects:
          - "sets BreakageEstimate.approved_by_user_id = X-User-ID and approved_at = clock_now"
          - "CASCADE LINK 1: sets LoyaltyProgram.current_breakage_rate_bp = this estimate's breakage_rate_bp and increments LoyaltyProgram.version by 1"
          - "CASCADE LINK 2: caused by LINK 1 replacing the reigning rate — the program's other estimate with state == APPROVED (there is at most one) transitions APPROVED -> SUPERSEDED, and this estimate's supersedes_estimate_id is set to that estimate's id"
          - "CASCADE LINK 3: caused by LINK 2 retiring the old estimate — the superseded estimate's own AccountingPeriod, IF and ONLY IF it is in state SOFT_CLOSED, is FORCE-REOPENED SOFT_CLOSED -> OPEN (its close is no longer supported by an approved estimate): opening_liability_cents / pre_catchup_liability_cents / required_liability_cents / catch_up_adjustment_cents / closing_liability_cents / breakage_recognized_cents / approved_estimate_rate_bp are reset to 0, soft_closed_at is set to null and reopen_count is incremented by 1. A HARD_CLOSED or already-OPEN period is left untouched."
          - "increments BreakageEstimate.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: CASCADE LINK 2 of another estimate's SUBMITTED -> APPROVED transition on the same program"
        actor: system
        preconditions:
          - "estimate.state == APPROVED"
        side_effects:
          - "increments BreakageEstimate.version by 1"

  # ---------------------------------------------------------------------------
  - entity: AccountingPeriod
    initial_state: OPEN
    terminal_states: [HARD_CLOSED]
    transitions:
      - from: OPEN
        to: SOFT_CLOSED
        trigger: "POST /accounting-periods/{id}/soft-close"
        actor: Controller
        preconditions:
          - "period.state == OPEN"
          - "clock_now >= period.end_at"
          - "an APPROVED BreakageEstimate exists for this period"
          - "no RedemptionEvent of this period is in state REQUESTED"
        side_effects:
          - "runs `period_close_rollforward` steps 1-8 in the pinned order and persists all eight outputs"
          - "sets AccountingPeriod.approved_estimate_rate_bp = the APPROVED estimate's estimated_redemption_rate_bp"
          - "sets AccountingPeriod.soft_closed_at = clock_now"
          - "increments AccountingPeriod.version by 1"
      - from: SOFT_CLOSED
        to: OPEN
        trigger: "POST /accounting-periods/{id}/reopen"
        actor: Controller
        preconditions:
          - "period.state == SOFT_CLOSED"
          - "period.reopen_count < 2"
        side_effects:
          - "resets AccountingPeriod.opening_liability_cents, pre_catchup_liability_cents, required_liability_cents, catch_up_adjustment_cents, breakage_recognized_cents, closing_liability_cents and approved_estimate_rate_bp to 0"
          - "sets AccountingPeriod.soft_closed_at = null"
          - "increments AccountingPeriod.reopen_count by 1"
          - "increments AccountingPeriod.version by 1"
        note: "Compensating transition for soft-close. Because LoyaltyProgram.recognized_breakage_ytd_cents only sums periods in {SOFT_CLOSED, HARD_CLOSED}, the reopen returns that program-level figure to its exact pre-soft-close value with zero drift. Bounded cycle: at most two reopens."
      - from: SOFT_CLOSED
        to: OPEN
        trigger: "system event: CASCADE LINK 3 of a BreakageEstimate SUBMITTED -> APPROVED transition superseding the estimate that backed THIS period's close"
        actor: system
        preconditions:
          - "period.state == SOFT_CLOSED"
          - "the estimate being superseded by CASCADE LINK 2 has period_id == this period's id"
        side_effects:
          - "resets AccountingPeriod.opening_liability_cents, pre_catchup_liability_cents, required_liability_cents, catch_up_adjustment_cents, breakage_recognized_cents, closing_liability_cents and approved_estimate_rate_bp to 0"
          - "sets AccountingPeriod.soft_closed_at = null"
          - "increments AccountingPeriod.reopen_count by 1"
          - "increments AccountingPeriod.version by 1"
        note: "FORCED reopen. Unlike the Controller-driven reopen above it is NOT gated on `reopen_count < 2` — the accounting rule that a close must rest on a live approved estimate outranks the manual reopen budget — but it still increments `reopen_count`, so it consumes that budget."
      - from: SOFT_CLOSED
        to: HARD_CLOSED
        trigger: "POST /accounting-periods/{id}/hard-close"
        actor: Controller
        preconditions:
          - "period.state == SOFT_CLOSED"
          - "the APPROVED BreakageEstimate for this period has a non-empty memo_narrative"
          - "every SettlementStatement of this period has state IN {PAID, WRITTEN_OFF, SUPERSEDED}"
        side_effects:
          - "increments AccountingPeriod.version by 1"
        note: "Terminal. No mutation of any child of a HARD_CLOSED period is permitted thereafter."

  # ---------------------------------------------------------------------------
  - entity: PartnerAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: POST /settlement-statements/{id}/write-off completing on a statement of this agreement"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "increments PartnerAgreement.version by 1"
        note: "A written-off statement suspends the agreement; no new statement may be created while SUSPENDED."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /partner-agreements/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "agreement.status == ACTIVE"
          - "agreement.outstanding_settlement_cents == 0"
        side_effects:
          - "increments PartnerAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /partner-agreements/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "agreement.status == SUSPENDED"
          - "agreement.outstanding_settlement_cents == 0"
        side_effects:
          - "increments PartnerAgreement.version by 1"

  # ---------------------------------------------------------------------------
  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [PAID, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /settlement-statements creating a newer statement for the same (partner_agreement_id, period_id)"
        actor: system
        preconditions:
          - "statement.state == DRAFT"
        side_effects:
          - "increments SettlementStatement.version by 1"
        note: "This is the legitimate supersede that makes the OCC race in §1.2.1 a real race rather than a state precondition."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /settlement-statements/{id}/issue"
        actor: LoyaltyAccountant
        preconditions:
          - "statement.state == DRAFT"
          - "statement.partner_agreement.status == ACTIVE"
        side_effects:
          - "sets SettlementStatement.issued_at = clock_now"
          - "adds SettlementStatement.net_due_cents to PartnerAgreement.outstanding_settlement_cents"
          - "increments PartnerAgreement.version by 1"
          - "increments SettlementStatement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /settlement-statements/{id}/dispute"
        actor: PartnerOperator
        preconditions:
          - "statement.state == ISSUED"
          - "X-User-ID == statement.partner_agreement_id"
          - "statement.dispute_count < 2"
        side_effects:
          - "sets SettlementStatement.dispute_reason"
          - "increments SettlementStatement.dispute_count by 1"
          - "increments SettlementStatement.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /settlement-statements/{id}/resolve"
        actor: LoyaltyAccountant
        preconditions:
          - "statement.state == DISPUTED"
        side_effects:
          - "sets SettlementStatement.resolution_note"
          - "sets SettlementStatement.issued_at = clock_now"
          - "increments SettlementStatement.version by 1"
        note: "Bounded dispute cycle: ISSUED -> DISPUTED -> ISSUED, at most twice. `net_due_cents` is never re-measured by a resolution."
      - from: ISSUED
        to: PAID
        trigger: "POST /settlement-statements/{id}/pay"
        actor: Controller
        preconditions:
          - "statement.state == ISSUED"
        side_effects:
          - "sets SettlementStatement.paid_at = clock_now"
          - "subtracts SettlementStatement.net_due_cents from PartnerAgreement.outstanding_settlement_cents"
          - "drives every PointLot with this statement's (partner_agreement_id, period_id) and settlement_state PENDING_SETTLEMENT to SETTLED, in PointLot.created_at ASC order"
          - "increments PartnerAgreement.version by 1"
          - "increments SettlementStatement.version by 1"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /settlement-statements/{id}/write-off"
        actor: Controller
        preconditions:
          - "statement.state == ISSUED"
        side_effects:
          - "sets SettlementStatement.write_off_reason"
          - "subtracts SettlementStatement.net_due_cents from PartnerAgreement.outstanding_settlement_cents"
          - "drives every PointLot with this statement's (partner_agreement_id, period_id) and settlement_state PENDING_SETTLEMENT to WRITTEN_OFF, in PointLot.created_at ASC order"
          - "drives PartnerAgreement ACTIVE -> SUSPENDED"
          - "increments PartnerAgreement.version by 1"
          - "increments SettlementStatement.version by 1"
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /settlement-statements/{id}/write-off"
        actor: Controller
        preconditions:
          - "statement.state == DISPUTED"
        side_effects:
          - "sets SettlementStatement.write_off_reason"
          - "subtracts SettlementStatement.net_due_cents from PartnerAgreement.outstanding_settlement_cents"
          - "drives every PointLot with this statement's (partner_agreement_id, period_id) and settlement_state PENDING_SETTLEMENT to WRITTEN_OFF, in PointLot.created_at ASC order"
          - "drives PartnerAgreement ACTIVE -> SUSPENDED"
          - "increments PartnerAgreement.version by 1"
          - "increments SettlementStatement.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ProgramChangeOrder
    initial_state: MODELED
    terminal_states: [EFFECTIVE, CANCELLED]
    transitions:
      - from: MODELED
        to: APPROVED
        trigger: "POST /program-change-orders/{id}/approve"
        actor: Controller
        preconditions:
          - "order.state == MODELED"
          - "order.program.status == ACTIVE"
        side_effects:
          - "every OTHER ProgramChangeOrder of the same program with the same change_type and state == MODELED transitions MODELED -> CANCELLED with cancelled_by_order_id set to this order's id, processed in ProgramChangeOrder.created_at ASC order"
          - "increments ProgramChangeOrder.version by 1"
      - from: MODELED
        to: CANCELLED
        trigger: "system event: approval of a competing ProgramChangeOrder of the same program and change_type"
        actor: system
        preconditions:
          - "order.state == MODELED"
        side_effects:
          - "sets ProgramChangeOrder.cancelled_by_order_id"
          - "increments ProgramChangeOrder.version by 1"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /program-change-orders/{id}/apply"
        actor: Controller
        preconditions:
          - "order.state == APPROVED"
          - "clock_now >= order.effective_at"
        side_effects:
          - "CASCADE LINK 1: writes the order's `new_*` value onto LoyaltyProgram (point_expiry_days / ssp_millicents_per_point / tier_multiplier_bp) and increments LoyaltyProgram.version by 1"
          - "CASCADE LINK 2: caused by LINK 1 changing LoyaltyProgram.point_expiry_days (EXPIRY_DAYS_CHANGE only) — every PointLot of the program with lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} has expires_at recomputed as issued_at + the NEW point_expiry_days days, processed in PointLot.created_at ASC order, each bumping PointLot.version by 1"
          - "CASCADE LINK 3: caused by LINK 2 changing the outstanding lots' expiry horizon — every Cohort of the program has program_change_adjustment_bp increased by order.behavior_elasticity_bp (clamped into [-5000, 5000]), processed in Cohort.enrollment_start_date ASC then created_at ASC order, each bumping Cohort.version by 1"
          - "sets ProgramChangeOrder.applied_at = clock_now"
          - "increments ProgramChangeOrder.version by 1"
        note: "For SSP_CHANGE and TIER_MULTIPLIER_CHANGE, LINK 2 is a no-op on expires_at but LINK 3 still fires; already-issued lots keep their at-issue SSP and tier snapshots forever."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-approve-stale-program
    parent_entity: LoyaltyProgram
    write_endpoint: "POST /breakage-estimates/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a BreakageEstimate whose LoyaltyProgram.version has advanced
      since the Controller last observed the program is rejected. Approval
      legitimately overwrites LoyaltyProgram.current_breakage_rate_bp and
      supersedes the reigning APPROVED estimate, so a second sequential
      approval of a DIFFERENT submitted estimate would itself succeed under
      the product semantics — it is not blocked by any state precondition.
      The stale-version check is what stops a Controller from installing a
      rate derived from a program snapshot that a prior approval, an applied
      program change order or an expiry sweep has already invalidated.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: statement-create-stale-agreement
    parent_entity: PartnerAgreement
    write_endpoint: "POST /settlement-statements"
    occ_field: "expected_partner_agreement_version"
    description: |
      Creating a SettlementStatement against a PartnerAgreement whose version
      has advanced since the accountant last observed it is rejected. A new
      statement legitimately supersedes any DRAFT statement for the same
      (partner_agreement_id, period_id), so a second sequential create is a
      valid product operation rather than an invalid-state error. The
      stale-version check is what stops a statement from being measured on an
      agreement snapshot that a subsequent partner-issued PointLot, allocation
      or prior statement has already moved.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Every formula below is expressed over integers. `round_half_up(x)` means
# decimal ROUND_HALF_UP to 0 decimal places on an exact rational, NEVER binary
# float arithmetic. Ordering of steps is normative wherever a step consumes a
# previously ROUNDED value — see the `order_sensitivity:` note on each rule.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: point_issuance_measurement
    trigger: "POST /point-lots — measures the new PointLot's points, deferred revenue and tier/promotional expense."
    algorithm: tiered_pricing
    formula: |
      # Snapshots taken at issuance and frozen on the lot forever:
      lot.tier_multiplier_bp_at_issue        = program.tier_multiplier_bp[member.tier]
      lot.ssp_millicents_per_point_at_issue  = program.ssp_millicents_per_point
      lot.breakage_rate_bp_at_issue          = program.current_breakage_rate_bp
      lot.issued_at                          = clock_now
      lot.expires_at                         = lot.issued_at + program.point_expiry_days days

      # STEP 1 — tier uplift, ROUNDED to whole points:
      lot.tier_points = round_half_up(lot.base_points * lot.tier_multiplier_bp_at_issue / 10000)

      # STEP 2 — promotional uplift applied to the ALREADY-ROUNDED tier_points,
      #          rounded again to whole points:
      lot.points_issued = round_half_up(lot.tier_points * lot.promo_multiplier_bp / 10000)

      lot.points_remaining = lot.points_issued

      # STEP 3 — gross standalone selling price of the issued points:
      lot.gross_ssp_cents = round_half_up(lot.points_issued * lot.ssp_millicents_per_point_at_issue / 1000)

      # STEP 4 — breakage reserve withheld from deferral, then deferral:
      lot.breakage_reserve_cents = round_half_up(lot.gross_ssp_cents * lot.breakage_rate_bp_at_issue / 10000)
      lot.deferred_revenue_cents = lot.gross_ssp_cents - lot.breakage_reserve_cents

      # STEP 5 — expense attribution of the two uplifts, each measured on its
      #          OWN point delta at the snapshotted SSP:
      lot.tier_benefit_expense_cents = round_half_up((lot.tier_points   - lot.base_points) * lot.ssp_millicents_per_point_at_issue / 1000)
      lot.promo_expense_cents        = round_half_up((lot.points_issued - lot.tier_points) * lot.ssp_millicents_per_point_at_issue / 1000)

      # Derived-on-read remainders (recomputed on every GET, never persisted as
      # a version-bumping mutation):
      lot.remaining_gross_ssp_cents = round_half_up(lot.points_remaining * lot.ssp_millicents_per_point_at_issue / 1000)
      lot.remaining_deferred_cents  = lot.remaining_gross_ssp_cents
                                      - round_half_up(lot.remaining_gross_ssp_cents * lot.breakage_rate_bp_at_issue / 10000)

      # Ledger sync on the owning AccountingPeriod:
      period.issuance_deferred_cents += lot.deferred_revenue_cents
    input_set: "Exactly one Member (the lot's owner), its LoyaltyProgram, and the AccountingPeriod named in the request. The program MUST be ACTIVE and the period MUST be OPEN."
    constants:
      BP_SCALE: 10000
      MILLICENTS_PER_CENT: 1000
    precision: "0 decimal places (integer points / integer cents), round_half_up at every step listed above"
    order_sensitivity: |
      STEP 1 and STEP 2 are TWO SEPARATE roundings and the second consumes the
      first's rounded output. Collapsing them into one multiply-then-round
      (`round_half_up(base_points * tier_bp * promo_bp / 10^8)`) yields a
      DIFFERENT integer whenever both multipliers carry a fractional tail.
      Worked divergence with base_points=250, tier_multiplier_bp=10300 (SILVER),
      promo_multiplier_bp=10300:
        nested   -> tier_points = round_half_up(257.5)  = 258
                    points_issued = round_half_up(265.74) = 266   <-- CORRECT
        one-shot -> round_half_up(265.2175)               = 265   <-- WRONG
      The same divergence propagates into gross_ssp_cents (319 vs 318) and
      deferred_revenue_cents (239 vs 239 by coincidence at 2500 bp, so the
      points figure is the discriminating assertion).
    edge_cases:
      - "`promo_multiplier_bp` defaults to 10000 (no promotion), in which case STEP 2 is an identity on `tier_points`."
      - "BASE tier has tier_multiplier_bp 10000, so STEP 1 is an identity and `tier_benefit_expense_cents` is 0."
      - "`points_issued` is compared against `program.per_issuance_point_cap` by validations[priority=90] AFTER STEP 2; the boundary is inclusive."

  # ---------------------------------------------------------------------------
  - name: estimated_redemption_rate
    trigger: "POST /programs/{id}/breakage-estimates — measures the BreakageEstimate's redemption rate, breakage rate and required liability at the moment of creation."
    algorithm: weighted_scoring
    formula: |
      # Candidate cohorts: every Cohort of the program whose members hold a
      # non-zero weight (see input_set), ordered by
      #   enrollment_start_date ASC, then created_at ASC.
      # weight(cohort) = SUM over the cohort's members' PointLots with
      #   lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} of points_remaining

      if candidate_cohorts is empty:
          reject with ERR_NO_OUTSTANDING_POINTS

      # STEP 1 — per-cohort adjusted rate, CLAMPED PER COHORT:
      for each cohort c in candidate_cohorts:
          adj_c = clamp(c.observed_redemption_rate_bp + c.program_change_adjustment_bp,
                        RATE_FLOOR_BP, RATE_CEIL_BP)

      # STEP 2 — weight the ALREADY-CLAMPED per-cohort rates, then round once:
      W = SUM(weight(c))
      estimate.estimated_redemption_rate_bp = round_half_up( SUM(adj_c * weight(c)) / W )

      estimate.breakage_rate_bp = 10000 - estimate.estimated_redemption_rate_bp

      estimate.outstanding_points_at_estimate         = W
      estimate.outstanding_gross_ssp_cents_at_estimate =
          SUM over the same lots of round_half_up(lot.points_remaining * lot.ssp_millicents_per_point_at_issue / 1000)
      estimate.required_liability_cents =
          round_half_up(estimate.outstanding_gross_ssp_cents_at_estimate
                        * estimate.estimated_redemption_rate_bp / 10000)

      estimate.method_applied = <the variant selected below>
      estimate.state          = DRAFT
      estimate.prepared_by_user_id = X-User-ID
    input_set: |
      Cohorts of the program with weight > 0, where weight is the cohort's
      members' outstanding points (lots in lifecycle_state OUTSTANDING or
      PARTIALLY_REDEEMED only). Lots that are FULLY_REDEEMED, EXPIRED or
      ESCHEATED contribute NOTHING to either the weight or the gross SSP.
    constants:
      RATE_FLOOR_BP: 200
      RATE_CEIL_BP: 9800
      BP_SCALE: 10000
    precision: "0 decimal places (integer basis points / integer cents), round_half_up"
    order_sensitivity: |
      The clamp in STEP 1 is applied PER COHORT, BEFORE weighting. Clamping the
      weighted result instead produces a different rate whenever any single
      cohort's raw adjusted rate falls outside [200, 9800].
      Worked divergence — two cohorts:
        C1: observed 8200 bp, adjustment    0 bp, weight 5000 points
        C2: observed  400 bp, adjustment -300 bp, weight  266 points
        clamp-per-cohort (CORRECT):
          adj_C1 = 8200, adj_C2 = clamp(100) = 200
          (8200*5000 + 200*266) / 5266 = 41053200 / 5266 = 7795.898... -> 7796
        clamp-the-aggregate (WRONG):
          (8200*5000 + 100*266) / 5266 = 41026600 / 5266 = 7790.846... -> 7791
          (7791 is inside [200, 9800] so the late clamp is a no-op)
        7796 vs 7791 — the discriminating assertion.
    variants:
      - name: COHORT_WEIGHTED
        when: "program.breakage_method == COHORT_WEIGHTED AND the request omits `cohort_id` (any number of candidate cohorts, including exactly one)"
        difference: "Uses the full multi-cohort weighted formula above; `method_applied` is set to COHORT_WEIGHTED."
      - name: SINGLE_COHORT
        when: "the request supplies `cohort_id` (regardless of program.breakage_method)"
        difference: "Candidate set is restricted to that one Cohort, so W is that cohort's weight and the weighted mean collapses to `clamp(c.observed_redemption_rate_bp + c.program_change_adjustment_bp, 200, 9800)` with no division; `method_applied` is set to SINGLE_COHORT. The named cohort must have weight > 0 or ERR_NO_OUTSTANDING_POINTS is returned."
      - name: PROGRAM_HISTORICAL
        when: "program.breakage_method == PROGRAM_HISTORICAL AND the request omits `cohort_id`"
        difference: "Cohort weights and adjustments are ignored entirely; `estimated_redemption_rate_bp = program.historical_redemption_rate_bp` verbatim. `outstanding_points_at_estimate` and `outstanding_gross_ssp_cents_at_estimate` are still measured over the same lot set, so `required_liability_cents` still varies with the outstanding balance; `method_applied` is set to PROGRAM_HISTORICAL. ERR_NO_OUTSTANDING_POINTS still applies when no lot is outstanding."

  # ---------------------------------------------------------------------------
  - name: redemption_revenue_release
    trigger: "POST /redemption-events/{id}/allocate (provisional variant) and POST /redemption-events/{id}/fulfill (final variant)."
    algorithm: chronological
    formula: |
      # FIFO consumption sequence over the member's lots:
      #   candidates = member's PointLots with lifecycle_state IN
      #                {OUTSTANDING, PARTIALLY_REDEEMED} and points_remaining > 0
      #   order      = issued_at ASC, then created_at ASC   (never by id)
      # Walk the sequence, consuming min(points_left_to_fill, lot.points_remaining)
      # from each lot until points_requested is exhausted. Each consumed lot
      # produces exactly one RedemptionAllocation row with
      # allocation_seq = 1, 2, 3, ... in consumption order.

      for each allocation line L (in allocation_seq order):
          L.line_gross_ssp_cents = round_half_up(L.points_allocated
                                    * lot.ssp_millicents_per_point_at_issue / 1000)

      # --- variant `provisional_at_allocation` -----------------------------
      # PER LINE, using each lot's OWN frozen at-issue breakage rate:
      for each allocation line L:
          L.provisional_release_cents = L.line_gross_ssp_cents
              - round_half_up(L.line_gross_ssp_cents * lot.breakage_rate_bp_at_issue / 10000)
      event.provisional_release_cents = SUM(L.provisional_release_cents)

      # --- variant `final_at_fulfillment` ---------------------------------
      # PER LINE, using the program's CURRENT approved breakage rate:
      for each allocation line L:
          L.final_release_cents = L.line_gross_ssp_cents
              - round_half_up(L.line_gross_ssp_cents * program.current_breakage_rate_bp / 10000)
      event.final_release_cents        = SUM(L.final_release_cents)
      event.remeasurement_delta_cents  = event.final_release_cents - event.provisional_release_cents

      # Partner cost leg (independent of both variants):
      if event.partner_agreement_id is not null:
          event.partner_cost_cents = round_half_up(event.points_requested
              * partner_agreement.redemption_rate_millicents_per_point / 1000)
      else:
          event.partner_cost_cents = 0

      # Ledger sync:
      period.redemption_recognized_cents += event.provisional_release_cents   # at allocate
      period.remeasurement_delta_cents   += event.remeasurement_delta_cents   # at fulfill
    input_set: "The member's PointLots in lifecycle_state OUTSTANDING or PARTIALLY_REDEEMED with points_remaining > 0. EXPIRED, ESCHEATED and FULLY_REDEEMED lots are never consumed, regardless of settlement_state."
    constants:
      BP_SCALE: 10000
      MILLICENTS_PER_CENT: 1000
    precision: "0 decimal places (integer cents), round_half_up, applied ONCE PER ALLOCATION LINE"
    order_sensitivity: |
      (1) FIFO order is by `issued_at ASC` then `created_at ASC`. Lots created
          out of chronological order (a later POST carrying an earlier
          clock position) must still be consumed oldest-first.
      (2) The reserve is deducted PER LINE, never once on the summed gross.
          Worked divergence — three lots contributing 266 / 103 / 39 points at
          ssp 1200 millicents, line grosses 319 / 124 / 47 (sum 490):
            final at program.current_breakage_rate_bp = 2204:
              per-line: (319-70) + (124-27) + (47-10) = 249 + 97 + 37 = 383  <-- CORRECT
              round-once: 490 - round_half_up(108.0) = 490 - 108      = 382  <-- WRONG
          The provisional leg at 2500 bp happens to agree (367 both ways), so
          the FINAL leg is the discriminating assertion.
    variants:
      - name: provisional_at_allocation
        when: "POST /redemption-events/{id}/allocate — the RedemptionEvent moves REQUESTED -> ALLOCATED."
        difference: "Reserve rate is each consumed lot's OWN `breakage_rate_bp_at_issue` snapshot, so a redemption spanning lots issued under different rates blends several rates in one event."
      - name: final_at_fulfillment
        when: "POST /redemption-events/{id}/fulfill — the RedemptionEvent moves ALLOCATED -> FULFILLED."
        difference: "Reserve rate is the SINGLE current `program.current_breakage_rate_bp` for every line, ignoring the per-lot snapshots. `remeasurement_delta_cents` is the difference and is booked to the period separately from the provisional release."
      - name: reversal_compensation
        when: "POST /redemption-events/{id}/reverse — the RedemptionEvent moves ALLOCATED or FULFILLED -> REVERSED."
        difference: "Emits one REVERSAL RedemptionAllocation row per ALLOCATION row with `points_allocated`, `line_gross_ssp_cents`, `provisional_release_cents` and `final_release_cents` all negated. No re-measurement occurs; the negated values are copied from the original rows so the period ledger returns to its exact pre-allocate figures."

  # ---------------------------------------------------------------------------
  - name: period_close_rollforward
    trigger: "POST /accounting-periods/{id}/soft-close — computes and persists the period's eight liability rollforward figures. Also computed read-only by GET /accounting-periods/{id}/liability-rollforward."
    algorithm: aggregation
    formula: |
      # The EIGHT STEPS BELOW ARE STRICTLY ORDERED. Each consumes the previous
      # steps' results; permuting them changes the answer.

      # STEP 1 — opening liability = closing liability of the program's latest
      #          already-closed period, i.e. the period with state IN
      #          {SOFT_CLOSED, HARD_CLOSED} and the greatest end_at (tie-break
      #          created_at ASC, take the LAST). Zero when none exists.
      period.opening_liability_cents = that period's closing_liability_cents, else 0

      # STEP 2..5 — the four movement accumulators already maintained
      #          incrementally by §1.2 side effects are FROZEN as-is (they are
      #          NOT recomputed here):
      #   period.issuance_deferred_cents
      #   period.redemption_recognized_cents
      #   period.remeasurement_delta_cents
      #   period.expiry_released_cents

      # STEP 6 — pre-catch-up liability, in exactly this sign order:
      period.pre_catchup_liability_cents =
            period.opening_liability_cents
          + period.issuance_deferred_cents
          - period.redemption_recognized_cents
          - period.remeasurement_delta_cents
          - period.expiry_released_cents

      # STEP 7 — required liability from the APPROVED estimate's rate applied to
      #          the outstanding gross SSP measured AT CLOSE (not at estimate):
      period.approved_estimate_rate_bp = approved_estimate.estimated_redemption_rate_bp
      outstanding_gross_at_close =
          SUM over the program's PointLots with lifecycle_state IN
              {OUTSTANDING, PARTIALLY_REDEEMED} of
          round_half_up(lot.points_remaining * lot.ssp_millicents_per_point_at_issue / 1000)
      period.required_liability_cents =
          round_half_up(outstanding_gross_at_close * period.approved_estimate_rate_bp / 10000)

      # STEP 8 — catch-up adjustment, closing liability and recognised breakage:
      period.catch_up_adjustment_cents = period.required_liability_cents
                                       - period.pre_catchup_liability_cents
      period.closing_liability_cents   = period.pre_catchup_liability_cents
                                       + period.catch_up_adjustment_cents
      period.breakage_recognized_cents = -1 * period.catch_up_adjustment_cents
    input_set: |
      STEP 1 reads sibling AccountingPeriods of the same program in
      {SOFT_CLOSED, HARD_CLOSED}. STEP 7 reads the program's PointLots in
      lifecycle_state OUTSTANDING or PARTIALLY_REDEEMED **program-wide, not
      period-scoped** — a lot issued in an earlier period still carries
      liability into this period's required balance. The APPROVED
      BreakageEstimate must belong to THIS period.
    constants:
      BP_SCALE: 10000
      MILLICENTS_PER_CENT: 1000
    precision: "0 decimal places (integer cents), round_half_up in STEP 7 only; STEPS 6 and 8 are exact integer arithmetic"
    order_sensitivity: |
      STEP 7's `outstanding_gross_at_close` is measured at CLOSE time, whereas
      the estimate's own `outstanding_gross_ssp_cents_at_estimate` was measured
      at ESTIMATE time. Reusing the estimate's frozen figure in STEP 7 gives a
      different `required_liability_cents`, and therefore a different
      `catch_up_adjustment_cents`, whenever any redemption or expiry occurred
      between approval and close.
      Worked figures for the canonical fixture:
        opening 0; issuance_deferred 4739; redemption_recognized 2700;
        remeasurement_delta 107; expiry_released 0
        STEP 6 pre_catchup = 0 + 4739 - 2700 - 107 - 0            = 1932
        STEP 7 outstanding_gross_at_close = 2400 + 319            = 2719
               required = round_half_up(2719 * 7796 / 10000)      = 2120
        STEP 8 catch_up = 2120 - 1932                             =  188
               closing  = 1932 + 188                              = 2120
               breakage_recognized = -188
      Using the estimate-time gross (6319) instead would give required 4926 and
      catch_up 2994 — the discriminating assertion.
    edge_cases:
      - "A period with no issuance, no redemption and no expiry still produces a non-zero `catch_up_adjustment_cents` whenever prior-period lots remain outstanding and the approved rate has moved."
      - "`breakage_recognized_cents` is negative when the liability must be topped up and positive when it is released."

  # ---------------------------------------------------------------------------
  - name: partner_settlement_net
    trigger: "POST /settlement-statements — measures the statement's receivable, payable, carry-forward and net due."
    algorithm: threshold
    formula: |
      statement.partner_issued_points =
          SUM of points_issued over PointLots with
              partner_agreement_id == statement.partner_agreement_id
          AND period_id == statement.period_id
          (ALL lifecycle_states are included — issuance is billable the moment
           it happens, regardless of later redemption or expiry)

      statement.partner_redeemed_points =
          SUM of points_requested over RedemptionEvents with
              partner_agreement_id == statement.partner_agreement_id
          AND period_id == statement.period_id
          AND state IN {ALLOCATED, FULFILLED}
          (REQUESTED and REVERSED events are excluded)

      statement.issuance_receivable_cents = round_half_up(statement.partner_issued_points
          * agreement.issuance_rate_millicents_per_point / 1000)
      statement.redemption_payable_cents  = round_half_up(statement.partner_redeemed_points
          * agreement.redemption_rate_millicents_per_point / 1000)

      statement.carried_forward_cents = agreement.deferred_below_minimum_cents   # 0 on first statement

      candidate = <per variant below>

      if candidate < agreement.min_invoice_cents:
          statement.net_due_cents                = 0
          statement.deferred_below_minimum_cents = candidate
      else:
          statement.net_due_cents                = candidate
          statement.deferred_below_minimum_cents = 0

      agreement.deferred_below_minimum_cents = statement.deferred_below_minimum_cents
      statement.due_date = period.end_at + agreement.settlement_lag_days days
      statement.state    = DRAFT
    input_set: "PointLots and RedemptionEvents matching BOTH the statement's `partner_agreement_id` AND its `period_id`. Lots/events with a null partner_agreement_id are never included."
    constants:
      MILLICENTS_PER_CENT: 1000
    precision: "0 decimal places (integer cents), round_half_up on each leg independently"
    order_sensitivity: |
      The minimum-invoice threshold is applied to `candidate` AFTER the
      carry-forward is added, never before. Applying it to the current period's
      legs alone would strand the carry-forward forever.
      Worked figures: receivable 72000, payable 3300, carried_forward 0,
      min_invoice_cents 5000:
        GROSS -> candidate 72000, net_due 72000, deferred_below_minimum 0
        NET   -> candidate 68700, net_due 68700, deferred_below_minimum 0
      The 3300 delta between the two variants is the discriminating assertion.
    variants:
      - name: GROSS
        when: "agreement.net_settlement_enabled == false"
        difference: "`candidate = issuance_receivable_cents + carried_forward_cents`. The redemption payable is measured and reported on the statement but is NOT offset — it is settled on the partner's own invoice outside this ledger. `settlement_basis` is set to GROSS."
      - name: NET
        when: "agreement.net_settlement_enabled == true"
        difference: "`candidate = issuance_receivable_cents - redemption_payable_cents + carried_forward_cents`. The payable is offset inside this statement. `settlement_basis` is set to NET, and `candidate` may be negative, in which case it always falls below `min_invoice_cents` and is deferred rather than billed."

  # ---------------------------------------------------------------------------
  - name: lot_expiry_and_escheat_measurement
    trigger: "POST /accounting-periods/{id}/expiry-sweep — measures every eligible lot's expiry release and escheatment accrual."
    algorithm: threshold
    formula: |
      # Candidate lots, processed in issued_at ASC then created_at ASC order:
      #   lots of the swept period's PROGRAM (not just the swept period) with
      #   lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED}
      #   AND lot.expires_at <= clock_now
      # For each candidate, resolve
      #   rule = StateExpiryRule for (member.program_id, member.state_code)
      # If no rule exists, or rule.expiry_permitted == false, or
      #   member.dormancy_days < rule.min_dormancy_days  -> SKIP the lot silently.

      for each eligible lot:
          lot.expired_gross_ssp_cents = lot.remaining_gross_ssp_cents        # pre-zeroing
          released                    = lot.remaining_deferred_cents        # pre-zeroing
          lot.points_remaining        = 0
          lot.lifecycle_state         = EXPIRED
          swept_period.expiry_released_cents += released

          if rule.escheatment_required == true:
              lot.escheated_cents = round_half_up(lot.expired_gross_ssp_cents
                                                  * rule.escheat_rate_bp / 10000)
              lot.lifecycle_state = ESCHEATED
              swept_period.escheat_accrual_cents  += lot.escheated_cents
              program.total_escheat_accrual_cents += lot.escheated_cents
              if program.total_escheat_accrual_cents >= program.escheat_disclosure_threshold_cents:
                  program.escheat_disclosure_required = true      # latches, never unset
          else:
              lot.escheated_cents = 0

      # Member dormancy fan-out, evaluated per touched member in created_at ASC:
      for each member touched by the pass:
          if member.status == ACTIVE and member.point_balance == 0
             and member.dormancy_days >= 730:
              member.status = DORMANT

      program.version += 1        # once per sweep request, not once per lot
    input_set: "PointLots of the swept period's program in lifecycle_state OUTSTANDING or PARTIALLY_REDEEMED whose `expires_at <= clock_now`. Lots already EXPIRED / ESCHEATED are never re-swept; `settlement_state` is irrelevant to eligibility."
    constants:
      BP_SCALE: 10000
      MILLICENTS_PER_CENT: 1000
      DORMANCY_DAYS_FOR_MEMBER_FLAG: 730
    precision: "0 decimal places (integer cents), round_half_up on the escheat leg"
    order_sensitivity: |
      `expired_gross_ssp_cents` and the released deferral are read BEFORE
      `points_remaining` is zeroed. Reading them after zeroing yields 0 for both
      and silently books nothing. Boundary: with `expires_at`
      2028-08-04T00:00:00Z the lot is NOT eligible at clock
      2028-08-03T23:59:59.999Z and IS eligible at exactly 2028-08-04T00:00:00Z
      (the comparison is `<=`).
      Worked figures: a 5000-point lot at ssp 1200 and breakage 2500 gives
      expired_gross_ssp_cents 6000 and released deferral 4500; with
      escheat_rate_bp 6000 the escheat accrual is
      round_half_up(6000 * 6000 / 10000) = 3600.
    edge_cases:
      - "A missing StateExpiryRule for the member's `state_code` is treated as `expiry_permitted == false` — the lot is skipped, not errored."
      - "`escheat_rate_bp` of 10000 escheats the whole expired gross SSP (6000 cents in the worked figures)."
      - "`escheat_disclosure_required` latches at `>=` the threshold and is never cleared, even if a later reopen reduces other figures."

  # ---------------------------------------------------------------------------
  - name: program_change_liability_projection
    trigger: "POST /program-change-orders — models the liability and behaviour impact of a proposed program change without mutating the program."
    algorithm: forward_looking
    formula: |
      order.baseline_redemption_rate_bp  = 10000 - program.current_breakage_rate_bp
      order.projected_redemption_rate_bp = clamp(
          order.baseline_redemption_rate_bp + order.behavior_elasticity_bp,
          RATE_FLOOR_BP, RATE_CEIL_BP)

      # Both grosses are measured over the SAME lot set — the program's lots in
      # lifecycle_state IN {OUTSTANDING, PARTIALLY_REDEEMED} — but at DIFFERENT
      # standalone selling prices:
      order.baseline_outstanding_gross_ssp_cents =
          SUM of round_half_up(lot.points_remaining * lot.ssp_millicents_per_point_at_issue / 1000)

      projected_ssp = order.new_ssp_millicents_per_point   if order.change_type == SSP_CHANGE
                      else program.ssp_millicents_per_point
      order.projected_outstanding_gross_ssp_cents =
          SUM of round_half_up(lot.points_remaining * projected_ssp / 1000)

      order.projected_liability_delta_cents =
            round_half_up(order.projected_outstanding_gross_ssp_cents
                          * order.projected_redemption_rate_bp / 10000)
          - round_half_up(order.baseline_outstanding_gross_ssp_cents
                          * order.baseline_redemption_rate_bp / 10000)
      order.state = MODELED
    input_set: "The program's PointLots in lifecycle_state OUTSTANDING or PARTIALLY_REDEEMED at the moment the order is created. The projection is a snapshot and is NEVER re-measured when the order is later approved or applied."
    constants:
      RATE_FLOOR_BP: 200
      RATE_CEIL_BP: 9800
      BP_SCALE: 10000
      MILLICENTS_PER_CENT: 1000
    precision: "0 decimal places (integer cents), round_half_up per lot on each gross and once on each liability leg"
    order_sensitivity: |
      The two liability legs are each rounded independently and THEN
      subtracted; rounding the difference of the two unrounded products gives a
      different figure. Worked: baseline rate 7796, elasticity -400 ->
      projected 7396; baseline gross 6319, projected gross at ssp 1500 = 7899;
        round_half_up(7899 * 7396 / 10000) = 5842
        round_half_up(6319 * 7796 / 10000) = 4926
        projected_liability_delta_cents    =  916
    edge_cases:
      - "For change_type EXPIRY_DAYS_CHANGE and TIER_MULTIPLIER_CHANGE the projected gross equals the baseline gross, so the delta is driven purely by `behavior_elasticity_bp`."
      - "A `behavior_elasticity_bp` large enough to push the projected rate past 9800 or below 200 is clamped, so the delta saturates."

  # ---------------------------------------------------------------------------
  - name: breakage_sensitivity_bands
    trigger: "GET /breakage-estimates/{id}/sensitivity — audit-support read producing the low/base/high required-liability band for an actuarial memorandum."
    algorithm: aggregation
    formula: |
      og   = estimate.outstanding_gross_ssp_cents_at_estimate
      low_required_liability_cents  = round_half_up(og * estimate.sensitivity_low_bp  / 10000)
      base_required_liability_cents = round_half_up(og * estimate.estimated_redemption_rate_bp / 10000)
      high_required_liability_cents = round_half_up(og * estimate.sensitivity_high_bp / 10000)
      band_range_cents = high_required_liability_cents - low_required_liability_cents
      memo_narrative   = estimate.memo_narrative
    input_set: "Exactly the one BreakageEstimate named in the path. Uses its FROZEN `outstanding_gross_ssp_cents_at_estimate` snapshot, never a fresh measurement, so the band is reproducible for audit long after the lots have moved."
    constants:
      BP_SCALE: 10000
    precision: "0 decimal places (integer cents), round_half_up on each of the three bands independently"
    order_sensitivity: |
      Each band is rounded independently from the same unrounded gross; deriving
      the high band by adding a rounded delta to the rounded base drifts.
      Worked: og 6319 with sensitivity_low_bp 7296, rate 7796,
      sensitivity_high_bp 8296:
        low 4610, base 4926, high 5242, band_range 632.
    edge_cases:
      - "`sensitivity_low_bp` must be <= `estimated_redemption_rate_bp` <= `sensitivity_high_bp`; validations[priority=87] rejects a band that does not straddle the measured rate."
      - "The band is computed from the estimate snapshot, so it is identical before and after the estimate is approved or superseded."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority — LOWEST NUMBER WINS)
#
# The ladder is evaluated top to bottom and the FIRST violated rule decides the
# response. Two deliberately-engineered priority conflicts are called out in
# `conflict_pair:` notes below (see §1.8 rule_id priority_pair_validation_conflict).
# =============================================================================
validations:

  # --- 1. Authentication ------------------------------------------------------
  - priority: 10
    category: auth
    check: "Both `X-User-Role` and `X-User-ID` request headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 11
    category: auth
    check: "`X-User-Role` names one of the five roles declared in §1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  # --- 2. Authorization -------------------------------------------------------
  - priority: 20
    category: auth
    check: "The acting `X-User-Role` appears in the target endpoint's §1.5 `roles:` list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 21
    category: auth
    check: "For entity-backed roles, `X-User-ID` matches the resource's owning foreign key: role Member requires `X-User-ID == member.id` for the Member whose PointLot / RedemptionEvent is addressed; role PartnerOperator requires `X-User-ID == statement.partner_agreement_id`."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /redemption-events, GET /members/{id}, GET /point-lots/{id}, GET /redemption-events/{id}, GET /settlement-statements/{id}, POST /settlement-statements/{id}/dispute"

  # --- 3. Request shape -------------------------------------------------------
  - priority: 30
    category: business_constraint
    check: "Request body parses, every required field named in the endpoint's §1.5 `input:` is present, every value satisfies its §1.1 type/enum/range constraint, and pagination `limit` is within 1..100 with `offset >= 0`."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- 4. Existence — path segments first (left to right), then body FKs ------
  - priority: 40
    category: existence
    check: "Every id appearing as a path segment resolves to a live row, validated LEFT TO RIGHT."
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_STATE_EXPIRY_RULE_NOT_FOUND | ERR_COHORT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_PARTNER_AGREEMENT_NOT_FOUND | ERR_POINT_LOT_NOT_FOUND | ERR_REDEMPTION_EVENT_NOT_FOUND | ERR_BREAKAGE_ESTIMATE_NOT_FOUND | ERR_SETTLEMENT_STATEMENT_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a templated path id"
  - priority: 41
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to a live row, validated in the field order declared by the endpoint's §1.5 `input:` list."
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_COHORT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_PARTNER_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /state-expiry-rules, POST /cohorts, POST /members, POST /accounting-periods, POST /partner-agreements, POST /point-lots, POST /redemption-events, POST /programs/{id}/breakage-estimates, POST /settlement-statements, POST /program-change-orders"

  # --- 5. Optimistic concurrency (§1.2.1) ------------------------------------
  - priority: 50
    category: state
    check: "`expected_program_version` equals the current `LoyaltyProgram.version`."
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /breakage-estimates/{id}/approve"
    note: "Concurrency rule `estimate-approve-stale-program`. Sits ABOVE every state check so a stale approval is reported as 412 even when the estimate is also in a wrong state."
  - priority: 51
    category: state
    check: "`expected_partner_agreement_version` equals the current `PartnerAgreement.version`."
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /settlement-statements"
    note: "Concurrency rule `statement-create-stale-agreement`."

  # --- 6. State preconditions -------------------------------------------------
  - priority: 60
    category: state
    check: "The addressed AccountingPeriod is in state OPEN."
    error_id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /point-lots, POST /redemption-events, POST /redemption-events/{id}/allocate, POST /redemption-events/{id}/fulfill, POST /redemption-events/{id}/reverse, POST /programs/{id}/breakage-estimates, POST /breakage-estimates/{id}/submit, POST /breakage-estimates/{id}/approve, POST /accounting-periods/{id}/expiry-sweep"
    conflict_pair: "Deliberately ABOVE priority 90 ERR_ISSUANCE_CAP_EXCEEDED. On POST /point-lots into a SOFT_CLOSED period with `base_points` that also breaches `per_issuance_point_cap`, ERR_PERIOD_NOT_OPEN (409) wins."
  - priority: 61
    category: state
    check: "The owning LoyaltyProgram is in status ACTIVE."
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /point-lots, POST /redemption-events, POST /redemption-events/{id}/allocate, POST /programs/{id}/breakage-estimates, POST /program-change-orders/{id}/approve, POST /program-change-orders/{id}/apply"
  - priority: 62
    category: state
    check: "The addressed entity's current state is a declared `from:` state for the requested §1.2 transition."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST action endpoint that drives a §1.2 transition"
  - priority: 63
    category: state
    check: "The addressed PartnerAgreement is in status ACTIVE."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /settlement-statements, POST /settlement-statements/{id}/issue"
  - priority: 64
    category: state
    check: "The addressed AccountingPeriod is not HARD_CLOSED — no child of a HARD_CLOSED period may be mutated."
    error_id: ERR_PERIOD_HARD_CLOSED
    http_status: 409
    applies_to: "POST /accounting-periods/{id}/reopen, POST /settlement-statements, POST /settlement-statements/{id}/issue, POST /settlement-statements/{id}/pay, POST /settlement-statements/{id}/write-off"

  # --- 7a. Business rules — safety / compliance ------------------------------
  - priority: 70
    category: business_safety
    check: "Segregation of duties: the approving `X-User-ID` differs from `BreakageEstimate.prepared_by_user_id`."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /breakage-estimates/{id}/approve"
  - priority: 71
    category: business_safety
    check: "The APPROVED BreakageEstimate backing the period has a non-empty `memo_narrative` (actuarial memorandum on file)."
    error_id: ERR_MEMO_NARRATIVE_REQUIRED
    http_status: 409
    applies_to: "POST /accounting-periods/{id}/hard-close"
    conflict_pair: "Deliberately ABOVE priority 85 ERR_UNSETTLED_STATEMENTS. On POST /accounting-periods/{id}/hard-close where the memorandum is empty AND an ISSUED statement is still unsettled, ERR_MEMO_NARRATIVE_REQUIRED (409) wins."
  - priority: 72
    category: business_safety
    check: "An APPROVED BreakageEstimate exists for the addressed AccountingPeriod."
    error_id: ERR_ESTIMATE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /accounting-periods/{id}/soft-close, POST /redemption-events/{id}/fulfill"
  - priority: 73
    category: business_safety
    check: "No RedemptionEvent of the addressed AccountingPeriod is still in state REQUESTED (every requested redemption must be allocated or reversed before the books close)."
    error_id: ERR_UNALLOCATED_REDEMPTIONS
    http_status: 409
    applies_to: "POST /accounting-periods/{id}/soft-close"

  # --- 7b. Business rules — temporal ----------------------------------------
  - priority: 75
    category: business_temporal
    check: "`start_at < end_at` on an AccountingPeriod, and `effective_start_date < effective_end_date` on a PartnerAgreement."
    error_id: ERR_INVALID_WINDOW
    http_status: 409
    applies_to: "POST /accounting-periods, POST /partner-agreements"
  - priority: 76
    category: business_temporal
    check: "The new AccountingPeriod's HALF-OPEN window [start_at, end_at) does not overlap any existing period of the same program. Adjacency is allowed: a window starting exactly at another window's `end_at` is accepted; gaps between windows are also allowed."
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /accounting-periods"
  - priority: 77
    category: business_temporal
    check: "The new PartnerAgreement's CLOSED window [effective_start_date, effective_end_date] does not conflict with any non-TERMINATED agreement carrying the same `partner_code` on the same program, where a conflict means `new.effective_start_date <= prior.effective_end_date + prior.settlement_lag_days days`. The lag buffer means adjacency is NOT sufficient — the new window must begin strictly after the prior window's settlement tail."
    error_id: ERR_PARTNER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /partner-agreements"
  - priority: 78
    category: business_temporal
    check: "`clock_now >= AccountingPeriod.end_at` — a period cannot be soft-closed before its window has elapsed."
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /accounting-periods/{id}/soft-close"
  - priority: 79
    category: business_temporal
    check: "`clock_now >= ProgramChangeOrder.effective_at` — an approved change order cannot be applied before its effective instant."
    error_id: ERR_CHANGE_NOT_YET_EFFECTIVE
    http_status: 409
    applies_to: "POST /program-change-orders/{id}/apply"

  # --- 7c. Business rules — referential coherence ---------------------------
  - priority: 80
    category: business_referential
    check: "The AccountingPeriod named in the body belongs to the same LoyaltyProgram as the Member / PartnerAgreement / BreakageEstimate it is being paired with."
    error_id: ERR_PERIOD_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /point-lots, POST /redemption-events, POST /programs/{id}/breakage-estimates, POST /settlement-statements"
  - priority: 81
    category: business_referential
    check: "The Cohort named in the body belongs to the same LoyaltyProgram as the Member (on member create) or the program in the path (on estimate create)."
    error_id: ERR_COHORT_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /members, POST /programs/{id}/breakage-estimates"
  - priority: 82
    category: business_referential
    check: "The PartnerAgreement named in the body belongs to the same LoyaltyProgram as the Member (point-lot / redemption-event create) or the AccountingPeriod (statement create)."
    error_id: ERR_AGREEMENT_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /point-lots, POST /redemption-events, POST /settlement-statements"
  - priority: 83
    category: business_referential
    check: "`period_code` is unique within a LoyaltyProgram; `cohort_code` is unique within a LoyaltyProgram; `state_code` is unique within a LoyaltyProgram's StateExpiryRules; `external_member_ref` is unique within a LoyaltyProgram."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /accounting-periods, POST /cohorts, POST /state-expiry-rules, POST /members"
  - priority: 84
    category: business_referential
    check: "The program's `tier_multiplier_bp` object declares exactly the four keys BASE, SILVER, GOLD, PLATINUM, and `new_tier_multiplier_bp` (when supplied) does the same."
    error_id: ERR_TIER_MULTIPLIER_KEYS_INVALID
    http_status: 409
    applies_to: "POST /programs, POST /program-change-orders"

  # --- 7d. Business rules — bounded-cycle and band constraints --------------
  - priority: 85
    category: business_constraint
    check: "Every SettlementStatement of the addressed AccountingPeriod is in state PAID, WRITTEN_OFF or SUPERSEDED."
    error_id: ERR_UNSETTLED_STATEMENTS
    http_status: 409
    applies_to: "POST /accounting-periods/{id}/hard-close"
  - priority: 86
    category: business_constraint
    check: "`BreakageEstimate.revision_count < 2` when resubmitting a REJECTED estimate; `AccountingPeriod.reopen_count < 2` when reopening; `SettlementStatement.dispute_count < 2` when disputing."
    error_id: "ERR_REVISION_LIMIT_EXCEEDED | ERR_REOPEN_LIMIT_EXCEEDED | ERR_DISPUTE_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /breakage-estimates/{id}/submit, POST /accounting-periods/{id}/reopen, POST /settlement-statements/{id}/dispute"
  - priority: 87
    category: business_constraint
    check: "`sensitivity_low_bp <= estimated_redemption_rate_bp <= sensitivity_high_bp` — the sensitivity band must straddle the measured rate."
    error_id: ERR_SENSITIVITY_BAND_INVALID
    http_status: 409
    applies_to: "POST /programs/{id}/breakage-estimates"
  - priority: 88
    category: business_constraint
    check: "`promo_multiplier_bp <= program.promo_multiplier_cap_bp`."
    error_id: ERR_PROMO_MULTIPLIER_ABOVE_CAP
    http_status: 409
    applies_to: "POST /point-lots"
  - priority: 89
    category: business_constraint
    check: "`PartnerAgreement.outstanding_settlement_cents == 0` before termination."
    error_id: ERR_OUTSTANDING_SETTLEMENT
    http_status: 409
    applies_to: "POST /partner-agreements/{id}/terminate"
  - priority: 89
    category: business_constraint
    check: "Every AccountingPeriod of the program is HARD_CLOSED before the program may be closed. Shares priority 89 with ERR_OUTSTANDING_SETTLEMENT; the two apply to disjoint endpoints so no ordering ambiguity arises."
    error_id: ERR_PERIODS_NOT_CLOSED
    http_status: 409
    applies_to: "POST /programs/{id}/close"

  # --- 7e. Business rules — fiscal / capacity (evaluated LAST) --------------
  - priority: 90
    category: business_fiscal
    check: "`points_issued` computed by `point_issuance_measurement` STEP 2 is <= `program.per_issuance_point_cap`. The boundary is INCLUSIVE — a value exactly equal to the cap passes."
    error_id: ERR_ISSUANCE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /point-lots"
  - priority: 91
    category: business_fiscal
    check: "The member's outstanding points (sum of `points_remaining` over lots in lifecycle_state OUTSTANDING or PARTIALLY_REDEEMED) are >= `points_requested`."
    error_id: ERR_INSUFFICIENT_POINT_BALANCE
    http_status: 409
    applies_to: "POST /redemption-events/{id}/allocate"
  - priority: 92
    category: business_fiscal
    check: "The `estimated_redemption_rate` candidate set is non-empty — at least one cohort in scope carries outstanding points."
    error_id: ERR_NO_OUTSTANDING_POINTS
    http_status: 409
    applies_to: "POST /programs/{id}/breakage-estimates"
  - priority: 93
    category: business_fiscal
    check: "At least one StateExpiryRule and at least one Cohort exist for the program before it may be activated."
    error_id: ERR_PROGRAM_CONFIG_INCOMPLETE
    http_status: 409
    applies_to: "POST /programs/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
#
# `api_prefix` is empty: every collection is top-level. Every entity exposes a
# single-resource GET (segment derivation) plus a filtered-list GET carrying all
# of its FK fields as optional query parameters (FK reverse-reachability).
# RedemptionAllocation is immutable and has no collection of its own — it is
# reached only through the two sub-resource GETs below.
# Every GET declares "limit?" and "offset?"; §1.0 pagination defaults apply.
# Optional inputs carry a trailing "?"; entries are quoted so the trailing "?"
# is unambiguous YAML.
# =============================================================================
endpoints:

  # --- Logical clock (test-driving; §1.5 priority-ladder rung 3) --------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every timestamp comparison in §1.3 and §1.4 reads. THE SERVER'S STARTUP DEFAULT IS EXACTLY 2026-08-01T00:00:00Z — before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects:
      - "sets the logical clock to `current_utc`; no entity is mutated and no version is bumped"

  # --- LoyaltyProgram ---------------------------------------------------------
  - method: POST
    path: "/programs"
    description: "Creates a LoyaltyProgram in status DRAFT."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "currency_code?", "ssp_millicents_per_point", "point_expiry_days", "per_issuance_point_cap", "tier_multiplier_bp", "promo_multiplier_cap_bp?", "breakage_method?", "historical_redemption_rate_bp", "escheat_disclosure_threshold_cents?"]
    output: LoyaltyProgram
    side_effects:
      - "sets LoyaltyProgram.status = DRAFT, current_breakage_rate_bp = 0, total_escheat_accrual_cents = 0, escheat_disclosure_required = false, version = 1"
  - method: GET
    path: "/programs"
    description: "Lists LoyaltyPrograms."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["status?", "breakage_method?", "limit?", "offset?"]
    output: LoyaltyProgram[]
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Reads one LoyaltyProgram, including the derived-on-read `total_deferred_revenue_cents` and `recognized_breakage_ytd_cents`."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: LoyaltyProgram
    side_effects: []
  - method: POST
    path: "/programs/{id}/activate"
    description: "Drives LoyaltyProgram DRAFT -> ACTIVE (first activation, which seeds the breakage rate) or SUSPENDED -> ACTIVE (reactivation, which does not)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: LoyaltyProgram
    side_effects:
      - "on DRAFT -> ACTIVE only: sets LoyaltyProgram.current_breakage_rate_bp = 10000 - historical_redemption_rate_bp"
      - "increments LoyaltyProgram.version by 1"
  - method: POST
    path: "/programs/{id}/suspend"
    description: "Drives LoyaltyProgram ACTIVE -> SUSPENDED, blocking issuance and redemption."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: LoyaltyProgram
    side_effects:
      - "increments LoyaltyProgram.version by 1"
  - method: POST
    path: "/programs/{id}/close"
    description: "Drives LoyaltyProgram ACTIVE or SUSPENDED -> CLOSED. Requires every AccountingPeriod of the program to be HARD_CLOSED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: LoyaltyProgram
    side_effects:
      - "increments LoyaltyProgram.version by 1"

  # --- StateExpiryRule --------------------------------------------------------
  - method: POST
    path: "/state-expiry-rules"
    description: "Declares the point-expiry and escheatment policy for one US state under one program."
    roles: [ProgramAdmin]
    code: 201
    input: ["program_id", "state_code", "expiry_permitted", "min_dormancy_days", "escheatment_required", "escheat_rate_bp"]
    output: StateExpiryRule
    side_effects: []
  - method: GET
    path: "/state-expiry-rules"
    description: "Lists StateExpiryRules; filterable by owning program and state code."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "state_code?", "expiry_permitted?", "limit?", "offset?"]
    output: StateExpiryRule[]
    side_effects: []
  - method: GET
    path: "/state-expiry-rules/{id}"
    description: "Reads one StateExpiryRule."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: StateExpiryRule
    side_effects: []

  # --- Cohort -----------------------------------------------------------------
  - method: POST
    path: "/cohorts"
    description: "Creates an enrolment Cohort carrying the historical redemption pattern used by `estimated_redemption_rate`."
    roles: [ProgramAdmin, LoyaltyAccountant]
    code: 201
    input: ["program_id", "cohort_code", "enrollment_start_date", "enrollment_end_date", "observed_redemption_rate_bp", "sample_size", "program_change_adjustment_bp?"]
    output: Cohort
    side_effects: []
  - method: GET
    path: "/cohorts"
    description: "Lists Cohorts; filterable by owning program and cohort code."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "cohort_code?", "limit?", "offset?"]
    output: Cohort[]
    side_effects: []
  - method: GET
    path: "/cohorts/{id}"
    description: "Reads one Cohort, including `program_change_adjustment_bp` as mutated by applied ProgramChangeOrders."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: Cohort
    side_effects: []

  # --- Member -----------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Enrols a Member into a Cohort of a program, in status ACTIVE."
    roles: [ProgramAdmin, LoyaltyAccountant]
    code: 201
    input: ["program_id", "cohort_id", "external_member_ref", "state_code", "tier"]
    output: Member
    side_effects:
      - "sets Member.status = ACTIVE, enrolled_at = clock_now, last_activity_at = clock_now"
  - method: GET
    path: "/members"
    description: "Lists Members; filterable by owning program, cohort and status."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "cohort_id?", "status?", "state_code?", "tier?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: "/members/{id}"
    description: "Reads one Member, including the derived-on-read `dormancy_days`, `point_balance` and `outstanding_gross_ssp_cents`. Role Member may read only its own record."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- AccountingPeriod -------------------------------------------------------
  - method: POST
    path: "/accounting-periods"
    description: "Opens a new AccountingPeriod over the HALF-OPEN window [start_at, end_at). Adjacent windows are allowed; overlapping windows are rejected."
    roles: [Controller]
    code: 201
    input: ["program_id", "period_code", "start_at", "end_at"]
    output: AccountingPeriod
    side_effects:
      - "sets AccountingPeriod.state = OPEN, reopen_count = 0, and all eleven cents/bp rollforward fields to 0"
  - method: GET
    path: "/accounting-periods"
    description: "Lists AccountingPeriods; filterable by owning program and state."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "state?", "period_code?", "limit?", "offset?"]
    output: AccountingPeriod[]
    side_effects: []
  - method: GET
    path: "/accounting-periods/{id}"
    description: "Reads one AccountingPeriod with all eleven persisted rollforward figures."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: []
  - method: GET
    path: "/accounting-periods/{id}/liability-rollforward"
    description: "Computed read: re-runs `period_close_rollforward` STEPS 1-8 against current data WITHOUT persisting anything, so an auditor can preview a close. Returns the rollforward figures plus the outstanding gross SSP the required balance was measured on."
    roles: [LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: "{ opening_liability_cents: integer, issuance_deferred_cents: integer, redemption_recognized_cents: integer, remeasurement_delta_cents: integer, expiry_released_cents: integer, pre_catchup_liability_cents: integer, outstanding_gross_ssp_cents: integer, required_liability_cents: integer, catch_up_adjustment_cents: integer, closing_liability_cents: integer, breakage_recognized_cents: integer, approved_estimate_rate_bp: integer }"
    side_effects: []
  - method: POST
    path: "/accounting-periods/{id}/soft-close"
    description: "Drives AccountingPeriod OPEN -> SOFT_CLOSED, running and persisting `period_close_rollforward`."
    roles: [Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects:
      - "runs `period_close_rollforward` STEPS 1-8 and persists opening_liability_cents, pre_catchup_liability_cents, required_liability_cents, catch_up_adjustment_cents, closing_liability_cents, breakage_recognized_cents, approved_estimate_rate_bp"
      - "sets AccountingPeriod.soft_closed_at = clock_now"
      - "increments AccountingPeriod.version by 1"
  - method: POST
    path: "/accounting-periods/{id}/reopen"
    description: "Drives AccountingPeriod SOFT_CLOSED -> OPEN, fully compensating the soft-close so LoyaltyProgram.recognized_breakage_ytd_cents returns to its exact pre-close value. At most two reopens."
    roles: [Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects:
      - "resets opening_liability_cents, pre_catchup_liability_cents, required_liability_cents, catch_up_adjustment_cents, breakage_recognized_cents, closing_liability_cents and approved_estimate_rate_bp to 0"
      - "sets AccountingPeriod.soft_closed_at = null"
      - "increments AccountingPeriod.reopen_count by 1"
      - "increments AccountingPeriod.version by 1"
  - method: POST
    path: "/accounting-periods/{id}/hard-close"
    description: "Drives AccountingPeriod SOFT_CLOSED -> HARD_CLOSED (terminal). Requires a non-empty actuarial memorandum on the approved estimate and every statement of the period settled."
    roles: [Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects:
      - "increments AccountingPeriod.version by 1"
  - method: POST
    path: "/accounting-periods/{id}/expiry-sweep"
    description: "Runs `lot_expiry_and_escheat_measurement` over the whole program, booking expiry releases and escheat accruals into THIS period and latching the program's escheat-disclosure flag."
    roles: [LoyaltyAccountant]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects:
      - "drives eligible PointLots OUTSTANDING/PARTIALLY_REDEEMED -> EXPIRED and, where the state rule requires escheatment, EXPIRED -> ESCHEATED"
      - "adds each expired lot's pre-zeroing `remaining_deferred_cents` to AccountingPeriod.expiry_released_cents"
      - "adds each escheated lot's `escheated_cents` to AccountingPeriod.escheat_accrual_cents and to LoyaltyProgram.total_escheat_accrual_cents"
      - "latches LoyaltyProgram.escheat_disclosure_required = true once the program accrual reaches escheat_disclosure_threshold_cents"
      - "drives eligible Members ACTIVE -> DORMANT"
      - "increments LoyaltyProgram.version by 1"
      - "increments AccountingPeriod.version by 1"

  # --- PartnerAgreement -------------------------------------------------------
  - method: POST
    path: "/partner-agreements"
    description: "Registers a partner issuance/redemption agreement over the CLOSED window [effective_start_date, effective_end_date], in status ACTIVE."
    roles: [ProgramAdmin]
    code: 201
    input: ["program_id", "partner_code", "relationship_type", "issuance_rate_millicents_per_point", "redemption_rate_millicents_per_point", "settlement_lag_days", "net_settlement_enabled", "min_invoice_cents", "effective_start_date", "effective_end_date"]
    output: PartnerAgreement
    side_effects:
      - "sets PartnerAgreement.status = ACTIVE, deferred_below_minimum_cents = 0, outstanding_settlement_cents = 0"
  - method: GET
    path: "/partner-agreements"
    description: "Lists PartnerAgreements; filterable by owning program, partner code and status."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "partner_code?", "status?", "relationship_type?", "limit?", "offset?"]
    output: PartnerAgreement[]
    side_effects: []
  - method: GET
    path: "/partner-agreements/{id}"
    description: "Reads one PartnerAgreement. Role PartnerOperator may read only the agreement it acts as."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller, PartnerOperator]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects: []
  - method: POST
    path: "/partner-agreements/{id}/terminate"
    description: "Drives PartnerAgreement ACTIVE or SUSPENDED -> TERMINATED (terminal). Requires `outstanding_settlement_cents == 0`."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects:
      - "increments PartnerAgreement.version by 1"

  # --- PointLot ---------------------------------------------------------------
  - method: POST
    path: "/point-lots"
    description: "Issues a PointLot, running `point_issuance_measurement`. Born with lifecycle_state OUTSTANDING and settlement_state PENDING_SETTLEMENT when `partner_agreement_id` is supplied, NOT_APPLICABLE otherwise."
    roles: [LoyaltyAccountant]
    code: 201
    input: ["member_id", "period_id", "partner_agreement_id?", "base_points", "promo_multiplier_bp?"]
    output: PointLot
    side_effects:
      - "runs `point_issuance_measurement` and persists tier_points, points_issued, points_remaining, gross_ssp_cents, breakage_reserve_cents, deferred_revenue_cents, tier_benefit_expense_cents, promo_expense_cents, expires_at and the three at-issue snapshots"
      - "adds PointLot.deferred_revenue_cents to AccountingPeriod.issuance_deferred_cents"
      - "sets Member.last_activity_at = clock_now and drives Member DORMANT -> ACTIVE when applicable"
      - "increments PartnerAgreement.version by 1 when `partner_agreement_id` is supplied"
  - method: GET
    path: "/point-lots"
    description: "Lists PointLots; filterable by owning member, booking period, partner agreement and either state dimension."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["member_id?", "period_id?", "partner_agreement_id?", "lifecycle_state?", "settlement_state?", "limit?", "offset?"]
    output: PointLot[]
    side_effects: []
  - method: GET
    path: "/point-lots/{id}"
    description: "Reads one PointLot, including the derived-on-read `remaining_gross_ssp_cents` and `remaining_deferred_cents`. Role Member may read only its own lots."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller, Member]
    code: 200
    input: []
    output: PointLot
    side_effects: []
  - method: GET
    path: "/point-lots/{id}/allocations"
    description: "Sub-resource read: the append-only RedemptionAllocation ledger rows that consumed or restored this lot, in allocation_seq ASC then created_at ASC order."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: RedemptionAllocation[]
    side_effects: []

  # --- RedemptionEvent --------------------------------------------------------
  - method: POST
    path: "/redemption-events"
    description: "Requests a redemption of `points_requested` points for a member, in state REQUESTED. No revenue is released until the event is allocated."
    roles: [LoyaltyAccountant, Member]
    code: 201
    input: ["member_id", "period_id", "partner_agreement_id?", "points_requested", "redemption_type"]
    output: RedemptionEvent
    side_effects:
      - "sets RedemptionEvent.state = REQUESTED, requested_at = clock_now, and the four cents figures to 0"
  - method: GET
    path: "/redemption-events"
    description: "Lists RedemptionEvents; filterable by owning member, booking period, partner agreement and state."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["member_id?", "period_id?", "partner_agreement_id?", "state?", "redemption_type?", "limit?", "offset?"]
    output: RedemptionEvent[]
    side_effects: []
  - method: GET
    path: "/redemption-events/{id}"
    description: "Reads one RedemptionEvent. Role Member may read only its own events."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller, Member]
    code: 200
    input: []
    output: RedemptionEvent
    side_effects: []
  - method: GET
    path: "/redemption-events/{id}/allocations"
    description: "Sub-resource read: this event's append-only RedemptionAllocation ledger rows in allocation_seq ASC then created_at ASC order. ALLOCATION rows carry positive amounts; REVERSAL rows carry the negated amounts."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: RedemptionAllocation[]
    side_effects: []
  - method: POST
    path: "/redemption-events/{id}/allocate"
    description: "Drives RedemptionEvent REQUESTED -> ALLOCATED, consuming lots FIFO and running `redemption_revenue_release` variant `provisional_at_allocation`."
    roles: [LoyaltyAccountant]
    code: 200
    input: []
    output: RedemptionEvent
    side_effects:
      - "walks the member's lots in issued_at ASC then created_at ASC order and appends one ALLOCATION RedemptionAllocation row per consumed lot with allocation_seq 1..N"
      - "decrements each consumed PointLot.points_remaining and drives its lifecycle_state to PARTIALLY_REDEEMED or FULLY_REDEEMED"
      - "sets RedemptionEvent.provisional_release_cents, partner_cost_cents and allocated_at"
      - "adds RedemptionEvent.provisional_release_cents to AccountingPeriod.redemption_recognized_cents"
      - "increments PartnerAgreement.version by 1 when the event carries a partner_agreement_id"
      - "increments RedemptionEvent.version by 1"
  - method: POST
    path: "/redemption-events/{id}/fulfill"
    description: "Drives RedemptionEvent ALLOCATED -> FULFILLED, running `redemption_revenue_release` variant `final_at_fulfillment` and booking the re-measurement delta."
    roles: [LoyaltyAccountant]
    code: 200
    input: []
    output: RedemptionEvent
    side_effects:
      - "writes RedemptionAllocation.final_release_cents on every ALLOCATION row of the event"
      - "sets RedemptionEvent.final_release_cents and remeasurement_delta_cents"
      - "adds RedemptionEvent.remeasurement_delta_cents to AccountingPeriod.remeasurement_delta_cents"
      - "increments RedemptionEvent.version by 1"
  - method: POST
    path: "/redemption-events/{id}/reverse"
    description: "Drives RedemptionEvent ALLOCATED or FULFILLED -> REVERSED (terminal), fully compensating every ledger effect with negated REVERSAL rows."
    roles: [LoyaltyAccountant]
    code: 200
    input: ["reversal_reason"]
    output: RedemptionEvent
    side_effects:
      - "appends one REVERSAL RedemptionAllocation row per ALLOCATION row, in ascending allocation_seq order, with points and cents negated"
      - "restores each consumed PointLot.points_remaining and drives its lifecycle_state back to PARTIALLY_REDEEMED or OUTSTANDING"
      - "subtracts RedemptionEvent.provisional_release_cents from AccountingPeriod.redemption_recognized_cents"
      - "subtracts RedemptionEvent.remeasurement_delta_cents from AccountingPeriod.remeasurement_delta_cents"
      - "sets RedemptionEvent.reversal_reason"
      - "increments RedemptionEvent.version by 1"

  # --- BreakageEstimate -------------------------------------------------------
  - method: POST
    path: "/programs/{id}/breakage-estimates"
    description: "Creates a DRAFT BreakageEstimate for one AccountingPeriod of the program in the path, running `estimated_redemption_rate` and freezing the outstanding-points snapshot. Supplying `cohort_id` forces the SINGLE_COHORT variant."
    roles: [LoyaltyAccountant]
    code: 201
    input: ["period_id", "cohort_id?", "memo_narrative", "sensitivity_low_bp", "sensitivity_high_bp"]
    output: BreakageEstimate
    side_effects:
      - "runs `estimated_redemption_rate` and persists method_applied, estimated_redemption_rate_bp, breakage_rate_bp, outstanding_points_at_estimate, outstanding_gross_ssp_cents_at_estimate and required_liability_cents"
      - "sets BreakageEstimate.state = DRAFT, prepared_by_user_id = X-User-ID, revision_count = 0"
  - method: GET
    path: "/breakage-estimates"
    description: "Lists BreakageEstimates; filterable by owning program, period, cohort, the estimate they superseded, and state."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "period_id?", "cohort_id?", "supersedes_estimate_id?", "state?", "method_applied?", "limit?", "offset?"]
    output: BreakageEstimate[]
    side_effects: []
  - method: GET
    path: "/breakage-estimates/{id}"
    description: "Reads one BreakageEstimate, including the frozen measurement snapshot and the actuarial memorandum."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: BreakageEstimate
    side_effects: []
  - method: GET
    path: "/breakage-estimates/{id}/sensitivity"
    description: "Computed read for audit support: runs `breakage_sensitivity_bands` over the estimate's frozen snapshot and returns the low/base/high required-liability band with the memorandum narrative."
    roles: [LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: "{ outstanding_gross_ssp_cents: integer, low_bp: integer, base_bp: integer, high_bp: integer, low_required_liability_cents: integer, base_required_liability_cents: integer, high_required_liability_cents: integer, band_range_cents: integer, memo_narrative: string }"
    side_effects: []
  - method: POST
    path: "/breakage-estimates/{id}/submit"
    description: "Drives BreakageEstimate DRAFT -> SUBMITTED, or REJECTED -> SUBMITTED (bounded revision cycle, at most two revisions). The measured rate is never re-computed."
    roles: [LoyaltyAccountant]
    code: 200
    input: []
    output: BreakageEstimate
    side_effects:
      - "sets BreakageEstimate.submitted_at = clock_now"
      - "increments BreakageEstimate.revision_count by 1 on the REJECTED -> SUBMITTED path only"
      - "increments BreakageEstimate.version by 1"
  - method: POST
    path: "/breakage-estimates/{id}/reject"
    description: "Drives BreakageEstimate SUBMITTED -> REJECTED with a reason."
    roles: [Controller]
    code: 200
    input: ["rejection_reason"]
    output: BreakageEstimate
    side_effects:
      - "sets BreakageEstimate.rejection_reason"
      - "increments BreakageEstimate.version by 1"
  - method: POST
    path: "/breakage-estimates/{id}/approve"
    description: "Drives BreakageEstimate SUBMITTED -> APPROVED under OCC on the parent LoyaltyProgram and under segregation of duties. Installs the new breakage rate on the program and supersedes the reigning estimate."
    roles: [Controller]
    code: 200
    input: ["expected_program_version"]
    output: BreakageEstimate
    side_effects:
      - "sets BreakageEstimate.approved_by_user_id = X-User-ID and approved_at = clock_now"
      - "sets LoyaltyProgram.current_breakage_rate_bp = this estimate's breakage_rate_bp"
      - "increments `LoyaltyProgram.version` by 1"
      - "drives the program's reigning APPROVED BreakageEstimate to SUPERSEDED and records its id in this estimate's supersedes_estimate_id"
      - "FORCE-REOPENS the superseded estimate's AccountingPeriod when that period is SOFT_CLOSED — resets its seven rollforward figures and approved_estimate_rate_bp to 0, nulls soft_closed_at, increments its reopen_count and version; a HARD_CLOSED or already-OPEN period is untouched"
      - "increments BreakageEstimate.version by 1"

  # --- SettlementStatement ----------------------------------------------------
  - method: POST
    path: "/settlement-statements"
    description: "Creates a DRAFT SettlementStatement for one (PartnerAgreement, AccountingPeriod) pair under OCC on the parent PartnerAgreement, running `partner_settlement_net`. Any existing DRAFT statement for the same pair is superseded."
    roles: [LoyaltyAccountant]
    code: 201
    input: ["partner_agreement_id", "period_id", "expected_partner_agreement_version"]
    output: SettlementStatement
    side_effects:
      - "runs `partner_settlement_net` and persists settlement_basis, partner_issued_points, partner_redeemed_points, issuance_receivable_cents, redemption_payable_cents, carried_forward_cents, net_due_cents, deferred_below_minimum_cents and due_date"
      - "copies SettlementStatement.deferred_below_minimum_cents onto PartnerAgreement.deferred_below_minimum_cents"
      - "drives any existing DRAFT statement for the same (partner_agreement_id, period_id) to SUPERSEDED"
      - "increments `PartnerAgreement.version` by 1"
  - method: GET
    path: "/settlement-statements"
    description: "Lists SettlementStatements; filterable by partner agreement, period and state. Role PartnerOperator sees only its own agreement's statements."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller, PartnerOperator]
    code: 200
    input: ["partner_agreement_id?", "period_id?", "state?", "settlement_basis?", "limit?", "offset?"]
    output: SettlementStatement[]
    side_effects: []
  - method: GET
    path: "/settlement-statements/{id}"
    description: "Reads one SettlementStatement. Role PartnerOperator may read only its own agreement's statements."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller, PartnerOperator]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []
  - method: POST
    path: "/settlement-statements/{id}/issue"
    description: "Drives SettlementStatement DRAFT -> ISSUED, booking the net due onto the agreement's outstanding balance."
    roles: [LoyaltyAccountant]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "sets SettlementStatement.issued_at = clock_now"
      - "adds SettlementStatement.net_due_cents to PartnerAgreement.outstanding_settlement_cents"
      - "increments PartnerAgreement.version by 1"
      - "increments SettlementStatement.version by 1"
  - method: POST
    path: "/settlement-statements/{id}/dispute"
    description: "Drives SettlementStatement ISSUED -> DISPUTED. Only the PartnerOperator acting as the statement's own agreement may dispute, at most twice."
    roles: [PartnerOperator]
    code: 200
    input: ["dispute_reason"]
    output: SettlementStatement
    side_effects:
      - "sets SettlementStatement.dispute_reason"
      - "increments SettlementStatement.dispute_count by 1"
      - "increments SettlementStatement.version by 1"
  - method: POST
    path: "/settlement-statements/{id}/resolve"
    description: "Drives SettlementStatement DISPUTED -> ISSUED with a resolution note. `net_due_cents` is never re-measured."
    roles: [LoyaltyAccountant]
    code: 200
    input: ["resolution_note"]
    output: SettlementStatement
    side_effects:
      - "sets SettlementStatement.resolution_note and issued_at = clock_now"
      - "increments SettlementStatement.version by 1"
  - method: POST
    path: "/settlement-statements/{id}/pay"
    description: "Drives SettlementStatement ISSUED -> PAID (terminal), clearing the agreement balance and settling every partner lot of the pair."
    roles: [Controller]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "sets SettlementStatement.paid_at = clock_now"
      - "subtracts SettlementStatement.net_due_cents from PartnerAgreement.outstanding_settlement_cents"
      - "drives every PointLot of the same (partner_agreement_id, period_id) with settlement_state PENDING_SETTLEMENT to SETTLED, in PointLot.created_at ASC order"
      - "increments PartnerAgreement.version by 1"
      - "increments SettlementStatement.version by 1"
  - method: POST
    path: "/settlement-statements/{id}/write-off"
    description: "Drives SettlementStatement ISSUED or DISPUTED -> WRITTEN_OFF, writing off the partner lots and suspending the agreement."
    roles: [Controller]
    code: 200
    input: ["write_off_reason"]
    output: SettlementStatement
    side_effects:
      - "sets SettlementStatement.write_off_reason"
      - "subtracts SettlementStatement.net_due_cents from PartnerAgreement.outstanding_settlement_cents"
      - "drives every PointLot of the same (partner_agreement_id, period_id) with settlement_state PENDING_SETTLEMENT to WRITTEN_OFF, in PointLot.created_at ASC order"
      - "drives PartnerAgreement ACTIVE -> SUSPENDED"
      - "increments PartnerAgreement.version by 1"
      - "increments SettlementStatement.version by 1"

  # --- ProgramChangeOrder -----------------------------------------------------
  - method: POST
    path: "/program-change-orders"
    description: "Models a proposed program change in state MODELED, running `program_change_liability_projection`. Nothing on the program is mutated until the order is applied."
    roles: [ProgramAdmin]
    code: 201
    input: ["program_id", "change_type", "new_point_expiry_days?", "new_ssp_millicents_per_point?", "new_tier_multiplier_bp?", "behavior_elasticity_bp", "effective_at"]
    output: ProgramChangeOrder
    side_effects:
      - "runs `program_change_liability_projection` and persists baseline_redemption_rate_bp, projected_redemption_rate_bp, baseline_outstanding_gross_ssp_cents, projected_outstanding_gross_ssp_cents and projected_liability_delta_cents"
      - "sets ProgramChangeOrder.state = MODELED"
  - method: GET
    path: "/program-change-orders"
    description: "Lists ProgramChangeOrders; filterable by owning program, change type, state and the order that cancelled them."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: ["program_id?", "change_type?", "state?", "cancelled_by_order_id?", "limit?", "offset?"]
    output: ProgramChangeOrder[]
    side_effects: []
  - method: GET
    path: "/program-change-orders/{id}"
    description: "Reads one ProgramChangeOrder, including the frozen liability projection."
    roles: [ProgramAdmin, LoyaltyAccountant, Controller]
    code: 200
    input: []
    output: ProgramChangeOrder
    side_effects: []
  - method: POST
    path: "/program-change-orders/{id}/approve"
    description: "Drives ProgramChangeOrder MODELED -> APPROVED and cancels every competing MODELED order of the same program and change_type."
    roles: [Controller]
    code: 200
    input: []
    output: ProgramChangeOrder
    side_effects:
      - "drives every other MODELED ProgramChangeOrder of the same program and change_type to CANCELLED with cancelled_by_order_id set to this order's id, in created_at ASC order"
      - "increments ProgramChangeOrder.version by 1"
  - method: POST
    path: "/program-change-orders/{id}/apply"
    description: "Drives ProgramChangeOrder APPROVED -> EFFECTIVE (terminal), writing the change onto the program and cascading to outstanding lots and cohort adjustments."
    roles: [Controller]
    code: 200
    input: []
    output: ProgramChangeOrder
    side_effects:
      - "writes the order's new_* value onto LoyaltyProgram and increments LoyaltyProgram.version by 1"
      - "on EXPIRY_DAYS_CHANGE only: recomputes expires_at on every OUTSTANDING/PARTIALLY_REDEEMED PointLot of the program as issued_at + the new point_expiry_days days, in created_at ASC order, bumping each lot's version by 1"
      - "increases every Cohort of the program's program_change_adjustment_bp by behavior_elasticity_bp clamped into [-5000, 5000], in enrollment_start_date ASC then created_at ASC order, bumping each cohort's version by 1"
      - "sets ProgramChangeOrder.applied_at = clock_now"
      - "increments ProgramChangeOrder.version by 1"

# =============================================================================
# §1.6 Error Code Catalog (49 codes; every code is triggerable by at least one
# §1.5 endpoint and appears in a §1.4 rule)
# =============================================================================
errors:

  # --- Authentication / authorization -----------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "`X-User-Role` or `X-User-ID` absent or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "`X-User-Role` is not one of ProgramAdmin, LoyaltyAccountant, Controller, PartnerOperator, Member."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's §1.5 `roles:`."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role addressed a resource it does not own: role Member whose `X-User-ID` is not the addressed Member/PointLot/RedemptionEvent's `member_id`, or role PartnerOperator whose `X-User-ID` is not the addressed statement's `partner_agreement_id`."

  # --- Request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required input field, value outside its declared range/enum, or pagination `limit` outside 1..100 / `offset` negative."

  # --- Not found (path segments and body foreign keys) ------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No LoyaltyProgram with the given id."
  - id: ERR_STATE_EXPIRY_RULE_NOT_FOUND
    http: 404
    condition: "No StateExpiryRule with the given id."
  - id: ERR_COHORT_NOT_FOUND
    http: 404
    condition: "No Cohort with the given id."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No Member with the given id."
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "No AccountingPeriod with the given id."
  - id: ERR_PARTNER_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No PartnerAgreement with the given id."
  - id: ERR_POINT_LOT_NOT_FOUND
    http: 404
    condition: "No PointLot with the given id."
  - id: ERR_REDEMPTION_EVENT_NOT_FOUND
    http: 404
    condition: "No RedemptionEvent with the given id."
  - id: ERR_BREAKAGE_ESTIMATE_NOT_FOUND
    http: 404
    condition: "No BreakageEstimate with the given id."
  - id: ERR_SETTLEMENT_STATEMENT_NOT_FOUND
    http: 404
    condition: "No SettlementStatement with the given id."
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "No ProgramChangeOrder with the given id."

  # --- Optimistic concurrency (§1.2.1) ---------------------------------------
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "`expected_program_version` on POST /breakage-estimates/{id}/approve does not equal the current `LoyaltyProgram.version`."
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "`expected_partner_agreement_version` on POST /settlement-statements does not equal the current `PartnerAgreement.version`."

  # --- State preconditions ----------------------------------------------------
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "The addressed AccountingPeriod is not in state OPEN."
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "The owning LoyaltyProgram is not in status ACTIVE."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The addressed entity's current state is not a declared `from:` state for the requested §1.2 transition (includes every attempt to leave a terminal state and every repeat of an already-performed action)."
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The addressed PartnerAgreement is SUSPENDED or TERMINATED where ACTIVE is required."
  - id: ERR_PERIOD_HARD_CLOSED
    http: 409
    condition: "A mutation was attempted against a HARD_CLOSED AccountingPeriod or one of its children."

  # --- Business safety / compliance -------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The approving `X-User-ID` equals `BreakageEstimate.prepared_by_user_id`."
  - id: ERR_MEMO_NARRATIVE_REQUIRED
    http: 409
    condition: "Hard-close attempted while the period's APPROVED BreakageEstimate carries an empty `memo_narrative` (no actuarial memorandum on file)."
  - id: ERR_ESTIMATE_NOT_APPROVED
    http: 409
    condition: "No APPROVED BreakageEstimate exists for the AccountingPeriod being soft-closed, or for the period of the RedemptionEvent being fulfilled."
  - id: ERR_UNALLOCATED_REDEMPTIONS
    http: 409
    condition: "Soft-close attempted while at least one RedemptionEvent of the period is still in state REQUESTED."

  # --- Business temporal ------------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 409
    condition: "`start_at >= end_at` on an AccountingPeriod, or `effective_start_date >= effective_end_date` on a PartnerAgreement."
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "The proposed half-open AccountingPeriod window [start_at, end_at) overlaps an existing period of the same program. Windows that merely touch (new.start_at == existing.end_at) do NOT trigger this."
  - id: ERR_PARTNER_WINDOW_CONFLICT
    http: 409
    condition: "The proposed PartnerAgreement window begins on or before a prior non-TERMINATED agreement with the same `partner_code`'s `effective_end_date + settlement_lag_days` days."
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "Soft-close attempted while `clock_now < AccountingPeriod.end_at`."
  - id: ERR_CHANGE_NOT_YET_EFFECTIVE
    http: 409
    condition: "Apply attempted while `clock_now < ProgramChangeOrder.effective_at`."

  # --- Business referential coherence ----------------------------------------
  - id: ERR_PERIOD_PROGRAM_MISMATCH
    http: 409
    condition: "The AccountingPeriod named in the body belongs to a different LoyaltyProgram than the Member / PartnerAgreement / program-in-path it is paired with."
  - id: ERR_COHORT_PROGRAM_MISMATCH
    http: 409
    condition: "The Cohort named in the body belongs to a different LoyaltyProgram than the Member being enrolled or the program in the path."
  - id: ERR_AGREEMENT_PROGRAM_MISMATCH
    http: 409
    condition: "The PartnerAgreement named in the body belongs to a different LoyaltyProgram than the Member or AccountingPeriod it is paired with."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "`period_code`, `cohort_code`, `state_code` (on StateExpiryRule) or `external_member_ref` is already used within the same LoyaltyProgram."
  - id: ERR_TIER_MULTIPLIER_KEYS_INVALID
    http: 409
    condition: "`tier_multiplier_bp` / `new_tier_multiplier_bp` does not declare exactly the four keys BASE, SILVER, GOLD, PLATINUM."

  # --- Business constraints (bounded cycles, bands, settlement) --------------
  - id: ERR_UNSETTLED_STATEMENTS
    http: 409
    condition: "Hard-close attempted while a SettlementStatement of the period is still in state DRAFT, ISSUED or DISPUTED."
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "Resubmission of a REJECTED BreakageEstimate whose `revision_count` has already reached 2."
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http: 409
    condition: "Reopen attempted on an AccountingPeriod whose `reopen_count` has already reached 2."
  - id: ERR_DISPUTE_LIMIT_EXCEEDED
    http: 409
    condition: "Dispute attempted on a SettlementStatement whose `dispute_count` has already reached 2."
  - id: ERR_SENSITIVITY_BAND_INVALID
    http: 409
    condition: "The supplied sensitivity band does not straddle the measured rate: `sensitivity_low_bp > estimated_redemption_rate_bp` or `sensitivity_high_bp < estimated_redemption_rate_bp`."
  - id: ERR_PROMO_MULTIPLIER_ABOVE_CAP
    http: 409
    condition: "`promo_multiplier_bp` on a PointLot exceeds `program.promo_multiplier_cap_bp`."
  - id: ERR_OUTSTANDING_SETTLEMENT
    http: 409
    condition: "Termination attempted while `PartnerAgreement.outstanding_settlement_cents != 0`."
  - id: ERR_PERIODS_NOT_CLOSED
    http: 409
    condition: "Program close attempted while at least one AccountingPeriod of the program is not HARD_CLOSED."

  # --- Business fiscal / capacity --------------------------------------------
  - id: ERR_ISSUANCE_CAP_EXCEEDED
    http: 409
    condition: "The computed `points_issued` strictly exceeds `program.per_issuance_point_cap`. A value exactly equal to the cap is accepted."
  - id: ERR_INSUFFICIENT_POINT_BALANCE
    http: 409
    condition: "Allocation attempted when the member's outstanding points are strictly fewer than `RedemptionEvent.points_requested`."
  - id: ERR_NO_OUTSTANDING_POINTS
    http: 409
    condition: "Breakage-estimate creation attempted when no cohort in scope carries any outstanding points, so the weighted-mean denominator would be zero."
  - id: ERR_PROGRAM_CONFIG_INCOMPLETE
    http: 409
    condition: "First activation attempted while the program has no StateExpiryRule or no Cohort."

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
# The preparer of a BreakageEstimate may never be its approver, independent of
# role: even two distinct Controllers are fine, but one user acting as both
# preparer and approver is rejected with ERR_SEGREGATION_OF_DUTIES.
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Configures the loyalty program: expiry rules by state, cohorts, partner agreements, and program change orders. Never touches the ledger."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/activate"
      - "POST /programs/{id}/suspend"
      - "POST /programs/{id}/close"
      - "POST /state-expiry-rules"
      - "POST /partner-agreements"
      - "POST /partner-agreements/{id}/terminate"
      - "POST /program-change-orders"
    shared_operations:
      - "POST /cohorts (with LoyaltyAccountant)"
      - "POST /members (with LoyaltyAccountant)"
      - "POST /_clock/set_current_utc (with LoyaltyAccountant, Controller)"
      - "every GET list and single-resource read except GET /accounting-periods/{id}/liability-rollforward and GET /breakage-estimates/{id}/sensitivity"

  - name: LoyaltyAccountant
    description: "Prepares the ledger: issues point lots, allocates and fulfils redemptions, prepares breakage estimates, and prepares/issues/resolves partner settlement statements. May never approve its own estimate."
    identity: opaque
    exclusive_operations:
      - "POST /point-lots"
      - "POST /redemption-events/{id}/allocate"
      - "POST /redemption-events/{id}/fulfill"
      - "POST /redemption-events/{id}/reverse"
      - "POST /accounting-periods/{id}/expiry-sweep"
      - "POST /programs/{id}/breakage-estimates"
      - "POST /breakage-estimates/{id}/submit"
      - "POST /settlement-statements"
      - "POST /settlement-statements/{id}/issue"
      - "POST /settlement-statements/{id}/resolve"
    shared_operations:
      - "POST /cohorts (with ProgramAdmin)"
      - "POST /members (with ProgramAdmin)"
      - "POST /redemption-events (with Member)"
      - "POST /_clock/set_current_utc (with ProgramAdmin, Controller)"
      - "GET /accounting-periods/{id}/liability-rollforward (with Controller)"
      - "GET /breakage-estimates/{id}/sensitivity (with Controller)"
      - "every other GET list and single-resource read"

  - name: Controller
    description: "Approves and closes: approves or rejects breakage estimates, opens/soft-closes/reopens/hard-closes accounting periods, pays or writes off settlement statements, and approves/applies program change orders."
    identity: opaque
    exclusive_operations:
      - "POST /accounting-periods"
      - "POST /accounting-periods/{id}/soft-close"
      - "POST /accounting-periods/{id}/reopen"
      - "POST /accounting-periods/{id}/hard-close"
      - "POST /breakage-estimates/{id}/reject"
      - "POST /breakage-estimates/{id}/approve"
      - "POST /settlement-statements/{id}/pay"
      - "POST /settlement-statements/{id}/write-off"
      - "POST /program-change-orders/{id}/approve"
      - "POST /program-change-orders/{id}/apply"
    shared_operations:
      - "POST /_clock/set_current_utc (with ProgramAdmin, LoyaltyAccountant)"
      - "GET /accounting-periods/{id}/liability-rollforward (with LoyaltyAccountant)"
      - "GET /breakage-estimates/{id}/sensitivity (with LoyaltyAccountant)"
      - "every GET list and single-resource read"

  - name: PartnerOperator
    description: "A third-party or intercompany partner acting on its own PartnerAgreement. May read and dispute only its own settlement statements."
    identity: "entity_backed:PartnerAgreement"
    exclusive_operations:
      - "POST /settlement-statements/{id}/dispute"
    shared_operations:
      - "GET /partner-agreements/{id} (own agreement only)"
      - "GET /settlement-statements (own agreement only)"
      - "GET /settlement-statements/{id} (own agreement only)"

  - name: Member
    description: "A loyalty program member acting on its own account. May request a redemption and read its own account, lots and events; never allocates, fulfils or measures anything."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /redemption-events (with LoyaltyAccountant; own member_id only)"
      - "GET /members/{id} (own record only)"
      - "GET /point-lots/{id} (own lots only)"
      - "GET /redemption-events/{id} (own events only)"
