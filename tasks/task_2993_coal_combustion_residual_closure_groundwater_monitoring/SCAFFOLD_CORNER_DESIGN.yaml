  - section: state_machines
    instances:
      - name: zero_result_event_validate_flips_to_rejection_then_reopen_restores_draft
        claim_type: valid_transition
        grounds:
          - state_machines.SamplingEvent.DRAFT_to_REJECTED
          - state_machines.SamplingEvent.REJECTED_to_DRAFT
          - calculations.next_sampling_due_date
        distinguishing_aspect: |
          The same endpoint drives two different transitions out of DRAFT depending on result_count, and
          the empty round must land in REJECTED with rejection_reason NO_RESULTS rather than in VALIDATED
          or in an error. Reopen then clears both rejection_reason and validated_on, and neither
          transition may touch the program's last_validated_event_id, which stays null throughout.
        test_recipe:
          setup:
            - "One clean unit with a certified network and one DRAFT sampling event that carries no results"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
