# =============================================================================
# Task 0955 — Baby-Gear & Equipment Travel Rental
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 23 instances
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: quote_provisional_vs_final_after_extension
        grounds:
          - calculations.provisional_quote
          - calculations.extension_charge
          - state_machines.Reservation.RETURNED_to_SETTLED
        distinguishing_aspect: |
          Entity domain = Reservation pricing. The provisional variant (planned dates)
          and the final variant (settlement) produce different totals for the same
          reservation once an extension is approved: quoted 13000 vs final 20200.
        test_recipe:
          setup:
            - "Customer C, catalog CRIB (rate 3000/day, deposit 15000, 12.0kg, turnaround 24h, deep every 3), one grade-A unit"
            - "Reservation 2026-06-10 -> 2026-06-13 (3 days), CONFIRMED, DELIVERED, extended by 2 days to 2026-06-15, returned on time"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ann Lee", email: "ann@x.com", phone: "111" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib A", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "1 Beach Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "1 Beach Rd", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservations/${res}", payload: {}, as: OperationsAdmin, captures: { res_v: $.data.version } }
            - { call: "POST /reservations/${res}/extensions", payload: { requested_end_date: "2026-06-15", expected_reservation_version: "${res_v}" }, as: Customer, as_user_id: "${cust}", captures: { ext: $.data.id } }
            - { call: "POST /extensions/${ext}/approve", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-15", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "1 Beach Rd", time_window_start: "2026-06-15T00:00:00Z", time_window_end: "2026-06-15T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
          trigger:
            - { call: "POST /reservations/${res}/settle", payload: {}, as: OperationsAdmin }
          assert:
            - "Reservation.${res}.quoted_total_cents == 13000"
            - "Reservation.${res}.extension_charge_cents == 7200"
            - "Reservation.${res}.late_fee_cents == 0"
            - "Reservation.${res}.final_total_cents == 20200"
            - "Reservation.${res}.final_total_cents != Reservation.${res}.quoted_total_cents"

      - name: insurance_premium_per_day_vs_percent_of_rental
        grounds:
          - calculations.insurance_premium
          - entities.InsurancePlan.fields.pricing_model
        distinguishing_aspect: |
          Entity domain = InsurancePlan (different from Reservation pricing). Same trip
          data (3 days, gear subtotal 9000): PER_DAY plan yields 600 premium (total 13600),
          PERCENT_OF_RENTAL plan yields 720 premium (total 13720).
        test_recipe:
          setup:
            - "Customer, catalog CRIB rate 3000, two insurance plans: PD (PER_DAY 200) and PC (PERCENT_OF_RENTAL 0.08)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Bo Kim", email: "bo@x.com", phone: "222" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib B", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /insurance-plans", payload: { code: "PD", pricing_model: "PER_DAY", rate_value: 200, deductible_cents: 500, coverage_cap_cents: 10000, covered_severities: ["MINOR"] }, as: OperationsAdmin, captures: { plan_pd: $.data.id } }
            - { call: "POST /insurance-plans", payload: { code: "PC", pricing_model: "PERCENT_OF_RENTAL", rate_value: 0.08, deductible_cents: 500, coverage_cap_cents: 10000, covered_severities: ["MINOR"] }, as: OperationsAdmin, captures: { plan_pc: $.data.id } }
          trigger:
            - { call: "POST /reservations", payload: { delivery_address: "2 Palm St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", insurance_plan_id: "${plan_pd}", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res_pd: $.data.id, total_pd: $.data.quoted_total_cents } }
            - { call: "POST /reservations", payload: { delivery_address: "2 Palm St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", insurance_plan_id: "${plan_pc}", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res_pc: $.data.id, total_pc: $.data.quoted_total_cents } }
          assert:
            - "Reservation.${res_pd}.quoted_total_cents == 13600"
            - "Reservation.${res_pc}.quoted_total_cents == 13720"
            - "Reservation.${res_pd}.quoted_total_cents != Reservation.${res_pc}.quoted_total_cents"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: damage_capture_nested_min_max_with_insurance
        grounds:
          - calculations.damage_capture_amount
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (severity factor, condition-grade factor, insurance
          deductible/cap) with nested min/max and a coverage branch. Grade-B unit, MINOR,
          repair 10000 -> charged 4800; insured (deductible 1000, cap 20000, MINOR covered)
          -> capture 1000, whereas the uninsured branch would capture 4800.
        test_recipe:
          setup:
            - "Grade-B unit on a RETURNED reservation insured by plan INS (PER_DAY 200, deductible 1000, cap 20000, covers MINOR,MAJOR)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Cy Do", email: "cy@x.com", phone: "333" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Stroller S", category: "STROLLER", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 8.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-B1", condition_grade: "B" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /insurance-plans", payload: { code: "INS", pricing_model: "PER_DAY", rate_value: 200, deductible_cents: 1000, coverage_cap_cents: 20000, covered_severities: ["MINOR", "MAJOR"] }, as: OperationsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "3 Oak Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", insurance_plan_id: "${plan}", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "3 Oak Ave", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "3 Oak Ave", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line: "$.data[0].id" } }
          trigger:
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line}", severity: "MINOR", repair_cost_cents: 10000, description: "bent frame" }, as: Inspector, as_user_id: "insp-1", captures: { claim: $.data.id } }
            - { call: "POST /damage-claims/${claim}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
          assert:
            - "DamageClaim.${claim}.status == APPROVED"
            - "DamageClaim.${claim}.capture_amount_cents == 1000"

      - name: hotel_commission_per_line_rounding_then_sum
        grounds:
          - calculations.hotel_commission
          - state_machines.Reservation.RETURNED_to_SETTLED
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned. Line charges 1055 and 2055 at 10%:
          per-line round_half_up then sum gives 106 + 206 = 312; the forbidden
          sum-then-round gives round(3110 x 0.10) = 311. Commission must be 312.
        test_recipe:
          setup:
            - "Partner (10% commission, zone Z1); catalog items P (1055/day) and Q (2055/day) each with one unit; 1-day reservation 2026-06-10 -> 2026-06-11 with one line per item; delivered and returned on time"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Di Ho", email: "di@x.com", phone: "444" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /hotel-partners", payload: { name: "Grand Hotel", zone_code: "Z1", commission_pct: 0.10 }, as: OperationsAdmin, captures: { partner: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Item P", category: "CRIB", daily_rate_cents: 1055, deposit_amount_cents: 5000, weight_kg: 5.0, cleaning_turnaround_hours: 0, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat_p: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Item Q", category: "STROLLER", daily_rate_cents: 2055, deposit_amount_cents: 5000, weight_kg: 5.0, cleaning_turnaround_hours: 0, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat_q: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_p}", serial_number: "SN-P1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat_q}", serial_number: "SN-Q1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { hotel_partner_id: "${partner}", delivery_address: "Grand Hotel Front Desk", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-11", lines: [ { catalog_item_id: "${cat_p}" }, { catalog_item_id: "${cat_q}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "Grand Hotel Front Desk", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-11", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "Grand Hotel Front Desk", time_window_start: "2026-06-11T00:00:00Z", time_window_end: "2026-06-11T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
          trigger:
            - { call: "POST /reservations/${res}/settle", payload: {}, as: OperationsAdmin }
          assert:
            - "Reservation.${res}.commission_cents == 312"
            - "Reservation.${res}.gear_subtotal_cents == 3110"
            - "Reservation.${res}.quoted_total_cents == 8110"

      - name: quote_delivery_fee_tier_keyed_on_gear_subtotal
        grounds:
          - calculations.provisional_quote
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order. Gear subtotal
          9000 -> delivery fee tier1 2500 even though the resulting total 13000 lies in the
          1500 tier; keying the tier on the total would wrongly yield 12000.
        test_recipe:
          setup:
            - "Customer, catalog CRIB rate 3000 (3-day rental -> gear subtotal 9000)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ed Yu", email: "ed@x.com", phone: "555" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib C", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
          trigger:
            - { call: "POST /reservations", payload: { delivery_address: "4 Elm Dr", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
          assert:
            - "Reservation.${res}.gear_subtotal_cents == 9000"
            - "Reservation.${res}.quoted_total_cents == 13000"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: damage_claim_dispute_reopen_cycle
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_DENIED
          - state_machines.DamageClaim.DENIED_to_DISPUTED
          - state_machines.DamageClaim.DISPUTED_to_UNDER_REVIEW
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity = DamageClaim (cyclic review loop): UNDER_REVIEW -> DENIED -> DISPUTED ->
          UNDER_REVIEW -> APPROVED; reopen resets reviewed_by_user_id to null so the
          segregation check applies fresh on the second review round.
        test_recipe:
          setup:
            - "RETURNED reservation (grade-A unit, uninsured) with one line"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Faye Mo", email: "faye@x.com", phone: "666" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "CarSeat X", category: "CARSEAT", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 6.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-C1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "5 Pine Ln", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "5 Pine Ln", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "5 Pine Ln", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line: "$.data[0].id" } }
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line}", severity: "MAJOR", repair_cost_cents: 8000, description: "cracked shell" }, as: Inspector, as_user_id: "insp-1", captures: { claim: $.data.id } }
          trigger:
            - { call: "POST /damage-claims/${claim}/deny", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
            - { call: "POST /damage-claims/${claim}/dispute", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /damage-claims/${claim}/reopen", payload: {}, as: OperationsAdmin, as_user_id: "ops-2", captures: { reviewed_after_reopen: $.data.reviewed_by_user_id, status_after_reopen: $.data.status } }
            - { call: "POST /damage-claims/${claim}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
          assert:
            - "DamageClaim.${claim} transitioned DENIED after deny, DISPUTED after dispute"
            - "DamageClaim.${claim}.status == UNDER_REVIEW immediately after reopen"
            - "DamageClaim.${claim}.reviewed_by_user_id == null immediately after reopen"
            - "DamageClaim.${claim}.status == APPROVED after second-round approve"
            - "DamageClaim.${claim}.capture_amount_cents == 8000"

      - name: inventory_unit_full_cleaning_cycle
        grounds:
          - state_machines.InventoryUnit.AVAILABLE_to_RESERVED
          - state_machines.InventoryUnit.RENTED_OUT_to_AWAITING_CLEANING
          - state_machines.InventoryUnit.IN_CLEANING_to_AVAILABLE
        distinguishing_aspect: |
          Entity = InventoryUnit (cyclic rental loop, different entity than DamageClaim):
          AVAILABLE -> RESERVED -> RENTED_OUT -> AWAITING_CLEANING -> IN_CLEANING ->
          AVAILABLE, with cleans_since_deep incremented to 1 and blocked_until pinned to
          returned_at + 24h along the way.
        test_recipe:
          setup:
            - "One grade-A unit rented 2026-06-10 -> 2026-06-13, delivered, picked up at 2026-06-13T04:00:00Z"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Gus Ren", email: "gus@x.com", phone: "777" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib D", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-D1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "6 Ash Way", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}", captures: { status_after_confirm: $.data.status } }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "6 Ash Way", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "6 Ash Way", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /inventory-units/${unit}", payload: {}, as: OperationsAdmin, captures: { unit_status_mid: $.data.status, unit_blocked_until: $.data.blocked_until } }
            - { call: "GET /inventory-units/${unit}/cleaning-tickets", payload: {}, as: OperationsAdmin, captures: { ticket: "$.data[0].id" } }
          trigger:
            - { call: "POST /cleaning-tickets/${ticket}/pass", payload: { resolution_note: "ok" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "GET /inventory-units/${unit}", payload: {}, as: OperationsAdmin }
          assert:
            - "unit status was IN_CLEANING after pickup with blocked_until == 2026-06-14T04:00:00Z"
            - "auto-created CleaningTicket.${ticket}.ticket_type == STANDARD and status was OPEN before pass"
            - "InventoryUnit.${unit}.status == AVAILABLE after pass"
            - "InventoryUnit.${unit}.cleans_since_deep == 1"

      - name: reservation_parallel_payment_dimension
        grounds:
          - state_machines.Reservation.QUOTED_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: |
          Entity = Reservation with parallel dimensions (rental status x payment_status):
          confirm moves payment DEPOSIT_PENDING -> DEPOSIT_HELD while rental goes
          QUOTED -> CONFIRMED; cancel then moves rental -> CANCELLED while payment goes
          DEPOSIT_HELD -> SETTLED_PAID (10% fee captured) — the two dimensions advance
          independently and land in different terminal pairs.
        test_recipe:
          setup:
            - "Customer, catalog (rate 3000, deposit 15000), one unit; reservation 3 days quoted 13000"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Han Zo", email: "han@x.com", phone: "888" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib E", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-E1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "7 Birch Ct", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
          trigger:
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}", captures: { st1: $.data.status, ps1: $.data.payment_status } }
            - { call: "POST /reservations/${res}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { st2: $.data.status, ps2: $.data.payment_status, cap2: $.data.deposit_captured_cents, rel2: $.data.deposit_released_cents } }
          assert:
            - "after confirm: status == CONFIRMED and payment_status == DEPOSIT_HELD"
            - "after cancel: status == CANCELLED and payment_status == SETTLED_PAID"
            - "Reservation.${res}.deposit_captured_cents == 1300"
            - "Reservation.${res}.deposit_released_cents == 13700"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: recall_activation_depth3_cascade
        grounds:
          - state_machines.RecallNotice.DRAFT_to_ACTIVE
          - state_machines.InventoryUnit.RESERVED_to_QUARANTINED
          - state_machines.ReservationLine.ALLOCATED_to_PENDING_REALLOCATION
          - state_machines.RouteStop.SCHEDULED_to_SKIPPED
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /recalls/{id}/activate: recall activation
          quarantines the RESERVED unit (hop 1); the quarantine itself flips the holding
          line to PENDING_REALLOCATION and clears assigned_unit_id (hop 2); the line flip
          skips the reservation's SCHEDULED DELIVERY_SETUP stop and recomputes the route's
          planned weight (hop 3).
        test_recipe:
          setup:
            - "CONFIRMED reservation (unit U1 RESERVED, line ALLOCATED) with a SCHEDULED DELIVERY_SETUP stop on a PLANNED route (planned_weight 12.0)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ivy Fu", email: "ivy@x.com", phone: "999" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib F", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-F1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "8 Cedar Rd", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "8 Cedar Rd", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line: "$.data[0].id" } }
            - { call: "POST /recalls", payload: { catalog_item_id: "${cat}", recall_code: "RC-77", severity: "MANDATORY", description: "rail defect" }, as: OperationsAdmin, captures: { recall: $.data.id } }
          trigger:
            - { call: "POST /recalls/${recall}/activate", payload: {}, as: OperationsAdmin }
          assert:
            - "InventoryUnit.${unit}.status == QUARANTINED"
            - "ReservationLine.${line}.status == PENDING_REALLOCATION"
            - "ReservationLine.${line}.assigned_unit_id == null"
            - "RouteStop.${stop_d}.status == SKIPPED"
            - "DeliveryRoute.${route_d}.planned_weight_kg == 0"

      - name: pickup_completion_depth3_cascade
        grounds:
          - state_machines.RouteStop.SCHEDULED_to_COMPLETED
          - state_machines.Reservation.DELIVERED_to_RETURNED
          - state_machines.InventoryUnit.RENTED_OUT_to_AWAITING_CLEANING
          - state_machines.InventoryUnit.AWAITING_CLEANING_to_IN_CLEANING
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST /route-stops/{id}/complete with
          stop_type PICKUP): stop completion returns the reservation (hop 1); the return
          itself moves the unit to AWAITING_CLEANING with blocked_until set (hop 2); the
          unit's arrival in AWAITING_CLEANING auto-creates an OPEN STANDARD CleaningTicket
          and advances the unit to IN_CLEANING (hop 3).
        test_recipe:
          setup:
            - "DELIVERED reservation, pickup stop SCHEDULED on a DISPATCHED route dated 2026-06-13"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Jay Wu", email: "jay@x.com", phone: "101" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib G", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-G1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "9 Dogwood Dr", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "9 Dogwood Dr", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "9 Dogwood Dr", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:00:00Z" }, as: OperationsAdmin }
          trigger:
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
          assert:
            - "Reservation.${res}.status == RETURNED"
            - "Reservation.${res}.returned_at == 2026-06-13T04:00:00Z"
            - "InventoryUnit.${unit}.status == IN_CLEANING"
            - "InventoryUnit.${unit}.blocked_until == 2026-06-14T04:00:00Z"
            - "a CleaningTicket for unit ${unit} exists with status OPEN and ticket_type STANDARD"

      - name: settle_cascades_capture_risk_suspension
        grounds:
          - state_machines.Reservation.RETURNED_to_SETTLED
          - state_machines.DamageClaim.APPROVED_to_CAPTURED
          - calculations.customer_risk_score
          - state_machines.Customer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade from a third distinct trigger (POST /reservations/{id}/settle):
          settlement captures each APPROVED claim into the deposit ledger (hop 1); the
          captures bump customer.captured_damage_count and recompute risk_score (hop 2);
          crossing 90 auto-suspends the customer (hop 3). Setup: 3 captured claims
          (3 x 25) + 1 late return (15) = 90.
        test_recipe:
          setup:
            - "Reservation with 3 lines (3 grade-A units, deposit 15000 each), returned 1 minute past grace (04:01); 3 APPROVED COSMETIC claims at 10000 repair each (capture 2500 each, uninsured)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Kai On", email: "kai@x.com", phone: "202" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib H", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-H1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-H2", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-H3", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "10 Fir St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" }, { catalog_item_id: "${cat}" }, { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "10 Fir St", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "POST /routes", payload: { route_date: "2026-06-13", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_p: $.data.id } }
            - { call: "POST /routes/${route_p}/stops", payload: { reservation_id: "${res}", stop_type: "PICKUP", address: "10 Fir St", time_window_start: "2026-06-13T00:00:00Z", time_window_end: "2026-06-13T06:00:00Z" }, as: OperationsAdmin, captures: { stop_p: $.data.id } }
            - { call: "POST /routes/${route_p}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T04:01:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_p}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservation-lines", payload: { reservation_id: "${res}" }, as: OperationsAdmin, captures: { line1: "$.data[0].id", line2: "$.data[1].id", line3: "$.data[2].id" } }
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line1}", severity: "COSMETIC", repair_cost_cents: 10000, description: "scratch" }, as: Inspector, as_user_id: "insp-1", captures: { cl1: $.data.id } }
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line2}", severity: "COSMETIC", repair_cost_cents: 10000, description: "stain" }, as: Inspector, as_user_id: "insp-1", captures: { cl2: $.data.id } }
            - { call: "POST /damage-claims", payload: { reservation_line_id: "${line3}", severity: "COSMETIC", repair_cost_cents: 10000, description: "tear" }, as: Inspector, as_user_id: "insp-1", captures: { cl3: $.data.id } }
            - { call: "POST /damage-claims/${cl1}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
            - { call: "POST /damage-claims/${cl2}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
            - { call: "POST /damage-claims/${cl3}/approve", payload: {}, as: OperationsAdmin, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /reservations/${res}/settle", payload: {}, as: OperationsAdmin }
          assert:
            - "DamageClaim.${cl1}.status == CAPTURED and ${cl2} and ${cl3} likewise"
            - "Reservation.${res}.late_fee_cents == 1350"
            - "Reservation.${res}.deposit_captured_cents == 8850"
            - "Reservation.${res}.deposit_released_cents == 36150"
            - "Customer.${cust}.risk_score == 90"
            - "Customer.${cust}.status == SUSPENDED"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_extension_create
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.ExtensionRequest
        distinguishing_aspect: |
          Error-category pair: state (P6) vs business_temporal (P9). The reservation is
          CANCELLED (state violation) AND the requested extension window [06-13, 06-15)
          overlaps the follow-up reservation's committed interval on the same unit
          (temporal violation); the state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Res1 CONFIRMED then CANCELLED (unit released); res2 CONFIRMED 2026-06-14 -> 2026-06-17 on the same single unit"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Liv Sa", email: "liv@x.com", phone: "303" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib I", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-I1", condition_grade: "A" }, as: OperationsAdmin, captures: { unit: $.data.id } }
            - { call: "POST /reservations", payload: { delivery_address: "11 Holly Ave", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res1: $.data.id } }
            - { call: "POST /reservations/${res1}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /reservations/${res1}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { res1_v: $.data.version } }
            - { call: "POST /reservations", payload: { delivery_address: "11 Holly Ave", zone_code: "Z1", start_date: "2026-06-14", end_date: "2026-06-17", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res2: $.data.id } }
            - { call: "POST /reservations/${res2}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /reservations/${res1}/extensions", payload: { requested_end_date: "2026-06-15", expected_reservation_version: "${res1_v}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (not ERR_EXTENSION_WINDOW_CONFLICT)"

      - name: safety_beats_constraint_on_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.Reservation.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          Error-category pair: business_safety (P8) vs business_constraint (P10). The
          customer is SUSPENDED (constraint violation) AND the catalog item carries an
          ACTIVE MANDATORY recall (safety violation); the safety error ERR_RECALL_BLOCKED
          must win.
        test_recipe:
          setup:
            - "SUSPENDED customer; catalog item with one unit; ACTIVE MANDATORY recall on that catalog item; QUOTED reservation"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Meg Ti", email: "meg@x.com", phone: "404" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /customers/${cust}/suspend", payload: {}, as: OperationsAdmin }
            - { call: "POST /catalog-items", payload: { name: "Crib J", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-J1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /recalls", payload: { catalog_item_id: "${cat}", recall_code: "RC-88", severity: "MANDATORY", description: "harness defect" }, as: OperationsAdmin, captures: { recall: $.data.id } }
            - { call: "POST /recalls/${recall}/activate", payload: {}, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "12 Ivy Pl", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
          trigger:
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RECALL_BLOCKED (not ERR_CUSTOMER_SUSPENDED)"

      - name: request_shape_beats_state_on_amend
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - concurrency_rules[reservation-amend-stale-version]
        distinguishing_aspect: |
          Error-category pair: request-shape/date sanity (P5) vs state (P6). The
          reservation is DELIVERED (state violation for amend) AND the payload has
          end_date < start_date (shape violation); ERR_INVALID_DATE_RANGE must win.
        test_recipe:
          setup:
            - "DELIVERED reservation (full delivery chain completed)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ned Vo", email: "ned@x.com", phone: "505" }, as: Anonymous, captures: { cust: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib K", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
            - { call: "POST /inventory-units", payload: { catalog_item_id: "${cat}", serial_number: "SN-K1", condition_grade: "A" }, as: OperationsAdmin }
            - { call: "POST /reservations", payload: { delivery_address: "13 Jasmine St", zone_code: "Z1", start_date: "2026-06-10", end_date: "2026-06-13", lines: [ { catalog_item_id: "${cat}" } ] }, as: Customer, as_user_id: "${cust}", captures: { res: $.data.id } }
            - { call: "POST /reservations/${res}/confirm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /routes", payload: { route_date: "2026-06-10", zone_code: "Z1", vehicle_capacity_kg: 100 }, as: OperationsAdmin, captures: { route_d: $.data.id } }
            - { call: "POST /routes/${route_d}/stops", payload: { reservation_id: "${res}", stop_type: "DELIVERY_SETUP", address: "13 Jasmine St", time_window_start: "2026-06-10T08:00:00Z", time_window_end: "2026-06-10T10:00:00Z" }, as: OperationsAdmin, captures: { stop_d: $.data.id } }
            - { call: "POST /routes/${route_d}/dispatch", payload: {}, as: OperationsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /route-stops/${stop_d}/complete", payload: {}, as: OperationsAdmin }
            - { call: "GET /reservations/${res}", payload: {}, as: OperationsAdmin, captures: { res_v: $.data.version } }
          trigger:
            - { call: "POST /reservations/${res}/amend-dates", payload: { start_date: "2026-06-12", end_date: "2026-06-11", expected_reservation_version: "${res_v}" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE (not ERR_INVALID_STATE)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_grace_boundary_240_vs_241
        grounds:
          - calculations.late_fee
          - state_machines.Reservation.RETURNED_to_SETTLED
        distinguishing_aspect: |
          Metric = late minutes past the 240-minute grace window, reached via
          POST /reservations/{id}/settle. Exactly 240 minutes late -> fee 0 and full
          refund; 241 minutes late -> exactly one billed hour: round(3000 x 0.15) = 450.
        test_recipe:
          setup:
            - "Two customers each with an identical 3-day reservation (rate 3000, deposit 15000) on two units of the same catalog; R1 picked up at 2026-06-13T04:00:00Z (240 min), R2 at 2026-06-13T04:01:00Z (241 min)"
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ora Qi", email: "ora@x.com", phone: "606" }, as: Anonymous, captures: { cust1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Pia Xu", email: "pia@x.com", phone: "607" }, as: Anonymous, captures: { cust2: $.data.id } }
            - { call: "POST /catalog-items", payload: { name: "Crib L", category: "CRIB", daily_rate_cents: 3000, deposit_amount_cents: 15000, weight_kg: 12.0, cleaning_turnaround_hours: 24, deep_clean_every_cycles: 3 }, as: OperationsAdmin, captures: { cat: $.data.id } }
