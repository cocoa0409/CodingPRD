  - section: validations
    instances:
      - name: attendance_post_on_unknown_enrollment_with_bad_hours_returns_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
        distinguishing_aspect: |
          Path existence (priority 3) is decided before the body is validated (priority 5): a request
          that is wrong on both counts - unknown enrollment id AND hours that are not a multiple of
          0.25 - must answer 404 ERR_ENROLLMENT_NOT_FOUND, never 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "No enrollment with the id 00000000-0000-4000-8000-0000000000ff exists."
          setup_api_calls: []
          trigger:
            - call: "POST /enrollments/00000000-0000-4000-8000-0000000000ff/attendance-entries"
              payload: { attendance_date: "2026-08-01", hours: 3.33 }
              as: Instructor
              captures: { e1: $.data.error_id }
          assert:
            - "the call returns 404 with data.error_id == 'ERR_ENROLLMENT_NOT_FOUND'"
            - "the response does NOT report ERR_INVALID_REQUEST even though hours 3.33 violates the 0.25 increment"

      - name: role_check_precedes_path_existence_unauthorized
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Role authorisation (priority 2) runs before path resolution (priority 3), so an Instructor
          adding a room to a non-existent center gets 403 ERR_UNAUTHORIZED rather than leaking the
          absence of the center through a 404.
        test_recipe:
          setup:
            - "No testing center with the id 00000000-0000-4000-8000-0000000000aa exists; Instructor is not in the endpoint's roles."
          setup_api_calls: []
          trigger:
            - call: "POST /testing-centers/00000000-0000-4000-8000-0000000000aa/rooms"
              payload: { room_code: "R-X", seat_capacity: 10 }
              as: Instructor
              captures: { e1: $.data.error_id }
          assert:
            - "the call returns 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "the response does NOT report ERR_TESTING_CENTER_NOT_FOUND"

      - name: stale_session_version_precedes_duplicate_registration
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=91]
          - errors[ERR_STALE_EXAM_SESSION_VERSION]
          - errors[ERR_DUPLICATE_REGISTRATION]
        distinguishing_aspect: |
          The first registration bumps ExamSession.version, so replaying the same request with the
          version captured beforehand hits the OCC guard at priority 20 (412) - the duplicate check at
          priority 91 is never reached. Re-reading the session and retrying then surfaces the real
          business error, 409 ERR_DUPLICATE_REGISTRATION, and seats_taken stays 1 throughout.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center, ACTIVE room, CERTIFIED proctor, SCHEDULED MATH session with 5 seats."
            - "One self-pay-authorized student PLACED at EFL 2, already registered once on that session."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "OCC Before Duplicate Center", state_code: "WI" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-1401", seat_capacity: 12 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Aya Nordin", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T12:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_v: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Bram Estes", email: "bram.estes@example.org", primary_track: "HSE_PREP", self_pay_authorized: true }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /exam-registrations"
              payload: { student_id: "${s}", exam_session_id: "${sess}", expected_exam_session_version: "${sess_v}" }
