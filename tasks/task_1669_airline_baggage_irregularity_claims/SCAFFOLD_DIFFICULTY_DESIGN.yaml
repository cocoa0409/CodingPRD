            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn}"], turnaround_buffer_minutes: 60 }, as: SystemAdmin, captures: { crr: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234542", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00042", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt}", courier_service_id: "${crr}", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: BaggageServiceAgent, captures: { dsp: $.data.id } }
          trigger:
            - { call: "POST /baggage/dispatches/${dsp}/mark-delivered", payload: {}, as: BaggageServiceAgent }
          assert:
            - "DeliveryDispatch.${dsp}.status == DELIVERED"
            - "IrregularityReport.${rpt}.status == DELIVERED"
            - "IrregularityReport.${rpt}.delivered_on == 2026-08-01"
            - "BagTag.${bag}.status == DELIVERED"
            - "CourierService.${crr}.active_dispatch_count == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expense_state_beats_fiscal_cap
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_REPORT_NOT_ACCEPTING_EXPENSES]
          - errors[ERR_EXPENSE_CLAIM_OVER_MAX]
        distinguishing_aspect: |
          state-vs-business_fiscal pair: the claim is on a DAMAGED report (never accepts expense
          claims — state category) AND its claimed total of 300001 exceeds the 300000 fiscal cap;
          the state error ERR_REPORT_NOT_ACCEPTING_EXPENSES must win over ERR_EXPENSE_CLAIM_OVER_MAX.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; domestic bag"
            - "DAMAGED report (auto DAMAGE_REVIEW) owned by the passenger"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234551", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00051", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "splurge", amount_minor: 300001, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_NOT_ACCEPTING_EXPENSES"
            - "error_id != ERR_EXPENSE_CLAIM_OVER_MAX"
            - "HTTP status == 409"

      - name: dispatch_zone_referential_beats_window_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_COURIER_ZONE_MISMATCH]
          - errors[ERR_DISPATCH_WINDOW_CONFLICT]
        distinguishing_aspect: |
          business_referential-vs-business_temporal pair (different categories than the other
          instance): the dispatch violates courier-zone (courier serves LAX, report filed at JFK)
          AND its window overlaps an existing dispatch on the same courier; the referential error
          ERR_COURIER_ZONE_MISMATCH must win over ERR_DISPATCH_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; stations JFK and LAX; courier serves LAX only, buffer 60"
            - "Report A at LAX in FOUND_PENDING_DELIVERY with dispatch pickup 2026-08-02T10:00:00Z travel 120"
            - "Report B at JFK in FOUND_PENDING_DELIVERY"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn_jfk: $.data.id } }
            - { call: "POST /baggage/stations", payload: { station_code: "LAX", name: "Los Angeles", bags_handled_total: 800000 }, as: SystemAdmin, captures: { stn_lax: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn_lax}"], turnaround_buffer_minutes: 60 }, as: SystemAdmin, captures: { crr: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234552", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_a: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234553", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_b: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "LAXAA00052", passenger_id: "${pax}", bag_tag_id: "${bag_a}", station_id: "${stn_lax}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_a: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00053", passenger_id: "${pax}", bag_tag_id: "${bag_b}", station_id: "${stn_jfk}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_b: $.data.id } }
            - { call: "POST /baggage/reports/${rpt_a}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn_lax}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/reports/${rpt_b}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn_jfk}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt_a}", courier_service_id: "${crr}", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: BaggageServiceAgent }
          trigger:
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt_b}", courier_service_id: "${crr}", pickup_at: "2026-08-02T11:00:00Z", travel_minutes: 120, delivery_address: "2 Oak Ave" }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COURIER_ZONE_MISMATCH"
            - "error_id != ERR_DISPATCH_WINDOW_CONFLICT"
            - "HTTP status == 409"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tracing_timeout_exactly_504_hours
        grounds:
          - state_machines.IrregularityReport.TRACING_to_DECLARED_LOST
          - state_machines.BagTag.MISHANDLED_to_CLAIMED_LOST
        distinguishing_aspect: |
          Metric = elapsed tracing hours, exercised through POST /_clock/set_current_utc: at
          created_at + 503h59m the report stays TRACING; at exactly created_at + 504h (>=) the
          sweep moves it to DECLARED_LOST and the bag to CLAIMED_LOST.
        test_recipe:
          setup:
            - "Clock set to 2026-08-01T00:00:00Z before report creation so created_at == 2026-08-01T00:00:00Z"
            - "DELAYED report in TRACING; no LOCATED event"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234561", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00061", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T23:59:00Z" }, as: SystemAdmin, captures: { sweep1: $.data.swept_report_ids } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin, captures: { sweep2: $.data.swept_report_ids } }
          assert:
            - "After 503h59m: IrregularityReport.${rpt}.status == TRACING"
            - "sweep1 does not contain ${rpt}"
            - "After exactly 504h: IrregularityReport.${rpt}.status == DECLARED_LOST"
            - "sweep2 contains ${rpt}"
            - "BagTag.${bag}.status == CLAIMED_LOST"

      - name: expense_daily_cap_exact_boundary
        grounds:
          - calculations.expense_reimbursement
          - entities.ExpenseClaim.fields.reimbursable_total_cents
        distinguishing_aspect: |
          Metric = single-day receipt total in cents, exercised through POST
          /baggage/expense-claims (+ adjudicate): a STANDARD-tier day totaling exactly 7500 is
          reimbursed in full (7500), while a day totaling 7501 is clipped to 7500 — min() boundary
          at exactly the cap, a different metric and endpoint than the tracing-timeout instance.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; STANDARD passenger; domestic bag"
            - "DELAYED report in TRACING; claim A receipts [{2026-08-02, USD 7500}]; claim B receipts [{2026-08-03, USD 7501}]"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234562", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00062", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "at cap", amount_minor: 7500, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm_a: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-03", description: "one over", amount_minor: 7501, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm_b: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm_a}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/expense-claims/${clm_b}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
          assert:
            - "ExpenseClaim.${clm_a}.reimbursable_total_cents == 7500"
            - "ExpenseClaim.${clm_b}.reimbursable_total_cents == 7500"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_report_found_pending_delivery
        grounds:
          - state_machines.IrregularityReport.FOUND_PENDING_DELIVERY_to_DELIVERY_IN_PROGRESS
          - errors[ERR_REPORT_NOT_AWAITING_DELIVERY]
        distinguishing_aspect: |
          Pair DeliveryDispatch -> IrregularityReport: creating a dispatch while its report is
          still TRACING (no LOCATED event) is rejected with ERR_REPORT_NOT_AWAITING_DELIVERY;
          the same request succeeds once the report reaches FOUND_PENDING_DELIVERY.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK served by courier; DELAYED report in TRACING (no tracing events)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn}"], turnaround_buffer_minutes: 60 }, as: SystemAdmin, captures: { crr: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234571", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00071", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          trigger:
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt}", courier_service_id: "${crr}", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: BaggageServiceAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_NOT_AWAITING_DELIVERY"
            - "HTTP status == 409"
            - "IrregularityReport.${rpt}.status == TRACING"

      - name: settlement_payment_blocked_by_unadjudicated_claim
        grounds:
          - state_machines.SettlementPayment
          - validations[priority=7]
          - errors[ERR_UNADJUDICATED_EXPENSE_CLAIMS]
        distinguishing_aspect: |
          Pair SettlementPayment -> ExpenseClaim (different pair than the dispatch instance):
          the report is legitimately SETTLEMENT_ACCEPTED with a fresh OCC version, yet payment
          creation is rejected because an expense claim of the same report is still SUBMITTED.
        test_recipe:
          setup:
            - "Clock initially 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; international bag"
            - "DELAYED report swept to DECLARED_LOST; one expense claim SUBMITTED (never adjudicated)"
            - "Report advanced: assess-loss 100000 -> CLAIM_REVIEW -> offer (MISCONNECT) -> SETTLEMENT_OFFERED -> accept -> SETTLEMENT_ACCEPTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234572", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00072", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "hotel", amount_minor: 10000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/accept-settlement", payload: {}, as: Passenger, as_user_id: "${pax}", captures: { rpt_v: $.data.version } }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/settlement-payments", payload: { expected_report_version: "${rpt_v}" }, as: ClaimsAdjuster, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNADJUDICATED_EXPENSE_CLAIMS"
            - "HTTP status == 409"
            - "ExpenseClaim.${clm}.status == SUBMITTED"
            - "IrregularityReport.${rpt}.status == SETTLEMENT_ACCEPTED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: courier_dispatch_buffer_expanded_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_DISPATCH_WINDOW_CONFLICT]
          - entities.CourierService.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          Resource CourierService with buffer-expanded closed-interval semantics: a new window
          starting exactly buffer (60 min) after the existing window's end is ALLOWED (strict <
          comparison), while one starting 30 min before that boundary conflicts.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK served by courier with buffer 60"
            - "Three DELAYED reports A/B/C, all FOUND_PENDING_DELIVERY"
            - "Dispatch A: pickup 2026-08-02T10:00:00Z, travel 120 -> window [10:00, 12:00]"
