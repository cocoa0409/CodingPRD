      - name: dual_variant_funded_amount
        claim_type: dual_variant_calculation
        grounds: [calculations.contract_funded_amount]
        excluded_because:
          difficulty_instance: contract_funded_preneed_projection_vs_at_need_chronological
          rationale: "Preneed-projection vs at-need-chronological funded_amount divergence is the named §1.8 dual_variant_calc instance."

      - name: case_cancel_cascade_endtoend
        claim_type: cascading_side_effects
        grounds: [state_machines.Case.ARRANGED_to_CANCELLED]
        excluded_because:
          difficulty_instance: case_cancel_void_refund_release_plot_cancel_events_depth4
          rationale: "The N-level cancel cascade end-to-end is exercised by the named §1.8 transitive_cascade instance."

