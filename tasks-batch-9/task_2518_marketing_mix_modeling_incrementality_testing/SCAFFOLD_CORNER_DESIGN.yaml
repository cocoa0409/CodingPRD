          - "validations priority 40 (state) - ERR_EXPERIMENT_INVALID_STATE (409)"
          - "validations priority 67 (business_temporal) - ERR_EXPERIMENT_NOT_STARTED (409) on POST /mmm/experiments/{id}/start"
        distinguishing_aspect: |
          A DRAFT experiment refuses start with ERR_EXPERIMENT_INVALID_STATE even though the clock has
