            - "the first trigger call does NOT return ERR_INTRODUCTION_WINDOW_CLOSED, even though the clock 2026-09-20 is outside [2026-08-01, 2026-09-15) and priority 47 is co-violated"
            - "after the first trigger call ServiceAccount.${a2_id}.transfer_status == PENDING and ServiceAccount.${a2_id}.introduction_sequence_no == null"
            - "LicenseTransfer.${lt_pest_id}.status == APPROVED and LicenseTransfer.${lt_tax_id}.status == APPROVED after the four licence calls"
            - "the last trigger call - identical to the first, with only the safety violation removed - returns HTTP 422 with error_id ERR_INTRODUCTION_WINDOW_CLOSED (priority 47, category business_temporal), proving the loser was live all along"
            - "after the last trigger call ServiceAccount.${a2_id}.transfer_status == PENDING and RouteListing.${listing_id}.introductions_completed_count == 0"

  - rule_id: boundary_precision_check
    instances:

      - name: verification_variance_tolerance_inclusive_boundary
        grounds:
          - "calculations.account_billing_verification"
          - "state_machines.ServiceAccount.UNVERIFIED_to_VERIFIED"
          - "state_machines.ServiceAccount.UNVERIFIED_to_DISPUTED"
          - "entities.ServiceAccount.fields.verification_variance"
          - "entities.RouteListing.fields.verification_posture"
        distinguishing_aspect: "Inclusive threshold on a 4-decimal ratio: VERIFY_TOLERANCE 0.05 is compared with <=, so 0.0500 verifies and the very next representable variance 0.0550 disputes. Both accounts are built from identical claimed MRR so the only moving part is the collected amount."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; AZ state profile; seller ACTIVE."
            - "One DRAFT listing BND-01 with two UNVERIFIED accounts, each monthly_service_fee_cents 20000, no chemical and no repair, so claimed_recurring_mrr_cents is 20000 for both."
            - "Account ON has three BANK_VERIFIED billing rows billing 20000 and collecting 19000 (collection_rate 0.9500)."
            - "Account OFF has three BANK_VERIFIED billing rows billing 20000 and collecting 18900 (collection_rate 0.9450)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "BND-01", "state_code": "AZ", "asking_price_cents": 400000, "listed_mrr_cents": 40000, "listed_account_count": 2, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_bnd": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_bnd}", "customer_ref": "ON-EXACT-TOLERANCE", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 0, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_on": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_bnd}", "customer_ref": "OFF-BY-ONE-BAND", "service_start_date": "2019-03-15", "route_day": "TUE", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 0, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_off": "$.data.id"}
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a_on}", "period_month": "2026-05", "billed_service_cents": 20000, "billed_chemical_cents": 0, "billed_repair_cents": 0, "collected_cents": 19000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a_on}", "period_month": "2026-06", "billed_service_cents": 20000, "billed_chemical_cents": 0, "billed_repair_cents": 0, "collected_cents": 19000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a_on}", "period_month": "2026-07", "billed_service_cents": 20000, "billed_chemical_cents": 0, "billed_repair_cents": 0, "collected_cents": 19000, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a_off}", "period_month": "2026-05", "billed_service_cents": 20000, "billed_chemical_cents": 0, "billed_repair_cents": 0, "collected_cents": 18900, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a_off}", "period_month": "2026-06", "billed_service_cents": 20000, "billed_chemical_cents": 0, "billed_repair_cents": 0, "collected_cents": 18900, "source": "BANK_VERIFIED"}
              as: Broker
            - call: "POST /billing-history-records"
              payload: {"account_id": "${a_off}", "period_month": "2026-07", "billed_service_cents": 20000, "billed_chemical_cents": 0, "billed_repair_cents": 0, "collected_cents": 18900, "source": "BANK_VERIFIED"}
              as: Broker
          trigger:
            - call: "POST /service-accounts/${a_on}/verify"
              payload: {}
              as: Broker
