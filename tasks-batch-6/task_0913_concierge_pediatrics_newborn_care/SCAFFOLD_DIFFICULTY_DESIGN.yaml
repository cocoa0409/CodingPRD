  - rule_id: transitive_cascade
    instances:

      - name: membership_cancel_frees_weight_promotes_waitlist_and_seeds_new_membership
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.PanelWaitlistEntry.WAITING_to_PROMOTED
          - calculations.panel_weighted_occupancy
          - calculations.waitlist_promotion_selector
          - calculations.well_visit_schedule_generation
          - calculations.family_invoice_total
          - entities.PanelWaitlistEntry.fields.promoted_membership_id
        distinguishing_aspect: |
          CASCADE A, depth 4, triggered by membership cancellation: the cancel
          mutates Membership A, A's departure from the occupancy set mutates
          Physician.weighted_occupancy, the freed weight mutates
          PanelWaitlistEntry E1 to PROMOTED, E1's promotion creates Membership C,
          and Membership C's creation creates its EntitlementGrant, WellVisit and
          Invoice rows. E2, created later and needing 2.0 weight against the 2.0
          released, is skipped by the one-promotion-per-cancellation rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
            - "One PLUS plan and one physician with panel_slot_cap 4.0"
            - "Family F1 child A born 2026-03-01 and family F2 child B born 2026-02-01, both ACTIVE at slot weight 2.0, so the panel sits at weighted_occupancy 4.0 and available_panel_weight 0.0"
            - "Family F3 child C born 2022-06-01 (slot weight 1.0) queued first, family F4 child D born 2026-04-01 (slot weight 2.0) queued second, both WAITING"
