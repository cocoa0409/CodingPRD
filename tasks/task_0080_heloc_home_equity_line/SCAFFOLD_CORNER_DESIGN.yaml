          difficulty_instance: boundary_precision_check / cltv_strictly_greater_boundary
          rationale: "Threshold-crossing boundary semantics (strict >) are exercised by the named §1.8 CLTV boundary instance; the MAX_DELINQUENCY_DAYS metric shares the same strict-> arithmetic."

