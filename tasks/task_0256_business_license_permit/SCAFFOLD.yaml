scenario: |
  256. Local Business License & Permit: license type by activity, application & zoning check,
  fee schedule, inspection prerequisite, issuance/renewal cycle, conditions/endorsements,
  ownership transfer, delinquency/revocation

domain_name: business-license-permit
api_prefix: ""
# Flat topology with many root-mounted top-level collections (/businesses, /applications,
# /licenses, /inspections, /endorsements, /transfers, /fee-assessments, /activity-categories);
# there is no single dominant resource to nest under, so routes mount at the root.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation        # fee estimate vs final; provisional vs audited risk score
    - cascading_side_effects          # revocation cascades to endorsements, transfer, business standing
    - rate_threshold_triggers         # delinquency grace + tiered penalty breakpoints
    - optimistic_concurrency          # ownership transfer supersede on License.version

  entity_topology: flat
  # Peer entities linked by foreign keys (Business, ActivityCategory, Application, License,
  # Inspection, Endorsement, OwnershipTransfer, FeeAssessment). No nested ownership chain in URLs.

  state_machine_shape: branching
  # Application forks: APPROVED branch vs zoning/inspection REJECT branch with divergent side
  # effects; License has a renewal cycle (ACTIVE -> DELINQUENT -> ACTIVE) and revocation branch.

  relationship_patterns:
    - one_to_many        # Business -> Application, Business -> License, License -> Inspection
    - cross_aggregate    # Application references ActivityCategory config; Transfer crosses Businesses

  role_model: segregation_of_duties
  # A LicensingOfficer who reviews/approves an Application cannot perform the Inspection that
  # gates its issuance (and vice versa) — recorded via X-User-ID identity on each action.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ActivityCategory
    parent: null
    common_fields: false
    # Configuration entity: the fee-schedule / zoning / inspection rulebook keyed by business activity.
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID; identity only, never a business-decision input
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits
      - name: code
        type: string
        source: input
        description: unique human activity code (e.g., FOOD_SERVICE, RETAIL_GENERAL)
        constraints: unique across ActivityCategory; immutable after create
      - name: risk_tier
        type: enum
        source: input
        description: drives base fee and base risk score
        constraints: one of {LOW, MEDIUM, HIGH}
      - name: activity_base_risk
        type: integer
        source: input
        description: base contribution to a Business compliance risk score
        constraints: 0..40 inclusive
      - name: required_inspection_count
        type: integer
        source: input
        description: number of distinct PASSED inspections required before a License may be issued
        constraints: 0..5 inclusive
      - name: requires_zoning_check
        type: boolean
        source: input
        description: when true, an Application in this category must clear a zoning check before approval
      - name: term_months
        type: integer
        source: input
        description: validity term granted on issuance and added per renewal
        constraints: one of {12, 24, 36}
      - name: allowed_zones
        type: array
        source: input
        description: zone codes in which this activity is permitted outright (no variance)
        constraints: array of zone-code strings; non-empty

  - name: Business
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the applicant business
      - name: owner_name
        type: string
        source: input
        description: name of the current principal owner of record
      - name: zone_code
        type: string
        source: input
        description: zoning code of the business premises address
      - name: standing
        type: enum
        source: computed
        description: derived regulatory standing; gates new applications and transfers
        default: GOOD
        constraints: one of {GOOD, DELINQUENT, REVOKED}
      - name: prior_revocation_flag
        type: boolean
        source: computed
        description: true once any License of this Business has ever reached REVOKED
        default: false
      - name: compliance_risk_score
        type: integer
        source: computed
        description: latest computed weighted compliance risk score (see calc compliance_risk_score)
        default: 0
        constraints: 0..100 inclusive

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: business_id
        type: string
        source: input
        description: FK -> Business.id; the applicant business
      - name: activity_category_id
        type: string
        source: input
        description: FK -> ActivityCategory.id; chosen activity rulebook
      - name: declared_employee_count
        type: integer
        source: input
        description: employee count declared by applicant; feeds the provisional fee estimate
        constraints: integer >= 0
      - name: requested_zone_code
        type: string
        source: input
        description: zone code declared for the premises on this application
      - name: status
        type: enum
        source: computed
        description: application lifecycle state
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, ZONING_CLEARED, VARIANCE_REQUIRED, APPROVED, REJECTED, ISSUED, WITHDRAWN}
      - name: zoning_status
        type: enum
        source: computed
        description: outcome of the zoning check
        default: PENDING
        constraints: one of {PENDING, CLEARED, VARIANCE_REQUIRED}
      - name: estimated_fee
        type: number
        source: computed
        description: provisional application fee estimate computed at submission (see calc application_fee_estimate)
        default: 0
        constraints: 2 decimal places
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the LicensingOfficer who approved/rejected this application (segregation of duties)
        default: null
      - name: license_id
        type: string
        source: computed
        description: FK -> License.id; set when the application is ISSUED into a License
        default: null

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application this inspection gates
      - name: inspector_user_id
        type: string
        source: input
        description: X-User-ID of the InspectionOfficer who performed it (segregation of duties vs reviewer)
      - name: result
        type: enum
        source: computed
        description: inspection outcome
        default: SCHEDULED
        constraints: one of {SCHEDULED, PASSED, FAILED}
      - name: verified_employee_count
        type: integer
        source: input
        description: head-count verified on site; feeds the final issuance fee (overrides declared)
        constraints: integer >= 0
      - name: failed_item_count
        type: integer
        source: input
        description: count of failed line items recorded on this inspection; feeds audited risk score
        constraints: integer >= 0

  - name: License
    parent: null
    common_fields: true
    fields:
      - name: business_id
        type: string
        source: input
        description: FK -> Business.id; license holder
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application that produced this license
      - name: activity_category_id
        type: string
        source: input
        description: FK -> ActivityCategory.id; copied from the source application
      - name: status
        type: enum
        source: computed
        description: license lifecycle state
        default: ACTIVE
        constraints: one of {ACTIVE, DELINQUENT, REVOKED, SURRENDERED}
      - name: issued_on
        type: datetime
        source: computed
        description: UTC date the license was issued
      - name: expires_on
        type: datetime
        source: computed
        description: UTC expiry; issued_on + term_months, advanced by term_months on each renewal
      - name: final_fee
        type: number
        source: computed
        description: final issuance fee charged at issuance (see calc issuance_fee_final)
        default: 0
        constraints: 2 decimal places
      - name: renewal_count
        type: integer
        source: computed
        description: number of successful renewals applied to this license
        default: 0

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: FK -> License.id; license this endorsement/condition is attached to
      - name: kind
        type: enum
        source: input
        description: condition or special endorsement category
        constraints: one of {LATE_HOURS, OUTDOOR_SEATING, HAZMAT_HANDLING, SIDEWALK_USE}
      - name: status
        type: enum
        source: computed
        description: endorsement lifecycle state
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, VOIDED}
      - name: condition_text
        type: string
        source: input
        description: free-text condition imposed by the issuing officer

  - name: OwnershipTransfer
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: FK -> License.id; license being transferred
      - name: from_business_id
        type: string
        source: input
        description: FK -> Business.id; current holder of record
      - name: to_business_id
        type: string
        source: input
        description: FK -> Business.id; prospective new holder
      - name: status
        type: enum
        source: computed
        description: transfer lifecycle state
        default: REQUESTED
        constraints: one of {REQUESTED, APPROVED, REJECTED, COMPLETED, CANCELLED}
      - name: transfer_fee
        type: number
        source: computed
        description: flat transfer fee assessed at completion (see calc transfer_fee)
        default: 0
        constraints: 2 decimal places

  - name: FeeAssessment
    parent: null
    common_fields: true
    # Append-only ledger of money owed/charged against a License or Application. Conserved-quantity anchor.
    fields:
      - name: license_id
        type: string
        source: input
        description: FK -> License.id; license the assessment is charged against (null for application-stage fees)
        default: null
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; application the assessment is charged against (null for license-stage fees)
        default: null
      - name: kind
        type: enum
        source: input
        description: assessment category
        constraints: one of {APPLICATION_FEE, ISSUANCE_FEE, RENEWAL_FEE, DELINQUENCY_PENALTY, TRANSFER_FEE, REVERSAL}
      - name: amount
        type: number
        source: input
        description: signed amount; positive = charge, negative = reversal/credit
        constraints: 2 decimal places
      - name: settled
        type: boolean
        source: computed
        description: whether the assessment has been settled/paid
        default: false

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [ISSUED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application.status == DRAFT"
          - "Business.standing == GOOD (referenced business must be in good standing)"
        side_effects:
          - "compute Application.estimated_fee via calc application_fee_estimate (uses declared_employee_count)"
          - "create FeeAssessment{kind: APPLICATION_FEE, amount: estimated_fee, application_id, settled: false}"
          - "increments Application.version by 1"
        note: "cross-entity guard on Business.standing"

      - from: SUBMITTED
        to: ZONING_CLEARED
        trigger: "POST /applications/{id}/zoning-check"
        actor: LicensingOfficer
        preconditions:
          - "Application.status == SUBMITTED"
          - "ActivityCategory.requires_zoning_check == true OR requested_zone_code IN ActivityCategory.allowed_zones"
          - "requested_zone_code IN ActivityCategory.allowed_zones"
        side_effects:
          - "set Application.zoning_status = CLEARED"
          - "increments Application.version by 1"

      - from: SUBMITTED
        to: VARIANCE_REQUIRED
        trigger: "POST /applications/{id}/zoning-check"
        actor: LicensingOfficer
        preconditions:
          - "Application.status == SUBMITTED"
          - "requested_zone_code NOT IN ActivityCategory.allowed_zones"
          - "ActivityCategory.requires_zoning_check == true"
        side_effects:
          - "set Application.zoning_status = VARIANCE_REQUIRED"
          - "recompute Application.estimated_fee adding ZONING_VARIANCE_SURCHARGE; adjust the APPLICATION_FEE FeeAssessment.amount accordingly"
          - "increments Application.version by 1"
        note: "branch: zoning outside allowed zones requires a variance surcharge"

      - from: ZONING_CLEARED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: LicensingOfficer
        preconditions:
          - "Application.status == ZONING_CLEARED"
          - "all required PASSED inspections present: count(Inspection where application_id AND result==PASSED) >= ActivityCategory.required_inspection_count"
        side_effects:
          - "set Application.reviewed_by_user_id = acting X-User-ID"
          - "compute provisional Business.compliance_risk_score variant=PROVISIONAL"
          - "increments Application.version by 1"
        note: "inspection-prerequisite gate; reviewer id recorded for segregation of duties"

      - from: VARIANCE_REQUIRED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: LicensingOfficer
        preconditions:
          - "Application.status == VARIANCE_REQUIRED"
          - "count(Inspection where application_id AND result==PASSED) >= ActivityCategory.required_inspection_count"
        side_effects:
          - "set Application.reviewed_by_user_id = acting X-User-ID"
          - "increments Application.version by 1"
        note: "variance granted on approval; surcharge already on the assessment"

      - from: ZONING_CLEARED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: LicensingOfficer
        preconditions:
          - "Application.status IN {ZONING_CLEARED, VARIANCE_REQUIRED, SUBMITTED}"
        side_effects:
          - "set Application.reviewed_by_user_id = acting X-User-ID"
          - "create FeeAssessment{kind: REVERSAL, amount: -estimated_fee, application_id} reversing the APPLICATION_FEE (compensating invariant: net application ledger == 0)"
          - "increments Application.version by 1"
        note: "compensation: reject reverses the application fee charge"

      - from: APPROVED
        to: ISSUED
        trigger: "POST /applications/{id}/issue"
        actor: LicensingOfficer
        preconditions:
          - "Application.status == APPROVED"
          - "acting X-User-ID != any Inspection.inspector_user_id for this application (segregation of duties)"
        side_effects:
          - "create License{status: ACTIVE, issued_on: clock_now, expires_on: clock_now + ActivityCategory.term_months}"
          - "set Application.license_id = new License.id, Application.status = ISSUED"
          - "compute License.final_fee via calc issuance_fee_final (uses verified_employee_count + inspections)"
          - "create FeeAssessment{kind: ISSUANCE_FEE, amount: final_fee, license_id, settled: false}"
          - "increments Application.version by 1"
        note: "branch convergence: both ZONING_CLEARED->APPROVED and VARIANCE_REQUIRED->APPROVED reach ISSUED"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "Application.status IN {DRAFT, SUBMITTED, ZONING_CLEARED, VARIANCE_REQUIRED}"
        side_effects:
          - "if an unsettled APPLICATION_FEE assessment exists, create REVERSAL assessment for -estimated_fee"
          - "increments Application.version by 1"

  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED, SURRENDERED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc then POST /licenses/{id}/assess-delinquency"
        actor: system
        preconditions:
          - "License.status == ACTIVE"
          - "clock_now > License.expires_on"
        side_effects:
          - "compute days_overdue = clock_now - expires_on; if days_overdue > GRACE_PERIOD_DAYS compute penalty via calc delinquency_penalty"
          - "create FeeAssessment{kind: RENEWAL_FEE, amount: renewal fee, license_id, settled:false} and FeeAssessment{kind: DELINQUENCY_PENALTY, amount: penalty, license_id} when penalty > 0"
          - "set Business.standing = DELINQUENT and recompute Business.compliance_risk_score"
          - "increments License.version by 1"
        note: "cross-entity cascade: License delinquency demotes Business.standing"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /licenses/{id}/renew"
        actor: Applicant
        preconditions:
          - "License.status IN {ACTIVE, DELINQUENT}"
          - "clock_now within renewal window (clock_now >= expires_on - RENEWAL_WINDOW_DAYS)"
          - "no unsettled DELINQUENCY_PENALTY assessment unless included in this renewal payment"
        side_effects:
          - "advance License.expires_on by ActivityCategory.term_months (anchored to current expires_on)"
          - "increment License.renewal_count by 1"
          - "settle outstanding RENEWAL_FEE and DELINQUENCY_PENALTY assessments for this license"
          - "if Business has no other DELINQUENT/REVOKED license, set Business.standing = GOOD and recompute compliance_risk_score"
          - "increments License.version by 1"
        note: "cyclic: DELINQUENT -> ACTIVE renewal loop"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /licenses/{id}/renew"
        actor: Applicant
        preconditions:
          - "License.status == ACTIVE"
          - "clock_now >= expires_on - RENEWAL_WINDOW_DAYS (renewal window open)"
        side_effects:
          - "advance License.expires_on by ActivityCategory.term_months (anchored to current expires_on)"
          - "increment License.renewal_count by 1"
          - "create+settle RENEWAL_FEE assessment"
          - "increments License.version by 1"
        note: "in-cycle renewal before expiry, no penalty"

      - from: DELINQUENT
        to: REVOKED
        trigger: "POST /licenses/{id}/revoke"
        actor: LicensingOfficer
        preconditions:
          - "License.status == DELINQUENT"
          - "days_overdue > REVOCATION_THRESHOLD_DAYS"
        side_effects:
          - "set License.status = REVOKED"
          - "VOID all ACTIVE/SUSPENDED Endorsement of this license (cascade down)"
          - "CANCEL any REQUESTED/APPROVED OwnershipTransfer of this license (cascade, that cancel itself sets transfer.transfer_fee=0)"
          - "set Business.standing = REVOKED and Business.prior_revocation_flag = true; recompute compliance_risk_score"
          - "increments License.version by 1"
        note: "depth-3 cascade: revoke -> void endorsements; revoke -> cancel transfer -> transfer cancel mutates fee; revoke -> business REVOKED+flag"

      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /licenses/{id}/surrender"
        actor: Applicant
        preconditions:
          - "License.status == ACTIVE"
          - "no outstanding unsettled FeeAssessment for this license"
        side_effects:
          - "set License.status = SURRENDERED"
          - "VOID all ACTIVE Endorsement of this license"
          - "increments License.version by 1"

  - entity: OwnershipTransfer
    initial_state: REQUESTED
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /transfers/{id}/approve"
        actor: LicensingOfficer
        preconditions:
          - "OwnershipTransfer.status == REQUESTED"
          - "License.status == ACTIVE (license must be active to transfer)"
          - "to_business referenced by to_business_id has standing == GOOD"
        side_effects:
          - "increments OwnershipTransfer.version by 1"
        note: "guarded by License state and target Business standing (two distinct cross-entity deps)"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /transfers/{id}/reject"
        actor: LicensingOfficer
        preconditions:
          - "OwnershipTransfer.status == REQUESTED"
        side_effects:
          - "increments OwnershipTransfer.version by 1"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /transfers/{id}/complete"
        actor: LicensingOfficer
        preconditions:
          - "OwnershipTransfer.status == APPROVED"
          - "License.status == ACTIVE"
          - "expected_license_version matches License.version (OCC)"
        side_effects:
          - "reassign License.business_id = to_business_id"
          - "set License.owner of record via Business.owner_name copy is NOT performed; only business_id moves"
          - "compute OwnershipTransfer.transfer_fee via calc transfer_fee; create FeeAssessment{kind: TRANSFER_FEE, amount: transfer_fee, license_id}"
          - "increments License.version by 1 and OwnershipTransfer.version by 1"
        note: "OCC on License.version: a stale transfer view (license already moved/renewed) is rejected"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /transfers/{id}/cancel OR cascade from License revoke"
        actor: Applicant
        preconditions:
          - "OwnershipTransfer.status IN {REQUESTED, APPROVED}"
        side_effects:
          - "set OwnershipTransfer.transfer_fee = 0"
          - "increments OwnershipTransfer.version by 1"

  - entity: Endorsement
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /endorsements/{id}/suspend"
        actor: LicensingOfficer
        preconditions:
          - "Endorsement.status == ACTIVE"
          - "License.status IN {ACTIVE, DELINQUENT}"
        side_effects:
          - "increments Endorsement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /endorsements/{id}/reinstate"
        actor: LicensingOfficer
        preconditions:
          - "Endorsement.status == SUSPENDED"
          - "License.status == ACTIVE"
        side_effects:
          - "increments Endorsement.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /endorsements/{id}/void OR cascade from License revoke/surrender"
        actor: LicensingOfficer
        preconditions:
          - "Endorsement.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "increments Endorsement.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: transfer-complete-stale-license
    parent_entity: License
    write_endpoint: "POST /transfers/{id}/complete"
    occ_field: "expected_license_version"
    description: |
      Completing an OwnershipTransfer against a License whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has already renewed the license or completed a competing
      transfer (legitimately advancing License.version), so the current writer's
      view of the license is stale and its reassignment would clobber the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: application_fee_estimate
    trigger: "Application DRAFT->SUBMITTED (POST /applications/{id}/submit); recomputed on SUBMITTED->VARIANCE_REQUIRED"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE[ActivityCategory.risk_tier]
      surcharge = PER_EMPLOYEE_FEE * Application.declared_employee_count
      variance = ZONING_VARIANCE_SURCHARGE if Application.zoning_status == VARIANCE_REQUIRED else 0.00
      estimated_fee = round(base + surcharge + variance, 2)   # round once on the final sum
    input_set: "single Application + its ActivityCategory; uses DECLARED employee count"
    constants:
      BASE_FEE: { LOW: 100.00, MEDIUM: 250.00, HIGH: 600.00 }
      PER_EMPLOYEE_FEE: 5.00
      ZONING_VARIANCE_SURCHARGE: 150.00
    precision: "2 decimal places, round_half_up; round once on the final sum (sum-then-round)"
    variants:
      - name: provisional
        when: "computed at submission using declared_employee_count, before any zoning variance"
        difference: "uses declared_employee_count and zero variance until zoning-check runs"

  - name: issuance_fee_final
    trigger: "Application APPROVED->ISSUED (POST /applications/{id}/issue)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE[ActivityCategory.risk_tier]
      surcharge = PER_EMPLOYEE_FEE * verified_employee_count   # from the latest PASSED Inspection
      variance = ZONING_VARIANCE_SURCHARGE if Application.zoning_status == VARIANCE_REQUIRED else 0.00
      inspection_fees = PER_INSPECTION_FEE * count(Inspection where application_id AND result==PASSED)
      final_fee = round(base + surcharge + variance + inspection_fees, 2)
    input_set: "Application + ActivityCategory + its PASSED Inspections; uses VERIFIED employee count, adds inspection fees"
    constants:
      BASE_FEE: { LOW: 100.00, MEDIUM: 250.00, HIGH: 600.00 }
      PER_EMPLOYEE_FEE: 5.00
      ZONING_VARIANCE_SURCHARGE: 150.00
      PER_INSPECTION_FEE: 75.00
    precision: "2 decimal places, round_half_up; sum-then-round"
    variants:
      - name: final
        when: "computed at issuance; the binding charge"
        difference: |
          Same License/Application subject as the estimate but a DIFFERENT result: substitutes
          verified_employee_count for declared_employee_count AND adds PER_INSPECTION_FEE per
          passed inspection. final_fee != estimated_fee whenever counts differ or inspections > 0.

  - name: compliance_risk_score
    trigger: "Application ZONING_CLEARED->APPROVED (PROVISIONAL) and License ACTIVE->DELINQUENT / DELINQUENT->REVOKED (AUDITED recompute)"
    algorithm: weighted_scoring
    formula: |
      s = ActivityCategory.activity_base_risk
      s = s + min(VIOLATION_WEIGHT * open_violation_count, VIOLATION_CAP)
      s = s + (DELINQUENCY_WEIGHT if Business.standing == DELINQUENT else 0)
      s = s + (PRIOR_REVOCATION_WEIGHT if Business.prior_revocation_flag else 0)
      compliance_risk_score = max(0, min(100, s))   # floor 0, ceiling 100
    input_set: |
      Business + its activity (via the relevant Application/License) + open_violation_count
      (variant-dependent: PROVISIONAL uses 0; AUDITED uses sum of Inspection.failed_item_count
      across this business's licenses)
    constants:
      VIOLATION_WEIGHT: 5
      VIOLATION_CAP: 30
      DELINQUENCY_WEIGHT: 20
      PRIOR_REVOCATION_WEIGHT: 10
    precision: "integer; clamp to [0,100]"
    variants:
      - name: provisional
        when: "at application approval — before any inspection findings are aggregated"
        difference: "open_violation_count is treated as 0; reflects declared-only posture"
      - name: audited
        when: "on delinquency/revocation recompute — after inspection findings exist"
        difference: |
          Different entity domain (scoring the Business, not the License fee): open_violation_count =
          sum of Inspection.failed_item_count; same Business yields a higher score than provisional
          whenever failed items or delinquency exist.

  - name: delinquency_penalty
    trigger: "License ACTIVE->DELINQUENT (POST /licenses/{id}/assess-delinquency)"
    algorithm: threshold
    formula: |
      days_overdue = floor((clock_now - License.expires_on) in whole UTC days)
      if days_overdue <= GRACE_PERIOD_DAYS:      pct = 0.00
      elif days_overdue <= TIER_A_MAX_DAYS:      pct = 0.10
      elif days_overdue <= TIER_B_MAX_DAYS:      pct = 0.25
      else:                                      pct = 0.50
      penalty = round(RENEWAL_FEE * pct, 2)   # single tier, NOT cumulative across tiers
    input_set: "single License; RENEWAL_FEE is the base renewal fee for its ActivityCategory.risk_tier"
    constants:
      GRACE_PERIOD_DAYS: 30
      TIER_A_MAX_DAYS: 60
      TIER_B_MAX_DAYS: 90
      REVOCATION_THRESHOLD_DAYS: 90
      RENEWAL_WINDOW_DAYS: 60
      RENEWAL_FEE: { LOW: 200.00, MEDIUM: 480.00, HIGH: 900.00 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: single_tier
        when: "always"
        difference: "penalty is the single tier days_overdue falls in; tiers do not stack"

  - name: transfer_fee
    trigger: "OwnershipTransfer APPROVED->COMPLETED (POST /transfers/{id}/complete)"
    algorithm: aggregation
    formula: |
      transfer_fee = round(FLAT_TRANSFER_FEE + (RISK_TRANSFER_SURCHARGE if ActivityCategory.risk_tier == HIGH else 0.00), 2)
    input_set: "single License + its ActivityCategory"
    constants:
      FLAT_TRANSFER_FEE: 300.00
      RISK_TRANSFER_SURCHARGE: 200.00
    precision: "2 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "all path/body referenced resources exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "required input fields present and well-typed; enum values in allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "issuing officer (acting X-User-ID) must differ from every Inspection.inspector_user_id of the application (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/issue"

  - priority: 7
    category: business_safety
    check: "license issuance requires count of PASSED inspections >= ActivityCategory.required_inspection_count"
    error_id: ERR_INSPECTION_PREREQUISITE_NOT_MET
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 8
    category: business_referential
    check: "applicant Business.standing must be GOOD to submit a new application or to be the transfer target"
    error_id: ERR_BUSINESS_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /applications/{id}/submit, POST /transfers/{id}/approve"

  - priority: 9
    category: business_referential
    check: "ownership transfer target License must be ACTIVE (not DELINQUENT/REVOKED/SURRENDERED)"
    error_id: ERR_LICENSE_NOT_TRANSFERABLE
    http_status: 409
    applies_to: "POST /transfers, POST /transfers/{id}/approve, POST /transfers/{id}/complete"

  - priority: 10
    category: business_constraint
    check: "requested_zone_code must be in ActivityCategory.allowed_zones unless a variance path is taken"
    error_id: ERR_ZONING_DENIED
    http_status: 409
    applies_to: "POST /applications/{id}/zoning-check"

  - priority: 11
    category: business_temporal
    check: "renewal only allowed when clock_now >= expires_on - RENEWAL_WINDOW_DAYS (renewal window open)"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /licenses/{id}/renew"

  - priority: 12
    category: business_temporal
    check: "revocation only allowed when days_overdue > REVOCATION_THRESHOLD_DAYS"
    error_id: ERR_REVOCATION_THRESHOLD_NOT_REACHED
    http_status: 409
    applies_to: "POST /licenses/{id}/revoke"

  - priority: 13
    category: business_fiscal
    check: "license may be SURRENDERED only when it has no outstanding unsettled FeeAssessment"
    error_id: ERR_OUTSTANDING_FEES
    http_status: 409
    applies_to: "POST /licenses/{id}/surrender"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_license_version must equal current License.version on transfer completion"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /transfers/{id}/complete"

  - priority: 15
    category: business_constraint
    check: "ActivityCategory.code uniqueness on create"
    error_id: ERR_DUPLICATE_ACTIVITY_CODE
    http_status: 409
    applies_to: "POST /activity-categories"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- ActivityCategory (config) ----
  - method: POST
    path: "/activity-categories"
    description: "create an activity-category rulebook entry"
    roles: [LicensingOfficer]
    code: 201
    input: [code, risk_tier, activity_base_risk, required_inspection_count, requires_zoning_check, term_months, allowed_zones]
    output: ActivityCategory
    side_effects: ["validate code uniqueness"]
  - method: GET
    path: "/activity-categories/{id}"
    description: "fetch an activity category"
    roles: [LicensingOfficer, InspectionOfficer, Applicant]
    code: 200
    input: []
    output: ActivityCategory
    side_effects: []
  - method: GET
    path: "/activity-categories"
    description: "list activity categories"
    roles: [LicensingOfficer, InspectionOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: ActivityCategory[]
    side_effects: []

  # ---- Business ----
  - method: POST
    path: "/businesses"
    description: "register a business"
    roles: [Applicant, LicensingOfficer]
    code: 201
    input: [legal_name, owner_name, zone_code]
    output: Business
    side_effects: ["standing initialized GOOD; compliance_risk_score 0"]
  - method: GET
    path: "/businesses/{id}"
    description: "fetch a business with derived standing and risk score"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: []
    output: Business
    side_effects: []
  - method: GET
    path: "/businesses/{id}/applications"
    description: "list applications for a business (FK reverse-reachability for Application.business_id)"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/businesses/{id}/licenses"
    description: "list licenses held by a business (FK reverse-reachability for License.business_id)"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: License[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "create a draft application"
    roles: [Applicant]
    code: 201
    input: [business_id, activity_category_id, declared_employee_count, requested_zone_code]
    output: Application
    side_effects: ["status DRAFT; zoning_status PENDING"]
  - method: GET
    path: "/applications/{id}"
    description: "fetch an application"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/applications"
    description: "list applications, optionally filtered by business, activity, or issued license"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: ["business_id?", "activity_category_id?", "license_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/submit"
    description: "submit a draft application; computes provisional fee estimate"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["compute estimated_fee", "create APPLICATION_FEE FeeAssessment", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/zoning-check"
    description: "run zoning check; clears or flags variance"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["set zoning_status", "may recompute estimated_fee with variance surcharge", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/approve"
    description: "approve an application that has cleared zoning and inspection prerequisites"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["set reviewed_by_user_id", "compute PROVISIONAL compliance_risk_score", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/reject"
    description: "reject an application; reverses the application fee"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["create REVERSAL FeeAssessment", "set reviewed_by_user_id", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/withdraw"
    description: "applicant withdraws an application; reverses unsettled application fee"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["create REVERSAL FeeAssessment if needed", "increments Application.version by 1"]
  - method: POST
    path: "/applications/{id}/issue"
    description: "issue a license from an approved application"
    roles: [LicensingOfficer]
    code: 201
    input: []
    output: License
    side_effects: ["create License", "compute final_fee", "create ISSUANCE_FEE FeeAssessment", "set Application.license_id and ISSUED", "increments Application.version by 1"]
  - method: GET
    path: "/applications/{id}/inspections"
    description: "list inspections for an application (FK reverse-reachability for Inspection.application_id)"
    roles: [LicensingOfficer, InspectionOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/applications/{id}/fee-assessments"
    description: "list fee assessments tied to an application (FK reverse-reachability for FeeAssessment.application_id)"
    roles: [LicensingOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "schedule an inspection for an application"
    roles: [InspectionOfficer]
    code: 201
    input: [application_id, inspector_user_id, "verified_employee_count?", "failed_item_count?"]
    output: Inspection
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "fetch an inspection"
    roles: [LicensingOfficer, InspectionOfficer, Applicant]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/record"
    description: "record inspection outcome (PASSED/FAILED) with verified counts and failed items"
    roles: [InspectionOfficer]
    code: 200
    input: [result, verified_employee_count, failed_item_count]
    output: Inspection
    side_effects: ["set result", "set verified_employee_count and failed_item_count"]

  # ---- License ----
  - method: GET
    path: "/licenses/{id}"
    description: "fetch a license"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: GET
    path: "/licenses"
    description: "list licenses, optionally filtered by business or activity"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: ["business_id?", "activity_category_id?", "application_id?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: POST
    path: "/licenses/{id}/assess-delinquency"
    description: "evaluate a license against the clock; demote to DELINQUENT and assess penalty if overdue"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["compute delinquency_penalty", "create RENEWAL_FEE + DELINQUENCY_PENALTY assessments", "demote Business.standing", "recompute compliance_risk_score AUDITED", "increments License.version by 1"]
  - method: POST
    path: "/licenses/{id}/renew"
    description: "renew a license; advances expiry and settles outstanding fees"
    roles: [Applicant]
    code: 200
    input: []
    output: License
    side_effects: ["advance expires_on", "increment renewal_count", "settle RENEWAL_FEE/DELINQUENCY_PENALTY", "may restore Business.standing GOOD", "increments License.version by 1"]
  - method: POST
    path: "/licenses/{id}/revoke"
    description: "revoke a delinquent license past the revocation threshold"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: License
    side_effects: ["VOID endorsements", "CANCEL transfers", "set Business.standing REVOKED + prior_revocation_flag", "recompute compliance_risk_score AUDITED", "increments License.version by 1"]
  - method: POST
    path: "/licenses/{id}/surrender"
    description: "voluntarily surrender an active license with no outstanding fees"
    roles: [Applicant]
    code: 200
    input: []
    output: License
    side_effects: ["VOID endorsements", "increments License.version by 1"]
  - method: GET
    path: "/licenses/{id}/endorsements"
    description: "list endorsements on a license (FK reverse-reachability for Endorsement.license_id)"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Endorsement[]
    side_effects: []
  - method: GET
    path: "/licenses/{id}/transfers"
    description: "list ownership transfers for a license (FK reverse-reachability for OwnershipTransfer.license_id)"
    roles: [Applicant, LicensingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: OwnershipTransfer[]
    side_effects: []
  - method: GET
    path: "/licenses/{id}/fee-assessments"
    description: "list fee assessments tied to a license (FK reverse-reachability for FeeAssessment.license_id)"
    roles: [LicensingOfficer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  # ---- Endorsement ----
  - method: POST
    path: "/endorsements"
    description: "attach a condition/endorsement to a license"
    roles: [LicensingOfficer]
    code: 201
    input: [license_id, kind, condition_text]
    output: Endorsement
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/endorsements/{id}"
    description: "fetch an endorsement"
    roles: [Applicant, LicensingOfficer, InspectionOfficer]
    code: 200
    input: []
    output: Endorsement
    side_effects: []
  - method: POST
    path: "/endorsements/{id}/suspend"
    description: "suspend an active endorsement"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Endorsement
    side_effects: ["increments Endorsement.version by 1"]
  - method: POST
    path: "/endorsements/{id}/reinstate"
    description: "reinstate a suspended endorsement"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Endorsement
    side_effects: ["increments Endorsement.version by 1"]
  - method: POST
    path: "/endorsements/{id}/void"
    description: "void an endorsement"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Endorsement
    side_effects: ["increments Endorsement.version by 1"]

  # ---- OwnershipTransfer ----
  - method: POST
    path: "/transfers"
    description: "request an ownership transfer of a license"
    roles: [Applicant, LicensingOfficer]
    code: 201
    input: [license_id, from_business_id, to_business_id]
    output: OwnershipTransfer
    side_effects: ["status REQUESTED"]
  - method: GET
    path: "/transfers/{id}"
    description: "fetch an ownership transfer"
    roles: [Applicant, LicensingOfficer]
    code: 200
    input: []
    output: OwnershipTransfer
    side_effects: []
  - method: GET
    path: "/transfers"
    description: "list ownership transfers, optionally filtered by license or either party business (FK reverse-reachability for from_business_id/to_business_id)"
    roles: [Applicant, LicensingOfficer]
    code: 200
    input: ["license_id?", "from_business_id?", "to_business_id?", "limit?", "offset?"]
    output: OwnershipTransfer[]
    side_effects: []
  - method: POST
    path: "/transfers/{id}/approve"
    description: "approve a requested transfer"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: OwnershipTransfer
    side_effects: ["increments OwnershipTransfer.version by 1"]
  - method: POST
    path: "/transfers/{id}/reject"
    description: "reject a requested transfer"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: OwnershipTransfer
    side_effects: ["increments OwnershipTransfer.version by 1"]
  - method: POST
    path: "/transfers/{id}/complete"
    description: "complete an approved transfer (OCC on License.version); reassigns license and charges transfer fee"
    roles: [LicensingOfficer]
    code: 200
    input: [expected_license_version]
    output: OwnershipTransfer
    side_effects: ["reassign License.business_id", "compute transfer_fee", "create TRANSFER_FEE FeeAssessment", "increments License.version by 1", "increments OwnershipTransfer.version by 1"]
  - method: POST
    path: "/transfers/{id}/cancel"
    description: "cancel a requested/approved transfer"
    roles: [Applicant, LicensingOfficer]
    code: 200
    input: []
    output: OwnershipTransfer
    side_effects: ["set transfer_fee 0", "increments OwnershipTransfer.version by 1"]

  # ---- FeeAssessment ----
  - method: GET
    path: "/fee-assessments/{id}"
    description: "fetch a fee assessment"
    roles: [LicensingOfficer, Applicant]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []
  - method: POST
    path: "/fee-assessments/{id}/settle"
    description: "mark a fee assessment settled (payment recorded)"
    roles: [LicensingOfficer, Applicant]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["set settled true"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's current UTC clock (test-driving endpoint for temporal logic)"
    roles: [LicensingOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock_now set to to_iso8601 for all subsequent temporal computations"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type, or out-of-set enum value"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a state from which the requested transition is defined"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "issuing officer is also an inspector on the same application"
  - id: ERR_INSPECTION_PREREQUISITE_NOT_MET
    http: 409
    condition: "fewer PASSED inspections than ActivityCategory.required_inspection_count at approval"
  - id: ERR_BUSINESS_NOT_IN_GOOD_STANDING
    http: 409
    condition: "business standing is not GOOD when submitting an application or as a transfer target"
  - id: ERR_LICENSE_NOT_TRANSFERABLE
    http: 409
    condition: "license is not ACTIVE when requesting/approving/completing a transfer"
  - id: ERR_ZONING_DENIED
    http: 409
    condition: "requested zone not allowed and category does not permit a variance path"
  - id: ERR_RENEWAL_WINDOW_CLOSED
    http: 409
    condition: "renewal attempted before the renewal window opens"
  - id: ERR_REVOCATION_THRESHOLD_NOT_REACHED
    http: 409
    condition: "revocation attempted before days_overdue exceeds the revocation threshold"
  - id: ERR_OUTSTANDING_FEES
    http: 409
    condition: "surrender attempted while unsettled fee assessments remain"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_license_version does not match current License.version on transfer completion"
  - id: ERR_DUPLICATE_ACTIVITY_CODE
    http: 409
    condition: "activity-category code already exists"
  - id: ERR_VALIDATION
    http: 422
    condition: "semantically invalid input that passes type checks (e.g., negative declared_employee_count, activity_base_risk out of 0..40)"
  - id: ERR_INSPECTION_ALREADY_RECORDED
    http: 409
    condition: "recording an outcome on an inspection that is not SCHEDULED"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset out of allowed range"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "business owner/agent who files applications, renews, surrenders, and requests transfers"
    identity: "entity_backed:Business"
    exclusive_operations:
      - "POST /applications (create draft)"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
      - "POST /licenses/{id}/renew"
      - "POST /licenses/{id}/surrender"
    shared_operations:
      - "POST /businesses (with LicensingOfficer)"
      - "POST /transfers (with LicensingOfficer)"
      - "POST /transfers/{id}/cancel (with LicensingOfficer)"
      - "POST /fee-assessments/{id}/settle (with LicensingOfficer)"
      - "GET reads on own businesses, applications, licenses, endorsements, transfers, fee-assessments"

  - name: LicensingOfficer
    description: "municipal officer who runs zoning checks, approves/rejects/issues, manages endorsements, transfers, delinquency and revocation"
    identity: "opaque"
    exclusive_operations:
      - "POST /activity-categories"
      - "POST /applications/{id}/zoning-check"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/reject"
      - "POST /applications/{id}/issue"
      - "POST /licenses/{id}/assess-delinquency"
      - "POST /licenses/{id}/revoke"
      - "POST /endorsements, suspend, reinstate, void"
      - "POST /transfers/{id}/approve, reject, complete"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /businesses (with Applicant)"
      - "POST /transfers (with Applicant)"
      - "POST /transfers/{id}/cancel (with Applicant)"
      - "POST /fee-assessments/{id}/settle (with Applicant)"
      - "GET reads across the system"

  - name: InspectionOfficer
