              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE   # no STAGED/ISSUED CONFORM turnover referencing the asset"
            - "MediaAsset.${asset_id}.status == VERIFIED"

  # ------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.Booking.fields.start_hour
        distinguishing_aspect: |
          Half-open [start_hour, end_hour) semantics on EditBay: a booking with
          start_hour == existing.end_hour is ADJACENT and must be accepted;
          start_hour == existing.end_hour - 1 must be rejected. Resource:
          EditBay. Semantics: half-open with zero-gap adjacency allowed.
        test_recipe:
          setup:
            - "Project P ACTIVE; EditBay B capacity 8h/day"
            - "Existing Booking B1 on B for 2026-08-05, hours 10-12 (RESERVED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PAdj", client_code: "CL015", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "a@x.com", session_date: "2026-08-05", start_hour: 10, end_hour: 12, version_tag: "v001", expected_bay_version: "${bay_v0}" }
              as: PostSupervisor
            - call: "GET /post-production/projects/${proj_id}/bays"
              payload: {}
              as: PostSupervisor
              captures:
                bay_v1: "$.data[0].version"
          trigger:
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "b@x.com", session_date: "2026-08-05", start_hour: 12, end_hour: 14, version_tag: "v002", expected_bay_version: "${bay_v1}" }
              as: PostSupervisor
              captures: { booking2_id: $.data.id }
            - call: "GET /post-production/projects/${proj_id}/bays"
              payload: {}
              as: PostSupervisor
              captures:
                bay_v2: "$.data[0].version"
            - call: "POST /post-production/projects/${proj_id}/bookings"
              payload: { bay_id: "${bay_id}", artist_email: "c@x.com", session_date: "2026-08-05", start_hour: 13, end_hour: 15, version_tag: "v003", expected_bay_version: "${bay_v2}" }
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "booking2_id is present (adjacent 12-14 accepted: 12 == prior end_hour, half-open)"
            - "err == ERR_BOOKING_OVERLAP  (13-15 overlaps 12-14 because 13 < 14)"

      - name: ingest_window_closed_interval
        grounds:
          - state_machines.MediaBatch.DECLARED_to_INGESTING
          - validations[priority=7]
        distinguishing_aspect: |
          Closed-interval semantics on MediaBatch ingest window: start-ingest is
          accepted when clock == ingest_window_start AND when clock ==
          ingest_window_end (both endpoints inclusive); rejected when clock is
          strictly outside. Resource: MediaBatch. Semantics: closed interval —
          differs from Booking's half-open hour semantics.
        test_recipe:
          setup:
            - "Project P ACTIVE; Batch B1 with ingest_window_start = 2026-08-10T09:00:00Z, ingest_window_end = 2026-08-10T17:00:00Z"
            - "Logical clock initially at 2026-08-10T08:59:59Z (before window)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:59:59Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PIW", client_code: "CL016", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "OFFLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-08-10T09:00:00Z", ingest_window_end: "2026-08-10T17:00:00Z" }
              as: MediaManager
              captures: { batch1_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY02", ingest_window_start: "2026-08-10T09:00:00Z", ingest_window_end: "2026-08-10T17:00:00Z" }
              as: MediaManager
              captures: { batch2_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY03", ingest_window_start: "2026-08-10T09:00:00Z", ingest_window_end: "2026-08-10T17:00:00Z" }
              as: MediaManager
              captures: { batch3_id: $.data.id }
          trigger:
            - call: "POST /post-production/projects/${proj_id}/batches/${batch1_id}/start-ingest"
              payload: {}
              as: MediaManager
              captures: { err_before: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects/${proj_id}/batches/${batch1_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects/${proj_id}/batches/${batch2_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T17:00:01Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects/${proj_id}/batches/${batch3_id}/start-ingest"
              payload: {}
              as: MediaManager
              captures: { err_after: $.data.error_id }
          assert:
            - "err_before == ERR_WINDOW_CLOSED"
            - "MediaBatch.${batch1_id}.status == INGESTING   # accepted at window start (closed lower bound)"
            - "MediaBatch.${batch2_id}.status == INGESTING   # accepted at window end (closed upper bound)"
            - "err_after == ERR_WINDOW_CLOSED   # rejected 1s past end"

  # ------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vendor_slot_conservation
        grounds:
          - calculations.vendor_load_factor
          - state_machines.TurnoverPackage.RETURNED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: Vendor concurrent-load slots. Award + issue takes
          a slot (load +1); close releases it (load -1). After a full award ->
          issue -> ack -> return -> close cycle, vendor's in_flight_count MUST
          return to its initial value. Conserved: capacity_slots -
          in_flight_count.
        test_recipe:
          setup:
            - "Vendor V with capacity_slots = 2 and in_flight_count = 0 initially"
            - "Turnover T1 STAGED -> ISSUED -> ACKED -> RETURNED -> CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PInv1", client_code: "CL017", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
              as: PostSupervisor
              captures: { proj_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles"
              payload: { profile_name: "wm", opacity_pct: 80, position: "CENTER", includes_recipient_email: true, forensic_enabled: true }
              as: PostSupervisor
              captures: { wm_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/watermark-profiles/${wm_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/bays"
              payload: { bay_name: "BAY-01", bay_type: "ONLINE", capacity_hours_per_day: 8 }
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/vendors"
              payload: { vendor_name: "V1 Color", capabilities: ["COLOR"], day_rate_cents: 500000, capacity_slots: 2 }
              as: FacilityAdmin
              captures: { vendor_id: $.data.id }
            - call: "GET /post-production/vendors/${vendor_id}/load"
              payload: {}
              as: FacilityAdmin
              captures: { load_before: $.data.in_flight_count }
            - call: "POST /post-production/projects/${proj_id}/turnovers"
              payload: { turnover_kind: "COLOR", sequence_label: "SEQ-01" }
              as: ConformEditor
              captures: { turn_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/stage"
              payload: {}
              as: ConformEditor
            - call: "POST /post-production/projects/${proj_id}/vendor-bids"
              payload: { turnover_id: "${turn_id}", vendor_id: "${vendor_id}", bid_amount_cents: 1000000, eta_days: 5 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/vendor-bids/${bid_id}/award"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/issue"
              payload: {}
              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/ack"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/return"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { rr_auto: $.data.id }
            - call: "GET /post-production/projects/${proj_id}/review-rounds"
              payload: {}
              as: ReviewerLead
              captures:
                auto_rr_id: "$.data[0].id"
            - call: "POST /post-production/projects/${proj_id}/review-rounds/${auto_rr_id}/close-notes"
              payload: {}
              as: ReviewerLead
            - call: "POST /post-production/projects/${proj_id}/review-rounds/${auto_rr_id}/approve"
              payload: {}
              as: ReviewerLead
            - call: "POST /post-production/projects/${proj_id}/turnovers/${turn_id}/close"
              payload: {}
              as: PostSupervisor
          trigger:
            - call: "GET /post-production/vendors/${vendor_id}/load"
              payload: {}
              as: FacilityAdmin
              captures: { load_after: $.data.in_flight_count }
          assert:
            - "load_before == 0"
            - "load_after == 0"
            - "load_after == load_before   # slot conserved across the full lifecycle"

      - name: storage_conservation_across_purge
        grounds:
          - calculations.storage_used_gb
          - state_machines.MediaBatch.READY_to_PURGED
        distinguishing_aspect: |
          Conserved quantity: Project.storage_used_gb. Adding assets increases
          it; purging the batch returns it to its prior value. Different
          conserved quantity from vendor slots above (storage bytes vs
          concurrent turnover count). After purge, storage_used_gb MUST equal
          its pre-asset value.
        test_recipe:
          setup:
            - "Project P ACTIVE with storage_used_gb == 0 initially"
            - "Batch B with 2 assets (1 GiB + 0.5 GiB sources, 0.25 GiB + 0.125 GiB proxies) in READY"
