      - name: corner_ep_issue_dispatch_is_a_conditional_action_that_is_not_repeatable
        claim_type: Conditional action
        grounds:
          - endpoints["POST /issue-reports/{id}/dispatch"].side_effects
          - state_machines.IssueReport
          - entities.RepairOrder.fields.blocks_checkin
          - entities.Turnover.fields.blocking_repair_order_id
          - errors.ERR_INVALID_ISSUE_STATE
        distinguishing_aspect: |
          Dispatch is allowed only from a non-DISPATCHED, non-RESOLVED issue, and the optional
          blocks_checkin flag decides whether the dispatch reaches across aggregates: with
          blocks_checkin true it stamps the turnover's blocking_repair_order_id and drives the
          INCOMING booking's gate to BLOCKED with guest_notice_code CHECKIN_DELAYED, all inside the
          dispatch response's own transaction. A second dispatch of the same issue is 409, and it
          must not mint a second RepairOrder.
