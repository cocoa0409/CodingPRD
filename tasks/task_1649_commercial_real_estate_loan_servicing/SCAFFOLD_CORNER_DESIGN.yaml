            - { call: "POST /loans/${l_id}/reinstate", as: SpecialServicer, payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_ACTIVE_WATCHLIST_ENTRIES (second entry still ACTIVE)"
            - "loan remains SPECIAL_SERVICING"
      - name: lease_suite_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=19]"
        distinguishing_aspect: "Closed-interval suite occupancy: second lease on STE-300 overlapping [2026-09-01, 2027-08-31] -> 409 ERR_LEASE_SUITE_OVERLAP; same dates on a different suite pass."
        test_recipe:
          setup: ["clean loan with property; lease1 STE-300 [2026-09-01, 2027-08-31] SUBMITTED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Suite Co", tax_id: "TX-SUI", contact_email: "sui@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
