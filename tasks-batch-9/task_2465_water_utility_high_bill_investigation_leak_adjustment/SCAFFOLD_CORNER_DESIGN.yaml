# =============================================================================
# §1.9 Scaffold Corner Design — task 2465 Water Utility High-Bill Investigation
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against this scaffold's §1.1-§1.7 surface. `section:` values are the guide's
# nine sections; `claim_type:` values are the snake_case forms of that section's
# own table rows. Corners already asserted by a §1.8 instance carry an
# `excluded_because:` stub and no test_recipe.
#
# Shared fixture vocabulary (every recipe builds its own state from empty DB):
#   RS-STD-2026 = base 1200 / tier1 <=3000 @350 per kgal / tier2 <=10000 @520 /
#     tier3 @890 / summer surcharge 1500 bp on the tier-3 line only /
#     sewer 610 per kgal capped at 12000 gal / submeter sewer credit cap 8000 gal /
#     admin fee 1500 waived below 10000 cents of gross credit.
#   Pinned SUMMER charge totals (water / sewer / total, cents):
#     4000 gal -> 2770 / 2440 / 5210      8000 gal -> 4850 / 4880 / 9730
#     12000 gal -> 7937 / 7320 / 15257    41000 gal -> 37619 / 7320 / 44939
#   Workflow constants: BILL_DUE_DAYS 21, SHUTOFF_NOTICE_DAYS 10,
#     MAX_EVIDENCE_ROUNDS 3, REMAND_MAX 1, APPEAL_FILING_DAYS 30,
#     HEARING_MIN_NOTICE_DAYS 10, HEARING_DOCKET_CAPACITY 3,
#     METER_TEST_DEPOSIT_CENTS 3000, METER_TEST_QUARANTINE_HOURS 48.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: corner_entity_creation_service_account_echoes_input_and_seeds_state
        claim_type: creation
        grounds:
          - endpoints[POST /service-accounts]
          - entities.ServiceAccount
          - response_envelope.success
        distinguishing_aspect: |
          A create with every required field returns 201 and a body carrying both the echoed
          inputs and the seeded system/computed state: service_status ACTIVE, credit_status
          CURRENT, balance_cents 0, both hold counters 0, version 1 and a null
          shutoff_scheduled_for. An implementation that persists the row but leaves the derived
          fields unset, or starts version at 0, fails.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z and RateSchedule RS-STD-2026 exists; no ServiceAccount exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2001", customer_name: "Ines Bakke", service_address: "4 Willow Ct", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type object"
            - "ServiceAccount.${acct_id}.account_number == ACC-2001, customer_name == Ines Bakke, service_address == 4 Willow Ct, rate_schedule_id == ${rs_id}"
            - "ServiceAccount.${acct_id}.service_status == ACTIVE and credit_status == CURRENT"
            - "ServiceAccount.${acct_id}.balance_cents == 0, open_investigation_hold_count == 0, open_rebill_count == 0, shutoff_scheduled_for == null"
            - "ServiceAccount.${acct_id}.version == 1 and id, created_at and updated_at are all present and non-null"

      - name: corner_entity_retrieval_bill_get_returns_the_same_computed_charges
        claim_type: retrieval
        grounds:
          - endpoints[GET /bills/{id}]
          - entities.Bill
        distinguishing_aspect: |
          GET /bills/{id} must return the persisted computed charges, not recompute them from
          the caller's query: every charge field matches the create response to the cent, and
          the baseline fields are null because this is the account's only SUMMER bill. An
          implementation that recomputes on read and silently drifts, or that omits the null
          baseline fields from the payload, fails.
        test_recipe:
          setup:
            - "RS-STD-2026, BillingPeriod 2025-06 (SUMMER, 2025-06-01..2025-06-30) and ServiceAccount ACC-2002 with master meter MTR-B-1 exist."
            - "Two ACTUAL reads bracket the period: 100000 on 2025-05-31 and 104000 on 2025-06-30, so the period consumed 4000 gallons."
            - "A DRAFT bill for that meter and period exists; it is the account's only bill, so no same-season history feeds a baseline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2002", customer_name: "Petra Lund", service_address: "9 Birch Way", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-B-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
          trigger:
            - call: "GET /bills/${bill_id}"
              as: CustomerServiceRep
          assert:
            - "HTTP 200 and Bill.${bill_id}.account_id == ${acct_id}, period_id == ${p1_id}, meter_id == ${meter_id}"
            - "Bill.${bill_id}.consumption_gallons == 4000, water_charge_cents == 2770, sewer_charge_cents == 2440, total_charge_cents == 5210, adjusted_total_cents == 5210"
            - "Bill.${bill_id}.sewer_billable_gallons == 4000 and submeter_credit_gallons == 0"
            - "Bill.${bill_id}.seasonal_baseline_gallons == null, baseline_sample_count == 0, anomaly_ratio == null, anomaly_flag == false"
            - "Bill.${bill_id}.billing_status == DRAFT, rebill_of_bill_id == null, due_date == 2025-07-21, version == 1"

      - name: corner_entity_listing_billing_periods_pagination_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /billing-periods]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With five periods on file, limit 2 offset 0 returns 2 rows with total_count 5 and
          has_more true; offset 4 returns the single tail row with has_more false; and omitting
          both params returns all 5 under the default limit 10 with has_more false. total_count
          must count the whole filtered set, not the returned page — an implementation that
          reports total_count 2 on the first page fails.
        test_recipe:
          setup:
            - "Exactly five non-overlapping BillingPeriods exist: 2025-05, 2025-06, 2025-07, 2025-08 and 2026-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-05", start_date: "2025-05-01", end_date: "2025-05-31", season: "WINTER", rebilling_deadline_date: "2026-11-30" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2025-08", start_date: "2025-08-01", end_date: "2025-08-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
          trigger:
            - call: "GET /billing-periods?limit=2&offset=0"
              as: SystemAdmin
            - call: "GET /billing-periods?limit=2&offset=4"
              as: SystemAdmin
            - call: "GET /billing-periods"
              as: SystemAdmin
            - call: "GET /billing-periods?season=SUMMER&limit=2&offset=0"
              as: SystemAdmin
          assert:
            - "FIRST PAGE: 2 rows returned, total_count == 5, has_more == true, limit == 2, offset == 0, response_type == array"
            - "TAIL PAGE: 1 row returned, total_count == 5, has_more == false, offset == 4"
            - "NO PARAMS: 5 rows returned, total_count == 5, has_more == false and limit defaults to 10 with offset 0"
            - "FILTER PLUS PAGE: with season=SUMMER, 2 rows returned and total_count == 4 — the filter narrows total_count, and has_more == true"

      - name: corner_entity_not_found_unknown_path_ids_return_the_entity_specific_code
        claim_type: not_found
        grounds:
          - validations[ERR_INVESTIGATION_NOT_FOUND]
          - errors[ERR_BILL_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid but unknown path id returns 404 with the code named for THAT
          entity, not a generic ERR_NOT_FOUND: /investigations/{unknown} yields
          ERR_INVESTIGATION_NOT_FOUND while /bills/{unknown} yields ERR_BILL_NOT_FOUND, and the
          error envelope carries response_type error with data.error_id and data.message. An
          implementation that returns one shared code, or 400 for an unparseable id, fails.
        test_recipe:
          setup:
            - "The database holds no HighBillInvestigation and no Bill; only the clock has been set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /investigations/00000000-0000-0000-0000-0000000ffff1"
              as: CustomerServiceRep
            - call: "GET /bills/00000000-0000-0000-0000-0000000ffff2"
              as: BillingSupervisor
            - call: "GET /leak-adjustments/00000000-0000-0000-0000-0000000ffff3"
              as: BillingSupervisor
          assert:
            - "HTTP 404 with error_id ERR_INVESTIGATION_NOT_FOUND for the investigation read"
            - "HTTP 404 with error_id ERR_BILL_NOT_FOUND for the bill read"
            - "HTTP 404 with error_id ERR_LEAK_ADJUSTMENT_NOT_FOUND for the leak-adjustment read"
            - "Every response carries response_type error and a non-empty data.message alongside data.error_id"

      - name: corner_entity_required_fields_missing_meter_serial_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - endpoints[POST /meters]
          - entities.Meter.fields.meter_serial
        distinguishing_aspect: |
          Every non-optional name in an endpoint's input list is required: dropping meter_serial
          from POST /meters returns 400 ERR_INVALID_REQUEST at priority 3 and creates nothing,
          while dropping only the optional parent_meter_id succeeds. The refusal must land at
          priority 3 — before the priority-11 submeter-parent rule — so a POTABLE_MASTER body
          missing meter_serial still returns 400 rather than 422.
        test_recipe:
          setup:
            - "RS-STD-2026 and ServiceAccount ACC-2003 exist; the account has no meters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2003", customer_name: "Timo Kallio", service_address: "77 Spruce Row", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
            - call: "POST /meters"
              payload: { meter_serial: "MTR-C-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-C-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
          assert:
            - "MISSING meter_serial: HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "MISSING account_id: HTTP 400 with error_id ERR_INVALID_REQUEST — not 404, because priority 3 precedes the priority-5 FK check"
            - "COMPLETE BODY minus the optional parent_meter_id: HTTP 201 and Meter.${meter_id}.parent_meter_id == null"
            - "GET /meters?account_id=${acct_id} returns total_count 1 — neither refused body created a row"

      - name: corner_entity_defaults_omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.BillingPeriod.fields.status
          - entities.Meter.fields.accuracy_status
          - entities.Bill.fields.anomaly_flag
          - entities.HighBillInvestigation.fields.evidence_round_count
        distinguishing_aspect: |
          Omitting every optional input leaves each declared default in place: BillingPeriod
          status OPEN, Meter accuracy_status UNTESTED with accuracy_pct, correction_factor and
          last_test_completed_at all null, Bill anomaly_flag false and billing_status DRAFT with
          estimated_flag false derived from read_type ACTUAL. Defaults must come from the
          declarations, not from a caller-supplied body — none of these names appear in any
          endpoint's input list.
        test_recipe:
          setup:
            - "RS-STD-2026 exists and the clock is 2026-08-01T00:00:00Z; nothing else has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2004", customer_name: "Rina Okoye", service_address: "18 Alder Pl", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-D-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
              captures: { read_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
          assert:
            - "BillingPeriod.${p1_id}.status == OPEN"
            - "Meter.${meter_id}.accuracy_status == UNTESTED with accuracy_pct == null, correction_factor == null and last_test_completed_at == null"
            - "MeterReading.${read_id}.superseded_by_reading_id == null and corrects_reading_id == null"
            - "Bill.${bill_id}.billing_status == DRAFT, anomaly_flag == false and estimated_flag == false even though estimated_flag was omitted"
            - "Bill.${bill_id}.consumption_gallons == 4000 — derived from initial_register_value 100000 as the prior anchor"

      - name: corner_entity_computed_fields_charge_fields_derive_from_reads_not_from_the_body
        claim_type: computed_fields
        grounds:
          - entities.Bill.fields.consumption_gallons
          - calculations.tiered_water_charge
          - calculations.sewer_charge_with_submeter_credit
          - endpoints[POST /bills]
        distinguishing_aspect: |
          POST /bills accepts no volume and no charge field, so every money field must be derived
          from the live reads bounding the period: the same endpoint body produces 4000 gallons
          and 5210 cents on one period and 8000 gallons and 9730 cents on the next, purely from
          the register deltas. An implementation that trusts a caller-supplied consumption, or
          that reuses the first period's charges, fails.
        test_recipe:
          setup:
            - "RS-STD-2026, BillingPeriods 2025-06 and 2025-07 (both SUMMER) and ServiceAccount ACC-2005 with master meter MTR-E-1 exist."
            - "Reads 100000 (2025-05-31), 104000 (2025-06-30) and 112000 (2025-07-31) give 4000 gallons in June and 8000 in July."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-2005", customer_name: "Odile Marchand", service_address: "23 Elm Bend", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-E-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-07-31", read_type: "ACTUAL", reading_value: 112000 }
              as: MeterTechnician
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_jun_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p2_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_jul_id: $.data.id }
          assert:
            - "JUNE: Bill.${bill_jun_id}.consumption_gallons == 4000, water_charge_cents == 2770 (1200 base + 1050 tier1 + 520 tier2, no tier-3 line so no surcharge)"
            - "JUNE: Bill.${bill_jun_id}.sewer_charge_cents == 2440, sewer_billable_gallons == 4000, total_charge_cents == 5210"
            - "JULY: Bill.${bill_jul_id}.consumption_gallons == 8000, water_charge_cents == 4850 (1200 + 1050 + 2600), sewer_charge_cents == 4880, total_charge_cents == 9730"
            - "Both bills report submeter_credit_gallons == 0 — the account has no irrigation submeter"
            - "Both bills report adjusted_total_cents equal to their total_charge_cents, since no LeakAdjustment is POSTED against either"

      - name: corner_entity_system_fields_bill_due_date_and_version_are_server_assigned
        claim_type: system_fields
        grounds:
          - entities.Bill.fields.due_date
          - entities.Bill.fields.billing_status
          - state_machines.Bill
          - endpoints[POST /bills/{id}/issue]
        distinguishing_aspect: |
          due_date, billing_status, rebill_of_bill_id, id, created_at, updated_at and version are
          all server-assigned: due_date is period.end_date plus BILL_DUE_DAYS 21 calendar days
          (2025-06-30 -> 2025-07-21) regardless of when the bill is generated at the 2026-08-01
          clock, and version advances from 1 to 2 across the issue action while created_at stays
          fixed. An implementation that anchors due_date on clock_now fails.
        test_recipe:
          setup:
            - "RS-STD-2026, BillingPeriod 2025-06 (2025-06-01..2025-06-30) and ServiceAccount ACC-2006 with master meter MTR-F-1 and reads 100000 / 104000 exist."
            - "The clock is 2026-08-01T00:00:00Z, thirteen months after the period ended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
