scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_generator_returns_201_with_defaults
        claim_type: creation
        grounds: ["entities.Generator"]
        distinguishing_aspect: "POST /api/generators with all required fields returns 201; system fields id/created_at/updated_at/version present; computed defaults total_credits == 0.0 and credit_tier == STANDARD applied."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
          assert:
            - "HTTP 201; response data.id is a server-minted UUID"
            - "Generator.${g_id}.total_credits == 0.0 and credit_tier == STANDARD"
            - "Generator.${g_id}.version == 1"

      - name: get_shipment_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Shipment", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent shipment id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/shipments/11111111-2222-3333-4444-555555555555", payload: {}, as: BrokerOps, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"

      - name: create_stream_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.ByproductStream", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input material_type yields 400 ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["one generator exists"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
          trigger:
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: create_stream_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.ByproductStream.fields.material_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "material_type outside {FLY_ASH, SLAG, GYPSUM, FOUNDRY_SAND, BIOSOLIDS} is rejected with 400."
        test_recipe:
          setup: ["one generator exists"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
          trigger:
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "UNOBTANIUM", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: create_generator_with_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Generator.fields.total_credits"]
        distinguishing_aspect: "Client-supplied computed/system fields (total_credits) in the create body are ignored, not stored and not rejected; the created generator still reads total_credits == 0.0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com", total_credits: 999 }, as: BrokerOps, captures: { g_id: $.data.id } }
          assert:
            - "HTTP 201 and Generator.${g_id}.total_credits == 0.0 (input value 999 ignored)"

      - name: price_index_entry_immutable_common_fields_false
        claim_type: immutability
        grounds: ["entities.MarketPriceIndex"]
        distinguishing_aspect: "MarketPriceIndex has common_fields false: the create response carries id and created_at but no updated_at or version, and no update/delete endpoint exists for the entity."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps, captures: { p_idx: $.data.id } }
          assert:
            - "HTTP 201; response data has id and created_at but no version and no updated_at"
            - "published_by_user_id equals the acting BrokerOps X-User-ID"

      - name: list_shipments_pagination_limit_offset
        claim_type: listing
        grounds: ["entities.Shipment", "response_envelope"]
        distinguishing_aspect: "With 3 shipments, GET /api/shipments?limit=2 returns 2 items with total_count == 3 and has_more == true; offset=2 returns the final item with has_more == false."
        test_recipe:
          setup: ["booking-ready chain (agreement committed 1000 ACTIVE, commitment committed 1000 ACTIVE, index 300) with three 10 t bookings"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 1000, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v1: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 1000, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v1}" }, as: Generator, as_user_id: "${g_id}" }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v2: $.data.version } }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-06", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v2}" }, as: Generator, as_user_id: "${g_id}" }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v3: $.data.version } }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-07", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v3}" }, as: Generator, as_user_id: "${g_id}" }
          trigger:
            - { call: "GET /api/shipments?limit=2&offset=0", payload: {}, as: BrokerOps }
            - { call: "GET /api/shipments?limit=2&offset=2", payload: {}, as: BrokerOps }
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): exactly 1 item, total_count == 3, has_more == false"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: accept_from_booked_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Shipment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPT is declared only from DELIVERED; calling accept on a BOOKED shipment returns 409 ERR_INVALID_STATE and no settlement/credit side effects fire."
        test_recipe:
          setup: ["booking-ready chain with one 10 t shipment BOOKED"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 100, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "Shipment.${sh_id}.status remains BOOKED and final_gross_revenue_cents remains null"
            - "GET /api/shipments/${sh_id}/credit-entries returns total_count == 0"

      - name: dispatch_from_cancelled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Shipment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal; dispatch on a cancelled shipment returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["booking-ready chain with one shipment BOOKED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 100, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/cancel", payload: {}, as: Generator, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "Shipment.${sh_id}.status remains CANCELLED"

      - name: second_accept_rejected_idempotency_attempt
        claim_type: idempotency
        grounds: ["state_machines.Shipment.DELIVERED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the accept trigger on an already ACCEPTED shipment fails with ERR_INVALID_STATE; the credit entry is posted exactly once."
        test_recipe:
          setup: ["dispatch-ready chain with one 10 t shipment DELIVERED in-spec (moisture 8.0)"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/state-permits", payload: { state_code: "PA", material_type: "FLY_ASH", regime: "PERMIT", permit_number: "PA-001", issued_on: "2026-01-01", expires_on: "2026-12-31" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { p_id: $.data.id } }
            - { call: "POST /api/state-permits/${p_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 100, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${sh_id}/deliver", payload: { destination_moisture_pct: 8.0, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "POST /api/shipments/${sh_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "GET /api/shipments/${sh_id}/credit-entries still returns exactly 1 ACCRUAL entry of 10.0 credits"

      - name: characterization_verify_bubbles_stream_to_characterized
        claim_type: side_effect_execution
        grounds: ["state_machines.CharacterizationProfile.SUBMITTED_to_VERIFIED", "state_machines.ByproductStream.DRAFT_to_CHARACTERIZED"]
        distinguishing_aspect: "Verifying the characterization moves it SUBMITTED -> VERIFIED and bubbles the owning stream DRAFT -> CHARACTERIZED in the same request."
        test_recipe:
          setup: ["generator + DRAFT stream + SUBMITTED characterization"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "SLAG", declared_moisture_pct: 5.0, expected_tons_per_month: 300 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.5, arsenic_ppm: 2.0, lead_ppm: 1.0, moisture_pct_measured: 5.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
          assert:
            - "CharacterizationProfile.${c_id}.status == VERIFIED (initial state was SUBMITTED)"
            - "ByproductStream.${s_id}.status == CHARACTERIZED"

      - name: suspend_expired_determination_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ReuseEligibility.APPROVED_to_EXPIRED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After the clock passes valid_until the determination is EXPIRED (terminal); suspend on it returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["GYPSUM stream CHARACTERIZED; determination APPROVED with window [2026-01-01, 2026-08-10); clock advanced to 2026-08-11"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "GYPSUM", declared_moisture_pct: 6.0, expected_tons_per_month: 200 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.0, arsenic_ppm: 1.0, lead_ppm: 1.0, moisture_pct_measured: 6.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
