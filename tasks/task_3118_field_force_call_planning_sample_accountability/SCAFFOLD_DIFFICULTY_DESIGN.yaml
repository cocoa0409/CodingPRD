            - call: "POST /field-force/temperature-excursions"
              payload: { product_id: "${p_id}", location_type: "HOME_OFFICE", observed_temp_c: 15.0, excursion_minutes: 45 }
              as: FieldRep
              as_user_id: "${s_id}"
              captures: { ex_id: $.data.id }
            - call: "POST /field-force/temperature-excursions/${ex_id}/assess"
              payload: {}
              as: QualityAssurance
          trigger:
            - call: "POST /field-force/sample-transfers"
              payload: { to_rep_id: "${v_id}", lot_id: "${lot_id}", quantity: 5, reason_code: "REBALANCE", documentation_note: "Transfer while lot quarantined and stale", expected_lot_version: "${lot_v0}" }
              as: FieldRep
