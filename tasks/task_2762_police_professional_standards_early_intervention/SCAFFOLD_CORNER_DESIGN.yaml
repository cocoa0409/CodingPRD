      - name: activity_event_is_immutable_with_no_version_and_no_write_back_route
        claim_type: Immutability
        grounds:
          - entities.OfficerActivityEvent.fields.officer_id
          - entities.OfficerActivityEvent.fields.base_weight
          - entities.OfficerActivityEvent.fields.weekday_index
          - endpoints["POST /officers/{id}/activity-events"]
          - endpoints["GET /officers/{id}/activity-events"]
        distinguishing_aspect: |
          OfficerActivityEvent is declared `common_fields: false`, so it carries no version
          and no updated_at, and §1.5 declares exactly two routes for it: an append and a
          list. The event is therefore append-only — the ledger it feeds can only be changed
          by adding rows, never by editing one — and its derived base_weight and
          weekday_index are frozen at append time from the event_type, severity_code and
          occurred_at supplied then.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One PATROL_DIVISION unit holds Officer Bell (assignment_type PATROL)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-041", full_name: "Officer Bell", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 8000000, demographic_code: "DG_A", hire_date: "2020-01-06T00:00:00Z" }
              as: SystemAdmin
              captures: { bell_id: $.data.id }
          trigger:
            - call: "POST /officers/${bell_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-07-15T20:00:00Z", source_reference: "UOF-2026-0142" }
              as: Supervisor
              as_user_id: "${bell_id}"
              captures: { ev_id: $.data.id }
            - call: "GET /officers/${bell_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE" }
              as: IACommander
              as_user_id: "${bell_id}"
          assert:
            - "HTTP 201 on the append; data.officer_id == ${bell_id} and data.source_reference == UOF-2026-0142"
            - "data.base_weight == 4.5 (USE_OF_FORCE base 3 times the LEVEL_2 multiplier 1.5)"
            - "data.weekday_index == 2 (2026-07-15 is a Wednesday in UTC)"
            - "data.system_generated == false"
            - "the response body carries no version key and no updated_at key, because the entity declares common_fields false"
            - "§1.5 declares no PATCH, PUT or DELETE route for activity events; the only write route is the append used here"
            - "the list call returns total_count == 1 and data[0].id == ${ev_id} with base_weight still 4.5"

      - name: allegation_parent_and_body_references_must_resolve_or_return_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Allegation.fields.complaint_id
