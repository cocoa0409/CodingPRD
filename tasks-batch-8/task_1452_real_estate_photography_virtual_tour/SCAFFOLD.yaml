    output: LicenseGrant
    side_effects: ["tour -> UNPUBLISHED"]

  # --- RescheduleEvent ---
  - method: GET
    path: "/shoot-bookings/{id}/reschedule-events"
    description: "List reschedule history for a booking (append-only)"
    roles: [ClientAgent, Photographer, Coordinator, OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "kind?"]
    output: "RescheduleEvent[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed identity mismatch (agent/photographer acting on a resource they do not own/are not assigned to)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist or parent chain mismatched" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or malformed input" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (from-state not permitted for trigger)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_booking_version does not match current ShootBooking.version (OCC)" }
  - { id: ERR_BOOKING_NOT_IN_DRAFT, http: 409, condition: "submit requires DRAFT" }
  - { id: ERR_BOOKING_NOT_READY, http: 409, condition: "assign requires READY" }
  - { id: ERR_BOOKING_NOT_ASSIGNED, http: 409, condition: "confirm/unassign requires ASSIGNED (or AUTHORIZATION_PENDING for unassign)" }
  - { id: ERR_BOOKING_NOT_CONFIRMED, http: 409, condition: "mark-shot requires CONFIRMED" }
  - { id: ERR_BOOKING_NOT_IN_EDIT, http: 409, condition: "deliver requires IN_EDIT or REVISION_REQUESTED" }
  - { id: ERR_BOOKING_NOT_DELIVERED, http: 409, condition: "accept/revision-create requires DELIVERED" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "cancel not allowed from current state" }
  - { id: ERR_BOOKING_NOT_RESCHEDULABLE, http: 409, condition: "reschedule not allowed from current state" }
  - { id: ERR_MARKET_SUSPENDED, http: 409, condition: "market is SUSPENDED at submit time" }
  - { id: ERR_SLOT_TOO_SOON, http: 422, condition: "scheduled/new start is < now + 24h" }
  - { id: ERR_INVALID_SLOT_ALIGNMENT, http: 422, condition: "scheduled start not on a quarter-hour boundary" }
  - { id: ERR_OUTSIDE_SHOOT_WINDOW, http: 422, condition: "mark-shot outside [start-2h, end+24h]" }
  - { id: ERR_INSIDE_CANCELLATION_CUTOFF, http: 422, condition: "CONFIRMED cancel attempted inside 12h pre-start cutoff" }
  - { id: ERR_PHOTOGRAPHER_NOT_ELIGIBLE, http: 422, condition: "photographer INACTIVE or wrong market" }
  - { id: ERR_EQUIPMENT_MISMATCH, http: 422, condition: "photographer lacks booking equipment_package" }
  - { id: ERR_DRONE_CERT_REQUIRED, http: 422, condition: "drone add-on present but photographer not drone_certified" }
  - { id: ERR_PHOTOGRAPHER_DOUBLE_BOOKED, http: 409, condition: "proposed window (with travel buffer, or twilight exclusivity) collides with an existing assignment" }
  - { id: ERR_DAY_CAPACITY_EXCEEDED, http: 409, condition: "adding shoot minutes would push photographer's day over max_shoot_minutes_per_day (strictly greater triggers)" }
  - { id: ERR_PHOTOGRAPHER_HAS_OPEN_COMMITMENTS, http: 409, condition: "cannot deactivate photographer with bookings in ASSIGNED/AUTHORIZATION_PENDING/CONFIRMED" }
  - { id: ERR_DUPLICATE_DRONE_ADDON, http: 409, condition: "second ACTIVE drone add-on on one booking" }
  - { id: ERR_TWILIGHT_CONFLICT, http: 409, condition: "TWILIGHT_UPGRADE on a booking already flagged twilight, or slot exclusivity violated" }
  - { id: ERR_ADDON_NOT_CANCELLABLE, http: 409, condition: "add-on not ACTIVE or booking already SHOT" }
  - { id: ERR_AUTHORIZATION_PENDING, http: 409, condition: "confirm attempted while drone authorization unresolved" }
  - { id: ERR_AUTHORIZATION_NOT_PENDING, http: 409, condition: "approve/reject requires PENDING" }
  - { id: ERR_AUTHORIZATION_NOT_REJECTED, http: 409, condition: "resubmit requires REJECTED" }
  - { id: ERR_AUTHORIZATION_ATTEMPTS_EXHAUSTED, http: 409, condition: "resubmit would exceed attempt_number cap of 3" }
  - { id: ERR_AUTHORIZATION_WINDOW_LAPSED, http: 422, condition: "approve attempted after window_end_utc" }
  - { id: ERR_AUTHORIZATION_STILL_VALID, http: 409, condition: "unassign blocked while an APPROVED authorization covers the current window" }
  - { id: ERR_RESCHEDULE_CAP_EXCEEDED, http: 409, condition: "reschedule_count already 3; further reschedule attempts route to cancellation" }
  - { id: ERR_INVALID_REASON_CODE, http: 422, condition: "reason_code inconsistent with reschedule kind" }
  - { id: ERR_QUALITY_GUARANTEE_SHORTFALL, http: 422, condition: "deliver with photo_asset_count < booking.photo_count" }
  - { id: ERR_TOUR_ASSET_MISSING, http: 422, condition: "deliver without tour_asset_url while wants_virtual_tour" }
  - { id: ERR_REVISION_WINDOW_CLOSED, http: 422, condition: "revision created at or after revision_window_closes_utc (strictly-before boundary)" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "revisions_used already 4" }
  - { id: ERR_REVISION_NOT_OPEN, http: 409, condition: "claim requires OPEN" }
  - { id: ERR_OPEN_REVISIONS_EXIST, http: 409, condition: "accept blocked by OPEN/IN_PROGRESS revision" }
  - { id: ERR_UNBRANDED_REQUIRES_MLS_TIER, http: 422, condition: "UNBRANDED tour acceptance requires license_tier == MLS_COMPLIANT" }
  - { id: ERR_TOUR_NOT_PUBLISHED, http: 409, condition: "suspend/unpublish requires PUBLISHED (or SUSPENDED for unpublish)" }
  - { id: ERR_TOUR_NOT_SUSPENDED, http: 409, condition: "resume requires SUSPENDED" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "operation requires license ACTIVE" }
  - { id: ERR_LICENSE_NOT_SUSPENDED, http: 409, condition: "reinstate requires SUSPENDED" }
  - { id: ERR_INVOICE_INCONSISTENT, http: 422, condition: "final invoice computation violated a fiscal invariant" }
  - { id: ERR_CHECKLIST_ITEM_IMMUTABLE, http: 409, condition: "checklist patch attempted once the booking has reached SHOT or any later state (items are client-editable in DRAFT, AWAITING_READINESS, READY, ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED so readiness can be re-attested after a reschedule)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClientAgent
    description: "Real-estate agent who books shoots, attests readiness, requests revisions, accepts delivery"
    identity: "entity_backed:ClientAgent"
    exclusive_operations:
      - "POST /shoot-bookings"
      - "PATCH /shoot-bookings/{id}"
      - "POST /shoot-bookings/{id}/submit"
      - "POST /shoot-bookings/{id}/cancel"
      - "POST /shoot-bookings/{id}/reschedule"
      - "PATCH /shoot-bookings/{id}/checklist-items/{itemId}"
      - "POST /shoot-bookings/{id}/addons"
      - "POST /shoot-bookings/{id}/addons/{addonId}/cancel"
      - "POST /shoot-bookings/{id}/revisions"
      - "POST /shoot-bookings/{id}/accept"
    shared_operations:
      - "GET on markets, photographers, own bookings, checklist items, addons, authorizations, bundles, revisions, tour, license, reschedule-events"

  - name: Photographer
    description: "Shoots assigned bookings and delivers edited bundles; claims revisions"
    identity: "entity_backed:Photographer"
    exclusive_operations:
      - "POST /shoot-bookings/{id}/mark-shot"
      - "POST /shoot-bookings/{id}/deliver"
      - "POST /shoot-bookings/{id}/revisions/{revisionId}/claim"
    shared_operations:
      - "GET on markets, photographers, own assigned bookings, checklist items, addons, authorizations, bundles, revisions, tour, license, reschedule-events"

  - name: Coordinator
    description: "Market operations coordinator: assigns/unassigns photographers, confirms bookings, resubmits authorizations"
    identity: "opaque"
    exclusive_operations:
      - "POST /shoot-bookings/{id}/assign"
      - "POST /shoot-bookings/{id}/unassign"
      - "POST /shoot-bookings/{id}/confirm"
      - "POST /shoot-bookings/{id}/airspace-authorizations/{authId}/resubmit"
    shared_operations:
      - "All GET endpoints; POST /client-agents shared with OpsAdmin"

  - name: OpsAdmin
    description: "Platform operator: markets, photographers, agents, airspace decisions, tour/license governance, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /markets; PATCH /markets/{marketId}"
      - "POST /photographers; PATCH /photographers/{photographerId}"
      - "POST /shoot-bookings/{id}/airspace-authorizations/{authId}/approve|reject"
      - "POST /shoot-bookings/{id}/revisions/{revisionId}/dismiss"
      - "POST /shoot-bookings/{id}/virtual-tour/suspend|resume|unpublish"
      - "POST /shoot-bookings/{id}/license/suspend|reinstate|revoke"
    shared_operations:
      - "All GET endpoints; POST /client-agents shared with Coordinator"
