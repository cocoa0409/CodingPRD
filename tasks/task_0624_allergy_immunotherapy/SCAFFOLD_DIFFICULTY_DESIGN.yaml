  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_activate_requires_panel_finalized
        grounds:
          - state_machines.ImmunotherapyPlan.DRAFT_to_ACTIVE
          - state_machines.DiagnosticPanel.OPEN_to_FINALIZED
          - errors[ERR_PANEL_NOT_FINALIZED]
        distinguishing_aspect: |
          ImmunotherapyPlan's DRAFT->ACTIVE transition depends on the linked DiagnosticPanel
          being FINALIZED (entity pair Plan->Panel). Plan referencing an OPEN panel cannot
          activate.
        test_recipe:
          setup:
            - "A DRAFT plan whose panel is still OPEN (panel never finalized — note: plan creation itself requires a FINALIZED panel, so this instance finalizes, creates the plan, but exercises activation against a SECOND plan built when the panel was finalized then... )"
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Mora", date_of_birth: "1986-03-03", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "OpenPanel", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
          trigger:
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { err: $.data.error_id }
          trigger_note: "Plan creation already enforces the cross-entity dependency: an OPEN (non-FINALIZED) panel cannot back a plan, so the dependency surfaces at creation with ERR_PANEL_NOT_FINALIZED before any activate call."
          assert:
            - "Response status 409 with data.error_id == ERR_PANEL_NOT_FINALIZED (Plan create/activate gated on linked DiagnosticPanel.status == FINALIZED)."

      - name: shot_visit_requires_lot_not_recalled
        grounds:
          - state_machines.ShotVisit.NEW_to_ADMINISTERED
          - state_machines.SerumLot.AVAILABLE_to_RECALLED
          - validations[priority=9]
          - errors[ERR_VIAL_NOT_USABLE]
        distinguishing_aspect: |
          ShotVisit's administration depends on the backing SerumLot's state via the vial
          (entity pair ShotVisit->SerumLot, distinct from Plan->Panel): once the lot is
          RECALLED the vial is DISCARDED and a shot is rejected ERR_VIAL_NOT_USABLE.
        test_recipe:
          setup:
            - "An ACTIVE plan whose only RED vial's backing lot has just been recalled (vial now DISCARDED, plan HELD)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Qi Noll", date_of_birth: "1989-04-04", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Recalled", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-A10", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /serum-lots/${lot_id}/recall"
              payload: {}
              as: Pharmacist
            - call: "GET /immunotherapy-plans/${plan_id}"
              payload: {}
              as: Allergist
              captures: { plan_v_held: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/resume"
              payload: { expected_plan_version: "${plan_v_held}" }
              as: Allergist
              captures: { plan_v_active: $.data.version }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v_active}" }
              as: Nurse
              captures: { err: $.data.error_id }
          trigger_note: "Resume (patient has epinephrine_on_file true) returns the plan to ACTIVE so the shot-visit reaches the vial-usability check; resume uses the held version captured via GET, and the shot uses the resumed version. The DISCARDED vial then fails ERR_VIAL_NOT_USABLE."
          assert:
            - "Response status 422 with data.error_id == ERR_VIAL_NOT_USABLE (ShotVisit administration gated on backing SerumLot not RECALLED / vial not DISCARDED)."

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: observation_window_blocks_premature_release
        grounds:
          - calculations.observation_window
          - validations[priority=12]
          - errors[ERR_OBSERVATION_NOT_ELAPSED]
          - entities.ShotVisit.fields.released_at_iso
        distinguishing_aspect: |
          The ShotVisit occupies a mandatory [administered_at, administered_at + window)
          observation interval; a release whose released_at_iso falls strictly inside the
          interval (29 of 30 min elapsed) collides with the still-open window and is rejected.
          Interval semantics: half-open lower-bounded minimum-duration interval on ShotVisit.
        test_recipe:
          setup:
            - "An ADMINISTERED shot at 2026-06-01T09:00:00Z with a 30-minute standard observation window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Nurse
            - call: "POST /patients"
