# =============================================================================
# 1.9 Scaffold Corner Design - Breadth Claim Index
# Task 2602: Mortgage Loan Originator Licensing & Compensation Compliance
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md (nine sections). Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 only. The logical clock starts at 2026-08-01T00:00:00Z
# and is moved only through POST /_clock/set_current_utc.
# Operator user ids used throughout: analyst-1 (LicensingAnalyst),
# designer-1 (CompensationDesigner), officer-1 / officer-2 (ComplianceOfficer),
# ops-1 (LoanOperations), exam-1 (ExaminationCoordinator), admin-1 (PlatformAdmin).
# Originator-role calls always present X-User-ID == the Originator.id they act on.
#
# Names are unique across the union of SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# and this file. Corners already asserted by a §1.8 instance carry an
# `excluded_because:` stub and no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: originator_creation_returns_full_row_with_zeroed_ledger
        claim_type: creation
        grounds:
          - endpoints[POST /originators]
          - entities.Originator.fields.nmls_unique_id
          - entities.Originator.fields.net_compensation_cents
        distinguishing_aspect: |
          A POST /originators carrying every declared input field returns 201 with the four
          input fields echoed and all nine computed/system fields at their declared zero
          state: monitoring_status STANDARD, exposure_score 0, both ledger totals 0,
          net_compensation_cents 0, authorized_state_codes [], open_investigation_count 0,
          compensation_plan_id null, version 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z", employment_status: "EMPLOYED" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id, emp: $.data.employment_status, mon: $.data.monitoring_status, score: $.data.exposure_score, accrued: $.data.lifetime_accrued_cents, clawed: $.data.lifetime_clawed_back_cents, net: $.data.net_compensation_cents, states: $.data.authorized_state_codes, inv: $.data.open_investigation_count, plan: $.data.compensation_plan_id, ver: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${orig_id} is a non-empty string"
            - "${emp} == EMPLOYED"
            - "${mon} == STANDARD"
            - "${score} == 0"
            - "${accrued} == 0 and ${clawed} == 0 and ${net} == 0"
            - "${states} == [] (empty array - no licence exists yet)"
            - "${inv} == 0"
            - "${plan} == null"
            - "${ver} == 1"

      - name: license_registration_get_returns_stored_row_in_pending
        claim_type: retrieval
        grounds:
          - endpoints[GET /license-registrations/{id}]
          - entities.LicenseRegistration.fields.status
          - entities.LicenseRegistration.fields.authority_effective_at
        distinguishing_aspect: |
          GET /license-registrations/{id} returns exactly the six input fields as filed plus
          status PENDING, authority_effective_at null, ce_hours_applied 0, ce_satisfied false,
          active_sponsoring_institution_code null and reinstatement_count 0 - the read never
          activates or mutates the row.
        test_recipe:
          setup:
            - "One Originator (NMLS 2200001) and one CA LicenseRegistration filed but not yet activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026, required_ce_hours: 8 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
          trigger:
            - call: "GET /license-registrations/${lic_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, sc: $.data.state_code, num: $.data.license_number, aea: $.data.authority_effective_at, hrs: $.data.ce_hours_applied, sat: $.data.ce_satisfied, spons: $.data.active_sponsoring_institution_code, rc: $.data.reinstatement_count, req: $.data.required_ce_hours }
          assert:
            - "HTTP status is 200"
            - "${st} == PENDING"
            - "${sc} == CA and ${num} == CA-DFPI-70001"
            - "${aea} == null"
            - "${hrs} == 0 and ${sat} == false"
            - "${spons} == null"
            - "${rc} == 0"
            - "${req} == 8"

      - name: compensation_records_list_filters_by_originator_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /compensation-records]
          - response_envelope.pagination_fields
          - entities.CompensationRecord.fields.accrued_cents
        distinguishing_aspect: |
          Two closed loans produce two PROVISIONAL CompensationRecord rows (210000 and 105000
          cents); GET /compensation-records?originator_id=&limit=1 reports total_count 2 with
          has_more true on offset 0 and has_more false on offset 1, one row per page.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE, sponsored CA licence and the ACTIVE plan
               `Retail Base 2026` (base_basis_points 105, volume tier off) assigned for
               2026-08-01..2026-12-31."
            - "Two loans closed: locked/funded 20000000 cents -> accrued 210000, and
               locked/funded 10000000 cents -> accrued 105000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Retail Base 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, salary_cents_per_period: 0, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Reg Z 1026.36(d) review complete." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BR-1001", product_type: "FIXED_30", requested_amount_cents: 20000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan1: $.data.id }
            - call: "POST /loan-applications/${loan1}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 20000000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan1}/close"
              payload: { funded_amount_cents: 20000000, funded_at: "2026-08-20T00:00:00Z", lender_paid_comp_cents: 210000, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BR-1002", product_type: "FIXED_15", requested_amount_cents: 10000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan2: $.data.id }
            - call: "POST /loan-applications/${loan2}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 10000000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan2}/close"
              payload: { funded_amount_cents: 10000000, funded_at: "2026-08-21T00:00:00Z", lender_paid_comp_cents: 105000, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
          trigger:
            - call: "GET /compensation-records"
              payload: { originator_id: "${orig_id}", limit: 1, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p0_amt: "$.data[0].accrued_cents", p0_var: "$.data[0].variant", tc0: $.total_count, hm0: $.has_more }
            - call: "GET /compensation-records"
              payload: { originator_id: "${orig_id}", limit: 1, offset: 1 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p1_amt: "$.data[0].accrued_cents", tc1: $.total_count, hm1: $.has_more }
          assert:
            - "${tc0} == 2 and ${tc1} == 2"
            - "${hm0} == true"
            - "${hm1} == false"
            - "each page carries exactly 1 element in data"
            - "the multiset {${p0_amt}, ${p1_amt}} == {210000, 105000}"
            - "${p0_var} == PROVISIONAL"

      - name: get_originator_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          A GET /originators/{id} for an id that was never minted returns 404
          ERR_RESOURCE_NOT_FOUND, not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /originators/orig-does-not-exist"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == ERR_RESOURCE_NOT_FOUND"
            - "no Originator row is created by the failed read"

      - name: create_license_registration_without_expiration_date_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=7]
          - entities.LicenseRegistration.fields.expiration_date
        distinguishing_aspect: |
          expiration_date is `source: input` with no default, so omitting it from
          POST /license-registrations returns 400 ERR_INVALID_REQUEST and persists no row.
        test_recipe:
          setup:
            - "One Originator (NMLS 2200001) exists; no licence has been filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
          trigger:
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /license-registrations?originator_id=${orig_id} reports total_count 0"

      - name: ce_course_omitted_flags_default_to_all_states_and_successive_block
        claim_type: defaults
        grounds:
          - endpoints[POST /ce-courses]
          - entities.CeCourse.fields.approved_state_codes
          - entities.CeCourse.fields.successive_year_blocked
        distinguishing_aspect: |
          Omitting approved_state_codes and successive_year_blocked yields the declared
          defaults [] (accepted in every state) and true, and provider_status APPROVED -
          not null and not false.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ce-courses"
              payload: { course_code: "CE-DEF-4H", credit_hours: 4, category: "ELECTIVE" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { states: $.data.approved_state_codes, succ: $.data.successive_year_blocked, prov: $.data.provider_status, hrs: $.data.credit_hours }
          assert:
            - "HTTP status is 201"
            - "${states} == [] (empty array means the course is accepted in every state)"
            - "${succ} == true"
            - "${prov} == APPROVED"
            - "${hrs} == 4"

      - name: loan_close_computes_closed_unit_index_and_pins_plan_id
        claim_type: computed_fields
        grounds:
          - entities.LoanApplication.fields.closed_unit_index
          - entities.LoanApplication.fields.application_taken_at
          - entities.LoanApplication.fields.compensation_plan_id
          - state_machines.LoanApplication.LOCKED_to_CLOSED
        distinguishing_aspect: |
          The client never supplies closed_unit_index, application_taken_at or
          compensation_plan_id (none appears in any §1.5 input schema); the close of the
          originator's first loan computes closed_unit_index 1, application_taken_at
          2026-08-05T00:00:00Z (the clock instant at POST /loan-applications) and
          compensation_plan_id equal to the assigned plan id.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE, sponsored CA licence and the ACTIVE plan
               `Retail Base 2026` (base_basis_points 105, volume tier off) assigned for
               2026-08-01..2026-12-31."
            - "The clock is moved to 2026-08-05T00:00:00Z before the application is taken;
               one loan is locked at 20000000 cents and closed funded at 20000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Retail Base 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Reg Z review complete." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BR-1001", product_type: "FIXED_30", requested_amount_cents: 20000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan1: $.data.id, taken_at: $.data.application_taken_at, idx_before: $.data.closed_unit_index }
            - call: "POST /loan-applications/${loan1}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 20000000 }
              as: Originator
              as_user_id: "${orig_id}"
          trigger:
            - call: "POST /loan-applications/${loan1}/close"
              payload: { funded_amount_cents: 20000000, funded_at: "2026-08-20T00:00:00Z", lender_paid_comp_cents: 210000, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
              captures: { idx: $.data.closed_unit_index, pin: $.data.compensation_plan_id, nrb: $.data.note_rate_bps, cs: $.data.compensation_status, st: $.data.status }
            - call: "GET /compensation-records"
              payload: { loan_application_id: "${loan1}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rec_amt: "$.data[0].accrued_cents", rec_var: "$.data[0].variant", rec_plan: "$.data[0].compensation_plan_id" }
          assert:
            - "${taken_at} == 2026-08-05T00:00:00Z"
            - "${idx_before} == null (closed_unit_index stays null until CLOSED)"
            - "${idx} == 1"
            - "${pin} == ${plan_id}"
            - "${rec_plan} == ${plan_id}"
            - "${nrb} == 650 (written by the lock, not by the close)"
            - "${st} == CLOSED and ${cs} == ACCRUED"
            - "${rec_amt} == 210000 and ${rec_var} == PROVISIONAL"

      - name: compensation_plan_stamps_drafted_by_user_id_from_header
        claim_type: system_fields
        grounds:
          - entities.CompensationPlan.fields.drafted_by_user_id
          - entities.CompensationPlan.fields.approved_by_user_id
          - endpoints[POST /compensation-plans]
        distinguishing_aspect: |
          drafted_by_user_id is `source: system`: it is stamped from the X-User-ID header
          (designer-9) and is absent from the endpoint's input schema, while
          approved_by_user_id stays null and status stays DRAFT until an approval arrives.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /compensation-plans"
              payload: { plan_name: "Retail Base 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000 }
              as: CompensationDesigner
              as_user_id: "designer-9"
              captures: { drafted: $.data.drafted_by_user_id, approved: $.data.approved_by_user_id, st: $.data.status, pvc: $.data.prohibited_variable_count, ver: $.data.version, sal: $.data.salary_cents_per_period, vte: $.data.volume_tier_enabled, cae: $.data.concession_absorption_enabled }
          assert:
            - "HTTP status is 201"
            - "${drafted} == designer-9"
            - "${approved} == null"
            - "${st} == DRAFT"
            - "${pvc} == 0"
            - "${ver} == 1"
            - "${sal} == 0 and ${vte} == false and ${cae} == false (declared defaults)"

      - name: create_advertisement_with_unknown_medium_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Advertisement.fields.medium
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=7]
        distinguishing_aspect: |
          medium accepts only WEB | PRINT | SOCIAL | DIRECT_MAIL | RADIO, so medium
          `BILLBOARD` returns 400 ERR_INVALID_REQUEST and no Advertisement row is created.
        test_recipe:
          setup:
            - "One Originator (NMLS 2200001) exists; no advertisement has been filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
