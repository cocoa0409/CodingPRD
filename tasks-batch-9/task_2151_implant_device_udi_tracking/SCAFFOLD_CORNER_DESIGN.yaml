              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678905", description: "Ti Femoral Stem", category: "STANDARD_IMPLANT", list_charge_cents: 600000, charge_code: "CDM-77140", shelf_life_days: 1095 }
