              as_user_id: "u-ctl-a"
              captures: { suspended_error: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_MARKET_SUSPENDED\""
            - "GET /fleet/fleet-plans/${plan_atl} still reports status \"DRAFT\" and version 1"
            - "GET /fleet/markets/${mkt_atl} reports status \"SUSPENDED\" and version 2"

