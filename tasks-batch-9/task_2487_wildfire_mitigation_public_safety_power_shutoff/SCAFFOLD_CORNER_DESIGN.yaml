      - name: customer_notification_tier_lets_the_critical_class_dominate_medical_baseline
        claim_type: Correct Result
        grounds:
          - calculations.customer_notification_tier
          - entities.Circuit.fields.medical_baseline_count
        distinguishing_aspect: "A CRITICAL_FACILITY account that also carries medical_baseline true resolves to TIER_A_CRITICAL rather than TIER_B_MEDICAL because the class test is evaluated first — yet it still increments BOTH circuit counters, so the tier ladder and the counters are independent readings of the same row."
        test_recipe:
          setup:
            - "Circuit ALPHA with no customers."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
          trigger:
            - call: "POST /customers"
              payload: { account_number: "ACC-BOTH", circuit_id: "${alpha_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: true, preferred_language: "EN", notification_channels: ["VOICE"], address_zone_code: "Z1" }
              as: CommunityLiaison
              captures: { cust_both_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-MED", circuit_id: "${alpha_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "EN", notification_channels: ["VOICE"], address_zone_code: "Z1" }
              as: CommunityLiaison
              captures: { cust_med_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-PLAIN", circuit_id: "${alpha_id}", customer_class: "COMMERCIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["EMAIL"], address_zone_code: "Z1" }
              as: CommunityLiaison
              captures: { cust_plain_id: $.data.id }
