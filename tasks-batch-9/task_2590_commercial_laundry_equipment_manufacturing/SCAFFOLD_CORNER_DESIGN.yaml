              captures: { v_rev: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m1}", quantity: 1, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${v_rev}" }
              as: Distributor
              as_user_id: "${dist}"
            - call: "POST /clm/quotes/${q1}/submit"
              as: Distributor
              as_user_id: "${dist}"
          assert:
            - "after the first trigger call PackageQuote.${q1}.quote_state == REVISION_REQUESTED and revision_round == 1"
            - "PackageQuote.${q1}.decided_by_user_id == u-cm-01"
            - "PackageQuote.${q1}.verified_credit_score == null and final_apr_bp == null"
            - "the second trigger call returns HTTP 201 (line editing is reopened in REVISION_REQUESTED)"
            - "after the third trigger call PackageQuote.${q1}.quote_state == SUBMITTED with line_count == 2 and total_cents == 2500000"
            - "PackageQuote.${q1}.revision_round == 1 (a resubmission does not increment it again)"
            - "PackageQuote.${q1}.origination_fee_cents == 0 (financing_program NONE)"

