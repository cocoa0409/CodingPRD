          assert:
            - "after the first request Store.${stF_id}.transfer_status == PENDING"
            - "after the DENY decision Store.${stF_id}.transfer_status == DENIED and Store.${stF_id}.franchisee_id == ${fInc_id} — the store did not move"
            - "after the second request Store.${stF_id}.transfer_status == PENDING again — DENIED is not terminal"
            - "Store.${stF_id}.transfer_price_cents == 42000000, the reopened request's terms"
            - "Store.${stF_id}.status == ACTIVE throughout — the status and transfer_status dimensions are independent"
