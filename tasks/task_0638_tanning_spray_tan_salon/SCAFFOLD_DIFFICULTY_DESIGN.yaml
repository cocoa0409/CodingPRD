              as: Member
              as_user_id: "${m1_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { member_id: "${m2_id}", kind: "SPRAY", booking_mode: "RESERVATION", spray_room_id: "${room_id}", start_at: "2026-06-15T11:09:00Z", requested_seconds: 300 }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /sessions"
              payload: { member_id: "${m2_id}", kind: "SPRAY", booking_mode: "RESERVATION", spray_room_id: "${room_id}", start_at: "2026-06-15T11:10:00Z", requested_seconds: 300 }
              as: Member
              as_user_id: "${m2_id}"
              captures: { s2_id: $.data.id }
          assert:
            - "trigger[0].response.data.error_id == ERR_ROOM_SLOT_CONFLICT"
            - "Session.${s2_id}.status == RESERVED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: freeze_then_cancel_restores_deferred_revenue
        grounds:
          - state_machines.Member.ACTIVE_to_FROZEN
          - state_machines.Member.FROZEN_to_CANCELLED
          - entities.SalonLedger.fields.deferred_revenue_cents
        distinguishing_aspect: "Conserved quantity = SalonLedger.deferred_revenue_cents (monetary owed-credit): freeze adds 4000 to both account_credit_cents and deferred_revenue_cents; cancel-while-frozen reverses both, so deferred_revenue_cents returns to its pre-freeze value 0 with no drift."
        test_recipe:
          setup:
            - "Plan UNLIMITED 6000. Member ACTIVE, cycle_anchor 2026-06-01T00:00:00Z. SalonLedger.deferred_revenue_cents starts 0."
            - "Clock 2026-06-11T00:00:00Z (elapsed 10 days). Freeze mints credit 200*20=4000."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Conserve Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_act: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members/${m_id}/freeze"
              payload: { expected_member_version: "${v_act}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_frozen: $.data.version, credit_after_freeze: $.data.account_credit_cents }
          trigger:
            - call: "POST /members/${m_id}/cancel"
              payload: { expected_member_version: "${v_frozen}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.account_credit_cents == 0"
            - "Member.${m_id}.status == CANCELLED"
            - "SalonLedger.SALON.deferred_revenue_cents == 0"

      - name: sale_then_refund_conserves_inventory
        grounds:
          - state_machines.RetailOrder.PAID_to_REFUNDED
          - entities.Product.fields.stock_on_hand
          - entities.Product.fields.units_sold
        distinguishing_aspect: "Conserved quantity = Product inventory units (physical, not monetary): a sale of 3 units decrements stock_on_hand to 7 and increments units_sold to 3; the refund restores stock_on_hand to 10 and units_sold to 0, so stock_on_hand + units_sold == initial_stock (10) holds before and after."
        test_recipe:
          setup:
            - "Plan UNLIMITED retail_discount 0. ACTIVE Member account_credit 0. Product initial_stock 10 unit_price 1000."
            - "Member buys quantity 3 (stock_on_hand 7, units_sold 3)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, retail_discount_pct: 0, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "INV-1000", name: "Serum", unit_price_cents: 1000, initial_stock: 10 }
              as: SalonManager
              captures: { prod_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Inv Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /retail-orders"
              payload: { member_id: "${m_id}", lines: [ { product_id: "${prod_id}", quantity: 3 } ] }
              as: Member
              as_user_id: "${m_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /retail-orders/${order_id}/refund"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "Product.${prod_id}.stock_on_hand == 10"
            - "Product.${prod_id}.units_sold == 0"
            - "RetailOrder.${order_id}.status == REFUNDED"
