            - { call: "POST /etax/employees", payload: { employee_ref: "E-1122", full_name: "Y Two", resident_state_code: "NY", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst, captures: { e_b: $.data.id, e_b_v: $.data.version } }
            - { call: "POST /etax/nexus-cases", payload: { state_code: "NY" }, as: NexusAnalyst, captures: { nc_ny: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_ny}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/nexus-cases/${nc_ny}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/withholding-elections", payload: { employee_id: "${e_b}", election_type: "COURTESY_RESIDENT", work_state_code: "NJ", effective_from: "2026-09-01T00:00:00Z", expected_employee_version: "${e_b_v}" }, as: Employee, as_user_id: "${e_b}", captures: { el_id: $.data.id } }
          trigger:
            - { call: "POST /etax/withholding-elections/${el_id}/validate", payload: {}, as: NexusAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_ny_wh}", projected_annual_withholding_cents: 1000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_ny: $.data.id } }
            - { call: "POST /etax/registrations/${reg_ny}/submit", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_ny}/activate", payload: { account_number: "NY-00000001" }, as: NexusAnalyst }
