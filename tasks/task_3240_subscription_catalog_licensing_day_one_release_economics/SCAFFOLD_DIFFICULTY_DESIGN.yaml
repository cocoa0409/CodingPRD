              as: CatalogAdmin
              captures: { sub_ana_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_bo_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_bo_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_ana_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_ana_id}"
            - call: "POST /catalog/subscriptions/${sub_bo_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_bo_id}"
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_a_id: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-09-30T00:00:00Z", release_class: "BACK_CATALOG", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { entry_b_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_a_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${entry_b_id}/publish"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/catalog-entries/${entry_a_id}/retire"
              payload: {}
              as: CatalogAdmin
          assert:
            - "hop 1: GET /catalog/catalog-entries/${entry_a_id} reports status == DELISTED"
            - "hop 2: GET /catalog/catalog-entries/${entry_b_id} reports status == DELISTED even though nothing was called on it"
            - "hop 3: GET /catalog/entitlements?entry_id=${entry_a_id} returns two rows, both status == REVOKED"
            - "hop 3: GET /catalog/entitlements?entry_id=${entry_b_id} returns two rows still status == ACTIVE, because entry_b is BACK_CATALOG and always retains"
            - "hop 3: CatalogEntry.${entry_a_id}.subscriber_impact_count == 0 and CatalogEntry.${entry_b_id}.subscriber_impact_count == 2"
            - "the title now has no entry in status IN {ADDED, REMOVING}, so GET /catalog/titles/${title_id} reports status == RETIRED and weighted_engagement_score == 0.00"

      # ---------------------------------------------------------------- 2 of 2
      - name: subscription_cancel_cascades_to_entitlements_and_impact_counts
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.Entitlement.GRACE_to_REVOKED
