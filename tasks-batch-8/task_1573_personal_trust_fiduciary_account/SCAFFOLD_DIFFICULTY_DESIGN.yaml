scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_quarter_base
        grounds:
          - calculations.trustee_fee_assessment
          - entities.FeeAssessment.fields.variant
          - entities.FeeAssessment.fields.base_market_value_cents
        distinguishing_aspect: |
          Dual-variant calculation on the FeeAssessment (fee) domain: PROVISIONAL uses the current
          total_market_value (2,400,000.00 after reprice) while FINAL for the same period uses
          as-of period_end prices (2,000,000.00) - identical holdings, different fee of 5125.00 vs 4375.00.
        test_recipe:
          setup:
            - "ACTIVE trust funded with 2,000,000.00 principal cash and four equity holdings of 500,000.00 each bought at creation prices (create-time priced_at falls inside the period), so as-of period_end TMV = 2,000,000.00"
            - "All four holdings repriced to 60000 cents/unit with priced_at 2026-10-05, so current TMV = 2,400,000.00"
            - "Logical clock at 2026-10-10"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Fee Variant Trust", trust_type: "IRREVOCABLE", grantor_name: "G One", governing_state: "DE", ein: "04-1111111", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "initial funding" }, as: TrustOperationsOfficer }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv1: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "AAA", units: 1000, unit_price_cents: 50000, expected_trust_account_version: "${tv1}" }, as: InvestmentManager, captures: { h1: $.data.id } }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv2: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "BBB", units: 1000, unit_price_cents: 50000, expected_trust_account_version: "${tv2}" }, as: InvestmentManager, captures: { h2: $.data.id } }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv3: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "CCC", units: 1000, unit_price_cents: 50000, expected_trust_account_version: "${tv3}" }, as: InvestmentManager, captures: { h3: $.data.id } }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv4: $.data.version } }
            - { call: "POST /trusts/investment-holdings", payload: { trust_id: "${trust_id}", asset_class: "EQUITY", ticker: "DDD", units: 1000, unit_price_cents: 50000, expected_trust_account_version: "${tv4}" }, as: InvestmentManager, captures: { h4: $.data.id } }
            - { call: "POST /trusts/investment-holdings/${h1}/update-price", payload: { unit_price_cents: 60000, priced_at: "2026-10-05T00:00:00Z" }, as: InvestmentManager }
            - { call: "POST /trusts/investment-holdings/${h2}/update-price", payload: { unit_price_cents: 60000, priced_at: "2026-10-05T00:00:00Z" }, as: InvestmentManager }
            - { call: "POST /trusts/investment-holdings/${h3}/update-price", payload: { unit_price_cents: 60000, priced_at: "2026-10-05T00:00:00Z" }, as: InvestmentManager }
            - { call: "POST /trusts/investment-holdings/${h4}/update-price", payload: { unit_price_cents: 60000, priced_at: "2026-10-05T00:00:00Z" }, as: InvestmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-10T00:00:00Z" }, as: TrustExecutive }
          trigger:
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "PROVISIONAL" }, as: TrustOperationsOfficer, captures: { prov_id: $.data.id } }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { final_id: $.data.id } }
          assert:
            - "FeeAssessment.${prov_id}.base_market_value_cents == 240000000"
            - "FeeAssessment.${prov_id}.assessed_fee_cents == 512500"
            - "FeeAssessment.${final_id}.base_market_value_cents == 200000000"
            - "FeeAssessment.${final_id}.assessed_fee_cents == 437500"
            - "FeeAssessment.${final_id}.income_portion_cents == 218750 and principal_portion_cents == 218750"
            - "PROVISIONAL and FINAL assessments for the same period coexist (tiling rule counts FINAL rows only)"

      - name: tax_tentative_vs_final_dni
        grounds:
          - calculations.dni_and_distribution_deduction
          - entities.TaxReturnFiling.fields.tentative_dni_cents
          - entities.TaxReturnFiling.fields.dni_cents
        distinguishing_aspect: |
          Dual-variant calculation on the TaxReturnFiling (tax) domain - a different entity domain than
          FeeAssessment: TENTATIVE DNI snapshots entries posted at compute-tentative time (12,812.50)
          while FINAL recomputed at prepare includes a later-posted 5,000.00 interest receipt (17,812.50).
        test_recipe:
          setup:
            - "ACTIVE trust (DISCRETIONARY standard) with 2026 receipts: INTEREST 10,000.00 and ORDINARY_DIVIDEND 5,000.00"
            - "A POSTED FINAL fee assessment for Q3 with income_portion 2,187.50 debited from INCOME (base 2,000,000.00 cash-only trust)"
            - "TaxReturnFiling for tax_year 2026 in DATA_COLLECTION with tentative_dni already computed"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "DNI Trust", trust_type: "IRREVOCABLE", grantor_name: "G Two", governing_state: "NY", ein: "04-2222222", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-09-15", description: "interest" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "ORDINARY_DIVIDEND", amount_cents: 500000, value_date: "2026-09-20", description: "dividend" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fee_id: $.data.id } }
            - { call: "POST /trusts/fee-assessments/${fee_id}/disclose", as: TrustOperationsOfficer, as_user_id: "ops_disc" }
            - { call: "POST /trusts/fee-assessments/${fee_id}/post", as: TrustOperationsOfficer, as_user_id: "ops_post" }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { filing_id: $.data.id } }
            - { call: "POST /trusts/tax-return-filings/${filing_id}/compute-tentative", as: TaxSpecialist }
          trigger:
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 500000, value_date: "2026-11-15", description: "late interest" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/tax-return-filings/${filing_id}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_prep" }
          assert:
            - "TaxReturnFiling.${filing_id}.tentative_dni_cents == 1281250"
            - "TaxReturnFiling.${filing_id}.dni_cents == 1781250"
            - "dni_cents - tentative_dni_cents == 500000 (the late-posted INTEREST receipt)"
            - "TaxReturnFiling.${filing_id}.status == PREPARED and prepared_by_user_id == 'tax_prep'"

  - rule_id: combinatorial_formula
    instances:
      - name: trustee_fee_tiered_min_split
        grounds:
          - calculations.trustee_fee_assessment
        distinguishing_aspect: |
          Mode (a): a formula with >= 3 inputs and non-linear interaction - three tier breakpoints with
          nested min/max tier selection, a quarterly min-fee floor, and a 50/50 income/principal split
          whose remainder lands in principal. Verified at a mid-tier base and at the min-fee floor.
        test_recipe:
          setup:
            - "ACTIVE trust A with cash-only TMV of 2,000,000.00 (no holdings)"
            - "ACTIVE trust B with cash-only TMV of 100,000.00"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Fee Tier Trust", trust_type: "REVOCABLE", grantor_name: "G Three", governing_state: "CA", ein: "04-3333333", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { ta: $.data.id } }
            - { call: "POST /trusts/${ta}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${ta}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${ta}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding A" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts", payload: { trust_name: "Fee Floor Trust", trust_type: "REVOCABLE", grantor_name: "G Four", governing_state: "CA", ein: "04-4444444", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { tb: $.data.id } }
            - { call: "POST /trusts/${tb}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${tb}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${tb}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 10000000, value_date: "2026-08-05", description: "funding B" }, as: TrustOperationsOfficer }
          trigger:
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${ta}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fa: $.data.id } }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${tb}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fb: $.data.id } }
          assert:
            - "FeeAssessment.${fa}.base_market_value_cents == 200000000 and annual_fee_cents == 1750000"
            - "FeeAssessment.${fa}.assessed_fee_cents == 437500 (tier1 1,000,000 + tier2 750,000, quartered)"
            - "FeeAssessment.${fa}.income_portion_cents == 218750 and principal_portion_cents == 218750"
            - "FeeAssessment.${fb}.assessed_fee_cents == 125000 (min-fee floor: raw quarterly 25,000 < MIN 125,000)"
            - "FeeAssessment.${fb}.income_portion_cents == 62500 and principal_portion_cents == 62500"

      - name: waterfall_per_line_rounding_remainder
        grounds:
          - calculations.final_distribution_waterfall
          - state_machines.TerminationCase.FINAL_ACCOUNTING_APPROVED_to_DISTRIBUTED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters - the waterfall rounds each beneficiary line
          (round_half_up of distributable * share_bps / 10000) BEFORE reconciling the delta, and the
          delta (-1 cent here) is applied to the largest-share line; sum-then-round would give a
          different per-line split.
        test_recipe:
          setup:
            - "ACTIVE trust, per_stirpes=false document approved, one INCOME beneficiary (10000 bps), three REMAINDER beneficiaries A/B/C with 3333/3333/3334 bps created in that order"
            - "Balances at termination: principal 500,000.00, income 20,000.00; reserves: taxes 15,000.00, fees 4,374.00 -> distributable principal 480,626.00"
            - "TerminationCase progressed to FINAL_ACCOUNTING_APPROVED (no tax filings exist, so clearance passes vacuously)"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Waterfall Trust", trust_type: "TESTAMENTARY", grantor_name: "G Five", governing_state: "TX", ein: "04-5555555", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/documents", payload: { trust_id: "${trust_id}", version_number: 1, summary: "instrument" }, as: TrustOfficer, captures: { doc_id: $.data.id } }
            - { call: "POST /trusts/documents/${doc_id}/submit", as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc_id}/interpret", payload: { per_stirpes: false, interpretation_notes: "lapse redistribution" }, as: TrustOfficer }
            - { call: "POST /trusts/documents/${doc_id}/approve", as: TrustExecutive }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Income Irene", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1950-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Rem A", beneficiary_class: "REMAINDER", share_bps: 3333, date_of_birth: "1980-01-01" }, as: TrustOfficer, captures: { b_a: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Rem B", beneficiary_class: "REMAINDER", share_bps: 3333, date_of_birth: "1981-01-01" }, as: TrustOfficer, captures: { b_b: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Rem C", beneficiary_class: "REMAINDER", share_bps: 3334, date_of_birth: "1982-01-01" }, as: TrustOfficer, captures: { b_c: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 50000000, value_date: "2026-08-05", description: "principal funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 2000000, value_date: "2026-09-15", description: "income" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/${trust_id}/terminate", payload: { reason: "grantor-directed termination" }, as: TrustOfficer, as_user_id: "officer_init" }
            - { call: "GET /trusts/termination-cases", payload: { trust_id: "${trust_id}" }, as: TrustOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /trusts/termination-cases/${case_id}/reserve-liabilities", payload: { reserve_taxes_cents: 1500000, reserve_fees_cents: 437400 }, as: TrustOfficer }
            - { call: "POST /trusts/termination-cases/${case_id}/record-tax-clearance", as: TaxSpecialist }
            - { call: "POST /trusts/termination-cases/${case_id}/approve-final-accounting", as: TrustExecutive, as_user_id: "exec_appr" }
          trigger:
            - { call: "POST /trusts/termination-cases/${case_id}/distribute", as: TrustOperationsOfficer }
          assert:
            - "TerminationCase.${case_id}.status == DISTRIBUTED and distributable_principal_cents == 48062600 and distributable_income_cents == 2000000"
            - "distribution_lines: income line for ${b_inc} == 2000000"
            - "distribution_lines: ${b_a} == 16019265, ${b_b} == 16019265, ${b_c} == 16024070 (per-line round_half_up gives 16019265+16019265+16024071 = 48062601; delta -1 applied to largest share C)"
            - "sum of the three remainder lines == 48062600 exactly"
            - "TrustAccount.${trust_id}.status == TERMINATED"

      - name: dni_pinned_evaluation_order
        grounds:
          - calculations.dni_and_distribution_deduction
          - entities.TaxReturnFiling.fields.distribution_deduction_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency made well-defined by a pinned evaluation order -
          distribution_deduction = min(dni, paid + elected) feeds trust_taxable_income, while dni itself
          is net of income-bucket fees; only the pinned order (gross -> expenses -> DNI -> deduction ->
          taxable) yields 4,512.50 taxable here.
        test_recipe:
          setup:
            - "ACTIVE DISCRETIONARY trust with 2026 receipts INTEREST 10,000.00 + ORDINARY_DIVIDEND 5,000.00 and a POSTED FINAL Q3 fee (income portion 2,187.50)"
            - "One APPROVED-then-DISBURSED distribution of 8,000.00 INCOME_ONLY to an ACTIVE income beneficiary; committee of 5 ACTIVE members"
            - "TaxReturnFiling 2026 in DATA_COLLECTION"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Order Trust", trust_type: "IRREVOCABLE", grantor_name: "G Six", governing_state: "NY", ein: "04-6666666", fiscal_year_end_month: 12, distribution_standard: "DISCRETIONARY" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Inc Ivy", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-05-05" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Four", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm4: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Five", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm5: $.data.id } }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INITIAL_FUNDING", amount_cents: 200000000, value_date: "2026-08-05", description: "funding" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "INTEREST", amount_cents: 1000000, value_date: "2026-09-15", description: "interest" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/ledger-entries", payload: { trust_id: "${trust_id}", entry_kind: "RECEIPT", receipt_type: "ORDINARY_DIVIDEND", amount_cents: 500000, value_date: "2026-09-20", description: "dividend" }, as: TrustOperationsOfficer }
            - { call: "POST /trusts/fee-assessments", payload: { trust_id: "${trust_id}", period_start: "2026-07-01", period_end: "2026-09-30", variant: "FINAL" }, as: TrustOperationsOfficer, captures: { fee_id: $.data.id } }
            - { call: "POST /trusts/fee-assessments/${fee_id}/disclose", as: TrustOperationsOfficer, as_user_id: "ops_disc" }
            - { call: "POST /trusts/fee-assessments/${fee_id}/post", as: TrustOperationsOfficer, as_user_id: "ops_post" }
            - { call: "GET /trusts/${trust_id}", as: TrustOfficer, captures: { tv: $.data.version } }
            - { call: "POST /trusts/distribution-requests", payload: { trust_id: "${trust_id}", beneficiary_id: "${b_inc}", amount_cents: 800000, allocation_source: "INCOME_ONLY", purpose_category: "HEALTH", expected_trust_account_version: "${tv}" }, as: TrustOfficer, captures: { req_id: $.data.id } }
            - { call: "POST /trusts/distribution-requests/${req_id}/start-review", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req_id}/open-voting", as: TrustOfficer }
            - { call: "POST /trusts/distribution-requests/${req_id}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm1}" }
            - { call: "POST /trusts/distribution-requests/${req_id}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm2}" }
            - { call: "POST /trusts/distribution-requests/${req_id}/vote", payload: { vote: "APPROVE" }, as: CommitteeMember, as_user_id: "${cm3}" }
            - { call: "POST /trusts/distribution-requests/${req_id}/disburse", as: TrustOperationsOfficer }
            - { call: "POST /trusts/tax-return-filings", payload: { trust_id: "${trust_id}", tax_year: 2026 }, as: TaxSpecialist, captures: { filing_id: $.data.id } }
          trigger:
            - { call: "POST /trusts/tax-return-filings/${filing_id}/prepare", payload: { elected_65day_amount_cents: 0 }, as: TaxSpecialist, as_user_id: "tax_prep" }
          assert:
            - "TaxReturnFiling.${filing_id}.dni_cents == 1281250 (1,500,000 gross income - 218,750 income-bucket fees)"
            - "TaxReturnFiling.${filing_id}.distribution_deduction_cents == 800000 (min(1281250, 800000 + 0))"
            - "TaxReturnFiling.${filing_id}.exemption_cents == 30000"
            - "TaxReturnFiling.${filing_id}.trust_taxable_income_cents == 451250"

  - rule_id: non_linear_state_machine
    instances:
      - name: distribution_request_info_cycle_and_fork
        grounds:
          - state_machines.DistributionRequest.UNDER_REVIEW_to_INFORMATION_REQUESTED
          - state_machines.DistributionRequest.INFORMATION_REQUESTED_to_UNDER_REVIEW
          - state_machines.DistributionRequest.VOTING_to_APPROVED
          - state_machines.DistributionRequest.VOTING_to_DECLINED
        distinguishing_aspect: |
          Non-linear machine on DistributionRequest: an unbounded UNDER_REVIEW <-> INFORMATION_REQUESTED
          cycle (executed twice) followed by the VOTING fork - one request takes the APPROVED branch
          (reservation kept), a sibling request takes the DECLINED branch (reservation released).
        test_recipe:
          setup:
            - "ACTIVE HEMS trust; income beneficiary Ivy (10000 bps INCOME); five ACTIVE committee members"
            - "Funded: INITIAL_FUNDING 100,000.00 principal + INTEREST 50,000.00 income"
          setup_api_calls:
            - { call: "POST /trusts", payload: { trust_name: "Cycle Trust", trust_type: "IRREVOCABLE", grantor_name: "G Seven", governing_state: "DE", ein: "04-7777777", fiscal_year_end_month: 12, distribution_standard: "HEMS" }, as: TrustOfficer, captures: { trust_id: $.data.id } }
            - { call: "POST /trusts/beneficiaries", payload: { trust_id: "${trust_id}", full_name: "Ivy Inc", beneficiary_class: "INCOME", share_bps: 10000, date_of_birth: "1955-01-01" }, as: TrustOfficer, captures: { b_inc: $.data.id } }
            - { call: "POST /trusts/${trust_id}/submit-for-acceptance", as: TrustOfficer }
            - { call: "POST /trusts/${trust_id}/accept", as: TrustExecutive }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM One", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm1: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Two", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm2: $.data.id } }
            - { call: "POST /trusts/committee-members", payload: { full_name: "CM Three", term_start: "2026-01-01", term_end: "2028-12-31" }, as: TrustExecutive, captures: { cm3: $.data.id } }
