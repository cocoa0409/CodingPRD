            - "ProtectionClaim.${pc_o}.status remains REQUESTED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: lineage_depth_boundary_at_max
        grounds:
          - validations[priority=12]
          - calculations.eligibility_category_assignment
          - entities.Member.fields.lineage_depth
        distinguishing_aspect: |
          Numeric boundary on lineage_depth via POST
          .../eligibility-cases/{id}/submit: sponsor at depth 2 admits a child
          (2 + 1 <= 3 succeeds, boundary inclusive), while a sponsor at depth
          3 rejects (3 + 1 > 3, ERR_LINEAGE_DEPTH_EXCEEDED) — the >= vs >
          edge sits exactly at MAX_LINEAGE_DEPTH.
        test_recipe:
          setup:
            - "Generational chain G0 (direct, depth 0) -> G1 (child, depth 1) -> G2 (grandchild, depth 2) -> G3 (great-grandchild, depth 3), all ACTIVE; each derivation sponsored by the previous generation."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Gen Zero", applicant_dob: "1950-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
