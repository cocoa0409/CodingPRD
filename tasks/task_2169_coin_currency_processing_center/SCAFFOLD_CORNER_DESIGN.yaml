  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_sealed_bag_version_rejects_count_session_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[count-session-create-stale-bag]
          - validations[priority=35]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two strictly sequential creates: the first advances SealedBag.version, and the second still carrying the previously observed version is rejected with ERR_STALE_VERSION at 412 while the first session remains SCHEDULED."
        test_recipe:
          setup:
            - "Vault CV-C52, CustomerAccount ACC-C52, machines SORT-C52A and SORT-C52B."
            - "Ticket MAN-C52 with bag S-C52 at VAULT_RECEIVED; the client has read the bag's version once."
