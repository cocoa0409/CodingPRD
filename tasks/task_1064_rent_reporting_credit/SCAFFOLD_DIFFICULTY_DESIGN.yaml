          assert:
            - "POST /api/rent-payments .data.on_time == true"
            - "GET /api/rent-payments/${pay_id} .data.on_time == true"

      - name: empty_effective_set_rate_is_null
        grounds:
          - calculations.tenant_on_time_rate
          - endpoints["GET /api/tenants/{id}/credit-summary"]
          - entities.Tenant.fields.effective_reported_items
