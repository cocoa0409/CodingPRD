              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-P1", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T08:00:00Z" }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-P2", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T10:00:00Z" }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-P3", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
