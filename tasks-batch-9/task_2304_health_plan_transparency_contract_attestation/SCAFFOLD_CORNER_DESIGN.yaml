            - call: "GET /compliance/plan-years/${py_b}/penalty-projection"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/plan-years/${py_c}/penalty-projection"
              payload: {}
              as: ComplianceOfficer
