        distinguishing_aspect: "Two panel members read the same tally and both vote: the first write moves the appeal's version, so the second member's echo is stale and refused with 412 even though their vote is otherwise entirely legal, and the tally must be unchanged by the refusal - which is what makes a blind re-submit unsafe."
