# =============================================================================
# Task 1242 — Revenue Recognition (ASC 606) Contract Review
# Seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# =============================================================================

scenario: |
  1242. Revenue Recognition (ASC 606) Contract Review: contract identification &
  combination assessment, performance obligation identification & standalone
  selling price allocation, variable consideration estimation & constraint,
  timing of recognition (point in time vs over time) determination, contract
  modification accounting, contract asset/liability & deferred revenue
  rollforward, disclosure data assembly, non-standard term review workflow

domain_name: revenue-recognition
api_prefix: /revrec

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  # Core challenge: two measures run over the same contract — billings
  # (invoice-driven) vs revenue recognized (progress- or delivery-driven) —
  # and the contract asset / deferred-revenue position is the reconciling
  # difference. Modification and re-estimation re-run both.
  secondary_archetype: compliance_audit
  # Non-standard term review workflow + segregation-of-duties on every
  # approval step (proposer != approver, recommender != decider,
  # assembler != finalizer).
  complexity_layers:
    - dual_variant_calculation      # VC: EXPECTED_VALUE vs MOST_LIKELY; progress: INPUT_COST vs STRAIGHT_LINE
    - cascading_side_effects        # modification approve -> reallocate -> catch-up entries -> period totals
    - optimistic_concurrency        # OCC on Contract.version for modification creation
    - version_pinning_on_approval   # allocation + SSP snapshot pinned at contract approve
  entity_topology: flat             # peer entities joined by FK references; flat /revrec/* paths
  state_machine_shape: cyclic       # Contract review loop, ReviewTask rework loop, AccountingPeriod reopen loop
  relationship_patterns:
    - one_to_many                   # Contract -> POB / Estimate / Modification / Clause / Invoice / RevenueEntry
    - self_referential              # Contract.combined_into_contract_id; RevenueEntry.reversed_entry_id
    - cross_aggregate               # RevenueEntry -> AccountingPeriod; DisclosurePack -> AccountingPeriod
  role_model: segregation_of_duties # no user may propose+approve / recommend+decide / assemble+finalize
  consistency_model: immediate      # every mutation and cascade is atomic within the request

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal name" }
      - { name: external_ref, type: string, source: input, description: "External customer reference; unique per customer" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: contract_ref, type: string, source: input, description: "External contract reference; unique per contract" }
      - { name: signed_date, type: string, source: input, description: "Contract signature date, ISO yyyy-mm-dd" }
      - { name: risk_tier, type: enum, source: input, description: "STANDARD | ELEVATED | HIGH — drives the variable-consideration constraint cap" }
      - { name: package_negotiated_flag, type: boolean, source: input, default: false, description: "True when negotiated as a package with other contracts (combination criterion)" }
      - { name: combined_into_contract_id, type: string, source: system, description: "FK -> Contract.id; surviving contract when this contract is ABSORBED, null otherwise", required: false }
      - { name: fixed_consideration_cents, type: integer, source: input, description: "Fixed consideration in cents (>= 0); mutated by approved modifications and absorptions" }
      - { name: vc_estimate_cents, type: integer, source: computed, default: 0, description: "Constrained variable consideration from the currently APPROVED estimate; 0 when none approved" }
      - { name: transaction_price_cents, type: integer, source: computed, description: "= fixed_consideration_cents + vc_estimate_cents" }
      - { name: active_vc_estimate_id, type: string, source: system, required: false, description: "System-set reference to the currently APPROVED VariableConsiderationEstimate; informational, null when none" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "= sum of allocated_amount_cents over non-CANCELLED PerformanceObligations of this contract" }
      - { name: billed_to_date_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over ISSUED invoices minus amounts of VOIDED invoices" }
      - { name: recognized_to_date_cents, type: integer, source: computed, default: 0, description: "= sum of signed amount_cents over RevenueEntries of this contract with status in {POSTED, LOCKED}" }
      - { name: deferred_revenue_balance_cents, type: integer, source: computed, default: 0, description: "= max(0, billed_to_date_cents - recognized_to_date_cents)" }
      - { name: contract_asset_balance_cents, type: integer, source: computed, default: 0, description: "= max(0, recognized_to_date_cents - billed_to_date_cents)" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | APPROVED | ACTIVE | ON_HOLD | COMPLETED | CANCELLED | ABSORBED" }
      - { name: completed_at, type: datetime, source: system, required: false, description: "Server-stamped at auto-completion; null until COMPLETED" }

  - name: PerformanceObligation
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; owning contract (re-pointed to the survivor on absorption)" }
      - { name: pob_ref, type: string, source: input, description: "POB reference, unique within its contract" }
      - { name: description, type: string, source: input, required: false, description: "Free-text description" }
      - { name: product_code, type: string, source: input, description: "Product code used to resolve the standalone selling price" }
      - { name: region, type: string, source: input, description: "Region code used to resolve the standalone selling price" }
      - { name: recognition_pattern, type: enum, source: input, description: "POINT_IN_TIME | OVER_TIME_INPUT_COST | OVER_TIME_STRAIGHT_LINE" }
      - { name: service_start_date, type: string, source: input, required: false, description: "Required iff recognition_pattern == OVER_TIME_STRAIGHT_LINE; ISO yyyy-mm-dd" }
      - { name: service_end_date, type: string, source: input, required: false, description: "Required iff recognition_pattern == OVER_TIME_STRAIGHT_LINE; ISO yyyy-mm-dd; must be after service_start_date" }
      - { name: estimated_total_cost_cents, type: integer, source: input, required: false, description: "Required iff recognition_pattern == OVER_TIME_INPUT_COST; must be > 0" }
      - { name: ssp_cents, type: integer, source: computed, description: "Standalone selling price resolved from the ACTIVE SspPrice covering (product_code, region) at the contract's signed_date; pinned at POB creation" }
      - { name: allocated_amount_cents, type: integer, source: computed, default: 0, description: "Allocated share of transaction_price_cents; set at contract approve, re-set by reallocation" }
      - { name: costs_incurred_to_date_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over CostEntries of this POB" }
      - { name: recognized_revenue_cents, type: integer, source: computed, default: 0, description: "= sum of signed amount_cents over RevenueEntries of this POB with status in {POSTED, LOCKED}" }
      - { name: progress_pct, type: number, source: computed, default: 0, description: "Informational progress ratio, 6 decimal places round_half_up; recognition math uses the unrounded ratio" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | SATISFIED | CANCELLED" }
      - { name: satisfied_at, type: datetime, source: system, required: false, description: "Server-stamped when the POB reaches SATISFIED; null otherwise" }

  - name: SspPrice
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Product code this price applies to" }
      - { name: region, type: string, source: input, description: "Region this price applies to" }
      - { name: ssp_cents, type: integer, source: input, description: "Standalone selling price in cents; must be > 0" }
      - { name: effective_from, type: string, source: input, description: "First covered date, ISO yyyy-mm-dd; CLOSED interval lower bound" }
      - { name: effective_to, type: string, source: input, description: "Last covered date, ISO yyyy-mm-dd; CLOSED interval upper bound (>= effective_from)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: VariableConsiderationEstimate
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: method, type: enum, source: input, description: "EXPECTED_VALUE | MOST_LIKELY" }
      - { name: scenarios, type: array, source: input, description: "Array of { probability_bps: integer, amount_cents: integer }; probability_bps across scenarios must sum to exactly 10000" }
      - { name: unconstrained_amount_cents, type: integer, source: computed, description: "EXPECTED_VALUE: sum(probability_bps * amount_cents) / 10000 rounded round_half_up to cents; MOST_LIKELY: amount_cents of the scenario with the greatest probability_bps (tie: earliest array index)" }
      - { name: constrained_amount_cents, type: integer, source: computed, description: "= min(unconstrained_amount_cents, floor(unconstrained_amount_cents * cap)) with cap 0.85 / 0.70 / 0.50 by contract risk_tier STANDARD / ELEVATED / HIGH" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the creator; recorded for segregation of duties" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the approver; null until APPROVED" }

  - name: ContractModification
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: mod_type, type: enum, source: input, description: "CUMULATIVE_CATCH_UP | PROSPECTIVE | SEPARATE_CONTRACT" }
      - { name: delta_fixed_consideration_cents, type: integer, source: input, description: "Signed change to fixed consideration; must be non-zero" }
      - { name: effective_date, type: string, source: input, description: "Business effective date, ISO yyyy-mm-dd" }
      - { name: reason, type: string, source: input, required: false, description: "Free-text rationale" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the creator; recorded for segregation of duties" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the approver; null until APPROVED" }
      - { name: spawned_contract_id, type: string, source: system, required: false, description: "FK -> Contract.id; new DRAFT contract created when a SEPARATE_CONTRACT modification is approved; null otherwise" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED" }

  - name: ContractClause
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: clause_code, type: string, source: input, description: "Clause code, unique within its contract" }
      - { name: clause_type, type: enum, source: input, description: "TERMINATION_FOR_CONVENIENCE | EXTENDED_PAYMENT_TERMS | PENALTY | RIGHT_OF_RETURN | ACCEPTANCE_CLAUSE | MOST_FAVORED_CUSTOMER" }
      - { name: is_non_standard, type: boolean, source: input, description: "True when the clause deviates from standard terms and needs review" }
      - { name: clause_text, type: string, source: input, required: false, description: "Verbatim clause text" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED; non-standard clauses start PENDING_REVIEW, standard clauses start APPROVED" }

  - name: ReviewTask
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: clause_id, type: string, source: system, description: "FK -> ContractClause.id; clause under review" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | IN_REVIEW | RECOMMENDED | DECIDED" }
      - { name: reviewer_user_id, type: string, source: system, required: false, description: "X-User-ID of the ContractReviewer who claimed the task; null while ASSIGNED" }
      - { name: recommendation, type: enum, source: input, required: false, description: "APPROVE | REJECT; set by recommend" }
      - { name: recommended_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at recommend; the decider must differ (segregation of duties)" }
      - { name: decision, type: enum, source: input, required: false, description: "APPROVED | REJECTED | RETURN; set by decide" }
      - { name: decided_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at decide" }
      - { name: note, type: string, source: input, required: false, description: "Free-text note from recommend or decide" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: invoice_ref, type: string, source: input, description: "Invoice reference, unique per invoice" }
      - { name: amount_cents, type: integer, source: input, description: "Billed amount; must be > 0" }
      - { name: invoice_date, type: string, source: input, description: "Billing date, ISO yyyy-mm-dd; must fall in an OPEN or REOPENED AccountingPeriod" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED; invoices are created directly in ISSUED" }
      - { name: voided_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at void" }

  - name: AccountingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_code, type: string, source: input, description: "Period code, unique (e.g. 2026-06)" }
      - { name: start_date, type: string, source: input, description: "First covered date, ISO yyyy-mm-dd; HALF-OPEN interval lower bound" }
      - { name: end_date, type: string, source: input, description: "First uncovered date, ISO yyyy-mm-dd; HALF-OPEN interval upper bound (> start_date)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | REOPENED" }
      - { name: reopened_once, type: boolean, source: system, default: false, description: "Set true on first reopen; a period may be reopened at most once" }
      - { name: recognized_total_cents, type: integer, source: computed, default: 0, description: "= sum of signed amount_cents over RevenueEntries with posting_date inside this period and status in {POSTED, LOCKED}" }

  - name: RevenueEntry
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: pob_id, type: string, source: system, description: "FK -> PerformanceObligation.id" }
      - { name: accounting_period_id, type: string, source: system, description: "FK -> AccountingPeriod.id; period containing posting_date" }
      - { name: reversed_entry_id, type: string, source: system, required: false, description: "FK -> RevenueEntry.id; set on REVERSAL entries only" }
      - { name: entry_type, type: enum, source: system, description: "RECOGNITION | CATCH_UP_ADJUSTMENT | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; REVERSAL entries carry the negation of the reversed entry" }
      - { name: posting_date, type: string, source: system, description: "ISO yyyy-mm-dd; cost-driven entries post at the cost's incurred_date, all others at the current logical clock date" }
      - { name: origin, type: enum, source: system, description: "COST_ENTRY | RECOGNIZE | SATISFY | MODIFICATION | ESTIMATE | REVERSAL" }
      - { name: status, type: enum, source: system, description: "POSTED | LOCKED; LOCKED when the containing period is closed" }

  - name: CostEntry
    parent: null
    common_fields: false
    fields:
      - { name: pob_id, type: string, source: system, description: "FK -> PerformanceObligation.id" }
      - { name: amount_cents, type: integer, source: input, description: "Cost amount; must be > 0" }
      - { name: incurred_date, type: string, source: input, description: "Cost incurrence date, ISO yyyy-mm-dd; must fall in an OPEN or REOPENED AccountingPeriod" }
      - { name: memo, type: string, source: input, required: false, description: "Free-text memo" }

  - name: DisclosurePack
    parent: null
    common_fields: true
    fields:
      - { name: accounting_period_id, type: string, source: system, description: "FK -> AccountingPeriod.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSEMBLED | FINALIZED | SUPERSEDED" }
      - { name: rpo_cents, type: integer, source: computed, required: false, description: "Remaining performance obligations: sum of (allocated_amount_cents - recognized_revenue_cents) over POBs with status in {PENDING, IN_PROGRESS} of contracts with status in {ACTIVE, ON_HOLD}; null until assembled" }
      - { name: period_revenue_cents, type: integer, source: computed, required: false, description: "Sum of signed amount_cents over RevenueEntries (status POSTED or LOCKED) with posting_date in the period; null until assembled" }
      - { name: revenue_by_region, type: object, source: computed, required: false, description: "Map region -> summed entry amount_cents over the same entry set; null until assembled" }
      - { name: revenue_by_product, type: object, source: computed, required: false, description: "Map product_code -> summed entry amount_cents over the same entry set; null until assembled" }
      - { name: contract_asset_total_cents, type: integer, source: computed, required: false, description: "Sum of contract_asset_balance_cents over contracts with status in {ACTIVE, ON_HOLD, COMPLETED} at assemble time" }
      - { name: deferred_revenue_total_cents, type: integer, source: computed, required: false, description: "Sum of deferred_revenue_balance_cents over contracts with status in {ACTIVE, ON_HOLD, COMPLETED} at assemble time" }
      - { name: assembled_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at assemble; the finalizer must differ (segregation of duties)" }
      - { name: finalized_by_user_id, type: string, source: system, required: false, description: "X-User-ID recorded at finalize" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, ABSORBED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /revrec/contracts/{contract_id}/submit"
        actor: RevenueAccountant
        preconditions:
          - "at least one PerformanceObligation with contract_id == this contract exists"
        side_effects:
          - "for each ContractClause of this contract with is_non_standard == true and status == PENDING_REVIEW: create a ReviewTask (status ASSIGNED, clause_id pointing at the clause)"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /revrec/contracts/{contract_id}/submit"
        actor: RevenueAccountant
        preconditions:
          - "at least one PerformanceObligation with contract_id == this contract exists"
        side_effects:
          - "for each ContractClause of this contract with is_non_standard == true and status == PENDING_REVIEW: create a ReviewTask (status ASSIGNED)"
        note: "revision loop — clauses already APPROVED keep their status and spawn no new task"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /revrec/contracts/{contract_id}/return"
        actor: RevenueManager
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /revrec/contracts/{contract_id}/approve"
        actor: RevenueManager
        preconditions:
          - "every ContractClause of this contract has status == APPROVED (ERR_REVIEW_OUTSTANDING)"
        side_effects:
          - "run ssp_allocation: set allocated_amount_cents on every non-CANCELLED POB (SSP snapshot pinned at this moment)"
          - "set allocated_total_cents = transaction_price_cents"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /revrec/contracts/{contract_id}/activate"
        actor: RevenueManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /revrec/contracts/{contract_id}/hold"
        actor: RevenueManager
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /revrec/contracts/{contract_id}/resume"
        actor: RevenueManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (evaluated after every recognition, invoice issue, or invoice void affecting the contract)"
        actor: system
        preconditions:
          - "every non-CANCELLED POB has status == SATISFIED"
          - "billed_to_date_cents == recognized_to_date_cents"
        side_effects:
          - "set completed_at"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /revrec/contracts/{contract_id}/cancel"
        actor: RevenueAccountant
        preconditions: []
        side_effects:
          - "all POBs of this contract with status in {PENDING, IN_PROGRESS} -> CANCELLED"
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /revrec/contracts/{contract_id}/cancel"
        actor: RevenueAccountant
        preconditions: []
        side_effects:
          - "all POBs of this contract with status in {PENDING, IN_PROGRESS} -> CANCELLED"
      - from: CHANGES_REQUESTED
        to: CANCELLED
        trigger: "POST /revrec/contracts/{contract_id}/cancel"
        actor: RevenueAccountant
        preconditions: []
        side_effects:
          - "all POBs of this contract with status in {PENDING, IN_PROGRESS} -> CANCELLED"
      - from: DRAFT
        to: ABSORBED
        trigger: "system (this contract is the absorbed_contract_id of POST /revrec/contracts/{contract_id}/absorb on the survivor)"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "set combined_into_contract_id = survivor contract id"
          - "every POB of this contract has contract_id re-pointed to the survivor"
          - "survivor.fixed_consideration_cents += this contract's fixed_consideration_cents"
          - "survivor.transaction_price_cents recomputed"
      - from: IN_REVIEW
        to: ABSORBED
        trigger: "system (absorption, as above)"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "set combined_into_contract_id = survivor contract id"
          - "every POB of this contract has contract_id re-pointed to the survivor"
          - "survivor.fixed_consideration_cents += this contract's fixed_consideration_cents"
          - "survivor.transaction_price_cents recomputed"
      - from: CHANGES_REQUESTED
        to: ABSORBED
        trigger: "system (absorption, as above)"
        actor: RevenueManager
        preconditions: []
        side_effects:
          - "set combined_into_contract_id = survivor contract id"
          - "every POB of this contract has contract_id re-pointed to the survivor"
          - "survivor.fixed_consideration_cents += this contract's fixed_consideration_cents"
          - "survivor.transaction_price_cents recomputed"

  - entity: PerformanceObligation
    initial_state: PENDING
    terminal_states: [SATISFIED, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system (first RECOGNITION or CATCH_UP_ADJUSTMENT RevenueEntry posted for this POB)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "system (over-time progress ratio reaches exactly 1.0 after a cost entry or recognize run)"
        actor: system
        preconditions: []
        side_effects:
          - "set satisfied_at"
          - "re-evaluate contract auto-completion"
      - from: PENDING
        to: SATISFIED
        trigger: "POST /revrec/pobs/{pob_id}/satisfy (POINT_IN_TIME delivery acceptance)"
        actor: RevenueAccountant
        preconditions:
          - "owning contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "recognition_pattern == POINT_IN_TIME (ERR_RECOGNITION_PATTERN_FORBIDDEN)"
          - "period containing the current clock date has status in {OPEN, REOPENED} (ERR_PERIOD_CLOSED)"
        side_effects:
          - "post one RECOGNITION RevenueEntry with amount_cents = allocated_amount_cents - recognized_revenue_cents at the clock date (skipped if zero)"
          - "set satisfied_at"
          - "re-evaluate contract auto-completion"
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "POST /revrec/pobs/{pob_id}/satisfy (POINT_IN_TIME, after partial entries)"
        actor: RevenueAccountant
        preconditions:
          - "owning contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "recognition_pattern == POINT_IN_TIME (ERR_RECOGNITION_PATTERN_FORBIDDEN)"
          - "period containing the current clock date has status in {OPEN, REOPENED} (ERR_PERIOD_CLOSED)"
        side_effects:
          - "post one RECOGNITION RevenueEntry for the remaining allocated amount (skipped if zero)"
          - "set satisfied_at"
          - "re-evaluate contract auto-completion"
      - from: PENDING
        to: CANCELLED
        trigger: "system (owning contract is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (owning contract is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VariableConsiderationEstimate
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /revrec/vc-estimates/{estimate_id}/approve"
        actor: RevenueManager
        preconditions:
          - "X-User-ID != proposed_by_user_id (ERR_SOD_VIOLATION)"
          - "when contract status == ACTIVE and reallocation would post catch-up entries: period containing the current clock date has status in {OPEN, REOPENED} (ERR_PERIOD_CLOSED)"
        side_effects:
          - "prior APPROVED estimate of this contract (if any) -> SUPERSEDED"
          - "contract.active_vc_estimate_id = this estimate; contract.vc_estimate_cents = constrained_amount_cents"
          - "contract.transaction_price_cents recomputed"
          - "when contract status in {APPROVED, ACTIVE}: re-run ssp_allocation over non-CANCELLED POBs; when ACTIVE additionally run catch_up_adjustment (posts signed CATCH_UP_ADJUSTMENT entries with origin ESTIMATE for POBs whose recognition target moved)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /revrec/vc-estimates/{estimate_id}/reject"
        actor: RevenueManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer estimate of the same contract is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ContractModification
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /revrec/modifications/{modification_id}/approve"
        actor: RevenueManager
        preconditions:
          - "owning contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "X-User-ID != proposed_by_user_id (ERR_SOD_VIOLATION)"
          - "mod_type == CUMULATIVE_CATCH_UP: period containing the current clock date has status in {OPEN, REOPENED} (ERR_PERIOD_CLOSED)"
          - "reallocation must not leave any POB with allocated_amount_cents < recognized_revenue_cents (ERR_OVER_RECOGNITION)"
          - "mod_type == PROSPECTIVE: at least one POB with status == PENDING (ERR_NO_PENDING_POB)"
        side_effects:
          - "CUMULATIVE_CATCH_UP: contract.fixed_consideration_cents += delta; transaction_price recomputed; ssp_allocation re-run over all non-CANCELLED POBs; catch_up_adjustment posts signed CATCH_UP_ADJUSTMENT entries (origin MODIFICATION) into the clock-date period for POBs whose target moved"
          - "PROSPECTIVE: contract.fixed_consideration_cents += delta; transaction_price recomputed; the delta is allocated pro-rata by ssp_cents over PENDING POBs only (round_half_up per POB in created_at ASC order, residual to the PENDING POB with greatest ssp_cents, tie earliest created_at); no catch-up entries"
          - "SEPARATE_CONTRACT: a new Contract is created (status DRAFT, same customer_id, signed_date = effective_date, fixed_consideration_cents = delta, risk_tier copied); spawned_contract_id set on this modification; original contract unchanged"
          - "set approved_by_user_id"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /revrec/modifications/{modification_id}/reject"
        actor: RevenueManager
        preconditions: []
        side_effects: []

  - entity: ReviewTask
    initial_state: ASSIGNED
    terminal_states: [DECIDED]
    transitions:
      - from: ASSIGNED
        to: IN_REVIEW
        trigger: "POST /revrec/review-tasks/{task_id}/start"
        actor: ContractReviewer
        preconditions: []
        side_effects:
          - "reviewer_user_id = X-User-ID"
      - from: IN_REVIEW
        to: RECOMMENDED
        trigger: "POST /revrec/review-tasks/{task_id}/recommend"
        actor: ContractReviewer
        preconditions:
          - "reviewer_user_id == X-User-ID (ERR_NOT_TASK_OWNER)"
        side_effects:
          - "recommendation and recommended_by_user_id recorded"
      - from: RECOMMENDED
        to: DECIDED
        trigger: "POST /revrec/review-tasks/{task_id}/decide with decision in {APPROVED, REJECTED}"
        actor: ContractReviewer
        preconditions:
          - "X-User-ID != recommended_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "decision and decided_by_user_id recorded"
          - "the reviewed ContractClause.status := APPROVED when decision == APPROVED, REJECTED when decision == REJECTED"
      - from: RECOMMENDED
        to: IN_REVIEW
        trigger: "POST /revrec/review-tasks/{task_id}/decide with decision == RETURN"
        actor: ContractReviewer
        preconditions:
          - "X-User-ID != recommended_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "recommendation, recommended_by_user_id cleared"
        note: "rework loop — the original reviewer keeps the task"

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /revrec/invoices/{invoice_id}/void"
        actor: RevenueManager
        preconditions:
          - "period containing the current clock date has status in {OPEN, REOPENED} (ERR_PERIOD_CLOSED)"
        side_effects:
          - "contract.billed_to_date_cents -= amount_cents"
          - "contract.deferred_revenue_balance_cents / contract_asset_balance_cents recomputed"
          - "voided_by_user_id recorded"
          - "re-evaluate contract auto-completion"

  - entity: AccountingPeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /revrec/accounting-periods/{period_id}/close"
        actor: Controller
        preconditions: []
        side_effects:
          - "every RevenueEntry with posting_date in this period and status == POSTED -> LOCKED"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /revrec/accounting-periods/{period_id}/reopen"
        actor: Controller
        preconditions:
          - "reopened_once == false (ERR_PERIOD_REOPEN_LIMIT)"
          - "no other AccountingPeriod with start_date > this period's start_date has status == CLOSED (ERR_PERIOD_REOPEN_LIMIT)"
        side_effects:
          - "reopened_once := true"
          - "every DisclosurePack with accounting_period_id == this period and status == FINALIZED -> SUPERSEDED"
          - "for each DisclosurePack superseded by this reopen: auto-create a new DisclosurePack for the same period with status DRAFT"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /revrec/accounting-periods/{period_id}/close"
        actor: Controller
        preconditions: []
        side_effects:
          - "every RevenueEntry with posting_date in this period and status == POSTED -> LOCKED"

  - entity: DisclosurePack
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ASSEMBLED
        trigger: "POST /revrec/disclosure-packs/{pack_id}/assemble"
        actor: RevenueAccountant
        preconditions: []
        side_effects:
          - "run disclosure_assembly: populate rpo_cents, period_revenue_cents, revenue_by_region, revenue_by_product, contract_asset_total_cents, deferred_revenue_total_cents"
          - "assembled_by_user_id recorded"
      - from: ASSEMBLED
        to: FINALIZED
        trigger: "POST /revrec/disclosure-packs/{pack_id}/finalize"
        actor: Controller
        preconditions:
          - "the pack's AccountingPeriod has status == CLOSED (ERR_PACK_PERIOD_NOT_CLOSED)"
          - "X-User-ID != assembled_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "finalized_by_user_id recorded"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (the pack's AccountingPeriod is reopened)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SspPrice
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /revrec/ssp-prices/{ssp_id}/retire"
        actor: RevenueManager
        preconditions: []
        side_effects: []

  - entity: RevenueEntry
    initial_state: POSTED
    terminal_states: [LOCKED]
    transitions:
      - from: POSTED
        to: LOCKED
        trigger: "system (the containing AccountingPeriod is closed)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: modification-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /revrec/contracts/{id}/modifications"
    occ_field: expected_contract_version
    description: |
      Creating a ContractModification against a Contract whose version has
      advanced past the version the client observed is rejected. Multiple
      modifications may legitimately be proposed against the same ACTIVE
      contract, so the second of two strictly sequential creates is NOT
      rejected by state — it is rejected only when it carries a stale
      expected_contract_version, proving the client's view of the contract
      (its consideration, allocation, or lifecycle) is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: variable_consideration_estimate
    trigger: "POST /revrec/contracts/{id}/vc-estimates (estimate creation)"
    algorithm: weighted_scoring
    formula: |
      Input: scenarios = [{probability_bps, amount_cents}, ...] with sum(probability_bps) == 10000.
      EXPECTED_VALUE:
        unconstrained_amount_cents = round_half_up( sum(probability_bps * amount_cents) / 10000 )
      MOST_LIKELY:
        pick the scenario with the greatest probability_bps;
        tie-break: the earliest array index among those tied;
        unconstrained_amount_cents = that scenario's amount_cents.
      Random ids NEVER participate in the tie-break.
    input_set: "the scenarios array supplied at creation; nothing else"
    precision: "integer cents, round_half_up"
    variants:
      - name: expected_value
        when: "method == EXPECTED_VALUE"
        difference: "probability-weighted mean over all scenarios"
      - name: most_likely
        when: "method == MOST_LIKELY"
        difference: "single scenario amount at the modal probability; ignores all other scenarios, so identical scenario sets generally yield a different unconstrained amount"

  - name: variable_consideration_constraint
    trigger: "POST /revrec/contracts/{id}/vc-estimates (immediately after variable_consideration_estimate)"
    algorithm: threshold
    formula: |
      cap = {STANDARD: 0.85, ELEVATED: 0.70, HIGH: 0.50}[contract.risk_tier]
      constrained_amount_cents = min(unconstrained_amount_cents,
                                     floor(unconstrained_amount_cents * cap))
      Boundary: when unconstrained_amount_cents == floor(unconstrained * cap)
      the full unconstrained amount is included (min semantics, not strict <).
    input_set: "the estimate's unconstrained_amount_cents and the owning contract's risk_tier"
    constants:
      CAP_STANDARD: 0.85
      CAP_ELEVATED: 0.70
      CAP_HIGH: 0.50
    precision: "integer cents; floor for the cap term"
    variants:
      - name: tiered_caps
        when: "always — cap selected by contract.risk_tier"
        difference: "three cap levels make the same unconstrained amount constrain to three different constrained amounts across tiers"

  - name: ssp_allocation
    trigger: "POST /revrec/contracts/{contract_id}/approve; POST /revrec/modifications/{modification_id}/approve (CUMULATIVE_CATCH_UP reallocation); estimate approval on an APPROVED or ACTIVE contract"
    algorithm: waterfall_allocation
    formula: |
      pool = non-CANCELLED PerformanceObligations of the contract
      total_ssp = sum(pob.ssp_cents for pob in pool)
      for each pob, processed in created_at ASC order:
        raw_i = transaction_price_cents * pob.ssp_cents / total_ssp
        allocated_i = round_half_up(raw_i)            # round PER POB, then sum
      residual = transaction_price_cents - sum(allocated_i)
      residual is added to the pool POB with the greatest ssp_cents;
      tie-break: earliest created_at. Never use id for ordering.
      Sum invariant: sum(allocated_i after residual) == transaction_price_cents.
    input_set: "non-CANCELLED POBs of the contract at allocation time, with their pinned ssp_cents"
    precision: "integer cents, round_half_up per POB; rounding order pinned: per-line round first, residual last"
    variants:
      - name: full_reallocation
        when: "contract approve, CUMULATIVE_CATCH_UP modification, estimate approval on APPROVED/ACTIVE contract"
        difference: "pool = all non-CANCELLED POBs; the whole transaction price is redistributed"
      - name: prospective_delta_allocation
        when: "PROSPECTIVE modification approval"
        difference: "pool = PENDING POBs only; only delta_fixed_consideration_cents is distributed (added onto existing allocated amounts); recognized amounts are untouched"

  - name: over_time_progress
    trigger: "POST /revrec/pobs/{id}/cost-entries (input-cost pattern); POST /revrec/pobs/{pob_id}/recognize (any over-time pattern)"
    algorithm: threshold
    formula: |
      OVER_TIME_INPUT_COST:
        ratio = costs_incurred_to_date_cents / estimated_total_cost_cents
      OVER_TIME_STRAIGHT_LINE:
        total_days = (service_end_date - service_start_date) in whole days
        elapsed_days = (min(current logical clock date, service_end_date) - service_start_date) in whole days, clamped to >= 0
        ratio = elapsed_days / total_days
      ratio is clamped to <= 1.0 and NEVER rounded before use;
      recognized_target_cents = round_half_up(allocated_amount_cents * ratio)
      progress_pct = round_half_up(ratio, 6) — informational only.
      Boundary: ratio == 1.0 exactly (costs == estimate, or clock date >= service_end_date)
      flips the POB to SATISFIED; ratio 1 cent below the cost estimate does not.
    input_set: "the POB's own costs/dates and allocated_amount_cents; the logical clock for straight-line"
    precision: "integer cents, round_half_up on the final product only"
    variants:
      - name: input_cost
        when: "recognition_pattern == OVER_TIME_INPUT_COST"
        difference: "ratio driven by costs incurred vs estimated total cost"
      - name: straight_line
        when: "recognition_pattern == OVER_TIME_STRAIGHT_LINE"
        difference: "ratio driven by elapsed calendar days vs total service days under the logical clock — identical allocated amounts and identical elapsed wall time generally produce different recognized amounts than input_cost"

  - name: catch_up_adjustment
    trigger: "POST /revrec/modifications/{modification_id}/approve with mod_type == CUMULATIVE_CATCH_UP on an ACTIVE contract; POST /revrec/vc-estimates/{estimate_id}/approve on an ACTIVE contract when the allocation moved"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (the dependency is circular-looking; this order makes it well-defined):
        (1) apply the consideration change: fixed_consideration_cents += delta (or vc_estimate_cents := new constrained value);
        (2) recompute transaction_price_cents = fixed + vc_estimate;
        (3) re-run ssp_allocation over all non-CANCELLED POBs (full_reallocation variant);
        (4) for each over-time POB, recompute ratio per over_time_progress using CURRENT costs/clock (costs and dates do not change in this step);
        (5) target_i = round_half_up(allocated_i * ratio_i);
        (6) catch_up_i = target_i - recognized_revenue_cents_i;
        (7) post one RevenueEntry (entry_type CATCH_UP_ADJUSTMENT, origin MODIFICATION or ESTIMATE,
            posting_date = current logical clock date) per POB with catch_up_i != 0;
            POBs with catch_up_i == 0 get no entry.
      Guard (evaluated between steps 3 and 4): if any non-CANCELLED POB would land with
      allocated_i < recognized_revenue_cents_i, the whole approval is rejected with
      ERR_OVER_RECOGNITION and no field is mutated.
    input_set: "the contract, its non-CANCELLED POBs, the modification delta or new estimate"
    precision: "integer cents, round_half_up at step (5) only"

  - name: contract_balance_rollforward
    trigger: "invoice issue, invoice void, RevenueEntry posting (any origin), RevenueEntry reversal"
    algorithm: aggregation
    formula: |
      billed_to_date_cents      = sum(amount_cents of ISSUED invoices)  - sum(amount_cents of VOIDED invoices)
      recognized_to_date_cents  = sum(amount_cents of RevenueEntries with status in {POSTED, LOCKED})
      deferred_revenue_balance_cents = max(0, billed_to_date_cents - recognized_to_date_cents)
      contract_asset_balance_cents   = max(0, recognized_to_date_cents - billed_to_date_cents)
      Ledger identity (invariant, holds after every event):
        billed_to_date_cents - recognized_to_date_cents
          == deferred_revenue_balance_cents - contract_asset_balance_cents
      Per-period movements for the rollforward read:
        +amount in the period containing invoice_date on issue;
        -amount in the period containing the void's clock date on void;
        entry amount in the period containing posting_date;
        beginning balances = all movements with effective date < period.start_date.
    input_set: "all invoices and RevenueEntries of the contract regardless of status, with the status filters above"
    precision: "integer cents (exact)"

  - name: disclosure_assembly
    trigger: "POST /revrec/disclosure-packs/{pack_id}/assemble"
    algorithm: aggregation
    formula: |
      Let P = the pack's AccountingPeriod.
      entry_set = RevenueEntries with status in {POSTED, LOCKED} and posting_date inside [P.start_date, P.end_date)
      period_revenue_cents = sum(entry_set.amount_cents)
      revenue_by_region[r]  = sum over entry_set of amount where entry.pob.region == r
      revenue_by_product[p] = sum over entry_set of amount where entry.pob.product_code == p
      rpo_cents = sum over PerformanceObligations with status in {PENDING, IN_PROGRESS}
                  whose contract status is in {ACTIVE, ON_HOLD}
                  of (allocated_amount_cents - recognized_revenue_cents)
      contract_asset_total_cents   = sum of contract_asset_balance_cents over contracts with status in {ACTIVE, ON_HOLD, COMPLETED}
      deferred_revenue_total_cents = sum of deferred_revenue_balance_cents over contracts with status in {ACTIVE, ON_HOLD, COMPLETED}
    input_set: "explicitly filtered as above; DRAFT/IN_REVIEW/CHANGES_REQUESTED/APPROVED/CANCELLED/ABSORBED contracts contribute nothing to any figure"
    precision: "integer cents (exact)"

  - name: combination_window
    trigger: "POST /revrec/contracts/{contract_id}/absorb"
    algorithm: threshold
    formula: |
      Two contracts are combinable iff ALL hold:
        same customer_id
        abs(signed_date of survivor - signed_date of absorbed) <= 30 days  (boundary: exactly 30 days IS combinable)
        at least one of the two contracts has package_negotiated_flag == true
        both contracts have status in {DRAFT, IN_REVIEW, CHANGES_REQUESTED}
    input_set: "survivor and absorbed contract"
    constants:
      COMBINATION_WINDOW_DAYS: 30
    precision: "whole days (date subtraction)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty; X-User-Role must name a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the role is permitted on the endpoint per §1.5; task ownership: recommend requires reviewer_user_id == X-User-ID"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"
    note: "task ownership failures use ERR_NOT_TASK_OWNER (403) at this same priority"
  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right; required request fields present including pattern-conditional fields (service dates for OVER_TIME_STRAIGHT_LINE, estimated_total_cost_cents for OVER_TIME_INPUT_COST); enum fields hold declared members"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
    note: "missing/invalid request fields and bad enum members return ERR_INVALID_REQUEST (400) at this priority"
  - priority: 4
    category: state
    check: "optimistic concurrency: expected_contract_version == Contract.version on modification creation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /revrec/contracts/{id}/modifications"
  - priority: 5
    category: state
    check: "target resource is in a valid state for the operation (transition exists; contract ACTIVE where required; entry POSTED for reversal; period CLOSED for pack finalize)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
    note: "operation-specific state errors at this priority: ERR_CONTRACT_NOT_ACTIVE, ERR_ENTRY_LOCKED, ERR_PACK_PERIOD_NOT_CLOSED (all 409)"
  - priority: 6
    category: business_safety
    check: "compliance gates: all clauses APPROVED before contract approve; segregation of duties on approve/decide/finalize"
    error_id: ERR_REVIEW_OUTSTANDING
    http_status: 409
    applies_to: "POST /revrec/contracts/{id}/approve; approval/decision/finalization endpoints"
    note: "segregation-of-duties failures return ERR_SOD_VIOLATION (409) at this priority"
  - priority: 7
    category: business_temporal
    check: "posting/incurred dates must land in an OPEN or REOPENED period; period and SSP window overlap rules; combination window"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "recognition, cost, invoice, modification-approval, estimate-approval endpoints"
    note: "other errors at this priority: ERR_PERIOD_OVERLAP, ERR_PERIOD_REOPEN_LIMIT, ERR_SSP_WINDOW_OVERLAP, ERR_COMBINATION_WINDOW_EXCEEDED (all 409)"
  - priority: 8
    category: business_constraint
    check: "shape/constraint rules on amounts and structures: scenario weights sum to 10000; positive amounts; recognition-pattern compatibility; PROSPECTIVE modification needs a PENDING POB"
    error_id: ERR_SCENARIO_WEIGHTS
    http_status: 422
    applies_to: "creation and recognition endpoints"
    note: "other errors at this priority: ERR_INVALID_AMOUNT (422), ERR_RECOGNITION_PATTERN_FORBIDDEN (422), ERR_NO_PENDING_POB (422)"
  - priority: 9
    category: business_referential
    check: "cross-entity references must be resolvable and compatible: an ACTIVE SspPrice window must cover (product_code, region, signed_date); combination criteria must hold"
    error_id: ERR_SSP_NOT_FOUND
    http_status: 422
    applies_to: "POB creation, absorb"
    note: "combination-criteria failures return ERR_COMBINATION_CRITERIA_NOT_MET (422) at this priority"
  - priority: 10
    category: business_fiscal
    check: "money caps: reallocation may not push a POB's allocated amount below its recognized amount; cumulative ISSUED billings may not exceed transaction_price_cents"
    error_id: ERR_OVER_RECOGNITION
    http_status: 422
    applies_to: "modification approval, estimate approval, invoice creation"
    note: "billing overflow returns ERR_BILLING_EXCEEDS_PRICE (422) at this priority"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: "/revrec/customers"
    description: "Create a customer"
    roles: [RevenueAccountant]
    code: 201
    input: [legal_name, external_ref]
    output: Customer
    side_effects: []
  - method: GET
    path: "/revrec/customers/{customer_id}"
    description: "Get a customer"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Contracts ---
  - method: POST
    path: "/revrec/contracts"
    description: "Create a contract in DRAFT"
    roles: [RevenueAccountant]
    code: 201
    input: [customer_id, contract_ref, signed_date, fixed_consideration_cents, risk_tier, "package_negotiated_flag?"]
    output: Contract
    side_effects:
      - "status=DRAFT; vc_estimate_cents=0; transaction_price_cents=fixed_consideration_cents; balances zero"
  - method: GET
    path: "/revrec/contracts/{contract_id}"
    description: "Get a contract"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/revrec/contracts"
    description: "List contracts with pagination"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: ["customer_id?", "status?", "combined_into_contract_id?"]
    output: "Contract[]"
    side_effects: []
  - method: POST
    path: "/revrec/contracts/{contract_id}/submit"
    description: "Submit for review (DRAFT or CHANGES_REQUESTED -> IN_REVIEW); spawns a ReviewTask per PENDING_REVIEW non-standard clause"
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "status -> IN_REVIEW"
      - "create ReviewTask (ASSIGNED) per non-standard clause still PENDING_REVIEW"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/return"
    description: "Return for changes (IN_REVIEW -> CHANGES_REQUESTED)"
    roles: [RevenueManager]
    code: 200
    input: [reason]
    output: Contract
    side_effects:
      - "status -> CHANGES_REQUESTED"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/approve"
    description: "Approve pricing/allocation (IN_REVIEW -> APPROVED); pins the SSP snapshot and runs ssp_allocation"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "status -> APPROVED"
      - "runs ssp_allocation over non-CANCELLED POBs; sets allocated_total_cents"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/activate"
    description: "Activate an APPROVED contract"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "status -> ACTIVE"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/hold"
    description: "Place an ACTIVE contract ON_HOLD (blocks recognition, cost, invoice, modification operations)"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "status -> ON_HOLD"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/resume"
    description: "Resume an ON_HOLD contract"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "status -> ACTIVE"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/cancel"
    description: "Cancel a contract in DRAFT, IN_REVIEW, or CHANGES_REQUESTED"
    roles: [RevenueAccountant]
    code: 200
    input: [reason]
    output: Contract
    side_effects:
      - "status -> CANCELLED; non-terminal POBs -> CANCELLED"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/contracts/{contract_id}/absorb"
    description: "Combination assessment: absorb another pre-approval contract of the same customer into this (surviving) contract"
    roles: [RevenueManager]
    code: 200
    input: [absorbed_contract_id]
    output: Contract
    side_effects:
      - "absorbed contract -> ABSORBED with combined_into_contract_id = this contract"
      - "absorbed contract's POBs re-pointed to this contract"
      - "this contract's fixed_consideration_cents += absorbed fixed_consideration_cents; transaction_price recomputed"
      - "increments Contract.version by 1"

  # --- Performance Obligations ---
  - method: POST
    path: "/revrec/contracts/{id}/pobs"
    description: "Add a performance obligation while the contract is DRAFT or CHANGES_REQUESTED"
    roles: [RevenueAccountant]
    code: 201
    input: [pob_ref, product_code, region, recognition_pattern, "description?", "service_start_date?", "service_end_date?", "estimated_total_cost_cents?"]
    output: PerformanceObligation
    side_effects:
      - "resolves ssp_cents from the ACTIVE SspPrice whose CLOSED window covers (product_code, region) at the contract's signed_date (ERR_SSP_NOT_FOUND)"
      - "status=PENDING; allocated_amount_cents=0; recognized_revenue_cents=0"
  - method: GET
    path: "/revrec/contracts/{id}/pobs"
    description: "List POBs of a contract"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: "PerformanceObligation[]"
    side_effects: []
  - method: GET
    path: "/revrec/pobs/{pob_id}"
    description: "Get a POB"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: PerformanceObligation
    side_effects: []
  - method: POST
    path: "/revrec/pobs/{pob_id}/satisfy"
    description: "Accept delivery of a POINT_IN_TIME POB (PENDING or IN_PROGRESS -> SATISFIED)"
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: PerformanceObligation
    side_effects:
      - "posts one RECOGNITION entry (origin SATISFY) for allocated_amount_cents - recognized_revenue_cents at the clock date when non-zero"
      - "status -> SATISFIED; satisfied_at stamped; contract auto-completion re-evaluated"
  - method: POST
    path: "/revrec/pobs/{pob_id}/recognize"
    description: "Sync over-time recognition for one POB against the logical clock (no-op when the recognition delta is zero)"
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: PerformanceObligation
    side_effects:
      - "computes target via over_time_progress; when target > recognized_revenue_cents posts one RECOGNITION entry (origin RECOGNIZE) for the difference into the clock-date period"
      - "when ratio reaches exactly 1.0: status -> SATISFIED, satisfied_at stamped, contract auto-completion re-evaluated"
  - method: POST
    path: "/revrec/pobs/{id}/cost-entries"
    description: "Record incurred cost for an OVER_TIME_INPUT_COST POB"
    roles: [RevenueAccountant]
    code: 201
    input: [amount_cents, incurred_date, "memo?"]
    output: CostEntry
    side_effects:
      - "costs_incurred_to_date_cents += amount_cents"
      - "recomputes input-cost progress; when the recognition target advanced, posts one RECOGNITION entry (origin COST_ENTRY) for the difference with posting_date = incurred_date"
      - "when ratio reaches exactly 1.0: status -> SATISFIED, satisfied_at stamped, contract auto-completion re-evaluated"
  - method: GET
    path: "/revrec/pobs/{id}/cost-entries"
    description: "List cost entries of a POB"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: "CostEntry[]"
    side_effects: []

  # --- Variable Consideration Estimates ---
  - method: POST
    path: "/revrec/contracts/{id}/vc-estimates"
    description: "Propose a variable consideration estimate (contract in DRAFT, CHANGES_REQUESTED, APPROVED, or ACTIVE)"
    roles: [RevenueAccountant]
    code: 201
    input: [method, scenarios]
    output: VariableConsiderationEstimate
    side_effects:
      - "computes unconstrained_amount_cents (method variant) and constrained_amount_cents (constraint cap)"
      - "status=PROPOSED; proposed_by_user_id recorded"
  - method: GET
    path: "/revrec/contracts/{id}/vc-estimates"
    description: "List variable consideration estimates of a contract"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: ["status?"]
    output: "VariableConsiderationEstimate[]"
    side_effects: []
  - method: POST
    path: "/revrec/vc-estimates/{estimate_id}/approve"
    description: "Approve an estimate (PROPOSED -> APPROVED); supersedes the prior APPROVED estimate; on APPROVED/ACTIVE contracts re-runs allocation, and on ACTIVE contracts posts catch-up entries"
    roles: [RevenueManager]
    code: 200
    input: []
    output: VariableConsiderationEstimate
    side_effects:
      - "status -> APPROVED; prior APPROVED estimate -> SUPERSEDED"
      - "contract.vc_estimate_cents / transaction_price_cents recomputed; increments Contract.version by 1"
      - "contract APPROVED or ACTIVE: re-runs ssp_allocation; contract ACTIVE: runs catch_up_adjustment (origin ESTIMATE)"
  - method: POST
    path: "/revrec/vc-estimates/{estimate_id}/reject"
    description: "Reject a PROPOSED estimate"
    roles: [RevenueManager]
    code: 200
    input: []
    output: VariableConsiderationEstimate
    side_effects: ["status -> REJECTED"]

  # --- Contract Modifications ---
  - method: POST
    path: "/revrec/contracts/{id}/modifications"
    description: "Propose a modification against an ACTIVE contract (OCC-guarded on Contract.version)"
    roles: [RevenueAccountant]
    code: 201
    input: [mod_type, delta_fixed_consideration_cents, effective_date, expected_contract_version, "reason?"]
    output: ContractModification
    side_effects:
      - "status=PROPOSED; proposed_by_user_id recorded"
      - "increments Contract.version by 1"
  - method: GET
    path: "/revrec/contracts/{id}/modifications"
    description: "List modifications of a contract"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: "ContractModification[]"
    side_effects: []
  - method: POST
    path: "/revrec/modifications/{modification_id}/approve"
    description: "Approve a PROPOSED modification; applies the accounting treatment for its mod_type"
    roles: [RevenueManager]
    code: 200
    input: []
    output: ContractModification
    side_effects:
      - "status -> APPROVED; approved_by_user_id recorded"
      - "CUMULATIVE_CATCH_UP: fixed += delta; reallocate; post CATCH_UP_ADJUSTMENT entries (origin MODIFICATION) into the clock-date period"
      - "PROSPECTIVE: fixed += delta; allocate the delta across PENDING POBs only"
      - "SEPARATE_CONTRACT: create a new DRAFT contract for the delta; set spawned_contract_id"
      - "increments Contract.version by 1"
  - method: POST
    path: "/revrec/modifications/{modification_id}/reject"
    description: "Reject a PROPOSED modification"
    roles: [RevenueManager]
    code: 200
    input: []
    output: ContractModification
    side_effects: ["status -> REJECTED"]

  # --- Contract Clauses ---
  - method: POST
    path: "/revrec/contracts/{id}/clauses"
    description: "Record a contract clause while the contract is DRAFT or CHANGES_REQUESTED"
    roles: [RevenueAccountant]
    code: 201
    input: [clause_code, clause_type, is_non_standard, "clause_text?"]
    output: ContractClause
    side_effects:
      - "status = PENDING_REVIEW when is_non_standard, else APPROVED"
  - method: GET
    path: "/revrec/contracts/{id}/clauses"
    description: "List clauses of a contract"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: "ContractClause[]"
    side_effects: []

  # --- Review Tasks ---
  - method: GET
    path: "/revrec/review-tasks"
    description: "List review tasks with pagination"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: ["contract_id?", "clause_id?", "status?", "reviewer_user_id?"]
    output: "ReviewTask[]"
    side_effects: []
  - method: GET
    path: "/revrec/review-tasks/{task_id}"
    description: "Get a review task"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: ReviewTask
    side_effects: []
  - method: POST
    path: "/revrec/review-tasks/{task_id}/start"
    description: "Claim an ASSIGNED task (ASSIGNED -> IN_REVIEW)"
    roles: [ContractReviewer]
    code: 200
    input: []
    output: ReviewTask
    side_effects: ["reviewer_user_id = X-User-ID"]
  - method: POST
    path: "/revrec/review-tasks/{task_id}/recommend"
    description: "Submit a recommendation (IN_REVIEW -> RECOMMENDED); only the claiming reviewer"
    roles: [ContractReviewer]
    code: 200
    input: [recommendation, "note?"]
    output: ReviewTask
    side_effects: ["recommendation and recommended_by_user_id recorded"]
  - method: POST
    path: "/revrec/review-tasks/{task_id}/decide"
    description: "Decide a RECOMMENDED task; decider must differ from recommender; APPROVED/REJECTED finalize the clause, RETURN loops back to IN_REVIEW"
    roles: [ContractReviewer]
    code: 200
    input: [decision, "note?"]
    output: ReviewTask
    side_effects:
      - "decision APPROVED/REJECTED: status -> DECIDED; clause status := decision"
      - "decision RETURN: status -> IN_REVIEW; recommendation and recommended_by_user_id cleared"

  # --- Invoices ---
  - method: POST
    path: "/revrec/contracts/{id}/invoices"
    description: "Issue an invoice against an ACTIVE contract (created directly in ISSUED)"
    roles: [RevenueAccountant]
    code: 201
    input: [invoice_ref, amount_cents, invoice_date]
    output: Invoice
    side_effects:
      - "status=ISSUED; contract.billed_to_date_cents += amount_cents"
      - "contract deferred/asset balances recomputed; auto-completion re-evaluated"
      - "increments Contract.version by 1"
  - method: GET
    path: "/revrec/contracts/{id}/invoices"
    description: "List invoices of a contract"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/revrec/invoices/{invoice_id}/void"
    description: "Void an ISSUED invoice"
    roles: [RevenueManager]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "status -> VOIDED; contract.billed_to_date_cents -= amount_cents; balances recomputed; auto-completion re-evaluated"
      - "increments Contract.version by 1"

  # --- Accounting Periods ---
  - method: POST
    path: "/revrec/accounting-periods"
    description: "Create an accounting period; HALF-OPEN [start_date, end_date) windows must not overlap any other period (adjacency allowed)"
    roles: [Controller]
    code: 201
    input: [period_code, start_date, end_date]
    output: AccountingPeriod
    side_effects: ["status=OPEN; recognized_total_cents=0"]
  - method: GET
    path: "/revrec/accounting-periods/{period_id}"
    description: "Get an accounting period"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: []
  - method: POST
    path: "/revrec/accounting-periods/{period_id}/close"
    description: "Close an OPEN or REOPENED period; locks its POSTED revenue entries"
    roles: [Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: ["status -> CLOSED; RevenueEntries in period POSTED -> LOCKED"]
  - method: POST
    path: "/revrec/accounting-periods/{period_id}/reopen"
    description: "Reopen a CLOSED period (at most once, and only when no later period is CLOSED)"
    roles: [Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects:
      - "status -> REOPENED; reopened_once = true"
      - "FINALIZED DisclosurePacks of this period -> SUPERSEDED; one replacement DRAFT pack auto-created per superseded pack"

  # --- Revenue Entries ---
  - method: GET
    path: "/revrec/revenue-entries/{entry_id}"
    description: "Get a revenue entry"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: RevenueEntry
    side_effects: []
  - method: GET
    path: "/revrec/revenue-entries"
    description: "List revenue entries with pagination"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: ["contract_id?", "pob_id?", "accounting_period_id?", "entry_type?", "reversed_entry_id?"]
    output: "RevenueEntry[]"
    side_effects: []
  - method: POST
    path: "/revrec/revenue-entries/{entry_id}/reverse"
    description: "Post a compensating REVERSAL entry (negated amount) against a POSTED entry"
    roles: [RevenueAccountant]
    code: 201
    input: ["reason?"]
    output: RevenueEntry
    side_effects:
      - "creates a RevenueEntry with entry_type REVERSAL, amount_cents = -reversed amount, reversed_entry_id set, posting_date = clock date, origin REVERSAL"
      - "contract and period aggregates recomputed; contract auto-completion re-evaluated"
      - "increments Contract.version by 1"

  # --- Disclosure Packs ---
  - method: POST
    path: "/revrec/accounting-periods/{id}/disclosure-packs"
    description: "Create a DRAFT disclosure pack for a period"
    roles: [RevenueAccountant]
    code: 201
    input: []
    output: DisclosurePack
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/revrec/accounting-periods/{id}/disclosure-packs"
    description: "List disclosure packs of a period"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: []
    output: "DisclosurePack[]"
    side_effects: []
  - method: POST
    path: "/revrec/disclosure-packs/{pack_id}/assemble"
    description: "Assemble disclosure data (DRAFT -> ASSEMBLED)"
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: DisclosurePack
    side_effects: ["runs disclosure_assembly; records assembled_by_user_id"]
  - method: POST
    path: "/revrec/disclosure-packs/{pack_id}/finalize"
    description: "Finalize an ASSEMBLED pack; period must be CLOSED; finalizer must differ from assembler"
    roles: [Controller]
    code: 200
    input: []
    output: DisclosurePack
    side_effects: ["status -> FINALIZED; records finalized_by_user_id"]

  # --- Standalone Selling Prices ---
  - method: POST
    path: "/revrec/ssp-prices"
    description: "Create an ACTIVE SSP record; CLOSED [effective_from, effective_to] windows of the same (product_code, region) must not overlap or touch (shared boundary date conflicts)"
    roles: [RevenueManager]
    code: 201
    input: [product_code, region, ssp_cents, effective_from, effective_to]
    output: SspPrice
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/revrec/ssp-prices/{ssp_id}/retire"
    description: "Retire an ACTIVE SSP record"
    roles: [RevenueManager]
    code: 200
    input: []
    output: SspPrice
    side_effects: ["status -> RETIRED"]

  # --- Computed read: rollforward ---
  - method: GET
    path: "/revrec/contracts/{contract_id}/rollforward"
    description: "Contract asset/liability and deferred revenue rollforward for one period"
    roles: [RevenueAccountant, RevenueManager, ContractReviewer, Controller]
    code: 200
    input: [accounting_period_id]
    output: "{ contract_id: string, accounting_period_id: string, beginning_billed_cents: integer, beginning_recognized_cents: integer, billed_cents: integer, recognized_cents: integer, catch_up_cents: integer, reversal_cents: integer, ending_billed_cents: integer, ending_recognized_cents: integer, ending_deferred_revenue_cents: integer, ending_contract_asset_cents: integer }"
    side_effects: []

  # --- Test-driving endpoint: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z; before any set_current_utc call the clock reads that default and never the wall clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or names an undeclared role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required request field missing (including pattern-conditional fields), malformed value, or undeclared enum member" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "The caller's role is not permitted on this endpoint" }
  - { id: ERR_NOT_TASK_OWNER, http: 403, condition: "recommend attempted by a user other than the claiming reviewer_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not identify an existing resource" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version does not equal the contract's current version" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "No transition from the resource's current state for this trigger" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires the owning contract to be ACTIVE (recognize, satisfy, cost entry, invoice issue, modification creation/approval)" }
  - { id: ERR_ENTRY_LOCKED, http: 409, condition: "Reversal attempted on a RevenueEntry whose status is LOCKED" }
  - { id: ERR_PACK_PERIOD_NOT_CLOSED, http: 409, condition: "Disclosure pack finalize attempted while its AccountingPeriod is not CLOSED" }
  - { id: ERR_REVIEW_OUTSTANDING, http: 409, condition: "Contract approve attempted while a clause is PENDING_REVIEW or REJECTED" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties: approver equals proposer, decider equals recommender, or finalizer equals assembler" }
  - { id: ERR_PERIOD_CLOSED, http: 409, condition: "Posting date (clock date, incurred_date, or invoice_date) falls in a period that is CLOSED or in no period at all" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "New period's HALF-OPEN [start_date, end_date) intersects an existing period; adjacency (start == other end) is allowed" }
  - { id: ERR_PERIOD_REOPEN_LIMIT, http: 409, condition: "Period was already reopened once, or a later period is CLOSED" }
  - { id: ERR_SSP_WINDOW_OVERLAP, http: 409, condition: "New SSP window for the same (product_code, region) overlaps an ACTIVE record under CLOSED-interval semantics (shared boundary date is a conflict)" }
  - { id: ERR_COMBINATION_WINDOW_EXCEEDED, http: 409, condition: "Signed dates of survivor and absorbed differ by more than 30 days" }
  - { id: ERR_SCENARIO_WEIGHTS, http: 422, condition: "Scenario probability_bps values do not sum to exactly 10000" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "amount_cents <= 0 where positive required, or delta_fixed_consideration_cents == 0" }
  - { id: ERR_RECOGNITION_PATTERN_FORBIDDEN, http: 422, condition: "satisfy on an over-time POB, or cost entry / recognize on a POINT_IN_TIME POB" }
  - { id: ERR_NO_PENDING_POB, http: 422, condition: "PROSPECTIVE modification approval with no POB in PENDING status to receive the delta" }
  - { id: ERR_SSP_NOT_FOUND, http: 422, condition: "No ACTIVE SspPrice covers the POB's (product_code, region) at the contract's signed_date" }
  - { id: ERR_COMBINATION_CRITERIA_NOT_MET, http: 422, condition: "Absorb attempted across different customers, or neither contract has package_negotiated_flag" }
  - { id: ERR_OVER_RECOGNITION, http: 422, condition: "Reallocation would leave a POB with allocated_amount_cents < recognized_revenue_cents" }
  - { id: ERR_BILLING_EXCEEDS_PRICE, http: 422, condition: "Cumulative ISSUED billings would exceed transaction_price_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RevenueAccountant
    description: "Preparer: builds contracts, POBs, clauses, estimates, modifications, invoices, cost entries, reversals; assembles disclosure packs"
    identity: opaque
    exclusive_operations:
      - "POST /revrec/customers"
      - "POST /revrec/contracts and /submit, /cancel"
      - "POST .../pobs, /clauses, /vc-estimates, /modifications, /invoices"
      - "POST /revrec/pobs/{id}/satisfy, /recognize, /cost-entries"
      - "POST /revrec/revenue-entries/{id}/reverse"
      - "POST .../disclosure-packs and /assemble"
    shared_operations:
      - "all GET endpoints"
  - name: RevenueManager
    description: "Approver: approves allocations, estimates, modifications; maintains the SSP master; holds/resumes; voids invoices; runs absorptions"
    identity: opaque
    exclusive_operations:
      - "POST /revrec/contracts/{id}/return, /approve, /activate, /hold, /resume, /absorb"
      - "POST /revrec/vc-estimates/{id}/approve, /reject"
      - "POST /revrec/modifications/{id}/approve, /reject"
      - "POST /revrec/invoices/{id}/void"
      - "POST /revrec/ssp-prices and /retire"
    shared_operations:
      - "all GET endpoints"
  - name: ContractReviewer
    description: "Legal/contract reviewer for non-standard terms; claims, recommends, and decides review tasks"
    identity: opaque
    exclusive_operations:
      - "POST /revrec/review-tasks/{id}/start, /recommend, /decide"
    shared_operations:
      - "all GET endpoints"
  - name: Controller
    description: "Owns the ledger calendar: opens/closes/reopens periods and finalizes disclosure packs"
    identity: opaque
    exclusive_operations:
      - "POST /revrec/accounting-periods and /close, /reopen"
      - "POST /revrec/disclosure-packs/{id}/finalize"
    shared_operations:
      - "all GET endpoints"
  - name: SystemAdmin
    description: "Test harness operator; logical clock only — no business operations, no business reads"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
