              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-ONE", workpiece_material_code: "SS316L", workpiece_group: "M", units_consumed: 1, cutting_speed_vc: 180.0, feed_fz: 0.20, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-2"
              captures: { err_empty: $.data.error_id }
          assert:
            - "${err_over} == ERR_INSUFFICIENT_BATCH_UNITS and HTTP status == 422"
            - "no trial row exists with trial_code TRL-BIG and PowderBlendBatch.${batch_id}.remaining_units is still 180"
            - "MachiningTrial.${trial_all} is created with status RUNNING and PowderBlendBatch.${batch_id}.remaining_units == 0"
            - "${err_empty} == ERR_INSUFFICIENT_BATCH_UNITS (an exhausted batch cannot supply even one tool)"

      - name: customer_account_state_gates_recondition_intake_before_credit
        claim_type: priority_conflict
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - errors.ERR_CUSTOMER_CREDIT_HOLD
          - errors.ERR_CUSTOMER_CLOSED
          - errors.ERR_INSUFFICIENT_REGRIND_CREDIT
        distinguishing_aspect: "Three customers separate the account gate from the money gate: a CREDIT_HOLD account whose balance is also short returns ERR_CUSTOMER_CREDIT_HOLD (402) because priority 42 precedes 43, an ACTIVE but underfunded account returns ERR_INSUFFICIENT_REGRIND_CREDIT (422), and a CLOSED account returns ERR_CUSTOMER_CLOSED (409)."
        test_recipe:
          setup:
            - "Regrindable product EM-10-1"
            - "CU-H: created with 50000 credit then adjusted by -60000 so the balance is -10000 and the account flips to CREDIT_HOLD"
            - "CU-L: ACTIVE with 10000 credit; CU-X: created then closed"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-H", name: "Held Tooling", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { cu_h: $.data.id }
            - call: "POST /tooling/customers/${cu_h}/credit-adjustments"
              payload: { delta_cents: -60000, reason: "Charge-back on an unpaid reconditioning invoice" }
              as: ProductionPlanner
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-L", name: "Lean Tooling", tier: "STANDARD", regrind_credit_cents: 10000 }
              as: ProductionPlanner
              captures: { cu_l: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-X", name: "Exited Tooling", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { cu_x: $.data.id }
            - call: "POST /tooling/customers/${cu_x}/close"
              payload: { close_reason: "Customer left the programme" }
              as: ProductionPlanner
            - call: "GET /tooling/customers/${cu_h}"
              as: ProductionPlanner
              captures: { h_ver: $.data.version }
            - call: "GET /tooling/customers/${cu_l}"
              as: ProductionPlanner
              captures: { l_ver: $.data.version }
            - call: "GET /tooling/customers/${cu_x}"
              as: ProductionPlanner
              captures: { x_ver: $.data.version }
          trigger:
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${cu_h}", product_id: "${product_id}", job_code: "RJ-H", units_received: 10, expected_customer_version: "${h_ver}" }
              as: ProductionPlanner
              captures: { err_hold: $.data.error_id }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${cu_l}", product_id: "${product_id}", job_code: "RJ-L", units_received: 10, expected_customer_version: "${l_ver}" }
              as: ProductionPlanner
              captures: { err_credit: $.data.error_id }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${cu_x}", product_id: "${product_id}", job_code: "RJ-X", units_received: 10, expected_customer_version: "${x_ver}" }
              as: ProductionPlanner
              captures: { err_closed: $.data.error_id }
          assert:
            - "Customer.${cu_h}.regrind_credit_cents == -10000 and account_status == CREDIT_HOLD"
            - "${err_hold} == ERR_CUSTOMER_CREDIT_HOLD with HTTP status 402, not ERR_INSUFFICIENT_REGRIND_CREDIT"
            - "${err_credit} == ERR_INSUFFICIENT_REGRIND_CREDIT with HTTP status 422 (10 * 1850 = 18500 > 10000)"
            - "${err_closed} == ERR_CUSTOMER_CLOSED with HTTP status 409"
            - "no ReconditionJob row exists and no reserved_credit_cents moved on any of the three customers"

      - name: recondition_eligibility_conditions_are_checked_per_stage
        claim_type: conditional_validation
        grounds:
          - validations[priority=23]
          - validations[priority=24]
          - validations[priority=40]
          - errors.ERR_PRODUCT_NOT_REGRINDABLE
          - errors.ERR_INVALID_PREDECESSOR_CHAIN
          - errors.ERR_NO_REGRINDS_REMAINING
        distinguishing_aspect: "Each reconditioning gate belongs to a different stage: regrindability is checked at intake against tool_type, the predecessor chain is checked at intake against the predecessor's status, and remaining_regrinds is checked at refurbish, where a tool measured at 71.0 mm has 0 regrinds left yet is not scrap_recommended."
        test_recipe:
          setup:
            - "Two products: INSERT CAT-INS-1 and regrindable EM-10-1; customer CU-6 ACTIVE with 50000 credit; wheel WH-6 AVAILABLE"
            - "One job RJ-1 already at intake (RECEIVED) on EM-10-1"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { mill_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { insert_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-6", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-6", name: "Zeta Cutter Service", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver1: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${mill_id}", job_code: "RJ-1", units_received: 10, expected_customer_version: "${c_ver1}" }
              as: ProductionPlanner
              captures: { job1_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver2: $.data.version }
          trigger:
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${insert_id}", job_code: "RJ-INS", units_received: 10, expected_customer_version: "${c_ver2}" }
              as: ProductionPlanner
              captures: { err_regrindable: $.data.error_id }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${mill_id}", job_code: "RJ-2", units_received: 10, predecessor_job_id: "${job1_id}", expected_customer_version: "${c_ver2}" }
              as: ProductionPlanner
              captures: { err_chain: $.data.error_id }
            - call: "POST /tooling/recondition-jobs/${job1_id}/inspect"
              payload: { units_inspected: 10, measured_length_mm: 71.0, measured_corner_wear_um: 260.0 }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job1_id}/refurbish"
              payload: { wheel_id: "${wheel_id}", recoat_applied: false }
              as: ProductionPlanner
              captures: { err_no_regrinds: $.data.error_id }
          assert:
            - "${err_regrindable} == ERR_PRODUCT_NOT_REGRINDABLE and HTTP status == 422 (an INSERT is never reground)"
            - "${err_chain} == ERR_INVALID_PREDECESSOR_CHAIN (RJ-1 is RECEIVED, not RETURNED)"
            - "after inspect: ReconditionJob.${job1_id}.remaining_regrinds == 0, life_extension_pct == 0.0, scrap_recommended == false, warranted_life_extension_pct == 35.0"
            - "${err_no_regrinds} == ERR_NO_REGRINDS_REMAINING and the job stays INSPECTED"
            - "GrindingWheel.${wheel_id}.consumed_life_units == 0 because the refused refurbish charged nothing"

      - name: order_state_before_credit_hold_on_submission
        claim_type: priority_conflict
        grounds:
          - "validations[priority=12]"
          - "validations[priority=42]"
        excluded_because:
          difficulty_instance: order_state_beats_credit_hold
          rationale: "The 12-versus-42 ordering on order submission is exactly what that priority_pair_validation_conflict instance proves, including the 402 payload it must not return."

      - name: wheel_safety_before_cell_scheduling
        claim_type: priority_conflict
        grounds:
          - "validations[priority=15]"
          - "validations[priority=29]"
        excluded_because:
          difficulty_instance: wheel_safety_beats_cell_buffer
          rationale: "The 15-versus-29 ordering on grinding-run creation is covered there with the same wheel and cell fixtures."

      - name: chamber_capacity_is_an_aggregate_over_the_window
        claim_type: aggregate_validation
        grounds:
          - "validations[priority=27]"
          - "errors.ERR_CHAMBER_CAPACITY_EXCEEDED"
        excluded_because:
          difficulty_instance: coating_chamber_aggregate_area_within_overlap
          rationale: "The half-open aggregate area rule at priority 27, including the exactly-at-capacity acceptance, is the subject of that resource_temporal_overlap instance."

      - name: cell_exclusivity_and_setup_buffer
        claim_type: temporal_validation
        grounds:
          - "validations[priority=28]"
          - "validations[priority=29]"
        excluded_because:
          difficulty_instance: grinding_cell_exclusive_with_setup_buffer
          rationale: "Priorities 28 and 29 with their closed-interval semantics and the 45-minute buffer boundary are covered there."

      - name: trial_requires_a_passed_batch
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=16]"
          - "errors.ERR_BATCH_QC_NOT_PASSED"
        excluded_because:
          difficulty_instance: trial_create_requires_batch_qc_passed
          rationale: "Priority 16 against both a FAILED and a PASSED batch is the subject of that cross_entity_state_dependency instance."

      - name: confirmation_requires_a_qualified_grade
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=18]"
          - "errors.ERR_GRADE_NOT_QUALIFIED"
        excluded_because:
          difficulty_instance: order_confirm_requires_qualified_grade
          rationale: "Priority 18 at confirmation, and the fact that it surfaces instead of the pinning error, is proved there."

      - name: minimum_order_quantity_boundary
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority=31]"
          - "errors.ERR_BELOW_MIN_ORDER_QTY"
        excluded_because:
          difficulty_instance: order_quantity_equals_min_order_qty_passes
          rationale: "Priority 31 at exactly min_order_qty and one below it is the boundary_precision_check instance."

  - section: endpoints
    instances:
      - name: product_release_needs_an_approved_dossier_not_merely_the_right_state
        claim_type: conditional_action
        grounds:
          - endpoints[POST /tooling/tool-products/{productId}/release]
          - validations[priority=39]
          - errors.ERR_NO_APPROVED_DOSSIER
          - errors.ERR_INVALID_PRODUCT_STATE
        distinguishing_aspect: "The release action has two independent gates that must surface in the right order: a DEVELOPMENT product fails on state (priority 12) while a product correctly parked in QUALIFICATION with an OPEN dossier and a null tool_life_index fails on the dossier gate (priority 39)."
        test_recipe:
          setup:
            - "Grade WC-P25 (DEVELOPMENT), geometry CNMG-MM RELEASED, uncoated CATALOG product CAT-INS-1 in DEVELOPMENT"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
          trigger:
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              captures: { err_state: $.data.error_id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-9" }
              as: ApplicationEngineer
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/release"
              as: QualityApprover
              captures: { err_dossier: $.data.error_id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: QualityApprover
              captures: { rel: $.data.release_status, tli: $.data.tool_life_index, sup: $.data.supply_status }
          assert:
            - "${err_state} == ERR_INVALID_PRODUCT_STATE with HTTP status 409 (release is not a transition out of DEVELOPMENT)"
            - "${err_dossier} == ERR_NO_APPROVED_DOSSIER with HTTP status 422 (DOS-9 is OPEN, tool_life_index is null)"
            - "${rel} == QUALIFICATION and ${tli} == null and ${sup} == UNAVAILABLE (no partial release side effect leaked)"

      - name: speeds_feeds_read_multiplies_every_factor_and_reports_low_confidence
        claim_type: computed_read
        grounds:
          - endpoints[GET /tooling/tool-products/{productId}/speeds-feeds]
          - calculations.speeds_feeds_envelope
        distinguishing_aspect: "A pure computed read on a DEVELOPMENT uncoated product: P/RIGID/FLOOD yields 220 * 1.08 = 237.6 -> 238 while P/WEAK/DRY yields 220 * 1.08 * 0.70 * 0.60 = 99.792 -> 100, both with fz clamped by the nose fraction (0.8 * 0.35 = 0.280) and ap clamped by the MEDIUM class ceiling (3.00 < 4.0), and confidence_class LOW because the product is neither qualified for the group nor RELEASED."
        test_recipe:
          setup:
            - "Uncoated CATALOG product CAT-INS-1 in DEVELOPMENT on grade WC-P25 (co_binder_pct 6.0) and geometry CNMG-MM (MEDIUM, nose 0.8, max ap 4.0)"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
          trigger:
            - call: "GET /tooling/tool-products/${product_id}/speeds-feeds"
              payload: { workpiece_group: "P", machine_rigidity: "RIGID", coolant: "FLOOD" }
              as: ApplicationEngineer
              captures: { vc1: $.data.recommended_vc, fz1: $.data.recommended_fz, ap1: $.data.recommended_ap, conf1: $.data.confidence_class }
            - call: "GET /tooling/tool-products/${product_id}/speeds-feeds"
              payload: { workpiece_group: "P", machine_rigidity: "WEAK", coolant: "DRY" }
              as: Customer
              as_user_id: "cust-anon"
              captures: { vc2: $.data.recommended_vc, conf2: $.data.confidence_class }
            - call: "GET /tooling/tool-products/${product_id}/speeds-feeds"
              payload: { workpiece_group: "S", machine_rigidity: "RIGID", coolant: "THROUGH_TOOL" }
              as: ApplicationEngineer
              captures: { vc3: $.data.recommended_vc }
          assert:
            - "${vc1} == 238 and ${fz1} == 0.280 and ${ap1} == 3.00 and ${conf1} == LOW"
            - "${vc2} == 100 (0.60 dry factor applies because the product is uncoated, not 0.75) and ${conf2} == LOW"
            - "${vc3} == 71 (60 * 1.08 * 1.10 = 71.28 -> 71, far below the MEDIUM ceiling of 340)"
            - "nothing is persisted by any of the three reads: ToolProduct.${product_id}.version is unchanged"

      - name: expedite_flag_is_the_only_difference_between_a_rejected_and_an_accepted_order
        claim_type: conditional_action
        grounds:
          - endpoints[POST /tooling/tool-orders]
          - validations[priority=32]
          - calculations.engineering_lead_time_days
          - errors.ERR_EXPEDITE_NOT_ELIGIBLE
        distinguishing_aspect: "The same product and quantity are rejected with expedite_requested true and accepted with it false: the SPECIAL/CVD product carries raw_lead_days 15 + 7 + 6 = 28 so expedite_eligible is false, while the sibling CATALOG uncoated product carries 5 + 6 = 11 and accepts the very same expedited request."
        test_recipe:
          setup:
            - "Grade WC-P25 in DEVELOPMENT (unqualified, +6 days), geometry CNMG-MM RELEASED"
            - "CATALOG parent CAT-INS-1 (uncoated) and SPECIAL derivative SPC-INS-1 on a CVD recipe, both switched to supply_status MAKE_TO_ORDER so they are quotable while still in DEVELOPMENT"
            - "Customer CU-7 ACTIVE"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "CVD-TICN-2", deposition_type: "CVD", layers: [ { material: "TiCN", thickness_um: 6.0 } ] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { cat_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "SPC-INS-1", order_class: "SPECIAL", grade_id: "${grade_id}", geometry_id: "${geometry_id}", coating_recipe_id: "${recipe_id}", base_catalog_product_id: "${cat_id}", tool_type: "INSERT", list_price_cents: 9900, min_order_qty: 10, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { spc_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-7", name: "Eta Machining", tier: "STANDARD", regrind_credit_cents: 0 }
