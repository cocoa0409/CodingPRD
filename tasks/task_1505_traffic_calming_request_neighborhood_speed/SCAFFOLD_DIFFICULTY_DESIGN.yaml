  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — SpeedStudy recollection CYCLE vs
  # InstallationWorkOrder PARALLEL dimensions. Different entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: speed_study_recollection_cycle
        grounds:
          - state_machines.SpeedStudy.COLLECTING_to_ANALYZED
          - state_machines.SpeedStudy.ANALYZED_to_COLLECTING
          - calculations.study_aggregation
        distinguishing_aspect: |
          Cyclic shape on SpeedStudy: COLLECTING -> ANALYZED -> COLLECTING ->
          ANALYZED. The loop is not a no-op — observations added during the second
          COLLECTING leg change the recomputed provisional_score (20 -> 30).
        test_recipe:
          setup:
            - "Segment (limit 30, 4 households, LOCAL), 3 residents, request PETITION_MET"
