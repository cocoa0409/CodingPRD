              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-08T12:00:00Z", ends_at: "2026-06-08T09:00:00Z" }
              as: TechnicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TIME_RANGE, HTTP 400"

      - name: role_priority_auth_before_existence_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "A request that would fail BOTH role authorization (CastingDirector creating a production) and existence (n/a) returns the role error ERR_INSUFFICIENT_PERMISSIONS — authorization (priority 2) is evaluated before existence (priority 4)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, HTTP 403"

      - name: second_principal_confirm_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ROLE_PRINCIPAL_TAKEN]", state_machines.CastAssignment.PROPOSED_to_CONFIRMED]
        distinguishing_aspect: "Confirming a second PRINCIPAL on a role that already has a CONFIRMED principal fails with ERR_ROLE_PRINCIPAL_TAKEN; the second assignment stays PROPOSED."
        test_recipe:
          setup: ["production in BUILD; role; contracts A and B ACTIVE; assignment P1 (A, PRINCIPAL) CONFIRMED; assignment P2 (B, PRINCIPAL) PROPOSED"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/roles"
              payload: { production_id: "${prod}", role_name: "Odette/Odile", voice_type: "DANCER_F", is_title_role: true }
              as: CastingDirector
              captures: { role: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_a: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_a}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr_a: $.data.id }
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_a}", slot: "PRINCIPAL" }
              as: CastingDirector
              captures: { asg1: $.data.id }
            - call: "POST /opera/cast-assignments/${asg1}/confirm"
              payload: {}
              as: CastingDirector
            - call: "POST /opera/artists"
              payload: { full_name: "Bella Second", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_b: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_b}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr_b: $.data.id }
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_b}", slot: "PRINCIPAL" }
              as: CastingDirector
              captures: { asg2: $.data.id }
          trigger:
            - call: "POST /opera/cast-assignments/${asg2}/confirm"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROLE_PRINCIPAL_TAKEN, HTTP 409"
            - "CastAssignment.${asg2}.status remains PROPOSED"

  # ---------------------------------------------------------------------------
  # Section: endpoints — computed reads and conditional actions
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: pay_quote_computed_read_shape
        claim_type: computed_read
        grounds: [calculations.artist_weekly_pay_cents]
        excluded_because:
          difficulty_instance: artist_pay_projected_vs_final
          rationale: "The pay-quote endpoint's computed fields (projected/final hours and pay) are asserted with literals in the named §1.8 instance."

      - name: price_quote_computed_read_shape
        claim_type: computed_read
        grounds: [calculations.seat_price_cents]
        excluded_because:
          difficulty_instance: seat_price_nested_rounding_order
          rationale: "The price-quote endpoint's unit/multiplier/discount/total fields are asserted with literals in the named §1.8 instance."

      - name: performance_complete_conditional_action
        claim_type: conditional_action
        grounds: [state_machines.Performance.lifecycle_status=SCHEDULED_to_lifecycle_status=COMPLETED, "errors[ERR_PERFORMANCE_NOT_ENDED]"]
        distinguishing_aspect: "complete is rejected with ERR_PERFORMANCE_NOT_ENDED while the logical clock is before ends_at, and succeeds after the clock passes ends_at (readiness CLEARED_FOR_AUDIENCE)."
        test_recipe:
          setup:
            - "Production in REHEARSAL; surtitle 'en' LIVE; TECH slot DONE; performance 2026-07-05 19:00-22:00 with readiness CLEARED_FOR_AUDIENCE; logical clock at default 2026-05-01"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/surtitle-tracks"
              payload: { production_id: "${prod}", language: "en", cue_count: 400 }
              as: TechnicalDirector
              captures: { track: $.data.id }
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "TRANSLATED" }
              as: TechnicalDirector
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "CUES_LOCKED" }
              as: TechnicalDirector
            - call: "POST /opera/surtitle-tracks/${track}/transition"
              payload: { to_state: "LIVE" }
              as: TechnicalDirector
            - call: "POST /opera/stage-slots"
              payload: { production_id: "${prod}", slot_type: "TECH", starts_at: "2026-07-04T10:00:00Z", ends_at: "2026-07-04T14:00:00Z" }
              as: TechnicalDirector
              captures: { slot: $.data.id }
            - call: "POST /opera/stage-slots/${slot}/transition"
              payload: { to_state: "LOCKED" }
              as: TechnicalDirector
            - call: "POST /opera/stage-slots/${slot}/transition"
              payload: { to_state: "DONE" }
              as: TechnicalDirector
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-05T19:00:00Z", ends_at: "2026-07-05T22:00:00Z", sections: [ { section: "STALLS", total_seats: 50, base_price_cents: 15000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/tech-ready"
              payload: {}
              as: TechnicalDirector
            - call: "POST /opera/performances/${perf}/clear"
              payload: {}
              as: TechnicalDirector
          trigger:
            - call: "POST /opera/performances/${perf}/complete"
              payload: {}
              as: BoxOfficeManager
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opera/performances/${perf}/complete"
              payload: {}
              as: BoxOfficeManager
              captures: { life: $.data.lifecycle_status }
          assert:
            - "first complete rejected with error_id == ERR_PERFORMANCE_NOT_ENDED  (clock 2026-05-01 default <= ends_at)"
            - "after clock set past ends_at, complete succeeds: lifecycle_status == COMPLETED"

      - name: hold_before_on_sale_rejected
        claim_type: conditional_action
        grounds: ["errors[ERR_SALES_NOT_OPEN]", state_machines.Performance]
        distinguishing_aspect: "Holding seats while sales_status is NOT_ON_SALE fails with ERR_SALES_NOT_OPEN — the sales dimension gates inventory mutation."
        test_recipe:
          setup: ["production in REHEARSAL; performance STALLS 10 @ 10,000 (sales NOT opened)"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Carmen", work_type: "OPERA", build_budget_cents: 60000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-07-01T19:00:00Z", ends_at: "2026-07-01T22:00:00Z", sections: [ { section: "STALLS", total_seats: 10, base_price_cents: 10000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /opera/seat-inventories/${inv}/hold"
              payload: { quantity: 2 }
              as: BoxOfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SALES_NOT_OPEN, HTTP 409"

  # ---------------------------------------------------------------------------
  # Section: errors — triggerability stubs for errors asserted inside §1.8
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_rest_floor_violation_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REST_FLOOR_VIOLATION]"]
        excluded_because:
          difficulty_instance: rest_floor_exactly_twelve_hours
          rationale: "ERR_REST_FLOOR_VIOLATION is asserted on the 11h-gap trigger arm of the named §1.8 instance."
      - name: error_insufficient_seats_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_SEATS]"]
        excluded_because:
          difficulty_instance: seat_purchase_exact_available_then_over
          rationale: "ERR_INSUFFICIENT_SEATS is asserted on the second purchase arm of the named §1.8 instance."
      - name: error_room_time_conflict_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: room_half_open_back_to_back
          rationale: "ERR_ROOM_TIME_CONFLICT is asserted on the overlapping-call trigger arm of the named §1.8 instance."
      - name: error_stage_changeover_conflict_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STAGE_CHANGEOVER_CONFLICT]"]
        excluded_because:
          difficulty_instance: stage_changeover_buffer_semantics
          rationale: "ERR_STAGE_CHANGEOVER_CONFLICT is asserted on the 1h same-production gap arm of the named §1.8 instance."
      - name: error_call_not_open_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CALL_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cancelled_call_state_beats_rest_violation
          rationale: "ERR_CALL_NOT_OPEN is the asserted winner of the §1.8 priority-conflict instance."
      - name: error_duplicate_participant_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_PARTICIPANT]"]
        excluded_because:
          difficulty_instance: duplicate_participant_referential_beats_rest_violation
          rationale: "ERR_DUPLICATE_PARTICIPANT is the asserted winner of the named §1.8 instance."
      - name: error_readiness_gate_blocked_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_READINESS_GATE_BLOCKED]"]
        excluded_because:
          difficulty_instance: tech_ready_requires_surtitle_live
          rationale: "ERR_READINESS_GATE_BLOCKED is asserted on the first tech-ready arm of the named §1.8 instance."
      - name: error_renter_standing_not_good_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENTER_STANDING_NOT_GOOD]"]
        excluded_because:
          difficulty_instance: rental_accept_requires_renter_good_standing
          rationale: "ERR_RENTER_STANDING_NOT_GOOD is asserted on the WATCH-standing accept arm of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Section: rbac — role denials, entity-backed ownership, segregation of duties
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: casting_director_cannot_create_contract_rejected
        claim_type: role_denial
        grounds: ["validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "CastingDirector is not in the ContractsOfficer-only roles list of POST /opera/contracts -> ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["production and artist exist"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
          trigger:
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS, HTTP 403"

      - name: renter_ownership_mismatch_rejected
        claim_type: role_denial
        grounds: ["validations[priority=2.5]", "errors[ERR_RENTER_OWNERSHIP_MISMATCH]", roles]
        distinguishing_aspect: "PartnerRepresentative acting with X-User-ID of company B cannot counter an offer addressed to company A -> ERR_RENTER_OWNERSHIP_MISMATCH (entity-backed identity check)."
        test_recipe:
          setup: ["renter companies A and B; production; offer to company A created and SENT"]
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo A", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter_a: $.data.id }
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo B", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter_b: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter_a}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 4, per_performance_fee_cents: 500000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer: $.data.id }
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /opera/rental-offers/${offer}/counter"
              payload: { countered_fee_cents: 1800000 }
              as: PartnerRepresentative
              as_user_id: ${renter_b}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RENTER_OWNERSHIP_MISMATCH, HTTP 403"
            - "RentalOffer.${offer}.status remains SENT"

      - name: sod_waiver_same_user_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=6]", "errors[ERR_SOD_SAME_USER_FORBIDDEN]", entities.Contract.fields.created_by_user_id]
        distinguishing_aspect: "The ContractsOfficer who created the contract (officer_1) cannot approve a rest-floor waiver on it (ERR_SOD_SAME_USER_FORBIDDEN); a different ContractsOfficer (officer_2) can, moving the participant WAIVER_PENDING -> CONFIRMED."
        test_recipe:
          setup:
            - "Production in REHEARSAL; contract created by officer_1 (rest floor 12h), ACTIVE, CONFIRMED on call A (Mon 08:00-20:00 PUBLISHED)"
            - "Call B Tue 06:00-10:00 PUBLISHED (10h gap); participant added with waive_rest_floor=true -> WAIVER_PENDING"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30, rest_floor_hours: 12 }
              as: ContractsOfficer
              as_user_id: "officer_1"
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
              as_user_id: "officer_1"
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
              as_user_id: "officer_1"
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
              as_user_id: "officer_1"
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_a: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_a}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_a}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_a: $.data.id }
            - call: "POST /opera/call-participants/${pa_a}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-02T06:00:00Z", ends_at: "2026-06-02T10:00:00Z" }
              as: TechnicalDirector
              captures: { call_b: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_b}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_b}", contract_id: "${ctr}", waive_rest_floor: true }
              as: ContractsOfficer
              as_user_id: "officer_1"
              captures: { pa_b: $.data.id, pa_b_status: $.data.status }
          trigger:
            - call: "POST /opera/call-participants/${pa_b}/approve-waiver"
              payload: {}
              as: ContractsOfficer
              as_user_id: "officer_1"
              captures: { err: $.data.error_id }
            - call: "POST /opera/call-participants/${pa_b}/approve-waiver"
              payload: {}
              as: ContractsOfficer
              as_user_id: "officer_2"
              captures: { status: $.data.status }
          assert:
            - "CallParticipant.${pa_b} was created in WAIVER_PENDING"
            - "approval by officer_1 (contract creator) rejected with error_id == ERR_SOD_SAME_USER_FORBIDDEN, HTTP 403"
            - "approval by officer_2 succeeds: CallParticipant.${pa_b}.status == CONFIRMED"

      - name: sod_settle_same_user_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=6]", "errors[ERR_SOD_SAME_USER_FORBIDDEN]", entities.RentalOffer.fields.created_by_user_id]
        distinguishing_aspect: "The ProductionManager who created the offer (pm_1) cannot settle it (ERR_SOD_SAME_USER_FORBIDDEN); a different ProductionManager (pm_2) settles, and final_settlement_cents equals total_fee_cents because negotiation_rounds == 0."
        test_recipe:
          setup: ["renter TourCo; production; offer created by pm_1, SENT, ACCEPTED by renter; logical clock moved past window_end"]
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 5, per_performance_fee_cents: 500000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              as_user_id: "pm_1"
              captures: { offer: $.data.id }
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
              as_user_id: "pm_1"
            - call: "POST /opera/rental-offers/${offer}/accept"
              payload: {}
              as: PartnerRepresentative
              as_user_id: ${renter}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /opera/rental-offers/${offer}/settle"
              payload: {}
              as: ProductionManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
            - call: "POST /opera/rental-offers/${offer}/settle"
              payload: {}
              as: ProductionManager
              as_user_id: "pm_2"
              captures: { status: $.data.status, final: $.data.final_settlement_cents }
          assert:
            - "settle by pm_1 (offer creator) rejected with error_id == ERR_SOD_SAME_USER_FORBIDDEN, HTTP 403"
            - "settle by pm_2 succeeds: status == SETTLED and final_settlement_cents == 2500000  (5 * 500000, no surcharge, no counter)"

      - name: any_role_can_read
        claim_type: role_grant
        grounds: [roles]
        distinguishing_aspect: "The Any role performs shared GET operations (e.g. GET /opera/productions/{id}) successfully."
        test_recipe:
          setup: ["one production exists"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
          trigger:
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { title: $.data.title }
          assert:
            - "GET returns 200 with Production.${prod}.title == 'Swan Lake'"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_layers — OCC, derived-field reconciliation
  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: rental_offer_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: [ "concurrency_rules[rental-offer-create-stale-production]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Production.version: after a first offer create advances the version, a second create carrying the stale expected_production_version is rejected with ERR_STALE_VERSION (412); with the refreshed version it succeeds."
        test_recipe:
          setup: ["renter company; production created (version v captured); offer A created with version v (production version advances to v+1)"]
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 4, per_performance_fee_cents: 500000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer_a: $.data.id }
          trigger:
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z", performances_count: 6, per_performance_fee_cents: 600000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { err: $.data.error_id }
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { prod_v_fresh: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z", performances_count: 6, per_performance_fee_cents: 600000, expected_production_version: "${prod_v_fresh}" }
              as: ProductionManager
              captures: { offer_b: $.data.id, offer_b_status: $.data.status }
          assert:
            - "stale create rejected with error_id == ERR_STALE_VERSION, HTTP 412"
            - "create with the refreshed version succeeds: RentalOffer.${offer_b}.status == DRAFT"
            - "RentalOffer.${offer_a}.status == DRAFT  (offer A was never SENT, so no supersede fired)"

      - name: derived_fields_reconciled_on_purchase
        claim_type: derived_field_reconciliation
        grounds: [entities.Production.fields.season_revenue_cents, entities.CoProductionShare.fields.accrued_revenue_share_cents, entities.Performance.fields.realized_revenue_cents]
        distinguishing_aspect: "One purchase reconciles three derived fields in the same request: performance.realized_revenue_cents (+90,000), production.season_revenue_cents (0 -> 90,000), and the RATIFIED NET share's accrued_revenue_share_cents (0 -> 36,000)."
        test_recipe:
          setup: ["production in REHEARSAL; RATIFIED 40% NET_REVENUE_SHARE share; performance STALLS 100 @ 20,000 ON_SALE"]
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "NetCo", partner_kind: "CO_PRODUCER" }
              as: PlatformAdmin
              captures: { co_n: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/co-production-shares"
              payload: { production_id: "${prod}", company_id: "${co_n}", share_percentage: 40, cost_split_method: "NET_REVENUE_SHARE" }
              as: ProductionManager
              captures: { sh_n: $.data.id }
            - call: "POST /opera/co-production-shares/${sh_n}/transition"
              payload: { to_state: "RATIFIED" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/performances"
              payload: { production_id: "${prod}", starts_at: "2026-06-20T19:00:00Z", ends_at: "2026-06-20T22:00:00Z", sections: [ { section: "STALLS", total_seats: 100, base_price_cents: 20000 } ] }
              as: BoxOfficeManager
              captures: { perf: $.data.id }
            - call: "POST /opera/performances/${perf}/open-sales"
              payload: {}
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}/seat-inventories"
              payload: {}
              as: Any
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /opera/seat-inventories/${inv}/purchase"
              payload: { quantity: 10 }
              as: BoxOfficeManager
            - call: "GET /opera/performances/${perf}"
              payload: {}
              as: Any
              captures: { rev: $.data.realized_revenue_cents }
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { season: $.data.season_revenue_cents }
            - call: "GET /opera/co-production-shares/${sh_n}"
              payload: {}
              as: Any
              captures: { accrued: $.data.accrued_revenue_share_cents }
          assert:
            - "Performance.${perf}.realized_revenue_cents == 180000  (10 * 20000 * 0.9 group discount)"
            - "Production.${prod}.season_revenue_cents == 180000"
            - "CoProductionShare.${sh_n}.accrued_revenue_share_cents == 72000  (round_half_up(0.40 * 180000))"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: performance_cancel_depth3_cascade
          rationale: "The N-level cascade claims (cancel and release chains) are asserted by the two transitive_cascade §1.8 instances."

      - name: rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.seat_price_cents, state_machines.RentalOffer.SENT_to_COUNTERED]
        excluded_because:
          difficulty_instance: seat_price_nested_rounding_order
          rationale: "Demand-ratio tier thresholds are asserted in §1.8 (and the 0.5 boundary in demand_tier_boundary_at_half_ratio above); the negotiation round cap is asserted in rental_negotiation_round_limit_rejected above."

  # ---------------------------------------------------------------------------
  # Section: consistency_model — immediate visibility
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A room created via POST is fully visible in the very next GET (same values, no lag): name, kind, capacity, hourly_rate_cents all match the request."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 9", kind: "ORCHESTRA_PIT", capacity: 80, hourly_rate_cents: 9000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "GET /opera/rehearsal-rooms/${room}"
              payload: {}
              as: Any
              captures: { name: $.data.name, cap: $.data.capacity }
          assert:
            - "GET /opera/rehearsal-rooms/${room}.name == 'Studio 9' and capacity == 80  (immediate consistency)"
