  - rule_id: cross_entity_state_dependency
    instances:
      - name: extension_approval_blocked_until_documentation_accepted
        grounds:
          - state_machines.ExtensionRequest.PENDING_to_APPROVED
          - entities.MedicalDocumentation.fields.status
          - errors[ERR_DOCS_NOT_ACCEPTED]
        distinguishing_aspect: |
          Entity pair ExtensionRequest x MedicalDocumentation: the same APPROVED
          decision fails with ERR_DOCS_NOT_ACCEPTED while the episode's
          documentation sits AWAITED, and succeeds after that document is
          submitted and ACCEPTED — the deciding gate is another entity's state.
        test_recipe:
          setup:
            - "ACTIVE episode (2 visits, 300 days) with one COMPLETED appointment whose documentation is auto-created AWAITED and not yet submitted; one PENDING extension request for +5 visits / +10 days"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
