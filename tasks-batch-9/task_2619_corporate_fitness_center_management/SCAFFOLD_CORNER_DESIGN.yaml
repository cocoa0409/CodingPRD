  # ===========================================================================
  # 8. Cross-cutting complexity layers (§1.0 complexity_profile).
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: waiver_create_with_stale_member_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.waiver-create-stale-member
          - validations[priority 10].ERR_STALE_MEMBER_VERSION
          - state_machines.LiabilityWaiver.SIGNED_to_SUPERSEDED
        distinguishing_aspect: |
          The write that bumps member.version is the waiver write itself, so a
          client holding the version it read before filing waiver #1 is stale by
          exactly one when it files waiver #2: 412 ERR_STALE_MEMBER_VERSION,
          checked ABOVE every state and business rule, with no supersession side
          effect. Re-reading the member and retrying succeeds and only then does
          waiver #1 become SUPERSEDED.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain; one EMPLOYEE member; the member's version read once (${m1_ver}) and one waiver (WVR-2026A) filed with it, which bumps member.version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
            - call: "POST /members"
              payload: { contract_id: "${c_id}", member_class: "EMPLOYEE", full_name: "Iris Okafor", employee_number: "E-1001" }
              as: ClientSponsor
              as_user_id: "${c_id}"
