            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_a: $.data.id, con_a_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_a}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_a_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-08T00:00:00Z", expected_offhire_date: "2026-09-15T00:00:00Z" }
              as: SalesEngineer
              captures: { con_b: $.data.id, con_b_v: $.data.version }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-14T00:00:00Z", expected_offhire_date: "2026-09-20T00:00:00Z" }
              as: SalesEngineer
              captures: { con_c: $.data.id, con_c_v: $.data.version }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_b}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_b_v}" }
              as: SalesEngineer
              captures: { line_b: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_c}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_c_v}" }
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert:
