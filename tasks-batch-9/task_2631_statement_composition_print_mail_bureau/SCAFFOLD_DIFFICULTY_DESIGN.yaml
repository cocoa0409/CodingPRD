      - name: undeliverable_classification_cascades_three_links_to_the_client_counter
        grounds:
          - state_machines.UndeliverableReturn.SCANNED_to_ADDRESS_UPDATED
          - entities.StatementRecord.fields.address_update_pending
          - entities.Client.fields.pending_address_feedback_count
          - calculations.address_hygiene_confidence
        distinguishing_aspect: |
          A different trigger drives a depth-3 chain across three different entities than the abort
          chain: the return reaching ADDRESS_UPDATED rewrites the StatementRecord address and flips
          address_update_pending, and it is that flag flip — not the classify call itself — that
          increments the Client feedback counter, so the chain crosses from an operational record to
