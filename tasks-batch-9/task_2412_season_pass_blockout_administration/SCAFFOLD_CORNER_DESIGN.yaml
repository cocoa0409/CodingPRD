          assert:
            - "HTTP 200 with data.missed_installment_count == 2, data.delinquent_pass_count == 1, data.suspended_pass_count == 1, data.defaulted_pass_count == 0"
            - "data.released_reservation_count == 0, data.no_show_reservation_count == 0, data.expired_upgrade_order_count == 0"
            - "GET /season-passes/${pass_a} → data.pass_status == 'SUSPENDED' and data.billing_status == 'DELINQUENT'"
            - "GET /season-passes/${pass_b} → data.pass_status == 'ACTIVE', data.billing_status == 'PAID_IN_FULL' and data.version unchanged from before the run (healthy rows are skipped, not rewritten)"
