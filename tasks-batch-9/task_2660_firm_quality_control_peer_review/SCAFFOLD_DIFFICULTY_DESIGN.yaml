  # =====================================================================
  # Rule 9 - compensating_invariant
  # Three different conserved quantities, each taken away and given back, with
  # a follow-on operation that only succeeds if the restoration was exact.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: peer_review_hours_conservation_survives_a_selection_withdrawal
        grounds:
          - entities.PeerReview.fields.unallocated_hours
          - entities.PeerReview.fields.total_scope_hours
          - entities.PeerReview.fields.scope_limitation_count
          - entities.PeerReviewer.fields.committed_hours_balance
          - entities.PeerReviewSelection.fields.status
          - calculations.peer_review_hours_scope
        distinguishing_aspect: |
          Conserved quantity: total_scope_hours == unallocated_hours + sum(hours_committed over
          COMMITTED selections), held jointly by PeerReview and PeerReviewer. A 10-hour scope-limitation
          selection is committed (16 -> 6 unallocated, reviewer balance 0 -> 10, scope_limitation_count
          0 -> 1) and then withdrawn. Restoration must be exact on all three counters, and the proof is
          the follow-on: re-selecting the SAME engagement for the full 16 hours must succeed with 201.
          It fails with ERR_SCOPE_HOURS_EXCEEDED if the hours were not credited back, and with
          ERR_DUPLICATE_SELECTION if the retained WITHDRAWN row is still treated as a live selection.
        test_recipe:
          setup:
            - "Firm 'Rushmere Vale LLP' (aa_hours_last_year 400, posture STABLE, no released engagements) so total_scope_hours is the bare base tier of 16."
            - "One engagement 'Tarn Logistics' (AUDIT, period_end 2026-06-30) exists for the firm, in scope because period_end <= year_end."
            - "PeerReview assigned to 'Vessel Peer Review PC' and scoped, so it sits in SCOPE_SET with unallocated_hours 16."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Rushmere Vale LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Ines Vale", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Tarn Logistics", engagement_type: "AUDIT", period_end: "2026-06-30", engagement_partner_id: "${p_ep1_id}", is_public_interest: false }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { reviewer_firm_name: "Vessel Peer Review PC", license_state: "CA", qualified_categories: [], max_concurrent_reviews: 2, experience_hours: 4000 }
              as: PeerReviewCommittee
              captures: { rv1_id: $.data.id }
            - call: "POST /firms/${firm_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2026-12-31", scheduled_window_start: "2026-09-01", scheduled_window_end: "2026-09-15" }
              as: PeerReviewCommittee
              captures: { pr_id: $.data.id }
            - call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: { reviewer_id: "${rv1_id}" }
              as: PeerReviewCommittee
            - call: "POST /peer-reviews/${pr_id}/scope"
              payload: {}
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { pr_v1: $.data.version }
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload: { engagement_id: "${e1_id}", hours_committed: 10, is_scope_limitation: true, expected_peer_review_version: "${pr_v1}" }
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { sel1_id: $.data.id }
          trigger:
            - call: "DELETE /peer-reviews/${pr_id}/selections/${sel1_id}"
              payload: {}
              as: PeerReviewer
              as_user_id: "${rv1_id}"
            - call: "GET /peer-reviews/${pr_id}"
              payload: {}
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { pr_v2: $.data.version }
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload: { engagement_id: "${e1_id}", hours_committed: 16, expected_peer_review_version: "${pr_v2}" }
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { sel2_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 204"
            - "PeerReviewSelection.${sel1_id}.status == WITHDRAWN"
            - "PeerReviewSelection.${sel1_id}.hours_committed == 10"
            - "the third trigger call returns HTTP 201"
            - "PeerReview.${pr_id}.total_scope_hours == 16"
            - "PeerReview.${pr_id}.unallocated_hours == 0"
            - "PeerReview.${pr_id}.scope_limitation_count == 0"
            - "PeerReviewer.${rv1_id}.committed_hours_balance == 16"
            - "PeerReviewSelection.${sel2_id}.status == COMMITTED"

      - name: firm_open_deficiency_count_is_restored_exactly_by_a_reopen
        grounds:
          - entities.Firm.fields.open_deficiency_count
          - entities.Firm.fields.open_material_failure_count
          - entities.InspectionFinding.fields.reopen_count
          - entities.InspectionFinding.fields.verified_at
          - state_machines.InspectionFinding.REMEDIATED_to_VERIFIED
          - state_machines.InspectionFinding.VERIFIED_to_REOPENED
          - state_machines.InspectionFinding.REOPENED_to_REMEDIATION_ASSIGNED
          - calculations.remediation_acceptance_score
        distinguishing_aspect: |
          A second conserved quantity on a different entity: Firm.open_deficiency_count is the count of
          the firm's findings with a real classification and state NOT IN {VERIFIED, WITHDRAWN}.
          Verification consumes the single open deficiency (1 -> 0, verified_at set); reopening must
          restore it to EXACTLY 1 - not 0 (never restored), not 2 (restored by re-adding without
          removing the verified contribution) - while clearing verified_at and setting reopen_count 1.
          The follow-on superseding plan proves the restoration is a genuine state change and not a
          counter patch: creating it drives the CLOSED transition on the old plan while
          open_deficiency_count stays at 1, because the counter is keyed on findings, not plans.
