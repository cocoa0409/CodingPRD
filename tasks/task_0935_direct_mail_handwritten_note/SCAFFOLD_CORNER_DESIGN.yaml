  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: Role denial
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request carrying no X-User-Role header at all returns 401 ERR_UNAUTHENTICATED at rung 1, before any existence check runs — even though the campaign id in the path does not exist either."
        test_recipe:
          setup: ["Empty database apart from the clock. The trigger request is issued with NO X-User-Role header."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /mail/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "with the X-User-Role header omitted the response status is 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"
            - "response data.error_id != ERR_CAMPAIGN_NOT_FOUND"

      - name: account_owner_without_user_id_header_returns_unauthenticated
        claim_type: Role denial
        grounds: ['validations[priority=2]', 'errors[ERR_UNAUTHENTICATED]', roles.AccountOwner]
        distinguishing_aspect: "AccountOwner is entity_backed:Account, so a request declaring that role but omitting X-User-ID returns 401 ERR_UNAUTHENTICATED at rung 2 rather than 403 ERR_ACCOUNT_SCOPE_VIOLATION at rung 5."
        test_recipe:
          setup: ["One account exists. The trigger is issued as AccountOwner with NO X-User-ID header."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-251" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /mail/accounts/${acct_id}"
              payload: {}
              as: AccountOwner
              captures: { err_id: $.data.error_id }
          assert:
            - "with the X-User-ID header omitted the response status is 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"
            - "response data.error_id != ERR_ACCOUNT_SCOPE_VIOLATION"

