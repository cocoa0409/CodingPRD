# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Vacation Bible School & Seasonal Program Registration
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is replayable from
# empty-DB via its setup_api_calls chain. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two calculations on DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: kit_recommendation_provisional_vs_final
        grounds:
          - calculations.kit_recommendation
          - entities.SupplyOrder.fields.recommended_provisional
          - entities.SupplyOrder.fields.required_final
          - errors[ERR_KIT_QUANTITY_SHORT]
        distinguishing_aspect: |
          Entity domain = SupplyOrder (supply logistics). For identical enrollment
          data (5 enrolled, 2 non-CLOSED classrooms) the provisional variant yields
          ceil(5*1.10)=6 while the final submit-validation variant yields 6+2=8;
          an order at the provisional value 6 is rejected at submit.
        test_recipe:
          setup:
            - "Program Alpha (ratio 4, budget 100000, dates 2026-08-17..2026-08-21, window 2026-07-15..2026-08-15) in REGISTRATION_OPEN"
            - "Classrooms Koalas (ages 4-6, cap 10) and Bears (ages 7-9, cap 10), both ACCEPTING"
            - "One family with 5 children; 3 enrolled in Koalas, 2 enrolled in Bears; enrolled_total == 5"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Bears", age_min: 7, age_max: 9, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_b: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kiddo", last_name: "One", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kid1: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kiddo", last_name: "Two", birth_date: "2020-06-20", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kid2: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kiddo", last_name: "Three", birth_date: "2021-01-05", grade_completed: "PRE_K" }, as: Parent, as_user_id: "${fam_id}", captures: { kid3: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kiddo", last_name: "Four", birth_date: "2018-05-10", grade_completed: "GRADE_2" }, as: Parent, as_user_id: "${fam_id}", captures: { kid4: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kiddo", last_name: "Five", birth_date: "2017-11-30", grade_completed: "GRADE_3" }, as: Parent, as_user_id: "${fam_id}", captures: { kid5: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid1}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid2}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid3}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid4}", classroom_id: "${cls_b}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid5}", classroom_id: "${cls_b}" }, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "GET /vbs/programs/${prog_id}/supply-plan", payload: {}, as: ProgramDirector, captures: { prov: $.data.kit_quantity_provisional, fin: $.data.kit_quantity_final } }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Starter Kit", vendor: "Cokesbury", quantity: 6, unit_cost_cents: 3000 }, as: ProgramDirector, captures: { ord_id: $.data.id } }
            - { call: "POST /vbs/supply-orders/${ord_id}/submit", payload: {}, as: ProgramDirector, captures: { submit_err: $.data.error_id } }
            - { call: "PATCH /vbs/supply-orders/${ord_id}", payload: { quantity: 8 }, as: ProgramDirector }
            - { call: "POST /vbs/supply-orders/${ord_id}/submit", payload: {}, as: ProgramDirector, captures: { ord_status: $.data.status } }
          assert:
            - "${prov} == 6  (provisional: ceil(5 * 1.10))"
            - "${fin} == 8  (final: provisional + 2 non-CLOSED classrooms — same data, different result)"
            - "${submit_err} == ERR_KIT_QUANTITY_SHORT  (quantity 6 satisfies provisional but not final)"
            - "${ord_status} == SUBMITTED  (quantity 8 satisfies final)"
      - name: attendance_rate_provisional_vs_final
        grounds:
          - calculations.attendance_rate
          - entities.AttendanceRecord.fields.status
          - "endpoints: GET /vbs/programs/{program_id}/attendance-summaries/{child_id}"
        distinguishing_aspect: |
          Entity domain = RetentionEntry/attendance (child engagement), distinct from
          the SupplyOrder domain of kit_recommendation_provisional_vs_final. With
          identical attendance data (2 attended, 2 days closed, 5 total days) the
          provisional variant yields 2/2 = 1.0000 while the final variant yields
          2/5 = 0.4000 because their denominators differ mid-program.
        test_recipe:
          setup:
            - "Program Alpha in IN_SESSION with 5 ProgramDays (2026-08-17..2026-08-21)"
            - "Classroom Koalas (ages 4-6, cap 10) staffed ADEQUATE by cleared adult volunteers v1 (LEAD_TEACHER) and v2 (ASSISTANT_TEACHER), each auto-confirmed on clearance"
            - "Child k1 (no special needs) ENROLLED in Koalas"
            - "Days 1 and 2 CLOSED with k1 checked in and out on both; days 3-5 still SCHEDULED"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-17" }, as: ProgramDirector, captures: { day1: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-18" }, as: ProgramDirector, captures: { day2: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-19" }, as: ProgramDirector, captures: { day3: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-20" }, as: ProgramDirector, captures: { day4: $.data.id } }
            - { call: "POST /vbs/days", payload: { program_id: "${prog_id}", date: "2026-08-21" }, as: ProgramDirector, captures: { day5: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kiddo", last_name: "One", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kid1: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid1}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v1}", classroom_id: "${cls_k}", role: "LEAD_TEACHER" }, as: VolunteerCoordinator, captures: { asg1: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}", captures: { c1a: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "REFERENCE" }, as: Volunteer, as_user_id: "${v1}", captures: { c1b: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "SAFE_MINISTRY_TRAINING" }, as: Volunteer, as_user_id: "${v1}", captures: { c1c: $.data.id } }
            - { call: "POST /vbs/screening-checks/${c1a}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c1b}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c1c}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera Two", email: "vera2@example.com", phone: "555-0202", birth_date: "1988-02-11" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /vbs/role-assignments", payload: { volunteer_id: "${v2}", classroom_id: "${cls_k}", role: "ASSISTANT_TEACHER" }, as: VolunteerCoordinator, captures: { asg2: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v2}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v2}", captures: { c2a: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v2}", check_type: "REFERENCE" }, as: Volunteer, as_user_id: "${v2}", captures: { c2b: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v2}", check_type: "SAFE_MINISTRY_TRAINING" }, as: Volunteer, as_user_id: "${v2}", captures: { c2c: $.data.id } }
            - { call: "POST /vbs/screening-checks/${c2a}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c2b}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/screening-checks/${c2c}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /vbs/programs/${prog_id}/close-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/programs/${prog_id}/start-session", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T08:30:00Z" }, as: ProgramDirector }
            - { call: "POST /vbs/days/${day1}/open", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${kid1}", program_day_id: "${day1}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { tag1: $.data.tag_code } }
            - { call: "POST /vbs/attendance/check-out", payload: { child_id: "${kid1}", program_day_id: "${day1}", tag_code: "${tag1}", pickup_person: "Maria Alvarez" }, as: CheckInStaff, as_user_id: "desk-1" }
            - { call: "POST /vbs/days/${day1}/close", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T08:30:00Z" }, as: ProgramDirector }
            - { call: "POST /vbs/days/${day2}/open", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${kid1}", program_day_id: "${day2}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { tag2: $.data.tag_code } }
            - { call: "POST /vbs/attendance/check-out", payload: { child_id: "${kid1}", program_day_id: "${day2}", tag_code: "${tag2}", pickup_person: "Maria Alvarez" }, as: CheckInStaff, as_user_id: "desk-1" }
            - { call: "POST /vbs/days/${day2}/close", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "GET /vbs/programs/${prog_id}/attendance-summaries/${kid1}", payload: {}, as: ProgramDirector, captures: { att: $.data.attended_days, dc: $.data.days_closed, td: $.data.total_days, prov_r: $.data.provisional_rate, fin_r: $.data.projected_final_rate } }
          assert:
            - "${att} == 2 and ${dc} == 2 and ${td} == 5"
            - "${prov_r} == 1.0000  (provisional divides by days_closed)"
            - "${fin_r} == 0.4000  (final divides by total_days — identical attendance data, different result)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: three instances in modes (a), (b), (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: required_adults_nested_max_ceil_branches
        grounds:
          - calculations.required_adults_and_staffing
          - entities.Classroom.fields.required_adults
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (enrolled_count, child_staff_ratio, TWO_ADULT_MINIMUM)
          with non-linear interaction (conditional zero branch + max + ceil). With
          ratio 4: 0 enrolled -> 0 (zero branch), 1 enrolled -> 2 (two-adult floor
          dominates ceil(1/4)=1), 8 enrolled -> 2 (ceil(8/4)=2 exact boundary),
          9 enrolled -> 3 (ceil(9/4)=3 crossing).
        test_recipe:
          setup:
            - "Program Alpha (child_staff_ratio 4) in REGISTRATION_OPEN; classroom Koalas (ages 4-6, cap 10) ACCEPTING"
            - "One family with 9 children, all age 6 (born 2020-03-15)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id, req0: $.data.required_adults } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N1", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k1: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N2", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k2: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N3", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k3: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N4", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k4: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N5", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k5: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N6", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k6: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N7", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k7: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N8", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k8: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N9", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k9: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k1}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { req1: $.data.required_adults } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k2}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k3}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k4}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k5}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k6}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k7}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k8}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { req8: $.data.required_adults, enr8: $.data.enrolled_count } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${k9}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { req9: $.data.required_adults, enr9: $.data.enrolled_count } }
          assert:
            - "${req0} == 0   (zero-enrollment branch)"
            - "${req1} == 2   (max(2, ceil(1/4)) = 2: two-adult floor dominates)"
            - "${req8} == 2 and ${enr8} == 8   (ceil(8/4) = 2 exact boundary)"
            - "${req9} == 3 and ${enr9} == 9   (ceil(9/4) = 3 threshold crossing)"
      - name: craft_pack_rounding_per_classroom_then_sum
        grounds:
          - calculations.craft_pack_allocation
          - "endpoints: GET /vbs/programs/{program_id}/supply-plan"
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          per-classroom ceil THEN sum. Two classrooms with 4 enrolled each:
          ceil(4*3/10)+ceil(4*3/10) = 2+2 = 4; the alternative sum-then-round would
          yield ceil(24/10) = 3. Different mode from the (a) and (c) instances.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 10) with 4 enrolled; Bears (7-9, cap 10) with 4 enrolled"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Bears", age_min: 7, age_max: 9, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_b: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N1", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k1: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "N2", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { k2: $.data.id } }
