          rationale: "That instance unlocks the domain out from under a NOTIFICATION_PENDING case and shows the notification refused with ERR_DOMAIN_NOT_LOCKED, then re-locks it and shows the same call succeed - the guarded cross-entity precondition."

      - name: sustained_challenge_compensates_every_side_effect_of_issuance
        claim_type: side_effect_execution
        grounds:
          - state_machines.Case.STAYED_to_TERMINATED_COURT
          - state_machines.Decision.STAYED_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / sustained_court_challenge_unwinds_six_links_including_the_rdnh_counter
          rationale: "That instance walks the whole compensation chain - Decision VOIDED, Case TERMINATED_COURT, seats DISCHARGED, the domain unlocked, the precedent entry marked superseded and the complainant's RDNH counter decremented - which is the compensation side-effect pattern for these transitions."

      - name: dismissed_challenge_lifts_the_stay_and_restarts_the_full_waiting_period
        claim_type: valid_transition
        grounds:
          - state_machines.Case.STAYED_to_IMPLEMENTATION_WAITING
          - state_machines.Decision.STAYED_to_ISSUED
          - calculations.implementation_window
          - state_machines.DomainName.LOCKED_to_TRANSFER_EXECUTED
        distinguishing_aspect: "A DISMISSED court challenge is the mirror image of a sustained one: the decision returns to ISSUED rather than being voided, and implementation_deadline_at is recomputed from resolved_at 2026-08-25T12:00:00Z to 2026-09-09T12:00:00Z - ten fresh business days over the 2026-09-07 holiday - so the elapsed portion of the original window is discarded rather than credited."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9021; domain stay.example; complainant Stay Ltd (country_code GB); a single-member case decided TRANSFER and issued at 2026-08-10T09:00:00Z, giving implementation_deadline_at 2026-08-24T09:00:00Z."
