      - name: inspection_void_after_finalize_reverses_demerit_points
        claim_type: Compensation
        grounds:
          - state_machines.Inspection.FINALIZED_to_VOIDED
          - calculations.facility_open_demerit_points
          - entities.Violation.fields.status
        distinguishing_aspect: "Voiding a FINALIZED inspection moves every child violation to VOIDED and drops the whole inspection out of the demerit sum, restoring Facility.open_demerit_points to the pre-FINALIZE value of 0."
        test_recipe:
          setup: ["A ROUTINE inspection with two findings (one CRITICAL, one NONCRITICAL) has been finalized, putting Facility.open_demerit_points at 13."]
