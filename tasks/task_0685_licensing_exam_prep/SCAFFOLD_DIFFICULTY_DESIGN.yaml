            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", total_price_cents: 120000, down_payment_pct: 0.20, financing_months: 6, included_mock_credits: 8, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "bal@x.com", full_name: "Bal" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: true }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "GET /enrollments/${enr_id}/installments"
              as: Learner
              as_user_id: "${learner_id}"
              captures: { inst1: "$.data[0].id" }
            - call: "POST /enrollments/${enr_id}/installments/${inst1}/pay"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/certify-exam"
              payload: { outcome: "PASS" }
              as: ExamProctor
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_BALANCE_OUTSTANDING (HTTP 409)"
            - "Enrollment.${enr_id}.status == ACTIVE and financing_balance_cents == 96000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: membership_window_half_open_abutting_allowed_overlap_rejected
        grounds:
          - calculations.membership_window_overlap
          - validations[priority=9]
          - errors[ERR_SESSION_WINDOW_CONFLICT]
        distinguishing_aspect: |
          HALF-OPEN [start,end) interval semantics on CohortMembership: a second membership
          window abutting the first ([12:00,14:00) after [10:00,12:00)) is ACCEPTED, but an
          overlapping window ([11:00,13:00)) is REJECTED with ERR_SESSION_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "ACTIVE enrollment JOINED a capacity-5 cohort with window [10:00,12:00)."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "OVL-1", title: "Overlap1", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { license_program_id: "${prog_id}", title: "Cohort A", capacity: 5 }
              as: ContentAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { license_program_id: "${prog_id}", title: "Cohort B", capacity: 5 }
              as: ContentAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { license_program_id: "${prog_id}", title: "Cohort C", capacity: 5 }
              as: ContentAdmin
              captures: { c3_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "ovl@x.com", full_name: "Ovl" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /cohorts/${c1_id}/memberships"
              payload: { enrollment_id: "${enr_id}", session_start_utc: "2026-06-04T10:00:00Z", session_end_utc: "2026-06-04T12:00:00Z" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { mem1: "$.data.id" }
          trigger:
            - call: "POST /cohorts/${c2_id}/memberships"
              payload: { enrollment_id: "${enr_id}", session_start_utc: "2026-06-04T12:00:00Z", session_end_utc: "2026-06-04T14:00:00Z" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { mem2: "$.data.id" }
            - call: "POST /cohorts/${c3_id}/memberships"
              payload: { enrollment_id: "${enr_id}", session_start_utc: "2026-06-04T11:00:00Z", session_end_utc: "2026-06-04T13:00:00Z" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the abutting [12:00,14:00) join (cohort B) succeeds -> CohortMembership status JOINED"
            - "the overlapping [11:00,13:00) join (cohort C) returns error_id == ERR_SESSION_WINDOW_CONFLICT (HTTP 409)"

      - name: cohort_session_closed_interval_30min_buffer_boundary
        grounds:
          - calculations.session_buffer_overlap
          - validations[priority=9.5]
          - errors[ERR_SESSION_BUFFER_CONFLICT]
        distinguishing_aspect: |
          CLOSED-interval + 30-minute-buffer semantics on CohortSession (a DIFFERENT resource
          entity with DIFFERENT interval arithmetic than the half-open membership rule):
          after a session [10:00,11:00], a new session starting exactly 30 minutes later
          [11:30,12:30] is ACCEPTED (gap == 30, inclusive), but [11:15,12:00] (gap 15 < 30) is
          REJECTED with ERR_SESSION_BUFFER_CONFLICT.
        test_recipe:
          setup:
            - "A cohort with one existing session [10:00,11:00]."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "OVL-2", title: "Overlap2", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { license_program_id: "${prog_id}", title: "Sessioned", capacity: 10 }
              as: ContentAdmin
              captures: { cohort_id: "$.data.id" }
            - call: "POST /cohorts/${cohort_id}/sessions"
              payload: { topic: "Intro", session_start_utc: "2026-06-05T10:00:00Z", session_end_utc: "2026-06-05T11:00:00Z" }
              as: ContentAdmin
              captures: { sess1: "$.data.id" }
          trigger:
            - call: "POST /cohorts/${cohort_id}/sessions"
              payload: { topic: "Exactly30", session_start_utc: "2026-06-05T11:30:00Z", session_end_utc: "2026-06-05T12:30:00Z" }
              as: ContentAdmin
              captures: { sess2: "$.data.id" }
            - call: "POST /cohorts/${cohort_id}/sessions"
              payload: { topic: "TooClose", session_start_utc: "2026-06-05T11:15:00Z", session_end_utc: "2026-06-05T12:00:00Z" }
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the [11:30,12:30] session (gap exactly 30 min) is created -> CohortSession persisted"
            - "the [11:15,12:00] session (gap 15 min < 30) returns error_id == ERR_SESSION_BUFFER_CONFLICT (HTTP 409)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ce_credit_accrual_conserves_bundle_total
        grounds:
          - calculations.ce_credit_accrual
          - entities.CECreditAward.fields.credits_awarded
          - entities.CECreditAward.fields.cumulative_credits
          - entities.CEBundle.fields.ce_credits_total
        distinguishing_aspect: |
          Conserved quantity = total CE credits. Across three cumulative awards
          (modules_completed 1, 2, 5 of a 5-module / 24-credit bundle) the sum of
          credits_awarded (5 + 5 + 14) equals exactly ce_credits_total (24); the
          per-award rounding never drifts the conserved CE-credit total.
        test_recipe:
          setup:
            - "Published program with a 5-module / 24-credit CE bundle; PLUS plan with includes_ce; ACTIVE enrollment linked to the bundle."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CE-PROG", title: "CE Prog", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /ce-bundles"
              payload: { license_program_id: "${prog_id}", ce_credits_total: 24, modules_total: 5 }
              as: ContentAdmin
              captures: { bundle_id: "$.data.id" }
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", total_price_cents: 50000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 5, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: true }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "ce@x.com", full_name: "CE Learner" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false, ce_bundle_id: "${bundle_id}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/ce-awards"
              payload: { modules_completed: 1 }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { a1: "$.data.credits_awarded" }
            - call: "POST /enrollments/${enr_id}/ce-awards"
              payload: { modules_completed: 2 }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { a2: "$.data.credits_awarded" }
            - call: "POST /enrollments/${enr_id}/ce-awards"
              payload: { modules_completed: 5 }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { a3: "$.data.cumulative_credits" }
          assert:
            - "first award credits_awarded == 5 (cumulative round(24*1/5)=5)"
            - "second award credits_awarded == 5 (cumulative round(24*2/5)=10, delta 5)"
            - "third award cumulative_credits == 24 and credits_awarded == 14 (delta 24-10)"
            - "sum of all credits_awarded (5+5+14) == CEBundle.${bundle_id}.ce_credits_total == 24 (conserved)"

      - name: withdraw_voids_installments_conserves_paid_plus_balance
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - calculations.financing_ledger
          - entities.Enrollment.fields.financing_paid_cents
          - entities.Enrollment.fields.financing_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money obligation. Withdrawing an ACTIVE financed enrollment
          (compensating action) voids all DUE installments; the invariant
          financing_paid_cents + financing_balance_cents == sum(amount_cents of PAID Installments)
          holds with balance driven to 0, conserving the obligation against the paid amount
          (a DIFFERENT conserved quantity than CE credits).
        test_recipe:
          setup:
            - "Financed ACTIVE enrollment (PLUS, total 120000); down payment (24000) paid; 5 installments still DUE; then withdraw."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "WDR-P", title: "Withdraw", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", total_price_cents: 120000, down_payment_pct: 0.20, financing_months: 6, included_mock_credits: 8, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "wdr@x.com", full_name: "Wdr" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: true }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "GET /enrollments/${enr_id}/installments"
              as: Learner
              as_user_id: "${learner_id}"
              captures: { inst1: "$.data[0].id" }
            - call: "POST /enrollments/${enr_id}/installments/${inst1}/pay"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
          assert:
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "Enrollment.${enr_id}.financing_paid_cents == 24000"
            - "Enrollment.${enr_id}.financing_balance_cents == 0 (all DUE installments VOID)"
            - "invariant: financing_paid_cents (24000) + financing_balance_cents (0) == sum of PAID installment amount_cents (24000)"
