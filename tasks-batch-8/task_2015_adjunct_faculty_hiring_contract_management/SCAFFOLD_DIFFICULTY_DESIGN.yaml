        distinguishing_aspect: |
          Metric = zero/empty-count style integer boundary on a DIFFERENT
          endpoint (POST /sections/{id}/cancel): LOW_ENROLLMENT cancel requires
          enrollment STRICTLY < min_enrollment. At enrollment == min_enrollment
          (both 5) the cancel must fail with ERR_CANCELLATION_POLICY even though
          the date condition (< early census) holds — the falsifiable claim is
          the strict inequality on the count.
