# =============================================================================
# Real Estate Closing & Third-Party Escrow — Scaffold Difficulty Design (§1.8)
# Test Targeting Index. Sole source of difficulty audit; cross-references
# §1.1–§1.7 of SCAFFOLD.yaml. Every `grounds:` ref MUST resolve inside that file.
# =============================================================================

scaffold_difficulty_design:

  # --------------------------------------------------------------------------
  # Rule 1: Dual-variant calculations on DIFFERENT entity domains
  # --------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: emd_disposition_buyer_vs_seller_default
        grounds:
          - calculations.emd_disposition
          - state_machines.EarnestMoneyDeposit.HELD_to_RELEASED_TO_SELLER
          - state_machines.EarnestMoneyDeposit.HELD_to_RELEASED_TO_BUYER
          - entities.EarnestMoneyDeposit.fields.forfeited_amount
          - entities.EarnestMoneyDeposit.fields.refunded_amount
        distinguishing_aspect: |
          Same EarnestMoneyDeposit row with identical amount=3000.00 produces
          divergent outcomes depending on cancel_reason: BUYER_DEFAULT yields
          forfeited_amount=3000.00/refunded_amount=0 and status=RELEASED_TO_SELLER;
          SELLER_DEFAULT yields forfeited_amount=0/refunded_amount=3000.00 and
          status=RELEASED_TO_BUYER. The entity domain is the EMD (asset-disposition
          subject).
        test_recipe:
          setup:
            - "Create Property tax_annual=1234, hoa_annual_dues=789"
            - "Create Party buyer, Party seller (party_kind BUYER/SELLER)"
            - "Create EscrowFile purchase_price=300000 loan_amount=240000 referencing buyer/seller/property"
            - "Create EMD amount=3000.00 for this escrow_file"
            - "POST /earnest-money/{id}/fund -> status HELD"
          trigger:
            - "POST /escrow-files/{id}/cancel with cancel_reason=BUYER_DEFAULT — case A"
            - "(Parallel reset) Create a peer EscrowFile + EMD; POST /escrow-files/{id}/cancel with cancel_reason=SELLER_DEFAULT — case B"
          assert:
            - "Case A: EMD.status == RELEASED_TO_SELLER AND EMD.forfeited_amount == 3000.00 AND EMD.refunded_amount == 0"
            - "Case B: EMD.status == RELEASED_TO_BUYER AND EMD.forfeited_amount == 0 AND EMD.refunded_amount == 3000.00"

      - name: section_1031_deferred_vs_failed_recognition
        grounds:
          - calculations.section_1031_gain
          - state_machines.Exchange1031.IDENTIFIED_to_CLOSED_DEFERRED
          - state_machines.Exchange1031.IDENTIFIED_to_FAILED_TAXABLE
          - entities.Exchange1031.fields.recognized_gain
          - entities.Exchange1031.fields.deferred_gain
        distinguishing_aspect: |
          Same Exchange1031 row with realized_gain=300000.00 produces divergent
          outcomes on a DIFFERENT entity domain than EMD (tax-gain subject).
          Variant deferred_success returns recognized_gain=70000.00 and
          deferred_gain=230000.00; variant failed_taxable returns
          recognized_gain=300000.00 and deferred_gain=0. This is a calculation
          on Exchange1031, not on EMD — satisfying §0.5 Rule 1's
          different-entity-domain clause.
        test_recipe:
          setup:
            - "Create EscrowFile with is_1031_exchange=true, closing_date_planned='2026-06-01T00:00:00Z'"
            - "POST /exchanges with relinquished_basis=200000.00 relinquished_sale_price=500000.00 cash_boot_received=50000.00 mortgage_relief=20000.00"
            - "(Variant A: deferred success) POST /exchanges/{id}/identify within 45d; create QI WireInstruction CONFIRMED and Disbursement to QI SETTLED"
            - "(Variant B: failed) Create peer EscrowFile+Exchange1031 with same inputs"
          trigger:
            - "Variant A: POST /exchanges/{id}/close-deferred while clock <= deadline"
            - "Variant B: POST /_clock/advance to closing_date_planned + 200 days; POST /exchanges/{id}/fail"
          assert:
            - "Variant A: Exchange1031.recognized_gain == 70000.00 AND Exchange1031.deferred_gain == 230000.00 AND Exchange1031.status == CLOSED_DEFERRED"
            - "Variant B: Exchange1031.recognized_gain == 300000.00 AND Exchange1031.deferred_gain == 0 AND Exchange1031.status == FAILED_TAXABLE"

  # --------------------------------------------------------------------------
  # Rule 2: Combinatorial formulas across DIFFERENT modes
  # --------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: title_insurance_tiered_with_simultaneous_issue_branch
        grounds:
          - calculations.title_insurance_premium
          - entities.TitleInsurancePolicy.fields.policy_kind
          - entities.TitleInsurancePolicy.fields.simultaneous_issue
          - entities.TitleInsurancePolicy.fields.insured_amount
          - entities.TitleInsurancePolicy.fields.premium
        distinguishing_aspect: |
          Mode (a): a formula with ≥3 inputs and non-linear interaction —
          insured_amount selects across 3 tiered rates with 2 breakpoints
          ($100K, $500K), policy_kind branches OWNERS/LENDERS, simultaneous_issue
          enables a multiplicative 40% discount, and a per-kind minimum floor
          (OWNERS_MIN=300, LENDERS_MIN=200) is applied AFTER rounding. Five
          interacting inputs, three non-linear branches.
        test_recipe:
          setup:
            - "Create EscrowFile with purchase_price=250000.00, lender_party_id set, loan_amount=200000.00"
            - "Create TitleSearch and POST /title-searches/{id}/clear so policies can bind later"
          trigger:
            - "POST /title-policies with policy_kind=OWNERS, insured_amount=250000.00"
            - "POST /title-policies/{id}/bind on that OWNERS policy"
            - "POST /title-policies with policy_kind=LENDERS, insured_amount=200000.00, simultaneous_issue=true"
            - "POST /title-policies with policy_kind=LENDERS, insured_amount=200000.00, simultaneous_issue=false (peer escrow file to isolate)"
            - "POST /title-policies with policy_kind=OWNERS, insured_amount=30000.00 (peer escrow file to hit min-floor branch)"
          assert:
            - "OWNERS policy @ 250000 has premium == 1100.00 (tier1=100*5 + tier2=150*4 = 500+600)"
            - "LENDERS policy @ 200000 with simultaneous_issue=true has premium == 360.00 (base=900, *0.4=360, above min 200)"
            - "LENDERS policy @ 200000 without simultaneous_issue has premium == 900.00 (full tiered base, above min 200)"
            - "OWNERS policy @ 30000 has premium == 300.00 (base=150, clamped up to OWNERS_MIN)"

      - name: cash_to_close_rounding_order_pin
        grounds:
          - calculations.cash_to_close
          - entities.ClosingDisclosure.fields.prorated_tax_credit
          - entities.ClosingDisclosure.fields.prorated_hoa_credit
          - entities.ClosingDisclosure.fields.cash_to_close
          - entities.Property.fields.tax_annual
          - entities.Property.fields.hoa_annual_dues
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. With
          tax_annual=1234, hoa_annual_dues=789, seller_days_owned=100,
          year_basis=365, the round-each-then-sum order yields
          prorated_tax_credit=338.08 and prorated_hoa_credit=216.16 (sum 554.24),
          whereas the sum-then-round order would yield 554.25. The scaffold pins
          per-line-item-then-sum; a different mode from Rule-2 instance #1
          (which exercised mode (a) tier branching).
        test_recipe:
          setup:
            - "Create Property tax_annual=1234, hoa_annual_dues=789"
            - "Create EscrowFile purchase_price=300000 loan_amount=240000 referencing that property"
            - "Create EMD amount=3000.00 and POST /earnest-money/{id}/fund (HELD)"
          trigger:
            - "POST /closing-disclosures with total_loan_costs=5000.00 seller_credits=0 seller_days_owned=100"
          assert:
            - "ClosingDisclosure.prorated_tax_credit == 338.08"
            - "ClosingDisclosure.prorated_hoa_credit == 216.16"
            - "ClosingDisclosure.cash_to_close == 61445.76"
            - "ClosingDisclosure.cash_to_close != 61445.75  # confirms round-each-then-sum (NOT sum-then-round which would be 554.25 and give 61445.75)"

  # --------------------------------------------------------------------------
  # Rule 3: Non-linear state-machine shape on DIFFERENT entities
  # --------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: closing_disclosure_revision_cycle
        grounds:
          - state_machines.ClosingDisclosure.ISSUED_to_REVISED
          - state_machines.ClosingDisclosure.ACKNOWLEDGED_to_REVISED
          - state_machines.ClosingDisclosure.REVISED_to_ISSUED
          - entities.ClosingDisclosure.fields.version_number
          - entities.ClosingDisclosure.fields.earliest_funding_at
        distinguishing_aspect: |
          ClosingDisclosure exhibits a cycle ISSUED→REVISED→ISSUED on the SAME
          entity row, with version_number incrementing per cycle and
          earliest_funding_at either restarting (major-change reason) or
          preserved (fee-only reason). This is not a linear A→B→C pipeline —
          revisions can repeat unboundedly.
        test_recipe:
          setup:
            - "Create EscrowFile, advance to CONTINGENT_CD (CCR ack, title cleared, owners policy bound)"
            - "Create ClosingDisclosure (version_number=1); POST /closing-disclosures/{id}/issue"
            - "POST /_clock/advance to issued_at + 1 business day (still inside cooling-off)"
          trigger:
            - "POST /closing-disclosures/{id}/revise with triggering_change_kind=APR_DELTA_OVER_THRESHOLD"
            - "POST /closing-disclosures/{id}/issue (creates version_number=2)"
            - "POST /closing-disclosures/{id}/revise with triggering_change_kind=FEE_DELTA_UNDER_THRESHOLD"
            - "POST /closing-disclosures/{id}/issue (creates version_number=3)"
          assert:
            - "After first revise→issue: ClosingDisclosure.version_number == 2 AND ClosingDisclosure.status == ISSUED"
            - "After second revise→issue: ClosingDisclosure.version_number == 3"
            - "Cycle traversed ISSUED→REVISED→ISSUED→REVISED→ISSUED — cyclic, not linear"

      - name: escrow_file_branching_advance_with_revert_to_cancelled
        grounds:
          - state_machines.EscrowFile.OPEN_to_CONTINGENT_TITLE
          - state_machines.EscrowFile.CONTINGENT_TITLE_to_CONTINGENT_CD
          - state_machines.EscrowFile.CONTINGENT_CD_to_CONTINGENT_WIRE
          - state_machines.EscrowFile.CONTINGENT_TITLE_to_CANCELLED
          - state_machines.EscrowFile.CONTINGENT_CD_to_CANCELLED
          - state_machines.EscrowFile.CONTINGENT_WIRE_to_CANCELLED
        distinguishing_aspect: |
          EscrowFile state machine has branching shape: from any of the three
          CONTINGENT_* states, two outgoing edges exist — forward advance OR
          terminal cancel — and the cancel path carries divergent side-effect
          sets (EMD disposition by cancel_reason; QUOTED-policy cascade only
          fires from earlier states). This is on a DIFFERENT entity than the
          ClosingDisclosure cycle above, satisfying Rule 3's different-entity
          clause.
        test_recipe:
          setup:
            - "Create EscrowFile and EMD HELD"
            - "Order TitleSearch (status=ORDERED)"
            - "Create TitleInsurancePolicy (status=QUOTED) on the file"
          trigger:
            - "POST /escrow-files/{id}/advance — verify file advances to CONTINGENT_TITLE"
            - "POST /escrow-files/{id}/cancel with cancel_reason=SELLER_DEFAULT"
          assert:
            - "After advance: EscrowFile.status == CONTINGENT_TITLE"
            - "After cancel from CONTINGENT_TITLE: EscrowFile.status == CANCELLED AND EMD.status == RELEASED_TO_BUYER AND TitleInsurancePolicy.status == VOIDED"
            - "Branching observed: same CONTINGENT_TITLE source had two valid out-edges"

  # --------------------------------------------------------------------------
  # Rule 4: Transitive cascade chains from DIFFERENT triggers
  # --------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: wire_fraud_flag_to_disbursement_reverse_to_escrow_stall
        grounds:
          - state_machines.WireInstruction.PENDING_CONFIRMATION_to_REJECTED_FRAUD_FLAG
          - state_machines.Disbursement.APPROVED_to_REVERSED
          - state_machines.EscrowFile.CONTINGENT_WIRE_to_CANCELLED
        distinguishing_aspect: |
          Depth ≥ 3 cascade with each link CAUSED by the previous one (not
          fan-out from origin). Chain: A) POST /wire-instructions/{id}/flag-fraud
          transitions WireInstruction to REJECTED_FRAUD_FLAG. B) That transition
          cascades all dependent Disbursements (APPROVED) to REVERSED — caused
          by the wire flip, not by the original request directly. C) The
          operator then POSTs /escrow-files/{id}/cancel with cancel_reason=
          WIRE_FRAUD_DETECTED, which (because the file is now stuck in
          CONTINGENT_WIRE with no confirmed wires) cascades EMD disposition.
          Three sequential hops, each causally chained to the previous one.
        test_recipe:
          setup:
            - "Build full escrow up to CONTINGENT_WIRE: EMD HELD, title CLEARED, OWNERS policy BOUND, CCR acknowledged, CD READY_TO_FUND (after 3 BD)"
            - "Create WireInstruction submitted; confirm it via operator B (different from CD issuer A); status CONFIRMED"
            - "Create Disbursement and POST /disbursements/{id}/approve via operator B; status APPROVED"
            - "Re-submit a peer WireInstruction (PENDING_CONFIRMATION) referencing the same escrow file for a different beneficiary_kind"
            - "Approve a peer Disbursement on the new PENDING_CONFIRMATION wire so cascade has something to reach"
          trigger:
            - "POST /wire-instructions/{newWireId}/flag-fraud (hop A)"
            - "(Verify hop B: peer Disbursement on flagged wire transitions to REVERSED automatically)"
            - "POST /escrow-files/{id}/cancel with cancel_reason=SELLER_DEFAULT (hop C — causally chained because the cancellation only became necessary due to hop A’s fraud detection)"
          assert:
            - "Hop A: WireInstruction.status == REJECTED_FRAUD_FLAG"
            - "Hop B: peer Disbursement.status == REVERSED (caused by hop A’s cascade rule)"
            - "Hop C: EscrowFile.status == CANCELLED AND EMD.status == RELEASED_TO_BUYER (caused by hop A→B making the file unworkable)"
            - "Three causally chained hops — not a fan-out"

      - name: title_defective_cascade_to_quoted_void_to_escrow_advance_block
        grounds:
          - state_machines.TitleSearch.COMPLETED_to_DEFECTIVE
          - state_machines.TitleInsurancePolicy.QUOTED_to_VOIDED
          - state_machines.EscrowFile.OPEN_to_CONTINGENT_TITLE
        distinguishing_aspect: |
          Depth ≥ 2 cascade originating from a DIFFERENT trigger
          (POST /title-searches/{id}/mark-defective) than the wire-fraud chain.
          Chain: A) Title search becomes DEFECTIVE. B) That transition cascades
          all QUOTED TitleInsurancePolicy rows on the same escrow_file_id to
          VOIDED (caused by hop A’s side-effect). The cascade then BLOCKS
          subsequent EscrowFile advance because the OWNERS-BOUND precondition
          can no longer be satisfied — an observable downstream effect on a
          third entity.
        test_recipe:
          setup:
            - "Create EscrowFile, EMD HELD, TitleSearch in ORDERED, then PATCH it COMPLETED with chain_of_title_clean=false open_liens_total=5000"
            - "Create TitleInsurancePolicy OWNERS QUOTED on same escrow_file_id"
            - "Create CCRDisclosure (so CCR precondition is satisfied)"
          trigger:
            - "POST /title-searches/{id}/mark-defective (hop A)"
            - "POST /escrow-files/{id}/advance (will fail; this proves hop B blocked the path)"
          assert:
            - "Hop A: TitleSearch.status == DEFECTIVE"
            - "Hop B: TitleInsurancePolicy.status == VOIDED (caused by hop A’s cascade)"
            - "Downstream effect: POST /escrow-files/{id}/advance returns 409 ERR_CROSS_ENTITY_STATE because no OWNERS policy is BOUND — observable downstream chain"

  # --------------------------------------------------------------------------
  # Rule 5: Validation priority conflicts across DIFFERENT error-category pairs
  # --------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_violation_beats_invalid_state_on_wire_confirm
        grounds:
          - validations[priority=5]   # ERR_INVALID_STATE (state)
          - validations[priority=7]   # ERR_SOD_VIOLATION (business_safety)
        distinguishing_aspect: |
          Pair: state vs business_safety. When the CD issuer (same operator as
          X-User-ID) attempts to confirm a wire on a row that is also already
          past PENDING_CONFIRMATION, BOTH ERR_INVALID_STATE and ERR_SOD_VIOLATION
          could apply. Priority ordering pins ERR_INVALID_STATE (priority 5)
          BEFORE ERR_SOD_VIOLATION (priority 7) — so a wire already CONFIRMED
          returns ERR_INVALID_STATE even if the actor is the SoD-violating CD
          issuer.
        test_recipe:
          setup:
            - "Build escrow to CONTINGENT_CD; operator A issues the CD"
            - "Operator A creates a WireInstruction, submits to PENDING_CONFIRMATION"
            - "Operator B confirms it -> CONFIRMED"
          trigger:
            - "Operator A (CD issuer, SoD violator) POST /wire-instructions/{id}/confirm-callback again on the already-CONFIRMED wire"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Response error_id != 'ERR_SOD_VIOLATION'  # priority 5 beats 7"

      - name: cross_entity_state_beats_business_temporal_on_cd_promote
        grounds:
          - validations[priority=6]    # ERR_CROSS_ENTITY_STATE (state)
          - validations[priority=9]    # ERR_CD_WAITING_PERIOD (business_temporal)
        distinguishing_aspect: |
          DIFFERENT pair from the SoD/state pair above. Pair: state (cross-entity)
          vs business_temporal. A CD in ACKNOWLEDGED can attempt
          /promote while two errors apply simultaneously: (a) the EscrowFile is
          NOT in CONTINGENT_CD (it was cancelled), and (b) the 3-BD clock has
          not elapsed. Priority pins ERR_CROSS_ENTITY_STATE (priority 6) wins
          over ERR_CD_WAITING_PERIOD (priority 9).
        test_recipe:
          setup:
            - "Build escrow to CONTINGENT_CD; create CD and issue; buyer acknowledges"
            - "POST /escrow-files/{id}/cancel — file becomes CANCELLED (CD VOIDED via cascade)"
            - "DO NOT advance clock past earliest_funding_at"
          trigger:
            - "POST /closing-disclosures/{cdId}/promote on the (now-VOIDED) CD"
          assert:
            - "Response error_id == 'ERR_CROSS_ENTITY_STATE' (or ERR_INVALID_STATE if CD already VOIDED — either way NOT ERR_CD_WAITING_PERIOD)"
            - "Specifically the temporal error is suppressed by the higher-priority state-class error"

  # --------------------------------------------------------------------------
  # Rule 6: Boundary-precision checks on DIFFERENT metrics/endpoints
  # --------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: emd_floor_one_percent_exact_equality
        grounds:
          - validations[priority=14]
          - state_machines.EarnestMoneyDeposit.PENDING_FUNDS_to_HELD
          - entities.EarnestMoneyDeposit.fields.amount
        distinguishing_aspect: |
          Numeric threshold metric: EMD.amount >= 0.01 * EscrowFile.purchase_price.
          Boundary tested at exact equality (3000.00 on a 300000 sale =
          1.0% exactly) MUST succeed (>= semantics, NOT >); 2999.99 MUST fail.
          Endpoint: POST /earnest-money/{id}/fund.
        test_recipe:
          setup:
            - "Create EscrowFile purchase_price=300000"
            - "Create EMD amount=3000.00 (case A) and amount=2999.99 on a peer EscrowFile (case B)"
          trigger:
            - "Case A: POST /earnest-money/{caseAId}/fund"
            - "Case B: POST /earnest-money/{caseBId}/fund"
          assert:
            - "Case A: 200 OK and EMD.status == HELD (boundary >= satisfied at equality)"
            - "Case B: 422 ERR_EMD_BELOW_FLOOR (just-under boundary rejected)"

      - name: section_1031_45day_deadline_inclusive_endpoint
        grounds:
          - validations[priority=10]
          - state_machines.Exchange1031.INITIATED_to_IDENTIFIED
          - entities.Exchange1031.fields.identification_deadline_at
        distinguishing_aspect: |
          DIFFERENT metric (date/clock instant) on a DIFFERENT endpoint
          (POST /exchanges/{id}/identify). Rule: server_now <=
          identification_deadline_at — inclusive equality must succeed.
          Boundary tested at server_now == identification_deadline_at
          (closing_date_planned + 45 days exactly) MUST succeed;
          identification_deadline_at + 1 second MUST fail.
        test_recipe:
          setup:
            - "Create EscrowFile closing_date_planned='2026-06-01T00:00:00Z' is_1031_exchange=true"
            - "POST /exchanges (identification_deadline_at = 2026-07-16T00:00:00Z)"
          trigger:
            - "Case A: POST /_clock/advance to='2026-07-16T00:00:00Z'; POST /exchanges/{id}/identify"
            - "Case B (peer exchange): POST /_clock/advance to='2026-07-16T00:00:01Z'; POST /exchanges/{id2}/identify"
          assert:
            - "Case A: 200 OK and Exchange1031.status == IDENTIFIED (boundary <= satisfied at equality)"
            - "Case B: 409 ERR_1031_45DAY_LAPSED (just-past boundary rejected)"

  # --------------------------------------------------------------------------
  # Rule 7: Cross-entity state dependencies across DIFFERENT entity pairs
  # --------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lenders_policy_bind_requires_owners_bound_same_file
        grounds:
          - validations[priority=12]
          - state_machines.TitleInsurancePolicy.QUOTED_to_BOUND
          - entities.TitleInsurancePolicy.fields.policy_kind
        distinguishing_aspect: |
          Pair: TitleInsurancePolicy(LENDERS) → TitleInsurancePolicy(OWNERS) on
          same escrow_file_id. A LENDERS policy may only bind if a peer OWNERS
          policy on the same escrow_file is already BOUND. Different rows of
          the same entity TYPE but distinct logical entities — valid
          cross-entity (cross-row) pair.
        test_recipe:
          setup:
            - "Create EscrowFile; create TitleSearch and POST /title-searches/{id}/clear"
            - "Create TitleInsurancePolicy OWNERS QUOTED (do NOT bind)"
            - "Create TitleInsurancePolicy LENDERS QUOTED"
          trigger:
            - "POST /title-policies/{lendersId}/bind (no OWNERS bound)"
            - "Then POST /title-policies/{ownersId}/bind"
            - "Then POST /title-policies/{lendersId}/bind (retry)"
          assert:
            - "First lenders bind: 409 ERR_LENDERS_REQUIRES_OWNERS"
            - "Owners bind: 200 OK"
            - "Second lenders bind (retry): 200 OK"

      - name: exchange_close_deferred_requires_qi_disbursement_settled
        grounds:
          - validations[priority=6]
          - state_machines.Exchange1031.IDENTIFIED_to_CLOSED_DEFERRED
          - state_machines.Disbursement.SENT_to_SETTLED
          - entities.Disbursement.fields.wire_instruction_id
          - entities.WireInstruction.fields.beneficiary_kind
        distinguishing_aspect: |
          DIFFERENT pair: Exchange1031 → Disbursement (with beneficiary_kind=
          QUALIFIED_INTERMEDIARY). Exchange1031.IDENTIFIED → CLOSED_DEFERRED
          requires a Disbursement to a QI WireInstruction to be in status
          SETTLED on the same escrow_file_id. This crosses a different entity
          pair than the OWNERS/LENDERS pair above.
        test_recipe:
          setup:
            - "Build escrow to READY_TO_CLOSE with §1031 election; create Party party_kind=QUALIFIED_INTERMEDIARY"
            - "Create WireInstruction beneficiary_kind=QUALIFIED_INTERMEDIARY; submit; confirm via SoD-clean operator B"
            - "Create Exchange1031 (INITIATED) and POST /exchanges/{id}/identify within 45d"
          trigger:
            - "POST /exchanges/{id}/close-deferred BEFORE creating the QI Disbursement"
            - "Then POST /disbursements with the QI wire; approve; send; settle"
            - "Then POST /exchanges/{id}/close-deferred again"
          assert:
            - "First close-deferred: 409 ERR_CROSS_ENTITY_STATE (no SETTLED QI Disbursement)"
            - "Second close-deferred (after QI Disbursement SETTLED): 200 OK and Exchange1031.status == CLOSED_DEFERRED"

  # --------------------------------------------------------------------------
  # Rule 8: Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # --------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cd_three_business_day_cooling_off_half_open_inclusive_end
        grounds:
          - calculations.cd_business_day_clock
          - validations[priority=9]
          - state_machines.ClosingDisclosure.ACKNOWLEDGED_to_READY_TO_FUND
          - entities.ClosingDisclosure.fields.earliest_funding_at
          - entities.ClosingDisclosure.fields.issued_at
        distinguishing_aspect: |
          Interval semantics: the cooling-off window is (issued_at, earliest_funding_at)
          measured by counting BUSINESS DAYS starting on the day AFTER issuance
          (Sundays excluded, US federal holidays excluded, Saturdays included
          per CFPB Reg Z §1026.19(f)). The endpoint comparison is closed at the
          right (server_now >= earliest_funding_at). This interval arithmetic
          mixes calendar-day adjacency with weekend/holiday SKIPS — distinct
          from a plain continuous interval.
        test_recipe:
          setup:
            - "Build escrow to CONTINGENT_CD on day 2026-05-15 (Friday)"
            - "Create CD, issue at server_now='2026-05-15T15:00:00Z' (Friday)"
            - "Buyer acknowledges immediately"
          trigger:
            - "POST /_clock/advance to='2026-05-19T14:59:59Z' (Tue 14:59:59 UTC — earliest_funding_at == 2026-05-19T00:00:00Z so server_now >= earliest_funding_at IS true)"
            - "POST /closing-disclosures/{id}/promote — case A"
            - "(Peer CD) issue at '2026-05-15T15:00:00Z'; advance to '2026-05-18T23:59:59Z' (Mon, day before earliest_funding_at)"
            - "POST /closing-disclosures/{id}/promote — case B"
          assert:
            - "Case A: 200 OK; ClosingDisclosure.status == READY_TO_FUND. Counting: Sat=BD1, Mon=BD2 (Sun skipped), Tue=BD3 → earliest 2026-05-19T00:00:00Z"
            - "Case B: 409 ERR_CD_WAITING_PERIOD (server_now < earliest_funding_at)"

      - name: section_1031_45_180_day_calendar_window_non_business_day
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - entities.Exchange1031.fields.identification_deadline_at
          - entities.Exchange1031.fields.exchange_deadline_at
          - state_machines.Exchange1031.INITIATED_to_IDENTIFIED
          - state_machines.Exchange1031.IDENTIFIED_to_CLOSED_DEFERRED
        distinguishing_aspect: |
          DIFFERENT interval semantics from the CD cooling-off (which used
          business-day adjacency with Sat/holiday rules). §1031 deadlines are
          continuous CALENDAR-day windows: 45 days exact and 180 days exact
          from closing_date_planned — Saturdays, Sundays, holidays all COUNT
          as elapsed time. Furthermore the 180-day clock runs even if 45-day
          fails (the two intervals can lapse independently). Two different
          interval arithmetics on the SAME entity (Exchange1031) but they
          measure two different temporal phases.
        test_recipe:
          setup:
            - "Create EscrowFile closing_date_planned='2026-06-01T00:00:00Z' is_1031_exchange=true"
            - "POST /exchanges (45-day deadline = 2026-07-16T00:00:00Z, 180-day deadline = 2026-11-28T00:00:00Z)"
          trigger:
            - "POST /_clock/advance to='2026-07-15T00:00:00Z' (44 calendar days, including weekends)"
            - "POST /exchanges/{id}/identify — case A"
            - "(Peer exchange) POST /_clock/advance to='2026-07-17T00:00:00Z'; POST /exchanges/{id2}/identify — case B"
          assert:
            - "Case A: 200 OK; Exchange1031.status == IDENTIFIED (45-day window includes weekends)"
            - "Case B: 409 ERR_1031_45DAY_LAPSED (past the calendar-day boundary, no holiday skip)"
            - "Distinct from CD interval semantics: weekends count here"

  # --------------------------------------------------------------------------
  # Rule 9: Compensating-action invariants across DIFFERENT conserved quantities
  # --------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: emd_pool_dollar_conservation
        grounds:
          - calculations.emd_disposition
          - state_machines.EarnestMoneyDeposit.HELD_to_RELEASED_TO_SELLER
          - state_machines.EarnestMoneyDeposit.HELD_to_RELEASED_TO_BUYER
          - state_machines.EarnestMoneyDeposit.HELD_to_SPLIT
          - entities.EarnestMoneyDeposit.fields.amount
          - entities.EarnestMoneyDeposit.fields.forfeited_amount
          - entities.EarnestMoneyDeposit.fields.refunded_amount
          - validations[priority=15]
        distinguishing_aspect: |
          Conserved quantity: USD in the EMD escrow pool. Pinned invariant:
          for every EMD row not in PENDING_FUNDS/HELD, amount ==
          forfeited_amount + refunded_amount. The forward action
          (POST /earnest-money/{id}/fund) places dollars into HELD; the
          compensating action (POST /earnest-money/{id}/release with any
          reason — including the MUTUAL_RELEASE split which itself enforces
          split_buyer_share + split_seller_share == amount) MUST conserve the
          total. Conserved quantity: USD.
        test_recipe:
          setup:
            - "Create three EscrowFiles (purchase_price=300000 each) with three EMDs amount=3000.00"
            - "POST /earnest-money/{eachId}/fund -> all HELD"
          trigger:
            - "EMD #1: POST /earnest-money/{id}/release with reason=BUYER_DEFAULT"
            - "EMD #2: POST /earnest-money/{id}/release with reason=SELLER_DEFAULT"
            - "EMD #3: POST /earnest-money/{id}/release with reason=MUTUAL_RELEASE split_buyer_share=1200.00 split_seller_share=1800.00"
          assert:
            - "EMD #1: forfeited_amount + refunded_amount == 3000.00 (== amount)"
            - "EMD #2: forfeited_amount + refunded_amount == 3000.00"
            - "EMD #3: forfeited_amount + refunded_amount == 3000.00 (1800 + 1200)"
            - "Global pool invariant: sum across all three released EMDs of (forfeited_amount + refunded_amount) == 9000.00 == sum(amount)"

      - name: section_1031_gain_conservation
        grounds:
          - calculations.section_1031_gain
          - state_machines.Exchange1031.IDENTIFIED_to_CLOSED_DEFERRED
          - state_machines.Exchange1031.IDENTIFIED_to_FAILED_TAXABLE
          - state_machines.Exchange1031.INITIATED_to_FAILED_TAXABLE
          - entities.Exchange1031.fields.realized_gain
          - entities.Exchange1031.fields.recognized_gain
          - entities.Exchange1031.fields.deferred_gain
          - validations[priority=16]
        distinguishing_aspect: |
          DIFFERENT conserved quantity: realized capital gain (USD, but
          logically distinct — it is a tax-accounting quantity, not an escrow
          balance). Pinned invariant: recognized_gain + deferred_gain ==
          realized_gain on every Exchange1031 row at every state. Both the
          forward action (close-deferred) and the compensating action (fail —
          which moves all gain into recognized) must leave this sum equal to
          realized_gain. Distinct from EMD's dollar-pool conservation.
        test_recipe:
          setup:
            - "Create two EscrowFiles + Exchange1031 rows with identical inputs: relinquished_basis=200000, relinquished_sale_price=500000, cash_boot_received=50000, mortgage_relief=20000 → realized_gain=300000"
            - "POST /exchanges/{each}/identify within 45 days"
          trigger:
            - "Exchange #1: full deferred path — settle QI Disbursement; POST /exchanges/{id}/close-deferred"
            - "Exchange #2: failure path — POST /_clock/advance past 180-day deadline; POST /exchanges/{id}/fail"
          assert:
            - "Exchange #1: recognized_gain=70000.00, deferred_gain=230000.00, 70000.00 + 230000.00 == 300000.00 == realized_gain"
            - "Exchange #2: recognized_gain=300000.00, deferred_gain=0, 300000.00 + 0 == 300000.00 == realized_gain"
            - "Both paths conserve realized_gain — a quantity distinct from the EMD dollar pool"
