            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
