            - "${mid_rate} == 0.90, SettlementBatch.${cbm_id}.pre_fee_reimbursement_cents == 54000, admin_fee_cents == 810 and ${mid_net} == 53190"
            - "${high_rate} == 0.95, SettlementBatch.${cbh_id}.pre_fee_reimbursement_cents == 57000, admin_fee_cents == 855 and ${high_net} == 56145"
            - "SettlementBatch.${cbm_id}.gallons_total == 2000.000 and SettlementBatch.${cbh_id}.gallons_total == 2000.001"

      - name: expiry_sweep_rolls_over_only_up_to_the_banner_cap_for_an_eligible_member
        claim_type: Constants Applied
        grounds:
          - calculations.point_expiry_sweep
          - entities.Banner.fields.rollover_cap_points
          - entities.PointLedgerEntry.fields.entry_type
        distinguishing_aspect: "An eligible member with 700 expiring points gets an EXPIRY row for the FULL -700 and a ROLLOVER row of +500 (the cap), netting 500 rather than a single -200 row, and the rescued lot is re-dated to the next cycle's closes_at — cap, two-row bookkeeping and re-dating in one pass."
        test_recipe:
          setup:
            - "Banner CORE with cycles 2026-07, 2026-08 and 2026-09; grocery site; household HH-CORE-1 ACTIVE with no OPEN signals and an ACTIVE PRIMARY link to member CM."
            - "CM earned 700 points on 2026-07-15, so the lot expires 2026-08-31T23:59:59.999Z; the July cycle has already been closed with the clock at 2026-08-01T00:00:00Z."
            - "The August cycle has been moved to CLOSING with the clock at 2026-09-01T00:00:00Z."
