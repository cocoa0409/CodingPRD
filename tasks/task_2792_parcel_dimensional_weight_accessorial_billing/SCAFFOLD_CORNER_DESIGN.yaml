              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "00000000-0000-0000-0000-000000000000", tracking_number: "1Z-P-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { err_sl: $.data.error_id }
            - call: "POST /shipments"
              payload: { shipper_id: "00000000-0000-0000-0000-000000000000", service_level_id: "${sl}", tracking_number: "1Z-P-0002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { err_sh: $.data.error_id }
          assert:
            - "The first call returns HTTP 404 with ${err_sl} == ERR_SERVICE_LEVEL_NOT_FOUND"
            - "The second call returns HTTP 404 with ${err_sh} == ERR_SHIPPER_NOT_FOUND — the shipper reference is checked at the lower priority 5, before the service level at priority 7"
            - "GET /shipments with shipper_id ${sh} returns total_count == 0"

      - name: flat_topology_children_are_reachable_from_every_parent_id
        claim_type: flat
        grounds:
          - entities.InvoiceLine.fields.invoice_id
          - entities.InvoiceLine.fields.shipment_id
          - entities.AccessorialCharge.fields.shipment_id
          - entities.DimensionScan.fields.shipment_id
        distinguishing_aspect: |
          Every child row of the flat topology is discoverable from its parent's id alone:
          GET /invoice-lines filtered by invoice_id and by shipment_id, GET
          /shipments/{id}/accessorials and GET /shipments/{id}/scans each return exactly the
          rows belonging to that parent and nothing belonging to the sibling shipment.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with an ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Two shipments 1Z-F-0001 and 1Z-F-0002 (both 12 x 10 x 8 in, 6.0 lb, zone 2) are inducted; 1Z-F-0001 carries one MANUAL ADDRESS_CORRECTION charge and one AUTOMATED_DWS scan, 1Z-F-0002 carries neither."
            - "Both parcels are delivered and swept onto one OPEN invoice."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-F-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-F-0002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p2: $.data.id }
            - call: "POST /shipments/${p1}/accessorials"
              payload: { code: "ADDRESS_CORRECTION", reason: "bad suite number" }
              as: BillingOps
              captures: { ac1: $.data.id }
            - call: "POST /shipments/${p1}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 12, scanned_width_in: 10, scanned_height_in: 8, scanned_weight_lbs: 6.0, expected_shipment_version: "${p1_v}" }
              as: CarrierOps
              captures: { scan1: $.data.id }
            - call: "POST /shipments/${p1}/deliver"
