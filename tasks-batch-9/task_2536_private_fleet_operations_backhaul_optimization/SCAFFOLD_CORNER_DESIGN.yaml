              as: TransportManager
              captures: { y_status: $.data.status }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { final_offer: $.data.backhaul_offer_id, final_credit: $.data.backhaul_credit_cents }
          assert:
            - "${link_x_offer} == ${offer_x} with ${link_x_credit} == 0 - a PROPOSED offer links but credits nothing"
            - "${x_cm} == 14900 with ${x_margin} == 0.2483, and ${x_status} == ACCEPTED lifts ${credit_after_accept} to 14900"
            - "${y_tier} == 0.42 and ${y_cm} == 25200 while Y is only UNDER_REVIEW"
            - "${steal_err} == ERR_BACKHAUL_ALREADY_LINKED with HTTP 422 - a second trip cannot take an offer that TRIP-E6 already carries"
            - "${relink_offer} == ${offer_y} with ${relink_credit} == 0 and ${v_after_relink} > ${v_after_accept} - the trip's own re-link is allowed and resets the credit because Y is not ACCEPTED yet"
            - "${x_status_after} == PROPOSED with ${x_round_after} == 0, ${x_exception_after} == false and ${x_cm_after} == 14900 - the demoted offer keeps its computed economics and returns to the market"
            - "${y_status} == ACCEPTED and ${final_offer} == ${offer_y} with ${final_credit} == 25200"

