  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_state_beats_expired_window_priority_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_DONATION_NOT_REFUNDABLE]
          - errors[ERR_REFUND_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Error-category pair `state` (priority 6, ERR_DONATION_NOT_REFUNDABLE) versus `business_temporal`
          (priority 9, ERR_REFUND_WINDOW_EXPIRED): an already-REFUNDED donation refunded again at
          2026-10-01T00:00:00Z violates both, and the state error must win.
        test_recipe:
          setup:
            - "PUBLISHED campaign with one 10000-cent CAMPAIGN-designated donation settled at the 2026-07-01T00:00:00Z clock default, no match pool."
            - "The donation has already been refunded once, so payment_status is REFUNDED."
            - "Clock advanced to 2026-10-01T00:00:00Z, which is 92 days after settled_at and therefore also outside the 60-day refund window."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "POST /api/donations/${don_id}/refund"
              payload: { reason: "first refund" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/donations/${don_id}/refund"
              payload: { reason: "second refund attempt" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DONATION_NOT_REFUNDABLE"
            - "error_id != ERR_REFUND_WINDOW_EXPIRED"
            - "Donation.${don_id}.payment_status == REFUNDED (unchanged)"

      - name: registration_campaign_mismatch_beats_capacity_priority_conflict
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_EVENT_CAMPAIGN_MISMATCH]
          - errors[ERR_EVENT_AT_CAPACITY]
        distinguishing_aspect: |
          A different error-category pair — `business_referential` (priority 7, ERR_EVENT_CAMPAIGN_MISMATCH)
          versus `business_constraint` (priority 12, ERR_EVENT_AT_CAPACITY): registering a participant of
          campaign A for a FULL event of campaign B violates both and must return the referential error.
        test_recipe:
          setup:
            - "Two PUBLISHED campaigns of the same organization: campaign A and campaign B."
            - "Campaign B owns an event of capacity 1 whose single slot is already RESERVED by a campaign-B participant, so the event is FULL."
            - "Campaign A owns an ACTIVE participant with no registrations."
          setup_api_calls:
            - call: "POST /api/organizations"
