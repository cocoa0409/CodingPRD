            - call: "GET /bowl-appearances/${ba_c_id}/postseason-units"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "hop 1: BowlAppearance.${ba_c_id}.status == APPROVED and .residual_to_pool_cents == 4800000"
            - "hop 2: the postseason-units response contains exactly 3 rows, all with status == VALIDATED, fiscal_year == 2027 and member_id == ${m_n_id}"
            - "hop 3: Conference.validated_postseason_unit_count == 3 and Conference.escrow_balance_cents == 4800000"
            - "GET /members/${m_n_id}/postseason-unit-valuation returns validated_unit_count == 3 and valuation_cents == 102000000"

  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: pool_state_precedes_reserve_posture_frozen
        grounds:
          - validations[priority=22]
          - validations[priority=62]
          - calculations.reserve_posture_derivation
          - state_machines.RevenuePool.DRAFT_to_OPEN
        distinguishing_aspect: |
          A state violation (priority 22, category state) and a fiscal violation
          (priority 62, category business_fiscal) are both live on the same call: the
          pool is still DRAFT and the reserve posture is FROZEN. The response is
          ERR_POOL_STATE_INVALID; only after the pool is opened does the same call
          surface ERR_RESERVE_POSTURE_FROZEN, proving state outranks business_fiscal.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget of 120000000 operating cents, so reserve_target_cents is 18000000."
            - "No reserve contribution has been made, so reserve_balance_cents is 0, funded_ratio_bps is 0 and reserve_posture is FROZEN."
            - "A FY2027 MEDIA_RIGHTS pool exists but is still in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_pool
            - *k_pool_read
          trigger:
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v}", memo: "priority probe" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${rp_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "GET /revenue-pools/${rp_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rp_v3: $.data.version }
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v3}", memo: "priority probe" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          assert:
            - "Conference.reserve_target_cents == 18000000, Conference.reserve_balance_cents == 0, Conference.funded_ratio_bps == 0 and Conference.reserve_posture == FROZEN"
            - "the first run request returns HTTP 409 with error.id == ERR_POOL_STATE_INVALID, not ERR_RESERVE_POSTURE_FROZEN"
            - "the second run request returns HTTP 409 with error.id == ERR_RESERVE_POSTURE_FROZEN"
            - "no DistributionRun row exists for pool ${rp_id} after both attempts"

      - name: segregation_of_duties_precedes_audit_report_requirement
        grounds:
          - validations[priority=33]
          - validations[priority=56]
          - roles.Treasurer
          - entities.DistributionRun.fields.computed_by_user_id
        distinguishing_aspect: |
          Both a business_safety violation (priority 33, the poster is the same user who
          computed the run) and a business_referential violation (priority 56, no audit
          report exists at all) apply to the same post call; the response is
          ERR_SEGREGATION_OF_DUTIES, and switching only the acting user id surfaces
          ERR_AUDIT_REPORT_NOT_ISSUED - a different error-category pair from the
          state-versus-fiscal instance.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "A FY2026 EQUAL_SHARE pool has its books closed at 4000000 audited expense cents and a FINAL_AUDITED run has been computed by user u_fin_1 and is in COMPUTED."
            - "No AuditReport exists for that run."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - *k_p26
            - *k_p26_open
            - *k_p26_cb
            - *k_p26_read
            - *k_r26
          trigger:
            - call: "POST /distribution-runs/${r26_id}/post"
              payload: {}
              as: Treasurer
              as_user_id: "u_fin_1"
            - call: "POST /distribution-runs/${r26_id}/post"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
          assert:
            - "DistributionRun.${r26_id}.computed_by_user_id == u_fin_1"
            - "the first post returns HTTP 409 with error.id == ERR_SEGREGATION_OF_DUTIES, not ERR_AUDIT_REPORT_NOT_ISSUED"
            - "the second post returns HTTP 409 with error.id == ERR_AUDIT_REPORT_NOT_ISSUED"
            - "DistributionRun.${r26_id}.status is still COMPUTED and Member.${m_n_id}.last_full_annual_distribution_cents is still 0"

      - name: rest_buffer_precedes_home_venue_constraint
        grounds:
          - validations[priority=38]
          - validations[priority=42]
          - entities.Member.fields.home_venue_id
          - entities.ScheduleGame.fields.game_date
        distinguishing_aspect: |
          A business_temporal violation (priority 38, North already plays two days
          earlier) and a business_constraint violation (priority 42, the Eastport Arena
          is not North's home venue) are both live on the same create call; the response
          is ERR_MEMBER_REST_BUFFER_VIOLATION at 409, and moving the date fifteen days
          out surfaces ERR_VENUE_NOT_HOME_VENUE at 422 - a temporal-versus-constraint
          pair distinct from the two other instances.
        test_recipe:
          setup:
            - "The conference exists with current_fiscal_year 2027 and members North, South and East seated as charter members; North's home venue is the Northfield Dome and East's is the Eastport Arena."
            - "A media-designated FY2027 game with North at home against South is SCHEDULED for 2026-09-05T19:00:00Z at the Northfield Dome."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_g1
          trigger:
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v2_id}", game_date: "2026-09-07T19:00:00Z", fiscal_year: 2027, media_designated: false }
              as: ScheduleCoordinator
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v2_id}", game_date: "2026-09-20T19:00:00Z", fiscal_year: 2027, media_designated: false }
              as: ScheduleCoordinator
          assert:
            - "the first create returns HTTP 409 with error.id == ERR_MEMBER_REST_BUFFER_VIOLATION, not ERR_VENUE_NOT_HOME_VENUE"
            - "the second create returns HTTP 422 with error.id == ERR_VENUE_NOT_HOME_VENUE"
            - "exactly one ScheduleGame row exists for the conference after both attempts"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: reserve_funded_ratio_exactly_6000_bps_is_open
        grounds:
          - calculations.reserve_posture_derivation
          - entities.Conference.fields.reserve_posture
          - entities.Conference.fields.funded_ratio_bps
          - concurrency_rules[reserve-transfer-stale-conference]
        distinguishing_aspect: |
          A balance of 10800000 against a target of 18000000 is exactly 6000 bps, the
          RESERVE_RESTRICTED threshold, and the comparison is strict on the low side, so
          the posture is OPEN; removing a single cent puts funded_ratio_bps at 5999 and
          flips the posture to RESERVE_RESTRICTED - a one-cent boundary on a
          cross-multiplied integer comparison.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget of 120000000 operating cents, so reserve_target_cents is 18000000."
            - "The reserve is empty, so reserve_posture is FROZEN."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
          trigger:
            - call: "POST /conference/reserve-transfers"
              payload: { transfer_type: "CONTRIBUTION", amount_cents: 10800000, expected_conference_version: "${conf_v}", memo: "boundary funding" }
              as: Treasurer
              as_user_id: "u_trs_1"
            - call: "GET /conference"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
              captures: { conf_v2: $.data.version }
            - call: "POST /conference/reserve-transfers"
              payload: { transfer_type: "WITHDRAWAL", amount_cents: 1, expected_conference_version: "${conf_v2}", memo: "one cent below the boundary" }
              as: Treasurer
              as_user_id: "u_trs_1"
          assert:
            - "after the contribution, Conference.reserve_balance_cents == 10800000, Conference.funded_ratio_bps == 6000 and Conference.reserve_posture == OPEN"
            - "after the one-cent withdrawal, Conference.reserve_balance_cents == 10799999, Conference.funded_ratio_bps == 5999 and Conference.reserve_posture == RESERVE_RESTRICTED"
            - "Conference.reserve_target_cents == 18000000 throughout"

      - name: admit_vote_approval_ratio_exactly_7500_bps_passes
        grounds:
          - calculations.vote_tally
          - entities.MembershipAction.fields.approval_ratio_bps
          - entities.MembershipAction.fields.required_approval_bps
          - state_machines.MembershipAction.VOTING_to_APPROVED
        distinguishing_aspect: |
          Three FOR votes at 10000 bps against one AGAINST at 10000 bps give an approval
          ratio of exactly 7500 bps, precisely the ADMIT threshold, and the comparison is
          inclusive, so the action is APPROVED rather than REJECTED - the tie-point of a
          floor-divided basis-point ratio rather than a cent boundary.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "Four charter members are FULL_SHARE at 10000 bps and Central is PETITIONED with 0 voting weight."
            - "An ADMIT action for Central proposed by u_com_1 is in VOTING with no ballots cast."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - *k_mc
            - *k_ma_admit
            - *k_ma_open
            - *k_ma_read
          trigger:
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR", expected_action_version: "${ma_v} + 1" }
              as: MemberRepresentative
              as_user_id: "${m_s_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_e_id}", choice: "FOR", expected_action_version: "${ma_v} + 2" }
              as: MemberRepresentative
              as_user_id: "${m_e_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_w_id}", choice: "AGAINST", expected_action_version: "${ma_v} + 3" }
              as: MemberRepresentative
              as_user_id: "${m_w_id}"
            - call: "POST /membership-actions/${ma_id}/close-voting"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "MembershipAction.${ma_id}.eligible_weight_bps == 40000 (Central's 0 bps is excluded) and .cast_weight_bps == 40000"
            - "MembershipAction.${ma_id}.quorum_met == true"
            - "MembershipAction.${ma_id}.for_weight_bps == 30000 and .against_weight_bps == 10000"
            - "MembershipAction.${ma_id}.approval_ratio_bps == 7500 and .required_approval_bps == 7500"
            - "MembershipAction.${ma_id}.status == APPROVED"

      - name: unit_based_pool_with_zero_validated_units_is_empty_basis
        grounds:
          - calculations.distribution_share_allocation
          - validations[priority=66]
          - entities.PostseasonUnit.fields.status
          - calculations.distribution_line_offsets
        distinguishing_aspect: |
          A UNIT_BASED pool over four members holding zero VALIDATED units gives a
          total_weight_bps of exactly 0 - the empty-collection boundary - and is rejected
          with ERR_EMPTY_ALLOCATION_BASIS; minting a single appearance worth 2 units
          moves the basis one step off zero and the identical call succeeds, allocating
          the whole 95000000 distributable to the one member with non-zero weight while
          the three zero-weight members receive no line at all.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents, so reserve_posture is OPEN."
            - "Four FULL_SHARE charter members exist and none of them holds a single VALIDATED postseason unit."
            - "An OPEN FY2027 POSTSEASON_UNITS pool with allocation_method UNIT_BASED holds 100000000 gross cents and 0 estimated expense cents."
          setup_api_calls:
            - *k_clock
            - *k_conf
            - *k_v1
            - *k_v2
            - *k_mn
            - *k_ms
            - *k_me
            - *k_mw
            - *k_bp
            - *k_bp_open
            - *k_bal_n
            - *k_bal_s
            - *k_bal_e
            - *k_bal_w
            - *k_bp_close
            - *k_conf_read
            - *k_res12
            - call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2027, pool_type: "POSTSEASON_UNITS", allocation_method: "UNIT_BASED", gross_revenue_cents: 100000000, estimated_expense_cents: 0 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { up_id: $.data.id }
            - call: "POST /revenue-pools/${up_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "GET /revenue-pools/${up_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { up_v: $.data.version }
          trigger:
            - call: "POST /revenue-pools/${up_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${up_v}", memo: "empty basis probe" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Prairie Bowl", event_tier: "TOURNAMENT", payout_cents: 12000000, submitted_expense_cents: 9500000, travel_miles: 1400, units_claimed: 2 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_u_id: $.data.id }
            - call: "POST /bowl-appearances/${ba_u_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba_u_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "GET /revenue-pools/${up_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { up_v2: $.data.version }
            - call: "POST /revenue-pools/${up_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${up_v2}", memo: "non-empty basis" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { run_u_id: $.data.id }
          assert:
            - "the first run request returns HTTP 422 with error.id == ERR_EMPTY_ALLOCATION_BASIS and creates no DistributionRun row"
            - "DistributionRun.${run_u_id}.net_pool_cents == 100000000, .reserve_draw_cents == 5000000 and .distributable_cents == 95000000"
            - "DistributionRun.${run_u_id}.total_weight_bps == 20000 and .remainder_cents == 0"
            - "GET /distribution-runs/${run_u_id}/lines returns exactly 1 row"
            - "DistributionLine(run=${run_u_id}, member=${m_n_id}).weight_bps == 20000 and .gross_share_cents == 95000000 and .withheld_cents == 9500000 and .governance_fee_cents == 1250000 and .net_payable_cents == 84250000"
            - "no DistributionLine exists for members ${m_s_id}, ${m_e_id} or ${m_w_id} on run ${run_u_id}"

      - name: rest_buffer_of_exactly_five_days_is_accepted
        grounds:
          - validations[priority=38]
          - entities.ScheduleGame.fields.game_date
          - calculations.schedule_compliance_score
        distinguishing_aspect: |
          A five-day gap is accepted and a four-day gap is rejected on the same member,
