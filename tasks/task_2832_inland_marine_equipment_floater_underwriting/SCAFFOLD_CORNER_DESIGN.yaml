              captures: { cp: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/installation-floaters"
              payload: { jobsite_id: "${js}", project_name: "Overrunning glazing package", installed_value_limit_cents: 20000000, coverage_start_date: "2026-09-01", coverage_end_date: "2027-08-02" }
              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/installation-floaters"
              payload: { jobsite_id: "${js}", project_name: "Glazing package", installed_value_limit_cents: 20000000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-12-01" }
              as: Underwriter
              captures: { flt: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
