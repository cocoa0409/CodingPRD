            - { call: "POST /sleep-studies/${st1}/complete-acquisition", payload: { total_recording_time_minutes: 480 }, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st1}", scorer_id: "${s1}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk1: $.data.id } }
          trigger:
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 10, central_apneas: 0, mixed_apneas: 0, hypopneas: 10, reras: 0, epochs_total: 960, total_recording_time_minutes: 480 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/return", payload: { reason: "staging needs revision" }, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks/${tk1}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/submit", payload: { obstructive_apneas: 12, central_apneas: 0, mixed_apneas: 0, hypopneas: 10, reras: 0, epochs_total: 960, total_recording_time_minutes: 480 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk1}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "GET /scoring-tasks/${tk1}", payload: {}, as: LabDirector }
            - { call: "GET /sleep-studies/${st1}", payload: {}, as: LabDirector }
          assert:
            - "After return: task status RETURNED_FOR_REVISION with returned_reason stored; study remains SCORING_IN_PROGRESS"
            - "After resume+resubmit+accept: ScoringTask.${tk1}.status == ACCEPTED and rei == 2.8 (22*60/480 = 2.75 -> 2.8 round_half_up)"
            - "SleepStudy.${st1}.status == SCORED and accepted_rei == 2.8"

      - name: report_addendum_cycle
        grounds:
          - state_machines.InterpretationReport.FINALIZED_to_ADDENDUM_OPEN
          - state_machines.InterpretationReport.ADDENDUM_OPEN_to_FINALIZED
        distinguishing_aspect: |
          InterpretationReport loops FINALIZED -> ADDENDUM_OPEN -> FINALIZED (addendum cycle
