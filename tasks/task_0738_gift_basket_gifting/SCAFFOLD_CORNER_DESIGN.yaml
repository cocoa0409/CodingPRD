        distinguishing_aspect: "A single-object response (POST /corporate-accounts) wraps its payload in the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type == 'object', and the entity under data."
        test_recipe:
          setup: ["No prior state needed."]
          setup_api_calls: []
          trigger:
            - call: "POST /corporate-accounts"
              payload: { name: "Envelope Corp", billing_email: "ap@envelope.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
