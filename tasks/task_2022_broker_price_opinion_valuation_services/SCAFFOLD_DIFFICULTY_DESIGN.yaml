            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_f1}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_f}" }
              as: ClientAdmin
