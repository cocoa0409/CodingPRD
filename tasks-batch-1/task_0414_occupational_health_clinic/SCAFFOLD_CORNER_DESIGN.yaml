  # ===========================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS (optimistic_concurrency /
  # cascading_side_effects / dual_variant_calculation / derived_field_
  # reconciliation / rate_threshold_triggers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_protocol_activate_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[protocol-activate-stale-employer]
          - endpoints["POST /clinic/protocols/{protocolId}/activate"]
          - entities.Employer.fields.version
        distinguishing_aspect: "Activating a protocol with expected_employer_version matching the current Employer.version succeeds (200) and increments Employer.version by 1 (positive OCC path)."
        test_recipe:
          setup:
            - "PROSPECT employer with one DRAFT protocol; emp version observed."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "OccOk Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
              captures: { st: $.data.status }
            - call: "GET /clinic/employers/${emp_id}"
              payload: {}
              as: ClinicAdmin
              captures: { v1: $.data.version }
          assert:
            - "response.status == 200"
            - "Protocol.${p1_id}.status == ACTIVE"
            - "Employer.${emp_id}.version == 2"

      - name: occ_protocol_activate_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[protocol-activate-stale-employer]
          - errors[ERR_STALE_EMPLOYER_VERSION]
        excluded_because:
          difficulty_instance: dual_variant_calc / billable_snapshot_vs_current_protocol_price
          rationale: "The stale-employer-version 412 on protocol activate (rule_id protocol-activate-stale-employer) is exercised within the §1.8 chains that re-read employer.version before each activate; the OCC positive path is covered above and stale-version negative behavior is the canonical rule of §1.2.1."

      - name: occ_invoice_issue_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-issue-stale-employer]
          - errors[ERR_STALE_EMPLOYER_VERSION]
          - endpoints["POST /clinic/invoices/{invoiceId}/issue"]
        distinguishing_aspect: "Issuing an invoice with a stale expected_employer_version (one less than current after a clock-set bumped it) returns 412 ERR_STALE_EMPLOYER_VERSION; the loser observed an outdated employer view."
        test_recipe:
          setup:
            - "Employer ACTIVE; PHYSICAL@9000 completed; DRAFT invoice; emp version observed, then a clock-set bumps employer.version so the observed value is stale by one."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "InvOcc Co", mro_user_id: "mro-1", current_date: "2026-03-15" }
