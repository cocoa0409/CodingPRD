# =============================================================================
# Position Management & Headcount Planning — benchmark seed tables (v1)
# Difficulty band: Expert
# =============================================================================

scenario: |
  382. Position Management & Headcount Planning: position (requisitioned/funded) & FTE,
  org-chart & reporting line, vacancy & backfill, budget/cost-center mapping,
  reclassification & grade, span-of-control, headcount forecast vs actual, freeze/approval

domain_name: position-management
api_prefix: ""        # flat top-level collections (/cost-centers, /positions, /grades, …); no shared URL prefix

# Structural DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # cost-center FTE/dollar budget is a finite pool positions draw against
  secondary_archetype: posture_driven_gating # a CostCenter freeze posture gates all child position/fill operations
  complexity_layers:
    - optimistic_concurrency        # OCC on CostCenter.version and Position.version for supersede-style creates
    - cascading_side_effects        # freeze → positions → requisitions; abolish → incumbent → backfill
    - dual_variant_calculation      # planned (forward-looking, grade-midpoint) vs actual (chronological, incumbent salary)
    - derived_field_reconciliation  # CostCenter committed_cost / committed_fte / filled_fte stay consistent with children

  entity_topology: graph
  # Positions form a self-referential reporting DAG (manager_position_id -> Position.id);
  # CostCenter is a flat parent with FK children (Position, FreezeOrder, ForecastPeriod);
  # Incumbent / Requisition / ReclassRequest reference Position by FK (flat, not nested in URL).

  state_machine_shape: parallel
  # Position carries two independent state dimensions: lifecycle_status (funding) and
  # occupancy_status (vacancy). ReclassRequest is cyclic (revision loop). Requisition is
  # branching with revert.

  relationship_patterns:
    - one_to_many            # CostCenter -> Position; Position -> Incumbent (history)
    - self_referential       # Position.manager_position_id -> Position.id (org chart)
    - cross_aggregate        # Requisition / ReclassRequest reference Position across aggregate boundary

  role_model: approval_chain
  # HRBP requisitions/drafts; CompensationAnalyst reclassifies grades; FinanceController funds & freezes
  # budgets; HRDirector approves reclass/abolish. No single role can do another's exclusive step.

  consistency_model: immediate
  # All derived fields (committed_cost, committed_fte, filled_fte, span_of_control, posture)
  # are reconciled inside the mutating request.

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: email, type: string, source: input, description: "Employee email; unique among Employees" }
      - { name: annual_salary_cents, type: integer, source: input, description: "Negotiated annual base salary in integer cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED — AVAILABLE when not currently occupying any position", default: "AVAILABLE", constraints: "AVAILABLE | ASSIGNED" }

  - name: Grade
    parent: null
    common_fields: false        # immutable compensation-band configuration: only id + created_at
    fields:
      - { name: code, type: string, source: input, description: "Grade code e.g. G07; unique among Grades" }
      - { name: band_min_cents, type: integer, source: input, description: "Band minimum annual salary in cents", constraints: ">= 0" }
      - { name: band_mid_cents, type: integer, source: input, description: "Band midpoint annual salary in cents; used as the planned-cost basis for vacant positions", constraints: ">= band_min_cents" }
      - { name: band_max_cents, type: integer, source: input, description: "Band maximum annual salary in cents", constraints: ">= band_mid_cents" }
      - { name: rank, type: integer, source: input, description: "Ordinal seniority rank; higher = more senior; unique among Grades", constraints: ">= 1" }

  - name: CostCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cost center name" }
      - { name: code, type: string, source: input, description: "Cost center code; unique among CostCenters" }
      - { name: annual_budget_cents, type: integer, source: input, description: "Base annual salary budget allocated to this cost center in cents (before adjustments)", constraints: ">= 0" }
      - { name: adjusted_budget_cents, type: integer, source: computed, description: "= annual_budget_cents + sum(amount_cents) over APPLIED BudgetAdjustments on this cost center; see calc adjusted_budget_cents" }
      - { name: fte_cap, type: number, source: input, description: "Maximum total FTE the cost center may fund across its positions", constraints: ">= 0; max 2 decimals" }
      - { name: committed_fte, type: number, source: computed, description: "Sum of fte over positions whose lifecycle_status IN {FUNDED, FROZEN}; see calc committed_fte" }
      - { name: committed_cost_cents, type: integer, source: computed, description: "Planned+actual blended commitment in cents; see calc committed_cost_cents" }
      - { name: filled_fte, type: number, source: computed, description: "Sum of fte over positions whose occupancy_status = FILLED; see calc filled_fte" }
      - { name: available_budget_cents, type: integer, source: computed, description: "= adjusted_budget_cents - committed_cost_cents; may be negative only via override" }
      - { name: posture, type: enum, source: computed, description: "OPEN | FROZEN — FROZEN whenever an active FreezeOrder covers the current clock instant; see calc cost_center_posture", constraints: "OPEN | FROZEN" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Position
    parent: CostCenter
    common_fields: true
    fields:
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; owning cost center, immutable after creation" }
      - { name: grade_id, type: string, source: input, description: "FK -> Grade.id; current classification grade of the position" }
      - { name: manager_position_id, type: string, source: input, description: "FK -> Position.id; reporting line parent (the position this one reports to); null for the org root", default: null }
      - { name: title, type: string, source: input, description: "Position title" }
      - { name: fte, type: number, source: input, description: "Fractional FTE allocation for this position", constraints: "> 0 and <= 1.0; max 2 decimals" }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT -> REQUISITIONED -> FUNDED -> FROZEN/ABOLISHED — funding dimension", default: "DRAFT", constraints: "DRAFT | REQUISITIONED | FUNDED | FROZEN | ABOLISHED" }
      - { name: occupancy_status, type: enum, source: system, description: "VACANT | FILLED — independent occupancy dimension, evolves separately from lifecycle_status", default: "VACANT", constraints: "VACANT | FILLED" }
      - { name: span_of_control, type: integer, source: computed, description: "Count of Positions whose manager_position_id = this position's id AND lifecycle_status != ABOLISHED; see calc span_of_control" }
      - { name: planned_cost_cents, type: integer, source: computed, description: "Planned annual cost = round(grade.band_mid_cents * fte); per-position rounding pinned; see calc planned_cost_cents" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Actual annual cost from the current incumbent = round(incumbent.annual_salary_cents * fte) when FILLED, else 0; see calc actual_cost_cents" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Incumbent
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the position this incumbency occupies" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the employee occupying the position" }
      - { name: start_date, type: datetime, source: input, description: "Occupancy start date (date-only semantics, treated as inclusive)" }
      - { name: end_date, type: datetime, source: system, description: "Occupancy end date, set on VACATE (inclusive); null while ACTIVE", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VACATED — occupancy record lifecycle", default: "ACTIVE", constraints: "ACTIVE | VACATED" }

  - name: FreezeOrder
    parent: CostCenter
    common_fields: true
    fields:
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; cost center whose posture this order drives" }
      - { name: effective_from, type: datetime, source: input, description: "Freeze window start (inclusive, half-open lower bound)" }
      - { name: effective_to, type: datetime, source: input, description: "Freeze window end (exclusive, half-open upper bound)" }
      - { name: reason, type: string, source: input, description: "Reason for the hiring freeze" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> LIFTED — LIFTED removes the order from posture computation", default: "ACTIVE", constraints: "ACTIVE | LIFTED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Requisition
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the position this requisition seeks to fund or backfill" }
      - { name: req_type, type: enum, source: input, description: "NEW_HIRE | BACKFILL — BACKFILL re-opens a position vacated by an incumbent", constraints: "NEW_HIRE | BACKFILL" }
      - { name: justification, type: string, source: input, description: "Business justification text" }
      - { name: status, type: enum, source: system, description: "OPEN -> APPROVED -> CLOSED, OPEN -> SUSPENDED -> OPEN, OPEN -> CANCELLED", default: "OPEN", constraints: "OPEN | SUSPENDED | APPROVED | CLOSED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ReclassRequest
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; position whose grade this request reclassifies" }
      - { name: target_grade_id, type: string, source: input, description: "FK -> Grade.id; requested new grade" }
      - { name: from_grade_rank, type: integer, source: system, description: "Snapshot of the position's grade rank at submission time" }
      - { name: target_grade_rank, type: integer, source: system, description: "Snapshot of target grade rank at submission time" }
      - { name: direction, type: enum, source: computed, description: "UPGRADE | DOWNGRADE | LATERAL — derived from rank comparison; see calc reclass_direction", constraints: "UPGRADE | DOWNGRADE | LATERAL" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> {APPROVED, REJECTED}; UNDER_REVIEW -> SUBMITTED (revision loop)", default: "SUBMITTED", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ForecastPeriod
    parent: CostCenter
    common_fields: true
    fields:
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; cost center the forecast scopes" }
      - { name: fiscal_label, type: string, source: input, description: "Fiscal period label e.g. FY26-Q1; unique per cost center" }
      - { name: planned_fte, type: number, source: input, description: "Operator-entered planned headcount FTE for the period", constraints: ">= 0; max 2 decimals" }
      - { name: actual_fte, type: number, source: computed, description: "Snapshot of cost center filled_fte captured at snapshot time; see calc forecast_actual_fte" }
      - { name: variance_fte, type: number, source: computed, description: "= actual_fte - planned_fte at snapshot time; see calc forecast_variance_fte" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SNAPSHOTTED — SNAPSHOTTED freezes actual_fte/variance_fte", default: "DRAFT", constraints: "DRAFT | SNAPSHOTTED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: BudgetAdjustment
    parent: CostCenter
    common_fields: false        # append-only budget event: only id + created_at, never mutated after APPLIED
    fields:
      - { name: cost_center_id, type: string, source: input, description: "FK -> CostCenter.id; cost center whose budget this event adjusts" }
      - { name: amount_cents, type: integer, source: input, description: "Signed adjustment in cents: positive grants budget, negative claws back", constraints: "non-zero integer" }
      - { name: memo, type: string, source: input, description: "Reason for the adjustment" }
      - { name: status, type: enum, source: system, description: "APPLIED — created already-applied (append-only event, no lifecycle transitions)", default: "APPLIED", constraints: "APPLIED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # --- Position: lifecycle dimension (funding) ---
  - entity: Position
    initial_state: DRAFT            # lifecycle_status
    terminal_states: [ABOLISHED]
    transitions:
      - from: DRAFT
        to: REQUISITIONED
        trigger: "POST /positions/{positionId}/lifecycle (action=REQUISITION)"
        actor: HRBP
        preconditions:
          - "Position.lifecycle_status == DRAFT"
          - "Owning CostCenter.posture == OPEN (ERR_COST_CENTER_FROZEN)"
        side_effects:
          - "lifecycle_status = REQUISITIONED"
          - "increments Position.version by 1"

      - from: REQUISITIONED
        to: FUNDED
        trigger: "POST /positions/{positionId}/lifecycle (action=FUND)"
        actor: FinanceController
        preconditions:
          - "Position.lifecycle_status == REQUISITIONED"
          - "Owning CostCenter.posture == OPEN (ERR_COST_CENTER_FROZEN)"
          - "CostCenter.committed_fte + Position.fte <= CostCenter.fte_cap (ERR_FTE_CAP_EXCEEDED)"
          - "CostCenter.committed_cost_cents + Position.planned_cost_cents <= CostCenter.annual_budget_cents UNLESS override=true (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "lifecycle_status = FUNDED"
          - "recompute CostCenter.committed_fte (now includes this position)"
          - "recompute CostCenter.committed_cost_cents (adds this position's planned_cost_cents)"
          - "recompute CostCenter.available_budget_cents"
          - "increments Position.version by 1"

      - from: FUNDED
        to: FROZEN
        trigger: "system: CostCenter freeze cascade (POST /cost-centers/{id}/freeze-orders)"
        actor: system
        preconditions:
          - "Position.lifecycle_status == FUNDED"
        side_effects:
          - "lifecycle_status = FROZEN"
          - "each OPEN Requisition on this position -> SUSPENDED (transitive cascade hop 2)"
          - "increments Position.version by 1"
        note: "FROZEN positions keep their committed_fte and committed_cost_cents contribution (the freeze conserves the commitment)."

      - from: FROZEN
        to: FUNDED
        trigger: "system: FreezeOrder lift cascade (POST /freeze-orders/{id}/lift)"
        actor: system
        preconditions:
          - "Position.lifecycle_status == FROZEN"
          - "No other ACTIVE FreezeOrder still covers the clock instant for this CostCenter"
        side_effects:
          - "lifecycle_status = FUNDED"
          - "each SUSPENDED Requisition on this position -> OPEN (compensating un-freeze)"
          - "increments Position.version by 1"

      - from: FUNDED
        to: ABOLISHED
        trigger: "POST /positions/{positionId}/lifecycle (action=ABOLISH)"
        actor: HRDirector
        preconditions:
          - "Position.lifecycle_status == FUNDED"
          - "No Position whose manager_position_id == this id has lifecycle_status != ABOLISHED (ERR_HAS_DIRECT_REPORTS)"
        side_effects:
          - "lifecycle_status = ABOLISHED"
          - "if occupancy_status == FILLED: active Incumbent -> VACATED, occupancy_status = VACANT, occupied Employee.status -> AVAILABLE (transitive cascade hop 2)"
          - "any OPEN or SUSPENDED Requisition on this position -> CANCELLED (transitive cascade hop 2)"
          - "any SUBMITTED or UNDER_REVIEW ReclassRequest on this position -> REJECTED (transitive cascade hop 2)"
          - "recompute CostCenter.committed_fte, committed_cost_cents, filled_fte, available_budget_cents"
          - "increments Position.version by 1"

      - from: REQUISITIONED
        to: ABOLISHED
        trigger: "POST /positions/{positionId}/lifecycle (action=ABOLISH)"
        actor: HRDirector
        preconditions:
          - "Position.lifecycle_status == REQUISITIONED"
          - "No Position whose manager_position_id == this id has lifecycle_status != ABOLISHED (ERR_HAS_DIRECT_REPORTS)"
        side_effects:
          - "lifecycle_status = ABOLISHED"
          - "increments Position.version by 1"

  # --- Position: occupancy dimension (vacancy), evolves independently of lifecycle ---
  - entity: Position
    initial_state: VACANT           # occupancy_status
    terminal_states: []
    transitions:
      - from: VACANT
        to: FILLED
        trigger: "POST /positions/{positionId}/incumbents"
        actor: HRBP
        preconditions:
          - "Position.lifecycle_status == FUNDED (ERR_POSITION_NOT_FUNDED)"
          - "Position.occupancy_status == VACANT (ERR_POSITION_ALREADY_FILLED)"
          - "Owning CostCenter.posture == OPEN (ERR_COST_CENTER_FROZEN)"
          - "Employee.status == AVAILABLE (ERR_EMPLOYEE_UNAVAILABLE)"
          - "Employee.annual_salary_cents BETWEEN grade.band_min_cents AND grade.band_max_cents inclusive (ERR_SALARY_OUT_OF_BAND)"
          - "new Incumbent [start_date, open) does not overlap any ACTIVE/VACATED Incumbent interval on this position (ERR_INCUMBENCY_OVERLAP)"
        side_effects:
          - "create Incumbent status=ACTIVE"
          - "occupancy_status = FILLED"
          - "Employee.status -> ASSIGNED"
          - "recompute Position.actual_cost_cents"
          - "recompute CostCenter.committed_cost_cents (planned basis swapped to actual for this position), filled_fte, available_budget_cents"
          - "increments Position.version by 1"

      - from: FILLED
        to: VACANT
        trigger: "POST /incumbents/{incumbentId}/vacate"
        actor: HRBP
        preconditions:
          - "Position.occupancy_status == FILLED"
          - "Incumbent.status == ACTIVE"
        side_effects:
          - "Incumbent.status -> VACATED, end_date set to request vacate_date"
          - "occupancy_status = VACANT"
          - "Employee.status -> AVAILABLE"
          - "recompute Position.actual_cost_cents (back to 0)"
          - "recompute CostCenter.committed_cost_cents (basis reverts to planned for this position), filled_fte, available_budget_cents"
          - "increments Position.version by 1"
        note: "Fill then vacate conserves CostCenter.committed_cost_cents (compensating invariant: planned basis restored)."

  # --- FreezeOrder ---
  - entity: FreezeOrder
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /freeze-orders/{freezeOrderId}/lift"
        actor: FinanceController
        preconditions:
          - "FreezeOrder.status == ACTIVE"
        side_effects:
          - "status = LIFTED"
          - "recompute owning CostCenter.posture"
          - "if CostCenter.posture flips to OPEN: each FROZEN Position on the cost center -> FUNDED (cascade), which itself re-opens SUSPENDED Requisitions (transitive cascade hop 3)"
          - "increments FreezeOrder.version by 1"

  # --- Requisition (branching with revert) ---
  - entity: Requisition
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "system: position freeze cascade"
        actor: system
        preconditions:
          - "Requisition.status == OPEN"
        side_effects:
          - "status = SUSPENDED"
          - "increments Requisition.version by 1"

      - from: SUSPENDED
        to: OPEN
        trigger: "system: position un-freeze cascade"
        actor: system
        preconditions:
          - "Requisition.status == SUSPENDED"
        side_effects:
          - "status = OPEN"
          - "increments Requisition.version by 1"

      - from: OPEN
        to: APPROVED
        trigger: "POST /requisitions/{requisitionId}/approve"
        actor: FinanceController
        preconditions:
          - "Requisition.status == OPEN"
          - "Owning Position.lifecycle_status == FUNDED (ERR_POSITION_NOT_FUNDED)"
          - "Owning CostCenter.posture == OPEN (ERR_COST_CENTER_FROZEN)"
        side_effects:
          - "status = APPROVED"
          - "increments Requisition.version by 1"

      - from: APPROVED
        to: CLOSED
        trigger: "POST /requisitions/{requisitionId}/close"
        actor: HRBP
        preconditions:
          - "Requisition.status == APPROVED"
          - "Owning Position.occupancy_status == FILLED (ERR_POSITION_NOT_FILLED)"
        side_effects:
          - "status = CLOSED"
          - "increments Requisition.version by 1"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /requisitions/{requisitionId}/cancel"
        actor: HRBP
        preconditions:
          - "Requisition.status == OPEN"
        side_effects:
          - "status = CANCELLED"
          - "increments Requisition.version by 1"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "system: position abolish cascade"
        actor: system
        preconditions:
          - "Requisition.status == SUSPENDED"
        side_effects:
          - "status = CANCELLED"
          - "increments Requisition.version by 1"

  # --- ReclassRequest (cyclic revision loop + branching approve/reject) ---
  - entity: ReclassRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /reclass-requests/{reclassId}/review"
        actor: CompensationAnalyst
        preconditions:
          - "ReclassRequest.status == SUBMITTED"
        side_effects:
          - "status = UNDER_REVIEW"
          - "increments ReclassRequest.version by 1"

      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /reclass-requests/{reclassId}/return"
        actor: CompensationAnalyst
        preconditions:
          - "ReclassRequest.status == UNDER_REVIEW"
        side_effects:
          - "status = SUBMITTED"
          - "increments ReclassRequest.version by 1"
        note: "Revision loop: a request may bounce UNDER_REVIEW -> SUBMITTED any number of times."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reclass-requests/{reclassId}/approve"
        actor: HRDirector
        preconditions:
          - "ReclassRequest.status == UNDER_REVIEW"
          - "Owning Position.lifecycle_status IN {REQUISITIONED, FUNDED} (ERR_INVALID_STATE)"
          - "Owning CostCenter.posture == OPEN (ERR_COST_CENTER_FROZEN)"
          - "If Position FUNDED and direction==UPGRADE: CostCenter.committed_cost_cents - Position.planned_cost_cents + new_planned_cost_cents <= CostCenter.annual_budget_cents UNLESS override=true (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "status = APPROVED"
          - "Position.grade_id = target_grade_id"
          - "recompute Position.planned_cost_cents"
          - "if Position FUNDED: recompute CostCenter.committed_cost_cents, available_budget_cents"
          - "increments ReclassRequest.version by 1"
          - "increments Position.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /reclass-requests/{reclassId}/reject"
        actor: HRDirector
        preconditions:
          - "ReclassRequest.status == UNDER_REVIEW"
        side_effects:
          - "status = REJECTED"
          - "increments ReclassRequest.version by 1"

  # --- ForecastPeriod ---
  - entity: ForecastPeriod
    initial_state: DRAFT
    terminal_states: [SNAPSHOTTED]
    transitions:
      - from: DRAFT
        to: SNAPSHOTTED
        trigger: "POST /forecast-periods/{forecastPeriodId}/snapshot"
        actor: FinanceController
        preconditions:
          - "ForecastPeriod.status == DRAFT"
          - "expected_cost_center_version matches owning CostCenter.version (OCC; ERR_STALE_VERSION)"
        side_effects:
          - "actual_fte = owning CostCenter.filled_fte at snapshot instant"
          - "variance_fte = actual_fte - planned_fte"
          - "status = SNAPSHOTTED"
          - "stamps the CostCenter's headcount baseline: increments CostCenter.version by 1"
          - "increments ForecastPeriod.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC, true-race only)
# =============================================================================
concurrency_rules:
  - rule_id: fund-position-stale-cost-center
    parent_entity: CostCenter
    write_endpoint: "POST /positions/{positionId}/lifecycle"
    occ_field: "expected_cost_center_version"
    description: |
      Funding a Position consumes the owning CostCenter's shared FTE/budget pool.
      If the CostCenter version has advanced since the client last observed it
      (another writer funded a different position, shrinking available_budget_cents
      and committed_fte), the fund request is rejected: the client's view of the
      pool is stale and its budget/cap check was computed against superseded
      figures.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: snapshot-period-stale-cost-center
    parent_entity: CostCenter
    write_endpoint: "POST /forecast-periods/{forecastPeriodId}/snapshot"
    occ_field: "expected_cost_center_version"
    description: |
      Snapshotting a ForecastPeriod freezes the owning CostCenter's filled_fte into
      actual_fte. If the CostCenter version has advanced since the client read it
      (a fill/vacate changed filled_fte), the snapshot is rejected so the period
      cannot capture a figure the client never actually observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: planned_cost_cents
    trigger: "Position creation; FUND; ReclassRequest APPROVE (grade change)"
    algorithm: forward_looking
    formula: |
      planned_cost_cents = round_half_up(grade.band_mid_cents * fte)
      # per-position rounding: each position is rounded to whole cents BEFORE any
      # cost-center aggregation. This is the pinned order (mode b of Rule 2 lives
      # in committed_cost_cents, which sums these already-rounded per-position values).
    input_set: "the position's current grade band_mid_cents and its fte"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: planned_basis
        when: "Position lifecycle_status IN {FUNDED, FROZEN} AND occupancy_status == VACANT"
        difference: "vacant funded positions cost the grade MIDPOINT (forward-looking estimate), not an incumbent salary."

  - name: actual_cost_cents
    trigger: "Incumbent fill; vacate; (recompute on grade change while FILLED)"
    algorithm: chronological
    formula: |
      if occupancy_status == FILLED:
        actual_cost_cents = round_half_up(active_incumbent.employee.annual_salary_cents * fte)
      else:
        actual_cost_cents = 0
    input_set: "the single ACTIVE incumbent's employee.annual_salary_cents and the position fte"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: actual_basis
        when: "Position occupancy_status == FILLED"
        difference: "a FILLED position costs the real incumbent salary (chronological actual), diverging from planned_cost_cents whenever salary != band_mid."

  - name: committed_cost_cents
    trigger: "any Position FUND/ABOLISH/grade-change; any Incumbent fill/vacate on the cost center"
    algorithm: aggregation
    formula: |
      # Mode (b) of Rule 2: per-position rounding is fixed BEFORE summation.
      # For each Position p on this CostCenter with p.lifecycle_status IN {FUNDED, FROZEN}:
      #   contribution(p) = p.actual_cost_cents   if p.occupancy_status == FILLED
      #                   = p.planned_cost_cents   if p.occupancy_status == VACANT
      # committed_cost_cents = sum( contribution(p) )   over those positions
      # Each contribution(p) is ALREADY rounded to whole cents (per planned_cost_cents /
      # actual_cost_cents); the sum is exact integer addition. "Round per position then
      # sum", never "multiply all then round once".
    input_set: "Positions on the cost center with lifecycle_status IN {FUNDED, FROZEN}; DRAFT/REQUISITIONED/ABOLISHED excluded"
    constants: {}
    precision: "integer cents (exact sum of pre-rounded contributions)"

  - name: committed_fte
    trigger: "any Position FUND/ABOLISH/freeze/unfreeze on the cost center"
    algorithm: aggregation
    formula: |
      committed_fte = sum( p.fte ) for Positions p on this CostCenter
                      with p.lifecycle_status IN {FUNDED, FROZEN}
      # rounded to 2 decimals, round_half_up, AFTER summing the raw fte values.
    input_set: "Positions with lifecycle_status IN {FUNDED, FROZEN}"
    constants: {}
    precision: "2 decimals, round_half_up (sum then round)"

  - name: filled_fte
    trigger: "any Incumbent fill/vacate; Position abolish"
    algorithm: aggregation
    formula: |
      filled_fte = sum( p.fte ) for Positions p on this CostCenter
                   with p.occupancy_status == FILLED
      # rounded to 2 decimals, round_half_up, after summing.
    input_set: "Positions with occupancy_status == FILLED"
    constants: {}
    precision: "2 decimals, round_half_up (sum then round)"

  - name: adjusted_budget_cents
    trigger: "CostCenter create; BudgetAdjustment APPLIED"
    algorithm: aggregation
    formula: |
      adjusted_budget_cents = annual_budget_cents
                              + sum( a.amount_cents ) for BudgetAdjustments a
                                on this CostCenter with a.status == APPLIED
      # With no adjustments the sum is 0, so adjusted_budget_cents == annual_budget_cents.
    input_set: "the cost center's annual_budget_cents and all APPLIED BudgetAdjustments"
    constants: {}
    precision: "integer cents (exact sum)"

  - name: available_budget_cents
    trigger: "any change to committed_cost_cents or adjusted_budget_cents"
    algorithm: aggregation
    formula: |
      available_budget_cents = adjusted_budget_cents - committed_cost_cents
      # may be negative ONLY when a FUND or reclass APPROVE used override=true.
    input_set: "the cost center's adjusted_budget_cents and committed_cost_cents"
    constants: {}
    precision: "integer cents"

  - name: fund_admission_check
    trigger: "Position FUND; ReclassRequest APPROVE on a FUNDED position with UPGRADE"
    algorithm: threshold
    formula: |
      # Mode (a) of Rule 2: >=3 inputs with nested min/max and a conditional branch on status.
      headroom_fte    = fte_cap - committed_fte
      headroom_cents  = adjusted_budget_cents - committed_cost_cents
      delta_fte       = position.fte                         # FUND only; 0 for reclass (fte unchanged)
      delta_cost      = position.planned_cost_cents          # FUND
                        OR (new_planned_cost_cents - old_planned_cost_cents)   # reclass UPGRADE
      admit = (delta_fte <= headroom_fte) AND
              ( delta_cost <= headroom_cents OR override == true )
      # boundary: admit when delta == headroom exactly (<=, not <). Equality is ADMITTED.
      if not admit and delta_fte > headroom_fte:  reject ERR_FTE_CAP_EXCEEDED
      if not admit:                               reject ERR_BUDGET_EXCEEDED
    input_set: "cost center fte_cap, committed_fte, adjusted_budget_cents, committed_cost_cents; position fte and planned_cost_cents; override flag"
    constants: {}
    precision: "integer cents and 2-decimal fte"

  - name: span_of_control
    trigger: "Position create; manager_position_id change; subordinate ABOLISH"
    algorithm: aggregation
    formula: |
      span_of_control(P) = count of Positions Q where
        Q.manager_position_id == P.id AND Q.lifecycle_status != ABOLISHED
    input_set: "all non-ABOLISHED positions reporting directly to P"
    constants:
      MAX_SPAN_OF_CONTROL: 8
    precision: "integer count"
    variants:
      - name: span_gate
        when: "creating a Position or repointing manager_position_id to manager M"
        difference: "if M.span_of_control would become > MAX_SPAN_OF_CONTROL (i.e. reaching 9), reject ERR_SPAN_LIMIT_EXCEEDED; reaching exactly 8 is allowed."

  - name: cost_center_posture
    trigger: "FreezeOrder create/lift; clock advance read"
    algorithm: interval_merge
    formula: |
      posture = FROZEN if EXISTS a FreezeOrder F on this CostCenter with
                  F.status == ACTIVE AND
                  F.effective_from <= now < F.effective_to        # half-open [from, to)
                else OPEN
      # half-open semantics: an order with effective_to == now does NOT freeze.
    input_set: "ACTIVE FreezeOrders on the cost center vs the current clock instant"
    constants: {}
    precision: "enum"

  - name: reclass_direction
    trigger: "ReclassRequest creation"
    algorithm: threshold
    formula: |
      if target_grade.rank > current_grade.rank:  direction = UPGRADE
      elif target_grade.rank < current_grade.rank: direction = DOWNGRADE
      else:                                         direction = LATERAL
    input_set: "position's current grade rank vs target grade rank, snapshotted at submission"
    constants: {}
    precision: "enum"

  - name: forecast_actual_fte
    trigger: "ForecastPeriod SNAPSHOT"
    algorithm: aggregation
    formula: |
      actual_fte = owning CostCenter.filled_fte at the snapshot instant
    input_set: "the cost center's filled_fte (sum of fte of FILLED positions)"
    constants: {}
    precision: "2 decimals, round_half_up"

  - name: forecast_variance_fte
    trigger: "ForecastPeriod SNAPSHOT"
    algorithm: aggregation
    formula: |
      variance_fte = actual_fte - planned_fte
      # actual_fte is the chronological/actual headcount; planned_fte is the
      # forward-looking operator estimate. Same metric (FTE), different entity
      # domain (ForecastPeriod) than committed/planned cost on CostCenter.
    input_set: "this period's snapshotted actual_fte and operator-entered planned_fte"
    constants: {}
    precision: "2 decimals, round_half_up"

# =============================================================================
# Response envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognised role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path and FK-referenced resources exist, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, fte in (0,1], integers >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /positions/{positionId}/lifecycle, POST /forecast-periods/{forecastPeriodId}/snapshot"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "Owning CostCenter posture must be OPEN for funding/filling/requisition-approve/reclass-approve operations"
    error_id: ERR_COST_CENTER_FROZEN
    http_status: 409
    applies_to: "POST /positions/{positionId}/lifecycle (REQUISITION,FUND), POST /positions/{positionId}/incumbents, POST /requisitions/{requisitionId}/approve, POST /reclass-requests/{reclassId}/approve"

  - priority: 8
    category: business_constraint
    check: "Span-of-control: a manager position may have at most MAX_SPAN_OF_CONTROL non-ABOLISHED direct reports"
    error_id: ERR_SPAN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /positions, PATCH /positions/{positionId}"

  - priority: 9
    category: business_referential
    check: "A position cannot be ABOLISHED while it has non-ABOLISHED direct reports"
    error_id: ERR_HAS_DIRECT_REPORTS
    http_status: 409
    applies_to: "POST /positions/{positionId}/lifecycle (ABOLISH)"

  - priority: 10
    category: business_constraint
    check: "Fill preconditions: position FUNDED, employee AVAILABLE, salary within grade band, no incumbency interval overlap"
    error_id: "ERR_POSITION_NOT_FUNDED | ERR_EMPLOYEE_UNAVAILABLE | ERR_SALARY_OUT_OF_BAND | ERR_INCUMBENCY_OVERLAP | ERR_POSITION_ALREADY_FILLED"
    http_status: 409
    applies_to: "POST /positions/{positionId}/incumbents"

  - priority: 11
    category: business_temporal
    check: "FreezeOrder window valid: effective_from < effective_to; window does not overlap another ACTIVE FreezeOrder on the same cost center (half-open [from,to); touching at a shared boundary is allowed)"
    error_id: ERR_FREEZE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cost-centers/{costCenterId}/freeze-orders"

  - priority: 12
    category: business_fiscal
    check: "FTE cap: committed_fte + delta_fte <= fte_cap"
    error_id: ERR_FTE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /positions/{positionId}/lifecycle (FUND)"

  - priority: 13
    category: business_fiscal
    check: "Budget: committed_cost_cents + delta_cost <= annual_budget_cents unless override=true"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /positions/{positionId}/lifecycle (FUND), POST /reclass-requests/{reclassId}/approve"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Employee ---
  - method: POST
    path: "/employees"
    description: "Create an Employee"
    roles: [HRBP, HRDirector]
    code: 201
    input: [full_name, email, annual_salary_cents]
    output: Employee
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/employees/{employeeId}"
    description: "Get an Employee"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "List Employees (paginated; filter by status)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  # --- Grade (immutable config) ---
  - method: POST
    path: "/grades"
    description: "Create a Grade band (immutable)"
    roles: [CompensationAnalyst]
    code: 201
    input: [code, band_min_cents, band_mid_cents, band_max_cents, rank]
    output: Grade
    side_effects: []

  - method: GET
    path: "/grades/{gradeId}"
    description: "Get a Grade"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: Grade
    side_effects: []

  - method: GET
    path: "/grades"
    description: "List Grades (paginated)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Grade[]
    side_effects: []

  # --- CostCenter ---
  - method: POST
    path: "/cost-centers"
    description: "Create a CostCenter"
    roles: [FinanceController]
    code: 201
    input: [name, code, annual_budget_cents, fte_cap]
    output: CostCenter
    side_effects: ["committed_fte=0, committed_cost_cents=0, filled_fte=0, adjusted_budget_cents=annual_budget_cents, available_budget_cents=annual_budget_cents, posture=OPEN"]

  - method: GET
    path: "/cost-centers/{costCenterId}"
    description: "Get a CostCenter (with derived budget/posture fields)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: CostCenter
    side_effects: []

  - method: GET
    path: "/cost-centers"
    description: "List CostCenters (paginated)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: CostCenter[]
    side_effects: []

  # --- Position ---
  - method: POST
    path: "/positions"
    description: "Create a Position in DRAFT/VACANT"
    roles: [HRBP]
    code: 201
    input: [cost_center_id, grade_id, title, fte, "manager_position_id?"]
    output: Position
    side_effects: ["lifecycle_status=DRAFT, occupancy_status=VACANT", "recompute manager_position_id target span_of_control if set", "span-of-control gate on manager"]

  - method: GET
    path: "/positions/{positionId}"
    description: "Get a Position (with derived span_of_control, planned/actual cost)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: Position
    side_effects: []

  - method: GET
    path: "/positions"
    description: "List Positions (paginated; filter by cost_center_id, grade_id, manager_position_id, lifecycle_status, occupancy_status)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["cost_center_id?", "grade_id?", "manager_position_id?", "lifecycle_status?", "occupancy_status?", "limit?", "offset?"]
    output: Position[]
    side_effects: []

  - method: PATCH
    path: "/positions/{positionId}"
    description: "Update mutable Position fields (title, fte while DRAFT/REQUISITIONED; manager_position_id repoint)"
    roles: [HRBP]
    code: 200
    input: ["title?", "fte?", "manager_position_id?"]
    output: Position
    side_effects: ["span-of-control gate on new manager", "recompute planned_cost_cents if fte changed and DRAFT/REQUISITIONED", "recompute span_of_control on old+new manager"]

  - method: POST
    path: "/positions/{positionId}/lifecycle"
    description: "Drive Position funding lifecycle (REQUISITION | FUND | ABOLISH)"
    roles: [HRBP, FinanceController, HRDirector]
    code: 200
    input: [action, "override?", "expected_cost_center_version?"]
    output: Position
    side_effects: ["State transition per Position lifecycle machine", "FUND/ABOLISH recompute CostCenter derived fields", "ABOLISH cascade to incumbent/requisition/reclass", "FUND increments CostCenter.version by 1"]

  - method: GET
    path: "/cost-centers/{costCenterId}/positions"
    description: "List Positions under a CostCenter (reverse-reachability for Position.cost_center_id)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["lifecycle_status?", "limit?", "offset?"]
    output: Position[]
    side_effects: []

  - method: GET
    path: "/positions/{positionId}/reports"
    description: "List direct-report Positions (manager_position_id == this id) — reverse-reachability for the self FK"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Position[]
    side_effects: []

  # --- Incumbent ---
  - method: POST
    path: "/positions/{positionId}/incumbents"
    description: "Fill a Position: create an ACTIVE Incumbent, flip occupancy to FILLED"
    roles: [HRBP]
    code: 201
    input: [employee_id, start_date]
    output: Incumbent
    side_effects: ["create Incumbent ACTIVE", "Position.occupancy_status=FILLED", "Employee.status=ASSIGNED", "recompute Position.actual_cost_cents, CostCenter.committed_cost_cents/filled_fte/available_budget_cents", "increments Position.version by 1"]

  - method: GET
    path: "/positions/{positionId}/incumbents"
    description: "List incumbency records for a Position (reverse-reachability for Incumbent.position_id; includes VACATED history)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Incumbent[]
    side_effects: []

  - method: GET
    path: "/incumbents/{incumbentId}"
    description: "Get an Incumbent record"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: Incumbent
    side_effects: []

  - method: GET
    path: "/incumbents"
    description: "List Incumbents (filter by employee_id) — reverse-reachability for Incumbent.employee_id"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["employee_id?", "position_id?", "status?", "limit?", "offset?"]
    output: Incumbent[]
    side_effects: []

  - method: POST
    path: "/incumbents/{incumbentId}/vacate"
    description: "Vacate an active incumbency: VACATED, position back to VACANT"
    roles: [HRBP]
    code: 200
    input: [vacate_date]
    output: Incumbent
    side_effects: ["Incumbent.status=VACATED, end_date set", "Position.occupancy_status=VACANT", "Employee.status=AVAILABLE", "recompute CostCenter derived fields", "increments Position.version by 1"]

  # --- FreezeOrder ---
  - method: POST
    path: "/cost-centers/{costCenterId}/freeze-orders"
    description: "Open a hiring freeze window on a CostCenter; cascades FUNDED positions to FROZEN"
    roles: [FinanceController]
    code: 201
    input: [effective_from, effective_to, reason]
    output: FreezeOrder
    side_effects: ["status=ACTIVE", "recompute CostCenter.posture", "if window covers now: each FUNDED Position -> FROZEN, cascading OPEN Requisitions -> SUSPENDED"]

  - method: GET
    path: "/cost-centers/{costCenterId}/freeze-orders"
    description: "List FreezeOrders on a CostCenter (reverse-reachability for FreezeOrder.cost_center_id)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FreezeOrder[]
    side_effects: []

  - method: GET
    path: "/freeze-orders/{freezeOrderId}"
    description: "Get a FreezeOrder"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: FreezeOrder
    side_effects: []

  - method: GET
    path: "/freeze-orders"
    description: "List FreezeOrders (filter by cost_center_id) — reverse-reachability for FreezeOrder.cost_center_id"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["cost_center_id?", "status?", "limit?", "offset?"]
    output: FreezeOrder[]
    side_effects: []

  - method: POST
    path: "/freeze-orders/{freezeOrderId}/lift"
    description: "Lift a FreezeOrder; may re-open the CostCenter and un-freeze positions/requisitions"
    roles: [FinanceController]
    code: 200
    input: []
    output: FreezeOrder
    side_effects: ["status=LIFTED", "recompute CostCenter.posture", "if posture flips OPEN: FROZEN positions -> FUNDED, SUSPENDED requisitions -> OPEN (cascade)"]

  # --- Requisition ---
