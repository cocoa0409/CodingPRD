    side_effects: ["stock_qty=initial_stock_qty"]

  - method: GET
    path: "/salon-svc/retail-products"
    description: "List retail products; filter by salon_id (reverse-reachability for RetailProduct.salon_id)."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: ["salon_id?", "sku?", "limit?", "offset?"]
    output: "RetailProduct[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/retail-products/{retailProductId}"
    description: "Get a retail product."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: []
    output: RetailProduct
    side_effects: []

  # ---- QueueTicket ---------------------------------------------------------
  - method: POST
    path: "/salon-svc/queue-tickets"
    description: "Walk-in member joins the queue for a service item (salon_id, member_id, service_menu_item_id in body; enters WAITING)."
    roles: [FrontDeskAgent]
    code: 201
    input: [salon_id, member_id, service_menu_item_id]
    output: QueueTicket
    side_effects: ["status=WAITING; joined_at=clock; position recomputed; called_count=0"]

  - method: GET
    path: "/salon-svc/queue-tickets"
    description: "List queue tickets; filter by salon_id, member_id, status (reverse-reachability for QueueTicket.salon_id, .member_id, .service_menu_item_id)."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: ["salon_id?", "member_id?", "service_menu_item_id?", "status?", "limit?", "offset?"]
    output: "QueueTicket[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/queue-tickets/{ticketId}"
    description: "Get a queue ticket; position recomputed on read."
    roles: [SalonManager, FrontDeskAgent, Member]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["recompute position"]

  - method: POST
    path: "/salon-svc/queue-tickets/{ticketId}/call"
    description: "Call the next member up to a chair (WAITING->CALLED)."
    roles: [FrontDeskAgent]
    code: 200
    input: ["allow_skip?"]
    output: QueueTicket
    side_effects: ["status WAITING->CALLED; positions recomputed"]

  - method: POST
    path: "/salon-svc/queue-tickets/{ticketId}/requeue"
    description: "Put a called member back in line keeping their FIFO place (CALLED->WAITING)."
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status CALLED->WAITING; called_count+=1; positions recomputed"]

  - method: POST
    path: "/salon-svc/queue-tickets/{ticketId}/no-show"
    description: "Record a no-show for a called member (CALLED->NO_SHOW)."
    roles: [FrontDeskAgent]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status CALLED->NO_SHOW; member gains strike; member status may escalate"]

  - method: POST
    path: "/salon-svc/queue-tickets/{ticketId}/cancel"
    description: "Cancel a waiting/called ticket."
    roles: [FrontDeskAgent, Member]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status->CANCELLED; positions recomputed"]

  # ---- ServiceVisit --------------------------------------------------------
  - method: POST
    path: "/salon-svc/service-visits"
    description: "Seat a CALLED member: create a ServiceVisit, occupy chair, assign technician (queue_ticket_id, chair_id, technician_id, salon_id in body). OCC-guarded on Salon.version."
    roles: [FrontDeskAgent]
    code: 201
    input: [salon_id, queue_ticket_id, chair_id, technician_id, expected_salon_version, "membership_package_id?"]
    output: ServiceVisit
    side_effects:
      - "ticket CALLED->SEATED; visit IN_SERVICE/UNPAID created; estimate_total_cents computed"
      - "Chair OPEN->OCCUPIED; Technician AVAILABLE->BUSY; Salon.active_occupancy_count+=1; increments Salon.version by 1"

  - method: GET
    path: "/salon-svc/service-visits"
    description: "List service visits; filter by FK (reverse-reachability for ServiceVisit.salon_id, .member_id, .chair_id, .technician_id, .queue_ticket_id, .service_menu_item_id, .membership_package_id)."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: ["salon_id?", "member_id?", "chair_id?", "technician_id?", "queue_ticket_id?", "service_menu_item_id?", "membership_package_id?", "service_status?", "payment_status?", "limit?", "offset?"]
    output: "ServiceVisit[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/service-visits/{visitId}"
    description: "Get a service visit."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: POST
    path: "/salon-svc/service-visits/{visitId}/line-items"
    description: "Add an add-on or retail line to an IN_SERVICE visit."
    roles: [FrontDeskAgent, Technician]
    code: 201
    input: [line_type, item_ref_id, "quantity?"]
    output: VisitLineItem
    side_effects: ["line ACTIVE; unit_price snapshot; estimate_total_cents recomputed; RETAIL decrements RetailProduct.stock_qty"]

  - method: GET
    path: "/salon-svc/service-visits/{visitId}/line-items"
    description: "List line items on a visit (sub-resource reverse-reachability for VisitLineItem.service_visit_id)."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VisitLineItem[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/visit-line-items"
    description: "List visit line items; filter by service_visit_id (filtered-list reverse-reachability for VisitLineItem.service_visit_id)."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: ["service_visit_id?", "status?", "limit?", "offset?"]
    output: "VisitLineItem[]"
    side_effects: []

  - method: GET
    path: "/salon-svc/visit-line-items/{lineId}"
    description: "Get a single visit line item (derives VisitLineItem collection segment)."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
    code: 200
    input: []
    output: VisitLineItem
    side_effects: []

  - method: POST
    path: "/salon-svc/visit-line-items/{lineId}/void"
    description: "Void a single line item on an IN_SERVICE visit (restores retail stock)."
    roles: [FrontDeskAgent, Technician]
    code: 200
    input: []
    output: VisitLineItem
    side_effects: ["line ACTIVE->VOIDED; estimate recomputed; RETAIL line restores RetailProduct.stock_qty"]

  - method: POST
    path: "/salon-svc/service-visits/{visitId}/complete"
    description: "Complete the service (IN_SERVICE->COMPLETED); computes final_total_cents, draws package credit, frees chair+tech."
    roles: [Technician, FrontDeskAgent]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["service_status->COMPLETED; final_total_cents+loyalty_earned computed; chair->SANITIZING; tech->AVAILABLE; occupancy-=1; package credit drawn"]

  - method: POST
    path: "/salon-svc/service-visits/{visitId}/settle"
    description: "Settle payment on a COMPLETED visit (UNPAID->SETTLED); optional loyalty redemption; writes EARN ledger entry."
    roles: [FrontDeskAgent, SalonManager]
    code: 200
    input: ["redeem_points?"]
    output: ServiceVisit
    side_effects: ["payment_status->SETTLED; REDEEM (if any) + EARN ledger entries written; member loyalty_balance recomputed"]

  - method: POST
    path: "/salon-svc/service-visits/{visitId}/void"
    description: "Void a visit (any non-VOIDED service_status); compensates loyalty, retail stock, package credit, frees chair+tech."
    roles: [SalonManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["service_status->VOIDED; lines->VOIDED; package credit restored; loyalty REVERSAL if SETTLED; retail stock restored; chair freed; occupancy-=1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role not recognized" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation, or Member acting on another member's resource" }
  # --- validation / request shape ---
  - { id: ERR_VALIDATION, http: 422, condition: "Request body fails schema (missing required field, wrong type, negative/zero where positive required)" }
  - { id: ERR_INVALID_LINE_QUANTITY, http: 409, condition: "ADDON line quantity != 1, or quantity < 1" }
  - { id: ERR_LINE_TYPE_MISMATCH, http: 409, condition: "line_type does not match the kind of entity item_ref_id points to" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violation: member phone / service code / add-on code / retail sku already exists in salon" }
  # --- not found ---
  - { id: ERR_SALON_NOT_FOUND, http: 404, condition: "Salon id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "QueueTicket id does not exist" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "ServiceVisit id does not exist" }
  - { id: ERR_CHAIR_NOT_FOUND, http: 404, condition: "Chair id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "MembershipPackage id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "VisitLineItem id does not exist" }
  - { id: ERR_SERVICE_ITEM_NOT_FOUND, http: 404, condition: "ServiceMenuItem id does not exist" }
  - { id: ERR_ADDON_NOT_FOUND, http: 404, condition: "AddOn id does not exist" }
  - { id: ERR_RETAIL_NOT_FOUND, http: 404, condition: "RetailProduct id does not exist" }
  # --- state ---
  - { id: ERR_SALON_NOT_OPEN, http: 409, condition: "Operation requires Salon.status==OPEN" }
  - { id: ERR_TICKET_NOT_CALLED, http: 409, condition: "Ticket must be CALLED to seat/no-show" }
  - { id: ERR_VISIT_NOT_IN_SERVICE, http: 409, condition: "Visit must be IN_SERVICE to add/void lines or complete" }
  - { id: ERR_VISIT_NOT_COMPLETED, http: 409, condition: "Settle requires service_status==COMPLETED" }
  - { id: ERR_VISIT_NOT_UNPAID, http: 409, condition: "Settle requires payment_status==UNPAID" }
  - { id: ERR_VISIT_ALREADY_VOIDED, http: 409, condition: "Visit already VOIDED" }
  - { id: ERR_CHAIR_NOT_OPEN, http: 409, condition: "Seating requires Chair.status==OPEN" }
  - { id: ERR_CHAIR_OCCUPIED, http: 409, condition: "Cannot take an OCCUPIED chair out of service" }
  - { id: ERR_TECHNICIAN_NOT_AVAILABLE, http: 409, condition: "Seating requires the chosen Technician.status==AVAILABLE" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Package activate requires Member.status==ACTIVE" }
  - { id: ERR_RECALL_LIMIT_REACHED, http: 409, condition: "Ticket has already been requeued MAX_RECALLS (2) times" }
  # --- safety / compliance ---
  - { id: ERR_LICENSE_LAPSED, http: 403, condition: "Salon license_expiry has passed (clock >= license_expiry)" }
  - { id: ERR_TECH_CERT_EXPIRED, http: 403, condition: "Assigned technician sanitation_cert_expiry has passed" }
  - { id: ERR_MEMBER_BLOCKED, http: 403, condition: "Member SUSPENDED or BANNED cannot join the queue" }
  - { id: ERR_TECH_NOT_CERTIFIED, http: 409, condition: "Technician not certified for a requested add-on requiring certification" }
  # --- constraints ---
  - { id: ERR_CHAIR_NOT_SANITIZED, http: 409, condition: "Chair sanitation window not elapsed at seating (clock < sanitation_ready_at)" }
  - { id: ERR_SANITATION_WINDOW_OPEN, http: 409, condition: "mark-sanitized called before sanitation_ready_at" }
  - { id: ERR_QUEUE_ORDER_VIOLATION, http: 409, condition: "Calling a non-lowest-position WAITING ticket without allow_skip=true" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "RETAIL line quantity exceeds RetailProduct.stock_qty" }
  - { id: ERR_SALON_HAS_ACTIVE_VISITS, http: 409, condition: "Close requires active_occupancy_count==0" }
  # --- fiscal ---
  - { id: ERR_INSUFFICIENT_LOYALTY, http: 402, condition: "redeem_points exceeds Member.loyalty_balance" }
  # --- concurrency ---
  - { id: ERR_STALE_SALON_VERSION, http: 412, condition: "expected_salon_version != current Salon.version on seating/open/close" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalonManager
    description: "Owner/manager: salon lifecycle, licensing, catalog (services/add-ons/retail), chairs, technicians, voids, loyalty adjustments."
    identity: "opaque"
    exclusive_operations:
      - "POST /salon-svc/salons — create salon"
      - "POST /salon-svc/salons/{id}/open, /close — lifecycle"
      - "POST /salon-svc/technicians — register technician"
      - "POST /salon-svc/chairs, /{cid}/take-out-of-service, /{cid}/return-to-service — chair admin"
      - "POST /salon-svc/service-menu-items, /add-ons, /retail-products — catalog"
      - "POST /salon-svc/members/{mid}/loyalty-adjustments — loyalty grant/deduct"
      - "POST /salon-svc/service-visits/{vid}/void — void a visit"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads across salon, chairs, technicians, members, packages, catalog, queue, visits, line-items, loyalty"
      - "POST /salon-svc/chairs/{cid}/mark-sanitized — shared with FrontDeskAgent"
      - "POST /salon-svc/members — shared with FrontDeskAgent"
      - "POST /salon-svc/packages — shared with FrontDeskAgent"
      - "POST /salon-svc/packages/{pid}/cancel — shared with Member"
      - "POST /salon-svc/service-visits/{vid}/settle — shared with FrontDeskAgent"

  - name: FrontDeskAgent
    description: "Floor staff: runs the walk-in queue, seats members, manages line items, completes & settles visits."
    identity: "opaque"
    exclusive_operations:
      - "POST /salon-svc/queue-tickets — join queue"
      - "POST /salon-svc/queue-tickets/{tid}/call, /requeue, /no-show — queue control"
      - "POST /salon-svc/service-visits — seat a member"
    shared_operations:
      - "GET reads (shared with all)"
      - "POST /salon-svc/members — shared with SalonManager"
      - "POST /salon-svc/chairs/{cid}/mark-sanitized — shared with SalonManager"
      - "POST /salon-svc/packages — shared with SalonManager"
      - "POST /salon-svc/packages/{pid}/activate — shared with Member"
      - "POST /salon-svc/queue-tickets/{tid}/cancel — shared with Member"
      - "POST /salon-svc/service-visits/{vid}/line-items, /visit-line-items/{lid}/void — shared with Technician"
      - "POST /salon-svc/service-visits/{vid}/complete — shared with Technician"
      - "POST /salon-svc/service-visits/{vid}/settle — shared with SalonManager"

  - name: Technician
    description: "Performs the service; adds/voids line items and completes visits."
    identity: "entity_backed:Technician"
    exclusive_operations: []
    shared_operations:
      - "GET reads (shared with all)"
      - "POST /salon-svc/service-visits/{vid}/line-items, /visit-line-items/{lid}/void — shared with FrontDeskAgent"
      - "POST /salon-svc/service-visits/{vid}/complete — shared with FrontDeskAgent"

  - name: Member
    description: "Walk-in customer acting on own packages, own queue tickets, own loyalty reads."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET reads of own member, own packages, own queue tickets, own loyalty entries (and public catalog/salon)"
      - "POST /salon-svc/packages/{pid}/activate — shared with FrontDeskAgent (own package)"
      - "POST /salon-svc/packages/{pid}/cancel — shared with SalonManager (own package)"
      - "POST /salon-svc/queue-tickets/{tid}/cancel — shared with FrontDeskAgent (own ticket)"
