      - name: statement_review_and_qc_completion_are_not_repeatable
        claim_type: idempotency
        grounds:
          - validations[priority 21]
          - validations[priority 22]
          - state_machines.FinancialStatement.terminal_states
          - state_machines.QualityControlReview.terminal_states
        distinguishing_aspect: |
          Neither one-shot transition is idempotent: a second review of the
          same statement is ERR_STATEMENT_NOT_REVIEWABLE (even when the second
          decision differs from the first) and a second completion of the same
          QC review is ERR_QC_REVIEW_NOT_OPEN — and crucially the first
          outcome is preserved, so the retry cannot silently overwrite
          reviewed_by_user_id, outcome or completed_at.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Seller ${s1} with statement ${fs1} already ACCEPTED by u-ca-1 and QC review ${q1} already COMPLETED by u-qc-1 with findings 2 / critical 0"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
          trigger:
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "REJECT", review_note: "second thoughts" }
