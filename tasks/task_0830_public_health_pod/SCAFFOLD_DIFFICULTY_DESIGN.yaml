          assert:
            - "confirm2_error == 'ERR_SHIFT_OVERLAP'  ([12:00,20:00) overlaps [08:00,16:00) for the same staff_member_id)"

      - name: pod_capacity_exceeded_on_third_overlapping_confirm
        grounds:
          - validations[priority=10]
          - errors[ERR_POD_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the POD resource — distinct
          from the pairwise semantics above: a THIRD confirm whose interval
          overlaps two already-CONFIRMED assignments at the same POD is rejected
          once the overlapping count would exceed staffing_capacity_lanes,
          regardless of pairwise overlap with any single other assignment.
        test_recipe:
          setup:
            - "POD staffing_capacity_lanes=2"
            - "Two different verified StaffMembers, each CONFIRMED on [2026-03-06T08:00:00Z, 2026-03-06T16:00:00Z) at this POD (fills capacity to 2)"
            - "A third verified StaffMember with an overlapping [2026-03-06T08:00:00Z, 2026-03-06T16:00:00Z) ShiftAssignment"
          setup_api_calls:
            - call: "POST /hazard-plans"
