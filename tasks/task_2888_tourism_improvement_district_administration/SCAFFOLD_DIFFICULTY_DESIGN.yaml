            - "both drives snapshot required_headcount_pct == 0.0000, so the 1-of-3 headcount of 0.3333 binds on neither"

      - name: public_meeting_separation_of_exactly_ten_days_is_accepted_and_nine_is_not
        grounds:
          - validations.ERR_MEETING_SEPARATION_VIOLATION
          - entities.TransparencyRecord.fields.scheduled_for
          - endpoints.POST_/transparency-records
        distinguishing_aspect: |
          The separation rule is inclusive at exactly MIN_MEETING_SEPARATION_DAYS. A meeting on
          2026-09-20, exactly 10 days after 2026-09-10, is accepted; 2026-09-29, only 9 days after the
          second, is refused; 2026-09-30, exactly 10 days after the second, is accepted again. The
          triple pins the inclusive edge from both sides rather than merely asserting that some gap is
          too small.
        test_recipe:
          setup:
            - "district ACTIVE so transparency records may be scheduled"
            - "one PUBLIC_MEETING already scheduled for 2026-09-10 with required_by 2026-12-31"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "PUBLIC_MEETING", fiscal_year: 2027, scheduled_for: "2026-09-10T00:00:00Z", required_by: "2026-12-31T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { tr1_id: "$.data.id" }
          trigger:
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "PUBLIC_MEETING", fiscal_year: 2027, scheduled_for: "2026-09-20T00:00:00Z", required_by: "2026-12-31T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { tr2_id: "$.data.id" }
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "PUBLIC_MEETING", fiscal_year: 2027, scheduled_for: "2026-09-29T00:00:00Z", required_by: "2026-12-31T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /transparency-records"
              payload: { district_id: "${d_id}", record_type: "PUBLIC_MEETING", fiscal_year: 2027, scheduled_for: "2026-09-30T00:00:00Z", required_by: "2026-12-31T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { tr4_id: "$.data.id" }
          assert:
            - "the 2026-09-20 record is created with HTTP 201 and TransparencyRecord.${tr2_id}.status == SCHEDULED, a separation of exactly 10 days being accepted"
            - "the 2026-09-29 record is refused with ERR_MEETING_SEPARATION_VIOLATION and HTTP 409"
            - "the 2026-09-30 record is created with HTTP 201 and TransparencyRecord.${tr4_id}.status == SCHEDULED"
            - "GET /districts/${d_id}/transparency-records with record_type PUBLIC_MEETING returns exactly 3 rows"
            - "an ANNUAL_REPORT scheduled for 2026-09-29 would be unaffected, because the separation rule compares PUBLIC_MEETING rows only"

      - name: program_efficiency_tier_edges_at_1500_and_the_zero_verified_night_null_path
        grounds:
          - calculations.program_performance
          - entities.MarketingProgram.fields.efficiency_tier
          - entities.MarketingProgram.fields.performance_flag
          - endpoints.POST_/marketing-programs/{id}/closure
        distinguishing_aspect: |
          Three programs close in the same plan. One lands on a gross cost of exactly 1500, the
          inclusive top of TIER_EFFICIENT; one lands on 1501 and must fall to TIER_STANDARD; and one
          closes with zero VERIFIED nights, where the two cost-per-night fields must be null rather
