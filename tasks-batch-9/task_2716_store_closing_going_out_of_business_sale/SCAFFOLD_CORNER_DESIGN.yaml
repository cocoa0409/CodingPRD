              captures: { lic_b: $.data.id }
            - call: "POST /gob-licenses/${lic_b}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /stores/${st_c}/gob-licenses"
              payload: { license_number: "NY-GOB-8003C", period_start_date: "2026-09-15", period_end_date: "2026-10-14", advertising_claim_codes: ["EVERYTHING_MUST_GO"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_c: $.data.id }
            - call: "POST /gob-licenses/${lic_c}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /stores/${st_d}/gob-licenses"
              payload: { license_number: "NY-GOB-8003D", period_start_date: "2026-09-15", period_end_date: "2026-10-14", advertising_claim_codes: ["EVERYTHING_MUST_GO"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_d: $.data.id }
            - call: "POST /gob-licenses/${lic_d}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "GET /stores/${st_d}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st_d_v: $.data.version }
            - call: "POST /stores/${st_d}/markdown-stages"
              payload: { stage_index: 1, discount_pct: 0.2000, sell_through_target_pct: 0.2500, window_start_date: "2026-09-16", window_end_date: "2026-10-01", expected_store_version: "${st_d_v}" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { stg_d: $.data.id }
          trigger:
            - call: "POST /gob-licenses/${lic_a}/revoke"
              payload: { revoked_reason: "no licence displayed at store A" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /engagements/${eng}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eng_after_1: $.data.compliance_posture }
            - call: "POST /gob-licenses/${lic_b}/revoke"
              payload: { revoked_reason: "prohibited signage at store B" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /engagements/${eng}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eng_after_2: $.data.compliance_posture }
            - call: "POST /markdown-stages/${stg_d}/activate"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /gob-licenses/${lic_c}/revoke"
              payload: { revoked_reason: "false price comparison at store C" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /engagements/${eng}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { eng_after_3: $.data.compliance_posture }
            - call: "POST /stores/${st_d}/augmentation-consignments"
              payload: { supplier_name: "Northgate Supply", category: "APPAREL", units_supplied: 50, unit_cost_cents: 2000, unit_retail_cents: 5000, delivery_window_start_date: "2026-09-16", delivery_window_end_date: "2026-09-20" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { e_frozen_cons: $.data.error_id }
            - call: "POST /engagements/${eng}/expense-items"
              payload: { store_id: "${st_d}", expense_category: "SECURITY", amount_cents: 50000, incurred_date: "2026-09-15" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { e_frozen_exp: $.data.error_id }
            - call: "POST /stores/${st_a}/resume"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_resume: $.data.error_id }
          assert:
            - "after the first revoke compliance_strike_count == 1 and ${eng_after_1} == RESTRICTED — RESTRICTED_AT is inclusive at 1"
            - "after the second revoke compliance_strike_count == 2 and ${eng_after_2} == RESTRICTED, one short of FROZEN_AT"
            - "the stage activation between the second and third strike returns HTTP 200 — priority 46 permits activation while RESTRICTED"
            - "after the third revoke compliance_strike_count == 3 and ${eng_after_3} == FROZEN — FROZEN_AT is inclusive at 3"
            - "the consignment create and the expense-item create then both return HTTP 409 with data.error_id == ERR_ENGAGEMENT_COMPLIANCE_FROZEN"
            - "the attempt to resume store A returns HTTP 409 with data.error_id == ERR_LICENSE_NOT_ACTIVE and compliance_strike_count stays 3 — the counter never decreases"
            - "stores A, B and C are SUSPENDED with suspension_reason == LICENSE_REVOKED while store D is still SELLING"

      - name: cascade_chain_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: "Multi-hop chains from a single trigger through store, cadence, employees, lease and engagement roll-up."
        excluded_because:
          difficulty_instance: close_selling_six_hop_chain_from_store_to_engagement_expense_split
          rationale: "§1.8 transitive_cascade already walks both declared chains hop by hop (close-selling six hops, licence revocation five hops), including the ordering sensitivity this row asks for."

      - name: both_recovery_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: "Projected and realized recovery variants over the same store, and the provisional/final settlement basis pair."
        excluded_because:
          difficulty_instance: store_recovery_projected_vs_realized_diverge_on_one_store
          rationale: "§1.8 dual_variant_calc covers both declared variant pairs with their divergence deltas, so a §1.9 restatement would add no new signal."

  # ===========================================================================
  # consistency_model: immediate
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /sales-days/{id}/review]
          - endpoints[GET /engagements/{id}/recovery-summary]
        distinguishing_aspect: "A single POST review response already carries the allocation result, and the store, lot, engagement and recovery-summary reads that follow it in the same test — with no intervening write, sweep or clock move — agree with it exactly, so nothing about the roll-up lags behind the request that produced it."
        test_recipe:
          setup:
            - "MIN chain to a SELLING NY store holding 1,000 APPAREL units at 2,000 cost / 5,000 retail, with one PENDING_REVIEW day of 40 units for 120,000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, augmentation_prohibited: false, prohibited_claim_codes: [], advertising_disclosure_required: false, surrender_notice_days: 10 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "FEE_BASED", guaranty_pct: 0, hybrid_retailer_excess_pct: 0, expense_responsibility: "LIQUIDATOR", shared_expense_liquidator_pct: 0, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-9001", address_line: "S-9001 Liquidation Row" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "APPAREL", source: "ORIGINAL", units_initial: 1000, unit_cost_cents: 2000, unit_retail_cents: 5000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/submit-for-approval"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /stores/${st}/gob-licenses"
              payload: { license_number: "NY-GOB-9001", period_start_date: "2026-09-15", period_end_date: "2026-10-14", advertising_claim_codes: ["EVERYTHING_MUST_GO"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic: $.data.id }
            - call: "POST /gob-licenses/${lic}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /stores/${st}/sales-days"
              payload: { business_date: "2026-09-15", original_net_sales_cents: 120000, augmentation_net_sales_cents: 0, original_units_sold: 40, augmentation_units_sold: 0 }
              as: StoreManager
              as_user_id: "${st}"
              captures: { sd: $.data.id }
            - call: "GET /stores/${st}/inventory-lots"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { lot: "$.data[0].id" }
          trigger:
            - call: "POST /sales-days/${sd}/review"
              payload: { decision: "POST" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "GET /inventory-lots/${lot}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "GET /stores/${st}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "GET /engagements/${eng}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "GET /engagements/${eng}/recovery-summary"
              payload: {}
              as: RetailerController
              as_user_id: "rc-1"
          assert:
            - "the review response itself is HTTP 200 with day_status == POSTED, posted_at equal to the logical clock instant and reviewed_by_user_id == rc-1"
            - "the lot read shows units_sold == 40 and units_on_hand == 960 with lot_status still ON_FLOOR"
            - "the store read shows realized_gross_recovery_cents == 120000, realized_recovery_ratio == 0.0600 and realized_sell_through_pct == 0.0400"
            - "the engagement read shows realized_gross_recovery_cents == 120000 in the same test with no re-read delay"
            - "the recovery-summary read agrees: realized_gross_recovery_cents == 120000, realized_recovery_ratio == 0.0600, original_cost_value_cents == 2000000 and store_count == 1"
