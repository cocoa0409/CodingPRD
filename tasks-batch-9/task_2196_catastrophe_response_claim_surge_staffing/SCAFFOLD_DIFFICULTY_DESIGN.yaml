  - rule_id: cross_entity_state_dependency
    instances:
      - name: deployment_confirm_gated_by_adjuster_resting_axis
        grounds:
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
          - state_machines.Adjuster.DEPLOYED_to_RESTING
          - state_machines.Adjuster.RESTING_to_AVAILABLE
          - errors[ERR_ADJUSTER_NOT_AVAILABLE]
        distinguishing_aspect: |
          Entity pair Deployment -> Adjuster. The Deployment row is untouched and legal on its own terms
          (REQUESTED, no window conflict, DESK role so no housing involvement); the transition is blocked
          purely because the OTHER entity sits in RESTING. The very same call succeeds once the Adjuster's
          time-driven RESTING -> AVAILABLE edge fires at exactly last_demobilized_at_utc + 12h, which proves
          the gate is the parent's state and not any property of the Deployment.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z."
            - "One CatastropheEvent 'CAT-2026-701' in DECLARED: HAIL, TX, posture OPEN."
