      - name: shift_two_state_axes_move_independently
        claim_type: Parallel Shape
        excluded_because:
          difficulty_instance: shift_staffing_and_evv_axes_advance_independently
          rationale: >-
            That §1.8 instance already walks staffing_status and evv_status through the full
            OPEN -> ASSIGNED -> COMPLETED and NOT_STARTED -> CLOCKED_IN -> VERIFIED pair on one shift
            and asserts the combined state after each hop, which is exactly the parallel-shape claim.
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[Shift]

      - name: timesheet_rejection_rework_loop_repeats
        claim_type: Cyclic Shape
        excluded_because:
          difficulty_instance: timesheet_bill_rejected_edit_resubmit_cycle_repeats_twice
          rationale: >-
            The BILL_REJECTED -> EDITED -> SUBMITTED loop is driven twice there, including the
            edit_codes and net_billable_units recomputation on each pass, so a second cyclic-shape
            instance would only restate it.
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[Timesheet]

