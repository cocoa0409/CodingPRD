  - name: order_derived_totals_reconcile_after_an_add_and_a_void
    claim_type: derived_field_reconciliation
    grounds:
    - entities.Order.fields.line_subtotal_cents
    - entities.Order.fields.chargeable_weight_kg
    - calculations.order_line_extended_price
    - calculations.order_total_assembly
    - state_machines.Order.billing_status.QUOTED_to_UNQUOTED
