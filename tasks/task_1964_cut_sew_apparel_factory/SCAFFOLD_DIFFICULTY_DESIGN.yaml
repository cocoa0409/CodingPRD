# =============================================================================
# Task 1964 — Cut-&-Sew Apparel Factory — §1.8 Scaffold Difficulty Design
# (Test Targeting Index: 9 Difficulty Rules x >=2 instances = 20 instances)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: piece_rate_straight_vs_guaranteed_minimum
        grounds:
          - calculations.piece_rate_earnings
          - calculations.payroll_run_totals
          - calculations.operator_efficiency
        distinguishing_aspect: |
          Payroll/operator domain: the straight-piece variant (qty x rate, basis of
          total_piece_cents) and the guaranteed-minimum variant (per operator-day floor)
          produce different pay for identical logged work: piece 1200 vs payable 2560.
        test_recipe:
          setup:
            - "Approved 1-op pack (op1: sam 54s, rate 12c); order 100xM planned/cut; bundle 100 released"
            - "Operator with a 100-minute LineAssignment on 2026-08-03; 100 pieces logged+verified on 2026-08-03"
            - "OPEN PayrollRun 2026-08-01..2026-08-31 (version 1)"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-PR1", base_size: "M", size_run: ["S","M","L"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [{ point: "chest", per_step_increment_in: 0.4 }], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join sides", machine_type: "OVERLOCK", sam_seconds: 54, piece_rate_cents: 12 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 100 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 100 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 100 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk}", as: Any, captures: { b1: "$.data[0].id" } }
            - { call: "POST /bundles/${b1}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "Ann" }, as: LineSupervisor, captures: { opr: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 100 }, as: LineSupervisor }
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b1}", operation_spec_id: "${op1}", work_date: "2026-08-03", qty: 100 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe: $.data.id } }
            - { call: "POST /piece-work-entries/${pe}/review", payload: { decision: "VERIFY" }, as: LineSupervisor }
            - { call: "POST /payroll-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollClerk, as_user_id: u-pc1, captures: { pr: $.data.id, pr_v: $.data.version } }
          trigger:
            - { call: "POST /payroll-runs/${pr}/calculate", payload: { expected_payroll_run_version: "${pr_v}" }, as: PayrollClerk, as_user_id: u-pc1 }
          assert:
            - "PayrollRun.${pr}.total_piece_cents == 1200 (straight variant: 100 x 12)"
            - "PayrollRun.${pr}.total_topup_cents == 1300 (guarantee floor 2500 = 100min x 1500c/60 minus piece 1200)"
            - "PayrollRun.${pr}.total_bonus_cents == 60 (efficiency 90.0 -> 5% tier; 5% of 1200)"
            - "PayrollRun.${pr}.total_payable_cents == 2560"
            - "PieceWorkEntry.${pe}.piece_earnings_cents == 1200 and PieceWorkEntry.${pe}.payable_cents == 2560 — two variants, same logged work, different money"

      - name: domestic_content_cost_basis_vs_unit_basis
        grounds:
          - calculations.domestic_content_determination
          - entities.Style.fields.domestic_content_pct_cost
          - entities.Style.fields.domestic_component_ratio
        distinguishing_aspect: |
          Compliance/style domain: cost-weighted basis (0.8675 >= 0.70) qualifies where the
          unweighted unit basis (0.6667 < 1.0) does not — the two variants yield different
          qualification verdicts for one BOM (cheap US button + expensive CN zipper).
        test_recipe:
          setup:
            - "Style ST-CC1 (declared_fabric_domestic=true, target NONE); trims: BTN-US 10c US, ZIP-CN 200c CN"
            - "Pack v1 (labor 800c, fabric 500c) with 1 op and requirements BTN-US x1 w0, ZIP-CN x1 w0; APPROVED"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-CC1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /trim-items", payload: { sku_code: "BTN-US", description: "button", origin_country: "US", unit_cost_cents: 10 }, as: MaterialsPlanner, captures: { tiA: $.data.id } }
            - { call: "POST /trim-items", payload: { sku_code: "ZIP-CN", description: "zipper", origin_country: "CN", unit_cost_cents: 200 }, as: MaterialsPlanner, captures: { tiB: $.data.id } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /trim-requirements", payload: { tech_pack_id: "${tp}", trim_item_id: "${tiA}", units_per_garment: 1, wastage_pct: 0 }, as: Merchandiser }
            - { call: "POST /trim-requirements", payload: { tech_pack_id: "${tp}", trim_item_id: "${tiB}", units_per_garment: 1, wastage_pct: 0 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
          trigger:
            - { call: "GET /styles/${st}", as: Any }
            - { call: "POST /styles/${st}/certify-content-claim", payload: {}, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "Style.${st}.domestic_content_pct_cost == 0.8675 (1310/1510)"
            - "Style.${st}.domestic_component_ratio == 0.6667 (2/3)"
            - "Style.${st}.content_qualification == QUALIFIED_COST_ONLY — cost basis passes 0.70, unit basis below 1.0 blocks STRICT"
            - "certify rejected: err == ERR_NOT_CERTIFIABLE"

      - name: marker_utilization_gross_vs_net
        grounds:
          - calculations.marker_allocation_and_utilization
          - entities.Marker.fields.utilization_gross_pct
          - entities.Marker.fields.utilization_net_pct
        distinguishing_aspect: |
          Fabric domain: same marker, two valid denominators — gross (allocated incl. splice
          allowance) 96.9% vs net (excl. 0.5yd splice) 98.0%; both fields stored, numerically distinct.
        test_recipe:
          setup:
            - "Order exists (no pack needed for marker approval); roll 41.3yd AVAILABLE (version 2 after QC PASS)"
            - "Marker DRAFT: length 40.0yd, planned_pieces 100"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-MU1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 100 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 100 }, as: CuttingManager, captures: { mk: $.data.id } }
          trigger:
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
          assert:
            - "Marker.${mk}.allocated_yards == 41.3 (40.0 x 1.02 + 0.5 splice)"
            - "Marker.${mk}.utilization_gross_pct == 96.9 (40.0/41.3)"
            - "Marker.${mk}.utilization_net_pct == 98.0 (40.0/40.8)"
            - "utilization_gross_pct != utilization_net_pct for identical inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: aql_sample_plan_tiered_lookup
        grounds:
          - calculations.aql_sample_plan
        distinguishing_aspect: |
          Mode (a): >=3 inputs (lot_size, inspection_level, aql_level) with tiered code-letter
          selection and a TIGHTENED one-letter bump; lot 150 -> F/20/1/2 while 151 -> G/32/2/3,
          and 150 TIGHTENED -> G/32/2/3.
        test_recipe:
          setup:
            - "One approved 1-op pack; three planned/cut orders with totals 150, 151, 150 and one COMPLETED bundle each"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-AQ1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "Ann" }, as: LineSupervisor, captures: { opr: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "c1", size_quantities: [{ size: "M", qty: 150 }] }, as: ProductionPlanner, captures: { po1: $.data.id } }
            - { call: "POST /production-orders/${po1}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr1: $.data.id } }
            - { call: "POST /fabric-rolls/${fr1}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr1_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po1}", fabric_roll_id: "${fr1}", marker_length_yards: 40.0, planned_pieces: 150 }, as: CuttingManager, captures: { mk1: $.data.id } }
            - { call: "POST /markers/${mk1}/approve", payload: { expected_fabric_roll_version: "${fr1_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po1}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk1}/cut", payload: { size_quantities: [{ size: "M", qty: 150 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk1}", as: Any, captures: { b1: "$.data[0].id" } }
            - { call: "POST /bundles/${b1}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po1}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 150 }, as: LineSupervisor }
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b1}", operation_spec_id: "${op1}", work_date: "2026-08-03", qty: 150 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe1: $.data.id } }
            - { call: "POST /piece-work-entries/${pe1}/review", payload: { decision: "VERIFY" }, as: LineSupervisor }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "c2", size_quantities: [{ size: "M", qty: 151 }] }, as: ProductionPlanner, captures: { po2: $.data.id } }
            - { call: "POST /production-orders/${po2}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R2", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr2: $.data.id } }
            - { call: "POST /fabric-rolls/${fr2}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr2_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po2}", fabric_roll_id: "${fr2}", marker_length_yards: 40.0, planned_pieces: 151 }, as: CuttingManager, captures: { mk2: $.data.id } }
            - { call: "POST /markers/${mk2}/approve", payload: { expected_fabric_roll_version: "${fr2_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po2}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk2}/cut", payload: { size_quantities: [{ size: "M", qty: 151 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk2}", as: Any, captures: { b2: "$.data[0].id" } }
            - { call: "POST /bundles/${b2}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po2}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-04", start_minute: 480, end_minute: 580, assigned_pieces: 151 }, as: LineSupervisor }
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b2}", operation_spec_id: "${op1}", work_date: "2026-08-04", qty: 151 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe2: $.data.id } }
            - { call: "POST /piece-work-entries/${pe2}/review", payload: { decision: "VERIFY" }, as: LineSupervisor }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "c3", size_quantities: [{ size: "M", qty: 150 }] }, as: ProductionPlanner, captures: { po3: $.data.id } }
            - { call: "POST /production-orders/${po3}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R3", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr3: $.data.id } }
            - { call: "POST /fabric-rolls/${fr3}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr3_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po3}", fabric_roll_id: "${fr3}", marker_length_yards: 40.0, planned_pieces: 150 }, as: CuttingManager, captures: { mk3: $.data.id } }
            - { call: "POST /markers/${mk3}/approve", payload: { expected_fabric_roll_version: "${fr3_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po3}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk3}/cut", payload: { size_quantities: [{ size: "M", qty: 150 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk3}", as: Any, captures: { b3: "$.data[0].id" } }
            - { call: "POST /bundles/${b3}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po3}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-05", start_minute: 480, end_minute: 580, assigned_pieces: 150 }, as: LineSupervisor }
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b3}", operation_spec_id: "${op1}", work_date: "2026-08-05", qty: 150 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe3: $.data.id } }
            - { call: "POST /piece-work-entries/${pe3}/review", payload: { decision: "VERIFY" }, as: LineSupervisor }
          trigger:
            - { call: "POST /quality-audits", payload: { production_order_id: "${po1}", inspection_level: "NORMAL", aql_level: "AQL_2_5" }, as: QualityInspector, as_user_id: u-qi1, captures: { qa1: $.data.id } }
            - { call: "POST /quality-audits", payload: { production_order_id: "${po2}", inspection_level: "NORMAL", aql_level: "AQL_2_5" }, as: QualityInspector, as_user_id: u-qi1, captures: { qa2: $.data.id } }
            - { call: "POST /quality-audits", payload: { production_order_id: "${po3}", inspection_level: "TIGHTENED", aql_level: "AQL_2_5" }, as: QualityInspector, as_user_id: u-qi1, captures: { qa3: $.data.id } }
          assert:
            - "QualityAudit.${qa1}: lot_size == 150, code_letter == F, sample_size == 20, accept_max == 1, reject_min == 2"
            - "QualityAudit.${qa2}: lot_size == 151, code_letter == G, sample_size == 32, accept_max == 2, reject_min == 3"
            - "QualityAudit.${qa3}: lot_size == 150 but TIGHTENED bumps F->G: code_letter == G, sample_size == 32, accept_max == 2, reject_min == 3"

      - name: trim_grossing_per_line_ceiling_then_sum
        grounds:
          - calculations.trim_grossing
        distinguishing_aspect: |
          Mode (b): nested rounding order — per-line ceil THEN sum (9 + 5 = 14) beats the
          alternative sum-then-ceil (exact 8.04 + 4.02 = 12.06 -> 13); the scaffold pins
          per-line ceiling and 14 units are actually reserved.
        test_recipe:
          setup:
            - "Trims TI1/TI2 stocked exactly 9 and 5; pack with req1 (TI1, 2/garment, w 0.34) and req2 (TI2, 1/garment, w 0.34), APPROVED"
            - "Order total 3 (3xM)"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-TG1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /trim-items", payload: { sku_code: "TI1", description: "button", origin_country: "US", unit_cost_cents: 10 }, as: MaterialsPlanner, captures: { ti1: $.data.id } }
            - { call: "POST /trim-items/${ti1}/receive", payload: { qty: 9 }, as: MaterialsPlanner }
            - { call: "POST /trim-items", payload: { sku_code: "TI2", description: "label", origin_country: "US", unit_cost_cents: 5 }, as: MaterialsPlanner, captures: { ti2: $.data.id } }
            - { call: "POST /trim-items/${ti2}/receive", payload: { qty: 5 }, as: MaterialsPlanner }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /trim-requirements", payload: { tech_pack_id: "${tp}", trim_item_id: "${ti1}", units_per_garment: 2, wastage_pct: 0.34 }, as: Merchandiser }
            - { call: "POST /trim-requirements", payload: { tech_pack_id: "${tp}", trim_item_id: "${ti2}", units_per_garment: 1, wastage_pct: 0.34 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 3 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
          trigger:
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
          assert:
            - "TrimItem.${ti1}.qty_reserved == 9 (ceil(3 x 2 x 1.34) = ceil(8.04))"
            - "TrimItem.${ti2}.qty_reserved == 5 (ceil(3 x 1 x 1.34) = ceil(4.02))"
            - "reserved total == 14; sum-then-ceil would reserve 13 — pinned per-line-ceiling order wins"
            - "ProductionOrder.${po}.trim_hold_status == MATERIALS_OK and trim_shortages == [] (stock exactly covers)"

      - name: payroll_totals_pinned_evaluation_order
        grounds:
          - calculations.payroll_run_totals
          - calculations.operator_efficiency
        distinguishing_aspect: |
          Mode (c): circular-looking chain pinned by evaluation order — bonus tier is read from
          an efficiency that INCLUDES this run's swept VERIFIED entries (90.0 -> 5% -> 60),
          while the bonus itself never feeds back into efficiency; a different order yields 0.
        test_recipe:
          setup:
            - "Same shape as piece_rate_straight_vs_guaranteed_minimum: one VERIFIED entry (qty 100, rate 12c, sam 54s) on 2026-08-03; operator assignment 100 min that date; OPEN run v1"
          setup_api_calls:
