        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=19]", "calculations.subscriber_basis_determination"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_true_up_guarded_on_subscriber_report_adjustment_state
          rationale: "The successful true-up once a finding is SUBSTANTIATED, and its refusal before, are asserted there."

