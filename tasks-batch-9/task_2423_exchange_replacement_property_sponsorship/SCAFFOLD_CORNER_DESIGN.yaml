# =====================================================================
# §1.9 CORNER DESIGN - breadth probe for task 2423
# Exchange Replacement Property Sponsorship (Delaware statutory trust)
# One block per claim-extraction-guide section; instances already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because
# stubs that name the covering §1.8 instance.
# =====================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: property_creation_returns_declared_fields
    claim_type: creation
    grounds:
    - entities.Property
    - endpoints[POST /properties]
    - state_machines.Property.initial_state
    distinguishing_aspect: A create call carrying only the eight declared input fields returns 201 with status UNDER_CONTRACT, version 1 and BOTH computed fields still null — depreciable_basis_cents is minted at acquisition, not at registration.
    test_recipe:
      setup:
      - Empty database. The logical clock has never been set, so it stands at its startup default 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          p_id: $.data.id
      assert:
      - response status is 201
      - Property.${p_id}.status == UNDER_CONTRACT
      - Property.${p_id}.version == 1
      - Property.${p_id}.purchase_price_cents == 1200000000
      - Property.${p_id}.appraised_value_cents == 1200000000
      - Property.${p_id}.annual_noi_cents == 97000000
      - Property.${p_id}.occupancy_rate == 0.95
      - Property.${p_id}.contract_close_deadline == 2026-09-30T23:59:59.999Z
      - Property.${p_id}.depreciable_basis_cents is null
      - Property.${p_id}.acquired_at is null
      - Property.${p_id}.created_at == 2026-08-01T00:00:00.000Z
  - name: property_retrieval_returns_stored_row
    claim_type: retrieval
    grounds:
    - entities.Property
    - endpoints[GET /properties/{property_id}]
    - response_envelope
    distinguishing_aspect: 'The single-resource read returns the stored row byte-for-byte inside the standard { data: ... } envelope, with version still 1 because a GET is not a mutation.'
    test_recipe:
      setup:
      - Property P1 registered at clock 2026-08-01 and never mutated.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          p_id: $.data.id
      trigger:
      - call: GET /properties/${p_id}
        as: QualifiedIntermediary
        as_user_id: qi-1
      assert:
      - response status is 200 and the body is the declared envelope with a single `data` object
      - data.id == ${p_id}
      - data.name == "Cypress Logistics Center"
      - data.state_code == "TX"
      - data.asset_type == INDUSTRIAL
      - data.status == UNDER_CONTRACT
      - data.version == 1
      - data.updated_at == 2026-08-01T00:00:00.000Z
  - name: exchange_files_listing_filtered_by_investor_paginates
    claim_type: listing
    grounds:
    - entities.ExchangeFile
    - endpoints[GET /exchange-files]
    - response_envelope
    distinguishing_aspect: Three files exist for one investor and none for another; filter + limit + offset compose so page 1 reports total_count 3 with has_more true and page 2 returns the single remainder with has_more false.
    test_recipe:
      setup:
      - Investor A and Investor B both onboarded at clock 2026-08-20.
      - Investor A has THREE ExchangeFiles (QI-A-1, QI-A-2, QI-A-3), all relinquished 2026-08-05; Investor B has one (QI-B-2026).
      - The clock is 2026-08-20, inside every identification window.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /investors
        payload:
          legal_name: Alice Adams
          entity_type: INDIVIDUAL
          accreditation_method: SELF_CERT_NET_WORTH
          annual_income_cents: 90000000
          net_worth_cents: 2000000000
          liquid_net_worth_cents: 1600000000
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          inv_a_id: $.data.id
      - call: POST /investors
        payload:
          legal_name: Bravo Holdings LLC
          entity_type: LLC
          accreditation_method: THIRD_PARTY_LETTER
          annual_income_cents: 250000000
          net_worth_cents: 1500000000
          liquid_net_worth_cents: 1000000000
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          inv_b_id: $.data.id
      - call: POST /exchange-files
        payload:
          investor_id: ${inv_a_id}
          qi_reference: QI-A-1
          relinquished_closed_on: '2026-08-05'
          relinquished_sale_price_cents: 400000000
          net_proceeds_cents: 250000000
          debt_retired_cents: 100000000
          identification_rule: THREE_PROPERTY
          boot_tolerance_cents: 0
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          xf1_id: $.data.id
      - call: POST /exchange-files
        payload:
          investor_id: ${inv_a_id}
          qi_reference: QI-A-2
          relinquished_closed_on: '2026-08-05'
          relinquished_sale_price_cents: 400000000
          net_proceeds_cents: 250000000
          debt_retired_cents: 100000000
          identification_rule: THREE_PROPERTY
          boot_tolerance_cents: 0
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          xf2_id: $.data.id
      - call: POST /exchange-files
        payload:
          investor_id: ${inv_a_id}
          qi_reference: QI-A-3
          relinquished_closed_on: '2026-08-05'
          relinquished_sale_price_cents: 400000000
          net_proceeds_cents: 250000000
          debt_retired_cents: 100000000
          identification_rule: THREE_PROPERTY
          boot_tolerance_cents: 0
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          xf3_id: $.data.id
      - call: POST /exchange-files
        payload:
          investor_id: ${inv_b_id}
          qi_reference: QI-B-2026
          relinquished_closed_on: '2026-08-10'
          relinquished_sale_price_cents: 600000000
          net_proceeds_cents: 290000000
          debt_retired_cents: 120000000
          identification_rule: TWO_HUNDRED_PCT
          boot_tolerance_cents: 0
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          xf4_id: $.data.id
      trigger:
      - call: GET /exchange-files
        payload:
          investor_id: ${inv_a_id}
          limit: 2
          offset: 0
        as: ComplianceOfficer
        as_user_id: compliance-1
        captures:
          page1_first_id: $.data[0].id
      - call: GET /exchange-files
        payload:
          investor_id: ${inv_a_id}
          limit: 2
          offset: 2
        as: ComplianceOfficer
        as_user_id: compliance-1
      assert:
      - 'page 1: response status 200, total_count == 3, has_more == true, len(data) == 2'
      - 'page 2: total_count == 3, has_more == false, len(data) == 1'
      - the union of the two pages is exactly {${xf1_id}, ${xf2_id}, ${xf3_id}} — ${xf4_id} (Investor B's file) never appears
      - every returned row has investor_id == ${inv_a_id}
      - GET /exchange-files?investor_id=${inv_b_id} returns total_count == 1
  - name: trust_lookup_with_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - entities.DstTrust
    - errors[ERR_TRUST_NOT_FOUND]
    - validations[priority=6]
    distinguishing_aspect: A syntactically valid UUID that matches no row yields 404 ERR_TRUST_NOT_FOUND rather than 200 with an empty body or a 400.
    test_recipe:
      setup:
      - Empty database; no trust has ever been created.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: GET /trusts/00000000-0000-4000-8000-00000000dead
        as: Trustee
        as_user_id: trustee-1
        captures:
          err_nf: $.data.error_id
      assert:
      - response status is 404
      - error_id == ERR_TRUST_NOT_FOUND
      - the error envelope carries error_id and message and no `data` payload
  - name: offering_creation_missing_load_pct_rejected
    claim_type: required_fields
    grounds:
    - entities.Offering.fields.load_pct
    - validations[priority=5]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: load_pct has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST — the server must not substitute 0 and compute a target_equity equal to base_need.
    test_recipe:
      setup:
      - Property P1 registered and DstTrust T1 created (FORMING); no offering exists yet.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          prop_id: $.data.id
      - call: POST /trusts
        payload:
          property_id: ${prop_id}
          trust_name: DST 2423-A Cypress
          total_units: 620
          reserve_floor_cents: 5000000
          reserve_target_pct: 0.02
        as: Trustee
        as_user_id: trustee-1
        captures:
          trust_id: $.data.id
      trigger:
      - call: POST /offerings
        payload:
          trust_id: ${trust_id}
          exemption_rule: RULE_506B
          unit_price_cents: 1000000
          min_units_per_investor: 15
          closing_costs_cents: 35000000
          reserve_funding_pct: 0.025
          rescission_window_days: 5
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          err_rf: $.data.error_id
      assert:
      - response status is 400 and error_id == ERR_INVALID_REQUEST
      - GET /offerings?trust_id=${trust_id} returns total_count == 0
      - DstTrust.${trust_id}.status == FORMING and version == 1 (the rejected request mutated nothing)
  - name: exchange_file_boot_tolerance_defaults_to_zero
    claim_type: defaults
    grounds:
    - entities.ExchangeFile.fields.boot_tolerance_cents
    - endpoints[POST /exchange-files]
    distinguishing_aspect: boot_tolerance_cents is the only optional input in the whole surface; omitting it stores exactly 0, which is what later makes calculations.subscription_boot's guard bite at the first cent of boot.
    test_recipe:
      setup:
      - Investor A onboarded at clock 2026-08-20.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /investors
        payload:
          legal_name: Alice Adams
          entity_type: INDIVIDUAL
          accreditation_method: SELF_CERT_NET_WORTH
          annual_income_cents: 90000000
          net_worth_cents: 2000000000
          liquid_net_worth_cents: 1600000000
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          inv_a_id: $.data.id
      trigger:
      - call: POST /exchange-files
        payload:
          investor_id: ${inv_a_id}
          qi_reference: QI-DEF-2026
          relinquished_closed_on: '2026-08-05'
          relinquished_sale_price_cents: 400000000
          net_proceeds_cents: 250000000
          debt_retired_cents: 100000000
          identification_rule: THREE_PROPERTY
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          xf_def_id: $.data.id
      assert:
      - response status is 201
      - ExchangeFile.${xf_def_id}.boot_tolerance_cents == 0
      - ExchangeFile.${xf_def_id}.status == OPEN
      - ExchangeFile.${xf_def_id}.identification_deadline == 2026-09-19T23:59:59.999Z
      - ExchangeFile.${xf_def_id}.exchange_deadline == 2027-02-01T23:59:59.999Z
  - name: property_depreciable_basis_computed_on_acquire_client_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.Property.fields.depreciable_basis_cents
    - calculations.property_depreciable_basis
    - state_machines.Property.transitions.UNDER_CONTRACT_to_ACQUIRED
    distinguishing_aspect: 'depreciable_basis_cents has source computed: a client-supplied value in the create body is discarded and the field stays null until acquisition, when it is minted as exactly 80% of purchase price (960,000,000).'
    test_recipe:
      setup:
      - 'The create call deliberately carries an out-of-band depreciable_basis_cents: 1 alongside the declared inputs; the server must ignore it.'
      - Clock 2026-08-20, before the 2026-09-30 contract deadline.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
          depreciable_basis_cents: 1
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          p_id: $.data.id
      trigger:
      - call: POST /properties/${p_id}/acquire
        payload: {}
        as: SponsorPrincipal
        as_user_id: sponsor-1
      assert:
      - 'immediately after creation: Property.${p_id}.depreciable_basis_cents is null (the supplied 1 was ignored)'
      - 'after acquire: response status is 200 and Property.${p_id}.status == ACQUIRED'
      - Property.${p_id}.depreciable_basis_cents == 960000000
      - Property.${p_id}.acquired_at == 2026-08-20T00:00:00.000Z
      - Property.${p_id}.version == 2
  - name: subscription_system_fields_server_minted_client_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Subscription
    - endpoints[POST /subscriptions]
    - concurrency_rules[subscription-create-stale-offering]
    distinguishing_aspect: 'id, created_at, updated_at and version are system fields: the create body carries bogus values for all four plus a bogus status, and every one is ignored — the row comes back with a server-minted UUID, version 1 and status RESERVED.'
    test_recipe:
      setup:
      - Offering O1 EFFECTIVE on a FUNDING trust; LoanFacility L1 FUNDED; Investor A VERIFIED and APPROVED; ExchangeFile A IDENTIFIED for P1.
      - The create body carries id, created_at, version and status alongside the five declared inputs.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          prop_id: $.data.id
      - call: POST /trusts
        payload:
          property_id: ${prop_id}
          trust_name: DST 2423-A Cypress
          total_units: 620
          reserve_floor_cents: 5000000
          reserve_target_pct: 0.02
        as: Trustee
        as_user_id: trustee-1
        captures:
          trust_id: $.data.id
      - call: POST /offerings
        payload:
          trust_id: ${trust_id}
          exemption_rule: RULE_506B
          unit_price_cents: 1000000
          min_units_per_investor: 15
          load_pct: 0.09
          closing_costs_cents: 35000000
          reserve_funding_pct: 0.025
          rescission_window_days: 5
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          off_id: $.data.id
      - call: POST /loan-facilities
        payload:
          trust_id: ${trust_id}
          lender_name: Gulf Coast Life
          principal_cents: 720000000
          rate_bps: 425
          recourse_type: NON_RECOURSE
          maturity_on: '2033-08-01'
        as: Trustee
        as_user_id: trustee-1
        captures:
          loan_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-20T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties/${prop_id}/acquire
        payload: {}
        as: SponsorPrincipal
        as_user_id: sponsor-1
      - call: POST /offerings/${off_id}/submit-ppm
        payload:
          ppm_document_reference: PPM-2423-r1
        as: SponsorPrincipal
        as_user_id: sponsor-1
      - call: POST /offerings/${off_id}/declare-effective
        payload:
          acknowledged_ppm_version: 1
        as: ComplianceOfficer
        as_user_id: compliance-1
        captures:
          off_v: $.data.version
      - call: POST /loan-facilities/${loan_id}/fund
        payload: {}
        as: Trustee
        as_user_id: trustee-1
      - call: POST /trusts/${trust_id}/open-funding
        payload: {}
        as: Trustee
        as_user_id: trustee-1
      - call: POST /investors
        payload:
          legal_name: Alice Adams
          entity_type: INDIVIDUAL
          accreditation_method: SELF_CERT_NET_WORTH
          annual_income_cents: 90000000
          net_worth_cents: 2000000000
          liquid_net_worth_cents: 1600000000
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          inv_a_id: $.data.id
      - call: POST /investors/${inv_a_id}/verify-accreditation
        payload:
          evidence_reference: NW-STMT-A-2026
        as: ComplianceOfficer
        as_user_id: compliance-1
      - call: POST /investors/${inv_a_id}/review-suitability
        payload:
          decision: APPROVED
          offering_id: ${off_id}
        as: ComplianceOfficer
        as_user_id: compliance-1
      - call: POST /exchange-files
        payload:
          investor_id: ${inv_a_id}
          qi_reference: QI-A-2026
          relinquished_closed_on: '2026-08-05'
          relinquished_sale_price_cents: 400000000
          net_proceeds_cents: 250000000
          debt_retired_cents: 100000000
          identification_rule: THREE_PROPERTY
          boot_tolerance_cents: 0
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          xf_a_id: $.data.id
      - call: POST /property-identifications
        payload:
          exchange_file_id: ${xf_a_id}
          property_id: ${prop_id}
          fair_market_value_cents: 1200000000
        as: QualifiedIntermediary
        as_user_id: qi-1
        captures:
          id_a_id: $.data.id
      trigger:
      - call: POST /subscriptions
        payload:
          offering_id: ${off_id}
          investor_id: ${inv_a_id}
          exchange_file_id: ${xf_a_id}
          units_requested: 300
          expected_offering_version: ${off_v}
          id: 11111111-1111-4111-8111-111111111111
          created_at: '2020-01-01T00:00:00Z'
          version: 99
          status: CLOSED
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          sub_id: $.data.id
      assert:
      - response status is 201
      - Subscription.${sub_id}.id != "11111111-1111-4111-8111-111111111111" and is a server-minted UUID with no type prefix
      - Subscription.${sub_id}.created_at == 2026-08-20T00:00:00.000Z (not 2020-01-01)
      - Subscription.${sub_id}.version == 1 (not 99)
      - Subscription.${sub_id}.status == RESERVED (not CLOSED)
      - Subscription.${sub_id}.investment_amount_cents == 300000000
      - Subscription.${sub_id}.boot_cents == 0
      - Subscription.${sub_id}.closing_sequence_no is null
  - name: property_invalid_asset_type_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.Property.fields.asset_type
    - validations[priority=5]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: asset_type is constrained to four members and occupancy_rate to 0..1; a value outside the enum is a 400 at priority 5, before any business rule can look at the price fields.
    test_recipe:
      setup:
      - Empty database at clock 2026-08-01.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: SELF_STORAGE
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          err_e1: $.data.error_id
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 1.4
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          err_e2: $.data.error_id
      assert:
      - the asset_type call returns 400 with error_id == ERR_INVALID_REQUEST
      - the occupancy_rate call returns 400 with error_id == ERR_INVALID_REQUEST
      - GET /properties returns total_count == 0 — neither malformed request created a row
  - name: ledger_entry_is_immutable_and_carries_no_version
    claim_type: immutability
    grounds:
    - entities.TrustLedgerEntry
    - endpoints[GET /ledger-entries/{ledger_entry_id}]
    - endpoints[GET /ledger-entries]
    distinguishing_aspect: 'TrustLedgerEntry declares common_fields false: the read model exposes id and created_at but NO version and NO updated_at, and §1.5 offers no create/update/delete route for it — entries only ever appear as side effects.'
    test_recipe:
      setup:
      - DstTrust T1 FUNDING with LoanFacility L1 FUNDED, so exactly one LOAN_PROCEEDS entry of +720,000,000 exists in bucket OPERATING.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
