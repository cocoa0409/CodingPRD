          assert:
            - "${err} == ERR_LABEL_NOT_ACTIVE"

      - name: allocate_requires_batch_cured
        grounds:
          - state_machines.ProductionOrder.PLANNED_to_MATERIAL_ALLOCATED
          - errors[ERR_BATCH_NOT_CURED]
          - entities.ProductionOrder.fields.foam_batch_id
        distinguishing_aspect: |
          Pair ProductionOrder → FoamBatch (different pair than Shipment → LawLabel):
          allocate-materials is rejected while the batch is CURING and succeeds for the
          same order/batch pair once the batch reaches CURED — the order's valid
          transitions depend on the batch's state, not on any order field.
        test_recipe:
          setup:
            - "ACTIVE model; order PLANNED; batch CURING (started at default clock, eligible 2026-08-02T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /plant/retailers", payload: { retailer_name: "SleepCo", drop_ship_enabled: true, recycling_enrolled: true, credit_limit_cents: 100000000 }, as: PlantManager, captures: { r_id: $.data.id } }
            - { call: "POST /plant/models", payload: { model_code: "SRT-XD2", quilt_pattern: "DIAMOND" }, as: PlantManager, captures: { m_id: $.data.id } }
            - { call: "POST /plant/models/${m_id}/bom-lines", payload: { component_type: "THREAD", material_code: "MAT-TH", quantity_per_unit: 1, unit_cost_cents: 10 }, as: PlantManager }
