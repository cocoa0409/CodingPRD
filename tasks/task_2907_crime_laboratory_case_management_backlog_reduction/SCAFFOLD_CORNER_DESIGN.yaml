        distinguishing_aspect: "Two awards from the same vendor straddle TIER_1_THRESHOLD_CENTS from both sides: item_count 4 gives tier_basis 100000 which is exactly the threshold and therefore takes 0.04 (discount 4000, award 96000), while item_count 3 gives 75000 and takes 0.00 (award 75000) - so the comparison is >= and not >, and encumbered_cents lands on 171000."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Vendor V1: accredited_disciplines [DIGITAL], accreditation_expires_at_utc 2027-08-01T00:00:00Z, concurrent_case_capacity 5, unit_price_cents 25000, rush_surcharge_pct 0.0, contract_ceiling_cents 1000000."
