            - "the value is NOT 2974 (an exclusive billable_days of 26) and NOT 3546 (no proration at all)"
            - "the MONTHLY_FEE row has period_start == 2026-08-01 and period_end == 2026-08-31"
            - "Property.${prop_id}.outstanding_balance_cents == 5588 == 2500 + 3088"

