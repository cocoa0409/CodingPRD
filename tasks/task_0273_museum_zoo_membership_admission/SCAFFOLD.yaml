# =============================================================================
# Scaffold: Museum & Zoo Membership & Admission (task_0273)
# Difficulty band: Expert
# =============================================================================

scenario: "Museum & Zoo Membership & Admission: membership tier/household, timed-entry ticketing, member vs non-member pricing, special-exhibit surcharge, reciprocal network, guest passes, renewal/auto-renew, donation add-on"

domain_name: museum-zoo-membership-admission
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Membership.version for renew-supersede
    - dual_variant_calculation      # provisional-vs-final order price; early-vs-lapsed renewal fee
    - cascading_side_effects        # membership/order cancellation fan-down chains
    - rate_threshold_triggers       # slot capacity boundary; guest-pass pool boundary

  entity_topology: flat
  # All resources are top-level collections joined by foreign keys; no nesting in
  # URL paths except the SpecialExhibit -> ExhibitSession reverse sub-resource.

  state_machine_shape: cyclic
  # Membership cycles ACTIVE<->GRACE via renew; AdmissionOrder branches
  # CONFIRMED -> {CHECKED_IN, CANCELLED}; AdmissionTicket and GuestPass add more.

  relationship_patterns:
    - one_to_many        # Membership -> HouseholdMember / GuestPass; Order -> Ticket
    - cross_aggregate    # AdmissionOrder references Membership, TimedEntrySlot, ExhibitSession
    - polymorphic        # Donation references either an Order or a Membership

  role_model: peer_roles
  # Patron owns own memberships/orders; BoxOffice and GateScanner are operational;
  # MembershipAdmin owns catalog configuration.

  consistency_model: immediate
  # Every cascade, capacity recompute, and price recompute is atomic within the
  # triggering request.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

