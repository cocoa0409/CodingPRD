        distinguishing_aspect: |
          The sampled lot's acceptance rate is always accepted / ORIGINAL
          sample_size. After an overturned dispute reinstates all 5 sampled items
          the rate goes 0.4000 -> 1.0000 and the projection climbs 0 -> 41 units
