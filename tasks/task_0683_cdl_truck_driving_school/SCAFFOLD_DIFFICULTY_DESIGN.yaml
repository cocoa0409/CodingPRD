  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: truck_buffered_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.Truck.fields.turnaround_buffer_minutes
          - errors[ERR_TRUCK_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Truck interval semantics include a 30-min turnaround BUFFER appended after each session: a session
          09:00–10:00 occupies the truck until 10:30, so a second session starting 10:15 is rejected even though
          the raw [09:00,10:00) and [10:15,11:15) intervals do not overlap — buffer-extended geometry.
        test_recipe:
          setup:
            - "Enrollment E in TRAINING. Truck T1 (turnaround_buffer 30). One BOOKED RANGE session 09:00–10:00 on T1."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B", turnaround_buffer_minutes: 30 }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Jon", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-20T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${instr2_id}", truck_id: "${truck_id}", starts_at: "2026-03-20T10:15:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRUCK_DOUBLE_BOOKED"
            - "http status == 409"

      - name: instructor_unbuffered_overlap_rejected_adjacency_ok
        grounds:
          - validations[priority=13]
          - entities.Instructor.fields.reserved_minutes
          - errors[ERR_INSTRUCTOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          DIFFERENT interval semantics and DIFFERENT resource entity (Instructor) than the truck rule: the
          instructor busy interval is half-open [start, start+duration) with NO buffer, so a session 09:30–10:30
          overlapping an existing 09:00–10:00 instructor booking is rejected, while a strictly back-to-back
          10:00–11:00 booking would be allowed.
        test_recipe:
          setup:
            - "Enrollment E in TRAINING. Instructor Ivy has one BOOKED CLASSROOM session 09:00–10:00."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${instr_id}", starts_at: "2026-03-20T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { sess1_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "CLASSROOM", instructor_id: "${instr_id}", starts_at: "2026-03-20T09:30:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSTRUCTOR_DOUBLE_BOOKED"
            - "http status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: book_then_cancel_preserves_truck_reserved_minutes
        grounds:
          - state_machines.ClockSession.BOOKED_to_CANCELLED
          - calculations.truck_reserved_minutes
          - entities.Truck.fields.reserved_minutes
        distinguishing_aspect: |
          Conserved quantity #1 = Truck.reserved_minutes: booking a 120-min session raises it to 120, and the
          compensating cancel lowers it back to exactly 0 (the pre-book value), pinned as
          reserved_minutes == sum(duration_minutes over BOOKED sessions of this truck).
        test_recipe:
          setup:
            - "Enrollment E in TRAINING. Truck T1 with reserved_minutes 0. Book a 120-min RANGE session on T1 (reserved_minutes -> 120)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "RANGE", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-25T09:00:00Z", duration_minutes: 120 }
              as: Registrar
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /clock-sessions/${sess_id}/cancel"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "ClockSession.${sess_id}.status == CANCELLED"
            - "Truck.${truck_id}.reserved_minutes == 0"

      - name: complete_then_void_preserves_logged_road_hours
        grounds:
          - state_machines.ClockSession.BOOKED_to_COMPLETED
          - state_machines.ClockSession.COMPLETED_to_CANCELLED
          - calculations.eldt_logged_hours
          - entities.Enrollment.fields.logged_road_hours
        distinguishing_aspect: |
          A DIFFERENT conserved quantity than instance 1 = Enrollment.logged_road_hours: completing a 60-min
          road session raises logged_road_hours to 1.0, and the compensating administrative void returns it to
          exactly 0.0 (pre-complete value) while reverting TEST_READY -> TRAINING.
        test_recipe:
          setup:
            - "Enrollment E at TEST_READY with one COMPLETED 60-min ROAD session (logged_road_hours == 1.0), program road_required 1."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 0, range_required_hours: 0, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /trucks"
              payload: { unit_number: "T1", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy", cdl_class: "CLASS_B" }
              as: SchoolAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${prog_id}", student_name: "Sam" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "DOT_MEDICAL", reference_code: "MED-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { med_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/prereq-documents"
              payload: { kind: "CLP_PERMIT", reference_code: "CLP-1", expires_on: "2027-01-01T00:00:00Z" }
              as: Registrar
              captures: { clp_id: $.data.id }
            - call: "POST /prereq-documents/${med_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /prereq-documents/${clp_id}/approve"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/clock-sessions"
              payload: { phase: "ROAD", instructor_id: "${instr_id}", truck_id: "${truck_id}", starts_at: "2026-03-12T09:00:00Z", duration_minutes: 60 }
              as: Registrar
              captures: { road_id: $.data.id }
            - call: "POST /clock-sessions/${road_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /clock-sessions/${road_id}/cancel"
              payload: {}
              as: SchoolAdmin
          assert:
            - "ClockSession.${road_id}.status == CANCELLED"
            - "Enrollment.${enr_id}.logged_road_hours == 0.0"
            - "Enrollment.${enr_id}.status == TRAINING"
