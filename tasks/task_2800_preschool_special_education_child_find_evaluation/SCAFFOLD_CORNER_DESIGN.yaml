      - name: dual_variant_due_date_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.referral_evaluation_due_date.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / referral_due_date_consent_anchored_vs_receipt_anchored
          rationale: "Both anchors and their delta are asserted there on one Part C referral, together with the third-birthday cap that only one variant respects."

      - name: dual_variant_selection_by_plan_state
        claim_type: variant_selection
        grounds:
          - calculations.provider_assigned_weekly_minutes.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provider_minutes_projected_vs_committed_plan_states
          rationale: "That instance pins which plan states feed the projected variant and which feed the committed variant, which is the selection claim."

      - name: dual_variant_reconciliation_on_switch
        claim_type: reconciliation
        grounds:
          - calculations.evaluation_composite_delay_profile.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / eligibility_composite_play_based_inclusive_vs_standardized_strict
          rationale: "The switch between protocols is asserted as a recomputed composite on the same completed assessment set, including the qualifying-count delta."

      - name: percent_delay_rounding_precision
        claim_type: precision
        grounds:
          - calculations.domain_percent_delay
        excluded_because:
          difficulty_instance: boundary_precision_check / percent_delay_exactly_at_the_twenty_five_percent_threshold_qualifies
          rationale: "Half-up rounding to one decimal is exactly what makes 27.8 x 0.9 qualify at 25.0 there."

      - name: minute_rounding_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.service_minutes_recommendation.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / service_minutes_ceil_per_line_then_sum_not_sum_then_ceil
          rationale: "The severity multipliers and the 5-minute increment are asserted there through two orderings of the same rounding constant."

      - name: travel_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.provider_assigned_weekly_minutes.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / travel_tier_selected_from_direct_minutes_before_overhead_is_added
          rationale: "Tier selection at the 300-minute edge and the refusal to re-tier after overhead is added are both asserted there."

      - name: aggregation_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.provider_assigned_weekly_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / unstaffing_restores_the_providers_exact_pre_staffing_minute_and_travel_figures
          rationale: "Add-then-reverse with no drift is the aggregation claim, asserted on both the direct and the travel term."

      - name: weighted_scoring_of_play_based_results
        claim_type: weighted_scoring
        grounds:
          - calculations.domain_percent_delay.constants
        excluded_because:
          difficulty_instance: dual_variant_calc / eligibility_composite_play_based_inclusive_vs_standardized_strict
          rationale: "The 0.9 play-based weight and its effect on the qualifying set are asserted there against an unweighted standardized baseline."

      - name: interval_merge_of_screening_windows
        claim_type: interval_merge
        grounds:
          - validations[priority=21]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / screening_event_windows_overlap_per_site_half_open_with_no_buffer
          rationale: "Overlapping, adjacent (gap zero) and disjoint windows are all asserted there on one site."

  - section: validations
    instances:

      - name: chair_eligibility_outranks_the_consent_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=13]
        distinguishing_aspect: |
          Opening a case on a referral that has no consent AND names an SLP as
          chair violates two rules at once; the priority-9 discipline restriction
          answers first with ERR_CHAIR_NOT_ELIGIBLE, and only once an eligible
          chair is named does the caller learn about ERR_CONSENT_NOT_GRANTED.
          The same ineligible chair is refused again on a fully authorized
          referral, proving the rule is not a side effect of the missing consent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One chair-eligible SCHOOL_PSYCHOLOGIST and one SLP, who is never chair-eligible."
            - "Child A has a referral with no consent request; child B's referral has GRANTED consent."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
