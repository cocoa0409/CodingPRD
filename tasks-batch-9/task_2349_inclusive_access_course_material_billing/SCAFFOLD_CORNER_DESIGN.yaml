              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000001-0", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /titles/${t1_id}/pricing-tiers"
              payload: { min_enrollment: 1, max_enrollment: 2, per_student_price_cents: 9000 }
              as: ProgramAdmin
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", isbn: "978-0-11-000002-0", title: "Economics Interactive", list_price_cents: 15000, format: "DIGITAL" }
              as: ProgramAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /titles/${t2_id}/pricing-tiers"
              payload: { min_enrollment: 1, per_student_price_cents: 7000 }
              as: ProgramAdmin
            - call: "POST /agreements/${agr_id}/activate"
              as: ProgramAdmin
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id, sec_v1: $.data.version }
          trigger:
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t1_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v1}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { a1_id: $.data.id }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t2_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v1}" }
              as: Faculty
              as_user_id: "fac-1"
            - call: "GET /sections/${sec_id}"
              as: Faculty
              as_user_id: "fac-1"
              captures: { sec_v2: $.data.version }
            - call: "POST /adoptions"
              payload: { section_id: "${sec_id}", title_id: "${t2_id}", access_start_date: "2026-08-24", access_end_date: "2026-12-12", expected_section_version: "${sec_v2}" }
              as: Faculty
              as_user_id: "fac-1"
              captures: { a2_id: $.data.id }
            - call: "GET /sections/${sec_id}"
              as: Faculty
              as_user_id: "fac-1"
          assert:
            - "Setup: CourseSection.${sec_id}.version == 1 on creation"
            - "Trigger call 1 -> HTTP 201 and CourseSection.${sec_id}.version == 2: every accepted adoption create increments the parent version"
            - "Trigger call 2 -> HTTP 412 ERR_STALE_SECTION_VERSION with the byte-identical payload of trigger call 4 - the only difference is the version token"
            - "The rejected write is inert: CourseSection.${sec_id}.version is still 2 after trigger call 2 and GET /sections/${sec_id}/adoptions returns total_count == 1"
            - "Trigger call 3 returns version 2, so ${sec_v2} == 2"
            - "Trigger call 4 -> HTTP 201: Adoption.${a2_id}.title_id == ${t2_id}, status DRAFT, and CourseSection.${sec_id}.version == 3"
            - "Trigger call 5 -> HTTP 200 with version 3 and GET /sections/${sec_id}/adoptions returns total_count == 2 (${a1_id} and ${a2_id}, both DRAFT)"

      - name: layer_occ_stale_agreement_version_rejects_reconciliation_run
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reconciliation-run-create-stale-agreement]
          - validations[priority=40]
          - errors[ERR_STALE_AGREEMENT_VERSION]
          - endpoints[POST /reconciliation-runs]
        distinguishing_aspect: |
          The second OCC rule guards a different parent with a different token: the run recompute is
          otherwise entirely legal - it names the current COMPUTED run in supersedes_run_id, so the
          self-transition COMPUTED -> COMPUTED would accept it - but the first run already bumped the
          agreement version, so the stale token is refused at priority 40, ahead of the state
          precondition at 45.
        test_recipe:
          setup:
            - "FA26 OPEN; PUB-A ACTIVE; T1 list 18000 with tier [1,2] -> 9000; ECON-101-001 FLAGGED with S-1001 charged 9450 (share 8316) at 2026-08-24T09:00:00Z; the agreement's version is read immediately before the first run."
