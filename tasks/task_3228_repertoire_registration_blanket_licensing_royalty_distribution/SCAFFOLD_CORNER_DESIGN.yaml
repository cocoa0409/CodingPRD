      - name: second_dispute_on_same_license_rejected
        claim_type: violation_to_error
        grounds: [state_machines.License.ACTIVE_to_DISPUTED, errors.ERR_DISPUTE_ALREADY_OPEN]
        distinguishing_aspect: "A license already under an open dispute rejects a second dispute with ERR_DISPUTE_ALREADY_OPEN (409)."
        test_recipe:
          setup: ["license DISPUTED with an OPEN dispute"]
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "D2 Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 10 }
