      - name: client_double_book_closed_adjacency_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_CLIENT_DOUBLE_BOOKED]
          - entities.Appointment.fields.client_id
        distinguishing_aspect: "Client resource (different entity from preparer) uses CLOSED [start,end] semantics with a zero-gap buffer: a second appointment for the SAME client that merely abuts (start == prior end) IS rejected with ERR_CLIENT_DOUBLE_BOOKED — opposite adjacency treatment from the half-open preparer rule."
        test_recipe:
          setup:
            - "Office; two preparers; one client with an existing SCHEDULED appointment 09:00–10:00Z under preparer A."
