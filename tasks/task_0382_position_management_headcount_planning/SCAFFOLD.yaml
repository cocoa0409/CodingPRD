    side_effects: ["status=OPEN"]

  - method: GET
    path: "/positions/{positionId}/requisitions"
    description: "List requisitions for a Position (reverse-reachability for Requisition.position_id)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Requisition[]
    side_effects: []

  - method: GET
    path: "/requisitions/{requisitionId}"
