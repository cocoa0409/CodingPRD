  # ===========================================================================
  # §1.9 section 3 — calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: jurisdiction_risk_points_sums_all_four_components
        claim_type: correct_result
        grounds:
          - calculations.jurisdiction_risk_points
          - entities.JurisdictionProfile.fields.jurisdiction_risk_points
        distinguishing_aspect: "All four addends are non-zero at once: 6.50 * BASEL_MULTIPLIER 2.0 = 13.00, RESTRICTED 8, CALL_FOR_ACTION 12 and secrecy 3 give exactly 36.00 - below POINTS_CAP, so no clamping is involved."
        test_recipe:
          setup: ["Clean database; logical clock pinned."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "KY", name: "Cayman Islands", basel_aml_index: 6.50, corridor_risk_weight: 1.75, sanctions_status: "RESTRICTED", fatf_listing: "CALL_FOR_ACTION", secrecy_flag: true }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
          assert:
            - "response.status == 201"
            - "response.data.jurisdiction_risk_points == 36.00"

      - name: jurisdiction_risk_points_clamped_at_points_cap
        claim_type: constants_applied
        grounds:
          - calculations.jurisdiction_risk_points
          - calculations.jurisdiction_risk_points.constants.POINTS_CAP
        distinguishing_aspect: "Raw points are 20.00 + 20 + 12 + 3 = 55.00, so POINTS_CAP 40.00 must clamp the stored value to exactly 40.00 rather than storing the raw sum."
        test_recipe:
          setup: ["Clean database; logical clock pinned."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "IR", name: "Iran", basel_aml_index: 10.00, corridor_risk_weight: 2.50, sanctions_status: "COMPREHENSIVELY_SANCTIONED", fatf_listing: "CALL_FOR_ACTION", secrecy_flag: true }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
          assert:
            - "response.status == 201"
            - "response.data.jurisdiction_risk_points == 40.00"

      - name: jurisdiction_risk_points_recomputed_on_basel_patch
        claim_type: correct_result
        grounds:
          - calculations.jurisdiction_risk_points
          - endpoints[PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}]
        distinguishing_aspect: "The trigger list includes PATCH, so raising basel_aml_index 4.00 -> 7.25 on an otherwise default profile must rewrite jurisdiction_risk_points from 8.00 to 14.50 in the same response and bump version to 2."
        test_recipe:
          setup: ["One default DE profile (PERMITTED, NONE, secrecy false) with basel_aml_index 4.00 and jurisdiction_risk_points 8.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
              captures: { jp_id: $.data.id }
          trigger:
            - call: "PATCH /correspondent-banking/jurisdiction-profiles/${jp_id}"
              payload: { basel_aml_index: 7.25 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "response.status == 200"
            - "response.data.jurisdiction_risk_points == 14.50"
            - "response.data.version == 2"

      - name: effective_ownership_pct_two_level_look_through_rounds_once
        claim_type: precision
        grounds:
          - calculations.effective_ownership_pct
          - entities.BeneficialOwner.fields.effective_ownership_pct
          - entities.BeneficialOwner.fields.chain_depth
        distinguishing_aspect: "66.67% of the respondent held through a 33.33% stake gives the exact quotient 22.221111, which must be rounded exactly once to 22.22; the direct parent keeps its own 66.67 and the child records chain_depth 2."
        test_recipe:
          setup: ["One DD_IN_PROGRESS respondent under DE with a single direct LEGAL_ENTITY owner holding 66.67."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
            - call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification"
              payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/beneficial-owners"
              payload: { owner_name: "Holding SE", owner_type: "LEGAL_ENTITY", ownership_pct: 66.67, country_of_residence: "DE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
              captures: { bo_root: $.data.id }
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_id}/beneficial-owners"
