        excluded_because:
          difficulty_instance: resource_temporal_overlap / instructor_half_open_windows_allow_adjacency_reject_intersection
          rationale: "The §1.8 instance already triggers ERR_INSTRUCTOR_SCHEDULE_CONFLICT on the intersecting third contract."

      - name: error_learner_load_exceeded_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEARNER_LOAD_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / learner_closed_interval_aggregate_ceu_load_cap
          rationale: "The §1.8 instance already triggers ERR_LEARNER_LOAD_EXCEEDED at the 4.2-versus-4.0 CEU boundary."

      - name: error_attendance_below_threshold_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_ATTENDANCE_BELOW_THRESHOLD]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / attendance_ratio_exactly_at_threshold_awards_ceu
          rationale: "The §1.8 instance already triggers ERR_ATTENDANCE_BELOW_THRESHOLD at 7 of 10 sessions."

      - name: error_segregation_of_duties_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
