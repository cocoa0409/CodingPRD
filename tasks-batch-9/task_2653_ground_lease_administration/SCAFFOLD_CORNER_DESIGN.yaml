  - section: state_machines
    instances:
      - name: exchange_moves_revaluation_to_proposals_and_computes_divergence
        claim_type: valid_transition
        grounds:
          - state_machines.RentRevaluation.OPEN_FOR_APPRAISALS_to_PROPOSALS_EXCHANGED
          - calculations.revaluation_reset_rent
        distinguishing_aspect: |
          Exchange is the only step that copies the two sworn numbers onto the revaluation and computes
          divergence_bps off the LOWER of them: (14000000 - 10000000) x 10000 / 10000000 == 4000, not
          2857 (which is what dividing by the higher figure would give) and not 4000 by luck of order.
          The Lease rent axis is already REVALUATION_OPEN and must not move on exchange.
        test_recipe:
          setup:
            - "One lease with an OPEN_FOR_APPRAISALS revaluation carrying both round-1 appraisals: LESSOR 14000000 and LESSEE 10000000."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-82", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
          assert:
            - "returns 200 with RentRevaluation.${reval_id}.status == PROPOSALS_EXCHANGED"
            - "lessor_appraised_rent_cents == 14000000, lessee_appraised_rent_cents == 10000000, divergence_bps == 4000"
            - "round_number is still 1 and prior_annual_base_rent_cents == 10000000, resolved_annual_base_rent_cents == null, resolution_method == null"
            - "Lease.${lease_id}.rent_status is still REVALUATION_OPEN and current_annual_base_rent_cents is still 10000000"

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Lease.lease_status.initial_state
          - state_machines.Lease.rent_status.initial_state
          - state_machines.LeaseholdMortgage.initial_state
          - state_machines.RentRevaluation.initial_state
          - state_machines.AlterationRequest.initial_state
          - state_machines.TransferRequest.initial_state
          - state_machines.DefaultNotice.initial_state
          - state_machines.LossEvent.initial_state
        distinguishing_aspect: |
          Eight state machines, eight declared entry points, and each has a companion field seeded at the
          same moment: a mortgage enters RECORDED with outstanding == original and no notice timestamp, a
          revaluation enters OPEN_FOR_APPRAISALS at round 1 with the rent snapshot taken, and a loss event
          enters REPORTED with all four allocation buckets at 0 and an empty allocation_detail.
        test_recipe:
          setup:
            - "One lease; one mortgage, one revaluation, one alteration request, one sublease request and one loss event created on it."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-83", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 1000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-02-01T00:00:00Z", estimated_cost_cents: 100000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
              payload: { event_type: "CASUALTY", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z", damage_estimate_cents: 1000000, damaged_area_sqft: 500 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { loss_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/default-notices"
              payload: { default_type: "UNPERMITTED_USE" }
              as: AssetManager
              as_user_id: "am-1"
              captures: { notice_id: $.data.id }
          assert:
            - "the setup lease starts lease_status ACTIVE and rent_status BASE_ONLY"
            - "LeaseholdMortgage.${m1_id}.status == RECORDED with outstanding_principal_cents 3000000, mortgagee_notified_at null and new_lease_election_deadline null"
            - "RentRevaluation.${reval_id}.status == OPEN_FOR_APPRAISALS, round_number 1, prior_annual_base_rent_cents 10000000, divergence_bps null; Lease.${lease_id}.rent_status becomes REVALUATION_OPEN"
            - "AlterationRequest.${alt_id}.status == SUBMITTED with decided_by_user_id null"
            - "LossEvent.${loss_id}.status == REPORTED with distributable_pool_cents null, allocation_method null, allocated_arrears_cents / allocated_mortgagee_cents / allocated_lessee_cents / allocated_lessor_cents all 0 and allocation_detail []"
            - "DefaultNotice.${notice_id}.status == SERVED with cured_by null and terminated_by_user_id null; Lease.${lease_id}.lease_status becomes IN_DEFAULT"

      - name: resolved_revaluation_cannot_be_settled_or_reopened
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RentRevaluation.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          RESOLVED is terminal on the revaluation even though the Lease rent axis has moved on to
          RESET_APPLIED and would happily host a new revaluation: both settle and rounds must be refused
          on the resolved row, and neither may re-run the rent cascade - current_annual_base_rent_cents
          stays at the once-applied 11000000.
        test_recipe:
          setup:
            - "One lease whose revaluation was settled at the midpoint: appraisals 11000000 / 10000000, midpoint 10500000 clamped up to the 11000000 collar floor."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-84", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 11000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/settle"
              payload: {}
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_id}/settle"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/rounds"
              payload: {}
              as: LessorAdmin
          assert:
            - "after setup: RentRevaluation.${reval_id}.status == RESOLVED with resolution_method MIDPOINT_SETTLEMENT and resolved_annual_base_rent_cents == 11000000 (midpoint 10500000 raised to the collar floor 10000000 + 1000 bps)"
            - "after setup: Lease.${lease_id}.current_annual_base_rent_cents == 11000000, rent_status == RESET_APPLIED, next_revaluation_date == 2030-01-01T00:00:00Z"
            - "trigger[0] returns ERR_INVALID_STATE (409) and current_annual_base_rent_cents is still 11000000 - the cascade did not run twice"
            - "trigger[1] returns ERR_INVALID_STATE (409) and round_number is still 1"

      - name: exchange_without_both_sides_and_rounds_before_exchange_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RentRevaluation.OPEN_FOR_APPRAISALS_to_PROPOSALS_EXCHANGED
          - errors.ERR_APPRAISALS_INCOMPLETE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          From OPEN_FOR_APPRAISALS the only declared move is exchange, and it needs one submission per
          side at the current round: with just the LESSOR number lodged the exchange is
          ERR_APPRAISALS_INCOMPLETE (a precondition failure with its own code), while asking for a new
          round from that same state is ERR_INVALID_STATE (no such transition at all). The two must not
          collapse into one code.
        test_recipe:
          setup:
            - "One lease with an OPEN_FOR_APPRAISALS revaluation carrying only the LESSOR appraisal."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-85", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
              as_user_id: "appraiser-lessor-1"
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/rounds"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_id}/settle"
              payload: {}
              as: LessorAdmin
          assert:
            - "trigger[0] returns ERR_APPRAISALS_INCOMPLETE (409); status stays OPEN_FOR_APPRAISALS and lessor_appraised_rent_cents stays null"
            - "trigger[1] returns ERR_INVALID_STATE (409) and round_number stays 1"
            - "trigger[2] returns ERR_INVALID_STATE (409): settle is declared only from PROPOSALS_EXCHANGED; Lease.${lease_id}.current_annual_base_rent_cents stays 10000000"

      - name: repeat_assess_on_an_already_assessed_statement_rejected
        claim_type: idempotency
        grounds:
          - state_machines.PercentageRentStatement.SUBMITTED_to_PROVISIONAL_ASSESSED
          - errors.ERR_INVALID_STATE
          - calculations.percentage_rent_due
        distinguishing_aspect: |
          The assess action is not idempotent-by-replay: the second call must be refused rather than
          silently re-posting amount_due_cents to the ledger. The discriminator is the arrears balance,
          which must read 3500000 after both calls, not 7000000.
        test_recipe:
          setup:
            - "One lease with no subleases and a SUBMITTED statement for 2026-01-01 to 2026-07-01 reporting 200000000 of gross sales."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
