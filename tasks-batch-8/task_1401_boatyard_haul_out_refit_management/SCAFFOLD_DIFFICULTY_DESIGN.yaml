            - { call: "POST /yard/yard-rows", payload: { code: "M", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_a}", stands_used: 4, start_date: "2026-03-02", end_date: "2026-04-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_a}", kind: "HAUL_OUT", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_a: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_a}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_a}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_a: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_a}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_a}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_a}/complete", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_a}", kind: "DEPOSIT", amount_cents: 21250 }, as: Accountant }
