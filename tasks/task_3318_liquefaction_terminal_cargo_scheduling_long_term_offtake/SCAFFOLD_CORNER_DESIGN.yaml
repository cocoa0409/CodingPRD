scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: customer_create_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Customer.fields.billing_currency]
        distinguishing_aspect: "Omitting billing_currency applies the USD default; id/version/created_at are server-minted (version starts at 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { legal_name: "Rho Energy", credit_rating: "BBB" }, as: TerminalOperator, captures: { cust: $.data.id, cust_v: $.data.version } }
          assert:
            - "Customer.${cust}.billing_currency == USD"
            - "Customer.${cust}.version == 1"
            - "Customer.${cust}.id is a prefix-free UUID"

      - name: spa_missing_required_field_rejected
        claim_type: required_fields
        grounds: [validations(priority=20), errors(ERR_INVALID_REQUEST)]
        distinguishing_aspect: "POST /api/spas without annual_contract_quantity_mmbtu fails 400 ERR_INVALID_REQUEST before any business check."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Sigma Gas", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: train_get_not_found_returns_404
        claim_type: not_found
        grounds: [validations(priority=3), errors(ERR_NOT_FOUND)]
        distinguishing_aspect: "GET on a well-formed but nonexistent train UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/trains/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: cargo_slot_computed_feed_gas_input_ignored
        claim_type: computed_fields
        grounds: [entities.CargoSlot.fields.scheduled_feed_gas_mmbtu, calculations.feed_gas_requirement]
        distinguishing_aspect: "Client-supplied scheduled_feed_gas_mmbtu is ignored; server computes ceil(3,000,001 * 1.10) == 3,300,002."
        test_recipe:
          setup: ["customer + SPA (ADP DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Tau Gasworks", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v}" }, as: CommercialManager, captures: { adp: $.data.id } }
          trigger:
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-02-01T00:00:00Z", window_end: "2027-02-08T00:00:00Z", quantity_mmbtu: 3000001, scheduled_feed_gas_mmbtu: 1 }, as: CommercialManager, captures: { slot: $.data.id, fg: $.data.scheduled_feed_gas_mmbtu } }
          assert:
            - "CargoSlot.${slot}.scheduled_feed_gas_mmbtu == 3300002"
            - "CargoSlot.${slot}.lift_status == SCHEDULED and billing_status == UNBILLED"

      - name: adp_revision_supersede_reparents_slots
        claim_type: creation
        grounds: [state_machines.AnnualDeliveryProgram.DRAFT_to_SUPERSEDED, entities.AnnualDeliveryProgram.fields.revision_no]
        distinguishing_aspect: "Second ADP for the same (spa, contract_year) gets revision_no 2; revision 1 becomes SUPERSEDED and its slot is re-parented to revision 2."
        test_recipe:
          setup: ["customer + SPA commenced (so ADP creates are meaningful), revision 1 DRAFT with one slot"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Upsilon Energy", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v}" }, as: CommercialManager, captures: { adp1: $.data.id, adp1_rev: $.data.revision_no } }
            - { call: "POST /api/adps/${adp1}/cargo-slots", payload: { window_start: "2027-02-01T00:00:00Z", window_end: "2027-02-08T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id } }
            - { call: "GET /api/spas/${spa}", payload: {}, as: CommercialManager, captures: { spa_v_after: $.data.version } }
          trigger:
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v_after}" }, as: CommercialManager, captures: { adp2: $.data.id, adp2_rev: $.data.revision_no } }
          assert:
            - "AnnualDeliveryProgram.${adp1}.revision_no == 1 and status == SUPERSEDED"
            - "AnnualDeliveryProgram.${adp2}.revision_no == 2 and status == DRAFT"
            - "CargoSlot.${slot}.adp_id == ${adp2} (re-parented)"
            - "AnnualDeliveryProgram.${adp2}.scheduled_quantity_mmbtu == 3600000"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: adp_propose_without_slots_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AnnualDeliveryProgram.DRAFT_to_PROPOSED, errors(ERR_ADP_INVALID_STATE)]
        distinguishing_aspect: "propose on an empty DRAFT ADP (zero cargo slots) is rejected; ADP stays DRAFT."
        test_recipe:
          setup: ["customer + SPA; empty DRAFT ADP"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Phi Gas", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v}" }, as: CommercialManager, captures: { adp: $.data.id } }
          trigger:
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ADP_INVALID_STATE"
            - "AnnualDeliveryProgram.${adp}.status == DRAFT"

      - name: vessel_call_depart_before_berth_rejected
        claim_type: invalid_transition
        grounds: [state_machines.VesselCall.BERTHED_to_DEPARTED, errors(ERR_CALL_INVALID_STATE)]
        distinguishing_aspect: "depart on a NOMINATED call skips three states and is rejected with ERR_CALL_INVALID_STATE."
        test_recipe:
          setup: ["confirmed ADP + slot + NOMINATED vessel call (never accepted)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Chi Marine", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id, slot_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "Gas Hasty", imo_number: "9666001", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc: $.data.id } }
          trigger:
            - { call: "POST /api/vessel-calls/${vc}/depart", payload: {}, as: MarineScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CALL_INVALID_STATE"
            - "VesselCall.${vc}.status == NOMINATED"

      - name: laytime_statement_before_departure_rejected
        claim_type: invalid_transition
        grounds: [errors(ERR_CALL_INVALID_STATE), state_machines.VesselCall.BERTHED_to_DEPARTED]
        distinguishing_aspect: "creating a laytime statement on a BERTHED (not yet DEPARTED) call fails with ERR_CALL_INVALID_STATE; no statement row is created."
        test_recipe:
          setup: ["full marine chain through berth (call BERTHED, not departed)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Psi Chartering", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id, slot_v: $.data.version } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "Gas Impatient", imo_number: "9666002", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { vc: $.data.id } }
            - { call: "POST /api/berths", payload: { name: "Berth 1", max_loa_m: 320, max_dwt_t: 120000 }, as: TerminalOperator, captures: { berth: $.data.id } }
            - { call: "POST /api/vessel-calls/${vc}/accept", payload: { berth_id: "${berth}", window_start: "2027-01-12T00:00:00Z", window_end: "2027-01-14T00:00:00Z" }, as: MarineScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T06:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/tender-nor", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-12T14:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/vessel-calls/${vc}/berth", payload: {}, as: MarineScheduler }
          trigger:
            - { call: "POST /api/vessel-calls/${vc}/laytime-statements", payload: { billing_basis: "SOF_BASIS" }, as: MarineScheduler, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CALL_INVALID_STATE"
            - "VesselCall.${vc}.status == BERTHED"

      - name: turnaround_approve_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MaintenanceTurnaround.PROPOSED_to_APPROVED, errors(ERR_TURNAROUND_INVALID_STATE)]
        distinguishing_aspect: "second approve on an already-APPROVED turnaround is rejected with ERR_TURNAROUND_INVALID_STATE; approved_by_user_id unchanged."
        test_recipe:
          setup: ["one PROPOSED turnaround by op-1"]
          setup_api_calls:
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/turnarounds", payload: { planned_start_date: "2027-03-01", planned_end_date: "2027-03-05" }, as: TerminalOperator, as_user_id: "op-1", captures: { ta: $.data.id } }
            - { call: "POST /api/turnarounds/${ta}/approve", payload: {}, as: TerminalOperator, as_user_id: "op-2" }
          trigger:
            - { call: "POST /api/turnarounds/${ta}/approve", payload: {}, as: TerminalOperator, as_user_id: "op-3", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TURNAROUND_INVALID_STATE"
            - "MaintenanceTurnaround.${ta}.status == APPROVED"
            - "MaintenanceTurnaround.${ta}.approved_by_user_id == op-2"

      - name: schedule_double_close_and_late_nomination_rejected
        claim_type: idempotency
        grounds: [state_machines.PipelineDaySchedule.OPEN_to_CLOSED, errors(ERR_SCHEDULE_INVALID_STATE)]
        distinguishing_aspect: "closing a CLOSED schedule and nominating against a CLOSED schedule both fail with ERR_SCHEDULE_INVALID_STATE."
        test_recipe:
          setup: ["pipeline with one CLOSED day schedule (closed once already)"]
          setup_api_calls:
            - { call: "POST /api/pipelines", payload: { name: "PL-1", daily_capacity_mmbtu: 500000 }, as: TerminalOperator, captures: { pipe: $.data.id } }
            - { call: "POST /api/pipelines/${pipe}/day-schedules", payload: { gas_day: "2027-06-03", capacity_mmbtu: 100000 }, as: GasScheduler, captures: { sched: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/close", payload: {}, as: GasScheduler }
          trigger:
            - { call: "POST /api/pipeline-day-schedules/${sched}/close", payload: {}, as: GasScheduler, captures: { err1: $.data.error_id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", nominated_mmbtu: 10000 }, as: GasScheduler, captures: { err2: $.data.error_id } }
          assert:
            - "second close: error_id == ERR_SCHEDULE_INVALID_STATE"
            - "late nomination with bogus cargo_slot_id on the CLOSED schedule returns ERR_NOT_FOUND (existence priority 3 beats state priority 4)"
            - "PipelineDaySchedule.${sched}.status == CLOSED"

      - name: cancelled_slot_nomination_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CargoSlot.SCHEDULED_to_CANCELLED, errors(ERR_SLOT_INVALID_STATE)]
        distinguishing_aspect: "vessel nomination against a CANCELLED (terminal) slot fails with ERR_SLOT_INVALID_STATE even with a current version."
        test_recipe:
          setup: ["confirmed ADP; slot cancelled with 47 days notice"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Omega Trading", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-04-15T00:00:00Z" }, as: TerminalOperator }
            - { call: "POST /api/cargo-slots/${slot}/cancellations", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "GET /api/cargo-slots/${slot}", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { slot_v: $.data.version } }
          trigger:
            - { call: "POST /api/cargo-slots/${slot}/vessel-nominations", payload: { vessel_name: "Gas Late", imo_number: "9666003", vessel_loa_m: 295, vessel_dwt_t: 97000, demurrage_rate_usd_per_day: 85000, expected_cargo_slot_version: "${slot_v}" }, as: CustomerRep, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SLOT_INVALID_STATE"
            - "CargoSlot.${slot}.lift_status == CANCELLED"

      - name: spa_expiry_system_transition
        claim_type: valid_transition
        grounds: [state_machines.SalesPurchaseAgreement.DELIVERIES_COMMENCED_to_EXPIRED]
        distinguishing_aspect: "system transition: a 1-year SPA read after the logical clock passes 2028-01-01T00:00:00Z reports EXPIRED without any write."
        test_recipe:
          setup: ["SPA (year 2027, term 1) commenced; commercial train exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Aleph Gas", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 1, annual_contract_quantity_mmbtu: 3600000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2028-01-01T00:00:00Z" }, as: TerminalOperator }
            - { call: "GET /api/spas/${spa}", payload: {}, as: CommercialManager, captures: { st: $.data.status } }
          assert:
            - "SalesPurchaseAgreement.${spa}.status == EXPIRED"

      - name: final_invoice_before_departure_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CargoSlot.LOADED_to_LOADED, errors(ERR_SLOT_INVALID_STATE)]
        distinguishing_aspect: "issue-final-invoice on a SCHEDULED slot (billing UNBILLED, lift not LOADED) fails with ERR_SLOT_INVALID_STATE."
        test_recipe:
