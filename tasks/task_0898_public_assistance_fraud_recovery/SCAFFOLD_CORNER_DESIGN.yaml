              payload: { overpayment_id: "${op_id}", method: "RECOUPMENT", start_date: "2026-05-01", end_date: "2027-05-01", monthly_allotment_cents: 19400, scheduled_monthly_cents: 9010 }
              as: RecoveryOfficer
              captures: { plan_id: $.data.id }
            - call: "POST /fraud-recovery/recovery-transactions"
              payload: { recovery_plan_id: "${plan_id}", amount_cents: 5000, transaction_date: "2026-05-01", method: "PAYMENT" }
              as: RecoveryOfficer
              captures: { txn_id: $.data.id }
            - call: "POST /fraud-recovery/recovery-transactions/${txn_id}/void"
              payload: { reason: "First void" }
              as: RecoveryOfficer
          trigger:
            - call: "POST /fraud-recovery/recovery-transactions/${txn_id}/void"
              payload: { reason: "Second void" }
              as: RecoveryOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ALREADY_VOIDED"
            - "response.http_status == 409"

  # ===========================================================================
  - section: entities
    instances:
      - name: subject_creation_defaults
        claim_type: defaults
        grounds: ["entities.Subject.fields.prior_ipv_count", "entities.Subject.fields.disqualification_status"]
        distinguishing_aspect: "A newly created Subject has prior_ipv_count=0 and disqualification_status=NONE."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Fresh Subj", ssn_last4: "3838", primary_program: "MEDICAID" }
              as: Intake
              captures: { subj_id: $.data.id }
          assert:
            - "Subject.${subj_id}.prior_ipv_count == 0"
            - "Subject.${subj_id}.disqualification_status == NONE"

      - name: referral_priority_score_computed
        claim_type: computed_field
        grounds: ["calculations.referral_priority_score", "entities.Referral.fields.priority_score"]
        distinguishing_aspect: "A MEDICAID + DATA_MATCH referral computes priority_score = 40 + 25 = 65."
        test_recipe:
          setup:
            - "A subject exists."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Score Subj", ssn_last4: "3939", primary_program: "MEDICAID" }
              as: Intake
              captures: { subj_id: $.data.id }
          trigger:
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "MEDICAID", source: "DATA_MATCH", allegation_summary: "Score case" }
              as: Intake
              captures: { ref_id: $.data.id }
          assert:
            - "Referral.${ref_id}.priority_score == 65"

      - name: list_overpayments_by_case_id
        claim_type: listing
        grounds: ["endpoints.GET./fraud-recovery/overpayments", "entities.Overpayment.fields.case_id"]
        distinguishing_aspect: "GET /overpayments?case_id=<id> returns the claim created under that case (FK reverse-reachability)."
        test_recipe:
          setup:
            - "A Case with one DRAFT Overpayment."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "List Subj", ssn_last4: "4040", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "PUBLIC", allegation_summary: "List case" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/overpayments"
              payload: { case_id: "${case_id}", claim_type: "AE" }
              as: Investigator
              captures: { op_id: $.data.id }
          trigger:
            - call: "GET /fraud-recovery/overpayments?case_id=${case_id}"
              payload: {}
              as: Supervisor
          assert:
            - "response.data is a list containing exactly one Overpayment whose id == ${op_id}"
            - "response.total_count == 1"

