            - "first response.status == 422 with error_id ERR_NESTED_CYCLE_DETECTED - the walk from B reaches A, then A's live row points back to B, which is already in the chain"
            - "the error is the CYCLE rung, not ERR_PAYABLE_THROUGH_NOT_PERMITTED, even though B has nested_activity_permitted false and the row is PAYABLE_THROUGH"
            - "GET /correspondent-banking/nested-relationships?respondent_bank_id=${r_b_id} returns total_count 0 after the rejected declaration"
            - "second response.status == 201 with state PROHIBITED and prohibition_reason CYCLE - a non-QUESTIONNAIRE discovery records the prohibition instead of refusing it"
            - "RespondentBank.${r_b_id}.nested_exposure_units == 0 and max_nested_depth == 0 - a PROHIBITED row carries state weight 0 and does not extend any chain"

  # ---------------------------------------------------------------------------
  # 7. RBAC - one instance per guarded endpoint family, plus every declared
  #    segregation-of-duties pair. Role model is segregation_of_duties with six
  #    roles, five opaque and one entity_backed (RespondentContact, whose
  #    X-User-ID must equal the RespondentBank id it is acting on).
  #    Convention used throughout this section: the role gate is validation
  #    priority 2 (ERR_FORBIDDEN_ROLE, 403) and therefore fires BEFORE path-id
  #    resolution, body validation and every state precondition. Denials are
  #    therefore staged on the cheapest available fixture, and each denial
  #    instance also fires the same call as the permitted role so the 403 is
  #    demonstrably about the role and not about the state of the world.
  #    ERR_UNAUTHENTICATED (priority 1) is covered in the validations section.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: respondent_approval_and_decline_belong_to_the_committee_alone
        claim_type: role_denied
        grounds:
          - roles[CommitteeApprover].exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Sweeps the four other opaque roles plus the entity-backed contact against the committee's exclusive approval endpoint on a PROSPECT respondent, where every caller would eventually fail on state - so the 403 for the five denied roles and the 409 state error for the permitted role together prove the role gate is evaluated before the state gate."
        test_recipe:
          setup: ["One PROSPECT respondent, nothing else. No assessment exists, so approval could never succeed on the merits."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/jurisdiction-profiles"
              payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.00, corridor_risk_weight: 1.00 }
              as: PlatformAdmin
            - call: "POST /correspondent-banking/respondents"
              payload: { legal_name: "Nordbank AG", swift_bic: "NORDDEFF", home_jurisdiction_code: "DE", relationship_manager_user_id: "u-fig-1", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 100 }
              as: FIGRelationshipManager
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /correspondent-banking/respondents/${r_id}/approval"
              payload: { action: "APPROVE" }
              as: ComplianceAnalyst
              as_user_id: "u-analyst-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/approval"
              payload: { action: "APPROVE" }
              as: FIGRelationshipManager
              as_user_id: "u-fig-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/approval"
              payload: { action: "APPROVE" }
              as: SanctionsOfficer
              as_user_id: "u-officer-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/approval"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /correspondent-banking/respondents/${r_id}/approval"
              payload: { action: "DECLINE" }
              as: RespondentContact
              as_user_id: "${r_id}"
            - call: "POST /correspondent-banking/respondents/${r_id}/approval"
              payload: { action: "APPROVE" }
              as: CommitteeApprover
              as_user_id: "u-committee-1"
          assert:
            - "the first five responses are all status 403 with error_id ERR_FORBIDDEN_ROLE"
            - "the RespondentContact denial is ERR_FORBIDDEN_ROLE, not ERR_RESPONDENT_SCOPE_VIOLATION - it is acting on its OWN respondent, so only the role gate can refuse it"
            - "sixth response.status == 409 with error_id ERR_INVALID_RESPONDENT_STATE - the committee clears the role gate and is stopped by the PROSPECT state instead"
            - "RespondentBank.${r_id}.dd_state is still PROSPECT and version is unchanged after all six calls"

      - name: shared_operations_accept_either_declared_role
        claim_type: role_permitted
        grounds:
          - roles[ComplianceAnalyst].shared_operations
          - roles[PlatformAdmin].shared_operations
          - roles[SanctionsOfficer].shared_operations
          - endpoints[POST /correspondent-banking/jurisdiction-profiles]
          - endpoints[POST /correspondent-banking/respondents/{respondentId}/licensing-verification]
        distinguishing_aspect: "The mirror image of the denial instances: three endpoints that name two roles each are exercised once per role and succeed both times, including the reference-data surface shared by SanctionsOfficer and PlatformAdmin, the licensing surface shared by ComplianceAnalyst and PlatformAdmin, and the restriction surface shared by ComplianceAnalyst and SanctionsOfficer. Nothing here is a peer-resource test - it establishes that shared_operations really are shared."
