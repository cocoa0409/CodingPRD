  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: min_billable_sqft_floor_on_line_item
        grounds:
          - calculations.line_item_pricing
          - entities.LineItem.fields.billable_sqft
        distinguishing_aspect: |
          Numeric floor at MIN_BILLABLE_SQFT=4.0 on POST line-items: a 20x20 pane (raw 2.78 sqft)
          bills at 4.0 (unit 5200) while a 30x24 pane (raw 5.0 > 4.0) bills at 5.0 (unit 6000).
        test_recipe:
          setup:
            - "A DRAFT quote."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { company_name: "Acme", tier: "WALK_IN", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { contractor_account_id: "${acct_id}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/line-items"
              payload: { product_type: "CUSTOM_MIRROR", glass_type: "ANNEALED", thickness_mm: 6, width_in: 20, height_in: 20, quantity: 1 }
              as: Estimator
              captures: { li_small: $.data.id, small_sqft: $.data.billable_sqft, small_unit: $.data.unit_price_cents }
          trigger:
            - call: "POST /quotes/${q_id}/line-items"
