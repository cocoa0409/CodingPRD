      - name: duplicate_reconciliation_day_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=6]", "errors[ERR_RECON_DUPLICATE_DAY]"]
        distinguishing_aspect: "Opening a second reconciliation for a business_day that already has one returns ERR_RECON_DUPLICATE_DAY (409)."
