          - entities.SpaceHold.fields.release_deadline_utc
          - state_machines.EventBooking.TENTATIVE_to_RELEASED
        distinguishing_aspect: |
          The sweep is a filtered cascade, not a blanket one. Two ACTIVE holds exist
          with release deadlines three days and one year apart; at 2027-03-11 only the
          first is expired, and only its booking may fall to RELEASED. Sweeping the
          whole ACTIVE set would destroy a hold whose deadline is still twelve months out.
        test_recipe:
          setup:
            - "a CONSUMER_SHOW booking on Ballroom B shows 2027-06-10, so its hold's release_deadline_utc is 2027-03-10T00:00:00Z"
            - "a LOCAL_EVENT booking on Ballroom C shows 2028-06-10, so its hold's release_deadline_utc is 2028-03-10T00:00:00Z"
            - "the logical clock is then moved to 2027-03-11T00:00:00Z"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
