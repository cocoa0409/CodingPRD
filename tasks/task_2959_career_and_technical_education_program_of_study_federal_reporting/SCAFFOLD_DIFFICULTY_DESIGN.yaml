      - name: employer_parity_at_exactly_half_of_attendance_passes_while_bare_minority_fails
        grounds:
          - calculations.committee_quorum_evaluation
          - validations[priority=18]
          - errors[ERR_EMPLOYER_SEAT_SHORTFALL]
          - entities.CommitteeMeeting.fields.employer_attendee_count
          - entities.CommitteeMeeting.fields.quorum_met
        distinguishing_aspect: |
          This instance probes the INCLUSIVE side of the employer-parity clause `2 * employer_attendee_count >=
          eligible_attendee_count` on the governance axis: two employers out of four eligible attendees is exactly half
          and must pass, while the same two employers out of five eligible attendees must fail — so the boundary is
          crossed by adding one non-employer attendee, not by changing the employer count.
