# =============================================================================
# SCAFFOLD.yaml — Federal-Aid Highway Project Authorization & Reimbursement
# Sections 1.0-1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Federal-Aid Highway Project Authorization & Reimbursement (Federal Highway Administration): state transportation improvement program development with fiscal constraint and public involvement requirements, project eligibility determination by funding category with federal share percentages varying by program, environmental review and right-of-way certification required before construction authorization, project authorization creating an obligation of federal funds with agreement terms, competitive bidding requirements and contract award review with disadvantaged business enterprise goals, progress billing and reimbursement of state expenditures with documentation and eligibility review, cost overrun and change order handling with federal participation limits, project closeout, final voucher and audit with potential repayment of ineligible costs

domain_name: federal-aid-highway
api_prefix: /federal-aid

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# -----------------------------------------------------------------------------
# Named constants — the single definition point for every CONST.* referenced
# anywhere in this scaffold. Downstream generators MUST NOT re-derive values.
# -----------------------------------------------------------------------------
constants:
  CLOCK_DEFAULT_START: "2026-09-01T00:00:00Z"
  STIP_DURATION_YEARS: 4
  STIP_COMMENT_PERIOD_DAYS: 30
  MIN_PUBLIC_COMMENTS: 1
  EIS_COMMENT_PERIOD_DAYS: 45
  MIN_ADVERTISEMENT_DAYS: 21
  AUDIT_FINDINGS_RESPONSE_DAYS: 30
  BASE_SHARE_NHPP: 0.80
  BASE_SHARE_STBG: 0.80
  BASE_SHARE_HSIP: 0.90
  BASE_SHARE_CMAQ: 0.80
  BASE_SHARE_TAP: 0.80
  INTERSTATE_SYSTEM_BUMP: 0.10
  INTERSTATE_SHARE_CAP: 0.90
  SAFETY_FULL_SHARE: 1.00
  SAFETY_FULL_SHARE_ACTIVITIES: [SIGNAGE_LIGHTING, GUARDRAIL_INSTALL, PEDESTRIAN_CROSSING]
  FEDERAL_LAND_SLIDING_THRESHOLD: 0.05
  FEDERAL_LAND_SHARE_CAP: 0.95
  OVERRUN_PARTICIPATION_CAP_PCT: 0.20
  ACTIVITY_CODES: [ROAD_RESURFACING, BRIDGE_REPLACEMENT, SIGNAGE_LIGHTING, GUARDRAIL_INSTALL, PEDESTRIAN_CROSSING, TRANSIT_EXPANSION]
  FUNDING_PROGRAM_CODES: [NHPP, STBG, HSIP, CMAQ, TAP]

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (11 entities, flat topology with FK links)
# common_fields: true expands to id (server-minted UUID, no type prefix),
# created_at (ISO 8601 UTC, three fractional digits), updated_at (same,
# refreshed on every mutation including cascaded side effects), version
# (integer, starts at 1, +1 on every mutation).
# =============================================================================
entities:
  - name: FundingProgram
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "Funding category code; one of CONST.FUNDING_PROGRAM_CODES", constraints: "enum: NHPP | STBG | HSIP | CMAQ | TAP" }
      - { name: name, type: string, source: input, description: "Human-readable program name" }
      - { name: eligible_activity_codes, type: array, source: input, description: "Array of activity codes eligible under this program; each must be in CONST.ACTIVITY_CODES" }
      - { name: base_federal_share_pct, type: number, source: computed, description: "Base federal share for this program code, from CONST.BASE_SHARE_<code>; client-supplied share values are ignored" }

  - name: Apportionment
    parent: null
    common_fields: true
    fields:
      - { name: funding_program_id, type: string, source: input, description: "FK -> FundingProgram.id; program this apportionment funds" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code receiving the apportionment" }
      - { name: federal_fiscal_year, type: integer, source: input, description: "Federal fiscal year (Oct 1 - Sep 30); a date in Oct-Dec of calendar year Y belongs to FFY Y+1, Jan-Sep of Y belongs to FFY Y" }
      - { name: apportioned_cents, type: integer, source: input, description: "Total federal funds apportioned for this (program, state, FFY) cell", constraints: ">= 0" }
      - { name: obligated_cents, type: integer, source: computed, description: "Sum of Authorization.obligated_cents drawn on this cell (authorizations not yet CLOSED); default 0" }
      - { name: available_cents, type: integer, source: computed, description: "apportioned_cents - obligated_cents; recomputed on every obligation, change-order draw, and deobligation" }
      - { name: uniqueness, type: string, source: system, description: "At most one Apportionment row per (funding_program_id, state_code, federal_fiscal_year); duplicates rejected with ERR_DUPLICATE_APPORTIONMENT" }

  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code owning this STIP" }
      - { name: state_federal_land_pct, type: number, source: input, description: "Fraction of state land area federally owned, 0..1; drives the sliding-scale share adjustment" }
      - { name: start_federal_fiscal_year, type: integer, source: input, description: "First FFY covered by this STIP" }
      - { name: end_federal_fiscal_year, type: integer, source: computed, description: "start_federal_fiscal_year + CONST.STIP_DURATION_YEARS - 1" }
      - { name: description, type: string, source: input, description: "STIP narrative" }
      - { name: status, type: enum, source: system, description: "PUBLIC_INVOLVEMENT | SUBMITTED | APPROVED; cyclic via reject and open-amendment" }
      - { name: comment_period_opened_at, type: datetime, source: system, description: "Logical-clock time at which the current public comment window opened; set at creation and reset on every amendment reopening" }
      - { name: amendment_count, type: integer, source: system, description: "Number of times an APPROVED STIP has been reopened for amendment; starts at 0" }
      - { name: total_programmed_federal_cents, type: integer, source: computed, description: "Sum of provisional_federal_estimate_cents over this STIP's projects with status in {NOMINATED, ELIGIBLE, AUTHORIZED, BIDDING, BIDS_OPENED, UNDER_CONSTRUCTION, COMPLETE}" }

  - name: PublicComment
    parent: StateProgram
    common_fields: false
    fields:
      - { name: stip_id, type: string, source: system, description: "FK -> StateProgram.id; taken from the URL path of the comments endpoint" }
      - { name: author_name, type: string, source: input, description: "Name of the commenting member of the public" }
      - { name: comment_text, type: string, source: input, description: "Free-text public comment" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: stip_id, type: string, source: input, description: "FK -> StateProgram.id; STIP programming this project" }
      - { name: funding_program_id, type: string, source: input, description: "FK -> FundingProgram.id; funding category paying for this project" }
      - { name: route_name, type: string, source: input, description: "Route or corridor name" }
      - { name: description, type: string, source: input, description: "Project description" }
      - { name: activity_code, type: enum, source: input, description: "Work type; one of CONST.ACTIVITY_CODES" }
      - { name: is_interstate_system, type: boolean, source: input, description: "True when the project is on the Interstate System" }
      - { name: dbe_goal_pct, type: number, source: input, description: "Disadvantaged Business Enterprise contract goal as a fraction, 0..1" }
      - { name: total_estimated_cost_cents, type: integer, source: input, description: "Total estimated project cost in cents", constraints: "> 0" }
      - { name: provisional_federal_share_pct, type: number, source: computed, description: "Statutory-base variant of federal_share_determination (program base share only); set at creation and recomputed on PATCH cost changes" }
      - { name: provisional_federal_estimate_cents, type: integer, source: computed, description: "round_half_up(total_estimated_cost_cents * provisional_federal_share_pct, 0); used by the STIP fiscal-constraint check" }
      - { name: determined_federal_share_pct, type: number, source: computed, description: "Adjusted-full variant of federal_share_determination; null until eligibility determination, then pinned" }
      - { name: status, type: enum, source: system, description: "NOMINATED | ELIGIBLE | INELIGIBLE | AUTHORIZED | BIDDING | BIDS_OPENED | UNDER_CONSTRUCTION | COMPLETE | CLOSED_OUT" }
      - { name: advertised_on_date, type: datetime, source: system, description: "Logical-clock time when the project was advertised for bids; null until advertised" }
      - { name: awarded_bid_id, type: string, source: system, description: "Id of the winning Bid after award; null until awarded" }

  - name: ProjectClearance
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project being cleared" }
      - { name: kind, type: enum, source: input, description: "ENVIRONMENTAL | RIGHT_OF_WAY" }
      - { name: nepa_class, type: enum, source: input, description: "CE | EA | EIS; required iff kind == ENVIRONMENTAL, must be null for RIGHT_OF_WAY" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CLEARED | REJECTED; for kind RIGHT_OF_WAY, CLEARED means certified" }
      - { name: row_cert_level, type: enum, source: system, description: "LEVEL_1_FULL | LEVEL_2_CONDITIONAL; set from the decide payload when a RIGHT_OF_WAY clearance is CLEARED; null otherwise" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding FHWAReviewer; null until decided" }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project being authorized" }
      - { name: agreement_number, type: string, source: input, description: "Federal-aid agreement number recorded in the project agreement" }
      - { name: initial_obligated_cents, type: integer, source: input, description: "Federal funds obligated at authorization", constraints: "> 0" }
      - { name: apportionment_id, type: string, source: system, description: "FK -> Apportionment.id; the (program, state, FFY-of-clock) cell this authorization draws on, selected by the server" }
      - { name: federal_share_pct, type: number, source: system, description: "Agreement terms: pinned snapshot of Project.determined_federal_share_pct at authorization; later program or project changes never alter it" }
      - { name: obligated_cents, type: integer, source: computed, description: "Current federal obligation: starts at initial_obligated_cents, grows by approved change-order federal participation, and is set to net federal outlay at closeout deobligation" }
      - { name: reimbursed_cents, type: integer, source: computed, description: "Sum of federal_reimbursable_cents over this authorization's APPROVED vouchers" }
      - { name: repaid_cents, type: integer, source: computed, description: "Sum of recorded audit repayments applied to this authorization" }
      - { name: cumulative_change_order_federal_cents, type: integer, source: computed, description: "Sum of federal_participation_cents over this authorization's FEDERAL_APPROVED change orders" }
      - { name: status, type: enum, source: system, description: "OBLIGATED | FULLY_DRAWN | CLOSED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock time of closeout; null until CLOSED" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; set from the open-bids path parameter" }
      - { name: contractor_name, type: string, source: input, description: "Bidder name" }
      - { name: bid_amount_cents, type: integer, source: input, description: "Bid price in cents", constraints: "> 0" }
      - { name: is_responsive, type: boolean, source: input, description: "Whether the bid is responsive to the solicitation" }
      - { name: submission_seq, type: integer, source: system, description: "0-based position of this bid in the open-bids payload array; the only tie-break after bid_amount_cents" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | AWARDED | NOT_AWARDED" }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; agreement this progress billing draws on" }
      - { name: period_start_date, type: datetime, source: input, description: "Start of the billing period (inclusive)" }
      - { name: period_end_date, type: datetime, source: input, description: "End of the billing period (exclusive); must be strictly after period_start_date; periods are half-open [start, end)" }
      - { name: line_items, type: array, source: input, description: "Non-empty array of { description: string, eligible_amount_cents: integer > 0 }" }
      - { name: documentation_complete, type: boolean, source: input, description: "State certification that supporting documentation is complete" }
      - { name: is_final, type: boolean, source: input, description: "True for the final voucher that closes construction billing" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | REJECTED; REJECTED returns to review via submit" }
      - { name: claimed_amount_cents, type: integer, source: computed, description: "Sum of eligible_amount_cents over line_items" }
      - { name: eligible_amount_cents, type: integer, source: computed, description: "Sum of eligible_amount_cents over approved lines (line_items minus decide.ineligible_line_indexes); null until approved" }
      - { name: federal_reimbursable_cents, type: integer, source: computed, description: "Per voucher_reimbursement: per-line round_half_up then sum, clamped to remaining obligation; null until approved" }
      - { name: ineligible_line_indexes, type: array, source: system, description: "0-based line indexes struck by the reviewer at approval; null until decided" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent submitting StateDOTEngineer" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding FHWAReviewer; null until decided" }
      - { name: resubmission_count, type: integer, source: system, description: "Number of times this voucher returned from REJECTED to UNDER_REVIEW; starts at 0" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; agreement this overrun modifies" }
      - { name: description, type: string, source: input, description: "Change order description" }
      - { name: delta_cost_cents, type: integer, source: input, description: "Cost increase in cents (positive overrun)", constraints: "> 0" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the creating StateDOTEngineer" }
      - { name: state_concurred_by_user_id, type: string, source: system, description: "X-User-ID of the concurring StateDOTEngineer; must differ from requested_by_user_id" }
      - { name: federal_participation_cents, type: integer, source: computed, description: "Per change_order_federal_participation; null until FEDERAL_APPROVED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | STATE_CONCURRED | FEDERAL_APPROVED | FEDERAL_REJECTED" }

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; completed project under audit" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the creating FHWAReviewer; must differ from the final voucher's decided_by_user_id" }
      - { name: status, type: enum, source: system, description: "INITIATED | FINDINGS_ISSUED | FINAL | CLOSED" }
      - { name: findings_text, type: string, source: system, description: "Audit findings narrative; set by issue-findings" }
      - { name: ineligible_amount_cents, type: integer, source: system, description: "State expenditures found ineligible; set by issue-findings", constraints: ">= 0" }
      - { name: findings_issued_at, type: datetime, source: system, description: "Logical-clock time findings were issued; null until issued" }
      - { name: final_eligible_federal_share_cents, type: integer, source: computed, description: "Per authorization_ledger_reconciliation; null until finalized" }
      - { name: repayment_due_cents, type: integer, source: computed, description: "max(0, authorization.reimbursed_cents - final_eligible_federal_share_cents); null until finalized" }
      - { name: repaid_cents, type: integer, source: system, description: "Cumulative repayment recorded via record-repayment; starts at 0" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock time the audit CLOSED; null until closed" }

# =============================================================================
# 1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: StateProgram
    initial_state: PUBLIC_INVOLVEMENT
    terminal_states: []
    transitions:
      - from: PUBLIC_INVOLVEMENT
        to: SUBMITTED
        trigger: "POST /federal-aid/stips/{id}/submit"
        actor: StateDOTPlanner
        preconditions:
          - "logical clock >= comment_period_opened_at + CONST.STIP_COMMENT_PERIOD_DAYS (ERR_COMMENT_PERIOD_OPEN)"
          - "count of PublicComment rows for this STIP with created_at >= comment_period_opened_at >= CONST.MIN_PUBLIC_COMMENTS (ERR_PUBLIC_INVOLVEMENT_INCOMPLETE)"
        side_effects:
          - "status -> SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /federal-aid/stips/{id}/decide with decision=APPROVE"
        actor: FHWADivisionAdmin
        preconditions:
          - "fiscal_constraint_check passes for every funding program used by this STIP (ERR_FISCAL_CONSTRAINT_VIOLATED)"
        side_effects:
          - "status -> APPROVED"
      - from: SUBMITTED
        to: PUBLIC_INVOLVEMENT
        trigger: "POST /federal-aid/stips/{id}/decide with decision=REJECT"
        actor: FHWADivisionAdmin
        preconditions: []
        side_effects:
          - "status -> PUBLIC_INVOLVEMENT"
          - "comment_period_opened_at is NOT reset and existing comments are preserved, so an already-elapsed window permits immediate resubmission"
      - from: APPROVED
        to: PUBLIC_INVOLVEMENT
        trigger: "POST /federal-aid/stips/{id}/open-amendment, or system cascade when POST /federal-aid/projects creates a project referencing an APPROVED STIP"
        actor: StateDOTPlanner
        preconditions: []
        side_effects:
          - "status -> PUBLIC_INVOLVEMENT"
          - "comment_period_opened_at := current logical clock (a fresh public comment window opens)"
          - "amendment_count += 1"
          - "while PUBLIC_INVOLVEMENT, determine-eligibility and authorization on this STIP's projects fail with ERR_STIP_NOT_APPROVED"
        note: "This cycle is the amendment loop: APPROVED -> PUBLIC_INVOLVEMENT -> SUBMITTED -> APPROVED."

  - entity: Project
    initial_state: NOMINATED
    terminal_states: [INELIGIBLE, CLOSED_OUT]
    transitions:
      - from: NOMINATED
        to: ELIGIBLE
        trigger: "POST /federal-aid/projects/{id}/determine-eligibility with determination=ELIGIBLE"
        actor: FHWADivisionAdmin
        preconditions:
          - "owning StateProgram.status == APPROVED (ERR_STIP_NOT_APPROVED)"
          - "Project.activity_code is in FundingProgram.eligible_activity_codes (ERR_INELIGIBLE_ACTIVITY)"
        side_effects:
          - "determined_federal_share_pct := federal_share_determination (adjusted_full variant)"
          - "status -> ELIGIBLE"
      - from: NOMINATED
        to: INELIGIBLE
        trigger: "POST /federal-aid/projects/{id}/determine-eligibility with determination=INELIGIBLE"
        actor: FHWADivisionAdmin
        preconditions:
          - "owning StateProgram.status == APPROVED (ERR_STIP_NOT_APPROVED)"
        side_effects:
          - "status -> INELIGIBLE (terminal)"
      - from: ELIGIBLE
        to: AUTHORIZED
        trigger: "system, on successful POST /federal-aid/authorizations for this project"
        actor: FHWADivisionAdmin
        preconditions:
          - "see the authorize endpoint: environmental clearance CLEARED, right-of-way clearance CLEARED, STIP APPROVED, apportionment availability sufficient"
        side_effects:
          - "status -> AUTHORIZED"
      - from: AUTHORIZED
        to: BIDDING
        trigger: "POST /federal-aid/projects/{id}/advertise"
        actor: StateDOTEngineer
        preconditions: []
        side_effects:
          - "advertised_on_date := current logical clock"
          - "status -> BIDDING"
      - from: BIDDING
        to: BIDS_OPENED
        trigger: "POST /federal-aid/projects/{id}/open-bids"
        actor: StateDOTEngineer
        preconditions:
          - "logical clock >= advertised_on_date + CONST.MIN_ADVERTISEMENT_DAYS (ERR_ADVERTISEMENT_PERIOD_SHORT)"
          - "bids payload is a non-empty array (ERR_INVALID_REQUEST)"
        side_effects:
          - "one Bid row created per payload entry with submission_seq equal to its array index and status SUBMITTED"
          - "status -> BIDS_OPENED"
      - from: BIDS_OPENED
        to: UNDER_CONSTRUCTION
        trigger: "POST /federal-aid/projects/{id}/award"
        actor: FHWAReviewer
        preconditions:
          - "bid_id references a Bid of this project with is_responsive == true (ERR_BID_NOT_RESPONSIVE)"
          - "at least one responsive bid exists (ERR_NO_RESPONSIVE_BIDS)"
          - "bid_id is the winner per lowest_responsive_bid_selection (ERR_AWARD_NOT_LOWEST_RESPONSIVE)"
          - "dbe_commitment_pct >= Project.dbe_goal_pct OR good_faith_effort_documented == true (ERR_DBE_GOAL_NOT_MET)"
        side_effects:
          - "winning Bid.status -> AWARDED; every other Bid of the project -> NOT_AWARDED"
          - "awarded_bid_id := bid_id"
          - "status -> UNDER_CONSTRUCTION"
      - from: UNDER_CONSTRUCTION
        to: COMPLETE
        trigger: "system, when a voucher with is_final == true is approved (POST /federal-aid/vouchers/{id}/decide, decision=APPROVE)"
        actor: system
        preconditions:
          - "no ChangeOrder of the same authorization in REQUESTED or STATE_CONCURRED (ERR_OPEN_CHANGE_ORDERS)"
          - "the project's RIGHT_OF_WAY clearance is CLEARED with row_cert_level == LEVEL_1_FULL (ERR_ROW_NOT_CERTIFIED)"
        side_effects:
          - "status -> COMPLETE"
      - from: COMPLETE
        to: CLOSED_OUT
        trigger: "system, when the project's Audit transitions to CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CLOSED_OUT (terminal)"

  - entity: ProjectClearance
    initial_state: SUBMITTED
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /federal-aid/clearances/{id}/decide with decision=CLEARED"
        actor: FHWAReviewer
        preconditions:
          - "if kind == ENVIRONMENTAL and nepa_class == EIS: logical clock >= created_at + CONST.EIS_COMMENT_PERIOD_DAYS (ERR_COMMENT_PERIOD_OPEN)"
          - "if kind == RIGHT_OF_WAY: decide payload must include row_cert_level (ERR_INVALID_REQUEST)"
        side_effects:
          - "status -> CLEARED; for kind RIGHT_OF_WAY, row_cert_level is set from the payload"
          - "decided_by_user_id := X-User-ID of the caller"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /federal-aid/clearances/{id}/decide with decision=REJECT"
        actor: FHWAReviewer
        preconditions: []
        side_effects:
          - "status -> REJECTED; a replacement clearance of the same kind may then be created (the ERR_CLEARANCE_KIND_EXISTS uniqueness only counts non-REJECTED rows)"
          - "decided_by_user_id := X-User-ID of the caller"

  - entity: Authorization
    initial_state: OBLIGATED
    terminal_states: [CLOSED]
    transitions:
      - from: OBLIGATED
        to: FULLY_DRAWN
        trigger: "system, when a voucher approval raises reimbursed_cents to exactly obligated_cents"
        actor: system
        preconditions: []
        side_effects:
          - "status -> FULLY_DRAWN; subsequent POST /federal-aid/vouchers for this authorization fail with ERR_AUTHORIZATION_NOT_OBLIGATED"
      - from: FULLY_DRAWN
        to: OBLIGATED
        trigger: "system, when a change-order approval raises obligated_cents above reimbursed_cents"
        actor: system
        preconditions: []
        side_effects:
          - "status -> OBLIGATED"
      - from: OBLIGATED
        to: CLOSED
        trigger: "system cascade when the project's Audit CLOSES"
        actor: system
        preconditions: []
        side_effects:
          - "deobligation := obligated_cents - (reimbursed_cents - repaid_cents)"
          - "obligated_cents := reimbursed_cents - repaid_cents"
          - "Apportionment.obligated_cents -= deobligation; Apportionment.available_cents recomputed"
          - "closed_at := current logical clock; status -> CLOSED"
      - from: FULLY_DRAWN
        to: CLOSED
        trigger: "system cascade when the project's Audit CLOSES"
        actor: system
        preconditions: []
        side_effects:
          - "same deobligation cascade as OBLIGATED -> CLOSED"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, NOT_AWARDED]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /federal-aid/projects/{id}/award naming this bid"
        actor: FHWAReviewer
        preconditions:
          - "this bid is the winner per lowest_responsive_bid_selection"
        side_effects:
          - "status -> AWARDED"
      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: "POST /federal-aid/projects/{id}/award naming a different bid of the same project"
        actor: FHWAReviewer
        preconditions: []
        side_effects:
          - "status -> NOT_AWARDED"

  - entity: Voucher
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /federal-aid/vouchers/{id}/submit"
        actor: StateDOTEngineer
        preconditions:
          - "Authorization.status == OBLIGATED (ERR_AUTHORIZATION_NOT_OBLIGATED)"
          - "Project.status == UNDER_CONSTRUCTION (ERR_INVALID_STATE)"
          - "documentation_complete == true (ERR_DOCUMENTATION_INCOMPLETE)"
          - "half-open period [period_start_date, period_end_date) must not intersect any non-REJECTED sibling voucher's period on the same authorization (ERR_BILLING_PERIOD_OVERLAP); adjacency (prior end == next start) is allowed"
        side_effects:
          - "status -> UNDER_REVIEW"
          - "submitted_by_user_id := X-User-ID of the caller"
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /federal-aid/vouchers/{id}/submit (resubmission; optional revised period/line_items/documentation_complete in payload)"
        actor: StateDOTEngineer
        preconditions:
          - "same four preconditions as DRAFT -> UNDER_REVIEW, evaluated against the revised values"
        side_effects:
          - "any revised payload fields replace the stored values; claimed_amount_cents recomputed"
          - "resubmission_count += 1"
          - "status -> UNDER_REVIEW; submitted_by_user_id updated"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /federal-aid/vouchers/{id}/decide with decision=APPROVE"
        actor: FHWAReviewer
        preconditions:
          - "ineligible_line_indexes, when present, must be valid 0-based indexes into line_items (ERR_INVALID_REQUEST)"
          - "if is_final == true: no sibling ChangeOrder in REQUESTED or STATE_CONCURRED (ERR_OPEN_CHANGE_ORDERS) and project ROW clearance row_cert_level == LEVEL_1_FULL (ERR_ROW_NOT_CERTIFIED)"
        side_effects:
          - "voucher_reimbursement computes eligible_amount_cents and federal_reimbursable_cents"
          - "status -> APPROVED; decided_by_user_id := X-User-ID of the caller"
          - "CASCADE link 1: Authorization.reimbursed_cents += federal_reimbursable_cents"
          - "CASCADE link 2: if Authorization.reimbursed_cents == Authorization.obligated_cents then Authorization OBLIGATED -> FULLY_DRAWN"
          - "CASCADE link 3: if voucher.is_final then Project UNDER_CONSTRUCTION -> COMPLETE"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /federal-aid/vouchers/{id}/decide with decision=REJECT"
        actor: FHWAReviewer
        preconditions: []
        side_effects:
          - "status -> REJECTED; decided_by_user_id := X-User-ID of the caller; no reimbursement posted"

  - entity: ChangeOrder
    initial_state: REQUESTED
    terminal_states: [FEDERAL_APPROVED, FEDERAL_REJECTED]
    transitions:
      - from: REQUESTED
        to: STATE_CONCURRED
        trigger: "POST /federal-aid/change-orders/{id}/state-concur"
        actor: StateDOTEngineer
        preconditions:
          - "X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "state_concurred_by_user_id := X-User-ID of the caller"
          - "status -> STATE_CONCURRED"
      - from: STATE_CONCURRED
        to: FEDERAL_APPROVED
        trigger: "POST /federal-aid/change-orders/{id}/federal-decide with decision=APPROVE"
        actor: FHWAReviewer
        preconditions:
          - "Apportionment.available_cents >= computed federal_participation_cents (ERR_APPORTIONMENT_EXCEEDED)"
        side_effects:
          - "federal_participation_cents := change_order_federal_participation (cap-clamped)"
          - "status -> FEDERAL_APPROVED"
          - "Authorization.obligated_cents += federal_participation_cents; cumulative_change_order_federal_cents += federal_participation_cents"
          - "Apportionment.obligated_cents += federal_participation_cents; available_cents recomputed"
          - "if Authorization was FULLY_DRAWN it returns to OBLIGATED"
          - "Project.total_estimated_cost_cents += delta_cost_cents"
      - from: STATE_CONCURRED
        to: FEDERAL_REJECTED
        trigger: "POST /federal-aid/change-orders/{id}/federal-decide with decision=REJECT"
        actor: FHWAReviewer
        preconditions: []
        side_effects:
          - "status -> FEDERAL_REJECTED (terminal); no participation posted"

  - entity: Audit
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: FINDINGS_ISSUED
        trigger: "POST /federal-aid/audits/{id}/issue-findings"
        actor: FHWAReviewer
        preconditions: []
        side_effects:
          - "findings_text and ineligible_amount_cents recorded; findings_issued_at := current logical clock"
          - "status -> FINDINGS_ISSUED"
      - from: FINDINGS_ISSUED
        to: FINAL
        trigger: "POST /federal-aid/audits/{id}/finalize"
        actor: FHWAReviewer
        preconditions:
          - "logical clock >= findings_issued_at + CONST.AUDIT_FINDINGS_RESPONSE_DAYS (ERR_AUDIT_RESPONSE_WINDOW_OPEN)"
        side_effects:
          - "authorization_ledger_reconciliation computes final_eligible_federal_share_cents and repayment_due_cents"
          - "status -> FINAL"
          - "if repayment_due_cents == 0: immediately continue to CLOSED with the closeout cascade (below)"
      - from: FINAL
        to: CLOSED
        trigger: "POST /federal-aid/audits/{id}/record-repayment bringing repaid_cents to exactly repayment_due_cents, or system auto-close when repayment_due_cents == 0 at finalize"
        actor: FHWAReviewer
        preconditions:
          - "record-repayment amount_cents <= repayment_due_cents - repaid_cents (ERR_REPAYMENT_EXCEEDS_DUE)"
        side_effects:
          - "repaid_cents += amount_cents (for the record-repayment path)"
          - "status -> CLOSED; closed_at := current logical clock"
          - "CASCADE link 1 (audit closed): Authorization deobligation posts (obligated_cents := reimbursed_cents - repaid_cents) and Authorization -> CLOSED"
          - "CASCADE link 2 (authorization deobligated): Apportionment.obligated_cents -= deobligation and available_cents recomputed"
          - "CASCADE link 3 (audit closed): Project COMPLETE -> CLOSED_OUT"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: project-patch-stale-version
    parent_entity: Project
    write_endpoint: "PATCH /federal-aid/projects/{id}"
    occ_field: expected_project_version
    description: |
      Updating a Project whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer
      has just patched the estimate (or a cascade such as award or
      change-order approval has bumped the version) and the current writer's
      view of the project is therefore stale. Stated in OCC terms only: the
      request fails when expected_project_version != Project.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table (7 rules)
# =============================================================================
calculations:
  - name: federal_share_determination
    trigger: "Project creation and PATCH (statutory_base variant); POST /federal-aid/projects/{id}/determine-eligibility with determination=ELIGIBLE (adjusted_full variant)"
    algorithm: tiered_pricing
    formula: |
      base = CONST.BASE_SHARE_<FundingProgram.code>   # NHPP/STBG/CMAQ/TAP -> 0.80, HSIP -> 0.90
      if project.is_interstate_system == true:
          base = min(CONST.INTERSTATE_SHARE_CAP, base + CONST.INTERSTATE_SYSTEM_BUMP)
      if FundingProgram.code == "HSIP" and project.activity_code in CONST.SAFETY_FULL_SHARE_ACTIVITIES:
          share = CONST.SAFETY_FULL_SHARE            # safety override wins over land adjustment
      else:
          if stip.state_federal_land_pct > CONST.FEDERAL_LAND_SLIDING_THRESHOLD:
              base = min(CONST.FEDERAL_LAND_SHARE_CAP,
                         base + (CONST.FEDERAL_LAND_SHARE_CAP - base) * stip.state_federal_land_pct)
          share = base
      share = round_half_up(share, 4 decimal places)
      Evaluation order is pinned: interstate bump first, safety override second (it discards
      the land adjustment entirely), land sliding scale third (only when no safety override).
    input_set: "The project, its FundingProgram, and its owning StateProgram (for state_federal_land_pct)"
    constants:
      BASE_SHARE_NHPP: 0.80
      BASE_SHARE_STBG: 0.80
      BASE_SHARE_HSIP: 0.90
      BASE_SHARE_CMAQ: 0.80
      BASE_SHARE_TAP: 0.80
      INTERSTATE_SYSTEM_BUMP: 0.10
      INTERSTATE_SHARE_CAP: 0.90
      SAFETY_FULL_SHARE: 1.00
      FEDERAL_LAND_SLIDING_THRESHOLD: 0.05
      FEDERAL_LAND_SHARE_CAP: 0.95
    precision: "4 decimal places, round_half_up"
    variants:
      - name: statutory_base
        when: "project creation and PATCH of total_estimated_cost_cents; feeds provisional_federal_share_pct and provisional_federal_estimate_cents"
        difference: "uses only CONST.BASE_SHARE_<code>; interstate bump, safety override, and land sliding scale are all ignored, so provisional and determined shares diverge whenever any adjustment applies"
      - name: adjusted_full
        when: "eligibility determination; feeds determined_federal_share_pct and is later pinned onto the Authorization"
        difference: "applies the full branch chain above"

  - name: apportionment_availability
    trigger: "POST /federal-aid/authorizations (chronological_committed); POST /federal-aid/stips/{id}/decide with APPROVE (forward_looking_programmed via fiscal_constraint_check)"
    algorithm: aggregation
    formula: |
      chronological_committed (hard gate at authorization time):
        cell = the unique Apportionment row for (project.funding_program_id, stip.state_code,
               FFY of the current logical clock)   # missing row -> ERR_NO_APPORTIONMENT_FOR_FFY
        available = cell.apportioned_cents - cell.obligated_cents
        require initial_obligated_cents <= available  (equality passes)
      forward_looking_programmed (STIP approval fiscal constraint):
        for each program p used by this STIP's projects with status in
        {NOMINATED, ELIGIBLE, AUTHORIZED, BIDDING, BIDS_OPENED, UNDER_CONSTRUCTION, COMPLETE}:
          programmed = sum of Project.provisional_federal_estimate_cents for those projects on p
          capacity   = sum over Apportionment rows (p, stip.state_code, ffy in
                       [start_federal_fiscal_year, end_federal_fiscal_year])
                       of (apportioned_cents - obligated_cents)   # missing cells contribute 0
          require programmed <= capacity  (equality passes)
    input_set: "Apportionment rows keyed by (program, state, FFY); for the forward-looking variant also the STIP's non-terminal projects"
    constants: {}
    precision: "integer cents"
    variants:
      - name: chronological_committed
        when: "authorizing a project"
        difference: "counts only posted obligations minus deobligations in the single current-FFY cell; planned but unauthorized projects are ignored"
      - name: forward_looking_programmed
        when: "approving a STIP"
        difference: "additionally subtracts nothing but reserves nothing either; it compares the STIP's full programmed estimates against the 4-year remaining capacity, so it can fail on identical Apportionment rows where chronological_committed still shows room"

  - name: fiscal_constraint_check
    trigger: "POST /federal-aid/stips/{id}/decide with decision=APPROVE"
    algorithm: threshold
    formula: |
      Per funding program p used by this STIP (project statuses as in apportionment_availability):
        programmed(p) <= capacity(p)   # boundary: equality PASSES
      Any program failing -> the whole approval fails with ERR_FISCAL_CONSTRAINT_VIOLATED.
    input_set: "This STIP's projects and the Apportionment rows covering the STIP's FFY span"
    constants: {}
    precision: "integer cents"

  - name: voucher_reimbursement
    trigger: "POST /federal-aid/vouchers/{id}/decide with decision=APPROVE"
    algorithm: aggregation
    formula: |
      approved_lines = line_items with indexes in decide.ineligible_line_indexes removed
      for each approved line:
          line_federal_cents = round_half_up(line.eligible_amount_cents * Authorization.federal_share_pct, 0)
      eligible_amount_cents = sum of eligible_amount_cents over approved lines
      federal_reimbursable_cents = min( sum(line_federal_cents),
                                        Authorization.obligated_cents - Authorization.reimbursed_cents )
      Rounding order is pinned: round EACH LINE to whole cents first (round_half_up), then sum.
      Sum-then-round is forbidden and yields different cents (e.g. share 0.90 on lines
      [105, 105]: per-line 95 + 95 = 190; sum-then-round would give round(210 * 0.9) = 189).
    input_set: "The voucher's line_items minus ineligible indexes; the authorization's pinned share and remaining obligation"
    constants: {}
    precision: "integer cents; per-line round_half_up before summation"

  - name: change_order_federal_participation
    trigger: "POST /federal-aid/change-orders/{id}/federal-decide with decision=APPROVE"
    algorithm: threshold
    formula: |
      step 1: eligible_cents = round_half_up(ChangeOrder.delta_cost_cents * Authorization.federal_share_pct, 0)
      step 2: cap_cents = round_half_up(Authorization.initial_obligated_cents * CONST.OVERRUN_PARTICIPATION_CAP_PCT, 0)
      step 3: already_participated_cents = Authorization.cumulative_change_order_federal_cents  (excludes this change order)
      step 4: federal_participation_cents = max(0, min(eligible_cents, cap_cents - already_participated_cents))
      Evaluation order is pinned step 1 -> step 4: participation feeds cumulative participation,
      which bounds the next change order's room, so orders must be resolved in approval order
      (earliest created_at first if approval order matters to a reader).
    input_set: "The change order, its authorization's pinned share and initial obligation, and prior FEDERAL_APPROVED change orders on the same authorization"
    constants:
      OVERRUN_PARTICIPATION_CAP_PCT: 0.20
    precision: "integer cents, round_half_up"

  - name: lowest_responsive_bid_selection
    trigger: "POST /federal-aid/projects/{id}/award"
    algorithm: weighted_scoring
    formula: |
      candidates = Bid rows of this project with is_responsive == true and status == SUBMITTED
      if candidates is empty -> ERR_NO_RESPONSIVE_BIDS
      winner = candidates ordered by (bid_amount_cents ASC, submission_seq ASC), first element
      award payloads naming any other bid -> ERR_AWARD_NOT_LOWEST_RESPONSIVE
      submission_seq (the open-bids payload array index) is the only tie-break; ids are never used.
    input_set: "All Bid rows of the project created by the open-bids call"
    constants: {}
    precision: "integer cents"

  - name: authorization_ledger_reconciliation
    trigger: "POST /federal-aid/audits/{id}/finalize; closeout cascade on Audit CLOSED"
    algorithm: aggregation
    formula: |
      At finalize:
        approved_eligible_total = sum of Voucher.eligible_amount_cents over this authorization's APPROVED vouchers
        final_eligible_federal_share_cents = max(0, round_half_up(
            (approved_eligible_total - Audit.ineligible_amount_cents) * Authorization.federal_share_pct, 0))
        repayment_due_cents = max(0, Authorization.reimbursed_cents - final_eligible_federal_share_cents)
      At Audit CLOSED (auto or via record-repayment reaching the due amount):
        net_federal_outlay = Authorization.reimbursed_cents - Authorization.repaid_cents
        deobligation = Authorization.obligated_cents - net_federal_outlay
        Authorization.obligated_cents := net_federal_outlay
        Apportionment.obligated_cents -= deobligation; Apportionment.available_cents recomputed
      Invariants (pinned, auditable):
        (I-APPORTION) Apportionment.available_cents == apportioned_cents - obligated_cents at all times
        (I-NETSHARE)  at closeout, reimbursed_cents - repaid_cents == final_eligible_federal_share_cents
    input_set: "The audit, its project's authorization and APPROVED vouchers, and the drawn apportionment cell"
    constants: {}
    precision: "integer cents, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on ties)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Resource ids in the URL path resolve to existing resources (validated left-to-right). Foreign-key fields in request BODIES are validated after the path resource's state gate on action endpoints (a wrong-state action reports ERR_INVALID_STATE, not a body-FK 404), and before all business rules on plain create endpoints"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers positive where required, voucher line_items non-empty, period_end strictly after period_start, clearance nepa_class present iff kind == ENVIRONMENTAL and null otherwise"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_project_version must equal Project.version on PATCH"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /federal-aid/projects/{id}"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the transition (covers generic wrong-state calls on any action endpoint)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "Cross-entity program state: owning StateProgram.status == APPROVED for determine-eligibility and authorization"
    error_id: ERR_STIP_NOT_APPROVED
    http_status: 409
    applies_to: "POST /federal-aid/projects/{id}/determine-eligibility, POST /federal-aid/authorizations"
  - priority: 8
    category: state
    check: "Project.status == ELIGIBLE at authorization (also covers INELIGIBLE terminal lockout)"
    error_id: ERR_PROJECT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /federal-aid/authorizations"
  - priority: 9
    category: state
    check: "Authorization.status == OBLIGATED for voucher creation/submission; change-order creation accepts OBLIGATED or FULLY_DRAWN (an approved change order on a FULLY_DRAWN authorization returns it to OBLIGATED)"
    error_id: ERR_AUTHORIZATION_NOT_OBLIGATED
    http_status: 409
    applies_to: "POST /federal-aid/vouchers, POST /federal-aid/vouchers/{id}/submit, POST /federal-aid/change-orders"
  - priority: 10
    category: business_safety
    check: "Regulatory clearances: project has a CLEARED ENVIRONMENTAL clearance and a CLEARED RIGHT_OF_WAY clearance before authorization; final voucher approval additionally requires row_cert_level == LEVEL_1_FULL"
    error_id: ERR_ENVIRONMENTAL_NOT_CLEARED
    http_status: 409
    applies_to: "POST /federal-aid/authorizations (environmental leg)"
  - priority: 11
    category: business_safety
    check: "Right-of-way certification leg of the same gate; also fires when a final voucher is approved under a LEVEL_2_CONDITIONAL certification"
    error_id: ERR_ROW_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /federal-aid/authorizations (ROW leg), POST /federal-aid/vouchers/{id}/decide APPROVE of a final voucher"
  - priority: 12
    category: business_safety
    check: "Segregation of duties: change-order state-concur caller must differ from requested_by_user_id; audit creator must differ from the final voucher's decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /federal-aid/change-orders/{id}/state-concur, POST /federal-aid/audits"
  - priority: 13
    category: business_safety
    check: "Voucher documentation certification: documentation_complete must be true at submit/resubmit"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /federal-aid/vouchers/{id}/submit"
  - priority: 14
    category: business_safety
    check: "DBE goal: dbe_commitment_pct >= Project.dbe_goal_pct unless good_faith_effort_documented == true (equality passes)"
    error_id: ERR_DBE_GOAL_NOT_MET
    http_status: 422
    applies_to: "POST /federal-aid/projects/{id}/award"
  - priority: 15
    category: business_safety
    check: "Public involvement: at least CONST.MIN_PUBLIC_COMMENTS comments recorded in the current window before STIP submit"
    error_id: ERR_PUBLIC_INVOLVEMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /federal-aid/stips/{id}/submit"
  - priority: 16
    category: business_temporal
    check: "Comment/advertisement/finding windows elapsed: STIP submit needs >= CONST.STIP_COMMENT_PERIOD_DAYS since window open; EIS clearance needs >= CONST.EIS_COMMENT_PERIOD_DAYS since creation; open-bids needs >= CONST.MIN_ADVERTISEMENT_DAYS since advertised_on_date; audit finalize needs >= CONST.AUDIT_FINDINGS_RESPONSE_DAYS since findings_issued_at"
    error_id: ERR_COMMENT_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /federal-aid/stips/{id}/submit, POST /federal-aid/clearances/{id}/decide (EIS leg)"
  - priority: 17
    category: business_temporal
    check: "Advertisement window leg of the same family"
    error_id: ERR_ADVERTISEMENT_PERIOD_SHORT
    http_status: 409
    applies_to: "POST /federal-aid/projects/{id}/open-bids"
  - priority: 18
    category: business_temporal
    check: "Audit findings response window leg of the same family"
    error_id: ERR_AUDIT_RESPONSE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /federal-aid/audits/{id}/finalize"
  - priority: 19
    category: business_temporal
    check: "Half-open voucher billing periods on the same authorization must not intersect; adjacency allowed"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /federal-aid/vouchers/{id}/submit"
  - priority: 20
    category: business_temporal
    check: "Closed-interval STIP coverage windows for the same state_code must not intersect; a shared boundary fiscal year IS an overlap; strictly disjoint decades allowed"
    error_id: ERR_STIP_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /federal-aid/stips"
  - priority: 21
    category: business_constraint
    check: "Uniqueness and selector constraints: one Apportionment per (program, state, FFY); one non-REJECTED clearance per (project, kind); one active Authorization per project; one non-REJECTED final voucher per authorization; award must name the lowest responsive bid (ties by submission_seq); at least one responsive bid; activity must be in the program's eligible set when determination=ELIGIBLE"
    error_id: ERR_DUPLICATE_APPORTIONMENT
    http_status: 409
    applies_to: "POST /federal-aid/apportionments"
  - priority: 22
    category: business_constraint
    check: "One non-REJECTED clearance per (project, kind)"
    error_id: ERR_CLEARANCE_KIND_EXISTS
    http_status: 409
    applies_to: "POST /federal-aid/clearances"
  - priority: 23
    category: business_constraint
    check: "One non-REJECTED final voucher per authorization"
    error_id: ERR_FINAL_VOUCHER_EXISTS
    http_status: 409
    applies_to: "POST /federal-aid/vouchers"
  - priority: 24
    category: business_constraint
    check: "No open change orders when a final voucher is approved"
    error_id: ERR_OPEN_CHANGE_ORDERS
    http_status: 409
    applies_to: "POST /federal-aid/vouchers/{id}/decide"
  - priority: 25
    category: business_constraint
    check: "At least one responsive bid exists in the project's pool (checked before inspecting the named bid)"
    error_id: ERR_NO_RESPONSIVE_BIDS
    http_status: 422
    applies_to: "POST /federal-aid/projects/{id}/award"
  - priority: 26
    category: business_constraint
    check: "Named bid must belong to the project and be responsive"
    error_id: ERR_BID_NOT_RESPONSIVE
    http_status: 422
    applies_to: "POST /federal-aid/projects/{id}/award"
  - priority: 27
    category: business_constraint
    check: "Award must name the lowest responsive bid (tie-break submission_seq)"
    error_id: ERR_AWARD_NOT_LOWEST_RESPONSIVE
    http_status: 422
    applies_to: "POST /federal-aid/projects/{id}/award"
  - priority: 28
    category: business_constraint
    check: "determination=ELIGIBLE requires activity_code in the funding program's eligible set"
    error_id: ERR_INELIGIBLE_ACTIVITY
    http_status: 422
    applies_to: "POST /federal-aid/projects/{id}/determine-eligibility"
  - priority: 29
    category: business_fiscal
    check: "An Apportionment row must exist for (program, state, FFY of clock) at authorization"
    error_id: ERR_NO_APPORTIONMENT_FOR_FFY
    http_status: 422
    applies_to: "POST /federal-aid/authorizations"
  - priority: 30
    category: business_fiscal
    check: "chronological availability: initial_obligated_cents <= available_cents; change-order draw likewise"
    error_id: ERR_APPORTIONMENT_EXCEEDED
    http_status: 422
    applies_to: "POST /federal-aid/authorizations, POST /federal-aid/change-orders/{id}/federal-decide"
  - priority: 31
    category: business_fiscal
    check: "forward-looking fiscal constraint at STIP approval"
    error_id: ERR_FISCAL_CONSTRAINT_VIOLATED
    http_status: 422
    applies_to: "POST /federal-aid/stips/{id}/decide"
  - priority: 32
    category: business_fiscal
    check: "Repayment may not exceed the outstanding due"
    error_id: ERR_REPAYMENT_EXCEEDS_DUE
    http_status: 422
    applies_to: "POST /federal-aid/audits/{id}/record-repayment"

# =============================================================================
# 1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (CONST.CLOCK_DEFAULT_START) and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock set; all duration gates evaluate against it"]

  - method: POST
    path: "/federal-aid/funding-programs"
    description: "Register a federal-aid funding category and its eligible activity set"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, eligible_activity_codes]
    output: FundingProgram
    side_effects: ["base_federal_share_pct computed from CONST.BASE_SHARE_<code>"]

  - method: POST
    path: "/federal-aid/apportionments"
    description: "Record an annual apportionment of funds for a (program, state, FFY) cell"
    roles: [FHWADivisionAdmin]
    code: 201
    input: [funding_program_id, state_code, federal_fiscal_year, apportioned_cents]
    output: Apportionment
    side_effects: ["obligated_cents = 0; available_cents = apportioned_cents; duplicate cell rejected ERR_DUPLICATE_APPORTIONMENT"]

  - method: GET
    path: "/federal-aid/apportionments/{id}"
    description: "Get one Apportionment"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: []
    output: Apportionment
    side_effects: []

  - method: GET
    path: "/federal-aid/apportionments"
    description: "List apportionments with optional filters"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["funding_program_id?", "state_code?", "federal_fiscal_year?", "limit?", "offset?"]
    output: "Apportionment[]"
    side_effects: []

  - method: POST
    path: "/federal-aid/stips"
    description: "Create a STIP; it opens directly in PUBLIC_INVOLVEMENT with the comment window starting at the current logical clock"
    roles: [StateDOTPlanner]
    code: 201
    input: [state_code, state_federal_land_pct, start_federal_fiscal_year, description]
    output: StateProgram
    side_effects: ["status = PUBLIC_INVOLVEMENT; comment_period_opened_at := clock; end_federal_fiscal_year computed; closed-interval overlap with existing STIPs of the same state rejected ERR_STIP_PERIOD_OVERLAP"]

  - method: GET
    path: "/federal-aid/stips/{id}"
    description: "Get one STIP"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: POST
    path: "/federal-aid/stips/{id}/submit"
    description: "Submit the STIP for federal approval after the public comment window"
    roles: [StateDOTPlanner]
    code: 200
    input: []
    output: StateProgram
    side_effects: ["PUBLIC_INVOLVEMENT -> SUBMITTED per state machine"]

  - method: POST
    path: "/federal-aid/stips/{id}/decide"
    description: "Federal approval decision on a SUBMITTED STIP; APPROVE runs the fiscal-constraint check, REJECT returns it to PUBLIC_INVOLVEMENT without resetting the window"
    roles: [FHWADivisionAdmin]
    code: 200
    input: [decision]
    output: StateProgram
    side_effects: ["SUBMITTED -> APPROVED or SUBMITTED -> PUBLIC_INVOLVEMENT"]

  - method: POST
    path: "/federal-aid/stips/{id}/open-amendment"
    description: "Reopen an APPROVED STIP for amendment; resets the public comment window"
    roles: [StateDOTPlanner]
    code: 200
    input: []
    output: StateProgram
    side_effects: ["APPROVED -> PUBLIC_INVOLVEMENT; comment_period_opened_at := clock; amendment_count += 1"]

  - method: POST
    path: "/federal-aid/stips/{id}/comments"
    description: "Record a public comment; only accepted while the STIP is PUBLIC_INVOLVEMENT"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 201
    input: [author_name, comment_text]
    output: PublicComment
    side_effects: ["PublicComment created with created_at from the logical clock"]

  - method: GET
    path: "/federal-aid/stips/{id}/comments"
    description: "List a STIP's public comments"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PublicComment[]"
    side_effects: []

  - method: POST
    path: "/federal-aid/projects"
    description: "Nominate a project into a STIP; creating into an APPROVED STIP cascades it back to PUBLIC_INVOLVEMENT with a fresh comment window"
    roles: [StateDOTPlanner]
    code: 201
    input: [stip_id, funding_program_id, route_name, description, activity_code, is_interstate_system, dbe_goal_pct, total_estimated_cost_cents]
    output: Project
    side_effects: ["status = NOMINATED; provisional_federal_share_pct and provisional_federal_estimate_cents computed (statutory_base variant); if the STIP was APPROVED it cascades APPROVED -> PUBLIC_INVOLVEMENT (window reset, amendment_count += 1)"]

  - method: GET
    path: "/federal-aid/projects/{id}"
    description: "Get one Project"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/federal-aid/projects"
    description: "List projects with optional filters"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["stip_id?", "funding_program_id?", "status?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: PATCH
    path: "/federal-aid/projects/{id}"
    description: "Update description, estimate, or DBE goal while NOMINATED or ELIGIBLE; OCC-guarded; recomputes provisional estimate when cost changes"
    roles: [StateDOTPlanner]
    code: 200
    input: ["expected_project_version", "description?", "total_estimated_cost_cents?", "dbe_goal_pct?"]
    output: Project
    side_effects: ["increments Project.version by 1; on cost change provisional_federal_estimate_cents recomputed via statutory_base"]

  - method: POST
    path: "/federal-aid/projects/{id}/determine-eligibility"
    description: "Federal eligibility determination; ELIGIBLE computes the adjusted_full share, INELIGIBLE is terminal"
    roles: [FHWADivisionAdmin]
    code: 200
    input: [determination]
    output: Project
    side_effects: ["NOMINATED -> ELIGIBLE (determined_federal_share_pct pinned) or NOMINATED -> INELIGIBLE"]

  - method: POST
    path: "/federal-aid/projects/{id}/advertise"
    description: "Advertise an AUTHORIZED project for bids; records advertised_on_date from the logical clock"
    roles: [StateDOTEngineer]
    code: 200
    input: []
    output: Project
    side_effects: ["AUTHORIZED -> BIDDING; advertised_on_date := clock"]

  - method: POST
    path: "/federal-aid/projects/{id}/open-bids"
    description: "Open sealed bids after the advertisement window; creates one Bid row per payload entry with submission_seq equal to array index"
    roles: [StateDOTEngineer]
    code: 200
    input: [bids]
    output: Project
    side_effects: ["BIDDING -> BIDS_OPENED; Bid rows created with status SUBMITTED"]

  - method: POST
    path: "/federal-aid/projects/{id}/award"
    description: "Award the contract with DBE review: names the lowest responsive bid and verifies the DBE goal or documented good-faith effort"
    roles: [FHWAReviewer]
    code: 200
    input: ["bid_id", "dbe_commitment_pct", "good_faith_effort_documented?"]
    output: Project
    side_effects: ["winner Bid -> AWARDED, others -> NOT_AWARDED; awarded_bid_id set; BIDS_OPENED -> UNDER_CONSTRUCTION"]

  - method: POST
    path: "/federal-aid/clearances"
    description: "Open an environmental review or right-of-way certification for an ELIGIBLE project; one non-REJECTED clearance per (project, kind)"
    roles: [StateDOTEngineer]
    code: 201
    input: ["project_id", "kind", "nepa_class?"]
    output: ProjectClearance
    side_effects: ["status = SUBMITTED"]

  - method: POST
    path: "/federal-aid/clearances/{id}/decide"
    description: "Federal decision on a clearance; CLEARED for an EIS requires the 45-day window; CLEARED for RIGHT_OF_WAY requires row_cert_level in the payload"
    roles: [FHWAReviewer]
    code: 200
    input: ["decision", "row_cert_level?"]
    output: ProjectClearance
    side_effects: ["SUBMITTED -> CLEARED or REJECTED; decided_by_user_id recorded"]

  - method: GET
    path: "/federal-aid/projects/{id}/clearances"
    description: "List a project's clearances"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProjectClearance[]"
    side_effects: []

  - method: POST
    path: "/federal-aid/authorizations"
    description: "Authorize a project: creates the federal-aid agreement, pins the determined share, and obligates funds against the (program, state, current-FFY) apportionment cell"
    roles: [FHWADivisionAdmin]
    code: 201
    input: [project_id, agreement_number, initial_obligated_cents]
    output: Authorization
    side_effects: ["Authorization created OBLIGATED with federal_share_pct pinned; Apportionment.obligated_cents += initial_obligated_cents and available_cents recomputed; Project ELIGIBLE -> AUTHORIZED; apportionment_id recorded"]

  - method: GET
    path: "/federal-aid/authorizations/{id}"
    description: "Get one Authorization"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: GET
    path: "/federal-aid/authorizations"
    description: "List authorizations with optional filters"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["project_id?", "status?", "apportionment_id?", "limit?", "offset?"]
    output: "Authorization[]"
    side_effects: []

  - method: GET
    path: "/federal-aid/projects/{id}/bids"
    description: "List a project's bids in submission_seq order"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Bid[]"
    side_effects: []

  - method: POST
    path: "/federal-aid/vouchers"
    description: "Create a DRAFT progress billing against an OBLIGATED authorization of an UNDER_CONSTRUCTION project; one non-REJECTED final voucher per authorization"
    roles: [StateDOTEngineer]
    code: 201
    input: [authorization_id, period_start_date, period_end_date, line_items, documentation_complete, is_final]
    output: Voucher
    side_effects: ["status = DRAFT; claimed_amount_cents computed"]

  - method: POST
    path: "/federal-aid/vouchers/{id}/submit"
    description: "Submit a DRAFT voucher, or resubmit a REJECTED voucher with optional revised period, lines, or documentation"
    roles: [StateDOTEngineer]
    code: 200
    input: ["period_start_date?", "period_end_date?", "line_items?", "documentation_complete?"]
    output: Voucher
    side_effects: ["DRAFT or REJECTED -> UNDER_REVIEW; documentation and half-open overlap checks run here; resubmission_count += 1 on the REJECTED path"]

  - method: POST
    path: "/federal-aid/vouchers/{id}/decide"
    description: "Federal review of a voucher: APPROVE posts reimbursement (with optional ineligible line strikes) and cascades to authorization and project; REJECT returns the voucher for resubmission"
    roles: [FHWAReviewer]
    code: 200
    input: [decision, "ineligible_line_indexes?"]
    output: Voucher
    side_effects: ["UNDER_REVIEW -> APPROVED or REJECTED; on APPROVE: reimbursement cascade per state machine"]

  - method: GET
    path: "/federal-aid/authorizations/{id}/vouchers"
    description: "List an authorization's vouchers"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Voucher[]"
    side_effects: []

  - method: POST
    path: "/federal-aid/change-orders"
    description: "Request a cost-overrun change order against an OBLIGATED or FULLY_DRAWN authorization of an UNDER_CONSTRUCTION project"
    roles: [StateDOTEngineer]
    code: 201
    input: [authorization_id, description, delta_cost_cents]
    output: ChangeOrder
    side_effects: ["status = REQUESTED; requested_by_user_id := X-User-ID"]

  - method: POST
    path: "/federal-aid/change-orders/{id}/state-concur"
    description: "State concurrence on a change order; must be a different StateDOTEngineer than the requester"
    roles: [StateDOTEngineer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["REQUESTED -> STATE_CONCURRED; state_concurred_by_user_id recorded"]

  - method: POST
    path: "/federal-aid/change-orders/{id}/federal-decide"
    description: "Federal decision on a change order; APPROVE computes cap-clamped participation and draws it from the apportionment"
    roles: [FHWAReviewer]
    code: 200
    input: [decision]
    output: ChangeOrder
    side_effects: ["STATE_CONCURRED -> FEDERAL_APPROVED or FEDERAL_REJECTED; on APPROVE: participation cascade per state machine"]

  - method: GET
    path: "/federal-aid/authorizations/{id}/change-orders"
    description: "List an authorization's change orders"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChangeOrder[]"
    side_effects: []

  - method: POST
    path: "/federal-aid/audits"
    description: "Initiate the closeout audit of a COMPLETE project; the auditor must not be the reviewer who approved the final voucher; one audit per project"
    roles: [FHWAReviewer]
    code: 201
    input: [project_id]
    output: Audit
    side_effects: ["status = INITIATED; auditor_user_id := X-User-ID"]

  - method: POST
    path: "/federal-aid/audits/{id}/issue-findings"
    description: "Issue audit findings including the amount of state expenditures found ineligible"
    roles: [FHWAReviewer]
    code: 200
    input: [findings_text, ineligible_amount_cents]
    output: Audit
    side_effects: ["INITIATED -> FINDINGS_ISSUED; findings_issued_at := clock"]

  - method: POST
    path: "/federal-aid/audits/{id}/finalize"
    description: "Finalize the audit after the response window; computes final eligible share and repayment due; auto-closes when no repayment is due"
    roles: [FHWAReviewer]
    code: 200
    input: []
    output: Audit
    side_effects: ["FINDINGS_ISSUED -> FINAL; if repayment_due_cents == 0: FINAL -> CLOSED with the closeout cascade"]

  - method: POST
    path: "/federal-aid/audits/{id}/record-repayment"
    description: "Record a state repayment of ineligible costs; closing the audit when the full due amount is repaid"
    roles: [FHWAReviewer]
    code: 200
    input: [amount_cents]
    output: Audit
    side_effects: ["repaid_cents += amount_cents; when repaid_cents == repayment_due_cents: FINAL -> CLOSED with the closeout cascade"]

  - method: GET
    path: "/federal-aid/projects/{id}/audits"
    description: "List a project's audits"
    roles: [PlatformAdmin, StateDOTPlanner, StateDOTEngineer, FHWADivisionAdmin, FHWAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Audit[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog (33 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or names no declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or foreign-key body field does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, out-of-range enum, non-positive amount, empty line_items, period_end not after period_start, nepa_class/row_cert_level conditional-field violation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match Project.version on PATCH" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested action (includes comments on a non-PUBLIC_INVOLVEMENT STIP, vouchers for projects not UNDER_CONSTRUCTION, audits for projects not COMPLETE, second audit per project)" }
  - { id: ERR_STIP_NOT_APPROVED, http: 409, condition: "Owning STIP is not APPROVED when eligibility determination or authorization is attempted" }
  - { id: ERR_PROJECT_NOT_ELIGIBLE, http: 409, condition: "Project not ELIGIBLE at authorization (also covers INELIGIBLE lockout)" }
  - { id: ERR_ENVIRONMENTAL_NOT_CLEARED, http: 409, condition: "Authorization attempted without a CLEARED environmental clearance" }
  - { id: ERR_ROW_NOT_CERTIFIED, http: 409, condition: "Authorization attempted without a CLEARED right-of-way certification, or final voucher approval attempted under LEVEL_2_CONDITIONAL" }
  - { id: ERR_AUTHORIZATION_NOT_OBLIGATED, http: 409, condition: "Voucher or change-order creation attempted while the authorization is FULLY_DRAWN or CLOSED" }
  - { id: ERR_OPEN_CHANGE_ORDERS, http: 409, condition: "Final voucher approval attempted while change orders remain REQUESTED or STATE_CONCURRED" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 422, condition: "Voucher submitted with documentation_complete == false" }
  - { id: ERR_DBE_GOAL_NOT_MET, http: 422, condition: "Award DBE commitment below the project goal without documented good-faith effort" }
  - { id: ERR_PUBLIC_INVOLVEMENT_INCOMPLETE, http: 422, condition: "STIP submitted with zero comments recorded in the current window" }
  - { id: ERR_COMMENT_PERIOD_OPEN, http: 409, condition: "STIP submitted before 30 days elapsed in the comment window, or EIS environmental clearance CLEARED before 45 days" }
  - { id: ERR_ADVERTISEMENT_PERIOD_SHORT, http: 409, condition: "Bids opened before 21 days of advertisement" }
  - { id: ERR_BILLING_PERIOD_OVERLAP, http: 409, condition: "Voucher billing period intersects a non-REJECTED sibling voucher's half-open period on the same authorization" }
  - { id: ERR_STIP_PERIOD_OVERLAP, http: 409, condition: "New STIP's closed fiscal-year interval intersects an existing STIP for the same state_code" }
  - { id: ERR_AUDIT_RESPONSE_WINDOW_OPEN, http: 409, condition: "Audit finalized before 30 days elapsed since findings issuance" }
  - { id: ERR_AWARD_NOT_LOWEST_RESPONSIVE, http: 422, condition: "Award names a bid other than the lowest responsive bid (ties broken by submission_seq)" }
  - { id: ERR_BID_NOT_RESPONSIVE, http: 422, condition: "Award names a non-responsive bid" }
  - { id: ERR_NO_RESPONSIVE_BIDS, http: 422, condition: "Award attempted when the project has no responsive bids" }
  - { id: ERR_CLEARANCE_KIND_EXISTS, http: 409, condition: "A non-REJECTED clearance of the same kind already exists for the project" }
  - { id: ERR_FINAL_VOUCHER_EXISTS, http: 409, condition: "A non-REJECTED final voucher already exists for the authorization" }
  - { id: ERR_DUPLICATE_APPORTIONMENT, http: 409, condition: "An Apportionment already exists for the (program, state, FFY) cell" }
  - { id: ERR_APPORTIONMENT_EXCEEDED, http: 422, condition: "Obligation or change-order draw exceeds the cell's available_cents" }
  - { id: ERR_FISCAL_CONSTRAINT_VIOLATED, http: 422, condition: "STIP approval would program more federal funds than the forward-looking capacity" }
  - { id: ERR_NO_APPORTIONMENT_FOR_FFY, http: 422, condition: "No apportionment row exists for (program, state, FFY of the logical clock) at authorization" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID attempted both sides of a segregated step (change-order request vs state concurrence; final voucher approval vs audit)" }
  - { id: ERR_INELIGIBLE_ACTIVITY, http: 422, condition: "determination=ELIGIBLE with an activity_code outside the funding program's eligible set" }
  - { id: ERR_REPAYMENT_EXCEEDS_DUE, http: 422, condition: "record-repayment amount exceeds repayment_due_cents - repaid_cents" }

# =============================================================================
# 1.7 RBAC Matrix (all roles opaque; segregation duties compare X-User-ID)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Benchmark operator: drives the logical clock and registers funding program configuration"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /federal-aid/funding-programs"
    shared_operations:
      - "All GET endpoints; POST /federal-aid/stips/{id}/comments"

  - name: StateDOTPlanner
    description: "State DOT programming staff: builds the STIP, records public involvement, nominates and patches projects"
    identity: opaque
    exclusive_operations:
      - "POST /federal-aid/stips"
      - "POST /federal-aid/stips/{id}/submit"
      - "POST /federal-aid/stips/{id}/open-amendment"
      - "POST /federal-aid/projects"
      - "PATCH /federal-aid/projects/{id}"
    shared_operations:
      - "All GET endpoints; POST /federal-aid/stips/{id}/comments"

  - name: StateDOTEngineer
    description: "State DOT engineering staff: clearances, advertising and bid opening, progress billing, change-order requests"
    identity: opaque
    exclusive_operations:
      - "POST /federal-aid/clearances"
      - "POST /federal-aid/projects/{id}/advertise"
      - "POST /federal-aid/projects/{id}/open-bids"
      - "POST /federal-aid/vouchers"
      - "POST /federal-aid/vouchers/{id}/submit"
      - "POST /federal-aid/change-orders"
      - "POST /federal-aid/change-orders/{id}/state-concur"
    shared_operations:
      - "All GET endpoints; POST /federal-aid/stips/{id}/comments"

  - name: FHWADivisionAdmin
    description: "FHWA division administrator: apportionments, STIP approval, eligibility determination, project authorization"
    identity: opaque
    exclusive_operations:
      - "POST /federal-aid/apportionments"
      - "POST /federal-aid/stips/{id}/decide"
      - "POST /federal-aid/projects/{id}/determine-eligibility"
      - "POST /federal-aid/authorizations"
    shared_operations:
      - "All GET endpoints; POST /federal-aid/stips/{id}/comments"

  - name: FHWAReviewer
    description: "FHWA review staff: clearance decisions, award concurrence with DBE review, voucher eligibility review, change-order federal decision, audit and closeout"
    identity: opaque
    exclusive_operations:
      - "POST /federal-aid/clearances/{id}/decide"
      - "POST /federal-aid/projects/{id}/award"
      - "POST /federal-aid/vouchers/{id}/decide"
      - "POST /federal-aid/change-orders/{id}/federal-decide"
      - "POST /federal-aid/audits"
      - "POST /federal-aid/audits/{id}/issue-findings"
      - "POST /federal-aid/audits/{id}/finalize"
      - "POST /federal-aid/audits/{id}/record-repayment"
    shared_operations:
      - "All GET endpoints; POST /federal-aid/stips/{id}/comments"
