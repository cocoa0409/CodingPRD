  - name: room_night_ledger_is_the_ledger_sync_witness
    claim_type: ledger_sync
    grounds:
    - §1.2 Registration confirm/cancel side_effect "recomputes calculations.room_night_ledger"
    - §1.1 SupplierContract.room_nights_confirmed, room_nights_available
    distinguishing_aspect: |-
      The ledger-sync claim — a child state change re-deriving an ancestor field that reconciles before and after — is exactly the room-night conservation claim.
    excluded_because:
      difficulty_instance: room_nights_blocked_is_conserved_as_confirmed_plus_available
      rationale: |-
        That §1.8 instance reads the ledger at four points across two confirmations and one cancellation and asserts the identity at every point, which subsumes any single before/after reconciliation.
  - name: registration_cancel_reaching_a_foreign_signup_is_the_cross_entity_witness
    claim_type: cross_entity
    grounds:
    - §1.2 Registration CONFIRMED -> CANCELLED side_effects reaching ActivitySignup and OnsiteActivity
    - §1.3 activity_seat_allocation
    distinguishing_aspect: |-
      The cross-entity side-effect claim — entity A changes state and entity B adjusts, with B's own state and counters verified — is exactly the waitlist-promotion cascade claim.
    excluded_because:
      difficulty_instance: registration_cancel_cascades_three_levels_into_waitlist_promotion
      rationale: |-
        That §1.8 instance verifies the foreign ActivitySignup rows and the OnsiteActivity counters as well as the Qualifier rollback, covering every cross-entity target of the transition.
