      create for an attested period -> ERR_REPORT_PERIOD_FINALIZED; attest a DRAFT -> ERR_REPORT_NOT_SUBMITTED.'
    test_recipe:
      setup:
      - ACTIVE program, RESIDENTIAL district; MUNICIPAL account AC-M current_period 2026-08 (no poles, no lines); report R for period 2026-08 created (savings 0 — inclusion set empty)
