      # ----------------------------------------------------- Side Effect Execution
      - name: sm_side_effects_start_oven_consumes_reserved_mass_locks_the_tool_and_leaves_available_alone
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - state_machines.ResinCharge.RESERVED_to_CONSUMED
          - state_machines.Mold.AVAILABLE_to_IN_CYCLE
          - state_machines.ResinLot.AVAILABLE_to_DEPLETED
          - calculations.resin_mass_ledger
          - endpoints.POST_/resin-charges
          - errors.ERR_RESIN_LOT_NOT_AVAILABLE
        distinguishing_aspect: "start-oven moves charge mass from reserved_kg to consumed_kg and must leave available_kg EXACTLY where it was, so the lot's three buckets change shape without changing their sum; and because POST /resin-charges is what drains available_kg to 0.000 and flips the lot to DEPLETED, a cycle charged from a fully drained lot can never start at all — it is refused with ERR_RESIN_LOT_NOT_AVAILABLE."
        test_recipe:
          setup:
            - "ProductModel PM-SM-SFX (nominal_charge_kg 24.000, charge_tolerance_pct 5.00, max_regrind_pct 30.00, melt band 2.50..6.00); Mold MLD-SM-SFX cavity_count 1 nominal 24.000; OvenStation OVN-SM-SFX; CoolingBay BAY-SM-SFX."
            - "TWO qualified lots: LOT-SM-SFX-BIG with received_kg 500.000 (plenty of headroom) and LOT-SM-SFX-TIGHT with received_kg 24.000 (exactly one charge)."
            - "Both lots clear the qualification mass floor at release time: 24.000 >= round(24.000 * (1 - 5.00 / 100), 3) == 22.800."
            - "ProductionOrder POR-SM-SFX with ordered_qty 2 admits two single-cavity cycles: 2 <= floor(2 * 1.20) == 2."
            - "CYC-1 (oven 09:00-10:00, cooling to 10:30) is charged 24.000 from BIG; CYC-2 (oven 11:00-12:00) is charged 24.000 from TIGHT, which drains TIGHT to exactly 0.000."
            - "The mould spans [09:00, 10:30) and [11:00, 12:30) are disjoint, so the exclusive tool-occupancy rule never fires."
