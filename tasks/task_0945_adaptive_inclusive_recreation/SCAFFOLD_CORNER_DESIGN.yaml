        grounds:
          - state_machines.Enrollment.REQUESTED_to_CONFIRMED
          - entities.ProgramSession.fields.slots_committed
          - entities.EnrollmentCharge.fields.status
          - calculations.enrollment_charge_settlement
        distinguishing_aspect: "The consistency model is immediate: the very next read after a confirm shows slots_committed 1, required_group_staff_planned 1 and the charge already flipped from QUOTED to OUTSTANDING — no second request or delay is needed."
        test_recipe:
          setup: ["One ACTIVE INDEPENDENT participant with a REQUESTED enrollment on an OPEN session priced at 4000 cents."]
          setup_api_calls:
