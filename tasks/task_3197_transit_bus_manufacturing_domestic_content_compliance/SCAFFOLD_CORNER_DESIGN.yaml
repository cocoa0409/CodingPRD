scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: agency_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Agency.fields.federally_funded, entities.Agency.fields.fleet_transition_target_pct, entities.Agency.fields.status]
        distinguishing_aspect: "Omitting optional fields at agency creation applies defaults: federally_funded true, fleet_transition_target_pct 0, zev ratios 0, status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/agencies"
              payload: { name: "Default Transit", agency_code: "DFT1", transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { ag_ff: $.data.federally_funded, ag_tgt: $.data.fleet_transition_target_pct, ag_zev: $.data.zev_ratio, ag_st: $.data.status, ag_id: $.data.id, ag_ver: $.data.version }
          assert:
            - "ag_ff == true"
            - "ag_tgt == 0"
            - "ag_zev == 0 and ag_st == ACTIVE"
            - "ag_ver == 1"

      - name: agency_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.Agency.fields.agency_code, "errors[ERR_DUPLICATE]", "validations[priority=8]"]
        distinguishing_aspect: "Second agency with the same agency_code is rejected with ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Agency with agency_code DUP1 exists"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "First Transit", agency_code: "DUP1", transition_target_year: 2035 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/agencies"
              payload: { name: "Second Transit", agency_code: "DUP1", transition_target_year: 2036 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"

      - name: agency_get_not_found
        claim_type: not_found
        grounds: [entities.Agency, "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/agencies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: component_enum_category_constraint
        claim_type: type_constraints
        grounds: [entities.Component.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Component created with category outside the declared enum (e.g. HVAC) is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/components"
              payload: { name: "AC Unit", category: HVAC, unit_cost_cents: 50000, is_domestic: true }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: agency_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Agency]
        distinguishing_aspect: "GET /api/agencies returns the fixed envelope with response_type array and pagination fields total_count/has_more honoring default limit 10."
        test_recipe:
          setup: ["One agency exists"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Paged Transit", agency_code: "PGT1", transition_target_year: 2035 }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/agencies"
              payload: {}
              as: PlatformAdmin
              captures: { first_code: $.data.0.agency_code }
          assert:
            - "first_code == PGT1 (single created agency present in list)"
            - "response uses envelope: data is an array and meta.api_request_id is present"

      - name: inspection_record_immutable_no_version
        claim_type: immutability
        grounds: [entities.InspectionRecord]
        distinguishing_aspect: "InspectionRecord has common_fields false: it carries id and created_at but no version field and exposes no update endpoint."
        test_recipe:
          setup:
            - "Bus in PLANT_INSPECTION via full build chain"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Timber Transit", agency_code: "TBT1", federally_funded: true, transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 1, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Engine", category: PROPULSION, unit_cost_cents: 800000, is_domestic: true }
              as: ComplianceOfficer
              captures: { c1: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${c1}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/audit-records"
              payload: { contract_id: "${ct_id}", audit_type: PRE_AWARD, auditor_id: "aud-1" }
              as: Auditor
              captures: { au_id: $.data.id }
            - call: "POST /api/components/${c1}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${c1}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/audit-records/${au_id}/complete"
              payload: {}
              as: Auditor
            - call: "POST /api/contracts/${ct_id}/activate"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/bus-units"
              payload: { contract_id: "${ct_id}", bus_configuration_id: "${cfg_id}", assembly_location: US_MAIN }
              as: ProductionPlanner
              captures: { bu_id: $.data.id }
            - call: "POST /api/bus-units/${bu_id}/engineer"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_A, start_ts: "2026-09-01T00:00:00Z", end_ts: "2026-09-03T00:00:00Z" }
              as: ProductionPlanner
              captures: { sl: $.data.id }
            - call: "POST /api/production-slots/${sl}/assign"
              payload: { bus_unit_id: "${bu_id}" }
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl}/complete-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/bus-units/${bu_id}/compliance-certificates"
              payload: { variant: COST_BASED, issued_by: "co-1" }
              as: ComplianceOfficer
            - call: "POST /api/bus-units/${bu_id}/submit-plant-inspection"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/inspection-records"
              payload: { bus_unit_id: "${bu_id}", inspection_type: PLANT, inspector_id: "insp-1", result: PASS }
              as: AgencyInspector
              captures: { ir_id: $.data.id }
            - call: "GET /api/inspection-records/${ir_id}"
              payload: {}
              as: AgencyInspector
          assert:
            - "InspectionRecord.${ir_id} has no version field (common_fields false)"
            - "No PATCH/PUT endpoint exists for /api/inspection-records/{id}"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_award_requires_frozen_config
        claim_type: precondition_enforcement
        grounds: [state_machines.Contract.DRAFT_to_AWARDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Awarding a DRAFT contract with no FROZEN BusConfiguration fails; after freezing a config the award succeeds."
        test_recipe:
          setup: ["ACTIVE agency; DRAFT contract; one configuration still in DRAFT"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Summit Transit", agency_code: "SMT1", federally_funded: true, transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 2, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Engine", category: PROPULSION, unit_cost_cents: 800000, is_domestic: true }
              as: ComplianceOfficer
              captures: { c1: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${c1}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
          trigger:
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
              captures: { st: $.data.status, aw: $.data.awarded_at }
          assert:
            - "err is a 4xx error_id (award rejected without a FROZEN configuration)"
            - "st == AWARDED and aw == 2026-09-01T00:00:00Z (logical clock default)"

      - name: contract_terminal_completed_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Contract, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED contract rejects every further action transition (terminate) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Contract ACTIVE with its single bus REJECTED via delivery inspection and no options"]
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Alpine Transit", agency_code: "ALT1", federally_funded: true, transition_target_year: 2035 }
