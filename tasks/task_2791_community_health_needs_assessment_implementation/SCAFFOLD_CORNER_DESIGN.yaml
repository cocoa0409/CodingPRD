            - "trigger call 2: HTTP 409 with data.error_id == ERR_PARTY_TYPE_MISMATCH — an INTERNAL party may not be the agreement counterparty"
            - "trigger call 3: HTTP 201 with data.facilitator_party_id == ${fac}"
            - "trigger call 4: HTTP 201 with data.party_id == ${partner}, status == NEGOTIATING, hospital_signed_at == null, partner_signed_at == null, committed_funding_cents == 0"

      - name: report_computed_read_mixes_charge_and_cost_basis_totals
        claim_type: Computed read
        grounds:
          - endpoints.GET_/community-benefit-reports/{report_id}
          - calculations.report_category_totals
          - calculations.report_indirect_and_grand_total
        distinguishing_aspect: "The report read is entirely derived: one charge-based posting (1234567 -> 395061) plus one cost-based posting (850000) give total_valued_cents 1245061, indirect 62253 at the 0.05 tier, grand total 1307314 and benefit_pct_of_expense 1.09 against the cycle's 120000000 operating expense."
