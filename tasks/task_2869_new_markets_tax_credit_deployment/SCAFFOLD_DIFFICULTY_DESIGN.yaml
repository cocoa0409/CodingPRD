            - "Immediately after the repayment: QEI.${qei_id}.deployment_status == REINVESTMENT_PENDING and QEI.${qei_id}.compliance_status == AT_RISK"
            - "Immediately after the repayment: QEI.${qei_id}.substantially_all_pct_direct == 36.84 and QEI.${qei_id}.uninvested_cash_cents == 60000000"
            - "Immediately after the repayment: QEI.${qei_id}.cure_deadline_at == \"2027-05-30T00:00:00.000Z\""
            - "ReinvestmentObligation.${obligation_id}.amount_cents == 50000000, arose_at == \"2026-12-01T00:00:00.000Z\", reinvest_by_at == \"2027-12-01T00:00:00.000Z\", status == OPEN"
            - "After the reinvestment: ReinvestmentObligation.${obligation_id}.status == SATISFIED and satisfied_at == \"2026-12-15T00:00:00.000Z\""
            - "After the reinvestment: QLICI.${qlici_id}.principal_cents == 135000000 and outstanding_principal_cents == 85000000 and status == PARTIALLY_REPAID"
            - "After the reinvestment: QEI.${qei_id}.deployment_status == DEPLOYING (NOT FULLY_DEPLOYED — 10000000 cents remain uninvested)"
            - "After the reinvestment: QEI.${qei_id}.compliance_status == COMPLIANT and substantially_all_pct_direct == 89.47 and cure_deadline_at == null"
            - "The two dimensions moved on different schedules: deployment_status changed twice while compliance_status changed twice to non-mirroring values, and QLICI.status stayed PARTIALLY_REPAID throughout the reinvestment"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: eligibility_failure_cascades_qalicb_to_qlicis_to_qeis_to_award_posture
        grounds:
          - state_machines.QALICB.eligibility_status.CERTIFIED_to_FAILED
          - state_machines.QLICI.DEPLOYED_to_NON_QUALIFYING
          - state_machines.QEI.compliance_status.COMPLIANT_to_AT_RISK
          - calculations.award_compliance_posture
          - entities.AllocationAward.fields.at_risk_qei_count
        distinguishing_aspect: |
          Depth-4 chain from a single POST of an eligibility test, where every hop is caused by the
          previous hop and none by the original request: QALICB -> FAILED causes both QLICIs ->
          NON_QUALIFYING, which causes each of the two QEIs' recomputed ratio to fall to 0.00 and
          flip to AT_RISK, which causes at_risk_qei_count to reach 2 and the award's derived
          compliance_posture to become RESTRICTED.
        test_recipe:
          setup:
            - "One ACTIVE award with 5,000,000,000 cents of authority and substantially_all_method DIRECT_TRACING."
            - "One CERTIFIED QALICB with an ACTIVE community benefits agreement."
            - "Two separate FUNDED funds, each of 100,000,000 cents, backing two QEIs of 100,000,000 cents issued 2026-09-01."
            - "Each QEI has a single QLICI of 85,000,000 cents to the same QALICB, so each QEI's direct ratio is 89.47 and both are COMPLIANT."
            - "Logical clock moved to 2026-10-01 so the failing test is unambiguously the latest one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
