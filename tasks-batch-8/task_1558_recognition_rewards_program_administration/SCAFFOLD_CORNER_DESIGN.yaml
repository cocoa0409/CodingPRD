          assert:
            - "${err} == ERR_INVALID_TAX_YEAR"

      - name: budget_adjustment_on_closed_budget_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUDGET_CLOSED]", "validations[priority=18]"]
        distinguishing_aspect: "After the budget auto-closes (clock past period_end), POST /api/budgets/{id}/adjustments is rejected ERR_BUDGET_CLOSED."
        test_recipe:
          setup: ["budget [2026-01-01, 2026-09-01) auto-closed by clock advance"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
