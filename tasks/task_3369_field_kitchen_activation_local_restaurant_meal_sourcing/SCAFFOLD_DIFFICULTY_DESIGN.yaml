scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: meal_settlement_provisional_vs_final_on_delivery
        grounds:
          - calculations.meal_order_cost_settlement
          - calculations.meal_order_cost_buildup
          - entities.MealOrder.fields.final_cost_cents
          - entities.MealOrder.fields.provisional_cost_cents
        distinguishing_aspect: |
          For one MealOrder with ordered_meals 1000, rejected_meals 40 and quality_check_score 88 the
          provisional variant pins provisional_cost_cents 1467750 while the final variant pins
          final_cost_cents 1368000, so the two valid readings of the same batch differ by 99750 cents.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE with funding_ceiling_cents 5000000 and population_dietary_requirements [VEGETARIAN]"
            - "FieldKitchen ${fk_id} is OPERATIONAL with food_safety_score 80"
            - "PartnerKitchen ${pk_id} is CONTRACTED / PRODUCING with per_meal_price_cents 1500 and daily_capacity_meals 1200"
            - "DistributionRun ${run_id} is LOADING with loaded_meals 0"
            - "MealOrder ${mo_id} exists in PLACED with ordered_meals 1000, production_hours 4 and scheduled_start 2026-09-01T08:00:00Z"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000, population_dietary_requirements: ["VEGETARIAN"] }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2, assessment_mode: "RAPID" }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "UTILITIES_PENDING" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "OPERATIONAL" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "VETTING" }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "PRODUCTION", to_state: "PRODUCING" }
              as: KitchenOperator
              as_user_id: "${pk_id}"
            - call: "POST /field-ops/distribution-runs"
              payload: { incident_id: "${inc_id}", field_kitchen_id: "${fk_id}", driver_name: "Ana Ruiz", driver_phone: "+15550100", driver_safety_training_completed: true, vehicle_type: "VAN", planned_date: "2026-09-01T07:00:00Z", window_start: "2026-09-01T07:00:00Z", window_end: "2026-09-01T19:00:00Z", fuel_cost_cents: 6000, handling_cost_cents: 4000 }
              as: LogisticsCoordinator
              captures: { run_id: "$.data.id" }
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "LOADING" }
              as: LogisticsCoordinator
            - call: "GET /field-ops/partner-kitchens/${pk_id}"
              as: ProductionPlanner
              captures: { pk_v: "$.data.version" }
            - call: "POST /field-ops/meal-orders"
              payload: { incident_id: "${inc_id}", partner_kitchen_id: "${pk_id}", menu_name: "Arroz con Pollo", dietary_tags: ["VEGETARIAN", "NUT_FREE"], ordered_meals: 1000, scheduled_start: "2026-09-01T08:00:00Z", production_hours: 4, expected_partner_kitchen_version: "${pk_v}" }
              as: ProductionPlanner
              captures: { mo_id: "$.data.id" }
          trigger:
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "IN_PRODUCTION" }
              as: ProductionPlanner
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "QUALITY_HOLD", produced_meals: 1000 }
              as: KitchenOperator
              as_user_id: "${pk_id}"
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "READY", quality_check_score: 88, rejected_meals: 40 }
              as: FoodSafetyOfficer
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "DISPATCHED", distribution_run_id: "${run_id}" }
              as: LogisticsCoordinator
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "EN_ROUTE", loaded_meals: 960 }
              as: LogisticsCoordinator
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "DELIVERING" }
              as: LogisticsCoordinator
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "DELIVERED" }
              as: LogisticsCoordinator
          assert:
            - "MealOrder.${mo_id}.subtotal_cents == 1500000"
            - "MealOrder.${mo_id}.logistics_fee_cents == 45000"
            - "MealOrder.${mo_id}.volume_discount_cents == 77250"
            - "MealOrder.${mo_id}.provisional_cost_cents == 1467750"
            - "MealOrder.${mo_id}.final_cost_cents == 1368000"
            - "MealOrder.${mo_id}.final_cost_cents == MealOrder.${mo_id}.provisional_cost_cents - 99750"
      - name: assessment_priority_rapid_vs_durable_on_identical_field_data
        grounds:
          - calculations.assessment_feeding_priority
          - entities.Assessment.fields.feeding_priority_score
          - entities.Assessment.fields.assessment_mode
        distinguishing_aspect: |
          Two Assessments carrying byte-identical field data (population_affected 40000,
          estimated_daily_meal_need 9000, access_constraint LIMITED, water_available false,
          power_available true, partner_kitchens_identified 2) score feeding_priority_score 83 under
          assessment_mode RAPID and 88 under assessment_mode DURABLE, because DURABLE halves the
          infrastructure penalty and doubles the partner penalty.
        test_recipe:
          setup:
            - "Incident ${inc_id} exists in MONITORING; no other assessment exists"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2, assessment_mode: "RAPID" }
              as: FieldCoordinator
              captures: { a_rapid: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2, assessment_mode: "DURABLE" }
              as: FieldCoordinator
              captures: { a_durable: "$.data.id" }
          assert:
            - "Assessment.${a_rapid}.feeding_priority_score == 83"
            - "Assessment.${a_durable}.feeding_priority_score == 88"
            - "Assessment.${a_rapid}.feeding_priority_score != Assessment.${a_durable}.feeding_priority_score"

  - rule_id: combinatorial_formula
    instances:
      - name: field_kitchen_readiness_three_input_nonlinear
        grounds:
          - calculations.field_kitchen_food_safety_score
          - state_machines.FieldKitchen.UTILITIES_PENDING_to_FOOD_SAFETY_CLEARED
          - validations[priority=20]
          - entities.FieldKitchen.fields.food_safety_score
        distinguishing_aspect: |
          food_safety_score is a non-linear combination of four inputs in which the cold-chain term is
          selected by a two-step threshold (>= 12 hours scores 25, >= 6 hours scores 15, else 0) and a
          10-point capacity penalty applies only strictly below 500 meals: GENERATOR + TRUCKED + 6
          refrigeration hours scores exactly 70 at capacity 500 but 60 at capacity 499.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "FieldKitchen ${fk_id} is UTILITIES_PENDING with power_source GENERATOR, water_source TRUCKED, refrigeration_hours_available 12 and daily_capacity_meals 500"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "UTILITIES_PENDING" }
              as: FieldCoordinator
          trigger:
            - call: "POST /field-ops/field-kitchens/${fk_id}/inspections"
              payload: { power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 6, daily_capacity_meals: 499 }
              as: FoodSafetyOfficer
              captures: { score_penalised: "$.data.food_safety_score" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
              captures: { err_low: "$.data.error_id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/inspections"
              payload: { power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 6, daily_capacity_meals: 500 }
              as: FoodSafetyOfficer
              captures: { score_ok: "$.data.food_safety_score" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/inspections"
              payload: { power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FoodSafetyOfficer
              captures: { score_full: "$.data.food_safety_score" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
          assert:
            - "${score_penalised} == 60"
            - "${score_ok} == 70"
            - "${score_full} == 80"
            - "${err_low} == \"ERR_FOOD_SAFETY_SCORE_TOO_LOW\""
            - "FieldKitchen.${fk_id}.site_status == \"FOOD_SAFETY_CLEARED\""
      - name: run_cost_allocation_per_stop_rounding_then_residual
        grounds:
          - calculations.run_cost_allocation
          - entities.DistributionStop.fields.allocated_cost_cents
          - state_machines.DistributionRun.DELIVERING_to_COMPLETED
        distinguishing_aspect: |
          The 10000-cent run pool is divided over three DELIVERED stops of 3 meals each by rounding each
          stop's share independently (3333/3333/3333) and then assigning the 1-cent residual to the
          lowest stop_sequence, so stop 1 receives 3334 while stops 2 and 3 receive 3333; rounding the
          summed total once instead would have produced 3333/3333/3334.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "FieldKitchen ${fk_id} is OPERATIONAL"
            - "DistributionSites ${s1}, ${s2}, ${s3} are REGISTERED with access_constraint OPEN"
            - "DistributionRun ${run_id} is DELIVERING with total_cost_cents 10000, loaded_meals 9 and three stops of 3 planned meals each, all DELIVERED"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "UTILITIES_PENDING" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "OPERATIONAL" }
              as: FieldCoordinator
            - call: "POST /field-ops/distribution-sites"
              payload: { incident_id: "${inc_id}", site_name: "Oak Shelter", site_type: "SHELTER", population_served: 300, daily_meal_request: 600, access_constraint: "OPEN" }
              as: LogisticsCoordinator
              captures: { s1: "$.data.id" }
            - call: "POST /field-ops/distribution-sites"
              payload: { incident_id: "${inc_id}", site_name: "Valley Hospital", site_type: "HOSPITAL", population_served: 200, daily_meal_request: 400, access_constraint: "OPEN" }
              as: LogisticsCoordinator
              captures: { s2: "$.data.id" }
            - call: "POST /field-ops/distribution-sites"
              payload: { incident_id: "${inc_id}", site_name: "Elm Neighbourhood", site_type: "NEIGHBORHOOD", population_served: 250, daily_meal_request: 500, access_constraint: "OPEN" }
              as: LogisticsCoordinator
              captures: { s3: "$.data.id" }
            - call: "POST /field-ops/distribution-runs"
              payload: { incident_id: "${inc_id}", field_kitchen_id: "${fk_id}", driver_name: "Ana Ruiz", driver_phone: "+15550100", driver_safety_training_completed: true, vehicle_type: "VAN", planned_date: "2026-09-01T07:00:00Z", window_start: "2026-09-01T07:00:00Z", window_end: "2026-09-01T19:00:00Z", fuel_cost_cents: 6000, handling_cost_cents: 4000 }
              as: LogisticsCoordinator
              captures: { run_id: "$.data.id" }
            - call: "GET /field-ops/distribution-runs/${run_id}"
              as: LogisticsCoordinator
              captures: { run_v1: "$.data.version" }
            - call: "POST /field-ops/distribution-stops"
              payload: { distribution_run_id: "${run_id}", distribution_site_id: "${s1}", stop_sequence: 1, planned_meals: 3, expected_distribution_run_version: "${run_v1}" }
              as: LogisticsCoordinator
              captures: { st1: "$.data.id" }
            - call: "GET /field-ops/distribution-runs/${run_id}"
              as: LogisticsCoordinator
              captures: { run_v2: "$.data.version" }
            - call: "POST /field-ops/distribution-stops"
              payload: { distribution_run_id: "${run_id}", distribution_site_id: "${s2}", stop_sequence: 2, planned_meals: 3, expected_distribution_run_version: "${run_v2}" }
              as: LogisticsCoordinator
              captures: { st2: "$.data.id" }
            - call: "GET /field-ops/distribution-runs/${run_id}"
              as: LogisticsCoordinator
              captures: { run_v3: "$.data.version" }
            - call: "POST /field-ops/distribution-stops"
              payload: { distribution_run_id: "${run_id}", distribution_site_id: "${s3}", stop_sequence: 3, planned_meals: 3, expected_distribution_run_version: "${run_v3}" }
              as: LogisticsCoordinator
              captures: { st3: "$.data.id" }
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "LOADING" }
              as: LogisticsCoordinator
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "EN_ROUTE", loaded_meals: 9 }
              as: LogisticsCoordinator
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "DELIVERING" }
              as: LogisticsCoordinator
            - call: "POST /field-ops/distribution-stops/${st1}/transitions"
              payload: { to_state: "DELIVERED", delivered_meals: 3 }
              as: SiteCoordinator
              as_user_id: "${s1}"
            - call: "POST /field-ops/distribution-stops/${st2}/transitions"
              payload: { to_state: "DELIVERED", delivered_meals: 3 }
              as: SiteCoordinator
              as_user_id: "${s2}"
            - call: "POST /field-ops/distribution-stops/${st3}/transitions"
              payload: { to_state: "DELIVERED", delivered_meals: 3 }
              as: SiteCoordinator
              as_user_id: "${s3}"
          trigger:
            - call: "POST /field-ops/distribution-runs/${run_id}/transitions"
              payload: { to_state: "COMPLETED" }
              as: LogisticsCoordinator
          assert:
            - "DistributionStop.${st1}.allocated_cost_cents == 3334"
            - "DistributionStop.${st2}.allocated_cost_cents == 3333"
            - "DistributionStop.${st3}.allocated_cost_cents == 3333"
            - "DistributionStop.${st1}.allocated_cost_cents + DistributionStop.${st2}.allocated_cost_cents + DistributionStop.${st3}.allocated_cost_cents == 10000"
            - "DistributionRun.${run_id}.unallocated_cost_cents == 0"

      - name: meal_order_cost_buildup_pinned_evaluation_order
        grounds:
          - calculations.meal_order_cost_buildup
          - entities.MealOrder.fields.provisional_cost_cents
          - entities.MealOrder.fields.volume_discount_cents
          - validations[priority=29]
        distinguishing_aspect: |
          The volume-discount tier is keyed on the pre-discount subtotal, the logistics fee is added
          before the discount base is formed and the total is computed last: 1000 meals at 1500 cents
          give subtotal 1500000, STANDARD tier, fee 45000, discount 77250 and provisional total
          1467750, whereas keying the tier on the post-fee total or discounting the subtotal alone
          yields a different number.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE with funding_ceiling_cents 5000000"
            - "PartnerKitchen ${pk_id} is CONTRACTED with per_meal_price_cents 1500"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "VETTING" }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "GET /field-ops/partner-kitchens/${pk_id}"
              as: ProductionPlanner
              captures: { pk_v: "$.data.version" }
          trigger:
            - call: "POST /field-ops/meal-orders"
              payload: { incident_id: "${inc_id}", partner_kitchen_id: "${pk_id}", menu_name: "Arroz con Pollo", dietary_tags: ["VEGETARIAN"], ordered_meals: 1000, scheduled_start: "2026-09-01T08:00:00Z", production_hours: 4, expected_partner_kitchen_version: "${pk_v}" }
              as: ProductionPlanner
              captures: { mo_id: "$.data.id" }
          assert:
            - "MealOrder.${mo_id}.subtotal_cents == 1500000"
            - "MealOrder.${mo_id}.logistics_fee_cents == 45000"
            - "MealOrder.${mo_id}.volume_discount_cents == 77250"
            - "MealOrder.${mo_id}.provisional_cost_cents == 1467750"
            - "MealOrder.${mo_id}.provisional_cost_cents == MealOrder.${mo_id}.subtotal_cents + MealOrder.${mo_id}.logistics_fee_cents - MealOrder.${mo_id}.volume_discount_cents"

  - rule_id: non_linear_state_machine
    instances:
      - name: partner_kitchen_parallel_contract_and_production_dimensions
        grounds:
          - state_machines.PartnerKitchen.transitions
          - state_machines.PartnerKitchen.transitions
          - entities.PartnerKitchen.fields.contract_status
          - entities.PartnerKitchen.fields.production_status
        distinguishing_aspect: |
          PartnerKitchen carries two independent state dimensions on one row, contract_status and
          production_status, and a CONTRACT-dimension transition to SUSPENDED rewrites production_status
          to COOLDOWN even though no PRODUCTION-dimension call was made, so one row holds SUSPENDED on the
          contract axis and COOLDOWN on the production axis at once.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE"
            - "PartnerKitchen ${pk_id} is CONTRACTED / PRODUCING with cooldown_until null"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
