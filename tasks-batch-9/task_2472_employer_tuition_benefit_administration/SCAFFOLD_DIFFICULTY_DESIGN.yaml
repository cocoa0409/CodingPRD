  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: approval_request_revision_cycle_capped_at_two_rounds
        grounds: >-
          §1.2 ProgramApprovalRequest is cyclic: CHANGES_REQUESTED -> SUBMITTED -> UNDER_REVIEW ->
          CHANGES_REQUESTED can be traversed repeatedly, and the resubmit precondition
          "revision_count < 2 (MAX_REVISION_ROUNDS)" is the only thing that terminates the loop.
          The same three endpoints must therefore succeed on rounds 1 and 2 and the identical
          third resubmit must fail, which is only possible if the implementation carries a
          revision counter across the cycle rather than treating each pass as fresh.
        distinguishing_aspect: >-
          Non-linearity is a CYCLE with a loop-count termination condition, on the
          ProgramApprovalRequest entity. The paired instance exercises PARALLEL independent state
          dimensions on the Enrollment entity, a different entity and a different shape.
        test_recipe:
          setup: >-
            The Northwind fixture plus a second Cascade State program ("MS Business Analytics")
            that has no catalog listing, so the employee must raise a non-catalog approval request.
            The request is driven twice around the revision cycle, ending in CHANGES_REQUESTED with
            revision_count 2.
          setup_api_calls:
            - *a_clock
            - *a_employer
            - *a_policy
            - *a_activate_policy
            - *a_employee
            - *a_school
            - *a_program
            - *a_agreement
            - *a_activate_agreement
            - *a_listing
            - call: "POST /schools/${school_id}/programs"
              payload:
                name: "MS Business Analytics"
                credential_type: "MASTER"
                skill_track: "BUSINESS_ADMIN"
                list_tuition_per_credit_cents: 90000
                total_credits: 30
                term_length_weeks: 14
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_b_id: "$.data.id" }
            - call: "POST /program-approval-requests"
              payload:
                employee_id: "${employee_id}"
                program_id: "${program_b_id}"
                justification: "Analytics degree needed for the demand-planning ladder."
                requested_annual_cost_cents: 540000
              as: Employee
              as_user_id: "${employee_id}"
              captures: { request_id: "$.data.id" }
            - call: "POST /program-approval-requests/${request_id}/review"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /program-approval-requests/${request_id}/decide"
              payload: { decision: "REQUEST_CHANGES", decision_note: "Add the manager endorsement." }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /program-approval-requests/${request_id}/resubmit"
              payload: { justification: "Manager endorsement attached; ladder plan revised." }
              as: Employee
              as_user_id: "${employee_id}"
              captures: { revision_after_first: "$.data.revision_count" }
            - call: "POST /program-approval-requests/${request_id}/review"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /program-approval-requests/${request_id}/decide"
              payload: { decision: "REQUEST_CHANGES", decision_note: "Cost estimate still exceeds the annual cap." }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /program-approval-requests/${request_id}/resubmit"
              payload: { requested_annual_cost_cents: 480000 }
              as: Employee
              as_user_id: "${employee_id}"
              captures: { revision_after_second: "$.data.revision_count" }
            - call: "POST /program-approval-requests/${request_id}/review"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - call: "POST /program-approval-requests/${request_id}/decide"
              payload: { decision: "REQUEST_CHANGES", decision_note: "Third pass: cost still not funded." }
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
          trigger: "POST /program-approval-requests/${request_id}/resubmit a third time"
          assert: >-
            The cycle is traversed twice: after the first resubmit the request is SUBMITTED with
            revision_count 1, after the second it is SUBMITTED with revision_count 2, and each
            intervening review/decide pair returns UNDER_REVIEW then CHANGES_REQUESTED with the
            supplied decision_note stored. The trigger is rejected with 409 and error_id
            ERR_REVISION_LIMIT_REACHED because revision_count 2 is no longer < 2, and
            GET /program-approval-requests/${request_id} still shows status CHANGES_REQUESTED with
            revision_count 2 and decision_note "Third pass: cost still not funded." (no state
            change from the rejected call). Because no pass ever reached APPROVED,
            GET /catalog-listings?source_request_id=${request_id} returns total_count 0 - the
            REQUEST_CHANGES branch never materialises a listing.

      - name: enrollment_academic_and_funding_axes_advance_independently
        grounds: >-
          §1.2 gives Enrollment two state machines over two different fields:
          academic_status (REGISTERED -> IN_PROGRESS -> PASSED) and funding_status
          (RESERVED -> BILLED -> SETTLED for DIRECT_BILL, RESERVED -> SETTLED for REIMBURSEMENT).
          The PASSED transition explicitly does not touch funding_status, and the invoice/claim
          transitions do not touch academic_status, so the reachable combined states differ by
          funding model: a direct-bill enrollment is (IN_PROGRESS, SETTLED) before any outcome
          exists, while a reimbursement enrollment is (PASSED, RESERVED) before any money moves.
        distinguishing_aspect: >-
          Non-linearity is PARALLEL dimensions - two independent state fields on the Enrollment
          entity whose combined state is model-dependent. The paired instance is a cycle with a
          loop cap on ProgramApprovalRequest, a different entity and shape.
        test_recipe:
          setup: >-
            A HYBRID employer (cap 2000000, reimbursement_pct 0.50) with one eligible engineer, an
            ACTIVE agreement at 0.25 discount over a 40000-cent certificate program (listed at
            30000 per credit), and two four-credit enrollments in non-overlapping terms: E1 chooses
