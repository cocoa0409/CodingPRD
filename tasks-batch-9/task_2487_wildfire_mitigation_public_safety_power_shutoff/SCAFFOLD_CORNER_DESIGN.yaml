      - name: fire_potential_index_variant_divergence_and_rounding_isolation
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: fpi_forecast_envelope_vs_validated_latest_divergence
          rationale: "Both variants are computed over the identical observation set there (85.93 FORECAST versus 78.69 VALIDATED), and the companion instance fpi_variant_intermediate_rounding_isolated pins the 1-decimal pre-rounding as the sole cause of the 85.93 / 85.97 split."
      - name: net_benefit_variant_selection_by_event_phase
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: net_benefit_pre_event_vs_post_event_window
          rationale: "Variant selection (PRE_EVENT before de-energization, POST_EVENT once actual timestamps exist) and the delta on the switch are the whole subject of that instance."
      - name: scope_determination_topological_downstream_closure
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: ignition_risk_per_term_rounding_order_pinned
          rationale: "The breadth-first downstream closure over upstream_circuit_id, the inherited fpi_score_applied and the per-term rounding that makes 15.48 differ from a sum-then-round 15.47 are all asserted there."
      - name: net_benefit_credit_rate_band_selection
        claim_type: Constants Applied
        excluded_because:
