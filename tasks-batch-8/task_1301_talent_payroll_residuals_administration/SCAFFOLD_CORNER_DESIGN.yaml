            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-12", jurisdiction_code: "CA", call_time: "2026-08-12T04:00:00Z", first_meal_out: "2026-08-12T09:00:00Z", first_meal_in: "2026-08-12T09:30:00Z", wrap_time: "2026-08-12T18:00:00Z", scheduled_hours: 12 }
