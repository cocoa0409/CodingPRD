            - "CxProject.${p}.retainage_withheld_cents == 2000000"
            - "${err} == ERR_REVIEW_ROUNDS_EXCEEDED with HTTP 422"

      - name: equipment_install_and_verification_dimensions_advance_independently
        grounds:
          - state_machines.EquipmentUnit.install_status.INSTALLED_to_STARTED_UP
          - state_machines.EquipmentUnit.verification_status.UNVERIFIED_to_PREFUNCTIONAL_VERIFIED
          - state_machines.EquipmentUnit.verification_status.PREFUNCTIONAL_VERIFIED_to_UNVERIFIED
          - entities.EquipmentUnit.fields.install_status
          - entities.EquipmentUnit.fields.verification_status
        distinguishing_aspect: |
          EquipmentUnit carries two parallel state dimensions on one row: the
          checklist verification promotes verification_status to
          PREFUNCTIONAL_VERIFIED while install_status is still INSTALLED, the
          install transition to STARTED_UP leaves verification_status untouched,
          and a blocking issue demotes verification_status to UNVERIFIED while
          install_status stays STARTED_UP; the non-linearity lives on
          EquipmentUnit, a different entity from the cyclic Submittal instance.
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 (CRITICAL, contract_value_cents 1000000, weight_units 10)."
            - "E1 is INSTALLED with a fully recorded, executed and verified pre-functional checklist, then advanced to STARTED_UP."
