      - name: arbitrage_allowance_strictly_above_permitted_yield
        grounds:
          - calculations.arbitrage_yield_and_restriction
          - calculations.arbitrage_yield_and_restriction.constants.ONE_EIGHTH_ALLOWANCE_PCT
          - endpoints[POST /bond-offerings/deals/{id}/yield-restriction-analysis]
        distinguishing_aspect: |
          A different metric (the projected investment yield in percent, carried to four decimal
          places) on a different endpoint (POST /deals/{id}/yield-restriction-analysis). The
          comparison against permitted_investment_yield_pct is STRICT, so equality at 4.2083 does
          not restrict while 4.2084 does; the one-ten-thousandth step is also the smallest
          representable move at the declared precision, and it yields excess earnings of exactly
          2.50 on 5,000,000 over 180 days.
        test_recipe:
          setup:
            - "Firm MA0001 is a MUNICIPAL_ADVISOR and issuer C is a CITY."
            - "A deal carries tranche 1 (5,000,000, coupon 5.000, yield 4.250, matures 2036-08-01, 20 semiannual periods, bond years 50000) and tranche 2 (5,000,000, coupon 5.000, yield 4.000, matures 2046-08-01, 40 semiannual periods, bond years 100000)."
            - "arbitrage_yield_pct is therefore 4.0833 and permitted_investment_yield_pct is 4.2083."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026Y", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 10000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/maturity-tranches"
              payload: { sequence_number: 2, maturity_date: "2046-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.000, is_callable: true, first_call_date: "2036-08-01T00:00:00.000Z", call_price_pct: 100.000 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/yield-restriction-analysis"
              payload: { projected_investment_yield_pct: 4.2082, unspent_proceeds_usd: 5000000, investment_days: 180 }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/deals/${deal_id}/yield-restriction-analysis"
              payload: { projected_investment_yield_pct: 4.2083, unspent_proceeds_usd: 5000000, investment_days: 180 }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/deals/${deal_id}/yield-restriction-analysis"
              payload: { projected_investment_yield_pct: 4.2084, unspent_proceeds_usd: 5000000, investment_days: 180 }
              as: ComplianceOfficer
          assert:
            - "every response returns 200 with arbitrage_yield_pct 4.0833 and permitted_investment_yield_pct 4.2083"
            - "at projected 4.2082: yield_restriction_applies == false and excess_earnings_usd == 0.00"
            - "at projected 4.2083 (exactly the permitted yield): yield_restriction_applies == false and excess_earnings_usd == 0.00, because the comparison is strictly greater than"
            - "at projected 4.2084: yield_restriction_applies == true and excess_earnings_usd == 2.50"
            - "no call mutates anything: Deal.${deal_id}.arbitrage_yield_pct is still null and Deal.${deal_id}.version is unchanged across the three calls"

  - rule_id: cross_entity_state_dependency
