      - name: product_trial_cycle_back_into_testing_after_retest
        claim_type: cyclic
        grounds:
          - state_machines.ProductTrial.transitions[RETEST_REQUIRED -> TESTING]
          - entities.ProductTrial.fields.retest_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / product_trial_retest_cycle_reenters_testing_then_passes
          rationale: "The loop edge, the retest_count increment and the eventual PASS out of the cycle are all asserted by that §1.8 instance."

      - name: machine_order_reenters_in_build_after_fat_failure
        claim_type: cyclic
        grounds:
          - state_machines.MachineOrder.dimension[fulfillment_status].transitions[FAT_FAILED -> IN_BUILD]
          - state_machines.BuildSlot.transitions[REWORK_HOLD -> IN_BUILD]
        excluded_because:
          difficulty_instance: non_linear_state_machine / machine_order_fat_failure_reenters_in_build_from_rework_hold
          rationale: "The FAT-failure re-entry edge on both the order and its slot is asserted by that §1.8 instance."

      - name: fat_failure_cascade_down_to_slot_and_line
        claim_type: Cascade down
        grounds:
          - state_machines.BuildSlot.transitions[IN_BUILD -> REWORK_HOLD]
          - state_machines.BuildSlot.transitions[RESERVED -> DISPLACED]
        excluded_because:
          difficulty_instance: transitive_cascade / fat_failure_cascade_extends_slot_and_displaces_downstream_slot
          rationale: "The three-hop cascade (test -> order.rework_days -> slot end_date -> downstream slot DISPLACED) is asserted by that §1.8 instance."

      - name: goodwill_exhaustion_cascade_holds_scheduled_visits
        claim_type: Conditional cascade
        grounds:
          - state_machines.PreventiveMaintenanceVisit.transitions[SCHEDULED -> BILLABLE_HOLD]
          - calculations.coverage_posture
        excluded_because:
          difficulty_instance: transitive_cascade / claim_adjudication_cascade_exhausts_goodwill_and_holds_visit
          rationale: "The conditional cascade (only SCHEDULED visits of that contract, only on BUDGET_EXHAUSTED) is asserted by that §1.8 instance."

      - name: claim_void_reverses_every_original_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.WarrantyClaim.transitions[ADJUDICATED -> VOID]
          - state_machines.PreventiveMaintenanceVisit.transitions[BILLABLE_HOLD -> SCHEDULED]
        excluded_because:
