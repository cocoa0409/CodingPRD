            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { err: $.data.error_id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id }
          assert:
            - "First create: error_id == ERR_SHIFT_NOT_OPEN_FOR_ORDERS, HTTP 409"
            - "After open-for-orders: identical create succeeds with 201 and GangOrder.${g}.status == PLACED"

      - name: start_work_blocked_by_partial_stoppage_posture
        grounds:
          - calculations.work_posture_derivation
          - validations[priority=7]
          - state_machines.GangOrder.MANNED_to_WORKING
        distinguishing_aspect: |
          Pair GangOrder -> VesselCall (posture): a MAJOR incident scoped to a DIFFERENT
          gang (GANG scope) derives PARTIAL_STOPPAGE, which blocks start-work even though
          the target gang is MANNED, equipped, and on an IN_PROGRESS shift — a cross-entity
          gate via a derived aggregate field, distinct from the GangOrder -> ShiftWindow pair.
        test_recipe:
          setup:
            - "Vessel; shift IN_PROGRESS; gang G_m MANNED with W1 checked in and RTG-1 booked; gang G_x PLACED"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV XDep2", voyage_number: "X-302", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "CRANE_GANG", required_classification: "CRANE_OPERATOR", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 1 }
              as: StevedoreSuperintendent
              captures: { gm: $.data.id, gm_v: $.data.version }
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "LASHING_GANG", required_classification: "LASHER", required_headcount: 1, required_equipment_type: "FORKLIFT", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { gx: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Crane Op", registration_number: "R010", classification: "CRANE_OPERATOR", registered_on: "2010-01-01", base_hourly_rate_cents: 5000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/equipment-units"
              payload: { unit_code: "RTG-1", equipment_type: "RTG" }
              as: StevedoreAdmin
              captures: { e1: $.data.id }
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${gm}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T08:00:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
            - call: "GET /api/gang-orders/${gm}"
              as: StevedoreSuperintendent
              captures: { gm_v_now: $.data.version }
            - call: "POST /api/gang-orders/${gm}/dispatch-batch"
              payload: { expected_gang_order_version: "${gm_v_now}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${gm}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/safety-incidents"
              payload: { vessel_call_id: "${v}", scope: "GANG", severity: "MAJOR", description: "Lashing bar injury", gang_order_id: "${gx}" }
              as: StevedoreSuperintendent
              captures: { inc: $.data.id }
          trigger:
            - call: "POST /api/gang-orders/${gm}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
            - call: "POST /api/safety-incidents/${inc}/clear"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders/${gm}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
              captures: { st: $.data.status }
          assert:
            - "With the MAJOR/GANG incident open: VesselCall.${v}.work_posture == PARTIAL_STOPPAGE and start-work returns error_id == ERR_WORK_STOPPAGE_ACTIVE (HTTP 409)"
            - "GangOrder.${gm} remains MANNED while blocked"
            - "After clear: posture NORMAL and the retried start-work succeeds — GangOrder.${gm}.status == WORKING"

      - name: invoice_finalize_requires_completed_vessel
        grounds:
          - state_machines.Invoice.DRAFT_to_FINALIZED
          - validations[priority=6]
        distinguishing_aspect: |
          Pair Invoice -> VesselCall: finalize is rejected with
          ERR_INVOICE_NOT_FINALIZABLE while the vessel call is merely BERTHED; the
          invoice's own state (DRAFT) is valid — the gate lives entirely on the
          referenced vessel's state. Distinct entity pair from both prior instances.
        test_recipe:
          setup:
            - "Vessel BERTHED (no shifts started); invoice DRAFT created from planned figures"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV XDep3", voyage_number: "X-303", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 100, planned_tons: 50, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/invoices"
              payload: { vessel_call_id: "${v}" }
              as: BillingClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /api/invoices/${inv}/finalize"
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVOICE_NOT_FINALIZABLE, HTTP 409"
            - "Invoice.${inv} remains DRAFT with rate_variant == PROVISIONAL"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_half_open_shift_overlap_adjacency_allowed
        grounds:
          - calculations.dispatch_selection
          - validations[priority=9]
        distinguishing_aspect: |
          Resource: Worker. Interval semantics: half-open [start, end) — a worker
          OFFERED on a 08:00-16:00 gang may also be offered on a 16:00-23:00 gang
          (adjacency, e1 == s2, is NOT a conflict), while a forced dispatch onto a
          15:00-20:00 gang IS rejected with ERR_WORKER_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Vessel with three OPEN shifts: S1 08:00-16:00, S2 16:00-23:00, S3 15:00-20:00"
            - "Gang G1 on S1 and G2 on S2 each headcount 1 HOLDMAN; W1 is the only HOLDMAN"
            - "G3 on S3 headcount 1 PLACED"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Overlap", voyage_number: "O-401", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s1: $.data.id }
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "NIGHT", start_utc: "2026-08-10T16:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s2: $.data.id }
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "NIGHT", start_utc: "2026-08-10T15:00:00Z", end_utc: "2026-08-10T20:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s3: $.data.id }
            - call: "POST /api/shift-windows/${s1}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows/${s2}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows/${s3}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s1}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g1: $.data.id, g1_v: $.data.version }
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s2}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g2: $.data.id, g2_v: $.data.version }
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s3}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g3: $.data.id, g3_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/gang-orders/${g1}/dispatch-batch"
              payload: { expected_gang_order_version: "${g1_v}" }
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g2}/dispatch-batch"
              payload: { expected_gang_order_version: "${g2_v}" }
              as: LaborHallDispatcher
          trigger:
            - call: "POST /api/gang-orders/${g3}/dispatch-batch"
              payload: { expected_gang_order_version: "${g3_v}", worker_ids: ["${w1}"] }
              as: LaborHallDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Adjacency: W1 holds OFFERED assignments on BOTH G1 (08:00-16:00) and G2 (16:00-23:00) — GET /api/dispatch-assignments?worker_id=${w1} returns 2 rows, both status OFFERED"
            - "Overlap: forced dispatch of W1 onto G3 (15:00-20:00 overlaps both) returns error_id == ERR_WORKER_DOUBLE_BOOKED, HTTP 409"
            - "GangOrder.${g3} remains PLACED with offered_count == 0"

      - name: equipment_buffered_window_thirty_minute_gap_rule
        grounds:
          - calculations.equipment_window_conflict
          - validations[priority=9]
        distinguishing_aspect: |
          Resource: EquipmentUnit. Interval semantics differ from the worker rule:
          bookings carry a 30-minute turnaround buffer, so a follow-on booking starting
          0 minutes after the previous one ends CONFLICTS, while exactly 30 minutes of
          gap is ALLOWED (strict inequality on the buffered interval). Same resource can
          hold multiple disjoint bookings while ASSIGNED.
        test_recipe:
          setup:
            - "Vessel/shift OPEN; gangs G1, G2 PLACED; unit RTG-1 already booked 08:00-12:00 on G1"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Buffer", voyage_number: "O-402", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T20:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "CRANE_GANG", required_classification: "CRANE_OPERATOR", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 1 }
              as: StevedoreSuperintendent
              captures: { g1: $.data.id }
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "CRANE_GANG", required_classification: "CRANE_OPERATOR", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 1 }
              as: StevedoreSuperintendent
              captures: { g2: $.data.id }
            - call: "POST /api/equipment-units"
              payload: { unit_code: "RTG-1", equipment_type: "RTG" }
              as: StevedoreAdmin
              captures: { e1: $.data.id }
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${g1}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T08:00:00Z", window_end_utc: "2026-08-10T12:00:00Z" }
              as: StevedoreSuperintendent
              captures: { ea1: $.data.id }
          trigger:
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${g2}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T12:00:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { err: $.data.error_id }
            - call: "POST /api/equipment-assignments"
              payload: { gang_order_id: "${g2}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T12:30:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { ea2: $.data.id }
          assert:
            - "0-minute gap (12:00 after 12:00): error_id == ERR_EQUIPMENT_WINDOW_CONFLICT, HTTP 409 — the 30-minute buffer makes adjacency illegal, unlike the worker half-open rule"
            - "Exactly-30-minute gap (12:30 after 12:00): created, EquipmentAssignment.${ea2}.status == RESERVED"
            - "EquipmentUnit.${e1}.status == ASSIGNED after both bookings (multiple disjoint bookings share one unit)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: bump_plus_refill_restores_filled_headcount
        grounds:
          - calculations.filled_headcount
          - state_machines.DispatchAssignment.CHECKED_IN_to_BUMPED
          - state_machines.DispatchAssignment.OFFERED_to_CHECKED_IN
        distinguishing_aspect: |
          Conserved quantity: GangOrder.filled_headcount. The forward action (bump of a
          CHECKED_IN worker) decrements it to 0 and triggers a compensating auto-offer;
          check-in of the auto-offered replacement restores it to exactly 1 — and the
          bumped worker is provably excluded from the refill pool.
        test_recipe:
          setup:
            - "Vessel/shift IN_PROGRESS; gang G headcount 1; W1 (rank 1) CHECKED_IN (filled 1, MANNED); W2 (rank 2) eligible"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Invariant", voyage_number: "I-501", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
          trigger:
            - call: "POST /api/dispatch-assignments/${a1}/bump"
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a2: "$.data[1].id" }
            - call: "POST /api/dispatch-assignments/${a2}/check-in"
              as: LaborHallDispatcher
          assert:
            - "Before bump: GangOrder.${g}.filled_headcount == 1 and status == MANNED"
            - "After bump: DispatchAssignment.${a1}.status == BUMPED; filled_headcount == 0; a new OFFERED assignment ${a2} exists with worker_id == ${w2} (NOT ${w1} — bump exclusion)"
            - "After replacement check-in: filled_headcount == 1 again and status == MANNED — forward bump + compensating refill conserve filled_headcount"

      - name: move_record_void_restores_vessel_actuals
        grounds:
          - state_machines.MoveRecord.RECORDED_to_VOIDED
          - entities.VesselCall.fields.actual_moves
          - entities.VesselCall.fields.actual_tons
        distinguishing_aspect: |
          Conserved quantity: the vessel's cargo aggregates (actual_moves / actual_tons),
          a different quantity type than headcount. Recording a 30-move/5-ton period then
          voiding it returns both aggregates to their pre-record values (0) — forward
          action plus compensating void leaves no drift.
        test_recipe:
          setup:
            - "Vessel WORKING with gang G (headcount 1) in WORKING; vessel actual_moves == 0, actual_tons == 0"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Ledger", voyage_number: "I-502", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 50, planned_tons: 10, contracted_mph_target: 20.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
          trigger:
            - call: "POST /api/move-records"
              payload: { gang_order_id: "${g}", period_start_utc: "2026-08-10T08:00:00Z", period_end_utc: "2026-08-10T09:00:00Z", moves_count: 30, tons_lifted: 5, stoppage_minutes: 0 }
              as: GangForeman
              as_user_id: "${w1}"
              captures: { mr: $.data.id }
            - call: "GET /api/vessel-calls/${v}"
              as: StevedoreSuperintendent
              captures: { moves_after_add: $.data.actual_moves, tons_after_add: $.data.actual_tons }
            - call: "POST /api/move-records/${mr}/void"
              as: GangForeman
              as_user_id: "${w1}"
            - call: "GET /api/vessel-calls/${v}"
              as: StevedoreSuperintendent
              captures: { moves_after_void: $.data.actual_moves, tons_after_void: $.data.actual_tons }
          assert:
            - "After record: VesselCall.${v}.actual_moves == 30 and actual_tons == 5"
            - "After void: MoveRecord.${mr}.status == VOIDED and VesselCall.${v}.actual_moves == 0 and actual_tons == 0 — the record+void pair conserves the aggregates"
