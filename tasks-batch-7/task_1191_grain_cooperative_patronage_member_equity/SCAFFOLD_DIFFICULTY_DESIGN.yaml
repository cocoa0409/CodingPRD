              as: CoopRegistrar
              captures: { m14: $.data.id }
            - call: "POST /coop/members/${m13}/record_death"
              payload: { date_of_death: "2026-01-01T00:00:00Z", executor_member_id: "${m14}" }
              as: CoopRegistrar
            - call: "GET /coop/members/${m13}/estate_claims"
              payload: {}
              as: CoopRegistrar
              captures: { ec2: "$.data[0].id" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/estate_claims/${ec2}/record_probate"
              payload: { probate_completed_at: "2026-01-30T00:00:00Z" }
              as: CoopRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COMPLIANCE_GATE  # priority 7 (safety) wins over priority 9 (referential)"
            - "EstateClaim.${ec2}.status == FILED  # unchanged"

  # ============================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_volume_boundary_at_1000_bushels
        grounds:
          - calculations.tier_rate_modifier
          - entities.PatronageAllocation.fields.tier_code
        distinguishing_aspect: |
          Numeric threshold boundary on the volume metric: allocated_volume_bu = 999
          yields tier T1 (rate_mod 1.00); allocated_volume_bu = 1000 yields tier T2
          (rate_mod 1.05) — `>=` on the lower bound, NOT `>`. Reachable via
          POST /coop/deliveries + settle + close_provisional.
        test_recipe:
          setup:
            - "District DIST-K, Members M15 (999 bu) and M16 (1000 bu), FY10 OPEN"
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-K", name: "District K", max_delegates: 3 }
              as: CoopAdmin
              captures: { dist_k: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-015", legal_name: "Mike Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_k}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m15: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-016", legal_name: "Nina Farm", member_class: "INDIVIDUAL", joined_at: "2020-01-01T00:00:00Z", delegate_district_id: "${dist_k}", is_producer_member: true }
