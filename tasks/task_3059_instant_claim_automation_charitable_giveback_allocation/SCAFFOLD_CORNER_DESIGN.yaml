# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3059_instant_claim_automation_charitable_giveback_allocation
#
# Breadth probe over the §1.1–§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Shared setup vocabulary: "standard bound policy" =
#   clock 2026-09-01T00:00:00Z; cause; cohort 2026 OPEN; APPROVED PCT filing
#   (cap 0.30) + ACTIVE FeeConfig (pct 0.20) for the policyholder's state;
#   policyholder → quote → clean application → approve → policy; premium paid
#   via POST /policies/{id}/premium-payments unless stated otherwise.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: rate_filing_create_returns_declared_fields_and_submitted_status
        claim_type: Creation
        grounds:
          - entities.RateFiling
          - endpoints.POST_/rate-filings
        distinguishing_aspect: "A filing created with all four inputs returns 201 with status SUBMITTED, version 1, null approved_at, and system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.25, max_flat_fee_cap_cents: 25000, filing_mode: "ABSOLUTE_CENTS" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
          assert:
            - "HTTP 201, response_type object, meta.api_request_id present"
            - "RateFiling.${filing}.status == SUBMITTED, version == 1, approved_at is null"
            - "state_code == TX, max_flat_fee_pct == 0.25, max_flat_fee_cap_cents == 25000, filing_mode == ABSOLUTE_CENTS"

      - name: policyholder_create_applies_defaults
        claim_type: Defaults
        grounds:
          - entities.Policyholder.fields.status
          - entities.Policyholder.fields.fraud_strike_count
        distinguishing_aspect: "Registration with only email/full_name/state_code yields status ACTIVE and fraud_strike_count 0 — neither is client-settable."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /policyholders"
              payload: { email: "d@x.com", full_name: "D Ef", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
          assert:
            - "HTTP 201; Policyholder.${ph}.status == ACTIVE and fraud_strike_count == 0"

      - name: quote_create_computes_expires_at_30_days_out
        claim_type: Computed Fields
        grounds:
          - entities.Quote.fields.expires_at
        distinguishing_aspect: "A quote created at 2026-09-01T00:00:00Z has expires_at exactly 2026-10-01T00:00:00Z (30-day TTL computed, never client-supplied)."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Policyholder exists."]
          setup_api_calls:
            - *c_clock
            - call: "POST /policyholders"
              payload: { email: "q@x.com", full_name: "Q Uote", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 100000, premium_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
          assert:
            - "HTTP 201; Quote.${q}.expires_at == 2026-10-01T00:00:00Z"
            - "Quote.${q}.status == OPEN and state_code == TX (copied from the policyholder)"

      - name: cohort_get_recomputes_aggregates_from_ledger
        claim_type: Computed Fields
        grounds:
          - entities.Cohort.fields.claims_pot_cents
          - calculations.fee_split_on_premium_charge
        distinguishing_aspect: "After one 100000-cent premium payment with pct fee 0.20 and no treaty, the cohort read shows premium_pool 100000, fee_retained 20000, reinsurance_ceded 0, claims_pot 80000."
        test_recipe:
          setup: ["Standard bound policy in state TX (pct filing 0.30 cap; fee pct 0.20), premium 100000 fully paid; no treaty."]
          setup_api_calls:
            - *c_clock
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
          trigger:
            - call: "GET /cohorts/${cohort_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "Cohort.${cohort_id}.premium_pool_cents == 100000, fee_retained_cents == 20000, reinsurance_ceded_cents == 0, claims_pot_cents == 80000"
            - "Cohort.${cohort_id}.giveback_actual_cents == 80000 and giveback_projected_cents == 80000 (no claims)"

      - name: claims_list_paginates_with_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/claims
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three claims (two PAID, one ESCALATED) on one policy, status filter + limit/offset paginate consistently: limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row has_more false."
        test_recipe:
          setup: ["Standard bound policy, premium 600000 paid. Three claims: 1000/0.10 PAID, 2000/0.10 PAID, 3000/0.90 ESCALATED."]
          setup_api_calls:
            - *c_clock
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 900000, premium_cents: 600000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 600000 }
              as: FinanceOps
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v1", claimed_amount_cents: 1000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph}"
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v2", claimed_amount_cents: 2000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph}"
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v3", claimed_amount_cents: 3000, fraud_score: 0.90 }
              as: Policyholder
              as_user_id: "${ph}"
          trigger:
            - call: "GET /claims"
              payload: { policy_id: "${pol}", limit: 2, offset: 0 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "HTTP 200, response_type array, 2 rows, total_count == 3, has_more == true"
            - "GET /claims?policy_id=${pol}&limit=2&offset=2 returns 1 row, total_count 3, has_more false"
            - "GET /claims?policy_id=${pol}&status=PAID returns 2 rows; status=ESCALATED returns 1 row"

      - name: get_unknown_policy_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/policies/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A well-formed but unallocated policy id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (HTTP 404)"

      - name: claim_payment_has_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.ClaimPayment
        distinguishing_aspect: "ClaimPayment is common_fields:false and append-only: it carries no version field and exposes no mutation endpoint; reads show SETTLED with no updated_at."
        test_recipe:
          setup: ["Standard bound policy premium 100000 paid; one instant-paid claim."]
          setup_api_calls:
            - *c_clock
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v", claimed_amount_cents: 1000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { claim: $.data.id }
          trigger:
            - call: "GET /claims/${claim}/payments"
              payload: {}
              as: Policyholder
              as_user_id: "${ph}"
          assert:
            - "exactly 1 ClaimPayment; the payment object has id and created_at but NO version and NO updated_at fields"
            - "payment.amount_cents == 1000 and status == SETTLED"

      - name: invalid_enum_denial_reason_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Claim.fields.denial_reason
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "denial_reason 'SUS' is not in {FRAUD, COVERAGE, OTHER} → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Standard bound policy premium 100000 paid; one ESCALATED claim."]
          setup_api_calls:
            - *c_clock
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v", claimed_amount_cents: 5000, fraud_score: 0.90 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { claim: $.data.id, claim_v: $.data.version }
          trigger:
            - call: "POST /claims/${claim}/deny"
              payload: { denial_reason: "SUS", expected_claim_version: "${claim_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400); Claim.${claim}.status == ESCALATED (unchanged)"

      - name: system_generated_fields_ignore_client_input
        claim_type: System Fields
        grounds:
          - entities.RateFiling
        distinguishing_aspect: "Client-supplied id/version/status on create are ignored: the filing is created with a server id, version 1, status SUBMITTED."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.25, max_flat_fee_cap_cents: 25000, filing_mode: "ABSOLUTE_CENTS" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
          assert:
            - "RateFiling.${filing}.version == 1 and status == SUBMITTED regardless of any extra fields in the request body"

      - name: fk_integrity_quote_references_existing_policyholder
        claim_type: Parent Relationships
        grounds:
          - entities.Quote.fields.policyholder_id
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "POST /quotes authenticates as the policyholder: an X-User-ID that matches no policyholder yields 404 ERR_NOT_FOUND, and the policyholder_id on the quote always equals the caller."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One policyholder exists."]
          setup_api_calls:
            - *c_clock
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
          trigger:
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 100000, premium_cents: 50000 }
              as: Policyholder
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (HTTP 404) — the acting policyholder does not exist"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: claim_created_in_fnol_then_system_triage_same_request
        claim_type: Initial State
        grounds:
          - state_machines.Claim
        distinguishing_aspect: "POST /claims never leaves a claim observable in FNOL_SUBMITTED: triage is atomic within the request, so the response status is PAID or ESCALATED."
        test_recipe:
          setup: ["Standard bound policy premium 100000 paid."]
          setup_api_calls:
            - *c_clock
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 500000, premium_cents: 100000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 100000 }
              as: FinanceOps
          trigger:
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v", claimed_amount_cents: 1000, fraud_score: 0.10 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { claim: $.data.id }
          assert:
            - "the POST /claims response status field is PAID (triage completed in-request), never FNOL_SUBMITTED"

      - name: second_approve_on_paid_claim_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Claim.ESCALATED_to_PAID
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Re-issuing the approve trigger against the now-PAID claim fails with ERR_INVALID_STATE and creates no second payment."
        test_recipe:
          setup: ["Standard bound policy premium 500000 paid; ESCALATED claim approved to PAID with payout 40000."]
          setup_api_calls:
            - *c_clock
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "TX", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing: $.data.id }
            - call: "POST /rate-filings/${filing}/approve"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "TX", filing_id: "${filing}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc: $.data.id }
            - call: "POST /fee-configs/${fc}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "TX" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 900000, premium_cents: 500000 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { q: $.data.id }
            - call: "POST /applications"
              payload: { quote_id: "${q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { app: $.data.id }
            - call: "POST /applications/${app}/approve"
              payload: {}
              as: UnderwritingAdmin
              captures: { pol: $.data.id }
            - call: "POST /policies/${pol}/premium-payments"
              payload: { amount_cents: 500000 }
              as: FinanceOps
            - call: "POST /claims"
              payload: { policy_id: "${pol}", video_statement_ref: "v", claimed_amount_cents: 50000, fraud_score: 0.90 }
              as: Policyholder
              as_user_id: "${ph}"
              captures: { claim: $.data.id, claim_v: $.data.version }
            - call: "POST /claims/${claim}/approve"
              payload: { payout_cents: 40000, expected_claim_version: "${claim_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { claim_v2: $.data.version }
          trigger:
            - call: "POST /claims/${claim}/approve"
              payload: { payout_cents: 40000, expected_claim_version: "${claim_v2}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
