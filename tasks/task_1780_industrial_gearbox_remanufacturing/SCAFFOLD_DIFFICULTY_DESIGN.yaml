            - "WarrantyClaim.${claim_id}.status == UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade from different triggers:
  # (1) depth-3: record-run-in FAIL → order IN_BUILD → AssemblyRecord
  #     INVALIDATED → next submit-assembly rejected forcing new measurements
  #     (each hop caused by the previous link);
  # (2) depth-2: order cancel → RESERVED LoanerAssignment CANCELLED →
  #     loaner window freed so a new assignment no longer overlaps.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: run_in_fail_cascades_order_then_assembly_record_then_gate
        grounds:
          - state_machines.RemanOrder.RUN_IN_to_IN_BUILD
          - entities.AssemblyRecord.fields.status
          - "validations[priority=5]"
        distinguishing_aspect: |
          Depth-3 chain from record-run-in (FAIL): the RunInTest mutation
          flips RemanOrder RUN_IN→IN_BUILD; that order regression itself
          invalidates the ACTIVE AssemblyRecord; the invalidated record in
          turn makes the NEXT submit-assembly fail with
          ERR_NO_ASSEMBLY_RECORD — the third hop is caused by the second,
          not by the original trigger.
        test_recipe:
          setup:
            - "Order progressed to RUN_IN with ACTIVE AssemblyRecord R1 (within_tolerance=true)"
            - "Run-in test recorded with max_temp_c 99.0 > TEMP_MAX 95.0 → FAIL"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Cascade Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-C1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.10, radial_clearance_mm: 0.02, axial_clearance_mm: 0.02 }
              as: QualityInspector
              captures: { asm_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
          trigger:
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 99.0, vibration_mm_s: 2.0, oil_particle_count: 1500 }
              as: QualityInspector
              captures: { rit_id: $.data.id }
            - call: "GET /reman/orders/${order_id}"
              payload: {}
              as: RemanEngineer
            - call: "GET /reman/orders/${order_id}/assembly-records"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
              captures: { err3: $.data.error_id }
          assert:
            - "RunInTest.${rit_id}.result == FAIL"
            - "RunInTest.${rit_id}.status == SUPERSEDED"
            - "RunInTest.${rit_id}.oil_baseline_established == false"
            - "RemanOrder.${order_id}.status == IN_BUILD"
            - "AssemblyRecord.${asm_id}.status == INVALIDATED (second hop, caused by the order regression)"
            - "Third hop: after legitimately re-walking IN_BUILD→ASSEMBLY, submit-assembly returns error_id == ERR_NO_ASSEMBLY_RECORD because the only record was invalidated by hop two (gate derives from the invalidated record, not from the run-in directly)"

      - name: order_cancel_cascades_loaner_assignment_then_window_freed
        grounds:
          - state_machines.RemanOrder.SCOPE_APPROVAL_to_CANCELLED
          - state_machines.LoanerAssignment.RESERVED_to_CANCELLED
          - entities.LoanerAssignment.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (order cancel): cancel
          SCOPE_APPROVAL→CANCELLED first flips the RESERVED LoanerAssignment
          to CANCELLED; that cancellation itself releases the window so a
          fresh assignment over the same dates on the same loaner is accepted
          — the freed window is caused by the assignment flip, not by the
          cancel directly.
        test_recipe:
          setup:
            - "Order O in SCOPE_APPROVAL (awaiting customer approval)"
            - "Loaner L with RESERVED assignment A1 for O over [2026-08-10, 2026-08-20)"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Cancel Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-X1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/loaner-units"
              payload: { serial_number: "LN-001", model: "HZ-450" }
              as: ServiceManager
              captures: { loaner_id: $.data.id }
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order_id}", start_date: "2026-08-10", end_date: "2026-08-20" }
              as: IntakeCoordinator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /reman/orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /reman/loaner-assignments/${asg_id}"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order_id}", start_date: "2026-08-10", end_date: "2026-08-20" }
              as: IntakeCoordinator
              captures: { asg2_id: $.data.id }
          assert:
            - "RemanOrder.${order_id}.status == CANCELLED"
            - "LoanerAssignment.${asg_id}.status == CANCELLED (first hop)"
            - "Second reservation over identical window succeeds (second hop: window freed by the cancellation, not by the order cancel directly) and returns 201 with LoanerAssignment.${asg2_id}.status == RESERVED"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict on different error-category
  # pairs: (1) state vs business_fiscal on approve-scope; (2) state vs
  # business_referential on submit-scope.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_approve_scope
        grounds:
          - "validations[priority=4]"
          - "validations[priority=9]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approve-scope fired at an
          order still in TEARDOWN by a customer who is ALSO over credit limit
          must return ERR_INVALID_STATE (priority 4), not
          ERR_CREDIT_LIMIT_EXCEEDED (priority 9).
        test_recipe:
          setup:
            - "Customer CU with credit_limit_cents 1000; order O in TEARDOWN (scope never submitted), quoted estimate 600000"
            - "CU therefore violates two rules at once: wrong state for approve-scope AND would breach credit on any approval"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Broke Co", credit_limit_cents: 1000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-V1", model: "HZ-200", rated_torque_nm: 5000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 600000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
          trigger:
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 9 business_fiscal)"
            - "http status == 409"
            - "RemanOrder.${order_id}.status == TEARDOWN (unchanged)"

      - name: state_vs_referential_on_submit_scope
        grounds:
          - "validations[priority=4]"
          - "validations[priority=6]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_NO_FINDINGS]"
        distinguishing_aspect: |
          Category pair state vs business_referential (different pair from the
          state-vs-business_fiscal instance): submit-scope fired at an order
          still in INTAKE (wrong state) that ALSO has zero teardown findings
          (referentially incomplete) must return ERR_INVALID_STATE 409
          (priority 4), not ERR_NO_FINDINGS 422 (priority 6).
        test_recipe:
          setup:
            - "Order O freshly created in INTAKE; no findings recorded — both the state precondition and the referential precondition of submit-scope are violated"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Prio Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-V2", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 600000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 6 business_referential)"
            - "http status == 409"
            - "RemanOrder.${order_id}.status == INTAKE (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check on different metrics/endpoints:
  # (1) backlash == BACKLASH_MAX 0.18 exactly (inclusive) on assembly-records;
  # (2) loaner assignment adjacency end_date == start_date (half-open, zero
  #     overlap) on assignment create.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: backlash_exactly_at_max_is_within_tolerance
        grounds:
          - calculations.assembly_tolerance
          - entities.AssemblyRecord.fields.within_tolerance
        distinguishing_aspect: |
          Numeric threshold boundary: backlash_mm == 0.18 (BACKLASH_MAX) is
          WITHIN tolerance because the band is inclusive (<=); 0.19 must fail.
          Metric: length in mm; endpoint: POST assembly-records.
        test_recipe:
          setup:
            - "Order in ASSEMBLY stage"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Edge Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-E1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
          trigger:
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.18, radial_clearance_mm: 0.05, axial_clearance_mm: 0.05 }
              as: QualityInspector
              captures: { asm_id: $.data.id }
          assert:
            - "AssemblyRecord.${asm_id}.within_tolerance == true (0.18 <= BACKLASH_MAX inclusive; clearances 0.05 <= CLEARANCE_MAX inclusive)"
            - "AssemblyRecord.${asm_id}.status == ACTIVE"

      - name: loaner_adjacent_windows_zero_gap_accepted
        grounds:
          - endpoints: "POST /reman/loaner-units/{id}/assignments"
          - "errors[ERR_LOANER_OVERLAP]"
          - entities.LoanerAssignment.fields.end_date
        distinguishing_aspect: |
          Empty-set/zero-gap boundary on a different metric (time intervals)
          and different endpoint: assignment B starting exactly at assignment
          A's end_date (half-open [start,end)) shares zero days and MUST be
          accepted, while B starting one day earlier overlaps and MUST be
          rejected with ERR_LOANER_OVERLAP.
        test_recipe:
          setup:
            - "Loaner L with assignment A1 [2026-08-10, 2026-08-20) RESERVED for order O1"
            - "Order O2 for a second unit exists (needs a valid reman_order_id)"
          setup_api_calls:
