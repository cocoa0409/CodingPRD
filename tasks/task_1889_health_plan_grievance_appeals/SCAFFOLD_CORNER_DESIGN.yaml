        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "An action on a nonexistent case id yields ERR_NOT_FOUND (404), never ERR_INVALID_STATE — existence (3) precedes state (5)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /appeals/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/triage"
              payload: {}
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: authz_checked_before_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A ClaimsProcessor calling a ComplianceOfficer-only endpoint on a nonexistent id gets ERR_UNAUTHORIZED (403), not 404 — authorization precedes existence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /appeals/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/close"
              payload: {}
              as: ClaimsProcessor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED and http status 403"

  # ==========================================================================
  # Section: endpoints
  # ==========================================================================
  - section: endpoints
    instances:
      - name: case_list_pagination_envelope
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /appeals/cases honors limit/offset with total_count and has_more; defaults limit=10, offset=0."
        test_recipe:
          setup: ["Member with 3 cases"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EP1", full_name: "Page Test", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ep1: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep1}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep1}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep1}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
          trigger:
            - call: "GET /appeals/cases"
              payload: { member_id: "${m_ep1}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { page: $.data }
          assert:
            - "Response data is an array of length 2; meta envelope present; pagination reports total_count == 3 and has_more == true"
            - "GET with offset=2 returns 1 row and has_more == false"

      - name: case_events_reverse_reachability_and_order
        claim_type: computed_read
        grounds: ["endpoints[GET /appeals/cases/{id}/events]"]
        distinguishing_aspect: "Events are returned in occurred_at ASC, created_at ASC order — the triage NOTE precedes later appends."
        test_recipe:
          setup: ["GRIEVANCE case triaged (auto NOTE) plus two manual NOTEs"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EP2", full_name: "Ev Order", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ep2: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_ep2: $.data.id }
            - call: "POST /appeals/cases/${c_ep2}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ep2}/events"
              payload: { event_type: "NOTE", body: "second" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ep2}/events"
              payload: { event_type: "NOTE", body: "third" }
              as: CaseAnalyst
          trigger:
            - call: "GET /appeals/cases/${c_ep2}/events"
              payload: {}
              as: ComplianceOfficer
              captures: { e0: "$.data[0].body", e2: "$.data[2].body" }
          assert:
            - "events[0].body == 'TRIAGED' (auto-appended at triage)"
            - "events[2].body == 'third' (chronological append order preserved)"

      - name: conditional_action_ire_only_for_adverse_appeals
        claim_type: conditional_action
        grounds: ["endpoints[POST /appeals/cases/{id}/ire-referrals]"]
        distinguishing_aspect: "IRE referral is rejected for FULLY_FAVORABLE outcomes and for non-APPEAL kinds even when NOTIFIED."
        test_recipe:
          setup: ["GRIEVANCE case decided UNFAVORABLE and NOTIFIED (grievances never go to IRE)"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EP3", full_name: "Cond Act", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ep3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_ep3: $.data.id }
            - call: "POST /appeals/cases/${c_ep3}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ep3}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ep3}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ep3}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_ep3: $.data.id }
            - call: "POST /appeals/notifications/${n_ep3}/mark-sent"
              payload: {}
              as: MemberServicesRep
          trigger:
            - call: "POST /appeals/cases/${c_ep3}/ire-referrals"
              payload: { ire_organization_code: "IRE-X" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (the NOTIFIED -> IRE_REFERRED transition's case_kind == APPEAL precondition fails for a GRIEVANCE case)"

      - name: grievance_decide_nonclinical_path_allowed
        claim_type: action_endpoint
        grounds: [state_machines.GrievanceAppealCase.IN_REVIEW_to_DECIDED]
        distinguishing_aspect: "Grievances may be decided directly from IN_REVIEW by a CaseAnalyst without any clinical review."
        test_recipe:
          setup: ["GRIEVANCE case in IN_REVIEW"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EP4", full_name: "Grv Direct", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ep4: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep4}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_ep4: $.data.id }
            - call: "POST /appeals/cases/${c_ep4}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ep4}/begin-review"
              payload: {}
              as: CaseAnalyst
          trigger:
            - call: "POST /appeals/cases/${c_ep4}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
              captures: { st: $.data.status }
          assert:
            - "status == DECIDED (no PENDING_CLINICAL detour required for GRIEVANCE)"

      - name: clock_default_is_pinned_startup_value
        claim_type: computed_read
        grounds: ["endpoints[POST /appeals/_clock/set_current_utc]"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z — an intake without clock setup stamps received_at at the default."
        test_recipe:
          setup: ["Fresh server state; member exists (member creation does not read the clock for received_at)"]
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-EP5", full_name: "Clock Def", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ep5: $.data.id }
          trigger:
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ep5}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { rcv: $.data.received_at }
          assert:
            - "received_at == 2026-08-01T00:00:00Z (the pinned startup default, not wall-clock time)"

