        distinguishing_aspect: "The filing loops SUBMITTED -> UNDER_AUDIT -> REJECTED -> SUBMITTED: the amendment increments amendment_count to 1, clears audited_utilization_pct back to null and re-stamps submitted_at at the later clock, while the single RECLAMATION_REFERRAL strike already applied is not re-applied and leaves the carrier ELIGIBLE at one strike."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED. Its 2026-H1 filing for COLUMBUS reports blocks_held 1 with 950 assigned and no administrative or aging numbers, so claimed_utilization_pct is 95.00. An auditor (admin-1) opened an OVERSTATED_UTILIZATION finding with adjusted_numbers_assigned 600 (60.00), a 35.00 delta that yields RECLAMATION_REFERRAL, and approver-1 ACCEPTed it, pushing the filing to REJECTED. The clock then advanced to 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
