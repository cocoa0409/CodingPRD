            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-QC", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 0 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /barrel-aging/private-selection-programs"
              payload: { name: "Quota Check", spirit_type: "BOURBON", min_quality_score: 0, required_barrel_count: 2, reservation_window_days: 45 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /barrel-aging/private-selection-programs/${prog_id}/reservations"
              payload: { barrel_id: "${b_id}", expected_program_version: "${prog_v}" }
              as: ProgramDirector
              captures: { res_id: $.data.id }
            - call: "POST /barrel-aging/reservations/${res_id}/release"
              as: ProgramDirector
            - call: "GET /barrel-aging/private-selection-programs/${prog_id}"
              as: ProgramDirector
          assert:
            - "after create: available_slots == 1 (2 - 1 ACTIVE - 0 CONSUMED)"
            - "after release: available_slots == 2 exactly (compensation restores the pre-create value; invariant conserved)"
            - "BarrelReservation.${res_id}.state == RELEASED"
            - "program consumed count remains 0 (release is not a consume)"
