          assert:
            - "HTTP 422 with error_id ERR_OXYGEN_SUPPLY_EXCEEDED"
            - "NOT ERR_TRANSPORT_UNIT_UNAVAILABLE — TRK-02 has no trip of its own to collide with"
            - "StockingEvent.${event1_id}.oxygen_flow_lpm == 3.600 and status == IN_TRANSIT"
            - "StockingEvent.${event3b_id}.status == SCHEDULED and oxygen_flow_lpm == null"
            - "TransportUnit.${truck2_id}.status == AVAILABLE"
            - "loading E3b after E1 reaches RELEASED succeeds, because a terminal trip no longer draws oxygen"

      - name: water_rest_buffer_refuses_a_release_one_second_early
        grounds:
          - validations.water-rest-buffer
          - entities.Water.fields.last_release_at
          - errors.ERR_WATER_REST_BUFFER
          - endpoints.POST /stocking-events/{id}/release
        distinguishing_aspect: |
          Overlap measured against a rolling 48-hour buffer on a WATER rather than
