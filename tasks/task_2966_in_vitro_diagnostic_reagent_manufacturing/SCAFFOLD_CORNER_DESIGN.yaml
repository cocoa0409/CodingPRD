      - name: priority_108_allocate_rejects_a_passed_ship_by_and_treats_the_boundary_instant_as_valid
        claim_type: Violation → Error
        grounds:
          - validations.priority_108_ERR_SHIP_BY_PASSED
          - errors.ERR_SHIP_BY_PASSED
        distinguishing_aspect: "The check is 'not earlier than the clock', so an order whose ship_by equals the current instant is still allocatable. Because priority 108 sits above the priority 130 clearance gate, the boundary order proves it got PAST 108 by failing on ERR_PRODUCT_NOT_CLEARED instead — a single response distinguishing the two rules without needing a released lot."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Uncleared ProductSpecification IVD-CA-19 and two DistributionOrders: O1 with ship_by exactly 2026-09-01T00:00:00Z and O2 with ship_by 2026-08-31T23:59:59Z."
