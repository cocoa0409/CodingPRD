  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_shift_half_open_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.ProviderShift.fields.shift_start
          - entities.ProviderShift.fields.shift_end
        distinguishing_aspect: "Half-open interval semantics on ServiceProvider/ProviderShift: a new shift [15:00,20:00) overlapping an existing [08:00,16:00) is rejected with ERR_SHIFT_OVERLAP; the geometric treatment is positive-measure overlap (touching is NOT overlap)."
        test_recipe:
          setup:
            - "A provider with one SCHEDULED shift [2026-06-01T08:00Z, 2026-06-01T16:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: DispatchOperator
            - call: "POST /service-providers"
