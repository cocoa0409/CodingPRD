# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2285_major_appliance_assembly_plant
# Nine §0.5 rule_ids, 23 instances. Every arithmetic literal below was computed
# from the §1.3 formulas and their constants.
# YAML anchors (&k_*) define the shared base fixture chain on first use and are
# aliased (*k_*) by later instances in this same file.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: efficiency_provisional_as_tested_vs_certification_average
        grounds:
          - calculations.efficiency_index
          - entities.ProductionUnit.fields.provisional_efficiency_index
          - entities.ProductionUnit.fields.efficiency_index
          - entities.ProductionUnit.fields.certification_tier
          - state_machines.ProductionUnit.GATED_to_CERTIFIED
        distinguishing_aspect: |
          The AS_TESTED variant averages only the latest RECORDED test per type
          while CERTIFICATION_AVERAGE averages all of them, so on the same three
          tests the provisional index reads 0.94 (tier A band) and the binding
          index written at certification reads 0.97 (tier B) — a 0.03 delta that
          also moves the certification tier.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T06:00:00Z"
            - "Line L1 (option_load_limit_pct 63.00, baseline_headcount 20, FAM_A) with stations ST10 and ST20, presentation_slot_capacity 40 each"
            - "Supplier SUP1 APPROVED, part P-DOOR-A (line_side_max_units 24, not a sequenced module)"
            - "ModelVariant WM-X RELEASED: FAM_A, 4 option points, 150 labour minutes, requires_leak_test true, hipot limit 0.50 mA, leak limit 2.00 ml/min, 3 cycles, energy limit 400.00 kWh, water limit 200.00 L"
            - "ShiftPlan A 06:00-14:00, planned_headcount 20, available_labor_minutes 480"
            - "BuildSlot index 1 SEQUENCED then RELEASED, producing unit1 (IN_STATION x PENDING)"
            - "unit1 has passed ELECTRICAL_SAFETY (0.30), LEAK (1.10) and FUNCTIONAL_CYCLE (3) so quality_status is GATED"
            - "ENERGY tests 420.00 then 380.00 and one WATER test 184.00 are RECORDED"
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
            - &k_line
              call: "POST /lines"
              payload: { line_code: "L1", takt_seconds: 120, option_load_limit_pct: 63.00, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - &k_st10
              call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST10", position_index: 10, presentation_slot_capacity: 40, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { st10_id: $.data.id }
            - &k_st20
              call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST20", position_index: 20, presentation_slot_capacity: 40, station_cycle_seconds: 115 }
              as: PlantAdmin
              captures: { st20_id: $.data.id }
            - &k_sup1
              call: "POST /suppliers"
              payload: { supplier_code: "SUP1", name: "Hinge and Module Co", sync_window_minutes: 30 }
              as: PlantAdmin
              captures: { sup1_id: $.data.id }
            - &k_pdoor
              call: "POST /parts"
              payload: { part_number: "P-DOOR-A", supplier_id: "${sup1_id}", is_sequenced_module: false, line_side_max_units: 24 }
              as: PlantAdmin
              captures: { p_door_id: $.data.id }
            - &k_wmx
              call: "POST /model-variants"
              payload: { model_code: "WM-X", family_code: "FAM_A", option_codes: ["OPT-STEAM", "OPT-WIFI"], option_content_points: 4, labor_minutes: 150, functional_cycle_count_required: 3, requires_leak_test: true, hipot_leakage_ma_limit: 0.50, leak_limit_ml_per_min: 2.00, energy_kwh_limit: 400.00, water_liters_limit: 200.00 }
              as: PlantAdmin
              captures: { wmx_id: $.data.id, wmx_v: $.data.version }
            - &k_bomx
              call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 2, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v}" }
              as: PlantAdmin
              captures: { bom_x_door_id: $.data.id }
            - &k_relx
              call: "POST /model-variants/${wmx_id}/release"
              payload: {}
              as: PlantAdmin
            - &k_lineread
              call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v: $.data.version }
            - &k_shifta
              call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { shift_a_id: $.data.id }
            - &k_slot1
              call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slot1_id: $.data.id }
            - &k_seq1
              call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - &k_rel1
              call: "POST /build-slots/${slot1_id}/release"
              payload: {}
              as: LineOperator
              captures: { unit1_id: $.data.id }
            - &k_hipot1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
            - &k_cyc1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
            - &k_leak1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 1.10 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 420.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
          trigger:
            - call: "GET /production-units/${unit1_id}"
              payload: {}
              as: QualityInspector
              captures: { prov_before: $.data.provisional_efficiency_index }
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
          assert:
            - "The GET response before certification has ProductionUnit.${unit1_id}.provisional_efficiency_index == 0.94 (AS_TESTED: latest ENERGY 380.00/400.00 = 0.95, WATER 184.00/200.00 = 0.92, 0.6*0.95 + 0.4*0.92 = 0.938)"
            - "ProductionUnit.${unit1_id}.efficiency_index == 0.97 (CERTIFICATION_AVERAGE: energy mean of 1.05 and 0.95 = 1.0000, water 0.9200, 0.6*1.0000 + 0.4*0.9200 = 0.968)"
            - "ProductionUnit.${unit1_id}.certification_tier == B"
            - "ProductionUnit.${unit1_id}.quality_status == CERTIFIED and assembly_status == IN_STATION"
            - "efficiency_index - provisional_efficiency_index == 0.03, and the tier the provisional index would have implied (A, 0.94 <= 0.95) is NOT the tier written"

      - name: warranty_rate_production_cohort_vs_shipped_exposure
        grounds:
          - calculations.warranty_failure_rate
          - entities.Part.fields.cohort_failure_rate_per_1000
          - state_machines.WarrantyReturn.TEARDOWN_to_ANALYZED_DESIGN
          - endpoints["GET /parts/{id}/warranty-metrics"]
        distinguishing_aspect: |
          On one DESIGN_DEFECT return with field_hours 500 against a two-unit
          shipped cohort, PRODUCTION_COHORT divides by units (500.00 per 1000)
          while SHIPPED_EXPOSURE normalises by service hours (4000.00 per 1000);
          only the PRODUCTION_COHORT figure is the auto-change trigger input and
          only it is stored on Part.cohort_failure_rate_per_1000.
        test_recipe:
          setup:
            - "Base line/station/supplier/part/variant fixture as above, ShiftPlan A 06:00-14:00 headcount 20"
            - "Two BuildSlots (indexes 1 and 2) sequenced, released, fully tested, certified, assembled and SHIPPED — both carry P-DOOR-A on their as-built BOM"
            - "Logical clock advanced to 2026-08-03T12:00:00Z"
            - "One WarrantyReturn on unit1 with field_hours 500 has been torn down and analysed as DESIGN_DEFECT with root cause P-DOOR-A"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
            - call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
            - &k_slot2
              call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 2, planned_start: "2026-08-03T08:00:00Z" }
              as: ProductionPlanner
              captures: { slot2_id: $.data.id }
            - &k_seq2
              call: "POST /build-slots/${slot2_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - &k_rel2
              call: "POST /build-slots/${slot2_id}/release"
              payload: {}
              as: LineOperator
              captures: { unit2_id: $.data.id }
            - &k_gates2a
              call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.31 }
              as: QualityInspector
            - &k_gates2b
              call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
            - &k_gates2c
              call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 1.20 }
              as: QualityInspector
            - &k_gates2d
              call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - &k_gates2e
              call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - &k_cert2
              call: "POST /production-units/${unit2_id}/certify"
              payload: {}
              as: QualityInspector
            - &k_assy2
              call: "POST /production-units/${unit2_id}/complete-assembly"
              payload: {}
              as: LineOperator
            - &k_ship2
              call: "POST /production-units/${unit2_id}/ship"
              payload: {}
              as: LineOperator
            - &k_clock12
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:00:00Z" }
              as: PlantAdmin
            - &k_wr1
              call: "POST /warranty-returns"
              payload: { production_unit_id: "${unit1_id}", failure_code: "F-DOOR-SEAL", field_hours: 500, returned_at: "2026-08-03T11:00:00Z" }
              as: WarrantyAnalyst
              captures: { wr1_id: $.data.id }
            - &k_wr1_teardown
              call: "POST /warranty-returns/${wr1_id}/teardown"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty-returns/${wr1_id}/analyze"
              payload: { disposition: "DESIGN_DEFECT", root_cause_part_id: "${p_door_id}" }
              as: WarrantyAnalyst
          trigger:
            - call: "GET /parts/${p_door_id}/warranty-metrics"
              payload: {}
              as: WarrantyAnalyst
          assert:
            - "response.failure_count == 1 and response.cohort_units == 2 and response.total_field_hours == 500"
            - "response.cohort_failure_rate_per_1000 == 500.00 (1000 * 1 / 2)"
            - "response.shipped_exposure_rate_per_1000 == 4000.00 (1000 * 2000 * 1 / 500)"
            - "response.trigger_breached == true and response.trigger_threshold == 8.00"
            - "Part.${p_door_id}.cohort_failure_rate_per_1000 == 500.00 — the stored field mirrors PRODUCTION_COHORT only, never 4000.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: option_load_cap_single_floor_over_all_four_factors
        grounds:
          - calculations.option_load_window_cap
          - validations[priority=29]
          - entities.Line.fields.option_load_limit_pct
          - entities.ShiftPlan.fields.planned_headcount
        distinguishing_aspect: |
          MODE (a): with option_load_limit_pct 63.00, baseline_headcount 20 and
          planned_headcount 18 the cap is floor(5 * 0.63 * 10 * 0.9000) =
          floor(28.35) = 28, so a 28-point window is admitted and a 29-point
          window is rejected; flooring the percent factor first would give 27 and
          reject the admitted case.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T06:00:00Z, Line L1 (option_load_limit_pct 63.00, baseline_headcount 20, FAM_A), stations ST10/ST20 capacity 40"
            - "Variants WM-P (8 option points, 60 labour minutes), WM-R (4 points, 60 minutes) and WM-Q (5 points, 60 minutes), all FAM_A and RELEASED, each with a single BOM position on P-DOOR-A at ST10, qty 1"
            - "ShiftPlan A 06:00-14:00 with planned_headcount 18 (staffing factor 0.9000), available_labor_minutes 480"
            - "Three WM-P slots at indexes 1, 2 and 3 are SEQUENCED, so the window [1..5] already holds 24 option points and 180 labour minutes"
            - "A WM-R slot exists at index 4 and a WM-Q slot at index 5, both still PLANNED"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - call: "POST /model-variants"
              payload: { model_code: "WM-P", family_code: "FAM_A", option_codes: ["OPT-A", "OPT-B"], option_content_points: 8, labor_minutes: 60, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmp_id: $.data.id, wmp_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmp_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmp_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmp_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /model-variants"
              payload: { model_code: "WM-R", family_code: "FAM_A", option_codes: ["OPT-A"], option_content_points: 4, labor_minutes: 60, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmr_id: $.data.id, wmr_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmr_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmr_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmr_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /model-variants"
              payload: { model_code: "WM-Q", family_code: "FAM_A", option_codes: ["OPT-A", "OPT-C"], option_content_points: 5, labor_minutes: 60, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmq_id: $.data.id, wmq_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmq_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmq_v}" }
              as: PlantAdmin
            - call: "POST /model-variants/${wmq_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v_18: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 18, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v_18}" }
              as: ProductionPlanner
              captures: { shift_18_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmp_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { p1_id: $.data.id }
            - call: "POST /build-slots/${p1_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmp_id}", sequence_index: 2, planned_start: "2026-08-03T07:10:00Z" }
              as: ProductionPlanner
              captures: { p2_id: $.data.id }
            - call: "POST /build-slots/${p2_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmp_id}", sequence_index: 3, planned_start: "2026-08-03T07:20:00Z" }
              as: ProductionPlanner
              captures: { p3_id: $.data.id }
            - call: "POST /build-slots/${p3_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmr_id}", sequence_index: 4, planned_start: "2026-08-03T07:30:00Z" }
              as: ProductionPlanner
              captures: { r4_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmq_id}", sequence_index: 5, planned_start: "2026-08-03T07:40:00Z" }
              as: ProductionPlanner
              captures: { q5_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${r4_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${r4_id}/de-sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${q5_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "The first trigger call succeeds: BuildSlot.${r4_id}.status == SEQUENCED with option_points_snapshot == 4, because window [1..5] totals 24 + 4 = 28 and the cap is exactly 28"
            - "The third trigger call returns 422 ERR_OPTION_LOAD_WINDOW_EXCEEDED: window [1..5] would total 24 + 5 = 29 > 28"
            - "BuildSlot.${q5_id}.status == PLANNED and its option_points_snapshot is null — the rejected sequence mutated nothing"
            - "Station.${st10_id}.presentation_slots_used == 3 after the trigger (three WM-P slots at 1 unit each; WM-R released its 1 unit on de-sequence and WM-Q never charged)"
            - "The cap that a floor-the-percent-first implementation would compute (floor(5*0.63*10) = 31, 31*0.9 = 27.9 -> 27) is falsified by the first trigger call succeeding at 28 points"

      - name: efficiency_ratios_rounded_before_weighting
        grounds:
          - calculations.efficiency_index
          - entities.ProductionUnit.fields.certification_tier
          - state_machines.ProductionUnit.GATED_to_CERTIFIED
        distinguishing_aspect: |
          MODE (b): with ENERGY 413.96/400.00 and WATER 168.98/200.00 the pinned
          order (round each ratio to 2 dp, then weight) yields 0.95 and tier A,
          while weighting the unrounded ratios yields 0.9589 -> 0.96 and tier B;
          the stored certification_tier discriminates the two orders.
        test_recipe:
          setup:
            - "Base fixture: clock 2026-08-03T06:00:00Z, Line L1, stations ST10/ST20, SUP1, P-DOOR-A, WM-X RELEASED (energy limit 400.00, water limit 200.00), ShiftPlan A headcount 20"
            - "unit1 released from BuildSlot index 1 and GATED after ELECTRICAL_SAFETY, FUNCTIONAL_CYCLE and LEAK passes"
            - "One ENERGY test 413.96 and one WATER test 168.98 are RECORDED"
          setup_api_calls:
            - *k_clock
            - *k_line
            - *k_st10
            - *k_st20
            - *k_sup1
            - *k_pdoor
            - *k_wmx
            - *k_bomx
            - *k_relx
            - *k_lineread
            - *k_shifta
            - *k_slot1
            - *k_seq1
            - *k_rel1
            - *k_hipot1
            - *k_cyc1
            - *k_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 413.96 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 168.98 }
              as: QualityInspector
          trigger:
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
          assert:
            - "ProductionUnit.${unit1_id}.efficiency_index == 0.95 (1.0349 -> 1.03, 0.8449 -> 0.84, 0.6*1.03 + 0.4*0.84 = 0.954)"
            - "ProductionUnit.${unit1_id}.certification_tier == A"
            - "efficiency_index != 0.96 and certification_tier != B — the weight-then-round order (0.9589) is falsified"
            - "ProductionUnit.${unit1_id}.quality_status == CERTIFIED"

      - name: fatigue_tier_selected_on_gross_including_changeover
        grounds:
          - calculations.shift_committed_labor_minutes
          - entities.ShiftPlan.fields.committed_labor_minutes
          - entities.ShiftPlan.fields.changeover_minutes
          - validations[priority=31]
        distinguishing_aspect: |
          MODE (c): sequencing WM-X (150 min, FAM_A) at index 1 and WM-Y (145
          min, FAM_B) at index 2 gives unit 295 + changeover 18 = gross 313,
          which crosses FATIGUE_T1_MAX 300, so committed_labor_minutes is
          ceil(313 * 1.05) = 329 — not the 313 a unit-minutes tier lookup gives
          nor the 328 that tiering before adding the changeover gives.
        test_recipe:
          setup:
            - "Base fixture through ShiftPlan A (headcount 20, available_labor_minutes 480) with WM-X RELEASED and its BOM position on P-DOOR-A at ST10"
            - "ModelVariant WM-Y RELEASED: FAM_B, 2 option points, 145 labour minutes, requires_leak_test false, no water limit, energy limit 300.00, one BOM position on P-DOOR-A at ST20 qty 1"
            - "BuildSlot index 1 (WM-X) already SEQUENCED, so the plan holds 150 unit minutes and 0 changeover minutes"
            - "BuildSlot index 2 (WM-Y) exists and is PLANNED"
          setup_api_calls:
