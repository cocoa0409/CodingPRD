# Test Targeting Index (SKILL.md 1.8) for task_2182_workforce_reduction_warn_act.
# Every instance grounds only in elements declared in SCAFFOLD.yaml 1.1-1.7.
# Fixture conventions used throughout:
#   * logical clock starts at 2026-08-01T00:00:00.000Z (POST /_clock/set_current_utc default)
#   * X-User-ID literals: u-lead-1 / u-lead-2 (RestructuringLead), u-counsel-1 / u-counsel-2
#     (EmploymentCounsel), u-benefits-1 (BenefitsAdministrator), u-admin-1 (SystemAdmin);
#     SeparatingEmployee always acts as the captured Employee id.
#   * criterion score sheet {PERFORMANCE 72, CRITICAL_SKILLS 55, TENURE 88} against weights
#     {50, 30, 20} yields composite_score 70.10 on every selection created below.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: warn_loss_count_federal_versus_state_on_identical_roster
        grounds:
          - calculations.warn_employment_loss_count
          - entities.Site.fields.federal_loss_count
          - entities.Site.fields.state_loss_count
          - entities.WarnNotice.fields.threshold_met
          - entities.WarnRule.fields.counts_part_time
        distinguishing_aspect: |
          This dual-variant pair lives on the Site entity domain: one roster of five
          people yields FEDERAL employment_loss_count 2 over a half-open 90-day window
          with part-time and sub-180-day-service rows dropped, and STATE
          employment_loss_count 4 over a closed 30-day window that keeps them, so the
          same roster is at once below the federal threshold and above the state one.
        test_recipe:
          setup:
            - "One NY site with five employees: three full-time long-service, one part-time (16 h/wk), one full-time hired 2026-07-01."
            - "A FEDERAL WarnRule (min_loss_count 3, counts_part_time false, min_service_days 180, window_days 90) and a NY STATE WarnRule (min_loss_count 2, min_percent 25.0, counts_part_time true, min_service_days 0, window_days 30)."
            - "Four of the five are SELECTED with proposed_separation_date 2026-12-01; the fifth stays PROPOSED-free and ACTIVE."
          setup_api_calls:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "FEDERAL", state_code: "US", rule_code: "FED-WARN-1988", min_loss_count: 3, min_percent: 33.0, absolute_count: 20, notice_days: 60, window_days: 90, counts_part_time: false, min_service_days: 180, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE"] }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /warn-rules"
              payload: { jurisdiction: "STATE", state_code: "NY", rule_code: "NY-MINI-WARN", min_loss_count: 2, min_percent: 25.0, absolute_count: 10, notice_days: 90, window_days: 30, counts_part_time: true, min_service_days: 0, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE", "UNION_NOTICE", "JOB_TITLES_AFFECTED"] }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /sites"
              payload: { name: "NY HQ", state_code: "NY", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 }, { full_name: "Elena Torres", job_title: "Ops Specialist", birth_date: "1968-07-22", hire_date: "2019-02-01", annual_base_cents: 2600000, weekly_hours: 16, demographic_code: "CLASS_B", monthly_premium_cents: 45000 }, { full_name: "Farid Haddad", job_title: "Junior Analyst", birth_date: "1995-01-30", hire_date: "2026-07-01", annual_base_cents: 5200000, weekly_hours: 40, demographic_code: "CLASS_C", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: "$.data.employee_ids[0]", carla_id: "$.data.employee_ids[1]", elena_id: "$.data.employee_ids[2]", farid_id: "$.data.employee_ids[3]", ben_id: "$.data.employee_ids[4]" }
            - call: "POST /reduction-plans"
              payload: { name: "2026 Q4 NY Restructuring", decisional_unit_name: "NY HQ Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /reduction-plans/${plan_id}/selection-batch"
              payload: { employee_ids: ["${alice_id}", "${carla_id}", "${elena_id}", "${farid_id}"], proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { sel_alice: "$.data.selection_ids[0]", sel_carla: "$.data.selection_ids[1]", sel_elena: "$.data.selection_ids[2]", sel_farid: "$.data.selection_ids[3]" }
            - call: "POST /reduction-plans/${plan_id}/decide-batch"
              payload: { selection_ids: ["${sel_alice}", "${sel_carla}", "${sel_elena}", "${sel_farid}"], decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
          trigger:
            - call: "POST /warn-notices"
              payload: { plan_id: "${plan_id}", site_id: "${site_id}", jurisdiction: "FEDERAL", content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE"] }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { fed_notice_id: $.data.id }
            - call: "POST /warn-notices"
              payload: { plan_id: "${plan_id}", site_id: "${site_id}", jurisdiction: "STATE", content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE", "UNION_NOTICE", "JOB_TITLES_AFFECTED"] }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { st_notice_id: $.data.id }
          assert:
            - "WarnNotice.${fed_notice_id}.employment_loss_count == 2"
            - "WarnNotice.${fed_notice_id}.workforce_count == 4"
            - "WarnNotice.${fed_notice_id}.loss_percent == 50.00"
            - "WarnNotice.${fed_notice_id}.threshold_met == false"
            - "WarnNotice.${fed_notice_id}.trigger_type == NONE"
            - "WarnNotice.${fed_notice_id}.window_start_date == 2026-12-01"
            - "WarnNotice.${fed_notice_id}.window_end_date == 2027-03-01"
            - "WarnNotice.${fed_notice_id}.applied_rule_code == FED-WARN-1988"
            - "WarnNotice.${st_notice_id}.employment_loss_count == 4"
            - "WarnNotice.${st_notice_id}.workforce_count == 5"
            - "WarnNotice.${st_notice_id}.loss_percent == 80.00"
            - "WarnNotice.${st_notice_id}.threshold_met == true"
            - "WarnNotice.${st_notice_id}.trigger_type == MASS_LAYOFF"
            - "WarnNotice.${st_notice_id}.window_end_date == 2026-12-31"
            - "WarnNotice.${st_notice_id}.required_notice_days == 90"
            - "WarnNotice.${st_notice_id}.notice_deadline_utc == 2026-09-02T00:00:00.000Z"
            - "Site.${site_id}.federal_loss_count == 2"
            - "Site.${site_id}.state_loss_count == 4"
            - "Site.${site_id}.warn_trigger_status == MASS_LAYOFF"
            - "Site.${site_id}.required_notice_days == 90"

      - name: severance_standard_versus_enhanced_release_same_employee
        grounds:
          - calculations.severance_award_cents
          - entities.SeveranceOffer.fields.weeks_awarded
          - entities.SeveranceOffer.fields.base_severance_cents
          - entities.SeveranceOffer.fields.total_separation_cost_cents
        distinguishing_aspect: |
          This dual-variant pair lives on the SeveranceOffer / Employee compensation
          domain, not on the Site WARN-counting domain: for one 11-year employee at
          8700000 cents of annual base the STANDARD schedule floors 16.5 weeks to 16
          and pays 2676928 cents, while ENHANCED_RELEASE keeps the half week and adds
          two bonus weeks for 18.5 weeks and 3095198 cents.
        test_recipe:
          setup:
            - "One NY site with three full-time employees; only Alice (hired 2015-04-01, annual_base_cents 8700000, born 1978-05-10) is SELECTED for 2026-12-01."
            - "Neither jurisdiction is triggered by a single loss, so Site.required_notice_days is 0 and no notice-pay offset arises."
            - "The plan is APPROVED with a CLEARED analysis and an ATTACHED OWBPA disclosure, and Alice's individual notice has been delivered."
          setup_api_calls:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "FEDERAL", state_code: "US", rule_code: "FED-WARN-1988", min_loss_count: 3, min_percent: 33.0, absolute_count: 20, notice_days: 60, window_days: 90, counts_part_time: false, min_service_days: 180, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE"] }
