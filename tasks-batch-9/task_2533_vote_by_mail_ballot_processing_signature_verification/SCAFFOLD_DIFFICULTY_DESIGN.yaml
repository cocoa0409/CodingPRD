    instances:
      - name: batch_dispatch_packet_request_election_chain
        grounds:
          - state_machines.MailingBatch.SEALED_to_DISPATCHED
          - state_machines.BallotPacket.QUEUED_to_MAILED
          - state_machines.BallotRequest.APPROVED_to_MAILED
