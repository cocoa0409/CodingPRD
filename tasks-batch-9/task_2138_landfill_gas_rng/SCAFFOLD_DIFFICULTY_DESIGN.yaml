  - rule_id: non_linear_state_machine
    instances:
      - name: gas_well_isolation_and_recovery_cycle
        grounds:
          - state_machines.GasWell.ONLINE_to_ISOLATED
          - state_machines.GasWell.ISOLATED_to_ISOLATED
          - state_machines.GasWell.ISOLATED_to_THROTTLED
          - state_machines.GasWell.THROTTLED_to_ONLINE
          - entities.GasWell.fields.consecutive_good_readings
        distinguishing_aspect: |
          GasWell.operating_state is CYCLIC: ONLINE -> ISOLATED -> THROTTLED -> ONLINE returns to
          the state it started in, and the promotion legs are gated on a run of consecutive GOOD
          readings (2 to leave ISOLATED, 3 to leave THROTTLED) accumulated by the ISOLATED
          self-loop. No linear pipeline can express the return leg.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite and one GasWell W-01 with target_flow_scfm 500.0, ONLINE with one GOOD reading at flow 480.0 so current_flow_scfm is 480.0 and consecutive_good_readings is 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
          trigger:
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T02:00:00Z", methane_pct: 60.0, oxygen_pct: 5.00, nitrogen_pct: 2.0, temperature_f: 120.0, flow_scfm: 500.0, vacuum_inhg: 24.0 }
              as: WellfieldTechnician
              captures: { r_alarm_class: $.data.quality_class }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T03:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 460.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T04:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 460.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/status"
              payload: { to_state: "THROTTLED", reason: "Two consecutive good readings after isolation" }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-10T05:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 460.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/status"
              payload: { to_state: "ONLINE", reason: "Third consecutive good reading" }
              as: WellfieldTechnician
          assert:
            - "The reading taken at 2026-08-10T02:00:00Z has quality_class == ALARM and resulting_well_state == ISOLATED"
            - "Immediately after that reading GasWell.${w1_id}.operating_state == ISOLATED and current_flow_scfm == 0"
            - "The readings at 03:00 and 04:00 leave GasWell.${w1_id}.operating_state == ISOLATED and current_flow_scfm == 0 while consecutive_good_readings rises to 2"
            - "After the first POST /wells/${w1_id}/status GasWell.${w1_id}.operating_state == THROTTLED and current_flow_scfm == 300.0"
            - "After the 05:00 reading GasWell.${w1_id}.operating_state == THROTTLED, current_flow_scfm == 300.0, consecutive_good_readings == 3"
            - "After the second POST /wells/${w1_id}/status GasWell.${w1_id}.operating_state == ONLINE and current_flow_scfm == 460.0"
            - "LandfillSite.${site_id}.collected_flow_scfm == 460.0"

      - name: plant_process_mode_and_spec_status_advance_independently
        grounds:
          - state_machines.ProcessingPlant.ON_SPEC_to_OFF_SPEC
          - state_machines.ProcessingPlant.OFF_SPEC_to_QUARANTINE
          - state_machines.ProcessingPlant.QUARANTINE_to_ON_SPEC
          - state_machines.ProcessingPlant.UPGRADING_to_FLARING
          - entities.ProcessingPlant.fields.process_mode
          - entities.ProcessingPlant.fields.spec_status
        distinguishing_aspect: |
          ProcessingPlant carries TWO independent state dimensions on the same row, a different
          entity from the cyclic GasWell instance. spec_status walks ON_SPEC -> OFF_SPEC ->
          QUARANTINE -> ON_SPEC while process_mode independently walks UPGRADING -> FLARING and
          never returns; at the end the row reads (FLARING, ON_SPEC), a combination neither
          dimension alone could produce.
        test_recipe:
          setup:
            - "One LandfillSite, two GasWells with GOOD readings (collected_flow_scfm 950.0) and one ProcessingPlant moved to process_mode UPGRADING with spec_status ON_SPEC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
