      - name: slot_index_must_be_free_and_within_the_model_geometry
        claim_type: violation_to_error
        grounds:
          - validations[priority=44]
          - errors.ERR_CABINET_SLOT_OCCUPIED
          - entities.DisplayModel.fields.modules_per_cabinet
        distinguishing_aspect: |
          The slot bound is per DISPLAY MODEL (modules_per_cabinet 2 for FP16-STD),
          so slot 3 is refused with the same code as an already-filled slot 1.
          Neither refusal may consume the module or bump Cabinet.version, which
          matters because the caller is holding that version for its next OCC
          write — a version bumped on a rejected install would break the retry.
        test_recipe:
          setup:
            - "An FP16-STD project (modules_per_cabinet 2) is engineering APPROVED with cabinet ${cab}; modules ${m1} and ${m2} are CALIBRATED; ${m1} is installed in slot 1."
