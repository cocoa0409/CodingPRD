# =============================================================================
# §1.9 — Scaffold Corner Design
# task_3245_crowdfunded_board_game_production_backer_waves_retail
# Breadth probe. Corners §1.8 already covers are emitted as excluded_because
# stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: campaign_create_returns_draft_with_zeroed_computed_fields
        claim_type: Creation
        grounds:
          - entities.Campaign
          - endpoints.POST_/campaigns
        distinguishing_aspect: "POST /campaigns with required fields returns 201, status DRAFT, version 1, all computed aggregates 0 or null, system id/created_at/updated_at present."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns"
              payload: { title: "Alpha", owner_user_id: "co-1", goal_cents: 50000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "response 201; Campaign.status == DRAFT AND version == 1"
            - "gross_charged_cents == 0 AND net_payable_cents == 0 AND total_backers_charged == 0"
            - "retail_release_at is null"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: pledge_get_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Pledge
          - endpoints.GET_/pledges/{id}
        distinguishing_aspect: "GET /pledges/{id} round-trips every stored field including the three parallel state dimensions and computed pledge_total_cents."
        test_recipe:
          setup: ["Campaign LIVE with one pledge created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "EU", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /pledges/${p1}"
              payload: {}
              as: CampaignOwner
          assert:
            - "Pledge.backer_email == \"b1@x\" AND region_code == \"EU\""
            - "charge_status == PENDING AND address_status == UNCONFIRMED AND fulfillment_status == QUEUED"
            - "pledge_total_cents == 5000"

      - name: pledges_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/pledges
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three pledges; limit=2&offset=0 returns 2 rows + total_count=3 + has_more=true; offset=2 returns 1 row + has_more=false."
        test_recipe:
          setup: ["Campaign LIVE with three pledges."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b2", backer_email: "b2@x", region_code: "EU", pledge_level_name: "L", expected_campaign_version: "${v1}" }
              as: PlatformAdmin
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v2: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b3", backer_email: "b3@x", region_code: "APAC", pledge_level_name: "L", expected_campaign_version: "${v2}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pledges"
              payload: { campaign_id: "${cid}", limit: 2, offset: 0 }
              as: CampaignOwner
          assert:
            - "returns 2 rows, total_count == 3, has_more == true"
            - "GET /pledges?campaign_id=${cid}&limit=2&offset=2 returns 1 row, has_more == false"
            - "GET /pledges?campaign_id=${cid}&region_code=EU returns exactly 1 row"

      - name: campaign_get_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/campaigns/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Unallocated id → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Logical clock 2026-09-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /campaigns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CampaignOwner
              captures: { err: $.data.error_id }
          assert:
            - "status == 404 AND error_id == ERR_NOT_FOUND"

      - name: pledge_create_missing_campaign_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Pledge.fields.campaign_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "campaign_id is required input with no default; omitting → 400 ERR_INVALID_REQUEST (not 404)."
        test_recipe:
          setup: ["Logical clock 2026-09-01. A campaign exists so a real campaign version can be captured."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id, v: $.data.version }
          trigger:
            - call: "POST /pledges"
              payload: { backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 400 AND error_id == ERR_INVALID_REQUEST"

      - name: pledge_defaults_is_late_pledge_false_and_addons_empty
        claim_type: Defaults
        grounds:
          - entities.Pledge.fields.is_late_pledge
          - entities.Pledge.fields.add_on_lines
        distinguishing_aspect: "Omitting is_late_pledge and add_on_lines stores false and [] respectively."
        test_recipe:
          setup: ["Campaign LIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { late: $.data.is_late_pledge, lines: $.data.add_on_lines }
          assert:
            - "is_late_pledge == false (default)"
            - "add_on_lines == [] (default)"

      - name: pledge_invalid_region_code_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - entities.Pledge.fields.region_code
          - errors.ERR_INVALID_ENUM
        distinguishing_aspect: "region_code not in {NA,EU,APAC,ROW} → 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Campaign LIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "INVALID", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 400 AND error_id == ERR_INVALID_ENUM"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: campaign_launch_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.Campaign.transitions.DRAFT_to_LIVE
        distinguishing_aspect: "DRAFT → LIVE succeeds with an OPEN pledge level and future closes_at; version increments."
        test_recipe:
          setup: ["Campaign DRAFT with OPEN level."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
              captures: { st: $.data.status, v1: $.data.version }
          assert:
            - "status == LIVE"
            - "version == ${v0} + 1"

      - name: campaign_double_launch_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Campaign
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Second launch on LIVE campaign → 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Campaign already LIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
          trigger:
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 AND error_id == ERR_INVALID_STATE"

      - name: campaign_terminal_cancelled_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Campaign
        distinguishing_aspect: "From CANCELLED no further transitions possible."
        test_recipe:
          setup: ["Campaign CANCELLED from DRAFT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "cancel" }
              as: CampaignOwner
          trigger:
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 AND error_id == ERR_INVALID_STATE"

      - name: freight_rebook_cyclic_reentry
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FreightShipment.transitions.CUSTOMS_HOLD_to_BOOKED
        distinguishing_aspect: "CUSTOMS_HOLD → BOOKED via rebook with new window succeeds; window updated."
        test_recipe:
          setup: ["Shipment in CUSTOMS_HOLD."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-09-05T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturing-quotes"
              payload: { campaign_id: "${cid}", factory_name: "F", tier_breaks: [{min_units: 1, unit_price_cents: 5000}] }
              as: FactoryCoordinator
              captures: { q: $.data.id }
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "submit" }
              as: FactoryCoordinator
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "finalize" }
              as: FactoryCoordinator
            - call: "POST /production-runs"
              payload: { campaign_id: "${cid}", quote_id: "${q}" }
              as: FactoryCoordinator
              captures: { run: $.data.id }
            - call: "POST /production-runs/${run}/transition"
              payload: { action: "lock" }
              as: FactoryCoordinator
            - call: "POST /freight-shipments"
              payload: { production_run_id: "${run}", region_code: "NA", container_count: 1, declared_value_cents: 10000, departs_at: "2026-09-07T00:00:00Z", arrives_at: "2026-09-10T00:00:00Z" }
              as: FreightBroker
              captures: { sh: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "depart" }
              as: FreightBroker
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "arrive" }
              as: FreightBroker
          trigger:
            - call: "POST /freight-shipments/${sh}/transition"
              payload: { action: "rebook", departs_at: "2026-09-15T00:00:00Z", arrives_at: "2026-09-25T00:00:00Z" }
              as: FreightBroker
              captures: { st: $.data.status, dep: $.data.departs_at }
          assert:
            - "status == BOOKED (cyclic re-entry)"
            - "departs_at == \"2026-09-15T00:00:00Z\""

      - name: quote_revise_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.ManufacturingQuote.transitions.SUBMITTED_to_PROVISIONAL
        distinguishing_aspect: "SUBMITTED → PROVISIONAL via revise is allowed (cyclic re-quote loop) and recomputes provisional fields."
        test_recipe:
          setup: ["Campaign CLOSED_SUCCESS; quote SUBMITTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-09-05T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge" }
              as: CampaignOwner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /manufacturing-quotes"
              payload: { campaign_id: "${cid}", factory_name: "F", tier_breaks: [{min_units: 1, unit_price_cents: 5000}] }
              as: FactoryCoordinator
              captures: { q: $.data.id }
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "submit" }
              as: FactoryCoordinator
          trigger:
            - call: "POST /manufacturing-quotes/${q}/transition"
              payload: { action: "revise" }
              as: FactoryCoordinator
              captures: { st: $.data.status }
          assert:
            - "status == PROVISIONAL (cyclic re-entry)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: charge_failed_contributes_zero_to_gross
        claim_type: Input Set Filtering
        grounds:
          - calculations.campaign_net_payable
          - entities.Pledge.fields.charge_status
        distinguishing_aspect: "Only CHARGED pledges count toward gross; CHARGE_FAILED contributes 0."
        test_recipe:
          setup: ["Campaign LIVE; one pledge; charge with payment_outcome=FAILED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { title: "C", owner_user_id: "co-1", goal_cents: 1000, currency: "USD", closes_at: "2026-10-01T00:00:00Z", pledge_levels: [{name: "L", price_cents: 5000, contents: ["b"], quantity_cap: null, late_pledge_premium_pct: 0.0, status: "OPEN"}] }
              as: CampaignOwner
              captures: { cid: $.data.id }
            - call: "POST /campaigns/${cid}/transition"
              payload: { action: "launch" }
              as: CampaignOwner
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { v0: $.data.version }
            - call: "POST /pledges"
              payload: { campaign_id: "${cid}", backer_user_id: "b1", backer_email: "b1@x", region_code: "NA", pledge_level_name: "L", expected_campaign_version: "${v0}" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /pledges/${p1}/transition"
              payload: { action: "charge", payment_outcome: "FAILED" }
              as: CampaignOwner
          trigger:
            - call: "GET /campaigns/${cid}"
              payload: {}
              as: PlatformAdmin
              captures: { gross: $.data.gross_charged_cents, cnt: $.data.total_backers_charged }
            - call: "GET /pledges/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { cs: $.data.charge_status }
          assert:
            - "charge_status == CHARGE_FAILED"
            - "gross_charged_cents == 0 AND total_backers_charged == 0"

      - name: platform_fee_tier_boundary_average_rate
        claim_type: Correct Result
        grounds:
          - calculations.campaign_platform_fee
        distinguishing_aspect: "gross == 1000000 → tier2 rate 0.06 → fee 60000. gross == 999999 → tier1 rate 0.08 → fee round_half_up(79999.92) = 80000. Boundary uses < not <=."
        test_recipe:
          setup: ["Two campaigns: A with single pledge 1000000c CHARGED; B with single pledge 999999c CHARGED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
