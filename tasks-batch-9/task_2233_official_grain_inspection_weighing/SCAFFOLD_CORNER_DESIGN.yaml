              captures: { fsg: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fsg}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-115", contact_email: "billing@prairie.example" }
