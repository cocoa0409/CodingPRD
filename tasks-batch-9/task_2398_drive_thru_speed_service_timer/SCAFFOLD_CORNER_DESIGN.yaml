      - name: sm_parallel_dimensions_combined_state_correct
        claim_type: valid_transition
        grounds:
          - state_machines.TimerLoop.AT_WINDOW_to_CLOSED
          - state_machines.TimerLoop.REMAKE_OPEN_to_REMADE
        excluded_because:
          difficulty_instance: timer_loop_parallel_dimensions_advance_independently
          rationale: "The parallel state_machine_shape claim — independent dimensions producing a combined (CLOSED, REMADE) state — is the whole subject of that §1.8 instance."

      - name: sm_cyclic_shape_loop_back_with_revision_counter
        claim_type: valid_transition
        grounds:
          - state_machines.CoachingIntervention.CONTESTED_to_DRAFT
          - entities.CoachingIntervention.fields.revision_count
        excluded_because:
          difficulty_instance: coaching_intervention_revision_cycle_returns_to_draft
          rationale: "The cyclic-shape claim (entity loops back to DRAFT, revision_count is the termination counter) is asserted end-to-end by that §1.8 instance."

      - name: sm_cascade_down_depart_releases_slot_and_lifts_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.TimerLoop.AT_WINDOW_to_CLOSED
          - state_machines.MergeSlot.COMMITTED_to_RELEASED
        excluded_because:
          difficulty_instance: depart_cascade_slot_release_to_surge_posture
          rationale: "Every hop of the depart cascade side-effect chain is asserted individually in that §1.8 instance."

      - name: sm_compensation_abort_reverses_labor_commitment
        claim_type: side_effect_execution
        grounds:
          - state_machines.OrderTakerDeployment.ACTIVE_to_ABORTED
          - calculations.labor_minutes_ledger
        excluded_because:
          difficulty_instance: labor_minutes_conserved_on_activate_then_abort
          rationale: "The compensation side-effect pattern (undo transition reverses all original side effects with no drift) is asserted as a ledger invariant by that §1.8 instance."

