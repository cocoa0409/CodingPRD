          assert:
            - "HoldMail.${hold_id}.status == SCHEDULED — the unset clock reads 2026-09-01, so the 2026-09-02 start has not fired regardless of real wall-clock time"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cascade_changes_visible_in_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CarrierRoute.STANDARD_to_SUSPENDED
        distinguishing_aspect: "Immediate consistency: the suspend response's aftermath is fully visible to the very next GET — auxiliary rows already CURTAILED and relief minutes already zeroed, no reconciliation lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-12-01T00:00:00Z. Route C520 has zero active points and one ACTIVE auxiliary assignment (approved 2026-11-30, surge, scheduled 63 = round(50*1.25))."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/delivery-units"
              payload: { unit_code: "DU52", office_name: "Immediate Station", delivery_office_facility_id: "${fac_id}", case_slot_count_per_route: 500 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0005200", full_name: "Hal Ute", carrier_class: "REGULAR" }
              as: Postmaster
              captures: { car_main: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/carriers"
              payload: { employee_id: "E0005201", full_name: "Ivy Oro", carrier_class: "AUXILIARY" }
              as: Postmaster
              captures: { car_aux: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes"
              payload: { route_code: "C520", assigned_carrier_id: "${car_main}", route_type: "CITY" }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/auxiliary-assignments"
              payload: { helper_carrier_id: "${car_aux}", service_date: "2026-12-01", projected_overrun_minutes: 50, seasonal_surge_flag: true }
              as: RouteSupervisor
              captures: { aux_id: $.data.id }
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/auxiliary-assignments/${aux_id}/approve"
              payload: {}
              as: Postmaster
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/delivery-units/${unit_id}/routes/${route_id}/suspend"
              payload: {}
              as: Postmaster
            - call: "GET /api/delivery-units/${unit_id}/routes/${route_id}/auxiliary-assignments"
              payload: {}
              as: Postmaster
          assert:
            - "the suspend response already reflects status SUSPENDED"
            - "the immediately-following GET shows AuxiliaryAssignment.${aux_id}.status == CURTAILED (no delay, no batch)"
            - "CarrierRoute.${route_id}.auxiliary_relief_minutes == 0 in the same read"
