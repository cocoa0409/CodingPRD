              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { dec: $.data.id }
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/economic-approve"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/labor-approve"
              payload: {}
              as: VPOperations
              as_user_id: "vp-1"
          trigger:
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/execute"
              payload: {}
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LABOR_NOTICE_PERIOD (business_temporal, priority 12), NOT ERR_HEDGE_COVERAGE_INSUFFICIENT (business_fiscal, priority 25)"
