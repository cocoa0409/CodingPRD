  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: card_state_beats_daily_fiscal_on_authorize
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors[ERR_CARD_NOT_ACTIVE]
          - errors[ERR_DAILY_LIMIT_EXCEEDED]
        distinguishing_aspect: >
          One authorize violates both a state check (priority 5, ERR_CARD_NOT_ACTIVE: card
          SUSPENDED) and a business_fiscal check (priority 15, ERR_DAILY_LIMIT_EXCEEDED: 40000 >
          1000 daily limit); the state category wins -> ERR_CARD_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Fleet; card with tiny daily_dollar_limit_cents 1000; active card+assignment; then card SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Conflict1 Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
