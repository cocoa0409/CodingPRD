scaffold_difficulty_design:
  # =================================================================
  # RULE 1 — dual_variant_calc  (≥2 instances, different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_energy_cost_estimated_vs_final
        grounds:
          - calculations.session_energy_cost
          - entities.ChargeSession.fields.estimated_cost_cents
          - entities.ChargeSession.fields.final_cost_cents
          - state_machines.ChargeSession.ACTIVE_to_COMPLETED
        distinguishing_aspect: "session_energy_cost runs on ChargeSession (energy domain): estimated uses the single tariff rate at scheduled_start's hour (MID=20) over target-SOC energy = 800c; final uses time-weighted TOU allocation across the actual [15:00,17:00) interval (MID+PEAK) = 1200c; the two diverge."
        test_recipe:
          setup:
            - "Depot D1 (4-window TOU: OFF_PEAK 0-6=10, MID 6-16=20, PEAK 16-21=40, NIGHT 21-24=10), version 1."
            - "Charger C1 CCS max 150kW; Vehicle V1 CCS battery 100kWh SOC 50%."
            - "Session S scheduled [08:00,10:00) target 90%, power 100kW: estimated_cost_cents = 40kWh * 20 = 800."
            - "S started at actual 15:00 (start_soc 50); completing at 17:00 with end_soc 90 => 40kWh split MID[15,16)+PEAK[16,17)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D1", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: OFF_PEAK, start_hour_utc: 0, end_hour_utc: 6, rate_cents_per_kwh: 10}, {period: MID, start_hour_utc: 6, end_hour_utc: 16, rate_cents_per_kwh: 20}, {period: PEAK, start_hour_utc: 16, end_hour_utc: 21, rate_cents_per_kwh: 40}, {period: NIGHT, start_hour_utc: 21, end_hour_utc: 24, rate_cents_per_kwh: 10}] }
              as: FleetManager
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d1_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d1_id}", vin: "V1", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 50 }
              as: FleetManager
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d1_id}", charger_id: "${c1_id}", vehicle_id: "${v1_id}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T10:00:00Z", target_soc_pct: 90, power_kw: 100, expected_depot_version: "${d1_v}" }
              as: DepotOperator
              captures: { s_id: $.data.id, est: $.data.estimated_cost_cents }
            - call: "POST /fleet/charge-sessions/${s_id}/start"
              payload: { actual_start: "2026-05-10T15:00:00Z" }
              as: DepotOperator
          trigger:
            - call: "POST /fleet/charge-sessions/${s_id}/complete"
              payload: { end_soc_pct: 90, actual_end: "2026-05-10T17:00:00Z" }
              as: DepotOperator
              captures: { fin: $.data.final_cost_cents }
          assert:
            - "ChargeSession.${s_id}.estimated_cost_cents == 800"
            - "ChargeSession.${s_id}.final_cost_cents == 1200"
            - "ChargeSession.${s_id}.estimated_cost_cents != ChargeSession.${s_id}.final_cost_cents"

      - name: claim_reimbursement_estimated_vs_final
        grounds:
          - calculations.claim_reimbursement
          - entities.ReimbursementClaim.fields.estimated_amount_cents
          - entities.ReimbursementClaim.fields.final_amount_cents
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: "claim_reimbursement runs on the Driver/ReimbursementClaim domain (NOT energy): estimated prices driver-claimed 100kWh @15 = 1500c at submit; final prices finance-verified 80kWh @15 = 1200c at approve; the two diverge whenever verified != claimed."
        test_recipe:
          setup:
            - "Depot D1 budget 100000c, version 1; Driver DR1 home_tariff 15c/kWh."
            - "Claim submitted for 100 kWh => estimated_amount_cents 1500, committed 1500."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D1", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d1_id}", name: "DR1", email: "dr1@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr1_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr1_id}", depot_id: "${d1_id}", period_month: "2026-05", kwh_claimed: 100, odometer_start: 1000, odometer_end: 1500, expected_depot_version: "${d1_v}" }
              as: Driver
              as_user_id: "${dr1_id}"
              captures: { claim_id: $.data.id, est: $.data.estimated_amount_cents }
          trigger:
            - call: "POST /fleet/reimbursement-claims/${claim_id}/review"
              payload: { decision: "APPROVE", metered_kwh_verified: 80 }
              as: FinanceManager
              captures: { fin: $.data.final_amount_cents }
          assert:
            - "ReimbursementClaim.${claim_id}.estimated_amount_cents == 1500"
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 1200"
            - "ReimbursementClaim.${claim_id}.estimated_amount_cents != ReimbursementClaim.${claim_id}.final_amount_cents"

  # =================================================================
  # RULE 2 — combinatorial_formula  (≥2 instances, DIFFERENT modes)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_demand_charge_tiered_minmax
        grounds:
          - calculations.invoice_demand_charge
          - entities.Invoice.fields.demand_charge_cents
          - entities.Invoice.fields.peak_demand_kw
        distinguishing_aspect: "MODE (a): tiered demand charge with >=3 inputs and nested min/max — base_rate*min(peak,contracted) + overage_rate*max(0,peak-contracted) = 1000*min(250,200) + 2500*max(0,50) = 200000+125000 = 325000; peak_demand_kw = max concurrent = 250 at the second session's start."
        test_recipe:
          setup:
            - "Depot D contracted_capacity_kw 200, demand_rate 1000c/kW, overage_rate 2500c/kW, max_load 1000."
            - "Two COMPLETED June sessions on distinct chargers/vehicles: S1 150kW [10:00,12:00), S2 100kW [11:00,13:00). Concurrent load peaks at 250kW at 11:00."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 1000, contracted_capacity_kw: 200, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CA", connector_type: "CCS", max_power_kw: 200 }
              as: FleetManager
              captures: { ca_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "CCS", max_power_kw: 200 }
              as: FleetManager
              captures: { cb_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 0 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VB", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 0 }
              as: FleetManager
              captures: { vb_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${ca_id}", vehicle_id: "${va_id}", scheduled_start: "2026-06-05T10:00:00Z", scheduled_end: "2026-06-05T12:00:00Z", target_soc_pct: 50, power_kw: 150, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s1_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { d_v2: $.data.version }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${cb_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-06-05T11:00:00Z", scheduled_end: "2026-06-05T13:00:00Z", target_soc_pct: 50, power_kw: 100, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { s2_id: $.data.id }
            - call: "POST /fleet/charge-sessions/${s1_id}/start"
              payload: { actual_start: "2026-06-05T10:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s2_id}/start"
              payload: { actual_start: "2026-06-05T11:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s1_id}/complete"
              payload: { end_soc_pct: 50, actual_end: "2026-06-05T12:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s2_id}/complete"
              payload: { end_soc_pct: 50, actual_end: "2026-06-05T13:00:00Z" }
              as: DepotOperator
          trigger:
            - call: "POST /fleet/invoices"
              payload: { depot_id: "${d_id}", period_month: "2026-06" }
              as: FleetManager
              captures: { inv_id: $.data.id, peak: $.data.peak_demand_kw, dc: $.data.demand_charge_cents }
          assert:
            - "Invoice.${inv_id}.peak_demand_kw == 250"
            - "Invoice.${inv_id}.demand_charge_cents == 325000"

      - name: invoice_energy_subtotal_round_then_sum
        grounds:
          - calculations.invoice_energy_subtotal
          - entities.Invoice.fields.energy_subtotal_cents
          - entities.ChargeSession.fields.final_cost_cents
        distinguishing_aspect: "MODE (b): rounding order is round-per-session-then-sum — each session's raw 100.4c rounds to 100c, summed to 200c; sum-then-round would give 201c. The pinned order distinguishes the outputs."
        test_recipe:
          setup:
            - "Depot D flat tariff 20c/kWh, demand_rate 0, overage 0."
            - "Two COMPLETED July sessions each delivering 5.02 kWh (raw cost 100.4c -> final 100c)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 1000, contracted_capacity_kw: 1000, demand_rate_cents_per_kw: 0, overage_rate_cents_per_kw: 0, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CA", connector_type: "CCS", max_power_kw: 100 }
              as: FleetManager
              captures: { ca_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "CCS", max_power_kw: 100 }
              as: FleetManager
              captures: { cb_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 0 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VB", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 0 }
              as: FleetManager
              captures: { vb_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${ca_id}", vehicle_id: "${va_id}", scheduled_start: "2026-07-05T10:00:00Z", scheduled_end: "2026-07-05T11:00:00Z", target_soc_pct: 10, power_kw: 50, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s1_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { d_v2: $.data.version }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${cb_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-07-05T10:00:00Z", scheduled_end: "2026-07-05T11:00:00Z", target_soc_pct: 10, power_kw: 50, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { s2_id: $.data.id }
            - call: "POST /fleet/charge-sessions/${s1_id}/start"
              payload: { actual_start: "2026-07-05T10:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s1_id}/complete"
              payload: { end_soc_pct: 5.02, actual_end: "2026-07-05T11:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s2_id}/start"
              payload: { actual_start: "2026-07-05T10:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s2_id}/complete"
              payload: { end_soc_pct: 5.02, actual_end: "2026-07-05T11:00:00Z" }
              as: DepotOperator
          trigger:
            - call: "POST /fleet/invoices"
              payload: { depot_id: "${d_id}", period_month: "2026-07" }
              as: FleetManager
              captures: { inv_id: $.data.id, sub: $.data.energy_subtotal_cents }
          assert:
            - "ChargeSession.${s1_id}.final_cost_cents == 100"
            - "ChargeSession.${s2_id}.final_cost_cents == 100"
            - "Invoice.${inv_id}.energy_subtotal_cents == 200"

  # =================================================================
  # RULE 3 — non_linear_state_machine  (≥2, different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charge_session_active_branching_fork
        grounds:
          - state_machines.ChargeSession.ACTIVE_to_COMPLETED
          - state_machines.ChargeSession.ACTIVE_to_INTERRUPTED
          - entities.ChargeSession.fields.status
        distinguishing_aspect: "BRANCHING on ChargeSession: the ACTIVE state forks to COMPLETED (final_cost 600, SOC->80, reserved released) OR INTERRUPTED (final_cost 0, no SOC gain) — divergent side-effect sets on the same entity, not a linear pipeline."
        test_recipe:
          setup:
            - "Depot D1 flat 20c/kWh; Charger C1 CCS 150kW; Vehicle V1 CCS 100kWh SOC 50."
            - "Session scheduled power 100, started actual 10:00 (start_soc 50)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D1", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V1", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 50 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 80, power_kw: 100, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s_id: $.data.id }
            - call: "POST /fleet/charge-sessions/${s_id}/start"
              payload: { actual_start: "2026-05-10T10:00:00Z" }
              as: DepotOperator
          trigger:
            - call: "POST /fleet/charge-sessions/${s_id}/complete"
              payload: { end_soc_pct: 80, actual_end: "2026-05-10T11:00:00Z" }
              as: DepotOperator
          assert:
            - "ChargeSession.${s_id}.status == COMPLETED"
            - "ChargeSession.${s_id}.final_cost_cents == 600"
            - "Vehicle.${v_id}.current_soc_pct == 80"
            - "Depot.${d_id}.reserved_load_kw == 0"

      - name: work_order_hold_resume_cycle
        grounds:
          - state_machines.MaintenanceWorkOrder.IN_PROGRESS_to_ON_HOLD
          - state_machines.MaintenanceWorkOrder.ON_HOLD_to_IN_PROGRESS
          - entities.MaintenanceWorkOrder.fields.status
        distinguishing_aspect: "CYCLIC on MaintenanceWorkOrder (a different entity than the branching ChargeSession): the order traverses IN_PROGRESS -> ON_HOLD -> IN_PROGRESS (a genuine back-edge loop) before RESOLVED, which then restores Charger.service_status to OPERATIONAL."
        test_recipe:
          setup:
            - "Depot D; Charger C1. A charger work order is opened (Charger -> DOWN)."
            - "Order advanced OPEN->IN_PROGRESS->ON_HOLD->IN_PROGRESS (loop closed)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { asset_type: "CHARGER", charger_id: "${c_id}", issue: "coolant leak", severity: "HIGH" }
              as: MaintenanceTech
              captures: { wo_id: $.data.id }
            - call: "POST /fleet/work-orders/${wo_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: MaintenanceTech
            - call: "POST /fleet/work-orders/${wo_id}/transition"
              payload: { target_status: "ON_HOLD" }
              as: MaintenanceTech
            - call: "POST /fleet/work-orders/${wo_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: MaintenanceTech
          trigger:
            - call: "POST /fleet/work-orders/${wo_id}/transition"
              payload: { target_status: "RESOLVED" }
              as: MaintenanceTech
          assert:
            - "MaintenanceWorkOrder.${wo_id}.status == RESOLVED"
            - "Charger.${c_id}.service_status == OPERATIONAL"
            - "MaintenanceWorkOrder.${wo_id}.downtime_minutes == 0"

  # =================================================================
  # RULE 4 — transitive_cascade  (≥2, one depth>=3, different triggers)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: vehicle_workorder_grounds_and_reverts_route
        grounds:
          - entities.Vehicle.fields.status
          - entities.Vehicle.fields.readiness_status
          - state_machines.RouteAssignment.ASSIGNED_to_PLANNED
          - entities.MaintenanceWorkOrder.fields.asset_type
        distinguishing_aspect: "DEPTH-3 cascade from opening a VEHICLE work order: (1) Vehicle.status -> GROUNDED, (2) that grounding forces Vehicle.readiness_status -> NOT_READY, (3) the NOT_READY vehicle's ASSIGNED route reverts to PLANNED — each link caused by the previous."
        test_recipe:
          setup:
            - "Depot D; Vehicle V SOC 90 IN_SERVICE (READY); Driver DR; Route R required_soc 80, ASSIGNED to V."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 90 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/route-assignments"
              payload: { depot_id: "${d_id}", vehicle_id: "${v_id}", driver_id: "${dr_id}", route_name: "R", distance_km: 100, required_soc_pct: 80, scheduled_departure: "2026-05-12T06:00:00Z" }
              as: DepotOperator
              captures: { r_id: $.data.id }
            - call: "POST /fleet/route-assignments/${r_id}/assign"
              payload: {}
              as: DepotOperator
          trigger:
            - call: "POST /fleet/work-orders"
              payload: { asset_type: "VEHICLE", vehicle_id: "${v_id}", issue: "brake service", severity: "HIGH" }
              as: MaintenanceTech
              captures: { wo_id: $.data.id }
          assert:
            - "Vehicle.${v_id}.status == GROUNDED"
            - "Vehicle.${v_id}.readiness_status == NOT_READY"
            - "RouteAssignment.${r_id}.status == PLANNED"

      - name: charger_workorder_interrupts_session_releases_load
        grounds:
          - entities.Charger.fields.service_status
          - state_machines.ChargeSession.ACTIVE_to_INTERRUPTED
          - entities.Depot.fields.reserved_load_kw
        distinguishing_aspect: "DEPTH-3 cascade from a DIFFERENT trigger (opening a CHARGER work order): (1) Charger.service_status -> DOWN, (2) that downing INTERRUPTS the charger's ACTIVE session, (3) the interrupt credits Depot.reserved_load_kw back to 0 — a distinct propagation pattern from the vehicle cascade."
        test_recipe:
          setup:
            - "Depot D; Charger C1; Vehicle V SOC 30. Session power 100 SCHEDULED then STARTED (ACTIVE, reserved_load_kw 100)."
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
