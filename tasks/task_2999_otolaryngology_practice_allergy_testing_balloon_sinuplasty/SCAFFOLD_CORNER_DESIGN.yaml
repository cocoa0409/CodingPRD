              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "BLUE 1-100 MRN-10208", expires_at: "2027-06-30T00:00:00Z", volume_ml_initial: 5.00, expected_patient_version: "${pat_v1}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_1: $.data.id }
            - call: "POST /immunotherapy-vials/${vial_1}/label-verification"
              payload: { label_text_confirmation: "BLUE 1-100 MRN-10208" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_1}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose_1: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { pat_v2: $.data.version }
          trigger:
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "BLUE 1-100 MRN-10208 R2", expires_at: "2027-06-30T00:00:00Z", volume_ml_initial: 5.00, expected_patient_version: "${pat_v2}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_2: $.data.id }
          assert:
            - "HTTP 201 and ImmunotherapyVial.${vial_2}.status == \"MIXED\" with volume_ml_remaining == 5.00 and volume_ml_wasted == 0.00"
            - "ImmunotherapyVial.${vial_1}.status == \"DISCARDED\" and discard_reason == \"SUPERSEDED\""
            - "ImmunotherapyVial.${vial_1}.volume_ml_remaining == 0.00, volume_ml_dispensed_total == 0.05, volume_ml_wasted == 4.95"
            - "The old vial's ledger identity holds: 0.00 + 0.05 + 4.95 == 5.00"
            - "ImmunotherapyDose.${dose_1}.status == \"ADMINISTERED\" — superseding the vial does not touch the dose"
            - "Patient.${pat_id}.version == ${pat_v2} + 1, because the vial create bumps the patient's version"

      - name: scope_retirement_flags_scheduled_bookings
        claim_type: cascade_down
        grounds:
          - state_machines.EndoscopeAsset.REPROCESSING_to_QUARANTINED
          - state_machines.EndoscopeAsset.QUARANTINED_to_RETIRED
          - entities.EndoscopeAsset.fields.consecutive_mec_failures
          - entities.ProcedureBooking.fields.scope_reassignment_required
          - errors.ERR_SCOPE_REASSIGNMENT_REQUIRED
          - calculations.scope_reprocessing_due
        distinguishing_aspect: "One failed reprocessing leaves the scope QUARANTINED with consecutive_mec_failures 1 and no booking touched; the second failure retires it and stamps scope_reassignment_required true on the one SCHEDULED booking, whose start is then refused with ERR_SCOPE_REASSIGNMENT_REQUIRED rather than ERR_SCOPE_NOT_READY."
        test_recipe:
          setup:
            - "PayerPolicy, one adult Patient, EndoscopeAsset SC-0007."
            - "Booking B1 (DIAGNOSTIC_ENDOSCOPY, IN_OFFICE_SUITE, 2026-08-01T09:00..10:00, physician u_ent_1) started and completed, so the scope is SOILED."
            - "Booking B2 on the same scope for 2026-08-03T09:00..10:00 stays SCHEDULED throughout."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Retire Mutual", plan_code: "SMI-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10209", full_name: "Hugo Prieto", date_of_birth: "1972-03-03", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /endoscopes"
              payload: { serial_number: "SC-0007", model: "Rhino-Fiber 4" }
              as: PracticeAdmin
              captures: { scope_id: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T10:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /procedure-bookings/${book_1}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings/${book_1}/complete"
              payload: { devices_used_count: 0 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "DIAGNOSTIC_ENDOSCOPY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-03T09:00:00Z", end_at: "2026-08-03T10:00:00Z", physician_user_id: "u_ent_1", endoscope_asset_id: "${scope_id}" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_2: $.data.id }
            - call: "POST /endoscopes/${scope_id}/reprocessing-start"
              payload: {}
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
            - call: "POST /endoscopes/${scope_id}/reprocessing-completion"
              payload: { leak_test_passed: false }
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
          trigger:
            - call: "POST /endoscopes/${scope_id}/reprocessing-start"
              payload: {}
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
            - call: "POST /endoscopes/${scope_id}/reprocessing-completion"
              payload: { leak_test_passed: false }
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /procedure-bookings/${book_2}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
          assert:
            - "After the FIRST failed completion (setup): EndoscopeAsset.${scope_id}.status == \"QUARANTINED\", consecutive_mec_failures == 1, cycle_count == 0, and ProcedureBooking.${book_2}.scope_reassignment_required == false"
            - "After the SECOND failed completion: EndoscopeAsset.${scope_id}.status == \"RETIRED\" and consecutive_mec_failures == 2"
            - "ProcedureBooking.${book_2}.scope_reassignment_required == true and status is still \"SCHEDULED\""
            - "ProcedureBooking.${book_1}.scope_reassignment_required == false — only non-terminal bookings are flagged, and B1 is COMPLETED"
            - "The start of ${book_2} returns HTTP 409 with error.id == \"ERR_SCOPE_REASSIGNMENT_REQUIRED\" (priority 13), not ERR_SCOPE_NOT_READY, because priority 12 excludes RETIRED scopes"
            - "EndoscopeAsset.${scope_id}.last_reprocessed_at == null and hld_expires_at == null — no successful run ever closed"

      - name: sinuplasty_case_cycles_back_through_info_requested
        claim_type: cyclic
        grounds:
          - state_machines.SinuplastyCase.AUTH_SUBMITTED_to_INFO_REQUESTED
          - state_machines.SinuplastyCase.INFO_REQUESTED_to_AUTH_SUBMITTED
          - entities.SinuplastyCase.fields.revision_round
        excluded_because:
          difficulty_instance: non_linear_state_machine / sinuplasty_case_revision_cycle
          rationale: "The named §1.8 instance drives the full INFO_REQUESTED loop twice and asserts the revision_round 0->1->2 ladder plus its ERR_REVISION_LIMIT_REACHED termination."

      - name: device_dispense_fit_and_billing_dimensions_move_independently
        claim_type: parallel
        grounds:
          - entities.DeviceDispense.fields.fit_status
          - entities.DeviceDispense.fields.billing_status
          - state_machines.DeviceDispense.RETURNED_to_RETURNED
        excluded_because:
          difficulty_instance: non_linear_state_machine / device_dispense_parallel_dimensions
          rationale: "The named §1.8 instance walks fit_status and billing_status separately and asserts the combined state after the refund settlement leaves fit_status RETURNED while billing_status advances."

      - name: booking_start_requires_scope_in_ready_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProcedureBooking.SCHEDULED_to_IN_PROGRESS
          - errors.ERR_SCOPE_NOT_READY
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_start_gated_by_endoscope_readiness
          rationale: "The named §1.8 instance attempts the identical start against a scope in IN_USE, SOILED and REPROCESSING before the same call succeeds once the scope is READY."

      - name: dose_reaction_cascades_into_patient_vial_and_booking
        claim_type: cross_entity
        grounds:
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_REACTION_HELD
          - entities.ImmunotherapyVial.fields.requires_supervised_administration
          - entities.ProcedureBooking.fields.requires_physician_presence
        excluded_because:
          difficulty_instance: transitive_cascade / reaction_event_four_hop_cascade
          rationale: "The named §1.8 instance asserts all four hops of that cascade end-to-end, including the resized observation window on an unrelated ORDERED order."

      - name: dose_void_reverses_every_volume_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_VOIDED
          - calculations.immunotherapy_vial_volume_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / vial_millilitre_ledger_conserved_across_dose_void
          rationale: "The named §1.8 instance asserts the millilitre ledger before and after the void and shows no drift in volume_ml_dispensed_total or volume_ml_remaining."

      - name: lot_quantities_track_booking_completion_and_cancellation
        claim_type: ledger_sync
        grounds:
          - calculations.supply_lot_availability
          - entities.SupplyLot.fields.quantity_consumed
        excluded_because:
          difficulty_instance: compensating_invariant / supply_lot_unit_ledger_conserved_across_completion_and_cancel
          rationale: "The named §1.8 instance reconciles quantity_received against on_hand + consumed + wasted after each of the completion and cancellation hops."

      - name: write_off_flags_only_scheduled_bookings_with_devices
        claim_type: conditional_cascade
        grounds:
          - entities.ProcedureBooking.fields.supply_shortfall_flag
          - endpoints[POST /supply-lots/{lotId}/adjustments]
        excluded_because:
          difficulty_instance: transitive_cascade / supply_write_off_shortfall_cascade
          rationale: "The named §1.8 instance asserts the WRITE_OFF cascade sets supply_shortfall_flag only on SCHEDULED bookings whose planned_device_count is above zero."

      - name: cleared_doses_advance_the_parent_patient_schedule
        claim_type: bubble_up
        grounds:
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_CLEARED
          - entities.Patient.fields.immunotherapy_escalation_step
          - calculations.immunotherapy_next_dose_volume.constants.SCHEDULE_ML
        distinguishing_aspect: "The parent Patient's schedule position is written only by the child dose's clear-observation transition: administering a dose leaves immunotherapy_escalation_step untouched, and each clearance rolls it up to min(12, escalation_step_at_dose + 1) while also republishing last_dose_administered_at from the child row's administered_at."
        test_recipe:
          setup:
            - "PayerPolicy with defaults (observation_floor_minutes 20, so the IMMUNO_DOSE base of 30 governs)."
            - "One adult Patient with no prior systemic reactions and epinephrine on file, so risk_score is 5 and supervision_tier is STANDARD; the patient starts at immunotherapy_escalation_step 1 with last_dose_administered_at null."
            - "One BLUE_1_100 vial of 5.00 mL, label-verified by a second nurse, so the patient's immunotherapy_status is BUILD_UP."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Bubble Health", plan_code: "SMJ-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10254", full_name: "Ruta Vasiliauskas", date_of_birth: "1968-04-04", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1036", quantity_received: 6, expires_at: "2027-06-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10254|BLUE_1_100|2026-12-01", expires_at: "2026-12-01T00:00:00Z", expected_patient_version: "${pat_v}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_id: $.data.id }
            - call: "POST /immunotherapy-vials/${vial_id}/label-verification"
              payload: { label_text_confirmation: "MRN-10254|BLUE_1_100|2026-12-01" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
          trigger:
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose_1: $.data.id, step_1: $.data.escalation_step_at_dose }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { step_after_admin: $.data.immunotherapy_escalation_step }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose_1}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { step_after_clear: $.data.immunotherapy_escalation_step }
            - call: "POST /immunotherapy-doses"
              payload: { immunotherapy_vial_id: "${vial_id}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { dose_2: $.data.id, step_2: $.data.escalation_step_at_dose }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: PracticeAdmin
            - call: "POST /immunotherapy-doses/${dose_2}/clear-observation"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "GET /immunotherapy-vials/${vial_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          assert:
            - "The first dose returns HTTP 201 with ${step_1} == 1, volume_ml == 0.05, gap_days_at_dose == 0, observation_required_minutes == 30 (IMMUNO_DOSE base 30 beats the plan floor of 20) and administered_at == \"2026-08-01T00:00:00Z\""
            - "${step_after_admin} == 1 — administering the child dose does not move the parent's schedule position, which is what makes the rollup attributable to the clearance alone"
            - "The first clearance returns HTTP 200 with status \"CLEARED\" and observation_cleared_at == \"2026-08-01T00:30:00Z\", the clearance being admissible because 30 minutes elapsed is >= 30 required"
            - "${step_after_clear} == 2 with immunotherapy_status == \"BUILD_UP\" and last_dose_administered_at == \"2026-08-01T00:00:00Z\" — the parent field is republished from the child row"
            - "The second dose returns HTTP 201 with ${step_2} == 2 and volume_ml == 0.10 (SCHEDULE_ML[2]), gap_days_at_dose == 0 and administered_at == \"2026-08-01T00:30:00Z\""
            - "After the second clearance Patient.${pat_id}.immunotherapy_escalation_step == 3, immunotherapy_status == \"BUILD_UP\" and last_dose_administered_at == \"2026-08-01T00:30:00Z\""
            - "ImmunotherapyVial.${vial_id}.volume_ml_remaining == 4.85, volume_ml_dispensed_total == 0.15, status == \"IN_USE\"; the ledger identity 5.00 == 4.85 + 0.15 + 0.00 holds and the vial does not exhaust because 4.85 >= 0.05"
            - "GET /immunotherapy-doses?immunotherapy_vial_id=${vial_id}&status=CLEARED returns total_count == 2"

  # ===========================================================================
  # SECTION 3 — CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: serum_ige_conversion_bypasses_observation_floor
        claim_type: correct_result
        grounds:
          - calculations.observation_minutes_required
          - calculations.allergy_panel_billing
          - state_machines.AllergyTestOrder.ORDERED_to_SERUM_PENDING
          - state_machines.AllergyTestOrder.SERUM_PENDING_to_READ
        distinguishing_aspect: "The SERUM_IGE context returns exactly 0 observation minutes even though the plan's observation_floor_minutes is 120, and the quarter-batched billing then yields billed_units ceil(24/4) == 6 with practice_charge_cents 3062 * 6 == 18372 and patient_responsibility_cents 1531 * 6 == 9186 at covered_pct_bps 5000."
        test_recipe:
          setup:
            - "PayerPolicy with observation_floor_minutes 120, covered_pct_bps 5000 and allergy_serum_covered true."
            - "One adult Patient, epinephrine_on_file true, prior_systemic_reaction_count 0, so risk_score is 5."
            - "One FOOD_24 order created with method SKIN_PRICK and never administered."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Serum Health", plan_code: "CALA-2999", observation_floor_minutes: 120, covered_pct_bps: 5000, allergy_serum_covered: true }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10211", full_name: "Ada Kwan", date_of_birth: "1979-11-02", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "FOOD_24", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /allergy-test-orders/${ord_id}/convert-to-serum"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /allergy-test-orders/${ord_id}/readings"
              payload: { positive_antigen_count: 6 }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          assert:
            - "After the conversion: AllergyTestOrder.${ord_id}.status == \"SERUM_PENDING\", method == \"SERUM_IGE\", billed_units == 6"
            - "AllergyTestOrder.${ord_id}.observation_required_minutes == 0 — the SERUM_IGE branch returns 0 and the 120-minute plan floor is not applied"
            - "The readings call succeeds at the unchanged clock 2026-08-01T00:00:00Z with no waiting period at all: HTTP 200, status == \"READ\""
            - "AllergyTestOrder.${ord_id}.antigen_count == 24, billed_units == 6, practice_charge_cents == 18372, patient_responsibility_cents == 9186"
            - "Patient.${pat_id}.sensitized_antigen_count == 6 and risk_score == 11 (5 base + 6 sensitized)"
            - "Patient.${pat_id}.supervision_tier == \"STANDARD\" and risk_score_variant == \"PROVISIONAL\""

      - name: sensitized_antigen_count_only_counts_read_orders
        claim_type: input_set_filtering
        grounds:
          - calculations.patient_anaphylaxis_risk_score.input_set
          - entities.Patient.fields.sensitized_antigen_count
          - state_machines.AllergyTestOrder.ADMINISTERED_to_READ
        distinguishing_aspect: "With one READ order (4 positives), one ADMINISTERED order awaiting readings and one untouched ORDERED order, sensitized_antigen_count is 4 — not 7 and not 0 — and it becomes 7 only once the ADMINISTERED order is itself read; the ORDERED order never contributes."
        test_recipe:
          setup:
            - "PayerPolicy with default covered_pct_bps 8000 and observation_floor_minutes 20."
            - "One adult Patient, epinephrine_on_file true."
            - "Order A (MOLD_12 SKIN_PRICK) administered at 00:00 and read at 00:30 with 4 positives; order B (VENOM_5 SKIN_PRICK) administered at 00:30 and left ADMINISTERED; order C (ENV_36 SERUM_IGE) left in ORDERED."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Filter Health", plan_code: "CALB-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10212", full_name: "Bo Ferrer", date_of_birth: "1981-07-19", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_a: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "VENOM_5", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_b: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "ENV_36", method: "SERUM_IGE" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_c: $.data.id }
            - call: "POST /allergy-test-orders/${ord_a}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: PracticeAdmin
            - call: "POST /allergy-test-orders/${ord_a}/readings"
              payload: { positive_antigen_count: 4 }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /allergy-test-orders/${ord_b}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { sens_mid: $.data.sensitized_antigen_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: PracticeAdmin
            - call: "POST /allergy-test-orders/${ord_b}/readings"
              payload: { positive_antigen_count: 3 }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          assert:
            - "Before the trigger: ${sens_mid} == 4 — only order A is READ, so order B's positives are not yet in the input set and order C contributes nothing"
            - "Before the trigger: Patient.${pat_id}.risk_score == 9 (5 base + 4 sensitized)"
            - "AllergyTestOrder.${ord_a}.practice_charge_cents == 21300 and patient_responsibility_cents == 4260 (MOLD_12 tier 1.0000, per unit 1775, 12 units, covered 8000)"
            - "After the trigger: AllergyTestOrder.${ord_b}.status == \"READ\", billed_units == 5, practice_charge_cents == 8875, patient_responsibility_cents == 1775"
            - "Patient.${pat_id}.sensitized_antigen_count == 7 (4 + 3) and risk_score == 12"
            - "AllergyTestOrder.${ord_c}.status == \"ORDERED\" and positive_antigen_count == 0 throughout"

      - name: risk_decay_factor_at_sixty_one_days_with_fresh_event
        claim_type: decay_function
        grounds:
          - calculations.patient_anaphylaxis_risk_score.variants
          - calculations.patient_anaphylaxis_risk_score.constants.DECAY_FACTOR_MID
          - entities.Patient.fields.risk_score_variant
          - entities.Patient.fields.supervision_tier
        distinguishing_aspect: "At 61 days the older grade-2 event is worth round_half_up(20 * 2 * 0.60) == 24 rather than 40 (fresh) or 12 (stale), and each event is rounded on its own before summing, so the POST_REACTION score is 20 + 24 + 20 == 64 and the tier stays PHYSICIAN_PRESENT."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one adult Patient with prior_systemic_reaction_count 1 and epinephrine_on_file true, so base == 5 + 15 == 20 and sensitized_antigen_count stays 0."
            - "Order A administered at the default clock 2026-08-01T00:00:00Z, then a grade-2 ReactionEvent recorded against it at that same instant, which flips the variant to POST_REACTION."
            - "The clock is then advanced to 2026-10-01T00:00:00Z, exactly 61 days later, and order B is administered so a second event has a parent."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Decay Health", plan_code: "CALC-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10213", full_name: "Cyd Halim", date_of_birth: "1980-02-02", epinephrine_on_file: true, prior_systemic_reaction_count: 1 }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_a: $.data.id }
            - call: "POST /allergy-test-orders/${ord_a}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /reaction-events"
              payload: { allergy_test_order_id: "${ord_a}", systemic_grade: 2, local_wheal_mm: 22.0, onset_minutes: 12, epinephrine_given: true }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { evt_1: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { risk_mid: $.data.risk_score }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_id}", panel_code: "VENOM_5", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_b: $.data.id }
            - call: "POST /allergy-test-orders/${ord_b}/administer"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          trigger:
            - call: "POST /reaction-events"
              payload: { allergy_test_order_id: "${ord_b}", systemic_grade: 1, local_wheal_mm: 9.0, onset_minutes: 20, epinephrine_given: false }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { evt_2: $.data.id }
          assert:
            - "Before the trigger: ${risk_mid} == 60 — base 20 plus the fresh grade-2 term round_half_up(20 * 2 * 1.00) == 40"
            - "ReactionEvent.${evt_1}.occurred_at == \"2026-08-01T00:00:00Z\" and ReactionEvent.${evt_2}.occurred_at == \"2026-10-01T00:00:00Z\""
            - "After the trigger: Patient.${pat_id}.risk_score == 64 — base 20 + 24 for the 61-day-old grade-2 event (DECAY_FACTOR_MID 0.60) + 20 for the fresh grade-1 event"
            - "Patient.${pat_id}.risk_score_variant == \"POST_REACTION\" — the variant is permanent, so the grade-1 event is counted rather than ignored"
            - "Patient.${pat_id}.supervision_tier == \"PHYSICIAN_PRESENT\" (64 >= 60)"
            - "AllergyTestOrder.${ord_b}.status == \"ADMINISTERED\" and worst_systemic_grade == 1 — a grade-1 event does not abort the order"
            - "AllergyTestOrder.${ord_a}.status == \"ABORTED\" and worst_systemic_grade == 2"

      - name: candidacy_merges_adjacent_and_preserves_disjoint_courses
        claim_type: interval_merge
        grounds:
          - calculations.sinuplasty_candidacy_evaluation
          - endpoints[GET /sinuplasty-cases/{caseId}/candidacy-evaluation]
          - entities.SinuplastyCase.fields.contiguous_management_days
          - entities.SinuplastyCase.fields.cumulative_management_days
        distinguishing_aspect: "Two cases carry the same two 14-day courses and the same cumulative_management_days 28, but a zero-day gap merges into contiguous_management_days 28 (ELIGIBLE) while a six-day gap leaves the longest merged span at 14 (INELIGIBLE) — under POLICY_STRICT only the merged span is compared to min_medical_management_days."
        test_recipe:
          setup:
            - "PayerPolicy with requires_prior_auth true (POLICY_STRICT), min_medical_management_days 28, min_documented_criteria 3, requires_ct_within_months 12."
            - "One adult Patient with two LEFT / MAXILLARY cases, so planned_device_count is 1 on each."
            - "Case A gets INCS 2026-06-01..06-14 and ABX 2026-06-15..06-28 (adjacent); case B gets INCS 2026-06-01..06-14 and ABX 2026-06-21..07-04 (six-day gap). Both spans are 14 days, so both cumulatives are 28."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Merge Health", plan_code: "CALD-2999", requires_prior_auth: true, min_medical_management_days: 28, min_documented_criteria: 3, requires_ct_within_months: 12 }
