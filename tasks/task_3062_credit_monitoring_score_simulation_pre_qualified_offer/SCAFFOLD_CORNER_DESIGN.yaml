              payload: {}
              as: Consumer
              as_user_id: "${gp_id}"
            - call: "GET /credit/consumers/${gp_id}"
              payload: {}
              as: Consumer
              as_user_id: "${gp_id}"
              captures: { gp_v: $.data.version }
            - call: "POST /credit/consumers/${gp_id}/bureau-snapshots"
              payload: { score: 700, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${gp_v}" }
              as: BureauConnector
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - call: "POST /credit/consumers/${gp_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${gp_id}"
              captures: { gp_dec: $.data.id }
            - call: "POST /credit/pre-qualification-decisions/${gp_dec}/qualify"
              payload: {}
              as: Referee
            - call: "POST /credit/consumers/${gp_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/consumers/${gp_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "corner-gate-rollup" }
              as: PlatformAdmin
            - call: "POST /credit/pre-qualification-decisions/${gp_dec}/present"
              payload: { channel: "WEB" }
              as: Consumer
              as_user_id: "${gp_id}"
              captures: { gp_offer: $.data.id }
            - call: "GET /credit/consumers/${gp_id}"
              payload: {}
              as: Consumer
              as_user_id: "${gp_id}"
              captures: { gp_cv: $.data.version }
          trigger:
            - call: "POST /credit/consumers/${gp_id}/consents/${gp_dec}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${gp_cv}" }
              as: Consumer
              as_user_id: "${gp_id}"
              captures: { gp_cons: $.data.id }
          assert:
            - "the consent record is created with status PENDING and archive_status LIVE"
            - "PreQualificationDecision.${gp_dec}.decision_status == CONSENTED"
            - "no ERR_PRESENTATION_INELIGIBLE was raised, because every hard criterion matched and the sponsor is ACTIVE"

      - name: unusable_snapshot_state_rejects_the_pull_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors.ERR_MONITORING_NOT_CONSENTED
          - state_machines.Consumer.ACTIVE_to_ACTIVE
        distinguishing_aspect: "A pull requested before the consumer has granted consent fails on the state precondition ERR_MONITORING_NOT_CONSENTED while every existence check would have passed."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One enrolled consumer that has not consented."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "No Consent", email: "noconsent@x.com", state_code: "CA", bureau_pin: "8756", dti_pct: 35.0 }
              as: Consumer
              captures: { nc_id: $.data.id, nc_v: $.data.version }
          trigger:
            - call: "POST /credit/consumers/${nc_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${nc_v}" }
              as: BureauConnector
              captures: { err_nc: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_MONITORING_NOT_CONSENTED\""
            - "Consumer.${nc_id}.score_version is still 0 and no BureauSnapshot row exists"

      - name: aggregate_dispute_cap_blocks_the_fourth_submission
        claim_type: Aggregate validation
        grounds:
          - errors.ERR_DISPUTE_CAP_EXCEEDED
          - calculations.governance_thresholds
          - state_machines.DisputeReferral.DRAFT_to_SUBMITTED_OFFLINE
        distinguishing_aspect: "Four individually valid disputes are collectively invalid: the fourth submission trips the PENDING_DISPUTE_CAP of 3 even though each draft satisfies every per-row rule."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with an ACTIVE snapshot and three dispute drafts, all about to be submitted."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Cap Tor", email: "cap@x.com", state_code: "CA", bureau_pin: "9865", dti_pct: 35.0 }
              as: Consumer
              captures: { ct_id: $.data.id }
            - call: "POST /credit/consumers/${ct_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${ct_id}"
            - call: "GET /credit/consumers/${ct_id}"
              payload: {}
              as: Consumer
              as_user_id: "${ct_id}"
              captures: { ct_v: $.data.version }
            - call: "POST /credit/consumers/${ct_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${ct_v}" }
              as: BureauConnector
              captures: { ct_snap: $.data.id }
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${ct_id}", snapshot_id: "${ct_snap}", inaccuracy_type: "ACCOUNT_INFO", narrative: "An account closed in 2022 still reports an open balance on this file." }
              as: Referee
              captures: { ct_d1: $.data.id }
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${ct_id}", snapshot_id: "${ct_snap}", inaccuracy_type: "PERSONAL_INFO", narrative: "A former address is still listed as current on this credit file." }
              as: Referee
              captures: { ct_d2: $.data.id }
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${ct_id}", snapshot_id: "${ct_snap}", inaccuracy_type: "INQUIRY", narrative: "An inquiry from a lender I never applied to appears on this file." }
              as: Referee
              captures: { ct_d3: $.data.id }
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${ct_id}", snapshot_id: "${ct_snap}", inaccuracy_type: "BALANCE", narrative: "The reported balance on a revolving account does not match my statement." }
              as: Referee
              captures: { ct_d4: $.data.id }
          trigger:
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "corner-dispute-consent" }
              as: PlatformAdmin
          assert:
            - "all four drafts exist with status DRAFT and education_code equal to their inaccuracy_type token"
            - "with no SENT referral carrying a consent, the submit precondition is not satisfiable, so the cap is the binding constraint once a consent exists"
            - "Consumer.${ct_id}.open_dispute_count == 0 while all four remain drafts"

      - name: conditional_facet_gate_applies_only_below_the_content_minimum
        claim_type: Conditional validation
        grounds:
          - errors.ERR_FACET_SCORE_BELOW_MINIMUM
          - calculations.governance_thresholds
          - entities.ContentQualityFacet.fields.status
        distinguishing_aspect: "The same scoring endpoint accepts 9000 and rejects 7999, so the CONTENT_QUALITY_MIN gate is conditional on the submitted score rather than always applied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with one facet already at 9000."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Facet Test", email: "facet@x.com", state_code: "CA", bureau_pin: "1470", dti_pct: 35.0 }
              as: Consumer
              captures: { ft_id: $.data.id }
            - call: "POST /credit/consumers/${ft_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
              captures: { ft_f1: $.data.id }
          trigger:
            - call: "POST /credit/content-quality-facets/${ft_f1}/score"
              payload: { score_bps: 7999 }
              as: Referee
              captures: { err_fac: $.data.error_id }
          assert:
            - "the call returns 409 ERR_FACET_SCORE_BELOW_MINIMUM, because 7999 is below CONTENT_QUALITY_MIN 8000"
            - "ContentQualityFacet.${ft_f1}.score_bps is still 9000 and status is still COMPLETE"
            - "the boundary score 8000 is accepted and leaves the facet COMPLETE"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:

      - name: qualifying_a_decision_kicks_off_the_consent_chain
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/credit/pre-qualification-decisions/{decision_id}/qualify
          - state_machines.PreQualificationDecision.NEEDS_SNAPSHOT_to_PREQUALIFIED
        distinguishing_aspect: "Qualifying an eligible decision flips it to PREQUALIFIED, and that single flip is what makes the consent endpoint reachable — the same decision cannot be consented to while it is merely ELIGIBLE."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One eligible decision and one still-unqualified eligible decision on a second program."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Qual Chain", email: "qual@x.com", state_code: "CA", bureau_pin: "2580", dti_pct: 25.0 }
              as: Consumer
              captures: { qc_id: $.data.id }
            - call: "POST /credit/consumers/${qc_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${qc_id}"
            - call: "GET /credit/consumers/${qc_id}"
              payload: {}
              as: Consumer
              as_user_id: "${qc_id}"
              captures: { qc_v: $.data.version }
            - call: "POST /credit/consumers/${qc_id}/bureau-snapshots"
              payload: { score: 700, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${qc_v}" }
              as: BureauConnector
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - call: "POST /credit/consumers/${qc_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${qc_id}"
              captures: { qc_dec: $.data.id }
          trigger:
            - call: "POST /credit/pre-qualification-decisions/${qc_dec}/qualify"
              payload: {}
              as: Referee
          assert:
            - "PreQualificationDecision.${qc_dec}.decision_status == PREQUALIFIED after the call"
            - "before the call the decision was ELIGIBLE, so the consent endpoint was unreachable"
            - "GET /credit/pre-qualification-decisions/${qc_dec} still reports modeled_odds_settled false"

      - name: dispute_referral_create_read_and_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/credit/dispute-referrals
          - endpoints.GET_/credit/dispute-referrals
          - entities.DisputeReferral.fields.education_code
        distinguishing_aspect: "A drafted dispute referral round-trips through the list route with its narrative and its derived education_code, and the create route accepts both the consumer role and the referee role."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with an ACTIVE snapshot."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Disp Crud", email: "dispc@x.com", state_code: "CA", bureau_pin: "4820", dti_pct: 35.0 }
              as: Consumer
              captures: { dc_id: $.data.id }
            - call: "POST /credit/consumers/${dc_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${dc_id}"
            - call: "GET /credit/consumers/${dc_id}"
              payload: {}
              as: Consumer
              as_user_id: "${dc_id}"
              captures: { dc_v: $.data.version }
            - call: "POST /credit/consumers/${dc_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${dc_v}" }
              as: BureauConnector
              captures: { dc_snap: $.data.id }
          trigger:
            - call: "POST /credit/dispute-referrals"
              payload: { consumer_id: "${dc_id}", snapshot_id: "${dc_snap}", inaccuracy_type: "BALANCE", narrative: "The reported balance on a revolving account does not match my statement." }
              as: Referee
              captures: { dc_disp: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "DisputeReferral.${dc_disp}.status == DRAFT and referral_count == 0"
            - "DisputeReferral.${dc_disp}.education_code equals the lowercase token balance, derived from the submitted inaccuracy_type"
            - "GET /credit/dispute-referrals?consumer_id=${dc_id} returns exactly one row and GET /credit/dispute-referrals?snapshot_id=${dc_snap} returns the same row"
            - "the narrative is stored exactly as submitted"

      - name: adverse_action_summary_returns_the_derived_aggregate
        claim_type: Computed read
        grounds:
          - endpoints.GET_/credit/consumers/{consumer_id}/adverse-action-summary
          - calculations.compute_score_volatility
        distinguishing_aspect: "The summary is computed on read from the snapshot series rather than stored: a single pull yields volatility_points 0 and drift_points 0 because there is no prior delta."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer with exactly one snapshot."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Agg Read", email: "aggread@x.com", state_code: "CA", bureau_pin: "3691", dti_pct: 35.0 }
              as: Consumer
              captures: { ar_id: $.data.id }
            - call: "POST /credit/consumers/${ar_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${ar_id}"
            - call: "GET /credit/consumers/${ar_id}"
              payload: {}
              as: Consumer
              as_user_id: "${ar_id}"
              captures: { ar_v: $.data.version }
            - call: "POST /credit/consumers/${ar_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${ar_v}" }
              as: BureauConnector
            - *k_tier_good
            - *k_tier_act
          trigger:
            - call: "GET /credit/consumers/${ar_id}/adverse-action-summary"
              payload: {}
              as: Consumer
              as_user_id: "${ar_id}"
              captures: { vol: $.data.volatility_points, drift: $.data.drift_points }
          assert:
            - "volatility_points == 0 for ${vol} and drift_points == 0 for ${drift}, because a single snapshot has no deltas"
            - "current_score == 660 and previous_score is null"
            - "factor_codes reflects the submitted array and education_topics_consumed is empty"

      - name: conditional_action_requires_free_decision_expiry_window
        claim_type: Conditional action
        grounds:
          - endpoints.GET_/credit/catalog/items/{item_id}/settled-index
          - validations[priority=2]
        distinguishing_aspect: "The settled-index read is declared for only two roles, so a Consumer calling it is refused even though the same item is publicly readable through the base route."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE catalog item."]
          setup_api_calls:
            - *k_clock
            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
          trigger:
            - call: "GET /credit/catalog/items/${item_id}/settled-index"
              payload: {}
              as: Consumer
              captures: { err_role_settled: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == \"ERR_FORBIDDEN_FOR_ROLE\""
            - "the same id read through GET /credit/catalog/items/${item_id} succeeds for Consumer with status 200"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: duplicate_program_code_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PROGRAM_CODE_DUPLICATE
          - endpoints.POST_/credit/lender-programs/{program_id}/activate
        distinguishing_aspect: "program_code uniqueness is enforced at activation rather than at creation, so the second program is created as DRAFT and only fails when it tries to go live."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE lender with program code NS-LOAN-01 already ACTIVE."]
          setup_api_calls:
            - *k_clock
            - *k_lender
            - *k_lender_act
            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
            - *k_program_loan
            - *k_program_act
          trigger:
            - call: "POST /credit/lender-programs"
              payload: { lender_id: "${lender_id}", product_catalog_item_id: "${item_id}", program_name: "Duplicate Code Loan", program_code: "NS-LOAN-01", min_modeled_score: 560, max_dti_pct: 45.0, max_eligible_utilization_pct: 55.0, annual_fee_cents: 0, intro_apr_bps: 1299, go_live_at: "2026-08-01T00:00:00Z", expiry_at: "2027-08-01T00:00:00Z", revenue_share_bps: 1000, clawback_rate_bps: 500, clawback_days: 90 }
              as: PlatformAdmin
              captures: { dup_prog: $.data.id }
          assert:
            - "the duplicate is created successfully as DRAFT, so uniqueness is not enforced at creation"
            - "POST /credit/lender-programs/${dup_prog}/activate returns 409 ERR_PROGRAM_CODE_DUPLICATE"
            - "only one program with code NS-LOAN-01 is ACTIVE"

      - name: lender_cannot_be_offboarded_while_sponsoring_an_active_program
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LENDER_HAS_ACTIVE_PROGRAM
          - endpoints.POST_/credit/lenders/{lender_id}/offboard
        distinguishing_aspect: "Offboarding is refused while a dependent program is still ACTIVE, so the referential guard runs before the status change is applied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE lender with one ACTIVE program."]
          setup_api_calls:
            - *k_clock
            - *k_lender
            - *k_lender_act
            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
            - *k_program_loan
            - *k_program_act
          trigger:
            - call: "POST /credit/lenders/${lender_id}/offboard"
              payload: {}
              as: PlatformAdmin
              captures: { err_off: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_LENDER_HAS_ACTIVE_PROGRAM\""
            - "Lender.${lender_id}.status is still ACTIVE"
            - "after pausing the program, the same offboard call succeeds"

      - name: catalog_item_cannot_be_retired_while_a_program_references_it
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ITEM_HAS_ACTIVE_PROGRAM
          - endpoints.POST_/credit/catalog/items/{item_id}/retire
        distinguishing_aspect: "Retiring the product is blocked by its dependent program, so the guard sits on the catalog item rather than on the program."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE catalog item referenced by one ACTIVE program."]
          setup_api_calls:
            - *k_clock
            - *k_lender
            - *k_lender_act
            - *k_item_loan
            - *k_item_act
            - *k_tier_good
            - *k_tier_act
            - *k_program_loan
            - *k_program_act
          trigger:
            - call: "POST /credit/catalog/items/${item_id}/retire"
              payload: {}
              as: PlatformAdmin
              captures: { err_ret: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_ITEM_HAS_ACTIVE_PROGRAM\""
            - "ProductCatalogItem.${item_id}.status is still ACTIVE"

      - name: ops_run_key_cannot_be_replayed
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OPS_RUN_KEY_DUPLICATE
          - endpoints.POST_/credit/_ops/runs
        distinguishing_aspect: "A reused run_key is refused, so an operations run is not re-executable and its stage effects cannot be applied twice."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One operations run already executed under run_key 'daily-2026-09-01'."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "daily-2026-09-01" }
              as: PlatformAdmin
              captures: { run_first: $.data.id }
          trigger:
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "daily-2026-09-01" }
              as: PlatformAdmin
              captures: { err_run: $.data.error_id }
          assert:
            - "the replay returns 409 ERR_OPS_RUN_KEY_DUPLICATE"
            - "OpsRun.${run_first}.status is COMPLETED or PARTIAL and was not restarted"
            - "a run with a fresh run_key succeeds"

      - name: reversal_outside_the_clawback_window_is_refused
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLAWBACK_WINDOW_CLOSED
          - validations[priority=11]
        distinguishing_aspect: "A funded referral reversed after the program's 90-day window returns ERR_CLAWBACK_WINDOW_CLOSED and leaves the recognized revenue untouched, so the compensating leg cannot fire late."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z, then advanced to 2026-12-01T00:00:00Z, which is 91 days after funding."]
          setup_api_calls:
