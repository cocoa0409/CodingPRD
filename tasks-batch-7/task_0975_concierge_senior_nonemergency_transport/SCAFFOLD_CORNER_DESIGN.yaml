          assert:
            - "expired_assignment_ids contains ${asg}; Assignment.status == EXPIRED"
            - "Re-dispatch: data null (the only driver is now excluded for this ride); ride stays DISPATCHING with dispatch_round == 2"

      - name: invoice_marked_past_due_by_run_cycle
        claim_type: ops_run_checkpoint
        grounds: [entities.Invoice.fields.past_due, calculations.overdue_ar_and_billing_hold]
        distinguishing_aspect: "past_due is set only by the ops epoch: on the due_date itself the cycle leaves it false; the next day's cycle flips it to true."
        test_recipe:
          setup: ["client; issued invoice 1251 with due_date 2026-05-22"]
          setup_api_calls:
