              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
              as_user_id: "${cl_ssp_id}"
            - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T08:00:00Z" }
              as: VenueAdmin
            - call: "POST /convention-center/bookings/${bk_id}/open-show"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "${uj_util_id}", work_category: "UTILITIES", work_date: "2027-03-01", scheduled_start_hour: 8.0, scheduled_end_hour: 12.0, crew_size: 2 }
              as: EventServicesManager
              captures: { lc_first_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "${uj_util_id}", work_category: "UTILITIES", work_date: "2027-03-01", scheduled_start_hour: 8.0, scheduled_end_hour: 12.0, crew_size: 1 }
              as: EventServicesManager
              captures: { lc_second_id: $.data.id }
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "${uj_util_id}", work_category: "UTILITIES", work_date: "2027-03-01", scheduled_start_hour: 9.0, scheduled_end_hour: 13.0, crew_size: 1 }
