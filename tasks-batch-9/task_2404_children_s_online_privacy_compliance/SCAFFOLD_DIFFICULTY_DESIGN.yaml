  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: direct_notice_delivery_gated_by_notice_publication_and_channel
        grounds:
          - state_machines.ConsentRequest.INITIATED_to_NOTICE_DELIVERED
          - state_machines.ParentalNotice.DRAFT_to_PUBLISHED
          - errors[ERR_NOTICE_NOT_PUBLISHED]
          - errors[ERR_NOTICE_CHANNEL_INCOMPATIBLE]
          - entities.ConsentRequest.fields.verification_deadline_at
        distinguishing_aspect: |
          A ConsentRequest may be CREATED against a DRAFT notice, but it cannot leave INITIATED until
          the notice it points at has reached PUBLISHED — the gate lives on the other entity, and the
          identical request that fails with ERR_NOTICE_NOT_PUBLISHED succeeds unchanged once the
          notice is published. A second cross-entity clause reads the notice's delivery_channel rather
          than its status: a SCHOOL_AUTHORIZATION consent is refused against a PUBLISHED EMAIL notice.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (SUBJECT_MATTER MODERATE, design_score 0.60)."
            - "Notice N1 created with delivery_channel EMAIL and all 7 content keys but LEFT IN DRAFT."
            - "Consent C1 created for guardian.h@x.test / child-402 referencing DRAFT notice N1 (creation does not require publication)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Notice Gate Games", operator_organization: "Gate Interactive", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id, notice_status_created: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.h@x.test", child_pseudonym: "child-402", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_c1: $.data.id, c1_status_created: $.data.status }
          trigger:
            - call: "POST /consent-requests/${consent_c1}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
              captures: { err_not_published: $.data.error_id }
            - call: "GET /consent-requests/${consent_c1}"
              payload: {}
              as: ComplianceOfficer
              captures: { c1_status_after_refusal: $.data.status, c1_delivered_after_refusal: $.data.notice_delivered_at }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
              captures: { notice_status_published: $.data.status, published_at: $.data.published_at }
            - call: "POST /consent-requests/${consent_c1}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
              captures: { c1_status_ok: $.data.status, c1_delivered_at: $.data.notice_delivered_at, c1_deadline: $.data.verification_deadline_at }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv3: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.i@x.test", child_pseudonym: "child-403", intended_uses: ["PARTICIPATION_CORE"], consent_method: "SCHOOL_AUTHORIZATION", expected_service_version: "${sv3}" }
              as: ComplianceOfficer
              captures: { consent_c2: $.data.id }
            - call: "POST /consent-requests/${consent_c2}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
              captures: { err_channel: $.data.error_id }
            - call: "GET /consent-requests/${consent_c2}"
              payload: {}
              as: ComplianceOfficer
              captures: { c2_status_after_refusal: $.data.status }
          assert:
            - "${notice_status_created} == DRAFT and ${c1_status_created} == INITIATED (a consent may reference a DRAFT notice)"
            - "${err_not_published} == ERR_NOTICE_NOT_PUBLISHED with HTTP 409"
            - "${c1_status_after_refusal} == INITIATED and ${c1_delivered_after_refusal} == null (the refused transition left no trace)"
            - "${notice_status_published} == PUBLISHED and ${published_at} == 2026-08-01T00:00:00Z"
            - "${c1_status_ok} == NOTICE_DELIVERED and ${c1_delivered_at} == 2026-08-01T00:00:00Z"
            - "${c1_deadline} == 2026-08-15T00:00:00Z (notice_delivered_at + CONSENT_VERIFICATION_WINDOW_DAYS 14 days)"
            - "The byte-identical request that returned ERR_NOTICE_NOT_PUBLISHED now returns 200: only the OTHER entity's state changed"
            - "${err_channel} == ERR_NOTICE_CHANNEL_INCOMPATIBLE with HTTP 422 (SCHOOL_AUTHORIZATION needs delivery_channel SCHOOL_INTERMEDIARY, and the notice is PUBLISHED, so this is not a status problem)"
            - "${c2_status_after_refusal} == INITIATED and ConsentRequest.${consent_c1}.status == NOTICE_DELIVERED (C2's refusal did not disturb C1)"

      - name: collection_gated_by_age_screen_status_and_screening_outcome
        grounds:
          - validations[priority=85]
          - state_machines.AgeScreen.IN_REVIEW_to_ACTIVE
          - errors[ERR_AGE_SCREEN_NOT_ACTIVE]
          - errors[ERR_NOT_CHILD_SUBJECT]
          - entities.OnlineService.fields.live_child_data_element_count
        distinguishing_aspect: |
          On a MIXED_AUDIENCE service, collection depends on a THIRD entity's status: the AgeScreen
          must be ACTIVE, and an IN_REVIEW screen — already created, reviewed, and neutral — is not
          enough. Once the ComplianceOfficer activates it the same collection call succeeds, and the
          screening OUTCOME then becomes a second, independent gate: a THIRTEEN_PLUS subject on the
          same ACTIVE screen is refused with ERR_NOT_CHILD_SUBJECT rather than silently stored.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60)."
            - "Age screen created NEUTRAL_DOB_ENTRY (no neutrality violations) and moved to IN_REVIEW only."
            - "Activity QUIZ whitelists SCREEN_NAME; retention schedule (SCREEN_NAME, PARTICIPATION_CORE) 30 days ANONYMIZE effective 2026-01-01 through 2026-12-31."
            - "Notice published; consent GRANTED via KNOWLEDGE_BASED_AUTH (tier 2, required tier 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Screen Gate Quiz", operator_organization: "Gate Learning", service_category: "EDUCATION_APP", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det: $.data.determination_status }
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id, violations: $.data.neutrality_violation_codes }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
              captures: { screen_status_in_review: $.data.status }
            - call: "POST /activities"
              payload: { service_id: "${svc_id}", activity_code: "QUIZ", participation_required_elements: ["SCREEN_NAME"] }
              as: ComplianceOfficer
              captures: { act_id: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Quiz nickname retained 30 days." }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.j@x.test", child_pseudonym: "child-404", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_id: $.data.id }
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "KBA-PASS-7" }
              as: ComplianceOfficer
              captures: { consent_status: $.data.status }
          trigger:
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { err_screen_inactive: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { live_after_refusal: $.data.live_child_data_element_count, lifetime_after_refusal: $.data.lifetime_collected_element_count }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { screen_status_active: $.data.status, activated_at: $.data.activated_at }
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { rec_id: $.data.id, rec_status: $.data.status }
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "THIRTEEN_PLUS" }
              as: PrivacyEngineer
              captures: { err_not_child: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { live_final: $.data.live_child_data_element_count, lifetime_final: $.data.lifetime_collected_element_count }
          assert:
            - "${det} == MIXED_AUDIENCE and ${violations} == [] and ${screen_status_in_review} == IN_REVIEW and ${consent_status} == GRANTED"
            - "${err_screen_inactive} == ERR_AGE_SCREEN_NOT_ACTIVE with HTTP 422 (IN_REVIEW is not ACTIVE, even for a fully neutral screen)"
            - "${live_after_refusal} == 0 and ${lifetime_after_refusal} == 0"
            - "${screen_status_active} == ACTIVE and ${activated_at} == 2026-08-01T00:00:00Z (only a ComplianceOfficer may activate)"
            - "${rec_status} == COLLECTED and ChildDataRecord.${rec_id}.disposal_due_at == 2026-08-31T00:00:00Z"
            - "${err_not_child} == ERR_NOT_CHILD_SUBJECT with HTTP 422 (not ERR_AGE_SCREEN_NOT_PERMITTED, which is the CHILD_DIRECTED_PRIMARY variant of this clause)"
            - "${live_final} == 1 and ${lifetime_final} == 1 (the refused THIRTEEN_PLUS call incremented nothing)"

      - name: certification_gated_by_program_regulator_approval_state
        grounds:
          - state_machines.SafeHarborAssessment.SUBMITTED_to_CERTIFIED
          - calculations.safe_harbor_status
          - errors[ERR_PROGRAM_NOT_REGULATOR_APPROVED]
          - entities.OnlineService.fields.safe_harbor_status
          - entities.OnlineService.fields.safe_harbor_expires_at
        distinguishing_aspect: |
          Certification reads a field on a THIRD entity — SafeHarborProgram.regulator_approved — that
          the assessment itself cannot influence: a flawless assessment (findings_open_count 0, a
          distinct certifier) is still refused with ERR_PROGRAM_NOT_REGULATOR_APPROVED and stays
          SUBMITTED. Enrolment alone already moves the service off NOT_ENROLLED to ASSESSMENT_DUE,
          and only certification under an approved program yields CERTIFIED with expires_at
          certified_at + assessment_validity_days.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60), safe_harbor_status NOT_ENROLLED."
            - "Program P_BAD: regulator_approved false, annual_assessment_required true, validity 365, grace 30."
            - "Program P_GOOD: regulator_approved true, annual_assessment_required true, validity 365, grace 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Harbor Gate Kids", operator_organization: "Harbor Studios", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id, sh_initial: $.data.safe_harbor_status }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Unrecognised Kids Seal", regulator_approved: false, annual_assessment_required: true, assessment_validity_days: 365, assessment_grace_days: 30 }
              as: ComplianceOfficer
              captures: { prog_bad: $.data.id }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Recognised Kids Seal", regulator_approved: true, annual_assessment_required: true, assessment_validity_days: 365, assessment_grace_days: 30 }
              as: ComplianceOfficer
              captures: { prog_good: $.data.id }
          trigger:
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_id}", program_id: "${prog_bad}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
              captures: { asmt_bad: $.data.id, bad_status_initial: $.data.status, bad_preparer: $.data.preparer_user_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_after_enrol: $.data.safe_harbor_status, sh_expiry_after_enrol: $.data.safe_harbor_expires_at }
            - call: "POST /safe-harbor-assessments/${asmt_bad}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
              captures: { bad_status_submitted: $.data.status, bad_findings: $.data.findings_open_count }
            - call: "POST /safe-harbor-assessments/${asmt_bad}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { err_program: $.data.error_id }
            - call: "GET /safe-harbor-assessments/${asmt_bad}"
              payload: {}
              as: SafeHarborCertifier
              captures: { bad_status_after_refusal: $.data.status, bad_certified_at: $.data.certified_at, bad_expires_at: $.data.expires_at, bad_certifier: $.data.certifier_user_id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_id}", program_id: "${prog_good}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
              captures: { asmt_good: $.data.id }
            - call: "POST /safe-harbor-assessments/${asmt_good}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "assessor-1"
            - call: "POST /safe-harbor-assessments/${asmt_good}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-1"
              captures: { good_status: $.data.status, good_certified_at: $.data.certified_at, good_expires_at: $.data.expires_at, good_certifier: $.data.certifier_user_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_final: $.data.safe_harbor_status, sh_expiry_final: $.data.safe_harbor_expires_at, posture_final: $.data.compliance_posture }
          assert:
            - "${sh_initial} == NOT_ENROLLED (no assessment row of any status exists yet)"
            - "${bad_status_initial} == DRAFT and ${bad_preparer} == assessor-1"
            - "${sh_after_enrol} == ASSESSMENT_DUE and ${sh_expiry_after_enrol} == null (a DRAFT row is enough to leave NOT_ENROLLED, but not to be CERTIFIED)"
            - "${bad_status_submitted} == SUBMITTED and ${bad_findings} == 0 (submission is allowed: annual_assessment_required is true on P_BAD)"
            - "${err_program} == ERR_PROGRAM_NOT_REGULATOR_APPROVED with HTTP 409 (segregation of duties is satisfied and there are zero open findings, so only the program's own flag can explain the refusal)"
            - "${bad_status_after_refusal} == SUBMITTED and ${bad_certified_at} == null and ${bad_expires_at} == null and ${bad_certifier} == null"
            - "${good_status} == CERTIFIED and ${good_certified_at} == 2026-08-01T00:00:00Z and ${good_certifier} == certifier-1"
            - "${good_expires_at} == 2027-08-01T00:00:00Z (certified_at + assessment_validity_days 365; 2026 is not a leap year and 2027-08-01 is exactly 365 days after 2026-08-01)"
            - "${sh_final} == CERTIFIED and ${sh_expiry_final} == 2027-08-01T00:00:00Z (the greatest-assessment_year CERTIFIED row wins; the SUBMITTED P_BAD row of the same year is ignored)"
            - "${posture_final} == OPEN (safe harbor status feeds the posture ladder only through LAPSED)"
            - "SafeHarborAssessment.${asmt_bad}.status == SUBMITTED after the whole sequence (the second assessment did not repair the first)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: audience_sample_half_open_overlap_within_measurement_method_partition
        grounds:
          - validations[priority=100]
          - calculations.audience_child_share
          - entities.DeterminationEvidence.fields.evidence_sequence
          - errors[ERR_SAMPLE_PERIOD_OVERLAP]
          - errors[ERR_INVALID_PERIOD]
        distinguishing_aspect: |
          Audience samples occupy HALF-OPEN periods partitioned by measurement_method: two PANEL
          samples touching at 2026-06-01 coexist, a PANEL sample straddling that seam is refused,
          a zero-width period is ERR_INVALID_PERIOD rather than an overlap, and an AGE_SCREEN_LOG
          sample may occupy the very interval that was just refused for PANEL. The share aggregate
          then proves the partition is real: only the two verified PANEL rows are summed, giving
          800/4000 == 0.2000 (MIXED_AUDIENCE) instead of the 4000/10000 == 0.4000
          (CHILD_DIRECTED_PRIMARY) that swallowing the AGE_SCREEN_LOG row would produce.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Service registered with no evidence yet; evidence_sequence_counter == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Seam Sampler Network", operator_organization: "Seam Measurement Co", service_category: "VIDEO_PLATFORM", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
          trigger:
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", total_users: 2000, users_under_13: 300, sample_verified: true }
              as: ComplianceOfficer
              captures: { ev1: $.data.id, seq1: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 2000, users_under_13: 500, sample_verified: true }
              as: ComplianceOfficer
              captures: { ev2: $.data.id, seq2: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-05-15T00:00:00Z", period_end: "2026-06-15T00:00:00Z", total_users: 2000, users_under_13: 900, sample_verified: true }
              as: ComplianceOfficer
              captures: { err_overlap: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", total_users: 2000, users_under_13: 100, sample_verified: true }
              as: ComplianceOfficer
              captures: { err_period: $.data.error_id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "AGE_SCREEN_LOG", period_start: "2026-05-15T00:00:00Z", period_end: "2026-06-15T00:00:00Z", total_users: 6000, users_under_13: 3200, sample_verified: true }
              as: ComplianceOfficer
              captures: { ev3: $.data.id, seq3: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
              captures: { ev4: $.data.id, seq4: $.data.evidence_sequence }
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det: $.data.determination_status, share: $.data.audience_child_share, score: $.data.design_score, variant: $.data.determination_variant_applied }
            - call: "GET /online-services/${svc_id}/determination-evidence"
              payload: { limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { ev_total: $.meta.total_count }
            - call: "GET /online-services/${svc_id}/determination-evidence"
              payload: { evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { panel_total: $.meta.total_count }
          assert:
            - "${seq1} == 1 and ${seq2} == 2 (period_start 2026-06-01 == the first row's period_end: touching half-open periods are ALLOWED)"
            - "${err_overlap} == ERR_SAMPLE_PERIOD_OVERLAP with HTTP 409 ([2026-05-15, 2026-06-15) straddles the 2026-06-01 seam and intersects BOTH existing rows)"
            - "${err_period} == ERR_INVALID_PERIOD with HTTP 422 (a zero-width period is rejected as invalid, not as an overlap, even though it touches an existing period_end)"
            - "${seq3} == 3 (the same interval that was refused for PANEL is free for AGE_SCREEN_LOG: the overlap key is (service_id, measurement_method))"
            - "${seq4} == 4 (the two refused calls did NOT consume evidence_sequence numbers)"
            - "${variant} == AUDIENCE_FIRST (a verified PANEL sample exists)"
            - "${share} == 0.2000 ((300 + 500) / (2000 + 2000); the 6000-user AGE_SCREEN_LOG row is excluded from the aggregate)"
            - "${det} == MIXED_AUDIENCE (0.2000 >= MIXED_SHARE_THRESHOLD 0.2000 and < PRIMARY_SHARE_THRESHOLD 0.4000)"
            - "Summing every verified sample regardless of method would give 4000/10000 == 0.4000 and the WRONG determination CHILD_DIRECTED_PRIMARY"
            - "${score} == 0.60 (recorded but not decisive under AUDIENCE_FIRST)"
            - "${ev_total} == 4 and ${panel_total} == 2"

      - name: retention_schedule_closed_range_one_day_handover_buffer
        grounds:
          - validations[priority=102]
          - validations[priority=112]
          - errors[ERR_RETENTION_SCHEDULE_OVERLAP]
          - errors[ERR_INVALID_PERIOD]
          - entities.RetentionSchedule.fields.effective_from
        distinguishing_aspect: |
          Retention schedules use CLOSED ranges with a mandatory one-day handover buffer, the exact
          opposite convention to the half-open audience samples in the sibling instance: an
          effective_from equal to the incumbent's effective_to is a CONFLICT (same-day adjacency),
          effective_from == effective_to + 1 day is the first legal value, and the mirror boundary
          (new.effective_to + 1 day == existing.effective_from) is legal on the left as well. The
          partition key is the triple (service_id, data_element_code, purpose_code), so the same
          element under a different purpose may reuse the incumbent's exact range.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service registered (no determination needed — schedules are configuration)."
            - "Incumbent schedule S1: SCREEN_NAME / PARTICIPATION_CORE, 2026-01-01 through 2026-06-30, retention_days 30, ANONYMIZE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Handover Buffer Club", operator_organization: "Buffer Clubs Ltd", service_category: "SOCIAL_COMMUNITY", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", defined_purpose_statement: "H1 nickname policy: 30 days." }
              as: ComplianceOfficer
              captures: { sched_s1: $.data.id }
          trigger:
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 45, disposal_method: "ANONYMIZE", effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "H2 nickname policy attempted with same-day handover." }
              as: ComplianceOfficer
              captures: { err_same_day: $.data.error_id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 45, disposal_method: "ANONYMIZE", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "H2 nickname policy: 45 days." }
              as: ComplianceOfficer
              captures: { sched_s2: $.data.id, s2_from: $.data.effective_from }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "INTERNAL_OPERATIONS", retention_days: 90, disposal_method: "OVERWRITE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", defined_purpose_statement: "Abuse-prevention copy of the nickname." }
              as: ComplianceOfficer
              captures: { sched_s3: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 15, disposal_method: "OVERWRITE", effective_from: "2025-12-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z", defined_purpose_statement: "Legacy policy attempted with same-day handover on the left." }
              as: ComplianceOfficer
              captures: { err_left_same_day: $.data.error_id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 15, disposal_method: "OVERWRITE", effective_from: "2025-12-01T00:00:00Z", effective_to: "2025-12-31T00:00:00Z", defined_purpose_statement: "Legacy 2025 nickname policy: 15 days." }
              as: ComplianceOfficer
              captures: { sched_s4: $.data.id, s4_to: $.data.effective_to }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "INTERNAL_OPERATIONS", retention_days: 0, disposal_method: "OVERWRITE", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-06-30T00:00:00Z", defined_purpose_statement: "Zero-day retention attempted in a free window." }
              as: ComplianceOfficer
              captures: { err_zero_days: $.data.error_id }
            - call: "GET /online-services/${svc_id}/retention-schedules"
              payload: { limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { sched_total: $.meta.total_count }
            - call: "GET /online-services/${svc_id}/retention-schedules"
              payload: { data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { core_total: $.meta.total_count }
          assert:
            - "${err_same_day} == ERR_RETENTION_SCHEDULE_OVERLAP with HTTP 409 (effective_from == the incumbent's effective_to is same-day adjacency, and closed ranges forbid it)"
            - "${sched_s2} is created and ${s2_from} == 2026-07-01T00:00:00Z (effective_to + 1 day is the first legal effective_from — one day later than the refused value)"
            - "${sched_s3} is created (same element and same range as S1, different purpose_code: the partition key includes purpose_code)"
            - "${err_left_same_day} == ERR_RETENTION_SCHEDULE_OVERLAP with HTTP 409 (the mirror boundary: new.effective_to == existing.effective_from also conflicts)"
            - "${sched_s4} is created and ${s4_to} == 2025-12-31T00:00:00Z (new.effective_to + 1 day == existing.effective_from is the legal left boundary)"
            - "${err_zero_days} == ERR_INVALID_PERIOD with HTTP 422 (retention_days must be >= 1; priority 112 is only reached because the 2027 window clears the priority-102 overlap check first)"
            - "${sched_total} == 4 and ${core_total} == 3 (three PARTICIPATION_CORE rows: 2025-12-01..2025-12-31, 2026-01-01..2026-06-30, 2026-07-01..2026-12-31)"
            - "The three accepted PARTICIPATION_CORE ranges leave exactly a one-day gap at each handover and cover no shared day"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: live_element_count_returns_to_zero_while_lifetime_count_only_grows
        grounds:
          - entities.OnlineService.fields.live_child_data_element_count
          - entities.OnlineService.fields.lifetime_collected_element_count
          - state_machines.ParentalRightsRequest.VERIFIED_to_FULFILLED
          - state_machines.ConsentRequest.GRANTED_to_REVOKED
          - errors[ERR_CONSENT_REVOKED]
        distinguishing_aspect: |
          Two counters over the same events must diverge: live_child_data_element_count is a
          reversible balance that returns to exactly 0 when a DELETE right is fulfilled, while
          lifetime_collected_element_count is a monotone witness that never decreases — after the
          deletion it still reads 2, and a fresh consent plus one new record takes it to 3 while the
          live balance reads 1. The compensation is complete but not amnesic: the disposed records
          keep their individually pinned disposal methods, and the revoked consent can never be
          collected against again.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60) with an ACTIVE neutral age screen."
            - "Activity CLUB whitelists SCREEN_NAME and SCHOOL_NAME."
            - "Schedules: (SCREEN_NAME, PARTICIPATION_CORE) 30 days ANONYMIZE; (SCHOOL_NAME, PARTICIPATION_CORE) 60 days OVERWRITE; both effective 2026-01-01 through 2026-12-31."
            - "Consent K1 for guardian.k@x.test / child-405 GRANTED via KNOWLEDGE_BASED_AUTH (tier 2)."
            - "Two records collected under K1: one SCREEN_NAME, one SCHOOL_NAME."
