  - section: cross_cutting_complexity_layers
    instances:
      - name: lien_stale_case_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lien-record-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: |
          Recording a lien with a stale expected_case_version (one less than the current Case.version,
          which advanced when a payment was posted after the version was observed) returns
          ERR_STALE_VERSION (412). Two strictly sequential requests; zero parallelism.
        test_recipe:
          setup:
            - "Case with an OVERDUE MAJOR notice (balance 25000). Client observes Case.version, then a payment of 10000 is posted (bumping Case.version), making the observed version stale."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fee-schedules"
              payload: { violation_class: "MAJOR", base_fine_cents: 20000, daily_accrual_cents: 500, max_total_cents: 100000, cure_days: 14 }
              as: PlatformAdmin
