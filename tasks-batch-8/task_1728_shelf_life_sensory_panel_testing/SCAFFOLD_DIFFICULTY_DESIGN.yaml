            - { call: "POST /sensory-lab/sampling-time-points/${tp1}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_c}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp1}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_v}", quantity: 1, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions/${s1}/open", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panel-assignments/${a1}/mark-no-show", payload: {}, as: PanelCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions/${s2}/open", payload: {}, as: PanelCoordinator }
