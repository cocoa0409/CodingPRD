  # ===========================================================================
  # Section: cross_cutting_complexity_layers (active layers from §0.2)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-accept-stale-request]", "validations[priority=4]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on SittingRequest.version: an accept carrying expected_sitting_request_version one behind the stored version (captured version - 1) is rejected deterministically with 412 ERR_STALE_VERSION; no claim, assignment, or provisional field changes."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical request OPEN with F2's PENDING claim; request version captured at creation"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
          trigger:
            - call: "POST /coop/sitting-requests/${req_id}/claims/${claim_id}/accept"
              payload: { expected_sitting_request_version: "${req_v} - 1" }
              as: Member
              as_user_id: "${f1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 412 with error_id == ERR_STALE_VERSION (stale expected version ${req_v} - 1 vs current ${req_v})"
            - "SittingClaim.${claim_id}.status still PENDING; SittingRequest.${req_id}.status still OPEN and version still == ${req_v}; no assignment exists"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: ["endpoints[POST /coop/members/{memberId}/accept-liability]", "endpoints[POST /coop/sitting-requests/{requestId}/claims/{claimId}/accept]", "concurrency_rules[claim-accept-stale-request]"]
        distinguishing_aspect: "common_fields version semantics: every mutation increments version by exactly 1 — a fresh applicant goes 1 -> 2 on accept-liability (no other mutations in between), and the request goes 1 -> 2 on claim accept (the accept call's declared side effect), both observable via GET."
        test_recipe:
          setup: ["Founders VETTED (finalized); F1 owns pet1; canonical request OPEN; F2 claim PENDING; fresh applicant X created (version 1) then accepts liability (version 2)"]
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - call: "POST /coop/members"
              payload: { display_name: "Applicant X", email: "x@coop.test", address_block: "MAPLE-100", phone: "+15550201" }
              as: Anonymous
              captures: { x_id: $.data.id, x_v0: $.data.version }
            - call: "POST /coop/members/${x_id}/accept-liability"
              payload: {}
              as: Member
              as_user_id: "${x_id}"
          trigger:
            - call: "GET /coop/members/${x_id}"
              as: CoopAdmin
              captures: { x_v1: $.data.version }
            - *accept_a
            - call: "GET /coop/sitting-requests/${req_id}"
              as: CoopAdmin
              captures: { req_v_after: $.data.version }
          assert:
            - "Member.${x_id}.version == 1 at creation and == 2 immediately after accept-liability (exactly +1 per mutation; no other mutation touched X)"
            - "SittingRequest.${req_id}.version == 2 after claim accept (accept side effect bumps exactly +1 from the captured ${req_v} == 1)"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: claim_accept_transitive_assignment_handoff_provisional_chain
          rationale: "The cascading_side_effects layer is exercised end-to-end by the three §1.8 transitive-cascade instances (claim-accept, member-suspend, dispute-resolve chains)."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: settlement_provisional_vs_final_early_departure_divergence
          rationale: "Both variants and their delta are asserted in the named §1.8 dual-variant instance (plus reliability_eventwise_clamp_vs_recompute_divergence for the second domain)."

      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: overdraft_margin_exactly_max_vs_beyond
          rationale: "The -5.0 overdraft threshold is exercised at-exactly and beyond in the named §1.8 boundary instance; the CLAIM_MIN_SCORE 30 threshold is exercised by low_reliability_claim_returns_reliability_too_low in the validations section."

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
