              captures: { org: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers"
              payload: { full_name: "Vera Ng", email: "vera@ex.org", professional_rate_usd_per_hour: 150.00, seniority: "SENIOR", weekly_hours_cap: 40 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/skill-profiles"
              payload: { skill_code: "LEGAL_CONTRACTS", proficiency: 4, years_experience: 10.0 }
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /volunteers/${vol}/vet"
              payload: { verify_skill_codes: ["LEGAL_CONTRACTS"] }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers/${vol}/availability-windows"
              payload: { starts_at: "2026-01-05T00:00:00Z", ends_at: "2026-03-01T00:00:00Z", window_kind: "HARD", hours_offered: 300.00 }
              as: Volunteer
              as_user_id: "${vol}"
              captures: { win: $.data.id }
            - call: "POST /project-requests"
              payload: { partner_org_id: "${org}", cycle_id: "${cyc}", title: "Lease review A", discipline: "LEGAL", required_skill_code: "LEGAL_CONTRACTS", min_proficiency: 3, requested_hours: 40.00, urgency: "ROUTINE" }
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_a: $.data.id }
            - call: "POST /project-requests/${req_a}/submit-for-scoping"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_a_v: $.data.version }
            - call: "POST /project-requests/${req_a}/scope-definitions"
              payload: { expected_project_request_version: "${req_a_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: "STANDARD", ip_disposition: "ASSIGN_TO_PARTNER" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { scope_a: $.data.id }
            - call: "POST /scope-definitions/${scope_a}/deliverables"
              payload: { title: "Lease pack A", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "Redlines delivered" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
            - call: "POST /scope-definitions/${scope_a}/approve"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /project-requests/${req_a}/match"
              payload: {}
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { offer_a: $.data.id }
            - call: "POST /match-offers/${offer_a}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { eng_a: $.data.id, eng_a_v0: $.data.version }
            - call: "POST /project-requests"
              payload: { partner_org_id: "${org}", cycle_id: "${cyc}", title: "Lease review B", discipline: "LEGAL", required_skill_code: "LEGAL_CONTRACTS", min_proficiency: 3, requested_hours: 40.00, urgency: "ROUTINE" }
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_b: $.data.id }
            - call: "POST /project-requests/${req_b}/submit-for-scoping"
              payload: {}
