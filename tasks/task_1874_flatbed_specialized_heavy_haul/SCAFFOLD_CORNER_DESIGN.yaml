            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["AZ"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "AZ", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_os: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/permits/${p_os}/file", payload: {}, as: PermitClerk, captures: { fee: "$.data.fee_cents", basis: "$.data.weight_basis_lbs" } }
          assert:
            - "fee == 10500 (AZ OVERSIZE base 8000 + width bracket 2500; weight surcharge 0 for OVERSIZE)"
            - "basis == 40000 (declared; weight recorded even though unused for OVERSIZE)"

