          - errors[ERR_STALE_VISIT_VERSION]
        distinguishing_aspect: "Guards the declared OCC field of the visit rule: one version behind is refused with ERR_STALE_VISIT_VERSION (412), the freshly read version succeeds, and a version that WAS current becomes stale the moment an unrelated visit write (the eligibility check) lands — so the same literal that worked earlier now 412s."
        test_recipe:
          setup:
            - "A CA StateRule, a SORE_THROAT protocol with requires_cosign false, an OPEN CA clinic with one ACTIVE clinician."
