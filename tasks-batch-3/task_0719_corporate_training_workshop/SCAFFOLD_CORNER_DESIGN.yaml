  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_every_write_stub
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cohort-lock-stale-version]
          - entities.Cohort.fields.seats_confirmed
        excluded_because:
          difficulty_instance: dual_variant_calc / contract_reserved_vs_committed_diverge
          rationale: "Cohort.version advancing on confirm (which makes a stale lock fail) is exercised by the OCC lock with captured ${coh_v} in that §1.8 instance; the stale-version 412 is covered by corner cohort_lock_stale_version_returns_412."

