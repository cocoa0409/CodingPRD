  # ===================================================================
  - section: entities
    instances:
      - name: list_manufacture_orders_by_project_fk_reverse
        claim_type: Parent Relationships
        grounds: ["entities.ManufactureOrder.fields.project_id", "endpoints"]
        distinguishing_aspect: "GET /projects/{id}/manufacture returns the cascade-created ManufactureOrder[] (its only discovery channel, since it is synthesized on accept)."
        test_recipe:
          setup: ["CONTRACTED project with an auto-created ManufactureOrder"]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Fk", email: "fk@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { q_ver: $.data.version }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${q_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
          trigger:
            - call: "GET /projects/${proj_id}/manufacture"
              payload: {}
              as: OperationsCoordinator
          assert:
            - "response_type == array"
            - "exactly one ManufactureOrder returned with quote_id == ${quote_id}"

      - name: list_install_jobs_by_crew_fk_reverse
        claim_type: Parent Relationships
        grounds: ["entities.InstallJob.fields.crew_id", "endpoints"]
        distinguishing_aspect: "GET /install-jobs?crew_id=... returns InstallJob[] for that crew (filtered-list reverse-reachability for InstallJob.crew_id)."
        test_recipe:
          setup: ["one SCHEDULED InstallJob on a crew"]
          setup_api_calls:
            - call: "POST /crews"
              payload: { name: "Crew F", home_jurisdiction: "CENTRAL_LIGHT", daily_capacity_openings: 5 }
              as: OperationsCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /homeowners"
              payload: { full_name: "Fj", email: "fj@x.com", property_zip: "30301" }
              as: PlatformAdmin
              captures: { ho_id: $.data.id }
            - call: "POST /projects"
              payload: { homeowner_id: "${ho_id}" }
              as: SalesConsultant
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations"
              payload: { project_id: "${proj_id}", consultant_id: "sc-1", scheduled_at: "2026-04-02T09:00:00Z" }
              as: SalesConsultant
              captures: { cons_id: $.data.id }
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/openings"
              payload: { consultation_id: "${cons_id}", product_type: "CASEMENT", width_in: 30, height_in: 40, glass_package: "LOWE_DUAL" }
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/consultations/${cons_id}/complete-measure"
              payload: {}
              as: SalesConsultant
            - call: "POST /projects/${proj_id}/quotes"
              payload: { project_id: "${proj_id}", consultation_id: "${cons_id}" }
              as: SalesConsultant
              captures: { quote_id: $.data.id }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/send"
              payload: {}
              as: SalesConsultant
              captures: { q_ver: $.data.version }
            - call: "POST /projects/${proj_id}/quotes/${quote_id}/accept"
              payload: { expected_quote_version: "${q_ver}" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { mo_id: $.data.id }
            - call: "POST /projects/${proj_id}/install-jobs"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T17:00:00Z" }
              as: OperationsCoordinator
              captures: { job_id: $.data.id }
          trigger:
            - call: "GET /install-jobs?crew_id=${crew_id}"
              payload: {}
              as: OperationsCoordinator
          assert:
            - "response_type == array"
            - "at least one InstallJob returned with crew_id == ${crew_id}"
