    path: "/petfood/formulas/{id}/recall-actions"
    description: "List recalls for a formula (FK reverse reachability)"
    roles: [PlatformAdmin, QAApprover, QualityAnalyst]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RecallAction[]
    side_effects: []
