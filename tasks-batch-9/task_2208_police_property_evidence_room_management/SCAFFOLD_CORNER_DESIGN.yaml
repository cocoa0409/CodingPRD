            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Revolver to be destroyed", category: "FIREARM", packaging_type: "RIGID_BOX", appraised_value_cents: 45000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { gun1: $.data.id }
            - call: "POST /evidence-items/${gun1}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Shotgun contested by the court", category: "FIREARM", packaging_type: "RIGID_BOX", appraised_value_cents: 46000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { gun2: $.data.id }
            - call: "POST /evidence-items/${gun2}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
