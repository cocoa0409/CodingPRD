              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_id}/submit-screening"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/census-batches/${batch_id}/lock"
              payload: {}
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/assumption-sets"
              payload: { plan_year: 2028, label: "base", mortality_table: "TEST_TABLE_4AGE", funding_discount_rate: 0.05, disclosure_discount_rate: 0.04, retirement_age: 62 }
              as: Actuary
              as_user_id: "${act_prep}"
              captures: { aset_id: "$.data.id" }
            - call: "POST /v1/assumption-sets/${aset_id}/submit"
              payload: {}
              as: Actuary
              as_user_id: "${act_prep}"
            - call: "POST /v1/assumption-sets/${aset_id}/approve"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/assumption-sets/${aset_id}/lock"
              payload: {}
              as: SeniorActuary
              as_user_id: "${act_rev}"
            - call: "POST /v1/plans/${plan_id}/asset-statements"
              payload: { plan_year: 2028, market_value_begin: 639.70, contributions_received: 0, benefits_paid: 31.99, investment_return: 31.99 }
              as: PlanAdmin
            - call: "POST /v1/plans/${plan_id}/asset-valuations"
              payload: { plan_year: 2028 }
              as: Actuary
