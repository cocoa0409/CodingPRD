            - "across the whole trigger no ProductListing.listing_status transition is recorded for ${lst_id} (the register dimension is untouched by the safety dimension)"

      - name: recall_plan_revision_cycle_terminates_at_third_round
        grounds:
          - state_machines.RecallAction.PLAN_REQUIRED_to_PLAN_SUBMITTED
          - state_machines.RecallAction.PLAN_SUBMITTED_to_PLAN_REJECTED
          - state_machines.RecallAction.PLAN_REJECTED_to_PLAN_SUBMITTED
          - validations[priority=47]
          - entities.RecallAction.fields.plan_round
        distinguishing_aspect: |
          Non-linear shape on a DIFFERENT entity — RecallAction — and a different non-linearity: a
          true CYCLE (PLAN_SUBMITTED <-> PLAN_REJECTED) with a termination counter. The same pair of
          endpoints is walked three times, plan_round monotonically increments 1 -> 2 -> 3, and the
          fourth plan submission is refused by validations[priority=47] instead of looping forever.
          A VOLUNTARY_NOTICE basis is required: a MANDATORY_ORDER recall would leave the cycle at
          round 3 for the terminal ESCALATED_MANDATORY state instead.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one DRAFT listing (a recall does not require a LISTED product)"
            - "one RecallAction with initiation_basis VOLUNTARY_NOTICE and hazard_class CLASS_III, opened by officer OFF-1 and sitting in PLAN_REQUIRED with plan_round 0"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Quarry Cosmetic Fill", owner_operator_name: "Quarry LLC", facility_type: "PROCESSOR", country_code: "US", state_or_province: "TX" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Quarry Brands LLC", us_address_line: "77 Rock Rd, Austin TX 78701", contact_phone: "+1-202-555-0114", contact_email: "rp@quarry.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Quarry Bath Salt", category_code: "02C", product_form: "RINSE_OFF", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "help@quarry.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "VOLUNTARY_NOTICE", hazard_class: "CLASS_III" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Round 1: wholesale-level retrieval only", distribution_depth: "WHOLESALE" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { round_after_1: $.data.plan_round }
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan-decision"
              payload: { decision: "REJECT", decision_note: "Depth insufficient for the distribution reached" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Round 2: retail-level retrieval", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan-decision"
              payload: { decision: "REJECT", decision_note: "Consumer-level notice still missing" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Round 3: consumer-level retrieval and press notice", distribution_depth: "CONSUMER" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { round_after_3: $.data.plan_round }
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan-decision"
              payload: { decision: "REJECT", decision_note: "Press notice text unacceptable" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Round 4: revised press notice", distribution_depth: "CONSUMER" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          assert:
            - "after trigger[0]: RecallAction.${rec_id}.status == PLAN_SUBMITTED, plan_round == 1, distribution_depth == WHOLESALE"
            - "after trigger[1]: RecallAction.${rec_id}.status == PLAN_REJECTED and plan_decision_user_id == 'OFF-1'"
            - "after trigger[2]: RecallAction.${rec_id}.status == PLAN_SUBMITTED and plan_round == 2 (the cycle re-enters the same state)"
            - "after trigger[4]: RecallAction.${rec_id}.status == PLAN_SUBMITTED and plan_round == 3"
            - "after trigger[5]: RecallAction.${rec_id}.status == PLAN_REJECTED and plan_round is STILL 3 — a VOLUNTARY_NOTICE recall does NOT take state_machines.RecallAction.PLAN_SUBMITTED_to_ESCALATED_MANDATORY"
            - "trigger[6] returns ERR_RECALL_PLAN_ROUNDS_EXHAUSTED (409): plan_round == MAX_PLAN_ROUNDS (3) terminates the cycle"
            - "after trigger[6]: RecallAction.${rec_id}.status is unchanged at PLAN_REJECTED, plan_round == 3, corrective_summary still the round-3 text, and ProductListing.${lst_id}.open_recall_count == 1"
            - "${round_after_3} - ${round_after_1} == 2"

  - rule_id: transitive_cascade
    instances:
      - name: late_serious_report_cascades_points_posture_dossier_and_listing
        grounds:
          - state_machines.AdverseEvent.REPORT_DUE_to_REPORTED_LATE
          - calculations.facility_serious_event_points
          - calculations.facility_compliance_posture
          - state_machines.SafetySubstantiation.ADEQUATE_to_REVALIDATION_REQUIRED
          - state_machines.ProductListing.SUBSTANTIATED_to_REVALIDATION_REQUIRED
          - entities.ComplianceLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Four-hop cascade fired by ONE write (the late report), each hop strictly caused by the
          previous: hop 1 AdverseEvent REPORT_DUE -> REPORTED_LATE stamps event_points 10.00; hop 2
          those points recompute Facility.serious_event_points and cross POSTURE_RESTRICTED_POINTS,
          so compliance_posture escalates OPEN -> RESTRICTED; hop 3 that escalation out of OPEN moves
          the facility's ADEQUATE SafetySubstantiation to REVALIDATION_REQUIRED; hop 4 the dossier
          move drags ProductListing.safety_status to REVALIDATION_REQUIRED and flips marketable to
          false. Remove any single hop and the observable end state differs.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one LISTED + SUBSTANTIATED listing (canonical 65.00 dossier), so there is something for hops 3 and 4 to reach"
            - "logical clock advanced to 2026-08-06T00:00:00Z, then one SERIOUS AdverseEvent recorded with received_at 2026-08-05T10:00:00Z (deadline 2026-08-20T23:59:59.999Z)"
            - "logical clock advanced to 2026-09-01T12:00:00Z so the single report is exactly 12 days late (base 5 x capped factor 2.0 = 10.00, precisely the RESTRICTED threshold)"
            - "no compliance sweep is run, so the event is still REPORT_DUE (base 5) rather than REPORT_OVERDUE (base 9) when the report lands"
