              as_user_id: "co-1"
              captures: { det_id: $.data.id }
          assert:
            - "UniversalAvailabilityNotice.${n1_id}.is_valid == false because delivery_method is INTRANET_POSTING"
            - "UniversalAvailabilityNotice.${n2_id}.is_valid == false because recipient_count 249 is below reported_participant_count 250"
            - "EligibilityDetermination.${det_id}.status == ELIGIBLE"
            - "EligibilityDetermination.${det_id}.notice_status == INVALID, not MISSING"
            - "EligibilityDetermination.${det_id}.universal_availability_applies == true"

