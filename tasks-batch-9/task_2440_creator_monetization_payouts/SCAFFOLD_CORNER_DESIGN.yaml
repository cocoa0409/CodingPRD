              as: PlatformAdmin
          trigger:
            - call: "PATCH /monetization/revenue-products/${prod}"
              payload: { creator_share_bps: "6000" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_INVALID_FIELD_VALUE'"
            - "RevenueProduct.${prod}.status == 'RETIRED'"
            - "RevenueProduct.${prod}.creator_share_bps == 7000"

      - name: stale_creator_version_outranks_tax_country_mismatch
        claim_type: priority_conflict
        grounds:
          - "validations[priority 43]"
          - "validations[priority 52]"
          - "concurrency_rules[tax-profile-create-stale-creator]"
        distinguishing_aspect: "The same request carries a stale expected_creator_version and a country_code that does not match the creator; the OCC rule sits at priority 43 and therefore wins, returning 412 ERR_STALE_CREATOR_VERSION rather than 422 ERR_TAX_COUNTRY_MISMATCH."
        test_recipe:
          setup: ["One US creator whose version was bumped once by an evaluate call, so the version captured at creation is now stale."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /monetization/creators/${cr}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W8BEN", country_code: "GB", tin_provided: false, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 412"
            - "error.error_id == 'ERR_STALE_CREATOR_VERSION'"
            - "Creator.${cr}.version == ${cr_v2}"
            - "GET /monetization/tax-profiles?creator_id=${cr}: total_count == 0"

      - name: period_abutment_is_not_treated_as_an_overlap
        claim_type: temporal_validation
        grounds:
          - "validations[priority 67]"
          - "errors[ERR_PERIOD_WINDOW_OVERLAP]"
        excluded_because:
          difficulty_instance: earnings_period_half_open_interval_permits_abutment
          rationale: "That instance already creates an abutting period at new.period_start == old.period_end, asserts the 201, and then asserts the overlap rejection at one second earlier, so both the satisfaction and the violation of rule 67 are covered."

      - name: third_appeal_response_is_rejected_when_rounds_are_exhausted
        claim_type: violation_to_error
        grounds:
          - "validations[priority 24]"
          - "errors[ERR_APPEAL_ROUNDS_EXHAUSTED]"
        excluded_because:
          difficulty_instance: appeal_info_request_cycle_exhausts_revision_rounds
          rationale: "That instance walks the request-info/respond cycle to revision_round 2 and asserts the third respond call returns ERR_APPEAL_ROUNDS_EXHAUSTED with the round counter unchanged."

      - name: dispute_claim_above_net_payable_is_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority 77]"
          - "errors[ERR_DISPUTE_AMOUNT_EXCEEDS_STATEMENT]"
        excluded_because:
          difficulty_instance: rejected_dispute_round_trip_restores_statement_payable_with_no_ledger_movement
          rationale: "That instance asserts the upper bound of rule 77 by disputing one cent above net_payable_cents before performing the legal round trip, so the violation already has a trigger."

      - name: accrual_inside_an_open_investigation_window_is_rejected
        claim_type: temporal_validation
        grounds:
          - "validations[priority 48]"
          - "errors[ERR_ACCRUAL_UNDER_INVESTIGATION]"
        excluded_because:
          difficulty_instance: accrual_blocked_at_both_inclusive_endpoints_of_investigation_window
          rationale: "That instance triggers ERR_ACCRUAL_UNDER_INVESTIGATION at both closed endpoints of the window and asserts the accrual immediately outside it succeeds."

      - name: payout_without_a_verified_tax_profile_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority 47]"
          - "errors[ERR_TAX_DOCUMENTATION_MISSING]"
        excluded_because:
          difficulty_instance: payout_create_missing_tax_safety_outranks_below_threshold_fiscal
          rationale: "That instance creates a payout attempt with no VERIFIED profile and a sub-threshold balance and asserts ERR_TAX_DOCUMENTATION_MISSING wins, which covers the violation of rule 47."
      - name: zero_length_earnings_period_window_is_rejected
        claim_type: temporal_validation
        grounds:
          - "validations[priority 66]"
          - "errors[ERR_PERIOD_WINDOW_INVALID]"
        distinguishing_aspect: "Rule 66 is strict where the investigation window rule is not: a period whose end equals its start is rejected, and so is a reversed window, while a one-second window is accepted."
        test_recipe:
          setup: ["Empty database; no earnings periods exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08-degenerate", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
