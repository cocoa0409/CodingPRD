              as: Clerk
              captures: { kap: $.data.id }
            - call: "POST /applications/${kap}/submit"
              payload: {}
              as: Clerk
            - call: "POST /applications/${kap}/decide"
              payload: { decision: "APPROVE" }
              as: Clerk
              as_user_id: "clerk-1"
            - call: "GET /applications/${kap}/licenses"
              payload: {}
              as: Clerk
              captures: { klc: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-20T12:00:00Z" }
              as: Clerk
            - call: "POST /returns"
              payload: { license_id: "${klc}", officiant_id: "${kofc}", ceremony_date: "2026-01-20T12:00:00Z" }
              as: Officiant
              as_user_id: "${kofc}"
              captures: { krt: $.data.id }
            - call: "POST /returns/${krt}/accept"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /records?return_id=${krt}"
              payload: {}
              as: Clerk
              captures: { krc: "$.data[0].id" }
            - call: "POST /certified-copies"
              payload: { record_id: "${krc}", requester_kind: "PUBLIC", copies_requested: 2 }
              as: Clerk
              captures: { kcc: $.data.id }
            - call: "GET /records/${krc}"
              payload: {}
              as: Clerk
              captures: { krcv: $.data.version }
          trigger:
            - call: "POST /certified-copies/${kcc}/decide"
              payload: { decision: "ISSUE", expected_record_version: "${krcv}" }
              as: Clerk
              as_user_id: "clerk-2"
            - call: "GET /records/${krc}"
              payload: {}
              as: Clerk
              captures: { krc_after_issue: $.data.certified_copies_issued }
            - call: "POST /certified-copies/${kcc}/refund"
