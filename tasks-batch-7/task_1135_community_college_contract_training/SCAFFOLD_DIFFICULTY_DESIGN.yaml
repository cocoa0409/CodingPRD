              as_user_id: "wc-01"
              captures: { agr: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/training-agreements/${agr}/sign"
              payload: {}
              as: EmployerContact
              as_user_id: "${emp}"
            - call: "POST /ct/venues"
              payload: { name: "Psi Gym", kind: "EMPLOYER_SITE", capacity: 10, hourly_cost_cents: 0 }
              as: CollegeAdmin
              as_user_id: "adm-01"
              captures: { ven: $.data.id }
            - call: "POST /ct/training-agreements/${agr}/cohorts"
              payload: { delivery_mode: "ON_SITE", min_enrollment: 1, start_date: "2026-06-15T00:00:00Z", end_date: "2026-06-15T00:00:00Z", venue_id: "${ven}" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { coh: $.data.id }
            - call: "POST /ct/cohorts/${coh}/sessions"
              payload: { venue_id: "${ven}", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T11:00:00Z" }
              as: WorkforceCoordinator
