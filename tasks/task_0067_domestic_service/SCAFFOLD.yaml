scenario: |
  Domestic service dispatch system: service personnel qualification management with personnel profile,
  identity verification, health certificate validation, skill-tag (cleaning/cooking/childcare/eldercare)
  certification, training records, periodic re-certification, and disqualification handling; customer
  ordering with service-item catalog, service-area filtering, service-time selection, single-time and
  recurring-order modes, order-modification window, and order-cancellation rules; intelligent matching
  and dispatch with skill matching, geographic-distance filtering, service-personnel availability and
  workload, customer-preference (gender/age/language) consideration, dispatch acceptance window,
  re-dispatch on rejection, and manual reassignment; service execution records with on-site check-in
  (GPS/face), service-procedure checklist, before-and-after photo evidence, abnormal-event reporting,
  customer-side acceptance, and service-completion confirmation; customer rating with multi-dimension
  rating (service quality/punctuality/attitude), text review, anonymous-review handling, low-rating
  service investigation, and rating-based dispatch priority adjustment; salary settlement with
  order-based commission, performance-tier-based bonus, refund-induced reversal, withholding for
  complaint period, tax handling, and periodic payout; insurance claims with on-the-job-injury and
  customer-property-damage insurance, claim-event reporting, evidence collection, insurance-company
  coordination, claim-payout tracking, and claim record archiving; event-driven synchronization with
  payment, IM, and insurance-company systems; audit logging for dispatch actions and claim records.

domain_name: domestic-service-dispatch
api_prefix: /dsd

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServicePersonnel
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of personnel
      - name: gender
        type: enum
        source: input
        description: Personnel gender for customer preference matching
        constraints: "values in {MALE, FEMALE}"
      - name: age
        type: integer
        source: input
        description: Personnel age in years (used for customer preference matching and minimum-age check)
        constraints: "18 <= age <= 70"
      - name: languages
        type: array
        source: input
        description: Array of language codes spoken by personnel (e.g., ['zh', 'en'])
      - name: skill_tags
        type: array
        source: input
        description: Certified skills. Each entry must reference a SkillCertification.skill_tag in ACTIVE status. Derived view of cert table; refreshed on cert state change.
        constraints: "values from {CLEANING, COOKING, CHILDCARE, ELDERCARE}"
      - name: service_lat
        type: number
        source: input
        description: Home-base latitude for geographic-distance filtering
      - name: service_lng
        type: number
        source: input
        description: Home-base longitude for geographic-distance filtering
      - name: service_radius_km
        type: number
        source: input
        description: Maximum service distance in kilometers from home base
        default: 10
      - name: identity_verified
        type: boolean
        source: system
        description: Set true only when identity verification document is submitted and approved
        default: false
      - name: health_cert_expires_at
        type: datetime
        source: input
        description: Health certificate expiry timestamp; when current_time >= this value the personnel cannot serve until renewed
      - name: status
        type: enum
        source: system
        description: Lifecycle status of the personnel record (see §1.2)
        constraints: "values in {PENDING_VERIFICATION, ACTIVE, SUSPENDED, DISQUALIFIED}"
        default: PENDING_VERIFICATION
      - name: rating_score
        type: number
        source: computed
        description: Weighted-scoring lifetime rating (see calculations.personnel_rating_score); precision 4 decimals
        default: 0
      - name: rating_count
        type: integer
        source: computed
        description: Number of completed orders that have a final rating contributing to rating_score
        default: 0
      - name: workload_active_orders
        type: integer
        source: computed
        description: Count of orders currently in {DISPATCHED, ACCEPTED, IN_PROGRESS} assigned to this personnel; recomputed on every assignment/transition
        default: 0
      - name: tier
        type: enum
        source: computed
        description: Performance tier derived from rating_score (see calculations.performance_tier)
        constraints: "values in {BRONZE, SILVER, GOLD, PLATINUM}"
        default: BRONZE
      - name: last_recert_at
        type: datetime
        source: system
        description: Timestamp of last successful re-certification sweep; null until first sweep
        default: null

  - name: SkillCertification
    parent: null
    common_fields: true
    fields:
      - name: personnel_id
        type: string
        source: input
        description: Foreign key to ServicePersonnel.id
      - name: skill_tag
        type: enum
        source: input
        description: Skill being certified
        constraints: "values in {CLEANING, COOKING, CHILDCARE, ELDERCARE}"
      - name: training_hours
        type: number
        source: input
        description: Training hours recorded for this certification (>=8)
      - name: certified_at
        type: datetime
        source: system
        description: Timestamp when cert moved to ACTIVE
      - name: expires_at
        type: datetime
        source: input
        description: Certification expiry timestamp
      - name: status
        type: enum
        source: system
        description: Lifecycle status of this certification
        constraints: "values in {PENDING, ACTIVE, EXPIRED, REVOKED}"
        default: PENDING

  - name: ServiceItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the service offering
      - name: required_skill_tag
        type: enum
        source: input
        description: Skill tag a personnel must have ACTIVE to serve this item
        constraints: "values in {CLEANING, COOKING, CHILDCARE, ELDERCARE}"
      - name: base_price_cents
        type: integer
        source: input
        description: Base price per single service-hour in integer cents
      - name: min_duration_hours
        type: number
        source: input
        description: Minimum duration of a single service in hours
        default: 1
      - name: service_areas
        type: array
        source: input
        description: Array of allowed area codes (e.g., ['CN-11-001']). Customer.area_code must be in this list.
      - name: active
        type: boolean
        source: input
        description: Whether the item is bookable. Inactive items reject new orders but existing orders proceed.
        default: true

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer display name
      - name: area_code
        type: string
        source: input
        description: Service-area code used for area filtering against ServiceItem.service_areas
      - name: address_lat
        type: number
        source: input
        description: Service location latitude
      - name: address_lng
        type: number
        source: input
        description: Service location longitude
      - name: pref_gender
        type: enum
        source: input
        description: Preferred personnel gender; null means no preference
        constraints: "values in {MALE, FEMALE, null}"
        default: null
      - name: pref_min_age
        type: integer
        source: input
        description: Preferred minimum personnel age; null means no preference
        default: null
      - name: pref_max_age
        type: integer
        source: input
        description: Preferred maximum personnel age; null means no preference
        default: null
      - name: pref_language
        type: string
        source: input
        description: Preferred language code; null means no preference
        default: null
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Refunded credits available for future orders, in integer cents; mutates only via refund (+) and credit-redemption (−). Invariant under settlement reversal.
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: Foreign key to Customer.id
      - name: service_item_id
        type: string
        source: input
        description: Foreign key to ServiceItem.id
      - name: mode
        type: enum
        source: input
        description: Order mode; SINGLE creates one occurrence, RECURRING is governed by RecurringOrder
        constraints: "values in {SINGLE, RECURRING}"
      - name: recurring_order_id
        type: string
        source: system
        description: Foreign key to RecurringOrder.id when mode=RECURRING; null when SINGLE
        default: null
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Planned service start timestamp
      - name: duration_hours
        type: number
        source: input
        description: Service duration in hours; multiplied by ServiceItem.base_price_cents for gross_price_cents
      - name: gross_price_cents
        type: integer
        source: computed
        description: ServiceItem.base_price_cents * duration_hours, in integer cents (no rounding because base price is integer cents and duration is in 0.5h steps)
        default: 0
      - name: status
        type: enum
        source: system
        description: Order lifecycle status (see §1.2)
        constraints: "values in {DRAFT, PENDING_DISPATCH, DISPATCHED, ACCEPTED, IN_PROGRESS, COMPLETED, ACCEPTED_BY_CUSTOMER, CANCELLED, REFUNDED}"
        default: DRAFT
      - name: assigned_personnel_id
        type: string
        source: system
        description: Personnel currently holding the order; updated on dispatch / reassignment
        default: null
      - name: dispatch_round
        type: integer
        source: system
        description: Number of dispatch attempts made for this order; increments on every dispatch (initial + each re-dispatch)
        default: 0
      - name: dispatch_deadline_at
        type: datetime
        source: system
        description: Wall-clock deadline for the assigned personnel to accept; if current_time >= this and still DISPATCHED then the dispatch auto-expires
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Timestamp when status moved to COMPLETED
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Timestamp when customer accepted service completion (moved to ACCEPTED_BY_CUSTOMER)
        default: null
      - name: refunded_at
        type: datetime
        source: system
        description: Timestamp when refund processed
        default: null
      - name: rated
        type: boolean
        source: system
        description: True when an OrderRating record exists for this order
        default: false

  - name: RecurringOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: Foreign key to Customer.id
      - name: service_item_id
        type: string
        source: input
        description: Foreign key to ServiceItem.id
      - name: cadence_days
        type: integer
        source: input
        description: Interval in days between occurrences
        constraints: "value in {1, 7, 14, 30}"
      - name: first_start_at
        type: datetime
        source: input
        description: First scheduled occurrence start timestamp
      - name: duration_hours
        type: number
        source: input
        description: Duration applied to every generated occurrence
      - name: occurrences_generated
        type: integer
        source: system
        description: Total occurrences materialized as Order rows
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle status
        constraints: "values in {ACTIVE, PAUSED, TERMINATED}"
        default: ACTIVE

  - name: ServiceExecution
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: Foreign key to Order.id (exactly one ServiceExecution per Order)
      - name: checkin_lat
        type: number
        source: input
        description: GPS latitude at check-in
      - name: checkin_lng
        type: number
        source: input
        description: GPS longitude at check-in
      - name: checkin_face_passed
        type: boolean
        source: input
        description: Whether on-site face verification matched the assigned personnel
      - name: checkin_at
        type: datetime
        source: system
        description: Server timestamp of check-in
      - name: procedure_checklist
        type: array
        source: input
        description: Ordered list of procedure-step completion flags; size and content fixed per service item
      - name: before_photo_url
        type: string
        source: input
        description: URL to before-service photo evidence
      - name: after_photo_url
        type: string
        source: input
        description: URL to after-service photo evidence
      - name: abnormal_reported
        type: boolean
        source: system
        description: True if any AbnormalEvent linked to this execution exists
        default: false
      - name: completion_submitted_at
        type: datetime
        source: system
        description: Timestamp when personnel submitted service-completion confirmation
        default: null

  - name: AbnormalEvent
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: Foreign key to Order.id (where the abnormality occurred)
      - name: reporter_role
        type: enum
        source: input
        description: Role that reported the event
        constraints: "values in {PERSONNEL, CUSTOMER, OPERATOR}"
      - name: category
        type: enum
        source: input
        description: Abnormal-event category
        constraints: "values in {INJURY, PROPERTY_DAMAGE, NO_SHOW, OTHER}"
      - name: description
        type: string
        source: input
        description: Free-text description of the event
      - name: triggers_claim
        type: boolean
        source: system
        description: "Computed: true when category in {INJURY, PROPERTY_DAMAGE}; the matching transition opens an InsuranceClaim"

  - name: OrderRating
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: Foreign key to Order.id; unique (one rating per order)
      - name: quality_score
        type: integer
        source: input
        description: Service quality dimension (1-5)
      - name: punctuality_score
        type: integer
        source: input
        description: Punctuality dimension (1-5)
      - name: attitude_score
        type: integer
        source: input
        description: Attitude dimension (1-5)
      - name: text_review
        type: string
        source: input
        description: Free-text review
      - name: anonymous
        type: boolean
        source: input
        description: When true, customer_id is masked in public-facing reads
        default: false
      - name: composite_score
        type: number
        source: computed
        description: Weighted composite of three dimensions (see calculations.rating_composite); precision 4 decimals
      - name: investigation_status
        type: enum
        source: system
        description: Investigation state when composite_score is low
        constraints: "values in {NONE, OPEN, CLOSED}"
        default: NONE

  - name: SettlementLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: personnel_id
        type: string
        source: input
        description: Foreign key to ServicePersonnel.id
      - name: order_id
        type: string
        source: input
        description: Foreign key to Order.id this entry derives from
      - name: kind
        type: enum
        source: input
        description: Entry kind
        constraints: "values in {COMMISSION, BONUS, REVERSAL, TAX, PAYOUT}"
      - name: amount_cents
        type: integer
        source: input
        description: Signed integer cents. COMMISSION/BONUS are positive credits to the personnel ledger; REVERSAL/TAX/PAYOUT are negative debits.
      - name: posted_at
        type: datetime
        source: system
        description: Timestamp the entry was posted
      - name: cycle_id
        type: string
        source: input
        description: Settlement cycle identifier (e.g., 2026-05); groups entries for periodic payout
      - name: withheld_until
        type: datetime
        source: input
        description: For COMMISSION/BONUS entries, the timestamp until which the entry is withheld for the complaint period. Null for REVERSAL/TAX/PAYOUT.
        default: null

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: Foreign key to Order.id
      - name: abnormal_event_id
        type: string
        source: input
        description: Foreign key to AbnormalEvent.id; the event that opened the claim
      - name: claim_type
        type: enum
        source: input
        description: Coverage type
        constraints: "values in {ON_JOB_INJURY, PROPERTY_DAMAGE}"
      - name: status
        type: enum
        source: system
        description: Claim lifecycle status
        constraints: "values in {REPORTED, EVIDENCE_PENDING, FILED, APPROVED, REJECTED, PAID, ARCHIVED}"
        default: REPORTED
      - name: claimed_amount_cents
        type: integer
        source: input
        description: Amount claimed in integer cents
      - name: paid_amount_cents
        type: integer
        source: system
        description: Amount paid out by insurance in integer cents
        default: 0
      - name: evidence_count
        type: integer
        source: computed
        description: Number of evidence items attached
        default: 0

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: action_type
        type: enum
        source: input
        description: Audited action kind
        constraints: "values in {DISPATCH, REASSIGN, DISPATCH_EXPIRED, CLAIM_REPORTED, CLAIM_FILED, CLAIM_APPROVED, CLAIM_REJECTED, CLAIM_PAID}"
      - name: subject_type
        type: enum
        source: input
        description: Entity type the action targeted
        constraints: "values in {Order, InsuranceClaim}"
      - name: subject_id
        type: string
        source: input
        description: id of the affected entity
      - name: actor_role
        type: string
        source: input
        description: Role string of the acting party
      - name: actor_id
        type: string
        source: input
        description: id of the acting party (entity id or opaque operator id)
      - name: payload
        type: object
        source: input
        description: JSON snapshot of relevant fields at the time of the action

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServicePersonnel
    initial_state: PENDING_VERIFICATION
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /dsd/personnel/{id}/activate"
        actor: PlatformOperator
        preconditions:
          - "identity_verified == true"
          - "health_cert_expires_at > current_time"
          - "at least one ACTIVE SkillCertification exists for this personnel"
        side_effects:
          - "recompute ServicePersonnel.tier from rating_score (calculations.performance_tier)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dsd/personnel/{id}/suspend"
        actor: PlatformOperator
        preconditions:
          - "no Order assigned to this personnel is in {DISPATCHED, ACCEPTED, IN_PROGRESS}"
        side_effects:
          - "workload_active_orders unchanged (no active orders by precondition)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dsd/personnel/{id}/reinstate"
        actor: PlatformOperator
        preconditions:
          - "health_cert_expires_at > current_time"
          - "at least one ACTIVE SkillCertification still exists"
        side_effects:
          - "recompute ServicePersonnel.tier"
      - from: ACTIVE
        to: DISQUALIFIED
        trigger: "POST /dsd/personnel/{id}/disqualify"
        actor: PlatformOperator
        preconditions:
          - "no Order assigned to this personnel is in {DISPATCHED, ACCEPTED, IN_PROGRESS}"
        side_effects:
          - "all linked SkillCertification rows transition ACTIVE→REVOKED"
          - "ServicePersonnel.skill_tags refreshed to empty array (REVOKED certs no longer count)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dsd/_sweep/recertification (system event when health_cert_expires_at <= current_time OR no ACTIVE SkillCertification remains)"
        actor: system
        preconditions:
          - "current_time >= health_cert_expires_at OR personnel has zero ACTIVE SkillCertifications"
        side_effects:
          - "all DISPATCHED orders assigned to this personnel transition DISPATCHED→PENDING_DISPATCH (re-dispatch needed) with assigned_personnel_id=null and an AuditLogEntry kind=DISPATCH_EXPIRED is appended"
        note: "Cascade chain: recert sweep → personnel SUSPENDED → assigned DISPATCHED orders revert to PENDING_DISPATCH"

  - entity: SkillCertification
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dsd/certifications/{id}/approve"
        actor: PlatformOperator
        preconditions:
          - "training_hours >= 8"
          - "expires_at > current_time"
        side_effects:
          - "ServicePersonnel.skill_tags recomputed (add this skill_tag if not present)"
          - "certified_at = current_time"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /dsd/_sweep/recertification (system event when expires_at <= current_time)"
        actor: system
        preconditions:
          - "current_time >= expires_at"
        side_effects:
          - "ServicePersonnel.skill_tags recomputed (remove this skill_tag if no other ACTIVE cert for it remains)"
          - "If ServicePersonnel.skill_tags becomes empty AND ServicePersonnel.status==ACTIVE, the personnel transitions ACTIVE→SUSPENDED via the same sweep (see ServicePersonnel rules)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /dsd/certifications/{id}/revoke OR ServicePersonnel disqualification"
        actor: PlatformOperator | system
        preconditions:
          - "no precondition beyond cert being ACTIVE"
        side_effects:
          - "ServicePersonnel.skill_tags recomputed"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [REFUNDED, ACCEPTED_BY_CUSTOMER, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_DISPATCH
        trigger: "POST /dsd/orders/{id}/submit"
        actor: Customer
        preconditions:
          - "Customer.area_code IN ServiceItem.service_areas"
          - "ServiceItem.active == true"
          - "scheduled_start_at >= current_time + 1 hour"
          - "duration_hours >= ServiceItem.min_duration_hours"
        side_effects:
          - "compute Order.gross_price_cents = ServiceItem.base_price_cents * duration_hours"
      - from: PENDING_DISPATCH
        to: DISPATCHED
        trigger: "POST /dsd/orders/{id}/dispatch (system or operator)"
        actor: system | PlatformOperator
        preconditions:
          - "selector finds at least one eligible personnel per calculations.dispatch_selection"
        side_effects:
          - "assigned_personnel_id = selected personnel"
          - "dispatch_round += 1"
          - "dispatch_deadline_at = current_time + 15 minutes"
          - "ServicePersonnel.workload_active_orders += 1 for the selected personnel"
          - "append AuditLogEntry action_type=DISPATCH"
      - from: DISPATCHED
        to: ACCEPTED
        trigger: "POST /dsd/orders/{id}/accept"
        actor: ServicePersonnel
        preconditions:
          - "X-User-ID == Order.assigned_personnel_id"
          - "current_time < Order.dispatch_deadline_at"
        side_effects:
          - "dispatch_deadline_at unchanged (will be cleared by EXEC start)"
      - from: DISPATCHED
        to: PENDING_DISPATCH
        trigger: "POST /dsd/orders/{id}/reject"
        actor: ServicePersonnel
        preconditions:
          - "X-User-ID == Order.assigned_personnel_id"
        side_effects:
          - "ServicePersonnel.workload_active_orders −= 1 for previous assignee"
          - "previous personnel added to Order.exclusion_set in memory for the next dispatch selection"
          - "assigned_personnel_id = null"
          - "append AuditLogEntry action_type=DISPATCH_EXPIRED (rejected)"
      - from: DISPATCHED
        to: PENDING_DISPATCH
        trigger: "POST /dsd/_clock/advance (when current_time >= Order.dispatch_deadline_at)"
        actor: system
        preconditions:
          - "current_time >= Order.dispatch_deadline_at"
        side_effects:
          - "ServicePersonnel.workload_active_orders −= 1 for previous assignee"
          - "assigned_personnel_id = null"
          - "append AuditLogEntry action_type=DISPATCH_EXPIRED"
      - from: PENDING_DISPATCH
        to: DISPATCHED
        trigger: "POST /dsd/orders/{id}/reassign (manual operator override)"
        actor: PlatformOperator
        preconditions:
          - "request body specifies a personnel_id that passes the eligibility filter in calculations.dispatch_selection"
        side_effects:
          - "assigned_personnel_id = body.personnel_id"
          - "dispatch_round += 1"
          - "dispatch_deadline_at = current_time + 15 minutes"
          - "ServicePersonnel.workload_active_orders += 1 for the selected personnel"
          - "append AuditLogEntry action_type=REASSIGN"
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /dsd/orders/{id}/checkin"
        actor: ServicePersonnel
        preconditions:
          - "X-User-ID == Order.assigned_personnel_id"
          - "checkin_face_passed == true"
          - "haversine(checkin_lat,checkin_lng, Customer.address_lat,Customer.address_lng) <= 0.2 km"
          - "current_time >= Order.scheduled_start_at − 15 minutes"
        side_effects:
          - "create ServiceExecution row with checkin_at = current_time"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /dsd/orders/{id}/complete"
        actor: ServicePersonnel
        preconditions:
          - "X-User-ID == Order.assigned_personnel_id"
          - "ServiceExecution exists and procedure_checklist all true"
          - "before_photo_url and after_photo_url both non-null"
        side_effects:
          - "Order.completed_at = current_time"
          - "ServiceExecution.completion_submitted_at = current_time"
          - "post a provisional SettlementLedgerEntry (kind=COMMISSION, withheld_until=current_time + 72h) for the assigned personnel"
      - from: COMPLETED
        to: ACCEPTED_BY_CUSTOMER
        trigger: "POST /dsd/orders/{id}/customer-accept"
        actor: Customer
        preconditions:
          - "X-User-ID == Order.customer_id"
        side_effects:
          - "Order.accepted_at = current_time"
          - "ServicePersonnel.workload_active_orders −= 1 for the assigned personnel"
          - "RecurringOrder.occurrences_generated unchanged (generation handled elsewhere)"
      - from: PENDING_DISPATCH
        to: CANCELLED
        trigger: "POST /dsd/orders/{id}/cancel"
        actor: Customer | PlatformOperator
        preconditions:
          - "current_time < Order.scheduled_start_at − 2 hours"
        side_effects:
          - "refund the gross_price_cents into Customer.wallet_credit_cents (+amount) — settlement invariant: no commission to reverse because none was posted in PENDING_DISPATCH"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /dsd/orders/{id}/cancel"
        actor: Customer | PlatformOperator
        preconditions:
          - "current_time < Order.scheduled_start_at − 2 hours"
        side_effects:
          - "ServicePersonnel.workload_active_orders −= 1 for the assigned personnel"
          - "refund the gross_price_cents into Customer.wallet_credit_cents"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /dsd/orders/{id}/cancel"
        actor: Customer | PlatformOperator
        preconditions:
          - "current_time < Order.scheduled_start_at − 2 hours"
        side_effects:
          - "ServicePersonnel.workload_active_orders −= 1"
          - "refund the gross_price_cents into Customer.wallet_credit_cents"
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /dsd/orders/{id}/refund"
        actor: PlatformOperator
        preconditions:
          - "Order.status == COMPLETED (not yet ACCEPTED_BY_CUSTOMER)"
          - "current_time < Order.completed_at + 72 hours (complaint period)"
        side_effects:
          - "post compensating SettlementLedgerEntry kind=REVERSAL for the personnel cancelling the prior COMMISSION (amount equal and negative)"
          - "refund the gross_price_cents into Customer.wallet_credit_cents"
          - "ServicePersonnel.workload_active_orders −= 1 for the assigned personnel"
          - "set Order.refunded_at = current_time"
        note: "Compensating invariant: sum of (COMMISSION + REVERSAL) ledger entries for this order is exactly 0 cents after refund."

  - entity: InsuranceClaim
    initial_state: REPORTED
    terminal_states: [ARCHIVED]
    transitions:
      - from: REPORTED
        to: EVIDENCE_PENDING
        trigger: "POST /dsd/claims/{id}/request-evidence"
        actor: PlatformOperator
        preconditions: []
        side_effects:
          - "append AuditLogEntry action_type=CLAIM_REPORTED"
      - from: EVIDENCE_PENDING
        to: FILED
        trigger: "POST /dsd/claims/{id}/file"
        actor: PlatformOperator
        preconditions:
          - "evidence_count >= 2"
        side_effects:
          - "append AuditLogEntry action_type=CLAIM_FILED"
          - "emit external event to insurance-company system (event-driven sync)"
      - from: FILED
        to: APPROVED
        trigger: "POST /dsd/_events/insurance-decision (body.decision=APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "set paid_amount_cents = body.amount_cents"
          - "append AuditLogEntry action_type=CLAIM_APPROVED"
      - from: FILED
        to: REJECTED
        trigger: "POST /dsd/_events/insurance-decision (body.decision=REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "set paid_amount_cents = 0"
          - "append AuditLogEntry action_type=CLAIM_REJECTED"
      - from: APPROVED
        to: PAID
        trigger: "POST /dsd/claims/{id}/mark-paid"
        actor: PlatformOperator
        preconditions:
          - "paid_amount_cents > 0"
        side_effects:
          - "append AuditLogEntry action_type=CLAIM_PAID"
      - from: PAID
        to: ARCHIVED
        trigger: "POST /dsd/claims/{id}/archive"
        actor: PlatformOperator
        preconditions: []
        side_effects:
          - "no further mutations allowed"
      - from: REJECTED
        to: ARCHIVED
        trigger: "POST /dsd/claims/{id}/archive"
        actor: PlatformOperator
        preconditions: []
        side_effects:
          - "no further mutations allowed"

  - entity: OrderRating
    initial_state: NONE
    terminal_states: [CLOSED]
    transitions:
      - from: NONE
        to: OPEN
        trigger: "POST /dsd/orders/{id}/rate (when calculations.rating_composite < 3.0)"
        actor: system
        preconditions:
          - "Order.status == ACCEPTED_BY_CUSTOMER"
          - "OrderRating does not yet exist for this order"
          - "computed composite_score < 3.0"
        side_effects:
          - "Order.rated = true"
          - "ServicePersonnel.rating_score recomputed (calculations.personnel_rating_score)"
          - "ServicePersonnel.tier recomputed (calculations.performance_tier)"
          - "investigation_status = OPEN"
      - from: NONE
        to: CLOSED
        trigger: "POST /dsd/orders/{id}/rate (when calculations.rating_composite >= 3.0)"
        actor: system
        preconditions:
          - "Order.status == ACCEPTED_BY_CUSTOMER"
          - "OrderRating does not yet exist for this order"
          - "computed composite_score >= 3.0"
        side_effects:
          - "Order.rated = true"
          - "ServicePersonnel.rating_score recomputed"
          - "ServicePersonnel.tier recomputed"
          - "investigation_status = NONE (stays NONE)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /dsd/ratings/{id}/close-investigation"
        actor: PlatformOperator
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two personnel try to accept the same DISPATCHED order simultaneously"
    guarantee: "At most one acceptance succeeds; loser is rejected because the order is no longer DISPATCHED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status transition DISPATCHED→ACCEPTED"

  - scenario: "Operator reassigns while assigned personnel accepts simultaneously"
    guarantee: "Exactly one wins; the reassign loses if accept fired first (state already ACCEPTED), and accept loses if reassign fired first (assigned_personnel_id changed)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.assigned_personnel_id"

  - scenario: "Customer cancels while personnel checks in simultaneously"
    guarantee: "Exactly one operation succeeds; the loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Order.status"

  - scenario: "Two clients post the same rating for the same order"
    guarantee: "At most one OrderRating exists per order"
    error_id: ERR_RATING_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on OrderRating.order_id uniqueness"

  - scenario: "Two ServiceExecution rows created for the same Order"
    guarantee: "At most one execution per order"
    error_id: ERR_EXECUTION_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on ServiceExecution.order_id uniqueness"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_gross_price
    trigger: "Order DRAFT→PENDING_DISPATCH (POST /dsd/orders/{id}/submit)"
    algorithm: aggregation
    formula: |
      gross_price_cents = ServiceItem.base_price_cents * duration_hours
      # duration_hours is always a multiple of 0.5; base_price_cents is integer;
      # therefore gross_price_cents is always integer (no rounding ambiguity).
    input_set: "Single Order row"
    constants: {}
    precision: "integer cents, no rounding"

  - name: dispatch_selection
    trigger: "Order PENDING_DISPATCH→DISPATCHED (POST /dsd/orders/{id}/dispatch)"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — Eligibility filter (deterministic predicate over ServicePersonnel):
      eligible = { p in ServicePersonnel WHERE
        p.status == ACTIVE
        AND p.id NOT IN order.exclusion_set
        AND ServiceItem.required_skill_tag IN p.skill_tags   (active skills only)
        AND p.health_cert_expires_at > current_time
        AND haversine(p.service_lat,p.service_lng, Customer.address_lat,Customer.address_lng) <= p.service_radius_km
        AND p.workload_active_orders < 5
        AND (Customer.pref_gender IS NULL OR p.gender == Customer.pref_gender)
        AND (Customer.pref_min_age IS NULL OR p.age >= Customer.pref_min_age)
        AND (Customer.pref_max_age IS NULL OR p.age <= Customer.pref_max_age)
        AND (Customer.pref_language IS NULL OR Customer.pref_language IN p.languages)
      }
      # Step 2 — Ranking expression (sort key, descending priority for tier_priority, then for rating_score, ascending for distance):
      rank_key(p) = ( tier_priority(p.tier), p.rating_score, -distance_km(p, Customer) )
      where tier_priority(PLATINUM)=4, GOLD=3, SILVER=2, BRONZE=1
      # Step 3 — Tie-break: ASCII ordering of ServicePersonnel.id (stable)
      # Step 4 — Empty-pool fallback: error ERR_NO_ELIGIBLE_PERSONNEL
      result = first element of eligible sorted by rank_key descending (tie-broken by ServicePersonnel.id ascending)
    input_set: "ServicePersonnel set filtered by eligibility predicate above"
    constants:
      MAX_WORKLOAD: 5
    precision: "integer count comparisons; distance in km to 6 decimal places"

  - name: rating_composite
    trigger: "POST /dsd/orders/{id}/rate"
    algorithm: weighted_scoring
    formula: |
      composite_score = round(0.5 * quality_score + 0.3 * punctuality_score + 0.2 * attitude_score, 4)
    input_set: "Single OrderRating record"
    constants:
      WEIGHT_QUALITY: 0.5
      WEIGHT_PUNCTUALITY: 0.3
      WEIGHT_ATTITUDE: 0.2
    precision: "4 decimal places, round_half_up"

  - name: personnel_rating_score
    trigger: "OrderRating create (POST /dsd/orders/{id}/rate)"
    algorithm: aggregation
    formula: |
      # Incremental running average over ratings produced by orders in {ACCEPTED_BY_CUSTOMER}
      # Maintain ServicePersonnel.rating_count and rating_score using:
      new_rating_count = old_rating_count + 1
      new_rating_score = round((old_rating_score * old_rating_count + composite_score) / new_rating_count, 4)
    input_set: "All OrderRating rows whose Order.assigned_personnel_id == this personnel AND Order.status == ACCEPTED_BY_CUSTOMER"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: performance_tier
    trigger: "Recomputed on every personnel_rating_score update or activation/reinstatement"
    algorithm: threshold
    formula: |
      if rating_count < 5:           tier = BRONZE     # insufficient sample
      elif rating_score >= 4.8:      tier = PLATINUM
      elif rating_score >= 4.5:      tier = GOLD
      elif rating_score >= 4.0:      tier = SILVER
      else:                          tier = BRONZE
      # Boundary precision: >= not >
    input_set: "Single ServicePersonnel rating_score and rating_count"
    constants:
      MIN_SAMPLE_COUNT: 5
      PLATINUM_FLOOR: 4.8
      GOLD_FLOOR: 4.5
      SILVER_FLOOR: 4.0
    precision: "4 decimal compare against floors"

  - name: commission_estimate_vs_final
    trigger: "POST /dsd/orders/{id}/complete (estimate) AND POST /dsd/orders/{id}/customer-accept (final)"
    algorithm: forward_looking
    formula: |
      # Provisional (estimate) commission (posted at COMPLETED):
      provisional_commission_cents = round_half_up(gross_price_cents * 0.70, 0)   # integer cents

      # Final (chronological) commission (recomputed at ACCEPTED_BY_CUSTOMER):
      bonus_rate_at_completion = tier_bonus_rate(ServicePersonnel.tier AT Order.completed_at)
      bonus_rate_at_acceptance = tier_bonus_rate(ServicePersonnel.tier AT Order.accepted_at)
      # If a low rating between COMPLETED and ACCEPTED_BY_CUSTOMER drops the tier, the two diverge.
      final_commission_cents = round_half_up(gross_price_cents * 0.70 * (1 + bonus_rate_at_acceptance), 0)
      delta_cents = final_commission_cents - provisional_commission_cents   # posted as BONUS or REVERSAL entry on customer-accept
    input_set: "Single Order plus the ServicePersonnel.tier value at two distinct timestamps"
    constants:
      BASE_COMMISSION_RATE: 0.70
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "Order moves DRAFT-tree forward and lands in COMPLETED state"
        difference: "Computed using the tier value as observed at Order.completed_at. Posted as COMMISSION with withheld_until = completed_at + 72h."
      - name: final
        when: "Order moves COMPLETED→ACCEPTED_BY_CUSTOMER"
        difference: "Recomputed using the tier value as observed at Order.accepted_at. The delta is posted as a BONUS ledger entry (positive) or REVERSAL (negative). Provisional + delta == final."

  - name: tier_bonus_rate
    trigger: "Looked up by commission_estimate_vs_final"
    algorithm: threshold
    formula: |
      if tier == PLATINUM: rate = 0.20
      elif tier == GOLD:   rate = 0.10
      elif tier == SILVER: rate = 0.05
      else:                rate = 0.00
    input_set: "Single ServicePersonnel.tier value"
    constants:
      PLATINUM_BONUS_RATE: 0.20
      GOLD_BONUS_RATE: 0.10
      SILVER_BONUS_RATE: 0.05
    precision: "rate is a fixed decimal multiplier"

  - name: settlement_cycle_payout
    trigger: "POST /dsd/_sweep/settlement (when sweep advances and current_time >= entry.withheld_until)"
    algorithm: chronological
    formula: |
      # For each personnel and each cycle_id, walk SettlementLedgerEntry rows ORDER BY posted_at ASC, then by id ASC (tie-break).
      # Eligible entries for payout: kind IN {COMMISSION, BONUS, REVERSAL} AND (withheld_until IS NULL OR withheld_until <= current_time).
      # Pre-tax_sum = sum(amount_cents of eligible entries)                # may be negative; floored at 0
      payout_base_cents = max(0, pre_tax_sum)
      tax_cents = round_half_up(payout_base_cents * TAX_RATE, 0)            # WITHHOLD tax per entry then sum vs SUM then round —
                                                                            # this scaffold pins SUM-THEN-ROUND for tax.
      payout_cents = payout_base_cents - tax_cents
      # Post one TAX entry (negative) and one PAYOUT entry (negative) for the cycle.
    input_set: "All SettlementLedgerEntry rows for one personnel and one cycle_id where eligibility above holds"
    constants:
      TAX_RATE: 0.10
    precision: "integer cents, sum-then-round for tax"
    variants:
      - name: standard_payout
        when: "All withheld_until timestamps are <= current_time"
        difference: "All accumulated COMMISSION/BONUS/REVERSAL entries enter the sweep."
      - name: held_back_payout
        when: "Some COMMISSION entries are still inside their 72h complaint window"
        difference: "Those entries are excluded from pre_tax_sum and roll into the next sweep; payout reflects only released entries."

  - name: claim_payout_tracking
    trigger: "POST /dsd/_events/insurance-decision (sets paid_amount_cents)"
    algorithm: aggregation
    formula: |
      # Per personnel, lifetime claim summary:
      personnel_claim_paid_total = sum(InsuranceClaim.paid_amount_cents WHERE claim_type=ON_JOB_INJURY AND Order.assigned_personnel_id == personnel.id AND status IN {APPROVED, PAID, ARCHIVED})
      customer_claim_paid_total  = sum(InsuranceClaim.paid_amount_cents WHERE claim_type=PROPERTY_DAMAGE AND Order.customer_id == customer.id AND status IN {APPROVED, PAID, ARCHIVED})
    input_set: "InsuranceClaim rows linked via Order"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and matches one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except /dsd/_clock/advance and /dsd/_sweep/*"

  - priority: 2
    category: auth
    check: "Role permitted for the requested endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path parameters resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all GET/PATCH/POST on /{id} routes"

  - priority: 4
    category: state
    check: "Order is in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all Order action endpoints"

  - priority: 4
    category: state
    check: "InsuranceClaim is in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all claim action endpoints"

  - priority: 4
    category: state
    check: "ServicePersonnel is in a valid source state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all personnel action endpoints"

  - priority: 5
    category: business_safety
    check: "Order.assigned_personnel_id == X-User-ID for personnel acting on the order (accept/reject/checkin/complete)"
    error_id: ERR_NOT_ASSIGNED
    http_status: 403
    applies_to: "personnel-acting endpoints"

  - priority: 5
    category: business_safety
    check: "On check-in: checkin_face_passed == true AND haversine to Customer.address <= 0.2 km"
    error_id: ERR_CHECKIN_LOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/checkin"

  - priority: 6
    category: business_referential
    check: "Customer.area_code IN ServiceItem.service_areas at submit time"
    error_id: ERR_AREA_NOT_SERVICED
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/submit, POST /dsd/orders, POST /dsd/recurring-orders"

  - priority: 6
    category: business_referential
    check: "ServiceItem.active == true at submit time"
    error_id: ERR_ITEM_INACTIVE
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/submit, POST /dsd/orders, POST /dsd/recurring-orders"

  - priority: 7
    category: business_temporal
    check: "Order.scheduled_start_at >= current_time + 1 hour at submit"
    error_id: ERR_LEAD_TIME_TOO_SHORT
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/submit, POST /dsd/orders, POST /dsd/recurring-orders"

  - priority: 7
    category: business_temporal
    check: "Cancellation requested with current_time < Order.scheduled_start_at − 2 hours"
    error_id: ERR_CANCEL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/cancel"

  - priority: 7
    category: business_temporal
    check: "Order modification requested with current_time < Order.scheduled_start_at − 12 hours AND Order.status == PENDING_DISPATCH"
    error_id: ERR_MODIFY_WINDOW_CLOSED
    http_status: 422
    applies_to: "PATCH /dsd/orders/{id}"

  - priority: 7
    category: business_temporal
    check: "Refund requested with current_time < Order.completed_at + 72 hours and Order.status == COMPLETED (complaint period still open)"
    error_id: ERR_COMPLAINT_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/refund"

  - priority: 7
    category: business_temporal
    check: "Accept requested with current_time < Order.dispatch_deadline_at"
    error_id: ERR_DISPATCH_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/accept"

  - priority: 8
    category: business_constraint
    check: "On dispatch: at least one eligible personnel exists per calculations.dispatch_selection"
    error_id: ERR_NO_ELIGIBLE_PERSONNEL
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/dispatch, POST /dsd/orders/{id}/reassign"

  - priority: 8
    category: business_constraint
    check: "On personnel disqualify/suspend: no active assignments in {DISPATCHED, ACCEPTED, IN_PROGRESS}"
    error_id: ERR_HAS_ACTIVE_ASSIGNMENTS
    http_status: 422
    applies_to: "POST /dsd/personnel/{id}/disqualify, POST /dsd/personnel/{id}/suspend"

  - priority: 8
    category: business_constraint
    check: "On complete: ServiceExecution.procedure_checklist all true AND before/after photos non-null"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/complete"

  - priority: 8
    category: business_constraint
    check: "On rating create: Order.status == ACCEPTED_BY_CUSTOMER"
    error_id: ERR_RATING_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/rate"

  - priority: 8
    category: business_constraint
    check: "Rating scores quality/punctuality/attitude each in [1,5]"
    error_id: ERR_RATING_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/rate"

  - priority: 8
    category: business_constraint
    check: "Cert approval: training_hours >= 8 and expires_at > current_time"
    error_id: ERR_CERT_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /dsd/certifications/{id}/approve"

  - priority: 8
    category: business_constraint
    check: "Claim file: evidence_count >= 2"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "POST /dsd/claims/{id}/file"

  - priority: 9
    category: business_fiscal
    check: "Reassign body specifies a personnel_id passing the eligibility predicate"
    error_id: ERR_PERSONNEL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /dsd/orders/{id}/reassign"

  - priority: 9
    category: business_fiscal
    check: "OCC: If body.version is present it must equal entity.version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT endpoints"

  - priority: 10
    category: business_constraint
    check: "OrderRating uniqueness: only one rating per order"
    error_id: ERR_RATING_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /dsd/orders/{id}/rate"

  - priority: 10
    category: business_constraint
    check: "ServiceExecution uniqueness: only one execution per order"
    error_id: ERR_EXECUTION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /dsd/orders/{id}/checkin"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- ServicePersonnel ----------
  - method: POST
    path: "/dsd/personnel"
    description: "Create a new personnel profile (status starts PENDING_VERIFICATION)"
    roles: [PlatformOperator]
    code: 201
    input: [full_name, gender, age, languages, service_lat, service_lng, service_radius_km, health_cert_expires_at]
    output: ServicePersonnel
    side_effects: []

  - method: GET
    path: "/dsd/personnel/{id}"
    description: "Read a personnel record"
    roles: [PlatformOperator, ServicePersonnel, Customer]
    code: 200
    input: []
    output: ServicePersonnel
    side_effects: []

  - method: GET
    path: "/dsd/personnel"
    description: "List personnel; supports filter by status, skill_tag, tier and pagination"
    roles: [PlatformOperator]
    code: 200
    input: ["status?", "skill_tag?", "tier?", "limit?", "offset?"]
    output: "ServicePersonnel[]"
    side_effects: []

  - method: POST
    path: "/dsd/personnel/{id}/verify-identity"
    description: "Mark identity_verified=true for a personnel"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: ServicePersonnel
    side_effects: []

  - method: POST
    path: "/dsd/personnel/{id}/activate"
    description: "PENDING_VERIFICATION → ACTIVE"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: ServicePersonnel
    side_effects: [tier_recomputed]

  - method: POST
    path: "/dsd/personnel/{id}/suspend"
    description: "ACTIVE → SUSPENDED"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: ServicePersonnel
    side_effects: []

  - method: POST
    path: "/dsd/personnel/{id}/reinstate"
    description: "SUSPENDED → ACTIVE"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: ServicePersonnel
    side_effects: [tier_recomputed]

  - method: POST
    path: "/dsd/personnel/{id}/disqualify"
    description: "ACTIVE → DISQUALIFIED; revokes all certifications"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: ServicePersonnel
    side_effects: [certifications_revoked]

  # ---------- SkillCertification ----------
  - method: POST
    path: "/dsd/certifications"
    description: "Create a SkillCertification (PENDING)"
    roles: [PlatformOperator]
    code: 201
    input: [personnel_id, skill_tag, training_hours, expires_at]
    output: SkillCertification
    side_effects: []

  - method: POST
    path: "/dsd/certifications/{id}/approve"
    description: "PENDING → ACTIVE"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: SkillCertification
    side_effects: [personnel_skill_tags_refreshed]

  - method: POST
    path: "/dsd/certifications/{id}/revoke"
    description: "ACTIVE → REVOKED"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: SkillCertification
    side_effects: [personnel_skill_tags_refreshed]

  - method: GET
    path: "/dsd/personnel/{id}/certifications"
    description: "List certifications for a personnel"
    roles: [PlatformOperator, ServicePersonnel]
    code: 200
    input: ["limit?", "offset?"]
    output: "SkillCertification[]"
    side_effects: []

  # ---------- ServiceItem ----------
  - method: POST
    path: "/dsd/service-items"
    description: "Create a service item"
    roles: [PlatformOperator]
    code: 201
    input: [name, required_skill_tag, base_price_cents, min_duration_hours, service_areas]
    output: ServiceItem
    side_effects: []

  - method: GET
    path: "/dsd/service-items"
    description: "List service items; supports filter by area_code, active"
    roles: [PlatformOperator, Customer]
    code: 200
    input: ["area_code?", "active?", "limit?", "offset?"]
    output: "ServiceItem[]"
    side_effects: []

  - method: PATCH
    path: "/dsd/service-items/{id}"
    description: "Update mutable fields (price, areas, active)"
    roles: [PlatformOperator]
    code: 200
    input: ["base_price_cents?", "service_areas?", "active?", "version?"]
    output: ServiceItem
    side_effects: []

  # ---------- Customer ----------
  - method: POST
    path: "/dsd/customers"
    description: "Create a customer profile"
    roles: [PlatformOperator]
    code: 201
    input: [full_name, area_code, address_lat, address_lng, pref_gender, pref_min_age, pref_max_age, pref_language]
    output: Customer
    side_effects: []

  - method: GET
    path: "/dsd/customers/{id}"
    description: "Read a customer profile"
    roles: [PlatformOperator, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---------- Order ----------
  - method: POST
    path: "/dsd/orders"
    description: "Create an order in DRAFT state"
    roles: [Customer, PlatformOperator]
    code: 201
    input: [customer_id, service_item_id, mode, scheduled_start_at, duration_hours]
    output: Order
    side_effects: []

  - method: PATCH
    path: "/dsd/orders/{id}"
    description: "Modify a PENDING_DISPATCH order within the modification window (>=12h before start)"
    roles: [Customer, PlatformOperator]
    code: 200
    input: ["scheduled_start_at?", "duration_hours?", "version?"]
    output: Order
    side_effects: [gross_price_recomputed]

  - method: POST
    path: "/dsd/orders/{id}/submit"
    description: "DRAFT → PENDING_DISPATCH"
    roles: [Customer, PlatformOperator]
    code: 200
    input: []
    output: Order
    side_effects: [gross_price_computed]

  - method: POST
    path: "/dsd/orders/{id}/dispatch"
    description: "PENDING_DISPATCH → DISPATCHED via dispatch_selection"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: Order
    side_effects: [personnel_workload_incremented, audit_log_dispatch]

  - method: POST
    path: "/dsd/orders/{id}/reassign"
    description: "Manual reassignment; body must specify personnel_id"
    roles: [PlatformOperator]
    code: 200
    input: [personnel_id]
    output: Order
    side_effects: [personnel_workload_incremented, audit_log_reassign]

  - method: POST
    path: "/dsd/orders/{id}/accept"
    description: "Assigned personnel accepts; DISPATCHED → ACCEPTED"
    roles: [ServicePersonnel]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/dsd/orders/{id}/reject"
    description: "Assigned personnel rejects; DISPATCHED → PENDING_DISPATCH (with exclusion)"
    roles: [ServicePersonnel]
    code: 200
    input: []
    output: Order
    side_effects: [personnel_workload_decremented, audit_log_dispatch_expired]

  - method: POST
    path: "/dsd/orders/{id}/checkin"
    description: "ACCEPTED → IN_PROGRESS; creates ServiceExecution"
    roles: [ServicePersonnel]
    code: 200
    input: [checkin_lat, checkin_lng, checkin_face_passed]
    output: Order
    side_effects: [service_execution_created]

  - method: PATCH
    path: "/dsd/orders/{id}/execution"
    description: "Update procedure_checklist, before/after photo URLs on the ServiceExecution"
    roles: [ServicePersonnel]
    code: 200
    input: ["procedure_checklist?", "before_photo_url?", "after_photo_url?"]
    output: ServiceExecution
    side_effects: []

  - method: POST
    path: "/dsd/orders/{id}/complete"
    description: "IN_PROGRESS → COMPLETED; posts provisional commission"
    roles: [ServicePersonnel]
    code: 200
    input: []
    output: Order
    side_effects: [settlement_entry_provisional_commission]

  - method: POST
    path: "/dsd/orders/{id}/customer-accept"
    description: "COMPLETED → ACCEPTED_BY_CUSTOMER; finalizes commission"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: [settlement_entry_final_commission_delta, personnel_workload_decremented]

  - method: POST
    path: "/dsd/orders/{id}/cancel"
    description: "Cancel before scheduled_start_at − 2h"
    roles: [Customer, PlatformOperator]
    code: 200
    input: []
    output: Order
    side_effects: [refund_to_customer_wallet, personnel_workload_decremented_if_assigned]

  - method: POST
    path: "/dsd/orders/{id}/refund"
    description: "Operator refund after completion within complaint window"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: Order
    side_effects: [settlement_entry_reversal, refund_to_customer_wallet]

  - method: GET
    path: "/dsd/orders/{id}"
    description: "Read an order"
    roles: [Customer, ServicePersonnel, PlatformOperator]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/dsd/orders"
    description: "List orders; supports filter by customer_id, assigned_personnel_id, status, pagination"
    roles: [Customer, ServicePersonnel, PlatformOperator]
    code: 200
    input: ["customer_id?", "assigned_personnel_id?", "status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  # ---------- RecurringOrder ----------
  - method: POST
    path: "/dsd/recurring-orders"
    description: "Create a recurring order (status ACTIVE); generates first Order child"
    roles: [Customer, PlatformOperator]
    code: 201
    input: [customer_id, service_item_id, cadence_days, first_start_at, duration_hours]
    output: RecurringOrder
    side_effects: [first_order_materialized]

  - method: POST
    path: "/dsd/recurring-orders/{id}/pause"
    description: "ACTIVE → PAUSED"
    roles: [Customer, PlatformOperator]
    code: 200
    input: []
    output: RecurringOrder
    side_effects: []

  - method: POST
    path: "/dsd/recurring-orders/{id}/resume"
    description: "PAUSED → ACTIVE"
    roles: [Customer, PlatformOperator]
    code: 200
    input: []
    output: RecurringOrder
    side_effects: []

  - method: POST
    path: "/dsd/recurring-orders/{id}/terminate"
    description: "* → TERMINATED"
    roles: [Customer, PlatformOperator]
    code: 200
    input: []
    output: RecurringOrder
    side_effects: []

  # ---------- AbnormalEvent ----------
  - method: POST
    path: "/dsd/orders/{id}/abnormal-events"
    description: "Report an abnormal event for an order"
    roles: [Customer, ServicePersonnel, PlatformOperator]
    code: 201
    input: [category, description]
    output: AbnormalEvent
    side_effects: [insurance_claim_opened_if_injury_or_property_damage]

  # ---------- OrderRating ----------
  - method: POST
    path: "/dsd/orders/{id}/rate"
    description: "Submit a multi-dimensional rating after customer-accept"
    roles: [Customer]
    code: 201
    input: [quality_score, punctuality_score, attitude_score, text_review, anonymous]
    output: OrderRating
    side_effects: [composite_score_computed, personnel_rating_score_recomputed, personnel_tier_recomputed, investigation_opened_if_low]

  - method: POST
    path: "/dsd/ratings/{id}/close-investigation"
    description: "Close a low-rating investigation"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: OrderRating
    side_effects: []

  # ---------- Insurance Claims ----------
  - method: GET
    path: "/dsd/claims/{id}"
    description: "Read a claim"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/dsd/claims/{id}/evidence"
    description: "Attach evidence to a claim; increments evidence_count"
    roles: [PlatformOperator]
    code: 200
    input: [evidence_url, description]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/dsd/claims/{id}/request-evidence"
    description: "REPORTED → EVIDENCE_PENDING"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: [audit_log_claim_reported]

  - method: POST
    path: "/dsd/claims/{id}/file"
    description: "EVIDENCE_PENDING → FILED (emits external sync event)"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: [audit_log_claim_filed, external_event_emitted]

  - method: POST
    path: "/dsd/claims/{id}/mark-paid"
    description: "APPROVED → PAID"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: [audit_log_claim_paid]

  - method: POST
    path: "/dsd/claims/{id}/archive"
    description: "PAID or REJECTED → ARCHIVED"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  # ---------- AuditLog ----------
  - method: GET
    path: "/dsd/audit-logs"
    description: "List audit log entries; filter by subject_type, subject_id, action_type, pagination"
    roles: [PlatformOperator]
    code: 200
    input: ["subject_type?", "subject_id?", "action_type?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

  # ---------- Settlement ----------
  - method: GET
    path: "/dsd/personnel/{id}/settlement"
    description: "List SettlementLedgerEntry rows for a personnel; filter by cycle_id"
    roles: [PlatformOperator, ServicePersonnel]
    code: 200
    input: ["cycle_id?", "limit?", "offset?"]
    output: "SettlementLedgerEntry[]"
    side_effects: []

  # ---------- Test-driving / system endpoints ----------
  - method: POST
    path: "/dsd/_clock/advance"
    description: "Test-driving endpoint to advance current_time by N seconds (drives time-gated transitions)"
    roles: [system]
    code: 200
    input: [seconds]
    output: null
    side_effects: [dispatch_deadline_expirations_evaluated]

  - method: POST
    path: "/dsd/_sweep/recertification"
    description: "Run recertification sweep: expire health cert, expire skill certs, cascade to personnel SUSPENDED, revert dispatched orders to PENDING_DISPATCH"
    roles: [system, PlatformOperator]
    code: 200
    input: []
    output: null
    side_effects: [certifications_expired, personnel_suspended, orders_reverted]

  - method: POST
    path: "/dsd/_sweep/settlement"
    description: "Run settlement sweep: post TAX and PAYOUT entries for the current cycle and personnel"
    roles: [system, PlatformOperator]
    code: 200
    input: [cycle_id]
    output: null
    side_effects: [tax_entries_posted, payout_entries_posted]

  - method: POST
    path: "/dsd/_events/insurance-decision"
    description: "Inbound webhook from insurance company: FILED → APPROVED|REJECTED"
    roles: [system]
    code: 200
    input: [claim_id, decision, amount_cents]
    output: InsuranceClaim
    side_effects: [audit_log_claim_approved_or_rejected]

  - method: POST
    path: "/dsd/_events/payment-received"
    description: "Inbound webhook from payment system; informational only — does not change Order state but records payment timestamp"
    roles: [system]
    code: 200
    input: [order_id, amount_cents]
    output: null
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced entity does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity is not in the source state required by the requested transition"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch on PATCH"

  - id: ERR_NOT_ASSIGNED
    http: 403
    condition: "Personnel acting on an order they are not assigned to"

  - id: ERR_CHECKIN_LOCATION_MISMATCH
    http: 422
    condition: "Face verification failed or check-in coordinates more than 0.2 km from customer address"

  - id: ERR_AREA_NOT_SERVICED
    http: 422
    condition: "Customer.area_code is not in ServiceItem.service_areas"

  - id: ERR_ITEM_INACTIVE
    http: 422
    condition: "ServiceItem.active == false at submit time"

  - id: ERR_LEAD_TIME_TOO_SHORT
    http: 422
    condition: "scheduled_start_at must be at least 1 hour in the future at submit"

  - id: ERR_CANCEL_WINDOW_CLOSED
    http: 422
    condition: "Cancellation requested less than 2 hours before scheduled_start_at"

  - id: ERR_MODIFY_WINDOW_CLOSED
    http: 422
    condition: "Modification requested less than 12 hours before scheduled_start_at"

  - id: ERR_COMPLAINT_PERIOD_EXPIRED
    http: 422
    condition: "Refund requested more than 72 hours after Order.completed_at"

  - id: ERR_DISPATCH_DEADLINE_PASSED
    http: 422
    condition: "Accept attempted after Order.dispatch_deadline_at"

  - id: ERR_NO_ELIGIBLE_PERSONNEL
    http: 422
    condition: "dispatch_selection found no eligible personnel"

  - id: ERR_HAS_ACTIVE_ASSIGNMENTS
    http: 422
    condition: "Cannot suspend/disqualify personnel while active assignments exist"

  - id: ERR_CHECKLIST_INCOMPLETE
    http: 422
    condition: "Procedure checklist or before/after photos incomplete"

  - id: ERR_RATING_NOT_ALLOWED
    http: 422
    condition: "Rating attempted when Order.status != ACCEPTED_BY_CUSTOMER"

  - id: ERR_RATING_OUT_OF_RANGE
    http: 422
    condition: "Rating dimension scores must be integers in [1,5]"

  - id: ERR_RATING_ALREADY_EXISTS
    http: 409
    condition: "An OrderRating already exists for this order"

  - id: ERR_EXECUTION_ALREADY_EXISTS
    http: 409
    condition: "A ServiceExecution already exists for this order"

  - id: ERR_CERT_REQUIREMENTS_NOT_MET
    http: 422
    condition: "Certification training_hours < 8 or expires_at <= current_time"

  - id: ERR_INSUFFICIENT_EVIDENCE
    http: 422
    condition: "Claim cannot be filed with fewer than 2 evidence items"

  - id: ERR_PERSONNEL_NOT_ELIGIBLE
    http: 422
    condition: "Manual reassignment target personnel does not satisfy the eligibility predicate"

  - id: ERR_VALIDATION_ERROR
    http: 422
    condition: "Generic request body validation failure (missing field, wrong type)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End consumer who books and rates services"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /dsd/orders/{id}/customer-accept"
      - "POST /dsd/orders/{id}/rate"
    shared_operations:
      - "POST /dsd/orders"
      - "PATCH /dsd/orders/{id}"
      - "POST /dsd/orders/{id}/submit"
      - "POST /dsd/orders/{id}/cancel"
      - "POST /dsd/recurring-orders"
      - "POST /dsd/recurring-orders/{id}/pause"
      - "POST /dsd/recurring-orders/{id}/resume"
      - "POST /dsd/recurring-orders/{id}/terminate"
      - "POST /dsd/orders/{id}/abnormal-events"
      - "GET /dsd/orders/{id}"
      - "GET /dsd/orders"
      - "GET /dsd/service-items"
      - "GET /dsd/customers/{id}"
      - "GET /dsd/personnel/{id}"

  - name: ServicePersonnel
    description: "Service personnel that accept and execute orders"
    identity: "entity_backed:ServicePersonnel"
    exclusive_operations:
      - "POST /dsd/orders/{id}/accept"
      - "POST /dsd/orders/{id}/reject"
      - "POST /dsd/orders/{id}/checkin"
      - "PATCH /dsd/orders/{id}/execution"
      - "POST /dsd/orders/{id}/complete"
    shared_operations:
      - "POST /dsd/orders/{id}/abnormal-events"
      - "GET /dsd/orders/{id}"
      - "GET /dsd/orders"
      - "GET /dsd/personnel/{id}"
      - "GET /dsd/personnel/{id}/certifications"
      - "GET /dsd/personnel/{id}/settlement"

  - name: PlatformOperator
    description: "Platform operations / dispatch / claim handler. Operates all administrative actions."
    identity: "opaque"
    exclusive_operations:
      - "POST /dsd/personnel"
      - "POST /dsd/personnel/{id}/verify-identity"
      - "POST /dsd/personnel/{id}/activate"
      - "POST /dsd/personnel/{id}/suspend"
      - "POST /dsd/personnel/{id}/reinstate"
      - "POST /dsd/personnel/{id}/disqualify"
      - "POST /dsd/certifications"
      - "POST /dsd/certifications/{id}/approve"
      - "POST /dsd/certifications/{id}/revoke"
      - "POST /dsd/service-items"
      - "PATCH /dsd/service-items/{id}"
      - "POST /dsd/customers"
      - "POST /dsd/orders/{id}/dispatch"
      - "POST /dsd/orders/{id}/reassign"
      - "POST /dsd/orders/{id}/refund"
      - "POST /dsd/ratings/{id}/close-investigation"
      - "GET /dsd/claims/{id}"
      - "POST /dsd/claims/{id}/evidence"
      - "POST /dsd/claims/{id}/request-evidence"
      - "POST /dsd/claims/{id}/file"
      - "POST /dsd/claims/{id}/mark-paid"
      - "POST /dsd/claims/{id}/archive"
      - "GET /dsd/audit-logs"
      - "POST /dsd/_sweep/recertification"
      - "POST /dsd/_sweep/settlement"
    shared_operations:
      - "POST /dsd/orders"
      - "PATCH /dsd/orders/{id}"
      - "POST /dsd/orders/{id}/submit"
      - "POST /dsd/orders/{id}/cancel"
      - "POST /dsd/recurring-orders"
      - "POST /dsd/recurring-orders/{id}/pause"
      - "POST /dsd/recurring-orders/{id}/resume"
      - "POST /dsd/recurring-orders/{id}/terminate"
      - "POST /dsd/orders/{id}/abnormal-events"
      - "GET /dsd/orders/{id}"
      - "GET /dsd/orders"
      - "GET /dsd/personnel"
      - "GET /dsd/personnel/{id}"
      - "GET /dsd/personnel/{id}/certifications"
      - "GET /dsd/personnel/{id}/settlement"
      - "GET /dsd/service-items"
      - "GET /dsd/customers/{id}"

  - name: system
    description: "Internal system actor for test-driving endpoints and external event webhooks"
    identity: "opaque"
    exclusive_operations:
      - "POST /dsd/_clock/advance"
      - "POST /dsd/_events/insurance-decision"
      - "POST /dsd/_events/payment-received"
    shared_operations:
      - "POST /dsd/_sweep/recertification"
      - "POST /dsd/_sweep/settlement"
