              as_user_id: "${fr_ms_id}"
              captures: { released_status: $.data.status }
          assert:
            - "Franchisee.${fr_ms_id}.active_brand_count == 2, which is at or above MULTI_BRAND_MIN of 2, so the 0.85 portfolio discount applies"
            - "the allocation reports lead_cost_cents == 3825"
            - "after allocation Franchisee.${fr_ms_id}.lead_cost_balance_cents == 3825"
            - "the release reports 200 and released_status == RELEASED"
            - "after release Franchisee.${fr_ms_id}.lead_cost_balance_cents == 0, exactly its pre-allocation value"
            - "Lead.${lead1_id}.lead_cost_cents == 0 after release"
            - "the invariant holds on the conserved quantity: lead_cost_balance_cents == (sum of lead_cost_cents over ALLOCATED leads) - (sum over released leads) == 0"

      - name: territory_award_and_reclaim_conserve_allocated_households
        grounds:
          - state_machines.Territory.OFFERED_to_AWARDED
          - state_machines.Territory.PENDING_REALLOCATION_to_RECLAIMED
          - entities.Franchisee.fields.allocated_households
          - entities.Territory.fields.allocated_households
        distinguishing_aspect: "Conserved quantity of a DIFFERENT type: a households-denominated STOCK reconciled to a set membership rule, not a cents flow. Franchisee.allocated_households is pinned as the sum of household_count over its territories in status IN {AWARDED, ACTIVE, EXPANSION_REQUESTED}, and award-then-reclaim returns it to its starting value."
