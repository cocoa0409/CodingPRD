      - name: cascading_side_effects_layer_corner
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: endorsement_issue_cascades_four_hops_to_new_tax_filing_lines
          rationale: "That instance walks the full four-hop chain end-to-end and its sibling security_decline_cascades_three_hops_to_white_list_removal walks a second, independently triggered chain; a corner duplicate would re-assert the same hops."

      - name: dual_variant_calculation_layer_corner
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: premium_tax_allocated_multi_versus_home_state_single_diverge
          rationale: "Both variant pairs — the two allocation methods and the initial-versus-recertification score — are exercised there and in market_security_score_initial_versus_recertification_diverge, including the delta between them."

      - name: placement_optimistic_concurrency_layer_corner
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: policy_issue_stale_version_pre_empts_state_check
          rationale: "The third concurrency rule, policy-create-stale-placement, is triggered there — including the version increment and the successful retry with a fresh placement version."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: one_request_returns_every_row_it_touched_already_updated
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.premium_tax_and_stamping_fee
          - state_machines.Policy.tax_status
        distinguishing_aspect: "There is no lag anywhere in the system: the single calculate-tax call answers with the policy's new tax_status and totals already in its own response body, and the three allocation rows plus three NEW_BUSINESS tax filing lines it created are readable on the very next request with no retry, no re-read delay and no reconciliation pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home ISSUED policy with tax_status UNCALCULATED, exposures TX/NV/CA each 300,000,000 and all three programs registered."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
          trigger:
            - *k_calc_tax
          assert:
            - "the calculate-tax response body itself reports tax_status CALCULATED, total_tax_cents 38779 and total_stamping_fee_cents 1127 — not the pre-call values"
