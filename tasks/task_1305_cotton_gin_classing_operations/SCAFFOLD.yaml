# =============================================================================
# SCAFFOLD — Cotton Gin & Classing Operations (Delta cotton gin co-op)
# =============================================================================

scenario: |
  Cotton Gin & Classing Operations (Delta cotton gin co-op): module receipt & grower ticket, gin turnout & lint/seed yield allocation, bale tagging & USDA classing result linkage, warehouse receipt & loan eligibility, seed sale proceeds credit to grower, ginning charge & patronage, quality discount/premium by grade, storage & shipping order

domain_name: cotton-gin-classing
api_prefix: /gin-ops

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation      # grower settlement: two algorithms (provisional vs final) over the same deliveries produce different net_payable
  secondary_archetype: pricing_engine           # tiered ginning charge, grade-based premium/discount points, storage free-day thresholds, loan-rate points
  complexity_layers:
    - optimistic_concurrency                    # OCC on Bale.version (classing supersede) and Grower.version (settlement supersede)
    - cascading_side_effects                    # complete-ginning -> module -> ledger entry -> grower balance; reclass -> bale -> draft settlement recompute
    - dual_variant_calculation                  # estimated vs reconciled seed yield; provisional vs final settlement
    - rate_threshold_triggers                   # moisture gate, ginning tier boundary, storage free-days, loan cap

  entity_topology: flat                         # peer entities with FK references; no nested URL ownership
  state_machine_shape: parallel                 # Bale carries classing_status x custody_status; WarehouseReceipt is cyclic; ModuleReceipt has a conditioning cycle
  relationship_patterns:
    - one_to_many                               # Grower -> ModuleReceipt -> Bale -> ClassingResult / WarehouseReceipt -> LoanPledge
    - cross_aggregate                           # ModuleReceipt -> GinShift; WarehouseReceipt -> Warehouse; Settlement/LedgerEntry -> Grower
  role_model: segregation_of_duties             # the user who ginned a module may not issue the warehouse receipt for its bales
  consistency_model: immediate                  # every mutation (including cascades) is visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: membership_number, type: string, source: input, description: "Co-op membership number; unique across all growers" }
      - { name: legal_name, type: string, source: input, description: "Grower legal name" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Read-only running balance = SUM(LedgerEntry.amount_cents) for this grower; starts at 0; every ledger posting recomputes it immediately" }
      - { name: patronage_rate, type: number, source: input, default: 0.20, description: "Patronage allocation rate applied to season ginning charges at settlement (fraction, e.g. 0.20)" }

  - name: GradeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: grade_code, type: string, source: input, description: "USDA grade code this row prices, e.g. \"41-4\"" }
      - { name: premium_discount_points, type: integer, source: input, description: "Signed quality adjustment in points (1 point = 1/100 cent per lb) applied to bales classed at this grade" }
      - { name: loan_rate_points, type: integer, source: input, description: "CCC loan rate in points (1/100 cent per lb) used to compute pledge principal at this grade" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive (date at 00:00:00Z)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive (half-open [effective_from, effective_to)); must be > effective_from" }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Warehouse name" }
      - { name: capacity_bales, type: integer, source: input, description: "Maximum bales physically stored; issuing a receipt when stored_bale_count == capacity_bales is rejected" }
      - { name: stored_bale_count, type: integer, source: computed, default: 0, description: "Read-only count of WarehouseReceipts for this warehouse with status IN {ACTIVE, PLEDGED, RELEASED}" }
      - { name: dock_count, type: integer, source: input, description: "Number of loading docks; dock_number on a ShippingOrder must be in [1, dock_count]" }

  - name: GinShift
    parent: null
    common_fields: true
    fields:
      - { name: season, type: string, source: input, description: "Marketing season label, e.g. \"2026\"; modules may only queue into a shift of the same season" }
      - { name: stand_label, type: string, source: input, description: "Gin stand identifier label" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED -> RECONCILED" }
      - { name: actual_lint_scale_lbs, type: integer, source: input, description: "Total lint scale weight for the shift, supplied at close" }
      - { name: actual_seed_scale_lbs, type: integer, source: input, description: "Total seed scale weight for the shift, supplied at close" }
      - { name: waste_lbs, type: integer, source: input, description: "Total waste/motes weight for the shift, supplied at close" }

  - name: ModuleReceipt
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; delivering grower" }
      - { name: season, type: string, source: input, description: "Marketing season label, e.g. \"2026\"" }
      - { name: ticket_number, type: string, source: input, description: "Grower ticket number; unique per (grower_id, season)" }
      - { name: module_tag, type: string, source: input, description: "Physical module tag; unique per season across all growers" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Scale gross weight of the module truck" }
      - { name: tare_weight_lbs, type: integer, source: input, description: "Scale tare weight of the module truck" }
      - { name: net_weight_lbs, type: integer, source: computed, description: "Read-only = gross_weight_lbs - tare_weight_lbs; input value ignored" }
      - { name: moisture_pct, type: number, source: input, description: "Latest moisture reading in percent; updated by /condition; must be <= 12.0 to queue" }
      - { name: foreign_matter_pct, type: number, source: input, description: "Foreign matter percent at receipt; > 10.0 is rejected at create (contamination safety)" }
      - { name: gin_shift_id, type: string, source: system, description: "FK -> GinShift.id; null until queued; set by /queue" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> CONDITIONING -> RECEIVED cycle -> QUEUED -> GINNING -> GINNED; RECEIVED/CONDITIONING -> REJECTED" }
      - { name: est_lint_lbs, type: integer, source: computed, description: "Estimated lint per estimated_turnout rule; recomputed on create and on every /condition" }
      - { name: est_seed_lbs, type: integer, source: computed, description: "Estimated seed = round_half_up(net_weight_lbs * 0.55)" }
      - { name: actual_lint_lbs, type: integer, source: computed, description: "Read-only = SUM(net_weight_lbs of Bales created by complete-ginning); 0 until GINNED" }
      - { name: reconciled_seed_lbs, type: integer, source: system, description: "Seed lbs allocated by shift mass-balance reconciliation; null until shift RECONCILED" }
      - { name: ginned_at, type: datetime, source: system, description: "Server timestamp of the GINNING -> GINNED transition; null until ginned" }
      - { name: ginned_by_user_id, type: string, source: system, description: "X-User-ID of the GinOperator who ran complete-ginning; used by the segregation-of-duties check at receipt issue; null until ginned" }

  - name: Bale
    parent: null
    common_fields: true
    fields:
      - { name: module_id, type: string, source: system, description: "FK -> ModuleReceipt.id; set at complete-ginning" }
      - { name: bale_tag, type: string, source: input, description: "Permanent bale tag; globally unique" }
      - { name: net_weight_lbs, type: integer, source: input, description: "Actual lint scale weight of this bale, supplied at complete-ginning; must be >= 1" }
      - { name: classing_status, type: enum, source: system, description: "Parallel dimension 1: UNCLASSED -> CLASSED (reclass is a CLASSED -> CLASSED self-loop that supersedes the prior result)" }
      - { name: custody_status, type: enum, source: system, description: "Parallel dimension 2: ON_GIN_FLOOR -> WAREHOUSED -> SHIPPED; WAREHOUSED -> ON_GIN_FLOOR on receipt cancel" }
      - { name: active_grade_code, type: string, source: computed, description: "grade_code of the ACTIVE ClassingResult; null while UNCLASSED" }
      - { name: quality_points, type: integer, source: computed, description: "Total premium/discount points of the ACTIVE ClassingResult per quality_price_adjustment; null while UNCLASSED" }
      - { name: adjustment_cents, type: integer, source: computed, description: "Signed quality adjustment of the ACTIVE ClassingResult; null while UNCLASSED" }

  - name: ClassingResult
    parent: null
    common_fields: true
    fields:
      - { name: bale_id, type: string, source: system, description: "FK -> Bale.id; from the create path" }
      - { name: grade_code, type: string, source: input, description: "USDA grade code assigned by the classing office" }
      - { name: micronaire, type: number, source: input, description: "Micronaire reading, one decimal (e.g. 4.5)" }
      - { name: strength_gpt, type: number, source: input, description: "Fiber strength in grams/tex, one decimal" }
      - { name: staple_32nds, type: integer, source: input, description: "Staple length in 32nds of an inch" }
      - { name: classing_office, type: string, source: input, description: "USDA classing office identifier" }
      - { name: result_date, type: datetime, source: input, description: "Date the office issued the result (date at 00:00:00Z); selects the covering GradeSchedule window" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUPERSEDED; at most one ACTIVE result per bale" }
      - { name: quality_points, type: integer, source: computed, description: "Pinned at creation: schedule premium_discount_points + micronaire band + strength band per quality_price_adjustment" }
      - { name: adjustment_cents, type: integer, source: computed, description: "Pinned at creation: round_half_up(bale net_weight_lbs * quality_points / 100)" }

  - name: WarehouseReceipt
    parent: null
    common_fields: true
    fields:
      - { name: bale_id, type: string, source: input, description: "FK -> Bale.id; the receipted bale" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; storage location" }
      - { name: receipt_number, type: string, source: system, description: "Server-minted unique receipt number" }
      - { name: storage_start_date, type: datetime, source: system, description: "Logical-clock date (00:00:00Z) at issuance; storage free-day counting starts here" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> PLEDGED -> RELEASED -> PLEDGED cycle; ACTIVE/RELEASED -> SHIPPED; PLEDGED -> FORFEITED; ACTIVE -> CANCELLED" }

  - name: LoanPledge
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_receipt_id, type: string, source: input, description: "FK -> WarehouseReceipt.id; receipt being pledged" }
      - { name: loan_rate_points, type: integer, source: computed, description: "Pinned from the GradeSchedule covering the pledge date for the bale's ACTIVE grade" }
      - { name: principal_cents, type: integer, source: computed, description: "round_half_up(bale net_weight_lbs * loan_rate_points / 100)" }
      - { name: interest_cents, type: integer, source: computed, default: 0, description: "0 while ACTIVE; at redeem = round_half_up(principal_cents * 0.0001 * days_elapsed)" }
      - { name: pledged_date, type: datetime, source: system, description: "Logical-clock date at pledge (00:00:00Z)" }
      - { name: redeemed_date, type: datetime, source: system, description: "Logical-clock date at redemption; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REPAID | FORFEITED" }

  - name: SeedSale
    parent: null
    common_fields: true
    fields:
      - { name: gin_shift_id, type: string, source: input, description: "FK -> GinShift.id; the reconciled shift whose pooled seed is sold; at most one SeedSale per shift" }
      - { name: buyer_name, type: string, source: input, description: "Oil mill / seed buyer name" }
      - { name: price_cents_per_lb, type: integer, source: input, description: "Contract price in whole cents per lb of seed; must be >= 1" }
      - { name: sold_lbs, type: integer, source: computed, description: "= SUM(reconciled_seed_lbs) over the shift's GINNED modules" }
      - { name: net_pool_cents, type: integer, source: computed, description: "= sold_lbs * price_cents_per_lb - 2500 handling flat fee" }

  - name: ShippingOrder
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; all bales must be receipted here" }
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; all bales must belong to this grower; a Grower actor may only pass their own id" }
      - { name: bale_ids, type: array, source: input, description: "Ordered list of Bale.id values to ship; each element references Bale.id; minimum length 1" }
      - { name: dock_number, type: integer, source: input, description: "Loading dock index in [1, warehouse.dock_count]" }
      - { name: load_start, type: datetime, source: input, description: "Loading window start (inclusive)" }
      - { name: load_end, type: datetime, source: input, description: "Loading window end (exclusive); must be > load_start" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CONFIRMED -> SHIPPED; DRAFT/CONFIRMED -> CANCELLED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; from the create path" }
      - { name: season, type: string, source: input, description: "Marketing season being settled" }
      - { name: computation_variant, type: enum, source: system, description: "PROVISIONAL at creation; FINAL after /finalize" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINAL -> PAID; DRAFT/FINAL -> SUPERSEDED when a newer settlement for (grower, season) is created" }
      - { name: lint_value_cents, type: integer, source: computed, description: "SUM(bale net_weight_lbs * 60) over season bales" }
      - { name: quality_adjustment_cents, type: integer, source: computed, description: "SUM(adjustment_cents of each season bale's ACTIVE ClassingResult); unclassed bales contribute 0" }
      - { name: seed_credit_cents, type: integer, source: computed, description: "PROVISIONAL: SUM(SEED_CREDIT entries) + unsold-shift estimate; FINAL: SUM(SEED_CREDIT entries) only (per settlement_net)" }
      - { name: ginning_charge_cents, type: integer, source: computed, description: "SUM(GINNING_CHARGE entries for grower+season); negative or zero" }
      - { name: storage_charge_cents, type: integer, source: computed, description: "SUM(STORAGE_CHARGE entries for grower+season); negative or zero" }
      - { name: loan_net_cents, type: integer, source: computed, description: "SUM(LOAN_ADVANCE + LOAN_REPAYMENT entries for grower+season); signed" }
      - { name: adjustment_net_cents, type: integer, source: computed, description: "SUM(ADJUSTMENT entries for grower+season); signed" }
      - { name: patronage_cents, type: integer, source: computed, description: "round_half_up(grower.patronage_rate * ABS(ginning_charge_cents))" }
      - { name: net_payable_cents, type: integer, source: computed, description: "lint + quality + seed + ginning + storage + loan_net + adjustment_net + patronage; evaluation order pinned in settlement_net" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount captured at /pay; must equal net_payable_cents; null until PAID" }

  - name: LedgerEntry
    parent: null
    common_fields: false   # append-only event log: id + created_at only; no updates, no version
    fields:
      - { name: grower_id, type: string, source: system, description: "FK -> Grower.id; account owner" }
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; set only on SETTLEMENT_PAYMENT and PATRONAGE entries posted by /pay; null otherwise" }
      - { name: season, type: string, source: system, description: "Season copied from the triggering entity (module / shift / receipt's bale's module / settlement)" }
      - { name: entry_type, type: enum, source: system, description: "GINNING_CHARGE | SEED_CREDIT | STORAGE_CHARGE | LOAN_ADVANCE | LOAN_REPAYMENT | ADJUSTMENT | PATRONAGE | SETTLEMENT_PAYMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; charges and repayments negative, credits positive" }
      - { name: memo, type: string, source: system, description: "Human-readable origin, e.g. module ticket number, receipt number, sale buyer" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GinShift
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /gin-ops/gin-shifts/{id}/close"
        actor: GinOperator
        preconditions:
          - "Shift must be OPEN (ERR_SHIFT_NOT_OPEN)"
          - "No module of this shift may be in GINNING (ERR_MODULES_STILL_GINNING)"
          - "Mass balance (exact integer lbs): SUM(net_weight_lbs of this shift's GINNED modules) == actual_lint_scale_lbs + actual_seed_scale_lbs + waste_lbs (ERR_MASS_BALANCE_VIOLATION)"
          - "actual_lint_scale_lbs == SUM(actual_lint_lbs of this shift's GINNED modules) (ERR_MASS_BALANCE_VIOLATION)"
        side_effects:
          - "Stores the three scale weights; status -> CLOSED"
          - "increments GinShift.version by 1"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /gin-ops/gin-shifts/{id}/reconcile"
        actor: GinOperator
        preconditions:
          - "Shift must be CLOSED (ERR_SHIFT_NOT_CLOSED)"
        side_effects:
          - "Runs shift_mass_balance_allocation: sets reconciled_seed_lbs on every GINNED module of the shift (mutation 1, per module: increments ModuleReceipt.version)"
          - "SUM(reconciled_seed_lbs) == actual_seed_scale_lbs exactly (allocation conserves the scale total)"
          - "status -> RECONCILED; increments GinShift.version by 1"

  - entity: ModuleReceipt
    initial_state: RECEIVED
    terminal_states: [REJECTED]
    transitions:
      - from: RECEIVED
        to: CONDITIONING
        trigger: "POST /gin-ops/modules/{id}/condition"
        actor: GinOperator
        preconditions:
          - "Module must be RECEIVED or CONDITIONING (ERR_MODULE_NOT_CONDITIONABLE)"
        side_effects:
          - "moisture_pct replaced by the payload reading"
          - "est_lint_lbs and est_seed_lbs recomputed per estimated_turnout"
          - "increments ModuleReceipt.version by 1"
      - from: CONDITIONING
        to: CONDITIONING
        trigger: "POST /gin-ops/modules/{id}/condition with moisture_pct > 12.0"
        actor: GinOperator
        preconditions:
          - "Module must be RECEIVED or CONDITIONING (ERR_MODULE_NOT_CONDITIONABLE)"
        side_effects:
          - "moisture_pct replaced; est_lint_lbs/est_seed_lbs recomputed"
          - "increments ModuleReceipt.version by 1"
        note: "self-loop: module stays in the dryer"
      - from: CONDITIONING
        to: RECEIVED
        trigger: "POST /gin-ops/modules/{id}/condition with moisture_pct <= 12.0"
        actor: GinOperator
        preconditions:
          - "Module must be CONDITIONING (implied by this transition's moisture branch)"
        side_effects:
          - "moisture_pct replaced; est_lint_lbs/est_seed_lbs recomputed"
          - "increments ModuleReceipt.version by 1"
      - from: RECEIVED
        to: QUEUED
        trigger: "POST /gin-ops/modules/{id}/queue"
        actor: GinOperator
        preconditions:
          - "Module must be RECEIVED (ERR_MODULE_NOT_QUEUABLE)"
          - "moisture_pct <= 12.0 (ERR_MOISTURE_LIMIT_EXCEEDED; 12.0 exactly passes)"
          - "GinShift identified by gin_shift_id must be OPEN (ERR_SHIFT_NOT_OPEN)"
          - "module.season == shift.season (ERR_SEASON_MISMATCH)"
        side_effects:
          - "gin_shift_id set; increments ModuleReceipt.version by 1"
      - from: QUEUED
        to: GINNING
        trigger: "POST /gin-ops/modules/{id}/start-ginning"
        actor: GinOperator
        preconditions:
          - "Module must be QUEUED (ERR_MODULE_NOT_GINNABLE)"
          - "Module's GinShift must be OPEN (ERR_SHIFT_NOT_OPEN)"
        side_effects:
          - "increments ModuleReceipt.version by 1"
      - from: GINNING
        to: GINNED
        trigger: "POST /gin-ops/modules/{id}/complete-ginning"
        actor: GinOperator
        preconditions:
          - "Module must be GINNING (ERR_MODULE_NOT_COMPLETABLE)"
          - "Every bale_tag in the payload must be globally unique (ERR_DUPLICATE_BALE_TAG)"
          - "bales list must be non-empty and every net_weight_lbs >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "ModuleReceipt -> GINNED; sets ginned_at (logical clock) and ginned_by_user_id = acting X-User-ID (mutation A)"
          - "Mutation A creates one Bale per payload entry (classing_status UNCLASSED, custody_status ON_GIN_FLOOR) and sets module.actual_lint_lbs = SUM(bale net_weight_lbs) (mutation B)"
          - "Mutation B triggers ginning_charge: a LedgerEntry GINNING_CHARGE (negative) posted to the grower using the season-cumulative tier state immediately before this module (mutation C)"
          - "Mutation C recomputes Grower.credit_balance_cents (mutation D)"
          - "increments ModuleReceipt.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /gin-ops/modules/{id}/reject"
        actor: GinOperator
        preconditions:
          - "Module must be RECEIVED or CONDITIONING (ERR_MODULE_NOT_REJECTABLE)"
        side_effects: ["increments ModuleReceipt.version by 1"]
      - from: CONDITIONING
        to: REJECTED
        trigger: "POST /gin-ops/modules/{id}/reject"
        actor: GinOperator
        preconditions:
          - "Module must be RECEIVED or CONDITIONING (ERR_MODULE_NOT_REJECTABLE)"
        side_effects: ["increments ModuleReceipt.version by 1"]

  - entity: Bale
    initial_state: "classing_status=UNCLASSED, custody_status=ON_GIN_FLOOR (parallel dimensions)"
    terminal_states: ["custody_status=SHIPPED (classing dimension has no terminal state)"]
    transitions:
      - from: "classing UNCLASSED"
        to: "classing CLASSED"
        trigger: "POST /gin-ops/bales/{id}/classing-results (first result)"
        actor: ClassingClerk
        preconditions:
          - "expected_bale_version == Bale.version (ERR_STALE_VERSION, 412)"
          - "A GradeSchedule row for grade_code with effective_from <= result_date < effective_to must exist (ERR_NO_ACTIVE_GRADE_SCHEDULE)"
        side_effects:
          - "Creates ClassingResult ACTIVE with pinned quality_points/adjustment_cents (mutation A)"
          - "Mutation A recomputes Bale.active_grade_code/quality_points/adjustment_cents and flips classing_status -> CLASSED (mutation B)"
          - "Mutation B triggers recompute of every Settlement in DRAFT for (bale grower, bale season) per settlement_net (mutation C)"
          - "increments Bale.version by 1"
      - from: "classing CLASSED"
        to: "classing CLASSED"
        trigger: "POST /gin-ops/bales/{id}/classing-results (reclass; supersedes)"
        actor: ClassingClerk
        preconditions:
          - "expected_bale_version == Bale.version (ERR_STALE_VERSION, 412)"
          - "Covering GradeSchedule for grade_code at result_date must exist (ERR_NO_ACTIVE_GRADE_SCHEDULE)"
        side_effects:
          - "Prior ACTIVE ClassingResult -> SUPERSEDED (increments its version); new ClassingResult created ACTIVE (mutation A)"
          - "Mutation A recomputes Bale.active_grade_code/quality_points/adjustment_cents from the new result (mutation B)"
          - "Mutation B triggers recompute of every DRAFT Settlement for (grower, season) per settlement_net (mutation C)"
          - "increments Bale.version by 1"
      - from: "custody ON_GIN_FLOOR"
        to: "custody WAREHOUSED"
        trigger: "POST /gin-ops/warehouse-receipts"
        actor: WarehouseManager
        preconditions:
          - "Bale custody must be ON_GIN_FLOOR with no WarehouseReceipt in {ACTIVE, PLEDGED, RELEASED} for this bale (ERR_RECEIPT_NOT_ISSUABLE)"
          - "Warehouse stored_bale_count < capacity_bales (ERR_WAREHOUSE_AT_CAPACITY; at capacity exactly is rejected)"
          - "Segregation of duties: acting X-User-ID != bale's module.ginned_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Creates WarehouseReceipt ACTIVE with storage_start_date = logical clock date (mutation A)"
          - "Mutation A sets Bale.custody_status -> WAREHOUSED and Warehouse.stored_bale_count += 1 (mutations B, C; increments Warehouse.version)"
      - from: "custody WAREHOUSED"
        to: "custody ON_GIN_FLOOR"
        trigger: "POST /gin-ops/warehouse-receipts/{id}/cancel"
        actor: WarehouseManager
        preconditions:
          - "Receipt must be ACTIVE (ERR_RECEIPT_NOT_CANCELLABLE)"
        side_effects:
          - "Receipt -> CANCELLED (mutation A)"
          - "Mutation A restores Bale.custody_status -> ON_GIN_FLOOR and Warehouse.stored_bale_count -= 1 (mutations B, C)"
      - from: "custody WAREHOUSED"
        to: "custody SHIPPED"
        trigger: "POST /gin-ops/shipping-orders/{id}/ship or POST /gin-ops/loan-pledges/{id}/forfeit"
        actor: "WarehouseManager (ship) | CoopAccountant (forfeit)"
        preconditions: ["See ShippingOrder / LoanPledge transitions"]
        side_effects:
          - "Bale.custody_status -> SHIPPED; storage charge accrual ends at the logical-clock date"

  - entity: WarehouseReceipt
    initial_state: ACTIVE
    terminal_states: [SHIPPED, FORFEITED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: PLEDGED
        trigger: "POST /gin-ops/loan-pledges"
        actor: CoopAccountant
        preconditions:
          - "Receipt status IN {ACTIVE, RELEASED} (ERR_RECEIPT_NOT_ACTIVE)"
          - "Bale classing_status == CLASSED (ERR_BALE_NOT_CLASSED)"
          - "Covering GradeSchedule for the bale's grade at the pledge date must exist (ERR_NO_ACTIVE_GRADE_SCHEDULE)"
          - "Grower's season ACTIVE-pledge principal total + new principal <= 50000000 (ERR_LOAN_CAP_EXCEEDED)"
        side_effects:
          - "Creates LoanPledge ACTIVE with pinned loan_rate_points and principal_cents (mutation A)"
          - "Mutation A flips receipt -> PLEDGED (increments receipt version) (mutation B)"
          - "Mutation B posts LedgerEntry LOAN_ADVANCE (+principal_cents) and recomputes Grower.credit_balance_cents (mutations C, D)"
      - from: RELEASED
        to: PLEDGED
        trigger: "POST /gin-ops/loan-pledges (re-pledge after redemption)"
        actor: CoopAccountant
        preconditions: ["Same as ACTIVE -> PLEDGED"]
        side_effects: ["Same as ACTIVE -> PLEDGED"]
        note: "cyclic dimension: pledge/release may repeat"
      - from: PLEDGED
        to: RELEASED
        trigger: "POST /gin-ops/loan-pledges/{id}/redeem"
        actor: CoopAccountant
        preconditions:
          - "Pledge must be ACTIVE (ERR_PLEDGE_NOT_ACTIVE)"
        side_effects:
          - "Pledge -> REPAID; sets interest_cents = round_half_up(principal_cents * 0.0001 * days from pledged_date to logical-clock date) and redeemed_date (mutation A)"
          - "Mutation A flips receipt -> RELEASED (mutation B)"
          - "Mutation B posts LedgerEntry LOAN_REPAYMENT (-(principal_cents + interest_cents)) and recomputes Grower.credit_balance_cents (mutations C, D)"
      - from: PLEDGED
        to: FORFEITED
        trigger: "POST /gin-ops/loan-pledges/{id}/forfeit"
        actor: CoopAccountant
        preconditions:
          - "Pledge must be ACTIVE (ERR_PLEDGE_NOT_ACTIVE)"
        side_effects:
          - "Pledge -> FORFEITED (mutation A)"
          - "Mutation A flips receipt -> FORFEITED, Bale.custody_status -> SHIPPED, Warehouse.stored_bale_count -= 1 (mutation B)"
          - "Mutation B ends storage accrual at the logical-clock date and posts LedgerEntry STORAGE_CHARGE per storage_charge (mutations C); recomputes Grower.credit_balance_cents (mutation D)"
      - from: ACTIVE
        to: SHIPPED
        trigger: "POST /gin-ops/shipping-orders/{id}/ship"
        actor: WarehouseManager
        preconditions: ["See ShippingOrder ship transition"]
        side_effects: ["Receipt -> SHIPPED; storage accrual ends; STORAGE_CHARGE entry posted (see ShippingOrder cascade)"]
      - from: RELEASED
        to: SHIPPED
        trigger: "POST /gin-ops/shipping-orders/{id}/ship"
        actor: WarehouseManager
        preconditions: ["See ShippingOrder ship transition"]
        side_effects: ["Same as ACTIVE -> SHIPPED"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /gin-ops/warehouse-receipts/{id}/cancel"
        actor: WarehouseManager
        preconditions:
          - "Receipt must be ACTIVE (ERR_RECEIPT_NOT_CANCELLABLE)"
        side_effects: ["Bale custody and warehouse count restored (see Bale WAREHOUSED -> ON_GIN_FLOOR)"]

  - entity: LoanPledge
    initial_state: ACTIVE
    terminal_states: [REPAID, FORFEITED]
    transitions:
      - from: ACTIVE
        to: REPAID
        trigger: "POST /gin-ops/loan-pledges/{id}/redeem"
        actor: CoopAccountant
        preconditions: ["Pledge ACTIVE (ERR_PLEDGE_NOT_ACTIVE)"]
        side_effects: ["See WarehouseReceipt PLEDGED -> RELEASED cascade"]
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /gin-ops/loan-pledges/{id}/forfeit"
        actor: CoopAccountant
        preconditions: ["Pledge ACTIVE (ERR_PLEDGE_NOT_ACTIVE)"]
        side_effects: ["See WarehouseReceipt PLEDGED -> FORFEITED cascade"]

  - entity: ShippingOrder
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /gin-ops/shipping-orders/{id}/confirm"
        actor: "Grower (own order) | WarehouseManager"
        preconditions:
          - "Order must be DRAFT (ERR_ORDER_NOT_CONFIRMABLE)"
          - "Every listed bale still satisfies the shippable predicate: custody WAREHOUSED and its non-terminal receipt status IN {ACTIVE, RELEASED} (ERR_BALE_NOT_SHIPPABLE)"
        side_effects: ["increments ShippingOrder.version by 1"]
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /gin-ops/shipping-orders/{id}/ship"
        actor: WarehouseManager
        preconditions:
          - "Order must be CONFIRMED (ERR_ORDER_NOT_SHIPPABLE)"
          - "Every listed bale still satisfies the shippable predicate (ERR_BALE_NOT_SHIPPABLE)"
        side_effects:
          - "Order -> SHIPPED (mutation A)"
          - "Mutation A flips each listed bale's non-terminal receipt -> SHIPPED and each Bale.custody_status -> SHIPPED, and Warehouse.stored_bale_count -= number of listed bales (mutation B)"
          - "Mutation B posts one LedgerEntry STORAGE_CHARGE per receipt (negative; storage_charge with end = logical-clock date) (mutation C)"
          - "Each mutation C recomputes its Grower.credit_balance_cents (mutation D)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /gin-ops/shipping-orders/{id}/cancel"
        actor: "Grower (own order) | WarehouseManager"
        preconditions:
          - "Order must be DRAFT or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects: ["increments ShippingOrder.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /gin-ops/shipping-orders/{id}/cancel"
        actor: "Grower (own order) | WarehouseManager"
        preconditions:
          - "Order must be DRAFT or CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects: ["increments ShippingOrder.version by 1"]

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID, SUPERSEDED]
    transitions:
      - from: "(none — creation)"
        to: DRAFT
        trigger: "POST /gin-ops/growers/{growerId}/settlements"
        actor: CoopAccountant
        preconditions:
          - "expected_grower_version == Grower.version (ERR_STALE_VERSION, 412)"
          - "No Settlement for (grower, season) in PAID status (ERR_SETTLEMENT_ALREADY_PAID)"
        side_effects:
          - "Any existing DRAFT or FINAL Settlement for (grower, season) -> SUPERSEDED (mutation A)"
          - "New Settlement created DRAFT with computation_variant PROVISIONAL and all money lines computed per settlement_net (mutation B)"
          - "increments Grower.version by 1"
      - from: DRAFT
        to: FINAL
        trigger: "POST /gin-ops/settlements/{id}/finalize"
        actor: CoopAccountant
        preconditions:
          - "Settlement must be DRAFT (ERR_SETTLEMENT_NOT_FINALIZABLE)"
          - "Every ModuleReceipt of (grower, season) must be GINNED or REJECTED (ERR_UNGINNED_MODULES_EXIST)"
          - "Every bale of (grower, season) must have classing_status CLASSED (ERR_UNCLASSED_BALES_EXIST)"
          - "Every GinShift holding a GINNED module of (grower, season) must have a SeedSale (ERR_UNSOLD_SEED_EXISTS)"
        side_effects:
          - "Recomputes all money lines with computation_variant FINAL per settlement_net; status -> FINAL"
          - "increments Settlement.version by 1"
      - from: FINAL
        to: PAID
        trigger: "POST /gin-ops/settlements/{id}/pay"
        actor: CoopAccountant
        preconditions:
          - "Settlement must be FINAL (ERR_SETTLEMENT_NOT_FINAL)"
          - "Payload amount_cents == settlement.net_payable_cents exactly (ERR_OVERPAYMENT)"
        side_effects:
          - "Sets paid_amount_cents; status -> PAID (mutation A)"
          - "Mutation A posts LedgerEntry PATRONAGE (+patronage_cents, settlement_id set) and SETTLEMENT_PAYMENT (-net_payable_cents, settlement_id set) (mutation B)"
          - "Each posting recomputes Grower.credit_balance_cents (mutation C)"

  - entity: ClassingResult
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer ClassingResult is created for the same bale)"
        actor: system
        preconditions: []
        side_effects: ["increments ClassingResult.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — only true races)
# =============================================================================
concurrency_rules:
  - rule_id: classing-result-supersede-stale-bale
    parent_entity: Bale
    write_endpoint: "POST /gin-ops/bales/{id}/classing-results"
    occ_field: expected_bale_version
    description: |
      Creating a ClassingResult for a Bale whose version has advanced since the
      client last observed it is rejected. A newer classing result legitimately
      supersedes the prior ACTIVE one, so a writer carrying a stale view of the
      bale must be refused rather than supersede a result it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-supersede-stale-grower
    parent_entity: Grower
    write_endpoint: "POST /gin-ops/growers/{growerId}/settlements"
    occ_field: expected_grower_version
    description: |
      Creating a Settlement against a Grower whose version has advanced since
      the client last observed it is rejected. A new settlement legitimately
      supersedes the prior DRAFT/FINAL one for (grower, season), so a writer
      carrying a stale grower version must be refused rather than supersede a
      settlement it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: module_net_weight
    trigger: "ModuleReceipt create"
    algorithm: aggregation
    formula: |
      net_weight_lbs = gross_weight_lbs - tare_weight_lbs
      (must be >= 1 else ERR_INVALID_REQUEST)
    input_set: "the module being created"
    constants: {}
    precision: "integer lbs, no rounding"

  - name: estimated_turnout
    trigger: "ModuleReceipt create and every POST /condition (moisture re-reading)"
    algorithm: threshold
    formula: |
      moisture_adj = 0                                  if moisture_pct <= 8.0
                   = min(0.020, 0.004 * (moisture_pct - 8.0))  otherwise
      fm_adj       = 0                                  if foreign_matter_pct <= 4.0
                   = min(0.025, 0.005 * (foreign_matter_pct - 4.0)) otherwise
      est_lint_pct = max(0.30, 0.38 - moisture_adj - fm_adj)
      est_lint_lbs = round_half_up(net_weight_lbs * est_lint_pct)
      est_seed_lbs = round_half_up(net_weight_lbs * 0.55)
    input_set: "the single module"
    constants:
      BASE_LINT_PCT: 0.38
      MOISTURE_REF_PCT: 8.0
      MOISTURE_ADJ_PER_PT: 0.004
      MOISTURE_ADJ_CAP: 0.020
      FM_REF_PCT: 4.0
      FM_ADJ_PER_PT: 0.005
      FM_ADJ_CAP: 0.025
      MIN_LINT_PCT: 0.30
      SEED_PCT: 0.55
    precision: "lbs rounded half-up to integer"

  - name: shift_mass_balance_allocation
    trigger: "POST /gin-ops/gin-shifts/{id}/reconcile"
    algorithm: waterfall_allocation
    formula: |
      Let M = GINNED modules of the shift, T = shift.actual_seed_scale_lbs.
      total_est = SUM(est_seed_lbs over M)
      For each m in M:  raw[m] = T * est_seed_lbs[m] / total_est
                        floor_share[m] = floor(raw[m]); frac[m] = raw[m] - floor_share[m]
      remainder = T - SUM(floor_share)          # integer, 0 <= remainder < |M|
      Order M by frac DESC, tie-break ModuleReceipt.created_at ASC;
      add +1 lb to the first `remainder` modules in that order.
      reconciled_seed_lbs[m] = floor_share[m] (+1)
      Invariant: SUM(reconciled_seed_lbs) == T exactly.
    input_set: "modules of the shift with status GINNED only (REJECTED modules never join a shift)"
    constants: {}
    precision: "integer lbs; per-module floor first, then largest-remainder distribution — this order is pinned and MUST NOT be replaced by round-then-sum"
    variants:
      - name: estimated
        when: "before the shift is RECONCILED (e.g., PROVISIONAL settlement seed estimate)"
        difference: "module seed quantity is est_seed_lbs (standard turnout table), NOT scale-allocated"
      - name: reconciled
        when: "after reconcile"
        difference: "module seed quantity is reconciled_seed_lbs; for identical module data the two variants differ whenever T != total_est"

  - name: ginning_charge
    trigger: "POST /gin-ops/modules/{id}/complete-ginning (per module, chronological by ginned_at)"
    algorithm: tiered_pricing
    formula: |
      cumulative_before = SUM(actual_lint_lbs of this grower's modules in the same season
                                that are GINNED with ginned_at strictly earlier;
                                ginned_at ties break by ModuleReceipt.created_at ASC)
      L = module.actual_lint_lbs
      tier1_lbs = min(L, max(0, 100000 - cumulative_before))   # marginal tier split
      tier2_lbs = L - tier1_lbs
      charge_cents = round_half_up(tier1_lbs * 11.5 + tier2_lbs * 9.5)
      LedgerEntry GINNING_CHARGE amount_cents = -charge_cents
      Rounding order (pinned): each MODULE's charge is rounded half-up to whole cents
      individually; the grower's season total is the plain sum of rounded module
      charges — NEVER round per bale and NEVER round a season-level raw sum.
    input_set: "grower's GINNED modules in the same season, ordered by ginned_at ASC then created_at ASC"
    constants:
      TIER1_LIMIT_LBS: 100000
      RATE_TIER1_CENTS_PER_LB: 11.5
      RATE_TIER2_CENTS_PER_LB: 9.5
    precision: "cents, round_half_up per module"

  - name: quality_price_adjustment
    trigger: "POST /gin-ops/bales/{id}/classing-results (creation pins the snapshot)"
    algorithm: weighted_scoring
    formula: |
      schedule = the GradeSchedule with grade_code == input grade_code AND
                 effective_from <= result_date < effective_to
                 (window non-overlap guarantees at most one; none -> ERR_NO_ACTIVE_GRADE_SCHEDULE)
      mic_points = +25 if 3.7 <= micronaire <= 4.2
                   0  if 3.5 <= micronaire <= 4.9 (and not in premium band)
                   -50 otherwise
      strength_points = +15 if strength_gpt >= 29.0
                        -30 if strength_gpt <= 26.0
                        0   otherwise
      quality_points = schedule.premium_discount_points + mic_points + strength_points
      adjustment_cents = round_half_up(bale.net_weight_lbs * quality_points / 100)   # signed
    input_set: "the new ClassingResult, its Bale, the covering GradeSchedule"
    constants:
      MIC_PREMIUM_LO: 3.7
      MIC_PREMIUM_HI: 4.2
      MIC_PREMIUM_POINTS: 25
      MIC_ACCEPTABLE_LO: 3.5
      MIC_ACCEPTABLE_HI: 4.9
      MIC_PENALTY_POINTS: -50
      STRENGTH_BONUS_MIN: 29.0
      STRENGTH_BONUS_POINTS: 15
      STRENGTH_PENALTY_MAX: 26.0
      STRENGTH_PENALTY_POINTS: -30
    precision: "points integer; adjustment round_half_up to cents"

  - name: storage_charge
    trigger: "ShippingOrder ship (per listed receipt) and LoanPledge forfeit (per receipt)"
    algorithm: threshold
    formula: |
      days_stored = (end_date - receipt.storage_start_date) in whole calendar days,
                    half-open [start, end): the start day counts, the end day does not
      chargeable_days = max(0, days_stored - 15)
      charge_cents = chargeable_days * 12
      LedgerEntry STORAGE_CHARGE amount_cents = -charge_cents  (0-day stays post no entry)
      Boundary: exactly 15 days stored -> 0 charge; 16 days -> 12 cents.
      If charge_cents == 0, no LedgerEntry is posted.
    input_set: "the single WarehouseReceipt leaving storage"
    constants:
      FREE_STORAGE_DAYS: 15
      DAILY_STORAGE_CENTS: 12
    precision: "integer cents"

  - name: seed_proceeds_credit
    trigger: "POST /gin-ops/seed-sales"
    algorithm: waterfall_allocation
    formula: |
      shift must be RECONCILED and have no existing SeedSale (ERR_SHIFT_ALREADY_SOLD)
      sold_lbs = SUM(reconciled_seed_lbs over the shift's GINNED modules)
      net_pool_cents = sold_lbs * price_cents_per_lb - 2500
      Per module raw[m] = net_pool_cents * reconciled_seed_lbs[m] / sold_lbs
      floor-share then distribute the remainder +1 cent at a time to modules ordered by
      fractional part DESC, tie-break ModuleReceipt.created_at ASC (same largest-remainder rule as reconciliation)
      Each grower's credit = SUM over that grower's modules in the shift -> one
      LedgerEntry SEED_CREDIT per grower (positive). SUM(grower credits) == net_pool_cents exactly.
    input_set: "GINNED modules of the sold shift"
    constants:
      HANDLING_FLAT_CENTS: 2500
    precision: "integer cents; largest-remainder, pinned order"

  - name: loan_principal_and_interest
    trigger: "POST /gin-ops/loan-pledges (principal) and POST /gin-ops/loan-pledges/{id}/redeem (interest)"
    algorithm: aggregation
    formula: |
      At pledge:
        schedule = GradeSchedule covering pledge date (logical clock) for the bale's ACTIVE grade_code
        principal_cents = round_half_up(bale.net_weight_lbs * schedule.loan_rate_points / 100)
        Season cap: SUM(principal_cents of the grower's ACTIVE pledges in this season) + principal_cents
                    <= 50000000 else ERR_LOAN_CAP_EXCEEDED
      At redeem:
        days = (logical-clock date - pledged_date) in whole calendar days, half-open [pledge, redeem)
        interest_cents = round_half_up(principal_cents * 0.0001 * days)
        LedgerEntry LOAN_REPAYMENT = -(principal_cents + interest_cents)
        Same-day redemption: days = 0, interest = 0.
    input_set: "the pledge, its receipt's bale, the covering GradeSchedule"
    constants:
      LOAN_DAILY_RATE: 0.0001
      SEASON_LOAN_CAP_CENTS: 50000000
    precision: "cents, round_half_up"

  - name: settlement_net
    trigger: "POST /gin-ops/growers/{growerId}/settlements (create), Bale classing change while a DRAFT exists (recompute), POST /gin-ops/settlements/{id}/finalize"
    algorithm: constraint_propagation
    formula: |
      Scope: modules of the grower with season == settlement.season; their bales;
      LedgerEntries of the grower with season == settlement.season.
      EVALUATION ORDER (pinned — the dependency patronage <- ginning charges <- net
      must be resolved exactly in this order; net NEVER feeds back into patronage):
      (1) lint_value_cents  = SUM(bale.net_weight_lbs * 60) over season bales
      (2) quality_adjustment_cents = SUM(adjustment_cents of each bale's ACTIVE
          ClassingResult); unclassed bales contribute 0
      (3) seed_credit_cents:
          PROVISIONAL = SUM(SEED_CREDIT entries)
                        + SUM(est_seed_lbs of GINNED season modules whose GinShift
                              has no SeedSale) * 25    # reference estimate, no handling fee
          FINAL       = SUM(SEED_CREDIT entries) only
      (4) ginning_charge_cents = SUM(GINNING_CHARGE entries)        # <= 0
          storage_charge_cents = SUM(STORAGE_CHARGE entries)        # <= 0
          loan_net_cents       = SUM(LOAN_ADVANCE + LOAN_REPAYMENT entries)
          adjustment_net_cents = SUM(ADJUSTMENT entries)
      (5) patronage_cents = round_half_up(grower.patronage_rate * ABS(ginning_charge_cents))
      (6) net_payable_cents = (1)+(2)+(3)+(4 sums)+(5)
      Invariant: Settlement money lines are a pure function of the scoped inputs
      above; recompute on any classing change while DRAFT.
    input_set: "grower's season modules (any non-REJECTED status contributes its bales), season bales, season LedgerEntries"
    constants:
      BASE_LINT_PRICE_CENTS_PER_LB: 60
      REFERENCE_SEED_PRICE_CENTS_PER_LB: 25
      DEFAULT_PATRONAGE_RATE: 0.20
    precision: "integer cents; only patronage rounds (half-up)"
    variants:
      - name: provisional
        when: "computation_variant PROVISIONAL (settlement creation, DRAFT recompute)"
        difference: "adds the unsold-shift seed ESTIMATE (est_seed_lbs x 25c); for identical deliveries this differs from FINAL whenever a sold-shift credit differs from its estimate or a shift is not yet sold"
      - name: final
        when: "computation_variant FINAL (after /finalize; requires all shifts sold)"
        difference: "seed line = posted SEED_CREDIT entries only; no estimates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted on the endpoint per §1.5; Grower-role callers may only act on resources whose grower chain resolves to their own X-User-ID (else ERR_FORBIDDEN)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right; body FK references (grower_id, warehouse_id, gin_shift_id, bale_id, warehouse_receipt_id, gin_shift elements of bale_ids) must exist"
    error_id: "ERR_GROWER_NOT_FOUND | ERR_MODULE_NOT_FOUND | ERR_BALE_NOT_FOUND | ERR_GIN_SHIFT_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_WAREHOUSE_RECEIPT_NOT_FOUND | ERR_LOAN_PLEDGE_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_SHIPPING_ORDER_NOT_FOUND | ERR_GRADE_SCHEDULE_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 3.5
    category: existence
    check: "Request body shape: required fields present, enum members valid, load_end > load_start (ERR_INVALID_WINDOW), bale_ids non-empty (ERR_EMPTY_SHIPMENT), numeric ranges sane (weights >= 1, price >= 1, dock_number in [1, dock_count])"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_WINDOW | ERR_EMPTY_SHIPMENT"
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: state
    check: "Target entity must be in the state required by the transition (module QUEUE/GIN/COMPLETE/CONDITION/REJECT gates; shift OPEN/CLOSED gates; receipt ACTIVE/RELEASED gate for pledge; pledge ACTIVE gate; order DRAFT/CONFIRMED gates; settlement DRAFT/FINAL gates; bale custody gates incl. ERR_BALE_NOT_SHIPPABLE, ERR_RECEIPT_NOT_ISSUABLE; OCC expected_*_version match)"
    error_id: "ERR_MODULE_NOT_QUEUABLE | ERR_MODULE_NOT_CONDITIONABLE | ERR_MODULE_NOT_GINNABLE | ERR_MODULE_NOT_COMPLETABLE | ERR_MODULE_NOT_REJECTABLE | ERR_SHIFT_NOT_OPEN | ERR_MODULES_STILL_GINNING | ERR_SHIFT_NOT_CLOSED | ERR_SHIFT_NOT_RECONCILED | ERR_RECEIPT_NOT_ACTIVE | ERR_RECEIPT_NOT_CANCELLABLE | ERR_RECEIPT_NOT_ISSUABLE | ERR_BALE_NOT_CLASSED | ERR_BALE_NOT_SHIPPABLE | ERR_PLEDGE_NOT_ACTIVE | ERR_ORDER_NOT_CONFIRMABLE | ERR_ORDER_NOT_SHIPPABLE | ERR_ORDER_NOT_CANCELLABLE | ERR_SETTLEMENT_NOT_FINALIZABLE | ERR_SETTLEMENT_NOT_FINAL | ERR_UNGINNED_MODULES_EXIST | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "action/transition endpoints; POST /gin-ops/shipping-orders (create-time shippable gate on every listed bale: custody WAREHOUSED and non-terminal receipt IN {ACTIVE, RELEASED})"

  - priority: 5
    category: business_safety
    check: "Contamination and moisture safety: create with foreign_matter_pct > 10.0 rejected; queue with moisture_pct > 12.0 rejected; segregation of duties — receipt issuer must not be the module's ginned_by_user_id"
    error_id: "ERR_FOREIGN_MATTER_LIMIT_EXCEEDED | ERR_MOISTURE_LIMIT_EXCEEDED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST /gin-ops/modules; POST /gin-ops/modules/{id}/queue; POST /gin-ops/warehouse-receipts"

  - priority: 6
    category: business_constraint
    check: "Uniqueness and structural quotas: (grower_id, season, ticket_number) unique; (season, module_tag) unique; bale_tag globally unique; one SeedSale per shift; warehouse stored_bale_count < capacity_bales before issue; shift mass-balance equality at close"
    error_id: "ERR_DUPLICATE_TICKET_NUMBER | ERR_DUPLICATE_MODULE_TAG | ERR_DUPLICATE_BALE_TAG | ERR_SHIFT_ALREADY_SOLD | ERR_WAREHOUSE_AT_CAPACITY | ERR_MASS_BALANCE_VIOLATION"
    http_status: 409
    applies_to: "POST /gin-ops/modules; POST /gin-ops/modules/{id}/complete-ginning; POST /gin-ops/seed-sales; POST /gin-ops/warehouse-receipts; POST /gin-ops/gin-shifts/{id}/close"

  - priority: 7
    category: business_temporal
    check: "Grade schedule half-open windows [effective_from, effective_to) for the same grade_code must not overlap (adjacency where one ends exactly when another begins is allowed); classing result_date and pledge date must be covered by a schedule for the grade; shipping dock windows on the same warehouse+dock must keep a >= 30 minute gap to every non-cancelled order (conflict when NOT(new.load_end + 30min <= existing.load_start OR existing.load_end + 30min <= new.load_start))"
    error_id: "ERR_GRADE_WINDOW_OVERLAP | ERR_NO_ACTIVE_GRADE_SCHEDULE | ERR_DOCK_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /gin-ops/grade-schedules; POST /gin-ops/bales/{id}/classing-results; POST /gin-ops/loan-pledges; POST /gin-ops/shipping-orders"

  - priority: 8
    category: business_referential
    check: "Cross-entity coherence: module.season == shift.season at queue; all ShippingOrder bales belong to order.grower_id and their non-terminal receipts sit at order.warehouse_id; settlement finalize requires no UNCLASSED bales and no unsold reconciled shift; warehouse receipt issuance requires the bale's module to be GINNED (implied by custody ON_GIN_FLOOR)"
    error_id: "ERR_SEASON_MISMATCH | ERR_MIXED_GROWER_SHIPMENT | ERR_BALE_WAREHOUSE_MISMATCH | ERR_UNCLASSED_BALES_EXIST | ERR_UNSOLD_SEED_EXISTS"
    http_status: 422
    applies_to: "POST /gin-ops/modules/{id}/queue; POST /gin-ops/shipping-orders; POST /gin-ops/settlements/{id}/finalize"

  - priority: 9
    category: business_fiscal
    check: "Money caps and exact amounts: season ACTIVE pledge principal + new principal <= 50000000; settlement pay amount_cents must equal net_payable_cents exactly"
    error_id: "ERR_LOAN_CAP_EXCEEDED | ERR_OVERPAYMENT"
    http_status: 402
    applies_to: "POST /gin-ops/loan-pledges; POST /gin-ops/settlements/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All date-stamping (storage_start_date, pledged_date, ginned_at, storage/interest day counts) reads this clock."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutated"]

  # --- Grower ---
  - method: POST
    path: "/gin-ops/growers"
    description: "Register a co-op grower"
    roles: [CoopAdmin]
    code: 201
    input: [membership_number, legal_name, "patronage_rate?"]
    output: Grower
    side_effects: ["credit_balance_cents = 0", "patronage_rate defaults to 0.20"]

  - method: GET
    path: "/gin-ops/growers/{id}"
    description: "Get a grower (Grower role: self only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: Grower
    side_effects: []

  - method: GET
    path: "/gin-ops/growers/{id}/settlements"
    description: "List settlements of a grower (Grower role: self only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/gin-ops/growers/{growerId}/settlements"
    description: "Create (superseding) settlement for grower+season; OCC on Grower.version"
    roles: [CoopAccountant]
    code: 201
    input: [season, expected_grower_version]
    output: Settlement
    side_effects:
      - "prior DRAFT/FINAL settlement for (grower, season) -> SUPERSEDED"
      - "new Settlement DRAFT + PROVISIONAL, money lines per settlement_net"
      - "increments Grower.version by 1"

  - method: POST
    path: "/gin-ops/growers/{growerId}/ledger-adjustments"
    description: "Post a manual ADJUSTMENT ledger entry (positive or negative amount)"
    roles: [CoopAccountant]
    code: 201
    input: [season, amount_cents, memo]
    output: LedgerEntry
    side_effects:
      - "LedgerEntry ADJUSTMENT posted"
      - "recomputes Grower.credit_balance_cents"

  - method: GET
    path: "/gin-ops/ledger-entries"
    description: "Filtered ledger list (Grower role: own grower_id only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["grower_id?", "settlement_id?", "season?", "limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/gin-ops/ledger-entries/{id}"
    description: "Get a single ledger entry (Grower role: own entries only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # --- GradeSchedule ---
  - method: POST
    path: "/gin-ops/grade-schedules"
    description: "Create a grade schedule window; same-grade half-open windows must not overlap"
    roles: [CoopAdmin]
    code: 201
    input: [grade_code, premium_discount_points, loan_rate_points, effective_from, effective_to]
    output: GradeSchedule
    side_effects: []

  - method: GET
    path: "/gin-ops/grade-schedules/{id}"
    description: "Get a grade schedule"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: GradeSchedule
    side_effects: []

  # --- Warehouse ---
  - method: POST
    path: "/gin-ops/warehouses"
    description: "Create a warehouse"
    roles: [CoopAdmin]
    code: 201
    input: [name, capacity_bales, dock_count]
    output: Warehouse
    side_effects: ["stored_bale_count = 0"]

  - method: GET
    path: "/gin-ops/warehouses/{id}"
    description: "Get a warehouse"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  # --- GinShift ---
  - method: POST
    path: "/gin-ops/gin-shifts"
    description: "Open a gin shift"
    roles: [GinOperator]
    code: 201
    input: [season, stand_label]
    output: GinShift
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/gin-ops/gin-shifts/{id}"
    description: "Get a gin shift"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: GinShift
    side_effects: []

  - method: POST
    path: "/gin-ops/gin-shifts/{id}/close"
    description: "Close a shift with actual scale weights; enforces exact mass balance"
    roles: [GinOperator]
    code: 200
    input: [actual_lint_scale_lbs, actual_seed_scale_lbs, waste_lbs]
    output: GinShift
    side_effects: ["OPEN -> CLOSED per GinShift machine"]

  - method: POST
    path: "/gin-ops/gin-shifts/{id}/reconcile"
    description: "Run mass-balance seed allocation; CLOSED -> RECONCILED"
    roles: [GinOperator]
    code: 200
    input: []
    output: GinShift
    side_effects: ["sets reconciled_seed_lbs on every GINNED module per shift_mass_balance_allocation"]

  - method: GET
    path: "/gin-ops/gin-shifts/{id}/seed-sales"
    description: "List seed sales of a shift (0 or 1 element)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "SeedSale[]"
    side_effects: []

  # --- ModuleReceipt ---
  - method: POST
    path: "/gin-ops/modules"
    description: "Receive a module and cut the grower ticket"
    roles: [GinOperator]
    code: 201
    input: [grower_id, season, ticket_number, module_tag, gross_weight_lbs, tare_weight_lbs, moisture_pct, foreign_matter_pct]
    output: ModuleReceipt
    side_effects:
      - "net_weight_lbs = gross - tare"
      - "est_lint_lbs / est_seed_lbs per estimated_turnout"
      - "status = RECEIVED"

  - method: GET
    path: "/gin-ops/modules/{id}"
    description: "Get a module receipt (Grower role: own modules only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: ModuleReceipt
    side_effects: []

  - method: GET
    path: "/gin-ops/modules"
    description: "Filtered module list (Grower role: own modules only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["grower_id?", "gin_shift_id?", "season?", "status?", "limit?", "offset?"]
    output: "ModuleReceipt[]"
    side_effects: []

  - method: POST
    path: "/gin-ops/modules/{id}/condition"
    description: "Send to dryer / record a new moisture reading; RECEIVED<->CONDITIONING cycle"
    roles: [GinOperator]
    code: 200
    input: [moisture_pct]
    output: ModuleReceipt
    side_effects: ["moisture_pct replaced; estimated_turnout recomputed; state per ModuleReceipt machine"]

  - method: POST
    path: "/gin-ops/modules/{id}/queue"
    description: "Queue a RECEIVED module into an OPEN same-season shift"
    roles: [GinOperator]
    code: 200
    input: [gin_shift_id]
    output: ModuleReceipt
    side_effects: ["RECEIVED -> QUEUED; gin_shift_id set"]

  - method: POST
    path: "/gin-ops/modules/{id}/start-ginning"
    description: "Begin ginning a QUEUED module"
    roles: [GinOperator]
    code: 200
    input: []
    output: ModuleReceipt
    side_effects: ["QUEUED -> GINNING"]

  - method: POST
    path: "/gin-ops/modules/{id}/complete-ginning"
    description: "Record produced bales and finish ginning; posts the tiered ginning charge"
    roles: [GinOperator]
    code: 200
    input: [bales]
    output: ModuleReceipt
    side_effects:
      - "GINNING -> GINNED; ginned_at/ginned_by_user_id set"
      - "creates one Bale per payload entry (UNCLASSED, ON_GIN_FLOOR)"
      - "posts LedgerEntry GINNING_CHARGE per ginning_charge; recomputes Grower.credit_balance_cents"

  - method: POST
    path: "/gin-ops/modules/{id}/reject"
    description: "Reject a contaminated module (RECEIVED/CONDITIONING only)"
    roles: [GinOperator]
    code: 200
    input: [reason]
    output: ModuleReceipt
    side_effects: ["-> REJECTED (terminal)"]

  - method: GET
    path: "/gin-ops/modules/{id}/bales"
    description: "List bales produced by a module"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "Bale[]"
    side_effects: []

  # --- Bale / ClassingResult ---
  - method: GET
    path: "/gin-ops/bales/{id}"
    description: "Get a bale (Grower role: own bales only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: Bale
    side_effects: []

  - method: POST
    path: "/gin-ops/bales/{id}/classing-results"
    description: "Record a USDA classing result; supersedes the prior ACTIVE result; OCC on Bale.version"
    roles: [ClassingClerk]
    code: 201
    input: [grade_code, micronaire, strength_gpt, staple_32nds, classing_office, result_date, expected_bale_version]
    output: ClassingResult
    side_effects:
      - "prior ACTIVE result -> SUPERSEDED"
      - "new result ACTIVE with pinned quality_points/adjustment_cents per quality_price_adjustment"
      - "Bale classing fields recomputed; classing_status CLASSED"
      - "DRAFT settlements for (grower, season) recomputed per settlement_net"
      - "increments Bale.version by 1"

  - method: GET
    path: "/gin-ops/bales/{id}/classing-results"
    description: "List classing results of a bale (ACTIVE and SUPERSEDED)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClassingResult[]"
    side_effects: []

  # --- WarehouseReceipt ---
  - method: POST
    path: "/gin-ops/warehouse-receipts"
    description: "Issue a warehouse receipt for an on-floor bale; segregation of duties enforced"
    roles: [WarehouseManager]
    code: 201
    input: [bale_id, warehouse_id]
    output: WarehouseReceipt
    side_effects:
      - "receipt ACTIVE; storage_start_date = logical clock date"
      - "Bale.custody_status -> WAREHOUSED"
      - "Warehouse.stored_bale_count += 1; increments Warehouse.version"

  - method: GET
    path: "/gin-ops/warehouse-receipts/{id}"
    description: "Get a warehouse receipt"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: WarehouseReceipt
    side_effects: []

  - method: GET
    path: "/gin-ops/warehouse-receipts"
    description: "Filtered warehouse receipt list"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["bale_id?", "warehouse_id?", "status?", "limit?", "offset?"]
    output: "WarehouseReceipt[]"
    side_effects: []

  - method: POST
    path: "/gin-ops/warehouse-receipts/{id}/cancel"
    description: "Cancel an ACTIVE receipt; bale returns to the gin floor"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: WarehouseReceipt
    side_effects: ["-> CANCELLED; bale custody ON_GIN_FLOOR; Warehouse.stored_bale_count -= 1"]

  # --- LoanPledge ---
  - method: POST
    path: "/gin-ops/loan-pledges"
    description: "Pledge an ACTIVE/RELEASED receipt for a CCC marketing assistance loan"
    roles: [CoopAccountant]
    code: 201
    input: [warehouse_receipt_id]
    output: LoanPledge
    side_effects:
      - "pledge ACTIVE with pinned loan_rate_points and principal_cents"
      - "receipt -> PLEDGED"
      - "posts LedgerEntry LOAN_ADVANCE (+principal); recomputes Grower.credit_balance_cents"

  - method: GET
    path: "/gin-ops/loan-pledges/{id}"
    description: "Get a loan pledge"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: LoanPledge
    side_effects: []

  - method: GET
    path: "/gin-ops/warehouse-receipts/{id}/loan-pledges"
    description: "List pledges against a receipt"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoanPledge[]"
    side_effects: []

  - method: POST
    path: "/gin-ops/loan-pledges/{id}/redeem"
    description: "Repay principal + accrued simple interest; receipt RELEASED"
    roles: [CoopAccountant]
    code: 200
    input: []
    output: LoanPledge
    side_effects:
      - "interest_cents per loan_principal_and_interest; -> REPAID"
      - "receipt PLEDGED -> RELEASED"
      - "posts LedgerEntry LOAN_REPAYMENT (-(principal+interest)); recomputes Grower.credit_balance_cents"

  - method: POST
    path: "/gin-ops/loan-pledges/{id}/forfeit"
    description: "Forfeit the collateral to CCC; receipt and bale leave storage"
    roles: [CoopAccountant]
    code: 200
    input: []
    output: LoanPledge
    side_effects:
      - "-> FORFEITED; receipt -> FORFEITED; bale custody SHIPPED; stored count -= 1"
      - "posts LedgerEntry STORAGE_CHARGE per storage_charge (if charge > 0); recomputes Grower.credit_balance_cents"

  # --- SeedSale ---
  - method: POST
    path: "/gin-ops/seed-sales"
    description: "Sell a reconciled shift's pooled seed; allocates proceeds per grower"
    roles: [CoopAccountant]
    code: 201
    input: [gin_shift_id, buyer_name, price_cents_per_lb]
    output: SeedSale
    side_effects:
      - "sold_lbs / net_pool_cents computed per seed_proceeds_credit"
      - "one LedgerEntry SEED_CREDIT per grower with modules in the shift; recomputes each Grower.credit_balance_cents"

  # --- Settlement ---
  - method: GET
    path: "/gin-ops/settlements/{id}"
    description: "Get a settlement (Grower role: own only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/gin-ops/settlements/{id}/finalize"
    description: "Recompute with FINAL variant; requires season fully ginned, classed, seed sold"
    roles: [CoopAccountant]
    code: 200
    input: []
    output: Settlement
    side_effects: ["DRAFT -> FINAL; computation_variant FINAL; lines recomputed per settlement_net"]

  - method: POST
    path: "/gin-ops/settlements/{id}/pay"
    description: "Pay a FINAL settlement; amount must equal net_payable_cents exactly"
    roles: [CoopAccountant]
    code: 200
    input: [amount_cents]
    output: Settlement
    side_effects:
      - "-> PAID; paid_amount_cents set"
      - "posts LedgerEntry PATRONAGE (+patronage_cents) and SETTLEMENT_PAYMENT (-net_payable_cents), both with settlement_id; recomputes Grower.credit_balance_cents"

  # --- ShippingOrder ---
  - method: POST
    path: "/gin-ops/shipping-orders"
    description: "Create a shipping order (dock window with 30-minute turnaround buffer)"
    roles: [Grower, WarehouseManager]
    code: 201
    input: [warehouse_id, grower_id, bale_ids, dock_number, load_start, load_end]
    output: ShippingOrder
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/gin-ops/shipping-orders/{id}"
    description: "Get a shipping order (Grower role: own only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: []
    output: ShippingOrder
    side_effects: []

  - method: GET
    path: "/gin-ops/shipping-orders"
    description: "Filtered shipping order list (Grower role: own only)"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["warehouse_id?", "grower_id?", "status?", "limit?", "offset?"]
    output: "ShippingOrder[]"
    side_effects: []

  - method: POST
    path: "/gin-ops/shipping-orders/{id}/confirm"
    description: "Confirm a DRAFT order; revalidates bale shippability"
    roles: [Grower, WarehouseManager]
    code: 200
    input: []
    output: ShippingOrder
    side_effects: ["DRAFT -> CONFIRMED"]

  - method: POST
    path: "/gin-ops/shipping-orders/{id}/ship"
    description: "Ship a CONFIRMED order; ends storage accrual and posts storage charges"
    roles: [WarehouseManager]
    code: 200
    input: []
    output: ShippingOrder
    side_effects:
      - "-> SHIPPED; each listed receipt -> SHIPPED; bales custody -> SHIPPED; stored count -= len(bale_ids)"
      - "one LedgerEntry STORAGE_CHARGE per receipt per storage_charge (entries with 0 charge are not posted); recomputes Grower.credit_balance_cents"

  - method: POST
    path: "/gin-ops/shipping-orders/{id}/cancel"
    description: "Cancel a DRAFT or CONFIRMED order"
    roles: [Grower, WarehouseManager]
    code: 200
    input: []
    output: ShippingOrder
    side_effects: ["-> CANCELLED"]

  - method: GET
    path: "/gin-ops/shipping-orders/{id}/bales"
    description: "List bales on a shipping order, in bale_ids order"
    roles: [CoopAdmin, GinOperator, ClassingClerk, WarehouseManager, CoopAccountant, Grower]
    code: 200
    input: ["limit?", "offset?"]
    output: "Bale[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or Grower-role caller touches a resource outside their own grower chain" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum member, weight/price/range sanity failure (e.g. net_weight_lbs < 1, tare >= gross, price_cents_per_lb < 1, dock_number out of [1, dock_count])" }
  - { id: ERR_GROWER_NOT_FOUND, http: 404, condition: "grower id in path or body does not exist" }
  - { id: ERR_MODULE_NOT_FOUND, http: 404, condition: "module id in path does not exist" }
  - { id: ERR_BALE_NOT_FOUND, http: 404, condition: "bale id in path or bale_ids element does not exist" }
  - { id: ERR_GIN_SHIFT_NOT_FOUND, http: 404, condition: "gin shift id in path or body does not exist" }
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "warehouse id in path or body does not exist" }
  - { id: ERR_WAREHOUSE_RECEIPT_NOT_FOUND, http: 404, condition: "warehouse receipt id in path or body does not exist" }
  - { id: ERR_LOAN_PLEDGE_NOT_FOUND, http: 404, condition: "loan pledge id in path does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement id in path does not exist" }
  - { id: ERR_SHIPPING_ORDER_NOT_FOUND, http: 404, condition: "shipping order id in path does not exist" }
  - { id: ERR_GRADE_SCHEDULE_NOT_FOUND, http: 404, condition: "grade schedule id in path does not exist" }
  - { id: ERR_LEDGER_ENTRY_NOT_FOUND, http: 404, condition: "ledger entry id in path does not exist" }
  - { id: ERR_MODULE_NOT_QUEUABLE, http: 409, condition: "queue attempted from a state other than RECEIVED" }
  - { id: ERR_MODULE_NOT_CONDITIONABLE, http: 409, condition: "condition attempted from QUEUED/GINNING/GINNED/REJECTED" }
  - { id: ERR_MODULE_NOT_GINNABLE, http: 409, condition: "start-ginning attempted from a state other than QUEUED" }
  - { id: ERR_MODULE_NOT_COMPLETABLE, http: 409, condition: "complete-ginning attempted from a state other than GINNING" }
  - { id: ERR_MODULE_NOT_REJECTABLE, http: 409, condition: "reject attempted from QUEUED/GINNING/GINNED/REJECTED" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "queue/start-ginning/complete-ginning/close attempted while shift is not OPEN" }
  - { id: ERR_MODULES_STILL_GINNING, http: 409, condition: "close attempted while a module of the shift is GINNING" }
  - { id: ERR_SHIFT_NOT_CLOSED, http: 409, condition: "reconcile attempted while shift is not CLOSED" }
  - { id: ERR_SHIFT_NOT_RECONCILED, http: 409, condition: "seed sale attempted while shift is not RECONCILED" }
  - { id: ERR_SHIFT_ALREADY_SOLD, http: 409, condition: "a SeedSale already exists for this shift" }
  - { id: ERR_MASS_BALANCE_VIOLATION, http: 422, condition: "at close: SUM(module net) != lint + seed + waste, or actual_lint_scale_lbs != SUM(module actual_lint_lbs)" }
  - { id: ERR_DUPLICATE_TICKET_NUMBER, http: 409, condition: "(grower_id, season, ticket_number) already exists" }
  - { id: ERR_DUPLICATE_MODULE_TAG, http: 409, condition: "(season, module_tag) already exists" }
  - { id: ERR_DUPLICATE_BALE_TAG, http: 409, condition: "bale_tag already exists (including within the same payload)" }
  - { id: ERR_FOREIGN_MATTER_LIMIT_EXCEEDED, http: 422, condition: "foreign_matter_pct > 10.0 at module create" }
  - { id: ERR_MOISTURE_LIMIT_EXCEEDED, http: 422, condition: "moisture_pct > 12.0 at queue (12.0 exactly passes)" }
  - { id: ERR_SEASON_MISMATCH, http: 422, condition: "module.season != shift.season at queue" }
  - { id: ERR_GRADE_WINDOW_OVERLAP, http: 409, condition: "new GradeSchedule window overlaps an existing window for the same grade_code (half-open; adjacency allowed)" }
  - { id: ERR_NO_ACTIVE_GRADE_SCHEDULE, http: 422, condition: "no GradeSchedule covers result_date (classing) or pledge date for the bale's grade" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_bale_version / expected_grower_version does not match the current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "receipt issuer's X-User-ID equals the bale's module.ginned_by_user_id" }
  - { id: ERR_WAREHOUSE_AT_CAPACITY, http: 422, condition: "stored_bale_count == capacity_bales at receipt issuance" }
  - { id: ERR_RECEIPT_NOT_ISSUABLE, http: 409, condition: "bale custody not ON_GIN_FLOOR, or a non-terminal receipt already exists for the bale" }
  - { id: ERR_RECEIPT_NOT_CANCELLABLE, http: 409, condition: "cancel attempted on a receipt not in ACTIVE" }
  - { id: ERR_RECEIPT_NOT_ACTIVE, http: 409, condition: "pledge attempted on a receipt not in {ACTIVE, RELEASED}" }
  - { id: ERR_BALE_NOT_CLASSED, http: 409, condition: "pledge attempted while bale classing_status != CLASSED" }
  - { id: ERR_LOAN_CAP_EXCEEDED, http: 402, condition: "season ACTIVE pledge principal + new principal > 50000000" }
  - { id: ERR_PLEDGE_NOT_ACTIVE, http: 409, condition: "redeem/forfeit attempted on a non-ACTIVE pledge" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "effective_to <= effective_from, or load_end <= load_start" }
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "same warehouse+dock non-cancelled order violates the 30-minute turnaround gap" }
  - { id: ERR_EMPTY_SHIPMENT, http: 400, condition: "bale_ids is empty" }
  - { id: ERR_MIXED_GROWER_SHIPMENT, http: 422, condition: "a bale in bale_ids belongs to a grower other than order grower_id" }
  - { id: ERR_BALE_WAREHOUSE_MISMATCH, http: 422, condition: "a bale's non-terminal receipt sits at a warehouse other than order warehouse_id" }
  - { id: ERR_BALE_NOT_SHIPPABLE, http: 409, condition: "at confirm/ship: bale custody != WAREHOUSED or its receipt is PLEDGED (or terminal)" }
  - { id: ERR_ORDER_NOT_CONFIRMABLE, http: 409, condition: "confirm attempted from a state other than DRAFT" }
  - { id: ERR_ORDER_NOT_SHIPPABLE, http: 409, condition: "ship attempted from a state other than CONFIRMED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel attempted from SHIPPED (or CANCELLED)" }
  - { id: ERR_UNGINNED_MODULES_EXIST, http: 409, condition: "settlement finalize with a season module not in {GINNED, REJECTED}" }
  - { id: ERR_UNCLASSED_BALES_EXIST, http: 409, condition: "settlement finalize with a season bale classing_status != CLASSED" }
  - { id: ERR_UNSOLD_SEED_EXISTS, http: 409, condition: "settlement finalize with a RECONCILED season shift lacking a SeedSale" }
  - { id: ERR_SETTLEMENT_NOT_FINALIZABLE, http: 409, condition: "finalize attempted from non-DRAFT" }
  - { id: ERR_SETTLEMENT_ALREADY_PAID, http: 409, condition: "settlement create attempted while a PAID settlement exists for (grower, season)" }
  - { id: ERR_SETTLEMENT_NOT_FINAL, http: 409, condition: "pay attempted from non-FINAL" }
  - { id: ERR_OVERPAYMENT, http: 402, condition: "pay amount_cents != settlement.net_payable_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CoopAdmin
    description: "Co-op platform administrator; owns configuration (growers, grade schedules, warehouses) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /gin-ops/growers"
      - "POST /gin-ops/grade-schedules"
      - "POST /gin-ops/warehouses"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: GinOperator
    description: "Gin floor operator; receives modules, runs shifts, records bales"
    identity: opaque
    exclusive_operations:
      - "POST /gin-ops/gin-shifts and /close /reconcile"
      - "POST /gin-ops/modules and /condition /queue /start-ginning /complete-ginning /reject"
    shared_operations:
      - "all GET endpoints"

  - name: ClassingClerk
    description: "Records USDA classing results against bales"
    identity: opaque
    exclusive_operations:
      - "POST /gin-ops/bales/{id}/classing-results"
    shared_operations:
      - "all GET endpoints"

  - name: WarehouseManager
    description: "Warehouse superintendent; issues/cancels receipts, ships orders"
    identity: opaque
    exclusive_operations:
      - "POST /gin-ops/warehouse-receipts and /cancel"
      - "POST /gin-ops/shipping-orders/{id}/ship"
    shared_operations:
      - "all GET endpoints"
      - "POST /gin-ops/shipping-orders and /confirm /cancel (shared with Grower)"

  - name: CoopAccountant
    description: "Co-op accountant; seed sales, loan pledges, settlements, ledger adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /gin-ops/loan-pledges and /redeem /forfeit"
      - "POST /gin-ops/seed-sales"
      - "POST /gin-ops/growers/{id}/settlements, /settlements/{id}/finalize, /settlements/{id}/pay"
      - "POST /gin-ops/growers/{id}/ledger-adjustments"
    shared_operations:
      - "all GET endpoints"

  - name: Grower
    description: "Co-op member; reads own resources, requests shipping of own bales"
    identity: "entity_backed:Grower"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints restricted to own grower chain (ERR_FORBIDDEN otherwise)"
      - "POST /gin-ops/shipping-orders and /confirm /cancel for own grower_id"
