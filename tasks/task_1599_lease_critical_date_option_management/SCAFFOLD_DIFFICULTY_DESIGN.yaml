      - name: holdover_settlement_gated_by_lease_holdover_state
        grounds:
          - state_machines.Lease.HOLDOVER_to_ACTIVE
          - validations[priority=16]
          - errors[ERR_NOT_IN_HOLDOVER]
        distinguishing_aspect: |
          Pair Amendment→Lease: a HOLDOVER_SETTLEMENT amendment can only execute
          while the lease is in HOLDOVER; executing it on an ACTIVE lease fails
          with ERR_NOT_IN_HOLDOVER — Amendment's execute path depends on Lease's
          state (a different entity pair than Option→Lease).
