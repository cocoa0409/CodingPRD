  - rule_id: compensating_invariant
    instances:
      - name: session_seat_inventory_conserved_through_hold_pay_cancel_refund
        grounds:
          - state_machines.TicketOrder
          - entities.Session.fields.seats_available
        distinguishing_aspect: |
          Conserved quantity = seat inventory: seats_held + seats_sold + seats_available ==
          capacity after every forward/compensating action (hold, pay, cancel-held,
          cancel-paid-refund). Ends exactly back at 100/0/0.
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; session capacity 100; clock default (ADVANCE tier)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/sessions", payload: { event_id: "${ev}", name: "Sat AM", starts_at: "2026-09-05T08:00:00Z", ends_at: "2026-09-05T12:00:00Z", capacity: 100 }, as: EventDirector, captures: { se: $.data.id } }
          trigger:
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 25 }, as: Spectator, as_user_id: "spec-1", captures: { o1: $.data.id } }
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 10 }, as: Spectator, as_user_id: "spec-2", captures: { o2: $.data.id } }
            - { call: "POST /api/ticket-orders/${o2}/pay", payload: {}, as: Spectator, as_user_id: "spec-2" }
            - { call: "POST /api/ticket-orders/${o1}/cancel", payload: {}, as: Spectator, as_user_id: "spec-1" }
            - { call: "POST /api/ticket-orders/${o2}/cancel", payload: {}, as: Spectator, as_user_id: "spec-2" }
            - { call: "GET /api/sessions/${se}", payload: {}, as: EventDirector, captures: { held: "$.data.seats_held", sold: "$.data.seats_sold", avail: "$.data.seats_available" } }
          assert:
            - "after hold 25 + hold 10: seats_held == 35, seats_sold == 0, seats_available == 65"
            - "after pay of the 10-order: seats_held == 25, seats_sold == 10, seats_available == 65"
            - "after cancel of HELD 25-order: seats_held == 0, seats_sold == 10, seats_available == 90"
            - "after cancel of PAID 10-order (REFUNDED): seats_held == 0, seats_sold == 0, seats_available == 100 — full conservation"

