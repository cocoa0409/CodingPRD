      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no/invalid X-User-Role and X-User-ID headers (role Anonymous) returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB; the call carries no valid auth headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /license-programs"
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401; error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_restructure_financing_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[financing-restructure-stale-enrollment]"
          - "errors[ERR_STALE_ENROLLMENT_VERSION]"
        distinguishing_aspect: "Restructuring financing twice with the SAME observed enrollment version: the first succeeds (version bumps), the second reusing the stale version returns ERR_STALE_ENROLLMENT_VERSION (412)."
        test_recipe:
          setup: ["Financed DRAFT enrollment; client observes its version once and uses it for two restructure calls."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "OCC", title: "Occ", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", total_price_cents: 120000, down_payment_pct: 0.20, financing_months: 6, included_mock_credits: 8, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "occ@x.com", full_name: "Occ" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: true }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id", ev: "$.data.version" }
            - call: "POST /enrollments/${enr_id}/restructure-financing"
              payload: { new_financing_months: 4, expected_enrollment_version: "${ev}" }
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/restructure-financing"
              payload: { new_financing_months: 3, expected_enrollment_version: "${ev}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 412; error_id == ERR_STALE_ENROLLMENT_VERSION; financing schedule unchanged by the second call"

      - name: occ_restructure_financing_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[financing-restructure-stale-enrollment]"
          - "entities.Enrollment.fields.version"
        distinguishing_aspect: "Restructuring with the current enrollment version succeeds, rebuilds the schedule, and increments Enrollment.version by 1."
        test_recipe:
          setup: ["Financed DRAFT enrollment (PLUS, total 120000)."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "OCC2", title: "Occ2", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", total_price_cents: 120000, down_payment_pct: 0.20, financing_months: 6, included_mock_credits: 8, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "occ2@x.com", full_name: "Occ2" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: true }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id", ev: "$.data.version" }
          trigger:
            - call: "POST /enrollments/${enr_id}/restructure-financing"
              payload: { new_financing_months: 3, expected_enrollment_version: "${ev}" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { nv: "$.data.version" }
          assert:
            - "HTTP 200; Enrollment.${enr_id}.version == 2 (was 1); new schedule has down 24000 then 3 installments of 32000"

      - name: dual_variant_reconciliation_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.readiness_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / readiness_conservative_vs_projected_diverges_on_enrollment
          rationale: "Conservative vs projected divergence is the named §1.8 dual-variant instance."

      - name: cascading_side_effects_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Enrollment.FAILED_to_REFUNDED]
        excluded_because:
          difficulty_instance: transitive_cascade / moneyback_approval_cascades_enrollment_installments_and_cohort_depth3
          rationale: "The depth-3 cascade is the named §1.8 instance."

      - name: derived_field_reconciliation_stub
        claim_type: derived_field_reconciliation
        grounds: [calculations.financing_ledger]
        excluded_because:
          difficulty_instance: compensating_invariant / withdraw_voids_installments_conserves_paid_plus_balance
          rationale: "financing_paid/balance reconciliation on withdraw is the named §1.8 instance."

      - name: rate_threshold_triggers_stub
        claim_type: rate_threshold_triggers
        grounds: [calculations.pass_guarantee_eligibility]
        excluded_because:
          difficulty_instance: boundary_precision_check / readiness_threshold_inclusive_75_qualifies_74_does_not
          rationale: "The readiness >= 75 threshold boundary is the named §1.8 instance."

