# =============================================================================
# 1.9 Scaffold Corner Design - forensic-laboratory-casework
# =============================================================================
# Breadth probe. Walked row-by-row against references/claim-extraction-guide.md
# and this scaffold's SS1.1-SS1.7 surface. Conventions shared with
# SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#
#   * api_prefix is /lab; the logical clock starts at exactly 2026-08-01T00:00:00Z
#     and every recipe that depends on time pins it with
#     POST /lab/_clock/set_current_utc as its first call.
#   * `as:` is the X-Role header; `as_user_id:` is X-User-ID. It is pinned wherever
#     identity is load-bearing (every Analyst-role call, and every review call whose
#     segregation-of-duties rule compares reviewer_operator_id) and omitted for the
#     other opaque roles.
#   * Every numeric assert literal was produced by executing the relevant
#     SS1.3 formula with Decimal ROUND_HALF_UP.
#   * `excluded_because:` stubs carry no test_recipe; the difficulty_instance they
#     name exists by that exact name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
#   * Instance names are unique across the union of both design files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: case_creation_returns_derived_priority_and_both_state_axes
        claim_type: creation
        grounds:
          - entities.Case
          - endpoints[POST /lab/cases]
          - calculations.case_priority_scoring
        distinguishing_aspect: "A minimal OTHER-category submission with no custody flag and no dates scores exactly SEVERITY_POINTS[OTHER] == 4.00, derives P3_ROUTINE, and comes back with workflow_status SUBMITTED and discovery_status NONE - the two state axes are independent from the first response."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
            - "Hand-executed formula: base_points 4 + 0 custody; not violent so weighted_base round_half_up(4 * 1.00, 2) == 4.00; temporal_points 0.00; priority_score 4.00; no deadline and not violent so priority_class P3_ROUTINE."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0001", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Case.${c1}.priority_score == 4.00"
            - "Case.${c1}.priority_class == P3_ROUTINE"
            - "Case.${c1}.violent_crime_flag == false"
            - "Case.${c1}.suspect_in_custody == false"
            - "Case.${c1}.workflow_status == SUBMITTED"
            - "Case.${c1}.discovery_status == NONE"
            - "Case.${c1}.received_at_utc == 2026-08-01T00:00:00Z"
            - "Case.${c1}.open_examination_request_count == 0"
            - "Case.${c1}.released_examination_request_count == 0"
            - "Case.${c1}.version == 1"
            - "Case.${c1}.gross_turnaround_days is null and Case.${c1}.net_turnaround_days is null"

      - name: analyst_creation_applies_declared_defaults_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Analyst.fields.employment_status
          - entities.Analyst.fields.competency_level
          - entities.Analyst.fields.training_hours_per_week
          - endpoints[POST /lab/analysts]
        distinguishing_aspect: "Omitting employment_status, competency_level and training_hours_per_week yields exactly the SS1.1 defaults ACTIVE, 1 and 0.00 - and because training is 0.00 the derived available_hours equals the full weekly_capacity_hours 30.00 with casework_training_ratio pinned at 0.00 rather than a division by zero."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
            - "Only the three genuinely required inputs are supplied: full_name, disciplines and weekly_capacity_hours."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/analysts"
              payload: { full_name: "Nia Sørensen", disciplines: ["TRACE"], weekly_capacity_hours: 30.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "GET /lab/analysts/${a1}/workload"
              payload: {}
              as: LabDirector
          assert:
            - "HTTP status == 201"
            - "Analyst.${a1}.employment_status == ACTIVE"
            - "Analyst.${a1}.competency_level == 1"
            - "Analyst.${a1}.training_hours_per_week == 0.00"
            - "Analyst.${a1}.qualification_state == QUALIFIED"
            - "Analyst.${a1}.consecutive_pt_failures == 0"
            - "Analyst.${a1}.assigned_casework_hours == 0.00"
            - "Analyst.${a1}.probation_entered_at_utc is null and Analyst.${a1}.suspended_at_utc is null"
            - "workload of ${a1}: available_hours == 30.00"
            - "workload of ${a1}: projected_utilization_pct == 0.00"
            - "workload of ${a1}: casework_training_ratio == 0.00"

      - name: evidence_item_creation_rejects_client_supplied_custody_status
        claim_type: system_fields
        grounds:
          - entities.EvidenceItem.fields.custody_status
          - entities.EvidenceItem.fields.checkout_count
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "custody_status and checkout_count are system/computed, and SS1.4 priority 4 forbids unknown body fields outright, so a client that tries to seed custody_status gets 400 ERR_INVALID_REQUEST rather than a silently ignored field - and no EvidenceItem row is created."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z; one SUBMITTED case C1 exists."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0002", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed envelope", item_type: "TRACE_MEDIA", seal_intact: true, custody_status: "IN_ANALYSIS" }
              as: EvidenceTechnician
              captures: { err_id: $.data.error_id }
            - call: "GET /lab/evidence-items"
              payload: { case_id: "${c1}" }
              as: EvidenceTechnician
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "the listing returns total_count == 0"
            - "Case.${c1}.workflow_status == SUBMITTED"

      - name: examination_request_discipline_and_estimated_hours_are_computed_from_the_method
        claim_type: computed_fields
        grounds:
          - entities.ExaminationRequest.fields.discipline
          - entities.ExaminationRequest.fields.estimated_hours
          - calculations.exam_request_hour_estimate
          - endpoints[POST /lab/examination-requests]
        distinguishing_aspect: "Neither discipline nor estimated_hours is a client input: discipline is copied from the Method (CHEMISTRY) and estimated_hours is round_half_up(2.50 * 3, 2) == 7.50, while the request itself starts QUEUED with revision_round 0 and vendor_custody_days 0.00."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 2.50, max_items_per_request 10."
            - "Case C1 (OTHER) ACCEPTED with one CHEMICAL vault item E1."
            - "Hand-executed formula: round_half_up(2.50 * 3, 2) == 7.50."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "Presumptive Colour Test Battery", discipline: "CHEMISTRY", standard_hours_per_item: 2.50, min_competency_level: 2, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-COL-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 4.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0003", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed powder packet", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
          trigger:
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 3 }
              as: CaseManager
              captures: { r1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ExaminationRequest.${r1}.discipline == CHEMISTRY"
            - "ExaminationRequest.${r1}.estimated_hours == 7.50"
            - "ExaminationRequest.${r1}.status == QUEUED"
            - "ExaminationRequest.${r1}.revision_round == 0"
            - "ExaminationRequest.${r1}.vendor_custody_days == 0.00"
            - "ExaminationRequest.${r1}.assigned_analyst_id is null"
            - "ExaminationRequest.${r1}.actual_hours_logged is null"
            - "ExaminationRequest.${r1}.requested_at_utc == 2026-08-01T00:00:00Z"
            - "Case.${c1}.open_examination_request_count == 1"

      - name: case_read_returns_the_stored_submission_and_priority_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /lab/cases/{case_id}]
          - entities.Case.fields.court_date_utc
          - calculations.case_priority_scoring
        distinguishing_aspect: "The read echoes every stored input and the derived score for a BURGLARY case with a court date 19 days out: weighted_base 16.00 plus temporal_points 10.00 == 26.00, and priority_class stays P3_ROUTINE because a court date is not a statutory deadline and burglary is not a violent category."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Hand-executed formula: days_to_court floor(1641600 / 86400) == 19 so court_points 10; deadline_points 0; temporal_points round_half_up(10 + 0 * 0.50, 2) == 10.00; base_points 16; not violent so weighted_base 16.00; priority_score 26.00."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "B-2026-0004", submitting_agency: "COUNTY SO", offense_category: "BURGLARY", suspect_in_custody: false, court_date_utc: "2026-08-20T00:00:00Z" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /lab/cases/${c1}"
              payload: {}
              as: EvidenceTechnician
          assert:
            - "HTTP status == 200"
            - "the response data id == ${c1}"
            - "Case.${c1}.agency_case_number == B-2026-0004"
            - "Case.${c1}.submitting_agency == COUNTY SO"
            - "Case.${c1}.offense_category == BURGLARY"
            - "Case.${c1}.court_date_utc == 2026-08-20T00:00:00Z"
            - "Case.${c1}.statutory_deadline_utc is null"
            - "Case.${c1}.priority_score == 26.00"
            - "Case.${c1}.priority_class == P3_ROUTINE"
            - "Case.${c1}.violent_crime_flag == false"

      - name: examination_request_listing_filters_by_case_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /lab/examination-requests]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The case_id filter and the limit/offset window compose: two of the three requests belong to C1, so the filtered read reports total_count 2, and limit 1 returns one row with has_more true while offset 1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 1.00, max_items_per_request 10."
            - "Case C1 ACCEPTED with two CHEMICAL vault items, each carrying one QUEUED request."
            - "Case C2 ACCEPTED with one CHEMICAL vault item carrying one QUEUED request."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "Presumptive Colour Test Battery", discipline: "CHEMISTRY", standard_hours_per_item: 1.00, min_competency_level: 2, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-COL-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 4.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0005", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed packet one", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed packet two", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e2: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0006", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c2: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c2}", item_number: "1", item_description: "Sealed packet three", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e3: $.data.id }
            - call: "POST /lab/cases/${c2}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e2}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r2: $.data.id }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c2}", evidence_item_id: "${e3}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /lab/examination-requests"
              payload: { case_id: "${c1}" }
              as: CaseManager
            - call: "GET /lab/examination-requests"
              payload: { case_id: "${c1}", limit: 1, offset: 0 }
              as: CaseManager
            - call: "GET /lab/examination-requests"
              payload: { case_id: "${c1}", limit: 1, offset: 1 }
              as: CaseManager
          assert:
            - "first read: total_count == 2 and the returned ids are exactly {${r1}, ${r2}}"
            - "first read: ${r3} is absent from the returned rows"
            - "second read: exactly 1 row, limit == 1, offset == 0, total_count == 2, has_more == true"
            - "third read: exactly 1 row, offset == 1, total_count == 2, has_more == false"
            - "second and third reads return different ids, together covering {${r1}, ${r2}}"

      - name: analyst_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_ANALYST_NOT_FOUND]
          - endpoints[GET /lab/analysts/{analyst_id}]
        distinguishing_aspect: "A syntactically valid but unpersisted analyst id resolves to 404 ERR_ANALYST_NOT_FOUND - the entity-specific code, not the generic ERR_INVALID_REQUEST - and this holds on an empty analyst table."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z; no Analyst row has ever been created."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "GET /lab/analysts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LabDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_ANALYST_NOT_FOUND"
            - "${err_id} != ERR_INVALID_REQUEST"

      - name: examination_request_creation_without_item_count_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /lab/examination-requests]
        distinguishing_aspect: "item_count has no SS1.1 default, so omitting it is a schema violation caught at SS1.4 priority 4 with 400 ERR_INVALID_REQUEST before any referential or state check runs - the case's open_examination_request_count stays 0."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 VALIDATED, CHEMISTRY; Case C1 ACCEPTED with one CHEMICAL vault item E1."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "Presumptive Colour Test Battery", discipline: "CHEMISTRY", standard_hours_per_item: 1.00, min_competency_level: 2, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-COL-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 20, precision_cv_pct: 4.00, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0007", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed packet", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
          trigger:
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}" }
              as: CaseManager
              captures: { err_id: $.data.error_id }
            - call: "GET /lab/examination-requests"
              payload: { case_id: "${c1}" }
              as: CaseManager
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "the listing returns total_count == 0"
            - "Case.${c1}.open_examination_request_count == 0"
            - "Case.${c1}.workflow_status == ACCEPTED"

      - name: analyst_creation_with_out_of_range_competency_level_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Analyst.fields.competency_level
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "competency_level is constrained to 1..5, so 6 is refused with 400 ERR_INVALID_REQUEST at the schema layer - the same code an unknown enum member of disciplines would produce - and no Analyst row is persisted."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/analysts"
              payload: { full_name: "Out Of Range", disciplines: ["TRACE"], competency_level: 6, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { err_id: $.data.error_id }
            - call: "GET /lab/analysts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LabDirector
          assert:
            - "HTTP status == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "the follow-up read still returns 404 ERR_ANALYST_NOT_FOUND, confirming no row was minted"

      - name: review_record_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.ReviewRecord
          - endpoints[GET /lab/review-records/{review_record_id}]
          - endpoints[GET /lab/review-records]
        distinguishing_aspect: "ReviewRecord declares common_fields false: the created row carries id, created_at and the audit fields but NO version field and no update or delete endpoint anywhere in SS1.5, and its revision_round_snapshot freezes the request's revision_round 0 at the moment of signing."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analysts A1 (author) and A2 (reviewer), both CHEMISTRY, competency 4, capacity 40.00, training 8.00."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 2.00, max_items_per_request 10."
            - "Case C1 (OTHER) ACCEPTED with one CHEMICAL vault item E1; request R1 assigned to A1, started and completed with actual_hours 3.00, so R1 rests in TECH_REVIEW at revision_round 0."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Author Analyst", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "Reviewer Analyst", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0008", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed packet", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /lab/examination-requests/${r1}/assignments"
              payload: { analyst_id: "${a1}", expected_examination_request_version: "${r1_v}", assignment_reason: "MANUAL" }
              as: CaseManager
            - call: "POST /lab/examination-requests/${r1}/start-analysis"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/examination-requests/${r1}/complete-analysis"
              payload: { actual_hours: 3.00, evidence_consumed: false }
              as: Analyst
              as_user_id: "${a1}"
          trigger:
            - call: "POST /lab/examination-requests/${r1}/technical-review"
              payload: { decision: "AGREE", rationale: "Peer verification concurs." }
              as: Analyst
              as_user_id: "${a2}"
              captures: { rr1: $.data.id }
            - call: "GET /lab/review-records/${rr1}"
              payload: {}
              as: QualityManager
            - call: "GET /lab/review-records"
              payload: { examination_request_id: "${r1}" }
              as: QualityManager
          assert:
            - "the technical-review call returns HTTP 201"
            - "the ReviewRecord read response contains no version field"
            - "ReviewRecord.${rr1}.review_type == TECHNICAL"
            - "ReviewRecord.${rr1}.decision == AGREE"
            - "ReviewRecord.${rr1}.reviewer_analyst_id == ${a2}"
            - "ReviewRecord.${rr1}.reviewer_operator_id == ${a2}"
            - "ReviewRecord.${rr1}.revision_round_snapshot == 0"
            - "ReviewRecord.${rr1}.recorded_at_utc == 2026-08-01T00:00:00Z"
            - "the listing returns total_count == 1"
            - "no PATCH, PUT or DELETE endpoint for /lab/review-records exists anywhere in SS1.5"

      - name: evidence_item_creation_with_unknown_case_id_is_rejected
        claim_type: parent_relationships
        grounds:
          - entities.EvidenceItem.fields.case_id
          - validations[priority=5]
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "A body-carried foreign key is checked at SS1.4 priority 5 with the parent entity's own 404 code ERR_CASE_NOT_FOUND, distinct from the priority-3 path-segment check and from the priority-10 ERR_REFERENTIAL_MISMATCH that fires when the row exists but belongs elsewhere."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z; no Case row exists."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
          trigger:
            - call: "POST /lab/evidence-items"
              payload: { case_id: "00000000-0000-0000-0000-0000000000aa", item_number: "1", item_description: "Sealed envelope", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err_id} == ERR_CASE_NOT_FOUND"
            - "${err_id} != ERR_REFERENTIAL_MISMATCH"

      - name: proficiency_test_junction_is_reachable_from_both_analyst_and_method
        claim_type: graph
        grounds:
          - entities.ProficiencyTest.fields.analyst_id
          - entities.ProficiencyTest.fields.method_id
          - endpoints[GET /lab/proficiency-tests]
          - complexity_profile.entity_topology
        distinguishing_aspect: "ProficiencyTest is the Analyst-to-Method junction of the graph topology: the same row is reachable by filtering the collection on analyst_id and independently on method_id, and two analysts sharing one method produce two junction rows that each filter cleanly."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analysts A1 and A2, both CHEMISTRY, competency 4; Method M1 VALIDATED, CHEMISTRY."
            - "Proficiency tests PT1 (A1, M1, cycle 2026-Q3) and PT2 (A2, M1, cycle 2026-Q3), both still ASSIGNED."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
              payload: { full_name: "Junction One", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/analysts"
              payload: { full_name: "Junction Two", disciplines: ["CHEMISTRY"], competency_level: 4, weekly_capacity_hours: 40.00, training_hours_per_week: 8.00 }
              as: LabDirector
              captures: { a2: $.data.id }
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-Q3", due_utc: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { pt1: $.data.id }
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a2}", method_id: "${m1}", test_cycle: "2026-Q3", due_utc: "2026-09-01T00:00:00Z" }
              as: QualityManager
              captures: { pt2: $.data.id }
          trigger:
            - call: "GET /lab/proficiency-tests"
              payload: { analyst_id: "${a1}" }
              as: QualityManager
            - call: "GET /lab/proficiency-tests"
              payload: { method_id: "${m1}" }
              as: QualityManager
            - call: "GET /lab/proficiency-tests"
              payload: { analyst_id: "${a2}", test_cycle: "2026-Q3" }
              as: QualityManager
          assert:
            - "first read: total_count == 1 and the single row id == ${pt1}"
            - "second read: total_count == 2 and the returned ids are exactly {${pt1}, ${pt2}}"
            - "third read: total_count == 1 and the single row id == ${pt2}"
            - "ProficiencyTest.${pt1}.status == ASSIGNED and ProficiencyTest.${pt1}.result is null"
            - "ProficiencyTest.${pt1}.late_submission == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: evidence_item_initial_custody_status_is_in_vault
        claim_type: initial_state
        grounds:
          - state_machines.EvidenceItem
          - entities.EvidenceItem.fields.custody_status
          - entities.EvidenceItem.fields.checkout_count
        distinguishing_aspect: "A freshly logged item begins at the machine's declared initial_state IN_VAULT with checkout_count 0 and logged_at_utc stamped from the logical clock - creation alone never checks anything out."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; one SUBMITTED case C1 exists."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0101", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed fibre tape lift", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
          assert:
            - "HTTP status == 201"
            - "EvidenceItem.${e1}.custody_status == IN_VAULT"
            - "EvidenceItem.${e1}.checkout_count == 0"
            - "EvidenceItem.${e1}.seal_intact == true"
            - "EvidenceItem.${e1}.logged_at_utc == 2026-08-01T00:00:00Z"
            - "EvidenceItem.${e1}.version == 1"

      - name: case_accept_from_the_rejected_state_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Case.SUBMITTED_to_REJECTED
          - validations[priority=8]
          - errors[ERR_CASE_INVALID_STATE]
        distinguishing_aspect: "REJECTED is a terminal state of the casework axis, so accept has no declared transition from it and returns 409 ERR_CASE_INVALID_STATE while accepted_at_utc stays null and the cascaded RETURNED custody of the item is untouched."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Case C1 has one vault item and was rejected at intake, so workflow_status is REJECTED and cascade hop 1 moved the item IN_VAULT -> RETURNED."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0102", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed envelope", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/reject"
              payload: { rejection_reason: "Submitting agency withdrew the request for examination." }
              as: EvidenceTechnician
          trigger:
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == ERR_CASE_INVALID_STATE"
            - "Case.${c1}.workflow_status == REJECTED"
            - "Case.${c1}.accepted_at_utc is null"
            - "Case.${c1}.rejection_reason == Submitting agency withdrew the request for examination."
            - "EvidenceItem.${e1}.custody_status == RETURNED"

      - name: case_rejection_cascades_every_vault_item_to_returned
        claim_type: cascade_down
        grounds:
          - state_machines.Case.SUBMITTED_to_REJECTED
          - state_machines.EvidenceItem.IN_VAULT_to_RETURNED
          - endpoints[POST /lab/cases/{case_id}/reject]
        distinguishing_aspect: "One reject call moves BOTH of the case's IN_VAULT items to RETURNED in the same request - the cascade is fan-out over all children, not just the first - and each item's version increments while checkout_count stays 0."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; case C1 is SUBMITTED with two IN_VAULT items E1 and E2."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0103", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed envelope one", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "2", item_description: "Sealed envelope two", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /lab/cases/${c1}/reject"
              payload: { rejection_reason: "Chain-of-custody paperwork incomplete at the counter." }
              as: EvidenceTechnician
            - call: "GET /lab/evidence-items"
              payload: { case_id: "${c1}", custody_status: "RETURNED" }
              as: EvidenceTechnician
          assert:
            - "HTTP status == 200"
            - "Case.${c1}.workflow_status == REJECTED"
            - "EvidenceItem.${e1}.custody_status == RETURNED"
            - "EvidenceItem.${e2}.custody_status == RETURNED"
            - "EvidenceItem.${e1}.checkout_count == 0 and EvidenceItem.${e2}.checkout_count == 0"
            - "the filtered listing returns total_count == 2"

      - name: case_accept_preconditions_reject_empty_and_broken_seal_submissions
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Case.SUBMITTED_to_ACCEPTED
          - validations[priority=11]
          - errors[ERR_CASE_HAS_NO_EVIDENCE]
          - errors[ERR_EVIDENCE_SEAL_BROKEN]
        distinguishing_aspect: "The two accept preconditions produce two distinct 409 codes on two distinct cases: an item-less case yields ERR_CASE_HAS_NO_EVIDENCE, while a case whose single item has seal_intact false yields ERR_EVIDENCE_SEAL_BROKEN - and a third case with an intact seal accepts, proving neither refusal is a blanket block."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Case CEMPTY is SUBMITTED with zero items."
            - "Case CBROKEN is SUBMITTED with exactly one item whose seal_intact is false."
            - "Case CGOOD is SUBMITTED with exactly one item whose seal_intact is true."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0104", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c_empty: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0105", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c_broken: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c_broken}", item_number: "1", item_description: "Torn evidence bag", item_type: "TRACE_MEDIA", seal_intact: false }
              as: EvidenceTechnician
              captures: { e_broken: $.data.id }
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0106", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c_good: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c_good}", item_number: "1", item_description: "Intact sealed bag", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
              captures: { e_good: $.data.id }
          trigger:
            - call: "POST /lab/cases/${c_empty}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { err_empty: $.data.error_id }
            - call: "POST /lab/cases/${c_broken}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { err_broken: $.data.error_id }
            - call: "POST /lab/cases/${c_good}/accept"
              payload: { acceptance_note: "Seals verified against the submission form." }
              as: EvidenceTechnician
          assert:
            - "first trigger: HTTP status == 409 and ${err_empty} == ERR_CASE_HAS_NO_EVIDENCE"
            - "second trigger: HTTP status == 409 and ${err_broken} == ERR_EVIDENCE_SEAL_BROKEN"
            - "${err_empty} != ${err_broken}"
            - "Case.${c_empty}.workflow_status == SUBMITTED and Case.${c_broken}.workflow_status == SUBMITTED"
            - "third trigger: HTTP status == 200"
            - "Case.${c_good}.workflow_status == ACCEPTED"
            - "Case.${c_good}.accepted_at_utc == 2026-08-01T00:00:00Z"
            - "EvidenceItem.${e_broken}.custody_status == IN_VAULT and EvidenceItem.${e_good}.custody_status == IN_VAULT"

      - name: second_accept_of_the_same_case_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Case.SUBMITTED_to_ACCEPTED
          - validations[priority=8]
          - errors[ERR_CASE_INVALID_STATE]
        distinguishing_aspect: "Accept is not idempotent: the second call from ACCEPTED returns 409 ERR_CASE_INVALID_STATE, accepted_at_utc keeps its first value and Case.version stays at the value the first accept produced rather than incrementing again."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; case C1 has one intact vault item and has been accepted once."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/cases"
              payload: { agency_case_number: "O-2026-0107", submitting_agency: "METRO PD", offense_category: "OTHER" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Intact sealed bag", item_type: "TRACE_MEDIA", seal_intact: true }
              as: EvidenceTechnician
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { c1_v_after_first: $.data.version }
          trigger:
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
              captures: { err_id: $.data.error_id }
            - call: "GET /lab/cases/${c1}"
              payload: {}
              as: EvidenceTechnician
          assert:
            - "HTTP status == 409"
            - "${err_id} == ERR_CASE_INVALID_STATE"
            - "Case.${c1}.workflow_status == ACCEPTED"
            - "Case.${c1}.accepted_at_utc == 2026-08-01T00:00:00Z"
            - "the re-read version equals ${c1_v_after_first}"

      - name: method_retirement_cancels_only_the_queued_requests
        claim_type: conditional_cascade
        grounds:
          - state_machines.Method.VALIDATED_to_RETIRED
          - state_machines.ExaminationRequest.QUEUED_to_CANCELLED
          - entities.Case.fields.open_examination_request_count
        distinguishing_aspect: "The retire cascade is conditional on child state: the QUEUED request becomes CANCELLED while the ASSIGNED request on the same case and method is left untouched, so open_examination_request_count drops from 2 to exactly 1 and the assigned analyst keeps their encumbered 4.00 hours."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: CHEMISTRY, competency 4, capacity 40.00, training 8.00."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 2.00, max_items_per_request 10."
            - "Case C1 (OTHER) ACCEPTED with two CHEMICAL vault items E1 and E2."
            - "Request R1 (E1, item_count 2) stays QUEUED; request R2 (E2, item_count 2) is assigned to A1, so estimated_hours 4.00 is encumbered."
