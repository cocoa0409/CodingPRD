          - entities.CropCycle.fields.expected_weekly_yield_lbs
        test_recipe:
          setup:
            - "One 9450 sqft zone and one tomato variety whose ten-element curve is 0.4 0.8 1.1 1.3 1.3 1.2 1.0 0.9 0.7 0.5."
