              as_user_id: "${sv_inj}"
              captures: { sv_err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEVERE_NO_TOUCHUP"
            - "response http_status == 409"

      - name: touchup_limit_reached_after_two_rounds
        claim_type: cyclic
        grounds:
          - state_machines.ComplicationCase.OPEN_to_IN_TOUCHUP
          - errors[ERR_TOUCHUP_LIMIT_REACHED]
        distinguishing_aspect: "After two completed touch-up rounds (touchup_rounds==2 == MAX_TOUCHUP_ROUNDS), a third open-touchup returns ERR_TOUCHUP_LIMIT_REACHED (409)."
        test_recipe:
          setup: ["a MODERATE complication that has cycled OPEN->IN_TOUCHUP->OPEN->IN_TOUCHUP->OPEN (touchup_rounds==2)"]
          setup_api_calls:
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Tl Inj", license_number: "L-TL-I", role_kind: "INJECTOR" }
              as: ClinicAdmin
              captures: { tl_inj: $.data.id }
            - call: "POST /aesthetics/providers"
              payload: { full_name: "Tl Dir", license_number: "L-TL-D", role_kind: "MEDICAL_DIRECTOR" }
              as: ClinicAdmin
              captures: { tl_dir: $.data.id }
            - call: "POST /aesthetics/injectable-lots"
              payload: { product: "BOTOX", lot_number: "LOT-TL", expiration_date: "2026-12-01T00:00:00Z", total_units: 100 }
              as: ClinicAdmin
              captures: { tl_lot: $.data.id }
            - call: "POST /aesthetics/patients"
              payload: { full_name: "Tl Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { tl_pat: $.data.id }
            - call: "POST /aesthetics/consent-photos"
              payload: { patient_id: "${tl_pat}", kind: "CONSENT", storage_uri: "s3://tl-c", signed: true }
              as: Provider
              as_user_id: "${tl_inj}"
            - call: "POST /aesthetics/consultations"
              payload: { patient_id: "${tl_pat}", exam_provider_id: "${tl_inj}", chief_complaint: "x" }
              as: Provider
              as_user_id: "${tl_inj}"
              captures: { tl_cons: $.data.id }
            - call: "POST /aesthetics/consultations/${tl_cons}/complete-exam"
              payload: {}
              as: Provider
              as_user_id: "${tl_inj}"
            - call: "POST /aesthetics/standing-orders"
              payload: { consultation_id: "${tl_cons}", director_provider_id: "${tl_dir}", product: "BOTOX", max_units_authorized: 30, valid_until_utc: "2026-12-01T00:00:00Z" }
              as: Provider
              as_user_id: "${tl_dir}"
              captures: { tl_so: $.data.id }
            - call: "POST /aesthetics/treatment-plans"
