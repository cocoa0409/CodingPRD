          trigger:
            - { call: "POST /youth-ministry/trips/${trip}/debrief", payload: {debrief_summary: "25 hours of service completed", debrief_actual_participant_count: 1, debrief_incident_count: 0, debrief_lessons_learned: "book rooms earlier"}, as: ProgramDirector, captures: {st: $.data.status, cnt: $.data.debrief_actual_participant_count, ts: $.data.debriefed_at} }
            - { call: "GET /youth-ministry/registrations/${reg}", as: ProgramDirector, captures: {reg_status: $.data.registration_status} }
            - { call: "GET /youth-ministry/registrations/${reg}/fundraising-account", as: Treasurer, captures: {acct_status: "$.data[0].status"} }
            - { call: "POST /youth-ministry/programs/${prog}/close", as: ProgramDirector, captures: {prog_status: $.data.status} }
          assert:
            - "e_early == ERR_TRIP_STATE_FORBIDS_ACTION (debrief before end_date + 1 day)"
            - "e_close == ERR_PROGRAM_HAS_OPEN_TRIPS (program cannot close while the trip is IN_PROGRESS)"
            - "st == DEBRIEFED and cnt == 1 and ts == 2027-06-17T00:00:00Z (report payload + clock recorded)"
            - "reg_status == COMPLETED and acct_status == CLOSED (debrief cascades)"
            - "prog_status == CLOSED — the full lifecycle is now terminal end-to-end"

  - section: endpoints
    instances:
      - name: response_envelope_success_error_and_pagination_shapes
        claim_type: side_effect_execution
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response uses the fixed envelope: success carries meta.api_request_id + meta.api_request_timestamp + response_type object/array + data; errors carry response_type error + data.error_id + data.message; lists expose limit/offset/total_count/has_more."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "GET /youth-ministry/programs/11111111-1111-4111-8111-111111111111", as: ProgramDirector, captures: {err_id: $.data.error_id, err_msg: $.data.message} }
            - { call: "GET /youth-ministry/trips", as: ProgramDirector }
          assert:
            - "create response: response_type == object, data.id present, meta.api_request_id and meta.api_request_timestamp present"
            - "error response: response_type == error, err_id == ERR_PROGRAM_NOT_FOUND, err_msg is a non-empty string, http 404"
            - "list response: response_type == array and pagination fields limit/offset/total_count/has_more all present"

