  - section: errors
    instances:
      - name: auth_identity_and_ownership_errors_are_distinct
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_UNKNOWN_DEVELOPER_IDENTITY
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_NOT_RESOURCE_OWNER
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: >-
          Five separate refusals share one request shape and must not collapse into a single
          401: absent headers, an undeclared role name, a Developer identity that is not a
          Developer row, a declared role outside the endpoint's roles list, and a well
          authenticated developer reaching for another developer's row. The ownership refusal
          is the subtle one — the caller is authentic and authorised for the endpoint, and only
          the resource's owner disqualifies it. Only the calls that keep a declared role on a
          permitted endpoint are expressible as structured calls; the header-level refusals are
          asserted as header mutations of the same baseline read.
        test_recipe:
          setup:
            - "developers D1 and D2 are registered; D1 owns application A1"
            - "the unknown id literal 00000000-0000-4000-8000-000000000000 is not any developer's id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
