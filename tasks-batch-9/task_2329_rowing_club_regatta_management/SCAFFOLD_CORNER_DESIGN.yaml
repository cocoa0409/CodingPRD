  - section: calculations
    instances:
      - name: corner_water_posture_narrow_channel_alone_forces_restricted
        claim_type: correct_result
        grounds:
          - calculations.water_posture_evaluation
          - entities.WaterConditionReading.posture
        distinguishing_aspect: "With benign wind (5.0 kt), visibility (3000 m) and temperatures, traffic_pattern == NARROW_CHANNEL alone is enough to push posture to RESTRICTED while cold_water_flag stays false."
