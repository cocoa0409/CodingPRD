        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /erp/candidates/11111111-1111-1111-1111-111111111111"
              as: TalentAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /erp/job-requisitions/11111111-1111-1111-1111-111111111111"
              as: TalentAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /erp/policy-versions/11111111-1111-1111-1111-111111111111"
              as: TalentAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /erp/campaigns/11111111-1111-1111-1111-111111111111"
              as: TalentAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /erp/referrals/11111111-1111-1111-1111-111111111111"
              as: TalentAdmin
              captures: { e5: $.data.error_id }
