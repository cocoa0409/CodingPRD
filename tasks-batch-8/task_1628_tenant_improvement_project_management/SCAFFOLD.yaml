# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Role not in the endpoint's allowed roles"
  - id: ERR_FORBIDDEN_SCOPE
    http: 403
    condition: "Entity-backed role's X-User-ID does not match the owning Tenant/Contractor of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Any path resource id does not exist (validated left-to-right)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, wrong type, invalid enum member, non-integer cents, empty lines array"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is in a state from which the requested transition does not exist (incl. terminal states)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not equal the parent entity's current version"
  - id: ERR_BUILDING_RULES_NOT_ACKNOWLEDGED
    http: 422
    condition: "Engagement approval attempted before building_rules_acknowledged == true"
  - id: ERR_INSURANCE_EXPIRED
    http: 422
    condition: "Contractor insurance_expiry_date <= current logical clock at qualify/reinstate/engagement-approve"
  - id: ERR_LIFE_SAFETY_ITEM_OPEN
    http: 422
    condition: "Occupancy certificate attempted while a LIFE_SAFETY punch item is not VERIFIED"
  - id: ERR_PUNCH_ITEMS_OPEN
    http: 422
    condition: "Occupancy certificate attempted while any punch item is not VERIFIED (and no LIFE_SAFETY item is open)"
  - id: ERR_BLOCKING_COMMENTS_OPEN
    http: 422
    condition: "Plan approval attempted with OPEN BLOCKING review comments"
  - id: ERR_SCHEDULE_OVERLAP
    http: 409
    condition: "Milestone half-open window intersects another PLANNED/CONFIRMED milestone on the same engagement"
  - id: ERR_PROPERTY_CONSTRUCTION_CAPACITY
    http: 409
    condition: "Starting construction would push overlapping CONSTRUCTION projects on the property to >= max_concurrent_construction_projects"
  - id: ERR_ACTIVE_PROJECT_EXISTS
    http: 409
    condition: "Lease already has a TIProject with status NOT IN {COMPLETED, CANCELLED}"
  - id: ERR_WORK_LETTER_ALREADY_EXECUTED
    http: 409
    condition: "Another WorkLetter of the same project is already EXECUTED"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end <= window_start, or construction_end_date <= construction_start_date"
  - id: ERR_DISBURSEMENT_PERIOD_IN_FUTURE
    http: 422
    condition: "Draw submit with period_end_date after the current logical clock"
  - id: ERR_CONSTRUCTION_WINDOW_NOT_ENDED
    http: 422
    condition: "begin-punch before construction_end_date"
  - id: ERR_MILESTONE_WINDOW_NOT_ENDED
    http: 422
    condition: "Milestone complete before window_end"
  - id: ERR_CONTRACTOR_NOT_QUALIFIED
    http: 422
    condition: "Engagement approve/reinstate while contractor qualification_status != QUALIFIED"
  - id: ERR_NO_ACTIVE_ENGAGEMENT
    http: 422
    condition: "Draw submit while the project has no ACTIVE ContractorEngagement"
  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "Phase-advance prerequisite missing (no EXECUTED work letter / no APPROVED plan / no ACTIVE engagement)"
  - id: ERR_LIEN_WAIVER_MISSING
    http: 422
    condition: "Draw approval with no VERIFIED lien waiver attached"
  - id: ERR_LIEN_WAIVER_AMOUNT_MISMATCH
    http: 422
    condition: "VERIFIED lien waiver amount_cents != draw requested_amount_cents"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Draw approver X-User-ID equals an approved ChangeOrder's approved_by_user_id on the same project"
  - id: ERR_PROJECT_NOT_OPEN
    http: 422
    condition: "Draw submit/approve or CO submit while TIProject.posture != OPEN"
  - id: ERR_APPROVAL_EXCEEDS_REQUEST
    http: 422
    condition: "approved_amount_cents > requested_amount_cents"
  - id: ERR_DRAW_EXCEEDS_REMAINING
    http: 422
    condition: "approved_amount_cents > TIProject.allowance_remaining_cents"
  - id: ERR_NO_OVERAGE_OUTSTANDING
    http: 422
    condition: "Invoice creation with no uninvoiced APPROVED change orders carrying tenant_overage_share_cents > 0"
  - id: ERR_INVOICE_ALREADY_ISSUED
    http: 422
    condition: "CO void attempted while an ISSUED or PAID invoice includes the CO"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Test-harness operator; drives the logical clock only"
    identity: "opaque"
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: []
  - name: LandlordPM
    description: "Property manager; runs the building side of the project day-to-day"
    identity: "opaque"
    exclusive_operations:
      - "Property/LeaseSpace/Tenant/Lease/Contractor registration"
      - "Lease activation; TIProject creation and phase advancement; cancellation"
      - "WorkLetter propose/execute/withdraw; plan review actions and comment resolution"
      - "Engagement create/approve/activate/suspend/reinstate/terminate/complete"
      - "Milestone confirm/cancel; lien waiver verify/reject; disbursement pay"
      - "Punch item creation; invoice draft/issue/reissue/void"
    shared_operations: ["read endpoints"]
  - name: LandlordApprover
    description: "Landlord financial approver; segregated from PM duties"
    identity: "opaque"
    exclusive_operations:
      - "ChangeOrder approve/reject/void"
      - "DisbursementRequest approve/reject/void (APPROVED void)"
    shared_operations: ["read endpoints"]
  - name: TenantRep
    description: "Tenant's authorized representative"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "WorkLetter counter/accept"
      - "PlanSubmission creation"
      - "ChangeOrder create/submit as TENANT"
      - "OverageInvoice pay/dispute"
    shared_operations: ["read endpoints scoped to own lease's project tree"]
  - name: ContractorRep
    description: "Contractor company's representative"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "Engagement acknowledge-rules"
      - "Milestone create/complete"
      - "ChangeOrder create/submit as CONTRACTOR"
      - "DisbursementRequest create/submit/void (DRAFT)"
      - "LienWaiver creation"
      - "PunchItem start/resolve"
    shared_operations: ["read endpoints scoped to own engagements and their parent project"]
  - name: BuildingEngineer
    description: "Building technical inspector; independent verification authority"
    identity: "opaque"
    exclusive_operations:
      - "PunchItem verify/reopen"
      - "PunchItem creation (inspector-logged deficiencies)"
    shared_operations: ["read endpoints"]

