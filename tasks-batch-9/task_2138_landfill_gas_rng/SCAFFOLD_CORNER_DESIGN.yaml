              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T04:00:00Z", hourly_volumes_mscf: [110.0, 110.0], methane_pct: 94.0, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
