        claim_type: cyclic
        grounds:
          - state_machines.ExaminationRequest.ADMIN_REVIEW_to_IN_ANALYSIS
          - entities.ExaminationRequest.fields.revision_round
        excluded_because:
          difficulty_instance: "non_linear_state_machine / exam_request_administrative_return_reopens_same_assignment_row"
          rationale: "That instance drives the ADMIN_REVIEW -> IN_ANALYSIS -> TECH_REVIEW -> ADMIN_REVIEW loop, asserts revision_round 1, checkout_count 2 and the four ReviewRecords, so the cyclic claim is already covered end to end."

      - name: case_two_state_axes_move_without_touching_each_other
        claim_type: parallel
        grounds:
          - state_machines.Case
          - entities.Case.fields.discovery_status
          - entities.Case.fields.workflow_status
        excluded_because:
          difficulty_instance: "non_linear_state_machine / case_workflow_and_discovery_axes_advance_independently"
          rationale: "That instance advances discovery to RECEIVED and FULFILLED while the casework axis stays put, and asserts both axes plus discovery_due_utc, which is exactly the parallel-dimension claim."

