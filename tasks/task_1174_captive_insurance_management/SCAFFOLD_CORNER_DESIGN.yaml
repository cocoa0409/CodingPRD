              payload: { filing_type: "INITIAL_FORMATION", jurisdiction: "VERMONT", supporting_documents: [{document_type: "ARTICLES", document_url: "https://docs.example.com/a.pdf", uploaded_at: "2026-01-15T00:00:00Z"}] }
              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "GET /api/captives/${captive_id}"
              as: CaptiveManager
              captures: { captive_ver_current: $.data.version }
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "OCC Prog 1", line_of_business: "GENERAL_LIABILITY", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver_current}" }
              as: Underwriter
              captures: { program1_id: $.data.id }
          trigger:
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "OCC Prog 2", line_of_business: "WORKERS_COMP", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, expected_captive_version: "${captive_ver_current}" }
              as: Underwriter
          assert:
            - "Response status == 412"
            - "Response error_id == ERR_STALE_VERSION (version advanced after first program creation)"

      - name: cascading_side_effects_captive_suspend
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CaptiveEntity.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Captive suspension cascades: programs -> RUN_OFF, fronting -> TERMINATED.
          This is already covered by §1.8 transitive_cascade instance.
        excluded_because:
          difficulty_instance: transitive_cascade / captive_suspension_cascades_to_programs_and_fronting
          rationale: "Asserted as the cascade path of the named §1.8 instance."

