      - name: contract_fulfillment_and_billing_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.RentalContract.shape
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: contract_billing_and_fulfillment_dimensions_advance_independently
          rationale: "That §1.8 instance is exactly this claim: it drives billing UNBILLED -> INVOICED -> REBILL_REQUIRED -> INVOICED -> SETTLED while fulfillment sits on ACTIVE, then demobilizes and checks the join writing CLOSED. Nothing about the parallel shape is left over."

