        distinguishing_aspect: "Reinstate from SUSPENDED_CLASSIFICATION is CompanyAdmin-only even though RouteOpsManager may reinstate service suspensions: the same endpoint returns 403 ERR_REINSTATE_FORBIDDEN based on the agreement's suspension sub-state."
        test_recipe:
